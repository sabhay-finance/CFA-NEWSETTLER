 ago"}, {"title": "Defense tech investment boom sparks bubble warning as private equity pours in", "full_content": "Private equity firms are pouring billions into defense technology as rising military spending and geopolitical tensions fuel an investment boom.\n\nTraditional buyout investors are increasingly backing younger, high-growth firms in the sector, according to PitchBook data, with private equity growth investments in defense reaching $4 billion in the first nine months of 2026, up from $500 million in 2024.\n\nAs defense tech companies mature, analysts say private equity, debt and other forms of financing are expected to become more important in bridging the gap between innovation and industrial-scale production, as venture capital alone may not be enough to finance companies' expansion.\n\nIt comes as geopolitical tensions, wars, and countries' efforts to strengthen military capabilities are creating opportunities for companies developing everything from autonomous drones to missile defense systems and satellite technology.\n\nA survey of 250 senior decision-makers at U.K. defense companies by law firm White & Case found that 97% expected their businesses to seek significant external funding over the next 12 months.\n\n\"Private capital is now playing a critical role in the financing of defence technology companies,\" Daniel Turgel, a partner at White & Case, told CNBC.\n\nPrivate equity and venture capital firms, sovereign wealth funds and family offices were all looking to invest more in the sector, marking a significant change from just a few years ago, Turgel said, adding that many investors were previously reluctant or restricted from doing so.\n\nThe growth of private equity allocations to defense technology also comes amid a surge in venture capital investment in defense technology. Startups across NATO and allied countries raised $27.1 billion through September, nearly double the total for all of 2025, according to an October report from Dealroom now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "26 Oct 2026, 11:23 AM IST", "pub_date_relative": "36m ago"}, {"title": "IEA chief says energy markets won\u2019t return to pre-Iran war levels", "full_content": "", "source": "Investing.com News", "pub_date_str": "26 Oct 2026, 11:20 AM IST", "pub_date_relative": "40m ago"}, {"title": "Stock futures climb as traders try to recover from the S&P 500's losing week: Live updates", "full_content": "Stock futures rose early Monday as traders look toward a slew of central bank decisions this week.\n\nS&P 500 futures were up 0.25% while Dow Jones Industrial Average futures added 155 points, or 0.31%. Nasdaq-100 futures gained 0.29%.\n\nThe U.S. Federal Reserve, the European Central Bank and the Bank of Japan will announce their rate decisions on Wednesday, Thursday and Friday, respectively.\n\nAsian markets were mixed. Japan's benchmark Nikkei 225 lost 0.1%, but the broad-based Topix was up 0.54%. South Korea's Kospi declined 0.21%, while the the small-cap Kosdaq saw a larger loss, dropping 1.67%. Hong Kong's Hang Seng Index gained 0.66%, and mainland China's CSI 300 was down 0.54%.\n\nOil prices were lower on Monday in Asia, with Brent futures falling 2.20% to trade at $114.52 a barrel while U.S. West Texas Intermediate slid 2.24% to $101.03 per barrel.\n\nBrent crude had hit its highest level since April last Friday amid news reports that the U.S. and Israel could be planning to launch strikes on Iran after the midterm elections.\n\nHigher oil prices and a broadening sell-off that hit many market sectors dragged the three major averages to losses on Friday. The Dow fell more than 650 points, while the S&P 500 lost 0.5%. The Nasdaq Composite dropped 0.2%\n\nThe sell-off also dragged the S&P 500 and the Nasdaq to back-to-back weekly losses.", "source": "CNBC Top News", "pub_date_str": "26 Oct 2026, 11:20 AM IST", "pub_date_relative": "40m ago"}, {"title": "$7.7 trillion AI bet: Can hyperscalers earn enough to justify the spending?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a $7.7 trillion AI bet: Can hyperscalers earn enough to justify the spending? The Economic Times daily newspaper is available online now. Read Today's Paper $7.7 trillion AI bet: Can hyperscalers earn enough to justify the spending? SECTIONS $7.7 trillion AI bet: Can hyperscalers earn enough to justify the spending? By Nikhil Agarwal , ETMarkets.com Last Updated: Oct 26, 2026, 11:19:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Six major hyperscalers are projected to spend $7.7 trillion on AI between 2026 and 2030, but generating adequate returns will be a challenge. UBS estimates they need $1 trillion in additional earnings before interest and taxes by 2031. The key questions are whether AI boosts productivity and companies can monetise those gains.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "26 Oct 2026, 11:19 AM IST", "pub_date_relative": "40m ago"}, {"title": "HDFC Bank launches electric car loan with separate battery and vehicle repayment tenures \u2013 key features", "full_content": "HDFC Bank has introduced a new electric car loan that lets borrowers finance the vehicle\u2019s body and battery separately, giving them more flexibility and clarity in managing their equated monthly instalments (EMIs).\n\nThe country\u2019s largest private-sector lender is offering the Flexi (Green) electric car loan to address the high upfront cost of electric vehicles (EVs), largely driven by expensive batteries.\n\nUnder the new structure, borrowers can choose separate repayment periods for the body and the battery. The battery component can be repaid over a longer tenure, allowing customers to tailor their overall EMI outgo .\n\nAccording to the bank, this can keep the battery-related EMI comparable to the running cost of a conventional internal combustion engine (ICE) vehicle. It also fits with emerging battery subscription models, which aim to reduce the upfront cost of buying an EV.\n\nArvind Vohra, Group Head, Retail Assets and Rural Banking at HDFC Bank, said the product is meant to support India\u2019s growing electric mobility market and make EV ownership more cost-effective and convenient.\n\nHDFC Bank expects electric passenger cars to account for 15-20% of the market by 2030, up from about 7% now. Government incentives, better battery technology and a wider range of models are expected to support this shift. The government\u2019s goal of 30% electric mobility by 2030 could also accelerate the transition to cleaner transport.\n\nThe new loan structure permits prospective EV buyers another financing option. Still, customers should compare the total borrowing cost, monthly repayment burden, and battery-related terms with those of conventional car loans, as well as their long-term financial objectives, before deciding whether the loan offering suits their budget.\n\nIf you have doubts, consult a certified financial advisor so the loan stays aligned with your long-term goals.", "source": "LiveMint Money", " vesting.com News", "pub_date_str": "26 Oct 2026, 11:13 AM IST", "pub_date_relative": "46m ago"}, {"title": "Oil, US Treasuries prop up Indian bonds", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Bonds \u203a Oil, US Treasuries prop up Indian bonds Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Oil, US Treasuries prop up Indian bonds SECTIONS Oil, US Treasuries prop up Indian bonds Reuters Last Updated: Oct 26, 2026, 11:12:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Indian government bonds increased in early trading as oil prices declined, following a previous rally. The Brent crude price slipped significantly after hitting a six-month high last week, which impacted the debt market. Foreign investors have sold a substantial amount of Indian government debt since August, contributing to a prolonged rise in benchmark yields. Concerns over inflation and the Reserve Bank of India's rate decisions are influencing market sentiments.\n\nIndian government bonds increased in early trading as oil prices declined, following a previous rally. The Brent crude price slipped significantly after hitting a six-month high last week, which impacted the debt market. Foreign investors have sold a substantial amount of Indian government debt since August, contributing to a prolonged rise in benchmark yields. Concerns over inflation and the Reserve Bank of India's rate decisions are influencing market sentiments.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "26 Oct 2026, 11:12 AM IST", "pub_date_relative": "47m ago"}, {"title": "China\u2019s Communist Party begins fifth plenum in Beijing", "full_content": "", "source": "Investing.com News", "pub_date_str": "26 Oct 2026, 11:05 AM IST", "pub_date_relative": "54m ago"}, {"title": "Tonbo Imaging India shares up 17%, jumps 90% from IPO price band | Buy, sell or hold?", "full_content": "Tonbo Imaging India shares jumped over 17% on Monday, 26 October, extending their strong post-listing rally. The stock made a stellar debut on 23 October, listing at \u20b9 1,160 on the NSE, a 65.71% premium over its IPO price of \u20b9 700 per share. On the BSE, it debuted at \u20b9 1,162, marking a 66% premium.\n\nThe stock has now climbed around 90% above its issue price, reflecting strong investor interest following its market debut. After listing, Tonbo Imaging India's market capitalisation stood at around \u20b9 7,111 crore on the BSE.\n\nAccording to BSE data, PRB Securities Pvt. Ltd. bought 3,71,195 shares at \u20b9 1,117.10 apiece and sold 26,537 shares at \u20b9 1,081.90 on 23 October. Meanwhile, Irage Broking Services LLP bought 5,09,569 shares at \u20b9 1,125.95 apiece and sold 3,10,631 shares at \u20b9 1,099.43.\n\nMahesh M. Ojha, Vice President of Research and Business Development at Kantilal Chhaganlal Securities Pvt. Ltd., said investors who received an allotment in the IPO could consider booking partial profits on listing gains and holding the remaining shares for the long term, given strong product demand, a favourable sector outlook and the company's long-term growth potential.\n\nAnother analyst said investors who secured an IPO allotment could hold the shares for the long term. Those who missed the issue could consider entering on any post-listing correction.\n\nThe initial public offering (IPO) of defence electronics maker Tonbo Imaging India Ltd was subscribed 135.90 times on the final day of bidding, driven by strong demand across investor categories, according to NSE data.\n\nThe \u20b9 852.18-crore IPO received bids for 1,15,87,19,247 shares against 85,26,033 shares on offer. Qualified institutional buyers (QIBs) led the demand, with their portion subscribed 293.56 times, while the non-institutional investor (NII) category was subscribed 170.94 times.", "source": "LiveMint Markets", "pub_date_str": "26 Oct 2026, 10:59 AM IST", "pub_date_relative": "1h ago"}, {"title": "Big Tech Earnings Week: Will AI spending pay off?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News Powered By Big Tech Earnings Week: Will AI spending pay off? Written by Anupam Nagar , ETMarkets.com | Oct 26, 2026, 11:29:15 AM IST 1 / 10 Big Tech faces its biggest earnings test Alphabet, Microsoft and Amazon are set to report quarterly results in a crucial week for the artificial intelligence trade. Investors will assess whether surging AI demand can justify the enormous investments in data centres, cloud infrastructure and computing capacity. Sources: CNBC, Yahoo Finance, Forbes)\n\nMicrosoft reports on Wednesday, October 28. Investors will look for sustained growth in Azure, its cloud-computing business, and evidence that AI services are translating into revenue. Analysts will also scrutinise margins as the company expands its AI infrastructure.\n\nGoogle\u2019s parent company reports on October 28. The key questions are whether its core Search advertising business remains resilient as AI-powered search expands, and whether Google Cloud can sustain its rapid growth. Investors will also watch the impact of higher infrastructure spending on profitability.\n\nAmazon reports on Thursday, October 29. AWS growth, operating margins and capital expenditure will be central to the results. The company\u2019s substantial investment in data centres and AI capacity has raised questions about how quickly spending will translate into sustainable cash flow.\n\nThe three companies are investing heavily in computing power, chips, data centres and electricity capacity. The spending reflects strong demand for AI services, but it also increases depreciation and financing pressures. Investors want clearer evidence that returns will keep pace with the cost of expansion.\n\nRecent quarterly results showed strong growth across the three cloud businesses.", "source": "Economic Times Markets", "pub_date_str": "26 Oct 2026, 10:54 AM IST", "pub_date_relative": "1h ago"}, {"title": "Home Loan Planning: Why Does The Down Payment Matter More Than The Loan?", "full_content": "A smart down payment can reduce your home loan EMI, save lakhs in interest, and ease financial stress. Learn how to balance your upfront payment with your savings.", "source": "NDTV Profit", "pub_date_str": "26 Oct 2026, 10:53 AM IST", "pub_date_relative": "1h ago"}, {"title": "L&T Technology Services Shares Rise Over 3% After Five-Year Nokia Deal", "full_content": "L&T Technology Services announced a five-year collaboration with Nokia to support engineering and research activities in India. The stock rallied as the partnership focuses on 5G networks, AI infrastructure, and next-generation computing.", "source": "NDTV Profit", "pub_date_str": "26 Oct 2026, 10:53 AM IST", "pub_date_relative": "1h ago"}, {"title": "Amitabh Bachchan Greets Fans At Jalsa Amid Recent Bomb Threat Email, Abhishek Bachchan Joins Him", "full_content": "Amitabh Bachchan continued his Sunday ritual of meeting fans outside his Juhu residence, Jalsa, despite being advised to rest and a recent bomb threat.", "source": "NDTV Profit", "pub_date_str": "26 Oct 2026, 10:53 AM IST", "pub_date_relative": "1h ago"}, {"title": "\u2018Ticking time bomb\u2019: The world's pension funds face an ageing crisis", "full_content": "The world's pension systems are confronting a demographic crisis as longer lifespans and dwindling birth rates threaten to stretch retirement finances, raising questions about their ability to sustain payouts for future generations.\n\nPension offerings generally fall into two categories: defined-benefit plans, which promise retirees a predetermined income, and defined-contribution plans, where payouts depend on accumulated savings and investment returns.\n\nAgeing poses different challenges for the two systems: defined-benefit schemes face mounting liabilities as retirees live longer, while defined-contribution members risk outliving their savings, placing greater pressure on funds' investment performance.\n\nThe problem is \"huge, and it's gotten more pronounced over time,\u201d said Sebastien Betermier, executive director at the International Centre for Pension Management, noting that some pension funds have members who have been retired for nearly half a century, aged aged 107 or 108.\n\n\"The higher the longevity, the more years the pension funds have to cover, and so that immediately comes in as an additional liability,\" he said. \"Think about the cost that it imposes actually on the next generation \u2026 it is a ticking time bomb,\" Betermier told CNBC.\n\nThe scale of the challenge is laid bare in the 2026 Marsh CFA Institute Global Pension Index, or MCGPI, report published Tuesday last week. Of the 55 pension systems covered by the index, 43 have fertility rates below the replacement level of 2.1 children per woman, while 23 have rates below 1.5.\n\nMeanwhile, life expectancy at age 65 in more developed regions has increased by 50.9% since 1950 to about 20 additional years, meaning retirement benefits must now last considerably longer. The number of potential workers supporting older people is also set to decline sharply.\n\n\u201cThe funding of future pensions and aged care both become more critical as the ratio of workers to retirees continues to decline,\u201d the MCGPI report stated.", "source": "CNBC Top News", "pub_date_str": "26 Oct 2026, 10:52 AM IST", "pub_date_relative": "1h ago"}, {"title": "IndusInd Bank Shares: IDBI Capital Stays Bullish After Strong Q2 Performance; Check Target Price", "full_content": "Management targets growth in line with the market and remains on track for 1% exit RoA in FY27, with a medium-term ambition of 1.751.80%, adds the brokerage.", "source": "NDTV Profit", "pub_date_str": "26 Oct 2026, 10:52 AM IST", "pub_date_relative": "1h ago"}, {"title": "Rahul Gandhi's Convoy Collide In Major Accident On Purvanchal Expressway", "full_content": "Several individuals were injured after five vehicles and an ambulance in Rahul Gandhi's convoy collided on the Purvanchal Expressway in Uttar Pradesh.", "source": "NDTV Profit", "pub_date_str": "26 Oct 2026, 10:50 AM IST", "pub_date_relative": "1h ago"}, {"title": "Oil slides over 2% as traders weigh Saudi attack risks, demand destruction", "full_content": "U.S. crude oil fell over 2% on Monday as investors weighed the threat of further attacks on Saudi Arabian energy infrastructure against concerns that elevated prices could eventually erode demand.\n\nU.S. West Texas Intermediate futures slid 2.19% to $101 a barrel, while Brent crude futures declined 1.89% to $114.51 a barrel.\n\nOil prices year-to-date The pullback followed a sharp rally on Friday after attacks by Yemen's Houthi militants on Saudi Arabia reignited fears of disruptions to global energy supplies.\n\nTensions remained elevated over the weekend as the Houthis said they had targeted Saudi Arabia's main airport in Riyadh and oil facilities on Saturday. Saudi authorities said Sunday that they had intercepted additional missiles and drones.\n\nThe kingdom partially resumed operations at its main airport on Sunday despite damage from earlier attacks, even as the Houthis threatened further strikes.\n\nThe continued hostilities have heightened concerns about the vulnerability of Saudi Arabia's energy infrastructure, with traders increasingly focused on the risk of a major disruption to production, refining or export facilities.\n\nSpeaking to CNBC, Michael Alfaro, chief investment officer at Gallo Partners, estimated that geopolitical uncertainty had already added roughly $20 a barrel to oil prices.\n\nA substantial strike on Saudi Arabia's East-West pipeline or additional refining infrastructure could send prices sharply higher, he added, but further gains could eventually undermine consumption.", "source": "CNBC Top News", "pub_date_str": "26 Oct 2026, 10:48 AM IST", "pub_date_relative": "1h ago"}, {"title": "Brazil Stocks Dive As President Lula Wins Re-Election - Investor's Business Daily", "full_content": "Brazil Stocks Dive As President Lula Wins Re-Election Investor's Business Daily Brazil\u2019s Surprise Election Outcome Set to Batter Stocks, Real WSJ EM Stocks Fall Before Key Earnings, Brazil in Focus as Lula Wins Bloomberg.com 3 Brazilian Export Stocks With Overseas Sales Investors Should Watch Yahoo Finance Brazil Election Risk Has Magazine Luiza Stock And Brazil Logistics Shares In Focus Simply Wall Street", "source": "Google News Business", "pub_date_str": "26 Oct 2026, 10:46 AM IST", "pub_date_relative": "1h ago"}, {"title": "Bharat Coking Coal shares rally 5% after Q2 profit turnaround; revenue jumps 39% YoY", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Bharat Coking Coal shares rally 5% after Q2 profit turnaround; revenue jumps 39% YoY Bharat Coking Coal Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Bharat Coking Coal shares rally 5% after Q2 profit turnaround; revenue jumps 39% YoY SECTIONS Bharat Coking Coal shares rally 5% after Q2 profit turnaround; revenue jumps 39% YoY By Ritesh Presswala , ETMarkets.com Last Updated: Oct 26, 2026, 10:38:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Bharat Coking Coal shares sharply on Monday after the Coal India subsidiary reported a turnaround to profit in Q2 FY27, with net profit at Rs 123.7 crore and revenue up 39% year-on-year to Rs 4,412.58 crore. However, first-half production declined, while technical indicators pointed to continued weakness in the stock.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "26 Oct 2026, 10:38 AM IST", "pub_date_relative": "1h ago"}, {"title": "Infosys shares crash 4% - Should investors buy, sell, hold this IT stock after Q2 results? Experts decode | Target price", "full_content": "Infosys shares crashed nearly 4% in morning trade on the BSE on Monday, 26 October, after the IT major reported its September quarter (Q2FY27) results. Infosys share price opened at \u20b9 1,119.05 against its previous close of \u20b9 1,154.50 and declined 3.9% to an intraday low of \u20b9 1,109.70.\n\nInfosys reported a net profit of \u20b9 7,823 crore in Q2FY27, up 6.23% year--on-year. The company\u2019s net revenue from operations stood at \u20b9 49,244 crore in Q2FY27 against \u20b9 44,490 crore reported in the year-ago period.\n\nRevenue growth stood at 1.2% on a sequential basis (in constant currency terms), whereas 1.5% on an annual basis (in CC terms).\n\nInfosys shares have been under pressure for the last several years. BSE data shows, the stock is down 33% over the last five years, compared to a 19% gain in the Sensex.\n\nOver the last three years, the stock is down 16% compared to a 16% gain in the equity benchmark Sensex.\n\nYear-to-date, the stock is down 30%, while the Sensex has lost 14%.\n\nBrokerage firm ICICI Securities has maintained a \"reduce\" call on the stock but increased the target price to \u20b9 1,030 from \u20b9 940 earlier.\n\nICICI Securities highlighted that Infosys cut its organic revenue guidance to -0.2% at mid-point (from earlier 0.55%) YoY CC for FY27 due to softer-than-expected volumes in the first half of FY27, pricing pressure from higher competitive intensity, and subdued discretionary spends.", "source": "LiveMint Markets", "pub_date_str": "26 Oct 2026, 10:35 AM IST", "pub_date_relative": "1h ago"}, {"title": "Frank Elderson: Taking action for nature \u2013 investing in economic resilience and prosperity", "full_content": "It is a pleasure to open the Finance and Biodiversity Day at COP17.\n\nWe have talked about the need for action for long enough. Now we need to act.\n\nFour years ago, the international community adopted the Kunming-Montreal Global Biodiversity Framework, setting out a pathway to living in harmony with nature by 2050.\n\nThe destination is set. The path is clear. But progress has remained limited. And nature has not stood still. It has continued to deteriorate. So we need to accelerate.\n\nTangible progress requires a shift from targets to implementation, from awareness to engagement, from ambition to investment.\n\nCOP17 must help us accelerate the journey. And finance has a central role to play. That should not come as a surprise: without investment, there can be no transition.\n\nBut we need to get the economics right. Protecting and restoring nature is not simply spending. It is investment: investment in the natural capital on which our economies depend, investment in resilience, and investment in our future prosperity.\n\nLet me start with a fundamental question: why is nature so important to the economy?", "source": "ECB Press", "pub_date_str": "26 Oct 2026, 10:30 AM IST", "pub_date_relative": "1h ago"}, {"title": "Global Market: Japan's Nikkei falls for third straight session as chip stocks slide", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Global Market: Japan's Nikkei falls for third straight session as chip stocks slide Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market: Japan's Nikkei falls for third straight session as chip stocks slide SECTIONS Global Market: Japan's Nikkei falls for third straight session as chip stocks slide By Anupam Nagar , ETMarkets.com Last Updated: Oct 26, 2026, 10:29:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Japan's Nikkei share average slipped for a third straight session on Monday, primarily due to declines in chip-related stocks. The Nikkei 225 saw a decrease of 0.43%, contrasted by a 0.48% rise in the broader Topix index. Despite a surge in energy stocks driven by rising oil prices, concerns over global market fluctuations left investors wary.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "26 Oct 2026, 10:29 AM IST", "pub_date_relative": "1h ago"}, {"title": "Reliance shares: Why is it wise to buy RIL shares amid a falling stock market \u2014 Explained with 3 reasons; target price", "full_content": "Stocks to buy today | Stock market today | Reliance share price target: Following crude oil prices and the US bond yield remaining at the elevated levels, the key benchmark indices of the Indian stock market opened lower for the fifth straight session. The Nifty 50 index opened lower at 22,524 and touched an intraday low of 22,387 within a few minutes of the Opening Bell on Monday. The BSE Sensex opened downside at 72,990 and touched an intraday low of 72,514. However, both indices recovered sharply following the bottom fishing. This fall, during the early morning session, Reliance Industries shares touched an intraday low of \u20b9 1,174.50 per share on the NSE. However, the Nifty and Sensex heavyweights soon came into the bulls' sights and turned green.\n\nAccording to stock market experts, shares of Reliance Industries Ltd (RIL) are under pressure due to weak trends on Dalal Street. They said that the company's fundamentals are very strong, and amid the ongoing Middle East crisis and soaring crude oil prices, there is a need for top-quality oil refiners, and RIL fits this category. The US Secretary of State Marco Rubio's meeting with Mukesh Ambani should be seen from this angle. They said that Reliance's Jio Platforms value unlock will also benefit RIL, as it holds around two-thirds of the company's share capital. Pointing to the third reason for buying Reliance shares amid the current fall in the Indian stock market, experts said that the US-Iran war has fueled crude oil prices, but diesel prices have surged even more. RIL is a diesel exporter and is expected to reap this benefit as well.\n\nPointing towards the US Secretary of State Marco Rubio meeting Mukesh Ambani, Avinash Gorakshkar, Founder of Avinash Mentor Research, said, \u201cThough it is no official confirmation, but Marco Rubio meeting Mukesh Ambani is expected to focus on the refining business, as a good number of refiners have gone out of business in the Middle East due to the prolonged US-Iran war.", "source": "LiveMint Markets", "pub_date_str": "26 Oct 2026, 10:27 AM IST", "pub_date_relative": "1h ago"}, {"title": "SoftBank reportedly plans $50 billion tech investment in aspiring 'AI nation' Malaysia", "full_content": "SoftBank Group plans to make $50 billion of investments in Malaysia, Prime Minister Anwar Ibrahim said, according to a Bloomberg report.\n\nAnwar said Saturday that Son had identified locations in Kuching, Sarawak, and peninsular Malaysia for the planned investments following a video conference between the two earlier in the week, the report said .\n\nThe country's prime minister said the planned investments would focus on artificial intelligence, new technologies and data centers, according to the report.\n\nThe planned investment comes as Malaysia seeks to become an \"AI nation \" by 2030, with the government launching a national AI action plan earlier this year to strengthen the country's AI capabilities and infrastructure.\n\nEarlier this month, SoftBank signed a framework agreement with Singapore-based Grab and Malaysia's Petroleum Sarawak Berhad to explore AI and digital infrastructure development in Sarawak, including AI computing services and advanced technologies.\n\nSoftBank is not alone in pursuing technology investments in Malaysia. Google announced a $2 billion investment in 2024 to build its first data center and cloud region in the country, while Amazon Web Services said it planned to invest $6.2 billion through 2038. Microsoft also announced a $2.2 billion investment in cloud and AI infrastructure and other digital initiatives.\n\nThe country recorded 385.7 billion ringgit ($94 billion) in data center-related investments between 2021 and the first half of 2026, according to the Malaysian Investment Development Authority.\n\nSoftBank did not immediately respond to CNBC's request for comment.", "source": "CNBC World Economy", "pub_date_str": "26 Oct 2026, 10:26 AM IST", "pub_date_relative": "1h ago"}, {"title": "5 global market themes to watch out for this week", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News Powered By 5 global market themes to watch out for this week Written by Anupam Nagar , ETMarkets.com | Oct 26, 2026, 10:50:19 AM IST 1 / 5 Global markets face a pivotal week Global markets brace for a packed week of central bank decisions, mega-cap tech earnings, and major political developments. Investors will assess the Federal Reserve\u2019s policy outlook, the sustainability of the artificial intelligence (AI) rally, Britain\u2019s budget plans and elections in Israel and Brazil. China\u2019s leadership meeting will also draw attention amid trade tensions and weak domestic demand. (Source: Reuters)\n\nThe Federal Reserve, European Central Bank and Bank of Japan are set to announce monetary policy decisions this week, with investors closely watching their guidance on inflation and interest rates. The Bank of Canada and Reserve Bank of New Zealand are also scheduled to meet, with markets anticipating rate hikes. Elevated oil prices could complicate the inflation outlook and influence policymakers\u2019 decisions.\n\nQuarterly results from Alphabet, Microsoft and Amazon will be a key test for the AI-driven stock market rally. Investors will scrutinise revenue growth, earnings performance and capital expenditure plans, particularly spending on data centres and AI infrastructure. With roughly one-third of S&P 500 companies due to report, the results could determine whether strong corporate earnings can sustain elevated equity valuations.\n\nBritain\u2019s Finance Minister John Healey faces the challenge of providing relief to households grappling with higher energy costs while maintaining fiscal discipline and investor confidence in government bonds.", "source": "Economic Times Markets", "pub_date_str": "26 Oct 2026, 10:25 AM IST", "pub_date_relative": "1h ago"}, {"title": "US stocks face crucial test as AI earnings, Fed meeting loom", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a US stocks face crucial test as AI earnings, Fed meeting loom Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US stocks face crucial test as AI earnings, Fed meeting loom SECTIONS US stocks face crucial test as AI earnings, Fed meeting loom By Anupam Nagar , ETMarkets.com Last Updated: Oct 26, 2026, 10:24:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis US stocks face a crucial week as earnings from Alphabet, Microsoft and Amazon coincide with the Federal Reserve\u2019s policy decision. Investors will assess whether massive AI investments can deliver sustainable returns, while the Fed\u2019s guidance on interest rates and uncertainty surrounding the November midterm elections could shape market sentiment and volatility.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "26 Oct 2026, 10:24 AM IST", "pub_date_relative": "1h ago"}, {"title": "DA, wage hike: 4,000 MCD workers to get \u20b918,000 salary, dearness allowance under \u2018equal pay for equal work\u2019", "full_content": "DA news, wage hike: As many as 4,000 public health workers employed with the Delhi Municipal Corporation ( MCD ) are set to see an increase in their wages and receive dearness allowance, officials in the national capital announced.\n\nThe pay revision, which was made public at an event on Friday by Delhi CM Rekha Gupta , will cost the exchequer \u20b9 52 crore, PTI reported.\n\nAccording to Wahi, the proposal for the wage increase and DA had been announced in the previous budget and was brought before the chief minister for approval.\n\nCM Gupta said the implementation recognises the contribution of employees who had worked for decades in public health. She added that the government had a responsibility to address their welfare. \u201cIt is our duty to care for the thousands of employees who serve Delhi,\u201d she said, according to a statement issued by the mayor's office.\n\nThe pay revision comes amid the MCD's efforts to address employee-related issues, with the mayor also announcing the recruitment of 2,500 sanitation workers ahead of Diwali to improve cleanliness in the city and its markets, the report added.\n\nEarlier, Gupta directed the MCD to launch night-time cleaning drives in major markets and residential colonies, amid complaints about garbage accumulation and delays in waste collection across parts of the capital.\n\nThe order aims to improve cleanliness across Delhi, when markets and public spaces typically see increased footfall during the festive rush.", "source": "LiveMint Money", "pub_date_str": "26 Oct 2026, 10:22 AM IST", "pub_date_relative": "1h ago"}, {"title": "Sensex rises 200 pts, Nifty above 22,600 as market snaps 4-day losing streak. Is the relief rally sustainable?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Sensex rises 200 pts, Nifty above 22,600 as market snaps 4-day losing streak. Is the relief rally sustainable? Kotak Mahindra Bank Share Price Axis Bank Share Price Federal Bank Share Price IndusInd Bank Share Price IDFC First Bank Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Sensex rises 200 pts, Nifty above 22,600 as market snaps 4-day losing streak. Is the relief rally sustainable? SECTIONS Sensex rises 200 pts, Nifty above 22,600 as market snaps 4-day losing streak. Is the relief rally sustainable? By Debaroti Adhikary , ETMarkets.com Last Updated: Oct 26, 2026, 10:26:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Indian benchmark indices staged a sharp recovery from early losses, supported by gains in metal, pharmaceutical and select banking stocks. Despite improving market breadth, analysts remained cautious amid elevated crude oil prices, rising volatility and continued weakness in the broader market.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nif r fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "26 Oct 2026, 10:19 AM IST", "pub_date_relative": "1h ago"}, {"title": "Stock Market Today: Nifty, Sensex Erase Opening Losses; Market Breadth Tilts In Favour Of Buyers", "full_content": "Market breadth improves as Nifty 50 rises above 22,600 and Sensex gains 149 points after a weak start", "source": "NDTV Profit", "pub_date_str": "26 Oct 2026, 10:18 AM IST", "pub_date_relative": "1h ago"}, {"title": "Tata Motors Has A 20% Revenue Cushion Against CV Downturns. Can It Grow It?", "full_content": "Tata Motors CEO Girish Wagh said the segment is a clear focus area, laid out at the investor day, and works as a natural hedge against the cyclicality the CV industry generally faces.", "source": "NDTV Profit", "pub_date_str": "26 Oct 2026, 10:17 AM IST", "pub_date_relative": "1h ago"}, {"title": "Apollo Micro Systems share price jumps 10% after Q2 results; stock up 44% in 2026 \u2014 check resistance, support levels", "full_content": "Apollo Micro Systems shares jumped nearly 10% on Monday, 26 October, after the defence electronics company reported its Q2 and H1 FY27 results, posting strong year-on-year growth in revenue, EBITDA and profit after tax (PAT).\n\nThe company reported revenue of \u20b9 388.15 crore in Q2 FY27, up 72.3% from a year earlier. EBITDA rose 87.8% to \u20b9 111.18 crore, while PAT increased 53.7% to \u20b9 46.15 crore.\n\nFor the first half of FY27, revenue grew 78.2% year-on-year to \u20b9 639.44 crore. EBITDA rose 64.7% to \u20b9 164.91 crore, while PAT increased 49.6% to \u20b9 71.37 crore.\n\nApollo Micro Systems also reported an all-time-high consolidated order book of \u20b9 1,765 crore as of 30 September 2026, underscoring its business pipeline.\n\nBaddam Karunakar Reddy, Managing Director of Apollo Micro Systems, said the company's best-ever Q2 performance reflected strong execution, resilience and a focus on key priorities. He added that the company would accelerate execution, strengthen its capabilities and respond to the evolving needs of the defence sector, while supporting national defence preparedness.\n\nIDL Explosives Ltd, a group company of Apollo Micro Systems Ltd, has commissioned a bulk explosives silo unit near Asansol in West Bengal, with a capacity of 9,000 metric tonnes.\n\nSpread across 8.4 acres, the Bolkunda Silo Unit was inaugurated on 22 October, the company said in an exchange filing.\n\nThe facility will supply site-mixed bulk explosives to mining operations of Eastern Coalfields Ltd, Central Coalfields Ltd and other customers in the region.", "source": "LiveMint Markets", "pub_date_str": "26 Oct 2026, 10:15 AM IST", "pub_date_relative": "1h ago"}, {"title": "Small finance banks shares: AU and Ujjivan stocks crash 6% - What should investors do? Buy or sell? Target price, upside", "full_content": "Small finance banks shares : AU Small Finance Bank and Ujjivan Small Finance Bank shares plunged over 6% in Monday's trading session amid weak sentiment in the Indian stock market.\n\nAU Small Finance Bank share price opened at \u20b9 884 per share today, as compared to the previous close of \u20b9 932.90 on Friday and touched an intraday low of \u20b9 845.40. Meanwhile, Ujjivan Small Finance Bank share price opened at \u20b9 57.60 on NSE today, as compared to the previous close of \u20b9 58.10 last week. The banking stock touched an intraday low of \u20b9 54.44 today.\n\nBoth small finance stocks fell sharply after Sensex and Nifty 50 dropped in early trade on Monday.\n\nAU Small Finance Bank reported a 53% year-on-year increase in net profit to \u20b9 858 crore for the second quarter ended September 30, 2026, supported by higher interest income. The bank had recorded a net profit of \u20b9 561 crore in the corresponding quarter of the previous financial year.\n\nThe lender\u2019s total income rose to \u20b9 6,382 crore in the September quarter, compared with \u20b9 5,224 crore in the year-ago period, according to a regulatory filing.\n\nInterest income increased to \u20b9 5,612 crore during the quarter under review from \u20b9 4,511 crore in the same quarter last year.\n\nAU Small Finance Bank\u2019s net interest income (NII) rose 32% year-on-year to \u20b9 2,820 crore in the July-September quarter, compared with \u20b9 2,144 crore in the corresponding quarter of the previous year.\n\n[Ujjivan Small Finance Bank](https://scanx.trade/company/ujjivan-small-finance-bank-ltd) reported its highest-ever quarterly profit after tax (PAT) of \u20b9 365 crore in Q2 FY27, with return on assets (ROA) improving to 2.4% from 2.2% in the preceding quarter.", "source": "LiveMint Markets", "pub_date_str": "26 Oct 2026, 10:13 AM IST", "pub_date_relative": "1h ago"}, {"title": "Symbiotec Pharmalab Gets Motilal Oswal's 'Buy' Initiation; Check Target Price", "full_content": "Symbiotec is already on a path to provide chemistry- and fermentation-based capabilities and capacity as a contract development manufacturing organicsation platform in precision fermentation, industrial biotechnology, and biologics, targeting a total addressable market of $50 billion, believes the brokerage.", "source": "NDTV Profit", "pub_date_str": "26 Oct 2026, 10:12 AM IST", "pub_date_relative": "1h ago"}, {"title": "Holcim lifts guidance again on strong demand", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Bus  prices after Q2 results. Why do they still say \u2018Buy\u2019?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Shriram Finance shares crash 6% as Jefferies, Citi, and other brokerages slash target prices after Q2 results. Why do they still say \u2018Buy\u2019? The Economic Times daily newspaper is available online now. Read Today's Paper Shriram Finance shares crash 6% as Jefferies, Citi, and other brokerages slash target prices after Q2 results. Why do they still say \u2018Buy\u2019? SECTIONS Shriram Finance shares crash 6% as Jefferies, Citi, and other brokerages slash target prices after Q2 results. Why do they still say \u2018Buy\u2019? By Debaroti Adhikary , ETMarkets.com Last Updated: Oct 26, 2026, 10:06:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Shriram Finance shares fell sharply on Monday after Jefferies, Citi and Motilal Oswal cut their target prices following the NBFC\u2019s Q2 results. Despite concerns over rising credit costs and rural stress, all three brokerages retained their \u2018Buy\u2019 ratings, citing strong net interest income, resilient margins and long-term growth potential.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "26 Oct 2026, 10:06 AM IST", "pub_date_relative": "1h ago"}, {"title": "Credit Card Rewards Vs Annual Fees: Are You Really Getting A Good Deal?", "full_content": "When you plan to buy a credit card, it is important to check whether the benefits you receive are worth more than the annual amount you pay.", "source": "NDTV Profit", "pub_date_str": "26 Oct 2026, 10:06 AM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "Jupiter Hospital Q2FY27 slides: revenue rises, expansion weighs on profit", "full_content": "", "source": "Investing.com News", "pub_date_str": "26 Oct 2026, 11:44 AM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Bharat Coking Coal shares surge over 6% after falling for 6 sessions - What's next for the stock?", "full_content": "Bharat Coking Coal shares surged over 6% in intraday trade on the BSE on Monday, 26 October, looking set to snap their six-session losing streak. Bharat Coking Coal share price opened at \u20b9 31.36 against its previous close of \u20b9 29.78 and jumped 6.5% to an intraday high of \u20b9 31.73.\n\nThe stock jumped following the announcement of Q2FY27 results. The company's revenue from operations for the quarter stood at \u20b9 4,412.6 crore compared to \u20b9 3,173.25 crore.\n\nProfit for the quarter came at \u20b9 123.74 crore compared to a loss of \u20b9 53 crore in the same quarter last year.\n\nThe stock is down 10% in last 6 months. It has been gradually moving lower in a lower highs and lower lows formation below its key moving averages.\n\nAccording to Vipin Kumar, AVP-Research at Globe Capital Market, the chart structure remains negative as long as the stock is trading below the \u20b9 33.50\u2013 \u20b9 35.50 zone, and any bounce-back rally towards these levels will attract sellers' interest around that zone. Immediate support on the downside is placed around the \u20b9 29\u2013 \u20b9 28 zone, said Kumar.\n\nAditya Thukral, founder and analyst at AT Research and Risk Managers, said Bharat Coking Coal has been in a downtrend with the formation of lower highs and lower lows.\n\n\"The stock price is sustaining below all the major EMA\u2019s with negative crossovers between them. The structure looks incomplete on the downside, and the stock price is prone to further fall, making a fresh 52-week low below \u20b9 28.92. A rise towards the fresh resistance formed near \u20b9 32.50 will be an exit opportunity for buyers,\" said Thukral.\n\n\"The stock is in a downtrend, and a rise near the resistance level of \u20b9 32.50 is an exit opportunity for short-term buyers. As the stock has recently listed on stock exchanges via an OFS from the parent company, Coal India Limited, the lack of available data doesn\u2019t allow us to comment on the long-term trend of the stock price,\" Thukral said.", "source": "LiveMint Markets", "pub_date_str": "26 Oct 2026, 11:38 AM IST", "pub_date_relative": "21m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Earnings call transcript: Kajaria Ceramics posts Q2 2026 beat on sales, profit", "full_content": "", "source": "Investing.com News", "pub_date_str": "26 Oct 2026, 11:35 AM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Paytm, AU Small Finance Bank's RuPay credit card: 2% reward on UPI spends, 5% on Paytm Travel bookings \u2014 check benefits", "full_content": "Paytm and AU Small Finance Bank have launched a RuPay credit card providing rewards on eligible Paytm UPI spends along with complimentary airport lounge access for families.\n\nA lifetime free credit card, it rewards eligible Paytm UPI spends and provides family airport lounge access on eligible flights booked through Paytm , with no joining or annual fee.\n\n\u201cWith rewards on Paytm UPI transactions, travel, and gold purchases, along with unique benefits such as family lounge access, this Lifetime Free RuPay Credit Card is designed to deliver value beyond traditional credit card offerings,\u201d said Yogesh Jain, Deputy CEO, AU Small Finance Bank.\n\n\u201cWhen families travel together, the benefits of a card should work for them together. Our partnership with AU Small Finance Bank brings that thinking to lounge access, alongside rewards on everyday Paytm UPI payments,\u201d said Paytm spokesperson.\n\nCustomers can apply for the Paytm AU SFB Credit Card on the Paytm app, as follows:\n\nDisclaimer: This story is for educational purposes only. The views and recommendations made above are those of individual analysts or broking companies, and not of Mint. We advise investors to check with certified experts before making any investment decisions.\n\nJocelyn Fernandes is a journalist and editor with nearly 13 years of experience covering the business, corporate, economy and markets beats in news.<br> As chief content producer for around three years at Livemint (Hindustan Times), Jocelyn publishes breaking stories, explainers, features and live blogs on a range of business and economy topics, including the Budget, corporate developments, stock markets, income tax, money and personal finance, cryptocurrency, government policy, impact of US tariffs, international developments and more.<br> Jocelyn's writing philosophy is focused on delivering news in an accurate and accessible format for readers.", "source": "LiveMint Money", "pub_date_str": "26 Oct 2026, 11:35 AM IST", "pub_date_relative": "25m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Earnings call transcript: SBFC Finance tops revenue view in Q2 2026, shares slip", "full_content": "", "source": "Investing.com News", "pub_date_str": "26 Oct 2026, 11:33 AM IST", "pub_date_relative": "26m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Earnings call transcript: Jupiter Life Line Hospitals posts strong Q2 2026 results", "full_content": "", "source": "Investing.com News", "pub_date_str": "26 Oct 2026, 11:32 AM IST", "pub_date_relative": "27m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Defense tech investment boom sparks bubble warning as private equity pours in", "full_content": "Private equity firms are pouring billions into defense technology as rising military spending and geopolitical tensions fuel an investment boom.\n\nTraditional buyout investors are increasingly backing younger, high-growth firms in the sector, according to PitchBook data, with private equity growth investments in defense reaching $4 billion in the first nine months of 2026, up from $500 million in 2024.\n\nAs defense tech companies mature, analysts say private equity, debt and other forms of financing are expected to become more important in bridging the gap between innovation and industrial-scale production, as venture capital alone may not be enough to finance companies' expansion.\n\nIt comes as geopolitical tensions, wars, and countries' efforts to strengthen military capabilities are creating opportunities for companies developing everything from autonomous drones to missile defense systems and satellite technology.\n\nA survey of 250 senior decision-makers at U.K. defense companies by law firm White & Case found that 97% expected their businesses to seek significant external funding over the next 12 months.\n\n\"Private capital is now playing a critical role in the financing of defence technology companies,\" Daniel Turgel, a partner at White & Case, told CNBC.\n\nPrivate equity and venture capital firms, sovereign wealth funds and family offices were all looking to invest more in the sector, marking a significant change from just a few years ago, Turgel said, adding that many investors were previously reluctant or restricted from doing so.\n\nThe growth of private equity allocations to defense technology also comes amid a surge in venture capital investment in defense technology. Startups across NATO and allied countries raised $27.1 billion through September, nearly double the total for all of 2025, according to an October report from Dealroom and Resilience Media.", "source": "CNBC Top News", "pub_date_str": "26 Oct 2026, 11:30 AM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Tonbo Imaging shares soar another 17% after a 64% listing pop. Buy, sell or hold the stock?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Tonbo Imaging shares soar another 17% after a 64% listing pop. Buy, sell or hold the stock? Tonbo Imaging India Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Tonbo Imaging shares soar another 17% after a 64% listing pop. Buy, sell or hold the stock? SECTIONS Tonbo Imaging shares soar another 17% after a 64% listing pop. Buy, sell or hold the stock? By Veer Sharma , ETMarkets.com Last Updated: Oct 26, 2026, 11:23:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Tonbo Imaging shares rallied after a strong stock market debut, following h ned 0.66%, and mainland China's CSI 300 was down 0.54%.\n\nOil prices were lower on Monday in Asia, with Brent futures falling 2.20% to trade at $114.52 a barrel while U.S. West Texas Intermediate slid 2.24% to $101.03 per barrel.\n\nBrent crude had hit its highest level since April last Friday amid news reports that the U.S. and Israel could be planning to launch strikes on Iran after the midterm elections.\n\nHigher oil prices and a broadening sell-off that hit many market sectors dragged the three major averages to losses on Friday. The Dow fell more than 650 points, while the S&P 500 lost 0.5%. The Nasdaq Composite dropped 0.2%\n\nThe sell-off also dragged the S&P 500 and the Nasdaq to back-to-back weekly losses.", "source": "CNBC Top News", "pub_date_str": "26 Oct 2026, 11:20 AM IST", "pub_date_relative": "40m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Derivatives", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "$7.7 trillion AI bet: Can hyperscalers earn enough to justify the spending?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a $7.7 trillion AI bet: Can hyperscalers earn enough to justify the spending? The Economic Times daily newspaper is available online now. Read Today's Paper $7.7 trillion AI bet: Can hyperscalers earn enough to justify the spending? SECTIONS $7.7 trillion AI bet: Can hyperscalers earn enough to justify the spending? By Nikhil Agarwal , ETMarkets.com Last Updated: Oct 26, 2026, 11:19:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Six major hyperscalers are projected to spend $7.7 trillion on AI between 2026 and 2030, but generating adequate returns will be a challenge. UBS estimates they need $1 trillion in additional earnings before interest and taxes by 2031. The key questions are whether AI boosts productivity and companies can monetise those gains.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "26 Oct 2026, 11:19 AM IST", "pub_date_relative": "40m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Jio\u2019s record India IPO falls short of record payday for bankers", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a Jio\u2019s record India IPO falls short of record payday for bankers National Stock Exchange of India Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Jio\u2019s record India IPO falls short of record payday for bankers SECTIONS Jio\u2019s record India IPO falls short of record payday for bankers By Rajesh Mascarenhas , Bloomberg Last Updated: Oct 26, 2026, 11:16:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comme
