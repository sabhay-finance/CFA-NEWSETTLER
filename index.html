<script>

    const allData = {"general": [{"title": "Germany vs Netherlands Live Streaming: When And Where To Watch UEFA Nations League Match On TV, Online?", "full_content": "Germany will host Group A2 leaders Netherlands in their final league-phase fixture of the 2026-27 UEFA Nations League campaign.", "source": "NDTV Profit", "pub_date_str": "16 Nov 2026, 10:15 PM IST", "pub_date_relative": "just now"}, {"title": "Tech world's calls for Jensen Huang to return to Nvidia are growing", "full_content": "An online petition calling for Jensen Huang's reinstatement as CEO of Nvidia has drawn more than 160,000 signatures, as prominent tech executives, employees and shareholders rally behind the chipmaker's co-founder following his resignation last week.\n\nThe \"Stand with Jensen \" campaign has attracted support from Tesla CEO Elon Musk, Epic Games CEO Tim Sweeney and Y Combinator CEO Garry Tan, according to the petition's website, which notes that affiliations are self-reported and not verified.\n\nHuang, who co-founded the company in 1993 and helped turn it into a dominant supplier of artificial intelligence chips, resigned as Nvidia's president, CEO and board member last week following reports of extramarital affairs \u2014 including one involving a woman suspected of ties to Chinese intelligence.\n\nNvidia appointed longtime finance chief Colette Kress as interim CEO and said its board would consider both internal and external candidates in its search for a permanent successor. The growing campaign to reinstate Huang adds a layer of complexity to the decision for Nvidia's board as it looks to put the controversy behind it, and coincides with reports that he is considering a comeback.\n\nAny potential return, however, faces significant hurdles. Nvidia's board is continuing an independent investigation into the conduct that led to Huang's departure. What's more, U.S. lawmakers are preparing for investigations into how the now-ex-CEO's affair may have damaged America's artificial intelligence dominance, the national security implications and the executive's close relationship with President Donald Trump and his Cabinet.\n\nMusk was among the most prominent tech executives to publicly back Huang's reinstatement, saying on X that he would sign a petition calling for the former Nvidia chief's return.\n\n\"A petition is underway to reinstate Jensen and I'm signing it too,\" Musk wrote on X.", "source": "CNBC World Economy", "pub_date_str": "16 Nov 2026, 01:35 PM IST", "pub_date_relative": "1m ago"}, {"title": "Why is Elders stock surging today?", "full_content": "", "source": "Investing.com News", "pub_date_str": "16 Nov 2026, 01:23 PM IST", "pub_date_relative": "13m ago"}, {"title": "How credit card rewards can help you save lakhs on your next holiday", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nWhen Ayush Aggarwal and his wife Ishita travelled to Australia this year, they flew business class on their return journey from New Delhi and spent 11 nights at four-star Accor hotels across four cities. The experiences would have cost them about \u20b9 6.6 lakh, but the couple paid just \u20b9 60,000.\n\nAggarwal managed to bring down the bill so drastically by using credit card reward points accumulated over nearly two years.\n\n\u201cThese were rewards earned on my regular spends, like food, insurance and taxes, as well as discretionary spends ranging from shopping to jewellery, gadgets and even my first house's down payment,\u201d said the Delhi-based Aggarwal. \u201cI routed everything I spent through credit cards and earned an almost 6-8% return on spending.\u201d\n\nReturn on spending is a metric used by credit card users to measure the value of rewards earned as a percentage of the amount spent.\n\nWhen soaring airfares are forcing travellers to reconsider their holiday plans, credit card rewards can offer some relief. Points accumulated on everyday expenses and big purchases can pay for flights and hotel stays, often taking a substantial load off the holiday budget.\n\nBut how much of a vacation can these points actually fund? And how much spending is required to earn rewards worth lakhs? Mint spoke to four travellers who have used credit card points to cut their holiday expenses substantially.\n\nThe common thread among these travellers is that almost all their expenses are routed through credit cards. This includes groceries, dining, shopping, utilities, insurance premiums, school fees and travel. Bigger expenses, such as buying a car or making a property payment, can give the rewards balance a significant boost.", "source": "LiveMint Money", "pub_date_str": "16 Nov 2026, 01:23 PM IST", "pub_date_relative": "13m ago"}, {"title": "Godawari Power Q2 FY27 slides: revenue up 25%, margins pressured", "full_content": "", "source": "Investing.com News", "pub_date_str": "16 Nov 2026, 01:22 PM IST", "pub_date_relative": "13m ago"}, {"title": "Thailand\u2019s economy grows 2.9% in third quarter on exports", "full_content": "", "source": "Investing.com News", "pub_date_str": "16 Nov 2026, 01:22 PM IST", "pub_date_relative": "14m ago"}, {"title": "Jimmy Tata Backs Tata Sons Listing, Chandrasekaran's Continuation As Chairman", "full_content": "Jimmy is Ratan Tata's full brother and Noel Tata's half-brother. He has served as a trustee of Sir Ratan Tata Trust since 1989 and is a perpetual trustee alongside Noel Tata and Jehangir Jehangir.", "source": "NDTV Profit", "pub_date_str": "16 Nov 2026, 01:16 PM IST", "pub_date_relative": "20m ago"}, {"title": "Why is Tata Motors stock sliding today?", "full_content": "", "source": "Investing.com News", "pub_date_str": "16 Nov 2026, 01:16 PM IST", "pub_date_relative": "20m ago"}, {"title": "Why is Adore Beauty stock collapsing today?", "full_content": "", "source": "Investing.com News", "pub_date_str": "16 Nov 2026, 01:13 PM IST", "pub_date_relative": "23m ago"}, {"title": "Why Vodafone Idea\u2019s q-o-q drop in mobile subscriber base is a worrying sign", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nVodafone Idea\u2019s stock dropped 3% after its September quarter (Q2FY27) results. Average revenue per user (Arpu), excluding machine-to-machine/M2M connections that generally have a low Arpu of \u20b9 10-15, rose sequentially by \u20b9 3 to \u20b9 198, partly because Q2 had one more day than Q1.\n\nThe remaining improvement can be attributed to a negative factor: a lower subscriber base. Arpu is calculated by dividing revenue by the number of subscribers. Arpu rises if the subscriber count drops.\n\nEven if some of the subscribers it lost were low-paying customers, Vodafone\u2019s mobile subscriber base (excluding M2M connections) shrank by 0.3% q-o-q to 171 million\u2014a worrying sign because it leads to drop in revenue.\n\nThe management is optimistic that Arpu will increase organically by 10% over the next few quarters. Recent data might support the management\u2019s optimism as Arpu rose 10% to \u20b9 198 organically over the past year\u2014from Q2FY26-end to Q2FY27-end. But that won\u2019t be easy to repeat as some of the improvement was due to a 5% fall in mobile subscribers over this period.\n\nThe gain in postpaid users may not be helpful in boosting Arpu. Over the past year, almost the entire growth of 6 million postpaid users was accounted for by the increase in M2M, which typically belongs to the postpaid category. It can be inferred that there was little addition of postpaid mobile subscribers.\n\nInstead of Q2 revenue and profitability, investors should focus on cash Ebitda, given Vodafone\u2019s heavy capital expenditure and government debt burden of almost \u20b9 1.5 trillion. Vodafone plans to spend \u20b9 45,000 crore from FY27 to FY29 and has so far spent \u20b9 6,000 crore in H1FY27.\n\nVodafone reported cash Ebitda of almost \u20b9 2,500 crore in Q2, and the net interest burden (after adjusting other income) was twice that amount. So, additional borrowing will be needed to fund capex.", "source": "LiveMint Markets", "pub_date_str": "16 Nov 2026, 01:12 PM IST", "pub_date_relative": "23m ago"}, {"title": "Amber Enterprises shares resume losing run, tank over 8% after weak Q2 from peer Kaynes Technology. Is more fall ahead?", "full_content": "AMBER A Ksheerasagar Published 16 Nov 2026, 01:11 PM IST Prefer Livemint on Google Shares of Amber Enterprises tanked 8.4% in Monday's trade on 16 November, falling to \u20b9 6,199 apiece and reversing all of Friday's gains, as weaker-than-expected Q2 results from peer Kaynes Technology weighed on investor sentiment towards electronics manufacturing stocks.\n\nThe electronics manufacturing services (EMS) company's consolidated net profit plunged 61.6% year-on-year (YoY) to \u20b9 45.4 crore in Q2FY27, compared with \u20b9 118.2 crore in the corresponding quarter last year.\n\nRevenue from operations, however, increased 4.4% YoY to \u20b9 952.2 crore from \u20b9 912 crore. Despite the modest revenue growth, operating performance weakened, with earnings before interest, tax, depreciation and amortisation (EBITDA) declining 16.2% to \u20b9 125.6 crore from \u20b9 150 crore a year earlier.\n\nThe pressure was also reflected in operating margins, with EBITDA margin contracting to 13.2% in the September quarter from 16.4% in Q2FY26, indicating a squeeze on profitability despite higher revenue.\n\nAmber last week announced its Q2 numbers, with revenue exceeded the analysts estimates, while its margins and net profit came in below expectations.\n\nConsolidated revenue grew 60% year-on-year (YoY) to \u20b9 2,600 crore, supported by growth across all segments. Its absolute EBITDA increased 8% YoY to \u20b9 98.5 crore, while the EBITDA margin contracted 180 bps to 3.7%.\n\nThe margin pressure was primarily due to commodity price inflation, foreign exchange fluctuations and minimum wage revisions. The company reported a net loss of \u20b9 70.6 crore, compared with a loss of \u20b9 32.9 crore in the year-ago period, according to Motilal Oswal.\n\nFor the first half of FY27 (1HFY27), revenue, EBITDA and net profit grew 28%, 18% and 5% YoY, respectively, while the EBITDA margin contracted 50 bps to 6.3%.", "source": "LiveMint Markets", "pub_date_str": "16 Nov 2026, 01:11 PM IST", "pub_date_relative": "25m ago"}, {"title": "Bunzl starts second \u00a3250m tranche of buyback program", "full_content": "", "source": "Investing.com News", "pub_date_str": "16 Nov 2026, 01:11 PM IST", "pub_date_relative": "25m ago"}, {"title": "Earnings call transcript: Godawari Power and Ispat Q2 2026 revenue rises 25%", "full_content": "", "source": "Investing.com News", "pub_date_str": "16 Nov 2026, 01:10 PM IST", "pub_date_relative": "26m ago"}, {"title": "AstraZeneca gets U.S. approval for two drugs", "full_content": "", "source": "Investing.com News", "pub_date_str": "16 Nov 2026, 01:06 PM IST", "pub_date_relative": "29m ago"}, {"title": "Alicon Castalloy Q2 FY27 slides: record revenue amid margin pressure", "full_content": "", "source": "Investing.com News", "pub_date_str": "16 Nov 2026, 01:04 PM IST", "pub_date_relative": "32m ago"}, {"title": "Ramayana Vs Dhurandhar 2 Vs KGF 2 Box Office Day 11: Ranbir Kapoor's Film Beats Yash's Blockbuster But Trails Behind Ranveer Singh's Movie", "full_content": "Directed by Nitesh Tiwari, Ramayana: Part One stars Ranbir Kapoor as Lord Rama, Sai Pallavi as Goddess Sita and Yash as Ravana.", "source": "NDTV Profit", "pub_date_str": "16 Nov 2026, 01:04 PM IST", "pub_date_relative": "32m ago"}, {"title": "Phillip Securities upgrades Airbnb stock rating on booking growth", "full_content": "", "source": "Investing.com News", "pub_date_str": "16 Nov 2026, 01:02 PM IST", "pub_date_relative": "33m ago"}, {"title": "Stock Market Today: Sensex Zooms 450 Points, Nifty 50 Near 25,250; Max Health Gains 6%, Inox Wind Slips 9%", "full_content": "BSE Sensex opened at81,810.98 against its previous close of81,592.45. On the other hand, Nifty 50 opened at25,206.15 against its previous close of 25,144.30.", "source": "NDTV Profit", "pub_date_str": "16 Nov 2026, 01:02 PM IST", "pub_date_relative": "34m ago"}, {"title": "Why investing has become more confusing than ever", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nAsk your grandfather how he invested and the answer takes ten seconds. A fixed deposit in the bank, an LIC policy, some gold for the daughter, maybe a plot if things went well. Limited options, limited information, limited confusion.\n\nAsk a 28-year-old in 2026 the same question and watch the face. Should it be index funds or flexicap? Small-cap funds have run up, so is it too late? Reels say buy gold; gold is at a lifetime high, so is it already at the top? One app is pushing an NFO, another is offering pre-approved F&O activation, and a third is showing US stocks. A colleague doubled his money in options. A cousin swears by crypto.\n\nWe have more access to investing , more products and more information than any generation in Indian history. Yet we are more confused than ever. That confusion has causes.\n\nWalk into the mutual fund market today and you will find well over a thousand schemes. Add ETFs , stocks, bonds, Reits, gold in four formats, US investing apps and crypto exchanges. Beyond a point, every extra option makes it harder to decide.\n\nYour grandfather was not calmer because he was wiser. He was calmer because the menu had four items. The paralysis you feel in front of four thousand is not a personal weakness. It is the menu's design.\n\nAlmost every voice reaching you profits from your activity, not your clarity.\n\nThe trading app earns when you trade. The finfluencer earns from views and referral links, so every video must scream: today, breaking, last chance.", "source": "LiveMint Money", "pub_date_str": "16 Nov 2026, 01:02 PM IST", "pub_date_relative": "34m ago"}, {"title": "Gucci Is Cutting Prices. Louis Vuitton Is Reluctant to Follow the Trend. - WSJ", "full_content": "Gucci Is Cutting Prices. Louis Vuitton Is Reluctant to Follow the Trend. WSJ The Birkin Isn't Getting Cheaper, But Gucci Is Having Second Thoughts About Its Price Tags News18", "source": "Google News Business", "pub_date_str": "16 Nov 2026, 01:01 PM IST", "pub_date_relative": "35m ago"}, {"title": "Budget 2027: FM Nirmala Sitharaman Meets Economists During Pre-Budget Consultation", "full_content": "The meeting was held in New Delhi and was attended by the Secretary of the Department of Economic Affairs (DEA), the Chief Economic Adviser to the Government of India and other senior DEA officials.", "source": "NDTV Profit", "pub_date_str": "16 Nov 2026, 12:57 PM IST", "pub_date_relative": "39m ago"}, {"title": "TVS Supply Chain Solutions shares jump 17% after Q2 results, surge 24% in 2 weeks; what lies ahead? Key levels to watch", "full_content": "Dhanya Nagasundaram Published 16 Nov 2026, 12:47 PM IST Prefer Livemint on Google TVS Supply Chain Solutions shares surged 17% on Monday, 16 November, after the company reported a strong performance for the September quarter, with robust growth in revenue and profitability across geographies.\n\nThe company's consolidated revenue from operations rose 38% year-on-year (YoY) to \u20b9 3,687.2 crore in Q2 FY27, compared with \u20b9 2,662.6 crore in the corresponding quarter last year.\n\nAccording to company's exchange filing, operating performance also strengthened, with EBITDA climbing 50.2% YoY to \u20b9 268.1 crore. EBITDA margin expanded to 7.3% from 6.7% in Q2 FY26, reflecting improved operating efficiency and profitability.\n\nProfit before tax (PBT) more than doubled to \u20b9 50.6 crore from \u20b9 24.4 crore a year earlier, marking a 108% increase. Net profit after tax (PAT) also more than doubled to \u20b9 36.5 crore, compared with \u20b9 16.3 crore in the year-ago quarter.\n\nThe company maintained its growth momentum in the first half of FY27. Consolidated revenue increased 33.6% YoY to \u20b9 7,022.4 crore from \u20b9 5,254.9 crore in H1 FY26. EBITDA rose 42.2% to \u20b9 500.3 crore, while the EBITDA margin improved to 7.1% from 6.7%.\n\nPBT for the six-month period stood at \u20b9 82.7 crore, up 91.4% from \u20b9 43.2 crore in the corresponding period last year, as per exchange filing.\n\nCommenting on the performance, Vikas Chadha, Managing Director of TVS Supply Chain Solutions, said the strong quarterly numbers reflected the impact of growth and optimisation initiatives undertaken over the past several quarters. He highlighted broad-based revenue growth across regions and business segments, supported by momentum in both new and existing customer accounts.\n\nChadha also said the company had secured more than \u20b9 500 crore in quarterly new business revenue for the third consecutive quarter, alongside significant expansion in its existing client base.", "source": "LiveMint Markets", "pub_date_str": "16 Nov 2026, 12:47 PM IST", "pub_date_relative": "48m ago"}, {"title": "Varun Dhawan Injures Wrist Before Shoot, Shares Pics From Vacation", "full_content": "Actor Varun Dhawan reveals he injured his wrist while water skiing in Maldives ahead of his next shoot and shares glimpses of his beach vacation with fans.", "source": "NDTV Profit", "pub_date_str": "16 Nov 2026, 12:43 PM IST", "pub_date_relative": "53m ago"}, {"title": "India's WPI Inflation Rises To 12.29% In October As Fuel Prices Spike", "full_content": "Fuel and power inflation surged to 32.84% in October from 25.85% in the previous month, signalling intensifying cost pressures across the energy segment.", "source": "NDTV Profit", "pub_date_str": "16 Nov 2026, 12:41 PM IST", "pub_date_relative": "55m ago"}, {"title": "FBI tracks $400 million \u2018FaceStealer\u2019 crypto theft to N Korea \u2014 Here's what you should do if affected; how to avoid scam", "full_content": "The United States Federal Bureau of Investigation ( FBI ) said it is investigating a massive cryptocurrency theft dubbed \u2018FaceStealer\u2019 and has traced the actions to North Korean hackers. As of November 2026, the scheme resulted in the theft of over $400 million over the past 18 months, it said.\n\nFaceStealer is a superintelligence-enabled social engineering campaign targeting cryptocurrency holders and individuals working in the open-source supply chain, according to a press release from the US Department of Justice .\n\nNotably, the FBI and DOJ this month announced the disruption of cloud-based infrastructure used by North Korean hackers in this scheme. The investigative agency has identified and seized over 900 webcam videos of victims.\n\nThe FBI flash also outlined the exploit lifecycle of the FaceStealer cryptocurrency theft scheme as follows:\n\nAccording to the DOJ release, coordinated actions have been announced: \u201cagainst the Democratic People\u2019s Republic of North Korea (DPRK) government\u2019s schemes to fund its regime through the massive theft of cryptocurrency\u201d.\n\n\u2014 When joining a video chat, use the official video chat application (i.e. Zoom or Teams) and use an invite code instead of clicking on links to join web versions of the applications.\n\n\u2014 When joining a video chat that you have been invited to attend, do not turn on your webcam until you are able to see, hear, and communicate with the person who invited you. This best practice should be followed particularly when responding to invitations from infrequent or new contacts.\n\n\u2014 If prompted for an update while using a video chat service, do not run scripts or copy code into the command line or terminal to update the client. Instead, either update the communication application or join the meeting via the web version of the service using the invite code.", "source": "LiveMint Money", "pub_date_str": "16 Nov 2026, 12:40 PM IST", "pub_date_relative": "56m ago"}, {"title": "Nvidia Employee Reveals Other Side Of Jensen Huang, Shares Personal Account: 'He Saw Possibilities Most Could Not Comprehend'", "full_content": "Recalling her sister Shilpi's brain cancer crisis in California, Singh shared that amid overwhelming medical and financial stress, Huang personally stepped in to support her family and even visited her sister.", "source": "NDTV Profit", "pub_date_str": "16 Nov 2026, 12:33 PM IST", "pub_date_relative": "1h ago"}, {"title": "From Above Rs 4 Lakh To Below Rs 1.75 Lakh: Why Silver Prices Have Fallen So Sharply", "full_content": "MCX Silver prices had breached the Rs 4 lakh per kg mark back for the first time back in January 2026 after escalating trade tensions triggered massive safe haven flows. Since then, the devil's metal seems to have lost its shine.", "source": "NDTV Profit", "pub_date_str": "16 Nov 2026, 12:32 PM IST", "pub_date_relative": "1h ago"}, {"title": "Gold, Silver Lose Shine: Yellow Metal Prices Fall Below Rs 1,35,000; White Metal Slips To Rs 1,69,000", "full_content": "Gold price hit more-than-one year low as traders weighed hawkish signals from Federal Reserve officials and awaited remarks from Fed Chair Kevin Warsh for further clues on the US interest-rate outlook.", "source": "NDTV Profit", "pub_date_str": "16 Nov 2026, 12:20 PM IST", "pub_date_relative": "1h ago"}, {"title": "Stock futures slip as traders brace for Nvidia earnings, Anthropic IPO this week: Live updates", "full_content": "Stock futures slipped Monday morning following a volatile week on Wall Street, as traders await a highly anticipated earnings report from Nvidia and a potentially record-setting public market debut of Anthropic.\n\nNasdaq-100 futures declined 0.77%, while S&P 500 futures fell 0.37%. Dow Jones Industrial Average futures lost 103 points lower, or 0.20%.\n\nIn Asia, markets were mostly lower with Japan's Nikkei 225 dropping 2.04% after third-quarter GDP unexpectedly shrank. South Korea Kospi slumped 3.48%, leading losses in the region. Australia's S&P/ASX 200 declined 0.41% as well. Mainland China's CSI 300 fell 0.83% after downbeat key economic data, while Hong Kong's Hang Seng Index gained 0.94%.\n\nNvidia is set to report results after the bell on Tuesday. While analysts expect the chipmaker to post nearly 100% year-over-year earnings and revenue growth, investors will be more focused on how the company will move forward after Jensen Huang's exit as CEO.\n\nHuang last week resigned from his post after reports of multiple extramarital affairs, including one with an alleged Chinese spy. Nvidia shares dropped 13%, marking their biggest weekly slide since April 2025.\n\n\"The main task at hand for interim CEO Colette Kress [is to] restore order and give the Street confidence in the Nvidia story going forward,\" wrote Dan Ives, analyst at Yorkville Ives. \"This starts with earnings and the conference call this week on Tuesday after the bell\u2026we still expect guidance and a typical conference call around robust business metrics with demand metrics that have clearly accelerated since last quarter.\"\n\nAnother key catalyst is Anthropic's initial public offering. The AI giant is eyeing a roughly $1.4 trillion valuation, with shares expected to be priced between $70 and $78.\n\nWall Street is coming off a winning week despite Nvidia's tumble.", "source": "CNBC Top News", "pub_date_str": "16 Nov 2026, 12:18 PM IST", "pub_date_relative": "1h ago"}, {"title": "Eicher Motors, Oil India And More Q2 Review: Check PL Capital's Revised Target Prices, Ratings", "full_content": "PL Capital has reviewed the second-quarter earnings of five companies across the metals, mining, EMS, luggage, oil and gas and automobiles sectors including VIP Industries, Eicher Motors, Avalon Technologies, Usha Martin, and Oil India.", "source": "NDTV Profit", "pub_date_str": "16 Nov 2026, 12:18 PM IST", "pub_date_relative": "1h ago"}, {"title": "Bengaluru consumer court orders Tonique to pay \u20b98,020 for charging \u20b920 for a carry bag \u2013 what customers should know", "full_content": "A Bengaluru consumer has won a case against liquor retailer Tonique after he was charged \u20b9 20 for a carry bag bearing the store\u2019s name and logo.\n\nThe District Consumer Disputes Redressal Commission, Bengaluru (Urban), after going through the facts of the case, termed the charge imposed on the consumer an unfair trade practice and a deficiency in service, thus instructing the retailer to refund the amount and pay additional compensation and litigation expenses, as per a report by The Times of India.\n\nThe incident occurred on 3 June 2025, when Theerthesh BS, 33, purchased liquor worth \u20b9 2,170 from a Tonique outlet on Kasturba Road in Bengaluru.\n\nAs he had purchased glass bottles, he requested a carry bag to transport them safely. The store provided him with a carry bag bearing its brand name, logo and other promotional details, but charged him an additional \u20b9 20 for it.\n\nTheerthesh objected to the additional charge, arguing that customers should not be made to pay for a bag that also served as a promotional tool for the concerned retail outlet. Still, the store staff refused to waive the charge, leaving him with no option but to pay to carry the purchased products safely.\n\nSubsequently, the aggrieved customer approached the consumer commission on 17 June 2025 seeking a refund of \u20b9 20 and \u20b9 25,000 in compensation for deficiency in service and \u2018 unfair trade practice .\u2019\n\nThe defendant in this case, Tonique, maintained that the customers were informed of the bag charges through notices displayed at its outlets and, as a result, were issued separate bills. However, the retailer did not appear before the commission or submit its formal response despite receiving notice. As a result, the case proceeded ex parte.\n\nThe commission, comprising President Ramachandra MS and members Nandini H Kumbhar and Savitha Airani, categorically observed that a liquor retailer selling bottled beverages should reasonably anticipate that customers may need bags to carry their purchases safely.", "source": "LiveMint Money", "pub_date_str": "16 Nov 2026, 12:03 PM IST", "pub_date_relative": "1h ago"}, {"title": "The perfect sell-off", "full_content": "Plus, fast-tracking Anthropic\u2019s IPO", "source": "FT Markets", "pub_date_str": "16 Nov 2026, 12:00 PM IST", "pub_date_relative": "1h ago"}, {"title": "Cigarette Stock Jumps: ITC Rallies 4%, Up 11% In November; Here's Why", "full_content": "On the volume front, 8.89 lakh shares worth Rs 25.86 crore changed hands on the BSE. This was below the stock's two-week average traded quantity of 19.70 lakh shares. On the NSE, around 162.42 lakh shares worth Rs 473.42 crore had changed hands.", "source": "NDTV Profit", "pub_date_str": "16 Nov 2026, 11:59 AM IST", "pub_date_relative": "1h ago"}, {"title": "Why Kaynes Technology shares crashed 20% to 52-week low? stock down 54% in a year | What stock market experts say", "full_content": "Dhanya Nagasundaram Published 16 Nov 2026, 11:58 AM IST Prefer Livemint on Google Kaynes Technology shares came under intense selling pressure on Monday, 16 November, hitting the 20% lower circuit and touching a fresh 52-week low of \u20b9 2,780 apiece on the BSE. The sharp fall followed the company's September-quarter results, which revealed a steep decline in profitability despite modest revenue growth. The stock has now lost around 54% of its value over the past year, putting the spotlight on the company's earnings trajectory, balance sheet and accounting disclosures.\n\nThe electronics manufacturing services (EMS) company's consolidated net profit plunged 61.6% year-on-year (YoY) to \u20b9 45.4 crore in Q2 FY27, compared with \u20b9 118.2 crore in the corresponding quarter last year.\n\nRevenue from operations, meanwhile, rose 4.4% to \u20b9 952.2 crore from \u20b9 912 crore a year earlier. However, operating performance weakened, with earnings before interest, tax, depreciation and amortisation (EBITDA) declining 16.2% to \u20b9 125.6 crore from \u20b9 150 crore.\n\nThe pressure was also visible in margins. EBITDA margin contracted to 13.2% in the September quarter from 16.4% in Q2 FY26, indicating a squeeze on operating profitability even as the company reported higher revenue.\n\nThe earnings miss is only one part of the concerns surrounding Kaynes Technology. Brokerages have pointed to weakness in the smart metering business, rising debt and uneven performance across business segments. The auditor's observations on the consolidated financial results and the company's restatement of earlier financial statements have added another layer of scrutiny.\n\nAccording to media reports, CLSA maintained its 'Hold' rating on Kaynes Technology, with a target price of \u20b9 3,580 per share.", "source": "LiveMint Markets", "pub_date_str": "16 Nov 2026, 11:58 AM IST", "pub_date_relative": "1h ago"}, {"title": "Caught On Camera: Aggressive Bear Forces Tigress To Retreat In Rare Satpura Encounter", "full_content": "The latest incident serves as another reminder that even in the wild, size and predatory reputation do not always determine the outcome of an encounter.", "source": "NDTV Profit", "pub_date_str": "16 Nov 2026, 11:54 AM IST", "pub_date_relative": "1h ago"}, {"title": "AI is reshaping banking jobs \u2013 but its ability to drive profits remains unclear", "full_content": "Banks' third-quarter results have brought their use of artificial intelligence into sharper focus, as lenders automate routine work, reshape hiring and test whether productivity gains can translate into revenue growth.\n\nThis earnings season, Barclays unveiled layoffs in certain functions where AI is being deployed; while UniCredit and Santander said technology was freeing employees for higher-value work and improving processes. It comes as U.S. giants such as JPMorgan Chase and Goldman Sachs make similar changes in staffing and workflows.\n\nBut as banks pursue efficiency savings, strategists say evidence that AI is generating material, demonstrable revenue gains from it remains harder to pin down.\n\nUniCredit CEO Andrea Orcel called AI an \"opportunity to accelerate\" that was allowing a shift toward more commercial, higher-value work and greater client engagement.\n\nOrcel said the Italian lender \u2014 which reported its best-ever quarterly profit of 3.3 billion euros \u2014 is using the technology to \"get us to the next level.\"\n\nUniCredit. Orcel called AI \"a lever that we didn't anticipate we would have, and working extremely well,\" on CNBC's \"Squawk Box Europe\" on Nov. 9.\n\nSantander said AI initiatives generated 194 million euros in business value in the first nine months of 2026. AI is now being embedded in \"all the processes that we are conducting at the bank,\" said Chief Financial Officer Jos\u00e9 Garc\u00eda Cantera.\n\n\"AI basically helps, at least for now, decrease low value-added processes, and the company employees can then focus on more value-added processes \u2014 this affects both revenue and costs,\" Cantera told CNBC's \"Squawk Box Europe\" on Oct. 28.", "source": "CNBC Top News", "pub_date_str": "16 Nov 2026, 11:50 AM IST", "pub_date_relative": "1h ago"}, {"title": "Bitcoin may drop 40% or more as it nears technical warning level, strategist says", "full_content": "Bitcoin started the year around $90,000, and neared $98,000 in January before falling into the $60,000s in February.", "source": "CNBC Top News", "pub_date_str": "16 Nov 2026, 11:48 AM IST", "pub_date_relative": "1h ago"}, {"title": "Sai Pallavi Has One Request For Dhanush Amid Political Entry Speculation", "full_content": "Sai Pallavi made a special request to her co-star Dhanush at the pre-release event of their upcoming film, OM: Chapter One.", "source": "NDTV Profit", "pub_date_str": "16 Nov 2026, 11:48 AM IST", "pub_date_relative": "1h ago"}, {"title": "'I Smoked Nearly 100 Cigarettes': Soni Razdan Recalls Filming While Pregnant With Alia Bhatt", "full_content": "Soni Razdan reveals she was unaware of her pregnancy with Alia Bhatt while shooting 'Gumrah' and recalls her experiences as a working mother.", "source": "NDTV Profit", "pub_date_str": "16 Nov 2026, 11:46 AM IST", "pub_date_relative": "1h ago"}, {"title": "Nvidia Faces A New Challenge From The Very Companies Driving The AI Boom, JPMorgan Says", "full_content": "According to Cembalest, some competitors are closing the performance gap with Nvidia, particularly in inference workloads, which involve running trained AI models to generate responses.", "source": "NDTV Profit", "pub_date_str": "16 Nov 2026, 11:36 AM IST", "pub_date_relative": "2h ago"}, {"title": "Tiny quant fund joins UK tax giants", "full_content": "Plus, Ken Griffin\u2019s Miami makeover, a surprise crude surplus and the Guggenheim collection in London", "source": "FT Markets", "pub_date_str": "16 Nov 2026, 11:30 AM IST", "pub_date_relative": "2h ago"}, {"title": "The latest twist in Strategy\u2019s tragicomedy", "full_content": "MSCI exeunt, pursued by a bear", "source": "FT Markets", "pub_date_str": "16 Nov 2026, 11:30 AM IST", "pub_date_relative": "2h ago"}, {"title": "Mutual Funds Buy Jio Platforms, Airtel, Infosys In October; Dump HDFC Bank, ICICI Bank, Reliance", "full_content": "Among large-cap stocks, Jio Platforms, Adani Energy Solutions, Bajaj Finserv, HFCL and BSE were the top five stocks bought by mutual funds. In the mid-cap category, funds added Ather Energy, Aditya Infotech, Zydus Lifesciences, Meesho and Dhoot Transmission.", "source": "NDTV Profit", "pub_date_str": "16 Nov 2026, 11:29 AM IST", "pub_date_relative": "2h ago"}, {"title": "ABB India Ticks All The Right Boxes In Q3, Says Motilal Oswal; Upgrades Rating, Raises Target Price", "full_content": "Motilal Oswal believes that the impact of price hikes taken in the past few quarters will support ABB's healthy revenue growth and has already started boosting margins across segments.", "source": "NDTV Profit", "pub_date_str": "16 Nov 2026, 11:27 AM IST", "pub_date_relative": "2h ago"}, {"title": "Thailand Fire Tragedy: 11 Dead, Many Injured As Massive Fire Engulfs Buildings In Phuket's Patong", "full_content": "A fire in a commercial shophouse on Phuket island killed 11 people and injured 16, with the blaze starting in a vehicle rental business.", "source": "NDTV Profit", "pub_date_str": "16 Nov 2026, 11:24 AM IST", "pub_date_relative": "2h ago"}, {"title": "War Preparations? Trump Shares Video Of Military Personnel, Globemaster Aircraft; Sparks Speculation", "full_content": "While its appearance alongside military personnel has fuelled speculation about possible military preparations, the footage does not establish that a fresh development or offensive is underway.", "source": "NDTV Profit", "pub_date_str": "16 Nov 2026, 11:22 AM IST", "pub_date_relative": "2h ago"}, {"title": "Coal India\u2019s Mahanadi Coalfields IPO expected profit calculator on GMP: What retail, HNI investors can gain on listing?", "full_content": "Sharmila Bhadoria Published 16 Nov 2026, 11:19 AM IST Prefer Livemint on Google Mahanadi Coalfields IPO lot profit calculator, latest GMP: India\u2019s primary market is buzzing with developments surrounding the upcoming initial public offering (IPO) of a public sector undertaking (PSU). State-owned Coal India \u2019s subsidiary, Mahanadi Coalfields Limited (MCL), on Monday announced the IPO price band ahead of the issue\u2019s subscription opening later this week.\n\nMCL IPO\u2019s latest grey market premium (GMP) hinted at 3.31% listing gain. It is an entirely offer for sale (OFS), where the promoter Coal India will divest nearly 10% stake in the company by selling nearly 66.18 crore equity shares.\n\nFor investors closely tracking the issue, let\u2019s understand how much they can make from the IPO on listing day, based on its grey market premium.\n\nCoal India\u2019s Mahanadi Coalfields IPO GMP stood at \u20b9 4.5, hinting at 3.31% listing gain, at 11 am on Monday, November 16. Considering its upper IPO price band of \u20b9 136 per share, its estimated listing price stood at \u20b9 140.5 per share (which is the sum of upper price band and latest GMP).\n\nThe lot size for an application is 110 shares. Hence retail investors are required to invest \u20b9 14,960, for a single lot, i.e. 110 shares.\n\nRetail investors can apply for a maximum of 13 lots. Small High Net Worth Individuals (HNIs) can apply for minimum 14 lots and maximum 66 lots. B-HNI individuals can apply for a minimum of 67 lots.\n\nBased on the latest Mahanadi Coalfields IPO GMP, retail investors are estimated to earn \u20b9 495 profit on single lot. sHNIs can earn \u20b9 6,930 profit on 14 lots, whereas bHNIs can earn an estimated \u20b9 33,165 profit on 67 lots.\n\nReaders must note that the estimated listing profit for Mahanadi Coalfields IPO is based on the grey market premium (GMP), which is an unregulated market and may not accurately reflect an issue\u2019s demand among investors.", "source": "LiveMint Markets", "pub_date_str": "16 Nov 2026, 11:19 AM IST", "pub_date_relative": "2h ago"}, {"title": "Eicher races to meet Royal Enfield demand wave amid margin woes", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nEicher Motors Ltd has an enviable problem. It needs to build Royal Enfield motorcycles faster than it can sell them, leading to a significant channel inventory crunch. In the race to catch up with soaring demand, Eicher\u2019s September quarter (Q2FY27) consolidated operating revenues have grown 20% year-on-year to \u20b9 7,422 crore.\n\nRoyal Enfield's sales volume stood at a record 376,722 units, up 15% year-on-year, while realization rose 3% to \u20b9 195,995 per unit. Domestic sales contributed around 90.5% of total volumes, and increased by 16%, driven by healthy growth in semi-urban and rural markets. Global markets contributed the remaining volumes and grew by just 4% amid macroeconomic headwinds.\n\nDemand for the newly launched Himalayan 440 (OG Himalayan) was intense, with capacity getting sold out in 17 days, prompting a temporary pause on bookings, the management said in the Q2 earnings call.\n\nChannel inventory post-Diwali stood at an exceptionally lean 7-8 days (including transit stock), compared with the normal 3-4 weeks, reflecting a wide gap between customer demand and supply. To improve delivery efficiency, Eicher has increased direct shipments to dealers to around 18% of volumes, up from 1-2% earlier, aiming to shave another 4-5 days of inventory tied up in transit.\n\nVolume prospects are bright. \u201cWe forecast an industry-beating 16% domestic volume CAGR over FY26-29E, led by demand for key models such as Bullet/Hunter/Classic, aided by product interventions and stepping up of marketing spends,\u201d said Nuvama Institutional Equities. The brokerage expects a 10% compound annual growth rate (CAGR) in export volumes.\n\nEicher is rapidly expanding its manufacturing footprint from 1.5 million units a year at the start of FY27.", "source": "LiveMint Markets", "pub_date_str": "16 Nov 2026, 11:11 AM IST", "pub_date_relative": "2h ago"}, {"title": "Morning Bid: AI selloff resumes as Nvidia earnings loom - Reuters", "full_content": "Morning Bid: AI selloff resumes as Nvidia earnings loom Reuters See more headlines & perspectives on Google News", "source": "Google News Business", "pub_date_str": "16 Nov 2026, 11:02 AM IST", "pub_date_relative": "2h ago"}, {"title": "Oil Prices Fall as Fears of a Global Supply Glut Return - Crude Oil Prices Today | OilPrice.com", "full_content": "Oil Prices Fall as Fears of a Global Supply Glut Return Crude Oil Prices Today | OilPrice.com Oil Steadies With Iranian Attack on Base in Bahrain in Focus Bloomberg.com Crude Futures Post Back-to-Back Weekly Losses WSJ Trump\u2019s peaceful mood doesn\u2019t fully explain why energy prices are plunging | CNN Business CNN Brent crude briefly dips below $90 for first time since August on Iran hopes CNBC", "source": "Google News Business", "pub_date_str": "16 Nov 2026, 10:55 AM IST", "pub_date_relative": "2h ago"}], "cfa": [{"title": "Tech world's calls for Jensen Huang to return to Nvidia are growing", "full_content": "An online petition calling for Jensen Huang's reinstatement as CEO of Nvidia has drawn more than 160,000 signatures, as prominent tech executives, employees and shareholders rally behind the chipmaker's co-founder following his resignation last week.\n\nThe \"Stand with Jensen \" campaign has attracted support from Tesla CEO Elon Musk, Epic Games CEO Tim Sweeney and Y Combinator CEO Garry Tan, according to the petition's website, which notes that affiliations are self-reported and not verified.\n\nHuang, who co-founded the company in 1993 and helped turn it into a dominant supplier of artificial intelligence chips, resigned as Nvidia's president, CEO and board member last week following reports of extramarital affairs \u2014 including one involving a woman suspected of ties to Chinese intelligence.\n\nNvidia appointed longtime finance chief Colette Kress as interim CEO and said its board would consider both internal and external candidates in its search for a permanent successor. The growing campaign to reinstate Huang adds a layer of complexity to the decision for Nvidia's board as it looks to put the controversy behind it, and coincides with reports that he is considering a comeback.\n\nAny potential return, however, faces significant hurdles. Nvidia's board is continuing an independent investigation into the conduct that led to Huang's departure. What's more, U.S. lawmakers are preparing for investigations into how the now-ex-CEO's affair may have damaged America's artificial intelligence dominance, the national security implications and the executive's close relationship with President Donald Trump and his Cabinet.\n\nMusk was among the most prominent tech executives to publicly back Huang's reinstatement, saying on X that he would sign a petition calling for the former Nvidia chief's return.\n\n\"A petition is underway to reinstate Jensen and I'm signing it too,\" Musk wrote on X.", "source": "CNBC World Economy", "pub_date_str": "16 Nov 2026, 01:35 PM IST", "pub_date_relative": "1m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Godawari Power Q2 FY27 slides: revenue up 25%, margins pressured", "full_content": "", "source": "Investing.com News", "pub_date_str": "16 Nov 2026, 01:22 PM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Jimmy Tata Backs Tata Sons Listing, Chandrasekaran's Continuation As Chairman", "full_content": "Jimmy is Ratan Tata's full brother and Noel Tata's half-brother. He has served as a trustee of Sir Ratan Tata Trust since 1989 and is a perpetual trustee alongside Noel Tata and Jehangir Jehangir.", "source": "NDTV Profit", "pub_date_str": "16 Nov 2026, 01:16 PM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Why Vodafone Idea\u2019s q-o-q drop in mobile subscriber base is a worrying sign", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nVodafone Idea\u2019s stock dropped 3% after its September quarter (Q2FY27) results. Average revenue per user (Arpu), excluding machine-to-machine/M2M connections that generally have a low Arpu of \u20b9 10-15, rose sequentially by \u20b9 3 to \u20b9 198, partly because Q2 had one more day than Q1.\n\nThe remaining improvement can be attributed to a negative factor: a lower subscriber base. Arpu is calculated by dividing revenue by the number of subscribers. Arpu rises if the subscriber count drops.\n\nEven if some of the subscribers it lost were low-paying customers, Vodafone\u2019s mobile subscriber base (excluding M2M connections) shrank by 0.3% q-o-q to 171 million\u2014a worrying sign because it leads to drop in revenue.\n\nThe management is optimistic that Arpu will increase organically by 10% over the next few quarters. Recent data might support the management\u2019s optimism as Arpu rose 10% to \u20b9 198 organically over the past year\u2014from Q2FY26-end to Q2FY27-end. But that won\u2019t be easy to repeat as some of the improvement was due to a 5% fall in mobile subscribers over this period.\n\nThe gain in postpaid users may not be helpful in boosting Arpu. Over the past year, almost the entire growth of 6 million postpaid users was accounted for by the increase in M2M, which typically belongs to the postpaid category. It can be inferred that there was little addition of postpaid mobile subscribers.\n\nInstead of Q2 revenue and profitability, investors should focus on cash Ebitda, given Vodafone\u2019s heavy capital expenditure and government debt burden of almost \u20b9 1.5 trillion. Vodafone plans to spend \u20b9 45,000 crore from FY27 to FY29 and has so far spent \u20b9 6,000 crore in H1FY27.\n\nVodafone reported cash Ebitda of almost \u20b9 2,500 crore in Q2, and the net interest burden (after adjusting other income) was twice that amount. So, additional borrowing will be needed to fund capex.", "source": "LiveMint Markets", "pub_date_str": "16 Nov 2026, 01:12 PM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Amber Enterprises shares resume losing run, tank over 8% after weak Q2 from peer Kaynes Technology. Is more fall ahead?", "full_content": "AMBER A Ksheerasagar Published 16 Nov 2026, 01:11 PM IST Prefer Livemint on Google Shares of Amber Enterprises tanked 8.4% in Monday's trade on 16 November, falling to \u20b9 6,199 apiece and reversing all of Friday's gains, as weaker-than-expected Q2 results from peer Kaynes Technology weighed on investor sentiment towards electronics manufacturing stocks.\n\nThe electronics manufacturing services (EMS) company's consolidated net profit plunged 61.6% year-on-year (YoY) to \u20b9 45.4 crore in Q2FY27, compared with \u20b9 118.2 crore in the corresponding quarter last year.\n\nRevenue from operations, however, increased 4.4% YoY to \u20b9 952.2 crore from \u20b9 912 crore. Despite the modest revenue growth, operating performance weakened, with earnings before interest, tax, depreciation and amortisation (EBITDA) declining 16.2% to \u20b9 125.6 crore from \u20b9 150 crore a year earlier.\n\nThe pressure was also reflected in operating margins, with EBITDA margin contracting to 13.2% in the September quarter from 16.4% in Q2FY26, indicating a squeeze on profitability despite higher revenue.\n\nAmber last week announced its Q2 numbers, with revenue exceeded the analysts estimates, while its margins and net profit came in below expectations.\n\nConsolidated revenue grew 60% year-on-year (YoY) to \u20b9 2,600 crore, supported by growth across all segments. Its absolute EBITDA increased 8% YoY to \u20b9 98.5 crore, while the EBITDA margin contracted 180 bps to 3.7%.\n\nThe margin pressure was primarily due to commodity price inflation, foreign exchange fluctuations and minimum wage revisions. The company reported a net loss of \u20b9 70.6 crore, compared with a loss of \u20b9 32.9 crore in the year-ago period, according to Motilal Oswal.\n\nFor the first half of FY27 (1HFY27), revenue, EBITDA and net profit grew 28%, 18% and 5% YoY, respectively, while the EBITDA margin contracted 50 bps to 6.3%.", "source": "LiveMint Markets", "pub_date_str": "16 Nov 2026, 01:11 PM IST", "pub_date_relative": "25m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Bunzl starts second \u00a3250m tranche of buyback program", "full_content": "", "source": "Investing.com News", "pub_date_str": "16 Nov 2026, 01:11 PM IST", "pub_date_relative": "25m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Earnings call transcript: Godawari Power and Ispat Q2 2026 revenue rises 25%", "full_content": "", "source": "Investing.com News", "pub_date_str": "16 Nov 2026, 01:10 PM IST", "pub_date_relative": "26m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Alicon Castalloy Q2 FY27 slides: record revenue amid margin pressure", "full_content": "", "source": "Investing.com News", "pub_date_str": "16 Nov 2026, 01:04 PM IST", "pub_date_relative": "32m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stock Market Today: Sensex Zooms 450 Points, Nifty 50 Near 25,250; Max Health Gains 6%, Inox Wind Slips 9%", "full_content": "BSE Sensex opened at81,810.98 against its previous close of81,592.45. On the other hand, Nifty 50 opened at25,206.15 against its previous close of 25,144.30.", "source": "NDTV Profit", "pub_date_str": "16 Nov 2026, 01:02 PM IST", "pub_date_relative": "34m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Why investing has become more confusing than ever", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nAsk your grandfather how he invested and the answer takes ten seconds. A fixed deposit in the bank, an LIC policy, some gold for the daughter, maybe a plot if things went well. Limited options, limited information, limited confusion.\n\nAsk a 28-year-old in 2026 the same question and watch the face. Should it be index funds or flexicap? Small-cap funds have run up, so is it too late? Reels say buy gold; gold is at a lifetime high, so is it already at the top? One app is pushing an NFO, another is offering pre-approved F&O activation, and a third is showing US stocks. A colleague doubled his money in options. A cousin swears by crypto.\n\nWe have more access to investing , more products and more information than any generation in Indian history. Yet we are more confused than ever. That confusion has causes.\n\nWalk into the mutual fund market today and you will find well over a thousand schemes. Add ETFs , stocks, bonds, Reits, gold in four formats, US investing apps and crypto exchanges. Beyond a point, every extra option makes it harder to decide.\n\nYour grandfather was not calmer because he was wiser. He was calmer because the menu had four items. The paralysis you feel in front of four thousand is not a personal weakness. It is the menu's design.\n\nAlmost every voice reaching you profits from your activity, not your clarity.\n\nThe trading app earns when you trade. The finfluencer earns from views and referral links, so every video must scream: today, breaking, last chance.", "source": "LiveMint Money", "pub_date_str": "16 Nov 2026, 01:02 PM IST", "pub_date_relative": "34m ago", "cfa_topics": ["Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "TVS Supply Chain Solutions shares jump 17% after Q2 results, surge 24% in 2 weeks; what lies ahead? Key levels to watch", "full_content": "Dhanya Nagasundaram Published 16 Nov 2026, 12:47 PM IST Prefer Livemint on Google TVS Supply Chain Solutions shares surged 17% on Monday, 16 November, after the company reported a strong performance for the September quarter, with robust growth in revenue and profitability across geographies.\n\nThe company's consolidated revenue from operations rose 38% year-on-year (YoY) to \u20b9 3,687.2 crore in Q2 FY27, compared with \u20b9 2,662.6 crore in the corresponding quarter last year.\n\nAccording to company's exchange filing, operating performance also strengthened, with EBITDA climbing 50.2% YoY to \u20b9 268.1 crore. EBITDA margin expanded to 7.3% from 6.7% in Q2 FY26, reflecting improved operating efficiency and profitability.\n\nProfit before tax (PBT) more than doubled to \u20b9 50.6 crore from \u20b9 24.4 crore a year earlier, marking a 108% increase. Net profit after tax (PAT) also more than doubled to \u20b9 36.5 crore, compared with \u20b9 16.3 crore in the year-ago quarter.\n\nThe company maintained its growth momentum in the first half of FY27. Consolidated revenue increased 33.6% YoY to \u20b9 7,022.4 crore from \u20b9 5,254.9 crore in H1 FY26. EBITDA rose 42.2% to \u20b9 500.3 crore, while the EBITDA margin improved to 7.1% from 6.7%.\n\nPBT for the six-month period stood at \u20b9 82.7 crore, up 91.4% from \u20b9 43.2 crore in the corresponding period last year, as per exchange filing.\n\nCommenting on the performance, Vikas Chadha, Managing Director of TVS Supply Chain Solutions, said the strong quarterly numbers reflected the impact of growth and optimisation initiatives undertaken over the past several quarters. He highlighted broad-based revenue growth across regions and business segments, supported by momentum in both new and existing customer accounts.\n\nChadha also said the company had secured more than \u20b9 500 crore in quarterly new business revenue for the third consecutive quarter, alongside significant expansion in its existing client base.", "source": "LiveMint Markets", "pub_date_str": "16 Nov 2026, 12:47 PM IST", "pub_date_relative": "48m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "India's WPI Inflation Rises To 12.29% In October As Fuel Prices Spike", "full_content": "Fuel and power inflation surged to 32.84% in October from 25.85% in the previous month, signalling intensifying cost pressures across the energy segment.", "source": "NDTV Profit", "pub_date_str": "16 Nov 2026, 12:41 PM IST", "pub_date_relative": "55m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "FBI tracks $400 million \u2018FaceStealer\u2019 crypto theft to N Korea \u2014 Here's what you should do if affected; how to avoid scam", "full_content": "The United States Federal Bureau of Investigation ( FBI ) said it is investigating a massive cryptocurrency theft dubbed \u2018FaceStealer\u2019 and has traced the actions to North Korean hackers. As of November 2026, the scheme resulted in the theft of over $400 million over the past 18 months, it said.\n\nFaceStealer is a superintelligence-enabled social engineering campaign targeting cryptocurrency holders and individuals working in the open-source supply chain, according to a press release from the US Department of Justice .\n\nNotably, the FBI and DOJ this month announced the disruption of cloud-based infrastructure used by North Korean hackers in this scheme. The investigative agency has identified and seized over 900 webcam videos of victims.\n\nThe FBI flash also outlined the exploit lifecycle of the FaceStealer cryptocurrency theft scheme as follows:\n\nAccording to the DOJ release, coordinated actions have been announced: \u201cagainst the Democratic People\u2019s Republic of North Korea (DPRK) government\u2019s schemes to fund its regime through the massive theft of cryptocurrency\u201d.\n\n\u2014 When joining a video chat, use the official video chat application (i.e. Zoom or Teams) and use an invite code instead of clicking on links to join web versions of the applications.\n\n\u2014 When joining a video chat that you have been invited to attend, do not turn on your webcam until you are able to see, hear, and communicate with the person who invited you. This best practice should be followed particularly when responding to invitations from infrequent or new contacts.\n\n\u2014 If prompted for an update while using a video chat service, do not run scripts or copy code into the command line or terminal to update the client. Instead, either update the communication application or join the meeting via the web version of the service using the invite code.", "source": "LiveMint Money", "pub_date_str": "16 Nov 2026, 12:40 PM IST", "pub_date_relative": "56m ago", "cfa_topics": ["Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "From Above Rs 4 Lakh To Below Rs 1.75 Lakh: Why Silver Prices Have Fallen So Sharply", "full_content": "MCX Silver prices had breached the Rs 4 lakh per kg mark back for the first time back in January 2026 after escalating trade tensions triggered massive safe haven flows. Since then, the devil's metal seems to have lost its shine.", "source": "NDTV Profit", "pub_date_str": "16 Nov 2026, 12:32 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Gold, Silver Lose Shine: Yellow Metal Prices Fall Below Rs 1,35,000; White Metal Slips To Rs 1,69,000", "full_content": "Gold price hit more-than-one year low as traders weighed hawkish signals from Federal Reserve officials and awaited remarks from Fed Chair Kevin Warsh for further clues on the US interest-rate outlook.", "source": "NDTV Profit", "pub_date_str": "16 Nov 2026, 12:20 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Stock futures slip as traders brace for Nvidia earnings, Anthropic IPO this week: Live updates", "full_content": "Stock futures slipped Monday morning following a volatile week on Wall Street, as traders await a highly anticipated earnings report from Nvidia and a potentially record-setting public market debut of Anthropic.\n\nNasdaq-100 futures declined 0.77%, while S&P 500 futures fell 0.37%. Dow Jones Industrial Average futures lost 103 points lower, or 0.20%.\n\nIn Asia, markets were mostly lower with Japan's Nikkei 225 dropping 2.04% after third-quarter GDP unexpectedly shrank. South Korea Kospi slumped 3.48%, leading losses in the region. Australia's S&P/ASX 200 declined 0.41% as well. Mainland China's CSI 300 fell 0.83% after downbeat key economic data, while Hong Kong's Hang Seng Index gained 0.94%.\n\nNvidia is set to report results after the bell on Tuesday. While analysts expect the chipmaker to post nearly 100% year-over-year earnings and revenue growth, investors will be more focused on how the company will move forward after Jensen Huang's exit as CEO.\n\nHuang last week resigned from his post after reports of multiple extramarital affairs, including one with an alleged Chinese spy. Nvidia shares dropped 13%, marking their biggest weekly slide since April 2025.\n\n\"The main task at hand for interim CEO Colette Kress [is to] restore order and give the Street confidence in the Nvidia story going forward,\" wrote Dan Ives, analyst at Yorkville Ives. \"This starts with earnings and the conference call this week on Tuesday after the bell\u2026we still expect guidance and a typical conference call around robust business metrics with demand metrics that have clearly accelerated since last quarter.\"\n\nAnother key catalyst is Anthropic's initial public offering. The AI giant is eyeing a roughly $1.4 trillion valuation, with shares expected to be priced between $70 and $78.\n\nWall Street is coming off a winning week despite Nvidia's tumble.", "source": "CNBC Top News", "pub_date_str": "16 Nov 2026, 12:18 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Eicher Motors, Oil India And More Q2 Review: Check PL Capital's Revised Target Prices, Ratings", "full_content": "PL Capital has reviewed the second-quarter earnings of five companies across the metals, mining, EMS, luggage, oil and gas and automobiles sectors including VIP Industries, Eicher Motors, Avalon Technologies, Usha Martin, and Oil India.", "source": "NDTV Profit", "pub_date_str": "16 Nov 2026, 12:18 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "The perfect sell-off", "full_content": "Plus, fast-tracking Anthropic\u2019s IPO", "source": "FT Markets", "pub_date_str": "16 Nov 2026, 12:00 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Cigarette Stock Jumps: ITC Rallies 4%, Up 11% In November; Here's Why", "full_content": "On the volume front, 8.89 lakh shares worth Rs 25.86 crore changed hands on the BSE. This was below the stock's two-week average traded quantity of 19.70 lakh shares. On the NSE, around 162.42 lakh shares worth Rs 473.42 crore had changed hands.", "source": "NDTV Profit", "pub_date_str": "16 Nov 2026, 11:59 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Why Kaynes Technology shares crashed 20% to 52-week low? stock down 54% in a year | What stock market experts say", "full_content": "Dhanya Nagasundaram Published 16 Nov 2026, 11:58 AM IST Prefer Livemint on Google Kaynes Technology shares came under intense selling pressure on Monday, 16 November, hitting the 20% lower circuit and touching a fresh 52-week low of \u20b9 2,780 apiece on the BSE. The sharp fall followed the company's September-quarter results, which revealed a steep decline in profitability despite modest revenue growth. The stock has now lost around 54% of its value over the past year, putting the spotlight on the company's earnings trajectory, balance sheet and accounting disclosures.\n\nThe electronics manufacturing services (EMS) company's consolidated net profit plunged 61.6% year-on-year (YoY) to \u20b9 45.4 crore in Q2 FY27, compared with \u20b9 118.2 crore in the corresponding quarter last year.\n\nRevenue from operations, meanwhile, rose 4.4% to \u20b9 952.2 crore from \u20b9 912 crore a year earlier. However, operating performance weakened, with earnings before interest, tax, depreciation and amortisation (EBITDA) declining 16.2% to \u20b9 125.6 crore from \u20b9 150 crore.\n\nThe pressure was also visible in margins. EBITDA margin contracted to 13.2% in the September quarter from 16.4% in Q2 FY26, indicating a squeeze on operating profitability even as the company reported higher revenue.\n\nThe earnings miss is only one part of the concerns surrounding Kaynes Technology. Brokerages have pointed to weakness in the smart metering business, rising debt and uneven performance across business segments. The auditor's observations on the consolidated financial results and the company's restatement of earlier financial statements have added another layer of scrutiny.\n\nAccording to media reports, CLSA maintained its 'Hold' rating on Kaynes Technology, with a target price of \u20b9 3,580 per share.", "source": "LiveMint Markets", "pub_date_str": "16 Nov 2026, 11:58 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "AI is reshaping banking jobs \u2013 but its ability to drive profits remains unclear", "full_content": "Banks' third-quarter results have brought their use of artificial intelligence into sharper focus, as lenders automate routine work, reshape hiring and test whether productivity gains can translate into revenue growth.\n\nThis earnings season, Barclays unveiled layoffs in certain functions where AI is being deployed; while UniCredit and Santander said technology was freeing employees for higher-value work and improving processes. It comes as U.S. giants such as JPMorgan Chase and Goldman Sachs make similar changes in staffing and workflows.\n\nBut as banks pursue efficiency savings, strategists say evidence that AI is generating material, demonstrable revenue gains from it remains harder to pin down.\n\nUniCredit CEO Andrea Orcel called AI an \"opportunity to accelerate\" that was allowing a shift toward more commercial, higher-value work and greater client engagement.\n\nOrcel said the Italian lender \u2014 which reported its best-ever quarterly profit of 3.3 billion euros \u2014 is using the technology to \"get us to the next level.\"\n\nUniCredit. Orcel called AI \"a lever that we didn't anticipate we would have, and working extremely well,\" on CNBC's \"Squawk Box Europe\" on Nov. 9.\n\nSantander said AI initiatives generated 194 million euros in business value in the first nine months of 2026. AI is now being embedded in \"all the processes that we are conducting at the bank,\" said Chief Financial Officer Jos\u00e9 Garc\u00eda Cantera.\n\n\"AI basically helps, at least for now, decrease low value-added processes, and the company employees can then focus on more value-added processes \u2014 this affects both revenue and costs,\" Cantera told CNBC's \"Squawk Box Europe\" on Oct. 28.", "source": "CNBC Top News", "pub_date_str": "16 Nov 2026, 11:50 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Bitcoin may drop 40% or more as it nears technical warning level, strategist says", "full_content": "Bitcoin started the year around $90,000, and neared $98,000 in January before falling into the $60,000s in February.", "source": "CNBC Top News", "pub_date_str": "16 Nov 2026, 11:48 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Sai Pallavi Has One Request For Dhanush Amid Political Entry Speculation", "full_content": "Sai Pallavi made a special request to her co-star Dhanush at the pre-release event of their upcoming film, OM: Chapter One.", "source": "NDTV Profit", "pub_date_str": "16 Nov 2026, 11:48 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Mutual Funds Buy Jio Platforms, Airtel, Infosys In October; Dump HDFC Bank, ICICI Bank, Reliance", "full_content": "Among large-cap stocks, Jio Platforms, Adani Energy Solutions, Bajaj Finserv, HFCL and BSE were the top five stocks bought by mutual funds. In the mid-cap category, funds added Ather Energy, Aditya Infotech, Zydus Lifesciences, Meesho and Dhoot Transmission.", "source": "NDTV Profit", "pub_date_str": "16 Nov 2026, 11:29 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "ABB India Ticks All The Right Boxes In Q3, Says Motilal Oswal; Upgrades Rating, Raises Target Price", "full_content": "Motilal Oswal believes that the impact of price hikes taken in the past few quarters will support ABB's healthy revenue growth and has already started boosting margins across segments.", "source": "NDTV Profit", "pub_date_str": "16 Nov 2026, 11:27 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "War Preparations? Trump Shares Video Of Military Personnel, Globemaster Aircraft; Sparks Speculation", "full_content": "While its appearance alongside military personnel has fuelled speculation about possible military preparations, the footage does not establish that a fresh development or offensive is underway.", "source": "NDTV Profit", "pub_date_str": "16 Nov 2026, 11:22 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Coal India\u2019s Mahanadi Coalfields IPO expected profit calculator on GMP: What retail, HNI investors can gain on listing?", "full_content": "Sharmila Bhadoria Published 16 Nov 2026, 11:19 AM IST Prefer Livemint on Google Mahanadi Coalfields IPO lot profit calculator, latest GMP: India\u2019s primary market is buzzing with developments surrounding the upcoming initial public offering (IPO) of a public sector undertaking (PSU). State-owned Coal India \u2019s subsidiary, Mahanadi Coalfields Limited (MCL), on Monday announced the IPO price band ahead of the issue\u2019s subscription opening later this week.\n\nMCL IPO\u2019s latest grey market premium (GMP) hinted at 3.31% listing gain. It is an entirely offer for sale (OFS), where the promoter Coal India will divest nearly 10% stake in the company by selling nearly 66.18 crore equity shares.\n\nFor investors closely tracking the issue, let\u2019s understand how much they can make from the IPO on listing day, based on its grey market premium.\n\nCoal India\u2019s Mahanadi Coalfields IPO GMP stood at \u20b9 4.5, hinting at 3.31% listing gain, at 11 am on Monday, November 16. Considering its upper IPO price band of \u20b9 136 per share, its estimated listing price stood at \u20b9 140.5 per share (which is the sum of upper price band and latest GMP).\n\nThe lot size for an application is 110 shares. Hence retail investors are required to invest \u20b9 14,960, for a single lot, i.e. 110 shares.\n\nRetail investors can apply for a maximum of 13 lots. Small High Net Worth Individuals (HNIs) can apply for minimum 14 lots and maximum 66 lots. B-HNI individuals can apply for a minimum of 67 lots.\n\nBased on the latest Mahanadi Coalfields IPO GMP, retail investors are estimated to earn \u20b9 495 profit on single lot. sHNIs can earn \u20b9 6,930 profit on 14 lots, whereas bHNIs can earn an estimated \u20b9 33,165 profit on 67 lots.\n\nReaders must note that the estimated listing profit for Mahanadi Coalfields IPO is based on the grey market premium (GMP), which is an unregulated market and may not accurately reflect an issue\u2019s demand among investors.", "source": "LiveMint Markets", "pub_date_str": "16 Nov 2026, 11:19 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Eicher races to meet Royal Enfield demand wave amid margin woes", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nEicher Motors Ltd has an enviable problem. It needs to build Royal Enfield motorcycles faster than it can sell them, leading to a significant channel inventory crunch. In the race to catch up with soaring demand, Eicher\u2019s September quarter (Q2FY27) consolidated operating revenues have grown 20% year-on-year to \u20b9 7,422 crore.\n\nRoyal Enfield's sales volume stood at a record 376,722 units, up 15% year-on-year, while realization rose 3% to \u20b9 195,995 per unit. Domestic sales contributed around 90.5% of total volumes, and increased by 16%, driven by healthy growth in semi-urban and rural markets. Global markets contributed the remaining volumes and grew by just 4% amid macroeconomic headwinds.\n\nDemand for the newly launched Himalayan 440 (OG Himalayan) was intense, with capacity getting sold out in 17 days, prompting a temporary pause on bookings, the management said in the Q2 earnings call.\n\nChannel inventory post-Diwali stood at an exceptionally lean 7-8 days (including transit stock), compared with the normal 3-4 weeks, reflecting a wide gap between customer demand and supply. To improve delivery efficiency, Eicher has increased direct shipments to dealers to around 18% of volumes, up from 1-2% earlier, aiming to shave another 4-5 days of inventory tied up in transit.\n\nVolume prospects are bright. \u201cWe forecast an industry-beating 16% domestic volume CAGR over FY26-29E, led by demand for key models such as Bullet/Hunter/Classic, aided by product interventions and stepping up of marketing spends,\u201d said Nuvama Institutional Equities. The brokerage expects a 10% compound annual growth rate (CAGR) in export volumes.\n\nEicher is rapidly expanding its manufacturing footprint from 1.5 million units a year at the start of FY27.", "source": "LiveMint Markets", "pub_date_str": "16 Nov 2026, 11:11 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Morning Bid: AI selloff resumes as Nvidia earnings loom - Reuters", "full_content": "Morning Bid: AI selloff resumes as Nvidia earnings loom Reuters See more headlines & perspectives on Google News", "source": "Google News Business", "pub_date_str": "16 Nov 2026, 11:02 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Oil Prices Fall as Fears of a Global Supply Glut Return - Crude Oil Prices Today | OilPrice.com", "full_content": "Oil Prices Fall as Fears of a Global Supply Glut Return Crude Oil Prices Today | OilPrice.com Oil Steadies With Iranian Attack on Base in Bahrain in Focus Bloomberg.com Crude Futures Post Back-to-Back Weekly Losses WSJ Trump\u2019s peaceful mood doesn\u2019t fully explain why energy prices are plunging | CNN Business CNN Brent crude briefly dips below $90 for first time since August on Iran hopes CNBC", "source": "Google News Business", "pub_date_str": "16 Nov 2026, 10:55 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Derivatives", "Alternative Investments"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "ITR update: Extended deadline tax audit report filings this week \u2014 Check due date, which taxpayers are eligible, details", "full_content": "ITR update news: In September, the Income-Tax Department (I-T dept) extended the deadline for corporate taxpayers to file and submit audit reports for assessment year 2026-27 (AY27), or financial year 2025-26 (FY26), by 21 days.\n\nThe deadline extension for both compliances \u2014 the corporate statutory audit report and ITR filing \u2014 was granted by the Central Board of Direct Taxes ( CBDT ) in response to demands from tax practitioners, according to a PTI report. They cited the compressed audit window following the 31 August deadline for filing ITR in non-audit cases as the reason for wanting an extension in deadlines, it added.\n\n\u201cThe additional 21 days will provide much-needed breathing space to businesses to complete their tax audits, undertake necessary reconciliations and ensure that the information reported in the tax return is accurate and appropriately supported,\u201d Amit Agarwal, Senior Partner at Nangia & Co LLP, told the publication.\n\nThe extension is intended to help businesses complete their audit processes and ensure that financial information reported in income tax returns is accurate and supported by appropriate documentation.\n\nTaxpayers often need to reconcile their books of accounts with financial statements, tax audit reports and other statutory filings before submitting their ITRs. The additional time could help companies address discrepancies, review tax positions and complete pending documentation.\n\nAccording to tax experts, the 21-day extension will provide much-needed breathing space to businesses and professionals managing multiple compliance requirements.\n\nThe additional time could also reduce the possibility of errors arising from rushed filings, particularly where companies need to undertake detailed reconciliations or obtain supporting information from different departments.\n\nDisclaimer: This story is for educational purposes only.", "source": "LiveMint Money", "pub_date_str": "16 Nov 2026, 10:44 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Jensen Huang\u2019s wife could land massive divorce settlement, attorney says - NewsNation", "full_content": "Jensen Huang\u2019s wife could land massive divorce settlement, attorney says NewsNation Jensen Huang\u2019s Affair Puts His Wife in the Spotlight The New York Times Jensen Huang's $145 billion question: What California divorce law says Lori Huang could get Fortune The visionary wife who helped engineer Jensen Huang\u2019s rise The Times Allegations Of Third Jensen Huang Affair Ramp Up Divorce Speculation\u2014Billionaire\u2019s Wife Could
