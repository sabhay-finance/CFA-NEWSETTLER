l change on Monday to try and stem China's access to the most advanced Nvidia chips \u2014 which are already under export controls effectively preventing their import into the country \u2014 by restricting Chinese companies' ability to access compute remotely in overseas data centers.", "source": "CNBC World Economy", "pub_date_str": "18 Nov 2026, 09:18 PM IST", "pub_date_relative": "50m ago", "cfa_topics": ["Economics", "Financial Statement Analysis"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Market Trading Guide: Deepak Fertilisers among 3 stock recommendations for Thursday", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News Market Trading Guide: Deepak Fertilisers among 3 stock recommendations for Thursday Written by Kumar Gaurav , ETMarkets.com | Nov 18, 2026, 09:19:14 PM IST 1 / 4 Stock Ideas Benchmark indices witnessed profit booking and closed in negative amid weak global cues, reversing some of the recent gains. However, easing Brent crude oil prices, which remained below the $95 mark, and appreciation in the rupee provided some support to investor sentiment, limiting the overall pressure. The Nifty 50 slipped 159 points, or 0.63%, to settle at 25,228, while the BSE Sensex declined 500 points, or 0.61%, to close at 82,032.\n\nVijaya Diagnostic Centre has witnessed a strong breakout from its sideways consolidation range, along with an Inverted Head and Shoulders pattern breakout on the daily chart. The move is supported by increasing volumes, indicating fresh buying interest and participation in the stock. It is currently trading above its 20, 50 and 100-Day EMAs, reflecting strength in the ongoing trend.\n\nThe RSI is at 63.73, suggesting healthy momentum and supporting the bullish price action. The stock has been consolidating for a while, and the recent breakout indicates a possible shift towards a stronger upward move.\n\nIf it sustains above the breakout zone, the stock may continue its momentum towards 1690. The stop-loss is placed at 1457 to manage downside risk.\n\nEureka Forbes has given a breakout above its sideways trading range on the daily chart, indicating a pickup in buying interest. The stock is also forming a higher highs and higher lows structure, suggesting that the trend is gradually turning stronger.", "source": "Economic Times Markets", "pub_date_str": "18 Nov 2026, 09:14 PM IST", "pub_date_relative": "53m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Nvidia\u2019s booming demand is \u2018hard to ignore,\u2019 but these four questions loom over the stock", "full_content": "Nvidia investors face uncertainty around CEO succession, the AI ecosystem, export controls and China.", "source": "MarketWatch Top Stories", "pub_date_str": "18 Nov 2026, 09:12 PM IST", "pub_date_relative": "56m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Lowe's posts strong online sales, raises outlook despite slow housing market", "full_content": "Lowe's on Wednesday posted strong quarterly results and raised its full-year outlook as the company said it saw strength among professional shoppers.\n\nThe company said comparable sales grew 1.8% for the fiscal third quarter, driven by a 17.4% increase in online sales and \"solid\" performance in pro and home services sales. Net sales rose to $22.76 billion.\n\nBecause of the strength, Lowe's now said it expects full-year sales of roughly $92.5 billion, up from a previous projection of $92 billion. It also expects comparable sales to be up 0.5%, compared with previous guidance of flat.\n\nCEO Marvin Ellison told CNBC that the company is focused on growing despite economic headwinds and a sluggish housing market. He said Lowe's posted its sixth straight quarterly comparable sales increase and saw particular strength in appliances, which saw its largest revenue growth in five years.\n\n\"We believe irrespective of the macro environment we're in, we're going to take share because there's a lot of share out there that we can go and get, and we're going to be aggressive to go and get that share,\" Ellison told CNBC.\n\nLowe's also reported a pretax benefit of approximately $250 million from tariff refunds during the quarter, which contributed a 34-cent boost to earnings per share. Ellison said the company plans to use those funds to enhance the customer experience and bring value to shoppers.\n\nHe added that do-it-yourself customers and pro shoppers are not investing in major renovation projects but are instead spending on repair and maintenance projects.\n\n\"We are giving those pros what they need,\" he said. \"We're able to improve our fulfillment capabilities and our pro loyalty program.\"", "source": "CNBC Top News", "pub_date_str": "18 Nov 2026, 09:09 PM IST", "pub_date_relative": "59m ago", "cfa_topics": ["Economics", "Financial Statement Analysis"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "NEFT transfer limit: How much money can you transfer in a day? Check RBI rules, charges and settlement time", "full_content": "The Reserve Bank of India (RBI) has not prescribed any upper limit on the amount that individuals can transfer through the National Electronic Funds Transfer (NEFT) system. However, banks are allowed to impose their own transaction limits based on their risk assessment, subject to approval by their respective boards.\n\nFor individuals transferring money from one bank account to another, there is no uniform maximum limit prescribed by the central bank. However, the rules are different for customers who do not have a bank account and want to transfer money by depositing cash at a bank branch.\n\nAccording to the RBI's NEFT Frequently Asked Questions (FAQs), updated on September 2, 2024, cash-based remittances through NEFT are restricted to \u20b9 50,000 per transaction.\n\nThe RBI has clarified that it does not impose any maximum limit on funds transferred through NEFT.\n\n\"No, there is no limit imposed by the RBI for funds transfer through NEFT system. However, a member bank may place amount limits based on its own risk perception with the approval of its Board,\" the central bank states in its FAQs.\n\nThis means customers can transfer amounts exceeding \u20b9 50,000 through NEFT , subject to the transaction limits prescribed by their respective banks.\n\nHowever, individuals without bank accounts can also use NEFT by depositing cash at an NEFT-enabled bank branch. Such customers must provide additional information, including their complete address and telephone number.\n\nThe RBI has capped these cash-based transfers at \u20b9 50,000 per transaction.", "source": "LiveMint Money", "pub_date_str": "18 Nov 2026, 08:58 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Dalmia Bharat to consider share buyback at Nov 23 board meeting", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Dalmia Bharat to consider share buyback at Nov 23 board meeting Dalmia Bharat Share Price The Ramco Cements Share Price India Cements Share Price Orient Cement Share Price KCP Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Dalmia Bharat to consider share buyback at Nov 23 board meeting SECTIONS Dalmia Bharat to consider share buyback at Nov 23 board meeting PTI Last Updated: Nov 18, 2026, 08:58:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Dalmia Bharat, India's fourth-largest cement manufacturer, will hold a board meeting on November 23. The meeting will focus on a proposal for a buyback of fully paid-up equity shares. Specific details regarding the buyback size, price, and number of shares have not been disclosed yet. The company also plans to expand its cement capacity to 75 million tonnes per annum by FY28.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "18 Nov 2026, 08:58 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Target reports strongest quarterly sales gain in five years heading into the holiday shopping season", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Target reports strongest quarterly sales gain in five years heading into the holiday shopping season Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Target reports strongest quarterly sales gain in five years heading into the holiday shopping season SECTIONS Target reports strongest quarterly sales gain in five years heading into the holiday shopping season By AP Last Updated: Nov 18, 2026, 08:55:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Target reported a 7.1% increase in net sales for the third quarter, reaching $27.07 billion. The growth was attributed to a revitalized product lineup, expanded same-day deliveries, and price cuts. CEO Michael Fiddelke indicated that the sales momentum was observed across various income groups. The company aims to enhance clothing and home goods offerings while working on women's apparel and footwear.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "18 Nov 2026, 08:55 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "\u2018GTA VI\u2019 publisher Take-Two jumps as gamers relish blockbuster release", "full_content": "As \"Grand Theft Auto VI\" begins its global rollout on Wednesday, gamers and critics are applauding the blockbuster release. And so is Wall Street.\n\nShares of Take-Two Interactive , the owner of the studio behind GTA VI, jumped more than 6% in premarket trading, with investors betting that glowing reviews from critics and players will propel sales and boost the company's bookings and revenue this year.\n\nDemand has been feverish - with players doing everything from taking several days of paid time off to signing \"contracts\" with their partners to get uninterrupted game time.\n\nHere are more details on the expected revenue impact for Take-Two:\n\nWells Fargo expects GTA VI to sell about 65 million units in its current fiscal year that runs through March, up from its prior forecast of 35 million units. The brokerage's estimate is also boosted by expectations for a potential PC release of the game early in 2027\n\nIt lifted its annual bookings forecast by 19% to $9.76 billion, versus a consensus estimate of $8 billion from LSEG data, and Take-Two's own projection of $8 billion to $8.20 billion. Brokerage Oppenheimer estimates about $1.85 billion in gross revenue in the first three days, compared with the $1 billion recorded by predecessor GTA V, released more than 13 years ago.\n\nA Sensor Tower tracker estimates roughly 17.1 million units have been sold as of early Wednesday, far exceeding pre-order volumes of all the biggest game releases in recent history", "source": "CNBC Top News", "pub_date_str": "18 Nov 2026, 08:52 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Anthropic IPO: AI lab considers increasing the offering as investor demand surges", "full_content": "Anthropic is considering upsizing its IPO, people familiar with the details told CNBC, as the artificial intelligence lab weighs setting the price well above $80.\n\nThe company closed its order books and locked in total demand on Tuesday, setting the stage for the Claude creator's eagerly awaited Nasdaq listing. Institutional demand for the offering is around $400 billion, while retail demand is approaching $100 billion, according to the people, who asked not to be named because they were not authorized to speak publicly.\n\nThe orders are indications of interest and are not binding. All of the details are subject to change, and Anthropic will make final decisions on Wednesday afternoon, the people said. Anthropic is expected to set its final IPO price after market close on Wednesday.\n\nDemand for the offering is higher than it was for Elon Musk's SpaceX , even though the rocket maker had a bigger market offering. SpaceX debuted on the Nasdaq in June in by far the biggest IPO on record, ultimately raising $85.7 billion.\n\nThe AI lab said last week that it would offer 825 million shares in the IPO at a price range between $70 and $78 per share, which would net up to $64.35 billion at the high end of that range.\n\nAnthropic's listing is a major test for the AI industry, which has experienced a set of recent shocks, including a dramatic backlash that was felt at the polls in the midterm elections and last week's ouster of Nvidia CEO Jensen Huang . The market was already jittery on concerns that rising interest rates will make debt unaffordable for many data center developers and neoclouds.\n\nTech's biggest companies have significant exposure to Anthropic, whether as an investor, partner or customer. Amazon and Google both own stakes valued at over $100 billion, and a group of tech companies, including Google, Microsoft , Nvidia and Advanced Micro Devices agreed to collectively invest $26 billion in the IPO.", "source": "CNBC World Economy", "pub_date_str": "18 Nov 2026, 08:49 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "India\u2019s youngest demat account holder is 6 days old: SEBI rules for opening accounts for minors", "full_content": "Parents can open a demat account in the name of a newborn or minor child to hold investments for their future. However, the Securities and Exchange Board of India ( SEBI ) has prescribed specific rules governing who can operate these accounts, the role of guardians and the transactions permitted in a minor's name.\n\nA six-day-old girl from New Delhi recently became India's youngest known demat account holder after her family completed the necessary documentation within a week of her birth, according to a CNBC-TV18 report.\n\nThe development has brought attention to the rules governing demat accounts for minors and the steps parents must follow before opening one.\n\nSEBI permits demat accounts to be opened in the name of minors, including newborns. However, such accounts must be operated by a guardian until the child turns 18.\n\nUnder SEBI's guidelines, the father can act as the guardian. In his absence, the mother can take up the responsibility. If both parents are absent, a guardian appointed by a court can operate the account.\n\nA minor cannot be a joint holder in another demat account. The minor must be the sole account holder, with the guardian managing the account on their behalf.\n\nParents need to complete the prescribed identity verification and documentation process before opening a demat account for their child.\n\nOpening a demat account for a minor does not allow parents to trade shares freely on the child's behalf.", "source": "LiveMint Money", "pub_date_str": "18 Nov 2026, 08:48 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "The key S&P 500 level Wall Street is watching", "full_content": "The benchmark ended Tuesday's session at 7,340.53, just under its 200-day average of 7,346.64. The next move may be lower.", "source": "CNBC Top News", "pub_date_str": "18 Nov 2026, 08:46 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Fed\u2019s Waller says central bank may need to \u2018shock people\u2019 with half-point rate hike", "full_content": "Federal Reserve Governor Christopher Waller on Wednesday called for aggressive action against inflation , saying the central bank needs to \"shock people\" as prices continue to rise more than he expected.\n\nIn the near term, the policymaker told CNBC in a live interview that a half percentage point increase in the Fed's benchmark rate is probably necessary at the Dec. 8-9 meeting of the Federal Open Market Committee.\n\nHe said the central bank needs to reverse the three quarter-point reductions from last year and may need to do more.\n\n\"I'm very, very concerned about inflation. It's kind of headed in the wrong direction, and it's spreading out,\" Waller told CNBC's Steve Liesman during a \" Squawk Box \" interview. \"If you really want to get it down, you've got to start taking more aggressive actions.\"\n\nFutures prices are fully pricing in a quarter percentage point hike at the FOMC's December meeting. They also are anticipating another move in January, followed by at least one additional increase before the end of 2027, according to the CME Group's FedWatch gauge.\n\nWaller said the Fed wouldn't necessarily have to approve a half-point hike in December if it raised rates by a quarter point and signaled another move coming in January. However, Fed Chairman Kevin Warsh has been against that kind of forward guidance on grounds that it ties policymakers' hands.\n\n\"If you're not going to signal this very clearly to markets, you're going in January, my view is then you have to go 50 [basis points] in December to put it in place and get it done,\" he said.\n\nRecent statements from other central bankers indicate a range of opinions , though most agree that more policy tightening is needed to bring down inflation.", "source": "CNBC Finance", "pub_date_str": "18 Nov 2026, 08:43 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Fixed Income", "Derivatives", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Two new housing reports point to bleak winter ahead, with record low sales", "full_content": "Two new reports on the housing market show activity slowing even more, after a September spike in mortgage rates sent it into a deep freeze.\n\nPending home sales in October dropped 4.7% month-over-month and were down 16.7% from October of last year, according to the National Association of Realtors. This is the lowest level in the index's 25-year history.\n\nAnalysts had been looking for a much smaller decline, likely because mortgage rates pulled back slightly in October, only to rise sharply again last week. The average rate on the 30-year fixed started October at 7.54% according to Mortgage News Daily and ended the month at 7.27%.\n\nThe pending count is based on signed contracts \u2014 people out shopping and signing deals during the month. It is therefore an indicator of future closed sales.\n\n\"Two consecutive months of record-low pending contracts point to very sluggish fourth-quarter home sales closings, and annual existing-home sales could be the lowest since the mid-1990s,\" said Lawrence Yun, NAR's chief economist in a release.\n\nRegionally, sales were down across the nation with the sharpest drops in the South, which is usually busiest for sales and the West which is most expensive.\n\nAnother report released Wednesday showed gains in home construction in October but raised a red flag going forward. Single-family housing starts rose 4% from September, according to the U.S. Census, but were down 3.2% year over year. Building permits, an indicator of future construction, dropped 8.7% for the month and were down 12.9% from October 2025. That is the lowest level for permits since May 2020, the start of the Covid-19 pandemic.\n\n\"Builders are dealing with a litany of obstacles to selling homes, whether it's rising costs of land, labor, and materials, high financing costs, or weak buyer demand,\" wrote Joel Berner, senior economist at Realtor.com.", "source": "CNBC Top News", "pub_date_str": "18 Nov 2026, 08:39 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "India on track to hit $1 trillion exports target in FY27: Commerce Secretary", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a India on track to hit $1 trillion exports target in FY27: Commerce Secretary The Economic Times daily newspaper is available online now. Read Today's Paper India on track to hit $1 trillion exports target in FY27: Commerce Secretary SECTIONS India on track to hit $1 trillion exports target in FY27: Commerce Secretary ET Online Last Updated: Nov 18, 2026, 08:37:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India's exports increased by 16.6% in the first half of this fiscal year. The country aims to reach $1 trillion in exports by 2026-27. Commerce Secretary Rajesh Agrawal stated that India is on track to meet this goal. Despite global trade uncertainties, India continues to be viewed positively as a trusted trading partner. India achieved record exports of $863 billion in the previous fiscal year.\n\nWhy IndiGo could land a sharp rebound in profit despite a sluggish aviation market\n\nKYC and KYB: Pidilite\u2019s business has more tailwinds than headwinds, but a continuous test called raw material prices \u2013 Concluding part\n\nGold still rules, but with a difference: How young India is redefining wedding jewellery\n\nTariffs, supply snags and a war: 6 sectors that pulled it off through all of the trouble\n\nHow India\u2019s INR22.5 lakh crore gold loan boom is hiding a big hole\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers", "source": "Economic Times Economy", "pub_date_str": "18 Nov 2026, 08:37 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Nvidia\u2019s Kress faces a divided workforce as some employees push for Huang\u2019s return", "full_content": "The day before Colette Kress led her first earnings call as Nvidia's interim CEO, she did not want to talk about her predecessor, Jensen Huang .\n\n\"This is a new era for Nvidia,\" she told employees in an internal meeting on Monday, according to a person present, who spoke on the condition of anonymity. When someone brought up Huang, Kress quickly changed the subject, according to the person.\n\nOn Wednesday, Kress is due to address the whole company at the first Nvidia all-hands meeting since the public chaos over Huang's affair with an alleged Chinese spy and other reported relationships. And while Kress will be tasked with filling the leadership vacuum created by Huang's departure, she is also expected to tamp down public calls to bring him back.\n\nHuang himself weighed in with his first public statement Tuesday saying he would be \"honored\" to return to Nvidia.\n\nThe interim CEO, who has served as the company's CFO since 2013, must steady employees and convince customers and investors that Nvidia can execute on its ambitious targets without the man who made them. For those at the top, that has meant making clear that the company does not plan to bring Huang back.\n\n\"The board has determined that they will not reinstate Jensen,\" Kress said in an interview with CNBC's Jim Cramer on Tuesday. \"We want to grow in terms of everything that we need to do with our employees, our customers, our shareholders, and that is where we are going to focus moving forward.\"\n\nHarvey Jones, the newly appointed chair of Nvidia's board, echoed the sentiment on Tuesday's earnings call. \"The Nvidia board unanimously accepted his resignation and does not intend to reinstate Jensen as CEO,\" he said in opening remarks.\n\nKress stressed on the earnings call that the company was focused on the workers who remain, who she said are \"committed to doing their life's work at Nvidia.\" The company also reported better-than-expected earnings and seemed to calm investors' nerves , at least for the moment.", "source": "CNBC World Economy", "pub_date_str": "18 Nov 2026, 08:35 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Assetz IPO gets SEBI nod; Bengaluru realty developer reportedly plans to raise \u20b91,200 crore", "full_content": "Market regulator SEBI has cleared the decks for Bengaluru-based real estate developer Assetz Ltd to proceed with its IPO plans, months after the company confidentially filed its draft offer documents.\n\nThe market regulator, on November 17, issued its observations on the company's draft red herring prospectus (DRHP), allowing it to proceed with the IPO within the next 18 months.\n\nSEBI's observations are a key regulatory requirement for companies seeking to launch public issues, including initial public offerings (IPOs). As part of the process, the regulator reviews the draft offer document, such as a Draft Red Herring Prospectus (DRHP), and issues its observations based on the review.\n\nThese observations may require the issuer to make certain changes or provide additional disclosures before proceeding with the public issue.\n\nThe latest development comes after Assetz filed its preliminary IPO papers with SEBI in August through the confidential filing route.\n\nA confidential filing allows companies to submit draft offer documents to the regulator for review without making them immediately available to the public, helping protect sensitive information, including financial details and business strategies, during the initial stages of the IPO process.\n\nThe company is reportedly looking to raise \u20b9 1,200 crore through its IPO, according to media reports. Mint has not independently verified the proposed fundraising size.\n\nThe regulatory clearance also comes at a time when sentiment in the Indian stock market has improved amid easing inflationary pressures following a sharp decline in crude oil prices.", "source": "LiveMint Markets", "pub_date_str": "18 Nov 2026, 08:34 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Nvidia's Colette Kress tells Cramer: Employees and customers are not going anywhere", "full_content": "Nvidia's customers and employees remain committed to the company despite last week's abrupt departure of longtime leader Jensen Huang . That's the message interim CEO Colette Kress conveyed exclusively to CNBC's Jim Cramer shortly after the AI chip giant delivered a quarterly beat and strong guidance.\n\n\"[Hyperscalers] are the ones that are right now feverishly looking for more focus in terms of the compute that we have available,\" Kress said on \" Mad Money .\" \"This concept that anything is changing in terms of any of our types of customers \u2014 that is just not true. They are all continuing to be with us, and we have a very deep breath of different customers.\"\n\nKress' comments came after Nvidia reported better-than-expected quarterly earnings and revenue and bumped up its fiscal 2028 revenue growth estimate to 75% from the previous 70%. It was the first earnings report since Huang's resignation as CEO amid a widening affair scandal. Shares rose nearly 4% in after-hours trading as the results helped ease concerns about the chipmaker's outlook following the leadership shake-up.\n\nSome on Wall Street have wondered whether Huang's departure would prompt certain Nvidia customers to lean harder into their in-house designed chips and/or competitors such as Advanced Micro Devices .\n\nDuring the \"Mad Money\" interview Tuesday evening, Kress emphasized that major customers have continued expressing interest in the company's products. \"I have seen already with many of these [customers] contacting me and saying, 'Great to see everything intact. Great to see that there's more supply. I need more demand.'\"\n\nCustomer demand, however, wasn't the only issue facing Nvidia. Huang's departure has also raised questions about whether the chipmaker can retain the engineers and other employees who helped build its dominance in artificial intelligence.", "source": "CNBC World Economy", "pub_date_str": "18 Nov 2026, 08:30 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Fed\u2019s Waller says interest-rate hikes may be needed to \u2018shock\u2019 inflation out of the system", "full_content": "The central bank might need to hike interest rates by a full percentage point or more to cool down inflation, Federal Reserve governor Christopher Waller said Wednesday.", "source": "MarketWatch Top Stories", "pub_date_str": "18 Nov 2026, 08:30 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Nasdaq gains in choppy trade as Nvidia outlook lifts AI mood; Anthropic pricing awaited", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a Nasdaq gains in choppy trade as Nvidia outlook lifts AI mood; Anthropic pricing awaited Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Nasdaq gains in choppy trade as Nvidia outlook lifts AI mood; Anthropic pricing awaited SECTIONS Nasdaq gains in choppy trade as Nvidia outlook lifts AI mood; Anthropic pricing awaited ETMarkets.com Last Updated: Nov 18, 2026, 09:43:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Amidst a choppy trading session, the Nasdaq enjoyed a boost from Nvidia's positive revenue guidance, which alleviated some market apprehensions. Conversely, the Dow Jones Industrial Average and S&P 500 stumbled, affected by falling stock values in finance and healthcare. Investors are now focused on Anthropic's upcoming IPO, which could signal the market\u2019s enthusiasm for AI ventures.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "18 Nov 2026, 08:29 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "SIP investment: Patience pays as staying invested for 10 years could help you avoid losses\u2014what 21-year study revealed", "full_content": "Staying invested for the long haul rather than reacting to every market correction could make a significant difference for mutual fund investors, with a new study by Motilal Oswal Mutual Fund finding that longer systematic investment plans (SIPs) have historically resulted in fewer negative returns, reported Fortune India.\n\nThe study, which analysed more than 21 years of market data between April 2005 and October 2026, found that the likelihood of an SIP ending in losses declined as the investment period increased from five years to seven and 10 years.\n\nThe findings offer an important perspective for investors who consider discontinuing their monthly investments when markets remain volatile, or returns stagnate. The analysis covered four major equity indices \u2014 Nifty 100, Nifty Midcap 150, Nifty Smallcap 250 and Nifty 500, across multiple market cycles.\n\nOne of the most significant findings was the sharp reduction in negative-return observations as the investment horizon increased.\n\nFor five-year SIPs , negative returns were recorded in 1% of observations for the Nifty 100, 2% for the Nifty Midcap 150, 10.5% for the Nifty Smallcap 250 and 2% for the Nifty 500.\n\nHowever, the picture improved considerably for investors who remained invested for 10 years.\n\nOver a 10-year investment period, SIPs in the Nifty 100, Nifty Midcap 150 and Nifty 500 did not register any negative-return instances. The Nifty Smallcap 250, meanwhile, saw losses in only 0.7% of the observations.\n\nThe research also found that the improvement was not limited to reducing the frequency of losses. The minimum returns recorded across the four indices improved as the investment duration increased.", "source": "LiveMint Money", "pub_date_str": "18 Nov 2026, 08:24 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Fixed Income", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "US Stock Market Today: Nasdaq Snaps 4-Day Selloff As Nvidia Earnings Beat Refuels AI Bulls; Dow In Red", "full_content": "Nvidia's stronger-than-expected earnings and upbeat revenue outlook lifted technology stocks, helping the Nasdaq break its four-session losing streak even as the Dow remained under pressure.", "source": "NDTV Profit", "pub_date_str": "18 Nov 2026, 08:18 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "This $500-Million Microsoft Deal Could Give ByteDance A Way Around OpenAI's China Ban", "full_content": "Microsoft is reportedly in talks to sell an additional $500 million in cloud services to ByteDance, potentially giving the Chinese tech giant access to OpenAI models despite restrictions on Chinese firms.", "source": "NDTV Profit", "pub_date_str": "18 Nov 2026, 08:14 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Con l Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Anthropic likely to price IPO above the current range of $70 to $78, sources tell CNBC", "full_content": "Anthropic is slated to list on the Nasdaq under the ticker symbol \"ANT\" and start trading on Nov. 19.", "source": "CNBC World Economy", "pub_date_str": "18 Nov 2026, 07:16 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Real estate firm Assetz gets Sebi nod to float Rs 1,200-cr IPO", "full_content": "Assetz Ltd has obtained approval from Sebi to proceed with its plans for an initial public offering. The company aims to raise around Rs 1,200 crore in this IPO process. Assetz has developed a substantial land bank and project pipeline to meet housing demand in Bengaluru. With strong backing from investors like AGP Partners, the firm is expanding its presence in key markets.", "source": "Economic Times Markets", "pub_date_str": "18 Nov 2026, 06:54 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Kotak MF, BlackRock, others buy stake worth Rs 1,905 cr in Groww", "full_content": "Kotak Mahindra Mutual Fund (MF) led the buying spree, acquiring 2.05 crore shares or a 0.33 per cent stake, for Rs 448.95 crore, making it the biggest buyer in the transaction.", "source": "Economic Times Markets", "pub_date_str": "18 Nov 2026, 06:52 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Dow tumbles over 500 pts as Nvidia-led AI relief fails to lift broader market: Stock Market Live Updates", "ful  "total_stories": 295};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
