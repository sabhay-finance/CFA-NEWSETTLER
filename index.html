omantically involved with Alice Huang, an executive at cloud company Megaspeed , according to The Financial Times , who U.S. intelligence officials believe is a spy for China.\n\nThe New York Times on Wednesday reported that Huang had another extramarital relationship with Kimberly Powell, vice president of health care at Nvidia. Powell reports to Huang, according to the Times.\n\nNvidia shares over the past five days. Before Huang resigned, several Wall Street analysts told CNBC that this departure could lead the stock to fall 20%, given how critical he has been to Nvidia's success. Nvidia's stock is already down more than 20% over the last month.\n\nBernstein on Thursday slashed its price target on Nvidia's stock by half from $400 to $200.\n\nStacy Rasgon, a senior analyst at Bernstein, told CNBC's \"Squawk Box Asia\" on Thursday that Huang's alleged affair with a direct report means it is \"much tougher for the board to leave him in position.\"", "source": "CNBC World Economy", "pub_date_str": "13 Nov 2026, 01:12 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Stocks making the biggest moves Thursday: Super Micro Computer, Nvidia, CoreWeave, Nebius, Yeti & more", "full_content": "Nvidia was front and center once again on Thursday, after Jensen Huang resigned from his post as CEO on the heels of another extramarital affair.\n\nCoreWeave dipped as traders cashed in some of their chips following the stock's massive gains a day earlier. Fellow neocloud play Nebius tumbled after lifting its 2026 forecast for capital expenditures spending.\n\nFollow along as CNBC highlights the biggest stock market moves of the day.\n\nThe maker of data center servers fell on Thursday after Bloomberg News reported, citing a person familiar, that the Justice Department is looking into whether Alice Huang helped smuggle Super Micro Computer's products.\n\nSuper Micro Computer on Thursday Alice Huang is the woman with whom former Nvidia CEO Jensen Huang had had an affair . U.S. intelligence officials also believe her to be a Chinese spy.\n\nAustin, Texas-based Yeti Holdings sank 8%, extending a three-day decline, after third-quarter adjusted revenue of $517.9 million missed Wall Street analyst estimates of $523 million and the cooler and travel mug maker lowered full-year forecasts for earnings per share excluding one-time items, adjusted revenue and adjusted operating income.\n\nYeti has now tumbled 14% in three days and more than 22% in the past three months.\n\nThe New Jersey-based neocloud provider sank almost 8%, one day after soaring 25% in the wake of better-than-expected third-quarter results.", "source": "CNBC Top News", "pub_date_str": "13 Nov 2026, 01:05 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Jensen Huang's Nvidia exit casts shadow over Wall Street\u2019s $500 billion AI financing bet", "full_content": "Leadership change at Nvidia has the potential to threaten financing of the artificial intelligence boom and test Jensen Huang's $500 billion vision to turn AI chips into tradable debt securities.\n\nThe Nvidia CEO's resignation was announced Thursday following revelations that he had two extramarital affairs \u2014 one with an employee and the other with a woman believed by U.S. intelligence to be a Chinese spy .\n\nNvidia. Shares in the tech giant \u2014 which has become central to the AI build-out in recent years \u2014 initially plunged more than 13% following Huang's resignation, before paring losses.\n\nNvidia has never identified a successor to Huang, who has led the chipmaker since its founding in 1993. Colette Kress, chief financial officer, has been named interim CEO.\n\nFollow CNBC's live coverage of Nvidia CEO Jensen Huang's resignation\n\nThe company has been dubbed the \"central bank\" of the AI build-out, with Huang seen as the \"hypeman\" for the sector and its chips considered the industry's gold standard.\n\nHuang's departure raises a central question: whether his successor can carry forward a financing strategy designed to transform GPUs from rapidly depreciating hardware into bankable infrastructure assets\n\nThe $4.2 trillion firm's industry dominance, with Huang front and center, allowed it to sign memorandums of understanding with some of Wall Street's biggest asset managers, intended to secure third-party capital for a landmark $500 billion AI financing drive .", "source": "CNBC Top News", "pub_date_str": "13 Nov 2026, 01:03 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Gold drops to over one-year low as fading Middle East peace hopes fan inflation fears", "full_content": "Nov 12 (Reuters) - Gold prices slid 3% on Thursday, extending losses for a third straight session to hit a more-than-one-year low, as oil prices climbed on fading hopes for peace in the Middle East that spurred fears of higher inflation and elevated interest rates.\n\nSpot gold dipped 2.7% to $3,880.93 per ounce by 1:53 p.m. ET (1855 GMT), having touched its lowest level since October 2025 earlier in the session.\n\nUS gold futures for December delivery settled 2.9% lower at $3,885.30 per ounce.\n\nUS President Donald Trump said on social media that the US did not need a deal with Iran, quashing hopes of a deal to end the conflict.\n\nOil rose, fanning inflationary concerns and expectations that the US Federal Reserve could keep interest rates higher for longer.\n\n\"Higher energy prices continue to warrant a hawkish Fed, and a hawkish Fed is an environment of higher interest rates and hence a headwind for the yellow metal,\" David Meger, director of metals trading at High Ridge Futures, said.\n\nA hot US inflation reading on Tuesday, hawkish remarks from Fed officials this week and a US dollar rally to a near 19-month high \"are working to press the gold market lower,\" said Jim Wyckoff, a market analyst at American Gold Exchange.\n\nTraders see an 87% chance of a 25-basis-point rate hike in December, while the probability of a larger 50-basis-point move also increased.", "source": "LiveMint Markets", "pub_date_str": "13 Nov 2026, 12:50 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Quantitative Methods", "Economics", "Derivatives", "Alternative Investments"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "In a policy switch, the Fed says its October 2027 meeting will not see a vote on interest rates", "full_content": "The Federal Reserve won't vote on a potential interest-rate change at its October 2027 meeting, a departure that is part of a broader initiative from Chairman Kevin Warsh aimed at reducing the central bank's market footprint.\n\nAccording to an announcement Thursday, the rate-setting Federal Open Market Committee will set aside its Oct. 26-27 session for \"the discussion of broad monetary policy strategy issues.\"\n\nWarsh announced the move at his news conference after the FOMC met in October, though he did not specify which meeting would be affected.\n\nIn 2027, there will be seven voting meetings, with the October session set up as extra time for policy deliberation without a formal vote or post-meeting statement. The new calendar shows that the final meeting of the year will now take place in November. It had previously been set for December.\n\n\"Now, what's the reasoning behind this change? To me, it's quite straightforward,\" the chairman said in explaining his rationale. \"Getting policy right involves assessing near-term developments at timely, regular, and information-rich intervals.\"\n\n\"But it's equally important we reserve time and space, as an intellectually diverse group, for strategic deliberations\u2014for thinking anew about big questions, looking out over longer time horizons, focusing, as I say, on the left side of the decimal point,\" he said.\n\nWarsh has been critical of the Fed's prior communications strategy, saying policymakers spent too much time providing guidance on policy moves that handcuffed them when it came time to make decisions.\n\nUnder typical practice, the Fed meets eight times a year, following with a vote on interest rates and then a news conference from the chair.", "source": "CNBC Finance", "pub_date_str": "13 Nov 2026, 12:35 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Oil prices rise after Trump says no Iran deal needed: 'We've got their Strait'", "full_content": "U.S. oil prices rose Thursday, as comments from President Donald Trump stoked worries that an end to the U.S.-Iran war was not in sight.\n\nBrent crude traded 1.9% higher at $94.48 per barrel. West Texas Intermediate futures were up 2% at $88.19 per barrel.\n\n\"We don't need a deal with Iran. Those days have long since passed. We've got their money, Hundreds of Billions of Dollars, and we've got their Strait!\" Trump said in a Truth Social post .\n\nJeffrey Currie, founder of Real Macro and a widely followed forecaster on Wall Street, said oil prices in the near term will remain tame because there is now a substantial amount of volume coming out of the Middle East. However, he noted that sky-high insurance and tanker rates are keeping prices elevated on longer-dated oil futures contracts.\n\n\"While it caps the prompt barrel, it does nothing to cheapen the next one, which is why you can't get bearish here nor can you get really bullish,\" said Currie to CNBC's \"The Exchange.\"\n\nOn the investing front, Currie said he still favors long-dated oil and the drilling and producer stocks.\n\nBrent and WTI- YTD Thursday's moves come as oil prices have been under pressure after comments from Trump following the U.S. midterm elections eased fears of further strikes on Iran. WTI is down 16% in November, and Brent has lost 20%.\n\nTrump said Sunday that fresh attacks were highly unlikely as talks to end the conflict progressed, despite both \u2060countries reporting that shipping had been hit in or near the Strait of Hormuz. He also said further military action did not appear necessary \"at this point,\" easing concerns about prolonged disruptions to Middle East oil supplies.", "source": "CNBC Finance", "pub_date_str": "13 Nov 2026, 12:34 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Kalshi ends Donald Trump Jr's advisory contract due to Polymarket conflict", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Kalshi ends Donald Trump Jr's advisory contract due to Polymarket conflict Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Kalshi ends Donald Trump Jr's advisory contract due to Polymarket conflict SECTIONS Kalshi ends Donald Trump Jr's advisory contract due to Polymarket conflict Reuters Last Updated: Nov 13, 2026, 12:16:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Prediction-market platform Kalshi has ended Donald Trump Jr.\u2019s advisory role by mutual agreement after his venture-capital firm, 1789 Capital, increased its investment in rival Polymarket. Discussions began after 1789 Capital led Polymarket\u2019s latest funding round, according to a Kalshi spokesperson.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "13 Nov 2026, 12:16 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Rail Vikas Nigam in focus today after mixed Q2 performance; stock down 68% from record peak", "full_content": "A Ksheerasagar Published 13 Nov 2026, 12:13 AM IST Prefer Livemint on Google Shares of Rail Vikas Nigam (RVNL) are expected to attract investor interest during Friday's trade, November 13, after the railway major reported its financial performance for the September quarter (Q2 FY27) post-market hours on Thursday.\n\nThe company reported a net profit of \u20b9 253.71 crore in Q2 FY27, registering a growth of 10% year-on-year (YoY) compared to \u20b9 230.52 crore in Q2 FY26. The growth in profitability came despite a decline in revenue, supported by a reduction in expenses during the quarter.\n\nRevenue from operations declined by 8.24% YoY to \u20b9 4,701 crore in Q2 FY27 from \u20b9 5,123 crore in the corresponding quarter of the previous financial year.\n\nOn the operating front, RVNL reported an operating profit of \u20b9 264 crore in Q2 FY27, marking an increase of 19.51% compared to \u20b9 221 crore in Q2 FY26, indicating an improvement in operating performance despite the decline in revenue.\n\nFor the first half of FY27 (H1 FY27), RVNL reported a net profit of \u20b9 413.23 crore, registering a growth of 13.25% compared to \u20b9 365 crore in H1 FY26.\n\nHowever, revenue from operations remained almost flat during the six-month period at \u20b9 9,022 crore in H1 FY27 against \u20b9 9,032 crore in H1 FY26, registering a marginal decline of 0.11% YoY.\n\nOn the operating front, the railway major reported a significant improvement, with operating profit increasing by 62.29% to \u20b9 448.60 crore in H1 FY27 compared to \u20b9 276.43 crore in the corresponding period of the previous financial year. The strong growth in operating profit indicates an improvement in operating profitability during the first half of FY27.\n\nThe shares have been falling steadily since May and have closed each following month in red, losing 40% through the October close. However, the stock saw renewed momentum in November, surging 14% so far.", "source": "LiveMint Markets", "pub_date_str": "13 Nov 2026, 12:13 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "U.S. inflation is already bad enough. It might get worse.", "full_content": "Federal Reserve Chairman Kevin Warsh has vowed the Fed will smite high inflation \u2014 but the death blows won\u2019t come fast or easy.", "source": "MarketWatch Top Stories", "pub_date_str": "13 Nov 2026, 12:09 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Who is Colette Kress? Nvidia's finance chief steps in as interim CEO after Huang exit", "full_content": "Nvidia Chief Financial Officer Colette Kress, a 13-year company veteran, is taking the helm of the world's most valuable chipmaker on an interim basis after Jensen Huang's sudden resignation.\n\n\"She's the only one internally that has this significant respect,\" Dan Ives, an analyst at Yorkville Ives & Co., told CNBC before the news had been made official. \"She's more than just a CFO. I'd almost view her as more of a COO.\"\n\nFollow CNBC's live coverage of Nvidia CEO Jensen Huang's resignation\n\nNvidia hasn't announced a succession plan and said the board is considering internal and external candidates.\n\nKress joined Nvidia in September 2013, after holding finance roles at Cisco , Microsoft and Texas Instruments . At Nvidia, Kress has been the other big voice on earnings calls, reporting the company's results and taking questions alongside Huang.\n\n\"NVIDIA's strength has always come from its people, and together with our leadership team, I am committed to building on the extraordinary foundation Jensen created over the last 33 years,\" Kress said in Thursday's statement . \"We will continue advancing the work that has made NVIDIA a leader in accelerated computing and AI, and execute on the opportunities ahead. Our focus remains on serving our customers, partners, developers and shareholders.\"\n\nHuang, who co-founded Nvidia in 1993, was known for running the company with no clear second-in-command, personally deciding which projects are a priority and emailing engineers about details.\n\nBut when it came to Kress, \"Jensen didn't do anything without her,\" Ives said. \"She's a Swiss Army knife for Nvidia. Anything strategically: customers, partners, technology. She was involved.\"", "source": "CNBC World Economy", "pub_date_str": "13 Nov 2026, 12:06 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Nvidia options traders bank on longer-term stock recovery", "full_content": "NEW YORK, - Options traders cashed in parts of their bets against Nvidia and positioned for a longer-term share price recovery on Thursday, after CEO Jensen Huang announced he was stepping down.\n\nHuang's departure has raised uncertainty over the future direction of the AI chipmaker he built into one of the world's most valuable companies. Chief Financial Officer Colette Kress will serve as interim CEO as the company searches for a permanent successor.\n\nThe leadership turmoil sent options volatility soaring on Thursday, but options trading suggested that investors were repositioning for a recovery rather than fleeing the stock.\n\n\"Nvida's competitive advantage and customers don't disappear overnight,\" said Seth Hickle, chief investment officer at Mindset Wealth Management. \"The market is trying to determine whether this is a temporary leadership crisis or something that fundamentally changes the AI investment thesis.\"\n\nOptions give holders the right, but not the obligation, to buy or sell the underlying stock at a set price before a certain date. Call options typically gain value when the stock rises, while puts gain when it falls.\n\nSeveral large options trades showed investors rolling bullish positions further into 2027, lowering upside targets and taking profits on downside hedges rather than abandoning exposure to the company altogether, data from Chris Murphy, co-head of derivatives strategy at Susquehanna, showed.\n\nIn one trade, an investor sold put options and bought cheaper ones, collecting about $18.9 million while keeping some protection against a further drop, Murphy said.\n\nAnother investor paid about $18.8 million for call spreads, a bet that pays off fully if Nvidia climbs about 16% from current levels by March.", "source": "LiveMint Markets", "pub_date_str": "13 Nov 2026, 12:03 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments", "Derivatives", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Federal Reserve Board announces pricing, effective January 1, 2027, for payment services the Federal Reserve Banks provide to banks and credit unions, and changes to streamline and adjust their check services", "full_content": "Official websites use .gov A .gov website belongs to an official government organization in the United States.\n\nSecure .gov websites use HTTPS A lock ( Lock Locked padlock icon ) or https:// means you've safely connected to the .gov website. Share sensitive information only on official, secure websites.\n\nFor release at 1:30 p.m. EST Share --> --> --> --> --> --> The Federal Reserve Board on Thursday announced pricing, effective January 1, 2027, for payment services the Federal Reserve Banks provide to banks and credit unions, such as the clearing of checks, automated clearing house (ACH) transactions, instant payments, and wholesale payment and settlement services.\n\nBy law, the Federal Reserve must establish fees to recover the costs, including imputed costs, of providing payment services over the long run. The Federal Reserve expects to recover 101.5 percent of actual and imputed expenses in 2027, including the return on equity that would have been earned if a private-sector firm provided the services. Overall, price changes for 2027 will result in an estimated 1.4 percent average price increase for established, mature services.\n\nIn addition, the Federal Reserve Banks announced changes to streamline and adjust their check services. As described in the request for information on check services issued last year, the volume of checks processed by the Federal Reserve Banks is declining, but checks remain an important payment instrument for many consumers and businesses. The changes were informed by public feedback and ensure that the Federal Reserve Banks continue to provide check services efficiently. Th zing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "USPS plans 11% package fuel surcharge but no first-class stamp hike", "full_content": "The cash-strapped United States Postal Service said on Thursday it is seeking \u200bapproval for an 11% price hike for domestic priority mail and \u200cpackage deliveries in January to deal with rising fuel costs.\n\nUSPS, which needs approval from the Postal Regulatory Commission for the price increase, said it was not planning to hike the price of first-class stamps in January, which rose in July from 78 to 82 cents.\n\nThe surcharge is rising from a temporary 8% surcharge that was imposed in April. USPS said this week its transportation expenses in the 12 months ending September 30 rose by $225 million due to higher fuel costs.\n\nUSPS said it was proposing to hike overall domestic shipping services prices 5.9% on average and is raising prices by an average of 7.9% for international deliveries.\n\nUSPS asked Congress on Tuesday for $2 billion in support and reimbursements as its head warned \u200bthe agency would be forced to make significant cuts in retail post \u200coffices and other reductions unless lawmakers act.\n\nUSPS reported an annual $6.5 billion loss versus a net loss of $9 billion in the prior 12 months.\n\nThe \u200bnew Democratic-led Congress, which takes office in January, will need to decide whether \u200bto help the Postal Service after Republicans held a series of hearings \u2060over the last two years on its finances. USPS wants $2 billion from Congress for \u200bunfunded requirements it has imposed.\n\nThe agency has recorded net losses of more than $120 billion since \u200b2007. The volume of first-class mail, its most profitable product, fell this year to its lowest level since 1965 as consumers have moved to digital communication, while USPS must still pay for costly \u200bnationwide delivery.", "source": "CNBC Top News", "pub_date_str": "12 Nov 2026, 11:28 PM IST", s; economists see possibility of rate hikes", "full_content": "Mumbai's consumer price index-based retail inflation is projected to remain above 6 percent in upcoming months. This rise is attributed to increasing food prices, an adverse base effect, and commodity price impacts. Economists predict that retail inflation will average 6.2 percent in the October-December quarter of FY27. Heightened food prices and weather-related risks pose ongoing challenges for crop production.", "source": "Economic Times Economy", "pub_date_str": "12 Nov 2026, 09:32 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Economics", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}], "updated_at": "13 Nov 2026, 02:28 AM IST", "total_stories": 300};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
