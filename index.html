es of R Systems International Ltd are among the beaten-down stocks on Dalal Street. It has shed 30% YTD and about 34% over the past year.\n\nAccording to stock market experts, R Systems International shares are rising today due to buzz around IT and IT-enabled stocks. The Nifty IT index surged up to 4% during the intraday trade, led by a TCS Q2FY27 results-fueled rally in large-cap IT stocks. This also triggered buying in IT-enabled stocks. R Systems International Ltd, being an IT-enabled company, is benefiting from the buzz in IT shares, said experts. They said that R Systems International shares are on the cusp of a technical breakout. After the breakout, we can expect the R Systems International share price to touch \u20b9 358 soon.\n\nHighlighting the reason for the rally in the R Systems International Ltd share price today, Anuj Gupta, a SEBI-registered market expert, said, \u201cR Systems International Ltd is an IT-enabled company. It is benefiting from the buzz around IT stocks, fueled by TCS's Q2 results. The company's fundamentals are also strong, as it received an AA\u2212 (Stable) rating from the rating agency ICRA on Thursday.\u201d\n\nExpecting the rally to continue, Mahesh M Ojha, VP \u2014 Research and Business Development at KC Securities, said, \u201cR Systems International share price is on the cusp of giving a technical breakout at \u20b9 298. On breaking above this level on a closing basis, we can expect R Systems International share price to touch \u20b9 358 in the near term.", "source": "LiveMint Markets", "pub_date_str": "09 Oct 2026, 11:59 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Tata Technologies stock jumps 30% in 6 months, up 6% today: Should you buy now? Check target, support levels", "full_content": "Tata Technologies share price : Tata Technologies shares rallied on Friday, October 9, attracting investor attention after a recent correction. The stock's near-term technical setup has improved, but its performance across different time frames remains mixed. Investors are now watching whether the recovery can sustain and what levels could determine the stock's next move.\n\nThe stock gained 6% to \u20b9 736.50 per share on the BSE during the session.\n\nTata Technologies had touched a 52-week high of \u20b9 890.15 in August 2026 before declining to a 52-week low of \u20b9 507.50 in March 2026. Although the Tata Group stock has recovered from its lows, its recent performance has been uneven. It has fallen 8% in one month, gained 2% over three months and risen 30% in six months. Over the past year, however, the stock has remained largely flat, with a gain of just 1%.\n\nTata Technologies shares have rebounded sharply, drawing attention to key technical levels that could determine whether the recovery gains further momentum. Analysts have identified crucial support zones and resistance levels for investors to watch as the stock attempts to strengthen its upward trend.\n\nJigar S Patel, senior manager of technical research at Anand Rathi Share and Stock Brokers, said Tata Technologies had bounced back from the \u20b9 680\u2013700 support zone, which coincides with the 200-day double exponential moving average (DEMA).\n\n\u201cThe key level to watch is \u20b9 700. If the stock sustains above this level and witnesses fresh buying interest, it could strengthen the possibility of a recovery towards \u20b9 800 in the near term,\u201d Patel said.\n\nHe cautioned that the stock needs to maintain strength above this zone to confirm a positive reversal.", "source": "LiveMint Markets", "pub_date_str": "09 Oct 2026, 11:56 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Global Market: Maas Group shares plunge 11% after Nvidia-backed Firmus scraps $5 billion IPO", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Global Market: Maas Group shares plunge 11% after Nvidia-backed Firmus scraps $5 billion IPO Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market: Maas Group shares plunge 11% after Nvidia-backed Firmus scraps $5 billion IPO SECTIONS Global Market: Maas Group shares plunge 11% after Nvidia-backed Firmus scraps $5 billion IPO By Anupam Nagar , ETMarkets.com Last Updated: Oct 09, 2026, 11:56:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Maas Group shares plunged nearly 11% after Nvidia-backed Firmus withdrew its planned $5 billion IPO, raising valuation concerns. Despite the setback, contracts worth A$1.1 billion remain intact, providing revenue visibility amid uncertainty over Firmus's funding strategy and AI infrastructure valuations.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "09 Oct 2026, 11:56 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Russia's internet giant Yandex halts operations at major data center after drone attack", "full_content": "Russian internet giant Yandex suspended operations at one of its key data centers on Thursday after a drone strike as Ukraine continues to target the country's infrastructure.\n\nThe attack caused a fire at the company's data center in Sasovo, Ryazan, in western Russia, and affected part of its infrastructure, Yandex said in a statement to CNBC. The data center has stopped operating entirely, and some Yandex services may be unavailable to users, it added.\n\n\"We are still assessing the extent of the damage to our infrastructure. At this stage, we cannot confirm whether the equipment at our Sasovo data center can be restored,\" they said on Friday.\n\nIt confirmed that there are no casualties and emergency services are on site dealing with the aftermath.\n\nMoscow-headquartered Yandex, known as the Google of Russia, provides the country's most widely used search engine. It also developed the region's leading generative AI model, YandexGPT.\n\nAlthough Ukraine has not claimed responsibility for the Yandex attack, it has been stepping up its attacks on Russian infrastructure, including energy, over recent months, such as targeting Russian oil refineries , which President Volodymyr Zelenskyy has said are used to \"finance the war and the killing of Ukrainians.\"\n\nUkraine also increased attacks on Russian retail giant Wildberries , a critical part of the consumer infrastructure.\n\nLast week, Zelenskyy said the country will double down on its attacks on Russian oil refineries in response to a new policy of airstrikes from Moscow designed to force people to leave Kyiv and other cities.", "source": "CNBC World Economy", "pub_date_str": "09 Oct 2026, 11:54 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Ray Dalio warns the stock market's cushion against rising bond yields is shrinking", "full_content": "Billionaire investor Ray Dalio warned on Thursday that stocks face mounting pressure from rising bond yields and the prospect of weaker corporate cash flows, even as earnings continue to grow.\n\nThe Bridgewater Associates founder told CNBC equities have so far weathered the global bond sell-off because earnings growth has kept expected stock returns attractive, relative to bonds. But that advantage will narrow, he said, potentially leaving equities more vulnerable as financial conditions tighten.\n\n\"We're in the part of the cycle where interest rates can rise without sending the equity market down because there's enough earnings growth and there's enough expected return,\" Dalio told CNBC's Sri Jegarajah at the Milken Institute Asia Summit in Singapore on Thursday.\n\n\"But when that cushion comes down, then you're coming later into that cycle. So that's where we are.\"\n\nHis warning comes as U.S. Treasury yields hover near multi-decade highs. Investors are grappling with large government deficits, persistent inflation and rising borrowing tied to artificial intelligence investment.\n\nDalio said equities entered the current cycle offering significantly higher expected returns than bonds, helping sustain demand for stocks even as borrowing costs rose.\n\nBut as stock prices climb and bond yields increase, that relative advantage is diminishing, leaving less room for equities to absorb higher rates.\n\n\"Because of that change in pricing, that cushion has come down, and so now you're starting to see credit spreads start to widen,\" he said.", "source": "CNBC Top News", "pub_date_str": "09 Oct 2026, 11:46 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Stock Market Today LIVE: Sensex Jumps 800 Points, Nifty 50 Above 22,500 Led By IT, Banks; TCS, Wipro, HCL Tech Lead", "full_content": "Global market cues remain weak as Asian markets traded lower and the US stock market declined overnight, weighed down by selloff in technology stocks.", "source": "NDTV Profit", "pub_date_str": "09 Oct 2026, 11:40 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "15,410% rally in 5 years! Multibagger Cupid shares jump 3% to hit fresh 52-week high", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a 15,410% rally in 5 years! Multibagger Cupid shares jump 3% to hit fresh 52-week high Cupid Share Price The Economic Times daily newspaper is available online now. Read Today's Paper 15,410% rally in 5 years! Multibagger Cupid shares jump 3% to hit fresh 52-week high SECTIONS 15,410% rally in 5 years! Multibagger Cupid shares jump 3% to hit fresh 52-week high By Debaroti Adhikary , ETMarkets.com Last Updated: Oct 09, 2026, 11:38:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Cupid shares jumped hit a fresh 52-week high of Rs 368 on Friday, extending their rally for a fourth straight session. Earlier this month, Cupid raised its FY27 revenue and profit guidance for the second time in less than two weeks, targeting revenue of Rs 800 crore and net profit of Rs 250 crore for the financial year.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "09 Oct 2026, 11:38 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Viral Video: Thailand Queen Suthida Makes First Solo Flight In Fighter Jet", "full_content": "The King of Thailand Maha Vajiralongkorn presented Queen Suthida with flowers and the special Gripen Order Golden Patch, a gold-embroidered insignia awarded to pilots who have successfully flown the Saab JAS 39 Gripen fighter jet.", "source": "NDTV Profit", "pub_date_str": "09 Oct 2026, 11:35 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Why is Broadcom stock falling despite strong AI demand?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News Powered By Why is Broadcom stock falling despite strong AI demand? Written by Anupam Nagar , ETMarkets.com | Oct 09, 2026, 11:50:23 AM IST 1 / 6 Broadcom shares fall despite strong AI demand Broadcom shares fell around 2.1% as selling across AI-related stocks outweighed optimism from TSMC\u2019s record quarterly revenue. Investors remained concerned about elevated expectations for AI growth. (Sources: GuruFocus, TradingView, Barron's)\n\nReports that Broadcom was exploring more than $50 billion in debt financing linked to OpenAI\u2019s custom AI chip purchases raised questions about the financial risks associated with large-scale AI infrastructure investments.\n\nTSMC reported third-quarter revenue of T$1.49 trillion, up 50% year-on-year. However, the strong performance failed to trigger a broader rally in AI stocks as investors weighed the sustainability of AI spending.\n\nBroadcom expects fourth-quarter AI semiconductor revenue of $21.7 billion, compared with $16.7 billion in the previous quarter. Meeting this target will be crucial to sustaining investor confidence in its AI growth story.\n\nReports about OpenAI\u2019s revenue outlook revived concerns over whether the company\u2019s income can keep pace with its ambitious spending plans. The concerns contributed to selling pressure across AI-related stocks.\n\nInvestors will track Broadcom\u2019s AI chip demand, revenue growth and execution against its forecasts, alongside developments in OpenAI\u2019s financing plans. The sustainability of AI infrastructure spending remains a key factor for the stock. (Disclaimer: This slideshow is based on inputs from agencies. These do not represent the views of The Economic Times.)", "source": "Economic Times Markets", "pub_date_str": "09 Oct 2026, 11:35 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Two people spend \u20b930,000 on credit cards, but one may have a lower credit score. Here's why it happens", "full_content": "You may spend \u20b9 30,000 on your credit card every month and see your credit score take a hit, while a friend spending the same amount sees no such impact. The difference could lie in your respective credit limits, which determine how much of your available credit you are using.\n\nThis is where your credit utilisation rate comes into play. If you have multiple credit cards at once, the utilisation rate is calculated across them collectively, rather than being assessed separately for each card.\n\nLet's say you and your friend each spend \u20b9 30,000 on your credit cards every month. Your friend has a total credit limit of \u20b9 1 lakh, while you have a limit of \u20b9 50,000. Your credit utilisation rates would be 30% and 60%, respectively.\n\nDespite spending the same amount, you have a higher credit utilisation rate, which could negatively affect your credit score.\n\nCredit utilisation rate refers to the percentage of a person's available credit limit that they are using at a given time. It is calculated by dividing that person's outstanding credit card balance by their total available credit limit.\n\nLending institutions are very particular about this metric. They closely monitor a borrower's credit utilisation ratio because consistently higher utilisation may indicate financial stress or a reliance on credit to meet day-to-day expenses, even if the borrower usually pays their bills on time.\n\nCredit utilisation is one of the factors reflected in credit assessments, with lenders and credit bureaus such as TransUnion CIBIL , Experian and CRIF High Mark. A lower credit score can affect your ability to secure future loans, the credit limit offered to you or the interest rate on such borrowings.\n\nHence, keeping your credit utilisation ratio below 30% is generally recommended to maintain a healthy credit score. Exceeding this threshold can negatively affect your score, particularly if high utilisation persists over time.", "source": "LiveMint Money", "pub_date_str": "09 Oct 2026, 11:32 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Gold Corrects Over 24% From Peak: Should You Consider Gold ETFs?", "full_content": "You may consider gold investment if it isn\u2019t already a part of your portfolio since it acts as a diversification tool and typically protects during uncertain economic conditions.", "source": "NDTV Profit", "pub_date_str": "09 Oct 2026, 11:24 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments", "Portfolio Management"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Hexaware Technologies share price surges 12%, up for 5th consecutive session - What's next for the stock? Experts decode", "full_content": "Hexaware Technologies shares surged as much as 12% in intraday trade on the BSE on Friday, 9 October, with a strong spurt in volume. Hexaware Technologies share price opened at \u20b9 533 against its previous close of \u20b9 510.85 and jumped 12.4% to an intraday high of \u20b9 574.45, looking set to extend gains for the fifth consecutive session. The stock witnessed a more than 9.83 times spurt in volume in Friday's session.\n\nThe jump in stock prices on Friday followed the company's announcement of a multi-year partnership with Anthropic on Thursday, 8 October. Under the partnership, Hexaware\n\nbecomes a preferred partner in Anthropic\u2019s Claude Partner Network.\n\n\"Hexaware has more than 1,100 Claude-certified professionals. Hexaware and Anthropic will work together on go-to-market, joint solution development, and customer deployments, and Hexaware will expand Claude training across its delivery teams,\" said the company.\n\nThe stock is up 13% over the last six months, compared to a 6% fall in equity benchmark Sensex and a 10% decline in the BSE IT index.\n\nYear-to-date, however, the stock is down 29% compared to a 15% drop in Sensex and a 26% decline in the BSE IT index.\n\nThe stock hit a 52-week high of \u20b9 808.40 on 4 December last year and a 52-week low of \u20b9 400.35 on 12 March this year.\n\nAccording to Aditya Thukral, founder and analyst at AT Research and Risk Managers, Hexaware Technologies has been in a downtrend with the formation of lower highs and lower lows.", "source": "LiveMint Markets", "pub_date_str": "09 Oct 2026, 11:23 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Chipotle shares rally: What investors should know about the Starbucks deal", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News Powered By Chipotle shares rally: What investors should know about the Starbucks deal Written by Anupam Nagar , ETMarkets.com | Oct 09, 2026, 11:27:23 AM IST 1 / 5 \u200bChipotle stock jumps Chipotle Mexican Grill shares rallied after reports that Starbucks was considering a potential acquisition of the burrito chain. The speculation revived investor interest in Chipotle, although a formal offer has not been confirmed. Any transaction would represent a major development for the restaurant industry.(Sources: Investopedia, Trefis)\n\nThe reported takeover interest has drawn attention to Starbucks CEO Brian Niccol, who led Chipotle from 2018 to 2024. Niccol played a key role in strengthening Chipotle's growth strategy before joining Starbucks. A potential acquisition could bring the executive back to the restaurant chain he once headed, although the strategic rationale and execution risks remain important considerations.\n\nThe takeover speculation comes after a difficult period for Chipotle shares, which have faced pressure from slower sales growth, rising operating costs and concerns about consumer demand. According to Trefis, the stock had fallen about 17% from its September 14 high as of October 7, 2026. The latest rally has offered some relief, but a sustained recovery will depend on business performance and further developments surrounding the reported deal.\n\nTrefis examined nine historical instances in which Chipotle shares fell at least 20% over 30 trading days and had sufficient subsequent performance data. The stock was higher a year later in six of those cases, with a median one-year return of 21%. However, investors who bought after these declines experienced a median further drawdown of 25% before the recovery.", "source": "Economic Times Markets", "pub_date_str": "09 Oct 2026, 11:17 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Apollo, Max Health, other hospital stocks rally up to 5% despite cancer drug price caps. Why Jefferies stays bullish", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Apollo, Max Health, other hospital stocks rally up to 5% despite cancer drug price caps. Why Jefferies stays bullish Fortis Healthcare Share Price Max Healthcare Institute Share Price Aster DM Quality Care Share Price Narayana Hrudayalaya Share Price Global Health Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Apollo, Max Health, other hospital stocks rally up to 5% despite cancer drug price caps. Why Jefferies stays bullish SECTIONS Apollo, Max Health, other hospital stocks rally up to 5% despite cancer drug price caps. Why Jefferies stays bullish By Veer Sharma , ETMarkets.com Last Updated: Oct 09, 2026, 11:32:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Hospital stocks rose up to 5% after the government capped trade margins on non-scheduled anti-cancer drugs at 30%, potentially reducing medicine prices by 70%. Jefferies and Emkay expect manageable earnings impacts, despite near-term margin pressures. Jefferies favours Fortis, Manipal, Apollo, Max Healthcare and Medanta, citing strong demand and attractive valuations.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "09 Oct 2026, 11:14 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Up 15,400% in 5 years, multibagger stock Cupid hits record high - What's fuelling the rally? Check outlook, stop loss", "full_content": "Cupid share price : Cupid shares extended its rally on Friday, October 9, climbing more than 3% to a fresh record high of \u20b9 368 on the BSE. The stock has gained in seven of the past eight trading sessions, rising 39% during this period.\n\nThe multibagger stock has delivered extraordinary returns across time frames. It has surged around 230% in 2026 so far and advanced 656% over the past year. Over five years, Cupid shares have skyrocketed 15,400%.\n\nThe recent momentum has also been strong, with the stock gaining 16% in one week, 30% in one month, 73% in three months and 292% in six months.\n\nThe rally comes after the company signalled robust business momentum for the September quarter of FY27 and raised its revenue and profit guidance for the full financial year.\n\n\u201cThe FY27 outlook has been revised upward,\u201d the company said, citing expectations of continued business momentum in the third and fourth quarters, improved visibility across institutional and private markets, growth in its domestic FMCG business, progress towards operationalising the Palava facility, and sustained expansion across its healthcare and personal care portfolio.\n\nCupid, a Nashik-based personal care company with an international healthcare business, expects its total revenue for Q2FY27 to exceed \u20b9 200 crore, according to an exchange filing dated September 30, 2026.\n\nThe company said sustained growth across its major business segments and better visibility in domestic and international markets had prompted it to raise its FY27 revenue guidance to \u20b9 800 crore and net profit guidance to more than \u20b9 250 crore.", "source": "LiveMint Markets", "pub_date_str": "09 Oct 2026, 11:13 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "\u20b966 lakh tax penalty over son\u2019s \u20b91.1 crore flat: How senior citizen won ITAT relief", "full_content": "A property investment intended to help a family secure a home turned into a tax dispute for a senior citizen in Navi Mumbai after her son included her as a joint owner of a flat purchased for \u20b9 1.10 crore. The Income Tax Department treated two documents relating to the same property as separate purchases and subsequently made a \u20b9 2.20 crore addition to her taxable income.\n\nHowever, the Mumbai bench of the Income Tax Appellate Tribunal (ITAT), in an order dated 23 September 2026, granted relief to the senior citizen after finding that the same property transaction had been counted twice.\n\nJaishri Pande, a senior citizen with no independent source of income, had not filed an income tax return for the relevant assessment year. The tax authorities initiated scrutiny after the Risk Management System (RMS) flagged two entries relating to property transactions , each valued at \u20b9 1.10 crore.\n\nThe entries were dated 18 September and 5 November 2015. The assessing officer (AO) treated them as two separate purchases and reopened her assessment. A notice under Section 148 of the Income Tax Act, 1961, was issued on 26 March 2023. On 29 February 2024, the AO completed the reassessment and added \u20b9 2.20 crore as an \u2018unexplained investment\u2019. The department also imposed penalties totalling about \u20b9 66.2 lakh.\n\nPande's appeals were initially rejected because they were filed late. Before the tribunal, she explained that the notices had been sent to her old address, recorded in her PAN details and had not reached her.\n\nShe said she learnt of the tax demands and discrepancies only on 4 February 2026 and acted promptly thereafter.\n\nAfter reviewing the circumstances, the ITAT accepted her explanation for the delay, condoned it and proceeded to examine the case on its merits.\n\nThe tribunal concluded that the agreement for sale registered on September 18, 2015, and the deed of assignment executed on November 5, 2015, pertained to the same flat in CBD Belapur, Navi Mumbai.", "source": "LiveMint Money", "pub_date_str": "09 Oct 2026, 11:13 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "KEC International Share Price Jumps Over 4% After Order Win; Kotak Upgrades To 'Add'", "full_content": "KEC International said its Transmission & Distribution (T&D) business has secured orders for 400 kV Transmission line in Bhutan and an additional order for a 380 kV Transmission line in Saudi Arabia.", "source": "NDTV Profit", "pub_date_str": "09 Oct 2026, 11:11 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Thermax Share Price Jumps Over 6% After Kotak Securities Upgrades It To 'Buy'", "full_content": "Thermax's emerging businesses are in focus after Kotak Securities upgraded the stock to Buy from Sell. The brokerage expects the hydrogen offering to contribute to revenue from FY28", "source": "NDTV Profit", "pub_date_str": "09 Oct 2026, 11:04 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Hedge funds as systemic risks", "full_content": "And another word on inflation-linked bonds", "source": "FT Markets", "pub_date_str": "09 Oct 2026, 11:00 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "SIPs may slow, but investors unlikely to give up without a significant correction: Kalpen Parekh", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nSIP flows have proved remarkably resilient, but that resilience could be tested if equities disappoint for years, says Kalpen Parekh, MD & CEO of DSP Mutual Fund. He said, \u201cFlows are difficult to forecast, and if an asset class disappoints investors for five, six or seven years, some of that resilience could weaken.\u201d\n\nWhile some investors may stop SIPs as tenures end or returns disappoint, a steady stream of new investors continues to enter, helped by rising employment and stronger faith in SIPs and equities.\n\n\u201cSIP growth may not continue at the pace of the last five years, but I don\u2019t expect investors to give up unless we see a significant market correction.\u201d\n\nFor markets, Parekh sees the bigger risks in a sharp spike in global interest rates or oil prices, particularly if the West Asia war escalates. Barring that, valuations across banks, insurance and technology have come closer to fair value, allowing the fund house to deploy money in these segments.\n\nOne-year returns are random. Can be anything - high/low/negative.\n\nAt the same time, the economy is doing fine. Auto and cement sales are rising, power demand is steady, and there is spare capacity in the economy. These suggest that demand is healthy without creating excessive pricing pressure. The key risks are a sharp rise in global interest rates or oil prices, particularly if the West Asia war escalates. Otherwise, valuations have already come closer to fair value in banks, insurance cos, tech etc and we are able to deploy money in these segments.\n\nAround 90% of investors have monthly cash flows, so their investments also tend to be monthly, or SIPs. If you are in the accumulation phase, this phase is allowing you to increase the number of units purchased every month. For a collector of units, early phase correction is a blessing. As a fund house, our intent is to create investors, not consumers.", "source": "LiveMint Markets", "pub_date_str": "09 Oct 2026, 10:45 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Global Market: BoE\u2019s Pill says central banks must stay focused on fighting inflation", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a Global Market: BoE\u2019s Pill says central banks must stay focused on fighting inflation Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market: BoE\ epublicans in midterms The Economic Times daily newspaper is available online now. Read Today's Paper Fuel, fertiliser costs strain American farmers' support for Republicans in midterms SECTIONS Fuel, fertiliser costs strain American farmers' support for Republicans in midterms By AFP Last Updated: Oct 09, 2026, 10:34:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Farmers in the Midwest United States face surging diesel and fertiliser costs which are outpacing their incomes. The sector has seen diesel prices climb by 67 percent while fertiliser prices, at times, have seen steep price jumps. This comes amid trade along the Strait of Hormuz being disrupted by the US' conflict with Iran. Trade wars with China and Canada has also worsened the US agricultural market, raising doubts over their continued support for the Republican Party.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\nWhat is the real impact of 13x jump in cash transfers to women?\n\nThe NBFC saga - Part 2: Line drawn in 2006 is reason for the headlines today\n\nAirlines Q2 turbulence: Fewer passengers, rising fares and a crude shock\n\nBritannia\u2019s next big bet for young India lies beyond biscuits\n\nThe world is witnessing a bond rout. Why should it matter to you?\n\nQ2 earnings season: Will it settle or add to confusion in the stock market?", "source": "Economic Times Economy", "pub_date_str": "09 Oct 2026, 10:29 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Fixed Income"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Sensex, Nifty crash wipes off Rs 30 lakh crore from Dalal Street in less than 6 weeks. What can trigger a rebound?", "full_content": "The Indian stock market has undergone a significant downturn, with nearly Rs 30 lakh crore wiped off its market capitalisation. Contributing factors include surging oil prices and elevated bond yields. Experts predict that any potential rebound hinges on the health of the broader economy. Additionally, Foreign Institutional Investors have been notably offloading their equities, while technical indicators display a cautious outlook as Nifty struggles against ongoing bearish trends.", "source": "Economic Times Markets", "pub_date_str": "09 Oct 2026, 10:19 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments", "Fixed Income"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Steel Authority: SAIL shares rebound after falling for two sessions amid market rally | Target, stop loss for investors", "full_content": "PSU stock SAIL opened at \u20b9168 per share on NSE today, as compared to previous close of \u20b9166.25 on Thursday.", "source": "LiveMint Markets", "pub_date_str": "09 Oct 2026, 10:17 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Gold prices rise Rs 1,500/10g; silver up Rs 3,100/kg ahead of US economic data, softer yields. Buy, sell or hold?", "full_content": "Gold and silver prices gain on MCX as a weaker US dollar and easing Treasury yields support bullion. Investors assess inflation risks and the Federal Reserve\u2019s rate outlook, while traders track key support and resistance levels.", "source": "Economic Times Markets", "pub_date_str": "09 Oct 2026, 10:14 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Fixed Income", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Nifty IT becomes rocket! 3% up; Check TCS, Infosys, Wipro, Mphasis, HCL, Oracle, Tech Mahindra, Coforge performance", "full_content": "Nifty IT jumped over 3% in the morning trade, with TCS leading the charge, surging almost 6%. On Thursday, TCS reported Q2 revenue of \u20b973,188 crore, up 11.20% year-on-year (YoY). Consolidated net profit rose by 15% YoY to \u20b913,884 crore.", "source": "LiveMint Markets", "pub_date_str": "09 Oct 2026, 10:13 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Why is stock market up today? 'Good Friday' for Sensex, Nifty - 5 biggest contributors to D-Street party", "full_content": "Indian markets rebounded Friday as easing oil prices and reduced immediate fears of US strikes on Iran lifted sentiment after a sell-off that erased over \u20b910 lakh crore. IT stocks led gains following strong TCS results.", "source": "LiveMint Markets", "pub_date_str": "09 Oct 2026, 10:07 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "The Friday test: Will Nifty extend its historic losing streak to nine weeks?", "full_content": "Indian equity markets are facing the prospect of a ninth consecutive weekly downturn amid multiple challenges. This week alone, the Nifty index has dropped by around 0.8% following a significant slide. Factors such as foreign selling, surging crude oil prices, and a depreciating rupee have dampened market sentiment. Technical analyses reveal bearish patterns, raising alarm among investors. Financial institution executives express concern over possible future market trends and investor reactions.", "source": "Economic Times Markets", "pub_date_str": "09 Oct 2026, 09:49 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "US bank earnings in focus as Treasury yields surge, raising concerns over lending and dealmaking", "full_content": "US bank stocks face a critical earnings test as investors assess whether rising Treasury yields, higher deposit costs and slower dealmaking could offset profit growth at the six largest lenders.", "source": "Economic Times Markets", "pub_date_str": "09 Oct 2026, 09:48 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis", "Fixed Income"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Fusion CX sets price band for Rs 702 crore IPO; issue opens on October 14", "full_content": "Fusion CX has set a price band of Rs 275\u2013289 per share for its Rs 702 crore IPO, which will open on October 14 and close on October 16. The issue comprises a fresh issue worth Rs 500 crore and an offer for sale (OFS) of Rs 202 crore. Allotment is expected on October 19, with shares scheduled to list on the BSE and NSE on October 22, 2026.", "source": "Economic Times Markets", "pub_date_str": "09 Oct 2026, 09:45 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}], "updated_at": "09 Oct 2026, 01:02 PM IST", "total_stories": 354};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>

</body>
</html>
