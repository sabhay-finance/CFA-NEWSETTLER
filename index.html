: "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stocks Slide on Nvidia Troubles, Oil Edges Lower: Markets Wrap - Bloomberg.com", "full_content": "Stocks Slide on Nvidia Troubles, Oil Edges Lower: Markets Wrap Bloomberg.com Nasdaq-100 futures slide, dragged lower as Nvidia sell-off resumes: Live updates CNBC Anthropic\u2019s Giant IPO Will Tie It Closer to Nvidia The New York Times Nvidia selloff deepens, adding to AI jitters Reuters Anthropic, Nvidia, CoreWeave, Take-Two, D-Wave, Securitize, and More That Explain Today\u2019s Market Barron's", "source": "Google News Business", "pub_date_str": "12 Nov 2026, 12:29 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Derivatives"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "CAMS, CDSL, Geojit Financial Services: Buy or hold? Capital market stocks rise up to 4%; do you own? Targets, stop-loss", "full_content": "CAMS GEOJITFSL GROWW Asit Manohar Published 12 Nov 2026, 12:20 PM IST Prefer Livemint on Google Stocks to buy | Shares to buy: Amid a rising stock market, capital stocks witnessed strong buying on Thursday. Capital markets' major CDSL share price opened today at \u20b9 1416 and touched an intraday high of \u20b9 1461, recording an over 4% intraday rise. CAMS share price today opened at \u20b9 723.50 per share and touched an intraday high of \u20b9 755.30 apiece on the NSE. Shares of Geojit Financial Services , Groww , and others also saw buying interest during Thursday's session.\n\nAccording to stock market experts, capital market companies are expected to leap frog once there is trend-reversal on Dalal Street. They said that one should look at the monopoly companies like CDSL, whose business is expected to rise with the rise in demat account holders. They said that companies like Geojit Financial Services, Groww, etc., are expected to see good business, but they may not outperform the segment or generate alpha returns. So, for a long-term investor, CDSL is best suited, whereas for a high ROE and mutual funds tailwinds, CAMS shares are better suited.\n\nUnveiling the investment strategy while choosing a capital market stock, Avinash Gorakshkar, Founder of Avinash Mentor Research, said, \u201cOne should look at the monopoly companies. Stocks like Geojit Financial Services, Groww are expected to give a good return but shares of CDSL and CAMS are expected to outperform the category and generate an aplpha return.\u201d\n\nGorakshakr said that investors looking for high ROE and mutual funds tailwind are advised to look at buying CAMS shares, while investors looking for long-term investment horizon, should look at CDSL shares.\n\nDecoding the technical chart pattern of CDSL shares, Mahesh M Ojha, VP \u2014 Research and Business Development at KC Securities, said, \u201cCDSL shares have strong support placed at \u20b9 1388. The stock is facing resistance at \u20b9 1480.", "source": "LiveMint Markets", "pub_date_str": "12 Nov 2026, 12:20 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Mahindra & Mahindra among 5 stocks showing White Marubozu Pattern", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News Mahindra & Mahindra among 5 stocks showing White Marubozu Pattern Written by Rounak Khare , ETMarkets.com | Nov 12, 2026, 12:05:36 PM IST 1 / 6 Stock Watch On November 11, five stocks in the Nifty500 with a change of more than 5% appeared on the \u2018White Marubozu\u2019 bullish scanner, according to StockEdge\u2019s technical scan data. A White Marubozu is a bullish candlestick pattern in technical analysis that occurs when the opening price is the lowest for a given period and the closing price is the highest.\n\nThe pattern is represented by a long white (or green) candlestick with no upper shadow and little or no lower shadow. It reflects strong upward price movement during the session, with the price moving from the opening level toward the session high by the close. The pattern is commonly studied in technical analysis as an indicator of price momentum.", "source": "Economic Times Markets", "pub_date_str": "12 Nov 2026, 11:59 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Who is Wing Commander Namrita Chandi? How did she win pension battle 15 years after retiring from Indian Air Force?", "full_content": "Retired Wing Commander Namrita Chandi, a Short Service Commission (SSC) officer of the Indian Air Force (IAF), spent years fighting a legal battle over the denial of Permanent Commission and the retirement benefits that followed.\n\nAlthough she had approached the authorities for Permanent Commission before completing her initial service tenure, her request was turned down, and she eventually retired in 2011. Her fight continued through the courts, with the case passing from the Delhi High Court to the Armed Forces Tribunal (AFT) and eventually reaching the Supreme Court.\n\nThe case did not end with the initial legal victory. Chandi also had to pursue the retirement benefits linked to her claim, particularly her eligibility for pension after completing the qualifying period of service.\n\nAs reported by The Tribune , the Chandigarh Bench of the Armed Forces Tribunal (AFT), Chandimandir (Panchkula), has now modified its earlier order in her case, bringing a long-running dispute over her service and pension entitlement to another significant stage.\n\nThe ruling comes nearly 15 years after Chandi retired from the Indian Air Force in 2011, following a prolonged legal battle over the denial of Permanent Commission.\n\nNamrita Chandi was commissioned into the Indian Air Force under the Short Service Commission in 1996. An SSC is a fixed-tenure commission that allows officers to serve in the armed forces for a specified period, unlike Permanent Commission, which offers a longer career in service.\n\nChandi was initially appointed for 10 years. Before completing that tenure, she sought Permanent Commission. However, her request was rejected on the grounds that the applicable provisions did not allow SSC officers in the flying branch to be granted Permanent Commission. Instead, she received a five-year extension and subsequently retired in 2011.\n\nChandi challenged the decision by filing a writ petition before the Delhi High Court in 2011.", "source": "LiveMint Money", "pub_date_str": "12 Nov 2026, 11:51 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "AICWA Seeks Maximum Screens for 'Pyre' After Vinod Kapri Alleges Nearly 75% Cut in Shows", "full_content": "AICWA seeks an investigation into Pyre's screen reduction following Ramayana's release and calls for fair opportunities for small films.", "source": "NDTV Profit", "pub_date_str": "12 Nov 2026, 11:48 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Indian bonds drift as US debt rout saps oil relief before CPI", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Bonds \u203a Indian bonds drift as US debt rout saps oil relief before CPI Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Indian bonds drift as US debt rout saps oil relief before CPI SECTIONS Indian bonds drift as US debt rout saps oil relief before CPI Reuters Last Updated: Nov 12, 2026, 11:46:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis On Thursday morning, Indian government bonds remained stable, reflecting a pause after recent volatility. Market sentiment is influenced by declining oil prices and climbing US Treasury yields, with inflation data on the horizon. The Reserve Bank of India is expected to modify its policy rate in light of these figures. Meanwhile, the ongoing Iran conflict could affect oil pricing, as traders prepare for a significant bond auction set for Friday.\n\nOn Thursday morning, Indian government bonds remained stable, reflecting a pause after recent volatility. Market sentiment is influenced by declining oil prices and climbing US Treasury yields, with inflation data on the horizon. The Reserve Bank of India is expected to modify its policy rate in light of these figures. Meanwhile, the ongoing Iran conflict could affect oil pricing, as traders prepare for a significant bond auction set for Friday.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "12 Nov 2026, 11:46 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Nvidia board meeting to decide CEO Jensen Huang\u2019s fate stretches into evening", "full_content": "Nvidia's board is meeting to decide whether to oust CEO Jensen Huang , CNBC confirmed late Wednesday, following reports of two extramarital affairs \u2014 one with an employee and another with an alleged Chinese spy. Shares of Nvidia fell more than 9% in post-market trading after The Wall Street Journal first reported that the board was preparing to force out Huang. That news landed minutes after The New York Times reported that Huang had a romantic relationship with Nvidia's vice president of health care.\n\nThe alleged relationship, according to the Times story, was with Kimberly Powell, vice president of health care at Nvidia. Powell's bio on the Nvidia website says she's \"responsible for the company's worldwide healthcare business, including hardware and software platforms for accelerated computing, AI, and visualization that power the ecosystem of medical imaging, life sciences, drug discovery, and healthcare analytics.\"\n\nHuang and Powell were reportedly captured on camera being affectionate with one another at a hotel in San Jose, California in March, according to the Times.\n\nNvidia and Powell didn't respond to CNBC's request for comment. Heller, the crisis PR firm Huang reportedly hired as early as last year, did not immediately respond to CNBC's request for comment.\n\nThe report comes days after Huang admitted to an affair with a woman who is believed by U.S. intelligence of being a Chinese spy. The CEO was romantically involved with Alice Huang, according to The Financial Times , who U.S. intelligence officials believe is a spy for China's Ministry of State Security, The New York Times reported.\n\nNvidia stock chart. Nvidia's board of directors has opened an independent investigation and hired the law firm Wachtell, Lipton, Rosen & Katz to look into the spying allegations.\n\n\"I was unfaithful to my wife. My actions hurt her and our children. There is no excuse for what I did,\" Huang wrote in the message to Nvidia staff on Sunday.", "source": "CNBC World Economy", "pub_date_str": "12 Nov 2026, 11:41 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Gold, silver prices today, 12 November: Check retail rates of 24K, 22K, 18K gold, 999 silver in Delhi, Mumbai, Bangalore", "full_content": "Gold, Silver rates today, 12 November: Gold prices slipped to over one-week low on Thursday amid strong United States inflation data, concern over the US Federal Reserve hiking interest rates, and a firm US Dollar, Reuters reported.\n\nSpot gold fell 0.2% to $3,977.99 per ounce by 0506 GMT, after touching its lowest since November 4 earlier; and US gold futures for December delivery dropped 0.4% to $3,983.20, the report said.\n\n\u201cThe (gold) market has had a meaningful pullback over the past several days in the wake of that US inflation data and the rise in rate hike expectations around that but I think the markets are pointedly struggling for a follow through,\u201d Ilya Spivak, head of global macro at Tastylive told the publication.\n\nAt the time of writing on 12 November, gold bullion was trading at \u20b9 1,39,510 per 10 grams, while Silver was at \u20b9 1,83,010 per kg, data on the bullion website showed.\n\nHere are gold and silver rates in key Indian cities on Thursday. Check the price of 18K, 22K and 24K gold and 999 Fine silver in Ahmedabad, Bengaluru, Chennai, Coimbatore, Delhi, Hyderabad, Kolkata, and Mumbai today as follows:\n\nThe gold price in Mumbai today, 12 November, was in line with the overall gold rate in India. The 24-karat gold price in Mumbai was \u20b9 1,39,250 per 10 grams. Meanwhile, the price of 22-karat gold in Mumbai was \u20b9 1,27,646 per 10 grams. On the other hand, the 18-karat gold rate in Mumbai was \u20b9 1,04,438 per 10 grams.\n\nThe silver price in Mumbai today, 12 November, was in line with the overall silver rates in India. The price of Silver 999 Fine in Mumbai was \u20b9 1,82,680 per kg.\n\nThe gold price in Delhi reflected the overall gold rates across India on 12 November. The 24-karat gold price in Delhi was \u20b9 1,39,010 per 10 grams. Meanwhile, the price of 22-karat gold in the national capital was \u20b9 1,27,426 per 10 grams, while the rate of 18-karat gold was \u20b9 1,04,258 per 10 grams.", "source": "LiveMint Money", "pub_date_str": "12 Nov 2026, 11:40 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Derivatives", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "16% up in a month! Bajaj Finance shares climb 3.4% on \u20b911,700 crore QIP launch | Check floor price, discount, returns", "full_content": "Vaamanaa Sethi Published 12 Nov 2026, 11:38 AM IST Prefer Livemint on Google Bajaj Finance shares surged as much as 3.48% in Thursday's trading session, after the non-banking financial company (NBFC) launched its \u20b9 11,700 crore qualified institutional placement (QIP). The stock has witnessed strong buying interest, gaining around 16% over the past month.\n\nBajaj Finance share price opened at \u20b9 1,078 apiece on NSE today and touched an intraday high of \u20b9 1,118 on November 12.\n\nBajaj Finance launched its \u20b9 11,700 crore QIP on November 11 to raise capital from eligible institutional investors. The company has set the floor price at \u20b9 992.25 per equity share, in accordance with the pricing formula prescribed under the Securities and Exchange Board of India (SEBI) regulations.\n\nThe indicative issue price has been fixed at \u20b9 1,025 per share, representing a discount of approximately 5% to the stock's previous closing price of \u20b9 1,078.80 on the NSE.\n\nThe company has also received approval to offer a discount of up to 5% on the floor price, subject to applicable regulations and shareholder approval. The final issue price will be determined in consultation with the book-running lead managers.\n\nThe proposed QIP is part of Bajaj Finance's broader \u20b9 17,500 crore fundraising plan, which also includes a \u20b9 5,800 crore preferential issue of warrants to its promoter and holding company, Bajaj Finserv.\n\nOn November 10, Bajaj Finance allotted approximately 5.74 crore warrants to Bajaj Finserv at an issue price of \u20b9 1,010 per warrant, aggregating nearly \u20b9 5,800 crore.\n\nThe proceeds from the QIP will primarily be utilised to repay deposits, loans, commercial papers (CPs) and non-convertible debentures (NCDs), along with interest obligations. The remaining amount will be used for general corporate purposes.", "source": "LiveMint Markets", "pub_date_str": "12 Nov 2026, 11:38 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Daily vs Monthly SIP: Does It Make Any Difference?", "full_content": "The impact on overall returns depends on market behaviour, the amount invested and the consistency of contributions.", "source": "NDTV Profit", "pub_date_str": "12 Nov 2026, 11:36 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "110% Return In 6 Months: This Defence Stock Hits Fresh High; Is There More Room To Rally?", "full_content": "Financially, Unimech Aerospace's net profit came in at Rs 31.8 crore in the September quarter of FY27, from Rs 15.7 crore in the September quarter of FY26.", "source": "NDTV Profit", "pub_date_str": "12 Nov 2026, 11:33 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Clean Max Enviro Energy shares jump 7%; stock trades 27% above IPO price \u2014 What\u2019s driving the rally? | Check key levels", "full_content": "Dhanya Nagasundaram Published 12 Nov 2026, 11:33 AM IST Prefer Livemint on Google Clean Max Enviro Energy Solutions shares climbed 7% on Thursday, 12 November, amid a broadly positive trend in the Indian stock market. The stock was trading at \u20b9 1,342.20, around 27% above its IPO price of \u20b9 1,053. The company made its stock market debut on the BSE and NSE on 2 March 2026. The stock has gained 2.10% over the past week, 3.41% over two weeks, 0.48% over a month, and 6.55% over the past six months.\n\nCleanMax reported a strong financial performance for the September quarter of FY27, with consolidated net profit rising 82.3% year-on-year to \u20b9 64.9 crore, compared with \u20b9 35.6 crore in the corresponding quarter last year.\n\nThe renewable energy company's total income increased 34.5% to \u20b9 750.9 crore during the July\u2013September period, up from \u20b9 558.1 crore in Q2 FY26, according to its regulatory filing dated 4 November.\n\nDuring the quarter, CleanMax also raised \u20b9 2,500 crore through India's first green bond issuance in the commercial and industrial (C&I) renewable energy sector. The bonds carry fixed coupons and have tenors of up to 10 years. Leading development finance institutions anchored the issuance, with participation from banks, mutual funds and other institutional investors.\n\nCleanMax operates as a pure-play C&I renewable energy company, catering to commercial and industrial customers. Its contracted renewable energy power sales portfolio stood at 6.3 GW as of 30 September 2026.\n\nOn 2 March, Clean Max Enviro Energy Solutions made a weak stock market debut, with its shares listing at a discount on both the NSE and BSE after its IPO received 94% subscription.\n\nOn the NSE, the shares opened at \u20b9 960 apiece, down 8.83% from the issue price of \u20b9 1,053. On the BSE, the stock debuted at \u20b9 952, reflecting a 9.57% discount.\n\nThe company raised \u20b9 3,100 crore through its IPO, priced in the range of \u20b9 1,000\u20131,053 per share, and open for subscription from 23 February to 25.", "source": "LiveMint Markets", "pub_date_str": "12 Nov 2026, 11:33 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Fixed Income", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Lemon Tree: IDBI Capital Sees Up To 37% Upside On Strong Q2 Earnings; Check Target Price", "full_content": "The brokerage continues to like Lemon Tree amongst the mid-scale hotels segment given its scale of operations and better operating margin compared to other mid-scale hotels.", "source": "NDTV Profit", "pub_date_str": "12 Nov 2026, 11:33 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "The AI megatrade\u2019s mounting portfolio concentration risk problem", "full_content": "There aren\u2019t enough baskets to safely cope with this many massive eggs", "source": "FT Markets", "pub_date_str": "12 Nov 2026, 11:30 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Nuvama Wealth share price: Brokerage stock up over 6% today, just 5% away from peak on strong Q2 results | Check target", "full_content": "Pranati Deva Published 12 Nov 2026, 11:09 AM IST Prefer Livemint on Google Nuvama Wealth Management shares rallied as much as 6.6% on Thursday, November 12, to hit an intraday high of \u20b9 1,963.95 on the BSE after the wealth management company reported a strong performance for the September quarter of FY27. The company posted a nearly 20% year-on-year increase in consolidated net profit, supported by growth across its wealth management, asset services and capital markets businesses.\n\nThe stock is now just 5% away from its record high of \u20b9 2,067, touched in July 2026. It had hit its 52-week low of \u20b9 1,097.25 in March 2026. Nuvama Wealth shares have gained 1% over the past month, 11.5% in three months, 22% in six months and 29% over the last one year.\n\nNuvama Wealth Management reported a 19.5% year-on-year increase in consolidated net profit to \u20b9 303.5 crore for the September quarter of FY27, compared with \u20b9 254 crore in the corresponding period last year. Revenue from operations increased 20.35% to \u20b9 1,366 crore in Q2 FY27 from \u20b9 1,135 crore a year earlier.\n\nThe company's wealth management business recorded 14% year-on-year revenue growth to \u20b9 501 crore during the quarter. Asset services revenue jumped 53% to \u20b9 245 crore, while revenue from the capital markets business increased 9% to \u20b9 175 crore.\n\nNuvama's client assets reached \u20b9 5.5 lakh crore, registering 25% growth year-on-year, reflecting continued expansion across its businesses.\n\nCommenting on the performance, Ashish Kehair, MD and CEO of Nuvama Group, said, \"We delivered another quarter of strong performance, with Q2 operating profits growing 26 per cent YoY and RoE remaining strong at 29 per cent.", "source": "LiveMint Markets", "pub_date_str": "12 Nov 2026, 11:09 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "How are ITC shares performing after Gold Flake Regular price hike by \u20b910 per pack? Should you buy stock? Experts views", "full_content": "Asit Manohar Published 12 Nov 2026, 11:08 AM IST Prefer Livemint on Google ITC shares witnessed some buying intere ets have a new playbook for mega-share debuts", "full_content": "Anthropic is gearing up for its highly anticipated IPO, aiming to raise as much as $64.4 billion with share prices ranging from $70 to $78. The company is targeting inclusion in major indexes soon after its debut, which is expected to boost passive investments. Similar to SpaceX's market entry, analysts forecast significant initial share price surges, with employees permitted to sell some of their shares on the opening day.", "source": "Economic Times Markets", "pub_date_str": "12 Nov 2026, 11:05 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Can anything derail Anthropic\u2019s IPO?", "full_content": "The start-up is forging ahead with its listing in the face of adversity for the broader AI trade", "source": "FT Markets", "pub_date_str": "12 Nov 2026, 10:30 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Russian diesel exports double after Trump lifts sanctions, but US gets none", "full_content": "Boost in shipments expected to be shortlived after Ukraine resumes attacks on refineries", "source": "FT Markets", "pub_date_str": "12 Nov 2026, 10:30 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Multibagger stock: Cupid shares jump 10% as profit soars 133% in Q2 results 2026; already up 262% in 2026 \u2014 What's next?", "full_content": "Cupid shares surged 10% to a 52-week high after strong Q2 FY27 results. First-half net profit rose 156% and revenue climbed 137%, supported by growing domestic consumer healthcare and FMCG sales. The firm raised its FY27\u2013FY29 targets, while expanding retail partnerships are expected to boost growth.", "source": "LiveMint Markets", "pub_date_str": "12 Nov 2026, 10:27 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Small-cap stock under \u20b9100: Roto Pumps shares jump 19% today, soar 28% in 4 days - What's fuelling the rally?", "full_content": "Roto Pumps shares rose 14% on November 12 after the company reported strong Q2 FY27 results. Consolidated net profit jumped 245.3% year-on-year to \u20b920.58 crore, while revenue climbed 54.65% to \u20b9100.15 crore. The board also approved a \u20b9110 crore loan facility for its wholly owned subsidiary.", "source": "LiveMint Markets", "pub_date_str": "12 Nov 2026, 10:22 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Indian shares bounce back as investors seek AI shelter", "full_content": "Nifty 50 is world\u2019s best-performing major market so far this quarter", "source": "FT Markets", "pub_date_str": "12 Nov 2026, 10:13 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "34% rise in a year! Why Hindustan Copper shares are rising 6% today? Check target, stop loss, returns", "full_content": "Hindustan Copper share price opened at \u20b9474 apiece on NSE today, as compared to previous close of \u20b9436.35 on Wednesday and touched an intraday high of \u20b9466.80 on 12 November.", "source": "LiveMint Markets", "pub_date_str": "12 Nov 2026, 10:13 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Nasdaq futures fall as Nvidia sinks 8% after hours on report board may oust Huang", "full_content": "Stock futures were sliding Wednesday evening as a selloff in shares of Nvidia after the closing bell weighed on the Nasdaq-100 and dragged down shares of other chip makers.", "source": "MarketWatch Top Stories", "pub_date_str": "12 Nov 2026, 10:11 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Equity Investments", "Derivatives"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Vishal Mega Mart among 5 stocks showing RSI trending up", "full_content": "Five Nifty500 stocks that gained over 4.5% on November 11 featured in StockEdge\u2019s RSI Trending Up scan, with their Relative Strength Index (RSI) crossing above 50 from below, signalling strengthening price momentum.", "source": "Economic Times Markets", "pub_date_str": "12 Nov 2026, 10:06 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Kalyan Jewellers shares hit 52-week high, rally 41% in 9 sessions; should you buy after Q2 results 2026? Check target", "full_content": "Kalyan Jewellers shares rose for a ninth straight session, hitting a 52-week high after Q2 FY27 net profit climbed 64% to \u20b9427 crore and revenue grew 32% to \u20b910,323 crore. Motilal Oswal retained its Buy rating, while technical analysts flagged potential gains and cautioned about consolidation.", "source": "LiveMint Markets", "pub_date_str": "12 Nov 2026, 09:57 AM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}], "updated_at": "12 Nov 2026, 01:59 PM IST", "total_stories": 314};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>

</body>
</html>
