sitive updates from Adobe and Oracle after the bell Thursday. Cramer said the reports breathed new life into beaten-down enterprise software and data center stocks, pointing to Dell , Vertiv , Cisco , Marvell , GE Vernova and Hewlett Packard Enterprise as potential beneficiaries. Cramer's Charitable Trust , the portfolio run by CNBC's Investing Club, owns shares of GE Vernova.\n\nWith few major earnings reports on tap, Cramer said next week's market action will largely hinge on oil prices and interest rates.\n\nThe first major variable is the war in Iran. Cramer said progress toward peace could send oil prices sharply lower, helping ease inflation and pressure on interest rates. But he warned renewed fighting could quickly reverse Friday's relief.\n\n\"If Iran decides to attack a carrier group with drone swarms, though, then oil will spike, interest rates fly up, and the stock market will get clobbered,\" he said.\n\nInvestors will also turn their attention to Salesforce's annual Dreamforce conference, which kicks off Monday in San Francisco. Cramer will interview CEO Marc Benioff on Wednesday and other executives at the event throughout the week.", "source": "CNBC Top News", "pub_date_str": "12 Sep 2026, 04:05 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Oracle posts 30% revenue growth fueled by AI cloud demand as debts hits $125 billion", "full_content": "Oracle shares whipsawed on Friday after the software company reported 30% revenue growth for the latest quarter, topping estimates, with sales fueled by strong demand for cloud infrastructure.\n\nThe stock popped after the open before later closing nearly 2% lower.\n\nFiscal first-quarter revenue increased to $19.35 billion, beating LSEG consensus estimates of $19.14 billion. ve relied on the East-West pipeline to shift crude oil exports away from Persian Gulf as the U.S. and Iran battle for control over the Strait of Hormuz. The pipeline, which has a capacity of 7 million barrels per day, runs across the kingdom to export terminals on the Red Sea.\n\nEmergency teams were deployed to secure the pipeline and assess its safety after Thursday's attacks, the Saudi Energy Ministry said. \"Any further developments will be announced in due course,\" the ministry said.\n\nRiyadh has decided to refrain from retaliating for now to give the Iraqi government time to take measures to prevent attacks from its territory, the Saudi Foreign Ministry said.\n\nSaudi Aramco CEO Amin Nasser said last month that the East-West pipeline has played a bigger role in mitigating the oil supply disruption caused by the Iran war than the release of emergency crude reserves.\n\nOil prices this week broke above $100 per barrel for the first time in months as fighting has escalated in the Middle East. The attack on the pipeline may have played a role in the rally as rumors about the strike circulated Thursday. Prices closed out the week more than 8% higher.\n\nIran-allied militants have stepped up attacks on Saudi Arabia in recent days. Houthi militants in Yemen launched strikes on the kingdom earlier this week that hit energy facilities and other civilian assets, injuring more than 70 people, the Saudi government said.", "source": "CNBC Top News", "pub_date_str": "12 Sep 2026, 03:05 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Crypto\u2019s Latest Rebound Was Fueled By Fresh Liquidations", "full_content": "(Bloomberg) -- A fresh wave of liquidations in bearish bets \u2014 this time on Ether, the second-largest cryptocurrency \u2014 drove Friday\u2019s brief rally.\n\nPrices of most al and California state taxes.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "12 Sep 2026, 02:00 AM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Why Dell and HPE were the S&P 500\u2019s top-performing stocks today", "full_content": "Oracle\u2019s earnings provided an upbeat read for hardware suppliers \u2014 but the Fed\u2019s interest-rate moves could dictate just how much they continue benefitting.", "source": "MarketWatch Top Stories", "pub_date_str": "12 Sep 2026, 02:00 AM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Saudi Arabia shuts East-West pipeline that bypasses Hormuz after attacks", "full_content": "Move is likely to put further momentum behind fast-rising oil prices", "source": "FT Markets", "pub_date_str": "12 Sep 2026, 01:51 AM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Your Social Security COLA could go up another $71 a month in 2027. That\u2019s not necessarily good news.", "full_content": "A higher COLA is a sign that persistent inflation isn\u2019t going anywhere.", "source": "MarketWatch Top Stories", "pub_date_str": "12 Sep 2026, 01:38 AM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Court to Hold Paramount-Warner Bros. Settlement Conference in Late October - Variety", "full_content": "Court to Hold Paramount-Warner Bros. Settlement Conference in Late October Variety Paramount Settlement Talks With California Moving Forward     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
