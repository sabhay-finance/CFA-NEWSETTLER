en early 2022 and 2025, USDOT said.", "source": "CNBC Top News", "pub_date_str": "23 Oct 2026, 10:22 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Fewer people are flying as airfare soars. Here's why airlines aren't worried", "full_content": "Fewer people are flying this year, but with airfare this high and climbing , airline executives say that's just fine.\n\nThe number of people screened at U.S. checkpoints is on track for its first annual decline since 2020. Major U.S. carriers have said capturing higher fares is more important than fully filling their planes or flying record numbers of travelers.\n\n\"We're actively prioritizing yield versus load factor and really happy as we see it. It fits right in with the premium investments that we're making,\" American Airlines Chief Commercial Officer Nat Pieper said on the company's earnings call Thursday.\n\nAmerican's load factor, a gauge of how full planes are flying, fell to 83.4% in the third quarter from 86% in the same quarter of 2025.\n\nThe price of plane tickets has skyrocketed as airlines grapple with a spike in jet fuel prices, their biggest expense after labor, and pass more of those costs on to customers.\n\nFares in September were up more than 22% from a year earlier, according to the latest inflation read. Fare tracker Hopper said it expects this holiday season to come with the most expensive ticket prices in years.\n\nThe average Southwest Airlines fare in the third quarter, for example, was $231.69, up close to $50 from a year earlier. That doesn't include Southwest's new fees, like its extra charges for checked bags or a seat closer to the front of the plane.\n\nThe airline's count of revenue passengers, however, fell 3.2% from a year ago, to about 33.5 million people.", "source": "CNBC Top News", "pub_date_str": "23 Oct 2026, 10:21 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Fixed Income", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "EAAA India Alternatives mops up Rs 360 crore from anchor investors; IPO opens on Oct 26", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a EAAA India Alternatives mops up Rs 360 crore from anchor investors; IPO opens on Oct 26 Elixir Capital Share Price Mantra Capital Share Price Banas Finance Share Price Royal India Corporation Share Price Classic Leasing & Finance Share Price The Economic Times daily newspaper is available online now. Read Today's Paper EAAA India Alternatives mops up Rs 360 crore from anchor investors; IPO opens on Oct 26 SECTIONS EAAA India Alternatives mops up Rs 360 crore from anchor investors; IPO opens on Oct 26 By Kumar Gaurav , ETMarkets.com Last Updated: Oct 23, 2026, 10:20:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis EAAA India Alternatives has successfully raised approximately Rs 360 crore from anchor investors prior to its IPO. This IPO is set to open for public subscription on October 26. The company will not receive any proceeds from the issue as it is an offer for sale. Prominent institutional investors and major domestic mutual fund houses participated in the anchor allocation.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "23 Oct 2026, 10:20 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Portfolio Management"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "American Express Shares Tank Nearly 4% After Slashing 5% Of Global Workforce To 'Prepare For AI'", "full_content": "American Express will cut 5% of its global workforce and take a $336 million restructuring charge as it reorganises operations to improve efficiency and prepare for wider AI adoption.", "source": "NDTV Profit", "pub_date_str": "23 Oct 2026, 10:08 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Micron Stock Leads Chip Rebound. Dip Buyers Must Buckle Up as AI Chaos Swirls. - Barron's", "full_content": "Micron Stock Leads Chip Rebound. Dip Buyers Must Buckle Up as AI Chaos Swirls. Barron's Could a $10,000 Investment in Micron Set You Up for Life? Yahoo Finance Micron Stock: The AI Memory Tax Could Change Everything (NASDAQ:MU) Seeking Alpha Micron leads memory stock rebound candidates after sharp selloff Investing.com History Says Micron Stock Gains 28% During the Fourth Quarter. Here's Why I Think Shares Will Surge Even More Before 2026 Is Over. The Motley Fool", "source": "Google News Business", "pub_date_str": "23 Oct 2026, 10:08 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Supreme Petrochem Q2 results, dividend 2026: Check amount, record date, yield, history, stock returns", "full_content": "Petrochemical company Supreme Petrochem announced a first interim dividend of \u20b9 2.50 per share for FY27 alongside its financial results for the September quarter on Friday, October 23.\n\n\u201cDeclared interim dividend of \u20b9 2.50 per equity share of the company (viz. 125%) for the financial year 2026-2027 on its paid-up equity share capital (consisting of 188,041,342 equity shares of \u20b9 2 each), entailing an outgo of \u20b9 4,701.03 lakh,\u201d the company said in its regulatory filing.\n\nThe company has fixed Friday, October 30, as the record date to determine shareholders\u2019 eligibility for the dividend. However, it has not disclosed when the dividend payment will commence.\n\nInvestors looking to benefit from the payout must ensure they purchase the stock in time to qualify for the dividend. Under India\u2019s T+1 settlement cycle, shares purchased on or after the record date will not qualify for the payout.\n\nOver the past 12 months, Supreme Petrochem has declared equity dividends totalling \u20b9 10.50 per share. At the current share price of \u20b9 712.60, the company\u2019s dividend yield stands at 1.47%.\n\nSupreme Petrochem follows a quarterly dividend payout policy, distributing a portion of its profits to shareholders and offering them an opportunity to earn regular income alongside potential capital appreciation.\n\nSupreme Petrochem reported strong financial performance for the second quarter of FY27, with operational revenue rising 77.8% year-on-year to \u20b9 1,956 crore from \u20b9 1,100.2 crore in Q2 FY26.\n\nOperational EBITDA surged 91.4% to \u20b9 148.5 crore from \u20b9 77.6 crore, while total EBITDA increased 85.1% to \u20b9 159.9 crore from \u20b9 86.4 crore. Profit after tax (PAT) rose 97% to \u20b9 95 crore, compared with \u20b9 48.2 crore in the corresponding quarter last year.", "source": "LiveMint Markets", "pub_date_str": "23 Oct 2026, 10:04 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Fixed Income", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Two ex-FBI officials charged with allegedly lying about Hunter Biden probe: DOJ", "full_content": "Two former senior FBI officials were taken into custody on Friday after being charged with lying to Congress about their roles in investigations into Hunter Biden , top Department of Justice officials announced.\n\nThe former officials, 46-year-old Nikki Floris and 56-year-old Bradley Benavides, surrendered on arrest warrants Friday morning, the DOJ said in a press release .\n\nThe charges were filed less than two weeks before the midterm election , breaking with longstanding DOJ guidance discouraging actions that could affect upcoming political races.\n\nThe announcement also comes amid growing concerns that President Donald Trump \u2014 who refused to accept his 2020 election loss and tried repeatedly to overturn those results \u2014 is looking for ways to challenge potential Republican midterm losses.\n\nOn Thursday, the DOJ filed an unusual lawsuit against Alaska seeking to preemptively challenge the results of that state's Senate race if incumbent Republican Sen. Dan Sullivan narrowly loses.\n\nThe charges unveiled Friday morning accuse the two ex-FBI agents of lying in 2023 testimony before the House Judiciary Committee about their agency's probe of Hunter Biden, the now-56-year-old son of former President Joe Biden .\n\nThe agents were \"actively involved\" in federal investigations of Hunter Biden, which began in 2019 on tax- and money-laundering-related matters, but said otherwise in separate interviews before the House panel, according to an FBI special agent's affidavit in support of the charges.\n\n\"Floris and Benavides allegedly lied to Congress about their roles in the FBI's Hunter Biden investigations, with one claiming they only learned about it from Wikipedia \u2014 despite evidence showing their involvement in helping shape the public narrative about Hunter Biden's laptop right before the election,\" U.S. Attorney for the District of Columbia Jeanine Pirro said in an X post.", "source": "CNBC Top News", "pub_date_str": "23 Oct 2026, 10:02 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "$120 Oil Is Almost Here, and Trump Has Few Good Options - Crude Oil Prices Today | OilPrice.com", "full_content": "$120 Oil Is Almost Here, and Trump Has Few Good Options Crude Oil Prices Today | OilPrice.com Brent crude hits more than five-month high on Houthi-Saudi attacks, UAE oil spill Reuters Global Oil Price Hits $117 a Barrel, Highest Since April The New York Times Oil prices approach Iran-war highs as soaring tanker rates trigger a second energy squeeze MarketWatch Oil Holds Biggest Gain in Week as Saudi Attacks Fan Supply Risks Bloomberg.com", "source": "Google News Business", "pub_date_str": "23 Oct 2026, 10:00 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Derivatives", "Alternative Investments"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Nasdaq ticks up as tech stocks steady; SpaceX worries hit telecoms - Reuters", "full_content": "Nasdaq ticks up as tech stocks steady; SpaceX worries hit telecoms Reuters Stock Market Today: Dow and S&P 500 fall, Nasdaq waffles as tech stocks bounce and oil prices climb MarketWatch Nasdaq Futures Rise After Chip Selloff While S&P 500, Dow Track Mixed Open: SLV, GLD, SOXL, BE In Focus Yahoo Finance Sandisk, Datadog, Amazon Lead S&P 500 As AI Stocks Rebound Investor's Business Daily Nasdaq climbs more than 1% as AI trade makes a comeback CNBC", "source": "Google News Business", "pub_date_str": "23 Oct 2026, 09:59 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Derivatives"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "US 10-Year Treasury Yields Drops To 5% As Investors Take Cover From AI-Battered Stocks", "full_content": "The US 10-year Treasury yield fell to around 4.95% on October 22, recording its steepest daily decline since the March 2023 banking crisis. Investors moved into government bonds as AI-related stock losses rattled markets.", "source": "NDTV Profit", "pub_date_str": "23 Oct 2026, 09:55 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Jio Platforms IPO draws record 10 million applications amid strong investor demand", "full_content": "Jio Platforms Ltd\u2019s initial public offering (IPO) attracted more than 10 million applications over its three-day subscription window, the highest number for any share sale in India\u2019s history, as investors placed bids worth \u20b9 4.9 trillion.\n\nThe \u20b9 30,213-crore offering was subscribed 22.19 times by Friday, according to the BSE, with demand far exceeding the shares reserved for institutional investors. Foreign institutional investors (FIIs) submitted bids worth \u20b9 1.39 trillion, subscribing to their reserved portion 25 times, despite being net sellers in the secondary market. They have net sold shares worth \u20b9 96,612 crore in September and October so far.\n\nThe country\u2019s largest-ever IPO was fully subscribed within 100 minutes of opening on Wednesday, 21 October, the first day of IPO. Backed by Reliance Industries Ltd, Jio Platforms counts Meta Platforms Inc. and Google parent Alphabet Inc. among its investors and is led by Akash Ambani , the eldest son of Reliance chairman Mukesh Ambani. Retail investors put 2.72 more bids for the IPO. While the non-institutional investors (NIIs) put 14 times more bids for the IPO.\n\nThe blockbuster response is being watched as a test of investor appetite for large listings at a time when Indian equities have underperformed other Asian markets.\n\n\u201cThe strong demand is also reflected in the availability of institutional capital waiting to be deployed, with both domestic and foreign investors looking to participate in India\u2019s story,\u201d said Manick Wadhwa, executive director at SKI Capital Services Ltd. Despite pressure on Indian equities from rising bond yields, rupee depreciation and geopolitical tensions, investors viewed Jio as an attractive bottom-up investment opportunity, he said.\n\nJio Platforms\u2019 scale and faster revenue growth than its listed telecom rivals underpin its public offering.", "source": "LiveMint Markets", "pub_date_str": "23 Oct 2026, 09:54 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Fixed Income"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Chennai Petroleum vs MRPL: Which PSU refinery stock wins on Q2 profit, revenue, dividends? Experts weigh in on outlook", "full_content": "Chennai Petroleum vs MRPL: Chennai Petroleum Corporation Limited and Mangalore Refinery and Petrochemicals Limited (MRPL) are among top refinery Public Sector Undertaking (PSUs) that have recently announced second quarter results for the financial year 2026-27.\n\nWhile Chennai Petro reported a 212% yearly jump in net profit, MRPL\u2019s Q2 profit more than tripled on an annual basis. Both the PSU stocks have also declared dividend for FY27. For investors who closely track development around PSU stocks, here are all the details to know.\n\nThe Tamil Nadu-headquartered oil refining company reported a 212% year-on-year jump in its consolidated net profit for the period to \u20b9 2247.03 crore in Q2FY27 against \u20b9 719.19 crore reported in the year ago period.\n\nMangalore Refinery and Petrochemicals Limited (MRPL), a subsidiary of Oil and Natural Gas Corporation (ONGC), posted a nearly threefold annual jump in its standalone net profit to \u20b9 1,881 crore in the second quarter of FY27, compared with \u20b9 639 crore in the corresponding quarter last year.\n\nIts net consolidated revenue from operations surged to \u20b9 22,055 crore in Q2FY27 against \u20b9 20,033 reported in the corresponding quarter. Chennai Petroleum Corporation Limited\u2019s net revenue stood at \u20b9 29,358 crore reported in the first quarter of financial year 2026-27.\n\nMRPL\u2019s revenue from operations surged 37% on an annual basis to \u20b9 35,590 crore in Q2 FY27 from \u20b9 25,953 crore in Q2 FY26.\n\nChennai Petro has announced an interim dividend of \u20b9 25 per equity share, representing a 250% payout on the stock\u2019s face value of \u20b9 10 per share. The board has also announced a record date to determine the eligibility of shareholders for the payout.\n\nMRPL\u2019s board of directors approved the first interim dividend of \u20b9 3 per equity share, representing 30% of the face value of each share.", "source": "LiveMint Markets", "pub_date_str": "23 Oct 2026, 09:47 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "What we want to see when this data center stock reports earnings next week", "full_content": "The Investing Club holds its \"Morning Meeting\" every weekday at 10:20 a.m. ET.", "source": "CNBC Top News", "pub_date_str": "23 Oct 2026, 09:45 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "India's exports to Germany could cross $50 billion by 2030: ASSOCHAM", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a India's exports to Germany could cross $50 billion by 2030: ASSOCHAM The Economic Times daily newspaper is available online now. Read Today's Paper India's exports to Germany could cross $50 billion by 2030: ASSOCHAM SECTIONS India's exports to Germany could cross $50 billion by 2030: ASSOCHAM ANI Last Updated: Oct 23, 2026, 09:42:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis ASSOCHAM said the potential for expanding market access, investment and business partnerships between India and Germany. It said the two countries could use their respective strengths in manufacturing, technology and innovation to deepen economic ties and create new growth opportunities.\n\nKYB and KYC: Business behind the wealth creator called \u201cDivi\u2019s Lab\u201d \u2013 Part 1\n\nOne company, 2 words. Bond yield and CDS: Will they decide the fate of global markets?\n\nBusiness of Odd Things: Inside an industry that farms fish that nobody is meant to eat\n\nWar's second-order effects are becoming visible in critical sectors\n\nUS mid-term elections \u2013 Part 2: What does it mean for Trump to lose control of Congress?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "23 Oct 2026, 09:42 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income", "Derivatives", "Ethical & Professional Standards"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "American Airlines says airfares could stay elevate     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
