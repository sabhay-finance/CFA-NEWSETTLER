nt and oversight failures contributed to major cost overruns in the central bank's headquarters renovation, but found no grounds for a criminal referral, it said in a report released Wednesday.\n\n\"At no point during our evaluation did we find reasonable grounds to believe that a violation of federal criminal law had occurred requiring a referral to the U.S. Attorney General in accordance with the Inspector General Act,\" the report from the Fed's inspector general states.\n\nThe independent watchdog's findings could defuse one line of attack against former Fed Chair Jerome Powell , whom President Donald Trump and other critics accused of mismanaging the project and misleading Congress about it.\n\nThe IG's report cedes little to Powell's critics beyond his responsibility for management of the project as head of the organization. Instead it details a renovation project of the Washington facility that ballooned in cost by roughly a billion dollars from initial estimates as the Fed struggled with design changes and other issues.\n\nSome critics have alleged Powell perjured himself in testifying to the Senate about the project in June 2025. The IG's office didn't specifically set out to assess that claim, but the report said the watchdog had reviewed materials related to Powell's testimony. The report makes no claims about any misconduct related to that testimony.\n\nThe Fed's board wasn't involved in day-to-day decisions about the project, the report notes.\n\n\"Indeed, we would expect the [board] to delegate the day-to-day management of a large construction project,\" the report says.\n\nTrump has blamed a recent interest-rate increase on what he called a \"hostile\" board at the Fed, even though the decision was supported by Trump's new appointee as Fed chair, Kevin Warsh .", "source": "CNBC Top News", "pub_date_str": "30 Sep 2026, 10:45 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Agriculture sector binds India-Argentina partnership", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Agriculture \u203a Agriculture sector binds India-Argentina partnership The Economic Times daily newspaper is available online now. Read Today's Paper Agriculture sector binds India-Argentina partnership SECTIONS Agriculture sector binds India-Argentina partnership By Dipanjan Roy Chaudhury , ET Bureau Last Updated: Sep 30, 2026, 10:44:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Argentine Ambassador Mariano Caucino highlighted the growing economic relationship between Argentina and India during a summit in Mumbai. Agriculture, particularly edible oils, serves as a core area of cooperation between the two countries. Argentina is experiencing record supplies of edible oils, significantly contributing to India's food security. In 2025, exports of soybean oil and sunflower products to India are expected to increase substantially.\n\nSix months after oil spiked, why are markets reacting so sharply now?\n\nGold paradox: Why India, a refining giant, is not a big bullion exporter\n\nA refinery is not a laptop: Why America's diesel problem can't be switched off\n\nHow Irdai\u2019s big reset can change insurance landscape, customer choice\n\nCan Fly91\u2019s flightpath for India\u2019s smallest airline defy the doomy past?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers", "source": "Economic Times Economy", "pub_date_str": "30 Sep 2026, 10:44 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Christine Lagarde: Interview with La Croix", "full_content": "You have experienced all the major crises: the financial crisis of 2008 when you were the French Minister of the Economy, the Greek crisis and sovereign debt crisis in Europe when you were head of the International Monetary Fund, then later, as President of the ECB, the COVID-19 pandemic, the war in Ukraine and now the conflict in the Middle East. Has it become the normal state of affairs for the world to be in a crisis situation?\n\nThere have always been economic and financial crises. What is new is how they are linked together. The pandemic gave rise to pressures on energy and raw materials, then came the invasion of Ukraine which worsened the energy crisis and the inflation surge. Crises no longer follow one after the other, they are interconnected and mutually reinforcing. This is an unprecedented reality that we must now face.\n\nIn your opinion, what is the most immediate threat to the European economy?\n\nFor the ECB, price stability remains the priority. So the main threat today is the energy crisis related to the conflict in the Middle East. It is clearly weighing on prices, but also on growth. The effect on economic activity when the cost of raw materials rises is often overlooked. And behind the energy crisis there is a geopolitical situation undergoing major change.\n\nEssentially, the whole European economic model has been shaken.\n\nYes. Europe has long rested on three pillars: cheap energy, notably from Russia, the large Chinese market for its exports and the US security umbrella. These three pillars are being shaken today. The supply of energy from Russia has been cut off and China is now competing with Europeans in leading-edge markets. Regarding the US security umbrella, it has been cast into doubt, to say the least.\n\nYou have been President of the ECB for seven years.", "source": "ECB Press", "pub_date_str": "30 Sep 2026, 10:30 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Micron earnings are only hours away. Here's everything investors need to know. - MarketWatch", "full_content": "Micron earnings are only hours away. Here's everything investors need to know. MarketWatch Micron earnings hit Wall Street after the bell. Here's how options traders are positioned into the report CNBC Micron Stock Flashes New Warning Sign Before Earnings Yahoo Finance Micron\u2019s $370 Billion Stock Rebound Hinges on AI Spending View Bloomberg.com Here\u2019s How Much Micron Stock Is Expected to Move After Earnings Investopedia", "source": "Google News Business", "pub_date_str": "30 Sep 2026, 10:30 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Top 5 breakout stocks to buy: PVRINOX, JK Tyre, ICICIGI, Texmaco Rail, Mishra Dhatu by Sumeet Bagadia | Target, stoploss", "full_content": "Sumeet Bagadia's shares recommendations: The key benchmark indices of the Indian stock market remained under pressure despite stronger-than-expected domestic industrial output, as Brent crude neared $105 a barrel and the US 10-year bond yield, around 5.25%, continued to present a challenging backdrop for domestic risk assets.\n\nElevated crude prices threaten to add to inflationary pressures and weigh on the rupee, while higher US Treasury yields increase the relative attractiveness of dollar-denominated assets. Unless both begin to moderate, foreign portfolio flows could remain subdued, and recovery attempts may struggle to gain lasting traction.\n\nSumeet Bagadia, Executive Director at Choice Broking, believes the Indian stock market is biased to the sideways to bearish side. The Nifty 50 index closed at 22,620.45, down 95 points (-0.42%), after recovering from the opening weakness and touching an intraday high of 22,809, before sharp profit-booking in the second half dragged the index to near 22,595.\n\nSpeaking on the outlook of the Nifty 50 today, Sumeet Bagadia said, \u201cThe failure to sustain higher levels has shifted the short-term setup towards a sideways-to-bearish structure, though the index continues to hold the weekly 200-SMA support zone. Immediate support is placed at 22,500\u201322,600, while 22,800 and 23,000 remain key hurdles on the upside.\u201d\n\nOn the suggestion to the long-term investors, Bagadia said, \u201cDespite the recent extended decline, the long-term support zone and historical tendency after prolonged losing streaks could keep the scope for a recovery alive if 22,500\u201322,600 holds.\u201d\n\nOn the outlook of the Bank Nifty today, Sumeet Bagadia said, \u201cThe index finished above the previous session\u2019s high with a strong bullish candle. The close above the previous day\u2019s high marks a notable improvement in the short-term setup, shifting the structure towards a sideways-to-bullish bias.", "source": "LiveMint Markets", "pub_date_str": "30 Sep 2026, 10:25 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Fixed Income", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Gold is supposed to be a safe haven when inflation surges. So why isn\u2019t it working that way now?", "full_content": "Every investor knows the drill: When markets buckle, buy gold. But in September, that playbook hasn\u2019t worked as expected.", "source": "MarketWatch Top Stories", "pub_date_str": "30 Sep 2026, 10:21 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "10-year Treasury yield turns higher as traders look past inflation data, await jobs report", "full_content": "Treasury yields wavered as traders weighed lighter-than-expected U.S. inflation data for August as they awaited the September jobs report due later in the week.\n\nThe 2-year Treasury note yield was last little changed, while the 10-year Treasury yield was nearly 4 basis points higher at 5.293%, recovering after a brief pullback earlier in the session. The benchmark yield traded near 2007 highs. The 30-year Treasury bond was up almost 5 basis points at 5.641%, near its highest level since 2002.\n\nOne basis point equals 0.01%, and yields and prices move in opposite directions.\n\nConsumer prices were reported Wednesday to have posted a smaller-than-expected increase in August compared to the same period a year ago, according to the Federal Reserve's primary measure of inflation.\n\nThe personal consumption expenditures price index increased a seasonally adjusted 0.3% last month, putting the 12-month gain at 3.4%, the Commerce Department reported Wednesday. Economists surveyed by Dow Jones had been looking for increases of 0.3% and 3.7% respectively.\n\n\"Net, net, the inflation fire is not burning as hot as markets expected in August, and bond yields are adjusting their sails as investors rethink exactly how many Fed rate hikes might be needed to keep inflation moving back down to target,\" Christopher Rupkey, chief economist at FWDBONDS, wrote in response to the latest release.\n\nExcluding food and energy, PCE posted a 0.2% increase in August that put the annual core level at 3%. The respective forecasts were for 0.3% and 3.3%.\n\nThough the Fed officially follows the headline PCE number, officials generally consider the core reading a better gauge of longer-term inflation trends.", "source": "CNBC Top News", "pub_date_str": "30 Sep 2026, 10:06 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Coca-Cola India IPO on the cards: Bottling unit may file draft papers in December, says report", "full_content": "Coca-Cola Co is reportedly planning to file a draft prospectus for an IPO of its Indian bottling unit in December, seeking a valuation of $10 billion and expecting to raise around $1 billion. The unit operates 14 plants in India, distributing popular beverages.", "source": "LiveMint Markets", "pub_date_str": "30 Sep 2026, 10:06 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "FTC opens probe into AI giants including Anthropic and OpenAI - reuters.com", "full_content": "FTC opens probe into AI giants including Anthropic and OpenAI reuters.com FTC launches broad investigation into Anthropic, OpenAI The Washington Post F.T.C. Investigates OpenAI and Anthropic Over Potential Consumer Harms The New York Times US competition watchdog expands investigation of Anthropic and OpenAI Financial Times FTC Opens Investigation of Anthropic and OpenAI WSJ", "source": "Google News Business", "pub_date_str": "30 Sep 2026, 09:59 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Avalon Tech block deal: Promoters divest 6% stake worth Rs 871 crore", "full_content": "Avalon Technologies saw an Rs 870.6 crore bulk deal as three promoter entities sold 40.08 lakh shares, representing 6% equity. Kotak Mahindra Mutual Fund bought 24.02 lakh shares, while Nomura retained its Buy rating and raised its target price.", "source": "Economic Times Market     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
