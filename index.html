Updated: Aug 31, 2026, 06:27:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis In FY26, Indian firms made history by distributing a staggering \u20b94.5 lakh crore in dividends, marking a remarkable 15% annual growth rate over five years. A significant portion of these dividends, two-thirds, came from the banking, finance, and IT sectors. Notably, the dividend payout ratio has tapered to a five-year low of 27%, indicating that a smaller share of profits is now being returned to shareholders as dividends.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "31 Aug 2026, 06:27 AM IST", "pub_date_relative": "33m ago"}, {"title": "Japan 2-year yields rise to 31-year high as auctions, rate hikes loom", "full_content": "TOKYO, - The two-year Japanese government bond yield rose to a 31-year high on Monday amid rising bets on central bank rate hikes and an uncertain environment for debt auctions later in the week.\n\n* The two-year yield, the one most sensitive to Bank of Japan policy rates, added 0.5 basis point to 1.730%, a level not seen since April 1995. The benchmark 10-year JGB yield climbed 1 bp to 2.935%. Yields move inversely to bond prices.\n\n* The U.S. central bank will \"have work to do\" if policymakers don't get the confidence they need that inflation is heading down to 2%, Federal Reserve Chairman Kevin Warsh said on Friday, coming closer than he has to acknowledging interest rate hikes may be needed.\n\n* Japan's Ministry of Finance is due to auction 10-year JGBs on Tuesday and 30-year debt on Thursday.\n\n* \"If the Fed tightens monetary policy further to curb inflation, the environment for the Bank of Japan and the JGB market will become increasingly challenging,\" Ataru Okumura, a senior rate strategist at SMBC Nikko Securities, said in a note. \"It is unclear whether investor demand will materialise for this week's 10-year and 30-year bond auctions.\"\n\n* Data on Friday showed the Tokyo consumer price index rose in August, bolstering the case for a BOJ interest rate hike next month.\n\n* The CPI data \"really reinforces a more hawkish stance from the BOJ,\" ANZ's head of FX research, Mahjabeen Zaman, said.\n\n* \"We now expect the BOJ to hike by 25 basis points in the September meeting followed by consecutive moves over the next quarters, taking the terminal rate to 1.75%,\" she added.", "source": "LiveMint Markets", "pub_date_str": "31 Aug 2026, 06:24 AM IST", "pub_date_relative": "37m ago"}, {"title": "Earnings call transcript: Liontown lifts FY 2026 profit on record revenue, shares rise", "full_content": "", "source": "Investing.com News", "pub_date_str": "31 Aug 2026, 06:22 AM IST", "pub_date_relative": "38m ago"}, {"title": "Earnings call transcript: Praemium H2 2026 profit growth fails to lift shares", "full_content": "", "source": "Investing.com News", "pub_date_str": "31 Aug 2026, 06:21 AM IST", "pub_date_relative": "39m ago"}], "cfa": [{"title": "U.S., Iran trade attacks as hostilities escalate once again", "full_content": "The U.S. and Iran traded attacks as hostilities escalated over the weekend.\n\nAmerican forces struck two Iranian rocket launchers on Larak Island on Sunday after the military said Revolutionary Guard forces were preparing rockets carrying sea mines for launch into the Strait of Hormuz, U.S. Central Command confirmed to MS NOW.\n\n\"Earlier today U.S. forces struck two Iranian launchers on Larak Island. Islamic Revolutionary Guard Corps forces were observed preparing to launch rockets with sea mines into the Strait of Hormuz,\" Navy Capt. Tim Hawkins, a U.S. Central Command spokesperson, said in a statement.\n\n\"Last week, CENTCOM completed clearing sea mines from the strait's international shipping routes. U.S. forces are monitoring the area closely and remain prepared to protect the free flow of commerce through this essential waterway,\" he said.\n\nSunday's attack was the first publicly acknowledged U.S. strike on Iranian positions since late July, according to The Associated Press. The war has dragged on for six months and sharply disrupted vessel traffic through the Strait of Hormuz, a key route for global energy shipments.\n\nIran's Revolutionary Guards Corps said the U.S. attack on Larak Island killed and wounded several Iranian soldiers, and it has responded with attacks on American military bases in Jordan, according to Iranian media reports .\n\nThe IRGC said the combined missile and drone operation targeted the King Hussein and Al Azraq bases, according to media reports.\n\nThe strikes \"destroyed the technical and repair infrastructure, as well as the enemy fighter deployment sites,\" inflicting \"heavy damage,\" Iranian military forces reportedly said , while vowing increasingly forceful responses.", "source": "CNBC Top News", "pub_date_str": "31 Aug 2026, 06:42 AM IST", "pub_date_relative": "19m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Earnings call transcript: Kina Securities posts softer H1 2026 growth as stock slips", "full_content": "", "source": "Investing.com News", "pub_date_str": "31 Aug 2026, 06:41 AM IST", "pub_date_rela re Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "31 Aug 2026, 06:37 AM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Economics", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Bessent expects new US secondary sanctions weekly, aiming to increase pressure on Iran", "full_content": "", "source": "Investing.com News", "pub_date_str": "31 Aug 2026, 06:36 AM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Breakout stocks to buy or sell: Sumeet Bagadia recommends five shares to buy today \u201431 August 2026", "full_content": "Buy or sell stocks : Indian equity markets ended the week on a subdued note, extending their ongoing correction amid concerns over global interest rates, geopolitical developments and uncertainty surrounding the new Closing Auction Session. Investor sentiment remained cautious, although a sharp recovery on Friday, led by strong buying in IT stocks following positive global technology cues, helped limit the losses. Despite the rebound, the benchmark indices remained under pressure for the third consecutive week.\n\nFor the week, the Nifty declined 0.31% to end at 24,175.65, while the Sensex slipped 0.36% to settle at 77,264.51. Meanwhile, the broader market showed greater resilience, with the Midcap and Smallcap indices rising 0.52% and 0.51%, respectively.\n\nNifty 50 closed higher at 24,175.65, gaining 84.80 points (+0.35%), after opening at 24,122.60, with an intraday low of 24,076.85 and high of 24,188.30. The index witnessed an early recovery, but selling emerged near the higher levels where a bearish pin-bar candle was visible on the 5-minute chart near 100 Ema, leading to a gradual decline. However, buying interest returned during the later part of the session, allowing Nifty to recover and close above its opening level. After two consecutive red candles, the index formed a green daily candle, marking a recovery session despite the volatile price action.\n\nAccording to Sumeet Bagadia, Executive Director at Choice Broking, Nifty continues to trade below all key moving averages, keeping the broader setup cautious. RSI stands at 46.98, while India VIX declined to 10.68, down by 3.50% indicating relatively lower volatility.\n\n\u201cFrom a technical perspective, Nifty is likely to maintain a Sideways bias as the index remains below its key moving averages and faces resistance at higher levels. Immediate support is placed at 24,000\u201324,050, while 24,240\u201324,300 remains the key resistance zone.", "source": "LiveMint Markets", "pub_date_str": "31 Aug 2026, 06:35 AM IST", "pub_date_relative": "25m ago", "cfa_topics": ["Equity Investments", "Derivatives", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Gold steadies after sharp selloff as Warsh revives Fed hike bets", "full_content": "", "source": "Investing.com News", "pub_date_str": "31 Aug 2026, 06:33 AM IST", "pub_date_relative": "27m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Earnings call transcript: Peoplein\u2019s H2 2026 profit gains as Queensland demand builds", "full_content": "", "source": "Investing.com News", "pub_date_str": "31 Aug 2026, 06:33 AM IST", "pub_date_relative": "28m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stock futures fall after U.S. strikes Iran; Wall Street heads for winning month: Live updates - CNBC", "full_content": "Stock futures fall after U.S. strikes Iran; Wall Street heads for winning month: Live updates CNBC Dow Jones Futures Fall, Oil Prices Jump As U.S. Strikes Iran Investor's Business Daily Oil Rises on Iran Tensions, US Stock Futures Dip: Markets Wrap Bloomberg.com Stock Futures Drift Lower, Oil Rises Ahead of Jobs Data, Tech Earnings Barron's U.S. stock futures dip amid renewed Iran hostilities Investing.com", "source": "Google News Business", "pub_date_str": "31 Aug 2026, 06:32 AM IST", "pub_date_relative": "28m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Liontown Resources reports first annual profit on lithium gains", "full_content": "", "source": "Investing.com News", "pub_date_str": "31 Aug 2026, 06:31 AM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "U.S. stock futures slip as chances of rate hike rise after Warsh\u2019s Jackson Hole comments", "full_content": "U.S. stock-index futures declined on Sunday, as investors ponder the likelihood of a fresh interest-rate hike and look ahead to fresh labor data and tech earnings this week.", "source": "MarketWatch Top Stories", "pub_date_str": "31 Aug 2026, 06:31 AM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Augmont Enterprises IPO listing date today. GMP, experts hint at up to 37% listing gain", "full_content": "Augmont Enterprises IPO listing date has been scheduled for today (Monday, 31 August) on the bourses at 10:00 IST. Augmont Enterprises IPO allotment was finalised on Thursday, 27 August. According to details on the BSE website, Augmont Enterprises share price will list in a special pre-open session on both the BSE and NSE during Monday's trades. Augmont Enterprises share price today will be available for trade from 10:00 IST.\n\nMembers of the Exchange are notified that starting Monday, 31 August 2026, the equity shares of Augmont Enterprises Limited will be listed and permitted for trading on the Exchange under the 'B' Group of Securities, as stated in the BSE notice.\n\nAugmont Enterprises IPO GMP today, or grey market premium , is +290. Considering the upper end of the IPO price band and the current premium in the grey market, the estimated listing price of Augmont Enterprises share price was indicated at \u20b9 1,078 apiece, which is 36.80% higher than the IPO price of \u20b9 788.\n\nConsidering the grey market movements over the past 14 sessions, the current GMP of \u20b9 290 reflects a pessimistic outlook. Within this timeframe, the GMP fluctuated between \u20b9 190 and \u20b9 395, according to analysts.\n\nAccording to Mahesh M. Ojha, Vice President \u2013 Research & Business Development at Kantilal Chhaganlal Securities Pvt. Ltd., Augmont Enterprises Ltd. is an integrated gold and silver platform with a strong distribution network, a technology-driven digital ecosystem, and a diversified value chain, offering attractive long-term growth potential.\n\nHowever, the brokerage highlighted low PAT margins and high customer and revenue concentration as key concerns. At the IPO price band of \u20b9 750\u2013 \u20b9 788 per share, the issue appears fairly valued at 20.7x FY26 P/E on a post-issue basis.\n\nOjha expects listing gains of around 30\u201335%.", "source": "LiveMint Markets", "pub_date_str": "31 Aug 2026, 06:30 AM IST", "pub_date_relative": "31m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Adani Enterprises: Rich valuations and holding-company discount risk may cap gains", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nShares of Adani Enterprises (AEL) have gained 41% so far in 2026 to \u20b9 3,169 apiece. Yet, further gains may be harder to justify at current valuations.\n\nLast week, Motilal Oswal Financial Services initiated coverage on AEL with a sum-of-the-parts (SoTP)-based target price of \u20b9 3,880, implying 22% upside from the current price. A couple of months ago, Morgan Stanley also initiated coverage with a target price of \u20b9 3,638. Bloomberg consensus is about 20% above the current stock price.\n\nThe catch is that both brokerages are already assigning rich valuations to AEL\u2019s key businesses.\n\nMotilal, for instance, values Adani Airport Holdings (AAHL), which accounts for 48% of its SoTP, at 35x enterprise value to Ebitda (EV/Ebitda) based on September 2028 estimates. That is more than double the 15x multiple assigned to GMR Airports based on FY29 estimates. Similarly, Motilal values Adani New Industries (ANIL), AEL\u2019s new-energy business and 19% of its SoTP, at 20x EV/Ebitda, a substantial premium to 8x for Waaree Energies, a solar equipment maker, and 12x for Suzlon Energy , a wind equipment maker. AdaniConnex, the data-centre business that contributes 13% of SoTP, is valued at 30x EV/Ebitda based on September 2028 estimates, versus 14-18x for large global peers.\n\nThat leaves little room for further valuation multiple expansion. Moreover, all of AEL\u2019s businesses are currently unlisted, meaning there is no holding company discount factored into the valuation. But AEL plans to list its key businesses between 2027 and 2031, starting with AAHL.", "source": "LiveMint Markets", "pub_date_str": "31 Aug 2026, 06:30 AM IST", "pub_date_rel olumes higher than the previous week. Despite the continued decline, the index has managed to hold on to its broader structure, as it continues to trade within a narrow range for the past 11 weeks.\n\nThe index slipped below its 10-week moving average and remains below the short-term 20-DMA and 50-DMA, reflecting weakness in the near-term trend. However, the decline was arrested near the 20-week moving average, which is currently placed around 24,036. The index also respected the rising trendline drawn from the April 2 low, providing support to the ongoing consolidation.\n\nA key positive from the current setup is that the Nifty has not breached its previous swing low and has avoided forming a lower low. This indicates that the broader trend has not weakened significantly, with the market still in a phase of consolidation rather than a fresh downtrend.\n\nMarket activity remained muted after the introduction of the Closing Auction Session (CAS), with participation and volumes staying below earlier levels. The subdued activity suggests that investors are awaiting a decisive move before taking aggressive positions.\n\nThe 24,000 mark continues to be an important psychological support level for the index. The 20-week moving average near 24,036 further strengthens this support zone. A sustained breach below this area could increase selling pressure and alter the current market setup.\n\nMeanwhile, the index has been formed higher lows while facing resistance near the previous highs, resulting in a compressed trading range. The narrowing Bollinger Bands on the weekly chart indicate declining volatility, which often precedes a sharper directional move once the range is broken.\n\nTechnical indicators present a mixed picture. On the daily chart, the MACD line has moved below the zero line, highlighting a loss of short-term momentum.", "source": "LiveMint Markets", "pub_date_str": "31 Aug 2026, 06:17 AM IST", "pub_date_relative": "44m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Oil rises over 1% after U.S. forces strike two Iranian rocket launchers on Larak Island", "full_content": "Oil rose Monday, amid heightened concerns over supply disruptions after U.S. forces struck two Iranian rocket launchers on Larak Island on Sunday.\n\nFutures for international benchmark Brent crude for November delivery gained 1.54% at $89.46 a barrel. U.S. West Texas Intermediate futures for October advanced 1.44% at $84.60 per barrel.\n\n\"I can confirm that earlier today U.S. forces struck two Iranian launchers on Larak Island. Islamic Revolutionary Guard Corps forces were observed preparing to launch rockets with sea mines into the Strait of Hormuz,\" Navy Capt. Tim Hawkins, a U.S. Central Command spokesperson, said in a statement.\n\nAccording to the Associated Press, Sunday's attack was the first publicly acknowledged U.S. strike on Iranian positions since late July.\n\nThe U.S. attack on Larak Island killed and wounded several Iranian soldiers, Iran's Revolutionary Guards Corps said, adding that it has responded with attacks on American military bases in Jordan, based on reports by the Iranian media .\n\nbrent Vessel traffic through the Strait of Hormuz, a key route for global energy shipments, has been severely disrupted by the Middle East conflict, which has entered its six month.\n\n\"Supply risk will persist and oil inventories will continue to deplete in the coming weeks and months,\" said Tamas Varga, analyst at PVM Oil Associates, adding that \"the Iranian crisis has likely changed the security status quo in the Middle East.\"\n\n\"Rising strikes on refineries in the Middle East and Russia have further constrained already-stretched global refining capacity, pushing refined products margins to new highs,\" Goldman said in a note.", "source": "CNBC Top News", "pub_date_str": "31 Aug 2026, 06:16 AM IST", "pub_date_relative": "44m ago", "cfa_topics": ["Derivatives", "Portfolio Management"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}], "updated_at": "31 Aug 2026, 07:01 AM IST", "total_stories": 332};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
