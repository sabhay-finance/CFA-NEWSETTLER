<script>

    const allData = {"general": [{"title": "International Gemological Institute shares hit 10% upper circuit- What's fuelling IGI stock rally? Q2 results highlights", "full_content": "International Gemological Institute ( IGI ) share price was locked in its 10% upper circuit at \u20b9 353.20 apiece on Thursday, October 22, after the company reported strong earnings for the quarter ended September 2026 (Q2FY27). The gemological services provider posted robust growth in both profit and revenue, supported by healthy demand and strong operational execution.\n\nThe stock's sharp rally followed a period of mixed performance. IGI shares have gained 8% in one week and 1.5% over the past three months, but declined 2.5% in six months. The stock has added 5% over the past year.\n\nAt Thursday's upper-circuit price, the stock was around 9% below its 52-week high of \u20b9 388, recorded in May 2026. Its 52-week low stands at \u20b9 287.25, touched in January 2026.\n\nInternational Gemological Institute reported a 43.14% year-on-year increase in consolidated profit after tax (PAT) to \u20b9 185.8 crore in Q2FY27 , compared with \u20b9 129.8 crore in the corresponding quarter of the previous fiscal year, according to a regulatory filing.\n\nRevenue from operations rose 31% to \u20b9 398 crore during the quarter under review, against \u20b9 303.7 crore in the year-ago period. The growth in revenue and profitability reflected healthy demand trends and strong operational execution during the September quarter.\n\nIGI Managing Director and CEO Tehmasp Printer said the company had delivered strong financial growth while continuing to provide certification services across different segments of the gems and jewellery industry.\n\n\u201cThe second quarter of FY27 was marked by healthy demand trends and strong operational execution, with consolidated revenue up 31% and PAT up 43% year-on-year.", "source": "LiveMint Markets", "pub_date_str": "22 Oct 2026, 11:39 AM IST", "pub_date_relative": "2m ago"}, {"title": "M&M Financial share price plunges 10% after Q2 results 2026 but brokerages divided on outlook | Buy, sell or hold?", "full_content": "Mahindra & Mahindra Financial Services (M&M Financial Services) shares tumbled nearly 10% on Thursday, 22 October, even as the non-banking financial company (NBFC) posted strong earnings growth for the September quarter of FY27, driven by higher business volumes and a decline in credit costs.\n\nThe company\u2019s consolidated net profit rose 55% year-on-year to \u20b9 882 crore in Q2 FY27, compared with \u20b9 569 crore in the year-ago period.\n\nRevenue from operations grew 15% to \u20b9 5,164 crore, while net interest income (NII) increased 17% year-on-year to \u20b9 2,822 crore. Consolidated net profit stood at \u20b9 911 crore, up 61%, while total assets expanded 21% to \u20b9 1.80 lakh crore.\n\nAsset quality-related costs showed improvement during the quarter, with credit costs declining to 1.6% of average total assets from 2.2% in the corresponding period last year. Net interest margin (NIM), however, remained steady at 7%, the company said in its regulatory filing.\n\nFor the longer term, Mahindra & Mahindra Financial Services aims to achieve a return on assets (RoA) of 2.2%\u20132.5% by FY31. Its RoA stood at 2.2% in the September quarter.\n\nBrokerages have offered mixed views on Mahindra & Mahindra Financial Services following its Q2 FY27 results, with concerns over rising funding costs and potential pressure on margins and asset quality in the tractor-financing segment tempering the outlook. While ICICI Securities retained its \u2018Buy\u2019 rating and target price of \u20b9 415, Nomura lowered its target to \u20b9 400, and Nuvama Institutional Equities maintained its \u2018Hold\u2019 rating with a reduced target of \u20b9 340.\n\nAccording to media reports, Nomura cut its target price on Mahindra & Mahindra Financial Services to \u20b9 400 from \u20b9 415 while retaining its \u2018Buy\u2019 rating, implying an upside potential of around 35%.\n\nThe brokerage flagged concerns over asset quality in the tractor financing segment and expects credit costs to rise to an annualised 1.8% in Q3 and Q4 FY27, compared with 1.7% in the first half of the financial year.", "source": "LiveMint Markets", "pub_date_str": "22 Oct 2026, 11:37 AM IST", "pub_date_relative": "4m ago"}, {"title": "Freefall! eMudhra shares crash 34% in just 3 sessions, near 52-week low - Why is stock plunging? What market experts say", "full_content": "eMudhra shares have been in free fall over the last three sessions. The stock crashed 15% in intraday trade on the BSE on Thursday, 22 October, looking set to extend losses for the third consecutive session. The stock hit an intraday low of \u20b9 367 in Thursday's session, inching closer to its 52-week low of \u20b9 365.75, hit on 30 March. At the current market price, the stock has lost 34% in just three consecutive sessions.\n\nThe stock has been witnessing a massive selloff after eight intermediate certification authority (CA) certificates associated with eMudhra were compromised.\n\nThe Indian Computer Emergency Response Team (CERT-In) said eMudhra Limited, an India-based certification authority, reported that private keys associated with eight intermediate CA certificates in its public key infrastructure (PKI) had been compromised.\n\nIn an exchange filing on 21 October, eMudhra said a flaw in the KGC caused a wrap/unwrap step to produce a second set of weak keys alongside the original strong keys. The weak keys were the ones published to the browser root stores. eMudhra is working to establish the root cause.\n\nThe company said these roots and issuing CAs have gone through independent audits for two years in a row, and have been in browser trust lists since mid 2025.\n\neMudhra confirmed that its infrastructure was not compromised, there was no data breach, and all physical and logical security controls remained intact.\n\n\"This incident has no connection with eMudhra\u2019s Indian Digital Signature Certificate (DSC) and eSign businesses. The global TLS business runs on infrastructure that is completely separate from the India DSC business. DSC and eSign services in India are running normally,\" said the company.\n\n\"The affected global TLS business is a very small part of eMudhra\u2019s operations and accounts for around 1% of the company\u2019s revenue. However, this may have some reputational risks for eMudhra which cannot be quantified,\" the company said.", "source": "LiveMint Markets", "pub_date_str": "22 Oct 2026, 11:31 AM IST", "pub_date_relative": "11m ago"}, {"title": "US Stock Futures Slip as Tech Earnings Rally Fades: Markets Wrap - Bloomberg.com", "full_content": "US Stock Futures Slip as Tech Earnings Rally Fades: Markets Wrap Bloomberg.com Stock futures fall as investors digest earnings from Meta and Tesla: Live updates CNBC Futures Fall; Meta, Tesla Lead Big Earnings Late Investor's Business Daily How Are Dow, S&P 500, Nasdaq Futures Trading After META, TSLA Earnings? Yahoo Finance 3 things to look out for on Thursday Seeking Alpha", "source": "Google News Business", "pub_date_str": "22 Oct 2026, 11:28 AM IST", "pub_date_relative": "13m ago"}, {"title": "Schindler raises 2026 margin outlook as Q3 profit grows", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Oct 2026, 11:23 AM IST", "pub_date_relative": "19m ago"}, {"title": "Dearness allowance delay July 2026: Government employees await DA hike and arrears update \u2014 what to watch next", "full_content": "Central government employees and pensioners are still waiting for the Centre to announce the July 2026 revision in dearness allowance (DA) and dearness relief (DR). Despite expectations surrounding recent Cabinet meetings and festive-season bonus announcements, the government has not yet confirmed the revised rates, arrears, or payment timeline.\n\nThe Union Cabinet meeting held on October 14 did not announce a DA hike. Instead, the government announced a performance-linked bonus (PLB) for eligible Railway employees. On October 16, the Centre announced a non-performance-linked bonus for central government employees, but there was no update on DA or DR.\n\nThe government also made no announcement on the revision ahead of Dussehra, which fell on October 20.\n\nDearness allowance is paid to central government employees to help offset the impact of inflation on their living expenses. Pensioners receive a corresponding benefit called dearness relief. Both are calculated as a percentage of basic pay or pension.\n\nThe Centre generally revises DA and DR twice a year, with the changes taking effect from January 1 and July 1. The January revision is typically announced in March or April, while the July revision is often announced in October. However, the announcement may come after the effective date, making employees eligible for arrears.\n\nOn April 18, 2026, the Union Cabinet approved a 2-percentage-point increase in DA and DR, raising the rates from 58% to 60% of basic pay or pension, effective January 1, 2026. The revision followed the accepted formula linked to the recommendations of the 7th Central Pay Commission.\n\nThe DA revision is linked to the All-India Consumer Price Index for Industrial Workers (AICPI-IW), published by the Labour Bureau.", "source": "LiveMint Money", "pub_date_str": "22 Oct 2026, 11:21 AM IST", "pub_date_relative": "20m ago"}, {"title": "Nokia ADR earnings beat by $0.03, revenue topped estimates", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Oct 2026, 11:19 AM IST", "pub_date_relative": "23m ago"}, {"title": "Chinese quant fund Lingjun draws $300 million from overseas investors", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Oct 2026, 11:18 AM IST", "pub_date_relative": "24m ago"}, {"title": "Earnings call transcript: Techcombank posts record Q3 2026 profit as stock slips", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Oct 2026, 11:18 AM IST", "pub_date_relative": "24m ago"}, {"title": "Why is Alibaba stock sliding today?", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Oct 2026, 11:18 AM IST", "pub_date_relative": "24m ago"}, {"title": "SML Isuzu shares: SML Mahindra shares tank for 3rd session in row after 33% gain in 6 months | Buy, sell or hold?", "full_content": "SML Mahindra share price continued to fall for the third session straight on Thursday, 22 October. Formerly known as SML Isuzu, the Mahindra Group stock opened at \u20b9 5,200 per share on BSE today, compared to the previous close of \u20b9 5,514.75 on Wednesday.\n\nSML Mahindra shares have remained weak in the near-term, however, has given positive returns in the broader time frame despite market volatility. The stock has fallen 24.56% in a month but has gained 33% in six months.\n\nLooking at the broader level, the stock has delivered multibagger returns of 290% in three years and 583% in five years.\n\nSML Mahindra reported a 42.9% year-on-year (YoY) decline in net profit to \u20b9 12 crore in the September quarter, compared with \u20b9 21 crore in the corresponding quarter last year. However, revenue from operations increased 20.7% YoY to \u20b9 670 crore from \u20b9 555 crore a year earlier.\n\nDespite the revenue growth, the company\u2019s operating performance weakened, with earnings before interest, tax, depreciation and amortisation (EBITDA) falling 31% YoY to \u20b9 29 crore from \u20b9 42 crore. The EBITDA margin also contracted to 4.3% from 7.6% in the year-ago quarter, marking a decline of 3.3 percentage points.\n\nSeparately, the company said its proposed \u20b9 525 crore acquisition of the truck and bus division of its parent, Mahindra & Mahindra Ltd, is expected to be completed on or before January 31, 2027. The transaction will be structured as a slump sale, involving the transfer of the business as a whole, with the final consideration subject to working capital adjustments as specified in the agreement. SML Mahindra added that it had not made any changes to its unaudited financial results for the September quarter and the first half of the financial year, as the acquisition is yet to be completed.\n\nOn the technical outlook, Gaurav Garg, Head - Research, Lemonn, said that the stock has declined sharply by around 8.5% (current week)to \u20b9 5,031, indicating significant selling pressure and weakening momentum.", "source": "LiveMint Markets", "pub_date_str": "22 Oct 2026, 11:17 AM IST", "pub_date_relative": "24m ago"}, {"title": "Nestle Q3 sales growth picks up on volumes, 2026 guidance maintained", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Oct 2026, 11:12 AM IST", "pub_date_relative": "30m ago"}, {"title": "China\u2019s CSI 300 slips into bear-market territory as AI rout deepens", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Oct 2026, 11:12 AM IST", "pub_date_relative": "30m ago"}, {"title": "Nokia Q3 profit rises on AI-driven network demand, outlook unchanged", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Oct 2026, 11:09 AM IST", "pub_date_relative": "32m ago"}, {"title": "Renk to sell slide bearings unit to Miba, trims 2026 earnings outlook", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Oct 2026, 11:07 AM IST", "pub_date_relative": "34m ago"}, {"title": "Global Market: Japanese bond yields fall to multiweek lows ahead of BOJ meeting", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Global Market: Japanese bond yields fall to multiweek lows ahead of BOJ meeting Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market: Japanese bond yields fall to multiweek lows ahead of BOJ meeting SECTIONS Global Market: Japanese bond yields fall to multiweek lows ahead of BOJ meeting By Anupam Nagar , ETMarkets.com Last Updated: Oct 22, 2026, 11:05:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Japanese government bond yields fell to multiweek lows on Thursday as geopolitical tensions and inflation concerns boosted safe-haven demand. The 10-year yield dropped to 2.88%, while investors awaited the Bank of Japan\u2019s policy meeting, with markets weighing potential rate hikes and global economic uncertainties.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "22 Oct 2026, 11:05 AM IST", "pub_date_relative": "37m ago"}, {"title": "Need an air ambulance? Your health policy may not cover the full cost", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nImagine a family living in a remote town in Bihar or a far-flung area in the hills. A family member falls seriously ill, but the required treatment is available only in a metro city. The family arranges an air ambulance to transport the patient to a hospital in the city. The bill comes to, say, \u20b9 10 lakh. Will health insurance cover it?\n\nThe expense will be covered only if the health insurance policy includes an air ambulance benefit. Even then, sub-limits may apply, typically ranging from \u20b9 2.5 lakh to \u20b9 5 lakh, including in plans that offer unlimited sum insured. Depending on the policy, this limit may be within the base sum insured or over and above it.\n\nAshish Kumar, founder of Delhi-based Sri Shani Financial Services, shares the case of the son of a Patna-based doctor who practises at AIIMS, Patna. The child drowned after being pushed into a swimming pool. His father immediately administered CPR and took him to AIIMS. When his condition deteriorated, he was put on a ventilator and subsequently referred to Delhi. Given his condition, road transport was not an option.\n\n\u201cWe faced no issues with hospitalization, which was all cashless. However, we are facing issues in getting the air ambulance claim. The company has not rejected it yet, but we have been receiving queries about the veracity of the claim,\u201d said Kumar. He spent more than \u20b9 9 lakh on the air ambulance.\n\nWhen buying health insurance, air ambulance cover rarely gets much attention. People may not check whether the benefit is available, let alone examine how it works. Coverage varies widely across products from the same insurer and across insurance companies.\n\nFor instance, HDFC ERGO \u2019s Optima Secure and Optima Secure Plus provide an air ambulance benefit of up to \u20b9 5 lakh per policy year, which is over and above the base sum insured. Its Restore plan, however, caps the coverage at \u20b9 2.5 lakh per hospitalization.", "source": "LiveMint Money", "pub_date_str": "22 Oct 2026, 11:03 AM IST", "pub_date_relative": "39m ago"}, {"title": "Jio Platforms IPO Day 2 Live: Retail Portion 100% Subscribed; GMP Signals 22% Gains", "full_content": "Track Day 2 subscription status, investor demand, GMP, IPO price band, allotment date and listing details of Jio Platforms.", "source": "NDTV Profit", "pub_date_str": "22 Oct 2026, 11:02 AM I ens 1 Paise Lower At 94.47 Per US Dollar", "source": "NDTV Profit", "pub_date_str": "22 Oct 2026, 10:53 AM IST", "pub_date_relative": "49m ago"}, {"title": "Vodafone Idea shares: Up 20% in 6 months! Will Q2 results 2026 fuel this rally? Experts' views, target price, stop-loss", "full_content": "Vodafone Idea share price target | Stock to buy today | Q2 Results 2026: Vodafone Idea shares have been reeling under the selling pressure since September 2026. The telecom stock has slipped by around 20% over the past month. However, despite a 20% correction in one month, Vodafone Idea shares have been money-making for investors in the last six months, yielding over 20% returns. Now, after the big relief given by the Government of India (GoI), on the AGR payment, investors are eagerly waiting for the Vodafone Idea Q2 Results 2026. Though the telecom major is yet to announce the Q2 Results 2026 date, the market expects the Vodafone Idea Q2 Results 2026 date to be around mid-November.\n\nOn what market expects from the Vodafone Idea Q2 Results 2026, Mahehsh M Ojha, VP \u2014 Research and Business Development at KC Securities, said, \u201cAfter the big relief from the GoI on the AGR payment, the market is expecting announcement of some expansion plans in the upcoming Q2 earnings of Vodafone Idea Ltd. However, there is not buzz about the subscriber base and even a steady report on this front would be a satisfying number for the market. However, the market is expecting improvement in ARPU and revenue growth, both YoY and QoQ.\u201d\n\nOjha maintained that the market would be keen to see developments in the \u20b9 45,000-crore capex program, and positive news on this front in Vodafone Idea's Q2 Results 2026 is expected to boost bulls' sentiment.\n\nLooking at the previews published by various brokerages, UBS has projected that the total subscriber base will remain relatively steady at around 19.5 crore, while ICICI Securities estimates sequential subscriber additions of roughly 10 lakh overall for Q2 FY27, including about 1 lakh net additions in 4G subscribers.\n\nExpecting a strong rebound in Vodafone Idea shares ahead of the announcement of Q2 Results 2026, Sumeet Bagadia, Executive Director at Choice Broking, said, \u201cThe teechniical chart pattern is hinting at a possible recovery and pullback.", "source": "LiveMint Markets", "pub_date_str": "22 Oct 2026, 10:51 AM IST", "pub_date_relative": "50m ago"}, {"title": "Swiggy shares slide over 5% ahead of Q2 results. What are analysts saying?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Swiggy shares slide over 5% ahead of Q2 results. What are analysts saying? Swiggy Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Swiggy shares slide over 5% ahead of Q2 results. What are analysts saying? SECTIONS Swiggy shares slide over 5% ahead of Q2 results. What are analysts saying? By Veer Sharma , ETMarkets.com Last Updated: Oct 22, 2026, 10:50:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Swiggy shares fell ahead of its Q2 FY27 results as investors assessed its path to profitability. Anand Rathi upgraded the stock to Buy, while rival Eternal reported strong earnings growth, supported by food delivery and quick commerce.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "22 Oct 2026, 10:50 AM IST", "pub_date_relative": "52m ago"}, {"title": "Mazagon Dock, Garden Reach Get Street-Low Targets As Goldman Sachs Flags Earnings Risk", "full_content": "Goldman's call marks another bearish assessment of Mazagon Dock in October and a rare Sell rating on Garden Reach, as the brokerage warns of an earnings downturn and uncertainty over fresh orders.", "source": "NDTV Profit", "pub_date_str": "22 Oct 2026, 10:50 AM IST", "pub_date_relative": "52m ago"}, {"title": "Yash Highvoltage shares jump 14% after strong H1FY27; target price raised, 31% upside seen by expert | Should you buy?", "full_content": "Yash Highvoltage shares surged 14% on Thursday, 22 October, after the company reported a strong financial performance for the first half of FY27, with revenue, EBITDA and profit after tax (PAT) registering robust year-on-year growth.\n\nYash Highvoltage reported consolidated revenue from operations of \u20b9 194.5 crore in H1 FY27, marking a 95% increase from \u20b9 99.6 crore in the corresponding period last year.\n\nEBITDA rose 136% year-on-year to \u20b9 54.7 crore, while the EBITDA margin expanded to 28.1% from 23.3% in H1 FY26.\n\nThe company's net profit surged 165% year-on-year to \u20b9 36.2 crore, compared with the year-ago period. The PAT margin improved to 18.6% from 13.7% in H1 FY26. Earnings per share (EPS) increased to \u20b9 12.5 from \u20b9 4.8 a year earlier.\n\nDuring the first half of FY27, Yash Highvoltage advanced its international expansion strategy through its US subsidiary, Yash HV USA Inc. The company entered into representation agreements with Ensales Electrical Associates Inc. and Gateway Power Sales, covering 22 US states.\n\nThe company also completed seismic qualification testing for its IEEE-compliant 138 kV and 230 kV oil-impregnated paper (OIP) condenser transformer bushings. According to the company, this achievement positions it among a select group of global original equipment manufacturers (OEMs) capable of supplying these products for seismically active regions of the US.\n\nIn another milestone, Yash Highvoltage successfully tested and supplied its first 245 kV wall-through transformer bushing to a leading public sector undertaking (PSU), expanding its product portfolio and technical capabilities.\n\nThe company also migrated to SAP S/4HANA during H1 FY27, maintaining uninterrupted business operations throughout the transition.", "source": "LiveMint Markets", "pub_date_str": "22 Oct 2026, 10:49 AM IST", "pub_date_relative": "53m ago"}, {"title": "Oil prices jump on Middle East worries as U.S., Israel reportedly weigh fresh Iran strikes", "full_content": "Oil prices climbed Thursday on worries over a possible escalation in the Middle East conflict as the U.S. reportedly plans to resume strikes against Iran.\n\nBrent crude futures rose 1.71% to $110.67 a barrel, while U.S. West Texas Intermediate crude gained 1.42% to $98.53.\n\nThe U.S. and Israeli militaries have drawn up specific plans for renewed strikes on Iran after next month's midterm elections, The New York Times reported, citing unnamed U.S. officials. Planning for a \"short but intensive\" operation is progressing, The Times said.\n\nThe U.S. has also ordered non-emergency government employees and their families to leave Saudi Arabia.\n\nState Department spokesman Tommy Pigott in a post on X said the order applies only to Saudi Arabia, citing increasing attacks by Iran-aligned Houthis on civilian targets, after reports said that the U.S. had directed some staff in the wider Gulf region to leave.\n\nThe economic fallout from elevated oil prices, however, may be less severe than in previous decades, as consumers have become less vulnerable to energy shocks, according to David Wagner, head of equity and portfolio manager at Aptus Capital Advisors.\n\n\"$100 oil today is very different than $100 oil, you know, 20, 30 years ago,\" Wagner said, noting that crude prices remain well below their inflation-adjusted historical highs.\n\nHe pointed to U.S. government data showing that gasoline accounted for roughly 5% of the average American's disposable income a decade ago, compared with about half that today, suggesting households may be better positioned to withstand elevated energy costs.", "source": "CNBC Top News", "pub_date_str": "22 Oct 2026, 10:48 AM IST", "pub_date_relative": "54m ago"}, {"title": "IRDAI Weighs More Time On Distribution Reforms As Brokers Seek Extension, Fair Pay: Sources", "full_content": "The insurance sector regulator is open to considering stakeholder requests for an extension, and may grant one selectively to market intermediaries, sources said.", "source": "NDTV Profit", "pub_date_str": "22 Oct 2026, 10:46 AM IST", "pub_date_relative": "56m ago"}, {"title": "Paras Healthcare IPO Day 2: GMP at 4%; check subscription status and key details", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a Paras Healthcare IPO Day 2: GMP at 4%; check subscription status and key details JM Financial Share Price Choice International Share Price IIFL Capital Services Share Price Anand Rathi Share & Stock Brokers Share Price SMC Global Securities Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Paras Healthcare IPO Day 2: GMP at 4%; check subscription status and key details SECTIONS Paras Healthcare IPO Day 2: GMP at 4%; check subscription status and key details By Ritesh Presswala , ETMarkets.com Last Updated: Oct 22, 2026, 10:46:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Syno easures that propped up the local currency .\n\nThe IPO-linked inflows helped the rupee gain to 94.35 per dollar, from its previous close at 94.46, despite higher oil prices. Brent crude rose nearly 2% to $110.6 per barrel on worries over hostilities in the Middle East after the United States ordered some diplomats to leave its missions in Saudi Arabia.\n\nThe currency is now on course for an eight-day streak of gains, having recovered from near record-low levels hit earlier in the month. Strong foreign portfolio flows drawn by the $3.2 billion record Jio IPO, have helped extend its rebound, with the public issue being fully subscribed within hours of opening for bids.\n\nThe sharp recovery has brought the rupee-dollar pair's 14-day relative strength index, a gauge of momentum, to nearly 74. A reading above 70 indicates the pair is overbought while below 30 signals it is oversold. The momentum has shifted sharply over the last two weeks, from 9 October, when the relative strength index had declined to about 27.\n\nThe rupee has also been supported by market expectations that Reserve Bank of India will deliver more rate hikes soon , after raising interest rates for the first time in nearly four years earlier this month. Minutes of the RBI's October policy meeting released after market hours on Wednesday signalled that policymakers reckon further tightening is necessary, but they also remain wary of an aggressive cycle over risks to growth.\n\n\u201cOur text-based net-hawkishness score\u2026suggests that the October MPC minutes were more hawkish than the Governor's statement (on October 7),\u201d analysts at Goldman Sachs said in a note.", "source": "LiveMint Markets", "pub_date_str": "22 Oct 2026, 10:44 AM IST", "pub_date_relative": "58m ago"}, {"title": "KEI Industries shares tumble 8% despite Q2 profit rising 29%, revenue up 39%", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache Mor grant worker Hazarat Ali for allegedly sharing an AI-generated video falsely showing an explosion at Karnataka's Vidhana Soudha.", "source": "NDTV Profit", "pub_date_str": "22 Oct 2026, 10:36 AM IST", "pub_date_relative": "1h ago"}, {"title": "M&M Financial Services shares crash 10% after Q2 results. What are Nomura and other analysts saying?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a M&M Financial Services shares crash 10% after Q2 results. What are Nomura and other analysts saying? The Economic Times daily newspaper is available online now. Read Today's Paper M&M Financial Services shares crash 10% after Q2 results. What are Nomura and other analysts saying? SECTIONS M&M Financial Services shares crash 10% after Q2 results. What are Nomura and other analysts saying? By Veer Sharma , ETMarkets.com Last Updated: Oct 22, 2026, 10:34:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Mahindra & Mahindra Financial Services shares fell sharply on despite a 55% year-on-year rise in Q2FY27 net profit to Rs 882 crore. Nomura lowered its target price to Rs 400 while retaining a Buy rating, citing asset quality concerns and rising funding costs. Motilal Oswal maintained its Buy rating.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "22 Oct 2026, 10:34 AM IST", "pub_date_relative": "1h ago"}, {"title": "SS Rajamouli Says Indian Cinema Has Not Done Justice To Ramayana And Mahabharata: 'I Was Never Fully Satisfied'", "full_content": "SS Rajamouli says he has never been fully satisfied with how Indian cinema has adapted the Ramayana and Mahabharata. The filmmaker hopes to bring India's legendary stories to the screen on a grander scale through Varanasi.", "source": "NDTV Profit", "pub_date_str": "22 Oct 2026, 10:33 AM IST", "pub_date_relative": "1h ago"}, {"title": "Who Is Amir Shokeen? Influencer Calls Tripura Youth 'Chinese', Kiren Rijiju Says 'Evil Man Will Be Punished'", "full_content": "In a fresh video, Shokeen said the original clip was meant as humour and that he did not know Tripura was a state.", "source": "NDTV Profit", "pub_date_str": "22 Oct 2026, 10:31 AM IST", "pub_date_relative": "1h ago"}, {"title": "Sri Lanka vs England Live Streaming: When And Where To Watch ODI Tri-Series Match In India", "full_content": "Sri Lanka and England face off in Rawalpindi as they aim to revive their tri-series campaigns", "source": "NDTV Profit", "pub_date_str": "22 Oct 2026, 10:30 AM IST", "pub_date_relative": "1h ago"}, {"title": "Reliance Industries share price: Jio IPO gets blockbuster response, but stock near 52-week low; what should you do?", "full_content": "Reliance share price : Reliance Industries shares declined around 1.5% on Thursday, October 22, even as Mukesh Ambani -led Jio Platforms' initial public offering (IPO) drew strong investor demand. The stock's decline came amid weakness in the broader market. Both Sensex and Nifty fell over 0.5% each.\n\nJio Platforms' \u20b9 30,213-crore IPO was fully subscribed within approximately 100 minutes of opening on Wednesday, October 21, making it the fastest among India's mega IPOs to achieve full subscription.\n\nThe stock has remained under pressure over the past year, with technical indicators pointing to crucial support levels. Meanwhile, market experts differ in their assessment of the recovery prospects, making the stock's next move an important watch for investors.\n\nReliance Industries shares fell around 1.5% to an intraday low of \u20b9 1,190 apiece on the BSE. The stock is now approximately 26% below its 52-week high of \u20b9 1,611.20, recorded in January 2026. Meanwhile, it is now just over 3% away from its 52-week low of \u20b9 1,152.30 on October 13.\n\nThe stock has declined 4% over the past month, 7% in three months and 12% in six months. Its losses have exceeded 18% over the past year, highlighting the sustained pressure on the shares despite the attention surrounding the Jio Platforms IPO.\n\nReliance Industries shares have remained under pressure despite the strong response to Jio Platforms' IPO, leaving investors weighing the stock's recovery potential against continued technical weakness\n\nMonarch Networth Capital has recommended accumulating Reliance Industries shares in the \u20b9 1,180\u20131,220 range, with a target of \u20b9 1,350\u20131,450 over the next three to four months. The brokerage has advised a stop loss below \u20b9 1,100 on a closing basis.\n\nAccording to Monarch Networth Capital, the stock had rallied towards \u20b9 1,600\u20131,620 before entering a multi-month correction.", "source": "LiveMint Markets", "pub_date_str": "22 Oct 2026, 10:29 AM IST", "pub_date_relative": "1h ago"}, {"title": "Aditya Birla Sun Life AMC Q2 Review: MOFSL Raises Target Price After Inline Numbers; Buy, Sell Or Hold?", "full_content": "Continued improvement in flows and market share recovery remain key earnings drivers, adds the brokerage.", "source": "NDTV Profit", "pub_date_str": "22 Oct 2026, 10:21 AM IST", "pub_date_relative": "1h ago"}, {"title": "Fusion CX Shares Make Muted Debut On Exchanges, List With Up To 5% Premium", "full_content": "The issue was priced between Rs 275 to Rs 289 per share.", "source": "NDTV Profit", "pub_date_str": "22 Oct 2026, 10:19 AM IST", "pub_date_relative": "1h ago"}, {"title": "PC Jeweller shares jump 9% after Q2 results, Aditya Kumar Halwasiya\u2019s bulk deal in focus | What investors should know", "full_content": "PC Jeweller shares jumped nearly 9% on Thursday, 22 October, following the company's strong Q2 FY27 results and amid investor attention on bulk deal transactions in the stock.\n\nPC Jeweller Ltd reported a 58% year-on-year jump in consolidated net profit to \u20b9 330.66 crore for the September quarter of FY27, supported by higher sales. The company had posted a net profit of \u20b9 209.54 crore in the corresponding quarter last year.\n\nTotal income rose 28% year-on-year to \u20b9 1,054.47 crore in Q2 FY27 from \u20b9 825.25 crore a year earlier, according to the company's regulatory filing. Total expenses increased to \u20b9 759.42 crore from \u20b9 688.85 crore in the year-ago period.\n\nA key milestone during the quarter was the company's return to debt-free status after it repaid outstanding dues to all 14 consortium banks ahead of schedule. PC Jeweller said the resulting reduction in interest costs, expected to become more significant from the second half of FY27, should support its profitability.\n\nThe company also received around \u20b9 142 crore in remittances from export debtors during the quarter following negotiations and resolution of outstanding issues. The receipts mark the beginning of recovery of long-pending export receivables, it said.\n\nLooking ahead, PC Jeweller plans to roll out up to 100 large-format showrooms across Tier I, Tier II and Tier III cities over the next 12\u201318 months. The expansion will combine company-owned outlets with an asset-light franchise model.\n\nBulk deals in PC Jeweller on 21 October saw Chairman and Managing Director of Cupid, Aditya Kumar Halwasiya, purchase 5.51 crore shares at \u20b9 18.39 apiece, amounting to approximately \u20b9 101.33 crore, as per NSE data.\n\nHRTI Private Limited bought 7.37 crore shares at \u20b9 18.44 per share, worth around \u20b9 135.99 crore, while selling 8.76 crore shares at \u20b9 18.36 apiece for \u20b9 160.81 crore.", "source": "LiveMint Markets", "pub_date_str": "22 Oct 2026, 10:12 AM IST", "pub_date_relative": "1h ago"}, {"title": "Defence Stocks Decline: Mazagon Dock, Garden Reach Lead Losses As Goldman Sachs Sees Earnings Pressure, Order Delays", "full_content": "Goldman Sachs initiated Sell ratings on both shipbuilders, citing weak order visibility and an expected earnings decline. It set 12-month price targets of Rs 1,855 for Mazagon Dock and Rs 1,515 for Garden Reach.", "source": "NDTV Profit", "pub_date_str": "22 Oct 2026, 10:09 AM IST", "pub_date_relative": "1h ago"}, {"title": "Air Pollution Alert: Mumbai Struggles With Unhealthy AQI; Delhi Air Quality Turns Severe", "full_content": "Air pollution is worsening in Delhi and Mumbai, with Mumbai ranking third globally and several Indian cities reporting dangerously high pollution levels.", "source": "NDTV Profit", "pub_date_str": "22 Oct 2026, 10:09 AM IST", "pub_date_relative": "1h ago"}, {"title": "U.S. pulls diplomats from Saudi Arabia as it reportedly readies Iran strikes after midterms", "full_content": "The U.S. ordered non-emergency government employees and their families to leave Saudi Arabia as Houthi attacks on the kingdom escalate.\n\nThe move comes as the U.S. and Israeli militaries have drawn up specific plans for renewed strikes on Iran after next month's midterm elections, according to The New York Times, citing unnamed U.S. officials.\n\nPlanning for a \"short but intensive\" operation is progressing, The Times said.\n\nThe developments point to a possible widening of the nearly eight-month war, while U.S. and Iranian negotiators continue talks on Tehran's nuclear program and the Strait of Hormuz.\n\nState Department spokesman Tommy Pigott in a post on X said the order applies only to Saudi Arabia, citing increasing attacks by Iran-aligned Houthis on civilian targets. Meanwhile, Reuters reported Washington also plans to withdraw family members from other missions in the region.\n\nA strike Wednesday on King Fahd International Airport in Dammam killed at least one person and injured eight. Two people died in a drone attack on Saudi Aramco's Shaybah oil field, the Saudi Press Agency reported, adding that operations were not affected.\n\nIn recent days, the U.S. and Israeli militaries have stepped up military exercises, including flying planes over Iraq to practice strike maneuvers, according to The New York Times. The Times also reported that Defense Secretary Pete Hegseth met Israeli Prime Minister Benjamin Netanyahu during an unannounced visit to Israel this week to discuss potential new strikes.\n\nThe renewed military strikes would likely target Iran's energy infrastructure, nuclear facilities, and missile and drone arsenal, according to The Times, noting that President Donald Trump has yet to approve the fresh strikes and has repeatedly vetoed plans for a return to major combat this year.", "source": "CNBC Top News", "pub_date_str": "22 Oct 2026, 10:05 AM IST", "pub_date_relative": "1h ago"}, {"title": "Stock futures fall as investors digest earnings from Meta and Tesla: Live updates", "full_content": "U.S. equity futures slid early Thursday after investors digested third-quarter earnings from Big Tech names including Meta Platforms and Tesla.\n\nS&P 500 futures fell 0.66%, and Nasdaq-100 futures dropped 1.32%. Dow Jones Industrial Average futures ticked down 0.28%, or 147 points.\n\nIn Asia, markets traded lower. South Korea's Kospi fell more than 1%, while Japan's Nikkei 225 declined 0.73%. Australia's S&P/ASX 200 lost 0.53%. Hong Kong's Hang Seng Index is down more than 2%. Mainland China's CSI 300 is down 0.37%.\n\nShares of Meta gained 2% in extended trading. The Facebook and Instagram parent delivered a revenue beat along with strong guidance for the current quarter. Meanwhile, Tesla reported a better-than-expected top and bottom line for its third-quarter results. Shares of the electric vehicle maker were last off 3%.\n\n\"The quarter showed the AI investment paying off in the core,\" said Dan Ives, partner and senior managing director at Yorkville Ives in his post Meta earnings reaction note. Spend is \"better controlled than feared,\" Ives added as Meta narrowed the range for its full-year data center-related capital expenditures.\n\nThe action follows a positive day on Wall Street, with the S&P 500 notching a three-day win streak, while the Dow jumped 360 points. The Nasdaq Composite closed 1% higher, catching a tailwind from SpaceX and Tesla .\n\nBlowout quarterly results from SpaceX fueled investors' excitement for the artificial intelligence trade, sending shares of Micron Technology and Advanced Micro Devices higher. Also fanning the flames was news from Super Micro Computer , which lifted its fiscal first-quarter revenue outlook .\n\nThere was also some focus on Nvidia's U.S. supply chain agreements Wednesday. The chip giant announced plans to expand global manufacturing capacity to meet growing demand for its accelerated computing and full-stack AI factory platform.", "source": "CNBC Top News", "pub_date_str": "22 Oct 2026, 10:03 AM IST", "pub_date_relative": "1h ago"}, {"title": "'You Are A Stupid Person': Trump Snaps At ABC Reporter Over Russia Sanctions Question | Viral Video", "full_content": "The incident comes a day after Russia freed Hubbard, the second American released from Russian custody in about two months.", "source": "NDTV Profit", "pub_date_str": "22 Oct 2026, 09:59 AM IST", "pub_date_relative": "1h ago"}, {"title": "Your Salary Rises 10% Every Year. Should Your SIP Rise By 10% Too?", "full_content": "With time, this increment adds to your salary, which can be really helpful in improving your lifestyle and having more disposable income as well as planning your finances.", "source": "NDTV Profit", "pub_date_str": "22 Oct 2026, 09:56 AM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "International Gemological Institute shares hit 10% upper circuit- What's fuelling IGI stock rally? Q2 results highlights", "full_content": "International Gemological Institute ( IGI ) share price was locked in its 10% upper circuit at \u20b9 353.20 apiece on Thursday, October 22, after the company reported strong earnings for the quarter ended September 2026 (Q2FY27). The gemological services provider posted robust growth in both profit and revenue, supported by healthy demand and strong operational execution.\n\nThe stock's sharp rally followed a period of mixed performance. IGI shares have gained 8% in one week and 1.5% over the past three months, but declined 2.5% in six months. The stock has added 5% over the past year.\n\nAt Thursday's upper-circuit price, the stock was around 9% below its 52-week high of \u20b9 388, recorded in May 2026. Its 52-week low stands at \u20b9 287.25, touched in January 2026.\n\nInternational Gemological Institute reported a 43.14% year-on-year increase in consolidated profit after tax (PAT) to \u20b9 185.8 crore in Q2FY27 , compared with \u20b9 129.8 crore in the corresponding quarter of the previous fiscal year, according to a regulatory filing.\n\nRevenue from operations rose 31% to \u20b9 398 crore during the quarter under review, against \u20b9 303.7 crore in the year-ago period. The growth in revenue and profitability reflected healthy demand trends and strong operational execution during the September quarter.\n\nIGI Managing Director and CEO Tehmasp Printer said the company had delivered strong financial growth while continuing to provide certification services across different segments of the gems and jewellery industry.\n\n\u201cThe second quarter of FY27 was marked by healthy demand trends and strong operational execution, with consolidated revenue up 31% and PAT up 43% year-on-year.", "source": "LiveMint Markets", "pub_date_str": "22 Oct 2026, 11:39 AM IST", "pub_date_relative": "2m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "M&M Financial share price plunges 10% after Q2 results 2026 but brokerages divided on outlook | Buy, sell or hold?", "full_content": "Mahindra & Mahindra Financial Services (M&M Financial Services) shares tumbled nearly 10% on Thursday, 22 October, even as the non-banking financial company (NBFC) posted strong earnings growth for the September quarter of FY27, driven by higher business volumes and a decline in credit costs.\n\nThe company\u2019s consolidated net profit rose 55% year-on-year to \u20b9 882 crore in Q2 FY27, compared with \u20b9 569 crore in the year-ago period.\n\nRevenue from operations grew 15% to \u20b9 5,164 crore, while net interest income (NII) increased 17% year-on-year to \u20b9 2,822 crore. Consolidated net profit stood at \u20b9 911 crore, up 61%, while total assets expanded 21% to \u20b9 1.80 lakh crore.\n\nAsset quality-related costs showed improvement during the quarter, with credit costs declining to 1.6% of average total assets from 2.2% in the corresponding period last year. Net interest margin (NIM), however, remained steady at 7%, the company said in its regulatory filing.\n\nFor the longer term, Mahindra & Mahindra Financial Services aims to achieve a return on assets (RoA) of 2.2%\u20132.5% by FY31. Its RoA stood at 2.2% in the September quarter.\n\nBrokerages have offered mixed views on Mahindra & Mahindra Financial Services following its Q2 FY27 results, with concerns over rising funding costs and potential pressure on margins and asset quality in the tractor-financing segment tempering the outlook. While ICICI Securities retained its \u2018Buy\u2019 rating and target price of \u20b9 415, Nomura lowered its target to \u20b9 400, and Nuvama Institutional Equities maintained its \u2018Hold\u2019 rating with a reduced target of \u20b9 340.\n\nAccording to media reports, Nomura cut its target price on Mahindra & Mahindra Financial Services to \u20b9 400 from \u20b9 415 while retaining its \u2018Buy\u2019 rating, implying an upside potential of around 35%.\n\nThe brokerage flagged concerns over asset quality in the tractor financing segment and expects credit costs to rise to an annualised 1.8% in Q3 and Q4 FY27, compared with 1.7% in the first half of the financial year.", "source": "LiveMint Markets", "pub_date_str": "22 Oct 2026, 11:37 AM IST", "pub_date_relative": "4m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Freefall! eMudhra shares crash 34% in just 3 sessions, near 52-week low - Why is stock plunging? What market experts say", "full_content": "eMudhra shares have been in free fall over the last three sessions. The stock crashed 15% in intraday trade on the BSE on Thursday, 22 October, looking set to extend losses for the third consecutive session. The stock hit an intraday low of \u20b9 367 in Thursday's session, inching closer to its 52-week low of \u20b9 365.75, hit on 30 March. At the current market price, the stock has lost 34% in just three consecutive sessions.\n\nThe stock has been witnessing a massive selloff after eight intermediate certification authority (CA) certificates associated with eMudhra were compromised.\n\nThe Indian Computer Emergency Response Team (CERT-In) said eMudhra Limited, an India-based certification authority, reported that private keys associated with eight intermediate CA certificates in its public key infrastructure (PKI) had been compromised.\n\nIn an exchange filing on 21 October, eMudhra said a flaw in the KGC caused a wrap/unwrap step to produce a second set of weak keys alongside the original strong keys. The weak keys were the ones published to the browser root stores. eMudhra is working to establish the root cause.\n\nThe company said these roots and issuing CAs have gone through independent audits for two years in a row, and have been in browser trust lists since mid 2025.\n\neMudhra confirmed that its infrastructure was not compromised, there was no data breach, and all physical and logical security controls remained intact.\n\n\"This incident has no connection with eMudhra\u2019s Indian Digital Signature Certificate (DSC) and eSign businesses. The global TLS business runs on infrastructure that is completely separate from the India DSC business. DSC and eSign services in India are running normally,\" said the company.\n\n\"The affected global TLS business is a very small part of eMudhra\u2019s operations and accounts for around 1% of the company\u2019s revenue. However, this may have some reputational risks for eMudhra which cannot be quantified,\" the company said.", "source": "LiveMint Markets", "pub_date_str": "22 Oct 2026, 11:31 AM IST", "pub_date_relative": "11m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "US Stock Futures Slip as Tech Earnings Rally Fades: Markets Wrap - Bloomberg.com", "full_content": "US Stock Futures Slip as Tech Earnings Rally Fades: Markets Wrap Bloomberg.com Stock futures fall as investors digest earnings from Meta and Tesla: Live updates CNBC Futures Fall; Meta, Tesla Lead Big Earnings Late Investor's Business Daily How Are Dow, S&P 500, Nasdaq Futures Trading After META, TSLA Earnings? Yahoo Finance 3 things to look out for on Thursday Seeking Alpha", "source": "Google News Business", "pub_date_str": "22 Oct 2026, 11:28 AM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Schindler raises 2026 margin outlook as Q3 profit grows", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Oct 2026, 11:23 AM IST", "pub_date_relative": "19m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Dearness allowance delay July 2026: Government employees await DA hike and arrears update \u2014 what to watch next", "full_content": "Central government employees and pensioners are still waiting for the Centre to announce the July 2026 revision in dearness allowance (DA) and dearness relief (DR). Despite expectations surrounding recent Cabinet meetings and festive-season bonus announcements, the government has not yet confirmed the revised rates, arrears, or payment timeline.\n\nThe Union Cabinet meeting held on October 14 did not announce a DA hike. Instead, the government announced a performance-linked bonus (PLB) for eligible Railway employees. On October 16, the Centre announced a non-performance-linked bonus for central government employees, but there was no update on DA or DR.\n\nThe government also made no announcement on the revision ahead of Dussehra, which fell on October 20.\n\nDearness allowance is paid to central government employees to help offset the impact of inflation on their living expenses. Pensioners receive a corresponding benefit called dearness relief. Both are calculated as a percentage of basic pay or pension.\n\nThe Centre generally revises DA and DR twice a year, with the changes taking effect from January 1 and July 1. The January revision is typically announced in March or April, while the July revision is often announced in October. However, the announcement may come after the effective date, making employees eligible for arrears.\n\nOn April 18, 2026, the Union Cabinet approved a 2-percentage-point increase in DA and DR, raising the rates from 58% to 60% of basic pay or pension, effective January 1, 2026. The revision followed the accepted formula linked to the recommendations of the 7th Central Pay Commission.\n\nThe DA revision is linked to the All-India Consumer Price Index for Industrial Workers (AICPI-IW), published by the Labour Bureau.", "source": "LiveMint Money", "pub_date_str": "22 Oct 2026, 11:21 AM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Economics", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Nokia ADR earnings beat by $0.03, revenue topped estimates", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Oct 2026, 11:19 AM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Earnings call transcript: Techcombank posts record Q3 2026 profit as stock slips", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Oct 2026, 11:18 AM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "SML Isuzu shares: SML Mahindra shares tank for 3rd session in row after 33% gain in 6 months | Buy, sell or hold?", "full_content": "SML Mahindra share price continued to fall for the third session straight on Thursday, 22 October. Formerly known as SML Isuzu, the Mahindra Group stock opened at \u20b9 5,200 per share on BSE today, compared to the previous close of \u20b9 5,514.75 on Wednesday.\n\nSML Mahindra shares have remained weak in the near-term, however, has given positive returns in the broader time frame despite market volatility. The stock has fallen 24.56% in a month but has gained 33% in six months.\n\nLooking at the broader level, the stock has delivered multibagger returns of 290% in three years and 583% in five years.\n\nSML Mahindra reported a 42.9% year-on-year (YoY) decline in net profit to \u20b9 12 crore in the September quarter, compared with \u20b9 21 crore in the corresponding quarter last year. However, revenue from operations increased 20.7% YoY to \u20b9 670 crore from \u20b9 555 crore a year earlier.\n\nDespite the revenue growth, the company\u2019s operating performance weakened, with earnings before interest, tax, depreciation and amortisation (EBITDA) falling 31% YoY to \u20b9 29 crore from \u20b9 42 crore. The EBITDA margin also contracted to 4.3% from 7.6% in the year-ago quarter, marking a decline of 3.3 percentage points.\n\nSeparately, the company said its proposed \u20b9 525 crore acquisition of the truck and bus division of its parent, Mahindra & Mahindra Ltd, is expected to be completed on or before January 31, 2027. The transaction will be structured as a slump sale, involving the transfer of the business as a whole, with the final consideration subject to working capital adjustments as specified in the agreement. SML Mahindra added that it had not made any changes to its unaudited financial results for the September quarter and the first half of the financial year, as the acquisition is yet to be completed.\n\nOn the technical outlook, Gaurav Garg, Head - Research, Lemonn, said that the stock has declined sharply by around 8.5% (current week)to \u20b9 5,031, indicating significant selling pressure and weakening momentum.", "source": "LiveMint Markets", "pub_date_str": "22 Oct 2026, 11:17 AM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Nokia Q3 profit ris te": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Vodafone Idea shares: Up 20% in 6 months! Will Q2 results 2026 fuel this rally? Experts' views, target price, stop-loss", "full_content": "Vodafone Idea share price target | Stock to buy today | Q2 Results 2026: Vodafone Idea shares have been reeling under the selling pressure since September 2026. The telecom stock has slipped by around 20% over the past month. However, despite a 20% correction in one month, Vodafone Idea shares have been money-making for investors in the last six months, yielding over 20% returns. Now, after the big relief given by the Government of India (GoI), on the AGR payment, investors are eagerly waiting for the Vodafone Idea Q2 Results 2026. Though the telecom major is yet to announce the Q2 Results 2026 date, the market expects the Vodafone Idea Q2 Results 2026 date to be around mid-November.\n\nOn what market expects from the Vodafone Idea Q2 Results 2026, Mahehsh M Ojha, VP \u2014 Research and Business Development at KC Securities, said, \u201cAfter the big relief from the GoI on the AGR payment, the market is expecting announcement of some expansion plans in the upcoming Q2 earnings of Vodafone Idea Ltd. However, there is not buzz about the subscriber base and even a steady report on this front would be a satisfying number for the market. However, the market is expecting improvement in ARPU and revenue growth, both YoY and QoQ.\u201d\n\nOjha maintained that the market would be keen to see developments in the \u20b9 45,000-crore capex program, and positive news on this front in Vodafone Idea's Q2 Results 2026 is expected to boost bulls' sentiment.\n\nLooking at the previews published by various brokerages, UBS has projected that the total subscriber base will remain relatively steady at around 19.5 crore, while ICICI Securities estimates sequential subscriber additions of roughly 10 lakh overall for Q2 FY27, including about 1 lakh net additions in 4G subscribers.\n\nExpecting a strong rebound in Vodafone Idea shares ahead of the announcement of Q2 Results 2026, Sumeet Bagadia, Executive Director at Choice Broking, said, \u201cThe teechniical chart pattern is hinting at a possible recovery and pullback.", "source": "LiveMint Markets", "pub_date_str": "22 Oct 2026, 10:51 AM IST", "pub_date_relative": "50m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Swiggy shares slide over 5% ahead of Q2 results. What are analysts saying?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Swiggy shares slide over 5% ahead of Q2 results. What are analysts saying? Swiggy Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Swiggy shares slide over 5% ahead of Q2 results. What are analysts saying? SECTIONS Swiggy shares slide over 5% ahead of Q2 results. What are analysts saying? By Veer Sharma , ETMarkets.com Last Updated: Oct 22, 2026, 10:50:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Swiggy shares fell ahead of its Q2 FY27 results as investors assessed its path to profitability. Anand Rathi upgraded the stock to Buy, while rival Eternal reported strong earnings growth, supported by food delivery and quick commerce.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\ mproved to 18.6% from 13.7% in H1 FY26. Earnings per share (EPS) increased to \u20b9 12.5 from \u20b9 4.8 a year earlier.\n\nDuring the first half of FY27, Yash Highvoltage advanced its international expansion strategy through its US subsidiary, Yash HV USA Inc. The company entered into representation agreements with Ensales Electrical Associates Inc. and Gateway Power Sales, covering 22 US states.\n\nThe company also completed seismic qualification testing for its IEEE-compliant 138 kV and 230 kV oil-impregnated paper (OIP) condenser transformer bushings. According to the company, this achievement positions it among a select group of global original equipment manufacturers (OEMs) capable of supplying these products for seismically active regions of the US.\n\nIn another milestone, Yash Highvoltage successfully tested and supplied its first 245 kV wall-through transformer bushing to a leading public sector undertaking (PSU), expanding its product portfolio and technical capabilities.\n\nThe company also migrated to SAP S/4HANA during H1 FY27, maintaining uninterrupted business operations throughout the transition.", "source": "LiveMint Markets", "pub_date_str": "22 Oct 2026, 10:49 AM IST", "pub_date_relative": "53m ago", "cfa_topics": ["Financial Statement Analysis", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Oil prices jump on Middle East worries as U.S., Israel reportedly weigh fresh Iran strikes", "full_content": "Oil prices climbed Thursday on worries over a possible escalation in the Middle East conflict as the U.S. reportedly plans to resume strikes against Iran.\n\nBrent crude futures rose 1.71% to $110.67 a barrel, while U.S. West Texas Intermediate crude gained 1.42% to $98.53.\n\nThe U.S. and Israeli militaries have drawn up specific plans for renewed strikes on Iran after next month's midterm elections, The New York Times reported, citing unnamed U.S. officials. Planning for a \"short but intensive\" operation is progressing, The Times said.\n\nThe U.S. has also ordered non-emergency government employees and their families to leave Saudi Arabia.\n\nState Department spokesman Tommy Pigott in a post on X said the order applies only to Saudi Arabia, citing increasing attacks by Iran-aligned Houthis on civilian targets, after reports said that the U.S. had directed some staff in the wider Gulf region to leave.\n\nThe economic fallout from elevated oil prices, however, may be less severe than in previous decades, as consumers have become less vulnerable to energy shocks, according to David Wagner, head of equity and portfolio manager at Aptus Capital Advisors.\n\n\"$100 oil today is very different than $100 oil, you know, 20, 30 years ago,\" Wagner said, noting that crude prices remain well below their inflation-adjusted historical highs.\n\nHe pointed to U.S. government data showing that gasoline accounted for roughly 5% of the average American's disposable income a decade ago, compared with about half that today, suggesting households may be better positioned to withstand elevated energy costs.", "source": "CNBC Top News", "pub_date_str": "22 Oct 2026, 10:48 AM IST", "pub_date_relative": "54m ago", "cfa_topics": ["Economics", "Derivatives", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "IRDAI Weighs More Time On Distribution Reforms As Brokers Seek Extension, Fair Pay: Sources", "full_content": "The insurance sector regulator is open to considering stakeholder requests for an extension, and may grant one selectively to market intermediaries, sources said.", "source": "NDTV Profit", "pub_date_str": "22 Oct 2026, 10:46 AM IST", "pub_date_relative": "56m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Paras H
