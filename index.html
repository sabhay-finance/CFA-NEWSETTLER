<script>
    // This variable will be injected during the build process
    const allData = {"general": [{"title": "Bajaj Consumer Q2 Results: Net Profit Jumps 66% To Rs 70 Crore, Revenue Rises 26%", "full_content": "Despite the improvement in operating performance, the company continues to face pressure from elevated prices of some raw materials.", "source": "NDTV Profit", "pub_date_str": "14 Oct 2026, 06:25 PM IST", "pub_date_relative": "3m ago"}, {"title": "IDBI Bank strategic restructuring to attract FDI, boost banking sector, says FM Sitharaman", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a IDBI Bank strategic restructuring to attract FDI, boost banking sector, says FM Sitharaman The Economic Times daily newspaper is available online now. Read Today's Paper IDBI Bank strategic restructuring to attract FDI, boost banking sector, says FM Sitharaman SECTIONS IDBI Bank strategic restructuring to attract FDI, boost banking sector, says FM Sitharaman PTI Last Updated: Oct 14, 2026, 06:24:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Cabinet Committee on Economic Affairs approved the strategic restructuring of IDBI Bank to attract foreign investments. The government retains a minority stake in the bank after its recovery, enabling further growth. Fairfax Financial Holdings will acquire a 60.72 percent stake in the bank for Rs 52,878 crore. The transaction aims to strengthen India's banking sector and reduce government ownership of state-run assets.\n\nOnion inflation at 108%? Yes, but not really. What is different this time?\n\nCurbing rupee bets: What the RBI\u2019s new rules mean for the hedge-now-or-wait question\n\nBrinjal, buffalo, bacteria: Inside India\u2019s pay-for-nature system\n\nHomebuyers wait as NCLT panel picks holes in unfinished Jaypee projects\n\nThe NBFC saga - Part 3: How one default in 2018 changed the way RBI reads risk\n\nFour rules made HDFC Bank a compounder. All four have stopped. Can the new CEO rewrite them?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "14 Oct 2026, 06:24 PM IST", "pub_date_relative": "4m ago"}, {"title": "Crude oil prices above $100 a barrel: Why HPCL, IOCL and BPCL could face earnings pressure, experts decode", "full_content": "Crude oil prices, which have remained elevated since the outbreak of the war in the Middle East, are expected to weigh on the profitability of the three state-run oil marketing companies (OMCs)\u2014Hindustan Petroleum Corporation (HPCL), Bharat Petroleum Corporation (BPCL), and Indian Oil Corporation (IOC).\n\nHigher crude prices increase the cost of refining and fuel production, squeezing marketing margins if retail fuel prices are not revised accordingly.\n\nDhaval Popat, Analyst \u2013 Energy at Choice Institutional Equities, said state-owned oil marketing companies (OMCs) remain the most vulnerable to crude oil prices sustaining above $100 per barrel, particularly if retail petrol and diesel prices remain unchanged.\n\nPopat expects HPCL to face the highest earnings pressure, followed by IOCL and BPCL, as elevated crude prices compress marketing margins, potentially offsetting the benefits of stronger refining margins.\n\nPopat said city gas distribution (CGD) companies, including IGL, MGL, Gujarat Gas , and Adani Total Gas , could face margin pressure if higher gas procurement costs cannot be fully passed on to consumers.\n\nMeanwhile, GAIL and Petronet LNG remain exposed to potential volume weakness and gas-sourcing risks, although their regulated or contracted businesses provide some insulation, he noted.\n\nAccording to Popat, the key earnings risk is not crude oil prices remaining above $100 per barrel alone, but the inability of companies to pass higher input costs on to end consumers.\n\nHe added that tightness in global middle-distillate markets could support refining profitability, making OMC marketing margins the principal area of concern.", "source": "LiveMint Markets", "pub_date_str": "14 Oct 2026, 06:24 PM IST", "pub_date_relative": "4m ago"}, {"title": "Bank of America shares drop 7% after third-quarter revenue miss and regulatory penalty", "full_content": "Bank of America on Wednesday posted a sharp profit decline after being hit with a $1.2 billion penalty by U.S. regulators, while revenue also disappointed after trading operations generated about $750 million less than expected.\n\nThe bank's third-quarter profit fell 17% to $6.93 billion, or 91 cents a share. Excluding the penalty, which sapped income by 17 cents, EPS would've been $1.08 a share.\n\nCompanywide revenue rose 3.2% to $30.12 billion in the quarter, on an FTE basis, but that was below expectations by about $570 million, largely on misses from Wall Street trading operations.\n\nFixed income trading revenue fell 17% to $2.55 billion on weakness in mortgages, municipals and credit activity. That is roughly $450 million below the StreetAccount estimate.\n\nEquities trading revenue climbed 10% to $2.51 billion, but that was also below analysts' expectations, by nearly $300 million.\n\nThe trading disappointment comes after CEO Brian Moynihan told analysts last month that trading revenue would be roughly flat; instead the combined bond and stock trading results fell by 5%.\n\nInvestment banking revenue dropped 11% to $1.8 billion, roughly in line with expectations and Moynihan's September guidance.\n\nIn a research note published Wednesday, Wells Fargo analyst Mike Mayo called the firm's capital markets results \"easily worst in class\" for the quarter.", "source": "CNBC Finance", "pub_date_str": "14 Oct 2026, 06:24 PM IST", "pub_date_relative": "4m ago"}, {"title": "Consumer prices rose at 3.7% annual rate in September as gas costs skyrocket", "full_content": "September brought little relief to the accelerating cost of living, as consumer prices increased again and kept the inflation rate well above the Federal Reserve's goal.\n\nThe consumer price index , a broad measure of goods and services costs across the U.S. economy, rose a seasonally adjusted 0.6% for the month, putting the 12-month rate at 3.7%, the Bureau of Labor Statistics reported Wednesday. Economists surveyed by Dow Jones expected respective gains of 0.6% and 3.6%.\n\nStripping out volatile food and energy costs, so-called core CPI rose 0.3% for the month and was up 2.6% on an annual basis, compared to respective estimates for 0.2% and 2.5%.\n\nSurging energy costs were again the primary culprit in the inflation picture. The energy index jumped 5.2% as tensions continued between the U.S. and Iran in a war launched in late February that shows no signs of ending anytime soon.\n\nGasoline prices soared 9.1%, accounting for about half the gain in headline CPI, according to the BLS. Over the past year, gas has posted a 34.2% gain while fuel oil has roared higher by 74.2%.\n\nFood prices were flat on the month and up 2.5% from a year ago. However, shelter prices increased 0.4% and used car and truck prices jumped 0.7%.\n\nStock market futures turned negative following the release while bond yields were sharply higher.\n\nInflation as measured by CPI has surpassed the Fed's 2% benchmark since March 2021. The gauge had been trending lower at the start of 2026, but then spiked following the strikes the U.S. and Israel launched against Iran.", "source": "CNBC Top News", "pub_date_str": "14 Oct 2026, 06:21 PM IST", "pub_date_relative": "6m ago"}, {"title": "Morgan Stanley tops estimates as equities trading revenue beats expectations by $909 million", "full_content": "Morgan Stanley posted third-quarter results that beat expectations on blockbuster results in its equities trading franchise.\n\nThe company said profit climbed 6.5% to $4.91 billion, or $3.03 a share. Revenue climbed 12% to $20.34 billion.\n\nThe firm's equities trading division, long a marquee business for Morgan Stanley, posted a 41% increase in revenue to $5.8 billion, exceeding the StreetAccount estimate by about $909 million.\n\nMorgan Stanley cited widespread strength across its equities products and regions, but cited Asia as a source of particular strength in the quarter. The gains in that business helped offset disappointments elsewhere.\n\nFixed income trading revenue fell 7% to $2.01 billion, driven by declines in credit and commodities, which is roughly $260 million below expectations.\n\nInvestment banking revenue edged 2% higher to $2.16 billion, about $110 million below expectations. The bank cited an increase in advisory revenue on more completed mergers, but declines in equity underwriting on lower IPOs and a decline in fixed income underwriting.\n\nStill, the results were \"good, but not great,\" as some business metrics showed slower improvement in the quarter, Wells Fargo analyst Mike Mayo said Wednesday in a note.\n\nAnalysts will want to know what CEO Ted Pick has to say on the outlook for mergers and IPOs for the rest of the year amid the churn caused by rising interest rates.", "source": "CNBC Finance", "pub_date_str": "14 Oct 2026, 06:19 PM IST", "pub_date_relative": "9m ago"}, {"title": "Trump's diesel dilemma \u2014 by the numbers", "full_content": "Diesel prices are surging as midterms approach \u2013 and they are likely to stay high in the near future, according to analysts.\n\nThe International Energy Agency's monthly report for October, released Wednesday, was the latest to predict that constraints on the diesel market will likely keep prices elevated into next year. The group warned that even if refineries step up production of diesel into the year-end inventories will likely remain strained until the second half of 2027.\n\nLast Friday, President Donald Trump unexpectedly paused sanctions on Russian diesel fuel and announced that he reached a deal with President Vladimir Putin in which the Kremlin would release 4.8 million metric tons of diesel , or nearly 36 million barrels, to the global market.\n\nOver the weekend, he took to Truth Social to announce an \"energy ceasefire\" between Russia and Ukraine , but Ukrainian President Volodymyr Zelenskyy later accused Russia of attacking the country's energy facilities .\n\nThe foreign policy developments come as rising fuel prices \u2014 particularly skyrocketing diesel \u2014 have become a major flashpoint ahead of this year's midterm election. But releasing Russian diesel to the global market is unlikely to drop prices in the near term. A note from Goldman Sachs last week even predicted that diesel prices will remain high through 2027 as refineries struggle to meet demand.\n\nWholesale diesel prices have more than doubled since the beginning of 2026 through the end of September as both the war in Iran and Russia's war in Ukraine have dramatically cut global supply.\n\nTrump has insisted that the war in Ukraine is to blame for high diesel prices. On July 8, Russia banned diesel exports after Ukraine struck its refineries. In the U.S., the price of a gallon of diesel rose nearly 40% between July 6 and Sept.", "source": "CNBC Top News", "pub_date_str": "14 Oct 2026, 06:19 PM IST", "pub_date_relative": "9m ago"}, {"title": "\"Incomes Are Eroding\": Lawyer Exposes The Burden Of Rising Rents", "full_content": "A lawyer from Turkey shared how working people are struggling to afford a home and save money for the future after looking for apartments with her older sister.", "source": "NDTV Profit", "pub_date_str": "14 Oct 2026, 06:19 PM IST", "pub_date_relative": "9m ago"}, {"title": "Bumrah Above Two Bowling Legends: Buttler, Broad Reveal Their Top 10 Bowlers Of 21st Century", "full_content": "The duo made their selections on the 'For the Love of Cricket' podcast, which they co-host, placing Bumrah ahead of legendary bowlers Glenn McGrath and Muttiah Muralitharan.", "source": "NDTV Profit", "pub_date_str": "14 Oct 2026, 06:18 PM IST", "pub_date_relative": "10m ago"}, {"title": "Indian bond yields hit highest level since March 2023", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Oct 2026, 06:17 PM IST", "pub_date_relative": "11m ago"}, {"title": "BS VII: Govt Drafts Tougher Pollution Norms For Vehicles; Monitors, Real World Tests Proposed | Key Details", "full_content": "The new rules will be applicable on cars manufactured from April 1, 2029.", "source": "NDTV Profit", "pub_date_str": "14 Oct 2026, 06:16 PM IST", "pub_date_relative": "12m ago"}, {"title": "Japan Airlines orders up to 26 Embraer jets for regional unit", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Oct 2026, 06:15 PM IST", "pub_date_relative": "13m ago"}, {"title": "Inflation data, Bank of America's penalty, Apple's new home hub and more in Morning Squawk", "full_content": "This is CNBC's Morning Squawk newsletter. Subscribe here to receive future editions in your inbox.\n\nHappy Wednesday. There's a strategy war brewing to win Gen Z's attention \u2014 and it involves everything from neon signs to dead mascots .\n\nStock futures are lower this morning. The S&P 500 ended yesterday's session little changed .\n\nHere are five key things investors need to know to start the trading day:\n\nSeptember's consumer price index \u2014 the closely followed basket of goods and services tracked by the Bureau of Labor Statistics \u2014 comes out this morning. It's the last CPI print before the midterm election, and economists are expecting it to show that price growth is reaccelerating.\n\nShares of Bank of America are more than 4% lower in premarket trading after the bank reported a steep drop in profit in the third quarter thanks to a $1.2 billion penalty from the U.S. Treasury Department. The company's revenue for the period also disappointed, coming in below Wall Street's estimates.\n\nThe Treasury Department announced the ten-figure fine yesterday, saying the bank allegedly violated anti-money laundering and sanctions laws. The penalty weighed heavily on Bank of America's earnings, cutting income by 17 cents a share. As CNBC's Hugh Son writes, the fine could lead to questions about CEO Brian Moynihan's handle on the bank.\n\nMeanwhile, Morgan Stanley beat top- and bottom-line estimates this morning, posting equities trading revenue numbers that topped analysts' expectations by more than $900 million. Bank of America's Moynihan and Morgan Stanley CEO Ted Pick will both join CNBC's \"Squawk on the Street\" today. Watch live on CNBC or CNBC+.", "source": "CNBC World Economy", "pub_date_str": "14 Oct 2026, 06:15 PM IST", "pub_date_relative": "13m ago"}, {"title": "Saudi Arabia stocks lower at close of trade; Tadawul All Share down 1.74%", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Oct 2026, 06:15 PM IST", "pub_date_relative": "13m ago"}, {"title": "Charles Schwab and DoorDash ranked among bargain stocks that could lead the market higher", "full_content": "Third-quarter earnings growth is expected to be driven by energy and semiconductor companies, but what if the rest of the market shows up? HSBC envisages a stock market finally broadening out.", "source": "MarketWatch Top Stories", "pub_date_str": "14 Oct 2026, 06:15 PM IST", "pub_date_relative": "13m ago"}, {"title": "Bank of America adds a profit miss to the misery of a $1.2 billion government fine", "full_content": "Bank of America\u2019s stock falls as investor disappointment over the $1.2 billion government fine added to the bank\u2019s downbeat earnings report.", "source": "MarketWatch Top Stories", "pub_date_str": "14 Oct 2026, 06:15 PM IST", "pub_date_relative": "13m ago"}, {"title": "CPI Report Today: Investors Await Latest Inflation Report; Bank Earnings Roll In \u2014 Live Updates - WSJ", "full_content": "CPI Report Today: Investors Await Latest Inflation Report; Bank Earnings Roll In \u2014 Live Updates WSJ Consumer prices rose at 3.7% annual rate in September as gas costs skyrocket CNBC Inflation jumps to 3.7% as gas and diesel prices squeeze consumers ahead of the midterms NBC News US CPI Preview: Follow the Fed and Look Past the Hot Headline FOREX.com High gasoline prices expected to boost US consumer inflation in September Reuters", "source": "Google News Business", "pub_date_str": "14 Oct 2026, 06:15 PM IST", "pub_date_relative": "13m ago"}, {"title": "Iran says it\u2019s \u2018counting the moments\u2019 until it can attack U.S. warships; Saudi Aramco facilities attacked", "full_content": "Saudi officials said Wednesday that an administrative building belonging to oil giant Saudi Aramco was targeted overnight, as the Tehran-backed Houthi militants step up their attacks on the kingdom.\n\nThe strike caused a fire, but no injuries were reported at the site in the city of Dhahran on the country's eastern coast, according to a statement from the Saudi Arabian Ministry of Energy.\n\nThe Houthis, a Yemen-based militia group backed by Iran, have launched a series of strikes on Saudi Arabian targets over the past week. Airport attacks in the capital city of Riyadh led to multiple fatalities, flight cancellations and property damage. Riyadh's King Khalid International Airport remains closed until Saturday.\n\nYemen's civil war has returned to full-scale fighting between the Houthis and the country's internationally recognized government amid a wider regional escalation linked to the U.S.\u2013Iran war.\n\nIslamic Revolutionary Guard Corps (IRGC) chief Ali Ozmaei said Wednesday that Tehran is \"counting the moments\" until it can sink American warships, according to Iranian state-affiliated media.\n\n\"If the Americans think the Strait of Hormuz is open, let them come closer. We are impatient to sink American warships,\" Ozmaei reportedly said in a televised interview.\n\n\"We are waiting for U.S. warships to approach the entrance to the Strait of Hormuz so we can sink them. We are counting down every moment until this happens.\"\n\nThe Wall Street Journal reported Tuesday that the Islamic Republic has been strengthening defenses around sensitive locations like nuclear sites, and telling regional officials that Tehran will respond to any new U.S. strikes with retaliatory measures across the Middle East as it prepares its population for renewed war in the coming weeks.", "source": "CNBC Top News", "pub_date_str": "14 Oct 2026, 06:13 PM IST", "pub_date_relative": "15m ago"}, {"title": "Japan to invest up to $21 billion in two US chip factories to be run by GlobalFoundries", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Oct 2026, 06:13 PM IST", "pub_date_relative": "15m ago"}, {"title": "Alanna Panday Flaunts Baby Bump At Pink-Themed Baby Shower, Ananya Panday Attends: See Pics", "full_content": "Alanna Panday and Ivor McCray hosted a dreamy pink-themed baby shower in Mumbai as they prepare to welcome their second child. Ananya Panday, Ahaan Panday and Aneet Padda attended the celebration.", "source": "NDTV Profit", "pub_date_str": "14 Oct 2026, 06:13 PM IST", "pub_date_relative": "15m ago"}, {"title": "S&P 500 futures turn negative after Sept inflation data", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Oct 2026, 06:13 PM IST", "pub_date_relative": "15m ago"}, {"title": "Bernstein lowers J.B. Hunt stock price target on cost concerns", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Oct 2026, 06:13 PM IST", "pub_date_relative": "15m ago"}, {"title": "Fed rate hike seen more likely after inflation data", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Oct 2026, 06:12 PM IST", "pub_date_relative": "15m ago"}, {"title": "US consumer prices accelerate in September on costlier gasoline; core CPI firmer", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Oct 2026, 06:12 PM IST", "pub_date_relative": "16m ago"}, {"title": "GlobalFoundries shares jump on $21 bln U.S.-Japan chip deal", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Oct 2026, 06:12 PM IST", "pub_date_relative": "16m ago"}, {"title": "Morgan Stanley beats quarterly profit estimates on equity trading strength", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Oct 2026, 06:12 PM IST", "pub_date_relative": "16m ago"}, {"title": "Q2 Results Live: Bajaj Consumer Profit Jumps 66%, Tata Technologies Revenue Rises", "full_content": "Q2 Results Live: BHEL, CEAT, Aditya Birla Money, and Canara Bank among 27 companies set to announce their Q2 FY27 earnings today, October 14. Track every earnings update live on NDTV Profit.", "source": "NDTV Profit", "pub_date_str": "14 Oct 2026, 06:02 PM IST", "pub_date_relative": "26m ago"}, {"title": "Bangladesh Champions Vs South Africa Champions Live Streaming: When And Where To Watch WCL 2026 Match", "full_content": "Bangladesh Champions will take on South Africa Champions in the WCL 2026 on October 14. Check the match date, time, venue and live streaming details.", "source": "NDTV Profit", "pub_date_str": "14 Oct 2026, 06:00 PM IST", "pub_date_relative": "28m ago"}, {"title": "Groww Q2 Results: CAS Pain Hits Sequential Growth, But Brokerage Eyes Relief From SEBI Proposal", "full_content": "In its shareholder letter, management said the fall in Groww's equity derivatives revenue was in line with the broader industry trend.", "source": "NDTV Profit", "pub_date_str": "14 Oct 2026, 05:57 PM IST", "pub_date_relative": "31m ago"}, {"title": "'Office' is actually having a scarcity problem", "full_content": "A version of this article first appeared in the CNBC Property Play newsletter with Diana Olick. Property Play covers new and evolving opportunities for the real estate investor, from individuals to venture capitalists, private equity funds, family offices, institutional investors and large public companies. Sign up to receive future editions, straight to your inbox.\n\nBarely a few years after what some saw as a pandemic-driven collapse of the U.S. office market, the sector is roaring back to health at an unexpectedly fast clip. That speedy recovery is resulting in a shortage, especially of premium space.\n\nThe office market posted its fifth consecutive quarter of positive net absorption, with occupiers adding 6 million square feet in the third quarter of this year, according to a new report from JLL. And employers are expanding, with signed leases now averaging a 13% increase in footprint. Just two years ago, the main theme in office was downsizing.\n\nThis all comes at a time when supply is falling \u2014 and falling faster than demand is recovering. Just 3.5 million square feet of new office space was delivered in the third quarter, which matches the near-record low supply seen in the second quarter. At the same time, 9.6 million square feet was removed through either conversions or redevelopments. The inventory of office space nationally has lost 45 million square feet since the end of 2023.\n\nThere is currently just 23 million square feet of new office space under construction, and with demand for premium office surging, this new space is becoming increasingly scarce. JLL deems it a \"flight to scarcity.\" As a result, rents are finally rising.\n\nEffective rents for first-generation trophy space are now up more than 20% compared with the third quarter of 2025. The lack of available trophy space is now pushing more occupiers to second-generation space.", "source": "CNBC Top News", "pub_date_str": "14 Oct 2026, 05:54 PM IST", "pub_date_relative": "34m ago"}, {"title": "LTCG, STT taxation: A tweak or removal? What\u2019s feasible? Ace investors Shankar Sharma, Rohit Srivastava say this", "full_content": "Although Union Finance Minister Nirmala Sitharaman offered no clear indication of possible changes to the long-term capital gains ( LTCG ) tax or securities transaction tax (STT), her remarks were enough to trigger speculation, fuel debate, and prompt calculations of the potential impact of scrapping these taxes on government revenue.\n\nAs ANI reported, Sitharaman responded to a question at the Bloomberg New Economy Forum 2026 on Tuesday about LTCG and STT , saying that while the government is open to hearing views, it is premature to comment on possible measures at this juncture, as preparations for the Union Budget 2027 have already begun.\n\nExperts and investors have been advocating for the removal of LTCG ever since it was reintroduced in 2018. However, at the current juncture, the government appears unwilling to make any changes to it.\n\nEarlier in July this year, Union minister Pankaj Chaudhary told the Lok Sabha that the government was not considering any proposal to scrap LTCG tax for domestic or retail investors.\n\nIn 2024, the government increased the LTCG tax rate on listed equities and equity mutual funds to 12.5% from 10%, while also raising the exemption threshold from \u20b9 1,00,000 to \u20b9 1,25,000 per financial year.\n\nSTT, or Securities Transaction Tax, which is charged at the time of executing a transaction of equities and derivatives, was introduced in India in October 2004.\n\nWhile LTCG tax impacts long-term investors, STT impacts intraday, short-term, and derivatives traders, as it applies to every trade.\n\nMint spoke to ace investors and market veterans Shankar Sharma and Rohit Srivastava to get their insights on these taxes. Here's what they said:", "source": "LiveMint Markets", "pub_date_str": "14 Oct 2026, 05:49 PM IST", "pub_date_relative": "39m ago"}, {"title": "\u20b91 lakh in your PF account: How much can you withdraw \u2014 \u20b925,000, \u20b950,000 or \u20b975,000? Know the rules", "full_content": "There can be situations when you need to access your retirement savings before exiting the workforce, especially if you do not have enough money set aside for emergencies. These could include funding medical expenses, a family member's education or marriage, or even getting your house renovated.\n\nThe Employees\u2019 Provident Fund Organisation (EPFO) has simplified the rules governing advances from the Employees\u2019 Provident Fund (EPF), making it easier for subscribers to access their retirement savings to meet essential expenses.\n\nUnder the revised framework, introduced through the EPF Scheme, 2026, partial withdrawals have been classified into three categories: essential needs, housing-related needs and special circumstances. The rules also standardise the minimum membership requirement for partial withdrawals at 12 months.\n\nUnder the uniform EPFO guidelines, members can withdraw up to 75% of their EPF balance after completing just 12 months of membership, subject to the applicable eligibility criteria. This means even employees in their first job can access a portion of their savings to meet certain expenses.\n\nThe withdrawable balance includes the employee\u2019s and employer\u2019s contributions, along with accumulated interest. Members should check the eligibility criteria and other conditions for their specific withdrawal category before applying through the Union retirement fund body's online portal.\n\nFor example, if your PF balance stands at \u20b9 1 lakh and you need urgent funds after losing your job, then you are allowed to withdraw \u20b9 75,000 immediately and the remaining 25% stays locked until you complete 12 months of continuous unemployment. Only then does full withdrawal open up.\n\nHowever, making a PF withdrawal will reduce your retirement corpus that could otherwise have grown through compounding over time.", "source": "LiveMint Money", "pub_date_str": "14 Oct 2026, 05:47 PM IST", "pub_date_relative": "41m ago"}, {"title": "Sold Gold Jewellery? How To Report Gains In ITR", "full_content": "Physical gold generally qualifies as a long-term capital asset after more than 24 months.", "source": "NDTV Profit", "pub_date_str": "14 Oct 2026, 05:46 PM IST", "pub_date_relative": "42m ago"}, {"title": "Dow Jones| Nasdaq | US Stock Market Today | Live: US futures turn negative after Sept inflation data; banks stocks in focus", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a Dow Jones| Nasdaq | US Stock Market Today | Live: US futures turn negative after Sept inflation data; banks stocks in focus Powered By LIVE BLOG Dow Jones| Nasdaq | US Stock Market Today | Live: US futures turn negative after Sept inflation data; banks stocks in focus 14 Oct 2026 | 06:20:59 PM IST Synopsis Dow Jones Today | US Stock Market Live: S&P 500 and Dow futures edged higher on Wednesday as AI-related stocks steadied after a recent selloff, though elevated oil prices kept investors on edge ahead of key inflation data and amid another round of big bank earnings.\n\nComments are moderated and will be allowed if they are about the topic and not abusive.\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Markets", "pub_date_str": "14 Oct 2026, 05:45 PM IST", "pub_date_relative": "43m ago"}, {"title": "Cancer Drug Trade Margins Run Up To 700%, Government Tells Supreme Court", "full_content": "The Centre expects its proposed 30% trade margin cap to cut cancer drug prices by up to 70% and save patients Rs 2,500 crore annually, with an expert committee set to recommend the medicines covered within 10 to 15 days.", "source": "NDTV Profit", "pub_date_str": "14 Oct 2026, 05:45 PM IST", "pub_date_relative": "43m ago"}, {"title": "My sister moved in with our mother, 78, and now says she deserves the $925,000 family home. Is she right?", "full_content": "\u201cThe house is worth $925,000 and mom owns it outright. She also has $480,000 in investments.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "14 Oct 2026, 05:45 PM IST", "pub_date_relative": "43m ago"}, {"title": "SEBI Proposes SME IPO Overhaul: Rs 1,000 Crore Valuation, 500 Allottees, Etc | Key Changes", "full_content": "The securities regulating agency also proposed scrapping Rs.10 crore cap on corporate-purpose funds.", "source": "NDTV Profit", "pub_date_str": "14 Oct 2026, 05:42 PM IST", "pub_date_relative": "46m ago"}, {"title": "India bonds sink deeper on RBI commentary, inflation concerns", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Bonds \u203a India bonds sink deeper on RBI commentary, inflation concerns Powered By The Economic Times daily newspaper is available online now. Read Today's Paper India bonds sink deeper on RBI commentary, inflation concerns SECTIONS India bonds sink deeper on RBI commentary, inflation concerns Reuters Last Updated: Oct 14, 2026, 05:41:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Indian government bonds are currently facing notable losses, pushing the 10-year yield to its highest since March 2023. This downturn comes in the wake of hawkish remarks from Reserve Bank of India Governor Sanjay Malhotra about financial stability. Additionally, India's wholesale inflation saw an unexpected rise in September, leading to growing concerns over potential future monetary policy shifts.\n\nIndian government bonds are currently facing notable losses, pushing the 10-year yield to its highest since March 2023. This downturn comes in the wake of hawkish remarks from Reserve Bank of India Governor Sanjay Malhotra about financial stability. Additionally, India's wholesale inflation saw an unexpected rise in September, leading to growing concerns over potential future monetary policy shifts.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "14 Oct 2026, 05:41 PM IST", "pub_date_relative": "47m ago"}, {"title": "Cabinet clears Rs 53,428 crore for social assistance scheme, revises disability pension norms", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a Cabinet clears Rs 53,428 crore for social assistance scheme, revises disability pension norms The Economic Times daily newspaper is available online now. Read Today's Paper Cabinet clears Rs 53,428 crore for social assistance scheme, revises disability pension norms SECTIONS Cabinet clears Rs 53,428 crore for social assistance scheme, revises disability pension norms PTI Last Updated: Oct 14, 2026, 05:41:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Union Cabinet has approved an outlay of Rs 53,428 crore for the National Social Assistance Programme. This approval will support the program's continuation from 2026-27 to 2030-31 with updated eligibility criteria. Monthly assistance rates for disability pension beneficiaries will increase with adjustments for age and disability severity.\n\nCabinet approves Rs 52,878 crore IDBI Bank sale to Fairfax arm in India\u2019s largest financial-sector FDI\n\nCabinet approves 78-day bonus worth Rs 2,009 crore for 11.4 lakh railway employees ahead of Diwali\n\nOnion inflation at 108%? Yes, but not really. What is different this time?\n\nCurbing rupee bets: What the RBI\u2019s new rules mean for the hedge-now-or-wait question\n\nBrinjal, buffalo, bacteria: Inside India\u2019s pay-for-nature system\n\nHomebuyers wait as NCLT panel picks holes in unfinished Jaypee projects\n\nThe NBFC saga - Part 3: How one default in 2018 changed the way RBI reads risk", "source": "Economic Times Economy", "pub_date_str": "14 Oct 2026, 05:41 PM IST", "pub_date_relative": "47m ago"}, {"title": "Delta's business-class revamp: New seats, menus, plates and more Porsches", "full_content": "Delta Air Lines , the country's most profitable airline, has a problem serving its top-tier customers: not enough Porsches.\n\nThe airline uses a fleet of 40 of the luxury vehicles to drive its high-value flyers right to the plane.\n\n\"What's happened over the last several years is the demand has continued to rise, and we realized that the 40 cars that we have weren't enough to meet the demand. So we're moving that fleet to 70,\" Ranjan Goswami, Delta's chief marketing and product officer, told CNBC.\n\nIt's just one of many changes Delta is making for customers who fly in its most luxurious and expensive cabin, known as Delta One . The Porsche service is part of a VIP add-on option.\n\nThe carrier on Wednesday unveiled new crockery for the cabins, new Missoni mini pillows and fresh food and beverage menus, including Champagne served over sorbet and Blanton's bourbon. Many of the new items will appear on flights originating in Los Angeles later this month and on other routes in the coming months.\n\nDelta is also planning to debut updated suites with a bigger screen and a more cushioned, lighter lie-flat seat when it starts flying its first Airbus A350-1000 planes early next year.\n\nDelta didn't announce changes to the coach and premium economy cabins.\n\nThe airline's executives said the company is already thinking about adjustments on other aircraft, including smaller Airbus jets and on Boeing 787 Dreamliners that Delta has ordered and that will come in the next decade.", "source": "CNBC Top News", "pub_date_str": "14 Oct 2026, 05:40 PM IST", "pub_date_relative": "48m ago"}, {"title": "Here are Wednesday's biggest analyst calls: SpaceX, Nvidia, Apple, Meta, Brinker, Kontoor Brands & more", "full_content": "Here are Wednesday's biggest calls on Wall Street.", "source": "CNBC Top News", "pub_date_str": "14 Oct 2026, 05:39 PM IST", "pub_date_relative": "49m ago"}, {"title": "Dynamatic Technologies among 7 stocks hitting 52-week highs; rally up to 32% in a month", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News Dynamatic Technologies among 7 stocks hitting 52-week highs; rally up to 32% in a month Written by Ritesh Presswala , ETMarkets.com | Oct 14, 2026, 05:39:15 PM IST 1 / 8 New Highs Benchmark Sensex slipped 252 points to close at 72,781 on Wednesday. Despite the market decline, seven stocks from the BSE 1000 index touched fresh 52-week highs, reaching their highest price levels in the past year. A 52-week high represents the highest price at which a stock has traded over the previous 12 months and may indicate increased investor interest and trading activity.\n\nNew 52-week high: Rs 977.15| CMP: Rs 938.15. In the last one month stock has gained about 32%.\n\nNew 52-week high: Rs 14500| CMP: Rs 14460.05. In the last one month stock has gained about 20%.\n\nNew 52-week high: Rs 1060.1| CMP: Rs 1044.4. In the last one month stock has gained about 16%.\n\nNew 52-week high: Rs 4619.1| CMP: Rs 4415. In the last one month, the stock has gained about 15%.\n\nNew 52-week high: Rs 2785| CMP: Rs 2673. In the last one month, the stock has gained about 13%.\n\nNew 52-week high: Rs 616| CMP: Rs 590.75. In the last one month, the stock has gained about 9%.\n\nNew 52-week high: Rs 463.6| CMP: Rs 463.5. In the last one month, the stock has gained about 8%.", "source": "Economic Times Markets", "pub_date_str": "14 Oct 2026, 05:35 PM IST", "pub_date_relative": "53m ago"}, {"title": "Top 2 stocks to buy for short-term: Sagility, Rain Industries by Nagaraj Shetti - Check stop loss, targets", "full_content": "Stock market today: Indian equity benchmarks closed lower on Wednesday, 14 October, as rising oil prices and sustained foreign investor outflows dampened sentiment following the previous session\u2019s rally. Investors also assessed corporate earnings and awaited key US inflation data.\n\nThe Nifty 50 fell 0.44% to close at 22,622.70, while the Sensex declined 0.34% to 72,781.89. Eight of the 16 major sectors ended in the red, while the broader market also weakened, with small-cap and mid-cap indices falling 0.3% and 0.1%, respectively.\n\nThe decline followed a strong rebound on Tuesday, when the Nifty and Sensex gained around 1.6% each, led by IT stocks after HCLTech reported quarterly profit that exceeded expectations.\n\nNagaraj Shetti, Senior Technical Research Analyst at HDFC Securities, has recommended buying Sagility at \u20b9 45.60, with a target price of \u20b9 49.50 and a stop-loss at \u20b9 43.50. The trade has a timeframe of two to three weeks.\n\nHe has also recommended buying Rain Industries at \u20b9 236, with a target of \u20b9 255 and a stop-loss at \u20b9 223, for a similar investment horizon of two to three weeks.\n\nThe alternative candle pattern of bull and bear continued in the market for the fifth consecutive session on Wednesday and Nifty 50 closed the day lower by 99 points. A small negative candle was formed on the daily chart that signals consolidation movement in the market after a sharp upmove seen on Tuesday. The bearish pattern like lower tops and bottoms is intact on the daily chart. A decisive close above 22,800 is likely to negate this bearish setup.\n\nNifty 50 is currently placed at the crucial resistance around 22,700-22,800 levels and a decisive break out of this hurdle could open further short covering in the market towards 23,100-23,200 levels. Any weakness from here could find support around 22,300 levels.\n\nAfter showing a consolidation movement in the last few weeks, the stock price has witnessed sharp bounce back on Wednesday and closed higher.", "source": "LiveMint Markets", "pub_date_str": "14 Oct 2026, 05:35 PM IST", "pub_date_relative": "53m ago"}, {"title": "Sebi proposes market cap-based SME IPO norms, seeks public comments on regulatory overhaul", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Sebi proposes market cap-based SME IPO norms, seeks public comments on regulatory overhaul BSE Share Price Multi Commodity Exchange of India Share Price Indian Energy Exchange Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Sebi proposes market cap-based SME IPO norms, seeks public comments on regulatory overhaul SECTIONS Sebi proposes market cap-based SME IPO norms, seeks public comments on regulatory overhaul By Kumar Gaurav , ETMarkets.com Last Updated: Oct 14, 2026, 05:34:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Sebi has proposed a sweeping overhaul of SME IPO regulations, including market capitalisation-based eligibility thresholds, higher profitability requirements, lower minimum application values and changes to allotment norms. The proposals also cover underwriting, market making, lock-in periods and migration to the main board. Public comments are invited until November 4, 2026.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "14 Oct 2026, 05:34 PM IST", "pub_date_relative": "54m ago"}, {"title": "Cabinet Approves IDBI Bank Stake Sale To Fairfax For Rs 52,878 Crore; FM Calls It Strategic Restructuring", "full_content": "Fairfax's winning bid for IDBI Bank has been fixed at Rs 81 per share, above the benchmark price of Rs 75.99 per share determined using two independent valuations.", "source": "NDTV Profit", "pub_date_str": "14 Oct 2026, 05:32 PM IST", "pub_date_relative": "56m ago"}, {"title": "Even more borrowers choose riskier mortgages, as higher interest rates crush affordability", "full_content": "Mortgage rates moved to the highest level in nearly three years last week, causing overall demand to drop. Riskier mortgages, however, continue to gain a growing share of what demand there is.\n\nTotal mortgage application volume dropped 2.7% last week compared with the previous week, according to the Mortgage Bankers Association's seasonally adjusted index. It is also 37.5% lower than the same week one year ago.\n\nThe average contract interest rate for 30-year fixed-rate mortgages with conforming loan balances, $832,750 or less, increased to 7.50% from 7.49%, with points decreasing to 0.83 from 0.84, including the origination fee, for loans with a 20% down payment. The rate was more than a full percentage point higher than it was a year ago.\n\n\"As a result, borrowers continue to rely more on ARM [adjustable-rate mortgage] loans to help lower their monthly payments,\" said Joel Kan, an MBA economist, in a release. \"The ARM share at 10.5 percent was at its highest level since October 2025.\"\n\nARMs offer lower interest rates and can be fixed for up to 10 years, but then they adjust depending on future interest rates. That is why they are considered riskier.\n\nApplications to refinance a home loan have been hit hardest by higher rates, as a shrinking pool of borrowers can now find much relief. These applications declined 0.4% for the week and were 56% lower year over year.\n\nCNBC's Property Play with Diana Olick covers new and evolving opportunities for the real estate investor, delivered weekly to your inbox.\n\nApplications for a mortgage to purchase a home fell 4% for the week and were 16% lower than the same week one year ago. There are more homes available for sale now, but mostly on the higher end of the market. Supply is also rising not because of new listings, but because of slower sales. Home prices also continue to rise.", "source": "CNBC Top News", "pub_date_str": "14 Oct 2026, 05:31 PM IST", "pub_date_relative": "57m ago"}, {"title": "How to read your body\u2019s warning signs years before you get sick", "full_content": "Most of us don\u2019t just want to live longer lives. We want to live longer and healthier lives.", "source": "MarketWatch Top Stories", "pub_date_str": "14 Oct 2026, 05:30 PM IST", "pub_date_relative": "58m ago"}, {"title": "IDBI Bank Stake Sale: Prem Watsa Just Wrote A Cheque Bigger Than His Entire India Fund", "full_content": "The IDBI Bank deal works out to about $5.6 billion, which eclipses Fairfax's current India holdings estimated at $3.76 billion.", "source": "NDTV Profit", "pub_date_str": "14 Oct 2026, 05:29 PM IST", "pub_date_relative": "59m ago"}, {"title": "BlackRock draws $205 billion in client funds as quarterly profit beats estimates", "full_content": "BlackRock surpassed Wall Street profit expectations and attracted $205 billion in total inflows in the third quarter, sending the world's largest asset manager's shares up 5% in premarket trading on \u2060Wednesday.\n\nThe benchmark S&P 500 extended its steady climb in the quarter to hover near its all-time highs on a rally in AI-focused \u200bstocks, encouraging investors to pour \u200bmoney into asset management firms \u200bsuch as BlackRock.\n\n\"Market fundamentals are strong and well supported, with higher margins and earnings momentum catalyzed by new technology,\" CEO Larry Fink said in a statement.\n\nBlackRock's assets under management \u2014 which determine a large chunk of the earnings \u2014 \u2060rose \u200cto $15.49 trillion, from $13.46 trillion a year earlier and $15.34 trillion \u2060in the second quarter.\n\nThe growth was driven by a combination of $134.5 billion of new flows into BlackRock's flagship iShares ETFs, and the rising valuations of its investments in a robust equity market.\n\nThe company posted an adjusted profit of $15.93 per share, beating Wall Street \u200cexpectations of $14.13, according to data compiled by LSEG.\n\nThe robust results will help alleviate pressure on BlackRock's shares, which have underperformed the broader market this year over fears of a slowdown in \u200bactivity from cautious investor sentiment.\n\nEven as markets have remained sturdy, the combination of surging bond yields and the expectation that the Federal Reserve's recent interest rate hike marks the beginning of a tightening cycle has called into question whether the rally can be sustained.", "source": "CNBC Top News", "pub_date_str": "14 Oct 2026, 05:27 PM IST", "pub_date_relative": "1h ago"}, {"title": "Market wrap: Nestle India, Infosys, Shriram Finance, HDFC Life top gainers and losers on Nifty and Sensex on Wednesday", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Market wrap: Nestle India, Infosys, Shriram Finance, HDFC Life top gainers and losers on Nifty and Sensex on Wednesday The Economic Times daily newspaper is available online now. Read Today's Paper Market wrap: Nestle India, Infosys, Shriram Finance, HDFC Life top gainers and losers on Nifty and Sensex on Wednesday SECTIONS Market wrap: Nestle India, Infosys, Shriram Finance, HDFC Life top gainers and losers on Nifty and Sensex on Wednesday By Kumar Gaurav , ETMarkets.com Last Updated: Oct 14, 2026, 05:26:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Indian equities closed lower on Wednesday as investors booked profits ahead of key US inflation data. The Nifty 50 fell 0.44% to 22,623, while the Sensex declined 0.34% to 72,782. Nestle India and Infosys led Nifty gainers, while Shriram Finance and HDFC Life topped the losers\u2019 list.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "14 Oct 2026, 05:26 PM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "Bajaj Consumer Q2 Results: Net Profit Jumps 66% To Rs 70 Crore, Revenue Rises 26%", "full_content": "Despite the improvement in operating performance, the company continues to face pressure from elevated prices of some raw materials.", "source": "NDTV Profit", "pub_date_str": "14 Oct 2026, 06:25 PM IST", "pub_date_relative": "3m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "IDBI Bank strategic restructuring to attract FDI, boost banking sector, says FM Sitharaman", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a IDBI Bank strategic restructuring to attract FDI, boost banking sector, says FM Sitharaman The Economic Times daily newspaper is available online now. Read Today's Paper IDBI Bank strategic restructuring to attract FDI, boost banking sector, says FM Sitharaman SECTIONS IDBI Bank strategic restructuring to attract FDI, boost banking sector, says FM Sitharaman PTI Last Updated: Oct 14, 2026, 06:24:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Cabinet Committee on Economic Affairs approved the strategic restructuring of IDBI Bank to attract foreign investments. The government retains a minority stake in the bank after its recovery, enabling further growth. Fairfax Financial Holdings will acquire a 60.72 percent stake in the bank for Rs 52,878 crore. The transaction aims to strengthen India's banking sector and reduce government ownership of state-run assets.\n\nOnion inflation at 108%? Yes, but not really. What is different this time?\n\nCurbing rupee bets: What the RBI\u2019s new rules mean for the hedge-now-or-wait question\n\nBrinjal, buffalo, bacteria: Inside India\u2019s pay-for-nature system\n\nHomebuyers wait as NCLT panel picks holes in unfinished Jaypee projects\n\nThe NBFC saga - Part 3: How one default in 2018 changed the way RBI reads risk\n\nFour rules made HDFC Bank a compounder. All four have stopped. Can the new CEO rewrite them?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "14 Oct 2026, 06:24 PM IST", "pub_date_relative": "4m ago", "cfa_topics": ["Economics", "Corporate Issuers"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Crude oil prices above $100 a barrel: Why HPCL, IOCL and BPCL could face earnings pressure, experts decode", "full_content": "Crude oil prices, which have remained elevated since the outbreak of the war in the Middle East, are expected to weigh on the profitability of the three state-run oil marketing companies (OMCs)\u2014Hindustan Petroleum Corporation (HPCL), Bharat Petroleum Corporation (BPCL), and Indian Oil Corporation (IOC).\n\nHigher crude prices increase the cost of refining and fuel production, squeezing marketing margins if retail fuel prices are not revised accordingly.\n\nDhaval Popat, Analyst \u2013 Energy at Choice Institutional Equities, said state-owned oil marketing companies (OMCs) remain the most vulnerable to crude oil prices sustaining above $100 per barrel, particularly if retail petrol and diesel prices remain unchanged.\n\nPopat expects HPCL to face the highest earnings pressure, followed by IOCL and BPCL, as elevated crude prices compress marketing margins, potentially offsetting the benefits of stronger refining margins.\n\nPopat said city gas distribution (CGD) companies, including IGL, MGL, Gujarat Gas , and Adani Total Gas , could face margin pressure if higher gas procurement costs cannot be fully passed on to consumers.\n\nMeanwhile, GAIL and Petronet LNG remain exposed to potential volume weakness and gas-sourcing risks, although their regulated or contracted businesses provide some insulation, he noted.\n\nAccording to Popat, the key earnings risk is not crude oil prices remaining above $100 per barrel alone, but the inability of companies to pass higher input costs on to end consumers.\n\nHe added that tightness in global middle-distillate markets could support refining profitability, making OMC marketing margins the principal area of concern.", "source": "LiveMint Markets", "pub_date_str": "14 Oct 2026, 06:24 PM IST", "pub_date_relative": "4m ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Bank of America shares drop 7% after third-quarter revenue miss and regulatory penalty", "full_content": "Bank of America on Wednesday posted a sharp profit decline after being hit with a $1.2 billion penalty by U.S. regulators, while revenue also disappointed after trading operations generated about $750 million less than expected.\n\nThe bank's third-quarter profit fell 17% to $6.93 billion, or 91 cents a share. Excluding the penalty, which sapped income by 17 cents, EPS would've been $1.08 a share.\n\nCompanywide revenue rose 3.2% to $30.12 billion in the quarter, on an FTE basis, but that was below expectations by about $570 million, largely on misses from Wall Street trading operations.\n\nFixed income trading revenue fell 17% to $2.55 billion on weakness in mortgages, municipals and credit activity. That is roughly $450 million below the StreetAccount estimate.\n\nEquities trading revenue climbed 10% to $2.51 billion, but that was also below analysts' expectations, by nearly $300 million.\n\nThe trading disappointment comes after CEO Brian Moynihan told analysts last month that trading revenue would be roughly flat; instead the combined bond and stock trading results fell by 5%.\n\nInvestment banking revenue dropped 11% to $1.8 billion, roughly in line with expectations and Moynihan's September guidance.\n\nIn a research note published Wednesday, Wells Fargo analyst Mike Mayo called the firm's capital markets results \"easily worst in class\" for the quarter.", "source": "CNBC Finance", "pub_date_str": "14 Oct 2026, 06:24 PM IST", "pub_date_relative": "4m ago", "cfa_topics": ["Financial Statement Analysis", "Fixed Income", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Consumer prices rose at 3.7% annual rate in September as gas costs skyrocket", "full_content": "September brought little relief to the accelerating cost of living, as consumer prices increased again and kept the inflation rate well above the Federal Reserve's goal.\n\nThe consumer price index , a broad measure of goods and services costs across the U.S. economy, rose a seasonally adjusted 0.6% for the month, putting the 12-month rate at 3.7%, the Bureau of Labor Statistics reported Wednesday. Economists surveyed by Dow Jones expected respective gains of 0.6% and 3.6%.\n\nStripping out volatile food and energy costs, so-called core CPI rose 0.3% for the month and was up 2.6% on an annual basis, compared to respective estimates for 0.2% and 2.5%.\n\nSurging energy costs were again the primary culprit in the inflation picture. The energy index jumped 5.2% as tensions continued between the U.S. and Iran in a war launched in late February that shows no signs of ending anytime soon.\n\nGasoline prices soared 9.1%, accounting for about half the gain in headline CPI, according to the BLS. Over the past year, gas has posted a 34.2% gain while fuel oil has roared higher by 74.2%.\n\nFood prices were flat on the month and up 2.5% from a year ago. However, shelter prices increased 0.4% and used car and truck prices jumped 0.7%.\n\nStock market futures turned negative following the release while bond yields were sharply higher.\n\nInflation as measured by CPI has surpassed the Fed's 2% benchmark since March 2021. The gauge had been trending lower at the start of 2026, but then spiked following the strikes the U.S. and Israel launched against Iran.", "source": "CNBC Top News", "pub_date_str": "14 Oct 2026, 06:21 PM IST", "pub_date_relative": "6m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Fixed Income", "Derivatives", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Morgan Stanley tops estimates as equities trading revenue beats expectations by $909 million", "full_content": "Morgan Stanley posted third-quarter results that beat expectations on blockbuster results in its equities trading franchise.\n\nThe company said profit climbed 6.5% to $4.91 billion, or $3.03 a share. Revenue climbed 12% to $20.34 billion.\n\nThe firm's equities trading division, long a marquee business for Morgan Stanley, posted a 41% increase in revenue to $5.8 billion, exceeding the StreetAccount estimate by about $909 million.\n\nMorgan Stanley cited widespread strength across its equities products and regions, but cited Asia as a source of particular strength in the quarter. The gains in that business helped offset disappointments elsewhere.\n\nFixed income trading revenue fell 7% to $2.01 billion, driven by declines in credit and commodities, which is roughly $260 million below expectations.\n\nInvestment banking revenue edged 2% higher to $2.16 billion, about $110 million below expectations. The bank cited an increase in advisory revenue on more completed mergers, but declines in equity underwriting on lower IPOs and a decline in fixed income underwriting.\n\nStill, the results were \"good, but not great,\" as some business metrics showed slower improvement in the quarter, Wells Fargo analyst Mike Mayo said Wednesday in a note.\n\nAnalysts will want to know what CEO Ted Pick has to say on the outlook for mergers and IPOs for the rest of the year amid the churn caused by rising interest rates.", "source": "CNBC Finance", "pub_date_str": "14 Oct 2026, 06:19 PM IST", "pub_date_relative": "9m ago", "cfa_topics": ["Financial Statement Analysis", "Fixed Income"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Trump's diesel dilemma \u2014 by the numbers", "full_content": "Diesel prices are surging as midterms approach \u2013 and they are likely to stay high in the near future, according to analysts.\n\nThe International Energy Agency's monthly report for October, released Wednesday, was the latest to predict that constraints on the diesel market will likely keep prices elevated into next year. The group warned that even if refineries step up production of diesel into the year-end inventories will likely remain strained until the second half of 2027.\n\nLast Friday, President Donald Trump unexpectedly paused sanctions on Russian diesel fuel and announced that he reached a deal with President Vladimir Putin in which the Kremlin would release 4.8 million metric tons of diesel , or nearly 36 million barrels, to the global market.\n\nOver the weekend, he took to Truth Social to announce an \"energy ceasefire\" between Russia and Ukraine , but Ukrainian President Volodymyr Zelenskyy later accused Russia of attacking the country's energy facilities .\n\nThe foreign policy developments come as rising fuel prices \u2014 particularly skyrocketing diesel \u2014 have become a major flashpoint ahead of this year's midterm election. But releasing Russian diesel to the global market is unlikely to drop prices in the near term. A note from Goldman Sachs last week even predicted that diesel prices will remain high through 2027 as refineries struggle to meet demand.\n\nWholesale diesel prices have more than doubled since the beginning of 2026 through the end of September as both the war in Iran and Russia's war in Ukraine have dramatically cut global supply.\n\nTrump has insisted that the war in Ukraine is to blame for high diesel prices. On July 8, Russia banned diesel exports after Ukraine struck its refineries. In the U.S., the price of a gallon of diesel rose nearly 40% between July 6 and Sept.", "source": "CNBC Top News", "pub_date_str": "14 Oct 2026, 06:19 PM IST", "pub_date_relative": "9m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Indian bond yields hit highest level since March 2023", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Oct 2026, 06:17 PM IST", "pub_date_relative": "11m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Inflation data, Bank of America's penalty, Apple's new home hub and more in Morning Squawk", "full_content": "This is CNBC's Morning Squawk newsletter. Subscribe here to receive future editions in your inbox.\n\nHappy Wednesday. There's a strategy war brewing to win Gen Z's attention \u2014 and it involves everything from neon signs to dead mascots .\n\nStock futures are lower this morning. The S&P 500 ended yesterday's session little changed .\n\nHere are five key things investors need to know to start the trading day:\n\nSeptember's consumer price index \u2014 the closely followed basket of goods and services tracked by the Bureau of Labor Statistics \u2014 comes out this morning. It's the last CPI print before the midterm election, and economists are expecting it to show that price growth is reaccelerating.\n\nShares of Bank of America are more than 4% lower in premarket trading after the bank reported a steep drop in profit in the third quarter thanks to a $1.2 billion penalty from the U.S. Treasury Department. The company's revenue for the period also disappointed, coming in below Wall Street's estimates.\n\nThe Treasury Department announced the ten-figure fine yesterday, saying the bank allegedly violated anti-money laundering and sanctions laws. The penalty weighed heavily on Bank of America's earnings, cutting income by 17 cents a share. As CNBC's Hugh Son writes, the fine could lead to questions about CEO Brian Moynihan's handle on the bank.\n\nMeanwhile, Morgan Stanley beat top- and bottom-line estimates this morning, posting equities trading revenue numbers that topped analysts' expectations by more than $900 million. Bank of America's Moynihan and Morgan Stanley CEO Ted Pick will both join CNBC's \"Squawk on the Street\" today. Watch live on CNBC or CNBC+.", "source": "CNBC World Economy", "pub_date_str": "14 Oct 2026, 06:15 PM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Fixed Income", "Derivatives", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Charles Schwab and DoorDash ranked among bargain stocks that could lead the market higher", "full_content": "Third-quarter earnings growth is expected to be driven by energy and semiconductor companies, but what if the rest of the market shows up? HSBC envisages a stock market finally broadening out.", "source": "MarketWatch Top Stories", "pub_date_str": "14 Oct 2026, 06:15 PM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Bank of America adds a profit miss to the misery of a $1.2 billion government fine", "full_content": "Bank of America\u2019s stock falls as investor disappointment over the $1.2 billion government fine added to the bank\u2019s downbeat earnings report.", "source": "MarketWatch Top Stories", "pub_date_str": "14 Oct 2026, 06:15 PM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Financial Statement Analysis", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "CPI Report Today: Investors Await Latest Inflation Report; Bank Earnings Roll In \u2014 Live Updates - WSJ", "full_content": "CPI Report Today: Investors Await Latest Inflation Report; Bank Earnings Roll In \u2014 Live Updates WSJ Consumer prices rose at 3.7% annual rate in September as gas costs skyrocket CNBC Inflation jumps to 3.7% as gas and diesel prices squeeze consumers ahead of the midterms NBC News US CPI Preview: Follow the Fed and Look Past the Hot Headline FOREX.com High gasoline prices expected to boost US consumer inflation in September Reuters", "source": "Google News Business", "pub_date_str": "14 Oct 2026, 06:15 PM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Economics", "Financial Statement Analysis"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "S&P 500 futures turn negative after Sept inflation data", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Oct 2026, 06:13 PM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Economics", "Equity Investments", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Fed rate hike seen more likely after inflation data", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Oct 2026, 06:12 PM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "US consumer prices accelerate in September on costlier gasoline; core CPI firmer", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Oct 2026, 06:12 PM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Morgan Stanley beats quarterly profit estimates on equity trading strength", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Oct 2026, 06:12 PM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Q2 Results Live: Bajaj Consumer Profit Jumps 66%, Tata Technologies Revenue Rises", "full_content": "Q2 Results Live: BHEL, CEAT, Aditya Birla Money, and Canara Bank among 27 companies set to announce their Q2 FY27 earnings today, October 14. Track every earnings update live on NDTV Profit.", "source": "NDTV Profit", "pub_date_str": "14 Oct 2026, 06:02 PM IST", "pub_date_relative": "26m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Groww Q2 Results: CAS Pain Hits Sequential Growth, But Brokerage Eyes Relief From SEBI Proposal", "full_content": "In its shareholder letter, management said the fall in Groww's equity derivatives revenue was in line with the broader industry trend.", "source": "NDTV Profit", "pub_date_str": "14 Oct 2026, 05:57 PM IST", "pub_date_relative": "31m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "'Office' is actually having a scarcity problem", "full_content": "A version of this article first appeared in the CNBC Property Play newsletter with Diana Olick. Property Play covers new and evolving opportunities for the real estate investor, from individuals to venture capitalists, private equity funds, family offices, institutional investors and large public companies. Sign up to receive future editions, straight to your inbox.\n\nBarely a few years after what some saw as a pandemic-driven collapse of the U.S. office market, the sector is roaring back to health at an unexpectedly fast clip. That speedy recovery is resulting in a shortage, especially of premium space.\n\nThe office market posted its fifth consecutive quarter of positive net absorption, with occupiers adding 6 million square feet in the third quarter of this year, according to a new report from JLL. And employers are expanding, with signed leases now averaging a 13% increase in footprint. Just two years ago, the main theme in office was downsizing.\n\nThis all comes at a time when supply is falling \u2014 and falling faster than demand is recovering. Just 3.5 million square feet of new office space was delivered in the third quarter, which matches the near-record low supply seen in the second quarter. At the same time, 9.6 million square feet was removed through either conversions or redevelopments. The inventory of office space nationally has lost 45 million square feet since the end of 2023.\n\nThere is currently just 23 million square feet of new office space under construction, and with demand for premium office surging, this new space is becoming increasingly scarce. JLL deems it a \"flight to scarcity.\" As a result, rents are finally rising.\n\nEffective rents for first-generation trophy space are now up more than 20% compared with the third quarter of 2025. The lack of available trophy space is now pushing more occupiers to second-generation space.", "source": "CNBC Top News", "pub_date_str": "14 Oct 2026, 05:54 PM IST", "pub_date_relative": "34m ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "LTCG, STT taxation: A tweak or removal? What\u2019s feasible? Ace investors Shankar Sharma, Rohit Srivastava say this", "full_content": "Although Union Finance Minister Nirmala Sitharaman offered no clear indication of possible changes to the long-term capital gains ( LTCG ) tax or securities transaction tax (STT), her remarks were enough to trigger speculation, fuel debate, and prompt calculations of the potential impact of scrapping these taxes on government revenue.\n\nAs ANI reported, Sitharaman responded to a question at the Bloomberg New Economy Forum 2026 on Tuesday about LTCG and STT , saying that while the government is open to hearing views, it is premature to comment on possible measures at this juncture, as preparations for the Union Budget 2027 have already begun.\n\nExperts and investors have been advocating for the removal of LTCG ever since it was reintroduced in 2018. However, at the current juncture, the government appears unwilling to make any changes to it.\n\nEarlier in July this year, Union minister Pankaj Chaudhary told the Lok Sabha that the government was not considering any proposal to scrap LTCG tax for domestic or retail investors.\n\nIn 2024, the government increased the LTCG tax rate on listed equities and equity mutual funds to 12.5% from 10%, while also raising the exemption threshold from \u20b9 1,00,000 to \u20b9 1,25,000 per financial year.\n\nSTT, or Securities Transaction Tax, which is charged at the time of executing a transaction of equities and derivatives, was introduced in India in October 2004.\n\nWhile LTCG tax impacts long-term investors, STT impacts intraday, short-term, and derivatives traders, as it applies to every trade.\n\nMint spoke to ace investors and market veterans Shankar Sharma and Rohit Srivastava to get their insights on these taxes. Here's what they said:", "source": "LiveMint Markets", "pub_date_str": "14 Oct 2026, 05:49 PM IST", "pub_date_relative": "39m ago", "cfa_topics": ["Financial Statement Analysis", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "\u20b91 lakh in your PF account: How much can you withdraw \u2014 \u20b925,000, \u20b950,000 or \u20b975,000? Know the rules", "full_content": "There can be situations when you need to access your retirement savings before exiting the workforce, especially if you do not have enough money set aside for emergencies. These could include funding medical expenses, a family member's education or marriage, or even getting your house renovated.\n\nThe Employees\u2019 Provident Fund Organisation (EPFO) has simplified the rules governing advances from the Employees\u2019 Provident Fund (EPF), making it easier for subscribers to access their retirement savings to meet essential expenses.\n\nUnder the revised framework, introduced through the EPF Scheme, 2026, partial withdrawals have been classified into three categories: essential needs, housing-related needs and special circumstances. The rules also standardise the minimum membership requirement for partial withdrawals at 12 months.\n\nUnder the uniform EPFO guidelines, members can withdraw up to 75% of their EPF balance after completing just 12 months of membership, subject to the applicable eligibility criteria. This means even employees in their first job can access a portion of their savings to meet certain expenses.\n\nThe withdrawable balance includes the employee\u2019s and employer\u2019s contributions, along with accumulated interest. Members should check the eligibility criteria and other conditions for their specific withdrawal category before applying through the Union retirement fund body's online portal.\n\nFor example, if your PF balance stands at \u20b9 1 lakh and you need urgent funds after losing your job, then you are allowed to withdraw \u20b9 75,000 immediately and the remaining 25% stays locked until you complete 12 months of continuous unemployment. Only then does full withdrawal open up.\n\nHowever, making a PF withdrawal will reduce your retirement corpus that could otherwise have grown through compounding over time.", "source": "LiveMint Money", "pub_date_str": "14 Oct 2026, 05:47 PM IST", "pub_date_relative": "41m ago", "cfa_topics": ["Quantitative Methods", "Economics", "Portfolio Management"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "Sold Gold Jewellery? How To Report Gains In ITR", "full_content": "Physical gold generally qualifies as a long-term capital asset after more than 24 months.", "source": "NDTV Profit", "pub_date_str": "14 Oct 2026, 05:46 PM IST", "pub_date_relative": "42m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Dow Jones| Nasdaq | US Stock Market Today | Live: US futures turn negative after Sept inflation data; banks stocks in focus", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a Dow Jones| Nasdaq | US Stock Market Today | Live: US futures turn negative after Sept inflation data; banks stocks in focus Powered By LIVE BLOG Dow Jones| Nasdaq | US Stock Market Today | Live: US futures turn negative after Sept inflation data; banks stocks in focus 14 Oct 2026 | 06:20:59 PM IST Synopsis Dow Jones Today | US Stock Market Live: S&P 500 and Dow futures edged higher on Wednesday as AI-related stocks steadied after a recent selloff, though elevated oil prices kept investors on edge ahead of key inflation data and amid another round of big bank earnings.\n\nComments are moderated and will be allowed if they are about the topic and not abusive.\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Markets", "pub_date_str": "14 Oct 2026, 05:45 PM IST", "pub_date_relative": "43m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "SEBI Proposes SME IPO Overhaul: Rs 1,000 Crore Valuation, 500 Allottees, Etc | Key Changes", "full_content": "The securities regulating agency also proposed scrapping Rs.10 crore cap on corporate-purpose funds.", "source": "NDTV Profit", "pub_date_str": "14 Oct 2026, 05:42 PM IST", "pub_date_relative": "46m ago", "cfa_topics": ["Corporate
