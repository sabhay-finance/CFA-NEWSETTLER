ek, which impacted the debt market. Foreign investors have sold a substantial amount of Indian government debt since August, contributing to a prolonged rise in benchmark yields. Concerns over inflation and the Reserve Bank of India's rate decisions are influencing market sentiments.\n\nIndian government bonds increased in early trading as oil prices declined, following a previous rally. The Brent crude price slipped significantly after hitting a six-month high last week, which impacted the debt market. Foreign investors have sold a substantial amount of Indian government debt since August, contributing to a prolonged rise in benchmark yields. Concerns over inflation and the Reserve Bank of India's rate decisions are influencing market sentiments.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "26 Oct 2026, 11:12 AM IST", "pub_date_relative": "47m ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Tonbo Imaging India shares up 17%, jumps 90% from IPO price band | Buy, sell or hold?", "full_content": "Tonbo Imaging India shares jumped over 17% on Monday, 26 October, extending their strong post-listing rally. The stock made a stellar debut on 23 October, listing at \u20b9 1,160 on the NSE, a 65.71% premium over its IPO price of \u20b9 700 per share. On the BSE, it debuted at \u20b9 1,162, marking a 66% premium.\n\nThe stock has now climbed around 90% above its issue price, reflecting strong investor interest following its market debut. After listing, Tonbo Imaging India's market capitalisation stood at around \u20b9 7,111 crore on the BSE.\n\nAccording to BSE data, PRB Securities Pvt. Ltd. bought 3,71,195 shares at \u20b9 1,117.10 apiece and sold 26,537 shares at \u20b9 1,081.90 on 23 October. Meanwhile, Irage Broking Services LLP bought 5,09,569 shares at \u20b9 1,125.95 apiece and sold 3,10,631 shares at \u20b9 1,099.43.\n\nMahesh M. Ojha, Vice President of Research and Business Development at Kantilal Chhaganlal Securities Pvt. Ltd., said investors who received an allotment in the IPO could consider booking partial profits on listing gains and holding the remaining shares for the long term, given strong product demand, a favourable sector outlook and the company's long-term growth potential.\n\nAnother analyst said investors who secured an IPO allotment could hold the shares for the long term. Those who missed the issue could consider entering on any post-listing correction.\n\nThe initial public offering (IPO) of defence electronics maker Tonbo Imaging India Ltd was subscribed 135.90 times on the final day of bidding, driven by strong demand across investor categories, according to NSE data.\n\nThe \u20b9 852.18-crore IPO received bids for 1,15,87,19,247 shares against 85,26,033 shares on offer. Qualified institutional buyers (QIBs) led the demand, with their portion subscribed 293.56 times, while the non-institutional investor (NII) category was subscribed 170.94 times.", "source": "LiveMint Markets", "pub_date_str": "26 Oct 2026, 10:59 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Big Tech Earnings Week: Will AI spending pay off?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News Powered By Big Tech Earnings Week: Will AI spending pay off? Written by Anupam Nagar , ETMarkets.com | Oct 26, 2026, 11:29:15 AM IST 1 / 10 Big Tech faces its biggest earnings test Alphabet, Microsoft and Amazon are set to report quarterly results in a crucial week for the artificial intelligence trade. Investors will assess whether surging AI demand can justify the enormous investments in data centres, cloud infrastructure and computing capacity. Sources: CNBC, Yahoo Finance, Forbes)\n\nMicrosoft reports on Wednesday, October 28. Investors will look for sustained growth in Azure, its cloud-computing business, and evidence that AI services are translating into revenue. Analysts will also scrutinise margins as the company expands its AI infrastructure.\n\nGoogle\u2019s parent company reports on October 28. The key questions are whether its core Search advertising business remains resilient as AI-powered search expands, and whether Google Cloud can sustain its rapid growth. Investors will also watch the impact of higher infrastructure spending on profitability.\n\nAmazon reports on Thursday, October 29. AWS growth, operating margins and capital expenditure will be central to the results. The company\u2019s substantial investment in data centres and AI capacity has raised questions about how quickly spending will translate into sustainable cash flow.\n\nThe three companies are investing heavily in computing power, chips, data centres and electricity capacity. The spending reflects strong demand for AI services, but it also increases depreciation and financing pressures. Investors want clearer evidence that returns will keep pace with the cost of expansion.\n\nRecent quarterly results showed strong growth across the three cloud businesses.", "source": "Economic Times Markets", "pub_date_str": "26 Oct 2026, 10:54 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "L&T Technology Services Shares Rise Over 3% After Five-Year Nokia Deal", "full_content": "L&T Technology Services announced a five-year collaboration with Nokia to support engineering and research activities in India. The stock rallied as the partnership focuses on 5G networks, AI infrastructure, and next-generation computing.", "source": "NDTV Profit", "pub_date_str": "26 Oct 2026, 10:53 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "\u2018Ticking time bomb\u2019: The world's pension funds face an ageing crisis", "full_content": "The world's pension systems are confronting a demographic crisis as longer lifespans and dwindling birth rates threaten to stretch retirement finances, raising questions about their ability to sustain payouts for future generations.\n\nPension offerings generally fall into two categories: defined-benefit plans, which promise retirees a predetermined income, and defined-contribution plans, where payouts depend on accumulated savings and investment returns.\n\nAgeing poses different challenges for the two systems: defined-benefit schemes face mounting liabilities as retirees live longer, while defined-contribution members risk outliving their savings, placing greater pressure on funds' investment performance.\n\nThe problem is \"huge, and it's gotten more pronounced over time,\u201d said Sebastien Betermier, executive director at the International Centre for Pension Management, noting that some pension funds have members who have been retired for nearly half a century, aged aged 107 or 108.\n\n\"The higher the longevity, the more years the pension funds have to cover, and so that immediately comes in as an additional liability,\" he said. \"Think about the cost that it imposes actually on the next generation \u2026 it is a ticking time bomb,\" Betermier told CNBC.\n\nThe scale of the challenge is laid bare in the 2026 Marsh CFA Institute Global Pension Index, or MCGPI, report published Tuesday last week. Of the 55 pension systems covered by the index, 43 have fertility rates below the replacement level of 2.1 children per woman, while 23 have rates below 1.5.\n\nMeanwhile, life expectancy at age 65 in more developed regions has increased by 50.9% since 1950 to about 20 additional years, meaning retirement benefits must now last considerably longer. The number of potential workers supporting older people is also set to decline sharply.\n\n\u201cThe funding of future pensions and aged care both become more critical as the ratio of workers to retirees continues to decline,\u201d the MCGPI report stated.", "source": "CNBC Top News", "pub_date_str": "26 Oct 2026, 10:52 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "IndusInd Bank Shares: IDBI Capital Stays Bullish After Strong Q2 Performance; Check Target Price", "full_content": "Management targets growth in line with the market and remains on track for 1% exit RoA in FY27, with a medium-term ambition of 1.751.80%, adds the brokerage.", "source": "NDTV Profit", "pub_date_str": "26 Oct 2026, 10:52 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Oil slides over 2% as traders weigh Saudi attack risks, demand destruction", "full_content": "U.S. crude oil fell over 2% on Monday as investors weighed the threat of further attacks on Saudi Arabian energy infrastructure against concerns that elevated prices could eventually erode demand.\n\nU.S. West Texas Intermediate futures slid 2.19% to $101 a barrel, while Brent crude futures declined 1.89% to $114.51 a barrel.\n\nOil prices year-to-date The pullback followed a sharp rally on Friday after attacks by Yemen's Houthi militants on Saudi Arabia reignited fears of disruptions to global energy supplies.\n\nTensions remained elevated over the weekend as the Houthis said they had targeted Saudi Arabia's main airport in Riyadh and oil facilities on Saturday. Saudi authorities said Sunday that they had intercepted additional missiles and drones.\n\nThe kingdom partially resumed operations at its main airport on Sunday despite damage from earlier attacks, even as the Houthis threatened further strikes.\n\nThe continued hostilities have heightened concerns about the vulnerability of Saudi Arabia's energy infrastructure, with traders increasingly focused on the risk of a major disruption to production, refining or export facilities.\n\nSpeaking to CNBC, Michael Alfaro, chief investment officer at Gallo Partners, estimated that geopolitical uncertainty had already added roughly $20 a barrel to oil prices.\n\nA substantial strike on Saudi Arabia's East-West pipeline or additional refining infrastructure could send prices sharply higher, he added, but further gains could eventually undermine consumption.", "source": "CNBC Top News", "pub_date_str": "26 Oct 2026, 10:48 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Derivatives", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Brazil Stocks Dive As President Lula Wins Re-Election - Investor's Business Daily", "full_content": "Brazil Stocks Dive As President Lula Wins Re-Election Investor's Business Daily Brazil\u2019s Surprise Election Outcome Set to Batter Stocks, Real WSJ EM Stocks Fall Before Key Earnings, Brazil in Focus as Lula Wins Bloomberg.com 3 Brazilian Export Stocks With Overseas Sales Investors Should Watch Yahoo Finance Brazil Election Risk Has Magazine Luiza Stock And Brazil Logistics Shares In Focus Simply Wall Street", "source": "Google News Business", "pub_date_str": "26 Oct 2026, 10:46 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Bharat Coking Coal shares rally 5% after Q2 profit turnaround; revenue jumps 39% YoY", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Bharat Coking Coal shares rally 5% after Q2 profit turnaround; revenue jumps 39% YoY Bharat Coking Coal Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Bharat Coking Coal shares rally 5% after Q2 profit turnaround; revenue jumps 39% YoY SECTIONS Bharat Coking Coal shares rally 5% after Q2 profit turnaround; revenue jumps 39% YoY By Ritesh Presswala , ETMarkets.com Last Updated: Oct 26, 2026, 10:38:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Bharat Coking Coal shares sharply on Monday after the Coal India subsidiary reported a turnaround to profit in Q2 FY27, with net profit at Rs 123.7 crore and revenue up 39% year-on-year to Rs 4,412.58 crore. However, first-half production declined, while technical indicators pointed to continued weakness in the stock.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "26 Oct 2026, 10:38 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Infosys shares crash 4% - Should investors buy, sell, hold this IT stock after Q2 results? Experts decode | Target price", "full_content": "Infosys shares crashed nearly 4% in morning trade on the BSE on Monday, 26 October, after the IT major reported its September quarter (Q2FY27) results. Infosys share price opened at \u20b9 1,119.05 against its previous close of \u20b9 1,154.50 and declined 3.9% to an intraday low of \u20b9 1,109.70.\n\nInfosys reported a net profit of \u20b9 7,823 crore in Q2FY27, up 6.23% year--on-year. The company\u2019s net revenue from operations stood at \u20b9 49,244 crore in Q2FY27 against \u20b9 44,490 crore reported in the year-ago period.\n\nRevenue growth stood at 1.2% on a sequential basis (in constant currency terms), whereas 1.5% on an annual basis (in CC terms).\n\nInfosys shares have been under pressure for the last several years. BSE data shows, the stock is down 33% over the last five years, compared to a 19% gain in the Sensex.\n\nOver the last three years, the stock is down 16% compared to a 16% gain in the equity benchmark Sensex.\n\nYear-to-date, the stock is down 30%, while the Sensex has lost 14%.\n\nBrokerage firm ICICI Securities has maintained a \"reduce\" call on the stock but increased the target price to \u20b9 1,030 from \u20b9 940 earlier.\n\nICICI Securities highlighted that Infosys cut its organic revenue guidance to -0.2% at mid-point (from earlier 0.55%) YoY CC for FY27 due to softer-than-expected volumes in the first half of FY27, pricing pressure from higher competitive intensity, and subdued discretionary spends.", "source": "LiveMint Markets", "pub_date_str": "26 Oct 2026, 10:35 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Global Market: Japan's Nikkei falls for third straight session as chip stocks slide", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Global Market: Japan's Nikkei falls for third straight session as chip stocks slide Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market: Japan's Nikkei falls for third straight session as chip stocks slide SECTIONS Global Market: Japan's Nikkei falls for third straight session as chip stocks slide By Anupam Nagar , ETMarkets.com Last Updated: Oct 26, 2026, 10:29:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Japan's Nikkei share average slipped for a third straight session on Monday, primarily due to declines in chip-related stocks. The Nikkei 225 saw a decrease of 0.43%, contrasted by a 0.48% rise in the broader Topix index. Despite a surge in energy stocks driven by rising oil prices, concerns over global market fluctuations left investors wary.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "26 Oct 2026, 10:29 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Reliance shares: Why is it wise to buy RIL shares amid a falling stock market \u2014 Explained with 3 reasons; target price", "full_content": "Stocks to buy today | Stock market today | Reliance share price target: Following crude oil prices and the US bond yield remaining at the elevated levels, the key benchmark indices of the Indian stock market opened lower for the fifth straight session. The Nifty 50 index opened lower at 22,524 and touched an intraday low of 22,387 within a few minutes of the Opening Bell on Monday. The BSE Sensex opened downside at 72,990 and touched an intraday low of 72,514. However, both indices recovered sharply following the bottom fishing. This fall, during the early morning session, Reliance Industries shares touched an intraday low of \u20b9 1,174.50 per share on the NSE. However, the Nifty and Sensex heavyweights soon came into the bulls' sights and turned green.\n\nAccording to stock market experts, shares of Reliance Industries Ltd (RIL) are under pressure due to weak trends on Dalal Street. They said that the company's fundamentals are very strong, and amid the ongoing Middle East crisis and soaring crude oil prices, there is a need for top-quality oil refiners, and RIL fits this category. The US Secretary of State Marco Rubio's meeting with Mukesh Ambani should be seen from this angle. They said that Reliance's Jio Platforms value unlock will also benefit RIL, as it holds around two-thirds of the company's share capital. Pointing to the third reason for buying Reliance shares amid the current fall in the Indian stock market, experts said that the US-Iran war has fueled crude oil prices, but diesel prices have surged even more. RIL is a diesel exporter and is expected to reap this benefit as well.\n\nPointing towards the US Secretary of State Marco Rubio meeting Mukesh Ambani, Avinash Gorakshkar, Founder of Avinash Mentor Research, said, \u201cThough it is no official confirmation, but Marco Rubio meeting Mukesh Ambani is expected to focus on the refining business, as a good number of refiners have gone out of business in the Middle East due to the prolonged US-Iran war.", "source": "LiveMint Markets", "pub_date_str": "26 Oct 2026, 10:27 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Fixed Income", "Alternative Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "SoftBank reportedly plans $50 billion tech investment in aspiring 'AI nation' Malaysia", "full_content": "SoftBank Group plans to make $50 billion of investments in Malaysia, Prime Minister Anwar Ibrahim said, according to a Bloomberg report.\n\nAnwar said Saturday that Son had identified locations in Kuching, Sarawak, and peninsular Malaysia for the planned investments following a video conference between the two earlier in the week, the report said .\n\nThe country's prime minister said the planned investments would focus on artificial intelligence, new technologies and data centers, according to the report.\n\nThe planned investment comes as Malaysia seeks to become an \"AI nation \" by 2030, with the government launching a national AI action plan earlier this year to strengthen the country's AI capabilities and infrastructure.\n\nEarlier this month, SoftBank signed a framework agreement with Singapore-based Grab and Malaysia's Petroleum Sarawak Berhad to explore AI and digital infrastructure development in Sarawak, including AI computing services and advanced technologies.\n\nSoftBank is not alone in pursuing technology investments in Malaysia. Google announced a $2 billion investment in 2024 to build its first data center and cloud region in the country, while Amazon Web Services said it planned to invest $6.2 billion through 2038. Microsoft also announced a $2.2 billion investment in cloud and AI infrastructure and other digital initiatives.\n\nThe country recorded 385.7 billion ringgit ($94 billion) in data center-related investments between 2021 and the first half of 2026, according to the Malaysian Investment Development Authority.\n\nSoftBank did not immediately respond to CNBC's request for comment.", "source": "CNBC World Economy", "pub_date_str": "26 Oct 2026, 10:26 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "5 global market themes to watch out for this week", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News Powered By 5 global market themes to watch out for this week Written by Anupam Nagar , ETMarkets.com | Oct 26, 2026, 10:50:19 AM IST 1 / 5 Global markets face a pivotal week Global markets brace for a packed week of central bank decisions, mega-cap tech earnings, and major political developments. Investors will assess the Federal Reserve\u2019s policy outlook, the sustainability of the artificial intelligence (AI) rally, Britain\u2019s budget plans and elections in Israel and Brazil. China\u2019s leadership meeting will also draw attention amid trade tensions and weak domestic demand. (Source: Reuters)\n\nThe Federal Reserve, European Central Bank and Bank of Japan are set to announce monetary policy decisions this week, with investors closely watching their guidance on inflation and interest rates. The Bank of Canada and Reserve Bank of New Zealand are also scheduled to meet, with markets anticipating rate hikes. Elevated oil prices could complicate the inflation outlook and influence policymakers\u2019 decisions.\n\nQuarterly results from Alphabet, Microsoft and Amazon will be a key test for the AI-driven stock market rally. Investors will scrutinise revenue growth, earnings performance and capital expenditure plans, particularly spending on data centres and AI infrastructure. With roughly one-third of S&P 500 companies due to report, the results could determine whether strong corporate earnings can sustain elevated equity valuations.\n\nBritain\u2019s Finance Minister John Healey faces the challenge of providing relief to households grappling with higher energy costs while maintaining fiscal discipline and investor confidence in government bonds.", "source": "Economic Times Markets", "pub_date_str": "26 Oct 2026, 10:25 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "US stocks face crucial test as AI earnings, Fed meeting loom", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a US stocks face crucial test as AI earnings, Fed meeting loom Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US stocks face crucial test as AI earnings, Fed meeting loom SECTIONS US stocks face crucial test as AI earnings, Fed meeting loom By Anupam Nagar , ETMarkets.com Last Updated: Oct 26, 2026, 10:24:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Prin stry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Forex \u203a Forex News \u203a Rupee falls 5 paise to 94.98 against US dollar in early trade The Economic Times daily newspaper is available online now. Read Today's Paper Rupee falls 5 paise to 94.98 against US dollar in early trade SECTIONS Rupee falls 5 paise to 94.98 against US dollar in early trade PTI Last Updated: Oct 26, 2026, 10:19:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis In early trading, the rupee was priced at 94.98 against the US dollar, slipping by 5 paise primarily due to high crude oil rates and ongoing geopolitical conflicts. Despite the dollar index facing a slight decline of 0.15 percent, India's forex reserves have seen a downturn, potentially affecting the currency's stability. However, the Reserve Bank of India's timely intervention might bolster the rupee at lower trading levels.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "26 Oct 2026, 10:19 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Stock Market Today: Nifty, Sensex Erase Opening Losses; Market Breadth Tilts In Favour Of Buyers", "full_content": "Market breadth improves as Nifty 50 rises above 22,600 and Sensex gains 149 points after a weak start", "source": "NDTV Profit", "pub_date_str": "26 Oct 2026, 10:18 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Tata Motors Has A 20% Revenue Cushion Against CV Downturns. Can It Grow It?", "full_content": "Tata Motors CEO Girish Wagh said the segment is a clear focus area, laid out at the investor day, and works as a natural hedge against the cyclicality the CV industry generally faces.", "source": "NDTV Profit", "pub_date_str": "26 Oct 2026, 10:17 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Apollo Micro Systems share price jumps 10% after Q2 results; stock up 44% in 2026 \u2014 check resistance, support levels", "full_content": "Apollo Micro Systems shares jumped nearly 10% on Monday, 26 October, after the defence electronics company reported its Q2 and H1 FY27 results, posting strong year-on-year growth in revenue, EBITDA and profit after tax (PAT).\n\nThe company reported revenue of \u20b9 388.15 crore in Q2 FY27, up 72.3% from a year earlier. EBITDA rose 87.8% to \u20b9 111.18 crore, while PAT increased 53.7% to \u20b9 46.15 crore.\n\nFor the first half of FY27, revenue grew 78.2% year-on-year to \u20b9 639.44 crore. EBITDA rose 64.7% to \u20b9 164.91 crore, while PAT increased 49.6% to \u20b9 71.37 crore.\n\nApollo Micro Systems also reported an all-time-high consolidated order book of \u20b9 1,765 crore as of 30 September 2026, underscoring its business pipeline.\n\nBaddam Karunakar Reddy, Managing Director of Apollo Micro Systems, said the company's best-ever Q2 performance reflected strong execution, resilience and a focus on key priorities. He added that the company would accelerate execution, strengthen its capabilities and respond to the evolving needs of the defence sector, while supporting national defence preparedness.\n\nIDL Explosives Ltd, a group company of Apollo Micro Systems Ltd, has commissioned a bulk explosives silo unit near Asansol in West Bengal, with a capacity of 9,000 metric tonnes.\n\nSpread across 8.4 acres, the Bolkunda Silo Unit was inaugurated on 22 October, the company said in an exchange filing.\n\nThe facility will supply site-mixed bulk explosives to mining operations of Eastern Coalfields Ltd, Central Coalfields Ltd and other customers in the region.", "source": "LiveMint Markets", "pub_date_str": "26 Oct 2026, 10:15 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Small finance banks shares: AU and Ujjivan stocks crash 6% - What should investors do? Buy or sell? Target price, upside", "full_content": "Small finance banks shares : AU Small Finance Bank and Ujjivan Small Finance Bank shares plunged over 6% in Monday's trading session amid weak sentiment in the Indian stock market.\n\nAU Small Finance Bank share price opened at \u20b9 884 per share today, as compared to the previous close of \u20b9 932.90 on Friday and touched an intraday low of \u20b9 845.40. Meanwhile, Ujjivan Small Finance Bank share price opened at \u20b9 57.60 on NSE today, as compared to the previous close of \u20b9 58.10 last week. The banking stock touched an intraday low of \u20b9 54.44 today.\n\nBoth small finance stocks fell sharply after Sensex and Nifty 50 dropped in early trade on Monday.\n\nAU Small Finance Bank reported a 53% year-on-year increase in net profit to \u20b9 858 crore for the second quarter ended September 30, 2026, supported by higher interest income. The bank had recorded a net profit of \u20b9 561 crore in the corresponding quarter of the previous financial year.\n\nThe lender\u2019s total income rose to \u20b9 6,382 crore in the September quarter, compared with \u20b9 5,224 crore in the year-ago period, according to a regulatory filing.\n\nInterest income increased to \u20b9 5,612 crore during the quarter under review from \u20b9 4,511 crore in the same quarter last year.\n\nAU Small Finance Bank\u2019s net interest income (NII) rose 32% year-on-year to \u20b9 2,820 crore in the July-September quarter, compared with \u20b9 2,144 crore in the corresponding quarter of the previous year.\n\n[Ujjivan Small Finance Bank](https://scanx.trade/company/ujjivan-small-finance-bank-ltd) reported its highest-ever quarterly profit after tax (PAT) of \u20b9 365 crore in Q2 FY27, with return on assets (ROA) improving to 2.4% from 2.2% in the preceding quarter.", "source": "LiveMint Markets", "pub_date_str": "26 Oct 2026, 10:13 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Holcim lifts guidance again on strong demand", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Holcim lifts guidance again on strong demand Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Holcim lifts guidance again on strong demand SECTIONS Holcim lifts guidance again on strong demand By Bloomberg Last Updated: Oct 26, 2026, 10:12:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Holcim has increased its full-year guidance due to robust demand for sustainable building materials. The company reported a 17% jump in recurring Ebit in the third quarter, surpassing expectations. Increased customer demand and cost discipline contributed significantly to this profit increase. The firm aims to announce around 15 acquisitions by the end of this year. Holcim is focusing on alternative fuels to mitigate rising energy costs.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "26 Oct 2026, 10:12 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "AU Small Finance Bank shares tumble 10% after Q2 results, but Jefferies and Motilal see up to 37% upside", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a AU Small Finance Bank shares tumble 10% after Q2 results, but Jefferies and Motilal see up to 37% upside Au Small Finance Bank Share Price Ujjivan Small Finance Bank Share Price Equitas Small Finance Bank Share Price Jana Small Finance Bank Share Price Utkarsh Small Finance Bank Share Price The Economic Times daily newspaper is available online now. Read Today's Paper AU Small Finance Bank shares tumble 10% after Q2 results, but Jefferies and Motilal see up to 37% upside SECTIONS AU Small Finance Bank shares tumble 10% after Q2 results, but Jefferies and Motilal see up to 37% upside By Veer Sharma , ETMarkets.com Last Updated: Oct 26, 2026, 10:11:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis AU Small Finance Bank shares fell up to 10% despite a 53% year-on-year rise in Q2 net profit. Jefferies and Motilal Oswal retained Buy ratings, citing growth prospects, improving asset quality and lower credit costs.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "26 Oct 2026, 10:11 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Shriram Finance shares crash 6% as Jefferies, Citi, and other brokerages slash target prices after Q2 results. Why do they still say \u2018Buy\u2019?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Shriram Finance shares crash 6% as Jefferies, Citi, and other brokerages slash target prices after Q2 results. Why do they still say \u2018Buy\u2019? The Economic Times daily newspaper is available online now. Read Today's Paper Shriram Finance shares crash 6% as Jefferies, Citi, and other brokerages slash target prices after Q2 results. Why do they still say \u2018Buy\u2019? SECTIONS Shriram Finance shares crash 6% as Jefferies, Citi, and other brokerages slash target prices after Q2 results. Why do they still say \u2018Buy\u2019? By Debaroti Adhikary , ETMarkets.com Last Updated: Oct 26, 2026, 10:06:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Shriram Finance shares fell sharply on Monday after Jefferies, Citi and Motilal Oswal cut their target prices following the NBFC\u2019s Q2 results. Despite concerns over rising credit costs and rural stress, all three brokerages retained their \u2018Buy\u2019 ratings, citing strong net interest income, resilient margins and long-term growth potential.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "26 Oct 2026, 10:06 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Why Kotak Mahindra Bank is unlikely to be top investors\u2019 choice among large lenders despite strong Q2", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nKotak Mahindra Bank\u2019s standalone loan book grew 19% year-on-year to \u20b9 5.5 trillion, excluding the twin impact of the acquisition of Kotak Mahindra Investments\u2019 loan portfolio and loans against FCNR(B) deposits worth \u20b9 16,110 crore.\n\nKotak Bank took over Kotak Mahindra Investments\u2019 loan portfolio of nearly \u20b9 9,600 crore at the beginning of Q2 to comply with the Reserve Bank of India\u2019s directions requiring the elimination of overlapping, non-specialized lending structures within a banking group. Since only the advances of Kotak Mahindra Investments were transferred to Kotak Bank, and not the liabilities, the bank is likely to have earned interest income of about \u20b9 200 crore. Adjusting for this, net interest income (NII) growth would be about 13% year-on-year, versus 15.7%.\n\nKotak Bank\u2019s net interest margin (NIM) for Q2 was 4.31%, down 22 basis points (bps) sequentially, with FCNR(B) -related funds accounting for the bulk of the decline at 15 bps. The balance was due to quarter-specific day-count variation, as Kotak Bank reports NIM based on the number of days rather than the number of months. Core pre-provisioning operating profit (PPoP) growth was robust at 20% year-on-year to \u20b9 6,115 crore, attributable to a 21% increase in fee and service income to \u20b9 2,926 crore.\n\nThe bank declined to provide guidance for NIM in Q3. However, the full impact of FCNR(B) deposits could exert significant downward pressure on margins, as nearly 45% of incremental deposits in Q2 came from this source. Reported deposit growth was 23% year-on-year, but would have been much lower, at 13%     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
