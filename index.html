ating in the anchor book of the \u20b9 30,188-crore offering. The IPO is expected to be the largest in India\u2019s history.\n\nDomestic institutions, including the Life Insurance Corporation of India (LIC), SBI Mutual Fund, ICICI Prudential Mutual Fund, HDFC Mutual Fund and Kotak Mahindra Mutual Fund, are also among the prospective investors, according to media reports.\n\nOther investors reportedly interested in the anchor allocation include the Government of Singapore Investment Corporation (GIC), Fidelity, Norway\u2019s Government Pension Fund Global, New World Fund Inc and Smallcap World Fund Inc.\n\nJio Platforms IPO GMP today, or grey market premium, is +235. Considering the upper end of the IPO price band and the current premium in the grey market, the estimated listing price of Jio Platforms share price was indicated at \u20b9 1,354 apiece, which is 21% higher than the IPO price of \u20b9 1,119.\n\nIn the past 15 sessions, the IPO GMP has fluctuated by \u20b9 87, shifting between levels without establishing a clear trend. The most recent GMP is \u20b9 235, indicating a shift in grey market expectations, as noted by analysts.\n\nJio Platforms IPO price band has been fixed at \u20b9 1,065\u2013 \u20b9 1,119 per share, with investors required to bid for a minimum of 12 shares and in multiples of 12 thereafter. Eligible employees applying under the reserved category will be entitled to a \u20b9 54 per share discount.\n\nThe public issue will open for subscription on 21 October and close on 23 October, while the anchor investor bidding window is scheduled for 19 October.", "source": "LiveMint Markets", "pub_date_str": "18 Oct 2026, 10:56 AM IST", "pub_date_relative": "39m ago"}, {"title": "Rubio heads to Central Asia while other US officials hit foreign policy hot spots", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Oct 2026, 10:42 AM IST", "pub_date_relative": "54m ago"}, {"title": "Rubio says Trump to take up to 60 days to weigh Russ  Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "18 Oct 2026, 10:41 AM IST", "pub_date_relative": "55m ago"}, {"title": "EPFO: How to check status, EPF account passbook on official portal, Umang app, SMS, Missed Call, WhatsApp\u2014Stepwise guide", "full_content": "The Employees' Provident Fund (EPF) is a government-backed investment and retirement savings option for salaried individuals in India. For FY26, the Centre ratified 8.25% interest rate for both EPF and voluntary provident fund (VPF). Marking the third consecutive time the instrument delivered 8.25% returns.\n\nToday, we look at how EPF members can check their employees provident fund balance EPF account passbook , download their passbook for the account or track the status of their application can do so using the official portal, Umang mobile app, SMS, WhatsApp, or the missed call facilities.\n\nPlease note that for newly activated UANs , passbook is available only after few hours of the account becoming active. New members will thus have to wait to view their contributions and balance details.\n\nThe EPF's WhatsApp services are expected to offer 24/7 access, with automated systems handling repetitive queries on basic account-related requests round the clock.\n\nMembers can type \u2018Hello\u2019 to EPFO's registered, tick mark verified WhatsApp number, to initiate conversation. You can join the channel by clicking here \u2014 https://www.whatsapp.com/channel/0029Vb6kmH48Pgs8ftd6Kw3Y\n\nMembers will be able to check their EPF balance , view the last five transactions made, track your EPF account claim status and access other important services through the messaging platform.", "source": "LiveMint Money", "pub_date_str": "18 Oct 2026, 10:35 AM IST", "pub_date_relative": "1h ago"}, {"title": "8th pay commission: Official state visit to Mumbai planned this week \u2014 Here's all we know about meetings, agenda", "full_content": "The 8th central pay commission (CPC) is in its consultation stage and has scheduled meetings in Mumbai this week and will hold discussions with employee unions, representatives, groups, pensioner associations, federations, and other stakeholders, before releasing its official recommendations.\n\nThe 8th CPC is chaired by former Supreme Court Justice Ranjana Prakash Desai , with Pankaj Jain, a former IAS officer as Member-Secretary, and Professor Pulak Ghosh, a tenured Professor of Finance and Member of the Economic Advisory Council to the Prime Minister as Member of the Commission.\n\nEstablished by the central government every 10 years to revise the allowances, pay and pensions of its employees, the pay commission or CPC, is responsible for decisions on contributions, retirement benefits and government spending. Overall, the recommendations are set to benefit over 1 crore individuals, including about 50 lakh central government employees and close to 65 lakh pensioners, including personnel and retirees with the defence and railway ministries.\n\nThe current panel is the Centre's eight since Independence. It was constituted by Prime Minister Narendra Modi last year and issued its Terms of Reference ( ToR ) in November.\n\nThe ToR for the 8th CPC outlines that recommendations be announced within 18 months of panel constitution. Thus, the absolute deadline to submit the report is May 2027 .\n\nOnce the pay commission's recommendations are made, the rollout could take another two to three years to complete.", "source": "LiveMint Money", "pub_date_str": "18 Oct 2026, 10:34 AM IST", "pub_date_relative": "1h ago"}, {"title": "Woodside halts work at Scarborough gas project after Greenpeace protest", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Oct 2026, 10:31 AM IST f the IPO price band and the current premium in the grey market, the estimated listing price of Jio Platforms share price was indicated at \u20b9 1,354 apiece, which is 21% higher than the IPO price of \u20b9 1,119.\n\nIn the past 15 sessions, the IPO GMP has fluctuated by \u20b9 87, shifting between levels without establishing a clear trend. The most recent GMP is \u20b9 235, indicating a shift in grey market expectations, as noted by analysts.\n\nThrough its subsidiary Reliance Jio Infocomm Limited (RJIL), Jio Platforms became India\u2019s first telecom operator to roll out a standalone 5G network. The company had 284.9 million 5G subscribers as of the first quarter of FY27, making it the world\u2019s third-largest 5G customer base. Its next-generation network enables high-bandwidth and low-latency applications, including 4K video streaming, cloud gaming, augmented reality and virtual reality.\n\nJio Platforms Limited, incorporated on 15 November 2019, is a technology company with operations spanning digital connectivity, consumer services and enterprise technology solutions. It has built proprietary digital capabilities and a nationwide connectivity infrastructure to serve both individual users and businesses.", "source": "LiveMint Markets", "pub_date_str": "18 Oct 2026, 09:53 AM IST", "pub_date_relative": "1h ago"}, {"title": "IDBI Bank Q2 net profit slides 39% to 2,205 crore", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a Earnings \u203a IDBI Bank Q2 net profit slides 39% to 2,205 crore IDBI Bank Share Price Punjab National Bank Share Price Union Bank of India Share Price Bank of Baroda Share Price Indian Bank Share Price The Economic Times daily newspaper is available online now. Read Today's Paper IDBI Bank Q2 net profit slides 39% to 2,205 crore SECTIONS IDBI Bank Q2 net profit slides 39% to 2,205 crore ET Bureau 5 after a Reddit post claimed that Anirudh and Kavya had been dating for more than a year and that their families were discussing marriage.", "source": "NDTV Profit", "pub_date_str": "18 Oct 2026, 09:45 AM IST", "pub_date_relative": "1h ago"}, {"title": "\u2018Cash is making a comeback\u2019 in digital India", "full_content": "Shadow economy drives demand for physical currency as new charge could hit popularity of the UPI digital payments interface", "source": "FT Markets", "pub_date_str": "18 Oct 2026, 09:41 AM IST", "pub_date_relative": "1h ago"}, {"title": "NextTrip earnings missed by $0.11, revenue fell short of estimates", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Oct 2026, 09:40 AM IST", "pub_date_relative": "1h ago"}, {"title": "Mumbai: Pedestrian Escapes Unhurt After Three Rounds Fired in Wadala; Suspects Detained", "full_content": "The police are investigating the sequence of events, including the alleged arrival of the suspects in the Ola car and the circumstances under which the shots were fired at the pedestrian.", "source": "NDTV Profit", "pub_date_str": "18 Oct 2026, 09:36 AM IST", "pub_date_relative": "2h ago"}, {"title": "'India an important ally': Rubio says Trump studying effects of tariffs on countries like India", "full_content": "Choose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "18 Oct 2026, 09:32 AM IST", "pub_date_relative": "2h ago"}, {"title": "India\u2019s soybean output seen falling 2.1% to 107.93 lakh tonnes in Kharif 2026: Farmers' body", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Agriculture \u203a India\u2019s soybean output seen falling 2.1% to 107.93 lakh tonnes in Kharif 2026: Farmers' body The Economic Times daily newspaper is available online now. Read Today's Paper India\u2019s soybean output seen falling 2.1% to 107.93 lakh tonnes in Kharif 2026: Farmers' body SECTIONS India\u2019s soybean output seen falling 2.1% to 107.93 lakh tonnes in Kharif 2026: Farmers' body PTI Last Updated: Oct 18, 2026, 09:28:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India's soybean production forecast indicates a slight decline to 107.93 lakh tonnes during the ongoing Kharif season. Drought-like conditions in Maharashtra, Karnataka, and Telangana are contributing to this reduction in output. However, increased production in Madhya Pradesh and Rajasthan is expected to compensate for these losses. The area cultivated with soybean increased by approximately 5 lakh hectares compared to the previous season.\n\nWar's second-order effects are becoming visible in critical sectors\n\nUS mid-term elections \u2013 Part 2: What does it mean for Trump to lose control of Congress?\n\nHomebuyers wait as NCLT panel picks holes in unfinished Jaypee projects\n\nWhat is the real impact of 13x jump in cash transfers to women?\n\nAirlines Q2 turbulence: Fewer passengers, rising fares and a crude shock\n\nThe NBFC saga - Part 2: Line drawn in 2006 is reason for the headlines today\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "18 Oct 2026, 09:28 AM IST", "pub_date_relative": "2h ago"}, {"title": "8th Pay Commission: What is the difference between basic pay, grade pay and pay level? Expert explains", "full_content": "The 8th Pay Commission is gearing up for its Mumbai meeting on October 22 and 23, right after Dussehra. This is the second key meeting to be held in October 2026, following the recently concluded meeting in Bengaluru on 8 October.\n\nIn these meetings held across the country over the last few months, eligible employee unions and associations have tabled their views, grievances, and aspirations on core aspects such as basic pay, grade pay, and pay levels. Along with fitment factors, pension reforms and associated aspects.\n\nNow, it is vital for serving central government employees, associated stakeholders and pensioners to clearly acknowledge that each of the terms discussed above has a distinct meaning and role in determining an employee\u2019s salary. Having a clear understanding of these terms is particularly significant as employees await the 8th Pay Commission's recommendations on revised pay and pensions.\n\nFor example, the prominent employee union, i.e., the Staff Side of the National Council (Joint Consultative Machinery) (NC-JCM), has requested that the 8th Pay Commission panel provide employees with a minimum basic pay of \u20b9 69,000. This has been requested on a fitment factor of 3.833.\n\nIn the 6th and the 7th pay commissions, the officially approved fitment factors were 1.86 and 2.57, respectively. This time, the unions are pushing for a higher multiplier to ensure that serving central government employees and pensioners can meaningfully combat rising inflation. With these basics in mind, let us discuss the fundamental differences among basic pay , grade pay, and pay levels.\n\nBasic pay is the core component of an employee\u2019s salary, excluding allowances such as Dearness Allowance (DA) and House Rent Allowance (HRA). These allowances are generally calculated using basic pay as the reference.", "source": "LiveMint Money", "pub_date_str": "18 Oct 2026, 09:27 AM IST", "pub_date_relative": "2h ago"}, {"title": "Mutual funds\u2019 portfolio shifts: Aditya Infotech, BSE stand out among top 10 stocks by holding value changes in September", "full_content": "If you invest in mutual funds , it is worth tracking which stocks fund managers are buying and selling, as these changes can offer insights into how their portfolios are shifting.\n\nIn September 2026, mutual funds increased the value of their holdings in stocks such as BSE, HDFC Bank, Coal India, Meesho, and Gland Pharma, according to the latest Fund Folio \u2013 Indian Mutual Fund Tracker report by Motilal Oswal Financial Services.\n\nHowever, a rise in the value of a mutual fund's holdings does not necessarily mean fund managers bought more shares. The change can reflect fresh purchases, changes in share prices, or a combination of both.\n\nComparing changes in holding value with changes in shareholding quantity offers investors a clearer picture of where mutual funds increased their exposure.\n\nAditya Infotech recorded the highest growth in holding value among the top 10 stocks, at 35.6%, while BSE led in the percentage increase in shareholding quantity, at 34.6%.\n\n*Source: Motilal Oswal Financial Services\u2019 Fund Folio: Indian Mutual Fund Tracker; September 2026 activity; Holding values and share quantities are as of September 2026; month-on-month changes compare September with August 2026; Figures have been converted from billion to crore and million to lakh, respectively.\n\nBSE saw a 26.8% increase in the value of mutual funds' holdings to \u20b9 20,060 crore. The quantity of shares held rose 34.6%, while the stock's price declined 5.8% during the month. This indicates that the increase in holding value was driven by a higher number of shares held, rather than a rise in the stock price.\n\nAditya Infotech also recorded a substantial increase in holding value, up 35.6% to \u20b9 6,070 crore. Its shareholding quantity rose 25.7%, while its stock price gained 7.5%. Both the increase in shareholding and price appreciation contributed to the higher portfolio value.", "source": "LiveMint Money", "pub_date_str": "18 Oct 2026, 09:13 AM IST", "pub_date_relative": "2h ago"}, {"title": "Axis Bank Vs HDFC Bank Vs ICICI Bank Q2 Results: Who Led On Profit, Margins And Bad Loans?", "full_content": "Among the three lenders, ICICI Bank fared strongly on the core income front, with its net interest income (NII) rising 17.7% year-on-year to Rs25,339 crore.", "source": "NDTV Profit", "pub_date_str": "18 Oct 2026, 09:05 AM IST", "pub_date_relative": "2h ago"}, {"title": "ICICI Bank vs HDFC Bank vs Axis Bank: Which stock to buy, sell or hold after Q2 results?", "full_content": "India\u2019s three largest private-sector lenders delivered a mixed performance in the September quarter of FY27, with ICICI Bank reporting strong earnings growth, HDFC Bank navigating margin pressures and a leadership transition, and Axis Bank posting a sharp rise in profit alongside improving asset quality.\n\nBrokerages remain positive on all three stocks, with Nuvama Institutional Equities retaining a \u2018Buy\u2019 rating on each. However, differences in credit growth, profitability and margin trends could influence investors\u2019 choices.\n\nICICI Bank reported a 20.1% year-on-year rise in standalone net profit to \u20b9 14,843 crore in Q2 FY27. Net interest income (NII) increased 17.7% to \u20b9 25,339 crore, supported by strong loan growth, while net interest margin (NIM) declined 12 basis points sequentially to 4.18%.\n\nNuvama Institutional Equities retained its \u2018Buy\u2019 rating on ICICI Bank with a target price of \u20b9 1,850. The brokerage highlighted credit growth of 30% year-on-year and 12% quarter-on-quarter, which remained strong even after excluding foreign currency non-resident (FCNR) deposits. Lower operating expenses and provisions helped the bank deliver a 7% profit beat against Nuvama\u2019s estimates.\n\nNuvama expects strong growth to continue, with margins recovering from Q3 FY27. It sees ICICI Bank delivering return on assets (RoA) of 2.2\u20132.3% and return on equity (RoE) of around 17% over FY27\u2013FY29, making it the brokerage\u2019s preferred pick among large private sector banks.\n\nSystematix Institutional Research also maintained its \u2018Buy\u2019 rating and raised its target price to \u20b9 1,750 from \u20b9 1,700. It said the bank\u2019s September-quarter profit of \u20b9 14,843 crore exceeded its estimates by 3.3%, while domestic NIM, excluding the tax refund impact, remained broadly stable at 4.32%.\n\nHDFC Bank reported a 4.7% year-on-year rise in standalone net profit to \u20b9 19,510 crore, while NIM on earning assets declined eight basis points sequentially to 3.32%.", "source": "LiveMint Markets", "pub_date_str": "18 Oct 2026, 08:47 AM IST", "pub_date_relative": "2h ago"}, {"title": "Post-Stampede Caution: Big-Ticket Durga Puja Pandals Halt Entry In Kolkata And Salt Lake", "full_content": "Kolkata authorities instructed major Durga Puja organizers to halt entry if overcrowding occurs. Calling it a temporary safety measure, officials will review the situation before deciding on Sunday restrictions.", "source": "NDTV Profit", "pub_date_str": "18 Oct 2026, 08:45 AM IST", "pub_date_relative": "2h ago"}, {"title": "'India an important ally': Rubio says Trump weighing impact of Russia-related tariffs", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a 'India an important ally': Rubio says Trump weighing impact of Russia-related tariffs The Economic Times daily newspaper is available online now. Read Today's Paper 'India an important ally': Rubio says Trump weighing impact of Russia-related tariffs SECTIONS 'India an important ally': Rubio says Trump weighing impact of Russia-related tariffs ET Online Last Updated: Oct 18, 2026, 11:12:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis US Secretary of State Marco Rubio stated that India's energy requirements will be considered before possible sanctions on Russian oil. President Donald Trump recently waived certain provisions of a proposed sanctions law affecting major importers of Russian crude. Rubio emphasized the need for time to assess the impact of these measures e the Sensex advanced 3.1% to 74,729.27, marking their best weekly performance since April 10. In Friday\u2019s session, the Nifty gained 0.7%, while the Sensex rose 0.6%.\n\nChandan Taparia of Motilal Oswal Financial Services, has recommended buying Mphasis, Hindustan Aeronautics (HAL) and Indian Hotels Company. He has set a target price of \u20b9 2,650 for Mphasis with a stop loss at \u20b9 2,425. For HAL, the target is \u20b9 5,260, with a stop loss at \u20b9 4,840. Indian Hotels has a target price of \u20b9 815 and a stop loss at \u20b9 750.\n\nOn the Nifty options front, Chandan Taparia, Head Derivatives & Technicals, Wealth Management, Motilal Oswal Financial Services Ltd, said that the maximum call OI is at 23,100 then 23,500 strike, while maximum put OI is at 23,000 then 22,700 strike.\n\n\u201cCall writing is seen at 23,100 then 23,150 strike while Put writing is seen at 23,100 then 23,000 strike. Option data suggests a broader trading range in between 22,700 to 23,500 zones while an immediate range between 22,900 to 23,400 levels,\u201d said Taparia.\n\nNifty 50 index opened on a positive note and witnessed volatile swings in the first hour before settling into a narrow range in the second half while firmly holding above 23,100 zones. The index closed near its upper band reflecting continued strength at higher levels.", "source": "LiveMint Markets", "pub_date_str": "18 Oct 2026, 11:22 AM IST", "pub_date_relative": "14m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Derivatives", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Ledger crypto wallets compromised in hardware attack linked to $90M theft", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Oct 2026, 11:21 AM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are {"title": "10 penny stocks plunge up to 75% in six months", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News 10 penny stocks plunge up to 75% in six months Written by Ritesh Presswala , ETMarkets.com | Oct 18, 2026, 11:16:24 AM IST 1 / 11 Under Pressure Over the past six months, 10 penny stocks have corrected sharply, falling between 50% and 75%. The stocks were identified through a screen of companies with a market capitalisation below Rs 1,000 crore, a share price below Rs 20, and a minimum recent trading volume of 5 lakh shares. The screen highlights low-priced, relatively liquid penny stocks that have experienced significant declines during the period. (Data Source: ACE Equity).", "source": "Economic Times Markets", "pub_date_str": "18 Oct 2026, 11:03 AM IST", "pub_date_relative": "33m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Reliance Jio IPO: LIC, leading MFs, AMCs and global investors eye issue, say reports | Check latest GMP price today", "full_content": "Jio Platforms\u2019 upcoming IPO has reportedly attracted nearly \u20b9 2.5 lakh crore in commitments, reflecting strong interest from major global and domestic institutional investors ahead of the public issue.\n\nGlobal investors, including sovereign wealth funds and prominent asset managers such as Allianz and BlackRock, have reportedly expressed interest in participating in the anchor book of the \u20b9 30,188-crore offering. The IPO is expected to be the largest in India\u2019s history.\n\nDomestic institutions, including the Life Insurance Corporation of India (LIC), SBI Mutual Fund, ICICI Prudential Mutual Fund, HDFC Mutual Fund and Kotak Mahindra Mutual Fund, are also among the prospective investors, according to media reports.\n\nOther investors Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "18 Oct 2026, 09:54 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Jio Platforms IPO RHP: From financials to spectrum portfolio | 10 key things to know before subscribing", "full_content": "Jio Platforms IPO RHP: Reliance Industries\u2019 digital and telecom arm, Jio Platforms, is set to launch its IPO in the price range of \u20b9 1,065 to \u20b9 1,119 per share. At the upper end of the band, the issue is expected to raise \u20b9 30,213 crore, which could make it the biggest IPO in India.\n\nThe public offering will consist of a fresh issue of up to 27 crore equity shares with a face value of \u20b9 10 each. The subscription window will run from 21 October to 23 October, while bidding by anchor investors is scheduled for 19 October, as per Reliance Industries' regulatory filings.\n\nJio Platforms IPO GMP today, or grey market premium, is +235. Considering the upper end of the IPO price band and the current premium in the grey market, the estimated listing price of Jio Platforms share price was indicated at \u20b9 1,354 apiece, which is 21% higher than the IPO price of \u20b9 1,119.\n\nIn the past 15 sessions, the IPO GMP has fluctuated by \u20b9 87, shifting between levels without establishing a clear trend. The most recent GMP is \u20b9 235, indicating a shift in grey market expectations, as noted by analysts.\n\nThrough its subsidiary Reliance Jio Infocomm Limited (RJIL), Jio Platforms became India\u2019s first telecom operator to roll out a standalone 5G network. The company had 284.9 million 5G subscribers as of the first quarter of FY27, making it the world\u2019s third-largest 5G customer base. Its next-generation network enables high-bandwidth and low-latency applications, including 4K video streaming, cloud gaming, augmented reality and virtual reality.\n\nJio Platforms Limited, incorporated on 15 November 2019, is a technology company with operations spanning digital connectivity, consumer services and enterprise technology solutions. It has built proprietary digital capabilities and a nationwide connectivity infrastructure to serve both individual users and businesses.", "source": "LiveMint Markets", "pub_date_str": "18 Oct 2026, 09:53 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Alternative Investments", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "IDBI Bank Q2 net profit slides 39% to 2,205 crore", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a Earnings \u203a IDBI Bank Q2 net profit slides 39% to 2,205 crore IDBI Bank Share Price Punjab National Bank Share Price Union Bank of India Share Price Bank of Baroda Share Price Indian Bank Share Price The Economic Times daily newspaper is available online now. Read Today's Paper IDBI Bank Q2 net profit slides 39% to 2,205 crore SECTIONS IDBI Bank Q2 net profit slides 39% to 2,205 crore ET Bureau Last Updated: Oct 18, 2026, 09:52:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis IDBI Bank witnessed a substantial 39% drop in net profit for the September quarter, primarily driven by decreased non-interest earnings. This follows a previous year where profits were significantly elevated by one-time gains. Nonetheless, net interest income saw a 29% increase year-on-year, indicating solid operational stability, although operating expenses surged by 19%. The bank's privatization, through the sale to Fairfax, aims to enhance performance and profitability.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "18 Oct 2026, 09:52 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "A Private Romance, A Reported Greece Wedding: What We Know About Anirudh And Kavya Maran", "full_content": "Speculation gathered pace in 2025 after a Reddit post claimed that Anirudh and Kavya had been dating for more than a year and that their families were discussing marriage.", "source": "NDTV Profit", "pub_date_str": "18 Oct 2026, 09:45 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "NextTrip earnings missed by $0.11, revenue fell short of estimates", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Oct 2026, 09:40 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "8th Pay Commission: What is the difference between basic pay, grade pay and pay level? Expert explains", "full_content": "The 8th Pay Commission is gearing up for its Mumbai meeting on October 22 and 23, right after Dussehra. This is the second key meeting to be held in October 2026, following the recently concluded meeting in Bengaluru on 8 October.\n\nIn these meetings held across the country over the last few months, eligible employee unions and associations have tabled their views, grievances, and aspirations on core aspects such as basic pay, grade pay, and pay levels. Along with fitment factors, pension reforms and associated aspects.\n\nNow, it is vital for serving central government employees, associated stakeholders and pensioners to clearly acknowledge that each of the terms discussed above has a distinct meaning and role in determining an employee\u2019s salary. Having a clear understanding of these terms is particularly significant as employees await the 8th Pay Commission's recommendations on revised pay and pensions.\n\nFor example, the prominent employee union, i.e., the Staff Side of the National Council (Joint Consultative Machinery) (NC-JCM), has requested that the 8th Pay Commission panel provide employees with a minimum basic pay of \u20b9 69,000. This has been requested on a fitment factor of 3.833.\n\nIn the 6th and the 7th pay commissions, the officially approved fitment factors were 1.86 and 2.57, respectively. This time, the unions are pushing for a higher multiplier to ensure that serving central government employees and pensioners can meaningfully combat rising inflation. With these basics in mind, let us discuss the fundamental differences among basic pay , grade pay, and pay levels.\n\nBasic pay is the core component of an employee\u2019s salary, excluding allowances such as Dearness Allowance (DA) and House Rent Allowance (HRA). These allowances are generally calculated using basic pay as the reference.", "source": "LiveMint Money", "pub_date_str": "18 Oct 2026, 09:27 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Mutual funds\u2019 portfolio shifts: Aditya Infotech, BSE stand out among top 10 stocks by holding value changes in September", "full_content": "If you invest in mutual funds , it is worth tracking which stocks fund managers are buying and selling, as these changes can offer insights into how their portfolios are shifting.\n\nIn September 2026, mutual funds increased the value of their holdings in stocks such as BSE, HDFC Bank, Coal India, Meesho, and Gland Pharma, according to the latest Fund Folio \u2013 Indian Mutual Fund Tracker report by Motilal Oswal Financial Services.\n\nHowever, a rise in the value of a mutual fund's holdings does not necessarily mean fund managers bought more shares. The change can reflect fresh purchases, changes in share prices, or a combination of both.\n\nComparing changes in holding value with changes in shareholding quantity offers investors a clearer picture of where mutual funds increased their exposure.\n\nAditya Infotech recorded the highest growth in holding value among the top 10 stocks, at 35.6%, while BSE led in the percentage increase in shareholding quantity, at 34.6%.\n\n*Source: Motilal Oswal Financial Services\u2019 Fund Folio: Indian Mutual Fund Tracker; September 2026 activity; Holding values and share quantities are as of September 2026; month-on-month changes compare September with August 2026; Figures have been converted from billion to crore and million to lakh, respectively.\n\nBSE saw a 26.8% increase in the value of mutual funds' holdings to \u20b9 20,060 crore. The quantity of shares held rose 34.6%, while the stock's price declined 5.8% during the month. This indicates that the increase in holding value was driven by a higher number of shares held, rather than a rise in the stock price.\n\nAditya Infotech also recorded a substantial increase in holding value, up 35.6% to \u20b9 6,070 crore. Its shareholding quantity rose 25.7%, while its stock price gained 7.5%. Both the increase in shareholding and price appreciation contributed to the higher portfolio value.", "source": "LiveMint Money", "pub_date_str": "18 Oct 2026, 09:13 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Axis Bank Vs HDFC Bank Vs ICICI Bank Q2 Results: Who Led On Profit, Margins And Bad Loans?", "full_content": "Among the three lenders, ICICI Bank fared strongly on the core income front, with its net interest income (NII) rising 17.7% year-on-year to Rs25,339 crore.", "source": "NDTV Profit", "pub_date_str": "18 Oct 2026, 09:05 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "ICICI Bank vs HDFC Bank vs Axis Bank: Which stock to buy, sell or hold after Q2 results?", "full_content": "India\u2019s three largest private-sector lenders delivered a mixed performance in the September quarter of FY27, with ICICI Bank reporting strong earnings growth, HDFC Bank navigating margin pressures and a leadership transition, and Axis Bank posting a sharp rise in profit alongside improving asset quality.\n\nBrokerages remain positive on all three stocks, with Nuvama Institutional Equities retaining a \u2018Buy\u2019 rating on each. However, differences in credit growth, profitability and margin trends could influence investors\u2019 choices.\n\nICICI Bank reported a 20.1% year-on-year rise in standalone net profit to \u20b9 14,843 crore in Q2 FY27. Net interest income (NII) increased 17.7% to \u20b9 25,339 crore, supported by strong loan growth, while net interest margin (NIM) declined 12 basis points sequentially to 4.18%.\n\nNuvama Institutional Equities retained its \u2018Buy\u2019 rating on ICICI Bank with a target price of \u20b9 1,850. The brokerage highlighted credit growth of 30% year-on-year and 12% quarter-on-quarter, which remained strong even after excluding foreign currency non-resident (FCNR) deposits. Lower operating expenses and provisions helped the bank deliver a 7% profit beat against Nuvama\u2019s estimates.\n\nNuvama expects strong growth to continue, with margins recovering from Q3 FY27. It sees ICICI Bank delivering return on assets (RoA) of 2.2\u20132.3% and return on equity (RoE) of around 17% over FY27\u2013FY29, making it the brokerage\u2019s preferred pick among large private sector banks.\n\nSystematix Institutional Research also maintained its \u2018Buy\u2019 rating and raised its target price to \u20b9 1,750 from \u20b9 1,700. It said the bank\u2019s September-quarter profit of \u20b9 14,843 crore exceeded its estimates by 3.3%, while domestic NIM, excluding the tax refund impact, remained broadly stable at 4.32%.\n\nHDFC Bank reported a 4.7% year-on-year rise in standalone net profit to \u20b9 19,510 crore, while NIM on earning assets declined eight basis points sequentially to 3.32%.", "source": "LiveMint Markets", "pub_date_str": "18 Oct 2026, 08:47 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "'India an important ally': Rubio says Trump weighing impact of Russia-related tariffs", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a 'India an important ally': Rubio says Trump weighing impact of Russia-related tariffs The Economic Times daily newspaper is available online now. Read Today's Paper 'India an important ally': Rubio says Trump weighing impact of Russia-related tariffs SECTIONS 'India an important ally': Rubio says Trump weighing impact of Russia-related tariffs ET Online Last Updated: Oct 18, 2026, 11:12:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis US Secretary of State Marco Rubio stated that India's energy requirements will be considered before possible sanctions on Russian oil. President Donald Trump recently waived certain provisions of a proposed sanctions law affecting major importers of Russian crude. Rubio emphasized the need for time to assess the impact of these measures on global economies. He highlighted the strategic partnership with India as an important factor in decision-making.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\nBusiness of Odd Things: Inside an industry that farms fish that nobody is meant to eat\n\nWar's second-order effects are becoming visible in critical sectors\n\nUS mid-term elections \u2013 Part 2: What does it mean for Trump to lose control of Congress?\n\nHomebuyers wait as NCLT panel picks holes in unfinished Jaypee projects\n\nWhat is the real impact of 13x jump in cash transfers to women?\n\nAirlines Q2 turbulence: Fewer passengers, rising fares and a crude shock", "source": "Economic Times Economy", "pub_date_str": "18 Oct 2026, 08:44 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "8th Pay Commission: How salaries change at fitment factors of 4, 3.833 and 3.80; Check complete calculations", "full_content": "The 8th Pay Commission recently successfully concluded its Bengaluru meeting on 8 October. Now the commission is gearing up for its key consultative meeting in Mumbai starting on 22 October. The commission is currently primarily focused on reviewing proposed changes to the salaries, allowances, fitment factors, and pensions of central government employees and pensioners.\n\nOne of the most important issues under consideration of the 8th Pay Commission is the fitment factor. In earlier commissions, the multiplier was 1.86 and 2.57 for the 6th and 7th Pay Commissions, respectively. This is a very important metric as it is used to calculate the revised basic pay from the existing basic salary.\n\nThe 8th Pay Commission, chaired by former Supreme Court Justice Ranjana Prakash Desai, is currently consulting employee unions, pensioner associations, and other stakeholders before making its recommendations. The final report of the 3-member panel is due within 18 months of its constitution on 3 November 2025. This puts the expected deadline tentatively around May-June 2027.\n\nThe fitment factor is a multiplier used to calculate revised basic pay under a new pay commission. The formula is:\n\nUnder the 7th Pay Commission, a fitment factor of 2.57 was applied to the existing basic pay. For instance, the minimum basic pay rose from \u20b9 7,000 to \u20b9 18,000, with the calculation rounded to \u20b9 18,000.\n\nThe fitment factor recommended by the 8th Pay Commission has not yet been finalised. The final salary structure will depend on the commission's recommendations and the Centre's approval and adoption, depending on fiscal constraints and economic considerations.\n\nDifferent employee and pensioner organisations have proposed different fitment factors for the 8th Pay Commission. These have been done while giving due consideration to rising inflation and the challenges faced by central government employees and pensioners.", "source": "LiveMint Money", "pub_date_str": "18 Oct 2026, 08:19 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "SC Ruling On AT-1 Bonds Flips Yes Bank's Q2 Profit Into A Potential Rs 5,217 Crore Loss", "full_content": "The Supreme Court on Thursday upheld the Bombay High Court's January 2023 judgment quashing the write-down and dismissed appeals filed by Yes Bank, the Reserve Bank of India (RBI) and the Centre.", "source": "NDTV Profit", "pub_date_str": "18 Oct 2026, 08:03 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "DA news: Assam, West Bengal, Telangana, Sikkim, Kerala \u2014 Check full list of states with dearness allowance hikes in 2026", "full_content": "In line with the 7th Central Pay Commission (CPC) recommendations, the government hikes dearness allowance (DA) biannually using data from the All-India Consumer Price Index ( AICPI ). Over 1 crore beneficiaries, comprising about 50 lakh central government employees and nearly 65 lakh pensioners, including defence and railway personnel and retirees, gain from DA and Dearness Relief (DR) hikes.\n\nDA is a percentage of employees ' basic pay that aims to mitigate the impact of the rising cost of living and inflation. Notably, announcements from the Centre come in March and October, with rollouts in January and July. The last hike was announced in April this year, when the Finance Ministry increased DA from 58% to 60% of basic salary, effective from 1 January 2026.\n\nMeanwhile, DA revision is also under discussion by the 8th CPC , which is expected to submit its final recommendations around 18 months after its constitution, by May 2027 at the latest.\n\nFollowing the Finance Ministry's announcement, the Indian Banks' Association ( IBA ) announced revised DA and DR for workmen and officer employees across levels for the months of May, June and July 2026. It hiked basic salaries between \u20b9 48,000 and \u20b9 1,17,000 and DA from \u20b9 435 to \u20b9 1,050.", "source": "LiveMint Money", "pub_date_str": "18 Oct 2026, 07:55 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Keralam DA, DR hike: Government raises rates from 35% to 37%; here's when the payments will begin", "full_content": "The government of Keralam has increased Dearness Allowance (DA) for state government employees and Dearness Relief (DR) for pensioners by two percentage points. Thus raising the rates from 35% to 37%.\n\nThis step is going to provide much-needed relief to serving government employees and pensioners, amid soaring inflation. Furthermore, the revised DA will be paid with the October 2026 salary, disbursed in November, whereas pensioners will receive the enhanced DR with their November pension.\n\nThe detailed notification on the same was issued by the Finance Department on October 17. The hike primarily covers state government employees, teachers, full-time contingent employees and local government staff. It also includes state service pensioners, family pensioners , and eligible ex-gratia pensioners and their families.\n\nThe staff of aided schools, private colleges and polytechnics are also covered under the applicable provisions. Employees and pensioners of public sector establishments, statutory corporations, autonomous bodies, boards, and grant-in-aid institutions, following the states' DA/DR pattern, will also be considered, subject to certain specific conditions. All organisations following separate DA/DR orders will continue under their existing procedures.\n\nThe government will undertake the task of issuing separate orders on arrears with effect from January 1, 2026. The latest revision follows an earlier increase in DA and DR from 25% to 35% in February 2026.\n\nIt is vital to keep in mind that, in a separate order, DA for eligible teaching staff covered by UGC, AICTE and Medical Education schemes and drawing revised pay scales has increased from 58% to 60%.\n\nFurthermore, for those continuing in the sixth revised pay scale, the rate has risen from 257% to 262%.", "source": "LiveMint Money", "pub_date_str": "18 Oct 2026, 07:09 AM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Gold on Dhanteras: celebrate the ritual, rethink the investment", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nEvery year during the Diwali season, as Dhanteras comes around, people who have never bothered to invest in a planned way step out to buy gold on the same day. Jewellers stay open late, queues form at shop entrances, and almost the entire nation performs in unison what many believe is an act of investment.\n\nI\u2019ll be careful here, because this column is about money, not culture. The Diwali season is wonderful, and Dhanteras is one of its best parts. The lamps, the cleaning of homes, the sense of a fresh beginning, the gathering of families. None of this needs improving, least of all by me. If your family welcomes prosperity by buying a little gold, buy it with all your heart. The ritual is not the problem. The problem begins when we mistake the ritual for a financial decision.\n\nLook at what is actually bought that day. For most families, it is jewellery, bought with a hefty markup in the form of \u2018making charges\u2019 that vanish into thin air as soon as you leave the shop, or coins that spend years in a bank locker that costs money to rent. Whatever else this activity may be, it will not build wealth. It is consumption, often very enjoyable consumption, but it does not become investment simply because the day is auspicious.\n\nSo examine the behaviour itself. No other investment is made this way. No one wakes up on a specific day to buy mutual funds or stocks. Yet, with gold, crores of people buy on a particular date. Tell someone you plan to buy a stock on a specific day because it is auspicious, and they will tell you that you are not investing at all. The festival simply hides this absurdity under a warm glow, making behaviour we would laugh at anywhere else feel acceptable.\n\nThe tradition of holding ornaments as wealth has obvious historical roots and, let\u2019s be honest, remains relevant today, though as collateral rather than as savings.", "source": "LiveMint Money", "pub_date_str": "18 Oct 2026, 07:01 AM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Insurance reforms: Why claims matter more than distribution costs", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nThe debate over the Insurance Regulatory and Development Authority of India\u2019s (Irdai) proposed distribution reforms has centred on whether the changes could push agents and point-of-sales persons (POSPs) out of the business, hurting insurance penetration and post-sales services. But for policyholders, a more immediate question is whether their insurer will pay a valid claim, and whether they can get a fair hearing when it does.\n\nThe numbers suggest there is considerable room for improvement. Health insurance complaints to the Insurance Ombudsman rose 263% over five years, from fiscal year 2021 (FY21) to FY25. Life insurance complaints declined 5% over the same period, though they rose 15% between FY24 and FY25. The nature of the grievances is equally telling: partial or total claim repudiation accounted for 96% of health insurance complaints, while misrepresentation of policy terms accounted for 59% of life insurance complaints.\n\n\u201cLife insurance complaints may have declined partly because mis-selling, such as traditional policies being sold as fixed deposits, often comes to light only after two or three years,\" said Shilpa Arora, co-founder and chief operating officer, Insurance Samadhan. \"While complaints can be filed with the Insurance Ombudsman within a year of the insurer rejecting them, such cases are increasingly being rejected because the policy was bought much earlier. Policyholders often discover mis-selling only when the second or third premium falls due. They have nowhere to go.\u201d\n\nThe numbers suggest there is considerable room for improvement. Health insurance complaints to the Insurance Ombudsman rose 263% over five years, from fiscal year 2021 (FY21) to FY25. Life insurance complaints declined 5% over the same period, though they rose 15% between FY24 and FY25.", "source": "LiveMint Money", "pub_date_str": "18 Oct 2026, 07:00 AM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Top 3 stocks to buy under \u20b9100: IRFC, Motherson Sumi, Lloyds Engineering Works by Sumeet Bagadia | Target price, SL", "full_content": "Stock market outlook: Sumeet Bagadia of Choice Broking believes the Indian stock market bias has improved and buying at lower levels is visible", "source": "LiveMint Markets", "pub_date_str": "18 Oct 2026, 06:30 AM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Listings in south-east Asia gain momentum with $1bn IPO", "full_content": "Owner of digital wallet GCash set to start trading in     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
