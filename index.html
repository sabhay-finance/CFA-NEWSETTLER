<script>

    const allData = {"general": [{"title": "Sebi to issue norms on closing auction soon: Sebi chief", "full_content": "The market regulator will issue new guidelines for price settlement in the derivatives segment during the closing auction session in about a week, said the Securities and Exchange Board of India (Sebi) chairman, Tuhin Kanta Pandey, on Saturday.\n\n\u201cFollowing review of the Closing Auction Session (CAS), a consultation paper was put out to address concerns in respect of the settlement price of derivatives on expiry day. We are currently examining the comments and hope to issue guidelines in about a week\u2019s time,\u201d Pandey said at a BSE Broker\u2019s Forum event.\n\nCAS was introduced on 3 August to determine closing prices for select futures and options (F&O) stocks in India, replacing the previously used volume-weighted average price (VWAP) mechanism.\n\nHowever, the framework ran into several issues just a month into its operations, attracting backlash from market participants. One of the major concerns was abrupt price swings and uncertainty on expiry days in the derivatives market.\n\nIn response, the market regulator issued a consultation paper to review the settlement methodology for derivatives contracts.\n\nSebi suggested that expiry-day settlement prices for index and stock derivatives could be calculated using trades from the last 30 minutes of the continuous trading session (CTS) and the last 10 minutes of the closing auction session, under a blended volume-weighted average price approach.\n\nAs an alternative, the regulator has initially proposed retaining the existing VWAP methodology, with settlement based only on trades in the final 30 minutes of continuous trading, before potentially shifting to the blended approach after at least a year of experience with CAS.\n\nSebi has also proposed stopping the dissemination of the indicative index value (IIV) during CAS while continuing to provide indicative equilibrium prices (IEPs) for individual securities.", "source": "LiveMint Markets", "pub_date_str": "10 Oct 2026, 07:22 PM IST", "pub_date_relative": "2m ago"}, {"title": "Putin relayed Iran war proposal to Trump, Kremlin says", "full_content": "Russian President Vladimir Putin conveyed Tehran's vision for a possible end to the war in Iran to U.S. President Donald Trump , Russian state media reported Saturday.\n\nThe report comes a day after Trump said Russia will supply diesel to the global market amid a surge in energy prices caused by the wars in Iran and Ukraine.\n\nRussia's Interfax news agency quoted Kremlin spokesman Dmitry Peskov as saying Putin sent the message to Trump \"in agreement with Iranian President Masoud Pezeshkian,\" according to a Google translation.\n\nOther Russian media reports said Putin spoke to Trump by phone after the Russian leader met Pezeshkian on the sidelines of a summit in Turkmenistan.\n\nInterfax didn't elaborate on the specifics of how Iran sees the war \u2014 which began on Feb. 28 with U.S. and Israeli airstrikes on Iranian targets \u2014 coming to an end.\n\nThe White House didn't immediately respond to CNBC's emailed request to confirm the reported conversation between Putin and Trump.\n\nTrump said Friday that Russia will supply more than 4 million tons of diesel to the global market under an arrangement the U.S. president said he agreed with Putin during a phone call.\n\nRussia will immediately supply more than 300,000 tons of diesel, followed by 500,000 tons in November, and 1 million tons immediately thereafter, Trump said in a post on Truth Social . Moscow will then deliver another 3 million tons of diesel based on the condition of Russia's refineries, Trump said.", "source": "CNBC Top News", "pub_date_str": "10 Oct 2026, 07:12 PM IST", "pub_date_relative": "12m ago"}, {"title": "TCS senior employees miss quarterly variable pay as AI revenue rises nearly 20%; juniors get full payouts", "full_content": "Senior employees at Tata Consultancy Services (TCS) will not receive quarterly bonuses after the I-T giant failed to meet performance targets, Reuters reported citing an internal memo. This is the first time in at least two years all variable pay was withheld for some workers, it added.\n\n\"This decision was taken after careful consideration as our performance for the quarter fell short of internal targets,\u201d said chief human resource officer Sudeep Kunnumal in the memo.\n\nEmployees told Reuters the tech company usually gives 50-100% of variable pay . It cited them say that this is the first time in at least two years that the company has explicitly said no bonuses shall be awarded.\n\nNotably, TCS reported its weakest September-quarter sequential revenue growth \u200cin three years, signaling continued pressure on traditional IT services demand even as artificial intelligence ( AI )-related revenue jumped nearly 20%, the report said.\n\nThe uptick in AI revenue, however, was cheered by investors on Friday, 9 October, as the stock rose as much as 6.2%.\n\nIndia's $315 billion IT sector is also facing uncertainty after United States President Donald Trump 's administration suspended major IT outsourcers including TCS, Infosys, and HCLTech among others from a key green-card program on Thursday, 9 October, widening a crackdown it says targets fraud and protects American\u200c jobs.\n\nTCS on Friday reported a 15% jump in July-September quarter net profit to \u20b9 13,884 crore and pointed to continued growth momentum going forward, as per a PTI report.\n\nTCS posted a net profit of \u20b9 12,075 crore in the year-ago period and \u20b9 13,349 crore in the preceding June quarter. The company said its revenue from operations rose 11.22% to \u20b9 73,188 crore in the July-September period from \u20b9 65,799 crore in the year-ago period. In the June quarter, its topline stood at \u20b9 72,275 crore.", "source": "LiveMint Money", "pub_date_str": "10 Oct 2026, 07:08 PM IST", "pub_date_relative": "17m ago"}, {"title": "France\u2019s bond stress may remain contained as wider European risks stay limited", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Oct 2026, 07:01 PM IST", "pub_date_relative": "23m ago"}, {"title": "Spanish lawyer Gonzalez Durantez launches centrist party for November election", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Oct 2026, 07:00 PM IST", "pub_date_relative": "24m ago"}, {"title": "Pok\u00e9mon card values are soaring. What collectors should know before buying or selling", "full_content": "In 2022, a rare Topps 1952 Mickey Mantle baseball card \u2014 one of sports-card collectors' holiest grails \u2014 sold for $12.6 million. Wow, you say, that's a lot of dough for a thin piece of cardboard, slab of bubblegum not included.\n\nWell, what do you say about a 1998 Pikachu Illustrator Pok\u00e9mon card going for $16.5 million earlier this year? If you're pro wrestler and social media influencer Logan Paul, seller of the item, you say, Not a bad return on the $5.3 million (plus a trade) I paid for it in 2021.\n\nThose are extreme examples, but a vivid illustration of how TCGs \u2014 shorthand for competitive trading card games, led by Pok\u00e9mon, Magic: The Gathering and Yu-Gi-Oh! \u2014 are encroaching on an over-saturated sports-card market as an enticing investment opportunity. Throw in vintage and modern-day non-sports trading cards, depicting historical events and fictional characters ranging from the Civil War to Luke Skywalker, and it's a whole new ballgame.\n\nThe record $16.5 million Pok\u00e9mon card sale is drawing fresh attention to a collectibles market where grading, scarcity and authentication can determine whether a card is worth dollars or hundreds of thousands.\n\n\"It is one of our fastest-growing categories that we've seen and one of the largest contributors to [our] growth over the last number of quarters,\" said Adam Ireland, vice president and general manager of collectibles at online marketplace eBay , which also provides authentication and price guides for TCGs and non-sports cards. \"From an investment point of view, you start with Pok\u00e9mon,\" he said. \"It was the most searchable term within the eBay collectibles environment through the first half of the year.\"\n\nHeritage Auctions, which deals in art, jewelry, coins and many other collectibles, launched a dedicated TCG department six years ago. \"Now it's a $50-million category,\" said executive vice president Joe Maddalena. \"That's just TCGs.", "source": "CNBC Top News", "pub_date_str": "10 Oct 2026, 07:00 PM IST", "pub_date_relative": "25m ago"}, {"title": "Flu season is already here. Here\u2019s what to know about this year\u2019s flu shots.", "full_content": "This year\u2019s flu season has arrived about seven weeks earlier than in 2025 or 2024.", "source": "MarketWatch Top Stories", "pub_date_str": "10 Oct 2026, 06:49 PM IST", "pub_date_relative": "36m ago"}, {"title": "Neither Putin nor Trump wanted to hang up first, Kremlin aide says after \u2019very friendly\u2019 call", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Oct 2026, 06:48 PM IST", "pub_date_relative": "36m ago"}, {"title": "\u2018People in the U.S. need to wake up\u2019: As a mortgage loan officer, I rejected applications from wealthy couples. Here\u2019s why.", "full_content": "\u201cPeople in the U.S. need to wake up.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "10 Oct 2026, 06:45 PM IST", "pub_date_relative": "40m ago"}, {"title": "\u2018The pain was excruciating\u2019: A friend in her 80s fell down her basement stairs. What could we have done to prevent it?", "full_content": "\u201cShe developed pleural effusion \u2014 fluid between the lungs and ribs \u2014 compressing her lungs and making it hard for her to breathe.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "10 Oct 2026, 06:45 PM IST", "pub_date_relative": "40m ago"}, {"title": "I work hard to stay close to my friends. A researcher says it\u2019s good for my well-being\u2014and these 3 habits can help", "full_content": "Not to brag, but without realizing it, I've become a model friend \u2014 someone my loved ones admire for how well I maintain my relationships . At least, so they tell me.\n\nLast month, my closest friend asked me for pointers on how to stay connected to her community while balancing work, well-being and everything else in her life. It's no easy feat. Loneliness levels in the U.S. are high, and instead of turning to each other, many people reach for their tech devices , found an American Psychiatric Association poll published on May 12. Eight percent of Americans report having zero close friends, according to a 2023 Pew Research Center survey of about 5,000 U.S. adults.\n\nSome businesses now offer to facilitate the friendship process, offering summer camps for adults or guidance from friendship coaches that can sometimes cost thousands of dollars. And when you do form friendships, you could grow apart for a number of reasons, says Jessica D. Ayers , an assistant professor of psychological science at Boise State University: classic ones like moving to a different state for a new job or being in different stages of life, or newer ones like trying to keep up with each other on social media and forgetting to keep in touch outside of your smartphones.\n\nEspecially if your friends have busy lives or don't often reach out to make plans, putting in the work to stay in touch may seem like a fundamentally selfless gesture. In fact, making the effort to maintain friendships can benefit you too, says Ayers, who researches the science of friendship and how to maintain connections.", "source": "CNBC Top News", "pub_date_str": "10 Oct 2026, 06:35 PM IST", "pub_date_relative": "50m ago"}, {"title": "How Supreme Court justices are leaning in major 401(k) case over private funds and underperformance", "full_content": "The Supreme Court heard a major case this week concerning an Intel retirement plan which could result in a decision that influences employers' appetite for private investments in 401(k)s.\n\nMany plan sponsors are in limbo, awaiting the Supreme Court decision and finalized Labor Department rules covering alternative investments before changing their 401(k) menu, even as the asset management industry is gearing up with new products.\n\n\"I think companies want to know what's going to happen with the proposal and what's going to happen with the Supreme Court case before they go rushing in to change their investment strategies,\" said Elizabeth Hopkins, principal at Hopkins ERISA Law and a former senior trial attorney with the Labor Department, who filed an amicus brief in the Supreme Court case on behalf of former high-ranking DOL officials.\n\nHere's what employers and employees need to know about forces influencing the market for private investments in 401(k) plans.\n\nEmployers have been whipsawed for the past several years by changing government policies on alternative investments in 401(k) plans and a high-profile lawsuit filed in 2019 by a former Intel employee. That case, Anderson v. Intel Corp. Investment Policy Committee, which the Supreme Court heard oral arguments on Tuesday, Oct. 6, concerns private investments in a defined contribution plan like a 401(k) and the circumstances under which these investments are appropriate.\n\nThe case is not challenging whether alternative assets like hedge funds and private equity can be used in a 401(k) plan alongside stocks and bonds. Rather, the question before the court is whether a retirement plan underperformance claim requires alleging a \"meaningful benchmark.\" The heart of the dispute is how to handle claims by employees that plan sponsors have invested their retirement funds imprudently.\n\nEmployees contend that the relatively low returns on Intel's plans reflect a breach of fiduciary duty. The lower courts disagreed.", "source": "CNBC Top News", "pub_date_str": "10 Oct 2026, 06:30 PM IST", "pub_date_relative": "55m ago"}, {"title": "Winter is coming and energy bills are climbing. \u2018Everything just keeps going up.\u2019", "full_content": "Expensive utility bills have become an increasingly sharp thorn for Americans\u2019 wallets, but warmer weather this winter and energy assistance programs can help.", "source": "MarketWatch Top Stories", "pub_date_str": "10 Oct 2026, 06:30 PM IST", "pub_date_relative": "55m ago"}, {"title": "5 personal finance lessons from international bestseller \u2018Die with Zero\u2019 by Bill Perkins", "full_content": "Most of us learn to save as much money as possible. Bill Perkins offers a different view in \u2018Die with Zero\u2019. The American hedge fund manager says money should help us enjoy meaningful experiences. A large bank balance at death can mean missed chances to live fully.\n\nA bigger bank balance should not become your only goal. Perkins says money should support a full and happy life. Think about the experiences you want, then spend time with that purpose.\n\nHe also questions working for too many years. Extra earnings may buy things you do not need. You cannot get those years of your life back.\n\nGood experiences keep giving you happiness through memories. Bill Perkins calls these benefits \u201cmemory dividends\u201d. A family holiday or concert can leave stories you share for years. Such memories can also bring you closer to loved ones.\n\nAn experience enjoyed earlier gives you more years to remember it. Perkins encourages readers to build memories while they can enjoy them. Think about a trip that still makes you smile today.\n\nSome activities are easier at certain stages of life. Trekking, for example, is easier at thirty than at eighty. Health and energy can decline as you grow older.\n\nPerkins suggests listing things you want to do. Then, place them into suitable age groups, or \u201ctime buckets\u201d.\n\nThis helps you avoid delaying experiences until they become difficult. Looking after your health also keeps more choices open for longer.", "source": "LiveMint Money", "pub_date_str": "10 Oct 2026, 06:25 PM IST", "pub_date_relative": "59m ago"}, {"title": "This Bihar Man Earns Rs 80,000 From Rent. He Still Drives Uber 12 Hours A Day", "full_content": "He was earlier working at a relative\u2019s factory in Delhi, receiving a decent income, but was forced out of his job after suffering from a heart attack last year.", "source": "NDTV Profit", "pub_date_str": "10 Oct 2026, 06:25 PM IST", "pub_date_relative": "59m ago"}, {"title": "India-EU FTA 'An Absolute Game Changer': EU Envoy On Trade Deal, Defence Ties", "full_content": "EU Ambassador Jean-Eric Paquet said India and the European Union aim to conclude their free trade agreement by the end of 2026 and bring it into force in 2027. An investment protection pact is also under negotiation.", "source": "NDTV Profit", "pub_date_str": "10 Oct 2026, 06:23 PM IST", "pub_date_relative": "1h ago"}, {"title": "Ramayana New Posters: Lara Dutta As Kaikeyi, Sheeba Chadha As Manthara Revealed", "full_content": "Directed by Nitesh Tiwari, Ramayana Part 1 is scheduled for a worldwide release on Diwali 2026 in Hindi, Tamil, Telugu, Kannada and Malayalam.", "source": "NDTV Profit", "pub_date_str": "10 Oct 2026, 06:22 PM IST", "pub_date_relative": "1h ago"}, {"title": "China drafts rules to ban hidden car handles, virtual controls", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Oct 2026, 06:17 PM IST", "pub_date_relative": "1h ago"}, {"title": "Isaias brings flood, tornado threats, power outages across U.S. Southeast after Florida landfall", "full_content": "Isaias is expected to bring storm surges, flash flooding, damaging winds and a risk of tornadoes across parts of the US Southeast on Saturday, even as the storm weakens after making landfall in Florida, the National Hurricane Center said.\n\nThe center warned of considerable impacts across much of southern Alabama, the Florida Panhandle, and southwest Georgia.\n\nThe NHC said the tornado threat will continue on Saturday across parts of the Florida Panhandle, Georgia, and the Carolinas.\n\nIsaias weakened to a post-tropical cyclone on Saturday after rapidly losing wind speed after hitting the Florida coast as a Category 2 hurricane, the first of the 2026 Atlantic season, the NHC said in its latest advisory.\n\nIsaias is expected to continue weakening but produce gusty winds well inland before weakening below gale force later on Saturday, the NHC said.\n\nAlabama's emergency management agency said the hurricane has downed trees and power lines, making travel hazardous in Houston County, which is under a flash flood warning.\n\n\"Due to the impacts of Hurricane Isaias, all Houston County roads are closed until further notice,\" it posted on X. \"These road closures will remain in effect until conditions are deemed safe for travel.\"\n\nAsked about hurricane preparations, President Donald Trump told reporters outside the White House, \"We're watching it very closely, the hurricane,\" adding that it was \"under control.\"", "source": "CNBC Top News", "pub_date_str": "10 Oct 2026, 06:11 PM IST", "pub_date_relative": "1h ago"}, {"title": "TCS Withholds Quarterly Bonus For Senior Staff; Junior Employees To Get Full Payout: Report", "full_content": "TCS has withheld quarterly variable pay for employees in C3A grades and above after missing internal performance targets, while junior staff will receive 100% of their eligible payout.", "source": "NDTV Profit", "pub_date_str": "10 Oct 2026, 06:09 PM IST", "pub_date_relative": "1h ago"}, {"title": "BJP Slams Rahul Gandhi, Congress Amid CJP Protest Crackdown In Delhi: 'India Is Not A Banana Republic\u2019", "full_content": "The BJP defended the Election Commission and SIR exercise as Ravi Shankar Prasad criticised Rahul Gandhi and Congress over protests demanding Chief Election Commissioner Gyanesh Kumar's resignation.", "source": "NDTV Profit", "pub_date_str": "10 Oct 2026, 06:05 PM IST", "pub_date_relative": "1h ago"}, {"title": "Pay Commission: Meghalaya to constitute, notify 6th Pay Commission soon, says CM \u2014 What we know", "full_content": "Meghalaya plans to constitute its Sixth Pay Commission to discuss and suggest recommendations to pay structure, allowances, benefits and other services for state government employees and pensioners \u201csoon\u201d, according to a report by The Shillong Times.\n\nAccording to Meghalaya Chief Minister Conrad K Sangma this week, a formal notification on the same is expected within two weeks, i.e. in the second half of October 2026. He added that preliminary discussions on its composition of the commission had already begun, noting that the constitution process has begun.\n\n\u201cWe are very happy to inform everyone that we have finally decided and the Sixth Pay Commission Committee will be constituted. The process has started,\u201d Sangma said, adding that the state government is likely to formally announce the chairman and members \u201cwithin a week or two\u201d, the report added.\n\n\u201cI expect that within maybe a week or couple of weeks, we should be able to formally announce the chairman of the committee as well as the members. We have already had the preliminary discussion. it\u2019s only a matter of procedure,\u201d he added.\n\nAll matters related to government employees' allowances , pay, and service conditions are looked after by the Finance Department\u2019s Pay Revision branch, the report added.\n\nEarlier in September, Andhra Pradesh Chief Minister N Chandrababu Naidu said the state will appoint the 12th Pay Revision Commission to address long-pending demands by government employees, PTI reported.\n\nSurya Narayana, state president of the Andhra Pradesh Government Employees Association told the news agency, pay revisions under the 12th Pay Revision Commission have been due to state employees from 1 July 2023.\n\nThe West Bengal government on 22 July officially constituted the state's 7th CPC and has appointed former government secretary and IAS officer Atanu Chakraborty as Chairperson of the panel, PTI reported.", "source": "LiveMint Money", "pub_date_str": "10 Oct 2026, 06:01 PM IST", "pub_date_relative": "1h ago"}, {"title": "India Champions Vs South Africa Champions Live Streaming: When And Where To Watch WCL 2026 Match", "full_content": "India Champions will look to return to winning ways after suffering a 21-run defeat against England Champions in their previous match.", "source": "NDTV Profit", "pub_date_str": "10 Oct 2026, 06:00 PM IST", "pub_date_relative": "1h ago"}, {"title": "Why Nvidia\u2019s stock is dodging the AI credit scare that is crushing Broadcom and Oracle", "full_content": "The P/E ratios have contracted and the CDS spreads have widened in all three cases, but Nvidia appears unscathed", "source": "MarketWatch Top Stories", "pub_date_str": "10 Oct 2026, 06:00 PM IST", "pub_date_relative": "1h ago"}, {"title": "Private vs PSU banks face off: SBI, PNB, Union vs HDFC, ICICI, Axis, AU - Which pack could outperform in Q2 2026 results", "full_content": "The corporate earnings season has begun and experts are bullish on banking sector, with some expecting robust business growth led by FCNR (B) inflows, improvement in net interest margins (NIMs) and profit. Public Sector Banks (PSBs) are likely to report resilient margins, but private players are expected to see adverse impact to NIMs, according to Motilal Oswal Financial Services which keeps ICICI, State Bank of India , Kotak Mahindra Bank , and AU Bank among its top picks.\n\nHDFC Bank is likely to see strong deposit growth aided by FCNR (B) deposits. NIMs are likely to improve marginally for Punjab National Bank (PNB). Union Bank of India may see modest increase in its credit cost and some improvement in asset quality. However, Axis Bank may see marginal decline in credit costs amid a reduction in technical slippage.\n\nPrivate banks are estimated to see a 24% annual growth in their profit after tax (PAT), whereas, PSU banks are expected to see a 27% annual growth in profit. Consider PAT, PSU bank stocks are likely to outperform in terms of profit growth.\n\n\u201cWe estimate PSU banks\u2019 PAT to grow 27% YoY (19% QoQ) in 2QFY27, supported by robust business growth, partly coupled with stake sale gains at SBI (SBI MF & NSE), BOB (NSE), and INBK (NSE), and normalization of BoB\u2019s PAT,\u201d read the Motilal Oswal report.\n\nHowever, net interest income (NII), which is the difference between interest a bank earns on loans (and investments) and interest paid on deposits and borrowings, presents a slightly different picture. Private banks\u2019 NII are estimated to see 13% annual growth, whereas PSBs may see 10.8% annual growth in the segment.\n\n\u201cAmong large private banks under our coverage, NII is estimated to grow by 8.9% YoY (up 2.5% QoQ) for HDFCB and 16.8% YoY (3.1% QoQ) for ICICIBC.", "source": "LiveMint Markets", "pub_date_str": "10 Oct 2026, 05:51 PM IST", "pub_date_relative": "1h ago"}, {"title": "Will rising French bond spreads disrupt the rally in European stocks?", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Oct 2026, 05:48 PM IST", "pub_date_relative": "1h ago"}, {"title": "LB Pharmaceuticals presents data on LB-102 at ECNP congress", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Oct 2026, 05:34 PM IST", "pub_date_relative": "1h ago"}, {"title": "Buffett's 'trips down YouTube rabbit hole' revealed", "full_content": "(This is the Warren Buffett Watch newsletter, news and analysis on all things Warren Buffett and Berkshire Hathaway. You can sign up here to receive it every Friday evening in your inbox.)\n\nWarren Buffett watches CNBC in the morning, but nearly every evening he \"can't get enough\" of watching YouTube clips while sitting on a recliner in front of an \"enormous\" television in his Omaha home.\n\nA Wall Street Journal article this week quotes friends as saying he's \"hardly ever\" looking at anything related to investing or finance, although he is a \"fan of Berkshire Hathaway's own content\" and \"proud of how it performs on the video platform.\"\n\nInstead, it's things like \"Glenn Close clips ... commercials from the 1950s ... Paul Anka videos ... speeches by complete unknowns ... show tunes, railroads, the big-band era, Nebraska and early Frank Sinatra performances from the 1930s.\"\n\nFor example, Buffett might \"come into his office, gushing about a moving amateur rendition of 'My Way.'\"\n\nSharon Osberg, the three-time world bridge champion who has taught Buffett and Bill Gates the finer points of the game , is also Buffett's \"frequent viewing companion,\" says the WSJ.\n\nShe reports \"Warren's range is broad. It can be the silliest things,\" like a \"really good documentary on Roy Cohn\" or \"the Uzbekistan version of America's got talent .\"\n\nOsberg says Buffett has also been watching clips featuring his late friend and business partner, Charlie Munger, including a 2017 appearance at the University of Michigan.", "source": "CNBC Top News", "pub_date_str": "10 Oct 2026, 05:31 PM IST", "pub_date_relative": "1h ago"}, {"title": "Hollywood takes on Zuckerberg, Musk and Altman amid widespread anxiety over AI", "full_content": "This weekend marks the kickoff of a slew of films centered on some of the biggest figures in technology and artificial intelligence , as public concern about the industry grows.\n\nSony Pictures' \" The Social Reckoning \" is expected to open to around $7 million domestically this weekend. The scripted film is a follow-up to Aaron Sorkin's \"The Social Network\" from 2010, which went on to win three Academy Awards. While Sorkin's first \"Social\" film focused on Meta CEO Mark Zuckerberg 's founding of the company, \"The Social Reckoning\" follows the 2021 leak by Facebook whistleblower Frances Haugen, who exposed internal documents from the tech giant.\n\n\"It brought back really warm memories for me,\" Haugen told CNBC recently about the film. \"And so I felt it captured the spirit of that time period.\"\n\nThe box office this weekend will also see a limited release of Alex Gibney's nearly four-hour Elon Musk documentary, called \"Musk.\" Early showings have drawn critical acclaim, but it's also been criticized by Musk himself on X, saying the film has zero integrity.\n\n\"You Can See Everything,\" the documentary about disgraced Theranos founder Elizabeth Holmes by Nathan Fielder and Lance Oppenheim via A24 Films, releases on Oct. 16.\n\nChristmas brings \"Artificial\" from Neon to theaters. The scripted film depicts OpenAI CEO Sam Altman and his brief firing from the role in 2023.\n\n\"It looks like an awful movie, but I appreciate people's creativity, and I really do support that,\" Altman recently told CNBC. \"I get why people have anxiety. And also if they need to, like, project that anxiety onto someone or have a little bit of relief and poke fun at me, it doesn't bother me.\"\n\nNetflix is also joining in. The streamer's latest installment of its \"Instadocs\" series will premiere on Monday, highlighting the Hugging Face incident, in which a swarm of OpenAI agents escaped a testing environment and autonomously hacked into the company's infrastructure.", "source": "CNBC World Economy", "pub_date_str": "10 Oct 2026, 05:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "From BJ\u2019s to Lululemon, retailers are trimming assortments to boost business", "full_content": "Retailers are trimming assortments in an effort to clean up their balance sheets.\n\nAs shoppers cut spending in the face of high gas and food prices, businesses have pulled more levers to boost profitability and appease investors. During earnings calls this year, a range of retailers have highlighted efforts to reduce the number of items they sell, commonly tracked as stock keeping units, or SKUs.\n\nIn March, Dollar General said it trimmed 1,500 SKUs. In August, Under Armour said it shrunk SKUs by 25% over the past few years and plans to cut another 25%, while BJ's Wholesale Club said it plans to reduce roughly 20% of SKUs . In September, Lululemon said it cut North America SKUs by 15%.\n\nTrimming inventory can help a business stabilize its sales or even get back to growth, and can reduce the chances a company gets stuck with unwanted inventory. But the move can also leave consumers with less choice \u2014 a trade-off many retailers have been willing to make.\n\nWhen a brand struggles to sell certain products, it can lead to discounting, which hurts profitability. Some markdowns are expected when businesses roll the dice on new products that don't end up selling well, but too many promotions can cause problems.\n\n\"If you have zero discounting, you're not taking enough fashion risk,\" said Guggenheim Securities senior retail analyst Simeon Siegel. \"But discounting needs to be fixing mistakes. It needs to be done quickly.\"\n\nUnder Armour and Lululemon are both facing repercussions from what investors see as too many markdowns.\n\nUnder Armour's operating income, which illustrates its underlying profitability, turned negative in fiscal 2025 and 2026. The company said its problems would not be solved by chasing unhealthy sales volume or short-term revenue.", "source": "CNBC Top News", "pub_date_str": "10 Oct 2026, 05:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "\u2018What you don\u2019t know is greater than anything you do know\u2019: How Ray Dalio would build a portfolio to withstand a popping AI bubble", "full_content": "Look for inflation protection and unappreciated players in artificial intelligence, says the famed hedge-fund founder.", "source": "MarketWatch Top Stories", "pub_date_str": "10 Oct 2026, 05:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "India\u2019s central bank tries to shore up rupee as it nears record lows", "full_content": "Rise in energy costs due to US-Israel war on Iran has put downward pressure on the currency of the world\u2019s fastest-growing major economy", "source": "FT Markets", "pub_date_str": "10 Oct 2026, 05:27 PM IST", "pub_date_relative": "1h ago"}, {"title": "Stocks were up this week. Here are the names that are now overbought", "full_content": "The energy sector was a winner this week, but some stocks are registering as overbought.", "source": "CNBC Top News", "pub_date_str": "10 Oct 2026, 05:27 PM IST", "pub_date_relative": "1h ago"}, {"title": "Indian stock markets snap 8-week losing streak - What\u2019s next for Sensex, Nifty? Triggers, strategy \u200bfor investors", "full_content": "Indian equity markets ended their eight-week losing streak, the longest in 25 years, after a volatile week in which benchmarks recovered on buying in information technology (IT), fast-moving consumer goods (FMCG), automobile and financial stocks. However, persistent foreign fund outflows, elevated crude oil prices, rising global bond yields and uncertainty over the monetary policy outlook continued to weigh on investor sentiment.\n\nFor the week, the BSE Sensex gained 562.63 points, or 0.78%, to close at 72,472.33, while the Nifty 50 advanced 98.5 points, or 0.43%, to settle at 22,520.45.\n\nThe recovery gathered momentum on Friday, October 9, when the Sensex surged 879.09 points, or 1.23%, to 72,472.33. The Nifty 50 climbed 288.65 points, or 1.30%, to end at 22,520.45, snapping the benchmarks' eight-week losing streak.\n\n\"Markets snapped an eight-week losing streak, posting modest weekly gains as easing crude oil prices and positive corporate updates supported a late-week recovery. However, volatility remained elevated following the RBI\u2019s decision to raise the repo rate by 25 basis points to 5.50% and shift its policy stance towards calibrated tightening,\" said Ajit Mishra, SVP \u2013 Research, Religare Broking.\n\nDespite the rebound, market participants will look for stronger follow-through buying to determine whether the recovery can extend into the coming week. Several domestic and global developments, including inflation data, corporate earnings, crude oil prices and foreign investor flows, are likely to influence the market's direction.\n\nInflation data from the US will be a key trigger for global equity markets next week.", "source": "LiveMint Markets", "pub_date_str": "10 Oct 2026, 05:26 PM IST", "pub_date_relative": "1h ago"}, {"title": "Bank of America is bullish on these top stocks ahead of earnings", "full_content": "Bank of America highlighted some of its best ideas heading into third-quarter earnings.", "source": "CNBC Top News", "pub_date_str": "10 Oct 2026, 05:25 PM IST", "pub_date_relative": "1h ago"}, {"title": "SBI, HCL Tech, Eicher Motors: Top 3 stock picks by Sumeet Bagadia | Target, stop-loss, Nifty, Bank Nifty outlook", "full_content": "Stocks to buy | Sumeet Bagadia's stock recommendations: The key benchmark indices of the Indian stock market staged a strong rebound on Friday, October 9, bringing an end to the Nifty 50 and Sensex\u2019s eight-week losing streak. The Nifty rose 1.30%, while the Sensex advanced 1.23%. Bank Nifty also recovered, gaining 1.36%. The rally was led by IT stocks following Tata Consultancy Services\u2019 September-quarter results, with buying extending to FMCG, auto and financial shares.\n\nThe macroeconomic backdrop remains challenging. Brent crude continued to trade above $100 a barrel, while WTI remained above $90. Comments from the US president on discussions with Iran offered some temporary relief, but tensions around the Strait of Hormuz and concerns over regional energy infrastructure have kept the risk of supply disruptions elevated. For India, persistently high oil prices pose risks to inflation, the import bill and the rupee.\n\nForeign investor selling remains a significant overhang. FIIs recorded net outflows of approximately \u20b9 39,779 crore in October so far, while domestic institutional investors (DIIs) bought around \u20b9 40,355 crore over the same period, broadly offsetting the foreign selling. Domestic institutional demand has provided an important cushion, absorbing much of the pressure from overseas investors and helping stabilise the market.\n\nSumeet Bagadia, Executive Director at Choice Broking, believes the Nifty 50 chart pattern is signalling improving short-term sentiment, although the broader structure remains weak below key moving averages. He said that PCR at 0.98 suggests a balanced derivatives setup, while India VIX eased to 14.375, reflecting reduced volatility. Sustaining the rebound and moving above resistance will be crucial for further improvement.\n\nOn the outlook for the Nifty 50 index, Sumeet Bagadia said, \u201cImmediate support is placed at 22,250\u201322,400, while 22,650\u201322,700 remains the key resistance zone.", "source": "LiveMint Markets", "pub_date_str": "10 Oct 2026, 05:21 PM IST", "pub_date_relative": "2h ago"}, {"title": "Jaishankar On India-Africa Ties: Trade, AI, Healthcare And Development Cooperation In Focus", "full_content": "Jaishankar has called for stronger India-Africa ties through trade, technology, healthcare and skills development, highlighting $100 billion in trade, development projects and the need for fairer representation of developing nations globally.", "source": "NDTV Profit", "pub_date_str": "10 Oct 2026, 05:20 PM IST", "pub_date_relative": "2h ago"}, {"title": "Dragon Ball Super: Beerus OTT India Release Date, Streaming \u2014 All You Need To Know", "full_content": "Produced by Toei Animation, Dragon Ball Super: Beerus will feature reconstructed and enhanced versions of three major story arcs from Dragon Ball Super: the God of Destruction Beerus Arc, the Resurrection 'F' Arc and the Universe 6 Arc.", "source": "NDTV Profit", "pub_date_str": "10 Oct 2026, 05:12 PM IST", "pub_date_relative": "2h ago"}, {"title": "Bitcoin falls nearly 3% over past week as security fears weigh on sentiment", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Oct 2026, 05:11 PM IST", "pub_date_relative": "2h ago"}, {"title": "Major Saudi conferences to proceed, organisers say, despite deadly airport attack", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Oct 2026, 05:06 PM IST", "pub_date_relative": "2h ago"}, {"title": "Xiaomi 18 Pro India Launch Confirmed: Dual Displays, Snapdragon 8 Elite Extreme Gen 6", "full_content": "Xiaomi's upcoming flagship features a secondary rear display for notifications and widgets. The India price is expected to be around Rs 95,000 to Rs 1 lakh, according to Digit.", "source": "NDTV Profit", "pub_date_str": "10 Oct 2026, 05:03 PM IST", "pub_date_relative": "2h ago"}, {"title": "Watch | Schoolboy Pleads To Lift Vada Pav Ban, Tukaram Mundhe's Patient Reply Goes Viral", "full_content": "Mundhe led Maharashtra FDA enforced a statewide ban on deep-fried snacks and other unhealthy food items in school canteens and within a 50-metre radius of schools.", "source": "NDTV Profit", "pub_date_str": "10 Oct 2026, 05:00 PM IST", "pub_date_relative": "2h ago"}, {"title": "FC Goa vs Chennaiyin FC Live Streaming, Telecast: When, Where To Watch ISL Match On TV, Online?", "full_content": "Two-time champions FC Goa begin their new ISL campaign at home against Chennaiyin FC in Fatorda.", "source": "NDTV Profit", "pub_date_str": "10 Oct 2026, 05:00 PM IST", "pub_date_relative": "2h ago"}, {"title": "Industrial, warehousing space leasing hits record 59.1 mn sq ft in top 24 cities in Jan-Sep: Savills", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Digital Real Estate \u203a Realty News \u203a Industrial, warehousing space leasing hits record 59.1 mn sq ft in top 24 cities in Jan-Sep: Savills The Economic Times daily newspaper is available online now. Read Today's Paper Indu V Profit", "pub_date_str": "10 Oct 2026, 04:51 PM IST", "pub_date_relative": "2h ago"}, {"title": "Idt EVP and corporate secretary Joyce J. Mason reported selling $92,570 of IDT Corp (NYSE:IDT) Class B Common Stock on October 7, 2026.", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Oct 2026, 04:49 PM IST", "pub_date_relative": "2h ago"}, {"title": "EU\u2019s Irish presidency wants 8% cut to proposed 2028-2034 budget plan", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Oct 2026, 04:48 PM IST", "pub_date_relative": "2h ago"}, {"title": "DMart Q2 results: Avenue Supermarts Net Profit Rises 8% to Rs 804 Crore, Misses Estimates", "full_content": "The DMart operator's revenue from operations rose 18.4% to Rs 19,206 crore for the quarter ended on September 30, 2026, against Rs 16,219 crore in the same quarter the previous year.", "source": "NDTV Profit", "pub_date_str": "10 Oct 2026, 04:44 PM IST", "pub_date_relative": "2h ago"}, {"title": "NIA Registers Case In Flydubai Incident Under Anti-Hijacking Act, UAPA", "full_content": "The Centre invoked provisions of the NIA Act to order an investigation into the alleged attack on Indian captain Smit Machchhar by his Omani co-pilot aboard Flydubai flight FZ1073.", "source": "NDTV Profit", "pub_date_str": "10 Oct 2026, 04:44 PM IST", "pub_date_relative": "2h ago"}], "cfa": [{"title": "Sebi to issue norms on closing auction soon: Sebi chief", "full_content": "The market regulator will issue new guidelines for price settlement in the derivatives segment during the closing auction session in about a week, said the Securities and Exchange Board of India (Sebi) chairman, Tuhin Kanta Pandey, on Saturday.\n\n\u201cFollowing review of the Closing Auction Session (CAS), a consultation paper was put out to address concerns in respect of the settlement price of derivatives on expiry day. We are currently examining the comments and hope to issue guidelines in about a week\u2019s time,\u201d Pandey said at a BSE Broker\u2019s Forum event.\n\nCAS was introduced on 3 August to determine closing prices for select futures and options (F&O) stocks in India, replacing the previously used volume-weighted average price (VWAP) mechanism.\n\nHowever, the framework ran into several issues just a month into its operations, attracting backlash from market participants. One of the major concerns was abrupt price swings and uncertainty on expiry days in the derivatives market.\n\nIn response, the market regulator issued a consultation paper to review the settlement methodology for derivatives contracts.\n\nSebi suggested that expiry-day settlement prices for index and stock derivatives could be calculated using trades from the last 30 minutes of the continuous trading session (CTS) and the last 10 minutes of the closing auction session, under a blended volume-weighted average price approach.\n\nAs an alternative, the regulator has initially proposed retaining the existing VWAP methodology, with settlement based only on trades in the final 30 minutes of continuous trading, before potentially shifting to the blended approach after at least a year of experience with CAS.\n\nSebi has also proposed stopping the dissemination of the indicative index value (IIV) during CAS while continuing to provide indicative equilibrium prices (IEPs) for individual securities.", "source": "LiveMint Markets", "pub_date_str": "10 Oct 2026, 07:22 PM IST", "pub_date_relative": "2m ago", "cfa_topics": ["Equity Investments", "Derivatives"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "TCS senior employees miss quarterly variable pay as AI revenue rises nearly 20%; juniors get full payouts", "full_content": "Senior employees at Tata Consultancy Services (TCS) will not receive quarterly bonuses after the I-T giant failed to meet performance targets, Reuters reported citing an internal memo. This is the first time in at least two years all variable pay was withheld for some workers, it added.\n\n\"This decision was taken after careful consideration as our performance for the quarter fell short of internal targets,\u201d said chief human resource officer Sudeep Kunnumal in the memo.\n\nEmployees told Reuters the tech company usually gives 50-100% of variable pay . It cited them say that this is the first time in at least two years that the company has explicitly said no bonuses shall be awarded.\n\nNotably, TCS reported its weakest September-quarter sequential revenue growth \u200cin three years, signaling continued pressure on traditional IT services demand even as artificial intelligence ( AI )-related revenue jumped nearly 20%, the report said.\n\nThe uptick in AI revenue, however, was cheered by investors on Friday, 9 October, as the stock rose as much as 6.2%.\n\nIndia's $315 billion IT sector is also facing uncertainty after United States President Donald Trump 's administration suspended major IT outsourcers including TCS, Infosys, and HCLTech among others from a key green-card program on Thursday, 9 October, widening a crackdown it says targets fraud and protects American\u200c jobs.\n\nTCS on Friday reported a 15% jump in July-September quarter net profit to \u20b9 13,884 crore and pointed to continued growth momentum going forward, as per a PTI report.\n\nTCS posted a net profit of \u20b9 12,075 crore in the year-ago period and \u20b9 13,349 crore in the preceding June quarter. The company said its revenue from operations rose 11.22% to \u20b9 73,188 crore in the July-September period from \u20b9 65,799 crore in the year-ago period. In the June quarter, its topline stood at \u20b9 72,275 crore.", "source": "LiveMint Money", "pub_date_str": "10 Oct 2026, 07:08 PM IST", "pub_date_relative": "17m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "France\u2019s bond stress may remain contained as wider European risks stay limited", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Oct 2026, 07:01 PM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "How Supreme Court justices are leaning in major 401(k) case over private funds and underperformance", "full_content": "The Supreme Court heard a major case this week concerning an Intel retirement plan which could result in a decision that influences employers' appetite for private investments in 401(k)s.\n\nMany plan sponsors are in limbo, awaiting the Supreme Court decision and finalized Labor Department rules covering alternative investments before changing their 401(k) menu, even as the asset management industry is gearing up with new products.\n\n\"I think companies want to know what's going to happen with the proposal and what's going to happen with the Supreme Court case before they go rushing in to change their investment strategies,\" said Elizabeth Hopkins, principal at Hopkins ERISA Law and a former senior trial attorney with the Labor Department, who filed an amicus brief in the Supreme Court case on behalf of former high-ranking DOL officials.\n\nHere's what employers and employees need to know about forces influencing the market for private investments in 401(k) plans.\n\nEmployers have been whipsawed for the past several years by changing government policies on alternative investments in 401(k) plans and a high-profile lawsuit filed in 2019 by a former Intel employee. That case, Anderson v. Intel Corp. Investment Policy Committee, which the Supreme Court heard oral arguments on Tuesday, Oct. 6, concerns private investments in a defined contribution plan like a 401(k) and the circumstances under which these investments are appropriate.\n\nThe case is not challenging whether alternative assets like hedge funds and private equity can be used in a 401(k) plan alongside stocks and bonds. Rather, the question before the court is whether a retirement plan underperformance claim requires alleging a \"meaningful benchmark.\" The heart of the dispute is how to handle claims by employees that plan sponsors have invested their retirement funds imprudently.\n\nEmployees contend that the relatively low returns on Intel's plans reflect a breach of fiduciary duty. The lower courts disagreed.", "source": "CNBC Top News", "pub_date_str": "10 Oct 2026, 06:30 PM IST", "pub_date_relative": "55m ago", "cfa_topics": ["Alternative Investments", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "5 personal finance lessons from international bestseller \u2018Die with Zero\u2019 by Bill Perkins", "full_content": "Most of us learn to save as much money as possible. Bill Perkins offers a different view in \u2018Die with Zero\u2019. The American hedge fund manager says money should help us enjoy meaningful experiences. A large bank balance at death can mean missed chances to live fully.\n\nA bigger bank balance should not become your only goal. Perkins says money should support a full and happy life. Think about the experiences you want, then spend time with that purpose.\n\nHe also questions working for too many years. Extra earnings may buy things you do not need. You cannot get those years of your life back.\n\nGood experiences keep giving you happiness through memories. Bill Perkins calls these benefits \u201cmemory dividends\u201d. A family holiday or concert can leave stories you share for years. Such memories can also bring you closer to loved ones.\n\nAn experience enjoyed earlier gives you more years to remember it. Perkins encourages readers to build memories while they can enjoy them. Think about a trip that still makes you smile today.\n\nSome activities are easier at certain stages of life. Trekking, for example, is easier at thirty than at eighty. Health and energy can decline as you grow older.\n\nPerkins suggests listing things you want to do. Then, place them into suitable age groups, or \u201ctime buckets\u201d.\n\nThis helps you avoid delaying experiences until they become difficult. Looking after your health also keeps more choices open for longer.", "source": "LiveMint Money", "pub_date_str": "10 Oct 2026, 06:25 PM IST", "pub_date_relative": "59m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "India-EU FTA 'An Absolute Game Changer': EU Envoy On Trade Deal, Defence Ties", "full_content": "EU Ambassador Jean-Eric Paquet said India and the European Union aim to conclude their free trade agreement by the end of 2026 and bring it into force in 2027. An investment protection pact is also under negotiation.", "source": "NDTV Profit", "pub_date_str": "10 Oct 2026, 06:23 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "China drafts rules to ban hidden car handles, virtual controls", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Oct 2026, 06:17 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Why Nvidia\u2019s stock is dodging the AI credit scare that is crushing Broadcom and Oracle", "full_content": "The P/E ratios have contracted and the CDS spreads have widened in all three cases, but Nvidia appears unscathed", "source": "MarketWatch Top Stories", "pub_date_str": "10 Oct 2026, 06:00 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Private vs PSU banks face off: SBI, PNB, Union vs HDFC, ICICI, Axis, AU - Which pack could outperform in Q2 2026 results", "full_content": "The corporate earnings season has begun and experts are bullish on banking sector, with some expecting robust business growth led by FCNR (B) inflows, improvement in net interest margins (NIMs) and profit. Public Sector Banks (PSBs) are likely to report resilient margins, but private players are expected to see adverse impact to NIMs, according to Motilal Oswal Financial Services which keeps ICICI, State Bank of India , Kotak Mahindra Bank , and AU Bank among its top picks.\n\nHDFC Bank is likely to see strong deposit growth aided by FCNR (B) deposits. NIMs are likely to improve marginally for Punjab National Bank (PNB). Union Bank of India may see modest increase in its credit cost and some improvement in asset quality. However, Axis Bank may see marginal decline in credit costs amid a reduction in technical slippage.\n\nPrivate banks are estimated to see a 24% annual growth in their profit after tax (PAT), whereas, PSU banks are expected to see a 27% annual growth in profit. Consider PAT, PSU bank stocks are likely to outperform in terms of profit growth.\n\n\u201cWe estimate PSU banks\u2019 PAT to grow 27% YoY (19% QoQ) in 2QFY27, supported by robust business growth, partly coupled with stake sale gains at SBI (SBI MF & NSE), BOB (NSE), and INBK (NSE), and normalization of BoB\u2019s PAT,\u201d read the Motilal Oswal report.\n\nHowever, net interest income (NII), which is the difference between interest a bank earns on loans (and investments) and interest paid on deposits and borrowings, presents a slightly different picture. Private banks\u2019 NII are estimated to see 13% annual growth, whereas PSBs may see 10.8% annual growth in the segment.\n\n\u201cAmong large private banks under our coverage, NII is estimated to grow by 8.9% YoY (up 2.5% QoQ) for HDFCB and 16.8% YoY (3.1% QoQ) for ICICIBC.", "source": "LiveMint Markets", "pub_date_str": "10 Oct 2026, 05:51 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Will rising French bond spreads disrupt the rally in European stocks?", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Oct 2026, 05:48 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Hollywood takes on Zuckerberg, Musk and Altman amid widespread anxiety over AI", "full_content": "This weekend marks the kickoff of a slew of films centered on some of the biggest figures in technology and artificial intelligence , as public concern about the industry grows.\n\nSony Pictures' \" The Social Reckoning \" is expected to open to around $7 million domestically this weekend. The scripted film is a follow-up to Aaron Sorkin's \"The Social Network\" from 2010, which went on to win three Academy Awards. While Sorkin's first \"Social\" film focused on Meta CEO Mark Zuckerberg 's founding of the company, \"The Social Reckoning\" follows the 2021 leak by Facebook whistleblower Frances Haugen, who exposed internal documents from the tech giant.\n\n\"It brought back really warm memories for me,\" Haugen told CNBC recently about the film. \"And so I felt it captured the spirit of that time period.\"\n\nThe box office this weekend will also see a limited release of Alex Gibney's nearly four-hour Elon Musk documentary, called \"Musk.\" Early showings have drawn critical acclaim, but it's also been criticized by Musk himself on X, saying the film has zero integrity.\n\n\"You Can See Everything,\" the documentary about disgraced Theranos founder Elizabeth Holmes by Nathan Fielder and Lance Oppenheim via A24 Films, releases on Oct. 16.\n\nChristmas brings \"Artificial\" from Neon to theaters. The scripted film depicts OpenAI CEO Sam Altman and his brief firing from the role in 2023.\n\n\"It looks like an awful movie, but I appreciate people's creativity, and I really do support that,\" Altman recently told CNBC. \"I get why people have anxiety. And also if they need to, like, project that anxiety onto someone or have a little bit of relief and poke fun at me, it doesn't bother me.\"\n\nNetflix is also joining in. The streamer's latest installment of its \"Instadocs\" series will premiere on Monday, highlighting the Hugging Face incident, in which a swarm of OpenAI agents escaped a testing environment and autonomously hacked into the company's infrastructure.", "source": "CNBC World Economy", "pub_date_str": "10 Oct 2026, 05:30 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "From BJ\u2019s to Lululemon, retailers are trimming assortments to boost business", "full_content": "Retailers are trimming assortments in an effort to clean up their balance sheets.\n\nAs shoppers cut spending in the face of high gas and food prices, businesses have pulled more levers to boost profitability and appease investors. During earnings calls this year, a range of retailers have highlighted efforts to reduce the number of items they sell, commonly tracked as stock keeping units, or SKUs.\n\nIn March, Dollar General said it trimmed 1,500 SKUs. In August, Under Armour said it shrunk SKUs by 25% over the past few years and plans to cut another 25%, while BJ's Wholesale Club said it plans to reduce roughly 20% of SKUs . In September, Lululemon said it cut North America SKUs by 15%.\n\nTrimming inventory can help a business stabilize its sales or even get back to growth, and can reduce the chances a company gets stuck with unwanted inventory. But the move can also leave consumers with less choice \u2014 a trade-off many retailers have been willing to make.\n\nWhen a brand struggles to sell certain products, it can lead to discounting, which hurts profitability. Some markdowns are expected when businesses roll the dice on new products that don't end up selling well, but too many promotions can cause problems.\n\n\"If you have zero discounting, you're not taking enough fashion risk,\" said Guggenheim Securities senior retail analyst Simeon Siegel. \"But discounting needs to be fixing mistakes. It needs to be done quickly.\"\n\nUnder Armour and Lululemon are both facing repercussions from what investors see as too many markdowns.\n\nUnder Armour's operating income, which illustrates its underlying profitability, turned negative in fiscal 2025 and 2026. The company said its problems would not be solved by chasing unhealthy sales volume or short-term revenue.", "source": "CNBC Top News", "pub_date_str": "10 Oct 2026, 05:30 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "\u2018What you don\u2019t know is greater than anything you do know\u2019: How Ray Dalio would build a portfolio to withstand a popping AI bubble", "full_content": "Look for inflation protection and unappreciated players in artificial intelligence, says the famed hedge-fund founder.", "source": "MarketWatch Top Stories", "pub_date_str": "10 Oct 2026, 05:30 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "India\u2019s central bank tries to shore up rupee as it nears record lows", "full_content": "Rise in energy costs due to US-Israel war on Iran has put downward pressure on the currency of the world\u2019s fastest-growing major economy", "source": "FT Markets", "pub_date_str": "10 Oct 2026, 05:27 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Indian stock markets snap 8-week losing streak - What\u2019s next for Sensex, Nifty? Triggers, strategy \u200bfor investors", "full_content": "Indian equity markets ended their eight-week losing streak, the longest in 25 years, after a volatile week in which benchmarks recovered on buying in information technology (IT), fast-moving consumer goods (FMCG), automobile and financial stocks. However, persistent foreign fund outflows, elevated crude oil prices, rising global bond yields and uncertainty over the monetary policy outlook continued to weigh on investor sentiment.\n\nFor the week, the BSE Sensex gained 562.63 points, or 0.78%, to close at 72,472.33, while the Nifty 50 advanced 98.5 points, or 0.43%, to settle at 22,520.45.\n\nThe recovery gathered momentum on Friday, October 9, when the Sensex surged 879.09 points, or 1.23%, to 72,472.33. The Nifty 50 climbed 288.65 points, or 1.30%, to end at 22,520.45, snapping the benchmarks' eight-week losing streak.\n\n\"Markets snapped an eight-week losing streak, posting modest weekly gains as easing crude oil prices and positive corporate updates supported a late-week recovery. However, volatility remained elevated following the RBI\u2019s decision to raise the repo rate by 25 basis points to 5.50% and shift its policy stance towards calibrated tightening,\" said Ajit Mishra, SVP \u2013 Research, Religare Broking.\n\nDespite the rebound, market participants will look for stronger follow-through buying to determine whether the recovery can extend into the coming week. Several domestic and global developments, including inflation data, corporate earnings, crude oil prices and foreign investor flows, are likely to influence the market's direction.\n\nInflation data from the US will be a key trigger for global equity markets next week.", "source": "LiveMint Markets", "pub_date_str": "10 Oct 2026, 05:26 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Fixed Income", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Bank of America is bullish on these top stocks ahead of earnings", "full_content": "Bank of America highlighted some of its best ideas heading into third-quarter earnings.", "source": "CNBC Top News", "pub_date_str": "10 Oct 2026, 05:25 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "SBI, HCL Tech, Eicher Motors: Top 3 stock picks by Sumeet Bagadia | Target, stop-loss, Nifty, Bank Nifty outlook", "full_content": "Stocks to buy | Sumeet Bagadia's stock recommendations: The key benchmark indices of the Indian stock market staged a strong rebound on Friday, October 9, bringing an end to the Nifty 50 and Sensex\u2019s eight-week losing streak. The Nifty rose 1.30%, while the Sensex advanced 1.23%. Bank Nifty also recovered, gaining 1.36%. The rally was led by IT stocks following Tata Consultancy Services\u2019 September-quarter results, with buying extending to FMCG, auto and financial shares.\n\nThe macroeconomic backdrop remains challenging. Brent crude continued to trade above $100 a barrel, while WTI remained above $90. Comments from the US president on discussions with Iran offered some temporary relief, but tensions around the Strait of Hormuz and concerns over regional energy infrastructure have kept the risk of supply disruptions elevated. For India, persistently high oil prices pose risks to inflation, the import bill and the rupee.\n\nForeign investor selling remains a significant overhang. FIIs recorded net outflows of approximately \u20b9 39,779 crore in October so far, while domestic institutional investors (DIIs) bought around \u20b9 40,355 crore over the same period, broadly offsetting the foreign selling. Domestic institutional demand has provided an important cushion, absorbing much of the pressure from overseas investors and helping stabilise the market.\n\nSumeet Bagadia, Executive Director at Choice Broking, believes the Nifty 50 chart pattern is signalling improving short-term sentiment, although the broader structure remains weak below key moving averages. He said that PCR at 0.98 suggests a balanced derivatives setup, while India VIX eased to 14.375, reflecting reduced volatility. Sustaining the rebound and moving above resistance will be crucial for further improvement.\n\nOn the outlook for the Nifty 50 index, Sumeet Bagadia said, \u201cImmediate support is placed at 22,250\u201322,400, while 22,650\u201322,700 remains the key resistance zone.", "source": "LiveMint Markets", "pub_date_str": "10 Oct 2026, 05:21 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Bitcoin falls nearly 3% over past week as security fears weigh on sentiment", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Oct 2026, 05:11 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Watch | Schoolboy Pleads To Lift Vada Pav Ban, Tukaram Mundhe's Patient Reply e": "AI borrowing slows as investors grow wary of debt binge", "full_content": "Appetite for financing infrastructure boom is tested after months of record-breaking bond issuance", "source": "FT Markets", "pub_date_str": "10 Oct 2026, 04:30 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Fixed Income", "Alternative Investments"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Nvidia GPUs are everywhere. Here are the ways companies are accessing them", "full_content": "Nvidia GPUs are the most sought-after processors in AI, and they're in such demand that the chipmaker's stock climbed to yet another record this week, lifting its market cap close to $6 trillion.\n\nCustomers can now shop around for access to the chips at the giant clouds from Amazon, Microsoft and Google, as well as at so-called neoclouds like CoreWeave. They can also go to various online marketplaces or even buy the costly hardware directly.\n\nFor Nvidia, it all adds up to unrelenting growth, as management anticipates $108 billion in revenue for the October quarter, which would mark an 89% year-over-year jump.\n\nBut the paradox of choice can be a headache for companies needing computing power yesterday.\n\nWhile cloud infrastructure providers have ranked at the top of Nvidia's customer list for several years, the business is diversifying. Five clients accounted for at least 10% of Nvidia's accounts receivable in July quarter, up from three in January, according to a filing .\n\nIndustry research firm SemiAnalysis counted 323 Nvidia GPU providers as of September, up from 209 less than 11 months earlier.\n\n\"You're going to see a whole new crop of really, really exciting neoclouds with hundreds of billions of dollars backlog together,\" Nvidia CEO Jensen Huang said at a Goldman Sachs tech conference in San Francisco last month.\n\nHere's a rundown of the various options for accessing GPUs, and why each might make sense:", "sour     function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>

</body>
</html>
