    const allData = {"general": [{"title": "Oil falls amid optimism over potential diplomatic solution to the Iran conflict", "full_content": "Oil fell Friday following a report that U.S. and Iranian negotiators in New York are discussing a phased deal to end the standoff in the Persian Gulf.\n\nFutures for international benchmark Brent crude for November delivery declined 0.92% to $105.68 a barrel. U.S. West Texas Intermediate futures for November dropped 1.52% to $93.09 per barrel.\n\nbrent Reuters reported that a senior Iranian official had said the most realistic path forward is for Tehran to allow navigation in the Strait of Hormuz in exchange for the U.S. ending its naval blockade.\n\nThe U.S. and Iran agreed to this approach under a June 17 memorandum of understanding, but the deal quickly collapsed into renewed fighting. It is unclear what is different about the current negotiations.\n\nIran now wants the U.S. to return to the memorandum of understanding before the U.S. midterm elections, according to Al Jazeera, which reported that this was told to media outlets by Iranian President Masoud Pezeshkian on the sidelines of the UN General Assembly.\n\nwti \"It is understood that the two sides have been communicating via mediators,\" said David Morrison, senior market analyst at Trade Nation. Investors are still expressing their concerns over sticky inflation, higher energy prices and bellicose statements from the US and Iran at the UN General Assembly in New York, Morrison said.", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 10:40 AM IST", "pub_date_relative": "1m ago"}, {"title": "UPI payments above \u20b92,000: Who will pay the 0.4% MDR? FM Sitharaman clarifies", "full_content": "The proposed Merchant Discount Rate (MDR) on certain UPI payments above \u20b9 2,000 has raised concerns among users, merchants, and other stakeholders. To quell such concerns, Finance Minister Nirmala Sitharaman has now clarified that the charge will be levied on merchants and will not be passed on to consumers.\n\nAccording to a PTI report, Sitharaman said on 25 September that \u201cthe MDR is not a tax, cess or surcharge, and that the money collected will not go to the government\u201d.\n\nIn accordance with the new framework, a 0.4% will apply starting from 15 October 2026 to specified person-to-merchant UPI transactions above \u20b9 2,000. Furthermore, the charge is capped at \u20b9 300 for transactions of \u20b9 75,000 or more. Person-to-person UPI payments will remain free.\n\nThe government has also stated that about 96% of merchant UPI transactions will remain unaffected, while only small merchants with monthly UPI QR collections of up to \u20b9 1 lakh are exempt from the new MDR, as per a detailed press release recently issued by the Press Information Bureau.\n\nPTI quoted the Finance Minister as saying, \u201cI don't think customers are worried because we are clearly saying that this is not going to the consumer. There are, of course, I'm sorry to say, people who have not understood this properly... It is not on the consumer.\n\nThe MDR charge on the \u20b9 2,000 payment\"> \u20b9 2,000 payment is borne by the merchant, who already does so for other cards, the Finance Minister said. And, she added, with the other cards also, they are not passing it on to the consumer.\n\n\u201cThere may be many things they do, such as making offers or whatever. So, strictly speaking, this applies to many other cards. I am justifying it from that perspective.", "source": "LiveMint Money", "pub_date_str": "25 Sep 2026, 10:30 AM IST", "pub_date_relative": "11m ago"}, {"title": "NSE shares dip below listing price \u2014 will it rebound or more pain ahead? | Explained with support, resistance, target", "full_content": "NSE share price today: Shares of National Stock Exchange (NSE) declined on Friday, September 25, after closing nearly 2% higher in the previous session. NSE IPO listed on the BSE with a modest gain of about 0.84% over its issue  stock hitting a 52-week high of \u20b9 14.87 on 23 September, defying weak stock market sentiment. Year-to-date, the jewellery stock is up over 50%, while in the last six months, it has surged nearly 75%.\n\nOn a monthly scale, the stock is already up about 30% so far in September, looking set to extend gains for the third consecutive month.\n\nIn morning trade on Friday, September 25, the stock rose more than 1% to an intraday high of \u20b9 14.41, near its 52-week high. However, profit booking at higher levels wiped out the gains, pushing the stock down to a low of \u20b9 14.03, marking a decline of 1.5% from the previous session\u2019s close.\n\nSporadic profit booking in a stock after its steep rise is a common phenomenon. At this juncture, a key question is whether the stock can rise further from the current levels.\n\nAccording to technical experts, PC Jeweller stock continues to trade above all key moving averages, indicating a positive trend structure.\n\nSachin Gupta, VP \u2013 Technical Research at Choice Equity Broking, underscored that the stock's daily RSI at 67 reflects strong momentum and remains supportive of the ongoing bullish setup.\n\nGupta said the immediate support is placed in the \u20b9 12.50\u2013 \u20b9 13 zone, with the 20 EMA around \u20b9 12.63 providing additional dynamic support.\n\nHolding this zone would help maintain the bullish price structure and could support the next upward move, Gupta said.", "source": "LiveMint Markets", "pub_date_str": "25 Sep 2026, 10:18 AM IST", "pub_date_relative": "23m ago"}, {"title": "Eplus COO Darren Raiguel sells $93 in common stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Sep 2026, 10:16 AM IST", "pub_date_relative": "25m ago"}, {"title": "First Interstate BancSystem director Scott sells $626,880 in shares", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Sep 2026, 10:16 AM IST", "pub_date_relative": "26m ago"}, {"title": "Invesco director Pho s a stock market holiday today, September 25 in China\u2019s Shanghai Stock Exchange, Shenzhen Stock Exchange and Beijing Stock Exchange (BSE). Additionally, Korea Exchange (KRX), Taiwan Stock Exchange (TWSE) and Taipei Exchange (TPex) will also remain closed on Friday.\n\nChina's stock market remained closed on Friday on the account of the Mid-Autumn Festival, which is also known as the Moon Festival. China's stock markets will reopen on Monday, September 28 at 9:30 am local time (7:00 am IST). SSE Composite Index closed 1.22% lower at 3,888.37 on Thursday, September 24.\n\nTaiwan stock markets remained shut on Friday to observe the Mid Autumn festival. The stock market will remain closed on Monday too for Teachers' Day which marks the birth anniversary of Confucius, who is revered as a supreme sage and first teacher. Taiwan Stock Exchange and Taipei Exchange will reopen on Tuesday, September 29, at 9 am local time (6:30 am IST). Taiwan\u2019s TSEC Weighted Index, also known as TAIEX, closed 0.28% lower at 48,024.60 on Thursday.\n\nSouth Korea's stock market, Korea Exchange/KRX, is closed on Friday, September 25, 2026 on the occasion of Chuseok, which is the Korean Harvest Moon Festival. The stock market closed for a four-day holiday stretch spanning Thursday, September 24, and Friday, September 25.\n\nThe stock market will open on Monday, September 28. Korea stock exchange will remain open at 9 am local time (5:30 am IST) on Monday. KOSPI Composite Index closed 0.90% higher at 7,080.92 points on Wednesday, September 23.\n\nCatch all the Business News , Market News , Breaking News Events and Latest News Updates on Live Mint.", "source": "LiveMint Markets", "pub_date_str": "25 Sep 2026, 10:00 AM IST", "pub_date_relative": "41m ago"}, {"title": "Hero Motors shares up 17% \u2014 what's driving the stock? Explained with target, stop-loss", "full_content": "Hero Motors shares staged another sharp rally on Friday, September 25, continuing the strong recovery that followed their lacklustre stock market debut earlier this week. The newly listed stock climbed as much as 20% during the session, taking its gains from the \u20b9 84 IPO price to nearly 69%.\n\nThe stock began Friday's session at \u20b9 130, representing a 10% premium to its previous close of \u20b9 118.21, and subsequently touched an intraday high of \u20b9 141.85, up 20%.\n\nFriday marked the third consecutive session of gains for Hero Motors . The stock had advanced 20% in the previous session and gained more than 17% on its listing day.\n\nThe rally came despite a weak debut on Wednesday, September 23. Hero Motors had listed at \u20b9 82 on the NSE, a discount of 2.38% to its issue price. On the BSE, shares debuted at \u20b9 82.10, representing a 2.26% discount.\n\nHero Motors\u2019 sharp post-listing recovery has brought the stock back into focus, with investors now assessing whether the recent gains can be sustained. While the company operates across the growing automotive technology and powertrain segments, its current valuation, profitability metrics and customer concentration remain important factors to consider before taking a fresh position.\n\nRavi Singh, Chief Research Officer at Master Capital Services, highlighted Hero Motors' position as an automotive technology player supplying engineered powertrain solutions to global original equipment manufacturers ( OEMs ) across the US, Europe, India and ASEAN. He noted that the India\u2019s two-wheeler industry is projected to grow at 6-7% CAGR to 29-31 million units by FY31, while the gears and transmissions market is expected to grow at 6-8% CAGR between CY25 and CY31. Singh said the weak listing could weigh on near-term sentiment and fresh investors could wait for the stock to stabilise.", "source": "LiveMint Markets", "pub_date_str": "25 Sep 2026, 09:57 AM IST", "pub_date_relative": "44m ago"}, {"title": "PB Fintech's 36% bloodbath rattles market, but Jefferies stays bullish. What does it see in Policybazaar parent?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a PB Fintech's 36% bloodbath rattles market, but Jefferies stays bullish. What does it see in Policybazaar parent? PB Fintech Share Price The Economic Times daily newspaper is available online now. Read Today's Paper PB Fintech's 36% bloodbath rattles market, but Jefferies stays bullish. What does it see in Policybazaar parent? SECTIONS PB Fintech's 36% bloodbath rattles market, but Jefferies stays bullish. What does it see in Policybazaar parent? By Debaroti Adhikary , ETMarkets.com Last Updated: Sep 25, 2026, 09:54:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis PB Fintech shares plunged a record 36% to a 52-week low, wiping out around Rs 31,430 crore in market value after IRDAI proposed changes to insurance commission structures. While Jefferies flagged a potentially material near-term earnings impact, it retained its \u2018Buy\u2019 call on the stock.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "25 Sep 2026, 09:54 AM IST", "pub_date_relative": "47m ago"}, {"title": "US Market: Meta shares rebound as Muse AI agent fuels revenue hopes", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a US Market: Meta shares rebound as Muse AI agent fuels revenue hopes Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US Market: Meta shares rebound as Muse AI agent fuels revenue hopes SECTIONS US Market: Meta shares rebound as Muse AI agent fuels revenue hopes By Anupam Nagar , ETMarkets.com Last Updated: Sep 25, 2026, 09:54:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Meta shares have rebounded as investor optimism grows around Muse, its AI agent aimed at creating revenue beyond advertising. The company faces scrutiny over heavy AI spending, privacy concerns and competition, but Muse\u2019s early downloads, retail partnerships and integration with smart glasses could help Meta monetize its vast user base.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "25 Sep 2026, 09:54 AM IST", "pub_date_relative": "47m ago"}], "cfa": [{"title": "Oil falls amid optimism over potential diplomatic solution to the Iran conflict", "full_content": "Oil fell Friday following a report that U.S. and Iranian negotiators in New York are discussing a phased deal to end the standoff in the Persian Gulf.\n\nFutures for international benchmark Brent crude for November delivery declined 0.92% to $105.68 a barrel. U.S. West Texas Intermediate futures for November dropped 1.52% to $93.09 per barrel.\n\nbrent Reuters reported that a senior Iranian official had said the most realistic path forward is for Tehran to allow navigation in the Strait of Hormuz in exchange for the U.S. ending its naval blockade.\n\nThe U.S. and Iran agreed to this approach under a June 17 memorandum of understanding, but the deal quickly collapsed into renewed fighting. It is unclear what is different about the current negotiations.\n\nIran now wants the U.S. to return to the memorandum of understanding before the U.S. midterm elections, according to Al Jazeera, which reported that this was told to media outlets by Iranian President Masoud Pezeshkian on the sidelines of the UN General Assembly.\n\nwti \"It is understood that the two sides have been communicating via mediators,\" said David Morrison, senior market analyst at Trade Nation. Investors are still expressing their concerns over sticky inflation, higher energy prices and bellicose statements from the US and Iran at the UN General Assembly in New York, Morrison said.", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 10:40 AM IST", "pub_date_relative": "1m ago", "cfa_topics": ["Economics", "Derivatives", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "UPI payments above \u20b92,000: Who will pay the 0.4% MDR? FM Sitharaman clarifies", "full_content": "The proposed Merchant Discount Rate (MDR) on certain UPI payments above \u20b9 2,000 has raised concerns among users, merchants, and other stakeholders. To quell such concerns, Finance Minister Nirmala Sitharaman has now clarified that the charge will be levied on merchants and will not be passed on to consumers.\n\nAccording to a PTI report, Sitharaman said on 25 September that \u201cthe MDR is not a tax, cess or surcharge, and that the money collected will not go to the government\u201d.\n\nIn accordance with the new framework, a 0.4% will apply starting from 15 October 2026 to specified person-to-merchant UPI transactions above \u20b9 2,000. Furthermore, the charge is capped at \u20b9 300 for transactions of \u20b9 75,000 or more. Person-to-person UPI payments will remain free.\n\nThe government has also stated that about 96% of merchant UPI transactions will remain unaffected, while only small merchants with monthly UPI QR collections of up to \u20b9 1 lakh are exempt from the new MDR, as per a detailed press release recently issued by the Press Information Bureau.\n\nPTI quoted the Finance Minister as saying, \u201cI don't think customers are worried because we are clearly saying that this is not going to the consumer. There are, of course, I'm sorry to say, people who have not understood this properly... It is not on the consumer.\n\nThe MDR charge on the \u20b9 2,000 payment\"> \u20b9 2,000 payment is borne by the merchant, who already does so for other cards, the Finance Minister said. And, she added, with the other cards also, they are not passing it on to the consumer.\n\n\u201cThere may be many things they do, such as making offers or whatever. So, strictly speaking, this applies to many other cards. I am justifying it from that perspective.", "source": "LiveMint Money", "pub_date_str": "25 Sep 2026, 10:30 AM IST", "pub_date_relative": "11m ago", "cfa_topics": ["Quantitative Methods"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "NSE shares dip below listing price \u2014 will it rebound or more pain ahead? | Explained with support, resistance, target", "full_content": "NSE share price today: Shares of National Stock Exchange (NSE) declined on Friday, September 25, after closing nearly 2% higher in the previous session. NSE IPO listed on the BSE with a modest gain of about 0.84% over its issue price.\n\nThe stock was listed at \u20b9 1800 apiece on BSE on Thursday, but dipped to an intraday low of \u20b9 1,790.10 per share during Friday\u2019s trading session and was down nearly a half percentage point in the early trading session.\n\nExperts see the recent decline as an attractive entry point for investors looking for long-term investment gain. For investors\u2019 closely tracking NSE share price movement, here\u2019s what experts have to say about the stock outlook.\n\nThe stock is likely to see resistance near \u20b9 1950 and may go below 1785, which is the upper price band of the IPO, according to Arun Kejriwal, Founder of Kejriwal Research and Investment Services. He gave a stop loss of \u20b9 1740 per share for NSE.\n\nThe stock closed below its average weighted price, one should not be surprised if the stock goes below its upper price band, noted Kejriwal underlining it as an \u201copportunity to buy\u201d for long-term investors. The expert said that NSE share price can be a portfolio stock which can potentially give 15-20% annual return and is not for short-term investors.\n\n\u201cTo systematically manage downside exposure, short-term and listing-gain investors are advised to maintain a strict stop-loss at \u20b9 1,740 per share (roughly 2.5% below the issue price), which can be trailed upward as the stock consolidates, while long-term investors may hold through volume-driven volatility to capture the exchange's structural compounding potential,\u201d stated Shivani Nyati, Head of Wealth at Swastika Investmart.\n\nThe stock was trading 0.70% lower at \u20b9 1807.20 per share on BSE with a market capitalisation of \u20b9 4,47,480.00 at 10:23 am.", "source": "LiveMint Markets", "pub_date_str": "25 Sep 2026, 10:29 AM IST", "pub_date_relative": "12m ago", "cfa_topics": ["Quantitative Methods", "Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Portfolio Management"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "30% rally this month! PC Jeweller share price near its 52-week high; can the stock rally further?", "full_content": "PC Jeweller shares have been on a strong uptrend this year, with the stock hitting a 52-week high of \u20b9 14.87 on 23 September, defying weak stock market sentiment. Year-to-date, the jewellery stock is up over 50%, while in the last six months, it has surged nearly 75%.\n\nOn a monthly scale, the stock is already up about 30% so far in September, looking set to extend gains for the third consecutive month.\n\nIn morning trade on Friday, September 25, the stock rose more than 1% to an intraday high of \u20b9 14.41, near its 52-week high. However, profit booking at higher levels wiped out the gains, pushing the stock down to a low of \u20b9 14.03, marking a decline of 1.5% from the previous session\u2019s close.\n\nSporadic profit booking in a stock after its steep rise is a common phenomenon. At this juncture, a key question is whether the stock can rise further from the current levels.\n\nAccording to technical experts, PC Jeweller stock continues to trade above all key moving averages, indicating a positive trend structure.\n\nSachin Gupta, VP \u2013 Technical Research at Choice Equity Broking, underscored that the stock's daily RSI at 67 reflects strong momentum and remains supportive of the ongoing bullish setup.\n\nGupta said the immediate support is placed in the \u20b9 12.50\u2013 \u20b9 13 zone, with the 20 EMA around \u20b9 12.63 providing additional dynamic support.\n\nHolding this zone would help maintain the bullish price structure and could support the next upward move, Gupta said.", "source": "LiveMint Markets", "pub_date_str": "25 Sep 2026, 10:18 AM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Japanese bank stocks rise tracking yield surge, rate hike bets", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Sep 2026, 10:14 AM IST", "pub_date_relative": "28m ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Ola Electric shares tumble 9% after 17% rally in 4 days. Why brokerages remain cautious", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Ola Electric shares tumble 9% after 17% rally in 4 days. Why brokerages remain cautious The Economic Times daily newspaper is available online now. Read Today's Paper Ola Electric shares tumble 9% after 17% rally in 4 days. Why brokerages remain cautious SECTIONS Ola Electric shares tumble 9% after 17% rally in 4 days. Why brokerages remain cautious By Debaroti Adhikary , ETMarkets.com Last Updated: Sep 25, 2026, 10:10:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Ola Electric shares fell sharply on Friday, snapping a four-day winning streak as investors assessed the EV maker\u2019s proposed rights issue and ongoing funding needs. Despite a recent recovery, the stock remains well below its peak. Brokerages including Citi and Kotak continue to maintain bearish views, citing operational and cash-burn concerns.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram  September 25.\n\nIt is a stock market holiday today, September 25 in China\u2019s Shanghai Stock Exchange, Shenzhen Stock Exchange and Beijing Stock Exchange (BSE). Additionally, Korea Exchange (KRX), Taiwan Stock Exchange (TWSE) and Taipei Exchange (TPex) will also remain closed on Friday.\n\nChina's stock market remained closed on Friday on the account of the Mid-Autumn Festival, which is also known as the Moon Festival. China's stock markets will reopen on Monday, September 28 at 9:30 am local time (7:00 am IST). SSE Composite Index closed 1.22% lower at 3,888.37 on Thursday, September 24.\n\nTaiwan stock markets remained shut on Friday to observe the Mid Autumn festival. The stock market will remain closed on Monday too for Teachers' Day which marks the birth anniversary of Confucius, who is revered as a supreme sage and first teacher. Taiwan Stock Exchange and Taipei Exchange will reopen on Tuesday, September 29, at 9 am local time (6:30 am IST). Taiwan\u2019s TSEC Weighted Index, also known as TAIEX, closed 0.28% lower at 48,024.60 on Thursday.\n\nSouth Korea's stock market, Korea Exchange/KRX, is closed on Friday, September 25, 2026 on the occasion of Chuseok, which is the Korean Harvest Moon Festival. The stock market closed for a four-day holiday stretch spanning Thursday, September 24, and Friday, September 25.\n\nThe stock market will open on Monday, September 28. Korea stock exchange will remain open at 9 am local time (5:30 am IST) on Monday. KOSPI Composite Index closed 0.90% higher at 7,080.92 points on Wednesday, September 23.\n\nCatch all the Business News , Market News , Breaking News Events and Latest News Updates on Live Mint.", "source": "LiveMint Markets", "pub_date_str": "25 Sep 2026, 10:00 AM IST", "pub_date_relative": "41m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Hero Motors shares up 17% \u2014 what's driving the stock? Explained with target, stop-loss", "full_content": "Hero Motors shares staged another sharp rally on Friday, September 25, continuing the strong recovery that followed their lacklustre stock market debut earlier this week. The newly listed stock climbed as much as 20% during the session, taking its gains from the \u20b9 84 IPO price to nearly 69%.\n\nThe stock began Friday's session at \u20b9 130, representing a 10% premium to its previous close of \u20b9 118.21, and subsequently touched an intraday high of \u20b9 141.85, up 20%.\n\nFriday marked the third consecutive session of gains for Hero Motors . The stock had advanced 20% in the previous session and gained more than 17% on its listing day.\n\nThe rally came despite a weak debut on Wednesday, September 23. Hero Motors had listed at \u20b9 82 on the NSE, a discount of 2.38% to its issue price. On the BSE, shares debuted at \u20b9 82.10, representing a 2.26% discount.\n\nHero Motors\u2019 sharp post-listing recovery has brought the stock back into focus, with investors now assessing whether the recent gains can be sustained. While the company operates across the growing automotive technology and powertrain segments, its current valuation, profitability metrics and customer concentration remain important factors to consider before taking a fresh position.\n\nRavi Singh, Chief Research Officer at Master Capital Services, highlighted Hero Motors' position as an automotive technology player supplying engineered powertrain solutions to global original equipment manufacturers ( OEMs ) across the US, Europe, India and ASEAN. He noted that the India\u2019s two-wheeler industry is projected to grow at 6-7% CAGR to 29-31 million units by FY31, while the gears and transmissions market is expected to grow at 6-8% CAGR between CY25 and CY31. Singh said the weak listing could weigh on near-term sentiment and fresh investors could wait for the stock to stabilise.", "source": "LiveMint Markets", "pub_date_str": "25 Sep 2026, 09:57 AM IST", now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "25 Sep 2026, 09:49 AM IST", "pub_date_relative": "52m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "PB Fintech shares slump 40% in two sessions| What Jefferies, Morgan Stanley, BofA say on the stock", "full_content": "PB Fintech share price rose nearly 4% on Friday, 25 September, recovering partially after the stock plunged almost 36% in the previous session. However, PB Fintech's share price today fell by over 6% today and has lost about 40% in two straight sessions.\n\nThe sharp sell-off followed the Insurance Regulatory and Development Authority of India\u2019s (IRDAI) proposal for sweeping changes to insurance distribution, including tighter commission rules and a ban on certain \u201cdark patterns\u201d on insurance and distributor websites.\n\nPB Fintech share price today opened at an intraday low of \u20b9 1,131.05 apiece on the BSE, the stock touched an intraday high of \u20b9 1,262 per share.\n\nSudeep Shah, Vice President \u2013 Technical and Derivatives Research at SBI Securities, said Policybazaar witnessed a sharp 36% decline on 24 September, significantly weakening its chart structure.\n\nThe stock has fallen well below its key moving averages, indicating a deterioration in the overall trend, Shah said. The RSI has plunged from 61 to 26, signalling strong bearish momentum, while the MACD has slipped below the zero line, further reinforcing the negative technical setup.\n\nGiven the sharp deterioration in technical indicators, Shah advised against bottom fishing and suggested waiting for greater clarity in the stock\u2019s price action before considering fresh positions.\n\nHe identified the \u20b9 1,150\u2013 \u20b9 1,160 zone as a crucial support area, noting that the stock had rebounded sharply from this range in May 2024. A decisive break below this support zone could lead to a further extension of the stock\u2019s weakness, Shah said.\n\nGlobal brokerages have subsequently revised their views and price targets for the stock, citing potential changes to insurance distribution economics.", "source": "LiveMint Markets", "pub_date_str": "25 Sep 2026, 09:49 AM IST", "pub_date_relative": "52m ago", "cfa_topics": ["Equity Investments", "Derivatives", "Ethical & Professional Standards"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Global Market: Japanese investors eye home assets as rising bond yields alter returns", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a Global Market: Japanese investors eye home assets as rising bond yields alter returns Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market: Japanese investors eye home assets as rising bond yields alter returns SECTIONS Global Market: Japanese investors eye home assets as rising bond yields alter returns By Anupam Nagar , ETMarkets.com Last Updated: Sep 25, 2026, 09:48:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Japanese investors are gradually shifting funds back into domestic assets as rising Japanese government bond yields improve their appeal. However, uncertainty over the Bank of Japan\u2019s rate path and further yield increases is delaying larger repatriation flows. The cautious approach is limiting potential yen gains despite reduced speculative short positions.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "25 Sep 2026, 09:48 AM IST", "pub_date_relative": "53m ago", "cfa_topics": ["Equity Investments", "Fixed Income"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "ArMee Infotech IPO enters Day 3 with 1.17x subscription; GMP at 5%. Should you subscribe?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a ArMee Infotech IPO enters Day 3 with 1.17x subscription; GMP at 5%. Should you subscribe? The Economic Times daily newspaper is available online now. Read Today's Paper ArMee Infotech IPO enters Day 3 with 1.17x subscription; GMP at 5%. Should you subscribe? SECTIONS ArMee Infotech IPO enters Day 3 with 1.17x subscription; GMP at 5%. Should you subscribe? By Ritesh Presswala , ETMarkets.com Last Updated: Sep 25, 2026, 09: ong's Hang Seng index was 1.69% lower.\n\nThe drama continued in the bond market, where the 10-year Treasury yield climbed to 5.225% late Thursday, the highest level since 2007, while the 30-year yield reached 5.502%.\n\nThis week's ascent in yields was fueled by hawkish comments from Federal Reserve Governor Michael Barr, persistently high energy prices due to the Iran war, and a hot purchasing managers' report. Fed funds futures trading suggests a roughly 68% likelihood of a rate hike in October, according to the CME FedWatch tool .\n\nThe 30-year fixed rate mortgage , which tracks the 10-year note, rose to 7.45%, the highest level since 2024, as borrowing costs for consumers looked poised to increase ahead of the midterm elections.\n\n\"Even before the moves of the past few days, the declines in credit card [annual percentage rates] and auto loan rates that occurred from mid- 2024 through the start of 2026 had stalled, and mortgage rates reaccelerated,\" Heather Berger, economist at Morgan Stanley, wrote in a note to clients.", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 09:45 AM IST", "pub_date_relative": "56m ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Derivatives", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Global Market: Japanese shares rise on AI stocks, dividend buying; Nikkei up 1.2%", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Global Market: Japanese shares rise on AI stocks, dividend buying; Nikkei up 1.2% Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market: Japanese shares rise on AI stocks, dividend buying; Nikkei up 1.2% SECTIONS Global Market: Japanese shares rise on AI stocks, dividend buying; Nikkei up 1.2% By Anupam Nagar , ETMarkets.com Last Updated: Sep 25, 2026, 09:42:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Japanese shares rose on Friday, led by AI and chip stocks, while investors bought shares ahead of Monday\u2019s mid-term dividend eligibility deadline. The Nikkei 225 gained 1.23% and Topix 1.19%. Banking stocks also advanced strongly, although SoftBank fell 2.63% after Oracle shares declined amid concerns over data-centre power delays.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "25 Sep 2026, 09:42 AM IST", "pub_date_relative": "59m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Jefferies is bullish on Adani Ports and 5 other logistics sector stocks. How many do you have?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News Jefferies is bullish on Adani Ports and 5 other logistics sector stocks. How many do you have? Written by Veer Sharma , ETMarkets.com | Sep 25, 2026, 09:42:56 AM IST 1 / 7 Add to cart Jefferies said Indian port volumes rose 7% YoY in August 2026, driven by government-owned Major Ports. Indian Railways\u2019 container volumes, however, declined 3% YoY, compared with a 10% YoY increase in port container volumes, which the brokerage attributed to Middle-East tensions. Here are 6 logistics stocks the brokerage is bullish on:\n\nJefferies has assigned a Buy recommendation, a current market price of Rs 1,794 and a target price of Rs 2,160, indicating an upside of 20%.\n\nJSW Infrastructure carries a Buy recommendation, with its current market price of Rs 370 against a target price of Rs 395, implying an upside of 7%.\n\nConcor, a public sector undertaking, has a Buy recommendation, with a current market price of Rs 474 and a target price of Rs 650, pointing to an upside of 37%.\n\nThe logistics giant carries a Buy recommendation, with a current market price of Rs 429 and a target price of Rs 540, implying an upside of 26%.\n\nGateway has a Buy recommendation, with its current market price of Rs 54 and a target price of Rs 74, pointing to an upside of 38%.\n\nTCI Express has been given a Buy recommendation, with its current market price of Rs 484 against a target price of Rs 770, implying an upside of 59%.\n\nDisclaimer: This article has been written by Veer Sharma, who is not a SEBI-registered Research Analyst or an Investment Adviser. Veer Sharma and his/her \u2018relative(s)\u2019 (as defined under Section 2(77) of the Companies Act, 2013) do not hold any financial interest in the companies mentioned in this article as of the date of publication.", "source": "Economic Times Markets", "pub_date_str": "25 Sep 2026, 09:35 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}], "updated_at": "25 Sep 2026, 10:42 AM IST", "total_stories": 338};

        document.getElementById("dateline").textContent = allData.updated_at;

        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>

                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>

</body>
</html>
