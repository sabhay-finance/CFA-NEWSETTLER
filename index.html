    const allData = {"general": [{"title": "Philadelphia Fed's Anna Paulson says 'modest' rate moves likely ahead to tame inflation", "full_content": "Philadelphia Federal Reserve President Anna Paulson said Thursday that she and her colleagues may need to raise interest rates further to bring inflation back to target.\n\nSpeaking a week after the Federal Open Market Committee raised benchmark borrowing rates by a quarter percentage point, Paulson said inflation trends are still worrying.\n\nThe rate hike, which took the key funds rate to a target range of 3.75%-4%, \"brings policy closer to what I believe is needed to return inflation to 2% at a pace that balances inflation with risks to the labor market. Looking ahead, if conditions evolve as I expect, some modest further tightening may be warranted.\"\n\nThough the summer showed some moderating in price pressures, she said underlying inflation is still running around 2.5%-3%, \"well above our 2% target, and the gap has shown little signs of closing.\"\n\n\"The best I can say about underlying inflation this year is that it hasn't gotten worse,\" Paulson said in prepared remarks for a fintech conference in her home district. She noted that inflation has held higher even outside of the oil supply shocks from the Iran war and tariffs.\n\nOutside of inflation, Paulson said economic output \"has been solid\" while the labor market is \"holding steady.\"\n\nThe comments come as markets have raised their expectations for Fed tightening dramatically.\n\nAnother leg up this week has taken longer-duration Treasury yields to highs not seen since 2004. Traders are now pricing in a 64% chance the FOMC hikes again in October, then expect another move in January, according to the CME Group's FedWatch tool. Fed funds futures contracts are implying a rate of 4.8% by the end of 2027, which would indicate the expectation of as many as four quarter-point increases ahead.", "source": "CNBC Finance", "pub_date_str": "24 Sep 2026, 10:41 PM IST", "pub_date_relative": "just now"}, {"title": "Meta nears first new high in a year as Muse success showcases winning AI strategy", "full_content": "Meta is transforming into more than a social-media juggernaut in the AI era. Muse is the centerpiece of its strategy.", "source": "CNBC Top News", "pub_date_str": "24 Sep 2026, 10:37 PM IST", "pub_date_relative": "4m ago"}, {"title": "Top stocks to buy tomorrow: Vaishali Parekh picks three stocks - GAIL, Texmaco Rail, HBL Engineering; market outlook", "full_content": "Vaishali Parekh, Vice President \u2013 Technical Research at Prabhudas Lilladher, has recommended three stocks for intraday trading on September 25, with GAIL, Texmaco Rail and HBL Engineering among her picks. Her recommendations include specific buy levels, targets and stop-loss levels for each stock.\n\nThe Indian stock market suffered heavy losses in Thursday\u2019s trade, September 24, with the headline indices closing more than 1.5% lower, erasing their recent gains and falling below key psychological levels. Investor sentiment was hit by surging global bond yields and volatility in crude oil prices.\n\nThe Nifty 50 plunged 1.64% to settle at 25,169.50, while the Sensex finished at 73,580, down 1.67% from the previous session. The pain was more pronounced in the broader market, with the Nifty Midcap 100 falling 2.57% and the Nifty Smallcap 100 tumbling 2.25%.\n\nVaishali Parekh, Vice President \u2013 Technical Research at Prabhudas Lilladher, said the Nifty indicated a big bearish candle formation with a gap-down opening on the daily chart to close near the 23000 zone, breaching below the previous low made near the 23100 zone, and has turned the bias and sentiment into a very tense scenario for the coming sessions.\n\nThe index would have the 23000 zone as the crucial support zone failing, which can further intensified selling pressure with the 22600 and 22200 levels as the next major support zones which can be tested in the coming days.", "source": "LiveMint Markets", "pub_date_str": "24 Sep 2026, 10:32 PM IST", "pub_date_relative": "10m ago"}, {"title": "Elizabeth Holmes to Transfer to Halfway House in August 2027 - The New York Times", "full_content": "Elizabeth Holmes to Transfer to Halfway House in August 2027 The New York Times Elizabeth Holmes scheduled to move to halfway house in August 2027 ABC News - Breaking News, Latest News and Videos Theranos founder Elizabeth Holmes approved to move to halfway house next year KCCI Elizabeth Holmes Is Leaving Prison Early\u2014What We Know Forbes Elizabeth Holmes approved to move to Texas halfway house in 2027 USA Today", "source": "Google News Business", "pub_date_str": "24 Sep 2026, 10:32 PM IST", "pub_date_relative": "10m ago"}, {"title": "What recruiters say: The shifting do\u2019s and don\u2019ts of job interviews - The Washington Post", "full_content": "What recruiters say: The shifting do\u2019s and don\u2019ts of job interviews The Washington Post Is It Unprofessional to Bring Iced Coffee to a Job Interview? The New York Times The Workplace War Over Iced Lattes Isn't About Coffee Bloomberg.com Gen Z's iced coffee habit in interviews could be costing them jobs, recruiters warn: 'It isn't really about coffee' Fortune Finn McRedmond: From the generation that brought us quiet quitting, the great iced coffee debate The Irish Times", "source": "Google News Business", "pub_date_str": "24 Sep 2026, 10:25 PM IST", "pub_date_relative": "16m ago"}, {"title": "Student loan borrowers sue Trump administration over forgiven debts on credit reports", "full_content": "A group of student loan borrowers sued the Trump administration on Thursday, alleging they suffered unexpected financial damages despite getting their debts forgiven years ago.\n\nThe borrowers said in their lawsuit, Woods v. U.S. Department of Education, filed in the U.S. District Court for the District of Columbia, that the department continues to report their canceled federal student loans to credit reporting companies as active. The inaccurate credit reports can affect borrowers' ability to obtain mortgages, rental housing, auto loans and employment, according to The Project on Predatory Student Lending, which is serving as counsel for the plaintiffs.\n\n\"These borrowers have done everything asked of them, but this false debt is still shaping where they can live, what they can borrow, and what their futures look like,\" said Eileen Connor, the president and executive director of PPSL.\n\nThe proposed class-action lawsuit involves borrowers whose federal student loan debts were cleared during the Biden administration between April 2022 and January 2025 because they attended a fraudulent or misleading college. The borrowers allege that, despite that relief, the Education Department still reports their debts to the major credit reporting companies, including Equifax , Experian and TransUnion .\n\nOne of the plaintiffs in the case, Jorge Cortes, is a Marine veteran who had his student loans from the ITT Technical Institute forgiven in August 2022, according to the court filing.", "source": "CNBC Top News", "pub_date_str": "24 Sep 2026, 10:19 PM IST", "pub_date_relative": "22m ago"}, {"title": "Oracle sends 'force majeure' notice about data center project \u2014 stock sinks 4%", "full_content": "Oracle shares fell 4% on Thursday following news that the company sent a \"force majeure\" notice tied to its New Mexico data center project to protect itself from higher expenses.\n\n\"Project Jupiter remains on our planned schedule,\" Oracle said in a statement to CNBC. \"We are fully committed to New Mexico and confident in our path forward.\"\n\nBloomberg was first to report the news, citing sources familiar with the matter.\n\nThe company is looking to delay payment on the campus, dubbed Project Jupiter, if it fails to come online as expected in 2028, according to the report.\n\nOracle sent the notice to the developer, which is a unit of Blue Owl Capital , CNBC confirmed. Blue Owl also saw its shares fall on Thursday.\n\n\"This notice does not change the financial commitments to this multi-year project,\" Blue Owl Capital said in a statement to CNBC.\n\nThe New Mexico data center project, which is part of the broader Stargate artificial intelligence infrastructure build-out with President Donald Trump , has been riddled with setbacks and regulatory hurdles.\n\nThat includes local opposition to data centers ahead of the upcoming midterm elections and concerns from environmental groups.", "source": "CNBC World Economy", "pub_date_str": "24 Sep 2026, 10:18 PM IST", "pub_date_relative": "23m ago"}, {"title": "My husband and I are in our 50s and have no kids. We have $2 million in IRAs and 401(k)s. Do we really need a will?", "full_content": "\u201cWe have no debt and own our primary home, a vacation home, as well as my mother\u2019s home in another state.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "24 Sep 2026, 10:15 PM IST", "pub_date_relative": "27m ago"}, {"title": "Trump-Xi summit in Washington begins with great fanfare but low expectations", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Sep 2026, 10:13 PM IST", "pub_date_relative": "28m ago"}, {"title": "Analysis-Trump-Xi meeting outside UN spotlight tests world body\u2019s clout", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Sep 2026, 10:12 PM IST", "pub_date_relative": "29m ago"}, {"title": "Oracle\u2019s stock is falling as investors fear a data-center setback", "full_content": "A recent report noted that Oracle is looking to protect itself from paying some expenses if a high-profile data-center project gets delayed.", "source": "MarketWatch Top Stories", "pub_date_str": "24 Sep 2026, 10:12 PM IST", "pub_date_relative": "30m ago"}, {"title": "Sebi revamps accredited investors framework; approves common ad code for mkt intermediaries", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Sebi revamps accredited investors framework; approves common ad code for mkt intermediaries The Economic Times daily newspaper is available online now. Read Today's Paper Sebi revamps accredited investors framework; approves common ad code for mkt intermediaries SECTIONS Sebi revamps accredited investors framework; approves common ad code for mkt intermediaries PTI Last Updated: Sep 24, 2026, 10:11:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Sebi has widened the definition of accredited investors by introducing new asset criteria for individuals and corporates. The board approved a common advertisement code that allows celebrity endorsements for brand promotions while restricting specific product advertisements. Furthermore, the agency introduced a new settlement scheme for non-genuine trades in illiquid stock options. Changes aim to simplify accreditation procedures and encourage listing of non-convertible debt securities.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "24 Sep 2026, 10:11 PM IST", "pub_date_relative": "31m ago"}, {"title": "EquipmentShare stock falls 6% after short seller report", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Sep 2026, 10:09 PM IST", "pub_date_relative": "32m ago"}, {"title": "Earnings call transcript: Solaria posts record H1 2026 results as stock falls 6.5%", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Sep 2026, 10:09 PM IST", "pub_date_relative": "33m ago"}, {"title": "New York sues Polymarket U.S., two months after filing lawsuit against Kalshi", "full_content": "New York State filed suit against Polymarket U.S. on Thursday, nearly two months after the state sued the platform's competitor, Kalshi.\n\n\"By skirting New York's laws, Polymarket is targeting the most vulnerable and depriving New York families of critical services and support,\" state Attorney General Letitia James said in a statement.\n\nThe lawsuit claims Polymarket operates an illegal gambling platform and is in violation of state gambling laws, including having no license with the New York State Gaming Commission. The lawsuit further claims Polymarket allows activity by users over 18 and cited a report from the state's Office of Addiction Services and Supports that those between 18 and 24 are at \"high-risk\" of gambling addictions.\n\n\"By running an unlicensed gambling operation, Polymarket has done more than just knowingly violate state law, they have put New Yorkers at risk, especially those underage who are most vulnerable to problem gaming,\" Governor Kathy Hochul said in a statement.\n\nThe lawsuit asks for penalties, including three times the amount of any Polymarket gains, and to pay $100,000 for each attempt or offer of \"sports wagering or mobile sports wagering\" in New York. The lawsuit also asks Polymarket U.S. to provide an account of all trades placed on the platform, the money lost by users and the amount Polymarket U.S. earned.\n\nPolymarket U.S. debuted in December 2025 and is regulated by the Commodity Futures Trading Commission, the federal agency that regulates prediction markets platforms. The company also runs an offshore predictions platform, which was founded in 2020. The CFTC has not responded to a request for comment.\n\nThe lawsuit is the latest in the escalating regulatory feud between states and the platforms. The CFTC has retaliated, suing several states and asserting it has the right to regulate the markets.\n\nPolymarket defended itself against the latest New York action.", "source": "CNBC Top News", "pub_date_str": "24 Sep 2026, 10:07 PM IST", "pub_date_relative": "35m ago"}, {"title": "Do this one thing to help prevent your parents from being scammed", "full_content": "\u201cI felt like I was talking to a robot,\u201d said one adviser about a client who was ensnared in a romance scam.", "source": "MarketWatch Top Stories", "pub_date_str": "24 Sep 2026, 10:06 PM IST", "pub_date_relative": "36m ago"}, {"title": "White House allows blocked reporters in after judge lifts Trump ban", "full_content": "The White House on Thursday began readmitting journalists from three media outlets \u2014 MS NOW, CNN and Politico \u2014 after a federal judge temporarily lifted President Donald Trump 's ban on those outlets.\n\nThe move came after Secret Service officers initially barred some journalists from those outlets from entering the White House earlier Thursday despite the judge's order.\n\nJudge Timothy Kelly ordered Trump and other defendants in a lawsuit by the outlets to respond by 12:30 pm. ET to their new court filing notifying him of non-compliance with his temporary restraining order against the president's ban .\n\nThe White House's director of operations responded to Kelly with a declaration that said the White House had restored press passes to the affected outlets.\n\nKelly issued his restraining order, which will last for at least two weeks, late Wednesday night. It directed the White House to \"immediately\" restore access to the three outlets.\n\nThe outlets had been blocked from entering the White House since Saturday, a day after Trump announced his ban.\n\nThe president had initially said he was blocking the outlets from the White House because of \"cumulative stories\" that contained lies about him and his administration.\n\nThe outlets in their civil complaint said that statement by Trump, and subsequent ones, bolstered their claim that he was violating their First Amendment rights to a free press by targeting them for what they reported about him.", "source": "CNBC Top News", "pub_date_str": "24 Sep 2026, 10:03 PM IST", "pub_date_relative": "38m ago"}, {"title": "Hyundai expected to outsell Ford in third quarter as Detroit automakers lack hybrids", "full_content": "DETROIT \u2014 Hyundai Motor is expected to outsell Ford Motor in quarterly sales for the first time ever, according to a new forecast released Thursday by Cox Automotive.\n\nThe South Korean automaker is expected to report a 6.5% increase in year-over-year sales from July through September to 511,421 units. That compares with an expected 7.1% decline for Ford over the third quarter to 504,172 new vehicles sold, according to Cox predictions.\n\nThe expected leaderboard change would make Hyundai the third best-selling automaker in the U.S. behind General Motors and Toyota Motor.\n\nThat change comes as new vehicle sales have been stronger than expected this year. Cox on Thursday raised its 2026 forecast by roughly 2%, to 16.1 million units.\n\n\"The automotive market this year has been pretty resilient,\" Jeremy Robb, Cox chief economist, said Thursday during a media call. \"New and used sales are both down year over year, but they're not down really that much.\"\n\nHyundai, including its luxury Genesis brand and corporate sibling Kia, has been making major inroads in the U.S. this year. Ford, meanwhile, has struggled with production of its crucial F-Series pickup trucks following two supplier fires last year that disrupted production and sales.\n\nHyundai CEO Jos\u00e9 Mu\u00f1oz told CNBC last month that topping Ford in U.S. sales isn't a goal but if it happens, it's because of the company's continued focus on products and execution.\n\n\"We focus on delivering, the best, safe products to the customer with the highest possible quality,\" Mu\u00f1oz said, noting the company is No. 3 in sales globally. \"And we end up achieving unbelievable goals.\"", "source": "CNBC Top News", "pub_date_str": "24 Sep 2026, 10:03 PM IST", "pub_date_relative": "38m ago"}, {"title": "Oil sharply pares gains after report says U.S. and Iran discussing phased deal", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Sep 2026, 10:02 PM IST", "pub_date_relative": "39m ago"}, {"title": "Why is Whitecap Resources stock rallying today?", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Sep 2026, 10:02 PM IST", "pub_date_relative": "40m ago"}], "cfa": [{"title": "Philadelphia Fed's Anna Paulson says 'modest' rate moves likely ahead to tame inflation", "full_content": "Philadelphia Federal Reserve President Anna Paulson said Thursday that she and her colleagues may need to raise interest rates further to bring inflation back to target.\n\nSpeaking a week after the Federal Open Market Committee raised benchmark borrowing rates by a quarter percentage point, Paulson said inflation trends are still worrying.\n\nThe rate hike, which took the key funds rate to a target range of 3.75%-4%, \"brings policy closer to what I believe is needed to return inflation to 2% at a pace that balances inflation with risks to the labor market. Looking ahead, if conditions evolve as I expect, some modest further tightening may be warranted.\"\n\nThough the summer showed some moderating in price pressures, she said underlying inflation is still running around 2.5%-3%, \"well above our 2% target, and the gap has shown little signs of closing.\"\n\n\"The best I can say about underlying inflation this year is that it hasn't gotten worse,\" Paulson said in prepared remarks for a fintech conference in her home district. She noted that inflation has held higher even outside of the oil supply shocks from the Iran war and tariffs.\n\nOutside of inflation, Paulson said economic output \"has been solid\" while the labor market is \"holding steady.\"\n\nThe comments come as markets have raised their expectations for Fed tightening dramatically.\n\nAnother leg up this week has taken longer-duration Treasury yields to highs not seen since 2004. Traders are now pricing in a 64% chance the FOMC hikes again in October, then expect another move in January, according to the CME Group's FedWatch tool. Fed funds futures contracts are implying a rate of 4.8% by the end of 2027, which would indicate the expectation of as many as four quarter-point increases ahead.", "source": "CNBC Finance", "pub_date_str": "24 Sep 2026, 10:41 PM IST", "pub_date_relative": "just now", "cfa_topics": ["Economics", "Fixed Income", "Derivatives", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Top stocks to buy tomorrow: Vaishali Parekh picks three stocks - GAIL, Texmaco Rail, HBL Engineering; market outlook", "full_content": "Vaishali Parekh, Vice President \u2013 Technical Research at Prabhudas Lilladher, has recommended three stocks for intraday trading on September 25, with GAIL, Texmaco Rail and HBL Engineering among her picks. Her recommendations include specific buy levels, targets and stop-loss levels for each stock.\n\nThe Indian stock market suffered heavy losses in Thursday\u2019s trade, September 24, with the headline indices closing more than 1.5% lower, erasing their recent gains and falling below key psychological levels. Investor sentiment was hit by surging global bond yields and volatility in crude oil prices.\n\nThe Nifty 50 plunged 1.64% to settle at 25,169.50, while the Sensex finished at 73,580, down     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
