    const allData = {"general": [{"title": "Hurricane Trudy strengthens to a Category 3 storm off Mexico's Pacific coast", "full_content": "Hurricane Trudy strengthened to a major, Category 3 hurricane and forecasters said the storm was headed to the southwestern and west-central areas of Mexico's Pacific coast.\n\nEarly Friday, Trudy was about 240 miles (385 kilometers) southwest of Acapulco, Mexico, and about 335 miles (535 kilometers) south-southeast of Manzanillo, Mexico, with maximum sustained winds of 120 mph (195 kph) while moving northwest at 6 mph (9 kph), the U.S. National Hurricane Center in Miami reported.\n\nA hurricane warning was in effect for Mexico's coast from Cabo Corrientes northward to Punta San Telmo, while a tropical storm warning was issued from Zihuatanejo up the coast to Manzanillo, the center said.\n\nTo the northwest of Trudy, Tropical Storm Simon had 75 kph (45 mph winds) and was forecast to weaken to a remnant low soon.\n\nAlso in the Pacific, Tropical Storm Champi was east of Guam on Friday, moving west-northwest at 12 mph (19 kph) with maximum sustained winds increasing to 52 mph (86 kph), according to the U.S. Weather Service and the U.S. Navy's Meteorology and Oceanography Command website.\n\nA typhoon warning was issued for Guam and Rota, along with a tropical storm warning for Tinian, Saipan and nearby areas.", "source": "CNBC Top News", "pub_date_str": "16 Oct 2026, 06:06 PM IST", "pub_date_relative": "1m ago"}, {"title": "Fed's Warsh withholds rate signal, praises recent global tightening", "full_content": "BANGKOK \u2014 Federal Reserve Chairman Kevin Warsh refrained from signaling whether there will be another interest rate hike again this month, while acknowledging a \"synchronous tightening\" by central banks around the world.\n\n\"I don't prejudge meetings. I don't believe in saying now what I might do at the meetings that we have in the balance of this year,\" Warsh said, reiterating his opposition to the use of forward guidance for markets that should rely on interpreting data.\n\nHe also acknowledged that stance may disappoint anyone who had hoped for a steer ahead of the central bank meeting later this month. \"It's a new chapter at the Fed [and] we're not in that business anymore,\" he said.\n\nWarsh spoke at a fireside chat with the International Monetary Fund's managing director, Kristalina Georgieva, as part of the weeklong IMF-World Bank Annual Meetings in Bangkok on Friday.\n\n\"Alongside other recent comments from FOMC participants, Warsh's comments indicate that the FOMC is set to pause in October,\" Goldman Sachs economists led by Jan Hatzius wrote in a note. \"We continue to expect a second and final hike in December.\"\n\nS&P 500 and Nasdaq futures edged higher following the speech, while stock market indexes in Asia and Treasury yields were largely stable.\n\nWarsh described the global shift toward tighter monetary policy as a common fight on prices. Central banks made their own choices under their own mandates, he said, but the result was \"a synchronous tightening in monetary policy in most places around the world,\" which means \"there's no free riders.\"\n\nSurging energy costs stemming from the Iran war and artificial intelligence investment boom are stoking inflation and pushing up borrowing costs around the world, just as global public debt is on pace to exceed 100% of the world's GDP, a level last breached in the aftermath of World War II.", "source": "CNBC Top News", "pub_date_str": "16 Oct 2026, 06:06 PM IST", "pub_date_relative": "1m ago"}, {"title": "Pulse of the Street: Best week since April puts recovery to the earnings test", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nIndian stocks have staged their strongest weekly rally since April, but the rebound has yet to broaden beyond the largest companies. A sharp rally in information technology (IT) stocks, and a firmer rupee lifted benchmarks, while foreign investors continued to sell and crude oil above $100 a barrel kept pressure on corporate earnings.\n\nThe Sensex gained 3.13% and the Nifty 50 rose 2.79% in the week ended 16 October, their biggest weekly advances since the week ended 10 April. On Friday, the Sensex climbed 0.56% to 74,729.27, while the Nifty advanced 0.65% to 23,146.15.\n\nThe gains extended the previous week's rebound, which broke an eight-week losing streak. The challenge now is to turn that recovery into a broader advance backed by earnings rather than sentiment alone.\n\nThe Indian rupee strengthened to \u20b9 94.96 against the dollar on Friday from \u20b9 96.74 a week earlier, easing currency pressures.\n\nSanjit Singh Paul, smallcase manager and managing director at Modulor Capital, attributed the rebound to Reserve Bank of India (RBI) measures supporting the rupee, softer US yields, positive IT results and domestic institutional buying. The RBI opened a special dollar window for oil companies, diverting their demand from the spot market, and tightened currency-hedging rules.\n\nBut the stock-market rally has yet to spread across the broader market. The BSE LargeCap index gained 1.85% during the week, outpacing the MidCap index's 0.99% rise, while the SmallCap index slipped 0.02%.\n\nPaul cautioned that midcap, smallcap and microcap stocks had not kept pace with the benchmark rally. \u201cThe current move is definitely worth watching, but has not established itself as sustainable,\u201d he said.", "source": "LiveMint Markets", "pub_date_str": "16 Oct 2026, 06:02 PM IST", "pub_date_relative": "5m ago"}, {"title": "Phoenix Suns owner Mat Ishbia predicts team will win opening round playoff series \u2014 and the NBA season hasn't even started", "full_content": "The CNBC Sport newsletter with Alex Sherman brings you the biggest news and exclusive interviews from the worlds of sports business and media, delivered weekly to your inbox.\n\nMat Ishbia says owning the NBA's Phoenix Suns and the WNBA's Phoenix Mercury isn't enough \u2014 winning is what he really wants.\n\nIshbia has owned the Suns and the Mercury since 2023. He and his brother, Justin, own a minority stake in MLB's Chicago White Sox. Justin will take over as controlling owner of the Sox in the coming years .\n\nBut unlike billionaires such as Stan Kroenke, Josh Harris and John Henry, who all own multiple teams, Ishbia says he's not interested in building a sports conglomerate. He's only interested in buying teams if he thinks he can move the needle on winning.\n\n\"I have different goals. Those guys are obviously doing great things. But my view is not to be some sports empire,\" Ishbia told CNBC Sport in an exclusive interview. \"I'm not making investments in sports. I'm buying a team that I can impact and help win and help compete and do some cool things with the fans.\"\n\nThat's not a common message among many sports investors these days, who seem to be desperate for ways to put their money into live sports teams even as valuations climb higher and higher.\n\nIshbia said that as the owner of both the Suns and the Mercury he's extremely hands-on. \"I'm very active in the Phoenix Suns and Phoenix Mercury at a high, high level right now, and I get very much in the weeds,\" he told me. \"If I can't impact it in a positive way, I'm not going to do it. So I'm not just making investments here and there.\"\n\nThat puts pressure on Ishbia to deliver. The Mercury made the WNBA Finals in 2025 but fell back to 16-28 this year, making them one of the worst teams in the league.", "source": "CNBC Top News", "pub_date_str": "16 Oct 2026, 05:54 PM IST", "pub_date_relative": "12m ago"}, {"title": "LTM Q2 Results: PAT remains flat at Rs 1,380 crore; revenue rises 14% YoY; co declares Rs 25 per share dividend", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a Earnin ub_date_relative": "15m ago"}, {"title": "Indonesian Stocks Plunge on Threat to Drop Market From Major Indexes - The New York Times", "full_content": "Indonesian Stocks Plunge on Threat to Drop Market From Major Indexes The New York Times Indonesia gets 'wake-up call' as MSCI prepares to expel it from global indexes Reuters Indonesia Stocks Log Worst Day Since 1998 on MSCI Downgrade Warning WSJ Why is the Jakarta Stock Exchange Composite Index collapsing today? Investing.com What Happens If Indonesia Is Removed From MSCI\u2019s Global Indexes? Bloomberg.com", "source": "Google News Business", "pub_date_str": "16 Oct 2026, 05:48 PM IST", "pub_date_relative": "19m ago"}, {"title": "Elon Musk cash infusion helps GOP Senate super PAC raise record $273 million", "full_content": "The Senate Leadership Fund , the Republican Party's leading Senate super PAC, posted the largest quarterly haul in its history and entered the final weeks before the Nov. 3 midterm election with more than $155 million in cash, according to a new Federal Election Commission filing Thursday.\n\nThe SLF brought in $272.9 million from July through September, including $209.7 million from donors \u2014 including. Tesla and SpaceX CEO Elon Musk , who supplied the bulk of that money\n\nMusk poured $158 million into the SLF in September through an affiliated Texas PAC created to support Republican Ken Paxton. His two contributions of $75 million and $83 million are among the largest political donations ever.\n\nMusk's contribution alone also exceeded the Democratic Senate Majority PAC's entire third-quarter fundraising. That super PAC reported raising a record $151 million during the period and ended September with $111.8 million in cash, which the group said was its third-quarter record. The super PAC's FEC filings are not yet available.\n\nThe SLF's haul shattered its own previous records. The group brought in nearly $116 million in the third quarter of 2024 and $111 million in 2022. In 2020, when it filed monthly reports , SLF took in roughly $157 million from July through September . Its previous quarterly high was roughly $216 million in the final three months of 2020, according to a CNBC review of FEC filings.\n\nThe record influx gives Republicans a sizable financial cushion as they fight to preserve their 53-seat Senate majority across the country that has become increasingly defensive in the closing weeks of the election.\n\nThe SLF paused additional advertising in perennial battleground North Carolina this month after spending more than $30 million there \u2014 according to AdImpact data \u2014 and redirected resources toward Kansas , where Republican Sen.", "source": "CNBC World Economy", "pub_date_str": "16 Oct 2026, 05:47 PM IST", "pub_date_relative": "20m ago"}, {"title": "Cantor Fitzgerald reiterates Varonis stock rating on acquisition news", "full_content": "", "source": "Investing.com News", "pub_date_str": "16 Oct 2026, 05:46 PM IST", "pub_date_relative": "20m ago"}, {"title": "Rosenblatt maintains Neutral on Netflix stock amid layoffs, exec change", "full_content": "", "source": "Investing.com News", "pub_date_str": "16 Oct 2026, 05:46 PM IST", "pub_date_relative": "20m ago"}, {"title": "Wedbush analyst Dan Ives maintains GameStop stock rating on collectibles shift", "full_content": "", "source": "Investing.com News", "pub_date_str": "16 Oct 2026, 05:46 PM IST", "pub_date_relative": "20m ago"}, {"title": "PHSC chair Lorraine Young to step down by year-end", "full_content": "", "source": "Investing.com News", "pub_date_str": "16 Oct 2026, 05:46 PM IST", "pub_date_relative": "21m ago"}, {"title": "Europe's answer to SpaceX pops 19% as Ukraine's Starshield limits raise concerns", "full_content": "Shares of French Satellite Group Eutelsat soared this week as SpaceX 's Starshield drew criticism after the Ukrainian military's access to its systems was suddenly restricted.\n\nEarlier this week, tensions rose between the U.S. and Ukraine after Kyiv accused Elon Musk's SpaceX of imposing new restrictions on its military-grade Starlink internet service without warning, curbing connectivity and limiting Ukraine's ability to defend itself against Russian attacks.\n\nUkraine's President Volodymyr Zelenskyy criticized the U.S., saying \"Starlink was switched off\" in the middle of the night, preventing Ukrainian drones from intercepting Russian attacks, and ultimately contributing to civilian deaths.\n\n\"They knew what they did,\" Zelenskyy said. \"It's not about attack. It's also about defending the lives\u2026 People were killed because not enough destroying, not enough interceptors, including interceptors with Starlink, which didn't work.\"\n\nSpaceX CEO Elon Musk responded by shifting blame on the U.S. government and said that Starshield systems were under Washington and President Donald Trump's control.\n\nEutelsat shares rose 19% on Friday, and was up 25% over the past five days following the news of Starlink's struggles in Ukraine.\n\nEutelsat shares over the past five days. Eutelsat's share move this week is more evidence \"supporting the sovereign value of European Satellite networks,\" Deutsche Bank analysts said in a note Thursday. Markets viewed Eutelsat as \"the credible Starlink alternative\" amid the disruption, they added. \"Whilst we note Eutelsat does offer a global LEO [Low Earth Orbit] constellation, we believe it lacks the scale to offer the number of terminals that Starlink can provide,\" they added. \"We would expect the shares to give up some of the gains.\"\n\nEutelsat consolidated with satellite internet provider OneWeb in 2023, looking to challenge Starlink's market dominance.", "source": "CNBC World Economy", "pub_date_str": "16 Oct 2026, 05:46 PM IST", "pub_date_relative": "21m ago"}, {"title": "Why is CoreWeave stock sliding today?", "full_content": "", "source": "Investing.com News", "pub_date_str": "16 Oct 2026, 05:45 PM IST", "pub_date_relative": "22m ago"}, {"title": "Dividend champions of auto ancillaries: Majestic Auto, PTL, or Banco Products - Who drives home the highest yield?", "full_content": "Dividend champion of auto ancillaries: Majestic Auto, PTL Enterprises, and Honda India Power are some of the key auto ancillary companies with attractive dividend yield. For investors who prefer to pick stocks with high annual yield for constant income, here\u2019s a comparison of dividends by these auto ancillary companies.\n\nMajestic Auto paid an annual dividend per share of \u20b9 60 over the last twelve months. With this, its annual dividend yield stood at 16.21%.\n\nThe auto ancillary stock ended 2.09% lower at \u20b9 370.10 per share on BSE with a market capitalisation of \u20b9 384.81 crore. The auto ancillary stock has delivered 17.36% return in six months, 7.43% return in 2026 so far, and around 11.17% return in one year.\n\nPTL Enterprises has paid an annual dividend of \u20b9 2.5 per equity share in last one year. Its annual dividend yield stood at 6.5%. The stock closed 0.18% lower at \u20b9 38.72 per share on BSE with an Mcap of \u20b9 512.56 crore on Friday. PTL Enterprises share price value has declined 3.03% in three months, 3.22% in one year, and around 10.58% in two years.\n\nBanco Products has declared nearly 36 dividends since 2001. The company has announced an equity dividend of \u20b9 23 per equity share in 2026. With this, its dividend yield stood at 3.79%.\n\nBanco Products India share price closed 0.46% lower at \u20b9 604.50 per share on BSE on Friday. Its share price value has declined at 18.57% in one year, but surged 66.12% in two years, and jumped around 150.99% in three years.\n\nMajestic Auto has the highest annual dividend yield for last one year, followed by PTL Enterprises and Banco Products. Investors must note that the high dividend yield of Majestic Auto is due to one-time special dividend paid by the two firms.\n\nCatch all the Business News , Market News , Breaking News Events and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.", "source": "LiveMint Markets", "pub_date_str": "16 Oct 2026, 05:44 PM IST", "pub_date_relative": "22m ago"}, {"title": "Raising bank tax is not best choice for UK budget, IMF says", "full_content": "", "source": "Investing.com News", "pub_date_str": "16 Oct 2026, 05:42 PM IST", "pub_date_relative": "24m ago"}, {"title": "Lockheed Martin delivers C-130J for Navy nuclear command mission", "full_content": "", "source": "Investing.com News", "pub_date_str": "16 Oct 2026, 05:42 PM IST", "pub_date_relative": "25m ago"}, {"title": "Royalty Pharma declares $0.235 Q4 dividend, payable Dec. 10", "full_content": "", "source": "Investing.com News", "pub_date_str": "16 Oct 2026, 05:42 PM IST", "pub_date_relative": "25m ago"}, {"title": "Cantor Fitzgerald raises Bentley Systems stock price target on infrastructure demand", "full_content": "", "source": "Investing.com News", "pub_date_str": "16 Oct 2026, 05:40 PM IST", "pub_date_relative": "26m ago"}, {"title": "India to reach 100 billion dollar of bilateral trade with Russia by 2030: Ambassador Vinay Kumar", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a India to reach 100 billion dollar of bilateral trade with Russia by 2030: Ambassador Vinay Kumar The Economic Times daily newspaper is available online now. Read Today's Paper India to reach 100 billion dollar of bilateral trade with Russia by 2030: Ambassador Vinay Kumar SECTIONS India to reach 100 billion dollar of bilateral trade with Russia by 2030: Ambassador Vinay Kumar ANI Last Updated: Oct 16, 2026, 05:39:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India is pursuing negotiations for a Free Trade Agreement with the Eurasian Economic Union to increase exports. Indian Ambassador to Russia Vinay Kumar stated that bilateral trade is projected to reach USD 100 billion by 2030. The current trade turnover is reported at USD 38 billion for the first half of this year. Efforts are underway to diversify India's export basket and improve market access in Russia.\n\nUS mid-term elections \u2013 Part 2: What does it mean for Trump to lose control of Congress?\n\nThe ABCD of the US mid-term elections \u2013 Part 1: Why it matters across the globe\n\nCurbing rupee bets: What the RBI\u2019s new rules mean for the hedge-now-or-wait question\n\nBrinjal, buffalo, bacteria: Inside India\u2019s pay-for-nature system\n\nHomebuyers wait as NCLT panel picks holes in unfinished Jaypee projects\n\nThe NBFC saga - Part 3: How one default in 2018 changed the way RBI reads risk\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "16 Oct 2026, 05:39 PM IST", "pub_date_relative": "28m ago"}, {"title": "Futures Mixed; Tesla Flies As Anthropic Value Questioned - Investor's Business Daily", "full_content": "Futures Mixed; Tesla Flies As Anthropic Value Questioned Investor's Business Daily S&P 500 Futures Gain After Warsh\u2019s Remarks; Chip Stocks Extend Slide Barchart.com Why Are Nasdaq Futures Edging Higher Premarket? TSLA, CRWV, TSM, NVDA, RKLB, ASST, PEP Stocks In Focus Yahoo Finance Stocks to Watch: CoreWeave, Tesla, Netflix WSJ US futures mostly higher with the Fed's Warsh touting AI LancasterOnline", "source": "Google News Business", "pub_date_str": "16 Oct 2026, 05:39 PM IST", "pub_date_relative": "28m ago"}, {"title": "S&P 500 futures tick higher, but index heads for losing week: Live updates", "full_content": "S&P 500 futures rose slightly on Friday, as traders headed for a mostly losing week amid declines in tech and artificial intelligence-related names.\n\nFutures tied to the broad market average traded 0.2% higher, while Nasdaq-100 futures teetered around the flat line. Futures linked to the Dow Jones Industrial Average gained 61 point, or 0.1%.\n\nTesla shares rose 3% after the electric vehicle maker unveiled its next-generation roadster. To be sure, the model won't go into production until 2028.\n\nChipmakers were lower again, however. The VanEck Semiconductor ETF (SMH) shed 0.7%, led by declines in Micron, AMD and Sandisk. Semiconductors have struggled this week amid jitters about competition from China . The SMH is down 7.4% week to date heading into Friday's open.\n\nThose declines, coupled with drops in other stocks linked to artificial intelligence, put the S&P 500 on pace for a losing week. The benchmark index is down 0.9% this week, while the Nasdaq has shed 2.4%.\n\n\"One of the real challenges we've had in AI and technology overall for the last six to 12 months is that so much of what's happening is happening in private markets,\" Jeff Richards, managing partner at Notable Capital, told CNBC's \" Closing Bell \" on Thursday. He noted that AI-linked companies like Anthropic and OpenAI, among others, going public could help assuage investor concerns.\n\n\"Once we get more of the information out there \u2013 analyst coverage, detailed information on core metrics \u2013 into the market over the course of '27, I think a lot of those fears will ease,\" he said.\n\nOutside of tech, investors have been grappling with hotter-than-expected inflation data, which has been exacerbated by elevated energy prices in the wake of the U.S.-Iran war. Wholesale inflation this week saw its biggest gain since 2022 , while consumer inflation remained well above the Federal Reserve's target of 2%.", "source": "CNBC Top News", "pub_date_str": "16 Oct 2026, 05:35 PM IST", "pub_date_relative": "31m ago"}, {"title": "S&P 500 futures tick higher, but index heads for losing week: Live updates - CNBC", "full_content": "S&P 500 futures tick higher, but index heads for losing week: Live updates CNBC Stock market today: Dow, S&P 500, Nasdaq futures mixed amid volatile week Yahoo Finance Wall St futures mixed as tech wobbles again, Tesla gains Reuters Chipmaker sell-off sends investors to other stocks and bonds for safety CNN Wall Street muscles higher despite more swings for AI stocks AP News", "source": "Google News Business", "pub_date_str": "16 Oct 2026, 05:35 PM IST", "pub_date_relative": "32m ago"}, {"title": "Is Apple\u2019s foldable iPhone Duo worth $2,000? See how it stacks up against other foldable phones.", "full_content": "Preorders for the iPhone Duo began Friday, marking Apple\u2019s debut in a foldable phone market largely dominated by Samsung and Google.", "source": "MarketWatch Top Stories", "pub_date_str": "16 Oct 2026, 05:30 PM IST", "pub_date_relative": "37m ago"}, {"title": "Tesla unveils long-delayed Roadster, showing off its flying-car ambitions", "full_content": "Tesla showed off its long-delayed next-generation Roadster on Thursday, almost a decade after Elon Musk's company started taking deposits for the electric sports car.\n\nThe event was livestreamed from a SpaceX test site in McGregor, Texas, near Waco, starting at 7:55 p.m. local time, or 8:55 p.m. ET. In attendance along with Musk were design leader Franz von Holzhausen and Lars Moravy, vice president of vehicle engineering.\n\n\"You're going to see some crazy stuff tonight,\" Musk said. \"You're going to see the results of what happens when you have a collaboration with the world's best car company and the world's best rocket company.\"\n\nTesla's original Roadster, designed and engineered by a team led by founding CEO Martin Eberhard, was based on a Lotus Elise chassis and was first delivered in 2008, selling for roughly $100,000 in small volumes until 2012.\n\nThe next-generation Roadster is expected to be a high-end, low-volume model that relies on SpaceX technology to enable it to hover. While Musk fanatics expressed their excitement on social media, the Roadster isn't likely to have any material financial impact on the company.\n\nAt the event, Musk and his team showcased a white sports car that raced up a curved ramp, then clung to it upside down and vaulted off it, flipping in mid-air and hovering slowly before landing on the ground.\n\nThe two-seater can go from zero to 60 miles per hour in under a second, according to Tesla's timer, a feat Moravy demonstrated for the live audience.\n\nMusk said the next-generation Roadster would enter production in 2028. The price wasn't announced, and the company didn't disclose specifications about other performance-level variants of the new Roadster.", "source": "CNBC World Economy", "pub_date_str": "16 Oct 2026, 05:27 PM IST", "pub_date_relative": "39m ago"}, {"title": "Battered Indian IT stocks rally as AI fears ease and global tech sells off", "full_content": "Bengaluru: India\u2019s beaten-down information technology (IT) stocks are rebounding as fears that artificial intelligence (AI) will disrupt traditional tech services ease and investors rotate out of a global tech sell-off, even after a weak September quarter for the sector\u2019s biggest names.\n\nShares of India\u2019s four of five largest IT services companies rose by as much as 8% on Friday, extending gains even after a muted September quarter. Three of the top four, Tata Consultancy Services Ltd (TCS), HCL Technologies Ltd and Wipro Ltd, posted their weakest September-quarter performance in three years.\n\nThe rally came as technology stocks sold off in South Korea, with the Kospi\u2019s 14% decline this week pointing to a shift in global investor positioning. Easing concerns over AI and a rotation in global tech investments appear to be lifting sentiment toward Indian IT, whose valuations had been under pressure since the AI boom stoked disruption fears.\n\nAI stocks have come under pressure in recent days amid concerns that slowing revenue growth, rising infrastructure costs and tighter financing conditions could undermine lofty valuations. The Nasdaq 100 has fallen 3% since Monday. Sentiment also got a lift from finance minister Nirmala Sitharaman\u2019s remarks earlier this week that she was open to views on taxation in capital markets.\n\n\u201cOne of the factors may be the finance minister\u2019s comments that foreign portfolio investors may be exempted from capital gains tax.", "source": "LiveMint Markets", "pub_date_str": "16 Oct 2026, 05:23 PM IST", "pub_date_relative": "43m ago"}, {"title": "Nifty, Sensex investors alert! US bond yields remain above 5% - 5 ways this could impact your investments, portfolio", "full_content": "US Bond Yield Rise : The sharp reversal in US Treasury yields has drawn attention to the outlook for global financial markets, with implications for capital flows, currencies, borrowing costs and equity valuations.\n\nThe US 10-year Treasury yield retreated from a peak of 5.33% following Wednesday's inflation data to 5.086% by Thursday's close, holding near that level on Friday. The 10-basis-point decline on Thursday marked its biggest single-day fall since August 2025, despite September consumer inflation accelerating to 3.7%, producer prices rising 6.3% year on year, stronger retail sales and crude oil prices remaining above $100.\n\nSandip Jha, Chief Product Officer at Godrej Wealth, cautioned that the decline may not signal a sustained turnaround in the bond market.\n\n\u201cThe decline in US 10-year yields looks more like a tactical correction than a change in the underlying trend. While yields have eased amid risk-off flows and a flight to safe-haven assets, the underlying macro backdrop remains far from supportive of a sustained bond rally. With inflationary pressures expected to remain sticky and economic activity remaining resilient, the fundamental case for a sustained rally in Treasuries remains weak. Unless the macro data begin to soften meaningfully, yields could reverse course and move higher again,\u201d Jha said.\n\nThe US 10-year Treasury yield had climbed from 4.76% at the end of August 2026 to 5.33% on Wednesday, reaching a multi-decade high.\n\nThe increase comes amid elevated crude oil prices , resilient US economic activity, widening fiscal deficits and growing investor demands for higher compensation for holding long-term government debt.", "source": "LiveMint Markets", "pub_date_str": "16 Oct 2026, 05:21 PM IST", "pub_date_relative": "45m ago"}, {"title": "DEE Development Engineers signs framework pact with domestic EPC firm for nuclear power sector", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Companies \u203a DEE Development Engineers signs framework pact with domestic EPC firm for nuclear power sector DEE Development Engineers Share Price The Economic Times daily newspaper is available online now. Read Today's Paper DEE Development Engineers signs framework pact with domestic EPC firm for nuclear power sector SECTIONS DEE Development Engineers signs framework pact with domestic EPC firm for nuclear power sector PTI Last Updated: Oct 16, 2026, 05:20:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis DEE Development Engineers Limited announced a framework agreement with a domestic engineering contractor for the nuclear power sector. This collaboration aims to strengthen its presence in various nuclear power projects across India. The focus will include comprehensive engineering support like design services, budgetary offers, and sourcing of essential components. Indian nuclear energy ambitions are driving the need for reliable engineering expertise and strict quality standards.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "16 Oct 2026, 05:20 PM IST", "pub_date_relative": "46m ago"}, {"title": "India's forex reserves drop by $8.58 billion to $726.03 billion in week ended October 9: RBI", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Indicators \u203a India's forex reserves drop by $8.58 billion to $726.03 billion in week ended October 9: RBI The Economic Times daily newspaper is available online now. Read Today's Paper India's forex reserves drop by $8.58 billion to $726.03 billion in week ended October 9: RBI SECTIONS India's forex reserves drop by $8.58 billion to $726.03 billion in week ended October 9: RBI ET Online Last Updated: Oct 16, 2026, 05:23:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India\u2019s foreign exchange reserves fell by $8.578 billion to $726.027 billion in the week ended October 9, according to data released by the Reserve Bank of India (RBI). The decline followed a $12.952 billion drop in the previous week. Foreign currency assets and gold reserves recorded significant declines, while special drawing rights and India\u2019s reserve position with the IMF also fell.\n\nUS mid-term elections \u2013 Part 2: What does it mean for Trump to lose control of Congress?\n\nThe ABCD of the US mid-term elections \u2013 Part 1: Why it matters across the globe\n\nCurbing rupee bets: What the RBI\u2019s new rules mean for the hedge-now-or-wait question\n\nBrinjal, buffalo, bacteria: Inside India\u2019s pay-for-nature system\n\nHomebuyers wait as NCLT panel picks holes in unfinished Jaypee projects\n\nThe NBFC saga - Part 3: How one default in 2018 changed the way RBI reads risk\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "16 Oct 2026, 05:17 PM IST", "pub_date_relative": "49m ago"}, {"title": "Treasuries head for best week since February as AI jitters halt bond rout", "full_content": "Borrowing costs fall back from highest levels in decades as investors seek safety in government debt", "source": "FT Markets", "pub_date_str": "16 Oct 2026, 05:15 PM IST", "pub_date_relative": "51m ago"}, {"title": "Worst over for IT stocks? Experts analyse Q2 results of TCS, HCL, Tech Mahindra and others, suggest top picks", "full_content": "IT stocks have been on a roll over the last few sessions boosted by better-than-expected Q2 results and selloff in AI stocks globally as investors shift their focus from hype to financial performance and structural outlook. The Nifty IT index surged 3.92% on Friday, 16 October, extending gains for the fourth consecutive session. In just four sessions, the index has jumped nearly 13%.\n\nIT stocks are rising after a prolonged period of stress due to macroeconomic challenges, cautious discretionary spending by clients, and AI-led disruptions.\n\nThe sector remains at a crucial juncture as experts believes, the next leg of growth will depend on translating deal wins into revenue and scaling AI-led services sufficiently to offset productivity-driven deflation in traditional engagements.\n\nThe Q2 numbers of several IT players, including TCS and HCL Tech came better-than-expected.\n\nSumit Pokharna, SVP- Fundamental Research at Kotak Neo, said the demand environment has not materially changed since the last quarter. Discretionary programs without near-term value remain under scrutiny. AI revenue grew faster in BFSI relative to other verticals.\n\n\"Enterprises are investing in (1) AI native business solutions, (2) core modernization with the help of AI, (3) autonomous GBS in horizontal functions such as finance, HR and procurement, (4) modernizing legacy data estate and (5) data foundations. Cybersecurity, AI governance, AI guardrails, tokenomics, orchestration, access controls, security observability, etc. are becoming important for clients, creating a significant and growing opportunity,\" said Pokharna.\n\nAI capabilities continue to improve across the spectrum of skills and tasks. There has been meaningful progress in capabilities in software engineering tasks in the past 6-9 months when measured on performance of AI models on benchmarks. Older benchmarks for software engineering tasks have been saturated.", "source": "LiveMint Markets", "pub_date_str": "16 Oct 2026, 05:15 PM IST", "pub_date_relative": "51m ago"}, {"title": "Stocks making the biggest moves premarket: Tesla, SpaceX, Alcoa, CoreWeave, Travelers & more", "full_content": "These are the stocks posting the largest moves premarket.", "source": "CNBC Finance", "pub_date_str": "16 Oct 2026, 05:13 PM IST", "pub_date_relative": "53m ago"}, {"title": "Nifty IT posts best weekly gain in 18 years as Q2 earnings revive investor interest; which stocks led the rally?", "full_content": "Tech Mahindra, TCS, HCL Technologies, Infosys, and Wipro were among the large-cap IT stocks that ended the week with strong double-digit gains, powered by stronger-than-expected September-quarter performances and a weakening global AI trade that prompted investors to rotate back into the software sector.\n\nSix of the 10 constituents of the Nifty IT index ended the week with gains of over 10%, with Tech Mahindra leading the pack after surging 18.7% as it closed higher in each of the last four trading sessions.\n\nIt was followed by Tata Consultancy Services (TCS), HCL Technologies , Infosys , Wipro , and LTM which ended the week with gains of 18.7%, 17.3%, 16.5%, 16.4%, and 12.1%, respectively.\n\nAmid strong support from heavyweight stocks, the Nifty IT index finished the week with an 11.72% surge, marking its best weekly gain in 18 years. It reclaimed the 30,000 mark and also touched an eight-month high.\n\nThe recovery has also helped the stock recoup nearly half of its 2026 losses, after it had fallen 32%. The index\u2019s year-to-date decline now stands at 15.7%. Alongside, the recovery rally has boosted confidence on Dalal Street, helping the Nifty post its best weekly performance in six months.\n\nThe rally has provided a much-needed boost to a battered sector that had been plagued by fears of AI-driven disruption, concerns over interest rates, and sustained foreign institutional investor (FII) selling, dragging several constituents to multi-year lows.\n\nHowever, the September-quarter results have offered investors some reassurance about the sector\u2019s near-term growth prospects, helping revive sentiment towards IT stocks.\n\nStronger-than-expected performances from major companies have also eased some concerns over slowing demand and the potential impact of artificial intelligence on traditional software services.", "source": "LiveMint Markets", "pub_date_str": "16 Oct 2026, 05:05 PM IST", "pub_date_relative": "1h ago"}, {"title": "I watched Nvidia's Jensen Huang work the room in London. He brought big checks \u2014 and a blunt message", "full_content": "This report is from this week's The Tech Download newsletter. Like what you see? You can subscribe here.\n\nIn an old converted church in West London on Wednesday night, Huang stood on a pop-up stage in front of politicians, investors, tech execs and journalists, announcing the chip giant was taking stakes in five U.K. startups.\n\n\"We're not your largest investor, but we are your best investor,\" he proclaimed. \"I'm gonna invest in you, I'm gonna invest in you,\" he shouted, pointing at the founders. His appearance in London was part of a European tour ahead of Nvidia's GTC event in Berlin next week.\n\nEarlier, he'd searched out U.K. neocloud Nscale CEO Josh Payne in the crowd, declaring, \"last year you were zero.\"\n\n\"Now look at them,\" he said. \"We invested in you, I attracted a whole bunch of investors to you.\" Nscale could be the most valuable British company in a decade, Huang said to cheers from the crowd.\n\nThe warm reception Huang regularly receives is a sign of just how much sway he holds in the AI industry.\n\nNvidia has a near monopoly over the most powerful AI chips and Huang courts tech execs and world leaders with ease. He's a near constant presence at U.S. President Donald Trump's side at state dinners and visits.\n\nIn London, after the pomp and ceremony of Huang's speech, he emerged around 40 minutes late to a media huddle outside the front of the church.", "source": "CNBC Top News", "pub_date_str": "16 Oct 2026, 05:03 PM IST", "pub_date_relative": "1h ago"}, {"title": "\u2018It\u2019s a wait-and-see situation\u2019: I\u2019m 63 and diagnosed with lymphoma. Should I take my Social Security next year?", "full_content": "\u201cMy plan is to continue working as long as I\u2019m able to do so and invest my Social Security benefits while I\u2019m still earning a paycheck.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "16 Oct 2026, 05:00 PM IST", "pub_date_relative": "1h ago"}, {"title": "Ladakh\u2019s infrastructure plan: 5 projects worth \u20b93,350 cr to boost air connectivity, roads, tourism", "full_content": "Choose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "16 Oct 2026, 04:58 PM IST", "pub_date_relative": "1h ago"}, {"title": "Bajaj Housing Finance Q2 Results: PAT rises 18% YoY to Rs 757 crore, AUM grows 25%", "full_content": "Home ETPrime Marke don lenders' shares ahead of crucial budget", "full_content": "Shares in some of Britain's biggest banks sold off Friday amid reports that the U.K. government will hike taxes on London-listed lenders' profits later this month.\n\nLloyds Banking Group led losses, sliding 1.8%, while NatWest was 1.51% lower by 11:30 a.m. in London (6:30 a.m. ET).\n\nBarclays moved 0.13% higher, reversing earlier losses. London-listed shares of HSBC and Standard Chartered \u2014 which both derive much of their profits overseas \u2014 added 1.2% and 0.71%, respectively.\n\nFinance Minister John Healey is expected to raise the sector-specific surcharge on banks' profits to 8%, up from 3%, when he delivers his first budget as Chancellor, scheduled for Oct. 28.\n\nLloyds Banking Group. The levy, which sits on top of corporation tax, was earlier cut to 3% from 8% under Rishi Sunak's Conservative government in 2023. While the hike could raise \u00a32 billion ($2.67 billion) per year for the U.K. Treasury, it could also slice 6% off lenders' earnings, KBW analysts said in a note Oct. 12.\n\nHealey on Thursday described banks as the \"jewel\" in the U.K.'s economic crown in an interview with Bloomberg.\n\nHowever, the proposed levy has revived wider concerns about the Labour government's approach to financial services, and how the sector may be treated as ministers seek to fund public services and meet fiscal targets.\n\nAmanda Blanc, CEO of Aviva , said the financial services sector is one of the U.K.'s \"core industries\".", "source": "CNBC Top News", "pub_date_str": "16 Oct 2026, 04:49 PM IST", "pub_date_relative": "1h ago"}, {"title": "My wife says we can\u2019t afford to retire. I vetoed her $8,000 trip to Italy. We\u2019re in our 60s and have $4 million. Do I keep working?", "full_content": "\u201cI worry about healthcare, long-term care, inflation, a long bear market and living to 95.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "16 Oct 2026, 04:45 PM IST", "pub_date_relative": "1h ago"}, {"title": "MoSPI conducting new surveys to improve economic data: Secretary Saurabh Garg", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Indicators \u203a MoSPI conducting new surveys to improve economic data: Secretary Saurabh Garg The Economic Times daily newspaper is available online now. Read Today's Paper MoSPI conducting new surveys to improve economic data: Secretary Saurabh Garg SECTIONS MoSPI conducting new surveys to improve economic data: Secretary Saurabh Garg ANI Last Updated: Oct 16, 2026, 04:44:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis MoSPI is conducting new surveys, including one on cooperatives, to improve India's economic data, Secretary Saurabh Garg said. He expressed confidence in the country's growth trajectory after GDP expanded 7.8% in the first quarter, while highlighting inflation concerns, gaps in measuring household work and care activities, and methodological improvements to national accounts.\n\nUS mid-term elections \u2013 Part 2: What does it mean for Trump to lose control of Congress?\n\nThe ABCD of the US mid-term elections \u2013 Part 1: Why it matters across the globe\n\nCurbing rupee bets: What the RBI\u2019s new rules mean for the hedge-now-or-wait question\n\nBrinjal, buffalo, bacteria: Inside India\u2019s pay-for-nature system\n\nHomebuyers wait as NCLT panel picks holes in unfinished Jaypee projects\n\nThe NBFC saga - Part 3: How one default in 2018 changed the way RBI reads risk\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "16 Oct 2026, 04:44 PM IST", "pub_date_relative": "1h ago"}, {"title": "Jio Platforms IPO: Meta, Google, Other Global Investors See Their Stake More Than Double in Valu fosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "16 Oct 2026, 04:39 PM IST", "pub_date_relative": "1h ago"}, {"title": "PNB Q2 Results: Net Profit Rises 13% To Rs 5,582 Crore, NII Up 11%; Asset Quality Improves", "full_content": "PNB Q2 Results: Net Profit Rises 13% To Rs 5,582 Crore, NII Up 11%; Asset Quality Improves", "source": "NDTV Profit", "pub_date_str": "16 Oct 2026, 04:39 PM IST", "pub_date_relative": "1h ago"}, {"title": "Stock Market Today: Investors Pare Rate-Hike Bets After Warsh Declines to Guide on Next Move - WSJ", "full_content": "Stock Market Today: Investors Pare Rate-Hike Bets After Warsh Declines to Guide on Next Move WSJ Warsh Vows Price Stability as A.I. Delivers \u2018Shock\u2019 to Economy The New York Times Warsh\u2019s Missing Words Fuel Bets Fed Will Hold Rates Bloomberg.com Key Moments From Kevin Warsh\u2019s Speech to the IMF WSJ Warsh signals steady Fed outlook despite inflation jump Axios", "source": "Google News Business", "pub_date_str": "16 Oct 2026, 04:36 PM IST", "pub_date_relative": "1h ago"}, {"title": "Shareholders should have a say on making AI safe", "full_content": "SEC decision to rescind key rule on voting could not have come at a worse time", "source": "FT Markets", "pub_date_str": "16 Oct 2026, 04:35 PM IST", "pub_date_relative": "1h ago"}, {"title": "Market wrap: Tech Mahindra, TCS, InterGlobe, BSE top gainers and losers on Nifty and Sensex on Friday", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Market wrap: Tech Mahindra, TCS, InterGlobe, BSE top gainers and losers on Nifty and Sensex on Friday National Stock Exchange of India Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Market wrap: Tech Mahindra, TCS, InterGlobe, BSE top gainers and losers on Nifty and Sensex on Friday SECTIONS Market wrap: Tech Mahindra, TCS, InterGlobe, BSE top gainers and losers on Nifty and Sensex on Friday By Kumar Gaurav , ETMarkets.com Last Updated: Oct 16, 2026, 04:34:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Indian equities extended gains as strong IT earnings lifted sentiment, with the Nifty rising 149 points to 23,146 and Sensex gaining 413 points. Tech Mahindra led advances, while broader markets slipped. Analysts flagged 23,000 as crucial for further upside.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "16 Oct 2026, 04:34 PM IST", "pub_date_relative": "1h ago"}, {"title": "Q2 Results Live: Urban Company Net Loss More Than Doubles; PNB Profit NII Jumps 11%, Bajaj Housing AUM Grows 25%", "full_content": "Investors will track earnings from real estate, banking, consumer, telecom and technology companies, with DLF, PNB, Bajaj Housing Finance, Federal Bank, LTM, Oberoi Realty and Tejas Networks among the key names reporting September-quarter results.", "source": "NDTV Profit", "pub_date_str": "16 Oct 2026, 04:34 PM IST", "pub_date_relative": "1h ago"}, {"title": "KFC to switch to Coca-Cola beverages in U.S. restaurants for the first time in decades", "full_content": "KFC's U.S. restaurants will ditch PepsiCo and switch to Coca-Cola beverages next year, marking the first time in decades that the Yum Brands chain has changed its drink supplier, the restaurant company said Thursday.\n\nSome of KFC's international markets serve Coke products, but the chain's U.S. restaurants have stuck with PepsiCo drinks ever since Pepsi bought KFC in 1986. At the time of the acquisition, KFC was Coke's second-largest fountain account, trailing only McDonald's. Pepsi later spun off KFC, along with sister chains Pizza Hut and Taco Bell \u2014 but even as the combined Yum Brands, the company stayed loyal to its previous owner. Without Pepsi, Taco Bell would not serve its iconic Mountain Dew Baja Blast.\n\nThe change comes as KFC aims to win back U.S. diners, who have ditched the fried chicken chain for rivals such as Chick-fil-A or Popeyes.\n\n\"This decision is a critical step in the Kentucky Fried Comeback,\" KFC U.S. President Catherine Tan-Gillespie wrote in a memo to franchisees and employees obtained by CNBC. \"A new beverage offering, with a new partner in Coca-Cola, gives us a platform to innovate, meet changing tastes and give customers more reasons to choose us.\"\n\nFor many fast-food chains, beverages have become a critical way to attract consumers. A number of restaurants, including McDonald's and Taco Bell, have broadened their drink offerings with options such as refreshers or \"dirty soda.\" For its part, KFC recently unveiled new drinks, including iced coffees and shakes, at Open House , its innovation restaurant in McKinney, Texas.\n\nCoke told CNBC earlier this year that the company has helped many of its restaurant partners create new drinks.\n\nKFC expects to be pouring Coke beverages in all of its U.S. restaurants by the end of the first quarter of 2027, Tan-Gillespie said.\n\nTan-Gillespie also said that Pepsi remains an important partner for KFC's parent company and the chain's international markets.", "source": "CNBC Top News", "pub_date_str": "16 Oct 2026, 04:32 PM IST", "pub_date_relative": "1h ago"}, {"title": "The once-obscure tech at the heart of the green energy trade war", "full_content": "Power inverters are central to the global clean electricity boom but reliance on China is triggering security fears", "source": "FT Markets", "pub_date_str": "16 Oct 2026, 04:31 PM IST", "pub_date_relative": "1h ago"}, {"title": "Nike's India campus is a long-term growth bet amid turnaround", "full_content": "The retailer, which has been struggling to revive its business and regain momentum under CEO Elliott Hill, is hoping the world's most populous country can help it turn the page on its performance.\n\nAs it reported its fiscal first-quarter earnings on Oct. 1, the company announced it will create a new global campus in Bengaluru, India, as part of its growth strategy. Hill wrote in a letter to employees that the new facility would be a \"long-term investment\" to help position Nike for success.\n\n\"India is already an important growth market and manufacturing hub for Nike, with strong capabilities and access to talent,\" Hill wrote.\n\nThe new campus is expected to open in the next few years and span corporate roles across the organization, including the namesake Nike brand, Jordan Brand and Converse. Nike plans to discuss its India campus in detail at its investor day next month.\n\nIn a statement to CNBC, a Nike spokesperson said expanding into India is a \"natural\" next step for the company as it looks to grow its global presence.\n\n\"As participation in running, basketball, football, fitness and other sports continues to grow across India, we see an opportunity to better serve athletes through stronger local capabilities, consumer insights, and innovation,\" the spokesperson said.\n\nIndia will be the world's third-largest retail market by 2030, according to Indian conglomerate Reliance Industries. Its e-commerce market was valued at $159.25 billion in 2026 and is projected to reach $332.94 billion by 2031, according to IBEF, a business advocacy organization created by the Indian government.\n\nNike has endured a yearslong slump and is trying to right its business under Hill's turnaround plan. Nike also announced this month that it would lay off workers across the company as part of what it has dubbed its Pace strategy, which includes supply chain changes and reorganization of the company's geographic segments.", "source": "CNBC Top News", "pub_date_str": "16 Oct 2026, 04:30 PM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "Fed's Warsh withholds rate signal, praises recent global tightening", "full_content": "BANGKOK \u2014 Federal Reserve Chairman Kevin Warsh refrained from signaling whether there will be another interest rate hike again this month, while acknowledging a \"synchronous tightening\" by central banks around the world.\n\n\"I don't prejudge meetings. I don't believe in saying now what I might do at the meetings that we have in the balance of this year,\" Warsh said, reiterating his opposition to the use of forward guidance for markets that should rely on interpreting data.\n\nHe also acknowledged that stance may disappoint anyone who had hoped for a steer ahead of the central bank meeting later this month. \"It's a new chapter at the Fed [and] we're not in that business anymore,\" he said.\n\nWarsh spoke at a fireside chat with the International Monetary Fund's managing director, Kristalina Georgieva, as part of the weeklong IMF-World Bank Annual Meetings in Bangkok on Friday.\n\n\"Alongside other recent comments from FOMC participants, Warsh's comments indicate that the FOMC is set to pause in October,\" Goldman Sachs economists led by Jan Hatzius wrote in a note. \"We continue to expect a second and final hike in December.\"\n\nS&P 500 and Nasdaq futures edged higher following the speech, while stock market indexes in Asia and Treasury yields were largely stable.\n\nWarsh described the global shift toward tighter monetary policy as a common fight on prices. Central banks made their own choices under their own mandates, he said, but the result was \"a synchronous tightening in monetary policy in most places around the world,\" which means \"there's no free riders.\"\n\nSurging energy costs stemming from the Iran war and artificial intelligence investment boom are stoking inflation and pushing up borrowing costs around the world, just as global public debt is on pace to exceed 100% of the world's GDP, a level last breached in the aftermath of World War II.", "source": "CNBC Top News", "pub_date_str": "16 Oct 2026, 06:06 PM IST", "pub_date_relative": "1m ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Pulse of the Street: Best week since April puts recovery to the earnings test", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nIndian stocks have staged their strongest weekly rally since April, but the rebound has yet to broaden beyond the largest companies. A sharp rally in information technology (IT) stocks, and a firmer rupee lifted benchmarks, while foreign investors continued to sell and crude oil above $100 a barrel kept pressure on corporate earnings.\n\nThe Sensex gained 3.13% and the Nifty 50 rose 2.79% in the week ended 16 October, their biggest weekly advances since the week ended 10 April. On Friday, the Sensex climbed 0.56% to 74,729.27, while the Nifty advanced 0.65% to 23,146.15.\n\nThe gains extended the previous week's rebound, which broke an eight-week losing streak. The challenge now is to turn that recovery into a broader advance backed by earnings rather than sentiment alone.\n\nThe Indian rupee strengthened to \u20b9 94.96 against the dollar on Friday from \u20b9 96.74 a week earlier, easing currency pressures.\n\nSanjit Singh Paul, smallcase manager and managing director at Modulor Capital, attributed the rebound to Reserve Bank of India (RBI) measures supporting the rupee, softer US yields, positive IT results and domestic institutional buying. The RBI opened a special dollar window for oil companies, diverting their demand from the spot market, and tightened currency-hedging rules.\n\nBut the stock-market rally has yet to spread across the broader market. The BSE LargeCap index gained 1.85% during the week, outpacing the MidCap index's 0.99% rise, while the SmallCap index slipped 0.02%.\n\nPaul cautioned that midcap, smallcap and microcap stocks had not kept pace with the benchmark rally. \u201cThe current move is definitely worth watching, but has not established itself as sustainable,\u201d he said.", "source": "LiveMint Markets", "pub_date_str": "16 Oct 2026, 06:02 PM IST", "pub_date_relative": "5m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "LTM Q2 Results: PAT remains flat at Rs 1,380 crore; revenue rises 14% YoY; co declares Rs 25 per share dividend", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a Earnings \u203a LTM Q2 Results: PAT remains flat at Rs 1,380 crore; revenue rises 14% YoY; co declares Rs 25 per share dividend National Stock Exchange of India Share Price The Economic Times daily newspaper is available online now. Read Today's Paper LTM Q2 Results: PAT remains flat at Rs 1,380 crore; revenue rises 14% YoY; co d
