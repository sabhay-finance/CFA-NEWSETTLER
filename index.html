diction taxpayers By ET TEAM Last Updated: Oct 09, 2026, 12:29:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis GST reforms 2026 will move around 2 lakh businesses operating across multiple CGST jurisdictions towards a centralised, faceless tax administration, Finance Minister Nirmala Sitharaman said. The framework will cover scrutiny, audits, adjudication, appeals and taxpayer services, with public consultation planned before Budget 2027 and implementation targeted for FY28.\n\nThe NBFC saga - Part 2: Line drawn in 2006 is reason for the headlines today\n\nAirlines Q2 turbulence: Fewer passengers, rising fares and a crude shock\n\nBritannia\u2019s next big bet for young India lies beyond biscuits\n\nThe world is witnessing a bond rout. Why should it matter to you?\n\nQ2 earnings season: Will it settle or add to confusion in the stock market?\n\nThe NBFC saga - Part 1: How RBI moved from protecting depositors to policing systemic risk\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "09 Oct 2026, 12:29 AM IST", "pub_date_relative": "20m ago"}, {"title": "RBI\u2019s sell-buy swaps slow rupee\u2019s fall but push up forward premiums, making hedging costlier for foreign investors", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a RBI\u2019s sell-buy swaps slow rupee\u2019s fall but push up forward premiums, making hedging costlier for foreign investors The Economic Times daily newspaper is available online now. Read Today's Paper RBI\u2019s sell-buy swaps slow rupee\u2019s fall but push up forward premiums, making hedging costlier for foreign investors SECTIONS RBI\u2019s sell-buy swaps slow rupee\u2019s fall but push up forward premiums, making hedging costlier for foreign investors By Joel Rebello , ET Bureau Last Updated: Oct 09, 2026, 12:38:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Reserve Bank of India is engaged in dollar sell-buy swaps to stabilize the rupee's value. However, this has resulted in higher forward premiums, making it expensive for foreign investors to hedge. As a consequence, some foreign investments in rupee-denominated assets may decline. Additionally, companies are opting to borrow in rupees and exchange for dollars due to favorable local rates.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\nThe NBFC saga - Part 2: Line drawn in 2006 is reason for the headlines today\n\nAirlines Q2 turbulence: Fewer passengers, rising fares and a crude shock\n\nBritannia\u2019s next big bet for young India lies beyond biscuits\n\nThe world is witnessing a bond rout. Why should it matter to you?\n\nQ2 earnings season: Will it settle or add to confusion in the stock market?\n\nThe NBFC saga - Part 1: How RBI moved from protecting depositors to policing systemic risk", "source": "Economic Times Economy", "pub_date_str": "09 Oct 2026, 12:24 AM IST", "pub_date_relative": "25m ago"}, {"title": "U.S. suspends Microsoft, Adobe from green card labor program in foreign worker crackdown", "full_content": "The U.S. Department of Labor announced it would suspend Microsoft and Adobe from its Permanent Labor Certification program on Thursday, Labor Secretary Keith Sonderling said, as the Trump administration continues to take aim at immigration and foreign hiring programs ahead of November's midterm elections.\n\nSonderling said the Labor Department won't accept or process any new applications under the program for a host of companies, including Cognizant, Infosys, Capgemini, Tata, Wipro and HCL.\n\nThe secretary said Adobe and Microsoft were also suspended \"due to multiple active federal investigations.\"\n\n\"Since 2009, just these companies alone have requested almost 3 million foreign workers. They've received over 230,000 H-1B visas approvals and over 100,000 permanent labor certifications. That's hundreds of thousands of jobs that were taken from American workers,\" Sonderling said.\n\nVice President JD Vance criticized Microsoft specifically, pointing to the firm's 6,000 layoffs in 2025. Vance claimed that the company \"replaced\" those workers with people on H-1B visas.\n\n\"So we're going to continue to support Microsoft and have a great relationship with Microsoft, but we're also going to deny them the ability to apply for these permanent residencies until they show that they are going to get serious about putting American workers first,\" Vance said.\n\nMicrosoft responded to Vance's claims and defended its hiring practices in a statement Thursday, saying \"the vast majority of Microsoft employees in the United States are Americans.\"\n\n\"Of the approximately 6,000 H-1B visa applications we submitted in the last fiscal year, 80% percent were to extend or change the status of existing Microsoft employees,\" the company said.", "source": "CNBC World Economy", "pub_date_str": "09 Oct 2026, 12:22 AM IST", "pub_date_relative": "27m ago"}, {"title": "Oil prices jump on tanker attacks and slowing flows through Strait of Hormuz", "full_content": "Transit via vital waterway rose close to 90% of prewar levels last month but has since fallen sharply", "source": "FT Markets", "pub_date_str": "09 Oct 2026, 12:21 AM IST", "pub_date_relative": "28m ago"}, {"title": "The options market is reminding investors there\u2019s a cure for rising bond yields \u2014 higher yields", "full_content": "The MOVE Index \u2014 the Treasury market\u2019s \u201cfear gauge\u201d \u2014 has reached heights that in the past suggested yields may have peaked, at least for now.", "source": "MarketWatch Top Stories", "pub_date_str": "09 Oct 2026, 12:21 AM IST", "pub_date_relative": "29m ago"}, {"title": "Treasuries Rise as Lofty Yields Lure Demand to 30-Year Sale", "full_content": "(Bloomberg) -- US Treasuries rose after an auction of 30-year debt drew solid demand as long-dated yields edge away from their highest levels in more than two decades.\n\nThe gains sent yields lower across maturities on Thursday, with those on 30-year bonds down by six basis points to 5.61% \u2014 off their highest levels since 2002. A $22 billion sale of the US government\u2019s longest bond was met with good investor appetite, echoing this week\u2019s strong 10-year auction.\n\n\u201cDemand held up,\u201d said Molly Brooks, rates strategist at TD Securities. \u201cIt\u2019s a good sign for those that want to dip their toes back in the long end.\u201d\n\nLonger-term debt from around the world has been selling off in recent months as angst has built up around the Iran war\u2019s effect on energy costs and the fallout for inflation. Fiscal concerns have also added to the pressure, with 30-year Treasury yields knocking out a series of milestone levels as they surged in recent weeks.\n\nOn Thursday, however, they slid as President Donald Trump said in a social media post that he\u2019d hold off on attacking Iran again until after the US midterms on Nov. 3. Long-dated yields extended their declines as oil prices fell from an earlier peak around $105 per barrel.\n\n\u201cThere was a lot of rumbling about potential pre-midterm strikes, so this takes some pressure off near-term oil,\u201d said Izaac Brook, US rates strategist at RBC Capital Markets. \u201cThis is just a near-term removal of Iran escalation tail risk.\u201d\n\nShort-end yields also pulled back. Two-year yields \u2014 which are more sensitive to the Federal Reserve\u2019s path \u2014 were down to 4.75%.\n\nTraders were pricing in a roughly 20% chance that the US central bank boosts interest rates later this month and are fully pricing in a move by year\u2019s end.", "source": "LiveMint Markets", "pub_date_str": "09 Oct 2026, 12:20 AM IST", "pub_date_relative": "29m ago"}, {"title": "We're buying the dip in a stock being punished for something it's actually insulated from", "full_content": "We waited and watched patiently.", "source": "CNBC Top News", "pub_date_str": "09 Oct 2026, 12:19 AM IST", "pub_date_relative": "30m ago"}, {"title": "Wall St turns lower as crude spikes, chip stocks weigh", "full_content": "NEW YORK, Oct 8 (Reuters) - Wall Street dipped on Thursday as crude prices surged on a spike in Middle East tensions and a cut in US output that fed inflation and rate-hike fears, while semiconductor stocks slumped.\n\nAll three major US stock indexes lost ground, with the tech-heavy Nasdaq down the most.\n\nChipmakers, which have soared over 80% so far this year, were clear underperformers, falling 3.0%. Investors worried that rising interest rates could become a headwind to the rapid AI buildout, which has leaned heavily on debt for funding.\n\n\"The market is in a state of nervousness due to high oil prices, as it prepares for earnings season which basically starts next week,\" said Peter Cardillo, chief market economist at Spartan Capital Securities in New York. \"That's the excuse for what I believe is profit-taking.\"\n\n\"It's a somewhat cautious market, but 'cautious' is not a dirty word,\" Cardillo added.\n\nOil prices jumped on supply concerns after a spate of attacks on shipping in the Strait of Hormuz, combined with a cut in US output due to hurricane activity.\n\nTight global crude supplies during the Iran war have sent US crude soaring more than 60% so far this year, stoking inflation pressures. In response to those pressures, the US Federal Reserve hiked interest rates in September for the first time since July 2023.\n\nDuring Thursday's session, benchmark US Treasury yields inched higher, hovering near multi-year highs, while yields on 2-year notes, which tend to reflect Fed rate expectations, moved up more decisively.", "source": "LiveMint Markets", "pub_date_str": "09 Oct 2026, 12:17 AM IST", "pub_date_relative": "32m ago"}, {"title": "The Trump administration is suspending Microsoft from a green card program, alleging fraud - AP News", "full_content": "The Trump administration is suspending Microsoft from a green card program, alleging fraud AP News Vance suspends Microsoft, others from foreign workers applying for green cards, alleges visa 'abuse' Fox Business H-1B visas aren't suspended. Here's what Vance is really targeting Axios Trump officials block Microsoft\u2019s access to program for employee green cards The Washington Post U.S. suspends Microsoft, Adobe from green card labor program in foreign worker crackdown CNBC", "source": "Google News Business", "pub_date_str": "09 Oct 2026, 12:11 AM IST", "pub_date_relative": "39m ago"}, {"title": "Black Sea attacks hit yellow peas, sunflower oil supplies to India", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a Black Sea attacks hit yellow peas, sunflower oil supplies to India The Economic Times daily newspaper is available online now. Read Today's Paper Black Sea attacks hit yellow peas, sunflower oil supplies to India SECTIONS Black Sea attacks hit yellow peas, sunflower oil supplies to India By Jayashree Bhosale , ET Bureau Last Updated: Oct 09, 2026, 12:11:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Russia's exports of yellow peas and sunflower oil to India have been disrupted by ongoing conflicts. As a result, prices for yellow peas have risen from \u20b940 to \u20b946 per kg in the last two months. Importers report that shipments from Russia have not occurred recently, affecting the availability of yellow peas. Meanwhile, sunflower oil shipments are also hindered, causing expectations of higher prices in the near future.\n\nThe NBFC saga - Part 2: Line drawn in 2006 is reason for the headlines today\n\nAirlines Q2 turbulence: Fewer passengers, rising fares and a crude shock\n\nBritannia\u2019s next big bet for young India lies beyond biscuits\n\nThe world is witnessing a bond rout. Why should it matter to you?\n\nQ2 earnings season: Will it settle or add to confusion in the stock market?\n\nThe NBFC saga - Part 1: How RBI moved from protecting depositors to policing systemic risk\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "09 Oct 2026, 12:09 AM IST", "pub_date_relative": "41m ago"}, {"title": "This cybersecurity stock is already growing revenue at a 20% clip. And now here comes the AI boost", "full_content": "SentinelOne combines strong revenue growth with improving profitability as it expands its cybersecurity platform beyond endpoint security.", "source": "CNBC Top News", "pub_date_str": "09 Oct 2026, 12:05 AM IST", "pub_date_relative": "44m ago"}, {"title": "I\u2019m a 68-year-old widow and give money to my two adult children. Am I putting my retirement at risk?", "full_content": "\u201cI also have $310,000 in an IRA and $46,000 in savings. My house is paid off.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "09 Oct 2026, 12:00 AM IST", "pub_date_relative": "50m ago"}, {"title": "US 30-year fixed-rate mortgage rate hits 7.40%, likely to further erode housing demand", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a US 30-year fixed-rate mortgage rate hits 7.40%, likely to further erode housing demand Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US 30-year fixed-rate mortgage rate hits 7.40%, likely to further erode housing demand SECTIONS US 30-year fixed-rate mortgage rate hits 7.40%, likely to further erode housing demand Reuters Last Updated: Oct 08, 2026, 11:57:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis In the U.S., the 30-year fixed-rate mortgage has surged to 7.40%, fueled by rising inflation that has also driven up energy costs and Treasury yields. With midterm elections looming, the housing market is grappling with affordability challenges. Homeowners are reluctant to sell due to these higher mortgage rates. While home prices remain high, experts forewarn of a potential market stall rather than a significant downturn.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "08 Oct 2026, 11:57 PM IST", "pub_date_relative": "52m ago"}, {"title": "We're adding to our position in a hard-hit stock before important catalysts arrive", "full_content": "This is our second stock purchase on Thursday.", "source": "CNBC Top News", "pub_date_str": "08 Oct 2026, 11:56 PM IST", "pub_date_relative": "53m ago"}, {"title": "Diversified equity mutual funds in the red October 2026: Which schemes have negative YTD, 3- and 5-year CAGR returns?", "full_content": "Investors often focus on mutual funds that have delivered high returns over a particular period. However, it is equally important to understand which funds have struggled.\n\nHere are the top 10 diversified equity funds (excluding sectoral and thematic funds) that delivered the most negative returns on a year-to-date (YTD), three-year, and five-year basis as of October 2026. Let\u2019s see whether any fund names feature across all these periods.\n\nAs of 7 October 2026, several diversified equity funds were in negative territory on a year-to-date (YTD) basis. The list includes the top 10 funds across value and large-cap categories, with the weakest performers down by more than 10%.\n\n*Source: Morningstar, Direct plans, Returns as on 7 October 2026\n\nThe list is led by ICICI Prudential Value Fund, which delivered the most negative return this year at -12.35%. It was followed by Quantum Value Fund at -11.95% and Parag Parikh ELSS Tax Saver Fund at -11.78%.\n\nQuantum ELSS Tax Saver Fund and Mahindra Manulife Large Cap Fund were also among the weakest performers.\n\nThe remaining three funds in the top 10 were ICICI Prudential Large Cap Fund at -11.09%, DSP Large Cap Fund at -10.61%, and UTI Large Cap Fund at -10.55%.\n\nThe picture looks considerably different when returns are assessed over a three-year period. Based on the funds in this analysis, only one active diversified equity fund remains in negative territory over three years.", "source": "LiveMint Money", "pub_date_str": "08 Oct 2026, 11:55 PM IST", "pub_date_relative": "54m ago"}, {"title": "Bond yields fell, as the Treasury market passed a crucial test of investor confidence", "full_content": "Higher bond yields aren\u2019t only about inflation and the Iran war. But it means a higher cost of capital.", "source": "MarketWatch Top Stories", "pub_date_str": "08 Oct 2026, 11:49 PM IST", "pub_date_relative": "1h ago"}, {"title": "Nvidia, Oracle, CoreWeave and other AI stocks sink on OpenAI revenue report", "full_content": "Shares of Nvidia , Oracle , CoreWeave and other artificial intelligence names sank lower on Thursday after the market learned more details about OpenAI's revenue.\n\nOpenAI told investors that it hit roughly $50 billion in annualized revenue at the end of September, CNBC confirmed, lower than the the $68 billion figure that was widely reported late last month. A person familiar with the matter said the $68 billion figure included gross revenue from OpenAI's partners, which helps investors make a more direct comparison with its chief rival, Anthropic .\n\nThe Financial Times was first to report the $50 billion figure.\n\nOpenAI shared an update about its finances in an investor presentation, said the person, who asked not to be named in order to discuss the numbers. In addition to the $50 billion in annualized revenue, OpenAI touted 77% total run rate growth during its third quarter, as well as 107% run rate growth for its enterprise business during the same period, the person said.\n\nThe company is under pressure to justify its $852 billion valuation to investors as it gears up for what is widely expected to be a blockbuster IPO. OpenAI confidentially filed its prospectus with regulators in June, and executives have signaled that the company is eyeing a 2027 debut.\n\nIn the interim, OpenAI is engaging in early stage discussions with investors about a potential new funding round. The company could raise around $30 billion, as CNBC previously reported, but that figure could change. The round is being driven by investor demand and no term sheet has been finalized yet.\n\nOpenAI closed a historic $122 billion funding round in March, and CFO Sarah Friar told CNBC last week that it is still \"very well capitalized.\"\n\nNvidia, Oracle, CoreWeave stock chart. WATCH: OpenAI annualized revenues $20 billion less than previously signaled: Report", "source": "CNBC World Economy", "pub_date_str": "08 Oct 2026, 11:48 PM IST", "pub_date_relative": "1h ago"}, {"title": "US President Donald Trump buys $1 million-plus stakes in Meta, Microsoft, McDonald\u2019s; adds SpaceX debt", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a US President Donald Trump buys $1 million-plus stakes in Meta, Microsoft, McDonald\u2019s; adds SpaceX debt Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US President Donald Trump buys $1 million-plus stakes in Meta, Microsoft, McDonald\u2019s; adds SpaceX debt SECTIONS US President Donald Trump buys $1 million-plus stakes in Meta, Microsoft, McDonald\u2019s; adds SpaceX debt By ETMarkets.com Last Updated: Oct 08, 2026, 11:47:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Donald Trump invested over $1 million in stocks of several major companies during August. Notable purchases included Meta Platforms, McDonald's, Microsoft, and space-related debt from SpaceX. His investment activities encompass trading in shares of Nvidia and Advanced Micro Devices, key players in the AI sector. Trump's financial dealings during his presidency have raised concerns about potential conflicts of interest.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "08 Oct 2026, 11:47 PM IST", "pub_date_relative": "1h ago"}, {"title": "Trump bought up to $25 million in Meta and millions in SpaceX debt in August", "full_content": "President Donald Trump disclosed more than 500 securities transactions in August, including a purchase of up to $25 million in Meta stock and an investment of as much as $5 million in SpaceX debt two days before he signed a sweeping policy aimed at expanding U.S. commercial space transportation, according to a newly released financial disclosure .\n\nThe 517 purchases and sales totaled roughly $74.3 million to $273.3 million, according to a CNBC analysis of Trump's August financial disclosure, which reports each item in a range of value. Purchases accounted for at least $44.2 million and sales at least $30.1 million, CNBC calculated.\n\nThe 18-page filing shows Trump's portfolio remained highly active, even as trading slowed from June and July, when he disclosed more than 1,000 transactions in each month.\n\nThe largest transaction was an Aug. 21 purchase of between $5 million and $25 million in Meta shares, amid a broader portfolio reshuffling that day. Trump also reported buying between $1 million and $5 million each of AT&T , ConocoPhillips , Abbott Laboratories , Netflix and Chevron the same day.\n\nMeta did not immediately respond to CNBC's request for comment.\n\nOn the sell side, on Aug. 21, he unloaded between $1 million and $5 million each of Advanced Micro Devices and Church & Dwight , along with stakes worth between $500,001 and $1 million in companies including Boeing , Home Depot , T-Mobile , Datadog , Dell Technologies , Palo Alto Networks and Nvidia .\n\nOn Aug. 18, Trump's accounts purchased between $1 million and $5 million in senior unsecured notes issued by Elon Musk's rocket and satellite company, carrying a 5.35% interest rate and maturing in July 2031.\n\nTwo days later, Trump signed a national space transportation policy calling for the U.S. to support more than 1,000 launches and reentries annually by 2030.", "source": "CNBC World Economy", "pub_date_str": "08 Oct 2026, 11:46 PM IST", "pub_date_relative": "1h ago"}, {"title": "Bank delays your credit card closure, credit report correction or property documents? You are eligible for compensation", "full_content": "Banks and financial institutions are required to complete several customer- service requests within timelines prescribed by the Reserve Bank of India (RBI). If a bank fails to meet these deadlines, customers may be entitled to compensation for every day of delay, depending on the applicable RBI rules.\n\nThese compensation provisions cover a range of services, including credit card closure, failed digital transactions, return of property documents after loan repayment and correction of credit-report inaccuracies.\n\nThe compensation can range from \u20b9 100 per day to \u20b9 5,000 per day in certain cases.\n\nRBI's framework for customer compensation is largely deadline-driven. It specifies a turnaround time (TAT) for a particular service and, if the bank exceeds that period, compensation may become payable under the relevant rules.\n\nCustomers may be eligible for compensation when a digital transaction or ATM transaction fails but their account is debited.\n\nFor certain failed transactions, including some UPI, ATM, and card transactions, banks are required to resolve the issue within the applicable RBI-prescribed turnaround time. Where compensation is applicable, the bank must generally provide \u20b9 100 for each day of delay beyond the prescribed timeline, without requiring the customer to separately claim it.\n\nThe applicable timeline and compensation, however, depend on the type of transaction and the RBI framework governing it.\n\nCredit card holders are also protected by a specific RBI turnaround time.", "source": "LiveMint Money", "pub_date_str": "08 Oct 2026, 11:43 PM IST", "pub_date_relative": "1h ago"}, {"title": "Exports to hit $1 trillion this fiscal: Piyush Goyal", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a Exports to hit $1 trillion this fiscal: Piyush Goyal The Economic Times daily newspaper is available online now. Read Today's Paper Exports to hit $1 trillion this fiscal: Piyush Goyal SECTIONS Exports to hit $1 trillion this fiscal: Piyush Goyal By ET Bureau Last Updated: Oct 08, 2026, 11:40:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Goyal said that the nine free trade agreements finalised by India in recent years provide huge business opportunities for exporters. He urged industry chamber CII to set up FTA utilisation cells in states.\n\nThe NBFC saga - Part 2: Line drawn in 2006 is reason for the headlines today\n\nAirlines Q2 turbulence: Fewer passengers, rising fares and a crude shock\n\nBritannia\u2019s next big bet for young India lies beyond biscuits\n\nThe world is witnessing a bond rout. Why should it matter to you?\n\nQ2 earnings season: Will it settle or add to confusion in the stock market?\n\nThe NBFC saga - Part 1: How RBI moved from protecting depositors to policing systemic risk\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "08 Oct 2026, 11:40 PM IST", "pub_date_relative": "1h ago"}, {"title": "Ken Paxton is right. Tax cuts will mean Social Security and Medicare cuts.", "full_content": "It doesn\u2019t matter if you are a Republican or Democrat. Math is math.", "source": "MarketWatch Top Stories", "pub_date_str": "08 Oct 2026, 11:38 PM IST", "pub_date_relative": "1h ago"}, {"title": "France Is Veering Toward a Potential Debt Crisis Amid Protests and Turmoil - The New York Times", "full_content": "France Is Veering Toward a Potential Debt Crisis Amid Protests and Turmoil The New York Times Default May Be the Tail Risk Haunting French Bonds WSJ French central bank head warns country at risk of being \u2018strangled by interest rates\u2019 Financial Times France's bond-market turmoil is a warning for US investors as global borrowing costs keep rising Business Insider What\u2019s the Matter With France? Paul Krugman | Substack", "source": "Google News Business", "pub_date_str": "08 Oct 2026, 11:35 PM IST", "pub_date_relative": "1h ago"}, {"title": "America shut out Chinese EVs. Britain welcomed them \u2014 and now faces a difficult choice", "full_content": "The U.K. broke with the U.S. by opening its doors to China's electric vehicle juggernaut .\n\nChinese EVs face only a 10% standard import duty in Britain, one of the largest major overseas markets without additional China-specific tariffs. Japan and Norway also lack them.\n\nIt's in contrast to the U.S., where a 100% tariff effectively shut Chinese EVs out. The European Union , the U.K.'s biggest trading partner, has manufacturer-specific duties on Chinese EVs of up to 35.3%, in addition to a standard 10% import duty on all foreign cars.\n\nNow, the U.K. faces a difficult choice, as EU proposals may force it to impose tariffs to match the bloc's.\n\nAt the weekend, The Sunday Times reported that U.K. Business Minister Jonathan Reynolds is considering matching the EU's levy on Chinese EVs to avoid the pain of so-called Made in Europe proposals, which could hurt domestic companies selling into the EU.\n\nA U.K. government spokesperson reiterated to CNBC that it had not imposed tariffs on Chinese EVs but added, \"We continue to engage closely with industry so that our approach reflects the sector's and UK's national interests.\"\n\nThe Made in Europe legislation, part of the EU's Industrial Accelerator Act , is designed to protect the bloc's industries from unfair international competition by prioritizing European-made goods.\n\nAn EU official told the Financial Times in September that London would need to raise tariffs on Chinese EVs and align more closely with EU trade policy to avoid \"Made in Europe\" barriers.", "source": "CNBC Top News", "pub_date_str": "08 Oct 2026, 11:34 PM IST", "pub_date_relative": "1h ago"}, {"title": "Micron Stock Drops. Why Samsung\u2019s Record Profit Didn\u2019t Give It a Lift. - Barron's", "full_content": "Micron Stock Drops. Why Samsung\u2019s Record Profit Didn\u2019t Give It a Lift. Barron's Samsung, SK Hynix record earnings fuel South Korea spending on AI, youth Nikkei Asia Samsung and TSMC fail to excite investors used to torrid AI growth The Japan Times The Memory Trade Cools After Samsung\u2019s Preliminary Results Disappoint Yahoo Finance Memory crisis puts Samsung on track for the biggest quarterly operating profit in tech history TechSpot", "source": "Google News Business", "pub_date_str": "08 Oct 2026, 11:33 PM IST", "pub_date_relative": "1h ago"}, {"title": "Kia Sonet owner wins consumer case over recurring DPF warnings, gets \u20b910.99 lakh refund, \u20b91 lakh compensation", "full_content": "The District Consumer Disputes Redressal Commission, Kurnool, has directed Kia India Pvt. Ltd. and its authorised dealer, MG Brothers Kia, Kurnool, to refund the ex-showroom price of a Kia Sonet diesel car after repeated attempts to fix a recurring Diesel Particulate Filter (DPF) problem failed to resolve the issue permanently, according to Live Law.\n\nThe Commission, headed by President Sri Karanam Kishore Kumar and Members Sri N. Narayana Reddy and Smt. S. Nazima Kausar, said the consumer could not be expected to have specialised technical knowledge about the vehicle's emission-control system.\n\nWhile the Commission did not conclusively establish that the car had a manufacturing defect, it found that the manufacturer and dealer had failed to provide an effective and lasting solution to the recurring problem during the warranty period. This amounted to deficiency in service, it held.\n\nThe complainant bought a Kia Sonet HTX Diesel in March 2022 for around \u20b9 13.69 lakh, including on-road costs. He later purchased an extended warranty that remained valid until March 2027.\n\nAccording to the complaint, the car began showing DPF-related warnings shortly after it was purchased. One of the recurring alerts displayed on the instrument cluster was \"Diesel Filter Regeneration Request\".\n\nThe owner said he took the vehicle to the authorised service centre more than 15 times over the same issue. Despite several visits and repairs, the warning reportedly continued to return.\n\nThe service centre carried out several procedures in an effort to address the DPF issue. These included DPF regeneration, replacement of sensors and the battery, DPF refurbishment, fuel injector refurbishment and ECM software upgrades.\n\nThe complainant maintained that he followed the instructions given by the service centre, including carrying out manual regeneration and driving the vehicle on highways as advised.", "source": "LiveMint Money", "pub_date_str": "08 Oct 2026, 11:29 PM IST", "pub_date_relative": "1h ago"}, {"title": "Media attorneys ask court for help in preventing White House ban until legal case is resolved", "full_content": "An attorney for three news organizations told a federal judge Thursday that the Trump administration must be prevented from barring their reporters from the White House, saying the ban is a classic example of \"viewpoint discrimination\" that is punishing people for what they say \u2014 and violating the media outlets' First Amendment rights.\n\nThe hearing was the latest development in the escalating drama between the Trump administration and the news media, which has raged in various arenas during his second term as president. At its core, though, are multiple free-speech questions. The dispute has produced sanctions and restrictions on White House and Pentagon reporter and led to several lawsuits that are progressing through the federal court system.\n\nU.S. District Judge Timothy Kelly said he intended to rule by Tuesday, possibly sooner, on whether to extend his own order maintaining White House access for journalists from MS NOW, CNN and Politico. Granting the news outlets' request for a preliminary injunction would preserve the status quo \u2014 access \u2014 until the litigation is resolved.\n\nKelly, nominated to the bench by Republican President Donald Trump, didn't say how he intends to rule but described key government arguments as an \"uphill climb\" and a \"tough lift\" at this stage of the litigation. The judge also challenged a government attorney to specify the national security concerns that the administration claims are at stake.\n\n\"We've always been clear that it's not just national security,\" Justice Department attorney Michael Velchik said, arguing that false reporting can impact policy and adversely affect national security.\n\n\"He doesn't mind negative press stories if he deserves them. He has problems with trafficking verifiable falsehoods,\" Velchik said of Trump.\n\nTheodore J.", "source": "CNBC Top News", "pub_date_str": "08 Oct 2026, 11:23 PM IST", "pub_date_relative": "1h ago"}, {"title": "Little relief expected for gas prices ahead of Election Day, according to prediction markets", "full_content": "Affordability is seen as one of voters' top issues heading into the 2026 midterm elections . And gas prices \u2014 one of the items where consumers are getting squeezed the most \u2014 are expected to remain elevated through Election Day.\n\nSpeculators on prediction market platform Kalshi give an 87% chance that the AAA national average for gas prices will remain above $4 per gallon on Nov. 3.\n\nBut while they expect prices to stay above that mark, they do think there's a chance they'll come down from the levels where they currently are, giving just a 42% chance the average is above $4.25 on Election Day. As of Thursday, the national average is currently at $4.36 per gallon.\n\nGas prices peaked at an average of $4.56 per gallon in late May, following an initial spike in March after the start of the Iran war and the latter country's closure of the Strait of Hormuz , a critical passageway for oil exports from the Middle East. They then fell to as low as $3.79 per gallon in early July before rising again throughout the rest of the summer.\n\nDiesel prices hit new peaks in September, though, reaching almost $6.53 per gallon on Sept. 22. Prices have since fallen to $6.28, though traders on Kalshi place 68% odds that figure remains above $6 per gallon on Nov. 3.\n\nRising diesel prices have a particular impact in states with larger agriculture industries , such as Iowa and Kansas, and states such as Alaska that rely on diesel fuel for electricity. All three are home to competitive races for the U.S. Senate this November.\n\nAs gas prices have remained elevated, Democrats' chances for flipping the Senate have improved . Traders on Kalshi give the party 63% odds of taking the upper chamber from Republican control.\n\nDisclosure: CNBC and Kalshi have a commercial relationship that includes customer acquisition and a minority investment.", "source": "CNBC Finance", "pub_date_str": "08 Oct 2026, 11:21 PM IST", "pub_date_relative": "1h ago"}, {"title": "Stock Market Today: Oil Rises, Nasdaq Slips on Fresh Tanker Attack - WSJ", "full_content": "Stock Market Today: Oil Rises, Nasdaq Slips on Fresh Tanker Attack WSJ S&P 500 falls, weighed down by oil prices; Nasdaq craters as AI stocks falter: Live updates CNBC US Stock Futures Slip on Mounting Energy Shock, AI Bubble Fears Bloomberg.com Wall St slips as climbing oil, yields amplify inflation fears Reuters Stock Market Today: Dow, S&P 500 and Nasdaq fall as tech stocks struggle; oil prices ease after Trump signals U.S. won't attack Iran before midterm elections; Treasury yields retreat MarketWatch", "source": "Google News Business", "pub_date_str": "08 Oct 2026, 11:21 PM IST", "pub_date_relative": "1h ago"}, {"title": "Working At TCS, Infosys, Wipro On H-1B And Waiting For A Green Card? Here's What The PERM Ban Means For You", "full_content": "The US has frozen PERM processing for several tech firms amid an H-1B abuse probe, raising concerns for Indian workers relying on employer sponsorship for green cards.", "source": "NDTV Profit", "pub_date_str": "08 Oct 2026, 11:20 PM IST", "pub_date_relative": "1h ago"}, {"title": "Math Association Accuses Open AI Of Plagiarism, Copyright Violation, Urges Mathematicians Not To Work With Firm", "full_content": "The Association for Human Mathematics stated that OpenAI releasing the manuscripts was not a demonstration of scholarship, but of power.", "source": "NDTV Profit", "pub_date_str": "08 Oct 2026, 11:19 PM IST", "pub_date_relative": "1h ago"}, {"title": "India, 14 others ink joint ministerial statement to curb structural excess capacity", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a India, 14 others ink joint ministerial statement to curb structural excess capacity The Economic Times daily newspaper is available online now. Read Today's Paper India, 14 others ink joint ministerial statement to curb structural excess capacity SECTIONS India, 14 others ink joint ministerial statement to curb structural excess capacity By Kirtika Suneja , ET Bureau Last Updated: Oct 08, 2026, 11:27:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India has joined the US, EU, UK and 12 other economies in a joint statement to tackle structural excess capacity and production, despite facing a US trade probe over alleged overcapacity. The signatories will examine key sectors including EVs, batteries, chemicals, semiconductors and solar panels through dedicated sectoral platforms.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\nThe NBFC saga - Part 2: Line drawn in 2006 is reason for the headlines today\n\nAirlines Q2 turbulence: Fewer passengers, rising fares and a crude shock\n\nBritannia\u2019s next big bet for young India lies beyond biscuits\n\nThe world is witnessing a bond rout. Why should it matter to you?\n\nQ2 earnings season: Will it settle or add to confusion in the stock market?\n\nThe NBFC saga - Part 1: How RBI moved from protecting depositors to policing systemic risk", "source": "Economic Times Economy", "pub_date_str": "08 Oct 2026, 11:16 PM IST", "pub_date_relative": "1h ago"}, {"title": "Rising interest rates: The good, the bad and the ugly for retirees", "full_content": "Unlike higher gas prices, which hurt almost everyone, higher borrowing costs have an uneven impact.", "source": "MarketWatch Top Stories", "pub_date_str": "08 Oct 2026, 11:15 PM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "Nasdaq drops, weighed down by AI stock sell-off after OpenAI revenue details disappoint: Live updates", "full_content": "The Nasdaq Composite slid on Thursday as new details about OpenAI spooked investors, putting the artificial intelligence trade under pressure.\n\nThe tech-heavy Nasdaq was down 1.4%, while the S&P 500 declined 0.6%. The Dow Jones Industrial Average traded around the flatline.\n\nShares of key tech names came under pressure after OpenAI's annualized revenue was revealed to be about $20 billion short of the amount previously signaled. Shares of Oracle were down more than 5%, while chipmakers such as Nvidia and Advanced Micro Devices lost 2% and 3%, respectively.\n\nAdding to the downbeat sentiment, oil prices spiked also after President Donald Trump said he doesn't want to make a deal with Iran to end the war, while the U.S. is reportedly preparing for \" massive bombing \" in the Middle East. However, he later said that the U.S. won't attack Iran before the midterm elections early next month, moving oil off its highs. Brent crude was last seen up 4% to around $104 per barrel. West Texas Intermediate futures , meanwhile, advanced 4% to around $91.\n\nTraders also watched the moves in Treasury yields after the 10-year yield and 30-year yield scaled to fresh 24-year highs this week. The benchmark 10-year yield was last down more than 3 basis points at 5.244%, while the 30-year yield was down 4 basis points at 5.621%. Those moves came after a solid 30-year auction by the Treasury .\n\n\"At the end of the day, I think it's inflation pressures, primarily driven by energy, that have shifted the Fed's disposition and have in a lot of ways shifted the long end of the curve as well,\" said Ross Mayfield, Baird investment strategist.", "source": "CNBC Top News", "pub_date_str": "09 Oct 2026, 12:47 AM IST", "pub_date_relative": "2m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Fixed Income", "Derivatives", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Why a Starbucks takeover of Chipotle would \u2014 and wouldn't \u2014 make sense for both companies", "full_content": "Starbucks has reportedly explored buying Chipotle Mexican Grill , but investors are split on whether the megadeal would make sense for both companies.\n\nThe coffee giant has been working with advisers on a takeover proposal of the fast-casual chain in recent months, the Financial Times reported on Thursday, citing people familiar with the matter.\n\nIf Starbucks bought Chipotle, it would combine two of the largest U.S. restaurant chains. With about $31 billion in annual domestic sales, Starbucks is the second-biggest U.S. chain by sales. Chipotle sits in the number seven spot, with more than $11 billion in annual system-wide sales in its home market.\n\nThe report sent Chipotle stock up about 7% in afternoon trading, while shares of Starbucks fell roughly 4%. It is not unusual for deal rumors to lower the potential acquirer's value and increase the target's share price, but investor reactions show that a prospective takeover comes with pros and cons for each side of the deal.\n\nTo be sure, it is unclear if Starbucks will even pursue the takeover. D.A. Davidson analyst Matt Curtis wrote in a note to clients on Thursday that he views the odds of a deal being completed as \"relatively low\" \u2014 about 20%.\n\nA Starbucks spokesperson told CNBC that the company does not comment on rumors and speculation. Chipotle did not immediately respond to a request for comment from CNBC.\n\nStarbucks CEO Brian Niccol knows more than a thing or two about Chipotle.\n\nBefore joining the coffee company in 2024, he was chief executive of Chipotle for more than six years. He led a turnaround of the burrito chain, helping it bounce back from a series of foodborne illness outbreaks that had turned into a full-blown crisis for the company.", "source": "CNBC Top News", "pub_date_str": "09 Oct 2026, 12:45 AM IST", "pub_date_relative": "4m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Derivatives"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "GST reforms 2026: Employers get ITC on employee health, life insurance premiums", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a GST reforms 2026: Employers get ITC on employee health, life insurance premiums The Economic Times daily newspaper is available online now. Read Today's Paper GST reforms 2026: Employers get ITC on employee health, life insurance premiums SECTIONS GST reforms 2026: Employers get ITC on employee health, life insurance premiums By ET TEAM Last Updated: Oct 09, 2026, 12:32:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The GST Council has recommended allowing employers to claim input tax credit on GST paid for health and life insurance policies taken for employees. The move could reduce the effective cost of employer-sponsored coverage, particularly benefiting small businesses, while making group health insurance more affordable and improving employee benefits.\n\nThe NBFC saga - Part 2: Line drawn in 2006 is reason for the headlines today\n\nAirlines Q2 turbulence: Fewer passengers, rising fares and a crude shock\n\nBritannia\u2019s next big bet for young India lies beyond biscuits\n\nThe world is witnessing a bond rout. Why should it matter to you?\n\nQ2 earnings season: Will it settle or add to confusion in the stock market?\n\nThe NBFC saga - Part 1: How RBI moved from protecting depositors to policing systemic risk\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "09 Oct 2026, 12:32 AM IST", "pub_date_relative": "17m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Fixed Income"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "US freezes Microsoft, Adobe, Infosys green-card applications over alleged fraud", "full_content": "", "source": "Investing.com News", "pub_date_str": "09 Oct 2026, 12:31 AM IST", "pub_date_relative": "19m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Oil prices jump as Iran steps up tanker attacks, hurricane threatens U.S. Gulf production", "full_content": "Crude oil prices rose sharply Thursday, as Iran ramped up its attacks on tankers transiting the Strait of Hormuz and Hurricane Isaias threatened U.S. offshore production in the Gulf of Mexico.\n\nBrent crude futures, the international benchmark, gained 4% to close at $104.28 a barrel. U.S. West Texas Intermediate futures advanced 3.6% to settle at $91.49 per barrel.\n\nNine tankers have come under attack in and around Hormuz over the past week, jeopardizing the recent recovery in crude oil flows through the strait\n\nOil prices backed off session highs after President Donald Trump said the U.S. would not attack Iran before the November midterm elections. NBC News, citing unnamed sources, reported earlier that Trump and his national security team were considering renewing strikes in the coming weeks.\n\nSome 9.5 million barrels per day exited Hormuz during the week ended Tuesday, about 30% below normal levels before the Iran war, according to Kpler data. Crude flows from the Middle East, including pipeline workarounds, stood at 16.4 million bpd which is nearly equivalent to prewar levels.\n\nIn the Gulf of Mexico, oil companies have shut in about 500,000 bpd, or 25% of offshore production in the region, as Hurricane Isaias churns toward the coasts of Alabama, Mississippi and the Florida panhandle.\n\nbrent Tensions are sharply escalating in the Middle East. Iran-backed Houthi militants in Yemen fired missiles at airports in Saudi Arabia's capital Riyadh and the city of Abha on Tuesday and Wednesday. Three people died and 36 were injured, according to the state-owned media outlet Al Arabiya.\n\nThe Saudis intercepted another volley of ballistic missiles fired Thursday at Riyadh and Khamis Mushait, a spokesperson for the kingdom's military said.", "source": "CNBC Top News", "pub_date_str": "09 Oct 2026, 12:30 AM IST", "pub_date_relative": "19m ago", "cfa_topics": ["Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "GST reforms 2026: Govt plans faceless, centralised CGST system for 2 lakh multi-jurisdiction taxpayers", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a GST reforms 2026: Govt plans faceless, centralised CGST system for 2 lakh multi-jurisdiction taxpayers The Economic Times daily newspaper is available online now. Read Today's Paper GST reforms 2026: Govt plans faceless, centralised CGST system for 2 lakh multi-jurisdiction taxpayers SECTIONS GST reforms 2026: Govt plans faceless, centralised CGST system for 2 lakh multi-jurisdiction taxpayers By ET TEAM Last Updated: Oct 09, 2026, 12:29:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis GST reforms 2026 will move around 2 lakh businesses operating across multiple CGST jurisdictions towards a centralised, faceless tax administration, Finance Minister Nirmala Sitharaman said. The framework will cover scrutiny, audits, adjudication, appeals and taxpayer services, with public consultation planned before Budget 2027 and implementation targeted for FY28.\n\nThe NBFC saga - Part 2: Line drawn in 2006 is reason for the headlines today\n\nAirlines Q2 turbulence: Fewer passengers, rising fares and a crude shock\n\nBritannia\u2019s next big bet for young India lies beyond biscuits\n\nThe world is witnessing a bond rout. Why should it matter to you?\n\nQ2 earnings season: Will it settle or add to confusion in the stock market?\n\nThe NBFC saga - Part 1: How RBI moved from protecting depositors to policing systemic risk\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "09 Oct 2026, 12:29 AM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Fixed Income"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "RBI\u2019s sell-buy swaps slow rupee\u2019s fall but push up forward premiums, making hedging costlier for foreign investors", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a RBI\u2019s sell-buy swaps slow rupee\u2019s fall but push up forward premiums, making hedging costlier for foreign investors The Economic Times daily newspaper is available online now. Read Today's Paper RBI\u2019s sell-buy swaps slow rupee\u2019s fall but push up forward premiums, making hedging costlier for foreign investors SECTIONS RBI\u2019s sell-buy swaps slow rupee\u2019s fall but push up forward premiums, making hedging costlier for foreign investors By Joel Rebello , ET Bureau Last Updated: Oct 09, 2026, 12:38:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Reserve Bank of India is engaged in dollar sell-buy swaps to stabilize the rupee's value. However, this has resulted in higher forward premiums, making it expensive for foreign investors to hedge. As a consequence, some foreign investments in rupee-denominated assets may decline. Additionally, companies are opting to borrow in rupees and exchange for dollars due to favorable local rates.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\nThe NBFC saga - Part 2: Line drawn in 2006 is reason for the headlines today\n\nAirlines Q2 turbulence: Fewer passengers, rising fares and a crude shock\n\nBritannia\u2019s next big bet for young India lies beyond biscuits\n\nThe world is witnessing a bond rout. Why should it matter to you?\n\nQ2 earnings season: Will it settle or add to confusion in the stock market?\n\nThe NBFC saga - Part 1: How RBI moved from protecting depositors to policing systemic risk", "source": "Economic Times Economy", "pub_date_str": "09 Oct 2026, 12:24 AM IST", "pub_date_relative": "25m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Fixed Income", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "The options market is reminding investors there\u2019s a cure for rising bond yields \u2014 higher yields", "full_content": "The MOVE Index \u2014 the Treasury market\u2019s \u201cfear gauge\u201d \u2014 has reached heights that in the past suggested yields may have peaked, at least for now.", "source": "MarketWatch Top Stories", "pub_date_str": "09 Oct 2026, 12:21 AM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Fixed Income", "Derivatives"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Treasuries Rise as Lofty Yields Lure Demand to 30-Year Sale", "full_content": "(Bloomberg) -- US Treasuries rose after an auction of 30-year debt drew solid demand as long-dated yields edge away from their highest levels in more than two decades.\n\nThe gains sent yields lower across maturities on Thursday, with those on 30-year bonds down by six basis points to 5.61% \u2014 off their highest levels since 2002. A $22 billion sale of the US government\u2019s longest bond was met with good investor appetite, echoing this week\u2019s strong 10-year auction.\n\n\u201cDemand held up,\u201d said Molly Brooks, rates strategist at TD Securities. \u201cIt\u2019s a good sign for those that want to dip their toes back in the long end.\u201d\n\nLonger-term debt from around the world has been selling off in recent months as angst has built up around the Iran war\u2019s effect on energy costs and the fallout for inflation. Fiscal concerns have also added to the pressure, with 30-year Treasury yields knocking out a series of milestone levels as they surged in recent weeks.\n\nOn Thursday, however, they slid as President Donald Trump said in a social media post that he\u2019d hold off on attacking Iran again until after the US midterms on Nov. 3. Long-dated yields extended their declines as oil prices fell from an earlier peak around $105 per barrel.\n\n\u201cThere was a lot of rumbling about potential pre-midterm strikes, so this takes some pressure off near-term oil,\u201d said Izaac Brook, US rates strategist at RBC Capital Markets. \u201cThis is just a near-term removal of Iran escalation tail risk.\u201d\n\nShort-end yields also pulled back. Two-year yields \u2014 which are more sensitive to the Federal Reserve\u2019s path \u2014 were down to 4.75%.\n\nTraders were pricing in a roughly 20% chance that the US central bank boosts interest rates later this month and are fully pricing in a move by year\u2019s end.", "source": "LiveMint Markets", "pub_date_str": "09 Oct 2026, 12:20 AM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Wall St turns lower as crude spikes, chip stocks weigh", "full_content": "NEW YORK, Oct 8 (Reuters) - Wall Street dipped on Thursday as crude prices surged on a spike in Middle East tensions and a cut in US output that fed inflation and rate-hike fears, while semiconductor stocks slumped.\n\nAll three major US stock indexes lost ground, with the tech-heavy Nasdaq down the most.\n\nChipmakers, which have soared over 80% so far this year, were clear underperformers, falling 3.0%. Investors worried that rising interest rates could become a headwind to the rapid AI buildout, which has leaned heavily on debt for funding.\n\n\"The market is in a state of nervousness due to high oil prices, as it prepares for earnings season which basically starts next week,\" said Peter Cardillo, chief market economist at Spartan Capital Securities in New York. \"That's the excuse for what I believe is profit-taking.\"\n\n\"It's a somewhat cautious market, but 'cautious' is not a dirty word,\" Cardillo added.\n\nOil prices jumped on supply concerns after a spate of attacks on shipping in the Strait of Hormuz, combined with a cut in US output due to hurricane activity.\n\nTight global crude supplies during the Iran war have sent US crude soaring more than 60% so far this year, stoking inflation pressures. In response to those pressures, the US Federal Reserve hiked interest rates in September for the first time since July 2023.\n\nDuring Thursday's session, benchmark US Treasury yields inched higher, hovering near multi-year highs, while yields on 2-year notes, which tend to reflect Fed rate expectations, moved up more decisively.", "source": "LiveMint Markets", "pub_date_str": "09 Oct 2026, 12:17 AM IST", "pub_date_relative": "32m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "The Trump administration is suspending Microsoft from a green card program, alleging fraud - AP News", "full_content": "The Trump administration is suspending Microsoft from a green card program, alleging fraud AP News Vance suspends Microsoft, others from foreign workers applying for green cards, alleges visa 'abuse' Fox Business H-1B visas aren't suspended. Here's what Vance is really targeting Axios Trump officials block Microsoft\u2019s access to program for employee green cards The Washington Post U.S. suspends Microsoft, Adobe from green card labor program in foreign worker crackdown CNBC", "source": "Google News Business", "pub_date_str": "09 Oct 2026, 12:11 AM IST", "pub_date_relative": "39m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Black Sea attacks hit yellow peas, sunflower oil supplies to India", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a Black Sea attacks hit yellow peas, sunflower oil supplies to India The Economic Times daily newspaper is available online now. Read Today's Paper Black Sea attacks hit yellow peas, sunflower oil supplies to India SECTIONS Black Sea attacks hit yellow peas, sunflower oil supplies to India By Jayashree Bhosale , ET Bureau Last Updated: Oct 09, 2026, 12:11:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Russia's exports of yellow peas and sunflower oil to India have been disrupted by ongoing conflicts. As a result, prices for yellow peas have risen from \u20b940 to \u20b946 per kg in the last two months. Importers report that shipments from Russia have not occurred recently, affecting the availability of yellow peas. Meanwhile, sunflower oil shipments are also hindered, causing expectations of higher prices in the near future.\n\nThe NBFC saga - Part 2: Line drawn in 2006 is reason for the headlines today\n\nAirlines Q2 turbulence: Fewer passengers, rising fares and a crude shock\n\nBritannia\u2019s next big bet for young India lies beyond biscuits\n\nThe world is witnessing a bond rout. Why should it matter to you?\n\nQ2 earnings season: Will it settle or add to confusion in the stock market?\n\nThe NBFC saga - Part 1: How RBI moved from protecting depositors to policing systemic risk\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "09 Oct 2026, 12:09 AM IST", "pub_date_relative": "41m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Fixed Income"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "This cybersecurity stock is already growing revenue at a 20% clip. And now here comes the AI boost", "full_content": "SentinelOne combines strong revenue growth with improving profitability as it expands its cybersecurity platform beyond endpoint security.", "source": "CNBC Top News", "pub_date_str": "09 Oct 2026, 12:05 AM IST", "pub_date_relative": "44m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "US 30-year fixed-rate mortgage rate hits 7.40%, likely to further erode housing demand", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a US 30-year fixed-rate mortgage rate hits 7.40%, likely to further erode housing demand Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US 30-year fixed-rate mortgage rate hits 7.40%, likely to further erode housing demand SECTIONS US 30-year fixed-rate mortgage rate hits 7.40%, likely to further erode housing demand Reuters Last Updated: Oct 08, 2026, 11:57:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis In the U.S., the 30-year fixed-rate mortgage has surged to 7.40%, fueled by rising inflation that has also driven up energy costs and Treasury yields. With midterm elections looming, the housing market is grappling with affordability challenges. Homeowners are reluctant to sell due to these higher mortgage rates. While home prices remain high, experts forewarn of a potential market stall rather than a significant downturn.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "08 Oct 2026, 11:57 PM IST", "pub_date_relative": "52m ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Diversified equity mutual funds in the red October 2026: Which schemes have negative YTD, 3- and 5-year CAGR returns?", "full_content": "Investors often focus on mutual funds that have delivered high returns over a particular period. However, it is equally important to understand which funds have struggled.\n\nHere are the top 10 diversified equity funds (excluding sectoral and thematic funds) that delivered the most negative returns on a year-to-date (YTD), three-year, and five-year basis as of October 2026. Let\u2019s see whether any fund names feature across all these periods.\n\nAs of 7 October 2026, several diversified equity funds were in negative territory on a year-to-date (YTD) basis. The list includes the top 10 funds across value and large-cap categories, with the weakest performers down by more than 10%.\n\n*Source: Morningstar, Direct plans, Returns as on 7 October 2026\n\nThe list is led by ICICI Prudential Value Fund, which delivered the most negative return this year at -12.35%. It was followed by Quantum Value Fund at -11.95% and Parag Parikh ELSS Tax Saver Fund at -11.78%.\n\nQuantum ELSS Tax Saver Fund and Mahindra Manulife Large Cap Fund were also among the weakest performers.\n\nThe remaining three funds in the top 10 were ICICI Prudential Large Cap Fund at -11.09%, DSP Large Cap Fund at -10.61%, and UTI Large Cap Fund at -10.55%.\n\nThe picture looks considerably different when returns are assessed over a three-year period. Based on the funds in this analysis, only one active diversified equity fund remains in negative territory over three years.", "source": "LiveMint Money", "pub_date_str": "08 Oct 2026, 11:55 PM IST", "pub_date_relative": "54m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Bond yields fell, as the Treasury market passed a crucial test of investor confidence", "full_content": "Higher bond yields aren\u2019t only about inflation and the Iran war. But it means a higher cost of capital.", "source": "MarketWatch Top Stories", "pub_date_str": "08 Oct 2026, 11:49 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Corporate Issuers", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Nvidia, Oracle, CoreWeave and other AI stocks sink on OpenAI revenue report", "full_content": "Shares of Nvidia , Oracle , CoreWeave and other artificial intelligence names sank lower on Thursday after the market learned more details about OpenAI's revenue.\n\nOpenAI told investors that it hit roughly $50 billion in annualized revenue at the end of September, CNBC confirmed, lower than the the $68 billion figure that was widely reported late last month. A person familiar with the matter said the $68 billion figure included gross revenue from OpenAI's partners, which helps investors make a more direct comparison with its chief rival, Anthropic .\n\nThe Financial Times was first to report the $50 billion figure.\n\nOpenAI shared an update about its finances in an investor presentation, said the person, who asked not to be named in order to discuss the numbers. In addition to the $50 billion in annualized revenue, OpenAI touted 77% total run rate growth during its third quarter, as well as 107% run rate growth for its enterprise business during the same period, the person said.\n\nThe company is under pressure to justify its $852 billion valuation to investors as it gears up for what is widely expected to be a blockbuster IPO. OpenAI confidentially filed its prospectus with regulators in June, and executives have signaled that the company is eyeing a 2027 debut.\n\nIn the interim, OpenAI is engaging in early stage discussions with investors about a potential new funding round. The company could raise around $30 billion, as CNBC previously reported, but that figure could change. The round is being driven by investor demand and no term sheet has been finalized yet.\n\nOpenAI closed a historic $122 billion funding round in March, and CFO Sarah Friar told CNBC last week that it is still \"very well capitalized.\"\n\nNvidia, Oracle, CoreWeave stock chart. WATCH: OpenAI annualized revenues $20 billion less than previously signaled: Report", "source": "CNBC World Economy", "pub_date_str": "08 Oct 2026, 11:48 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "US President Donald Trump buys $1 million-plus stakes in Meta, Microsoft, McDonald\u2019s; adds SpaceX debt", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a US President Donald Trump buys $1 million-plus stakes in Meta, Microsoft, McDonald\u2019s; adds SpaceX debt Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US President Donald Trump buys $1 million-plus stakes in Meta, Microsoft, McDonald\u2019s; adds SpaceX debt SECTIONS US President Donald Trump buys $1 million-plus stakes in Meta, Microsoft, McDonald\u2019s; adds SpaceX debt By ETMarkets.com Last Updated: Oct 08, 2026, 11:47:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Donald Trump invested over $1 million in stocks of several major companies during August. Notable purchases included Meta Platforms, McDonald's, Microsoft, and space-related debt from SpaceX. His investment activities encompass trading in shares of Nvidia and Advanced Micro Devices, key players in the AI sector. Trump's financial dealings during his presidency have raised concerns about potential conflicts of interest.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "08 Oct 2026, 11:47 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Trump bought up to $25 million in Meta and millions in SpaceX debt in August", "full_content": "President Donald Trump disclosed more than 500 securities transactions in August, including a purchase of up to $25 million in Meta stock and an investment of as much as $5 million in SpaceX debt two days before he signed a sweeping policy aimed at expanding U.S. commercial space transportation, according to a newly released financial disclosure .\n\nThe 517 purchases and sales totaled roughly $74.3 million to $273.3 million, according to a CNBC analysis of Trump's August financial disclosure, which reports each item in a range of value. Purchases accounted for at least $44.2 million and sales at least $30.1 million, CNBC calculated.\n\nThe 18-page filing shows Trump's portfolio remained highly active, even as trading slowed from June and July, when he disclosed more than 1,000 transactions in each month.\n\nThe largest transaction was an Aug. 21 purchase of between $5 million and $25 million in Meta shares, amid a broader portfolio reshuffling that day. Trump also reported buying between $1 million and $5 million each of AT&T , ConocoPhillips , Abbott Laboratories , Netflix and Chevron the same day.\n\nMeta did not immediately respond to CNBC's request for comment.\n\nOn the sell side, on Aug. 21, he unloaded between $1 million and $5 million each of Advanced Micro Devices and Church & Dwight , along with stakes worth between $500,001 and $1 million in companies including Boeing , Home Depot , T-Mobile , Datadog , Dell Technologies , Palo Alto Networks and Nvidia .\n\nOn Aug. 18, Trump's accounts purchased between $1 million and $5 million in senior unsecured notes issued by Elon Musk's rocket and satellite company, carrying a 5.35% interest rate and maturing in July 2031.\n\nTwo days later, Trump signed a national space transportation policy calling for the U.S. to support more than 1,000 launches and reentries annually by 2030.", "source": "CNBC World Economy", "pub_date_str": "08 Oct 2026, 11:46 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Bank delays your credit card closure, credit report correction or property documents? You are eligible for compensation", "full_content": "Banks and financial institutions are required to complete several customer- service requests within timelines prescribed by the Reserve Bank of India (RBI). If a bank fails to meet these deadlines, customers may be entitled to compensation for every day of delay, depending on the applicable RBI rules.\n\nThese compensation provisions cover a range of services, including credit card closure, failed digital transactions, return of property documents after loan repayment and correction of credit-report inaccuracies.\n\nThe compensation can range from \u20b9 100 per day to \u20b9 5,000 per day in certain cases.\n\nRBI's framework for customer compensation is largely deadline-driven. It specifies a turnaround time (TAT) for a particular service and, if the bank exceeds that period, compensation may become payable under the relevant rules.\n\nCustomers may be eligible for compensation when a digital transaction or ATM transaction fails but their account is debited.\n\nFor certain failed transactions, including some UPI, ATM, and card transactions, banks are required to resolve the issue within the applicable RBI-prescribed turnaround time. Where compensation is applicable, the bank must generally provide \u20b9 100 for each day of delay beyond the prescribed timeline, without requiring the customer to separately claim it.\n\nThe applicable timeline and compensation, however, depend on the type of transaction and the RBI framework governing it.\n\nCredit card holders are also protected by a specific RBI turnaround time.", "source": "LiveMint Money", "pub_date_str": "08 Oct 2026, 11:43 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Exports to hit $1 trillion this fiscal: Piyush Goyal", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a Exports to hit $1 trillion this fiscal: Piyush Goyal The Economic Times daily newspaper is available online now. Read Today's Paper Exports to hit $1 trillion this fiscal: Piyush Goyal SECTIONS Exports to hit $1 trillion this fiscal: Piyush Goyal By ET Bureau Last Updated: Oct 08, 2026, 11:40:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Goyal said that the nine free trade agreements finalised by India in recent years provide huge business opportunities for exporters. He urged industry chamber CII to set up FTA utilisation cells in states.\n\nThe NBFC saga - Part 2: Line drawn in 2006 is reason for the headlines today\n\nAirlines Q2 turbulence: Fewer passengers, rising fares and a crude shock\n\nBritannia\u2019s next big bet for young India lies beyond biscuits\n\nThe world is witnessing a bond rout. Why should it matter to you?\n\nQ2 earnings season: Will it settle or add to confusion in the stock market?\n\nThe NBFC saga - Part 1: How RBI moved from protecting depositors to policing systemic risk\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "08 Oct 2026, 11:40 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "France Is Veering Toward a Potential Debt Crisis Amid Protests and Turmoil - The New York Times", "full_content": "France Is Veering Toward a Potential Debt Crisis Amid Protests and Turmoil The New York Times Default May Be the Tail Risk Haunting French Bonds WSJ French central bank head warns country at risk of being \u2018strangled by interest rates\u2019 Financial Times France's bond-market turmoil is a warning for US investors as global borrowing costs keep rising Business Insider What\u2019s the Matter With France? Paul Krugman | Substack", "source": "Google News Business", "pub_date_str": "08 Oct 2026, 11:35 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "America shut out Chinese EVs. Britain welcomed them \u2014 and now faces a difficult choice", "full_content": "The U.K. broke with the U.S. by opening its doors to China's electric vehicle juggernaut .\n\nChinese EVs face only a 10% standard import duty in Britain, one of the largest major overseas markets without additional China-specific tariffs. Japan and Norway also lack them.\n\nIt's in contrast to the U.S., where a 100% tariff effectively shut Chinese EVs out. The European Union , the U.K.'s biggest trading partner, has manufacturer-specific duties on Chinese EVs of up to 35.3%, in addition to a standard 10% import duty on all foreign cars.\n\nNow, the U.K. faces a difficult choice, as EU proposals may force it to impose tariffs to match the bloc's.\n\nAt the weekend, The Sunday Times reported that U.K. Business Minister Jonathan Reynolds is considering matching the EU's levy on Chinese EVs to avoid the pain of so-called Made in Europe proposals, which could hurt domestic companies selling into the EU.\n\nA U.K. government spokesperson reiterated to CNBC that it had not imposed tariffs on Chinese EVs but added, \"We continue to engage closely with industry so that our approach reflects the sector's and UK's national interests.\"\n\nThe Made in Europe legislation, part of the EU's Industrial Accelera
