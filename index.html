    const allData = {"general": [{"title": "Real Madrid Vs RB Leipzig Live Streaming: Likely Lineups; How To Watch Champions League Match?", "full_content": "Looking to catch Kylian Mbappe in action? Here's everything you need to know about the Real Madrid vs RB Leipzig match.", "source": "NDTV Profit", "pub_date_str": "21 Oct 2026, 09:30 PM IST", "pub_date_relative": "just now"}, {"title": "Cantor Fitzgerald reiterates Overweight on Regions Financial stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Oct 2026, 06:24 PM IST", "pub_date_relative": "8m ago"}, {"title": "Stifel reiterates Hold rating on Crocs stock amid accounting shifts", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Oct 2026, 06:24 PM IST", "pub_date_relative": "8m ago"}, {"title": "Cantor Fitzgerald reiterates Salesforce stock rating on acquisition", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Oct 2026, 06:24 PM IST", "pub_date_relative": "8m ago"}, {"title": "Thousands of Greek students, teachers protest over education, pay", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Oct 2026, 06:24 PM IST", "pub_date_relative": "9m ago"}, {"title": "IGI Q2 FY27 slides: certification revenue surges 32%, EBITDA up 39%", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Oct 2026, 06:23 PM IST", "pub_date_relative": "9m ago"}, {"title": "Klarna launches cross-border payment service with no FX fees", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Oct 2026, 06:22 PM IST", "pub_date_relative": "10m ago"}, {"title": "High Roller launches prediction markets platform ROLR", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Oct 2026, 06:22 PM IST", "pub_date_relative": "10m ago"}, {"title": "XAI Floating Rate fund completes tender offer with 26% proration", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Oct 2026, 06:22 PM IST", "pub_date_relative": "10m ago"}, {"title": "Super Micro shares jump 12% after Q1 preliminary results top estimates. Can the AI server maker sustain its recovery?", "full_content": "Super Micro Computer surged 12.3% in pre-market trading on Wednesday, October 21, hitting $36.46, after the server maker released preliminary first-quarter fiscal 2027 results on October 20 that far exceeded expectations, driven by relentless demand for AI data centres.\n\nThe company forecast first-quarter revenue of $18.5 billion to $19.5 billion, well above analysts\u2019 expectations of $15.23 billion, according to data compiled by LSEG. It also expects profit margins to range between 12% and 12.5%, compared with earlier expectations of 10.4% to 10.8%.\n\nSuper Micro has benefited from surging demand for equipment used to train and run AI workloads. Its servers are equipped with Nvidia Corp. chips, which have become the preferred components for a large share of AI data centres.\n\nMicrosoft, Google, Amazon and Meta are expected to spend more than $700 billion on AI infrastructure this year, underscoring the scale of investment in the sector. Other server makers, Dell and Hewlett Packard Enterprise, also gained 5.2% and 4%, respectively, before the bell.\n\n\u201cInvestors are likely to focus on whether strong performance in core businesses can continue to support elevated AI investment,\u201d strategists at UBS Global Wealth Management said. The brokerage added that commentary from AI giants on spending, margins and returns would be closely scrutinised to determine whether the AI capital expenditure cycle can be justified, Reuters reported.\n\nMarkets have recently grown concerned about the profitability of data centre operators, many of which have been issuing debt to finance their expansion at a time when borrowing costs are rising.\n\nSuper Micro said it would discuss the results during a conference call scheduled for November 3.", "source": "LiveMint Markets", "pub_date_str": "21 Oct 2026, 06:21 PM IST", "pub_date_relative": "11m ago"}, {"title": "France\u2019s borrowing costs hit 5% for first time since 2002", "full_content": "Concerns over public finances and political stability have helped push up 10-year bond yields from 3.2% in late February", "source": "FT Markets", "pub_date_str": "21 Oct 2026, 06:21 PM IST", "pub_date_relative": "11m ago"}, {"title": "Oil prices little changed as traders assess Middle East developments", "full_content": "Oil prices were little changed Wednesday as worries over Middle East supply disruptions keep the market on edge, with attacks on tankers near the Strait of Hormuz and Saudi energy facilities denting sentiment.\n\nBrent crude futures lost 17 cents to $108.62 a barrel as of 8:47 a.m. ET, while U.S. West Texas Intermediate crude rose 8 cents to $97.90 a barrel.\n\nBrent crude prices this year Iran's Revolutionary Guards said Tuesday that naval mines had prevented three tankers attempting to pass through the Strait of Hormuz using routes Tehran deemed unauthorized.\n\n\"Two violating oil tankers were set ablaze and halted due to the explosion of mines planted by the brave sailors of the IRGC Navy at an illegal crossing point in the southern part of the Strait of Hormuz,\" IRGC said in a statement published on their official Sepah News website .\n\nAdding to regional worries, Yemen's Houthi militants claimed responsibility on Monday for strikes targeting Saudi Aramco facilities in Yanbu, the Shaybah oilfield and airports in Riyadh and Abha.\n\nThe escalating tensions have also sent global oil shipping costs soaring, adding another layer of pressure to energy markets.\n\nThe global average crude freight rate has surged above $20 per barrel, compared with just $3 a year earlier, according to a Goldman Sachs report published Tuesday. While rates have eased slightly in recent days, they remain roughly seven times higher than a year ago.\n\nGoldman estimated that war-risk premiums associated with crossing the Strait of Hormuz accounted for about $7 of the $20 year-on-year increase in average crude freight rates, while ship-to-ship transfers outside the Persian Gulf contributed another $4.", "source": "CNBC Top News", "pub_date_str": "21 Oct 2026, 06:18 PM IST", "pub_date_relative": "14m ago"}, {"title": "Cantor Fitzgerald reiterates SharonAI stock rating amid data center concerns", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Oct 2026, 06:18 PM IST", "pub_date_relative": "14m ago"}, {"title": "Cantor Fitzgerald keeps Chubb stock neutral on commercial concerns", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Oct 2026, 06:18 PM IST", "pub_date_relative": "14m ago"}, {"title": "Futures orbit around SpaceX as Tesla merger talk cheers investors", "full_content": "This is CNBC's Morning Squawk newsletter. Subscribe here to receive future editions in your inbox.\n\nHello, this is Leonie Kidd, with today's edition of Morning Squawk.\n\nOne man is the center of gravity for the biggest market-moving stories of the day - Elon Musk.\n\nFrom SpaceX and Tesla's possible mega-merger plan, to astronomical earnings from SpaceX, to more results to come from Tesla and the squaring-off over Starlink, he is hitting all the headlines.\n\nSpaceX shares are spiking in premarket trade after Elon Musk unveiled a special committee had been put in place to merge the rocket group with Tesla, in a move he called a \"good idea.\"\n\nMusk also said he represents a \"conflicted party,\" meaning he will not be included in the discussions.\n\nIt would be the largest merger in history, creating a giant company worth roughly 3 and a half trillion dollars. Tesla shares were also moving higher in early trading.\n\nWhy it matters: An existing joint venture between the two companies - Terafab - is aiming to test its first SRAM chip by June next year, targeting one terawatt a year of computing power. Musk said a full merger would mean there is \"a lot to be gained from cooperating on developing superintelligence software.\"", "source": "CNBC World Economy", "pub_date_str": "21 Oct 2026, 06:14 PM IST", "pub_date_relative": "19m ago"}, {"title": "Nvidia announces plug and play Vera Rubin racks that can be shipped on a truck", "full_content": "Nvidia announced Wednesday a new product that will put seven of its Vera Rubin AI racks into a shipping container, the company's latest effort to move up the stack and offer complete systems for artificial intelligence computing.\n\nThe DSX Pod AI Factory is roughly the size of a standard shipping container and weighs about 28,000 kilograms (nearly 62,000 pounds), Nvidia said. It's designed to be shipped on a truck on normal roads and all the cabling and liquid cooling for the Pod are assembled at the factory, the company said.\n\n\"The only thing that has to happen when it gets to the site is it's placed in its location, connected to the rest of the other containers, and validated through final burning and testing,\" Ian Buck, vice president of hyperscale computing at Nvidia, said on a call with reporters this week.\n\nThe DSX Pod AI factory will reduce the time for a new AI data center to start serving tokens from six months to 14 days, according to the company. Nvidia said the pod is intended for customers worldwide and could help address deployment challenges faced by European customers.\n\nNvidia did not announce a price for the system, but analysts say a single Vera Rubin rack can cost more than $7 million.\n\nThe DSX Pod is a reference design that will ship from Nvidia's manufacturing partners. Nvidia said it was working with manufacturers including Foxconn, Gigabyte, Lenovo, HPE, Quanta and Pegatron. Nvidia expects deliveries to start in early 2027.\n\nNvidia, once a chip company, now offers networking, storage and other data center needs to its customers.", "source": "CNBC World Economy", "pub_date_str": "21 Oct 2026, 06:13 PM IST", "pub_date_relative": "19m ago"}, {"title": "Rupee rises 46 paise to 94.45 on India-US trade deal hopes; oil prices cap gains", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Forex \u203a Forex News \u203a Rupee rises 46 paise to 94.45 on India-US trade deal hopes; oil prices cap gains LKP Securities Share Price AK Capital Services Share Price Master Trust Share Price Prime Securities Share Price Dolat Algotech Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Rupee rises 46 paise to 94.45 on India-US trade deal hopes; oil prices cap gains SECTIONS Rupee rises 46 paise to 94.45 on India-US trade deal hopes; oil prices cap gains By Kumar Gaurav , ETMarkets.com Last Updated: Oct 21, 2026, 06:07:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The rupee gained 46 paise to 94.45 against the dollar on optimism over a potential India-US trade deal and RBI measures. However, elevated crude prices, foreign outflows and global financial pressures continue to threaten the currency's recovery.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "21 Oct 2026, 06:07 PM IST", "pub_date_relative": "26m ago"}, {"title": "Aye Finance Q2 Results: Net profit more than doubles to Rs 87 crore", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a Earnings \u203a Aye Finance Q2 Results: Net profit more than doubles to Rs 87 crore Aye Finance Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Aye Finance Q2 Results: Net profit more than doubles to Rs 87 crore SECTIONS Aye Finance Q2 Results: Net profit more than doubles to Rs 87 crore PTI Last Updated: Oct 21, 2026, 06:05:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Aye Finance Ltd's net profit surged to Rs 87 crore in the second quarter of the financial year, a remarkable increase from Rs 35 crore in the same timeframe last year. Total income also climbed to Rs 527 crore, reflecting an 18.42% year-over-year growth. The interest income saw a rise to Rs 479 crore, while assets under management swelled by 26% to hit Rs 7,597 crore as of September 2026.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "21 Oct 2026, 06:05 PM IST", "pub_date_relative": "28m ago"}, {"title": "Tokenized stock trading takes off overseas as Goldman, other U.S. companies object", "full_content": "Trading in so-called tokenized stocks is gaining momentum in international markets, even as major U.S. companies are pushing back against efforts to introduce them domestically.\n\nTrading activity around blockchain-based versions of traditional financial assets including equities is growing, according to the latest quarterly staking report by Bitwise Asset Management, published Tuesday. On Robinhood Chain, the brokerage firm's newly launched network for users and AI agents to trade various assets onchain, tokenized stocks volume surged from $526 million in July to $2.21 billion in August, then rocketed to $11.31 billion in September.\n\nIn the same quarter, non-crypto markets made up 36.5% of Hyperliquid's perpetuals volume, up from 32.7% in the previous quarter. Also, tokenized equities were the fastest-growing category on Solana.\n\nMeanwhile, Goldman Sachs , Microsoft , Qualcomm , Caterpillar , McDonald's , Western Digital and Alphabet have objected to having tokenized versions of their shares traded on the OKXICE platform, the tokenized securities venue jointly launched the crypto exchange OKX and New York Stock Exchange parent Intercontinental Exchange.\n\nOKXICE disclosed the company objections in a public notice Monday, adding them to a group of earlier objectors including CoreWeave , UnitedHealth , Broadcom , Applied Digital , AppLovin and Cerebras .\n\nThe contrast highlights a growing debate and challenge for the crypto industry: how to convince companies that tokenized trading of their stock is worth embracing. Tokenization \u2013 the process of issuing digital representations of publicly traded securities, real world assets or any other form of value on a blockchain network \u2013 has become a major topic of interest in the market given the potential for blockchain technology to improve accessibility and liquidity across financial assets.\n\nIt's also raising questions about what rights tokens should provide for holders.", "source": "CNBC World Economy", "pub_date_str": "21 Oct 2026, 06:03 PM IST", "pub_date_relative": "29m ago"}, {"title": "Heckler disrupts Nvidia CEO Huang\u2019s speech at Berlin conference", "full_content": "The person shouted something that could not be heard on the company\u2019s livestream about 20 minutes into the address, before being removed from the auditorium.", "source": "MarketWatch Top Stories", "pub_date_str": "21 Oct 2026, 06:02 PM IST", "pub_date_relative": "31m ago"}, {"title": "Best bank accounts for nonprofits of 2026", "full_content": "The right bank account can help a nonprofit manage its money and keep more available for its mission. Nonprofits have needs that many businesses don't, from managing restricted grants to depositing cash from fundraisers, so it pays to compare accounts before choosing one.\n\nCNBC Select reviewed nonprofit and business checking accounts from national banks, online platforms and mission-driven lenders to help you compare options. We considered monthly fees, transaction and cash deposit limits, interest, account management tools and nonprofit-specific support. Read more about our methodology below.\n\nOffers in this section are from affiliate partners and selected based on a combination of engagement, product relevance, compensation, and consistent availability.\n\n3.09% with a daily balance of $5,000,000 or below; 3.90% with a daily balance above $5,000,000\n\nVaries. The account has an option to earn interest, but rates are set at the bank's discretion, and you must keep the minimum balance for each tier to earn the stated APY\n\n1,800 free transactions per year, plus 300 free cash deposit units per calendar year. Includes a U.S. Bank Business Debit Card. Shared Access lets organizations assign user permissions.\n\n$36 for each overdraft item paid, up to three fees per day. No fee if the account is overdrawn by $50 or less at the end of the business day\n\nTerms apply. Deposit products are offered by U.S. Bank National Association. Member FDIC", "source": "CNBC Top News", "pub_date_str": "21 Oct 2026, 06:00 PM IST", "pub_date_relative": "33m ago"}, {"title": "Extent of rate hike cycle to depend on growth-inflation outlook: RBI Governor", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a Extent of rate hike cycle to depend on growth-inflation outlook: RBI Governor The Economic Times daily newspaper is available online now. Read Today's Paper Extent of rate hike cycle to depend on growth-inflation outlook: RBI Governor SECTIONS Extent of rate hike cycle to depend on growth-inflation outlook: RBI Governor PTI Last Updated: Oct 21, 2026, 05:56:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Reserve Bank of India (RBI) Governor Sanjay Malhotra said the duration and extent of the rate hike cycle will be contingent on the actual growth-inflation developments and outlook. The governor and other five Monetary Policy Committee (MPC) members voted to raise the repo rate by 25 bps to 5.5 per cent. The rate was hiked after a gap of nearly four years. He noted that there are increasing signs of generalisation of inflation.\n\nOne company, 2 words. Bond yield and CDS: Will they decide the fate of global markets?\n\nBusiness of Odd Things: Inside an industry that farms fish that nobody is meant to eat\n\nWar's second-order effects are becoming visible in critical sectors\n\nUS mid-term elections \u2013 Part 2: What does it mean for Trump to lose control of Congress?\n\nHomebuyers wait as NCLT panel picks holes in unfinished Jaypee projects\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "21 Oct 2026, 05:56 PM IST", "pub_date_relative": "36m ago"}, {"title": "Suzlon Energy declares Q2 results 2026 date; can Q2 earnings bring a bounce-back in share price? Target, stop-loss", "full_content": "Suzlon Energy Q2 Results 2026 Date | Stock to buy: The board of directors of Suzlon Energy Ltd., has declared the date for the announcement of the Q2 results 2026. The renewable energy company informed, through an exchange filing, that the board of directors will meet on 29th October 2026 to declare the company's financial results for the July to September 2026 quarter.\n\nSuzlon Energy declared the Q2 results 2026 date in an exchange filing, saying, \"Pursuant to Regulation 29 of the Securities and Exchange Board of India (Listing Obligations and Disclosure Requirements) Regulations, 2015, this is to inform that a Meeting of the Board of Directors of the Company will be held on Thursday, 29th October 2026 to, inter alia, consider and approve the Unaudited Financial Results of the Company on Standalone and Consolidated basis for the quarter and half year ended on 30th September 2026.\"\n\nSo, as per the Company\u2019s Code of Conduct to regulate, monitor and report trading by Insiders as required to be implemented in terms of the Securities and Exchange Board of India (Prohibition of Insider Trading) Regulations, 2015, as amended, the Trading Window of the Company has been closed from Thursday, 1st October 2026 till 48 (Forty Eight) hours after the declaration of the financial results of the Company (both days inclusive). Accordingly, the Trading Window shall remain closed till Saturday, 31st October 2026 and shall reopen on Sunday, 1st November 2026.\n\nAccording to stock market experts, Suzlon Energy is expected to report strong Q2FY27 numbers, which may work as a bounce-back factor for the energy counter. They said the renewable energy sector is well-positioned for better business during the July to September 2026 quarter.", "source": "LiveMint Markets", "pub_date_str": "21 Oct 2026, 05:54 PM IST", "pub_date_relative": "39m ago"}, {"title": "SpaceX up 8% in premarket after earnings beat and Musk hints at Tesla tie-up", "full_content": "SpaceX jumped in premarket trading on Wednesday after the company reported surging revenue growth in its third quarter, and owner Elon Musk floated a potential SpaceX- Tesla merger.\n\nThe space company, which made its debut on the Nasdaq in the biggest IPO ever in June, reported third-quarter revenue on Tuesday of $14.6 billion, up 161% from the previous year, and beating LSEG consensus estimates of $12.72 billion.\n\nMeanwhile, its operating income from operations came in at $2.8 billion, with net income of $4.4 billion, after reporting a net loss of $1.05 billion in the same period a year earlier.\n\nOn the earnings call, Musk said he's considering a combination with Tesla \u2014 which would mark the largest merger in history \u2014 and that the boards of both companies have created specific committees to discuss a consolidation.\n\n\"I do think there's a lot of merit to combining the companies as we are pretty much in the superintelligence singularity, and there's a lot to be gained from cooperating,\" Musk said on the call. Tesla is set to report third-quarter earnings after the closing bell on Wednesday.\n\nSpaceX shares last rose 8.25% before the markets opened on Wednesday. Meanwhile, Tesla shares were up 1.4% in premarket trading.\n\nShares of other space stocks, including Rocket Lab , Intuitive Machines , and AST SpaceMobile , were all higher in premarket trading.\n\nSpaceX shares since its debut on the Nasdaq. SpaceX forecasts first-quarter 2027 revenue between $33 billion and $37 billion, beating the average analyst estimate of $22.2 billion, per LSEG.", "source": "CNBC World Economy", "pub_date_str": "21 Oct 2026, 05:53 PM IST", "pub_date_relative": "40m ago"}, {"title": "Investors are questioning neoclouds' business model but Nebius says AI computing prices are rising", "full_content": "BERLIN \u2014 Nebius is seeing AI computing prices rise more than expected, a top executive told CNBC on Wednesday, offering a bullish view as neocloud firms' business model comes under increasing scrutiny .\n\nInvestors have grown wary after CoreWeave , one of the biggest neocloud players, saw its cost of borrowing spike . The CoreWeave developments and questions around the amount of debt being used to fund the data center buildout have weighed heavily on other neoclouds like Iren and Nebius, whose stocks have dropped sharply over the last month.\n\nMarc Boroditsky, chief revenue officer at Nebius, said his company wasn't in CoreWeave's position because \"we're not carrying the kind of debt that they are.\"\n\nHe also said that if the AI infrastructure company brought its 2027 capacity online, it would sell out. There could be \"the same type of dynamic\" in 2028, supporting a positive longer-term demand outlook, he said, as companies race to secure access to computing power.\n\nWhen asked whether he sees the price per megawatt continuing to rise ahead of expectations, Boroditsky replied: \"Yeah.\"\n\nNebius is among a new wave of Neocloud companies that are investing billions to buy up Nvidia 's graphics processing units, build data centers and rent that capacity.\n\nNebius ran an auction for computing capacity on Tuesday, which showed continued price rises, the revenue chief said. \"We're seeing continued upward mobility in terms of the kind of price per megawatt,\" he told CNBC.\n\nPrice per megawatt, a key measure among new cloud companies, shows how much a company can charge customers for a certain amount of computing capacity.", "source": "CNBC World Economy", "pub_date_str": "21 Oct 2026, 05:51 PM IST", "pub_date_relative": "42m ago"}, {"title": "OpenAI to bring AI models to Google's cloud, in further expansion beyond Microsoft", "full_content": "OpenAI will make its artificial intelligence models available for developers through Google's cloud, following years of competition between the two companies.\n\nFor OpenAI, the effort reflects a growing push to expand distribution of its technology to enterprise developers. That's critical as the ChatGPT creator looks to build its business beyond its consumer roots, and the move puts OpenAI's models on all three of the top cloud infrastructure providers.\n\nLess than six months ago, OpenAI said Microsoft would no longer have the exclusive license on its intellectual property. The day after that ended, cloud leader Amazon unveiled plans to host OpenAI models .\n\nNow Google is getting its shot, bringing OpenAI's GPT products to its cloud's model garden and Antigravity coding tool in the coming weeks.\n\n\"Google Cloud's longstanding investment in machine learning and AI has made it a destination for AI workloads and the developers and data scientists building them,\" OpenAI said in a blog post.\n\nGoogle has been on a run in cloud computing this year. Annualized revenue growth in the segment accelerated to about 82% in the second quarter from 63% in the first quarter, thanks partly to strong demand for AI models and custom chips. Amazon and Microsoft posted second-quarter cloud growth of 37% and 42% , respectively. All three report quarterly results next week.\n\nMost business spending on AI is on OpenAI and Anthropic, according to data from corporate card issuer Ramp, though some corporate IT departments have integrated Google's Gemini models into their systems. In September, Google announced its next-generation Gemini 4 Argon model.\n\nOpenAI was founded in 2015 partly as a counterweight to the concentration of AI research at companies like Google. Two years later, Google employees submitted the influential Transformer academic paper that propelled AI, but it was OpenAI that helped bring the technology forward with ChatGPT.", "source": "CNBC World Economy", "pub_date_str": "21 Oct 2026, 05:50 PM IST", "pub_date_relative": "43m ago"}, {"title": "Not A One-Off: RBI MPC Minutes Point To A Rate-Hike Cycle As Inflation Heads To 6% Ceiling", "full_content": "\"At some point, a larger pass-through of input costs to output prices may materialise. Under these circumstances, it is conceivable that a further increase in the policy rate might be needed,\" RBI Deputy Governor Poonam Gupta said.", "source": "NDTV Profit", "pub_date_str": "21 Oct 2026, 05:46 PM IST", "pub_date_relative": "46m ago"}, {"title": "Boeing's largest 737 MAX jet wins FAA certification, clearing way for deliveries of 1,555 ordered planes - Fox Business", "full_content": "Boeing's largest 737 MAX jet wins FAA certification, clearing way for deliveries of 1,555 ordered planes Fox Business FAA clears the way for airlines to put Boeing's long-delayed 737 Max 10 into service NPR Boeing wins FAA approval for 737 Max 10 after years of delays as Duffy says certification process should be faster CNBC U.S. FAA certifies Boeing 737-10, largest member of 737 MAX family The Boeing Company Boeing\u2019s Large 737 Max Jet Secures U.S. Approval The New York Times", "source": "Google News Business", "pub_date_str": "21 Oct 2026, 05:46 PM IST", "pub_date_relative": "47m ago"}, {"title": "India wants manufacturing at 25% of GDP \u2014 will AI in factories help?", "full_content": "Choose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "21 Oct 2026, 05:44 PM IST", "pub_date_relative": "49m ago"}, {"title": "India\u2019s economy stays resilient at 7.1%, but rising inflation raises a red flag, says RBI's Sanjay Malhotra", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Indicators \u203a India\u2019s economy stays resilient at 7.1%, but rising inflation raises a red flag, says RBI's Sanjay Malhotra The Economic Times daily newspaper is available online now. Read Today's Paper India\u2019s economy stays resilient at 7.1%, but rising inflation raises a red flag, says RBI's Sanjay Malhotra SECTIONS India\u2019s economy stays resilient at 7.1%, but rising inflation raises a red flag, says RBI's Sanjay Malhotra ET Online Last Updated: Oct 21, 2026, 06:11:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Indian economy is projected to maintain a growth rate of 7.1% for the year 2026-27. This projection is an increase from the previously estimated 6.7%. RBI governor Sanjay Malhotra noted that inflationary pressures are rising, which could impact the growth outlook. Despite turbulent global conditions, India's economic resilience has been remarkable according to the governor.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\nOne company, 2 words. Bond yield and CDS: Will they decide the fate of global markets?\n\nBusiness of Odd Things: Inside an industry that farms fish that nobody is meant to eat\n\nWar's second-order effects are becoming visible in critical sectors\n\nUS mid-term elections \u2013 Part 2: What does it mean for Trump to lose control of Congress?\n\nHomebuyers wait as NCLT panel picks holes in unfinished Jaypee projects\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "21 Oct 2026, 05:43 PM IST", "pub_date_relative": "50m ago"}, {"title": "Here are Wednesday's biggest analyst calls: Nvidia, SpaceX, Netflix, Zoom, Apple, Robinhood & more", "full_content": "Here are Wednesday's biggest calls on Wall Street.", "source": "CNBC Top News", "pub_date_str": "21 Oct 2026, 05:41 PM IST", "pub_date_relative": "51m ago"}, {"title": "Dow Jones| Nasdaq | S&P 500 | US Stock Market Today |Live Updates: Nasdaq futures lead gains as SpaceX, Super Micro results lift AI stocks", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a Dow Jones| Nasdaq | S&P 500 | US Stock Market Today |Live Updates: Nasdaq futures lead gains as SpaceX, Super Micro results lift AI stocks Powered By LIVE BLOG Dow Jones| Nasdaq | S&P 500 | US Stock Market Today |Live Updates: Nasdaq futures lead gains as SpaceX, Super Micro results lift AI stocks 21 Oct 2026 | 06:06:43 PM IST Synopsis US Market | Dow Jones Live Updates: Nasdaq futures lead Wall Street gains as SpaceX and Super Micro results revive the AI trade, while Netflix slides on a weak profit forecast. Nvidia and other chip stocks rise, offering relief after a prolonged selloff. Investors also track oil prices and Fed rate expectations.\n\nComments are moderated and will be allowed if they are about the topic and not abusive.\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Markets", "pub_date_str": "21 Oct 2026, 05:40 PM IST", "pub_date_relative": "53m ago"}, {"title": "United Airlines set to open its biggest airport lounge in $2.6 billion overhaul at Houston hub", "full_content": "United Airlines is set to open its biggest airport lounge this week, which it says is the largest in the Americas, as airlines continue to plow money into the facilities for high-spending customers.\n\nThe 54,000-square-foot lounge is opening Thursday at George Bush Intercontinental Airport's Terminal B in Houston, part of an overhaul of the airport that includes 22 gates for mainline aircraft.\n\nThe airport, with more than 500 departures a day, is United's main connecting hub for flights to and from Latin America.\n\nThe new club can seat 800 people and features an outdoor terrace for plane-spotting as well as two full-service bars and buffets.\n\nThe new lounge, part of United's $2.6 billion investment at the airport's Terminal B, shows how airlines are putting more money into larger spaces for premium-travel demand to attract the growing ranks of elite frequent flyers, co-branded credit card holders and customers just willing to spend more to fly.\n\nAmerican Airlines earlier this month said it is planning its largest-ever lounge at its Charlotte Douglas International Airport hub in North Carolina. Delta Air Lines has expanded both its popular Delta Sky Clubs and its top-tier Delta One Lounges.\n\nSouthwest Airlines is building its first-ever network of airport lounges , which are tied to its credit card partner, Chase . Last week, the carrier unveiled mock-ups of the lounges, which it is calling Icon. And JetBlue Airways opened lounges in New York and Boston in the past year.", "source": "CNBC Top News", "pub_date_str": "21 Oct 2026, 05:39 PM IST", "pub_date_relative": "53m ago"}, {"title": "NTA Announces Exam Calendar: Check JEE Main 2027, UGC NET, CUET PG Dates", "full_content": "The examination calendar covers December 2026 to March 2027, with five exams listed in both December and January.", "source": "NDTV Profit", "pub_date_str": "21 Oct 2026, 05:39 PM IST", "pub_date_relative": "53m ago"}, {"title": "Musk says Tesla and SpaceX formed special committees to discuss merger: Live updates", "full_content": "SpaceX shares climbed about 8% in extended trading on Tuesday after the company reported 161% revenue growth for the third quarter, beating Wall Street estimates, with its artificial intelligence business growing ninefold.\n\nOn the earnings call, CEO Elon Musk said a merger with Tesla , his automaker, would be a \"good idea,\" adding that the boards of both companies have formed special committees to discuss a tie-up. Tesla reports third-quarter results after the bell on Wednesday.\n\nSpaceX said in a release that it recorded operating income of $2.8 billion and net income of $4.4 billion. In the same period a year earlier, SpaceX reported a net loss of $1.05 billion.\n\nCFO Bret Johnsen said on the call that revenue in the first quarter of 2027 will be $33 billion to $37 billion, trouncing the average $22.2 billion average analyst estimate, according to LSEG. Johnsen attributed the forecast to \"increased visibility into our compute contract pipeline over the next six months.\"\n\nWhile SpaceX is best known for its reusable rockets, most of its revenue and profit in recent quarters came from the company's connectivity segment, which consists of its Starlink satellite internet service.\n\nStarlink's subscribers base grew to 13.6 million in the quarter, up from 12 million in the prior period.\n\nTotal connectivity revenue jumped 69% to $5.25 billion from $3.1 billion a year earlier. Analysts were expecting $4.84 billion, according to StreetAccount. Revenue from consumer Starlink subscribers amounted to $3.12 billion, while the company generated $2.13 billion from government and enterprise customers.\n\nBuzz has been building about Starlink's plans to build a U.S. mobile network after SpaceX, earlier this month, announced that it's buying 800 MHz of low-band spectrum, and after the Federal Communications Commission approved a plan for the company to build out a 15,000-satellite constellation.", "source": "CNBC World Economy", "pub_date_str": "21 Oct 2026, 05:38 PM IST", "pub_date_relative": "55m ago"}, {"title": "Why SpaceX\u2019s stock is surging \u2014 and lifting the broader AI universe along with it", "full_content": "SpaceX just gave Wall Street a big reason to believe in the artificial-intelligence boom as demand for its computing power is off the charts.", "source": "MarketWatch Top Stories", "pub_date_str": "21 Oct 2026, 05:36 PM IST", "pub_date_relative": "57m ago"}, {"title": "Middle East oil exports climb back to prewar levels", "full_content": "Daily shipments from Gulf producers average 24.6mn, above 23.3mn before conflict, as ships use alternative routes", "source": "FT Markets", "pub_date_str": "21 Oct 2026, 05:31 PM IST", "pub_date_relative": "1h ago"}, {"title": "New policy in works to boost agrivoltaics in India; enhance farmers' income via energy generation", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Agriculture \u203a New policy in works to boost agrivoltaics in India; enhance farmers' income via energy generation The Economic Times daily newspaper is available online now. Read Today's Paper New policy in works to boost agrivoltaics in India; enhance farmers' income via energy generation SECTIONS New policy in works to boost agrivoltaics in India; enhance farmers' income via energy generation PTI Last Updated: Oct 21, 2026, 05:29:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India's government is formulating a policy to enhance the adoption of agrivoltaics across the country. This initiative aims to increase farmers' income by combining agricultural production with solar energy generation. States with significant agrivoltaic potential include Maharashtra, Rajasthan, and Madhya Pradesh, accounting for nearly half of India's cropland suitable for this practice.\n\nOne company, 2 words. Bond yield and CDS: Will they decide the fate of global markets?\n\nBusiness of Odd Things: Inside an industry that farms fish that nobody is meant to eat\n\nWar's second-order effects are becoming visible in critical sectors\n\nUS mid-term elections \u2013 Part 2: What does it mean for Trump to lose control of Congress?\n\nHomebuyers wait as NCLT panel picks holes in unfinished Jaypee projects\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "21 Oct 2026, 05:29 PM IST", "pub_date_relative": "1h ago"}, {"title": "FADA Festive Sales: PV Registrations Sink 22% To 1.83 Lakh Units In Subdued Navratri, EV Retails Jump 27%", "full_content": "Passenger vehicle registrations fell nearly 22% during Navratri 2026, while overall vehicle registrations declined 6.52% year on year. Electric vehicle retail sales bucked the trend, rising 26.78%, according to provisional data from FADA.", "source": "NDTV Profit", "pub_date_str": "21 Oct 2026, 05:29 PM IST", "pub_date_relative": "1h ago"}, {"title": "Auto Retails Cross 10-Lakh Mark in Navratri Even As Car Sales Drop 13.7%", "full_content": "Passenger vehicle registrations stood at 1.72 lakh units, down from the year-ago period, while three-wheeler sales fell 1.65% to 43,057 units.", "source": "NDTV Profit", "pub_date_str": "21 Oct 2026, 05:28 PM IST", "pub_date_relative": "1h ago"}, {"title": "Stock futures rise as traders evaluate latest raft of earnings; SpaceX shares surge: Live updates - CNBC", "full_content": "Stock futures rise as traders evaluate latest raft of earnings; SpaceX shares surge: Live updates CNBC Stock Market Today: Dow Futures Steady; SpaceX Shares Surge on Tesla Deal Talks \u2014 Live Updates WSJ Elon Musk says SpaceX hitting $1 trillion in revenue in 2028 is 'no longer impossible' Business Insider SpaceX earnings left one big question unanswered Yahoo Finance Nasdaq futures lead gains as SpaceX, Super Micro results lift AI stocks Reuters", "source": "Google News Business", "pub_date_str": "21 Oct 2026, 05:28 PM IST", "pub_date_relative": "1h ago"}, {"title": "ChatGPT Gets Locked Chats To Keep Private Conversations Away From Prying Eyes", "full_content": "Locked Chats are rolling out across ChatGPT plans, with PIN or biometric access on supported phones, separate memory settings and restrictions on which conversations can be locked.", "source": "NDTV Profit", "pub_date_str": "21 Oct 2026, 05:25 PM IST", "pub_date_relative": "1h ago"}, {"title": "The Great Indian Kapil Show: Dhurandhar Stars Take Over Kapil\u2019s Stage With Music, Comedy And Fun", "full_content": "Music meets comedy on The Great Indian Kapil Show as Dhurandhar stars take over the stage with a fun-filled musical showdown on October 24.", "source": "NDTV Profit", "pub_date_str": "21 Oct 2026, 05:22 PM IST", "pub_date_relative": "1h ago"}, {"title": "Jio Platforms IPO Day 1 Highlights: Issue Gets Subscribed 3.01 Times; QIBs Lead Bidding", "full_content": "Jio Platforms' Rs 30,213-crore IPO opens today. Track subscription trends, investor demand, GMP, allotment details and listing updates here.", "source": "NDTV Profit", "pub_date_str": "21 Oct 2026, 05:22 PM IST", "pub_date_relative": "1h ago"}, {"title": "Ektaa Kapoor Bids Emotional Farewell To Kyunki Saas Bhi Kabhi Bahu Thi 2: \"Some Goodbyes Are Hard\"", "full_content": "Ektaa Kapoor shared special moments from both seasons of Kyunki Saas Bhi Kabhi Bahu Thi on Instagram.", "source": "NDTV Profit", "pub_date_str": "21 Oct 2026, 05:21 PM IST", "pub_date_relative": "1h ago"}, {"title": "Stocks making the biggest moves premarket: SpaceX, Super Micro Computer, Netflix, Dell and more", "full_content": "These are the stocks posting the largest moves premarket.", "source": "CNBC Finance", "pub_date_str": "21 Oct 2026, 05:19 PM IST", "pub_date_relative": "1h ago"}, {"title": "Retirement planning: How much should you invest in stocks and mutual funds after 60? Here's what expert suggests", "full_content": "Retirement brings a fundamental change in how investors should manage their savings. While equities can help build wealth during working years, a sharp market correction after retirement can put years of accumulated savings at risk, particularly when investors depend on their portfolios to meet monthly expenses.\n\nFor someone retiring at 60, the challenge is not simply earning higher returns. It is ensuring that the retirement corpus lasts another 20 to 30 years, even as inflation pushes up household expenses and markets go through periods of volatility.\n\nSo, how much of a retirement portfolio should remain invested in stocks and equity mutual funds ?\n\nAccording to M. Pattabiraman, founder of personal finance platform Freefincal and professor at IIT Madras, a typical retiree should consider limiting equity exposure to 30% of the retirement corpus. Those with substantially larger savings than required may have greater flexibility to take equity risks.\n\nIn a Freefincal report, Pattabiraman outlined three principles for determining equity allocation after retirement, focusing on corpus size, inflation-adjusted returns and the ability to withstand prolonged market downturns.\n\nDuring their working years, investors may hold 50-70% of their portfolios in equities to benefit from long-term market growth. However, Pattabiraman argues that this allocation needs to be reconsidered once regular withdrawals begin.\n\nHis framework suggests keeping equity exposure below 30% for a typical retirement, although the appropriate allocation depends on the size of the corpus and the investor's financial circumstances.\n\nFor instance, consider two retirees who each need \u20b9 6 lakh annually to meet expenses. One has accumulated \u20b9 1.8 crore, equivalent to 30 times annual expenses, while the other has \u20b9 4.5 crore, or 75 times annual expenses.", "source": "LiveMint Money", "pub_date_str": "21 Oct 2026, 05:15 PM IST", "pub_date_relative": "1h ago"}, {"title": "177% returns in 5 yrs! ICICI Sec sees 51% upside potential in this small finance bank stock; do you own? Target price", "full_content": "Shares of Ujjivan Small Finance Bank (USFB) ended lower on Wednesday, October 21. Despite the decline, the stock has surged 22.75% in one year. The Bengaluru-headquartered small finance reported stronger than expected performance in the first half of the financial year 2026-27.\n\nThe small finance bank is likely to perform well in the coming quarters backed by stable asset quality and strong growth, according to ICICI Securities , which sees nearly 51% upside potential in the bank stock.\n\nThe small finance bank showcased robust earnings momentum in the first quarter of financial year 2026-27, which continued in Q2FY27 as well. The bank delivered a robust 2.4% RoA/~20% RoE, supported by strong AUM growth of 32% YoY.\n\n\u201cTaking cognisance of the better-than-expected financial performance in H1FY27, management now anticipates full-year FY27 RoA to exceed its initial guidance range of 2%,\u201d noted ICICI Securities in its report highlighting that a 25 basis points (bps) repo rate hike poses a 10 bps headwind to NIM compression in H2FY27.\n\nThe brokerage maintained its \u2018Buy\u2019 recommendation for the stock and revised target price upwards. \u201cBacked by stable asset quality, strong growth, and well-timed capital raise of INR 4.1bn via a preferential issuance to IFC & others, we maintain BUY with an upwardly revised TP of INR 95 (earlier INR 90), basis 2x Sep\u201927E BVPS.\u201d The brokerage sees nearly 51% upside potential in the stock.\n\nThe stock closed 1.92% lower at \u20b9 61.95 per share on BSE with a market capitalisation of \u20b9 12,098.62 crore on Wednesday. Its share price value has declined 4.28% in one month, and around 5.77% in three months.\n\nDespite the decline, its share price value has surged 16.10% in 2026 so far. The stock has jumped 22.75% in one year and around 61% in two years. The small finance bank stock has delivered 177.18% return in five years.\n\nDisclaimer: This story is for educational and informational purposes only.", "source": "LiveMint Markets", "pub_date_str": "21 Oct 2026, 05:15 PM IST", "pub_date_relative": "1h ago"}, {"title": "Donald Trump Launches $25 Million Cash Reward Programme For Those Who Report Fraud", "full_content": "President Donald Trump has launched a $25 million whistleblower programme to encourage people to report suspected fraud involving government funds, with conservative YouTuber Nick Shirley becoming its first publicly announced as a recipient.", "source": "NDTV Profit", "pub_date_str": "21 Oct 2026, 05:12 PM IST", "pub_date_relative": "1h ago"}, {"title": "Bitcoin rebounds above $83,000 as strong US earnings and falling oil prices lift risk appetite", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Crypto \u203a Crypto News \u203a Bitcoin rebounds above $83,000 as strong US earnings and falling oil prices lift risk appetite The Economic Times daily newspaper is available online now. Read Today's Paper Bitcoin rebounds above $83,000 as strong US earnings and falling oil prices lift risk appetite SECTIONS Bitcoin rebounds above $83,000 as strong US earnings and falling oil prices lift risk appetite By Surbhi Khanna , ET Online Last Updated: Oct 21, 2026, 05:09:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Bitcoin rebounded 2.1% to $83,529 as stronger US equities, easing oil prices and $526.6 million in spot ETF inflows boosted sentiment. Analysts identified $86,000 as key resistance and $80,000 as crucial support amid continued uncertainty.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "21 Oct 2026, 05:09 PM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "Stifel reiterates Hold rating on Crocs stock amid accounting shifts", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Oct 2026, 06:24 PM IST", "pub_date_relative": "8m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Cantor Fitzgerald reiterates Salesforce stock rating on acquisition", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Oct 2026, 06:24 PM IST", "pub_date_relative": "8m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "IGI Q2 FY27 slides: certification revenue surges 32%, EBITDA up 39%", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Oct 2026, 06:23 PM IST", "pub_date_relative": "9m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "XAI Floating Rate fund completes tender offer with 26% proration", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Oct 2026, 06:22 PM IST", "pub_date_relative": "10m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Super Micro shares jump 12% after Q1 preliminary results top estimates. Can the AI server maker sustain its recovery?", "full_content": "Super Micro Computer surged 12.3% in pre-market trading on Wednesday, October 21, hitting $36.46, after the server maker released preliminary first-quarter fiscal 2027 results on October 20 that far exceeded expectations, driven by relentless demand for AI data centres.\n\nThe company forecast first-quarter revenue of $18.5 billion to $19.5 billion, well above analysts\u2019 expectations of $15.23 billion, according to data compiled by LSEG. It also expects profit margins to range between 12% and 12.5%, compared with earlier expectations of 10.4% to 10.8%.\n\nSuper Micro has benefited from surging demand for equipment used to train and run AI workloads. Its servers are equipped with Nvidia Corp. chips, which have become the preferred components for a large share of AI data centres.\n\nMicrosoft, Google, Amazon and Meta are expected to spend more than $700 billion on AI infrastructure this year, underscoring the scale of investment in the sector. Other server makers, Dell and Hewlett Packard Enterprise, also gained 5.2% and 4%, respectively, before the bell.\n\n\u201cInvestors are likely to focus on whether strong performance in core businesses can continue to support elevated AI investment,\u201d strategists at UBS Global Wealth Management said. The brokerage added that commentary from AI giants on spending, margins and returns would be closely scrutinised to determine whether the AI capital expenditure cycle can be justified, Reuters reported.\n\nMarkets have recently grown concerned about the profitability of data centre operators, many of which have been issuing debt to finance their expansion at a time when borrowing costs are rising.\n\nSuper Micro said it would discuss the results during a conference call scheduled for November 3.", "source": "LiveMint Markets", "pub_date_str": "21 Oct 2026, 06:21 PM IST", "pub_date_relative": "11m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Alternative Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "France\u2019s borrowing costs hit 5% for first time since 2002", "full_content": "Concerns over public finances and political stability have helped push up 10-year bond yields from 3.2% in late February", "source": "FT Markets", "pub_date_str": "21 Oct 2026, 06:21 PM IST", "pub_date_relative": "11m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Oil prices little changed as traders assess Middle East developments", "full_content": "Oil prices were little changed Wednesday as worries over Middle East supply disruptions keep the market on edge, with attacks on tankers near the Strait of Hormuz and Saudi energy facilities denting sentiment.\n\nBrent crude futures lost 17 cents to $108.62 a barrel as of 8:47 a.m. ET, while U.S. West Texas Intermediate crude rose 8 cents to $97.90 a barrel.\n\nBrent crude prices this year Iran's Revolutionary Guards said Tuesday that naval mines had prevented three tankers attempting to pass through the Strait of Hormuz using routes Tehran deemed unauthorized.\n\n\"Two violating oil tankers were set ablaze and halted due to the explosion of mines planted by the brave sailors of the IRGC Navy at an illegal crossing point in the southern part of the Strait of Hormuz,\" IRGC said in a statement published on their official Sepah News website .\n\nAdding to regional worries, Yemen's Houthi militants claimed responsibility on Monday for strikes targeting Saudi Aramco facilities in Yanbu, the Shaybah oilfield and airports in Riyadh and Abha.\n\nThe escalating tensions have also sent global oil shipping costs soaring, adding another layer of pressure to energy markets.\n\nThe global average crude freight rate has surged above $20 per barrel, compared with just $3 a year earlier, according to a Goldman Sachs report published Tuesday. While rates have eased slightly in recent days, they remain roughly seven times higher than a year ago.\n\nGoldman estimated that war-risk premiums associated with crossing the Strait of Hormuz accounted for about $7 of the $20 year-on-year increase in average crude freight rates, while ship-to-ship transfers outside the Persian Gulf contributed another $4.", "source": "CNBC Top News", "pub_date_str": "21 Oct 2026, 06:18 PM IST", "pub_date_relative": "14m ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Futures orbit around SpaceX as Tesla merger talk cheers investors", "full_content": "This is CNBC's Morning Squawk newsletter. Subscribe here to receive future editions in your inbox.\n\nHello, this is Leonie Kidd, with today's edition of Morning Squawk.\n\nOne man is the center of gravity for the biggest market-moving stories of the day - Elon Musk.\n\nFrom SpaceX and Tesla's possible mega-merger plan, to astronomical earnings from SpaceX, to more results to come from Tesla and the squaring-off over Starlink, he is hitting all the headlines.\n\nSpaceX shares are spiking in premarket trade after Elon Musk unveiled a special committee had been put in place to merge the rocket group with Tesla, in a move he called a \"good idea.\"\n\nMusk also said he represents a \"conflicted party,\" meaning he will not be included in the discussions.\n\nIt would be the largest merger in history, creating a giant company worth roughly 3 and a half trillion dollars. Tesla shares were also moving higher in early trading.\n\nWhy it matters: An existing joint venture between the two companies - Terafab - is aiming to test its first SRAM chip by June next year, targeting one terawatt a year of computing power. Musk said a full merger would mean there is \"a lot to be gained from cooperating on developing superintelligence software.\"", "source": "CNBC World Economy", "pub_date_str": "21 Oct 2026, 06:14 PM IST", "pub_date_relative": "19m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Rupee rises 46 paise to 94.45 on India-US trade deal hopes; oil prices cap gains", "full_content": "Home ETPrime Markets Market Data Mast
