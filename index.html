<script>
    // This variable will be injected during the build process
    const allData = {"general": [{"title": "No PF deposit for 3 years? EPFO clarifies inoperative account rules: This is how you can claim your money", "full_content": "Have you left a job and received no new Employees' Provident Fund (EPF) contributions for three years? Your PF account may be inactive, but that does not automatically mean it is inoperative.\n\nThe Employees' Provident Fund Organisation (EPFO) has clarified when an account is classed as inoperative and what members should know about their savings. Knowing this can help members manage their EPFO accounts , plan for retirement, and avoid their accounts becoming inoperative in the future.\n\nEPFO highlighted the issue in a recent post on its official X handle on November 24 and urged members to check whether their accounts had become inoperative.\n\n\"\ud83e\udd14 EPF \u0905\u0915\u093e\u0909\u0902\u091f \u092e\u0947\u0902 \u092c\u094d\u092f\u093e\u091c \u0906\u0928\u093e \u092c\u0902\u0926 \u0939\u094b \u0917\u092f\u093e \u0939\u0948? \u091c\u093e\u0928\u0947\u0902 \u0915\u0939\u0940\u0902 \u0906\u092a\u0915\u093e \u0905\u0915\u093e\u0909\u0902\u091f Inoperative \u0924\u094b \u0928\u0939\u0940\u0902! \u0905\u0927\u093f\u0915 \u091c\u093e\u0928\u0915\u093e\u0930\u0940 \u0915\u0947 \u0932\u093f\u090f \u0932\u093f\u0902\u0915 \u092a\u0930 \u091f\u0948\u092a \u0915\u0930\u0947\"\n\nTranslation: \"Has your EPF account stopped earning interest? Find out whether your account has become inoperative. Tap the link for more information.\"\n\nThe tweet also includes a YouTube link to a 5-minute, 16-second video that explains the entire process.\n\nAll eligible members can check their basic details and log in to the EPFO Member e-Sewa portal utilising their Universal Account Number (UAN) details and password. After carefully reviewing their personal details, such as Aadhaar number, name, and bank account details, and ensuring they are up to date and accurate, they can submit an online final settlement claim utilising Form 19.\n\nFurthermore, members who have joined another EPF-covered employer should also ensure that they transfer their old PF balance using Form 13 rather than withdrawing it. For this, the guidance of the respective Human Resource officer of your organisation should be sought in case of doubts.", "source": "LiveMint Money", "pub_date_str": "26 Nov 2026, 03:01 PM IST", "pub_date_relative": "10m ago"}, {"title": "Gold price today in India \u20b958,500 away from record high; right time to buy amid rebound from 14-month low?", "full_content": "Gold Rate Today | Gold Price Today | Gold Price Drop in 2026: After hitting the 14-month low on Friday last week, the MCX gold prices are trying to come out of the oversold zone. On Monday, the MCX gold rate staged a strong rebound, coming close to \u20b9 1,24,000 per 10 gm. However, the recovery turned out a dead-cat bounce and the precious yellow metal witnessed sharp selling on Tuesday and Wednesday. However, after the release of a better-than-expected US GDP outlook, gold prices across bourses witnessed strong buying despite flat US inflation data. In India, the MCX gold rate today is around \u20b9 1,22,250 per 10 gm, nearly \u20b9 58,500 below the record high of \u20b9 1,80,779 made in January 2026. In the international market, the gold price in USD is around $3,565/oz, about $2,060/oz below the record high of $5,626.80/oz set in January 2026.\n\nHighlighting the reasons that kept gold prices under pressure throughout 2026, barring January 2026, Anuj Gupta, a SEBI-registered market expert, said, \u201cOnce the bullion bottomed out, AI disruption triggered, and money started to shift from metals to AI and semiconductor stocks throughout the world. This triggered selling in gold and silver prices and an uptrend in AI and Semiconductor stocks. When the AI meltdown happened, smart money started moving out of equities into US bonds due to the skyrocketing US Treasury yields. As the rally in US bond yields extended for a longer period, rising from the alarming 4% to near 6%, fueling further shift of smart money from bullion and equities happened and gold price crash deepened.\u201d\n\nThe SEBI-registered market expert said that later, the Indian Rupee and the US dollar (USD) started appreciating due to the rise in bond yields, which further put precious metals under pressure, both in the international and domestic markets.\n\n\u201cCrude oil prices skyrocketed from around $72 per barrel to around $120 per barrel after the outbreak of the US-Iran war.", "source": "LiveMint Markets", "pub_date_str": "26 Nov 2026, 02:59 PM IST", "pub_date_relative": "12m ago"}, {"title": "BPCL vs IOCL vs HPCL: Jefferies names its top OMC stocks to buy as crude prices fall | Check target prices, rationale", "full_content": "IOC Pranati Deva Published 26 Nov 2026, 02:55 PM IST Prefer Livemint on Google OMC stocks to buy : Oil marketing companies were among the worst-hit by the energy disruption triggered by the West Asia conflict, as contracting margins squeezed profitability and led to a sharp decline in earnings. Global brokerage Jefferies has turned bullish on Bharat Petroleum Corporation (BPCL) and Indian Oil Corporation (IOC), citing improving profitability prospects for oil marketing companies (OMCs) following a sharp correction in crude oil prices during November.\n\nThe brokerage believes the recent decline in crude prices has significantly improved the economics of fuel marketing and refining businesses, pushing integrated margins firmly into positive territory. However, BPCL and IOC shares have yet to reflect this improvement, creating an attractive risk-reward opportunity, according to Jefferies.\n\nThe brokerage has reiterated its 'Buy' ratings on both stocks while retaining an 'Underperform' rating on Hindustan Petroleum Corporation (HPCL). It prefers BPCL and IOC on valuation grounds, arguing that the two stocks offer better upside potential than HPCL at current levels.\n\nBrent crude prices have declined by $28 per barrel during November, supported by rising Middle Eastern exports despite the blockade of the Strait of Hormuz. Freight rates have also corrected, reducing the delivered cost of crude for Indian refiners, Jefferies said.\n\nThe decline in crude prices has helped reverse the pressure on fuel marketing margins, which had turned negative in October.\n\nAccording to Jefferies' calculations, petrol marketing margins have improved to \u20b9 7.7 per litre, while diesel marketing margins stand at \u20b9 0.3 per litre based on spot Brent prices.", "source": "LiveMint Markets", "pub_date_str": "26 Nov 2026, 02:55 PM IST", "pub_date_relative": "16m ago"}, {"title": "CMC Markets HY 2027 slides: profit doubles as platform strategy pays off", "full_content": "", "source": "Investing.com News", "pub_date_str": "26 Nov 2026, 02:50 PM IST", "pub_date_relative": "21m ago"}, {"title": "Income tax calendar December 2026: Check key deadlines for TDS payments, advance tax, belated ITR and FAST-DS scheme", "full_content": "December 2026 is an important month for income tax compliance, with several deadlines for individual taxpayers , businesses, and tax deductors.\n\nThese include the third instalment of advance tax for Tax Year 2026\u201327, the deadline for depositing TDS and TCS collected in November, and the last date for filing belated income tax returns ( ITR s).\n\nHere is a look at the key income tax deadlines falling in December.\n\nTax deducted or collected at source (TDS/TCS) during November 2026 must be deposited with the Central Government by 7 December.\n\nAnother compliance requirement due on this date is the uploading of declarations received in Form 127 during November. This form is furnished by a buyer to the seller to obtain goods without tax collection at source (TCS).\n\nIt is important for buyers and sellers covered by the relevant TCS provisions to ensure that these declarations are uploaded on time.\n\nTwo important income tax compliances fall due on 15 December 2026:\n\nIndividuals earning only salary income are not required to pay advance tax, as their employers deduct and deposit the applicable tax through TDS.", "source": "LiveMint Money", "pub_date_str": "26 Nov 2026, 02:48 PM IST", "pub_date_relative": "23m ago"}, {"title": "TCM Group Q3 2026 slides: revenue jumps 14%, guidance cut on weak demand", "full_content": "", "source": "Investing.com News", "pub_date_str": "26 Nov 2026, 02:47 PM IST", "pub_date_relative": "24m ago"}, {"title": "Why is Safestore stock climbing today?", "full_content": "", "source": "Investing.com News", "pub_date_str": "26 Nov 2026, 02:42 PM IST", "pub_date_relative": "29m ago"}, {"title": "Macy\u2019s Thanksgiving Day Parade postponed due to weather for first time in 100 years", "full_content": "", "source": "Investing.com News", "pub_date_str": "26 Nov 2026, 02:42 PM IST", "pub_date_relative": "29m ago"}, {"title": "Babcock shares hit three-month high after record \u00a38.7 billion UK defence deal", "full_content": "", "source": "Investing.com News", "pub_date_str": "26 Nov 2026, 02:41 PM IST", "pub_date_relative": "30m ago"}, {"title": "Allied Blenders shares: After 50% jump in 6 months, Elara Securities sees 25% more returns; assigns Buy rating | Target", "full_content": "Shares of Allied Blenders and Distillers have rallied nearly 50% over the past six months, but the stock may have further room to climb, according to Elara Securities. The brokerage has initiated coverage on the liquor maker with a Buy rating and a target price of \u20b9 1,000, implying an upside of around 25% from its closing price of \u20b9 803 on 23 November 2026.\n\nIn its initiation report, Elara said Allied Blenders is transitioning from a mass-market whisky franchise into a diversified, premium-led spirits company. It believes the company's focus on premiumisation, portfolio expansion, distribution growth and backward integration could drive a sharp improvement in earnings and profitability over the coming years.\n\nThe brokerage expects Allied Blenders to deliver an earnings per share (EPS) compound annual growth rate (CAGR) of 40% between FY26 and FY29, significantly higher than the peer median of around 25%. It believes sustained execution on its growth plans could also support a valuation rerating towards peer multiples.\n\nElara has valued the stock at 49 times its December 2028 estimated earnings, in line with the peer median, to arrive at its target price of \u20b9 1,000. The stock currently trades at 47 times FY28 estimated price-to-earnings (P/E).\n\nA key part of Allied Blenders' growth strategy is expanding its presence in the Prestige and Above (P&A) segment. Its ICONiQ White brand has played a significant role in building this franchise, helping the company deliver a 13% revenue CAGR in the P&A category between FY23 and FY26.\n\nElara expects ICONiQ White to remain the company's primary growth driver, contributing around 75% of P&A volumes by FY29.", "source": "LiveMint Markets", "pub_date_str": "26 Nov 2026, 02:41 PM IST", "pub_date_relative": "30m ago"}, {"title": "Why is Tullow Oil stock rallying today?", "full_content": "", "source": "Investing.com News", "pub_date_str": "26 Nov 2026, 02:39 PM IST", "pub_date_relative": "32m ago"}, {"title": "Earnings call transcript: CMC Markets posts record H1 2027 profit as growth broadens", "full_content": "", "source": "Investing.com News", "pub_date_str": "26 Nov 2026, 02:38 PM IST", "pub_date_relative": "33m ago"}, {"title": "The Nobel-winning science turning \u2018water harvesting\u2019 into a commercial race", "full_content": "Startups Atoco and Ahbstra are moving water-from-air machines toward commercial use, including for data centers and drought-hit communities.", "source": "CNBC Top News", "pub_date_str": "26 Nov 2026, 02:37 PM IST", "pub_date_relative": "34m ago"}, {"title": "Stock Market Today: Sensex, Nifty 50 In Green Amid Volatility; BSE, HCL Tech, Infosys Top Gainers; Smallcaps Rally", "full_content": "Among sectors, Nifty Realty index rallied the most over 3%, followed by Nifty IT, Nifty Metal and Nifty Pharma indices. Selling was seen in Nifty FMCG, Nifty Auto, Nifty PSU Bank and Nifty Media.", "source": "NDTV Profit", "pub_date_str": "26 Nov 2026, 02:36 PM IST", "pub_date_relative": "35m ago"}, {"title": "Earnings call transcript: TCM Group beats Q3 2026 estimates but outlook stays weak", "full_content": "", "source": "Investing.com News", "pub_date_str": "26 Nov 2026, 02:36 PM IST", "pub_date_relative": "35m ago"}, {"title": "Important Days And Dates In December 2026: Check List Of National And International Events", "full_content": "These observances make December an important month for historical remembrance, public awareness and international cooperation.", "source": "NDTV Profit", "pub_date_str": "26 Nov 2026, 02:35 PM IST", "pub_date_relative": "36m ago"}, {"title": "Norse Atlantic suspends all flights, warns it may file for bankruptcy after share price collapse", "full_content": "Norse Atlantic suspended all of its flights on Thursday and warned it may have to file for bankruptcy after its stock collapsed on Wednesday following its warning about its \"critical\" financial situation.\n\n\"The board of directors continues to consider options to secure short-term financing,\" Norse said in a Thursday statement. \"If a short-term financing solution is not secured urgently, it is the board's intention to file for bankruptcy.\"\n\nThe airline added that \"there can be no assurance that a viable solution will be found.\"\n\nChecks by CNBC showed the airline was still selling tickets for flights on Friday and beyond as of 9 a.m. Oslo time on Thursday.\n\nWarning signs first popped up when PK786 from London to Islamabad and PK710 from Manchester to Lahore were cancelled because of \"an unexpected operational suspension,\" the Pakistani flag carrier said on X.\n\nThe airline had been set to operate two Pakistan International Airlines flights Wednesday under a wet-lease agreement, in which one airline provides the aircraft and crew to another. The agreement had only been signed in early October.\n\nPIA said it would operate the routes using its own Boeing 777 aircraft from the next day.\n\nNorse's own flight Z0 783 from London Gatwick to Orlando was also shown as canceled Wednesday on live air traffic website Flightradar24. London Gatwick's website listed the flight's status for Thursday as \"enquire airline.\"", "source": "CNBC Top News", "pub_date_str": "26 Nov 2026, 02:32 PM IST", "pub_date_relative": "39m ago"}, {"title": "Four credit bureaus, four different scores: Why?", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nA credit score of 800 seen on a fintech app can feel like a guaranteed loan, but a bank can still turn down your loan application while offering one to someone with 730, the difference being which bureau the score is assigned by and how the lender treats that bureau\u2019s score.\n\nIndia has four credit bureaus: CIBIL, Experian, Equifax and CRIF. Each one collects your repayment data from lenders, builds a report and calculates its own score. All of them broadly assess similar aspects such as whether you pay on time, how much debt you carry and how long you have been borrowing, but each applies its own proprietary model.\n\nThe scores sit on the same 300 to 900 scale, but they are not interchangeable, and banks decide for themselves what score they will accept from each bureau. Read on to understand what causes the difference and what lenders consider.\n\nOver the years, the way bureaus receive data has become more uniform, said Parijat Garg, a digital lending consultant. The Reserve Bank of India has mandated a standard reporting format, and lenders must send data to all bureaus weekly.\n\n\u201cWhile credit bureaus broadly work with similar categories of credit information, each bureau develops and applies its own proprietary statistical models and methodologies.", "source": "LiveMint Money", "pub_date_str": "26 Nov 2026, 02:31 PM IST", "pub_date_relative": "40m ago"}, {"title": "Latin America has the copper and energy the AI build-out needs. Infrastructure is the test", "full_content": "Latin America\u2019s copper, energy and mineral resources could play a growing role in supplying the global artificial-intelligence build-out, as data centers and electrification drive demand for power and raw materials.\n\nBut for investors, it's less about whether Latin America has the resources than whether governments can turn them into viable projects.\n\n\"We are going through an acceleration in energy demand growth. We need every possible energy source available,\" Michele Della Vigna, head of natural resources research for Goldman Sachs, told CNBC. \"Ultimately, what drives economic growth is energy,\" he added.\n\nBen Kumar, head of strategy for wealth, investment and public policy at 7IM, suggested Latin America could benefit, given the physical materials needed for AI equipment and data centers. \"We are currently neutral in the short term, but if the materials and mining cycle continues, we could see this moving to positive in a few months,\" he said.\n\nThe investment case varies across the region. Chile has copper; Argentina is expanding oil and gas exports; and Brazil has abundant renewable power and significant rare earth reserves.\n\nChile's copper sector illustrates both the supply potential and the constraints to expanding supply. Copper production fell 8.5% in the first nine months of 2026, according to the state copper commission Cochilco, as lower ore grades, maintenance, and operational disruptions constrained supply.\n\nBut demand for refined copper is set to grow 1.6% this year and 2% next year, according to the International Copper Study Group . Supply is struggling to keep pace with demand from expanding electricity grids.\n\nChile's copper commission has raised its 2027 price forecast to $5.95 a pound, from $5.10. Codelco, the state-owned copper producer, may also have scope to increase supply, including through proposed public-private partnerships.", "source": "CNBC World Economy", "pub_date_str": "26 Nov 2026, 02:29 PM IST", "pub_date_relative": "42m ago"}, {"title": "This bank enables instant NPS through PFRDA\u2019s \u2018Tatkal NPS\u2019: Check key features and steps to apply online", "full_content": "Federal Bank has joined the Pension Fund Regulatory and Development Authority's \u2018Tatkal NPS\u2019 initiative, the private sector lender said in an official release. The move enables eligible customers to instantly open an account with the National Pension System ( NPS ) using their existing KYC details with the bank, it added.\n\n\u201cThe initiative aims to make retirement planning easier and more accessible by reducing onboarding time and paperwork. NPS offers individuals across professions and age groups a simple avenue to build long-term financial security and create a retirement corpus ,\u201d the bank said.\n\n\u201cWe are committed to making financial services simple, accessible and digital-first. Our participation in PFRDA's Tatkal NPS initiative will help customers begin their retirement planning journey seamlessly and encourage greater adoption of long-term financial savings,\u201d said Joy PV, EVP and Country Head \u2014 Retail Liability and Fee Products, Federal Bank.\n\nAs per the Federal Bank statement, in the initial phase, its Tatkal NPS feature will be available through the BHIM mobile app, and customers will need to hold an active savings account with complete KYC to be eligible.\n\nEarlier in September, the PFRDA announced the launch of Tatkal NPS on the BHIM payments app, allowing eligible bank customers to open an NPS account directly through the platform.", "source": "LiveMint Money", "pub_date_str": "26 Nov 2026, 02:27 PM IST", "pub_date_relative": "44m ago"}, {"title": "Gold rate today in Chennai, Hyderabad, Bangalore: Check 26 November MCX yellow metal prices details", "full_content": "Gold rate today: Gold prices surged in early trade on Thursday, November 26, in India, tracking gains in the global bullion market after stronger-than-expected US inflation data boosted expectations of a possible interest rate hike in December.\n\nIn the international market, spot gold was largely unchanged at $3,572.80 per ounce, while US gold futures for December delivery advanced 1% to $3,571.60 on Thursday.\n\nThe US economy expanded at a much faster pace than initially estimated in the third quarter, while inflation accelerated further in October. The latest data has strengthened expectations that the Federal Reserve will hike interest rates next month and once again in early 2027. The US central bank last raised rates in September.\n\nOn the domestic front, gold prices on the Multi Commodity Exchange (MCX) opened 1.2% higher at \u20b9 1,22,740 per 10 grams. The yellow metal extended its gains shortly after the opening bell, hitting an intraday high of \u20b9 1,23,888 per 10 grams.\n\nAccording to Ponmudi R, CEO of Enrich Money, MCX gold opened with a modest gap-up near \u20b9 122,740 and is trading around \u20b9 122,580, up approximately 1.2%, holding above the \u20b9 121,000\u2013121,700 support zone. Wednesday\u2019s candle featured a long lower shadow, with buying interest emerging near \u20b9 117,500.\n\nOn the technical outlook, Ponmudi added, \u201cImmediate resistance is placed at \u20b9 126,300\u2013127,000, followed by \u20b9 130,000\u2013130,700. On the downside, \u20b9 121,000\u2013121,700 remains the immediate support band, with stronger support at \u20b9 117,500\u2013118,500. The RSI, hovering near 28, remains deeply oversold and marginally below its average, while the MACD continues to signal negative momentum.\u201d\n\nDisclaimer : This story is for educational purposes only. The views and recommendations above are those of individual analysts or broking companies, not Mint. We advise investors to check with certified experts before making any investment decisions.\n\nVaamanaa covers business and stock market news.", "source": "LiveMint Markets", "pub_date_str": "26 Nov 2026, 02:25 PM IST", "pub_date_relative": "45m ago"}, {"title": "Massive Explosion At Major Oil Facility In Bangkok. Here's What We Know", "full_content": "The Bangna District Office urged people living nearby to evacuate the area immediately for their own safety. No casualties have been reported as of now.", "source": "NDTV Profit", "pub_date_str": "26 Nov 2026, 02:22 PM IST", "pub_date_relative": "48m ago"}, {"title": "How Donald Trump's proposed fresh tariff salvo for India compare with rival nations", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a How Donald Trump's proposed fresh tariff salvo for India compare with rival nations The Economic Times daily newspaper is available online now. Read Today's Paper How Donald Trump's proposed fresh tariff salvo for India compare with rival nations SECTIONS How Donald Trump's proposed fresh tariff salvo for India compare with rival nations Reuters Last Updated: Nov 26, 2026, 02:22:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The US has proposed a 25% tariff on Indian imports to address excess industrial capacity issues. This rate could decrease to 17% if a trade deal is reached. India's trade ministry is reviewing the US's trade practices allegations while defending its own situation. Trade talks have been prolonged due to various complications, including tariff laws and military incidents.\n\nTrump's new tariff tantrum for India, China can run into a legal and political minefield\n\nThe fall is new, the pattern is 11 years old: Making sense of gold's crash\n\nAs AI sharpens cyber attacks, should listed companies follow one standard in reporting them?\n\nKYC and KYB: Zydus Lifesciences \u2013 From the chemist\u2019s counter to US pharmacies. Part 1 of 3\n\nWhat would it take for the world to stop needing the Strait of Hormuz?\n\nHidden export winners: The unlikely products finding real buyers abroad\n\nIndia\u2019s USD25 bn copper drive moves from building smelters to securing mines", "source": "Economic Times Economy", "pub_date_str": "26 Nov 2026, 02:22 PM IST", "pub_date_relative": "49m ago"}, {"title": "CBSE Three-Language Policy: Students Already Studying Three Needn't Drop One, Supreme Court Says", "full_content": "The ruling covers two groups of students. Those already studying three languages can carry on with them. Those studying only two will be allowed to stay with two this year.", "source": "NDTV Profit", "pub_date_str": "26 Nov 2026, 02:21 PM IST", "pub_date_relative": "50m ago"}, {"title": "NMDC battles weak offtake despite strong steel demand", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nIron ore miner NMDC continues to grapple with muted offtake even though steel demand is strong. Steelmakers are increasingly meeting their additional requirements of ore\u2014a key input\u2014through captive mining.\n\nNMDC\u2019s October sales fell 12% year-on-year (y-o-y), partly due to rail disruption slowing ore dispatches, belying expectations of a post-monsoon recovery. In the first seven months of FY27, volumes fell 2% to 25.7 million tonnes (mt), while output rose 22% to 32.3 mt.\n\nNMDC also faces the prospect of a more competitive market after the government relaxed restrictions on ore sales by captive miners in August. Domestic producers Tata Steel Ltd and Steel Authority of India Ltd have outlined plans to increase merchant sales from their mines. The government also reduced tax-related uncertainty for NMDC by curtailing the powers of state governments to levy taxes on miners.\n\nBesides, a global surplus amid a slowdown in China\u2019s steel output is weighing on prices. According to Nomura Research, iron ore prices fell to $84 per tonne in the week ended 20 November, down 17% y-o-y and the lowest level for 2026.\n\nThe subdued market conditions were reflected in NMDC\u2019s financials. September quarter (Q2FY27) revenue grew 4% y-o-y to \u20b9 6,638 crore, with iron ore realization increasing 10%, partly offset by a 2% fall in offtake. Higher royalty and other expenses meant Ebitda fell 4% to \u20b9 1,940 crore.\n\n\u201cWe reduce our FY27/FY28 sales estimates to 53mt/58mt from 58mt/62mt and adjust realizations assumptions, resulting in an 18%/12% cut to our Ebitda estimates,\u201d noted Systematix Institutional Equities. This would still need monthly sales to average 5.5 mt for the remaining five months, against 3.7 mt so far in FY27. FY26 sales were 50 mt.\n\nNMDC is focusing on value addition through pelletization to lower iron ore dependence. Revenue from pellet sales rose 40% in Q2, contributing 13% to total revenue.", "source": "LiveMint Markets", "pub_date_str": "26 Nov 2026, 02:19 PM IST", "pub_date_relative": "52m ago"}, {"title": "Global stocks rally as investors shrug off U.S. tariffs and AI jitters", "full_content": "Global stocks rallied on Thursday, staging a tentative recovery from an intense AI-driven sell-off and looked past a fresh set of tariffs unveiled by the White House on Wednesday.\n\nU.S. markets will be closed Thursday for the Thanksgiving holiday and will have a shortened trading session on Friday. During Wednesday's regular session, the Dow gained 0.33%, the tech-heavy Nasdaq Composite fell 0.62% and the S&P 500 shed 0.25%.\n\nIn Europe on Thursday, equities rose sharply. The pan-European Stoxx 600 was 1.4% higher shortly after the opening bell, with all sectors and major bourses in positive territory.\n\nGermany's DAX led gains on a rise of 1.7%, while the Stoxx 600 Technology index jumped almost 2%. The regional tech index has lost more than 12% so far this month, amid jitters around a potential AI bubble bursting and the ousting \u2014 and return \u2014 of Jensen Huang as Nvidia CEO.\n\nGerman semiconductor firm Infineon was more than 4% higher in early trading, as chip stocks notched a boost. ASMI and ASML gained 2.8% and 2.4%, respectively, while Be Semiconductor added close to 3%.\n\nSouth Korea's Kospi gained 0.29% to close at 4,711.21, while the small-cap Kosdaq index advanced 0.78% to 655.71 after the country's central bank hiked benchmark lending rates to a 2-year high, in its final meeting of the year.\n\nJapan's Nikkei 225 rose 0.86% to 57,499.16 while the Topix edged 0.11% higher to 3,750.4. Australia's S&P/ASX 200 gained 0.82% to 8,763.8.\n\nHong Kong's Hang Seng index was up 1.52% in its last hour of trade, while mainland China's CSI 300 edged higher marginally, closing at 3,900.55.", "source": "CNBC World Economy", "pub_date_str": "26 Nov 2026, 02:12 PM IST", "pub_date_relative": "59m ago"}, {"title": "Tukaram Mundhe Impact: Gym Empties Protein Powder Shelf After Warning On Illegal Sales", "full_content": "Mundhe has warned of strict action against the unauthorised sale of health supplements in gyms, and against manufacturers who print health claims on nutraceutical labels.", "source": "NDTV Profit", "pub_date_str": "26 Nov 2026, 02:11 PM IST", "pub_date_relative": "1h ago"}, {"title": "Samvardhana Motherson Cancels Board Meeting: What Was On The Agenda?", "full_content": "Following the development, the company announced that its trading window had reopened with immediate effect from Nov. 26.", "source": "NDTV Profit", "pub_date_str": "26 Nov 2026, 02:05 PM IST", "pub_date_relative": "1h ago"}, {"title": "Stocks, Nasdaq Futures Climb as AI Trade Rebounds: Markets Wrap - Bloomberg.com", "full_content": "Stocks, Nasdaq Futures Climb as AI Trade Rebounds: Markets Wrap Bloomberg.com Global stocks steady after volatile US trading over AI risks Financial Times Stocks rally in Asia, US tariffs not as dire as feared Reuters Global stocks rally as investors shrug off U.S. tariffs and AI jitters CNBC Global markets rebound as tech shares recover and tariff fears ease Yahoo Finance", "source": "Google News Business", "pub_date_str": "26 Nov 2026, 02:03 PM IST", "pub_date_relative": "1h ago"}, {"title": "Global stocks steady after volatile US trading over AI risks", "full_content": "Tech shares hit this month by fears over whether an AI boom can be sustained", "source": "FT Markets", "pub_date_str": "26 Nov 2026, 02:01 PM IST", "pub_date_relative": "1h ago"}, {"title": "Nvidia Pulls The Plug On AI Server Shipments To Four Asian Countries: Report", "full_content": "The four countries have emerged as preferred destinations for Chinese AI developers seeking access to Nvidia's advanced processors, whose direct exports to China are restricted by the US.", "source": "NDTV Profit", "pub_date_str": "26 Nov 2026, 02:01 PM IST", "pub_date_relative": "1h ago"}, {"title": "Gold prices crash \u20b922,000 in a month: Is this the right time to buy to make profits when prices go up? Experts' advice", "full_content": "Gold prices have corrected sharply over the past month, with MCX gold futures falling by nearly \u20b9 22,000 per 10 grams from around \u20b9 1.43 lakh to \u20b9 1.22 lakh. The decline has brought some relief to consumers preparing for the wedding season, but it has also raised a key question: Is this an opportunity to buy gold at lower levels, or could prices fall further?\n\nThe correction has been driven by expectations of another US Federal Reserve rate hike, persistent inflation concerns, elevated US bond yields, a stronger dollar and profit-booking after gold's substantial rally earlier this year. A stronger Indian rupee has added to the pressure on domestic gold prices.\n\nMCX gold is down around 9% year-to-date from approximately \u20b9 1.34 lakh per 10 grams at the end of 2025. It touched a low of \u20b9 1,17,906 per 10 grams on 25 November, marking a decline of around 17% from its level a month earlier and nearly 12% from the start of the year.\n\nOn Thursday, 26 November, MCX gold opened with a modest gap-up near \u20b9 1,22,740 per 10 grams and was trading around \u20b9 1,22,580, up approximately 1.2%. The metal was holding above the \u20b9 1,21,000\u2013 \u20b9 1,21,700 support zone.\n\nGold's recovery, however, has been more muted than silver's. MCX gold gained around 1.2%, compared with a 3.2% advance in silver, as the latter staged a stronger rebound following its deeper correction.\n\nWith gold prices down sharply and wedding-related demand picking up, experts see the correction as an opportunity for physical buyers. However, they caution against investing the entire amount at once, given the possibility of further volatility and downside risks.\n\nGaurav Arora, Head of Research at SAHI, said the correction has been driven by expectations of another US Federal Reserve rate hike and persistent inflation in the US.", "source": "LiveMint Markets", "pub_date_str": "26 Nov 2026, 01:57 PM IST", "pub_date_relative": "1h ago"}, {"title": "Sharad Pawar Admitted To Breach Candy Hospital Again, Supriya Sule Says It Appears To Be Dehydration", "full_content": "NCP(SP) chief Sharad Pawar has been admitted to Breach Candy Hospital in south Mumbai due to dehydration.", "source": "NDTV Profit", "pub_date_str": "26 Nov 2026, 01:57 PM IST", "pub_date_relative": "1h ago"}, {"title": "Ordered silver coins, received rakhis: 5 online shopping lessons from Delhi Consumer Commission\u2019s \u20b920,000 order", "full_content": "Online shopping offers convenience and attractive deals, but receiving the wrong product can quickly turn a routine purchase into a long consumer dispute.\n\nA recent Delhi consumer commission order shows why e-commerce platforms must be transparent and handle delivery complaints properly. It also shows why customers should preserve evidence when an order goes wrong and check what they receive right away.\n\nA Delhi consumer commission has directed Amazon Seller Services Pvt Ltd to pay \u20b9 20,000 in compensation to Akshay Mittal, who was delivered two packets of rakhis instead of the four silver coins he had ordered for \u20b9 5,996, according to a Times of India report.\n\nAccording to the report, the aggrieved customer, Mittal, placed the order on November 10, 2023, for four 50-gram silver coins with 999 purity. Later on, he was delivered the wrong product on November 12. Subsequently, he filed a complaint with Amazon, and the platform refunded \u20b9 5,996 on November 26 instead of arranging an appropriate replacement.\n\nAfter reviewing the facts of the case, the District Consumer Disputes Redressal Commission, South II, Delhi, stated that Mittal had never applied for or requested a refund, and that Amazon should have replaced the original products. Due to this, the commission held the platform guilty of \u2018deficiency in services\u2019 and \u2018 unfair trade practices \u2019, directing it to pay \u20b9 20,000 within 60 days.", "source": "LiveMint Money", "pub_date_str": "26 Nov 2026, 01:52 PM IST", "pub_date_relative": "1h ago"}, {"title": "Family pension denied to disabled son over missing records: How he won relief from Armed Forces Tribunal after 9 years", "full_content": "Can an adult child with a lifelong disability claim family pension after the death of a parent who served in the armed forces? A case before the Armed Forces Tribunal (AFT), Chandigarh, has brought this question into focus.\n\nFamily pension is a regular payment made by the government to eligible family members of a deceased employee or pensioner to provide financial support after their death. It is generally paid first to the surviving spouse. After the spouse's death, the pension will pass to children.\n\nChildren with disabilities that prevent them from earning a livelihood may qualify for lifelong family pension, subject to the applicable rules.\n\nThe Chandigarh case concerns a 68-year-old man with a lifelong physical disability who sought his late soldier father's family pension. His claim faced objections from the authorities, including over the absence of his name from his father's Army service records. Here's what happened and how he won the case.\n\nAccording to a Times of India report, the applicant, Anil Kumar, lives in Palampur, Himachal Pradesh, with his wife. His father served in the Indian Army from 1940 to 1957 and died in 1975.\n\nAfter his father's death, Kumar's mother, Guffi Devi, received a family pension from 1988 until her death in 2016. Kumar subsequently applied to have the pension transferred to his name, but the Army's Record Office rejected his requests in 2017 and 2019.\n\nThe authorities cited the absence of his name in his father's service records. They also argued that the documents had been destroyed after the mandatory 50-year retention period and that his claim was time-barred, meaning it had been filed beyond the prescribed legal period.\n\nKumar has a congenital deformity affecting his right leg. Medical certificates from Civil Hospital, Palampur, and Zonal Hospital, Dharamshala, assessed his disability at 45% for life and established that he could not earn his livelihood.", "source": "LiveMint Money", "pub_date_str": "26 Nov 2026, 01:52 PM IST", "pub_date_relative": "1h ago"}, {"title": "Jet Airways Staff Score Major Victory As NCLAT Clears Rs 480 Crore Gratuity Dues With Interest", "full_content": "Tribunal directs gratuity dues, along with interest, to be disbursed to eligible employees within two weeks, with payments to be made directly into bank accounts.", "source": "NDTV Profit", "pub_date_str": "26 Nov 2026, 01:46 PM IST", "pub_date_relative": "1h ago"}, {"title": "Mumbai Mayor Ritu Tawde, Civic Chief Ashwini Bhide Receive Bomb Threat Email", "full_content": "The Email is reportedly sent by someone using the name \"Hannah Mehler\" and is said to carry Khalistani separatist slogans.", "source": "NDTV Profit", "pub_date_str": "26 Nov 2026, 01:44 PM IST", "pub_date_relative": "1h ago"}, {"title": "Akshay Kumar Defends His 8-Hour Work Schedule, Says 'I Don't Even Go To My Vanity Van'", "full_content": "Akshay Kumar explained why some big producers hesitate to cast him and how his eight-hour work schedule helps him finish films faster.", "source": "NDTV Profit", "pub_date_str": "26 Nov 2026, 01:43 PM IST", "pub_date_relative": "1h ago"}, {"title": "U.S. tariff-hike threats pile pressure on partners to sign trade deals", "full_content": "The Trump administration has unveiled a fresh tariff salvo on more than a dozen trading partners, with China, Vietnam, and India facing some of the steepest potential rates and mounting pressure to conclude trade deals with Washington.\n\nThe proposed tariffs, framed as curbing excess industrial capacity, start at 15% for the European Union, South Korea, Switzerland and Taiwan and rise to as much as 35% for Vietnam.\n\nThe U.S. Trade Representative's Office said it intends to cap the new duties at lower levels for countries that have completed trade deals or are still negotiating with Washington.\n\nThe overall impact on the region is likely to be limited, said Mark Williams, chief Asia economist at Capital Economics. The proposal \"puts most of the targeted countries back where they were earlier in the year,\" he said, after the Supreme Court struck down Trump's emergency tariffs in February.\n\nStill, the proposal could give some countries an incentive to speed up trade talks in order to lock in lower tariff rates, analysts said.\n\nOn Wednesday, U.S. Trade Representative Jamieson Greer said that the new policy likely will not take effect for months, with a senior U.S. official saying the duties could take effect as early as January.\n\nChina faces a capped rate of 20%, on top of an existing 25% tariff imposed during President Donald Trump's first term. The rate could rise to 40% if the trade truce reached in South Korea last October is not extended beyond January, the USTR said.\n\nBeijing has rejected Washington's claim of excess capacity while vowing to take measures necessary to protect its rights.", "source": "CNBC Top News", "pub_date_str": "26 Nov 2026, 01:39 PM IST", "pub_date_relative": "1h ago"}, {"title": "India's Capex Cycle Has Years To Run: Vikas Khemani Prefers Enabler Companies", "full_content": "Khemani said the opportunity extends beyond companies directly undertaking capital expenditure to businesses supplying the equipment, products and services that enable the investment cycle.", "source": "NDTV Profit", "pub_date_str": "26 Nov 2026, 01:37 PM IST", "pub_date_relative": "1h ago"}, {"title": "Nvidia halts chip shipments to south-east Asia - Financial Times", "full_content": "Nvidia halts chip shipments to south-east Asia Financial Times Nvidia halts server shipments to four Southeast Asian countries, FT reports Reuters Nvidia sellers seek new buyers as U.S. curbs China AI chip access, sources tell CNBC CNBC Billions in Data Center Deals Grind to Halt After AI Chip Curbs Bloomberg.com Nvidia reportedly halts chip shipments to south-east Asia as stock sell-off eases \u2013 business live The Guardian", "source": "Google News Business", "pub_date_str": "26 Nov 2026, 01:37 PM IST", "pub_date_relative": "1h ago"}, {"title": "India Well-Placed To Navigate US Tariff Hurdles, Industry Veterans Say", "full_content": "The Donald Trump administration proposed doubling tariffs on India to 25% following a Section 301 investigation into manufacturing overcapacity across 14 countries. However, the proposed tariff rate could come down to 17% if India and the US reach a reciprocal trade agreement.", "source": "NDTV Profit", "pub_date_str": "26 Nov 2026, 01:34 PM IST", "pub_date_relative": "1h ago"}, {"title": "Rs 1 Lakh Credit Card Debt: How Long Will It Take To Repay?", "full_content": "Credit cards in India typically charge interest of around 3% to 3.75% per month (36% to 45% annually).", "source": "NDTV Profit", "pub_date_str": "26 Nov 2026, 01:32 PM IST", "pub_date_relative": "1h ago"}, {"title": "Fearing layoff due to AI? Job insurance may help you deal with financial crisis: Check if you are eligible", "full_content": "More than two lakh tech workers lost their jobs globally through November this year. For workers worried about AI replacing their roles, the immediate concern is paying bills. Job insurance can offer temporary relief if the policy covers the reason for dismissal. This is applicable to any type of layoff.\n\nTrueUp tracked 2,09,841 job losses across 742 layoff events in the global technology industry. Tech companies cut around 642 jobs per day this year, down from 579 per day in 2025. These figures track overall job cuts across the industry, whether AI-related or not.\n\nJob insurance in India comes as an add-on to another policy, not as a standalone policy, according to Paisabazaar. You may find it with home insurance, accident cover or critical illness insurance. A payout can help with home loan instalments or other financial commitments. You may get support for up to three months while looking for work.\n\nYou generally need a salaried job with a registered company to qualify for this cover. Self-employed workers are ineligible under the terms Paisabazaar describes.\n\nCasual, seasonal, temporary and contractual employment also fall outside that cover. You may be eligible to buy the add-on yet still face restrictions when claiming.\n\nThe reason for losing your job matters as much as your employment status. Some plans may cover job loss linked to critical illness or disability following an accident.\n\nTermination or temporary suspension can also qualify under the relevant terms. If AI replaces your role, you need to check how the policy treats that reason for termination. Since companies rarely disclose AI as the direct reason behind layoffs , yours may fall under standard terminations.\n\nA waiting period can range from 30 to 90 days after the policy starts. Losing your job during that period can rule out a payout.", "source": "LiveMint Money", "pub_date_str": "26 Nov 2026, 01:27 PM IST", "pub_date_relative": "1h ago"}, {"title": "Trump Tariff Threat impact on Indian stocks: Gokaldas Exports to Welspun Living - Shares that could face biggest heat", "full_content": "WELSPUNLIV ICIL TRIDENT APEX Vaamanaa Sethi Published 26 Nov 2026, 01:26 PM IST Prefer Livemint on Google India-US trade deal : The latest US tariff rates announced on Wednesday has proposed a 17% tariff on Indian exports if New Delhi \u201cwere to reach an agreement on Reciprocal Trade\u201d with Washington. However, in the absence of a trade agreement, India could face tariffs of up to 25% under Section 301 investigations covering excess production capacity that affects US interests.\n\nIn comparison, the USTR has proposed tariffs of 18% on Bangladesh, Cambodia and Thailand, and 20% on China and Vietnam, subject to the respective countries reaching trade agreements with the US. This could give Indian exporters a competitive edge over their counterparts in these competing economies.\n\nEarlier, in February, US President Donald Trump had announced a trade deal with India, claiming that New Delhi had agreed to significantly increase its purchases of American goods. The announcement came after Washington agreed to reduce tariffs on Indian exports to 18% from the earlier rate of 50%.\n\nAccording to V K Vijayakumar, Chief Investment Strategist, Geojit Investments Limited, the tariff threat is unlikely to have any impact on the Indian stock market in the near-term.\n\n\u201cThe US administration has proposed 25% tariffs on India ( 17% if a trade deal is struck) along with tariffs proposed on many other countries. This is more a tactic to apply pressure on India to reach a deal. India is unlikely to relent much,\u201d Vijayakumar said.\n\nOn the other hand, Vinit Bolinjkar, Head of Research, Ventura, said that The proposed US tariffs of up to 25% on Indian imports could trigger near-term market volatility, weigh on export competitiveness and put pressure on corporate earnings.\n\n\u201cExport-oriented sectors such as textiles, gems and jewellery, engineering goods and marine products remain particularly vulnerable to margin compression and slower order inflows.", "source": "LiveMint Markets", "pub_date_str": "26 Nov 2026, 01:26 PM IST", "pub_date_relative": "1h ago"}, {"title": "Tanla Platforms shares plunge 12% in 6 days amid SC's setback for subsidiary Karix Mobile; details about \u20b9375 cr dispute", "full_content": "Pranati Deva Published 26 Nov 2026, 01:21 PM IST Prefer Livemint on Google Tanla Platforms shares fell around 4% in intraday trade on Thursday, November 26, after the Supreme Court dismissed an appeal filed by its subsidiary Karix Mobile challenging rival OneXtel's selection for a government messaging gateway services contract worth \u20b9 330\u2013375 crore.\n\nThe Supreme Court upheld the Delhi High Court's April 2026 ruling in favour of OneXtel, dealing a setback to Karix's challenge against the tender award. The apex court also directed Karix to pay \u20b9 50,000 in costs to the Supreme Court Advocate-on-Record Association within three weeks.\n\nThe development comes as Tanla Platforms' stock has been under pressure in recent sessions, despite delivering positive returns over longer periods.\n\nTanla Platforms opened at \u20b9 649 on Thursday and subsequently touched an intraday high of \u20b9 653.65. The stock was also in the red in the previous session, taking its decline to 8.5% over two days.\n\nOver the last six trading sessions, the stock has closed lower in five, losing around 12% during the period.\n\nHowever, its performance over longer periods remains positive. Tanla Platforms shares have gained 10% in one month, 19% in three months, 18% in six months and 10% over the past year.\n\nA bench of Justices PS Narasimha and Alok Aradhe upheld the Delhi High Court's April 2026 judgment, which had ruled in favour of OneXtel's selection for the National Informatics Centre Services Inc (NICSI) contract.\n\nKarix had challenged the award, alleging that OneXtel was ineligible because it had submitted a false and invalid Capability Maturity Model Integration (CMMI) certification. It argued that the certification was issued by UK Certification and Inspection Ltd, which was not authorised by the CMMI Institute under the Information Systems Audit and Control Association (ISACA).", "source": "LiveMint Markets", "pub_date_str": "26 Nov 2026, 01:21 PM IST", "pub_date_relative": "1h ago"}, {"title": "New NFO alert! Invesco India Financial Services Debt Fund\u2014See full offer period, minimum investment amount, more details", "full_content": "New Fund Offer alert: Invesco Mutual Fund (MF) has launched the Invesco India Financial Services Debt Fund, an open-ended debt scheme investing in the financial services sector, the company stated.\n\nManaged by Vikas Garg and Gaurav Jakhotia, the scheme carries moderate interest rate and credit risk and will be benchmarked against the CRISIL Financial Services Short Term Debt Index, as per the fund house.\n\nIt added that the scheme comes amid a rise in India's corporate bond market , where financial sector bonds account for around 50% of the market, according to SEBI data as of the end of September.\n\nThe fund house noted that \u201cimproving credit metrics across banks and non-banking financial companies (NBFCs), coupled with higher carry opportunities available in financial sector bonds, create a compelling environment for a dedicated sector-focused debt strategy\u201d.\n\nAs per the fund house, the product comes at a time when India's financial sector \u201cis demonstrating strong fundamentals, supported by improving asset quality, robust capital buffers and a growing universe of high-quality issuers\u201d.\n\n\u201cThrough rigorous credit research, our proprietary risk assessment framework and active portfolio management, we aim to build a high-quality portfolio that seeks to deliver attractive risk-adjusted income opportunities for investors,\u201d Garg stated.\n\nInvesco Asset Management (India) has an average assets under management (AUM) of over \u20b9 1,75,623 crore for the quarter ending September 2026 across mutual funds, PMS, and offshore advisory business, as per the release.\n\nInvesco is a global independent investment management firm with offices in over 20 countries, managing $2.5 trillion in assets on behalf of clients worldwide as of June 30, 2026, it added.", "source": "LiveMint Money", "pub_date_str": "26 Nov 2026, 01:18 PM IST", "pub_date_relative": "1h ago"}, {"title": "Why is Max Healthcare stock surging despite regulatory headwinds?", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nMax Healthcare Institute's stock has staged a sharp recovery, gaining around 30% in a month. The rally follows a steep fall since September, when the Supreme Court raised concerns over inflation in anti-cancer drugs. Soon after, the National Pharmaceutical Pricing Authority capped trade margins at 30% on 137 non-scheduled anti-cancer drugs.\n\nEffective 9 November, the move is expected to reduce prices of several medicines by as much as 70%. Moreover, as per a Mint report , similar caps are being considered for other high-cost and essential drugs, including antibiotics, diabetes and heart medicines, and biologics.\n\nEven so, the stock's recovery suggests investors are reassessing the potential earnings damage amid improving capacity utilisation and expectations of stronger growth. Still, Max's relatively high exposure to oncology and government-sponsored healthcare schemes makes it more vulnerable to regulatory changes than peers.\n\nOncology contributed 22% of Max's inpatient revenue, a key revenue source for hospitals, in the first half of FY27 (H1FY27), down from 26% a year ago. However, only 30% of its oncology revenue comes from chemotherapy drugs, some of which are affected by the new restrictions.\n\nMoreover, with hospitals expected to raise prices of other services, the net impact on earnings may be lower than initially feared. \u201cFactoring in lower Onco revenues and likely implementation of price caps on Onco drugs, we marginally trim our Ebitda estimates by 3% each for FY27/28E,\u201d said a report by Anand Rathi Share and Stock Brokers.\n\nBut oncology is not Max's only regulatory vulnerability. Its relatively higher exposure to government-sponsored patients has been a double-edged sword.\n\nCentral Government Health Scheme (CGHS) package rates were revised upwards in October 2025, after years of stagnation.", "source": "LiveMint Markets", "pub_date_str": "26 Nov 2026, 01:18 PM IST", "pub_date_relative": "1h ago"}, {"title": "Taking on Starlink: Europe\u2019s largest satellite factory opens in push to rival Musk", "full_content": "The largest satellite factory in Europe was inaugurated in Belgium this week, boosting the continent's efforts to challenge Elon Musk's Starlink and reduce reliance on U.S. space infrastructure.\n\nPrivately held Belgian satellite manufacturer Aerospacelab secured a 2.4-billion-euro ($2.6 billion) contract in September to manufacture 264 of the 348 satellites planned for IRIS\u00b2, the European Union's answer to SpaceX 's Starlink business.\n\nAerospacelab said this will \"form the backbone of Europe's sovereign, secure, and resilient connectivity infrastructure by 2030.\" It will be named Ectro from Nov. 30.\n\nIts new oval-shaped, 20,000-square-meter facility in southern Belgium, inaugurated by Belgian King Philippe, will be able to produce up to 500 satellites annually, which would make it the world's third-largest satellite production site, according to the Belgian royal palace.\n\nEmployees are expected to move into the megafactory in January, and production is slated to begin by the end of 2028, according to AFP.\n\nSatellite connectivity has become increasingly important to everyday life as well as national security.\n\nIt provides internet access to remote locations and defense equipment like warships and fighter jets, and lets governments and militaries communicate securely where Earth-based networks are unavailable or disrupted.\n\nThe importance of such capabilities has become particularly apparent in Ukraine, as the country's military relies heavily on Starlink connectivity to fight Russian forces. Recent restrictions to the service over Russian-occupied territory reported by Ukrainian officials further underscored the way geopolitical conflict may depend on commercial businesses.", "source": "CNBC World Economy", "pub_date_str": "26 Nov 2026, 01:15 PM IST", "pub_date_relative": "1h ago"}, {"title": "High Fat, Sugar Or Salt: What Supreme Court Said On Front-Of-Pack Warning Labels For Packaged Food", "full_content": "The judgment was delivered by a bench of Justices JB Pardiwala and K Vinod Chandran, on a public interest litigation filed by the organisation '3S and Our Health Society' under Article 32 of the Constitution.", "source": "NDTV Profit", "pub_date_str": "26 Nov 2026, 01:11 PM IST", "pub_date_relative": "2h ago"}], "cfa": [{"title": "No PF deposit for 3 years? EPFO clarifies inoperative account rules: This is how you can claim your money", "full_content": "Have you left a job and received no new Employees' Provident Fund (EPF) contributions for three years? Your PF account may be inactive, but that does not automatically mean it is inoperative.\n\nThe Employees' Provident Fund Organisation (EPFO) has clarified when an account is classed as inoperative and what members should know about their savings. Knowing this can help members manage their EPFO accounts , plan for retirement, and avoid their accounts becoming inoperative in the future.\n\nEPFO highlighted the issue in a recent post on its official X handle on November 24 and urged members to check whether their accounts had become inoperative.\n\n\"\ud83e\udd14 EPF \u0905\u0915\u093e\u0909\u0902\u091f \u092e\u0947\u0902 \u092c\u094d\u092f\u093e\u091c \u0906\u0928\u093e \u092c\u0902\u0926 \u0939\u094b \u0917\u092f\u093e \u0939\u0948? \u091c\u093e\u0928\u0947\u0902 \u0915\u0939\u0940\u0902 \u0906\u092a\u0915\u093e \u0905\u0915\u093e\u0909\u0902\u091f Inoperative \u0924\u094b \u0928\u0939\u0940\u0902! \u0905\u0927\u093f\u0915 \u091c\u093e\u0928\u0915\u093e\u0930\u0940 \u0915\u0947 \u0932\u093f\u090f \u0932\u093f\u0902\u0915 \u092a\u0930 \u091f\u0948\u092a \u0915\u0930\u0947\"\n\nTranslation: \"Has your EPF account stopped earning interest? Find out whether your account has become inoperative. Tap the link for more information.\"\n\nThe tweet also includes a YouTube link to a 5-minute, 16-second video that explains the entire process.\n\nAll eligible members can check their basic details and log in to the EPFO Member e-Sewa portal utilising their Universal Account Number (UAN) details and password. After carefully reviewing their personal details, such as Aadhaar number, name, and bank account details, and ensuring they are up to date and accurate, they can submit an online final settlement claim utilising Form 19.\n\nFurthermore, members who have joined another EPF-covered employer should also ensure that they transfer their old PF balance using Form 13 rather than withdrawing it. For this, the guidance of the respective Human Resource officer of your organisation should be sought in case of doubts.", "source": "LiveMint Money", "pub_date_str": "26 Nov 2026, 03:01 PM IST", "pub_date_relative": "10m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Gold price today in India \u20b958,500 away from record high; right time to buy amid rebound from 14-month low?", "full_content": "Gold Rate Today | Gold Price Today | Gold Price Drop in 2026: After hitting the 14-month low on Friday last week, the MCX gold prices are trying to come out of the oversold zone. On Monday, the MCX gold rate staged a strong rebound, coming close to \u20b9 1,24,000 per 10 gm. However, the recovery turned out a dead-cat bounce and the precious yellow metal witnessed sharp selling on Tuesday and Wednesday. However, after the release of a better-than-expected US GDP outlook, gold prices across bourses witnessed strong buying despite flat US inflation data. In India, the MCX gold rate today is around \u20b9 1,22,250 per 10 gm, nearly \u20b9 58,500 below the record high of \u20b9 1,80,779 made in January 2026. In the international market, the gold price in USD is around $3,565/oz, about $2,060/oz below the record high of $5,626.80/oz set in January 2026.\n\nHighlighting the reasons that kept gold prices under pressure throughout 2026, barring January 2026, Anuj Gupta, a SEBI-registered market expert, said, \u201cOnce the bullion bottomed out, AI disruption triggered, and money started to shift from metals to AI and semiconductor stocks throughout the world. This triggered selling in gold and silver prices and an uptrend in AI and Semiconductor stocks. When the AI meltdown happened, smart money started moving out of equities into US bonds due to the skyrocketing US Treasury yields. As the rally in US bond yields extended for a longer period, rising from the alarming 4% to near 6%, fueling further shift of smart money from bullion and equities happened and gold price crash deepened.\u201d\n\nThe SEBI-registered market expert said that later, the Indian Rupee and the US dollar (USD) started appreciating due to the rise in bond yields, which further put precious metals under pressure, both in the international and domestic markets.\n\n\u201cCrude oil prices skyrocketed from around $72 per barrel to around $120 per barrel after the outbreak of the US-Iran war.", "source": "LiveMint Markets", "pub_date_str": "26 Nov 2026, 02:59 PM IST", "pub_date_relative": "12m ago", "cfa_topics": ["Economics", "Fixed Income", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "BPCL vs IOCL vs HPCL: Jefferies names its top OMC stocks to buy as crude prices fall | Check target prices, rationale", "full_content": "IOC Pranati Deva Published 26 Nov 2026, 02:55 PM IST Prefer Livemint on Google OMC stocks to buy : Oil marketing companies were among the worst-hit by the energy disruption triggered by the West Asia conflict, as contracting margins squeezed profitability and led to a sharp decline in earnings. Global brokerage Jefferies has turned bullish on Bharat Petroleum Corporation (BPCL) and Indian Oil Corporation (IOC), citing improving profitability prospects for oil marketing companies (OMCs) following a sharp correction in crude oil prices during November.\n\nThe brokerage believes the recent decline in crude prices has significantly improved the economics of fuel marketing and refining businesses, pushing integrated margins firmly into positive territory. However, BPCL and IOC shares have yet to reflect this improvement, creating an attractive risk-reward opportunity, according to Jefferies.\n\nThe brokerage has reiterated its 'Buy' ratings on both stocks while retaining an 'Underperform' rating on Hindustan Petroleum Corporation (HPCL). It prefers BPCL and IOC on valuation grounds, arguing that the two stocks offer better upside potential than HPCL at current levels.\n\nBrent crude prices have declined by $28 per barrel during November, supported by rising Middle Eastern exports despite the blockade of the Strait of Hormuz. Freight rates have also corrected, reducing the delivered cost of crude for Indian refiners, Jefferies said.\n\nThe decline in crude prices has helped reverse the pressure on fuel marketing margins, which had turned negative in October.\n\nAccording to Jefferies' calculations, petrol marketing margins have improved to \u20b9 7.7 per litre, while diesel marketing margins stand at \u20b9 0.3 per litre based on spot Brent prices.", "source": "LiveMint Markets", "pub_date_str": "26 Nov 2026, 02:55 PM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "CMC Markets HY 2027 slides: profit doubles as platform strategy pays off", "full_content": "", "source": "Investing.com News", "pub_date_str": "26 Nov 2026, 02:50 PM IST", "pub_date_relative": "21m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Income tax calendar December 2026: Check key deadlines for TDS payments, advance tax, belated ITR and FAST-DS scheme", "full_content": "December 2026 is an important month for income tax compliance, with several deadlines for individual taxpayers , businesses, and tax deductors.\n\nThese include the third instalment of advance tax for Tax Year 2026\u201327, the deadline for depositing TDS and TCS collected in November, and the last date for filing belated income tax returns ( ITR s).\n\nHere is a look at the key income tax deadlines falling in December.\n\nTax deducted or collected at source (TDS/TCS) during November 2026 must be deposited with the Central Government by 7 December.\n\nAnother compliance requirement due on this date is the uploading of declarations received in Form 127 during November. This form is furnished by a buyer to the seller to obtain goods without tax collection at source (TCS).\n\nIt is important for buyers and sellers covered by the relevant TCS provisions to ensure that these declarations are uploaded on time.\n\nTwo important income tax compliances fall due on 15 December 2026:\n\nIndividuals earning only salary income are not required to pay advance tax, as their employers deduct and deposit the applicable tax through TDS.", "source": "LiveMint Money", "pub_date_str": "26 Nov 2026, 02:48 PM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Financial Statement Analysis", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "TCM Group Q3 2026 slides: revenue jumps 14%, guidance cut on weak demand", "full_content": "", "source": "Investing.com News", "pub_date_str": "26 Nov 2026, 02:47 PM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Allied Blenders shares: After 50% jump in 6 months, Elara Securities sees 25% more returns; assigns Buy rating | Target", "full_content": "Shares of Allied Blenders and Distillers have rallied nearly 50% over the past six months, but the stock may have further room to climb, according to Elara Securities. The brokerage has initiated coverage on the liquor maker with a Buy rating and a target price of \u20b9 1,000, implying an upside of around 25% from its closing price of \u20b9 803 on 23 November 2026.\n\nIn its initiation report, Elara said Allied Blenders is transitioning from a mass-market whisky franchise into a diversified, premium-led spirits company. It believes the company's focus on premiumisation, portfolio expansion, distribution growth and backward integration could drive a sharp improvement in earnings and profitability over the coming years.\n\nThe brokerage expects Allied Blenders to deliver an earnings per share (EPS) compound annual growth rate (CAGR) of 40% between FY26 and FY29, significantly higher than the peer median of around 25%. It believes sustained execution on its growth plans could also support a valuation rerating towards peer multiples.\n\nElara has valued the stock at 49 times its December 2028 estimated earnings, in line with the peer median, to arrive at its target price of \u20b9 1,000. The stock currently trades at 47 times FY28 estimated price-to-earnings (P/E).\n\nA key part of Allied Blenders' growth strategy is expanding its presence in the Prestige and Above (P&A) segment. Its ICONiQ White brand has played a significant role in building this franchise, helping the company deliver a 13% revenue CAGR in the P&A category between FY23 and FY26.\n\nElara expects ICONiQ White to remain the company's primary growth driver, contributing around 75% of P&A volumes by FY29.", "source": "LiveMint Markets", "pub_date_str": "26 Nov 2026, 02:41 PM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Earnings call transcript: CMC Markets posts record H1 2027 profit as growth broadens", "full_content": "", "source": "Investing.com News", "pub_date_str": "26 Nov 2026, 02:38 PM IST", "pub_date_relative": "33m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stock Market Today: Sensex, Nifty 50 In Green Amid Volatility; BSE, HCL Tech, Infosys Top Gainers; Smallcaps Rally", "full_content": "Among sectors, Nifty Realty index rallied the most over 3%, followed by Nifty IT, Nifty Metal and Nifty Pharma indices. Selling was seen in Nifty FMCG, Nifty Auto, Nifty PSU Bank and Nifty Media.", "source": "NDTV Profit", "pub_date_str": "26 Nov 2026, 02:36 PM IST", "pub_date_relative": "35m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Earnings call transcript: TCM Group beats Q3 2026 estimates but outlook stays weak", "full_content": "", "source": "Investing.com News", "pub_date_str": "26 Nov 2026, 02:36 PM IST", "pub_date_relative": "35m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Norse Atlantic suspends all flights, warns it may file for bankruptcy after share price collapse", "full_content": "Norse Atlantic suspended all of its flights on Thursday and warned it may have to file for bankruptcy after its stock collapsed on Wednesday following its warning about its \"critical\" financial situation.\n\n\"The board of directors continues to consider options to secure short-term financing,\" Norse said in a Thursday statement. \"If a short-term financing solution is not secured urgently, it is the board's intention to file for bankruptcy.\"\n\nThe airline added that \"there can be no assurance that a viable solution will be found.\"\n\nChecks by CNBC showed the airline was still selling tickets for flights on Friday and beyond as of 9 a.m. Oslo time on Thursday.\n\nWarning signs first popped up when PK786 from London to Islamabad and PK710 from Manchester to Lahore were cancelled because of \"an unexpected operational suspension,\" the Pakistani flag carrier said on X.\n\nThe airline had been set to operate two Pakistan International Airlines flights Wednesday under a wet-lease agreement, in which one airline provides the aircraft and crew to another. The agreement had only been signed in early October.\n\nPIA said it would operate the routes using its own Boeing 777 aircraft from the next day.\n\nNorse's own flight Z0 783 from London Gatwick to Orlando was also shown as canceled Wednesday on live air traffic website Flightradar24. London Gatwick's website listed the flight's status for Thursday as \"enquire airline.\"", "source": "CNBC Top News", "pub_date_str": "26 Nov 2026, 02:32 PM IST", "pub_date_relative": "39m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Derivatives"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Four credit bureaus, four different scores: Why?", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nA credit score of 800 seen on a fintech app can feel like a guaranteed loan, but a bank can still turn down your loan application while offering one to someone with 730, the difference being which bureau the score is assigned by and how the lender treats that bureau\u2019s score.\n\nIndia has four credit bureaus: CIBIL, Experian, Equifax and CRIF. Each one collects your repayment data from lenders, builds a report and calculates its own score. All of them broadly assess similar aspects such as whether you pay on time, how much debt you carry and how long you have been borrowing, but each applies its own proprietary model.\n\nThe scores sit on the same 300 to 900 scale, but they are not interchangeable, and banks decide for themselves what score they will accept from each bureau. Read on to understand what causes the difference and what lenders consider.\n\nOver the years, the way bureaus receive data has become more uniform, said Parijat Garg, a digital lending consultant. The Reserve Bank of India has mandated a standard reporting format, and lenders must send data to all bureaus weekly.\n\n\u201cWhile credit bureaus broadly work with similar categories of credit information, each bureau develops and applies its own proprietary statistical models and methodologies.", "source": "LiveMint Money", "pub_date_str": "26 Nov 2026, 02:31 PM IST", "pub_date_relative": "40m ago", "cfa_topics": ["Quantitative Methods"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "Latin America has the copper and energy the AI build-out needs. Infrastructure is the test", "full_content": "Latin America\u2019s copper, energy and mineral resources could play a growing role in supplying the global artificial-intelligence build-out, as data centers and electrification drive demand for power and raw materials.\n\nBut for investors, it's less about whether Latin America has the resources than whether governments can turn them into viable projects.\n\n\"We are going through an acceleration in energy demand growth. We need every possible energy source available,\" Michele Della Vigna, head of natural resources research for Goldman Sachs, told CNBC. \"Ultimately, what drives economic growth is energy,\" he added.\n\nBen Kumar, head of strategy for wealth, investment and public policy at 7IM, suggested Latin America could benefit, given the physical materials needed for AI equipment and data centers. \"We are currently neutral in the short term, but if the materials and mining cycle continues, we could see this moving to positive in a few months,\" he said.\n\nThe investment case varies across the region. Chile has copper; Argentina is expanding oil and gas exports; and Brazil has abundant renewable power and significant rare earth reserves.\n\nChile's copper sector illustrates both the supply potential and the constraints to expanding supply. Copper production fell 8.5% in the first nine months of 2026, according to the state copper commission Cochilco, as lower ore grades, maintenance, and operational disruptions constrained supply.\n\nBut demand for refined copper is set to grow 1.6% this year and 2% next year, according to the International Copper Study Group . Supply is struggling to keep pace with demand from expanding electricity grids.\n\nChile's copper commission has raised its 2027 price forecast to $5.95 a pound, from $5.10. Codelco, the state-owned copper producer, may also have scope to increase supply, including through proposed public-private partnerships.", "source": "CNBC World Economy", "pub_date_str": "26 Nov 2026, 02:29 PM IST", "pub_date_relative": "42m ago", "cfa_topics": ["Economics", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "This bank enables instant NPS through PFRDA\u2019s \u2018Tatkal NPS\u2019: Check key features and steps to apply online", "full_content": "Federal Bank has joined the Pension Fund Regulatory and Development Authority's \u2018Tatkal NPS\u2019 initiative, the private sector lender said in an official release. The move enables eligible customers to instantly open an account with the National Pension System ( NPS ) using their existing KYC details with the bank, it added.\n\n\u201cThe initiative aims to make retirement planning easier and more accessible by reducing onboarding time and paperwork. NPS offers individuals across professions and age groups a simple avenue to build long-term financial security and create a retirement corpus ,\u201d the bank said.\n\n\u201cWe are committed to making financial services simple, accessible and digital-first. Our participation in PFRDA's Tatkal NPS initiative will help customers begin their retirement planning journey seamlessly and encourage greater adoption of long-term financial savings,\u201d said Joy PV, EVP and Country Head \u2014 Retail Liability and Fee Products, Federal Bank.\n\nAs per the Federal Bank statement, in the initial phase, its Tatkal NPS feature will be available through the BHIM mobile app, and customers will need to hold an active savings account with complete KYC to be eligible.\n\nEarlier in September, the PFRDA announced the launch of Tatkal NPS on the BHIM payments app, allowing eligible bank customers to open an NPS account directly through the platform.", "source": "LiveMint Money", "pub_date_str": "26 Nov 2026, 02:27 PM IST", "pub_date_relative": "44m ago", "cfa_topics": ["Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Gold rate today in Chennai, Hyderabad, Bangalore: Check 26 November MCX yellow metal prices details", "full_content": "Gold rate today: Gold prices surged in early trade on Thursday, November 26, in India, tracking gains in the global bullion market after stronger-than-expected US inflation data boosted expectations of a possible interest rate hike in December.\n\nIn the international market, spot gold was largely unchanged at $3,572.80 per ounce, while US gold futures for December delivery advanced 1% to $3,571.60 on Thursday.\n\nThe US economy expanded at a much faster pace than initially estimated in the third quarter, while inflation accelerated further in October. The latest data has strengthened expectations that the Federal Reserve will hike interest rates next month and once again in early 2027. The US central bank last raised rates in September.\n\nOn the domestic front, gold prices on the Multi Commodity Exchange (MCX) opened 1.2% higher at \u20b9 1,22,740 per 10 grams. The yellow metal extended its gains shortly after the opening bell, hitting an intraday high of \u20b9 1,23,888 per 10 grams.\n\nAccording to Ponmudi R, CEO of Enrich Money, MCX gold opened with a modest gap-up near \u20b9 122,740 and is trading around \u20b9 122,580, up approximately 1.2%, holding above the \u20b9 121,000\u2013121,700 support zone. Wednesday\u2019s candle featured a long lower shadow, with buying interest emerging near \u20b9 117,500.\n\nOn the technical outlook, Ponmudi added, \u201cImmediate resistance is placed at \u20b9 126,300\u2013127,000, followed by \u20b9 130,000\u2013130,700. On the downside, \u20b9 121,000\u2013121,700 remains the immediate support band, with stronger support at \u20b9 117,500\u2013118,500. The RSI, hovering near 28, remains deeply oversold and marginally below its average, while the MACD continues to signal negative momentum.\u201d\n\nDisclaimer : This story is for educational purposes only. The views and recommendations above are those of individual analysts or broking comp
