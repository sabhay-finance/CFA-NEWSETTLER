s News \u203a Markets \u203a Stocks \u203a News PB Fintech among 4 F&O stocks with a sharp rise in futures open interest Written by Ritesh Presswala , ETMarkets.com | Sep 25, 2026, 09:32:45 AM IST 1 / 5 F&O Activity Surges As of September 24, four stocks in the NSE F&O segment recorded a rise of more than 7% in futures open interest compared with the previous trading session, according to StockEdge F&O scan data. A notable increase in futures open interest indicates a substantial rise in the number of active, unexpired futures contracts in a security. This may reflect market participants initiating new positions or increasing the size of their existing positions.", "source": "Economic Times Markets", "pub_date_str": "25 Sep 2026, 09:28 AM IST", "pub_date_relative": "14m ago"}, {"title": "Welspun Corp share price rises 4% after subsidiary wins its largest-ever order | All details here", "full_content": "Welspun Corp share price climbed over 4% in early deals on the BSE on Friday, 25 September, boosted by the company's announcement about its subsidiary winning its largest-ever order in the US.\n\nWelspun Corp shares opened at \u20b9 2,782 against their previous close of \u20b9 2,694.60 and rose by 4.3% to an intraday high of \u20b9 2,810.\n\nIn an exchange filing on 25 September, Welspun Corp said its wholly owned subsidiary in the US, Welspun Tubular LLC, had secured the largest-ever order in its history, in terms of volume, length and value, for the supply of high-frequency induction welded (HFIW) pipes, valued at nearly $412.5 million (nearly \u20b9 4,000 crore).\n\nAccording to the company's exchange filing, the pipes will be manufactured at the company's newly upgraded HFIW mill, with enhanced capabilities, at Little Rock, USA. The order will be executed during FY28 and FY29.\n\nThe company said that with its order, its global order book stands at a record $4.7 billion (nearly \u20b9 45,000 crore), the highest in its history.\n\n\"This order underscores the scale, quality and execution capability of the company's operations, and reinforces its long-term strategy of expanding global manufacturing capacity and deepening relationships with marquee international clients,\" said Welspun Corp.\n\nEarlier on 20 September, Welspun Corp announced its associate company, East Pipes Integrated Company for Industry (EPIC), a listed entity in the Kingdom of Saudi Arabia (KSA), signed off with Saudi Arabian Oil Co. (Aramco) for the manufacturing and supply of steel pipes for a total value exceeding 771 million SAR (nearly \u20b9 2,000 crore), including value-added tax. The contract duration is six months, and its financial impact will be reflected from Q4 FY27 through Q1 FY27-28.\n\n(This is a developing story. Please check back for fresh updates.)", "source": "LiveMint Markets", "pub_date_str": "25 Sep 2026, 09:28 AM IST", "pub_date_relative": "14m ago"}, {"title": "PB Fintech shares rebound 4% after massive 36% crash. What are Jefferies, others saying?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a PB Fintech shares rebound 4% after massive 36% crash. What are Jefferies, others saying? PB Fintech Share Price The Economic Times daily newspaper is available online now. Read Today's Paper PB Fintech shares rebound 4% after massive 36% crash. What are Jefferies, others saying? SECTIONS PB Fintech shares rebound 4% after massive 36% crash. What are Jefferies, others saying? By Veer Sharma , ETMarkets.com Last Updated: Sep 25, 2026, 09:32:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis PB Fintech shares plunged 36% in the previous session following IRDAI\u2019s proposal to curb \u2018dark patterns\u2019 on insurance websites. The proposed rules could also pressure insurance stocks by limiting insurers\u2019 Expense of Management (EoM), potentially reducing spending on commissions and distribution while raising customer acquisition costs.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "25 Sep 2026, 09:27 AM IST", "pub_date_relative": "16m ago"}, {"title": "WhatsApp Now Available On New Ray-Ban Meta Audio Glasses", "full_content": "Meta is expanding WhatsApp features across its AI smart glasses, including Ray-Ban Meta, Oakley Meta and Meta Ray-Ban Display. Users can send messages, make calls, share photos and video-call perspectives hands-free using voice commands.", "source": "NDTV Profit", "pub_date_str": "25 Sep 2026, 09:23 AM IST", "pub_date_relative": "19m ago"}, {"title": "Delek US prices $400m convertible notes offering due 2031", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Sep 2026, 09:22 AM IST", "pub_date_relative": "20m ago"}, {"title": "Chalet Hotels among 3 stocks closed above VWAP", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News Chalet Hotels among 3 stocks closed above VWAP Written by Ritesh Presswala , ETMarkets.com | Sep 25, 2026, 09:26:04 AM IST 1 / 4 Trend watch On September 24, the closing prices of three Nifty500 stocks were more than 1% above their respective VWAPs (Volume Weighted Average Price), according to StockEdge\u2019s technical scan data. When a stock closes above its VWAP, it means it ended the session at a price higher than its volume-weighted average traded price. VWAP gives greater weight to prices at which higher trading volumes occurred.", "source": "Economic Times Markets", "pub_date_str": "25 Sep 2026, 09:22 AM IST", "pub_date_relative": "20m ago"}, {"title": "Tax consultant filed incorrect deduction claims: Why ITAT cancelled \u20b92.21 lakh penalty on a salaried employee", "full_content": "Hiring a tax consultant can make filing an income tax return (ITR) easier. However, taxpayers remain responsible for the information submitted in their names, even when a consultant prepares and files the return on their behalf.\n\nA recent ruling by the Pune Income Tax Appellate Tribunal (ITAT) highlights the risks of incorrect deductions or tax benefits being claimed without a taxpayer's knowledge. The tribunal examined the consequences of such claims and the extent of a taxpayer's liability.\n\nIn this case, the ITAT cancelled a penalty of \u20b9 2.21 lakh imposed on a Bosch employee after his tax consultant allegedly claimed deductions he later disputed.\n\nThe ITAT order passed on 2 September 2026 in Dilip Gangaram Mali v. ITO, Ward 2(1), Nashik, dealt with appeals relating to assessment years 2017-18 and 2018-19.\n\nThe case concerns Dilip Gangaram Mali and relates to assessment years 2017-18 and 2018-19. For 2017-18, he reported an income of \u20b9 5.06 lakh and claimed deductions of \u20b9 2.35 lakh under Chapter VI-A deductions, resulting in a tax refund of \u20b9 83,520.\n\nFollowing a survey of the tax consultant, the income tax department reopened Mali's assessment. However, Mali had already filed a revised return on 6 June 2019, increasing his declared income to \u20b9 9.12 lakh and paying \u20b9 1,02,875 towards tax and interest. Here are the key facts and findings of the case.\n\nNote: For complete details, refer to the ITAT ruling on its official website.\n\nThe Pune ITAT referred to an earlier 2025 ruling that involved the same tax consultant. The case underscored that several taxpayers had relied on the consultant to prepare their returns, and excess deductions had allegedly been claimed without their knowledge.", "source": "LiveMint Money", "pub_date_str": "25 Sep 2026, 09:20 AM IST", "pub_date_relative": "22m ago"}, {"title": "Analysis-Japan\u2019s bond \u2019falling knife\u2019 stalls repatriation rush", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Sep 2026, 09:18 AM IST", "pub_date_relative": "24m ago"}, {"title": "German Green Steel IPO opens today: GMP indicates 20% potential listing gain. Should you subscribe?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a German Green Steel IPO opens today: GMP indicates 20% potential listing gain. Should you subscribe? Systematix Corporate Services Share Price Fedders Holding Share Price Gyftr Share Price Ugro Capital Share Price Saraswati Commercial (India) Share Price The Economic Times daily newspaper is available online now. Read Today's Paper German Green Steel IPO opens today: GMP indicates 20% potential listing gain. Should you subscribe? SECTIONS German Green Steel IPO opens today: GMP indicates 20% potential listing gain. Should you subscribe? By Ritesh Presswala , ETMarkets.com Last Updated: Sep 25, 2026, 09:18:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis German Green Steel\u2019s Rs 303.90 crore IPO opens for subscription today, September 25, and will remain open until September 29.  had raised concerns over a potential five-day disruption to customer services and banking operations across India.\n\nHowever, bank unions have questioned the decision to declare the upcoming Sunday a working day for bank employees. This has led to confusion among customers, who may be wondering whether they will be able to access in-branch banking services on that day or not.\n\nThe Reserve Bank of India (RBI) has granted approval for all bank branches, offices, ATM-linked branches and currency chests to remain fully operational on September 27. The announcement was made after the Finance Ministry held a meeting with the chief executives of public sector banks and regional rural banks on Monday to discuss ways of minimising disruptions ahead of the strike.\n\nIn response, the All India Bank Officers\u2019 Association (AIBOA) has advised its members not to report to work on September 27, citing the day as a holiday under the Industrial Disputes Act.\n\n\u201cOur organisation is forced to observe the stay out strike from September 28 to 30, 2026. Our members are advised not to attend the office on Sunday (a holiday declared under the ID act), September 27, 2026.\u201d AIBOA said in a statement on Wednesday, September 23.\n\nThe United Forum of Bank Unions (UFBU), meanwhile, held an urgent online meeting at 10 pm on Wednesday to discuss the issue of staying away from offices on September 27. A decision is yet to be announced.\n\nThe main demand of the bank unions is the implementation of a five-day banking week, under which all Saturdays would be holidays. Banks currently remain closed on the second and fourth Saturdays of each month.", "source": "LiveMint Money", "pub_date_str": "25 Sep 2026, 09:16 AM IST", "pub_date_relative": "26m ago"}, {"title": "Giftify VP of sales Timothy Miller sells $1,000 in common stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Sep 2026, 09:16 AM IST", "pub_date_relative": "27m ago"}, {"title": "Marcus Corp.  read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "25 Sep 2026, 09:34 AM IST", "pub_date_relative": "8m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Gold, silver prices today, 25 September: Check retail rates of 24K, 22K gold, 999 silver in Delhi, Mumbai and Kolkata", "full_content": "Gold and silver prices: The price of the yellow metal in India's retail market rose on Friday, 25 September, amid ongoing uncertainty over the US-Iran conflict, as the US Senate narrowly voted down a resolution calling for an end to the war in Iran.\n\nThe Senate on Thursday narrowly voted down a measure demanding an end to the US war with Iran . The chamber voted 49-50 on the resolution, the latest to call for an end to the war, according to a CNBC US report.\n\nIn the international markets, gold prices ticked up on Friday but were set to post a weekly loss, pressured by a stronger dollar and growing expectations that the Federal Reserve will keep interest rates elevated to contain inflation. Spot gold rose 0.2% to $4,288.36 per ounce by 0200 GMT, but was down 2% so far this week. US gold futures edged 0.6% higher to $4,323.10.\n\nDue to these developments, both 24-karat and 22-karat gold rates are showing a marginal increase across major cities in India. Silver prices, on the other hand, declined in the domestic bullion market.\n\nMCX gold rate on 25 September was trading 0.13% higher at \u20b9 151,780 per 10 grams. MCX silver futures were trading about 0.10% lower at \u20b9 233,810 per kg at around 9:13 am.\n\nIn the retail market, gold is sold in 24-karat and 22-karat purity. While 24-karat gold is considered the purest form, 22-karat gold is commonly used for jewellery because it is more durable.\n\nHere's a look at the latest gold prices across major Indian cities on 25 September.\n\nShivam writes on personal finance, equity markets, and mutual funds. He has previously contributed to several leading publications, including Moneycontrol. He can be reached at shivam.shukla@htdigital.in", "source": "LiveMint Money", "pub_date_str": "25 Sep 2026, 09:33 AM IST", "pub_date_relative": "9m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Derivatives", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "PB Fintech Share Price Rebounds After 34% Rout In Previous Session \u2014 Do You Own?", "full_content": "The regulator had suggested a five-year glide path to cap company-level Expenses of Management (EoM), along with mandatory cost audits and public disclosure.", "source": "NDTV Profit", "pub_date_str": "25 Sep 2026, 09:30 AM IST", "pub_date_relative": "12m ago", "cfa_topics": ["Equity Investments", "Ethical & Professional Standards"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Stock Market Live: Sensex Rises 200 Points, Nifty50 Near 23,100; IT Stocks In Red; Turtlemint Shares Extend Decline", "full_content": "In the previous session, the BSE Sensex crashed 1.67%, or 1,247.71 points, to 73,580.54, while the NSE Nifty50 ended at 23,063.10, down 383.70 points, or 1.64%.", "source": "NDTV Profit", "pub_date_str": "25 Sep 2026, 09:30 AM IST", "pub_date_relative": "12m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"t ouncement about its subsidiary winning its largest-ever order in the US.\n\nWelspun Corp shares opened at \u20b9 2,782 against their previous close of \u20b9 2,694.60 and rose by 4.3% to an intraday high of \u20b9 2,810.\n\nIn an exchange filing on 25 September, Welspun Corp said its wholly owned subsidiary in the US, Welspun Tubular LLC, had secured the largest-ever order in its history, in terms of volume, length and value, for the supply of high-frequency induction welded (HFIW) pipes, valued at nearly $412.5 million (nearly \u20b9 4,000 crore).\n\nAccording to the company's exchange filing, the pipes will be manufactured at the company's newly upgraded HFIW mill, with enhanced capabilities, at Little Rock, USA. The order will be executed during FY28 and FY29.\n\nThe company said that with its order, its global order book stands at a record $4.7 billion (nearly \u20b9 45,000 crore), the highest in its history.\n\n\"This order underscores the scale, quality and execution capability of the company's operations, and reinforces its long-term strategy of expanding global manufacturing capacity and deepening relationships with marquee international clients,\" said Welspun Corp.\n\nEarlier on 20 September, Welspun Corp announced its associate company, East Pipes Integrated Company for Industry (EPIC), a listed entity in the Kingdom of Saudi Arabia (KSA), signed off with Saudi Arabian Oil Co. (Aramco) for the manufacturing and supply of steel pipes for a total value exceeding 771 million SAR (nearly \u20b9 2,000 crore), including value-added tax. The contract duration is six months, and its financial impact will be reflected from Q4 FY27 through Q1 FY27-28.\n\n(This is a developing story. Please check back for fresh updates.)", "source": "LiveMint Markets", "pub_date_str": "25 Sep 2026, 09:28 AM IST", "pub_date_relative": "14m ago", "cfa_topics": ["Equity Investments", "Fixed Income"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "PB Fintech shares rebound 4% after massive 36% crash. What are Jefferies, others saying?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a PB Fintech shares rebound 4% after massive 36% crash. What are Jefferies, others saying? PB Fintech Share Price The Economic Times daily newspaper is available online now. Read Today's Paper PB Fintech shares rebound 4% after massive 36% crash. What are Jefferies, others saying? SECTIONS PB Fintech shares rebound 4% after massive 36% crash. What are Jefferies, others saying? By Veer Sharma , ETMarkets.com Last Updated: Sep 25, 2026, 09:32:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis PB Fintech shares plunged 36% in the previous session following IRDAI\u2019s proposal to curb \u2018dark patterns\u2019 on insurance websites. The proposed rules could also pressure insurance stocks by limiting insurers\u2019 Expense of Management (EoM), potentially reducing spending on commissions and distribution while raising customer acquisition costs.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , o     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
