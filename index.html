    const allData = {"general": [{"title": "Nvidia beats on results and guidance in first earnings report since Huang's exit: Live updates", "full_content": "Nvidia beat on profit and revenue after the bell on Tuesday and issued strong guidance, in the chipmaker's first earnings report since co-founder Jensen Huang's abrupt resignation last week as CEO. The stock rose about 3% in extended trading.\n\nHere's how the company did compared to analysts' estimates, according to LSEG:\n\nRevenue more than doubled from $57 billion a year earlier, Nvidia said, a sign of continued strength in its core data center business. The company said revenue this quarter will expand by roughly 90% to about $130 billion, topping the $125.1 billion average analyst estimate, according to LSEG.\n\nFinance chief Colette Kress is used to addressing Wall Street, but never like this . She's now functioning as interim CEO, meaning her responsibilities go well beyond the key numbers. Employees, investors, analysts and customers are eager to hear her first public remarks since last week's dramatic shake-up.\n\nThere was no mention of Huang in the earnings release or supplemental information. The biggest cloud for Nvidia is around its China business after Huang's reported affair with a businesswoman who's allegedly a Chinese spy. The Commerce Department on Monday announced a change that would prevent Nvidia's chips from being rented to Chinese companies entirely, putting revenue at risk.\n\nNvidia kept with its recent language on China, telling investors in its commentary, \"We are not assuming any Data Center compute revenue from China in our outlook.\"\n\nNvidia's stock is down 24% this month and on Friday wrapped up its sixth straight weekly drop, the longest losing streak since 2012. The stock has dropped the first two days of this week and is trading at its lowest since July 2025.", "source": "CNBC World Economy", "pub_date_str": "18 Nov 2026, 03:15 AM IST", "pub_date_relative": "4m ago"}, {"title": "CNBC Digital Finance Forum live updates: Wall Street's AI and crypto future", "full_content": "Autonomous agents are already moving markets \u2014 executing trades, managing risk, and negotiating transactions at a speed and scale no human team can match. Institutions that treat this as a distant disruption risk falling behind those already adapting.\n\nCNBC's Digital Finance Forum, being held today in New York City, is bringing together the decision makers who are building the next layer of global finance to discuss the protocols enabling autonomous value exchange, the regulatory frameworks struggling to keep pace, and the strategic decisions Wall Street can no longer defer.\n\nWall Street has used some form of machine learning and trading programs for multiple decades. But this new rise of AI has many onlookers wondering when traders or investment managers will be replaced entirely by an AI agent.\n\nJenny Johnson, the CEO of Franklin Templeton, which has more than $1.8 trillion in assets under management, said that while she sees agentic technology integrating more across the financial services landscape, \"we need to make sure that every agent out there is tied to a legal entity and an individual who is accountable for the behavior of the agents.\"\n\n\"It's too easy to build an agent, and we need to make sure that there's somebody responsible for those decisions,\" Johnson told CNBC's Leslie Picker at the Digital Finance Forum.\n\nJohnson pointed to the hack of Hugging Face by OpenAI agents earlier this year as an example of why guardrails are needed.\n\n\"One of the biggest challenges with agents is that if you're a technology programmer, you program an application to do something,\" she said. \"In the world of AI, you actually need to program it and think through all the things you don't want it to do.\"\n\nIn the heavily regulated world of finance, Johnson said having agent actions that can be auditable and the decision process can be traceable is critical, as well as building in the risk limits.", "source": "CNBC World Economy", "pub_date_str": "18 Nov 2026, 03:14 AM IST", "pub_date_relative": "5m ago"}, {"title": "Fed official Lisa Cook refuses to attend White House firing hearing, citing bias - The Washington Post", "full_content": "Fed official Lisa Cook refuses to attend White House firing hearing, citing bias The Washington Post Lisa Cook lawyer signals Fed governor won't attend Trump committee's hearing CNBC Fed's Cook won't appear at White House hearing on potential firing without changes Politico Fed governor Lisa Cook will skip White House tribunal on her firing Axios Fed Governor Cook Won\u2019t Attend White House Hearing Without Changes The New York Times", "source": "Google News Business", "pub_date_str": "18 Nov 2026, 03:09 AM IST", "pub_date_relative": "11m ago"}, {"title": "La-Z-Boy earnings beat by $0.05, revenue topped estimates", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Nov 2026, 03:03 AM IST", "pub_date_relative": "16m ago"}, {"title": "Dolby Labs falls on weak first quarter guidance", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Nov 2026, 03:02 AM IST", "pub_date_relative": "17m ago"}, {"title": "Applied Optoelectronics falls 8% on $550 million stock offering plan", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Nov 2026, 03:02 AM IST", "pub_date_relative": "17m ago"}, {"title": "Jensen Huang scandal fuels bipartisan push to block AI chip sales to China", "full_content": "Revelations about former Nvidia CEO Jensen Huang 's relationship with a suspected Chinese spy have reinvigorated a congressional push to restrict China's access to advanced artificial intelligence technology.\n\nFederal lawmakers are pushing to include several measures to tighten export controls on advanced chips and related technologies in the final version of the National Defense Authorization Act. Congress is expected to consider the must-pass package that authorizes defense funding in December. Those proposals were included as amendments to an earlier version of the NDAA, which Senate Democrats blocked in July and have not been adopted by either congressional chamber in the interim.\n\nThe measures could give Congress authority to review chip sales to adversaries, empower the Commerce Department to track advanced AI chips and block the sale of key chipmaking tools to China-linked businesses.\n\nSenate Minority Leader Chuck Schumer , D-N.Y., renewed his calls for their passage from the Senate floor on Monday.\n\n\"My colleagues and I have been advocating for these bills and pushing Trump to get tougher on Chinese export controls for years,\" Schumer said. \"His administration has shown time and time again that it is completely disinterested in enforcing export controls.\"\n\nSchumer and other key players argue that such legislation is crucial to protecting the U.S. lead in AI technology. Allowing China access to advanced AI chips could undermine national security, proponents of the bills say.\n\nHuang resigned from Nvidia, the world's leading supplier of advanced AI chips, last week after reports that he had several extramarital affairs , including one with a Chinese business executive whom U.S. intelligence believed could be a spy.\n\nThe affair raised questions about whether Huang might have disclosed sensitive information to the woman, named Alice Huang, who worked until 2025 at a Singaporean company called Megaspeed that U.S.", "source": "CNBC Top News", "pub_date_str": "18 Nov 2026, 03:01 AM IST", "pub_date_relative": "18m ago"}, {"title": "Nvidia stock rises after hours as quarterly results, guidance beat estimates", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Nov 2026, 03:01 AM IST", "pub_date_relative": "18m ago"}, {"title": "\u200bNvidia forecasts quarterly revenue above estimates in first report since Huang\u2019s exit as CEO\u200b", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Nov 2026, 03:01 AM IST", "pub_date_relative": "18m ago"}, {"title": "State Street EVP and COO Ann Fogarty sells $30,608 in shares", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Nov 2026, 03:01 AM IST", "pub_date_relative": "18m ago"}, {"title": "RA Capital Management, PepGen director, buys $43.1 million in stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Nov 2026, 03:01 AM IST", "pub_date_relative": "19m ago"}, {"title": "U.S. stocks lower at close of trade; Dow Jones Industrial Average down 1.64%", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Nov 2026, 03:01 AM IST", "pub_date_relative": "19m ago"}, {"title": "Exclusive-Authorities raid factory making illegal Chinese vapes in the US", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Nov 2026, 03:00 AM IST", "pub_date_relative": "19m ago"}, {"title": "La-Z-Boy beats estimates but stock falls on weak guidance", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Nov 2026, 03:00 AM IST", "pub_date_relative": "19m ago"}, {"title": "My older brother, who has no children, cut our only sister out of his will. I\u2019ll get everything instead. Do I tell her?", "full_content": "\u201cI\u2019m torn between respecting my brother\u2019s wishes and being fair to my sister.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "18 Nov 2026, 03:00 AM IST", "pub_date_relative": "20m ago"}, {"title": "Widespread outages hit banks, air travel, the NSA and Apple, disrupting seemingly everything", "full_content": "Director of National Intelligence Jay Clayton dismissed suspicions that malicious activity led to a series of outages at major tech firms and government agencies over the last week.\n\n\"This is not cyber attack, and this is not a coordinated effort by a nation state,\" he told CNBC's \"Closing Bell\" on Tuesday. \"We've looked very closely.\"\n\nIt's been a tough few days for the technology world after series of widespread disruptions brought different parts of life to a halt.\n\nOn Tuesday, an outage halted internal communications at the National Security Agency and iPhone maker Apple confirmed that different products were either down or having issues .\n\nThe NSA pointed to \"scheduled routine maintenance,\" while Apple cited \"an internal update\" as the reason behind each issue.\n\nIt marked four major system problems in four consecutive business days.\n\nMicrosoft 's Outlook issues wreaked havoc on businesses on Thursday, and the Federal Aviation Administration grounded flights on Friday. On Monday, issues at JPMorgan Chase affected customer transactions and an outage at United Airlines briefly delayed departing flights.\n\n\"When Microsoft goes down, the whole world comes to a standstill,\" said Raj Rajamani, CEO of JetStream Security. \"That's a stark reminder of how deeply embedded these services and technologies are in our day-to-day life.\"", "source": "CNBC World Economy", "pub_date_str": "18 Nov 2026, 02:54 AM IST", "pub_date_relative": "25m ago"}, {"title": "Stock Market Today: Dow falls 700 points, S&P 500 and Nasdaq are back under pressure ahead of Nvidia results \u2014 live updates - MarketWatch", "full_content": "Stock Market Today: Dow falls 700 points, S&P 500 and Nasdaq are back under pressure ahead of Nvidia results \u2014 live updates MarketWatch Dow drops more than 800 points, S&P 500 posts lowest close since July CNBC U.S. Stocks Fall as AI Doubts Fester WSJ Stock market today: Dow sinks 850 points, S&P 500 and Nasdaq drop with focus on Nvidia earnings Yahoo Finance Dow's Nearly 750-Point Fall Led By Losses In Shares Of Salesforce, UnitedHealth Moomoo", "source": "Google News Business", "pub_date_str": "18 Nov 2026, 02:53 AM IST", "pub_date_relative": "27m ago"}, {"title": "7 smart reasons to sell a stock\u2014and my \u2018golden rule\u2019 for offloading shares, says hedge fund CEO", "full_content": "Nobody is born knowing anything innately about the stock market. And if you feel like you've missed the investing class, you didn't. Usually there isn't one.\n\nSo responsible people who are trying to do the responsible thing by building a portfolio for themselves and their families often find huge gaps in their knowledge and don't know where to turn.\n\nAs the co-founder and CEO of the hedge fund Metropolitan Capital Advisors and a longtime panelist on CNBC's Fast Money, I know that there's no shortage of advice when you're getting started about great investments to buy. It can feel easy and gratifying, especially when your portfolio is doing well. But then things get tougher.\n\nOne of the hardest things to do as an investor is to figure out when to sell. You buy a stock because you believe it will go up in value. But the decision to sell is rarely so straightforward. Personally, I've made just about every selling mistake. But over time, I've developed a framework for knowing when to sell \u2014 and when not to.\n\nSelling decisions are often rooted in emotion and cognitive bias rather than logic. One major culprit: anchoring to past performance , a flawed reference point that clouds clear thinking.\n\nBehavioral economics, particularly prospect theory , shows that we experience the pain of a loss more intensely than the joy of a gain. This leads investors to cling to losers (\"just need to get back to even\") and sell winners too early (\"lock in the gain\").\n\nWe also place too much emphasis on recent events, a phenomenon known as recency bias . If your last tech stock soared, you're more likely to chase another. If your last trade flopped, you may avoid the market altogether. And when recent trades go well, people tend to trade more \u2014 often to their detriment.\n\nFinally, selling triggers a storm of second-guessing and rationalization. Here are my responses to common excuses:", "source": "CNBC Top News", "pub_date_str": "18 Nov 2026, 02:49 AM IST", "pub_date_relative": "30m ago"}, {"title": "Why Salesforce\u2019s stock led the S&P 500\u2019s decliners amid tech jitters", "full_content": "A series of technology outages has investors concerned that software companies could prove \u201cparticularly vulnerable\u201d to AI misuse, an analyst says.", "source": "MarketWatch Top Stories", "pub_date_str": "18 Nov 2026, 02:42 AM IST", "pub_date_relative": "38m ago"}, {"title": "\u2018Can I pick your brain?\u2019 and other terrible things to say in a networking email", "full_content": "Hiring for white-collar jobs usually dips in November and December, so try sending \u201ccold emails\u201d to your network instead.", "source": "MarketWatch Top Stories", "pub_date_str": "18 Nov 2026, 02:41 AM IST", "pub_date_relative": "39m ago"}, {"title": "JPMorgan Warns Leveraged-Loan Defaults Set to Double in 2027", "full_content": "(Bloomberg) -- Defaults in the leveraged-loan market are expected to more than double to 4.5% next year, reaching levels not seen since 2024 as heavily indebted companies face mounting financial pressure, according to analysts at JPMorgan Chase & Co.\n\nBorrowers struggling with long-term industry challenges, disruption from artificial intelligence and debt coming due in 2028 and 2029 face the greatest risk, particularly if higher interest rates limit their access to financing, the analysts wrote in a report published Tuesday.\n\nAfter two consecutive years of declining defaults, JPMorgan expects leveraged loans to bear the brunt of the increase, while predicting a \u201cmore moderate\u201d rise in high-yield bond defaults. The junk-bond market has much less exposure to the struggling software sector.\n\nLeveraged-loan defaults are forecast to rise to 4.5% in 2027 and 4.75% in 2028, up from 1.96% in October, the analysts wrote. High-yield bond defaults are expected to climb to 2.75% next year and 3% in 2028, from 2.63% at the end of October.\n\nThe leveraged-loan market is particularly vulnerable to a prolonged period of elevated interest rates because its floating-rate debt becomes more expensive for borrowers when rates rise. Compared with the junk-bond market, leveraged loans also have greater exposure to industries including building products, software and information technology, leaving investors more exposed to pockets of financial distress.\n\nA wave of debt maturities in the coming years also raises the prospect of more debt restructurings that can leave some lenders worse off.", "source": "LiveMint Markets", "pub_date_str": "18 Nov 2026, 02:40 AM IST", "pub_date_relative": "39m ago"}, {"title": "Nvidia closes lower ahead of earnings as company reels from Huang resignation", "full_content": "Nvidia shares closed marginally lower Tuesday as former CEO Jensen Huang released his first public statement since his resignation and the company prepares to report earnings after the bell.\n\nThe stock move Tuesday marked Nvidia's fourth straight daily decline.\n\nIn the statement, Huang said he is open to returning as Nvidia's CEO and that he is committed to cooperating with the board's investigation into his behavior.\n\n\"I created problems for the Board that I deeply regret,\" Huang said in a statement obtained by CNBC's David Faber . \"I own my mistakes completely, and I am committed to cooperating with the Board's independent investigation.\"\n\n\"If the Board of Directors decides that my return is in the best interest of our shareholders, our employees, the company, and America, I would be honored to answer these calls and return as CEO,\" Huang continued.\n\nHuang resigned from Nvidia, the company's board announced on Thursday, following reports that he had a relationship with a woman U.S. intelligence reportedly believes to be a Chinese spy. Huang told employees he had an affair in an email on Nov. 8. Outlets also reported that Huang also had an affair with a vice president at the company and an \"intimate relationship\" with an unnamed second employee.\n\nNvidia stock chart Nvidia's stock slid 4% on Monday, bringing shares to their lowest close since July 1, 2025.\n\nLawmakers also announced Tuesday that Huang will appear before the House Foreign Affairs, Intelligence, and China Select Committees on Dec. 1. Nvidia general counsel Tim Teter will appear before the same committees on Dec. 2.", "source": "CNBC World Economy", "pub_date_str": "18 Nov 2026, 02:35 AM IST", "pub_date_relative": "44m ago"}, {"title": "US tech stocks slide ahead of Nvidia results", "full_content": "Nasdaq 100 down 0.7% after volatile run of trading", "source": "FT Markets", "pub_date_str": "18 Nov 2026, 02:34 AM IST", "pub_date_relative": "46m ago"}, {"title": "Wall Street ends lower ahead of Nvidia earnings, Anthropic debut - Reuters", "full_content": "Wall Street ends lower ahead of Nvidia earnings, Anthropic debut Reuters Nvidia's stock closes lower ahead of earnings MarketWatch Stocks slide to kick off major week for Wall Street CNN Stock market drops amid continued Nvidia fallout The Washington Post Investors look to Nvidia's earnings and Anthropic's IPO to refresh the tech rally CNBC", "source": "Google News Business", "pub_date_str": "18 Nov 2026, 02:31 AM IST", "pub_date_relative": "48m ago"}, {"title": "Treasuries\u2019 Big Short Sets Up \u2018Pain Trade\u2019 as Haven Bid Ramps Up", "full_content": "(Bloomberg) -- Bond traders risk facing a short squeeze after reloading bearish positions, as renewed jitters around artificial intelligence and a spate of technical disruptions reignite a flight to safety.\n\nA hawkish shift in the Federal Reserve\u2019s outlook over the past week helped mute a nascent haven bid that sent 10-year bond yields as low as 4.81% earlier this month, leaving longstanding Treasury shorts largely intact. That\u2019s fast becoming the market\u2019s pain trade, strategists at Bank of America warned.\n\n\u201cShorts saw a reprieve as momentum moved back in their favor after last week\u2019s selloff,\u201d Bank of America strategists wrote in a note Monday, adding that some momentum-driven accounts have recently re-entered short positions, although \u201cto a smaller extent.\u201d\n\nThe bearish positions are vulnerable to quick reversals amid flight-to-quality waves, the strategists said. \u201cShorts remain the more concentrated position and the likely pain trade if rates rally, but the threshold is higher after recent price action,\u201d they said.\n\nThat risk was on display Tuesday. Treasuries quickly reversed losses led by better-than-expected US retail sales in October, after a report that a highly classified network used by the National Security Agency for internal communications was down. It was the latest in a series of outages that affected Microsoft Corp. and several banks since last week, stoking fears of widespread disruptions. Cash bonds rallied, sending yields to session lows across maturities, while futures volumes spiked to the highest of the day.\n\nThe moves follow a surge in demand to hedge against the tail risk of a half-point interest rate hike by the Federal Reserve at the Dec. 9 meeting, after hotter-than-expected inflation data for October and remarks by Governor Christopher Waller raising the prospect of an outsized increase.\n\nTraders opened up the options playbook with bets around where the Secured Overnight Financing Rate will be after next month\u2019s policy announcement.", "source": "LiveMint Markets", "pub_date_str": "18 Nov 2026, 02:31 AM IST", "pub_date_relative": "48m ago"}, {"title": "Maryland\u2019s $81 Billion Pension Is Slashing Hedge Funds to Zero", "full_content": "(Bloomberg) -- Maryland\u2019s state pension system is eliminating its $4 billion hedge fund portfolio after years of lackluster returns, instead ramping up bets on private credit and infrastructure.\n\nThis year, the Maryland State Retirement and Pension System, which oversees $80.6 billion, is starting to phase out its Absolute Return hedge fund portfolio, which made up 5.5% of its assets as of June 2025, according to public pension documents. It expects to complete its hedge fund exit by October 2028.\n\nThe Maryland pension system provides retirement and other benefits for more than 420,000 members, including state employees, teachers, police and judges.\n\nNew Mexico Public Employees Retirement Association is also considering eliminating hedge funds, recommending to its board that it bring the allocation to zero over the long term, according to Chief Investment Officer Michael Shackelford.\n\nIf approved, the measure would wind down underperforming funds without replacing them and reserve the option to hold onto higher-performing funds. Pensions & Investments reported earlier that New Mexico\u2019s pension was considering the measure.\n\nOther large institutional investors have been taking an opposite approach. Canada\u2019s biggest pension aims to double hedge fund bets in the next few years, and the Abu Dhabi Investment Authority has also been boosting such investments.\n\nMaryland expected its hedge fund investments to exceed the three-month US Treasury bill by 4%-5% over a full market cycle and demonstrate a low correlation to public stocks, according to other documents. While the Absolute Return portfolio beat that target last year with a 10.7% gain, stock bets advanced 16.3%.", "source": "LiveMint Markets", "pub_date_str": "18 Nov 2026, 02:30 AM IST", "pub_date_relative": "49m ago"}, {"title": "\u2018It leaves me with a sour taste\u2019: My elderly mother gave our cousin $800 for a car repair. Should I be worried?", "full_content": "\u201cI know older people can easily feel patronized, and I don\u2019t want that to happen.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "18 Nov 2026, 02:30 AM IST", "pub_date_relative": "50m ago"}, {"title": "The Nvidious tech CEO", "full_content": "How much should markets value the likes of Huang, Musk and Amodei?", "source": "FT Markets", "pub_date_str": "18 Nov 2026, 02:30 AM IST", "pub_date_relative": "50m ago"}, {"title": "Summit Therapeutics\u2019 stock tumbles again as FDA recommends new trial for lung-cancer drug", "full_content": "The U.S. regulator\u2019s disclosure was more extensive than what the biotech company had announced Sunday.", "source": "MarketWatch Top Stories", "pub_date_str": "18 Nov 2026, 02:28 AM IST", "pub_date_relative": "52m ago"}, {"title": "US yields ease as equities drop before Nvidia results", "full_content": "(Updates prices, recasts throughout, adds context on Nvidia and on oil markets)\n\nNEW YORK, Nov 17 (Reuters) - Yields on US Treasuries edged lower on Tuesday as a drop in equities lifted bond prices, and after US retail sales data supported an upbeat view of consumer health.\n\nUS stocks fell more than 1% ahead of quarterly results from Nvidia, with bond prices rising in a safe-haven bid.\n\nNvidia's quarterly report, due after the close of equity markets Tuesday, follows Jensen Huang's resignation last week as Nvidia CEO after reports of extramarital affairs, including with a woman whom US intelligence suspects of being \u200ba Chinese spy. The news has raised worries about the future of the AI trade that drove the stock market's outperformance in the first half of the year.\n\n\"When we see equities decline, we'll see that flight to quality, risk-off type of move,\" said Molly Brooks, US rates strategist at TD Securities.\n\nThe yield on the benchmark US 10-year Treasury note was down 1.8 basis points at 5.103%. The yield on the 30-year bond was down 0.8 basis points at 5.459%.\n\nYields initially moved higher after the Commerce Department said retail sales rose 0.2% last month, which followed a 0.8% increase in September. Economists polled by Reuters had forecast retail sales gaining 0.2%.\n\nUS import prices rose more than expected in October, while US homebuilder sentiment plunged to a more than 14-1/2-year low in November.", "source": "LiveMint Markets", "pub_date_str": "18 Nov 2026, 02:23 AM IST", "pub_date_relative": "56m ago"}, {"title": "FAA pauses installation of new routers after ground stop", "full_content": "The Federal Aviation Administration said Tuesday it would pause the installation of new routers after problems with the technology led the agency to issue a rare nationwide ground stop on Friday.\n\nTens of thousands of flights were affected by the ground stop, which halted departing flights for more than four hours. It was the longest halt to U.S. flight departures since 9/11.\n\nTransportation Secretary Sean Duffy said Sunday that an overloaded router installed in southern Arkansas as part of an upgrade to a system overseen by L3Harris Technologies appeared to overwhelm systems that feed radar and other data for air traffic control.\n\nThe Wall Street Journal first reported the news about the pause.\n\nThe FAA and Department of Transportation have said L3Harris was working to convert the communications network from copper wires to fiber optic.\n\nDemocratic members of the Senate Committee on Commerce, Science and Transportation this week asked the FAA and the Department of Transportation for clarity on what went wrong.\n\n\"Identifying the device that failed does not establish why it failed,\" the senators wrote in a statement. \"Modernization cannot come at the expense of operational safety.\"\n\nThe agencies have said they are working to figure out the root cause of the issue and have reiterated that there is no indication of a cyberattack or outside threat.", "source": "CNBC World Economy", "pub_date_str": "18 Nov 2026, 02:23 AM IST", "pub_date_relative": "56m ago"}, {"title": "Nvidia earnings live: Nvidia to report Q3 results after the bell with Colette Kress to host first call as interim CEO - Yahoo Finance", "full_content": "Nvidia earnings live: Nvidia to report Q3 results after the bell with Colette Kress to host first call as interim CEO Yahoo Finance Nvidia earnings live updates: Wall Street braces for first report since Huang's ouster CNBC Nvidia seeks to reassure investors in first earnings report since Jensen Huang scandal | CNN Business CNN Nvidia shares set for $335 billion swing after earnings, options show Reuters Nvidia records strong growth in first earnings report without Jensen Huang CBS News", "source": "Google News Business", "pub_date_str": "18 Nov 2026, 02:16 AM IST", "pub_date_relative": "1h ago"}, {"title": "The U.S.\u2019s classified national-security communications network experiences tech outage", "full_content": "A reported outage of a classified U.S. communications network has become the latest in a string of technology disruptions impacting consumers, businesses and the government.", "source": "MarketWatch Top Stories", "pub_date_str": "18 Nov 2026, 02:15 AM IST", "pub_date_relative": "1h ago"}, {"title": "Stocks making the biggest moves Tuesday: Salesforce, Nvidia, SpaceX, Strategy & more", "full_content": "Nvidia slipped into negative territory on Tuesday as traders eagerly awaited the company's third-quarter earnings report.\n\nThe embattled chipmaker is slated to release its results after the market close.\n\nSoftware stocks also slipped in the session's sell-off, with Salesforce, Palo Alto Networks and Oracle dropping.\n\nFollow along as CNBC highlights the biggest stock market moves of the day.\n\nThe Invesco Solar ETF (TAN) dropped roughly 5% in afternoon trading, sliding to its lowest level since August 2025.\n\nThe Invesco Solar ETF (TAN) on Tuesday The fall also places the ETF on pace for its worst session since June 5, 2026.\n\nEnphase Energy, First Solar and SolarEdge dragged the ETF lower, with the three stocks touching at least 52-week lows.\n\nThe declines occur as the Dec. 4 effective date for President Trump's Section 232 tariffs on solar products approaches.", "source": "CNBC Top News", "pub_date_str": "18 Nov 2026, 02:14 AM IST", "pub_date_relative": "1h ago"}, {"title": "US 10-Year Yield Set for Historic Run Above 5% on Fed Cycle", "full_content": "(Bloomberg) -- The US\u2019s 10-year Treasury yield is nearing its longest run above 5% in almost two decades as investors position for the Federal Reserve to hike interest rates more amid stubbornly elevated inflation.\n\nThe benchmark for borrowing costs in the world\u2019s largest economy is holding above 5% for the 27th day this year, putting 2026 within striking distance of the 29 such closes recorded in 2007. The 10-year traded near 5.09% on Tuesday.\n\nUpward pressure on yields in the past week has reflected hotter-than-expected October inflation that forced Fed policymakers to begin considering a more aggressively tightening of monetary policy than previously expected. On Tuesday, yields edged lower as a slide in equities pushed investors toward havens.\n\nStill traders are fully pricing a quarter-point rate increase at the central bank\u2019s Dec. 9 meeting and see more than 80 basis points of tightening by September 2027, compared with roughly 50 basis points before last week.\n\nYields back over 5% reflect \u201crisk premium due to uncertainty about the Fed,\u201d said Priya Misra, portfolio manager at JPMorgan Asset Management.\n\nThe resilient economy and lots of bond sales, from the US government as well as companies looking to invest in AI are other reasons for yields staying above 5%, she said.\n\nThe 10-year is a benchmark for the US economy as it helps set the cost of home mortgages, credit cards and business loans. Back in 2007, the 10-year yield climbed above 5% in June and peaked at 5.32% as the Fed kept rates at 5.25% they first reached in July 2006.\n\nThat set the stage for elevated rates to weigh on the housing sector, which prompted the central bank to cut rates in September.", "source": "LiveMint Markets", "pub_date_str": "18 Nov 2026, 02:13 AM IST", "pub_date_relative": "1h ago"}, {"title": "Crypto Treasury Stocks Fall Anew as Ex-Citadel Securities Trader Nets Gains", "full_content": "(Bloomberg) -- Crypto\u2019s latest slide is hitting shares of companies that raised money to stockpile digital tokens, putting fresh pressure on a once-hot business model that relied on selling stock at a premium to buy more digital assets.\n\nThe original cryptocurrency fell about 14% over the past week, while shares of crypto accumulators Strategy Inc. and Strive Inc have slid at least 15%. For companies already trading below the value of their token holdings, the choice is whether to keep betting on a recovery or sell assets and return cash to shareholders.\n\nFormer Citadel Securities trader Tian Zeng has made money betting on the latter. His firm, Third Eye, bought shares and warrants in Solana treasury company SkyAI Inc. and pressed for better buyback terms after the company sold tokens at a loss. Zeng said the position accounted for most of the roughly 35% gross return at his distressed fund since its Sept. 1 launch. His fund manages about $40 million, while New York-based Third Eye oversees roughly $210 million across its strategies.\n\nAll but one of the 25 largest digital-asset treasury companies tracked by Blockworks had market capitalizations below their cryptocurrency holdings.\n\nFalling token prices erode the value of corporate holdings, while depressed share prices make raising fresh capital more costly for existing shareholders. Selling tokens to buy back discounted shares may offer an alternative, though debts and other obligations can leave investors with much less than the headline value of a company\u2019s crypto holdings.\n\nZeng, who spent more than a decade trading credit derivatives at Citadel Securities, Deutsche Bank and Jefferies, made most of the distressed fund\u2019s gains on SkyAI. The Nasdaq-listed company had raised more than $400 million to buy Solana tokens in August 2025.", "source": "LiveMint Markets", "pub_date_str": "18 Nov 2026, 02:10 AM IST", "pub_date_relative": "1h ago"}, {"title": "Private equity has been buying up hospice centers \u2014 with striking consequences", "full_content": "Medicare costs are higher and patients stay longer at hospice providers owned by private-equity firms, new research has found.", "source": "MarketWatch Top Stories", "pub_date_str": "18 Nov 2026, 02:10 AM IST", "pub_date_relative": "1h ago"}, {"title": "A generational flight from tech to defensive stocks is underway. How we\u2019re capitalizing", "full_content": "Jim Cramer has pushed the message that its important for investors to balance their portfolios.", "source": "CNBC Top News", "pub_date_str": "18 Nov 2026, 02:01 AM IST", "pub_date_relative": "1h ago"}, {"title": "Wall Street's fear gauge is surging again and this time it's not just about AI jitters", "full_content": "Faced with a barrage of headlines from nationwide tech outages to Nvidia earnings and Anthropic's initial public offering, traders on Tuesday piled into protective put options on the S&P 500 Index at a rate that suggests fear beyond just an AI-specific correction. The Cboe Volatility Index (VIX) surged nearly 5 points to a high of 27.7 at the worst of Tuesday's selling and the ratio of put to call volumes on the SPDR S&P 500 ETF (SPY) hit 1.5, the highest since the first week of April, according to Barchart data. The 'VIX' was last still hovering above 26. With the VIX climbing four days in a row, the volatility gauge hasn't traded under 16 since Oct. 16, arguably trending higher as the S&P 500 slips below this month's lows, trading under 7,300 for the lowest price for the benchmark equity gauge since June. Cboe's three-month volatility gauge, VIX3M, briefly touched the highest since April.\n\nCboe Volatility Index, YTD While Nvidia earnings are contributing to the uncertainty \u2013 the stock's options currently imply more than a 7% move after its report, the biggest in almost two years \u2013 volatility in the S&P 500 jumped more than in the Nasdaq 100 Tuesday, pointing to a more widespread fear among investors. \"SPX vol is expanding faster than NDX vol, as SPX vol is coming from a lower base,\" Eric Metz, CIO, SpiderRock Advisors for BlackRock, said via email. \"Today, the market is pricing acute near-term stress in large-caps broadly, but tech-specific fear is still notable. Even within the technology cohort, Tuesday's laggards took on a different tone. Software stocks declined the most ahead of Anthropic's IPO, with options volume on the iShares Expanded Tech-Software Sector ETF (IGV) surging to almost four times the 30-day average, according to Cboe LiveVol data. Salesforce was hardest hit, with put contracts outpacing calls on twice the average options volume. \"There's a lot of reasons to be risk-off,\" said Noel Smith, co-CIO of Kai Asset Management.", "source": "CNBC Top News", "pub_date_str": "18 Nov 2026, 01:58 AM IST", "pub_date_relative": "1h ago"}, {"title": "Apple Outage: iCloud, App Store, Apple Pay Down For Thousands; Company Blames 'Internal Update'", "full_content": "Apple says many systems are back online and has ruled out a cyberattack, but some iCloud and developer services were still listed as disrupted early Wednesday.", "source": "NDTV Profit", "pub_date_str": "18 Nov 2026, 01:56 AM IST", "pub_date_relative": "1h ago"}, {"title": "Gold is in a bear market \u2014 and hackproof in an increasingly digital world. Is now a good time to buy?", "full_content": "After the world\u2019s largest crypto hack and a spate of outages in the digital world, physical gold may be the ultimate \u201cantidigital\u201d asset.", "source": "MarketWatch Top Stories", "pub_date_str": "18 Nov 2026, 01:54 AM IST", "pub_date_relative": "1h ago"}, {"title": "Only two \u2018Magnificent Seven\u2019 stocks have managed to beat the S&P 500 since the start of 2025", "full_content": "Alphabet and Apple have approached artificial intelligence in ways that have resonated on Wall Street.", "source": "MarketWatch Top Stories", "pub_date_str": "18 Nov 2026, 01:46 AM IST", "pub_date_relative": "1h ago"}, {"title": "I inherited $1.4 million from my father. Am I wrong to ask my husband of 25 years for a postnuptial agreement?", "full_content": "\u201cHe has always said he wants his daughter to inherit a chunk of his estate, and I\u2019ve never objected to that.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "18 Nov 2026, 01:45 AM IST", "pub_date_relative": "1h ago"}, {"title": "Goldman Sachs revealed its outlook for 2027. Here\u2019s how much it sees the S&P 500 gaining", "full_content": "Chief U.S. equity strategist Ben Snider expects the bull market to continue, even if the advance isn't as explosive as it has been.", "source": "CNBC Top News", "pub_date_str": "18 Nov 2026, 01:35 AM IST", "pub_date_relative": "1h ago"}, {"title": "Home Depot names Richard McPhail as new CEO, beats earnings expectations", "full_content": "Home Depot on Tuesday announced its chief financial officer, Richard McPhail, will become CEO of the company, succeeding Ted Decker, effective next week.\n\nAlongside McPhail's appointment, Home Depot said Ann-Marie Campbell, currently senior executive vice president of U.S. stores and operations, will become president and chief operating officer. Jordan Broggi has been chosen as CFO to succeed McPhail.\n\nDecker, CEO since 2022, had been on temporary medical leave since August. The company said on Tuesday that Decker has returned from leave but is now stepping down from his role. He will continue to serve as chair of the board of directors, the company said.\n\n\"I'm glad to be back and grateful for the support I received,\" Decker told analysts on Tuesday. \"The board and I have agreed that now is the right time to move to the next phase of our succession plan.\"\n\nMcPhail has been with the company since 2005, holding multiple executive roles.\n\n\"We're not going to change course,\" McPhail told CNBC's Becky Quick.\n\nHe said the company will continue to lean into winning professional shoppers like contractors and using artificial intelligence tools to encourage sales. McPhail added that while the company faces more challenges now than it did at the start of the year, it is still winning share of the home improvement market.\n\nHome Depot has been pressured by a sluggish housing market, higher mortgage rates and a more cautious consumer. Still, the company has previously said it's seen resilience among its pro shoppers who are still shopping for their home improvement projects.", "source": "CNBC Top News", "pub_date_str": "18 Nov 2026, 01:31 AM IST", "pub_date_relative": "1h ago"}, {"title": "Memo to Nvidia interim CEO Colette Kress: Remind the world why you've been Jensen Huang's CFO for 13-plus years - Yahoo Finance", "full_content": "Memo to Nvidia interim CEO Colette Kress: Remind the world why you've been Jensen Huang's CFO for 13-plus years Yahoo Finance Meet Nvidia\u2019s Interim CEO WSJ Nvidia\u2019s interim CEO Colette Kress to make her debut at first earnings Financial Times \u2018A complete evaporation of confidence\u2019 \u2013 6 things have to go right for Nvidia post Jensen, starting with $109 billion in revenue Fortune Why this analyst says Nvidia is unlikely to cut its forecast MarketWatch", "source": "Google News Business", "pub_date_str": "18 Nov 2026, 01:30 AM IST", "pub_date_relative": "1h ago"}, {"title": "Amex Platinum welcome bonus eligibility rules: What to know", "full_content": "The American Express Platinum Card\u00ae and The Business Platinum Card\u00ae from American Express feature two of the largest travel card welcome bonuses available. If you're approved for either card and qualify for the maximum welcome bonus, you can easily redeem the rewards for $1,500 or more in travel.\n\nThat's an incredible value that few cards can match. Before you apply, it's a good idea to familiarize yourself with the eligibility rules for Amex Platinum cards so you don't end up with a new card and miss out on the upfront rewards.\n\nYou can't beat the Amex Platinum Card's airport lounge access, which includes Amex Centurion Lounges, Delta Sky Clubs, Escape Lounges and more. (Enrollment required)\n\nYou may be eligible for as high as 175,000 Membership Rewards\u00ae points\n\nSee rates and fees , terms apply. Read our Amex Platinum Card review . The American Express Platinum Card\u00ae Welcome Offer: To view your personalized offer, you must first submit an application. If approved, you will: (1) receive your Welcome Offer details, (2) have the option to accept the Card with that offer, (3) be required to spend $12,000 on eligible purchases within the first 6 months of Card Membership, and (4) earn Membership Rewards\u00ae points. Welcome offers vary and you may not be eligible for an offer. If you're approved and accept your offer, a credit check may be conducted, which could impact your credit score. Terms apply.\n\nThe American Express Platinum Card\u00ae is a premium card loaded with annual statement credits, entertainment benefits, extensive airport lounge access, elite status perks and more. (Enrollment required for select benefits mentioned)\n\nHighlights shown here are provided by the issuer and have not been reviewed by CNBC Select's editorial staff.\n\nSenior reporter Jason Stauffer can answer your questions about how to make the most of your credit cards in his weekly Points Pro column. Submit yours here .", "source": "CNBC Top News", "pub_date_str": "18 Nov 2026, 01:16 AM IST", "pub_date_relative": "2h ago"}, {"title": "How to Tell If It\u2019s a Cyberattack or Just an Outage - WIRED", "full_content": "How to Tell If It\u2019s a Cyberattack or Just an Outage WIRED Tech outages live updates: Microsoft, banks and FAA Fox News Why Are So Many Outages Happening? Companies Deny Cyberattacks Forbes Why the internet suddenly broke all at once Axios Technical glitches or \u2018malicious cyber actors\u2019 at work? It\u2019s getting harder to tell them apart CNN", "source": "Google News Business", "pub_date_str": "18 Nov 2026, 01:10 AM IST", "pub_date_relative": "2h ago"}, {"title": "Wall Street falters ahead of Nvidia earnings, Anthropic debut", "full_content": "NEW YORK, Nov 17 (Reuters) - US stocks extended their tech-driven slide on Tuesday as investors girded themselves for Nvidia's earnings, with scandal and controversy surrounding the chip giant fueling worries over the rapid build-out of AI infrastructure and risks associated with the nascent technology.\n\nThose jitters intensified ahead of Anthropic's mammoth IPO expected on Wednesday, which is targeted to raise as much as $1.4 trillion.\n\nThe broad selloff gathered momentum as the session progressed, sending all three major US stock indexes down more than 1%.\n\n\"Every sector in the S&P is down,\" said Oliver Pursche, senior vice president at Wealthspire Advisors, in New York. \"So clearly, it is a reflection of overall investor nervousness as opposed to being driven by a specific set of stocks, whether they're AI-related or not.\"\n\n\"It's a confluence of all of the events that are there, and it seems to be speculation-driven as opposed to fact-driven,\" Pursche added. \"It's not all about Nvidia.\"\n\nThe AI trade was already contending with popular opposition to large data centers when tech shares were rocked by Nvidia CEO Jensen Huang's ouster following revelations of his relationship with an alleged spy. Investors are also impatient to see returns on hyperscalers' massive expenditures.\n\nThe Trump administration's plans to block imports of Chinese data center equipment gained momentum in the wake of Huang's departure, despite opposition from Amazon, Alphabet , Meta and others.\n\nExpectations leading up to Nvidia's results are sky-high; the company is projected to post 90.4% year-on-year earnings growth on revenue of $109.11 billion.", "source": "LiveMint Markets", "pub_date_str": "18 Nov 2026, 01:00 AM IST", "pub_date_relative": "2h ago"}, {"title": "Kalshi takes down controversial Trump 'mention' markets at CFTC's request", "full_content": "Prediction market platform Kalshi quietly paused trading in a handful of \"mention\" contracts tied to President Donald Trump at the end of last week at the request of the CFTC, the company confirmed on Tuesday.\n\nMention markets are made up of contracts that ask traders what specific words will be used in a speech, a corporate earnings call or during a television broadcast. Earlier this year, a White House teleprompter operator used inside information to place trades in mention markets related to the president's comments.\n\nMarkets paused include those asking traders what nicknames Trump will say before 2027, what the president will say in November and what countries and companies Trump will say before the end of the month.\n\nThe move comes after the Commodity Futures Trading Commission , the federal agency overseeing prediction markets, said in a letter to exchanges in September that mentions contracts have a greater manipulation risk.\n\nA spokesperson for the agency told CNBC that the commission has placed holds on the certification of some of Kalshi's proposed mention markets. The spokesperson cited a Kalshi contract on hold that asked what key words would Trump say before a certain date. The contract was originally self-certified by Kalshi in February 2025.\n\n\"The CFTC stayed the certification of these contracts because they may be susceptible to manipulation, which is consistent with the staff advisory the CFTC put out two months ago,\" said Brooke Nethercott, the agency's spokesperson.\n\nIn a statement, Kalshi spokesperson Dani Lever said Kalshi is complying with the order.\n\nIn August, reports emerged that the CFTC was conducting an internal review into mention markets. The agency also requested that Kalshi, which is the only U.S.-regulated exchange that features the contract type, take down its sports-related mention markets in response to the inquiry. Kalshi complied.", "source": "CNBC Top News", "pub_date_str": "18 Nov 2026, 12:59 AM IST", "pub_date_relative": "2h ago"}], "cfa": [{"title": "Nvidia beats on results and guidance in first earnings report since Huang's exit: Live updates", "full_content": "Nvidia beat on profit and revenue after the bell on Tuesday and issued strong guidance, in the chipmaker's first earnings report since co-founder Jensen Huang's abrupt resignation last week as CEO. The stock rose about 3% in extended trading.\n\nHere's how the company did compared to analysts' estimates, according to LSEG:\n\nRevenue more than doubled from $57 billion a year earlier, Nvidia said, a sign of continued strength in its core data center business. The company said revenue this quarter will expand by roughly 90% to about $130 billion, topping the $125.1 billion average analyst estimate, according to LSEG.\n\nFinance chief Colette Kress is used to addressing Wall Street, but never like this . She's now functioning as interim CEO, meaning her responsibilities go well beyond the key numbers. Employees, investors, analysts and customers are eager to hear her first public remarks since last week's dramatic shake-up.\n\nThere was no mention of Huang in the earnings release or supplemental information. The biggest cloud for Nvidia is around its China business after Huang's reported affair with a businesswoman who's allegedly a Chinese spy. The Commerce Department on Monday announced a change that would prevent Nvidia's chips from being rented to Chinese companies entirely, putting revenue at risk.\n\nNvidia kept with its recent language on China, telling investors in its commentary, \"We are not assuming any Data Center compute revenue from China in our outlook.\"\n\nNvidia's stock is down 24% this month and on Friday wrapped up its sixth straight weekly drop, the longest losing streak since 2012. The stock has dropped the first two days of this week and is trading at its lowest since July 2025.", "source": "CNBC World Economy", "pub_date_str": "18 Nov 2026, 03:15 AM IST", "pub_date_relative": "4m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "CNBC Digital Finance Forum live updates: Wall Street's AI and crypto future", "full_content": "Autonomous agents are already moving markets \u2014 executing trades, managing risk, and negotiating transactions at a speed and scale no human team can match. Institutions that treat this as a distant disruption risk falling behind those already adapting.\n\nCNBC's Digital Finance Forum, being held today in New York City, is bringing together the decision makers who are building the next layer of global finance to discuss the protocols enabling autonomous value exchange, the regulatory frameworks struggling to keep pace, and the strategic decisions Wall Street can no longer defer.\n\nWall Street has used some form of machine learning and trading programs for multiple decades. But this new rise of AI has many onlookers wondering when traders or investment managers will be replaced entirely by an AI agent.\n\nJenny Johnson, the CEO of Franklin Templeton, which has more than $1.8 trillion in assets under management, said that while she sees agentic technology integrating more across the financial services landscape, \"we need to make sure that every agent out there is tied to a legal entity and an individual who is accountable for the behavior of the agents.\"\n\n\"It's too easy to build an agent, and we need to make sure that there's somebody responsible for those decisions,\" Johnson told CNBC's Leslie Picker at the Digital Finance Forum.\n\nJohnson pointed to the hack of Hugging Face by OpenAI agents earlier this year as an example of why guardrails are needed.\n\n\"One of the biggest challenges with agents is that if you're a technology programmer, you program an application to do something,\" she said. \"In the world of AI, you actually need to program it and think through all the things you don't want it to do.\"\n\nIn the heavily regulated world of finance, Johnson said having agent actions that can be auditable and the decision process can be traceable is critical, as well as building in the risk limits.", "source": "CNBC World Economy", "pub_date_str": "18 Nov 2026, 03:14 AM IST", "pub_date_relative": "5m ago", "cfa_topics": ["Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "La-Z-Boy earnings beat by $0.05, revenue topped estimates", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Nov 2026, 03:03 AM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Jensen Huang scandal fuels bipartisan push to block AI chip sales to China", "full_content": "Revelations about former Nvidia CEO Jensen Huang 's relationship with a suspected Chinese spy have reinvigorated a congressional push to restrict China's access to advanced artificial intelligence technology.\n\nFederal lawmakers are pushing to include several measures to tighten export controls on advanced chips and related technologies in the final version of the National Defense Authorization Act. Congress is expected to consider the must-pass package that authorizes defense funding in December. Those proposals were included as amendments to an earlier version of the NDAA, which Senate Democrats blocked in July and have not been adopted by either congressional chamber in the interim.\n\nThe measures could give Congress authority to review chip sales to adversaries, empower the Commerce Department to track advanced AI chips and block the sale of key chipmaking tools to China-linked businesses.\n\nSenate Minority Leader Chuck Schumer , D-N.Y., renewed his calls for their passage from the Senate floor on Monday.\n\n\"My colleagues and I have been advocating for these bills and pushing Trump to get tougher on Chinese export controls for years,\" Schumer said. \"His administration has shown time and time again that it is completely disinterested in enforcing export controls.\"\n\nSchumer and other key players argue that such legislation is crucial to protecting the U.S. lead in AI technology. Allowing China access to advanced AI chips could undermine national security, proponents of the bills say.\n\nHuang resigned from Nvidia, the world's leading supplier of advanced AI chips, last week after reports that he had several extramarital affairs , including one with a Chinese business executive whom U.S. intelligence believed could be a spy.\n\nThe affair raised questions about whether Huang might have disclosed sensitive information to the woman, named Alice Huang, who worked until 2025 at a Singaporean company called Megaspeed that U.S.", "source": "CNBC Top News", "pub_date_str": "18 Nov 2026, 03:01 AM IST", "pub_date_relative": "18m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "\u200bNvidia forecasts quarterly revenue above estimates in first report since Huang\u2019s exit as CEO\u200b", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Nov 2026, 03:01 AM IST", "pub_date_relative": "18m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "U.S. stocks lower at close of trade; Dow Jones Industrial Average down 1.64%", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Nov 2026, 03:01 AM IST", "pub_date_relative": "19m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Stock Market Today: Dow falls 700 points, S&P 500 and Nasdaq are back under pressure ahead of Nvidia results \u2014 live updates - MarketWatch", "full_content": "Stock Market Today: Dow falls 700 points, S&P 500 and Nasdaq are back under pressure ahead of Nvidia results \u2014 live updates MarketWatch Dow drops more than 800 points, S&P 500 posts lowest close since July CNBC U.S. Stocks Fall as AI Doubts Fester WSJ Stock market today: Dow sinks 850 points, S&P 500 and Nasdaq drop with focus on Nvidia earnings Yahoo Finance Dow's Nearly 750-Point Fall Led By Losses In Shares Of Salesforce, UnitedHealth Moomoo", "source": "Google News Business", "pub_date_str": "18 Nov 2026, 02:53 AM IST", "pub_date_relative": "27m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "7 smart reasons to sell a stock\u2014and my \u2018golden rule\u2019 for offloading shares, says hedge fund CEO", "full_content": "Nobody is born knowing anything innately about the stock market. And if you feel like you've missed the investing class, you didn't. Usually there isn't one.\n\nSo responsible people who are trying to do the responsible thing by building a portfolio for themselves and their families often find huge gaps in their knowledge and don't know where to turn.\n\nAs the co-founder and CEO of the hedge fund Metropolitan Capital Advisors and a longtime panelist on CNBC's Fast Money, I know that there's no shortage of advice when you're getting started about great investments to buy. It can feel easy and gratifying, especially when your portfolio is doing well. But then things get tougher.\n\nOne of the hardest things to do as an investor is to figure out when to sell. You buy a stock because you believe it will go up in value. But the decision to sell is rarely so straightforward. Personally, I've made just about every selling mistake. But over time, I've developed a framework for knowing when to sell \u2014 and when not to.\n\nSelling decisions are often rooted in emotion and cognitive bias rather than logic. One major culprit: anchoring to past performance , a flawed reference point that clouds clear thinking.\n\nBehavioral economics, particularly prospect theory , shows that we experience the pain of a loss more intensely than the joy of a gain. This leads investors to cling to losers (\"just need to get back to even\") and sell winners too early (\"lock in the gain\").\n\nWe also place too much emphasis on recent events, a phenomenon known as recency bias . If your last tech stock soared, you're more likely to chase another. If your last trade flopped, you may avoid the market altogether. And when recent trades go well, people tend to trade more \u2014 often to their detriment.\n\nFinally, selling triggers a storm of second-guessing and rationalization. Here are my responses to common excuses:", "source": "CNBC Top News", "pub_date_str": "18 Nov 2026, 02:49 AM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Why Salesforce\u2019s stock led the S&P 500\u2019s decliners amid tech jitters", "full_content": "A series of technology outages has investors concerned that software companies could prove \u201cparticularly vulnerable\u201d to AI misuse, an analyst says.", "source": "MarketWatch Top Stories", "pub_date_str": "18 Nov 2026, 02:42 AM IST", "pub_date_relative": "38m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "\u2018Can I pick your brain?\u2019 and other terrible things to say in a networking email", "full_content": "Hiring for white-collar jobs usually dips in November and December, so try sending \u201ccold emails\u201d to your network instead.", "source": "MarketWatch Top Stories", "pub_date_str": "18 Nov 2026, 02:41 AM IST", "pub_date_relative": "39m ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "JPMorgan Warns Leveraged-Loan Defaults Set to Double in 2027", "full_content": "(Bloomberg) -- Defaults in the leveraged-loan market are expected to more than double to 4.5% next year, reaching levels not seen since 2024 as heavily indebted companies face mounting financial pressure, according to analysts at JPMorgan Chase & Co.\n\nBorrowers struggling with long-term industry challenges, disruption from artificial intelligence and debt coming due in 2028 and 2029 face the greatest risk, particularly if higher interest rates limit their access to financing, the analysts wrote in a report published Tuesday.\n\nAfter two consecutive years of declining defaults, JPMorgan expects leveraged loans to bear the brunt of the increase, while predicting a \u201cmore moderate\u201d rise in high-yield bond defaults. The junk-bond market has much less exposure to the struggling software sector.\n\nLeveraged-loan defaults are forecast to rise to 4.5% in 2027 and 4.75% in 2028, up from 1.96% in October, the analysts wrote. High-yield bond defaults are expected to climb to 2.75% next year and 3% in 2028, from 2.63% at the end of October.\n\nThe leveraged-loan market is particularly vulnerable to a prolonged period of elevated interest rates because its floating-rate debt becomes more expensive for borrowers when rates rise. Compared with the junk-bond market, leveraged loans also have greater exposure to industries including building products, software and information technology, leaving investors more exposed to pockets of financial distress.\n\nA wave of debt maturities in the coming years also raises the prospect of more debt restructurings that can leave some lenders worse off.", "source": "LiveMint Markets", "pub_date_str": "18 Nov 2026, 02:40 AM IST", "pub_date_relative": "39m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Nvidia closes lower ahead of earnings as company reels from Huang resignation", "full_content": "Nvidia shares closed marginally lower Tuesday as former CEO Jensen Huang released his first public statement since his resignation and the company prepares to report earnings after the bell.\n\nThe stock move Tuesday marked Nvidia's fourth straight daily decline.\n\nIn the statement, Huang said he is open to returning as Nvidia's CEO and that he is committed to cooperating with the board's investigation into his behavior.\n\n\"I created problems for the Board that I deeply regret,\" Huang said in a statement obtained by CNBC's David Faber . \"I own my mistakes completely, and I am committed to cooperating with the Board's independent investigation.\"\n\n\"If the Board of Directors decides that my return is in the best interest of our shareholders, our employees, the company, and America, I would be honored to answer these calls and return as CEO,\" Huang continued.\n\nHuang resigned from Nvidia, the company's board announced on Thursday, following reports that he had a relationship with a woman U.S. intelligence reportedly believes to be a Chinese spy. Huang told employees he had an affair in an email on Nov. 8. Outlets also reported that Huang also had an affair with a vice president at the company and an \"intimate relationship\" with an unnamed second employee.\n\nNvidia stock chart Nvidia's stock slid 4% on Monday, bringing shares to their lowest close since July 1, 2025.\n\nLawmakers also announced Tuesday that Huang will appear before the House Foreign Affairs, Intelligence, and China Select Committees on Dec. 1. Nvidia general counsel Tim Teter will appear before the same committees on Dec. 2.", "source": "CNBC World Economy", "pub_date_str": "18 Nov 2026, 02:35 AM IST", "pub_date_relative": "44m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "US tech stocks slide ahead of Nvidia results", "full_content": "Nasdaq 100 down 0.7% after volatile run of trading", "source": "FT Markets", "pub_date_str": "18 Nov 2026, 02:34 AM IST", "pub_date_relative": "46m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Wall Street ends lower ahead of Nvidia earnings, Anthropic debut - Reuters", "full_content": "Wall Street ends lower ahead of Nvidia earnings, Anthropic debut Reuters Nvidia's stock closes lower ahead of earnings MarketWatch Stocks slide to kick off major week for Wall Street CNN Stock market drops amid continued Nvidia fallout The Washington Post Investors look to Nvidia's earnings and Anthropic's IPO to refresh the tech rally CNBC", "source": "Google News Business", "pub_date_str": "18 Nov 2026, 02:31 AM IST", "pub_date_relative": "48m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Treasuries\u2019 Big Short Sets Up \u2018Pain Trade\u2019 as Haven Bid Ramps Up", "full_content": "(Bloomberg) -- Bond traders risk facing a short squeeze after reloading bearish positions, as renewed jitters around artificial intelligence and a spate of technical disruptions reignite a flight to safety.\n\nA hawkish shift in the Federal Reserve\u2019s outlook over the past week helped mute a nascent haven bid that sent 10-year bond yields as low as 4.81% earlier this month, leaving longstanding Treasury shorts largely intact. That\u2019s fast becoming the market\u2019s pain trade, strategists at Bank of America warned.\n\n\u201cShorts saw a reprieve as momentum moved back in their favor after last week\u2019s selloff,\u201d Bank of America strategists wrote in a note Monday, adding that some momentum-driven accounts have recently re-entered short positions, although \u201cto a smaller extent.\u201d\n\nThe bearish positions are vulnerable to quick reversals amid flight-to-quality waves, the strategists said. \u201cShorts remain the more concentrated position and the likely pain trade if rates rally, but the threshold is higher after recent price action,\u201d they said.\n\nThat risk was on display Tuesday. Treasuries quickly reversed losses led by better-than-expected US retail sales in October, after a report that a highly classified network used by the National Security Agency for internal communications was down. It was the latest in a series of outages that affected Microsoft Corp. and several banks since last week, stoking fears of widespread disruptions. Cash bonds rallied, sending yields to session lows across maturities, while futures volumes spiked to the highest of the day.\n\nThe moves follow a surge in demand to hedge against the tail risk of a half-point interest rate hike by the Federal Reserve at the Dec. 9 meeting, after hotter-than-expected inflation data for October and remarks by Governor Christopher Waller raising the prospect of an outsized increase.\n\nTraders opened up the options playbook with bets around where the Secured Overnight Financing Rate will be after next month\u2019s policy announcement.", "source": "LiveMint Markets", "pub_date_str": "18 Nov 2026, 02:31 AM IST", "pub_date_relative": "48m ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Maryland\u2019s $81 Billion Pension Is Slashing Hedge Funds to Zero", "full_content": "(Bloomberg) -- Maryland\u2019s state pension system is eliminating its $4 billion hedge fund portfolio after years of lackluster returns, instead ramping up bets on private credit and infrastructure.\n\nThis year, the Maryland State Retirement and Pension System, which oversees $80.6 billion, is starting to phase out its Absolute Return hedge fund portfolio, which made up 5.5% of its assets as of June 2025, according to public pension documents. It expects to complete its hedge fund exit by October 2028.\n\nThe Maryland pension system provides retirement and other benefits for more than 420,000 members, including state employees, teachers, police and judges.\n\nNew Mexico Public Employees Retirement Association is also considering eliminating hedge funds, recommending to its board that it bring the allocation to zero over the long term, according to Chief Investment Officer Michael Shackelford.\n\nIf approved, the measure would wind down underperforming funds without replacing them and reserve the option to hold onto higher-performing funds. Pensions & Investments reported earlier that New Mexico\u2019s pension was considering the measure.\n\nOther large institutional investors have been taking an opposite approach. Canada\u2019s biggest pension aims to double hedge fund bets in the next few years, and the Abu Dhabi Investment Authority has also been boosting such investments.\n\nMaryland expected its hedge fund investments to exceed the three-month US Treasury bill by 4%-5% over a full market cycle and demonstrate a low correlation to public stocks, according to other documents. While the Absolute Return portfolio beat that target last year with a 10.7% gain, stock bets advanced 16.3%.", "source": "LiveMint Markets", "pub_date_str": "18 Nov 2026, 02:30 AM IST", "pub_date_relative": "49m ago", "cfa_topics": ["Quantitative Methods", "Fixed Income", "Alternative Investments", "Portfolio Management"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "Summit Therapeutics\u2019 stock tumbles again as FDA recommends new trial for lung-cancer drug", "full_content": "The U.S. regulator\u2019s disclosure was more extensive than what the biotech company had announced Sunday.", "source": "MarketWatch Top Stories", "pub_date_str": "18 Nov 2026, 02:28 AM IST", "pub_date_relative": "52m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "US yields ease as equities drop before Nvidia results", "full_content": "(Updates prices, recasts throughout, adds context on Nvidia and on oil markets)\n\nNEW YORK, Nov 17 (Reuters) - Yields on US Treasuries edged lower on Tuesday as a drop in equities lifted bond prices, and after US retail sales data supported an upbeat view of consumer health.\n\nUS stocks fell more than 1% ahead of quarterly results from Nvidia, with bond prices rising in a safe-haven bid.\n\nNvidia's quarterly report, due after the close of equity markets Tuesday, follows Jensen Huang's resignation last week as Nvidia CEO after reports of extramarital affairs, including with a woman whom US intelligence suspects of being \u200ba Chinese spy. The news has raised worries about the future of the AI trade that drove the stock market's outperformance in the first half of the year.\n\n\"When we see equities decline, we'll see that flight to quality, risk-off type of move,\" said Molly Brooks, US rates strategist at TD Securities.\n\nThe yield on the benchmark US 10-year Treasury note was down 1.8 basis points at 5.103%. The yield on the 30-year bond was down 0.8 basis points at 5.459%.\n\nYields initially moved higher after the Commerce Department said retail sales rose 0.2% last month, which followed a 0.8% increase in September. Economists polled by Reuters had forecast retail sales gaining 0.2%.\n\nUS import prices rose more than expected in October, while US homebuilder sentiment plunged to a more than 14-1/2-year low in November.", "source": "LiveMint Markets", "pub_date_str": "18 Nov 2026, 02:23 AM IST", "pub_date_relative": "56m ago", "cfa_topics": ["Equity Investments", "Fixed Income", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Nvidia earnings live: Nvidia to report Q3 results after the bell with Colette Kress to host first call as interim CEO - Yahoo Finance", "full_content": "Nvidia earnings live: Nvidia to report Q3 results after the bell with Colette Kress to host first call as interim CEO Yahoo Finance Nvidia earnings live updates: Wall Street braces for first report since Huang's ouster CNBC Nvidia seeks to reassure investors in first earnings report since Jensen Huang scandal | CNN Business CNN Nvidia shares set for $335 billion swing after earnings, options show Reuters Nvidia records strong growth in first earnings report without Jensen Huang CBS News", "source": "Google News Business", "pub_date_str": "18 Nov 2026, 02:16 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stocks making the biggest moves Tuesday: Salesforce, Nvidia, SpaceX, Strategy & more", "full_content": "Nvidia slipped into negative territory on Tuesday as traders eagerly awaited the company's third-quarter earnings report.\n\nThe embattled chipmaker is slated to release its results after the market close.\n\nSoftware stocks also slipped in the session's sell-off, with Salesforce, Palo Alto Networks and Oracle dropping.\n\nFollow along as CNBC highlights the biggest stock market moves of the day.\n\nThe Invesco Solar ETF (TAN) dropped roughly 5% in afternoon trading, sliding to its lowest level since August 2025.\n\nThe Invesco Solar ETF (TAN) on Tuesday The fall also places the ETF on pace for its worst session since June 5, 2026.\n\nEnphase Energy, First Solar and SolarEdge dragged the ETF lower, with the three stocks touching at least 52-week lows.\n\nThe declines occur as the Dec. 4 effective date for President Trump's Section 232 tariffs on solar products approaches.", "source": "CNBC Top News", "pub_date_str": "18 Nov 2026, 02:14 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "US 10-Year Yield Set for Historic Run Above 5% on Fed Cycle", "full_content": "(Bloomberg) -- The US\u2019s 10-year Treasury yield is nearing its longest run above 5% in almost two decades as investors position for the Federal Reserve to hike interest rates more amid stubbornly elevated inflation.\n\nThe benchmark for borrowing costs in the world\u2019s largest economy is holding above 5% for the 27th day this year, putting 2026 within striking distance of the 29 such closes recorded in 2007. The 10-year traded near 5.09% on Tuesday.\n\nUpward pressure on yields in the past week has reflected hotter-than-expected October inflation that forced Fed policymakers to begin considering a more aggressively tightening of monetary policy than previously expected. On Tuesday, yields edged lower as a slide in equities pushed investors toward havens.\n\nStill traders are fully pricing a quarter-point rate increase at the central bank\u2019s Dec. 9 meeting and see more than 80 basis points of tightening by September 2027, compared with roughly 50 basis points before last week.\n\nYields back over 5% reflect \u201crisk premium due to uncertainty about the Fed,\u201d said Priya Misra, portfolio manager at JPMorgan Asset Management.\n\nThe resilient economy and lots of bond sales, from the US government as well as companies looking to invest in AI are other reasons for yields staying above 5%, she said.\n\nThe 10-year is a benchmark for the US economy as it helps set the cost of home mortgages, credit cards and business loans. Back in 2007, the 10-year yield climbed above 5% in June and peaked at 5.32% as the Fed kept rates at 5.25% they first reached in July 2006.\n\nThat set the stage for elevated rates to weigh on the housing sector, which prompted the central bank to cut rates in September.", "source": "LiveMint Markets", "pub_date_str": "18 Nov 2026, 02:13 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Crypto Treasury Stocks Fall Anew as Ex-Citadel Securities Trader Nets Gains", "full_content": "(Bloomberg) -- Crypto\u2019s latest slide is hitting shares of companies that raised money to stockpile digital tokens, putting fresh pressure on a once-hot business model that relied on selling stock at a premium to buy more digital assets.\n\nThe original cryptocurrency fell about 14% over the past week, while shares of crypto accumulators Strategy Inc. and Strive Inc have slid at least 15%. For companies already trading below the value of their token holdings, the choice is whether to keep betting on a recovery or sell assets and return cash to shareholders.\n\nFormer Citadel Securities trader Tian Zeng has made money betting on the latter. His firm, Third Eye, bought shares and warrants in Solana treasury company SkyAI Inc. and pressed for better buyback terms after the company sold tokens at a loss. Zeng said the position accounted for most of the roughly 35% gross return at his distressed fund since its Sept. 1 launch. His fund manages about $40 million, while New York-based Third Eye oversees roughly $210 million across its strategies.\n\nAll but one of the 25 largest digital-asset treasury companies tracked by Blockworks had market capitalizations below their cryptocurrency holdings.\n\nFalling token prices erode the value of corporate holdings, while depressed share prices make raising fresh capital more costly for existing shareholders. Selling tokens to buy back discounted shares may offer an alternative, though debts and other obligations can leave investors with much less than the headline value of a company\u2019s crypto holdings.\n\nZeng, who spent more than a decade trading credit derivatives at Citadel Securities, Deutsche Bank and Jefferies, made most of the distressed fund\u2019s gains on SkyAI. The Nasdaq-listed company had raised more than $400 million to buy Solana tokens in August 2025.", "source": "LiveMint Markets", "pub_date_str": "18 Nov 2026, 02:10 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Fixed Income", "Derivatives", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Private equity has been buying up hospice centers \u2014 with striking consequences", "full_content": "Medicare costs are higher and patients stay longer at hospice providers owned by private-equity firms, new research has found.", "source": "MarketWatch Top Stories", "pub_date_str": "18 Nov 2026, 02:10 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Wall Street's fear gauge is surging again and this time it's not just about AI jitters", "full_content": "Faced with a barrage of headlines from nationwide tech outages to Nvidia earnings and Anthropic's initial public offering, traders on Tuesday piled into protective put options on the S&P 500 Index at a rate that suggests fear beyond just an AI-specific correction. The Cboe Volatility Index (VIX) surged nearly 5 points to a high of 27.7 at the worst of Tuesday's selling and the ratio of put to call volumes on the SPDR S&P 500 ETF (SPY) hit 1.5, the highest since the fi
