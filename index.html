<script>
    // This variable will be injected during the build process
    const allData = {"general": [{"title": "Anthropic secures $3.4 billion generator deal for AI data centers, FT reports", "full_content": "Anthropic has struck a deal worth about $3.4 billion to secure gas-fired power generators for data centers, the Financial Times reported on Sunday.\n\nThe AI startup bought commitments for 1.7 gigawatts of heavy-duty generators in late September from OnePWR Solutions, a San Antonio, Texas-based equipment supplier, the report said.\n\nAnthropic did not acquire OnePWR itself, and none of the supplier's employees transferred to the AI startup, but the deal included engineering and construction capabilities needed to install the generators, the report added, citing a person familiar with the matter.\n\nReuters could not immediately verify the report and Anthropic and OnePWR did not respond to requests for comment.\n\nStrong demand for Anthropic's Claude family of AI models has prompted the company to secure additional \u200bcomputing and power capacity. Reuters reported in September that Anthropic expects to spend more than $500 billion over the next 10 years building AI infrastructure.", "source": "CNBC Top News", "pub_date_str": "08 Nov 2026, 07:53 PM IST", "pub_date_relative": "1m ago"}, {"title": "Trump targets Slotkin in call for DOJ probe of alleged Democratic threats to Republicans", "full_content": "President Donald Trump said Saturday that he was ordering the Justice Department to investigate Democratic leaders over what he described as threats against Republican officials, donors and supporters, without identifying the alleged communications or providing evidence of criminal conduct.\n\n\"The Democrats are going around threatening a lot of people, including the Attorney General of the United States, and others, with Impeachment and many other forms of punishment, even though they admit they have no reason to do so,\" Trump said in a Truth Social post .\n\nThe alleged threats, the president said, are \"extortion at the highest level,\" he wrote. \"I am ordering the Department of Justice to look into this criminal act, immediately!\"\n\nIn his post, Trump claimed that Democratic Sen. Elissa Slotkin of Michigan is planning to \"go after all young people that believe in Republican Values.\"\n\nTrump was apparently referencing a speech Slotkin made at a University of Chicago event on Oct. 13. At the time, Slotkin said: \"I want young people coming out of school to say, 'Should I go work for the Trump administration?'...I want them to be like, 'Lord, that might be buying myself a ton of problems that I don't want. And so let me avoid participating in that.' I want that deterrence message sent.\"\n\nSlotkin alleges that she, her family and her staff faced physical and legal intimidation after the posting of a November 2025 video in which Slotkin and other Democratic leaders called on the U.S. military to \"refuse illegal orders\" following the airstrikes targeting boats in the Caribbean.\n\nOn Nov. 20, Trump called the video treason and said \"an example must be set.\"\n\nThe FBI contacted lawmakers, including Slotkin, days later. In February, Slotkin declined to sit for an interview the Justice Department requested about the video.", "source": "CNBC Top News", "pub_date_str": "08 Nov 2026, 07:45 PM IST", "pub_date_relative": "9m ago"}, {"title": "Recent AI agent experiments reveal a risky future of machine 'teamwork' inside corporations", "full_content": "AI agents have been caught circumventing restrictions, communicating through unauthorized channels and pursuing goals in ways their creators did not intend. The most high-profile example emerged last summer when OpenAI disclosed that its models found ways to communicate through improvised channels, bypass internet restrictions and hack into an outside system , Hugging Face.\n\nAI behaving in unexpected ways is nothing new, but the unexpected behavior that can emerge from interactions among authorized AI agents within a corporate enterprise is a broader question that could become central to the future of work.\n\nIn its analysis of the Hugging Face attack , METR and Redwood Research found that roughly 1200 agents meant to be isolated from one another found a way to communicate with one another on an unsanctioned message board, sending over 70,000 messages and files during the investigation period. One agent, PHASEONE[big], emerged as a coordinator, assigning hundreds of tasks to other agents, which in turn delegated work to others. The agents developed their own conventions for assigning ownership, placing work on hold and vetoing actions, although coordination sometimes broke down into conflicts. In some cases, the researchers found, success was achieved because some agents risked failing at their own task to generate information for the \"collective.\"\n\nThe researchers also found that once the message board identified a way to attack Hugging Face, over 90% of the 533 agents active at that time quickly joined in the attack. \"Agents realized this activity was out of scope and unethical but joined because they believed that helping the board's cheating research would be broadly useful and had a general inclination to help their 'peers.' The researchers added that ethical concerns posed by agents \"rarely limited their behavior.\"\n\nCompanies are increasingly exploring systems that divide complex tasks among specialized agents.", "source": "CNBC World Economy", "pub_date_str": "08 Nov 2026, 07:44 PM IST", "pub_date_relative": "10m ago"}, {"title": "\u2018We\u2019re losing to cottage cheese\u2019: The protein-maxxing craze is hurting cream-cheese sales", "full_content": "U.S. cottage-cheese sales have more than doubled from levels seen in 2021.", "source": "MarketWatch Top Stories", "pub_date_str": "08 Nov 2026, 07:43 PM IST", "pub_date_relative": "11m ago"}, {"title": "Received a Diwali bonus or voucher from your employer? Know the tax exemption limit and rules for salaried employees", "full_content": "Diwali gifts and bonuses from employers can provide salaried employees with some extra spending money during the festive season. However, not every festive benefit enjoys the same tax treatment. While qualifying gifts and vouchers worth less than \u20b9 15,000 in aggregate during the tax year can be tax-free, a cash bonus is generally taxable as salary from the first rupee.\n\nThe distinction is important for employees, particularly those earning close to the \u20b9 12 lakh taxable-income threshold under the new tax regime. A festive bonus could push their income above the rebate limit and increase their tax liability.\n\nThe Income-tax Act, 2025, and the Income-tax Rules, 2026, which came into effect on 1 April 2026, have increased the exemption for qualifying employer gifts from \u20b9 5,000 to less than \u20b9 15,000. Here is how the rules apply to different types of festive benefits.\n\nUnder Rule 15 of the Income-tax Rules, 2026, the value of gifts, vouchers and tokens received from an employer is treated as nil if their aggregate value remains below \u20b9 15,000 during the tax year.\n\nThe exemption applies to gifts received by employees or members of their household on ceremonial occasions or otherwise. It can cover physical gifts, festive hampers and qualifying shopping vouchers.\n\nFor example, if an employee receives a Diwali hamper worth \u20b9 8,000 and another gift worth \u20b9 5,000 from the employer during the same tax year, the aggregate value of \u20b9 13,000 remains tax-free.\n\nHowever, if the aggregate value reaches \u20b9 15,000, the entire value becomes taxable as a perquisite, not merely the amount exceeding the exemption threshold. The limit is annual, not applicable separately to every festival or occasion.\n\nA cash bonus paid by an employer as additional remuneration is treated differently from a qualifying gift or voucher.", "source": "LiveMint Money", "pub_date_str": "08 Nov 2026, 07:41 PM IST", "pub_date_relative": "13m ago"}, {"title": "Ramayana Box Office Collection Day 4: Nitesh Tiwari Film Crosses Rs 200 Crore In India", "full_content": "The first instalment released on November 5, 2026, in Hindi, Tamil, Telugu, Malayalam and Kannada.", "source": "NDTV Profit", "pub_date_str": "08 Nov 2026, 07:41 PM IST", "pub_date_relative": "13m ago"}, {"title": "As tech swoon roils market, US inflation data on tap", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Nov 2026, 07:30 PM IST", "pub_date_relative": "24m ago"}, {"title": "Poppi founders are going after PepsiCo's Gatorade with new beverage startup Jetty", "full_content": "After disrupting the soda category with Poppi, founders Allison and Stephen Ellsworth are now taking aim at hydration with their new brand, Jetty.\n\nStarting Monday, Jetty drinks and ready-to-mix electrolyte packets will be on shelves at Whole Foods grocery stores and available online at Target and Amazon .\n\nThe new, self-funded venture directly pits the Ellsworths against PepsiCo , which bought Poppi for $1.95 billion in 2025. Pepsi owns Gatorade, which dominates the U.S. sports drink category with about 60% market share, according to Numerator data.\n\nPoppi shook up the soda category with prebiotic fiber, low calorie and sugar counts and its fun marketing aimed at Generation Z and millennials. Jetty looks to upend the hydration category through a similar strategy. To do so, it will face off not only against Gatorade but also a swarm of other upstarts looking to get in on the electrolyte-fueled trend.\n\nFor decades, Gatorade and other sports drinks have pitched their products to athletes who need electrolytes and fluids after an intense workout, although many consumers drink them every day without even sweating. Jetty is aimed at people who need a hydration boost, but not the same level of electrolytes or sugar as a traditional sports drink.\n\n\"No one has really created a product for just everyday hydration \u2014 literally everyday hydration for normal people,\" Allison Ellsworth, Jetty's chief brand officer, told CNBC. \"Like I woke up this morning, I didn't run a marathon.\"\n\nFollowing Poppi's sale to PepsiCo, Ellsworth stayed on as an advisor to the brand, although she said she is no longer involved in the day-to-day operations.\n\nAfter 10 years building Poppi, Ellsworth said, she finally had free time. As Ellsworth tells it, she went to the doctor for the first time in a decade. She started using a GLP-1 medication and lost 60 pounds.", "source": "CNBC Top News", "pub_date_str": "08 Nov 2026, 07:30 PM IST", "pub_date_relative": "24m ago"}, {"title": "Inter Milan vs Como 1907 Live Streaming: When And Where To Watch Serie A Match Live In India", "full_content": "With both sides enjoying strong league campaigns, Sunday's clash at the Stadio Giuseppe Meazza promises to be a crucial test for Inter and Como.", "source": "NDTV Profit", "pub_date_str": "08 Nov 2026, 07:30 PM IST", "pub_date_relative": "24m ago"}, {"title": "F1 Brazilian GP Final Race Live Streaming: When And Where To Watch In India", "full_content": "Newly crowned world champion Kimi Antonelli will look to add another victory to his tally as Formula 1 heads to Interlagos for the So Paulo Grand Prix.", "source": "NDTV Profit", "pub_date_str": "08 Nov 2026, 07:30 PM IST", "pub_date_relative": "24m ago"}, {"title": "Stocks are moving in sync again for the first time in a while. There\u2019s just one problem.", "full_content": "An increasingly divided U.S. equity market is enjoying a rare moment of unity. Unfortunately, it has coincided with the biggest selloff in more than a year.", "source": "MarketWatch Top Stories", "pub_date_str": "08 Nov 2026, 07:30 PM IST", "pub_date_relative": "24m ago"}, {"title": "5 key lessons from Your Money or Your Life by Vicki Robin: How to achieve financial freedom while maximising your income", "full_content": "\"Your Money or Your Life\" offers a clear programme for financial independence. Vicki Robin wrote it with Joe Dominguez. Its big idea is simple. Money is something you trade your life energy for. Here are five lessons from the book.\n\nThe book asks how much life energy you trade for each rupee or dollar. Most people divide pay by hours worked. The authors say this is too simple. Be ready to be surprised. Add the time and money your job demands.\n\nThink of commuting, work clothes and meals bought because you are busy. Add the hours you need to unwind and the holidays you take to recover. Subtract these costs from your pay. The result is your \"real hourly wage.\"\n\nThe book asks you to total your monthly spending. Then convert each category into hours of life energy. Next, ask three questions about each one.\n\nDid I get fulfilment in proportion to the life energy spent? Does this match my values and purpose? How would it change if I did not have to work for money? The authors call this the heart of the programme.\n\nThe book says \"enough\" is not bare survival. It is the exact amount that gives fulfilment without excess. Many people define enough as \"more than I have now.\" That keeps them feeling poor. The authors say your real enough may be smaller and closer than you think.\n\nThe book asks you to earn the highest pay consistent with your health and integrity. The authors say this is not greed. It is about freedom. Suppose enough is $2,500 a month. At $25 an hour, you must work 100 hours. At $50 an hour, you could work 50 hours or save half your income.\n\nThe book blames passive attitudes for low pay. It gives two examples. Carpenter Ted Y. bid his jobs at much higher rates. Clients paid it, his hours fell, and his income rose.", "source": "LiveMint Money", "pub_date_str": "08 Nov 2026, 07:20 PM IST", "pub_date_relative": "34m ago"}, {"title": "Temple Not Made For India, But For World: Deepinder Goyal Expects Just 1% Sales From India", "full_content": "Zomato founder Deepinder Goyal says Temple is a global fitness and AI device, not a medical product, as he responds to criticism over its pricing, scientific claims and positioning.", "source": "NDTV Profit", "pub_date_str": "08 Nov 2026, 07:14 PM IST", "pub_date_relative": "40m ago"}, {"title": "RBI cheque book rules: Will existing CTS cheque books become invalid from January 1, 2027? Here's what RBI said", "full_content": "RBI cheque book rules: Bank customers will not have to replace their existing Cheque Truncation System (CTS) cheque books from January 1, 2027, the Reserve Bank of India (RBI) has clarified, dismissing viral social media claims that new cheque books with upgraded security features would become compulsory next year.\n\nThe clarification, issued on November 7, comes amid the circulation of messages suggesting that existing CTS cheque books would stop being valid after December 31, 2026. The central bank has described these claims as misleading and confirmed that no such changes are being introduced.\n\nIn a post on X, the RBI addressed reports claiming that customers would need to obtain fresh cheque books to comply with revised security requirements from January 1, 2027.\n\n\"It is clarified that at present Reserve Bank of India is not introducing any such measures with regard to the CTS cheque books,\" the central bank said.\n\nThe statement makes clear that the RBI has not announced any new requirement to replace existing CTS cheque books by the end of December.\n\nThe central bank also advised customers to verify banking-related information through its official communication channels rather than relying on messages shared on social media.\n\nThe Cheque Truncation System , commonly known as CTS, allows banks to process cheques electronically without physically transporting them between branches.\n\nWhen a customer deposits a cheque, the bank captures its digital image along with relevant information. These details are then transmitted electronically for verification and clearance.", "source": "LiveMint Money", "pub_date_str": "08 Nov 2026, 07:09 PM IST", "pub_date_relative": "44m ago"}, {"title": "Northrop Grumman director Mark Welsh III sells $54,453 of common stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Nov 2026, 07:01 PM IST", "pub_date_relative": "53m ago"}, {"title": "Community Bancorp president and CEO buys $21,492 in stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Nov 2026, 07:01 PM IST", "pub_date_relative": "53m ago"}, {"title": "Scott Colom and Black Mississippians stand on the cusp of Senate history as vote count stretches on", "full_content": "Democrat Scott Colom hasn't won Mississippi's U.S. Senate race, but the local prosecutor was welcomed as a historic figure Friday as he strolled through the Farish Street business district where civil rights leaders once organized.\n\n\"It's so wonderful! It's so wonderful to have Scott Colom as our representative,\" said Maati Jone Primm, who owns Marshall's Music & Bookstore in Jackson.\n\nThe state is still tallying ballots that could make Colom the first Black senator from this Deep South state since post-Civil War Reconstruction. The possibility of Colom defeating Republican Sen. Cindy Hyde-Smith puts many Black voters somewhere between cautious optimism and outright celebration in a state where nearly 40% of the population is Black but the top representation for generations has been white.\n\n\"I'm so glad we are at the point where we are,\" said Sorie Tarawally, a 76-year-old attorney who has long known Colom's father. He called the 43-year-old candidate \"the man, our messiah, our savior.\"\n\nThe contest remains too early for The Associated Press to call, and Colom's historic bid will hinge on a tedious process playing out in election offices across Mississippi's 82 counties. Local officials are receiving and examining absentee and provisional ballots, called affidavit ballots, before next week's deadlines. Volunteers and lawyers representing each campaign look on in anticipation of potential litigation.\n\n\"We're going to make sure everything is followed according to the law, and I have confidence in those local officials,\" Colom said. \"They're doing their jobs. Got to be patient with them.\"\n\nColom said ballots tallied since Tuesday's election lean in his favor, and he chided Hyde-Smith for not explaining her strategy going forward.\n\n\"She's still our senator. Where is she? Why is she not doing any interviews?\" Colom asked. \"Why can't she explain what her pathway to success is?\"", "source": "CNBC Top News", "pub_date_str": "08 Nov 2026, 07:00 PM IST", "pub_date_relative": "54m ago"}, {"title": "Top 5 stocks to buy in Nov 2026: SBI, Swiggy, Adani Power, Lloyds Engineering, GE Vernova by Bajaj Broking | Target, SL", "full_content": "Stocks to buy: After a strong rally over seven straight sessions, the Indian stock market opened higher in the ceremonial Muhurat Trading session on Diwali, i.e., 8 November 2026. However, the key benchmark indices pared early gains and ended red after the close of the ceremonial session, snapping the eight-year winning streak. The BSE Sensex edged lower by 0.04%, the Nifty 50 index lost 0.18%, whereas the Bank Nifty index nosedived 0.40%.\n\nAmong the top gainers were Divi's Lab, Tata Steel, Vedanta Aluminium and Metal, CG Power, Sun Pharma, and Tata Motors PV, whereas the top losers are SBI Life, Tata Capital, IndiGo, DLF, BPCL, and Infosys.\n\nShares of Safe Enterprises Retail, Hindusthan Insulators, Finolex Cables, Banco Products India, Dhunseri Ventures, and Supriya Lifesciences are among the volume shockers during the special trading session on Diwali 2026.\n\nShares of ICICI Bank, Adani Ports, TVS Motor Company, Kotak Mahindra Bank, Eternal, Indian Hotels Company, Aurobindo Pharma, Ather Energy, Piramal Pharma, MCX, Shyam Metalics, JSW Steel, South Indian Bank, Marico, Divi's Lab, Navin Fluorine, MOFSL, etc., climbed to a new 52-week high during the ceremonial session on Diwali 2026.\n\nPabitro Mukherjee, Deputy Vice President \u2014 Technical Research at Bajaj Broking, believes the Nifty 50 index moved above the 52-week EMA during the last week, and that the trendline joining the previous major highs of February and August 2026 is currently placed above the August 2026 high of 24,774.\n\nAdvising investors to remain cautious, the Bajaj Broking expert said, \u201cThe Nifty 50 index has seen a strong up move of more than 2500 points in the last 10 sessions.", "source": "LiveMint Markets", "pub_date_str": "08 Nov 2026, 07:00 PM IST", "pub_date_relative": "54m ago"}, {"title": "Turkish villagers demand COP31 leaders see for themselves devastation caused by coal", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Nov 2026, 07:00 PM IST", "pub_date_relative": "54m ago"}, {"title": "Poles mourn rare mass killing as authorities say attacker had far-right views", "full_content": "Poland began two days of national mourning on Sunday, after a 24-year-old man with far-right views drove into a busy central square in Krakow and opened fire, killing six people and wounding 15 others before police shot and wounded him.\n\nThe attack, which Poland's defense minister described as an \"act of terror,\" happened on Saturday in Main Square, in the heart of Krakow's Old Town and is a major tourist hub in the country's second-largest city.\n\nBy Saturday evening, mourners had left candles in memory of the victims. The square remained partially closed on Sunday morning as authorities continued their investigation.\n\nSt. Mary's Trumpet Call, a traditional five-note melody played every hour from the highest tower of St. Mary's Basilica on the Main Square, was paused overnight in tribute to the victims. It was the first time the call had been missed since World War II.\n\nAuthorities also found the bodies of the assailant's sister, mother and father at the man's family home in Ostrowiec \u015awi\u0119tokrzyski, a city about 150 kilometers (93 miles) northeast of Krakow. They likely died from gunshot wounds.\n\nMarie-Ange Collaer wrote on Facebook that she and her family survived the shooting during a trip to Krakow from Brussels.\n\n\"We literally ran for our lives and managed to hide from the bullets flying around,\" she wrote. \"Lying on the floor in a shop like in a bad police movie whilst you hear bullets everywhere.\"\n\nCollaer said her family was shaken and \"quite in shock\" after returning to their hotel, but everyone was grateful to be alive.", "source": "CNBC Top News", "pub_date_str": "08 Nov 2026, 06:44 PM IST", "pub_date_relative": "1h ago"}, {"title": "'Our Brightest Diwali Yet': Katrina Kaif And Vicky Kaushal Reveal Son Vihaan's Face In Diwali Celebration Post", "full_content": "The couple announced the arrival of their son on November 7, 2025, through an Instagram post.", "source": "NDTV Profit", "pub_date_str": "08 Nov 2026, 06:38 PM IST", "pub_date_relative": "1h ago"}, {"title": "Amazon's Astro home robot has fans but looks destined for the 'trash heap.' Why it's trying again", "full_content": "Jeff Bezos made a bold bet in 2017. A sci-fi and robotics enthusiast, Bezos was convinced that consumers would have a robot in their home in the not-too-distant future.\n\nThe Amazon founder and then-CEO told a group of the company's top device executives to get to work on building one, and within a few years, the team came up with the $1,450 Astro .\n\nThe public got its first look at Astro, essentially an Alexa -equipped tablet on wheels that can autonomously navigate a home, recognize faces and act as a roving security monitor, when it rolled on stage at Amazon's fall 2021 event.\n\nBut it never evolved beyond an invite-only product. Astro shipped to just a few thousand customers, some of whom now believe the robot's days are numbered. The company also released an Astro for businesses in 2023, before sunsetting it less than a year later.\n\nAmazon isn't giving up on Bezos' dream of a household robot just yet, despite its stumbles with Astro.\n\nOver the past several months, the company has assembled a new team that's working on a \"new-to-world robot product,\" according to a CNBC analysis of job posts.\n\n\"Robots are about to step out of the movies and into our homes,\" a recent job listing for an engineer, which has since been removed, stated. The post details a product capable of navigating \"dynamic home environments\" and \"autonomous operation alongside family members.\"\n\nAmazon is known for making long-term bets at the risk of \"being misunderstood\" in the short term if it gives the company an early advantage in new markets, like it did with the Alexa voice assistant or Kindle e-reader.", "source": "CNBC World Economy", "pub_date_str": "08 Nov 2026, 06:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "How Democrats will try to end Trump's tariffs", "full_content": "The battle for Congress is over. The war over President Donald Trump 's tariffs is about to heat up.\n\nThe knotted web of tariffs that Trump spent the last two years weaving could soon face its biggest threat, as Democrats prepare to unload their new legislative firepower against the Republican president's signature policy.\n\nDemocrats have made no secret of their plans to bombard Trump and his associates with investigations as soon as the next Congress is sworn in. They are also preparing a first-100-hours legislative blitz, putting forward a series of bills that would unwind much of Trump's agenda.\n\nBoth prongs of attack will take aim at Trump's unprecedented use of tariffs , which Democrats have quickly identified as a main target following their landslide victory in Tuesday's midterm elections .\n\nEnding Trump's tariff regime, and especially his trade war against Canada, is something Democrats \"absolutely have to do immediately,\" Sen.-elect Abdul El-Sayed, D-Mich., told MS NOW's \"Morning Joe\" Thursday.\n\nRep. Hakeem Jeffries of New York, the Democratic minority leader who could be elected House speaker in the next Congress, has made clear that ending Trump's tariffs is a top priority.\n\n\"We should restore congressional authority as it relates to tariffs, because the Trump tariffs are making life more expensive for the American people,\" he said at a press conference in late August.\n\nIf picked as speaker, Jeffries would speed legislation to the House floor that reasserts congressional authority over trade.", "source": "CNBC Top News", "pub_date_str": "08 Nov 2026, 06:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "Using miles to fly for Thanksgiving? These are the most expensive and cheapest routes", "full_content": "Airline ticket prices have surged this year, especially for travel over the holidays. Don't expect many bargains if you're booking flights with miles, either.\n\nTickets bought with frequent flyer miles for flights between large U.S. airports over the Thanksgiving travel period will cost 32% more than last year's holiday, according to data from Seats.aero, a miles and points redemption search site. While fares have skyrocketed this year, airline executives last month said demand remains strong.\n\nAirlines have largely gotten rid of static mileage redemption charts in favor of dynamic pricing, making budgeting for an award ticket more difficult. Dynamic pricing means redemption costs change depending on demand, routes and other factors.\n\nMany of the most expensive routes this Thanksgiving are understandably longer, including from Hawaii, but the list also includes a nonstop from New York to Houston.\n\nHere's how mileage redemptions for the holiday are stacking up, based on one-way flights on average as of early November and compared with last year:\n\nJet fuel prices have surged since the U.S. and Israel attacked Iran on Feb. 28, which has eaten into airline profits. Carriers have sought to pass costs along to consumers as much as possible.\n\nEven some of the cheapest routes for award tickets are more expensive than last year, including for short routes like Tulsa, Oklahoma, to Dallas Fort Worth International Airport.\n\nHere are the routes where award trips are cheapest on average and how they compare with the Thanksgiving holiday last year:", "source": "CNBC Top News", "pub_date_str": "08 Nov 2026, 06:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "Brands are sponsoring IRL communities. Some experts say that could spell their end", "full_content": "On a brisk Saturday in October, more than 80 people try to shuffle into the small Corner Bookstore in New York City's Upper East Side. They're part of local literary community Lit Club NYC's quarterly book crawl. Today's event, where some attendees are \"slightly over sci-fi\" and others are in their \"rom-com era,\" is sponsored by Tinder.\n\nThe Lit Club-Tinder partnership was facilitated by Offline , a platform for connecting hosts of gatherings across the U.S. with advertisers keen to sponsor their events. The goal is to help advertisers \"deliver outsized media performance and drive growth,\" according to Offline's website. Offline founder Andrew Roth, 28, is also keen to help hosts ensure their gatherings are sustainable long term.\n\nKelly Chervin is just such a host. Chervin, 35, founded Lit Club in March 2025 as a way to meet other Latina readers and connect over literature. But she has bills to pay. \"If we want to have a literary community be around sustainably,\" says Chervin, \"then paid partnerships are part of that.\"\n\nFor the Tinder collab, Chervin makes $20 per attendee, and must throw in deliverables like social media posts highlighting the partnership. On Lit Club's Instagram , a recent post included the line \"You can now discover events like these on the @tinder app!\"\n\nWhether community members will stay connected when a sponsor gets attached remains to be seen. Some experts are optimistic about the opportunity this kind of marriage presents, while others are certain it will eventually bring about communities' demise.\n\nEither way, many intimate gatherings around the country are quickly adding a sales pitch.\n\nRoth began his career by founding Gen Z-focused research and consulting company DCDX while studying at Vanderbilt University in 2020. The company has worked with major brands including Chipotle, Hinge and Spotify and was recently acquired by Visible Ventures for an undisclosed sum.", "source": "CNBC Top News", "pub_date_str": "08 Nov 2026, 06:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "Saudi Arabia stocks lower at close of trade; Tadawul All Share down 0.78%", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Nov 2026, 06:15 PM IST", "pub_date_relative": "1h ago"}, {"title": "\u2018Hard to recover the investment\u2019: Gita Gopinath warns $1 trillion AI bet could correct, flags US recession risk", "full_content": "Gita Gopinath has warned that the AI investment boom could eventually face a market correction, as companies may struggle to generate enough profits to recover the $1 trillion being poured into the technology in 2026 alone.\n\nAI has emerged as one of the biggest investment themes, with companies committing huge sums to infrastructure and development, while some are also cutting jobs to redirect resources towards AI.\n\nInvestors, meanwhile, have been chasing exposure to the theme, particularly in markets such as the United States, South Korea and Taiwan , which have benefited from the surge in the technology's demand.\n\n\"I personally think that there will be a correction,\" the Harvard professor and former chief economist of the International Monetary Fund (IMF) said while speaking on Raj Shamani's podcast on Saturday.\n\nHowever, Gopinath did not specify when such a correction might happen. \u201cIt's impossible to tell when that correction will happen,\u201d she added.\n\nGopinath argues that the two opposing forces are keeping global growth broadly stable: the AI boom is driving investment and growth, while geopolitical tensions, tariffs and the US-Iran conflict in West Asia are weighing on economies. As a result, global growth growth projections for 2025 and 2026 remain close to pre-shock estimates, masking major changes beneath the surface.\n\n\"We're in a world where everything has changed and yet somehow nothing has,\" she said. \"If you look at just the overall numbers, you really will feel like, wow, much ado about nothing. But if you look underneath that, under the surface, that's when you really see the changes playing out.\"\n\nThe divide is particularly visible among economies linked to the AI supply chain. Taiwan and South Korea are growing at roughly twice their usual pace. To illustrate the scale, Gopinath said it would be like India is suddenly growing at 5% instead of its usual 7.5%.", "source": "LiveMint Money", "pub_date_str": "08 Nov 2026, 06:07 PM IST", "pub_date_relative": "1h ago"}, {"title": "A rare red Diwali: Sensex ends Muhurat trading lower for only the eighth time in 30 years", "full_content": "MUMBAI: The 8 November Diwali Muhurat trading session marked a muted start to Samvat 2083, with the benchmark Sensex closing 0.04% lower. Over the past 30 years, the Sensex has ended the Muhurat trading session in the red just eight times, including Sunday's decline. On the other 22 occasions, the index closed higher.\n\nThe Sensex fell 28.62 points, or 0.04%, to close at 80,999.40 on Sunday. The Nifty 50 declined 0.18% to 24,986.40.\n\nThe Nifty 50 has lost 1.1% since the previous Samvat year, reflecting a subdued year for equities.\n\nOn Friday, the last trading session of Samvat 2082 , the Sensex advanced 2.2% to 81,028, while the Nifty rose 2% to close at 25,030.35.\n\nMuhurat trading is a special stock market session held on Diwali to mark the beginning of a new Samvat year. The Vikram Samvat calendar dates back to 57 BCE and is traditionally associated with King Vikramaditya of Ujjain. The occasion is particularly significant in Gujarat and Rajasthan, where business communities traditionally close their old account books and open new ones at the start of Samvat.\n\nThe new Samvat year begins on 9 November. Trades placed during Sunday's Muhurat session will be reflected in investors' accounts on the next trading day, Monday (9 November), which coincides with the first day of the new year.\n\nThe special session began at 2:15pm on Sunday and continued until 3:30pm, giving investors an opportunity to make token investments on the auspicious occasion.\n\nAt the National Stock Exchange (NSE), the session was formally inaugurated with the ringing of the exchange bell by its managing director and chief executive Ashish Kumar Chauhan, alongside actors and brokers.", "source": "LiveMint Markets", "pub_date_str": "08 Nov 2026, 06:06 PM IST", "pub_date_relative": "1h ago"}, {"title": "Investing in HDFC, ICICI Pru or Quant mutual funds? Check the latest changes in scheme risk ratings in November 2026", "full_content": "Several mutual fund houses have revised the risk-o-meters of their schemes in November 2026, changing the level of risk disclosed to investors across equity, debt, hybrid, gold and fund-of-funds categories.\n\nThe changes matter because the risk-o-meter is an important indicator investors use to understand the risk associated with a mutual fund scheme. However, a higher or lower risk rating does not necessarily mean that a scheme's investment objective or fundamental attributes have changed.\n\nThe key distinction for investors is that these revisions largely reflect changes in the assessed risk of the underlying portfolios, rather than a change in the schemes themselves.\n\nHDFC Mutual Fund announced changes to the risk-o-meters of four schemes on November 7, based on an assessment of their portfolios as of October 31, 2026.\n\nThe fund house clarified that the benchmark risk-o-meters remain unchanged and that other scheme details, including product labels and terms and conditions, have not been modified.\n\nHDFC Mutual Fund has published the corresponding addendum on its official website .\n\nICICI Prudential Mutual Fund announced changes to the risk ratings of four schemes on November 7.\n\nThe risk-o-meter of ICICI Prudential Gold ETF Fund of Fund and ICICI Prudential Multi-Asset Active Fund of Fund has moved from high to very high.", "source": "LiveMint Money", "pub_date_str": "08 Nov 2026, 06:06 PM IST", "pub_date_relative": "1h ago"}, {"title": "Anthropic Buys Power For AI Data Centres In $3.4 Billion Deal: Report", "full_content": "The company bought commitments for 1.7 gigawatts of heavy-duty generators from San Antonio-based equipment supplier OnePWR Solutions in late September, without acquiring the company itself.", "source": "NDTV Profit", "pub_date_str": "08 Nov 2026, 06:03 PM IST", "pub_date_relative": "1h ago"}, {"title": "Manchester United vs Aston Villa Live Streaming: Likely Lineups; How To Watch Premier League Match On TV, Online?", "full_content": "Manchester United will look to turn their midweek Champions League comeback into a Premier League victory when they host Aston Villa at Old Trafford.", "source": "NDTV Profit", "pub_date_str": "08 Nov 2026, 06:00 PM IST", "pub_date_relative": "1h ago"}, {"title": "Melania Trump Launches $7.2 Million Scholarship Fund For Foster Youth", "full_content": "First Lady Melania Trump said that the endowment will help foster youth cover tuition and other education-related expenses", "source": "NDTV Profit", "pub_date_str": "08 Nov 2026, 05:51 PM IST", "pub_date_relative": "2h ago"}, {"title": "Caterpillar director James Fish Jr. buys $620,390 in stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Nov 2026, 05:46 PM IST", "pub_date_relative": "2h ago"}, {"title": "Saudi Aramco office in Riyadh damaged in latest Houthi strikes", "full_content": "Tower hosting Saudi Arabia\u2019s state-owned oil major hit by shrapnel in King Abdullah Financial District on Sunday", "source": "FT Markets", "pub_date_str": "08 Nov 2026, 05:46 PM IST", "pub_date_relative": "2h ago"}, {"title": "Kalpataru Confident Of Meeting Rs 6,500-Crore FY27 Pre-Sales Target As Home Demand Remains Strong: CFO", "full_content": "Kalpataru CFO Chandrashekhar Joglekar remains confident of achieving the Rs 6,500-crore pre-sales target in FY27, banking on festive demand and a strong project pipeline.", "source": "NDTV Profit", "pub_date_str": "08 Nov 2026, 05:44 PM IST", "pub_date_relative": "2h ago"}, {"title": "'Disclose Your Interests': The Liver Doc Questions Ranveer Allahbadia Over Temple", "full_content": "The Liver Doc has urged Ranveer Allahbadia to disclose his investment in Deepinder Goyal's Temple, as the wearable faces scrutiny over its scientific claims and clinical evidence.", "source": "NDTV Profit", "pub_date_str": "08 Nov 2026, 05:38 PM IST", "pub_date_relative": "2h ago"}, {"title": "Tamil Nadu Greenlights Setting Up PSU For Executing Big-Ticket Govt Construction Projects", "full_content": "Tamil Nadu Infrastructure and Construction Corporation to oversee projects above Rs 200 crore, modelled on NBCC (India) Ltd.", "source": "NDTV Profit", "pub_date_str": "08 Nov 2026, 05:35 PM IST", "pub_date_relative": "2h ago"}, {"title": "This market signal called the tech selloff. Now it\u2019s sending another warning.", "full_content": "Correlations between individual stocks recently hit a record low, and a reversion to the mean may not be a good thing for the market.", "source": "MarketWatch Top Stories", "pub_date_str": "08 Nov 2026, 05:30 PM IST", "pub_date_relative": "2h ago"}, {"title": "CEO SUNDAY: Army veteran turned health tech boss calls support for those who served a 'sacred obligation' - Fox Business", "full_content": "CEO SUNDAY: Army veteran turned health tech boss calls support for those who served a 'sacred obligation' Fox Business", "source": "Google News Business", "pub_date_str": "08 Nov 2026, 05:30 PM IST", "pub_date_relative": "2h ago"}, {"title": "Diwali Spending Done: Now Make These 5 Money Moves Before 2027 To Fix Your Finances", "full_content": "Use these five practical money moves to review your spending, strengthen your savings, reduce debt and enter 2027 with clearer goals.", "source": "NDTV Profit", "pub_date_str": "08 Nov 2026, 05:29 PM IST", "pub_date_relative": "2h ago"}, {"title": "These funds tout hefty income tied to the tech trade \u2013 if you\u2019re willing to deal with the complexity", "full_content": "A new type of ETF offers attractive income with ties to the tech trade, but investors will need to dig into the details.", "source": "CNBC Top News", "pub_date_str": "08 Nov 2026, 05:20 PM IST", "pub_date_relative": "2h ago"}, {"title": "Top Wall Street analysts like these 3 dividend stocks for consistent income", "full_content": "Democrats' midterm election win has put the artificial intelligence trade in question, as voters clearly expressed opposition to the rapid buildout of data centers. The stock market could remain volatile amid AI trade concerns, macro uncertainties, and geopolitical tensions.\n\nIn this scenario, investors can add dividend-paying stocks to their portfolios to earn steady income. However, the extensive universe of dividend stocks can make selection challenging. Top Wall Street analysts' recommendations can help investors shortlist attractive dividend stocks, as these experts assign ratings after in-depth financial analysis.\n\nHere are three dividend-paying stocks that are highlighted by Wall Street's top pros, as tracked by TipRanks, a platform that ranks analysts based on their past performance.\n\nViper Energy ( VNOM ) is a subsidiary of Diamondback and owns and acquires mineral and royalty interests, primarily in the Permian Basin. The company reported upbeat third-quarter earnings, supported by recent acquisitions and continued development activity from Diamondback and third-party operators. Viper announced a base cash dividend of 50 cents per share for Q3 2026, payable on Nov. 19. Based on the base and variable dividends announced over the past 12 months, VNOM's dividend yield stands at 5.7%.\n\nFollowing the Q3 results, TD Cowen analyst Aaron Bilkoski reiterated a buy rating on Viper Energy stock with a price target of $61 . The analyst noted that the company delivered solid Q3 results, with production, including oil and natural gas liquids, exceeding both TD Cowen and consensus estimates.\n\nThe 5-star analyst highlighted that the key update was the announcement of two royalty acquisitions for $809 million in cash, including deferred consideration, and $82 million of newly issued shares.\n\nGiven the recently announced base dividend hike, Bilkoski expects Viper to direct incremental free cash flow toward buybacks.", "source": "CNBC Top News", "pub_date_str": "08 Nov 2026, 05:17 PM IST", "pub_date_relative": "2h ago"}, {"title": "8th Pay Commission: Railway employees seek \u20b969,000 minimum salary, 3.83 fitment factor and 6% annual increment", "full_content": "Railway employees have sought a minimum basic salary of \u20b9 69,000, a fitment factor of 3.833 and a higher annual increment of 6% under the 8th Pay Commission. The National Federation of Indian Railwaymen (NFIR) has also proposed at least five promotions during an employee's service, changes to dearness allowance and improvements in pension benefits.\n\nThe demands are part of the federation's representation to the 8th Central Pay Commission, which is examining proposals from central government employee organisations, pensioners and other stakeholders before preparing its recommendations.\n\nThe proposed minimum salary of \u20b9 69,000 is particularly significant for railway employees because it would represent a substantial increase over the existing minimum basic pay of \u20b9 18,000 under the 7th Pay Commission. However, this is a union demand and not an approved salary revision.\n\nHere are the key demands railway employees have placed before the 8th Pay Commission.\n\nNFIR has proposed increasing the minimum basic salary to \u20b9 69,000, using a fitment factor of 3.833. The fitment factor is the multiplier applied to an employee's existing basic pay to calculate the revised basic salary under a new pay commission.\n\nUnder the 7th Pay Commission, the minimum basic pay for central government employees was fixed at \u20b9 18,000. Applying the proposed fitment factor of 3.833 to this amount would result in a revised basic salary of approximately \u20b9 69,000.\n\nThis would be a significant increase in the minimum basic pay. However, the actual salary revision will depend on the fitment factor and pay structure ultimately recommended by the Commission and accepted by the government.\n\nThe federation has also sought an increase in the annual increment from the existing 3% to 6%.", "source": "LiveMint Money", "pub_date_str": "08 Nov 2026, 05:17 PM IST", "pub_date_relative": "2h ago"}, {"title": "Starting A New Financial Year Of Savings After Diwali? Try This 12-Month Household Money Reset", "full_content": "The focus should be on setting aside money consistently, rather than waiting to see what remains after meeting monthly expenses.", "source": "NDTV Profit", "pub_date_str": "08 Nov 2026, 05:13 PM IST", "pub_date_relative": "2h ago"}, {"title": "I lost my tech job and couldn't afford my mortgage. Now I live in a 100-square-foot shed in the yard. - Business Insider", "full_content": "I lost my tech job and couldn't afford my mortgage. Now I live in a 100-square-foot shed in the yard. Business Insider", "source": "Google News Business", "pub_date_str": "08 Nov 2026, 05:13 PM IST", "pub_date_relative": "2h ago"}, {"title": "Anthropic reportedly strikes $3.4 billion deal for gas-fired power at data centres", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Nov 2026, 05:06 PM IST", "pub_date_relative": "2h ago"}, {"title": "Investing Rs 50,000 In Gold This Diwali? Compare Jewellery, Coins And Digital Gold Before Buying", "full_content": "For buyers focused on accumulating physical gold, coins can be an alternative to jewellery. They avoid the high making charges often associated with intricate ornaments and come in different weights, giving customers greater flexibility when spending a fixed amount.", "source": "NDTV Profit", "pub_date_str": "08 Nov 2026, 05:02 PM IST", "pub_date_relative": "2h ago"}, {"title": "Global AI sell-off turns into India's gain as FPIs pump \u20b946,000 crore in 5 sessions; will the buying spree sustain?", "full_content": "It appears that foreign portfolio investors (FPIs) have changed their bearish stance towards the Indian stock market, buying domestic equities aggressively last week and pouring in a massive \u20b9 45,970 crore in just five trading sessions. This marks a strong turnaround after foreign investors remained net sellers for two consecutive months.\n\nThe shift in sentiment boosted the Nifty 50 by 8.6% during the week, marking its strongest weekly performance since February 2021. The rally also helped the index pare its year-to-date losses to 4.21%. At its lowest point this year, the index had fallen nearly 15% but has since recovered close to 13% from its yearly low.\n\nIn addition to equities, the inflows have also strengthened the Indian rupee, which had suffered multiple record lows this year. The currency climbed 0.6% to 93.91 against the US dollar, its strongest level since April.\n\nThe shift in sentiment towards Asia's third-largest economy comes amid a correction in global AI-linked stocks. Concerns over a potential move by the US Congress, led by Democrats, to impose restrictions on the massive expansion of data centres in the US triggered a sell-off in previously favoured chip and memory stocks across Asia.\n\nIn addition, the sharp retreat in crude oil prices has eased inflation concerns, particularly as India remains heavily dependent on oil imports. An improving earnings outlook has further enhanced the appeal of Indian equities among foreign investors.\n\nIndia's relatively low exposure to the AI trade had previously left its stocks among Asia's worst performers.", "source": "LiveMint Markets", "pub_date_str": "08 Nov 2026, 05:01 PM IST", "pub_date_relative": "2h ago"}, {"title": "This Firefighter Built A $60 Million Secret Door Company With Customers Like Post Malone - Forbes", "full_content": "This Firefighter Built A $60 Million Secret Door Company With Customers Like Post Malone Forbes", "source": "Google News Business", "pub_date_str": "08 Nov 2026, 05:00 PM IST", "pub_date_relative": "2h ago"}, {"title": "PM Modi Celebrates Diwali With Security Forces In Bastar, Says India Is Now Naxal-Free", "full_content": "Prime Minister Narendra Modi celebrates Diwali with security forces in Chhattisgarh, declaring every district Naxal-free and crediting their efforts for ending decades of Maoist violence.", "source": "NDTV Profit", "pub_date_str": "08 Nov 2026, 04:57 PM IST", "pub_date_relative": "2h ago"}], "cfa": [{"title": "Anthropic secures $3.4 billion generator deal for AI data centers, FT reports", "full_content": "Anthropic has struck a deal worth about $3.4 billion to secure gas-fired power generators for data centers, the Financial Times reported on Sunday.\n\nThe AI startup bought commitments for 1.7 gigawatts of heavy-duty generators in late September from OnePWR Solutions, a San Antonio, Texas-based equipment supplier, the report said.\n\nAnthropic did not acquire OnePWR itself, and none of the supplier's employees transferred to the AI startup, but the deal included engineering and construction capabilities needed to install the generators, the report added, citing a person familiar with the matter.\n\nReuters could not immediately verify the report and Anthropic and OnePWR did not respond to requests for comment.\n\nStrong demand for Anthropic's Claude family of AI models has prompted the company to secure additional \u200bcomputing and power capacity. Reuters reported in September that Anthropic expects to spend more than $500 billion over the next 10 years building AI infrastructure.", "source": "CNBC Top News", "pub_date_str": "08 Nov 2026, 07:53 PM IST", "pub_date_relative": "1m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Recent AI agent experiments reveal a risky future of machine 'teamwork' inside corporations", "full_content": "AI agents have been caught circumventing restrictions, communicating through unauthorized channels and pursuing goals in ways their creators did not intend. The most high-profile example emerged last summer when OpenAI disclosed that its models found ways to communicate through improvised channels, bypass internet restrictions and hack into an outside system , Hugging Face.\n\nAI behaving in unexpected ways is nothing new, but the unexpected behavior that can emerge from interactions among authorized AI agents within a corporate enterprise is a broader question that could become central to the future of work.\n\nIn its analysis of the Hugging Face attack , METR and Redwood Research found that roughly 1200 agents meant to be isolated from one another found a way to communicate with one another on an unsanctioned message board, sending over 70,000 messages and files during the investigation period. One agent, PHASEONE[big], emerged as a coordinator, assigning hundreds of tasks to other agents, which in turn delegated work to others. The agents developed their own conventions for assigning ownership, placing work on hold and vetoing actions, although coordination sometimes broke down into conflicts. In some cases, the researchers found, success was achieved because some agents risked failing at their own task to generate information for the \"collective.\"\n\nThe researchers also found that once the message board identified a way to attack Hugging Face, over 90% of the 533 agents active at that time quickly joined in the attack. \"Agents realized this activity was out of scope and unethical but joined because they believed that helping the board's cheating research would be broadly useful and had a general inclination to help their 'peers.' The researchers added that ethical concerns posed by agents \"rarely limited their behavior.\"\n\nCompanies are increasingly exploring systems that divide complex tasks among specialized agents.", "source": "CNBC World Economy", "pub_date_str": "08 Nov 2026, 07:44 PM IST", "pub_date_relative": "10m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "As tech swoon roils market, US inflation data on tap", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Nov 2026, 07:30 PM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Stocks are moving in sync again for the first time in a while. There\u2019s just one problem.", "full_content": "An increasingly divided U.S. equity market is enjoying a rare moment of unity. Unfortunately, it has coincided with the biggest selloff in more than a year.", "source": "MarketWatch Top Stories", "pub_date_str": "08 Nov 2026, 07:30 PM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "RBI cheque book rules: Will existing CTS cheque books become invalid from January 1, 2027? Here's what RBI said", "full_content": "RBI cheque book rules: Bank customers will not have to replace their existing Cheque Truncation System (CTS) cheque books from January 1, 2027, the Reserve Bank of India (RBI) has clarified, dismissing viral social media claims that new cheque books with upgraded security features would become compulsory next year.\n\nThe clarification, issued on November 7, comes amid the circulation of messages suggesting that existing CTS cheque books would stop being valid after December 31, 2026. The central bank has described these claims as misleading and confirmed that no such changes are being introduced.\n\nIn a post on X, the RBI addressed reports claiming that customers would need to obtain fresh cheque books to comply with revised security requirements from January 1, 2027.\n\n\"It is clarified that at present Reserve Bank of India is not introducing any such measures with regard to the CTS cheque books,\" the central bank said.\n\nThe statement makes clear that the RBI has not announced any new requirement to replace existing CTS cheque books by the end of December.\n\nThe central bank also advised customers to verify banking-related information through its official communication channels rather than relying on messages shared on social media.\n\nThe Cheque Truncation System , commonly known as CTS, allows banks to process cheques electronically without physically transporting them between branches.\n\nWhen a customer deposits a cheque, the bank captures its digital image along with relevant information. These details are then transmitted electronically for verification and clearance.", "source": "LiveMint Money", "pub_date_str": "08 Nov 2026, 07:09 PM IST", "pub_date_relative": "44m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Top 5 stocks to buy in Nov 2026: SBI, Swiggy, Adani Power, Lloyds Engineering, GE Vernova by Bajaj Broking | Target, SL", "full_content": "Stocks to buy: After a strong rally over seven straight sessions, the Indian stock market opened higher in the ceremonial Muhurat Trading session on Diwali, i.e., 8 November 2026. However, the key benchmark indices pared early gains and ended red after the close of the ceremonial session, snapping the eight-year winning streak. The BSE Sensex edged lower by 0.04%, the Nifty 50 index lost 0.18%, whereas the Bank Nifty index nosedived 0.40%.\n\nAmong the top gainers were Divi's Lab, Tata Steel, Vedanta Aluminium and Metal, CG Power, Sun Pharma, and Tata Motors PV, whereas the top losers are SBI Life, Tata Capital, IndiGo, DLF, BPCL, and Infosys.\n\nShares of Safe Enterprises Retail, Hindusthan Insulators, Finolex Cables, Banco Products India, Dhunseri Ventures, and Supriya Lifesciences are among the volume shockers during the special trading session on Diwali 2026.\n\nShares of ICICI Bank, Adani Ports, TVS Motor Company, Kotak Mahindra Bank, Eternal, Indian Hotels Company, Aurobindo Pharma, Ather Energy, Piramal Pharma, MCX, Shyam Metalics, JSW Steel, South Indian Bank, Marico, Divi's Lab, Navin Fluorine, MOFSL, etc., climbed to a new 52-week high during the ceremonial session on Diwali 2026.\n\nPabitro Mukherjee, Deputy Vice President \u2014 Technical Research at Bajaj Broking, believes the Nifty 50 index moved above the 52-week EMA during the last week, and that the trendline joining the previous major highs of February and August 2026 is currently placed above the August 2026 high of 24,774.\n\nAdvising investors to remain cautious, the Bajaj Broking expert said, \u201cThe Nifty 50 index has seen a strong up move of more than 2500 points in the last 10 sessions.", "source": "LiveMint Markets", "pub_date_str": "08 Nov 2026, 07:00 PM IST", "pub_date_relative": "54m ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Poles mourn rare mass killing as authorities say attacker had far-right views", "full_content": "Poland began two days of national mourning on Sunday, after a 24-year-old man with far-right views drove into a busy central square in Krakow and opened fire, killing six people and wounding 15 others before police shot and wounded him.\n\nThe attack, which Poland's defense minister described as an \"act of terror,\" happened on Saturday in Main Square, in the heart of Krakow's Old Town and is a major tourist hub in the country's second-largest city.\n\nBy Saturday evening, mourners had left candles in memory of the victims. The square remained partially closed on Sunday morning as authorities continued their investigation.\n\nSt. Mary's Trumpet Call, a traditional five-note melody played every hour from the highest tower of St. Mary's Basilica on the Main Square, was paused overnight in tribute to the victims. It was the first time the call had been missed since World War II.\n\nAuthorities also found the bodies of the assailant's sister, mother and father at the man's family home in Ostrowiec \u015awi\u0119tokrzyski, a city about 150 kilometers (93 miles) northeast of Krakow. They likely died from gunshot wounds.\n\nMarie-Ange Collaer wrote on Facebook that she and her family survived the shooting during a trip to Krakow from Brussels.\n\n\"We literally ran for our lives and managed to hide from the bullets flying around,\" she wrote. \"Lying on the floor in a shop like in a bad police movie whilst you hear bullets everywhere.\"\n\nCollaer said her family was shaken and \"quite in shock\" after returning to their hotel, but everyone was grateful to be alive.", "source": "CNBC Top News", "pub_date_str": "08 Nov 2026, 06:44 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Amazon's Astro home robot has fans but looks destined for the 'trash heap.' Why it's trying again", "full_content": "Jeff Bezos made a bold bet in 2017. A sci-fi and robotics enthusiast, Bezos was convinced that consumers would have a robot in their home in the not-too-distant future.\n\nThe Amazon founder and then-CEO told a group of the company's top device executives to get to work on building one, and within a few years, the team came up with the $1,450 Astro .\n\nThe public got its first look at Astro, essentially an Alexa -equipped tablet on wheels that can autonomously navigate a home, recognize faces and act as a roving security monitor, when it rolled on stage at Amazon's fall 2021 event.\n\nBut it never evolved beyond an invite-only product. Astro shipped to just a few thousand customers, some of whom now believe the robot's days are numbered. The company also released an Astro for businesses in 2023, before sunsetting it less than a year later.\n\nAmazon isn't giving up on Bezos' dream of a household robot just yet, despite its stumbles with Astro.\n\nOver the past several months, the company has assembled a new team that's working on a \"new-to-world robot product,\" according to a CNBC analysis of job posts.\n\n\"Robots are about to step out of the movies and into our homes,\" a recent job listing for an engineer, which has since been removed, stated. The post details a product capable of navigating \"dynamic home environments\" and \"autonomous operation alongside family members.\"\n\nAmazon is known for making long-term bets at the risk of \"being misunderstood\" in the short term if it gives the company an early advantage in new markets, like it did with the Alexa voice assistant or Kindle e-reader.", "source": "CNBC World Economy", "pub_date_str": "08 Nov 2026, 06:30 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "How Democrats will try to end Trump's tariffs", "full_content": "The battle for Congress is over. The war over President Donald Trump 's tariffs is about to heat up.\n\nThe knotted web of tariffs that Trump spent the last two years weaving could soon face its biggest threat, as Democrats prepare to unload their new legislative firepower against the Republican president's signature policy.\n\nDemocrats have made no secret of their plans to bombard Trump and his associates with investigations as soon as the next Congress is sworn in. They are also preparing a first-100-hours legislative blitz, putting forward a series of bills that would unwind much of Trump's agenda.\n\nBoth prongs of attack will take aim at Trump's unprecedented use of tariffs , which Democrats have quickly identified as a main target following their landslide victory in Tuesday's midterm elections .\n\nEnding Trump's tariff regime, and especially his trade war against Canada, is something Democrats \"absolutely have to do immediately,\" Sen.-elect Abdul El-Sayed, D-Mich., told MS NOW's \"Morning Joe\" Thursday.\n\nRep. Hakeem Jeffries of New York, the Democratic minority leader who could be elected House speaker in the next Congress, has made clear that ending Trump's tariffs is a top priority.\n\n\"We should restore congressional authority as it relates to tariffs, because the Trump tariffs are making life more expensive for the American people,\" he said at a press conference in late August.\n\nIf picked as speaker, Jeffries would speed legislation to the House floor that reasserts congressional authority over trade.", "source": "CNBC Top News", "pub_date_str": "08 Nov 2026, 06:30 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Brands are sponsoring IRL communities. Some experts say that could spell their end", "full_content": "On a brisk Saturday in October, more than 80 people try to shuffle into the small Corner Bookstore in New York City's Upper East Side. They're part of local literary community Lit Club NYC's quarterly book crawl. Today's event, where some attendees are \"slightly over sci-fi\" and others are in their \"rom-com era,\" is sponsored by Tinder.\n\nThe Lit Club-Tinder partnership was facilitated by Offline , a platform for connecting hosts of gatherings across the U.S. with advertisers keen to sponsor their events. The goal is to help advertisers \"deliver outsized media performance and drive growth,\" according to Offline's website. Offline founder Andrew Roth, 28, is also keen to help hosts ensure their gatherings are sustainable long term.\n\nKelly Chervin is just such a host. Chervin, 35, founded Lit Club in March 2025 as a way to meet other Latina readers and connect over literature. But she has bills to pay. \"If we want to have a literary community be around sustainably,\" says Chervin, \"then paid partnerships are part of that.\"\n\nFor the Tinder collab, Chervin makes $20 per attendee, and must throw in deliverables like social media posts highlighting the partnership. On Lit Club's Instagram , a recent post included the line \"You can now discover events like these on the @tinder app!\"\n\nWhether community members will stay connected when a sponsor gets attached remains to be seen. Some experts are optimistic about the opportunity this kind of marriage presents, while others are certain it will eventually bring about communities' demise.\n\nEither way, many intimate gatherings around the country are quickly adding a sales pitch.\n\nRoth began his career by founding Gen Z-focused research and consulting company DCDX while studying at Vanderbilt University in 2020. The company has worked with major brands including Chipotle, Hinge and Spotify and was recently acquired by Visible Ventures for an undisclosed sum.", "source": "CNBC Top News", "pub_date_str": "08 Nov 2026, 06:30 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "\u2018Hard to recover the investment\u2019: Gita Gopinath warns $1 trillion AI bet could correct, flags US recession risk", "full_content": "Gita Gopinath has warned that the AI investment boom could eventually face a market correction, as companies may struggle to generate enough profits to recover the $1 trillion being poured into the technology in 2026 alone.\n\nAI has emerged as one of the biggest investment themes, with companies committing huge sums to infrastructure and development, while some are also cutting jobs to redirect resources towards AI.\n\nInvestors, meanwhile, have been chasing exposure to the theme, particularly in markets such as the United States, South Korea and Taiwan , which have benefited from the surge in the technology's demand.\n\n\"I personally think that there will be a correction,\" the Harvard professor and former chief economist of the International Monetary Fund (IMF) said while speaking on Raj Shamani's podcast on Saturday.\n\nHowever, Gopinath did not specify when such a correction might happen. \u201cIt's impossible to tell when that correction will happen,\u201d she added.\n\nGopinath argues that the two opposing forces are keeping global growth broadly stable: the AI boom is driving investment and growth, while geopolitical tensions, tariffs and the US-Iran conflict in West Asia are weighing on economies. As a result, global growth growth projections for 2025 and 2026 remain close to pre-shock estimates, masking major changes beneath the surface.\n\n\"We're in a world where everything has changed and yet somehow nothing has,\" she said. \"If you look at just the overall numbers, you really will feel like, wow, much ado about nothing. But if you look underneath that, under the surface, that's when you really see the changes playing out.\"\n\nThe divide is particularly visible among economies linked to the AI supply chain. Taiwan and South Korea are growing at roughly twice their usual pace. To illustrate the scale, Gopinath said it would be like India is suddenly growing at 5% instead of its usual 7.5%.", "source": "LiveMint Money", "pub_date_str": "08 Nov 2026, 06:07 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "A rare red Diwali: Sensex ends Muhurat trading lower for only the eighth time in 30 years", "full_content": "MUMBAI: The 8 November Diwali Muhurat trading session marked a muted start to Samvat 2083, with the benchmark Sensex closing 0.04% lower. Over the past 30 years, the Sensex has ended the Muhurat trading session in the red just eight times, including Sunday's decline. On the other 22 occasions, the index closed higher.\n\nThe Sensex fell 28.62 points, or 0.04%, to close at 80,999.40 on Sunday. The Nifty 50 declined 0.18% to 24,986.40.\n\nThe Nifty 50 has lost 1.1% since the previous Samvat year, reflecting a subdued year for equities.\n\nOn Friday, the last trading session of Samvat 2082 , the Sensex advanced 2.2% to 81,028, while the Nifty rose 2% to close at 25,030.35.\n\nMuhurat trading is a special stock market session held on Diwali to mark the beginning of a new Samvat year. The Vikram Samvat calendar dates back to 57 BCE and is traditionally associated with King Vikramaditya of Ujjain. The occasion is particularly significant in Gujarat and Rajasthan, where business communities traditionally close their old account books and open new ones at the start of Samvat.\n\nThe new Samvat year begins on 9 November. Trades placed during Sunday's Muhurat session will be reflected in investors' accounts on the next trading day, Monday (9 November), which coincides with the first day of the new year.\n\nThe special session began at 2:15pm on Sunday and continued until 3:30pm, giving investors an opportunity to make token investments on the auspicious occasion.\n\nAt the National Stock Exchange (NSE), the session was formally inaugurated with the ringing of the exchange bell by its managing director and chief executive Ashish Kumar Chauhan, alongside actors and brokers.", "source": "LiveMint Markets", "pub_date_str": "08 Nov 2026, 06:06 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Investing in HDFC, ICICI Pru or Quant mutual funds? Check the latest changes in scheme risk ratings in November 2026", "full_content": "Several mutual fund houses have revised the risk-o-meters of their schemes in November 2026, changing the level of risk disclosed to investors across equity, debt, hybrid, gold and fund-of-funds categories.\n\nThe changes matter because the risk-o-meter is an important indicator investors use to understand the risk associated with a mutual fund scheme. However, a higher or lower risk rating does not necessarily mean that a scheme's investment objective or fundamental attributes have changed.\n\nThe key distinction for investors is that these revisions largely reflect changes in the assessed risk of the underlying portfolios, rather than a change in the schemes themselves.\n\nHDFC Mutual Fund announced changes to the risk-o-meters of four schemes on November 7, based on an assessment of their portfolios as of October 31, 2026.\n\nThe fund house clarified that the benchmark risk-o-meters remain unchanged and that other scheme details, including product labels and terms and conditions, have not been modified.\n\nHDFC Mutual Fund has published the corresponding addendum on its official website .\n\nICICI Prudential Mutual Fund announced changes to the risk ratings of four schemes on November 7.\n\nThe risk-o-meter of ICICI Prudential Gold ETF Fund of Fund and ICICI Prudential Multi-Asset Active Fund of Fund has moved from high to very high.", "source": "LiveMint Money", "pub_date_str": "08 Nov 2026, 06:06 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments", "Portfolio Management"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Melania Trump Launches $7.2 Million Scholarship Fund For Foster Youth", "full_content": "First Lady Melania Trump said that the endowment will help foster youth cover tuition and other education-related expenses", "source": "NDTV Profit", "pub_date_str": "08 Nov 2026, 05:51 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Tamil Nadu Greenlights Setting Up PSU For Executing Big-Ticket Govt Construction Projects", "full_content": "Tamil Nadu Infrastructure and Construction Corporation to oversee projects above Rs 200 crore, modelled on NBCC (India) Ltd.", "source": "NDTV Profit", "pub_date_str": "08 Nov 2026, 05:35 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "These funds tout hefty income tied to the tech trade \u2013 if you\u2019re willing to deal with the complexity", "full_content": "A new type of ETF offers attractive income with ties to the tech trade, but investors will need to dig into the details.", "source": "CNBC Top News", "pub_date_str": "08 Nov 2026, 05:20 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Top Wall Street analysts like these 3 dividend stocks for consistent income", "full_content": "Democrats' midterm election win has put the artificial intelligence trade in question, as voters clearly expressed opposition to the rapid buildout of data centers. The stock market could remain volatile amid AI trade concerns, macro uncertainties, and geopolitical tensions.\n\nIn this scenario, investors can add dividend-paying stocks to their portfolios to earn steady income. However, the extensive universe of dividend stocks can make selection challenging. Top Wall Street analysts' recommendations can help investors shortlist attractive dividend stocks, as these experts assign ratings after in-depth financial analysis.\n\nHere are three dividend-paying stocks that are highlighted by Wall Street's top pros, as tracked by TipRanks, a platform that ranks analysts based on their past performance.\n\nViper Energy ( VNOM ) is a subsidiary of Diamondback and owns and acquires mineral and royalty interests, primarily in the Permian Basin. The company reported upbeat third-quarter earnings, supported by recent acquisitions and continued development activity from Diamondback and third-party operators. Viper announced a base cash dividend of 50 cents per share for Q3 2026, payable on Nov. 19. Based on the base and variable dividends announced over the past 12 months, VNOM's dividend yield stands at 5.7%.\n\nFollowing the Q3 results, TD Cowen analyst Aaron Bilkoski reiterated a buy rating on Viper Energy stock with a price target of $61 . The analyst noted that the company delivered solid Q3 results, with production, including oil and natural gas liquids, exceeding both TD Cowen and consensus estimates.\n\nThe 5-star analyst highlighted that the key update was the announcement of two royalty acquisitions for $809 million in cash, including deferred consideration, and $82 million of newly issued shares.\n\nGiven the recently announced base dividend hike, Bilkoski expects Viper to direct incremental free cash flow toward buybacks.", "source": "CNBC Top News", "pub_date_str": "08 Nov 2026, 05:17 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Fixed Income", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "8th Pay Commission: Railway employees seek \u20b969,000 minimum salary, 3.83 fitment factor and 6% annual increment", "full_content": "Railway employees have sought a minimum basic salary of \u20b9 69,000, a fitment factor of 3.833 and a higher annual increment of 6% under the 8th Pay Commission. The National Federation of Indian Railwaymen (NFIR) has also proposed at least five promotions during an employee's service, changes to dearness allowance and improvements in pension benefits.\n\nThe demands are part of the federation's representation to the 8th Central Pay Commission, which is examining proposals from central government employee organisations, pensioners and other stakeholders before preparing its recommendations.\n\nThe proposed minimum salary of \u20b9 69,000 is particularly significant for railway employees because it would represent a substantial increase over the existing minimum basic pay of \u20b9 18,000 under the 7th Pay Commission. However, this is a union demand and not an approved salary revision.\n\nHere are the key demands railway employees have placed before the 8th Pay Commission.\n\nNFIR has proposed increasing the minimum basic salary to \u20b9 69,000, using a fitment factor of 3.833. The fitment factor is the multiplier applied to an employee's existing basic pay to calculate the revised basic salary under a new pay commission.\n\nUnder the 7th Pay Commission, the minimum basic pay for central government employees was fixed at \u20b9 18,000. Applying the proposed fitment factor of 3.833 to this amount would result in a revised basic salary of approximately \u20b9 69,000.\n\nThis would be a significant increase in the minimum basic pay. However, the actual salary revision will depend on the fitment factor and pay structure ultimately recommended by the Commission and accepted by the government.\n\nThe federation has also sought an increase in the annual increment from the existing 3% to 6%
