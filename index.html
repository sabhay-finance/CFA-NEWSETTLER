<script>

    const allData = {"general": [{"title": "How much salary hike do you need to beat inflation in India? What it means for your savings, MF SIPs, financial goals", "full_content": "A salary hike may look generous on paper, but it does not necessarily translate into higher purchasing power. As the cost of groceries, healthcare, education and housing rises, employees need to assess how much of their increment remains after inflation. That amount determines whether they can save, invest through mutual fund systematic investment plans (SIPs) and meet financial goals as household costs continue rising.\n\nAnshi Shrivastava, Head of Personal Finance Training at 1 Finance, said salaried employees should target an annual salary hike two to three percentage points higher than their personal inflation rate. For most households, this means an increment of around 9-10%, she said.\n\nA salary increase that only matches inflation maintains purchasing power; it does not improve it. However, the benchmark should not be limited to official retail inflation because household spending patterns differ.\n\n\u201cYour family has its own inflation rate, shaped by what you spend on,\u201d Shrivastava said. School fees and medical bills, for instance, may rise faster than grocery costs. A household with children or higher healthcare expenses may experience a sharper increase in its monthly budget than the headline inflation rate suggests.\n\nIndia\u2019s retail inflation was 6.09% in October 2026, while urban households reported perceived inflation of 8.4% in the Reserve Bank of India\u2019s September survey, according to the figures cited by Shrivastava.\n\nAn employee receiving a 9% increment when inflation is 6.09% gets a real increase in purchasing power of about 2.7%, not 9%.\n\nThe impact compounds over time. At 6% inflation, money loses half its purchasing power in about 12 years. \u20b9 1 lakh today would buy goods and services worth roughly \u20b9 31,000 in today\u2019s terms after 20 years, if inflation stays at that rate.\n\nA higher salary does not automatically lead to higher savings.", "source": "LiveMint Money", "pub_date_str": "28 Nov 2026, 09:40 PM IST", "pub_date_relative": "8m ago"}, {"title": "EU set to delay plug-in hybrid emissions rating update until 2030", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Nov 2026, 09:34 PM IST", "pub_date_relative": "13m ago"}, {"title": "How Silicon Valley got \u2018triggered\u2019 and saved Jensen Huang - The Washington Post", "full_content": "How Silicon Valley got \u2018triggered\u2019 and saved Jensen Huang The Washington Post Top Links 1297 Nvidia shambles. China bonds. Global poverty & how a nineteenth-century novelist taught the world economics. Adam Tooze | Substack What Jensen Huang\u2019s allies say they've told him since his resignation: 'Let's fight' London School of Business and Research (LSBR) Nvidia shambles. China bonds. Global poverty & how a nineteenth-century novelist taught the world economics. Adam Tooze | Substack", "source": "Google News Business", "pub_date_str": "28 Nov 2026, 09:31 PM IST", "pub_date_relative": "17m ago"}, {"title": "We are living in perilous times if Nvidia CEO Jensen Huang dictates your 401(k) balance", "full_content": "Why did a futurist with Huang\u2019s prescient vision build a company where all roads lead to him?", "source": "MarketWatch Top Stories", "pub_date_str": "28 Nov 2026, 09:30 PM IST", "pub_date_relative": "18m ago"}, {"title": "US Black Friday online spend rises 11% to a new high of $13.1 billion", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Nov 2026, 09:24 PM IST", "pub_date_relative": "24m ago"}, {"title": "China\u2019s Chery Automobile moves into police and nurse robots, FT reports", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Nov 2026, 09:23 PM IST", "pub_date_relative": "25m ago"}, {"title": "U.S. Black Friday online sales set to exceed $13 billion, Adobe predicts", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Nov 2026, 09:11 PM IST", "pub_date_relative": "37m ago"}, {"title": "Where does last week\u2019s selloff stand in history, and what\u2019s driven bigger ones?", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Nov 2026, 09:04 PM IST", "pub_date_relative": "44m ago"}, {"title": "Major holder buys $8,170 in koil energy solutions stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Nov 2026, 09:01 PM IST", "pub_date_relative": "47m ago"}, {"title": "I\u2019ve been married for 58 years. It\u2019s \u2018our\u2019 money, not \u2018his\u2019 and \u2018hers.\u2019 Why do so many couples keep their finances separate?", "full_content": "\u201cMy wife stopped working outside the home in 1970.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "28 Nov 2026, 09:00 PM IST", "pub_date_relative": "48m ago"}, {"title": "Bitcoin pares losses near $59,000 as ETF outflows extend eight-day streak", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Nov 2026, 08:51 PM IST", "pub_date_relative": "57m ago"}, {"title": "Groww Says Anthropic's IPO Drew Over 1 Lakh Users In Hours, And That's Changed Its Plans", "full_content": "The platform says it will offer pre-orders for other sought-after global listings after the response to Anthropic's record-breaking Nasdaq debut.", "source": "NDTV Profit", "pub_date_str": "28 Nov 2026, 08:51 PM IST", "pub_date_relative": "57m ago"}, {"title": "What is Lakshmi Yojana? Delhi govt shifts \u20b92,500 aid to FDs till Jan after wallet glitches delay payout, says report", "full_content": "The Rekha Gupta-led Delhi government has decided to deposit the entire monthly assistance of \u20b9 2,500 into fixed deposits (FDs) until January 2027, instead of following the original payment arrangement involving a digital wallet and a savings component, The Indian Express reported.\n\nThe move comes after the planned Central Bank Digital Currency (CBDC) wallet mechanism encountered difficulties, with only 53 women receiving payments through the system so far, according to the report.\n\nThe revised arrangement is intended to ensure that approved beneficiaries do not miss out on the financial assistance while the authorities work to resolve the technical issues affecting wallet-based transfers.\n\nLaunched by the Delhi government in August this year, the Delhi Lakshmi Yojana is a financial assistance programme aimed at providing \u20b9 2,500 every month to eligible women from economically weaker households.\n\nThe scheme, introduced by the BJP-led government under Chief Minister Rekha Gupta , was among the party's key promises ahead of the Delhi Assembly elections. It aims to cover around 17 lakh women and was allocated \u20b9 5,110 crore in the 2026-27 Budget.\n\nAccording to the scheme's guidelines, women between 21 and 60 years of age belonging to families with an annual income of up to \u20b9 2.5 lakh can apply, subject to other eligibility conditions. The applicant must be the eldest eligible woman in the household and meet the prescribed Delhi residency requirements.\n\nThe programme is designed to provide women with financial assistance while encouraging savings and greater financial independence.\n\nUnder the original payment structure, beneficiaries were supposed to receive \u20b9 1,000 every month through a CBDC wallet, while the remaining \u20b9 1,500 would be deposited into a recurring deposit (RD) or fixed deposit account.", "source": "LiveMint Money", "pub_date_str": "28 Nov 2026, 08:47 PM IST", "pub_date_relative": "1h ago"}, {"title": "Can Vaibhav Sooryavanshi Conquer Test Cricket Too? Here's What Alastair Cook Thinks", "full_content": "Former England skipper hails the teenager's extraordinary power-hitting, hopes he replicates his white-ball success in Test cricket; Cook also ranks India as the world's top all-format side.", "source": "NDTV Profit", "pub_date_str": "28 Nov 2026, 08:45 PM IST", "pub_date_relative": "1h ago"}, {"title": "Binance receives preliminary approval for Asia hub in Bhutan", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Nov 2026, 08:44 PM IST", "pub_date_relative": "1h ago"}, {"title": "Indian IT Can Now Grow Without Hiring More People. Nasscom Explains What That Means For Jobs", "full_content": "AI expected to reshape the traditional growth model of Indian IT companies, with revenue expansion becoming less dependent on hiring more employees.", "source": "NDTV Profit", "pub_date_str": "28 Nov 2026, 08:44 PM IST", "pub_date_relative": "1h ago"}, {"title": "OM: Operation Mole Box Office Collection Day 9: Dhanush-Mammootty Starrer Mints This Amount", "full_content": "The Tamil version brought in more than three-fourths of Saturday's earnings so far. The film closed its first week with the bulk of its earnings coming from the opening weekend.", "source": "NDTV Profit", "pub_date_str": "28 Nov 2026, 08:42 PM IST", "pub_date_relative": "1h ago"}, {"title": "Dreaming of early retirement with \u20b910 crore? Why a \u20b960,000 SIP may fall short", "full_content": "Retiring by 35 or 40 with a corpus of \u20b9 10 crore has become a popular goal for young, high-earning Indians. But how much do you actually have to invest each month to get there? According to rediffGURU Janak Patel, a certified financial planner and founder and CEO of InfiniumWealth, putting in about \u20b9 60,000 a month is likely to get you only a fraction of that target.\n\nFIRE stands for Financial Independence, Retire Early . The idea is to save and invest aggressively in your 20s and 30s, so you build a corpus big enough to live on decades before the usual retirement age. Many people who follow it want the freedom to travel, switch careers, or stop working altogether.\n\nJanak Patel looked at a portfolio built on roughly \u20b9 60,000 a month in fresh investments, on top of existing PPF and insurance contributions. Assuming average market growth, he estimated it would grow to about \u20b9 1 crore in 13 years and to a little over \u20b9 2 crore in 18 years. For someone who starts at 22, that means age 35 and age 40. Both figures are far below \u20b9 10 crore.\n\nTo reach \u20b9 10 crore by 35, you would need to invest about \u20b9 2.5 lakh more every month. If the target is 40, the extra amount drops to about \u20b9 1 lakh a month. Notably, these are rough estimates, since an exact figure depends on several more personal details, but they give a realistic sense of the effort involved.\n\nCompounding needs time. The five extra years between 35 and 40 bring the additional monthly investment down from \u20b9 2.5 lakh to \u20b9 1 lakh. That is why planners encourage people to start early and stay invested longer where they can.\n\nPicking a round number is not enough. A proper target comes from working out your personal needs and accounting for inflation .", "source": "LiveMint Money", "pub_date_str": "28 Nov 2026, 08:38 PM IST", "pub_date_relative": "1h ago"}, {"title": "La Liga Weekend Live Streaming: Check Schedule, Table Ahead Of Matchweek 14", "full_content": "Check the dates, kick-off timings, venues and live-streaming details for Real Madrid and Barcelona's La Liga Matchday 14 fixtures in India.", "source": "NDTV Profit", "pub_date_str": "28 Nov 2026, 08:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "I\u2019m in my 70s and buying a new BMW X1. Should I put my only son on the title?", "full_content": "\u201cGiven my age, I never make a major new purchase without thinking about the future.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "28 Nov 2026, 08:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "Gold, silver and platinum prices rise as demand for precious metals strengthens; key levels to watch", "full_content": "Livemint Published 28 Nov 2026, 08:27 PM IST Prefer Livemint on Google Gold, silver and platinum prices advanced as demand for precious metals strengthened amid improving investor appetite for risk assets and gains in US equity markets. Buying interest in artificial intelligence (AI)-related stocks supported the broader market sentiment during a shortened trading session in the US.\n\nAccording to a report by FX Empire , gold has remained sensitive to changes in global risk appetite, with its traditional safe-haven appeal yet to return decisively. The precious metal could continue to witness volatility in the coming months as investors assess developments in financial markets and movements in bond yields and the US dollar .\n\nGold gained despite an increase in US Treasury yields and a stronger US dollar, which would typically weigh on dollar-denominated commodities.\n\nThe yield on two-year US Treasury bonds climbed above 4.69%, while the 10-year Treasury yield moved towards 4.93%. At the same time, the US dollar strengthened against a basket of major currencies, supported by rising bond yields.\n\nA stronger dollar generally makes gold more expensive for investors holding other currencies, potentially reducing demand. However, these developments did not put significant pressure on gold during the trading session, as investors focused on improving risk appetite.\n\nAccording to FX Empire , gold is attempting to establish a position above the $3,630-$3,650 resistance range. A sustained move above this zone could open the way towards the next resistance level of $3,780-$3,800.\n\nOn the downside, a fall below $3,600 could push gold prices towards the next support range of $3,500-$3,520.\n\nSilver also recorded strong gains as the gold-silver ratio declined below the 84.00 mark.", "source": "LiveMint Markets", "pub_date_str": "28 Nov 2026, 08:27 PM IST", "pub_date_relative": "1h ago"}, {"title": "Indian Investors Are Buying The US Dip. Nvidia Orders On Groww Jump 15x Amid November Crash", "full_content": "Orders for NVIDIA shares on Groww increased more than 15-fold during November's US market correction. However, the platform has not disclosed how many orders resulted in completed trades.", "source": "NDTV Profit", "pub_date_str": "28 Nov 2026, 08:26 PM IST", "pub_date_relative": "1h ago"}, {"title": "Is now the right time to invest in contra funds? How this strategy works & what risks investors should consider", "full_content": "Contra mutual funds invest in companies that have fallen out of favour with the market but may have stronger underlying fundamentals. With Indian equity markets undergoing a time correction and valuations moderating across sectors, fund managers see potential opportunities. However, the strategy requires patience and the ability to withstand higher volatility.\n\nUnlike conventional equity funds that may follow popular market themes, contra funds look for businesses where negative sentiment may have created a gap between stock prices and underlying fundamentals. Vrijesh Kasera, fund manager at Mirae Asset Mutual Fund, believes the current environment offers opportunities for this strategy. However, he cautions that investors must understand its risks, investment approach and suitability before committing money.\n\nContra mutual funds follow a contrarian investment strategy, identifying companies that are temporarily out of favour but have the potential to recover. Fund managers assess whether the reasons behind a stock's underperformance are temporary or indicate deeper structural problems.\n\nThese funds differ from value funds. While value investing primarily examines whether a stock is reasonably priced, contra investing also evaluates whether the market's perception of a business is misplaced.\n\n\"A value fund, before making an investment, will typically examine if the stock is reasonably priced. Apart from this question, a contra fund also examines whether the market's view of this business is off the mark, and whether the issues are temporary rather than structural,\" Kasera said.\n\nHe explained that contra portfolios combine growth and value ideas, with a tilt towards growth. These include quality businesses that have been temporarily de-rated, as well as cyclical companies and turnaround opportunities approaching the bottom of their business cycles.\n\nAnother distinguishing feature is their bottom-up investment approach.", "source": "LiveMint Money", "pub_date_str": "28 Nov 2026, 08:23 PM IST", "pub_date_relative": "1h ago"}, {"title": "Gold price forecast: Can precious metal fall below \u20b91,00,000 per 10 grams in the near-term? Experts' views", "full_content": "Gold price forecast : Gold prices have witnessed a sharp correction after hitting record highs earlier this year, raising concerns among investors about how much further the yellow metal could fall.\n\nOn Multi Commodity Exchange (MCX), the precious metal witnessed a sharp crash in November, falling nearly 13% during the month amid a stronger US dollar, elevated bond yields and expectations of further interest rate hikes by the US Federal Reserve. The December gold futures contract slipped to a low of \u20b9 1,17,906 per 10 grams on November 26, before staging a strong rebound.\n\nOver the next two sessions, gold recovered \u20b9 8,345 per 10 grams, rising nearly 7.1% from its recent low to touch an intraday high of \u20b9 1,26,251 on November 27.\n\nGold prices have faced pressure from expectations of a more hawkish US Federal Reserve, elevated bond yields and a stronger US dollar. The prospect of higher interest rates increases the opportunity cost of holding non-yielding assets such as gold, prompting some investors to shift towards interest-bearing investments.\n\nAnother factor behind the correction has been selling by futures funds and profit booking after the metal's sharp rally earlier this year. According to Ashish Rajodiya, Head of Commodities at PL Capital, the recent selling has largely been driven by futures funds and concerns over Fed rate hikes rather than long-term investors. He also noted that physical buyers have entered the market during the decline.\n\nHowever, structural factors continue to support gold prices. Central bank purchases, global gold ETF inflows, geopolitical uncertainty and demand for safe-haven assets remain important drivers.", "source": "LiveMint Markets", "pub_date_str": "28 Nov 2026, 08:18 PM IST", "pub_date_relative": "1h ago"}, {"title": "Kimberly-Clark director sells $5.24M in company shares", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Nov 2026, 08:15 PM IST", "pub_date_relative": "1h ago"}, {"title": "Adani Ahmedabad Marathon 2026: Over 32,000 Runners To Participate In #Run4OurSoldiers", "full_content": "Organised by Adani Sportsline under the theme #Run4OurSoldiers, this will be the tenth edition of the marathon to pay tributes to India's armed forces", "source": "NDTV Profit", "pub_date_str": "28 Nov 2026, 08:15 PM IST", "pub_date_relative": "1h ago"}, {"title": "'It's Actually Defamation': Binance Founder CZ Slams Netflix's FTX Drama The Altruists", "full_content": "Changpeng Zhao says the series made him \"the villain\" to sway viewers outside crypto, and that he is still taking advice on what to do about it.", "source": "NDTV Profit", "pub_date_str": "28 Nov 2026, 08:15 PM IST", "pub_date_relative": "1h ago"}, {"title": "Yeh Prem Mol Liya Vs Gunmaaster G9 Box Office Collection Day 2: Ayushmann Starrer Or Emraan Hashmi's Film, Who Took The Lead?", "full_content": "Gunmaaster G9 is playing in more shows on both days, but Yeh Prem Mol Liya has brought in more money so far. Both films released on November 27.", "source": "NDTV Profit", "pub_date_str": "28 Nov 2026, 08:11 PM IST", "pub_date_relative": "1h ago"}, {"title": "He fought the Education Department \u2014 and won back his student loan forgiveness credit. What other borrowers can learn", "full_content": "Earlier this year, Nicholas Yund was months away from having his federal student loans forgiven . Then, in early August, the University of Minnesota employee logged into his account and saw his forgiveness date pushed back by nearly two years.\n\n\"I could barely breathe,\" said Yund, 45. \"That's when I went online to various Facebook and Reddit groups and saw it was happening to thousands of other people .\"\n\nYund's qualifying-payment count fell from 116 to 93, leaving him 27 payments short of the 120 required for Public Service Loan Forgiveness , a federal program created in 2007 that cancels the remaining student loan debt of borrowers working for a government or nonprofit employer.\n\nThe reduced payment counts for Yund and other PSLF borrowers result from what the U.S. Department of Education has said is an effort to correct payment-count errors made during the Biden administration.\n\n\"These errors resulted in inaccurate payment counts for some borrowers,\" a department spokesperson wrote to CNBC in an email. \"The Department remains committed to ensuring that every qualifying payment is properly credited to a borrower's account.\"\n\nThe sudden reductions in payment counts have left borrowers scrambling to determine which months were removed and whether their current timelines are correct.\n\nThe American Federation of Teachers recently sued the Trump administration over its management of the PSLF program, claiming that it is unlawfully blocking tens of thousands of borrowers from student loan forgiveness . Filed Oct. 30, the suit is still pending.\n\nFor borrowers nearing the finish line, losing qualifying months can mean staying in repayment \u2014 and in qualifying public service work \u2014 for years longer than expected. It can also delay other financial goals.", "source": "CNBC Top News", "pub_date_str": "28 Nov 2026, 08:04 PM IST", "pub_date_relative": "1h ago"}, {"title": "The Iran war could shatter rising expectations of surplus oil supply in coming months", "full_content": "Crude oil prices have sold off sharply in November as investors see a recovery in Middle East exports tipping the market into a surplus for the first time since the Iran war began.\n\nBrent crude futures, the international benchmark, are down about 20% after approaching wartime highs in late October when the contract hit $118 a barrel.\n\nU.S. West Texas Intermediate has also fallen about 21% after topping $104 a barrel in the same period. Brent closed at $95.44 a barrel Friday while WTI settled at $83.08.\n\nU.S. retail gasoline prices have fallen well below $4 a gallon and diesel has eased below $6 a gallon.\n\nIn October, investors were pricing in the risk of a major military escalation in the Persian Gulf after the U.S. midterm elections . But President Donald Trump has held back so far from launching renewed military strikes against Iran after the Democrats wiped out Republican congressional majorities.\n\nThe selloff this month has likely gone too far, Giovanni Staunovo, a strategist at UBS, wrote in a note clients. The market has become \"too comfortable with the supply outlook,\" Staunovo said. \"The rebound in Gulf exports should not be mistaken for a normalization of the oil market,\" the analyst said.\n\nThe International Energy Agency has forecast an oil surplus beginning in the fourth quarter. This would represent a major turning point nine months after the Iran war triggered the largest supply disruption in the history of the oil market.\n\nGoldman Sachs sees a crude surplus of 2 million barrels per day in 2027 as Gulf producers continue to adapt their supply chains to war in the Middle East . Commodity and ship tracking firm Kpler sees oversupply of 3 million bpd next year.", "source": "CNBC Top News", "pub_date_str": "28 Nov 2026, 08:04 PM IST", "pub_date_relative": "1h ago"}, {"title": "You need to replace your sneakers every 6 months \u2014 37+ Black Friday sneaker deals to shop now - NBC News", "full_content": "You need to replace your sneakers every 6 months \u2014 37+ Black Friday sneaker deals to shop now NBC News Run, don\u2019t walk: Hoka\u2019s Black Friday sale is extended. Shop shoes for up to 42% off CNN Best DSW Black Friday Deals: Ugg Slippers, Boot Doorbusters, More TODAY.com Hoka Black Friday shoe deals have huge discounts on hundreds of sneaker options including Cliftons, Bondis and more Yahoo 10 Black Friday Sneaker Deals on Nike, Hoka, and More at Amazon People.com", "source": "Google News Business", "pub_date_str": "28 Nov 2026, 07:58 PM IST", "pub_date_relative": "1h ago"}, {"title": "What\u2019s the most tax-efficient way to donate to charity?", "full_content": "How to make your donations beneficial for both you and the recipient", "source": "MarketWatch Top Stories", "pub_date_str": "28 Nov 2026, 07:57 PM IST", "pub_date_relative": "1h ago"}, {"title": "Health insurer rejects man\u2019s \u20b91 lakh claim over missing papers, Gurgaon consumer court orders full payment with interest", "full_content": "A Gurgaon consumer commission has ordered Oriental Insurance Company and Health Insurance TPA of India Ltd to pay \u20b9 1,02,918 to a policyholder whose medical insurance claim was rejected over missing documents.\n\nThe commission said an insurance company cannot reject a medical claim by simply saying that documents were not received when the customer has provided proof that the papers were submitted and questions raised by the insurer were answered.\n\nThe commission also directed the two companies to pay 9% annual interest on the claim amount from 26 November, 2025, when the complaint was filed, until the payment is made.\n\nApart from this, the companies have been asked to pay \u20b9 30,000 as compensation for mental harassment and \u20b9 11,000 towards legal expenses.\n\nThe case involves Krishan Gopal, who had purchased an Oriental Insurance Bank Saathi mediclaim policy. The policy offered insurance cover of \u20b9 4 lakh, for which he paid an annual premium of \u20b9 29,684.\n\nGopal underwent surgery for a urinary problem at Pushpanjali Hospital in Gurgaon in March 2025. He was admitted to the hospital twice within a week and spent a total of \u20b9 1,02,918 on his treatment.\n\nAfter his treatment, he submitted his medical claim along with the required papers. These included the claim form, hospital discharge summaries, medical bills, payment receipts and test reports.\n\nThe insurance company later asked him to provide answers to certain questions about his treatment and claim.", "source": "LiveMint Money", "pub_date_str": "28 Nov 2026, 07:52 PM IST", "pub_date_relative": "1h ago"}, {"title": "ManpowerGroup director Ulice Payne Jr. sells $79,628 in stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Nov 2026, 07:46 PM IST", "pub_date_relative": "2h ago"}, {"title": "Argentina loses bid to halt Falklands oil drilling", "full_content": "UN-backed court rejects Javier Milei\u2019s attempt to stymie the islands\u2019 nascent offshore oil industry", "source": "FT Markets", "pub_date_str": "28 Nov 2026, 07:37 PM IST", "pub_date_relative": "2h ago"}, {"title": "Wall Street's Most Feared Investor Lost $23 Billion. The Mistake Is One Retail Investors Make Too", "full_content": "The decline in Icahn's wealth is particularly in focus as the broader US stock market has surged as Dow has jumped around 40% to 46%, the Nasdaq climbed over 50%, while S&P 500 advanced up to 58%, primarily driven by AI trade.", "source": "NDTV Profit", "pub_date_str": "28 Nov 2026, 07:33 PM IST", "pub_date_relative": "2h ago"}, {"title": "My husband secretly sends his ex-wife $1,500 a month after she lost her job. We have $2.4 million saved. Has he lied by omission?", "full_content": "\u201cHe explained that he wasn\u2019t trying to hide the payment, but his former wife lost her job in a medical billing company.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "28 Nov 2026, 07:31 PM IST", "pub_date_relative": "2h ago"}, {"title": "AI data center boom strains construction labor across the U.S.", "full_content": "President Donald Trump said last week that American companies will face a \"tremendous tax\" for building data centers outside of the U.S.\n\n\"We have a lot of places that want them badly, and they're great places. They have energy, and they have everything,\" Trump said at the end of that week's major tech stock selloff .\n\nAmid the nationwide public backlash against data centers and the ongoing market turmoil affecting the artificial intelligence industry itself, there's a more pressing problem with Trump's demand \u2014 a worker shortage.\n\nAcross the country, tech companies are already competing for a limited pool of electricians, plumbers and other skilled construction workers needed to erect the massive facilities powering the AI boom. Associated Builders and Contractors (ABC) estimates the construction industry needs to attract 349,000 net new workers in 2026 just to keep pace with demand.\n\nThe pressure is hitting home in Abilene, Texas, where thousands of workers have descended on the region to build massive data center projects. RV parks and temporary housing have expanded to accommodate the influx, while local homebuilders and contractors say they're losing skilled workers to data center jobs offering substantially higher pay.\n\nFor Abilene homebuilder Gene Lantrip, the boom has become what he calls \"a two-edged sword.\" Data centers are bringing new business and residents to the city, while making it harder and more expensive to find the workers.\n\nSkilled laborers have been flocking to Texas in droves since 2025 to construct massive data center facilities like the $500 billion Stargate Project for OpenAI, Oracle and Japan's SoftBank. The vast prairie surrounding Abilene is now adorned with mile-wide construction sites and a collection of RV parks and mobile homes to accommodate the region's new blue-collar residents.\n\nTech giants have pitched these gigantic data center facilities as necessary to train and run powerful foundation models.", "source": "CNBC World Economy", "pub_date_str": "28 Nov 2026, 07:30 PM IST", "pub_date_relative": "2h ago"}, {"title": "Mint Money Festival | Vijay Kedia outlines 10 investing rules for younger investors", "full_content": "Ace investor Vijay Kedia outlined 10 rules for investors at the Mint Money Festival 2026 in Mumbai on Saturday, translating conventional market practices into contemporary phrasing for younger participants.\n\nKedia started with realized gains versus unrealized holdings. \u201cOne was that your investment belongs to the market, and your profit belongs to you. So, I usually say that your demat statement belongs to the market, and your bank statement belongs to you, so in Gen Z's world, there is no cap.\u201d\n\nHe advised investors across generations to build income outside equities before taking market exposure. \u201cCreate a fixed income outside the market. Please remember, all investors, newcomer or old or whatever Gen Z or Alpha or Beta or Gamma, whatever you are. Please remember, create a fixed income outside the market. So a steady income outside the market is the real flex.\u201d\n\nKedia urged investors to conduct their own research rather than acting on informal tips or penny-stock rumours. \u201cBe updated and well informed at all times. In Gen Z words, it is said that stay in the loop. DYOR. That means do your own research.\u201d\n\nOn portfolio sizing, Kedia told investors to allocate only a portion of their savings rather than committing everything at once. \u201cInvest a part of your savings in the market. Invest a part of your savings in the market. You should know the truth about asset allocation. So don't YOLO at all.\u201d\n\nHe warned against using borrowed funds, pointing to recent movements in mid- and small-cap stocks. \u201cDo not invest with borrowed money. Please remember, you have seen what has happened in this market in the last two years, especially in the last two-three months. What has happened to the mid-caps and small-caps and all? Never do that. That is the straight way to go to hell. Remember this thing. So do not invest with borrowed money.", "source": "LiveMint Markets", "pub_date_str": "28 Nov 2026, 07:26 PM IST", "pub_date_relative": "2h ago"}, {"title": "Jefferies says this dip is a rare tech buying opportunity. 5 stocks to pick up now", "full_content": "The investment bank highlighted picks across the technology universe.", "source": "CNBC Top News", "pub_date_str": "28 Nov 2026, 07:26 PM IST", "pub_date_relative": "2h ago"}, {"title": "Gold Price Drop Affects Your Existing Gold Loan Even If You Pay EMI On Time: Check How", "full_content": "Loan-to-Value (LTV) ratio determines how much money you can borrow against the gold you pledge. When gold price drops, this LTV comes under scanner, posing risk to your existing loan.", "source": "NDTV Profit", "pub_date_str": "28 Nov 2026, 07:23 PM IST", "pub_date_relative": "2h ago"}, {"title": "Gold Price Has Fallen From Rs 1.8 Lakh To Rs 1.25 Lakh. Where It Could Be Six Months From Now", "full_content": "Gold has fallen nearly 31% from its January 2026 peak to around Rs 1.25 lakh per 10 grams. Experts expect interest rates and dollar strength to influence its recovery over the next six months.", "source": "NDTV Profit", "pub_date_str": "28 Nov 2026, 07:23 PM IST", "pub_date_relative": "2h ago"}, {"title": "Gold price forecast: Analyst spots a major bottom after 104-day cycle, sees prices hitting $10,000 by 2030", "full_content": "Gold may have reached a significant turning point after months of correction, according to a technical analyst who believes a pattern in historical price movements points to the end of the latest sell-off. If the forecast holds, the precious metal could be preparing for another leg of its long-term rally, with prices potentially reaching $10,000 an ounce by 2030.\n\nIn an analysis published on November 27, AG Thorson, a technical analyst at FXEmpire, said gold's correction may have ended on November 25. His assessment is based on what he describes as symmetry in successive market cycles following the metal's sharp rally in 2025.\n\nHowever, the prediction is based on technical patterns and does not establish that gold has definitively bottomed. Investors will need to watch whether prices sustain their recovery and whether broader economic conditions support renewed demand for bullion.\n\nAccording to Thorson, gold's recent price movement has followed a strikingly similar pattern across successive market cycles.\n\nGold's sharp rally began in September 2025 and lasted 104 trading days. The initial correction that followed, leading to a mid-year low in 2026, also lasted 104 trading days.\n\nThe latest correction appears to have followed the same pattern. Thorson pointed out that gold reached what he believes could be its final corrective low on November 25, exactly 104 trading days after the late-June low.\n\nThis symmetry, he argued, increases the likelihood that the prolonged correction is over and a fresh upward phase could begin.\n\nThorson also believes the 2026 correction could represent the halfway point of a broader six-year bull market, drawing a parallel with the market cycle following the 2008 financial crisis.", "source": "LiveMint Money", "pub_date_str": "28 Nov 2026, 07:20 PM IST", "pub_date_relative": "2h ago"}, {"title": "Ramayana Box Office Collection Day 24: Ranbir Kapoor's Epic Crosses Historic Milestone In Fourth Week", "full_content": "The Nitesh Tiwari film went past the landmark on its fourth Friday and added to it on Saturday. Hindi continues to bring in most of the earnings, with Tamil and Kannada following.", "source": "NDTV Profit", "pub_date_str": "28 Nov 2026, 07:19 PM IST", "pub_date_relative": "2h ago"}, {"title": "Billions on the line for Berkshire utility as Oregon's high court reviews wildfire claims", "full_content": "(This is the Warren Buffett Watch newsletter, news and analysis on all things Warren Buffett and Berkshire Hathaway. You can sign up here to receive it every Friday evening in your inbox.)\n\nBerkshire Hathaway's PacifiCorp and attorneys for thousands of plaintiffs are welcoming a decision by Oregon's Supreme Court to widen its review of a 2023 lower court trial in which a jury awarded more than one billion in damages over four wildfires in 2020.\n\nThe jury found the utility negligently failed to shut down power lines during a powerful windstorm, allowing its equipment to contribute to the fires.\n\nIn April, a state appellate court overturned that verdict , ruling the trial judge incorrectly told jurors evidence presented at the trial, which directly involved a small number of claimants, applied to a class of thousands of other plaintiffs.\n\nThe plaintiffs appealed that decision to the Oregon Court of Appeals Court where oral arguments focused on the jury instructions.\n\nBut now the state's top court will consider all the objections to the original trial that have been raised by both sides, including whether the judge should have allowed it to be a class action suit to begin with.\n\nIf the plaintiffs prevail, PacifiCorp could face tens of billions of dollars in damage claims.\n\nIf the utility wins, all the litigation could go back to square one.", "source": "CNBC Top News", "pub_date_str": "28 Nov 2026, 07:16 PM IST", "pub_date_relative": "2h ago"}, {"title": "23 Years Later, Kal Ho Na Ho\u2019s Making Video Brings Back Memories Of Aman, Naina And Rohit", "full_content": "The story of Naina, Aman and Rohit continues to bring back memories for fans, even 23 years after its release.", "source": "NDTV Profit", "pub_date_str": "28 Nov 2026, 07:15 PM IST", "pub_date_relative": "2h ago"}, {"title": "LIC Employee Deposits Rs 1.17 Crore Cash From Selling Coconuts. What Saved Her From A Huge Tax Bill", "full_content": "The Income Tax Department treated the entire cash deposited in her bank accounts as unexplained money. The Chennai tribunal, however, found that her bank transactions, updated tax return and confirmations from coconut buyers supported her claim of running a trading business.", "source": "NDTV Profit", "pub_date_str": "28 Nov 2026, 07:14 PM IST", "pub_date_relative": "2h ago"}, {"title": "Looking for affordable finds this Black Friday? These deals are all under $50 - NBC News", "full_content": "Looking for affordable finds this Black Friday? These deals are all under $50 NBC News Behold, Black Friday Deals That Are Actually Good | Reviews by Wirecutter The New York Times Almost every great Black Friday deal is still happening this weekend The Verge Of All the Black Friday Deals, These Are the Ones We\u2019re Actually Shopping Vogue I tracked down the biggest price drops you can find this Black Friday CNN", "source": "Google News Business", "pub_date_str": "28 Nov 2026, 07:12 PM IST", "pub_date_relative": "2h ago"}, {"title": "274 Ancient Sculptures, One Village's Refusal: Why Jageshwar Is Fighting ASI's Move To Delhi", "full_content": "A team from the Archaeological Survey of India began the process of moving five to six rare idols to the Delhi Museum. Locals, priests and traders, backed by BJP and Congress leaders, have written to the Prime Minister.", "source": "NDTV Profit", "pub_date_str": "28 Nov 2026, 07:09 PM IST", "pub_date_relative": "2h ago"}, {"title": "Supreme Court will decide whether assault weapons bans violate the Second Amendment", "full_content": "Nicole Hockley was still in a fog of grief when she carried a photo of her 6-year-old son Dylan to the Connecticut Capitol. The image of his bright blue eyes and sweep of brown hair was marked with the year he was born and the year he was killed by shots from an AR-15-style rifle.\n\nShe was part of a wave of people who helped persuade the state to expand its ban on firearms like the one used to massacre 20 children, including Dylan, and six staff members at Sandy Hook Elementary School in 2012.\n\nMore than a decade later, she remains convinced that the assault weapons ban has helped prevent more mass school shootings.\n\n\"This isn't just about laws. This is about people, and this is about ensuring that people are protected,\" said Hockley, who co-founded the group Sandy Hook Promise.\n\nShe is heading to Washington next week, along with other families and survivors of deadly mass shootings. The conservative-majority Supreme Court will hear arguments Wednesday over whether state and local assault weapons bans violate the Second Amendment's right \"to keep and bear arms,\" putting the justices at the center of one of the most bitterly contested issues in firearms law.\n\nGun rights advocates backed by the Trump administration say it is unconstitutional to ban the nation's most widely owned rifle, which is involved in a relatively small portion of overall gun violence.\n\n\"This is the biggest and most pernicious problem we have in the gun control space,\" said Bill Sack, senior director of legal operations at the Second Amendment Foundation. \"We all view this as the Super Bowl of gun rights for the time being.\"\n\nAbout a dozen states have similar laws banning weapons such as the AR-15. They cover major cities including New York, Los Angeles and Chicago, where a county-level ban is also before the high court next week. A federal law restricting their sale and manufacture expired in 2004.", "source": "CNBC Top News", "pub_date_str": "28 Nov 2026, 07:08 PM IST", "pub_date_relative": "2h ago"}], "cfa": [{"title": "How much salary hike do you need to beat inflation in India? What it means for your savings, MF SIPs, financial goals", "full_content": "A salary hike may look generous on paper, but it does not necessarily translate into higher purchasing power. As the cost of groceries, healthcare, education and housing rises, employees need to assess how much of their increment remains after inflation. That amount determines whether they can save, invest through mutual fund systematic investment plans (SIPs) and meet financial goals as household costs continue rising.\n\nAnshi Shrivastava, Head of Personal Finance Training at 1 Finance, said salaried employees should target an annual salary hike two to three percentage points higher than their personal inflation rate. For most households, this means an increment of around 9-10%, she said.\n\nA salary increase that only matches inflation maintains purchasing power; it does not improve it. However, the benchmark should not be limited to official retail inflation because household spending patterns differ.\n\n\u201cYour family has its own inflation rate, shaped by what you spend on,\u201d Shrivastava said. School fees and medical bills, for instance, may rise faster than grocery costs. A household with children or higher healthcare expenses may experience a sharper increase in its monthly budget than the headline inflation rate suggests.\n\nIndia\u2019s retail inflation was 6.09% in October 2026, while urban households reported perceived inflation of 8.4% in the Reserve Bank of India\u2019s September survey, according to the figures cited by Shrivastava.\n\nAn employee receiving a 9% increment when inflation is 6.09% gets a real increase in purchasing power of about 2.7%, not 9%.\n\nThe impact compounds over time. At 6% inflation, money loses half its purchasing power in about 12 years. \u20b9 1 lakh today would buy goods and services worth roughly \u20b9 31,000 in today\u2019s terms after 20 years, if inflation stays at that rate.\n\nA higher salary does not automatically lead to higher savings.", "source": "LiveMint Money", "pub_date_str": "28 Nov 2026, 09:40 PM IST", "pub_date_relative": "8m ago", "cfa_topics": ["Economics", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Bitcoin pares losses near $59,000 as ETF outflows extend eight-day streak", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Nov 2026, 08:51 PM IST", "pub_date_relative": "57m ago", "cfa_topics": ["Alternative Investments", "Portfolio Management"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Groww Says Anthropic's IPO Drew Over 1 Lakh Users In Hours, And That's Changed Its Plans", "full_content": "The platform says it will offer pre-orders for other sought-after global listings after the response to Anthropic's record-breaking Nasdaq debut.", "source": "NDTV Profit", "pub_date_str": "28 Nov 2026, 08:51 PM IST", "pub_date_relative": "57m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "What is Lakshmi Yojana? Delhi govt shifts \u20b92,500 aid to FDs till Jan after wallet glitches delay payout, says report", "full_content": "The Rekha Gupta-led Delhi government has decided to deposit the entire monthly assistance of \u20b9 2,500 into fixed deposits (FDs) until January 2027, instead of following the original payment arrangement involving a digital wallet and a savings component, The Indian Express reported.\n\nThe move comes after the planned Central Bank Digital Currency (CBDC) wallet mechanism encountered difficulties, with only 53 women receiving payments through the system so far, according to the report.\n\nThe revised arrangement is intended to ensure that approved beneficiaries do not miss out on the financial assistance while the authorities work to resolve the technical issues affecting wallet-based transfers.\n\nLaunched by the Delhi government in August this year, the Delhi Lakshmi Yojana is a financial assistance programme aimed at providing \u20b9 2,500 every month to eligible women from economically weaker households.\n\nThe scheme, introduced by the BJP-led government under Chief Minister Rekha Gupta , was among the party's key promises ahead of the Delhi Assembly elections. It aims to cover around 17 lakh women and was allocated \u20b9 5,110 crore in the 2026-27 Budget.\n\nAccording to the scheme's guidelines, women between 21 and 60 years of age belonging to families with an annual income of up to \u20b9 2.5 lakh can apply, subject to other eligibility conditions. The applicant must be the eldest eligible woman in the household and meet the prescribed Delhi residency requirements.\n\nThe programme is designed to provide women with financial assistance while encouraging savings and greater financial independence.\n\nUnder the original payment structure, beneficiaries were supposed to receive \u20b9 1,000 every month through a CBDC wallet, while the remaining \u20b9 1,500 would be deposited into a recurring deposit (RD) or fixed deposit account.", "source": "LiveMint Money", "pub_date_str": "28 Nov 2026, 08:47 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Indian IT Can Now Grow Without Hiring More People. Nasscom Explains What That Means For Jobs", "full_content": "AI expected to reshape the traditional growth model of Indian IT companies, with revenue expansion becoming less dependent on hiring more employees.", "source": "NDTV Profit", "pub_date_str": "28 Nov 2026, 08:44 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "OM: Operation Mole Box Office Collection Day 9: Dhanush-Mammootty Starrer Mints This Amount", "full_content": "The Tamil version brought in more than three-fourths of Saturday's earnings so far. The film closed its first week with the bulk of its earnings coming from the opening weekend.", "source": "NDTV Profit", "pub_date_str": "28 Nov 2026, 08:42 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Dreaming of early retirement with \u20b910 crore? Why a \u20b960,000 SIP may fall short", "full_content": "Retiring by 35 or 40 with a corpus of \u20b9 10 crore has become a popular goal for young, high-earning Indians. But how much do you actually have to invest each month to get there? According to rediffGURU Janak Patel, a certified financial planner and founder and CEO of InfiniumWealth, putting in about \u20b9 60,000 a month is likely to get you only a fraction of that target.\n\nFIRE stands for Financial Independence, Retire Early . The idea is to save and invest aggressively in your 20s and 30s, so you build a corpus big enough to live on decades before the usual retirement age. Many people who follow it want the freedom to travel, switch careers, or stop working altogether.\n\nJanak Patel looked at a portfolio built on roughly \u20b9 60,000 a month in fresh investments, on top of existing PPF and insurance contributions. Assuming average market growth, he estimated it would grow to about \u20b9 1 crore in 13 years and to a little over \u20b9 2 crore in 18 years. For someone who starts at 22, that means age 35 and age 40. Both figures are far below \u20b9 10 crore.\n\nTo reach \u20b9 10 crore by 35, you would need to invest about \u20b9 2.5 lakh more every month. If the target is 40, the extra amount drops to about \u20b9 1 lakh a month. Notably, these are rough estimates, since an exact figure depends on several more personal details, but they give a realistic sense of the effort involved.\n\nCompounding needs time. The five extra years between 35 and 40 bring the additional monthly investment down from \u20b9 2.5 lakh to \u20b9 1 lakh. That is why planners encourage people to start early and stay invested longer where they can.\n\nPicking a round number is not enough. A proper target comes from working out your personal needs and accounting for inflation .", "source": "LiveMint Money", "pub_date_str": "28 Nov 2026, 08:38 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Quantitative Methods", "Economics", "Financial Statement Analysis", "Portfolio Management"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "Gold, silver and platinum prices rise as demand for precious metals strengthens; key levels to watch", "full_content": "Livemint Published 28 Nov 2026, 08:27 PM IST Prefer Livemint on Google Gold, silver and platinum prices advanced as demand for precious metals strengthened amid improving investor appetite for risk assets and gains in US equity markets. Buying interest in artificial intelligence (AI)-related stocks supported the broader market sentiment during a shortened trading session in the US.\n\nAccording to a report by FX Empire , gold has remained sensitive to changes in global risk appetite, with its traditional safe-haven appeal yet to return decisively. The precious metal could continue to witness volatility in the coming months as investors assess developments in financial markets and movements in bond yields and the US dollar .\n\nGold gained despite an increase in US Treasury yields and a stronger US dollar, which would typically weigh on dollar-denominated commodities.\n\nThe yield on two-year US Treasury bonds climbed above 4.69%, while the 10-year Treasury yield moved towards 4.93%. At the same time, the US dollar strengthened against a basket of major currencies, supported by rising bond yields.\n\nA stronger dollar generally makes gold more expensive for investors holding other currencies, potentially reducing demand. However, these developments did not put significant pressure on gold during the trading session, as investors focused on improving risk appetite.\n\nAccording to FX Empire , gold is attempting to establish a position above the $3,630-$3,650 resistance range. A sustained move above this zone could open the way towards the next resistance level of $3,780-$3,800.\n\nOn the downside, a fall below $3,600 could push gold prices towards the next support range of $3,500-$3,520.\n\nSilver also recorded strong gains as the gold-silver ratio declined below the 84.00 mark.", "source": "LiveMint Markets", "pub_date_str": "28 Nov 2026, 08:27 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income", "Alternative Investments"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Indian Investors Are Buying The US Dip. Nvidia Orders On Groww Jump 15x Amid November Crash", "full_content": "Orders for NVIDIA shares on Groww increased more than 15-fold during November's US market correction. However, the platform has not disclosed how many orders resulted in completed trades.", "source": "NDTV Profit", "pub_date_str": "28 Nov 2026, 08:26 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Is now the right time to invest in contra funds? How this strategy works & what risks investors should consider", "full_content": "Contra mutual funds invest in companies that have fallen out of favour with the market but may have stronger underlying fundamentals. With Indian equity markets undergoing a time correction and valuations moderating across sectors, fund managers see potential opportunities. However, the strategy requires patience and the ability to withstand higher volatility.\n\nUnlike conventional equity funds that may follow popular market themes, contra funds look for businesses where negative sentiment may have created a gap between stock prices and underlying fundamentals. Vrijesh Kasera, fund manager at Mirae Asset Mutual Fund, believes the current environment offers opportunities for this strategy. However, he cautions that investors must understand its risks, investment approach and suitability before committing money.\n\nContra mutual funds follow a contrarian investment strategy, identifying companies that are temporarily out of favour but have the potential to recover. Fund managers assess whether the reasons behind a stock's underperformance are temporary or indicate deeper structural problems.\n\nThese funds differ from value funds. While value investing primarily examines whether a stock is reasonably priced, contra investing also evaluates whether the market's perception of a business is misplaced.\n\n\"A value fund, before making an investment, will typically examine if the stock is reasonably priced. Apart from this question, a contra fund also examines whether the market's view of this business is off the mark, and whether the issues are temporary rather than structural,\" Kasera said.\n\nHe explained that contra portfolios combine growth and value ideas, with a tilt towards growth. These include quality businesses that have been temporarily de-rated, as well as cyclical companies and turnaround opportunities approaching the bottom of their business cycles.\n\nAnother distinguishing feature is their bottom-up investment approach.", "source": "LiveMint Money", "pub_date_str": "28 Nov 2026, 08:23 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Gold price forecast: Can precious metal fall below \u20b91,00,000 per 10 grams in the near-term? Experts' views", "full_content": "Gold price forecast : Gold prices have witnessed a sharp correction after hitting record highs earlier this year, raising concerns among investors about how much further the yellow metal could fall.\n\nOn Multi Commodity Exchange (MCX), the precious metal witnessed a sharp crash in November, falling nearly 13% during the month amid a stronger US dollar, elevated bond yields and expectations of further interest rate hikes by the US Federal Reserve. The December gold futures contract slipped to a low of \u20b9 1,17,906 per 10 grams on November 26, before staging a strong rebound.\n\nOver the next two sessions, gold recovered \u20b9 8,345 per 10 grams, rising nearly 7.1% from its recent low to touch an intraday high of \u20b9 1,26,251 on November 27.\n\nGold prices have faced pressure from expectations of a more hawkish US Federal Reserve, elevated bond yields and a stronger US dollar. The prospect of higher interest rates increases the opportunity cost of holding non-yielding assets such as gold, prompting some investors to shift towards interest-bearing investments.\n\nAnother factor behind the correction has been selling by futures funds and profit booking after the metal's sharp rally earlier this year. According to Ashish Rajodiya, Head of Commodities at PL Capital, the recent selling has largely been driven by futures funds and concerns over Fed rate hikes rather than long-term investors. He also noted that physical buyers have entered the market during the decline.\n\nHowever, structural factors continue to support gold prices. Central bank purchases, global gold ETF inflows, geopolitical uncertainty and demand for safe-haven assets remain important drivers.", "source": "LiveMint Markets", "pub_date_str": "28 Nov 2026, 08:18 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Fixed Income", "Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "'It's Actually Defamation': Binance Founder CZ Slams Netflix's FTX Drama The Altruists", "full_content": "Changpeng Zhao says the series made him \"the villain\" to sway viewers outside crypto, and that he is still taking advice on what to do about it.", "source": "NDTV Profit", "pub_date_str": "28 Nov 2026, 08:15 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "The Iran war could shatter rising expectations of surplus oil supply in coming months", "full_content": "Crude oil prices have sold off sharply in November as investors see a recovery in Middle East exports tipping the market into a surplus for the first time since the Iran war began.\n\nBrent crude futures, the international benchmark, are down about 20% after approaching wartime highs in late October when the contract hit $118 a barrel.\n\nU.S. West Texas Intermediate has also fallen about 21% after topping $104 a barrel in the same period. Brent closed at $95.44 a barrel Friday while WTI settled at $83.08.\n\nU.S. retail gasoline prices have fallen well below $4 a gallon and diesel has eased below $6 a gallon.\n\nIn October, investors were pricing in the risk of a major military escalation in the Persian Gulf after the U.S. midterm elections . But President Donald Trump has held back so far from launching renewed military strikes against Iran after the Democrats wiped out Republican congressional majorities.\n\nThe selloff this month has likely gone too far, Giovanni Staunovo, a strategist at UBS, wrote in a note clients. The market has become \"too comfortable with the supply outlook,\" Staunovo said. \"The rebound in Gulf exports should not be mistaken for a normalization of the oil market,\" the analyst said.\n\nThe International Energy Agency has forecast an oil surplus beginning in the fourth quarter. This would represent a major turning point nine months after the Iran war triggered the largest supply disruption in the history of the oil market.\n\nGoldman Sachs sees a crude surplus of 2 million barrels per day in 2027 as Gulf producers continue to adapt their supply chains to war in the Middle East . Commodity and ship tracking firm Kpler sees oversupply of 3 million bpd next year.", "source": "CNBC Top News", "pub_date_str": "28 Nov 2026, 08:04 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "You need to replace your sneakers every 6 months \u2014 37+ Black Friday sneaker deals to shop now - NBC News", "full_content": "You need to replace your sneakers every 6 months \u2014 37+ Black Friday sneaker deals to shop now NBC News Run, don\u2019t walk: Hoka\u2019s Black Friday sale is extended. Shop shoes for up to 42% off CNN Best DSW Black Friday Deals: Ugg Slippers, Boot Doorbusters, More TODAY.com Hoka Black Friday shoe deals have huge discounts on hundreds of sneaker options including Cliftons, Bondis and more Yahoo 10 Black Friday Sneaker Deals on Nike, Hoka, and More at Amazon People.com", "source": "Google News Business", "pub_date_str": "28 Nov 2026, 07:58 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Wall Street's Most Feared Investor Lost $23 Billion. The Mistake Is One Retail Investors Make Too", "full_content": "The decline in Icahn's wealth is particularly in focus as the broader US stock market has surged as Dow has jumped around 40% to 46%, the Nasdaq climbed over 50%, while S&P 500 advanced up to 58%, primarily driven by AI trade.", "source": "NDTV Profit", "pub_date_str": "28 Nov 2026, 07:33 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "AI data center boom strains construction labor across the U.S.", "full_content": "President Donald Trump said last week that American companies will face a \"tremendous tax\" for building data centers outside of the U.S.\n\n\"We have a lot of places that want them badly, and they're great places. They have energy, and they have everything,\" Trump said at the end of that week's major tech stock selloff .\n\nAmid the nationwide public backlash against data centers and the ongoing market turmoil affecting the artificial intelligence industry itself, there's a more pressing problem with Trump's demand \u2014 a worker shortage.\n\nAcross the country, tech companies are already competing for a limited pool of electricians, plumbers and other skilled construction workers needed to erect the massive facilities powering the AI boom. Associated Builders and Contractors (ABC) estimates the construction industry needs to attract 349,000 net new workers in 2026 just to keep pace with demand.\n\nThe pressure is hitting home in Abilene, Texas, where thousands of workers have descended on the region to build massive data center projects. RV parks and temporary housing have expanded to accommodate the influx, while local homebuilders and contractors say they're losing skilled workers to data center jobs offering substantially higher pay.\n\nFor Abilene homebuilder Gene Lantrip, the boom has become what he calls \"a two-edged sword.\" Data centers are bringing new business and residents to the city, while making it harder and more expensive to find the workers.\n\nSkilled laborers have been flocking to Texas in droves since 2025 to construct massive data center facilities like the $500 billion Stargate Project for OpenAI, Oracle and Japan's SoftBank. The vast prairie surrounding Abilene is now adorned with mile-wide construction sites and a collection of RV parks and mobile homes to accommodate the region's new blue-collar residents.\n\nTech giants have pitched these gigantic data center facilities as necessary to train and run powerful foundation models.", "source": "CNBC World Economy", "pub_date_str": "28 Nov 2026, 07:30 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Mint Money Festival | Vijay Kedia outlines 10 investing rules for younger investors", "full_content": "Ace investor Vijay Kedia outlined 10 rules for investors at the Mint Money Festival 2026 in Mumbai on Saturday, translating conventional market practices into contemporary phrasing for younger participants.\n\nKedia started with realized gains versus unrealized holdings. \u201cOne was that your investment belongs to the market, and your profit belongs to you. So, I usually say that your demat statement belongs to the market, and your bank statement belongs to you, so in Gen Z's world, there is no cap.\u201d\n\nHe advised investors across generations to build income outside equities before taking market exposure. \u201cCreate a fixed income outside the market. Please remember, all investors, newcomer or old or whatever Gen Z or Alpha or Beta or Gamma, whatever you are. Please remember, create a fixed income outside the market. So a steady income outside the market is the real flex.\u201d\n\nKedia urged investors to conduct their own research rather than acting on informal tips or penny-stock rumours. \u201cBe updated and well informed at all times. In Gen Z words, it is said that stay in the loop. DYOR. That means do your own research.\u201d\n\nOn portfolio sizing, Kedia told investors to allocate only a portion of their savings rather than committing everything at once. \u201cInvest a part of your savings in the market. Invest a part of your savings in the market. You should know the truth about asset allocation. So don't YOLO at all.\u201d\n\nHe warned against using borrowed funds, pointing to recent movements in mid- and small-cap stocks. \u201cDo not invest with borrowed money. Please remember, you have seen what has happened in this market in the last two years, especially in the last two-three months. What has happened to the mid-caps and small-caps and all? Never do that. That is the straight way to go to hell. Remember this thing. So do not invest with borrowed money.", "source": "LiveMint Markets", "pub_date_str": "28 Nov 2026, 07:26 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Fixed Income", "Derivatives", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Gold Price Drop Affects Your Existing Gold Loan Even If You Pay EMI On Time: Check How", "full_content": "Loan-to-Value (LTV) ratio determines how much money you can borrow against the gold you pledge. When gold price drops, this LTV comes under scanner, posing risk to your existing loan.", "source": "NDTV Profit", "pub_date_str": "28 Nov 2026, 07:23 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Gold Price Has Fallen From Rs 1.8 Lakh To Rs 1.25 Lakh. Where It Could Be Six Months From Now", "full_content": "Gold has fallen nearly 31% from its January 2026 peak to around Rs 1.25 lakh per 10 grams. Experts expect interest rates and dollar strength to influence its recovery over the next six months.", "source": "NDTV Profit", "pub_date_str": "28 Nov 2026, 07:23 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Gold price forecast: Analyst spots a major bottom after 104-day cycle, sees prices hitting $10,000 by 2030", "full_content": "Gold may have reached a significant turning point after months of correction, according to a technical analyst who believes a pattern in historical price movements points to the end of the latest sell-off. If the forecast holds, the precious metal could be preparing for another leg of its long-term rally, with prices potentially reaching $10,000 an ounce by 2030.\n\nIn an analysis published on November 27, AG Thorson, a technical analyst at FXEmpire, said gold's correction may have ended on November 25. His assessment is based on what he describes as symmetry in successive market cycles following the metal's sharp rally in 2025.\n\nHowever, the prediction is based on technical patterns and does not establish that gold has definitively bottomed. Investors will need to watch whether prices sustain their recovery and whether broader economic conditions support renewed demand for bullion.\n\nAccording to Thorson, gold's recent price movement has followed a strikingly similar pattern across successive market cycles.\n\nGold's sharp rally began in September 2025 and lasted 104 trading days. The initial correction that followed, leading to a mid-year low in 2026, also lasted 104 trading days.\n\nThe latest correction appears to have followed the same pattern. Thorson pointed out that gold reached what he believes could be its final corrective low on November 25, exactly 104 trading days after the late-June low.\n\nThis symmetry, he argued, increases the likelihood that the prolonged correction is over and a fresh upward phase could begin.\n\nThorson also believes the 2026 correction could represent the halfway point of a broader six-year bull market, drawing a parallel with the market cycle following the 2008 financial crisis.", "source": "LiveMint Money", "pub_date_str": "28 Nov 2026, 07:20 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Ramayana Box Office Collection Day 24: Ranbir Kapoor's Epic Crosses Historic Milestone In Fourth Week", "full_content": "The Nitesh Tiwari film went past the landmark on its fourth Friday and added to it on Saturday. Hindi continues to bring in most of the earnings, with Tamil and Kannada following.", "source": "NDTV Profit", "pub_date_str": "28 Nov 2026, 07:19 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Supreme Court will decide whether assault weapons bans violate the Second Amendment", "full_content": "Nicole Hockley was still in a fog of grief when she carried a photo of her 6-year-old son Dylan to the Connecticut Capitol. The image of his bright blue eyes and sweep of brown hair was marked with the year he was born and the year he was killed by shots from an AR-15-style rifle.\n\nShe was part of a wave of people who helped persuade the state to expand its ban on firearms like the one used to massacre 20 children, including Dylan, and six staff members at Sandy Hook Elementary School in 2012.\n\nMore than a decade later, she remains convinced that the assault weapons ban has helped prevent more mass school shootings.\n\n\"This isn't just about laws. This is about people, and this is about ensuring that people are protected,\" said Hockley, who co-founded the group Sandy Hook Promise.\n\nShe is heading to Washington next week, along with other families and survivors of deadly mass shootings. The conservative-majority Supreme Court will hear arguments Wednesday over whether state and local assault weapons bans violate the Second Amendment's right \"to keep and bear arms,\" putting the justices at the center of one of the most bitterly contested issues in firearms law.\n\nGun rights advocates backed by the Trump administration say it is unconstitutional to ban the nation's most widely owned rifle, which is involved in a relatively small portion of overall gun violence.\n\n\"This is the biggest and most pernicious problem we have in the gun control space,\" said Bill Sack, senior director of legal operations at the Second Amendment Foundation. \"We all view this as the Super Bowl of gun rights for the time being.\"\n\nAbout a dozen states have similar laws banning weapons such as the AR-15. They cover major cities including New York, Los Angeles and Chicago, where a county-level ban is also before the high court next week. A federal law restricting their sale and manufacture expired in 2004.", "source": "CNBC Top News", "pub_date_str": "28 Nov 2026, 07:08 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Why Tata Steel and APL Apollo Tubes shares will remain in focus on Monday? Check targets, key levels", "full_content": "APOLLO Vaamanaa Sethi Published 28 Nov 2026, 07:01 PM IST Prefer Livemint on Google Tata Steel and APL Apollo Tubes shares will remain in focus on Monday, 30 November, after SEBI extends the deadline for Tata Steel by seven days to publish the detailed public statement on APL Apollo Tubes stake acquisition.\n\nTata Steel shares edged up to close at \u20b9 163.94 apiece on the NSE on Friday. Meanwhile, APL Apollo Tubes stock ended the session 1.89% higher at \u20b9 1,509.50 per share.\n\nThe SEBI has extended the deadline for Tata Steel by seven days, until December 8, 2026, to publish the detailed public statement for its open offer to acquire up to a 26% stake in APL Apollo Tubes, according to a stock exchange filing on Friday.\n\nKotak Mahindra Capital Company, the manager to the open offer, informed the exchanges that the extension was granted following a request from Tata Steel. Under SEBI's takeover regulations, the company was initially required to publish the detailed public statement in newspapers by December 1, 2026.\n\nIn an email dated November 27, SEBI permitted Tata Steel to publish the statement by December 8 instead of the earlier deadline, the filing stated. However, the timeline for submitting the draft letter of offer to the market regulator remains unchanged.\n\n\"The last date for filing the draft letter of offer with SEBI remains unchanged, i.e., December 8, 2026,\" the filing said.\n\nEarlier this week, Tata Steel announced its plan to acquire up to a 52.38% stake in APL Apollo Tubes for approximately \u20b9 32,266 crore through a combination of a promoter stake purchase and a mandatory open offer.\n\nAs part of the deal, Tata Steel will purchase a 26.38% stake from APL Apollo's promoter group for around \u20b9 15,510.61 crore. It will also launch an open offer to acquire an additional 26% stake from public shareholders for up to \u20b9 16,755.66 crore. Announced on November 23, the open offer covers up to 7,28,06,387 equity shares of APL Apollo Tubes.", "source": "LiveMint Markets", "pub_date_str": "28 Nov 2026, 07:01 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "EPFO Amnesty Scheme 2026: How employers can regularise PF trusts before December 28", "full_content": "The Government has introduced the Employees\u2019 Provident Fund Organisation (EPFO) Amnesty Scheme, 2026, to help establishments regularise their provident fund (PF) trusts that operated without the required exemption under PF laws.\n\nThe Scheme was notified on June 29, 2026, and will remain open for six months until December 28, 2026, unless extended.\n\nSeveral establishments have set up their own PF trusts to manage employees\u2019 retirement savings. While some of these trusts received recognition under the Income-tax Act, 1961, they did not obtain the necessary exemption under the Employees\u2019 Provident Funds and Miscellaneous Provisions Act, 1952, or the Code on Social Security, 2020.\n\nRecognition under income tax laws does not automatically grant exemption under PF laws. As a result, some employers continued operating their trusts without the required approval, creating a compliance gap.\n\nThe Amnesty Scheme gives eligible employers a one-time opportunity to regularise their past exemption status and review their PF records.\n\nThe Amnesty Scheme is meant for establishments that have been running a Provident Fund Trust recognised under the Income Tax Act, 1961, but do not have a formal exemption notification issued by either the Central Government or the State Government.\n\nIn simple terms, the scheme helps employers bridge a regulatory gap between their income tax recognition and EPF exemption status without facing prolonged legal proceedings.\n\nThese include establishments seeking retrospective regularisation of their PF trust while either:", "source": "LiveMint Money", "pub_date_str": "28 Nov 2026, 06:45 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Mint Money Festival | Indians should invest up to 40% capital abroad, says Devina Mehra", "full_content": "Indian investors should allocate up to 40% of their portfolios to international markets to offset currency depreciation and reduce concentration risk, according to Devina Mehra, founder, chairperson and managing director of First Global.\n\n\u201cI would say that you have at least 30-40% of your portfolio globally,\u201d she said in a fireside chat at the Mint Money Festival 2026, in Mumbai on Saturday.\n\n\u201cIf I had put \u20b9 1 lakh in Indian markets the day I started working, it would have become \u20b9 1.5 crore. If I put it in global markets, it would be \u20b9 6.8 crore because the dollar went up eight times. Never forget rupee depreciation.\u201d\n\nMehra challenged the view that geopolitical conflicts cause lasting equity market downturns, citing historical market returns spanning more than a century.\n\n\u201cMost people think geopoliti
