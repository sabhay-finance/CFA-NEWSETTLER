reet territory, raising oversight concerns Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market: Prediction markets expand into Wall Street territory, raising oversight concerns SECTIONS Global Market: Prediction markets expand into Wall Street territory, raising oversight concerns By Anupam Nagar , ETMarkets.com Last Updated: Sep 29, 2026, 12:32:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Prediction markets are expanding into US stocks, indexes and corporate events, with Polymarket and Kalshi driving growth. The trend raises concerns over investor protection, insider trading, transparency and regulatory jurisdiction, as the SEC and CFTC debate oversight while platforms increasingly attract retail and institutional traders seeking speculation and alternative hedging tools.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "29 Sep 2026, 12:32 PM IST", "pub_date_relative": "38m ago", "cfa_topics": ["Equity Investments", "Derivatives", "Ethical & Professional Standards"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "H1 digest: India's consumption engine powers on despite emerging headwinds", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nDomestic private consumption picked up in the first half (H1) of fiscal year 2027, supported by credit growth, a lower goods and services tax (GST) burden and a robust rabi harvest, helping sustain discretionary spending in both urban and rural areas. While festive demand may support near-term momentum, experts caution that a weaker-than-expected kharif harvest and rising commodity prices could stymie the recovery in spending.\n\nLast year\u2019s GST overhaul, which slashed the indirect tax on passenger vehicles, two-wheelers and premium consumer durables to 18% from 28%, unlocked pent-up demand across income groups, said Madan Sabnavis, chief economist at Bank of Baroda. Lower input-cost inflation also allowed companies to fully pass on the tax cuts and offer additional discounts, improving affordability and sustaining willingness to spend so far in FY27, Sabnavis said.\n\nAs a result, the auto industry sold 2.08 million passenger vehicles between April and August, 21% more than the 1.71 million sold in the same period a year earlier, according to a recent Kotak Institutional Equities report. Retail two-wheeler and tractor sales also rose nearly 15% and 21%, respectively, pointing to strong auto demand across both urban and rural India.\n\nMore interestingly, sedans and large premium sport utility vehicles (SUVs) appeared amongst fresh launches between April and September (H1) after at least a year, while four out of six motorcycles launched during the period belonged to the premium segment, the report noted. This points to a deeper premiumisation trend which is visible in durables and services as well.\n\nThe Index of Services Production (ISP) for retail trade, a proxy for apparel and footwear demand, rose 20% year-on-year in Q1 FY27, as per CMIE data.", "source": "LiveMint Markets", "pub_date_str": "29 Sep 2026, 12:31 PM IST", "pub_date_relative": "39m ago", "cfa_topics": ["Economics", "Equity Investments", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Copper prices may surge another 50%, predicts Deutsche Bank; supply to users could exhaust by 2028", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Commodities \u203a News \u203a Copper prices may surge another 50%, predicts Deutsche Bank; supply to users could exhaust by 2028 The Economic Times daily newspaper is available online now. Read Today's Paper Copper prices may surge another 50%, predicts Deutsche Bank; supply to users could exhaust by 2028 SECTIONS Copper prices may surge another 50%, predicts Deutsche Bank; supply to users could exhaust by 2028 By Veer Sharma , ETMarkets.com Last Updated: Sep 29, 2026, 12:30:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Copper prices could surge further as historically low inventories, US stockpiling and constrained mine supply intensify competition for spot metal. Deutsche Bank expects copper to reach $22,050 per metric ton by Q2 2027, while supply available to global users could tighten sharply by 2028.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "29 Sep 2026, 12:30 PM IST", "pub_date_relative": "40m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Stock Market Live: Sensex Recovers Nealy 600 Points From Day's Low, Nifty 50 Near 22,750; Pharma, Metals In Green", "full_content": "On BSE, Adani Ports, Tata Steel and Kotak Bank were among the top gainers, while Eternal, Bajaj Finance and HCLTech were top drags.", "source": "NDTV Profit", "pub_date_str": "29 Sep 2026, 12:09 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "NCC shares rally 5% after securing Rs 1,076 crore Andhra Pradesh drinking water project", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a NCC shares rally 5% after securing Rs 1,076 crore Andhra Pradesh drinking water project NCC Share Price G R Infraprojects Share Price Dilip Buildcon Share Price Hindustan Construction Company Share Price Man Infraconstruction Share Price The Economic Times daily newspaper is available online now. Read Today's Paper NCC shares rally 5% after securing Rs 1,076 crore Andhra Pradesh drinking water project SECTIONS NCC shares rally 5% after securing Rs 1,076 crore Andhra Pradesh drinking water project By Surbhi Khanna , ET Online Last Updated: Sep 29, 2026, 12:02:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis NCC shares rose after the company received a Rs 1,076.71-crore order, excluding GST, from the Andhra Pradesh government\u2019s Rural Water Supply and Sanitation Department. The order involves providing drinking water under a multi-village scheme on the Yeleru Reservoir for the Anakapalli segment in Andhra Pradesh.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "29 Sep 2026, 12:02 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Nifty monthly expiry meets CAS today: Why the last 30 minutes of the Tuesday trading session could be most important", "full_content": "Market participants should brace for heightened volatility in the second half of Tuesday\u2019s trading session as both weekly and monthly futures and options (F&O) contracts expire today. Nifty derivative contracts typically expire on the last Tuesday of every month. If the scheduled expiry day is a trading holiday, the expiry is moved to the preceding trading day.\n\nThe expiry of derivatives contracts is nothing new, but the closing auction session (CAS) is. CAS, introduced on 3 August this year, has led to unexpected price swings and market uncertainty, prompting the Securities and Exchange Board of India (Sebi) to propose a revamp of the settlement methodology for derivatives contracts.\n\nOn the expiry day of the August F&O series, the Nifty witnessed a strong upswing in the final few minutes of the session, driving it almost 1% up from the day's low and 0.50% up from the previous close.\n\nMarket regulator SEBI designed a new auction-based mechanism to make the stock price discovery process more transparent.\n\nThe CAS is conducted every trading day from 3:15 PM to 3:35 PM, immediately after the regular market closes at 3:15 PM. During this 20-minute window, investors can place market and limit orders to help determine the official closing price of eligible stocks.\n\nThe order entry window will close at a random time between 3:28 PM and 3:30 PM, with the exact time determined automatically by the exchange's system. This random closure is intended to prevent last-minute manipulation of stock prices.\n\nWhile the cash market's closing auction ends at 3:35 PM, trading in the equity derivatives segment continues until 3:40 PM.\n\nAfter the auction, a post-close session is held in the cash market from 3:50 PM to 4:00 PM, during which investors can buy or sell shares only at the final closing price discovered through the Closing Auction Session.", "source": "LiveMint Markets", "pub_date_str": "29 Sep 2026, 11:59 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Derivatives"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Inflation-linked health cover: what you need to know", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nA \u20b9 10 lakh health insurance cover may look substantial today. But what happens when the same surgery costs \u20b9 15 lakh or \u20b9 20 lakh in a few years from now?\n\nThis is the gap that inflation-protection features in health insurance seek to address. Policies with this feature offer an inflation-linked increase in the sum insured at renewal. At first glance, this may sound like a straightforward solution to rising healthcare costs. But an inflation-adjusted sum insured does not necessarily mean that the insurance cover is keeping pace with actual medical inflation.\n\nNiva Bupa's Safeguard+ add-on also combines multiple benefits, including an inflation-linked increase in coverage.\n\nAkshay Bansal, an insurance consultant and founder of Money Plant Project, shared a live example. \u201cBased on calculations that we have done of how premium increased and the sum insured in the last three-four years, we have observed that if the premium has increased by approximately 6%, then the inflation bonus has also been provided at around the same percentage of the sum insured.\u201d\n\nExperts believe this feature can be useful for people with older health insurance policies.\n\n\"In older plans where cumulative bonuses are capped, this add-on allows coverage to keep increasing. Even if a policyholder cannot port to a newer plan due to existing medical conditions or past claim history, the rider still provides a way to marginally expand their overall cover,\" said Bansal.\n\nFor such policyholders, an inflation-linked feature can provide an additional layer of cover without requiring them to substantially increase the base sum insured.", "source": "LiveMint Money", "pub_date_str": "29 Sep 2026, 11:59 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Power Mech Projects shares gain 3% after securing Rs 279 crore order from Telangana Power Generation Corporation", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Power Mech Projects shares gain 3% after securing Rs 279 crore order from Telangana Power Generation Corporation Power Mech Projects Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Power Mech Projects shares gain 3% after securing Rs 279 crore order from Telangana Power Generation Corporation SECTIONS Power Mech Projects shares gain 3% after securing Rs 279 crore order from Telangana Power Generation Corporation By Surbhi Khanna , ET Online Last Updated: Sep 29, 2026, 11:57:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Power Mech Projects secured a Rs 279.20 crore, three-year O&M contract from Telangana Power Generation Corporation for YTPS. The order covers ash and coal handling plants across five 800 MW units. The company reported Rs 3,113 crore FY27 YTD inflows and a Rs 17,317 crore order book, supporting sustained revenue visibility and growth.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "29 Sep 2026, 11:57 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "26% dip in YTD! Jio Financial Services shares hit 52-week low \u2014 will trend reverse? Target price, support, resistance", "full_content": "Jio Financial Services shares fell more than 2% on Tuesday, 29 September, hitting a fresh 52-week low amid a broader sell-off in the equity market. The stock has declined more than 25% so far this year, with the recent breakdown below key support levels raising concerns over further weakness. Technical analysts point to multiple levels that could determine whether the stock stabilises or extends its decline.\n\nHitesh Rathi, Technical Analyst \u2013 Equity & Derivatives at Angel One, said the stock is now close to undoing its entire upmove from last year after the sharp recovery seen in 2025. While the broader chart remains range-bound, he identified the \u20b9 205\u2013 \u20b9 200 band as a strong long-term support zone. However, the recent breakdown below \u20b9 230, which had acted as a strong support level earlier this year, has shifted control towards sellers. Rathi therefore expects the stock could retest the \u20b9 205\u2013 \u20b9 200 support band.\n\nSudeep Shah, Vice President \u2013 Technical and Derivatives Research at SBI Securities, meanwhile, highlighted a similar deterioration in the weekly chart. He said Jio Financial has broken below the \u20b9 225\u2013 \u20b9 223 support zone and is trading significantly below its key moving averages. The RSI remains below 40 on both the daily and weekly timeframes, while the rising ADX indicates strengthening bearish momentum.\n\nAgainst this backdrop, Shah expects the \u20b9 224\u2013 \u20b9 226 zone to act as immediate resistance. He said the bearish bias is likely to remain intact as long as the stock trades below this range.", "source": "LiveMint Markets", "pub_date_str": "29 Sep 2026, 11:56 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Derivatives"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "IT Stocks In Red: TCS, Wipro, Infosys, HCLTech Share Price Falls Up To 2%", "full_content": "The IT sector has fallen 26.54% year-to-date and 17.4% in the last 12 months.", "source": "NDTV Profit", "pub_date_str": "29 Sep 2026, 11:56 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Jeevan Pramaan 2026: What pensioners aged 80+ need to know about the October 1 Life Certificate window", "full_content": "Pensioners will soon enter the annual period for submitting their Life Certificate, a mandatory exercise for those required to establish their continued eligibility for pension. The government\u2019s Jeevan Pramaan platform allows eligible pensioners to submit a Digital Life Certificate (DLC) using Aadhaar-based authentication without having to physically visit a pension disbursing authority.\n\nHowever, the October 1 deadline does not apply uniformly to all pensioners. The early submission window is specifically available to pensioners aged 80 years and above.\n\nAs of 29 September 2026, the Department of Pension & Pensioners\u2019 Welfare (DoPPW) has not issued a fresh notification specifically announcing the 2026 October 1 window.\n\nThe DoPPW order was introduced to reduce the difficulties faced by pensioners aged 80 years and above who otherwise had to submit their Life Certificate during the November rush.\n\nUnder the 18 July 2019 order, pensioners aged 80 years and above were permitted to submit their Life Certificate from October 1 every year instead of waiting until November. The order also said that the certificate would remain valid until November 30 of the subsequent year. Pensioners below 80 years were allowed to continue submitting their Life Certificate in November under the existing provisions.\n\nThe government has subsequently continued to describe October as the special submission window for pensioners aged 80 years and above. A 2022 Press Information Bureau release, for instance, said DoPPW had issued orders permitting this age group to submit their Life Certificate from October 1 to provide an exclusive window and avoid the rush at pension disbursing bank branches.\n\nJeevan Pramaan is an Aadhaar-based, biometric-enabled Digital Life Certificate. Once authentication is successfully completed, the certificate is generated with a unique Pramaan ID and made available electronically to the pension disbursing agency.", "source": "LiveMint Money", "pub_date_str": "29 Sep 2026, 11:47 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "97% rally in two years! Azad Engineering share price jumps 5% today - Check target, stop loss, performance", "full_content": "Azad Engineering share price jumped over 5% in Tuesday's trading session defying stock market sentiment. The stock opened at \u20b9 2,779 apiece on NSE today, as compared to previous close of \u20b9 2,723.20 on Monday and touched an intraday high of \u20b9 2,918.\n\nMeanwhile, equity benchmark indices Sensex and Nifty fell sharply in early trade on Tuesday, dragged down by elevated crude oil prices amid uncertainty over the West Asia situation and continued foreign fund outflows. The 30-share BSE Sensex declined 503 points to 72,260.09, while the 50-share NSE Nifty fell 151 points to 22,626.50 in early trading.\n\nThe rally in the Azad Engineering shares came in after the company announced that it has inaugurated two exclusive Lean Manufacturing Facilities for GE Vernova's Gas Power business at its Centre of Excellence & Innovation Ceuhe in Tunikibollaram, Hyderabad, on September 28, expanding its footprint to three dedicated facilities for the global energy giant.\n\n\u201cThe two state-of-the-art lean manufacturing facilities, each spanning 7,600 sq. m are dedicated to manufacturing highly engineered rotating and stationary airfoils and specialized machined parts, meeting GE Vernova's global demand in the power generation and essential industries,\u201d the company said in the filing.\n\nAzad Engineering share price has delivered strong returns across multiple time frames. The stock gained 6.31% in the past week and 3.49% over the last one month, indicating continued positive momentum in the near term. Over the three-month period, the stock has surged 48.55%, highlighting a sharp rise in investor interest during the period.\n\nThe stock's gains become more pronounced over the medium term, with shares rising 98.73% in six months.", "source": "LiveMint Markets", "pub_date_str": "29 Sep 2026, 11:46 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Sensex, Nifty rebound from near six-month lows amid crude shock", "full_content": "India's equity benchmarks rebounded from early morning session lows Tuesday, though indices still hovered near six-month troughs as soaring crude oil prices and mounting foreign capital outflows weighed heavily on investor sentiment.\n\nThe NSE Nifty 50 traded 0.29% lower at 22,715.00 points, while the BSE Sensex shed 0.35% to 72,522.09 points by mid-morning trade. Earlier in the session, both indices tumbled as much as 0.9% to touch their lowest levels since early April, compounding a steep selloff from Monday that saw the 30-share barometer plunge over 1,100 points.\n\nGlobal oil benchmark Brent crude futures advanced 1.5% to $107 a barrel\u2014and touched highs of $107.1\u2014as persistent supply worries linked to the escalating US-Iran conflict stoked fears of disruptions through the critical Strait of Hormuz. For India, the world\u2019s third-largest crude importer, sustained oil pricing pressures threaten to stoke domestic inflation, widen the import bill, and squeeze corporate profit margins.\n\n\u201cRising US 10-year Treasury yields, which surged to their highest levels since July 2007, and elevated crude oil prices are weighing heavily on market sentiment, triggering broad-based selling across Indian equities,\u201d said Spark Midas Equities and Research. Analysts noted that while the overall technical structure remains negative, daily momentum indicators lingering in oversold territory have opened the door for a modest intraday pullback.\n\nForeign institutional investors (FIIs) further dampened market mood, offloading equities worth \u20b9 5,353.22 crore on Monday. Heavyweight financials and banking counters bore the brunt of the selling pressure. HDFC Bank fell 1.6%, ICICI Bank dropped 1%, and Reliance Industries slipped 0.6%. Major Tata Group companies also retreated following a recent proposal by Tata Trusts to merge two group entitie s with Tata Sons Pvt. Ltd.", "source": "LiveMint Markets", "pub_date_str": "29 Sep 2026, 11:44 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Quantitative Methods", "Economics", "Financial Statement Analysis", "Equity Investments", "Fixed Income", "Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "Summit stock surges on $2 billion AstraZeneca investment", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News Powered By Summit stock surges on $2 billion AstraZeneca investment Written by Anupam Nagar , ETMarkets.com | Sep 29, 2026, 11:51:37 AM IST 1 / 8 \u200bAstraZeneca Bets $2 Billion on Summit AstraZeneca has agreed to invest $2 billion in Summit Therapeutics, giving the biotech a major capital infusion as it advances its cancer-drug pipeline. Summit shares jumped more than 15% in after-hours trading following the announcement. (Sources: Reuters, Barron's, MarketScreener)\n\nSummit\u2019s stock rose sharply after the deal was announced, with shares trading as much as 19% above Monday\u2019s close in extended trading. The company had closed at $15.48 before the announcement.\n\nAstraZeneca will purchase newly issued convertible preferred shares at a price equivalent to $18.36 per Summit common share. That represents a significant premium to Summit\u2019s recent trading levels and gives AstraZeneca an equity position in the biotech.\n\nOnce converted, AstraZeneca will have rights equivalent to roughly 12% of Summit\u2019s outstanding common stock, or about 10.6% on a fully diluted basis. The preferred-share transaction is expected to close within a week, subject to customary conditions.\n\nThe investment is closely tied to ivonescimab, Summit\u2019s lead experimental cancer treatment. The PD-1/VEGF bispecific antibody was developed by China\u2019s Akeso, while Summit holds development and commercialisation rights across major markets outside China.\n\nSummit and AstraZeneca also plan clinical trials combining ivonescimab with sonesitatug vedotin, AstraZeneca\u2019s Claudin 18.2-targeting antibody-drug conjugate. Initial studies are planned in gastrointestinal cancers.\n\nThe $2 billion investment gives Summit additional financial resources as it funds late-stage clinical development of ivonescimab.", "source": "Economic Times Markets", "pub_date_str": "29 Sep 2026, 11:42 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "IPO GMP Today: SRIT India vs Shah Investor's Home - Which Has the Highest Listing Gain?", "full_content": "SRIT India IPO leads Shah Investor's Home in GMP, with a higher GMP-implied listing gain as both issues enter Day 2 of subscription.", "source": "NDTV Profit", "pub_date_str": "29 Sep 2026, 11:41 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Gold, Silver Extend Decline: Yellow Metal Falls Over Rs 1,200, White Metal Slides Nearly Rs 3,000", "full_content": "Gold and silver prices remained under pressure on Tuesday, although analysts retained a positive medium to long-term outlook for precious metals.", "source": "NDTV Profit", "pub_date_str": "29 Sep 2026, 11:41 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Ola Electric's Battery Bet Impresses HSBC. The Balance Sheet Does Not", "full_content": "The company's stock took a hit in trade on Monday and fell as much as 3.5% to Rs 36.53, compared to a 0.86% fall in the benchmark Nifty index and a 0.7% fall in the entire auto sector.", "source": "NDTV Profit", "pub_date_str": "29 Sep 2026, 11:41 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "IPO GMP Today: Orient Cables vs German Green vs Acevector vs Runwal \u2014 Which Has the Highest Listing Gain?", "full_content": "IPO GMP Today: Orient Cables, German Green, Acevector and Runwal Enterprises are set to close today. Check GMP, implied listing gains and key details.", "source": "NDTV Profit", "pub_date_str": "29 Sep 2026, 11:40 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Asian Games 2026: Neeru Dhanda Wins Gold Medal For India In Women's Trap Shooting", "full_content": "India\u2019s Neeru Dhanda created history by winning gold in the women\u2019s trap individual event at the 2026 Asian Games, becoming the first Indian woman to claim the title.", "source": "NDTV Profit", "pub_date_str": "29 Sep 2026, 11:37 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Buying property abroad for your NRI child? Know how much parents can transfer and what tax rules apply", "full_content": "Indian parents looking to help an NRI or OCI child buy property overseas must consider foreign exchange regulations and tax implications before transferring funds.\n\nSuch transactions are governed by the Foreign Exchange Management Act ( FEMA ) and the Reserve Bank of India's ( RBI ) Liberalised Remittance Scheme (LRS). Families must also decide whether the contribution will be treated as a gift or a loan and account for taxes, documentation and foreign exchange costs.\n\nHere's what parents need to know before transferring money for an overseas property purchase.\n\nAn Indian resident can remit up to $2,50,000 per financial year under LRS for permitted current account transactions, capital account transactions, or a combination of both, according to experts cited by The Economic Times . The RBI allows resident individuals to use the LRS for permitted transactions, including the acquisition of immovable property abroad, subject to applicable rules.\n\nLRS is available to resident individuals and not entities such as companies, partnership firms, HUFs or trusts, Sadia Khan, Partner, Private Client Practice, Shardul Amarchand Mangaldas & Co, told ET .\n\nWhere both parents are eligible resident individuals, each can have a separate LRS limit of $2,50,000 per financial year, subject to applicable rules. Parents can explore a joint purchase structure using their respective LRS limits, while the NRI or OCI child's contribution can come independently from overseas resources, subject to FEMA conditions, ET reported.\n\nThe $2,50,000 LRS limit applies per individual and per financial year, which runs from 1 April to 31 March. A set of two eligible parents can therefore have a combined limit of $5,00,000 in a financial year, subject to the applicable rules.\n\nShabnam Shaikh, Partner, Khaitan & Co, told ET that unused LRS limits cannot be carried forward to the next financial year. She added that any remittance exceeding the limit can be made only in the following financial year.", "source": "LiveMint Money", "pub_date_str": "29 Sep 2026, 11:35 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Corporate Issuers"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Nifty indices rejig: Which stocks will see the biggest inflows and outflows?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News Nifty indices rejig: Which stocks will see the biggest inflows and outflows? Written by Debaroti Adhikary , ETMarkets.com | Sep 29, 2026, 11:38:49 AM IST 1 / 5 Index Shuffle The National Stock Exchange\u2019s (NSE) semi-annual Nifty index rejig will take effect on September 30, with Nuvama Alternative & Quantitative Research identifying the stocks likely to see the biggest inflows and outflows.The brokerage expects BSE to attract the highest inflows of $594 million across passive indices, followed by Vedanta Aluminium, Adani Enterprises, Polycab and Power India. Wipro, IHCL, Reliance Industries, Shree Cement and United Spirits are expected to see the highest outflows.Here are the key additions and exclusions from major indices, along with the stocks expected to see the biggest flows.\n\nInclusion: BSE shares will replace Wipro in the NSE\u2019s benchmark Nifty 50 index. Nuvama Institutional Equities expects the inclusion to attract $668 million in inflows. BSE shares have gained 50% in a year and 19% in 2026 so far, despite falling over 8% in the past month.\n\nExclusion: Wipro, meanwhile, is expected to see outflows worth $230 million as a result of its exclusion from Nifty 50. The stock has fallen more than 40% in 2026 and 22% in three years.\n\nAlso read | BSE set to enter Nifty 50 from tomorrow, IT major Wipro to exit. What shareholders must know? \u200b\n\nInclusions: Wipro shares, meanwhile, will be added to the Nifty Next 50 index, with the inclusion expected to attract $89 million in inflows, according to Nuvama Institutional Equities.\n\nVedanta Aluminium Metal is estimated to see the highest inflows at $144 million, followed by Polycab at $90 million.", "source": "Economic Times Markets", "pub_date_str": "29 Sep 2026, 11:33 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "DA hike for central govt employees: Will 3% increase be announced this week?", "full_content": "Nearly a month after the Labour Bureau released the All India Consumer Price Index (AICPI) data for June 2026, central government employees are still waiting for the Ministry of Finance to officially announce the next Dearness Allowance (DA) hike.\n\nBased on the latest inflation readings, the DA is estimated to rise by 3%, bringing the total allowance to 63%.\n\nThe announcement is expected imminently, likely ahead of Dussehra.\n\nAccording to a recent ET Wealth report, MS Vengatesan, secretary general of the Confederation of Central Government Employees & Workers (CCGEW), has formally urged the Finance Ministry to expedite the process.\n\nManjeet Singh Patel, president of the All India New Pension Scheme Employees\u2019 Federation, along with other ET Wealth sources at the All India Defence Employees\u2019 Federation, indicated that the necessary paperwork is being processed and that a formal announcement can be expected by the first week of October.\n\nHistorically, the government aligns its DA announcements with the festive season, specifically around Dussehra .\n\nHowever, recent years have seen the announcement lag slightly behind the festival:\n\nThe DA is determined using the 12-month average of the AICPI-IW (Industrial Workers) reading. Between July 2025 and June 2026, the average index value stood at 148.65.", "source": "LiveMint Money", "pub_date_str": "29 Sep 2026, 11:31 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Nomura initiates coverage on Allied Blenders with Buy rating, sees up to 20% upside", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Nomura initiates coverage on Allied Blenders with Buy rating, sees up to 20% upside The Economic Times daily newspaper is available online now. Read Today's Paper Nomura initiates coverage on Allied Blenders with Buy rating, sees up to 20% upside SECTIONS Nomura initiates coverage on Allied Blenders with Buy rating, sees up to 20% upside By Sakshi Kumari , ETMarkets.com Last Updated: Sep 29, 2026, 11:29:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Nomura has initiated coverage on Allied Blenders & Distillers with a Buy rating and a target price of Rs 850, implying nearly 20% upside. The brokerage sees premiumisation, backward integration and margin expansion as key growth drivers, with EPS expected to grow at a 26% CAGR over FY26\u2013FY29. Execution delays and slower premiumisation remain key risks.\n\n(What's moving Sensex and Nifty Track latest market a News Powered By Why are investors turning cautious on Tesla stock? Written by Anupam Nagar , ETMarkets.com | Sep 29, 2026, 11:20:28 AM IST 1 / 10 \u200bTesla Stock Under Pressure Tesla shares came under pressure as investors assessed regulatory questions surrounding the company\u2019s driverless Cybercab and awaited Tesla\u2019s response to US safety regulators. (Sources: Yahoo Finance, TradingView)\n\nTesla shares fell about 4% on Monday, September 28, amid broader market weakness and renewed concerns over the company\u2019s near-term outlook. Investors are also awaiting updates on third-quarter deliveries.\n\nThe US National Highway Traffic Safety Administration has asked Tesla to answer questions about how it certified the Cybercab, a vehicle designed without conventional steering wheels and pedals. Tesla\u2019s response is due September 30.\n\nNHTSA is examining Tesla\u2019s technical data and its interpretation of federal vehicle-safety requirements. The agency is also seeking clarity on whether temporarily installed human-driver controls or other equipment played a role in the certification process.\n\nThe federal inquiry has not established that Tesla violated safety requirements. The September 30 deadline is part of NHTSA\u2019s ongoing effort to assess how the Cybercab was certified and whether the vehicle meets applicable federal requirements.\n\nRetail investor sentiment around Tesla has faced pressure amid the Cybercab rollout and regulatory scrutiny. Investors are closely debating the commercial potential of Tesla\u2019s robotaxi strategy as the company moves toward autonomous driving.\n\nTesla is positioning the Cybercab as a purpose-built autonomous vehicle rather than a conventional car adapted for self-driving.", "source": "Economic Times Markets", "pub_date_str": "29 Sep 2026, 11:15 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u20     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
