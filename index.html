    const allData = {"general": [{"title": "Semiconductor market to remain solid \u2018at least through next year,\u2019 South Korea finance minister says", "full_content": "The semiconductor boom will last at least through 2027, South Korean finance minister Lee Hyoung-Il said on Saturday.\n\n\"For now, our view is that we can sustain this growth at least through next year,\" Lee told CNBC on the sidelines of the IMF-World Bank annual meetings in Bangkok. \"That's because the gap between demand and supply for semiconductors is still very wide, and supply is still being expanded.\"\n\nHis comments come after semiconductor stocks fell sharply this week, hurt by investor concerns about interest rate hikes and rising competition from Chinese companies. South Korean chip stocks like SK Hynix and Seoul Semiconductor were part of the sell-off, along with U.S. giants like Nvidia .\n\nChip stocks have fueled volatility in South Korea's stock market this year, Lee said. He attributed the market's wild swings to the semiconductor industry's larger share of the economy than in other countries. Despite the market swings, South Korea's economy is \"solid,\" Lee said.\n\nOn Thursday, an opinion column in Maeil Business Newspaper , a prominent South Korean publication, urged the country's government to prepare for the coming slowdown in the artificial intelligence boom. The author said two experts expect a \"flood of new supply\" of semiconductors that will turn the memory market \"into a red ocean\" by 2029, according to a CNBC translation .\n\nWhile South Korea's semiconductors may be driving volatility in its stock market, the industry has also fueled tax growth. Lee said the country expects to collect more taxes than initially projected this year.\n\nSouth Korea will ultimately be in a stronger fiscal position because of the chip boom, he added.\n\nWATCH: Don't overlook opportunity in South Korea, says Verdad Advisers' Rasmussen", "source": "CNBC Top News", "pub_date_str": "17 Oct 2026, 10:01 PM IST", "pub_date_relative": "just now"}, {"title": "Investors are buying up vast tracts of timberland across U.S. in one of market's longest-term bets", "full_content": "When the economy and the market look shaky, gold and government bonds are the traditional places to park money. Lately, some investors have also been looking at something more rooted: timber.\n\nThe pitch is easy to like: a back-to-basics, natural asset that grows on its own, matures into a harvest and can be cashed in all while you use it to hunt, pitch a tent, or forage.\n\nInstitutions have been buying timberland at a rate of one million acres per year, according to Bank of America, and some financial advisors say individual investors, including younger Americans priced out of the housing market, are also taking a look at the asset class. But it is far from a rush, and investors who already own timberland caution that it may not be very profitable in the short term.\n\n\"Timber is a very low return investment. I have curtailed my investments,\" said Pat Dorn, founder of Anchor Investment Management, a fee-only advisory firm in Columbia, South Carolina, and a former chairman of the South Carolina Forestry Association. Dorn owns 2,500 acres of timberland in South Carolina's booming upstate region. Dorn said the problem is that right now more timber is being grown than is needed in a sluggish housing economy.\n\n\"Supply beats demand, and that causes flat prices. Timber is not an investment I would make currently,\" Dorn said.\n\nNationally, the Bureau of Labor Statistics' producer price index for logs, bolts, timber, pulpwood and wood chips ticked up in September, but prices have been mostly on the decline since summer 2022. This measures prices received by producers for those products, rather than timberland values or investment returns.", "source": "CNBC Top News", "pub_date_str": "17 Oct 2026, 10:01 PM IST", "pub_date_relative": "1m ago"}, {"title": "Memory stocks: Is the wall of worry justified?", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Oct 2026, 09:45 PM IST", "pub_date_relative": "16m ago"}, {"title": "Cupid\u2019s Aditya Halwasiya bets big on PC Jeweller after 70% rally in 6 months - Who is he? Check PCJ stock returns, RoE", "full_content": "Days after achieving a debt free milestone, PC Jeweller , is receiving strong interest from investors. Cupid \u2019s Chairman and Managing Director (MD), Aditya Kumar Halwasiya, recently purchased 5.10 crore shares worth approximately \u20b9 73.59 crore through a bulk deal.\n\nThe recent bulk deal has again put spotlight on PC Jeweller stock, which saw a sharp 12% rally on Friday, October 16.\n\nAditya Halwasiya serves as the chairman and managing director of Cupid Limited. The third-generation entrepreneur has emerged as India's fastest wealth creator by percentage.\n\nAccording to M3M Hurun India Rich List 2026, Halwasiya emerged as India's fastest wealth creator by percentage growth. His wealth jumped 859% to \u20b9 18,800 crore. His education started in Kolkata, where he attended La Martiniere for Buys. He graduated from St. Xavier's College in Kolkata, and later on completed his master's degree in global finance at Fordham University in New York.\n\nAs per NSE website data, Cupid\u2019s Aditya Kumar Halwasiya purchased 5.10 crore shares worth approximately \u20b9 73.59 crore through a bulk deal. The transaction was executed at an average price of \u20b9 14.43 per share.\n\nLast month, PC Jeweller announced that it had cleared its outstanding dues to all 14 consortium banks and achieved debt-free status. The New Delhi-headquartered jewellery maker had earlier carried a total debt of around \u20b9 3,000 crore and opted for a one-time settlement (OTS) of its outstanding bank dues in September 2024.\n\nThe stock closed 12.59% higher at \u20b9 16.28 per share on BSE with an MCap of \u20b9 15,876.48 crore on Friday. Its return on equity (ROE) stood at 21.14%. The jewellery stock has delivered 70.83% return in 6 months, and around 74.87% return in 2026 so far. Its share price value has surged 33.22% in one year and around 391% in three years.\n\nCatch all the Business News , Market News , Breaking News Events and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.", "source": "LiveMint Markets", "pub_date_str": "17 Oct 2026, 09:14 PM IST", "pub_date_relative": "47m ago"}, {"title": "AI stocks plunge. Inflation heats up. Where we're still finding opportunities", "full_content": "The sinking AI trade rattled last week's market. But solid bank earnings and a rotation beyond tech gave us reasons for optimism.", "source": "CNBC World Economy", "pub_date_str": "17 Oct 2026, 09:12 PM IST", "pub_date_relative": "49m ago"}, {"title": "GIC Private Ltd sells $274.8 million in Medline (MDLN) shares", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Oct 2026, 08:46 PM IST", "pub_date_relative": "1h ago"}, {"title": "Software\u2019s new consolidator gets big vote of confidence from Berkshire", "full_content": "At the time of its Nasdaq debut in July, Bending Spoons was a little-known holding company out of Italy that owned older internet names like AOL, Vimeo, Eventbrite and Evernote.\n\nLess than four months later, the Milan-based firm has emerged as a surprising home for former high-flying software startups that have been thrust aside by the artificial intelligence boom. Its M&A plan got a major boost this week from the most famous holding company on the planet: Berkshire Hathaway .\n\nBerkshire, which Bending Spoons describes as a \"longstanding inspiration\" for its strategy, has now invested over $900 million in the company, including a $330 million stake disclosed on Wednesday. Wall Street loved the deal, sending Bending Spoons' stock up 41%, though some of those gains were lost later in the week, leaving the company with a market cap of about $30 billion.\n\n\"Berkshire's decision to add to its position just a few months after the IPO and at these levels provides another vote of confidence in the Bending Spoons model from one of the world's most respected long-term investors,\" wrote analysts at Mizuho, in a report after the announcement.\n\nThe other big news out of Bending Spoons this week underscores the flipside of the business: job cuts. In August, Bending Spoons announced it was buying workflow software provider Airtable for about $1.3 billion, or almost 90% below the company's peak valuation from late 2021. Bending Spoons said Monday that a \"large portion of the pre-acquisition team\" from Airtable would be leaving with \"substantial separation packages.\" Layoffs were previously implemented at Evernote, Vimeo, WeTransfer and others in the portfolio.\n\nFor the technology industry, Bending Spoons' moves represent the latest example of how quickly fortunes are turning in the AI era, as new agents powered by large language models displace software developers and the products they built.", "source": "CNBC World Economy", "pub_date_str": "17 Oct 2026, 08:41 PM IST", "pub_date_relative": "1h ago"}, {"title": "Analysis-High debt, growing strains put focus on need for new development approaches", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Oct 2026, 08:36 PM IST", "pub_date_relative": "1h ago"}, {"title": "Commerce Ministry organizes \u201cLeveraging FTAs\u201d outreach program in Jaipur to boost exports", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a Commerce Ministry organizes \u201cLeveraging FTAs\u201d outreach program in Jaipur to boost exports The Economic Times daily newspaper is available online now. Read Today's Paper Commerce Ministry organizes \u201cLeveraging FTAs\u201d outreach program in Jaipur to boost exports SECTIONS Commerce Ministry organizes \u201cLeveraging FTAs\u201d outreach program in Jaipur to boost exports ET Online Last Updated: Oct 17, 2026, 08:36:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Commerce Ministry organized an outreach event in Jaipur, targeting exporters to clarify the use of benefits provided by India's free trade agreements. This initiative aims to translate preferential market access into tangible export opportunities for Indian enterprises, emphasizing Rajasthan's strengths in textiles, handicrafts, and gems. Plans for coordination among stakeholders are outlined to optimize support for exporters moving forward.\n\nWar's second-order effects are becoming visible in critical sectors\n\nUS mid-term elections \u2013 Part 2: What does it mean for Trump to lose control of Congress?\n\nHomebuyers wait as NCLT panel picks holes in unfinished Jaypee projects\n\nWhat is the real impact of 13x jump in cash transfers to women?\n\nAirlines Q2 turbulence: Fewer passengers, rising fares and a crude shock\n\nThe NBFC saga - Part 2: Line drawn in 2006 is reason for the headlines today\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "17 Oct 2026, 08:36 PM IST", "pub_date_relative": "1h ago"}, {"title": "Defying Global Slowdown: How India Flipped Post-Covid Gloom Into A Historic Rally, Economist Explains", "full_content": "India\u2019s economy rebounded from a 5.8% pandemic-era contraction to grow 9.7% in 2021, followed by four consecutive years of expansion above 7%. Economist Kyunghoon Kim says the sustained momentum could extend the country\u2019s historic growth streak.", "source": "NDTV Profit", "pub_date_str": "17 Oct 2026, 08:32 PM IST", "pub_date_relative": "1h ago"}, {"title": "'Dead money\u2019 for a decade: Why this hedge fund approach may deliver an advantage over bonds", "full_content": "Investors may want to rethink their bond allocation and opt for managed futures exposure.\n\nDBi's Andrew Beer suggests the popular hedge fund strategy could deliver a modern twist to traditional 60/40 portfolios .\n\n\"[Bonds have] been dead money for the entire decade,\" the firm's co-founder and managing member told CNBC's \"ETF Edge\" this week. \"I fell in love with a strategy called managed futures because tactical is really good. Be nimble when other people's [portfolios] aren't.\"\n\nBeer contends the managed futures strategy, historically only available to hedge funds, could counterbalance stocks better than bonds during periods of volatility , which has been moving higher due to recent worries surrounding debt and the artificial intelligence trade .\n\nHis reason: Managed futures exchange-traded funds can go long and short across global markets to position early against turbulent market events.\n\n\"You want something that has low correlation to both stocks and bonds, and something that will do well in crises,\" Beer said. \"It's very, very hard to find a better hedge fund strategy than managed futures to accomplish that.\"\n\nHe helps manage the iMGP DBi Managed Futures Strategy ETF (DBMF) . The fund replicates the performance of leading managed futures hedge funds inside a low-cost, liquid ETF, according to the firm's website.\n\n\"There's an existential crisis right now in strategic asset allocation and the model portfolio world,\" Beer said about the 60/40 approach. \"I love my bonds \u2026 [but] I'm not making it a 40% allocation for something that is not adding to the rest of my portfolio.\"", "source": "CNBC Finance", "pub_date_str": "17 Oct 2026, 08:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "Yes Bank Q2 Results: Net Profit Surges 65% To Rs 1,080 Crore, NII Up 23% YoY; Asset Quality Stable", "full_content": "Yes Bank's standalone net profit rose to Rs 1,080 crore in the September quarter from Rs 654 crore a year earlier. Net interest income increased to Rs 2,822 crore, while operating profit climbed 29.4% and provisions declined year-on-year.", "source": "NDTV Profit", "pub_date_str": "17 Oct 2026, 08:20 PM IST", "pub_date_relative": "1h ago"}, {"title": "Q2 results 2026 race: HDFC vs ICICI Bank vs Axis Bank vs Yes Bank vs IDBI - Which bank won in PAT, NII, asset quality?", "full_content": "HDFC vs ICICI Bank vs Axis Bank vs Yes Bank : The weekend was not a busy day for investors tracking bank stocks as multiple lenders, including HDFC Bank , ICICI Bank, Axis Bank, IDBI Bank , and Yes Bank, announced their second quarter results for the financial year 2026-27 on Saturday, October 17.\n\nWhile ICICI Bank, Axis Bank, and Yes Bank reported double digit growth in net profit after tax (PAT), HDFC Bank saw single digit PAT growth in Q2FY27. Contrastingly, IDBI Bank saw 39% decline in its net profit, as its performance was overshadowed by steep high-base effect amid developments linked to privatization.\n\nHere\u2019s a thorough comparison of ICICI, HDFC, Axis, Yes and IDBI Bank Q2 results in terms of profit, net interest income (NII) and revenue.\n\nThe private lending giant reported a 4.7% annual jump in its standalone net profit to \u20b9 19,510 crore for the July-September quarter of FY27. Sharp 67% decline in treasury trading gains affected HDFC Bank Q2 result. Its treasury trading gains fell to \u20b9 780 crore from \u20b9 2,390 crore in the corresponding quarter.\n\nICICI Bank reported a 20.1% annual jump in standalone net profit to \u20b9 14,843 crore in Q2FY27. The double digit growth was supported by strong loan growth and lower provisions for bad loans.\n\nThe bank's net interest income (NII), the difference between interest earned and interest paid, rose 17.7 % to \u20b9 25,339 crore in the July-September quarter, compared with \u20b9 21,529 crore in the corresponding period last year.\n\nAxis Bank reported a 38% annual jump in its net profit to \u20b9 7,003 crore during the quarter under review. The sharp jump in net profit was led by decline in provisions and improving asset quality.\n\nIts provisions and contingencies fell to \u20b9 1,694 crore from \u20b9 3,547 crore in the corresponding quarter last year.", "source": "LiveMint Markets", "pub_date_str": "17 Oct 2026, 08:16 PM IST", "pub_date_relative": "1h ago"}, {"title": "Saba Capital sells $675,333 in BlackRock ECAT shares", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Oct 2026, 08:16 PM IST", "pub_date_relative": "1h ago"}, {"title": "HDFC Bank Bets On 25 Bps Hike Tailwind In Q3 As Structural Savings Shift Squeezes CASA", "full_content": "HDFC Bank flagged a structural shift in household savings that is shrinking CASA deposits across the banking system.", "source": "NDTV Profit", "pub_date_str": "17 Oct 2026, 08:09 PM IST", "pub_date_relative": "1h ago"}, {"title": "Q2FY27 Results Live Updates: Yes Bank Profit Surges, ICICI Margin Dips; HDFC Bank PAT Below Estimates", "full_content": "HDFC Bank, ICICI Bank, Axis Bank, IDBI Bank, Yes Bank, and India Cements and more companies announced their Q2 FY27 earnings today, Oct. 17.", "source": "NDTV Profit", "pub_date_str": "17 Oct 2026, 08:04 PM IST", "pub_date_relative": "1h ago"}, {"title": "DeepSeek releases AI model update, opens search APIs to all users", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Oct 2026, 08:03 PM IST", "pub_date_relative": "1h ago"}, {"title": "Tether global investments fund buys $1.28m in Gold.com stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Oct 2026, 08:01 PM IST", "pub_date_relative": "2h ago"}, {"title": "Earnings call transcript: Axis Bank posts strong Q2 2026 profit growth", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Oct 2026, 07:51 PM IST", "pub_date_relative": "2h ago"}, {"title": "HDFC Bank May Explore Ways To Reduce Pressure From Corporate Deposits", "full_content": "Outgoing CEO Sashidhar Jagdishan said incoming chief Anup Bagchi could consider alternative balance-sheet strategies, including some non-deposit funding, as the bank seeks to increase the share of retail deposits. The lender will still need non-retail liabilities to support demand across its businesses.", "source": "NDTV Profit", "pub_date_str": "17 Oct 2026, 07:44 PM IST", "pub_date_relative": "2h ago"}, {"title": "Bitcoin price holds near $81,000 as ETF outflows weigh on sentiment", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Oct 2026, 07:44 PM IST", "pub_date_relative": "2h ago"}, {"title": "Rs 3,600 crore business enquiries at 5-day handicraft fair", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a Rs 3,600 crore business enquiries at 5-day handicraft fair The Economic Times daily newspaper is available online now. Read Today's Paper Rs 3,600 crore business enquiries at 5-day handicraft fair SECTIONS Rs 3,600 crore business enquiries at 5-day handicraft fair ET Bureau Last Updated: Oct 17, 2026, 07:37:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Over 7,300 buyers participated in the 62nd IHGF Delhi Fair held from October 13 to 17. Business enquiries at the fair totaled Rs 3,600 crore, demonstrating strong international interest. Buyers from 105 countries, including the US, UK, and Germany, were present. Many brands indicated a significant shift toward sourcing more products from Indian manufacturers. India's handicraft exports reached $3.75 billion for the fiscal year 2025-26.\n\nWar's second-order effects are becoming visible in critical sectors\n\nUS mid-term elections \u2013 Part 2: What does it mean for Trump to lose control of Congress?\n\nHomebuyers wait as NCLT panel picks holes in unfinished Jaypee projects\n\nWhat is the real impact of 13x jump in cash transfers to women?\n\nAirlines Q2 turbulence: Fewer passengers, rising fares and a crude shock\n\nThe NBFC saga - Part 2: Line drawn in 2006 is reason for the headlines today\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "17 Oct 2026, 07:37 PM IST", "pub_date_relative": "2h ago"}, {"title": "Bank of Canada sees sharply higher inflation outlook as oil surges, Macklem says", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Oct 2026, 07:36 PM IST", "pub_date_relative": "2h ago"}, {"title": "Axis Bank Battles 11 Bps NIM Drag From FCNR-B, Eyes Margin Uptick On Asset Mix", "full_content": "Axis Bank is exploring changes to its lending and product mix to improve margins after FCNR-B deposits dragged net interest margins by 11 basis points in Q2 FY27.", "source": "NDTV Profit", "pub_date_str": "17 Oct 2026, 07:34 PM IST", "pub_date_relative": "2h ago"}, {"title": "Inside NASA's JPL: The Space Technology Bringing India And US Together", "full_content": "At JPL's Microdevices Laboratory, researchers develop miniature sensors and electronic components for spacecraft, where equipment must function reliably in extreme conditions and often cannot be repaired once deployed.", "source": "NDTV Profit", "pub_date_str": "17 Oct 2026, 07:25 PM IST", "pub_date_relative": "2h ago"}, {"title": "Ferguson COO Thees sells $127,125 of FERG stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Oct 2026, 07:16 PM IST", "pub_date_relative": "2h ago"}, {"title": "ICICI Bank Eyes Agri-Provision Reversal In Next Two Quarters Pending RBI Nod, FCNR Cushions CASA Dip", "full_content": "ICICI Bank expects to reverse provisions against its agricultural portfolio over the next two quarters, subject to RBI approval. Management said the bank has completed the necessary review of its agri-portfolio remediation.", "source": "NDTV Profit", "pub_date_str": "17 Oct 2026, 07:08 PM IST", "pub_date_relative": "2h ago"}, {"title": "Using two health insurance policies for one hospital bill? Are you aware of these claim rejection traps?", "full_content": "Many individuals receive health insurance coverage from their employers, while some also buy a separate individual health insurance policy to supplement their corporate cover and provide additional financial protection.\n\nA policyholder is allowed to claim under both corporate and individual health insurance policies during the same hospitalisation if the expenses exceed the coverage available under one policy.\n\nMost importantly, the total reimbursement from both policies cannot exceed the actual hospitalisation expenses incurred. Policyholders also cannot claim the same medical expense twice under different policies.\n\nIf you fail to follow the prescribe claim process or overlook policy conditions, it could delay claim settlement or even worse, lead to a claim rejection, leaving you to bear the expenses out of your own pocket.\n\nThough Insurance Regulatory and Development Authority of India ( IRDAI ) allows people to buy multiple health insurance policies, there are certain circumstances under which the second claim may be rejected or partially settled.\n\nIf you plan to claim health insurance benefits under two policies, you need to follow some steps to ensure a smoother settlement process, according to a blog post by Universal Sompo General Insurance . Details below:\n\nStep 1: Inform both insurers that you intend to claim under multiple policies and then share the policy numbers, hospitalisation details and estimated expenses.\n\nStep 2: If the hospital is in the first insurer's network, file a cashless claim with it. If the approved amount falls short of the hospital bill, approach the second insurer for the balance payment. If both insurers are non-network providers, pay the bills upfront and seek reimbursement from them.", "source": "LiveMint Money", "pub_date_str": "17 Oct 2026, 07:03 PM IST", "pub_date_relative": "2h ago"}, {"title": "Trump's student loan overhaul could lead to more bankruptcy filings, former judge says", "full_content": "In Judge Sarah Sharer Curley's nearly three decades presiding over bankruptcy cases, some were especially painful to witness, she said \u2014 such as the 73-year-old woman who stood before her in 2012 with a student loan balance of more than $584,000.\n\nThe debt dated back to the 1970s and had grown throughout the woman's public sector career, Curley writes in her new book, \" The Price of Forgiveness: Debt, Bankruptcy, and the Future of Fairness in America .\" She had \"never made a lot of money,\" Curley said, and by the time she sought debt relief, the woman was living in poverty, with Social Security as her only income. Even so, strict bankruptcy laws can make it nearly impossible to discharge student loans .\n\nCurley, the first woman appointed to the U.S. Bankruptcy Court for the District of Arizona, said it was a familiar story.\n\n\"We allow the financial markets to take innumerable risks, yet we refuse to allow an individual to be forgiven for choosing to pursue an advanced degree,\" Curley wrote.\n\nCurley retired in 2014. CNBC spoke with her this month about her new book, in which she describes a legal system that often fails to give indebted Americans the second chance it promises. In 2025, more than half a million personal bankruptcy cases were filed \u2014 an almost 50% rise from three years prior, according to the Administrative Office of the U.S. Courts.\n\nAnnie Nova: What do people get most wrong about those who file for bankruptcy?\n\nSarah Sharer Curley: People assume that individuals who file for bankruptcy are committing fraud, trying to hide assets and cheating creditors. Nothing could be further from the truth.\n\nSSC: People are subject to many unexpected events. People can't always plan adequately for the next earthquake, hurricane or natural disaster. But usually, it's someone losing a job. It could also be an illness that becomes chronic with medical costs that increase dramatically over a short period.", "source": "CNBC Top News", "pub_date_str": "17 Oct 2026, 07:00 PM IST", "pub_date_relative": "3h ago"}, {"title": "Tear gas, clashes hit French cities in cost-of-living protests", "full_content": "Police fired tear gas and clashed with protesters in several French cities on Saturday as some of the most violent protests in years over living costs and public services drew thousands onto the streets.\n\nFrench authorities said 140 protests involving 32,800 people had been recorded outside Paris by midday and blamed the unrest on what they described as the \"ultra-left.\"\n\nThe protests began last \u200cmonth at high schools in Paris' poor northern suburbs, where anger over teacher shortages and shabby facilities evolved into a broader movement focused on inequality, public spending and living standards.\n\nViolent incidents were reported in several cities, including vandalism in Marseille and attacks targeting police, media and public buildings, the Interior Ministry said.\n\nPolice were visible in central Paris, especially near landmarks such as the Champs-\u00c9lys\u00e9es and the Arc de Triomphe, which were excluded from the routes of two authorized demonstrations.\n\nProtesters in high-visibility vests blocked streets, echoing the Yellow Vest movement that marked President Emmanuel Macron's previous term.\n\nIn Marseille, the mayor said protesters vandalized the town hall, and that additional police were being sent to the city after talks with the prime minister and the interior minister.\n\n\"We are fighting because the cost of living is too harsh, because the price of fuel is too high, because high school pupils are being violently attacked and hurt all over the country just for trying to protest and ask for more teachers and decent learning conditions,\" said Lola, a 19-year-old protester in Paris.", "source": "CNBC Top News", "pub_date_str": "17 Oct 2026, 06:51 PM IST", "pub_date_relative": "3h ago"}, {"title": "Delhi Court Orders CJP Leader Abhijeet Dipke's Release On Rs 50,000 Peace Bond", "full_content": "Dipke was among several student and youth leaders detained ahead of the Lehra Do Tiranga' march scheduled to take place at Connaught Place on Friday evening.", "source": "NDTV Profit", "pub_date_str": "17 Oct 2026, 06:47 PM IST", "pub_date_relative": "3h ago"}, {"title": "HDFC Bank Expects NIM To Improve From Q3 As Loan Repricing Kicks In", "full_content": "HDFC Bank expects margins to improve from the December quarter as repricing of floating-rate loans begins to offset the full-quarter impact of FCNR(B) funding costs.", "source": "NDTV Profit", "pub_date_str": "17 Oct 2026, 06:37 PM IST", "pub_date_relative": "3h ago"}, {"title": "'Everyone laughed' when he started a pumpkin farm\u2014now it brings in $2 million a year", "full_content": "Three decades ago, when Kelly Schultz announced his intention to start a pumpkin farm, \"everybody laughed at me,\" he says. Schultz, a second-generation antique seller, had no prior experience with farming when he bought a small farm in Clarence, New York, in 1993.\n\nSchultz, 74, is the owner and operator of The Great Pumpkin Farm , a seasonal attraction about 15 miles northeast of Buffalo that draws over 100,000 visitors each fall.\n\nThe Great Pumpkin Farm brought in $2 million in annual revenue in 2025, according to documents reviewed by CNBC Make It \u2014 and it's open just seven weeks a year.\n\nThis year, the farm is open to visitors between Sept. 19 and Oct. 31, and they're not just coming to buy pumpkins. With a $20 weekend admission ticket, fall enthusiasts can ride the farm's pumpkin-themed train, explore its giant corn maze and compete in pie-eating contests, among other attractions.\n\nHalloween is big business for Schultz and other seasonal business owners. Halloween-related spending is expected to reach $13.5 billion in the U.S. in 2026, according to a consumer survey by the National Retail Federation published in September. Among the 74% of Americans celebrating the holiday this year, 42% said they plan to carve a pumpkin.\n\nAt The Great Pumpkin Farm, \"attendance is increasing just about every year,\" according to Schultz.\n\nDuring the fall, \"there are people that come here almost every weekend,\" he says. \"They love it so much, they just keep coming back.\"\n\nSchultz, who runs an antique store and an antique auction business year-round, says he was inspired to start his farm after visiting a pumpkin patch in upstate New York in the early 1990s. That farm had \"muddy parking lots and not a whole lot of restrooms,\" he recalls, but there were \"a zillion people\" walking around and buying pumpkins.", "source": "CNBC Top News", "pub_date_str": "17 Oct 2026, 06:30 PM IST", "pub_date_relative": "3h ago"}, {"title": "\u2018Some people did everything right\u2019: I lost my home in the Great Recession. I rent in my 50s. Why is that judged as failure?", "full_content": "\u201dI earn $110,000 a year.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "17 Oct 2026, 06:30 PM IST", "pub_date_relative": "3h ago"}, {"title": "Meet the home buyers totally unfazed by 7% mortgage rates", "full_content": "Individual investors and second-home buyers accounted for 1 in 5 home purchases in September \u2014 the highest share in a little over a year.", "source": "MarketWatch Top Stories", "pub_date_str": "17 Oct 2026, 06:30 PM IST", "pub_date_relative": "3h ago"}, {"title": "Websites are closing their doors to AI agents - The Verge", "full_content": "Websites are closing their doors to AI agents The Verge What Amazon.com (AMZN)'s AI Shopping Bot Block Means For Shareholders Yahoo Finance Too Many Bots in the Kitchen? Williams Sonoma Bans AI Shoppers KQED Amazon Won\u2019t Let Your AI Agent Shop. Its Ad Business Explains Why Business Model Analyst Amazon\u2019s AI Shopping Battle Puts Website Terms to the Test The Fashion Law", "source": "Google News Business", "pub_date_str": "17 Oct 2026, 06:30 PM IST", "pub_date_relative": "3h ago"}, {"title": "These tech stocks are a buy ahead of their earnings reports, Bank of America says", "full_content": "Bank of America says there are several technology stocks that have more room to run heading into their next quarterly results.", "source": "CNBC Top News", "pub_date_str": "17 Oct 2026, 06:19 PM IST", "pub_date_relative": "3h ago"}, {"title": "Hindustan Zinc Q2 results 2026: Anil Agarwal-led Vedanta firm to report earnings next week - Preview, dividend history", "full_content": "Hindustan Zinc Q2 results: Shares of Vedanta Group-firm Hindustan Zinc will remain in focus next week due to the announcement of their second quarter results for the financial year 2026-27. The world\u2019s largest integrated zinc producer is set to report better production than the previous quarter.\n\nHindustan Zinc has announced an equity dividend of \u20b9 11 per share over the last one year. The silver producer had announced \u20b9 11 per equity share dividend in April this year. Here are all the details about Hindustan Zinc Q2 results, expectations and dividend history.\n\nOne of the world\u2019s largest silver producers, Hindustan Zinc, is likely to report positive earnings supported by silver and lead prices. However, the cost of production (CoP) is likely to increase on a quarterly basis driven by input cost inflation, according to the Motilal Oswal Financial Services Limited (MOFSL) report.\n\nThe brokerage highlighted that production is likely to improve during the quarter under review. Hindustan Zinc\u2019s reported profit after tax is likely to increase by 106% on a yearly basis during Q2FY27 and net sales may see double digit growth.\n\nThe Anil Agarwal-led Vedanta Group\u2019s subsidiary announced a total of \u20b9 11 per equity share dividend with a face value of \u20b9 2 each. Its dividend yield stood at 2.04%.\n\nThe metal giant is set to announce second quarter result for the financial year 2026-27 on Monday, October 19. \u201cThe Board of Directors of the Company is scheduled to be held on Monday, October 19, 2026, inter\u2010alia, to consider and approve the Unaudited Financial Results (Standalone and Consolidated) of the Company for the second quarter and half year ended September 30, 2026,\u201d read the BSE filing released earlier.\n\nThe metal stock closed 1.87% higher at \u20b9 540 per share on BSE on Friday, OCtober 16. The stock has surged 3.44% in three months, but has declined 8.85% in six months.", "source": "LiveMint Markets", "pub_date_str": "17 Oct 2026, 06:19 PM IST", "pub_date_relative": "3h ago"}, {"title": "Berkshire shares buck market sell-off, rally to highest since Buffett said he would step down as CEO", "full_content": "(This is the Warren Buffett Watch newsletter, news and analysis on all things Warren Buffett and Berkshire Hathaway. You can sign up here to receive it every Friday evening in your inbox.)\n\nBerkshire Hathaway shares closed Friday at their highest level since Warren Buffett told shareholders at the May 2025 annual meeting he planned to step down as CEO at the end of that year .\n\nThe day before that Saturday surprise, both the Class A and Class B shares had closed at all-time highs.\n\nOver the next three months, they lost more than 14% of their value as investors worried a \" Buffett premium \" was dissolving.\n\nIt's been more than a year since their post-meeting low in August of 2025, and the recovery has not been a straight line, but BRK.A ended Friday at $798,000, just 1.4% below its all-time closing high of $809,350.\n\nThe B shares finished at $532.02, also 1.4% under their all-time closing high of $539.80.\n\nA loss Thursday broke a 10-session winning streak that added 5% to Berkshire's stock prices but they rebounded with gains of more than 1% Friday.\n\nCNBC Pro thinks investors may be happy Berkshire is spending some of its big cash pile under CEO Greg Abel, with $4.5 billion of buybacks in Q2 , investments in Alphabet , Taylor Morrison Home , Lennar , (although there haven't been any buys of that stock since October 2), and now, Bending Spoons . (More on that below).", "source": "CNBC Top News", "pub_date_str": "17 Oct 2026, 06:16 PM IST", "pub_date_relative": "3h ago"}, {"title": "US' Russia sanction waiver a relief for India's exporters, energy security: Experts", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a US' Russia sanction waiver a relief for India's exporters, energy security: Experts The Economic Times daily newspaper is available online now. Read Today's Paper US' Russia sanction waiver a relief for India's exporters, energy security: Experts SECTIONS US' Russia sanction waiver a relief for India's exporters, energy security: Experts PTI Last Updated: Oct 17, 2026, 06:10:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The waiver of sanctions under the Sanctioning Russia and Iran Act provides relief for India's energy security. Experts believe that continued access to Russian crude will support economic growth and ease inflationary pressures. While the waiver offers temporary relief, uncertainty remains regarding future contracts and investments. Trade organizations express hope for improving bilateral trade relations and advancing discussions between India and the US.\n\nUS mid-term elections \u2013 Part 2: What does it mean for Trump to lose control of Congress?\n\nThe ABCD of the US mid-term elections \u2013 Part 1: Why it matters across the globe\n\nCurbing rupee bets: What the RBI\u2019s new rules mean for the hedge-now-or-wait question\n\nBrinjal, buffalo, bacteria: Inside India\u2019s pay-for-nature system\n\nHomebuyers wait as NCLT panel picks holes in unfinished Jaypee projects\n\nThe NBFC saga - Part 3: How one default in 2018 changed the way RBI reads risk\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "17 Oct 2026, 06:10 PM IST", "pub_date_relative": "3h ago"}, {"title": "Influencers and biohackers swear by fasting. Here\u2019s what the science says.", "full_content": "Fasting can help some people reduce how many calories they eat \u2014 but it\u2019s not \u201ceffortless\u201d as some would have you believe.", "source": "MarketWatch Top Stories", "pub_date_str": "17 Oct 2026, 06:01 PM IST", "pub_date_relative": "4h ago"}, {"title": "Silver\u2019s recent 50% drop from a record high hints that an economic slowdown looms", "full_content": "There\u2019s a relatively off-the-radar commodity that can provide hints on where the economy is headed \u2014 and it\u2019s seen its value drop more than 50% from a record high earlier this year.", "source": "MarketWatch Top Stories", "pub_date_str": "17 Oct 2026, 06:00 PM IST", "pub_date_relative": "4h ago"}, {"title": "Exclusive: Musk tells Isaacson \"AI and robots\" will need to fix deficit - Axios", "full_content": "Exclusive: Musk tells Isaacson \"AI and robots\" will need to fix deficit Axios Musk x Isaacson: The Builders Podcast, Explained in 5 Points BASENOR - Tesla Accessories Elon Musk to share key message on solving US national debt in \u2018The Builders with Walter Isaacson\u2019 podcast soon The News International Musk says US debt cannot be solved without AI AzerNews", "source": "Google News Business", "pub_date_str": "17 Oct 2026, 05:56 PM IST", "pub_date_relative": "4h ago"}, {"title": "Central Bank of India Q2 profit rises 21% as loans grow 30%", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a Earnings \u203a Central Bank of India Q2 profit rises 21% as loans grow 30% Central Bank of India Share Price Union Bank of India Share Price Bank of Baroda Share Price Indian Bank Share Price Canara Bank Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Central Bank of India Q2 profit rises 21% as loans grow 30% SECTIONS Central Bank of India Q2 profit rises 21% as loans grow 30% By Joel Rebello , ET Bureau Last Updated: Oct 17, 2026, 05:44:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Central Bank of India reported a 21% rise in September 2026 quarterly net profit to Rs 1,469 crore, supported by 26% net interest income growth and 30% loan expansion. Asset quality improved, with net NPA declining to 0.31%, while operating efficiency strengthened.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "17 Oct 2026, 05:44 PM IST", "pub_date_relative": "4h ago"}, {"title": "Exit Of The Anchor: Kaizad Bharucha's Three-Decade Run Inside India's Largest Private Bank", "full_content": "Kaizad Bharucha has sought cessation from HDFC Bank with effect from December 31, 2026, ending a tenure that began in October 1995. The Deputy Managing Director has been among the lender\u2019s most experienced senior executives.", "source": "NDTV Profit", "pub_date_str": "17 Oct 2026, 05:42 PM IST", "pub_date_relative": "4h ago"}, {"title": "Hurricane Trudy makes its way toward Mexico as Typhoon Champi threatens Guam", "full_content": "Hurricane Trudy moved toward the southwestern and west-central areas of Mexico's Pacific coast and could keep growing through Saturday, forecasters said.\n\nTrudy's center will approach the coast on Saturday and pass near it into Sunday. A hurricane warning was in effect from Manzanillo, Colima, to Cabo Corrientes, Jalisco.\n\nThe storm was a Category 1 hurricane with maximum sustained winds of 90 mph (150 kph) on Friday night.\n\nTrudy was about 240 miles (385 kilometers) west-southwest of Acapulco, in the Mexican state of Guerrero, and about 215 miles (345 kilometers) south-southeast of Manzanillo, Colima state, while moving northwest at 8 mph (13 kph), the U.S. National Hurricane Center said.\n\nThe Mexican navy urged the maritime community and coastal residents to exercise extreme caution due to high waves, heavy rains and the risk of rising river levels, flooding and landslides in vulnerable areas.\n\nThe state of Colima said risks are currently low, but the storm could bring significant rainfall that could cause damage because the ground is saturated after successive storms have hit the Pacific coast.\n\nThrough the weekend, Trudy is expected to produce 4 to 8 inches (10 to 20 cm) of rain, with isolated higher totals around 15 inches.\n\nAlso in the Pacific, Typhoon Champi was intensifying and moving west toward Guam at 15 mph (23 kph), with maximum sustained winds increasing to 100 mph (160 kph), according to the U.S. Weather Service and the U.S. Navy's Meteorology and Oceanography Command website.", "source": "CNBC Top News", "pub_date_str": "17 Oct 2026, 05:38 PM IST", "pub_date_relative": "4h ago"}, {"title": "Air India, AI Express Cancel Saudi Arabia Flights Till Oct 24 Over Escalating Mideast Tensions", "full_content": "Airlines extend cancellations until October 24 amid rising West Asia tensions; affected passengers can opt for free date changes, alternative Gulf routes or full refunds", "source": "NDTV Profit", "pub_date_str": "17 Oct 2026, 05:35 PM IST", "pub_date_relative": "4h ago"}, {"title": "Microsoft, Shopify and 3 more AI stocks that are favorite Wall Street earnings plays", "full_content": "As earnings season kicks off, select tech companies have the opportunity to deliver big positive surprises for investors.", "source": "MarketWatch Top Stories", "pub_date_str": "17 Oct 2026, 05:31 PM IST", "pub_date_relative": "4h ago"}, {"title": "Software\u2019s new consolidator gets big vote of confidence from Berkshire - CNBC", "full_content": "Software\u2019s new consolidator gets big vote of confidence from Berkshire CNBC Berkshire\u2019s Mind-Bender Barron's Berkshire Hathaway: Abel Pushes Into New Territory With Bending Spoons Investment Morningstar Company News for Oct 15, 2026 Yahoo Finance Warren Buffett\u2019s Berkshire invests $330M in Bending Spoons TheStreet", "source": "Google News Business", "pub_date_str": "17 Oct 2026, 05:30 PM IST", "pub_date_relative": "4h ago"}, {"title": "I\u2019m 64 with two sons, but only one works in the family firm. Should I leave him 70% of the business?", "full_content": "\u201cI have some reservations about the long-term stability of my younger son\u2019s marriage.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "17 Oct 2026, 05:30 PM IST", "pub_date_relative": "4h ago"}], "cfa": [{"title": "Semiconductor market to remain solid \u2018at least through next year,\u2019 South Korea finance minister says", "full_content": "The semiconductor boom will last at least through 2027, South Korean finance minister Lee Hyoung-Il said on Saturday.\n\n\"For now, our view is that we can sustain this growth at least through next year,\" Lee told CNBC on the sidelines of the IMF-World Bank annual meetings in Bangkok. \"That's because the gap between demand and supply for semiconductors is still very wide, and supply is still being expanded.\"\n\nHis comments come after semiconductor stocks fell sharply this week, hurt by investor concerns about interest rate hikes and rising competition from Chinese companies. South Korean chip stocks like SK Hynix and Seoul Semiconductor were part of the sell-off, along with U.S. giants like Nvidia .\n\nChip stocks have fueled volatility in South Korea's stock market this year, Lee said. He attributed the market's wild swings to the semiconductor industry's larger share of the economy than in other countries. Despite the market swings, South Korea's economy is \"solid,\" Lee said.\n\nOn Thursday, an opinion column in Maeil Business Newspaper , a prominent South Korean publication, urged the country's government to prepare for the coming slowdown in the artificial intelligence boom. The author said two experts expect a \"flood of new supply\" of semiconductors that will turn the memory market \"into a red ocean\" by 2029, according to a CNBC translation .\n\nWhile South Korea's semiconductors may be driving volatility in its stock market, the industry has also fueled tax growth. Lee said the country expects to collect more taxes than initially projected this year.\n\nSouth Korea will ultimately be in a stronger fiscal position because of the chip boom, he added.\n\nWATCH: Don't overlook opportunity in South Korea, says Verdad Advisers' Rasmussen", "source": "CNBC Top News", "pub_date_str": "17 Oct 2026, 10:01 PM IST", "pub_date_relative": "just now", "cfa_topics": ["Economics", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Investors are buying up vast tracts of timberland across U.S. in one of market's longest-term bets", "full_content": "When the economy and the market look shaky, gold and government bonds are the traditional places to park money. Lately, some investors have also been looking at something more rooted: timber.\n\nThe pitch is easy to like: a back-to-basics, natural asset that grows on its own, matures into a harvest and can be cashed in all while you use it to hunt, pitch a tent, or forage.\n\nInstitutions have been buying timberland at a rate of one million acres per year, according to Bank of America, and some financial advisors say individual investors, including younger Americans priced out of the housing market, are also taking a look at the asset class. But it is far from a rush, and investors who already own timberland caution that it may not be very profitable in the short term.\n\n\"Timber is a very low return investment. I have curtailed my investments,\" said Pat Dorn, founder of Anchor Investment Management, a fee-only advisory firm in Columbia, South Carolina, and a former chairman of the South Carolina Forestry Association. Dorn owns 2,500 acres of timberland in South Carolina's booming upstate region. Dorn said the problem is that right now more timber is being grown than is needed in a sluggish housing economy.\n\n\"Supply beats demand, and that causes flat prices. Timber is not an investment I would make currently,\" Dorn said.\n\nNationally, the Bureau of Labor Statistics' producer price index for logs, bolts, timber, pulpwood and wood chips ticked up in September, but prices have been mostly on the decline since summer 2022. This measures prices received by producers for those products, rather than timberland values or investment returns.", "source": "CNBC Top News", "pub_date_str": "17 Oct 2026, 10:01 PM IST", "pub_date_relative": "1m ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Cupid\u2019s Aditya Halwasiya bets big on PC Jeweller after 70% rally in 6 months - Who is he? Check PCJ stock returns, RoE", "full_content": "Days after achieving a debt free milestone, PC Jeweller , is receiving strong interest from investors. Cupid \u2019s Chairman and Managing Director (MD), Aditya Kumar Halwasiya, recently purchased 5.10 crore shares worth approximately \u20b9 73.59 crore through a bulk deal.\n\nThe recent bulk deal has again put spotlight on PC Jeweller stock, which saw a sharp 12% rally on Friday, October 16.\n\nAditya Halwasiya serves as the chairman and managing director of Cupid Limited. The third-generation entrepreneur has emerged as India's fastest wealth creator by percentage.\n\nAccording to M3M Hurun India Rich List 2026, Halwasiya emerged as India's fastest wealth creator by percentage growth. His wealth jumped 859% to \u20b9 18,800 crore. His education started in Kolkata, where he attended La Martiniere for Buys. He graduated from St. Xavier's College in Kolkata, and later on completed his master's degree in global finance at Fordham University in New York.\n\nAs per NSE website data, Cupid\u2019s Aditya Kumar Halwasiya purchased 5.10 crore shares worth approximately \u20b9 73.59 crore through a bulk deal. The transaction was executed at an average price of \u20b9 14.43 per share.\n\nLast month, PC Jeweller announced that it had cleared its outstanding dues to all 14 consortium banks and achieved debt-free status. The New Delhi-headquartered jewellery maker had earlier carried a total debt of around \u20b9 3,000 crore and opted for a one-time settlement (OTS) of its outstanding bank dues in September 2024.\n\nThe stock closed 12.59% higher at \u20b9 16.28 per share on BSE with an MCap of \u20b9 15,876.48 crore on Friday. Its return on equity (ROE) stood at 21.14%. The jewellery stock has delivered 70.83% return in 6 months, and around 74.87% return in 2026 so far. Its share price value has surged 33.22% in one year and around 391% in three years.\n\nCatch all the Business News , Market News , Breaking News Events and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.", "source": "LiveMint Markets", "pub_date_str": "17 Oct 2026, 09:14 PM IST", "pub_date_relative": "47m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "AI stocks plunge. Inflation heats up. Where we're still finding opportunities", "full_content": "The sinking AI trade rattled last week's market. But solid bank earnings and a rotation beyond tech gave us reasons for optimism.", "source": "CNBC World Economy", "pub_date_str": "17 Oct 2026, 09:12 PM IST", "pub_date_relative": "49m ago", "cfa_topics": ["Economics", "Financial Statement Analysis"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Software\u2019s new consolidator gets big vote of confidence from Berkshire", "full_content": "At the time of its Nasdaq debut in July, Bending Spoons was a little-known holding company out of Italy that owned older internet names like AOL, Vimeo, Eventbrite and Evernote.\n\nLess than four months later, the Milan-based firm has emerged as a surprising home for former high-flying software startups that have been thrust aside by the artificial intelligence boom. Its M&A plan got a major boost this week from the most famous holding company on the planet: Berkshire Hathaway .\n\nBerkshire, which Bending Spoons describes as a \"longstanding inspiration\" for its strategy, has now invested over $900 million in the company, including a $330 million stake disclosed on Wednesday. Wall Street loved the deal, sending Bending Spoons' stock up 41%, though some of those gains were lost later in the week, leaving the company with a market cap of about $30 billion.\n\n\"Berkshire's decision to add to its position just a few months after the IPO and at these levels provides another vote of confidence in the Bending Spoons model from one of the world's most respected long-term investors,\" wrote analysts at Mizuho, in a report after the announcement.\n\nThe other big news out of Bending Spoons this week underscores the flipside of the business: job cuts. In August, Bending Spoons announced it was buying workflow software provider Airtable for about $1.3 billion, or almost 90% below the company's peak valuation from late 2021. Bending Spoons said Monday that a \"large portion of the pre-acquisition team\" from Airtable would be leaving with \"substantial separation packages.\" Layoffs were previously implemented at Evernote, Vimeo, WeTransfer and others in the portfolio.\n\nFor the technology industry, Bending Spoons' moves represent the latest example of how quickly fortunes are turning in the AI era, as new agents powered by large language models displace software developers and the products they built.", "source": "CNBC World Economy", "pub_date_str": "17 Oct 2026, 08:41 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Portfolio Management"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Commerce Ministry organizes \u201cLeveraging FTAs\u201d outreach program in Jaipur to boost exports", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a Commerce Ministry organizes \u201cLeveraging FTAs\u201d outreach program in Jaipur to boost exports The Economic Times daily newspaper is available online now. Read Today's Paper Commerce Ministry organizes \u201cLeveraging FTAs\u201d outreach program in Jaipur to boost exports SECTIONS Commerce Ministry organizes \u201cLeveraging FTAs\u201d outreach program in Jaipur to boost exports ET Online Last Updated: Oct 17, 2026, 08:36:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Commerce Ministry organized an outreach event in Jaipur, targeting exporters to clarify the use of benefits provided by India's free trade agreements. This initiative aims to translate preferential market access into tangible export opportunities for Indian enterprises, emphasizing Rajasthan's strengths in textiles, handicrafts, and gems. Plans for coordination among stakeholders are outlined to optimize support for exporters moving forward.\n\nWar's second-order effects are becoming visible in critical sectors\n\nUS mid-term elections \u2013 Part 2: What does it mean for Trump to lose control of Congress?\n\nHomebuyers wait as NCLT panel picks holes in unfinished Jaypee projects\n\nWhat is the real impact of 13x jump in cash transfers to women?\n\nAirlines Q2 turbulence: Fewer passengers, rising fares and a crude shock\n\nThe NBFC saga - Part 2: Line drawn in 2006 is reason for the headlines today\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "17 Oct 2026, 08:36 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Defying Global Slowdown: How India Flipped Post-Covid Gloom Into A Historic Rally, Economist Explains", "full_content": "India\u2019s economy rebounded from a 5.8% pandemic-era contraction to grow 9.7% in 2021, followed by four consecutive years of expansion above 7%. Economist Kyunghoon Kim says the sustained momentum could extend the country\u2019s historic growth streak.", "source": "NDTV Profit", "pub_date_str": "17 Oct 2026, 08:32 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "'Dead money\u2019 for a decade: Why this hedge fund approach may deliver an advantage over bonds", "full_content": "Investors may want to rethink their bond allocation and opt for managed futures exposure.\n\nDBi's Andrew Beer suggests the popular hedge fund strategy could deliver a modern twist to traditional 60/40 portfolios .\n\n\"[Bonds have] been dead money for the entire decade,\" the firm's co-founder and managing member told CNBC's \"ETF Edge\" this week. \"I fell in love with a strategy called managed futures because tactical is really good. Be nimble when other people's [portfolios] aren't.\"\n\nBeer contends the managed futures strategy, historically only available to hedge funds, could counterbalance stocks better than bonds during periods of volatility , which has been moving higher due to recent worries surrounding debt and the artificial intelligence trade .\n\nHis reason: Managed futures exchange-traded funds can go long and short across global markets to position early against turbulent market events.\n\n\"You want something that has low correlation to both stocks and bonds, and something that will do well in crises,\" Beer said. \"It's very, very hard to find a better hedge fund strategy than managed futures to accomplish that.\"\n\nHe helps manage the iMGP DBi Managed Futures Strategy ETF (DBMF) . The fund replicates the performance of leading managed futures hedge funds inside a low-cost, liquid ETF, according to the firm's website.\n\n\"There's an existential crisis right now in strategic asset allocation and the model portfolio world,\" Beer said about the 60/40 approach. \"I love my bonds \u2026 [but] I'm not making it a 40% allocation for something that is not adding to the rest of my portfolio.\"", "source": "CNBC Finance", "pub_date_str": "17 Oct 2026, 08:30 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Quantitative Methods", "Fixed Income", "Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "Yes Bank Q2 Results: Net Profit Surges 65% To Rs 1,080 Crore, NII Up 23% YoY; Asset Quality Stable", "full_content": "Yes Bank's standalone net profit rose to Rs 1,080 crore in the September quarter from Rs 654 crore a year earlier. Net interest income increased to Rs 2,822 crore, while operating profit climbed 29.4% and provisions declined year-on-year.", "source": "NDTV Profit", "pub_date_str": "17 Oct 2026, 08:20 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Q2 results 2026 race: HDFC vs ICICI Bank vs Axis Bank vs Yes Bank vs IDBI - Which bank won in PAT, NII, asset quality?", "full_content": "HDFC vs ICICI Bank vs Axis Bank vs Yes Bank : The weekend was not a busy day for investors tracking bank stocks as multiple lenders, including HDFC Bank , ICICI Bank, Axis Bank, IDBI Bank , and Yes Bank, announced their second quarter results for the financial year 2026-27 on Saturday, October 17.\n\nWhile ICICI Bank, Axis Bank, and Yes Bank reported double digit growth in net profit after tax (PAT), HDFC Bank saw single digit PAT growth in Q2FY27. Contrastingly, IDBI Bank saw 39% decline in its net profit, as its performance was overshadowed by steep high-base effect amid developments linked to privatization.\n\nHere\u2019s a thorough comparison of ICICI, HDFC, Axis, Yes and IDBI Bank Q2 results in terms of profit, net interest income (NII) and revenue.\n\nThe private lending giant reported a 4.7% annual jump in its standalone net profit to \u20b9 19,510 crore for the July-September quarter of FY27. Sharp 67% decline in treasury trading gains affected HDFC Bank Q2 result. Its treasury trading gains fell to \u20b9 780 crore from \u20b9 2,390 crore in the corresponding quarter.\n\nICICI Bank reported a 20.1% annual jump in standalone net profit to \u20b9 14,843 crore in Q2FY27. The double digit growth was supported by strong loan growth and lower provisions for bad loans.\n\nThe bank's net interest income (NII), the difference between interest earned and interest paid, rose 17.7 % to \u20b9 25,339 crore in the July-September quarter, compared with \u20b9 21,529 crore in the corresponding period last year.\n\nAxis Bank reported a 38% annual jump in its net profit to \u20b9 7,003 crore during the quarter under review. The sharp jump in net profit was led by decline in provisions and improving asset quality.\n\nIts provisions and contingencies fell to \u20b9 1,694 crore from \u20b9 3,547 crore in the corresponding quarter last year.", "source": "LiveMint Markets", "pub_date_str": "17 Oct 2026, 08:16 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Fixed Income"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Q2FY27 Results Live Updates: Yes Bank Profit Surges, ICICI Margin Dips; HDFC Bank PAT Below Estimates", "full_content": "HDFC Bank, ICICI Bank, Axis Bank, IDBI Bank, Yes Bank, and India Cements and more companies announced their Q2 FY27 earnings today, Oct. 17.", "source": "NDTV Profit", "pub_date_str": "17 Oct 2026, 08:04 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Tether global investments fund buys $1.28m in Gold.com stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Oct 2026, 08:01 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Earnings call transcript: Axis Bank posts strong Q2 2026 profit growth", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Oct 2026, 07:51 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Bitcoin price holds near $81,000 as ETF outflows weigh on sentiment", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Oct 2026, 07:44 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Alternative Investments", "Portfolio Management"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Bank of Canada sees sharply higher inflation outlook as oil surges, Macklem says", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Oct 2026, 07:36 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "ICICI Bank Eyes Agri-Provision Reversal In Next Two Quarters Pending RBI Nod, FCNR Cushions CASA Dip", "full_content": "ICICI Bank expects to reverse provisions against its agricultural portfolio over the next two quarters, subject to RBI approval. Management said the bank has completed the necessary review of its agri-portfolio remediation.", "source": "NDTV Profit", "pub_date_str": "17 Oct 2026, 07:08 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Using two health insurance policies for one hospital bill? Are you aware of these claim rejection traps?", "full_content": "Many individuals receive health insurance coverage from their employers, while some also buy a separate individual health insurance policy to supplement their corporate cover and provide additional financial protection.\n\nA policyholder is allowed to claim under both corporate and individual health insurance policies during the same hospitalisation if the expenses exceed the coverage available under one policy.\n\nMost importantly, the total reimbursement from both policies cannot exceed the actual hospitalisation expenses incurred. Policyholders also cannot claim the same medical expense twice under different policies.\n\nIf you fail to follow the prescribe claim process or overlook policy conditions, it could delay claim settlement or even worse, lead to a claim rejection, leaving you to bear the expenses out of your own pocket.\n\nThough Insurance Regulatory and Development Authority of India ( IRDAI ) allows people to buy multiple health insurance policies, there are certain circumstances under which the second claim may be rejected or partially settled.\n\nIf you plan to claim health insurance benefits under two policies, you need to follow some steps to ensure a smoother settlement process, according to a blog post by Universal Sompo General Insurance . Details below:\n\nStep 1: Inform both insurers that you intend to claim under multiple policies and then share the policy numbers, hospitalisation details and estimated expenses.\n\nStep 2: If the hospital is in the first insurer's network, file a cashless claim with it. If the approved amount falls short of the hospital bill, approach the second insurer for the balance payment. If both insurers are non-network providers, pay the bills upfront and seek reimbursement from them.", "source": "LiveMint Money", "pub_date_str": "17 Oct 2026, 07:03 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Trump's student loan overhaul could lead to more bankruptcy filings, former judge says", "full_content": "In Judge Sarah Sharer Curley's nearly three decades presiding over bankruptcy cases, some were especially painful to witness, she said \u2014 such as the 73-year-old woman who stood before her in 2012 with a student loan balance of more than $584,000.\n\nThe debt dated back to the 1970s and had grown throughout the woman's public sector career, Curley writes in her new book, \" The Price of Forgiveness: Debt, Bankruptcy, and the Future of Fairness in America .\" She had \"never made a lot of money,\" Curley said, and by the time she sought debt relief, the woman was living in poverty, with Social Security as her only income. Even so, strict bankruptcy laws can make it nearly impossible to discharge student loans .\n\nCurley, the first woman appointed to the U.S. Bankruptcy Court for the District of Arizona, said it was a familiar story.\n\n\"We allow the financial markets to take innumerable risks, yet we refuse to allow an individual to be forgiven for choosing to pursue an advanced degree,\" Curley wrote.\n\nCurley retired in 2014. CNBC spoke with her this month about her new book, in which she describes a legal system that often fails to give indebted Americans the second chance it promises. In 2025, more than half a million personal bankruptcy cases were filed \u2014 an almost 50% rise from three years prior, according to the Administrative Office of the U.S. Courts.\n\nAnnie Nova: What do people get most wrong about those who file for bankruptcy?\n\nSarah Sharer Curley: People assume that individuals who file for bankruptcy are committing fraud, trying to hide assets and cheating creditors. Nothing could be further from the truth.\n\nSSC: People are subject to many unexpected events. People can't always plan adequately for the next earthquake, hurricane or natural disaster. But usually, it's someone losing a job. It could also be an illness that becomes chronic with medical costs that increase dramatically over a short period.", "source": "CNBC Top News", "pub_date_str": "17 Oct 2026, 07:00 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Corporate Issuers", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Tear gas, clashes hit French cities in cost-of-living protests", "full_content": "Police fired tear gas and clashed with protesters in several French cities on Saturday as some of the most violent protests in years over living costs and public services drew thousands onto the streets.\n\nFrench authorities said 140 protests involving 32,800 people had been recorded outside Paris by midday and blamed the unrest on what they described as the \"ultra-left.\"\n\nThe protests began last \u200cmonth at high schools in Paris' poor northern suburbs, where anger over teacher shortages and shabby facilities evolved into a broader movement focused on inequality, public spending and living standards.\n\nViolent incidents were reported in several cities, including vandalism in Marseille and attacks targeting police, media and public buildings, the Interior Ministry said.\n\nPolice were visible in central Paris, especially near landmarks such as the Champs-\u00c9lys\u00e9es and the Arc de Triomphe, which were excluded from the routes of two authorized demonstrations.\n\nProtesters in high-visibility vests blocked streets, echoing the Yellow Vest movement that marked President Emmanuel Macron's previous term.\n\nIn Marseille, the mayor said protesters vandalized the town hall, and that additional police were being sent to the city after talks with the prime minister and the interior minister.\n\n\"We are fighting because the cost of living is too harsh, because the price of fuel is too high, because high school pupils are being violently attacked and hurt all over the country just for trying to protest and ask for more teachers and decent learning conditions,\" said Lola, a 19-year-old protester in Paris.", "source": "CNBC Top News", "pub_date_str": "17 Oct 2026, 06:51 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Delhi Court Orders CJP Leader Abhijeet Dipke's Release On Rs 50,000 Peace Bond", "full_content": "Dipke was among several student and youth leaders detained ahead of the Lehra Do Tiranga' march scheduled to take place at Connaught Place on Friday evening.", "source": "NDTV Profit", "pub_date_str": "17 Oct 2026, 06:47 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "'Everyone laughed' when he started a pumpkin farm\u2014now it brings in $2 million a year", "full_content": "Three decades ago, when Kelly Schultz announced his intention to start a pumpkin farm, \"everybody laughed at me,\" he says. Schultz, a second-generation antique seller, had no prior experience with farming when he bought a small farm in Clarence, New York, in 1993.\n\nSchultz, 74, is the owner and operator of The Great Pumpkin Farm , a seasonal attraction about 15 miles northeast of Buffalo that draws over 100,000 visitors each fall.\n\nThe Great Pumpkin Farm brought in $2 million in annual revenue in 2025, according to documents reviewed by CNBC Make It \u2014 and it's open just seven weeks a year.\n\nThis year, the farm is open to visitors between Sept. 19 and Oct. 31, and they're not just coming to buy pumpkins. With a $20 weekend admission ticket, fall enthusiasts can ride the farm's pumpkin-themed train, explore its giant corn maze and compete in pie-eating contests, among other attractions.\n\nHalloween is big business for Schultz and other seasonal business owners. Halloween-related spending is expected to reach $13.5 billion in the U.S. in 2026, according to a consumer survey by the National Retail Federation published in September. Among the 74% of Americans celebrating the holiday this year, 42% said they plan to carve a pumpkin.\n\nAt The Great Pumpkin Farm, \"attendance is increasing just about every year,\" according to Schultz.\n\nDuring the fall, \"there are people that come here almost every weekend,\" he says. \"They love it so much, they just keep coming back.\"\n\nSchultz, who runs an antique store and an antique auction business year-round, says he was inspired to start his farm after visiting a pumpkin patch in upstate New York in the early 1990s. That farm had \"muddy parking lots and not a whole lot of restrooms,\" he recalls, but there were \"a zillion people\" walking around and buying pumpkins.", "source": "CNBC Top News", "pub_date_str": "17 Oct 2026, 06:30 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "\u2018Some people did everything right\u2019: I lost my home in the Great Recession. I rent in my 50s. Why is that judged as failure?", "full_content": "\u201dI earn $110,000 a year.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "17 Oct 2026, 06:30 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "These tech stocks are a buy ahead of their earnings reports, Bank of America says", "full_content": "Bank of America says there are several technology stocks that have more room to run heading into their next quarterly results.", "source": "CNBC Top News", "pub_date_str": "17 Oct 2026, 06:19 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Hindustan Zinc Q2 results 2026: Anil Agarwal-led Vedanta firm to report earnings next week - Preview, dividend history", "full_content": "Hindustan Zinc Q2 results: Shares of Vedanta Group-firm Hindustan Zinc will remain in focus next week due to the announcement of their second quarter results for the financial year 2026-27. The world\u2019s largest integrated zinc producer is set to report better production than the previous quarter.\n\nHindustan Zinc has announced an equity dividend of \u20b9 11 per share over the last one year. The silver producer had announced \u20b9 11 per equity share dividend in April this year. Here are all the details about Hindustan Zinc Q2 results, expectations and dividend history.\n\nOne of the world\u2019s largest silver producers, Hindustan Zinc, is likely to report positive earnings supported by silver and lead prices. However, the cost of production (CoP) is likely to increase on a quarterly basis driven by input cost inflation, according to the Motilal Oswal Financial Services Limited (MOFSL) report.\n\nThe brokerage highlighted that production is likely to improve during the quarter under review. Hindustan Zinc\u2019s reported profit after tax is likely to increase by 106% on a yearly basis during Q2FY27 and net sales may see double digit growth.\n\nThe Anil Agarwal-led Vedanta Group\u2019s subsidiary announced a total of \u20b9 11 per equity share dividend with a face value of \u20b9 2 each. Its dividend yield stood at 2.04%.\n\nThe metal giant is set to announce second quarter result for the financial year 2026-27 on Monday, October 19. \u201cThe Board of Directors of the Company is scheduled to be held on Monday, October 19, 2026, inter\u2010alia, to consider and approve the Unaudited Financial Results (Standalone and Consolidated) of the Company for the second quarter and half year ended September 30, 2026,\u201d read the BSE filing released earlier.\n\nThe metal stock closed 1.87% higher at \u20b9 540 per share on BSE on Friday, OCtober 16. The stock has surged 3.44% in three months, but has declined 8.85% in six months.", "source": "LiveMint Markets", "pub_date_str": "17 Oct 2026, 06:19 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Fixed Income", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Berkshire shares buck market sell-off, rally to highest since Buffett said he would step down as CEO", "full_content": "(This is the Warren Buffett Watch newsletter, news and analysis on all things Warren Buffett and Berkshire Hathaway. You can sign up here to receive it every Friday evening in your inbox.)\n\nBerkshire Hathaway shares closed Friday at their highest level since Warren Buffett told shareholders at the May 2025 annual meeting he planned to step down as CEO at the end of that year .\n\nThe day before that Saturday surprise, both the Class A and Class B shares had closed at all-time highs.\n\nOver the next three months, they lost more than 14% of their value as investors worried a \" Buffett premium \" was dissolving.\n\nIt's been more than a year since their post-meeting low in August of 2025, and the recovery has not been a straight line, but BRK.A ended Friday at $798,000, just 1.4% below its all-time closing high of $809,350.\n\nThe B shares finished at $532.02, also 1.4% under their all-time closing high of $539.80.\n\nA loss Thursday broke a 10-session winning streak that added 5% to Berkshire's stock prices but they rebounded with gains of more than 1% Friday.\n\nCNBC Pro thinks investors may be happy Berkshire is spending some of its big cash pile under CEO Greg Abel, with $4.5 billion of buybacks in Q2 , investments in Alphabet , Taylor Morrison Home , Lennar , (although there haven't been any buys of that stock since October 2), and now, Bending Spoons . (More on that below).", "source": "CNBC Top News", "pub_date_str": "17 Oct 2026, 06:16 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Ana
