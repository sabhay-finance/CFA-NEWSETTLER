    const allData = {"general": [{"title": "How UPI MDR could undermine the economics of low-cost investing", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nYou will start to see merchants paying a fee (merchant discount rate, MDR) to receive money in transactions above \u20b9 2,000 from 15 October.\n\nMerchants will pay 0.40% of a transaction. But certain merchants will pay less. Insurance, for example, pays a flat \u20b9 5 per transaction. Lumpsum investments into mutual funds made through UPI will be charged 0.02% (2 basis points, bps), which the fund house might need to bear. Brokers too will pay a similar 0.02% on inflows that use UPI.\n\nFair disclosure: we run a mutual fund, so assume bias. The problem isn't that asset management companies must bear this cost\u2014it's that the cost of incremental investment in a fund is very high for a low-cost fund. Many low-cost index funds charge 10 to 20 bps as management fees, and 2 bps is a very high fee to bear for these transactions. The larger funds will be fine since their incremental flows are tiny compared to the fund itself, but for smaller funds, the burden is greater.\n\nNow take a stockbroker. If you have a balance with them in cash, they will send it back to you (by regulation) every three months. You send that money back to them via UPI and it will cost them \u20b9 20 per lakh. If you don't transact or just do a few transactions where the brokerage (now typically a flat rate fee) adds up to \u20b9 20 or less, the broker doesn't see a profit.\n\nSo, regardless of UPI regulations , brokers might have to charge an extra fee to use UPI, as will mutual funds, eventually. Investors will (and even now, can) move to other electronic payment systems such as NEFT or RTGS, which typically take a couple of hours and cost nothing, as mandated by the Reserve Bank of India.\n\nIt would be better to keep the fee lower, at \u20b9 2 per transaction, which is around what ity smaller companies to deliver alpha but stresses the need for greater selectivity.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "17 Sep 2026, 12:43 PM IST", "pub_date_relative": "26m ago"}, {"title": "Reddit co-founder says tech industry has been 'tone deaf' in explaining AI: 'Misinformation flying around'", "full_content": "The tech industry has been \"tone deaf\" in explaining AI and properly informing the public about real risks, Reddit co-founder Alexis Ohanian told CNBC on Wednesday.\n\nOhanian said the debate around AI should focus on substantive risks rather than issues that can be used to score political points, arguing that an informed public is essential to navigating the technology. He acknowledged that the tech industry has contributed to the problem by doing a \"pretty tone deaf job\" of explaining AI, while suggesting that its risks are more mundane than the \"Terminator and Skynet\" scenarios some fear.\n\nSkynet is a fictional self-aware AI system in the \"Terminator\" movies that saw humans as a threat and sought to wipe them out.\n\nThe comments come days after warnings from researchers at AI labs OpenAI and Anthropic of the rapid advancement of the technology known as recursive self-improvement, or RSI.\n\nRSI refers to AI systems helping develop more advanced models, potentially creating a cycle in which increasingly capable systems contribute to building even more capable ones.\n\nThe concern is that if AI systems take over the process of training new models, their human developers could eventually lose control over how those systems evolve.\n\nOhanian argued that while AI risks are real, apocalyptic \"Terminator\"-style warnings can distract from real concerns such as agent swarms, when multiple AI agents work together to perform a complicated task.\n\n\"There are risks, I do think they're more benign, or they're more banal than people are thinking,\" he said.", "source": "CNBC World Economy", "pub_date_str": "17 Sep 2026, 12:42 PM IST", "pub_date_relative": "26m ago"}, {"title": "Trump derides EU pitch to Canada as \u2019laughable\u2019, threatens more tariffs", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Sep 2026, 12:42 PM IST", "pub_date_relative": "26m ago"}, {"title": "Copper rebounds at $6.54 but faces dense resistance: Live levels", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Sep 2026, 12:42 PM IST", "pub_date_relative": "26m ago"}, {"title": "Natural Gas compresses near $2.90 in tight range: Live levels", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Sep 2026, 12:42 PM IST", "pub_date_relative": "26m ago"}, {"title": "Gold at $4,357 faces resistance wall in bearish regime: Live levels", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Sep 2026, 12:41 PM IST", "pub_date_relative": "27m ago"}, {"title": "Why is Exosens stock surging today?", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Sep 2026, 12:41 PM IST", "pub_date_relative": "27m ago"}, {"title": "Brent Oil drops below key support at $103.66: Live levels", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Sep 2026, 12:41 PM IST", "pub_date_relative": "27m ago"}, {"title": "Why is Wizz Air stock climbing today?", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Sep 2026, 12:41 PM IST", "pub_date_relative": "27m ago"}, {"title": "Happy Forgings share price target: 'Industrials, PVs to drive next leg of growth' - Buy from Motilal Oswal Fin Services", "full_content": "Shares of Happy Forgings Limited were trading lower on Thursday, after seeing strong gains in the previous sessions. The Punjab-headquartered company is likely to record double digit revenue growth in the next two financial years driven by new order wins, higher realisations, improving mix and operating leverage.\n\nThe stock has delivered around 85.67% return in 2026 so far and around 120% return in one year. Brokerage, Motilal Oswal sees an 18% upside in Happy Forgings stock.\n\nThe industrials segment remains a key growth driver for the firm, whereas PV mix is on track to reach 14% of the mix in a couple of years. The outlook for HFL\u2019s core segment, domestic tractors has also improved following the GST rate cuts announced in September and is also expected to remain strong in the near term.\n\n\u201cGiven its healthy new order wins, we expect HFL to post a 25% standalone revenue CAGR over FY26-29. Further, while there could be some margin pressure due to rising input costs in the near term, we expect HFL to post a margin expansion to 33% over FY26-29,\u201d stated the brokerage in its report.\n\nMotilal Oswal maintained a \u2018Buy\u2019 rating for the stock with a target price of \u20b9 2,438 per share. \u201cWe expect HFL to record revenue/EBITDA/PAT CAGR of 25%/28%/30% over FY26-29. We reiterate our BUY rating on the stock with a TP of INR2,438 (based on 38x Sep\u201928E EPS).\u201d\n\nThe company scrip was trading 0.83% lower at \u20b9 2139 per share on BSE with a market capitalisation of \u20b9 20,187.61 crore at 12:20 pm on Thursday. osts and higher-for-longer rates.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "17 Sep 2026, 12:31 PM IST", "pub_date_relative": "38m ago"}, {"title": "India\u2019s billion-dollar trade juggernaut has an unwanted case of missing balance", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a India\u2019s billion-dollar trade juggernaut has an unwanted case of missing balance The Economic Times daily newspaper is available online now. Read Today's Paper India\u2019s billion-dollar trade juggernaut has an unwanted case of missing balance SECTIONS India\u2019s billion-dollar trade juggernaut has an unwanted case of missing balance By Anand Singha , ET Online Last Updated: Sep 17, 2026, 12:30:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India\u2019s early FTAs promised a two-way trade highway, but 15 years later the traffic looks decidedly one-sided. Deficits with ASEAN, Japan and South Korea have ballooned as imports raced ahead of exports. Trade experts say the answer is not to shut the road, but to repair it \u2014 from tariff imbalances and non-tariff barriers to poor FTA utilisation and costly inputs at home.\n\nA different kind of buyback. Is this the beginning of these kinds of buybacks?\n\nCome January 2027, will India\u2019s online platforms get their own Tukaram?\n\nFour rules made HDFC Bank a compounder. All four have stopped. Can the new CEO rewrite them?\n\nGold rush on Dalal St as regional jewellers bid to be the next Tanishq\n\nHormuz is a state, not a strait. There are 10 other possible chokepoints for the global economy, including India\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers", "source": "Economic Times Economy", "pub_date_str": "17 Sep 2026, 12:30 PM IST", "pub_date_relative": "38m ago"}, {"title": "Sebi to consider brokers' concerns around MDR as UPI costs loom", "full_content": "The Securities and Exchange Board of India (Sebi) will look into concerns raised by stockbrokers over the merchant discount rate (MDR) on UPI transactions, chairman Tuhin Kanta Pandey said on Thursday, signalling a possible review of an additional cost that could affect the economics of digital fund transfers in the securities market.\n\n\u201cI think there are some important issues there. We will certainly look into it and see how we can ease them,\u201d Pandey said on the sidelines of the National Bank for Financing Infrastructure and Development (NaBFID) - Infrastructure Conclave 2026 on Thursday.\n\nThe chairman\u2019s comments come after the National Payments Council of India (NPCI) on Tuesday introduced a charge on UPI payments above certain thresholds. MDR is a fee charged to the merchant on certain digital payment transactions, with the money distributed among participants in the payments ecosystem, including payment service providers and banks. The framework, which will be implemented from 15 October, mandates a 0.4% fee on person-to-merchant (P2M) UPI transactions above \u20b9 2,000. For transactions of \u20b9 75,000 and above, the MDR will be capped at \u20b9 300 per transaction. This includes capital-market transactions, involving mutual funds, securities and brokers, which will attract an MDR of 0.02%. These, too, are capped at \u20b9 300.\n\nThe rules pose a challenge for stockbrokers who accept payments from investors using UPI. According to Sebi rules, all registered brokers must use valid UPI handles and display them on their websites, as part of measures to ensure investors transfer money only to verified accounts. Brokers, however, are concerned that the MDR applicable to merchant UPI transactions could be more than the brokerage revenue generated from the associated trades.\n\nA transfer of funds into a trading account does not necessarily result in a trade.", "source": "LiveMint Markets", "pub_date_str": "17 Sep 2026, 12:29 PM IST", "pub_date_relative": "40m ago"}, {"title": "SGB 2019-20 Series IV redemption today at \u20b915,173: \u20b91 lakh investment grows to nearly \u20b93.95 lakh", "full_content": "SGB 2019-20 Series IV investors can prematurely redeem their bonds on September 17, 2026 at \u20b9 15,173 per unit, RBI said. For those who bought online at \u20b9 3,840 per gram, \u20b9 1 lakh invested at issue would be worth about \u20b9 3.95 lakh, excluding interest.\n\nThe Reserve Bank of India (RBI) has fixed the premature redemption price of Sovereign Gold Bond (SGB) 2019-20 Series IV at \u20b9 15,173 per gram for September 17, 2026. The tranche was originally issued on September 17, 2019, and investors become eligible for premature redemption after five years, subject to the scheme's redemption conditions.\n\nThe RBI calculates the redemption price using the simple average of the closing price of 999-purity gold for the three business days preceding the redemption date, as published by the India Bullion and Jewellers Association Ltd (IBJA). For this redemption window, the relevant gold prices are those for September 11, September 15 and September 16, 2026.\n\nThe SGB 2019-20 Series IV was issued at \u20b9 3,890 per gram, while investors applying online and paying digitally received a \u20b9 50 discount, taking the effective issue price to \u20b9 3,840 per gram.\n\nFor an investor who bought the bond online, the capital appreciation can be calculated as follows.\n\nTherefore, a \u20b9 1 lakh investment at the online issue price would have purchased around 26.04 grams of gold through the SGB. At the September 17 redemption price of \u20b9 15,173 per gram, those units would be worth approximately \u20b9 3.95 lakh.\n\nThis calculation represents the capital appreciation alone and does not include the interest paid on the SGB.\n\nSovereign Gold Bonds also pay interest, unlike physical gold. Under the SGB scheme, the bonds generally carry a fixed interest rate of 2.5% per annum on the initial investment, with interest paid half-yearly.", "source": "LiveMint Money", "pub_date_str": "17 Sep 2026, 12:20 PM IST", "pub_date_relative": "48m ago"}], "cfa": [{"title": "How UPI MDR could undermine the economics of low-cost investing", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nYou will start to see merchants paying a fee (merchant discount rate, MDR) to receive money in transactions above \u20b9 2,000 from 15 October.\n\nMerchants will pay 0.40% of a transaction. But certain merchants will pay less. Insurance, for example, pays a flat \u20b9 5 per transaction. Lumpsum investments into mutual funds made through UPI will be charged 0.02% (2 basis points, bps), which the fund house might need to bear. Brokers too will pay a similar 0.02% on inflows that use UPI.\n\nFair disclosure: we run a mutual fund, so assume bias. The problem isn't that asset management companies must bear this cost\u2014it's that the cost of incremental investment in a fund is very high for a low-cost fund. Many low-cost index funds charge 10 to 20 bps as management fees, and 2 bps is a very high fee to bear for these transactions. The larger funds will be fine since their incremental flows are tiny compared to the fund itself, but for smaller funds, the burden is greater.\n\nNow take a stockbroker. If you have a balance with them in cash, they will send it back to you (by regulation) every three months. You send that money back to them via UPI and it will cost them \u20b9 20 per lakh. If you don't transact or just do a few transactions where the brokerage (now typically a flat rate fee) adds up to \u20b9 20 or less, the broker doesn't see a profit.\n\nSo, regardless of UPI regulations , brokers might have to charge an extra fee to use UPI, as will mutual funds, eventually. Investors will (and even now, can) move to other electronic payment systems such as NEFT or RTGS, which typically take a couple of hours and cost nothing, as mandated by the Reserve Bank of India.\n\nIt would be better to keep the fee lower, at \u20b9 2 per transaction, which is around what fund houses absorb right now. This will ensure that fund houses do not pass the costs to the fund investor.", "source": "LiveMint Money", "pub_date_str": "17 Sep 2026, 12:57 PM IST", "pub_date_relative": "11m ago", "cfa_topics": ["Quantitative Methods", "Financial Statement Analysis", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "Debenhams owner says turnaround accelerates as H1 EBITDA rises 14%", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Sep 2026, 12:51 PM IST", "pub_date_relative": "17m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Vodafone Idea share price snaps losing streak amid positive market | Is it time to book profits?", "full_content": "Vodafone Idea share price snapped its two-day losing streak in Thursday's trading session. The telecom stock edged higher amid positive market sentiment, rising over 1% on the NSE in today's trade.\n\nVodafone Idea shares opened at \u20b9 14.25 apiece today, as compared to the previous close of \u20b9 14.26 on Wednesday. The stock surged as much as 1.05% to an intraday high of \u20b9 14.443.\n\nIn an exchange filing on 16 September, Vodafone Idea submitted the details of the order issued to the company by the Telecom Regulatory Authority of India (TRAI).\n\n\u201cFailure to meet the benchmark of the Quality of Service parameters in different service areas for November 2025 under Standards of Quality of Service of Access (Wireline and Wireless) and Broadband (Wireline and Wireless) Service Regulations, 2024,\u201d the company said in the filing.\n\nIt further added that the maximum financial impact is to the extent of the disincentive levied. The company is reviewing the order and evaluating the next steps in this matter.\n\nThis week, the company informed the exchanges that the TRAI has directed it to pay a financial disincentive of \u20b9 2 lakh. The penalty was imposed after the company failed to meet the prescribed quality-of-service benchmarks across various service areas for October 2025.\n\nSeparately, the company announced the appointment of Gopika Pant as an additional director following the recommendation of its Nomination and Remuneration Committee.\n\nMahesh M Ojha, VP Research & Business Development at Kantilal Chhaganlal Securities, believes that Vodafone Idea remains a high-beta trading opportunity, with the stock showing potential for further upside.", "source": "LiveMint Markets", "pub_date_str": "17 Sep 2026, 12:43 PM IST", "pub_date_relative": "25m ago", "cfa_topics": ["Equity Investments", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "ETMarkets Sm o remain strong in the near term.\n\n\u201cGiven its healthy new order wins, we expect HFL to post a 25% standalone revenue CAGR over FY26-29. Further, while there could be some margin pressure due to rising input costs in the near term, we expect HFL to post a margin expansion to 33% over FY26-29,\u201d stated the brokerage in its report.\n\nMotilal Oswal maintained a \u2018Buy\u2019 rating for the stock with a target price of \u20b9 2,438 per share. \u201cWe expect HFL to record revenue/EBITDA/PAT CAGR of 25%/28%/30% over FY26-29. We reiterate our BUY rating on the stock with a TP of INR2,438 (based on 38x Sep\u201928E EPS).\u201d\n\nThe company scrip was trading 0.83% lower at \u20b9 2139 per share on BSE with a market capitalisation of \u20b9 20,187.61 crore at 12:20 pm on Thursday. The stock had touched an intraday high of \u20b9 2,159.95 per share and an intraday low of \u20b9 2,127.05 per share. The stock has a return on equity (ROE) of 19.14%.\n\nHappy Forgings stock touched its 52-week high of \u20b9 2,484.30 per share on September 1, 2026, and dipped to its 52-week low of \u20b9 890.05 per share on October 15, 2025.", "source": "LiveMint Markets", "pub_date_str": "17 Sep 2026, 12:39 PM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Global Market: China, Hong Kong markets slip as Fed signals more rate hikes", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Global Market: China, Hong Kong markets slip as Fed signals more rate hikes Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market: China, Hong Kong markets slip as Fed signals more rate hikes SECTIONS Global M al and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "SGB 2019-20 Series IV redemption today at \u20b915,173: \u20b91 lakh investment grows to nearly \u20b93.95 lakh", "full_content": "SGB 2019-20 Series IV investors can prematurely redeem their bonds on September 17, 2026 at \u20b9 15,173 per unit, RBI said. For those who bought online at \u20b9 3,840 per gram, \u20b9 1 lakh invested at issue would be worth about \u20b9 3.95 lakh, excluding interest.\n\nThe Reserve Bank of India (RBI) has fixed the premature redemption price of Sovereign Gold Bond (SGB) 2019-20 Series IV at \u20b9 15,173 per gram for September 17, 2026. The tranche was originally issued on September 17, 2019, and investors become eligible for premature redemption after five years, subject to the scheme's redemption conditions.\n\nThe RBI calculates the redemption price using the simple average of the closing price of 999-purity gold for the three business days preceding the redemption date, as published by the India Bullion and Jewellers Association Ltd (IBJA). For this redemption window, the relevant gold prices are those for September 11, September 15 and September 16, 2026.\n\nThe SGB 2019-20 Series IV was issued at \u20b9 3,890 per gram, while investors applying online and paying digitally received a \u20b9 50 discount, taking the effective issue price to \u20b9 3,840 per gram.\n\nFor an investor who bought the bond online, the capital appreciation can be calculated as follows.\n\nTherefore, a \u20b9 1 lakh investment at the online issue price would have purchased around 26.04 grams of gold through the SGB. At the September 17 redemption price of \u20b9 15,173 per gram, those units would be worth approximately \u20b9 3.95 lakh.\n\nThis calculation represents the capital appreciation alone and does not include the interest paid on the SGB.\n\nSovereign Gold Bonds also pay interest, unlike physical gold. Under the SGB scheme, the bonds generally carry a fixed interest rate of 2.5% per annum on the initial investment, with interest paid half-yearly.", "source": "LiveMint Money", "pub_date_str": "17 Sep 2026, 12:20 PM IST", "pub_date_relative": "48m ago", "cfa_topics": ["Economics", "Fixed Income", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Paytm\u2019s UPI windfall faces a reality check from MDR sharing, competition", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nOne 97 Communications Ltd's (Paytm) stock has gained nearly 3% since 15 September when the National Payments Corporation of India (NPCI) announced a new merchant discount rate (MDR) framework for UPI transactions. Investors celebrated the move from a largely subsidy-based model towards a contractual and scalable revenue model.\n\nEffective 15 October, a 0.4% MDR will apply to eligible person-to-merchant (P2M) UPI transactions above \u20b9 2,000, subject to a \u20b9 300 cap, and concessional rates for specified sectors. But the eventual benefits accruing to Paytm will depend on how MDR is distributed, and how the eligible UPI pool shrinks with concessions and caps.\n\nThe headline 0.4% is not Paytm\u2019s revenue, as the MDR has to be shared across the ecosystem, including the issuing and acquiring banks. The NPCI has not yet specified the final distribution. JM Financial Institutional Securities assumes a 20% allocation to Paytm, translating into an 8-basis-point (bps) share of the MDR, while Emkay Global Financial Services has pencilled in a 10-bps passthrough.\n\nP2M UPI transactions above \u20b9 2,000 account for only 4% of transaction volumes, but they account for 67% by value. But the eligible UPI pool is expected to be much smaller. Here\u2019s why. Specified sectors including railways, telecom, insurance, fuel, and agricultural inputs will be eligible to pay a flat \u20b9 5 per transaction. These sectors form 46% of the UPI P2M transaction value. Capital market transactions also attract concessional rates, and small merchants are exempt.\n\nAccounting for these concessional rates, the eligible P2M UPI pool is expected to be much smaller than 67%. JM Financial expects it at 20%, and Emkay at 35%.\n\nTogether, these two assumptions\u2014passthrough MDR rate for Paytm and eligible UPI pool\u2014can massively impact the actual benefits accruing to Paytm.", "source": "LiveMint Markets", "pub_date_str": "17 Sep 2026, 12:13 PM IST", "pub_date_relative": "55m ago", "cfa_topics": ["Quantitative Methods", "Financial Statement Analysis"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "Apollo Micro Systems share price jumps 3.5% after recent fall | technical experts flag key levels", "full_content": "Apollo Micro Systems share price jumped 3.5% on Thursday, 17 September, even as the broader stock market remained largely flat. The stock, however, has remained under pressure over the past few weeks.\n\nThe stock has declined 8.76% over the past week, 1.82% in the last two weeks, 2.66% over one month and 14.14% over the past three months.\n\nApollo Micro Systems share price today opened at \u20b9 371.65, the stock touched an intraday high of \u20b9 382.90, and an intraday low of \u20b9 371.25 apiece on the BSE .\n\nHitesh Rathi, Technical Analyst \u2013 Equity & Derivatives at Angel One , said that following a strong rally earlier this year, during which the stock delivered returns of around 250%, the uptrend appears to have lost momentum.\n\nAccording to Rathi, the stock formed a weak breakout on its 3% \u00d7 3% Point & Figure (P&F) chart. The subsequent consolidation breakdown, along with the stock slipping below its 10-column moving average, has further weakened its short- to medium-term trend, which now appears to have turned downward.\n\n\u201cGoing forward, a move below the \u20b9 365\u2013360 level is likely to further accelerate the downward momentum in the stock,\u201d Rathi said.\n\nSudeep Shah, Head of Technical and Derivatives Research at SBI Securities, said Apollo Micro Systems has been consolidating in the \u20b9 467\u2013361 range since late May. However, the stock has continued to hold above its 20-week EMA, suggesting that the broader trend remains relatively resilient.\n\nShah noted that the RSI has remained largely flat on the weekly chart, indicating a sideways bias. He said the \u20b9 370\u2013365 zone is likely to act as an immediate support, while a decisive break below this zone could trigger fresh selling pressure in the stock.", "source": "LiveMint Markets", "pub_date_str": "17 Sep 2026, 12:11 PM IST", "pub_date_relative": "57m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Mukul Agrawal\u2019s portfolio: Top 5 stock holdings and their one-month performance", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News Mukul Agrawal\u2019s portfolio: Top 5 stock holdings and their one-month performance Written by Debaroti Adhikary , ETMarkets.com | Sep 17, 2026, 12:20:30 PM IST 1 / 6 Smart Money Moves Ace investor Mukul Mahavir Agrawal is known for his investment strategy, which has generated multibagger returns from several stocks. He publicly holds 72 stocks with a net worth of nearly Rs 7,910 crore, according to Trendlyne data. Here are his top five stock holdings and how they have performed over the past month, based on Trendlyne data.\n\nMukul Agrawal owned more than 10% stake in Indian engineering services and product R&D company ASM Technologies at the end of the April-June quarter of FY27, with a holding value of nearly Rs 1,022 crore. The shares have rallied more than 53% in just one month and a whopping 222% in six months. The multibagger stock has gained over 115% in 2026 so far and a massive 2,900% over five years.\n\nMukul Agrawal owned more than 3% stake in CDMO player Neuland Laboratories at the end of the first quarter of FY27, with a holding value of nearly Rs 891 crore. The shares have fallen around 3% in one month but have jumped more than 50% in 2026 so far. The stock has gained around 40% in one year and 515% in three years. Over five years, the shares have delivered tenbagger returns of nearly 1,270%.\n\nMukul Agrawal held a 1.4% stake in wealth management firm Nuvama Wealth at the end of the April-June quarter of FY27, with a holding value of nearly Rs 420 crore. The shares have gained around 1% in one month and 16% in 2026 so far. The stock has gained 32% over the past year.\n\nMukul Agrawal owned a 1.1% stake in PTC Industries, a manufacturer of precision metal components, titanium and superalloy materials, at the end of the first quarter of FY27, with a holding value of nearly Rs 358 crore.", "source": "Economic Times Markets", "pub_date_str": "17 Sep 2026, 12:08 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Rentomojo shares jump 9% after listing at 19% premium over IPO price. Can the debut-day mojo last?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Rentomojo shares jump 9% after listing at 19% premium over IPO price. Can the debut-day mojo last? Rentomojo Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Rentomojo shares jump 9% after listing at 19% premium over IPO price. Can the debut-day mojo last? SECTIONS Rentomojo shares jump 9% after listing at 19% premium over IPO price. Can the debut-day mojo last? By Debaroti Adhikary , ETMarkets.com Last Updated: Sep 17, 2026, 12:04:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Rentomojo shares surged 9% after a strong debut, taking gains to 30% above the IPO price. The stock listed at a 19% premium and rallied to Rs 526.70 within an hour. While analysts see long-term potential, they have flagged valuation concerns and advised caution after the sharp listing-day gains.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "17 Sep 2026, 12:04 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Paras Defence, Data Patterns, BEL, HAL and more: Why are defence stocks on fire today? Check sector outlook", "full_content": "Defence stocks were in the spotlight on Thursday, 17 September, as investors stepped in for value buying, while the sector continued to draw attention because of its long-term growth prospects.\n\nThe gains were broad-based, with names across defence manufacturing, electronics, aerospace and engineering companies moving higher even as the benchmark Nifty remained flat.\n\nParas Defence and Space Technologies jumped 4.5% to \u20b9 1,379.10, leading the gains among the defence counters in focus. Data Patterns rose 4.2% to \u20b9 4,506.05, while MTAR Technologies advanced 3.8% to \u20b9 7,060.\n\nBEML added 3.6% to \u20b9 2,066.05, and Apollo Micro Systems gained 3.5% to \u20b9 382.90.\n\nAmong other stocks, GRSE rose 2.3%, while Bharat Forge and Bharat Electronics (BEL) gained 2% each. HAL was up 1.5%, while BDL and Zen Technologies advanced 1%.\n\nThe Nifty India Defence Index rose 1.3%, compared with a flat Nifty, highlighting the relative strength seen across the defence segment.\n\nA major trigger for the sector has been the government\u2019s continued push to expand defence procurement and strengthen domestic manufacturing capabilities.\n\nEarlier this month, on September 8, the Defence Acquisition Council (DAC) approved Acceptance of Necessity (AoN), or in-principle administrative approval, for various acquisition proposals of the Defence Forces worth an estimated \u20b9 1,10,000 crore.", "source": "LiveMint Markets", "pub_date_str": "17 Sep 2026, 11:59 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Portfolio Management"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "A-One Steels fixes price band for Rs 405-crore IPO opening on September 24", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a A-One Steels fixes price band for Rs 405-crore IPO opening on September 24 The Economic Times daily newspaper is available online now. Read Today's Paper A-One Steels fixes price band for Rs 405-crore IPO opening on September 24 SECTIONS A-One Steels fixes price band for Rs 405-crore are Price Oriental Hotels Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Juniper Hotels shares rise 2% on proposed Rs 248 crore acquisition of Novotel Imagicaa SECTIONS Juniper Hotels shares rise 2% on proposed Rs 248 crore acquisition of Novotel Imagicaa By Surbhi Khanna , ET Online Last Updated: Sep 17, 2026, 11:48:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Juniper Hotels shares rose on Thursday after the company proposed acquiring the operating Novotel Imagicaa hotel in Maharashtra for Rs 248 crore. The 287-key property, located in Khopoli, spans around 11 acres and includes restaurants, banquet and meeting facilities. The acquisition is aimed at expanding Juniper\u2019s presence in the Mumbai-Pune corridor.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "17 Sep 2026, 11:46 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "\u2018Fed\u2019 up with inflation? US rate hike leaves RBI with an October-or-December dilemma, economists say", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Indicators \u203a \u2018Fed\u2019 up with inflation? US rate hike leaves RBI with an October-or-December dilemma, economists say The Economic Times daily newspaper is available online now. Read Today's Paper \u2018Fed\u2019 up with inflation? US rate hike leaves RBI with an October-or-December dilemma, economists say SECTIONS \u2018Fed\u2019 up with inflation? US rate hike leaves RBI with an October-or-December dilemma, economists say ET Online Last Updated: Sep 17, 2026, 11:45:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The US Federal Reserve\u2019s first rate hike since 2023 has added to pressure on India, with the rupee breaching 96 against the dollar and economists increasingly debating when the RBI could follow with a hike of its own. Emkay sees an October move as increasingly likely, while HDFC Bank expects the central bank could wait until December as it weighs inflation, growth, energy prices and currency pressures.\n\nA different kind of buyback. Is this the beginning of these kinds of buybacks?\n\nCome January 2027, will India\u2019s online platforms get their own Tukaram?\n\nFour rules made HDFC Bank a compounder. All four have stopped. Can the new CEO rewrite them?\n\nGold rush on Dalal St as regional jewellers bid to be the next Tanishq\n\nHormuz is a state, not a strait. There are 10 other possible chokepoints for the global economy, including India\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers", "source": "Economic Times Economy", "pub_date_str": "17 Sep 2026, 11:45 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Corporate Issuers", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Nifty Bank fails to hold ground after US Fed rate hike; HDFC, Yes Bank, ICICI among top laggards; Will they turn tide?", "full_content": "Nifty Bank, extending gains from the previous session, opened higher during Thursday\u2019s trading session after the Federal Reserve raised interest rates by a quarter percentage point. However the bank index appeared to lose its early hours gains, with HDFC Bank, Yes Bank, and ICICI Bank emerging as the top laggards.\n\nBank of Baroda, State Bank of India, Federal Bank, IDFC First Bank, etc were also among the top Nifty Bank laggards. Meanwhile, IndusInd Bank, Axis Bank, Punjab National Bank, AU Bank, Kotak Bank, etc were among the top gainers.\n\nNifty Bank was trading marginally lower at 56,291.85 points at 11 am, with five stocks advancing against nine declines.\n\nHDFC Bank share price was trading 0.89% lower at \u20b9 715.10 per share on NSE with a market capitalisation of \u20b9 11,01,728.45 crore (total).The bank stock touched its 52-week high of \u20b9 1,020.50 apiece on October 23, 2025. THe stock dipped to its 52-week low of \u20b9 681.90 per share on September 11, 2026. HDFC Bank stock has delivered 3% return in one week and has declined 26% in one year.\n\nHDFC Bank stock has seen sharp correction and is currently hovering close to its support zone of 684-636. This is the level from where buyers have previously been attracted to the stock, stated Kunal Kamble, Sr. Technical Research Analyst at Bonanza, highlighting that buying has been seen in the stock over the past four sessions.\n\n\u201cThe stock has reached a very attractive level that warrants attention, but it is better to wait for proper confirmation at the current juncture. A close above 735 could provide an opportunity to accumulate the stock, keeping the support zone and risk appetite in mind. We are not expecting a major spike in HDFC Bank at present; the stock may test investors' patience,\u201d explained Kamble.\n\nYes Bank stock was trading 1.67% lower at \u20b9 23.02 per share on NSE with a market capitalisation of \u20b9 72,255.86 crore at 11 am.", "source": "LiveMint Markets", "pub_date_str": "17 Sep 2026, 11:45 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}], "updated_at": "17 Sep 2026, 01:09 PM IST", "total_stories": 411};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
