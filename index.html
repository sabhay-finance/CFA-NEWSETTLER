<script>

    const allData = {"general": [{"title": "Is Hindustan Unilever stock undervalued?", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\n\u2018 Undervalued \u2019 is a relative term in the stock market. A stock cannot be called undervalued simply because its price or valuation multiple appears low. It is only undervalued relative to its intrinsic value , historical valuation, industry peers, growth prospects, or the broader market.\n\nFor example, a company trading at 12 times earnings may appear cheap compared with a peer trading at 20 times, but it may not be undervalued if its growth and profitability are significantly weaker.\n\nTherefore, investors should always ask: undervalued relative to what? The answer depends on the benchmark, assumptions, and timeframe used to assess the company\u2019s fair value.\n\nWith this in mind, let\u2019s examine whether Hindustan Unilever (HUL) stock is undervalued. In doing so, we will compare it to its own one-year, three-year, and five-year median price-to-earnings (PE) multiples. We will also compare its PE to those of its peers and the indices in which it sits.\n\nReaders should note that we are evaluating only a select set of valuation measures, and other factors must be taken into account. Valuation remains an imprecise science. Remember, valuation is not an exact science.\n\nThe decline in the PE from a median of 54.5 over five years to 42 at present shows investors are assigning lower valuation multiples to HUL stock compared to its history. So, based on its historical PE multiples, the stock is undervalued.\n\nIt\u2019s always hard to compare HUL with its FMCG peers because it\u2019s highly diversified giant, so the table above is not a straightforward apples-to-apples comparison.", "source": "LiveMint Markets", "pub_date_str": "09 Sep 2026, 07:00 AM IST", "pub_date_relative": "4m ago"}, {"title": "CVC hires TPG\u2019s second-in-command Todd Sisitsky as co-CEO", "full_content": "Private equity group brings on executive as part of succession plan for chief Rob Lucas", "source": "FT Markets", "pub_date_str": "09 Sep 2026, 06:57 AM IST", "pub_date_relative": "8m ago"}, {"title": "Breakout stocks to buy or sell: Sumeet Bagadia recommends five shares to buy today \u20149 September 2026", "full_content": "Buy or sell stocks: Indian equity benchmarks, the Sensex and Nifty 50, fell sharply on Tuesday, September 8, extending their decline for the second straight trading session.\n\nThe Sensex dropped 555 points, or around 0.73%, to end at 75,577.58. Meanwhile, the NSE Nifty 50 declined 144 points, or 0.61%, to close at 23,635.10.\n\nNifty 50 closed at 23,635.10, down 144.05 points (-0.61%), extending its decline for the second straight session. Persistent selling after the opening weakness pushed the index close to its intraday low, while elevated crude prices and renewed West Asia geopolitical concerns continued to keep sentiment subdued. With RSI at 30.88, momentum remains weak, although the index is nearing oversold territory.\n\n\u201cThe 23,500\u201323,580 zone is the immediate support, and a sustained break below this area could open room for further downside. On the upside, 23,800\u201323,870 is the first hurdle, followed by 23,950\u201324,000 and the 50-Day EMA near 24,116. Overall, the short-term bias remains bearish, with any recovery likely to face selling pressure unless key resistance levels are reclaimed,\u201d said Sumeet Bagadia, Executive Director at Choice Broking.\n\nBank Nifty closed at 56,777.55, down 310.75 points (-0.54%), continuing its weak trajectory amid pressure across private banks and financial stocks. The index remained below the previous close throughout most of the session and ended near the lower levels, keeping the near-term structure under pressure.\n\n\u201cThe index is currently testing an important 200-Day EMA support around 56,720, making this zone crucial for the next move. Holding above this support could trigger a technical rebound, while a decisive break below it may accelerate the downside and weaken the broader trend.", "source": "LiveMint Markets", "pub_date_str": "09 Sep 2026, 06:38 AM IST", "pub_date_relative": "27m ago"}, {"title": "Cattle futures higher on short covering", "full_content": "CHICAGO, Sept 8 (Reuters) - Chicago Mercantile Exchange live and feeder cattle futures turned higher on Tuesday on a bout of short covering in a correction from the previous week's downturn.\n\nCME October live cattle settled 4.075 cents higher at 217.025 cents per pound. CME October feeder cattle rose 5.3 cents to 325.45 cents per pound.\n\nA slew of bearish news, including U.S. President Donald Trump's announcement that he would ease beef tariffs and the re-opening of the U.S.-Mexico border to cattle imports, have largely been factored into the market, analysts said.\n\n\"We're getting back to the fundamental side of the cattle complex,\" said Karl Setzer, partner at Consus Ag Consulting, emphasizing that the live cattle supply remains relatively low.\n\nThough Labor Day marked the end of the summer grilling season, demand has remained relatively strong as retailers prepare for fall, a season where people often cook roasts.\n\nIndustry experts are continuing to assess consumer demand for beef as rising costs pressured pocketbooks, though last week's stronger-than-expected jobs report provided assurance.\n\nConsumers often shy away from purchasing beef when feeling financially stressed, as beef is typically one of the priciest protein options in grocery stores and restaurants.\n\nThe U.S.-Canada trade war hasn't had a substantive impact on cattle or hog futures, with industry players believing the spat between the two countries will be short-lived.", "source": "LiveMint Markets", "pub_date_str": "09 Sep 2026, 06:34 AM IST", "pub_date_relative": "31m ago"}, {"title": "Gold Holds Decline as Mideast Tensions Bolster Rate-Hike Case", "full_content": "(Bloomberg) -- Gold held a three-day decline, as fresh attacks on ships in the Middle East added to inflationary risks and raised prospects for a US interest-rate hike.\n\nBullion was little changed near $4,350 an ounce, having dropped 2.6% over the last three sessions. US forces destroyed five Iranian tankers carrying crude near Kharg Island, the Islamic Republic\u2019s main oil export hub, in response to attempted missile attacks on an American warship. That raised fears of an escalation in the months-long war and spooked energy markets.\n\nOil extended gains, with benchmark Brent crude close to $100 a barrel. That\u2019s adding momentum to the case for a rate hike less than a week before the Federal Reserve\u2019s Sept. 14-15 meeting. Traders are eyeing key inflation prints due this week for fresh clues to the central bank\u2019s next move.\n\n\u201cA softer reading will be a relief for gold traders\u201d as it would support the case for holding rates steady, said Ahmad Assiri, a market strategist at Pepperstone Group Ltd. \u201cThe greater risk lies in an upside inflation surprise, which would likely strengthen the case for a hike, creating what could be massive pressure on the precious metal,\u201d he added.\n\nTighter monetary policy is typically a headwind for gold, which doesn\u2019t pay interest. Swaps traders are pricing in a roughly 60% chance of a Fed rate increase this month.\n\nSince bouncing from a floor near $4,000 an ounce in July, gold has settled in a relatively narrow range either side of $4,400, as traders repeatedly recalibrate the outlook for Fed policy. Despite near-term headwinds, many investors are still betting that bullion will grind higher as it rediscovers its traditional value as a portfolio hedge.\n\n\u201cFor now, gold\u2019s low-volatility consolidation around $4,400 appears more like a market waiting for clarity to decide where to go next,\u201d Assiri said. \u201cThe CPI outcome could provide the needed catalyst for the next meaningful move.\u201d\n\nSpot gold edged down 0.1% to $4,352.14 an ounce at 7:16 a.m.", "source": "LiveMint Markets", "pub_date_str": "09 Sep 2026, 06:34 AM IST", "pub_date_relative": "31m ago"}, {"title": "China IPO Frenzy Nets Lucky Few Six Months\u2019 Pay in One Day", "full_content": "(Bloomberg) -- Six months\u2019 salary in a single day. That\u2019s the kind of payoff China\u2019s boom in initial public offerings is handing to a lucky few.\n\nSeven new listings this year have generated profits of more than 100,000 yuan ($14,900) for retail investors who secured an allocation of 500 shares and sold on debut day, the most such windfalls in at least six years. Stacy Wei did even better: her winning bid for Unitree Robotics earned her about 380,000 yuan, enough to upgrade to her dream car.\n\nWei, who works in education in one of China\u2019s biggest cities, beat odds of one in 5,525 to secure shares in the Unitree Robotics deal last month. She sold as the stock soared on its first day, pocketing enough to walk away from a deposit she had already paid on a cheaper car.\n\nChinese traders have a name for IPOs like Unitree: \u201cbig fat tickets,\u201d referring to listings that can deliver more than 100,000 yuan from a single winning allocation. This year has produced an unusually large crop of them, fueling a rush for new shares even as soaring demand makes allocations increasingly difficult to secure.\n\nFor China\u2019s roughly 250 million retail investors, winning an IPO allocation has long offered an unusually reliable route to quick profits. But 2026 is shaping up as an exceptional year. Enthusiasm for technology listings championed by Beijing has sent first-day returns to one of the highest on record: the 53 stocks that started trading in Shanghai and Shenzhen this year surged more than 350% on average on debut, weighted by deal size, according to data compiled by Bloomberg.\n\n\u201cWho would pass up on free cash?,\u201d said Alice Wang, who won shares in the IPO of CXMT Corp. and is regularly bidding for new listings.", "source": "LiveMint Markets", "pub_date_str": "09 Sep 2026, 06:34 AM IST", "pub_date_relative": "31m ago"}, {"title": "Japan\u2019s Rising Yields Stir Debate Over Growing Repatriation Risk", "full_content": "Japanese government bond yields near three-decade highs are giving fresh prominence to a long-discussed risk for global investors: the prospect of the nation\u2019s vast pool of overseas capital returning home.\n\nWhile there\u2019s little sign of a rush yet, some money managers say markets are underpricing how quickly that could change as JGBs become increasingly attractive \u2014 and how even a modest shift could ripple through the yen and global bond markets.\n\n\u201cIf domestic yields continue to rise, Japan may gradually retain more capital at home,\u201d said Ales Koutny, head of international rates at Vanguard Asset Management Ltd.\u2019s active funds. \u201cThat matters not only for the yen and JGBs, but also for Treasury markets, European bond markets and broader global funding conditions.\u201d\n\nFor decades, rock-bottom interest rates encouraged Japanese investors to scour overseas markets for returns, turning the country into one of the world\u2019s biggest exporters of capital. Japan is the largest foreign holder of US Treasuries with a $1.1 trillion stockpile, while Japanese investors hold almost $5 trillion of overseas assets.\n\nNow that calculus is shifting. Japan\u2019s 10-year yield touched 3% last week for the first time since 1996, driven by concerns over inflation and fiscal spending as well as expectations the Bank of Japan may need to raise rates more quickly. The milestone coincided with a 4% rally in the yen this month and growing speculation that the Government Pension Investment Fund could eventually increase its allocation to domestic bonds.\n\nJapanese health minister Kenichiro Ueno, who oversees the GPIF, said on Tuesday the pension fund is still considering whether a review of its asset allocation is needed.\n\nAny signs of repatriation \u2014 particularly if other pension funds and investors followed GPIF\u2019s lead \u2014 could add fuel to the yen\u2019s rally by reversing some of the capital outflows that have weighed on the currency for years.", "source": "LiveMint Markets", "pub_date_str": "09 Sep 2026, 06:34 AM IST", "pub_date_relative": "31m ago"}, {"title": "U.S. military destroys five Iranian oil tankers after attempted attack on American warship, Centcom says", "full_content": "The U.S. military destroyed five Iranian crude oil tankers on Tuesday in retaliation for the Revolutionary Guard firing ballistic missiles at an American warship twice over the past two days, according to U.S. Central Command.\n\nThe U.S. warship successfully evaded Iranian attack and no American personnel were harmed, Centcom said in a statement .\n\nU.S. forces struck four tankers in the Gulf of Oman, Centcom said. They are the M/T Kaviz, M/T Charminar, M/T Horizon 1 and M/T Riesco. The military hit the M/T Derya near Iran's Kharg Island.\n\n\"American forces directed the crews to abandon ship before the vessels were struck and rendered inoperable,\" Centcom said.\n\nThe U.S. and Iran have traded new attacks in the Persian Gulf in recent days, rekindling hostilities in the region even as the Trump administration shifts its strategy toward defeating Tehran economically .\n\nThe U.S. military destroyed three Iranian tankers on Saturday in retaliation for the Guard firing ballistic missiles at an aircraft carrier and a guided-missile destroyer. Those attacks also failed, Centcom said.\n\nEarlier Tuesday, Centcom said an unmanned submersible that Iran reportedly seized in the Strait of Hormuz was \"defective\" and carried no sensitive data or classified equipment.\n\n\"An underwater drone operated by U.S. forces malfunctioned more than a day ago,\" U.S. Navy Captain Tim Hawkins told CNBC in a statement shared by U.S. Central Command.", "source": "CNBC Top News", "pub_date_str": "09 Sep 2026, 06:26 AM IST", "pub_date_relative": "39m ago"}, {"title": "NSE may cut IPO size to Rs 25,000 crore from Rs 30,000 crore", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a NSE may cut IPO size to Rs 25,000 crore from Rs 30,000 crore State Bank of India Share Price Union Bank of India Share Price Punjab National Bank Share Price Bank of Baroda Share Price Indian Bank Share Price The Economic Times daily newspaper is available online now. Read Today's Paper NSE may cut IPO size to Rs 25,000 crore from Rs 30,000 crore SECTIONS NSE may cut IPO size to Rs 25,000 crore from Rs 30,000 crore By Himadri Buch , ET Bureau Last Updated: Sep 09, 2026, 06:25:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The National Stock Exchange is considering reducing its initial public offering size. The proposed share sale could now amount to around \u20b924,000-25,000 crore. NSE aims to launch the IPO in the third week of September. This move would retain Hyundai Motor India's largest IPO tag. The exchange received Sebi's consent to proceed with the IPO.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "09 Sep 2026, 06:25 AM IST", "pub_date_relative": "39m ago"}, {"title": "New Hampshire picks Pappas and Sununu in primary for key open Senate seat", "full_content": "New Hampshire voters on Tuesday nominate candidates for a key U.S. Senate race to replace the retiring Democratic Sen. Jeanne Shaheen . Both Democrats and Republicans are aiming to win the seat in their quest to control the Senate in the next Congress.\n\nRep. Chris Pappas , who led the fundraising race and has represented the state's 1st Congressional District since 2019, secured the Democratic nomination. He faced a challenge from scientist and democratic socialist Karishma Manzur , who had closed in slightly on Pappas in recent public polls.\n\nOn the Republican side, former U.S. Sen. John Sununu, of New Hampshire, secured the nomination over former U.S. Sen. Scott Brown, of Massachusetts. Shaheen defeated both Sununu and Brown in different years, but Sununu \u2014 whose brother Chris Sununu was a highly popular governor of the Granite State until 2025 \u2014 is seen as a formidable candidate in what is shaping up to be a tough election cycle for Republicans as the Iran war drags on and President Donald Trump's popularity slumps.\n\nThe New Hampshire Senate race is critical to both parties ahead of November's midterm election. Democratic hopes of flipping the Senate would dim if the party can't hold on to Shaheen's seat, as it needs to net four additional seats to flip the upper chamber. If Republicans flip the seat, it would provide a cushion for the GOP to hold on to its Senate majority by requiring Democrats to flip an additional seat.\n\nThe midterms will determine who controls Congress \u2014 and subpoena power \u2014 during the last two years of Trump's term. If Democrats flip one or both chambers, they are widely expected to launch sweeping investigations of the Trump administration that are likely to rope in companies that have done business with the administration.\n\nPappas, who has been endorsed by Shaheen and other top Democrats, such as U.S. Sen. Elizabeth Warren , of Massachusetts, has made anti-corruption efforts a top issue in his campaign.", "source": "CNBC Top News", "pub_date_str": "09 Sep 2026, 06:22 AM IST", "pub_date_relative": "42m ago"}, {"title": "Is a relief rally possible in Nifty as RSI nears oversold region?", "full_content": "On the weekly expiry day, Nifty extended its decline for the second consecutive session, losing 144.05 points to close at 23,635.10. The index opened 36 points lower and remained under pressure throughout the trading session, eventually ending near the day\u2019s low.\n\nTuesday\u2019s trading session resulted in the formation of a bearish candle, keeping the index\u2019s ongoing pattern of lower highs and lower lows intact. The continued selling pressure dragged Nifty below its important parallel support zone, indicating further deterioration in the near-term technical setup.\n\nThe weakness is also visible from the moving average structure, as the 20-DMA has crossed below the 50-DMA. The increasing gap between these two moving averages indicates that downside momentum is strengthening and the short-term trend remains under pressure.\n\nThe recent decline has almost completely retraced the previous rally from the July low to the August high. From the August 3 peak, Nifty has corrected 1,151 points and is now approaching its previous swing low of 23,606.\n\nThe ongoing decline has stretched to nearly 10 trading sessions. Historically, short-term corrections often tend to last between 8 and 15 trading sessions, suggesting that the index could witness some consolidation or a short-term recovery attempt near the current support zone.\n\nThe 23,606 level has emerged as a crucial support area for the index. A decisive breach below this zone could increase selling pressure and drag Nifty towards the next support level of 23,478.\n\nOn the upside, the first sign of improvement would come only if the index moves above Tuesday\u2019s high of 23,759. A sustained breakout above this level could trigger a recovery towards the next resistance zone near 23,890.\n\nThe 14-period daily RSI has declined towards the 30 mark, reaching its lowest level in more than five months. The indicator is now nearing the oversold zone, which may provide some support for a technical bounce in the near term.", "source": "LiveMint Markets", "pub_date_str": "09 Sep 2026, 06:21 AM IST", "pub_date_relative": "44m ago"}, {"title": "Global Market Today: Asian chip stocks rise, oil climbs towards $100", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Global Market Today: Asian chip stocks rise, oil climbs towards $100 Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market Today: Asian chip stocks rise, oil climbs towards $100 SECTIONS Global Market Today: Asian chip stocks rise, oil climbs towards $100 By Bloomberg , Last Updated: Sep 09, 2026, 06:20:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Asian chip stocks experienced a remarkable uptick, fueled by lingering investor enthusiasm for artificial intelligence technologies. As Middle Eastern conflicts intensify, Brent crude oil prices are edging closer to the $100 per barrel mark. The Kospi index in South Korea gained one percent, largely due to gains from major chip firms. Market participants are eagerly anticipating US consumer price data, which could influence the Federal Reserve's upcoming interest rate decisions.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "09 Sep 2026, 06:20 AM IST", "pub_date_relative": "45m ago"}, {"title": "Stock futures are little changed after losing session; Brent crude tops $99 per barrel: Live updates", "full_content": "Stock futures were trading nearly flat Tuesday evening after a losing day as oil prices continue their ascent.\n\nDow Jones Industrial Average futures lost 21 points. S&P 500 futures and Nasdaq 100 futures also traded near their flatlines.\n\nIn Asia, Japan's Nikkei 225 slipped 0.23% while the Topix declined 0.35%. South Korea's Kospi gained 0.36%, while the small-cap Kosdaq rose 0.47%. Australia's benchmark S&P/ASX 200 was marginally higher.\n\nBrent crude futures at one point jumped above $99 per barrel after the settle on Tuesday following a report that Iran launched an second salvo of attacks on U.S. Navy ships this week that was previously undisclosed. U.S. West Texas Intermediate crude crept above $94 per barrel in extended trading.\n\nOil's after-hours rise follows an advance for crude in the session that put downward pressure on the three major averages in their first session of a holiday-shortened trading week. The stock market was dark on Monday in observance of the Labor Day holiday.\n\nThe Dow dropped 1.2% on Tuesday, marking its worst day in almost three weeks. The S&P 500 and Nasdaq Composite slid 0.6% and 0.3%, respectively.\n\nThe 10-year U.S. Treasury yield briefly climbed above the closely watched 4.8% level on Tuesday as rising oil prices added to concerns about inflation. The action in yields further weighed down stocks in the session.\n\nIt's \"a little bit of a speed bump,\" said Kara Murphy, investment chief at Kestra Investment Management, on CNBC's \" Closing Bell .\" \"There's a little bit less to focus on with the earnings front, so I think the market has sort of shifted its attention now to the risk side.\"", "source": "CNBC Top News", "pub_date_str": "09 Sep 2026, 06:05 AM IST", "pub_date_relative": "1h ago"}, {"title": "Brent crude nears $100 a barrel as U.S.-Iran tit-for-tat strikes stoke supply worries", "full_content": "Oil prices rose Wednesday as escalating tensions between the U.S. and Iran fuel concerns over further disruptions to Middle East energy supplies.\n\nU.S. benchmark West Texas Intermediate futures for October delivery jumped 1.75% to $94.66 a barrel. Futures for Brent crude , the international benchmark, added 1.55% to $99.44 a barrel.\n\nThe U.S. military destroyed five Iranian crude tankers Tuesday in retaliation for attempted attacks on an American warship. The U.S. warship successfully evaded Iranian attack and no American personnel were harmed, Centcom said in a statement .\n\nThe escalation in the U.S.-Iran conflict, now in its seventh month, is raising the risk of oil prices surging above $120 a barrel as attacks on shipping intensify, according to Daan Struyven, co-head of global commodities research at Goldman Sachs.\n\n\"It's definitely plausible,\" Struyven told CNBC's \" Squawk Box Asia \" when asked whether oil could reach $120 a barrel. Goldman's base case remains for Persian Gulf exports to gradually recover as producers adapt to disruptions, including through alternative shipping routes and eventually additional pipeline capacity.\n\nBut the recent escalation has increased the chances of a more bullish scenario in which exports fail to recover in the coming months, he said.\n\n\"The developments over the last few days do suggest that that alternative upside price scenario, where exports actually stagnate over the coming few months, and where Brent exceeds $120 is the probability of that scenario is definitely going up as we're seeing an intensification and broadening of the shipping attacks,\" Struyven said.\n\nU.S.-Iran military action had been on pause for about a month, with Washington pivoting to applying economic pressure on Tehran, only to resume strikes towards the end of last month.", "source": "CNBC Top News", "pub_date_str": "09 Sep 2026, 06:03 AM IST", "pub_date_relative": "1h ago"}, {"title": "Raja Venkatraman recommends three stocks for 9 September", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nStock market recap : T he Sensex and Nifty 50 suffered significant losses on Tuesday, 8 September, declining for a second consecutive session.\n\nThe Sensex fell 555 points, or 0.73%, to close at 75,577.58, while the Nifty 50 declined 144 points, or 0.61%, to settle at 23,635.10.\n\nICICI Bank, Axis Bank and UltraTech Cement were the worst hit on the Sensex, while SBI Life, ICICI Bank and Axis Bank led declines on the Nifty.\n\nHowever, mid- and small-caps outperformed. The Nifty Midcap 150 rose 0.12%, while the Nifty Smallcap 250 gained 0.23%.\n\nAmong sectors, the Nifty Bank fell 0.54%, while Nifty Financial Services and Nifty Private Bank declined 0.93% and 0.98%, respectively. IT, PSU Bank, Realty, Consumer Durables, and Oil and Gas also ended lower.\n\nOver the two sessions, the Sensex has lost 938 points, or 1.2%, while the Nifty 50 has declined 1.1%\n\nOn 8 September, Indian benchmarks extended their decline for a second straight session, with the Nifty slipping to a near three\u2011month low amid heavy selling in IT, oil & gas, and banking stocks. After a weak start, the market attempted a brief rebound but failed to hold gains as profit\u2011booking intensified. The Nifty touched an intraday low of 23,623 before closing at 23,635, down 144 points, while the Sensex fell 555 points to 75,577. Broader indices outperformed, with midcaps and smallcaps ending marginally higher.", "source": "LiveMint Markets", "pub_date_str": "09 Sep 2026, 06:00 AM IST", "pub_date_relative": "1h ago"}, {"title": "Stock recommendations for 9 September from MarketSmith India", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nStock market recap: Indian equities extended their losses for a second consecutive session on Tuesday as crude oil prices surged past $98 per barrel, deepening concerns about inflation and import costs.\n\nNifty 50 fell 144.05 points, or 0.61%, to close at 23,635.10, while Sensex dropped 541.32 points, or 0.71%, to settle at 75,591.49. Brent crude's sharp rise came after a proposed Iran-Oman arrangement to manage the Strait of Hormuz shipping failed to ease supply concerns, keeping West Asia tensions in focus.\n\nOil & gas and banking were among the weakest sectors, while capital goods and healthcare bucked the trend, aided by the Defence Acquisition Council clearing proposals worth more than \u20b9 1.1 trillion, which lifted defence-linked names.\n\nAmong individual stocks, Bandhan Bank, Hindustan Copper, GE Vernova T&D, and Symphony posted sharp gains, while BPCL, HPCL, and Apollo Tyres declined on rising crude costs. Voltas, United Breweries, and ICICI Lombard slipped to fresh 52-week lows. Market breadth was balanced, with 1,711 stocks advancing, 1,833 stocks declining, and 104 unchanged. Elevated crude prices and geopolitical developments in West Asia remain the key overhangs for the market.\n\nIndian equities ended lower on 8 September, extending recent weakness as elevated crude oil prices and concerns over the escalating West Asia conflict kept risk appetite subdued. Nifty 50 closed at 23,635.10, down 144.05 points or 0.61%, after trading between 23,623.10 and 23,758.95, with the index remaining under pressure for most of the session. Financial services led the drag, with Nifty Private Bank and Financial Services declining 0.98% and 0.93%, respectively. Oil & gas fell 0.67%, and IT slipped 0.37%. In contrast, defensive pockets provided support: Media (+1.31%), pharma (+0.77%), healthcare (+0.63%), FMCG (+0.35%), and auto (+0.28%).", "source": "LiveMint Markets", "pub_date_str": "09 Sep 2026, 06:00 AM IST", "pub_date_relative": "1h ago"}, {"title": "SpaceX shares could get a boost from Nasdaq 100 rebalancing", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a SpaceX shares could get a boost from Nasdaq 100 rebalancing Powered By The Economic Times daily newspaper is available online now. Read Today's Paper SpaceX shares could get a boost from Nasdaq 100 rebalancing SECTIONS SpaceX shares could get a boost from Nasdaq 100 rebalancing Bloomberg Last Updated: Sep 09, 2026, 06:00:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis SpaceX stock may see increased buying pressure soon. Nasdaq 100 rebalancing is expected to boost its index weighting. More than one billion shares have been released from lockups. This change could force significant passive buying from index funds. Future share unlocks will further increase SpaceX's free float.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipr Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "09 Sep 2026, 06:00 AM IST", "pub_date_relative": "1h ago"}, {"title": "Pre-market action: Here's the trade setup for today's session", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Pre-market action: Here's the trade setup for today's session Inox Wind Share Price Suzlon Energy Share Price Orient Green Power Company Share Price Indowind Energy Share Price Karma Energy Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Pre-market action: Here's the trade setup for today's session SECTIONS Pre-market action: Here's the trade setup for today's session By Akash Podishetti , ETMarkets.com Last Updated: Sep 09, 2026, 06:00:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Indian stock markets wrapped up on Tuesday near their crisis points, strained by high Brent crude oil prices and geopolitical instability that dampened investor morale. Market analysts warn of an ongoing downward trend, calling for stronger highs and lows to initiate a turnaround. Despite foreign portfolio investors offloading shares, domestic institutional players capitalized as net buyers.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "09 Sep 2026, 06:00 AM IST", "pub_date_relative": "1h ago"}, {"title": "FPIs sell $1.6 billion of Indian stocks in five trading sessions", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a FPIs sell $1.6 billion of Indian stocks in five trading sessions The Economic Times daily newspaper is available online now. Read Today's Paper FPIs sell $1.6 billion of Indian stocks in five trading sessions SECTIONS FPIs sell $1.6 billion of Indian stocks in five trading sessions By Ravindra Sonavane , ET Bureau Last Updated: Sep 09, 2026, 05:59:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis After a brief period of optimism, foreign investors are retreating from Indian stocks as rising crude oil prices and escalating global bond yields shift market dynamics. This change reflects a waning interest in emerging market growth assets, compounded by profit-taking strategies and a pivot towards AI investments. While domestic buying could offer some support, ongoing external pressures may dampen overall returns.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "09 Sep 2026, 05:57 AM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "Is Hindustan Unilever stock undervalued?", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\n\u2018 Undervalued \u2019 is a relative term in the stock market. A stock cannot be called undervalued simply because its price or valuation multiple appears low. It is only undervalued relative to its intrinsic value , historical valuation, industry peers, growth prospects, or the broader market.\n\nFor example, a company trading at 12 times earnings may appear cheap compared with a peer trading at 20 times, but it may not be undervalued if its growth and profitability are significantly weaker.\n\nTherefore, investors should always ask: undervalued relative to what? The answer depends on the benchmark, assumptions, and timeframe used to assess the company\u2019s fair value.\n\nWith this in mind, let\u2019s examine whether Hindustan Unilever (HUL) stock is undervalued. In doing so, we will compare it to its own one-year, three-year, and five-year median price-to-earnings (PE) multiples. We will also compare its PE to those of its peers and the indices in which it sits.\n\nReaders should note that we are evaluating only a select set of valuation measures, and other factors must be taken into account. Valuation remains an imprecise science. Remember, valuation is not an exact science.\n\nThe decline in the PE from a median of 54.5 over five years to 42 at present shows investors are assigning lower valuation multiples to HUL stock compared to its history. So, based on its historical PE multiples, the stock is undervalued.\n\nIt\u2019s always hard to compare HUL with its FMCG peers because it\u2019s highly diversified giant, so the table above is not a straightforward apples-to-apples comparison.", "source": "LiveMint Markets", "pub_date_str": "09 Sep 2026, 07:00 AM IST", "pub_date_relative": "4m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "CVC hires TPG\u2019s second-in-command Todd Sisitsky as co-CEO", "full_content": "Private equity group brings on executive as part of succession plan for chief Rob Lucas", "source": "FT Markets", "pub_date_str": "09 Sep 2026, 06:57 AM IST", "pub_date_relative": "8m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Breakout stocks to buy or sell: Sumeet Bagadia recommends five shares to buy today \u20149 September 2026", "full_content": "Buy or sell stocks: Indian equity benchmarks, the Sensex and Nifty 50, fell sharply on Tuesday, September 8, extending their decline for the second straight trading session.\n\nThe Sensex dropped 555 points, or around 0.73%, to end at 75,577.58. Meanwhile, the NSE Nifty 50 declined 144 points, or 0.61%, to close at 23,635.10.\n\nNifty 50 closed at 23,635.10, down 144.05 points (-0.61%), extending its decline for the second straight session. Persistent selling after the opening weakness pushed the index close to its intraday low, while elevated crude prices and renewed West Asia geopolitical concerns continued to keep sentiment subdued. With RSI at 30.88, momentum remains weak, although the index is nearing oversold territory.\n\n\u201cThe 23,500\u201323,580 zone is the immediate support, and a sustained break below this area could open room for further downside. On the upside, 23,800\u201323,870 is the first hurdle, followed by 23,950\u201324,000 and the 50-Day EMA near 24,116. Overall, the short-term bias remains bearish, with any recovery likely to face selling pressure unless key resistance levels are reclaimed,\u201d said Sumeet Bagadia, Executive Director at Choice Broking.\n\nBank Nifty closed at 56,777.55, down 310.75 points (-0.54%), continuing its weak trajectory amid pressure across private banks and financial stocks. The index remained below the previous close throughout most of the session and ended near the lower levels, keeping the near-term structure under pressure.\n\n\u201cThe index is currently testing an important 200-Day EMA support around 56,720, making this zone crucial for the next move. Holding above this support could trigger a technical rebound, while a decisive break below it may accelerate the downside and weaken the broader trend.", "source": "LiveMint Markets", "pub_date_str": "09 Sep 2026, 06:38 AM IST", "pub_date_relative": "27m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Cattle futures higher on short covering", "full_content": "CHICAGO, Sept 8 (Reuters) - Chicago Mercantile Exchange live and feeder cattle futures turned higher on Tuesday on a bout of short covering in a correction from the previous week's downturn.\n\nCME October live cattle settled 4.075 cents higher at 217.025 cents per pound. CME October feeder cattle rose 5.3 cents to 325.45 cents per pound.\n\nA slew of bearish news, including U.S. President Donald Trump's announcement that he would ease beef tariffs and the re-opening of the U.S.-Mexico border to cattle imports, have largely been factored into the market, analysts said.\n\n\"We're getting back to the fundamental side of the cattle complex,\" said Karl Setzer, partner at Consus Ag Consulting, emphasizing that the live cattle supply remains relatively low.\n\nThough Labor Day marked the end of the summer grilling season, demand has remained relatively strong as retailers prepare for fall, a season where people often cook roasts.\n\nIndustry experts are continuing to assess consumer demand for beef as rising costs pressured pocketbooks, though last week's stronger-than-expected jobs report provided assurance.\n\nConsumers often shy away from purchasing beef when feeling financially stressed, as beef is typically one of the priciest protein options in grocery stores and restaurants.\n\nThe U.S.-Canada trade war hasn't had a substantive impact on cattle or hog futures, with industry players believing the spat between the two countries will be short-lived.", "source": "LiveMint Markets", "pub_date_str": "09 Sep 2026, 06:34 AM IST", "pub_date_relative": "31m ago", "cfa_topics": ["Equity Investments", "Derivatives"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Gold Holds Decline as Mideast Tensions Bolster Rate-Hike Case", "full_content": "(Bloomberg) -- Gold held a three-day decline, as fresh attacks on ships in the Middle East added to inflationary risks and raised prospects for a US interest-rate hike.\n\nBullion was little changed near $4,350 an ounce, having dropped 2.6% over the last three sessions. US forces destroyed five Iranian tankers carrying crude near Kharg Island, the Islamic Republic\u2019s main oil export hub, in response to attempted missile attacks on an American warship. That raised fears of an escalation in the months-long war and spooked energy markets.\n\nOil extended gains, with benchmark Brent crude close to $100 a barrel. That\u2019s adding momentum to the case for a rate hike less than a week before the Federal Reserve\u2019s Sept. 14-15 meeting. Traders are eyeing key inflation prints due this week for fresh clues to the central bank\u2019s next move.\n\n\u201cA softer reading will be a relief for gold traders\u201d as it would support the case for holding rates steady, said Ahmad Assiri, a market strategist at Pepperstone Group Ltd. \u201cThe greater risk lies in an upside inflation surprise, which would likely strengthen the case for a hike, creating what could be massive pressure on the precious metal,\u201d he added.\n\nTighter monetary policy is typically a headwind for gold, which doesn\u2019t pay interest. Swaps traders are pricing in a roughly 60% chance of a Fed rate increase this month.\n\nSince bouncing from a floor near $4,000 an ounce in July, gold has settled in a relatively narrow range either side of $4,400, as traders repeatedly recalibrate the outlook for Fed policy. Despite near-term headwinds, many investors are still betting that bullion will grind higher as it rediscovers its traditional value as a portfolio hedge.\n\n\u201cFor now, gold\u2019s low-volatility consolidation around $4,400 appears more like a market waiting for clarity to decide where to go next,\u201d Assiri said. \u201cThe CPI outcome could provide the needed catalyst for the next meaningful move.\u201d\n\nSpot gold edged down 0.1% to $4,352.14 an ounce at 7:16 a.m.", "source": "LiveMint Markets", "pub_date_str": "09 Sep 2026, 06:34 AM IST", "pub_date_relative": "31m ago", "cfa_topics": ["Economics", "Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "China IPO Frenzy Nets Lucky Few Six Months\u2019 Pay in One Day", "full_content": "(Bloomberg) -- Six months\u2019 salary in a single day. That\u2019s the kind of payoff China\u2019s boom in initial public offerings is handing to a lucky few.\n\nSeven new listings this year have generated profits of more than 100,000 yuan ($14,900) for retail investors who secured an allocation of 500 shares and sold on debut day, the most such windfalls in at least six years. Stacy Wei did even better: her winning bid for Unitree Robotics earned her about 380,000 yuan, enough to upgrade to her dream car.\n\nWei, who works in education in one of China\u2019s biggest cities, beat odds of one in 5,525 to secure shares in the Unitree Robotics deal last month. She sold as the stock soared on its first day, pocketing enough to walk away from a deposit she had already paid on a cheaper car.\n\nChinese traders have a name for IPOs like Unitree: \u201cbig fat tickets,\u201d referring to listings that can deliver more than 100,000 yuan from a single winning allocation. This year has produced an unusually large crop of them, fueling a rush for new shares even as soaring demand makes allocations increasingly difficult to secure.\n\nFor China\u2019s roughly 250 million retail investors, winning an IPO allocation has long offered an unusually reliable route to quick profits. But 2026 is shaping up as an exceptional year. Enthusiasm for technology listings championed by Beijing has sent first-day returns to one of the highest on record: the 53 stocks that started trading in Shanghai and Shenzhen this year surged more than 350% on average on debut, weighted by deal size, according to data compiled by Bloomberg.\n\n\u201cWho would pass up on free cash?,\u201d said Alice Wang, who won shares in the IPO of CXMT Corp. and is regularly bidding for new listings.", "source": "LiveMint Markets", "pub_date_str": "09 Sep 2026, 06:34 AM IST", "pub_date_relative": "31m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Japan\u2019s Rising Yields Stir Debate Over Growing Repatriation Risk", "full_content": "Japanese government bond yields near three-decade highs are giving fresh prominence to a long-discussed risk for global investors: the prospect of the nation\u2019s vast pool of overseas capital returning home.\n\nWhile there\u2019s little sign of a rush yet, some money managers say markets are underpricing how quickly that could change as JGBs become increasingly attractive \u2014 and how even a modest shift could ripple through the yen and global bond markets.\n\n\u201cIf domestic yields continue to rise, Japan may gradually retain more capital at home,\u201d said Ales Koutny, head of international rates at Vanguard Asset Management Ltd.\u2019s active funds. \u201cThat matters not only for the yen and JGBs, but also for Treasury markets, European bond markets and broader global funding conditions.\u201d\n\nFor decades, rock-bottom interest rates encouraged Japanese investors to scour overseas markets for returns, turning the country into one of the world\u2019s biggest exporters of capital. Japan is the largest foreign holder of US Treasuries with a $1.1 trillion stockpile, while Japanese investors hold almost $5 trillion of overseas assets.\n\nNow that calculus is shifting. Japan\u2019s 10-year yield touched 3% last week for the first time since 1996, driven by concerns over inflation and fiscal spending as well as expectations the Bank of Japan may need to raise rates more quickly. The milestone coincided with a 4% rally in the yen this month and growing speculation that the Government Pension Investment Fund could eventually increase its allocation to domestic bonds.\n\nJapanese health minister Kenichiro Ueno, who oversees the GPIF, said on Tuesday the pension fund is still considering whether a review of its asset allocation is needed.\n\nAny signs of repatriation \u2014 particularly if other pension funds and investors followed GPIF\u2019s lead \u2014 could add fuel to the yen\u2019s rally by reversing some of the capital outflows that have weighed on the currency for years.", "source": "LiveMint Markets", "pub_date_str": "09 Sep 2026, 06:34 AM IST", "pub_date_relative": "31m ago", "cfa_topics": ["Economics", "Fixed Income", "Derivatives", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "U.S. military destroys five Iranian oil tankers after attempted attack on American warship, Centcom says", "full_content": "The U.S. military destroyed five Iranian crude oil tankers on Tuesday in retaliation for the Revolutionary Guard firing ballistic missiles at an American warship twice over the past two days, according to U.S. Central Command.\n\nThe U.S. warship successfully evaded Iranian attack and no American personnel were harmed, Centcom said in a statement .\n\nU.S. forces struck four tankers in the Gulf of Oman, Centcom said. They are the M/T Kaviz, M/T Charminar, M/T Horizon 1 and M/T Riesco. The military hit the M/T Derya near Iran's Kharg Island.\n\n\"American forces directed the crews to abandon ship before the vessels were struck and rendered inoperable,\" Centcom said.\n\nThe U.S. and Iran have traded new attacks in the Persian Gulf in recent days, rekindling hostilities in the region even as the Trump administration shifts its strategy toward defeating Tehran economically .\n\nThe U.S. military destroyed three Iranian tankers on Saturday in retaliation for the Guard firing ballistic missiles at an aircraft carrier and a guided-missile destroyer. Those attacks also failed, Centcom said.\n\nEarlier Tuesday, Centcom said an unmanned submersible that Iran reportedly seized in the Strait of Hormuz was \"defective\" and carried no sensitive data or classified equipment.\n\n\"An underwater drone operated by U.S. forces malfunctioned more than a day ago,\" U.S. Navy Captain Tim Hawkins told CNBC in a statement shared by U.S. Central Command.", "source": "CNBC Top News", "pub_date_str": "09 Sep 2026, 06:26 AM IST", "pub_date_relative": "39m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "NSE may cut IPO size to Rs 25,000 crore from Rs 30,000 crore", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a NSE may cut IPO size to Rs 25,000 crore from Rs 30,000 crore State Bank of India Share Price Union Bank of India Share Price Punjab National Bank Share Price Bank of Baroda Share Price Indian Bank Share Price The Economic Times daily newspaper is available online now. Read Today's Paper NSE may cut IPO size to Rs 25,000 crore from Rs 30,000 crore SECTIONS NSE may cut IPO size to Rs 25,000 crore from Rs 30,000 crore By Himadri Buch , ET Bureau Last Updated: Sep 09, 2026, 06:25:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The National Stock Exchange is considering reducing its initial public offering size. The proposed share sale could now amount to around \u20b924,000-25,000 crore. NSE aims to launch the IPO in the third week of September. This move would retain Hyundai Motor India's largest IPO tag. The exchange received Sebi's consent to proceed with the IPO.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "09 Sep 2026, 06:25 AM IST", "pub_date_relative": "39m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Is a relief rally possible in Nifty as RSI nears oversold region?", "full_content": "On the weekly expiry day, Nifty extended its decline for the second consecutive session, losing 144.05 points to close at 23,635.10. The index opened 36 points lower and remained under pressure throughout the trading session, eventually ending near the day\u2019s low.\n\nTuesday\u2019s trading session resulted in the formation of a bearish candle, keeping the index\u2019s ongoing pattern of lower highs and lower lows intact. The continued selling pressure dragged Nifty below its important parallel support zone, indicating further deterioration in the near-term technical setup.\n\nThe weakness is also visible from the moving average structure, as the 20-DMA has crossed below the 50-DMA. The increasing gap between these two moving averages indicates that downside momentum is strengthening and the short-term trend remains under pressure.\n\nThe recent decline has almost completely retraced the previous rally from the July low to the August high. From the August 3 peak, Nifty has corrected 1,151 points and is now approaching its previous swing low of 23,606.\n\nThe ongoing decline has stretched to nearly 10 trading sessions. Historically, short-term corrections often tend to last between 8 and 15 trading sessions, suggesting that the index could witness some consolidation or a short-term recovery attempt near the current support zone.\n\nThe 23,606 level has emerged as a crucial support area for the index. A decisive breach below this zone could increase selling pressure and drag Nifty towards the next support level of 23,478.\n\nOn the upside, the first sign of improvement would come only if the index moves above Tuesday\u2019s high of 23,759. A sustained breakout above this level could trigger a recovery towards the next resistance zone near 23,890.\n\nThe 14-period daily RSI has declined towards the 30 mark, reaching its lowest level in more than five months. The indicator is now nearing the oversold zone, which may provide some support for a technical bounce in the near term.", "source": "LiveMint Markets", "pub_date_str": "09 Sep 2026, 06:21 AM IST", "pub_date_relative": "44m ago", "cfa_topics": ["Equity Investments", "Derivatives"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Global Market Today: Asian chip stocks rise, oil climbs towards $100", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Global Market Today: Asian chip stocks rise, oil climbs towards $100 Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market Today: Asian chip stocks rise, oil climbs towards $100 SECTIONS Global Market Today: Asian chip stocks rise, oil climbs towards $100 By Bloomberg , Last Updated: Sep 09, 2026, 06:20:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Asian chip stocks experienced a remarkable uptick, fueled by lingering investor enthusiasm for artificial intelligence technologies. As Middle Eastern conflicts intensify, Brent crude oil prices are edging closer to the $100 per barrel mark. The Kospi index in South Korea gained one percent, largely due to gains from major chip firms. Market participants are eagerly anticipating US consumer price data, which could influence the Federal Reserve's upcoming interest rate decisions.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "09 Sep 2026, 06:20 AM IST", "pub_date_relative": "45m ago", "cfa_topics": ["Economics", "Equity Investments", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Stock futures are little changed after losing session; Brent crude tops $99 per barrel: Live updates", "full_content": "Stock futures were trading nearly flat Tuesday evening after a losing day as oil prices continue their ascent.\n\nDow Jones Industrial Average futures lost 21 points. S&P 500 futures and Nasdaq 100 futures also traded near their flatlines.\n\nIn Asia, Japan's Nikkei 225 slipped 0.23% while the Topix declined 0.35%. South Korea's Kospi gained 0.36%, while the small-cap Kosdaq rose 0.47%. Australia's benchmark S&P/ASX 200 was marginally higher.\n\nBrent crude futures at one point jumped above $99 per barrel after the settle on Tuesday following a report that Iran launched an second salvo of attacks on U.S. Navy ships this week that was previously undisclosed. U.S. West Texas Intermediate crude crept above $94 per barrel in extended trading.\n\nOil's after-hours rise follows an advance for crude in the session that put downward pressure on the three major averages in their first session of a holiday-shortened trading week. The stock market was dark on Monday in observance of the Labor Day holiday.\n\nThe Dow dropped 1.2% on Tuesday, marking its worst day in almost three weeks. The S&P 500 and Nasdaq Composite slid 0.6% and 0.3%, respectively.\n\nThe 10-year U.S. Treasury yield briefly climbed above the closely watched 4.8% level on Tuesday as rising oil prices added to concerns about inflation. The action in yields further weighed down stocks in the session.\n\nIt's \"a little bit of a speed bump,\" said Kara Murphy, investment chief at Kestra Investment Management, on CNBC's \" Closing Bell .\" \"There's a little bit less to focus on with the earnings front, so I think the market has sort of shifted its attention now to the risk side.\"", "source": "CNBC Top News", "pub_date_str": "09 Sep 2026, 06:05 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Fixed Income", "Derivatives", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Brent crude nears $100 a barrel as U.S.-Iran tit-for-tat strikes stoke supply worries", "full_content": "Oil prices rose Wednesday as escalating tensions between the U.S. and Iran fuel concerns over further disruptions to Middle East energy supplies.\n\nU.S. benchmark West Texas Intermediate futures for October delivery jumped 1.75% to $94.66 a barrel. Futures for Brent crude , the international benchmark, added 1.55% to $99.44 a barrel.\n\nThe U.S. military destroyed five Iranian crude tankers Tuesday in retaliation for attempted attacks on an American warship. The U.S. warship successfully evaded Iranian attack and no American personnel were harmed, Centcom said in a statement .\n\nThe escalation in the U.S.-Iran conflict, now in its seventh month, is raising the risk of oil prices surging above $120 a barrel as attacks on shipping intensify, according to Daan Struyven, co-head of global commodities research at Goldman Sachs.\n\n\"It's definitely plausible,\" Struyven told CNBC's \" Squawk Box Asia \" when asked whether oil could reach $120 a barrel. Goldman's base case remains for Persian Gulf exports to gradually recover as producers adapt to disruptions, including through alternative shipping routes and eventually additional pipeline capacity.\n\nBut the recent escalation has increased the chances of a more bullish scenario in which exports fail to recover in the coming months, he said.\n\n\"The developments over the last few days do suggest that that alternative upside price scenario, where exports actually stagnate over the coming few months, and where Brent exceeds $120 is the probability of that scenario is definitely going up as we're seeing an intensification and broadening of the shipping attacks,\" Struyven said.\n\nU.S.-Iran military action had been on pause for about a month, with Washington pivoting to applying economic pressure on Tehran, only to resume strikes towards the end of last month.", "source": "CNBC Top News", "pub_date_str": "09 Sep 2026, 06:03 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Quantitative Methods", "Derivatives", "Portfolio Management"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "Raja Venkatraman recommends three stocks for 9 September", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nStock market recap : T he Sensex and Nifty 50 suffered significant losses on Tuesday, 8 September, declining for a second consecutive session.\n\nThe Sensex fell 555 points, or 0.73%, to close at 75,577.58, while the Nifty 50 declined 144 points, or 0.61%, to settle at 23,635.10.\n\nICICI Bank, Axis Bank and UltraTech Cement were the worst hit on the Sensex, while SBI Life, ICICI Bank and Axis Bank led declines on the Nifty.\n\nHowever, mid- and small-caps outperformed. The Nifty Midcap 150 rose 0.12%, while the Nifty Smallcap 250 gained 0.23%.\n\nAmong sectors, the Nifty Bank fell 0.54%, while Nifty Financial Services and Nifty Private Bank declined 0.93% and 0.98%, respectively. IT, PSU Bank, Realty, Consumer Durables, and Oil and Gas also ended lower.\n\nOver the two sessions, the Sensex has lost 938 points, or 1.2%, while the Nifty 50 has declined 1.1%\n\nOn 8 September, Indian benchmarks extended their decline for a second straight session, with the Nifty slipping to a near three\u2011month low amid heavy selling in IT, oil & gas, and banking stocks. After a weak start, the market attempted a brief rebound but failed to hold gains as profit\u2011booking intensified. The Nifty touched an intraday low of 23,623 before closing at 23,635, down 144 points, while the Sensex fell 555 points to 75,577. Broader indices outperformed, with midcaps and smallcaps ending marginally higher.", "source": "LiveMint Markets", "pub_date_str": "09 Sep 2026, 06:00 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stock recommendations for 9 September from MarketSmith India", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nStock market recap: Indian equities extended their losses for a second consecutive session on Tuesday as crude oil prices surged past $98 per barrel, deepening concerns about inflation and import costs.\n\nNifty 50 fell 144.05 points, or 0.61%, to close at 23,635.10, while Sensex dropped 541.32 points, or 0.71%, to settle at 75,591.49. Brent crude's sharp rise came after a proposed Iran-Oman arrangement to manage the Strait of Hormuz shipping failed to ease supply concerns, keeping West Asia tensions in focus.\n\nOil & gas and banking were among the weakest sectors, while capital goods and healthcare bucked the trend, aided by the Defence Acquisition Council clearing proposals worth more than \u20b9 1.1 trillion, which lifted defence-linked names.\n\nAmong individual stocks, Bandhan Bank, Hindustan Copper, GE Vernova T&D, and Symphony posted sharp gains, while BPCL, HPCL, and Apollo Tyres declined on rising crude costs. Voltas, United Breweries, and ICICI Lombard slipped to fresh 52-week lows. Market breadth was balanced, with 1,711 stocks advancing, 1,833 stocks declining, and 104 unchanged. Elevated crude prices and geopolitical developments in West Asia remain the key overhangs for the market.\n\nIndian equities ended lower on 8 September, extending recent weakness as elevated crude oil prices and concerns over the escalating West Asia conflict kept risk appetite subdued. Nifty 50 closed at 23,635.10, down 144.05 points or 0.61%, after trading between 23,623.10 and 23,758.95, with the index remaining under pressure for most of the session. Financial services led the drag, with Nifty Private Bank and Financial Services declining 0.98% and 0.93%, respectively. Oil & gas fell 0.67%, and IT slipped 0.37%. In contrast, defensive pockets provided support: Media (+1.31%), pharma (+0.77%), healthcare (+0.63%), FMCG (+0.35%), and auto (+0.28%).", "source": "LiveMint Markets", "pub_date_str": "09 Sep 2026, 06:00 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Corporate Issuers", "Equity Investments", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "SpaceX shares could get a boost from Nasdaq 100 rebalancing", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a SpaceX shares could get a boost from Nasdaq 100 rebalancing Powered By The Economic Times daily     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
