<script>
    // This variable will be injected during the build process
    const allData = {"general": [{"title": "Clearing out my parents\u2019 house was a legal nightmare. How can I downsize without putting my kids through the same ordeal?", "full_content": "Some countercultural advice this Black Friday: stop buying stuff, plus other rules for downsizing.", "source": "MarketWatch Top Stories", "pub_date_str": "27 Nov 2026, 11:01 PM IST", "pub_date_relative": "4m ago"}, {"title": "US tech stocks rise in latest market swing", "full_content": "All-powerful AI trade has been eclipsed by wild moves in a market struggling to price future earnings", "source": "FT Markets", "pub_date_str": "27 Nov 2026, 10:57 PM IST", "pub_date_relative": "7m ago"}, {"title": "Dow rallies 500 points as benchmark heads for best week since April 2025: Live updates", "full_content": "U.S. equities rose on Friday as investors try to wrap up a turbulent shortened trading week.\n\nThe Dow Jones Industrial Average was higher by 532 points, or 1.1%. The S&P 500 added 1.3%, while the Nasdaq Composite advanced 1.8%. The moves come amid a volatile week during an even more volatile month.\n\nTechnology stocks supported the bounce. \"Magnificent Seven\" members Meta Platforms and Amazon popped 3% and 4%, respectively, while chipmaker Broadcom increased almost 4%. Shares of artificial intelligence lab Anthropic added nearly 10%.\n\nThe major U.S. stock benchmarks were headed for strong weekly gains. Entering Friday's session, the Dow is up 5%, on pace for its biggest weekly advance since April 2025. The S&P 500 has climbed 5% in that time, while the Nasdaq has surged more than 6%.\n\nDow, 5-day The week kicked off with Jensen Huang getting reinstated as CEO at Nvidia , a move that sent the stock up 31% during Monday's session and drove the S&P 500 and Nasdaq Composite to post their best days since April 2025 . The Dow Jones Industrial Average advanced more than 1,400 points, or roughly 3%.\n\nSince then, however, the S&P 500 and Nasdaq have come under pressure as Nvidia and other AI-related stocks have given back some of Monday's gains.\n\nPrior to Huang's departure earlier this month, sentiment toward the AI trade was already downbeat, with investors growing concerned about debt financing , signs of moderation in capital expenditures and Democratic wins in the midterm elections resulting in a slowdown in data center development .\n\nBut Ben Fulton of WEBs Investments believes the fears surrounding AI, except for those regarding debt financing, are \"a bit overblown,\" noting that the \"biggest risk\" is whether AI companies can \"keep funding the growth they need.\" At the same time, he doesn't think investors can \"afford to be out of the AI story.\"", "source": "CNBC Top News", "pub_date_str": "27 Nov 2026, 10:54 PM IST", "pub_date_relative": "10m ago"}, {"title": "EPFO's Nidhi Aapke Nikat 2.0 camps: How to check your nearest venue, services available and documents required", "full_content": "The Employees' Provident Fund Organisation (EPFO) is conducting a Nidhi Aapke Nikat awareness campaign across India. The retirement body urged EPFO members to visit the camp and interact with officials to know more about the EPFO's schemes and benefits, understand services and processes, and get on-the-spot grievance redressal.\n\nIn a post on social media, the EPFO's official account also provided a document listing the various camp sites so that subscribers may find one nearest to their location to visit.\n\nThe EPFO has arranged multiple camps in major cities to manage the expected number of visitors. Seven regional offices are holding separate sessions across Bengaluru, while five camps are being organised under the Mumbai-I zone.\n\nSeveral camps are also being held across Delhi NCR and Chennai.\n\nThe schedule covers locations beyond major cities, including Leh in Ladakh, Pulwama in Jammu and Kashmir, and Port Blair in South Andaman.\n\nNidhi Aapke Nikat is the provident and pension fund body's last-mile monthly outreach programme for members, through which it organises camps across India at the district level.\n\nUnder this initiative, the EPFO will set up help desks for members, including pensioners, offering a range of services such as the submission of Digital Life Certificates (DLCs) and other pensioner-centric assistance.\n\nService kiosks are set up to address on-the-spot grievances for employees, employers, and pensioners, as well as to share relevant information with stakeholders.", "source": "LiveMint Money", "pub_date_str": "27 Nov 2026, 10:49 PM IST", "pub_date_relative": "15m ago"}, {"title": "Take Five: A December to remember", "full_content": "", "source": "Investing.com News", "pub_date_str": "27 Nov 2026, 10:42 PM IST", "pub_date_relative": "22m ago"}, {"title": "Regeneron Pharmaceuticals stock hits 52-week high at $991.85", "full_content": "", "source": "Investing.com News", "pub_date_str": "27 Nov 2026, 10:40 PM IST", "pub_date_relative": "24m ago"}, {"title": "Zee Entertainment \u20b9600 crore buyback opens on December 1; what eligible shareholders need to know", "full_content": "A Ksheerasagar Published 27 Nov 2026, 10:40 PM IST Prefer Livemint on Google The \u20b9 600 crore share buyback of Zee Entertainment Enterprises will open on December 1 and close on December 7. Under the buyback, the company will repurchase up to 6.59 crore fully paid-up equity shares, according to its regulatory filing.\n\nThe buyback size represents 7.22% and 6.61% of the aggregate of the company's fully paid-up equity share capital and free reserves, based on its audited standalone and consolidated financial statements as of March 31, 2026, respectively.\n\nThe buyback will be conducted through the tender offer route on a proportionate basis, with November 25, 2026, having been fixed as the record date to determine eligible shareholders. Shareholders who held Zee Entertainment shares as of the record date are eligible to participate in the buyback, subject to the applicable entitlement ratio.\n\nThe company has fixed the buyback price at \u20b9 91 per equity share, payable in cash. The offer will be made to shareholders and beneficial owners whose names appear in the company's records as of the record date.\n\nThe board has also authorised the possibility of revising the buyback price upwards and reducing the number of shares proposed to be repurchased, provided the overall buyback size remains unchanged. Any such revision can be made up to one working day before the record date.\n\nThe last date for the receipt of completed tender forms and specified documents by the registrar is also December 7, while the settlement of bids on the stock exchanges is scheduled to be completed by December 14.\n\nEligible shareholders are entitled to tender approximately one share for every 14 shares held on the record date. The actual entitlement ratio stands at 7.1495% for small shareholders and 7.1497% for other eligible shareholders.\n\nZee Entertainment's board has noted the intention of the promoters and members of the promoter group not to participate in the proposed buyback.", "source": "LiveMint Markets", "pub_date_str": "27 Nov 2026, 10:40 PM IST", "pub_date_relative": "24m ago"}, {"title": "Can a married, financially independent daughter claim insurance compensation after her parent\u2019s death? What the law says", "full_content": "A daughter does not lose her right to claim compensation for a parent's death in a road accident simply because she is married, earns her own income or lives separately. Even if she does not depend on her parents financially, she can approach the Motor Accident Claims Tribunal (MACT) as a legal representative of the deceased.\n\nThe Delhi High Court has reaffirmed this position in a judgment dated 6 November 2026, holding that financial dependency is not a prerequisite for filing a compensation claim under Section 166 of the Motor Vehicles Act, 1988. The ruling is significant for married and financially independent children who may otherwise be excluded from compensation claims on the assumption that they no longer depend on their parents.\n\nIn United India Insurance Co. Ltd. v. Savita & Anr. , the court examined whether a married daughter could claim compensation following the deaths of her father and sister in a road accident. It held that a legal representative cannot be denied the right to maintain a claim merely because she is married, employed or living separately.\n\nSection 166 of the Motor Vehicles Act allows all or any of the legal representatives of a person who dies in a road accident to file a compensation claim.\n\nThe distinction between a legal heir and a legal representative is important. A legal representative is not necessarily someone who inherits the deceased's property or was financially dependent on them. The expression covers people who represent the deceased's interests and have suffered a loss because of the death.\n\nThe Delhi High Court relied on the Supreme Court's judgment in Manjuri Bera v. Oriental Insurance Co. Ltd.", "source": "LiveMint Money", "pub_date_str": "27 Nov 2026, 10:39 PM IST", "pub_date_relative": "25m ago"}, {"title": "U.K. stocks higher at close of trade; Investing.com United Kingdom 100 up 0.77%", "full_content": "", "source": "Investing.com News", "pub_date_str": "27 Nov 2026, 10:38 PM IST", "pub_date_relative": "26m ago"}, {"title": "Spain stocks higher at close of trade; IBEX 35 up 1.72%", "full_content": "", "source": "Investing.com News", "pub_date_str": "27 Nov 2026, 10:38 PM IST", "pub_date_relative": "26m ago"}, {"title": "Gold-silver ratio declines: What drives the drop, why it matters, and what it means for bullion prices", "full_content": "Gold and silver prices rebounded on Friday after a sharp selloff pushed the precious metals towards crucial support levels of $3,400-$3,500 an ounce and $39-$40 an ounce, respectively. Silver led the recovery, providing support to the broader precious metals market, while stronger physical demand from China also helped gold prices recover.\n\nHowever, the gold-to-silver ratio\u2014which tracks how many ounces of silver it takes to buy one ounce of gold\u2014has begun to reverse.\n\nAccording to FXEmpire , China's latest import data indicated that net gold imports through Hong Kong increased 1.6% to 76.2 tonnes in October, the highest level since April. The rise suggests that lower prices encouraged physical gold purchases.\n\nHowever, expectations of elevated interest rates continue to pose a challenge to precious metals, which do not generate interest income.\n\nFresh tariff proposals by the Donald Trump administration have added another layer of uncertainty to the global economic outlook. The US has proposed import duties covering 14 trading partners, including China, Japan and the European Union.\n\nHigher import costs could keep inflation elevated and prompt further interest rate increases, potentially limiting gains in gold and silver.\n\nAt the same time, escalating trade tensions could strengthen gold's appeal as a safe-haven investment. Silver, however, could face additional pressure if higher tariffs slow manufacturing activity and weaken industrial demand.\n\nFXEmpire said gold prices were showing signs of recovery after finding support in the $3,400-$3,500 range. The immediate resistance for spot gold is around $3,700.", "source": "LiveMint Money", "pub_date_str": "27 Nov 2026, 10:35 PM IST", "pub_date_relative": "29m ago"}, {"title": "12 days of sardines and Croc charms: Are Advent calendars getting out of control?", "full_content": "Luxury Advent calendars in particular \u2014 which can run hundreds of dollars \u2014 have seen a spike in sales. Here\u2019s why.", "source": "MarketWatch Top Stories", "pub_date_str": "27 Nov 2026, 10:34 PM IST", "pub_date_relative": "31m ago"}, {"title": "Stocks making the biggest moves midday: XP, Newmont, Sandisk & more", "full_content": "Sandisk popped more than 10% on Friday, boosted by traders piling into AI-linked names. Newmont also got a lift as precious metals traded higher.\n\nFollow along as CNBC highlights the biggest stock moves of the day.\n\nShares of Targa Resources declined nearly 1% after Bloomberg reported that the natural gas pipeline operator was in talks to acquire Kinetik , a Permian Basin pipeline company partly owned by Blackstone.\n\nShares of Kinetik were up nearly 9% on the news. No deal has been reached, and Kinetik could remain independent or another bidder could emerge.\n\nMining stocks climbed Friday alongside higher prices for gold, silver, copper and other metals. Gold futures climbed more than 2%, silver was ahead 7.4% while platinum gained 5%, palladium almost 6% and copper 3%.\n\nNewmont Mining advanced 4.1% while AngloGold Ashanti added 4.7%. Coeur Mining jumped 6.8%, Gold Fields Ltd. climbed 5.5% and Freeport McMoRan increased 3.9%.\n\nShares of XP , a Brazilian investment management company, jumped nearly 18.5% Friday after President Luiz In\u00e1cio Lula da Silva named Bradesco Chairman Luiz Carlos Trabuco as Brazil's next finance minister.\n\nThe rise of Brazil's public debt at nearly 83% of the country's GDP has worried investors but the appointment is viewed as a possible signal that Lula will pursue a more market-friendly fiscal policy. Trabuco is expected to take the role in January, as Lula begins his new term.", "source": "CNBC Top News", "pub_date_str": "27 Nov 2026, 10:31 PM IST", "pub_date_relative": "34m ago"}, {"title": "Angelina Jolie, Brad Pitt Settle Years-Long Winery Case That Brought 2016 Abuse Allegations To Light", "full_content": "The settlement closes a bitter dispute over Chateau Miraval, which brought allegations surrounding a 2016 private jet incident into public view and prolonged the former couple's legal battle.", "source": "NDTV Profit", "pub_date_str": "27 Nov 2026, 10:29 PM IST", "pub_date_relative": "35m ago"}, {"title": "Stock Market Today: Dow, S&P 500 and Nasdaq rally more than 1% in shortened session as gains broaden beyond tech \u2014 live updates - MarketWatch", "full_content": "Stock Market Today: Dow, S&P 500 and Nasdaq rally more than 1% in shortened session as gains broaden beyond tech \u2014 live updates MarketWatch Dow rallies 500 points as benchmark heads for best week since April 2025: Live updates CNBC Stocks Rally at End of a Week of Wild Swings The New York Times US Futures Rally as Tech Rebound Gains Momentum: Markets Wrap Bloomberg.com Global markets rally as end of bruising month approaches Reuters", "source": "Google News Business", "pub_date_str": "27 Nov 2026, 10:25 PM IST", "pub_date_relative": "40m ago"}, {"title": "Pregnant Kiara Advani Turns Girls' Night Into A Sparkly Affair With Beads, Bows And 'Bedazzling' Fun", "full_content": "Kiara Advani's girls' night was all about beads, bows, jewellery and sparkle. The pregnant actor gave fans a peek at her fun 'bedazzling' session with friends, complete with a creative setup and personalised crafts.", "source": "NDTV Profit", "pub_date_str": "27 Nov 2026, 10:24 PM IST", "pub_date_relative": "40m ago"}, {"title": "King Song Daddy Cool: 15 Years Later, Shah Rukh Khan And Kareena Kapoor Share The Dance Floor Again", "full_content": "Daddy Cool (King Version) brings Shah Rukh Khan and Kareena Kapoor together after 15 years in a peppy dance track from King, with vocals by Arijit Singh and Shilpa Rao and music by Sachin-Jigar.", "source": "NDTV Profit", "pub_date_str": "27 Nov 2026, 10:22 PM IST", "pub_date_relative": "43m ago"}, {"title": "Josh Brown lost a bet on Disney. It is now on his Best Stocks in the Market list", "full_content": "With a 12.3% total return in 2026, Disney is the 14th-best performing stock in the Dow Jones Industrial Average this year.", "source": "CNBC Top News", "pub_date_str": "27 Nov 2026, 10:19 PM IST", "pub_date_relative": "45m ago"}, {"title": "29+ best deals happening right now during Walmart\u2019s Black Friday sale - NBC News", "full_content": "29+ best deals happening right now during Walmart\u2019s Black Friday sale NBC News Black Friday is officially live at Walmart. These are the best deals to buy CNN Best Black Friday deals launch at Walmart and Target as stores prepare for holiday shoppers 6abc Philadelphia Everything you need to know about Walmart's Black Friday 2026 sale: Store hours, best deals, ad highlights Mashable Walmart Black Friday style deals are as low as $5 \u2014 Shop our top picks from Hanes, Crocs, Michael Kors, Wrangler and more Yahoo", "source": "Google News Business", "pub_date_str": "27 Nov 2026, 10:19 PM IST", "pub_date_relative": "46m ago"}, {"title": "Sebi to recast rulebook to fund India's growth: Tuhin Kanta Pandey", "full_content": "The Securities and Exchange Board of India (Sebi) will revisit the rulebook, deepen the market, and ease access for global investors, its chairman Tuhin Kanta Pandey said on Friday, pitching these as crucial steps towards recalibrating India\u2019s capital markets to match its ambition to emerge as a developed nation by 2047.\n\nAs part of its efforts to simplify compliance, the regulator aims to reduce the time taken to onboard foreign portfolio investors (FPIs) to just five business days, down from months now, Pandey said.\n\n\u201cAs the economy grows, its financing needs change, investor expectations evolve, technology opens new possibilities, and risks take new forms. Our markets and their regulation must keep pace,\u201d he said while addressing industry body Assocham's Capital Markets Conference in New Delhi.\n\nThe regulator is reviewing the Listing Obligations and Disclosure Requirements framework to remove disclosures that duplicate filings with the corporate affairs ministry and to replace multiple exchange fines for the same lapse with a single one, he said.\n\nThe regulator is also revisiting the Issue of Capital and Disclosure Requirements framework for initial public offerings ( IPOs ), follow-on public offers, preferential issues, and qualified institutional placements, in addition to the IPO framework for small and medium enterprises and the Innovators Growth Platform for technology- and innovation-driven companies.\n\nA graded compliance framework for stock brokers is also being explored, so that obligations reflect a broker's scale, client exposure, and reliance on technology.\n\nPandey said the rapid progress in the capital markets in recent years suggests they can already finance India's growth, but indicated that more steps are needed to meet the requirements of an economy twice the current size.\n\nThe country's equity market is now worth over \u20b9 500 trillion, more than 130% of gross domestic product (GDP), he said.", "source": "LiveMint Markets", "pub_date_str": "27 Nov 2026, 10:18 PM IST", "pub_date_relative": "46m ago"}, {"title": "AI shopping agents are having a moment, but Amazon and a growing number of sites threaten to stunt their growth", "full_content": "Maia Bittner urgently needed to replace her car's windshield wipers. So last month, she turned to Meta 's Muse personal artificial intelligence agent.\n\nBittner, chief product officer at fintech startup Imprint, gave Muse the greenlight to buy some wipers on her behalf from AutoZone. Or so she thought.\n\nAbout 17 hours later, she got a notification from her Muse agent, saying AutoZone canceled her order due to an unspecified error.\n\n\"Honestly, the most reliable path now is you ordering on Amazon yourself,\" Muse said, according to a screenshot of the message.\n\nThe interaction encapsulates the current messy and complicated landscape of agentic shopping apps, the AI tools that can make purchases on behalf of users. Over the past year, tech companies such as OpenAI , Meta, Google and Instinct have introduced versions of personal agents that promise to take the hassle out of browsing and buying online.\n\nWhile some major retailers, such as Walmart and Sephora, have opened up their sites to agents, companies including Amazon, eBay , United Airlines and Kohl's limit what actions agents can take or block them outright. Others have added provisions to their terms of service spelling out that they're not liable if users' AI-driven purchases go wrong.\n\n\"It's a very mixed bag,\" Emily Pfeiffer, a principal analyst at Forrester, said in an interview. \"It means that a consumer who's using an agent to shop and browse and learn is not going to see the full set of options because some websites are unavailable.\"\n\nThe hiccups threaten to stunt the growth of shopping agents by creating a clunky and frustrating experience for users who are just starting to experiment with the tools. The question of who takes the blame when a transaction goes wrong also remains unclear.", "source": "CNBC World Economy", "pub_date_str": "27 Nov 2026, 10:13 PM IST", "pub_date_relative": "51m ago"}, {"title": "Using Non-Bank ATMs? How RBI's New Cash-Sourcing Rules Will Improve Cash Availability Near You", "full_content": "The RBI has allowed White Label ATM operators to source cash from multiple banks, including cooperative banks and regional rural banks, and buy wholesale currency directly from the central bank, offering greater flexibility in managing cash availability.", "source": "NDTV Profit", "pub_date_str": "27 Nov 2026, 10:08 PM IST", "pub_date_relative": "57m ago"}, {"title": "Kiran Mazumdar-Shaw Praises Serbian Man Who Has Been Cleaning India's Streets For 5 Years", "full_content": "Serbian man Lazar Jankovic has been cleaning public spaces across India for five years. His 4CleanIndia initiative has received praise from Biocon founder Kiran Mazumdar-Shaw.", "source": "NDTV Profit", "pub_date_str": "27 Nov 2026, 10:06 PM IST", "pub_date_relative": "58m ago"}, {"title": "Blackstone sells 1.55% stake in IGI for Rs 280 crore to meet public shareholding norms", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Blackstone sells 1.55% stake in IGI for Rs 280 crore to meet public shareholding norms International Gemological Institute Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Blackstone sells 1.55% stake in IGI for Rs 280 crore to meet public shareholding norms SECTIONS Blackstone sells 1.55% stake in IGI for Rs 280 crore to meet public shareholding norms PTI Last Updated: Nov 27, 2026, 10:03:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Blackstone completed the sale of a 1.5 percent stake in International Gemological Institute through block deals. The transaction involved selling over 67.16 lakh shares at an average of Rs 417 each. As a result, Blackstone's holding decreased from 76.55 percent to 75 percent. The stake sale was necessary to comply with minimum public shareholding requirements under Sebi regulations. Following the sale, shares of International Gemological Institute rose by 1.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "27 Nov 2026, 10:03 PM IST", "pub_date_relative": "1h ago"}, {"title": "WWE SmackDown Live Streaming: Check India Start Time, TV Channels And Match Card", "full_content": "WWE SmackDown November 27: Check the India start time, live streaming details, TV channels and match card as CM Punk and other superstars prepare for Survivor Series: WarGames 2026.", "source": "NDTV Profit", "pub_date_str": "27 Nov 2026, 10:00 PM IST", "pub_date_relative": "1h ago"}, {"title": "Pulse of the Street: Profit booking snaps four-week rally; markets brace consolidation?", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nDomestic equities snapped a four-week winning streak as investors booked profits following a sharp month-long rally. The Nifty 50 and Sensex declined 0.7-0.8% during the week, despite foreign portfolio investors (FPIs) buying nearly \u20b9 31,500 crore worth of Indian equities, according to data from National Securities Depository Ltd.\n\nBoth indices fell nearly 1.2% on Friday, with the Nifty closing at 25,607.20 and the Sensex at 83,339.26, making India the worst-performing major equity market of the week.\n\nThe decline does not necessarily signal a reversal in the broader market trend, said Siddhartha Khemka, head of research at Motilal Oswal Financial Services\u2019 wealth management arm.\n\nSome cooling was inevitable after a nearly 13% rally this month, particularly with valuations remaining elevated in parts of the broader market, he said. Improving market breadth, ample domestic liquidity and strong foreign inflows, however, suggest investor confidence remains intact, added Khemka.\n\nInformation technology stocks led sectoral gains, with the BSE IT index rising around 4%, followed by realty stocks, which gained 2%.\n\nThe IT rally coincided with a recovery in global technology stocks, particularly those exposed to the semiconductor and artificial intelligence (AI) supply chains.\n\nKhemka attributed the rebound to value buying following the recent correction in AI-linked stocks. While demand for computing infrastructure, semiconductors, data centres and cloud services remains strong, making it a long-term opportunity, but investors are increasingly looking for evidence that AI investments can translate into sustainable earnings and returns, he said.", "source": "LiveMint Markets", "pub_date_str": "27 Nov 2026, 09:58 PM IST", "pub_date_relative": "1h ago"}, {"title": "ATM Fee Capped At Rs 23 Beyond Free Limits Under RBI\u2019s New Card Norms: What Changes For You", "full_content": "RBI has issued new directions covering card payments and ATM withdrawals. The rules retain existing free ATM withdrawal limits, cap contactless payments without additional authentication at Rs 5,000 and introduce customer alerts on ATM charges.", "source": "NDTV Profit", "pub_date_str": "27 Nov 2026, 09:51 PM IST", "pub_date_relative": "1h ago"}, {"title": "Raj Thackeray-Led MNS Distances Itself From Opposition To Diljit Dosanjh's Mumbai Concert: 'Nothing To Do...'", "full_content": "MNS spokesperson Sandeep Deshpande has clarified that opposition to Diljit Dosanjh's Mumbai concert is personal and does not represent the party's official stance.", "source": "NDTV Profit", "pub_date_str": "27 Nov 2026, 09:47 PM IST", "pub_date_relative": "1h ago"}, {"title": "Jammu And Kashmir Winter Vacation 2026: When Will Schools Close And Reopen?", "full_content": "Students in Classes 9 to 12 will return on February 23, while teaching staff must complete preparatory work before reopening.", "source": "NDTV Profit", "pub_date_str": "27 Nov 2026, 09:43 PM IST", "pub_date_relative": "1h ago"}, {"title": "It\u2019s not just you: Durable goods are getting less reliable, from sputtering cars to glitching smart TVs", "full_content": "\"They just don't make things like they used to.\" The phrase, formerly exclusive to grandparents, is now used by consumers of all ages.\n\nAcross the United States, durable goods like cars, appliances and electronics are becoming less reliable. In the automobile industry, owners of 3-year-old models reported an average of 204 problems per 100 vehicles as of Feb. 12, the highest level since 2022, according to a report from consumer intelligence company J.D. Power. Reliability is a growing concern for dishwashers and front-load washers too, respectively experiencing an average of 92 and 91 problems per 100 units as of Oct. 29, according to a similar J.D. Power report .\n\nConsumers have noticed: Shoppers dealing with high inflation rates and added tariffs on imported goods are unsatisfied with all kinds of products, from cars and tech devices to furniture and kitchen gear. Just over three-quarters of Americans say they believe companies often sell lower-quality products and services at higher prices, according to an Axios and Harris Poll survey published in May 2025.\n\nTo be sure, reliability and durability aren't the only ways to define a product's quality. Aesthetics and performance matter to consumers, too. Your television today may not last as long as the one you grew up with, but it's probably larger and thinner with better picture definition \u2014 and it likely costs much less, when adjusted for inflation, says Justin Sirotin, an industrial design professor at the Rhode Island School of Design.", "source": "CNBC Top News", "pub_date_str": "27 Nov 2026, 09:38 PM IST", "pub_date_relative": "1h ago"}, {"title": "Tata Steel\u2013APL Apollo Deal: SEBI Extends Public Statement Deadline To Dec. 8 For Open Offer", "full_content": "SEBI has extended Tata Steel's deadline to publish the detailed public statement for its APL Apollo open offer by seven days. The revised deadline is December 8, 2026.", "source": "NDTV Profit", "pub_date_str": "27 Nov 2026, 09:36 PM IST", "pub_date_relative": "1h ago"}, {"title": "How much gold should you hold in your portfolio? World Gold Council suggests changing allocation with economic cycles", "full_content": "Gold should not necessarily have a fixed allocation in an investment portfolio. Investors may need to increase their exposure during economic slowdowns and reduce it when growth picks up, according to a new analysis by the World Gold Council (WGC).\n\nIn its report, APAC Gold Market Insights: Gold allocation in different Chinese economic cycles , published on 26 November, the WGC recommends a two-tier approach to investing in gold for chinese investors. This involves maintaining a strategic allocation to the precious metal over the long term while adjusting the allocation depending on the prevailing economic cycle.\n\nThe report suggests that gold allocations in a hypothetical Chinese investment portfolio could range from 5% to 28%, depending on economic conditions. The findings highlight gold's potential role not just as a hedge against uncertainty but also as a portfolio diversifier across different market environments.\n\nThe WGC's analysis suggests that the appropriate allocation to gold depends on whether an economy is slowing, recovering, expanding or stagnating.\n\nThe reasoning is that gold tends to become more valuable as a portfolio diversifier when economic conditions deteriorate. During a slowdown, falling interest rates, weak credit growth and subdued investor confidence can weigh on equities. Government bonds and gold, meanwhile, may offer better protection.\n\nIn a stagnant economy, the case for a higher gold allocation becomes stronger because growth remains weak and traditional investments may struggle to generate attractive returns.\n\nThe situation changes when an economy enters recovery or expansion. Equities tend to perform better as corporate earnings and investor confidence improve. In such conditions, investors can reduce their gold allocation to retain greater participation in equity market gains while still benefiting from diversification.\n\nThe WGC's suggested allocations during recovery and expansion are 11% and 5%, respectively.", "source": "LiveMint Money", "pub_date_str": "27 Nov 2026, 09:32 PM IST", "pub_date_relative": "1h ago"}, {"title": "SanDisk, AMD and Broadcom shares rebound as investors return to battered AI shares; what changed on Wall Street?", "full_content": "US stock markets opened higher on Friday as investors returned from the Thanksgiving holiday break and rushed back into battered AI-linked stocks, driving a broad recovery across technology shares.\n\nThe revival in AI bets sent the Nasdaq 100 up 1.5% after the index had slid to the brink of a bear market. The S&P 500 gained 1.1%, putting it on track for its biggest weekly advance since May 2025. Following the Thanksgiving holiday, trading on Friday will close early at 1 pm ET.\n\nChipmakers that faced heavy selling pressure this month have rebounded, with AMD climbing 2% and Broadcom gaining 3.6%. AI hyperscalers Alphabet, Amazon, Microsoft, Meta Platforms and Oracle advanced between 1.9% and 3.8%. However, Nvidia remained lower by 1.5% and is down by 28% in November so far.\n\nNeocloud company Nebius rose 2.5%. Other AI beneficiaries, including data-storage firm SanDisk, optical-products maker Lumentum and server maker Dell, also gained up to 12%\n\nUS markets, which had scaled multiple record highs this year, have faced heavy selling pressure as fund managers reassess their exposure to the AI trade amid concerns over whether the debt-fuelled AI boom can generate sufficient returns to justify the massive investments.\n\nAdding to the pressure are growing concerns over potential regulatory scrutiny of the AI sector following the Democrats' gains in the US midterm elections. News surrounding Nvidia CEO Jensen Huang also provided a temporary reprieve to sentiment earlier in the week, although the optimism quickly faded.\n\nDespite the recent turbulence, the S&P 500 and Nasdaq are headed for their best weekly performances since May 2025 and August, respectively, while the blue-chip Dow Jones Industrial Average is on track for its strongest week since April 2025.\n\nHowever, the gains have done little to erase November's losses.", "source": "LiveMint Markets", "pub_date_str": "27 Nov 2026, 09:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "A 66-year-old nurse is facing down retirement with just $500 saved. Who\u2019s to blame?", "full_content": "\u201cRetirement is a financial status, not an age.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "27 Nov 2026, 09:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "ChatGPT's Big Change: OpenAI Merges Chat And Work Modes, But There's A Catch", "full_content": "The change will bring ChatGPT and Codex usage under a shared allowance for Plus, Pro and Business subscribers, while Instant conversations will remain unlimited.", "source": "NDTV Profit", "pub_date_str": "27 Nov 2026, 09:22 PM IST", "pub_date_relative": "1h ago"}, {"title": "Trump demands probe into 'record setting error' after third-quarter GDP data gets massive revision higher", "full_content": "President Donald Trump on Thursday falsely deemed the latest gross domestic product revision a mistake, claiming that it should be \"immediately investigated.\"\n\nData released Wednesday from the Commerce Department revealed that the U.S. economy exhibited much stronger growth for the third quarter than initially estimated, showing that real GDP grew at a 4.3% annualized rate . That was revised upward from the department's advance estimate of 3.4%.\n\nThat revision was a \"RECORD SETTING ERROR,\" Trump said in a Truth Social post , suggesting that the initial release could have influenced the outcome of the 2026 U.S. midterm elections , where Democrats flipped both chambers of Congress and multiple governorships.\n\n\"I would like to wish a Happy Thanksgiving to even those who issued fake Economic Numbers, just prior to the Election, and corrected them yesterday, three weeks late, showing that the GDP was actually 4.3%, versus 3.4%, A RECORD SETTING ERROR, and one so grave that it should be immediately investigated,\" Trump wrote.\n\nHowever, the difference between the advance estimate and the figure in the second release is far from being an all-time record. It was the largest revision since the 1.2 percentage point revision seen in the second quarter of 2020.\n\nOn an absolute basis, the latest revision was tied for 16th among all revisions from the advance estimate to the second release since 1990. It also tied four other quarters with a similar 0.9 percentage point difference \u2014 and was approximately double the average revision of 0.43 percentage points for all 147 quarters.\n\nThe upward revision shows Trump's policies are \"delivering results\" that defy expectations, White House spokesman Matthew Middleton told CNBC.\n\nRevisions to U.S. economic numbers are not out of the ordinary . Initial reports count on partial survey data and early estimates. That data is later updated with more survey responses \u2014 which sometimes leads to changes from the initial reports.", "source": "CNBC Top News", "pub_date_str": "27 Nov 2026, 09:22 PM IST", "pub_date_relative": "1h ago"}, {"title": "These stocks soared the most during a wild week highlighted by Huang\u2019s return to Nvidia", "full_content": "Nvidia\u2019s stock soared this week, but was still down nearly 28% for November and 21% for 2026.", "source": "MarketWatch Top Stories", "pub_date_str": "27 Nov 2026, 09:22 PM IST", "pub_date_relative": "1h ago"}, {"title": "'The Traitors' ended with a $246,300 prize\u2014here's who won and what they told us about spending it", "full_content": "When Shane Beatty, a contestant on NBC's \"The Traitors: New Blood,\" deceived his fellow finalists, he walked away with the entire $246,300 prize. But the emotional toll of winning caught him by surprise.\n\n\"The second I had to reveal that I was a Traitor, everything hit me at once,\" Beatty, a 32-year-old ironworker from Staten Island, New York, tells CNBC Make It. \"I had built genuine relationships with these people, and knowing that some of them were blindsided by my decision was difficult.\"\n\nNow that he's won, Beatty has a plan for his money, starting with setting aside a sizable share for Uncle Sam. As for the rest, he's more interested in financial security than the trappings of newfound wealth.\n\nAfter winning, Beatty doesn't expect his day-to-day life to change much.\n\n\"I'm still going to get up, go to work, and continue doing what I've been doing as a Local 580 ironworker,\" he says. \"I love my career, and winning this money doesn't change that.\"\n\nBeatty plans to pay for a wedding he and his fianc\u00e9e previously struggled to afford, help his mother pay down debt and clear his own debts before saving the rest.\n\n\"What it does give me is an opportunity to take some financial pressure off, be a little more comfortable and put myself in a better position for the future,\" he says.\n\nBut before spending his winnings, Beatty is accounting for what could be his single biggest expense \u2014 taxes.", "source": "CNBC Top News", "pub_date_str": "27 Nov 2026, 09:19 PM IST", "pub_date_relative": "1h ago"}, {"title": "Hackers attack and penetrate Air Force\u2019s computing platform - NBC News", "full_content": "Hackers attack and penetrate Air Force\u2019s computing platform NBC News EXCLUSIVE: Hackers breach US Air Force flagship Cloud One computing platform Reuters Reports: US Air Force's cloud computing platform hacked 10tv.com Hackers break into US Air Force cloud computing platform: Report The Hill Hackers reportedly breach US Air Force\u2019s flagship cloud computing platform The Guardian", "source": "Google News Business", "pub_date_str": "27 Nov 2026, 09:16 PM IST", "pub_date_relative": "1h ago"}, {"title": "I\u2019ve been married for 58 years. It\u2019s \u2018our\u2019 money, not \u2018his\u2019 and \u2018hers.\u2019 Why do so many couples keep their finances separate?", "full_content": "\u201cMy wife stopped working outside the home in 1970.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "27 Nov 2026, 09:15 PM IST", "pub_date_relative": "1h ago"}, {"title": "US Tech Roars Back: Meta-Led 'Mag-Seven' Lifts Nasdaq; Chip Stocks Surge To Cap Volatile Week", "full_content": "Meta, Amazon and Tesla lead gains among the Magnificent Seven as US technology stocks rebound after a volatile week, while semiconductor shares rally on renewed buying in AI-linked companies.", "source": "NDTV Profit", "pub_date_str": "27 Nov 2026, 09:13 PM IST", "pub_date_relative": "1h ago"}, {"title": "O.M - Operation Mole Box Office Collection Day 9: Dhanush-Mammootty Starrer Holds Steady, Nears Rs 75 Crore", "full_content": "Rajkumar Periasamy\u2019s O.M - Operation Mole follows different characters whose lives come together during a major conflict, creating a tense story filled with drama and unexpected twists.", "source": "NDTV Profit", "pub_date_str": "27 Nov 2026, 09:10 PM IST", "pub_date_relative": "1h ago"}, {"title": "Sebi allows FPIs to trade in physically settled non-agri commodity derivatives", "full_content": "The Securities and Exchange Board of India (Sebi) has widened the participation of foreign portfolio investors (FPIs) in exchange-traded commodity derivatives, allowing them to trade in physically settled non-agricultural contracts from 1 June 2027.\n\nIn a circular issued on Friday, the markets regulator revised its existing framework, which had restricted FPI participation in commodity derivatives to cash-settled non-agricultural contracts and indices comprising such commodities.\n\nThe move is aimed at deepening institutional participation and improving liquidity in the commodity derivatives market.\n\nUnder the revised framework, FPIs will be permitted to participate in non-agricultural commodity derivative contracts, barring options in goods. However, they will have to exit or roll over their open positions before the tender or staggered delivery period commences.\n\nFPIs are currently allowed to trade only in non-agri commodity derivatives that are cash settled, such as crude oil and natural gas contracts. Sebi opened up that segment to foreign investors in June 2022. Bullion, base metals and agri derivatives, however, are compulsorily deliverable upon contract expiry.\n\nSebi has put in place a safeguard mechanism to prevent foreign investors from getting entangled in the physical delivery process. FPIs will be free to square off or roll over their positions until the close of market hours on the day preceding the start of the tender period. If they fail to do so, their residual positions will automatically transfer to a designated trading member or trading-cum-clearing member (TM/TCM).\n\nThe regulator has also prohibited fresh trades that increase an FPI's existing position in an expiring futures contract from three trading days before the start of the tender or staggered delivery period.", "source": "LiveMint Markets", "pub_date_str": "27 Nov 2026, 09:08 PM IST", "pub_date_relative": "1h ago"}, {"title": "The 19+ best Target Black Friday deals that are actually worth shopping - NBC News", "full_content": "The 19+ best Target Black Friday deals that are actually worth shopping NBC News Shoppers line up outside of retail stores ahead of Black Friday WHIO TV Shoppers line up at Savannah Target ahead of Black Friday WTOC Several major retailers offer incentives for in-person Black Friday shopping WFMZ.com Dozens of shoppers line up outside Target in Durham for Black Friday deals WRAL", "source": "Google News Business", "pub_date_str": "27 Nov 2026, 09:00 PM IST", "pub_date_relative": "2h ago"}, {"title": "Nottingham Forest vs Chelsea Live Streaming: Likely Lineups; How To Watch Premier League Match On TV, Online?", "full_content": "Chelsea look to return to winning ways when they travel to face Nottingham Forest in the Premier League. Check the likely lineups and India viewing details.", "source": "NDTV Profit", "pub_date_str": "27 Nov 2026, 09:00 PM IST", "pub_date_relative": "2h ago"}, {"title": "My husband secretly sends his ex-wife $1,500 a month after she lost her job. We have $2.4 million saved. Has he lied by omission?", "full_content": "\u201cHe explained that he wasn\u2019t trying to hide the payment, but his former wife lost her job in a medical billing company.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "27 Nov 2026, 09:00 PM IST", "pub_date_relative": "2h ago"}, {"title": "Wall Street's Post-Thanksgiving Rally: Nasdaq Jumps 330 Points On AI Dip-Buying, Dow Eyes Weekly Surge", "full_content": "Nasdaq Composite rose 1.4% or 330 points to 23,916.59, S&P 500 advanced 1.15% to 7,265.55, while Dow Jones Industrial Average traded 1.03% up at 50,697.38.", "source": "NDTV Profit", "pub_date_str": "27 Nov 2026, 08:55 PM IST", "pub_date_relative": "2h ago"}, {"title": "Aakasamlo Oka Tara Box Office Collection Day 8: Dulquer Salmaan's Film Records Week 2 Earnings", "full_content": "Aakasamlo Oka Tara, also known as AOT, is a Telugu sci-fi drama directed by Pavan Sadineni. The film stars Dulquer Salmaan and Satvika Veeravalli in the lead, blending science fiction with an emotional story.", "source": "NDTV Profit", "pub_date_str": "27 Nov 2026, 08:53 PM IST", "pub_date_relative": "2h ago"}, {"title": "Javed Akhtar Opens Up About Alcohol Addiction: 'I Wasted 15 Years Of My Life'", "full_content": "Speaking to Barkha Dutt, Akhtar recalled his last drinking session on July 31, 1991, and why he decided to quit alcohol.", "source": "NDTV Profit", "pub_date_str": "27 Nov 2026, 08:49 PM IST", "pub_date_relative": "2h ago"}, {"title": "ENE Repeat Box Office Collection Day 9: Vishwak Sen Starrer Crosses Rs 25 Crore Mark As Week 2 Begins", "full_content": "Vishwak Sen leads ENE Repeat as Vivek, with Venkatesh Kakumanu, Shivathmika Rajashekar, Anil Ravipudi, Maganti Srinath, Anisha Ambrose and Abhinav Gomatam in supporting roles.", "source": "NDTV Profit", "pub_date_str": "27 Nov 2026, 08:48 PM IST", "pub_date_relative": "2h ago"}], "cfa": [{"title": "US tech stocks rise in latest market swing", "full_content": "All-powerful AI trade has been eclipsed by wild moves in a market struggling to price future earnings", "source": "FT Markets", "pub_date_str": "27 Nov 2026, 10:57 PM IST", "pub_date_relative": "7m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Dow rallies 500 points as benchmark heads for best week since April 2025: Live updates", "full_content": "U.S. equities rose on Friday as investors try to wrap up a turbulent shortened trading week.\n\nThe Dow Jones Industrial Average was higher by 532 points, or 1.1%. The S&P 500 added 1.3%, while the Nasdaq Composite advanced 1.8%. The moves come amid a volatile week during an even more volatile month.\n\nTechnology stocks supported the bounce. \"Magnificent Seven\" members Meta Platforms and Amazon popped 3% and 4%, respectively, while chipmaker Broadcom increased almost 4%. Shares of artificial intelligence lab Anthropic added nearly 10%.\n\nThe major U.S. stock benchmarks were headed for strong weekly gains. Entering Friday's session, the Dow is up 5%, on pace for its biggest weekly advance since April 2025. The S&P 500 has climbed 5% in that time, while the Nasdaq has surged more than 6%.\n\nDow, 5-day The week kicked off with Jensen Huang getting reinstated as CEO at Nvidia , a move that sent the stock up 31% during Monday's session and drove the S&P 500 and Nasdaq Composite to post their best days since April 2025 . The Dow Jones Industrial Average advanced more than 1,400 points, or roughly 3%.\n\nSince then, however, the S&P 500 and Nasdaq have come under pressure as Nvidia and other AI-related stocks have given back some of Monday's gains.\n\nPrior to Huang's departure earlier this month, sentiment toward the AI trade was already downbeat, with investors growing concerned about debt financing , signs of moderation in capital expenditures and Democratic wins in the midterm elections resulting in a slowdown in data center development .\n\nBut Ben Fulton of WEBs Investments believes the fears surrounding AI, except for those regarding debt financing, are \"a bit overblown,\" noting that the \"biggest risk\" is whether AI companies can \"keep funding the growth they need.\" At the same time, he doesn't think investors can \"afford to be out of the AI story.\"", "source": "CNBC Top News", "pub_date_str": "27 Nov 2026, 10:54 PM IST", "pub_date_relative": "10m ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "EPFO's Nidhi Aapke Nikat 2.0 camps: How to check your nearest venue, services available and documents required", "full_content": "The Employees' Provident Fund Organisation (EPFO) is conducting a Nidhi Aapke Nikat awareness campaign across India. The retirement body urged EPFO members to visit the camp and interact with officials to know more about the EPFO's schemes and benefits, understand services and processes, and get on-the-spot grievance redressal.\n\nIn a post on social media, the EPFO's official account also provided a document listing the various camp sites so that subscribers may find one nearest to their location to visit.\n\nThe EPFO has arranged multiple camps in major cities to manage the expected number of visitors. Seven regional offices are holding separate sessions across Bengaluru, while five camps are being organised under the Mumbai-I zone.\n\nSeveral camps are also being held across Delhi NCR and Chennai.\n\nThe schedule covers locations beyond major cities, including Leh in Ladakh, Pulwama in Jammu and Kashmir, and Port Blair in South Andaman.\n\nNidhi Aapke Nikat is the provident and pension fund body's last-mile monthly outreach programme for members, through which it organises camps across India at the district level.\n\nUnder this initiative, the EPFO will set up help desks for members, including pensioners, offering a range of services such as the submission of Digital Life Certificates (DLCs) and other pensioner-centric assistance.\n\nService kiosks are set up to address on-the-spot grievances for employees, employers, and pensioners, as well as to share relevant information with stakeholders.", "source": "LiveMint Money", "pub_date_str": "27 Nov 2026, 10:49 PM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Corporate Issuers", "Portfolio Management"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Zee Entertainment \u20b9600 crore buyback opens on December 1; what eligible shareholders need to know", "full_content": "A Ksheerasagar Published 27 Nov 2026, 10:40 PM IST Prefer Livemint on Google The \u20b9 600 crore share buyback of Zee Entertainment Enterprises will open on December 1 and close on December 7. Under the buyback, the company will repurchase up to 6.59 crore fully paid-up equity shares, according to its regulatory filing.\n\nThe buyback size represents 7.22% and 6.61% of the aggregate of the company's fully paid-up equity share capital and free reserves, based on its audited standalone and consolidated financial statements as of March 31, 2026, respectively.\n\nThe buyback will be conducted through the tender offer route on a proportionate basis, with November 25, 2026, having been fixed as the record date to determine eligible shareholders. Shareholders who held Zee Entertainment shares as of the record date are eligible to participate in the buyback, subject to the applicable entitlement ratio.\n\nThe company has fixed the buyback price at \u20b9 91 per equity share, payable in cash. The offer will be made to shareholders and beneficial owners whose names appear in the company's records as of the record date.\n\nThe board has also authorised the possibility of revising the buyback price upwards and reducing the number of shares proposed to be repurchased, provided the overall buyback size remains unchanged. Any such revision can be made up to one working day before the record date.\n\nThe last date for the receipt of completed tender forms and specified documents by the registrar is also December 7, while the settlement of bids on the stock exchanges is scheduled to be completed by December 14.\n\nEligible shareholders are entitled to tender approximately one share for every 14 shares held on the record date. The actual entitlement ratio stands at 7.1495% for small shareholders and 7.1497% for other eligible shareholders.\n\nZee Entertainment's board has noted the intention of the promoters and members of the promoter group not to participate in the proposed buyback.", "source": "LiveMint Markets", "pub_date_str": "27 Nov 2026, 10:40 PM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Corporate Issuers", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Can a married, financially independent daughter claim insurance compensation after her parent\u2019s death? What the law says", "full_content": "A daughter does not lose her right to claim compensation for a parent's death in a road accident simply because she is married, earns her own income or lives separately. Even if she does not depend on her parents financially, she can approach the Motor Accident Claims Tribunal (MACT) as a legal representative of the deceased.\n\nThe Delhi High Court has reaffirmed this position in a judgment dated 6 November 2026, holding that financial dependency is not a prerequisite for filing a compensation claim under Section 166 of the Motor Vehicles Act, 1988. The ruling is significant for married and financially independent children who may otherwise be excluded from compensation claims on the assumption that they no longer depend on their parents.\n\nIn United India Insurance Co. Ltd. v. Savita & Anr. , the court examined whether a married daughter could claim compensation following the deaths of her father and sister in a road accident. It held that a legal representative cannot be denied the right to maintain a claim merely because she is married, employed or living separately.\n\nSection 166 of the Motor Vehicles Act allows all or any of the legal representatives of a person who dies in a road accident to file a compensation claim.\n\nThe distinction between a legal heir and a legal representative is important. A legal representative is not necessarily someone who inherits the deceased's property or was financially dependent on them. The expression covers people who represent the deceased's interests and have suffered a loss because of the death.\n\nThe Delhi High Court relied on the Supreme Court's judgment in Manjuri Bera v. Oriental Insurance Co. Ltd.", "source": "LiveMint Money", "pub_date_str": "27 Nov 2026, 10:39 PM IST", "pub_date_relative": "25m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Gold-silver ratio declines: What drives the drop, why it matters, and what it means for bullion prices", "full_content": "Gold and silver prices rebounded on Friday after a sharp selloff pushed the precious metals towards crucial support levels of $3,400-$3,500 an ounce and $39-$40 an ounce, respectively. Silver led the recovery, providing support to the broader precious metals market, while stronger physical demand from China also helped gold prices recover.\n\nHowever, the gold-to-silver ratio\u2014which tracks how many ounces of silver it takes to buy one ounce of gold\u2014has begun to reverse.\n\nAccording to FXEmpire , China's latest import data indicated that net gold imports through Hong Kong increased 1.6% to 76.2 tonnes in October, the highest level since April. The rise suggests that lower prices encouraged physical gold purchases.\n\nHowever, expectations of elevated interest rates continue to pose a challenge to precious metals, which do not generate interest income.\n\nFresh tariff proposals by the Donald Trump administration have added another layer of uncertainty to the global economic outlook. The US has proposed import duties covering 14 trading partners, including China, Japan and the European Union.\n\nHigher import costs could keep inflation elevated and prompt further interest rate increases, potentially limiting gains in gold and silver.\n\nAt the same time, escalating trade tensions could strengthen gold's appeal as a safe-haven investment. Silver, however, could face additional pressure if higher tariffs slow manufacturing activity and weaken industrial demand.\n\nFXEmpire said gold prices were showing signs of recovery after finding support in the $3,400-$3,500 range. The immediate resistance for spot gold is around $3,700.", "source": "LiveMint Money", "pub_date_str": "27 Nov 2026, 10:35 PM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Economics", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Stocks making the biggest moves midday: XP, Newmont, Sandisk & more", "full_content": "Sandisk popped more than 10% on Friday, boosted by traders piling into AI-linked names. Newmont also got a lift as precious metals traded higher.\n\nFollow along as CNBC highlights the biggest stock moves of the day.\n\nShares of Targa Resources declined nearly 1% after Bloomberg reported that the natural gas pipeline operator was in talks to acquire Kinetik , a Permian Basin pipeline company partly owned by Blackstone.\n\nShares of Kinetik were up nearly 9% on the news. No deal has been reached, and Kinetik could remain independent or another bidder could emerge.\n\nMining stocks climbed Friday alongside higher prices for gold, silver, copper and other metals. Gold futures climbed more than 2%, silver was ahead 7.4% while platinum gained 5%, palladium almost 6% and copper 3%.\n\nNewmont Mining advanced 4.1% while AngloGold Ashanti added 4.7%. Coeur Mining jumped 6.8%, Gold Fields Ltd. climbed 5.5% and Freeport McMoRan increased 3.9%.\n\nShares of XP , a Brazilian investment management company, jumped nearly 18.5% Friday after President Luiz In\u00e1cio Lula da Silva named Bradesco Chairman Luiz Carlos Trabuco as Brazil's next finance minister.\n\nThe rise of Brazil's public debt at nearly 83% of the country's GDP has worried investors but the appointment is viewed as a possible signal that Lula will pursue a more market-friendly fiscal policy. Trabuco is expected to take the role in January, as Lula begins his new term.", "source": "CNBC Top News", "pub_date_str": "27 Nov 2026, 10:31 PM IST", "pub_date_relative": "34m ago", "cfa_topics": ["Economics", "Derivatives", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Stock Market Today: Dow, S&P 500 and Nasdaq rally more than 1% in shortened session as gains broaden beyond tech \u2014 live updates - MarketWatch", "full_content": "Stock Market Today: Dow, S&P 500 and Nasdaq rally more than 1% in shortened session as gains broaden beyond tech \u2014 live updates MarketWatch Dow rallies 500 points as benchmark heads for best week since April 2025: Live updates CNBC Stocks Rally at End of a Week of Wild Swings The New York Times US Futures Rally as Tech Rebound Gains Momentum: Markets Wrap Bloomberg.com Global markets rally as end of bruising month approaches Reuters", "source": "Google News Business", "pub_date_str": "27 Nov 2026, 10:25 PM IST", "pub_date_relative": "40m ago", "cfa_topics": ["Equity Investments", "Derivatives", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Josh Brown lost a bet on Disney. It is now on his Best Stocks in the Market list", "full_content": "With a 12.3% total return in 2026, Disney is the 14th-best performing stock in the Dow Jones Industrial Average this year.", "source": "CNBC Top News", "pub_date_str": "27 Nov 2026, 10:19 PM IST", "pub_date_relative": "45m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Sebi to recast rulebook to fund India's growth: Tuhin Kanta Pandey", "full_content": "The Securities and Exchange Board of India (Sebi) will revisit the rulebook, deepen the market, and ease access for global investors, its chairman Tuhin Kanta Pandey said on Friday, pitching these as crucial steps towards recalibrating India\u2019s capital markets to match its ambition to emerge as a developed nation by 2047.\n\nAs part of its efforts to simplify compliance, the regulator aims to reduce the time taken to onboard foreign portfolio investors (FPIs) to just five business days, down from months now, Pandey said.\n\n\u201cAs the economy grows, its financing needs change, investor expectations evolve, technology opens new possibilities, and risks take new forms. Our markets and their regulation must keep pace,\u201d he said while addressing industry body Assocham's Capital Markets Conference in New Delhi.\n\nThe regulator is reviewing the Listing Obligations and Disclosure Requirements framework to remove disclosures that duplicate filings with the corporate affairs ministry and to replace multiple exchange fines for the same lapse with a single one, he said.\n\nThe regulator is also revisiting the Issue of Capital and Disclosure Requirements framework for initial public offerings ( IPOs ), follow-on public offers, preferential issues, and qualified institutional placements, in addition to the IPO framework for small and medium enterprises and the Innovators Growth Platform for technology- and innovation-driven companies.\n\nA graded compliance framework for stock brokers is also being explored, so that obligations reflect a broker's scale, client exposure, and reliance on technology.\n\nPandey said the rapid progress in the capital markets in recent years suggests they can already finance India's growth, but indicated that more steps are needed to meet the requirements of an economy twice the current size.\n\nThe country's equity market is now worth over \u20b9 500 trillion, more than 130% of gross domestic product (GDP), he said.", "source": "LiveMint Markets", "pub_date_str": "27 Nov 2026, 10:18 PM IST", "pub_date_relative": "46m ago", "cfa_topics": ["Economics", "Corporate Issuers", "Equity Investments", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "AI shopping agents are having a moment, but Amazon and a growing number of sites threaten to stunt their growth", "full_content": "Maia Bittner urgently needed to replace her car's windshield wipers. So last month, she turned to Meta 's Muse personal artificial intelligence agent.\n\nBittner, chief product officer at fintech startup Imprint, gave Muse the greenlight to buy some wipers on her behalf from AutoZone. Or so she thought.\n\nAbout 17 hours later, she got a notification from her Muse agent, saying AutoZone canceled her order due to an unspecified error.\n\n\"Honestly, the most reliable path now is you ordering on Amazon yourself,\" Muse said, according to a screenshot of the message.\n\nThe interaction encapsulates the current messy and complicated landscape of agentic shopping apps, the AI tools that can make purchases on behalf of users. Over the past year, tech companies such as OpenAI , Meta, Google and Instinct have introduced versions of personal agents that promise to take the hassle out of browsing and buying online.\n\nWhile some major retailers, such as Walmart and Sephora, have opened up their sites to agents, companies including Amazon, eBay , United Airlines and Kohl's limit what actions agents can take or block them outright. Others have added provisions to their terms of service spelling out that they're not liable if users' AI-driven purchases go wrong.\n\n\"It's a very mixed bag,\" Emily Pfeiffer, a principal analyst at Forrester, said in an interview. \"It means that a consumer who's using an agent to shop and browse and learn is not going to see the full set of options because some websites are unavailable.\"\n\nThe hiccups threaten to stunt the growth of shopping agents by creating a clunky and frustrating experience for users who are just starting to experiment with the tools. The question of who takes the blame when a transaction goes wrong also remains unclear.", "source": "CNBC World Economy", "pub_date_str": "27 Nov 2026, 10:13 PM IST", "pub_date_relative": "51m ago", "cfa_topics": ["Financial Statement Analysis", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Using Non-Bank ATMs? How RBI's New Cash-Sourcing Rules Will Improve Cash Availability Near You", "full_content": "The RBI has allowed White Label ATM operators to source cash from multiple banks, including cooperative banks and regional rural banks, and buy wholesale currency directly from the central bank, offering greater flexibility in managing cash availability.", "source": "NDTV Profit", "pub_date_str": "27 Nov 2026, 10:08 PM IST", "pub_date_relative": "57m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Blackstone sells 1.55% stake in IGI for Rs 280 crore to meet public shareholding norms", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Blackstone sells 1.55% stake in IGI for Rs 280 crore to meet public shareholding norms International Gemological Institute Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Blackstone sells 1.55% stake in IGI for Rs 280 crore to meet public shareholding norms SECTIONS Blackstone sells 1.55% stake in IGI for Rs 280 crore to meet public shareholding norms PTI Last Updated: Nov 27, 2026, 10:03:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Blackstone completed the sale of a 1.5 percent stake in International Gemological Institute through block deals. The transaction involved selling over 67.16 lakh shares at an average of Rs 417 each. As a result, Blackstone's holding decreased from 76.55 percent to 75 percent. The stake sale was necessary to comply with minimum public shareholding requirements under Sebi regulations. Following the sale, shares of International Gemological Institute rose by 1.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "27 Nov 2026, 10:03 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Pulse of the Street: Profit booking snaps four-week rally; markets brace consolidation?", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nDomestic equities snapped a four-week winning streak as investors booked profits following a sharp month-long rally. The Nifty 50 and Sensex declined 0.7-0.8% during the week, despite foreign portfolio investors (FPIs) buying nearly \u20b9 31,500 crore worth of Indian equities, according to data from National Securities Depository Ltd.\n\nBoth indices fell nearly 1.2% on Friday, with the Nifty closing at 25,607.20 and the Sensex at 83,339.26, making India the worst-performing major equity market of the week.\n\nThe decline does not necessarily signal a reversal in the broader market trend, said Siddhartha Khemka, head of research at Motilal Oswal Financial Services\u2019 wealth management arm.\n\nSome cooling was inevitable after a nearly 13% rally this month, particularly with valuations remaining elevated in parts of the broader market, he said. Improving market breadth, ample domestic liquidity and strong foreign inflows, however, suggest investor confidence remains intact, added Khemka.\n\nInformation technology stocks led sectoral gains, with the BSE IT index rising around 4%, followed by realty stocks, which gained 2%.\n\nThe IT rally coincided with a recovery in global technology stocks, particularly those exposed to the semiconductor and artificial intelligence (AI) supply chains.\n\nKhemka attributed the rebound to value buying following the recent correction in AI-linked stocks. While demand for computing infrastructure, semiconductors, data centres and cloud services remains strong, making it a long-term opportunity, but investors are increasingly looking for evidence that AI investments can translate into sustainable earnings and returns, he said.", "source": "LiveMint Markets", "pub_date_str": "27 Nov 2026, 09:58 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "It\u2019s not just you: Durable goods are getting less reliable, from sputtering cars to glitching smart TVs", "full_content": "\"They just don't make things like they used to.\" The phrase, formerly exclusive to grandparents, is now used by consumers of all ages.\n\nAcross the United States, durable goods like cars, appliances and electronics are becoming less reliable. In the automobile industry, owners of 3-year-old models reported an average of 204 problems per 100 vehicles as of Feb. 12, the highest level since 2022, according to a report from consumer intelligence company J.D. Power. Reliability is a growing concern for dishwashers and front-load washers too, respectively experiencing an average of 92 and 91 problems per 100 units as of Oct. 29, according to a similar J.D. Power report .\n\nConsumers have noticed: Shoppers dealing with high inflation rates and added tariffs on imported goods are unsatisfied with all kinds of products, from cars and tech devices to furniture and kitchen gear. Just over three-quarters of Americans say they believe companies often sell lower-quality products and services at higher prices, according to an Axios and Harris Poll survey published in May 2025.\n\nTo be sure, reliability and durability aren't the only ways to define a product's quality. Aesthetics and performance matter to consumers, too. Your television today may not last as long as the one you grew up with, but it's probably larger and thinner with better picture definition \u2014 and it likely costs much less, when adjusted for inflation, says Justin Sirotin, an industrial design professor at the Rhode Island School of Design.", "source": "CNBC Top News", "pub_date_str": "27 Nov 2026, 09:38 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "How much gold should you hold in your portfolio? World Gold Council suggests changing allocation with economic cycles", "full_content": "Gold should not necessarily have a fixed allocation in an investment portfolio. Investors may need to increase their exposure during economic slowdowns and reduce it when growth picks up, according to a new analysis by the World Gold Council (WGC).\n\nIn its report, APAC Gold Market Insights: Gold allocation in different Chinese economic cycles , published on 26 November, the WGC recommends a two-tier approach to investing in gold for chinese investors. This involves maintaining a strategic allocation to the precious metal over the long term while adjusting the allocation depending on the prevailing economic cycle.\n\nThe report suggests that gold allocations in a hypothetical Chinese investment portfolio could range from 5% to 28%, depending on economic conditions. The findings highlight gold's potential role not just as a hedge against uncertainty but also as a portfolio diversifier across different market environments.\n\nThe WGC's analysis suggests that the appropriate allocation to gold depends on whether an economy is slowing, recovering, expanding or stagnating.\n\nThe reasoning is that gold tends to become more valuable as a portfolio diversifier when economic conditions deteriorate. During a slowdown, falling interest rates, weak credit growth and subdued investor confidence can weigh on equities. Government bonds and gold, meanwhile, may offer better protection.\n\nIn a stagnant economy, the case for a higher gold allocation becomes stronger because growth remains weak and traditional investments may struggle to generate attractive returns.\n\nThe situation changes when an economy enters recovery or expansion. Equities tend to perform better as corporate earnings and investor confidence improve. In such conditions, investors can reduce their gold allocation to retain greater participation in equity market gains while still benefiting from diversification.\n\nThe WGC's suggested allocations during recovery and expansion are 11% and 5%, respectively.", "source": "LiveMint Money", "pub_date_str": "27 Nov 2026, 09:32 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "SanDisk, AMD and Broadcom shares rebound as investors return to battered AI shares; what changed on Wall Street?", "full_content": "US stock markets opened higher on Friday as investors returned from the Thanksgiving holiday break and rushed back into battered AI-linked stocks, driving a broad recovery across technology shares.\n\nThe revival in AI bets sent the Nasdaq 100 up 1.5% after the index had slid to the brink of a bear market. The S&P 500 gained 1.1%, putting it on track for its biggest weekly advance since May 2025. Following the Thanksgiving holiday, trading on Friday will close early at 1 pm ET.\n\nChipmakers that faced heavy selling pressure this month have rebounded, with AMD climbing 2% and Broadcom gaining 3.6%. AI hyperscalers Alphabet, Amazon, Microsoft, Meta Platforms and Oracle advanced between 1.9% and 3.8%. However, Nvidia remained lower by 1.5% and is down by 28% in November so far.\n\nNeocloud company Nebius rose 2.5%. Other AI beneficiaries, including data-storage firm SanDisk, optical-products maker Lumentum and server maker Dell, also gained up to 12%\n\nUS markets, which had scaled multiple record highs this year, have faced heavy selling pressure as fund managers reassess their exposure to the AI trade amid concerns over whether the debt-fuelled AI boom can generate sufficient returns to justify the massive investments.\n\nAdding to the pressure are growing concerns over potential regulatory scrutiny of the AI sector following the Democrats' gains in the US midterm elections. News surrounding Nvidia CEO Jensen Huang also provided a temporary reprieve to sentiment earlier in the week, although the optimism quickly faded.\n\nDespite the recent turbulence, the S&P 500 and Nasdaq are headed for their best weekly performances since May 2025 and August, respectively, while the blue-chip Dow Jones Industrial Average is on track for its strongest week since April 2025.\n\nHowever, the gains have done little to erase November's losses.", "source": "LiveMint Markets", "pub_date_str": "27 Nov 2026, 09:30 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Ethical & Professional Standards"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Trump demands probe into 'record setting error' after third-quarter GDP data gets massive revision higher", "full_content": "President Donald Trump on Thursday falsely deemed the latest gross domestic product revision a mistake, claiming that it should be \"immediately investigated.\"\n\nData released Wednesday from the Commerce Department revealed that the U.S. economy exhibited much stronger growth for the third quarter than initially estimated, showing that real GDP grew at a 4.3% annualized rate . That was revised upward from the department's advance estimate of 3.4%.\n\nThat revision was a \"RECORD SETTING ERROR,\" Trump said in a Truth Social post , suggesting that the initial release could have influenced the outcome of the 2026 U.S. midterm elections , where Democrats flipped both chambers of Congress and multiple governorships.\n\n\"I would like to wish a Happy Thanksgiving to even those who issued fake Economic Numbers, just prior to the Election, and corrected them yesterday, three weeks late, showing that the GDP was actually 4.3%, versus 3.4%, A RECORD SETTING ERROR, and one so grave that it should be immediately inv
