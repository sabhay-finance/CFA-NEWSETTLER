Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Infrastructure \u203a Annual pass takes a toll, transactions dip 5.2% in H1 The Economic Times daily newspaper is available online now. Read Today's Paper Annual pass takes a toll, transactions dip 5.2% in H1 SECTIONS Annual pass takes a toll, transactions dip 5.2% in H1 By Yogima Seth Sharma , ET Bureau Last Updated: Oct 07, 2026, 11:49:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Government data shows toll volume fell 5.2% to 2.13 billion in April-September from 2.25 billion in the year-ago period. Toll revenue rose 6.27% to Rs 42,971.82 crore from Rs 40,433.53 crore in the same period of 2025-26, a much slower pace of growth than in previous years.\n\nThe NBFC saga - Part 1: How RBI moved from protecting depositors to policing systemic risk\n\nBritannia\u2019s next big bet for young India lies beyond biscuits\n\nThe world is witnessing a bond rout. Why should it matter to you?\n\nQ2 earnings season: Will it settle or add to confusion in the stock market?\n\nHow Sebi busted Growpital\u2019s \u2018assured\u2019 returns, LLPs and money trail\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers", "source": "Economic Times Economy", "pub_date_str": "07 Oct 2026, 11:49 PM IST", "pub_date_relative": "1h ago"}, {"title": "Here comes third-quarter earnings season. Booming profits could propel the S&P 500 to new heights", "full_content": "Third-quarter earnings season kicks off this week and as results roll in they should reveal what the market is eagerly anticipating: another blockbuster quarter for S&P 500 profits.\n\nThe market closed at record highs Tuesday as investors bet that AI capex \u2014 a major force for the markets and economy \u2014 won't be derailed by higher bond yields. Assuming upbeat guidance from key companies \u2014 along with a little help on the bond side \u2014 earnings could propel stocks to a strong finish for the year.\n\nAt the index level, profit growth should be stellar. Analysts expect nearly 30% year-over-year earnings growth for the S&P 500, according to consensus estimates compiled by FactSet. That forecast is up from 26.7% on June 30th.\n\nTech, of course, is the critical sector, accounting for 40% of the S&P 500. That would be a worry if profit estimates were falling, but they're going in the opposite direction. Estimated EPS growth for the tech sector has increased to 65% today from 57% on June 30, thanks partly to upward revisions for Nvidia and Micron Technology , FactSet notes.\n\nIndeed, strong results from AI chipmakers and other big tech names have eased some of the consternation about the cycle topping out. Micron delivered a knockout quarter, a positive sign for broader AI chip demand. On the consumer side, Meta Platforms' launch of its Muse agent has set off an arms race to capture AI-enabled consumer e-commerce.\n\nCritically, earnings growth is broadening beyond the Mag-7. While those companies are expected to notch an average 20% growth, the other 493 stocks in the S&P 500 are forecast to deliver 27% year-over-year gains, according to Russell Investments .\n\nProfit growth also looks healthy below the large-cap surface. S&P 400 MidCap operating earnings should rise 19% in 2026, notes economist Ed Yardeni, head of Yardeni Research.", "source": "CNBC Top News", "pub_date_str": "07 Oct 2026, 11:49 PM IST", "pub_date_relative": "1h ago"}, {"title": "China\u2019s \u2018Self-Reliance\u2019 Drive Is Upending Trade With Europe - The New York Times", "full_content": "China\u2019s \u2018Self-Reliance\u2019 Drive Is Upending Trade With Europe The New York Times Europe's Industrial Real Estate Is Being Reshaped, And Belgium Is Part Of The Story Cushman & Wakefield FO Live: German Economy Now Faces the China Challenge: What Lies Ahead? Fair Observer Executive Roundtable: What Lies Ahead for Europe-China Relations Asia Society 7/10 'Chinese exports are flooding global markets and putting pressure on European markets' Interior Daily", "source": "Google News Business", "pub_date_str": "07 Oct 2026, 11:45 PM IST", "pub_date_relative": "1h ago"}, {"title": "Lakhpati Didi scheme boosts household income: IIM Study", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Indicators \u203a Lakhpati Didi scheme boosts household income: IIM Study The Economic Times daily newspaper is available online now. Read Today's Paper Lakhpati Didi scheme boosts household income: IIM Study SECTIONS Lakhpati Didi scheme boosts household income: IIM Study By Anoushka Sawhney , ET Bureau Last Updated: Oct 07, 2026, 11:44:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Lakhpati Didi initiative, launched in 2023, aims to enhance women's income and savings in India. Recent studies indicate that household income has increased by 61% since the program's inception. Notably, the number of women-led enterprises has surged by 48% within a year.\n\nThe NBFC saga - Part 1: How RBI moved from protecting depositors to policing systemic risk\n\nBritannia\u2019s next big bet for young India lies beyond biscuits\n\nThe world is witnessing a bond rout. Why should it matter to you?\n\nQ2 earnings season: Will it settle or add to confusion in the stock market?\n\nHow Sebi busted Growpital\u2019s \u2018assured\u2019 returns, LLPs and money trail\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers", "source": "Economic Times Economy", "pub_date_str": "07 Oct 2026, 11:44 PM IST", "pub_date_relative": "1h ago"}, {"title": "Stock market today: Dow falls, S&P 500 and Nasdaq retreat from records as Treasury yields hit 24-year high - Yahoo Finance", "full_content": "Stock market today: Dow falls, S&P 500 and Nasdaq retreat from records as Treasury yields hit 24-year high Yahoo Finance Stock Market Today: Dow Opens Lower, Treasury Yields Hit Fresh 24-Year Highs \u2014 Live Updates WSJ S&P 500, Nasdaq retreat from record highs as yields and oil climb Reuters U.S. stocks cut losses as oil turns lower, yields pare gains on strong auction Investing.com Dow falls 300 points, S&P 500 retreats from record as high yields spook investors: Live updates CNBC", "source": "Google News Business", "pub_date_str": "07 Oct 2026, 11:43 PM IST", "pub_date_relative": "1h ago"}, {"title": "Growth hinges on local reforms, not protectionism: Indermit Gill", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a Growth hinges on local reforms, not protectionism: Indermit Gill The Economic Times daily newspaper is available online now. Read Today's Paper Growth hinges on local reforms, not protectionism: Indermit Gill SECTIONS Growth hinges on local reforms, not protectionism: Indermit Gill By Anoushka Sawhney , ET Bureau Last Updated: Oct 07, 2026, 11:43:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The country has strong domestic consumption, relatively low private-sector debt and favourable demographics, along with rapidly expanding digital and physical infrastructure. But the growth opportunity is conditional: The transition should be driven by domestic reforms rather than protectionism, Gill, a former chief economist and senior vice president for development economics at the World Bank Group, said in an interview with ET in New Delhi.\n\nThe NBFC saga - Part 1: How RBI moved from protecting depositors to policing systemic risk\n\nBritannia\u2019s next big bet for young India lies beyond biscuits\n\nThe world is witnessing a bond rout. Why should it matter to you?\n\nQ2 earnings season: Will it settle or add to confusion in the stock market?\n\nHow Sebi busted Growpital\u2019s \u2018assured\u2019 returns, LLPs and money trail\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers", "source": "Economic Times Economy", "pub_date_str": "07 Oct 2026, 11:43 PM IST", "pub_date_relative": "1h ago"}, {"title": "IndiGo Patna-Lucknow Flight Hit By Lightning Mid-Air, Nose Damaged; Lands Safely", "full_content": "The plane, which was carrying 104 passengers and six crew members, landed safely eight minutes ahead of schedule. All passengers and crew are safe.", "source": "NDTV Profit", "pub_date_str": "07 Oct 2026, 11:42 PM IST", "pub_date_relative": "1h ago"}, {"title": "SpaceX credit risk jumps on worries over its borrowing spree", "full_content": "Leap in credit default swaps tracking Elon Musk\u2019s aerospace group follows an FT report that it is seeking to raise $40bn to buy Nvidia chips", "source": "FT Markets", "pub_date_str": "07 Oct 2026, 11:35 PM IST", "pub_date_relative": "1h ago"}, {"title": "Punjab National Bank, Indian Bank raise lending rates after RBI repo rate hike \u2014 Here's what this means for customers\u2026", "full_content": "Hours after the Reserve Bank of India hiked its benchmark policy repo rate by 25 basis points (bps) to 5.50% on 7 October, a number of banks are increasing their lending rates from Thursday, according to a PTI report.\n\nAmong banks who increased lending rates include the Punjab National Bank (PNB), Indian Bank, Bank of Baroda (BoB), Bank of India (BoI), Indian Overseas Bank (IOB) and Tamilnad Mercantile Bank, the report added.\n\nNotably, the central bank made its first rate increase in four years, since 2023, by hiking interest rates by 25 bps from 5.25% to 5.50% today and RBI Governor Sanjay Malhotra signalled that further hikes could follow as rising inflation, and a weakening currency prompt a policy pivot, it said.\n\nThe RBI's six-member Monetary Policy Committee ( MPC ) voted unanimously to raise the repo rate, the first such increase since Malhotra took charge in December 2024. The rate hike was expected, but the central bank surprised watchers by shifting its stance towards \u201ccalibrated tightening\u201d, effectively ruling out a rate cut in the near term, it added.\n\nNotably, with banks increasing their lending rates, this is expected to make loans more expensive for customers.\n\nOther lenders are expected to announce an increase in their benchmark lending rate in line with RBI's decision.\n\n\u201cThe impact will be quicker for borrowers with floating-rate home loans linked to external benchmarks such as the repo rate. Existing borrowers should check their loan's benchmark and reset frequency to understand when the rate hike could affect their repayments,\u201d said Santosh Agarwal, CEO, Paisabazaar.\n\nFor borrowers whose tenure is extended, the monthly outgo may remain stable, but the longer repayment period can increase the overall interest cost.", "source": "LiveMint Money", "pub_date_str": "07 Oct 2026, 11:33 PM IST", "pub_date_relative": "1h ago"}, {"title": "Minutes of the Federal Open Market Committee, September 15-16, 2026", "full_content": "Official websites use .gov A .gov website belongs to an official government organization in the United States.\n\nSecure .gov websites use HTTPS A lock ( Lock Locked padlock icon ) or https:// means you've safely connected to the .gov website. Share sensitive information only on official, secure websites.\n\nFor release at 2:00 p.m. EDT Share --> --> --> --> --> --> The Federal Reserve on Wednesday released the minutes of the Federal Open Market Committee meeting that was held on September 15\u00e2\u0080\u009316, 2026.\n\nThe minutes for each regularly scheduled meeting of the Committee are generally published three weeks after the day of the policy decision. The descriptions of economic and financial conditions contained in these minutes are based solely on the information that was available to the Committee at the time of the meeting.\n\nFor media inquiries, e-mail [email protected] or call 202-452-2955.\n\nMinutes of Federal Open Market Committee September 15\u00e2\u0080\u009316, 2026: HTML | PDF", "source": "Federal Reserve", "pub_date_str": "07 Oct 2026, 11:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "Tata Aeris CNG Mileage: Can It Really Give 39 Km/kg? Check Official Mileage Stats", "full_content": "The latest Tata Aeris CNG delivers an ARAI-certified fuel efficiency of 27.8 km/kg", "source": "NDTV Profit", "pub_date_str": "07 Oct 2026, 11:27 PM IST", "pub_date_relative": "1h ago"}, {"title": "Euro Nears 17-Month Low As Dollar Strengthens Ahead Of US Fed Minutes", "full_content": "The euro slid towards a 17-month low as French fiscal worries weighed on sentiment, while the dollar strengthened ahead of the US Fed's September meeting minutes.", "source": "NDTV Profit", "pub_date_str": "07 Oct 2026, 11:20 PM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "Oil prices fall as IEA members agree to prioritize release of diesel stocks", "full_content": "Crude oil prices fell Wednesday after the International Energy Agency's member states agreed to prioritize the release of diesel stocks in an effort to address surging fuel prices.\n\nBrent crude futures, the international benchmark, lost 38 cents to close at $100.20 a barrel. U.S. West Texas Intermediate futures fell $1.16 to settle at $88.28 per barrel.\n\nIEA members agreed to support \"the prioritisation of the release of diesel stocks, to the extent possible, given the current tightness in diesel markets,\" the organization's director Fatih Birol said in a statement.\n\nIEA members have deployed about 325 million barrels of oil under the March emergency action plan to address the supply disruption triggered by the Iran war, Birol said. This leaves about 100 million barrels that have not been released under the March plan, Birol said.\n\nThe member states still have emergency stocks equivalent to 1.1 billion barrels including more than 200 million barrels of diesel, Birol said. The IEA is \"ready to release more of these stocks to the market if and when required,\" he said.\n\nThe IEA meeting and statement comes after the G7 nations agreed Friday to release diesel stocks under pressure from the Trump administration. It is still unclear, however, how much diesel will be deployed.\n\nBrent Oil prices were higher earlier in the session after Iran-backed Houthi militants in Yemen launched fresh strikes on Saudi Arabia, raising concerns that the rebound of oil exports from the Middle East is vulnerable.\n\nOil pumped through the East-West pipeline had reached 5.8 million barrels as of Tuesday morning, according to Saudi Energy Minister Prince Abdulaziz bin Salman. It was closed in early September after sustaining damage in a drone attack.", "source": "CNBC Top News", "pub_date_str": "08 Oct 2026, 12:47 AM IST", "pub_date_relative": "8m ago", "cfa_topics": ["Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Modelo owner Constellation is getting creative to bring back beer drinkers as overall demand weakens", "full_content": "Constellation Brands beat quarterly earnings and revenue expectations as its beer brands gained market share, but continued consumer caution tempered results.\n\nAs it navigates high food and fuel prices and choosy shoppers, Constellation is turning to special occasions and diversification to help drive sales.\n\nThe maker of Modelo Especial, Corona and Pacifico on Tuesday reported fiscal second-quarter adjusted earnings of $3.74 per share on $2.63 billion in revenue, ahead of Wall Street estimates of $3.56 and $2.54 billion, respectively.\n\nBeer revenue rose 5% to roughly $2.47 billion, while beer shipments increased 5.5%. However, the company said beer depletions, a measure of sales from distributors to retailers and other customers, declined slightly during the quarter, indicating consumer demand was softer than shipment growth suggests.\n\n\"We have spent much of the first half rebuilding distributor inventory levels,\" said Constellation Brands CEO Nicholas Fink on the company's earnings call on Wednesday. \"While there is always going to be month-to-month variability, September depletions are trending in the right direction.\"\n\nThe broader backdrop remains challenging for beer sellers. U.S. beer sales fell 1.8% year over year in the two weeks ended Sept. 19, according to Nielsen's latest data.\n\nStill, Fink said September beer depletions improved even beyond the benefit of a later Labor Day, and that the recovery was broad-based across channels. He said consumers were \"across the board\" engaging in the category.\n\nSome analysts said the results indicated elevated gas prices have dampened Constellation's performance.", "source": "CNBC Top News", "pub_date_str": "08 Oct 2026, 12:44 AM IST", "pub_date_relative": "11m ago", "cfa_topics": ["Financial Statement Analysis", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Trump\u2019s diesel order exposes White House limits to counter surging fuel prices", "full_content": "Truckers likely won't see much in the way of relief from President Donald Trump's executive order that allows them to use off-road diesel fuel on America's highways without federal penalties, analysts say.\n\nOff-road diesel is exempt from federal and state excise taxes because it is used for construction and farm equipment, railways and to heat homes. It is dyed red to differentiate it from taxed on-road diesel, but is otherwise the same fuel.\n\nThe federal government charges an excise tax of 24.4 cents per gallon for on-road diesel. In theory, Trump's order spares truckers the tax by allowing them to use red-dyed fuel on the highway, without worrying that the federal government will impose penalties.\n\nBut the president's action only defers the actual tax payment itself until the end of the year, while calling on the Treasury secretary to look for ways to eliminate the deferred obligation altogether.\n\n\"While it might be deferred, it may not disappear entirely,\" said Andy Lipow, president of Lipow Oil Associates. \"Maybe you save a little bit of money up front, but you might have to pay it to the government later.\"\n\nTreasury is preparing guidance to provide \"clarity on the obligations for users and sellers of dyed diesel,\" a White House official told CNBC on condition of anonymity.\n\nTreasury has enforcement discretion, the official said. The Internal Revenue Service will only enforce the deferred tax liability if it is directed to do so by the Treasury secretary and the president, the official said.\n\nThe IRS will soon make a determination on \"whether dedicating its limited resources to fuel tank inspections and fuel sampling investigations represents the best use\" of its resources, the official said.", "source": "CNBC Top News", "pub_date_str": "08 Oct 2026, 12:41 AM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Quantitative Methods", "Financial Statement Analysis", "Fixed Income"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "Former star US bond manager Leech fined by SEC, following guilty plea in \u2019cherry-picking\u2019 case", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Oct 2026, 12:38 AM IST", "pub_date_relative": "17m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "US FCC to vote to ban Chinese labs from testing US electronics", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Oct 2026, 12:36 AM IST", "pub_date_relative": "18m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Oil prices settle down as IEA agrees to accelerate oil stock release", "full_content": "HOUSTON, - Oil prices settled lower on Wednesday following a choppy session after the International Energy Agency agreed to speed up a release of oil stocks and prioritize diesel in a bid to curb record-high fuel prices as the Iran war squeezes global supplies.\n\nBrent crude futures settled down 38 cents, or 0.38%, at $100.20 a barrel. US West Texas Intermediate crude futures settled down $1.16, or 1.3%, to $88.28.\n\nThe IEA said completing previously announced releases as quickly as possible could bring around 100 million barrels to market, although analysts and some governments said the figure did not necessarily represent a fresh intervention of that size.\n\nFrance will release 10 million barrels of diesel from its strategic stocks, Franceinfo radio reported on Wednesday, citing unnamed sources.\n\n\"Europe is ground zero for this whole supply crunch ... and the releases address that and some of the heat off the need for WTI to a degree. This should reduce some of the pressure on US supplies,\" said John Kilduff, partner at Again Capital.\n\nMeanwhile, US crude stocks and distillate inventories fell while gasoline stocks rose last week, the Energy Information Administration said. [EIA/S]\n\nCrude inventories fell by 3.2 million barrels to 424.1 million barrels in the week ended October 2, the EIA said, compared with analysts' expectations in a Reuters poll for a 1.7 million-barrel rise.\n\nInvestors are not convinced that recent rises in supply and exports from the Middle East are sustainable, PVM analyst Tamas Varga said, adding prices also drew support from the approaching US storm and the continuing conflicts in the Middle East and Ukraine.", "source": "LiveMint Markets", "pub_date_str": "08 Oct 2026, 12:34 AM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "AbbVie options flow shows 4:1 call-to-put ratio as stock rises", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Oct 2026, 12:29 AM IST", "pub_date_relative": "25m ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Microsoft to sell $2,599 Surface Laptop Ultra containing Nvidia AI chip", "full_content": "Microsoft said its new laptop containing an Nvidia AI chip will start at $2,599, as the software maker tries to bring more artificial intelligence capabilities to its consumer devices.\n\nThe Surface Laptop Ultra is now available on preorder and will begin shipping on Oct. 16, Pavan Davuluri, Microsoft's executive vice president of Windows and devices, said at a company event in San Francisco on Wednesday. The computer has the world's first magnetic USB-C port, similar to Apple's MagSafe charging connector, along with two other standard USB-C ports, Microsoft said in a blog post .\n\nWhile Microsoft Windows is the most popular operating system for PCs, the company isn't among the top six PC vendors in terms of unit shipments, according to an estimate from researcher Gartner. As the AI boom matures and chip technology advances, tech giants including Microsoft, Apple and Google are aiming to allow users to run more AI workloads from their devices rather than relying on the cloud.\n\nUsers can install and run a variety of models on the new laptop without having to worry about racking up high monthly bills. Microsoft first talked about the Surface Laptop Ultra in May, but is just now providing specifics.\n\n\"Microsoft might get me back to Windows,\" Max Weinbach, an analyst at Creative Strategies, wrote on X after the announcement.\n\nDavuluri also said that Meta will introduce a version of its popular Muse AI agent for Windows, capitalizing on the surging popularity of the personal agent, which has jumped to the top of Apple's App store, surpassing ChatGPT.\n\nMicrosoft is still trying to solidify its role as a key player in AI. The company offers its own AI models, but they're less popular than leading models from OpenAI and Anthropic and aren't at the forefront in terms of performance, according to one benchmark .", "source": "CNBC World Economy", "pub_date_str": "08 Oct 2026, 12:25 AM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "US Fed minutes show members backing another rate hike before year-end", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a US Fed minutes signal another rate hike by year-end as inflation stays high Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US Fed minutes signal another rate hike by year-end as inflation stays high SECTIONS US Fed minutes signal another rate hike by year-end as inflation stays high ETMarkets.com Last Updated: Oct 08, 2026, 12:42:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis According to the latest minutes from the US Federal Reserve, officials hint at a possible interest rate rise by year's end in response to ongoing inflation challenges. With inflation reaching a high of 7.2% in June 2022, fluctuations have continued amid worries over geopolitical events and escalating energy costs. The Fed faces the complex task of controlling inflation while ensuring stable employment within the economy.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "08 Oct 2026, 12:23 AM IST", "pub_date_relative": "31m ago", "cfa_topics": ["Economics", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Glaukos options flow shows bearish hedge as GKOS rallies 6.6%", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Oct 2026, 12:23 AM IST", "pub_date_relative": "31m ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Sunrun options activity dominated by a single two-leg structure", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Oct 2026, 12:20 AM IST", "pub_date_relative": "34m ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Supertanker chartered from Gulf Coast to China for $76 million, 10 times higher than pre-war level", "full_content": "(Subscribe to Brian Sullivan's \"Power Insider\" newsletter here .)\n\nA supertanker was recently chartered to sail from the U.S. Gulf Coast to China for $76 million, a source familiar told CNBC, as shipping costs soar globally due to the crisis in the Middle East.\n\nThe Alexandros was chartered by the trading firm Trafigura and is expected to load around Nov. 19, the source said. A normal rate for the route based on pre-war levels would be $7 million to $10 million.\n\nThe cost of the journey comes to $38 per barrel of oil assuming the tanker holds 2 million barrels. Shipping costs have exploded as the war in the Persian Gulf has led to a shortage of available tankers.\n\nBrent crude oil, YTD The Middle East producers are using a shuttle system to export oil through the Strait of Hormuz. A loaded tanker crosses the strait and then loads the oil onto another ship in the Gulf of Oman that takes the cargo to Asia. This system reduces the exposure to Iranian attack and has led to a rebound of crude exports through Hormuz. But it also requires a lot more ships to get the oil out of the Gulf.", "source": "CNBC Top News", "pub_date_str": "08 Oct 2026, 12:20 AM IST", "pub_date_relative": "34m ago", "cfa_topics": ["Economics", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "10-year Treasury yield backs off from 24-year high after solid bond auction eases demand fears", "full_content": "U.S. Treasury yields came off their highs after a solid sale of 10-year notes. Earlier, the 10-year yield rose to its highest level in more than two decades.\n\nThe 10-year Treasury last traded around 3 basis points higher at 5.288%. Earlier in the session, it reached 5.35%, its highest level since 2002. The 30-year Treasury bond yield also traded below a 24-year high, at 5.67%.\n\nOne basis point equals 0.01%, and yields and prices move in opposite directions.\n\nThe Treasury sold $39 billion of 10-year notes in an auction on Wednesday. According to BMO, the sale was \"strong\", with higher than average bidding from non-dealers.\n\nIndirect bidders, which include global central banks, took 80.3% of the auction \u2014 above a 10-auction average of 72.4%. Direct bidders, scooped up 17.1% of the sale, just below an average of 18.3%. Dealers, meanwhile, bought just 2.5% of the notes offered, well below a 9.4% mean.\n\n\"The 24-year highs in rates brought out the buyers and resulted in a great auction,\" said Peter Boockvar, market strategist and author of The Boock Report.\n\nNonetheless, it still was the highest auction yield since 2000 at 5.3%.\n\nThis was the second of three Treasury Department sales this week. The government sold $58 billion in 3-year notes on Tuesday and is scheduled to sell $22 billion 30-year bonds on Thursday.", "source": "CNBC Top News", "pub_date_str": "08 Oct 2026, 12:17 AM IST", "pub_date_relative": "37m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Strange market anomaly is creating a buying opportunity in the Nasdaq 100", "full_content": "The Nasdaq-100 Index continues its historic run. Total returns (appreciation plus dividends) topped 24% year-to-date, and the index has nearly tripled, up 193.37% since the end of 2022 (again with dividends reinvested). If you're suffering from a mix of FOMO and vertigo from the steep price appreciation, read on.\n\nOne notable feature of this rally has been \"low breadth\". It's the same group of mega-cap tech titans doing the vast majority of the heavy lifting in the index overall. The top 10 largest companies in the NDX Index comprise half its weight by market capitalization.\n\nNarrow leadership means the market's strength relies on a small, undiversified group of companies. For investors looking to play continued strength while reducing the risk of that same narrow group suddenly reversing, the options market may offer an answer. A way to go long tech with strictly defined risk.\n\nThe secret to this is a little wonky; it's called \"implied correlation\", but bear with me, it's worth it. Implied correlation is an adjunct to implied volatility - how options traders think of options prices. When implied correlation of an index is low, the prices of options on that index, at least relative ot the price of options on the individual stocks, are low. Think about that for a second: a handful of stocks are driving index returns, yet options on the index behave as if the index is well diversified, suggesting little risk that the same narrow path forward might suddenly double back on itself.\n\nRight now, the 1-month forward-looking implied correlation for the NDX sits at just 0.177. To put that in perspective, we are hovering in the 25th percentile\u2014far closer to the three-year low of 0.128 than the three-year high of 0.567. Meanwhile, 1-month trailing realized correlation is currently 0.158. One more consideration.", "source": "CNBC Top News", "pub_date_str": "08 Oct 2026, 12:14 AM IST", "pub_date_relative": "40m ago", "cfa_topics": ["Quantitative Methods", "Equity Investments", "Derivatives", "Portfolio Management"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "Airfare is 23% higher than last year. Is now a good time to use points for flights?", "full_content": "Terms apply to American Express benefits and offers. Visit americanexpress.com to learn more.\n\nIf you're planning to fly home for the holidays, you'll pay more this year compared to last year.\n\nRising fuel prices and strong demand have contributed to airfare soaring 23.4% above last year's prices, according to consumer price index data released in September.\n\nThis begs the question: Is now the best time to use credit card rewards for flights?\n\nAirlines may have fixed or dynamic prices for award flights, so you could get more value for your miles \u2014 or you could end up paying more miles than before.\n\nRegardless of what's happening with ticket prices, it's always a good idea to use your miles and points regularly. Rewards are subject to inflation through consistent devaluations, so in that sense, now is always the best time to use your credit card and loyalty rewards.\n\nSenior reporter Jason Stauffer can answer your questions about how to make the most of your credit cards in his weekly Points Pro column. Submit yours here .\n\nMany international airline loyalty programs feature fixed award prices based on zones or the distance traveled. Even if you're not planning to visit a European Christmas market this holiday season, these programs can be valuable for booking domestic travel .", "source": "CNBC Top News", "pub_date_str": "08 Oct 2026, 12:12 AM IST", "pub_date_relative": "42m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Fed officials see another hike coming, but no sign as to when, minutes show", "full_content": "Federal Reserve officials expect they will raise interest rates again before the end of the year to head off inflation that has run above target for more than five years, according to meeting minutes released Wednesday. But the meeting summary provided no indication of when specifically policymakers expected to raise benchmark rates \u2013 only that persistently higher prices and a stable labor market likely would lead to a second hike this year. The Fed next decides on rates on Oct. 28 and then again on Dec. 9. \"With regard to the outlook for monetary policy beyond the current meeting, most participants assessed that another increase in the target range for the federal funds rate would likely be appropriate by year end,\" the document stated. That position came with a note of caution. \"Participants emphasized, however, that they approached each meeting with an open mind and decisions at future meetings would depend on incoming information and its implications for the outlook and the balance of risks,\" the minutes said. Coming off the meeting, which featured tough inflation talk from Chairman Kevin Warsh during his subsequent news conference, markets started betting the Fed would follow the Sept. 16 hike with another move at the late October meeting. However, recent inflation data and comments from leading Fed officials indicate that at least for October, another increase is unlikely. The Fed's preferred gauge \u2013 the personal consumption expenditures price index \u2013 showed core inflation at 3% for August and headline at 3.4%. While both readings were still well north of the central bank's 2% target, they were considerably lower than expectations, benefiting in part from changes in the way some of the inputs are calculated. Discussion at the September meeting showed officials see risks that inflation will prove sticky, while the labor market is \"close to maximum employment\" and economic growth overall has picked up.", "source": "CNBC Finance", "pub_date_str": "08 Oct 2026, 12:12 AM IST", "pub_date_relative": "42m ago", "cfa_topics": ["Economics", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Micron Stock Rebounds Despite Memory Plant Threat - Barron's", "full_content": "Micron Stock Rebounds Despite Memory Plant Threat Barron's MU Stock Adds 3% As D.A. Davidson Forecasts Stock Value To Triple On Valuation Play Yahoo Finance Micron: The Memory Cycle Is Approaching Its Peak (NASDAQ:MU) Seeking Alpha Micron\u2019s ridiculously cheap stock could triple from here, according to this analyst\u2019s math MarketWatch Micron Stock Is Waiting On One Answer Trefis", "source": "Google News Business", "pub_date_str": "08 Oct 2026, 12:07 AM IST", "pub_date_relative": "48m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Stocks are increasingly their own best hedge. This chart shows why.", "full_content": "For decades, investors concerned about stocks sought succor in the bond market. But these days, the best shield against an outbreak of volatility might just be owning other stocks.", "source": "MarketWatch Top Stories", "pub_date_str": "08 Oct 2026, 12:01 AM IST", "pub_date_relative": "54m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Gold prices drop over 2%, slide to 2-month low as Treasury yields, US dollar climb", "full_content": "Gold prices came under renewed selling pressure in Wednesday\u2019s trade, with spot prices falling to a two-month low, pressured by rising Treasury yields, which continued to hover at multi-decade highs, while a strengthening US dollar also weighed on the bullion.\n\nSpot gold fell 2.3% to reach an intraday low of $4,066 per ounce , its lowest level since August 5. The US dollar index climbed 0.5%, making greenback-denominated gold more expensive for holders of other currencies, while 10-year US Treasury yields were at an over two-decade high.\n\nThe 10-year Treasury yield last traded around 1 basis point higher at 5.282%. Earlier in the session, it reached 5.35%, its highest level since 2002 . The 30-year Treasury bond yield also traded just below a 24-year high, at 5.655%.\n\nInvestors are demanding greater compensation to hold global bonds as concerns about persistent inflation, government spending, and surging corporate borrowing to finance the artificial intelligence buildout intensify.\n\nThat sense of unease is being compounded by France\u2019s fiscal woes, which are threatening to drag the European Central Bank into the kind of face-off with markets it hasn\u2019t seen since the euro area\u2019s debt crisis more than a decade ago.\n\nAmericans\u2019 short-term inflation expectations jumped last month, while sentiment toward the labor market improved, according to a Federal Reserve Bank of New York survey.\n\nMarkets are largely expecting the Fed to keep interest rates on hold later this month but are still pricing in an 84% chance of a December increase, according to CME\u2019s FedWatch tool.\n\nKansas City Fed President Jeff Schmid said curbing inflation may require further rate hikes. San Francisco Fed President Mary Daly also said the policy path would depend on whether inflationary pressures continue.", "source": "LiveMint Markets", "pub_date_str": "07 Oct 2026, 11:59 PM IST", "pub_date_relative": "55m ago", "cfa_topics": ["Economics", "Fixed Income", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "US government bonds steady after strong 10-year Treasury auction", "full_content": "French, Italian and UK government bonds under pressure in volatile trading", "source": "FT Markets", "pub_date_str": "07 Oct 2026, 11:58 PM IST", "pub_date_relative": "57m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Fed\u2019s minutes show no appetite for a series of interest-rate hikes", "full_content": "September\u2019s rate hike was viewed by many officials as needed just in case inflation remains sticky.", "source": "MarketWatch Top Stories", "pub_date_str": "07 Oct 2026, 11:58 PM IST", "pub_date_relative": "57m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Foreign investors pull out $26.3 billion from emerging markets in September as hawkish Fed pushes US Treasury yields higher", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a Foreign investors pull out $26.3 billion from emerging markets in September as hawkish Fed pushes US Treasury yields higher Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Foreign investors pull out $26.3 billion from emerging markets in September as hawkish Fed pushes US Treasury yields higher SECTIONS Foreign investors pull out $26.3 billion from emerging markets in September as hawkish Fed pushes US Treasury yields higher ETMarkets.com Last Updated: Oct 07, 2026, 11:56:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Foreign investors pulled $26.3 billion from emerging-market stocks and bonds in September due to rising US yields. The hawkish Federal Reserve's interest rate hike influenced this first outflow since June. Additionally, heavy foreign selling in South Korea resulted in a significant decrease in emerging-market equities. While fixed-income assets attracted $246 billion this year, equities saw year-to-date outflows of $113.9 billion.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "07 Oct 2026, 11:56 PM IST", "pub_date_relative": "58m ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Americans grow more pessimistic about their finances, New York Fed finds \u2014 expert warns of \u2018tough choices\u2019 ahead", "full_content": "Americans are increasingly worried about their financial outlook amid expectations that inflation could worsen in the year ahead, according to a New York Federal Reserve survey released Wednesday.\n\nThe central bank's monthly Survey of Consumer Expectations found that consumers expect inflation to be even higher a year from now, while perceptions about their own financial standing deteriorated.\n\nMore households surveyed reported they were in a worse financial situation than a year ago and expected to be in a weaker financial state in the coming year, the New York Fed found. The New York Fed's Survey of Consumer Expectations polls a rotating panel of approximately 1,300 households.\n\n\"This data is just further proof that Americans are worried about inflation getting worse before it gets better,\" said Matt Schulz, chief credit analyst at LendingTree.\n\n\"Many Americans are already living on tight budgets and looking for ways to stretch their dollars further,\" he said. \"Their glum outlook on inflation likely means that many families expect to make some sacrifices and tough choices in the months to come.\"\n\nConsumers are feeling the pinch of higher prices for necessities like gasoline, other reports also show.\n\nGas prices were up nearly 4% in the month of August and more than 27% from August 2025, according to the latest consumer price index . Consumers paid a national average of $4.37 per gallon as of Wednesday, according to AAA \u2014 up from about $3.12 a year ago.\n\nElevated fuel costs threaten to push up costs for other consumer goods as well, at a time when Americans remain concerned about affordability and are widely dissatisfied with high prices, economists say.", "source": "CNBC Top News", "pub_date_str": "07 Oct 2026, 11:54 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "At Least 24 Dead As Russian Barrage Pounds Ukraine; Zelenskyy Denounces 'Vile' Strikes", "full_content": "Russia launched a massive overnight barrage of missiles and drones across Ukraine, killing at least 24 people, including four children, and damaging homes and critical infrastructure.", "source": "NDTV Profit", "pub_date_str": "07 Oct 2026, 11:53 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Government to review fixed costs for urea plants, subsidy payouts may change", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Agriculture \u203a Government to review fixed costs for urea plants, subsidy payouts may change The Economic Times daily newspaper is available online now. Read Today's Paper Government to review fixed costs for urea plants, subsidy payouts may change SECTIONS Government to review fixed costs for urea plants, subsidy payouts may change By Shambhavi Anand , ET Bureau Last Updated: Oct 07, 2026, 11:51:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis In response to rising production costs, the government is launching in April-September from 2.25 billion in the year-ago period. Toll revenue rose 6.27% to Rs 42,971.82 crore from Rs 40,433.53 crore in the same period of 2025-26, a much slower pace of growth than in previous years.\n\nThe NBFC saga - Part 1: How RBI moved from protecting depositors to policing systemic risk\n\nBritannia\u2019s next big bet for young India lies beyond biscuits\n\nThe world is witnessing a bond rout. Why should it matter to you?\n\nQ2 earnings season: Will it settle or add to confusion in the stock market?\n\nHow Sebi busted Growpital\u2019s \u2018assured\u2019 returns, LLPs and money trail\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers", "source": "Economic Times Economy", "pub_date_str": "07 Oct 2026, 11:49 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Fixed Income", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Here comes third-quarter earnings season. Booming profits could propel the S&P 500 to new heights", "full_content": "Third-quarter earnings season kicks off this week and as results roll in they should reveal what the market is eagerly anticipating: another blockbuster quarter for S&P 500 profits.\n\nThe market closed at record highs Tuesday as investors bet that AI capex \u2014 a major force for the markets and economy \u2014 won't be derailed by higher bond yields. Assuming upbeat guidance from key companies \u2014 along with a little help on the bond side \u2014 earnings could propel stocks to a strong finish for the year.\n\nAt the index level, profit growth should be stellar. Analysts expect nearly 30% year-over-year earnings growth for the S&P 500, according to consensus estimates compiled by FactSet. That forecast is up from 26.7% on June 30th.\n\nTech, of course, is the critical sector, accounting for 40% of the S&P 500. That would be a worry if profit estimates were falling, but they're going in the opposite direction. Estimated EPS growth for the tech sector has increased to 65% today from 57% on June 30, thanks partly to upward revisions for Nvidia and Micron Technology , FactSet notes.\n\nIndeed, strong results from AI chipmakers and other big tech names have eased some of the consternation about the cycle topping out. Micron delivered a knockout quarter, a positive sign for broader AI chip demand. On the consumer side, Meta Platforms' launch of its Muse agent has set off an arms race to capture AI-enabled consumer e-commerce.\n\nCritically, earnings growth is broadening beyond the Mag-7. While those companies are expected to notch an average 20% growth, the other 493 stocks in the S&P 500 are forecast to deliver 27% year-over-year gains, according to Russell Investments .\n\nProfit growth also looks healthy below the large-cap surface. S&P 400 MidCap operating earnings should rise 19% in 2026, notes economist Ed Yardeni, head of Yardeni Research.", "source": "CNBC Top News", "pub_date_str": "07 Oct 2026, 11:49 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Fixed Income"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Lakhpati Didi scheme boosts household income: IIM Study", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Indicators \u203a Lakhpati Didi scheme boosts household income: IIM Study The Economic Times daily newspaper is available online now. Read Today's Paper Lakhpati Didi scheme boosts household income: IIM Study SECTIONS Lakhpati Didi scheme boosts household income: IIM Study By Anoushka Sawhney , ET Bureau Last  PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Fixed Income"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Growth hinges on local reforms, not protectionism: Indermit Gill", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a Growth hinges on local reforms, not protectionism: Indermit Gill The Economic Times daily newspaper is available online now. Read Today's Paper Growth hinges on local reforms, not protectionism: Indermit Gill SECTIONS Growth hinges on local reforms, not protectionism: Indermit Gill By Anoushka Sawhney , ET Bureau Last Updated: Oct 07, 2026, 11:43:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The country has strong domestic consumption, relatively low private-sector debt and favourable demographics, along with rapidly expanding digital and physical infrastructure. But the growth opportunity is conditional: The transition should be driven by domestic reforms rather than protectionism, Gill, a former chief economist and senior vice president for development economics at the World Bank Group, said in an interview with ET in New Delhi.\n\nThe NBFC saga - Part 1: How RBI moved from protecting depositors to policing systemic risk\n\nBritannia\u2019s next big bet for young India lies beyond biscuits\n\nThe world is witnessing a bond rout. Why should it matter to you?\n\nQ2 earnings season: Will it settle or add to confusion in the stock market?\n\nHow Sebi busted Growpital\u2019s \u2018assured\u2019 returns, LLPs and money trail\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers", "source": "Economic Times Economy", "pub_date_str": "07 Oct 2026, 11:43 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Fixed Income", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "SpaceX credit risk jumps on worries over its borrowing spree", "full_content": "Leap in credit default swaps tracking Elon Musk\u2019s aerospace group follows an FT report that it is seeking to raise $40bn to buy Nvidia chips", "source": "FT Markets", "pub_date_str": "07 Oct 2026, 11:35 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Punjab National Bank, Indian Bank raise lending rates after RBI repo rate hike \u2014 Here's what this means for customers\u2026", "full_content": "Hours after the Reserve Bank of India hiked its benchmark policy repo rate by 25 basis points (bps) to 5.50% on 7 October, a number of banks are increasing their lending rates from Thursday, according to a PTI report.\n\nAmong banks who increased lending rates include the Punjab National Bank (PNB), Indian Bank, Bank of Baroda (BoB), Bank of India (BoI), Indian Overseas Bank (IOB) and Tamilnad Mercantile Bank, the report added.\n\nNotably, the central bank made its first rate increase in four years, since 2023, by hiking interest rates by 25 bps from 5.25% to 5.50% today and RBI Governor Sanjay Malhotra signalled that further hikes could follow as rising inflation, and a weakening currency prompt a policy pivot, it said.\n\nThe RBI's six-member Monetary Policy Committee ( MPC ) voted unanimously to raise the repo rate, the first such increase since Malhotra took charge in December 2024. The rate hike was expected, but the central bank surprised watchers by shifting its stance towards \u201ccalibrated tightening\u201d, effectively ruling out a rate cut in the near term, it added.\n\nNotably, with banks increasing their lending rates, this is expected to make loans more expensive for customers.\n\nOther lenders are expected to announce an increase in their benchmark lending rate in line with RBI's decision.\n\n\u201cThe impact will be quicker for borrowers with floating-rate home loans linked to external benchmarks such as the repo rate. Existing borrowers should check their loan's benchmark and reset frequency to understand when the rate hike could affect their repayments,\u201d said Santosh Agarwal, CEO, Paisabazaar.\n\nFor borrowers whose tenure is extended, the monthly outgo may remain stable, but the longer repayment period can increase the overall interest cost.", "source": "LiveMint Money", "pub_date_str": "07 Oct 2026, 11:33 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "India, UK seek deeper investment ties", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a India, UK seek deeper investment ties The Economic Times daily newspaper is available online now. Read Today's Paper India, UK seek deeper investment ties SECTIONS India, UK seek deeper investment ties ET Bureau Last Updated: Oct 07, 2026, 11:18:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The agreement was part of the joint statement adopted after the fourth UK-India Financial Markets Dialogue, held in London on September 29 , the finance ministry said.\n\nThe NBFC saga - Part 1: How RBI moved from protecting depositors to policing systemic risk\n\nBritannia\u2019s next big bet for young India lies beyond biscuits\n\nThe world is witnessing a bond rout. Why should it matter to you?\n\nQ2 earnings season: Will it settle or add to confusion in the stock market?\n\nHow Sebi busted Growpital\u2019s \u2018assured\u2019 returns, LLPs and money trail\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers", "source": "Economic Times Economy", "pub_date_str": "07 Oct 2026, 11:18 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Fixed Income"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Adani Enterprises: AEL gets highest-ever rating in its credit history; shares up over 22% YTD", "full_content": "Adani Enterprises on Wednesday said that its long-term rating has been upgraded to AA Stable, the highest-ever rating in its credit history. The company said the upgrade serves as an independent validation of AEL\u2019s disciplined capital management and tight fiscal prudence.\n\n\u201cAEL has constantly strengthened its credit profile over the last seven years while executing an ever-increasing core infrastructure-led capex. AEL\u2019s stronger credit profile further enhances the resilience of its unique incubation platform and assures long-term value for its stakeholders.\u201d\n\nAccording to the regulatory filing, CARE Ratings has provided a credit rating update for various facilities and instruments of Adani Enterprises Limited. The rating on long-term bank facilities worth \u20b9 4,000 crore was upgraded from CARE AA- to Stable to CARE AA- Stable.\n\nAdditionally, the rating on long-term/short-term bank facilities worth \u20b9 16,505 crore was upgraded from CARE AA-Stable to CARE A1+ to CARE AA-Stable / CARE A1+, reflecting an upgrade in the long-term rating.\n\nSimilarly, the long-term ratings on Non-Convertible Debentures (NCDs) across three tranches of \u20b9 954.96 crore, \u20b9 2,000 crore, and \u20b9 3,000 crore were upgraded from CARE AA- to Stable. Meanwhile, the ratings on short-term bank facilities worth \u20b9 240 crore and commercial paper worth \u20b9 2,000 crore were reaffirmed at CARE A1+.\n\nIn the last six months, the stock has jumped 44%, compared with a nearly 1% decline in the benchmark Sensex. Year-to-date, it is up 22%, against a 14% decline in the Sensex.\n\nAdani Enterprises' share price hit a 52-week high of \u20b9 3,245 on 6 July, after hitting a 52-week low of \u20b9 1,753.45 on 30 March this year.", "source": "LiveMint Markets", "pub_date_str": "07 Oct 2026, 11:17 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Fixed Income", "Alternative Investments", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Global bond sell-off pushes U.S. Treasury yields to fresh 24-year highs - NBC News", "full_content": "Global bond sell-off pushes U.S. Treasury yields to fresh 24-year highs NBC News 10-year Treasury yield falls from 24-year high after solid bond auction eases demand fears CNBC US bonds selloff resumes as 10-year, 30-yields hit new 24-year high Reuters US government bonds steady after strong 10-year Treasury auction Financial Times U.S. Treasury Yields Hit New 24-Year Highs and French Bonds Underperform WSJ", "source": "Google News Business", "pub_date_str": "07 Oct 2026, 11:16 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Buy, Sell Or Hold: Siemens, Titan, Kalyan Jewellers, NALCO And HAL\u2014 Ask Profit", "full_content": "Market experts shared their insights on fundamentals and technical levels for key stocks, including", "source": "NDTV Profit", "pub_date_str": "07 Oct 2026, 11:14 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "PepsiCo\u2019s Turnaround Hits A Wall As GLP-1 Drugs Threaten Its Snack Business", "full_content": "The rise of weight-loss drugs is reshaping the packaged-food industry, prompting companies from Kraft Heinz to Conagra Brands to accelerate efforts to develop healthier, reformulated products.", "source": "NDTV Profit", "pub_date_str": "07 Oct 2026, 11:13 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Tropical Storm Isaias forecast to hit U.S. Gulf coast as hurricane early Saturday", "full_content": "Tropical Storm \u200bIsaias formed in \u200bthe Gulf of Mexico \u200bon Wednesday and is forecast to strengthen into a hurricane before slamming into the southern U.S. coast early on Saturday, the National Hurricane Center said.\n\nThe \u2060storm \u200cis forecast to pass through areas with \u2060significant offshore oil and gas production, along with onshore refining facilities, which could pressure inventories and already-high prices at the pump.\n\nAbout 11.2 million barrels of oil production could be \u200clost across the Gulf through the duration of the storm, a marked increase from the 7.1 million barrels impacted by Tropical \u200bStorm Bertha in July, according to a model forecast from consulting firm Earth Science Associates.\n\nThe NHC expects Isaias to develop into a hurricane by Thursday as it quickly picks up power \u2060over the warm Gulf waters before making landfall early Saturday, most likely somewhere along the \u200cMississippi, Alabama or Florida panhandle coast. The storm \u200cwas located about 500 miles south of the Louisiana coast early Wednesday.\n\nIsaias could produce isolated rainfall amounts of 10 inches across parts of the Gulf Coast, \u2060stretching from Louisiana to the Florida Panhandle, the NHC said in its \u2060latest bulletin.\n\nThe storm could also produce 3 inches \u2060or more of rain further inland, with the NHC warning that \"flash and urban flooding, along with isolated river flooding, will \u200bbe possible\" across the Southeast.\n\nIsaias is \u200cexpected to run into strong upper-level winds, known as vertical wind shear, in the final 24 hours before it reaches the northern Gulf Coast, which could weaken the storm.\n\nStill, the NHC says that it's \"looking more likely that Isaias will \u200bbe a significant hurricane when it \u200creaches the coast.\"", "source": "CNBC Top News", "pub_date_str": "07 Oct 2026, 11:10 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Export bonanza: How this Bengaluru farmer makes \u20b950,000 a day by growing baby bottle gourds for Qatar market", "full_content": "A Bengaluru farmer has found an unconventional market for baby bottle gourds, growing the vegetable to a specific size for overseas buyers and supplying the produce to Qatar through brokers.\n\nFarmer Karigowda, who owns a 3.5-acre farm in Karlapura Palya in Bengaluru Urban district, grows bottle gourds that weigh around 500 grams each. Unlike conventional bottle gourds, which are generally allowed to grow larger, his crop is harvested young to meet demand in overseas markets.\n\nIn an interview with 30Stades , Karigowda said he harvests around one tonne of baby bottle gourds a day during the September-to-December season and sells the produce at around \u20b9 50 per kg.\n\nAt a daily harvest of about one tonne, the farmer's reported sales work out to approximately \u20b9 50,000 a day.\n\nKarigowda explained, \u201cAt one tonne a day and \u20b9 50 a kg, the value of a day\u2019s harvest is around \u20b9 50,000 or about \u20b9 14 lakh to \u20b9 15 lakh a month. Brokers collect the produce and export it to Qatar. Baby bottle gourds have been very rewarding financially.\u201d\n\nOver a 90-day harvesting period, this would translate into around \u20b9 45 lakh in gross crop sales.\n\nHowever, the \u20b9 45 lakh figure represents gross revenue and not net profit. Expenses such as seeds, labour, fertilisers and other inputs, irrigation, cultivation, harvesting, packaging and other costs would need to be deducted to calculate the farmer's actual earnings.\n\nKarigowda said, \u201cThe arrival of technologies such as drip irrigation, mulching and improved farm machinery changed some of the possibilities. But I felt experimenting with different vegetable crops could improve revenues.\u201d", "source": "LiveMint Money", "pub_date_str": "07 Oct 2026, 11:07 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "One year later, here's what happened after EV tax credits died - USA Today", "full_content": "One year later, here's what happened after EV tax credits died USA Today Federal EV Tax Breaks Vanished, But Taxpayer Dollars Still Aid Charging Infrastructure Jalopnik A year after federal EV tax credits ended, a patchwork of state EV incentives remains Marketplace.org Fleet EV Buying Shifts as Sales Fall and Prices Ease Environment+Energy Leader The Prospects of an Electric Vehicle Future in the US Blur Further StreetInsider", "source": "Google News Business", "pub_date_str": "07 Oct 2026, 11:06 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Ola Electric Approves Rs 1,000 Crore Rights Issue; Fixes Issue Price At 26% Discount", "full_content": "Following the rights issue, Ola Electric's outstanding equi : "07 Oct 2026, 10:59 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Trade Setup For Oct. 8: Nifty Finds Support At 22,440 As Pullback Rally Eyed Above Key Hurdle", "full_content": "The Nifty 50 benchmark finds immediate support in the 22,460 -22,440 zone. A decisive break below this zone could revive selling pressure and trigger further correction towards 22,300 after RBI MPC's hawkish stance today, according to analysts at SBI Securities.", "source": "NDTV Profit", "pub_date_str": "07 Oct 2026, 10:55 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "India's GST Revolution: How India\u2019s biggest indirect tax reform changed its economy and its way of doing business", "full_content": "India's GST Revolution: GST has transformed India's indirect taxation system, eliminating many previous levies to streamline compliance and taxation. Following its introduction in 2017, businesses adjusted to new frameworks and updated regulations. Key changes included the phased introduction of e-invoicing and the removal of border checkposts enhancing logistics.", "source": "Economic Times Economy", "pub_date_str": "07 Oct 2026, 10:50 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "RBI To Conduct 29-Day Variable Rate Reverse Repo Rate Auction For Rs 2 Lakh On Oct 8", "full_content": "Currently, the liquidity in the banking system is estimated to be in surplus of around Rs 4.99 lakh crore as on Oct. 7.", "source": "NDTV Profit", "pub_date_str": "07 Oct 2026, 10:35 PM IST", "pub_date_relative": "2h ago", "cfa_     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
