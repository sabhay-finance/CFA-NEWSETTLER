atforms India\u2019s second-most valuable company after parent Reliance Industries Ltd., pushing rival Bharti Airtel Ltd. into third place. That prospect is adding to the excitement around an IPO that\u2019s already rewritten records in India\u2019s capital markets. Jio Platforms attracted more than $78 billion in bids and nearly 14 million applications in one of the country\u2019s most anticipated listings.\n\nSo far, Jio has been able to defy the usual trend of gray market premiums cooling after an IPO closes, as the initial rush of bidding fades and investors shift their focus to allotments and the eventual listing. After National Stock Exchange of India Ltd.\u2019s $2.4 billion IPO, the premium gradually eroded from about 15% to 3% in two weeks and the shares ultimately made a relatively muted debut.\n\nThe optimism is backed by blockbuster subscription numbers. Jio\u2019s IPO was subscribed more than 22 times, with qualified institutional buyers bidding for 71 times the shares reserved for them. Wealthy investors subscribed 14 times their allocation, while the retail portion was covered 2.7 times.", "source": "LiveMint Markets", "pub_date_str": "27 Oct 2026, 05:50 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Tata Capital Q2 Results: Profit jumps 51% to Rs 1,660 crore; NII up 23%", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a Earnings \u203a Tata Capital Q2 Results: Profit jumps 51% to Rs 1,660 crore; NII up 23% Tata Capital Share Price Shriram Finance Share Price Jio Financial Services Share Price Cholamandalam Investment & Finance Company Share Price Aditya Birla Capital Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Tata Capital Q2 Results: Profit jumps 51% to Rs 1,660 crore; NII up 23% SECTIONS Tata Capital Q2 Results: Profit jumps 51% to Rs 1,660 crore; NII up 23% By Akash Podishetti , ETMarkets.com Last Updated: Oct 27, 2026, 05:50:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Tata Capital\u2019s September-quarter net profit surged 51% year-on-year to Rs 1,660 crore, driven by loan growth, higher interest income and lower provisions. Its loan book crossed Rs 3 lakh crore, while improving margins and asset quality strengthened profitability.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "27 Oct 2026, 05:50 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Coca-Cola hikes earnings outlook, even as it sees lackluster demand in North America", "full_content": "Coca-Cola on Tuesday raised its full-year outlook for the third straight quarter, despite lackluster demand in its home market.\n\nFor the full year, Coke now expects comparable earnings per share to grow at least 11%, up from its prior forecast of an increase in the range of 9% to 10%. The beverage giant also anticipates that its organic revenue will climb at least 5%, a slight increase from its previous outlook of approximately 5% growth.\n\nHere's what the company reported compared with what Wall Street analysts surveyed by LSEG were expecting:\n\nCoke reported third-quarter net income attributable to shareholders of $4.01 billion, or 93 cents per share, up from $3.7 billion, or 86 cents per share, a year earlier.\n\nExcluding transaction gains and other items, Coke earned 91 cents per share.\n\nNet sales rose 7% to $13.4 billion. Coke's organic revenue, which strips out acquisitions, divestitures and foreign currency, also rose 7% in the quarter.\n\nFor the second straight quarter, the company's unit case volume increased 5%, helped by higher demand outside of North America.\n\nCoke's home market reported flat volume. However, the company's North American business would have reported volume growth if not for the timing of the Fourth of July holiday and the months-long shortage of Topo Chico, a sparkling water brand Coke owns, CFO John Murphy told CNBC.", "source": "CNBC Top News", "pub_date_str": "27 Oct 2026, 05:50 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "India benchmark yield falls most in 3 months on value buying", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Bonds \u203a India benchmark yield falls most in 3 months on value buying Jana Small Finance Bank Share Price Au Small Finance Bank Share Price Ujjivan Small Finance Bank Share Price Equitas Small Finance Bank Share Price Utkarsh Small Finance Bank Share Price Powered By The Economic Times daily newspaper is available online now. Read Today's P Paper Vedanta Iron Q2 Results: Loss narrows to Rs 324 crore, revenue declines 2% YoY SECTIONS Vedanta Iron Q2 Results: Loss narrows to Rs 324 crore, revenue declines 2% YoY By Kumar Gaurav , ETMarkets.com Last Updated: Oct 27, 2026, 05:46:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Vedanta Iron and Steel narrowed its Q2 FY27 loss to Rs 324 crore from Rs 477 crore a year earlier, while revenue declined 1.7% to Rs 2,742 crore. EBITDA rose 56% to Rs 83 crore, supported by improved steel realisations and efficiency gains. The company also reported record half-yearly pig iron production.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "27 Oct 2026, 05:46 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "L&T Q2 Print: Net Profit, Revenue Beat Estimates; Orderbook Jumps 28%", "full_content": "The company's net profit rose 33% to Rs 5,202 crore in the second quarter of the current financial year.", "source": "NDTV Profit", "pub_date_str": "27 Oct 2026, 05:43 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "US Stock Market Live Updates: US stock futures rise as oil falls ahead of Fed decision", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a US Stock Market Live Updates: US stock futures rise as oil falls ahead of Fed decision Powered By LIVE BLOG US Stock Market Live Updates: US stock futures rise as oil falls ahead of Fed decision 27 Oct 2026 | 06:09:17 PM IST Stock Market Today Live Synopsis Dow Jones | Nasdaq | Stock Market Live: US stock futures rise as oil prices extend their decline ahead of the Federal Reserve\u2019s rate decision. Investors focus on major earnings from Alphabet, Microsoft and Amazon, while concerns over AI spending remain. Tesla gains, Royal Caribbean rises after upbeat results and Whirlpool falls.\n\n- Brian Mulberry, chief market strategist at Zacks Investment Management\n\nComments are moderated and will be allowed if they are about the topic and not abusive.\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Markets", "pub_date_str": "27 Oct 2026, 05:42 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Top stocks to buy in F&O segment: CDSL, Zydus Lifesciences, Sun Pharma by Jay Thakkar for near-term | Check targets", "full_content": "Indian equity benchmarks ended largely flat on Tuesday, 27 October as elevated crude oil prices kept investor sentiment cautious, with market participants awaiting the US Federal Reserve\u2019s policy decision later this week.\n\nThe Nifty 50 declined 0.02% to close at 22,749.75, while the Sensex slipped 0.01% to settle at 73,598.67.\n\nBrent crude traded near $116 per barrel, hovering at six-month highs, as attacks on Saudi Arabia dampened hopes of an immediate easing of tensions in the Middle East.\n\nAmid the range-bound market, Jay Thakkar of ICICI Securities recommends buying CDSL futures at \u20b9 1,210\u2013 \u20b9 1,230, with targets of \u20b9 1,300\u2013 \u20b9 1,350 and a stop-loss below \u20b9 1,150.\n\nFor Zydus Lifesciences futures, he suggests an entry range of \u20b9 1,170\u2013 \u20b9 1,180, with targets of \u20b9 1,250\u2013 \u20b9 1,300 and a stop-loss below \u20b9 1,130. He also recommends buying Sun Pharmaceutical Industries futures at \u20b9 1,760\u2013 \u20b9 1,770, with targets of \u20b9 1,840\u2013 \u20b9 1,880 and a stop-loss below \u20b9 1,730.\n\nJay Thakkar, Vice President and Head of Derivatives and Quantitative Research at ICICI Securities, said the Nifty 50 closed almost flat on monthly expiry day after facing selling pressure at higher levels. The index attempted to move above 22,800 towards 23,000 but failed to sustain the gains. It also briefly slipped below 22,700, reflecting intraday volatility. However, India VIX declined nearly 5%, indicating that volatility remained relatively contained.\n\nThakkar said the market has been trading in a range ahead of key global and domestic events, including the Federal Reserve\u2019s policy decision, GDP data and geopolitical developments. He noted that the Nifty 50\u2019s immediate trading range is 22,000\u201323,000, with a decisive breakout on either side likely to determine the next directional move. Until then, the index is expected to remain range-bound, with India VIX likely to trade between 15 and 20.\n\nOn the Bank Nifty, Thakkar said the index has underperformed the Nifty 50 in recent sessions.", "source": "LiveMint Markets", "pub_date_str": "27 Oct 2026, 05:42 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Derivatives", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Bessent dines at Cheesecake Factory, slams Obama over Trump joke", "full_content": "Treasury Secretary Scott Bessent on Monday became the latest right-wing critic to accuse former President Barack Obama of elitism for mockingly comparing President Donald Trump 's ostentatious White House renovations to the Cheesecake Factory .\n\nBut Bessent, a former hedge fund manager whose net worth has been estimated at around $600 million , put his money where his mouth is \u2014 dining at the chain restaurant and praising its food before giving the Democratic ex-president a slice of his mind.\n\n\"This is the man who built the museum [that] looks like Darth Vader's tomb,\" Bessent told a Fox Business reporter who asked about Obama's remark as he left the restaurant near the White House. Bessent was apparently referring to the Obama Presidential Center , a monolithic structure that opened in June .\n\n\"I had a great meal, always have a great meal, and I would just tell the Martha's Vineyard set to give it a try,\" Bessent said. Obama vacationed on Martha's Vineyard as president, and he and his wife Michelle now own an estate on the exclusive island.\n\nBessent said he ordered \"what I always have: the French Dip Cheeseburger.\"\n\nThat's a \"Charbroiled Cheeseburger Served on a Toasted Brioche Roll with Grilled Onions, Sriracha Mayo and Au Jus for Dipping,\" one of the \"Glamburgers\" on Cheesecake Factory's famously sprawling menu . The burger, which comes with french fries or a green salad, currently costs $22.95 at the restaurant's downtown Washington location.\n\n\"I recommend the Cheeseburger Spring Rolls,\" Bessent added in a follow-up post on X directed at Obama.\n\nBessent's biting comment followed those of other Trump allies who claim Obama sneered at working-class Americans when he tore into Trump over his extensive White House construction and decoration projects.", "source": "CNBC Top News", "pub_date_str": "27 Oct 2026, 05:41 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income", "Alternative Investments"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Tech's relief rally extends as attention turns to tough decisions for the Fed", "full_content": "This is CNBC's Morning Squawk newsletter. Subscribe here to receive future editions in your inbox.\n\nHello, this is Leonie Kidd with today's edition of Morning Squawk.\n\nThe Anthropic effect is lifting the Nasdaq for a second day, after providing a boost to global technology stocks overnight.\n\nThe Fed is also in focus, as predictions of a hawkish hold at its meeting this week will almost certainly pave the way for a hike in December.\n\nInvestors look set to get a second day of gains from the tech sector, as the optimism around Anthropic's game-changing IPO announcement continues to support the sector. This comes after the announcement helped fuel a rally across AI-related stocks in Asia and Europe.\n\nIts blockbuster listing on the Nasdaq next month will test investors' appetite following the most significant moment of buyer's remorse for the AI space, after the debt-fueled capex super cycle triggered a rout in the AI darlings over the last few weeks.\n\nDay one of the two-day meeting gets underway later today, with the policy decision due on Wednesday at 2 p.m. ET.\n\nThere are relatively muted premarket moves across Wall Street this morning, but some volatility across European stocks.", "source": "CNBC World Economy", "pub_date_str": "27 Oct 2026, 05:39 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Larsen & Toubro Q2 Results: Profit surges 33% YoY to Rs 5,202 crore, revenue grows 16%", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a Earnings \u203a Larsen & Toubro Q2 Results: Profit surges 33% YoY to Rs 5,202 crore, revenue grows 16% The Economic Times daily newspaper is available online now. Read Today's Paper Larsen & Toubro Q2 Results: Profit surges 33% YoY to Rs 5,202 crore, revenue grows 16% SECTIONS Larsen & Toubro Q2 Results: Profit surges 33% YoY to Rs 5,202 crore, revenue grows 16% By Kumar Gaurav , ETMarkets.com Last Updated: Oct 27, 2026, 05:39:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis L&T Q2 Results: Larsen & Toubro announced significant financial results for the quarter ended September 30, 2026. The company reported a 33% increase in consolidated profit after tax compared to the previous year. Consolidated revenue also grew by 16%, driven by strong performance across various sectors. Additionally, L&T achieved its highest quarterly order inflow and saw substantial international participation in its orders.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "27 Oct 2026, 05:39 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Boeing Stock Rises After the Terrible, Horrible, No Good, Very Bad Earnings Quarter - Barron's", "full_content": "Boeing Stock Rises After the Terrible, Horrible, No Good, Very Bad Earnings Quarter Barron's Boeing narrows third-quarter loss as defense sales rise, but focus remains on 737 Max production CNBC Boeing Losses Expected To Narrow. Defense Awards, 737 Certification, Deliveries In Focus. Investor's Business Daily Boeing Has Wider-Than Expected Jet-Unit Loss as Deliveries Stall (BA) Bloomberg.com Can Boeing take off? The Economist", "source": "Google News Business", "pub_date_str": "27 Oct 2026, 05:38 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Tata Capital Q2 Results: Net Profit Jumps 51% To Rs 1,660 Crore; Total Income Up 20%", "full_content": "Tata Capital's bottomline was at Rs 1,660 crore, from the previous year's Rs 1,097 crore.", "source": "NDTV Profit", "pub_date_str": "27 Oct 2026, 05:35 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Three Russian diesel tankers steam for US \u2014 including two under sanctions", "full_content": "Trump deal with Putin to ease fuel prices exposes companies to legal threats from Congress", "source": "FT Markets", "pub_date_str": "27 Oct 2026, 05:35 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "European Stocks Erase Losses as Iran Comments Feed Peace Hopes", "full_content": "(Bloomberg) -- European stocks erased earlier losses as hopes of renewed negotiations between the US and Iran to end their war offset disappointing earnings from benchmark heavyweight HSBC Holdings Plc.\n\nThe Stoxx Europe 600 Index was 0.2% higher by 11:01 a.m. in London. Construction shares as well as miners outperformed, while personal care and energy stocks were among the biggest laggards. Brent crude fell 1% to trade at $115 a barrel after Iranian Supreme Leader Mojtaba Khamenei called for pursuing the conditions set out by Iranian officials with the aim of ending the war.\n\nIn individual stock moves, HSBC fell 6.5% after its earnings fell short of estimates in the third quarter and the lender kept its outlook for the rest of year unchanged. Porsche AG advanced 4.5% after profitability held up despite another sharp decline in vehicle sales. Reckitt Benckiser Group Plc fell 4.5% after cutting its sales forecast as supply constraints hit sales of cleaning products in the US and its vitamin brands suffered a setback in China.\n\nInvestors have been following Europe\u2019s third-quarter earnings season for clues on whether a range of headwinds from higher energy prices to political instability will drag on corporate profits. The region\u2019s benchmark index has been trading below its record high reached in August.\n\n\u201cSo far earnings season has been OK, I wouldn\u2019t say that it helped reshaping the narrative for European equities just yet,\u201d said Andrea Gabellone, head of global equities at KBC Securities. \u201cThe positive is that earnings\u2019 surprise breadth is elevated.\u201d\n\nCatch all the Business News , Market News , Breaking News Events and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.\n\nLog in to our website to save your bookmarks. It'll just take a moment.\n\nOops! Looks like you have exceeded the limit to bookmark the image. Remove some to bookmark this image.", "source": "LiveMint Markets", "pub_date_str": "27 Oct 2026, 05:35 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Tokenized bonds vs traditional bonds: How India\u2019s new digital system changes bond trading and settlement for investors", "full_content": "India's bond market is entering a new phase with the introduction of tokenized bonds, a digital system designed to make bond issuance, trading and settlement faster. Unlike traditional bonds, which rely on multiple intermediaries to complete transactions, tokenized bonds use blockchain-based technology to record ownership and settle payments.\n\nThe new system has already seen its first issuances, with REC raising \u20b9 500 crore, Larsen & Toubro (L&T) issuing another \u20b9 500 crore and IIFL raising \u20b9 25 crore. Together, these three issuances amount to \u20b9 1,025 crore, according to the July-September 2026 edition of PPFAS's quarterly magazine, The Tortoise Lens .\n\nIn the report, Mansi Kariya, Associate Vice President and Fund Manager, Debt, at PPFAS Mutual Fund, explains how tokenized bonds work, how they differ from conventional bonds and what the transition could mean for investors.\n\nTokenized bonds are essentially conventional debt securities issued and managed through digital technology. Their underlying financial characteristics remain unchanged.\n\nAccording to Kariya, the coupon rate, credit rating, maturity payments and legal obligations of tokenized bonds remain identical to those of traditional bonds. The primary difference lies in how ownership is recorded, transactions are executed and payments are settled.\n\nIn the conventional system, corporate bond transactions involve depositories, exchanges, clearing corporations and other intermediaries. The report notes that the traditional process of listing bonds and enabling secondary-market trading typically takes two to three days.\n\nTokenized bonds, however, operate on blockchain-based Distributed Ledger Technology (DLT), which records transactions digitally. Under the new framework, bonds are issued through a regulatory sandbox enabled by the Securities and Exchange Board of India.\n\nThe system is designed to reduce the time and complexity involved in issuing and transferring securities.", "source": "LiveMint Money", "pub_date_str": "27 Oct 2026, 05:29 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Fixed Income", "Alternative Investments", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Jio Is Listing. Is Your Mobile Bill About to Rise?", "full_content": "Jio Platforms makes its stock market debut on Wednesday. Its own price guarantee scheme, slowing revenue per user and brokerage forecasts all point to the same question for its 533 million customers.", "source": "NDTV Profit", "pub_date_str": "27 Oct 2026, 05:27 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "HUL Q2 Preview: Profit Seen Rising 4%, Revenue Growth May Be Led By Price Hikes", "full_content": "The combination of higher pricing and a recovery in volumes could support the company's top line.", "source": "NDTV Profit", "pub_date_str": "27 Oct 2026, 05:25 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Q2 Results Live: L&T Profit Rises 33%, Beats Estimates, Tata Capital Profit Jumps 51%", "full_content": "From infrastructure and autos to pharma and financials, more than 50 companies will announce Q2 results today, keeping investors on their toes.", "source": "NDTV Profit", "pub_date_str": "27 Oct 2026, 05:23 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Here\u2019s the question three tech-sector earnings reports raise about the future of AI", "full_content": "Celestica, Cadence Design Systems and Rambus all posted estimate-beating results for the third quarter.", "source": "MarketWatch Top Stories", "pub_date_str": "27 Oct 2026, 05:21 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Raymond Q2 Results: Net profit jumps 130% YoY to Rs 32 crore, revenue rises 24%", "full_content": "Raymond reported a 130% year-on-year jump in consolidated net profit to Rs 32 crore in Q2 FY27, while revenue rose 24.1% to Rs 655 crore. EBITDA increased 74.4% to Rs 75 crore, with margins expanding 336 basis points to 11.5%. The company has also proposed a name change to Raymond Aerospace, Defence & Engineering.", "source": "Economic Times Markets", "pub_date_str": "27 Oct 2026, 05:19 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Bajaj Auto Q2 Results: Net Profit Up 35%; Revenue Beats Estimates", "full_content": "Bajaj Auto Q2 Results: Net Profit Up 35%; Revenue Beats Estimates", "source": "NDTV Profit", "pub_date_str": "27 Oct 2026, 05:18 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Greece raises \u20ac500 million from three-month T-bills, yield rises", "full_content": "Greece has successfully sold \u20ac500 million worth of three-month Treasury bills. However, the yield on these bills was higher than what they offered in the last auction, indicating a shift in the market. This move comes as the country's debt agency reiterated its ongoing efforts to manage its financial obligations amidst fluctuating economic conditions.", "source": "Economic Times Markets", "pub_date_str": "27 Oct 2026, 05:15 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Britain issues costliest 5-year debt since 2008 before budget", "full_content": "Britain conducted a sale of \u00a34.5 billion worth of 5-year debt at a yield of 5.036%. This yield reflects the highest rate seen since the year 2008, indicating market pressures on the government. Investors showed robust interest, bidding 3.51 times the amount available during the gilt auction. Experts anticipate only a modest rise in debt issuance as projected figures indicate increased financing requirements.", "source": "Economic Times Markets", "pub_date_str": "27 Oct 2026, 05:11 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Acts of God Meet Acts of AI in Private Equity\u2019s New Debt Play", "full_content": "Force majeure has long protected companies from acts of God. Now some borrowers want protection from acts of AI.", "source": "LiveMint Markets", "pub_date_str": "27 Oct 2026, 05:11 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "We will see India becoming major exporter of goods and services to China: Piyush Goyal", "full_content": "Commerce and Industry Minister Piyush Goyal emphasised India's willingness to engage with Chinese suppliers. He highlighted the importance of fair play and judicial processes regarding pricing discrepancies. India aims to enhance exports to China and the ASEAN region over the coming years. Recent trade data shows a significant increase in India-China bilateral trade. The Indian government is also addressing concerns related to China's export controls on key machinery.", "source": "Economic Times Economy", "pub_date_str": "27 Oct 2026, 05:10 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "M K Sons Fine Jewels IPO: Price Band, Key Dates, GMP And More - All You Need To Know", "full_content": "M K Sons Fine Jewels IPO will open for subscription on Oct. 28 and close on Oct. 30, 2026. The Rs 275.40 crore issue has a price band of Rs 153 to Rs 162 per share, with a minimum application size of 91 shares.", "source": "NDTV Profit", "pub_date_str": "27 Oct 2026, 05:10 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "UPI-MDR an additional earnings opportunity, not Paytm's business model foundation: Brokerages", "full_content": "Paytm has reported a substantial increase in revenue, demonstrating the success of its existing business model. The company's EBITDA has improved due to efficient cost control and a strong merchant franchise. Financial services have significantly contributed to revenue growth, highlighting the diversity of its business operations. Global brokerages support the view that UPI-MDR will enhance, rather than define, future profitability.", "source": "Economic Times Markets", "pub_date_str": "27 Oct 2026, 05:08 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "PayPal raises 2026 profit forecast as turnaround gains traction", "full_content": "PayPal has raised its annual profit forecast as a multi-year turnaround begins to take effect. The company anticipates achieving significant cost savings through workforce reductions and operational efficiencies. Consumer spending remains strong despite economic challenges, aiding growth in payment volume. Additionally, PayPal expects adjusted profits in the upcoming holiday quarter to exceed Wall Street expectations. The focus on transformation under new leadership aims for sustainable profitability.", "source": "Economic Times Markets", "pub_date_str": "27 Oct 2026, 05:05 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}], "updated_at": "27 Oct 2026, 06:58 PM IST", "total_stories": 332};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
