t, seven companies have recorded an increase in EPS for four consecutive quarters, with each quarter\u2019s EPS higher than the previous quarter, through the June 2026 quarter, according to profitability scan data from StockEdge.com.\n\nThe company reported an EPS of Rs 3.51 in June 2026, up from Rs 0.81 in the year-ago quarter.\n\nThe company reported an EPS of Rs 0.28 in June 2026, up from Rs 0.08 in the year-ago quarter.\n\nThe company reported an EPS of Rs 6.80 in June 2026, up from Rs 3.02 in the year-ago quarter.\n\nThe company reported an EPS of Rs 13.73 in June 2026, up from Rs 6.76 in the year-ago quarter.\n\nThe company reported an EPS of Rs 10.91 in June 2026, up from Rs 5.71 in the year-ago quarter.\n\nThe company reported an EPS of Rs 7.25 in June 2026, up from Rs 4.02 in the year-ago quarter.\n\nThe company reported an EPS of Rs 17.14 in June 2026, up from Rs 9.75 in the year-ago quarter.", "source": "Economic Times Markets", "pub_date_str": "04 Oct 2026, 11:34 AM IST", "pub_date_relative": "58m ago"}, {"title": "Nitin Gadkari announces over Rs 500 crore for highway strengthening & widening in Bengal: What will change for commuters travelling on NH-14 and NH-114", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Infrastructure \u203a Nitin Gadkari announces over Rs 500 crore for highway strengthening & widening in Bengal: What will change for commuters travelling on NH-14 and NH-114 The Economic Times daily newspaper is available online now. Read Today's Paper Nitin Gadkari announces over Rs 500 crore for highway strengthening & widening in Bengal: What will change for commuters travelling on NH-14 and NH-114 SECTIONS Nitin Gadkari announces over Rs 500 crore for highway strengthening & widening in Bengal: What will change for commuters travelling on NH-14 and NH-114 ET Online Last Updated: Oct 04, 2026, 11:34:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Nitin Gadkari has announced Rs 508.66 crore for strengthening and selective widening of NH-14 and NH-114 in West Bengal\u2019s Birbhum district. The project will cover 91.90 km of NH-14 and 56.40 km of NH-114, with the upgrades aimed at improving road safety, reducing congestion and travel time, and strengthening connectivity for commuters and freight movement.\n\nA for apple, Y for yak and, for the first time, a price next to it. Will this change the non-agri part of the rural economy?\n\nSix months after oil spiked, why are markets reacting so sharply now?\n\nGold paradox: Why India, a refining giant, is not a big bullion exporter\n\nA refinery is not a laptop: Why America's diesel problem can't be switched off\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers\n\nLogin using your ET Prime credentials to enjoy all member benefits", "source": "Economic Times Economy", "pub_date_str": "04 Oct 2026, 11:32 AM IST", "pub_date_relative": "1h ago"}, {"title": "Inside OpenAI\u2019s Latest Safety Lead Exit: Is 'Iterative Safety\u2019 A Broken Model?", "full_content": "The incident has become an important example in the wider debate because it raises questions about what happens when AI systems are given the ability to perform tasks independently.", "source": "NDTV Profit", "pub_date_str": "04 Oct 2026, 11:12 AM IST", "pub_date_relative": "1h ago"}, {"title": "World Teachers' Day 2026: When Is It, Date, History, Significance And Why It Is Celebrated", "full_content": "World Teachers\u2019 Day 2026 will be observed on October 5, recognising educators\u2019 contributions and highlighting the need to support the teaching profession.", "source": "NDTV Profit", "pub_date_str": "04 Oct 2026, 11:12 AM IST", "pub_date_relative": "1h ago"}, {"title": "Explained: 'Quick cash\u2019 \u2014 What are payday loans, when can you borrow this money? Risks, eligibility, documents required", "full_content": "A cash crunch or a sudden expense just days before your salary arrives can put you in a difficult spot, especially if you don't have any savings or access to a credit card. This is where payday loans can seem like a easy way to bridge the gap, but they also come with high interest rates, fees and strict repayment timelines.\n\nBefore applying for a payday loan, borrowers should understand how much they will have to repay and whether they can comfortably meet the repayment deadline. If such factors are not taken into consideration, it may put you in a loop of debt trap and even lower your credit card for future borrowings.\n\nA payday loan is a short-term, unsecured advance that you can use for emergencies and other urgent expenses between salary days. These loans can be repaid between two weeks and a month or until your next payday, depending on the lender's terms and conditions.\n\nSince payday loans are generally unsecured, you do not have to put up physical collateral like a car title or property deed to get one.\n\nThese advances are legal in India, but only when they are disbursed by a bank, NBFC, or a Reserve Bank of India ( RBI ) regulated entity, either directly or through an authorised lending service provider (LSP).\n\nThe RBI\u2019s digital lending directions lay down requirements for regulated entities on how digital loans must be priced, disclosed and collected from the borrower. However, payday loans as a product are not separately regulated by the RBI.\n\nYou can obtain a payday loan from a lender's branch or online portal. These loans typically involve a quick approval process with minimal documentation, particularly when the lender can verify your salary or income details.\n\nOnce approved, the loan amount is instantly credited to your bank account via a cheque or online transfer. In most cases, the repayment process is also fairly simple, with the loan amount, interest and applicable charges being deducted from your bank account on next salary day.", "source": "LiveMint Money", "pub_date_str": "04 Oct 2026, 11:10 AM IST", "pub_date_relative": "1h ago"}, {"title": "Best Vedanta share to buy amid Q2 results? Vedanta Power vs Hindustan Zinc vs Vedanta Aluminium vs Vedanta Oil & Gas", "full_content": "Vedanta Q2 business updates FY27 : The Q2 FY27 production data from the demerged Vedanta entities points to significant differences in operational performance, distinguishing businesses with strong structural growth potential from those facing operational challenges.\n\nFrom a long-term investment perspective, capital allocation must prioritise volume growth, structural cost advantages, backward integration, and return on invested capital, according to market experts.\n\nVedanta Limited (residual HoldCo) presents a mixed, multi-faceted operational picture across its retained businesses. Its port operations delivered standout performance, achieving a record first-half cargo discharge volume of 4,185 KT (+32% YoY) and quarterly dispatches of 1,739 KT (+26% YoY).\n\nOn the resources front, Zinc International saw mined metal drop 12% YoY to 53 KT, though Gamsberg Phase 2 was successfully commissioned in Q2 with commercial volumes slated for October 2026. The ferrochrome vertical (FACOR) expanded output by 26% YoY to 24 KT following the restart of the Kalarangiatta mine, and domestic copper sales at Silvassa rose 16% YoY to 52 KT. However, international copper rod sales at Fujairah plummeted 74% YoY to 6 KT due to the closure of the Strait of Hormuz.\n\nThe business delivered record quarterly production of 649 KT, supported by a 37% year-over-year surge in alumina to 895 KT and a 31% expansion in value-added products (VAP) to 432 KT. Crucially, securing the Consent to Operate for the Sijimali Bauxite Block and commissioning the second zone of BALCO\u2019s 525 kA smelter potline structurally de-risks raw material availability and lowers unit power consumption.\n\nAccording to Seema Srivastava, Senior Research Analyst at SMC Global Securities , Vedanta Aluminium is aggressively protecting its margins against cyclical swings in London Metal Exchange (LME) aluminium prices.", "source": "LiveMint Markets", "pub_date_str": "04 Oct 2026, 11:10 AM IST", "pub_date_relative": "1h ago"}, {"title": "Bitcoin holds near $85,000 as SEC clears first 3x leveraged crypto ETPs", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Oct 2026, 11:08 AM IST", "pub_date_relative": "1h ago"}, {"title": "Who Was Singeetham Srinivasa Rao? Legendary Filmmaker Dies At 95 On Health Issues", "full_content": "The veteran director was admitted to Kauvery Hospital due to ill health and breathed his last on Saturday night.", "source": "NDTV Profit", "pub_date_str": "04 Oct 2026, 11:04 AM IST", "pub_date_relative": "1h ago"}, {"title": "When Will Monsoon End In Mumbai? IMD Withdrawal Date, October Heat And India\u2019s Rainfall Outlook", "full_content": "Mumbai's southwest monsoon has withdrawn on October 3, five days ahead of normal, marking the city's earliest withdrawal in over two decades.", "source": "NDTV Profit", "pub_date_str": "04 Oct 2026, 10:51 AM IST", "pub_date_relative": "1h ago"}, {"title": "Sam Altman Warns Against Giving AI Religious Force', Calls It A Real Safety Issue'", "full_content": "OpenAI CEO Sam Altman warns that treating AI as conscious, religious or moral authorities could pose safety risks, amid Anthropic\u2019s exploration of AI consciousness and spirituality. The debate highlights AI\u2019s ethical boundaries.", "source": "NDTV Profit", "pub_date_str": "04 Oct 2026, 10:48 AM IST", "pub_date_relative": "1h ago"}, {"title": "Singapore debuts a state-backed dating app for young government workers as it works to slow a demographic crisis", "full_content": "Singapore is asking its young government workers to trust the state to find them love matches.\n\nFirstDate , a government-built dating platform being piloted in Singapore, is the latest in a slew of state-backed matchmaking initiatives against the backdrop of Asia's persistently low fertility rates.\n\nIt follows Japan's AI-powered dating app Tokyo Enmusubi and South Korea's Seoulting , programs launched by the Tokyo and Seoul governments in 2024.\n\nThe experiments emerge amid a rising demographic crisis \u2014 official government data put the total fertility rate at 0.80 children per woman in South Korea , 0.87 in Singapore and 1.14 in Japan \u2014 among the lowest in the world and far below the replacement level of 2.1.\n\nGovernment intervention in a field as personal as romance has prompted skepticism and jokes among social-media users, some of whom describe the initiative as \"dystopian.\"\n\n\"Finally, state-assigned spouses,\" one Reddit user wrote in a discussion of the platform.\n\nBut the Asian city-state's matchmaking service may have conventional dating apps beat on certain fronts, experts said.\n\nOne potential advantage of state-backed matchmaking is the government's ability to make verification against official records a condition for entry into the program. The trade-off: participants must entrust sensitive personal and dating information to the state.", "source": "CNBC World Economy", "pub_date_str": "04 Oct 2026, 10:39 AM IST", "pub_date_relative": "1h ago"}, {"title": "The Talent Scarcity Myth: Why Strategy Churn\u2014 Not Skills Gap\u2014 Is The Top Drag On Business Goals", "full_content": "While a dearth in talent may have been an obstacle in the past for a firm's growth, it is no longer seen as such.", "source": "NDTV Profit", "pub_date_str": "04 Oct 2026, 10:33 AM IST", "pub_date_relative": "1h ago"}, {"title": "Ukraine\u2019s surprise robot offensive exposes a vulnerability in Putin\u2019s war machine", "full_content": "A surprise Ukrainian robot offensive in the eastern Donbas region appears to have reversed over a year of Russian territorial gains, according to security experts, dealing a strategic blow to Russian President Vladimir Putin 's territorial ambitions.\n\nDetails of the Ukrainian counteroffensive, dubbed \"Operation Vivaldi,\" have started to come to light in recent weeks, offering rare insight into the fast-changing nature of frontline combat operations amid Russia's full-scale invasion .\n\nAs part of the ongoing operation, which started in May, security experts said Ukraine's Third Army Corps had been able to deploy large bomber drones and remote-controlled robots behind enemy lines around Lyman in the northern Donetsk Oblast, apparently catching Russian forces off guard.\n\nRussian forces have been seeking to encircle Ukraine's so-called fortress belt cities that make up the remaining Ukrainian-held territory in the region for the past 12 months.\n\nThe third phase of Operation Vivaldi, however, liberated an additional 51 square kilometers, taking the total area of territory retaken to 176 square kilometers, Ukrainian Brigadier-General Andrii Biletskyi said on Sept. 28.", "source": "CNBC Top News", "pub_date_str": "04 Oct 2026, 10:30 AM IST", "pub_date_relative": "2h ago"}, {"title": "Rs 10 Lakh In Gold: How Much Of Your Wealth Is Exposed To One Asset", "full_content": "If a substantial portion of your wealth is tied up in gold, what share of your total assets does it represent?", "source": "NDTV Profit", "pub_date_str": "04 Oct 2026, 10:21 AM IST", "pub_date_relative": "2h ago"}, {"title": "Trump Names US Intelligence Chief Clayton As AI Czar To Head Task Force: Report", "full_content": "Trump has named intelligence chief Jay Clayton to lead the White House \u201cSuper Intelligence Force,\u201d tasked with a 120-day review of AI risks and opportunities as Washington seeks U.S. leadership while resisting heavy regulation.", "source": "NDTV Profit", "pub_date_str": "04 Oct 2026, 10:19 AM IST", "pub_date_relative": "2h ago"}, {"title": "Auto sales surge in m is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "04 Oct 2026, 10:10 AM IST", "pub_date_relative": "2h ago"}, {"title": "Stock market prediction for tomorrow, 5 Oct Monday: Sensex, Nifty outlook; Dow Jones, Nasdaq, Kospi, Nikkei, Taiwan cues", "full_content": "Stock market prediction for 5 October, 2026 : The Indian stock market extended its corrective phase for the eighth consecutive week, ending sharply lower amid persistent selling pressure and weak global cues.\n\nThe bearish trend was visible from the beginning of the week, with the Sensex falling 1.52% on Monday. The market witnessed relatively modest declines over the next two sessions before the index dropped another 0.79% on Thursday. Overall, the Sensex plunged 1,670.84 points, while the Nifty declined more than 3%.\n\nOn Thursday, the benchmark indices, Sensex and Nifty, declined for the fourth consecutive session on Thursday as sustained FII selling, elevated bond yields and a fresh surge in crude oil prices dampened investor sentiment.\n\nThe BSE Sensex fell 570.59 points, or 0.79%, to close at 71,909.70. During the session, the 30-stock index plunged as much as 1,187.41 points to touch a fresh 52-week low of 71,292.88. Meanwhile, the NSE Nifty 50 dropped 198.50 points, or 0.88%, to settle at 22,421.95.\n\nGIFT Nifty ended 0.59% or 133.50 points up, closed the session at 22,624.50 on 2 October.\n\nSensex closed at 71,909.70, down by 570.59 points (-0.79%), extending the recent weakness amid continued selling pressure. The index also breached the April 2025 swing low of 71,425.01 during the session before recovering and closing above that level.\n\nOn the Sensex outlook, Sachin Gupta, VP \u2013 Technical Research at Choice Equity Broking Private Limited, said, \u201cOn the daily chart, the index remains below the 50-Day EMA at 75,544.56 and 200-Day EMA at 77,684.60, while RSI has slipped to 24.55, indicating deeply oversold momentum.", "source": "LiveMint Markets", "pub_date_st g on companies with a market capitalisation below Rs 1,000 crore, a share price below Rs 20, and a minimum recent trading volume of 5 lakh shares. The screen highlights low-priced, relatively liquid penny stocks that recorded notable declines during the period. (Data Source: ACE Equity).", "source": "Economic Times Markets", "pub_date_str": "04 Oct 2026, 09:22 AM IST", "pub_date_relative": "3h ago"}, {"title": "Hanuman Ansh Box Office Collection Day 58: Devotional Drama Holds Strong In Ninth Week", "full_content": "Written and directed by Vishal Chaturvedi, Hanuman Ansh is a spiritual drama inspired by the life and teachings of Neem Karoli Baba.", "source": "NDTV Profit", "pub_date_str": "04 Oct 2026, 09:16 AM IST", "pub_date_relative": "3h ago"}, {"title": "Will Nifty, Sensex plunge for 9th straight week? TCS Q2, 4 factors to drive Dalal Street from Monday", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Will Nifty, Sensex plunge for 9th straight week? TCS Q2, 4 factors to drive Dalal Street from Monday Tata Consultancy Services Share Price Infosys Share Price HCL Technologies Share Price Wipro Share Price Tech Mahindra Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Will Nifty, Sensex plunge for 9th straight week? TCS Q2, 4 factors to drive Dalal Street from Monday SECTIONS Will Nifty, Sensex plunge for 9th straight week? TCS Q2, 4 factors to drive Dalal Street from Monday By Veer Sharma , ETMarkets.com Last Updated: Oct 04, 2026, 09:14:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India's stock market has faced a challenging downturn, marking eight weeks of losses, the longest in 25 years. Driving this trend are soaring oil prices and rising US bond yields. The sell-off by foreign institutional investors ing of loan-mix will aid earnings and re-rating from attractive 1.4x FY28E adj PB. This will aid other banks' valuations as well.\u201d\n\nThe global brokerage believes that his appointment gives HDFC Bank an opportunity to optimise its operating structure.\n\nExpecting the retail deposit growth to power the loan growth, Jefferies India report says, \"HDFC Bank has lagged peers on LCR retail deposit growth (12% vs 15% for ICICI and 14% for SBI), despite offering competitive rates. It had a slower start in FCNR-B deposits but made a strong comeback, mobilising $11-12bn within two months (8-9% market share; this is 3% of total deposits and 8% of LCR non-retail deposits).", "source": "LiveMint Markets", "pub_date_str": "04 Oct 2026, 09:00 AM IST", "pub_date_relative": "3h ago"}, {"title": "Trump\u2019s new AI czar outlines U.S. strategy for AI risks and leadership, WSJ says", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Oct 2026, 09:00 AM IST", "pub_date_relative": "3h ago"}, {"title": "Upcoming dividend, stock split, bonus shares this week: NMDC, PH Capital, MoldTek, GTV and others - Record date, ratio", "full_content": "Upcoming dividend, stock split, bonus share this week, October 5-9: Shares of NMDC, PH Capital, MoldTek Technologies, PTC India , GTV Engineering Limited are set to attract heightened investors\u2019 interest in the upcoming week due to their record dates for corporate actions.\n\nNearly 15 companies have fixed record date for corporate actions like dividend, stock split, bonus issue, spin off, etc. For investors who closely track such corporate actions, here are all the details about upcoming dividend, bonus, stock split record dates.\n\nNMDC, PTC India, Accelya Solutions India , Caspian Corporate Services , Skyways Air Services , etc have announced interim dividends; their record dates will fall in the upcoming week. Additionally, GTV Engineering, PH Capital, MoldTek Technologies, MoldTek Packaging Limited, etc have fixed record dates for stock split.\n\nThe Indian stock market ended lower for the seventh consecutive week. Nifty 50 closed 0.78% lower at 22,421.95 points, whereas BSE Sensex closed 0.60% lower at 71,909 points. The Indian stock market is likely to see heightened volatility in the upcoming week.\n\nFor Nifty 50, \u201ca move above Thursday\u2019s high of 22,610 will signal a pullback towards the 22,800 and 23,000 levels. However, for a meaningful trend reversal index would require forming a sustained Higher High\u2013Higher Low structure and reclaim the 23,000-23,100 level. Failure to move above 22,610 will lead to some consolidation in the range of 22,600-22,200 levels,\u201d explained Pabitro Mukherjee, Deputy Vice President-Research, Bajaj Broking.\n\nCatch all the Business News , Market News , Breaking News Events and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.\n\nLog in to our website to save your bookmarks. It'll just take a moment.\n\nOops! Looks like you have exceeded the limit to bookmark the image. Remove some to bookmark this image.", "source": "LiveMint Markets", "pub_date_str": "04 Oct 2026, 09:00 AM IST", "pub_date_relative": "3h ago"}, {"title": "Russia's 'New Doctrine' Meets Ukraine's Oil Strategy: The Escalation Dilemma", "full_content": "Ukraine vows to intensify strikes on Russian oil refineries after accusing Moscow of expanding attacks on civilian infrastructure. The escalation threatens to further complicate U.S.-backed peace efforts.", "source": "NDTV Profit", "pub_date_str": "04 Oct 2026, 08:47 AM IST", "pub_date_relative": "3h ago"}, {"title": "Wartime Energy Shock: Why G7 Cracked Open 100 Million Barrels Of Emergency Fuel Reserve", "full_content": "They added in a joint statement that the nations \u2014 France, Canada, Germany, Italy, Japan, the United Kingdom and the United States \u2014 will convene againin the context of the IEA in the coming days to discuss the possibility of additional diesel releases if necessary.", "source": "NDTV Profit", "pub_date_str": "04 Oct 2026, 08:43 AM IST", "pub_date_relative": "3h ago"}, {"title": "Australia\u2019s Chalmers blames U.S.-Iran war for higher inflation, borrowing costs", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Oct 2026, 08:11 AM IST", "pub_date_relative": "4h ago"}, {"title": "Drishyam 3: The Conclusion Box Office Collection Day 2: Ajay Devgn Film Maintains Strong Momentum\u2014 Check Earnings", "full_content": "Directed by Abhishek Pathak, the film stars Ajay Devgn as Vijay Salgaonkar, Tabu as Meera Deshmukh and Jaideep Ahlawat as SP Rajveer Singh Tomar.", "source": "NDTV Profit", "pub_date_str": "04 Oct 2026, 08:10 AM IST", "pub_date_relative": "4h ago"}, {"title": "Lanterns Season 1 Finale Release: Recap, Plot, When, Where To Watch Episode 8 \u2014 All You Need To Know", "full_content": "Lanterns S1 E8 will be available to watch from 6:31 a.m. IST on Monday on the JioHotstar app and website in English, Hindi, Tamil and Telugu.", "source": "NDTV Profit", "pub_date_str": "04 Oct 2026, 08:00 AM IST", "pub_date_relative": "4h ago"}, {"title": "Chinese savers want to invest in US stocks. Now there\u2019s an easier way.", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nChinese savers who want a piece of Nvidia stock no longer necessarily need an offshore brokerage account. Increasingly, they can buy it through a fund approved by Beijing.\n\nThat distinction is becoming important as China\u2019s households search for somewhere to put the cash they accumulated during the property bust. Deposit rates at the country\u2019s biggest banks have fallen below 1% for a one-year term, while authorities are simultaneously cracking down on unlicensed routes used by mainland investors to trade overseas.\n\nThe result is an unusual compromise: Beijing is tightening enforcement around offshore trading in some places while widening regulated channels that give Chinese investors exposure to U.S. stocks, Treasuries, gold and other global assets.\n\nFew funds illustrate the shift better than Pictet Strategic Income. The Hong Kong-domiciled fund has grown to $5.1 billion from $1.6 billion at the start of this year. Roughly 60% of its assets now come from mainland Chinese retail investors through the Mainland-Hong Kong Mutual Recognition of Funds program.\n\nIn the first half alone, the fund attracted HK$16.3 billion ($2.1 billion), in net mainland inflows, the most among 34 funds tracked by Morningstar. An August portfolio update showed top holdings including U.S. Treasuries and gold, as well as Amazon.com, Alphabet and Nvidia. The fund returned 17% through August after gaining 18% last year.\n\nThose numbers are still small beside China\u2019s enormous pool of household savings. Chinese households added another 6.99 trillion yuan to bank deposits in the first eight months of this year, according to the People\u2019s Bank of China. But the direction of travel matters.", "source": "LiveMint Markets", "pub_date_str": "04 Oct 2026, 07:56 AM IST", "pub_date_relative": "4h ago"}, {"title": "AI deal boom drives Hong Kong fundraising to record summer - Bloomberg", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Oct 2026, 07:42 AM IST", "pub_date_relative": "4h ago"}, {"title": "PF withdrawal done, pension forgotten? Why your EPS service record still needs to be transferred and how to do it", "full_content": "Many employees withdraw their provident fund balance after switching jobs and assume there is nothing else left to transfer, leaving the old account behind. However, their Employees\u2019 Pension Scheme (EPS) service is tracked separately, and failing to carry forward this service history when changing jobs could affect the pension benefits they may be entitled to later.\n\nEPF and EPS are part of the same social security framework, but they serve different purposes. While EPF helps build a retirement corpus through contributions and interest and can also provide financial support during certain emergencies, EPS primarily tracks an employee\u2019s eligible pensionable service.\n\nGenerally, a longer eligible service period can result in the employee receiving higher pension benefits after they retire.\n\nWhen an employee withdraws their EPF balance, their EPS service history does not automatically get transferred. Hence, when you switch jobs, it is important to ensure that your pensionable service from previous employment is properly linked to your current EPF account.\n\nThis matters because EPS eligibility is based on your total eligible pensionable service. Employees generally need at least 10 years of eligible service to qualify for a monthly pension. If your service records are not properly carried forward, your employment history could appear incomplete.\n\nThe EPS contribution rate is 8.33% of the monthly wages, which is diverted directly from the employer's total 12% contribution to the employee's EPF account. An employee does not have to contribute towards EPS.\n\nEven if you have already withdrawn your entire EPF balance but later realise that your EPS service history was not carried forward, you are not without options.\n\nAn employee can transfer their service record later after submitting Form 13 through the EPFO member portal and complete the transfer process.", "source": "LiveMint Money", "pub_date_str": "04 Oct 2026, 07:30 AM IST", "pub_date_relative": "5h ago"}, {"title": "China closes hundreds of banks to bolster financial system - Financial Times", "full_content": "China closes hundreds of banks to bolster financial system Financial Times China Rescues Small and Rural Banks Through Mergers \u0635\u062d\u064a\u0641\u0629 \u0645\u0627\u0644 Fitch Says China Accelerates Small-Bank Cleanup To Preserve Financial Stability TradingView", "source": "Google News Business", "pub_date_str": "04 Oct 2026, 07:30 AM IST", "pub_date_relative": "5h ago"}, {"title": "What life insurers actually pay for", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nIn fiscal year 2025 (FY25), life insurers paid out \u20b9 6.3 trillion in benefits, according to the insurance regulator's September 2026 consultation paper on distribution costs. Of this, death claims accounted for \u20b9 0.47 trillion, or a mere 7%. Maturity benefits took 35%, surrender payouts 37%, and annuity and pension payments the remaining 20%.\n\nRead that again. Money paid to customers who gave up their policies far exceeds the money paid to families of customers who died. Surrender payments alone are five times larger than death claims.\n\nThe numbers from Irdai's consultation paper deserve far more attention than the new commission rates that everyone, including me, quickly wrote about. The payoff from digging into this 120-page paper is remarkable: it contains unusually revealing data about an industry whose underlying economics are often difficult to see.\n\nThese numbers should make an industry\u2014and its regulator\u2014uncomfortable. Life insurance exists, at least in part, to protect families from the financial consequences of a breadwinner's death. Yet death payouts are a small fraction of the industry's total benefits paid. Maturity benefits alone are nearly five times death benefits. Whatever else the industry is doing, insuring against death appears to be a relatively small part of the outcome.\n\nOverall, 61st-month persistency across the industry is just 48%, meaning fewer than half of policies remain in force after five years. By the 10th year, the proportion of policies still in force is as low as 8% for some insurance companies.\n\nThat is a remarkable level of attrition. And there is a particularly interesting qualifier in the data.\n\nOnline policies, bought without agent involvement, have a 61st-month persistency rate of 71%. A policyholder who bought a policy without the same degree of sales intervention is much more likely to keep it.", "source": "LiveMint Money", "pub_date_str": "04 Oct 2026, 07:00 AM IST", "pub_date_relative": "5h ago"}, {"title": "Yemen\u2019s Houthis say they attacked Aramco facility in Riyadh with missiles, drones", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Oct 2026, 06:42 AM IST", "pub_date_relative": "5h ago"}, {"title": "FlyDubai copilot lost earlier job over radical views", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Oct 2026, 06:22 AM IST", "pub_date_relative": "6h ago"}, {"title": "The government can take 15% of Social Security benefits to repay student loans. These proposals seek to stop it.", "full_content": "Debt among older Americans is rising, both in terms of the number of older households carrying debt and the amount borrowed.", "source": "MarketWatch Top Stories", "pub_date_str": "04 Oct 2026, 05:32 AM IST", "pub_date_relative": "7h ago"}, {"title": "Falling wages, soaring energy prices and inflation: It\u2019s beginning to look a lot like the 1970s", "full_content": "Is it time to dust off the financial playbook from that dismal decade?", "source": "MarketWatch Top Stories", "pub_date_str": "04 Oct 2026, 05:28 AM IST", "pub_date_relative": "7h ago"}, {"title": "Corporate Actions This Week: NMDC, Accelya Solutions, PH Capital, PTC India \u2014 Check Full List Here", "full_content": "NMDC, PTC India, and Accelya Solutions India have scheduled dividend payouts this week, with Accelya offering one of the highest final dividends at Rs 35 per share.", "source": "NDTV Profit", "pub_date_str": "04 Oct 2026, 05:24 AM IST", "pub_date_relative": "7h ago"}], "cfa": [{"title": "Another big development in Tata Boardroom Battle; Noel Tata seeks video recording and minutes of Sept 17 meeting", "full_content": "There is a fresh development in Tata Boardroom Battle as Tata Trusts Chairman Noel Tata has sought Tata Sons meeting video, minutes and questioned legal opinions on Tata Sons Chairman N. Chandrasekaran's reappointment.\n\nAccording to a report by The Economic Times bureau, Tata Trusts chairman Noel Tata has written to the Tata Sons board. The ET report says that Noel Tata has sought details of the video recording and minutes of the September 17 meeting.\n\nIt is noteworthy that Sept 17 is the meeting when Tata Sons decided to reappoint N Chandrasekaran as its chairman.\n\nActually, on September 17, 2026, the Tata Sons board voted 4:1 to approve a third five-year term for N. Chandrasekaran starting February 2027. But, Noel Tata was the sole board member to vote against the extension, and also called the resolution a 'legal nullity'.\n\nIt is touted as one of the biggest boardroom battles as a high-stakes corporate tussle emerged between Tata Trusts Chairman Noel Tata and Tata Sons Chairman N. Chandrasekaran with respect to leadership extension and board voting rules.\n\nBasically, the legal stance is that Tata Trusts (holding a 66% stake in Tata Sons) argues that the Articles of Association (AoA) require affirmative support from a majority of Trust-nominated directors, meaning a single dissenting vote from a nominee invalidates the decision.\n\nNow, it has become even a bigger corporate matter with legal eagles as Tata Trusts retained senior counsel Abhishek Manu Singhvi , while Tata Sons is advised by Harish Salve .\n\nA boardroom battle at India's largest conglomerate was escalated after Tata Sons' directors approved a fresh term for executive chairman N Chandrasekaran in a vote that the group's biggest shareholder called illegal.", "source": "LiveMint Markets", "pub_date_str": "04 Oct 2026, 12:11 PM IST", "pub_date_relative": "21m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "After Nifty\u2019s longest losing streak in 25 years, what should investors do now?", "full_content": "Home ETPrime Markets Market rns.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets .", "source": "Economic Times Markets", "pub_date_str": "04 Oct 2026, 09:14 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Fixed Income"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "RBI repo rate may climb to 6% in FY27; G-Sec yields face upward pressure: Report", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a RBI repo rate may climb to 6% in FY27; G-Sec yields face upward pressure: Report The Economic Times daily newspaper is available online now. Read Today's Paper RBI repo rate may climb to 6% in FY27; G-Sec yields face upward pressure: Report SECTIONS RBI repo rate may climb to 6% in FY27; G-Sec yields face upward pressure: Report ANI Last Updated: Oct 04, 2026, 09:05:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis RBI is expected to raise the repo rate by 25 basis points in October, with one or two more hikes possible in FY27, taking the benchmark rate to 5.75-6%, according to a Union Bank of India report.\n\nA for apple, Y for yak and, for the first time, a price next to it. Will this change the non-agri part of the rural economy?\n\nSix months after oil spiked, why are markets reacting so sharply now?\n\nGold paradox: Why India, a refining giant, is not a big bullion exporter\n\nA refinery is not a laptop: Why America's diesel problem can't be switched off\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "04 Oct 2026, 09:05 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics", "Fixed Income", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "HDFC Bank gets new MD-CEO; stock is Jefferies India's top pick \u2014 22% upside despite 27% dip in YTD | Target price, ratio", "full_content": "Jefferies India stock recommendations: HDFC Bank shares are one of the beaten-down stocks in the Indian stock market. The Bank Nifty and Nifty 50 heavyweight has delivered a negative return in YTD by correcting over 27%. In the last six months, the HDFC Bank share price has slipped by over 6%. However, after the buzz surrounding the appointment of a new CEO and MD, HDFC Bank shares saw buying interest in recent sessions. In one month's time, HDFC Bank's share price has risen over 2%, paring all initial losses from September. However, despite YTD weakness, Jefferies India is bullish on HDFC Bank shares.\n\nThe Jefferies India report has given a \u2018buy\u2019 rating to the banking stock, predicting 22% upsideand citing the appointment of Anup Bagchi as the new CEO and MD as a major positive for the bank. The global brokerage has predicted around 25% upside for the HDFC Bank ADR, believing it may reach $28 per ADR.\n\nHighlighting the reason for being bullish on the HDFC Bank shares, Jefferies India report says, \u201cRBI's approval of Mr Anup Bagchi as MD & CEO of HDFC Bank will provide clarity on mgt succession & strategic direction. Timely changes to team (if any) and opportunities from (1) improving retail detail growth, (2) better cross-sell fees, and (3) calibrated re-risking of loan-mix will aid earnings and re-rating from attractive 1.4x FY28E adj PB. This will aid other banks' valuations as well.\u201d\n\nThe global brokerage believes that his appointment gives HDFC Bank an opportunity to optimise its operating structure.\n\nExpecting the retail deposit growth to power the loan growth, Jefferies India report says, \"HDFC Bank has lagged peers on LCR retail deposit growth (12% vs 15% for ICICI and 14% for SBI), despite offering competitive rates. It had a slower start in FCNR-B deposits but made a strong comeback, mobilising $11-12bn within two months (8-9% market share; this is 3% of total deposits and 8% of LCR non-retail deposits).", "source": "LiveMint Markets", "pub_date_str": "04 Oct 2026, 09:00 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Upcoming dividend, stock split, bonus shares this week: NMDC, PH Capital, MoldTek, GTV and others - Record date, ratio", "full_content": "Upcoming dividend, stock split, bonus share this week, October 5-9: Shares of NMDC, PH Capital, MoldTek Technologies, PTC India , GTV Engineering Limited are set to attract heightened investors\u2019 interest in the upcoming week due to their record dates for corporate actions.\n\nNearly 15 companies have fixed record date for corporate actions like dividend, stock split, bonus issue, spin off, etc. For investors who closely track such corporate actions, here are all the details about upcoming dividend, bonus, stock split record dates.\n\nNMDC, PTC India, Accelya Solutions India , Caspian Corporate Services , Skyways Air Services , etc have announced interim dividends; their record dates will fall in the upcoming week. Additionally, GTV Engineering, PH Capital, MoldTek Technologies, MoldTek Packaging Limited, etc have fixed record dates for stock split.\n\nThe Indian stock market ended lower for the seventh consecutive week. Nifty 50 closed 0.78% lower at 22,421.95 points, whereas BSE Sensex closed 0.60% lower at 71,909 points. The Indian stock market is likely to see heightened volatility in the upcoming week.\n\nFor Nifty 50, \u201ca move above Thursday\u2019s high of 22,610 will signal a pullback towards the 22,800 and 23,000 levels. However, for a meaningful trend reversal index would require forming a sustained Higher High\u2013Higher Low structure and reclaim the 23,000-23,100 level. Failure to move above 22,610 will lead to some consolidation in the range of 22,600-22,200 levels,\u201d explained Pabitro Mukherjee, Deputy Vice President-Research, Bajaj Broking.\n\nCatch all the Business News , Market News , Breaking News Events and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.\n\nLog in to our website to save your bookmarks. It'll just take a moment.\n\nOops! Looks like you have exceeded the limit to bookmark the image. Remove some to bookmark this image.", "source": "LiveMint Markets", "pub_date_str": "04 Oct 2026, 09:00 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Russia's 'New Doctrine' Meets Ukraine's Oil Strategy: The Escalation Dilemma", "full_content": "Ukraine vows to intensify strikes on Russian oil refineries after accusing Moscow of expanding attacks on civilian infrastructure. The escalation threatens to further complicate U.S.-backed peace efforts.", "source": "NDTV Profit", "pub_date_str": "04 Oct 2026, 08:47 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Australia\u2019s Chalmers blames U.S.-Iran war for higher inflation, borrowing costs", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Oct 2026, 08:11 AM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Drishyam 3: The Conclusion Box Office Collection Day 2: Ajay Devgn Film Maintains Strong Momentum\u2014 Check Earnings", "full_content": "Directed by Abhishek Pathak, the film stars Ajay Devgn as Vijay Salgaonkar, Tabu as Meera Deshmukh and Jaideep Ahlawat as SP Rajveer Singh Tomar.", "source": "NDTV Profit", "pub_date_str": "04 Oct 2026, 08:10 AM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Chinese savers want to invest in US stocks. Now there\u2019s an easier way.", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nChinese savers who want a piece of Nvidia stock no longer necessarily need an offshore brokerage account. Increasingly, they can buy it through a fund approved by Beijing.\n\nThat distinction is becoming important as China\u2019s households search for somewhere to put the cash they accumulated during the property bust. Deposit rates at the country\u2019s biggest banks have fallen below 1% for a one-year term, while authorities are simultaneously cracking down on unlicensed routes used by mainland investors to trade overseas.\n\nThe result is an unusual compromise: Beijing is tightening enforcement around offshore trading in some places while widening regulated channels that give Chinese investors exposure to U.S. stocks, Treasuries, gold and other global assets.\n\nFew funds illustrate the shift better than Pictet Strategic Income. The Hong Kong-domiciled fund has grown to $5.1 billion from $1.6 billion at the start of this year. Roughly 60% of its assets now come from mainland Chinese retail investors through the Mainland-Hong Kong Mutual Recognition of Funds program.\n\nIn the first half alone, the fund attracted HK$16.3 billion ($2.1 billion), in net mainland inflows, the most among 34 funds tracked by Morningstar. An August portfolio update showed top holdings including U.S. Treasuries and gold, as well as Amazon.com, Alphabet and Nvidia. The fund returned 17% through August after gaining 18% last year.\n\nThose numbers are still small beside China\u2019s enormous pool of household savings. Chinese households added another 6.99 trillion yuan to bank deposits in the first eight months of this year, according to the People\u2019s Bank of China. But the direction of travel matters.", "source": "LiveMint Markets", "pub_date_str": "04 Oct 2026, 07:56 AM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Alternative Investments", "Portfolio Management"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "PF withdrawal done, pension forgotten? Why your EPS service record still needs to be transferred and how to do it", "full_content": "Many employees withdraw their provident fund balance after switching jobs and assume there is nothing else left to transfer, leaving the old account behind. However, their Employees\u2019 Pension Scheme (EPS) service is tracked separately, and failing to carry forward this service history when changing jobs could affect the pension benefits they may be entitled to later.\n\nEPF and EPS are part of the same social security framework, but they serve different purposes. While EPF helps build a retirement corpus through contributions and interest and can also provide financial support during certain emergencies, EPS primarily tracks an employee\u2019s eligible pensionable service.\n\nGenerally, a longer eligible service period can result in the employee receiving higher pension benefits after they retire.\n\nWhen an employee withdraws their EPF balance, their EPS service history does not automatically get transferred. Hence, when you switch jobs, it is important to ensure that your pensionable service from previous employment is properly linked to your current EPF account.\n\nThis matters because EPS eligibility is based on your total eligible pensionable service. Employees generally need at least 10 years of eligible service to qualify for a monthly pension. If your service records are not properly carried forward, your employment history could appear incomplete.\n\nThe EPS contribution rate is 8.33% of the monthly wages, which is diverted directly from the employer's total 12% contribution to the employee's EPF account. An employee does not have to contribute towards EPS.\n\nEven if you have already withdrawn your entire EPF balance but later realise that your EPS service history was not carried forward, you are not without options.\n\nAn employee can transfer their service record later after submitting Form 13 through the EPFO member portal and complete the transfer process.", "source": "LiveMint Money", "pub_date_str": "04 Oct 2026, 07:30 AM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Financial Statement Analysis", "Derivatives", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "What life insurers actually pay for", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nIn fiscal year 2025 (FY25), life insurers paid out \u20b9 6.3 trillion in benefits, according to the insurance regulator's September 2026 consultation paper on distribution costs. Of this, death claims accounted for \u20b9 0.47 trillion, or a mere 7%. Maturity benefits took 35%, surrender payouts 37%, and annuity and pension payments the remaining 20%.\n\nRead that again. Money paid to customers who gave up their policies far exceeds the money paid to families of customers who died. Surrender payments alone are five times larger than death claims.\n\nThe numbers from Irdai's consultation paper deserve far more attention than the new commission rates that everyone, including me, quickly wrote about. The payoff from digging into this 120-page paper is remarkable: it contains unusually revealing data about an industry whose underlying economics are often difficult to see.\n\nThese numbers should make an industry\u2014and its regulator\u2014uncomfortable. Life insurance exists, at least in part, to protect families from the financial consequences of a breadwinner's death. Yet death payouts are a small fraction of the industry's total benefits paid. Maturity benefits alone are nearly five times death benefits. Whatever else the industry is doing, insuring against death appears to be a relatively small part of the outcome.\n\nOverall, 61st-month persistency across the industry is just 48%, meaning fewer than half of policies remain in force after five years. By the 10th year, the proportion of policies still in force is as low as 8% for some insurance companies.\n\nThat is a remarkable level of attrition. And there is a particularly interesting qualifier in the data.\n\nOnline policies, bought without agent involvement, have a 61st-month persistency rate of 71%. A policyholder who bought a policy without the same degree of sales intervention is much more likely to keep it.", "source": "LiveMint Money", "pub_date_str": "04 Oct 2026, 07:00 AM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Fixed Income", "Portfolio Management"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Falling wages, soaring energy prices and inflation: It\u2019s beginning to look a lot like the 1970s", "full_content": "Is it time to dust off the financial playbook from that dismal decade?", "source": "MarketWatch Top Stories", "pub_date_str": "04 Oct 2026, 05:28 AM IST", "pub_date_relative": "7h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Corporate Actions This Week: NMDC, Accelya Solutions, PH Capital, PTC India \u2014 Check Full List Here", "full_content": "NMDC, PTC India, and Accelya Solutions India have scheduled dividend payouts this week, with Accelya offering one of the highest final dividends at Rs 35 per share.", "source": "NDTV Profit", "pub_date_str": "04 Oct 2026, 05:24 AM IST", "pub_date_relative": "7h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Ukraine will hit Russian refineries in response to Moscow's 'new doctrine' of airstrikes, Zelenskyy says", "full_content": "Ukraine will double down on attacking Russian oil refineries in response to a new policy of airstrikes by Moscow designed to force people to abandon Kyiv and other cities, but will not target civilians, President Volodymyr Zelenskyy said.\n\nUkraine's intelligence services have obtained documents showing that Russian leader Vladimir Putin had issued a \"new doctrine\" of military attacks on a much broader range of civilian targets ahead of this winter, Zelenskyy said.\n\n\"We saw documents and we know that they allow them to attack infrastructure, logistics, and especially to attack in the cities, in the villages, everywhere, roads, schools, hospitals,\" Zelenskyy told Reuters in an interview. \"To pressure people to leave the capital, leave different cities: this is the goal of the operation.\"\n\nDriving the shift in policy, Zelenskyy said, was Putin's desire to appear strong at a time when his military was losing ground in a key frontline region and sustaining higher levels of casualties.\n\nThe Kremlin was not available to comment on Saturday. But in a statement urging foreign nationals to leave Kyiv, the Russian Foreign Ministry said Moscow would continue to systematically hit targets in what it said were retaliatory strikes for Ukrainian attacks on Russia in recent months.\n\nZelenskyy said a successful Ukrainian counteroffensive, code-named \"Vivaldi,\" had recaptured around 140 sq km (54 sq miles) of Ukraine's eastern Donbas region and was still ongoing. Russia has said it must control Donbas in its entirety as a condition for any peace deal.\n\nIn recent weeks, U.S. President Donald Trump's administration has sought to revive talks to end the four-year-old conflict \u2014 Europe's bloodiest since World War II.\n\nThe U.S. leader last month urged Ukraine to refrain from hitting Russian oil installations, saying that was sending global diesel prices surging.", "source": "CNBC Top News", "pub_date_str": "04 Oct 2026, 04:14 AM IST", "pub_date_relative": "8h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "A $28 billion hemp THC industry is fighting to save itself from a looming federal ban - PBS", "full_content": "A $28 billion hemp THC industry is fighting to save itself from a looming federal ban PBS See more headlines & perspectives on Google News", "source": "Google News Business", "pub_date_str": "04 Oct 2026, 03:36 AM IST", "pub_date_relative": "8h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Tesla\u2019s Cybercab had a rocky first month in Austin. Now comes the hard part: expanding", "full_content": "In the month since Tesla's Cybercab rollout in Austin, the company has almost quadrupled the number of its driverless, bronze two-seaters authorized for commercial service in Texas. For Elon Musk to achieve his ambitions, growth has to pick up.\n\nThe unusual driverless vehicles, with no steering wheel, pedals, rear or sideview mirrors, or outside door handles, have received mixed reviews from paying passengers, who shared videos and posts online after the launch on Sept. 3. Criticisms have included lengthy wait times , pickups and drop-offs in the wrong place, and technical difficulties with the vehicles' butterfly doors o r trunk closing improperly.\n\nImproving its driverless technology and rapidly growing the Robotaxi service are key to Tesla's effort to reignite investor enthusiasm. Auto sales have been sluggish for an extended period, and the shares have been a loser on Wall Street this year, down 18%, the only megacap tech stock that's failed to generate positive returns for investors.\n\nOn Friday, Tesla reported better-than-expected third-quarter vehicle deliveries, lifting the stock almost 5%, but the company still posted a 2% year-over-year drop. Tesla's core automotive business has seen consecutive annual revenue declines as it faces pressure from Chinese EV makers like BYD and Xiaomi, which are selling more affordable, innovative models while Tesla ramps up exports to key markets, especially in Europe and Asia.\n\nMeanwhile, Alphabet's Waymo continues to open in new cities. It's now in 15 U.S. markets, with 15 more on the horizon, according to the company's website . It's also announced planned international launches in London, Tokyo and Munich.\n\nIn Texas, Waymo had 1,154 autonomous vehicles authorized for commercial use as of Friday, including 359 of its new Ojai models, which feature a low step and doors that slide open and shut.", "source": "CNBC World Economy", "pub_date_str": "04 Oct 2026, 01:59 AM IST", "pub_date_relative": "10h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "World's larges     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
