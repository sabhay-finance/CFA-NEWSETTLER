of investigations into the alleged Chinese espionage involving the company and others, as well as the possibility for data center moratoriums as Democrats take control of Congress and key governor posts in January.\n\n\"Am I as bullish on Nvidia now as I was on Friday? Of course not, you can't be,\" said Dan Niles, founder of Niles Investment Management, which counted Nvidia as its largest position as he bought on the dip over the last few weeks. \"I'm trimming back.\"\n\n\"All the same issues that were here before Jensen resigned are still here,\" he added.\n\nThe day before Huang resigned on Nov. 12 as CEO, Nvidia closed at $173.73. It's intraday high on Monday was $171.50, up from its recent low around $125 as it was selling off in the wake controversies. The VanEck Semiconductor ETF closed at $506.96 the day before his resignation. It reached a high of $469.35 before losing steam as trading wore on Monday.\n\nNvidia since Nov. 11 Mike Khouw, YieldMax strategist at Tidal Financial Group, told CNBC on Monday that there were \"sighs of relief,\" \"applause\" and even \"cheering\" among investors at the news of Huang's potential reinstatement. But he also said there are still considerable risks facing the AI trade.\n\nJensen Huang was not the only problem at Nvidia, he said, and there are still many vulnerabilities in the overall AI trade, which should give investors pause.", "source": "CNBC Top News", "pub_date_str": "24 Nov 2026, 04:13 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Trump made up to $15mn on Nvidia shares after Huang\u2019s return", "full_content": "Profit on 30% jump in chip group\u2019s share price based on maximum amount US president could have owned in latest disclosure", "source": "FT Markets", "pub_date_str": "24 Nov 2026, 03:51 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Nasdaq jumps 7% as Nvidia shares soar", "full_content": "Chip giant gains 31.5% after Huang reinstated while S&P rises 4.7%", "source": "FT Markets", "pub_date_str": "24 Nov 2026, 03:31 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "CNBC Points Pro: Should I keep or cancel my Amex Platinum Card?", "full_content": "Terms apply to American Express benefits and offers. Visit americanexpress.com to learn more.\n\nWelcome to the Points Pro, where I answer your credit card and travel rewards questions each week. If you have a question you'd like answered, you can submit it here .\n\nShould I keep my American Express Platinum Card\u00ae for Schwab ? The annual fee keeps increasing, and I'm not sure the benefits are worth it. But it's my oldest card, so I'm concerned about my credit score if I cancel.\n\nThe Schwab Amex Platinum is a co-branded version of the traditional American Express Platinum Card\u00ae . The benefits are largely the same, but you need an eligible Schwab account to qualify, and you can't downgrade it to a cheaper Amex card, like the American Express\u00ae Gold Card .\n\nSince the reader can't downgrade or product change to a more affordable card, she has to decide whether she's using enough of her Amex Platinum Card's benefits to make it worth paying for.\n\nYou can't beat the Amex Platinum Card's airport lounge access, which includes Amex Centurion Lounges, Delta Sky Clubs, Escape Lounges and more. (Enrollment required)\n\nYou may be eligible for as high as 175,000 Membership Rewards\u00ae points\n\nSee rates and fees , terms apply. Read our Amex Platinum Card review . The American Express Platinum Card\u00ae Welcome Offer: To view your personalized offer, you must first submit an application. If approved, you will: (1) receive your Welcome Offer details, (2) have the option to accept the Card with that offer, (3) be required to spend $12,000 on eligible purchases within the first 6 months of Card Membership, and (4) earn Membership Rewards\u00ae points. Welcome offers vary and you may not be eligible for an offer. If you're approved and accept your offer, a credit check may be conducted, which could impact your credit score. Terms apply.", "source": "CNBC Top News", "pub_date_str": "24 Nov 2026, 03:28 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Derivatives", "Alternative Investments"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "U.S. stocks see best day in more than a year, as return of Jensen Huang revives AI enthusiasm", "full_content": "Jensen Huang\u2019s return as CEO of Nvidia powered a massive bounce in the U.S. stock market on Monday by helping to restore faith in the artificial-intelligence trade.", "source": "MarketWatch Top Stories", "pub_date_str": "24 Nov 2026, 03:21 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Nvidia\u2019s 31% Surge Exposes Wall Street\u2019s Growing Stock Trap", "full_content": "Monday\u2019s spectacular stock rebound exposes the latest trap facing investors in a market dominated by a handful of technology giants: Selling them offers protection when markets plunge, but risks missing the recovery.\n\nNvidia Corp. surged 31% after Jensen Huang was reinstated as chief executive, accounting for more than two-fifths of the Russell 1000 Growth Index\u2019s gain and a quarter of the Nasdaq 100\u2019s advance. Just days earlier, the chipmaker had been at the center of a six-week selloff that brought the Nasdaq 100 to the brink of a bear market.\n\nThe swings have made a long-standing problem harder to manage. Fund managers who own less of the giants can cushion the damage in a selloff, only to fall behind when the same stocks rebound.\n\nThe numbers are stark. At the end of October, the 10 largest holdings in the Russell 1000 Growth Index accounted for 60% of its weight, twice their median share over the past three decades, according to data compiled by Bloomberg. Nvidia alone made up 15%. Over a stretch in which the benchmark entered a correction, nearly half its constituent stocks managed to rise. Yet gains across much of the index were no match for losses in the handful of stocks that carried the most weight.\n\nThe dilemma is growing. SpaceX and Anthropic have joined the public market, with OpenAI potentially next. As more of their shares become available to investors, some of the biggest IPOs in history could leave the benchmark even more dependent on the fortunes of the AI boom.\n\n\u201cAn overwhelming concentration in one particular industry or one particular sub-industry is a systematic risk,\u201d said Jacob Pozharny, co-chief investment officer at Bridgeway Capital Management. \u201cIt\u2019s when you have a shock to one stock and it has a magnifying effect across all other companies. Nvidia is an example of that.\u201d\n\nOnly a small fraction of Anthropic\u2019s shares are available to trade at first, and OpenAI could start out much the same way.", "source": "LiveMint Markets", "pub_date_str": "24 Nov 2026, 03:19 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Consumer stocks, seen as safe bet amid cracks in AI trade, were among the S&P 500\u2019s biggest losers Monday", "full_content": "Shares of Kroger and Tyson Foods fall, as Nvidia storms higher", "source": "MarketWatch Top Stories", "pub_date_str": "24 Nov 2026, 03:15 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "US moves to recover over $1B in crypto stolen by North Korean hackers in Binance heist - Fox Business", "full_content": "US moves to recover over $1B in crypto stolen by North Korean hackers in Binance heist Fox Business US files action to recover over $1 billion in cryptocurrency stolen in Binance hack Reuters US Seeks to Recover More Than $1 Billion From Binance Hack Bloomberg.com DOJ Aims To Recover $1.1 Billion From Binance Theft PYMNTS.com The Risk Beyond the Binance Hack Traders Magazine", "source": "Google News Business", "pub_date_str": "24 Nov 2026, 03:10 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Delta delays flights ahead of Thanksgiving holiday over system failure - Gothamist", "full_content": "Delta delays flights ahead of Thanksgiving holiday over system failure Gothamist Automation system problem at Delta causes flight delays as Americans travel for Thanksgiving AP News Delta Delays Flights as Thanksgiving Travel Begins, After Automated System Falters The New York Times Equipment outage in Atlanta causes over 1,600 Delta flight delays ABC News - Breaking News, Latest News and Videos Delta Resolves Automation Outage That Led to Over 1,000 Flight Delays WSJ", "source": "Google News Business", "pub_date_str": "24 Nov 2026, 03:08 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Oil Futures Extend Decline as Middle East Crude Continues to Flow - WSJ", "full_content": "Oil Futures Extend Decline as Middle East Crude Continues to Flow WSJ Oil Holds Decline on Signs of Continuing US-Iran Diplomacy Bloomberg.com Oil Prices Fall as Traders Weigh Supply Surplus, Gulf Attacks WSJ Oil drops on increased Middle East flows, Libyan pipeline restart CNBC Oil Markets Are Betting on a Surplus That Hasn't Arrived Yet Crude Oil Prices Today | OilPrice.com", "source": "Google News Business", "pub_date_str": "24 Nov 2026, 03:02 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Derivatives", "Alternative Investments"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Gold Rebounds as Huang\u2019s Return to Nvidia Revives Risk Appetite", "full_content": "(Bloomberg) -- Gold extended its rebound in a broad risk-on rally triggered by the reinstatement of Jensen Huang as chief executive officer of Nvidia Corp.\n\nThe precious metal rose as much as 4.3% to about $3,690 an ounce, following a near 9% drop last week to the lowest in more than a year. Copper, which has mostly traded in tandem with bets on the buildout of AI infrastructure, also rose sharply after the Nvidia announcement.\n\nBullion has fallen by around a third since the start of the US-Iran war in late February as higher energy costs fueled inflation and prompted central banks to raise rates. The metal dropped below $4,000 this month as cratering tech stocks pushed traders to liquidate holdings to cover losses elsewhere. That threshold was previously seen as a level of support for the metal.\n\nMuch of the recent selling in gold appears to have been concentrated in futures, according to UBS Group AG\u2019s Joni Teves. Exchange-traded fund holdings, by contrast, have remained \u201cremarkably steady,\u201d she wrote in a note.\n\nIn China, signs of retail dip-buying have already emerged. Shops in Shenzhen\u2019s Shuibei market, the epicenter of the country\u2019s retail gold trade, were packed with people seeking to purchase jewelry, according to Song Jiangzhen, a researcher at Guangzhou Southern Gold Market Academy. The interest is \u201cmostly driven by retail investors who see the current level as the floor,\u201d he said.\n\nStill, investors expect monetary policy to remain tight over the coming months, with a chorus of Fed officials voicing support for higher rates to combat sticky inflation.\n\nTreasury Secretary Scott Bessent warned that the Fed risks jeopardizing the US economy by over-tightening in response to the latest inflation data.", "source": "LiveMint Markets", "pub_date_str": "24 Nov 2026, 02:53 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics", "Fixed Income", "Derivatives", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Tech stocks see monster rally after Jensen Huang returns as Nvidia CEO", "full_content": "Major tech stocks rebounded across the board Monday, sharply reversing Friday's steep sell-off when artificial intelligence stocks fell in the Nasdaq's worst week since 2020.\n\nShares of Nvidia surged 31.48% after the company announced Monday morning that Jensen Huang was reinstated as CEO . The semiconductor giant gained back nearly $1 trillion in market cap, posting its best day since May 2003.\n\nNvidia's surge and Huang's reinstatement followed a more than 40% slump in the stock over the past month. The company has been embattled as reports surfaced about Huang's multiple extramarital affairs \u2014 one of which was with a woman U.S. intelligence reportedly believes to be a Chinese spy. Huang resigned as CEO of the company he founded on Nov. 12.\n\nThe Nasdaq Composite surged 6.51% Monday, for its best day since April 9, 2025. The Nasdaq slid 10% last week, with tech stocks having a rocky week as investors remained nervous about the valuation of some AI companies and business models. All three major averages ended last week in correction territory, and the Nasdaq turned negative for 2026.\n\nNvidia stock chart Shares of Big Tech companies and other stocks related to the AI trade saw a lift Monday on the Nvidia news.\n\nShares of Alphabet surged 6.34%, Meta gained 6.55%, Amazon jumped 3.47% and Microsoft increased 1.65%. SpaceX added 4.35%, Arm Holdings surged 16.08% and AMD added 6.85%. Dell and Micron posted some of the sector's biggest gains of the day, gaining 20.46% and 19.04%, respectively. The iShares Semiconductor ETF gained 13.63%.\n\nNeoclouds, which have seen a particularly choppy few months amid AI boom financing concerns, surged on Huang's reinstatement. Nebius soared 20.28%, CoreWeave gained 22.32% and Iren gained 23.86%.\n\nFollowing a brief premarket surge, Anthropic shares posted a decline of 1.43% in its third day of trading. Anthropic raised a record $93.5 billion in its IPO. The stock gained 17% in its debut on Thursday, before closing down 8.5% on Friday.", "source": "CNBC World Economy", "pub_date_str": "24 Nov 2026, 02:52 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Portfolio Management"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Short sellers get smoked as Nvidia tallies biggest one-day gain in stock-market history", "full_content": "Two products aiming to profit off daily declines in Nvidia shares were nearly wiped out as the stock rallied more than 30%.", "source": "MarketWatch Top Stories", "pub_date_str": "24 Nov 2026, 02:49 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Dow soars 1,400 points; Nasdaq surges 6% in its best day since April 2025 as Jensen Huang returns to Nvidia", "full_content": "U.S. equities surged on Monday after Nvidia reinstated Jensen Huang as CEO, reviving the artificial intelligence trade and pushing major indexes higher after all three major market averages ended Friday in a correction.\n\nThe S&P 500 added 4.73% to close at 7,237.17, and the Nasdaq Composite jumped 6.51% to end at 24,089.56. Both indexes posted their best daily performances since April 2025. The Dow Jones Industrial Average gained 1,447.98 points, or 3.01%, to settle at 49,595.31.\n\nNvidia soared 31% after the company's board returned Huang as the head of the company , effective immediately. Huang had resigned earlier this month after reportedly engaging in a number of extramarital affairs, one of which was with an alleged Chinese spy.\n\nPresident Donald Trump applauded the move and told CNBC that Huang \"did nothing wrong.\" The president also said that he spoke with Nvidia's board and \"convinced\" them to reinstate him.\n\n\"He had bad judgment having to do with somewhat unrelated incidents, but he did nothing wrong other than he created a chip that's invaluable, many chips that are invaluable,\" he told CNBC's Eamon Javers in a \" Squawk on the Street \" interview.\n\nOther stocks in the AI trade jumped in sympathy with Nvidia on Monday. Micron Technology added 19%, while CoreWeave skyrocketed 22%. Advanced Micro Devices was up almost 7%. \"Magnificent Seven\" members Alphabet and Meta Platforms popped 6% each, and Microsoft gained more than 1%.\n\n\"Jensen Huang's return restores and rebuilds confidence in the AI ecosystem: its major suppliers, its core building blocks, and its demand outlook,\" said Hendi Susanto, portfolio manager and research analyst at Gabelli Funds.\n\nTo be sure, the trade \"still has to push through a lot of noise about financing, geopolitics, durability and skepticism, even though companies across the AI supply chain keep reporting strong demand,\" Susanto added.", "source": "CNBC Top News", "pub_date_str": "24 Nov 2026, 02:40 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Jensen Huang reinstated as Nvidia CEO. Stock skyrockets 31%", "full_content": "Nvidia on Monday announced Jensen Huang has been reinstated as CEO , effective immediately, a dramatic twist in a scandal that hammered the chipmaker's stock price and rocked the tech and artificial intelligence industries.\n\nThe board of directors said it unanimously voted to reinstate Huang following \"a series of discussions and meetings\" with him. The board added that it \"received input from senior levels of the United States government\" and that it is confident Huang's reinstatement \"poses no national security risk.\"\n\nPresident Donald Trump told CNBC on Monday that he had been speaking to Nvidia's board \"directly and indirectly,\" and that Huang \"did nothing wrong.\" Trump said he talked to Huang on Sunday and asked him to promise to \"work hard.\"\n\nHuang resigned from his role as chief executive earlier this month after a series of shocking reports about multiple extramarital affairs, including one with an alleged Chinese spy. The New York Times reported on Sunday that the woman, Alice Huang, was in contact with an officer of China's Ministry of State Security during at least part of the time that she was engaging in a relationship with Huang.\n\nShares of Nvidia closed up 31% following Huang's reinstatement. The stock had shed nearly 33% from the time Huang admitted to an extramarital affair on Nov. 8. The stock closed at $186.64 on Nov.6.\n\n\"I am honored to return to NVIDIA and lead one of the most consequential technology companies in the world at the beginning of a new industrial revolution,\" Huang said in a statement. \"I take this responsibility with the greatest humility and renewed commitment. I want to thank the NVIDIA Board for its confidence and deliberation through this process.\"\n\nNvidia stock chart. Senior government officials briefed Nvidia's board late last week and communicated that no national security laws were violated, according to sources familiar with the discussion who asked to remain anonymous because they were not authorized to speak publicly.", "source": "CNBC World Economy", "pub_date_str": "24 Nov 2026, 02:38 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "CrowdStrike to buy Zscaler in $44 billion deal as AI supercharges cyberattacks", "full_content": "CrowdStrike plans to buy Zscaler for $43.9 billion in an all-stock deal that combines two significant security businesses at a time when artificial intelligence is supercharging attacks.\n\nShares of CrowdStrike dropped 9% on Monday, while Zscaler surged nearly 18%.\n\nThe deal is expected to close in the second half of CrowdStrike's fiscal year 2028. Under the agreement, Zscaler shareholders will receive 1.135 CrowdStrike shares for each share.\n\nCrowdStrike's acquisition pushes the Austin, Texas-based cyber vendor into the network security market and comes amid a massive year for cybersecurity deal-making in the wake of high-profile hacks like Hugging Face.\n\n\"With Zscaler, we're building cybersecurity's operating system: a single control plane to deploy AI, control AI, and enable any agentic application to run safely,\" CrowdStrike CEO George Kurtz said in a statement. \"We see a path to become the largest AI safety and security company the world has ever seen.\"\n\nRecent outages affecting Microsoft, the Federal Aviation Administration and JPMorgan Chase have sparked anxiety as businesses accelerate software patching and upgrades to aging systems in an effort to prevent bad actors from exploiting software vulnerabilities with AI.\n\nCrowdStrike has been a major beneficiary of skyrocketing demand for AI security, with shares soaring about 80% this year as of Monday's open. Zscaler shares are up about 5% year to date after Monday's surge. Their combined market value exceeded $265 billion as of Friday's close, behind market leader Palo Alto Networks at $282 billion.\n\nThe deal marks CrowdStrike's biggest acquisition to date and is among the largest in the sector as businesses consolidate and ramp up defenses to fend off AI-powered attacks.", "source": "CNBC World Economy", "pub_date_str": "24 Nov 2026, 02:34 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Fed's John Williams indicates higher interest rates likely 'over time' to address inflation", "full_content": "New York Federal Reserve President John Williams said Monday that policymakers have more work to do to bring inflation under control, though he indicated that further action can unfold over time as the economy continues to grow.\n\nIn remarks consistent with previous statements , the influential central banker expressed confidence that inflation will get closer to the Fed's 2% target in 2027 before hitting the goal the following year. He also said that while artificial intelligence is pressuring prices, there's \"little evidence\" it will be the source of more persistent inflation.\n\n\"But getting inflation back to 2% is 100% essential,\" he said in remarks at the University of Mount Saint Vincent in New York. \"We must take actions over time that will ensure that we get inflation back to our 2% goal in a timely manner and on a sustained basis. There is still work to do to get that done.\"\n\nThe comments come at a delicate moment for monetary policy, as the economy continues to grow and inflation stays well above the Fed's goal.\n\nFed officials have differed over how quickly to raise rates, with some advocating more aggressive action while others, including Williams, have emphasized a measured approach.\n\nWilliams ascribed the current inflation pressures to the conflict in Iran, demand for goods associated with the A     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
