ate_relative": "8m ago"}, {"title": "Domestic pharma market sustains growth momentum, but margins remain key", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nThe Indian pharma market (IPM) maintained its growth momentum in August despite a subdued showing from monsoon-linked therapies such as respiratory and anti-infectives. Growth was largely led by higher prices and new launches, which could signal a return of pricing power for pharma companies and aid performance in the September quarter (Q2FY27).\n\nIPM revenue grew 13% year-on-year (y-o-y) in August to \u20b9 24,800 crore, a tad lower than the 14% growth in July, according to Antique Stock Broking. On a moving annual turnover (MAT) basis, sales rose 12.3% y-o-y to \u20b9 2.7 trillion, compared with 7.8% in August 2025.\n\nAmong the top 15 companies, eight reported higher growth than IPM. Dr Reddy\u2019s Laboratories grew the fastest at 22% y-o-y, followed by Ajanta Pharma and Glenmark Pharmaceuticals at 20% each. Industry leader Sun Pharmaceutical Industries grew at a slower pace of 14%, though still ahead of the market.\n\nAugust growth was mainly led by price hikes and new launches, with volumes increasing by just 0.6%. Chronic therapies, which involve long-term medical treatments, grew 16%, while acute therapies, contributing about 60% of IPM revenue, grew at a slower rate of 11%.\n\nWithin the acute segment, respiratory and anti-infectives grew at only 3%, pointing to lower prevalence of these diseases during the monsoon-linked demand period.\n\nAmong individual therapies, anti-diabetics clocked the highest growth at 17%, aided by rising traction for GLP-1 (glucagon-like peptide-1) therapies. GLP-1 revenue stood at \u20b9 1,680 crore on a MAT basis versus just \u20b9 300 crore in August 2025, as per Antique. This steep jump follows the launch of generic versions of weight-loss drug Semaglutide in March.\n\nThe segment is witnessing a structural shift, with Kotak Institutional Equities projecting the overall GLP-1 market to reach \u20b9 15,700 crore by FY32, of which generics would form \u20b9 10,000 crore.", "source": "LiveMint Markets", "pub_date_str": "16 Sep 2026, 12:56 PM IST", "pub_date_relative": "12m ago"}, {"title": "India placed better in economy despite global challenges, says FM Sitharaman", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a No more tax wishlists? FM Sitharaman asks experts to make the case for what should go The Economic Times daily newspaper is available online now. Read Today's Paper No more tax wishlists? FM Sitharaman asks experts to make the case for what should go SECTIONS No more tax wishlists? FM Sitharaman asks experts to make the case for what should go ET Online Last Updated: Sep 16, 2026, 01:03:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Finance Minister Nirmala Sitharaman urged tax professionals and industry bodies to move beyond demands for exemptions and rate cuts, asking them to identify provisions that no longer serve the tax system, even when they benefit from them. She said India remains better placed economically despite global challenges and sought evidence-based tax reforms.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\nA different kind of buyback. Is this the beginning of these kinds of buybacks?\n\nCome January 2027, will India\u2019s online platforms get their own Tukaram?\n\nFour rules made HDFC Bank a compounder. All four have stopped. Can the new CEO rewrite them?\n\nGold rush on Dalal St as regional jewellers bid to be the next Tanishq\n\nHormuz is a state, not a strait. There are 10 other possible chokepoints for the global economy, including India\n\nChoose your reason below and click on the Report get 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "16 Sep 2026, 12:52 PM IST", "pub_date_relative": "17m ago"}, {"title": "UK inflation jumps to 3.1% as energy costs soar", "full_content": "The U.K.'s annual inflation rate jumped to 3.1% in August, pushed up by surging gasoline and diesel prices.\n\nThe print, which was in line with economists' expectations, marked the first inflation reading above 3% since March.\n\nThe country's Office for National Statistics (ONS) said that the spike was largely driven by rising motor fuel costs, which surged 23% year-on-year.\n\nThe average price of gasoline rose by 9.1 pence ($0.12) per liter between July and August, the ONS said, putting average prices at their highest since Nov. 2022. Meanwhile, average diesel prices rose by 14.2 pence per liter in August.\n\nInflation rose to 2.9% in July, as a government-regulated price cap on energy costs was revised sharply upward.\n\nPrices are continuing to rise as crude oil prices hover above $100 a barrel. Earlier this week, British motoring body the RAC said petrol and diesel prices had hit, since the Iran war began, with both fuels now at prices not seen in four years.\n\nThe U.K., a net importer of energy, is particularly vulnerable to external energy shocks. The country's inflation rate rose to 2.9% in July, as a government-regulated price cap on energy costs was revised sharply upward.\n\nIn August, the cost of electricity, gas and other household fuels jumped 6% year-on-year, the ONS said Wednesday.", "source": "CNBC Top News", "pub_date_str": "16 Sep 2026, 12:48 PM IST", "pub_date_relative": "20m ago"}, {"title": "SEBI said to ease arbitrage fund rules to aid closing auctions", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Mutual Funds \u203a Mutual Funds News \u203a SEBI said to ease arbitrage fund rules to aid closing auctions The Economic Times daily newspaper is available online now. Read Today's Paper SEBI said to ease arbitrage fund rules to aid closing auctions SECTIONS SEBI said to ease arbitrage fund rules to aid closing auctions By Samie Modak & Savio Shetty , Bloomberg Last Updated: Sep 16, 2026, 12:48:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis SEBI has allowed arbitrage mutual funds to temporarily carry unhedged positions of up to 1% of their plans, aiming to improve liquidity in the struggling stock closing auction. Arbitrage funds held combined assets of Rs 3 trillion at the end of August.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\nLooking for the best mutual funds to invest? Here are our recommendations.\n\n(Catch all the Mutual Fund News , Breaking News , Budget 2024 Events and Latest News Updates on The Economic Times .)\n\nSubscribe to The Economic Times Prime and read the ET ePaper online.\n\n(Catch all the Mutual Fund News , Breaking News , Budget 2024 Events and Latest News Updates on The Economic Times .)\n\nSubscribe to The Economic Times Prime and read the ET ePaper online.\n\nA different kind of buyback. Is this the beginning of these kinds of buybacks?", "source": "Economic Times Markets", "pub_date_str": "16 Sep 2026, 12:48 PM IST", "pub_date_relative": "21m ago"}, {"title": "SEBI is said to ease arbitrage mutual fund rules to aid closing auction session", "full_content": "India\u2019s market regulator is said to have given arbitrage mutual funds more flexibility in managing their positions, according to people familiar with the matter, seeking to draw a key source of liquidity into the struggling closing auction session for stocks.\n\nThe Securities and Exchange Board of India, or SEBI, has allowed these funds to temporarily carry unhedged positions of as much as 1% of their plans, said the people, who asked not to be identified because the details aren\u2019t public. Arbitrage mutual funds held a combined \u20b9 3 lakh crore ($31 billion) in assets at the end of August.\n\nThe relaxation is aimed at bringing liquidity into the closing auction session that has struggled to attract enough players since its launch on 3 August. Arbitrage mutual funds profit from price differences between the cash equities and futures markets, but requirements that they remain fully hedged have made it difficult for them to participate in the auction process.\n\nUnder the previous system, price swings in the final 30 minutes could create temporary gaps between cash shares and futures, giving arbitrage desks time to step in and close them.\n\nThe auction has shortened that window and increased the risk of a temporary mismatch. A fund may sell futures expecting to buy an equal amount of shares in the auction, only to find too few sellers in the cash market. The new 1% allowance lets funds carry that mismatch instead of staying fully hedged at all times.\n\nThe move adds to regulators\u2019 efforts to tackle one of the closing auction session\u2019s biggest challenges: a lack of liquidity . Several institutional investors have largely stayed away, citing thin volumes that aggravate price moves and make it harder to set stable end-of-day prices.", "source": "LiveMint Markets", "pub_date_str": "16 Sep 2026, 12:45 PM IST", "pub_date_relative": "23m ago"}, {"title": "Newly listed MV Electrosystems shares soar 10%: Stock jumps from \u20b9425 IPO price to \u20b9848 \u2014 what\u2019s driving the rally?", "full_content": "MV Electrosystems shares returned to the spotlight on Wednesday, September 16, with the recently listed stock witnessing a sharp intraday rally. The move came despite the scrip remaining below its recent peak and having registered a decline over the past week, while its performance since listing continues to stand out.\n\nThe small-cap stock surged 10% to hit a day's high of \u20b9 848.20 per share on the BSE. The move puts the stock within reach of its recent 52-week high of \u20b9 947.55, which it touched earlier this month on September 9. At the other end of its trading range, the stock hit a 52-week low of \u20b9 510 in August 2026.\n\nThe stock has lost 11% in 1 week, but has gained almost 39% in the last 1 month. Since its listing on August 6 this year, the stock has delivered an even stronger performance.\n\nAt the current price of \u20b9 848.20, MV Electrosystems shares have almost doubled from their IPO price of \u20b9 425, representing a gain of 95%.\n\nThe company's shares were listed on the NSE at \u20b9 520 per share, representing a 22.35% premium to the issue price. The \u20b9 290-crore issue had a price band of \u20b9 400-425 per share.\n\nOn the BSE, MV Electrosystems shares debuted at \u20b9 519 per share, translating into a 22.12% premium to the issue price.\n\nThe stock's latest move comes after the company announced that its 17th Annual General Meeting (AGM) will be held on Tuesday, September 29, 2026, at 11:00 AM.\n\nThe AGM agenda includes the adoption of the company's audited financial statements for FY26, along with approval of the appointments of Mohit Vohra and Sumit Dhawan as directors of the company.", "source": "LiveMint Markets", "pub_date_str": "16 Sep 2026, 12:44 PM IST", "pub_date_relative": "24m ago"}, {"title": "PNC Infratech shares slump 17% to fresh 52-week low | What\u2019s the reason?", "full_content": "PNC Infratech shares extended their sharp decline on Wednesday, 16 September, plunging 17% to hit a fresh one-year low of \u20b9 116.25. The latest fall takes the stock\u2019s two-day decline to 33.76%.\n\nThe sell-off followed the National Highways Authority of India (NHAI) extending a three-year debarment imposed on PNC Infratech\u2019s subsidiary and concessionaire, Awadh Expressway Private Ltd, to the parent company.\n\nIn a regulatory filing, PNC Infratech said it received an NHAI communication dated 11 September stating that Awadh Expressway Private Ltd would be barred from participating in bids floated by the Ministry of Road Transport and Highways (MoRTH), NHAI and their executing agencies for three years.\n\nNHAI subsequently extended the debarment to PNC Infratech in its capacity as promoter of the concessionaire, the company said.\n\nThe company said it is assessing the financial impact of the action and will provide further details once there is greater clarity. PNC Infratech also said it is evaluating legal remedies against the decision.\n\nAt the same time, the company clarified that the debarment would not affect its status as a going concern or the execution, operation and maintenance of its existing projects.\n\nThe NHAI action comes after damage to a section of the Kanpur-Lucknow Expressway, involving PNC Infratech\u2019s concessionaire Awadh Expressway. The highway authority had initially taken action against the subsidiary before extending the debarment to the parent company.\n\nPNC Infratech shares had already fallen sharply on Tuesday, declining as much as 20% intraday after news of the three-year debarment emerged.", "source": "LiveMint Markets", "pub_date_str": "16 Sep 2026, 12:44 PM IST", "pub_date_relative": "25m ago"}, {"title": "European stocks rise from 3-month lows as traders await high-stakes Fed decision", "full_content": "", "source": "Investing.com News", "pub_date_str": "16 Sep 2026, 12:43 PM IST", "pub_date_relative": "26m ago"}, {"title": "Supermarket Income REIT reports 27.5% shareholder return", "full_content": "", "source": "Investing.com News", "pub_date_str": "16 Sep 2026, 12:42 PM IST", "pub_date_relative": "26m ago"}, {"title": "Meta\u2019s Zuckerberg says AI labs have enough incentive to build safely", "full_content": "", "source": "Investing.com News", "pub_date_str": "16 Sep 2026, 12:42 PM IST", "pub_date_relative": "26m ago"}, {"title": "London Gas Oil tests resistance at $1,574: Live levels", "full_content":  PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India will soon introduce a merchant discount rate on UPI payments. This fee applies to transactions exceeding two thousand rupees with merchants. Some small merchants and rural areas will be excluded from this new charge. This move aims to make the UPI system more self-sustainable and expand its reach. Consumers are not expected to directly pay these new transaction fees.\n\nA different kind of buyback. Is this the beginning of these kinds of buybacks?\n\nCome January 2027, will India\u2019s online platforms get their own Tukaram?\n\nFour rules made HDFC Bank a compounder. All four have stopped. Can the new CEO rewrite them?\n\nGold rush on Dalal St as regional jewellers bid to be the next Tanishq\n\nHormuz is a state, not a strait. There are 10 other possible chokepoints for the global economy, including India\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers", "source": "Economic Times Economy", "pub_date_str": "16 Sep 2026, 12:26 PM IST", "pub_date_relative": "42m ago"}], "cfa": [{"title": "Godavari Biorefineries share price rallies 13% after Chinese patent grant | Do you own?", "full_content": "Godavari Biorefineries share price rallied as much as 13% to \u20b9 258.87 apiece on NSE in Wednesday's trading session after the company received a patent from the Chinese Patent Office.\n\nAccording to an exchange filing, the patent relates to the use of compounds that inhibit V-ATPase activity in cells, as well as their application in the production of medicines to treat viral infections, the company said.\n\nThe Chinese patent certificate attached to the filing states that the patent was granted on September 15, 2026. It bears patent number ZL 2021 8 0048053.9 and publication number CN 115867276 B. The patent application was filed on May 10, 2021.\n\nThe patent is owned by Godavari Biorefineries, with M. Atawar, S. Gawade, P. Kakkar and S. Srivastava named as inventors on the Chinese patent certificate.\n\nThe latest Chinese patent follows Godavari Biorefineries securing a patent from the Japan Patent Office a few months earlier for an invention related to cancer treatment.\n\nIn June 2026, the company announced that the Japan Patent Office had granted a patent titled \u201c5-Hydroxy-1,4-Naphthalenedione for Use in the Treatment of Cancer.\u201d Registered on May 26, 2026, the patent covers a class of compounds that Godavari Biorefineries said demonstrated inhibitory effects on cancer cells and cancer stem cells, including those associated with breast and prostate cancer.\n\nThe Japanese patent application was filed in October 2021 and listed Sandeep Gavade, Sangeeta Srivastava, Prashant Karkal and Maithili Athavale as the inventors.\n\nOn the earnings front, Godavari Biorefineries reported a wider loss of \u20b9 19.3 crore in Q1 FY27, compared with a loss of \u20b9 16 crore in the corresponding quarter of the previous fiscal year.", "source": "LiveMint Markets", "pub_date_str": "16 Sep 2026, 01:01 PM IST", "pub_date_relative": "8m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Domestic pharma market sustains growth momentum, but margins remain key", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nThe Indian pharma market (IPM) maintained its growth momentum in August despite a subdued showing from monsoon-linked therapies such as respiratory and anti-infectives. Growth was largely led by higher prices and new launches, which could signal a return of pricing power for pharma companies and aid performance in the September quarter (Q2FY27).\n\nIPM revenue grew 13% year-on-year (y-o-y) in August to \u20b9 24,800 crore, a tad lower than the 14% growth in July, according to Antique Stock Broking. On a moving annual turnover (MAT) basis, sales rose 12.3% y-o-y to \u20b9 2.7 trillion, compared with 7.8% in August 2025.\n\nAmong the top 15 companies, eight reported higher growth than IPM. Dr Reddy\u2019s Laboratories grew the fastest at 22% y-o-y, followed by Ajanta Pharma and Glenmark Pharmaceuticals at 20% each. Industry leader Sun Pharmaceutical Industries grew at a slower pace of 14%, though still ahead of the market.\n\nAugust growth was mainly led by price hikes and new launches, with volumes increasing by just 0.6%. Chronic therapies, which involve long-term medical treatments, grew 16%, while acute therapies, contributing about 60% of IPM revenue, grew at a slower rate of 11%.\n\nWithin the acute segment, respiratory and anti-infectives grew at only 3%, pointing to lower prevalence of these diseases during the monsoon-linked demand period.\n\nAmong individual therapies, anti-diabetics clocked the highest growth at 17%, aided by rising traction for GLP-1 (glucagon-like peptide-1) therapies. GLP-1 revenue stood at \u20b9 1,680 crore on a MAT basis versus just \u20b9 300 crore in August 2025, as per Antique. This steep jump follows the launch of generic versions of weight-loss drug Semaglutide in March.\n\nThe segment is witnessing a structural shift, with Kotak Institutional Equities projecting the overall GLP-1 market to reach \u20b9 15,700 crore by FY32, of which generics would form \u20b9 10,000 crore.", "source": "LiveMint Markets", "pub_date_str": "16 Sep 2026, 12:56 PM IST", "pub_date_relative": "12m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "India placed better in economy despite global challenges, says FM Sitharaman", "full_content": "Home ETPrime Markets Market Data Masterclass News In , "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "UK inflation jumps to 3.1% as energy costs soar", "full_content": "The U.K.'s annual inflation rate jumped to 3.1% in August, pushed up by surging gasoline and diesel prices.\n\nThe print, which was in line with economists' expectations, marked the first inflation reading above 3% since March.\n\nThe country's Office for National Statistics (ONS) said that the spike was largely driven by rising motor fuel costs, which surged 23% year-on-year.\n\nThe average price of gasoline rose by 9.1 pence ($0.12) per liter between July and August, the ONS said, putting average prices at their highest since Nov. 2022. Meanwhile, average diesel prices rose by 14.2 pence per liter in August.\n\nInflation rose to 2.9% in July, as a government-regulated price cap on energy costs was revised sharply upward.\n\nPrices are continuing to rise as crude oil prices hover above $100 a barrel. Earlier this week, British motoring body the RAC said petrol and diesel prices had hit, since the Iran war began, with both fuels now at prices not seen in four years.\n\nThe U.K., a net importer of energy, is particularly vulnerable to external energy shocks. The country's inflation rate rose to 2.9% in July, as a government-regulated price cap on energy costs was revised sharply upward.\n\nIn August, the cost of electricity, gas and other household fuels jumped 6% year-on-year, the ONS said Wednesday.", "source": "CNBC Top News", "pub_date_str": "16 Sep 2026, 12:48 PM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Economics", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "SEBI said to ease arbitrage fund rules to aid closing auctions", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Mutual Funds \u203a Mutual Funds News \u203a SEBI said to ease arbitrage fund rules to aid closing auctions The Economic Times daily newspaper is available online now. Read Today's Paper SEBI said to ease arbitrage fund rules to aid closing auctions SECTIONS SEBI said to ease arbitrage fund rules to aid closing auctions By Samie Modak & Savio Shetty , Bloomberg Last Updated: Sep 16, 2026, 12:48:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis SEBI has allowed arbitrage mutual funds to temporarily carry unhedged positions of up to 1% of their plans, aiming to improve liquidity in the struggling stock closing auction. Arbitrage funds held combined assets of Rs 3 trillion at the end of August.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\nLooking for the best mutual funds to invest? Here are our recommendations.\n\n(Catch all the Mutual Fund News , Breaking News , Budget 2024 Events and Latest News Updates on The Economic Times .)\n\nSubscribe to The Economic Times Prime and read the ET ePaper online.\n\n(Catch all the Mutual Fund News , Breaking News , Budget 2024 Events and Latest News Updates on The Economic Times .)\n\nSubscribe to The Economic Times Prime and read the ET ePaper online.\n\nA different kind of buyback. Is this the beginning of these kinds of buybacks?", "source": "Economic Times Markets", "pub_date_str": "16 Sep 2026, 12:48 PM IST", "pub_date_relative": "21m ago", "cfa_topics": ["Corporate Issuers", "Portfolio Management"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "SEBI is said to ease arbitrage mutual fund rules to aid closing auction session", "full_content": "India\u2019s market regulator is said to have given arbitrage mutual funds more flexibility in managing their positions, according to people familiar with the matter, seeking to draw a key source of liquidity into the struggling closing auction session for stocks.\n\nThe Securities and Exchange Board of India, or SEBI, has allowed these funds to temporarily carry unhedged positions of as much as 1% of their plans, said the people, who asked not to be identified because the details aren\u2019t public. Arbitrage mutual funds held a combined \u20b9 3 lakh crore ($31 billion) in assets at the end of August.\n\nThe relaxation is aimed at bringing liquidity into the closing auction session that has struggled to attract enough players since its launch on 3 August. Arbitrage mutual funds profit from price differences between the cash equities and futures markets, but requirements that they remain fully hedged have made it difficult for them to participate in the auction process.\n\nUnder the previous system, price swings in the final 30 minutes could create temporary gaps between cash shares and futures, giving arbitrage desks time to step in and close them.\n\nThe auction has shortened that window and increased the risk of a temporary mismatch. A fund may sell futures expecting to buy an equal amount of shares in the auction, only to find too few sellers in the cash market. The new 1% allowance lets funds carry that mismatch instead of staying fully hedged at all times.\n\nThe move adds to regulators\u2019 efforts to tackle one of the closing auction session\u2019s biggest challenges: a lack of liquidity . Several institutional investors have largely stayed away, citing thin volumes that aggravate price moves and make it harder to set stable end-of-day prices.", "source": "LiveMint Markets", "pub_date_str": "16 Sep 2026, 12:45 PM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Financial Statement Analysis", "Derivatives", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Newly listed MV Electrosystems shares soar 10%: Stock jumps fro r": "16 Sep 2026, 12:41 PM IST", "pub_date_relative": "27m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Explainer -- India's UPI MDR shake-up: What changes and why it matters", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Finance \u203a Explainer -- India's UPI MDR shake-up: What changes and why it matters The Economic Times daily newspaper is available online now. Read Today's Paper Explainer -- India's UPI MDR shake-up: What changes and why it matters SECTIONS Explainer -- India's UPI MDR shake-up: What changes and why it matters Reuters Last Updated: Sep 16, 2026, 12:26:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India will soon introduce a merchant discount rate on UPI payments. This fee applies to transactions exceeding two thousand rupees with merchants. Some small merchants and rural areas will be excluded from this new charge. This move aims to make the UPI system more self-sustainable and expand its reach. Consumers are not expected to directly pay these new transaction fees.\n\nA different kind of buyback. Is this the beginning of these kinds of buybacks?\n\nCome January 2027, will India\u2019s online platforms get their own Tukaram?\n\nFour rules made HDFC Bank a compounder. All four have stopped. Can the new CEO rewrite them?\n\nGold rush on Dalal St as regional jewellers bid to be the next Tanishq\n\nHormuz is a state, not a strait. There are 10 other possible chokepoints for the global economy, including India\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers", "source": "Economic Times Economy", "pub_date_str": "16 Sep 2026, 12:26 PM IST", "pub_date_relative": "42m ago", "cfa_topics": ["Quantitative Methods", "Corporate Issuers", "Alternative Investments"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "Nithin Kamath says new UPI charges on investing, broking don\u2019t make sense: 'I don't see how we can absorb this indefinitely'", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Nithin Kamath says new UPI charges on investing, broking don\u2019t make sense: 'I don't see how we can absorb this indefinitely' The Economic Times daily newspaper is available online now. Read Today's Paper Nithin Kamath says new UPI charges on investing, broking don\u2019t make sense: 'I don't see how we can absorb this indefinitely' SECTIONS Nithin Kamath says new UPI charges on investing, broking don\u2019t make sense: 'I don't see how we can absorb this indefinitely' By Debaroti Adhikary , ETMarkets.com Last Updated: Sep 16, 2026, 12:41:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Zerodha CEO Nithin Kamath said the new UPI MDR framework may not make economic sense for investing and broking, where customers can transfer funds without trading. He said brokers may struggle to absorb the costs indefinitely, particularly under quarterly settlement rules, and suggested a lower MDR with a transaction-level cap.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\nI think MDR on UPI was probably inevitable at some point, especially given how widespread UPI adoption has become. It could also lead to more competition, instead of just three apps accounting for more than 95% of the market. That being said, there are some use cases, like\u2026\n\n\ud83d\udc49 UPI Continues to Remain Free for Peer to Peer Transactions and 96% of Merchant Transactions \ud83d\udc49 The new UPI framework introduced has no impact on any person to person transactions \ud83d\udc49 UPI will continue to remain completely free for all person-to-person transactions,\u2026 pic.twitter.com/lYVzehs6lU\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "16 Sep 2026, 12:23 PM IST", "pub_date_relative": "45m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "BOJ expected to hike rates by 25 basis points to fresh three-decade high: CNBC survey", "full_content": "The Bank of Japan is likely to raise rates to 1.25% at the end of its two-day meeting on Friday amid inflationary pressures, according to a CNBC survey.\n\nA hike would signal an acceleration of the tightening cycle, faster than the six-month interval the Bank has been following since it started policy normalization in March 2024. The BOJ last raised rates in June.\n\nAround 89% of respondents said they expect the BOJ to hike by 25 basis points, citing higher inflation, higher wages, and pressure from the U.S. government.\n\nJapan's headline inflation rate for July hit its highest this year, at 1.9%, due to increased energy costs from the Iran war. In the same month, real wages rose 2.4%, rising for the seventh month in a row.\n\nThe U.S. has been vocal about Japan continuing its rate-hiking cycle, pressuring Prime Minister Sanae Takaichi's preference for an easy monetary policy and an expansionary fiscal policy. Most recently, Treasury Secretary Scott Bessent told BOJ Governor Kazuo Ueda to take \"decisive market and monetary steps\" at the G20 finance ministers and central bank governors meeting earlier this month. The U.S. favors a stronger yen, as a weak one could cause Japan to sell U.S. assets, including Treasurys, to shore up its currency. Such a move could push Treasury yields even higher. In late July, the two sides conducted a historic joint intervention to strengthen the yen.\n\n\"The Trump administration has effectively checked any potential move by a Takaichi administration to block the Bank of Japan from raising interest rates,\" said Takahide Kiuchi, executive economist at Nomura Research Institute and former BOJ policy board member. \"Consequently, the Bank of Japan has gained a free hand to proceed with rate hikes.\"\n\nBOJ board members have also made hawkish comments, leaving open the possibility of accelerated rate hikes.\n\nThe CNBC survey was conducted Sept. 9-14 among 18 economists and analysts.", "source": "CNBC Top News", "pub_date_str": "16 Sep 2026, 12:23 PM IST", "pub_date_relative": "46m ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Zee Entertainment shares surge 8% after 4-day losses; can it rise more? Experts decode", "full_content": "Zee Entertainment share price jumped 8% in intraday trade on the BSE on Wednesday, 16 September, reflecting healthy buying interest after the recent correction. Zee Entertainment shares opened at \u20b9 77.80 against their previous close of \u20b9 77.40 and jumped as much as 8% to an intraday high of \u20b9 83.62, looking set to snap its four-day losing run.\n\nZee Entertainment shares had been on a downtrend recently after the National Company Law Tribunal (NCLT) stayed an earlier order approving its founder Subhash Chandra\u2019s \u20b9 6.5 crore repayment plan.\n\nIn Zee founder Subhash Chandra\u2019s personal insolvency case , a resolution allowed \u20b9 22,006 crore in admitted bank claims to be settled for \u20b9 6.25 crore, effectively a 99.97% haircut.\n\nHowever, a five-member NCLT bench froze the settlement and Chandra\u2019s assets.\n\nZee Entertainment shares are down 14% so far in September after a 19% drop in August. The stock is down 10% year-to-date, hitting a 52-week low of \u20b9 68.10 on 23 March this year. The stock hit a 52-week high of \u20b9 121.75 on 22 September last year.\n\nAccording to Vipin Kumar, AVP-Research at Globe Capital Market, the stock remains locked in a persistent structural downtrend, consistently forming lower lows and lower highs while trading below its key short- and long-term moving averages (20-day, 50-day, and 200-day EMAs) since peaking near the \u20b9 562 mark in February 2018.\n\nMomentum indicators continue to reflect weak buying interest, rendering most rallies short-lived selling opportunities.\n\n\"A sustainable trend reversal appears unlikely until the stock establishes a definitive bottoming formation backed by strong volume expansion. Until then, any short-term upward bounce should be viewed as a temporary pullback within an overall bearish setup,\" said Kumar.", "source": "LiveMint Markets", "pub_date_str": "16 Sep 2026, 12:16 PM IST", "pub_date_relative": "52m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "\u201cBIGGEST CRASH IN HISTORY has started\u201d: Robert Kiyosaki warns investors as AI, war and debt fuel fears", "full_content": "A warning from one of the world's most recognisable personal-finance voices has once again put the idea of a historic market meltdown under the spotlight.\n\nRobert Kiyosaki, author of Rich Dad Poor Dad, has claimed that the \u201cbiggest stock and bond market crash in history\u201d has already begun, pointing to developments in Europe and Japan before warning that the turmoil could spread globally.\n\nIn a post on X, Kiyosaki linked the alleged downturn to several forces, including the AI frenzy, the war in Iran, excessive debt and the retirement of the Baby Boomer generation. He also warned people with retirement savings and investments could be particularly vulnerable, especially those aged over 40.\n\nKiyosaki's comments are his warning and outlook, rather than an independently established forecast of a market crash.\n\nKiyosaki said he had anticipated such a crisis more than two decades ago. He pointed to his 2002 book Rich Dad's Prophecy, saying it had been written to prepare readers for what he described as a historically significant stock and bond market crash.\n\n\u201cBIGGEST CRASH IN HISTORY has started. In 2002 I released RICH DADS PROPHECY. This book was written to prepare people to profit and not be victims of the biggest stock and bond market crash in history,\u201d Kiyosaki wrote.\n\nHe now argues that the scenario he had warned about has arrived in 2026, initially emerging in Europe and Japan and subsequently spreading across the world. His post did not provide specific market data or an economic model to substantiate the claim.\n\nKiyosaki also drew a comparison with the Great Depression, noting that the last depression lasted 25 years, from 1929 to 1954. He said people who were financially prepared, citing the Kennedy family as an example, were able to prosper during that period.", "source": "LiveMint Markets", "pub_date_str": "16 Sep 2026, 12:16 PM IST", "pub_date_relative": "52m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Fixed Income"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}], "updated_at": "16 Sep 2026, 01:09 PM IST", "total_stories": 399};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
