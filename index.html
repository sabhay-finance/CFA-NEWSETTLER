ing for a valuation of $1 trillion to $1.5 trillion, down from a target of $2 trillion that had been floated in recent months.\n\nFrom Wall Street to Main Street, it's becoming a tougher environment for Anthropic. The Nasdaq on Thursday suffered its steepest drop in 19 months, and it's down to start November after October marked its worst month since March 2025. Chipmakers and neoclouds, the companies most closely tied to the AI buildout, are getting hit the hardest.\n\nVoters rebuked AI in Tuesday's midterm elections, while sending Democrats to sweeping congressional victories across the country. Candidates who advocated for more stringent AI regulation won handily in states like Michigan, Ohio, Texas and Georgia, which will all now have Democratic governors, and local communities opposed data center-related ballot measures in 40 out of 41 cases .\n\nMore than half of voters said AI data centers were a \"crucial\" or \"major factor\" in who they supported for Congress, according to an exit poll from NBC News.\n\n\"People don't want a data center going near them if it's just going to house AI that's going to help a big tech company profit,\" Maura Austin, a behavioral scientist at the University of Virginia, told CNBC. \"What Anthropic is doing when they're going public with such a high valuation is they're really leaning into that big tech, billionaire kind of caricature. I expect that's not going to go well with the public.\"\n\nAnthropic has long tried to position itself as a safety-conscious company that takes AI's potential risks and benefits seriously.", "source": "CNBC World Economy", "pub_date_str": "07 Nov 2026, 06:30 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Cosm rides premium moviegoing wave with more immersive screenings and a wider library", "full_content": "The next big thing in premium large format theatrical viewing takes inspiration from the stars.\n\nCosm, an immersive entertainment technology company, got its start programming planetariums \u2014 its name a combination of \"cosmos\" and \"colosseum.\" The company's massive, domed screens first offered guests a view of the universe, now they mimic courtside seats at sports venues around the world and drop film fans into some of Hollywood's most iconic sets.\n\nAt a time when the theatrical industry is seeing its biggest growth from the sale of premium large format, or PLF, tickets , Cosm seeks to offer a fresh take on an elevated viewing experience. And it's quickly expanding both its footprint and its content library.\n\nSince 2024, Cosm has opened four theaters \u2014 near Los Angeles, Dallas, Atlanta and Detroit \u2014 with a Cleveland hub set to open in 2027. These experimental venues have garnered the attention of sports fans, screening live matchups in an arena-like environment. Showings often sell out, according to Cosm.\n\nMore recently, Cosm has partnered with Hollywood studios like Warner Bros., now a part of Skydance , to bring the likes of \"The Matrix,\" \"Willy Wonka & the Chocolate Factory,\" \"Harry Potter and the Sorcerer's Stone\" and \"It\" to its locations. Cosm recently signed a deal with Universal , which will bring \"Shrek\" to its domes in December.\n\nThe agreements mark a lucrative new chapter for the privately held Cosm, expanding its audience reach and viewing opportunities beyond timed, live events.\n\nAs a privately held company, Cosm doesn't disclose its financials. Tickets cost anywhere from $18 for a matinee to around $70 for prime seats or in-demand showings. That doesn't include added fees for concessions or items from special, themed menus tied to screenings.\n\nSony invested $100 million in the company in June, taking a minority stake and placing Sony Pictures Entertainment Chairman and CEO Ravi Ahuja onto its board of directors.", "source": "CNBC Top News", "pub_date_str": "07 Nov 2026, 06:30 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Anthropic\u2019s breakneck rise: What to know before the IPO", "full_content": "Anthropic began its journey as an under-the-radar research lab founded in 2021 by seven former OpenAI employees. Now, the company is poised to launch an historic public debut that could set the tone for the AI trade in 2027 and test investors\u2019 appetite for an entirely new asset class. CNBC explores Anthropic\u2019s rapid rise, its rivalry with OpenAI and its clash with the Pentagon, and what its public debut could mean for the AI trade.", "source": "CNBC Top News", "pub_date_str": "07 Nov 2026, 06:29 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Diwali cheer missing? Nifty lights up, but your portfolio may be burning; what's driving the disconnect? SAMCO explains", "full_content": "Stock Market Outlook : Investors wondering why their stock portfolios are not rising despite the recent rally in the benchmark Nifty 50 may be overlooking one crucial factor: the market's gains are concentrated in a handful of heavyweight stocks, while midcaps, smallcaps and microcaps continue to struggle.\n\nAccording to Apurva Sheth, Head of Market Perspectives & Research at SAMCO Securities, the divergence between the performance of largecap stocks and the broader market explains why many investors are yet to see meaningful gains in their portfolios.\n\nOver the past month, the Nifty Top 10 Equal Weight Index surged 10.64%, significantly outperforming broader market indices. The index comprises the 10 heavyweight stocks in the Nifty 50, with each constituent assigned an equal weight of 10% and the index rebalanced every six months.\n\nIn contrast, the Nifty Midcap 150 declined 2.74% during the same period. The Nifty Smallcap 250 also fell 2.74%, while the Nifty Microcap 250 dropped 5.32%.\n\nThis divergence indicates that the recent market rally has not been broad-based, with gains concentrated in India's largest companies rather than extending across market capitalisations.\n\nSheth identified two major factors behind the divergence, the first being a valuation catch-up among heavyweight stocks.\n\nLargecap stocks were among the worst performers during the preceding market correction, which had been underway since January 2026. The correction pushed several heavyweight companies to relatively attractive valuations , creating room for a rebound as selling pressure eased and valuations normalised.\n\nThe performance of the 10 constituents of the Nifty Top 10 Equal Weight Index highlights this recovery. ICICI Bank and Infosys gained 16% each over the past month, followed by Bharti Airtel, which advanced 14.61%. Kotak Mahindra Bank rose 10.08%, while HDFC Bank gained 10%.", "source": "LiveMint Markets", "pub_date_str": "07 Nov 2026, 06:00 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Diwali 2026 Muhurat trading: Why do NSE, BSE break the holiday rule for special live trading session? Explained", "full_content": "India\u2019s stock markets will open for a special shortened session on Sunday as the country celebrates Diwali, its biggest festival, keeping alive a tradition that has survived the shift from handwritten ledgers and bustling trading floors to smartphones and algorithms.\n\nKnown as Muhurat trading, the ceremonial session marks the start of a new Hindu calendar year, called Samvat, for many of India\u2019s trading communities. The idea is simple: begin the year with a transaction intended to bring prosperity.\n\nBut this year\u2019s celebration comes against a mixed market backdrop. While a recent rebound has turned India into a relative bright spot amid the global tech selloff, equity benchmarks are ending Samvat 2082 down more than 3%, their worst annual performance in over a decade. Domestic markets are little changed from levels seen during Muhurat trading day two years ago.\n\nHere\u2019s what to know about one of the most enduring traditions of the Indian stock market:\n\nMuhurat trading is a special stock market session held on Diwali, the Hindu festival of lights. \u201cMuhurat\u201d refers to an auspicious period for beginning something new. For many Gujarati and Marwari business families, Diwali traditionally marks the end of one commercial cycle and the beginning of another. Conducting a transaction at the start of the new year is considered auspicious.\n\nThis year, NSE and BSE will hold Muhurat trading on Sunday, Nov. 8. A pre-open session will run from 2:05 p.m. to 2:20 p.m., followed by trading from 2:20 p.m. to 3:30 p.m. The trades aren\u2019t just ceremonial as orders executed result in regular settlement obligations.\n\nFor generations, merchant families in parts of India have used Diwali to reconcile accounts and open new ledgers for the coming business year. Central to the custom is the worship of Lakshmi, the Hindu goddess of wealth and prosperity.", "source": "LiveMint Markets", "pub_date_str": "07 Nov 2026, 05:57 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Jammu and Kashmir Opens Door For Top Private Universities, Sets 25% Quota For Locals in Admissions and Jobs", "full_content": "Chief Minister Omar Abdullah said the rules are designed to improve transparency, accountability and academic quality.", "source": "NDTV Profit", "pub_date_str": "07 Nov 2026, 05:52 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "ONGC shares: Venezuela oil project hopes lift focus after Q2 results | Should you buy? Key levels to watch", "full_content": "Dhanya Nagasundaram Published 7 Nov 2026, 05:43 PM IST Prefer Livemint on Google Oil and Natural Gas Corporation ( ONGC) shares will remain in focus after the company's finance head, Anupam Agarwal, said it expects to secure operatorship rights for two Venezuelan oil projects within the next three to six months. The company is in advanced discussions with the Venezuelan and US authorities, Agarwal said during an analyst call on Friday, according to a Reuters report.\n\nThe development comes ahead of the special one-hour Diwali Muhurat Trading session on Sunday, 8 November, marking the beginning of the new Hindu financial year, Samvat 2083. Indian stock exchanges will remain open for the special session from 2:20 pm to 3:30 pm, despite Sunday being a regular market holiday.\n\nAccording to the Reuters report, ONGC Videsh, the overseas investment arm of ONGC, has more than $500 million in pending dividends from its stakes in two Venezuelan projects \u2014 the San Cristobal oilfield and the Carabobo 1 field.\n\nAgarwal said the pending dividends would be adjusted once the new operatorship agreements are finalised. Under the proposed arrangement, ONGC would move beyond its existing role as an investor to operate the projects and sell their output.\n\nThe arrangement also includes a provision that could allow ONGC to acquire stakes in additional Venezuelan oilfields, he said.\n\nAgarwal said ONGC expects to secure full operatorship of the San Cristobal project, in which it holds a 40% stake, while Venezuelan state-owned oil company PDVSA owns the remaining interest. In the Carabobo project, ONGC would take up joint operatorship alongside other investors.\n\nONGC and other Indian companies collectively hold an 18% stake in the Carabobo project, while Spain's Repsol owns an 11% interest.\n\nAgarwal also said production from Russia's Sakhalin-1 project, in which ONGC holds a 20% stake, averaged around 183,000 barrels per day during April\u2013September.", "source": "LiveMint Markets", "pub_date_str": "07 Nov 2026, 05:43 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Muhurat trading, Diwali 2026: Stocks to buy in Samvat 2083 - Blue Star, CESC, Delhivery, Ingersoll - check share price", "full_content": "CESC Sharmila Bhadoria Published 7 Nov 2026, 05:39 PM IST Prefer Livemint on Google Samvat 2082: Nifty 50 and Sensex saw their biggest weekly gains in years just before the start of Samvat 2083. As investors await the Muhurat trading session, PL Capital sees strong upside potential in select mid and small-cap stocks including Blue Star , CES , Delhivery and Ingersoll-Rand (India).\n\nThe brokerage sees up to 56% upside in these stocks. As Nifty 50 closed Samvat 2082 with nearly 2.59% loss, market experts believe that the coming Samvat will see strong growth supported by attractive valuations, robust corporate earnings and policy support.\n\nBlue Star share price closed 0.73% higher at \u20b9 1580 per share on BSE with a market capitalisation of \u20b9 32,487.14 crore on BSE on Friday. The stock has delivered -11.48% return in one year.\n\nThe company is well-positioned to capitalise on India\u2019s structural cooling demand, supported by low RAC penetration, market share gains and expanding distribution. The RAC industry is expected to grow by 25% in the financial year 2026-27, highlighted PL Capital in its report. The company is expected to witness strong traction in data centre MEP, with order bookings expected to reach data centre business.\n\nPL Capital gave a \u2018Buy\u2019 rating for the stock with a target price of \u20b9 1783 per share. \u201cWe expect Revenue/EBITDA/PAT CAGR of 17.6%/18.1%/23.2% over FY26-29E. We maintain our positive view on the stock with a SOTP-based TP of INR1,783, implying 40x Sep\u201928E EPS.\u201d\n\nCESC share price closed 3.11% lower at \u20b9 126.20 per share on BSE with an MCap of \u20b9 16,728.70 crore on Friday. The stock has delivered -28% return in one year. The company is likely to benefit from its expanding renewable energy portfolio, alongside stable cash flows from its core distribution and generation businesses.\n\nThe brokerage gave \u2018Buy\u2019 rating with a target price of \u20b9 204 per share.", "source": "LiveMint Markets", "pub_date_str": "07 Nov 2026, 05:39 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Muhurat trading 2026: 80% to 90% \u2014 will Sensex, Nifty improve decadal strike rate on ceremonial Diwali session?", "full_content": "Diwali Muhurat Trading 2026 guide: After a strong rally over seven straight sessions, the Indian stock market is set for the ceremonial Muhurat Trading session on Diwali, i.e., 8 November 2026. The Muhurat Trading session 2026 will begin at 2:20 PM and end at 3:30 PM. Ahead of the special session on Sunday, investors and market observers are busy guessing whether the key indices Nifty 50, Sensex and Bank Nifty will maintain their track record and end higher on Sunday's special session or not.\n\nAccording to data available on HDFC Sky, from 2006 to 2025, the Nifty 50 index closed lower than its previous close on just five occasions: 2007, 2009, 2012, 2016, and 2017. The 50-stock index has been finishing higher since 2018. The 30-stock index Sensex finished lower on just four occasions: 2007, 2012, 2016, and 2017. So, in the last ten years, both Nifty 50 and Sensex have ended higher for the last eight straight sessions, and the key indices have ended higher on 8 out of 10 Muhurat Trading sessions in the last 10 years. This means the decadal strike rate for both the Sensex and the Nifty is 80%, and market observers expect it to rise to 90%.\n\nWhether this winning streak for the last eight years would continue on the ceremonial Muhurat Trading 2026 session on Diwali 2026 date , Sumeet Bagadia, Executive Director at Choice Broking, said, \u201c The broader bias remains positive, although some profit booking or consolidation may follow the sharp rally.\u201d\n\nExpecting a positive Muhurat Trading session 2026 on Sunday, Ganesh Dongre, AVP \u2014 Equity Research at Anand Rathi, said, \u201cDuring Muhurat Trading sessions, buying takes more during the early session and profit-booking triggers at the end of the session. This means we can expect the key indices to open with an upside gap and end below their opening levels.", "source": "LiveMint Markets", "pub_date_str": "07 Nov 2026, 05:36 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Gold Rallies 3% In Five Days: Why Investors Shouldn't Chase The Recovery Yet", "full_content": "Gold has rebounded 3% in five sessions, but unresolved Iran tensions, firm oil prices and a hawkish Fed outlook could keep the metal under pressure. Why investors should remain cautious.", "source": "NDTV Profit", "pub_date_str": "07 Nov 2026, 05:20 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Dhanteras Boost: NSE Electronic Gold Receipts Hit Record 2.27 Lakh Units", "full_content": "On Dhanteras, NSE witnessed festive demand for EGRs, from across the country, which has been met by gold suppliers participating in the segment. The trading volumes in the NSE EGR segment touched a record 2,27,692 units.", "source": "NDTV Profit", "pub_date_str": "07 Nov 2026, 05:20 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Air pollution in India: Does health insurance cover pollution-related illnesses? What policyholders should know", "full_content": "With Diwali celebrations bringing families together, health protection deserves as much attention as festive shopping and financial planning. For people living in cities that regularly experience poor air quality , respiratory illnesses such as asthma, bronchitis, chronic obstructive pulmonary disease (COPD) and respiratory infections can be a particular concern, especially as pollution levels rise during the winter months.\n\nWhile health insurance can help cover the financial burden of hospitalisation due to respiratory complications, policyholders should not assume that every pollution-related medical expense will be reimbursed.\n\nShrish Mahuli, Chief Business Officer at SBI General Insurance, said claims arising from respiratory conditions are assessed based on the nature of the illness, the insured person's medical history and the applicable policy provisions. Policyholders should check waiting periods, exclusions and other conditions to understand the extent of their coverage.\n\nGenerally, health insurance policies cover medically necessary hospitalisation for respiratory conditions such as asthma, bronchitis, COPD and respiratory infections, subject to policy terms and conditions.\n\nHowever, coverage is primarily for eligible hospitalisation expenses and does not necessarily extend to routine outpatient treatment.", "source": "LiveMint Money", "pub_date_str": "07 Nov 2026, 05:00 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "From Diwali 2025 to Diwali 2026: How Sensex, Nifty 50, rupee, crude oil changed in Samvat 2082 | What lies ahead?", "full_content": "Dhanya Nagasundaram Published 7 Nov 2026, 04:48 PM IST Prefer Livemint on Google Samvat 2082 was a year of divergence across global and domestic financial markets, with Indian equities lagging several major international benchmarks even as commodities rallied sharply and the rupee weakened against the US dollar. The Nifty 50 declined 2.59% and the Sensex fell 3.35% between Diwali 2025 and Diwali 2026, while the Nifty Midcap 150 and Nifty Smallcap 250 managed modest gains of 0.90% and 0.29%, respectively. In contrast, Japan's Nikkei surged 13.08%, South Korea's KOSPI jumped 23.63% and the FTSE advanced 11.26%, reflecting stronger gains across major global markets.\n\nSectoral performance on Dalal Street remained sharply divided. Pharma and metal stocks led the rally, with the Nifty Pharma rising 24.77% and Nifty Metal gaining 21.71%, while FMCG, IT and realty stocks weighed on the market. At the individual stock level, BSE emerged as the top Nifty 50 performer with a 52.3% gain, whereas ITC plunged 30.94%, making it the biggest laggard.\n\nThe commodities market delivered an equally striking performance. Crude oil surged 54.11%, and copper gained 33.56%, while gold and silver advanced 2.25% and 8.16%, respectively. Adding to the pressure, the Indian rupee depreciated around 7.1% against the US dollar, with the exchange rate moving from approximately \u20b9 87.90 to \u20b9 94.14. The Diwali-to-Diwali comparison captures a year of uneven equity returns, a sharp commodity rally and currency weakness as Indian markets enter Samvat 2083.\n\nAccording to Nuvama Wealth Research, five potential catalysts could drive a resurgence in the Indian equity market during Samvat 2083 .\n\n1. India\u2013US trade deal: A catalyst for FII comeback: A favourable trade agreement between India and the US could boost foreign investor confidence, reduce policy uncertainty and revive foreign institutional investor (FII) flows into Indian equities.\n\n2.", "source": "LiveMint Markets", "pub_date_str": "07 Nov 2026, 04:48 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "AI Giants Could Face A Regulatory Reckoning As US Democrats Take Congress", "full_content": "US Democrats are preparing a sweeping AI regulatory push in 2027, targeting data-centre expansion, consumer electricity costs and corporate accountability.", "source": "NDTV Profit", "pub_date_str": "07 Nov 2026, 04:47 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Dalal Street Week Ahead: Nifty bulls come back to life, but 25,000\u201325,200 zone poses next test", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Dalal Street Week Ahead: Nifty bulls come back to life, but 25,000\u201325,200 zone poses next test The Economic Times daily newspaper is available online now. Read Today's Paper Dalal Street Week Ahead: Nifty bulls come back to life, but 25,000\u201325,200 zone poses next test SECTIONS Dalal Street Week Ahead: Nifty bulls come back to life, but 25,000\u201325,200 zone poses next test By Milan Vaishnav CMT MSTA , ET CONTRIBUTORS Last Updated: Nov 07, 2026, 04:37:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Mediu tions, while providing separate fast-track mechanisms for certain violations.\n\nThe SEBI (Settlement of Administrative and Civil Proceedings) Regulations, 2026, were notified on October 8 and replace the 2018 settlement regulations. Alongside the new framework, the regulator has made an online settlement application facility, a settlement amount calculator and frequently asked questions (FAQs) available on its website.\n\nFor entities and individuals facing regulatory proceedings, the changes are important because they specify how much applicants must pay, when they can seek settlement and which cases qualify for faster processing.\n\nThe revised regulations prescribe a non-refundable application fee of \u20b9 25,000 for natural persons and \u20b9 35,000 for other applicants.\n\nThis fee is separate from the settlement amount payable to resolve the proceedings.\n\nThe actual settlement amount will be calculated using a formula that considers the base amount, stage of proceedings, regulatory action, gravity of the alleged violation and aggravating and mitigating factors.\n\nSettlement amount = Base amount \u00d7 (Stage of proceeding + Regulatory action factor + Gravity factor + Aggravating factors \u2013 Mitigating factors).\n\nThe amount cannot fall below the applicable minimum of \u20b9 3 lakh or \u20b9 7 lakh.", "source": "LiveMint Money", "pub_date_str": "07 Nov 2026, 04:12 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Derivatives", "Ethical & Professional Standards"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Got Diwali bonus from your employer? Clear credit card dues or start mutual fund SIP: Which money move is right for you?", "full_content": "Have you received a Diwali bonus of \u20b9 10,000 from your employer? Before spending the festive windfall, consider whether you should use it to clear outstanding credit card dues or start a mutual fund systematic investment plan ( SIP ) to build long-term wealth.\n\nHere's what an expert suggests and how the numbers compare for each option.\n\nVedant Gupte, Co-Founder and CEO of investment platform Trackk, said Diwali bonus is a rare chance to reset your finances, and the smartest first move is almost always clearing any revolving credit card balance.\n\n\u201cCard interest can run upwards of 36% a year, a rate no mutual fund reliably beats, so paying it off is a guaranteed return no SIP can promise. Think of it as investing in your own balance sheet.\u201d\n\nOnce high-interest debt is cleared, commit to a SIP amount that you can sustain over the long term. Clearing debt first and investing with discipline thereafter is a prudent way to use a Diwali bonus, he added.\n\nConsider an illustrative example where you receive a Diwali bonus of \u20b9 10,000 and have an outstanding credit card balance of the same amount. Assume you convert this balance into a 12-month EMI at an annual interest rate of 20%.\n\nUsing the Diwali bonus to clear the outstanding balance would help avoid this interest cost, assuming the balance is eligible for full repayment without additional charges.\n\nOnce you have cleared your credit card dues using the Diwali bonus, you can redirect the monthly EMI amount you would otherwise have paid towards an equity fund SIP.", "source": "LiveMint Money", "pub_date_str": "07 Nov 2026, 04:10 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "NSE overhauls key trading rules: CAS, F&O expiry trading hours revised - What changes from December 7?", "full_content": "The NSE will overhaul the Closing Auction Session from December 7, shortening it to 10 minutes and revising closing-price discovery.&nbsp;", "source": "LiveMint Markets", "pub_date_str": "07 Nov 2026, 04:05     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
