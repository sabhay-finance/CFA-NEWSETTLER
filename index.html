    const allData = {"general": [{"title": "Midterm elections 2026 live updates: Economy, inflation and other voter concerns", "full_content": "Voters are at the polls on Tuesday, Nov. 3 to decide control of Congress , in an election that could define President Donald Trump 's final years in office.\n\nAll 435 House seats and 35 Senate seats are at stake, as Republicans try to defend narrow majorities in both chambers despite strong headwinds . Voter frustration with Trump's war in Iran , inflation , perceived government corruption and immigration policy could weigh down Republicans this cycle. But Republicans have the bulk of billionaire campaign spending, and Democrats have faced drama in the Alaska and Michigan Senate races in the waning days of campaigning.\n\nFiftyPlusOne projects Democrats have a significant edge in the House and are favored in the Senate , with key races tightening in recent weeks.\n\nIn the Senate, races in deep-red states such as Kansas , South Carolina and Nebraska could be in play, according to recent projections . Republicans could win in traditional Democratic strongholds such as Minnesota and New Hampshire. And toss-up races in states including Alaska, Iowa, Maine, Michigan, Ohio and Texas will determine who wins the gavels next Congress.\n\nIn the House, Republicans will find out if partisan redistricting in states including Texas and Florida that they'd hoped would net them nine seats actually pans out. And Democrats, who are hoping for a blue wave year, will try to knock off GOP candidates in districts that in past cycles were seen as out of reach .\n\nA Democratic win in either or both chambers would end unified Republican rule in Washington, disrupt the president's legislative agenda and begin a period of Democratic oversight and investigations aimed at the Trump administration, his associates and companies that have cozied up over the past two years.\n\nThe Trump administration's monthslong campaign to challenge how states conduct elections and push back against those efforts come to a head as well.", "source": "CNBC Top News", "pub_date_str": "04 Nov 2026, 01:39 AM IST", "pub_date_relative": "1m ago"}, {"title": "Earnings call transcript: Wajax misses Q3 2026 estimates as stock slips", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Nov 2026, 01:33 AM IST", "pub_date_relative": "7m ago"}, {"title": "Crude oil prices fall for second day as market hopes for diplomatic resolution to Iran war", "full_content": "Crude oil prices fell Tuesday for a second consecutive session, as the market hopes the U.S. and Iran will reach a diplomatic settlement to the conflict that has disrupted global energy supplies for eight months.\n\nU.S. West Texas Intermediate futures lost 37 cents to close at $96.09 a barrel after dipping below $95 earlier in the session. Brent crude , the international benchmark, shed $1.17 to settle at $103.60.\n\nThe move lower came after rumors circulated the U.S. and Iran were making progress toward a deal.\n\nOil sold off more than 7% on Monday after Washington and Tehran signaled they were both open to discussions to reach a settlement. President Donald Trump told reporters Tehran wants \"to make a deal and that could happen.\"\n\nQatar is continuing to mediate talks between the U.S. and Iran, the Gulf state's foreign ministry said Tuesday. A delegation from Qatar held talks in Tehran in an effort to reach an agreement that prevents further escalation in the region and ends the U.S.-Iran conflict, the foreign ministry said.\n\nHowever, Iran's Foreign Ministry spokesman Emsaeil Baqaei said Tuesday that Tehran will not accept diplomacy based on coercion, according to the state-owned media outlet Islamic Republic News Agency . It was unclear where talks actual stand.\n\nThe market had been pricing in the risk of escalation after the U.S. midterm elections , as reports circulated that Washington was drafting plans for strikes on Iran. Crude prices gained more than 10% in October in response.\n\nThe situation in the Middle East remains volatile and there's still substantial risk that fighting could break out. Washington attacked Iran's Qeshm Island on Monday, U.S. officials told The Wall Street Journal, adding that the U.S. has been carrying out \"limited strikes\" against the country in recent weeks.", "source": "CNBC Top News", "pub_date_str": "04 Nov 2026, 01:32 AM IST", "pub_date_relative": "8m ago"}, {"title": "S&P 500 Santa Claus rally: what history says and where the index stands", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Nov 2026, 01:31 AM IST", "pub_date_relative": "9m ago"}, {"title": "Texas race results could kick AI trade while it's already down", "full_content": "Gov. Greg Abbott is facing a surprisingly strong challenge that could have significant policy implications.", "source": "CNBC Top News", "pub_date_str": "04 Nov 2026, 01:31 AM IST", "pub_date_relative": "9m ago"}, {"title": "\u2018It\u2019s good to be old\u2019: I\u2019ve been invited to a dozen free meals that turn into annuity sales pitches. Should I stop going?", "full_content": "\u201cSalespeople typically push annuities, Medicare plans and estate-planning services.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "04 Nov 2026, 01:30 AM IST", "pub_date_relative": "11m ago"}, {"title": "An overlooked energy source could solve AI\u2019s power crunch \u2014 and these 2 stocks are prime plays", "full_content": "Geothermal technology is in the early stages of its own shale revolution, Morgan Stanley says.", "source": "MarketWatch Top Stories", "pub_date_str": "04 Nov 2026, 01:27 AM IST", "pub_date_relative": "14m ago"}, {"title": "Nasdaq rebounds as chip stocks bounce, Dow dragged lower by Apple: Live updates", "full_content": "The Nasdaq Composite rose on Tuesday as investors moved back into key technology stocks after recent pressure and geared up for U.S. midterm election results .\n\nThe tech-heavy index jumped 1.1%, recouping some of its latest losses. The Nasdaq-100 also rose 0.9% but still traded in correction territory, still down about 10% from its recent high. The S&P 500 climbed 0.6%, while the Dow Jones Industrial Average traded down 100 points, or 0.2%, weighed down by Apple shares.\n\nApple fell almost 2% after the iPhone maker issued a disappointing margin forecast late Monday and iPad sales in the fiscal fourth-quarter missed the Street's estimates.\n\nConversely, shares of chipmakers saw gains. Advanced Micro Devices \u2014 which releases its third-quarter results after the bell \u2014 gained 4%, while Broadcom rose more than 3%. Micron Technology and Nvidia each added more than 2%.\n\nTuesday's advance marks a reversal from the pullback seen Monday, which sent the Nasdaq down more than 1% and extended a recent retreat in the Nasdaq Composite and S&P 500 to a third day.\n\nWhile semiconductor makers \u2014 and others tied to artificial intelligence \u2014 showed signs of recovery Tuesday, Shawn Snyder of Potomac Fund Management believes the market is not out of the woods.\n\n\"The concerns about the cost of capital and the level of debt financing necessary [are] going to persist for quite some time,\" the economic strategist told CNBC. But the trade that relies on the artificial intelligence buildout could be getting close to oversold territory, he added, saying that \"maybe there's a little bit more downside, 4% or 5%, but eventually, if there's not a recession associated with these drawdowns, normally that's kind of where it stops.\"\n\nOil prices, meanwhile, turned lower on speculation there might be progress in U.S.-Iran negotiations. Brent crude was last down almost 1% at about $104 per barrel. West Texas Intermediate futures was little changed at around $96 per barrel.", "source": "CNBC Top News", "pub_date_str": "04 Nov 2026, 01:23 AM IST", "pub_date_relative": "17m ago"}, {"title": "Freedom Broker raises Climb Global Solutions price target on strong Q3 results", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Nov 2026, 01:22 AM IST", "pub_date_relative": "18m ago"}, {"title": "Freedom Broker downgrades PayPal stock rating on valuation concerns", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Nov 2026, 01:22 AM IST", "pub_date_relative": "18m ago"}, {"title": "Exclusive-Skydance shuffles distribution ranks as eight executives depart", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Nov 2026, 01:18 AM IST", "pub_date_relative": "22m ago"}, {"title": "Unitil Q3 2026 slides: $1.2B capital plan drives 6.5-8.5% rate base growth", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Nov 2026, 01:16 AM IST", "pub_date_relative": "24m ago"}, {"title": "Why is Hut 8 stock surging today?", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Nov 2026, 01:15 AM IST", "pub_date_relative": "25m ago"}, {"title": "New Jersey governor warns ports against accepting Russian diesel", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Nov 2026, 01:12 AM IST", "pub_date_relative": "28m ago"}, {"title": "Sen. Chris Murphy still hospitalized after suffering a stroke over the weekend", "full_content": "Sen. Chris Murphy remained hospitalized Tuesday after suffering a stroke over the weekend, his office confirmed.\n\n\"He's continuing to improve and heartened by the outpouring of well wishes,\" Josh Sorbe, Murphy's communications director, told CNBC in an emailed statement. \"He early voted in Connecticut, and he encourages everyone to make their voices heard today by voting and sending a message in this defining election.\"\n\nHis office did not offer additional details when asked about his status or his expected recovery.\n\nThe Senate is due back in session Monday following Tuesday's midterm elections.\n\nMurphy began experiencing stroke symptoms on Saturday while at his son's hockey game, his chief of staff Allison Herwitt said in a statement Sunday.\n\n\"He was taken to a local hospital, where it was discovered he had experienced a stroke. He was transferred to Johns Hopkins for further monitoring and is responding well to treatment,\" Herwitt said.\n\nJohns Hopkins Hospital's main campus is in Baltimore, though it has other locations in and around Washington.\n\nMurphy is not up for reelection on Tuesday but had been traveling extensively this fall in support of Democratic candidates. Murphy came to the Senate in 2013 after a six-year stint in the U.S. House . He's also been mentioned as a potential 2028 presidential candidate.", "source": "CNBC Top News", "pub_date_str": "04 Nov 2026, 01:06 AM IST", "pub_date_relative": "34m ago"}, {"title": "CrowdStrike launches AI kill switch that it says can stop internal agents that go rogue", "full_content": "CrowdStrike is betting that it has a solution to rogue artificial intelligence .\n\nThe cybersecurity vendor on Tuesday launched an AI kill switch designed to let security teams stop internal AI agents that go rogue, block them from relaunching and cut off their enterprise network access. The tool is built into CrowdStrike's Falcon Guardian platform, launched in September to secure AI agents. CrowdStrike also announced an integration with Anthropic's Claude Cowork .\n\n\"Having the ability to control and turn off, and make a decision and decide, I think that's really important for this next chapter of AI adoption,\" Chief Business Officer Daniel Bernard told CNBC.\n\nA string of recent high-profile cyber incidents has added urgency to calls for some kind of emergency shutdown mechanism.\n\nThe Hugging Face breach orchestrated by rogue OpenAI agents in July was particularly alarming for businesses. Last week, Binance disclosed the largest crypto cyberattack on record and hackers have recently targeted hundreds of refrigerators and freezers at supermarkets in France.\n\nOver the summer, U.S. representatives introduced bipartisan legislation that would require AI companies to build shutdown capabilities into their models.\n\nCritics argue, however, that an emergency stop button is far too complicated to implement across multiple systems, data centers and complex AI models.\n\nBernard said the kill switch operates like a light switch in systems where customers use its Falcon platform. The process can detect internal agent activity but requires a human to decide whether it's benign or malicious, he added.", "source": "CNBC World Economy", "pub_date_str": "04 Nov 2026, 01:05 AM IST", "pub_date_relative": "35m ago"}, {"title": "Festive demand lifts dry fruit, chocolate imports this season", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a Festive demand lifts dry fruit, chocolate imports this season The Economic Times daily newspaper is available online now. Read Today's Paper Festive demand lifts dry fruit, chocolate imports this season SECTIONS Festive demand lifts dry fruit, chocolate imports this season By Anoushka Sawhney & Kirtika Suneja , ET Bureau Last Updated: Nov 04, 2026, 01:05:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis During the festive season, India's import of tree nuts and chocolates rose significantly, reflecting a 10-12% annual demand increase. The reduction in goods and services tax has made these gourmet products more accessible to consumers. In 2025, dry fruit imports during this period accounted for a substantial share of annual purchases.\n\nSome elections matter more than you know: No crop changed in the fields, yet sugar, coffee and soya got cheaper in a day\n\nYou can buy a walkie-talkie online. But can you legally use it?\n\nKYB and KYC: Quick commerce, the Damani premium and what DMart must deliver \u2013 3rd and concluding part\n\nKYC and KYB: Inside Damani\u2019s DMart, the retail chain for the middle class. And stock for the long term? \u2013 Part 2 of 3\n\nWill it be a regulatory nightmare if an exchange lists on its own platform?\n\nKYC and KYB: Inside Damani\u2019s Avenue Supermarts that refuses to charge more \u2013 Part 1 of 3\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "04 Nov 2026, 01:05 AM IST", "pub_date_relative": "35m ago"}, {"title": "Earnings call transcript: Unitil beats Q3 2026 EPS forecast, revenue misses", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Nov 2026, 01:04 AM IST", "pub_date_relative": "36m ago"}, {"title": "OpenAI employees warned about operational security lapses for years, sources say", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Nov 2026, 01:01 AM IST", "pub_date_relative": "39m ago"}, {"title": "Election Day: Here is the No. 1 issue we're watching as a signal for stocks", "full_content": "Every weekday, the Investing Club releases the Homestretch; an actionable afternoon update just in time for the last hour of trading.", "source": "CNBC Top News", "pub_date_str": "04 Nov 2026, 12:59 AM IST", "pub_date_relative": "41m ago"}, {"title": "Pfizer hikes full-year outlook on new product growth, taps company veteran as new CFO", "full_content": "Pfizer on Tuesday reported fiscal third-quarter results that topped estimates and hiked its full-year outlook, as demand for its newly launched and acquired products grows.\n\nPfizer also Tuesday announced that Cecile Guegan , who has held various finance leadership roles at the company over the last two decades, stepped in as chief financial officer this month. She had served as interim CFO since August, when Pfizer's former CFO, Dave Denton, stepped down to take the same position at Nike.\n\nThe company is now expecting full-year revenue to total $62 billion to $64 billion, which compares with a previous outlook of $60.5 billion to $62.5 billion. The low end of that sales range would be roughly flat or down slightly compared with 2025 revenue of $62.6 billion. Still, Pfizer cited its \"strong year-to-date performance\" as a driver for the guidance hike.\n\nIn an exclusive interview with CNBC, Pfizer CEO Albert Bourla said the company's Covid product revenue was \"very low\" this quarter and year, but called it \"positive news for us.\"\n\n\"Covid revenues was an overhang on the performance of our stock because of the perception that it is volatile and it's material to us. Actually, we've proven that we can make it irrelevant,\" Bourla said. \"If anything, only an upside because, in the lowest possible Covid performance, we are beating, and we are raising by $1.5 billion because of the overperformance of the other products.\"\n\nPfizer reaffirmed its Covid product outlook of roughly $4 billion for the year, expecting the majority of Covid shot sales in the fourth quarter during vaccination season, Guegan said during the call.\n\nThe pharmaceutical giant now expects full-year adjusted profit of between $2.95 and $3.05 per share.", "source": "CNBC Top News", "pub_date_str": "04 Nov 2026, 12:55 AM IST", "pub_date_relative": "45m ago"}, {"title": "Shopify Stock Falls as Slowing Merchandise Sales Flash a Warning Sign - Barron's", "full_content": "Shopify Stock Falls as Slowing Merchandise Sales Flash a Warning Sign Barron's Shopify stock tanks as Q3 revenue, total order value miss Wall Street estimates Yahoo Finance Shopify falls 7% after Q3 revenue and merchandise volume miss estimates CNBC Shopify Sustains Rapid Growth with Revenue Up 32% and Free Cash Flow Margin of 22% Shopify Shopify Revenue Jumps 32% as Agent-Driven Commerce Surges PYMNTS.com", "source": "Google News Business", "pub_date_str": "04 Nov 2026, 12:54 AM IST", "pub_date_relative": "47m ago"}, {"title": "RBI eases forex rules for services exports and imports", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a RBI eases forex rules for services exports and imports The Economic Times daily newspaper is available online now. Read Today's Paper RBI eases forex rules for services exports and imports SECTIONS RBI eases forex rules for services exports and imports ET Bureau Last Updated: Nov 04, 2026, 12:53:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The changes form part of the Foreign Exchange Management (Export and Import of Goods and Services) which came into effect from October 1, 2026. Under the amended regulations, a resident individual exporting services will be deemed to have submitted the Export Declaration Form, or EDF, once the individual provides the authorised dealer bank with the information required to credit the payment to the exporter's account. No transaction-value threshold has been prescribed for resident individuals.\n\nSome elections matter more than you know: No crop changed in the fields, yet sugar, coffee and soya got cheaper in a day\n\nYou can buy a walkie-talkie online. But can you legally use it?\n\nKYB and KYC: Quick commerce, the Damani premium and what DMart must deliver \u2013 3rd and concluding part\n\nKYC and KYB: Inside Damani\u2019s DMart, the retail chain for the middle class. And stock for the long term? \u2013 Part 2 of 3\n\nWill it be a regulatory nightmare if an exchange lists on its own platform?\n\nKYC and KYB: Inside Damani\u2019s Avenue Supermarts that refuses to charge more \u2013 Part 1 of 3\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "04 Nov 2026, 12:53 AM IST", "pub_date_relative": "47m ago"}, {"title": "Medicare prescription drug costs will jump 50% in 2027. Doing nothing could cost you.", "full_content": "Don\u2019t sit on the sidelines during open enrollment.", "source": "MarketWatch Top Stories", "pub_date_str": "04 Nov 2026, 12:53 AM IST", "pub_date_relative": "48m ago"}, {"title": "Options traders are betting heavily on these stocks ahead of election results", "full_content": "With prediction markets pricing in a big victory for Democrats in Tuesday's midterm elections, traders are leaning into a group of stocks that investors often categorize as beneficiaries of left-wing leadership. Options trading in clean-energy stocks, particularly solar companies, surged on Tuesday, despite a five-month sell-off in the group that's left most of the companies in the industry group down on the year. Volume in the Invesco Solar ETF (TAN) surged to 40 times higher than usual Tuesday, according to Cboe LiveVol data. The fund, which typically trades fewer than 500 contracts a day the past month, traded more than 20,000 contracts by midday, and 99% of them were calls. The ETF rallied more than 400% from its pandemic low through the 2020 election before giving almost all of the gains back by April last year.\n\nInvesco Solar ETF (TAN), YTD The most popular trade in TAN was buying the 50-strike call for December expiry for 80 cents and looking for a 17% rally, according to SpotGamma data. For nearer expiry, the 46 and 47-strike calls were also popular. Among individual stocks, SolarEdge Technologies stands out, on pace for three times higher-than-average volume and more than 75% of trading in calls. The company reports earnings before the bell tomorrow and rallied more than 6% Tuesday. The most popular trade was buying the 35-strike call expiring Friday. \"I would only like solar if blue was in the White House,\" said Charlie Moon of Chicago-based Prosper Trading Academy. \"But Enphase does stands out with some insider buying.\" Bulls were indeed dabbling in Enphase Energy , whose stock fell 20% after earnings last week but have fully recovered since and rallied 9% Tuesday. On volume twice the average, traders likely bought 8,600 calls, compared to under 900 puts. The most popular trade in Enphase was to buy the 35-strike call expiring in January, a trade that costs $2.45 per contract and needs Enphase to rally 23%.", "source": "CNBC Top News", "pub_date_str": "04 Nov 2026, 12:52 AM IST", "pub_date_relative": "48m ago"}, {"title": "How Trump contesting midterm election results might disrupt the market", "full_content": "One scenario may not be getting enough attention from investors: a contested election.", "source": "CNBC Top News", "pub_date_str": "04 Nov 2026, 12:50 AM IST", "pub_date_relative": "50m ago"}, {"title": "Jim Cramer likes CrowdStrike's new 'AI kill switch' and the cyber stock", "full_content": "Jim Cramer sees the tool as a significant growth driver for CrowdStrike and a breakthrough for the broader industry.", "source": "CNBC World Economy", "pub_date_str": "04 Nov 2026, 12:46 AM IST", "pub_date_relative": "54m ago"}, {"title": "Job openings posted big September gain in positive sign for labor market ahead of payrolls report", "full_content": "Job openings surged in September, as did the number of workers who quit their positions, the Bureau of Labor Statistics reported Tuesday, while hiring also rose and layoffs dropped.\n\nIn its monthly look at labor market slack and worker mobility, the BLS reported job openings at 7.52 million, up 333,000 from August and well above the Dow Jones consensus outlook for 7.15 million.\n\nAs a share of the total workforce, the rate of job openings increased to 4.5%, up 0.2 percentage point from the prior month, according to the Job Openings and Labor Turnover Survey . There are now some 414,000 more job openings than workers classified as unemployed, or about 1.05 openings to every available worker.\n\nOpenings rose in manufacturing (54,000) as well as state and local government (108,000) and professional and business services (106,000).\n\nAt the same time, the total of employees leaving their jobs spiked to 3.36 million, an increase of 321,000 from August and the highest level since March 2025. Quits are considered a barometer for worker confidence in finding new jobs after leaving their prior positions.\n\n\"There are more job openings than unemployed people in the United States right now. That doesn't solve all problems, but it's a big change from a year ago,\" said Heather Long, chief economist at Navy Federal Credit Union. \"It's an encouraging sign that despite all the headwinds right now with high diesel and gas prices and ongoing inflation problems, companies are slowly increasing their hiring.\"\n\nHires rose on the month, up 131,000 to 5.4 million, while layoffs and discharges fell by 127,000 to 1.64 million, the lowest since March 2025.\n\nThe report comes ahead of the October nonfarm payrolls report, which the BLS will release Friday. The Wall Street consensus is for an increase of 59,000 after September eked out a gain of just 29,000, while the unemployment rate is figured to hold at 4.2%.", "source": "CNBC Top News", "pub_date_str": "04 Nov 2026, 12:45 AM IST", "pub_date_relative": "55m ago"}, {"title": "Corn futures hit four-month low on big US crop, export worries", "full_content": "CHICAGO, Nov 3 (Reuters) - Chicago Board of Trade corn futures fell to a four-month low on Tuesday while soybean futures set a 2-1/2-month low on expectations for large US crops and concerns over export demand, analysts said.\n\nWheat futures also declined as traders focused on plans for peace talks next week between Russia and Ukraine, both of which are large exporters.\n\nDisappointment over US corn export sales weighed on CBOT futures. The US Department of Agriculture has previously estimated that farmers this year produced the nation's second-largest corn crop on record, analysts said.\n\nThe USDA reported that exporters sold 315,000 metric tons of US corn to Mexico and 136,000 metric tons to South Korea for delivery in 2026/27. On Monday, the agency confirmed sales of 1.7 million metric tons to Mexico, including 1.1 million tons for 2026/27 delivery.\n\nHowever, demand is lagging last year's pace, said Rich Nelson, chief strategist at Allendale.\n\n\"We still have more ground to make up for what is a pretty disappointing export pace right now,\" Nelson said.\n\nCBOT corn was down 6 cents at $4.42-1/4 a bushel and touched its lowest price since July 2 in afternoon trading. Soybeans slid 4 cents to $12.12-3/4 a bushel and hit their lowest level since August 17.\n\nTraders were nervous about demand for US soybeans from nations other than China, the world's biggest importer, amid competition for global sales from Brazil, the top supplier, Nelson said.", "source": "LiveMint Markets", "pub_date_str": "04 Nov 2026, 12:38 AM IST", "pub_date_relative": "1h ago"}, {"title": "Sullivan: What the 2026 midterms could mean for energy investors", "full_content": "GET THIS IN YOUR INBOX FIRST: Subscribe to CNBC's \"Power Insider\" newsletter.\n\nDon't expect huge near-term moves in energy stocks off the results of the midterms. But there are some investing implications over the longer-term. Let me break it down.\n\nYes, it's entirely possible that one or both houses of Congress will shift to Democratic control. That's not my opinion. It's what many of the research reports, polls, and prediction markets are suggesting as of this writing.\n\nFor argument's sake, let's say that this time the polls are correct. The election ends with a \"blue trickle,\" and Democrats win out with a slight edge in the House, Senate, or both. It won't be enough to meaningfully change, well, anything. If the election ends with just a slight lean to the Democratic side, it won't be enough for a veto-proof majority. Candidates can specify policies \u2014 like halting the growth of data centers \u2014 all they want, but there's a chasm between being elected and passing new laws.\n\nResearch I've read and conversations we've had on CNBC suggest that the next two years in Washington, D.C., will be flush with finger-pointing, investigations into the president and his family, and posturing ahead of the far-more-important 2028 presidential election.\n\nS&P Global doesn't exactly agree with me, saying that Democratic control of either chamber would bring \"tougher oversight of agency decisions\" and could impact things such as tax incentives and \"other policies underpinning long-term energy investments.\"\n\nA Democratic Congress could be good for offshore wind, an energy source the president seems to hate with the white-hot passion of the sun. Speaking of the sun, a shift blue could also be positive for the continued growth of solar, perhaps via new tax incentives. Though both are growing rapidly.\n\nIf the Republicans maintain control over one or both houses, we keep doing more of the same, albeit with more urgency.", "source": "CNBC Top News", "pub_date_str": "04 Nov 2026, 12:33 AM IST", "pub_date_relative": "1h ago"}, {"title": "Taco Bell sales fall more than expected on cyclosporiasis outbreak hit", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Taco Bell sales fall more than expected on cyclosporiasis outbreak hit Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Taco Bell sales fall more than expected on cyclosporiasis outbreak hit SECTIONS Taco Bell sales fall more than expected on cyclosporiasis outbreak hit Reuters Last Updated: Nov 04, 2026, 12:32:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Yum Brands faced a setback in the third quarter as Taco Bell reported declining sales, primarily due to a cyclosporiasis outbreak that sparked customer concerns. While the outbreak severely impacted customer traffic, there was a notable recovery in sales during September and October. Although same-store sales remained flat, falling short of analysts' predictions, the company surpassed profit expectations, boosting investor trust in Yum Brands.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "04 Nov 2026, 12:32 AM IST", "pub_date_relative": "1h ago"}, {"title": "My wife and I have no kids and a 99% chance of outliving our life savings. Why not spend it all?", "full_content": "\u201cI\u2019m 68, she\u2019s 74, and we\u2019re both in good health.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "04 Nov 2026, 12:30 AM IST", "pub_date_relative": "1h ago"}, {"title": "Pfizer CEO Says Covid Is \u2018Irrelevant.\u2019 He\u2019s Betting on Cancer and Weight-Loss Drugs. - Barron's", "full_content": "Pfizer CEO Says Covid Is \u2018Irrelevant.\u2019 He\u2019s Betting on Cancer and Weight-Loss Drugs. Barron's Pfizer hikes full-year outlook as newer products grow, taps company veteran as new CFO CNBC Pfizer increases annual profit forecast amid solid demand for blood thinner drug Yahoo Finance Pfizer raises 2026 forecasts as Eliquis, cancer drugs drive third-quarter results Reuters Pfizer Raises Revenue Forecast, Extending Pharma Windfall Bloomberg.com", "source": "Google News Business", "pub_date_str": "04 Nov 2026, 12:25 AM IST", "pub_date_relative": "1h ago"}, {"title": "Ferrari raises 2026 guidance after Q3 earnings beat", "full_content": "Ferrari on Tuesday raised its 2026 guidance after the sports car maker slightly beat Wall Street's third-quarter expectations.\n\nHere's how Ferrari performed in the third quarter compared with average estimates compiled by LSEG:\n\nFerrari raised its guidance to revenue of 7.65 billion euros, up from 7.6 billion euros; adjusted earnings before interest, taxes, depreciation and amortization to 3 billion euros, up from 2.97 billion euros; and adjusted EPS to at least 9.85 euros, up from at least 9.68 euros.\n\nThe automaker also upgraded its expectations for industrial free cash flow to up to 1.65 billion euros, up from previous expectations for at least 1.55 billion euros.\n\nThis is the second consecutive quarter Ferrari has raised its 2026 guidance, despite vehicle shipments being lower by 318 units through the first nine months of the year, at 10,170 vehicles, compared with last year. The decline is led by fewer shipments to the Americas and China, Hong Kong and Taiwan.\n\nFerrari said Tuesday that the guidance improvements were a result of stronger-than-expected customer personalizations, lower than anticipated currency headwinds and a second place finish in the Formula 1 championship.\n\n\"Our order book now reaches into 2028, and we still have two more launches to come this year. In addition, we continue to create engaging events around the world to further tighten the bonds with our clients and partners across Racing, Sports Cars and Lifestyle,\" Ferrari CEO Benedetto Vigna said in a release.\n\nRBC Capital Markets analyst Tom Narayan said Tuesday that Ferrari's results were largely in line with Wall Street expectations. However, he said shares may be \"under slight pressure given some were hoping for a bigger guidance raise, but expect it to get better once folks realize these results are healthy.\"", "source": "CNBC Top News", "pub_date_str": "04 Nov 2026, 12:22 AM IST", "pub_date_relative": "1h ago"}, {"title": "Stock Market Today: Dow Dips, Palantir Fights Back; These Insurance Stocks Clear Entry Points (Live Coverage) - Investor's Business Daily", "full_content": "Stock Market Today: Dow Dips, Palantir Fights Back; These Insurance Stocks Clear Entry Points (Live Coverage) Investor's Business Daily Nvidia and other Big Tech stocks lift Wall Street and make up for a drop by Apple AP News Update: US Equity Indexes Mixed as Apple's Fiscal Q4 Disappoints While Investors Await Midterm Election Results Yahoo Finance S&P 500 Edges Up as Oil Falls on US Election Day: Markets Wrap Bloomberg.com Stock market to be jolted by Apple earnings, midterms, and October jobs report this week Business Insider", "source": "Google News Business", "pub_date_str": "04 Nov 2026, 12:22 AM IST", "pub_date_relative": "1h ago"}, {"title": "Festive season: Pistachio prices nearly double, almonds up 20% on West Asia crisis and US crop shortfall", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Agriculture \u203a Festive season: Pistachio prices nearly double, almonds up 20% on West Asia crisis and US crop shortfall The Economic Times daily newspaper is available online now. Read Today's Paper Festive season: Pistachio prices nearly double, almonds up 20% on West Asia crisis and US crop shortfall SECTIONS Festive season: Pistachio prices nearly double, almonds up 20% on West Asia crisis and US crop shortfall By Jayashree Bhosale , ET Bureau Last Updated: Nov 04, 2026, 12:16:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis \"Pistachio have been the game spoiler this year. The prices of pistachio from all origins including Iran, Afghanistan and California have increased,\" said Ravindra Mehta, member of central governing council at Nuts and Dry Fruits Council of India (NDFC-I). \"The current pistachio crop in California is expected to be only about 40% of last year, which has led to an increase of 50% in pista prices in the wholesale markets and even more in retail,\" he added.\n\nSome elections matter more than you know: No crop changed in the fields, yet sugar, coffee and soya got cheaper in a day\n\nYou can buy a walkie-talkie online. But can you legally use it?\n\nKYB and KYC: Quick commerce, the Damani premium and what DMart must deliver \u2013 3rd and concluding part\n\nKYC and KYB: Inside Damani\u2019s DMart, the retail chain for the middle class. And stock for the long term? \u2013 Part 2 of 3\n\nWill it be a regulatory nightmare if an exchange lists on its own platform?\n\nKYC and KYB: Inside Damani\u2019s Avenue Supermarts that refuses to charge more \u2013 Part 1 of 3\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "04 Nov 2026, 12:16 AM IST", "pub_date_relative": "1h ago"}, {"title": "What the midterm elections could mean for markets, debt - Fox Business", "full_content": "What the midterm elections could mean for markets, debt Fox Business Midterm elections could jolt stocks if Democrats sweep Congress CNBC How Wall Street analysts think the midterms could affect the stock market CBS News Wall Street braces as voters go to polls in high-stakes US midterm elections Financial Times What a Democratic sweep could mean for stocks \u2014 and why history says not much Yahoo Finance", "source": "Google News Business", "pub_date_str": "04 Nov 2026, 12:16 AM IST", "pub_date_relative": "1h ago"}, {"title": "US job openings jump in September; layoffs lowest in 1-1/2 years - Reuters", "full_content": "US job openings jump in September; layoffs lowest in 1-1/2 years Reuters Job openings posted big September gain in positive sign for labor market ahead of payrolls report CNBC Job openings and hiring edged higher in September, but it's still a 'low hire, low fire' market Yahoo Finance US job postings jumped sharply in September, potentially a good sign for anyone seeking employment AP News US Job Openings Jump to Four-Month High, Layoffs Decline Bloomberg.com", "source": "Google News Business", "pub_date_str": "04 Nov 2026, 12:15 AM IST", "pub_date_relative": "1h ago"}, {"title": "Binance co-CEO Richard Teng says hackers used fake job interviews, AI tool to steal $6.3 billion in crypto", "full_content": "Binance said hackers used fake job interviews, malicious software and compromised internal AI tools to infiltrate its wallet infrastructure, leading to the record-breaking Oct. 29 cyberattack that resulted in more than $6 billion in assets being stolen from the world's largest crypto exchange.\n\nThe attackers \"spent months building their way in,\" Binance co-CEO Richard Teng told CNBC's \" Squawk on the Street \" Tuesday, rejecting suggestions that there was a single point of failure through one employee's laptop.\n\n\"In June, [the attackers] set up a fake version of a developer tool and lured one of our engineers to install that,\" he added. \"In September they posed as recruiters and ran a series of job interviews with another engineer, and that ended up in a coding exercise that contained hidden malware designed to evade security ... from there they moved violently through our internal AI tools and obtain[ed] access that breach[ed] the system that authorized our wallet transaction.\"\n\nHe also said Binance has replenished 98% of $6.34 billion in affected assets, and that it is still in the process of purchasing outstanding, more illiquid assets.\n\nTeng himself did not attribute the attack to North Korea but acknowledged that the FBI has linked it to North Korean hackers tied to the TraderTraitor group.\n\nPreparations for the attack began in June, when a Binance Wallet DevOps engineer downloaded a tampered Homebrew installation \"to install a popular AI coding tool after searching for it on a search engine,\" according to a security report published by Binance Tuesday.", "source": "CNBC World Economy", "pub_date_str": "04 Nov 2026, 12:10 AM IST", "pub_date_relative": "1h ago"}, {"title": "Sugar Slides to Five-Week Low as High Indian Output Jolts Market", "full_content": "Sugar slid after data showed Indian production is running well ahead of last season, deepening a slump that has futures down more than 13% from last month\u2019s peak.\n\nRaw sugar futures in New York fell as much as 3.7% to their lowest intraday price since Sept. 23. White sugar in London was also down.\n\nIndia produced 845,000 tons of the sweetener this season to the end of October, more than eight times the output from the same period last year, data from the National Federation of Cooperative Sugar Factories Ltd. showed.\n\nWhile mills have been crushing cane earlier than last year and the Indian government has taken steps to stabilize local supplies, the data rattled a market where prices had surged because of tight stockpiles in the top sugar-consuming country.\n\nIndia\u2019s strong start to the season is not a surprise, according to Delhi-based analyst Harsh Soni of Greenleaf Consultancy. \u201cBut when reality strikes, markets react,\u201d he said.\n\nSugar had surged for much of the year, buoyed by fears that a super El Ni\u00f1o will curb yields and push the global market into a deficit. But the market has given back some gains as traders increasingly expect less demand for imports in India and also potentially more incentive for Brazilian producers to export given a recent rout of the country\u2019s currency.\n\nThe Brazilian real weakened again on Tuesday, which can encourage more farmer selling.\n\nThe selloff has been exacerbated by speculative funds, which recently piled into sugar to build their most bullish position in years, paring back those bets. The latest CFTC positioning report shows money managers trimming their net-long position to a four-week low through Oct. 27.", "source": "LiveMint Markets", "pub_date_str": "04 Nov 2026, 12:10 AM IST", "pub_date_relative": "1h ago"}, {"title": "Rs 9,000 crore land assets monetised so far in FY27", "full_content": "The NLMC, which is working under the aegis of the Department of Public Enterprises under the finance ministry, also has land assets worth another Rs 4,000-5,000 crore belonging to public sector undertakings (PSUs) in the pipeline. These are at various stages of processing, providing an additional pipeline of potential transactions.\n\nSome elections matter more than you know: No crop changed in the fields, yet sugar, coffee and soya got cheaper in a day\n\nYou can buy a walkie-talkie online. But can you legally use it?\n\nKYB and KYC: Quick commerce, the Damani premium and what DMart must deliver \u2013 3rd and concluding part\n\nKYC and KYB: Inside Damani\u2019s DMart, the retail chain for the middle class. And stock for the long term? \u2013 Part 2 of 3\n\nWill it be a regulatory nightmare if an exchange lists on its own platform?\n\nKYC and KYB: Inside Damani\u2019s Avenue Supermarts that refuses to charge more \u2013 Part 1 of 3\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "04 Nov 2026, 12:07 AM IST", "pub_date_relative": "1h ago"}, {"title": "Polymarket unit gets US industry organization's approval to be futures broker", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Polymarket unit gets US industry organization's approval to be futures broker Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Polymarket unit gets US industry organization's approval to be futures broker SECTIONS Polymarket unit gets US industry organization's approval to be futures broker Reuters Last Updated: Nov 04, 2026, 12:05:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Polymarket has received approval from the National Futures Association for PM Derivatives LLC to act as a broker. This approval allows the company to expand its operations if it obtains further approval from the Commodity Futures Trading Commission. The firm is actively under investigation by the CFTC regarding its marketing practices. Currently, Polymarket serves as a popular platform for betting on various events and elections.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "04 Nov 2026, 12:05 AM IST", "pub_date_relative": "1h ago"}, {"title": "Meta seeks to raise up to $25 billion in debt sale as AI spending jumps", "full_content": "Meta is seeking to raise between $20 billion and $25 billion in a bond sale on Tuesday as the company ramps up its spending on artificial intelligence infrastructure along with AI models and services.\n\nThe debt sale is expected to be two-thirds in U.S. dollars and one-third in euros, according to people familiar with the matter who asked not to be named because the details are private. Final pricing for the bond sale should come Tuesday afternoon, the sources said.\n\nMeta declined to comment. Bloomberg News first reported on Meta's plans.\n\nMeta's bond sale comes days after S&P Global Ratings revised the company's outlook from AA- stable to AA- negative, citing \"uncertainty\" about its hefty capex spending and negative free cash flow.\n\nIn its third-quarter earnings report last month, the Facebook parent revealed that its full-year capex will come in between $135 billion to $145 billion, representing a $5 billion increase to the low end of its previous guidance. Meta posted negative free cash flow of $2.12 billion for its latest quarter, joining Alphabet and Amazon in reporting a negative figure.\n\nMeta previously raised $25 billion in an April bond sale, and said last week that it plans to raise $95 billion in an effort to fund its AI initiatives. Of that, Meta intends to first raise $35 billion in underwritten public equity offerings, and an additional $60 billion through an at-the-market program.\n\nMeta's stock rose 2.7% on Tuesday after dropping in 12 of the prior 14 trading sessions and closing out October with its worst month in four years.\n\nWATCH : AI challenge is lack of compute in the marketplace: Plexo Capital's Toney .", "source": "CNBC World Economy", "pub_date_str": "04 Nov 2026, 12:03 AM IST", "pub_date_relative": "1h ago"}, {"title": "Wall Street braces as voters head to high-stakes polls", "full_content": "Vote will set the trajectory for everything from AI to public spending", "source": "FT Markets", "pub_date_str": "04 Nov 2026, 12:00 AM IST", "pub_date_relative": "1h ago"}, {"title": "Former Weil partners lawyer up over firm\u2019s wind-down - Financial Times", "full_content": "Former Weil partners lawyer up over firm\u2019s wind-down Financial Times Weil\u2019s dissolution would leave major lawsuits in transition Reuters Weil Gotshal Says It Is Shutting Its Doors WSJ Latham & Watkins Hires 5 Weil Trainees in Rescue Swoop Law.com Weil Gotshal\u2019s pending wind-down would hit around 50 jobs in Boston Boston.com", "source": "Google News Business", "pub_date_str": "04 Nov 2026, 12:00 AM IST", "pub_date_relative": "1h ago"}, {"title": "Stocks To Watch Today: NSE, Bata India, MCX, IEX, M K Sons Fine Jewels, Dabur India & More", "full_content": "Here's a look at stocks that are likely to be in focus during the trading session on Wednesday.", "source": "NDTV Profit", "pub_date_str": "04 Nov 2026, 12:00 AM IST", "pub_date_relative": "1h ago"}, {"title": "\u2018It seems bizarre\u2019: We\u2019re in our 80s with $950,000 in traditional IRAs. Why is our adviser pushing Roth conversions?", "full_content": "\u201cOur basic living expenses are covered by $110,000 in annual pensions and Social Security.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "04 Nov 2026, 12:00 AM IST", "pub_date_relative": "1h ago"}, {"title": "What the 2026 midterm elections could mean for Trump's final two years", "full_content": "Tuesday's midterm elections will at their heart determine control of Congress for the remainder of Donald Trump 's presidency. U.S. voters will decide whether Trump will maintain his Republican iron grip on Washington or recede into lame-duck status after a Democratic triumph.\n\nIf Republicans win, Trump could spend another two years facing little congressional resistance and pushing through major policy packages . If Democrats win one or both chambers, the president's remaining legislative priorities would be severely kneecapped, and even the basic functions of government could become gridlocked .\n\nOddsmakers and public polls placed Democrats in a favorable position ahead of Election Day, especially for flipping control of the Republican-held House. Still, the balance of power will not be decided until ballots are counted \u2014 a process that could take days or, in some cases, weeks to complete. The Senate is expected to be particularly close, and if the balance of power comes down to Alaska, the nation may have to wait while the state counts.\n\n\"The election results could trigger an immediate market reaction, particularly as the Senate outcome becomes clearer,\" the Washington Policy Strategy Group of Stifel wrote Sunday in an analyst report, where it predicted Democrats will win the House while the Senate remains too close to call. \"However, the market's knee-jerk trade could reverse as investors recognize that gridlock remains the most likely policy outcome in either case.\"\n\nRepublicans also control the Senate and with a larger majority than in the House.\n\nIf Democrats capture one chamber of Congress, Washington policymaking would become significantly more gridlocked. Single-party budget reconciliation bills, the procedural vehicle for most major spending and policy changes in the current status quo of tight congressional margins, would become impossible.", "source": "CNBC Top News", "pub_date_str": "03 Nov 2026, 11:59 PM IST", "pub_date_relative": "1h ago"}, {"title": "Once election results are in, here\u2019s what investors should focus on next", "full_content": "It is important to separate your political preferences from your investment and trading decisions.", "source": "MarketWatch Top Stories", "pub_date_str": "03 Nov 2026, 11:57 PM IST", "pub_date_relative": "1h ago"}, {"title": "Down 38% in 2026, Aditya Birla Real Estate gets Buy rating from Anand Rathi; 30% upside see", "full_content": "A Ksheerasagar Published 3 Nov 2026, 11:56 PM IST Prefer Livemint on Google Domestic brokerage firm Anand Rathi, in its latest note, has initiated coverage on Aditya Birla Real Estate with a 'Buy' rating and a target price of \u20b9 1,345 per share, indicating an upside potential of 30% from the stock's latest closing price.\n\nDespite the stock remaining under severe selling pressure and losing 38% of its value in 2026 so far to trade at around \u20b9 1,036 apiece, the brokerage remains confident about its long-term growth prospects.\n\nIt believes the company is positioned for renewed growth acceleration, citing expectations of a recovery in pre-sales, supported by the enhanced gross development value (GDV) of Niyaara Tower C and a stronger launch pipeline.\n\nAnand Rathi said that the company is transitioning from a Worli-led growth story to a diversified, capital-efficient real estate platform, with an expanding multi-city portfolio and commercial annuity assets.\n\nIt highlighted that Worli residential portfolio accounts for approximately \u20b9 243 billion (50%) of the company's approximately \u20b9 483 billion upcoming launch pipeline, making it the key contributor to near-term launch visibility, with the planned Tower C launch expected to drive the next phase of Worli-led growth.\n\nAnand Rathi said that following a sharp scale-up in pre-sales on the back of strong business development (BD) during FY23-25, a moderation in BD additions and deferment of the Niyaara Tower C launch to FY28 are likely to weigh on FY27 pre-sales.\n\nHowever, the brokerage believes the deferment is value-accretive, with the redesign and amalgamation of adjoining land parcels adding approximately \u20b9 19 billion to the overall Worli gross development value (GDV).\n\nWith approximately \u20b9 60 billion of BD additions year-to-date (YTD), a further \u20b9 600 billion opportunity pipeline and a stronger launch pipeline from FY28, Anand Rathi expects pre-sales to regain momentum, supporting management's target of \u20b9 150 billion by F.", "source": "LiveMint Markets", "pub_date_str": "03 Nov 2026, 11:56 PM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "Midterm elections 2026 live updates: Economy, inflation and other voter concerns", "full_content": "Voters are at the polls on Tuesday, Nov. 3 to decide control of Congress , in an election that could define President Donald Trump 's final years in office.\n\nAll 435 House seats and 35 Senate seats are at stake, as Republicans try to defend narrow majorities in both chambers despite strong headwinds . Voter frustration with Trump's war in Iran , inflation , perceived government corruption and immigration policy could weigh down Republicans this cycle. But Republicans have the bulk of billionaire campaign spending, and Democrats have faced drama in the Alaska and Michigan Senate races in the waning days of campaigning.\n\nFiftyPlusOne projects Democrats have a significant edge in the House and are favored in the Senate , with key races tightening in recent weeks.\n\nIn the Senate, races in deep-red states such as Kansas , South Carolina and Nebraska could be in play, according to recent projections . Republicans could win in traditional Democratic strongholds such as Minnesota and New Hampshire. And toss-up races in states including Alaska, Iowa, Maine, Michigan, Ohio and Texas will determine who wins the gavels next Congress.\n\nIn the House, Republicans will find out if partisan redistricting in states including Texas and Florida that they'd hoped would net them nine seats actually pans out. And Democrats, who are hoping for a blue wave year, will try to knock off GOP candidates in districts that in past cycles were seen as out of reach .\n\nA Democratic win in either or both chambers would end unified Republican rule in Washington, disrupt the president's legislative agenda and begin a period of Democratic oversight and investigations aimed at the Trump administration, his associates and companies that have cozied up over the past two years.\n\nThe Trump administration's monthslong campaign to challenge how states conduct elections and push back against those efforts come to a head as well.", "source": "CNBC Top News", "pub_date_str": "04 Nov 2026, 01:39 AM IST", "pub_date_relative": "1m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Earnings call transcript: Wajax misses Q3 2026 estimates as stock slips", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Nov 2026, 01:33 AM IST", "pub_date_relative": "7m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Crude oil prices fall for second day as market hopes for diplomatic resolution to Iran war", "full_content": "Crude oil prices fell Tuesday for a second consecutive session, as the market hopes the U.S. and Iran will reach a diplomatic settlement to the conflict that has disrupted global energy supplies for eight months.\n\nU.S. West Texas Intermediate futures lost 37 cents to close at $96.09 a barrel after dipping below $95 earlier in the session. Brent crude , the international benchmark, shed $1.17 to settle at $103.60.\n\nThe move lower came after rumors circulated the U.S. and Iran were making progress toward a deal.\n\nOil sold off more than 7% on Monday after Washington and Tehran signaled they were both open to discussions to reach a settlement. President Donald Trump told reporters Tehran wants \"to make a deal and that could happen.\"\n\nQatar is continuing to mediate talks between the U.S. and Iran, the Gulf state's foreign ministry said Tuesday. A delegation from Qatar held talks in Tehran in an effort to reach an agreement that prevents further escalation in the region and ends the U.S.-Iran conflict, the foreign ministry said.\n\nHowever, Iran's Foreign Ministry spokesman Emsaeil Baqaei said Tuesday that Tehran will not accept diplomacy based on coercion, according to the state-owned media outlet Islamic Republic News Agency . It was unclear where talks actual stand.\n\nThe market had been pricing in the risk of escalation after the U.S. midterm elections , as reports circulated that Washington was drafting plans for strikes on Iran. Crude prices gained more than 10% in October in response.\n\nThe situation in the Middle East remains volatile and there's still substantial risk that fighting could break out. Washington attacked Iran's Qeshm Island on Monday, U.S. officials told The Wall Street Journal, adding that the U.S. has been carrying out \"limited strikes\" against the country in recent weeks.", "source": "CNBC Top News", "pub_date_str": "04 Nov 2026, 01:32 AM IST", "pub_date_relative": "8m ago", "cfa_topics": ["Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "S&P 500 Santa Claus rally: what history says and where the index stands", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Nov 2026, 01:31 AM IST", "pub_date_relative": "9m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Nasdaq rebounds as chip stocks bounce, Dow dragged lower by Apple: Live updates", "full_content": "The Nasdaq Composite rose on Tuesday as investors moved back into key technology stocks after recent pressure and geared up for U.S. midterm election results .\n\nThe tech-heavy index jumped 1.1%, recouping some of its latest losses. The Nasdaq-100 also rose 0.9% but still traded in correction territory, still down about 10% from its recent high. The S&P 500 climbed 0.6%, while the Dow Jones Industrial Average traded down 100 points, or 0.2%, weighed down by Apple shares.\n\nApple fell almost 2% after the iPhone maker issued a disappointing margin forecast late Monday and iPad sales in the fiscal fourth-quarter missed the Street's estimates.\n\nConversely, shares of chipmakers saw gains. Advanced Micro Devices \u2014 which releases its third-quarter results after the bell \u2014 gained 4%, while Broadcom rose more than 3%. Micron Technology and Nvidia each added more than 2%.\n\nTuesday's advance marks a reversal from the pullback seen Monday, which sent the Nasdaq down more than 1% and extended a recent retreat in the Nasdaq Composite and S&P 500 to a third day.\n\nWhile semiconductor makers \u2014 and others tied to artificial intelligence \u2014 showed signs of recovery Tuesday, Shawn Snyder of Potomac Fund Management believes the market is not out of the woods.\n\n\"The concerns about the cost of capital and the level of debt financing necessary [are] going to persist for quite some time,\" the economic strategist told CNBC. But the trade that relies on the artificial intelligence buildout could be getting close to oversold territory, he added, saying that \"maybe there's a little bit more downside, 4% or 5%, but eventually, if there's not a recession associated with these drawdowns, normally that's kind of where it stops.\"\n\nOil prices, meanwhile, turned lower on speculation there might be progress in U.S.-Iran negotiations. Brent crude was last down almost 1% at about $104 per barrel. West Texas Intermediate futures was little changed at around $96 per barrel.", "source": "CNBC Top News", "pub_date_str": "04 Nov 2026, 01:23 AM IST", "pub_date_relative": "17m ago", "cfa_topics": ["Economics", "Corporate Issuers", "Equity Investments", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Freedom Broker downgrades PayPal stock rating on valuation concerns", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Nov 2026, 01:22 AM IST", "pub_date_relative": "18m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "CrowdStrike launches AI kill switch that it says can stop internal agents that go rogue", "full_content": "CrowdStrike is betting that it has a solution to rogue artificial intelligence .\n\nThe cybersecurity vendor on Tuesday launched an AI kill switch designed to let security teams stop internal AI agents that go rogue, block them from relaunching and cut off their enterprise network access. The tool is built into CrowdStrike's Falcon Guardian platform, launched in September to secure AI agents. CrowdStrike also announced an integration with Anthropic's Claude Cowork .\n\n\"Having the ability to control and turn off, and make a decision and decide, I think that's really important for this next chapter of AI adoption,\" Chief Business Officer Daniel Bernard told CNBC.\n\nA string of recent high-profile cyber incidents has added urgency to calls for some kind of emergency shutdown mechanism.\n\nThe Hugging Face breach orchestrated by rogue OpenAI agents in July was particularly alarming for businesses. Last week, Binance disclosed the largest crypto cyberattack on record and hackers have recently targeted hundreds of refrigerators and freezers at supermarkets in France.\n\nOver the summer, U.S. representatives introduced bipartisan legislation that would require AI companies to build shutdown capabilities into their models.\n\nCritics argue, however, that an emergency stop button is far too complicated to implement across multiple systems, data centers and complex AI models.\n\nBernard said the kill switch operates like a light switch in systems where customers use its Falcon platform. The process can detect internal agent activity but requires a human to decide whether it's benign or malicious, he added.", "source": "CNBC World Economy", "pub_date_str": "04 Nov 2026, 01:05 AM IST", "pub_date_relative": "35m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Festive demand lifts dry fruit, chocolate imports this season", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a Festive demand lifts dry fruit, chocolate imports this season The Economic Times daily newspaper is available online now. Read Today's Paper Festive demand lifts dry fruit, chocolate imports this season SECTIONS Festive demand lifts dry fruit, chocolate imports this season By Anoushka Sawhney & Kirtika Suneja , ET Bureau Last Updated: Nov 04, 2026, 01:05:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis During the festive season, India's import of tree nuts and chocolates rose significantly, reflecting a 10-12% annual demand increase. The reduction in goods and services tax has made these gourmet products more accessible to consumers. In 2025, dry fruit imports during this period accounted for a substantial share of annual purchases.\n\nSome elections matter more than you know: No crop changed in the fields, yet sugar, coffee and soya got cheaper in a day\n\nYou can buy a walkie-talkie online. But can you legally use it?\n\nKYB and KYC: Quick commerce, the Damani premium and what DMart must deliver \u2013 3rd and concluding part\n\nKYC and KYB: Inside Damani\u2019s DMart, the retail chain for the middle class. And stock for the long term? \u2013 Part 2 of 3\n\nWill it be a regulatory nightmare if an exchange lists on its own platform?\n\nKYC and KYB: Inside Damani\u2019s Avenue Supermarts that refuses to charge more \u2013 Part 1 of 3\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "04 Nov 2026, 01:05 AM IST", "pub_date_relative": "35m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Earnings call transcript: Unitil beats Q3 2026 EPS forecast, revenue misses", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Nov 2026, 01:04 AM IST", "pub_date_relative": "36m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Pfizer hikes full-year outlook on new product growth, taps company veteran as new CFO", "full_content": "Pfizer on Tuesday reported fiscal third-quarter results that topped estimates and hiked its full-year outlook, as demand for its newly launched and acquired products grows.\n\nPfizer also Tuesday announced that Cecile Guegan , who has held various finance leadership roles at the company over the last two decades, stepped in as chief financial officer this month. She had served as interim CFO since August, when Pfizer's former CFO, Dave Denton, stepped down to take the same position at Nike.\n\nThe company is now expecting full-year revenue to total $62 billion to $64 billion, which compares with a previous outlook of $60.5 billion to $62.5 billion. The low end of that sales range would be roughly flat or down slightly compared with 2025 revenue of $62.6 billion. Still, Pfizer cited its \"strong year-to-date performance\" as a driver for the guidance hike.\n\nIn an exclusive interview with CNBC, Pfizer CEO Albert Bourla said the company's Covid product revenue was \"very low\" this quarter and year, but called it \"positive news for us.\"\n\n\"Covid revenues was an overhang on the performance of our stock because of the perception that it is volatile and it's material to us. Actually, we've proven that we can make it irrelevant,\" Bourla said. \"If anything, only an upside because, in the lowest possible Covid performance, we are beating, and we are raising by $1.5 billion because of the overperformance of the other products.\"\n\nPfizer reaffirmed its Covid product outlook of roughly $4 billion for the year, expecting the majority of Covid shot sales in the fourth quarter during vaccination season, Guegan said during the call.\n\nThe pharmaceutical giant now expects full-year adjusted profit of between $2.95 and $3.05 per share.", "source": "CNBC Top News", "pub_date_str": "04 Nov 2026, 12:55 AM IST", "pub_date_relative": "45m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Shopify Stock Falls as Slowing Merchandise Sales Flash a Warning Sign - Barron's", "full_content": "Shopify Stock Falls as Slowing Merchandise Sales Flash a Warning Sign Barron's Shopify stock tanks as Q3 revenue, total order value miss Wall Street estimates Yahoo Finance Shopify falls 7% after Q3 revenue and merchandise volume miss estimates CNBC Shopify Sustains Rapid Growth with Revenue Up 32% and Free Cash Flow Margin of 22% Shopify Shopify Revenue Jumps 32% as Agent-Driven Commerce Surges PYMNTS.com", "source": "Google News Business", "pub_date_str": "04 Nov 2026, 12:54 AM IST", "pub_date_relative": "47m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "RBI eases forex rules for services exports and imports", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a RBI eases forex rules for services exports and imports The Economic Times daily newspaper is available online now. Read Today's Paper RBI eases forex rules for services exports and imports SECTIONS RBI eases forex rules for services exports and imports ET Bureau Last Updated: Nov 04, 2026, 12:53:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The changes form part of the Foreign Exchange Management (Export and Import of Goods and Services) which came into effect from October 1, 2026. Under the amended regulations, a resident individual exporting services will be deemed to have submitted the Export Declaration Form, or EDF, once the individual provides the authorised dealer bank with the information required to credit the payment to the exporter's account. No transaction-value threshold has been prescribed for resident individuals.\n\nSome elections matter more than you know: No crop changed in the fields, yet sugar, coffee and soya got cheaper in a day\n\nYou can buy a walkie-talkie online. But can you legally use it?\n\nKYB and KYC: Quick commerce, the Damani premium and what DMart must deliver \u2013 3rd and concluding part\n\nKYC and KYB: Inside Damani\u2019s DMart, the retail chain for the middle class. And stock for the long term? \u2013 Part 2 of 3\n\nWill it be a regulatory nightmare if an exchange lists on its own platform?\n\nKYC and KYB: Inside Damani\u2019s Avenue Supermarts that refuses to charge more \u2013 Part 1 of 3\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "04 Nov 2026, 12:53 AM IST", "pub_date_relative": "47m ago", "cfa_topics": ["Economics", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Options traders are betting heavily on these stocks ahead of election results", "full_content": "With prediction markets pricing in a big victory for Democrats in Tuesday's midterm elections, traders are leaning into a group of stocks that investors often categorize as beneficiaries of left-wing leadership. Options trading in clean-energy stocks, particularly solar companies, surged on Tuesday, despite a five-month sell-off in the group that's left most of the companies in the industry group down on the year. Volume in the Invesco Solar ETF (TAN) surged to 40 times higher than usual Tuesday, according to Cboe LiveVol data. The fund, which typically trades fewer than 500 contracts a day the past month, traded more than 20,000 contracts by midday, and 99% of them were calls. The ETF rallied more than 400% from its pandemic low through the 2020 election before giving almost all of the gains back by April last year.\n\nInvesco Solar ETF (TAN), YTD The most popular trade in TAN was buying the 50-strike call for December expiry for 80 cents and looking for a 17% rally, according to SpotGamma data. For nearer expiry, the 46 and 47-strike calls were also popular. Among individual stocks, SolarEdge Technologies stands out, on pace for three times higher-than-average volume and more than 75% of trading in calls. The company reports earnings before the bell tomorrow and rallied more than 6% Tuesday. The most popular trade was buying the 35-strike call expiring Friday. \"I would only like solar if blue was in the White House,\" said Charlie Moon of Chicago-based Prosper Trading Academy. \"But Enphase does stands out with some insider buying.\" Bulls were indeed dabbling in Enphase Energy , whose stock fell 20% after earnings last week but have fully recovered since and rallied 9% Tuesday. On volume twice the average, traders likely bought 8,600 calls, compared to under 900 puts. The most popular trade in Enphase was to buy the 35-strike call expiring in January, a trade that costs $2.45 per contract and needs Enphase to rally 23%.", "source": "CNBC Top News", "pub_date_str": "04 Nov 2026, 12:52 AM IST", "pub_date_relative": "48m ago", "cfa_topics": ["Financial Statement Analysis", "Derivatives", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Job openings posted big September gain in positive sign for labor market ahead of payrolls report", "full_content": "Job openings surged in September, as did the number of workers who quit their positions, the Bureau of Labor Statistics reported Tuesday, while hiring also rose and layoffs dropped.\n\nIn its monthly look at labor market slack and worker mobility, the BLS reported job openings at 7.52 million, up 333,000 from August and well above the Dow Jones consensus outlook for 7.15 million.\n\nAs a share of the total workforce, the rate of job openings increased to 4.5%, up 0.2 percentage point from the prior month, according to the Job Openings and Labor Turnover Survey . There are now some 414,000 more job openings than workers classified as unemployed, or about 1.05 openings to every available worker.\n\nOpenings rose in manufacturing (54,000) as well as state and local government (108,000) and professional and business services (106,000).\n\nAt the same time, the total of employees leaving their jobs spiked to 3.36 million, an increase of 321,000 from August and the highest level since March 2025. Quits are considered a barometer for worker confidence in finding new jobs after leaving their prior positions.\n\n\"There are more job openings than unemployed people in the United States right now. That doesn't solve all problems, but it's a big change from a year ago,\" said Heather Long, chief economist at Navy Federal Credit Union. \"It's an encouraging sign that despite all the headwinds right now with high diesel and gas prices and ongoing inflation problems, companies are slowly increasing their hiring.\"\n\nHires rose on the month, up 131,000 to 5.4 million, while layoffs and discharges fell by 127,000 to 1.64 million, the lowest since March 2025.\n\nThe report comes ahead of the October nonfarm payrolls report, which the BLS will release Friday. The Wall Street consensus is for an increase of 59,000 after September eked out a gain of just 29,000, while the unemployment rate is figured to hold at 4.2%.", "source": "CNBC Top News", "pub_date_str": "04 Nov 2026, 12:45 AM IST", "pub_date_relative": "55m ago", "cfa_topics": ["Economics", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Corn futures hit four-month low on big US crop, export worries", "full_content": "CHICAGO, Nov 3 (Reuters) - Chicago Board of Trade corn futures fell to a four-month low on Tuesday while soybean futures set a 2-1/2-month low on expectations for large US crops and concerns over export demand, analysts said.\n\nWheat futures also declined as traders focused on plans for peace talks next week between Russia and Ukraine, both of which are large exporters.\n\nDisappointment over US corn export sales weighed on CBOT futures. The US Department of Agriculture has previously estimated that farmers this year produced the nation's second-largest corn crop on record, analysts said.\n\nThe USDA reported that exporters sold 315,000 metric tons of US corn to Mexico and 136,000 metric tons to South Korea for delivery in 2026/27. On Monday, the agency confirmed sales of 1.7 million metric tons to Mexico, including 1.1 million tons for 2026/27 delivery.\n\nHowever, demand is lagging last year's pace, said Rich Nelson, chief strategist at Allendale.\n\n\"We still have more ground to make up for what is a pretty disappointing export pace right now,\" Nelson said.\n\nCBOT corn was down 6 cents at $4.42-1/4 a bushel and touched its lowest price since July 2 in afternoon trading. Soybeans slid 4 cents to $12.12-3/4 a bushel and hit their lowest level since August 17.\n\nTraders were nervous about demand for US soybeans from nations other than China, the world's biggest importer, amid competition for global sales from Brazil, the top supplier, Nelson said.", "source": "LiveMint Markets", "pub_date_str": "04 Nov 2026, 12:38 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Taco Bell sales fall more than expected on cyclosporiasis outbreak hit", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Taco Bell sales fall more than expected on cyclosporiasis outbreak hit Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Taco Bell sales fall more than expected on cyclosporiasis outbreak hit SECTIONS Taco Bell sales fall more than expected on cyclosporiasis outbreak hit Reuters Last Updated: Nov 04, 2026, 12:32:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Yum Brands faced a setback in the third quarter as Taco Bell reported declining sales, primarily due to a cyclosporiasis outbreak that sparked customer concerns. While the outbreak severely impacted customer traffic, there was a notable recovery in sales during September and October. Although same-store sales remained flat, falling short of analysts' predictions, the company surpassed profit expectations, boosting investor trust in Yum Brands.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "04 Nov 2026, 12:32 AM IST", "pub_date_relative": "1h ago",
