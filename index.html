hope and losing a considerable amount of money, the aggrieved homebuyer approached Haryana Real Estate Regulatory Authority ( RERA ) for redressal of his grievance.", "source": "LiveMint Money", "pub_date_str": "08 Sep 2026, 01:01 PM IST", "pub_date_relative": "8m ago"}, {"title": "IPO GMPs: Rentomojo, LCC Projects to Karamtara Engineering \u2014 what grey market signals about upcoming IPOs", "full_content": "Three Initial Public Offerings (IPOs)\u2014Rentomojo, LCC Projects and Karamtara Engineering\u2014are set to open for subscription tomorrow, 9 September.\n\nThe primary market is picking up pace in September, with a strong pipeline of new issues lined up for investors. Besides the much-anticipated mega IPO of NSE, which is likely to debut in September, six IPOs are scheduled to open on the same date, September 9. Together, these six companies, including Rentomojo, LCC Projects and Karamtara Engineering, are looking to raise more than \u20b9 4,500 crore through their respective offerings.\n\nARCIL, Manipal Payment & Identity Solutions and Steamhouse India are the other three companies that will also open their IPOs tomorrow.\n\nWith bidding set to begin on Tuesday, 9 September, investors will be closely tracking the latest grey market premium ( GMP ) trends for the three issues. The GMP can provide an indication of how the market is currently valuing an IPO ahead of its official listing, although it is not a guaranteed indicator of listing performance.\n\nSo, which of the three IPOs is currently showing the strongest grey market signal and could potentially deliver a better listing performance?\n\nHere is a comparison of Rentomojo, Karamtara Engineering and LCC Projects based on their latest GMP and key issue details.\n\nThe Rentomojo IPO is commanding a GMP of \u20b9 127. Based on the upper end of its price band at \u20b9 404 per share, the implied listing price works out to \u20b9 531. This suggests a potential listing gain of 31.44% over the issue price.\n\nRentomojo plans to raise \u20b9 1,255.57 crore through the IPO. The issue comprises 37.15 lakh fresh shares worth \u20b9 150 crore and an offer for sale ( OFS ) of 2.74 crore shares aggregating to \u20b9 1,105.57 crore.", "source": "LiveMint Markets", "pub_date_str": "08 Sep 2026, 01:01 PM IST", "pub_date_relative": "8m ago"}, {"title": "Mistral bags $24 billion valuation as Samsung leads funding for Europe's AI champion", "full_content": "Mistral on Tuesday said it raised 3 billion euros ($3.5 billion) in fresh funding led by memory chip giant Samsung, as the French startup looks to position itself as a European alternative to rivals like OpenAI and Anthropic.\n\nThe investment also involved the Scaleup Europe Fund, a European Union-backed investment fund managed by EQT, and existing investor PSG Equity. Mistral said the funding gives it a post-money valuation of more than 21 billion euros.\n\nMistral was valued at 11.7 billion euros a year ago , after a funding round led by Dutch chip equipment maker ASML .\n\nArthur Mensch, CEO of Mistral, told CNBC in an interview that the funding would go toward building more infrastructure, including its own data centers, and renting out computing capacity.\n\n\"Long term, the plan is to fully rely on capacity that we are building ourselves, and so that means that the amount of compute that we own is going to grow ... around 100% in the next five years,\" Mensch said.\n\nThe CEO added that the company will train \"bigger and faster models.\"\n\nThe Paris-headquartered company develops AI models and is building out its own data center footprint . It's looking to take a different approach to OpenAI and Anthropic by working with individual companies to create custom AI tools to suit their needs and integrate them with their businesses.\n\nMistral integrates AI in the manufacturing process of Netherlands-based ASML. Mensch said Mistral would focus on a similar area with South Korea's Samsung.", "source": "CNBC World Economy", "pub_ redentials to enjoy all member benefits", "source": "Economic Times Economy", "pub_date_str": "08 Sep 2026, 12:54 PM IST", "pub_date_relative": "15m ago"}, {"title": "Dow futures fall 300 points to start shortened week as oil prices climb: Live updates - CNBC", "full_content": "Dow futures fall 300 points to start shortened week as oil prices climb: Live updates CNBC European Stocks Dip as Oil Rise Offsets Tech Gains: Markets Wrap Bloomberg.com Busy Q2 Earnings & Jobs Week The Globe and Mail SPX: S&P 500 Futures Slip as Oil Prices, Inflation Data Keep Traders on Edge TradingView Dow futures fall over 300 points after extended weekend as oil prices rise on more attacks CNBC TV18", "source": "Google News Business", "pub_date_str": "08 Sep 2026, 12:54 PM IST", "pub_date_relative": "15m ago"}, {"title": "Roth/MKM downgrades eGain stock rating on weak guidance", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Sep 2026, 12:50 PM IST", "pub_date_relative": "19m ago"}, {"title": "Why is Dunelm stock sliding today?", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Sep 2026, 12:50 PM IST", "pub_date_relative": "19m ago"}, {"title": "European shares dip as higher crude revives inflation worries; Novartis drags", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Sep 2026, 12:48 PM IST", "pub_date_relative": "21m ago"}, {"title": "UBS upgrades EchoStar stock rating on SpaceX stake value", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Sep 2026, 12:44 PM IST", "pub_date_relative": "25m ago"}, {"title": "Seaport upgrades Asbury Automotive stock rating on valuation", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Sep 2026, 12:44 PM IST", "pub_date_relative": "25m ago"}, {"title": "Dow futures slip amid Fed hike bets, surging oil", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Sep 2026, 12:44 PM IST", "pub_date_relative": "25m ago"}, {"title": "Bitcoin hovers above $77,500 support as bears press: Live levels", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Sep 2026, 12:41 PM IST", "pub_date_relative": "28m ago"}, {"title": "London Gas Oil surges to highs with overbought RSI: Live levels", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Sep 2026, 12:41 PM IST", "pub_date_relative": "28m ago"}, {"title": "Brent Oil nears $101.20 resistance with overbought RSI: Live levels", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Sep 2026, 12:41 PM IST", "pub_date_relative": "28m ago"}, {"title": "Hang Seng trapped in 25,100-25,700 range: Live levels", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Sep 2026, 12:41 PM IST", "pub_date_relative": "28m ago"}, {"title": "FPIs see autos, consumer durables race past staples during festive season", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nThe upcoming festive season appears to be prompting foreign investors to position early for a potential pickup in demand, particularly in autos and consumer durables, according to market participants.\n\nData from National Securities Depository Ltd (NSDL) showed that the automobile and auto component sector saw foreign portfolio investor (FPI) buying of $326 million in August 2026, ending a five-month selling streak. The sector last saw buying in February, when FPIs invested $394 million.\n\nMarket participants see the festive season as a near-term trigger for investors warming up to autos and consumer durables again, but believe the improvement is more fundamental than just a seasonal trade.\n\n\u201cYes, the upcoming festive season is certainly one of the key reasons investors are warming up to autos and consumer durables, but it is not the only factor,\u201d said Sunny Agrawal, head of fundamental research at SBI Securities.\n\nIn autos, there is already a strong underlying recovery in demand. The sector has benefited from a favourable base and the goods and services tax (GST) cut implemented in September 2025, which has helped drive healthy sales volumes, particularly in two-wheelers and passenger vehicles, and to some extent in commercial vehicles as well, he noted.\n\nWhile the war in West Asia and the resulting rise in crude and diesel prices had temporarily moderated the momentum in commercial vehicles, the segment saw a strong recovery in August, he added.\n\nBetween April and August, domestic two-wheeler sales grew 18% year-on-year to 9.1 million units, with exports also gaining traction, according to a 2 September note by Axis Securities. Domestic passenger vehicle sales rose 28% on-year to 2.16 million units, and domestic commercial vehicle volumes grew 22% year-to-date to 435,000 units. Besides, tractor sales also rose 16%, the note said.", "source": "LiveMint Markets", "pub_date_str": "08 Sep 2026, 12:40 PM IST", "pub_date_relative": "29m ago"}, {"title": "Tejas Networks stock forms strong bullish candles; Axis Direct shares buy range, stop-loss, upside, holding period", "full_content": "Tejas Networks has extended its recent run on the stock market, with the telecom equipment maker showing strong momentum across multiple timeframes. The stock has gained 9% in the past one week, 15% over the last 1 month and 27% in the past six months.\n\nDespite the recent gains, the Tejas remains flat but in the red over the past 1 year, indicating that the latest rally has not yet translated into a positive one-year return.\n\nTejas Networks was trading at \u20b9 593.55 apiece. At the current level, the stock is around 8% below its 52-week high of \u20b9 644.75, recorded in June 2026. Its 52-week low stands at \u20b9 294.10, which was touched in January 2026.\n\nThe recent price action has also brought the stock's technical setup into focus, with Axis Direct highlighting a series of bullish signals on the weekly chart and identifying potential upside towards \u20b9 680-695.\n\nThe recent movement in Tejas Networks has strengthened the stock's technical picture, with the latest rally being supported by several indicators rather than being driven solely by price momentum.\n\nAccording to Axis Direct, Tejas Networks has formed strong bullish candles over the past two weeks on the weekly chart. The brokerage noted that this move came after the stock bounced from the 61.8% Fibonacci retracement level of its previous upmove, which had taken the stock from \u20b9 382 to \u20b9 644.\n\nThe rebound from this important Fibonacci level is significant from a technical perspective because it indicates that buyers emerged around a key retracement zone. The subsequent breakout has also been accompanied by higher trading volumes, according to Axis Direct. The rise in volume suggests stronger participation from market participants and adds credibility to the ongoing price move.\n\nAnother positive factor highlighted by the brokerage is the stock's position relative to its key moving averages. Tejas Networks is trading firmly above its 20-day, 50-day, 100-day and 200-day simple moving averages (SMAs).", "source": "LiveMint Markets", "pub_date_str": "08 Sep 2026, 12:33 PM IST", "pub_date_relative": "36m ago"}, {"title": "PVR Inox\u2019s Rs 300-crore buyback opens on Sept 10: Check buyback price, key dates, entitlement ratio", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a PVR Inox\u2019s Rs 300-crore buyback opens on Sept 10: Check buyback price, key dates, entitlement ratio PVR INOX Share Price Tips Music Share Price Imagicaaworld Entertainment Share Price Panorama Studios International Share Price Balaji Telefilms Share Price The Economic Times daily newspaper is available online now. Read Today's Paper PVR Inox\u2019s Rs 300-crore buyback opens on Sept 10: Check buyback price, key dates, entitlement ratio SECTIONS PVR Inox\u2019s Rs 300-crore buyback opens on Sept 10: Check buyback price, key dates, entitlement ratio By Debaroti Adhikary , ETMarkets.com Last Updated: Sep 08, 2026, 12:32:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis PVR Inox\u2019s Rs 300-crore share buyback opens September 10 and closes September 17, offering eligible shareholders Rs 1,450 per share, over 25% above the market price. The company plans to repurchase nearly 21 lakh shares. Eligibility depends on the September 4 record date, with separate entitlement ratios for small and general shareholders.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "08 Sep 2026, 12:32 PM IST", "pub_date_relative": "37m ago"}, {"title": "Canada's retaliatory tariffs worth $27.6 billion take effect as trade rift with U.S. deepens", "full_content": "Canada's retaliatory tariffs on a swathe of U.S. goods took effect on Tuesday after trade talks collapsed last month, as relations between Washington and Ottawa continue to sour.\n\nThe duties range from 15% to 50% across $27.6 billion worth of U.S. products, including dairy, agricultural equipment, paper, household appliances and electronics. Canadian tariffs on U.S. steel, aluminum and iron products doubled to 50%, while furniture and clothing were also hit with the highest rate.\n\nCanada called the move a \"dollar for dollar\" response to U.S. levies on its own goods, which have been targeted by Section 338 tariffs . Its Department of Finance said it would protect Canadian workers, producers and manufacturers by allowing them to better compete with U.S. products sold in the domestic market.\n\nExisting Canadian counter-tariffs against the U.S., including 25% on the politically sensitive autos sector , remain in place.\n\nTrade talks between the longstanding allies fell apart at the end of August , with officials on each side blaming one another for the failure to reach a deal and publicly disagreeing over which areas they could not find compromise .\n\nU.S. President Donald Trump on Monday called for a boycott of Canadian airplane manufacturer Bombardier , posting on Truth Social: \"NO MORE SELLING BOMBARDIER IN THE UNITED STATES!\"\n\nThe U.S. exported $333.6 billion worth of goods to Canada, and imported $381.9 billion from its northern neighbor. The pair share trade in many of the same sectors, including energy, vehicles, heavy machinery, aircraft, pharmaceuticals, gems and jewelry, furniture, clothing and a host of foods and drinks.\n\nEconomists say that while the impacted goods are a relatively small portion of overall trade, small- to medium-sized businesses and those in the most-impacted sectors face a severe blow.", "source": "CNBC Top News", "pub_date_str": "08 Sep 2026, 12:30 PM IST", "pub_date_relative": "39m ago"}, {"title": "Dividend stocks alert! Last chance to buy today to qualify for these shares - Check full list, amount, payment timeline", "full_content": "Stocks To Trade Ex-Dividend Today: Shares of Force Motors, JBM Auto, Gujarat Narmada Valley Fertilisers and Chemicals, are attracting heightened investors' interest on Tuesday, September 8, as it will be the last day to qualify for their scheduled dividend payout.\n\nNearly twenty companies, including JBM Auto, Force Motors, GNFC, Aastha Spintex, National Fittings, Empire Industries, and Jyoti Resins, have fixed Wednesday, September 9, as the record date for dividend payout. As India follows the T+1 settlement cycle, September 8 is effectively the last trading day to buy and qualify for the corporate action. This means investors must own these stocks during Tuesday\u2019s trading to become eligible for the dividend payout.\n\nForce Motors\u2019 board of directors announced a final dividend of \u20b9 50 per equity share with a face value of \u20b9 10. The company has set Wednesday, September 9, as the record date to determine investors' eligibility for the payout. Hence, investors must own the stock before the record date, making Tuesday the last day to buy the auto stock for the payout. Force Motors' share price was trading marginally lower at \u20b9 17660 per share on BSE during Tuesday\u2019s intraday trading session.\n\nGujarat Narmada Valley\u2019s board of directors announced 210% dividend for the financial year 2025-26. The fertiliser Public Sector Undertaking (PSU) stock will trade ex-dividend on Wednesday, September 9. The board had announced a final dividend of \u20b9 21 per share. The PSU stock was trading 1.48% lower at \u20b9 588.75 per share on BSE at 10:12 am on Tuesday.\n\nJBM Auto\u2019s board of directors approved an 85% final dividend for the financial year 2025-26. The auto components maker had announced \u20b9 0.85 dividend per share with a face value of Re 1 each. It had fixed September 9 as the dividend record date.", "source": "LiveMint Markets", "pub_date_str": "08 Sep 2026, 12:24 PM IST", "pub_date_relative": "45m ago"}], "cfa": [{"title": "Buyer pays \u20b914.5 lakh for a Gurugram flat, left in limbo after builder loses registration; RERA gives relief", "full_content": "An Allahabad-based homebuyer who paid \u20b9 14.5 lakh towards a housing project in Gurugram found himself facing an uncertain future after the builder lost its registration, leaving the construction site stalled. The case highlights the risks homebuyers can face when a real estate project runs into regulatory trouble.\n\nIn his complaint, the individual claimed that he \u201cwas caught in the web of false promises of the agents of the respondent company\u201d after booking a 642 sq ft unit in a housing property in Gurugram's Dhanwapur village area.\n\nHe initially paid an amount of \u20b9 1,28,470 to the builder, following which the payment was acknowledged and he was allotted one unit. Over time, he paid almost half of the flat's total consideration of \u20b9 26 lakh and was issued an allotment letter in December 2021, The Economic Times reported.\n\nThe homebuyer claimed that after making the payment, he tried to contact the developer on several occasions, which did not elicit a satisfactory response. That's when he decided to visit the property site, where he shockingly found that the progress in construction has been stalled.\n\n\u201cThe respondent was never able to give any satisfactory response to the complainants for delay in construction of the unit and was never definite about the delivery of the possession,\u201d the homebuyer was quoted as saying in the news report, adding that he kept pursuing the matter.\n\nDespite the incomplete construction, the builder continued to demand instalment payments from the buyer. The homebuyer declined to make any further payments and instead sought a refund. However, the refund was also delayed, with the builder citing \u201cunavoidable circumstances\u201d and asking him to wait another 10 to 15 days, the complainant alleged.\n\nAfter losing all hope and losing a considerable amount of money, the aggrieved homebuyer approached Haryana Real Estate Regulatory Authority ( RERA ) for redressal of his grievance.", "source": "LiveMint Money", "pub_date_str": "08 Sep 2026, 01:01 PM IST", "pub_date_relative": "8m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "IPO GMPs: Rentomojo, LCC Projects to Karamtara Engineering \u2014 what grey market signals about upcoming IPOs", "full_content": "Three Initial Public Offerings (IPOs)\u2014Rentomojo, LCC Projects and Karamtara Engineering\u2014are set to open for subscription tomorrow, 9 September.\n\nThe primary market is picking up pace in September, with a strong pipeline of new issues lined up for investors. Besides the much-anticipated mega IPO of NSE, which is likely to debut in September, six IPOs are scheduled to open on the same date, September 9. Together, these six companies, including Rentomojo, LCC Projects and Karamtara Engineering, are looking to raise more than \u20b9 4,500 crore through their respective offerings.\n\nARCIL, Manipal Payment & Identity Solutions and Steamhouse India are the other three companies that will also open their IPOs tomorrow.\n\nWith bidding set to begin on Tuesday, 9 September, investors will be closely tracking the latest grey market premium ( GMP ) trends for the three issues. The GMP can provide an indication of how the market is currently valuing an IPO ahead of its official listing, although it is not a guaranteed indicator of listing performance.\n\nSo, which of the three IPOs is currently showing the strongest grey market signal and could potentially deliver a better listing performance?\n\nHere is a comparison of Rentomojo, Karamtara Engineering and LCC Projects based on their latest GMP and key issue details.\n\nThe Rentomojo IPO is commanding a GMP of \u20b9 127. Based on the upper end of its price band at \u20b9 404 per share, the implied listing price works out to \u20b9 531. This suggests a potential listing gain of 31.44% over the issue price.\n\nRentomojo plans to raise \u20b9 1,255.57 crore through the IPO. The issue comprises 37.15 lakh fresh shares worth \u20b9 150 crore and an offer for sale ( OFS ) of 2.74 crore shares aggregating to \u20b9 1,105.57 crore.", "source": "LiveMint Markets", "pub_date_str": "08 Sep 2026, 01:01 PM IST", "pub_date_relative": "8m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Mistral bags $24 billion valuation as Samsung leads funding for Europe's AI champion", "full_content": "Mistral on Tuesday said it raised 3 billion euros ($3.5 billion) in fresh funding led by memory chip giant Samsung, as the French startup looks to position itself as a European alternative to rivals like OpenAI and Anthropic.\n\nThe investment also involved the Scaleup Europe Fund, a European Union-backed investment fund managed by EQT, and existing investor PSG Equity. Mistral said the funding gives it a post-money valuation of more than 21 billion euros.\n\nMistral was valued at 11.7 billion euros a year ago , after a funding round led by Dutch chip equipment maker ASML .\n\nArthur Mensch, CEO of Mistral, told CNBC in an interview that the funding would go toward building more infrastructure, including its own data centers, and renting out computing capacity.\n\n\"Long term, the plan is to fully rely on capacity that we are building ourselves, and so that means that the amount of compute that we own is going to grow ... around 100% in the next five years,\" Mensch said.\n\nThe CEO added that the company will train \"bigger and faster models.\"\n\nThe Paris-headquartered company develops AI models and is building out its own data center footprint . It's looking to take a different approach to OpenAI and Anthropic by working with individual companies to create custom AI tools to suit their needs and integrate them with their businesses.\n\nMistral integrates AI in the manufacturing process of Netherlands-based ASML. Mensch said Mistral would focus on a similar area with South Korea's Samsung.", "source": "CNBC World Economy", "pub_date_str": "08 Sep 2026, 12:57 PM IST", "pub_date_relative": "12m ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "\u2018Historic achievement for 21st-century India\u2019: PM Modi inaugurates Rs 35,000 crore development projects in Vadodara", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Infrastructure \u203a \u2018Historic achievement for 21st-century India\u2019: PM Modi inaugurates Rs 35,000 crore development projects in Vadodara The Economic Times daily newspaper is available online now. Read Today's Paper \u2018Historic achievement for 21st-century India\u2019: PM Modi inaugurates Rs 35,000 crore development projects in Vadodara SECTIONS \u2018Historic achievement for 21st-century India\u2019: PM Modi inaugurates Rs 35,000 crore development projects in Vadodara ET Online Last Updated: Sep 08, 2026, 01:05:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Prime Minister Narendra Modi has officially inaugurated a series of development projects in Vadodara, surpassing Rs 35,000 crore in value. He highlighted key sections of the Western Dedicated Freight Corridor, signifying an important achievement for the nation. The announcement also included various railway and highway enhancements, aimed at bolstering national infrastructure and expediting India's transformation into a fully developed country.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\nBanks have received a flood of money. Now comes the real test\n\nNew aircraft order opens door for ATR assembly line in India: CEO\n\nSeason of change in accounting policy: A simple AI prompt can te ndamental than just a seasonal trade.\n\n\u201cYes, the upcoming festive season is certainly one of the key reasons investors are warming up to autos and consumer durables, but it is not the only factor,\u201d said Sunny Agrawal, head of fundamental research at SBI Securities.\n\nIn autos, there is already a strong underlying recovery in demand. The sector has benefited from a favourable base and the goods and services tax (GST) cut implemented in September 2025, which has helped drive healthy sales volumes, particularly in two-wheelers and passenger vehicles, and to some extent in commercial vehicles as well, he noted.\n\nWhile the war in West Asia and the resulting rise in crude and diesel prices had temporarily moderated the momentum in commercial vehicles, the segment saw a strong recovery in August, he added.\n\nBetween April and August, domestic two-wheeler sales grew 18% year-on-year to 9.1 million units, with exports also gaining traction, according to a 2 September note by Axis Securities. Domestic passenger vehicle sales rose 28% on-year to 2.16 million units, and domestic commercial vehicle volumes grew 22% year-to-date to 435,000 units. Besides, tractor sales also rose 16%, the note said.", "source": "LiveMint Markets", "pub_date_str": "08 Sep 2026, 12:40 PM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Tejas Networks stock forms strong bullish candles; Axis Direct shares buy range, stop-loss, upside, holding period", "full_content": "Tejas Networks has extended its recent run on the stock market, with the telecom equipment maker showing strong momentum across multiple timeframes. The stock has gained 9% in the past one week, 15% over the last 1 month and 27% in the past six months.\n\nDespite the recent gains, the Tejas remains flat but in the red over the past 1 year, indicating that the latest ufacturers in fiscal year 2027. As a response to escalating input costs, companies are enacting price hikes, raising investor apprehensions about increased competition and dwindling profit margins.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "08 Sep 2026, 12:20 PM IST", "pub_date_relative": "49m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Bitcoin\u2019s Latest Hack Puts Key Crypto Vulnerability in Spotlight", "full_content": "(Bloomberg) -- The $320 million hack of the Bitcoin-linked Liquid Network is another dent to crypto\u2019s reputation as the industry tries to convince banks and institutional investors that digital assets can become part of mainstream financial infrastructure.\n\nThe damage extends beyond the Bitcoin that was taken. Liquid was built to make the largest cryptocurrency more useful for trading and settlement, and the incident highlights the risks in the layers surrounding a blockchain \u2014 the wallets, custody arrangements and transaction infrastructure that users ultimately have to rely on.\n\n\u201cContinued exploits reinforce to global fintechs and institutions that decentralized finance is still not ready for prime time,\u201d said Nikhil Raghuveera, chief executive officer of Predicate, a blockchain compliance infrastructure provider. \u201cBlockchains are great for financial settlement but DeFi is not ready for the institutional standards that are taken for granted in legacy markets.\u201d\n\nOngoing hacks are exposing decentralization \u2014 once touted as one of crypto\u2019s greatest strengths \u2014 as a vulnerability. By removing central authorities responsible for reversing mistakes, safeguarding assets and absorbing losses, the system leaves users dependent on fragmented infrastructure that malicious actors continue to find ways to attack.\n\nHacking incidents are increasing even if the overall amount lost isn\u2019t. About $1.4 billion has been taken by hackers so far in 2026 across 250 attacks, compared with $2.7 billion over 146 attacks in 2025, according to DefiLlama data.\n\nThis year, 26 of the assaults, or over 10%, were on bridges and cross-chain infrastructure, connecting tools for users to move tokens or information from one blockchain to another. In 2025, DefiLlama identified only three hacks in this category.\n\nCross-chain links are a critical component of DeFi, enabling the automation of moving and converting different types of digital assets.", "source": "LiveMint Markets", "pub_date_str": "08 Sep 2026, 12:17 PM IST", "pub_date_relative": "52m ago", "cfa_topics": ["Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "FCNR(B) windfall for banks explained: Who got highest inflows and what it means for investors", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a FCNR(B) windfall for banks explained: Who got highest inflows and what it means for investors State Bank of India Share Price Union Bank of India Share Price Punjab National Bank Share Price Bank of Baroda Share Price Indian Bank Share Price The Economic Times daily newspaper is available online now. Read Today's Paper FCNR(B) windfall for banks explained: Who got highest inflows and what it means for investors SECTIONS FCNR(B) windfall for banks explained: Who got highest inflows and what it means for investors By Nikhil Agarwal , ETMarkets.com Last Updated: Sep 08, 2026, 12:37:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis FCNR(B) deposits offer banks a cheaper and balance-sheet-efficient source of funding, but their finite tenor and initial deployment challenges could pressure margins. While ICICI Bank and Kotak Mahindra Bank stand to benefit from higher inflows, IDFC First Bank offers the strongest earnings upside. Investors may see margin pressure initially before stronger liquidity, loan growth and lower funding costs support earnings.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "08 Sep 2026, 12:13 PM IST", "pub_date_relative": "56m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "IFCI share price tumbles over 8% amid ongoing NSE IPO buzz", "full_content": "IFCI share price bucked its gaining streak, slided over 9% in Tuesday's trading session as investors rushed to book profits after two-day rally. IFCI shares opened at \u20b9 103.40 apiece on NSE today, as compared to previous close of \u20b9 102.51. The stock hit an intraday low of \u20b9 92.75 apiece.\n\nA major factor driving investor interest in IFCI is its indirect exposure to the National Stock Exchange (NSE) through Stock Holding Corporation of India (SHCIL).\n\nIFCI holds a controlling stake of over 50% in SHCIL, which, in turn, owns more than 4% of NSE. This structure gives IFCI shareholders indirect exposure to developments at India\u2019s largest stock exchange, making the company\u2019s stock particularly responsive to progress on NSE\u2019s much-anticipated IPO.\n\nInvestor sentiment has strengthened further after Securities and Exchange Board of India (SEBI) Chairman Tuhin Kanta Pandey indicated that the market regulator was nearing approval of NSE\u2019s draft red herring prospectus (DRHP) for its proposed public offering.\n\nThe National Stock Exchange (NSE) filed its draft prospectus in June for a proposed IPO that will comprise entirely an offer for sale (OFS). The issue will involve the sale of up to 14.89 crore equity shares with a face value of Re 1 each. The proposed issue represents nearly 6% of NSE\u2019s paid-up equity capital, with the offering size set at 6% of the exchange\u2019s paid-up capital.\n\nThe selling shareholders include several prominent financial institutions, such as State Bank of India, MS Strategic (Mauritius) Limited, Canada Pension Plan Investment Board, Aranda Investments (Mauritius) Pte Ltd, Bank of Baroda, Stock Holding Corporation of India Limited (SHCIL), General Insurance Corporation of India, The New India Assurance Company Ltd., National Insurance Company Limited and United India Insurance Company Limited.\n\nThe proposed NSE IPO is of particular significance to IFCI, given its controlling stake in SHCIL.", "source": "LiveMint Markets", "pub_date_str": "08 Sep 2026, 12:08 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Portfolio Management"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Brent crude nears $99 after strikes on Saudi energy sites amid renewed Mideast hostilities", "full_content": "Oil prices extended gains on Tuesday as attacks on Saudi energy facilities compounded fears of escalating hostilities between the U.S. and Iran in recent days.\n\nFutures for international benchmark Brent crude for November delivery gained 1.36% at $98.32 a barrel as of 2:10 a.m. ET. U.S. West Texas Intermediate futures for October advanced 2.37% to $93.65 per barrel.\n\nThe Saudi energy ministry said operations at certain energy facilities had been halted after strikes by Iran-aligned Houthi militants based in Yemen wounded more than 70 people.\n\nEmergency services are working to contain fires at the sites and assess the extent of damage, the world's largest oil exporter added.\n\nBrent It comes after the U.S. military struck three Iranian oil tankers on Saturday in retaliation for Iranian ballistic missile attacks on two Navy warships. The Iranian Foreign Ministry, in a statement on Saturday, denounced the attacks on commercial vessels as a \"war crime\" and an act of \"economic warfare.\"\n\n\"This appears to be a major escalation and tensions have once again ratcheted higher,\" said David Morrison, senior market analyst at Trade Nation , noting that U.S. Energy Secretary Chris Wright had said it may prove impossible to reach a deal with Iran to prevent it obtaining a nuclear weapon.\n\nThe tit-for-tat strikes over the weekend also helped to push gas prices higher, hitting record highs .\n\nTensions between Washington and Tehran continued to simmer. \"Strike our assets and you get struck,\" Iranian Parliament Speaker Mohammad Bagher Ghalibaf wrote Monday in a post on X.", "source": "CNBC Top News", "pub_date_str": "08 Sep 2026, 12:07 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Derivatives", "Portfolio Management"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Why investors are turning bullish on Bloom Energy shares", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News Powered By Why investors are turning bullish on Bloom Energy shares Written by Anupam Nagar , ETMarkets.com | Sep 08, 2026, 12:07:32 PM IST 1 / 5 \u200bBloom Energy stock jumps on S&P 500 inclusion Bloom Energy shares surged 7.35% in regular trading on Friday after the company was selected for inclusion in the S&P 500. The rally extended into after-hours trading, with the stock gaining nearly another 7% as investors reacted to the index addition. (Sources: TradingView, Blockonomi, S&P Dow Jones Indices)\n\nBloom Energy will officially become an S&P 500 constituent before the market opens on September 21, 2026, as part of the benchmark\u2019s quarterly reshuffle. The company will replace Molson Coors Beverage in the index.\n\nS&P 500 inclusion can increase demand for a stock as funds tracking the benchmark adjust their portfolios. UBS analyst Manav Gupta said historical index additions have resulted in a meaningful increase in passive ownership, making the move a potentially significant catalyst for Bloom Energy.\n\nUBS analyst Manav Gupta raised his price target for Bloom Energy to $325 from $300 while maintaining a Buy rating. Based on the stock\u2019s last close cited in the report, the new target implies more than 28% potential upside, adding to the positive sentiment surrounding the company.\n\nBloom Energy has emerged as an investor focus amid rising demand for power infrastructure linked to the artificial intelligence boom. Its S&P 500 inclusion provides another potential catalyst, while the company also benefits from greater visibility and the possibility of increased institutional and passive-fund ownership.", "source": "Economic Times Markets", "pub_date_str": "08 Sep 2026, 12:03 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}], "updated_at": "08 Sep 2026, 01:09 PM IST", "total_stories": 354};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
