    const allData = {"general": [{"title": "How to trade TCS, Tata Chemicals, other Tata stocks as boardroom battles could reach court", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a How to trade TCS, Tata Chemicals, other Tata stocks as boardroom battles could reach court Tata Motors Share Price Maruti Suzuki India Share Price Mahindra & Mahindra Share Price Hyundai Motor India Share Price Tata Motors Passenger Vehicles Share Price The Economic Times daily newspaper is available online now. Read Today's Paper How to trade TCS, Tata Chemicals, other Tata stocks as boardroom battles could reach court SECTIONS How to trade TCS, Tata Chemicals, other Tata stocks as boardroom battles could reach court By Veer Sharma , ETMarkets.com Last Updated: Sep 21, 2026, 01:04:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Tata Group stocks remain volatile amid the Tata Trusts-Tata Sons dispute over N Chandrasekaran's reappointment. Technical analysts highlight key resistance levels and bearish signals for Tata Chemicals, TCS, Tata Motors PV and Tata Investment Corp.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "21 Sep 2026, 01:04 PM IST", "pub_date_relative": "5m ago"}, {"title": "Why is Kuehne & Nagel stock rallying today?", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Sep 2026, 01:02 PM IST", "pub_date_relative": "7m ago"}, {"title": "Europe\u2019s STOXX 600 gains as tech rallies, oil retreat eases nerves", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Sep 2026, 01:01 PM IST", "pub_date_relative": "8m ago"}, {"title": "Rothschild downgrades Flutter stock rating on guidance cuts", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Sep 2026, 01:00 PM IST", "pub_date_relative": "9m ago"}, {"title": "Perpetual rejects revised EQT takeover offer, citing undervaluation", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Sep 2026, 01:00 PM IST", "pub_date_relative": "9m ago"}, {"title": "Volkswagen, Porsche shares extend losses following profit warning", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Sep 2026, 01:00 PM IST", "pub_date_relative": "9m ago"}, {"title": "GAIL Gas begins process to appoint bankers for up to \u20b93,100 crore IPO", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nMUMBAI: GAIL Gas Ltd has begun the process of appointing investment banks for an initial public offering (IPO) that could raise up to \u20b9 3,100 crore, according to a document reviewed by Mint . The city gas distribution company, a wholly owned subsidiary of state-run GAIL (India) Ltd, is seeking up to four book-running lead managers to manage the proposed share sale.\n\n\u201cThe company is planning on conducting a pre-bid meeting with all interested merchant bankers this week to address their queries, with bids expected to start coming in by early next month,\u201d a person aware of the developments told Mint .\n\nThe appointed advisers will draft and file the draft red herring prospectus and final prospectus with the Securities and Exchange Board of India ( Sebi ) and stock exchanges, according to the scope of work in the document. They will also oversee the appointment and work of transaction intermediaries, including domestic and international legal counsel and registrars.\n\nThe IPO is part of India\u2019s Asset Monetisation Pipeline 2.0, under which government-owned companies will divest stakes in their subsidiaries between fiscal year 2027 (FY27) and FY30. The proceeds from these stake sales will be retained by the companies as monetized value.\n\nNITI Aayog\u2019s February report had projected the GAIL Gas IPO for FY28.\n\nAn email sent to GAIL Gas did not immediately elicit a response.\n\nIncorporated in 2008, GAIL Gas is a wholly owned subsidiary of GAIL and was set up to implement city gas distribution projects in the country. It currently operates CGD projects in 16 geographical areas across nine states, including Madhya Pradesh, Haryana, Rajasthan, Chhattisgarh and Karnataka. It is also pursuing city gas business in Andhra Pradesh, Goa and Assam.", "source": "LiveMint Markets", "pub_date_str": "21 Sep 2026, 12:57 PM IST", "pub_date_relative": "12m ago"}, {"title": "Oil prices slide on hopes of diplomacy in Iran war", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Sep 2026, 12:54 PM IST", "pub_date_relative": "15m ago"}, {"title": "OTE buys back 340,044 shares for \u20ac6.7 million", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Sep 2026, 12:54 PM IST", "pub_date_relative": "15m ago"}, {"title": "Rainwater damaged luxury car, insurer denied claim; owner wins \u20b92.02 lakh in compensation \u2014 here's what happened", "full_content": "A vehicle insurance claim can lead to a dispute when the insurer and policyholder differ over what is covered under the policy. In one such case involving a luxury car, the dispute centered on rainwater damage after the owner inadvertently left a window partially open, allowing water to seep inside.\n\nThe matter eventually reached the Chhattisgarh District Consumer Disputes Redressal Commission, which ruled in the car owner's favour, according to a recent report by the The Indian Express .\n\nIn an order passed on August 24, the insurer was directed to pay \u20b9 1.75 lakh towards the claim. The car owner was also awarded \u20b9 20,000 for mental agony and \u20b9 7,000 as litigation costs, taking the total relief to \u20b9 2.02 lakh.\n\nThe Jaguar was covered under a private car insurance policy that was valid from November 29, 2020 to November 28, 2021.\n\nIn August 2021, rainwater entered the vehicle after the driver-side window was left slightly open, damaging the infotainment system and some other components. The owner, who is a man, subsequently filed an insurance claim.\n\nWhile the insurer\u2019s surveyor assessed the damage at \u20b9 1.98 lakh, the owner stated that he had spent \u20b9 2.73 lakh on repairs.\n\nThe insurer eventually turned down the claim on February 4, 2022, stating that the policy did not cover damage caused by rainwater. It also noted that leaving the car's window open amounted to gross negligence and violated the conditions of the insurance contract.\n\nAggrieved by the decision, the car owner approached the consumer commission and filed a complaint. He alleged deficiency in service and unfair trade practice and also argued that the insurer had not provided the complete policy terms and conditions when the car policy was issued, and therefore could not later rely on exclusion clauses to reject his claim.", "source": "LiveMint Money", "pub_date_str": "21 Sep 2026, 12:49 PM IST", "pub_date_relative": "21m ago"}, {"title": "Take Five: High stakes, low bars", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Sep 2026, 12:48 PM IST", "pub_date_relative": "21m ago"}, {"title": "Metlen Energy & Metals appoints Yannis Masvoulas as IR head", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Sep 2026, 12:44 PM IST", "pub_date_relative": "25m ago"}, {"title": "FTSE 100 today: Stocks rise as oil slips on Iran diplomacy hopes", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Sep 2026, 12:44 PM IST", "pub_date_relative": "25m ago"}, {"title": "Oracle Financial Services share price falls 6.5% today | What's behind the plunge?", "full_content": "Oracle Financial Services share price plunged over 6.50% on NSE in Monday's trading session amid a Financial Times report said around $18 billion of loans linked to an Oracle-leased data centre in New Mexico had come under pressure.\n\nOracle Financial Services shares opened at \u20b9 11,787 apiece today, as compared to previous close of \u20b9 11,896 on Friday last week. The stock hit an intraday low of \u20b9 11,061 per share on 21 September.\n\nAccording to the FT report, the loans were reportedly being quoted at 89\u201391 cents on the dollar by syndicate banks, including Santander and Jefferies.\n\nThe development comes amid concerns that growing local opposition to the project, driven by fears over its potential impact on water supplies and air quality , could disrupt Oracle\u2019s ambitious AI infrastructure expansion, according to the FT.\n\nThe 1,400-acre \u201cProject Jupiter \u201d campus in Do\u00f1a Ana County is part of Oracle\u2019s wider agreement with OpenAI to provide AI computing capacity. However, efforts to distribute the debt among a broader group of investors have stalled amid concerns over Oracle\u2019s rising leverage and weakening credit profile, the report said.\n\nOracle\u2019s corporate credit rating is currently one notch above junk status after S&P downgraded the company in July. As investor demand weakened, banks were reportedly left holding more Oracle-linked project debt on their balance sheets than initially anticipated.\n\nOracle has significantly increased spending to support its expansion into AI infrastructure, while the company\u2019s growing debt burden has attracted heightened scrutiny from investors.\n\nOracle Financial Services Software (OFSS) shares have delivered a positive performance in the near term, gaining 5.50% over the past week. However, the stock has declined 5.19% over the last one month, indicating some recent consolidation after its earlier gains.", "source": "LiveMint Markets", "pub_date_str": "21 Sep 2026, 12:43 PM IST", "pub_date_relative": "26m ago"}, {"title": "Stock futures rise after Dow posts third straight losing week: Live updates - CNBC", "full_content": "Stock futures rise after Dow posts third straight losing week: Live updates CNBC Futures Rise: Can Market Take Off? 2026's Top Stocks Are Buys Investor's Business Daily 3 things to look out for on Monday (SP500:) Seeking Alpha Stock Market: Will S&P 500 Open Up or Down Today? Yahoo Finance US Stock Market Trends (September 21): Bitcoin Returns to $80,000, Middle East Tensions Heat Up Again Over the Weekend,\u2026 \u6df1\u6f6eTechFlow", "source": "Google News Business", "pub_date_str": "21 Sep 2026, 12:37 PM IST", "pub_date_relative": "32m ago"}, {"title": "JSW Cement\u2019s regional diversification is comforting, but costs are more important now", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nAs competition for market share gains intensifies among large cement makers, JSW Cement\u2019s expanding geographical reach augurs well for medium-term growth. In March, JSW commissioned its first greenfield integrated manufacturing plant in north India at Nagaur in Rajasthan. This plant achieved an average utilization of 55% in the June quarter (Q1FY27) and a further ramp-up should buoy volume growth in the north.\n\nThe north India plant is a key growth driver, providing both incremental capacity and access to a more profitable/balanced market, Motilal Oswal added in the report. The south India cement market has been grappling with an oversupply situation for a while, which has kept pricing trends in this market muted.\n\nThis has been a constraint for cement makers with exposure in south India. North and central India have relatively more favourable demand-supply dynamics and thus, better pricing prospects.\n\nIn Q2FY27, cost control efforts by companies would be a distinguishing factor. Input cost inflation pressures would come to the fore as many companies exhaust low-cost inventory.\n\nHigher power and fuel costs, packaging expenses and elevated operating costs at the Nagaur plant dragged consolidated Ebitda down 7% year-on-year to \u20b9 299 crore in Q1. The management expects Q2 costs to remain broadly similar to Q1, with a reduction expected from Q3 onwards.\n\nThe JSW Cement stock has declined about 20% from its initial public offering issue price of \u20b9 147 in August 2025. JSW expects volume growth in the high teens in FY27, but costs are a near-term re-rating trigger.\n\nHarsha Jethmalani is a Deputy Editor at Mint with over a decade of experience covering stock markets and corporate India.", "source": "LiveMint Markets", "pub_date_str": "21 Sep 2026, 12:37 PM IST", "pub_date_relative": "32m ago"}, {"title": "Your mutual fund portfolio can become riskier while you do nothing, here\u2019s what investors should track", "full_content": "Investors often assume that a mutual fund portfolio remains broadly unchanged as long as they continue holding the same schemes. But the risk of that portfolio can change significantly even when there are no fresh investments, withdrawals or switches.\n\nMarket movements can alter the balance between equity and debt, increase exposure to mid- and small-cap stocks, or make certain sectors and stocks account for a larger share of the portfolio.\n\nDebasish Mohanty, MD & Chief Strategy Officer, The Wealth Company Mutual Fund, said investors should therefore review their portfolio at an aggregate level rather than relying only on individual fund performance. A portfolio review once or twice a year can help investors check whether their asset allocation , concentration and overall risk remain aligned with their goals and investment horizon.\n\n\"This is an important aspect of portfolio management that investors sometimes overlook. Holding the same schemes does not necessarily mean holding the same level of risk,\" said Mohanty.\n\nMarket movements are one of the simplest ways this can happen. If equities rise much faster than debt, an originally balanced portfolio can gradually become equity-heavy. Similarly, strong performance in mid- and small-cap stocks can increase their contribution to the portfolio's overall risk even if the investor has made no fresh investment.\n\nThe underlying portfolios of mutual fund schemes also change over time. Fund managers buy and sell securities within their mandates, while valuations, market capitalisation and sector exposure evolve.\n\nThere is also the risk of overlap. Two or more funds in an investor's portfolio may increasingly own similar stocks, creating an unintended concentration.\n\nConcentration can rise simply because some sectors or stocks perform better than others.", "source": "LiveMint Money", "pub_date_str": "21 Sep 2026, 12:29 PM IST", "pub_date_relative": "40m ago"}, {"title": "Global Market: China tightens scrutiny of humanoid robot IPOs amid valuation concerns", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a Global Market: China tightens scrutiny of humanoid robot IPOs amid valuation concerns Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market: China tightens scrutiny of humanoid robot IPOs amid valuation concerns SECTIONS Global Market: China tightens scrutiny of humanoid robot IPOs amid valuation concerns By have delivered double-digit price returns in less than three months since the end of the June quarter. From this group, we highlighted 14 stocks where FII holdings increased during the June quarter and whose share prices have risen between 20% and 75% in less than three months. The analysis looks at the change in FII ownership alongside the subsequent movement in these stocks' share prices. (Data Source: ACE Equity)\n\nIn less than three months since the end of the June quarter, Welspun Corp shares have gained 75%, rising from Rs 1,520 to Rs 2,658. During the June 2026 quarter, FIIs increased their stake in the company to 14.61%, from 11.23% in the March 2026 quarter.\n\nSince the end of the June quarter, Redington shares have gained 45%, rising from Rs 276 to Rs 400. During the June 2026 quarter, FIIs increased their stake in the company to 61.96%, from 61.49% in the March 2026 quarter.\n\nIn less than three months, PVR Inox shares have gained 38%, rising from Rs 962 to Rs 1,329. During the June 2026 quarter, FIIs increased their stake in the company to 18.08%, from 17.86% in the March 2026 quarter.\n\nSince the end of the June quarter, Lenskart Solutions shares have gained 37%, rising from Rs 515 to Rs 707.", "source": "Economic Times Markets", "pub_date_str": "21 Sep 2026, 12:22 PM IST", "pub_date_relative": "47m ago"}, {"title": "NMDC shares rally 2% after company sets target to achieve net-zero operational emissions by 2047", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a NMDC shares rally 2% after company sets target to achieve net-zero operational emissions by 2047 NMDC Share Price Coal India Share Price KIOCL Share Price Gujarat Mineral Development Corporation Share Price Sandur Manganese & Iron Ores Share Price The Economic Times daily newspaper is available online now. Read Today's Paper NMDC shares : "9m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Volkswagen, Porsche shares extend losses following profit warning", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Sep 2026, 01:00 PM IST", "pub_date_relative": "9m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "GAIL Gas begins process to appoint bankers for up to \u20b93,100 crore IPO", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nMUMBAI: GAIL Gas Ltd has begun the process of appointing investment banks for an initial public offering (IPO) that could raise up to \u20b9 3,100 crore, according to a document reviewed by Mint . The city gas distribution company, a wholly owned subsidiary of state-run GAIL (India) Ltd, is seeking up to four book-running lead managers to manage the proposed share sale.\n\n\u201cThe company is planning on conducting a pre-bid meeting with all interested merchant bankers this week to address their queries, with bids expected to start coming in by early next month,\u201d a person aware of the developments told Mint .\n\nThe appointed advisers will draft and file the draft red herring prospectus and final prospectus with the Securities and Exchange Board of India ( Sebi ) and stock exchanges, according to the scope of work in the document. They will also oversee the appointment and work of transaction intermediaries, including domestic and international legal counsel and registrars.\n\nThe IPO is part of India\u2019s Asset Monetisation Pipeline 2.0, under which government-owned companies will divest stakes in their subsidiaries between fiscal year 2027 (FY27) and FY30. The proceeds from these stake sales will be retained by the companies as monetized value.\n\nNITI Aayog\u2019s February report had projected the GAIL Gas IPO for FY28.\n\nAn email sent to GAIL Gas did not immediately elicit a response.\n\nIncorporated in 2008, GAIL Gas is a wholly owned subsidiary of GAIL and was set up to implement city gas distribution projects in the country. It currently operates CGD projects in 16 geographical areas across nine states, including Madhya Pradesh, Haryana, Rajasthan, Chhattisgarh and Karnataka. It is also pursuing city gas business in Andhra Pradesh, Goa and Assam.", "source": "LiveMint Markets", "pub_date_str": "21 Sep 2026, 12:57 PM IST", "pub_date_relative": "12m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "FTSE 100 today: Stocks rise as oil slips on Iran diplomacy hopes", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Sep 2026, 12:44 PM IST", "pub_date_relative": "25m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Oracle Financial Services share price falls 6.5% today | What's behind the plunge?", "full_content": "Oracle Financial Services share price plunged over 6.50% on NSE in Monday's trading session amid a Financial Times report said around $18 billion of loans linked to an Oracle-leased data centre in New Mexico had come under pressure.\n\nOracle Financial Services shares opened at \u20b9 11,787 apiece today, as compared to previous close of \u20b9 11,896 on Friday last week. The stock hit an intraday low of \u20b9 11,061 per share on 21 September.\n\nAccording to the FT report, the loans were reportedly being quoted at 89\u201391 cents on the dollar by syndicate banks, including Santander and Jefferies.\n\nThe development comes amid concerns that growing local opposition to the project, driven by fears over its potential impact on water supplies and air quality , could disrupt Oracle\u2019s ambitious AI infrastructure expansion, according to the FT.\n\nThe 1,400-acre \u201cProject Jupiter \u201d campus in Do\u00f1a Ana County is part of Oracle\u2019s wider agreement with OpenAI to provide AI computing capacity. However, efforts to distribute the debt among a broader group of investors have stalled amid concerns over Oracle\u2019s rising leverage and weakening credit profile, the report said.\n\nOracle\u2019s corporate credit rating is currently one notch above junk status after S&P downgraded the company in July. As investor demand weakened, banks were reportedly left holding more Oracle-linked project debt on their balance sheets than initially anticipated.\n\nOracle has significantly increased spending to support its expansion into AI infrastructure, while the company\u2019s growing debt burden has attracted heightened scrutiny from investors.\n\nOracle Financial Services Software (OFSS) shares have delivered a positive performance in the near term, gaining 5.50% over the past week. However, the stock has declined 5.19% over the last one month, indicating some recent consolidation after its earlier gains.", "source": "LiveMint Markets", "pub_date_str": "21 Sep 2026, 12:43 PM IST", "pub_date_relative": "26m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Fixed Income", "Alternative Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Stock futures rise after Dow posts third straight losing week: Live updates - CNBC", "full_content": "Stock futures rise after Dow posts third straight losing week: Live updates CNBC Futures Rise: Can Market Take Off? 2026's Top Stocks Are Buys Investor's Business Daily 3 things to look out for on Monday (SP500:) Seeking Alpha Stock Market: Will S&P 500 Open Up or Down Today? Yahoo Finance US Stock Market Trends (September 21): Bitcoin Returns to $80,000, Middle East Tensions Heat Up Again Over the Weekend,\u2026 \u6df1\u6f6eTechFlow", "source": "Google News Business", "pub_date_str": "21 Sep 2026, 12:37 PM IST", "pub_date_relative": "32m ago", "cfa_topics": ["Equity Investments", "Derivatives", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "JSW Cement\u2019s regional diversification is comforting, but costs are more important now", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nAs competition for market share gains intensifies among large cement makers, JSW Cement\u2019s expanding geographical reach augurs well for medium-term growth. In March, JSW commissioned its first greenfield integrated manufacturing plant in north India at Nagaur in Rajasthan. This plant achieved an average utilization of 55% in the June quarter (Q1FY27) and a further ramp-up should buoy volume growth in the north.\n\nThe north India plant is a key growth driver, providing both incremental capacity and access to a more profitable/balanced market, Motilal Oswal added in the report. The south India cement market has been grappling with an oversupply situation for a while, which has kept pricing trends in this market muted.\n\nThis has been a constraint for cement makers with exposure in south India. North and central India have relatively more favourable demand-supply dynamics and thus, better pricing prospects.\n\nIn Q2FY27, cost control efforts by companies would be a distinguishing factor. Input cost inflation pressures would come to the fore as many companies exhaust low-cost inventory.\n\nHigher power and fuel costs, packaging expenses and elevated operating costs at the Nagaur plant dragged consolidated Ebitda down 7% year-on-year to \u20b9 299 crore in Q1. The management expects Q2 costs to remain broadly similar to Q1, with a reduction expected from Q3 onwards.\n\nThe JSW Cement stock has declined about 20% from its initial public offering issue price of \u20b9 147 in August 2025. JSW expects volume growth in the high teens in FY27, but costs are a near-term re-rating trigger.\n\nHarsha Jethmalani is a Deputy Editor at Mint with over a decade of experience covering stock markets and corporate India.", "source": "LiveMint Markets", "pub_date_str": "21 Sep 2026, 12:37 PM IST", "pub_date_relative": "32m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Your mutual fund portfolio can become riskier while you do nothing, here\u2019s what investors should track", "full_content": "Investors often assume that a mutual fund portfolio remains broadly unchanged as long as they continue holding the same schemes. But the risk of that portfolio can change significantly even when there are no fresh investments, withdrawals or switches.\n\nMarket movements can alter the balance between equity and debt, increase exposure to mid- and small-cap stocks, or make certain sectors and stocks account for a larger share of the portfolio.\n\nDebasish Mohanty, MD & Chief Strategy Officer, The Wealth Company Mutual Fund, said investors should therefore review their portfolio at an aggregate level rather than relying only on individual fund performance. A portfolio review once or twice a year can help investors check whether their asset allocation , concentration and overall risk remain aligned with their goals and investment horizon.\n\n\"This is an important aspect of portfolio management that investors sometimes overlook. Holding the same schemes does not necessarily mean holding the same level of risk,\" said Mohanty.\n\nMarket movements are one of the simplest ways this can happen. If equities rise much faster than debt, an originally balanced portfolio can gradually become equity-heavy. Similarly, strong performance in mid- and small-cap stocks can increase their contribution to the portfolio's overall risk even if the investor has made no fresh investment.\n\nThe underlying portfolios of mutual fund schemes also change over time. Fund managers buy and sell securities within their mandates, while valuations, market capitalisation and sector exposure evolve.\n\nThere is also the risk of overlap. Two or more funds in an investor's portfolio may increasingly own similar stocks, creating an unintended concentration.\n\nConcentration can rise simply because some sectors or stocks perform better than others.", "source": "LiveMint Money", "pub_date_str": "21 Sep 2026, 12:29 PM IST", "pub_date_relative": "40m ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Global Market: China tightens scrutiny of humanoid robot IPOs amid valuation concerns", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a Global Market: China tightens scrutiny of humanoid robot IPOs amid valuation concerns Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market: China tightens scrutiny of humanoid robot IPOs amid valuation concerns SECTIONS Global Market: China tightens scrutiny of humanoid robot IPOs amid valuation concerns By Anupam Nagar , ETMarkets.com Last Updated: Sep 21, 2026, 12:26:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis China is slowing humanoid-robot IPO plans as regulators scrutinise soaring valuations and government-linked revenue, pushing companies to demonstrate sustainable commercial demand and stronger evidence of real-world deployment.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on E ent movement in these stocks' share prices. (Data Source: ACE Equity)\n\nIn less than three months since the end of the June quarter, Welspun Corp shares have gained 75%, rising from Rs 1,520 to Rs 2,658. During the June 2026 quarter, FIIs increased their stake in the company to 14.61%, from 11.23% in the March 2026 quarter.\n\nSince the end of the June quarter, Redington shares have gained 45%, rising from Rs 276 to Rs 400. During the June 2026 quarter, FIIs increased their stake in the company to 61.96%, from 61.49% in the March 2026 quarter.\n\nIn less than three months, PVR Inox shares have gained 38%, rising from Rs 962 to Rs 1,329. During the June 2026 quarter, FIIs increased their stake in the company to 18.08%, from 17.86% in the March 2026 quarter.\n\nSince the end of the June quarter, Lenskart Solutions shares have gained 37%, rising from Rs 515 to Rs 707.", "source": "Economic Times Markets", "pub_date_str": "21 Sep 2026, 12:22 PM IST", "pub_date_relative": "47m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "NMDC shares rally 2% after company sets target to achieve net-zero operational emissions by 2047", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a NMDC shares rally 2% after company sets target to achieve net-zero operational emissions by 2047 NMDC Share Price Coal India Share Price KIOCL Share Price Gujarat Mineral Development Corporation Share Price Sandur Manganese & Iron Ores Share Price The Economic Times daily newspaper is available online now. Read Today's Paper NMDC shares rally 2% after company sets target to achieve net-zero operational emissions by 2047 SECTIONS NMDC shares rally 2% after company sets target to achieve net-zero operational emissions by 2047 By Surbhi Khanna , ET Online Last Updated: Sep 21, 2026, 12:22:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis NMDC shares rallied up to 2% on Monday to Rs 80.85 after setting a target to achieve net-zero operational emissions by 2047. Covering Scope 1 and Scope 2 emissions, the roadmap spans three phases focusing on renewable energy, fleet electrification, energy efficiency, and low-carbon logistics to reduce operational emissions by 90%.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "21 Sep 2026, 12:22 PM IST", "pub_date_relative": "48m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Top stocks to buy for short term: Jigar Patel recommends Castrol, HDFC Life, Gabriel - Check target price, stop loss", "full_content": "Top stocks to buy for short term: The Nifty registered its sixth consecutive weekly decline for the week ended 18 September, due to elevated crude oil prices, geopolitical tensions, concerns over interest rate hikes globally, and low retail liquidity due to strong IPO activity.\n\nOn Monday, the index rose by about 0.40% in morning trade due to buying at lower levels. However, it remains in a corrective phase, with sentiment continuing to be cautious.\n\nJigar S. Patel, Senior Manager of Equity Technical Research at Anand Rathi Share and Stock Brokers , underscored that after the recent decline, the index is approaching an important technical support zone, making it crucial to monitor price action rather than react to every short-term fall.\n\n\"The 23,000\u201323,100 zone remains the key support area and also coincides with the rising channel support. We expect this zone to provide meaningful support and ideally mark the maximum extent of the ongoing correction,\" said Patel.\n\nPatel added that the daily RSI has moved to its lowest levels of recent months, while the hourly structure is also indicating signs of a possible selling climax, suggesting that downside momentum may be getting stretched.\n\n\"On the upside, 23,500\u201323,700 remains the immediate resistance zone. A sustained move above 23,700 would indicate easing selling pressure, while 24,500 remains the important level for a stronger recovery. Until then, volatility is likely to remain elevated, and patience will be important,\" Patel said.\n\nFor Bank Nifty, Patel believes a decisive weekly close below 55,500 could trigger another phase of selling and open the possibility of further downside. On the higher side, 57,000 remains the immediate hurdle.\n\n\"A sustained breakout above this level would signal an improvement in the near-term trend and indicate that selling pressure is gradually easing.", "source": "LiveMint Markets", "pub_date_str": "21 Sep 2026, 12:12 PM IST", "pub_date_relative": "58m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "CNBC Daily Open: May the 'AI Force' be with you", "full_content": "Hello, this is Leonie Kidd coming to you from London. Welcome to another edition of CNBC's Daily Open.\n\nFor President Donald Trump and President Xi Jinping this week, AI will present not just a technological issue, but a new front in the contest for economic and political dominance.\n\nU.S. President Donald Trump has announced the creation of an \"AI Force,\" led by an adviser known as an \"AI czar.\"\n\n\"We will not in any way hinder or stifle the Growth of this incredible Industry,\" Trump wrote on Truth Social , his social media platform. \"Rather, we will cherish it, help it, and watch over it, as it grows! However, we will also be looking for BAD, and we can do that, very easily, with our already existing Criminal and Civil Justice System.\"\n\nNo other details followed Trump's statement, which followed a week of disruption for the AI industry after Anthropic, OpenAI and xAI called for a slowdown in model development, while Nvidia and Meta downplayed safety concerns.\n\nAI is expected to be front and center at the much-anticipated state meeting between Trump and Chinese President Xi Jinping .\n\nOver the weekend, Treasury Secretary Scott Bessent met with Chinese Vice Premier He Lifeng , where the two agreed to establish a \"U.S.-China AI Dialogue\" with a notification mechanism for AI incidents.\n\nThe state dinner meeting between President Trump and President Xi is due to take place on Thursday, with a slew of CEOs also in attendance.", "source": "CNBC Top News", "pub_date_str": "21 Sep 2026, 12:11 PM IST", "pub_date_relative": "58m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "US Fed rate hike: where are risks and opportunities for debt mutual fund investors ?", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nThe US Federal Reserve delivered a 25-basis-point rate hike on 16 September. The US 10-year Treasury yield touched about 5.02% that day\u2014its highest in at least a year. The yield eased to about 4.93% the next day but climbed back to almost 5% by 18 September. A year ago, the yield hovered at about 4.09%, meaning it has risen close to 90 basis points since then.\n\nBack home, the benchmark 10-year government security (G-Sec) yield crossed the 7% mark, quoting at 7.05-7.07% as of 18 September, up from roughly 6.81% in mid-August and about 6.47% a year ago. The pressure is a mix of rising US yields, higher crude oil prices and a domestic market that anticipates that the Reserve Bank of India (RBI) will also start increasing interest rates.\n\nAccording to debt market experts, bond yields can potentially rise further from here and investors need to be cautious as a spike in yields would mean a fall in bond prices. At the same time, fund managers say the rise in yields throws up opportunities.\n\nMost fund managers suggest staying at the short end of the curve\u2014funds with a maturity or duration of under a year\u2014because that segment is least sensitive to further spikes in yields.\n\n\u201cFunds with shorter maturities, especially those with a maturity profile of less than one year, are well-suited in the current market environment,\u201d said Gautam Kaul, senior fund manager-fixed income at Bandhan AMC.\n\nWithin the sub-one-year space, he pointed to the January-March 2027 maturity bucket for its balance of carry and roll-down, which limits price sensitivity while letting the portfolio reinvest at higher yields as they rise.\n\nRoll-down is a small gain that a bond earns just by getting older. As time passes, a bond's remaining life shrinks\u2014a paper with five months left today has only two months left after three months.", "source": "LiveMint Money", "pub_date_str": "21 Sep 2026, 12:11 PM IST", "pub_date_relative": "58m ago", "cfa_topics": ["Economics", "Fixed Income", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions a rant. These funds will be allotted on a private placement basis to Minerva Ventures Fund.\n\nThe stock was trading 6.94% higher at \u20b9 1045.9 per share on BSE with a market capitalisation of \u20b9 6,962.95 crore at 11:37 am on Monday, September 21. The stock had touched an intraday high of \u20b9 1,055.85 per share and an intraday low of \u20b9 969.40 per share. Its return on equity (ROE) stood at -0.73%.\n\nThe stock has delivered 35.42% return in two weeks and around 62.8% return in one month.", "source": "LiveMint Markets", "pub_date_str": "21 Sep 2026, 12:00 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Trafigura to float supertanker arm in first IPO of a business", "full_content": "Commodities trader to take Volare Shipping public in Oslo as Gulf crisis drives tanker rates to record highs", "source": "FT Markets", "pub_date_str": "21 Sep 2026, 12:00 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "OFSS shares tumble 7%; Wipro, Coforge, Infosys shares down up to 2%. Why are IT stocks under pressure today?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a OFSS shares tumble 7%; Wipro, Coforge, Infosys shares down up to 2%. Why are IT stocks under pressure today? Coforge Share Price LTM Share Price Oracle Financial Services Software Share Price Persistent Systems Share Price Mphasis Share Price The Economic Times daily newspaper is available online now. Read Today's Paper OFSS shares tumble 7%; Wipro, Coforge, Infosys shares down up to 2%. Why are IT stocks under pressure today? SECTIONS OFSS ixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}], "updated_at": "21 Sep 2026, 01:10 PM IST", "total_stories": 343};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
