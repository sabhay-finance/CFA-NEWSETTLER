ds and market mechanics are fundamental CFA exam areas."}, {"title": "Asia\u2019s Stock Rescue Efforts Gather Pace After Wall Street Plunge", "full_content": "Asian authorities are stepping up efforts to stem a deepening stock-market rout, with China easing margin requirements, and Taiwan and South Korea rolling out intervention measures following Friday\u2019s plunge in US equities.\n\nIn China, the minimum margin requirement for investors buying securities with borrowed funds will fall to 80% from 100% on Nov. 30, according to notices issued on Sunday by the Shanghai, Shenzhen and Beijing stock exchanges with approval from the China Securities Regulatory Commission. The exchanges had raised the ratio to 100% from 80% in January to curb leverage risks.\n\nRegulators said the latest adjustment is related to a marked decline in margin-financing activity and relatively low overall leverage. Brokerages can apply the revised rules to outstanding financing contracts when calculating available margin balances, while investors engaged in abnormal trading may face stricter requirements and other risk controls.\n\nThe change could unleash nearly 400 billion yuan in additional funds, the Xinhua News Agency reported Sunday, citing the regulator.\n\nThe moves add to a series of efforts by Beijing to restore confidence after a months-long rout pushed the benchmark CSI 300 Index into a bear market. The gauge tumbled over 8% in October, its worst monthly performance in more than a decade, as weakness in the economy and a sharp reversal in tech shares weighed on sentiment.\n\nAlso on Sunday, South Korea announced phased measures to calm markets amid rising volatility.", "source": "LiveMint Markets", "pub_date_str": "22 Nov 2026, 06:21 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Looking for the Formula to Stop an Apocalypse - The New York Times", "full_content": "Looking for the Formula to Stop an Apocalypse The New York Times Mike Winer wants math, not guesswork, to keep AI in check Crypto Briefing Study Argues Perfectly Controlling Advanced AI Is Mathematically Impossible StudyFinds Ensuring powerful AI is safe a 'math challenge' The Standard (HK)", "source": "Google News Business", "pub_date_str": "22 Nov 2026, 05:57 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Correction or deeper reckoning? Investors seek signs US stock selling will abate - Reuters", "full_content": "Correction or deeper reckoning? Investors seek signs US stock selling will abate Reuters The 200-Day Average Broke. The Next 4 Weeks Are Critical - RIA Real Investment Advice The S&P 500 Just Fell 4 Straight Weeks From a Record High. Here\u2019s Why I\u2019m Buying the Dip. The Motley Fool Wall Street's Last Line Of Defense Is Breaking (SPX) Seeking Alpha The S&P 500 Is Having the Longest Losing Streak Since February 2020 Yahoo Finance", "source": "Google News Business", "pub_date_str": "22 Nov 2026, 05:52 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Top Wall Street analysts favor these 3 dividend stocks for strong returns", "full_content": "Investors often favor dividend stocks for their regular income and the promise of potential share price appreciation. But selecting the right dividend stocks from a huge pool of companies can be difficult.\n\nTop Wall Street analysts can help shortlist attractive dividend-paying stocks, as their recommendations are backed by thorough analysis of a company's financials.\n\nHere are three dividend-paying stocks that are highlighted by Wall Street's top pros, as tracked by TipRanks, a platform that ranks analysts based on their past performance.\n\nDevon Energy ( DVN ), an independent oil and natural gas exploration and production company, reported better-than-expected third-quarter results. The company announced a quarterly dividend of 32 cents per share for the fourth quarter, payable December 30. Based on the fixed dividends paid over the trailing 12 months, DVN yields 2.85%.\n\nAfter hosting a virtual investor meeting with management, Goldman Sachs analyst Neil Mehta reiterated a buy rating on Devon, with a price target of $59 . Mehta said that he is now more confident in management's outlook for delivering strong near-term capital returns as well as efforts to drive operational efficiencies and productivity gains.\n\nDevon sees an opportunity to increase share repurchases, driven by solid free cash flow (FCF), contributions from the Eagle Ford divestiture and continued improvement in the balance sheet, Mehta said. Devon expects share buybacks worth more than $1 billion in Q4 2026, up from $414 million in the third quarter, backed by a strong pricing backdrop and improved capital efficiency.\n\nMehta, a 5-star analyst, said Devon expects about $6.3 billion of excess FCF in 2027, including about $3.5 billion of net proceeds from the Eagle Ford sale. That would enable the company to accelerate buybacks while progressing toward its goal of reducing gross debt to about $9 billion by early 2027.", "source": "CNBC Top News", "pub_date_str": "22 Nov 2026, 05:43 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "The Nasdaq is in freefall. Here's one stock to look at", "full_content": "I asked Claude after Friday's close what I should do about the tanking stock market. Its advice was surprisingly useful: avoid panic selling and look for opportunities. A 40 VIX , which it touched Friday, might provide those opportunities. Specifically, a higher VIX (higher options premiums) signals fear, but it also creates an opportunity to sell elevated premium in some premium stocks, like Amazon .\n\nAmazon's cloud business is growing at its fastest pace in nearly five years. AWS revenue rose 39.3% YoY in the third quarter, and management reported a $578 billion backlog. Trailing 12-month operating cash flow rose 29% to $168.3 billion. However, infrastructure investment accelerated, resulting in more than $42 billion in negative cash flow. The competing forces of accelerating growth and the cost of supplying it could keep the stock in its range over the next four weeks. Its shares are only off 14% from its recent highs, comparatively better than the Nasdaq Composite's near 19% decline.\n\nAWS demand supports the lower end of the range. The backlog gives Amazon a basis for adding capacity even as investors scrutinize the cash cost. Cash spending could temper an upside rerating.\n\nAmazon, YTD The next leg higher may require evidence that new capacity can earn attractive returns at this scale, and that evidence may be in short supply over the next couple of months.\n\nSell the Dec. 18, 2026 AMZN 235/285 strangle for an indicative $5.90 credit per share.\n\nMax reward \u2014 $590 per strangle if AMZN finishes between $235 and $285 at expiration, before fees.\n\nMax risk \u2014 Unlimited on the uncovered call, but one should think of the trade as risking getting short at a net price above $290, a nearly 13% premium to today's closing price. The downside loss would reach $22,910 per strangle if AMZN fell to zero. The credit is roughly 2.3% of a $260 reference share price over four weeks, or nearly 30% on a simple annualized basis. That comparison uses the share price as its denominator.", "source": "CNBC Top News", "pub_date_str": "22 Nov 2026, 05:40 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Derivatives", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Correction or deeper reckoning? Investors seek signs US stock selling will abate", "full_content": "USA-STOCKS/CORRECTION (ANALYSIS):ANALYSIS-Correction or deeper reckoning? Investors seek signs US stock selling will abate", "source": "LiveMint Markets", "pub_date_str": "22 Nov 2026, 05:31 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "US ports face cyber attack onslaught as hackers target vital trade routes", "full_content": "America\u2019s biggest crude oil export hub reports thousands of attempted hacks each day as shipping companies battle breaches", "source": "FT Markets", "pub_date_str": "22 Nov 2026, 05:30 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Will Anthropic\u2019s IPO buck the tech sell-off?", "full_content": "Market Questions is the FT\u2019s guide to the week ahead", "source": "FT Markets", "pub_date_str": "22 Nov 2026, 05:30 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Asia, Africa to drive expansion of India's export markets as shipments grow across regions", "full_content": "India's merchandise exports have shown strong growth, particularly in Africa and Asia, according to recent government data. Exports to Africa increased by 44 percent, while shipments to Asia surpassed USD 100 billion. Engineering goods, electronic goods, and petroleum products have driven this expansion significantly. Notable growth was observed in markets such as Tanzania and Kenya in Africa.", "source": "Economic Times Economy", "pub_date_str": "22 Nov 2026, 05:26 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "8th Pay Commission salary hike: Why employees want 50% DA merged with basic pay before fitment factor calculation", "full_content": "BPMS has asked the 8th Pay Commission to merge 50% of existing DA with basic pay and pension before deciding revised pay structures. The proposal could raise the salary base used to calculate the fitment factor but awaits government approval.", "source": "LiveMint Money", "pub_date_str": "22 Nov 2026, 05:16 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "South Korea prepares market stabilisation funds after KOSPI hits 10-month low", "full_content": "In response to falling stock indices, South Korea's finance ministry is poised to activate market stabilisation funds. The KOSPI index has plummeted, marking its lowest point in the last ten months. An emergency meeting was convened by the finance minister to explore strategies for restoring investor confidence. Among the discussed actions are temporary regulations on stock buyback limits for publicly listed companies.", "source": "Economic Times Markets", "pub_date_str": "22 Nov 2026, 05:15 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Nscale slows hiring and curtails spending ahead of planned $35bn IPO", "full_content": "UK data centre operator pauses hiring for all but critical roles", "source":     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
