nk accounts.\n\nThe IPO received an overall subscription of 124.02 times, with investors placing bids for 745.63 crore shares against the 6.01 crore shares available for subscription . Qualified institutional buyers (QIBs) drove the demand, with their portion subscribed 232.79 times on the final day. The non-institutional investor (NII) category was subscribed 185.21 times, while the retail quota received bids worth 40.27 times the shares on offer. The employee portion was subscribed 12.37 times.\n\nThe public issue was open for bidding between August 27 and August 31. Following the finalisation of the allotment on September 1, refunds and the credit of shares to successful applicants are expected to take place on September 2. Lumino Industries shares are scheduled to make their stock market debut on the BSE and NSE on September 3.\n\nLumino Industries shares were commanding a grey market premium (GMP) of around \u20b9 48 per share on Tuesday.\n\nConsidering the upper end of the IPO price band at \u20b9 82 per share, the current GMP indicates an estimated listing price of around \u20b9 130. This translates into a potential listing gain of 58.54%.\n\nHowever, investors should keep in mind that the grey market operates unofficially, and GMP levels can fluctuate frequently depending on prevailing market sentiment.\n\nThe allotment status can be checked online by following these steps:\n\nFor NSE, visit allotment page: https://www.nseindia.com/invest/check-trades-bids-verify-ipo-bids", "source": "LiveMint Markets", "pub_date_str": "01 Sep 2026, 06:45 AM IST", "pub_date_relative": "17m ago"}, {"title": "Earnings call transcript: BetMakers posts FY26 profit gains despite revenue miss", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Sep 2026, 06:40 AM IST", "pub_date_relative": "22m ago"}, {"title": "Nikkei 225 trapped in JPY 65500-66500 range: Live levels", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Sep 2026, 06:37 AM ay, 1 September. The shares of Skyways Air Services IPO will be listed on both exchanges - BSE and NSE.\n\nThe allotment of Skyways Air Services IPO was finalised on Friday last week, following stellar response from investors during the subscription period.\n\nThe issue received an overwhelming response from investors, with the overall subscription reaching 71.25 times. Qualified institutional buyers (QIBs) drove the demand, subscribing to their reserved portion 140 times. The non-institutional investor (NII) category was subscribed 87 times, while the retail portion saw 25.40 times subscription, according to exchange data.\n\nThe shares of Skyways Air Services IPO is commanding a premium of \u20b9 32 in the grey market. This means that the GMP of Skyways Air Services IPO is +32, indicating an estimated listing price of \u20b9 170, which is 23.19% higher than the IPO price of \u20b9 138.\n\nThe GMP indicates the potential difference between an IPO\u2019s issue price and its expected listing price in the unofficial market. However, it is merely an early market indicator and should not be used as the sole basis for making investment decisions.\n\nAccording to Mahesh M. Ojha, Vice President Research & Business Development, Kantilal Chhaganlal Securities Pvt. Ltd, the Skyways Air Services IPO is likely to deliver an estimated listing gain of 22% to 26%.\n\nOjha recommended short-term investors to book profits, however, suggested long-term investors to hold the stock.\n\n\u201cis also expanding its capabilities through technology platforms such as SLS HIKE and SLS 100X, while its consortium with Swissport International AG for the proposed Kolkata cargo terminal provides an additional long-term growth opportunity,\u201d said Ojha.", "source": "LiveMint Markets", "pub_date_str": "01 Sep 2026, 06:21 AM IST", "pub_date_relative": "42m ago"}, {"title": "Venezuela grants U.S.-backed NABEP 100-year concessions for 17 oil fields, White House says - CNBC", "full_content": "Venezuela grants U.S.-backed NABEP 100-year concessions for 17 oil fields, White House says CNBC Stock Market Midday, Aug. 25: Tech Stocks Rebound and Dick's Sporting Goods Plummets 27% The Motley Fool DKS, OKTA, and CRWD: 3 Trending Stocks Making Big Moves Zacks Investment Research Stocks making the biggest moves premarket: Dick's Sporting Goods, Advanced Micro Devices, Kura Oncology & more CNBC Stocks making the biggest moves premarket: Chevron, PG&E, GameStop and more CNBC", "source": "Google News Business", "pub_date_str": "01 Sep 2026, 06:17 AM IST", "pub_date_relative": "46m ago"}, {"title": "Traeger chief sales officer Cole VandenAkker sells $152,069 in stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Sep 2026, 06:15 AM IST", "pub_date_relative": "47m ago"}, {"title": "Oil extends gains as Trump threatens further Iran strikes", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Sep 2026, 06:13 AM IST", "pub_date_relative": "49m ago"}], "cfa": [{"title": "Breakout stocks to buy or sell: Sumeet Bagadia recommends five shares to buy today \u20141 September 2026", "full_content": "Buy or sell stocks: Indian equity markets ended lower on Monday, 31 August, led by selling pressure in utility, IT and FMCG stocks. Renewed tensions in West Asia pushed crude oil prices higher, raising concerns over inflation and the possibility of interest rates staying elevated for longer.\n\nThe 30-share BSE Sensex fell 307.24 points, or 0.40%, to close at 76,957.27. Of its 30 constituents, 20 ended in the red, while 10 posted gains. During the session, the index declined as much as 513.19 points, or 0.66%, to hit 76,751.32.\n\nThe 50-share NSE Nifty also ended lower, declining 95.25 points, or 0.39%, to settle at 24,080.40.\n\nNifty 50 closed lower at 24,080.40, declining 95.25 points (-0.39%), after opening at 24,117.55, with an intraday high of 24,128.70 and low of 23,993.60. The index opened with a 58-point gap-down and witnessed selling pressure initially, but buying emerged near the 24,000 level, where the index found strong support and recovered from the day's low. The daily candle reflects buying interest at lower levels, indicating that 24,000 is developing as an important base.\n\nAccording to Sumeet Bagadia, Executive Director at Choice Broking, Nifty continues to trade below all key moving averages, keeping the broader trend cautious. RSI stands at 43.70, while India VIX rose to 11.19, up by 4.78% indicating an increase in market volatility.\n\n\u201cTechnically, Nifty is likely to maintain a Sideways bias as the index continues to hold the 24,000 zone despite remaining below its key moving averages. Immediate support is placed at 23,900\u201323,950, while 24,200\u201324,250 remains the key resistance zone. A sustained move above 24,250 could support a recovery towards higher levels, whereas a break below 23,900 may resume the selling pressure. The expected trading range for the next session is 23,900\u201324,250.", "source": "LiveMint Markets", "pub_date_str": "01 Sep 2026, 06:49 AM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Economics", "Equity Investments", "Derivatives", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Lumino Industries IPO allotment likely today: Here's how to check allotment status online as GMP remains strong", "full_content": "Lumino Industries IPO Allotment : Lumino Industries is likely to finalise the basis of allotment for its \u20b9 700-crore initial public offering ( IPO ) today, September 1, after the issue witnessed overwhelming demand during its three-day subscription period. Applicants are expected to receive updates regarding their allotment status today, while successful bidders may also receive notifications regarding the debit of funds from their bank accounts.\n\nThe IPO received an overall subscription of 124.02 times, with investors placing bids for 745.63 crore shares against the 6.01 crore shares available for subscription . Qualified institutional buyers (QIBs) drove the demand, with their portion subscribed 232.79 times on the final day. The non-institutional investor (NII) category was subscribed 185.21 times, while the retail quota received bids worth 40.27 times the shares on offer. The employee portion was subscribed 12.37 times.\n\nThe public issue was open for bidding between August 27 and August 31. Following the finalisation of the allotment on September 1, refunds and the credit of shares to successful applicants are expected to take place on September 2. Lumino Industries shares are scheduled to make their stock market debut on the BSE and NSE on September 3.\n\nLumino Industries shares were commanding a grey market premium (GMP) of around \u20b9 48 per share on Tuesday.\n\nConsidering the upper end of the IPO price band at \u20b9 82 per share, the current GMP indicates an estimated listing price of around \u20b9 130. This translates into a potential listing gain of 58.54%.\n\nHowever, investors should keep in mind that the grey market operates unofficially, and GMP levels can fluctuate frequently depending on prevailing market sentiment.\n\nThe allotment status can be checked online by following these steps:\n\nFor NSE, visit allotment page: https://www.nseindia.com/invest/check-trades-bids-verify-ipo-bids", "source": "LiveMint Markets", "pub_date_str": "01 Sep 2026, 06:45 AM IST", "pub_date_relative": "17m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Earnings call transcript: BetMakers posts FY26 profit gains despite revenue miss", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Sep 2026, 06:40 AM IST", "pub_date_relative": "22m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Hy-Tech Engineers IPO listing date today. GMP hints at up to 66% listing gain", "full_content": "Hy-Tech Engineers IPO listing date has been scheduled for today (Tuesday, 1 September) on the bourses at 10:00 IST. Hy-Tech Engineers IPO allotment was finalised on Friday, 28 August. According to details on the BSE website, Hy-Tech Engineers share price will list in a special pre-open session on both the BSE and NSE during Tuesday's trades. Hy-Tech Engineers share price today will be available for trade from 10:00 IST.\n\nMembers of the Exchange are notified that starting on Tuesday, 1 September 2026, the equity shares of Hy-Tech Engineers Limited will be listed and allowed for trading on the Exchange under the 'T' Group of Securities, as per the BSE website.\n\nHy-Tech Engineers IPO GMP today, or grey market premium , is +35. Considering the upper end of the IPO price band and the current premium in the grey market, the estimated listing price of Hy-Tech Engineers share price was indicated at \u20b9 88 apiece, which is (66.04% higher than the IPO price of \u20b9 53.\n\nAccording to grey market trends observed over the past 13 sessions, today's GMP for the IPO is trending upward, suggesting a favourable listing. During this timeframe, experts noted that the GMP fluctuated between \u20b9 5 and \u20b9 45.\n\nAccording to Mahesh M. Ojha, Vice President \u2013 Research & Business Development at Kantilal Chhaganlal Securities Pvt. Ltd, Hy-Tech Engineers Limited appears reasonably valued at the upper end of its price band, with a P/E of 22.25x FY26 earnings and an EV/EBITDA of 12.15x, implying a post-issue market capitalisation of approximately \u20b9 5,027 million.\n\nOjha said the company is well-positioned to benefit from the growth of the hydraulic fittings industry and the broader capital goods sector. He highlighted that Hy-Tech Engineers has delivered a revenue CAGR of 17.28% and maintained EBITDA margins of around 22% over the past two years, which he said is higher than that of most peers.\n\nThe company also has a significant share of the Indian domestic market.", "source": "LiveMint Markets", "pub_date_str": "01 Sep 2026, 06:35 AM IST", "pub_date_relative": "28m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "MSCI rejig disrupts arbitrage playbook, fuels late-session volatility", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a MSCI rejig disrupts arbitrage playbook, fuels late-session volatility Lenskart Solutions Share Price The Economic Times daily newspaper is available online now. Read Today's Paper MSCI rejig disrupts arbitrage playbook, fuels late-session volatility SECTIONS MSCI rejig disrupts arbitrage playbook, fuels late-session volatility ET Bureau Last Updated: Sep 01, 2026, 06:40:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis MSCI index rebalancing on Monday saw sharp stock swings in the final minutes. Global funds adjusted holdings, impacting several stocks significantly during the new Closing Auction System. The Closing Auction Session accounted for a substantial portion of the day's total cash market turnover. Some large-cap stocks experienced unexpected declines without clear fundamental reasons. Traders and investors are now adapting to the new dynamics introduced by the auction system.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.  Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "01 Sep 2026, 06:10 AM IST", "pub_date_relative": "53m ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Stock recommendations for 1 September from MarketSmith India", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nStock market recap: Benchmark equity indices, Sensex and Nifty 50, closed lower on Monday due to selling in IT and FMCG shares as renewed tensions in West Asia triggered a rally in crude oil prices.\n\nThe 30-share BSE Sensex declined 307.24 points, or 0.40%, to settle at 76,957.27 with 20 of its constituents ending lower and 10 with gains. The 50-share NSE Nifty dropped 95.25 points, or 0.39%, to end at 24,080.40.\n\nAmong the 30 Sensex firms, Adani Ports, ITC, Bharti Airtel, HDFC Bank , Infosys and Kotak Mahindra Bank were the major laggards.\n\nSun Pharma, ICICI Bank, Axis Bank and State Bank of India were among the gainers.\n\nOn Monday, Indian equities ended on a weaker note, with Nifty 50 closing at 24,080.40, down 95.25 points or 0.39%, after trading between 23,993.60 and 24,128.70.\n\nSelling pressure was more pronounced in the broader market, with overall market breadth distinctly negative: 1,340 stocks advancing, 2,204 stocks declining, and 97 remaining unchanged, translating into an advance-decline ratio of roughly 0.61:1. On the sectoral front, FMCG, Metals, IT, Media and Consumer Durables were the key laggards, while Private Banks, Pharma, Healthcare, and Oil & Gas provided some support.\n\nSentiment remained cautious amid elevated crude oil prices, renewed US-Iran geopolitical tensions and concerns around higher US bond yields and interest rates. Sensex also finished lower, broadly mirroring Nifty\u2019s weakness.", "source": "LiveMint Markets", "pub_date_str": "01 Sep 2026, 06:00 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Fixed Income", "Alternative Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Sebi weighs refining F&O warnings on brokerage apps as retail losses remain high", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nThe Securities and Exchange Board of India (Sebi) is discussing with brokers ways to refine futures and options (F&O) risk warnings on trading platforms as retail losses in the segment remain high, two people close to the matter told Mint .\n\n\u201cThe aim is to make the warnings more dynamic, rather than a simple warning that remains the same all the time. Such a warning is expected to attract more retail attention and ensure people are careful before they trade in the segment,\u201d said one of the two officials cited above on the condition of anonymity.\n\nThe discussions follow the markets regulator\u2019s 20 August study on individual traders\u2019 losses in the F&O segment in 2025-26, which showed that while total losses moderated year-on-year, the average loss per trader increased.\n\nTotal losses among individual equity derivatives traders stood at \u20b9 91,685 crore in FY26, marginally lower than \u20b9 1.12 trillion in FY25. However, the average loss per trader rose 2% to \u20b9 1.17 lakh from \u20b9 1.13 lakh a year ago.\n\nThe share of individual traders who lost money also remained elevated. Sebi found that 87.7% of individual traders incurred losses while trading in the derivatives segment in FY26, compared with 90.9% in FY25.\n\nAt the same time, the number of individual traders participating in derivatives declined for the first time since FY16. About 8.77 million individual traders participated in the segment in FY26, down 18% from the previous fiscal.\n\nMost of these traders were options buyers. In FY26, 93% of individual traders were classified as \u201conly options buyers\u201d and another 4% as \u201cmajorly options buyers\u201d. About 90% of the former and 75% of the latter incurred losses.", "source": "LiveMint Markets", "pub_date_str": "01 Sep 2026, 06:00 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stocks in news: Bharti Airtel, Happiest Minds Technologies, PVR INOX, Milky Mist Dairy and Mankind Pharma", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Stocks in news: Bharti Airtel, Happiest Minds Technologies, PVR INOX, Milky Mist Dairy and Mankind Pharma E2E Networks Share Price Sigma Advanced Systems Share Price TechNVision Ventures Share Price Kernex Microsystems (India) Share Price Blue Cloud Softech Solutions Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Stocks in news: Bharti Airtel, Happiest Minds Technologies, PVR INOX, Milky Mist Dairy and Mankind Pharma SECTIONS Stocks in news: Bharti Airtel, Happiest Minds Technologies, PVR INOX, Milky Mist Dairy and Mankind Pharma By Kumar Gaurav , ETMarkets.com Last Updated: Sep 01, 2026, 06:00:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Indian equity markets ended lower on August 31, responding to prevailing global economic dynamics. A modest decline in the Nifty50 index brought it below essential moving averages. Key corporate updates emerged, including major merger announcements and buyback initiatives from Happiest Minds Technologies and PVR INOX. Milky Mist Dairy showed remarkable profit growth, whereas E2E Networks secured a vital contract.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "01 Sep 2026, 06:00 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "IPO Rush: India Inc may raise up to Rs 25,000 crore in September", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a IPO Rush: India Inc may raise up to Rs 25,000 crore in September JM Financial Share Price Choice International Share Price IIFL Capital Services Share Price Anand Rathi Share & Stock Brokers Share Price 5Paisa Capital Share Price The Economic Times daily newspaper is available online now. Read Today's Paper IPO Rush: India Inc may raise up to Rs 25,000 crore in September SECTIONS IPO Rush: India Inc may raise up to Rs 25,000 crore in September ET Bureau Last Updated: Sep 01, 2026, 06:10:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India's primary market anticipates a strong September with IPOs worth twenty to twenty-five thousand crore. Nearly twenty-five companies are preparing to launch offerings before their approvals expire. This surge reflects improved issuer sentiment after a cautious first half of the year. Companies are capitalizing on better market conditions and recent successful listings. This activity aims to complete fundraising plans before regulatory approvals lapse.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets .", "source": "Economic Times Markets", "pub_date_str": "01 Sep 2026, 05:54 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Mid, smallcaps likely to outperform in September; Nifty seen range-bound: Analysts", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Mid, smallcaps likely to outperform in September; Nifty seen range-bound: Analysts IIFL Capital Services Share Price Choice International Share Price JM Financial Share Price Anand Rathi Share & Stock Brokers Share Price 5Paisa Capital Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Mid, smallcaps likely to outperform in September; Nifty seen range-bound: Analysts SECTIONS Mid, smallcaps likely to outperform in September; Nifty seen range-bound: Analysts By Kairavi Lukka , ET Bureau Last Updated: Sep 01, 2026, 06:07:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis September historically favors mid- and small-cap stocks over large-caps. Analysts anticipate this trend continuing, expecting limited upside for the Nifty. Heavyweight sectors show recent weakness, and foreign investor selling has resumed. Domestic fund flows remain concentrated in mid- and small-cap stocks. Market action is expected to remain stock-specific until fresh triggers emerge.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets .", "source": "Economic Times Markets", "pub_date_str": "01 Sep 2026, 05:52 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Stock futures are little changed after Wall Street closes out winning August: Live updates", "full_content": "Stock futures were near the flatline on Monday night following a losing session, though the major U.S. benchmarks still managed to post monthly advances.\n\nDow Jones Industrial Average futures advanced 48 points. S&P 500 futures were up less than 0.1%. Nasdaq-100 futures were little changed.\n\nThe S&P 500 advanced 2.6% in August, while the Nasdaq Composite rose 3.9% in that time. The Dow climbed 1.3% for the month, its fifth straight monthly advance.\n\nIn Asia, Japan's Nikkei 225 fell 0.91%, while the Topix was flat. The Kospi as well as the small-cap Kosdaq fell more than 1% in early trading. Australia's benchmark S&P/ASX 200 was 0.36% lower.\n\nHowever, Wall Street ended the month on a sour note. The Dow dropped more than 370 points in regular trading, as oil prices climbed \u2014 pushing rates higher \u2014 following the U.S. striking two rocket launchers on Iran's Larak Island. The S&P 500 and Nasdaq Composite also fell on the day.\n\n\"Despite trading less than 115bps from ATHs going into today's session, the market is exhibiting signs of nervousness across myriad of indicators,\" traders at Goldman Sachs wrote, pointing to new American Association of Individual Investors Sentiment Survey data. \"This attitude toward risk is not just theoretical, investors are quite literally putting their money where their mouth is in terms of portfolio risk allocations.\"\n\nOn top of that, September has been a historically bad month for stocks .\n\nThose seasonal factors along with a jam-packed economic calendar are likely to keep investors on their toes the rest of the week. Manufacturing and services sector data are due Tuesday and Wednesday.", "source": "CNBC Top News", "pub_date_str": "01 Sep 2026, 05:46 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Derivatives", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Amid HDFC Bank CEO exit, the lingering poser on post-merger math", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nHDFC Bank\u2019s news of a leadership reset briefly brought investor cheer on view that a new leader could help address concerns over alleged governance issues and regulatory lapses. Its shares rose nearly 2% intraday on Monday, the first trading day after the announcement of Sashidhar Jagdishan not seeking an extension as chief executive beyond his 26 October term. The stock then reversed course to close 1.5% lower, reflecting deeper concerns over India\u2019s largest private-sector lender.\n\nThe one big challenge for Jagdishan\u2019s successor will be to deliver on a merger whose promised benefits have been slow to show up.\n\nThree years after mortgage giant HDFC Ltd was folded into the bank , margins and returns remain under pressure, the stock is down more than 28% this year, and investors are still waiting for the larger balance sheet to translate into stronger profitability and returns.\n\nThe leadership transition also comes after a turbulent few months for the bank, marked by the exits of former chairman Atanu Chakraborty and Sampath Kumar, (group head of branch banking), and controversies involving Credit Suisse AT-1 bonds, the Maharashtra State Road Development Corporation deposit and the alleged mis-selling of Carlisle\u2019s Luxembourg Life Fund through the bank\u2019s Dubai operations in 2019.", "source": "LiveMint Markets", "pub_date_str": "01 Sep 2026, 05:45 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "FCNR scheme draws billions, but does little to ease rupee pressure", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nMUMBAI: The Reserve Bank of India\u2019s (RBI) foreign currency non-resident bank (FCNR (B)) deposit window closed on Monday after attracting a much larger-than-expected pool of dollars, even as the inflows had a limited success in arresting the decline in the rupee.\n\nAnnounced on 5 June and implemented from 8 June, the facility allowed banks to raise fresh three- and five-year FCNR(B) deposits from non-resident Indians and swap the dollars with the RBI at a concessional rate that effectively offset the hedging cost. The broader swap package also covered overseas foreign-currency borrowings (OFCBs) and external commercial borrowings (ECBs).\n\nAs of 21 August, total inflows under the three swap windows had reached $72.85 billion, including $65.4 billion through FCNR(B), $4.86 billion through OFCBs and $2.59 billion through ECBs. The RBI also brought forward the FCNR(B) closure date to 31 August from 30 September, citing the \u201cencouraging response\u201d. Swaps against eligible deposits, however, can continue with the RBI until 11 September.\n\nThe impact of the scheme on the rupee has been less straightforward. The currency was at 94.94 per US dollar on 5 June, when the RBI announced the measures, having strengthened sharply from the previous close of 95.79, Bloomberg data showed.\n\nThe rupee had already hit a record low of 96.97 against the dollar on 15 May, pressured by high crude oil prices, global bond yields and foreign investor outflows. By 31 August, the rupee was trading around 95.45 per dollar, after ending the previous week at 95.39 against the greenback.", "source": "LiveMint Markets", "pub_date_str": "01 Sep 2026, 05:41 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income", "Derivatives", "Alternative Investments"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Pre-market action: Here's the trade setup for today's session", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Pre-market action: Here's the trade setup for today's session The Economic Times daily newspaper is available online now. Read Today's Paper Pre-market action: Here's the trade setup for today's session SECTIONS Pre-market action: Here's the trade setup for today's session By Akash Podishetti , ETMarkets.com Last Updated: Sep 01, 2026, 05:37:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Nifty declined on Monday as crude prices and geopolitical worries impacted market sentiment. Foreign investors sold shares while domestic institutions bought them on the same day. The Indian rupee reached a four-week high against the US dollar. Investors will closely monitor upcoming economic data releases this week. Market analysts suggest a cautious approach due to ongoing global tensions.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "01 Sep 2026, 05:37 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}], "updated_at": "01 Sep 2026, 07:03 AM IST", "total_stories": 380};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
