 account and the right time to withdraw your money.\u201d]\n\nThe post carries two images explaining the rules in Hindi and English, along with a QR code linking to a guidance video for members. According to the images, \u201cEPF interest will be credited for the next 3 years, i.e., up to 61 years of age. After that, your EPF account will become inoperative, so it is advised to withdraw your EPF.\u201d\n\nAn EPF account does not stop earning interest the day an employee retires at 58. Under the EPF rules , interest continues to be credited until the account becomes inoperative.\n\nAn account is generally considered inoperative when no contributions have been made for 36 months after the member retires at 55 or later, or after the member settles abroad permanently. For someone retiring at 58, the account may become inoperative at 61 if no contributions are made.\n\nMembers should therefore check the latest EPFO provisions applicable to their accounts before deciding when to withdraw their accumulated contributions.", "source": "LiveMint Money", "pub_date_str": "23 Oct 2026, 11:26 AM IST", "pub_date_relative": "11m ago"}, {"title": "Piyush Goyal discusses investment opportunities with Bayer, Fresenius", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a Piyush Goyal discusses investment opportunities with Bayer, Fresenius The Economic Times daily newspaper is available online now. Read Today's Paper Piyush Goyal discusses investment opportunities with Bayer, Fresenius SECTIONS Piyush Goyal discusses investment opportunities with Bayer, Fresenius PTI Last Updated: Oct 23, 2026, 11:26:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Piyush Goyal held meetings with Bayer and Fresenius executives to discuss investment opportunities in India's healthcare sect  MCX as rising oil prices fuel inflation concerns and expectations of higher interest rates for longer. Investors track the US Federal Reserve meeting, dollar movements and geopolitical tensions for cues on precious metals.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "23 Oct 2026, 11:09 AM IST", "pub_date_relative": "28m ago"}, {"title": "SGB 2018-19 Series II final redemption today: Investors to pocket 366% gains; check the RBI fixed price, interest rate", "full_content": "The Reserve Bank of India ( RBI ) has fixed the final redemption price of Sovereign Gold Bonds (SGB) 2018-19 Series II at \u20b9 14,425 per gram. The bonds mature today, October 23, 2026, completing their eight-year tenure.\n\nSovereign Gold Bonds are government securities denominated in grams of gold and issued by the RBI on behalf of the Government of India. They offer investors exposure to gold prices without requiring physical gold ownership.\n\nAccording to the RBI press release issued on Thursday, \u201cGold bonds shall be repayable on the expiration of eight years from the date of issue of the gold bonds. Accordingly, the final redemption date of the above tranche shall be October 23, 2026.\u201d\n\nThe subscription window for this tranche was October 15\u201319, 2018, and the bonds were issued on October 23, 2018.\n\nIn its press release, the RBI stated, \u201cThe redemption price of SGB shall be based on the simple average of the closing price of gold of 999 purity of the previous three business days from the date of redemption, as published by the India Bullion and Jewellers Association Ltd (IBJA).\u201d\n\nAccordingly, the RBI fixed the final redemption price at \u20b9 14,425 per gram, based on the average closing gold prices on October 19, October 21, and October 22, 2026.\n\nAccording to the Ministry of Finance's October 12, 2018, release, the issue price of SGB 2018-19 Series II was fixed at \u20b9 3,146 per gram for offline subscriptions. Investors who applied online and paid digitally received a \u20b9 50-per-gram discount, reducing the issue price to \u20b9 3,096.\n\nAt the final redemption price of \u20b9 14,425 per gram, the capital gains are as follows:", "source": "LiveMint Money", "pub_date_str": "23 Oct 2026, 11:07 AM IST", "pub_date_relative": "30m ago"}, {"title": "Colgate Share Price: Jefferies Maintains 'Buy', Citi And Goldman Sachs Retain 'Sell'", "full_content": "Colgate shares are in focus after Citi and Goldman Sachs retained their Sell ratings, while Jefferies maintained Buy. All three brokerages cut their target prices, citing modest underlying growth, higher brand investments, and pressure on Ebitda margins.", "source": "NDTV Profit", "pub_date_str": "23 Oct 2026, 11:06 AM IST", "pub_date_relative": "31m ago"}, {"title": "Swiggy shares hit 52-week low, down 35% in 1 month- should investors buy the stock after Q2 results? Expert view", "full_content": "Swiggy shares crashed more than 17% to hit a 2-week low in intraday trade on Friday, 23 October, a day after reporting its September quarter (Q1FY27) results. Swiggy share price opened at \u20b9 204.90 against its previous close of \u20b9 211.30 and crashed 17.2% to a 52-week low of \u20b9 174.90.\n\nThe stock has been under pressure recently, falling 35% over the last one month, while over the last one year, the stock is down 58%, hitting a 52-week high of \u20b9 434.50 on 31 October last year.\n\nSwiggy\u2019s food delivery business gross order value (GOV) grew 17.7% year-on-year (YoY) and 5.9% quarter-on-quarter (QoQ), to \u20b9 10,054 crore. Food delivery MTUs (monthly transacting users) grew 15.2% YoY to reach 19.8 million.\n\nAdjusted EBITDA improved by \u20b9 101 crore YoY to \u20b9 341 crore, while adjusted EBITDA margin grew by 58 bps YoY to 3.4%.\n\nThe company said its out-of-home consumption grew 34.9% YoY to \u20b9 1,508 crore and delivered its seventh successive quarter of profitability, with margins at 0.5% of GOV.\n\nBrokerages have largely retained their previous views on the stock, but some of them have reduced their target prices after the company's Q2 results.\n\nMotilal Oswal Financial Services has a buy call on the stock with a target price of \u20b9 280, implying a 32% upside potential.\n\nThe brokerage firm has cut its FY26-30 NOV CAGR assumption from 38% to 32%, reflecting a slower growth trajectory than Blinkit as competitive intensity continues to weigh on Instamart\u2019s performance.", "source": "LiveMint Markets", "pub_date_str": "23 Oct 2026, 11:04 AM IST", "pub_date_relative": "33m ago"}, {"title": "Hydro Q3 adjusted core earnings rise 52% but miss forecasts on weak cash flow", "full_content": "", "source": "Investing.com News", "pub_date_str": "23 Oct 2026, 11:03 AM IST", "pub_date_relative": "34m ago"}, {"title": "SGS beats Q3 revenue estimates with record sales growth", "full_content": "", "source": "Investing.com News", "pub_date_str": "23 Oct 2026, 11:03 AM IST", "pub_date_relative": "34m ago"}, {"title": "Holcim raises 2026 earnings outlook after strong Q3 sales", "full_content": "", "source": "Investing.com News", "pub_date_str": "23 Oct 2026, 11:02 AM IST", "pub_date_relative": "35m ago"}, {"title": "Nippon Life AMC shares crash 9%, down 19% in 5 days - Why? Dividend, record date, Q2 results, Yes Bank bond settlement", "full_content": "Nippon Life India Asset Management shares extended their losing streak on Friday, October 23, plunging 9% to \u20b9 881.95 apiece on the BSE as investors assessed the company's September-quarter earnings, a regulatory settlement linked to Yes Bank 's additional tier-1 (AT-1) bonds and its interim dividend announcement. The stock has now declined for five consecutive sessions, shedding 19% over the period.\n\nThe sell-off has also deepened the stock's recent correction. Nippon Life India Asset Management shares have fallen 16% in a week, 23% in a month, 19% in three months and 13% over six months. The stock had touched a 52-week high of \u20b9 1,269 in August 2026, while its 52-week low stood at \u20b9 756.10 in December 2025.\n\nThe decline comes amid concerns over the company's September-quarter earnings, regulatory developments linked to Yes Bank's AT-1 bonds and a sharp fall in other income. Its net profit fell sharply on a sequential basis, partly reflecting a significant reduction in other income and a one-time loss during the quarter.\n\nThe stock's decline also came as the company disclosed receiving in-principle regulatory approval to settle the Yes Bank AT-1 bond dispute for \u20b9 96.76 crore, with a formal settlement order still awaited.\n\nNippon Life India Asset Management said on Thursday that it had received in-principle approval from India's markets regulator to settle a dispute concerning alleged fraudulent investments in Yes Bank's AT-1 bonds. The company said it had paid settlement charges of \u20b9 96.76 crore during the September quarter but was awaiting a formal settlement order.\n\nThe regulator had alleged that Reliance Mutual Fund, now known as Nippon Life India Mutual Fund, invested \u20b9 2,150 crore in Yes Bank AT-1 bonds between 2016 and 2019 in return for loans being extended to companies backed by industrialist Anil Ambani.\n\nAnil Ambani sold Reliance Mutual Fund to Nippon Life in October 2019.", "source": "LiveMint Markets", "pub_date_str": "23 Oct 2026, 11:01 AM IST", "pub_date_relative": "35m ago"}, {"title": "Anthropic IPO stands alone as AI market jitters sideline others", "full_content": "", "source": "Investing.com News", "pub_date_str": "23 Oct 2026, 11:00 AM IST", "pub_date_relative": "37m ago"}, {"title": "Oil prices rise as supply concerns linger amid Houthi attacks on Saudi Arabia", "full_content": "", "source": "Investing.com News", "pub_date_str": "23 Oct 2026, 11:00 AM IST", "pub_date_relative": "37m ago"}, {"title": "Jio Platforms IPO Day 3 Live Updates: QIB Portion Booked 13.75 Times, Check Latest GMP", "full_content": "Track Jio IPO Day 3 subscription status, investor demand, GMP, IPO price band, allotment date and listing details of Jio Platforms.", "source": "NDTV Profit", "pub_date_str": "23 Oct 2026, 10:58 AM IST", "pub_date_relative": "39m ago"}, {"title": "Indigo Q2 results 2026 date & time: Interglobe Aviation Quarterly earnings preview, announcement schedule | Details here", "full_content": "Indigo Q2 results 2026 date & time : IndiGo parent InterGlobe Aviation announced on 22 October that the board will meet on Thursday, 29 October, to consider and approve the financial results for the quarter ending on 30 September.\n\nThe airline said in a stock exchange filing on Thursday that its board will review the unaudited standalone and consolidated financial results for the September quarter and first half of FY27 at a meeting scheduled for 29 October, according to the exchange filing.\n\nIndiGo, operated by InterGlobe Aviation , is scheduled to announce its second-quarter results for the financial year 2026-27 (Q2 FY27) on Thursday, 29 October, 2026.\n\nThe company is expected to make its results available at around 4 pm IST on its official website and the BSE and NSE websites.\n\nThe airline will host a 60-minute earnings conference call at 5 pm IST on October 29, during which senior management will discuss the company\u2019s performance and answer questions from investors and analysts across regions.\n\nThe filing does not mention any dividend announcement or proposal to distribute payouts to shareholders at the upcoming board meeting.\n\nInterGlobe Aviation (IndiGo) has paid final dividends to its shareholders on multiple occasions, with the latest dividend of \u20b9 10 per share declared in 2025. The airline had previously paid a dividend of \u20b9 5 per share in 2019, \u20b9 6 per share in 2018, \u20b9 34 per share in 2017 and \u20b9 15 per share in 2016. The highest dividend was \u20b9 34 per share, paid in 2017, while the latest payout of \u20b9 10 per share was recorded on August 13, 2025.\n\nInterGlobe Aviation (IndiGo) offers a dividend yield of around 0.20%\u20130.22%, following its recent final dividend payout of \u20b9 10 per share.", "source": "LiveMint Markets", "pub_date_str": "23 Oct 2026, 10:56 AM IST", "pub_date_relative": "40m ago"}, {"title": "Bansal Wire Industries Q2 net profit jumps 38% to Rs 53 crore", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a Earnings \u203a Bansal Wire Industries Q2 net profit jumps 38% to Rs 53 crore Bansal Wire Industries Share Price IFB Industries Share Price Orient Electric Share Price Symphony Share Price Bajaj Electricals Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Bansal Wire Industries Q2 net profit jumps 38% to Rs 53 crore SECTIONS Bansal Wire Industries Q2 net profit jumps 38% to Rs 53 crore PTI Last Updated: Oct 23, 2026, 10:56:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Bansal Wire Industries reported a remarkable consolidated net profit of Rs 52.9 crore for the quarter ending in September, marking a substantial 38 percent growth compared to the previous year. The company's revenue surged by 23.9 percent, amounting to Rs 1,308.1 crore for the same period. Sales volume also experienced a 12.4 percent increase, reaching 1.29 LT, while both EBITDA and EBITDA per tonne achieved record highs this quarter.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "23 Oct 2026, 10:56 AM IST", "pub_date_relative": "41m ago"}, {"title": "JSW Infrastructure Gets Target Price Hike As Jefferies Sees Port Expansion Boost; Check Potential Upside", "full_content": "JSW Infrastructure is targeting a sharp expansion in its ports and logistics businesses, with Jefferies expecting over 15% annual Ebitda growth beyond FY30. The brokerage also sees opportunities from higher port utilisation, government privatisation plans, and improving cargo volumes.", "source": "NDTV Profit", "pub_date_str": "23 Oct 2026, 10:53 AM IST", "pub_date_relative": "44m ago"}, {"title": "Hindustan Zinc shares drop 4% as India allows large silver imports despite weak demand", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Hindustan Zinc shares drop 4% as India allows large silver imports despite weak demand Hindustan Zinc Share Price Hindustan Copper Share Price Precision Wires India Share Price Ram Ratna Wires Share Price Onix Solar Energy Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Hindustan Zinc shares drop 4% as India allows large silver imports despite weak demand SECTIONS Hindustan Zinc shares drop 4% as India allows large silver imports despite weak demand By Debaroti Adhikary , ETMarkets.com Last Updated: Oct 23, 2026, 10:53:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Hindustan Zinc shares fell sharply on Friday after India issued permits to import 6,500 metric tonnes of silver over the next six months to meet festive-season demand. The move could ease domestic premiums amid weak demand, while silver futures declined around 3%. The stock is down over 18% so far in 2026.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "23 Oct 2026, 10:53 AM IST", "pub_date_relative": "44m ago"}, {"title": "Automatic Emergency Braking System In Cars From 2030? What Is AEBS and How Does It Work?", "full_content": "New models would need it from 1 October 2030, and all models from 1 October 2032.", "source": "NDTV Profit", "pub_date_str": "23 Oct 2026, 10:44 AM IST", "pub_date_relative": "52m ago"}, {"title": "Global Market: Japan\u2019s core inflation accelerates, putting BOJ rate hikes in focus", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a Global Market: Japan\u2019s core inflation accelerates, putting BOJ rate hikes in focus Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market: Japan\u2019s core inflation accelerates, putting BOJ rate hikes in focus SECTIONS Global Market: Japan\u2019s core inflation accelerates, putting BOJ rate hikes in focus By Anupam Nagar , ETMarkets.com Last Updated: Oct 23, 2026, 10:42:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Japan\u2019s core inflation rises to 2.1% in September, exceeding the Bank of Japan\u2019s 2% target for the first time in nine months. Higher energy costs, yen weakness and AI-related demand could strengthen the case for further interest rate hikes.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "23 Oct 2026, 10:42 AM IST", "pub_date_relative": "55m ago"}, {"title": "Nippon Q2 Review: PL Capital Lowers Target Price But Sees 23% Upside; Here's Why", "full_content": "Market volatility is slowing down MF industry flows, though strong retail presence may help Nippon Life against potential redemptions.", "source": "NDTV Profit", "pub_date_str": "23 Oct 2026, 10:40 AM IST", "pub_date_relative": "56m ago"}, {"title": "DA hike: Oct 21 didn't bring good news; govt employees anticipate \u2018Diwali gift\u2019 from next Cabinet meet | What's expected", "full_content": "DA hike: After the Union Cabinet meetings held on October 14 and 21 did not result in the much-awaited announcement of the dearness allowance hike, central government employees and pensioners are now awaiting the next meeting on 28 October for relief, according to reports.\n\nNotably, the Centre on 16 October announced a non-performance-linked bonus for central government employees, with no word on DA or dearness relief (DR). DA and DR are percentages of employees' and pensioners' basic pay that aim to mitigate the impact of the rising cost of living and inflation.\n\nMany employees and pensioners were expecting the Cabinet or Finance Ministry to announce the July 2026 DA hike ahead of Dussehra festivities earlier this week. This would have been in line with past announcements made between late September and early to mid-October.\n\nDA is updated biannually using data from the All India Consumer Price Index ( AICPI ), as per the 7th Central Pay Commission's recommendations. The CPC announcements usually come in March and October, with rollouts in January and July.\n\nNotably, the government has not officially confirmed a date for the second DA hike this year. The last hike was announced in April this year, when the Finance Ministry increased DA from 58% to 60% of basic salary , effective from 1 January 2026.\n\nAccording to a Moneycontrol report, the next Union Cabinet meeting is likely to be on 28 October, as central government sessions are usually held on Wednesdays, with some exceptions when dates are postponed or multiple meetings are held during the week to tackle issues.\n\nNow, with Diwali on 8 November, expectations are building around a possible \u201cDiwali gift\u201d announcement at the likely 28 October meeting.", "source": "LiveMint Money", "pub_date_str": "23 Oct 2026, 10:39 AM IST", "pub_date_relative": "58m ago"}, {"title": "India October business growth hits 4-month high; hiring stalls, PMI shows", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Indicators \u203a India October business growth hits 4-month high; hiring stalls, PMI shows The Economic Times daily newspaper is available online now. Read Today's Paper India October business growth hits 4-month high; hiring stalls, PMI shows SECTIONS India October business growth hits 4-month high; hiring stalls, PMI shows Reuters Last Updated: Oct 23, 2026, 10:38:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India's business activity expanded at its fastest pace in four months through a strong services-led pickup. The Composite Purchasing Managers' Index rose to 56.7 in October, exceeding forecasts due to increased orders. Despite this growth, hiring remained stagnant as companies managed workloads with current staff. Price pressures eased, resulting in lower input-cost inflation across both sectors. Overall, business confidence improved but remained below the average for the year.\n\nKYB and KYC: Business behind the wealth creator called \u201cDivi\u2019s Lab\u201d \u2013 Part 1\n\nOne company, 2 words. Bond yield and CDS: Will they decide the fate of global markets?\n\nBusiness of Odd Things: Inside an industry that farms fish that nobody is meant to eat\n\nWar's second-order effects are becoming visible in critical sectors\n\nUS mid-term elections \u2013 Part 2: What does it mean for Trump to lose control of Congress?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers", "source": "Economic Times Economy", "pub_date_str": "23 Oct 2026, 10:38 AM IST", "pub_date_relative": "59m ago"}, {"title": "Q2 Results Today LIVE: Infosys, Tata Motors, Adani Power, BPCL, SBI Card Among 75 Firms To Declare Earnings", "full_content": "Q2 Results Today LIVE: A total of 75 companies will declare their Q2 results today, including Infosys, Tata Motors, Adani Power, BPCL, SBI Cards and Payment Services, SBI Funds Management, IndusInd Bank and Dr. Reddy's Laboratories.", "source": "NDTV Profit", "pub_date_str": "23 Oct 2026, 10:36 AM IST", "pub_date_relative": "1h ago"}, {"title": "Sonu Sood To Earn Rs 3.52 Crore As Rent From Commercial Property in Versova Over 5 Years", "full_content": "Bollywood actor and philanthropist Sonu Sood has rented out a commercial property in Mumbai's Versova locality to Bokka Coffee in a deal that would generate rental income of approximately Rs 3.52 crore over five years.", "source": "NDTV Profit", "pub_date_str": "23 Oct 2026, 10:35 AM IST", "pub_date_relative": "1h ago"}, {"title": "Top stocks to buy: IT stocks soar! TCS, Infosys, HCL Tech, Wipro - Nifty IT up over 3% today, jumps 22% from July low", "full_content": "IT stocks today : The Nifty IT index surged as much as 3.3% to 33,138.6 on Friday, October 23, as buying interest returned to information technology stocks amid a strong recovery in the sector following encouraging September-quarter earnings. In contrast, benchmark indices remained largely unchanged, rising just 0.05% each.\n\nThe IT index has staged a sharp comeback after months of pressure, gaining 17% in October alone following an 11% decline in September. It has advanced 15% over the past month, 14% in three months and 8% in six months. Despite the recovery, the index remains down 10% over the past year. It has, however, recovered around 29% from its July low of 25,699.10 .\n\nTata Consultancy Services (TCS) led Friday's gains, rising around 3%, while Infosys, HCL Technologies and Wipro advanced approximately 2% each. Among mid-cap IT stocks, Coforge, Persistent Systems and Mphasis gained nearly 1% apiece. Tech Mahindra , L&T Technology Services and Mastek (MTL) bucked the broader trend and traded in the red.\n\nThe rally comes after a global selloff in software stocks earlier this year, when concerns mounted that artificial intelligence could disrupt traditional IT services business models. Slowing revenue growth, geopolitical uncertainty and increasing pressure from clients seeking lower prices had also weighed on investor sentiment.\n\nThe September-quarter earnings season has helped restore confidence in the sector's near-term growth prospects. Better-than-expected performances from several major IT companies have eased concerns about demand weakness and the potential disruption from AI.\n\nTech Mahindra reported second-quarter revenue above expectations, supported by strong deal wins, while Wipro delivered stronger-than-expected revenue, with delayed large deals potentially supporting growth in the coming quarters.", "source": "LiveMint Markets", "pub_date_str": "23 Oct 2026, 10:34 AM IST", "pub_date_relative": "1h ago"}, {"title": "SK Hynix shares rebound after initial drop on scrapped Solidigm IPO plans", "full_content": "Shares of South Korean chipmaker SK Hynix rebounded on Friday after falling as much as 3% earlier in the session, following the company's decision to halt a review of a potential U.S. initial public offering for its subsidiary Solidigm.\n\nJosh Gilbert, lead analyst for APAC at investment platform eToro, said the stock's rebound suggested that concerns over a potential Solidigm IPO had been weighing on investor sentiment.\n\n\"SK Hynix shareholders have got the outcome they were pushing for,\" Gilbert said, adding that \"in the short term, it removes a governance worry and keeps Solidigm's value inside the company.\"\n\nHe explained that SK Hynix faces the challenge of funding Solidigm's growth without compromising share buybacks and dividends, as the company needs to demonstrate a credible funding plan as it prepares to report earnings next week.\n\n\"Solidigm will halt its review of potential pre-IPO and IPO options,\" the company said in the statement after assessing recent capital market conditions and share price trends, while also exploring various funding options to finance a new U.S. semiconductor fabrication plant amid growing demand for AI memory.\n\nThe chip manufacturer said an IPO could have helped fund Solidigm's expansion while providing greater financial flexibility for shareholder returns, including dividends, share buybacks and share cancellations.\n\nHowever, financial market volatility had increased and contributed to a broader correction in semiconductor stocks, prompting SK Hynix to reassess whether an IPO would benefit existing shareholders.\n\nSK Hynix said that Solidigm's existing production facilities had limited capacity to meet rising AI-driven memory demand, underscoring the need for additional manufacturing capacity in the U.S.", "source": "CNBC World Economy", "pub_date_str": "23 Oct 2026, 10:31 AM IST", "pub_date_relative": "1h ago"}, {"title": "Wealthy Chinese move offshore money to U.S. banks as Beijing\u2019s tax net widens", "full_content": "SINGAPORE \u2014 Wealthy Chinese rattled by Beijing's widening hunt for overseas wealth are turning to a once-familiar refuge for their money: the U.S.\n\nPrivate bankers and lawyers who work with Chinese clients say inquiries about opening U.S. bank accounts have grown in the months after Beijing imposed retroactive taxes on offshore wealth in July, moving assets previously stored in Singapore or Hong Kong there to stay further away from Beijing's reach.\n\n\"It has become relatively prevalent,\" said Keith Tan, CEO of Singapore-based Golden Acacia Capital, who is helping Chinese clients manage their offshore portfolios. His clients began planning exits to the U.S. in July, and some have the accounts set up in less than two months. \"The hurdle is not that high for Chinese clients to open American accounts and transfer assets there.\"\n\nWealthy clients tend to choose large private banks while smaller accounts go to regional banks or online brokers, Tan said.\n\nThe rush has gained urgency with China's new tax regime on offshore trusts. Authorities said in July that income and gains from overseas trusts owned by Chinese tax residents would be taxed at 20%, setting off a scramble for cash and alternative structures .\n\nLawyers in Singapore and Hong Kong have been working to tally how much tax their clients owe, facilitating trusts' unwinding, sales of shares in listed companies or applying for loans to meet the outsized tax bill.\n\nMeanwhile, the U.S. sits outside the Common Reporting Standard, or CRS, the OECD framework under which more than 100 jurisdictions automatically share financial account data. While banks in Singapore and Hong Kong are supposed to report China-linked accounts to Beijing, American banks have no such obligation.\n\nNon-resident clients who open foreign bank accounts in the U.S.", "source": "CNBC Top News", "pub_date_str": "23 Oct 2026, 10:25 AM IST", "pub_date_relative": "1h ago"}, {"title": "Sensex sinks over 1,000 pts from day's high, Nifty below 22,500. What's ahead for D-Street?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Sensex sinks over 1,000 pts from day's high, Nifty below 22,500. What's ahead for D-Street? The Economic Times daily newspaper is available online now. Read Today's Paper Sensex sinks over 1,000 pts f 9 286 per share on the NSE and touched an intraday low of \u20b9 281.80 per share, logging a decline of around 2%. IOCL share price today corrected over 2.50%, whereas HPCL share price corrected over 2% within a few minutes of the Opening Bell on Friday.\n\nAccording to stock market experts, OMC stocks are primarily under pressure due to the recent attacks on Saudi Arabia, which have exacerbated the crude oil supply disruption. This has driven Brent crude oil to $114 per barrel, while WTI has crossed the $100 per barrel mark. As this oil price rise will add pressure on these companies' balance sheets, the market is discounting this during Friday's dealings. However, they maintained that weakness in the Indian Rupee and fuel prices not rising in sync with global oil prices will weigh on OMC stocks. They advised OMC shareholders to avoid panic selling, as it is a short-term sentimental selling.", "source": "LiveMint Markets", "pub_date_str": "23 Oct 2026, 10:14 AM IST", "pub_date_relative": "1h ago"}, {"title": "Global tech sell-off sparks flight to safety", "full_content": "Japanese bonds and yen rally as Asian stock markets follow Wall Street lower", "source": "FT Markets", "pub_date_str": "23 Oct 2026, 10:12 AM IST", "pub_date_relative": "1h ago"}, {"title": "Tata Teleservices shares crash 11% after Q2 result 2026 - What's next for the stock? Expert view", "full_content": "Tata Teleservices shares crashed as much as 11% in morning trade on the BSE on Friday, 23 October, a day after the company announced its September quarter (Q2FY27) results. Tata Teleservices (Maharashtra) share price opened at \u20b9 40.56 against its previous close of \u20b9 38.25 and crashed 10.6% to hit an intraday low of \u20b9 34.20.\n\nThe stock suffered sharp losses on Friday morning amid a significant jump in volume, nearly 6 times higher.\n\nThe company reported its September quarter results during market hours on 22 October. The stock jumped 19% after the result announcement. However, in the next session, the stock suffered significant losses due to profit-booking.\n\nApart from the Q2 results, the company also announced the appointments of an additional director, the company secretary and compliance officer, and senior management personnel.\n\nThe company announced the appointment of Gaurav Gupta as an Additional Director (non-executive and non-independent), effective 23 October 2026.\n\nSweety Mamodia was appointed as the company secretary and compliance officer of the company, effective from 1 November 2026.\n\nMoreover, the company announced the appointments of Sai Pratyush, Vice President - Strategy, and Vaibhav Ambradkar, General Manager - Customer Experience Group, as members of senior management.\n\nThe company reported a loss of \u20b9 59.20 crore for the September quarter of FY27 compared to a loss of \u20b9 320.82 crore in the same quarter last year.", "source": "LiveMint Markets", "pub_date_str": "23 Oct 2026, 10:10 AM IST", "pub_date_relative": "1h ago"}, {"title": "ETMarkets Smart Talk: Smallcap investors should consider a five-year SIP horizon amid volatility: Sorbh Gupta", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Expert Views \u203a ETMarkets Smart Talk: Smallcap investors should consider a five-year SIP horizon amid volatility: Sorbh Gupta The Economic Times daily newspaper is available online now. Read Today's Paper ETMarkets Smart Talk: Smallcap investors should consider a five-year SIP horizon amid volatility: Sorbh Gupta SECTIONS ETMarkets Smart Talk: Smallcap investors should consider a five-year SIP horizon amid volatility: Sorbh Gupta By Kshitij Anand , ETMarkets.com Last Updated: Oct 23, 2026, 10:09:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis In an interview with Kshitij Anand of ETMarkets, Sorbh Gupta, Head of Equity at Bajaj issue subscribed over 5X; check brokerage views and key details By Ritesh Presswala , ETMarkets.com Last Updated: Oct 23, 2026, 10:06:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Jio Platforms\u2019 \u20b930,213 crore IPO entered its final day of bidding on October 23, with a grey market premium of around 22%, indicating positive listing sentiment. The issue was subscribed 5.57 times by the end of Day 2, while the retail portion was subscribed 1.54 times. Priced at \u20b91,065\u20131,119 per share, the IPO values Jio at around \u20b910.3 lakh crore at the upper end. Brokerages remain optimistic, citing its telecom leadership, improving profitability and growth opportunities in broadband and AI.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "23 Oct 2026, 10:06 AM IST", "pub_date_relative": "1h ago"}, {"title": "Swiggy vs Eternal: Food Delivery's Two Rivals Are No Longer In The Same Race", "full_content": "Eternal is building a private AI assistant, dark.ai. Swiggy is still working out how to make Instamart pay, with an operating loss of Rs 895 crore in the July-September quarter while Blinkit stayed profitable.", "source": "NDTV Profit", "pub_date_str": "23 Oct 2026, 10:06 AM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "BSE, Asia's Oldest Stock Exchange, Invites Applications For New MD And CEO Post", "full_content": "The exchange is looking for a seasoned leader with at least 20 years of experience, including a minimum of five years in a senior leadership role.", "source": "NDTV Profit", "pub_date_str": "23 Oct 2026, 11:29 AM IST", "pub_date_relative": "7m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Stock futures trade mixed after tech sector sell-off: Live updates", "full_content": "U.S. equity futures were mixed in early Friday trading after tech stocks sold off on concerns that the artificial intelligence trade could be faltering, at least in the near term.\n\nFutures tied to the S&P 500 lost 0.04%, Dow Jones Industrial Average futures were down 92 points, or 0.17%. Nasdaq-100 futures added 0.11%.\n\nIn regular trading, the S&P 500 sank 1.2%, and the Nasdaq Composite slid 2.6%. The broad market benchmark posted its worst session since July, while the tech-heavy Nasdaq had its worst day since June. The Dow Industrials bucked the trend and closed marginally higher.\n\nIn Asia, South Korea's benchmark Kospi Index fell 2.42%, while Japan's Nikkei 225 lost 2.1%. Hong Kong's Hang Seng Index was down 0.47%. Mainland China's CSI 300 declined 1.76%, deepening its descent into a technical bear market. Australia's S&P/ASX 200 was 0.21% lower.\n\nWorries around artificial intelligence spending weighed down the market and dragged the U.S. tech sector to a 3% decline on the day. Nvidia dropped 4.4%, Alphabet fell 3.2%, and Advanced Micro Devices declined 8.1% as losses occurred in different parts of the technology sector.\n\nNvidia CEO Jensen Huang told CNBC on Thursday he thought capital within the AI buildout was becoming scarce.\n\n\"There's a scarcity of capital. The demand [for] the capital is much greater than the availability of the capital,\" Huang said when asked about the neocloud segment of the AI buildout, which is proving to be fragile.\n\nEd Yardeni, president of Yardeni Research, described the AI trade on Thursday as a \"bubble\" but said that some depressurization wouldn't be all bad.", "source": "CNBC Top News", "pub_date_str": "23 Oct 2026, 11:28 AM IST", "pub_date_relative": "9m ago", "cfa_topics": ["Equity Investments", "Derivatives", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Havells India: Goldman Sachs, Jefferies Cut Target Prices; Maintain Ratings", "full_content": "Goldman Sachs retained its Buy rating on Havells India but reduced its target price to Rs 1,225 from Rs 1,400 after the September quarter results. The brokerage expects earnings to be lower than previously estimated as margin recovery takes longer.", "source": "NDTV Profit", "pub_date_str": "23 Oct 2026, 11:28 AM IST", "pub_date_relative": "9m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Retired at 58? EPFO details how long your EPF account earns interest and when to withdraw your money | Explained", "full_content": "The Employees\u2019 Provident Fund Organisation (EPFO) has posted a question on X that matters to anyone planning to retire: how long does an EPF account continue to earn interest after an employee retires at 58?\n\nThe answer affects when retirees should withdraw their savings and whether to leave them in the account. In a post on 22 October 2026, EPFO urged subscribers to understand when interest is credited to their accounts and when to withdraw the money.\n\n\u201c58 \u0915\u0940 \u0909\u092e\u094d\u0930 \u092e\u0947\u0902 \u0930\u093f\u091f\u093e\u092f\u0930 \u0939\u094b \u091a\u0941\u0915\u0947 \u0939\u0948\u0902? \u091c\u093e\u0928\u093f\u090f \u0906\u092a\u0915\u0947 EPF \u0916\u093e\u0924\u0947 \u092e\u0947\u0902 \u092c\u094d\u092f\u093e\u091c \u0915\u092c \u0924\u0915 \u091c\u092e\u093e \u0939\u094b\u0917\u093e \u0914\u0930 \u092a\u0948\u0938\u093e \u0928\u093f\u0915\u093e\u0932\u0928\u0947 \u0915\u093e \u0938\u0939\u0940 \u0938\u092e\u092f \u0915\u094d\u092f\u093e \u0939\u0948\u0964 #EPFO #EPFOWithYou #HumHainNa #InoperativeEPFAccount\u201d\n\n[Translation: \u201cRetired at 58? Find out until when interest will be credited to your EPF account and the right time to withdraw your money.\u201d]\n\nThe post carries two images explaining the rules in Hindi and English, along with a QR code linking to a guidance video for members. According to the images, \u201cEPF interest will be credited for the next 3 years, i.e., up to 61 years of age. After that, your EPF account will become inoperative, so it is advised to withdraw your EPF.\u201d\n\nAn EPF account does not stop earning interest the day an employee retires at 58. Under the EPF rules , interest continues to be credited until the account becomes inoperative.\n\nAn account is generally considered inoperative when no contributions have been made for 36 months after the member retires at 55 or later, or after the member settles abroad permanently. For someone retiring at 58, the account may become inoperative at 61 if no contributions are made.\n\nMembers should therefore check the latest EPFO provisions applicable to their accounts before deciding when to withdraw their accumulated contributions.", "source": "LiveMint Money", "pub_date_str": "23 Oct 2026, 11:26 AM IST", "pub_date_relative": "11m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Piyush Goyal discusses investment opportunities with Bayer, Fresenius", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a Piyush Goyal discusses investment opportunities with Bayer, Fresenius The Economic Times daily newspaper is available online now. Read Today's Paper Piyush Goyal discusses investment opportunities with Bayer, Fresenius SECTIONS Piyush Goyal discusses investment opportunities with Bayer, Fresenius PTI Last Updated: Oct 23, 2026, 11:26:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Piyush Goyal held meetings with Bayer and Fresenius executives The subscription window for this tranche was October 15\u201319, 2018, and the bonds were issued on October 23, 2018.\n\nIn its press release, the RBI stated, \u201cThe redemption price of SGB shall be based on the simple average of the closing price of gold of 999 purity of the previous three business days from the date of redemption, as published by the India Bullion and Jewellers Association Ltd (IBJA).\u201d\n\nAccordingly, the RBI fixed the final redemption price at \u20b9 14,425 per gram, based on the average closing gold prices on October 19, October 21, and October 22, 2026.\n\nAccording to the Ministry of Finance's October 12, 2018, release, the issue price of SGB 2018-19 Series II was fixed at \u20b9 3,146 per gram for offline subscriptions. Investors who applied online and paid digitally received a \u20b9 50-per-gram discount, reducing the issue price to \u20b9 3,096.\n\nAt the final redemption price of \u20b9 14,425 per gram, the capital gains are as follows:", "source": "LiveMint Money", "pub_date_str": "23 Oct 2026, 11:07 AM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Economics", "Fixed Income", "Derivatives", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Colgate Share Price: Jefferies Maintains 'Buy', Citi And Goldman Sachs Retain 'Sell'", "full_content": "Colgate shares are in focus after Citi and Goldman Sachs retained their Sell ratings, while Jefferies maintained Buy. All three brokerages cut their target prices, citing modest underlying growth, higher brand investments, and pressure on Ebitda margins.", "source": "NDTV Profit", "pub_date_str": "23 Oct 2026, 11:06 AM IST", "pub_date_relative": "31m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Swiggy shares hit 52-week low, down 35% in 1 month- should investors buy the stock after Q2 results? Expert view", "full_content": "Swiggy shares crashed more than 17% to hit a 2-week low in intraday trade on Friday, 23 October, a day after reporting its September quarter (Q1FY27) results. Swiggy share price opened at \u20b9 204.90 against its previous close of \u20b9 211.30 and crashed 17.2% to a 52-week low of \u20b9 174.90.\n\nThe stock has been under pressure recently, falling 35% over the last one month, while over the last one year, the stock is down 58%, hitting a 52-week high of \u20b9 434.50 on 31 October last year.\n\nSwiggy\u2019s food delivery business gross order value (GOV) grew 17.7% year-on-year (YoY) and 5.9% quarter-on-quarter (QoQ), to \u20b9 10,054 crore. Food delivery MTUs (monthly transacting users) grew 15.2% YoY to reach 19.8 million.\n\nAdjusted EBITDA improved by \u20b9 101 crore YoY to \u20b9 341 crore, while adjusted EBITDA margin grew by 58 bps YoY to 3.4%.\n\nThe company said its out-of-home consumption grew 34.9% YoY to \u20b9 1,508 crore and delivered its seventh successive quarter of profitability, with margins at 0.5% of GOV.\n\nBrokerages have largely retained their previous views on the stock, but some of them have reduced their target prices after the company's Q2 results.\n\nMotilal Oswal Financial Services has a buy call on the stock with a target price of \u20b9 280, implying a 32% upside potential.\n\nThe brokerage firm has cut its FY26-30 NOV CAGR assumption from 38% to 32%, reflecting a slower growth trajectory than Blinkit as competitive intensity continues to weigh on Instamart\u2019s performance.", "source": "LiveMint Markets", "pub_date_str": "23 Oct 2026, 11:04 AM IST", "pub_date_relative": "33m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Hydro Q3 adjusted core earnings rise 52% but miss forecasts on weak cash flow", " all in other income. Its net profit fell sharply on a sequential basis, partly reflecting a significant reduction in other income and a one-time loss during the quarter.\n\nThe stock's decline also came as the company disclosed receiving in-principle regulatory approval to settle the Yes Bank AT-1 bond dispute for \u20b9 96.76 crore, with a formal settlement order still awaited.\n\nNippon Life India Asset Management said on Thursday that it had received in-principle approval from India's markets regulator to settle a dispute concerning alleged fraudulent investments in Yes Bank's AT-1 bonds. The company said it had paid settlement charges of \u20b9 96.76 crore during the September quarter but was awaiting a formal settlement order.\n\nThe regulator had alleged that Reliance Mutual Fund, now known as Nippon Life India Mutual Fund, invested \u20b9 2,150 crore in Yes Bank AT-1 bonds between 2016 and 2019 in return for loans being extended to companies backed by industrialist Anil Ambani.\n\nAnil Ambani sold Reliance Mutual Fund to Nippon Life in October 2019.", "source": "LiveMint Markets", "pub_date_str": "23 Oct 2026, 11:01 AM IST", "pub_date_relative": "35m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Fixed Income", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Anthropic IPO stands alone as AI market jitters sideline others", "full_content": "", "source": "Investing.com News", "pub_date_str": "23 Oct 2026, 11:00 AM IST", "pub_date_relative": "37m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Jio Platforms IPO Day 3 Live Updates: QIB Portion Booked 13.75 Times, Check Latest GMP", "full_content": "Track Jio IPO Day 3 subscription status, investor demand, GMP, IPO price band, allotment  the latest payout of \u20b9 10 per share was recorded on August 13, 2025.\n\nInterGlobe Aviation (IndiGo) offers a dividend yield of around 0.20%\u20130.22%, following its recent final dividend payout of \u20b9 10 per share.", "source": "LiveMint Markets", "pub_date_str": "23 Oct 2026, 10:56 AM IST", "pub_date_relative": "40m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Fixed Income"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Bansal Wire Industries Q2 net profit jumps 38% to Rs 53 crore", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a Earnings \u203a Bansal Wire Industries Q2 net profit jumps 38% to Rs 53 crore Bansal Wire Industries Share Price IFB Industries Share Price Orient Electric Share Price Symphony Share Price Bajaj Electricals Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Bansal Wire Industries Q2 net profit jumps 38% to Rs 53 crore SECTIONS Bansal Wire Industries Q2 net profit jumps 38% to Rs 53 crore PTI Last Updated: Oct 23, 2026, 10:56:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Bansal Wire Industries reported a remarkable consolidated net profit of Rs 52.9 crore for the quarter ending in September, marking a substantial 38 percent growth compared to the previous year. The company's revenue surged by 23.9 percent, amounting to Rs 1,308.1 crore for the same period. Sales volume also experienced a 12.4 percent increase, reaching 1.29 LT, while both EBITDA and EBITDA per tonne achieved record highs this quarter.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now  {"title": "DA hike: Oct 21 didn't bring good news; govt employees anticipate \u2018Diwali gift\u2019 from next Cabinet meet | What's expected", "full_content": "DA hike: After the Union Cabinet meetings held on October 14 and 21 did not result in the much-awaited announcement of the dearness allowance hike, central government employees and pensioners are now awaiting the next meeting on 28 October for relief, according to reports.\n\nNotably, the Centre on 16 October announced a non-performance-linked bonus for central government employees, with no word on DA or dearness relief (DR). DA and DR are percentages of employees' and pensioners' basic pay that aim to mitigate the impact of the rising cost of living and inflation.\n\nMany employees and pensioners were expecting the Cabinet or Finance Ministry to announce the July 2026 DA hike ahead of Dussehra festivities earlier this week. This would have been in line with past announcements made between late September and early to mid-October.\n\nDA is updated biannually using data from the All India Consumer Price Index ( AICPI ), as per the 7th Central Pay Commission's recommendations. The CPC announcements usually come in March and October, with rollouts in January and July.\n\nNotably, the government has not officially confirmed a date for the second DA hike this year. The last hike was announced in April this year, when the Finance Ministry increased DA from 58% to 60% of basic salary , effective from 1 January 2026.\n\nAccording to a Moneycontrol report, the next Union Cabinet meeting is likely to be on 28 October, as central government sessions are usually held on Wednesdays, with some exceptions when dates are postponed or multiple meetings are held during the week to tackle issues.\n\nNow, with Diwali on 8 November, expectations are building around a possible \u201cDiwali gift\u201d announcement at the likely 28 October meeting.", "source": "LiveMint Money", "pub_date_str": "23 Oct 2026, 10:39 AM IST", "pub_date_relative": "58m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "India October business growth hits 4-month high; hiring stalls, PMI shows", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Indicators \u203a India October business growth hits 4-month high; hiring stalls, PMI shows The Economic Times daily newspaper is available online now. Read Today's Paper India October business growth hits 4-month high; hiring stalls, PMI shows SECTIONS India October business growth hits 4-month high; hiring stalls, PMI shows Reuters Last Updated: Oct 23, 2026, 10:38:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India's business activity expanded at its fastest pace in four months through a strong services-led pickup. The Composite Purchasing Managers' Index rose to 56.7 in October, exceeding forecasts due to increased orders. Despite this growth, hiring remained stagnant as companies managed workloads with current staff. Price pressures eased, resulting in lower input-cost inflation across both sectors. Overall, business confidence improved but remained below the average for the year.\n\nKYB and KYC: Business behind the wealth creator called \u201cDivi\u2019s Lab\u201d \u2013 Part 1\n\nOne company, 2 words. Bond yield and CDS: Will they decide the fate of global markets?\n\nBusiness of Odd Things: Inside an industry that farms fish that nobody is meant to eat\n\nWar's second-order effects are becoming visible in critical sectors\n\nUS mid-term elections \u2013 Part 2: What does it mean for Trump to lose control of Congress?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers", "source": "Economic Times Economy", "pub_date_str": "23 Oct 2026, 10:38 AM IST", "pub_date_relative": "59m ago", "cfa_topics": ["Economics", "Fixed Income", "Derivatives", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Q2 Results Today LIVE: Infosys, Tata Motors, Adani Power, BPCL, SBI Card Among 75 Firms To Declare Earnings", "full_content": "Q2 Results Today LIVE: A total of 75 companies will declare their Q2 results today, including Infosys, Tata Motors, Adani Power, BPCL, SBI Cards and Payment Services, SBI Funds Management, IndusInd Bank and Dr. Reddy's Laboratories.", "source": "NDTV Profit", "pub_date_str": "23 Oct 2026, 10:36 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Top stocks to buy: IT stocks soar! TCS, Infosys, HCL Tech, Wipro - Nifty IT up over 3% today, jumps 22% from July low", "full_content": "IT stocks today : The Nifty IT index surged as much as 3.3% to 33,138.6 on Friday, October 23, as buying interest returned to information technology stocks amid a strong recovery in the sector following encouraging September-quarter earnings. In contrast, benchmark indices remained largely unchanged, rising just 0.05% each.\n\nThe IT index has staged a sharp comeback after months of pressure, gaining 17% in October alone following an 11% decline in September. It has advanced 15% over the past month, 14% in three months and 8% in six months. Despite the recovery, the index remains down 10% over the past year. It has, however, recovered around 29% from its July low of 25,699.10 .\n\nTata Consultancy Services (TCS) led Friday's gains, rising around 3%, while Infosys, HCL Technologies and Wipro advanced approximately 2% each. Among mid-cap IT stocks, Coforge, Persistent Systems and Mphasis gained nearly 1% apiece. Tech Mahindra , L&T Technology Services and Mastek (MTL) bucked the broader trend and traded in the red.\n\nThe rally comes after a global selloff in software stocks earlier this year, when concerns mounted that artificial intelligence could disrupt traditional IT services business models. Slowing revenue growth, geopolitical uncertainty and increasing pressure from clients seeking lower prices had also weighed on investor sentiment.\n\nThe September-quarter earnings season has helped restore confidence in the sector's near-term growth prospects. Better-than-expected performances from several major IT companies have eased concerns about demand weakness and the potential disruption from AI.\n\nTech Mahindra reported second-quarter revenue above expectations, supported by strong deal wins, while Wipro delivered stronger-than-expected revenue, with delayed large deals potentially supporting growth in the coming quarters.", "source": "LiveMint Markets", "pub_date_str": "23 Oct 2026, 10:34 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "SK Hynix shares rebound after initial drop on scrapped Solidigm IPO plans", "full_content": "Shares of South Korean chipmaker SK Hynix rebounded on Friday after falling as much as 3% earlier in the session, following the company's decision to halt a review of a potential U.S. initial public offering for its subsidiary Solidigm.\n\nJosh Gilbert, lead analyst for APAC at investment platform eToro, said the stock's rebound suggested that concerns over a potential Solidigm IPO had been weighing on investor sentiment.\n\n\"SK Hynix shareholders have got the outcome they were pushing for,\" Gilbert said, adding that \"in the short term, it removes a governance worry and keeps Solidigm's value inside the company.\"\n\nHe explained that SK Hynix faces the challenge of funding Solidigm's growth without compromising share buybacks and dividends, as the company needs to demonstrate a credible funding plan as it prepares to report earnings next week.\n\n\"Solidigm will halt its review of potential pre-IPO and IPO options,\" the company said in the statement after assessing recent capital market conditions and share price trends, while also exploring various funding options to finance a new U.S. semiconductor fabrication plant amid growing demand for AI memory.\n\nThe chip manufacturer said an IPO could have helped fund Solidigm's expansion while providing greater financial flexibility for shareholder returns, including dividends, share buybacks and share cancellations.\n\nHowever, financial market volatility had increased and contributed to a broader correction in semiconductor stocks, prompting SK Hynix to reassess whether an IPO would benefit existing shareholders.\n\nSK Hynix said that Solidigm's existing production facilities had limited capacity to meet rising AI-driven memory demand, underscoring the need for additional manufacturing capacity in the U.S.", "source": "CNBC World Economy", "pub_date_str": "23 Oct 2026, 10:31 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Sensex sinks over 1,000 pts from day's high, Nifty below 22,500. What's ahead for D-Street?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Sensex sinks over 1,000 pts from day's high, Nifty below 22,500. What's ahead for D-Street? The Economic Times daily newspaper is available online now. Read Today's Paper Sensex s ue to supply disruption concerns, Indian OMC stocks have been under selling pressure since morning dealings. BPCL share price today opened lower at \u20b9 286 per share on the NSE and touched an intraday low of \u20b9 281.80 per share, logging a decline of around 2%. IOCL share price today corrected over 2.50%, whereas HPCL share price corrected over 2% within a few minutes of the Opening Bell on Friday.\n\nAccording to stock market experts, OMC stocks are primarily under pressure due to the recent attacks on Saudi Arabia, which have exacerbated the crude oil supply disruption. This has driven Brent crude oil to $114 per barrel, while WTI has crossed the $100 per barrel mark. As this oil price rise will add pressure on these companies' balance sheets, the market is discounting this during Friday's dealings. However, they maintained that weakness in the Indian Rupee and fuel prices not rising in sync with global oil prices will weigh on OMC stocks. They advised OMC shareholders to avoid panic selling, as it is a short-term sentimental selling.", "source": "LiveMint Markets", "pub_date_str": "23 Oct 2026, 10:14 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Tata Teleservices shares crash 11% after Q2 result 2026 - What's next for the stock? Expert view", "full_content": "Tata Teleservices shares crashed as much as 11% in morning trade on the BSE on Friday, 23 October, a day after the company announced its September quarter (Q2FY27) results. Tata Teleservices (Maharashtra) share price opened at \u20b9 40.56 against its previous close of \u20b9 38.25 and crashed 10.6% to hit an intraday low of \u20b9 34.20.\n\nThe stock suffered sharp losses on Friday morning amid a significant jump in volume, nearly 6 times higher.\n\nThe company reported its September quarter results during market hours on 22 October. The stock jumped 19% after the result announcement. However, in the next session, the stock suffered significant losses due to profit-booking.\n\nApart from the Q2 results, the company also announced the appointments of an additional director, the company secretary and compliance officer, and senior management personnel.\n\nThe company announced the appointment of Gaurav Gupta as an Additional Director (non-executive and non-independent), effective 23 October 2026.\n\nSweety Mamodia was appointed as the company secretary and compliance officer of the company, effective from 1 November 2026.\n\nMoreover, the company announced the appointments of Sai Pratyush, Vice President - Strategy, and Vaibhav Ambradkar, General Manager - Customer Experience Group, as members of senior management.\n\nThe company reported a loss of \u20b9 59.20 crore for the September quarter of FY27 compared to a loss of \u20b9 320.82 crore in the same quarter last year.", "source": "LiveMint Markets", "pub_date_str": "23 Oct 2026, 10:10 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "ETMarkets Smart Talk: Smallcap investors should consider a five-year SIP horizon amid volatility: Sorbh Gupta", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Expert Views \u203a ETMarkets Smart Talk: Smallcap investors should consider a five-year SIP horizon amid volatility: Sorbh Gupta The Economic Times daily newspaper is available online now. Read Today's Paper ETMarkets Smart Talk: Smallcap investors should consider a five-year SIP horizon amid volatility: Sorbh Gupta SECTIONS ETMarkets Smart Talk: Smallcap investors should consider a five-year SIP horizon amid volatility: Sorbh Gupt     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
