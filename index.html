 Get Half His $140 BillIon Fortune Forbes", "source": "Google News Business", "pub_date_str": "16 Nov 2026, 10:41 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Nvidia\u2019s CEO Search Draws Fire With Bessent\u2019s Shakeup Call - Bloomberg.com", "full_content": "Nvidia\u2019s CEO Search Draws Fire With Bessent\u2019s Shakeup Call Bloomberg.com Bessent says Nvidia must 'go outside the company' to find new CEO Reuters US Treasury chief wants answers soon from Nvidia Yahoo Finance Nvidia ordered to explain $12bn supply of AI chips to China The Times Bessent says if Nvidia was a bank, 'a lot of the executives would be removed' as Huang eyes return Fortune", "source": "Google News Business", "pub_date_str": "16 Nov 2026, 10:37 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Hong Kong developer New World\u2019s shares tumble 47% on $3.2bn rights issue plan", "full_content": "Ailing property group to offer new stock at 80% discount as it moves to slash debts", "source": "FT Markets", "pub_date_str": "16 Nov 2026, 10:31 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Eicher Motors shares vroom like its Bullet, stock price jumps over 3%; what brokerages say post Q2; Buy or avoid? Target", "full_content": "Dhanya Nagasundaram Published 16 Nov 2026, 10:30 AM IST Prefer Livemint on Google Eicher Motors shares rose over 3% on Monday, 16 November, after the company reported a strong set of results for the September quarter, supported by robust operating performance and healthy growth in Royal Enfield and commercial vehicle volumes.\n\nThe automaker posted a 15% year-on-year (YoY) increase in consolidated net profit to \u20b9 1,573 crore in Q2 FY27, compared with \u20b9 1,369 crore in the corresponding quarter last year, according to its regulatory filing.\n\nRevenue from operations climbed 20% YoY to a record \u20b9 7,422 crore from \u20b9 6,172 crore in Q2 FY26. Earnings before interest, tax, depreciation and amortisation (EBITDA) rose 16% to \u20b9 1,760 crore from \u20b9 1,512 crore a year earlier.\n\nRoyal Enfield reported its highest-ever quarterly sales volume of 3.77 lakh motorcycles, marking 15% growth from the year-ago period. Meanwhile, sales at VE Commercial Vehicles (VECV) increased 28.2% YoY to 28,071 units.\n\nEicher Motors also reported a share of profit of \u20b9 186 crore from its joint venture, VE Commercial Vehicles Ltd, compared with \u20b9 135 crore in the corresponding period last year.\n\n\"At Royal Enfield, the robust demand across domestic and key international markets drove our highest-ever quarterly and festive wholesales across September and October. This reflects the strength of our portfolio and growing affinity for the brand, even as market conditions continue to evolve,\" said B Govindarajan, Managing Director of Eicher Motors and CEO of Royal Enfield.\n\nEicher Motors share price today opened at \u20b9 7,768.45 apiece on the BSE, the stock touched an intraday high of \u20b9 7,943.50 per share, and an intraday low of \u20b9 7,630 apiece.\n\nVECV reported a 37% YoY increase in net profit to \u20b9 342 crore in the September quarter, compared with \u20b9 249 crore in the year-ago period.", "source": "LiveMint Markets", "pub_date_str": "16 Nov 2026, 10:30 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "\u20b950 lakh retirement savings: Calculate your monthly income at 7%, 7.5%, 8% and 8.5% without dipping into your corpus", "full_content": "Making sacrifices in the initial stages of life and building a retirement corpus of \u20b9 50 lakh is a significant financial milestone. However, for retirees, saving and accumulating this money is only half the challenge.\n\nThe bigger question after having such a corpus remains: How much monthly income can it generate to help the retiree meet monthly expenses without eating into the principal?\n\nA straightforward method to estimate this income is to calculate the interest earned on this corpus at different annual rates. Therefore, assuming the entire \u20b9 50 lakh corpus remains invested and generates a steady return , retirees can withdraw only the interest, while ensuring the original amount remains intact.\n\nThe monthly income an individual can generate from a fixed corpus amount depends entirely on the annual interest rate earned on the investment. At 7%, for example, a \u20b9 50 lakh corpus\"> \u20b9 50 lakh corpus can generate approximately \u20b9 29,167 per month, and as the rate earned increases, the potential monthly income will increase proportionately.\n\nHere is how the calculations look at four different annual return assumptions.\n\nIt is important to keep in mind that the figures discussed above represent monthly equivalents. They are not assured or guaranteed monthly payouts. The SCSS investment scheme, for example, which is specifically designed for senior citizens, pays interest quarterly. While other schemes follow their respective schedules. That is why, investors should plan withdrawals around actual payment frequency and dates.\n\nThe assumed returns are therefore illustrative and should not be viewed as assured rates available on the entire \u20b9 50 lakh corpus. Actual returns depend on the investment product, tenure, prevailing interest rates, investment limits and depositor eligibility.\n\nFurthermore, the key area of focus in retirement planning is that as an individual gets older and nears retirement, their income sources tend to diminish.", "source": "LiveMint Money", "pub_date_str": "16 Nov 2026, 10:30 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Inox Wind shares crash: Why energy stock price is falling today? Tanks 9.17% post Q2, down 60% in 1 year - Still a buy?", "full_content": "Inox Wind shares fell nearly 9.17% in Monday intraday trading after results showed a 42% annual drop in second-quarter net profit to \u20b969 crore. Motilal Oswal cut its FY27 and FY28 EBITDA estimates and lowered its target price to \u20b974, while retaining a Buy rating.", "source": "LiveMint Markets", "pub_date_str": "16 Nov 2026, 10:28 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "MCX gold, silver prices drop: What led to rates slide; multi-month lows ahead of wedding season - Details for investors", "full_content": "MCX gold and silver prices fell to multi-month lows as expectations of a US Federal Reserve rate hike, a stronger dollar and higher Treasury yields pressured precious metals. Silver hit a one-year low, while analysts say Indian wedding demand and central bank buying may help limit gold\u2019s downside.", "source": "LiveMint Markets", "pub_date_str": "16 Nov 2026, 09:56 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics", "Fixed Income", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Tata Motors PV shares crash: What led to auto stock 8% ramming, Nifty laggard; down 27% in 2026 - Buy, sell or hold?", "full_content": "Tata Motors Passenger Vehicles shares fell mo ong with MCX market updates.", "source": "LiveMint Money", "pub_date_str": "16 Nov 2026, 09:38 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Investors Return to JGBs as Rate Outlook Shifts, SMBC Nikko Says", "full_content": "Investors both at home and abroad are adding to positions in Japanese government debt as the surge in bond yields shows signs of peaking and concerns over artificial intelligence grow, according to SMBC Nikko Securities Inc.", "source": "LiveMint Markets", "pub_date_str": "16 Nov 2026, 09:30 AM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "China\u2019s slowdown deepens in October as industrial output, retail sales, investment miss estimates", "full_content": "A deepening reliance on external demand leaves China more exposed to shocks abroad as domestic momentum fades, analysts say.", "source": "CNBC Finance", "pub_date_str": "16 Nov 2026, 09:23 AM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Sun Pharma Share Price Live Updates: Current Market Performance of Sun Pharma", "full_content": "", "source": "Economic Times Markets", "pub_date_str": "16 Nov 2026, 09:20 AM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Maruti Suzuki Share Price Live Updates: Maruti Suzuki's Current Trading Status", "full_content": "", "source": "Economic Times Markets", "pub_date_str": "16 Nov 2026, 09:05 AM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>

</body>
</html>
