ice in Mumbai today, 31 October, was in line with the overall gold rate in India. The 24-karat gold price in Mumbai was \u20b9 1,38,580 per 10 grams. Meanwhile, the price of 22-karat gold in Mumbai was \u20b9 1,27,032 per 10 grams.", "source": "LiveMint Money", "pub_date_str": "31 Oct 2026, 12:19 PM IST", "pub_date_relative": "19m ago"}, {"title": "China reports sharp increase in gold, nickel and strategic minerals - Xinhua", "full_content": "", "source": "Investing.com News", "pub_date_str": "31 Oct 2026, 12:09 PM IST", "pub_date_relative": "29m ago"}, {"title": "ET Wealth Expo: Why market veteran S Naren thinks investors are getting gold, silver and asset allocation all wrong", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a ET Wealth Expo: Why market veteran S Naren thinks investors are getting gold, silver and asset allocation all wrong The Economic Times daily newspaper is available online now. Read Today's Paper ET Wealth Expo: Why market veteran S Naren thinks investors are getting gold, silver and asset allocation all wrong SECTIONS ET Wealth Expo: Why market veteran S Naren thinks investors are getting gold, silver and asset allocation all wrong By Veer Sharma , ETMarkets.com Last Updated: Oct 31, 2026, 12:05:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis ICICI Prudential MF's S Naren warns investors against chasing assets after spectacular rallies, highlighting how silver's 216% surge drew record ETF inflows before a 27% correction. At the ET Wealth Expo, he explained why genuine asset allocation means buying unpopular assets and why gold still deserves a place in portfolios.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "31 Oct 2026, 12:05 PM IST", "pub_date_relative": "32m ago"}, {"title": "Dutch Bros director entity sells $11.7M in BROS shares", "full_content": "", "source": "Investing.com News", "pub_date_str": "31 Oct 2026, 12:00 PM IST", "pub_date_relative": "37m ago"}, {"title": "Dutch Bros director, 10% owner sells $6.25 million in shares", "full_content": "", "source": "Investing.com News", "pub_date_str": "31 Oct 2026, 11:46 AM IST", "pub_date_relative": "52m ago"}, {"title": "Texas Instruments director Kirk sells $1.88M in stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "31 Oct 2026, 11:46 AM IST", "pub_date_relative": "52m ago"}, {"title": "F&O Talk: Big break above 23,200 can open doors for 23,500 for Nifty; Sudeep Shah picks 6 stocks ahead of Diwali", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Expert Views \u203a F&O Talk: Big break above 23,200 can open doors for 23,500 for Nifty; Sudeep Shah picks 6 stocks ahead of Diwali The Economic Times daily newspaper is available online now. Read Today's Paper F&O Talk: Big break above 23,200 can open doors for 23,500 for Nifty; Sudeep Shah picks 6 stocks ahead of Diwali SECTIONS F&O Talk: Big break above 23,200 can open doors for 23,500 for Nifty; Sudeep Shah picks 6 stocks ahead of Diwali By Veer Sharma , ETMarkets.com Last Updated: Oct 31, 2026, 11:45:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Nifty could extend its recovery towards 23,500 if it decisively breaks above the 23,150\u201323,200 resistance zone, says SBI Securities' Sudeep Shah. He also shares his outlook on IT, midcap and smallcap indices, sector trends and six stocks, including TVS Motor, Coforge and ICICI Bank, ahead of Diwali.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "31 Oct 2026, 11:45 AM IST", "pub_date_relative": "52m ago"}, {"title": "Oil hits six-month highs as Hormuz attacks threaten Iran peace efforts", "full_content": "", "source": "Investing.com News", "pub_date_str": "31 Oct 2026, 11:37 AM IST", "pub_date_relative": "1h ago"}, {"title": "Chinese Executive Close to Nvidia CEO Suspected of Giving China Information - WSJ", "full_content": "Chinese Executive Close to Nvidia CEO Suspected of Giving China Information WSJ Nvidia's relationship with China just got even more complicated as report says Jensen Huang was target of spy plot Yahoo Finance Nvidia Chief, Jensen Huang, Is Seen as Target of Chinese Spy Plot The New York Times Chip hawks seize on report Chinese asset cozied up to Nvidia Politico Nvidia CEO Says Ties to Company Under Spying Probe Were \u2018Normal\u2019 Bloomberg", "source": "Google News Business", "pub_date_str": "31 Oct 2026, 11:34 AM IST", "pub_date_relative": "1h ago"}, {"title": "8th Pay Commission: What happens after the commission submits its report? 5 key steps explained", "full_content": "The 8th Pay Commission has recently concluded 2 meaningful meetings in Bengaluru and Mumbai on October 8 and 23, respectively. Since its constitution on 3 November 2025, the 8th Pay Commission panel has held meaningful discussions in prominent states and union territories, including Delhi, Ladakh, Uttar Pradesh, and West Bengal. In a few days, on 3 November 2026, the commission will complete 1 year since its constitution.\n\nNow, it is vital to keep in mind that the 8th Pay Commission is a temporary 3-member body headed by Justice Ranjana Prakash Desai. The panel is expected to recommend meaningful changes and amendments to salaries, pensions, allowances, and associated payments of central government employees and pensioners.\n\nFurthermore, as per the terms of reference (ToR) of the 8th Pay Commission, the report is expected to be tabled within 18 months of the date of constitution, i.e., 3 November 2025. Therefore, the expectation is that the report will be officially presented by the 8th Pay Commission panel by May-June 2027.\n\nStill, it is vital to keep in mind that submitting the official report will not automatically trigger a salary hike. Once the report is presented, the central government will first have to examine and carefully analyse the recommendations, their fiscal prudence and decide how they should be implemented.\n\nA vital aspect of the report will be the fitment factor multiplier, which determines how existing basic pay is multiplied to calculate the revised basic pay. This is an extremely important metric that can give a clear picture of the 8th Pay Commission recommendations.\n\nThe 6th Pay Commission recommended a fitment factor of 1.86, while the 7th Pay Commission proposed a uniform fitment factor of 2.57.", "source": "LiveMint Money", "pub_date_str": "31 Oct 2026, 11:33 AM IST", "pub_date_relative": "1h ago"}, {"title": "Booz Allen Hamilton evp Shannon Buffum sells $174,504 in stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "31 Oct 2026, 11:31 AM IST", "pub_date_relative": "1h ago"}, {"title": "Littelfuse svp David Ruppel sells $604,023 in company stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "31 Oct 2026, 11:30 AM IST", "pub_date_relative": "1h ago"}, {"title": "Trump called out Big Oil profits. Here\u2019s how much their refining earnings have surged since", "full_content": "President Donald Trump scolded Big Oil in August , saying ExxonMobil and Chevron were making \"too much money based on a shortage,\" as profits surged in the wake of the U.S.-Israeli war with Iran.\n\nCorporate results published this week laid out the windfall oil majors are continuing to get from tight fuel supplies and elevated refining margins amid global conflict.\n\nShell , BP , TotalEnergies and Exxon reported sharply higher margins in their refined-products businesses , a gauge of the amount they earn from processing crude oil into gasoline, diesel and jet fuel.\n\nChevron does not report a comparable, standalone refining-margin figure, but it reported Friday that its downstream earnings more than quadrupled from a year earlier to $4.9 billion, with the company citing higher margins on refined-product sales.\n\nThat's amid tight supplies of refined fuels and pressure on refinery output globally, despite oil firms reporting this week that they are running their facilities near capacity to try to meet demand.\n\nKey issues include ongoing Ukrainian drone strikes on Russian refineries and disruptions to Middle East energy infrastructure and supply chains linked to the Iran war and Houthi attacks on Saudi Arabia .\n\nThose factors have compounded refinery closures in Europe and North America , even as new refining capacity has been added elsewhere.\n\nAround a quarter of refineries in the European Union have shut over the past two decades, European Commissioner for Energy and Housing Dan J\u00f8rgensen said this week, as he warned of a \"crisis\" of energy security.", "source": "CNBC Top News", "pub_date_str": "31 Oct 2026, 11:30 AM IST", "pub_date_relative": "1h ago"}, {"title": "AI is coming to construction sites. But does it make workers safer?", "full_content": "When Shelley Copsey was appointed by the Ontario Teachers' Pension Plan, one of the world's biggest infrastructure investors, her job was to find ways to use technology to solve problems across its portfolio.\n\nShe quickly learned that there were persistent problems facing front-line workers.\n\nFour years later, Copsey is CEO of FYLD, a London-headquartered software company that uses artificial intelligence to support workers in construction, utilities and infrastructure.\n\nIt comes as AI plays an increasingly important role in some of the most physically demanding jobs, from maintaining roads and railways to working on construction sites.\n\nAccording to Copsey, when fieldwork goes wrong, attention usually turns to budgets or cash flow.\n\n\"We always go to the back office and we're like: oh, if we could help them forecast the job better, maybe this wouldn't be a problem,\" she told CNBC. \"I think that what nobody ever did was just sit and say: well, what goes on in those field workers' lives and how do we make the life of the front line easier?\"\n\nFYLD uses AI to predict which permits a project will need, helping workers avoid delays. Previously, workers often arrived at a site without all of the information they needed, Copsey said. The system can also help crews plan around the weather, for example, rescheduling heavy lifting from a day when strong winds are forecast.\n\nWorkers record short videos describing their day's tasks and safety concerns. AI analyzes the information to help workers and managers anticipate potential problems.", "source": "CNBC Top News", "pub_date_str": "31 Oct 2026, 11:30 AM IST", "pub_date_relative": "1h ago"}, {"title": "Cyclone Tracking With AI: What It Can Predict And Where It Falls Short", "full_content": "The European Centre for Medium-Range Weather Forecasts' (ECMWF) 51-member ensemble had assigned a 35% probability to landfall between the Godavari delta and Yanam, with a median landfall time of 07:11 IST.", "source": "NDTV Profit", "pub_date_str": "31 Oct 2026, 11:20 AM IST", "pub_date_relative": "1h ago"}, {"title": "Dividend, stock split, bonus record date alert 2-8 Nov week: Infosys, Mazagon Dock, Coal India, Sanofi and other shares", "full_content": "GODREJCP TANLA CONCORDBIO VBL Sharmila Bhadoria Published 31 Oct 2026, 11:20 AM IST Prefer Livemint on Google Dividend, stock split, bonus issue, record date next week: The coming week is set to be packed with corporate actions like dividend, stock split, bonus issue, rights issues. Infosys, Mazagon Dock Shipbuilders , Asian Paints, Coal India, Concord Biotech , Godrej Consumer Products , and Varun Beverages are among the 50 companies that have fixed record dates for these corporate actions.\n\nMeanwhile, the Indian stock market reversed its losses this week, as Nifty 50 ended with 2.50% gain, whereas, BSE Sensex closed 1.60% higher. The stock market rally this week was driven by strong performance in the IT and pharmaceutical sector stocks. As investors plan their coming week, here are all the details to know.\n\nColgate Palmolive India, Route Mobile, Tanla Platforms , Asian Paints, Godrej Consumer Products, etc have fixed record dates for the coming week. To become eligible for the corporate action, investors must own the stock before the record date.\n\nCrescentis Capital Limited, Suvidhaa Infoserve Limited have fixed Wednesday, November 4, as the record date to determine the eligibility of shareholders for the corporate action.\n\nConcord Biotech Limited is the only company that has fixed record date for the coming week for bonus issue, as per BSE data as on October 31. The company has fixed November 4 as the record date for bonus issue in the ratio of 1:1.\n\nGujarat Natural Resources has fixed November 5 as the record date from \u20b9 10 to Re 1 stock split. Additionally, Knowledge Marine & Engineering Works has fixed November 6 as the record date for stock split from \u20b9 5 to Re 1.\n\nCatch all the Business News , Market News , Breaking News Events, JIO IPO Listing Today LIVE and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.\n\nLog in to our website to save your bookmarks. It'll just take a moment.", "source": "LiveMint Markets", "pub_date_str": "31 Oct 2026, 11:20 AM IST", "pub_date_relative": "1h ago"}, {"title": "US Debt Ceiling Battle: Why Indian Markets Cannot Ignore the 2027 Risk", "full_content": "The US could hit its $41.1 trillion debt ceiling by mid-2027, raising fears of a political standoff after the November 2026 midterm elections. Here's why the developments matter for Indian markets.", "source": "NDTV Profit", "pub_date_str": "31 Oct 2026, 11:16 AM IST", "pub_date_relative": "1h ago"}, {"title": "Booz Allen Hamilton EVP & general counsel sells $124,380 in stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "31 Oct 2026, 11:16 AM IST", "pub_date_relative": "1h ago"}, {"title": "UMB Financial director Gallagher sells $49,883 in common stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "31 Oct 2026, 11:15 AM IST", "pub_date_relative": "1h ago"}, {"title": "UK Student Visa Rules To Change: Indians Must Show Up To Rs 18 Lakh For Living Expenses", "full_content": "UK student visa rules require applicants relying on personal funds to maintain the necessary balance for at least 28 consecutive days before submitting their applications", "source": "NDTV Profit", "pub_date_str": "31 Oct 2026, 11:10 AM IST", "pub_date_relative": "1h ago"}, {"title": "Bitcoin holds above $77,000 as Binance hack recovery takes shape", "full_content": "", "source": "Investing.com News", "pub_date_str": "31 Oct 2026, 11:05 AM IST", "pub_date_relative": "1h ago"}, {"title": "SGB 2021-22 Series VII premature redemption due on 2 November: Investors to pocket 200% gains; check RBI quoted price", "full_content": "Investors holding SGB 2021-22 Series VII will be eligible for premature redemption on 2 November 2026, following the completion of five years from the date of issuance. The Reserve Bank of India ( RBI ) has fixed the redemption price of the Sovereign Gold Bonds (SGBs) at \u20b9 14,167 per gram.\n\nAccording to the RBI's press release dated 30 October, the 2021-22 Series VII tranche was issued on 2 November 2021. \u201cPremature redemption of Gold Bond may be permitted after fifth year from the date of issue of such Gold Bond on the date on which interest is payable. Accordingly, the due date of premature redemption of the above tranche shall be on November 02, 2026.\u201d\n\nSovereign Gold Bonds are government securities denominated in grams of gold and issued by the RBI on behalf of the Government of India. They provide investors with exposure to gold prices without requiring them to purchase or physically store the precious metal.\n\nHere's what you need to know about the capital gains and interest on the premature redemption of Sovereign Gold Bonds (SGB) 2021-22 Series VII.\n\nAccording to the RBI circular, the redemption price is calculated using the simple average of the closing prices of 999-purity gold over the three preceding business days, as published by the India Bullion and Jewellers Association Ltd (IBJA).\n\n\u201cThe redemption price for premature redemption due on November 02, 2026, shall be \u20b9 14,167/- (Rupees Fourteen Thousand One Hundred and Sixty-Seven Only) per unit of SGB based on the simple average of closing price of gold for the three business days i.e., October 28, October 29, and October 30, 2026.\u201d\n\nAccording to the Ministry of Finance's release published by PIB dated 23 October 2021, the original issue price of SGB 2021-22 Series VII was \u20b9 4,765 per gram.", "source": "LiveMint Money", "pub_date_str": "31 Oct 2026, 11:05 AM IST", "pub_date_relative": "1h ago"}, {"title": "IPO ahead: Value-fashion retailer Ratnadeep Retail gets Sebi nod to raise funds through public issue", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a IPO ahead: Value-fashion retailer Ratnadeep Retail gets Sebi nod to raise funds through public issue Vishal Mega Mart Share Price Avenue Supermarts Share Price Spencers Retail Share Price Osia Hyper Retail Share Price The Economic Times daily newspaper is available online now. Read Today's Paper IPO ahead: Value-fashion retailer Ratnadeep Retail gets Sebi nod to raise funds through public issue SECTIONS IPO ahead: Value-fashion retailer Ratnadeep Retail gets Sebi nod to raise funds through public issue By Kumar Gaurav , ETMarkets.com Last Updated: Oct 31, 2026, 11:04:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Ratnadeep Retail has received Sebi approval to launch an IPO comprising a fresh issue of up to Rs 400 crore and an offer for sale of 1.49 crore shares. The Hyderabad-based retailer plans to use part of the proceeds to repay borrowings and expand its store network across India.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "31 Oct 2026, 11:04 AM IST", "pub_date_relative": "1h ago"}, {"title": "Alaska Air Layoffs: Airline To Cut Nearly 200 Jobs As Fuel Shock Squeezes Earnings", "full_content": "The group, which owns Alaska Airlines and Hawaiian Airlines, is heading for a loss this year despite growing revenue, according to its own results.", "source": "NDTV Profit", "pub_date_str": "31 Oct 2026, 10:59 AM IST", "pub_date_relative": "1h ago"}, {"title": "Gold, silver rates today Bangalore 31 Oct: Latest prices, up-down movement for precious metal investors in Garden City", "full_content": "Gold, Silver rates today, 31 October: Gold prices in Bangalore fell today as they tumbled globally to a one-year low and headed to close at its record worst October since the global financial crisis in 2008, as per a Bloomberg report. Soaring oil prices, inflation concerns and slump in US tech stocks have pushed investors to sell bullion to recover losses, it added.\n\nGold bullion fell as much as 3.6% to $3,876.39 an ounce, the lowest since early October 2025, and is on path to record a monthly drop of over 6% \u2014 the lowest since October 2008, as per the report. Meanwhile, silver dived over 6% to below $49 an ounce, extending its monthly decline to nearly 19%. The precious metal has erased all of its gains since early December, when it began a dramatic two-month rally that took prices above $120 an ounce.\n\n\u201cHigher oil prices are triggering a risk-off environment, which is triggering a Treasury rally. This is reducing liquidity for equities and gold is getting caught up in the momentum. In addition, gold has been sliding down toward a key technical level, and trend followers are challenging the long-term support in both gold and silver ,\u201d Bart Melek, global head of commodity strategy at TD Securities told the publication.\n\nAt time of writing, gold bullion was trading at \u20b9 1,38,830 per 10 grams, while Silver was at \u20b9 1,79,430 per kg, data on the bullion website showed.\n\nCheck the latest prices and up-down movement for precious metal investors in Garden City; and gold and silver rates in key Indian cities on Saturday, 31 October 2026. Check the price of 18K, 22K and 24K gold and 999 Fine silver in Ahmedabad, Chennai, Delhi, Hyderabad, Kolkata, and Mumbai today as follows:\n\nIn the Garden City, the 24-karat gold price in Bengaluru was at \u20b9 1,38,680 per 10 grams, on 31 October.", "source": "LiveMint Money", "pub_date_str": "31 Oct 2026, 10:50 AM IST", "pub_date_relative": "1h ago"}, {"title": "IIFA Awards 2026 Winners: Dhurandhar Sweeps Top Awards, Ranveer Singh, Aneet Padda Take Acting Honours", "full_content": "The IIFA Awards 2026 saw Dhurandhar lead the winners' list with multiple honours, while Saiyaara, The Ba*ds of Bollywood and Paatal Lok Season 2 also secured major awards.", "source": "NDTV Profit", "pub_date_str": "31 Oct 2026, 10:48 AM IST", "pub_date_relative": "1h ago"}, {"title": "'Don\u2019t Teach Punjabis How To Fight\u2019: Diljit Dosanjh Reacts To 'I\u2019m An Artist\u2019 Remark During Delhi Concert", "full_content": "Diljit Dosanjh mentioned that no one knows how to stand up for a cause better than a Punjabi.", "source": "NDTV Profit", "pub_date_str": "31 Oct 2026, 10:47 AM IST", "pub_date_relative": "1h ago"}, {"title": "New type of \u20b910 and \u20b920 notes from this date? Will RBI change dimensions or keep it same for polymer version?", "full_content": "The Reserve Bank of India (RBI) is likely to roll out its pilot polymer currency on April 1, 2027, with dimensions of existing \u20b9 10 and \u20b9 20 banknotes unchanged. According to a report by Moneycontrol , the decision to keep the dimensions unchanged would benefit banks as they won\u2019t have to spend extra on reconfiguration of their ATMs.\n\n\u201cRetaining the existing dimensions will help banks avoid upfront capital expenditure on ATM reconfiguration. Since the programme will initially be a pilot covering smaller denominations, the savings could be substantial,\u201d a senior official of a state-owned bank told Moneycontrol.\n\nIn August, Reserve Bank of India Governor Sanjay Malhotra had highlighted the longevity of polymer currency notes. Malhotra pointed out that the polymer currency notes have lasted for over 30 years in some jurisdictions and will come in handy, especially for the lower denomination notes which have high velocity.\n\n\"We are targeting that they are in circulation, if everything goes as per plan, in the beginning of the next financial year,\" Malhotra had said.\n\nIn July, the Bharatiya Reserve Bank Note Mudran Private Limited (BRBNMPL)\u2014a wholly-owned subsidiary of the Reserve Bank of India (RBI)\u2014issued a global Expression of Interest (EOI) to identify and shortlist established manufacturers of opacified polymer substrate sheets with security features suitable for printing Indian banknotes.\n\nThe RBI proposed to introduce 2 billion polymer notes\u20141 billion each of \u20b9 10 and \u20b9 20\u2014for field trials. The exercise is intended to test durability, handling, public acceptance, and operational feasibility before any decision on wider issuance is taken.\n\nIt should be noted that the polymer notes are being introduced as a field trial and are not intended to replace the existing paper currency.", "source": "LiveMint Money", "pub_date_str": "31 Oct 2026, 10:47 AM IST", "pub_date_relative": "1h ago"}, {"title": "Ramayana To Release In Original Audio In Greece: Date, Time Venue, And Link To Book", "full_content": "Nitesh Tiwari's Ramayana: Rise of a Legend, starring Ranbir Kapoor, Sai Pallavi and Yash, will release in Greece on November 5, 2026, with special IMAX 3D screenings at Village Cinemas in Athens.", "source": "NDTV Profit", "pub_date_str": "31 Oct 2026, 10:46 AM IST", "pub_date_relative": "1h ago"}, {"title": "Three stocks with strong order books to watch amid India's data-centre boom", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nWith India's data-centre capacity set for a sharp expansion, investors are looking beyond quarterly earnings to identify the companies positioned to benefit from the infrastructure spending. Their order books offer a window into that opportunity, providing a measure of future revenue visibility as the artificial intelligence (AI) build-out gathers pace.\n\nOne of the defining themes of the Q2 FY27 earnings season is the capital expenditure cycle linked to India's data-centre and AI infrastructure build-out . The country's live data-centre capacity has crossed roughly 1.8 GW, following a record addition of 258 MW in the first half of FY27, and is projected to reach about 10.5 GW by 2031.\n\nFor investors, the scale of this expansion makes order books an important metric alongside revenue and profit growth. They indicate the volume of business companies have secured and offer clues to the potential trajectory of future revenues.\n\nThree companies stand out for their exposure to different parts of this infrastructure chain: building facilities, powering projects and providing the optical connectivity that data centres need.\n\nLarsen & Toubro (L&T), India's largest engineering and construction conglomerate, was incorporated in 1938. It operates across projects, hi-tech manufacturing and services, with businesses spanning infrastructure and utilities, energy, manufacturing and products, and technology platforms and services. The last houses its expanding data-centre, semiconductor and digital-platform businesses.\n\nL&T reported record second quarter results, with revenue rising 16% year-on-year to \u20b9 78,700 crore and profit after tax increasing 33% to \u20b9 5,200 crore. Order inflows surged 28% to a quarterly record of \u20b9 1,47,700 crore.", "source": "LiveMint Markets", "pub_date_str": "31 Oct 2026, 10:36 AM IST", "pub_date_relative": "2h ago"}, {"title": "Joining The Dots | Dark Skies, Steady Diya: Why Hope Holds This Diwali", "full_content": "With war, a weak rupee and foreign outflows weighing on sentiment, policymakers at the NDTV World Summit and market veterans at NDTV Profit Ignite: Diwali Edition offered the same advice: stay invested and filter out the noise.", "source": "NDTV Profit", "pub_date_str": "31 Oct 2026, 10:34 AM IST", "pub_date_relative": "2h ago"}, {"title": "US midterms loom over jittery investors", "full_content": "Caution certainly seems warranted for the coming weeks", "source": "FT Markets", "pub_date_str": "31 Oct 2026, 10:30 AM IST", "pub_date_relative": "2h ago"}, {"title": "Bank of England explores easing key limit on riskier mortgage lending", "full_content": "Central bank considers lifting threshold on higher-risk mortgages in response to calls from government and industry to boost home-ownership", "source": "FT Markets", "pub_date_str": "31 Oct 2026, 10:30 AM IST", "pub_date_relative": "2h ago"}, {"title": "Lula\u2019s surprise election victory sends agri-commodities tumbling", "full_content": "Steep fall in Brazilian real has made the country\u2019s exports more competitive, undermining pricing power for farmers in other countries", "source": "FT Markets", "pub_date_str": "31 Oct 2026, 10:30 AM IST", "pub_date_relative": "2h ago"}, {"title": "Andhra Pradesh pensions: State Election Commission allows payments, bars new enrolments under Model Code of Conduct", "full_content": "The Andhra Pradesh State Election Commission (SEC) has permitted the distribution of social security pensions to existing beneficiaries during the ongoing Model Code of Conduct (MCC) period. Still, the commission has strictly prohibited any amendments or additions of new beneficiaries, or any increase or revision to existing pension amounts, until the election code remains in force, as per a report by The Times of India.\n\nThis decision was issued on 30 October 2026. It is intended to ensure that all vulnerable sections of society, eligible recipients, and beneficiaries continue to receive their regular pension payments without delay or disruption throughout the entire election period. The focus is on maintaining social well-being and ensuring meaningful compliance with election authorities.\n\nThe permission follows a proposal submitted by the chief executive officer of the Society for Elimination of Rural Poverty (SERP). It covers eligible beneficiaries such as senior citizens, widows, single women, persons with disabilities and individuals suffering from various health conditions and financial problems .\n\nThe Commission has authorised designated personnel to withdraw pension funds from banks, in accordance with prevailing rules and regulations, and distribute them among existing beneficiaries. However, this exercise must strictly follow the prescribed procedures.\n\nFurthermore, only officially authorised personnel can handle the withdrawal, management, transportation and distribution of pension funds.", "source": "LiveMint Money", "pub_date_str": "31 Oct 2026, 10:30 AM IST", "pub_date_relative": "2h ago"}, {"title": "Pakistan Vs Sri Lanka Live Streaming: When And Where To Watch ODI Tri-Series Final In India", "full_content": "Shaheen Shah Afridi-led Pakistan will face Kusal Mendis' Sri Lanka in the title clash at Gaddafi Stadium. Check the match time, venue and live streaming details.", "source": "NDTV Profit", "pub_date_str": "31 Oct 2026, 10:30 AM IST", "pub_date_relative": "2h ago"}, {"title": "'Not For The Weak': Diwali Ki Safai Memes Flood X Ahead of Festive Season" vernment to accelerate economic growth,\u201d it said. Additionally, SBI Securities believes any relief in the taxation pertaining to STT or LTCG would serve as a big sentiment booster for equity markets. Going forward, it believes the sectors from where wealth creators are likely to emerge are auto OEMs and auto ancillaries, capital goods or Engineering, including defence, aerospace engineering, railway safety, power equipment, pharma ancillary, import substitution like CNC machine, BFSI, EMS, recycling, new age platform businesses, pharma - CDMO & chemicals, structural steel tubes, discretionary consumption (hotels, jewellery, alcoholic beverages etc.) and metals or mining. Also read | Diwali 2026: Sensex plunged 10,000 points, Nifty dropped 12% since last Diwali.", "source": "Economic Times Markets", "pub_date_str": "31 Oct 2026, 10:13 AM IST", "pub_date_relative": "2h ago"}, {"title": "Oil prices soar 14% in October to 6-month high as US weighs fresh Iran strikes after midterms. More pain ahead?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Commodities \u203a News \u203a Oil prices soar 14% in October to 6-month high as US weighs fresh Iran strikes after midterms. More pain ahead? The Economic Times daily newspaper is available online now. Read Today's Paper Oil prices soar 14% in October to 6-month high as US weighs fresh Iran strikes after midterms. More pain ahead? SECTIONS Oil prices soar 14% in October to 6-month high as US weighs fresh Iran strikes after midterms. More pain ahead? By Veer Sharma , ETMarkets.com Last Updated: Oct 31, 2026, 10:19:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Brent crude rose 13.6% in October to settle at a six-month high of $117.64 a barrel, as fears of fresh US strikes on Iran and threats to shipping through the Strait of Hormuz fuelled supply concerns. Analysts warn of further volatility, with Goldman Sachs flagging a possible rise to $120.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "31 Oct 2026, 10:11 AM IST", "pub_date_relative": "2h ago"}, {"title": "'Took stock of our bilateral cooperation': EAM Jaishankar meets US Secy of State Rubio on sidelines of G20", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a 'Took stock of our bilateral cooperation': EAM Jaishankar meets US Secy of State Rubio on sidelines of G20 The Economic Times daily newspaper is available online now. Read Today's Paper 'Took stock of our bilateral cooperation': EAM Jaishankar meets US Secy of State Rubio on sidelines of G20 SECTIONS 'Took stock of our bilateral cooperation': EAM Jaishankar meets US Secy of State Rubio on sidelines of G20 ANI Last Updated: Oct 31, 2026, 10:04:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis S Jaishankar held a bilateral meeting with US Secretary of S rice , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "31 Oct 2026, 09:54 AM IST", "pub_date_relative": "2h ago"}, {"title": "Why are banks closed in Gujarat today, despite it being 5th Saturday? State-wise bank holiday 31 Oct; PM Modi in Gujarat", "full_content": "Banks in Gujarat are closed today, Saturday, 31 October, despite it being the fifth Saturday of the month. The closure is not related to the Reserve Bank of India's ( RBI ) regular second- and fourth-Saturday bank holiday rule.\n\nInstead, banks in the state are observing a special public holiday declared by the Gujarat government.\n\nThe Gujarat government has included 31 October in its list of public holidays for banks in 2026. Here's why banks are closed in Gujarat today, whether branches in other states are operating, and what other bank holidays are scheduled in the state this year.\n\nThe Gujarat Government has issued a notification dated 27 November 2025, announcing the public holiday list for banks in the state for 2026. The notification was issued under Section 25 of the Negotiable Instruments Act, 1881, in consultation with the Reserve Bank of India (RBI), Ahmedabad.\n\nThe notification states, \u201cThe Government of Gujarat, in consultation with Reserve Bank of India, Ahmedabad is pleased to declare the following days to be public holidays for banks in Gujarat during the year 2026.\u201d\n\nUnder this list, 31 October has been declared a bank holiday on account of Sardar Vallabhbhai Patel's birth anniversary.\n\nTherefore, bank branches across Gujarat, including those of the State Bank of India (SBI), HDFC Bank, Punjab National Bank (PNB) and other public- and private-sector lenders, will remain closed today.\n\nThe fifth Saturday is ordinarily a working day for banks. Under the RBI's existing arrangement, banks observe holidays on the second and fourth Saturdays of every month. However, state-specific holidays can also lead to bank closures on other days.", "source": "LiveMint Money", "pub_date_str": "31 Oct 2026, 09:51 AM IST", "pub_date_relative": "2h ago"}, {"title": "Jio Platforms profit zooms 14% on healthy user mix, digital play", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a Earnings \u203a Jio Platforms profit zooms 14% on healthy user mix, digital play Reliance Industries Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Jio Platforms profit zooms 14% on healthy user mix, digital play SECTIONS Jio Platforms profit zooms 14% on healthy user mix, digital play ET Bureau Last Updated: Oct 31, 2026, 09:49:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Jio Platforms has unveiled an impressive 14% net profit growth to \u20b98,387 crore for the September quarter, achieving a milestone subscriber count of 542 million, which includes 300 million utilizing 5G services. Revenue from operations climbed to \u20b940,475 crore, fueled by a surge in digital services and a boost in average revenue per user, now at \u20b9218.8.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track la gold and 999 Fine silver in Ahmedabad, Chennai, Delhi, Bangalore, Kolkata, and Mumbai today as follows:\n\nIn the Charminar City, the gold price in Hyderabad followed national and global trends today, on 31 October. The 24-karat gold price in Hyderabad was \u20b9 1,38,790 per 10 grams. Meanwhile, the 22-karat gold was priced at \u20b9 1,27,224 per 10 grams, and the 18-karat gold rate was \u20b9 1,04,093 per 10 grams.\n\nThe silver price in Hyderabad today, 31 October, was in line with the overall silver rates in India. The price of Silver 999 Fine was \u20b9 1,79,390 per kg.\n\nThe gold price in Mumbai today, 31 October, was in line with the overall gold rate in India. The 24-karat gold price in Mumbai was \u20b9 1,38,580 per 10 grams. Meanwhile, the price of 22-karat gold in Mumbai was \u20b9 1,27,032 per 10 grams.", "source": "LiveMint Money", "pub_date_str": "31 Oct 2026, 12:19 PM IST", "pub_date_relative": "19m ago", "cfa_topics": ["Economics", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "China reports sharp increase in gold, nickel and strategic minerals - Xinhua", "full_content": "", "source": "Investing.com News", "pub_date_str": "31 Oct 2026, 12:09 PM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "ET Wealth Expo: Why market veteran S Naren thinks investors are getting gold, silver and asset allocation all wrong", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a ET Wealth Expo: Why market veteran S Naren thinks investors are getting gold, silver and asset allocation all wrong The Economic Times daily newspaper is available online now. Read Today's Paper ET Wealth Expo: Why market veteran S Naren thinks investors are getting gold, silver and asset allocation all wrong SECTIONS ET Wealth Expo: Why market veteran S Naren thinks investors are getting gold, silver and asset allocation all wrong By Veer Sharma , ETMarkets.com Last Updated: Oct 31, 2026, 12:05:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis ICICI Prudential MF's S Naren warns investors against chasing assets after spectacular rallies, highlighting how silver's 216% surge drew record ETF inflows before a 27% correction. At the ET Wealth Expo, he explained why genuine asset allocation means buying unpopular assets and why gold still deserves a place in portfolios.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "31 Oct 2026, 12:05 PM IST", "pub_date_relative": "32m ago", "cfa_topics": ["Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "F&O Talk: Big break above 23,200 can open doors for 23,500 for Nifty; Sudeep Shah picks 6 stocks ahead of Diwali", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Expert Views \u203a F&O Talk: Big break above 23,200 can open doors for 23,500 for Nifty; Sudeep Shah picks 6 stocks ahead of Diwali The Economic Times daily newspaper is available online now. Read Today's Paper F&O Talk: Big break above 23,200 can open doors for 23,500 for Nifty; Sudeep Shah picks 6 stocks ahead of Diwali SECTIONS F&O Talk: Big break above 23,200 can open doors for 23,500 for Nifty; Sudeep Shah picks 6 stocks ahead of Diwali By Veer Sharma , ETMarkets.com Last Updated: Oct 31, 2026, 11:45:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Nifty could extend its recovery towards 23,500 if it decisively breaks above the 23,150\u201323,200 resistance zone, says SBI Securities' Sudeep Shah. He also shares his outlook on IT, midcap and smallcap indices, sector trends and six stocks, including TVS Motor, Coforge and ICICI Bank, ahead of Diwali.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "31 Oct 2026, 11:45 AM IST", "pub_date_relative": "52m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "8th Pay Commission: What happens after the commission submits its report? 5 key steps explained", "full_content": "The 8th Pay Commission has recently concluded 2 meaningful meetings in Bengaluru and Mumbai on October 8 and 23, respectively. Since its constitution on 3 November 2025, the 8th Pay Commission panel has held meaningful discussions in prominent states and union territories, including Delhi, Ladakh, Uttar Pradesh, and West Bengal. In a few days, on 3 November 2026, the commission will complete 1 year since its constitution.\n\nNow, it is vital to keep in mind that the 8th Pay Commission is a temporary 3-member body headed by Justice Ranjana Prakash Desai. The panel is expected to recommend meaningful changes and amendments to salaries, pensions, allowances, and associated payments of central government employees and pensioners.\n\nFurthermore, as per the terms of reference (ToR) of the 8th Pay Commission, the report is expected to be tabled within 18 months of the date of constitution, i.e., 3 November 2025. Therefore, the expectation is that the report will be officially presented by the 8th Pay Commission panel by May-June 2027.\n\nStill, it is vital to keep in mind that submitting the official report will not automatically trigger a salary hike. Once the report is presented, the central government will first have to examine and carefully analyse the recommendations, their fiscal prudence and decide how they should be implemented.\n\nA vital aspect of the report will be the fitment factor multiplier, which determines how existing basic pay is multiplied to calculate the revised basic pay. This is an extremely important metric that can give a clear picture of the 8th Pay Commission recommendations.\n\nThe 6th Pay Commission recommended a fitment factor of 1.86, while the 7th Pay Commission proposed a uniform fitment factor of 2.57.", "source": "LiveMint Money", "pub_date_str": "31 Oct 2026, 11:33 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Trump called out Big Oil profits. Here\u2019s how much their refining earnings have surged since", "full_content": "President Donald Trump scolded Big Oil in August , saying ExxonMobil and Chevron were making \"too much money based on a shortage,\" as profits surged in the wake of the U.S.-Israeli war with Iran.\n\nCorporate results published this week laid out the windfall oil majors are continuing to get from tight fuel supplies and elevated refining margins amid global conflict.\n\nShell , BP , TotalEnergies and Exxon reported sharply higher margins in their refined-products businesses , a gauge of the amount they earn from processing crude oil into gasoline, diesel and jet fuel.\n\nChevron does not report a comparable, standalone refining-margin figure, but it reported Friday that its downstream earnings more than quadrupled from a year earlier to $4.9 billion, with the company citing higher margins on refined-product sales.\n\nThat's amid tight supplies of refined fuels and pressure on refinery output globally, despite oil firms reporting this week that they are running their facilities near capacity to try to meet demand.\n\nKey issues include ongoing Ukrainian drone strikes on Russian refineries and disruptions to Middle East energy infrastructure and supply chains linked to the Iran war and Houthi attacks on Saudi Arabia .\n\nThose factors have compounded refinery closures in Europe and North America , even as new refining capacity has been added elsewhere.\n\nAround a quarter of refineries in the European Union have shut over the past two decades, European Commissioner for Energy and Housing Dan J\u00f8rgensen said this week, as he warned of a \"crisis\" of energy security.", "source": "CNBC Top News", "pub_date_str": "31 Oct 2026, 11:30 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "AI is coming to construction sites. But does it make workers safer?", "full_content": "When Shelley Copsey was appointed by the Ontario Teachers' Pension Plan, one of the world's biggest infrastructure investors, her job was to find ways to use technology to solve problems across its portfolio.\n\nShe quickly learned that there were persistent problems facing front-line workers.\n\nFour years later, Copsey is CEO of FYLD, a London-headquartered software company that uses artificial intelligence to support workers in construction, utilities and infrastructure.\n\nIt comes as AI plays an increasingly important role in some of the most physically demanding jobs, from maintaining roads and railways to working on construction sites.\n\nAccording to Copsey, when fieldwork goes wrong, attention usually turns to budgets or cash flow.\n\n\"We always go to the back office and we're like: oh, if we could help them forecast the job better, maybe this wouldn't be a problem,\" she told CNBC. \"I think that what nobody ever did was just sit and say: well, what goes on in those field workers' lives and how do we make the life of the front line easier?\"\n\nFYLD uses AI to predict which permits a project will need, helping workers avoid delays. Previously, workers often arrived at a site without all of the information they needed, Copsey said. The system can also help crews plan around the weather, for example, rescheduling heavy lifting from a day when strong winds are forecast.\n\nWorkers record short videos describing their day's tasks and safety concerns. AI analyzes the information to help workers and managers anticipate potential problems.", "source": "CNBC Top News", "pub_date_str": "31 Oct 2026, 11:30 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments", "Portfolio Management"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Cyclone Tracking With AI: What It Can Predict And Where It Falls Short", "full_content": "The European Centre for Medium-Range Weather Forecasts' (ECMWF) 51-member ensemble had assigned a 35% probability to landfall between the Godavari delta and Yanam, with a median landfall time of 07:11 IST.", "source": "NDTV Profit", "pub_date_str": "31 Oct 2026, 11:20 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Quantitative Methods", "Derivatives"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "Dividend, stock split, bonus record date alert 2-8 Nov week: Infosys, Mazagon Dock, Coal India, Sanofi and other shares", "full_content": "GODREJCP TANLA CONCORDBIO VBL Sharmila Bhadoria Published 31 Oct 2026, 11:20 AM IST Prefer Livemint on Google Dividend, stock split, bonus issue, record date next week: The coming week is set to be packed with corporate actions like dividend, stock split, bonus issue, rights issues. Infosys, Mazagon Dock Shipbuilders , Asian Paints, Coal India, Concord Biotech , Godrej Consumer Products , and Varun Beverages are among the 50 companies that have fixed record dates for these corporate actions.\n\nMeanwhile, the Indian stock market reversed its losses this week, as Nifty 50 ended with 2.50% gain, whereas, BSE Sensex closed 1.60% higher. The stock market rally this week was driven by strong performance in the IT and pharmaceutical sector stocks. As investors plan their coming week, here are all the details to know.\n\nColgate Palmolive India, Route Mobile, Tanla Platforms , Asian Paints, Godrej Consumer Products, etc have fixed record dates for the coming week. To become eligible for the corporate action, investors must own the stock before the record date.\n\nCrescentis Capital Limited, Suvidhaa Infoserve Limited have fixed Wednesday, November 4, as the record date to determine the eligibility of shareholders for the corporate action.\n\nConcord Biotech Limited is the only company that has fixed record date for the coming week for bonus issue, as per BSE data as on October 31. The company has fixed November 4 as the record date for bonus issue in the ratio of 1:1.\n\nGujarat Natural Resources has fixed November 5 as the record date from \u20b9 10 to Re 1 stock split. Additionally, Knowledge Marine & Engineering Works has fixed November 6 as the record date for stock split from \u20b9 5 to Re 1.\n\nCatch all the Business News , Market News , Breaking News Events, JIO IPO Listing Today LIVE and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.\n\nLog in to our website to save your bookmarks. It'll just take a moment.", "source": "LiveMint Markets", "pub_date_str": "31 Oct 2026, 11:20 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "US Debt Ceiling Battle: Why Indian Markets Cannot Ignore the 2027 Risk", "full_content": "The US could hit its $41.1 trillion debt ceiling by mid-2027, raising fears of a political standoff after the November 2026 midterm elections. Here's why the developments matter for Indian markets.", "source": "NDTV Profit", "pub_date_str": "31 Oct 2026, 11:16 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Bitcoin holds above $77,000 as Binance hack recovery takes shape", "full_content": "", "source": "Investing.com News", "pub_date_str": "31 Oct 2026, 11:05 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "SGB 2021-22 Series VII premature redemption due on 2 November: Investors to pocket 200% gains; check RBI quoted price", "full_content": "Investors holding SGB 2021-22 Series VII will be eligible for premature redemption on 2 November 2026, following the completion of five years from the date of issuance. The Reserve Bank of India ( RBI ) has fixed the redemption price of the Sovereign Gold Bonds (SGBs) at \u20b9 14,167 per gram.\n\nAccording to the RBI's press release dated 30 October, the 2021-22 Series VII tranche was issued on 2 November 2021. \u201cPremature redemption of Gold Bond may be permitted after fifth year from the date of issue of such Gold Bond on the date on which interest is payable. Accordingly, the due date of premature redemption of the above tranche shall be on November 02, 2026.\u201d\n\nSovereign Gold Bonds are government securities denominated in grams of gold and issued by the RBI on behalf of the Government of India. They provide investors with exposure to gold prices without requiring them to purchase or physically store the precious metal.\n\nHere's what you need to know about the capital gains and interest on the premature redemption of Sovereign Gold Bonds (SGB) 2021-22 Series VII.\n\nAccording to the RBI circular, the redemption price is calculated using the simple average of the closing prices of 999-purity gold over the three preceding business days, as published by the India Bullion and Jewellers Association Ltd (IBJA).\n\n\u201cThe redemption price for premature redemption due on November 02, 2026, shall be \u20b9 14,167/- (Rupees Fourteen Thousand One Hundred and Sixty-Seven Only) per unit of SGB based on the simple average of closing price of gold for the three business days i.e., October 28, October 29, and October 30, 2026.\u201d\n\nAccording to the Ministry of Finance's release published by PIB dated 23 October 2021, the original issue price of SGB 2021-22 Series VII was \u20b9 4,765 per gram.", "source": "LiveMint Money", "pub_date_str": "31 Oct 2026, 11:05 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income", "Alternative Investments"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "IPO ahead: Value-fashion retailer Ratnadeep Retail gets Sebi nod to raise funds through public issue", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a IPO ahead: Value-fashion retailer Ratnadeep Retail gets Sebi nod to raise funds through public issue Vishal Mega Mart Share Price Avenue Supermarts Share Price Spencers Retail Share Price Osia Hyper Retail Share Price The Economic Times daily newspaper is available online now. Read Today's Paper IPO ahead: Value-fashion retailer Ratnadeep Retail gets Sebi nod to raise funds through public issue SECTIONS IPO ahead: Value-fashion retailer Ratnadeep Retail gets Sebi nod to raise funds through public issue By Kumar Gaurav , ETMarkets.com Last Updated: Oct 31, 2026, 11:04:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Ratnadeep Retail has received Sebi approval to launch an IPO comprising a fresh issue of up to Rs 400 crore and an offer for sale of 1.49 crore shares. The Hyderabad-based retailer plans to use part of the proceeds to repay borrowings and expand its store network across India.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "31 Oct 2026, 11:04 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Alaska Air Layoffs: Airline To Cut Nearly 200 Jobs As Fuel Shock Squeezes Earnings", "full_content": "The group, which owns Alaska Airlines and Hawaiian Airlines, is heading for a loss this year despite growing revenue, according to its own results.", "source": "NDTV Profit", "pub_date_str": "31 Oct 2026, 10:59 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Gold, silver rates today Bangalore 31 Oct: Latest prices, up-down movement for precious metal investors in Garden City", "full_content": "Gold, Silver rates today, 31 October: Gold prices in Bangalore fell today as they tumbled globally to a one-year low and headed to close at its record worst October since the global financial crisis in 2008, as per a Bloomberg report. Soaring oil prices, inflation concerns and slump in US tech stocks have pushed investors to sell bullion to recover losses, it added.\n\nGold bullion fell as much as 3.6% to $3,876.39 an ounce, the lowest since early October 2025, and is on path to record a monthly drop of over 6% \u2014 the lowest since October 2008, as per the report. Meanwhile, silver dived over 6% to below $49 an ounce, extending its monthly decline to nearly 19%. The precious metal has erased all of its gains since early December, when it began a dramatic two-month rally that took prices above $120 an ounce.\n\n\u201cHigher oil prices are triggering a risk-off environment, which is triggering a Treasury rally. This is reducing liquidity for equities and gold is getting caught up in the momentum. In addition, gold has been sliding down toward a key technical level, and trend followers are challenging the long-term support in both gold and silver ,\u201d Bart Melek, global head of commodity strategy at TD Securities told the publication.\n\nAt time of writing, gold bullion was trading at \u20b9 1,38,830 per 10 grams, while Silver was at \u20b9 1,79,430 per kg, data on the bullion website showed.\n\nCheck the latest prices and up-down movement for precious metal investors in Garden City; and gold and silver rates in key Indian cities on Saturday, 31 October 2026. Check the price of 18K, 22K and 24K gold and 999 Fine silver in Ahmedabad, Chennai, Delhi, Hyderabad, Kolkata, and Mumbai today as follows:\n\nIn the Garden City, the 24-karat gold price in Bengaluru was at \u20b9 1,38,680 per 10 grams, on 31 October.", "source": "LiveMint Money", "pub_date_str": "31 Oct 2026, 10:50 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "New type of \u20b910 and \u20b920 notes from this date? Will RBI change dimensions or keep it same for polymer version?", "full_content": "The Reserve Bank of India (RBI) is likely to roll out its pilot polymer currency on April 1, 2027, with dimensions of existing \u20b9 10 and \u20b9 20 banknotes unchanged. According to a report by Moneycontrol , the decision to keep the dimensions unchanged would benefit banks as they won\u2019t have to spend extra on reconfiguration of their ATMs.\n\n\u201cRetaining the existing dimensions will help banks avoid upfront capital expenditure on ATM reconfiguration. Since the programme will initially be a pilot covering smaller denominations, the savings could be substantial,\u201d a senior official of a state-owned bank told Moneycontrol.\n\nIn August, Reserve Bank of India Governor Sanjay Malhotra had highlighted the longevity of polymer currency notes. Malhotra pointed out that the polymer currency notes have lasted for over 30 years in some jurisdictions and will come in handy, especially for the lower denomination notes which have high velocity.\n\n\"We are targeting that they are in circulation, if everything goes as per plan, in the beginning of the next financial year,\" Malhotra had said.\n\nIn July, the Bharatiya Reserve Bank Note Mudran Private Limited (BRBNMPL)\u2014a wholly-owned subsidiary of the Reserve Bank of India (RBI)\u2014issued a global Expression of Interest (EOI) to identify and shortlist established manufacturers of opacified polymer substrate sheets with security features suitable for printing Indian banknotes.\n\nThe RBI proposed to introduce 2 billion polymer notes\u20141 billion each of \u20b9 10 and \u20b9 20\u2014for field trials. The exercise is intended to test durability, handling, public acceptance, and operational feasibility before any decision on wider issuance is taken.\n\nIt should be noted that the polymer notes are being introduced as a field trial and are not intended to replace the existing paper currency.", "source": "LiveMint Money", "pub_date_str": "31 Oct 2026, 10:47 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Three stocks with strong order books to watch amid India's data-centre boom", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nWith India's data-centre capacity set for a sharp expansion, investors are looking beyond quarterly earnings to identify the companies positioned to benefit from the infrastructure spending. Their order books offer a window into that opportunity, providing a measure of future revenue visibility as the artificial intelligence (AI) build-out gathers pace.\n\nOne of the defining themes of the Q2 FY27 earnings season is the capital expenditure cycle linked to India's data-centre and AI infrastructure build-out . The country's live data-centre capacity has crossed roughly 1.8 GW, following a record addition of 258 MW in the first half of FY27, and is projected to reach about 10.5 GW by 2031.\n\nFor investors, the scale of this expansion makes order books an important metric alongside revenue and profit growth. They indicate the volume of business companies have secured and offer clues to the potential trajectory of future revenues.\n\nThree companies stand out for their exposure to different parts of this infrastructure chain: building facilities, powering projects and providing the optical connectivity that data centres need.\n\nLarsen & Toubro (L&T), India's largest engineering and construction conglomerate, was incorporated in 1938. It operates across projects, hi-tech manufacturing and services, with businesses spanning infrastructure and utilities, energy, manufacturing and products, and technology platforms and services. The last houses its expanding data-centre, semiconductor and digital-platform businesses.\n\nL&T reported record second quarter results, with revenue rising 16% year-on-year to \u20b9 78,700 crore and profit after tax increasing 33% to \u20b9 5,200 crore. Order inflows surged 28% to a quarterly record of \u20b9 1,47,700 crore.", "source": "LiveMint Markets", "pub_date_str": "31 Oct 2026, 10:36 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Joining The Dots | Dark Skies, Steady Diya: Why Hope Holds This Diwali", "full_content": "With war, a weak rupee and foreign outflows weighing on sentiment, policymakers at the NDTV World Summit and market veterans at NDTV Profit Ignite: Diwali Edition offered the same advice: stay invested and filter out the noise.", "source": "NDTV Profit", "pub_date_str": "31 Oct 2026, 10:34 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Bank of England explores easing key limit on riskier mortgage lending", "full_content": "Central bank considers lifting threshold on higher-risk mortgages in response to calls from government and industry to boost home-ownership", "source": "FT Markets", "pub_date_str": "31 Oct 2026, 10:30 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Andhra Pradesh pensions: State Election Commission allows payments, bars new enrolments under Model Code of Conduct", "full_content": "The Andhra Pradesh State Election Commission (SEC) has permitted the distribution of social security pensions to existing beneficiaries during the ongoing Model Code of Conduct (MCC) period. Still, the commission has strictly prohibited any amendments or additions of new beneficiaries, or any increase or revision to existing pension amounts, until the election code remains in force, as per a report by The Times of India.\n\nThis decision was issued on 30 October 2026. It is intended to ensure that all vulnerable sections of society, eligible recipients, and beneficiaries continue to receive their regular pension payments without delay or disruption throughout the entire election period. The focus is on maintaining social well-being and ensuring meaningful compliance with election authorities.\n\nThe permission follows a proposal submitted by the chief executive officer of the Society for Elimination of Rural Poverty (SERP). It covers eligible beneficiaries such as senior citizens, widows, single women, persons with disabilities and individuals suffering from various health conditions and financial problems .\n\nThe Commission has authorised designated personnel to withdraw pension funds from banks, in accordance with prevailing rules and regulations, and distribute them among existing beneficiaries. However, this exercise must strictly follow the prescribed procedures.\n\nFurthermore, only officially authorised personnel can handle the withdrawal, management, transportation and distribution of pension funds.", "source": "LiveMint Money", "pub_date_str": "31 Oct 2026, 10:30 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Diwali stock picks: SBI Securities lists 11 stocks with up to 22% upside potential. Do you own any?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News Diwali stock picks: SBI Securities lists 11 stocks with up to 22% upside potential. Do you own any? Written by Debaroti Adhikary , ETMarkets.com | Oct 31, 2026, 10:24:15 AM IST 1 / 11 \u200bFestive Bets As India prepares to celebrate Diwali next week, investors will welcome Samvat 2083 after a challenging year for equities.\n\nSBI Securities expects a gradual recovery after two years of consolidation. The primary catalyst for this recovery, according to the brokerage, will be a pullback in crude oil prices below $90 per barrel.\n\n\u201cWe remain optimistic about forward outlook and believe domestic equities are likely to deliver better returns on the back of double-digit earnings growth despite of vulnerable external environment, likely conclusion of trade deal between US-India, alongside India\u2019s ongoing export basket diversification, reversal of global AI trade, which should redirect capital flows toward well diversified markets emerging markets like India and likelihood of continued reforms by the government to accelerate economic growth,\u201d it said. Additionally, SBI Securities believes any relief in the taxation pertaining to STT or LTCG would serve as a big sentiment booster for equity markets. Going forward, it believes the sectors from where wealth creators are likely to emerge are auto OEMs and auto ancillaries, capital goods or Engineering, including defence, aerospace engineering, railway safety, power equipment, pharma ancillary, import substitution like CNC machine, BFSI, EMS, recycling, new age platform businesses, pharma - CDMO & chemicals, structural steel tubes, discretionary consumption (hotels, jewellery, alcoholic beverages etc.) and metals or mining. Also read | Diwali 2026: Sensex plunged 10,000 points, Nifty dropped 12% since last Diwali.", "source": "Economic Times Markets", "pub_date_str": "31 Oct 2026, 10:13 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Oil prices soar 14% in October to 6-month high as US weighs fresh Iran strikes after midterms. More pain ahead?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Commodities \u203a News \u203a Oil prices soar 14% in October to 6-month high as US weighs fresh Iran strikes after midterms. More pain ahead? The Economic Times daily newspaper is available online now. Read Today's Paper Oil prices soar 14     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
