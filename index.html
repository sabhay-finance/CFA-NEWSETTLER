<script>
    // This variable will be injected during the build process
    const allData = {"general": [{"title": "Renting in The Villages Costs Less Than Owning and the Owners Are Starting to Notice", "full_content": "Skip to navigation Skip to main content Skip to right column Renting in The Villages Costs Less Than Owning and the Owners Are Starting to Notice David Beren Sat, September 19, 2026 at 6:20 AM MST 5 min read Quick Read Owning a $400,000 Villages home costs owners roughly 4.5% annually in forgone investment income alone, before taxes, insurance, or CDD bond payments.\n\nAnnual rentals run between $2,200 and $3,000 a month, but renting beats owning only for stays under eight years once all costs are counted.\n\nA 75-year-old facing a forced sale in a narrow buyer pool at 3.98 million existing home sales risks losing the flexibility a lease ending provides.\n\nTwo retirees, same $1 million, same 4% rule, buy one finished with $1.4 million, the other hit $0 in 12 years. Our free reader guide explains the flaw that separated them, and the income-first method built to avoid it.\n\nAt the end of the day, renting versus buying in The Villages comes down to one thing: math. More owners are running the numbers and finding that renting wins on the spreadsheet, so here is what the comparison actually looks like when every line is filled in.\n\nStart with a comparable two-bedroom designer or courtyard villa in the mid-priced range. Current asking prices cluster in the $350,000 to $450,000 band, but the purchase price is only the entry ticket. Almost every lot includes a bond obligation: the CDD infrastructure debt that funded streets, drainage, and utilities. Remaining balances typically run $10,000 to $40,000 depending on section and vintage, amortized on the annual tax bill at rates often in the 5% to 6% range with terms that can stretch decades.\n\nThe amenity fee, contractually adjustable by CPI, currently sits near $200 a month and escalates annually. With headline CPI running from 308.417 in January 2024 to 334.980 in August 2026, that clause has been active.", "source": "Yahoo Finance", "pub_date_str": "19 Sep 2026, 06:50 PM IST", "pub_date_relative": "12m ago"}, {"title": "Is Markel the New Berkshire Hathaway Blueprint for Value Investors Post-Buffett?", "full_content": "Skip to navigation Skip to main content Skip to right column Is Markel the New Berkshire Hathaway Blueprint for Value Investors Post-Buffett? Trey Thoelcke Sat, September 19, 2026 at 6:15 AM MST 4 min read BRK-B MKL Quick Read Markel mirrors Berkshire's three-engine model of insurance, equities, and operating businesses, with $18.84 billion in float and $429.5 million in 2025 buybacks, but its $22 billion market cap makes it a fundamentally different species.\n\nMarkel's combined ratio improved to 94.6% in 2025, yet shares are down 17% year to date while trailing Berkshire's 10-year return by 155 percentage points.\n\nThree signals determine the Markel thesis: whether the combined ratio holds in the low 90s, buybacks sustain pace, and Markel Ventures remains inside the group.\n\nJust released. Our analysts combed the entire stock market and named the ten best stocks to buy right now, and Berkshire Hathaway didn't make the cut. Enter your email to see the names that beat BRK-B. The report is free. Enter your email and see if any of your stocks made the cut.\n\nWarren Buffett has stepped down as board chair of Berkshire Hathaway, with Greg Abel now running the company. The handoff has revived a question value investors have batted around for a decade: with the Oracle off the field, is Markel Group ( NYSE:MKL ) the closest thing left to early Berkshire Hathaway ( NYSE:BRK-B )?\n\nMarkel runs the same three-engine model: specialty insurance underwriting, a public equity portfolio, and wholly owned operating businesses inside Markel Ventures. It pays no dividend and returns capital through buybacks. CEO Tom Gayner told investors on the July 30, 2026, call that \"We continue to work on building the system designed to relentlessly compound your capital.\" Insurance float, the fuel for compounding, expanded to $18.84 billion in 2025. Buybacks totaled $429.5 million in 2025, cutting the share count to 12.4 million by mid-2026.\n\nScale is the first wall.", "source": "Yahoo Finance", "pub_date_str": "19 Sep 2026, 06:45 PM IST", "pub_date_relative": "17m ago"}, {"title": "History Says This Investment Strategy Can Build a $1 Million Portfolio. Here's How.", "full_content": "Skip to navigation Skip to main content Skip to right column History Says This Investment Strategy Can Build a $1 Million Portfolio. Here's How. David Dierking, The Motley Fool Sat, September 19, 2026 at 6:14 AM MST 3 min read ^GSPC NVDA The idea of building a $1 million portfolio might sound more daunting than climbing Mt. Everest. In reality, it's more achievable than you probably think. With enough time, discipline, and the right mix of investments, the long-term power of compounding can get you to the $1 million mark and beyond!\n\nJust take a look at history. If you invested $10,000 in the S&P 500 (SNPINDEX: ^GSPC) at the beginning of 1996, it would have grown to roughly $214,000 with dividends reinvested. Now, that's clearly not $1 million, but that's how large it grew with a one-time investment. Imagine how big it could get if you added a modest monthly investment to it over all those years.\n\nMissed AI's \"Act 1\"? Act 2 Could Be 15x Bigger. Most investors think they missed the AI boat because they didn't buy Nvidia in 2005. But according to our analysts, we're only at the end of \"Act 1\"\u2014the R&D phase. \"Act 2\" is the global rollout. Continue \u00bb\n\nThis is why the idea of regular, consistent investing over time is one of the best pathways to millionaire status.\n\nOver the past century, the S&P 500 has returned around 10% annually. The index has performed much better than that over the past decade, but the next decade could very well be much worse. When projecting long-term returns, it's better to be a little more conservative.\n\nLet's assume that an investor earns an 8% average annual return and chooses to make regular monthly investments via a 401(k) or another systematic investing plan. Assuming they're starting from zero, here's approximately how much it would take over time to accumulate $1 million.\n\nData source: Investor.gov.", "source": "Yahoo Finance", "pub_date_str": "19 Sep 2026, 06:44 PM IST", "pub_date_relative": "18m ago"}, {"title": "MS NOW journalists blocked from White House after Trump bans three media outlets", "full_content": "Journalists from MS NOW were denied access to the White House grounds early Saturday, one day after President Donald Trump said he is banning three media outlets \u2014 MS NOW, CNN and Politico \u2014 over their coverage of him.\n\n\"Earlier this morning MS NOW journalists were denied access to the White House grounds,\" MSN said in a statement. \"The White House belongs to the American people and the decisions made inside are funded by our tax dollars. MS NOW intends to take any and all steps necessary to defend our First Amendment rights and the essential role of independent journalism in our democracy.\" MS NOW said it will \"continue to report on the President, the administration, and the issues that impact the American people.\"\n\nOn Friday, Trump said in a Truth Social post that those outlets \"shouldn't be able to constantly write or report FICTION and LIES when they're covering the President of the United States, the Trump Administration, or the United States of America.\"\n\nLater that day, in the Oval Office, the president said he was imposing the ban in response to \"cumulative stories\" by the three outlets.\n\nIn 2018, Trump's White House briefly tried to suspend a CNN reporter's press pass, and it is currently being sued over an attempted ban of Associated Press journalists from certain spaces.\n\nTrump said Friday that the effort to bar news outlets is worthwhile, even if it does not hold up in court.\n\n\"I think it's good to point it out whether it survives or doesn't,\" Trump said.\n\n\u2014 CNBC's Kevin Breuninger and Dan Mangan contributed to this report.", "source": "CNBC Top News", "pub_date_str": "19 Sep 2026, 06:41 PM IST", "pub_date_relative": "21m ago"}, {"title": "The S&P 500 just logged another losing week, yet these stocks could be due for a bounce", "full_content": "Another losing week has dragged certain individual stocks to levels where they might find some support.", "source": "CNBC Top News", "pub_date_str": "19 Sep 2026, 06:32 PM IST", "pub_date_relative": "30m ago"}, {"title": "Motorola Solutions Eyes Defense, Drone Security Growth as Silvus Scales", "full_content": "Skip to navigation Skip to main content Skip to right column Motorola Solutions Eyes Defense, Drone Security Growth as Silvus Scales MarketBeat Sat, September 19, 2026 at 6:02 AM MST 6 min read MSI Key Points Interested in Motorola Solutions, Inc.? Here are five stocks we like better.\n\nMotorola Solutions expects broad-based growth , projecting 2026 gains of 10%\u201311% in mission-critical networks, about 11% in video security and about 15% in command-center software, supported by modernization of public-safety and federal infrastructure.\n\nSilvus Technologies is becoming a major defense growth driver , with approximately $850 million in expected 2026 sales at current capacity. Motorola is expanding production, sales and R&D as demand grows for secure communications in contested environments and unmanned-systems operations.\n\nD-Fend Solutions expands Motorola's counter-drone opportunity in public safety, airports, critical infrastructure and venues. The business was selected for a $1.5 billion U.S. Department of Homeland Security grant program and uses cyber-based technology to take control of and safely land threatening drones.\n\nMotorola Solutions (NYSE:MSI) is focused on executing across its mission-critical networks, command center software and video security businesses while scaling its recently acquired Silvus Technologies and D-Fend Solutions operations, Chief Operating Officer Jack Molloy said at a Truist conference.\n\nMolloy described Motorola Solutions as a provider of public-safety, enterprise-security and defense-security solutions.", "source": "Yahoo Finance", "pub_date_str": "19 Sep 2026, 06:32 PM IST", "pub_date_relative": "30m ago"}, {"title": "Trump says he is banning media outlets CNN, MS NOW, Politico from White House", "full_content": "", "source": "Investing.com News", "pub_date_str": "19 Sep 2026, 06:30 PM IST", "pub_date_relative": "32m ago"}, {"title": "What Will $5,000 Invested in Palantir Stock Be Worth in 5 Years?", "full_content": "Skip to navigation Skip to main content Skip to right column What Will $5,000 Invested in Palantir Stock Be Worth in 5 Years? Vandita Jadeja Sat, September 19, 2026 at 6:00 AM MST 5 min read PLTR Quick Read PLTR trades near $176 and a $5,000 stake could grow to $8,162 in the bull case or fall to $4,629 in the bear case by 2031.\n\nPalantir posted 93% revenue growth in Q2 2026, raised full-year guidance to $8.15 billion, and hit a Rule of 40 score of 155.\n\nA P/E near 250 and beta of 1.6 mean any growth stumble or government budget shift could rapidly compress the stock toward the bear case.\n\nJust released. Our analysts combed the entire stock market and named the ten best stocks to buy right now, and Palantir didn't make the cut. Enter your email to see the names that beat PLTR. The report is free. Enter your email and see if any of your stocks made the cut.\n\nPalantir Technologies ( NASDAQ:PLTR ) has become one of the most closely watched names in enterprise AI, riding a wave of sovereign-AI demand that pushed U.S. commercial revenue up 149% year-over-year in the second quarter of 2026.\n\nAt a recent price of $175.91, the question for investors putting a fresh $5,000 to work is simple: what could that stake realistically look like five years out, if the modeled trajectory holds?\n\nUnder the five-year base case, PLTR shares are modeled to reach $217.44, a total return of 23.62% or roughly 4.33% annualized. Plugged into a starting stake, a $5,000 investment could be worth about $6,181 at the five-year mark.\n\nThe modeled per-share target sits below the current $196.84 analyst consensus target, reflecting a valuation methodology that blends trailing P/E, forward P/E, and analyst targets with a proprietary factor score. Model confidence on the projection is high at 0.9, and the current recommendation reads hold based on a 3.55% reported upside to fair value.", "source": "Yahoo Finance", "pub_date_str": "19 Sep 2026, 06:30 PM IST", "pub_date_relative": "32m ago"}, {"title": "Every New Reactor Needs Fuel: 3 Uranium Stocks Positioned for the Nuclear Buildout", "full_content": "Skip to navigation Skip to main content Skip to right column Every New Reactor Needs Fuel: 3 Uranium Stocks Positioned for the Nuclear Buildout Joel South Sat, September 19, 2026 at 6:00 AM MST 8 min read NXE NXE UEC DNN Quick Read UEC holds $488M cash with zero debt and actual uranium production; NXE's 257M lb Arrow deposit draws 16 unanimous analyst buy ratings averaging $19.\n\nUtilities are structurally short contracted uranium pounds, and the last US mine permitting took 14 years, which helps explain why in-ground resources command extreme revenue multiples.\n\nDenison's Phoenix is Canada's first uranium mine approved for construction in 20 years, with 8M+ lbs already contracted and first production targeted for mid-2028.\n\nJust released. Our analysts combed the entire stock market and named the ten best stocks to buy right now, and NexGen Energy didn't make the cut. Enter your email to see the names that beat NXE. The report is free. Enter your email and see if any of your stocks made the cut.\n\nUranium mining is the narrow end of the funnel feeding the AI-driven reactor buildout. On April 23, the U.S. Department of Energy launched the Nuclear Dominance 3x33 campaign to secure the domestic nuclear fuel supply chain and support future reactor deployment, and utilities are staring at a widening long-term supply gap while a Russian enriched-uranium ban takes hold.\n\nThis edition covers the smaller, earlier-stage end of the mining chain: three US-listed junior and development-stage miners. Every one of them is speculative and belongs, if anywhere, in a small allocation. None has the cash-flow profile of a regulated utility or a mature producer. Before the tickers, a definitional refresher: a resource estimate is a geological inventory, a reserve is the economically mineable subset of that resource, a permitted project has regulatory approval but may not be built and an operating mine actually produces pounds and books revenue.", "source": "Yahoo Finance", "pub_date_str": "19 Sep 2026, 06:30 PM IST", "pub_date_relative": "32m ago"}, {"title": "Warsh\u2019s Fed shows it\u2019s serious about taming inflation. Why Wall Street now believes it.", "full_content": "After more than five years of failing to do so, Federal Reserve leaders think they can shrink the rate of inflation to 2% by 2029 with just slightly higher U.S. interest rates. Are they serious?", "source": "MarketWatch Top Stories", "pub_date_str": "19 Sep 2026, 06:30 PM IST", "pub_date_relative": "32m ago"}, {"title": "8th pay commission: DA merger, fitment factor, allowances \u2014 Components in focus for salary hike, explained", "full_content": "Constituted every decade, pay commissions aim to discuss and decide on possible changes to emoluments for central government employees and pensioners. Assembled last year, the 8th Central Pay Commission (CPC) in is in its consultation stage, with plans to engage with employee and pensioner associations, federations, and unions of central government, UT employees, and other stakeholders across the country.\n\nMost recently, it conducted meetings in Chandigarh , Chennai and Puducherry and has scheduled a state visit to Bengaluru in the next month. These unions and groups collectively represent a large number of employees and pensioners, including defence and railway staff. And the meetings are significant as discussions with representatives are expected to play an important role in shaping the commission's deliberations.\n\nWhen it comes to likely salary hike, the conservative estimate is for a 20-30% jump in the 8th CPC, while the moderate estimate is for a 30-50% hike, and the high-end estimate is for an optimistic 80+% salary increase.\n\nNotably, Terms of Reference ( ToR ). approved by the Union Cabinet last year, define the commission's scope of work and specifies the areas on which it must make recommendations. This includes examining and recommending changes that are desirable and feasible in the emoluments, including pay, allowances, other facilities/benefits, in cash or kind having regard to rationalisation, contemporary functional requirements and specialised needs.\n\nThus, during official meetings, the commission is examining updates to the salary structure and various components, including:\n\nFurther, till July, the commission also sought data and suggestions from employee groups and unions, pensioner representatives and other stakeholders.", "source": "LiveMint Money", "pub_date_str": "19 Sep 2026, 06:29 PM IST", "pub_date_relative": "33m ago"}, {"title": "Amgen or Merck: Which Drugmaker Has the Stronger Dividend Growth Story?", "full_content": "Skip to navigation Skip to main content Skip to right column Amgen or Merck: Which Drugmaker Has the Stronger Dividend Growth Story? Chris Lange Sat, September 19, 2026 at 5:55 AM MST 5 min read MRK AMGN Quick Read Amgen (AMGN) yields 2.6% with a $10.08 annualized payout, topping Merck (MRK) at 2.29%, and has raised its dividend 6% annually versus Merck's smaller step-ups.\n\nAmgen's 17 billion-dollar products and $3.5B quarterly free cash flow dwarf Merck's reliance on a single Keytruda franchise facing peak penetration.\n\nMerck absorbed a $5.7B acquisition charge that pushed Q2 earnings to a loss, while Amgen raised 2026 EPS guidance to as high as $23.50.\n\nJust released. Our analysts combed the entire stock market and named the ten best stocks to buy right now, and Merck didn't make the cut. Enter your email to see the names that beat MRK. The report is free. Enter your email and see if any of your stocks made the cut.\n\nFor a retirement portfolio that leans on pharma dividends, the choice between Amgen ( NASDAQ:AMGN ) and Merck ( NYSE:MRK ) comes down to one question: which check is more likely to keep getting bigger through the next wave of patent expirations? Both companies deliver quarterly income today. Only one has the coverage, the growth cadence, and the portfolio breadth to keep raising through the cliff.\n\nAmgen pays a quarterly dividend of $2.52 per share, an annualized forward payout of $10.08. At $385.28, that lands at a yield of roughly 2.6%. Merck pays $0.85 quarterly, or $3.40 annualized, and at $146.65 yields 2.29%.\n\nOn starting yield, Amgen wins. It is not a wide gap, but for a retiree sizing positions to hit an income target, the difference compounds. An investor putting $100,000 to work today gets meaningfully more current cash from AMGN, and the gap holds even after Merck's 85.17% one-year rally compressed its yield. Winner: Amgen.\n\nBoth boards raise annually, and both raised again this year. The verified quarterly progression tells the story.", "source": "Yahoo Finance", "pub_date_str": "19 Sep 2026, 06:25 PM IST", "pub_date_relative": "37m ago"}, {"title": "Is Micron's 9% Dip a Warning Sign or Buying Opportunity?", "full_content": "Skip to navigation Skip to main content Skip to right column Is Micron's 9% Dip a Warning Sign or Buying Opportunity? Catie Hogan, The Motley Fool Sat, September 19, 2026 at 5:55 AM MST 2 min read MU NVDA SKHY 005930.KS What comes up must come down? Maybe, but maybe not. Shares of Micron (NASDAQ: MU) dropped more than 9% over the past week, rattling investors accustomed to Micron shares only going north. The pullback wasn't due to anything Micron said or did, but rather to a mix of uncertainty and fears about AI regulation and the slowing pace of its development.\n\nMicron, along with rivals SK Hynix and Samsung , controls almost 90% of the global DRAM market. The demand for memory is unprecedented; these three companies control the vast majority of supply, and thus have pricing power. While there hasn't been antitrust scrutiny yet, this is another concern in the longer term.\n\nMissed Nvidia in 2009? This Rare Signal Is Flashing Again. In 2009, a \"Double Down\" signal flashed for a little-known chipmaker called Nvidia. For the first time in years, that same \"Total Conviction\" signal is flashing for a company 1/100th the size of Nvidia. Continue \u00bb\n\nUltimately, these fears feel a bit more panicky than based on the current reality, though. Micron's memory supply is sold out through 2026 and is nearly sold out for 2027. The company has said it can only meet a portion of customer demand in the medium term. This means that any AI-related slowdown is unlikely to affect Micron until at least 2028, if at all.\n\nMemory chips are in a supercycle, unlike the memory cycles that came before it. It may eventually end if supply can catch up with demand, but until then, this dip looks less like a warning sign and more like a chance to buy the stock at a slightly lower price. The AI infrastructure build-out is still in a very early stage, and Micron has a firm grip on market share.\n\nShares of Micron are still up more than 225% in 2026 and 485% over the past 12 months.", "source": "Yahoo Finance", "pub_date_str": "19 Sep 2026, 06:25 PM IST", "pub_date_relative": "37m ago"}, {"title": "Consumer sentiment is in the dumps despite a solid economy. Goldman Sachs blames 'lower happiness'", "full_content": "Goldman Sachs identified a potential culprit for sour consumer sentiment readings: A decline in happiness.\n\nThe consumer sentiment index tracked by the University of Michigan hit record lows this year. The index fell 13% year over year in September, due to a drop of almost 8% from August alone.\n\nEconomists have widely questioned why sentiment has remained depressed since the Covid pandemic, even as the economy hummed along on paper. Goldman economist Joseph Briggs told clients this week that the downward pressure may stem from broader pessimism in society.\n\n\"Low reported economic sentiment likely reflects a more fundamental, downbeat assessment of the state of the world rather than the economy,\" Briggs wrote to clients.\n\nTo be sure, Briggs said inflationary pressures are likely also hurting confidence. But he said \"lower happiness\" at large can partially explain the continued disconnect between sentiment and other measures of the economy's performance, such as gross domestic product growth or stock market performance, that offer rosier views.\n\nBriggs pointed to data from the University of Chicago's General Social Survey illustrating how happiness never fully recovered from a drop during the pandemic. The share of respondents feeling \"very happy\" fell to 23% in 2024 from 31% in 2016, survey data shows. The percentage reporting responses of \"not too happy\" rose from 13% to 20% over the same period, per the data.\n\nOverall happiness saw a sharper decline than the perception of financial satisfaction also tracked in the survey, according to Briggs' analysis of the data.\n\nBriggs isn't the only economist pointing the finger at declining happiness readings. Joanne Hsu, the director of Michigan's survey, told CNBC earlier this year that the downtrend in sentiment mirrors readings showing both decreasing happiness and trust in public institutions.", "source": "CNBC Top News", "pub_date_str": "19 Sep 2026, 06:20 PM IST", "pub_date_relative": "41m ago"}, {"title": "John Ternus's First iPhone Launch Prompted a Bank of America Price Target Cut. Is Apple Stock a Buy?", "full_content": "Skip to navigation Skip to main content Skip to right column John Ternus's First iPhone Launch Prompted a Bank of America Price Target Cut. Is Apple Stock a Buy? Chris Neiger, The Motley Fool Sat, September 19, 2026 at 5:50 AM MST 4 min read AAPL NVDA John Ternus recently hosted his first iPhone event as Apple (NASDAQ: AAPL) CEO, and following the debut of the new iPhone 18 Pro and Pro Max, as well as the company's first foldable iPhone Duo.\n\nBank of America analyst Wamsi Mohan reiterated his buy rating for Apple stock following the event, but cut his price target to $370, down from $380 previously.\n\nMissed AI's \"Act 1\"? Act 2 Could Be 15x Bigger. Most investors think they missed the AI boat because they didn't buy Nvidia in 2005. But according to our analysts, we're only at the end of \"Act 1\"\u2014the R&D phase. \"Act 2\" is the global rollout. Continue \u00bb\n\nWhile Mohan is generally bullish on Apple, he said the iPhone 18 Pro and Pro Max weren't priced as high as he expected. That could mean more phones are sold, but at lower margins.\n\nHere's why the new iPhone 18 Pro and Pro Max prices matter for Apple amid rising memory costs, and why Apple stock is still a buy.\n\nThe main reason Mohan lowered Apple's price target came after the new iPhone prices were revealed.\n\nThe iPhone 18 Pro starts at $1,199, and the Pro Max starts at $1,299 -- $100 higher than the previous generation -- but below Mohan's estimated price increase for each device.\n\nApple is dealing with a surge in memory prices, as demand for memory processors for data centers has pushed costs higher. Apple raised its Mac prices earlier this year in response, and the new iPhone 18 Pro and Pro Max prices reflect Apple's attempts to offset the rising prices.", "source": "Yahoo Finance", "pub_date_str": "19 Sep 2026, 06:20 PM IST", "pub_date_relative": "42m ago"}, {"title": "Aflac\u2019s (AFL) Net Earnings Jumped 37.7%, Yet Adjusted Earnings Actually Fell", "full_content": "Skip to navigation Skip to main content Skip to right column Aflac\u2019s (AFL) Net Earnings Jumped 37.7%, Yet Adjusted Earnings Actually Fell Maham Fatima Sat, September 19, 2026 at 5:45 AM MST 4 min read AFL On August 6, Aflac (NYSE: AFL ) reported second-quarter numbers that point in opposite directions. Net earnings climbed to $825 million, helped along by investment losses that shrank to $153 million from $421 million a year ago. Adjusted earnings, though, fell 7.7% to $883 million. Both numbers are real, but they answer different questions. Which measure you trust changes the story, so here is what sits underneath.\n\nStart with the yen, because it is muddying the picture. The average rate was 159.45 to the dollar, 9.3% weaker than a year earlier, and that cost adjusted earnings $0.05 a share. Take the currency out of the first half and adjusted earnings per share rose 4.1% to $3.57. Japan is also running more profitably. Its pretax adjusted margin widened to 34.3% from 32.0% as claims took a smaller bite out of premiums, and yen-based pretax adjusted earnings rose 3.4%. So part of the decline in Japan's dollar-reported profit is currency, not operations.\n\nThe US business is still growing at the top line. Net earned premiums rose 2.3% to $1.5 billion, and sales climbed 2.6% to $349 million, led by group voluntary benefits along with dental and vision plans. In Japan, the refreshed Tsumitasu life policy and the new Anshin Palette medical product grew strongly in the quarter, and first-half sales rose 7.0% to \u00a537.3 billion. Then there is the cash. Aflac returned $1.3 billion to shareholders in the quarter, $983 million of it through buybacks, and declared a $0.61 third-quarter dividend, payable September 1 to holders of record on August 19, 2026. Management notes 43 straight years of dividend increases through 2025 and says the board is on a path to extend that in 2026.\n\nThe catch is that Japan's profit gains came from lower claims, not a bigger business.", "source": "Yahoo Finance", "pub_date_str": "19 Sep 2026, 06:15 PM IST", "pub_date_relative": "46m ago"}, {"title": "Delhi Airport's Third Runway To Reopen On September 20 After Major Revamp", "full_content": "According to the airport operator, the upgraded runway has undergone the required inspections and validations and has received the necessary clearances ahead of its reopening.", "source": "NDTV Profit", "pub_date_str": "19 Sep 2026, 06:15 PM IST", "pub_date_relative": "47m ago"}, {"title": "Buffett takes next step in plan to keep Berkshire from straying", "full_content": "(This is the Warren Buffett Watch newsletter, news and analysis on all things Warren Buffett and Berkshire Hathaway. You can sign up here to receive it every Friday evening in your inbox.)\n\nWarren Buffett is taking a third major step in his multi-year plan to gradually step away from Berkshire Hathaway, the formerly troubled Massachusetts textile manufacturer he took control of in 1965 and lovingly built over six decades into one of the world's most valuable companies.\n\nBut even after just turning 96, he is still not leaving altogether, as he continues to do everything he can to make sure Berkshire retains the core values he built into it even after he does say goodbye for good.\n\nFirst, over many years, he allowed Berkshire veteran Greg Abel, the CEO-designate, to handle Berkshire's many operating companies.\n\nThen, in May of 2025, he announced he would step down as CEO at the end of the year but remain chairman , with Abel taking over as chief executive.\n\nNow, as we reported in a special edition of the newsletter Friday morning , he is stepping down as chairman but will remain on the company's board of directors as \"chairman emeritus\" to \" continue to offer his valued judgment and perspective .\"\n\nAnd, very importantly, \"consistent with the company's long-standing succession plan,\" his son, Howard, will become chairman.\n\nAs Buffett wrote in a letter to shareholders, Howard's primary responsibility will be to \"guard [Berkshire's] culture and values \u2013 both worth more than anything on our balance sheet.\"", "source": "CNBC Top News", "pub_date_str": "19 Sep 2026, 06:13 PM IST", "pub_date_relative": "48m ago"}, {"title": "Assam's revised ATISIS gives major boost to GTAC-linked CTC exports", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Agriculture \u203a Assam's revised ATISIS gives major boost to GTAC-linked CTC exports The Economic Times daily newspaper is available online now. Read Today's Paper Assam's revised ATISIS gives major boost to GTAC-linked CTC exports SECTIONS Assam's revised ATISIS gives major boost to GTAC-linked CTC exports By Bikash Singh , ET Bureau Last Updated: Sep 19, 2026, 06:12:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Assam's updated tea incentive scheme introduces exciting export benefits designed to enhance the quality of CTC tea. The initiative promises a Rs 3 per kg bonus for single-origin Assam tea exports and significantly boosts subsidies for Orthodox and Specialty tea production. Additionally, improved working capital assistance is provided, with Matcha tea now part of the program, aiming to fortify Assam's tea exports and the Guwahati auction platform.\n\nHas the US Fed and AI created a costlier world? And has the queue got longer for India?\n\nA different kind of buyback. Is this the beginning of these kinds of buybacks?\n\nCome January 2027, will India\u2019s online platforms get their own Tukaram?\n\nFour rules made HDFC Bank a compounder. All four have stopped. Can the new CEO rewrite them?\n\nGold rush on Dalal St as regional jewellers bid to be the next Tanishq\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers", "source": "Economic Times Economy", "pub_date_str": "19 Sep 2026, 06:12 PM IST", "pub_date_relative": "50m ago"}, {"title": "Hanuman Ansh Box Office Collection Day 44: Spiritual Drama Inches Closer To Rs 300 Crore", "full_content": "The latest Day 44 figures show that the film continues to draw audience even in its seventh week.", "source": "NDTV Profit", "pub_date_str": "19 Sep 2026, 06:10 PM IST", "pub_date_relative": "52m ago"}], "cfa": [{"title": "Renting in The Villages Costs Less Than Owning and the Owners Are Starting to Notice", "full_content": "Skip to navigation Skip to main content Skip to right column Renting in The Villages Costs Less Than Owning and the Owners Are Starting to Notice David Beren Sat, September 19, 2026 at 6:20 AM MST 5 min read Quick Read Owning a $400,000 Villages home costs owners roughly 4.5% annually in forgone investment income alone, before taxes, insurance, or CDD bond payments.\n\nAnnual rentals run between $2,200 and $3,000 a month, but renting beats owning only for stays under eight years once all costs are counted.\n\nA 75-year-old facing a forced sale in a narrow buyer pool at 3.98 million existing home sales risks losing the flexibility a lease ending provides.\n\nTwo retirees, same $1 million, same 4% rule, buy one finished with $1.4 million, the other hit $0 in 12 years. Our free reader guide explains the flaw that separated them, and the income-first method built to avoid it.\n\nAt the end of the day, renting versus buying in The Villages comes down to one thing: math. More owners are running the numbers and finding that renting wins on the spreadsheet, so here is what the comparison actually looks like when every line is filled in.\n\nStart with a comparable two-bedroom designer or courtyard villa in the mid-priced range. Current asking prices cluster in the $350,000 to $450,000 band, but the purchase price is only the entry ticket. Almost every lot includes a bond obligation: the CDD infrastructure debt that funded streets, drainage, and utilities. Remaining balances typically run $10,000 to $40,000 depending on section and vintage, amortized on the annual tax bill at rates often in the 5% to 6% range with terms that can stretch decades.\n\nThe amenity fee, contractually adjustable by CPI, currently sits near $200 a month and escalates annually. With headline CPI running from 308.417 in January 2024 to 334.980 in August 2026, that clause has been active.", "source": "Yahoo Finance", "pub_date_str": "19 Sep 2026, 06:50 PM IST", "pub_date_relative": "12m ago", "cfa_topics": ["Economics", "Fixed Income", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Is Markel the New Berkshire Hathaway Blueprint for Value Investors Post-Buffett?", "full_content": "Skip to navigation Skip to main content Skip to right column Is Markel the New Berkshire Hathaway Blueprint for Value Investors Post-Buffett? Trey Thoelcke Sat, September 19, 2026 at 6:15 AM MST 4 min read BRK-B MKL Quick Read Markel mirrors Berkshire's three-engine model of insurance, equities, and operating businesses, with $18.84 billion in float and $429.5 million in 2025 buybacks, but its $22 billion market cap makes it a fundamentally different species.\n\nMarkel's combined ratio improved to 94.6% in 2025, yet shares are down 17% year to date while trailing Berkshire's 10-year return by 155 percentage points.\n\nThree signals determine the Markel thesis: whether the combined ratio holds in the low 90s, buybacks sustain pace, and Markel Ventures remains inside the group.\n\nJust released. Our analysts combed the entire stock market and named the ten best stocks to buy right now, and Berkshire Hathaway didn't make the cut. Enter your email to see the names that beat BRK-B. The report is free. Enter your email and see if any of your stocks made the cut.\n\nWarren Buffett has stepped down as board chair of Berkshire Hathaway, with Greg Abel now running the company. The handoff has revived a question value investors have batted around for a decade: with the Oracle off the field, is Markel Group ( NYSE:MKL ) the closest thing left to early Berkshire Hathaway ( NYSE:BRK-B )?\n\nMarkel runs the same three-engine model: specialty insurance underwriting, a public equity portfolio, and wholly owned operating businesses inside Markel Ventures. It pays no dividend and returns capital through buybacks. CEO Tom Gayner told investors on the July 30, 2026, call that \"We continue to work on building the system designed to relentlessly compound your capital.\" Insurance float, the fuel for compounding, expanded to $18.84 billion in 2025. Buybacks totaled $429.5 million in 2025, cutting the share count to 12.4 million by mid-2026.\n\nScale is the first wall.", "source": "Yahoo Finance", "pub_date_str": "19 Sep 2026, 06:45 PM IST", "pub_date_relative": "17m ago", "cfa_topics": ["Quantitative Methods", "Corporate Issuers", "Equity Investments", "Portfolio Management"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "History Says This Investment Strategy Can Build a $1 Million Portfolio. Here's How.", "full_content": "Skip to navigation Skip to main content Skip to right column History Says This Investment Strategy Can Build a $1 Million Portfolio. Here's How. David Dierking, The Motley Fool Sat, September 19, 2026 at 6:14 AM MST 3 min read ^GSPC NVDA The idea of building a $1 million portfolio might sound more daunting than climbing Mt. Everest. In reality, it's more achievable than you probably think. With enough time, discipline, and the right mix of investments, the long-term power of compounding can get you to the $1 million mark and beyond!\n\nJust take a look at history. If you invested $10,000 in the S&P 500 (SNPINDEX: ^GSPC) at the beginning of 1996, it would have grown to roughly $214,000 with dividends reinvested. Now, that's clearly not $1 million, but that's how large it grew with a one-time investment. Imagine how big it could get if you added a modest monthly investment to it over all those years.\n\nMissed AI's \"Act 1\"? Act 2 Could Be 15x Bigger. Most investors think they missed the AI boat because they didn't buy Nvidia in 2005. But according to our analysts, we're only at the end of \"Act 1\"\u2014the R&D phase. \"Act 2\" is the global rollout. Continue \u00bb\n\nThis is why the idea of regular, consistent investing over time is one of the best pathways to millionaire status.\n\nOver the past century, the S&P 500 has returned around 10% annually. The index has performed much better than that over the past decade, but the next decade could very well be much worse. When projecting long-term returns, it's better to be a little more conservative.\n\nLet's assume that an investor earns an 8% average annual return and chooses to make regular monthly investments via a 401(k) or another systematic investing plan. Assuming they're starting from zero, here's approximately how much it would take over time to accumulate $1 million.\n\nData source: Investor.gov.", "source": "Yahoo Finance", "pub_date_str": "19 Sep 2026, 06:44 PM IST", "pub_date_relative": "18m ago", "cfa_topics": ["Quantitative Methods", "Equity Investments", "Portfolio Management"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "MS NOW journalists blocked from White House after Trump bans three media outlets", "full_content": "Journalists from MS NOW were denied access to the White House grounds early Saturday, one day after President Donald Trump said he is banning three media outlets \u2014 MS NOW, CNN and Politico \u2014 over their coverage of him.\n\n\"Earlier this morning MS NOW journalists were denied access to the White House grounds,\" MSN said in a statement. \"The White House belongs to the American people and the decisions made inside are funded by our tax dollars. MS NOW intends to take any and all steps necessary to defend our First Amendment rights and the essential role of independent journalism in our democracy.\" MS NOW said it will \"continue to report on the President, the administration, and the issues that impact the American people.\"\n\nOn Friday, Trump said in a Truth Social post that those outlets \"shouldn't be able to constantly write or report FICTION and LIES when they're covering the President of the United States, the Trump Administration, or the United States of America.\"\n\nLater that day, in the Oval Office, the president said he was imposing the ban in response to \"cumulative stories\" by the three outlets.\n\nIn 2018, Trump's White House briefly tried to suspend a CNN reporter's press pass, and it is currently being sued over an attempted ban of Associated Press journalists from certain spaces.\n\nTrump said Friday that the effort to bar news outlets is worthwhile, even if it does not hold up in court.\n\n\"I think it's good to point it out whether it survives or doesn't,\" Trump said.\n\n\u2014 CNBC's Kevin Breuninger and Dan Mangan contributed to this report.", "source": "CNBC Top News", "pub_date_str": "19 Sep 2026, 06:41 PM IST", "pub_date_relative": "21m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "The S&P 500 just logged another losing week, yet these stocks could be due for a bounce", "full_content": "Another losing week has dragged certain individual stocks to levels where they might find some support.", "source": "CNBC Top News", "pub_date_str": "19 Sep 2026, 06:32 PM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Motorola Solutions Eyes Defense, Drone Security Growth as Silvus Scales", "full_content": "Skip to navigation Skip to main content Skip to right column Motorola Solutions Eyes Defense, Drone Security Growth as Silvus Scales MarketBeat Sat, September 19, 2026 at 6:02 AM MST 6 min read MSI Key Points Interested in Motorola Solutions, Inc.? Here are five stocks we like better.\n\nMotorola Solutions expects broad-based growth , projecting 2026 gains of 10%\u201311% in mission-critical networks, about 11% in video security and about 15% in command-center software, supported by modernization of public-safety and federal infrastructure.\n\nSilvus Technologies is becoming a major defense growth driver , with approximately $850 million in expected 2026 sales at current capacity. Motorola is expanding production, sales and R&D as demand grows for secure communications in contested environments and unmanned-systems operations.\n\nD-Fend Solutions expands Motorola's counter-drone opportunity in public safety, airports, critical infrastructure and venues. The business was selected for a $1.5 billion U.S. Department of Homeland Security grant program and uses cyber-based technology to take control of and safely land threatening drones.\n\nMotorola Solutions (NYSE:MSI) is focused on executing across its mission-critical networks, command center software and video security businesses while scaling its recently acquired Silvus Technologies and D-Fend Solutions operations, Chief Operating Officer Jack Molloy said at a Truist conference.\n\nMolloy described Motorola Solutions as a provider of public-safety, enterprise-security and defense-security solutions.", "source": "Yahoo Finance", "pub_date_str": "19 Sep 2026, 06:32 PM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "What Will $5,000 Invested in Palantir Stock Be Worth in 5 Years?", "full_content": "Skip to navigation Skip to main content Skip to right column What Will $5,000 Invested in Palantir Stock Be Worth in 5 Years? Vandita Jadeja Sat, September 19, 2026 at 6:00 AM MST 5 min read PLTR Quick Read PLTR trades near $176 and a $5,000 stake could grow to $8,162 in the bull case or fall to $4,629 in the bear case by 2031.\n\nPalantir posted 93% revenue growth in Q2 2026, raised full-year guidance to $8.15 billion, and hit a Rule of 40 score of 155.\n\nA P/E near 250 and beta of 1.6 mean any growth stumble or government budget shift could rapidly compress the stock toward the bear case.\n\nJust released. Our analysts combed the entire stock market and named the ten best stocks to buy right now, and Palantir didn't make the cut. Enter your email to see the names that beat PLTR. The report is free. Enter your email and see if any of your stocks made the cut.\n\nPalantir Technologies ( NASDAQ:PLTR ) has become one of the most closely watched names in enterprise AI, riding a wave of sovereign-AI demand that pushed U.S. commercial revenue up 149% year-over-year in the second quarter of 2026.\n\nAt a recent price of $175.91, the question for investors putting a fresh $5,000 to work is simple: what could that stake realistically look like five years out, if the modeled trajectory holds?\n\nUnder the five-year base case, PLTR shares are modeled to reach $217.44, a total return of 23.62% or roughly 4.33% annualized. Plugged into a starting stake, a $5,000 investment could be worth about $6,181 at the five-year mark.\n\nThe modeled per-share target sits below the current $196.84 analyst consensus target, reflecting a valuation methodology that blends trailing P/E, forward P/E, and analyst targets with a proprietary factor score. Model confidence on the projection is high at 0.9, and the current recommendation reads hold based on a 3.55% reported upside to fair value.", "source": "Yahoo Finance", "pub_date_str": "19 Sep 2026, 06:30 PM IST", "pub_date_relative": "32m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Every New Reactor Needs Fuel: 3 Uranium Stocks Positioned for the Nuclear Buildout", "full_content": "Skip to navigation Skip to main content Skip to right column Every New Reactor Needs Fuel: 3 Uranium Stocks Positioned for the Nuclear Buildout Joel South Sat, September 19, 2026 at 6:00 AM MST 8 min read NXE NXE UEC DNN Quick Read UEC holds $488M cash with zero debt and actual uranium production; NXE's 257M lb Arrow deposit draws 16 unanimous analyst buy ratings averaging $19.\n\nUtilities are structurally short contracted uranium pounds, and the last US mine permitting took 14 years, which helps explain why in-ground resources command extreme revenue multiples.\n\nDenison's Phoenix is Canada's first uranium mine approved for construction in 20 years, with 8M+ lbs already contracted and first production targeted for mid-2028.\n\nJust released. Our analysts combed the entire stock market and named the ten best stocks to buy right now, and NexGen Energy didn't make the cut. Enter your email to see the names that beat NXE. The report is free. Enter your email and see if any of your stocks made the cut.\n\nUranium mining is the narrow end of the funnel feeding the AI-driven reactor buildout. On April 23, the U.S. Department of Energy launched the Nuclear Dominance 3x33 campaign to secure the domestic nuclear fuel supply chain and support future reactor deployment, and utilities are staring at a widening long-term supply gap while a Russian enriched-uranium ban takes hold.\n\nThis edition covers the smaller, earlier-stage end of the mining chain: three US-listed junior and development-stage miners. Every one of them is speculative and belongs, if anywhere, in a small allocation. None has the cash-flow profile of a regulated utility or a mature producer. Before the tickers, a definitional refresher: a resource estimate is a geological inventory, a reserve is the economically mineable subset of that resource, a permitted project has regulatory approval but may not be built and an operating mine actually produces pounds and books revenue.", "source": "Yahoo Finance", "pub_date_str": "19 Sep 2026, 06:30 PM IST", "pub_date_relative": "32m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Warsh\u2019s Fed shows it\u2019s serious about taming inflation. Why Wall Street now believes it.", "full_content": "After more than five years of failing to do so, Federal Reserve leaders think they can shrink the rate of inflation to 2% by 2029 with just slightly higher U.S. interest rates. Are they serious?", "source": "MarketWatch Top Stories", "pub_date_str": "19 Sep 2026, 06:30 PM IST", "pub_date_relative": "32m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "8th pay commission: DA merger, fitment factor, allowances \u2014 Components in focus for salary hike, explained", "full_content": "Constituted every decade, pay commissions aim to discuss and decide on possible changes to emoluments for central government employees and pensioners. Assembled last year, the 8th Central Pay Commission (CPC) in is in its consultation stage, with plans to engage with employee and pensioner associations, federations, and unions of central government, UT employees, and other stakeholders across the country.\n\nMost recently, it conducted meetings in Chandigarh , Chennai and Puducherry and has scheduled a state visit to Bengaluru in the next month. These unions and groups collectively represent a large number of employees and pensioners, including defence and railway staff. And the meetings are significant as discussions with representatives are expected to play an important role in shaping the commission's deliberations.\n\nWhen it comes to likely salary hike, the conservative estimate is for a 20-30% jump in the 8th CPC, while the moderate estimate is for a 30-50% hike, and the high-end estimate is for an optimistic 80+% salary increase.\n\nNotably, Terms of Reference ( ToR ). approved by the Union Cabinet last year, define the commission's scope of work and specifies the areas on which it must make recommendations. This includes examining and recommending changes that are desirable and feasible in the emoluments, including pay, allowances, other facilities/benefits, in cash or kind having regard to rationalisation, contemporary functional requirements and specialised needs.\n\nThus, during official meetings, the commission is examining updates to the salary structure and various components, including:\n\nFurther, till July, the commission also sought data and suggestions from employee groups and unions, pensioner representatives and other stakeholders.", "source": "LiveMint Money", "pub_date_str": "19 Sep 2026, 06:29 PM IST", "pub_date_relative": "33m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Amgen or Merck: Which Drugmaker Has the Stronger Dividend Growth Story?", "full_content": "Skip to navigation Skip to main content Skip to right column Amgen or Merck: Which Drugmaker Has the Stronger Dividend Growth Story? Chris Lange Sat, September 19, 2026 at 5:55 AM MST 5 min read MRK AMGN Quick Read Amgen (AMGN) yields 2.6% with a $10.08 annualized payout, topping Merck (MRK) at 2.29%, and has raised its dividend 6% annually versus Merck's smaller step-ups.\n\nAmgen's 17 billion-dollar products and $3.5B quarterly free cash flow dwarf Merck's reliance on a single Keytruda franchise facing peak penetration.\n\nMerck absorbed a $5.7B acquisition charge that pushed Q2 earnings to a loss, while Amgen raised 2026 EPS guidance to as high as $23.50.\n\nJust released. Our analysts combed the entire stock market and named the ten best stocks to buy right now, and Merck didn't make the cut. Enter your email to see the names that beat MRK. The report is free. Enter your email and see if any of your stocks made the cut.\n\nFor a retirement portfolio that leans on pharma dividends, the choice between Amgen ( NASDAQ:AMGN ) and Merck ( NYSE:MRK ) comes down to one question: which check is more likely to keep getting bigger through the next wave of patent expirations? Both companies deliver quarterly income today. Only one has the coverage, the growth cadence, and the portfolio breadth to keep raising through the cliff.\n\nAmgen pays a quarterly dividend of $2.52 per share, an annualized forward payout of $10.08. At $385.28, that lands at a yield of roughly 2.6%. Merck pays $0.85 quarterly, or $3.40 annualized, and at $146.65 yields 2.29%.\n\nOn starting yield, Amgen wins. It is not a wide gap, but for a retiree sizing positions to hit an income target, the difference compounds. An investor putting $100,000 to work today gets meaningfully more current cash from AMGN, and the gap holds even after Merck's 85.17% one-year rally compressed its yield. Winner: Amgen.\n\nBoth boards raise annually, and both raised again this year. The verified quarterly progression tells the story.", "source": "Yahoo Finance", "pub_date_str": "19 Sep 2026, 06:25 PM IST", "pub_date_relative": "37m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Fixed Income", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Is Micron's 9% Dip a Warning Sign or Buying Opportunity?", "full_content": "Skip to navigation Skip to main content Skip to right column Is Micron's 9% Dip a Warning Sign or Buying Opportunity? Catie Hogan, The Motley Fool Sat, September 19, 2026 at 5:55 AM MST 2 min read MU NVDA SKHY 005930.KS What comes up must come down? Maybe, but maybe not. Shares of Micron (NASDAQ: MU) dropped more than 9% over the past week, rattling investors accustomed to Micron shares only going north. The pullback wasn't due to anything Micron said or did, but rather to a mix of uncertainty and fears about AI regulation and the slowing pace of its development.\n\nMicron, along with rivals SK Hynix and Samsung , controls almost 90% of the global DRAM market. The demand for memory is unprecedented; these three companies control the vast majority of supply, and thus have pricing power. While there hasn't been antitrust scrutiny yet, this is another concern in the longer term.\n\nMissed Nvidia in 2009? This Rare Signal Is Flashing Again. In 2009, a \"Double Down\" signal flashed for a little-known chipmaker called Nvidia. For the first time in years, that same \"Total Conviction\" signal is flashing for a company 1/100th the size of Nvidia. Continue \u00bb\n\nUltimately, these fears feel a bit more panicky than based on the current reality, though. Micron's memory supply is sold out through 2026 and is nearly sold out for 2027. The company has said it can only meet a portion of customer demand in the medium term. This means that any AI-related slowdown is unlikely to affect Micron until at least 2028, if at all.\n\nMemory chips are in a supercycle, unlike the memory cycles that came before it. It may eventually end if supply can catch up with demand, but until then, this dip looks less like a warning sign and more like a chance to buy the stock at a slightly lower price. The AI infrastructure build-out is still in a very early stage, and Micron has a firm grip on market share.\n\nShares of Micron are still up more than 225% in 2026 and 485% over the past 12 months.", "source": "Yahoo Finance", "pub_date_str": "19 Sep 2026, 06:25 PM IST", "pub_date_relative": "37m ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Consumer sentiment is in the dumps despite a solid economy. Goldman Sachs blames 'lower happiness'", "full_content": "Goldman Sachs identified a potential culprit for sour consumer sentiment readings: A decline in happiness.\n\nThe consumer sentiment index tracked by the University of Michigan hit record lows this year. The index fell 13% year over year in September, due to a drop of almost 8% from August alone.\n\nEconomists have widely questioned why sentiment has remained depressed since the Covid pandemic, even as the economy hummed along on paper. Goldman economist Joseph Briggs told clients this week that the downward pressure may stem from broader pessimism in society.\n\n\"Low reported economic sentiment likely reflects a more fundamental, downbeat assessment of the state of the world rather than the economy,\" Briggs wrote to clients.\n\nTo be sure, Briggs said inflationary pressures are likely also hurting confidence. But he said \"lower happiness\" at large can partially explain the continued disconnect between sentiment and other measures of the economy's performance, such as gross domestic product growth or stock market performance, that offer rosier views.\n\nBriggs pointed to data from the University of Chicago's General Social Survey illustrating how happiness never fully recovered from a drop during the pandemic. The share of respondents feeling \"very happy\" fell to 23% in 2024 from 31% in 2016, survey data shows. The percentage reporting responses of \"not too happy\" rose from 13% to 20% over the same period, per the data.\n\nOverall happiness saw a sharper decline than the perception of financial satisfaction also tracked in the survey, according to Briggs' analysis of the data.\n\nBriggs isn't the only economist pointing the finger at declining happiness readings. Joanne Hsu, the director of Michigan's survey, told CNBC earlier this year that the downtrend in sentiment mirrors readings showing both decreasing happiness and trust in public institutions.", "source": "CNBC Top News", "pub_date_str": "19 Sep 2026, 06:20 PM IST", "pub_date_relative": "41m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "John Ternus's First iPhone Launch Prompted a Bank of America Price Target Cut. Is Apple Stock a Buy?", "full_content": "Skip to navigation Skip to main content Skip to right column John Ternus's First iPhone Launch Prompted a Bank of America Price Target Cut. Is Apple Stock a Buy? Chris Neiger, The Motley Fool Sat, September 19, 2026 at 5:50 AM MST 4 min read AAPL NVDA John Ternus recently hosted his first iPhone event as Apple (NASDAQ: AAPL) CEO, and following the debut of the new iPhone 18 Pro and Pro Max, as well as the company's first foldable iPhone Duo.\n\nBank of America analyst Wamsi Mohan reiterated his buy rating for Apple stock following the event, but cut his price target to $370, down from $380 previously.\n\nMissed AI's \"Act 1\"? Act 2 Could Be 15x Bigger. Most investors think they missed the AI boat because they didn't buy Nvidia in 2005. But according to our analysts, we're only at the end of \"Act 1\"\u2014the R&D phase. \"Act 2\" is the global rollout. Continue \u00bb\n\nWhile Mohan is generally bullish on Apple, he said the iPhone 18 Pro and Pro Max weren't priced as high as he expected. That could mean more phones are sold, but at lower margins.\n\nHere's why the new iPhone 18 Pro and Pro Max prices matter for Apple amid rising memory costs, and why Apple stock is still a buy.\n\nThe main reason Mohan lowered Apple's price target came after the new iPhone prices were revealed.\n\nThe iPhone 18 Pro starts at $1,199, and the Pro Max starts at $1,299 -- $100 higher than the previous generation -- but below Mohan's estimated price increase for each device.\n\nApple is dealing with a surge in memory prices, as demand for memory processors for data centers has pushed costs higher. Apple raised its Mac prices earlier this year in response, and the new iPhone 18 Pro and Pro Max prices reflect Apple's attempts to offset the rising prices.", "source": "Yahoo Finance", "pub_date_str": "19 Sep 2026, 06:20 PM IST", "pub_date_relative": "42m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Aflac\u2019s (AFL) Net Earnings Jumped 37.7%, Yet Adjusted Earnings Actually Fell", "full_content": "Skip to navigation Skip to main content Skip to right column Aflac\u2019s (AFL) Net Earnings Jumped 37.7%, Yet Adjusted Earnings Actually Fell Maham Fatima Sat, September 19, 2026 at 5:45 AM MST 4 min read AFL On August 6, Aflac (NYSE: AFL ) reported second-quarter numbers that point in opposite directions. Net earnings climbed to $825 million, helped along by investment losses that shrank to $153 million from $421 million a year ago. Adjusted earnings, though, fell 7.7% to $883 million. Both numbers are real, but they answer different questions. Which measure you trust changes the story, so here is what sits underneath.\n\nStart with the yen, because it is muddying the picture. The average rate was 159.45 to the dollar, 9.3% weaker than a year earlier, and that cost adjusted earnings $0.05 a share. Take the currency out of the first half and adjusted earnings per share rose 4.1% to $3.57. Japan is also running more profitably. Its pretax adjusted margin widened to 34.3% from 32.0% as claims took a smaller bite out of premiums, and yen-based pretax adjusted earnings rose 3.4%. So part of the decline in Japan's dollar-reported profit is currency, not operations.\n\nThe US business is still growing at the top line. Net earned premiums rose 2.3% to $1.5 billion, and sales climbed 2.6% to $349 million, led by group voluntary benefits along with dental and vision plans. In Japan, the refreshed Tsumitasu life policy and the new Anshin Palette medical product grew strongly in the quarter, and first-half sales rose 7.0% to \u00a537.3 billion. Then there is the cash. Aflac returned $1.3 billion to shareholders in the quarter, $983 million of it through buybacks, and declared a $0.61 third-quarter dividend, payable September 1 to holders of record on August 19, 2026. Management notes 43 straight years of dividend increases through 2025 and says the board is on a path to extend that in 2026.\n\nThe catch is that Japan's profit gains came from lower claims, not a bigger business.", "source": "Yahoo Finance", "pub_date_str": "19 Sep 2026, 06:15 PM IST", "pub_date_relative": "46m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Buffett takes next step in plan to keep Berkshire from straying", "full_content": "(This is the Warren Buffett Watch newsletter, news and analysis on all things Warren Buffett and Berkshire Hathaway. You can sign up here to receive it every Friday evening in your inbox.)\n\nWarren Buffett is taking a third major step in his multi-year plan to gradually step away from Berkshire Hathaway, the formerly troubled Massachusetts textile manufacturer he took control of in 1965 and lovingly built over six decades into one of the world's most valuable companies.\n\nBut even after just turning 96, he is still not leaving altogether, as he continues to do everything he can to make sure Berkshire retains the core values he built into it even after he does say goodbye for good.\n\nFirst, over many years, he allowed Berkshire veteran Greg Abel, the CEO-designate, to handle Berkshire's many operating companies.\n\nThen, in May of 2025, he announced he would step down as CEO at the end of the year but remain chairman , with Abel taking over as chief executive.\n\nNow, as we reported in a special edition of the newsletter Friday morning , he is stepping down as chairman but will remain on the company's board of directors as \"chairman emeritus\" to \" continue to offer his valued judgment and perspective .\"\n\nAnd, very importantly, \"consistent with the company's long-standing succession plan,\" his son, Howard, will become chairman.\n\nAs Buffett wrote in a letter to shareholders, Howard's primary responsibility will be to \"guard [Berkshire's] culture and values \u2013 both worth more than anything on our balance sheet.\"", "source": "CNBC Top News", "pub_date_str": "19 Sep 2026, 06:13 PM IST", "pub_date_relative": "48m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Assam's revised ATISIS gives major boost to GTAC-linked CTC exports", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Agriculture \u203a Assam's revised ATISIS gives major boost to GTAC-linked CTC exports The Economic Times daily newspaper is available online now. Read Today's Paper Assam's revised ATISIS gives major boost to GTAC-linked CTC exports SECTIONS Assam's revised ATISIS gives major boost to GTAC-linked CTC exports By Bikash Singh , ET Bureau Last Updated: Sep 19, 2026, 06:12:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Assam's updated tea incentive scheme introduces exciting export benefits designed to enhance the quality of CTC tea. The initiative promises a Rs 3 per kg bonus for single-origin Assam tea exports and significantly boosts subsidies for Orthodox and Specialty tea production. Additionally, improved working capital assistance is provided, with Matcha tea now part of the program, aiming to fortify Assam's tea exports and the Guwahati auction platform.\n\nHas the US Fed and AI created a costlier world? And has the queue got longer for India?\n\nA different kind of buyback. Is this the beginning of these kinds of buybacks?\n\nCome January 2027, will India\u2019s online platforms get their own Tukaram?\n\nFour rules made HDFC Bank a compounder. All four have stopped. Can the new CEO rewrite them?\n\nGold rush on Dalal St as regional jewellers bid to be the next Tanishq\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers", "source": "Economic Times Economy", "pub_date_str": "19 Sep 2026, 06:12 PM IST", "pub_date_relative": "50m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Corporate Issuers", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Cencora (COR) Raised Guidance and Bought Back $1B. What\u2019s the Catch?", "full_content": "Skip to navigation Skip to main content Skip to right column Cencora (COR) Raised Guidance and Bought Back $1B. What\u2019s the Catch? Maham Fatima Sat, September 19, 2026 at 5:38 AM MST 4 min read COR On August 5, Cencora (NYSE: COR ) reported results for its fiscal third quarter, which closed on June 30, and the headline numbers looked clean. Revenue rose 5.1% to $84.8 billion, adjusted earnings per share climbed 12.0% to $4.48, and management raised its full-year adjusted EPS outlook to $17.75 to $17.95. The company also repurchased $1 billion of its own stock during the quarter. But the profit story has moving parts, and a few of them pull in opposite directions.\n\nStart with the gap between profit growth and sales growth. Adjusted operating income rose 17.0% while revenue grew only 5.1%. Much of the help came from gross profit, which jumped 23.2% on an adjusted basis as both segments contributed and the OneOncology acquisition in February lifted margins in the US business. In plain terms, adjusted gross margin widened 61 basis points to 4.16%, so the company keeps more gross profit from every dollar it sells.\n\nThe strength was not confined to one corner, either. US Healthcare Solutions grew operating income 15.9% on higher pharmaceutical sales and the OneOncology deal, while specialty volume to health systems and physician groups lifted its revenue. International Healthcare Solutions did better still, with operating income up 20.8% on strength in European distribution and global specialty logistics. Management also put cash to work, completing in one quarter the $1 billion of buybacks it had expected to finish by the close of calendar 2026. The board declared a $0.60 quarterly dividend as well, payable August 31, to holders of record on August 14.\n\nGrowth is costing more than it first appears. Adjusted operating expenses jumped 26.8%, faster than adjusted gross profit, because OneOncology brought expenses along with its profits.", "source": "Yahoo Finance", "pub_date_str": "19 Sep 2026, 06:08 PM IST", "pub_date_relative": "54m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "India-New Zealand FTA Nears Implementation, Seen as Potential Global Trade Beacon: Minister Todd McClay", "full_content": "India-New Zealand FTA is expected to take effect within a month, offering Indian exporters zero-tariff access to New Zealand. The pact aims to boost trade, investment, travel and education, with bilateral trade targeted at NZ$7 billion by 2030.", "source": "NDTV Profit", "pub_date_str": "19 Sep 2026, 06:08 PM IST", "pub_date_relative": "54m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "CLARITY Act Setback 'Not Major' As Crypto Stocks Tumble 10%: What's Next For The Industry?", "full_content": "Despite heavy losses in crypto-linked stocks, expert believes the Senate vote for the CLARITY Act was not a major setback.", "source": "NDTV Profit", "pub_date_str": "19 Sep 2026, 06:06 PM IST", "pub_date_relative": "55m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}], "updated_at": "19 Sep 2026, 07:02 PM IST", "total_stories": 390};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>

</body>
</html>
