ancial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Q2 results effect? Small-cap stock under \u20b950 MIC Electronics rises 3% despite weak market trends. Do you own?", "full_content": "Vaamanaa Sethi Published 9 Nov 2026, 12:05 PM IST Prefer Livemint on Google Small-cap stock under \u20b9 50 : MIC Electronics shares rose as much as 2.71% in Monday's trading session, defying weak sentiment on Dalal Street. The small-cap stock opened in green at \u20b9 40.96 apiece on BSE today, as compared to the previous close of \u20b9 40.19 on Sunday's Muhurat Trading and touched an intraday high of \u20b9 41.64 on 9 November.\n\nMIC Electronics share price hit a 52-week high of \u20b9 57.60 per share on 8 November (Muhurat Trading day).\n\nThe stock rally came in after the company reported its financial results for the quarter ending on 30 September 2026.\n\nMeanwhile, Indian equity benchmark indices Sensex and Nifty opened lower on Monday, weighed down by selling pressure in heavyweight IT stocks and profit-booking following the recent sharp rally in the domestic stock market. The 30-share BSE Sensex fell 93.95 points to 80,919.19 in early trade, while the 50-share NSE Nifty declined 30 points to 24,968.80.\n\nMIC Electronics reported a strong financial performance for the September quarter of FY27, with its consolidated revenue from operations surging 140.2% year-on-year (YoY) to \u20b9 91.01 crore, compared with \u20b9 37.89 crore in the corresponding quarter last year.\n\nTotal income also increased to \u20b9 91.47 crore in Q2 FY27 from \u20b9 38.42 crore in Q2 FY26.\n\nThe company's operating performance improved during the quarter, with EBITDA (earnings before interest, taxes, depreciation and amortisation) rising 70.1% YoY to \u20b9 6.48 crore, against \u20b9 3.81 crore in the year-ago period.\n\nMIC Electronics' profit before tax (PBT) more than doubled to \u20b9 4.60 crore in Q2 FY27, compared with \u20b9 2.17 crore in Q2 FY26. The company reported a similar increase in its net profit, with profit after tax (PAT) rising 112% YoY to \u20b9 4.60 crore from \u20b9 2.17 crore in the corresponding quarter of the previous financial year.", "source": "LiveMint Markets", "pub_date_str": "09 Nov 2026, 12:05 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Coal India, IOCL, Vedanta to BPCL: What dividends mean for the Indian stock market amid bull trend buzz? Experts decode", "full_content": "COALINDIA BPCL IOC ONGC Asit Manohar Published 9 Nov 2026, 12:04 PM IST Prefer Livemint on Google Dividend stocks 2026: Amid high volatility in the Indian stock market throughout the year, dividend stocks, especially PSU energy stocks Coal India Ltd, Bharat Petroleum Corporation Ltd (BPCL), Indian Oil Corporation Ltd (IOCL), Oil and Natural Gas Corporation (ONGC), etc., remained in the news for announcing cash rewards for their eligible shareholders in the form of dividends. In the year 2026, Coal India Ltd has given away dividends on four occasions, and the net dividend paid by the energy PSU is \u20b9 26.50 per share. BPCL has announced a \u20b9 10 per share dividend for 2026, whereas IOCL's dividend is \u20b9 3.25 per share, and ONGC's dividend for 2026 is \u20b9 7.25 per share. It should be noted that ONGC will trade ex-dividend on 12 November 2026 to finalise the list of eligible shareholders for the dividend, which is yet to be announced. The PSU energy stocks are expected to have a dividend yield in the 5% to 7% range in 2026.\n\nAccording to stock market experts, dividend payments are cash distributions, indicating that the company has cash reserves. Amid volatile Indian markets, we saw energy, IT, and financial companies leading the way by announcing dividends to their shareholders. They said that dividend-paying stocks are popular among retail investors, but they are equally popular among institutional investors because dividends provide steady income beyond the stock's rally.\n\nDecoding the dividends pay hike by the energy PSUs in 2026, Avinash Gorakshkar, Founder of Avinash Mentor Research, said, \u201cDividend-paying companies are those that have huge cash reserves. That's why we see PSUs, banking and IT companies leading the list in dividend payouts.", "source": "LiveMint Markets", "pub_date_str": "09 Nov 2026, 12:04 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Fixed Income", "Alternative Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "IRB Infra shares surge 6% after Q2 results: Is a bigger breakout on the cards? Stock market experts identify key levels", "full_content": "Dhanya Nagasundaram Published 9 Nov 2026, 11:53 AM IST Prefer Livemint on Google IRB Infrastructure Developers shares jumped over 6% on Monday, 9 November, extending their gains for the second consecutive trading session following the company's Q2 FY27 results.\n\nThe infrastructure company reported an 84.85% year-on-year (YoY) increase in consolidated net profit to \u20b9 260.15 crore for the September quarter of FY27, compared with \u20b9 141 crore in the corresponding period last year. The growth was driven by robust toll revenue and distributions from its Infrastructure Investment Trust (InvIT), according to the company's regulatory filing.\n\nTotal income for the July-September quarter increased to \u20b9 18,970.8 crore from \u20b9 17,510.16 crore in the year-ago period.\n\nCommenting on the performance, Chairman and Managing Director Virendra D Mhaiskar said the company's Q2 FY27 results demonstrated the counter-cyclical strength and structural resilience of its business model, despite global economic deceleration, supply chain fragmentation and geopolitical volatility.\n\nHe added that toll revenue grew around 15% year-on-year, supported by resilient traffic demand and effective tariff-linking mechanisms. This also contributed to steady cash flow generation and distributions from the InvIT.\n\nIRB Group has a portfolio of 27 revenue-generating highway assets, with an aggregate value of approximately \u20b9 94,000 crore across 13 states. With around 1.5 million vehicles crossing its assets every day, the group accounts for nearly one-tenth of India's total toll revenue.\n\nIRB Infrastructure Developers share price today opened at \u20b9 17.45 apiece on the BSE; the stock touched an intraday high of \u20b9 18.47 per share and an intraday low of \u20b9 17.19 apiece.\n\nRajesh Bhosale, Technical Analyst at My Advisor Alpha, said IRB Infrastructure has witnessed strong buying interest, breaking above its September swing high and the 89-day exponential moving average (EMA).", "source": "LiveMint Markets", "pub_date_str": "09 Nov 2026, 11:53 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Alternative Investments", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Global Markets: 5 key themes to watch this week", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News Powered By Global Markets: 5 key themes to watch this week Written by Anupam Nagar , ETMarkets.com | Nov 09, 2026, 12:01:15 PM IST 1 / 7 Global markets brace for another turbulent week Global markets face a packed week as investors assess the AI-led technology selloff, US inflation data, oil price movements and geopolitical risks. Developments in Europe and Asia, along with the COP31 climate summit, will also remain in focus. (Sources: Reuters)\n\nThe Nasdaq plunged 5.5% on Thursday, marking its biggest single-day decline since April 2025 and wiping out $2.5 trillion in market value. Concerns over rising AI infrastructure costs and the prospect of tighter regulations following Democratic gains in the US midterm elections are weighing on technology stocks.\n\nInvestors will closely track Tuesday's US consumer price index (CPI) data and Friday's producer price index (PPI) numbers. The CPI is expected to rise 0.3% month-on-month, according to a Reuters poll. Markets are pricing in more than an 80% chance of another Federal Reserve rate hike in December.\n\nCrude oil prices have retreated amid expectations that US President Donald Trump could seek to de-escalate the Iran conflict following Republican losses in the midterm elections. Any fresh escalation could push energy prices higher, stoke inflation and complicate the Federal Reserve's policy outlook.\n\nEuropean markets will assess employment figures and revised third-quarter GDP data. The euro zone's preliminary GDP estimate showed 0.4% growth.", "source": "Economic Times Markets", "pub_date_str": "09 Nov 2026, 11:44 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "What the global AI rout means for India", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nOn 5 November, US technology stocks saw their worst day since April 2025. The Nasdaq composite index fell 5.5% after Democrats swept the US midterm elections, raising fears that new limits on data centres could slow AI spending. Indian stocks moved the other way. Foreign investors bought $1.6 billion of Indian shares that day, their largest one-day purchase in nearly six years, according to exchange data.\n\nAnalysts at JPMorgan and elsewhere now call India a hedge against the AI trade. However, India is not completely insulated from the risks\u2014the exposure goes beyond the stock market as it runs through equipment suppliers, IT services firms and a planned data centre build-out.\n\nIndia's appeal during the rout comes from its low exposure to AI. Companies related to AI account for about 16% of MSCI India's value, against 70-80% in Taiwan and Korea, according to Goldman Sachs. Chipmakers dominate those markets. On 6 November, South Korea's Kospi closed 6% lower as SK Hynix fell 10% and Samsung Electronics 6%, while the Nifty 50 rose about 2%.\n\nThe same low exposure hurt India earlier in the year. Its lack of AI-linked stocks kept foreign investors away, Reuters reported, and they sold a record $30 billion of Indian shares between January and October. The Kospi was still up 20% for the year on 6 November. The Nifty 50 was down about 6%.\n\nSome investors now treat that gap as protection. JP Morgan describes India as an \"AI hedge\" for funds cutting crowded AI positions. Goldman's Timothy Moe expects markets less exposed to AI, such as India, to see \"some relative outperformance\". Bernstein says India is \"neither an AI beneficiary nor an anti-AI trade\", pointing to its valuation of 18.6 times forward earnings, higher than in South Korea and Taiwan.\n\nWhile the benchmark indices rose, India's own AI-linked stocks fell with global markets.", "source": "LiveMint Markets", "pub_date_str": "09 Nov 2026, 11:37 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Up 118% in 6 months! This volume shocker pharma stock skyrockets 14% despite weak trends on Dalal Street Do you own?", "full_content": "Pharma stock rally: Shares of IOL Chemicals and Pharmaceuticals Limited rallied nearly 14% during Monday\u2019s intraday trading session after a surge in trading volume. The sharp spike in the pharmaceutical stock has come days after a 117% rally over the last six months.\n\nWhile the stock has delivered strong returns over the past few months, its recently-announced quarterly results have sparked fresh interest among investors. IOL Chemicals and Pharmaceuticals\u2019 net profit more than doubled during the second quarter of financial year 2026-27.\n\nIOL Chemicals and Pharmaceuticals share price witnessed a sharp surge in trading volume by more than 8.81 times during Monday\u2019s trading session. At 9:51 am, over 96,059 shares had changed hands during the trading session.\n\nThe company\u2019s net profit surged to \u20b9 65.03 crore in Q2FY27 against \u20b9 30 crore reported in the year ago period. Its net revenue surged to \u20b9 795.03 crore during the quarter under review against \u20b9 567.53 crore reported in Q2FY27. Its net revenue from operations stood at \u20b9 756.26 crore in Q1FY27.\n\n\u201cOur diversified business model has enabled us to sustain growth momentum amid continued geopolitical uncertainties and evolving global market conditions. Better product mix and operating efficiencies also contributed to a 321-basis-point year-on-year expansion in EBITDA margin,\u201d stated Vikas Gupta, Joint Managing Director.\n\nThe stock was trading 12.78% higher at \u20b9 206.80 per share on BSE with a market capitalisation of \u20b9 6070.15 crore at 11:20 am. The stock touched an intraday high of \u20b9 214.55 per share and an intraday low of \u20b9 183.30 per share. Its share price value has surged 13.77% in one week, 22.24% in two weeks, 111.69% in six months and around 126% in one year.\n\nCatch all the Business News , Market News , Breaking News Events, JIO IPO Listing Today LIVE and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.\n\nLog in to our website to save your bookmarks. It'll just take a moment.", "source": "LiveMint Markets", "pub_date_str": "09 Nov 2026, 11:34 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Dixon's Working Capital Is Swallowing Cash As Receivables And Inventory Surge", "full_content": "Dixon's operating cash flow turned negative as inventory and receivables absorbed nearly Rs 9,100 crore in H1FY27, even as revenue rose 35% and expansion plans gathered pace.", "source": "NDTV Profit", "pub_date_str": "09 Nov 2026, 11:26 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Lifestyle Inflation: Why Your Savings Aren't Growing Even As Your Salary Increases", "full_content": "Peer influence can further encourage lifestyle inflation. When friends and colleagues move into bigger homes, buy expensive cars or take international holidays, others may feel the need to follow suit.", "source": "NDTV Profit", "pub_date_str": "09 Nov 2026, 11:23 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "The Liver Doc vs Deepinder Goyal: Temple Row Escalates As Doctor Calls For Government Regulatory Scrutiny", "full_content": "The Liver Doc said he and other clinical scientists had gone through the science published on Temple's website and found nothing proving the device measures what it claims.", "source": "NDTV Profit", "pub_date_str": "09 Nov 2026, 11:23 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are te     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
