 how technology is moving from a back-office enabler to being integrated across the entire length of its business, from underwriting, risk management and pricing to distribution, claims and servicing.\n\nThe digital share of its servicing has expanded from 20% in FY23 to 47% in FY26, and further to 71% in the June quarter (Q1FY27), aiming for 90% by FY29. Digital servicing costs almost 90% less than manual servicing. The insurer\u2019s share of digital sourcing is also set to expand from 6% to 15%, which, along with the shrinkage in product launch time (6 months versus 4 weeks), can bring in 3-5% of gross written premium from new launches by FY29.\n\nThe digital leap is expected to translate into 100-200 basis points higher growth versus the industry, a sustained 10+ percentage point advantage in combined ratio, and 17-20% return on equity (RoE).\n\nCombined ratio measures underwriting profitability; it is the ratio of claims paid and other operating expenses (including commissions paid out) to premiums earned.\n\nThe timing is important, as its stock has fallen 13% since Q1FY27 earnings after the combined ratio worsened to 107.2%, from 102.9% a year ago. Excluding large fire claims and regulation-driven higher provisions, it would have been 102.3%. A higher combined ratio means lower underwriting profitability, while a ratio above 100% indicates an underwriting loss.\n\nNotably, for FY26, ICICI Lombard\u2019s combined ratio stood at 103.4% versus the industry\u2019s 117.8%.", "source": "LiveMint Markets", "pub_date_str": "01 Oct 2026, 11:48 AM IST", "pub_date_relative": "59m ago", "cfa_topics": ["Financial Statement Analysis", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "40% return in 6 months! Adani Energy Solutions share price up 5%, outshines Adani Group stocks- What's fuelling rally?", "full_content": "Shares of Adani Energy Solutions Limited surged during Thursday\u2019s intraday trading session. Outperforming other Adani Group stocks, AESL share price was up nearly 5% in the early trading session. The power stock also saw a sharp spurt in volume by more than 3.53 times today.\n\nThe recent uptick in Adani Energy Solutions share price has come as part of a wider rally in the power stocks post PM-Developing Harmonised and Accelerated Renewable-energy Access (PM-Dhara) scheme launch. The Union Cabinet, on Wednesday, approved \u20b9 1.86 lakh crore PM Dhara scheme.\n\nChaired by Prime Minister Narendra Modi, the Union Cabinet, approved the PM-Dhara scheme to boost India's energy infrastructure reforms. The new scheme will help in strengthening the Intra-State Transmission System and facilitate the evacuation of up to 135 GW of renewable energy across States and Union Territories.\n\nThe \u20b9 1.86 lakh crore scheme will help in providing the deployment of 50 GWh of Battery Energy Storage Systems (BESS) at renewable energy developer or generator ends.\n\nBoosting BESS capacity would help in addressing challenges arising from renewable energy intermittency, transmission congestion and peak-hour curtailment. It will also help in meeting electricity demand during non-solar hours.", "source": "LiveMint Markets", "pub_date_str": "01 Oct 2026, 11:44 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Stock Market Today Live Updates: Sensex Down 100 Points, Nifty Set For Eighth Straight Weekly Loss; Auto, Cement Top Drags", "full_content": "From pre-market signals to the most buzzing stocks in trade, we bring you all top developments from D-Street to keep you updated throughout the day.", "source": "NDTV Profit", "pub_date_str": "01 Oct 2026, 11:40 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "GST Collections Rise 14.7% YoY to Rs 2.04 Lakh Crore In September", "full_content": "GST collections in September rose 14.7% year-on-year (YoY) to Rs 2.04 lakh crore. Net GST revenue rose 18.1% to Rs 1.77 lakh crore, the government data showed.", "source": "NDTV Profit", "pub_date_str": "01 Oct 2026, 11:39 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Bajaj Auto, Hero MotoCorp, M&M tumble: Nifty Auto falls over 3% to lead sectoral loss \u2014 what\u2019s next for the sector?", "full_content": "Shares of automobile companies came under heavy selling pressure on Thursday, with the Nifty Auto index plunging more than 3% intraday to emerge as the biggest loser among sectoral indices. Weak September sales numbers from key automakers weighed on sentiment, while the government's new fuel-efficiency norms for passenger vehicles added another major development for the sector.\n\nBajaj Auto was the biggest decliner among the major auto stocks, falling 8%. Hero MotoCorp, Mahindra & Mahindra (M&M) and Eicher Motors declined around 4% each. Bosch, Ashok Leyland, Tata Motors Commercial Vehicles and TVS Motor Company also fell around 3% each.\n\nAmong auto ancillaries, Uno Minda, Samvardhana Motherson International and Bharat Forge were down around 3%. Maruti Suzuki and Tata Motors PV slipped around 2% each, while tyre makers Apollo Tyres and MRF also shed around 2%.\n\nBajaj Auto reported a 5% year-on-year increase in total sales to 538,443 units in September 2026, although the figure was below Street expectations. Exports provided the key support, jumping 32% year-on-year to 243,987 units from 185,252 units a year earlier.\n\nHowever, domestic sales declined 9% to 294,456 units from 325,252 units in September 2025.\n\nM&M reported total auto sales of 114,874 vehicles for September, representing 15% growth including exports. Its tractor sales, however, dropped 21% to 52,100 units from 66,111 units in the year-ago month.\n\nM&M attributed the decline in tractor volumes to a shift in the festive season, which begins in October this year compared with September last year. The company also pointed to a higher base in September 2025, when volumes had benefited from the implementation of the GST rate cut. M&M's exports stood at 1,892 units, up 62% year-on-year.\n\nSeptember sales data from Maruti Suzuki, Tata Motors, Ashok Leyland and Hero MotoCorp were not available yet.", "source": "LiveMint Markets", "pub_date_str": "01 Oct 2026, 11:39 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "LG Electronics Shares May Rally 22%, Says Motilal Oswal; Premiumisation, Exports Key Triggers", "full_content": "The brokerage's positive view on LG Electronics is supported by its diversified product portfolio, strong brand franchise, multiple avenues for sustainable revenue growth and better margin profile vs peers.", "source": "NDTV Profit", "pub_date_str": "01 Oct 2026, 11:37 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "India's Gross GST collection ticks up 14.7% in September to Rs 2.04 lakh crore", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Finance \u203a India's Gross GST collection ticks up 14.7% in September to Rs 2.04 lakh crore The Economic Times daily newspaper is available online now. Read Today's Paper India's Gross GST collection ticks up 14.7% in September to Rs 2.04 lakh crore SECTIONS India's Gross GST collection ticks up 14.7% in September to Rs 2.04 lakh crore ET Online Last Updated: Oct 01, 2026, 11:57:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Indian government reported a 14.7% increase in GST collections for September 2023 compared to last year. Maharashtra topped the states with collections reaching Rs 29,986 crore, reflecting a 15% growth. Some states, however, experienced significant declines in GST revenues, with Sikkim's collections dropping 51%. Cumulatively, the gross GST collection for the initial half of the fiscal year stood at Rs 12,46,278 crore.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\nSix months after oil spiked, why are markets reacting so sharply now?\n\nGold paradox: Why India, a refining giant, is not a big bullion exporter\n\nA refinery is not a laptop: Why America's diesel problem can't be switched off\n\nHow Irdai\u2019s big reset can change insurance landscape, customer choice\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers", "source": "Economic Times Economy", "pub_date_str": "01 Oct 2026, 11:37 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Avengers: Endgame Encore Box Office Collection Day 6: Film Nears Rs 30 Crore Mark, Check Day-Wise Earnings", "full_content": "The film returned to cinemas on September 25 with the special presentation featuring an exclusive look at the upcoming 'Avengers: Doomsday', which is scheduled to release on December 18.", "source": "NDTV Profit", "pub_date_str": "01 Oct 2026, 11:30 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Vishal Nirmiti Vs Nityas Gems IPO GMP Today: Which Has Higher Listing Gain? Day 2 Details", "full_content": "Both mainboard IPOs opened on September 30 and close October 5. Track GMP, subscription status, allotment date and expected listing price here.", "source": "NDTV Profit", "pub_date_str": "01 Oct 2026, 11:29 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "A Tailor-Made Opportunity? India's Apparel Stocks Get A China+1 Boost \u2014 Here's Who Benefits From The Export Win", "full_content": "The combined export share of Bangladesh and Vietnam rose from around 7% to more than 13% in 2025, highlighting the scale of the opportunity India has struggled to capture.", "source": "NDTV Profit", "pub_date_str": "01 Oct 2026, 11:28 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Macquarie stock recommendations: ICICI Bank, SBI, PayTM to LIC \u2014 top 11 financial shares to buy on rerating potential", "full_content": "Macquarie stock recommendations India: Amid poor returns by the key benchmark indices of the Indian stock market, global brokerage Macquarie has predicted a turnaround in investors' fortunes through the banking and financial stocks. The brokerage has predicted a strong FY28 for the banking stocks, expecting a rerating in banking and financial stocks. The Macquarie Equity Research expects banks to deliver strong ~18% FY28E EPS growth driven by a ~15bps rise in margins. Attractive valuations offer further support.\n\nExpecting a strong recovery in the earnings of Indian banks and financial companies, the Macquarie Equity Research said, \u201cWe forecast FY28E EPS growth of ~18% and see significant re-rating potential, given undemanding valuations of 1.3x FY28E P/B and 10x P/E.\u201d\n\nThe global brokerage equity research report says that private banks should deliver strong EPS growth in the next two years as margins improve and operating expenses and credit costs fall.\n\n\u201cWe assume a ~75 bps of rate hikes in the next 9\u201312 months, increasingly likely as the Fed enters a tightening cycle, supporting further margin expansion. Including foreign currency non-resident (FCNR) deposits, we forecast ~15 bps of YoY margin expansion in FY28E. The macroeconomic backdrop remains supportive: post-FCNR mobilisation has eased liquidity constraints, loan demand is robust and broad-based, asset quality remains healthy, and rate increases appear imminent,\u201d the Macquarie report went on to add.\n\nSpeaking on the NBFC business, Macquarie's report said that growth should remain strong, but a rate increase and higher bond yields should raise borrowing costs and pressure near-term margins. Asset quality is another risk, particularly for unsecured MFI and personal loans if inflation persists. However, most NBFCs are well capitalised and adequately provisioned.", "source": "LiveMint Markets", "pub_date_str": "01 Oct 2026, 11:24 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Hedge funds are piling into the $30 trillion US Treasury market | What happens if they sell?", "full_content": "Hedge funds are becoming a bigger force in the roughly $30 trillion US Treasury market, raising a new question for investors: what happens if these funds suddenly rush for the exit?\n\nHedge funds held about $2 trillion in cash Treasurys at the end of 2025, nearly three times their level five years earlier, according to the Office of Financial Research, cited by CNBC . That amounted to about 7% of the $28.9 trillion in marketable Treasury debt\u2014a record share.\n\nTheir buying has continued in 2026 too. Domestic hedge funds bought a net $60.6 billion of Treasurys in the second quarter, after $26.4 billion in the first quarter, taking their first-half purchases to about $87 billion.\n\nThe growing presence comes as the Treasury market faces pressure from rising yields. The 10-year yield surged to its highest level since 2007 on Monday, and the 30-year soared to the highest since 2002 on Tuesday.\n\nThe concern is less about hedge funds owning Treasurys and more about how they finance those positions.\n\n\u201cHedge funds have placed huge borrowed bets on US government bonds, mostly through the \u2018basis trade,\u2019 earning money from tiny price gaps between bonds and futures,\u201d said Prathamesh Kadiwal, research analyst at Bonanza Portfolio Ltd.\n\nHe said hedge funds now hold a record share of the market, but a sudden rush to sell could send Treasury prices sharply lower and yields higher. \u201cHedge funds have already unwound over $200 billion in positions as profits vanish,\u201d Kadiwal said, adding that a similar dynamic played out in March 2020 and forced the Federal Reserve to intervene.\n\nThe risk can increase when leveraged funds face margin calls. A fall in Treasury prices can force funds to sell assets to meet those calls, potentially pushing prices down further.", "source": "LiveMint Markets", "pub_date_str": "01 Oct 2026, 11:21 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income", "Derivatives", "Portfolio Management"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "South Korean President Lee pushes back on Alaska LNG project after Trump touts Seoul's participation", "full_content": "South Korea's $200 billion investment into the U.S., which President Donald Trump said would transform America \"for generations,\" is not a done deal in totality.\n\nThe South Korean investment plan includes nuclear power plants, a natural gas power facility in Texas and potentially the long-planned Alaska LNG project.\n\nTrump in a Truth Social post late Wednesday stateside said the countries had agreed to work on the Alaska LNG project, pegging its value at $50 billion, drawing a response from South Korea's President Lee Jae Myung, who emphasized that involvement in some of the projects remains subject to commercial considerations.\n\nLee in an X post on Thursday local time said that participation in the Alaska LNG project was dependent on its financial viability and legal compliance. He added that investments in nuclear power plants would also require assessment of commercial viability on a plant-by-plant basis.\n\nTrump had hailed South Korean investments in his post late Wednesday stateside, saying that the countries had agreed to work on the Alaska LNG project, pegging its value at $50 billion.\n\nThe joint statement earlier on Wednesday, however, had mentioned that work on the project was contingent on \"commercial reasonableness,\" without highlighting details on allocations toward the project.\n\nThe Alaska LNG project seeks to transport natural gas roughly 1,300 kilometers from fields on Alaska's North Slope to the southern part of the state, where it would be liquefied for export to markets including Asia, reported Yonhap. The project has faced longstanding questions over its economics given the large upfront investment required.\n\nIndustry Minister Kim Jung-kwan had described it as \"high-risk\" last year and said participation would be difficult unless it could generate sufficient cash flow.", "source": "CNBC Top News", "pub_date_str": "01 Oct 2026, 11:14 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Global Market: BOJ policymakers see scope for faster rate hikes as inflation pressure builds", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a Global Market: BOJ policymakers see scope for faster rate hikes as inflation pressure builds Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market: BOJ policymakers see scope for faster rate hikes as inflation pressure builds SECTIONS Global Market: BOJ policymakers see scope for faster rate hikes as inflation pressure builds By Anupam Nagar , ETMarkets.com Last Updated: Oct 01, 2026, 11:11:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Bank of Japan policymakers saw scope for faster interest rate hikes as persistent inflationary pressures raise concerns about price growth exceeding the central bank\u2019s 2% target. A summary of its September meeting showed support for further tightening, although some policymakers argued against rushing and stressed the need to monitor economic developments.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "01 Oct 2026, 11:11 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Global Market: Japan\u2019s Nikkei hits six-week high as chip stocks rally on AI optimism", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Global Market: Japan\u2019s Nikkei hits six-week high as chip stocks rally on AI optimism Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market: Japan\u2019s Nikkei hits six-week high as chip stocks rally on AI optimism SECTIONS Global Market: Japan\u2019s Nikkei hits six-week high as chip stocks rally on AI optimism By Anupam Nagar , ETMarkets.com Last Updated: Oct 01, 2026, 11:11:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Japan's Nikkei share average soared to a six-week peak, buoyed by chip sector stocks after favorable earnings guidance from Micron Technology. The Nikkei 225 surged 2.28%, while the broader Topix remained relatively stable. Nevertheless, various stocks within the Nikkei faced downturns, particularly in finance. Analysts are wary about the durability of AI stock gains amid Micron's forecasts, with monetary policy talks suggesting possible interest rate hikes, creating market uncertainty.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "01 Oct 2026, 11:11 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "HFCL stock jumps over 15% in 3 sessions: Will the bullish momentum continue? Check support, and resistance levels", "full_content": "Shares of HFCL jumped 5% to \u20b9 237.95 on Thursday, 1 October, extending gains for the third straight session. In 3 sessions, it has advanced over 15%.\n\nHFCL shares have delivered strong gains across time frames, rising around 13% in the past week and 12% over three months. The stock has surged 227% in six months, while its one-year gain stands at more than 223%, making it a multibagger over the period.\n\nThe stock hit its 52-week high of \u20b9 257 in August 2026 and its 52-week low of \u20b9 59.83 in January 2026.\n\nHFCL recently went ex-dividend for its \u20b9 0.20 final dividend per share for FY26. The key ex-dividend and record date for the payout was September 22, 2026. The company subsequently held its 39th Annual General Meeting on September 29, where shareholders approved the dividend along with several other resolutions.\n\nThe AGM was conducted through video conferencing and other audio-visual means. Shareholders considered HFCL\u2019s audited standalone and consolidated financial statements for the year ended March 31, 2026, along with the Board and auditors\u2019 reports.\n\nAccording to Jigar S Patel, Senior Manager - Technical Research, Anand Rathi Share and Stock Brokers Limited , HFCL is showing signs of losing momentum on the higher side, with the weekly chart indicating a slowdown in the prevailing uptrend. After the recent rise, the stock may enter a consolidation or profit-booking phase, making it prudent for existing investors to consider securing profits at current levels.\n\n\u201cThe immediate support is placed near \u20b9 220, which will be an important level to monitor. As long as this support holds, the broader structure may remain range-bound. On the upside, \u20b9 260 acts as the key resistance. A decisive breakout above \u20b9 260 would be required to revive stronger bullish momentum,\u201d he suggested.\n\nUntil such a breakout occurs, a cautious approach is advisable, with existing holders focusing on profit protection rather than fresh aggressive longs, the expert advised.", "source": "LiveMint Markets", "pub_date_str": "01 Oct 2026, 11:07 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Pace Digitek share price jumps 11% | What\u2019s driving the stock?", "full_content": "Pace Digitek share price jumped over 11% on Thursday, 1 October, despite the stock market remaining largely flat.\n\nThe stock has gained 1.80% over the past week, 10.75% in two weeks and 2.22% over the past month. However, it has remained down 18.50% over the past three months.\n\nRajesh Bhosale, Technical Analyst at My Advisor Alpha, said Pace Digitek witnessed a gap-up opening and an extended move during the initial trading session. However, the stock cooled off from its intraday high of around \u20b9 178.\n\nBhosale noted that the \u20b9 178 level coincides with the 200-day SMA, making it a key hurdle for the stock. A sustained break above \u20b9 178 could trigger the next leg of the upmove, with \u20b9 200 emerging as the next key resistance. On the downside, he identified \u20b9 160 as an important support level.\n\nSudeep Shah, Vice President \u2013 Technical and Derivatives Research at SBI Securities, said Pace Digitek has faced resistance around its 50-day EMA twice over the past eight sessions, making this zone an immediate hurdle.\n\nHe noted that despite the recovery from the mid-September lows, the stock continues to trade below key moving averages on the weekly chart, indicating that the broader trend remains weak. The MACD line also remains below zero, suggesting that momentum has yet to strengthen despite the recent recovery.\n\nShah identified the \u20b9 178\u2013 \u20b9 180 zone as immediate resistance. A decisive and sustained breakout above this range could extend the pullback towards \u20b9 185, followed by \u20b9 190 in the short term. On the downside, he pegged the \u20b9 158\u2013 \u20b9 155 zone as immediate support.\n\nPace Digitek share price today opened at an intraday low of \u20b9 165.15 apiece on the BSE , and the stock touched an intraday high of \u20b9 178 per share.", "source": "LiveMint Markets", "pub_date_str": "01 Oct 2026, 11:06 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Derivatives"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Micron earnings: AI chip demand drives fresh memory boom", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News Powered By Micron earnings: AI chip demand drives fresh memory boom Written by Anupam Nagar , ETMarkets.com | Oct 01, 2026, 11:07:39 AM IST 1 / 10 \u200bMicron\u2019s AI Boom Gets Even Bigger Micron Technology delivered a blockbuster fiscal fourth quarter, with revenue and profit beating Wall Street expectations by a wide margin. The memory-chip maker also issued a stronger-than-expected outlook for the first quarter of fiscal 2027, pointing to continued demand from artificial intelligence data centres. (Sources: Reuters, MarketWatch, Yahoo Finance)\n\nMicron reported fiscal fourth-quarter revenue of $54.23 billion, more than four times the $11.32 billion recorded a year earlier. Revenue also exceeded analysts\u2019 expectations of around $51.5 billion, highlighting the strength of the current memory-chip cycle.\n\nMicron reported adjusted earnings of $33.42 per share in the fourth quarter, compared with $3.03 per share a year earlier. The result also topped Wall Street expectations of about $31.83 per share, helped by stronger memory pricing, robust demand and a favourable product mix.\n\nFor the fiscal first quarter, Micron expects revenue of $61.5 billion, plus or minus $1.5 billion. That is well above analysts\u2019 expectations of roughly $57 billion. The company also forecast adjusted earnings of $38.15 per share, plus or minus $1, compared with expectations of around $35.40.\n\nMicron expects supply-demand conditions for memory and storage products to become significantly tighter in fiscal 2027 and 2028. AI data centres require large quantities of DRAM and high-bandwidth memory, while adding semiconductor production capacity can take several years.\n\nMicron said the value of customer commitments under long-term supply agreements has increased to about $32 billion, up from $22 billion in June.", "source": "Economic Times Markets", "pub_date_str": "01 Oct 2026, 11:00 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Global bond sell-off deepens as Asian yields jump", "full_content": "Japanese and Australian sovereign debt costs mount despite oil price dipping", "source": "FT Markets", "pub_date_str": "01 Oct 2026, 10:59 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "TBO Tek shares gain 3%; Nuvama initiates 'Buy' with Rs 2,200 target", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a TBO Tek shares gain 3%; Nuvama initiates 'Buy' with Rs 2,200 target TBO Tek Share Price The Economic Times daily newspaper is available online now. Read Today's Paper TBO Tek shares gain 3%; Nuvama initiates 'Buy' with Rs 2,200 target SECTIONS TBO Tek shares gain 3%; Nuvama initiates 'Buy' with Rs 2,200 target By Ritesh Presswala , ETMarkets.com Last Updated: Oct 01, 2026, 10:58:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Shares of travel tech firm TBO Tek rose nearly 3% on Thursday to Rs 1,733 after brokerage Nuvama initiated coverage with a Buy rating and a Rs 2,200 target price. The brokerage expects a 35% earnings CAGR over FY27-FY29E, driven by international expansion and hotel business growth.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "01 Oct 2026, 10:58 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Escorts Kubota Share Price Falls over 3% After September Sales Slump 17% YoY", "full_content": "Escorts Kubota's September tractor sales fell to 15,214 units from 18,267 units a year earlier, while six-month sales rose 10% year-on-year.", "source": "NDTV Profit", "pub_date_str": "01 Oct 2026, 10:58 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "'Cannot Take High Growth For Granted': DEA Flags El Nino, Crude Oil Shock And Employment Risks", "full_content": "The report, released by the Ministry of Finance, delivered a balanced assessment of the economy: while high-frequency domestic indicators reflect sustained dynamism, maintaining a high-growth trajectory will demand rigorous macroeconomic discipline and swift policy execution.", "source": "NDTV Profit", "pub_date_str": "01 Oct 2026, 10:56 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Anarock Property Consultants Files DRHP for Rs 1,000 Crore IPO", "full_content": "Anarock Property Consultants IPO comprises a fresh issue of equity shares aggregating up to Rs 550 crore and an Offer For Sale (OFS) of up to Rs 450 crore, according to the Draft Red Herring Prospectus (DRHP) filed on Wednesday.", "source": "NDTV Profit", "pub_date_str": "01 Oct 2026, 10:53 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Asian Stocks Eye Rough Start After US Reversal: Markets Wrap - Bloomberg.com", "full_content": "Asian Stocks Eye Rough Start After US Reversal: Markets Wrap Bloomberg.com Micron tops Q4 estimates on top and bottom lines, offers strong Q1 outlook Yahoo Finance Micron beats on earnings and issues strong guidance as data center revenue jumps 11-fold CNBC Tech stocks boosted by Micron but Treasury rout hangs over markets Reuters Dow Jones Futures: Micron Earnings Crush Views, S&P 500 At Critical Level As Treasury Yields Rise Investor's Business Daily", "source": "Google News Business", "pub_date_str": "01 Oct 2026, 10:51 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Fixed Income", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "New IPO listings share price: Premium or discount? Moneyview vs A-One Steels India - Winner is? What should investors do", "full_content": "New listings today : Two mainboard IPOs - Moneyview and A-One Steels India made their stock market debut on Thursday, 1 October.\n\nMoneyview share price made a blockbuster debut on the stock exchanges on October 1.\n\nThe stock listed at \u20b9 55 per share on the National Stock Exchange (NSE), marking a 61.76% premium over its IPO issue price of \u20b9 34 per share. On the BSE, Moneyview shares opened at \u20b9 55.61 apiece, translating into a 63.56% premium to the issue price.\n\nMoneyview shares jumped over 12% from its opening price to touch an intraday high of \u20b9 62 per share, after strong listing.\n\nRavi Singh, Chief Research Officer from Master Capital Services recommended long-term investors to continue to track the company\u2019s underlying digital lending and financial services business, supported by increasing adoption of digital credit and its expanding financial product offerings.\n\n\u201cRather than focusing only on today\u2019s listing performance, investors may monitor quarterly revenue growth, loan disbursals, managed AUM, margins, asset quality and operating cash flow,\u201d Singh said.\n\nThe listing of Moneyview IPO exceeded the market expectations as the GMP signalled an estimated listing price of \u20b9 48.6.\n\nThe Moneyview IPO was subscribed 98.46 times overall, against the 23.25 crore shares available for subscription. The retail investor portion was subscribed 19.57 times, while the Non-Institutional Investors (NII) category received bids 115.41 times the 5.02 crore shares reserved for the segment. The Qualified Institutional Buyers (QIB) portion saw the strongest demand, with subscription reaching 227.45 times against the 6.50 crore shares on offer.", "source": "LiveMint Markets", "pub_date_str": "01 Oct 2026, 10:46 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Kotak Mahindra Bank shares climb 4% after naming new MD, CEO - Can the stock rally further? Experts decode", "full_content": "Kotak Mahindra Bank shares climbed more than 4% in morning deals on the BSE on Thursday, 1 October, after the company announced the appointment of a new managing director (MD) and CEO. Kotak Mahindra Bank share price opened at \u20b9 425.45 against its previous close of \u20b9 417.60 and jumped over 4% to an intraday high of \u20b9 435.50, looking set to extend gains for the third consecutive session.\n\nIn an exchange filing on 1 October, Kotak Mahindra Bank said the Reserve Bank of India (RBI) had approved the appointment of Anup Kumar Saha as the new managing director and CEO of the bank for a term of three years, effective 1 January 2027.\n\n\"...the RBI had, on 30 September 2026, accorded its approval for the appointment of Anup Kumar Saha as the new managing director and CEO of the bank, for a period of three years, with effect from 1 January 2027,\" said the bank.\n\nSaha is currently a whole-time director (Executive Director) of the bank. He has over 32 years of experience, including 25 years in financial services across banking and non\u2013banking financial institutions.\n\nHe joined Kotak Mahindra Bank in January 2026. In his role as whole-time director of the bank since March 2026, he oversees the entire retail bank, government business, data analytics and marketing function, as per the bank's exchange filing.\n\nKotak Mahindra Bank shares have outperformed the equity benchmark Sensex lately.\n\nThe stock has gained over 21% in the last six months compared to a 1% drop in the Sensex.\n\nYear-to-date, the stock is down 3%, while the equity benchmark has lost 15%.", "source": "LiveMint Markets", "pub_date_str": "01 Oct 2026, 10:44 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "India factory activity rebounds sharply in September as demand revives, PMI hits 7-month high", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Indicators \u203a India factory activity rebounds sharply in September as demand revives, PMI hits 7-month high The Economic Times daily newspaper is available online now. Read Today's Paper India factory activity rebounds sharply in September as demand revives, PMI hits 7-month high SECTIONS India factory activity rebounds sharply in September as demand revives, PMI hits 7-month high Reuters Last Updated: Oct 01, 2026, 11:20:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India's manufacturing sector rebounded in September after a three-month slowdown, driven by strong demand for various products. The HSBC India Manufacturing Purchasing Managers' Index rose to 55.1, indicating notable growth in factory activity. New orders increased significantly, with manufacturers reporting higher export demand from multiple international clients. Employment in the sector also expanded, recovering from a previous decline in August.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\nSix months after oil spiked, why are markets reacting so sharply now?\n\nGold paradox: Why India, a refining giant, is not a big bullion exporter\n\nA refinery is not a laptop: Why America's diesel problem can't be switched off\n\nHow Irdai\u2019s big reset can change insurance landscape, customer choice\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers", "source": "Economic Times Economy", "pub_date_str": "01 Oct 2026, 10:40 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Stocks to buy: Titan, Lenskart, Dabur among Nomura\u2019s 17 consumer picks. Do you own any?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News Stocks to buy: Titan, Lenskart, Dabur among Nomura\u2019s 17 consumer picks. Do you own any? Written by Debaroti Adhikary , ETMarkets.com | Oct 01, 2026, 10:49:30 AM IST 1 / 10 Add to cart With the Q2 earnings season knocking on the door, Nomura expects demand to be largely stable despite the full effect of price hikes. It anticipates increased pressure on margins from higher-priced inventory. It expects volume growth to be largely stable sequentially, while pricing growth will be higher. The international brokerage estimates average EBITDA growth to moderate sequentially for its covered companies to 13.8% YoY, much above its eight-quarter average growth of 7% YoY. Here is a list of 17 consumer stocks on which Nomura has a \u2018Buy\u2019 call and its respective target prices.\n\nNomura has a \u2018Buy\u2019 call on the shares of Hindustan Unilever (HUL) with a target price of Rs 2,450 apiece, implying 31% upside potential. The international brokerage expects the company\u2019s volume growth to be similar to Q1 at 5% despite a soft Q2 base last year.\n\nNomura has a \u2018Buy\u2019 call on the shares of ITC with a target price of Rs 340 apiece, implying 28% upside potential. The international brokerage expects cigarette volumes to decline 7.5% YoY due to sharp price hikes. It forecasts the FMCG segment to continue its growth trajectory, while margins could face sequential pressure due to high commodity prices.\n\nAlso read | Indian markets are not vulnerable: Sebi chief Tuhin Kanta Pandey remains optimistic even as Sensex, Nifty bleed\n\nNomura has a \u2018Buy\u2019 call on the shares of Nestle India with a target price of Rs 1,675 apiece, implying 25% upside potential.", "source": "Economic Times Markets", "pub_date_str": "01 Oct 2026, 10:38 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "UK Prime Minister Burnham says Iran 'played a part' in British air base incident", "full_content": "United Kingdom Prime Minister Andy Burnham said Iran was involved in the incident at the Royal Air Force base in Fairford on Sunday that led to the arrest of five men on suspicion of explosive and terrorism offences.\n\nSpeaking to the BBC Wednesday, Burnham said that \"There are strong indications that Iran played a part in what happened     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
