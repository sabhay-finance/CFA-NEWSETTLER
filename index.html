<script>
    // This variable will be injected during the build process
    const allData = {"general": [{"title": "Fti Consulting Inc stock hits 52-week high at 209.01 USD", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Nov 2026, 09:44 PM IST", "pub_date_relative": "3m ago"}, {"title": "Nasdaq tumbles, turns negative for 2026, as Anthropic leads AI sell-off: Live updates", "full_content": "The Nasdaq Composite pulled back on Friday, turning negative for the year, as the index was weighed down by a decline in technology stocks alongside Anthropic shares following the artificial intelligence giant's public market debut in the previous session.\n\nThe tech-heavy Nasdaq shed 2.8% and was down 0.1% year to date. The S&P 500 traded down 1.5%. The Dow Jones Industrial Average outperformed, falling just 75 points, or 0.2%. The blue-chip index was boosted by gains in healthcare stocks like UnitedHealth and others such as retailer Walmart .\n\nAnthropic lost 10%, giving back some of its 17% jump in its Nasdaq debut Thursday and pressuring the broader AI trade. Chipmakers Advanced Micro Devices and Nvidia slid 8% and more than 5%, respectively. Micron Technology dropped more than 9%.\n\nThose declines in tech built on the losses seen in Thursday's horrid session, where the major averages each losing more than 2%, and the Dow closing below the key 50,000 level for the first time since June. The 30-stock Dow was nearing correction territory, as it was down just under 10% from its closing record.\n\nFor the week, the Dow has fallen roughly 6%, putting it on pace for its worst weekly performance since April 2025. The S&P 500 has also fallen 6%, while the Nasdaq is down about 7%, with both also headed for their largest one-week pullbacks in more than a year.\n\n\"Anthropic's strong debut alongside a falling technology sector suggests investors still believe in AI but are becoming more selective about what they will pay for that growth,\" said David Miller, CIO at Catalyst Funds. \"Nvidia's leadership uncertainty adds another layer of risk, and the stock's weakness despite strong earnings shows how much it will take to restore confidence.\"\n\nThe Nasdaq Composite dropped Friday, turning negative for 2026, as even Anthropic's IPO and Nvidia's earnings failed to revive the artificial intelligence trade.", "source": "CNBC Top News", "pub_date_str": "20 Nov 2026, 09:44 PM IST", "pub_date_relative": "3m ago"}, {"title": "Bally\u2019s Intralot 9M26 slides: revenue surges but leverage climbs", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Nov 2026, 09:42 PM IST", "pub_date_relative": "5m ago"}, {"title": "Exclusive: Twenty One CEO on Bitcoin, acquisitions, and building value", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Nov 2026, 09:41 PM IST", "pub_date_relative": "6m ago"}, {"title": "Nasdaq slides in choppy trading, briefly turns red for the year amid AI rout", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Nov 2026, 09:40 PM IST", "pub_date_relative": "6m ago"}, {"title": "Anthropic stock falls 10% in first full day of trading amid AI sell-off", "full_content": "Anthropic shares fell 10% on Friday after a historic Nasdaq debut, as concerns about artificial intelligence trade continued to drag tech stocks lower.\n\nThe stock opened at $111.50 on the Nasdaq Thursday after Anthropic raised $81.3 billion in the largest IPO of all time, but shares slid throughout the day and closed at $97.17.\n\nInvestors had been eagerly awaiting Anthropic's debut in the hopes that it could revitalize the AI trade, which has come under pressure following Jensen Huang's shocking ouster as Nvidia CEO, souring public sentiment around data centers and concerns that rising interest rates could affect plans for a multi-trillion-dollar AI infrastructure buildout .\n\nShares of chipmakers including Nvidia and Advanced Micro Devices , as well as hyperscalers including Amazon and Microsoft , sank lower on Friday.\n\nAnthropic stock Treasury Secretary Scott Bessent touted Anthropic as an \"only in America story\" in an interview with CNBC on Friday, adding that the company has been \"very cooperative\" in its work to pre-test models with the Trump administration.\n\n\"Anthropic in 2021 was seven people sitting around during Covid in a park in San Francisco, with laptops and a dream, and then yesterday we saw the most valuable IPO in history,\" Bessent said.\n\nAnthropic's relationship with the government has been strained this year after two high-profile disputes spilled into the public. But the tensions between the two camps began to thaw in September, when Anthropic CEO Dario Amodei joined President Donald Trump for a private dinner at the White House.\n\nBessent said Friday that one of Anthropic's seven co-founders is going to make a large gift to Trump Accounts, the investment accounts that the administration set up for U.S. children, over the next few weeks.", "source": "CNBC World Economy", "pub_date_str": "20 Nov 2026, 09:40 PM IST", "pub_date_relative": "7m ago"}, {"title": "Treasury yields fall as bond market tracks risk assets, not Fed rhetoric", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Nov 2026, 09:40 PM IST", "pub_date_relative": "7m ago"}, {"title": "Jensen Huang wasn't mentioned in latest talks with China, Bessent says", "full_content": "Former Nvidia CEO Jensen Huang was not mentioned in the Trump administration's latest talks with China, Treasury Secretary Scott Bessent told CNBC's \"Squawk Box\" Friday.\n\n\"No,\" Bessent said without elaborating when asked if Huang, a close ally of President Donald Trump facing allegations of an extramarital affair with a Chinese spy, had come up in those talks.\n\nBessent also suggested that U.S. policy allowing the sale of Nvidia's powerful H200 AI chips to China remains unchanged following the discussions.\n\n\"We've already agreed that the that H200s are the threshold level of chips that could be sold to the Chinese, and, you know, that continues as planned,\" Bessent said.\n\n\"I wouldn't anticipate any change in the policy,\" he added after CNBC's Sara Eisen noted that Nvidia said it had stopped selling H200s to China.\n\nBessent's appearance came after Trump's return from a tour through Asia that saw him meet with Chinese President Xi Jinping and Russian President Vladimir Putin in Shenzhen, China.\n\nThe meeting was historic as the first time the leaders of the three countries had met without other countries' counterparts. But the trilateral summit appeared to yield few deliverables on any number of the most pressing global issues related to the countries, including the Ukraine and Iran wars or the ongoing AI race.\n\nThere was a \"robust discussion\" between Trump and Xi on trade policy and AI, Bessent told CNBC.", "source": "CNBC Top News", "pub_date_str": "20 Nov 2026, 09:39 PM IST", "pub_date_relative": "7m ago"}, {"title": "International Bancshares Corporation stock hits 52-week low at $64.20", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Nov 2026, 09:38 PM IST", "pub_date_relative": "8m ago"}, {"title": "ECB\u2019s Nagel: Will likely need to act in December but price expectations remain anchored", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Nov 2026, 09:36 PM IST", "pub_date_relative": "11m ago"}, {"title": "Novanta Inc stock hits 52-week low at 47.83 USD", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Nov 2026, 09:35 PM IST", "pub_date_relative": "11m ago"}, {"title": "Provident Financial Holdings shareholders elect directors and approve auditor at annual meeting", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Nov 2026, 09:34 PM IST", "pub_date_relative": "12m ago"}, {"title": "First Solar CEO testifies on US manufacturing strategy", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Nov 2026, 09:34 PM IST", "pub_date_relative": "12m ago"}, {"title": "Bitcoin sell-off: Crypto is failing the 'digital gold' test again as it sinks with stocks", "full_content": "Bitcoin 's latest sell-off is reviving doubts that it can behave as the \"digital gold\" market hedge that crypto backers have long envisioned.\n\nComing into 2026, experts said that showing bitcoin could serve as a market hedge rather than a risk-on asset that moves up and down with growth stocks was an important test for the cryptocurrency.\n\nBitcoin was trading under $62,000 on Friday morning, down from an all-time high of more than $126,000 in early October last year. Its downward spiral in recent months and weeks has been precipitated by a confluence of factors. The heavy midterm elections losses for the Republicans, the Binance hack, and a world on edge about the security of all things technology \u2014 FAA ground stop, the outage of the National Security Agency's highly classified internal communications system, several online banking outages \u2014 have not helped the mood when it comes to putting trust in the digital world.\n\nBut the market itself may be the biggest factor. Investors are currently in sell everything mode, including tech stocks and gold \u2014 the Dow Jones Industrial Average and S&P 500 were both within two percentage points of correction territory on Friday, according to CNBC data. Bitcoin's recent price action has also tracked the move in the biggest tech IPOs , SpaceX and Anthropic. Taken together, the cryptocurrency is failing the test again when it comes to showing its worth as a market hedge during times of investor anxiety.\n\nIn the past month alone, bitcoin had dropped roughly $20,000, as of Friday morning, according to CNBC data.\n\nBitcoin's three-month performance compared with the Nasdaq 100 Index. Investors and financial management firms aren't viewing it as safe an investment as in the past, said Ryan Kirkley, co-founder and chief executive of Global Settlement Network, a Miami-based fintech that provides infrastructure for currency settlement, including crypto.", "source": "CNBC Top News", "pub_date_str": "20 Nov 2026, 09:29 PM IST", "pub_date_relative": "18m ago"}, {"title": "SEBI proposes big relief for FPIs: Additional disclosure rules may go - What it means for NSE and BSE?", "full_content": "The Securities and Exchange Board of India (SEBI), on Friday, proposed to review the additional disclosure framework for foreign portfolio investors (FPIs). If approved, it would ease the mandatory requirement for foreign funds to disclose extensive ownership details under the ADF.\n\nThese proposals by the market regulator are aimed to improve ease of doing business for foreign investors and make Indian capital markets a more attractive destination.\n\nThe existing granular requirements under the additional disclosure framework mandate certain FPIs to disclose details of all entities having ownership, economic interest or exercising control in them.\n\nThese mandatory disclosures are unique to India, observed SEBI in its consultation paper and noted that it goes beyond the beneficial ownership identification requirements prescribed under anti-money laundering rules.\n\n\"Over and above the ...requirement of BO identification, Sebi has prescribed an Additional Disclosure Framework (ADF). ADF, inter alia, provides the criteria for identification of FPIs that are required to submit granular details of all entities holding any ownership, economic interest, or exercising control in the FPI, on a full look-through basis, up to the level of all natural persons, without any threshold,\" read the SEBI consultation paper released on Friday.\n\nSEBI\u2019s proposal is part of a broader effort to reduce compliance hurdles and make local markets more accessible and attractive for investors.\n\nPortfolio investors sold nearly $50 billion ( \u20b9 4.65 lakh crore) in Indian equities between January 2025 and October 2026 amid a lack of Indian AI opportunities and high valuations for locally listed stocks.\n\nThe strong FII selling put pressure on the rupee too. FII selling also weighed on stock market investors' sentiment. It also added to selling pressure in NSE and BSE and contributed in market corrections, increased volatility, and also weighed on large-cap stocks' performance.", "source": "LiveMint Markets", "pub_date_str": "20 Nov 2026, 09:28 PM IST", "pub_date_relative": "19m ago"}, {"title": "Blame it on sales targets, not branch decisions: RBI Dy Governor Murmu explains how financial mis-selling starts", "full_content": "Mis-selling of financial products is often driven by sales targets and variable pay structures rather than decisions taken at the branch level, Reserve Bank of India (RBI) Deputy Governor SC Murmu has said, urging financial institutions to review their employee incentive mechanisms and prioritise customer outcomes over sales volumes.\n\nMurmu highlighted the need for banks and other financial institutions to examine whether their remuneration structures encourage employees to push products to meet sales targets or reward them for delivering suitable financial solutions to customers.\n\n\u201cLook hard at incentives. Mis-selling rarely begins at the branch counter. It begins with a sales target and a variable pay scheme. Ask what your incentives actually reward: volumes or customer outcomes. And ask how you measure each,\u201d Murmu said at the 11th annual Gatekeepers of Governance Summit 2026 in Mumbai.\n\nMis-selling has remained a persistent concern across India's financial sector, particularly in the distribution of insurance policies, mutual funds and other third-party financial products through banks and financial institutions.\n\nHe also highlighted the significant regulatory changes scheduled to take effect from April 1, 2027, which will require banks to strengthen their risk management frameworks, governance practices and technological capabilities.\n\nThe new prudential framework will introduce expected credit loss (ECL)-based provisioning, implement the remaining Basel III standards and adopt a revised standardised approach to credit risk.\n\nUnder the proposed ECL framework, banks will have to make provisions for anticipated credit losses rather than waiting until losses materialise. This will replace the existing incurred-loss-based provisioning system.\n\nThe new framework will classify financial assets into three stages depending on changes in their credit risk profile.", "source": "LiveMint Money", "pub_date_str": "20 Nov 2026, 09:24 PM IST", "pub_date_relative": "23m ago"}, {"title": "Investors fled to healthcare stocks for safety. Now insurance and hospital shares are plunging.", "full_content": "Shares of UnitedHealth, Humana and CVS Health declined this week in light of a new Medicare for All proposal", "source": "MarketWatch Top Stories", "pub_date_str": "20 Nov 2026, 09:23 PM IST", "pub_date_relative": "24m ago"}, {"title": "White House replaces cyber director Sean Cairncross amid widespread tech outages", "full_content": "White House National Cyber Director Sean Cairncross is leaving his post, with Pentagon CIO Kirsten Davies set to serve as acting director after a week of high-profile U.S. technology outages.\n\nThe role, which advises the president on cybersecurity and coordinates U.S. cyber policy across federal agencies, has been handed to Davies, the Pentagon's chief information officer, on an interim basis. A permanent national cyber director must first be nominated by the president and then confirmed by the Senate.\n\nAxios first reported Cairncross' exit, citing two White House officials who said President Donald Trump's chief of staff, Stephen Miller, pushed for his departure.\n\nThe White House declined to comment. However, a source familiar with the White House's thinking told CNBC that the President fully supported firing Sean Cairncross from his position because he lacked the strong cyber credentials to perform the job. Davies has the credentials to excel in the position and has been Senate-confirmed, the person added.\n\nThe Office of the National Cyber Director did not immediately respond to a CNBC request for comment.\n\nIt comes after a series of technology outages, including a nationwide aviation ground stop, a worldwide Microsoft Outlook outage and a reported blackout of the National Security Agency 's classified communications network.\n\nThe White House has insisted that there are no indications of a coordinated cyberattack , state-sponsored activity or malign actor behind recent tech outages.\n\nDavies addressed her responsibilities in the new position and thanked Miller and Trump for their confidence late Thursday.", "source": "CNBC Top News", "pub_date_str": "20 Nov 2026, 09:22 PM IST", "pub_date_relative": "24m ago"}, {"title": "Ex-GM CEO on Mary Barra succession planning: 'It's going to be tough'", "full_content": "Former General Motors CEO and Chairman Dan Akerson doesn't mince words when asked about the challenges the automaker faces in finding a successor for GM CEO Mary Barra : \"It's going to be tough.\"\n\nHe should know. The 78-year-old businessman and U.S. Navy veteran helped with his own succession planning and recommended to GM's board in 2013 that Barra replace him as CEO. She has held the top job since Jan. 15, 2014.\n\nAkerson said Barra will be hard to replace, citing her success and prominence as the first female CEO of any major automaker and the ongoing challenges facing the automotive industry, such as artificial intelligence , vehicle digitalization, and the rise of China and autonomous vehicles.\n\n\"It's going to be very, very dynamic,\" Akerson told CNBC during a phone interview. \"It's going to be a big change.\"\n\nAkerson declined to discuss potential internal candidates such as GM Chief Product Officer Sterling Anderson , CFO Paul Jacobson or President Mark Reuss, but he said the eventual successor needs to be dynamic and, if from the outside, \"adaptable.\"\n\nHis comments to CNBC follow a Wall Street Journal report on Tuesday that GM is working with an executive search firm to identify possible outside candidates to succeed Barra, in addition to internal prospects. GM declined to comment on the report or Barra's succession.\n\nAkerson, who came to GM as an outsider from The Carlyle Group in 2010, said selecting an outside candidate might be risky if there are already executives within the organization who have similar leadership and technical expertise.\n\n\"Is there anybody in the organization that has that background that you know better day to day over a period of time? You may be taking a risk by bringing in an outsider,\" he said.", "source": "CNBC Top News", "pub_date_str": "20 Nov 2026, 09:20 PM IST", "pub_date_relative": "27m ago"}, {"title": "Mundhe's Big Warning To Gyms, Influencers: Selling Protein Powder Without A Licence Could Invite Rs 10 Lakh Fine", "full_content": "The crackdown follows inspections at 17 establishments across six divisions, during which products worth Rs 1.38 crore were seized.", "source": "NDTV Profit", "pub_date_str": "20 Nov 2026, 09:19 PM IST", "pub_date_relative": "27m ago"}, {"title": "India\u2019s FPI Norms Are Stricter Than US And UK. Now SEBI Wants To Roll Them Back", "full_content": "SEBI has proposed scrapping its Additional Disclosure Framework for certain foreign portfolio investors, saying the existing rules go beyond beneficial ownership requirements under anti-money laundering regulations.", "source": "NDTV Profit", "pub_date_str": "20 Nov 2026, 09:11 PM IST", "pub_date_relative": "36m ago"}, {"title": "Bengaluru Man Hammers Live-In Partner's 18-Year-Old Son To Death, Locks Her In Room For 4 Days", "full_content": "Bengaluru police reached the rented apartment after the landlord reported that repeated calls and knocks had gone unanswered.", "source": "NDTV Profit", "pub_date_str": "20 Nov 2026, 09:11 PM IST", "pub_date_relative": "36m ago"}, {"title": "Nvidia Turmoil Leaves Few Stock Market Winners In Sea Of Losers", "full_content": "Nvidia shares have shed more than 29% since the end of October, when the news hit that Huang had an affair with a woman who is suspected of spying for China, wiping out $1.4 trillion of market value in a few weeks.", "source": "NDTV Profit", "pub_date_str": "20 Nov 2026, 09:09 PM IST", "pub_date_relative": "37m ago"}, {"title": "Anthropic\u2019s stock slides closer to IPO price and drags down the AI trade", "full_content": "Anthropic\u2019s inability to hold its opening stock price has been seen as \u201cbad for the rest of tech.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "20 Nov 2026, 09:08 PM IST", "pub_date_relative": "39m ago"}, {"title": "Nvidia\u2019s stock heads for a stretch of weekly losses unseen since 2008", "full_content": "One fund manager says the continued uncertainty makes Nvidia \u201cvulnerable\u201d to more selling, even as the company has erased $811 billion in market value in the past seven days.", "source": "MarketWatch Top Stories", "pub_date_str": "20 Nov 2026, 09:08 PM IST", "pub_date_relative": "39m ago"}, {"title": "Salman Khan Makes Bhel, Serves 20 People Himself On Maatrubhumi Sets", "full_content": "Salman Khan's Maatrubhumi co-star Heera Sohal recalls the superstar making bhel and serving nearly 20 people on set, while praising his warmth, professionalism and thoughtful gesture of gifting watches to the crew.", "source": "NDTV Profit", "pub_date_str": "20 Nov 2026, 08:58 PM IST", "pub_date_relative": "49m ago"}, {"title": "This proposed Social Security fix could add trillions to the national debt", "full_content": "A Republican senator has a new proposal called the \u201cStop Scaring Seniors Act.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "20 Nov 2026, 08:58 PM IST", "pub_date_relative": "49m ago"}, {"title": "Stock Market Today: Dow bounces, S&P 500 and Nasdaq fall as major indexes head for worst week since 'liberation day' - MarketWatch", "full_content": "Stock Market Today: Dow bounces, S&P 500 and Nasdaq fall as major indexes head for worst week since 'liberation day' MarketWatch Doug's Daily Diary \u2014 Friday, November 20, 2026 RealMoney Pro Volatility Index Moves to Close Out Painful Week: 8 Key Items Shaping the Stock Market Friday RealMoney Pro Doug's Daily Diary \u2014 Thursday, November 19, 2026 RealMoney Pro", "source": "Google News Business", "pub_date_str": "20 Nov 2026, 08:56 PM IST", "pub_date_relative": "51m ago"}, {"title": "Man Travels 2,100 Km To Stop Delhi Influencer's Wedding, Dies After Being Thrashed", "full_content": "Police have arrested the influencer's father and a neighbour as investigators examine CCTV footage to identify others involved in the assault.", "source": "NDTV Profit", "pub_date_str": "20 Nov 2026, 08:55 PM IST", "pub_date_relative": "52m ago"}, {"title": "The AI fever in markets is breaking", "full_content": "For investors, the magic of the technology might be wearing off, with US stocks on track for one of the worst years in two decades", "source": "FT Markets", "pub_date_str": "20 Nov 2026, 08:53 PM IST", "pub_date_relative": "53m ago"}, {"title": "Anthropic Sinks 10% On First Full-Day Of Trading Post Nasdaq Debut As AI Jitters Spooks Wall Street", "full_content": "Anthropic shares extended losses after a record-breaking $81.3 billion IPO, as concerns over AI valuations, infrastructure spending and interest rates continued to weigh on technology stocks.", "source": "NDTV Profit", "pub_date_str": "20 Nov 2026, 08:53 PM IST", "pub_date_relative": "54m ago"}, {"title": "This closely watched investing guru just sold all of his stocks", "full_content": "Panmure Liberum strategist and widely-followed stock-market commentator Joachim Klement has effectively had his personal retirement portfolio 100% invested in stocks for many years.", "source": "MarketWatch Top Stories", "pub_date_str": "20 Nov 2026, 08:53 PM IST", "pub_date_relative": "54m ago"}, {"title": "Warsh wants Fed officials to talk less. Instead, they\u2019re talking more", "full_content": "In his first six months as Federal Reserve chairman, Kevin Warsh has diligently avoided signaling where he sees monetary policy and interest rates headed. His colleagues have been only too happy to fill the void.\n\nFed officials have been rushing to the microphones lately, voicing sometimes conflicting opinions on how the central bank should be handling an inflation bug that the economy can't seem to shake.\n\nMost agree that rates should be raised \u2014 and soon. Some are willing to hike at a measured pace as conditions play out, while others, such as Governor Christopher Waller and St. Louis Fed President Alberto Musalem , entertain the thought of more aggressive hikes in a shorter period of time.\n\nLargely on the sidelines in the debate is Warsh, who has expressed disdain for that sort of forward guidance and argued that it handcuffs policymakers long before they actually have to make a decision. But that hasn't stopped most of the other 18 officials who sit in on Federal Open Market Committee meetings.\n\nIn fact, according to a Bank of America analysis, there has been more so-called Fedspeak in the past two weeks than in any similar period since the start of 2025.\n\n\"Warsh's refusal to guide markets might be encouraging the rest of the FOMC to speak more, not less,\" Bank of America economist Aditya Bhave said in a note Thursday.\n\n\"There is always a range of views across the 19 FOMC participants. Typically, the Chair would weigh in, indicating to markets whether the hawks or doves are in ascendence,\" he added. \"Absent this leadership, however, both sides might feel incentivized to speak more often and more forcefully.\"\n\nThe increasingly vocal debate comes at a critical time for the Fed and has myriad policy implications.", "source": "CNBC Finance", "pub_date_str": "20 Nov 2026, 08:50 PM IST", "pub_date_relative": "56m ago"}, {"title": "Best mutual funds: Does switching to last year\u2019s top-performing category help you earn higher long-term SIP returns?", "full_content": "Investors often move their mutual fund investments between large-cap, mid-cap and small-cap categories in search of better returns. When small-cap funds outperform, they may shift towards small-caps. When mid-caps take the lead, they may move their investments again. However, chasing the previous year's best-performing category may not necessarily improve long-term wealth creation.\n\nA November 2026 analysis by WhiteOak Capital Mutual Fund, using nearly two decades of historical market data, suggests that frequently switching between market-cap categories based on their previous year's performance may not always work in investors' favour. In one example, an investor who continued investing in the mid-cap index generated a 16.09% return, compared with 14.05% for an investor who switched to the previous year's best-performing category.\n\nThe analysis compared two investment approaches. One investor started a systematic investment plan (SIP) in a particular market-cap index and continued investing in it , while another shifted the SIP every year to whichever category had delivered the highest returns in the preceding year.\n\nThe findings highlight why investors should be cautious about changing their mutual fund allocation simply because another category has recently outperformed.\n\nThe first case study examined an investor who started a SIP in the mid-cap index and subsequently switched to the previous year's best-performing category among large-cap, mid-cap and small-cap indices.\n\nThe investor who changed categories every year generated an XIRR of 14.05% as of October 31, 2026. In comparison, the investor who continued investing in the mid-cap index without switching generated a higher XIRR of 16.09%.\n\nThe second case study examined an investor who started a SIP in the small-cap index.", "source": "LiveMint Money", "pub_date_str": "20 Nov 2026, 08:50 PM IST", "pub_date_relative": "56m ago"}, {"title": "Tukaram Mundhe-Led Maharashtra FDA Targets Steroids In Supplements, Seizes Stock Worth Rs 1.38 Crore", "full_content": "The order covers 1,100 existing food business licence holders, including 313 manufacturers, 759 relabellers and 28 repackers.", "source": "NDTV Profit", "pub_date_str": "20 Nov 2026, 08:49 PM IST", "pub_date_relative": "57m ago"}, {"title": "Cathie Wood\u2019s ARK Invest was a big buyer of Anthropic as she tells CNBC she\u2019s \u2018quite optimistic\u2019", "full_content": "Cathie Wood was a major buyer of Anthropic following its debut Thursday on the Nasdaq, adding shares in all her major funds.\n\nWood's firm, which already owned private shares of the AI company in its ARK Venture Fund leading up to the IPO, bought $90.8 million worth of Anthropic in six funds, according to a trade notification from the firm.\n\n\"We've owned Anthropic since early '23,\" Wood told CNBC's \" Squawk Box\" on Friday. \"It's our best performing equity by far in ARKVX, our venture fund...Our confidence has grown with time as it really took over the enterprise\" AI business.\n\nAnthropic shares jumped 17% in their first day, but closed well off the highs of the session and were headed for sizable losses Friday. The Nasdaq, which was expected to get a boost from a major IPO reviving enthusiasm about the technology trade, fell by 2% on Thursday.\n\n\"We're climbing a wall of worry,\" said Wood. \"Everybody is worried about AI hype and the political situation after the election, but I think we'll look back and say, OK this is more like the 80s and 90s, climbing a wall of worry you know with bricks much like what we have today: inflation, interest rates, wars, new technologies and so forth so quite optimistic here.\"\n\nThe Anthropic stakes are relatively small across the funds, but Wood typically will buy shares in companies she likes steadily during long stretches. Wood said she is \"averaging down\" with her purchases of Anthropic.\n\nIn her $6.1 billion ARK Innovation ETF , Anthropic is a 0.3% stake. The biggest holdings in that fund are Tesla and SpaceX , representing more than 21% of the fund together.\n\nARK Innovation, which retail investors piled into during the pandemic as it gained about 150% in 2020, tumbled the subsequent next two years, losing 67% in 2022 alone. Wood's following was dented after the big losses.", "source": "CNBC Top News", "pub_date_str": "20 Nov 2026, 08:47 PM IST", "pub_date_relative": "1h ago"}, {"title": "Berkshire Hathaway has been a popular 'anti-AI trade.' One firm says it\u2019s too expensive now", "full_content": "Berkshire Hathaway's traditional value tilt is working, but the stock's multiples now leave one Wall Street firm cautious.", "source": "CNBC Top News", "pub_date_str": "20 Nov 2026, 08:43 PM IST", "pub_date_relative": "1h ago"}, {"title": "AI can help find holiday deals \u2014 but it's not great at spotting scams, experts say", "full_content": "Artificial intelligence shopping tools can help consumers compare prices and find gift ideas, but experts say shoppers still need to verify unfamiliar retailers and sellers before buying.\n\nScammers can use AI to make fake stores, product photos and reviews look convincing. It can also make creating and deploying websites easier, said Leyla Bilge, global head of scam research at cybersecurity company Norton.\n\n\"The biggest impact right now we're seeing in AI is on coding,\" Bilge said. Scammers can register \"thousands and thousands of fake e-shops online,\" she said, which increases the chances shoppers will encounter one.\n\nA Norton survey of 1,000 U.S. adults found that 16% of respondents had been scammed while shopping online during the holidays. Of those victims, 88% lost money, with an average loss of $394. The survey was conducted from an opt-in online panel between Sept. 10 and 21 by Dynata on behalf of Norton's parent company, Gen.\n\nHere's a look at more stories on how to manage, grow and protect your money for the years ahead.\n\nScams can have impacts beyond financial losses. In a survey of 3,110 U.S. adults released in June, the Global Anti-Scam Alliance found that 82% of respondents had encountered a scam in the past year. More than half, 59%, said the scam affected their mental well-being.\n\nMore than half of GASA survey respondents said they had experienced repeat scams.\n\nIf you put your address or phone number in an AI tool that turns out to be fraudulent, \"you might get reached out to again with a much more sophisticated, much more targeted and personalized attack and scam,\" Bilge said.", "source": "CNBC Top News", "pub_date_str": "20 Nov 2026, 08:42 PM IST", "pub_date_relative": "1h ago"}, {"title": "As Anthropic shares tank, investors scramble to hedge. It could be very expensive", "full_content": "As Anthropic shares tumble toward their IPO price of $83, investors are looking for ways to hedge. Unfortunately, they may have to wait until Monday, when options on the AI giant are expected to list.\n\nIf Anthropic breaks its IPO price, it will represent a 27% decline from Thursday's intraday high of $113. The wild price swings offer clues on how expensive it might be to buy protection on the new tech giant once options begin trading. A 20% intraday move points to an implied volatility somewhere between 100 and 150 for Anthropic options, according to estimates from single-stock market-makers on the Cboe trading floor in Chicago.\n\nOptions traders are also looking at how SpaceX traded in the days following its offering for clues on how options might price.\n\nAnthropic, (ANT) Implied volatility in SpaceX started at 116, but that didn't deter options traders big and small from piling into the contracts tracking the stock, with about 1.7 million contracts traded on the first day for a total options premium of about $2.5 billion. Far out-of-the-money call contracts were some of the most popular trades as the stock soared 40% in its first three sessions. One key difference between now and then? Anthropic is trading against the backdrop of S&P 500 volatility close to 30, compared to 17.3 when SpaceX debuted. \"I expect ANT options to be super active,\" said Tom Sosnoff, co-founder of the trading platforms ThinkOrSwim and TastyTrade. \"I expect heavy options volume.\" One thing Anthropic and SpaceX have in common is heavy retail involvement in both IPOs, with retail brokerages receiving a 20% allocation from SpaceX and reports pointing to between a 15-20% allocation from Anthropic on Thursday. \"Round one of the Anthropic IPO easily goes to the individual investor,\" Sosnoff added. \"Retail participants bailed early at the best prices of the day while institutional investors paid up to top off their underwhelming allocations.", "source": "CNBC Top News", "pub_date_str": "20 Nov 2026, 08:42 PM IST", "pub_date_relative": "1h ago"}, {"title": "Anthropic IPO live: Anthropic stock drops after first day of trading - Yahoo Finance", "full_content": "Anthropic IPO live: Anthropic stock drops after first day of trading Yahoo Finance \"This is a painful tech sell-off\": Anthropic shares slump Axios Stock Market Today: Anthropic Stock Slides; Nasdaq Drops at Open \u2014 Live Updates WSJ Anthropic\u2019s Meh Debut The American Prospect AI stocks are selling off after Anthropic\u2019s record IPO, and Wall Street is split on whether this is the top Fortune", "source": "Google News Business", "pub_date_str": "20 Nov 2026, 08:40 PM IST", "pub_date_relative": "1h ago"}, {"title": "US Stock Market Today: Wall Street In Red As Anthropic-Led AI Rout Drags Nasdaq, Dow Nears Correction", "full_content": "Nasdaq slipped 1.3% to 26,176.4, while S&P 500 dropped 0.42% to 7,145.61, Dow Jones Industrial Average marginally rose to 49,130.68.", "source": "NDTV Profit", "pub_date_str": "20 Nov 2026, 08:39 PM IST", "pub_date_relative": "1h ago"}, {"title": "Sebi proposes limiting tenure of chief executives, independent directors at exchanges", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Sebi proposes limiting tenure of chief executives, independent directors at exchanges The Economic Times daily newspaper is available online now. Read Today's Paper Sebi proposes limiting tenure of chief executives, independent directors at exchanges SECTIONS Sebi proposes limiting tenure of chief executives, independent directors at exchanges Reuters Last Updated: Nov 20, 2026, 08:39:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India's Securities and Exchange Board is proposing crucial adjustments to governance norms affecting market institutions. Key suggestions include lowering the age threshold for public interest directors from 75 to 70 years, instituting a maximum of two three-year terms for directors, and restricting managing directors to an eight-year tenure. Current executives can finish their ongoing terms despite these proposed changes. SEBI is seeking public feedback on these recommendations by December 11.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "20 Nov 2026, 08:39 PM IST", "pub_date_relative": "1h ago"}, {"title": "Here\u2019s what\u2019s been proven to help GLP-1 users from losing too much muscle from the drug", "full_content": "People taking Zepbound who engage in consistent resistance training can still get stronger even if they lose some of their muscle, according to a new study.", "source": "MarketWatch Top Stories", "pub_date_str": "20 Nov 2026, 08:34 PM IST", "pub_date_relative": "1h ago"}, {"title": "Anthropic Shares Fall 10% Pre-Market After Historic Nasdaq Debut: What It Means For AI Stocks", "full_content": "Anthropic shares had advanced up to 39% from its IPO price on Thursday and erased more than half of the gains, closing 17% higher.", "source": "NDTV Profit", "pub_date_str": "20 Nov 2026, 08:33 PM IST", "pub_date_relative": "1h ago"}, {"title": "Anthropic shares tumble 10% after blockbuster IPO, erase debut gains; why are investors turning cautious on AI?", "full_content": "Shares of Anthropic PBC, the maker of the Claude chatbot, fell 10% at the opening bell on Friday, sliding to around $87.54 per share and slipping below their lowest level during Thursday's debut.\n\nAnthropic, described as the world's first publicly traded frontier AI company, had opened 34% above the IPO price of $83. However, the stock pared its gains and closed at $97.17, up 17% from its IPO price.\n\nWithin just a few hours of trading, Anthropic's stock appeared to reflect investor uncertainty over the direction of the artificial intelligence (AI) industry. The shares initially surged to $111.53, taking the company's market valuation close to $2 trillion, before retreating to $965 billion.\n\nThe stock's decline also coincided with the exercise of the so-called over-allotment option, commonly known as a greenshoe option, which allows underwriting banks to sell additional shares after trading begins.\n\nThe over-allotment option takes the total amount raised by Anthropic and the co-founders' selling shares in the offering to $119.5 billion, comprising $93.5 billion through the IPO and $26 billion through a concurrent private placement, Reuters reported.\n\nAnthropic's IPO attracted global demand amounting to seven times the shares available for sale. Competition was so intense that more than half of the institutional investors bidding for shares were left empty-handed, Bloomberg reported on Thursday.\n\nThe listing has done little to ease broader concerns surrounding the AI trade, as investors question whether the returns will justify the enormous sums being spent and borrowed to finance the boom, which has helped equities worldwide scale record highs.\n\nDeteriorating sentiment towards equities has driven investors towards the safety of bonds, with the yield on the benchmark 10-year US Treasury note slipping two basis points to 5.02%. A Bloomberg gauge of the dollar remained near its highest level since April 2025, while emerging-market currencies weakened.", "source": "LiveMint Markets", "pub_date_str": "20 Nov 2026, 08:32 PM IST", "pub_date_relative": "1h ago"}, {"title": "Did Banks Get Hacked? Visa, Mastercard, Chase Confirm Vendor Cyberattack - Forbes", "full_content": "Did Banks Get Hacked? Visa, Mastercard, Chase Confirm Vendor Cyberattack Forbes Visa, Mastercard and JPMorgan Customer Data Leaked by Hackers WSJ Chase vendor hack could fuel wave of phishing scams, expert warns NewsNation JPMorganChase, Mastercard, Visa report cyberattack on third-party service providers ABC News - Breaking News, Latest News and Videos JPMorgan Chase says customer data exposed in cyberattack USA Today", "source": "Google News Business", "pub_date_str": "20 Nov 2026, 08:32 PM IST", "pub_date_relative": "1h ago"}, {"title": "MSG Rangers stock is a 'trophy asset at a deep discount,' JPMorgan says", "full_content": "The bank initiated coverage of the NHL team stock with an overweight rating.", "source": "CNBC Top News", "pub_date_str": "20 Nov 2026, 08:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "WWE SmackDown Tonight: Match Card, India Start Time And Live Streaming Details", "full_content": "Cody Rhodes is set to announce the final member of Team USA ahead of Survivor Series: WarGames 2026.", "source": "NDTV Profit", "pub_date_str": "20 Nov 2026, 08:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "Federal Reserve Board releases results from survey of senior financial officers at banks about their strategies and practices for managing reserve balances", "full_content": "Official websites use .gov A .gov website belongs to an official government organization in the United States.\n\nSecure .gov websites use HTTPS A lock ( Lock Locked padlock icon ) or https:// means you've safely connected to the .gov website. Share sensitive information only on official, secure websites.\n\nFor release at 10:00 a.m. EST Share --> --> --> --> --> --> The Federal Reserve Board on Friday released results from a survey of senior financial officers at banks about their strategies and practices for managing reserve balances. The Senior Financial Officer Survey is used by the Board to obtain information about banks' reserve balance management strategies and practices, their expectations around the size of their balance sheets and deposit balances their activity in money markets, and their views on other matters, such as operations on weekends and holidays.\n\nThe survey was conducted in collaboration with the Federal Reserve Bank of New York between September 18, 2026, and September 28, 2026, and includes responses from banks that held around three-fourths of total banking system reserve balances at the time of the survey.\n\nFor media inquiries, please e-mail [email protected] or call (202) 452-2955.", "source": "Federal Reserve", "pub_date_str": "20 Nov 2026, 08:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "Scene Box Office Collection Day 15: Suriya Starrer Sees Drop As Film Enters Third Week", "full_content": "Directed by Jithu Madhavan, Scene is an action-comedy featuring Suriya in the lead, with Nazriya Nazim, Naslen K. Gafoor, Lal and Anandraj in key roles.", "source": "NDTV Profit", "pub_date_str": "20 Nov 2026, 08:29 PM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "Nasdaq tumbles, turns negative for 2026, as Anthropic leads AI sell-off: Live updates", "full_content": "The Nasdaq Composite pulled back on Friday, turning negative for the year, as the index was weighed down by a decline in technology stocks alongside Anthropic shares following the artificial intelligence giant's public market debut in the previous session.\n\nThe tech-heavy Nasdaq shed 2.8% and was down 0.1% year to date. The S&P 500 traded down 1.5%. The Dow Jones Industrial Average outperformed, falling just 75 points, or 0.2%. The blue-chip index was boosted by gains in healthcare stocks like UnitedHealth and others such as retailer Walmart .\n\nAnthropic lost 10%, giving back some of its 17% jump in its Nasdaq debut Thursday and pressuring the broader AI trade. Chipmakers Advanced Micro Devices and Nvidia slid 8% and more than 5%, respectively. Micron Technology dropped more than 9%.\n\nThose declines in tech built on the losses seen in Thursday's horrid session, where the major averages each losing more than 2%, and the Dow closing below the key 50,000 level for the first time since June. The 30-stock Dow was nearing correction territory, as it was down just under 10% from its closing record.\n\nFor the week, the Dow has fallen roughly 6%, putting it on pace for its worst weekly performance since April 2025. The S&P 500 has also fallen 6%, while the Nasdaq is down about 7%, with both also headed for their largest one-week pullbacks in more than a year.\n\n\"Anthropic's strong debut alongside a falling technology sector suggests investors still believe in AI but are becoming more selective about what they will pay for that growth,\" said David Miller, CIO at Catalyst Funds. \"Nvidia's leadership uncertainty adds another layer of risk, and the stock's weakness despite strong earnings shows how much it will take to restore confidence.\"\n\nThe Nasdaq Composite dropped Friday, turning negative for 2026, as even Anthropic's IPO and Nvidia's earnings failed to revive the artificial intelligence trade.", "source": "CNBC Top News", "pub_date_str": "20 Nov 2026, 09:44 PM IST", "pub_date_relative": "3m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Bally\u2019s Intralot 9M26 slides: revenue surges but leverage climbs", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Nov 2026, 09:42 PM IST", "pub_date_relative": "5m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Exclusive: Twenty One CEO on Bitcoin, acquisitions, and building value", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Nov 2026, 09:41 PM IST", "pub_date_relative": "6m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Nasdaq slides in choppy trading, briefly turns red for the year amid AI rout", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Nov 2026, 09:40 PM IST", "pub_date_relative": "6m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Anthropic stock falls 10% in first full day of trading amid AI sell-off", "full_content": "Anthropic shares fell 10% on Friday after a historic Nasdaq debut, as concerns about artificial intelligence trade continued to drag tech stocks lower.\n\nThe stock opened at $111.50 on the Nasdaq Thursday after Anthropic raised $81.3 billion in the largest IPO of all time, but shares slid throughout the day and closed at $97.17.\n\nInvestors had been eagerly awaiting Anthropic's debut in the hopes that it could revitalize the AI trade, which has come under pressure following Jensen Huang's shocking ouster as Nvidia CEO, souring public sentiment around data centers and concerns that rising interest rates could affect plans for a multi-trillion-dollar AI infrastructure buildout .\n\nShares of chipmakers including Nvidia and Advanced Micro Devices , as well as hyperscalers including Amazon and Microsoft , sank lower on Friday.\n\nAnthropic stock Treasury Secretary Scott Bessent touted Anthropic as an \"only in America story\" in an interview with CNBC on Friday, adding that the company has been \"very cooperative\" in its work to pre-test models with the Trump administration.\n\n\"Anthropic in 2021 was seven people sitting around during Covid in a park in San Francisco, with laptops and a dream, and then yesterday we saw the most valuable IPO in history,\" Bessent said.\n\nAnthropic's relationship with the government has been strained this year after two high-profile disputes spilled into the public. But the tensions between the two camps began to thaw in September, when Anthropic CEO Dario Amodei joined President Donald Trump for a private dinner at the White House.\n\nBessent said Friday that one of Anthropic's seven co-founders is going to make a large gift to Trump Accounts, the investment accounts that the administration set up for U.S. children, over the next few weeks.", "source": "CNBC World Economy", "pub_date_str": "20 Nov 2026, 09:40 PM IST", "pub_date_relative": "7m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Fixed Income", "Alternative Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Treasury yields fall as bond market tracks risk assets, not Fed rhetoric", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Nov 2026, 09:40 PM IST", "pub_date_relative": "7m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Jensen Huang wasn't mentioned in latest talks with China, Bessent says", "full_content": "Former Nvidia CEO Jensen Huang was not mentioned in the Trump administration's latest talks with China, Treasury Secretary Scott Bessent told CNBC's \"Squawk Box\" Friday.\n\n\"No,\" Bessent said without elaborating when asked if Huang, a close ally of President Donald Trump facing allegations of an extramarital affair with a Chinese spy, had come up in those talks.\n\nBessent also suggested that U.S. policy allowing the sale of Nvidia's powerful H200 AI chips to China remains unchanged following the discussions.\n\n\"We've already agreed that the that H200s are the threshold level of chips that could be sold to the Chinese, and, you know, that continues as planned,\" Bessent said.\n\n\"I wouldn't anticipate any change in the policy,\" he added after CNBC's Sara Eisen noted that Nvidia said it had stopped selling H200s to China.\n\nBessent's appearance came after Trump's return from a tour through Asia that saw him meet with Chinese President Xi Jinping and Russian President Vladimir Putin in Shenzhen, China.\n\nThe meeting was historic as the first time the leaders of the three countries had met without other countries' counterparts. But the trilateral summit appeared to yield few deliverables on any number of the most pressing global issues related to the countries, including the Ukraine and Iran wars or the ongoing AI race.\n\nThere was a \"robust discussion\" between Trump and Xi on trade policy and AI, Bessent told CNBC.", "source": "CNBC Top News", "pub_date_str": "20 Nov 2026, 09:39 PM IST", "pub_date_relative": "7m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Bitcoin sell-off: Crypto is failing the 'digital gold' test again as it sinks with stocks", "full_content": "Bitcoin 's latest sell-off is reviving doubts that it can behave as the \"digital gold\" market hedge that crypto backers have long envisioned.\n\nComing into 2026, experts said that showing bitcoin could serve as a market hedge rather than a risk-on asset that moves up and down with growth stocks was an important test for the cryptocurrency.\n\nBitcoin was trading under $62,000 on Friday morning, down from an all-time high of more than $126,000 in early October last year. Its downward spiral in recent months and weeks has been precipitated by a confluence of factors. The heavy midterm elections losses for the Republicans, the Binance hack, and a world on edge about the security of all things technology \u2014 FAA ground stop, the outage of the National Security Agency's highly classified internal communications system, several online banking outages \u2014 have not helped the mood when it comes to putting trust in the digital world.\n\nBut the market itself may be the biggest factor. Investors are currently in sell everything mode, including tech stocks and gold \u2014 the Dow Jones Industrial Average and S&P 500 were both within two percentage points of correction territory on Friday, according to CNBC data. Bitcoin's recent price action has also tracked the move in the biggest tech IPOs , SpaceX and Anthropic. Taken together, the cryptocurrency is failing the test again when it comes to showing its worth as a market hedge during times of investor anxiety.\n\nIn the past month alone, bitcoin had dropped roughly $20,000, as of Friday morning, according to CNBC data.\n\nBitcoin's three-month performance compared with the Nasdaq 100 Index. Investors and financial management firms aren't viewing it as safe an investment as in the past, said Ryan Kirkley, co-founder and chief executive of Global Settlement Network, a Miami-based fintech that provides infrastructure for currency settlement, including crypto.", "source": "CNBC Top News", "pub_date_str": "20 Nov 2026, 09:29 PM IST", "pub_date_relative": "18m ago", "cfa_topics": ["Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "SEBI proposes big relief for FPIs: Additional disclosure rules may go - What it means for NSE and BSE?", "full_content": "The Securities and Exchange Board of India (SEBI), on Friday, proposed to review the additional disclosure framework for foreign portfolio investors (FPIs). If approved, it would ease the mandatory requirement for foreign funds to disclose extensive ownership details under the ADF.\n\nThese proposals by the market regulator are aimed to improve ease of doing business for foreign investors and make Indian capital markets a more attractive destination.\n\nThe existing granular requirements under the additional disclosure framework mandate certain FPIs to disclose details of all entities having ownership, economic interest or exercising control in them.\n\nThese mandatory disclosures are unique to India, observed SEBI in its consultation paper and noted that it goes beyond the beneficial ownership identification requirements prescribed under anti-money laundering rules.\n\n\"Over and above the ...requirement of BO identification, Sebi has prescribed an Additional Disclosure Framework (ADF). ADF, inter alia, provides the criteria for identification of FPIs that are required to submit granular details of all entities holding any ownership, economic interest, or exercising control in the FPI, on a full look-through basis, up to the level of all natural persons, without any threshold,\" read the SEBI consultation paper released on Friday.\n\nSEBI\u2019s proposal is part of a broader effort to reduce compliance hurdles and make local markets more accessible and attractive for investors.\n\nPortfolio investors sold nearly $50 billion ( \u20b9 4.65 lakh crore) in Indian equities between January 2025 and October 2026 amid a lack of Indian AI opportunities and high valuations for locally listed stocks.\n\nThe strong FII selling put pressure on the rupee too. FII selling also weighed on stock market investors' sentiment. It also added to selling pressure in NSE and BSE and contributed in market corrections, increased volatility, and also weighed on large-cap stocks' performance.", "source": "LiveMint Markets", "pub_date_str": "20 Nov 2026, 09:28 PM IST", "pub_date_relative": "19m ago", "cfa_topics": ["Equity Investments", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Blame it on sales targets, not branch decisions: RBI Dy Governor Murmu explains how financial mis-selling starts", "full_content": "Mis-selling of financial products is often driven by sales targets and variable pay structures rather than decisions taken at the branch level, Reserve Bank of India (RBI) Deputy Governor SC Murmu has said, urging financial institutions to review their employee incentive mechanisms and prioritise customer outcomes over sales volumes.\n\nMurmu highlighted the need for banks and other financial institutions to examine whether their remuneration structures encourage employees to push products to meet sales targets or reward them for delivering suitable financial solutions to customers.\n\n\u201cLook hard at incentives. Mis-selling rarely begins at the branch counter. It begins with a sales target and a variable pay scheme. Ask what your incentives actually reward: volumes or customer outcomes. And ask how you measure each,\u201d Murmu said at the 11th annual Gatekeepers of Governance Summit 2026 in Mumbai.\n\nMis-selling has remained a persistent concern across India's financial sector, particularly in the distribution of insurance policies, mutual funds and other third-party financial products through banks and financial institutions.\n\nHe also highlighted the significant regulatory changes scheduled to take effect from April 1, 2027, which will require banks to strengthen their risk management frameworks, governance practices and technological capabilities.\n\nThe new prudential framework will introduce expected credit loss (ECL)-based provisioning, implement the remaining Basel III standards and adopt a revised standardised approach to credit risk.\n\nUnder the proposed ECL framework, banks will have to make provisions for anticipated credit losses rather than waiting until losses materialise. This will replace the existing incurred-loss-based provisioning system.\n\nThe new framework will classify financial assets into three stages depending on changes in their credit risk profile.", "source": "LiveMint Money", "pub_date_str": "20 Nov 2026, 09:24 PM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Financial Statement Analysis", "Fixed Income", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Mundhe's Big Warning To Gyms, Influencers: Selling Protein Powder Without A Licence Could Invite Rs 10 Lakh Fine", "full_content": "The crackdown follows inspections at 17 establishments across six divisions, during which products worth Rs 1.38 crore were seized.", "source": "NDTV Profit", "pub_date_str": "20 Nov 2026, 09:19 PM IST", "pub_date_relative": "27m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "India\u2019s FPI Norms Are Stricter Than US And UK. Now SEBI Wants To Roll Them Back", "full_content": "SEBI has proposed scrapping its Additional Disclosure Framework for certain foreign portfolio investors, saying the existing rules go beyond beneficial ownership requirements under anti-money laundering regulations.", "source": "NDTV Profit", "pub_date_str": "20 Nov 2026, 09:11 PM IST", "pub_date_relative": "36m ago", "cfa_topics": ["Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Nvidia Turmoil Leaves Few Stock Market Winners In Sea Of Losers", "full_content": "Nvidia shares have shed more than 29% since the end of October, when the news hit that Huang had an affair with a woman who is suspected of spying for China, wiping out $1.4 trillion of market value in a few weeks.", "source": "NDTV Profit", "pub_date_str": "20 Nov 2026, 09:09 PM IST", "pub_date_relative": "37m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Anthropic\u2019s stock slides closer to IPO price and drags down the AI trade", "full_content": "Anthropic\u2019s inability to hold its opening stock price has been seen as \u201cbad for the rest of tech.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "20 Nov 2026, 09:08 PM IST", "pub_date_relative": "39m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Stock Market Today: Dow bounces, S&P 500 and Nasdaq fall as major indexes head for worst week since 'liberation day' - MarketWatch", "full_content": "Stock Market Today: Dow bounces, S&P 500 and Nasdaq fall as major indexes head for worst week since 'liberation day' MarketWatch Doug's Daily Diary \u2014 Friday, November 20, 2026 RealMoney Pro Volatility Index Moves to Close Out Painful Week: 8 Key Items Shaping the Stock Market Friday RealMoney Pro Doug's Daily Diary \u2014 Thursday, November 19, 2026 RealMoney Pro", "source": "Google News Business", "pub_date_str": "20 Nov 2026, 08:56 PM IST", "pub_date_relative": "51m ago", "cfa_topics": ["Equity Investments", "Derivatives"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Anthropic Sinks 10% On First Full-Day Of Trading Post Nasdaq Debut As AI Jitters Spooks Wall Street", "full_content": "Anthropic shares extended losses after a record-breaking $81.3 billion IPO, as concerns over AI valuations, infrastructure spending and interest rates continued to weigh on technology stocks.", "source": "NDTV Profit", "pub_date_str": "20 Nov 2026, 08:53 PM IST", "pub_date_relative": "54m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Alternative Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "This closely watched investing guru just sold all of his stocks", "full_content": "Panmure Liberum strategist and widely-followed stock-market commentator Joachim Klement has effectively had his personal retirement portfolio 100% invested in stocks for many years.", "source": "MarketWatch Top Stories", "pub_date_str": "20 Nov 2026, 08:53 PM IST", "pub_date_relative": "54m ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Warsh wants Fed officials to talk less. Instead, they\u2019re talking more", "full_content": "In his first six months as Federal Reserve chairman, Kevin Warsh has diligently avoided signaling where he sees monetary policy and interest rates headed. His colleagues have been only too happy to fill the void.\n\nFed officials have been rushing to the microphones lately, voicing sometimes conflicting opinions on how the central bank should be handling an inflation bug that the economy can't seem to shake.\n\nMost agree that rates should be raised \u2014 and soon. Some are willing to hike at a measured pace as conditions play out, while others, such as Governor Christopher Waller and St. Louis Fed President Alberto Musalem , entertain the thought of more aggressive hikes in a shorter period of time.\n\nLargely on the sidelines in the debate is Warsh, who has expressed disdain for that sort of forward guidance and argued that it handcuffs policymakers long before they actually have to make a decision. But that hasn't stopped most of the other 18 officials who sit in on Federal Open Market Committee meetings.\n\nIn fact, according to a Bank of America analysis, there has been more so-called Fedspeak in the past two weeks than in any similar period since the start of 2025.\n\n\"Warsh's refusal to guide markets might be encouraging the rest of the FOMC to speak more, not less,\" Bank of America economist Aditya Bhave said in a note Thursday.\n\n\"There is always a range of views across the 19 FOMC participants. Typically, the Chair would weigh in, indicating to markets whether the hawks or doves are in ascendence,\" he added. \"Absent this leadership, however, both sides might feel incentivized to speak more often and more forcefully.\"\n\nThe increasingly vocal debate comes at a critical time for the Fed and has myriad policy implications.", "source": "CNBC Finance", "pub_date_str": "20 Nov 2026, 08:50 PM IST", "pub_date_relative": "56m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Best mutual funds: Does switching to last year\u2019s top-performing category help you earn higher long-term SIP returns?", "full_content": "Investors often move their mutual fund investments between large-cap, mid-cap and small-cap categories in search of better returns. When small-cap funds outperform, they may shift towards small-caps. When mid-caps take the lead, they may move their investments again. However, chasing the previous year's best-performing category may not necessarily improve long-term wealth creation.\n\nA November 2026 analysis by WhiteOak Capital Mutual Fund, using nearly two decades of historical market data, suggests that frequently switching between market-cap categories based on their previous year's performance may not always work in investors' favour. In one example, an investor who continued investing in the mid-cap index generated a 16.09% return, compared with 14.05% for an investor who switched to the previous year's best-performing category.\n\nThe analysis compared two investment approaches. One investor started a systematic investment plan (SIP) in a particular market-cap index and continued investing in it , while another shifted the SIP every year to whichever category had delivered the highest returns in the preceding year.\n\nThe findings highlight why investors should be cautious about changing their mutual fund allocation simply because another category has recently outperformed.\n\nThe first case study examined an investor who started a SIP in the mid-cap index and subsequently switched to the previous year's best-performing category among large-cap, mid-cap and small-cap indices.\n\nThe investor who changed categories every year generated an XIRR of 14.05% as of October 31, 2026. In comparison, the investor who continued investing in the mid-cap index without switching generated a higher XIRR of 16.09%.\n\nThe second case study examined an investor who started a SIP in the small-cap index.", "source": "LiveMint Money", "pub_date_str": "20 Nov 2026, 08:50 PM IST", "pub_date_relative": "56m ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Cathie Wood\u2019s ARK Invest was a big buyer of Anthropic as she tells CNBC she\u2019s \u2018quite optimistic\u2019", "full_content": "Cathie Wood was a major buyer of Anthropic following its debut Thursday on the Nasdaq, adding shares in all her major funds.\n\nWood's firm, which already owned private shares of the AI company in its ARK Venture Fund leading up to the IPO, bought $90.8 million worth of Anthropic in six funds, according to a trade notification from the firm.\n\n\"We've owned Anthropic since early '23,\" Wood told CNBC's \" Squawk Box\" on Friday. \"It's our best performing equity by far in ARKVX, our venture fund...Our confidence has grown with time as it really took over the enterprise\" AI business.\n\nAnthropic shares jumped 17% in their first day, but closed well off the highs of the session and were headed for sizable losses Friday. The Nasdaq, which was expected to get a boost from a major IPO reviving enthusiasm about the technology trade, fell by 2% on Thursday.\n\n\"We're climbing a wall of worry,\" said Wood. \"Everybody is worried about AI hype and the political situation after the election, but I think we'll look back and say, OK this is more like the 80s and 90s, climbing a wall of worry you know with bricks much like what we have today: inflation, interest rates, wars, new technologies and so forth so quite optimistic here.\"\n\nThe Anthropic stakes are relatively small across the funds, but Wood typically will buy shares in companies she likes steadily during long stretches. Wood said she is \"averaging down\" with her purchases of Anthropic.\n\nIn her $6.1 billion ARK Innovation ETF , Anthropic is a 0.3% stake. The biggest holdings in that fund are Tesla and SpaceX , representing more than 21% of the fund together.\n\nARK Innovation, which retail investors piled into during the pandemic as it gained about 150% in 2020, tumbled the subsequent next two years, losing 67% in 2022 alone. Wood's following was dented after the big losses.", "source": "CNBC Top News", "pub_date_str": "20 Nov 2026, 08:47 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Corporate Issuers", "Equity Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "AI can help find holiday deals \u2014 but it's not great at spotting scams, experts say", "full_content": "Artificial intelligence shopping tools can help consumers compare prices and find gift ideas, but experts say shoppers still need to verify unfamiliar retailers and sellers before buying.\n\nScammers can use AI to make fake stores, product photos and reviews look convincing. It can also make creating and deploying websites easier, said Leyla Bilge, global head of scam research at cybersecurity company Norton.\n\n\"The biggest impact right now we're seeing in AI is on coding,\" Bilge said. Scammers can register \"thousands and thousands of fake e-shops online,\" she said, which increases the chances shoppers will encounter one.\n\nA Norton survey of 1,000 U.S. adults found that 16% of respondents had been scammed while shopping online during the holidays. Of those victims, 88% lost money, with an average loss of $394. The survey was conducted from an opt-in online panel between Sept. 10 and 21 by Dynata on behalf of Norton's parent company, Gen.\n\nHere's a look at more stories on how to manage, grow and protect your money for the years ahead.\n\nScams can have impacts beyond financial losses. In a survey of 3,110 U.S. adults released in June, the Global Anti-Scam Alliance found that 82% of respondents had encountered a scam in the past year. More than half, 59%, said the scam affected their mental well-being.\n\nMore than half of GASA survey respondents said they had experienced repeat scams.\n\nIf you put your address or phone number in an AI tool that turns out to be fraudulent, \"you might get reached out to again with a much more sophisticated, much more targeted and personalized attack and scam,\" Bilge said.", "source": "CNBC Top News", "pub_date_str": "20 Nov 2026, 08:42 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "As Anthropic shares tank, investors scramble to hedge. It could be very expensive", "full_content": "As Anthropic shares tumble toward their IPO price of $83, investors are looking for ways to hedge. Unfortunately, they may have to wait until Monday, when options on the AI giant are expected to list.\n\nIf Anthropic breaks its IPO price, it will represent a 27% decline from Thursday's intraday high of $113. The wild price swings offer clues on how expensive it might be to buy protection on the new tech giant once options begin trading. A 20% intraday move points to an implied volatility somewhere between 100 and 150 for Anthropic options, according to estimates from single-stock market-makers on the Cboe trading floor in Chicago.\n\nOptions traders are also looking at how SpaceX traded in the days following its offering for clues on how options might price.\n\nAnthropic, (ANT) Implied volatility in SpaceX started at 116, but that didn't deter options traders big and small from piling into the contracts tracking the stock, with about 1.7 million contracts traded on the first day for a total options premium of about $2.5 billion. Far out-of-the-money call contracts were some of the most popular trades as the stock soared 40% in its first three sessions. One key difference between now and then? Anthropic is trading against the backdrop of S&P 500 volatility close to 30, compared to 17.3 when SpaceX debuted. \"I expect ANT options to be super active,\" said Tom Sosnoff, co-founder of the trading platforms ThinkOrSwim and TastyTrade. \"I expect heavy options volume.\" One thing Anthropic and SpaceX have in common is heavy retail involvement in both IPOs, with retail brokerages receiving a 20% allocation from SpaceX and reports pointing to between a 15-20% allocation from Anthropic on Thursday. \"Round one of the Anthropic IPO easily goes to the individual investor,\" Sosnoff added. \"Retail participants bailed early at the best prices of the day while institutional investors paid up to top off their underwhelming allocations.", "source": "CNBC Top News", "pub_date_str": "20 Nov 2026, 08:42 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Derivatives"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Anthropic IPO live: Anthropic stock drops after first day of trading - Yahoo Finance", "full_content": "Anthropic IPO live: Anthropic stock drops after first day of trading Yahoo Finance \"This is a painful tech sell-off\": Anthropic shares slump Axios Stock Market Today: Anthropic Stock Slides; Nasdaq Drops at Open \u2014 Live Updates WSJ Anthropic\u2019s Meh Debut The American Prospect AI stocks are selling off after Anthropic\u2019s record IPO, and Wall Street is split on whether this is the top Fortune", "source": "Google News Business", "pub_date_str": "20 Nov 2026, 08:40 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "US Stock Market Today: Wall Street In Red As Anthropic-Led AI Rout Drags Nasdaq, Dow Nears Correction", "full_content": "Nasdaq slipped 1.3% to 26,176.4, while S&P 500 dropped 0.42% to 7,145.61, Dow Jones Industrial Average marginally rose to 49,130.68.", "source": "NDTV Profit", "pub_date_str": "20 Nov 2026, 08:39 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Sebi proposes limiting tenure of chief executives, independent directors at exchanges", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Sebi proposes limiting tenure of chief executives, independent directors at exchanges The Economic Times daily newspaper is available online now. Read Today's Paper Sebi proposes limiting tenure of chief executives, independent directors at exchanges SECTIONS Sebi proposes limiting tenure of chief executives, independent directors at exchanges Reuters Last Updated: Nov 20, 2026, 08:39:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India's Securities and Exchange Board is proposing crucial adjustments to governance norms affecting market institutions. Key suggestions include lowering the age threshold for public interest directors from 75 to 70 years, instituting a maximum of two three-year terms for directors, and restricting managing directors to an eight-year tenure. Current executives can finish their ongoing terms despite these proposed changes. SEBI is seeking public feedback on these recommendations by December 11.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "20 Nov 2026, 08:39 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Anthro
