<script>

    const allData = {"general": [{"title": "HCL Tech vs TCS Q2 results dividend: Which IT stock offers more? Amount, record date, yield, earnings compared", "full_content": "HCL Tech vs TCS Q2 results dividend : Tata Consultancy Services and HCL Technologies have announced their second quarter results for the financial year 2026-27. The tech giants have also announced a dividend for the quarter.\n\nFor investors who closely track dividend payouts for IT, here are all the details to know.\n\nBoth the IT companies have announced equal payouts in Q2FY7. HCL Tech on Monday, October 12, announced an interim dividend of \u20b9 12 per equity share with a face value of \u20b9 2 each. Whereas, TCS board recommended and approved \u20b9 12 interim dividend with face value of Re 1 each.\n\nTCS has fixed Wednesday, October 14 as the record date to determine the eligibility of shareholders for the payout.\n\n\u201cThe second interim dividend, if declared, shall be paid to the equity shareholders of the Company whose names appear in the Register of Members of the Company or in the records of the Depositories as beneficial owners of the shares as on Wednesday, October 14, 2026, which is the Record Date fixed for this purpose,\u201d stated the firm in its BSE filing before the Q2 result announcement.\n\nHCL Tech\u2019s board of directors has fixed October 16 as the record date to determine the eligibility of shareholders for the payout. \u201cThe Record date for the payment of the aforesaid interim dividend shall be October 16, 2026, and the payment date of the said interim dividend shall be October 26, 2026.\u201d\n\nHCL Tech has declared a total of \u20b9 60 per equity share with a face value of \u20b9 2 each in the last one year. The IT stock has a dividend yield of 4.10% in FY26. Tata Consultancy Services Limited has declared a three digit dividend over the last one year. With \u20b9 111 dividend announced for every share with a face value of Re 1 each, TCS dividend yield stood at 4.7% for FY26.\n\nThe IT heavyweight\u2019s consolidated net profit after tax (PAT) came in at \u20b9 5,132 crore in Q2FY27, 21% higher than \u20b9 4,236 crore reported in Q2FY26. HCL Tech had reported a net profit of \u20b9 4626 crore in Q1FY26.", "source": "LiveMint Markets", "pub_date_str": "12 Oct 2026, 10:20 PM IST", "pub_date_relative": "2m ago"}, {"title": "FAA warns U.S. airlines of safety risks over Saudi Arabia after attacks", "full_content": "The Federal Aviation Administration told U.S. airlines to exercise caution when flying in or around Saudi Arabia after deadly attacks claimed by Yemen's Iran-backed Houthis, which have shut down the airport in the Saudi capital.\n\nKing Khalid International Airport in Riyadh, Saudi Arabia, remains closed as of Monday after strikes that started last week. The attacks escalated Saturday, when a projectile struck a passenger terminal at the airport, officials said, killing at least 12 people and wounding more than 300.\n\nAirlines suspended flights to the airport, some for the rest of the week.\n\nThe U.S., Australia and other countries advised citizens against travel to the region.\n\nThe FAA late Sunday said pilots should \"exercise caution\" in or around Saudi Arabia \"due to safety-of-flight risks associated with ongoing military activities\" and navigation systems. It said the threats could be a potential risk \"to aircraft at all altitudes.\" The FAA's warning is in effect until Dec. 10.\n\nMost U.S. airlines don't fly to Saudi Arabia, but the country's flights and passenger counts had climbed in recent years. The route between Riyadh to Jeddah in the country's west was the fifth-busiest in the world last year, according to aviation-data firm OAG.\n\nDelta Air Lines had been scheduled to launch its first nonstop flight from Atlanta to Riyadh on Oct. 23 but the carrier on Monday said it would delay that service until March.", "source": "CNBC Top News", "pub_date_str": "12 Oct 2026, 10:20 PM IST", "pub_date_relative": "2m ago"}, {"title": "These stocks could be the future winners \u2014 and losers \u2014 of a massive shift in IT spending", "full_content": "As more money flows toward AI software offerings, Salesforce could deepen its customer relationships while Adobe looks vulnerable, analysts say.", "source": "MarketWatch Top Stories", "pub_date_str": "12 Oct 2026, 10:17 PM IST", "pub_date_relative": "6m ago"}, {"title": "Willamette Valley Vineyards CEO Michael Osborn buys $19,064 in stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "12 Oct 2026, 10:16 PM IST", "pub_date_relative": "7m ago"}, {"title": "Stocks making the biggest moves midday: eBay, Sandisk, Meta Platforms, IonQ, Lumentum & more", "full_content": "Here are some of the companies making headlines in midday trading.", "source": "CNBC Top News", "pub_date_str": "12 Oct 2026, 10:13 PM IST", "pub_date_relative": "10m ago"}, {"title": "UnitedHealth shares are doing something unusual ahead of earnings", "full_content": "The only thing more expensive than health insurance is perhaps the costs of insuring shares of health insurers. Case in point: UnitedHealth Group, which reports earnings Tuesday.\n\nImplied volatility is running at twice realized volatility ahead of the October 13 quarterly earnings release. In other words, options prices - the cost of insuring the underlying stock - are expensive, which sets up well for short premium strategies.\n\nIn the case of UnitedHealth shares, traders can sell November premium to cut the cost of a longer-dated January call by more than half. UnitedHealth heads into Tuesday's report with much of the damage from its prior missteps already priced in. While rising healthcare costs always remain a headwind, management's 13% to 16% EPS growth target looks achievable. The stock has basically been flat over the last five years.\n\nBy the way, according to the company, 90% of United's 52 million customers worldwide are in the U.S. By its own statistics, the company covers about 12% to 13.5% of the U.S. population.\n\nGrowing enrollment is critical to EPS growth, but so too is underwriting margin. In the managed care and health insurance business, underwriting margin represents the core operational profitability generated directly from managing healthcare risk. It measures the financial return an insurer achieves strictly from collecting premiums and managing medical care. On the enrollment side, ACA marketplace-driven enrollment appears poised to decline, a headwind for revenue in a segment that had been a growth driver. Fortunately, it's a smaller piece of the enterprise than Medicare and Commercial. Commercial fee-based enrollment grew ~2.9% YoY between 2024 and 2025, while total Medicare enrollment grew 4.5%. The commercial segment growth may not look impressive as a headline number, but given the U.S.", "source": "CNBC Top News", "pub_date_str": "12 Oct 2026, 10:12 PM IST", "pub_date_relative": "11m ago"}, {"title": "LVMH fashion and leather sales slide in Q3, dashing sector hopes", "full_content": "Luxury bellwether LVMH on Monday reported worse-than-expected third-quarter organic sales growth as demand for its fashion and leather brands, including Louis Vuitton and Dior, deteriorated due to weak Chinese demand.\n\nThe trading update from the world's largest luxury group, and the first major sector player to report third-quarter results, is likely to heighten concerns that the $350 billion luxury industry, mired in a three-year slowdown, will struggle to regain momentum.\n\nOrganic sales, which strip out currency swings, rose 1% from a year earlier to \u20ac18.5 billion ($20.7 billion), missing analysts' expectations for growth of 1.3%, according to a Visible Alpha consensus.\n\nThe fashion and leather goods division, which generates nearly half of group revenue, posted a 5% fall in organic sales, against an expected 1.8% decline.\n\nEurope's leading luxury groups have lost around \u20ac330 billion in market value since the start of the year, with LVMH alone shedding roughly 40%.\n\nSales in Asia, dominated by China, fell 5% from a year earlier, while sales in the US rose 5%.\n\n\"In the third quarter specifically, Asia was penalised by a sharp macro-led deterioration in Chinese consumer sentiment, with a tangible impact on discretionary expenses,\" Chief Financial Officer Cecile Cabanis told analysts.\n\nChina's tax crackdown on wealthy individuals has become the latest headache for luxury brands, which are already grappling with the fallout from the Iran war and signs of slowing consumer spending in the US.", "source": "CNBC Top News", "pub_date_str": "12 Oct 2026, 10:12 PM IST", "pub_date_relative": "11m ago"}, {"title": "Buying gold this festive season? Check tax rules on cash purchases, PAN requirement and limit on holding gold at home", "full_content": "Gold purchases typically pick up during the festive season in India, with many households buying jewellery, coins and bars for investment or as part of tradition. This uptick demand is often witnessed during Akshaya Tritiya and Dhanteras, as buying gold is considered auspicious on these occasions.\n\nWhile there is no blanket limit on how much gold a person can legally own, tax authorities may scrutinise holdings if the source cannot be explained. Here's what you need to know about tax rules on cash purchases, PAN requirement and the limits on holding gold at home without having to produce proof.\n\nIndia does not ban buying gold using cash, but it does restrict the amount that can be accepted in cash in certain circumstances. However, the burden of this compliance requirement lies on the seller and not the buyer.\n\nUnder Section 269ST of the Income-tax Act, an individual cannot receive \u20b9 2 lakh or more in cash in a single transaction, in a single day from one person, or in respect of transactions relating to one event or occasion. The same set of restrictions apply to gold purchases as well.\n\nThe rule is designed to prevent people from bypassing the cash limit by splitting payments across multiple invoices or days for the same purchase. Under Section 271DA, the penalty for violating this provision can be equal to the amount received in breach of the rule, and it is levied on the recipient.\n\nFor gold purchases made in cash, the recipient is the jeweller, giving them a strong incentive to refuse cash payments for high-value items.\n\nWhen the transaction value crosses \u20b9 2 lakh, jewellers are required to ask buyers to provide their Permanent Account Number ( PAN ) card for reporting and compliance purposes, as per income tax rules.\n\nProviding PAN does not override the restrictions on cash transactions. From 1 April 2026, Form 97 replaced the previous Form 60 for certain declarations by individuals who do not have a PAN.", "source": "LiveMint Money", "pub_date_str": "12 Oct 2026, 10:11 PM IST", "pub_date_relative": "12m ago"}, {"title": "Cramer: Starbucks tells me Chipotle takeover won't happen and that's good for the stock", "full_content": "The Investing Club holds its \"Morning Meeting\" every weekday at 10:20 a.m. ET.", "source": "CNBC Top News", "pub_date_str": "12 Oct 2026, 10:07 PM IST", "pub_date_relative": "15m ago"}, {"title": "European stocks rise despite Middle East tensions", "full_content": "", "source": "Investing.com News", "pub_date_str": "12 Oct 2026, 10:06 PM IST", "pub_date_relative": "16m ago"}, {"title": "Renaissancere Holdings Ltd stock hits all-time high at 340.3 USD", "full_content": "", "source": "Investing.com News", "pub_date_str": "12 Oct 2026, 10:06 PM IST", "pub_date_relative": "16m ago"}, {"title": "Exclusive-Moonshot execs in talks to settle dispute with shareholder ahead of planned IPO, people say", "full_content": "", "source": "Investing.com News", "pub_date_str": "12 Oct 2026, 10:06 PM IST", "pub_date_relative": "17m ago"}, {"title": "RBL Bank Q2 Results: Net Profit Nearly Triples To Rs 482 Crore, Asset Quality Improves", "full_content": "RBL Bank Q2 Results: RBL Bank announced its July-September quarter results for fiscal 2026-27 on Monday, Oct. 12 reporting a surge of 1705 in its standalone net profit to Rs 482 crore, compared to Rs 179 crore in the corresponding period last year.", "source": "NDTV Profit", "pub_date_str": "12 Oct 2026, 10:06 PM IST", "pub_date_relative": "17m ago"}, {"title": "Stock Market Today: Dow gains but S&P 500, Nasdaq slip as chip stocks dip and oil prices rise - MarketWatch", "full_content": "Stock Market Today: Dow gains but S&P 500, Nasdaq slip as chip stocks dip and oil prices rise MarketWatch Rising oil prices, falling technology stocks and reversing bond yields keep Wall Street unsettled AP News COMMENTARY: Morning Bid: Wall Street winces at bond squeeze Reuters U.S. Stocks Fall as Treasury Yields Test Multidecade Highs WSJ Stock Market News, Oct. 8, 2026: Oil Rises, Nasdaq Slips on Fresh Tanker Attack WSJ", "source": "Google News Business", "pub_date_str": "12 Oct 2026, 10:05 PM IST", "pub_date_relative": "18m ago"}, {"title": "Buy these stocks as plays on Google\u2019s big spending, analyst says", "full_content": "Google Cloud is growing fast, but several chip makers and networking providers could be better ways to capitalize on that trend, according to Melius Research.", "source": "MarketWatch Top Stories", "pub_date_str": "12 Oct 2026, 10:01 PM IST", "pub_date_relative": "22m ago"}, {"title": "US Republicans, Democrats want Trump to reverse course on Russia diesel", "full_content": "", "source": "Investing.com News", "pub_date_str": "12 Oct 2026, 10:00 PM IST", "pub_date_relative": "23m ago"}, {"title": "S&P 500 is little changed to start the week; Micron leads tech lower: Live updates", "full_content": "The S&P 500 was little changed on Monday after the major averages posted a winning week and as investors looked ahead to a busy week of earnings results and inflation data.\n\nThe broad market index traded below the flatline, while the Dow Jones Industrial Average outperformed, trading up 206 points, or 0.4%. The Nasdaq Composite , however, was 0.3% lower.\n\nThe Nasdaq was weighed down by a 3% drop in shares of Micron Technology . The move came as investors assessed increasing competition from China's CXMT , which reported progress on a new chip structure . In contrast, the Dow was boosted by a more than 1% rise in Salesforce shares after the name received a double upgrade at Bank of America .\n\nMeanwhile, oil prices rose after President Donald Trump announced an \"energy ceasefire\" between Russia and Ukraine over the weekend, then Ukrainian President Volodymyr Zelenskyy said Moscow had already violated it . West Texas Intermediate futures advanced 2% to around $93 per barrel. Brent crude gained 2% to trade at $106 per barrel.\n\nTrump also told reporters he was considering joining Saudi Arabia in its fight against Tehran-backed Houthis in Yemen after another deadly attack on Riyadh's international airport. The remarks raised the prospect of escalating tensions in the region.\n\nWall Street is coming off a winning week for the major averages, as a rally in tech stocks helped investors shrug off higher oil prices and yields. The Dow and S&P 500 each posted their second positive week in three, while the Nasdaq netted its fourth straight week of gains.\n\nInvestors hope the third-quarter earnings season will help stocks power through the Middle East turmoil. By all estimations, the incoming results are expected to be strong. According to FactSet's John Butters, the S&P 500 is set to post 29.6% earnings growth in the quarter.", "source": "CNBC Top News", "pub_date_str": "12 Oct 2026, 10:00 PM IST", "pub_date_relative": "23m ago"}, {"title": "Qualcomm Sells Nearly 1% Stake In Shadowfax Technologies For Rs 157 Crore", "full_content": "The shares were sold at an average price of Rs 275.30 per share, taking the deal value to Rs 157.28 crore.", "source": "NDTV Profit", "pub_date_str": "12 Oct 2026, 10:00 PM IST", "pub_da
