<script>

    const allData = {"general": [{"title": "Sugar is outperforming the stock market this year. Here's what's driving it, and where it can go from here", "full_content": "Sugar prices surged 21.5% in August, marking its strongest monthly gain since October 2010, when it rose 24%. The United Nation's Food and Agriculture Organization Food Price Index also rose in August amid broad-based increases, led by sugar.\n\n\"The surge reflected expectations of lower sugar beet yields in the European Union due to adverse weather, concerns over the impact of El Ni\u00f1o on production prospects in key producing countries in Asia, lower sugar production in Brazil, and India's announcement of duty-free raw sugar imports,\" the organization said in its recent report.\n\nThe August rally pushed sugar futures ahead of the S&P 500 on a year-to-date basis. The sweetener is now up about 20% in 2026, versus the nearly 13% advance for the broad market index.\n\nThe U.N.'s Food and Agriculture Organization points out that the sugar rally is tied to several factors, which are collectively pushing the prices in the market.\n\nThe sugar rally reflects a shift in expectations about global supply, according to William Osnato, Barchart director of commodity data research and analysis. Osnato told CNBC that the damage to Europe's sugar-beet crop during a summer heat wave was one of the biggest immediate factors.\n\nSugar beets are grown in the same places and around the same time as corn and wheat, and so the heat wave can significantly affect sugar production.\n\n\"That's been factored in over the last month. So a bunch of organizations lowered their production estimates,\" Osnato said.\n\nDifferent organizations have either slashed production estimates or increased deficit estimates in their recent reports. The European Commission's latest sugar balance sheet estimates a decline in EU production of 19% to 13.4 million metric tons, in the 2026/27 marketing year, from 16.6 million tons in 2025/26. Citi projected a world deficit of 1.3 million metric tons in a Tuesday note, and Green Pool Commodity Specialists estimated 3.2 million metric tons.", "source": "CNBC Finance", "pub_date_str": "06 Sep 2026, 06:49 PM IST", "pub_date_relative": "13m ago"}, {"title": "\u2018I\u2019m leaving money on the table\u2019: I\u2019m 64 and my husband is 70. Should I take spousal benefits or wait for my own?", "full_content": "\u201cI paid a significant amount into Social Security.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "06 Sep 2026, 06:45 PM IST", "pub_date_relative": "17m ago"}, {"title": "Meta Will Spend Millions for Teen Therapy. It\u2019s a Mistake. - The Free Press", "full_content": "Meta Will Spend Millions for Teen Therapy. It\u2019s a Mistake. The Free Press \u2018Wrongheaded and Perilous\u2019: 3 Writers on the Big Meta Ruling The New York Times It\u2019s time for Mark Zuckerberg to resign from Meta | Joan Donovan The Guardian How Meta will pull off massive changes to its social media apps CNBC Landmark Agreement is a Milestone Moment for Youth Mental Health gspublishing.net", "source": "Google News Business", "pub_date_str": "06 Sep 2026, 06:34 PM IST", "pub_date_relative": "27m ago"}, {"title": "OPEC+ keeps oil output policy unchanged for October", "full_content": "OPEC+ kept \u200bits oil output policy unchanged for October at a meeting on Sunday, it said in a statement, as the producer group needs to agree on new quotas before deciding its next output steps.\n\nThe meeting of seven core OPEC+ members \u2014 Saudi Arabia, Russia, Iraq, Kuwait, Algeria, Kazakhstan and Oman \u2014 comes as the Iran war continues to \u200bdisrupt oil exports through the Strait of Hormuz, limiting OPEC+'s influence over prices and market \u200bshare.\n\nIn August, OPEC+ agreed to its production boost for September, completing a phased rollback of a 1.65 million-barrel-per-day supply cut first agreed in 2023. Despite the agreed production increases, the group, made up of the Organization of the Petroleum Exporting Countries and its allies, including Russia, still produces far below its targets because of the war.\n\n\"OPEC+ currently has very limited power over the physical oil market,\" said Jorge Leon of Rystad Energy. \"The group can change production targets on paper, but it cannot guarantee that those barrels will be produced or actually reach the market.\"\n\n\"The focus now shifts away from monthly production adjustments and towards the much more consequential debate over 2027.\"\n\nOPEC+ still has another layer of production cuts in place, covering most members of the \u200b21-country group until the \u200bend of 2026. Before the group decides how to unwind the cuts and return production to the market, it needs to review members' oil production capacity to set 2027 output baselines, which form the basis for quotas.\n\nThis debate will likely happen later in 2026, and hence OPEC+ is likely to pause its output increases for the fourth quarter, sources earlier told Reuters. The statement on Sunday made no mention of policy beyond October.\n\nOnly the seven OPEC+ members who met on Sunday, plus the United Arab Emirates until it left OPEC in May, have been involved in monthly output decisions in recent years.", "source": "CNBC Top News", "pub_date_str": "06 Sep 2026, 06:34 PM IST", "pub_date_relative": "28m ago"}, {"title": "Investors to pore over inflation data for signals on rate trajectory", "full_content": "", "source": "Investing.com News", "pub_date_str": "06 Sep 2026, 06:30 PM IST", "pub_date_relative": "32m ago"}, {"title": "Is the U.S. losing its safe-haven status? Why global central banks are pulling gold out of New York.", "full_content": "What to know about safe havens and the U.S., as the Netherlands\u2019 central bank follows France in pulling gold out of New York.", "source": "MarketWatch Top Stories", "pub_date_str": "06 Sep 2026, 06:30 PM IST", "pub_date_relative": "32m ago"}, {"title": "Paint Makers Expect Healthy FY27 Demand Amid Price Hikes; Competition Intensity Remains High", "full_content": "Festive demand, price hikes and infrastructure spending offer growth support, but rising costs and fierce competition threaten to squeeze margins.", "source": "NDTV Profit", "pub_date_str": "06 Sep 2026, 06:28 PM IST", "pub_date_relative": "33m ago"}, {"title": "Expert View: Selective buying under the shell of Homruz & supply constraints, says Vinod Nair", "full_content": "The Sensex has corrected by 10.25% YTD while up 3.66% in the last 3months. During the year, one year forward valuation has corrected to 10% below the 5yrs average at 17.9x. The recent drawdown, -3.15% in the last 1month, look more driven by sentiment as earnings growth has been robust in Q1FY27. Stubborn crude prices and elevated global bond yields are dragging the reaction. While possible September Fed policy move is putting the global market on the toes as the probability has increased to 49%. The domestic risk-reward today is best described as selective with compelling opportunity in mid and small caps stocks after the consolidation during 2025-26 and revamp in earnings based on recent results. Buying is supported by value trade, and the small-cap indices touched a fresh intraday lifetime high on Friday.\n\nThough the valuation of India has contracted, it continues to command a huge premium over global emerging-market peers. Hence performance is vulnerable to the highly dependable crude prices which has turned volatile and persistent hawkish monetary position like Fed keeping which is keeping US yields elevated does drawing capital toward safety. RBI open-end narrative may reverse cautious in the next month policy as crude has climbed toward $95, highest since July. History offers a useful threshold: sustained higher Brent prices for a full quarter is roughly where India's macroeconomic math turns genuinely adverse. Estimated that every $10 per barrel increase in oil prices could widen India\u2019s current account deficit by about 0.35% of GDP, while inflation could rise by 20\u201330 basis points depending on retail fuel price pass-through.\n\nInvestors should indeed be watching the Q2-Q3 effects, Q1 was not affected to an extent in terms of both GDP and Corporate earnings. A prolonged oil shock would pressure the rupee, currently cushioned by RBI dollar sales and strong FCNR(B) inflows.", "source": "LiveMint Markets", "pub_date_str": "06 Sep 2026, 06:25 PM IST", "pub_date_relative": "37m ago"}, {"title": "We\u2019re in our 60s. We earn $345,000 and have $1 million in 403(b)s. Is it too late for Roth conversions?", "full_content": "\u201cRoth assets would provide our children with tax-free distributions.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "06 Sep 2026, 06:25 PM IST", "pub_date_relative": "37m ago"}, {"title": "These bystanders lifted a car to save a woman who was trapped underneath - The Washington Post", "full_content": "These bystanders lifted a car to save a woman who was trapped underneath The Washington Post See more headlines & perspectives on Google News", "source": "Google News Business", "pub_date_str": "06 Sep 2026, 06:22 PM IST", "pub_date_relative": "39m ago"}, {"title": "NSE IPO to US-Iran war: 3 reasons why Sensex, Nifty may see a flat-to-weak start on Monday | Indian markets outlook", "full_content": "Indian Stock Market | Sensex, Nifty outlook: The benchmark indices of the Indian stock market saw profit-booking at higher levels last week. On a weekly basis, the Nifty 50 index ended 1.15% lower, while the Sensex was down by 750 points. Among sectors, the Auto index lost the most, shedding over 3.8%, whereas the Oil and Gas index outperformed, rallying 1.30%. During the week, the market breached the crucial support zone of 24,000/76800. However, it showed a promising recovery from the 23,800/76100 level.\n\nAccording to stock market experts, pressure on these key Dalal Street indices may persist, and the Indian stock market may trade flat to negative in the near term. They said that the buzz around the mega \u20b9 30,000 crore NSE IPO , escalation in the Middle East tension due to the fresh US strikes in Iran and strong US bond yields are expected to keep the Indian stocks under pressure and the Nifty 50 may not see the 25,000 levels in June 2026.\n\nHighlighting the challenge posed by the NSE IPO for the Sensex, Nifty 50 and other indices of the Indian stock market, Sandeep Pandey, Co-founder of Basav Capital, said, \u201cThe NSE IPO is expected to catalyse a switch of money from the secondary market to the primary market. People remember that BSE has surged more than 7 times since its listing in 2017.", "source": "LiveMint Markets", "pub_date_str": "06 Sep 2026, 06:15 PM IST", "pub_date_relative": "47m ago"}, {"title": "Saudi Arabia stocks higher at close of trade; Tadawul All Share up 0.32%", "full_content": "", "source": "Investing.com News", "pub_date_str": "06 Sep 2026, 06:15 PM IST", "pub_date_relative": "47m ago"}, {"title": "Stock market new rules 2026: At NSE, pre-open session will be different from Monday - What has changed now?", "full_content": "Stock market new rules : The National Stock Exchange (NSE) will implement revised rules for its pre-open session from Monday, September 7, while retaining the existing session timings.\n\nUnder the new framework , the order-entry period will be divided into phases, with market orders restricted during the second phase. The changes are designed to align the pre-open session with the Securities and Exchange Board of India\u2019s (Sebi) introduction of the Closing Auction Session (CAS) in the equity cash market.\n\nThe revised norms also seek to improve coordination between the cash and derivatives segments and facilitate a smoother transition in market operations.\n\nFrom September 7, the 15-minute pre-open session , running from 9:00 AM to 9:15 AM, will be divided into phases.\n\n9:00 AM to 9:05 AM: Phase 1 will be conducted from 9:00 AM to 9:05 AM, allowing investors to enter, modify, or cancel both limit and market orders.\n\n9:05 AM to 9:10 AM : Phase 2 will take place from 9:05 AM to 9:10 AM, during which only limit orders can be entered, modified, or cancelled.\n\n9:10 AM to 9:12 AM : The order-matching and trade-confirmation session will now be held from 9:10 AM to 9:12 AM, replacing the existing 9:08 AM to 9:12 AM window. During this session, the opening price will be established, orders will be matched, and trades will be confirmed.\n\n9:12 AM to 9:15 AM : The buffer period from 9:12 AM to 9:15 AM will follow, facilitating a seamless transition from the pre-open session to regular continuous trading.", "source": "LiveMint Markets", "pub_date_str": "06 Sep 2026, 06:14 PM IST", "pub_date_relative": "48m ago"}, {"title": "Bigg Boss Kannada Season 13 Release: Date, Time, Host, Contestants, Where To Watch On TV, Online?", "full_content": "Bigg Boss Kannada 13 premieres on September 6 at 7 p.m., with weekday episodes at 9:30 p.m. on Colors Kannada and JioHotstar, followed by weekend episodes at 9 p.m.", "source": "NDTV Profit", "pub_date_str": "06 Sep 2026, 06:13 PM IST", "pub_date_relative": "48m ago"}, {"title": "'Non-Negotiable': India Warns UN-Backed Global Map Must Reflect Official J&K, Ladakh Borders", "full_content": "The release stated that the purpose of the resolution is to encourage the use of equal-area map projections that preserve the relative sizes of continental landmasses.", "source": "NDTV Profit", "pub_date_str": "06 Sep 2026, 06:05 PM IST", "pub_date_relative": "57m ago"}, {"title": "Arsenal vs Chelsea Live Streaming: Likely Lineups; How To Watch Premier League Match On TV, Online?", "full_content": "The Premier League 2026-27 match will be played at 9 p.m. Indian Standard Time on Sunday.", "source": "NDTV Profit", "pub_date_str": "06 Sep 2026, 06:00 PM IST", "pub_date_relative": "1h ago"}, {"title": "London-Bound Plane Makes 'Emergency Landing' At Bengaluru Airport After Technical Snag", "full_content": "A Virgin Atlantic flight from Bengaluru to London made an emergency landing at Kempegowda International Airport after developing a technical problem soon after take-off. The aircraft carried around 270 passengers and returned safely after circling near Tumakuru.", "source": "NDTV Profit", "pub_date_str": "06 Sep 2026, 05:59 PM IST", "pub_date_relative": "1h ago"}, {"title": "IN-SPACe Chairman Pawan Goenka Says India Aims For 50 Space Launches Every Year By 2030", "full_content": "India is targeting 50 space launches annually by 2030 as private companies take a larger role in the sector. IN-SPACe Chairman Pawan Goenka said government and industry collaboration will be essential to build the required launch capacity.", "source": "NDTV Profit", "pub_date_str": "06 Sep 2026, 05:52 PM IST", "pub_date_relative": "1h ago"}, {"title": "Stuart Broad Picks Greatest Test Fast Bowlers: Anderson No.1, Bumrah Third; Starc Missing", "full_content": "Broad\u2019s rankings have sparked debate among fans over Anderson\u2019s top spot and several notable omissions.", "source": "NDTV Profit", "pub_date_str": "06 Sep 2026, 05:51 PM IST", "pub_date_relative": "1h ago"}, {"title": "SpaceX\u2019s European rival Isar Aerospace plans rapid expansion after first orbital launch", "full_content": "", "source": "Investing.com News", "pub_date_str": "06 Sep 2026, 05:45 PM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "Sugar is outperforming the stock market this year. Here's what's driving it, and where it can go from here", "full_content": "Sugar prices surged 21.5% in August, marking its strongest monthly gain since October 2010, when it rose 24%. The United Nation's Food and Agriculture Organization Food Price Index also rose in August amid broad-based increases, led by sugar.\n\n\"The surge reflected expectations of lower sugar beet yields in the European Union due to adverse weather, concerns over the impact of El Ni\u00f1o on production prospects in key producing countries in Asia, lower sugar production in Brazil, and India's announcement of duty-free raw sugar imports,\" the organization said in its recent report.\n\nThe August rally pushed sugar futures ahead of the S&P 500 on a year-to-date basis. The sweetener is now up about 20% in 2026, versus the nearly 13% advance for the broad market index.\n\nThe U.N.'s Food and Agriculture Organization points out that the sugar rally is tied to several factors, which are collectively pushing the prices in the market.\n\nThe sugar rally reflects a shift in expectations about global supply, according to William Osnato, Barchart director of commodity data research and analysis. Osnato told CNBC that the damage to Europe's sugar-beet crop during a summer heat wave was one of the biggest immediate factors.\n\nSugar beets are grown in the same places and around the same time as corn and wheat, and so the heat wave can significantly affect sugar production.\n\n\"That's been factored in over the last month. So a bunch of organizations lowered their production estimates,\" Osnato said.\n\nDifferent organizations have either slashed production estimates or increased deficit estimates in their recent reports. The European Commission's latest sugar balance sheet estimates a decline in EU production of 19% to 13.4 million metric tons, in the 2026/27 marketing year, from 16.6 million tons in 2025/26. Citi projected a world deficit of 1.3 million metric tons in a Tuesday note, and Green Pool Commodity Specialists estimated 3.2 million metric tons.", "source": "CNBC Finance", "pub_date_str": "06 Sep 2026, 06:49 PM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Derivatives", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Investors to pore over inflation data for signals on rate trajectory", "full_content": "", "source": "Investing.com News", "pub_date_str": "06 Sep 2026, 06:30 PM IST", "pub_date_relative": "32m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Is the U.S. losing its safe-haven status? Why global central banks are pulling gold out of New York.", "full_content": "What to know about safe havens and the U.S., as the Netherlands\u2019 central bank follows France in pulling gold out of New York.", "source": "MarketWatch Top Stories", "pub_date_str": "06 Sep 2026, 06:30 PM IST", "pub_date_relative": "32m ago", "cfa_topics": ["Economics", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Paint Makers Expect Healthy FY27 Demand Amid Price Hikes; Competition Intensity Remains High", "full_content": "Festive demand, price hikes and infrastructure spending offer growth support, but rising costs and fierce competition threaten to squeeze margins.", "source": "NDTV Profit", "pub_date_str": "06 Sep 2026, 06:28 PM IST", "pub_date_relative": "33m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Expert View: Selective buying under the shell of Homruz & supply constraints, says Vinod Nair", "full_content": "The Sensex has corrected by 10.25% YTD while up 3.66% in the last 3months. During the year, one year forward valuation has corrected to 10% below the 5yrs average at 17.9x. The recent drawdown, -3.15% in the last 1month, look more driven by sentiment as earnings growth has been robust in Q1FY27. Stubborn crude prices and elevated global bond yields are dragging the reaction. While possible September Fed policy move is putting the global market on the toes as the probability has increased to 49%. The domestic risk-reward today is best described as selective with compelling opportunity in mid and small caps stocks after the consolidation during 2025-26 and revamp in earnings based on recent results. Buying is supported by value trade, and the small-cap indices touched a fresh intraday lifetime high on Friday.\n\nThough the valuation of India has contracted, it continues to command a huge premium over global emerging-market peers. Hence performance is vulnerable to the highly dependable crude prices which has turned volatile and persistent hawkish monetary position like Fed keeping which is keeping US yields elevated does drawing capital toward safety. RBI open-end narrative may reverse cautious in the next month policy as crude has climbed toward $95, highest since July. History offers a useful threshold: sustained higher Brent prices for a full quarter is roughly where India's macroeconomic math turns genuinely adverse. Estimated that every $10 per barrel increase in oil prices could widen India\u2019s current account deficit by about 0.35% of GDP, while inflation could rise by 20\u201330 basis points depending on retail fuel price pass-through.\n\nInvestors should indeed be watching the Q2-Q3 effects, Q1 was not affected to an extent in terms of both GDP and Corporate earnings. A prolonged oil shock would pressure the rupee, currently cushioned by RBI dollar sales and strong FCNR(B) inflows.", "source": "LiveMint Markets", "pub_date_str": "06 Sep 2026, 06:25 PM IST", "pub_date_relative": "37m ago", "cfa_topics": ["Quantitative Methods", "Economics", "Financial Statement Analysis", "Equity Investments", "Fixed Income"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "NSE IPO to US-Iran war: 3 reasons why Sensex, Nifty may see a flat-to-weak start on Monday | Indian markets outlook", "full_content": "Indian Stock Market | Sensex, Nifty outlook: The benchmark indices of the Indian stock market saw profit-booking at higher levels last week. On a weekly basis, the Nifty 50 index ended 1.15% lower, while the Sensex was down by 750 points. Among sectors, the Auto index lost the most, shedding over 3.8%, whereas the Oil and Gas index outperformed, rallying 1.30%. During the week, the market breached the crucial support zone of 24,000/76800. However, it showed a promising recovery from the 23,800/76100 level.\n\nAccording to stock market experts, pressure on these key Dalal Street indices may persist, and the Indian stock market may trade flat to negative in the near term. They said that the buzz around the mega \u20b9 30,000 crore NSE IPO , escalation in the Middle East tension due to the fresh US strikes in Iran and strong US bond yields are expected to keep the Indian stocks under pressure and the Nifty 50 may not see the 25,000 levels in June 2026.\n\nHighlighting the challenge posed by the NSE IPO for the Sensex, Nifty 50 and other indices of the Indian stock market, Sandeep Pandey, Co-founder of Basav Capital, said, \u201cThe NSE IPO is expected to catalyse a switch of money from the secondary market to the primary market. People remember that BSE has surged more than 7 times since its listing in 2017.", "source": "LiveMint Markets", "pub_date_str": "06 Sep 2026, 06:15 PM IST", "pub_date_relative": "47m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Fixed Income", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stock market new rules 2026: At NSE, pre-open session will be different from Monday - What has changed now?", "full_content": "Stock market new rules : The National Stock Exchange (NSE) will implement revised rules for its pre-open session from Monday, September 7, while retaining the existing session timings.\n\nUnder the new framework , the order-entry period will be divided into phases, with market orders restricted during the second phase. The changes are designed to align the pre-open session with the Securities and Exchange Board of India\u2019s (Sebi) introduction of the Closing Auction Session (CAS) in the equity cash market.\n\nThe revised norms also seek to improve coordination between the cash and derivatives segments and facilitate a smoother transition in market operations.\n\nFrom September 7, the 15-minute pre-open session , running from 9:00 AM to 9:15 AM, will be divided into phases.\n\n9:00 AM to 9:05 AM: Phase 1 will be conducted from 9:00 AM to 9:05 AM, allowing investors to enter, modify, or cancel both limit and market orders.\n\n9:05 AM to 9:10 AM : Phase 2 will take place from 9:05 AM to 9:10 AM, during which only limit orders can be entered, modified, or cancelled.\n\n9:10 AM to 9:12 AM : The order-matching and trade-confirmation session will now be held from 9:10 AM to 9:12 AM, replacing the existing 9:08 AM to 9:12 AM window. During this session, the opening price will be established, orders will be matched, and trades will be confirmed.\n\n9:12 AM to 9:15 AM : The buffer period from 9:12 AM to 9:15 AM will follow, facilitating a seamless transition from the pre-open session to regular continuous trading.", "source": "LiveMint Markets", "pub_date_str": "06 Sep 2026, 06:14 PM IST", "pub_date_relative": "48m ago", "cfa_topics": ["Equity Investments", "Derivatives"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Top stocks in focus on Monday: Why investors should watch RVNL, Mazagon Dock, Tata Motors shares - Know news, triggers", "full_content": "Stocks to focus : Indian stock market investors are likely to keep an eye on several companies on Monday, 7 September, following significant business updates, new order wins, fundraising plans, and investment announcements disclosed after market hours.\n\nRail Vikas Nigam (RVNL), Lupin, Tata Motors, Mazagon Dock Shipbuilders, JSW Steel, Lupin among the stocks likely to remain in focus.\n\nIndian equity markets ended the week on a cautious note, extending their corrective trend as elevated crude oil prices, renewed geopolitical tensions and uncertainty over the global interest-rate outlook continued to weigh on investor sentiment. While benchmark indices staged a recovery on Friday, snapping a four-session losing streak, the gains remained limited amid persistent foreign investor selling and concerns over the impact of higher energy costs.\n\nFor the week, the Nifty 50 declined around 1.15% to close at 23,897.70, while the Sensex slipped nearly 1.0% to settle at 76,515.43. Both benchmark indices registered their fourth consecutive weekly decline, underscoring continued weakness in the broader market despite selective buying in individual stocks.\n\nRVNL : Navratna public sector undertaking Rail Vikas Nigam Ltd (RVNL) on Friday announced that it has secured a \u20b9 903 crore Letter of Award from SJVN Thermal Private Limited, a wholly owned subsidiary of SJVN Limited, for works related to the 1,320 MW Buxar Thermal Power Project in Bihar.\n\nMazagon Dock Shipbuilders : The company has received a \u20b9 118 crore purchase order from Maharashtra State Electricity Transmission Company Limited (MSETCL) for the supply, installation and commissioning of an AI-based Comprehensive Infrasecure Project across five substations.\n\nTata Motors : Tata Motors Commercial Vehicles has launched an open offer to acquire shares of Italian automotive major Iveco Group at \u20ac14.1 per share.", "source": "LiveMint Markets", "pub_date_str": "06 Sep 2026, 05:37 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Futures: Nvidia Leads 5 New AI Buys; U.S., Iran Exchange Attacks - Investor's Business Daily", "full_content": "Futures: Nvidia Leads 5 New AI Buys; U.S., Iran Exchange Attacks Investor's Business Daily G20 meetings, strikes on Iran, the 'alphabet soup' economy and more in Morning Squawk CNBC Pre-Markets in Green to Start August Trading The Globe and Mail Nasdaq 100 Forecast: Stocks pause with inflation data and peace talks in focus stonex.com US markets today: Dow, S&P 500, Nasdaq futures indicate mixed open; Adobe, Lululemon, rare earth stocks to watch Upstox", "source": "Google News Business", "pub_date_str": "06 Sep 2026, 05:36 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Many truckers don't feel like the rest of America about AI data centers as business booms", "full_content": "As America has an intense national debate about the cost of AI data centers and who stands to benefit, one often overlooked industry that has seen a boost in business from AI is trucking.\n\nSprawling data centers don't just sprout from fields, even if it seems that way. All the components that go into a data center, from HVAC systems to tubing and wiring and semiconductors, arrive primarily by truck (or train and then truck). And for a freight business that has been hurt by successive rounds of trade war tariffs and surging diesel fuel prices which hit an all-time high of $5.85 a gallon on Friday as a result of the Iran war, AI is providing a bit of a respite.\n\n\"Against that backdrop, AI and data center activity presents an opportunity for fleets,\" said Patrick Brennan, senior vice president of fleet management solutions provider Cox Fleet. Overall freight demand is still uneven, he said, but AI is providing some needed stability. Equipment-led growth, whether for data centers or defense and semiconductor projects, is inherently more freight-generating, he said.\n\nSome niches within the trucking sector benefit more than others. The best-documented effect is the increased hauling of data center-aligned materials, which shows up in production indices and in individual carrier earnings commentary. Load-to-truck ratios have jumped as capacity tightening reaches this part of the market too.\n\n\"The effect shows up most in flatbed and heavy haul, where spot rates have hit multiyear highs this summer and capacity is tightest in construction-heavy markets,\" Brennan said. \"Flatbed and heavy haul have been on an absolute tear since last year, and that's where demand from the buildout is most concentrated,\" he added.\n\nBecause site location decisions for these projects are often determined by factors including power and land cost, the arrival of AI is also reshaping trucking lanes, with much of that freight moving into markets that were never traditional freight hubs.", "source": "CNBC World Economy", "pub_date_str": "06 Sep 2026, 05:35 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "How Tata Motors-Iveco \u20ac3.82 bn tender offer will impact TMCV share price after acquisition of Italian group | Decoded", "full_content": "Tata Motors-Iveco Group deal: After the \u20ac 3.82 billion deal, Tata Motors Commercial Vehicles is expected to become an international player, delivering 5.90 lakh commercial vehicles annually", "source": "LiveMint Markets", "pub_date_str": "06 Sep 2026, 05:22 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Unwanted Record For Pakistan! Test Win-Loss Ratio Crashes To 40-Year Low", "full_content": "Pakistan have managed just eight wins against 20 defeats since the start of 2022.", "source": "NDTV Profit", "pub_date_str": "06 Sep 2026, 04:56 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "FPIs Reverse Two-Month Buying Streak To Offload Rs 7,443 Crore From Indian Equities", "full_content": "The recent market sell-off was triggered by a surge in crude oil prices, sparking renewed fears regarding India's inflation trajectory and current account balance.", "source": "NDTV Profit", "pub_date_str": "06 Sep 2026, 04:41 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Ahead of Market: 10 things that will decide stock market action on Monday", "full_content": "Indian benchmark indices ended slightly higher on Friday, with the Sensex rising 363 points and Nifty closing below 23,898. Investors monitored global market cues, US economic data, and inflation reports, while stock-specific action drove intraday activity across major sectors in a sideways-moving market environment.", "source": "Economic Times Markets", "pub_date_str": "06 Sep 2026, 04:35 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Equity Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "MCX electricity futures clock record Rs 245 crore turnover as OI touches all-time high", "full_content": "MCX electricity futures celebrated a milestone on September 4, reaching a historic turnover of Rs 245 crore. The contract not only recorded its highest volume and open interest but also demonstrated notable growth in average daily volume this fiscal year. This surge reflects a robust market interest and expanded initiatives for managing price risks, as evidenced by consistent trading activity across all expiry months.", "source": "Economic Times Markets", "pub_date_str": "06 Sep 2026, 04:32 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "HUL share price target: From \u20b91973 to \u20b92820 in 12 months - Buy rating from Nuvama for Hindustan Unilever stock", "full_content": "HUL share price has remained under pressure amid weak market sentiments. The FMCG stock has fallen 5.28% in a month and 13% in six months.", "source": "LiveMint Markets", "pub_date_str": "06 Sep 2026, 04:30 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Nike Gets Booted From S&P 100 After 18 Years: What Went Wrong With The Sportswear Giant?", "full_content": "The S&P 500 sub-set is composed of 100 major, highly stable blue-chip companies across multiple industry groups on the Wall Street. Nike, unfortunately, will not be one of them.", "source": "NDTV Profit", "pub_date_str": "06 Sep 2026, 04:29 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "'India Buys Crude Oil For Itself, Not To Help Moscow': Russian Envoy Hits Back At US Tariff Threats", "full_content": "Alipov's remarks came amid increasing Western regulatory scrutiny and the threat of secondary sanctions against countries and companies that continue to conduct business with major Russian energy suppliers.", "source": "NDTV Profit", "pub_date_str": "06 Sep 2026, 04:19 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "West Asia Conflict, Crude Oil Prices, US Inflation Data To Steer Stock Markets This Week: Analysts", "full_content": "Geopolitical tensions, rising oil prices and a key US inflation reading could keep investors on edge as Indian equities enter another volatile week.", "source": "NDTV Profit", "pub_date_str": "06 Sep 2026, 04:17 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "16 IPOs on investors' radar next week. GMPs signal up to 38% returns", "full_content": "A total of 16 IPOs across mainboard and SME segments are scheduled to launch next week, including Rentomojo and Kanohar Electricals. Grey market premium trends signal positive investor sentiment, with listing gains expected up to 38% led by Rentomojo's high subscription interest.", "source": "Economic Times Markets", "pub_date_str": "06 Sep 2026, 03:34 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}], "updated_at": "06 Sep 2026, 07:02 PM IST", "total_stories": 335};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
