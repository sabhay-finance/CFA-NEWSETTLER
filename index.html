    const allData = {"general": [{"title": "\u20b99 lakh in Post Office MIS vs \u20b99 lakh in bank FD: Which gives a higher monthly income?", "full_content": "In the current difficult-to-predict geopolitical environment, equity markets in India have underperformed over the last few years. This brings focus to fixed-income instruments such as small savings schemes and bank fixed deposits.\n\nNow, investing \u20b9 9 lakh in a Post Office Monthly Income Scheme (MIS) or a bank fixed deposit (FD) can help an individual generate regular income without facing market-linked volatility.\n\nThis regular income will be generated while keeping the principal out of market-linked investments. Still, the monthly income will ultimately depend on the interest rate and payout terms.\n\nFurthermore, at the current Post Office MIS interest rate of 7.4%, an investment of \u20b9 9 lakh earns \u20b9 5,550 a month before taxation. In comparison, a bank FD offering investors an illustrative annual interest rate of 6.5% will generate an indicative monthly income of \u20b9 4,875 before taxation, subject to the banking institution's payout calculations.\n\nIt is also vital to note that the FD rate taken above is illustrative only. This is because FDs across different lending institutions offer better returns subject to eligibility criteria, tenures, and terms. For example, senior citizens can even get more than 8% on FDs in select small finance banks for specific tenures. Still, the comparison for this particular article is for an FD that normal citizens can do.\n\nHere is how the two options compare for a \u20b9 9 lakh investment.\n\nNote: The bank FD rate is illustrative. Actual monthly payouts may differ depending on the bank\u2019s terms. MIS rates are subject to government review.\n\nHence, at these assumed interest rates, the Post Office MIS generates \u20b9 675 more per month, or \u20b9 8,100 more on an annual basis, before taxation.", "source": "LiveMint Money", "pub_date_str": "17 Oct 2026, 11:09 AM IST", "pub_date_relative": "4m ago"}, {"title": "Arrested OpenAI engineer seeks bail, denies plans to flee U.S.", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Oct 2026, 10:49 AM IST", "pub_date_relative": "24m ago"}, {"title": "Dividend alert: IRFC, Tech Mahindra, ICICI Prudential AMC, among 11 stocks to watch next week: Check record date, payout", "full_content": "Dividend Stocks : Investors tracking dividend income have several stocks to watch next week, with 11 companies scheduled to have record dates between October 21 and October 23, 2026. The list includes Tech Mahindra, LTM, ICICI Prudential Asset Management Company, MRPL, Angel One, Tips Music, IRFC and ICICI Lombard General Insurance Company, among others.\n\nThe announced dividend amounts range from \u20b9 0.50 per share for Elecon Engineering Company to \u20b9 30 per share for ICICI Prudential Asset Management Company. However, investors should pay attention to the record dates and eligibility requirements before making investment decisions.\n\nA dividend is a portion of a company's profits or distributable reserves paid to shareholders. Companies may distribute dividends as a way to share earnings with investors, with the amount generally declared on a per-share basis.\n\nThe record date is the date on which a company checks its shareholder records to determine who is eligible to receive the dividend. Investors need to account for the applicable settlement cycle and ex-dividend date when buying shares. Simply purchasing a stock on its record date does not necessarily make an investor eligible for the payout.\n\nInvestors should therefore check the relevant stock exchange announcements and ensure that their purchases meet the eligibility requirements. A dividend announcement also does not guarantee that a stock's market price will remain unchanged, as share prices can move in response to market conditions and dividend-related adjustments.\n\nHere are the 11 companies, their scheduled record dates and the dividend amounts per share, based on the supplied list.\n\nICICI Prudential Asset Management Company has a record date of October 21, 2026, for a dividend of \u20b9 30 per share. This is the highest per-share payout among the 11 companies listed.\n\nEarlier in FY27, ICICI Prudential had declared a final dividend of \u20b9 12.40 per share for FY2026, with an ex-date and record date of June 12, 2026.", "source": "LiveMint Markets", "pub_date_str": "17 Oct 2026, 10:49 AM IST", "pub_date_relative": "24m ago"}, {"title": "Eeme Energy SPV I buys $142m in XCF Global stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Oct 2026, 10:46 AM IST", "pub_date_relative": "28m ago"}, {"title": "Iran war: Missiles target Saudi oil hub as Yemen conflict escalates", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Oct 2026, 10:38 AM IST", "pub_date_relative": "36m ago"}, {"title": "United Therapeutics chairperson & CEO sells $5.19m in stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Oct 2026, 10:31 AM IST", "pub_date_relative": "42m ago"}, {"title": "Some companies give AI to everyone. This CEO is doing the opposite", "full_content": "At London-headquartered payments technology company Paysend, access to artificial intelligence tools has to be earned. CEO Ben Chisell told CNBC he is a \u201cvery cynical man\u201d about the hype around the technology, though he still sees value in it.\n\nChisell, who previously worked at Amazon, eBay and Starling Bank, estimates that Paysend can now deliver around 25% more engineering work with the same-sized team, but argues that getting results isn\u2019t as simple as handing everyone the latest tech.\n\nInstead, he limits AI tools to his highest-performing employees, often only after they\u2019ve proved what they can do with them. In the wrong hands, he said, AI can magnify bad habits such as laziness and poor judgment.\n\nHis broader rule is to resist the \u201cfear of missing out\u201d and focus on customer problems.\n\n\u201cI know it sounds very unglamorous and unsexy as an approach given the world of tokenmaxxing and AI, but I think it\u2019s really, really important,\u201d Chisell said.\n\nThe pressure to demonstrate AI\u2019s value is growing, from the legal sector to software engineering and finance, and many companies are responding by putting the technology in as many hands as possible.\n\nLondon-based Lloyds Banking Group has rolled out 40,000 Microsoft 365 Copilot licenses, with 97% of employees who have one actively using it, the bank said. Newcastle-headquartered software company Sage said its AI coding tools had saved hundreds of thousands of work hours, while London-based professional services firm Grant Thornton UK has encouraged all of its staff to use Anthropic\u2019s Claude as part of a \u00a3500 million ($660 million) investment in AI.\n\nThese figures do not necessarily translate into gains on the bottom line, however. U.K. government research published in January found that three-quarters of businesses using AI said it had improved workforce productivity, but 77% said revenue had not changed.", "source": "CNBC World Economy", "pub_date_str": "17 Oct 2026, 10:30 AM IST", "pub_date_relative": "44m ago"}, {"title": "Christine Lagarde: IMFC Statement", "full_content": "The global economy has proven surprisingly resilient in the face of high uncertainty. The conflict in the Middle East continues to expose energy markets to sharp swings. Trade tensions and protectionist measures are weighing on confidence and contributing to a reconfiguration of trade flows. The global economy has held up thanks in part to the rise of artificial intelligence, with investment in technology supporting activity and trade, particularly in economies integrated into technology value chains. Risks nonetheless remain tilted to the downside for growth and to the upside for inflation. A return to an international economic order grounded in openness, predictability and the rule of law would help trade and investment flourish.\n\nDespite global headwinds and the ongoing energy shock, the euro area economy has so far proved resilient. Growth was broad-based across most euro area countries and sectors in the first half of 2026. The September ECB staff projections foresee growth of 0.9% in 2026, 1.4% in 2027 and 1.5% in 2028.\n\nAs the energy shock fades over the medium term, the projections see domestic demand benefitting from a recovery in real income over the medium term, driven by lower energy inflation and a resilient labour market. Rising government spending on infrastructure and defence, complemented by investment in AI and digital technologies, should also support growth. Export growth should pick up on the back of strengthening foreign demand, also driven by AI.\n\nThe medium-term outlook is surrounded by uncertainty over how intense and long-lasting the Middle East conflict will be, and how the resulting shocks might propagate through the economy. Risks to growth are assessed to be on the downside.\n\nFiscal sustainability remains a crucial anchor for broader economic stability.", "source": "ECB Press", "pub_date_str": "17 Oct 2026, 10:30 AM IST", "pub_date_relative": "44m ago"}, {"title": "$60 billion in 6 weeks: RBI's rupee defence comes at a cost", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Forex \u203a Forex News \u203a $60 billion in 6 weeks: RBI's rupee defence comes at a cost Central Depository Services (India) Share Price The Economic Times daily newspaper is available online now. Read Today's Paper $60 billion in 6 weeks: RBI's rupee defence comes at a cost SECTIONS $60 billion in 6 weeks: RBI's rupee defence comes at a cost By ET Bureau Last Updated: Oct 17, 2026, 10:26:00 AM IST Rate Story Follow us Share Fon nsultancy Services Share Price Infosys Share Price HCL Technologies Share Price Wipro Share Price Tech Mahindra Share Price The Economic Times daily newspaper is available online now. Read Today's Paper IT's time to celebrate when chips are down; Nifty IT soars 11.7% to log biggest weekly rally since 2008 SECTIONS IT's time to celebrate when chips are down; Nifty IT soars 11.7% to log biggest weekly rally since 2008 By Ravindra Sonavane , ET Bureau Last Updated: Oct 17, 2026, 10:30:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Indian IT sector experienced an impressive surge, achieving its highest weekly increase in 18 years, driven by unexpectedly strong quarterly results from companies like HCLTech. The Nifty IT index jumped 11.7%, amidst falling semiconductor stock prices in Asia. Furthermore, the rupee showed notable strength, closing below the 95-mark for the first time in 38 days, reflecting the effective measures implemented by the Reserve Bank of India.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "17 Oct 2026, 09:46 AM IST", "pub_date_relative": "1h ago"}, {"title": "Swiggy share price: Down 50% in 1 year; can food delivery stock recover? Should you buy the dip? Check target, stop-loss", "full_content": "Swiggy shares have come under significant pressure over the past year, raising questions about whether the food delivery and quick-commerce company can stage a sustained recovery.\n\nWhile improving profitability in its core food delivery business and efforts to reduce quick-commerce losses have strengthened the fundamental investment case, the stock's technical structure remains weak.\n\nIn the previous session, the stock ended 2% higher at \u20b9 234.05. It is now 49% away from its 52-week high of \u20b9 460, hit in October 2025 and its 52-week low of \u20b9 228.50, hit in in the previous session, October 16, 2026.\n\nIt has been under pressure recently, down 13% in 1 month, 14% in 3 months, 16% in 6 months and around 50% in the last 1 year.\n\nRecently, domestic brokerage house Anand Rathi Share and Stock Brokers upgraded Swiggy to Buy, retaining its target price of \u20b9 310, implying a potential upside of over 32%. However, technical analyst Jigar S Patel has advised caution, identifying key support and breakout levels that could determine the stock's next move.\n\nAnand Rathi said Swiggy was moving from a phase in which growth came at the expense of profitability towards one in which growth could increasingly support earnings. The brokerage highlighted the recovery in contribution margin, which improved from a loss of around 5.6% in Q4FY25 to contribution break-even in Q1FY27.\n\n\u201cThe core Food Delivery segment continued to serve as primary profit generator. The segment recorded steady EBITDA margin of ~3.1% on a strong ~17.4% YoY expansion in GOV in Q1FY27,\u201d Anand Rathi said in its October 16 research report.\n\nAnand Rathi expects food delivery to record annual GOV growth of 18-20% over FY26-FY28, alongside further margin expansion.", "source": "LiveMint Markets", "pub_date_str": "17 Oct 2026, 09:43 AM IST", "pub_date_relative": "1h ago"}, {"title": "Home loan alert: SBI, PNB and 4 other banks revise lending rates \u2014 how borrowers may be affected", "full_content": "The Reserve Bank of India (RBI) recently hiked its benchmark repo rate by 25 basis points to 5.50% on 7 October 2026. This announcement was made at the culmination of the three-day Monetary Policy Committee (MPC) meeting.\n\nSubsequently, several banks have also increased their repo-linked lending rates, thus making loans linked to these benchmarks potentially more expensive. Prominent lending institutions such as State Bank of India (SBI), Punjab National Bank (PNB), Bank of India, Indian Bank, Bank of Baroda and Canara Bank have revised their respective lending benchmarks in October 2026.\n\nDue to these developments, existing borrowers and those planning to take fresh home loans should diligently check the latest rates, as changes in lending benchmarks can impact borrowing costs and monthly instalments. Having clarity on these aspects is essential in order to make meaningful and beneficial borrowing decisions.\n\nHere are the revised rates announced by six major banks across the country:\n\nTherefore, an increase in a lending benchmark can raise the interest rate on loans linked to it. This also depends on the lending institution's applicable spread and loan terms. Existing borrowers might witness higher EMIs or a longer repayment period, depending on how their banking institution adjusts the loan. New borrowers and fresh loan applicants may also face higher borrowing costs due to these changes.\n\nStill, do keep in mind that the revised benchmark is not necessarily the final interest rate the borrower pays. That is why it is prudent to carefully review and compare the effective interest rate, processing charges and repayment terms across lending institutions before taking a loan or planning to refinance an existing loan.\n\nIf you are an existing borrower, you should check with your lending institution to confirm when the revised rate will apply and how it will affect your existing loan.\n\nShivam writes on personal finance, equity markets, and mutual funds.", "source": "LiveMint Money", "pub_date_str": "17 Oct 2026, 09:43 AM IST", "pub_date_relative": "1h ago"}, {"title": "Dollar heads for weekly loss as Fed hike bets fade, AI jitters linger", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Forex \u203a Forex News \u ing", "full_content": "Ructions point to what a true bursting of the bubble might do to financial markets", "source": "FT Markets", "pub_date_str": "17 Oct 2026, 09:30 AM IST", "pub_date_relative": "1h ago"}, {"title": "Stocks are risky right now \u2014 but so are all the alternatives", "full_content": "The value of stocks can fall suddenly in a way that cash can\u2019t. But introduce inflation and it\u2019s a different equation", "source": "FT Markets", "pub_date_str": "17 Oct 2026, 09:30 AM IST", "pub_date_relative": "1h ago"}, {"title": "Wall Street Week Ahead: As AI rally wobbles, stock market's spotlight turns to earnings", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Wall Street Week Ahead: As AI rally wobbles, stock market's spotlight turns to earnings Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Wall Street Week Ahead: As AI rally wobbles, stock market's spotlight turns to earnings SECTIONS Wall Street Week Ahead: As AI rally wobbles, stock market's spotlight turns to earnings Reuters Last Updated: Oct 17, 2026, 09:29:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Investor confidence in the market is wavering due to recent declines in AI-linked stocks and semiconductor firms. Upcoming quarterly results from major players, including Meta Platforms, are being closely monitored by investors. Analysts are watching whether hyperscalers can sustain profitability amid significant capital expenditures on AI infrastructure. The performance of companies such as Tesla and SpaceX will also influence market sentiment.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "17 Oct 2026, 09:29 AM IST", "pub_date_relative": "1h ago"}, {"title": "Brent Oil Taps $110 for First Time Since May as Middle East Risks Swirl", "full_content": "Iran-backed Houthi rebels continue to pummel Saudi Arabia with missile and drone strikes, while Russia and Ukraine exchange tit-for-tat attacks on energy infrastructure.", "source": "NDTV Profit", "pub_date_str": "17 Oct 2026, 09:26 AM IST", "pub_date_relative": "1h ago"}, {"title": "Trump Eases Russian Oil Sanctions That Could Have Triggered 100% Tariffs On India", "full_content": "US President Donald Trump signed the order using the waiver power written into the Lindsey O. Graham Sanctioning Russia and Iran Act of 2026.", "source": "NDTV Profit", "pub_date_str": "17 Oct 2026, 09:25 AM IST", "pub_date_relative": "1h ago"}, {"title": "8th pay commission: DA merger, salary hike, fitment factor, inflation adjustment \u2014 Top 5 demands from employee groups", "full_content": "The 8th central pay commission (CPC) is in its consultation stage, gathering inputs from central government employees and pensioner groups, unions and stakeholders before it makes its final recommendations in May next year.\n\nIt is expected to examine and recommend changes that are desirable and feasible in the emoluments, including pay (usually includes salary structure, pay matrix, fitment factor), allowances (usually include DA, DR, HRA), other facilities / benefits, in cash or kind (includes increment, promotions, etc.).\n\nThe decisions are set to benefit more than 1 crore people, including around 50 lakh central government employees and about 65 lakh pensioners, including personnel and retirees with the defence and railway ministries.\n\nThe commission has scheduled an official state visit to Mumbai on 22-23 October to hold meetings with employee unions, representatives, groups, pensioner associations, federations, and other stakeholders.\n\nMultiple employee unions and representative groups have demanded that the Centre make an official announcement on DA merger . This is because the 7th CPC stipulated that DA may be merged with basic salary if it exceeds 50% and as of the last update, the component now comprises 60% of basic pay.\n\nNotably, the government has not officially announced a DA merger (which would expand basic pay) as of June 2026, the issue has gained traction because basic salary determines other components of compensation i.e. provident fund contribution, pension, allowances, gratuity, and more. Thus, higher DA and by association basic pay means increase in overall salary and linked allowances.\n\nThe big employee groups including the National Council \u2014 Joint Consultative Machinery (NC-JCM), the Maharashtra Old Pension Organisation and the All India Defence Employees Federation (AIDEF) have demanded hike in the minimum basic pay for central government employees.", "source": "LiveMint Money", "pub_date_str": "17 Oct 2026, 09:19 AM IST", "pub_date_relative": "1h ago"}, {"title": "India notifies first New Zealand FTA duty cuts; sheep meat gets zero duty, kiwi fruit at 15%", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a India notifies first New Zealand FTA duty cuts; sheep meat gets zero duty, kiwi fruit at 15% The Economic Times daily newspaper is available online now. Read Today's Paper India notifies first New Zealand FTA duty cuts; sheep meat gets zero duty, kiwi fruit at 15% SECTIONS India notifies first New Zealand FTA duty cuts; sheep meat gets zero duty, kiwi fruit at 15% ET Online Last Updated: Oct 17, 2026, 10:10:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India has notified the first set of customs duty concessions for imports from New Zealand under their free trade agreement, effective October 20. The preferential rates cover products such as wine, manuka honey, kiwi fruit and sheep meat, with limited quantities of select goods allowed under tariff-rate quotas and dairy and other sensitive sectors excluded.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\nUS mid-term elections \u2013 Part 2: What does it mean for Trump to lose control of Congress?\n\nThe ABCD of the US mid-term elections \u2013 Part 1: Why it matters across the globe\n\nCurbing rupee bets: What the RBI\u2019s new rules mean for the hedge-now-or-wait question\n\nBrinjal, buffalo, bacteria: Inside India\u2019s pay-for-nature system\n\nHomebuyers wait as NCLT panel picks holes in unfinished Jaypee projects\n\nThe NBFC saga - Part 3: How one default in 2018 changed the way RBI reads risk", "source": "Economic Times Economy", "pub_date_str": "17 Oct 2026, 09:19 AM IST", "pub_date_relative": "1h ago"}, {"title": "Jio\u2019s $3.2 billion IPO tests Ambani appeal with young Indians", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a Jio\u2019s $3.2 billion IPO tests Ambani appeal with young Indians Reliance Industries Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Jio\u2019s $3.2 billion IPO tests Ambani appeal with young Indians SECTIONS Jio\u2019s $3.2 billion IPO tests Ambani appeal with young Indians By Hemal Savai, Ashutosh Joshi , Bloomberg Last Updated: Oct 17, 2026, 09:18:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment For generations of Indians, Reliance Industries Ltd. was their introduction to the stock market. Founder Dhirubhai Ambani drew middle-income savers into shares, building a following that endured for decades. Nearly fifty years after Reliance went public, his billionaire son Mukesh and grandson Akash are preparing to list the group\u2019s telecom and digital services arm in what is set to be India\u2019s biggest initial public offering. Jio Platforms Ltd. plans to raise about $3.2 billion in the offering, which opens on Oct. 21. The IPO will test how much the Reliance brand still matters to retail investors. Jio is pitching to a very different market from the one Dhirubhai knew. India now has more than 130 million registered stock-market investors, nearly 40% of them under 30, according to National Stock Exchange of India data. Thousands of stocks, a vast array of mutual funds and other assets compete for their money. Older shareholders regarded Reliance as a stock they could hold for decades. For younger investors, growth, profits and valuation play a bigger role in the investment decision. Mahendra Chheda, 69, started as a floor trader in the late 1960s before becoming a member of the Bombay Stock Exchange.", "source": "Economic Times Markets", "pub_date_str": "17 Oct 2026, 09:18 AM IST", "pub_date_relative": "1h ago"}, {"title": "SGB 2020-21 Series VII: Investors to pocket 192% gains on premature redemption; RBI fixes October 19 date", "full_content": "The Reserve Bank of India ( RBI ) has fixed the premature redemption price of Sovereign Gold Bond (SGB) 2020-21 Series VII at \u20b9 14,614 per gram. The due date for premature redemption of this tranche is fixed at October 19, 2026 (Monday), as October 20 is a holiday on account of Dussehra.\n\nSovereign Gold Bonds are government securities denominated in grams of gold and issued by the RBI on behalf of the Government of India. They allow investors to benefit from movements in gold prices without physically holding the metal.\n\nIn addition to potential price appreciation, these gold bonds offer fixed interest of 2.5% per annum on the initial investment amount.\n\nAccording to the RBI's press release on Friday, \u201cpremature redemption of Gold Bond may be permitted after fifth year from the date of issue of such Gold Bond on the date on which interest is payable.\u201d\n\nAccordingly, the premature redemption date for the SGB 2020-21 Series VII tranche is October 19, 2026, since October 20 is a holiday.\n\nThe redemption price is determined using the simple average of the closing prices of 999-purity gold over the three preceding business days, as published by the India Bullion and Jewellers Association Ltd (IBJA).\n\n\u201cThe redemption price for premature redemption due on October 19, 2026 (October 20, 2026, being a holiday), shall be \u20b9 14,614/- (Rupees Fourteen Thousand Six Hundred and Fourteen Only) per unit of SGB based on the simple average of closing price of gold for the three business days, i.e., October 14, October 15, and October 16, 2026,\u201d according to the release.\n\nAccording to the Ministry of Finance's October 9, 2020, release, the original issue price of SGB 2020-21 Series VII was set at \u20b9 5,051 per gram. Investors who applied and paid digitally received a \u20b9 50-per-gram discount, bringing their purchase price to \u20b9 5,001.", "source": "LiveMint Money", "pub_date_str": "17 Oct 2026, 09:16 AM IST", "pub_date_relative": "1h ago"}, {"title": "DA hike after Dussehra: Will central government employees get good news in October? - What we know so far", "full_content": "Central government employees and pensioners are awaiting the announcement of the dearness allowance (DA) hike for July 2026. The central government did not announce the increase in its cabinet meeting on 14 October.\n\nThough the cabinet announced a performance-linked bonus (PLB), or annual bonus, for all Railway employees, it did not announce any decision on the much-awaited DA hike.\n\nThis has left employees hoping for a decision on the dearness allowance at the next cabinet meeting, which is likely scheduled for 21 October, a day after Dussehra. Still, it is important to note that the government has not officially confirmed the announcement date.\n\nFor example, the last DA hike was announced on a Saturday (18 April). Before that, it was announced on Wednesday (1 October 2025) after a cabinet meeting. Prior to that, on a Saturday (28 March 2025), the government announced the January 2025 DA hike.\n\nThat is why the upcoming 21 October meeting is a possible opportunity, but the central government employees should not treat it as a confirmed announcement date or deadline.\n\nThe current DA rate for serving central government employees is 60% of basic pay. This allowance is revised twice a year . Generally, it is done with effect from January and July to help employees manage inflation, boost their purchasing power and meaningfully improve their livelihoods.\n\nFurthermore, the July 2026 revision is calculated using the 12-month average of the All India Consumer Price Index for Industrial Workers (AICPI-IW) from July 2025 to June 2026. Based on the available data and historical trends, the DA rate could rise to approximately 63%, thus implying a potential increase of three percentage points.\n\nStill, this is just a tentative number, with the final rate yet to be confirmed by the central government. Further clarity on this will emerge only after the central government announces its decision. Till then, the expected increase remains an estimate rather than an official figure.", "source": "LiveMint Money", "pub_date_str": "17 Oct 2026, 08:33 AM IST", "pub_date_relative": "2h ago"}, {"title": "Kanya Pujan 2026: Dates, Time, When To Perform Rituals, Do's And Don'ts", "full_content": "Kanya Pujan, a key ritual of Sharadiya Navratri, honours young girls as forms of Goddess Durga through prayers, traditional food and gifts. Here are the dates, timings and rituals for 2026.", "source": "NDTV Profit", "pub_date_str": "17 Oct 2026, 08:30 AM IST", "pub_date_relative": "2h ago"}, {"title": "Trump's New White House Press Secretary Katie Zacharia Out After Five Days", "full_content": "A White House official said Katie Zacharia is transitioning out of the job. It's unclear if she would take another position in the White House or in Trump's orbit.", "source": "NDTV Profit", "pub_date_str": "17 Oct 2026, 08:05 AM IST", "pub_date_relative": "3h ago"}, {"title": "Trump exempts Russia from further sanctions mandated by new law", "full_content": "US president gives Putin a reprieve on threatened energy measures after cutting deal with Moscow to release diesel", "source": "FT Markets", "pub_date_str": "17 Oct 2026, 08:01 AM IST", "pub_date_relative": "3h ago"}, {"title": "Bank Holiday Today: Are Banks Open Or Closed On Saturday, Oct 17? Check Here", "full_content": "Banks will remain closed in Agartala on October 17 for Maha Saptami. The RBI calendar lists no festival holiday for 33 other banking centres. Check the complete list here.", "source": "NDTV Profit", "pub_date_str": "17 Oct 2026, 08:00 AM IST", "pub_date_relative": "3h ago"}, {"title": "Nepal Vs Canada Live Streaming: When And Where To Watch ICC Cricket World Cup League 2 Match Live In India", "full_content": "Check the match time, venue and official streaming options for the Nepal vs Canada fixture.", "source": "NDTV Profit", "pub_date_str": "17 Oct 2026, 08:00 AM IST", "pub_date_relative": "3h ago"}, {"title": "India Post sanctions 60 days\u2019 Productivity Linked Bonus: Check employee eligibility, salary limits and calculation rules", "full_content": "India Post has announced a Productivity Linked Bonus (PLB) equivalent to 60 days\u2019 emoluments for eligible employees for the accounting year 2025-26.\n\nThe order, issued by the Department of Posts on Friday, also provides for ex-gratia bonus payments to regularly engaged Gramin Dak Sevaks (GDS) and ad hoc bonuses to eligible full-time casual labourers, including those with temporary status.\n\n\u201cThe undersigned is directed to convey the sanction of the President for payment of Productivity Linked Bonus for the Accounting year 2025-26 equivalent of emoluments of 60 (Sixty) Days,\u201d order noted.\n\nHowever, the bonus calculation is subject to prescribed salary ceilings, the number of days worked, and the employee category.\n\nAccording to the order, the bonus applies to three categories:\n\nThe Productivity Linked Bonus for regular departmental employees will be calculated using the following formula specified in the order:\n\nHere, 30.4 represents the average number of days in a month, while average emoluments refer to the eligible salary components drawn during the accounting year, subject to the prescribed ceiling.\n\nThe order states: \u201cIn case of emoluments exceeding Rs.7000/- (Rupees Seven Thousand only) in any month during the accounting year 2025-26, the emoluments shall be restricted to Rs.7000/- per month only.\u201d", "source": "LiveMint Money", "pub_date_str": "17 Oct 2026, 07:43 AM IST", "pub_date_relative": "3h ago"}, {"title": "Veteran BJP Leader LK Advani Admitted To Delhi Hospital With Chest Infection", "full_content": "Veteran BJP leader Lal Krishna Advani, aged 98, is hospitalised at Indraprastha Apollo Hospital in Delhi with a chest infection. His condition remains stable under medical supervision.", "source": "NDTV Profit", "pub_date_str": "17 Oct 2026, 07:41 AM IST", "pub_date_relative": "3h ago"}, {"title": "SoftBank in talks to buy US security group Allied Universal", "full_content": "Masayoshi Son looks to increase pace of his bets on robotics and AI", "source": "FT Markets", "pub_date_str": "17 Oct 2026, 07:37 AM IST", "pub_date_relative": "3h ago"}, {"title": "8th Pay Commission: What central government employees need to know about OPS, NPS and UPS", "full_content": "The 8th Pay Commission is now nearing 1 year since its constitution on 3 November, 2025. Over the last few months, the 3-member panel of the 8th Pay Commission has held several critical discussions and meetings in prominent states and union territories across the country, including Delhi, Ladakh, Odisha, and Bengaluru. Another key set of meetings is set to begin on 22 October in Mumbai.\n\nIn these meetings, prominent employee unions have highlighted their grievances and demands. The demands have primarily revolved around the fitment factor multiplier, salary revision, rising inflation, DA merger, employee motivation, pension reforms, and meaningful changes in the lives of serving employees and pensioners.\n\nThere are also several employee unions such as the National Council of Joint Consultative Machinery (NC-JCM), Ministerial Staff Association (MSA), Survey of India, All India NPS Employees\u2019 Federation (AINPSEF) and the Federation of National Postal Organisations (FNPO) that have urged the 8th Pay Commission to introduce meaningful changes in pensions of central government employees, with some urging for the reintroduction of the old pension scheme, whereas others are urging for the complete rollback of the National Pension System (NPS) and Unified Pension Scheme (UPS).\n\nThese demands for meaningful changes in pensions come as the 8th Pay Commission continues consultations with employee organisations and other stakeholders on salary, pension and retirement benefits.\n\nThe three-member 8th Pay Commission, headed by Justice Ranjana Prakash Desai, has just concluded its most recent meetings in Bengaluru on 8 October. It is now scheduled to hold its next round of meetings in Mumbai on October 22 and 23.\n\nFurthermore, the final report of the 8th Pay Commission is tentatively expected to be tabled by May-June 2027.", "source": "LiveMint Money", "pub_date_str": "17 Oct 2026, 07:34 AM IST", "pub_date_relative": "3h ago"}, {"title": "DA news: Key salary components explained \u2014 We breakdown the differences between your DA, DR and HRA", "full_content": "DA news: The 8th central pay commission (8th CPC) is in its consultation stage and is holding meetings with employee representative groups, unions and stakeholders before making official recommendations on pay hikes, allowances and salary structure.\n\nConstituted every 10 years, the panel is expected to make significant decisions impacting salaries of central government employees and pensioners, including railways and defence staff and retirees by May 2027. Over 1 crore individuals, including about 50 lakh central government employees and some 65-lakh retired central government pensioners are set to get the benefits.\n\nAmong the key salary components under discussions include Dearness Allowance (DA), Dearness Relief (DR) and House Rent Allowance ( HRA ) benefits. Today, we breakdown the differences between each of these and how they apply for salaried individuals in India.\n\nThe Pay Commission is a government panel established every 10 years to revise pay, allowances and pensions of central government employees and retired former servicemen. It is also responsible for wider implications of these revisions on contributions, retirement benefits and government spending.\n\nThe current panel is the eight such constituted by the central government since Independence. It is chaired by former Supreme Court Justice Ranjana Prakash Desai .", "source": "LiveMint Money", "pub_date_str": "17 Oct 2026, 07:30 AM IST", "pub_date_relative": "3h ago"}, {"title": "Q2 Results Today: Axis Bank, HDFC Bank, ICICI Bank Among 18 Firms To Report Earnings On Oct. 17", "full_content": "Besides HDFC Bank, ICICI Bank and Axis Bank, the calendar also features Bajaj Healthcare, Central Bank of India, IDBI Bank, India Cements, ixigo operator LE Travenues Technology, Punjab and Sind Bank, YES Bank, among others.", "source": "NDTV Profit", "pub_date_str": "17 Oct 2026, 07:00 AM IST", "pub_date_relative": "4h ago"}, {"title": "Sunil Singhania makes a fresh entry in this defence stock", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nBuilding a successful stock portfolio requires a clear investment strategy , well-defined financial goals and a thorough understanding of market dynamics.\n\nAs you develop your own approach, you can also draw valuable lessons from the experience and investment philosophies of seasoned market veterans.\n\nStudying their decisions can offer useful insights, but these must be balanced with your own financial objectives, risk appetite and investment horizon.\n\nOne such investor is Sunil Singhania , whose investment moves and portfolio choices attract considerable attention.\n\nSunil Singhania is the founder of Abakkus Asset Manager, an investment management company.\n\nHe has a track record of over two decades in equity markets. He played a significant role in building Reliance-Nippon MF into one of India's largest asset management companies (AMCs).\n\nSunil Singhania has picked up a stake in defence stock Bharat Earth Movers.", "source": "LiveMint Markets", "pub_date_str": "17 Oct 2026, 07:00 AM IST", "pub_date_relative": "4h ago"}, {"title": "Popular restaurant Wendt's on the Lake to close - WLUK", "full_content": "Popular restaurant Wendt's on the Lake to close WLUK See more headlines & perspectives on Google News", "source": "Google News Business", "pub_date_str": "17 Oct 2026, 06:20 AM IST", "pub_date_relative": "4h ago"}, {"title": "Anthropic offers Blackstone double-digit yield in latest chip financing", "full_content": "High borrowing costs complicate AI lab\u2019s goal of achieving investment-grade status", "source": "FT Markets", "pub_date_str": "17 Oct 2026, 06:17 AM IST", "pub_date_relative": "4h ago"}], "cfa": [{"title": "\u20b99 lakh in Post Office MIS vs \u20b99 lakh in bank FD: Which gives a higher monthly income?", "full_content": "In the current difficult-to-predict geopolitical environment, equity markets in India have underperformed over the last few years. This brings focus to fixed-income instruments such as small savings schemes and bank fixed deposits.\n\nNow, investing \u20b9 9 lakh in a Post Office Monthly Income Scheme (MIS) or a bank fixed deposit (FD) can help an individual generate regular income without facing market-linked volatility.\n\nThis regular income will be generated while keeping the principal out of market-linked investments. Still, the monthly income will ultimately depend on the interest rate and payout terms.\n\nFurthermore, at the current Post Office MIS interest rate of 7.4%, an investment of \u20b9 9 lakh earns \u20b9 5,550 a month before taxation. In comparison, a bank FD offering investors an illustrative annual interest rate of 6.5% will generate an indicative monthly income of \u20b9 4,875 before taxation, subject to the banking institution's payout calculations.\n\nIt is also vital to note that the FD rate taken above is illustrative only. This is because FDs across different lending institutions offer better returns subject to eligibility criteria, tenures, and terms. For example, senior citizens can even get more than 8% on FDs in select small finance banks for specific tenures. Still, the comparison for this particular article is for an FD that normal citizens can do.\n\nHere is how the two options compare for a \u20b9 9 lakh investment.\n\nNote: The bank FD rate is illustrative. Actual monthly payouts may differ depending on the bank\u2019s terms. MIS rates are subject to government review.\n\nHence, at these assumed interest rates, the Post Office MIS generates \u20b9 675 more per month, or \u20b9 8,100 more on an annual basis, before taxation.", "source": "LiveMint Money", "pub_date_str": "17 Oct 2026, 11:09 AM IST", "pub_date_relative": "4m ago", "cfa_topics": ["Economics", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Dividend alert: IRFC, Tech Mahindra, ICICI Prudential AMC, among 11 stocks to watch next week: Check record date, payout", "full_content": "Dividend Stocks : Investors tracking dividend income have several stocks to watch next week, with 11 companies scheduled to have record dates between October 21 and October 23, 2026. The list includes Tech Mahindra, LTM, ICICI Prudential Asset Management Company, MRPL, Angel One, Tips Music, IRFC and ICICI Lombard General Insurance Company, among others.\n\nThe announced dividend amounts range from \u20b9 0.50 per share for Elecon Engineering Company to \u20b9 30 per share for ICICI Prudential Asset Management Company. However, investors should pay attention to the record dates and eligibility requirements before making investment decisions.\n\nA dividend is a portion of a company's profits or distributable reserves paid to shareholders. Companies may distribute dividends as a way to share earnings with investors, with the amount generally declared on a per-share basis.\n\nThe record date is the date on which a company checks its shareholder records to determine who is eligible to receive the dividend. Investors need to account for the applicable settlement cycle and ex-dividend date when buying shares. Simply purchasing a stock on its record date does not necessarily make an investor eligible for the payout.\n\nInvestors should therefore check the relevant stock exchange announcements and ensure that their purchases meet the eligibility requirements. A dividend announcement also does not guarantee that a stock's market price will remain unchanged, as share prices can move in response to market conditions and dividend-related adjustments.\n\nHere are the 11 companies, their scheduled record dates and the dividend amounts per share, based on the supplied list.\n\nICICI Prudential Asset Management Company has a record date of October 21, 2026, for a dividend of \u20b9 30 per share. This is the highest per-share payout among the 11 companies listed.\n\nEarlier in FY27, ICICI Prudential had declared a final dividend of \u20b9 12.40 per share for FY2026, with an ex-date and record date of June 12, 2026.", "source": "LiveMint Markets", "pub_date_str": "17 Oct 2026, 10:49 AM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Some companies give AI to everyone. This CEO is doing the opposite", "full_content": "At London-headquartered payments technology company Paysend, access to artificial intelligence tools has to be earned. CEO Ben Chisell told CNBC he is a \u201cvery cynical man\u201d about the hype around the technology, though he still sees value in it.\n\nChisell, who previously worked at Amazon, eBay and Starling Bank, estimates that Paysend can now deliver around 25% more engineering work with the same-sized team, but argues that getting results isn\u2019t as simple as handing everyone the latest tech.\n\nInstead, he limits AI tools to his highest-performing employees, often only after they\u2019ve proved what they can do with them. In the wrong hands, he said, AI can magnify bad habits such as laziness and poor judgment.\n\nHis broader rule is to resist the \u201cfear of missing out\u201d and focus on customer problems.\n\n\u201cI know it sounds very unglamorous and unsexy as an approach given the world of tokenmaxxing and AI, but I think it\u2019s really, really important,\u201d Chisell said.\n\nThe pressure to demonstrate AI\u2019s value is growing, from the legal sector to software engineering and finance, and many companies are responding by putting the technology in as many hands as possible.\n\nLondon-based Lloyds Banking Group has rolled out 40,000 Microsoft 365 Copilot licenses, with 97% of employees who have one actively using it, the bank said. Newcastle-headquartered software company Sage said its AI coding tools had saved hundreds of thousands of work hours, while London-based professional services firm Grant Thornton UK has encouraged all of its staff to use Anthropic\u2019s Claude as part of a \u00a3500 million ($660 million) investment in AI.\n\nThese figures do not necessarily translate into gains on the bottom line, however. U.K. government research published in January found that three-quarters of businesses using AI said it had improved workforce productivity, but 77% said revenue had not changed.", "source": "CNBC World Economy", "pub_date_str": "17 Oct 2026, 10:30 AM IST", "pub_date_relative": "44m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Christine Lagarde: IMFC Statement", "full_content": "The global economy has proven surprisingly resilient in the face of high uncertainty. The conflict in the Middle East continues to expose energy markets to sharp swings. Trade tensions and protectionist measures are weighing on confidence and contributing to a reconfiguration of trade flows. The global economy has held up thanks in part to the rise of artificial intelligence, with investment in technology supporting activity and trade, particularly in economies integrated into technology value chains. Risks nonetheless remain tilted to the downside for growth and to the upside for inflation. A return to an international economic order grounded in openness, predictability and the rule of law would help trade and investment flourish.\n\nDespite global headwinds and the ongoing energy shock, the euro area economy has so far proved resilient. Growth was broad-based across most euro area countries and sectors in the first half of 2026. The September ECB staff projections foresee growth of 0.9% in 2026, 1.4% in 2027 and 1.5% in 2028.\n\nAs the energy shock fades over the medium term, the projections see domestic demand benefitting from a recovery in real income over the medium term, driven by lower energy inflation and a resilient labour market. Rising government spending on infrastructure and defence, complemented by investment in AI and digital technologies, should also support growth. Export growth should pick up on the back of strengthening foreign demand, also driven by AI.\n\nThe medium-term outlook is surrounded by uncertainty over how intense and long-lasting the Middle East conflict will be, and how the resulting shocks might propagate through the economy. Risks to growth are assessed to be on the downside.\n\nFiscal sustainability remains a crucial anchor for broader economic stability.", "source": "ECB Press", "pub_date_str": "17 Oct 2026, 10:30 AM IST", "pub_date_relative": "44m ago", "cfa_topics": ["Economics", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "$60 billion in 6 weeks: RBI's rupee defence comes at a cost", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Forex \u203a Forex News \u203a $60 billion in 6 weeks: RBI's rupee defence comes at a cost Central Depository Services (India) Share Price The Economic Times daily newspaper is available online now. Read Today's Paper $60 billion in 6 weeks: RBI's rupee defence comes at a cost SECTIONS $60 billion in 6 weeks: RBI's rupee defence comes at a cost By ET Bureau Last Updated: Oct 17, 2026, 10:26:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Reserve drain Forex reserves fall to $726 b on Oct 9 from $7 , {"title": "BOJ may need to tighten faster if inflation beats forecast, IMF says", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Oct 2026, 10:18 AM IST", "pub_date_relative": "56m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "AI bubble burst may trigger 2008-like banking crisis, says Gary Marcus", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a AI bubble burst may trigger 2008-like banking crisis, says Gary Marcus Powered By The Economic Times daily newspaper is available online now. Read Today's Paper AI bubble burst may trigger 2008-like banking crisis, says Gary Marcus SECTIONS AI bubble burst may trigger 2008-like banking crisis, says Gary Marcus By Surabhi Agarwal , ET Bureau Last Updated: Oct 17, 2026, 10:27:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis In a recent discussion, Gary Marcus raised critical flags about OpenAI's fiscal responsibilities as the stock market faces instability. He warned that the demise of leading AI firms could trigger extensive financial repercussions. Notably, Marcus compared the current climate to WeWork's disastrous decline, suggesting that Microsoft might pick up OpenAI at a bargain.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sense Ravindra Sonavane , ET Bureau Last Updated: Oct 17, 2026, 10:30:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Indian IT sector experienced an impressive surge, achieving its highest weekly increase in 18 years, driven by unexpectedly strong quarterly results from companies like HCLTech. The Nifty IT index jumped 11.7%, amidst falling semiconductor stock prices in Asia. Furthermore, the rupee showed notable strength, closing below the 95-mark for the first time in 38 days, reflecting the effective measures implemented by the Reserve Bank of India.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "17 Oct 2026, 09:46 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Swiggy share price: Down 50% in 1 year; can food delivery stock recover? Should you buy the dip? Check target, stop-loss", "full_content": "Swiggy shares have come under significant pressure over the past year, raising questions about whether the food delivery and quick-commerce company can stage a sustained recovery.\n\nWhile improving profitability in its core food delivery business and efforts to reduce quick-commerce losses have strengthened the fundamental investment case, the stock's technical structure remains weak.\n\nIn the previous session, the stock ended 2% higher at \u20b9 234.05. It is now 49% away from its 52-week high of \u20b9 460, hit in October 2025 and its 52-week low of \u20b9 228.50, hit in in the previous session, October 16, 2026.\n\nIt has been under pressure recently, down 13% in 1 month, 14% in 3 months, 16% in 6 months and around 50% in the last 1 year.\n\nRecently, domestic brokerage house Anand Rathi Share and Stock Brokers upgraded Swiggy to Buy, retaining its target price of \u20b9 310, implying a potential upside of over 32%. However, technical analyst Jigar S Patel has advised caution, identifying key support and breakout levels that could determine the stock's next move.\n\nAnand Rathi said Swiggy was moving from a phase in which growth came at the expense of profitability towards one in which growth could increasingly support earnings. The brokerage highlighted the recovery in contribution margin, which improved from a loss of around 5.6% in Q4FY25 to contribution break-even in Q1FY27.\n\n\u201cThe core Food Delivery segment continued to serve as primary profit generator. The segment recorded steady EBITDA margin of ~3.1% on a strong ~17.4% YoY expansion in GOV in Q1FY27,\u201d Anand Rathi said in its October 16 research report.\n\nAnand Rathi expects food delivery to record annual GOV growth of 18-20% over FY26-FY28, alongside further margin expansion.", "source": "LiveMint Markets", "pub_date_str": "17 Oct 2026, 09:43 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Home loan alert: SBI, PNB and 4 other banks revise lending rates \u2014 how borrowers may be affected", "full_content": "The Reserve Bank of India (RBI) recently hiked its benchmark repo rate by 25 basis points to 5.50% on 7 October 2026. This announcement was made at the culmination of the three-day Monetary Policy Committee (MPC) meeting.\n\nSubsequently, several banks have also increased their repo-linked lending rates, thus making loans linked to these benchmarks potentially more expensive. Prominent lending institutions such as State Bank of India (SBI), Punjab National Bank (PNB), Bank of India, Indian Bank, Bank of Baroda and Canara Bank have revised their respective lending benchmarks in October 2026.\n\nDue to these developments, existing borrowers and those planning to take fresh home loans should diligently check the latest rates, as changes in lending benchmarks can impact borrowing costs and monthly instalments. Having clarity on these aspects is essential in order to make meaningful and beneficial borrowing decisions.\n\nHere are the revised rates announced by six major banks across the country:\n\nTherefore, an increase in a lending benchmark can raise the interest rate on loans linked to it. This also depends on the lending institution's applicable spread and loan terms. Existing borrowers might witness higher EMIs or a longer repayment period, depending on how their banking institution adjusts the loan. New borrowers and fresh loan applicants may also face higher borrowing costs due to these changes.\n\nStill, do keep in mind that the revised benchmark is not necessarily the final interest rate the borrower pays. That is why it is prudent to carefully review and compare the effective interest rate, processing charges and repayment terms across lending institutions before taking a loan or planning to refinance an existing loan.\n\nIf you are an existing borrower, you should check with your lending institution to confirm when the revised rate will apply and how it will affect your existing loan.\n\nShivam writes on personal finance, equity markets, and mutual funds.", "source": "LiveMint Money", "pub_date_str": "17 Oct 2026, 09:43 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Dollar heads for weekly loss as Fed hike bets fade, AI jitters linger", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache
