rest on Thursday, November 19, after government officials indicated plans for a significant increase in defence capital expenditure.\n\nThe proposed 20% hike could strengthen the procurement pipeline and create opportunities for domestic manufacturers, with major acquisitions such as 114 Rafale fighter jets and six advanced conventional submarines under Project 75I potentially on the agenda.\n\nShares of defence companies rose by as much as 3% during the session. BEL, Apollo Micro Systems, HAL, BDL, Astra Microwave, Paras Defence, GRSE, Mazagon Dock, Bharat Forge and Data Patterns were among the notable gainers, with advances ranging between 1% and 3%. Investor sentiment improved after Defence Secretary Rajesh Kumar Singh said the ministry was seeking a substantial increase in capital spending, while Defence Minister Rajnath Singh highlighted the country's expanding defence manufacturing and export capabilities.\n\nDespite intermittent corrections, expectations of sustained government spending have supported the sector. The Nifty India Defence index has gained 14.5% in 2026 so far and more than 7% over one year. However, it has declined 3% in the past week, 4% over one month and over 11% in three months.\n\nThe Defence Ministry is looking for a 20% increase in capital expenditure in compounded annual growth rate (CAGR) terms for FY28, over and above the 22% increase secured in the previous year, according to Defence Secretary Rajesh Kumar Singh. The proposed increase could provide greater financial headroom for procurement programmes and support the government's efforts to expand military capabilities.\n\nIndia's defence capital expenditure allocation for FY27 stood at \u20b9 2.19 lakh crore, compared with the FY26 Budget estimate of \u20b9 1.8 lakh crore.", "source": "LiveMint Markets", "pub_date_str": "19 Nov 2026, 01:23 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Corporate Issuers", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "FDI Ban On Tobacco Manufacturing: India Foundation Recommends Major Policy Reset", "full_content": "The FDI ban was issued on 10 May 2010, after a Cabinet Committee on Economic Affairs decision the previous month.", "source": "NDTV Profit", "pub_date_str": "19 Nov 2026, 01:21 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Nifty's Rally Far From Over? One Analyst Sees 28,000 Ahead Amid 13% Recovery From Recent Lows", "full_content": "Singh's positive outlook is supported by mutliple factors including foreign institutional investor (FII) buying, improving corporate earnings and valuations that remain below their recent historical average.", "source": "NDTV Profit", "pub_date_str": "19 Nov 2026, 01:13 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Auto stocks hit the accelerator! Nifty Auto jumps 4%; Maruti, M&M, Hyundai lead the rally | What's behind the surge?", "full_content": "HYUNDAI TMCV Dhanya Nagasundaram Published 19 Nov 2026, 01:09 PM IST Prefer Livemint on Google Auto stocks witnessed a sharp rally on Thursday, with the Nifty Auto index surging nearly 4% as a steep correction in key industrial metals eased concerns over rising input costs for automobile manufacturers.\n\nMaruti Suzuki India led the gains, climbing 7%, while Hyundai Motor India , Eicher Motors and Mahindra & Mahindra (M&M) advanced around 5% each. Tata Motors Passenger Vehicles (TMPV) rose 4%.\n\nThe rally comes as several key commodities used in automobile manufacturing have corrected sharply. Copper prices have slipped to a seven-month low and turned flat for 2026, while aluminium has fallen to a 51-week low. Silver is trading at a 14-month low, gold at a 12-month low and tin at an eight-month low, according to reports.\n\nThe decline in base metal prices is expected to ease input cost pressures for automakers and potentially support margins. However, the benefit may not be immediate, as existing procurement cycles could delay the transmission of lower commodity prices to manufacturers. Rising domestic steel prices could also offset some of the expected savings.\n\nMarket participants will therefore be watching how quickly the correction in global commodity prices translates into lower input costs and improved margins. The extent of the benefit could also vary across vehicle segments, depending on their raw material requirements and procurement arrangements.\n\nSudeep Shah, Head \u2013 Technical and Derivatives Research at SBI Securities, said the Nifty Auto index found support near its 13-day exponential moving average (EMA) before staging a sharp rebound. The index surged nearly 4% on Thursday, forming a sizeable bullish candle on the daily chart.\n\nHe attributed the improvement in sentiment partly to the sharp correction in raw material prices, particularly copper, which declined nearly 6% in the previous session to a seven-month low.", "source": "LiveMint Markets", "pub_date_str": "19 Nov 2026, 01:09 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Derivatives", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "BL Kashyap & Sons shares surge 15%, set for biggest 1-day gain since April. What's behind the investor optimism?", "full_content": "Shares of B L Kashyap & Sons, one of India\u2019s leading engineering, procurement and construction (EPC) companies, surged 15% in Thursday\u2019s intraday trade to hit an all-time high of \u20b9 60.35 apiece. If the gains hold through the close, it would mark the stock\u2019s biggest single-day jump since April.\n\nThe rally also lifted the stock\u2019s monthly gains to 12.7% so far, marking a sharp reversal after months of heightened volatility.\n\nAlthough there was no immediate fundamental trigger for the rally, a sharp spike in trading volumes helped the stock recover from its recent weakness. Around 48 million shares had changed hands across the BSE and NSE as of noon, nearly 26 times the stock\u2019s weekly average trading volume, according to Trendlyne data.\n\nThe shares have remained on investors\u2019 radar following the September-quarter results and a series of order wins. Earlier this month, the company secured a new order worth approximately \u20b9 495.86 crore, excluding GST, from Signature Global (India) Ltd.\n\nThe contract involves civil structural and partial mechanical, electrical and plumbing (MEP) works for four towers and basements at a residential project with ancillary commercial facilities in Gurugram, Haryana. This marks the company\u2019s second order win in the city during the current quarter, reflecting continued business momentum in the region.\n\nThe company continues to expand its presence across key markets through the execution of residential, commercial and infrastructure projects.\n\nDuring the September quarter, B L Kashyap secured new orders worth \u20b9 696 crore, taking its total order wins in FY27 so far to \u20b9 1,150 crore, according to the company\u2019s earnings presentation.\n\nThe company reported its highest quarterly revenue in the last decade, with consolidated revenue rising 40.3% year-on-year to \u20b9 498.15 crore in Q2FY27, compared with \u20b9 355.13 crore in the corresponding quarter last year.", "source": "LiveMint Markets", "pub_date_str": "19 Nov 2026, 01:08 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Kerala\u2019s Senior Citizens Bill: how retirees can protect their money, property, and bank accounts", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nThe Kerala Legislative Assembly unanimously passed the Keralam Senior Citizens (Care and Protection of Rights) Bill, 2026, on 26 October. The comprehensive state-level legislation seeks to strengthen protections for older people. For retirees, it is useful to understand how its provisions differ from the benefits and safeguards already available to senior citizens across India.\n\nWhile pan-India rules like the Maintenance and Welfare of Parents and Senior Citizens (MWPSC) Act, 2007, which focuses on forcing negligent children to pay monthly maintenance or return gifted property, Kerala\u2019s Bill is more preventive in nature, against financial exploitation, care-home pressure, and cyber fraud. While the bill strengthens legal protection for senior citizens living in Kerala, there are only a few impactful or first-of-its-kind changes that senior citizens can benefit from.\n\nAcross India, elderly citizens already have two major financial remedies under the 2007 Central Act.\n\nThe first is monthly maintenance. Destitute seniors can approach a Maintenance Tribunal to claim support from their children or relatives, capped at \u20b9 10,000 per month under Section 9(2).\n\nThe second is protection against conditional property transfers. Under Section 23, if an elder gifts property to children on the condition that they will provide care and the recipients fail to do so, tribunals can cancel the gift deed and restore possession. This pan-India protection has also been reinforced by Supreme Court rulings.\n\nKerala\u2019s Bill preserves these measures while adding safeguards against abuse in care homes and digital banking fraud.\n\nWhile the pan-India law focuses largely on maintenance and property disputes within families, Kerala\u2019s Bill defines economic abuse and financial exploitation as cognizable offences involving a wider set of stakeholders, including care-home heads, staff and private caregivers.", "source": "LiveMint Money", "pub_date_str": "19 Nov 2026, 01:04 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "APEC final day in photos: Trump, Xi and Putin shake hands; Takaichi kept at a distance", "full_content": "World leaders including the U.S. President Donald Trump and Russia's Vladimir Putin gathered Thursday for the second day of the Asia-Pacific Economic Cooperation summit, ahead of a historic trilateral meeting between the U.S., Russia and China later in the day.\n\nInternational Monetary Fund Managing Director Kristalina Georgieva kicked off Thursday's agenda after China's President Xi Jinping's welcome note. Georgieva said that artificial intelligence and energy supply shocks had accelerated global inflation in many economies, calling for monetary policy tightening.\n\nJapanese Prime Minister Sanae Takaichi was met with another cold reception . She spent several minutes trying to talk to Xi who did not appear to respond with no interpreter present.\n\nTrump held separate bilateral meetings with Putin and Xi earlier in the day. The president praised Xi's leadership and said Washington was negotiating deals with several major APEC economies.\n\nIn their first in-person talks in over a year, Trump told Putin that \"We've known each other for a long time, and I think a lot of wonderful things can come out of this \u2014 or at least start,\" referring to Putin as a \"friend.\"\n\nThe three leaders are due to hold their first-ever trilateral meeting later Thursday, with the Middle East conflict, Russia's war in Ukraine, trade and artificial intelligence likely on the agenda. Expectations for the historic three-way meeting to yield any concrete outcome remain low.\n\nThe summit will conclude Trump's whirlwind Asia trip, after which the American president will return to Washington, D.C.\n\nHere are the highlights in photos from the second and final day of the APEC summit:", "source": "CNBC Top News", "pub_date_str": "19 Nov 2026, 01:02 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "PM Modi's Big Message At FICCI's Event: Don't Take Indians For Granted As Assured Market', Countrymen Deserve Top Quality'", "full_content": "Prime Minister Modi urged Indian businesses to improve product quality for domestic consumers and leverage free trade agreements.", "source": "NDTV Profit", "pub_date_str": "19 Nov 2026, 12:55 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Corporate Issuers"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Bond Market Stress To Climate Extremes: Harsh Goenka Shares 10 Trends To Watch In 2027", "full_content": "Goenka says the battle to succeed Donald Trump begins in 2027. Trump is in his second and final term, which ends in January 2029.", "source": "NDTV Profit", "pub_date_str": "19 Nov 2026, 12:40 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Jewellery Stocks In The Red: TBZ, Sky Gold And PC Jeweller Lead Losses; How Other Stocks Are Performing", "full_content": "Tribhovandas Bhimji Zaveri, Sky Gold and Senco Gold lead declines in early trade, while Kalyan Jewellers and Thangamayil Jewellery recover from opening losses.", "source": "NDTV Profit", "pub_date_str": "19 Nov 2026, 12:39 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Reliance Industries shares: After 13% surge in 1 month, JPMorgan sees another 23% upside in Mukesh Ambani stock | Target", "full_content": "RETAIL ENERGY Pranati Deva Published 19 Nov 2026, 12:39 PM IST Prefer Livemint on Google Reliance Industries share price target : Reliance Industries shares may have more room to run despite their sharp recovery over the past month, as improving profitability in the company's oil-to-chemicals (O2C) business and the possibility of further earnings upgrades could support the next leg of the rally. Global investment firm JPMorgan believes the stock's recent gains have not entirely captured its improving earnings outlook, keeping the investment case alive even as some of its valuation advantage has narrowed.\n\nIn its latest note, JPMorgan maintained its 'Overweight' rating on Reliance Industries and set a price target of \u20b9 1,675. This indicated an upside potential of around 23% from Wednesday's closing price of \u20b9 1,363.\n\nRIL was trading at \u20b9 1,366.90 on Thursday, after gaining over 13% in the preceding month. However, its performance over longer periods remained mixed, with the shares rising 4% in three months and 3% in six months, while declining 10% over the past year.\n\nMeanwhile, the Mukesh Ambani stock was around 15% below its 52-week high of \u20b9 1,611.20, recorded in January 2026. Its 52-week low stood at \u20b9 1,152.30, touched in October 2026.\n\nJPMorgan's investment thesis rests on improving earnings, particularly in O2C, alongside the possibility of fresh business catalysts that could sustain the stock's recovery.\n\nAs per reports, JPMorgan expects Reliance Industries to report strong year-on-year growth in net profit over the next few quarters, primarily supported by an improvement in its O2C business. The brokerage also sees scope for further earnings upgrades, particularly for FY28, if margins remain firm.\n\nAccording to the global investment firm, the stock has not fully priced in the earnings upgrades already made by analysts.", "source": "LiveMint Markets", "pub_date_str": "19 Nov 2026, 12:39 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Asian Stocks Set to Fall Ahead of Anthropic Debut: Markets Wrap - Bloomberg", "full_content": "Asian Stocks Set to Fall Ahead of Anthropic Debut: Markets Wrap Bloomberg Anthropic to float on the stock market today as it raises $81bn in record IPO \u2013 business live The Guardian Charting the world\u2019s biggest IPOs as Anthropic overtakes SpaceX Al Jazeera How Anthropic\u2019s I.P.O. Valuation Stacks Up With the Biggest Tech Debuts Since the \u201980s The New York Times Is the AI party over? Anthropic is about to find out. Yahoo Finance", "source": "Google News Business", "pub_date_str": "19 Nov 2026, 12:37 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Goldman Sachs names 22 \u2018high-growth\u2019 stocks; Bharti Airtel, Eternal and HDFC Bank feature in the list", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News Goldman Sachs names 22 \u2018high-growth\u2019 stocks; Bharti Airtel, Eternal and HDFC Bank feature in the list Written by Eshita Gain , ETMarkets.com | Nov 19, 2026, 12:43:07 PM IST 1 / 7 Top stock picks Indian equities have rallied over the past few weeks despite weakness in global markets. Falling crude oil prices and sustained foreign institutional inflows into Indian financi     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
