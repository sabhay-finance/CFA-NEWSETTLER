ul, heard about the mandatory mock trading, his first reaction was that he wouldn\u2019t even attempt it because it was \u201ctoo much of a hassle.\u201d\n\n\u201cThe hours sound long and you can only download the program on PCs,\u201d Kim said. \u201cMy work computer can\u2019t download external programs. It doesn\u2019t sound easy to bring an extra laptop with me to work.\u201d\n\nThe mock trading exercises add to a slew of regulatory curbs since July to deter investors from trading the leveraged ETFs tied to Samsung Electronics and SK Hynix, the chipmaking duo that dominate the world\u2019s AI supply chain. Earlier tightening measures included a higher minimum deposit.\n\nThese single-stock ETFs were introduced in May to draw retail money into the local market, but quickly became a political hot potato.", "source": "LiveMint Markets", "pub_date_str": "30 Aug 2026, 06:08 AM IST", "pub_date_relative": "53m ago"}, {"title": "Corporate Actions This Week: Coal India, ONGC, Glenmark Pharma, GAIL, Nirlon \u2014 Check Full List Here", "full_content": "Several companies including Coal India, ONGC, and Procter & Gamble Hygiene & Health Care have announced corporate actions this week, covering stock splits, bonus issues, and various dividends.", "source": "NDTV Profit", "pub_date_str": "30 Aug 2026, 06:00 AM IST", "pub_date_relative": "1h ago"}, {"title": "GM plans C$1.1 billion Canada investment as U.S. tariff pressure mounts", "full_content": "", "source": "Investing.com News", "pub_date_str": "30 Aug 2026, 05:31 AM IST", "pub_date_relative": "1h ago"}, {"title": "ACC Men's Premier Cup 2026: Schedule, Teams, Live Streaming And Squads", "full_content": "ACC Men's Premier Cup 2026 starts Aug. 30 in Malaysia, with 10 Associate teams battling for the title and a spot in the 2027 Men's Asia Cup.", "source": "NDTV Profit", "pub_date_str": "30 Aug 2026, 05:30 AM IST", "pub_date_relative": "1h ago"}, {"title": "Hairline Fix: India wants to snip China\u2019s growth", "full_content sks \u2014 of leveraged trading with virtual cash. Interviews with several Korean retail investors suggest the new requirement, effective Aug. 19, is too cumbersome to meet.\n\nWhen Kim Jung-hoon, a 41-year-old resident of Gyeonggi province outside Seoul, heard about the mandatory mock trading, his first reaction was that he wouldn\u2019t even attempt it because it was \u201ctoo much of a hassle.\u201d\n\n\u201cThe hours sound long and you can only download the program on PCs,\u201d Kim said. \u201cMy work computer can\u2019t download external programs. It doesn\u2019t sound easy to bring an extra laptop with me to work.\u201d\n\nThe mock trading exercises add to a slew of regulatory curbs since July to deter investors from trading the leveraged ETFs tied to Samsung Electronics and SK Hynix, the chipmaking duo that dominate the world\u2019s AI supply chain. Earlier tightening measures included a higher minimum deposit.\n\nThese single-stock ETFs were introduced in May to draw retail money into the local market, but quickly became a political hot potato.", "source": "LiveMint Markets", "pub_date_str": "30 Aug 2026, 06:08 AM IST", "pub_date_relative": "53m ago", "cfa_topics": ["Equity Investments", "Ethical & Professional Standards"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "GM plans C$1.1 billion Canada investment as U.S. tariff pressure mounts", "full_content": "", "source": "Investing.com News", "pub_date_str": "30 Aug 2026, 05:31 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Hairline Fix: India wants to snip China\u2019s growth", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a Hairline Fix: India wants to snip China\u2019s growth The Economic Times daily newspaper is available online now. Read Today's Paper Hairline Fix: India wants to snip China\u2019s growth SECTIONS Hairline Fix: India wants to snip China\u2019s growth By Shantanu Nandan Sharma , ET Bureau Last Updated: Aug 30, 2026, 05:30:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis China reportedly uses Myanmar for processing Indian human hair, raising concerns about child labor. Indian exporters face visa rejections for attending a major Chinese wig exhibition. India exports significant raw hair volume while importing finished wig products. Industry associations urge the government to ban raw hair exports. This move aims to boost domestic processing and job creation opportunities.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\nChina is allegedly relying more on conflict-hit Myanmar as a base for processing human hair sourced largely from India\n\nET Prime special series: 2013 to 2026. Not years, but evidence: Power Grid, Part 2\n\nBehind the sugar price drop: Exports, imports and a non-factor called ethanol\n\nAs IndiGo, Air India scramble for pilots, fresh headwinds hit hard\n\nWhen a CFO resigns, is \u2018personal reasons\u2019 explanation enough?\n\nFCNR (B) scheme garners USD65 bn, but why isn't the rupee gaining?", "source": "Economic Times Economy", "pub_date_str": "30 Aug 2026, 05:30 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Warsh, After Talking Tough on Inflation, Faces a \u2018No-Win Situation\u2019 on Rates - The New York Times", "full_content": "Warsh, After Talking Tough on Inflation, Faces a \u2018No-Win Situation\u2019 on Rates The New York Times Markets Brace for Possible Rate Hike After Kevin Warsh\u2019s Hawkish Turn WSJ Key Takeaways From the Fed\u2019s Annual Jackson Hole Conference Bloomberg.com Kevin Warsh tries being a normal central banker The Economist Analysis: Kevin Warsh sharpens inflation warning at Jackson Hole, signaling possible rate hike CNBC", "source": "Google News Business", "pub_date_str": "30 Aug 2026, 03:17 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Bitcoin price holds at $78,000 as \u2018digital gold\u2019 narrative faces fresh test", "full_content": "", "source": "Investing.com News", "pub_date_str": "30 Aug 2026, 02:43 AM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "K, C or E? Why economists can\u2019t agree on the shape of today\u2019s economy", "full_content": "Those aren't initials or Greek life letters. They're some of the terms that economists, corporate leaders and politicians are using as they attempt to define the U.S. current economic moment.\n\nSince the recovery from the pandemic, economists have largely viewed the economy as acting in a \"K\"-shape , displaying an unequal expansion across groups and the arms of the \"K\" heading in opposite directions.\n\nNow there's a debate over whether the K-shaped recovery still exists, or if the economy instead resembles the letter \"C\" or \"E.\"\n\n\"This is some of the alphabet soup,\" said Joel Mokyr, a Nobel Prize-winning economic historian at Northwestern University.\n\nThe race to label the structure of today's economy involves more than semantics or bragging rights. In recent years, the divergence among low- and high-income consumers, expressed in a K-shaped economy, has been top of mind for politicians, monetary policymakers, and executives of consumer companies.\n\nFor decades, letter shapes have been used to sum up the economy, especially following major downturns. The list of those used throughout history includes \"V-,\" \"L-\" and \"W-shaped.\"\n\nBut it's unusual for this type of description to have staying power among everyday Americans several years after a recession, as it does today, according to Don Rissmiller, chief economist at research firm Baird Strategas. Mounting concerns around wealth inequality may be driving heightened awareness, he said.\n\n\"During recessions and recoveries, the letters are really popular,\" Rissmiller said. \"To use a letter in the middle of a business cycle, I guess we could say that's a little new.\"", "source": "CNBC Top News", "pub_date_str": "30 Aug 2026, 01:52 AM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Tech backlash reaches fever pitch as AI angst collides with social media fears", "full_content": "Silicon Valley's technology leaders have long dreamed of making the world a better place. But now more than ever, Americans say they're living in a tech-induced nightmare.\n\nThe rapid rise of artificial intelligence giants like OpenAI and Anthropic has exacerbated a deep malaise toward the tech sector, especially among people who have come to associate AI with job loss and now see outsized data centers rising up in their backyards. The last generation of technology, meanwhile, ushered in a cohort of social media apps that proved so addictive that Meta agreed to fork over up to $17 billion as part of a landmark settlement this week.\n\nAt a time of stubbornly high inflation that's pushed consumer confidence to a seven-month low, Americans are looking up to see tech's trillion-dollar companies getting bigger and more powerful, all while being led by some of the wealthiest people on the planet.\n\n\"If this technology takes off in the way that you see the CEOs of AI Labs talking about, we're facing a significant impact to our economy, to people's jobs, to their sense of agency,\" Sarah Myers West, co-executive director of research firm AI Now Institute, told CNBC in an interview. \"There are lots of members of the public that don't want to see that vision roll out.\"\n\nMore than half of Americans say they're more concerned than excited about the growing use of AI in daily life, according to a recent report from the Pew Research Center. That's up from 37% in 2021. And in a poll earlier this year, the Searchlight Institute found that the overwhelming majority of voters believe social media has a negative impact on society.\n\nConfidence in AI executives is even more dismal, according to a CNBC Generation Lab survey of 18- to 34-year-olds.", "source": "CNBC World Economy", "pub_date_str": "30 Aug 2026, 01:25 AM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Economics", "Financial Statement Analysis"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Russian strike on Kyiv-area ammunition depot triggers blast, killing 37", "full_content": "At least 37 people were killed after a Russian drone attack on a Kyiv-area ammunition depot sparked a detonation, President Volodymyr Zelenskyy said on Saturday, vowing to punish suspected negligence in the second such incident in two months.\n\nThe deadliest Russian strike in the Kyiv area this year came as Moscow's air attacks on the Ukrainian capital and surrounding region dragged into a third straight day, killing residents, damaging homes and derailing daily life.\n\nDozens were also injured and hundreds evacuated from the area of the strike late on Friday in the village of Myla, Zelenskiy said, where nearby infrastructure including residential buildings and a facility for the elderly and people with disabilities suffered \"significant damage\".\n\nThe attack sparked widespread fires, officials said. Among those killed was the head of a neighboring village who rushed to help.\n\n\"A terrible situation and terrible negligence on the part of those who stored explosives right next to people,\" Zelenskiy said in a video address.\n\nThe site of Friday's blast was a military facility that held artillery shells, mines and drones, among other ammunition, he added.\n\nIt followed a similar incident in the Kyiv-area town of Vyshneve last month, when 10 people were killed and hundreds of houses damaged after a strike triggered secondary explosions.\n\n\"Another such crime \u2013 after what happened in Vyshneve \u2013 is absolutely unacceptable,\" Zelenskiy said. \"I expect the details to be presented to the public promptly.\"", "source": "CNBC Top News", "pub_date_str": "30 Aug 2026, 12:55 AM IST", "pub_date_relative": "6h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "OpenAI to end model access to Cursor after acquisition by Elon Musk's SpaceX", "full_content": "OpenAI announced late Friday that it is ending developers' access to its models on Cursor, following the acquisition of the AI coding startup by Elon Musk's SpaceX earlier this month.\n\nCursor CEO Michael Truell said, in a post on the SpaceX-owned social network X Friday night: \"OpenAI models serve about 5% of Cursor user traffic, and we're speaking with the OpenAI team to resolve this. Cursor was one of the very first users of OpenAI, we've worked closely with their team for years, and we've trusted their platform to be neutral infrastructure for our business.\"\n\nIn their announcement, OpenAI said, \"We are making this choice because we cannot be confident that SpaceX will use our technology within our terms of service, based on our experience with Elon Musk's companies violating contracts.\"\n\nIts \"proposed shutoff date\" for OpenAI models via Cursor is Nov. 12, 2026. OpenAI also said it would not provide future models to Cursor as it winds down the agreement.\n\nCursor and OpenAI did not immediately respond to CNBC's requests for comment.\n\nSpaceX completed its $60 billion acquisition of Cursor on Aug. 14 , according to financial filings. Before SpaceX went public in June, it had acquired Musk's X and xAI in February .\n\nOpenAI's move away from Cursor, now that SpaceX owns it, is part of a long-running and acrimonious clash between Musk and OpenAI CEO Sam Altman and President Greg Brockman.\n\nIn a post on X on Saturday , Musk wrote, \"I couldn't care less. Scam Altman and Greg Stockman are utterly untrustworthy,\" used an expletive to describe them, then repeated his claim that they \"stole an open source nonprofit.\"", "source": "CNBC World Economy", "pub_date_str": "30 Aug 2026, 12:36 AM IST", "pub_date_relative": "6h ago", "cfa_topics": ["Corporate Issuers", "Alternative Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "OpenAI to end model access to Cursor after acquisition by Elon Musk's SpaceX - CNBC", "full_content": "OpenAI to end model access to Cursor after acquisition by Elon Musk's SpaceX CNBC OpenAI cuts off Cursor's AI models, deepening feud with Musk Mashable OpenAI says it's ending its deal with Cursor because Elon Musk's companies violate contracts Yahoo Finance Michael Truell: The 100 Most Influential People in AI 2026 Time Magazine Our decision on Cursor following its acquisition by SpaceX OpenAI", "source": "Google News Business", "pub_date_str": "30 Aug 2026, 12:35 AM IST", "pub_date_relative": "6h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "GST Council to hold 57th meet on Sept 12", "full_content": "The GST Council will meet on September 12 to discuss key reforms. Proposals include easier input tax credit access for buyers and simplified corporate guarantee treatment. Small businesses may soon register in multiple states for easier compliance. The meeting aims to address unresolved issues affecting working capital and costs. This session follows nearly a year after the council's last gathering.", "source": "Economic Times Economy", "pub_date_str": "29 Aug 2026, 11:58 PM IST", "pub_date_relative": "7h ago", "cfa_topics": ["Financial Statement Analysis", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Trump administration weighs Yosemite land swap for private developer\u2019s access road", "full_content": "The Trump administration is considering a Yosemite land exchange that could give a developer more direct park access.", "source": "CNBC Top News", "pub_date_str": "29 Aug 2026, 11:51 PM IST", "pub_date_relative": "7h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Iran War Reshapes Global Energy: Why China, EVs, Renewables Are Emerging Winners And Where Does India Stand", "full_content": "The Iran war has pushed up fossil-fuel costs, while China benefits from growing momentum in renewables, EVs and clean technologies.", "source": "NDTV Profit", "pub_date_str": "29 Aug 2026, 11:33 PM IST", "pub_date_relative": "7h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Money rules changing from September 1: ITR deadlines, KYC updates and cost revisions you need to know", "full_content": "On September 1, LPG and ATF prices, along with banking charges, may change. Consumers should check local prices and bank fees to avoid unexpected costs. Important tax deadlines also impact taxpayers, with August 31 being crucial for return filings and Aadhaar authentication.", "s ate_str": "29 Aug 2026, 10:16 PM IST", "pub_date_relative": "8h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Will the housing market crash in 2026? Experts weigh in - thestreet.com", "full_content": "Will the housing market crash in 2026? Experts weigh in thestreet.com Why high home prices may be an illusion Axios Housing demand has slowed, but still stable for now HousingWire U.S. Economy: The Outlook For Housing Worsens Seeking Alpha America's housing Market Looks More Balanced, Until You Look at Who Is Still Shopping Mountain Democrat", "source": "Google News Business", "pub_date_str": "29 Aug 2026, 09:24 PM IST", "pub_date_relative": "9h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}], "updated_at": "30 Aug 2026, 07:01 AM IST", "total_stories": 360};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
