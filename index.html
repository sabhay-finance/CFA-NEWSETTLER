<script>
    // This variable will be injected during the build process
    const allData = {"general": [{"title": "Nasdaq gains as Musk's SpaceX and Tesla revive tech rally: Live updates", "full_content": "The Nasdaq Composite rose on Wednesday as the latest developments surrounding SpaceX and Tesla led investors to move back into technology.\n\nThe tech-heavy Nasdaq added 1.2%, and the S&P 500 traded up 0.7%. The Dow Jones Industrial Average climbed 290 points, or 0.6%.\n\nShares of Elon Musk's SpaceX surged 6% after the company said its revenue grew 161% in the third quarter. Musk also said that SpaceX and Tesla, his auto manufacturer, have formed special committees to discuss a merger. Tesla, which is due to report earnings later, was up more than 3%.\n\nSpaceX's artificial intelligence business grew ninefold, reigniting enthusiasm for stocks related to the trade. Key chipmakers such as Advanced Micro Devices advanced about 3%, while Nvidia rose nearly 2%. Micron Technology and Marvell Technology each grew around 2%. The VanEck Semiconductor ETF (SMH) was up almost 1%.\n\n\"SpaceX suggests there is still a longer runway here, but that fundamental tension or experience of getting overly enthusiastic and overly capitalizing things I don't think has changed,\" said Joe Zidle, Cresset's chief market strategist.\n\nConcerns around the AI trade's sustainability have weighed on market sentiment lately, as traders focused on debt-backed AI investments and whether the infrastructure demand justifies companies' spending. But Zidle anticipates that the current reporting period will show that a number of AI-related companies are continuing to see stronger demand.\n\n\"I think when we get to the end of earnings season and we look back, SpaceX is not an anomaly; it's not a phenomenon; it's actually something that's going to be, I think, more common to the sector,\" he said.\n\nInvestors are seeking more insights into the AI trade on Wednesday, with Meta Platforms also set to report after the bell. Earlier this month, the company rolled out its latest AI model , Muse Wonder, which is only available to paying users.", "source": "CNBC Top News", "pub_date_str": "21 Oct 2026, 11:36 PM IST", "pub_date_relative": "2m ago"}, {"title": "GM aims to develop vehicles in as little as two years with AI, software push", "full_content": "NEW YORK \u2014 General Motors plans to lean into artificial intelligence and vehicle software for future growth and development amid increasing competition abroad from Chinese automakers and a tougher U.S. market.\n\nThe Detroit automaker on Wednesday shared new details about a proprietary AI agent it's releasing under its OnStar brand, plans for a fourth generation of more efficient all-electric vehicles and a target to cut its vehicle development time in half.\n\nGM also reconfirmed that by 2028 , it wants to have eyes-off highway driving, or \"personal autonomy,\" that will let drivers take their attention off the road. The automaker said that technology would start with the Cadillac Escalade IQ EV before rolling out to other, more high-volume models.\n\n\"All of these developments are building us the car of the future,\" CEO Mary Barra said Wednesday during an event laying out the plans, called \"GM Forward,\" in downtown Manhattan.\n\nThe initiatives, which Barra, Chief Product Officer Sterling Anderson and other executives discussed at the event, are designed to streamline the automaker's operations, while also improving the capabilities of its vehicles for customers.\n\n\"Over the last 12 months, we've evolved how we design, engineer and build our vehicles,\" said Anderson, who led the event and who has been tasked with overseeing GM's latest technology transformation.\n\nGM said it is now targeting a vehicle development time of roughly two years from concept to production versus a traditional four- to five-year cycle. However, the company did not detail a timeline for reaching that goal.\n\nThe event comes as Chinese automakers are growing outside of the U.S. with rapid development times of new technologies and vehicles. Consulting firm AlixPartners said it believes China is currently bringing vehicles to market twice as fast as traditional automakers, with 40% to 50% less investment and a 30% cost advantage.", "source": "CNBC Top News", "pub_date_str": "21 Oct 2026, 11:33 PM IST", "pub_date_relative": "4m ago"}, {"title": "Anthropic adds former Harvard science dean to oversight body", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Oct 2026, 11:24 PM IST", "pub_date_relative": "13m ago"}, {"title": "Reliance says Ambanis and Rubio discussed global energy, data centres in visit", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Oct 2026, 11:24 PM IST", "pub_date_relative": "14m ago"}, {"title": "Trump-aligned super PACs pour millions into once-safe GOP House seats", "full_content": "President Donald Trump has made good on his claim of putting more than $300 million of his political war chest into the 2026 midterm election .\n\nNew campaign finance filings released Tuesday night show millions flowing into House districts that were barely competitive two years ago, underscoring how far the GOP's problems have spread in the final weeks of the campaign.\n\nMAGA Inc. , Trump's main super political action committee, reported $300.5 million in disbursements through Oct. 14, with a quarter of that election cycle total \u2014 $75.5 million \u2014 being spent in the first two weeks of October, according to new Federal Election Commission filings. It still held $164.3 million in cash, and Trump said Tuesday his political operation would spend more than $400 million by Election Day.\n\nMuch of the money is moving through two new Trump-aligned groups. MAGA Inc. has sent $200 million to No Going Back PAC and $25 million to Safety & Affordability PAC , which have already reported more than $209 million in independent expenditures between them, according to FEC filings.\n\nThe spending is also likely to ease months of Republican anxiety that Trump would sit on his massive war chest rather than deploy it in the midterms. GOP operatives had worried as recently as September that MAGA Inc.'s cash would remain largely on the sidelines.\n\nSafety & Affordability has spent $3.76 million in Arizona's 1st District, $1.84 million in Maine's 2nd, $1.60 million in Wisconsin's 3rd, $1.48 million in North Carolina's 1st and $1.40 million in Ohio's 10th. It has also put more than $1 million each into Pennsylvania's 8th, Ohio's 9th and Michigan's 7th, according to a CNBC analysis of the PAC's filing .\n\nSeveral are established battlegrounds. The Cook Political Report with Amy Walter rates Wisconsin's 3rd, North Carolina's 1st, Pennsylvania's 8th, Ohio's 9th and Michigan's 7th among its 21 \"Toss Up\" races.\n\nOther places Trump is donating show Republicans being forced onto less familiar terrain.", "source": "CNBC Top News", "pub_date_str": "21 Oct 2026, 11:21 PM IST", "pub_date_relative": "17m ago"}, {"title": "Which transactions can trigger notice from Income Tax Department? Know rules for large cash deposits and UPI transfers", "full_content": "Receiving large amounts through UPI does not automatically attract an income tax notice. However, taxpayers whose bank accounts show substantial credits that do not match their declared income may face questions from the Income Tax Department, even if the money was received through legitimate digital transactions.\n\nConsider a salaried individual who declares an annual income of \u20b9 12 lakh but receives \u20b9 40 lakh in their bank account during the year. The additional credits could include money from friends, family transfers or business receipts. While these transactions are not necessarily taxable, the individual may have to explain their source if questioned by tax authorities.\n\nAccording to CA Parag Jain, Tax Head at 1 Finance, there is no fixed annual UPI transaction limit under income tax law. What matters is whether taxpayers can establish the nature and source of money credited to their accounts.\n\nJain said there is a widespread misconception that UPI transfers exceeding a particular amount are automatically reported to the Income Tax Department.\n\nUnder the Statement of Financial Transactions (SFT) framework, specified cash deposits are reportable when they reach \u20b9 10 lakh annually in savings accounts or \u20b9 50 lakh in current accounts. These cash-deposit thresholds do not apply to UPI, NEFT, RTGS or IMPS transfers.\n\nHowever, this does not mean digital transactions are beyond scrutiny.\n\nBank statements can be examined during tax proceedings, and taxpayers may be asked to explain credits that appear inconsistent with their declared income.\n\nJain explained that commonly cited UPI limits, including \u20b9 1 lakh per transaction and higher limits for specified categories, are operational restrictions prescribed by NPCI and banks. They are not income tax thresholds.", "source": "LiveMint Money", "pub_date_str": "21 Oct 2026, 11:21 PM IST", "pub_date_relative": "17m ago"}, {"title": "Raymond James cuts BankUnited stock price target to $48 on revenue", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Oct 2026, 11:20 PM IST", "pub_date_relative": "17m ago"}, {"title": "US Treasury yields slip as AI concerns boost safe haven demand ahead of 20 year auction", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a US Treasury yields slip as AI concerns boost safe haven demand ahead of 20 year auction Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US Treasury yields slip as AI concerns boost safe haven demand ahead of 20 year auction SECTIONS US Treasury yields slip as AI concerns boost safe haven demand ahead of 20 year auction ETMarkets.com Last Updated: Oct 21, 2026, 11:28:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis US Treasury yields slipped as investors weighed the impact of higher borrowing costs on AI stocks, with the 10 year yield heading for a second straight daily decline. The move came ahead of a $13 billion 20 year Treasury auction, while markets continued to price in a muted chance of a Fed rate hike.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "21 Oct 2026, 11:19 PM IST", "pub_date_relative": "18m ago"}, {"title": "Earnings call transcript: Nemak posts strong Q3 2026 growth as shares slip", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Oct 2026, 11:18 PM IST", "pub_date_relative": "20m ago"}, {"title": "Meta earnings live updates: AI spending, ad revenue and stock reaction", "full_content": "Meta is slated to report third-quarter earnings after the bell on Wednesday, and investors will be looking for signs that the company's latest artificial intelligence efforts will bolster future sales.\n\nIt's been a big quarter for Mark Zuckerberg's company due to the initial success of the Muse AI personal assistant tool that debuted in September and shot to the top of Apple's iOS app store. That AI momentum helped Meta end September with its best month on Wall Street since 2022.\n\nMeta isn't the first to create a digital assistant that can organize people's email and scan the web for headphone deals, but the company's empire, which includes Facebook and Instagram, has helped introduce AI agents to the masses. At the same time, Meta and its AI chief Alexandr Wang have continued rolling out new foundation models and related updates at a speedy clip, including Muse Wonder , which was released last Monday.\n\nWall Street will likely be monitoring for whether Meta plans to increase its data center-related capital expenditures, or capex, to further develop the underlying computing infrastructure needed to power AI agents and foundation models.\n\nThe company revealed in July during its second-quarter earnings that it narrowed its 2026 capex guidance to come in between $130 billion and $145 billion, representing a $5 billion increase to the low end of its prior range. All that spending resulted in Meta's free cash flow in the period shrinking to $784 million from $8.55 billion in the same quarter a year earlier.\n\nAnalysts expect Meta's capex to swell to $196.3 billion in 2027, according to FactSet.\n\nMeta's third-quarter daily active people, or DAP, is expected to come in at 3.65 billion, according to StreetAccount, almost flat from the prior quarter.", "source": "CNBC World Economy", "pub_date_str": "21 Oct 2026, 11:18 PM IST", "pub_date_relative": "20m ago"}, {"title": "Meta ordered to pay $25 billion penalty in New Mexico Cambridge Analytica case", "full_content": "Meta was ordered to pay $25 billion in penalties by a New Mexico court on Wednesday as part of a data privacy case that stemmed from the company's Cambridge Analytica scandal from nearly a decade ago.\n\nThe penalty, revealed in a court filing, comes after a jury in a Santa Fe courthouse found in September the social media giant liable for misleading state citizens about how it safeguards and collects user data and prevents harmful information from flourishing on its services.\n\nAlthough the jury concluded that Meta had over 43 million violations of the state's unfair practices act, with each transgression carrying a civil penalty as high as $5,000, a New Mexico judge was responsible for determining the ultimate fine. The Wednesday filing showed that the state was awarded $219.5 billion, but the penalty was ultimately reduced to $25 billion.\n\n\"The extraordinary number of willful violations found by the jury, the duration and repetition of the conduct, the breadth of subjects on which violations occurred, the involvement of senior Facebook leadership, the size of New Mexico audiences reached, and the clear intentional and systematic nature of Facebook's repeated misstatements established in the trial record support the highest level of penalty allowed by the New Mexico Unfair Practices Act - $5,000 per violation found by the jury,\" New Mexico district court judge Francis Mathew wrote in the filing.\n\nThe judge added that interest on the penalty shall accrue at the rate of 15% each year until the fine is paid off in full.\n\nCNBC has reached out to Meta for comment on the penalty order.\n\nMeta previously resolved various Cambridge Analytica-derived data privacy lawsuits across the nation as part of an overarching August settlement of nearly $17 billion with a coalition of state attorneys general in a separate federal case related to child safety and mental health.", "source": "CNBC World Economy", "pub_date_str": "21 Oct 2026, 11:15 PM IST", "pub_date_relative": "23m ago"}, {"title": "8x8 at ld micro main event: ai, carrier network drive strategy", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Oct 2026, 11:08 PM IST", "pub_date_relative": "30m ago"}, {"title": "Tigo Energy at ld micro main event: growth plan leans on margins", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Oct 2026, 11:07 PM IST", "pub_date_relative": "31m ago"}, {"title": "SKYX Platforms at LD Micro main event: merger, patents and growth push", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Oct 2026, 11:06 PM IST", "pub_date_relative": "32m ago"}, {"title": "New Mexico AG lawsuit accuses Epstein's attorney and accountant of facilitating sex trafficking", "full_content": "New Mexico's attorney general on Wednesday filed a federal lawsuit accusing Jeffrey Epstein 's long-time personal lawyer and accountant of facilitating Epstein's sex trafficking operation.\n\nThe civil suit alleges that the attorney, Darren Indyke, and the accountant, Richard Kahn, helped finance and conceal Epstein's sex trafficking, which included the abuse of girls and young women at his Zorro Ranch in Santa Fe County, New Mexico.\n\nIndyke and Kahn are beneficiaries of Epstein's 1953 Trust, co-executors of Epstein's estate, and administrators of the revocable trust, whose name comes from the year of the convicted sex offender's birth.\n\nNew Mexico's suit asks a judge to block Indyke and Kahn from receiving payments from the estate as the case proceeds in U.S. District Court in New Mexico.\n\nAttorney General Raul Torrez's office said that Epstein's estate is currently valued at more than $107 million, and the suit says Indyke and Kahn are eligible for bequests of $50 million and $25 million, subject to the availability of funds.\n\n\"Jeffrey Epstein did not operate alone, and his death does not end the pursuit of accountability for the people who helped make his crimes possible,\" Torrez said in a statement.\n\n\"The allegations in this lawsuit describe a network of people and financial arrangements that helped sustain and conceal the abuse of vulnerable girls and young women, including here in New Mexico,\" Torrez said. \"Those who allegedly enabled this exploitation should not be allowed to profit from it while survivors continue to live with its consequences.\"\n\nThe suit comes a month after The Wall Street Journal reported that the U.S. Attorney's Office for the Southern District of New York had opened an investigation into Indyke and Kahn.", "source": "CNBC Top News", "pub_date_str": "21 Oct 2026, 11:04 PM IST", "pub_date_relative": "34m ago"}, {"title": "Jefferies raises United Airlines stock price target on earnings beat", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Oct 2026, 11:02 PM IST", "pub_date_relative": "35m ago"}, {"title": "B.Riley raises Cleveland-Cliffs price target to $18 on improved outlook", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Oct 2026, 11:02 PM IST", "pub_date_relative": "35m ago"}, {"title": "Big Pharma\u2019s Obesity Shopping Spree Is Moving Beyond GLP-1s. Palatin May Fit the Pattern (NASDAQ: PTN)", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Oct 2026, 11:02 PM IST", "pub_date_relative": "36m ago"}, {"title": "Persistent Systems launches Rs 4,265-cr QIP; floor price set at Rs 5,550/share", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Persistent Systems launches Rs 4,265-cr QIP; floor price set at Rs 5,550/share IIFL Capital Services Share Price Choice International Share Price JM Financial Share Price Anand Rathi Share & Stock Brokers Share Price SMC Global Securities Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Persistent Systems launches Rs 4,265-cr QIP; floor price set at Rs 5,550/share SECTIONS Persistent Systems launches Rs 4,265-cr QIP; floor price set at Rs 5,550/share PTI Last Updated: Oct 21, 2026, 11:01:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Persistent Systems has opened a qualified institutional placement to raise up to USD 450 million, or about Rs 4,265 crore. The IT company has set the QIP floor price at Rs 5,550 per share and may offer investors a discount of up to 5% under the approved pricing terms.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "21 Oct 2026, 11:01 PM IST", "pub_date_relative": "37m ago"}, {"title": "IT mid-caps vs large-caps: TCS, Infosys, Wipro vs Persistent, Coforge, Tata Tech - Who leads the Q2 results 2026 race?", "full_content": "IT mid-cap vs large-caps: The Indian IT stocks are experiencing a strong comeback after seeing sharp decline over the past few months. Nifty IT ended nearly 2.88% higher on Wednesday, extending its gains after posting its biggest weekly rise in 18 years last week.\n\nWhile IT large-cap names like Tata Consultancy Services (TCS), Infosys and Wipro emerged as the key contributors to the Nifty IT rally, mid-cap IT stocks such as Persistent Systems , Coforge, Tata Technologies and Mphasis lagged behind. Are we seeing a divergent trend in the IT stocks? Expert decodes.\n\nThe recent rally IT stocks has come after IT heavyweights like TCS, Wipro, HCL Technologies , Tata Technologies, etc announced their earnings for the second quarter of financial year 2026-27. While mid-cap names are leading the Q2 results race in terms of growth, large-caps are ahead in terms of exceeding expectations.\n\n\u201cPersistent grew 7.8% quarter-on-quarter in constant currency. The large-caps that have reported grew between 0% (Wipro) and 2.4% (Tech Mahindra). But large-caps went in with a very low bar and cleared it. TCS\u2019s \u20b9 13,884 crore profit was ahead of estimates.\"\n\n\"HCLTech raised the lower end of its FY27 guidance to 2.5\u20134% from 1\u20134%. Margins held or expanded across the group,\u201d explained Gaurav Garg, Head - Research, Lemon, adding that an upgrade to Infosys\u2019 guidance in its upcoming Q2 results would further reinforce the large-cap IT stocks\u2019 lead.\n\n\u201cThis was less large versus mid, and more cheap-and-hated versus expensive-and-loved. In the week to 16 October, TCS, Infosys, HCLTech and Wipro each gained 13\u201314%. Over the same week Persistent slipped 0.5%, and Coforge and Mphasis gained only 4.5-6%,\u201d added the expert.\n\nCatch all the Business News , Market News , Breaking News Events and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.\n\nLog in to our website to save your bookmarks. It'll just take a moment.", "source": "LiveMint Markets", "pub_date_str": "21 Oct 2026, 11:00 PM IST", "pub_date_relative": "38m ago"}, {"title": "How Ukraine\u2019s drone strikes on Russia crippled the world\u2019s second-largest diesel supplier", "full_content": "Ukraine launched massive drone assaults against Russia this week, hitting key oil infrastructure and signaling Kyiv intends to block the Kremlin from increasing diesel exports in defiance of President Donald Trump .\n\nMore than 1,000 Ukrainian drones targeted Russia on Sunday alone in one of the largest attacks this year, according to state media reports. The strikes set ablaze an oil export terminal in St. Petersburg, Russia's second-largest city and President Vladimir Putin 's hometown.\n\nKyiv has ended its brief adherence to an energy ceasefire that Trump declared between Ukraine and Russia on Oct. 11. Moscow ignored that truce from the start and Kyiv vowed to retaliate.\n\nUkraine's drone strikes have achieved a scale, range and effectiveness that they have crippled Russia's diesel exports, said Tatiana Mitrova, an expert on the Russian oil industry at Columbia University's Center on Global Energy Policy. Before the attacks, Russia was the second-largest diesel supplier in the world after the U.S.\n\nAs a result, Trump's deal with Putin to boost Russian diesel exports is likely dead in the water, said Matt Smith, director of commodity research at Kpler. \"It seems unlikely that they'll be able to bring the volume of diesel back to the market that they are talking about without an energy ceasefire,\" Smith said.\n\nReported attacks on Russian oil infrastructure in 2026 Rochan Consulting Kyiv's strikes on Russian refineries and related oil infrastructure almost tripled to 31 in July compared with 11 in January, according to data from open-source intelligence firm Rochan Consulting in Warsaw, Poland.\n\nThe attacks slashed Russia's diesel exports by more than 75%, to 141,000 barrels per day (bpd) in September, compared with 608,000 bpd in the same period last year, according to Kpler data.\n\nIn response, Moscow banned exports in July to preserve domestic supplies. The Kremlin partially resumed shipments this month to fulfill the Trump-Putin deal.", "source": "CNBC Top News", "pub_date_str": "21 Oct 2026, 10:57 PM IST", "pub_date_relative": "41m ago"}, {"title": "Meta ordered to pay $25 billion penalty in New Mexico Cambridge Analytica case - CNBC", "full_content": "Meta ordered to pay $25 billion penalty in New Mexico Cambridge Analytica case CNBC Meta Ordered to Pay $25 Billion for Deceiving Users on Privacy The New York Times Meta ordered to pay $25 billion to New Mexico after jury finds company misled consumers about data privacy Reuters Meta ordered to pay New Mexico $25 billion after Cambridge Analytica trial AP News Meta hit with $25 billion penalty for misleading Facebook users Axios", "source": "Google News Business", "pub_date_str": "21 Oct 2026, 10:51 PM IST", "pub_date_relative": "47m ago"}, {"title": "Expanding AI trade is turning safety stocks into a 'Texas hedge'", "full_content": "When a hurricane looms, panic buying clears store shelves of household essentials like water, canned food, dry goods, and toilet paper. A similar dynamic is playing out in the market. Investors are bailing on higher-volatility growth stocks and running toward the shelter of perceived safety sectors like utilities and consumer staples. The key difference? They may not be so safe.\n\nAs valuation multiples across capital-intensive AI infrastructure plays \u2014 such as specialized data center hosting providers CoreWeave (CRWV) and Iren Ltd (IREN) \u2014 take on water in the form of massive debt loads due to aggressive capex buildouts, investors may want to take a portion of their equity exposure into more protected water. The issue with utilities is that while it is traditionally considered a conservative sector, more recently it has become part of the AI story as the massive data center build-out is accompanied by surging power demand. This is one of the reasons that in recent years utilities outperformed staples. However, if the bloom of the AI rose helped fuel that outperformance, it would be a \u201cTexas hedge\u201d to buy it now on concerns that the AI trade is getting wobbly. In other words, buying so-called safety stocks might actually increase your risk.\n\nIn this context, consumer staples, most easily traded with the Consumer Staples Select Sector SPDR Fund (XLP) is a better choice.\n\nUnlike AI infrastructure, hyperscalers are dependent on enterprise IT budgets and continuous capital infusions. XLP's constituents\u2014led by market heavyweights like Walmart (WMT) , the world\u2019s largest grocery store chain, Costco (COST) , a perennial \u201cHolly Index\u201d constituent, Procter & Gamble (PG) , and toilet paper and diaper maker Kimberly-Clark \u2014 generate consistent revenues. I often joke that when the market goes sideways, investors probably need more diapers and toilet paper, not less.", "source": "CNBC Top News", "pub_date_str": "21 Oct 2026, 10:44 PM IST", "pub_date_relative": "54m ago"}, {"title": "Piyush Goyal To Visit Germany, Netherlands From Oct 22-27 For Boosting Trade, Investment Ties", "full_content": "Goyal will be accompanied by around 100 business leaders and entrepreneurs in Germany and the Netherlands.", "source": "NDTV Profit", "pub_date_str": "21 Oct 2026, 10:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "Intel hits construction milestone at Ohio chip fab that\u2019s at least 5 years behind schedule", "full_content": "Intel has hit a milestone in the construction of its massive chip fabrication plant in New Albany, Ohio, that's running at least five years behind schedule, a delay that's coincided with soaring demand for advanced chips.\n\nOn Wednesday, Intel announced that crews have installed the first major structural truss in Ohio, which means the next part of the construction has finally begun.\n\n\"This represents another significant step toward expanded U.S. leading-edge semiconductor capacity,\" Intel Foundry head Naga Chandrasekaran wrote in a post on the company's website on Wednesday.\n\nIn September, reports surfaced that the world's leading maker of high-bandwidth memory, SK Hynix , could team up with Intel in Ohio to lease some foundry space to make memory chips at the new site. Neither company would confirm any plans.\n\nWhen Intel first announced the Ohio factory in 2022, it was expected to start delivering chips in 2025. Intel pushed back that timeline, now aiming to finish construction in 2030. A second Ohio fab is also planned for completion in 2031 at the site, just northeast of Columbus.\n\nThe delay reflects a broader recalibration of Intel's foundry ambitions under CEO Lip-Bu Tan.\n\nThe Ohio factory is only one piece of Intel's ambitious build-out to start making chips for outside customers that began under former CEO Pat Gelsinger. When Tan took the helm in 2025, his turnaround strategy was more cautious, choosing to wait for customer demand before forging ahead with ambitious chip fab plans.\n\nStill, by late 2025, Intel was in high-volume production at its Arizona chip fab , producing its most advanced 18A chips. On Wednesday, Chandrasekaran also announced that operations at its next fab in Arizona are expected to begin by the end of 2028.", "source": "CNBC World Economy", "pub_date_str": "21 Oct 2026, 10:25 PM IST", "pub_date_relative": "1h ago"}, {"title": "UK approves development of Jackdaw gasfield in North Sea", "full_content": "Ministers stress that decision on larger Rosebank oilfield was a \u2018different proposition\u2019", "source": "FT Markets", "pub_date_str": "21 Oct 2026, 10:19 PM IST", "pub_date_relative": "1h ago"}, {"title": "Stocks making the biggest moves midday: SpaceX, Meta Platforms, Super Micro Computer, Roivant Sciences & more", "full_content": "Here are some of the companies making headlines in midday trading.", "source": "CNBC Top News", "pub_date_str": "21 Oct 2026, 10:18 PM IST", "pub_date_relative": "1h ago"}, {"title": "Buy, Sell Or Hold: Bajaj Finance, Eternal, JSW Steel, Vishal Mega Mart, BEL And Hindustan Copper \u2014 Ask Profit", "full_content": "Market experts shared buy, sell and hold recommendations for an array of stocks including Bajaj Finance, Eternal, JSW Steel, Vishal Mega Mart, BEL and Hindustan Copper.", "source": "NDTV Profit", "pub_date_str": "21 Oct 2026, 10:18 PM IST", "pub_date_relative": "1h ago"}, {"title": "Lactogen Pro 1 Easy To 'Digest' For Babies? FSSAI Pulls Up Nestl\u00e9 India For Scientific Proof", "full_content": "FSSAI has sought scientific evidence from Nestl\u00e9 India for digestion and immunity claims on infant formula products, while Zydus Wellness faces scrutiny over Complan's growth, memory and immunity-related advertisements.", "source": "NDTV Profit", "pub_date_str": "21 Oct 2026, 10:18 PM IST", "pub_date_relative": "1h ago"}, {"title": "Meta stock advances ahead of after-the-bell earnings. What we're looking for", "full_content": "The Investing Club holds its \"Morning Meeting\" every weekday at 10:20 a.m. ET.", "source": "CNBC Top News", "pub_date_str": "21 Oct 2026, 10:17 PM IST", "pub_date_relative": "1h ago"}, {"title": "Spooked By Claude: Deepinder Goyal Reveals Uncanny Chatbot Encounter Behind Dark.ai Launch", "full_content": "Deepinder Goyal says an unsettling exchange with Anthropic's Claude exposed the risks of sharing personal information with AI, prompting him to build Dark.ai, a privacy-focused assistant that aims to keep user conversations inaccessible even to its operator.", "source": "NDTV Profit", "pub_date_str": "21 Oct 2026, 10:17 PM IST", "pub_date_relative": "1h ago"}, {"title": "India Tour Of New Zealand 2026: Full Schedule, Dates, Timings And Venues", "full_content": "Twelve matches, three formats and two months of cricket \u2014 here is the complete schedule for India's tour of New Zealand.", "source": "NDTV Profit", "pub_date_str": "21 Oct 2026, 10:17 PM IST", "pub_date_relative": "1h ago"}, {"title": "SpaceX will attempt to reach weekly Starship launches by early 2027 - Ars Technica", "full_content": "SpaceX will attempt to reach weekly Starship launches by early 2027 Ars Technica SpaceX will attempt 1st-ever double Starship rocket catch on next test launch, Elon Musk says Space SpaceX plans Starship upper stage catch on next launch SpaceNews Morgan Stanley: SpaceX's (SPCX.US) Q3 earnings are merely an \"appetizer\"; the 15th Starship flight and the \"physical intelligence economy\" are the true catalysts for the stock price. Moomoo SpaceX showcases exactly how it plans to catch Starship next month Teslarati", "source": "Google News Business", "pub_date_str": "21 Oct 2026, 10:16 PM IST", "pub_date_relative": "1h ago"}, {"title": "PC Jeweller share price to be in focus as Q2 net profit jumps 58%; can the stock extend its 482% rally in 3 years?", "full_content": "PC Jeweller released its financial results for the July\u2013September quarter (Q2FY27) today, October 21, after-market hours, reporting strong growth across key financial metrics, driven by healthy consumer demand.\n\nThe company posted a 58% jump in net profit to \u20b9 331 crore from \u20b9 210 crore in the same period last year. Its consolidated revenue from operations surged 28% to \u20b9 1,054 crore from \u20b9 825 crore in the year-ago quarter, driven by continued consumer demand during the festive and wedding season.\n\nAt the operating level, the company\u2019s EBITDA stood at \u20b9 309 crore, up from \u20b9 178 crore a year earlier, while its EBITDA margin improved to 29.3% from 21.5% in the year-ago quarter, reflecting improved operational efficiency and robust sales growth, according to the company\u2019s Q2 earnings filing.\n\nBalram Garg, Managing Director of PC Jeweller, said, \u201cBacked by healthy consumer demand, the company's strong performance continued in Q2FY27 as well. During Q2FY27, the company delivered consolidated revenue growth of 28% YoY, consolidated operating EBITDA growth of 74% and consolidated operating PBT growth of 116%.\u201d\n\nDuring the quarter, the company s achieved debt-free status after repaying its outstanding dues to all 14 consortium banks ahead of schedule.\n\nThe company has received no-objection, no-dues and release letters from all the banks. All mortgaged assets, charges, securities, guarantees (both personal and corporate) and undertakings provided by the company and its personal and corporate guarantors have also been fully released.\n\nFurther, the company received remittances of approximately \u20b9 142 crore during the quarter from its outstanding export debtors.\n\nThe company plans to open up to 100 large-format showrooms across Tier I, Tier II and Tier III cities over the next 12\u201318 months, through a mix of company-owned outlets and an asset-light franchise model.", "source": "LiveMint Markets", "pub_date_str": "21 Oct 2026, 10:12 PM IST", "pub_date_relative": "1h ago"}, {"title": "Trade Setup For Oct. 22: Nifty Support Slips To 22,700, Analysts Flag Sideways Drift Till 23,000", "full_content": "Nifty's immediate support has now shifted lower to the 22,650-22,700 zone from 22,800 in the previous session, making this range crucial for the index to hold in the coming session, according to analysts.", "source": "NDTV Profit", "pub_date_str": "21 Oct 2026, 10:08 PM IST", "pub_date_relative": "1h ago"}, {"title": "Meta and Tesla bulls get confidence boost after SpaceX earnings", "full_content": "A big rally in SpaceX after earnings is giving hope to Meta and Tesla bulls ahead of their reports due Wednesday afternoon.\n\nOptions trading in both stocks leaned bullish after the open Wednesday, with Meta options looking particularly one-sided as traders bought more calls than puts and more put trades likely initiated by sellers than buyers. More than 30,000 calls traded at or above the ask, suggesting they were bought, versus under 17,000 puts, Cboe LiveVol data shows.\n\nMeta options have generally been bullish since the stock's March low, when the put/call ratio of open contracts plunged to 0.5, meaning two calls open for every one put contract, and that hasn't budged much since, Barchart data show. Almost $22 million of trades were done with a bullish intent on Wednesday, compared to $7.5 million looking for downside.\n\nMeta, Tesla in past three months Market-makers are pricing a 6.5% swing for Meta after earnings, a little under the 9% average the past four quarters. The most popular contract to buy on Wednesday was the 800 strike call expiring Friday that costs $1.40 and needs Meta to rally 14% into the weekend, SpotGamma data shows.\n\nIn Tesla, the flows also lean bullish, but with less conviction. The put/call ratio of open contracts is 0.75, compared to Meta's 0.5, though more calls did trade Wednesday morning than puts.\n\nOf the 520,000 contracts traded in Tesla, 315,000 were calls, as traders bought 88,000 calls and 65,000 puts, according to Cboe LiveVol data. There was also notable call-selling, with 83,000 call contracts likely sold and seven of the top 10 trades by dollar-amount call sales.\n\nStill, traders spent more money buying calls than they did puts, with call-buying premiums amounting to over $200 million, compared to $84 million in puts, according to SpotGamma's analysis.\n\nMarket-makers are pricing a 5.5% swing in Tesla after its report, above the four-quarter median of 3.5%.", "source": "CNBC Top News", "pub_date_str": "21 Oct 2026, 10:05 PM IST", "pub_date_relative": "1h ago"}, {"title": "'Aakhir Mein Ant Sacchai Aur Achchai Ki Hie Hogi': Ranbir Kapoor Trolled For Speech Slip At Dussehra Event", "full_content": "Ranbir Kapoor\u2019s Dussehra speech went viral after he mistakenly said \u2018ant\u2019 instead of \u2018jeet\u2019 while speaking about truth and goodness, prompting social media users to troll the actor.", "source": "NDTV Profit", "pub_date_str": "21 Oct 2026, 10:04 PM IST", "pub_date_relative": "1h ago"}, {"title": "Medicare is a bargain. What America can\u2019t afford is private health insurance.", "full_content": "Private insurance costs way more for the same results \u2014 or worse.", "source": "MarketWatch Top Stories", "pub_date_str": "21 Oct 2026, 10:04 PM IST", "pub_date_relative": "1h ago"}, {"title": "France\u2019s borrowing costs hit 5% for first time since 2002", "full_content": "Concerns over public finances and political stability have helped push up 10-year bond yields from 3.2% in late February", "source": "FT Markets", "pub_date_str": "21 Oct 2026, 10:03 PM IST", "pub_date_relative": "1h ago"}, {"title": "Donald Trump's Son Privately Warned His Father Over Iran War: Report", "full_content": "Trump's son has also maintained a close relationship with the late conservative activist Charlie Kirk, who likewise opposed the war.", "source": "NDTV Profit", "pub_date_str": "21 Oct 2026, 09:59 PM IST", "pub_date_relative": "1h ago"}, {"title": "Netflix Shares Slide On Slower Growth Forecast, Programming Woes", "full_content": "Investors and analysts have pestered Netflix's leadership about stagnant engagement.", "source": "NDTV Profit", "pub_date_str": "21 Oct 2026, 09:59 PM IST", "pub_date_relative": "1h ago"}, {"title": "NaBFID gets Finance Ministry, RBI nod for national infrastructure project repository", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Infrastructure \u203a NaBFID gets Finance Ministry, RBI nod for national infrastructure project repository The Economic Times daily newspaper is available online now. Read Today's Paper NaBFID gets Finance Ministry, RBI nod for national infrastructure project repository SECTIONS NaBFID gets Finance Ministry, RBI nod for national infrastructure project repository By Joel Rebello , ET Bureau Last Updated: Oct 21, 2026, 09:57:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis NaBFID has obtained approvals from the finance ministry and the Reserve Bank of India to establish a national repository. This repository will offer consolidated information on infrastructure projects for lenders and investors. The platform aims to facilitate access to data sourced from various government agencies like NHAI and others. NaBFID is considering partnerships with financial institutions to enhance the repository's effectiveness.\n\nOne company, 2 words. Bond yield and CDS: Will they decide the fate of global markets?\n\nBusiness of Odd Things: Inside an industry that farms fish that nobody is meant to eat\n\nWar's second-order effects are becoming visible in critical sectors\n\nUS mid-term elections \u2013 Part 2: What does it mean for Trump to lose control of Congress?\n\nHomebuyers wait as NCLT panel picks holes in unfinished Jaypee projects\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers", "source": "Economic Times Economy", "pub_date_str": "21 Oct 2026, 09:57 PM IST", "pub_date_relative": "1h ago"}, {"title": "Stock Market Today: Nasdaq Opens Higher; SpaceX Shares Surge on Tesla Deal Talks \u2014 Live Updates - WSJ", "full_content": "Stock Market Today: Nasdaq Opens Higher; SpaceX Shares Surge on Tesla Deal Talks \u2014 Live Updates WSJ Dow Jones Top Markets Headlines at 11 AM ET: Stocks Higher as SpaceX Hints at Tesla Deal Talks | NYSE ... Moomoo Nasdaq climbs over 1% as SpaceX, Super Micro improve AI sentiment Reuters SpaceX\u2019s AI Surprise Is More Fragile Than It Looks Bloomberg.com SpaceX stock jumps 10% after earnings beat and Musk hints at Tesla tie-up CNBC", "source": "Google News Business", "pub_date_str": "21 Oct 2026, 09:55 PM IST", "pub_date_relative": "1h ago"}, {"title": "Middle East oil exports climb back to prewar levels", "full_content": "Daily shipments from Gulf producers average 24.6mn, above 23.3mn before conflict, as ships use alternative routes", "source": "FT Markets", "pub_date_str": "21 Oct 2026, 09:54 PM IST", "pub_date_relative": "1h ago"}, {"title": "Upcoming IPO: Edelweiss unit EAAA India Alternatives' \u20b91,200 cr public issue to open on Oct 26 - Top things to know", "full_content": "EAAA India Alternatives Ltd, an alternative investment platform backed by Edelweiss Financial Services , has fixed the price band for its \u20b9 1,200-crore initial public offering ( IPO ) at \u20b9 1,585-1,665 per share.\n\nThe public issue will open for subscription on October 26 and close on October 28, according to an announcement issued on Wednesday. The bidding window for anchor investors will open on October 23.\n\nAt the upper end of the price band, EAAA India Alternatives will command an implied market capitalisation of \u20b9 10,765 crore. At the lower end, the company's valuation stands at \u20b9 10,248 crore.\n\nThe IPO price band was approved by the company's IPO Committee at a meeting held on October 20.\n\nInvestors can bid for a minimum of nine equity shares and in multiples of nine thereafter. At the upper end of the price band, retail investors will need to invest at least \u20b9 14,985 to subscribe to one lot.\n\nThe issue is entirely an offer for sale (OFS) by the Edelweiss Group, with no fresh issue of shares. Consequently, EAAA India Alternatives will not receive any proceeds from the IPO, as the entire amount raised will go to the selling shareholder.\n\nThe issue size has been reduced to \u20b9 1,200 crore from the \u20b9 1,500 crore proposed in the draft red herring prospectus (DRHP) filed with the Securities and Exchange Board of India (SEBI) in January.\n\nUnder the proposed allocation, 50% of the offer has been reserved for qualified institutional buyers (QIBs), 15% for non-institutional investors (NIIs) and 35% for retail investors.", "source": "LiveMint Markets", "pub_date_str": "21 Oct 2026, 09:53 PM IST", "pub_date_relative": "1h ago"}, {"title": "Earnings season is in full swing. These are Morgan Stanley's highest conviction plays", "full_content": "Morgan Stanley expects a handful of stocks that are reporting quarterly results soon to see big gains. Here's the list", "source": "CNBC Top News", "pub_date_str": "21 Oct 2026, 09:50 PM IST", "pub_date_relative": "1h ago"}, {"title": "Government websites in Europe and elsewhere go dark as software flaw sparks security scramble", "full_content": "Government websites in Europe and elsewhere went offline on Wednesday after the disclosure of critical vulnerabilities in a widely used programming language sent website operators scrambling to protect their systems.\n\nDevelopers of the PHP programming language said Tuesday they had identified two critical vulnerabilities and urged users to update their sites as soon as a fix was released. They said around 1345 GMT on Wednesday that a new version fixing the vulnerabilities was live.\n\nBut with reports that hackers were exploiting the flaws to break into websites, government agencies in the Netherlands and Finland were among those that took sites offline ahead of the fix as a precaution.\n\nPHP underpins large parts of the internet, raising concerns that a significant number of websites could be vulnerable to attack.\n\n\"PHP is everywhere. It quietly powers WordPress, Drupal, Joomla, and Magento sites, shared hosting platforms, control panels, and an awful lot of software that doesn't even advertise that it runs PHP under the hood,\" cybersecurity company Huntress said in a blog post.\n\nDane Knecht, the chief technology officer of Web and cloud security firm Cloudflare , said that attacks were emerging and Cloudflare was updating its firewall rules as a stopgap measure.\n\n\"We are seeing early attacks emerging and are updating mitigations as new vectors show up. This is a STOPGAP only. Patch as soon as PHP releases the update,\" he said on X.\n\nWordfence, a security plugin that protects WordPress websites, said all WordPress sites run on a PHP-installed server. It warned that automatic updates would not apply the fix and advised site owners to find out who is responsible for updating PHP on their sites.", "source": "CNBC Top News", "pub_date_str": "21 Oct 2026, 09:47 PM IST", "pub_date_relative": "1h ago"}, {"title": "Why the stock market\u2019s fragile calm faces a major test starting Friday", "full_content": "A bevy of upcoming catalysts will put this fragile pause to the test.", "source": "CNBC Top News", "pub_date_str": "21 Oct 2026, 09:46 PM IST", "pub_date_relative": "1h ago"}, {"title": "Term insurance claim amount rejected after death: Which common mistakes can put your family's payout at risk? List here", "full_content": "Many people buy term insurance to ensure their families remain financially secure in the event of their untimely death. A term insurance policy is an agreement between the insurance company and the policyholder for a fixed period, typically ranging from 10 to 40 years, during which the insurer pays the death benefit to the beneficiaries if the policyholder passes away.\n\nFor example, a person with a \u20b9 50 lakh home loan, \u20b9 30 lakh car loan and future expenses such as their children's education may opt for a term insurance policy with a \u20b9 2 crore cover. This can help ensure that their family has the financial support to handle outstanding debts and expenses in their absence.\n\nWhile term insurance sounds like an appealing insurance product, certain factors can lead to a claim being rejected. This could leave your family without the financial support they were counting on from the policy.\n\nTerm insurance rejection can take place because of many reasons, with it more likely to happen if you provide incomplete or inaccurate information, according to a blog post by HDFC Life . Here are some common reasons:\n\nHence, it is crucial to give the most accurate information at the time of filling the application form and if you are not sure of something, it's better to undergo a full health assessment before applying for a term insurance plan.\n\nA term insurance cover of 10 to 15 times annual income can provide a starting point, but it should not be treated as a universal formula.\n\nFor example, a person earning \u20b9 15 lakh a year could arrive at a basic cover of \u20b9 1.5 crore to \u20b9 2.25 crore using the income-multiple approach. However, the actual requirement could be higher depending on the person\u2019s liabilities, future expenses in the person's absence and dependents.\n\nIt also must be noted that individuals below 18 years of age are not eligible for purchasing term insurance. Though an age requirement is applicable for the majority of insurance companies, the limits may vary.", "source": "LiveMint Money", "pub_date_str": "21 Oct 2026, 09:42 PM IST", "pub_date_relative": "1h ago"}, {"title": "SpaceX stock jumps 10% after earnings beat and Musk hints at Tesla tie-up", "full_content": "SpaceX stock jumped 10% Wednesday after the company reported surging revenue growth in its third quarter, and owner Elon Musk floated a potential SpaceX- Tesla merger.\n\nThe space company, which made its debut on the Nasdaq in the biggest initial public offering ever in June, reported third-quarter revenue on Tuesday of $14.6 billion, up 161% from the previous year, and beating LSEG consensus estimates of $12.72 billion.\n\nMeanwhile, its operating income came in at $2.8 billion, with net income of $4.4 billion, after reporting a net loss of $1.05 billion in the same period a year earlier.\n\nOn an earnings call, Musk said he's considering a combination with Tesla \u2014 which would mark the largest merger in history \u2014 and that the boards of both companies have created specific committees to discuss a consolidation.\n\n\"I do think there's a lot of merit to combining the companies as we are pretty much in the superintelligence singularity, and there's a lot to be gained from cooperating,\" Musk said on the call. Tesla is set to report third-quarter earnings after the closing bell on Wednesday.\n\nSpaceX shares since its debut on the Nasdaq. Shares of other space stocks, including Rocket Lab , Intuitive Machines and AST SpaceMobile climbed on Wednesday.\n\nSpaceX forecasts first-quarter 2027 revenue between $33 billion and $37 billion, beating the average analyst estimate of $22.2 billion, according to LSEG.\n\n\"We delivered another strong quarter in Q3. Revenue grew an impressive 161% year-over-year, fueled by continued momentum in Connectivity and a clear inflection in our Super Intelligence business,\" SpaceX's chief financial officer, Bret Johnsen, said in the earnings release.", "source": "CNBC World Economy", "pub_date_str": "21 Oct 2026, 09:38 PM IST", "pub_date_relative": "2h ago"}], "cfa": [{"title": "Nasdaq gains as Musk's SpaceX and Tesla revive tech rally: Live updates", "full_content": "The Nasdaq Composite rose on Wednesday as the latest developments surrounding SpaceX and Tesla led investors to move back into technology.\n\nThe tech-heavy Nasdaq added 1.2%, and the S&P 500 traded up 0.7%. The Dow Jones Industrial Average climbed 290 points, or 0.6%.\n\nShares of Elon Musk's SpaceX surged 6% after the company said its revenue grew 161% in the third quarter. Musk also said that SpaceX and Tesla, his auto manufacturer, have formed special committees to discuss a merger. Tesla, which is due to report earnings later, was up more than 3%.\n\nSpaceX's artificial intelligence business grew ninefold, reigniting enthusiasm for stocks related to the trade. Key chipmakers such as Advanced Micro Devices advanced about 3%, while Nvidia rose nearly 2%. Micron Technology and Marvell Technology each grew around 2%. The VanEck Semiconductor ETF (SMH) was up almost 1%.\n\n\"SpaceX suggests there is still a longer runway here, but that fundamental tension or experience of getting overly enthusiastic and overly capitalizing things I don't think has changed,\" said Joe Zidle, Cresset's chief market strategist.\n\nConcerns around the AI trade's sustainability have weighed on market sentiment lately, as traders focused on debt-backed AI investments and whether the infrastructure demand justifies companies' spending. But Zidle anticipates that the current reporting period will show that a number of AI-related companies are continuing to see stronger demand.\n\n\"I think when we get to the end of earnings season and we look back, SpaceX is not an anomaly; it's not a phenomenon; it's actually something that's going to be, I think, more common to the sector,\" he said.\n\nInvestors are seeking more insights into the AI trade on Wednesday, with Meta Platforms also set to report after the bell. Earlier this month, the company rolled out its latest AI model , Muse Wonder, which is only available to paying users.", "source": "CNBC Top News", "pub_date_str": "21 Oct 2026, 11:36 PM IST", "pub_date_relative": "2m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Raymond James cuts BankUnited stock price target to $48 on revenue", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Oct 2026, 11:20 PM IST", "pub_date_relative": "17m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "US Treasury yields slip as AI concerns boost safe haven demand ahead of 20 year auction", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a US Treasury yields slip as AI concerns boost safe haven demand ahead of 20 year auction Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US Treasury yields slip as AI concerns boost safe haven demand ahead of 20 year auction SECTIONS US Treasury yields slip as AI concerns boost safe haven demand ahead of 20 year auction ETMarkets.com Last Updated: Oct 21, 2026, 11:28:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis US Treasury yields slipped as investors weighed the impact of higher borrowing costs on AI stocks, with the 10 year yield heading for a second straight daily decline. The move came ahead of a $13 billion 20 year Treasury auction, while markets continued to price in a muted chance of a Fed rate hike.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "21 Oct 2026, 11:19 PM IST", "pub_date_relative": "18m ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Earnings call transcript: Nemak posts strong Q3 2026 growth as shares slip", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Oct 2026, 11:18 PM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Meta earnings live updates: AI spending, ad revenue and stock reaction", "full_content": "Meta is slated to report third-quarter earnings after the bell on Wednesday, and investors will be looking for signs that the company's latest artificial intelligence efforts will bolster future sales.\n\nIt's been a big quarter for Mark Zuckerberg's company due to the initial success of the Muse AI personal assistant tool that debuted in September and shot to the top of Apple's iOS app store. That AI momentum helped Meta end September with its best month on Wall Street since 2022.\n\nMeta isn't the first to create a digital assistant that can organize people's email and scan the web for headphone deals, but the company's empire, which includes Facebook and Instagram, has helped introduce AI agents to the masses. At the same time, Meta and its AI chief Alexandr Wang have continued rolling out new foundation models and related updates at a speedy clip, including Muse Wonder , which was released last Monday.\n\nWall Street will likely be monitoring for whether Meta plans to increase its data center-related capital expenditures, or capex, to further develop the underlying computing infrastructure needed to power AI agents and foundation models.\n\nThe company revealed in July during its second-quarter earnings that it narrowed its 2026 capex guidance to come in between $130 billion and $145 billion, representing a $5 billion increase to the low end of its prior range. All that spending resulted in Meta's free cash flow in the period shrinking to $784 million from $8.55 billion in the same quarter a year earlier.\n\nAnalysts expect Meta's capex to swell to $196.3 billion in 2027, according to FactSet.\n\nMeta's third-quarter daily active people, or DAP, is expected to come in at 3.65 billion, according to StreetAccount, almost flat from the prior quarter.", "source": "CNBC World Economy", "pub_date_str": "21 Oct 2026, 11:18 PM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Meta ordered to pay $25 billion penalty in New Mexico Cambridge Analytica case", "full_content": "Meta was ordered to pay $25 billion in penalties by a New Mexico court on Wednesday as part of a data privacy case that stemmed from the company's Cambridge Analytica scandal from nearly a decade ago.\n\nThe penalty, revealed in a court filing, comes after a jury in a Santa Fe courthouse found in September the social media giant liable for misleading state citizens about how it safeguards and collects user data and prevents harmful information from flourishing on its services.\n\nAlthough the jury concluded that Meta had over 43 million violations of the state's unfair practices act, with each transgression carrying a civil penalty as high as $5,000, a New Mexico judge was responsible for determining the ultimate fine. The Wednesday filing showed that the state was awarded $219.5 billion, but the penalty was ultimately reduced to $25 billion.\n\n\"The extraordinary number of willful violations found by the jury, the duration and repetition of the conduct, the breadth of subjects on which violations occurred, the involvement of senior Facebook leadership, the size of New Mexico audiences reached, and the clear intentional and systematic nature of Facebook's repeated misstatements established in the trial record support the highest level of penalty allowed by the New Mexico Unfair Practices Act - $5,000 per violation found by the jury,\" New Mexico district court judge Francis Mathew wrote in the filing.\n\nThe judge added that interest on the penalty shall accrue at the rate of 15% each year until the fine is paid off in full.\n\nCNBC has reached out to Meta for comment on the penalty order.\n\nMeta previously resolved various Cambridge Analytica-derived data privacy lawsuits across the nation as part of an overarching August settlement of nearly $17 billion with a coalition of state attorneys general in a separate federal case related to child safety and mental health.", "source": "CNBC World Economy", "pub_date_str": "21 Oct 2026, 11:15 PM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Fixed Income", "Ethical & Professional Standards"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "SKYX Platforms at LD Micro main event: merger, patents and growth push", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Oct 2026, 11:06 PM IST", "pub_date_relative": "32m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "New Mexico AG lawsuit accuses Epstein's attorney and accountant of facilitating sex trafficking", "full_content": "New Mexico's attorney general on Wednesday filed a federal lawsuit accusing Jeffrey Epstein 's long-time personal lawyer and accountant of facilitating Epstein's sex trafficking operation.\n\nThe civil suit alleges that the attorney, Darren Indyke, and the accountant, Richard Kahn, helped finance and conceal Epstein's sex trafficking, which included the abuse of girls and young women at his Zorro Ranch in Santa Fe County, New Mexico.\n\nIndyke and Kahn are beneficiaries of Epstein's 1953 Trust, co-executors of Epstein's estate, and administrators of the revocable trust, whose name comes from the year of the convicted sex offender's birth.\n\nNew Mexico's suit asks a judge to block Indyke and Kahn from receiving payments from the estate as the case proceeds in U.S. District Court in New Mexico.\n\nAttorney General Raul Torrez's office said that Epstein's estate is currently valued at more than $107 million, and the suit says Indyke and Kahn are eligible for bequests of $50 million and $25 million, subject to the availability of funds.\n\n\"Jeffrey Epstein did not operate alone, and his death does not end the pursuit of accountability for the people who helped make his crimes possible,\" Torrez said in a statement.\n\n\"The allegations in this lawsuit describe a network of people and financial arrangements that helped sustain and conceal the abuse of vulnerable girls and young women, including here in New Mexico,\" Torrez said. \"Those who allegedly enabled this exploitation should not be allowed to profit from it while survivors continue to live with its consequences.\"\n\nThe suit comes a month after The Wall Street Journal reported that the U.S. Attorney's Office for the Southern District of New York had opened an investigation into Indyke and Kahn.", "source": "CNBC Top News", "pub_date_str": "21 Oct 2026, 11:04 PM IST", "pub_date_relative": "34m ago", "cfa_topics": ["Financial Statement Analysis", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Jefferies raises United Airlines stock price target on earnings beat", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Oct 2026, 11:02 PM IST", "pub_date_relative": "35m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Big Pharma\u2019s Obesity Shopping Spree Is Moving Beyond GLP-1s. Palatin May Fit the Pattern (NASDAQ: PTN)", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Oct 2026, 11:02 PM IST", "pub_date_relative": "36m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Persistent Systems launches Rs 4,265-cr QIP; floor price set at Rs 5,550/share", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Persistent Systems launches Rs 4,265-cr QIP; floor price set at Rs 5,550/share IIFL Capital Services Share Price Choice International Share Price JM Financial Share Price Anand Rathi Share & Stock Brokers Share Price SMC Global Securities Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Persistent Systems launches Rs 4,265-cr QIP; floor price set at Rs 5,550/share SECTIONS Persistent Systems launches Rs 4,265-cr QIP; floor price set at Rs 5,550/share PTI Last Updated: Oct 21, 2026, 11:01:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Persistent Systems has opened a qualified institutional placement to raise up to USD 450 million, or about Rs 4,265 crore. The IT company has set the QIP floor price at Rs 5,550 per share and may offer investors a discount of up to 5% under the approved pricing terms.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "21 Oct 2026, 11:01 PM IST", "pub_date_relative": "37m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "IT mid-caps vs large-caps: TCS, Infosys, Wipro vs Persistent, Coforge, Tata Tech - Who leads the Q2 results 2026 race?", "full_content": "IT mid-cap vs large-caps: The Indian IT stocks are experiencing a strong comeback after seeing sharp decline over the past few months. Nifty IT ended nearly 2.88% higher on Wednesday, extending its gains after posting its biggest weekly rise in 18 years last week.\n\nWhile IT large-cap names like Tata Consultancy Services (TCS), Infosys and Wipro emerged as the key contributors to the Nifty IT rally, mid-cap IT stocks such as Persistent Systems , Coforge, Tata Technologies and Mphasis lagged behind. Are we seeing a divergent trend in the IT stocks? Expert decodes.\n\nThe recent rally IT stocks has come after IT heavyweights like TCS, Wipro, HCL Technologies , Tata Technologies, etc announced their earnings for the second quarter of financial year 2026-27. While mid-cap names are leading the Q2 results race in terms of growth, large-caps are ahead in terms of exceeding expectations.\n\n\u201cPersistent grew 7.8% quarter-on-quarter in constant currency. The large-caps that have reported grew between 0% (Wipro) and 2.4% (Tech Mahindra). But large-caps went in with a very low bar and cleared it. TCS\u2019s \u20b9 13,884 crore profit was ahead of estimates.\"\n\n\"HCLTech raised the lower end of its FY27 guidance to 2.5\u20134% from 1\u20134%. Margins held or expanded across the group,\u201d explained Gaurav Garg, Head - Research, Lemon, adding that an upgrade to Infosys\u2019 guidance in its upcoming Q2 results would further reinforce the large-cap IT stocks\u2019 lead.\n\n\u201cThis was less large versus mid, and more cheap-and-hated versus expensive-and-loved. In the week to 16 October, TCS, Infosys, HCLTech and Wipro each gained 13\u201314%. Over the same week Persistent slipped 0.5%, and Coforge and Mphasis gained only 4.5-6%,\u201d added the expert.\n\nCatch all the Business News , Market News , Breaking News Events and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.\n\nLog in to our website to save your bookmarks. It'll just take a moment.", "source": "LiveMint Markets", "pub_date_str": "21 Oct 2026, 11:00 PM IST", "pub_date_relative": "38m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "How Ukraine\u2019s drone strikes on Russia crippled the world\u2019s second-largest diesel supplier", "full_content": "Ukraine launched massive drone assaults against Russia this week, hitting key oil infrastructure and signaling Kyiv intends to block the Kremlin from increasing diesel exports in defiance of President Donald Trump .\n\nMore than 1,000 Ukrainian drones targeted Russia on Sunday alone in one of the largest attacks this year, according to state media reports. The strikes set ablaze an oil export terminal in St. Petersburg, Russia's second-largest city and President Vladimir Putin 's hometown.\n\nKyiv has ended its brief adherence to an energy ceasefire that Trump declared between Ukraine and Russia on Oct. 11. Moscow ignored that truce from the start and Kyiv vowed to retaliate.\n\nUkraine's drone strikes have achieved a scale, range and effectiveness that they have crippled Russia's diesel exports, said Tatiana Mitrova, an expert on the Russian oil industry at Columbia University's Center on Global Energy Policy. Before the attacks, Russia was the second-largest diesel supplier in the world after the U.S.\n\nAs a result, Trump's deal with Putin to boost Russian diesel exports is likely dead in the water, said Matt Smith, director of commodity research at Kpler. \"It seems unlikely that they'll be able to bring the volume of diesel back to the market that they are talking about without an energy ceasefire,\" Smith said.\n\nReported attacks on Russian oil infrastructure in 2026 Rochan Consulting Kyiv's strikes on Russian refineries and related oil infrastructure almost tripled to 31 in July compared with 11 in January, according to data from open-source intelligence firm Rochan Consulting in Warsaw, Poland.\n\nThe attacks slashed Russia's diesel exports by more than 75%, to 141,000 barrels per day (bpd) in September, compared with 608,000 bpd in the same period last year, according to Kpler data.\n\nIn response, Moscow banned exports in July to preserve domestic supplies. The Kremlin partially resumed shipments this month to fulfill the Trump-Putin deal.", "source": "CNBC Top News", "pub_date_str": "21 Oct 2026, 10:57 PM IST", "pub_date_relative": "41m ago", "cfa_topics": ["Economics", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Meta ordered to pay $25 billion penalty in New Mexico Cambridge Analytica case - CNBC", "full_content": "Meta ordered to pay $25 billion penalty in New Mexico Cambridge Analytica case CNBC Meta Ordered to Pay $25 Billion for Deceiving Users on Privacy The New York Times Meta ordered to pay $25 billion to New Mexico after jury finds company misled consumers about data privacy Reuters Meta ordered to pay New Mexico $25 billion after Cambridge Analytica trial AP News Meta hit with $25 billion penalty for misleading Facebook users Axios", "source": "Google News Business", "pub_date_str": "21 Oct 2026, 10:51 PM IST", "pub_date_relative": "47m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Expanding AI trade is turning safety stocks into a 'Texas hedge'", "full_content": "When a hurricane looms, panic buying clears store shelves of household essentials like water, canned food, dry goods, and toilet paper. A similar dynamic is playing out in the market. Investors are bailing on higher-volatility growth stocks and running toward the shelter of perceived safety sectors like utilities and consumer staples. The key difference? They may not be so safe.\n\nAs valuation multiples across capital-intensive AI infrastructure plays \u2014 such as specialized data center hosting providers CoreWeave (CRWV) and Iren Ltd (IREN) \u2014 take on water in the form of massive debt loads due to aggressive capex buildouts, investors may want to take a portion of their equity exposure into more protected water. The issue with utilities is that while it is traditionally considered a conservative sector, more recently it has become part of the AI story as the massive data center build-out is accompanied by surging power demand. This is one of the reasons that in recent years utilities outperformed staples. However, if the bloom of the AI rose helped fuel that outperformance, it would be a \u201cTexas hedge\u201d to buy it now on concerns that the AI trade is getting wobbly. In other words, buying so-called safety stocks might actually increase your risk.\n\nIn this context, consumer staples, most easily traded with the Consumer Staples Select Sector SPDR Fund (XLP) is a better choice.\n\nUnlike AI infrastructure, hyperscalers are dependent on enterprise IT budgets and continuous capital infusions. XLP's constituents\u2014led by market heavyweights like Walmart (WMT) , the world\u2019s largest grocery store chain, Costco (COST) , a perennial \u201cHolly Index\u201d constituent, Procter & Gamble (PG) , and toilet paper and diaper maker Kimberly-Clark \u2014 generate consistent revenues. I often joke that when the market goes sideways, investors probably need more diapers and toilet paper, not less.", "source": "CNBC Top News", "pub_date_str": "21 Oct 2026, 10:44 PM IST", "pub_date_relative": "54m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Derivatives", "Alternative Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Buy, Sell Or Hold: Bajaj Finance, Eternal, JSW Steel, Vishal Mega Mart, BEL And Hindustan Copper \u2014 Ask Profit", "full_content": "Market experts shared buy, sell and hold recommendations for an array of stocks including Bajaj Finance, Eternal, JSW Steel, Vishal Mega Mart, BEL and Hindustan Copper.", "source": "NDTV Profit", "pub_date_str": "21 Oct 2026, 10:18 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Meta stock advances ahead of after-the-bell earnings. What we're looking for", "full_content": "The Investing Club holds its \"Morning Meeting\" every weekday at 10:20 a.m. ET.", "source": "CNBC Top News", "pub_date_str": "21 Oct 2026, 10:17 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "SpaceX will attempt to reach weekly Starship launches by early 2027 - Ars Technica", "full_content": "SpaceX will attempt to reach weekly Starship launches by early 2027 Ars Technica SpaceX will attempt 1st-ever double Starship rocket catch on next test launch, Elon Musk says Space SpaceX plans Starship upper stage catch on next launch SpaceNews Morgan Stanley: SpaceX's (SPCX.US) Q3 earnings are merely an \"appetizer\"; the 15th Starship flight and the \"physical intelligence economy\" are the true catalysts for the stock price. Moomoo SpaceX showcases exactly how it plans to catch Starship next month Teslarati", "source": "Google News Business", "pub_date_str": "21 Oct 2026, 10:16 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "PC Jeweller share price to be in focus as Q2 net profit jumps 58%; can the stock extend its 482% rally in 3 years?", "full_content": "PC Jeweller released its financial results for the July\u2013September quarter (Q2FY27) today, October 21, after-market hours, reporting strong growth across key financial metrics, driven by healthy consumer demand.\n\nThe company posted a 58% jump in net profit to \u20b9 331 crore from \u20b9 210 crore in the same period last year. Its consolidated revenue from operations surged
