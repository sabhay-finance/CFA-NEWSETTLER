<script>
    // This variable will be injected during the build process
    const allData = {"general": [{"title": "Democratic Rep. Stevens endorses Rogers over El-Sayed in Michigan Senate election", "full_content": "Michigan Democratic Rep. Haley Stevens, in a stunning move, endorsed Republican Senate nominee Mike Rogers over Democratic nominee Abdul El-Sayed on Sunday.\n\nStevens had lost the primary for Democratic nomination to El-Sayed earlier this year.\n\nHer endorsement of Rogers came after days of rising tension with El-Sayed and his campaign over an ad by a political action committee.\n\n\"Hey Michigan, as you may have seen, our Democratic nominee for U.S. Senate, Abdul, said I'm no longer welcome in his campaign, and I should stay away, and he's right,\" Stevens said in a video statement on X .\n\n\"And that's why I am endorsing Mike Rogers for the United States Senate today,\" she said.\n\n\"I don't belong in Abdul's campaign. I do not stand with Hasan Piker , who gets trafficked on our college campuses,\" said Stevens.\n\nPiker is a controversial political commentator who has campaigned with El-Sayed.\n\n\"I'm sorry people are upset,\" Stevens told reporters at a press conference in Detroit as she stood with Rogers, with whom she had attended church Sunday morning.", "source": "CNBC Top News", "pub_date_str": "01 Nov 2026, 11:46 PM IST", "pub_date_relative": "12m ago"}, {"title": "Binance users pull $3.6bn as crypto exchange restarts services after heist", "full_content": "Group pledges to reimburse users whose assets were stolen in hack blamed on North Korea-linked group", "source": "FT Markets", "pub_date_str": "01 Nov 2026, 11:45 PM IST", "pub_date_relative": "12m ago"}, {"title": "Here are 3 big things we're watching in the stock market in the week ahead", "full_content": "The market could use a few victories in the days ahead, which will be filled with more earnings, an election, and jobs data.", "source": "CNBC Top News", "pub_date_str": "01 Nov 2026, 11:42 PM IST", "pub_date_relative": "16m ago"}, {"title": "Moved abroad, selling mutual funds to buy a house in India? Know the tax rules", "full_content": "Section 86 of the Income-tax Act, 2025 (corresponding to erstwhile Section 54F of the Income-tax Act, 1961) provides deduction to an individual or a Hindu Undivided Family (HUF) against Long Term Capital Gains (\u2018LTCG\u2019) arising from transfer of a long-term capital asset (not being a residential house property), where the net consideration is invested in a residential house in India, subject to the prescribed conditions.\n\nSince the asset transferred in your case is mutual fund units, the deduction may be evaluated, provided the mutual fund units qualify as long-term capital asset and other prescribed conditions are satisfied. The benefit is available to both resident and non-resident individuals.\n\nWe have listed below certain key conditions to be satisfied while claiming the deduction:\n\nAccordingly, you may claim exemption under Section 86 (erstwhile section 54F of income tax act 1961) on the long-term capital gains arising from the sale of your mutual fund investments by reinvesting the eligible sale consideration on a residential property in Delhi, subject to satisfaction of all the prescribed conditions.\n\nAlso, any implications of such sale in Luxembourg should be reviewed separately.\n\nParizad Sirwalla is partner and head, global mobility services, tax, KPMG in India.\n\nCatch all the Instant Personal Loan , Business Loan , Business News , Money news , Breaking News Events and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.\n\nLog in to our website to save your bookmarks. It'll just take a moment.", "source": "LiveMint Money", "pub_date_str": "01 Nov 2026, 11:41 PM IST", "pub_date_relative": "16m ago"}, {"title": "Small-cap funds were the worst-performing equity category in October. Which funds held up and which lagged behind?", "full_content": "Small-cap mutual funds emerged as the worst-performing equity category in October 2026, declining 5.83% on average. Among the 36 small-cap schemes, Invesco India Small Cap Fund was the most resilient, declining 2.98% in October.\n\nTRUSTMF Small Cap Fund and Samco Small Cap Fund followed with losses of 3.27% and 4.10%, respectively. At the other end, Tata Small Cap Fund plunged 11.16%, making it the worst performer in the category.\n\nThe divergence highlights how differently fund portfolios navigated the difficult month. While the category average fell 5.83%, several schemes managed to outperform it by limiting their declines. However, even the better-performing funds remained in negative territory.\n\nInvesco India Small Cap Fund recorded the smallest decline among the schemes analysed, falling 2.98%. This was followed by TRUSTMF Small Cap Fund, which lost 3.27%, and Samco Small Cap Fund, which declined 4.10%.\n\nMahindra Manulife Small Cap Fund and ITI Small Cap Fund also performed relatively better, with losses of 4.59% and 4.66%, respectively. Aditya Birla Sun Life Small Cap Fund and HDFC Small Cap Fund posted declines of 4.84% and 4.90%.\n\nTata Small Cap Fund was the worst-performing scheme in the category, declining 11.16% during October. Its loss was almost twice the category average.\n\nQuantum Small Cap Fund was the second-worst performer, falling 7.40%, followed by ICICI Prudential Small Cap Fund, which declined 7.25%. The Wealth Company Small Cap Fund and Bank of India Small Cap Fund also recorded steep losses of 7.08% and 7.05%, respectively.\n\nOther notable laggards included HSBC Small Cap Fund (-6.97%), Franklin India Small Cap Fund (-6.78%), DSP Small Cap Fund (-6.75%), Sundaram Small Cap Fund (-6.68%) and Groww Small Cap Fund (-6.67%).", "source": "LiveMint Money", "pub_date_str": "01 Nov 2026, 11:40 PM IST", "pub_date_relative": "17m ago"}, {"title": "Connecticut Sen. Chris Murphy has stroke and is in the hospital, office says", "full_content": "Sen. Chris Murphy , a Connecticut Democrat , was hospitalized Saturday after suffering a stroke at his son's hockey game, his office announced on Sunday.\n\nMurphy is \"awake and alert,\" according to a statement from his chief of staff Allison Herwitt.\n\n\"Yesterday afternoon, Senator Murphy started experiencing numbness in his arm while at his son's hockey game. He was taken to a local hospital, where it was discovered he had experienced a stroke. He was transferred to Johns Hopkins for further monitoring and is responding well to treatment,\" Herwitt said.\n\n\"The doctors are encouraged by his progress,\" Herwitt said. \"We are optimistic he will make a full recovery.\"\n\nMurphy, who came to the Senate in 2013, is not up for reelection on Tuesday, but he's been crisscrossing the country campaigning for Democratic candidates, with recent stops in Michigan, Minnesota and Florida. He was due in New Hampshire on Sunday to campaign with Democratic Rep. Chris Pappas.\n\nHe's seen as a potential 2028 presidential candidate and is a prolific Democratic fundraiser.", "source": "CNBC Top News", "pub_date_str": "01 Nov 2026, 11:38 PM IST", "pub_date_relative": "19m ago"}, {"title": "Bank interest not reported in ITR? ITAT ruling explains when taxpayers can escape income tax penalties", "full_content": "The Income Tax Appellate Tribunal (ITAT), Delhi, has deleted a penalty of \u20b9 3.08 lakh imposed on a salaried taxpayer for failing to disclose \u20b9 4.49 lakh in bank interest in his original income-tax return. The tribunal held that the omission was bona fide and inadvertent, and that the income-tax department had also failed to specify the precise charge of misreporting in its penalty notice.\n\nIn the case of Sidharth Gupta v. Income Tax Officer (ITO), Ward 29(1), the tribunal noted that the taxpayer subsequently disclosed the omitted interest income in his return filed in response to a reassessment notice and paid the applicable tax. The assessing officer accepted the revised income without making any further addition. The tribunal ruled that these circumstances did not establish deliberate misreporting of income warranting a penalty.\n\nThe ruling, delivered on 14 October 2026 in ITA No. 6864/DEL/2026, was pronounced by a bench comprising Vice President Mahavir Singh and Accountant Member S. Rifaur Rahman.\n\nGupta, a salaried individual, filed his original income-tax return for assessment year 2020-21 on 16 October 2020, declaring a total income of \u20b9 81.35 lakh. This included his salary income and bank interest.\n\nThe income-tax department subsequently reopened his assessment under Section 147 of the Income-tax Act, 1961, based on information available on its Insight portal. The information included bank interest income and the purchase of a motor vehicle.\n\nFollowing a notice under Section 148 dated 31 March 2024, Gupta filed a return on 24 April 2024, declaring a higher income of \u20b9 85.84 lakh. This included additional bank interest of \u20b9 4.49 lakh that had not been reported in the original return.\n\nThe assessing officer completed the reassessment at the income declared by the taxpayer, without making any further addition.", "source": "LiveMint Money", "pub_date_str": "01 Nov 2026, 11:09 PM IST", "pub_date_relative": "48m ago"}, {"title": "Serbians mark railway disaster that led to rise of victorious student movement", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Nov 2026, 11:06 PM IST", "pub_date_relative": "51m ago"}, {"title": "My father has Alzheimer\u2019s and his caregiver is using his debit card for DoorDash. Do I intervene?", "full_content": "\u201cI suspect the live-in caregiver is benefiting from my parent\u2019s generosity.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "01 Nov 2026, 11:00 PM IST", "pub_date_relative": "58m ago"}, {"title": "Ramayana Advance Bookings: Nitesh Tiwari's Magnum Opus Sees Pickup In Pre-Release Ticket Sales", "full_content": "Four days before release, Ramayana has grossed Rs 36.68 crore in advance bookings across India, including block seats, with Hindi markets leading demand.", "source": "NDTV Profit", "pub_date_str": "01 Nov 2026, 10:57 PM IST", "pub_date_relative": "1h ago"}, {"title": "Bengaluru-Mumbai Vande Bharat Sleeper Train Brings Three-State Corridor, Ties Twin Economic Hubs", "full_content": "Bengaluru-Mumbai sleeper service connects three states, improves access to North Karnataka; Railways announces another Vande Bharat corridor via Hubballi.", "source": "NDTV Profit", "pub_date_str": "01 Nov 2026, 10:54 PM IST", "pub_date_relative": "1h ago"}, {"title": "Jailer 2 Box Office Collection Day 18: Rajinikanth Starrer Crosses Rs 800 Crore Worldwide", "full_content": "The film's India gross now stands at Rs 533.75 crore, while the net collection now stands at Rs 456.3 crore till now.", "source": "NDTV Profit", "pub_date_str": "01 Nov 2026, 10:44 PM IST", "pub_date_relative": "1h ago"}, {"title": "Alaska Sen. Sullivan says he'll accept election results, slams Peltola campaign\u2019s reported recruitment of 2nd Sullivan", "full_content": "Alaska Republican Sen. Dan Sullivan said Sunday he would accept the results of Tuesday's midterm elections, while slamming Democratic candidate Mary Peltola 's campaign for reportedly recruiting Dan J. Sullivan to run as a spoiler.\n\n\"No, I'm going to accept the election results,\" Sullivan said on CNN's \"State of the Union\" when asked whether he would accept the results only if he wins. President Donald Trump 's Department of Justice has sued Alaska, demanding the state not certify the election if the incumbent Republican loses.\n\nThe lawsuit cites theoretical voter confusion over the appearance of the second Sullivan on the ballot, which DOJ says could siphon votes away from the incumbent Republican Sullivan and benefit Peltola. Alaska's Senate race is rated as a \"toss-up\" by the nonpartisan Cook Political Report with Amy Walter , and Peltola holds a slight edge in the polling average compiled by FiftyPlusOne.\n\nPeltola has repeatedly denied any involvement with the second Sullivan. However, The New York Times reported last week that her campaign was directly involved with recruiting Dan J. Sullivan, a retired schoolteacher, to run as a spoiler.\n\nBallot-stacking is typically not illegal, and both parties have used it in past elections. Still, Alaska Gov. Mike Dunleavy ordered a criminal investigation into the alleged scheme. Alaska's Supreme Court upheld Dan J. Sullivan's place on the ballot during an earlier legal challenge.\n\nSullivan on CNN said that the Times report shows Peltola's campaign, along with the Democratic Senate campaign arm, \"recognizing they couldn't run on their record, so they had to cheat.\"\n\n\"I think a lot of Alaskans, even Democrats, are thinking she is not fit for office; she's continually lying to the Alaskan people, and I guarantee you she's lying right now,\" Sullivan said.\n\nPeltola denied any knowledge of the alleged scheme to draft a second Sullivan in an interview with KTUU on Friday.", "source": "CNBC Top News", "pub_date_str": "01 Nov 2026, 10:42 PM IST", "pub_date_relative": "1h ago"}, {"title": "New Zealand\u2019s two-speed economy poses election dilemma for ruling National party", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Nov 2026, 10:42 PM IST", "pub_date_relative": "1h ago"}, {"title": "Binance withdrawals resume following $6 billion hack - CNN", "full_content": "Binance withdrawals resume following $6 billion hack CNN North Korea responsible for $6 billion Binance cryptocurrency hack, FBI says Fox Business Behind the Scenes of Crypto\u2019s Biggest Nightmare: a Record-Breaking Cyber Heist WSJ How suspected North Korean hackers swiped billions in crypto in only minutes The Washington Post Investors take out $3.6bn from Binance after record hack that stole billions The Guardian", "source": "Google News Business", "pub_date_str": "01 Nov 2026, 10:39 PM IST", "pub_date_relative": "1h ago"}, {"title": "\u2018He was heartbroken\u2019: My husband\u2019s kids abandoned him when he was dying. Was he right to leave everything to me?", "full_content": "\u201cIn the end, he left them a few sentimental mementos, some collectibles and old photographs.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "01 Nov 2026, 10:35 PM IST", "pub_date_relative": "1h ago"}, {"title": "\u2018Anyone can be a super-hacker now\u2019: The world faces a cybersecurity reckoning - The Washington Post", "full_content": "\u2018Anyone can be a super-hacker now\u2019: The world faces a cybersecurity reckoning The Washington Post A 'code red' for cybersecurity? How to prepare for a possible wave of AI hacking ABC News - Breaking News, Latest News and Videos Cyber Responders Strained By \u2018Black October\u2019 WSJ The humans burning out on AI's cyber frontlines Axios Azeem Azhar on the Explosion of Hacking and Other AI Issues Paul Krugman | Substack", "source": "Google News Business", "pub_date_str": "01 Nov 2026, 10:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "Affle 3i To Acquire Israel's Perion Network For $420M In All-Cash Deal: What Will Shareholders Get?", "full_content": "Affle 3i will acquire all outstanding shares of Perion Network at $11.70 per share. The all-cash transaction values Perion's equity at approximately $420 million, or Rs 3,986 crore.", "source": "NDTV Profit", "pub_date_str": "01 Nov 2026, 10:28 PM IST", "pub_date_relative": "1h ago"}, {"title": "Rajinikanth's Jailer 2 Becomes Highest Tamil Grosser In India", "full_content": "Jailer 2 has earned Rs 520.35 crore gross in India so far, just ahead of 2.0's Rs 519 crore.", "source": "NDTV Profit", "pub_date_str": "01 Nov 2026, 10:23 PM IST", "pub_date_relative": "1h ago"}, {"title": "Trade Setup For Nov. 2: Nifty Eyes Resistance At 23,200; Can Bulls Push Index Above 24,000?", "full_content": "Analysts recommend a selective buy-on-dips approach as long as the Nifty index holds above key support levels.", "source": "NDTV Profit", "pub_date_str": "01 Nov 2026, 10:23 PM IST", "pub_date_relative": "1h ago"}, {"title": "Juventus vs Napoli Live Streaming: When And Where To Watch Serie A Match Live In India", "full_content": "Here are the date, time, venue and live-streaming details for Juventus vs Napoli in India.", "source": "NDTV Profit", "pub_date_str": "01 Nov 2026, 10:15 PM IST", "pub_date_relative": "1h ago"}, {"title": "Cyclone 'Murasu' Forms Over Bay Of Bengal; Southern Odisha, Andhra Power Utilities On High Alert", "full_content": "The IMD has forecast that the storm will maintain its west-northwestward trajectory, gaining strength over the west-central Bay of Bengal and developing into a severe cyclonic system by the forenoon of November 2.", "source": "NDTV Profit", "pub_date_str": "01 Nov 2026, 10:13 PM IST", "pub_date_relative": "1h ago"}, {"title": "Grand Theft Callout: \u2018GTA 6\u2019 fans are missing work on the game\u2019s release day because they \u2018don\u2019t want to wait\u2019 anymore", "full_content": "After waiting 13 years for this videogame, almost one-fifth of workers plan to take the day off to play \u2018Grand Theft Auto VI\u2019 when it drops on Nov. 19", "source": "MarketWatch Top Stories", "pub_date_str": "01 Nov 2026, 10:05 PM IST", "pub_date_relative": "1h ago"}, {"title": "For JPMorgan, Amazon, fighting AI bots like Meta Muse may not be a winning long-term strategy", "full_content": "The biggest names in banking and retail are starting to fight the tech titans, and one another, over a new kind of customer: the AI personal agent.\n\nJPMorgan Chase , Charles Schwab, Amazon , Neiman Marcus and Kohl's have moved to block personal agents like Meta Muse just as consumers start sending them out to find better savings rates , shop for deals and cancel subscriptions.\n\nThe era of agentic AI has arrived, but there is uncertainty about what the landscape will look like when virtual storefronts become flooded with AI agents or when a business tries to block them.\n\nReports last week of AI agents going rogue in customer accounts \u2014 and prominent politicians including Sen. Mark Warner and Sen. Bernie Sanders calling for bot legislation in response to the headlines \u2014 come on the heels of JPMorgan Chase CEO Jamie Dimon saying the bank currently blocks external AI agents from operating on behalf of retail customers, citing security risks.\n\nSome other retailers are leaning in. Walmart announced last week it is opening the virtual doors to AI agents that customers prefer to use. \"We price products, not people, so the prices that an AI agent sees are the same prices that a human would see on Walmart.com, with applicable offers and fees shown before purchase,\" the company said in a blog post announcing the decision.\n\nA recent audit of 51 large U.S. retailers' published access rules by identity-verification company Billions Network and affiliated company AmanTrue, found only 11 have taken a deliberate position on AI agents. Five, including Amazon, Kohl's and Neiman Marcus, explicitly restrict them, while 37 block shopping agents largely by accident, through older bot rules written for scrapers. None has a way for a verified agent to complete a purchase.\n\nBased on Billions Network's analysis, blocking an agent can occur in multiple ways: blocking a specific bot from a third-party by its rules (e.g.", "source": "CNBC World Economy", "pub_date_str": "01 Nov 2026, 10:04 PM IST", "pub_date_relative": "1h ago"}, {"title": "New England Revolution vs Inter Miami Live Streaming: When And Where To Watch Messi's MLS Match In India", "full_content": "New England Revolution host Inter Miami on November 1 in a key MLS clash. Check the match time, venue and where to watch Lionel Messi's Inter Miami live in India.", "source": "NDTV Profit", "pub_date_str": "01 Nov 2026, 10:00 PM IST", "pub_date_relative": "1h ago"}, {"title": "F1 Mexico GP Final Race Live Streaming: When And Where To Watch In India", "full_content": "Ferrari's Lewis Hamilton secured pole position at the Mexico City Grand Prix. Check the starting grid, race timings and live streaming details for Indian viewers.", "source": "NDTV Profit", "pub_date_str": "01 Nov 2026, 10:00 PM IST", "pub_date_relative": "1h ago"}, {"title": "Crash! Gold price suffers worst October in years: Did silver and platinum suffer too? Check monthly performance", "full_content": "Gold prices tumbled to their one-year low in October, marking their worst monthly performance in years. Silver and platinum also saw significant declines over the past one month amid rising geopolitical uncertainty, crude oil price volatility and inflation concerns.\n\nAs November begins, let\u2019s take a closer look at how gold, silver and platinum performed in October, and which metal was the worst hit in the month.\n\nInternational gold prices fell to their one-year low levels amid rising energy prices and persistent inflation concerns. International gold price fell below $ 3,900 per ounce on Friday, October 30, as per Trading Economics data.\n\nMirroring the weakness across the precious metals market, silver prices also saw sharp declines. The white metal plunged below $ 50 an ounce for the first time since November 2025. The sharp dip in the precious metal came as investors assessed growing expectations of elevated US interest rates for longer duration.\n\nPlatinum dipped below $ 1,500 per ounce and reached its lowest since September 2025 on Friday, as per Trading Economics data. The weakness in the precious metal came as investment outlaws and weaker demand outlook weighed on investors sentiment.\n\nOut of the three precious metals, silver saw the worst monthly decline in October of 19.17%, as per Trading Economics data, followed by platinum which declined 16.65% on a monthly basis. Gold declined 7.23% on a monthly basis. On a yearly basis, platinum remained as the biggest loser with 8% decline.\n\nThe recent sell-off in the precious metals market has again changed the gold-silver ratio, which has climbed to the highest level since December. It means that now it takes more ounces of silver to purchase the same measure of gold.\n\n\u201cThe divergence underscores silver\u2019s continued vulnerability relative to gold, which continues to attract demand from investors less sensitive to interest-rate developments,\u201d Bloomberg quoted Ole Hansen of Saxo Bank.", "source": "LiveMint Markets", "pub_date_str": "01 Nov 2026, 09:54 PM IST", "pub_date_relative": "2h ago"}, {"title": "Technology funds delivered 6.3% returns in October, while no other category crossed 1%: Here\u2019re the top performing funds", "full_content": "Technology mutual funds emerged as the best-performing equity mutual fund category in October 2026, delivering an average return of 6.29%, while no other mutual fund category managed to cross the 1% mark. The strong performance put technology-focused schemes ahead of other equity categories during the month, although returns varied considerably across individual funds.\n\nOf the 13 technology funds considered, HDFC Technology Fund delivered the highest return at 11.54%. Kotak Technology Fund and ICICI Prudential Technology Fund followed with gains of 8.86% and 8.22%, respectively.\n\nHowever, the rally was not uniform. Motilal Oswal Digital India Fund was the only scheme to post a negative return, declining 2.72% in October. Quant Teck Fund delivered a relatively modest 1.67% return.\n\nHDFC Technology Fund topped the list of technology mutual funds , delivering an 11.54% return in October. The scheme had assets under management (AUM) of \u20b9 1,371 crore as of 1 November 2026, according to Value Research data.\n\nKotak Technology Fund, with an AUM of \u20b9 479 crore, delivered an 8.86% return. ICICI Prudential Technology Fund, the largest scheme in the list with an AUM of \u20b9 12,505 crore, gained 8.22%.\n\nTata Digital India Fund and SBI Technology Opportunities Fund also delivered strong returns of 7.99% and 7.91%, respectively. Their AUM stood at \u20b9 9,276 crore and \u20b9 4,155 crore.\n\nFranklin India Technology Fund returned 7.65% in October, with an AUM of \u20b9 1,623 crore. WhiteOak Capital Digital Bharat Fund gained 7.03%, while Invesco India Technology Fund delivered 6.68%. Their respective AUMs stood at \u20b9 510 crore and \u20b9 317 crore.\n\nAditya Birla Sun Life Digital India Fund returned 6.51%, with an AUM of \u20b9 3,617 crore.", "source": "LiveMint Money", "pub_date_str": "01 Nov 2026, 09:47 PM IST", "pub_date_relative": "2h ago"}, {"title": "Temple vs Apple Watch: Deepinder Goyal Explains Why New Wearable Beats Apple In Cardio Data, Invites Review", "full_content": "Zomato founder Deepinder Goyal has shared results of an internal study claiming his wearable startup Temple tracks heart rate more accurately than five flagship wearables, including the Apple Watch.", "source": "NDTV Profit", "pub_date_str": "01 Nov 2026, 09:28 PM IST", "pub_date_relative": "2h ago"}, {"title": "Everything changed for the oil, AI and bond trades over the past month", "full_content": "If there was one safe bet over the course of 2026, it was that treasury yields would rise alongside a move up in oil futures contracts. Over the past month, that ended, and according to Jeffrey Rosenberg, senior portfolio manager of the Systematic Alternatives ETF ( IALT ) at BlackRock, the world's largest asset manager, the breakdown in that trade has big implications for the market.\n\n\"Oil and treasury yields had this amazing correlation and in October it just stopped,\" Rosenberg said on the most recent CNBC \"ETF Edge.\"\n\nThe relationship between oil and bond yields was featured in Federal Reserve Chair Kevin Warsh's FOMC press conference on Wednesday, with Warsh noting how oil futures have continued to rise, a factor the central bank must consider in its fight against inflation. But Rosenberg said what Warsh didn't talk about was \"the most important takeaway.\"\n\n\"Treasuries and oil had an 80% correlation this year,\" Rosenberg said, which is \"outsize\" relative to normal correlations. \"We've basically been trading off oil for good reason.\" \"\n\nOil futures contract one-month performance. What happened? Rosenberg says you can sum it up by looking to the deflated AI trade. As the market moved away from that oil-treasuries trading correlation in October, \"It told us something important,\" he said. \"In the market's mind, the geopolitical risk is secondary to AI risk,\" he said.\n\nOver the past month \u2014 which became most painfully clear in Friday's Nasdaq market wipeout and, earlier the week, Google's biggest single-day decline in its history, wiping out half a trillion dollars in value \u2014 the AI trade experienced a retracement. Bond yields went lower, Rosenberg says, because the market is equating weakness in the AI trade as a broader weakness in the U.S. economy. And he said, last week's GDP report backed up that thinking. \"AI is everything, everywhere, all the time,\" he said.", "source": "CNBC Top News", "pub_date_str": "01 Nov 2026, 09:28 PM IST", "pub_date_relative": "2h ago"}, {"title": "19% Credit vs 10% GDP: Prof Flags Inflation>Rupee Risk, Urges RBI To Rein In Bank Credit", "full_content": "Bank credit growth has reached 19.1%, significantly exceeding nominal GDP growth of approximately 10-11%. ISB professor Prasanna Tantri has warned that the widening gap could fuel inflationary pressures.", "source": "NDTV Profit", "pub_date_str": "01 Nov 2026, 09:28 PM IST", "pub_date_relative": "2h ago"}, {"title": "Binance sees spike in customers pulling funds out after covering bulk of stolen $6.3 billion", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Nov 2026, 09:24 PM IST", "pub_date_relative": "2h ago"}, {"title": "Buying a car on Dhanteras, Diwali 2026? You could get at least \u20b910,000 as tax refund next year \u2014 here's how", "full_content": "Dhanteras and Diwali are considered auspicious occasions to bring home new appliances and vehicles. This is also when several brands roll out festive offers and discounts to encourage people to make big-ticket purchases.\n\nIf you are planning to buy a vehicle anytime soon, it is important to know that you could be eligible for a tax benefit of at least \u20b9 10,000, which you can claim while filing your income tax return (ITR) next year.\n\nWhen a vehicle's value exceeds the prescribed limit, the dealer collects 1% TCS (tax collected at source) at the time of sale. This is not additional charge but tax paid in advance, which you can claim as a credit.\n\nIn other words, it is your own money only, collected as tax in advance and refunded or adjusted when you file your return.\n\nA 1% TCS is levied on the sale of a motor vehicle if its sale value exceeds \u20b9 10 lakh. The provision is intended to help the tax department track high-value purchases.\n\nThe dealer collects this amount from the buyer at the time of the transaction and deposits it against the buyer's Permanent Account Number (PAN).\n\nFor example, if you bought a car worth \u20b9 20 lakh and 1% TDS was deducted by the dealer or seller at the time of purchase, then you may be eligible to receive a tax refund of approximately \u20b9 20,000.\n\nA taxpayer who meets all the requirements for receiving a TCS refund can follow the given steps to file a claim:", "source": "LiveMint Money", "pub_date_str": "01 Nov 2026, 09:23 PM IST", "pub_date_relative": "2h ago"}, {"title": "Voice cloning scams: How to protect yourself from audio deepfakes - Mashable", "full_content": "Voice cloning scams: How to protect yourself from audio deepfakes Mashable Column: Cybersecurity in the age of AI Bend Bulletin AI agents are helping criminals to commit cyber crimes more cheaply and efficiently, say experts The National Fake resumes, fake employees: AI amplifying fraud at 'staggering' rate, security watchers warn National Post AI chatbots might direct you to ghost store scams Pickr", "source": "Google News Business", "pub_date_str": "01 Nov 2026, 09:23 PM IST", "pub_date_relative": "2h ago"}, {"title": "Raymond James cuts Oil States stock price target on guidance outlook", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Nov 2026, 09:11 PM IST", "pub_date_relative": "2h ago"}, {"title": "Emami vs Dabur FMCG shares Q2 results preview: Profit, revenue expectations; Dividend announcements in focus", "full_content": "DABUR DIVIDEND Sharmila Bhadoria Updated 1 Nov 2026, 09:01 PM IST Prefer Livemint on Google Emami vs Dabur India : Two of the biggest names in the fast moving consumer durables goods (FMCG) space, Emami Limited, are set to announce their quarterly earnings this week. While Emami is likely to see healthy revenue growth, Dabur India may see double digit revenue growth during the quarter.\n\nBoth the FMCG giants are also expected to announce a dividend alongside their Q2FY27 results. Here are all the details to know.\n\nEmami\u2019s board of directors meeting is scheduled to meet on Thursday, November 5, to announce quarterly earnings. The board may also consider and declare interim dividend for FY27. Dabur India is set to announce Q2 results on Wednesday, November 4. The board may also consider and announce interim dividend for FY27.\n\nWhile Emami is expected to see a 20% annual jump in revenue, Dabur India may see 11% annual revenue growth, as per HDFC Securities report.\n\n\u201cWe expect gross margin contraction of 380bps YoY to 67.3% YoY. EBITDA margin is likely to see 240bps contraction to 20%. EBITDA is likely to grow by 7% YoY, while adj PAT should grow 4% YoY,\u201d stated HDFC Securities in its report.\n\nEmami\u2019s adjusted profit after tax (PAT) growth is likely to remain close to 4%, Dabur India may see 9% jump in adjusted PAT.\n\nDabur India\u2019s \u201cgross margin is likely to see contraction of 140bps YoY to 48%. We see EBITDA margins at ~18% YoY, down 50bps YoY. EBITDA and adjusted PAT is likely to see growth of 8% and 9%, respectively,\u201d read HDFC Securities report.\n\nDabur India\u2019s share price closed 0.85% lower at \u20b9 366 per share on BSE with a market capitalisation of \u20b9 65,175.18 crore on Friday. The FMCG stock value has declined 13.99% in three months, 26.81% in 2026 so far, and around 27% in one year.", "source": "LiveMint Markets", "pub_date_str": "01 Nov 2026, 09:00 PM IST", "pub_date_relative": "2h ago"}, {"title": "Devyani-Sapphire Merger Gets CCI Nod: KFC India, Pizza Hut Ops Unify Under QSR Powerhouse", "full_content": "The CCI clears the proposed merger, bringing the KFC and Pizza Hut franchise operations of both companies under a common corporate structure, subject to other regulatory formalities.", "source": "NDTV Profit", "pub_date_str": "01 Nov 2026, 08:58 PM IST", "pub_date_relative": "3h ago"}, {"title": "These Senate races may help determine the fate of Social Security", "full_content": "Senators elected this November must answer a crucial question before their six-year term ends : What will they do to fix Social Security ?\n\nThe program's trustees project that the trust fund Social Security relies on to help pay retirement benefits may be depleted in the fourth quarter of 2032. Without action from Congress before then, those benefits could be cut by 22%.\n\nLawmakers may enact reforms to prevent those automatic cuts. Or they may kick the can down the road .\n\nMost voters \u2014 81% \u2014 say they are more likely to support a candidate who has a plan to avoid automatic benefit cuts to Social Security over a candidate who promises not to touch the program, according to a recent survey of voters in states with competitive Senate races by the Peter G. Peterson Foundation, a nonpartisan organization.\n\nEven so, many Senate candidates' campaign platforms lack specifics on plans for the program's future.\n\nWhile 35 Senate seats are up for grabs in November, including in special elections in Florida and Ohio, CNBC identified nine races where the candidates have mentioned their plans for the program's future. MS NOW says all nine races are closely contested battlegrounds, and it rates the possible outcomes.\n\nHere is a closer look at those nine contests and what the candidates in those races have said about Social Security reform.\n\nAlaska voters will choose between incumbent Republican Sen. Dan Sullivan and former Democratic Rep. Mary Peltola, who served in the House from 2022 to 2025.", "source": "CNBC Top News", "pub_date_str": "01 Nov 2026, 08:50 PM IST", "pub_date_relative": "3h ago"}, {"title": "Social Security may have to cut retirement benefits in six years. Here's how much money is at stake for beneficiaries", "full_content": "Social Security retirement benefits may face an automatic, across-the-board cut in just six years .\n\nWithout intervention before then, the Social Security retirement trust fund, formally known as the Old-Age and Survivors Insurance Trust Fund, which helps pay benefits to eligible workers and qualifying family members, will run out in the fourth quarter of 2032, the program's trustees said in a June report .\n\nAt that time, the trustees project retirement benefits will be cut by 22%.\n\nThe Congressional Budget Office has a more dire forecast, anticipating the retirement trust fund may run out sooner, in mid-2032, and that retirees may see larger benefit cuts, at 26%, upon insolvency.\n\nBeneficiaries may see an average $500 cut to their monthly benefits across the U.S. based on a 24% benefit cut, according to a June report from the Committee for a Responsible Federal Budget. In 29 states, retirees would see even bigger average reductions, according to the nonpartisan organization focused on educating the public on fiscal policy issues.\n\nSenators elected this November will be in office in 2032, when the retirement trust fund depletion date hits. Their ability to right the ship is crucial for retirees and the economy. But it's not a sure thing given the political climate inside the beltway.\n\n\"The attention on 2032 is appropriate in the sense that that is when beneficiaries and future beneficiaries will see and feel the consequences of inaction,\" said Shai Akabas, vice president of economic policy at the Bipartisan Policy Center, a public policy think tank focused on promoting bipartisan cooperation.\n\n\"Nothing gets Congress to move like that type of deadline,\" he said.", "source": "CNBC Top News", "pub_date_str": "01 Nov 2026, 08:48 PM IST", "pub_date_relative": "3h ago"}, {"title": "Aadarsha Kutumbam Box Office Collection Day 3: Venkatesh Film Soars On Opening Weekend", "full_content": "A Telugu family entertainer, Aadarsha Kutumbam House No: 47 is directed by Trivikram Srinivas and produced by Haarika & Hassine Creations.", "source": "NDTV Profit", "pub_date_str": "01 Nov 2026, 08:47 PM IST", "pub_date_relative": "3h ago"}, {"title": "Government Bond Yields May Ease To 6.75%-7% By March 2027 Despite Potential RBI Rate Hike: Report", "full_content": "SBI Research estimates an excess supply of around Rs 1.52 lakh crore in the Indian government bond market.", "source": "NDTV Profit", "pub_date_str": "01 Nov 2026, 08:46 PM IST", "pub_date_relative": "3h ago"}, {"title": "Kia India Posts Record October Sales; Dispatches Rise 13% YoY", "full_content": "The record October performance was supported by positive festive-season sentiment.", "source": "NDTV Profit", "pub_date_str": "01 Nov 2026, 08:33 PM IST", "pub_date_relative": "3h ago"}, {"title": "Dermatologists Say Yellow Stains on Your Pillow Are a Warning Sign, and Here\u2019s What They Mean - SheKnows", "full_content": "Dermatologists Say Yellow Stains on Your Pillow Are a Warning Sign, and Here\u2019s What They Mean SheKnows", "source": "Google News Business", "pub_date_str": "01 Nov 2026, 08:30 PM IST", "pub_date_relative": "3h ago"}, {"title": "Apple\u2019s new earnings era begins at a critical time for Big Tech", "full_content": "A rare Monday earnings report for Apple will give investors a glimpse into how new CEO John Ternus is managing inflated memory prices and a tougher backdrop for consumer spending.", "source": "MarketWatch Top Stories", "pub_date_str": "01 Nov 2026, 08:30 PM IST", "pub_date_relative": "3h ago"}, {"title": "The 21 Recipes We Can\u2019t Wait To Make This November - AOL.com", "full_content": "The 21 Recipes We Can\u2019t Wait To Make This November AOL.com 21 New Recipes for November for Before and After the Big Feast Food & Wine 40 Comforting Weeknight Dinners For Every Day Of November & Then Some Delish The Best Recipes to Cook This November, from Thanksgiving Dishes to Weeknight Meals Sunset Magazine", "source": "Google News Business", "pub_date_str": "01 Nov 2026, 08:30 PM IST", "pub_date_relative": "3h ago"}, {"title": "OPEC+ keeps December oil output targets steady ahead of tougher call for 2027", "full_content": "OPEC+ oil-producing countries kept December \u200bproduction targets steady on Sunday, confirming \u200bexpectations that no further policy adjustments will occur until next year, as the group continues to struggle with export disruptions from the Iran war.\n\nSeven core OPEC+ members \u2014 Saudi Arabia, Russia, Iraq, Kuwait, Algeria, Kazakhstan and Oman \u2014 made the decision in an online \u2060meeting \u200con Sunday, OPEC said in a statement. While Gulf members have been boosting exports disrupted for months by the conflict, most are still pumping well below their targets.\n\nOPEC+ comprises the Organization of the Petroleum Exporting Countries and allies including Russia. Only the seven members \u2014 plus the United Arab Emirates until \u200cit quit OPEC in May \u2014 have been involved in monthly output decisions in recent years. All members of the 21-country group are due to meet on November 29, when analysts \u200bexpect it will decide 2027 quotas.\n\n\"Today's decision was the easy one,\" said Jorge Leon, an analyst at Rystad. \"The much more important test comes at the Nov. 29 ministerial meeting, when OPEC+ will decide its 2027 production framework.\"\n\nOil prices jumped more than 2% on Friday, with \u2060Brent crude settling at almost $118 a barrel, the highest since April, as traders braced for a potential escalation in the Iran war \u200cafter the US midterm elections.\n\nThe International Energy Agency and other \u200cforecasters have warned of excess supply in 2027 should Gulf flows return to normal.\n\n\"OPEC+ faces an extremely difficult call for 2027,\" Leon added. \"The group has to plan around huge uncertainty over the US-Iran war, the pace of recovery through the \u2060Strait of Hormuz, and the size of the surplus that could emerge once disrupted barrels return.\"\n\nThe seven members have been boosting output targets for much of 2026 and, in September, completed the phased rollback of a 1.65 million-barrel-per-day supply cut first agreed in 2023. At earlier meetings, they kept the targets steady for \u200bOctober and November.", "source": "CNBC Top News", "pub_date_str": "01 Nov 2026, 08:29 PM IST", "pub_date_relative": "3h ago"}, {"title": "October Auto Sales Live Updates: Eicher Motors' October Sales Rise 7%; Exports Jump 47%", "full_content": "Automakers release October sales figures, offering clues on festive demand, rural consumption, export growth and industry trends.", "source": "NDTV Profit", "pub_date_str": "01 Nov 2026, 08:26 PM IST", "pub_date_relative": "3h ago"}, {"title": "Iran, Qatari mediators hold third day of talks to end U.S.-Iran war", "full_content": "Iranian negotiators were in Doha on Sunday for a third consecutive day of talks with Qatari mediators aimed at pushing for a deal to end the U.S.-Israeli war on Iran, an official briefed on the discussions told Reuters.\n\nThe talks come amid concerns that the conflict could escalate again after the Nov. 3 U.S. midterm elections . U.S. President Donald Trump has said the United States will not launch new attacks on Iran before the vote and that talks with Tehran have been productive, though he has not ruled out further military action afterward.\n\nIran's Foreign Minister Abbas Araqchi said on Sunday that the purpose of the \"ongoing and progressing\" talks was to continue consultations with the Qatari mediators, adding Tehran is prepared for \"both defense and diplomacy.\"\n\nSpeaking to state media, Araqchi said discussions on a \"two-day proposal\" were continuing, but that no final conclusion had been reached.\n\nQatari broadcaster Al Jazeera quoted Araqchi as saying in an interview on Saturday that Iranian and Qatari negotiators had developed a proposal to reopen the Strait of Hormuz within two days of a potential agreement with Washington.\n\nIran has repeatedly said it would respond to any new attacks by striking US and Israeli targets in neighboring countries, as the eight-month-old war continues to disrupt global oil supplies and spill over across the Middle East.\n\n\"We are doing our best in this process, and we hope that there is rationality on the other side so that they prioritize diplomacy over other paths,\" Araqchi said of the talks with Qatari officials.\n\nIran's Supreme Leader Ayatollah Mojtaba Khamenei on Saturday ordered the armed forces to be prepared for any attack, while the military later announced steps to strengthen its readiness.", "source": "CNBC Top News", "pub_date_str": "01 Nov 2026, 08:25 PM IST", "pub_date_relative": "3h ago"}, {"title": "Junk debt rout sparks \u2018bloodbath\u2019 for credit investors", "full_content": "Aggressive tactics to shift assets beyond reach of creditors have added fuel to sell-off", "source": "FT Markets", "pub_date_str": "01 Nov 2026, 08:24 PM IST", "pub_date_relative": "3h ago"}, {"title": "EPFO Debuts On WhatsApp: Dormant PF Accounts To Auto-Settle; Check Balance, Passbook", "full_content": "Union Labour and Employment Minister Mansukh Mandaviya has launched two initiatives to simplify EPFO services. The measures include WhatsApp-based access to routine PF information and automatic settlement of eligible inoperative accounts.", "source": "NDTV Profit", "pub_date_str": "01 Nov 2026, 08:23 PM IST", "pub_date_relative": "3h ago"}], "cfa": [{"title": "Binance users pull $3.6bn as crypto exchange restarts services after heist", "full_content": "Group pledges to reimburse users whose assets were stolen in hack blamed on North Korea-linked group", "source": "FT Markets", "pub_date_str": "01 Nov 2026, 11:45 PM IST", "pub_date_relative": "12m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Here are 3 big things we're watching in the stock market in the week ahead", "full_content": "The market could use a few victories in the days ahead, which will be filled with more earnings, an election, and jobs data.", "source": "CNBC Top News", "pub_date_str": "01 Nov 2026, 11:42 PM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Moved abroad, selling mutual funds to buy a house in India? Know the tax rules", "full_content": "Section 86 of the Income-tax Act, 2025 (corresponding to erstwhile Section 54F of the Income-tax Act, 1961) provides deduction to an individual or a Hindu Undivided Family (HUF) against Long Term Capital Gains (\u2018LTCG\u2019) arising from transfer of a long-term capital asset (not being a residential house property), where the net consideration is invested in a residential house in India, subject to the prescribed conditions.\n\nSince the asset transferred in your case is mutual fund units, the deduction may be evaluated, provided the mutual fund units qualify as long-term capital asset and other prescribed conditions are satisfied. The benefit is available to both resident and non-resident individuals.\n\nWe have listed below certain key conditions to be satisfied while claiming the deduction:\n\nAccordingly, you may claim exemption under Section 86 (erstwhile section 54F of income tax act 1961) on the long-term capital gains arising from the sale of your mutual fund investments by reinvesting the eligible sale consideration on a residential property in Delhi, subject to satisfaction of all the prescribed conditions.\n\nAlso, any implications of such sale in Luxembourg should be reviewed separately.\n\nParizad Sirwalla is partner and head, global mobility services, tax, KPMG in India.\n\nCatch all the Instant Personal Loan , Business Loan , Business News , Money news , Breaking News Events and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.\n\nLog in to our website to save your bookmarks. It'll just take a moment.", "source": "LiveMint Money", "pub_date_str": "01 Nov 2026, 11:41 PM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Small-cap funds were the worst-performing equity category in October. Which funds held up and which lagged behind?", "full_content": "Small-cap mutual funds emerged as the worst-performing equity category in October 2026, declining 5.83% on average. Among the 36 small-cap schemes, Invesco India Small Cap Fund was the most resilient, declining 2.98% in October.\n\nTRUSTMF Small Cap Fund and Samco Small Cap Fund followed with losses of 3.27% and 4.10%, respectively. At the other end, Tata Small Cap Fund plunged 11.16%, making it the worst performer in the category.\n\nThe divergence highlights how differently fund portfolios navigated the difficult month. While the category average fell 5.83%, several schemes managed to outperform it by limiting their declines. However, even the better-performing funds remained in negative territory.\n\nInvesco India Small Cap Fund recorded the smallest decline among the schemes analysed, falling 2.98%. This was followed by TRUSTMF Small Cap Fund, which lost 3.27%, and Samco Small Cap Fund, which declined 4.10%.\n\nMahindra Manulife Small Cap Fund and ITI Small Cap Fund also performed relatively better, with losses of 4.59% and 4.66%, respectively. Aditya Birla Sun Life Small Cap Fund and HDFC Small Cap Fund posted declines of 4.84% and 4.90%.\n\nTata Small Cap Fund was the worst-performing scheme in the category, declining 11.16% during October. Its loss was almost twice the category average.\n\nQuantum Small Cap Fund was the second-worst performer, falling 7.40%, followed by ICICI Prudential Small Cap Fund, which declined 7.25%. The Wealth Company Small Cap Fund and Bank of India Small Cap Fund also recorded steep losses of 7.08% and 7.05%, respectively.\n\nOther notable laggards included HSBC Small Cap Fund (-6.97%), Franklin India Small Cap Fund (-6.78%), DSP Small Cap Fund (-6.75%), Sundaram Small Cap Fund (-6.68%) and Groww Small Cap Fund (-6.67%).", "source": "LiveMint Money", "pub_date_str": "01 Nov 2026, 11:40 PM IST", "pub_date_relative": "17m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Bank interest not reported in ITR? ITAT ruling explains when taxpayers can escape income tax penalties", "full_content": "The Income Tax Appellate Tribunal (ITAT), Delhi, has deleted a penalty of \u20b9 3.08 lakh imposed on a salaried taxpayer for failing to disclose \u20b9 4.49 lakh in bank interest in his original income-tax return. The tribunal held that the omission was bona fide and inadvertent, and that the income-tax department had also failed to specify the precise charge of misreporting in its penalty notice.\n\nIn the case of Sidharth Gupta v. Income Tax Officer (ITO), Ward 29(1), the tribunal noted that the taxpayer subsequently disclosed the omitted interest income in his return filed in response to a reassessment notice and paid the applicable tax. The assessing officer accepted the revised income without making any further addition. The tribunal ruled that these circumstances did not establish deliberate misreporting of income warranting a penalty.\n\nThe ruling, delivered on 14 October 2026 in ITA No. 6864/DEL/2026, was pronounced by a bench comprising Vice President Mahavir Singh and Accountant Member S. Rifaur Rahman.\n\nGupta, a salaried individual, filed his original income-tax return for assessment year 2020-21 on 16 October 2020, declaring a total income of \u20b9 81.35 lakh. This included his salary income and bank interest.\n\nThe income-tax department subsequently reopened his assessment under Section 147 of the Income-tax Act, 1961, based on information available on its Insight portal. The information included bank interest income and the purchase of a motor vehicle.\n\nFollowing a notice under Section 148 dated 31 March 2024, Gupta filed a return on 24 April 2024, declaring a higher income of \u20b9 85.84 lakh. This included additional bank interest of \u20b9 4.49 lakh that had not been reported in the original return.\n\nThe assessing officer completed the reassessment at the income declared by the taxpayer, without making any further addition.", "source": "LiveMint Money", "pub_date_str": "01 Nov 2026, 11:09 PM IST", "pub_date_relative": "48m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Alaska Sen. Sullivan says he'll accept election results, slams Peltola campaign\u2019s reported recruitment of 2nd Sullivan", "full_content": "Alaska Republican Sen. Dan Sullivan said Sunday he would accept the results of Tuesday's midterm elections, while slamming Democratic candidate Mary Peltola 's campaign for reportedly recruiting Dan J. Sullivan to run as a spoiler.\n\n\"No, I'm going to accept the election results,\" Sullivan said on CNN's \"State of the Union\" when asked whether he would accept the results only if he wins. President Donald Trump 's Department of Justice has sued Alaska, demanding the state not certify the election if the incumbent Republican loses.\n\nThe lawsuit cites theoretical voter confusion over the appearance of the second Sullivan on the ballot, which DOJ says could siphon votes away from the incumbent Republican Sullivan and benefit Peltola. Alaska's Senate race is rated as a \"toss-up\" by the nonpartisan Cook Political Report with Amy Walter , and Peltola holds a slight edge in the polling average compiled by FiftyPlusOne.\n\nPeltola has repeatedly denied any involvement with the second Sullivan. However, The New York Times reported last week that her campaign was directly involved with recruiting Dan J. Sullivan, a retired schoolteacher, to run as a spoiler.\n\nBallot-stacking is typically not illegal, and both parties have used it in past elections. Still, Alaska Gov. Mike Dunleavy ordered a criminal investigation into the alleged scheme. Alaska's Supreme Court upheld Dan J. Sullivan's place on the ballot during an earlier legal challenge.\n\nSullivan on CNN said that the Times report shows Peltola's campaign, along with the Democratic Senate campaign arm, \"recognizing they couldn't run on their record, so they had to cheat.\"\n\n\"I think a lot of Alaskans, even Democrats, are thinking she is not fit for office; she's continually lying to the Alaskan people, and I guarantee you she's lying right now,\" Sullivan said.\n\nPeltola denied any knowledge of the alleged scheme to draft a second Sullivan in an interview with KTUU on Friday.", "source": "CNBC Top News", "pub_date_str": "01 Nov 2026, 10:42 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Binance withdrawals resume following $6 billion hack - CNN", "full_content": "Binance withdrawals resume following $6 billion hack CNN North Korea responsible for $6 billion Binance cryptocurrency hack, FBI says Fox Business Behind the Scenes of Crypto\u2019s Biggest Nightmare: a Record-Breaking Cyber Heist WSJ How suspected North Korean hackers swiped billions in crypto in only minutes The Washington Post Investors take out $3.6bn from Binance after record hack that stole billions The Guardian", "source": "Google News Business", "pub_date_str": "01 Nov 2026, 10:39 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Trade Setup For Nov. 2: Nifty Eyes Resistance At 23,200; Can Bulls Push Index Above 24,000?", "full_content": "Analysts recommend a selective buy-on-dips approach as long as the Nifty index holds above key support levels.", "source": "NDTV Profit", "pub_date_str": "01 Nov 2026, 10:23 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "For JPMorgan, Amazon, fighting AI bots like Meta Muse may not be a winning long-term strategy", "full_content": "The biggest names in banking and retail are starting to fight the tech titans, and one another, over a new kind of customer: the AI personal agent.\n\nJPMorgan Chase , Charles Schwab, Amazon , Neiman Marcus and Kohl's have moved to block personal agents like Meta Muse just as consumers start sending them out to find better savings rates , shop for deals and cancel subscriptions.\n\nThe era of agentic AI has arrived, but there is uncertainty about what the landscape will look like when virtual storefronts become flooded with AI agents or when a business tries to block them.\n\nReports last week of AI agents going rogue in customer accounts \u2014 and prominent politicians including Sen. Mark Warner and Sen. Bernie Sanders calling for bot legislation in response to the headlines \u2014 come on the heels of JPMorgan Chase CEO Jamie Dimon saying the bank currently blocks external AI agents from operating on behalf of retail customers, citing security risks.\n\nSome other retailers are leaning in. Walmart announced last week it is opening the virtual doors to AI agents that customers prefer to use. \"We price products, not people, so the prices that an AI agent sees are the same prices that a human would see on Walmart.com, with applicable offers and fees shown before purchase,\" the company said in a blog post announcing the decision.\n\nA recent audit of 51 large U.S. retailers' published access rules by identity-verification company Billions Network and affiliated company AmanTrue, found only 11 have taken a deliberate position on AI agents. Five, including Amazon, Kohl's and Neiman Marcus, explicitly restrict them, while 37 block shopping agents largely by accident, through older bot rules written for scrapers. None has a way for a verified agent to complete a purchase.\n\nBased on Billions Network's analysis, blocking an agent can occur in multiple ways: blocking a specific bot from a third-party by its rules (e.g.", "source": "CNBC World Economy", "pub_date_str": "01 Nov 2026, 10:04 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Crash! Gold price suffers worst October in years: Did silver and platinum suffer too? Check monthly performance", "full_content": "Gold prices tumbled to their one-year low in October, marking their worst monthly performance in years. Silver and platinum also saw significant declines over the past one month amid rising geopolitical uncertainty, crude oil price volatility and inflation concerns.\n\nAs November begins, let\u2019s take a closer look at how gold, silver and platinum performed in October, and which metal was the worst hit in the month.\n\nInternational gold prices fell to their one-year low levels amid rising energy prices and persistent inflation concerns. International gold price fell below $ 3,900 per ounce on Friday, October 30, as per Trading Economics data.\n\nMirroring the weakness across the precious metals market, silver prices also saw sharp declines. The white metal plunged below $ 50 an ounce for the first time since November 2025. The sharp dip in the precious metal came as investors assessed growing expectations of elevated US interest rates for longer duration.\n\nPlatinum dipped below $ 1,500 per ounce and reached its lowest since September 2025 on Friday, as per Trading Economics data. The weakness in the precious metal came as investment outlaws and weaker demand outlook weighed on investors sentiment.\n\nOut of the three precious metals, silver saw the worst monthly decline in October of 19.17%, as per Trading Economics data, followed by platinum which declined 16.65% on a monthly basis. Gold declined 7.23% on a monthly basis. On a yearly basis, platinum remained as the biggest loser with 8% decline.\n\nThe recent sell-off in the precious metals market has again changed the gold-silver ratio, which has climbed to the highest level since December. It means that now it takes more ounces of silver to purchase the same measure of gold.\n\n\u201cThe divergence underscores silver\u2019s continued vulnerability relative to gold, which continues to attract demand from investors less sensitive to interest-rate developments,\u201d Bloomberg quoted Ole Hansen of Saxo Bank.", "source": "LiveMint Markets", "pub_date_str": "01 Nov 2026, 09:54 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Fixed Income", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Technology funds delivered 6.3% returns in October, while no other category crossed 1%: Here\u2019re the top performing funds", "full_content": "Technology mutual funds emerged as the best-performing equity mutual fund category in October 2026, delivering an average return of 6.29%, while no other mutual fund category managed to cross the 1% mark. The strong performance put technology-focused schemes ahead of other equity categories during the month, although returns varied considerably across individual funds.\n\nOf the 13 technology funds considered, HDFC Technology Fund delivered the highest return at 11.54%. Kotak Technology Fund and ICICI Prudential Technology Fund followed with gains of 8.86% and 8.22%, respectively.\n\nHowever, the rally was not uniform. Motilal Oswal Digital India Fund was the only scheme to post a negative return, declining 2.72% in October. Quant Teck Fund delivered a relatively modest 1.67% return.\n\nHDFC Technology Fund topped the list of technology mutual funds , delivering an 11.54% return in October. The scheme had assets under management (AUM) of \u20b9 1,371 crore as of 1 November 2026, according to Value Research data.\n\nKotak Technology Fund, with an AUM of \u20b9 479 crore, delivered an 8.86% return. ICICI Prudential Technology Fund, the largest scheme in the list with an AUM of \u20b9 12,505 crore, gained 8.22%.\n\nTata Digital India Fund and SBI Technology Opportunities Fund also delivered strong returns of 7.99% and 7.91%, respectively. Their AUM stood at \u20b9 9,276 crore and \u20b9 4,155 crore.\n\nFranklin India Technology Fund returned 7.65% in October, with an AUM of \u20b9 1,623 crore. WhiteOak Capital Digital Bharat Fund gained 7.03%, while Invesco India Technology Fund delivered 6.68%. Their respective AUMs stood at \u20b9 510 crore and \u20b9 317 crore.\n\nAditya Birla Sun Life Digital India Fund returned 6.51%, with an AUM of \u20b9 3,617 crore.", "source": "LiveMint Money", "pub_date_str": "01 Nov 2026, 09:47 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Everything changed for the oil, AI and bond trades over the past month", "full_content": "If there was one safe bet over the course of 2026, it was that treasury yields would rise alongside a move up in oil futures contracts. Over the past month, that ended, and according to Jeffrey Rosenberg, senior portfolio manager of the Systematic Alternatives ETF ( IALT ) at BlackRock, the world's largest asset manager, the breakdown in that trade has big implications for the market.\n\n\"Oil and treasury yields had this amazing correlation and in October it just stopped,\" Rosenberg said on the most recent CNBC \"ETF Edge.\"\n\nThe relationship between oil and bond yields was featured in Federal Reserve Chair Kevin Warsh's FOMC press conference on Wednesday, with Warsh noting how oil futures have continued to rise, a factor the central bank must consider in its fight against inflation. But Rosenberg said what Warsh didn't talk about was \"the most important takeaway.\"\n\n\"Treasuries and oil had an 80% correlation this year,\" Rosenberg said, which is \"outsize\" relative to normal correlations. \"We've basically been trading off oil for good reason.\" \"\n\nOil futures contract one-month performance. What happened? Rosenberg says you can sum it up by looking to the deflated AI trade. As the market moved away from that oil-treasuries trading correlation in October, \"It told us something important,\" he said. \"In the market's mind, the geopolitical risk is secondary to AI risk,\" he said.\n\nOver the past month \u2014 which became most painfully clear in Friday's Nasdaq market wipeout and, earlier the week, Google's biggest single-day decline in its history, wiping out half a trillion dollars in value \u2014 the AI trade experienced a retracement. Bond yields went lower, Rosenberg says, because the market is equating weakness in the AI trade as a broader weakness in the U.S. economy. And he said, last week's GDP report backed up that thinking. \"AI is everything, everywhere, all the time,\" he said.", "source": "CNBC Top News", "pub_date_str": "01 Nov 2026, 09:28 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Quantitative Methods", "Economics", "Equity Investments", "Fixed Income", "Derivatives", "Portfolio Management"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "19% Credit vs 10% GDP: Prof Flags Inflation>Rupee Risk, Urges RBI To Rein In Bank Credit", "full_content": "Bank credit growth has reached 19.1%, significantly exceeding nominal GDP growth of approximately 10-11%. ISB professor Prasanna Tantri has warned that the widening gap could fuel inflationary pressures.", "source": "NDTV Profit", "pub_date_str": "01 Nov 2026, 09:28 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Voice cloning scams: How to protect yourself from audio deepfakes - Mashable", "full_content": "Voice cloning scams: How to protect yourself from audio deepfakes Mashable Column: Cybersecurity in the age of AI Bend Bulletin AI agents are helping criminals to commit cyber crimes more cheaply and efficiently, say experts The National Fake resumes, fake employees: AI amplifying fraud at 'staggering' rate, security watchers warn National Post AI chatbots might direct you to ghost store scams Pickr", "source": "Google News Business", "pub_date_str": "01 Nov 2026, 09:23 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Emami vs Dabur FMCG shares Q2 results preview: Profit, revenue expectations; Dividend announcements in focus", "full_content": "DABUR DIVIDEND Sharmila Bhadoria Updated 1 Nov 2026, 09:01 PM IST Prefer Livemint on Google Emami vs Dabur India : Two of the biggest names in the fast moving consumer durables goods (FMCG) space, Emami Limited, are set to announce their quarterly earnings this week. While Emami is likely to see healthy revenue growth, Dabur India may see double digit revenue growth during the quarter.\n\nBoth the FMCG giants are also expected to announce a dividend alongside their Q2FY27 results. Here are all the details to know.\n\nEmami\u2019s board of directors meeting is scheduled to meet on Thursday, November 5, to announce quarterly earnings. The board may also consider and declare interim dividend for FY27. Dabur India is set to announce Q2 results on Wednesday, November 4. The board may also consider and announce interim dividend for FY27.\n\nWhile Emami is expected to see a 20% annual jump in revenue, Dabur India may see 11% annual revenue growth, as per HDFC Securities report.\n\n\u201cWe expect gross margin contraction of 380bps YoY to 67.3% YoY. EBITDA margin is likely to see 240bps contraction to 20%. EBITDA is likely to grow by 7% YoY, while adj PAT should grow 4% YoY,\u201d stated HDFC Securities in its report.\n\nEmami\u2019s adjusted profit after tax (PAT) growth is likely to remain close to 4%, Dabur India may see 9% jump in adjusted PAT.\n\nDabur India\u2019s \u201cgross margin is likely to see contraction of 140bps YoY to 48%. We see EBITDA margins at ~18% YoY, down 50bps YoY. EBITDA and adjusted PAT is likely to see growth of 8% and 9%, respectively,\u201d read HDFC Securities report.\n\nDabur India\u2019s share price closed 0.85% lower at \u20b9 366 per share on BSE with a market capitalisation of \u20b9 65,175.18 crore on Friday. The FMCG stock value has declined 13.99% in three months, 26.81% in 2026 so far, and around 27% in one year.", "source": "LiveMint Markets", "pub_date_str": "01 Nov 2026, 09:00 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Devyani-Sapphire Merger Gets CCI Nod: KFC India, Pizza Hut Ops Unify Under QSR Powerhouse", "full_content": "The CCI clears the proposed merger, bringing the KFC and Pizza Hut franchise operations of both companies under a common corporate structure, subject to other regulatory formalities.", "source": "NDTV Profit", "pub_date_str": "01 Nov 2026, 08:58 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Corporate Issuers", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Social Security may have to cut retirement benefits in six years. Here's how much money is at stake for beneficiaries", "full_content": "Social Security retirement benefits may face an automatic, across-the-board cut in just six years .\n\nWithout intervention before then, the Social Security retirement trust fund, formally known as the Old-Age and Survivors Insurance Trust Fund, which helps pay benefits to eligible workers and qualifying family members, will run out in the fourth quarter of 2032, the program's trustees said in a June report .\n\nAt that time, the trustees project retirement benefits will be cut by 22%.\n\nThe Congressional Budget Office has a more dire forecast, anticipating the retirement trust fund may run out sooner, in mid-2032, and that retirees may see larger benefit cuts, at 26%, upon insolvency.\n\nBeneficiaries may see an average $500 cut to their monthly benefits across the U.S. based on a 24% benefit cut, according to a June report from the Committee for a Responsible Federal Budget. In 29 states, retirees would see even bigger average reductions, according to the nonpartisan organization focused on educating the public on fiscal policy issues.\n\nSenators elected this November will be in office in 2032, when the retirement trust fund depletion date hits. Their ability to right the ship is crucial for retirees and the economy. But it's not a sure thing given the political climate inside the beltway.\n\n\"The attention on 2032 is appropriate in the sense that that is when beneficiaries and future beneficiaries will see and feel the consequences of inaction,\" said Shai Akabas, vice president of economic policy at the Bipartisan Policy Center, a public policy think tank focused on promoting bipartisan cooperation.\n\n\"Nothing gets Congress to move like that type of deadline,\" he said.", "source": "CNBC Top News", "pub_date_str": "01 Nov 2026, 08:48 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics", "Corporate Issuers"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Government Bond Yields May Ease To 6.75%-7% By March 2027 Despite Potential RBI Rate Hike: Report", "full_content": "SBI Research estimates an excess supply of around Rs 1.52 lakh crore in the Indian government bond market.", "source": "NDTV Profit", "pub_date_str": "01 Nov 2026, 08:46 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Apple\u2019s new earnings era begins at a critical time for Big Tech", "full_content": "A rare Monday earnings report for Apple will give investors a glimpse into how new CEO John Ternus is managing inflated memory prices and a tougher backdrop for consumer spending.", "source": "MarketWatch Top Stories", "pub_date_str": "01 Nov 2026, 08:30 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "OPEC+ keeps December oil output targets steady ahead of tougher call for 2027", "full_content": "OPEC+ oil-producing countries kept December \u200bproduction targets steady on Sunday, confirming \u200bexpectations that no further policy adjustments will occur until next year, as the group continues to struggle with export disruptions from the Iran war.\n\nSeven core OPEC+ members \u2014 Saudi Arabia, Russia, Iraq, Kuwait, Algeria, Kazakhstan and Oman \u2014 made the decision in an online \u2060meeting \u200con Sunday, OPEC said in a statement. While Gulf members have been boosting exports disrupted for months by the conflict, most are still pumping well below their targets.\n\nOPEC+ comprises the Organization of the Petroleum Exporting Countries and allies including Russia. Only the seven members \u2014 plus the United Arab Emirates until \u200cit quit OPEC in May \u2014 have been involved in monthly output decisions in recent years. All members of the 21-country group are due to meet on November 29, when analysts \u200bexpect it will decide 2027 quotas.\n\n\"Today's decision was the easy one,\" said Jorge Leon, an analyst at Rystad. \"The much more important test comes at the Nov. 29 ministerial meeting, when OPEC+ will decide its 2027 production framework.\"\n\nOil prices jumped more than 2% on Friday, with \u2060Brent crude settling at almost $118 a barrel, the highest since April, as traders braced for a potential escalation in the Iran war \u200cafter the US midterm elections.\n\nThe International Energy Agency and other \u200cforecasters have warned of excess supply in 2027 should Gulf flows return to normal.\n\n\"OPEC+ faces an extremely difficult call for 2027,\" Leon added. \"The group has to plan around huge uncertainty over the US-Iran war, the pace of recovery through the \u2060Strait of Hormuz, and the size of the surplus that could emerge once disrupted barrels return.\"\n\nThe seven members have been boosting output targets for much of 2026 and, in September, completed the phased rollback of a 1.65 million-barrel-per-day supply cut first agreed in 2023. At earlier meetings, they kept the targets steady for \u200bOctober and November.", "source": "CNBC Top News", "pub_date_str": "01 Nov 2026, 08:29 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "October Auto Sales Live Updates: Eicher Motors' October Sales Rise 7%; Exports Jump 47%", "full_content": "Automakers release October sales figures, offering clues on festive demand, rural consumption, export growth and industry trends.", "source": "NDTV Profit", "pub_date_str": "01 Nov 2026, 08:26 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Going abroad for a holiday? How to split your travel budget between cash, forex cards and credit cards to save money", "full_content": "Planning an international holiday involves more than booking flights and hotels. Indian travellers also need to decide how much foreign currency to carry, whether to load money onto a prepaid forex card or use an international credit card, and how much cash to keep for emergencies. Choosing the wrong payment method can increase the cost of a trip through currency conversion markups, ATM withdrawal fees and other charges.\n\nA practical approach is to spread travel money across different payment options rather than depend entirely on cash or a single card. While cash remains useful for small purchases and local transport, cards offer convenience for hotel bookings, shopping and restaurant bills.\n\nSai Shankar, Chief Business Officer at Niyo Forex, recommends keeping 10-20% of the travel budget in physical cash, making 60-70% available through cards and retaining another 10-20% as a backup reserve. These are indicative allocations rather than fixed rules, and travellers should adjust them based on their destination, trip duration and spending habits.\n\nThere is no universal formula for dividing an international travel budget. The payment mix depends on the country being visited, how long the traveller plans to stay and whether local merchants widely accept cards.\n\nAccording to Shankar, travellers can use the following indicative allocation as a starting point:\n\nThe allocation should also reflect the destination's payment infrastructure. Travellers visiting countries where cash remains widely used may need to carry more physical currency. In card-friendly destinations, they can rely more on electronic payments.\n\n\"Cash is useful for small purchases, tips, local transport and merchants that do not accept cards,\" Shankar said. He also recommends carrying at least two independent payment options rather than depending on a single card.\n\nA prepaid forex card is not necessarily cheaper than an international credit or debit card.", "source": "LiveMint Money", "pub_date_str": "01 Nov 2026, 08:20 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Fixed Income", "Derivatives", "Alternative Investments"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "I'm a psychologist who studies couples: People in the happiest relationships do 1 thing differently after time apart\u2014whether it's hours, days or weeks", "full_content": "There's a two-minute window every evening when couples can either strengthen their bond with each other or unknowingly weaken it.\n\nIn my experience as a psychologist who studies couples, what separates the happy couples from the unhappy ones isn't necessarily how often they argue or how much time they have together. It's whether the two people are genuinely in contact with each other's lives.\n\nPartner
