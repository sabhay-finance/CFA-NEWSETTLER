bark on a \u2018face-ripper rally\u2019 as soon as this morning", "full_content": "Bull markets don\u2019t peak when investors are so bearish, says Fundstrat\u2019s Tom Lee.", "source": "MarketWatch Top Stories", "pub_date_str": "11 Sep 2026, 07:00 PM IST", "pub_date_relative": "5m ago"}, {"title": "I went to a dinner party, brought an appetizer and wine \u2014 and the host charged me $60. Should I cut ties with her?", "full_content": "\u201cAm I right to think this is pretty cheap and rude?\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "11 Sep 2026, 06:58 PM IST", "pub_date_relative": "7m ago"}, {"title": "Houthis reportedly advance to key Red Sea island, further threatening crucial oil choke point", "full_content": "The Iran-backed Houthis reportedly advanced to Yemen's strategic Perim Island on Friday, delivering a major boost to the militant group's push to take control of one of the world's most important shipping choke points.\n\nThe capture of Perim Island, which was reported by several news agencies, citing multiple Yemeni government sources, comes just one day after the Houthis seized Yemen's port city of Mokha on the Red Sea coast. CNBC could not independently confirm the report.\n\nThe rapid ground offensive is seen as a severe setback to Saudi Arabia and the Yemeni forces it backs and puts Iran and its proxies on course to exercise control over two critically important oil choke points on either side of the Arabian Peninsula: the Bab el-Mandeb Strait and the Strait of Hormuz .\n\nPerim Island is a small and rocky area of land that divides the Bab el-Mandeb Strait, a waterway that connects the Red Sea to the Gulf of Aden and to global markets.\n\nThere are concerns that the Houthis advance toward the Bab el-Mandeb Strait could have significant ramifications for global trade, particularly if the militant group ratchets up threats or attacks on Red Sea shipping.\n\nIndeed, the capture of Mokha marked a \"major blow\" to Saudi Arabia as it raises the possibility of the group exerting a tighter grip on the Bab el-Mandeb Strait, according to Hamish Kinnear, principal Middle East and North Africa analyst at risk intelligence company Verisk Maplecroft.\n\nYemen's port city of Mokha is situated about 75 kilometers (46 miles) north of the Bab el-Mandeb Strait.\n\n\"The Houthis were already threatening Saudi shipping from previous positions, but their capture of Mocha opens up the possibility of further advances towards the Bab el-Mandeb coastline and a tighter grip on the chokepoint,\" Kinnear said in a research note.", "source": "CNBC Top News", "pub_date_str": "11 Sep 2026, 06:52 PM IST", "pub_date_relative": "12m ago"}, {"title": "Bond markets stabilise after global sell-off", "full_content": "Decline in oil prices helps calm investor nerves but German borrowing costs hit highest level since 2009", "source": "FT Markets", "pub_date_str": "11 Sep 2026, 06:52 PM IST", "pub_date_relative": "12m ago"}, {"title": "MahaRERA orders developer to refund homebuyers: 7 checks to make before booking a flat", "full_content": "The Maharashtra Real Estate Regulatory Authority (MahaRERA) has directed a developer to refund amounts that buyers were able to establish they had paid for flats, along with applicable interest.\n\nThe case serves as an important reminder for homebuyers : an allotment letter or a RERA registration number does not automatically mean that the particular flat you are buying has been approved for construction.\n\nThe dispute involved the Swami Krupaa project, where buyers had booked flats on the sixth and seventh floors. However, the Commencement Certificate (CC) on record permitted construction only up to the fifth floor. The buyers said they were assured that approvals for the additional floors would be obtained later.\n\nAccording to the MahaRERA order, the CC dated October 22, 2010, permitted construction only up to the fifth floor. Despite this, the buyers had allotment letters for Flat 603 on the sixth floor and Flat 703 on the seventh floor.\n\nThe buyers said they booked the flats after being told that the necessary approvals for the additional floors would be secured subsequently.\n\nThe order also noted that architect certificates issued in 2017 and 2019 did not show progress on the upper floors. No later approvals or relevant architect certificates were produced to establish that construction on the sixth and seventh floors had received the required sanction.\n\nFor a homebuyer, the takeaway is simple: don't just ask whether a project has a Commencement Certificate. Check what the certificate actually allows the developer to build.\n\nMore importantly, make sure the specific floor and flat you are being offered are part of the sanctioned construction.", "source": "LiveMint Money", "pub_date_str": "11 Sep 2026, 06:51 PM IST", "pub_date_relative": "13m ago"}, {"title": "Helus Pharma at Cantor conference: phase III readout in focus", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Sep 2026, 06:50 PM IST", "pub_date_relative": "14m ago"}, {"title": "FingerMotion reports $5.1M cash, cuts monthly burn by 30%", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Sep 2026, 06:50 PM IST", "pub_date_relative": "15m ago"}, {"title": "Stocks, bonds rally after August inflation report", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Sep 2026, 06:50 PM IST", "pub_date_relative": "15m ago"}, {"title": "Mexico, Washington sprint toward bilateral trade deal before US elections", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Sep 2026, 06:49 PM IST", "pub_date_relative": "15m ago"}, {"title": "Vanda Pharmaceuticals at Cantor conference: psychiatry push takes center stage", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Sep 2026, 06:49 PM IST", "pub_date_relative": "16m ago"}, {"title": "Bond yields near multi-year peaks after accelerating U.S. inflation  now trading 106% higher, showing its latest ability from sustained losses.\n\nThe sharp rally in September came after the company announced the launch of a new business vertical, marking its entry into food emulsifiers, agribusiness and agri-sourcing.\n\nThe Food Emulsifier & Agro Division will focus on food emulsifiers, agri-sourcing and processing, including agrochemicals, to supply the company's restaurant, quick-service restaurant (QSR) and live-events business, Xora World. The division will also independently serve hotels, QSR chains and food processing units as a B2B food emulsifier and ingredient supplier.\n\nThe company expects the targeted verticals across food emulsifiers and agro- and agrochemical products to have a revenue potential of approximately \u20b9 1,200 crore.", "source": "LiveMint Markets", "pub_date_str": "11 Sep 2026, 06:45 PM IST", "pub_date_relative": "20m ago"}, {"title": "Jim Cramer's top 10 things to watch in the stock market Friday", "full_content": "Stocks are still looking at a higher open after consumer inflation, excluding food and energy prices, came in hotter than expected.", "source": "CNBC Top News", "pub_date_str": "11 Sep 2026, 06:44 PM IST", "pub_date_relative": "21m ago"}, {"title": "India's forex reserves surge $44.9 billion to record $785.7 billion, fourth largest globally", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Indicators \u203a India's forex reserves surge $44.9 billion to record $785.7 billion, fourth largest globally The Economic Times daily newspaper is available online now. Read Today's Paper India's forex reserves surge $44.9 billion to record $785.7 billion, fourth largest globally SECTIONS India's forex reserves surge $44.9 billion to record $785.7 billion, fourth largest globally By Atmadip Ray , ET Bureau Last Updated: Sep 11, 2026, 06:43:00 PM IST Rate Story efty amount of debt the company has raised to fund its artificial intelligence infrastructure buildout.\n\nOracle shares since the beginning of the year. Oracle delivered an additional 850 megawatts of data center capacity in the quarter. It also booked over $30 billion in further AI cloud contracts, and delivered more than 300,000 graphics processing units to its AI Cloud customers.\n\nThe company guided to second-quarter revenue growth of 30% to 34%, with cloud revenue rising between 64% and 70%. It expects total revenue for the 2027 fiscal year to be at least $90 billion.\n\nAlongside selling its flagship database software, Oracle has taken on more than $100 billion in debt as it funds an expansive buildout of data centers for AI workloads. The investment is expected to expand capacity for contracted cloud demand from customers including Nvidia, Meta, OpenAI, Advanced Micro Devices and SpaceX's AI business.\n\nCiti analysts reiterated their buy rating in a Friday note, saying Oracle had met expectations and \"cleared the runway\" for its upcoming investor day.", "source": "CNBC World Economy", "pub_date_str": "11 Sep 2026, 07:04 PM IST", "pub_date_relative": "just now", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Bond markets stabilise after global sell-off", "full_content": "Decline in oil prices helps calm investor nerves but German borrowing costs hit highest level since 2009", "source": "FT Markets", "pub_date_str": "11 Sep 2026, 06:52 PM IST", "pub_date_relative": "12m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "MahaRERA orders developer to refund homebuyers: 7 checks to make before booking a flat", "full_content": "The Maharashtra Real Estate Regulatory Authority (MahaRERA) has directed a developer to refund amounts that buyers were able to establish they had paid for flats, along with applicable interest.\n\nThe case serves as an important reminder for homebuyers : an allotment letter or a RERA registration number does not automatically mean that the particular flat you are buying has been approved for construction.\n\nThe dispute involved the Swami Krupaa project, where buyers had booked flats on the sixth and seventh floors. However, the Commencement Certificate (CC) on record permitted construction only up to the fifth floor. The buyers said they were assured that approvals for the additional floors would be obtained later.\n\nAccording to the MahaRERA order, the CC dated October 22, 2010, permitted construction only up to the fifth floor. Despite this, the buyers had allotment letters for Flat 603 on the sixth floor and Flat 703 on the seventh floor.\n\nThe buyers said they booked the flats after being told that the necessary approvals for the additional floors would be secured subsequently.\n\nThe order also noted that architect certificates issued in 2017 and 2019 did not show progress on the upper floors. No later approvals or relevant architect certificates were produced to establish that construction on the sixth and seventh floors had received the required sanction.\n\nFor a homebuyer, the takeaway is simple: don't just ask whether a project has a Commencement Certificate. Check what the certificate actually allows the developer to build.\n\nMore importantly, make sure the specific floor and flat you are being offered are part of the sanctioned construction.", "source": "LiveMint Money", "pub_date_str": "11 Sep 2026, 06:51 PM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Stocks, bonds rally after August inflation report", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Sep 2026, 06:50 PM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Bond yields near multi-year peaks after accelerating U.S. inflation, traders add to Fed hike bets", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Sep 2026, 06:49 PM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "NRx Pharmaceuticals at Cantor conference: ketamine push gains momentum", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Sep 2026, 06:49 PM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "9-day upper circuit: Multibagger small-cap stock surges 55% in September despite weak market", "full_content": "In a month marked by a sharp sell-off triggered by heightened tensions in the Middle East, some small-cap stocks have managed to withstand the selling pressure, with Spice Lounge Food Works being one of them.\n\nThe stock, which has a market capitalisation of less than \u20b9 2,500 crore, was locked in a 5% upper circuit in Friday's trade on September 11, settling at \u20b9 33 apiece. It has been experiencing a similar run since the start of September, closing each trading session at the upper circuit limit.\n\nIt has been locked under the 5% upper circuit in each of the last nine trading sessions . This massive surge in buying interest has pushed its monthly returns to 55.5%, outperforming the Nifty Smallcap 100 index by a wide margin, with the index remaining largely flat over the same period.\n\nMeanwhile, the one-way rally came after the stock remained largely volatile throughout 2026, coming under significant selling pressure after it hit an all-time high in November 2025. Since then, it has attempted several recoveries but surrendered all those gains in the following months, dragging the stock to levels of around \u20b9 16 in May.\n\nConsidering those lows, the stock is now trading 106% higher, showing its latest ability from sustained losses.\n\nThe sharp rally in September came after the company announced the launch of a new business vertical, marking its entry into food emulsifiers, agribusiness and agri-sourcing.\n\nThe Food Emulsifier & Agro Division will focus on food emulsifiers, agri-sourcing and processing, including agrochemicals, to supply the company's restaurant, quick-service restaurant (QSR) and live-events business, Xora World. The division will also independently serve hotels, QSR chains and food processing units as a B2B food emulsifier and ingredient supplier.\n\nThe company expects the targeted verticals across food emulsifiers and agro- and agrochemical products to have a revenue potential of approximately \u20b9 1,200 crore.", "source": "LiveMint Markets", "pub_date_str": "11 Sep 2026, 06:45 PM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Jim Cramer's top 10 things to watch in the stock market Friday", "full_content": "Stocks are still looking at a higher open after consumer inflation, excluding food and energy prices, came in hotter than expected.", "source": "CNBC Top News", "pub_date_str": "11 Sep 2026, 06:44 PM IST", "pub_date_relative": "21m ago", "cfa_topics": ["Economics", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "India's forex reserves surge $44.9 billion to record $785.7 billion, fourth largest globally", "full_content": "Home ETPrime Market s are higher before the bell. All three major averages closed Thursday's session lower.\n\nHere are five key things investors need to know to start the trading day:\n\nInvestors are heading into the final trading day of the week with inflation, oil prices and the Federal Reserve all in focus. The consumer price index , which is the Fed's last major inflation reading before its rate decision next week, showed prices continued to rise in August.\n\nOracle shares are 7% higher before the bell after the software giant beat earnings expectations and reported that cloud infrastructure revenue more than doubled. Overall revenue grew nearly 30% to $19.35 billion, while cloud revenue jumped 62% to $11.61 billion.\n\nAs Jordan Novet notes, the growth is coming at a steep price. Oracle spent $28.5 billion on capital expenditures last quarter, more than triple the amount it spent a year earlier, as it races to build data centers. Negative free cash flow tallied $5.4 billion, and the company now carries $125 billion in debt.\n\nStill, demand doesn't appear to be slowing. Oracle ended the quarter with $664 billion in remaining performance obligations, a measure of contracted future revenue, and said it signed more than $30 billion in additional AI contracts during the quarter.", "source": "CNBC World Economy", "pub_date_str": "11 Sep 2026, 06:36 PM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Derivatives", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "'Bold leap for two economic powerhouses': EU Ambassador designate hails India FTA moving one step closer to finish line", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a 'Bold leap for two economic powerhouses': EU Ambassador designate hails India FTA moving one step closer to finish line The Economic Times daily newspaper is available online now. Read Today's Paper 'Bold leap for two economic powerhouses': EU Ambassador designate hails India FTA moving one step closer to finish line SECTIONS 'Bold leap for two economic powerhouses': EU Ambassador designate hails India FTA moving one step closer to finish line ANI Last Updated: Sep 11, 2026, 06:37:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The India-EU Free Trade Agreement has moved closer to final approval. The European Commission presented the agreement for approval to the EU Council. This pact will remove or reduce tariffs on ninety-six percent of EU goods. Bilateral trade in goods and services currently exceeds one hundred eighty billion euros annually. The agreement is expected to come into force by late this year or early next.\n\nBigger or Better: One order from Power Grid Corp added $1 billion to the market cap of a company \u2013 Final part\n\nBanks have received a flood of money. Now comes the real test\n\nSeason of change in accounting policy: A simple AI prompt can tell you a lot\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "11 Sep 2026, 06:33 PM IST", "pub_date_relative": "31m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "NSE diversification could weigh on weekly options' revenue, CEO says", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a NSE diversification could weigh on weekly options' revenue ancial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "US consumer inflation picks up in August, up 3.4% YoY", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a US consumer inflation picks up in August, up 3.4% YoY Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US consumer inflation picks up in August, up 3.4% YoY SECTIONS US consumer inflation picks up in August, up 3.4% YoY Reuters Last Updated: Sep 11, 2026, 06:30:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis In August, consumer prices in the U.S. surged, mainly due to increasing gasoline prices. This trend elevates the likelihood of an interest rate hike by the Federal Reserve, with economists predicting a monthly rise in the consumer price index of 0.4%. When excluding food and energy, the core consumer price index saw a 0.3% rise, leading to a market expectation of a 70% chance for a 25-basis-point hike.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "11 Sep 2026, 06:27 PM IST", "pub_date_relative": "37m ago", "cfa_topics": ["Economics", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Inflation persisted in August, potentially locking in a Fed interest rate hike", "full_content": "Prices for a wide swath of goods and services continued to climb in August, according to a report Friday that raises the specter of a Federal Reserve interest rate hike next week.\n\nThe consumer price index rose a seasonally adjusted 0.4% for the month, putting the 12-month increase at 3.4%, the Bureau of Labor Statistics reported Friday. Both readings were in line with the Dow Jones consensus.\n\nHowever, stripping out volatile food and energy prices, core CPI posted a 0.3% monthly gain, or 0.1 percentage point higher than forecast. The core annual rate came in at 2.4%, in line with the estimate.\n\nThe report is the final major inflation indicator the Fed will see before it holds its policy meeting next week, concluding Wednesday with a vote on its key interest rate.\n\nTraders responded to the numbers by ramping up bets that the Federal Open Market Committee will increase its benchmark interest rate by a quarter percentage point. Odds for a hike jumped to about 90%, according to the CME Group's FedWatch tracker of fed funds futures prices.\n\nEnergy propelled the headline number higher, as gasoline prices jumped 3.9%, accounting for more than one-third of the index's gain. The energy index broadly rose 2.1% amid pressure from escalating tensions in the Middle East and was up 16.3% from a year ago.\n\nFood prices edged 0.1% higher as food at home costs held flat. The food index accelerated 2.7% annually.\n\nAnother significant factor was a 0.3% climb in shelter costs, which had moderated over the prior two months. Transportation services saw a 0.5% increase. Used cars and trucks rose 0.4% and new vehicle prices were up 0.3%, part of what appeared to be broad-based gains for the index.", "source": "CNBC Top News", "pub_date_str": "11 Sep 2026, 06:27 PM IST", "pub_date_relative": "37m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Derivatives", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "US inflation held steady at 3.4% in August as high fuel prices persist", "full_content": "Figure prompts traders to increase bets on Fed rate rises ahead of high-stakes meeting", "source": "FT Markets", "pub_date_str": "11 Sep 2026, 06:25 PM IST", "pub_date_relative": "40m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "How Oracle shook off fears about AI spending, sending its stock higher", "full_content": "\u201cSeveral of Oracle\u2019s bear cases were addressed head on\u201d in the latest earnings report, according to an analyst.", "source": "MarketWatch Top Stories", "pub_date_str": "11 Sep 2026, 06:22 PM IST", "pub_date_relative": "43m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Small cap stock: Exporter of stainless-steel washers entering electronic materials space - Choice says buy; target price", "full_content": "Shares of Ratnaveer Precision Engineering ended 7% lower after a rally. Analysts foresee a 27.8% upside, bolstered by a recent rights issue and improving fundamentals. The stock closed at \u20b9288.5, with a target price of \u20b9388 for twelve months.", "source": "LiveMint Markets", "pub_date_str": "11 Sep 2026, 06:15 PM IST", "pub_date_relative": "49m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}], "updated_at": "11 Sep 2026, 07:05 PM IST", "total_stories": 395};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>

</body>
</html>
