am feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "06 Nov 2026, 11:51 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Pensioners Must Submit Life Certificate By November 30: What Happens If You Miss The Deadline?", "full_content": "Missing the November 30 deadline to submit your Jeevan Pramaan (Digital Life Certificate) can affect your monthly pension payments from December.", "source": "NDTV Profit", "pub_date_str": "06 Nov 2026, 11:50 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "30,000 Counterfeit Gold Flake Cigarettes Seized In Delhi, Probe Underway", "full_content": "The seizure comes as the police intensify operations against the illegal distribution of fake tobacco products in the area.", "source": "NDTV Profit", "pub_date_str": "06 Nov 2026, 11:47 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Gold ETFs performance on Dhanteras 2026 today 6 Nov 2026: Check how Nippon India, Tata Gold, ICICI Prudential fared", "full_content": "null Vaamanaa Sethi Published 6 Nov 2026, 11:39 AM IST Prefer Livemint on Google Dhanteras 2026 : Gold Exchange Traded Funds (ETFs) witnessed selling pressure on Friday, November 6, as investors booked profits in gold-backed investment products despite the auspicious occasion of Dhanteras 2026. Gold ETFs, including Nippon India ETF Gold BeES , Tata Gold ETF and ICICI Prudential Gold ETF , declined by up to 2.3% during the trading session.\n\nThe weakness in gold ETFs came amid a decline in international gold prices, as a rebound in crude oil prices revived inflation concerns and raised expectations that US interest rates could remain elevated for longer. A stronger US dollar also weighed on the yellow metal, limiting its appeal among investors.\n\nGold ETFs across fund houses witnessed selling pressure on Friday, with several schemes declining between 1.5% and 2.3%.\n\nAccording to data available on Groww, ICICI Prudential Gold ETF was among the biggest laggards, falling 2.28% to \u20b9 119.79. Nippon India ETF Gold BeES declined 2.12% to \u20b9 115.65, while Tata Gold Exchange Traded Fund slipped 1.87% to \u20b9 13.63.\n\nOther gold ETFs, including SBI Gold ETF, HDFC Gold ETF, Kotak Gold ETF and DSP Gold ETF, also traded lower.\n\nThe decline in gold ETFs is closely linked to movements in domestic and international bullion prices. Since gold ETFs track the price of physical gold, any correction in the underlying metal generally reflects in their market prices.\n\nInternational gold prices slipped on Friday, November 6, as rising crude oil prices renewed inflation concerns and strengthened expectations of higher interest rates in the US.\n\nAccording to Reuters, spot gold declined 0.6% to $4,063.39 per ounce on Friday. The yellow metal's decline came after a strong recovery earlier in the week, supported by a weaker US dollar and falling US Treasury yields following the US midterm election outcome.", "source": "LiveMint Markets", "pub_date_str": "06 Nov 2026, 11:39 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Beyond gold: What $340 billion in crypto flows says about India's investment preferences this Dhanteras", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Beyond gold: What $340 billion in crypto flows says about India's investment preferences this Dhanteras The Economic Times daily newspaper is available online now. Read Today's Paper Beyond gold: What $340 billion in crypto flows says about India's investment preferences this Dhanteras SECTIONS Beyond gold: What $340 billion in crypto flows says about India's investment preferences this Dhanteras By Prateek Gupta , ET CONTRIBUTORS Last Updated: Nov 06, 2026, 11:37:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Gold remains central to Indian household savings, but high prices are pushing investors toward ETFs and digital gold instead of physical holdings. Crypto is emerging as a separate portfolio option rather than replacing gold, reflecting a broader shift toward digital ownership and diversification.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "06 Nov 2026, 11:37 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "India as an AI hedge? The country's stocks could see robust inflows as markets globally tank", "full_content": "The Indian stock market is emerging as an attractive hedge as investors seek refuge from a brutal sell-off in the artificial intelligence trade, making it a strong contender for global capital.\n\nAs sentiment around AI sours, foreign investors, who have been underweight on the Indian market for nearly two years due to high valuations, subdued earnings growth and lack of local AI tech champions, could start returning.\n\n\"If these foreign long only investor groups were to neutralize their underweight in Indian equities, this could translate into potential net inflows of around $115 billion,\" Rajiv Batra, head of Asia and co-head of global emerging markets equity strategy at JPMorgan, told CNBC.\n\nHe said that multiple factors are currently stacked in favor of the country, such as falling global oil prices, a drop in U.S. Treasury yields, a recovery in earnings growth of Indian companies and unwinding of global AI trade.\n\n\"India has emerged as an 'AI hedge' for portfolios trimming or diversifying out of crowded AI trades,\" Batra said.\n\nOver the last month, the country's benchmark Nifty 50 has gained nearly 9%, outperforming global markets with heavy AI exposure, including the U.S., Japan, South Korea and Taiwan that are deep in the red as investors ditch tech names.\n\nOn Friday, as major Asian markets tracked a sell-off on Wall Street overnight, India's benchmark indexes bucked the trend to trade higher. That divergence becomes stark as Japan's Nikkei 225 and Taiwan's Taiex entered bear territory, while South Korea's Kospi deepened its bear market and the tech-heavy Nasdaq Composite entered into correction territory overnight.\n\n\"India has been dubbed sort of the anti-AI trade, and our view there is that the underlying economic fundamentals have actually been better,\" Timothy Moe, chief Asia-Pacific equity strategist and co-head of Asia macro research at Goldman Sachs, told CNBC's \" Squawk Box Asia \" on Friday.", "source": "CNBC Top News", "pub_date_str": "06 Nov 2026, 11:32 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Fixed Income", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Ark Invest wants to bring some \u2018disruptive innovation\u2019 to interval funds", "full_content": "Tokenised, exchange-traded interval funds with venture capital exposure and hedge fund-level fees. What could go wrong?", "source": "FT Markets", "pub_date_str": "06 Nov 2026, 11:30 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Asian Stocks Brace for Selloff as AI Rout Deepens: Markets Wrap - Bloomberg.com", "full_content": "Asian Stocks Brace for Selloff as AI Rout Deepens: Markets Wrap Bloomberg.com Global stocks tumble as AI panic grips markets after Democrats\u2019 midterm success \u2013 business live The Guardian Asian markets follow US rout as AI investment jitters spread CNN Paraguay President Pe\u00f1a under investigation, faces removal from office over bank collapse AP News Nasdaq sell-off batters Asian chip stocks as SK Hynix, Samsung, Softbank, TSMC tumble CNBC", "source": "Google News Business", "pub_date_str": "06 Nov 2026, 11:27 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments", "Ethical & Professional Standards"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Dhanteras 2026 gold buying race: 10 cities in India where yellow metal is a religion \u2013 Is your city on the list?", "full_content": "Gold buying is deeply woven into India's festive traditions, particularly during Dhanteras and Diwali, when households purchase jewellery, coins, and other precious-metal items as symbols of prosperity and good fortune.\n\nFrom Chennai and Kochi in the south to Kolkata in the east and Jaipur in the north, several cities have established gold markets and strong jewellery-buying cultures. However, this year\u2019s Dhanteras buying comes amid volatile gold prices. On 6 November, gold is currently priced at \u20b9 1,42,390 per 10 grams, down \u20b9 2,070, or 1.43%, as of 10:50 am, according to Bullions.co.in .\n\nIn its November 2026 report, the World Gold Council (WGC) mentioned that domestic gold prices were around 45% higher year-on-year in the third quarter (July-September 2026). This weighed on jewellery demand, which fell 20% year-on-year to 100 tonnes, its weakest third-quarter level since 2020.\n\nAccording to search data from local search platform Justdial , reported by 7Globe , searches for gold jewellery increased 46% in India between November 2025 and October 2026 compared with the corresponding period a year earlier. Here are 10 Indian cities with established gold-buying traditions and jewellery markets.\n\nChennai's T. Nagar and NSC Bose Road are prominent jewellery shopping destinations. Traditional 22-carat jewellery, temple designs, and wedding purchases contribute to the city's gold-buying culture. Gold jewellery searches increased 36% during the November 2025 and October 2026 period tracked by Justdial.\n\nLaad Bazaar, Begum Bazaar and Basheerbagh are among Hyderabad's established jewellery markets. Traditional ornaments and wedding jewellery remain important purchases. Gold jewellery searches increased by 54%.\n\nBroadway and MG Road are important shopping destinations in Kochi.", "source": "LiveMint Money", "pub_date_str": "06 Nov 2026, 11:24 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Dhanteras 2026: Best time to buy gold, silver in Kochi, Thrissur; latest purchase rate today- Shopping Shubh Muhurat", "full_content": "The nation is celebrating Dhanteras today, Friday, 6 November. This is a special day that presents an auspicious occasion and opportunity for households in Kerala to purchase gold, silver jewellery, coins and utensils.\n\nPurchasing gold during this auspicious period is considered an important tradition during \u2018Dhantrayodashi \u2019; hence, buyers of the yellow metal in Kochi and Thrissur should check the latest prices, auspicious muhurat and shopping timing details before visiting jewellery stores.\n\nAccording to details on the MyPanchang website, a prominent platform that provides city-specific information and Panchang calculations by Panchangkarta, the Dhanteras Pradosh Kaal with Sthira Lagna in Kochi is from 6:35:44 PM to 8:27:33 PM. In Thrissur, the corresponding period is from 6:35:01 PM to 8:27:14 PM.\n\nHere are the favourable shopping windows for Kochi on 6 November, according to city-specific Choghadiya calculations, as provided on the Apna Panchang platform .\n\nThese shopping windows are separate from the evening Lakshmi-Kuber Puja. Timings can vary slightly across Panchang calculations; hence, cross-checking with legitimate sources is advised.\n\nGold prices in both cities are around \u20b9 13,386 per gram for 22-carat jewellery, according to the 6 November rate updates on BankBazaar . The table below shows the price comparison.\n\nNote: These are indicative rates only. They may change during the day. Jewellery buyers should also account for making charges, other associated expenses, wastage and 3% GST while calculating the final bill.\n\nBuyers should compare jewellery prices, check hallmarking details and metal purity before making any investment or purchase.", "source": "LiveMint Money", "pub_date_str": "06 Nov 2026, 11:23 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Dhanteras 2026 date and time today for gold, silver purchase: Shubh muhurat for buying precious metals on auspicious day", "full_content": "Dhanteras 2026 is being celebrated on Friday, November 6, and many households are preparing to purchase gold, silver, jewellery and other valuables on the occasion. Considered an auspicious day to welcome wealth and prosperity, Dhanteras marks the beginning of the five-day Diwali festival.\n\nFor those planning to buy precious metals today, knowing the shubh muhurat, or auspicious buying window, can help with shopping plans. According to Drik Panchang, the gold-buying muhurat begins at 10.30 am on November 6 and continues until 6.37 am on November 7.\n\nThe festival is also known as Dhantrayodashi. It falls on the 13th lunar day, or Trayodashi Tithi, of Krishna Paksha in the Hindu month of Kartik. The Trayodashi Tithi begins at 10.30 am on November 6 and ends at 10.47 am on November 7, according to Drik Panchang.\n\nMany families also prefer to complete their shopping before the evening Lakshmi-Kubera Puja so that they can place their new purchases before the deities during the rituals.\n\nHowever, auspicious timings may vary across locations because of differences in local sunrise and sunset timings.\n\nBuying precious metals on Dhanteras is a long-standing tradition in India. The festival is associated with the worship of Goddess Lakshmi, the deity of wealth and prosperity. Purchasing gold is believed to invite good fortune and abundance into the household.\n\nGold is considered a symbol of purity, prosperity and durability. Gold coins, bars and jewellery are among the popular purchases made on the occasion. The metal is also traditionally regarded as a store of wealth that can be preserved and passed down through generations.\n\nSilver is another popular choice, particularly for households looking for a more accessible precious-metal purchase. People buy silver coins, jewellery and utensils such as plates and glasses.", "source": "LiveMint Money", "pub_date_str": "06 Nov 2026, 11:22 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "US midterm results impact: \u20b94 lk cr added! Sensex soars 2700 pts, Nifty up 3% in 2 days - Strategy and stocks to buy", "full_content": "OIL null INFY Pranati Deva Published 6 Nov 2026, 11:18 AM IST Prefer Livemint on Google Stock market rally : The Indian stock market extended its winning streak to seven consecutive sessions on Friday, November 6, defying a sharp global sell-off led by technology stocks. Improving sentiment following the US midterm election results, a steep fall in crude oil prices and renewed foreign institutional investor (FII) buying have supported domestic equities.\n\nThe Sensex rose 734.66 points, or 0.9%, while the Nifty advanced 166 points, or 0.7%, on Friday. In the previous session, the Sensex had surged 2,008 points, or 2.60%, to close at 79,310, while the Nifty gained 576 points, or 2.40%, to settle at 24,536.\n\nIn the 2 sessions combined, Sensex has jumped over 2700 points while Nifty has added over 700 points. Investors added more than \u20b9 4 lakh crore to their wealth over the preceding two sessions.\n\nMoreover, with the latest gains, both benchmark indices have rallied around 9% over seven sessions.\n\nAccording to V K Vijayakumar, Chief Investment Strategist at Geojit Investments Limited, India's relatively limited exposure to the artificial intelligence trade could help it outperform other markets amid the global technology sell-off.\n\n\u201cThe bloodbath in the US markets will impact most other markets today, but India is likely to be the least impacted. The big rout of 5.6% in Nasdaq was triggered on concerns of big slowdown in data centre spending since the Democrats are opposed to massive data centre investment. This tech rout, particularly the sharp deceleration in AI trade will turn out to be beneficial for India,\u201d said Vijayakumar.\n\nIt is important to recognise the fact that this ongoing rally has fundamental support from impressive earnings growth which has come better-than-expected, he added.\n\nThe US midterm election results have emerged as an important trigger for improving global market sentiment.", "source": "LiveMint Markets", "pub_date_str": "06 Nov 2026, 11:18 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Micron stock tanks 17% as AI chip selloff deepens: What's next?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News Powered By Micron stock tanks 17% as AI chip selloff deepens: What's next? Written by Anupam Nagar , ETMarkets.com | Nov 06, 2026, 11:21:01 AM IST 1 / 8 \u200bMicron shares plunge 17% in massive AI chip selloff Micron Technology shares witnessed a massive selloff on November 5, plunging 17.46% to close at $656.39, their lowest level in nearly six months. The stock also touched an intraday low of $650 as investors dumped semiconductor and AI-related stocks amid growing concerns over the outlook for the AI trade. (Sources: TradingKey, Benzinga)\n\nThe latest decline has wiped out a significant portion of Micron     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
