<script>
    // This variable will be injected during the build process
    const allData = {"general": [{"title": "UnitedHealth Group tops estimates, hikes profit outlook as insurer manages high medical costs", "full_content": "UnitedHealth Group on Tuesday posted third-quarter earnings that blew past estimates and raised its full-year profit outlook, as the company continues to manage high medical costs and sees investments in value-based care and artificial intelligence take hold.\n\nThe nation's largest private insurer said it expects fiscal 2026 adjusted earnings of at least $20.50 per share, up from a previous outlook of $19.50 to $20 per share.\n\nThe healthcare giant's turnaround plan is gaining momentum after three consecutive strong quarters this year. UnitedHealth is working to stabilize margins by shrinking membership, exiting unprofitable contracts, and ramping up investments in artificial intelligence and value-based care, which tie doctor and facility compensation to patient health outcomes, quality of care and cost effectiveness rather than the volume of medical services provided.\n\n\"You'll see in the quarter that we continue to execute not only on the financial aspects of our business, but really doing them with a simpler approach and an approach that's really focused on investing heavily in value-based care,\" CFO Wayne DeVeydt said in an interview.\n\nHere's what the company reported for the third quarter compared with what Wall Street was expecting, based on a survey of analysts by LSEG:\n\nThe company posted third-quarter net income of $4.11 billion, or $4.56 per share, compared with $2.35 billion, or $2.59 per share, in the same period a year ago. Excluding items like business divestitures, restructuring and the expected reduction of reserves for unprofitable contracts, UnitedHealth earned $4.69 per share.\n\nRevenue fell to $112.69 billion from $113.16 billion a year earlier.", "source": "CNBC Top News", "pub_date_str": "13 Oct 2026, 08:34 PM IST", "pub_date_relative": "7m ago"}, {"title": "Boeing reports Q3 aircraft deliveries across commercial, defense units", "full_content": "", "source": "Investing.com News", "pub_date_str": "13 Oct 2026, 08:34 PM IST", "pub_date_relative": "7m ago"}, {"title": "ORS acquires Techniweld and janitorial brands from Essendant", "full_content": "", "source": "Investing.com News", "pub_date_str": "13 Oct 2026, 08:34 PM IST", "pub_date_relative": "7m ago"}, {"title": "Goldman Sachs Q3 2026 slides: record advisory fees drive strong beat", "full_content": "", "source": "Investing.com News", "pub_date_str": "13 Oct 2026, 08:34 PM IST", "pub_date_relative": "7m ago"}, {"title": "Bank earnings live updates: AI dominates analyst calls from JPMorgan, Goldman and Wells Fargo", "full_content": "Four of the largest U.S. banks reported third-quarter results on Tuesday: JPMorgan Chase , Wells Fargo , Goldman Sachs and Citigroup .\n\nBank of America and Morgan Stanley will post earnings on Wednesday.\n\nThe quarter was dominated by headlines around artificial intelligence, IPO uncertainty, high fuel prices and rising borrowing costs.\n\nThe banks that reported Tuesday put up mixed results . JPMorgan, the biggest U.S. bank by assets and the largest in the world by market capitalization, posted a rare miss. Goldman Sachs, meanwhile, blew past estimates for revenue and earnings per share, led by strong equities trading.\n\nAnalyst calls for JPMorgan, Goldman Sachs and Wells Fargo all touched on the opportunities and risks associated with AI, citing robust financing demand and operational advantages, but also the threat of rogue agents.\n\nGoldman Sachs CEO David Solomon also addressed recent reports of a CEO transition plan.\n\nSolomon warned that the AI infrastructure boom could face a painful reset if higher borrowing costs or overbuilding undermine the economics of some data center projects.\n\n\"There is going to be a lot of financing to do, and we're going to be in the middle of that,\" Solomon said during the bank's third-quarter call.", "source": "CNBC Top News", "pub_date_str": "13 Oct 2026, 08:33 PM IST", "pub_date_relative": "8m ago"}, {"title": "Fermi stock gets $20 price target at Texas Capital on AMD deal", "full_content": "", "source": "Investing.com News", "pub_date_str": "13 Oct 2026, 08:32 PM IST", "pub_date_relative": "9m ago"}, {"title": "FTC targets Martin Shkreli over pharma stock trading and market commentary", "full_content": "", "source": "Investing.com News", "pub_date_str": "13 Oct 2026, 08:31 PM IST", "pub_date_relative": "10m ago"}, {"title": "Huntington Ingalls Industries stock hits 52-week low at $256.71", "full_content": "", "source": "Investing.com News", "pub_date_str": "13 Oct 2026, 08:31 PM IST", "pub_date_relative": "10m ago"}, {"title": "Citi profit tops estimates on higher investment banking, services and wealth revenue", "full_content": "", "source": "Investing.com News", "pub_date_str": "13 Oct 2026, 08:31 PM IST", "pub_date_relative": "10m ago"}, {"title": "Walmart to offer employees 250-plus medications at no cost in expanded health benefits", "full_content": "", "source": "Investing.com News", "pub_date_str": "13 Oct 2026, 08:31 PM IST", "pub_date_relative": "10m ago"}, {"title": "Stocks fall after bank earnings deluge; chipmakers slide: Live updates - CNBC", "full_content": "Stocks fall after bank earnings deluge; chipmakers slide: Live updates CNBC Strong profit reports from Goldman Sachs and others support Wall Street as chip stocks drop Pittsburgh Post-Gazette Stocks dip on AI jitters, big banks kick off US earnings season Reuters Stock Losses Deepen on AI Trade, Treasuries Rally: Markets Wrap Bloomberg.com S&P 500 set for muted open after big bank earnings, chip slide weighs The Detroit News", "source": "Google News Business", "pub_date_str": "13 Oct 2026, 08:31 PM IST", "pub_date_relative": "11m ago"}, {"title": "Innovative industrial properties\u2019 Alan Gold buys $1m in preferred stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "13 Oct 2026, 08:30 PM IST", "pub_date_relative": "11m ago"}, {"title": "JPMorgan posts rare profit miss as dealmaking, bond trading lose momentum", "full_content": "", "source": "Investing.com News", "pub_date_str": "13 Oct 2026, 08:30 PM IST", "pub_date_relative": "11m ago"}, {"title": "\u2018The house is worth $925,000\u2019: My sister moved in with our mother, 78, and says she deserves the family home. Is she right?", "full_content": "\u201cThe house is worth $925,000 and mom owns it outright. She also has $480,000 in investments.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "13 Oct 2026, 08:30 PM IST", "pub_date_relative": "12m ago"}, {"title": "White House has asked Ambassador Kimberly Guilfoyle to resign, new Trump press secretary says", "full_content": "The White House has asked U.S. Ambassador to Greece Kimberly Guilfoyle to resign, press secretary Katie Zacharia said Tuesday in her debut briefing.\n\n\"We have asked Ambassador Guilfoyle to resign,\" Zacharia said while taking questions from reporters at the White House for the first time.\n\n\"She has been a wonderful asset to the team, and we wish her well,\" Zacharia said of Guilfoyle, whose status has come under an avalanche of scrutiny following multiple critical articles about her conduct before and after becoming an ambassador.\n\nZacharia did not provide additional details. The White House responded to CNBC's request for more information by referring back to Zacharia's comments.\n\nPresident Donald Trump signaled less than a day earlier that Guilfoyle, who was previously engaged to his eldest son, Donald Trump Jr. , could be on the chopping block.\n\n\"Well, we're looking at it,\" Trump said at the White House when a reporter asked if he was weighing firing the ambassador.\n\nAn attorney for Guilfoyle did not immediately respond to CNBC's request for comment on Zacharia's remark.\n\nGuilfoyle's yearlong tenure in Athens was rocked last month by the first of multiple Wall Street Journal articles on conduct that has raised alarms among ethics experts and former government officials.", "source": "CNBC Top News", "pub_date_str": "13 Oct 2026, 08:29 PM IST", "pub_date_relative": "12m ago"}, {"title": "Anthropic to disclose new revenue numbers as AI lab financials become central to tech trade", "full_content": "Anthropic plans to disclose its third-quarter financials for the first time at a meeting with potential investors on Wednesday as the artificial intelligence giant prepares for what could be the largest initial public offering in history.\n\nSan Francisco-based Anthropic will release the numbers to a group of institutional investors, according to two people familiar with the matter, who asked not to be named because the details were confidential.\n\nBloomberg first reported that the meeting was happening. Anthropic declined to comment.\n\nThe meeting comes as revenue numbers from the private AI giants have proven to have an outsized impact on broader markets.\n\nLast week, confusion around a report detailing OpenAI 's revenue and updated accounting dragged down major semiconductor stocks and the broader Nasdaq.\n\nOpenAI shared an updated revenue number of $50 billion with current investors as part of an ongoing fundraise , which was lower than the $70 billion that had been widely reported. The updated number stripped out revenue from cloud partners, and wasn't an indication of changing demand, according to a person familiar with the matter who asked not to be named in order to discuss internal information.\n\nIt's unclear if Anthropic will account for sales in the same manner and include partner revenue, but the numbers this week will give investors a more accurate snapshot of Anthropic's growth and profitability as they look to value the company ahead of an IPO. It will also help Anthropic senior executives and bankers gauge investor interest and weigh the reaction to these updated financials.\n\nAnthropic is plowing ahead with what could be a $2 trillion listing based on its latest reported revenue numbers, which could top $100 billion by the end of this year, according to people familiar with the plans.", "source": "CNBC World Economy", "pub_date_str": "13 Oct 2026, 08:25 PM IST", "pub_date_relative": "16m ago"}, {"title": "Six Flags shares decline following deadly roller coaster incident", "full_content": "Shares of Six Flags Entertainment declined more than 16% Tuesday following a deadly roller coaster incident at one of its amusement parks in Georgia.\n\nOne person died and several others were injured Monday in an incident at Six Flags Over Georgia, according to a statement from Georgia's Cobb County Board of Commissioners. The board's chairwoman, Lisa N. Cupid, said that county authorities are working with Six Flags and other partners in the investigation.\n\nAccording to reports citing local police, the incident occurred on the Atlanta-area park's 200-foot-tall Goliath roller coaster shortly before 4 p.m. Monday. Riders were later seen being evacuated from the roller coaster after it stopped near the top of the ride, according to the report.\n\nWitnesses told a local news station that they saw a man fall from the roller coaster and strike the ride several times.\n\nIn a statement to ABC News, a Six Flags spokesperson said it is cooperating fully with the investigation and had temporarily closed similar attractions across its parks.\n\nSix Flags did not immediately respond to CNBC's request for comment.\n\nTuesday's decline is on pace to be the stock's worst day since August and puts shares at their lowest level since December 2009. Shares have now fallen by more than 50% over the past year.", "source": "CNBC Top News", "pub_date_str": "13 Oct 2026, 08:19 PM IST", "pub_date_relative": "22m ago"}, {"title": "Have a \u20b950 lakh home loan? Check how much your EMI could rise after the RBI rate hike", "full_content": "The Reserve Bank of India (RBI) has raised the repo rate by 25 basis points to 5.50%, marking its first rate hike since February 2023. The decision comes amid inflationary pressures and global uncertainties, with the central bank seeking to balance price stability and macroeconomic conditions.\n\nFor home loan borrowers, the hike could mean higher monthly repayments if banks pass on the increase to lending rates. The impact will depend on the loan amount, repayment tenure, lender and interest rate applicable to the borrower.\n\nFor someone with a \u20b9 50 lakh home loan, the monthly EMI could rise by \u20b9 852 to \u20b9 867 on a 30-year loan, depending on the lender, according to Atul Monga, CEO and co-founder of BASIC Home Loan.\n\nMonga estimates that a 25-basis-point increase would raise the monthly equated monthly instalment (EMI) on a \u20b9 50 lakh home loan with a 30-year tenure by \u20b9 852 at a public sector bank, from \u20b9 34,109 to \u20b9 34,961. At a private bank, the EMI would rise by \u20b9 867, from \u20b9 35,821 to \u20b9 36,688.\n\nRaoul Kapoor, co-CEO of Andromeda Sales and Distribution, said home loan rates of around 7.15% are currently available to eligible borrowers. If the entire 25-basis-point increase is passed on, the rate would rise to 7.40%, increasing the EMI on a \u20b9 50 lakh loan for a 20-year period, from \u20b9 39,216 to \u20b9 39,975.\n\nThe effect extends beyond the monthly repayment. Monga estimates that, over the full 30-year tenure, the additional interest outgo could be approximately \u20b9 3.07 lakh for a public sector bank borrower and \u20b9 3.12 lakh for a private bank borrower, assuming the loan runs for the entire period.\n\nThe actual impact will depend on whether the lender passes on the full rate hike, the interest rate applicable to the borrower and how repayments are adjusted.\n\nThe impact will also vary with the amount borrowed.", "source": "LiveMint Money", "pub_date_str": "13 Oct 2026, 08:16 PM IST", "pub_date_relative": "25m ago"}, {"title": "US banks post strong profits, but inflation and rate risks cloud outlook", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a US banks post strong profits, but inflation and rate risks cloud outlook Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US banks post strong profits, but inflation and rate risks cloud outlook SECTIONS US banks post strong profits, but inflation and rate risks cloud outlook By Somanjali Das , ETMarkets.com Last Updated: Oct 13, 2026, 08:15:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Major US banks reported higher third-quarter profits, supported by resilient consumer spending, AI investment and stronger trading revenue. However, executives warned that persistent inflation, elevated interest rates and geopolitical risks could strain household finances and slow economic growth. JPMorgan Chase missed earnings estimates, while Goldman Sachs, Citigroup and Wells Fargo reported stronger results.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "13 Oct 2026, 08:15 PM IST", "pub_date_relative": "26m ago"}, {"title": "\u2018I am a pretty cautious person\u2019: My financial adviser wants me to invest $350,000 in a UAE data center. Is this risky?", "full_content": "\u201cI like my life, but I also like the idea of a big return after years of putting money into my 401(k).\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "13 Oct 2026, 08:15 PM IST", "pub_date_relative": "27m ago"}, {"title": "\u20b930 per share dividend stock: Do you own this MF share? Check record date to qualify for cash reward; yield, history", "full_content": "ICICI Prudential Asset Management has announced a reward for shareholders, with the country\u2019s one of the largest active mutual fund asset managers declaring an interim dividend of \u20b9 30 per equity share alongside its September quarter results.\n\nOn Monday, the AMC said its board of directors had approved an interim dividend of \u20b9 30 per equity share. The company has also fixed Wednesday, October 21, as the record date to determine shareholders eligible for the dividend. However, it has not yet announced the dividend payment date.\n\nInvestors looking to benefit from this payout must ensure they are eligible for the dividend under the applicable settlement rules. Under India\u2019s T+1 settlement cycle, shares purchased on or after the record date will not qualify for the dividend.\n\nThe company has regularly rewarded shareholders through dividend distributions, providing them with both the potential for capital appreciation and dividend income. In the first quarter of FY27, the company declared a dividend of \u20b9 12.40 per equity share.\n\nOver the past 12 months, ICICI Prudential Asset Management has declared dividends amounting to \u20b9 27.25 per share. At the current share price of \u20b9 2,938.50, its dividend yield stands at 0.93%.\n\nThe company on Monday \u20b9 889 crore\">reported a 6.1% rise in profit after tax to \u20b9 889 crore for the September quarter of FY27, supported by higher revenue from dividend operations. The company had reported a profit of \u20b9 838 crore in the year-ago period.\n\nRevenue from operations increased 16.3% to \u20b9 1,674 crore in July\u2013September FY27 from \u20b9 1,439 crore a year earlier, the asset management firm said in a stock exchange filing.\n\nTotal expenses increased 18% to \u20b9 493 crore in the quarter under review from \u20b9 418 crore in the year-ago period.", "source": "LiveMint Markets", "pub_date_str": "13 Oct 2026, 08:12 PM IST", "pub_date_relative": "29m ago"}, {"title": "Jeevan Pramaan: How pensioners aged 80 and above can submit life certificate online", "full_content": "Pensioners aged 80 years and above can submit their annual life certificate from October 1, while other pensioners can begin submitting it from November 1. The deadline for pensioners in the latter category is November 30.\n\nThe government\u2019s Jeevan Pramaan facility allows pensioners to generate a Digital Life Certificate (DLC) through Aadhaar-based face authentication using a compatible smartphone. The facility eliminates the need to visit a bank branch or pension office in person, making the process more convenient for elderly pensioners and those with mobility difficulties.\n\nPensioners should ensure that their certificates are generated and accepted within the applicable submission window to avoid potential delays in pension payments.\n\nJeevan Pramaan is a government facility that enables pensioners to submit their annual life certificates electronically. The certificate serves as proof that the pensioner is alive and helps the pension-disbursing authority continue pension payments.\n\nDigital submission is not mandatory. Pensioners can also use other permitted methods, including biometric authentication, doorstep banking services and physical submission at the relevant bank branch.\n\nBefore beginning the face-authentication process, pensioners should keep the following information ready:\n\nProviding accurate information is important to avoid authentication failures and discrepancies in the certificate.\n\nPensioners can complete the process through a compatible Android smartphone with an internet connection.", "source": "LiveMint Money", "pub_date_str": "13 Oct 2026, 08:06 PM IST", "pub_date_relative": "35m ago"}, {"title": "Martin Shkreli violated lifetime pharma industry ban, FTC and states say in contempt claim", "full_content": "The Federal Trade Commission and seven states asked a federal judge on Tuesday to hold notorious \"Pharma bro\" Martin Shkreli in contempt, alleging he \"flagrantly and repeatedly violated\" a 2022 civil court order that had banned him for life from the pharmaceutical industry.\n\nThe FTC and the states say Shkreli, since being released from prison in May 2022, violated that court order by publicly trading in at least 60 pharmaceutical industry stocks and \"broadcasting his opinions about the business and management of many pharmaceutical industry companies,\" according to a press release.\n\nThe contempt filing asks a judge to order Shkreli to \"divest any pharmaceutical company stocks he currently owns\" and \"pay a fine equal to his profits from any pharmaceutical company stock trading (plus prejudgment interest) without the ability to account for offsetting losses.\"\n\nThe filing also asks that a judge make Shkreli \"face clear and escalating consequences for any future violations, including financial penalties and potential incarceration.\"\n\nFTC Commissioner Mark Meador said in a statement, \"A lifetime industry ban is only effective if breaches are met with consequences commensurate with the seriousness of the order.\"\n\nThe court order stems from a finding that Shkreli organized an anti-competitive scheme to perpetuate his company's monopoly in the anti-parasitic drug Daraprim. Shkreli had hiked the price of Daraprim from $17.50 per tablet to a whopping $750 per pill.\n\nIn addition to banning him from the drug industry for life, a judge ordered Shkreli to disgorge more than $64 million.\n\nThe civil case that led to the order is unrelated to the criminal case that ended with Shkreli's conviction in 2017 on securities fraud charges related to hedge funds he once operated and another drug company he founded. Shkreli was sentenced to seven years in federal prison in 2018, and was released in 2022 with credit for time locked up before he was sentenced and other factors.", "source": "CNBC Top News", "pub_date_str": "13 Oct 2026, 08:02 PM IST", "pub_date_relative": "39m ago"}, {"title": "My wife says we can\u2019t afford to retire, yet she wants to take an $8,000 trip to Italy. We have $4 million. Do I keep working?", "full_content": "\u201cI worry about healthcare, long-term care, inflation, a long bear market and living to 95.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "13 Oct 2026, 08:01 PM IST", "pub_date_relative": "41m ago"}, {"title": "Prestige Estates Q2 sales bookings rise 20% to Rs 7,225 cr on better housing demand", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Digital Real Estate \u203a Realty News \u203a Prestige Estates Q2 sales bookings rise 20% to Rs 7,225 cr on better housing demand Prestige Estates Projects Share Price Lodha Developers Share Price Phoenix Mills Share Price Oberoi Realty Share Price Godrej Properties Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Prestige Estates Q2 sales bookings rise 20% to Rs 7,225 cr on better housing demand SECTIONS Prestige Estates Q2 sales bookings rise 20% to Rs 7,225 cr on better housing demand PTI Last Updated: Oct 13, 2026, 07:57:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis During the second quarter, Prestige Estates Projects Ltd celebrated a remarkable 20 per cent increase in sales bookings, generating pre-sales of Rs 72,250 million. The launch of new residential projects toward the quarter's end was met with enthusiastic market reception and promising sales momentum. Ongoing developments also demonstrated robust sales, illustrating the sustained demand for housing. The company remains committed to expanding its real estate portfolio across key Indian cities.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "13 Oct 2026, 07:57 PM IST", "pub_date_relative": "45m ago"}, {"title": "Huge profits at tech and energy companies are masking this key trend", "full_content": "Despite the uneven start to the reporting period, FactSet data shows year-on-year S&P 500 earnings growth is still tracking at nearly 30%.", "source": "CNBC Top News", "pub_date_str": "13 Oct 2026, 07:53 PM IST", "pub_date_relative": "48m ago"}, {"title": "Puravankara Q2 sales bookings surge 62% to Rs 2,136 crore on housing demand", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Digital Real Estate \u203a Realty News \u203a Puravankara Q2 sales bookings surge 62% to Rs 2,136 crore on housing demand Puravankara Share Price Ganesh Housing Share Price Nirlon Share Price Kalpataru Share Price Valor Estate Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Puravankara Q2 sales bookings surge 62% to Rs 2,136 crore on housing demand SECTIONS Puravankara Q2 sales bookings surge 62% to Rs 2,136 crore on housing demand PTI Last Updated: Oct 13, 2026, 07:52:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis In the September quarter, Puravankara Ltd reported a remarkable surge in sales bookings, hitting Rs anies planning to launch initial public offerings (IPOs) to revise the size of their fresh issues without filing fresh draft documents, providing greater flexibility to issuers navigating volatile market conditions.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "13 Oct 2026, 07:51 PM IST", "pub_date_relative": "51m ago"}, {"title": "Who should pay for a birthday dinner? I always treat my guests.", "full_content": "\u201cI feel like I just end up paying for other people\u2019s birthday dinners a lot, as well as my own, which is an imbalance.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "13 Oct 2026, 07:47 PM IST", "pub_date_relative": "55m ago"}, {"title": "Stock Market Today: Wall Street Revenues Power Profit at Goldman and JPMorgan - WSJ", "full_content": "Stock Market Today: Wall Street Revenues Power Profit at Goldman and JPMorgan WSJ See more headlines & perspectives on Google News", "source": "Google News Business", "pub_date_str": "13 Oct 2026, 07:44 PM IST", "pub_date_relative": "58m ago"}, {"title": "Hedge-fund legend Paul Tudor Jones says the stock market faces a really challenging 2027. Here\u2019s why.", "full_content": "U.S. stocks could face a serious test in 2027 as a tsunami of new equity issuance threatens to upend the artificial-intelligence-driven bull market, according to hedge-fund billionaire Paul Tudor Jones.", "source": "MarketWatch Top Stories", "pub_date_str": "13 Oct 2026, 07:40 PM IST", "pub_date_relative": "1h ago"}, {"title": "Six Flags\u2019 stock slumps toward 16-year low after fatal incident", "full_content": "A fatal accident on a Six Flags Entertainment roller coaster sent shares of the amusement-park operator near the lowest level of the year.", "source": "MarketWatch Top Stories", "pub_date_str": "13 Oct 2026, 07:39 PM IST", "pub_date_relative": "1h ago"}, {"title": "France Supermarkets Hit By Cyberattack As Hackers Raise Fridge Temperatures To 50\u00b0C", "full_content": "A cyberattack hit 150 Intermarch\u00e9 stores in France, disrupting refrigeration systems, spoiling food and triggering fires. Carrefour, Monoprix and Coop\u00e9rative U were also targeted, prompting investigations into potential security flaws.", "source": "NDTV Profit", "pub_date_str": "13 Oct 2026, 07:38 PM IST", "pub_date_relative": "1h ago"}, {"title": "Micron, SK Hynix, SanDisk Extend Losses, Fall Up To 5% After China's Chip Push", "full_content": "Micron slipped the most, falling 5.55% to $934.16, followed by SK Hynix, down 5.32% at $153.6, while Sandisk was trading 4.29% lower.", "source": "NDTV Profit", "pub_date_str": "13 Oct 2026, 07:35 PM IST", "pub_date_relative": "1h ago"}, {"title": "Vans is gaining ground with teens. Its owner's stock stands to gain too, Piper Sandler says", "full_content": "Vans is gaining traction among teenagers, which could translate to more share growth for its owner, per Piper Sandler.", "source": "CNBC Top News", "pub_date_str": "13 Oct 2026, 07:33 PM IST", "pub_date_relative": "1h ago"}, {"title": "Govt Likely To Meet FY27 Revenue Target As Tax Collections Stay Robust", "full_content": "Robust direct tax and GST collections, along with stronger customs receipts, are expected to help the Centre meet its FY27 net tax revenue target of Rs 28.7 lakh crore, cushioning a potential shortfall in excise duty collections.", "source": "NDTV Profit", "pub_date_str": "13 Oct 2026, 07:32 PM IST", "pub_date_relative": "1h ago"}, {"title": "Tata Elxsi Q2 Results: Margin, Revenue Sees Marginal Rise | Check Key Numbers", "full_content": "Tata Elxsi reported a marginal decline in Q2 net profit to Rs 170.3 crore, while revenue grew 3.4% QoQ to Rs 1,056 crore. EBIT rose 7.3%, and the operating margin expanded to 19.7%. Shares gained 5.21% on October 13.", "source": "NDTV Profit", "pub_date_str": "13 Oct 2026, 07:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "Swiggy Instamart Faces Food Safety Complaints Over Alleged Insects In Noice Products", "full_content": "Separate complaints cited flies in a sealed atta packet, a worm in French Chocolate Rocher and mould inside a cake, raising questions over food safety and quality control.", "source": "NDTV Profit", "pub_date_str": "13 Oct 2026, 07:29 PM IST", "pub_date_relative": "1h ago"}, {"title": "PTC Industries among 4 stocks hitting 52-week highs; rally up to 15% in a month", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News PTC Industries among 4 stocks hitting 52-week highs; rally up to 15% in a month Written by Ritesh Presswala , ETMarkets.com | Oct 13, 2026, 07:31:55 PM IST 1 / 5 Fresh Peak Sensex surged 1,109 points to close at 73,033 on Tuesday. Amid the market rally, four stocks from the BSE 500 index touched fresh 52-week highs, reaching their highest levels in the past year. A 52-week high represents the highest price at which a stock has traded over the previous 12 months and can indicate increased investor interest and trading activity.\n\nNew 52-week high: Rs 4,444 | CMP: Rs 4,368.15. In the last month, the stock has gained about 14%.\n\nNew 52-week high: Rs 1,420.4 | CMP: Rs 1,404.1. In the last one month stock has gained about 13%.\n\nNew 52-week high: Rs 26,049.95 | CMP: Rs 2,5490.1. In the last one month stock has gained about 8%.\n\nNew 52-week high: Rs 1,224.25| CMP: Rs 1,222. In the last one month stock has gained about 4%.", "source": "Economic Times Markets", "pub_date_str": "13 Oct 2026, 07:27 PM IST", "pub_date_relative": "1h ago"}, {"title": "Big IPO buzz! Jio Platforms reportedly attracts over $20 billion in bids ahead of India's biggest issue; GMP hits \u20b9200", "full_content": "Jio Platforms Ltd., the digital services arm of Reliance Industries, is said to have attracted more than $20 billion in bids for what could be India\u2019s biggest-ever initial public offering (IPO), Bloomberg reported, citing people familiar with the matter.\n\nDomestic investors, along with global firms Fidelity, Allianz, and Capital Group, have reportedly expressed strong interest in the issue.\n\nA final list of IPO anchor investors will likely be decided in the coming days, the report said, quoting the same people. The process is ongoing, and no final decisions have been made yet.\n\nAfter earlier expectations put its valuation as high as $170 billion, Jio Platforms is now aiming for a valuation of up to \u20b9 10.3 trillion ($108 billion) in the IPO, people familiar with the matter have said.\n\nIn June, domestic brokerage Motilal Oswal Financial Services estimated Jio Platforms\u2019 valuation at between $115 billion and $118 billion, while Dolat Capital valued the company at about $110 billion.\n\nAkash Ambani, the 34-year-old managing director of Jio Platforms and son of billionaire Mukesh Ambani, has been leading the deal, holding meetings in Hong Kong, London and New York in recent weeks.\n\nThe proposed listing would mark the first public offering by the Reliance Group in nearly two decades and the first listing of a consumer-facing business within the conglomerate.\n\nNone of Jio Platforms\u2019 investors, which include Meta Platforms Inc., Alphabet Inc., Mubadala and Saudi Arabia\u2019s Public Investment Fund, are looking to exit through the IPO, as the offering is entirely a primary issue, according to the draft prospectus.", "source": "LiveMint Markets", "pub_date_str": "13 Oct 2026, 07:25 PM IST", "pub_date_relative": "1h ago"}, {"title": "Chip stocks slide in wake of \u2018casino\u2019 comment by Broadcom boss", "full_content": "Declines for Samsung and SK Hynix drag Kospi sharply lower as investors fret over scale of AI investment", "source": "FT Markets", "pub_date_str": "13 Oct 2026, 07:23 PM IST", "pub_date_relative": "1h ago"}, {"title": "Millions of Americans will have fewer options during Medicare open enrollment this year", "full_content": "There will be no Medicare Advantage plans in 181 counties in 2027, up from 67 in 2026.", "source": "MarketWatch Top Stories", "pub_date_str": "13 Oct 2026, 07:23 PM IST", "pub_date_relative": "1h ago"}, {"title": "Micron, Seagate, Western Digital sink as chip sell-off deepens", "full_content": "Chip stocks fell on Tuesday, extending a sell-off sparked by worries over artificial intelligence financing and intensifying competition.\n\nMemory chip giant Micron slipped about 5% while other memory-related names such as SanDisk , Seagate and Western Digital also sank. SanDisk fell 5% while Seagate and Western Digital both dropped 6%.\n\nThe slide, which followed declines on Wall Street on Monday, comes as investors assessed intensifying competition from China's ChangXin Memory Technologies, or CXMT .\n\nOver the weekend , CXMT announced significant progress in developing a new chip architecture, designed to increase memory density by packing more data into a smaller space.\n\nCXMT is China's leading rival to the likes of Micron and South Korean heavyweights SK Hynix and Samsung Electronics . Analysts broadly see CXMT as trailing the U.S. and South Korean memory leaders, which means any advancement from the Chinese firm could add more competition to the market leaders.\n\n\"Investors are jittery and looking for excuses to take profit on AI-related stocks that have outperformed this year, especially memory stocks,\" said UBP's senior equity advisor Vey-Sern Ling.\n\n\"In reality, while the Chinese memory makers can potentially become a threat to global demand-supply balance over time, in the short run they continue to face technology hurdles, especially for more advanced memory like HBM,\" Ling told CNBC via email.\n\nMicron, Seagate, SanDisk, Western Digital stock chart. 'Vulnerable' AI sentiment? Phillip Wool, chief market strategist at Rayliant Global Advisors, said CXMT's breakthrough marked a significant milestone for Chinese chipmakers , demonstrating their ability to overcome technology restrictions and potentially challenge established players sooner than expected.", "source": "CNBC World Economy", "pub_date_str": "13 Oct 2026, 07:21 PM IST", "pub_date_relative": "1h ago"}, {"title": "US Stock Market Today: Dow Jumps 369 Points, Nasdaq Falls As Memory Stocks Slide", "full_content": "Wall Street stocks trade mixed as the Dow gains nearly 369 points, while the Nasdaq and S&P 500 slip amid a memory-stock selloff, concerns over Chinese competition and AI investment expectations.", "source": "NDTV Profit", "pub_date_str": "13 Oct 2026, 07:20 PM IST", "pub_date_relative": "1h ago"}, {"title": "UnitedHealth keeps medical costs under control \u2014 and raises its outlook again", "full_content": "The health-insurance giant said its medical-cost ratio was 88.4% in the third quarter of this year, as the company tries to rein in spending on medical care.", "source": "MarketWatch Top Stories", "pub_date_str": "13 Oct 2026, 07:19 PM IST", "pub_date_relative": "1h ago"}, {"title": "London Stock Exchange owner in talks to buy credit specialist Octus", "full_content": "Deal with private equity group Permira could value data group at $3.5bn", "source": "FT Markets", "pub_date_str": "13 Oct 2026, 07:11 PM IST", "pub_date_relative": "1h ago"}, {"title": "Apple releases HomeView smart home hub with screen as showcase for Siri AI", "full_content": "Apple said the device with a 7-inch screen was designed to be mounted on a wall or placed on a table. It's designed for multiple people in a household, and will recognize the user by their face to display pertinent information. It starts at $299 and ships on Nov. 13.\n\nTuesday's launch event is the second under new CEO John Ternus, who took over from Tim Cook in September. Last month, Apple announced new models of its most important product, the iPhone, including a foldable model called the Duo that retails for nearly $2,000.\n\nApple also announced new Apple TV and HomePod hardware on Tuesday. The new Apple TV 4K costs $299 and has a redesigned remote that can play a sound if it is lost. Apple's HomePod Mini speaker comes in new colors and costs $149, a slight increase over its previous $129 price.\n\nThe products announced Tuesday are less critical for Apple than the iPhone, and investors remain focused on iPhone sales, but the accessories were positioned on Tuesday as a showcase for the company's new Siri abilities released last month.\n\nApple said that HomeView features Siri AI, which can answer a broad range of questions. Users will be able to converse with Siri, and their conversations will continue on their iPhone or iPad. It has a built-in speaker for playing music.\n\nApple's HomeView can be placed on a table or mounted on a wall. Apple \"It recognizes your face to shift from a household screen to your own experience, fills the room with incredible sound, keeps you connected to the people who matter most with FaceTime, and makes it easy to control your smart home,\" Apple's chief marketer Greg Joswiak said in a statement.\n\nApple said that HomeView will show information from the Messages, Photos, Calendar, and Reminders apps based on who is using the device, powered by Apple Intelligence. It can also be used to make FaceTime calls and as a digital photo frame. It's equipped with an Apple A18 chip.", "source": "CNBC World Economy", "pub_date_str": "13 Oct 2026, 07:10 PM IST", "pub_date_relative": "1h ago"}, {"title": "Micron\u2019s stock extends declines as China competition heats up", "full_content": "Even Elon Musk says Chinese memory-chip makers are catching up.", "source": "MarketWatch Top Stories", "pub_date_str": "13 Oct 2026, 07:10 PM IST", "pub_date_relative": "1h ago"}, {"title": "JPMorgan profit misses analyst estimates as Jamie Dimon warns economic forces 'shift under the surface' - Yahoo Finance", "full_content": "JPMorgan profit misses analyst estimates as Jamie Dimon warns economic forces 'shift under the surface' Yahoo Finance JPMorgan's earnings miss, Delta delays Riyadh route, McDonald's chicken plans and more in Morning Squawk CNBC JPMorgan Posts Surprise Drop in Fixed-Income Trading Revenue Bloomberg.com JPMorgan posts rare profit miss as dealmaking, bond trading lose momentum Reuters JPMorgan Q3 2026 earnings miss; memory chip stocks slide qz.com", "source": "Google News Business", "pub_date_str": "13 Oct 2026, 07:10 PM IST", "pub_date_relative": "1h ago"}, {"title": "US stocks opens lower after bank earnings; chips weigh", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a US stocks opens lower after bank earnings; chips weigh Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US stocks opens lower after bank earnings; chips weigh SECTIONS US stocks opens lower after bank earnings; chips weigh Reuters Last Updated: Oct 13, 2026, 07:07:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The S&P 500 and the Nasdaq opened lower on Tuesday as chip stocks came under selling pressure again, while investors assessed a mixed set of quarterly results, including reports\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\nCurbing rupee bets: What the RBI\u2019s new rules mean for the hedge-now-or-wait question", "source": "Economic Times Markets", "pub_date_str": "13 Oct 2026, 07:07 PM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "UnitedHealth Group tops estimates, hikes profit outlook as insurer manages high medical costs", "full_content": "UnitedHealth Group on Tuesday posted third-quarter earnings that blew past estimates and raised its full-year profit outlook, as the company continues to manage high medical costs and sees investments in value-based care and artificial intelligence take hold.\n\nThe nation's largest private insurer said it expects fiscal 2026 adjusted earnings of at least $20.50 per share, up from a previous outlook of $19.50 to $20 per share.\n\nThe healthcare giant's turnaround plan is gaining momentum after three consecutive strong quarters this year. UnitedHealth is working to stabilize margins by shrinking membership, exiting unprofitable contracts, and ramping up investments in artificial intelligence and value-based care, which tie doctor and facility compensation to patient health outcomes, quality of care and cost effectiveness rather than the volume of medical services provided.\n\n\"You'll see in the quarter that we continue to execute not only on the financial aspects of our business, but really doing them with a simpler approach and an approach that's really focused on investing heavily in value-based care,\" CFO Wayne DeVeydt said in an interview.\n\nHere's what the company reported for the third quarter compared with what Wall Street was expecting, based on a survey of analysts by LSEG:\n\nThe company posted third-quarter net income of $4.11 billion, or $4.56 per share, compared with $2.35 billion, or $2.59 per share, in the same period a year ago. Excluding items like business divestitures, restructuring and the expected reduction of reserves for unprofitable contracts, UnitedHealth earned $4.69 per share.\n\nRevenue fell to $112.69 billion from $113.16 billion a year earlier.", "source": "CNBC Top News", "pub_date_str": "13 Oct 2026, 08:34 PM IST", "pub_date_relative": "7m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Bank earnings live updates: AI dominates analyst calls from JPMorgan, Goldman and Wells Fargo", "full_content": "Four of the largest U.S. banks reported third-quarter results on Tuesday: JPMorgan Chase , Wells Fargo , Goldman Sachs and Citigroup .\n\nBank of America and Morgan Stanley will post earnings on Wednesday.\n\nThe quarter was dominated by headlines around artificial intelligence, IPO uncertainty, high fuel prices and rising borrowing costs.\n\nThe banks that reported Tuesday put up mixed results . JPMorgan, the biggest U.S. bank by assets and the largest in the world by market capitalization, posted a rare miss. Goldman Sachs, meanwhile, blew past estimates for revenue and earnings per share, led by strong equities trading.\n\nAnalyst calls for JPMorgan, Goldman Sachs and Wells Fargo all touched on the opportunities and risks associated with AI, citing robust financing demand and operational advantages, but also the threat of rogue agents.\n\nGoldman Sachs CEO David Solomon also addressed recent reports of a CEO transition plan.\n\nSolomon warned that the AI infrastructure boom could face a painful reset if higher borrowing costs or overbuilding undermine the economics of some data center projects.\n\n\"There is going to be a lot of financing to do, and we're going to be in the middle of that,\" Solomon said during the bank's third-quarter call.", "source": "CNBC Top News", "pub_date_str": "13 Oct 2026, 08:33 PM IST", "pub_date_relative": "8m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Citi profit tops estimates on higher investment banking, services and wealth revenue", "full_content": "", "source": "Investing.com News", "pub_date_str": "13 Oct 2026, 08:31 PM IST", "pub_date_relative": "10m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stocks fall after bank earnings deluge; chipmakers slide: Live updates - CNBC", "full_content": "Stocks fall after bank earnings deluge; chipmakers slide: Live updates CNBC Strong profit reports from Goldman Sachs and others support Wall Street as chip stocks drop Pittsburgh Post-Gazette Stocks dip on AI jitters, big banks kick off US earnings season Reuters Stock Losses Deepen on AI Trade, Treasuries Rally: Markets Wrap Bloomberg.com S&P 500 set for muted open after big bank earnings, chip slide weighs The Detroit News", "source": "Google News Business", "pub_date_str": "13 Oct 2026, 08:31 PM IST", "pub_date_relative": "11m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Innovative industrial properties\u2019 Alan Gold buys $1m in preferred stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "13 Oct 2026, 08:30 PM IST", "pub_date_relative": "11m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "JPMorgan posts rare profit miss as dealmaking, bond trading lose momentum", "full_content": "", "source": "Investing.com News", "pub_date_str": "13 Oct 2026, 08:30 PM IST", "pub_date_relative": "11m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Fixed Income"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Anthropic to disclose new revenue numbers as AI lab financials become central to tech trade", "full_content": "Anthropic plans to disclose its third-quarter financials for the first time at a meeting with potential investors on Wednesday as the artificial intelligence giant prepares for what could be the largest initial public offering in history.\n\nSan Francisco-based Anthropic will release the numbers to a group of institutional investors, according to two people familiar with the matter, who asked not to be named because the details were confidential.\n\nBloomberg first reported that the meeting was happening. Anthropic declined to comment.\n\nThe meeting comes as revenue numbers from the private AI giants have proven to have an outsized impact on broader markets.\n\nLast week, confusion around a report detailing OpenAI 's revenue and updated accounting dragged down major semiconductor stocks and the broader Nasdaq.\n\nOpenAI shared an updated revenue number of $50 billion with current investors as part of an ongoing fundraise , which was lower than the $70 billion that had been widely reported. The updated number stripped out revenue from cloud partners, and wasn't an indication of changing demand, according to a person familiar with the matter who asked not to be named in order to discuss internal information.\n\nIt's unclear if Anthropic will account for sales in the same manner and include partner revenue, but the numbers this week will give investors a more accurate snapshot of Anthropic's growth and profitability as they look to value the company ahead of an IPO. It will also help Anthropic senior executives and bankers gauge investor interest and weigh the reaction to these updated financials.\n\nAnthropic is plowing ahead with what could be a $2 trillion listing based on its latest reported revenue numbers, which could top $100 billion by the end of this year, according to people familiar with the plans.", "source": "CNBC World Economy", "pub_date_str": "13 Oct 2026, 08:25 PM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Six Flags shares decline following deadly roller coaster incident", "full_content": "Shares of Six Flags Entertainment declined more than 16% Tuesday following a deadly roller coaster incident at one of its amusement parks in Georgia.\n\nOne person died and several others were injured Monday in an incident at Six Flags Over Georgia, according to a statement from Georgia's Cobb County Board of Commissioners. The board's chairwoman, Lisa N. Cupid, said that county authorities are working with Six Flags and other partners in the investigation.\n\nAccording to reports citing local police, the incident occurred on the Atlanta-area park's 200-foot-tall Goliath roller coaster shortly before 4 p.m. Monday. Riders were later seen being evacuated from the roller coaster after it stopped near the top of the ride, according to the report.\n\nWitnesses told a local news station that they saw a man fall from the roller coaster and strike the ride several times.\n\nIn a statement to ABC News, a Six Flags spokesperson said it is cooperating fully with the investigation and had temporarily closed similar attractions across its parks.\n\nSix Flags did not immediately respond to CNBC's request for comment.\n\nTuesday's decline is on pace to be the stock's worst day since August and puts shares at their lowest level since December 2009. Shares have now fallen by more than 50% over the past year.", "source": "CNBC Top News", "pub_date_str": "13 Oct 2026, 08:19 PM IST", "pub_date_relative": "22m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Have a \u20b950 lakh home loan? Check how much your EMI could rise after the RBI rate hike", "full_content": "The Reserve Bank of India (RBI) has raised the repo rate by 25 basis points to 5.50%, marking its first rate hike since February 2023. The decision comes amid inflationary pressures and global uncertainties, with the central bank seeking to balance price stability and macroeconomic conditions.\n\nFor home loan borrowers, the hike could mean higher monthly repayments if banks pass on the increase to lending rates. The impact will depend on the loan amount, repayment tenure, lender and interest rate applicable to the borrower.\n\nFor someone with a \u20b9 50 lakh home loan, the monthly EMI could rise by \u20b9 852 to \u20b9 867 on a 30-year loan, depending on the lender, according to Atul Monga, CEO and co-founder of BASIC Home Loan.\n\nMonga estimates that a 25-basis-point increase would raise the monthly equated monthly instalment (EMI) on a \u20b9 50 lakh home loan with a 30-year tenure by \u20b9 852 at a public sector bank, from \u20b9 34,109 to \u20b9 34,961. At a private bank, the EMI would rise by \u20b9 867, from \u20b9 35,821 to \u20b9 36,688.\n\nRaoul Kapoor, co-CEO of Andromeda Sales and Distribution, said home loan rates of around 7.15% are currently available to eligible borrowers. If the entire 25-basis-point increase is passed on, the rate would rise to 7.40%, increasing the EMI on a \u20b9 50 lakh loan for a 20-year period, from \u20b9 39,216 to \u20b9 39,975.\n\nThe effect extends beyond the monthly repayment. Monga estimates that, over the full 30-year tenure, the additional interest outgo could be approximately \u20b9 3.07 lakh for a public sector bank borrower and \u20b9 3.12 lakh for a private bank borrower, assuming the loan runs for the entire period.\n\nThe actual impact will depend on whether the lender passes on the full rate hike, the interest rate applicable to the borrower and how repayments are adjusted.\n\nThe impact will also vary with the amount borrowed.", "source": "LiveMint Money", "pub_date_str": "13 Oct 2026, 08:16 PM IST", "pub_date_relative": "25m ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "US banks post strong profits, but inflation and rate risks cloud outlook", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a US banks post strong profits, but inflation and rate risks cloud outlook Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US banks post strong profits, but inflation and rate risks cloud outlook SECTIONS US banks post strong profits, but inflation and rate risks cloud outlook By Somanjali Das , ETMarkets.com Last Updated: Oct 13, 2026, 08:15:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Major US banks reported higher third-quarter profits, supported by resilient consumer spending, AI investment and stronger trading revenue. However, executives warned that persistent inflation, elevated interest rates and geopolitical risks could strain household finances and slow economic growth. JPMorgan Chase missed earnings estimates, while Goldman Sachs, Citigroup and Wells Fargo reported stronger results.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "13 Oct 2026, 08:15 PM IST", "pub_date_relative": "26m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "\u20b930 per share dividend stock: Do you own this MF share? Check record date to qualify for cash reward; yield, history", "full_content": "ICICI Prudential Asset Management has announced a reward for shareholders, with the country\u2019s one of the largest active mutual fund asset managers declaring an interim dividend of \u20b9 30 per equity share alongside its September quarter results.\n\nOn Monday, the AMC said its board of directors had approved an interim dividend of \u20b9 30 per equity share. The company has also fixed Wednesday, October 21, as the record date to determine shareholders eligible for the dividend. However, it has not yet announced the dividend payment date.\n\nInvestors looking to benefit from this payout must ensure they are eligible for the dividend under the applicable settlement rules. Under India\u2019s T+1 settlement cycle, shares purchased on or after the record date will not qualify for the dividend.\n\nThe company has regularly rewarded shareholders through dividend distributions, providing them with both the potential for capital appreciation and dividend income. In the first quarter of FY27, the company declared a dividend of \u20b9 12.40 per equity share.\n\nOver the past 12 months, ICICI Prudential Asset Management has declared dividends amounting to \u20b9 27.25 per share. At the current share price of \u20b9 2,938.50, its dividend yield stands at 0.93%.\n\nThe company on Monday \u20b9 889 crore\">reported a 6.1% rise in profit after tax to \u20b9 889 crore for the September quarter of FY27, supported by higher revenue from dividend operations. The company had reported a profit of \u20b9 838 crore in the year-ago period.\n\nRevenue from operations increased 16.3% to \u20b9 1,674 crore in July\u2013September FY27 from \u20b9 1,439 crore a year earlier, the asset management firm said in a stock exchange filing.\n\nTotal expenses increased 18% to \u20b9 493 crore in the quarter under review from \u20b9 418 crore in the year-ago period.", "source": "LiveMint Markets", "pub_date_str": "13 Oct 2026, 08:12 PM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Fixed Income", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Jeevan Pramaan: How pensioners aged 80 and above can submit life certificate online", "full_content": "Pensioners aged 80 years and above can submit their annual life certificate from October 1, while other pensioners can begin submitting it from November 1. The deadline for pensioners in the latter category is November 30.\n\nThe government\u2019s Jeevan Pramaan facility allows pensioners to generate a Digital Life Certificate (DLC) through Aadhaar-based face authentication using a compatible smartphone. The facility eliminates the need to visit a bank branch or pension office in person, making the process more convenient for elderly pensioners and those with mobility difficulties.\n\nPensioners should ensure that their certificates are generated and accepted within the applicable submission window to avoid potential delays in pension payments.\n\nJeevan Pramaan is a government facility that enables pensioners to submit their annual life certificates electronically. The certificate serves as proof that the pensioner is alive and helps the pension-disbursing authority continue pension payments.\n\nDigital submission is not mandatory. Pensioners can also use other permitted methods, including biometric authentication, doorstep banking services and physical submission at the relevant bank branch.\n\nBefore beginning the face-authentication process, pensioners should keep the following information ready:\n\nProviding accurate information is important to avoid authentication failures and discrepancies in the certificate.\n\nPensioners can complete the process through a compatible Android smartphone with an internet connection.", "source": "LiveMint Money", "pub_date_str": "13 Oct 2026, 08:06 PM IST", "pub_date_relative": "35m ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Martin Shkreli violated lifetime pharma industry ban, FTC and states say in contempt claim", "full_content": "The Federal Trade Commission and seven states asked a federal judge on Tuesday to hold notorious \"Pharma bro\" Martin Shkreli in contempt, alleging he \"flagrantly and repeatedly violated\" a 2022 civil court order that had banned him for life from the pharmaceutical industry.\n\nThe FTC and the states say Shkreli, since being released from prison in May 2022, violated that court order by publicly trading in at least 60 pharmaceutical industry stocks and \"broadcasting his opinions about the business and management of many pharmaceutical industry companies,\" according to a press release.\n\nThe contempt filing asks a judge to order Shkreli to \"divest any pharmaceutical company stocks he currently owns\" and \"pay a fine equal to his profits from any pharmaceutical company stock trading (plus prejudgment interest) without the ability to account for offsetting losses.\"\n\nThe filing also asks that a judge make Shkreli \"face clear and escalating consequences for any future violations, including financial penalties and potential incarceration.\"\n\nFTC Commissioner Mark Meador said in a statement, \"A lifetime industry ban is only effective if breaches are met with consequences commensurate with the seriousness of the order.\"\n\nThe court order stems from a finding that Shkreli organized an anti-competitive scheme to perpetuate his company's monopoly in the anti-parasitic drug Daraprim. Shkreli had hiked the price of Daraprim from $17.50 per tablet to a whopping $750 per pill.\n\nIn addition to banning him from the drug industry for life, a judge ordered Shkreli to disgorge more than $64 million.\n\nThe civil case that led to the order is unrelated to the criminal case that ended with Shkreli's conviction in 2017 on securities fraud charges related to hedge funds he once operated and another drug company he founded. Shkreli was sentenced to seven years in federal prison in 2018, and was released in 2022 with credit for time locked up before he was sentenced and other factors.", "source": "CNBC Top News", "pub_date_str": "13 Oct 2026, 08:02 PM IST", "pub_date_relative": "39m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "My wife says we can\u2019t afford to retire, yet she wants to take an $8,000 trip to Italy. We have $4 million. Do I keep working?", "full_content": "\u201cI worry about healthcare, long-term care, inflation, a long bear market and living to 95.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "13 Oct 2026, 08:01 PM IST", "pub_date_relative": "41m ago", "cfa_topics": ["Economics", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Prestige Estates Q2 sales bookings rise 20% to Rs 7,225 cr on better housing demand", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Digital Real Estate \u203a Realty News \u203a Prestige Estates Q2 sales bookings rise 20% to Rs 7,225 cr on better housing demand Prestige Estates Projects Share Price Lodha Developers Share Price Phoenix Mills Share Price Oberoi Realty Share Price Godrej Properties Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Prestige Estates Q2 sales bookings rise 20% to Rs 7,225 cr on better housing demand SECTIONS Prestige Estates Q2 sales bookings rise 20% to Rs 7,225 cr on better housing demand PTI Last Updated: Oct 13, 2026, 07:57:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis During the second quarter, Prestige Estates Projects Ltd celebrated a remarkable 20 per cent increase in sales
