71.05 crore on BSE on Thursday, October 1.", "source": "LiveMint Markets", "pub_date_str": "03 Oct 2026, 12:01 PM IST", "pub_date_relative": "8m ago"}, {"title": "Policybazaar, Paisabazaar share: PB Fintech stock down 48% in 6 days, more pain ahead - Here\u2019s why | Revised target", "full_content": "Shares of PB Fintech , the parent company of Policybazaar and Paisabazaar, have been under intense selling pressure, extending their losing streak to six consecutive sessions and falling around 48% during the period. The sharp decline has come as investors reassess the potential impact of proposed changes to insurance commissions and distribution economics.\n\nThe stock hit its 52-week low of \u20b9 965 on October 1. It has now tanked over 50% from its 52-week high of \u20b9 1,963.00, hit in December last year. The scrip has shed 42% in 3 months, 31% in 6 months and 41% in the last 1 year.\n\nThe sell-off has raised concerns over the earnings outlook for insurance intermediaries, particularly companies that rely on commissions and distribution fees. Several brokerages have since revised their estimates or valuation assumptions for PB Fintech, with concerns centred on the extent to which the proposed regulatory changes could affect its general insurance and point-of-sales person (POSP) businesses.\n\nThe pressure on PB Fintech shares intensified after the Insurance Regulatory and Development Authority of India ( IRDAI ) proposed sweeping changes to insurance distribution rules. The draft reforms are aimed at reducing insurance costs, improving transparency and expanding coverage, while also bringing greater discipline to the distribution ecosystem.\n\nThe proposals include changes to Expenses of Management (EoM), segmental commission limits and restrictions on practices described as \u201cdark patterns\u201d. Under the proposed framework, insurers would need to provide customers with product and pricing information without requiring them to submit personal details upfront.\n\nIRDAI has also proposed greater disclosure of commission rates in policy documents and changes covering motor insurance .", "source": "LiveMint Markets", "pub_date_str": "03 Oct 2026, 11:49 AM IST", "pub_date_relative": "20m ago"}, {"title": "Bridge across Dnipro river in Kyiv hit during Russian attack", "full_content": "", "source": "Investing.com News", "pub_date_str": "03 Oct 2026, 11:48 AM IST", "pub_date_relative": "21m ago"}, {"title": "Stocks to buy: Axis picks 7 largecap stocks with upside potential of up to 44%. See full list", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News Stocks to buy: Axis picks 7 largecap stocks with upside potential of up to 44%. See full list Written by Veer Sharma , ETMarkets.com | Oct 03, 2026, 11:49:27 AM IST 1 / 8 Value Bets The Indian stock market has just set a record, but not one investors hoped for. Dalal Street has logged losses for eight consecutive weeks, surpassing the streaks seen during the 2020 Covid-19 crash and the 2008 global financial crisis. Axis has picked 7 largecap stocks that have robust value after the sharp correction.\n\nAxis has set a price target of Rs 1,305, a 36% upside from current levels. The company is one of India\u2019s largest NBFCs for consumer finance, with a wide product portfolio comprising loans for two-wheelers, consumer durables, housing, and small businesses, among others.\n\nWith a price target of Rs 2,530, the brokerage has implied an upside potential of 44% from current levels. It is an Indian multinational telecommunications company operating in 18 countries across South Asia, Africa, and the Channel Islands. It is India's second-largest telecom operator, boasting a strong domestic presence and a comprehensive digital services portfolio that includes fibre optic networks, mobile and desktop telephony, and other digital solutions.\n\nWith a target price of Rs 1,800, the brokerage implies an upside potential of 36% from current levels. The lender is supported by a strong liability franchise and a healthy retail corporate mix. The bank\u2019s subsidiaries, such as ICICI Venture Funds, ICICI Pru AMC, ICICI Securities, ICICI Prudential, and ICICI Lombard, are among the leading companies in their respective domains.\n\nWith a target price of Rs 390, the brokerage implies an upside of 22% from current levels.", "source": "Economic Times Markets", "pub_date_str": "03 Oct 2026, 11:45 AM IST", "pub_date_relative": "24m ago"}, {"title": "Gold and silver price today, Oct 3: Check retail rates of 24K, 22K gold and 999 silver in your city ahead of Durga Puja", "full_content": "Gold and silver prices: The price of the yellow metal in India's retail market remained largely stable on Saturday, 3 October, with both 24-karat and 22-karat gold rates witnessing marginal changes across major cities. Silver prices also showed limited movement in the domestic bullion market.\n\nMulti commodity exchange of India (MCX) is closed on Saturdays and Sundays, hence live trading rates are currently unavailable. And on Friday, it was closed for Gandhi Jayanti. Based on Thursday's closing level, gold continued to trade above \u20b9 1.49 lakh, although it edged lower compared to the past few trading sessions.\n\nOn 3 October, 24-carat gold was priced at \u20b9 150,550/10 grams, and 22-carat gold was priced at \u20b9 138,004/10 grams. Silver prices today are at \u20b9 226,590/kg (Silver 999 Fine), according to the Indian Bullion Association's (IBA) data.\n\nIn the retail market, gold is sold in 24-karat and 22-karat purity. While 24-karat gold is considered the purest form, 22-karat is commonly used for making jewellery as its more solid in nature. Here's a look at the latest gold prices across major Indian cities on 3 October, 2026.\n\nGold prices last year experienced their strongest bull run since 1979, rising by over 75% till date. In recent months, gold prices have risen modestly amid safe-haven demand and global economic uncertainty.\n\nMeanwhile, silver prices have seen even steeper increases due to strong demand and currency fluctuations. Rates rose from roughly \u20b9 78,600 per kg in 2023-2024 to over \u20b9 240,000 per kg in October 2026.\n\nCatch all the Instant Personal Loan , Business Loan , Business News , Money news , Breaking News Events and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.\n\nLog in to our website to save your bookmarks. It'll just take a moment.", "source": "LiveMint Money", "pub_date_str": "03 Oct 2026, 11:12 AM IST", "pub_date_relative": "57m ago"}, {"title": "Indian stocks face a cyclical correction, not a deeper earnings reset: Mahindra Manulife MF CIO", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Expert Views \u203a Indian stocks face a cyclical correction, not a deeper earnings reset: Mahindra Manulife MF CIO The Economic Times daily newspaper is available online now. Read Today's Paper Indian stocks face a cyclical correction, not a deeper earnings reset: Mahindra Manulife MF CIO SECTIONS Indian stocks face a cyclical correction, not a deeper earnings reset: Mahindra Manulife MF CIO By Nikhil Agarwal , ETMarkets.com Last Updated: Oct 03, 2026, 11:09:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Markets are also digesting a range of near-term uncertainties, including energy price volatility, geopolitical tensions and the potential impact of AI-led disruption on future employment patterns.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financia 01. The brokerage said momentum indicators also point to continued weakness, although select stocks are showing stronger technical structures and could offer upside over the next three to four weeks.\n\nThe BSE Sensex declined nearly 4,320 points, or around 5.6\u20135.8%, during September. The NSE Nifty 50 also dropped around 1,364\u20131,450 points, or 5.7\u20136.1%.\n\nElevated US Treasury yields and a stronger US dollar have weighed on Indian markets. Meanwhile, continued FII selling, weak rupee , high crude oil prices, escalating tensions between US and Iran also added to the weak sentiment.\n\nThe Nifty 50 ended the week at 22,422, down around 718 points, after opening on a slightly negative note and witnessing sustained selling through the week. The weekly RSI has also been moving towards the oversold zone, signalling increasing bearish momentum.\n\n\"Technically, immediate support lies at 22,200. A decisive breakdown below this level would be a major red flag, potentially dragging the index lower toward 21,800. On the upside, immediate resistance is positioned at 22,800. A sustained breakout above this mark could propel the index higher toward 23,300,\" it stated.\n\nThe brokerage added that overall, the index seems to be heading lower, the price action around the 22,200 mark will be crucial to watch as a break below this will trigger major red flags and could push the index lower.\n\n\"We also expect the gains in the index to be capped as long as we do not see a sustained move above the 23,300 zone,\" Axis said.", "source": "LiveMint Markets", "pub_date_str": "03 Oct 2026, 10:47 AM IST", "pub_date_relative": "1h ago"}, {"title": "Jio Platforms IPO may open on October 21, issue estimated at $3.8 billion: Report", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a Jio Platforms IPO may open on October 21, issue esti Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "03 Oct 2026, 10:34 AM IST", "pub_date_relative": "1h ago"}, {"title": "Who Is Hamam Al Hamami? What We Know About Flydubai Co-Pilot And Oman Air Link", "full_content": "A Flydubai co-pilot allegedly attacked the captain during a Dubai-Tel Aviv flight, forcing an emergency landing in Saudi Arabia. The captain was injured, while passengers and pilots helped restrain the suspect.", "source": "NDTV Profit", "pub_date_str": "03 Oct 2026, 10:31 AM IST", "pub_date_relative": "1h ago"}, {"title": "Jensen Huang\u2019s Net Worth Crosses $200 Billion; Becomes World\u2019s 7th-Richest Person", "full_content": "That came after the US approved the sale of Nvidia's H200 chips to 10 Chinese technology firms.", "source": "NDTV Profit", "pub_date_str": "03 Oct 2026, 10:30 AM IST", "pub_date_relative": "1h ago"}, {"title": "America\u2019s data center fight is a preview of what's to come for the rest of the world", "full_content": "As the AI boom becomes a major part of political debate, the public backlash against data centers in the U.S. is spreading to Europe and Asia \u2014 raising risks for investors.\n\nAcross the Atlantic, negative sentiment is growing in Europe, which has more at stake due to its densely populated countries and higher electricity prices , experts told CNBC.\n\nSimilar tensions are emerging in South Korea, with growing opposition to data centers near residential areas and proposals for tighter local restrictions, even as the national government pushes to accelerate development.\n\nPublic opposition has already impacted around $42 billion of data center investments in Europe, in account delays and cancellations, according to research from STL Partners. That compares to around $77 billion in the U.S.\n\nThe pushback could be the \"straw that breaks the camel's back,\" Olivier Darmouni, associate professor at HEC Paris who specializes in the energy transition, told CNBC.\n\nMore than 70 data center projects in Europe were rejected or restricted between January and April \u2014 more than in all of 2025, according to the European Data Center Monitor. It found that pushback had snowballed from local town halls to courts, regulators and parliaments.\n\nScotland has paused planning approvals for new hyperscale data centers after campaigners called on the government to avoid the \"cautionary tale\" of Ireland, where overwhelming power demand led to a moratorium.\n\nConstraints have been rising in the Nordics, where investors were drawn to large tracts of land and renewable energy. After a surge in power applications , Denmark passed an emergency law that could see data centers at the back of the queue for grid power applications.", "source": "CNBC World Economy", "pub_date_str": "03 Oct 2026, 10:30 AM IST", "pub_date_relative": "1h ago"}, {"title": "G20 countries split over US push to curb excess industrial capacity", "full_content": "", "source": "Investing.com News", "pub_date_str": "03 Oct 2026, 10:29 AM IST", "pub_date_relative": "1h ago"}, {"title": "Think debt mutual fund gains are always taxed as short-term? Not if you bought them before this date", "full_content": "Debt mutual funds primarily invest in fixed-income securities such as government and corporate bonds, debentures, commercial papers and certificates of deposit. These less-risky funds are generally preferred by conservative savers and retirees seeking stable, fixed-income returns with high liquidity.\n\nFor tax purposes, mutual fund schemes that invest at least 65% of their assets in debt and money market instruments are classified as debt-oriented mutual funds. However, the tax treatment of profits made from these investments can depend on when the units were purchased.\n\nThe Union Budget 2023 announced major changes in the tax treatment of debt mutual fund gains for units bought on or after April 1, 2023.\n\nAs per the new rule, profits from specified debt-oriented funds are taxed as short-term capital gains, irrespective of how long the investor holds the units.\n\nThis means the benefit of indexation and long-term capital gains taxation that was available earlier is no longer available for these investments. As a result, these gains are added to the investor's taxable income and taxed according to their applicable income tax slab rate.\n\nThe rules are different for units purchased before April 1, 2023. These investments can still qualify for long-term capital gains treatment if the units are held for more than 24 months.\n\nProfits from selling old units of debt mutual fund are taxed at a flat rate of12.5%, still without indexation benefits, which can significantly affect the post-tax returns of debt fund investors.\n\nIf the holding period is 24 months or less, the gains would have been treated as short-term capital gains (STCG). Since this rule applies to units purchased in 2023 and the holding period has already exceeded two years, short-term capital gains tax rule is no longer applicable.", "source": "LiveMint Money", "pub_date_str": "03 Oct 2026, 10:28 AM IST", "pub_date_relative": "1h ago"}, {"title": "Baththa Box Office Collection Day 2: Vijay Sethupathi Starrer Sees 80% Growth, Mints This Amount", "full_content": "Vijay Sethupathi-starrer 'Baththa' saw a clear jump on Day 2, rising from Rs 1.50 crore net on Day 1 to Rs 2.70 crore net, giving the film a boost during the long holiday weekend.", "source": "NDTV Profit", "pub_date_str": "03 Oct 2026, 10:22 AM IST", "pub_date_relative": "1h ago"}, {"title": "Concurrent Losers: 14 midcap stocks decline for 5 consecutive sessions", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News Concurrent Losers: 14 midcap stocks decline for 5 consecutive sessions Written by Ritesh Presswala , ETMarkets.com | Oct 03, 2026, 10:31:03 AM IST 1 / 16 \u200bConsistent Decline Over the last five trading sessions ended October 1, the benchmark Sensex declined 2.27%, or 1,671 points, to close at 71,909. The index recorded losses in four of the five sessions. During this period, from September 25 to October 1, around 18 stocks in the BSE MidCap index declined in each of the five sessions. From this group, we identified 14 stocks that cumulatively fell more than 5% over the same period. (Data Source: ACE Equity)", "source": "Economic Times Markets", "pub_date_str": "03 Oct 2026, 10:19 AM IST", "pub_date_relative": "1h ago"}, {"title": "Saudi Arabia Weighs Multi-Front Offensive Against Houthis: Reports", "full_content": "Saudi Arabia plans a possible offensive against Iran-backed Houthi forces in Yemen to regain control of the strategic Bab el-Mandeb strait.", "source": "NDTV Profit", "pub_date_str": "03 Oct 2026, 10:16 AM IST", "pub_date_relative": "1h ago"}, {"title": "A Hindu Monk, An AI Lab And Claude: Why Anthropic Turned To Indian Philosophy For Ethics", "full_content": "Swami Sarvapriyananda, head of the Vedanta Society of New York and a monk of the Ramakrishna Order, says the company flew him to its San Francisco headquarters to help shape how its Claude models think about right and wrong.", "source": "NDTV Profit", "pub_date_str": "03 Oct 2026, 10:13 AM IST", "pub_date_relative": "1h ago"}, {"title": "Bank holiday today, October 13: Are SBI, HDFC Bank, and other banks closed on Saturday?", "full_content": "Banks across India are open today, October 13, 2026, as it falls on the first Saturday of the month, which is a bank holiday.\n\nUnder the guidelines set by the Reserve Bank of India (RBI), all scheduled and non-scheduled banks observe mandatory closure on all second and fourth Saturdays, as well as every Sunday of the month. It means that on these days, customers will not be able to access in-branch services.\n\nThere are four Sundays this month, so banks will remain closed on 4, 11, 18, and 24 October. In addition to Sundays, banks will be closed on 10th October (second Saturday) and 24 October (fourth Saturday).\n\nApart from the second Saturdays and Sundays, banks are scheduled to remain closed for several days in October during the festive season.\n\nCustomers are also advised to check with their local bank branches for exact holiday applicability.\n\nMeanwhile, essential banking services remain operational nationwide despite the physical branch closures. Check which services are available on bank holidays:\n\nOnline banking services: During bank holidays, online banking services remain available nationwide to ensure uninterrupted access. Customers can use these services for convenient financial transactions.\n\nUPI: An individual can use UPI or the respective bank's app to make payments and receive money from others. These services work around the clock, whether banks are open or not. At times, it may be down due to scheduled maintenance, during which the banks will notify you.", "source": "LiveMint Money", "pub_date_str": "03 Oct 2026, 10:11 AM IST", "pub_date_relative": "1h ago"}, {"title": "G7 to release 100 million barrels of oil and diesel after Trump export ban threat - BBC", "full_content": "G7 to release 100 million barrels of oil and diesel after Trump export ban threat BBC \u2018Blackmail\u2019: Europe fumes against White House demand for more diesel Politico World in Brief: G7 to release oil reserves; America\u2019s hiring slows The Economist G-7 Agrees to Release 100 Million Barrels of Diesel and Crude WSJ Tracking Trump: G-7 opens oil reserves; military prepares for a Middle East surge; Trump diverts aid to Latin America; and more The Washington Post", "source": "Google News Business", "pub_date_str": "03 Oct 2026, 10:08 AM IST", "pub_date_relative": "2h ago"}, {"title": "Bank Holiday Today: Are Banks Open Or Closed On Saturday, October 3? Check Here", "full_content": "October is a festive month, with Durga Puja and Dussehra leading to closures in a larger number of states.", "source": "NDTV Profit", "pub_date_str": "03 Oct 2026, 10:08 AM IST", "pub_date_relative": "2h ago"}, {"title": "North Korea Launches Projectile Into Eastern Waters After Fresh South Korea Row", "full_content": "The launch came a day after Kim Yo Jong, the sister of North Korean leader Kim Jong Un, ridiculed South Korean demands that Pyongyang apologise for the mine explosions.", "source": "NDTV Profit", "pub_date_str": "03 Oct 2026, 10:08 AM IST", "pub_date_relative": "2h ago"}, {"title": "Fed\u2019s Hammack says there is time to weigh next rate move", "full_content": "", "source": "Investing.com News", "pub_date_str": "03 Oct 2026, 10:01 AM IST", "pub_date_relative": "2h ago"}, {"title": "Azad Engineering shares: Up 85% in 6 months; stock to buy, says ICICI Securities - Check revised share price target", "full_content": "Azad Engineering Ltd has gained 85% in the past six months, and the stock has received a fresh boost from ICICI Securities, which retained its BUY rating and raised its target price to \u20b9 3,200 from \u20b9 1,900 earlier. The brokerage has rolled forward its valuation to FY29 and applied a target multiple of 55 times estimated FY29 earnings per share ( EPS ).\n\nThe revised target reflects the company's expanding manufacturing capacity, improving order visibility, and expectations of stronger earnings over the coming years. \"We are introducing FY29 estimates and rolling over our target multiple to FY29, arriving at a target price of INR 3,200 (55x FY29E EPS),\" ICICI Securities said.\n\nAzad Engineering 's stock has already delivered strong returns across multiple timeframes. The shares have gained around 3% in one month, 38% in three months, and 77% over the past year, highlighting the sharp re-rating witnessed in the stock.\n\nAccording to the brokerage, a key development has been the inauguration of two dedicated manufacturing facilities for GE Vernova's gas power business at Azad Engineering's Centre of Excellence & Innovation Centre in Hyderabad. Spread across 15,200 square metres, the facilities represent the company's largest single-tranche capacity addition so far.\n\nThe new facilities take Azad Engineering's dedicated GE footprint to three units and deepen its integration with the global energy major. Of the seven dedicated facilities planned by the company, six have now been commissioned, along with a forging unit, it noted.\n\nICICI Securities expects follow-on large orders from GE Vernova, which could provide the newly commissioned facilities with an estimated five to six years of visibility.", "source": "LiveMint Markets", "pub_date_str": "03 Oct 2026, 09:52 AM IST", "pub_date_relative": "2h ago"}, {"title": "India vs Pakistan Live Streaming: When And Where To Watch Asian Games 2026 Final", "full_content": "India will bat first after winning the toss in the Asian Games 2026 men's T20 gold medal match against Pakistan on October 3.", "source": "NDTV Profit", "pub_date_str": "03 Oct 2026, 09:48 AM IST", "pub_date_relative": "2h ago"}, {"title": "Bleak Winter! Why analysts are hinting at painful October even after 8 weeks of Nifty correction?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Bleak Winter! Why analysts are hinting at painful October even after 8 weeks of Nifty correction? Arihant Capital Markets Share Price Fedders Holding Share Price Gyftr Share Price Saraswati Commercial (India) Share Price Crest Ventures Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Bleak Winter! Why analysts are hinting at painful October even after 8 weeks of months, the indicative DA/DR rate would move higher, reaching around 66.91% by November. This points to a potential 67% DA/DR from January 2027, subject to the final CPI-IW numbers and the government's decision.\n\nThe current DA rate from July 2026 is 63%, according to the StaffNews calculation. If the January 2027 rate is eventually fixed at 67%, it would represent a 4 percentage-point increase over the current rate.\n\nFor an employee with a basic pay of \u20b9 30,000, a 4 percentage-point increase would mean an additional \u20b9 1,200 per month in DA.\n\nSimilarly, if your basic pay is \u20b9 40,000, the DA will increase by \u20b9 1,600 a month and an employee with \u20b9 50,000 basic pay would get \u20b9 2,000 more per month.\n\nHowever, the actual January 2027 DA rate is not yet confirmed. Four more CPI-IW readings will determine the final calculation, followed by the government's formal decision.\n\nThe Confederation of Central Government Employees and Workers recently urged the Department of Expenditure to expedite the process for the July 2026 DA/DR instalment, effective from 1 July. And also said that it should be placed before the competent authority once the relevant Consumer Price Index (CPI) data and prescribed formula allow the new rate to be determined", "source": "LiveMint Money", "pub_date_str": "03 Oct 2026, 09:40 AM IST", "pub_date_relative": "2h ago"}, {"title": "\u200bBonus issues & stock split: 5 stocks rewarding shareholders next week", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u200bBonus issues & stock split: 5 stocks rewarding shareholders next week Written by Debaroti Adhikary , ETMarkets.com | Oct 03, 2026, 09:39:35 AM IST 1 / 7 Corporate Radar At least five companies have fixed their record dates for bonus issues or stock splits for this week between October 5 (Monday) and October 9 (Friday). Interested investors need to hold shares of these companies in their demat accounts on or before the record date to be eligible for corporate actions. The list remains tentative as more companies may announce record dates for bonus issues and stock splits during the week.\n\nA bonus issue consists of free shares distributed by a company from its reserves and is often seen as a sign of strong financial health and growth prospects. While the issue of bonus shares increases the total number of outstanding shares, it does not change the company\u2019s market capitalisation. However, it can improve liquidity and affordability, allowing more investors to add shares of the company to their portfolio.\n\nIn case of a stock split, the company splits every existing share into multiple shares. While the number of outstanding shares increases, the company\u2019s overall market capitalisation remains unchanged. A lower share price can make the stock more accessible to retail investors, potentially improving participation and trading volumes.\n\nBLS E-Services has fixed October 6 (Tuesday) as the record date for its 1:2 stock split. This means that every share as on the record date will split into two shares following the stock split. The value of each share will adjust to the corporate action on the record date.\n\nGTV Engineering has fixed October 7 (Wednesday) as the record date for a 2:1 bonus issue.", "source": "Economic Times Markets", "pub_date_str": "03 Oct 2026, 09:32 AM IST", "pub_date_relative": "2h ago"}, {"title": "Why rising exports aren\u2019t easing oil market fears", "full_content": "", "source": "Investing.com News", "pub_date_str": "03 Oct 2026, 09:32 AM IST", "pub_date_relative": "2h ago"}, {"title": "Rising gilt yields attract retail investors hunting for tax-efficient assets", "full_content": "30-year yields are above 6 per cent for the first time since 1998", "source": "FT Markets", "pub_date_str": "03 Oct 2026, 09:30 AM IST", "pub_date_relative  stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "03 Oct 2026, 09:01 AM IST", "pub_date_relative": "3h ago"}, {"title": "Spyre Therapeutics\u2019 chief legal officer sells $2.63m in shares", "full_content": "", "source": "Investing.com News", "pub_date_str": "03 Oct 2026, 09:00 AM IST", "pub_date_relative": "3h ago"}, {"title": "Natera CEO Steven Chapman sells $526k in common stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "03 Oct 2026, 09:00 AM IST", "pub_date_relative": "3h ago"}, {"title": "Is October a market crash month? 1929 crash to Black Monday 1987 - Why October scares equities, stocks investors", "full_content": "The Indian stock market entered October by recording its longest eighth straight weekly loss. It was the longest such streak of Nifty and Sensex in 25 years. The sharp decline on Thursday came as stock market investors entered October, which is infamous among global investors for incidents like Black Monday stock market crash in October 1987 and the Wall Street crash of 1929.\n\nAs October begins, let\u2019s revisit some of the biggest stock market crashes in October and understand how Nifty and Sensex have performed in the month over the last ten years.\n\nThe Black Monday stock market crash occurred on October 19, 1987. The Dow Jones Industrial Average fell nearly 22% in a single day. The catastrophic fall marked the largest single-day percentage drop in the US stock market history. As per media reports, the stock market crash in October wiped out nearly $ 500 billion in market capitalisation in the US alone.\n\nThe Wall Street crash of 1929 showed no mercy to investors as the Dow fell nearly 13% on October 28, people also call it as the Black Monday. The stock market crash was followed by nearly 12% decline the next day, which is known as Black Tuesday.\n\nThe US stock market saw sharp decline in October, 2008, which represented the absolute peak of the 2008 Global Financial Crisis. The crisis was triggered by an economic downturn due to the collapse of the US housing market and subprime mortgage defaults.\n\nNifty and Sensex have showcased range bound movement in October, the analysis of last 10 year data shows. The Nifty 50 ended last October with 4.51% gain, fell 6.2% in October 2024. The benchmark index surged nearly 5.4% in Otober 2022, but saw marginal gain in October 2021. Nifty 50 surged around 3.5% in 2020 and 3.5% in 2019.\n\nCatch all the Business News , Market News , Breaking News Events and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.\n\nLog in to our website to save your bookmarks. It'll just take a moment.", "source": "LiveMint Markets", "pub_date_str": "03 Oct 2026, 09:00 AM IST", "pub_date_relative": "3h ago"}, {"title": "The Hook: AI Search Is Changing Digital Marketing. How Can Brands Get Recommended?", "full_content": "AI is shifting consumer product discovery from traditional search rankings to AI-driven recommendations, prompting brands to focus on relevance and credibility across multiple platforms.", "source": "NDTV Profit", "pub_date_str": "03 Oct 2026, 09:00 AM IST", "pub_date_relative": "3h ago"}, {"title": "Cyclospora found at Mexican farm linked to lettuce outbreak, FDA says - The Guardian", "full_content": "Cyclospora found at Mexican farm linked to lettuce outbreak, FDA says The Guardian FDA found cyclospora at Taylor Farms Mexico site and where lettuce was grown The Washington Post FDA finds potential source of cyclosporiasis outbreak linked to lettuce ABC News - Breaking News, Latest News and Videos US FDA closes cyclospora lettuce parasite probe, finds strong link to Taylor Farms Mexico Reuters F.D.A. Found Cyclospora During Taylor Farms Inspection in Mexico The New York Times", "source": "Google News Business", "pub_date_str": "03 Oct 2026, 08:50 AM IST", "pub_date_relative": "3h ago"}, {"title": "'Jantar Mantar 2.0': CJP Announces Oct 10 Protest Demanding CEC Gyanesh Kumar\u2019s Exit", "full_content": "The CJP has announced a Jantar Mantar protest in Delhi on October 10, demanding CEC Gyanesh Kumar\u2019s resignation over alleged SIR irregularities. Convenor Abhijit Dipke said the demonstration would remain peaceful.", "source": "NDTV Profit", "pub_date_str": "03 Oct 2026, 08:40 AM IST", "pub_date_relative": "3h ago"}], "cfa": [{"title": "Copper boom stocks: Hindustan Copper, Vedanta Aluminium, Hindustan Zinc, Vedanta, NALCO - Experts views on metal shares", "full_content": "Rising demand from essential industries and limited supply growth are likely to support the copper prices in the long-term. As copper prices continue to remain near record high levels, non-ferrous equities like Hindustan Copper , National Aluminium Company Limited, Vedanta Aluminium Metal , Vedanta Limited and Hindustan Zinc are likely to benefit from the situation, according to an Aditya Birla Capital report.\n\n\u201cA combination of limited new mine supply, rising strategic demand, and increasing focus on supply chain security is creating a commodity cycle which is different from the traditional demand-led cycles, in our view ,\u201d read the report.\n\nCombination of factors like new demand avenues, limited mine development projects and delayed expansions are likely to push the copper market into a prolonged deficit. These factors are likely to support elevated copper prices.\n\n\u201cWe expect non-ferrous equities to benefit as the cycle broadens in scope, particularly stocks like HCP, NACL, VAML, HZ, VEDL (Not Rated) which have varying degrees of exposure to various industrial metals,\u201d stated the brokerage in its report.\n\nThe global metals and mining sector has seen a sharp growth over the past years, and the brokerage believes \"that the cycle remains in its early stages.\"\n\nIn such a scenario companies like National Aluminium Company Limited, Hindustan Copper, Hindustan Zinc and Gujarat Mineral and Development Corporation (GMDC) are building capabilities across rare earths and crucial minerals, stated the brokerage in its report. It also highlighted that non-ferrous players will be the direct beneficiaries and will be supported by strong earnings growth.\n\nNALCO share price closed 2.38% lower at \u20b9 334.15 per share on BSE with a market capitalization of \u20b9 61,371.05 crore on BSE on Thursday, October 1.", "source": "LiveMint Markets", "pub_date_str": "03 Oct 2026, 12:01 PM IST", "pub_date_relative": "8m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Policybazaar, Paisabazaar share: PB Fintech stock down 48% in 6 days, more pain ahead - Here\u2019s why | Revised target", "full_content": "Shares of PB Fintech , the parent company of Policybazaar and Paisabazaar, have been under intense selling pressure, extending their losing streak to six consecutive sessions and falling around 48% during the period. The sharp decline has come as investors reassess the potential impact of proposed changes to insurance commissions and distribution economics.\n\nThe stock hit its 52-week low of \u20b9 965 on October 1. It has now tanked over 50% from its 52-week high of \u20b9 1,963.00, hit in December last year. The scrip has shed 42% in 3 months, 31% in 6 months and 41% in the last 1 year.\n\nThe sell-off has raised concerns over the earnings outlook for insurance intermediaries, particularly companies that rely on commissions and distribution fees. Several brokerages have since revised their estimates or valuation assumptions for PB Fintech, with concerns centred on the extent to which the proposed regulatory changes could affect its general insurance and point-of-sales person (POSP) businesses.\n\nThe pressure on PB Fintech shares intensified after the Insurance Regulatory and Development Authority of India ( IRDAI ) proposed sweeping changes to insurance distribution rules. The draft reforms are aimed at reducing insurance costs, improving transparency and expanding coverage, while also bringing greater discipline to the distribution ecosystem.\n\nThe proposals include changes to Expenses of Management (EoM), segmental commission limits and restrictions on practices described as \u201cdark patterns\u201d. Under the proposed framework, insurers would need to provide customers with product and pricing information without requiring them to submit personal details upfront.\n\nIRDAI has also proposed greater disclosure of commission rates in policy documents and changes covering motor insurance .", "source": "LiveMint Markets", "pub_date_str": "03 Oct 2026, 11:49 AM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stocks to buy: Axis picks 7 largecap stocks with upside potential of up to 44%. See full list", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News Stocks to buy: Axis picks 7 largecap stocks with upside potential of up to 44%. See full list Written by Veer Sharma , ETMarkets.com | Oct 03, 2026, 11:49:27 AM IST 1 / 8 Value Bets The Indian stock market has just set a record, but not one investors hoped for. Dalal Street has logged losses for eight consecutive weeks, surpassing the streaks seen during the 2020 Covid-19 crash and the 2008 global financial crisis. Axis has picked 7 largecap stocks that have robust value after the sharp correction.\n\nAxis has set a price target of Rs 1,305, a 36% upside from current levels. The company is one of India\u2019s largest NBFCs for consumer finance, with a wide product portfolio comprising loans for two-wheelers, consumer durables, housing, and small businesses, among others.\n\nWith a price target of Rs 2,530, the brokerage has implied an upside potential of 44% from current levels. It is an Indian multinational telecommunications company operating in 18 countries across South Asia, Africa, and the Channel Islands. It is India's second-largest telecom operator, boasting a strong domestic presence and a comprehensive digital services portfolio that includes fibre optic networks, mobile and desktop telephony, and other digital solutions.\n\nWith a target price of Rs 1,800, the brokerage implies an upside potential of 36% from current levels. The lender is supported by a strong liability franchise and a healthy retail corporate mix. The bank\u2019s subsidiaries, such as ICICI Venture Funds, ICICI Pru AMC, ICICI Securities, ICICI Prudential, and ICICI Lombard, are among the leading companies in their respective domains.\n\nWith a target price of Rs 390, the brokerage implies an upside of 22% from current levels.", "source": "Economic Times Markets", "pub_date_str": "03 Oct 2026, 11:45 AM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Gold and silver price today, Oct 3: Check retail rates of 24K, 22K gold and 999 silver in your city ahead of Durga Puja", "full_content": "Gold and silver prices: The price of the yellow metal in India's retail market remained largely stable on Saturday, 3 October, with both 24-karat and 22-karat gold rates witnessing marginal changes across major cities. Silver prices also showed limited movement in the domestic bullion market.\n\nMulti commodity exchange of India (MCX) is closed on Saturdays and Sundays, hence live trading rates are currently unavailable. And on Friday, it was closed for Gandhi Jayanti. Based on Thursday's closing level, gold continued to trade above \u20b9 1.49 lakh, although it dia's top IT firms report September-quarter earnings.", "source": "NDTV Profit", "pub_date_str": "03 Oct 2026, 10:53 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stocks to buy: Galaxy Surfactants, Mankind Pharma and Engineers India; check share price target by Axis, rationale", "full_content": "Indian equities entered October on a weak technical footing, with both the benchmarks Nifty 50 and Sensex extending their declines.\n\nAccording to Axis Direct\u2019s weekly technical outlook, the Nifty has now formed a lower-low, lower-high pattern for eight consecutive weeks, marking its longest such streak since 2001. The brokerage said momentum indicators also point to continued weakness, although select stocks are showing stronger technical structures and could offer upside over the next three to four weeks.\n\nThe BSE Sensex declined nearly 4,320 points, or around 5.6\u20135.8%, during September. The NSE Nifty 50 also dropped around 1,364\u20131,450 points, or 5.7\u20136.1%.\n\nElevated US Treasury yields and a stronger US dollar have weighed on Indian markets. Meanwhile, continued FII selling, weak rupee , high crude oil prices, escalating tensions between US and Iran also added to the weak sentiment.\n\nThe Nifty 50 ended the week at 22,422, down around 718 points, after opening on a slightly negative note and witnessing sustained selling through the week. The weekly RSI has also been moving towards the oversold zone, signalling increasing bearish momentum.\n\n\"Technically, immediate support lies at 22,200. A decisive breakdown below this level would be a major red flag, potentially dragging the index lower toward 21,800. On the upside, immediate resistance is positioned at 22,800. A sustained breakout above this mark could propel the index higher toward 23,300,\" it stated.\n\nThe brokerage added that overall, the index seems to be heading lower, the price action around the 22,200 mark will be crucial to watch as a break below this will trigger major red flags and could push the index lower.\n\n\"We also expect the gains in the index to be capped as long as we do not see a sustained move above the 23,300 zone,\" Axis said.", "source": "LiveMint Markets", "pub_date_str": "03 Oct 2026, 10:47 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Fixed Income", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Jio Platforms IPO may open on October 21, issue estimated at $3.8 billion: Report", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a Jio Platforms IPO may open on October 21, issue estimated at $3.8 billion: Report Reliance Industries Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Jio Platforms IPO may open on October 21, issue estimated at $3.8 billion: Report SECTIONS Jio Platforms IPO may open on October 21, issue estimated at $3.8 billion: Report By Veer Sharma , ETMarkets.com Last Updated: Oct 03, 2026, 10:46:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The IPO is expected to remain open until October 23, with the anchor book likely to open on October 19. The shares are targeted to list on the stock exchanges on October 28, although the timeline remains subject to market conditions and could change depending on developments in financial markets, the report added.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "03 Oct 2026, 10:46 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "First Radio Signal From A Planet Beyond Our Solar System Detected - No, It's Not Aliens", "full_content": "Astronomers have detected the first direct radio emissions from an exoplanet, Beta Pictoris b. The natural auroral signal offers new insights into the planet\u2019s powerful magnetic field and distant planetary environments.", "source": "NDTV Profit", "pub_date_str": "03 Oct 2026, 10:37 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Robinhood stock tokens turbocharge a new era of meme trading", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Crypto \u203a Robinhood stock tokens turbocharge a new era of meme trading The Economic Times daily newspaper is available online now. Read Today's Paper Robinhood stock tokens turbocharge a new era of meme trading SECTIONS Robinhood stock tokens turbocharge a new era of meme trading By Muyao Shen, Sidhartha Shukla , Bloomberg Last Updated: Oct 03, 2026, 10:34:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Traders are actively engaging in memecoin and stock token swaps on Robinhood's platform, blurring traditional investment lines. The SEC has allowed temporary tokenized stock trades, reflecting a growing retail trend. Companies like AMC have expressed concerns over tokens trading without their involvement. As these trades evolve, stock prices may become detached from their underlying assets. This shift signifies a potential change in how risk is perceived by day traders.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "03 Oct 2026, 10:34 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "America\u2019s data center fight is a preview of what's to come for the rest of the world", "full_content": "As the AI boom becomes a major part of political debate, the public backlash against data centers in the U.S. is spreading to Europe and Asia \u2014 raising risks for investors.\n\nAcross the Atlantic, negative sentiment is growing in Europe, which has more at stake due to its densely populated countries and higher electricity prices , experts told CNBC.\n\nSimilar tensions are emerging in South Korea, with growing opposition to data centers near residential areas and proposals for tighter local restrictions, even as the national government pushes to accelerate development.\n\nPublic opposition has already impacted around $42 billion of data center investments in Europe, in account delays and cancellations, according to research from STL Partners. That compares to around $77 billion in the U.S.\n\nThe pushback could be the \"straw that breaks the camel's back,\" Olivier Darmouni, associate professor at HEC Paris who specializes in the energy transition, told CNBC.\n\nMore than 70 data center projects in Europe were rejected or restricted between January and April \u2014 more than in all of 2025, according to the European Data Center Monitor. It found that pushback had snowballed from local town halls to courts, regulators and parliaments.\n\nScotland has paused planning approvals for new hyperscale data centers after campaigners called on the government to avoid the \"cautionary tale\" of Ireland, where overwhelming power demand led to a moratorium.\n\nConstraints have been rising in the Nordics, where investors were drawn to large tracts of land and renewable energy. After a surge in power applications , Denmark passed an emergency law that could see data centers at the back of the queue for grid power applications.", "source": "CNBC World Economy", "pub_date_str": "03 Oct 2026, 10:30 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Think debt mutual fund gains are always taxed as short-term? Not if you bought them before this date", "full_content": "Debt mutual funds primarily invest in fixed-income securities such as government and corporate bonds, debentures, commercial papers and certificates of deposit. These less-risky funds are generally preferred by conservative savers and retirees seeking stable, fixed-income returns with high liquidity.\n\nFor tax purposes, mutual fund schemes that invest at least 65% of their assets in debt and money market instruments are classified as debt-oriented mutual funds. However, the tax treatment of profits made from these investments can depend on when the units were purchased.\n\nThe Union Budget 2023 announced major changes in the tax treatment of debt mutual fund gains for units bought on or after April 1, 2023.\n\nAs per the new rule, profits from specified debt-oriented funds are taxed as short-term capital gains, irrespective of how long the investor holds the units.\n\nThis means the benefit of indexation and long-term capital gains taxation that was available earlier is no longer available for these investments. As a result, these gains are added to the investor's taxable income and taxed according to their applicable income tax slab rate.\n\nThe rules are different for units purchased before April 1, 2023. These investments can still qualify for long-term capital gains treatment if the units are held for more than 24 months.\n\nProfits from selling old units of debt mutual fund are taxed at a flat rate of12.5%, still without indexation benefits, which can significantly affect the post-tax returns of debt fund investors.\n\nIf the holding period is 24 months or less, the gains would have been treated as short-term capital gains (STCG). Since this rule applies to units purchased in 2023 and the holding period has already exceeded two years, short-term capital gains tax rule is no longer applicable.", "source": "LiveMint Money", "pub_date_str": "03 Oct 2026, 10:28 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Concurrent Losers: 14 midcap stocks decline for 5 consecutive sessions", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News Concurrent Losers: 14 midcap stocks decline for 5 consecutive sessions Written by Ritesh Presswala , ETMarkets.com | Oct 03, 2026, 10:31:03 AM IST 1 / 16 \u200bConsistent Decline Over the last five trading sessions ended October 1, the benchmark Sensex declined 2.27%, or 1,671 points, to close at 71,909. The index recorded losses in four of the five sessions. During this period, from September 25 to October 1, around 18 stocks in the BSE MidCap index declined in each of the five sessions. From this group, we identified 14 stocks that cumulatively fell more than 5% over the same period. (Data Source: ACE Equity)", "source": "Economic Times Markets", "pub_date_str": "03 Oct 2026, 10:19 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "G7 to release 100 million barrels of oil and diesel after Trump export ban threat - BBC", "full_content": "G7 to release 100 million barrels of oil and diesel after Trump export ban threat BBC \u2018Blackmail\u2019: Europe fumes against White House demand for more diesel Politico World in Brief: G7 to release oil reserves; America\u2019s hiring slows The Economist G-7 Agrees to Release 100 Million Barrels of Diesel and Crude WSJ Tracking Trump: G-7 opens oil reserves; military prepares for a Middle East surge; Trump diverts aid to Latin America; and more The Washington Post", "source": "Google News Business", "pub_date_str": "03 Oct 2026, 10:08 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Azad Engineering shares: Up 85% in 6 months; stock to buy, says ICICI Securities - Check revised share price target", "full_content": "Azad Engineering Ltd has gained 85% in the past six months, and the stock has received a fresh boost from ICICI Securities, which retained its BUY rating and raised its target price to \u20b9 3,200 from \u20b9 1,900 earlier. The brokerage has rolled forward its valuation to FY29 and applied a target multiple of 55 times estimated FY29 earnings per share ( EPS ).\n\nThe revised target reflects the company's expanding manufacturing capacity, improving order visibility, and expectations of stronger earnings over the coming years. \"We are introducing FY29 estimates and rolling over our target multiple to FY29, arriving at a target price of INR 3,200 (55x FY29E EPS),\" ICICI Securities said.\n\nAzad Engineering 's stock has already delivered strong returns across multiple timeframes. The shares have gained around 3% in one month, 38% in three months, and 77% over the past year, highlighting the sharp re-rating witnessed in the stock.\n\nAccording to the brokerage, a key development has been the inauguration of two dedicated manufacturing facilities for GE Vernova's gas power business at Azad Engineering's Centre of Excellence & Innovation Centre in Hyderabad. Spread across 15,200 square metres, the facilities represent the company's largest single-tranche capacity addition so far.\n\nThe new facilities take Azad Engineering's dedicated GE footprint to three units and deepen its integration with the global energy major. Of the seven dedicated facilities planned by the company, six have now been commissioned, along with a forging unit, it noted.\n\nICICI Securities expects follow-on large orders from GE Vernova, which could provide the newly commissioned facilities with an estimated five to six years of visibility.", "source": "LiveMint Markets", "pub_date_str": "03 Oct 2026, 09:52 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "India vs Pakistan Live Streaming: When And Where To Watch Asian Games 2026 Final", "full_content": "India will bat first after winning the toss in the Asian Games 2026 men's T20 gold medal match against Pakistan on October 3.", "source": "NDTV Profit", "pub_date_str": "03 Oct 2026, 09:48 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Bleak Winter! Why analysts are hinting at painful October even after 8 weeks of Nifty correction?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Bleak Winter! Why analysts are hinting at painful October even after 8 weeks of Nifty correction? Arihant Capital Markets Share Price Fedders Holding Share Price Gyftr Share Price Saraswati Commercial (India) Share Price Crest Ventures Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Bleak Winter! Why analysts are hinting at painful October even after 8 weeks of Nifty correction? SECTIONS Bleak Winter! Why analysts are hinting at painful October even after 8 weeks of Nifty correction? By Akash Podishetti , ETMarkets.com Last Updated: Oct 03, 2026, 09:45:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The global backdrop remains the biggest problem. US yields above 5%, a firm dollar, higher crude prices and rupee weakness make India more vulnerable.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on f entage-point increase over the current rate.\n\nFor an employee with a basic pay of \u20b9 30,000, a 4 percentage-point increase would mean an additional \u20b9 1,200 per month in DA.\n\nSimilarly, if your basic pay is \u20b9 40,000, the DA will increase by \u20b9 1,600 a month and an employee with \u20b9 50,000 basic pay would get \u20b9 2,000 more per month.\n\nHowever, the actual January 2027 DA rate is not yet confirmed. Four more CPI-IW readings will determine the final calculation, followed by the government's formal decision.\n\nThe Confederation of Central Government Employees and Workers recently urged the Department of Expenditure to expedite the process for the July 2026 DA/DR instalment, effective from 1 July. And also said that it should be placed before the competent authority once the relevant Consumer Price Index (CPI) data and prescribed formula allow the new rate to be determined", "source": "LiveMint Money", "pub_date_str": "03 Oct 2026, 09:40 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "\u200bBonus issues & stock split: 5 stocks rewarding shareholders next week", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u200bBonus issues & stock split: 5 stocks rewarding shareholders next week Written by Debaroti Adhikary , ETMarkets.com | Oct 03, 2026, 09:39:35 AM IST 1 / 7 Corporate Radar At least five companies have fixed their record dates for bonus issues or stock splits for this week between October 5 (Monday) and October 9 (Friday). Interested investors need to hold shares of these companies in their demat accounts on or before the record date to be eligible for corporate actions. The list remains tentative as more companies may announce record dates for bonus issues and stock splits during the week.\n\nA bonus issue consists of free shares distributed by a company from its reserves and is often seen as a sign of strong financial health and growth prospects. While the issue of bonus shares increases the total number of outstanding shares, it does not change the company\u2019s market capitalisation. However, it can improve liquidity and affordability, allowing more investors to add shares of the company to their portfolio.\n\nIn case of a stock split, the company splits every existing share into multiple shares. While the number of outstanding shares increases, the company\u2019s overall market capitalisation remains unchanged. A lower share price can make the stock more accessible to retail investors, potentially improving participation and trading volumes.\n\nBLS E-Services has fixed October 6 (Tuesday) as the record date for its 1:2 stock split. This means that every share as on the record date will split into two shares following the stock split. The value of each share will adjust to the corporate action on the record date.\n\nGTV Engineering has fixed October 7 (Wednesday) as the record date for a 2:1 bonus issue.", "source": "Economic Times Markets", "pub_date_str": "03 Oct 2026, 09:32 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Portfolio Management"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Rising gilt yields attract retail investors hunting for tax-efficient assets", "full_content": "30-year yields are above 6 per cent for the first time since 1998", "source": "FT Markets", "pub_date_str": "03 Oct 2026, 09:30 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "The coming futures market in AI compute", "full_content": "CME Group plans is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "03 Oct 2026, 09:22 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Fixed Income", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Is October a market crash month? 1929 crash to Black Monday 1987 - Why October scares equities, stocks investors", "full_content": "The Indian stock market entered October by recording its longest eighth straight weekly loss. It was the longest such streak of Nifty and Sensex in 25 years. The sharp decline on Thursday came as stock market investors entered October, which is infamous among global investors for incidents like Black Monday stock market crash in October 1987 and the Wall Street crash of 1929.\n\nAs October begins, let\u2019s revisit some of the biggest stock market crashes in October and understand how Nifty and Sensex have performed in the month over the last ten years.\n\nThe Black Monday stock market crash occurred on October 19, 1987. The Dow Jones Industrial Average fell nearly 22% in a single day. The catastrophic fall marked the largest single-day percentage drop in the US stock market history. As per media reports, the stock market crash in October wiped out nearly $ 500 billion in market capitalisation in the US alone.\n\nThe Wall Street crash of 1929 showed no mercy to investors as the Dow fell nearly 13% on October 28, people also call it as the Black Monday. The stock market crash was followed by nearly 12% decline the next day, which is known as Black Tuesday.\n\nThe US stock market saw sharp decline in October, 2008, which represented the absolute peak of the 2008 Global Financial Crisis. The crisis was triggered by an economic downturn due to the collapse of the US housing market and subprime mortgage defaults.\n\nNifty and Sensex have showcased range bound movement in October, the analysis of last 10 year data shows. The Nifty 50 ended last October with 4.51% gain, fell 6.2% in October 2024. The benchmark index surged nearly 5.4% in Otober 2022, but saw marginal gain in October 2021. Nifty 50 surged around 3.5% in 2020 and 3.5% in 2019.\n\nCatch all the Business News , Market News , Breaking News Events and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.\n\nLog in to our website to save your bookmarks. It'll just take a moment.", "source": "LiveMint Markets", "pub_date_str": "03 Oct 2026, 09:00 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Cancellation OTPs, fake offers, and urgent pleas: How scammers are using tactics to defraud people and how to stay safe", "full_content": "Cyber frauds in India are becoming increasingly sophisticated, making it extremely difficult even for well-educated people to differentiate between a genuine request and a scam .\n\nEven well-educated people can fall prey to cyber fraud, often when they least expect it. For Prerna (name changed), a highly qualified working professional, it started with an offer that sounded too good to ignore: buy \u20b9 4,000 worth of products from a well-known skincare website and stand a chance to win an iPhone . On another occasion, a random caller claimed that her father had shared her number and asked her to transfer a specific amount of money. Then came another call, this time from someone claiming to be a Valmo delivery partner, who asked for a cancellation OTP for a cash-on-delivery order.\n\nWhile Prerna did not fall prey to the scams on the first two occasions, even she was confused by the third attempt. How could she possibly receive a message about a product being out for delivery when she had not placed an order? While she decided to ignore it for the time being, she was taken aback by what happened next.\n\nAfter the delivery partner reached her apartment, she tried convincing him that this was not her order and must have been a mistake. She repeatedly showed him her order page on the app, which did not have the said order. However, the so-called delivery partner refused to budge and sought a cancellation OTP \u2014 a move that Prerna initially thought was harmless, until it wasn't.\n\nAfter giving him the cancellation OTP, she told her family about the incident. They were aware of this tactic being used to scam people and empty their bank accounts. She immediately went into a state of panic and was asked to change her bank account passwords and UPI app PINs, thereby averting what could have been a traumatic experience for her.\n\nHowever, Prerna's experience is not an isolated one.", "source": "LiveMint Money", "pub_date_str": "03 Oct 2026, 08:38 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Trump Says US To Hold Off On Diesel Export Ban After G7 Release", "full_content": "Trump's declaration comes amid a record surge in prices for diesel, which fuels much of the modern economy, powering farm equipment", "source": "NDTV Profit", "pub_date_str": "03 Oct 2026, 08:18 AM IST", "pub_date_relative": "3h ago",     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
