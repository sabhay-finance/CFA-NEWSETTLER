    const allData = {"general": [{"title": "Senior citizen wrongly paid tax on tax-free bonds: What the \u20b99.91 lakh ITAT case means", "full_content": "An error in tax filing resulted in a senior citizen paying \u20b9 9.91 lakh in tax on interest from tax-free bonds. The individual has now secured relief from the Income Tax Appellate Tribunal (ITAT). The tribunal, after reviewing the basic facts of the case, has directed the concerned tax authorities to grant relief by issuing a refund along with applicable interest. The final order in this case was pronounced on 23 September 2026.\n\nThis is a very important case for taxpayers, as it offers several fundamental and vital lessons for day-to-day tax filing. This is because, in this case, the tribunal primarily distinguished between making a fresh tax-related claim and rectifying an error already apparent from the income tax return initially filed.\n\nIn this case, Ajay Kumar Bakaya, a senior citizen and resident of Gurugram, invested \u20b9 3 crore in tax-free bonds in February 2013. Out of this, \u20b9 2 crore was invested in India Infrastructure Finance Company Ltd (IIFCL) bonds. These bonds carried an interest rate of 8.48%. Whereas \u20b9 1 crore was invested in Rural Electrification Corporation (REC) bonds carrying 8.46% interest.\n\nAs per the Income Tax Act, 1961 , the interest from these bonds was exempt under Section 10(15)(iv)(h). Bakaya had reported the interest earned from these investments as \u2018exempt income\u2019 in his return for the assessment years (AYs) 2018-19 to 2024-25.\n\nStill, while filing his return for AY 2022-23, he erroneously reported \u20b9 25.42 lakh of bond interest as taxable income under \u2018income from other sources\u2019. This consisted of \u20b9 16.96 lakh from IIFCL and \u20b9 8.46 lakh from REC. The mistake resulted in an excess, i.e., additional tax of \u20b9 9,91,370.\n\nFurthermore, by the time Bakaya discovered the error, the deadline for filing a revised return unde hare Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "26 Sep 2026, 12:11 PM IST", "pub_date_relative": "56m ago"}, {"title": "Stocks to buy for long term: Vedanta Iron and Steel, Vedanta Oil and Gas or Vedanta Power: Which is better? Target, SL", "full_content": "Stocks to buy for the long term: After the listing of four demerged Vedanta Group stocks on 15 June 2026 \u2014 Vedanta Iron and Steel , Vedanta Oil and Gas , Vedanta Power , and Vedanta Aluminium Metal \u2014 Indian market observers are busy speculating about the outlook for these Anil Agarwal-led companies. Those who held Vedanta shares on the demerger record date, 1 May 2026, were allotted one share of the new entity for each Vedanta share. Since Vedanta was a portfolio holding, beneficiaries of the Vedanta demerger might find it tough to choose a long-term stock among the new entities.\n\nAccording to stock market experts, among the four new entities, Vedanta Iron and Steel, Vedanta Oil and Gas, and Vedanta Power are long-term plays, while Vedanta Aluminium Metal is purely a commodity play. They said that all four of these stocks can be added to one's portfolio to meet the long-term goal, but Vedanta Iron and Steel and Vedanta Oil and Gas shares are better suited for a long-term investment goal. Vedanta Power shares are better suited to meet the mid-term investment goal, while Vedanta Aluminium Metal shares are based on demand-supply constraints and their impact on the company's margins.\n\nHighlighting the fundamental difference between these four new Vedanta Group shares, Avinash Gorakshkar, Founder of Avinash Mentor Research, said, \u201cA long-term investor can keep all these four in one's portfolio, if they are a beneficiary of the Vedanta demerger, as they haven't paid anything for these four shares. However, for a new investor, it is important to know the theme that is going to play for these four new Vedanta Group companies.\u201d\n\nGorakshkar of Avinash Mentor Research said that Vedanta Iron and Steel and Vedanta Oil and Gas shares are purely long-term bets, as the core business of the Vedanta Group has shifted to these companies. When it comes to Vedanta Power shares, they are a seasonal play, like Tata Power, Adani Power, Jaiprakash Power, etc.", "source": "LiveMint Markets", "pub_date_str": "26 Sep 2026, 12:08 PM IST", "pub_date_relative": "59m ago"}, {"title": "Who Is Petal Gahlot? The Indian Diplomat Who Hit Back At Shehbaz Sharif At UN For Second Time", "full_content": "Petal Gahlot, an Indian Foreign Service officer at India\u2019s UN mission in New York, responded to Pakistan PM Shehbaz Sharif at the UN, reiterating India\u2019s position on Kashmir and raising concerns over cross-border terrorism.", "source": "NDTV Profit", "pub_date_str": "26 Sep 2026, 12:06 PM IST", "pub_date_relative": "1h ago"}, {"title": "Stocks to buy: Macquarie initiates Outperform rating on these 4 capital market stocks. Do you own any?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News Stocks to buy: Macquarie initiates Outperform rating on these 4 capital market stocks. Do you own any? Written by Debaroti Adhikary , Sep 26, 2026, 12:08:43 PM IST 1 / 5 \u200bBullish on Markets Macquarie has issued a bullish call on India\u2019s capital market industry and sees a powerful multiyear growth backdrop for market infrastructure firms as capital shifts into financial assets. The international brokerage in its report said Indians save $500 billion annually in financial assets and almost 50% of that is in cash and deposits. It added that this cash pool is ready for market-linked products which will drive a 16% CAGR in India\u2019s combined investment and wealth and exchanges revenue pool over FY26-30. It expects brokers and exchanges to benefit from a larger investor base, rising engagement and broader monetisation across investment products. Here are the capital market stocks it initiated coverage with \u2018Outperform\u2019 rating, apart from Angel One on which it has a \u2018Neutral\u2019 rating.\n\nMacquarie gave Groww the tag of a \u2018Disruptor\u2019 as it named the stock its top pick in the capital market industry. It noted that Groww is India's largest digital-first broker and share gainer in a 17-18% TAM CAGR market, driving 25% FY26-30 revenue growth and EBITDA margins toward 70%. CAS is a near-term drag, while wealth, AMC and new products are unpriced, the international brokerage said. It has an \u2018Outperform\u2019 rating on the stock with a target price of Rs 260 apiece.\n\nAlso read | $500 billion flywheel! Macquarie lists 3 drivers for strong growth in capital market stocks, lists top picks\n\nMacquarie has an \u2018Outperform\u2019 rating on the shares of Multi Commodity Exchange of India (MCX) with a target price of Rs 3,820 apiece, noting that the market still underprices platform optionality and cash-return potential.", "source": "Economic Times Markets", "pub_date_str": "26 Sep 2026, 12:03 PM IST", "pub_date_relative": "1h ago"}, {"title": "FIIs unlikely to return in large numbers without new growth engines in India: Bernstein", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a FIIs unlikely to return in large numbers without new growth engines in India: Bernstein The Economic Times daily newspaper is available online now. Read Today's Paper FIIs unlikely to return in large numbers without new growth engines in India: Bernstein SECTIONS FIIs unlikely to return in large numbers without new growth engines in India: Bernstein ANI Last Updated: Sep 26, 2026, 12:03:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Foreign Institutional Investors are expected to remain cautious regarding Indian equities over the coming year. A report indicates that significant foreign investment will depend on India's competitiveness in various sectors. Trends show that foreign investment patterns have shifted due to changing currency valuations and market dynamics. Despite recognizing early progress in sectors like semiconductors and deep-tech, these remain underdeveloped.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "26 Sep 2026, 12:03 PM IST", "pub_date_relative": "1h ago"}, {"title": "Greed and Fear index: BEL, Adani Energy to Eternal | Chris Wood's Jefferies India portfolio has 22 stocks for long term", "full_content": "Jefferies' Christopher Wood retained a constructive view on India's structural growth prospects, arguing that the country's investment story extends beyond the current global focus on artificial intelligence.\n\nIn his latest GREED & fear report dated September 24, Wood highlighted rising private-sector capital expenditure, manufacturing, renewable energy, electrification and infrastructure as key areas supporting India's longer-term growth.\n\nThe report noted that Jefferies' India research had identified six emerging growth areas combining government policy support with increasing private-sector participation: space, semiconductors , solar manufacturing, data centres, electronics and aerospace. Government support was visible through incentive schemes, tax holidays and localisation requirements.\n\n\u201cIndia continues to enjoy its own structural growth story which will prove resilient at a time when the current near all-consuming focus on AI diminishes,\" said Christopher Wood, Jefferies.\n\nWood also highlighted signs of improving private-sector investment. India's annualised nominal gross fixed capital formation-to-GDP ratio rose to 32.4% in the four quarters to June from 31.4% in the four quarters to December. Machinery-goods imports increased to US$66 billion in the 12 months to August 2026 from US$29 billion in FY21.\n\nEnergy emerged as one of the strongest structural themes in Wood's India assessment.", "source": "LiveMint Markets", "pub_date_str": "26 Sep 2026, 12:03 PM IST", "pub_date_relative": "1h ago"}, {"title": "Proto Labs CFO Daniel Schumacher sells $476,604 in stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "26 Sep 2026, 12:00 PM IST", "pub_date_relative": "1h ago"}, {"title": "India-Pakistan Water Row Escalates: Shehbaz Sharif Issues 'Act Of War' Warning At UN", "full_content": "Calling for water not to be used as a tool of coercion, Sharif said: 'Water must never be weaponised. Rivers should nourish nations, not divide them.'", "source": "NDTV Profit", "pub_date_str": "26 Sep 2026, 11:59 AM IST", "pub_date_relative": "1h ago"}, {"title": "Germany: Has the fiscal package finally reached the economy?", "full_content": "", "source": "Investing.com News", "pub_date_str": "26 Sep 2026, 11:57 AM IST", "pub_date_relative": "1h ago"}, {"title": "Why date_relative": "1h ago"}, {"title": "Iran awaits US response to Hormuz peace plan as Trump reportedly rejects deal", "full_content": "", "source": "Investing.com News", "pub_date_str": "26 Sep 2026, 11:36 AM IST", "pub_date_relative": "1h ago"}, {"title": "Repligen CEO Loeillot sells $2.46m in shares", "full_content": "", "source": "Investing.com News", "pub_date_str": "26 Sep 2026, 11:32 AM IST", "pub_date_relative": "1h ago"}, {"title": "Globalfoundries chief legal officer sells $15,316 in shares", "full_content": "", "source": "Investing.com News", "pub_date_str": "26 Sep 2026, 11:31 AM IST", "pub_date_relative": "1h ago"}, {"title": "Toll Brothers director Stephen East sells $108,792 in shares", "full_content": "", "source": "Investing.com News", "pub_date_str": "26 Sep 2026, 11:31 AM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "Senior citizen wrongly paid tax on tax-free bonds: What the \u20b99.91 lakh ITAT case means", "full_content": "An error in tax filing resulted in a senior citizen paying \u20b9 9.91 lakh in tax on interest from tax-free bonds. The individual has now secured relief from the Income Tax Appellate Tribunal (ITAT). The tribunal, after reviewing the basic facts of the case, has directed the concerned tax authorities to grant relief by issuing a refund along with applicable interest. The final order in this case was pronounced on 23 September 2026.\n\nThis is a very important case for taxpayers, as it offers several fundamental and vital lessons for day-to-day tax filing. This is because, in this case, the tribunal primarily distinguished between making a fresh tax-related claim and rectifying an error already apparent from the income tax return initially filed.\n\nIn this case, Ajay Kumar Bakaya, a senior citizen and resident of Gurugram, invested \u20b9 3 crore in tax-free bonds in February 2013. Out of this, \u20b9 2 crore was invested in India Infrastructure Finance Company Ltd (IIFCL) bonds. These bonds carried an interest rate of 8.48%. Whereas \u20b9 1 crore was invested in Rural Electrification Corporation (REC) bonds carrying 8.46% interest.\n\nAs per the Income Tax Act, 1961 , the interest from these bonds was exempt under Section 10(15)(iv)(h). Bakaya had reported the interest earned from these investments as \u2018exempt income\u2019 in his return for the assessment years (AYs) 2018-19 to 2024-25.\n\nStill, while filing his return for AY 2022-23, he erroneously reported \u20b9 25.42 lakh of bond interest as taxable income under \u2018income from other sources\u2019. This consisted of \u20b9 16.96 lakh from IIFCL and \u20b9 8.46 lakh from REC. The mistake resulted in an excess, i.e., additional tax of \u20b9 9,91,370.\n\nFurthermore, by the time Bakaya discovered the error, the deadline for filing a revised return under Section 139(5) of the Income Tax Act, 1961, had expired.", "source": "LiveMint Money", "pub_date_str": "26 Sep 2026, 12:56 PM IST", "pub_date_relative": "10m ago", "cfa_topics": ["Economics", "Fixed Income", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "ETMarkets Smart Talk | Rate-cut cycle over, RBI may be at cusp of rate hikes; yields could inch higher: Puneet Pal", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Bonds \u203a ETMarkets Smart Talk | Rate-cut cycle over, RBI may be at cusp of rate hikes; yields could inch higher: Puneet Pal Powered By The Economic Times daily newspaper is available online now. Read Today's Paper ETMarkets Smart Talk | Rate-cut cycle over, RBI may be at cusp of rate hikes; yields could inch higher: Puneet Pal SECTIONS ETMarkets Smart Talk | Rate-cut cycle over, RBI may be at cusp of rate hikes; yields could inch higher: Puneet Pal By Kshitij Anand , ETMarkets.com Last Updated: Sep 26  new PMS framework could potentially double industry size over time: APMI Chairman Vikas Khemani The Economic Times daily newspaper is available online now. Read Today's Paper SEBI\u2019s new PMS framework could potentially double industry size over time: APMI Chairman Vikas Khemani SECTIONS SEBI\u2019s new PMS framework could potentially double industry size over time: APMI Chairman Vikas Khemani By Kshitij Anand , ETMarkets.com Last Updated: Sep 26, 2026, 12:11:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis SEBI\u2019s revised PMS framework introduces PRIM, expands investment options and lowers the entry threshold to \u20b925 lakh. Industry leaders expect these changes to broaden PMS adoption, while global diversification, derivatives, independent fund managers and risk-adjusted performance gain importance for investors.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "26 Sep 2026, 12:11 PM IST", "pub_date_relative": "56m ago", "cfa_topics": ["Equity Investments", "Derivatives", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Stocks to buy for long term: Vedanta Iron and Steel, Vedanta Oil and Gas or Vedanta Power: Which is better? Target, SL", "full_content": "Stocks to buy for the long term: After the listing of four demerged Vedanta Group stocks on 15 June 2026 \u2014 Vedanta Iron and Steel , Vedanta Oil and Gas , Vedanta Power , and Vedanta Aluminium Metal \u2014 Indian market observers are busy speculating about the outlook for these Anil Agarwal-led companies. Those who held Vedanta shares on the demerger record date, 1 May 2026, were allotted one share of the new entity for each Vedanta share. Since Vedanta was a portfolio holding, beneficiaries of the Vedanta demerger might find it tough to choose a long-term stock among the new entities.\n\nAccording to stock market experts, among the four new entities, Vedanta Iron and Steel, Vedanta Oil and Gas, and Vedanta Power are long-term plays, while Vedanta Aluminium Metal is purely a commodity play. They said that all four of these stocks can be added to one's portfolio to meet the long-term goal, but Vedanta Iron and Steel and Vedanta Oil and Gas shares are better suited for a long-term investment goal. Vedanta Power shares are better suited to meet the mid-term investment goal, while Vedanta Aluminium Metal shares are based on demand-supply constraints and their impact on the company's margins.\n\nHighlighting the fundamental difference between these four new Vedanta Group shares, Avinash Gorakshkar, Founder of Avinash Mentor Research, said, \u201cA long-term investor can keep all these four in one's portfolio, if they are a beneficiary of the Vedanta demerger, as they haven't paid anything for these four shares. However, for a new investor, it is important to know the theme that is going to play for these four new Vedanta Group companies.\u201d\n\nGorakshkar of Avinash Mentor Research said that Vedanta Iron and Steel and Vedanta Oil and Gas shares are purely long-term bets, as the core business of the Vedanta Group has shifted to these companies. When it comes to Vedanta Power shares, they are a seasonal play, like Tata Power, Adani Power, Jaiprakash Power, etc.", "source": "LiveMint Markets", "pub_date_str": "26 Sep 2026, 12:08 PM IST", "pub_date_relative": "59m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Stocks to buy: Macquarie initiates Outperform rating on these 4 capital market stocks. Do you own any?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News Stocks to buy: Macquarie initiates Outperform rating on these 4 capital market stocks. Do you own any? Written by Debaroti Adhikary , Sep 26, 2026, 12:08:43 PM IST 1 / 5 \u200bBullish on Markets Macquarie has issued a bullish call on India\u2019s capital market industry and sees a powerful multiyear growth backdrop for market infrastructure firms as capital shifts into financial assets. The international brokerage in its report said Indians save $500 billion annually in financial assets and almost 50% of that is in cash and deposits. It added that this cash pool is ready for market-linked products which will drive a 16% CAGR in India\u2019s combined investment and wealth and exchanges revenue pool over FY26-30. It expects brokers and exchanges to benefit from a larger investor base, rising engagement and broader monetisation across investment products. Here are the capital market stocks it initiated coverage with \u2018Outperform\u2019 rating, apart from Angel One on which it has a \u2018Neutral\u2019 rating.\n\nMacquarie gave Groww the tag of a \u2018Disruptor\u2019 as it named the stock its top pick in the capital market industry. It noted that Groww is India's largest digital-first broker and share gainer in a 17-18% TAM CAGR market, driving 25% FY26-30 revenue growth and EBITDA margins toward 70%. CAS is a near-term drag, while wealth, AMC and new products are unpriced, the international brokerage said. It has an \u2018Outperform\u2019 rating on the stock with a target price of Rs 260 apiece.\n\nAlso read | $500 billion flywheel! Macquarie lists 3 drivers for strong growth in capital market stocks, lists top picks\n\nMacquarie has an \u2018Outperform\u2019 rating on the shares of Multi Commodity Exchange of India (MCX) with a target price of Rs 3,820 apiece, noting that the market still underprices platform optionality and cash-return potential.", "source": "Economic Times Markets", "pub_date_str": "26 Sep 2026, 12:03 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "FIIs unlikely to return in large numbers without new growth engines in India: Bernstein", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a FIIs unlikely to return in large numbers without new growth engines in India: Bernstein The Economic Times daily newspaper is available online now. Read Today's Paper FIIs unlikely to return in large numbers without new growth engines in India: Bernstein SECTIONS FIIs unlikely to return in large numbers without new growth engines in India: Bernstein ANI Last Updated: Sep 26, 2026, 12:03:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Foreign Institutional Investors are expected to remain cautious regarding Indian equities over the coming year. A report indicates that significant foreign investment will depend on India's competitiveness in various sectors. Trends show that foreign investment patterns have shifted due to changing currency valuations a Times Markets", "pub_date_str": "26 Sep 2026, 11:36 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "No ATM charges, banks to operate on Sunday: What initiatives did Centre take to minimise disruptions during 3-day strike", "full_content": "Bank customers across India could face disruption in accessing in-branch services from September 28 to 30, 2026, as the United Forum of Bank Unions (UFBU) has proposed a three-day nationwide strike to press for its key demands, which include pension tweaks and a five-day banking week.\n\nThe proposed strike follows the weekend holidays on September 26 and 27, raising concerns about an effective five-day disruption in banking operations.\n\nIt also coincides with the half-yearly closing of banks on September 30, an important date for activities such as provisioning, reconciliation, treasury operations, and other financial work.\n\nAgainst this backdrop, the government and banks of the country have taken several steps to prepare for the strike, in case it materialises. Here are some of the measures announced by the government so far.\n\nThe Finance Ministry on Wednesday released a communication, advising government departments to disburse September salaries, wages and pensions to employees ahead of schedule.\n\nAccording to an office memorandum issued by the Controller General of Accounts, salaries and wages can be released on Friday, September 25, instead of the usual payment date. Meanwhile, the adjustment, if any, will be made without exception from the salary or wages for October 2026.\n\nThe measure covers central government employees and pensioners, including Defence, Posts & Telecommunications.\n\nPublic-sector banks have also lifted charges on ATM transactions exceeding the free monthly limit during the three-day bank strike beginning September 28. The move allows cus     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
