y citizens continues to increase against a backdrop of enthusiastic and deep-pocketed Wall Street investors betting artificial intelligence is the economic engine of the future. And as data centers that power the answers for Google's Gemini, Meta's Muse, Anthropic's Claude and OpenAI's ChatGPT spread across the U.S. landscape, the financial firms are attempting to pitch investors on AI infrastructure as part of a real estate allocation that can diversify a portfolio.\n\nFor the most part, the funds from alternative investment companies promising investors a piece of the physical infrastructure powering the AI economy remain the province of institutional investors like pension funds. But the trend has to a limited degree also dipped into the retail investor market. Alternative investments giant Blackstone has been at the forefront, creating the Blackstone Digital Infrastructure Trust , a newly formed real estate investment trust, or REIT, that trades on the NYSE, earlier this year.\n\n\"We saw this as an opportunity to capture the whole market of stabilized data centers and build a home in the public market where we think it belongs,\" CEO Nick Pell said in a CNBC \"Squawk on the Street\" interview in May.\n\nWhile many new data center projects across the U.S. remain subject to shifts in public and political opinion \u2014 and various moratoriums including in the states of New York and Texas \u2014 the Blackstone REIT is primarily focusing on data centers in already mature markets such as Northern Virginia and Dallas, where sprawling data centers have had a significant presence that predates the AI boom.\n\n\"It is the lowest risk way to play,\" Pell said, adding that Blackstone can then hand-select data centers to offer investors from what it says is a $300 billion market. The company sold 87.5 million shares at $20 apiece in its mid-May debut.", "source": "CNBC World Economy", "pub_date_str": "09 Oct 2026, 07:29 PM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Pulse of the Street: Eight-week slide ends, but oil and earnings test recovery", "full_content": "Indian equities broke an eight-week losing streak, but the modest rebound offered limited reassurance as crude oil climbed above $100 a barrel and the central bank took a hawkish stance after a 25-basis-point rate hike.\n\nThe Nifty 50 rose 1.30% in the Friday session to 22,520.45, while the Sensex gained 1.23% to 72,472.33. Their weekly gains were narrower, at about 0.43% and 0.78%, respectively, halting the prolonged decline without establishing a convincing recovery.\n\nTanvi Kanchan, associate director at Anand Rathi Shares & Stock Brokers, described the advance as a relief rally, with elevated oil prices, rupee weakness and high US bond yields continuing to weigh on sentiment.\n\nValuations had become more supportive, she said, with the Nifty trading around 19 times trailing earnings, below its long-term median. A sustained recovery, however, would require easing foreign selling, broader sector participation and an end to earnings downgrades.\n\nSumit Singhania, head of research at Bajaj Broking, echoed this: \u201cA combination of falling crude, easing inflation and improving foreign flows would offer the clearest signal of a transition from the current cautious phase to a sustainable recovery.\u201d\n\nThe Reserve Bank of India's (RBI) monetary policy committee unanimously raised the repo rate by 25 basis points to 5.50%, its first increase since February 2023. It also raised its FY27 growth forecast to 7.1% and its inflation projection to 5.2%.\n\nStronger growth offers support for corporate revenues, but the shift to calibrated tightening leaves businesses facing higher financing costs alongside renewed energy pressures.\n\nKanchan said the growth upgrade suggested demand was holding up, but companies\u2019 ability to pass on costs would determine their profitability. Oil marketing companies, aviation, paints, chemicals and tyres were particularly exposed, while real estate, autos, consumer durables and smaller non-bank lenders faced pressure from higher borrowing costs.", "source": "LiveMint Markets", "pub_date_str": "09 Oct 2026, 07:27 PM IST", "pub_date_relative": "32m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Fixed Income", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "US stocks: US market opens higher as oil slips; telecoms hit by SpaceX spectrum deal", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a US stocks: US market opens higher as oil slips; telecoms hit by SpaceX spectrum deal Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US stocks: US market opens higher as oil slips; telecoms hit by SpaceX spectrum deal SECTIONS US stocks: US market opens higher as oil slips; telecoms hit by SpaceX spectrum deal Reuters Last Updated: Oct 09, 2026, 07:26:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Wall Street opened on a positive note this Friday as oil prices dipped, easing worries over Middle Eastern supply issues. The Dow Jones Industrial Average, S&P 500, and Nasdaq Composite each experienced a rise at the open. Nonetheless, the telecom industry faced headwinds following SpaceX's spectrum purchase, sparking competitive anxiety among its players, showcasing the market's mixed responses to sector-specific events.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "09 Oct 2026, 07:26 PM IST", "pub_date_relative": "32m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Kalshi traders see high odds that more than 5,100 data centers will be planned or operating before 2027", "full_content": "Public backlash is rising against the construction of data centers, but Kalshi traders see a higher likelihood that the number of data centers planned or operating before the new year will top 5,000.\n\nPrediction market platform Kalshi shows a 75% chance that there will be more than 5,100 proposed and live data centers before 2027. In just two weeks, the likelihood has jumped from 60%.\n\nThe contract's odds will be resolved and verified by Data Center Map, which plots out planned and running data centers on its website.\n\nSo far, there are more than 4,700 operating and planned data centers in the U.S., according to Data Center Map. Among states, Virginia is in the lead with more than 670 planned and on-line facilities, followed by Texas with 537 and California with more than 200, Data Center Map found.\n\nTech companies have been growing their data center footprint in states like Texas , New Mexico and Arizona . The buildout has faced backlash from communities and activists who argue such projects would raise utility costs for locals and consume significant amounts of water.\n\nLast month Bloomberg reported , citing sources familiar, that Oracle sent its developer a \"force majeure\" notice tied to its New Mexico data center project in a bid to protect itself from higher expenses in the event the project doesn't come online in 2028 as anticipated.\n\nOracle's proposed data center also hit snags this summer after New Mexico regulators turned down applications for a gas pipeline project to fuel it, Bloomberg reported .\n\nDisclosure: CNBC and Kalshi have a commercial relationship that includes customer acquisition and a minority investment.", "source": "CNBC Top News", "pub_date_str": "09 Oct 2026, 07:23 PM IST", "pub_date_relative": "35m ago", "cfa_topics": ["Corporate Issuers", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "SpaceX deal to acquire spectrum license hammers shares of AT&T, Verizon and T-Mobile", "full_content": "SpaceX announced an agreement on Thursday to purchase a nationwide spectrum portfolio as it pushes its Starlink service deeper into the U.S. telecommunications market.\n\nShares of AT&T , Verizon and T-Mobile all tumbled on Friday. SpaceX stock climbed about 2%.\n\nThe deal involves the acquisition of a spectrum portfolio from Grain Management, which specializes in digital infrastructure, and is subject to approval by the Federal Communications Commission. SpaceX said in a statement that it's a \"license portfolio of up to 14 megahertz of paired spectrum in the 800 MHz band.\"\n\n\"This prime low-band spectrum addresses one of the key remaining technical gaps that will pave the way for Starlink Mobile to become a major mobile carrier in the US,\" SpaceX said.\n\nIn a post on X, SpaceX CEO Elon Musk called it a \"very big deal.\"\n\nLast week, T-Mobile, AT&T and Verizon formed a joint venture \"focused on expanding coverage in underserved areas,\" via satellite and direct-to-device (D2D) services, and Starlink was notably absent. T-Mobile has also previously removed mention of Starlink from its T-Satellite promotions.\n\nT-Mobile, Verizon and AT&T stock chart SpaceX appears determined to battle telecommunications giants in the U.S., and deliver its own services without them.\n\n\"This adds fuel to the fire in the battle between SpaceX and the mobile operators,\" said TMF Associates' Tim Farrar, an industry expert. \"But it's still a very limited amount of spectrum and to get reliable building penetration in urban areas SpaceX would have to deploy towers on the ground.\"", "source": "CNBC World Economy", "pub_date_str": "09 Oct 2026, 07:22 PM IST", "pub_date_relative": "36m ago", "cfa_topics": ["Corporate Issuers", "Alternative Investments", "Portfolio Management"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Jio Platforms said to set IPO price band, listing likely in October", "full_content": "Jio Platforms Ltd. is set to price its shares at \u20b9 1,065-1,119 apiece in its planned initial public offering, according to people familiar with the matter.\n\nThe company is targeting a market value of as much as \u20b9 10.3 lakh crore, the people said, asking not to be identified because the information isn\u2019t yet public. At the upper end of the price band, the Jio IPO would raise about \u20b9 30,200 crore, according to Bloomberg calculations. That would keep it on track to become India\u2019s largest-ever IPO.\n\nThe telecom and digital services arm of billionaire Mukesh Ambani\u2019s Reliance Industries Ltd. plans to open public subscription on 21 October and close it two days later, the people said. The anchor book is scheduled to open on 19 October, with the shares expected to begin trading on 28 October, they said.\n\nDeliberations are ongoing and details including the price range, valuation and timing could still change, the people said.\n\nA Reliance Industries representative did not offer any immediate comments.\n\nThe valuation falls short of some earlier expectations, though the offering is still poised to surpass Hyundai Motor India Ltd.'s \u20b9 27,800-crore share sale in October 2024, the country\u2019s biggest. That will be a major test of investor appetite for large share sales in one of the world\u2019s busiest markets for equity fundraising.\n\nJio filed its draft prospectus in June for an offering of as many as 270 million new shares, equivalent to about 2.93% of its post-issue equity capital, according to Bloomberg calculations. The company was earlier poised to seek a valuation of about \u20b9 11 lakh crore, people familiar with the matter have said. Valuations floated earlier were even higher, in the range of $130 billion to $170 billion at one point.", "source": "LiveMint Markets", "pub_date_str": "09 Oct 2026, 07:22 PM IST", "pub_date_relative": "37m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Should I put my nest egg in a 30-year Treasury bond?", "full_content": "Risk comes in many forms, even with \u201csafe\u201d investments.", "source": "MarketWatch Top Stories", "pub_date_str": "09 Oct 2026, 07:21 PM IST", "pub_date_relative": "38m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "OpenAI and Anthropic poach Trump officials as industry fights for Washington\u2019s trust", "full_content": "This report is from this week's The Tech Download newsletter. Like what you see? You can subscribe here.\n\nAnthropic and OpenAI are poaching officials from the Trump administration for senior roles as the AI sector scrambles to strengthen ties to Washington, with frontier tech increasingly viewed as a national security issue.\n\nThis year, Anthropic has appointed at least two former Trump officials, one to its board and another as the head of its frontier compute strategy. OpenAI has hired at least three from the president\u2019s administrations to work across strategy and special projects.\n\nCompanies developing frontier AI have been racing to build relationships with the U.S. President Donald Trump\u2019s White House, amid growing calls for regulation and in the wake of a number of cybersecurity incidents caused by rogue AI systems.\n\n\"Frontier AI companies are aware that the Trump administration has a lot of levers over their business, from federal procurement and supply-chain designations to export controls and everything in between, and that it's willing to use them,\" said Michelle Nie Duncan, visiting fellow with the technology and national security program at the Center for a New American Security.\n\n\"They have learned from the Anthropic episode that it pays to be on the good side of the White House,\" she told CNBC. A U.S. appeals court upheld a Pentagon designation of Anthropic as a supply chain risk in September, after a public spat between the two parties at the start of the year.\n\nOpenAI directed CNBC to previously released statements about two of its former Trump official appointments when approached for comment. Anthropic and the White House did not respond to a request for comment.\n\nWhile Trump has called AI safety concerns a \"hoax\" and advocated for self-regulation from AI companies, he has also said the Department of Justice and other law enforcement bodies could \"rein\" in AI.", "source": "CNBC World Economy", "pub_date_str": "09 Oct 2026, 07:19 PM IST", "pub_date_relative": "39m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Poonawalla Fincorp Q2 Results: Profit skyrockets 407% YoY to Rs 375 crore, NII rises 81%", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a Earnings \u203a Poonawalla Fincorp Q2 Results: Profit skyrockets 407% YoY to Rs 375 crore, NII rises 81% Poonawalla Fincorp Share Price L&T Finance Share Price Motilal Oswal Financial Services Share Price HDB Financial Services Share Price Piramal Finance Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Poonawalla Fincorp Q2 Results: Profit skyrockets 407% YoY to Rs 375 crore, NII rises 81% SECTIONS Poonawalla Fincorp Q2 Results: Profit skyrockets 407% YoY to Rs 375 crore, NII rises 81% By Kumar Gaurav , ETMarkets.com Last Updated: Oct 09, 2026, 07:13:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Poonawalla Fincorp reported a 407% year-on-year surge in Q2FY27 profit to Rs 375 crore, while net interest income rose 81%. Operating profit more than doubled, supported by business growth, improving asset quality and an expanded gold loan network.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "09 Oct 2026, 07:13 PM IST", "pub_date_relative": "45m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Bull market turns four next week. Rallies that make it this far usually keep going", "full_content": "With all the consternation around bond yields and energy prices, Wall Street could use some positive news.", "source": "CNBC Top News", "pub_date_str": "09 Oct 2026, 07:12 PM IST", "pub_date_relative": "47m ago", "cfa_topics": ["Equity Investments", "Fixed Income"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Anand Rathi Wealth Q2 Results: Profit rises 22% to Rs 122 crore; co declares dividend of Rs 4 per share", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a Earnings \u203a Anand Rathi Wealth Q2 Results: Profit rises 22% to Rs 122 crore; co declares dividend of Rs 4 per share Anand Rathi Wealth Share Price 360 One Wam Share Price Nuvama Wealth Management Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Anand Rathi Wealth Q2 Results: Profit rises 22% to Rs 122 crore; co declares dividend of Rs 4 per share SECTIONS Anand Rathi Wealth Q2 Results: Profit rises 22% to Rs 122 crore; co declares dividend of Rs 4 per share By Akash Podishetti , ETMarkets.com Last Updated: Oct 09, 2026, 07:12:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Anand Rathi Wealth reported a 22% year-on-year rise in Q2 business profit to Rs 122 crore, with revenue increasing 16%. Assets under management reached Rs 1.08 lakh crore as quarterly net inflows hit a record Rs 4,186 crore.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "09 Oct 2026, 07:12 PM IST", "pub_date_relative": "47m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Delta Air Lines cuts 2026 forecast on fuel surge, but CEO says demand is still strong", "full_content": "Delta Air Lines slashed its 2026 profit outlook as high fuel prices persist, but CEO Ed Bastian said higher fares aren't turning off travelers.\n\nDelta on Friday forecast full-year earnings per share of between $5.10 and $5.60 on an adjusted basis, compared with its outlook in July, when fuel prices were lower, of $6.50 to $7.50 a share. The company's fourth-quarter guidance was below analyst estimates, too.\n\nDelta cut its free cash flow outlook for the year to $2.5 billion, from as much as $4 billion it expected in July.\n\nStill, Bastian said in an interview that fares have continued to tick up as the airline passes along much of a $6 billion increase in fuel costs this year, and that travelers keep booking. Jet fuel prices in the U.S. Gulf of Mexico region have almost doubled to $4.34 on Thursday from $2.19 a year earlier, according to FactSet.\n\n\"The consumer response continues to be quite strong. We're seeing it across all channels, all cabins of service, all geographies, business, leisure,\" he said.\n\nDelta forecast a 20% increase in revenue for the fourth quarter over the same period last year, more than the 16% rise in the third quarter, when adjusting for the airline's benefit from its refinery in Trainer, Pennsylvania, where it refines crude oil into jet fuel and other products, giving it an advantage over other carriers.\n\n\"Obviously the fuel pricing, the volatility of fuel prices have something to do with that,\" Bastian said.\n\nDelta is the country's most profitable airline and the first to report results from the third quarter, which encompasses the busy summer season.", "source": "CNBC Top News", "pub_date_str": "09 Oct 2026, 07:08 PM IST", "pub_date_relative": "51m ago", "cfa_topics": ["Financial Statement Analysis", "Derivatives", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stock Market Today: Dow, S&P 500 and Nasdaq open higher as tech stocks rebound - MarketWatch", "full_content": "Stock Market Today: Dow, S&P 500 and Nasdaq open higher as tech stocks rebound MarketWatch See more headlines & perspectives on Google News", "source": "Google News Business", "pub_date_str": "09 Oct 2026, 07:08 PM IST", "pub_date_relative": "51m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "GST cancellation rules FAQs: Application process, approval and changes recommended at 57th Council meeting", "full_content": "If you are a business owner registered under the Goods and Services Tax ( GST ) regime, whether running a small enterprise or a large business, you need to know how to cancel your GST registration and comply with the prescribed rules.\n\nThe Press Information Bureau (PIB) published a set of Frequently Asked Questions (FAQs) on cancellation of GST registration on Friday.\n\nThe FAQs explain the cancellation process, application deadlines, automatic acceptance and cancellation of registration, and changes recommended by the GST Council at its 57th meeting on 8 October 2026.\n\nYou can apply for cancellation if your business has been completely discontinued, closed, or transferred.\n\nOther grounds include a change in the constitution of the business resulting in a new Permanent Account Number (PAN), amalgamation, demerger or disposal of the business, or when you are no longer liable to be registered under GST.\n\nTaxpayers should apply within 30 days of the event warranting cancellation. However, this time limit does not apply when the sole proprietor dies.\n\nAccording to the PIB FAQs, taxpayers must submit FORM GST REG-16 online through the official GST portal.\n\nLog in to the official GST portal, go to Services, then Registration, and then Application for Cancellation of Registration, and provide the reason for cancellation, the date from which you want the registration to be cancelled, closing-stock details, and any associated tax liabilities.", "source": "LiveMint Money", "pub_date_str": "09 Oct 2026, 07:04 PM IST", "pub_date_relative": "54m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Half of India\u2019s MTF book is in smallcaps; Nithin Kamath flags liquidity risks", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Half of India\u2019s MTF book is in smallcaps; Nithin Kamath flags liquidity risks The Economic Times daily newspaper is available online now. Read Today's Paper Half of India\u2019s MTF book is in smallcaps; Nithin Kamath flags liquidity risks SECTIONS Half of India\u2019s MTF book is in smallcaps; Nithin Kamath flags liquidity risks By Kumar Gaurav , ETMarkets.com Last Updated: Oct 09, 2026, 07:01:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Zerodha founder Nithin Kamath warned that small and microcap stocks account for a substantial share of India\u2019s margin trading facility book. He highlighted liquidity risks during market downturns, when smaller stocks may face sharper selling pressure.\n\nMost of the growth in the industry's MTF book is in small and microcaps. These are the stocks where liquidity tends to dry up first when markets either fall or go sideways, like they are right now\ud83d\ude2c https://t.co/qH7kJ6O8ut\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "09 Oct 2026, 07:01 PM IST", "pub_date_relative": "57m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Aging bull: Why this 4-year-old stock-market rally still packs a punch", "full_content": "History shows bull markets that get past their fourth year rarely throw in the towel, according to Truist Advisory Services.", "source": "MarketWatch Top Stories", "pub_date_str": "09 Oct 2026, 07:00 PM IST", "pub_date_relative": "59m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Relief rally in Indian stock market; biggest weekly losing streak in 25 years snapped: What's next for Sensex, Nifty?", "full_content": "After suffering its biggest weekly loss in 25 years, the Indian stock market caught its breath as frontline indices rebounded to close the week higher, with Friday\u2019s session accounting for the bulk of the gains.\n\nThe Nifty 50 closed Friday\u2019s session 1.30% higher, recovering much of the previous day\u2019s losses. The rally also marked the index\u2019s biggest single-day gain since August, helping it post a weekly gain of 0.44%.\n\nSimilarly, the Sensex ended the week 0.78% higher. The rally was largely supported by strong gains in financial stocks as investors cheered the companies\u2019 strong quarterly business updates.\n\nIn addition, IT stocks lent much-needed support to the market, as TCS\u2019 September-quarter results boosted sentiment across the sector. Investors largely brushed aside the US government\u2019s decision to suspend some IT firms from the Permanent Labor Certification programme (PERM), instead focusing on TCS\u2019 quarterly performance.\n\nThe move is part of a broader effort by Washington to curb pathways to permanent residency for certain foreign workers.\n\nThe markets had remained under pressure amid rising crude oil prices, with Brent crude trading above $100 per barrel as tensions in West Asia persisted amid the threat of potential attacks on Iran. India is a major importer of crude oil, making higher prices a key risk for inflation and growth.\n\nHowever, in a major development, US President Donald Trump said the US would not attack Iran before the midterm elections while also citing productive discussions with Tehran.\n\nCommodity traders took note of the latest remarks, pushing Brent crude below $103 a barrel. However, risks remain elevated, as Trump has made similar announcements in the past, only to reverse course later.", "source": "LiveMint Markets", "pub_date_str": "09 Oct 2026, 06:55 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Anand Rathi Wealth Q2 results 2026: Dividend declared; check amount, record date, net profit, revenue and key financials", "full_content": "Anand Rathi Wealth Q2 results 2026: Anand Rathi Wealth Limited, on Friday, reported a 10.37% year-on-year (YoY) decline in its net consolidated profit in the second quarter of financial year 2026-27. Despite decline in Q2 profit, the company announced first 80% interim dividend .\n\nEarlier in the day, the stock closed 4.68% lower, after seeing selling pressure throughout the trading session.\n\nAnand Rathi\u2019s board of directors considered and approved interim dividend of \u20b9 4 per equity share, which is 80% of the stock\u2019s face value of \u20b9 5. The company had earlier announced a final dividend of \u20b9 7 per equity share in April this year.\n\nThe announced payout will be disbursed among eligible shareholders within \u201c30 days from the date of declaration as per applicable provisions of Companies Act, 2013,\u201d stated the firm in its exchange filing released on October 9.\n\nThe board has fixed Thursday, October 15, as the dividend record date to determine the eligibility of shareholders for the payout. Investors must own the stock before the record date to qualify for the corporate action. Hence, Wednesday, October 14, effectively becomes the last date for investors to buy the stock and qualify for the dividend.\n\nThe company reported a net profit (attributable to owners of the firm) of \u20b9 88.95 crore in Q2FY27, which is 10.37% lower than \u20b9 99.26 crore of profit reported in the same quarter in previous financial year. Anand Rathi\u2019s net profit stood at \u20b9 162.73 crore in Q1FY27. The company\u2019s net revenue from operations increased to \u20b9 343.98 crore in Q2FY27, against \u20b9 297.36 crore reported in Q1FY27.\n\nIn the first half of financial year 2026-27, its Asset Under Management (AUM) increased 18% annually to \u20b9 1,08,377 crore. The firm\u2019s net revenue surged 17% annually to \u20b9 693 crore in H1FY27. Earnings per share (EPS) surged 22% to \u20b9 7.3.\n\nThe stock closed 4.68% lower at \u20b9 2038.70 per share on NSE on Friday. Its share price value has surged 38.14% in one year and 331.44% in three years.", "source": "LiveMint Markets", "pub_date_str": "09 Oct 2026, 06:55 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Treasury's Bessent hires Trump's controversial former Fed board pick, Judy Shelton, as advisor", "full_content": "Judy Shelton, whose controversial economic ideas led the Senate to block her nomination to the Federal Reserve, has been appointed a counselor to Treasury Secretary Scott Bessent.\n\nThe Treasury said Shelton will advise Bessent on currency policy, \"with a particular focus on evaluating financial conditions in China.\"\n\nShelton is not known as a China expert. She authored \"The Coming Soviet Crash\" in 1989, followed by \"Money Meltdown,\" about the need for a unified international monetary regime, in 1994. Before joining Treasury, Shelton was a senior fellow at the Independent Institute, a free market think tank, and, before that, at the Hoover Institution at Stanford University. She holds a Ph.D. in business administration from the University of Utah.\n\n\"Throughout her career, she has specialized in analyzing the internal monetary and financial conditions of nations and their impact on exchange rates,\" The Treasury said in its announcement, which will be released later Friday.\n\nA bipartisan group of senators, including all Democrats and a handful of Republicans, rejected President Donald Trump 's 2019 nomination of Shelton as a Fed governor over her views on Fed independence, her support for the gold standard and her questioning whether the U.S. needed a central bank.\n\nHer appointment comes at what looks to be a time of turmoil at the Treasury regarding high-level personnel. A recent Wall Street Journal story cataloged seven Senate-confirmed officials who have left the department through the end of August. Only one position has been filled.\n\nBessent recently named David Zervos , former chief market strategist at Jefferies, as a counselor \u2014 the same job title as Shelton. Neither Shelton nor Zervos require Senate approval.\n\nCorrection: Shelton authored \"Money Meltdown\" in 1994. An earlier version misstated the year. David Zervos is former chief market strategist at Jefferies. An earlier version misspelled the firm's name.", "source": "CNBC Top News", "pub_date_str": "09 Oct 2026, 06:39 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Tech stocks' resilience has puzzled investors. The options market could hold some clues", "full_content": "The unexpected never happens when you're looking for it, which may explain why tech stocks have remained so strong in the face of surging rates and questions about the AI complex. In the options pits, traders are the most prepared for a pullback since early Summer.\n\nThe Nasdaq-100 Index declined as much as 1.8% Thursday following a report from the Financial Times that ChatGPT owner OpenAI's revenues are coming up short. As the index slid, the number of open put contracts tied to the Invesco QQQ Trust relative to calls reached 1.49, the highest since the last week of June, according to Barchart data.\n\nThe metric isn't just the result of a one-day anomaly: the ratio has been moving in favor of puts since August, despite a steady climb in big-tech stock prices that culminated in a string of all-time highs up through Tuesday. On Wednesday, the two biggest options trades of the session, one in the State Street SPDR S&P 500 ETF Trust (SPY) and another in Meta Platforms (META), were bearish. In short, options traders have been loading up on protection on fears of a pullback, whether driven by rising rates of cracks in the AI narrative.\n\nInterpreting the message from the options market at this juncture is tricky. On the one hand, the buildup in hedges seen in the put/call ratio of QQQ suggests selloffs would be met with support as hedges turn to profit. One catch: the same ratio in the State Street SPDR S&P 500 ETF Trust (SPY) and S&P 500 Index (SPX) , is near average.\n\nAnd while the number of puts on QQQ increased Thursday, the biggest trades were actually bullish.\n\nInvesco QQQ Trust, 1 month At 11 a.m. ET, in the biggest trade of the session, there was a $15 million sale of almost 5,000 740-strike puts expiring in March. Those puts are less than $8 out-of-the-money, meaning the index needs to hold or rally for them to pay off.", "source": "CNBC Top News", "pub_date_str": "09 Oct 2026, 06:37 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Derivatives", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Living with Mom and trading on margin. The regular investor gets in on Wall Street's record stock borrowing binge", "full_content": "HOUSTON \u2014 During a late night at home in May 2021, Hy Luu, a 29-year-old engineering consultant, was researching how to obtain more capital to invest in shares of Tesla .\n\nThat's when he discovered margin investing: the act of borrowing money from a broker to buy securities such as stocks, while using existing investments as collateral. Borrowing would give him more buying power, and he could pay it back as the stock appreciated. The main risk would be a margin call, or having to deposit more money into the account, if its value fell.\n\nLuu \u2014 who lives with his mother, Kim Nguyen, in a three-bedroom, two-bathroom house in Houston \u2014 decided to get her opinion on the topic, given that she used to work as an accountant and just so happened to still be awake that evening. The 66-year-old retiree found it interesting.\n\nThat was the reassurance he needed, and it wasn't long before he started using margin to invest in Tesla for the first time. A year or so later, he had amassed more than $100,000 of margin debt .\n\n\"I went really crazy,\" he told CNBC in an interview. \"The stock was going up, and so I was like, 'There's no way I could lose.'\"\n\nAfter five years of margin investing \u2014 including a period in 2022 where he worried that further declines in Tesla could trigger a margin call \u2014 Luu is working to pay down his largest margin balance ever. In June, he exercised $165,000 on five Tesla call options and bought 500 shares at $330 per share. After accounting for the cash in his account, this drove his borrowing to more than $156,000.\n\nTesla swung from below $370 a share to more than $430 during that month.\n\nBetween his Tesla investments, his company stock and 401(k) \u2014 while subtracting his margin debt as well as other debt he's accumulated, such as his car loan and student loans \u2014 Luu's net worth has skyrocketed to more than $800,000 from negative territory seven years ago.", "source": "CNBC World Economy", "pub_date_str": "09 Oct 2026, 06:33 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "How to shield your portfolio if AI goes ka-boom", "full_content": "If you still wanted to own stocks, it used to be impossible to avoid the fallout. Not any more", "source": "FT Markets", "pub_date_str": "09 Oct 2026, 06:30 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Adani Power shares: GQG Partners-managed entities cut stake to 5.72% from 5.74%", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Adani Power shares: GQG Partners-managed entities cut stake to 5.72% from 5.74% Adani Power Share Price NTPC Share Price JSW Energy Share Price NLC India Share Price Jaiprakash Power Ventures Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Adani Power shares: GQG Partners-managed entities cut stake to 5.72% from 5.74% SECTIONS Adani Power shares: GQG Partners-managed entities cut stake to 5.72% from 5.74% By Kumar Gaurav , ETMarkets.com Last Updated: Oct 09, 2026, 06:28:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis GQG Partners entities sold 50.39 lakh Adani Power shares through on-market transactions, reducing their combined stake to 5.72% from 5.74%. The disclosure comes as the stock gains 27.05% in 2026 and the company expands into Bhutanese hydropower.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "09 Oct 2026, 06:28 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Ethical & Professional Standards"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Navratri 2025 to Navratri 2026: Nifty's performance - Top gainers, losers, outlook", "full_content": "The Indian stock market has suffered strong losses over the last year, from the beginning of Navratri 2025 to Navratri 2026, amid heightened geopolitical risks, elevated oil prices, and heavy foreign capital outflow.\n\nThe Nifty 50 is down 11% since the last Navratri, with index components falling up to 35%.\n\nA glance over the stock market's last year's performance shows that global factors overshadowed domestic resilience. While the Indian economy has been on a solid footing and domestic institutional investors (DIIs) continue buying, the market has been on a downtrend due to persistent geopolitical and macroeconomic headwinds, including higher oil prices due to the US-Iran conflict, the rupee's weakness, rising global bond yields, and massive foreign capital outflow.\n\nFPIs have sold Indian stocks worth \u20b9 3,04,468 crore so far this year, after selling them for \u20b9 1,66,286 crore in 2025.\n\nFrom Navratri 2025 to Navratri 2026, the Nifty index has declined by double digits (11%). As per capital market data, as many as 31 stocks are in the red in the index over this period, with shares of ITC, Tata Motors PV, Infosys, Jio Financial, and TCS losing more than 30% each.\n\nStocks such as HDFC Life, Maruti Suzuki, HDFC Bank, Hindustan Unilever, Max Healthcare, and M&M are down between 22% to 29%. Some 20 stocks in the index are down more than 12%.\n\nOn the other hand, shares of Shriram Finance have surged nearly 49% in this period, defying weak market sentiment. Stocks such as Titan Company, Adani Ports, and Hindalco have jumped 21% to 27% in this period. Nestle India, SBI, and Axis Bank have gained more than 10%.\n\nExperts expect the market to remain rangebound in the near term as long as oil prices remain elevated and bond yields continue rising.", "source": "LiveMint Markets", "pub_date_str": "09 Oct 2026, 06:16 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Fixed Income"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Experts say it's time to look at mid-caps, suggest looking at mid-cap funds through the SIP route", "full_content": "While the current stock market dynamics are dominated by concerns over higher oil prices, the rupee's weakness, rising US bond yields, and foreign capital outflow, experts believe this is the time investors should consider mid-caps over large-caps and go through the systematic investment plan (SIP) route for wealth creation in the medium to long term.\n\nAccording to experts, the recent pullback in mid-cap stocks has made this category attractive at current levels.\n\nMid-cap funds focus on investing in companies that have delivered above-average growth in the past. The key characteristics of this category of mutual funds lie in their emphasis on capital appreciation rather than regular dividend payouts. The category has given strong returns to investors.\n\nFor example, the Nippon India Growth Mid Cap Fund Regular- Growth Plan , which was one of the first mutual funds from Nippon India, launched in 1995. If an investor had done a lump-sum investment of \u20b9 1,00,000 when the fund launched, that would be worth \u20b9 4.3 crore today. The fund has delivered a CAGR of close to 22%, meaning a one-time lump-sum investment made at launch has grown nearly 425 times.\n\nThe Nippon India Growth Mid Cap Fund has also never gone below its face value of 10 in the last 3 decades. In the last 5 years, the top 3 funds in the category have all given 20% plus returns. Nippon India Growth Midcap Fund leads the table with 22.62%, followed by Edelweiss and HDFC Midcap Fund at 21.30% and 21.12%, respectively.\n\nAmong other funds in this category, HDFC Mid Cap Fund Regular Growth has given an annual return of 17% since its launch in 2007. SBI Midcap Fund has delivered an annualised return of 16% since its inception in 2005.", "source": "LiveMint Markets", "pub_date_str": "09 Oct 2026, 06:15 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Fixed Income", "Portfolio Management"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "OpenAI's revenue scare, Delta earnings, what investors think of a Starbucks-Chipotle deal and more in Morning Squawk", "full_content": "This is CNBC's Morning Squawk newsletter. Subscribe here to receive future editions in your inbox.\n\nHappy Friday. Don't miss Federal Communications Commission Chairman Brendan Carr on \"Squawk on the Street\" at 11 a.m. ET. Watch live on CNBC or CNBC+.\n\nStock futures are higher this morning following a losing day for the S&P 500 .\n\nHere are five key things investors need to know to start the trading day:\n\nOpenAI told investors that its annualized revenue at the end of September was roughly $18 billion shy of what was previously reported, CNBC confirmed yesterday. The news from one of the most dominant players in the artificial intelligence ecosystem led stocks across the tech sector to slide.\n\nPresident Donald Trump said yesterday that the U.S. would not attack Iran before the midterm election on Nov. 3, writing in a post on Truth Social that the two countries were having \"productive discussions.\"\n\nAs CNBC's Luke Fountain reports, the announcement marked a shift from Trump's comments a day prior, in which he said making a deal with Tehran was \"not really something that I wanted to do.\" Trump said Thursday that the U.S. naval blockade of Iran's ports would \"remain in full force and effect\" and maintained that the country wouldn't be able to have a nuclear weapon.\n\nMom-and-pop investors are getting in on Wall Street's stock-borrowing surge. CNBC's Sean Conlon traveled to Houston, Texas to see how it changed one retail trader's life.", "source": "CNBC World Economy", "pub_date_str": "09 Oct 2026, 06:10 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Navratna PSU IRFC Q2 results, dividend 2026 announcement date, time, earnings schedule, dividend yield, history", "full_content": "IRFC Q2 result: Shares of Indian Railway Financial Corporation Limited ended marginally higher on Friday. The Navratna railway PSU stock is likely to remain in focus next week due to its upcoming second quarter result announcement for the financial year 2026-27.\n\nIRFC share price today opened marginally higher, but failed to build on to their initial gains and ended nearly 0.94% higher.\n\nIRFC\u2019s board of directors will meet, and approve the financial result for the second quarter of FY27. The company will also consider and approve the declaration of interim dividend , if any.\n\n\u201cThis is to inform that meeting of the Board of Directors of the Company is scheduled to be held on Thursday, 15th October 2026, inter-alia, to consider and approve the Unaudited Financial Results of the Company, and other financial statements namely Cash Flow Statement for the quarter and half year ended 30th September 2026 and Statement Assets and Liabilities as on date,\u201d read IRFC\u2019s BSE filing released earlier this week.\n\nThe board will consider and approve dividend on Thursday, October 15, if any. The railway PSU has fixed Friday, October 23, as the record date to determine the eligibility of shareholders for the payout.\n\n\u201cIn accordance with Regulation 42 of SEBI (Listing Obligations and Disclosure Requirements) Regulations, 2015, the record date for determining the entitlements of the shareholders for the payment of aforesaid Interim Dividend shall be Friday, 23rd October 2026, subject to the approval of Interim Dividend by the Board of Directors,\u201d stated the firm in its BSE filing.\n\nIRFC has announced 12 dividends since February 2021. The railway PSU has declared \u20b9 2.10 per equity share of dividend over the past one year. Hence, its annual dividend yield stood at 2.81%.\n\nIRFC share price closed 0.94% higher at \u20b9 74.85 per share with a face value of \u20b9 10 each. The railway PSU stock has delivered negative 40% return in one year, 51% return in two years, and 5% return in three years.", "source": "LiveMint Markets", "pub_date_str": "09 Oct 2026, 06:07 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Fixed Income", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Small-cap mutual fund category gains 10% in 2026; mid-cap in red: Which schemes lead across YTD, 3- and 5-year returns?", "full_content": "The small-cap mutual fund category has outperformed the mid-cap category in 2026 so far, but does the trend hold over longer periods? While category averages reveal a changing picture across three- and five-year horizons, individual schemes show a wide divergence in performance.", "source": "LiveMint Money", "pub_date_str": "09 Oct 2026, 06:03 PM IST", "pub_dat     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
