sex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets .", "source": "Economic Times Markets", "pub_date_str": "25 Oct 2026, 09:18 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "PM Kisan 24th instalment: \u20b92,000 in your bank account next week; are you eligible? How to complete KYC? Explained", "full_content": "The 24th instalment of PM-Kisan Samman Nidhi will be released on 30 October. Eligible farmers will receive \u20b9 2,000 directly in their bank accounts. The Agriculture Ministry earlier announced the payment date on 23 October. Farmers awaiting this support should check their details before the release.\n\nHowever, the release date does not guarantee payment to every registered farmer. Incomplete e- KYC or incorrect records can delay the money. Problems with Aadhaar linking and land verification may also affect payment. Farmers should address these issues early rather than waiting until the last day.\n\nCompleting e-KYC is an important requirement under the scheme. This process helps confirm the identity of registered farmers. They should also check whether their bank accounts are linked with Aadhaar. Their land records must be verified and their personal details should match.\n\nFarmers can check their payment details through the official PM Kisan website. Open pmkisan.gov.in on a mobile phone or computer.\n\nSelect the Know Your Status option and enter your registration number. Next, enter the captcha code shown on the screen and select Get OTP. Enter the OTP received on your registered mobile number to continue.\n\nThe next screen will display your details and beneficiary status. Check whether your e-KYC is complete and look for errors. Follow the instructions if any requirement remains pending. Contact the relevant service centre if you need help correcting your records.\n\nFarmers have three options for completing e-KYC: OTP , fingerprints, or face authentication. The OTP method requires an active mobile number linked with Aadhaar. Farmers can use this option through the PM Kisan website or mobile app.\n\nFor website verification, select e-KYC and enter your Aadhaar number. Enter the OTP sent to your Aadhaar-linked mobile number.", "source": "LiveMint Money", "pub_date_str": "25 Oct 2026, 09:14 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Derivatives", "Ethical & Professional Standards"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "15-15-15 rule: How can a \u20b915,000 monthly SIP potentially grow to \u20b91 crore? Check the complete calculations", "full_content": "Are you aiming to build a meaningful corpus for your future? Do you have a proper financial plan to accomplish the same objective? Are you aware of the silent power of compounding?\n\nHaving a clear understanding of these basic concepts is indispensable for ensuring meaningful wealth creation in the long run. Now, building a corpus of \u20b9 1 crore through mutual fund investments may seem a challenging and daunting task; still, a disciplined approach, clarity of objectives and a long-term investment horizon can help investors work towards this goal.\n\nThe 15-15-15 rule of investing is a popular investment thumb rule that clearly explains how patience, consistency in investing, time, and compounding can work together to build wealth in the long run. This write-up is dedicated to discussing this rule in detail and how it can help create meaningful wealth if followed diligently.\n\nThis is an investment rule that suggests investing \u20b9 15,000 every month through SIPs, i.e., a Systematic Investment Plan, targeting an assumed annual return of 15% over an extended period of 15 years. Furthermore, the returns under this rule are reinvested, allowing the investment corpus to benefit from compounding.\n\nStill, it is vital to note that the 15-15-15 rule does not guarantee a \u20b9 1 crore corpus in 15 years. This is because market returns are subject to risks and depend on a host of other factors. Secondly, at a 15% annualised return, which is a presumed return, the estimated corpus would be approximately \u20b9 1 crore, depending on the calculation method, timing of investments and eventual compounding value.\n\nAssuming a monthly SIP of \u20b9 15,000 and an illustrative annual return of 15%, then the estimated investment outcome will be as follows:\n\nSource: SIP calculator available on Angel One's official website. The returns are indicative and can vary slightly depending on the calculation tool used.\n\nThese figures assume monthly investments and an annualised return of 15%.", "source": "LiveMint Money", "pub_date_str": "25 Oct 2026, 08:15 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Quantitative Methods", "Portfolio Management"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "Money changes from November 1: From Pensioner life certificate to ITR deadline \u2014 Key things that may impact your pocket", "full_content": "Key money rule changes next month: With November 2026 almost here, the next days have some changes set to come into effect, that will directly impact your pockets. Starting from November 1, here's a look at what can cost you more money, tips to save or invest in your future.\n\nRetired central and state government employees receiving pension are required to submit their annual \u2018 Life Certificate \u2019 (LC), at the nearest bank branch by November-end. Failure to do so, could result in delay or disruption of pension payments.\n\nYou can choose to submit your LC either physically, digitally using the Jeevan Praaman Patra facility with Aadhaar identification, or avail the Postal Department's doorstep life certificate facility. All of the processes are free of cost, but failure to submit the document could impact your pension from December onwards.\n\nFor pensioners aged over 80 years, the process began from 1 October, for other retirees, the process starts from 1 November. Notably, deadline is 30 November.\n\nThe Central Board of Direct Taxes (CBDT) has this year extended the income-tax returns deadline for taxpayers filing audited ITR for FY26 i.e. assessment year AY27 from 31 October to 21 November 2026.\n\nAny taxpayer with income from business or professional services, who is also required to submit an audit report, shall file their return by this deadline to avoid penalties and tax notices. Companies whose accounts are audited under company law must also file their audit reports. The requirement also applies to firms, LLPs and other entities covered under the applicable audit provisions.\n\nFor businesses, a tax audit is required if their total sales, annual turnover or gross receipts exceed \u20b9 1 crore in a relevant financial year.", "source": "LiveMint Money", "pub_date_str": "25 Oct 2026, 08:05 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "China's $3.5 Trillion Stock Rout: Why Low Valuations Aren't Enough To Entice Investors", "full_content": "The rout intensified last week, pushing the onshore benchmark CSI 300 Index into a bear market and a technology sector gauge in Hong Kong toward erasing all its gains since Beijing's sweeping growth support package two years ago.", "source": "NDTV Profit", "pub_date_str": "25 Oct 2026, 07:49 AM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Why your good fund feels bad", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nThink of an investor who puts a large sum of money into a good equity fund a few months before a market peak. It's a well-managed fund, and in the fall that follows, it loses 18% while the index drops 24%. On any sensible basis, the fund has done well: the market has fallen sharply, but the fund manager has lost much less.\n\nWhen the market turns, this head start will matter. The fund needs to rise about 22% to get back to where it started; the index needs about 32%. But our investor sees none of the good news. On his screen, there\u2019s a big red number next to the fund. The fact that it beat the index feels like a meaningless statistic.\n\nThe difficulty is obvious: two different things are being compared. Judged against its benchmark, especially during a fall, any analyst would say that this fund did well. The investor\u2019s yardstick, though, is not benchmark-relative returns but his own absolute returns. Those depend on when he invested, whether he made a lump-sum investment or used an SIP, and simply where he entered the market cycle. In my experience, his own loss drives the decision to sell, but he blames the fund to justify it. This allows the investor to ignore the responsibility he should take and shifts it to the fund manager .\n\nWhen the market turns, this head start will matter. The fund needs to rise about 22% to get back to where it started; the index needs about 32%. But our investor sees none of the good news. On his screen, there\u2019s a big red number next to the fund. The fact that it beat the index feels like a meaningless statistic.\n\nThe difficulty is obvious: two different things are being compared. Judged against its benchmark, especially during a fall, any analyst would say that this fund did well. The investor\u2019s yardstick, though, is not benchmark-relative returns but his     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
