    const allData = {"general": [{"title": "East Zone vs South Zone Live Streaming: Watch Vaibhav Sooryavanshi In Duleep Trophy 2026 Final", "full_content": "East Zone vs South Zone Duleep Trophy 2026 final: Check match date, time, venue, live telecast and streaming details, with Vaibhav Sooryavanshi in focus.", "source": "NDTV Profit", "pub_date_str": "06 Sep 2026, 08:00 AM IST", "pub_date_relative": "just now"}, {"title": "Can a forgotten \u20b9500 bill damage your credit history? This is what borrowers should know", "full_content": "Missing a \u20b9 500 repayment might initially seem too insignificant to affect your finances. Still, when it comes to credit health, the amount is not always the deciding factor. On a fundamental level, what matters is whether the payment becomes overdue and how long it remains unpaid.\n\nFurthermore, it is critical to check whether such delays become a recurring pattern. If such is the case, it can eventually negatively affect an individual\u2019s credit score and overall credit history. The main reason is that repayment history builds creditworthiness, and when it is affected, it eventually results in a reduction in credit score.\n\nThere are four prominent credit bureaus in the country, namely, TransUnion CIBIL, Experian, Equifax and CRIF High Mark. These are bureaus that provide day-to-day credit users with their credit scores. Credit scores are primarily three-digit numbers ranging from 300 to 900 that help financial institutions assess a borrower's creditworthiness and ability to repay debt on time.\n\nTo provide these metrics, the credit bureaus use an individual's repayment behaviour and history. Now, a single forgotten bill generally does not necessarily mean an immediate decline in one\u2019s credit score, particularly if the dues are cleared promptly. Still, prolonged or repeated delays can signal poor repayment discipline, potentially hurt creditworthiness , and cripple future borrowing integrity.\n\nAkshay Mehrotra, MD and Group CEO, Fibe, touches upon this aspect, explaining, \u201cA one-off delay may not automatically lower the score if corrected within the reporting cycle. However, with lenders now reporting credit information weekly, unresolved dues can become visible sooner. Consumers should clear delayed payments promptly, set reminders and regularly review credit reports.", "source": "LiveMint Money", "pub_date_str": "06 Sep 2026, 06:32 AM IST", "pub_date_relative": "30m ago"}, {"title": "Why some investors say Volkswagen is simply \"not fixable\"", "full_content": "", "source": "Investing.com News", "pub_date_str": "06 Sep 2026, 06:09 AM IST", "pub_date_relative": "53m ago"}, {"title": "Imperial Petroleum earnings missed, revenue fell short of estimates", "full_content": "", "source": "Investing.com News", "pub_date_str": "06 Sep 2026, 05:43 AM IST", "pub_date_relative": "1h ago"}, {"title": "Europe\u2019s satellite launch ambitions take off as German rocket reaches orbit", "full_content": "", "source": "Investing.com News", "pub_date_str": "06 Sep 2026, 05:33 AM IST", "pub_date_relative": "1h ago"}, {"title": "From \u2018mystery vacations\u2019 to hostels, budget travelers get thrifty as prices rise", "full_content": "On a recent weekend, Jami Hagerman embarked on the budget- vacation equivalent of a blind date.\n\nThe hairstylist and her husband spent about $400 on Groupon \"mystery vacation\" vouchers that promised accommodations and airfare for the pair \u2014 but no say in the destination. The Oklahoma City residents were sent to New Orleans , where they visited museums, took walking tours and ate the city's famous beignet dessert.\n\n\"I feel like the value was great for the trip,\" said Hagerman, 29. \"It was fun.\"\n\nHagerman isn't the only one balancing an inclination to see the world with the pinch of inflation.\n\nTravel costs are surging amid the U.S. war with Iran and many companies in the industry are homing in on premium offerings to fetch higher prices and ray him as seeking tax hikes more broadly while claiming that Paxton would give tax breaks to first-time homebuyers and families with children.\n\nThe key piece of legislation Trump signed into law last year enhanced and extended many of his expiring tax breaks from his 2017 overhaul. But that measure also increased budget deficits, which have contributed to higher interest rates on the national debt. Trump has also hiked tariffs, taxes on imports, to raise revenue.\n\n\"High Tax Talarico wants to take money out of Texans' pockets. MAGA Inc. is going to ensure Texas knows about Talarico's radical policies and elects Ken Paxton to the U.S.", "source": "CNBC Top News", "pub_date_str": "06 Sep 2026, 04:00 AM IST", "pub_date_relative": "3h ago"}, {"title": "Putin meets with U.S. envoys at the Kremlin for renewed talks on ending the war in Ukraine", "full_content": "Russian President Vladimir Putin met with U.S. envoys Steve Witkoff and Jared Kushner at the Kremlin on Saturday for talks to try to revive a stalled push to end the Russia-Ukraine war.\n\nPutin, Kushner and Witkoff spoke for more than three hours in closed-door talks that come as both sides continue to escalate aerial attacks. Putin and Ukrainian President Volodymyr Zelenskyy both agreed to pause strikes on each other's capitals while the talks took place.\n\nWashington's push to end the fighting has lost momentum as U.S. attention has been focused for the past six months on the Iran war . The last known visit to Moscow by Witkoff and Kushner, U.S. President Donald Trump's son-in-law, was in January, when they also held talks with Putin at the Kremlin.\n\nBoth U.S. envoys will also visit Ukraine's capital, Kyiv, for the first time as part of the peace process on Sunday, Ukrainian officials said.\n\nAt the start of the meeting in Moscow, Putin asked Kushner and Witkoff to pass on his warm wishes and gratitude to Trump, and described the situation in Ukraine as \"not simple.\" Russian forces launched an all-out invasion of Ukraine on Feb. 24, 2022.\n\n\"(Russian President Vladimir) Putin has ordered that no strikes be carried out against Kyiv for three days, starting at midnight today,\" presidential spokesperson Dmitry Peskov told Russia's Tass news agency.\n\nZelenskyy said that Ukraine was prepared to halt strikes on Moscow until Monday. He said he spoke on Saturday afternoon with the U.S. delegation after their arrival in Moscow.\n\n\"From now through the end of Saturday, as well as on Sunday and Monday, Ukraine is ready to refrain from strikes on Moscow, and we expect the Russians to do the same regarding Kyiv,\" he said.", "source": "CNBC Top News", "pub_date_str": "06 Sep 2026, 03:08 AM IST", "pub_date_relative": "3h ago"}, {"title": "US, Iranian forces fire at vessels in waters near Iran", "full_content": "", "source": "Investing.com News", "pub_date_str": "06 Sep 2026, 03:06 AM IST", "pub_date_relative": "3h ago"}, {"title": "US regulator sues ISS as it steps up scrutiny of proxy advisers", "full_content": "The SEC accuses the firm of ignoring a subpoena as part of its \u2018fact-finding investigation\u2019", "source": "FT Markets", "pub_date_str": "06 Sep 2026, 03:05 AM IST", "pub_date_relative": "3h ago"}, {"title": "OpenAI acknowledges 'wiki incident' and need for more transparency around unintended AI behavior - Reuters", "full_content": "OpenAI acknowledges 'wiki incident' and need for more transparency around unintended AI behavior Reuters Why the Hugging Face Hack Should Make You Worry More About A.I. The New York Times AI agents conspired to escape their cage. Experts now fear a global \u2018takeover\u2019 The Telegraph OpenAI agents discussed ways to escape their sandbox on public wiki Ars Technica ChatGPT-maker OpenAI allegedly suffered another rogue AI breakout The Washington Post", "source": "Google News Business", "pub_date_str": "06 Sep 2026, 02:53 AM IST", "pub_date_relative": "4h ago"}, {"title": "Russia stocks lower at close of trade; MOEX Russi rders in the second quarter of 2026, a more than five-fold increase compared with when it had only a flagship product in the first quarter of 2025, according to data shared with CNBC by Groupon.\n\nGroupon advertises the flagship package \u2014 which ranges from $199 to $299 in per-person price, depending on the departing airport \u2014 as having a 50% discount.", "source": "CNBC Top News", "pub_date_str": "06 Sep 2026, 05:25 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "AI Energy Play Bloom Energy Jumps On S&P 500 News - Investor's Business Daily", "full_content": "AI Energy Play Bloom Energy Jumps On S&P 500 News Investor's Business Daily Bloom Energy, Illumina, Everpure to Join S&P 500 This Month Bloomberg.com Bloom Energy and 7 More Stocks That Could Join the S&P 500 This Month Barron's Is Bloom Energy (BE) Stock Cheap Or Already Too Expensive? simplywall.st I Love Bloom Energy for 1 Reason, and It's Not the Backlog Yahoo Finance", "source": "Google News Business", "pub_date_str": "06 Sep 2026, 04:21 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Trump\u2019s first major midterm money move: A $10 million Texas Senate ad blitz", "full_content": "The political group associated with President Donald Trump is spending $10 million on television and digital advertisements in the Texas Senate race, according to a Saturday filing with the Federal Election Commission.\n\nThis is the first significant spending by MAGA, Inc., in a premier general election contest and reflects how a once-safe Republican seat in Texas may be viable for Democrats with the candidacy of James Talarico, a 37-year-old state representative.\n\nTexas Attorney General Ken Paxton is the Republican nominee in the race. Trump's endorsement helped Paxton to defeat the incumbent, Sen. John Cornyn, in a May primary runoff election.\n\nPublic disapproval of Trump over the economy and the Iran war has been a headwind for many Republican candidates. Voters generally go against the party in control of the White House in midterm elections and Democrats are hoping to gain control of the House and Senate \u2014 with Texas being a symbolically powerful indication of how the political map might be expanding this year.\n\nThe ads seek to highlight taxes as a dominant issue at a time when many voters have expressed concerns about continued inflation. Talarico has favored higher taxes on wealthier households and the two ads seek to portray him as seeking tax hikes more broadly while claiming that Paxton would give tax breaks to first-time homebuyers and families with children.\n\nThe key piece of legislation Trump signed into law last year enhanced and extended many of his expiring tax breaks from his 2017 overhaul. But that measure also increased budget deficits, which have contributed to higher interest rates on the national debt. Trump has also hiked tariffs, taxes on imports, to raise revenue.\n\n\"High Tax Talarico wants to take money out of Texans' pockets. MAGA Inc. is going to ensure Texas knows about Talarico's radical policies and elects Ken Paxton to the U.S.", "source": "CNBC Top News", "pub_date_str": "06 Sep 2026, 04:00 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics", "Financial Statement Analysis"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Putin meets with U.S. envoys at the Kremlin for renewed talks on ending the war in Ukraine", "full_content": "Russian President Vladimir Putin met with U.S. envoys Steve Witkoff and Jared Kushner at the Kremlin on Saturday for talks to try to revive a stalled push to end the Russia-Ukraine war.\n\nPutin, Kushner and Witkoff spoke for more than three hours in closed-door talks that come as both sides continue to escalate aerial attacks. Putin and Ukrainian President Volodymyr Zelenskyy both agreed to pause strikes on each other's capitals while the talks took place.\n\nWashington's push to end the fighting has lost momentum as U.S. attention has been focused for the past six months on the Iran war . The last known visit to Moscow by Witkoff and Kushner, U.S. President Donald Trump's son-in-law, was in January, when they also held talks with Putin at the Kremlin.\n\nBoth U.S. envoys will also visit Ukraine's capital, Kyiv, for the first time as part of the peace process on Sunday, Ukrainian officials said.\n\nAt the start of the meeting in Moscow, Putin asked Kushner and Witkoff to pass on his warm wishes and gratitude to Trump, and described the situation in Ukraine as \"not simple.\" Russian forces launched an all-out invasion of Ukraine on Feb. 24, 2022.\n\n\"(Russian President Vladimir) Putin has ordered that no strikes be carried out against Kyiv for three days, starting at midnight today,\" presidential spokesperson Dmitry Peskov told Russia's Tass news agency.\n\nZelenskyy said that Ukraine was prepared to halt strikes on Moscow until Monday. He said he spoke on Saturday afternoon with the U.S. delegation after their arrival in Moscow.\n\n\"From now through the end of Saturday, as well as on Sunday and Monday, Ukraine is ready to refrain from strikes on Moscow, and we expect the Russians to do the same regarding Kyiv,\" he said.", "source": "CNBC Top News", "pub_date_str": "06 Sep 2026, 03:08 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "US regulator sues ISS as it steps up scrutiny of proxy advisers", "full_content": "The SEC accuses the firm of ignoring a subpoena as part of its \u20 ged the Fed not to raise rates and, in some cases, to cut them \u2014 an unusually broad public pressure campaign even by the standards of Trump's long-running criticism of the central bank.\n\nWhile President Donald Trump has avoided directly criticizing his new Fed chairman Kevin Warsh , as he did former chair Jay Powell , he escalated the pressure Friday by threatening to halt trade with countries that run trade surpluses with the U.S. unless the Fed cuts interest rates. Trump had never before directly threatened tariffs if the Fed didn't lower rates.\n\nThe president's post was followed by an interview that senior economic counselor Peter Navarro gave to former Trump advisor Steve Bannon on Friday in which he warned that a rate hike would be \"careless\" and \"would hit precisely the sectors America needs to prosper most.\"\n\nHe called the members of the rate-setting Federal Open Market Committee \"clowns\" and said Warsh is trying to \"do the right thing.\"\n\nEarlier in the week, Vice President JD Vance said, \"We believe that the Fed should be lowering interest rates.\" He added, \"We're doing a lot of things to try to keep those interest rates down, but it would be nice to have some help from the Federal Reserve.\"\n\nAnd Treasury Secretary Scott Bessent, in a CNBC interview , noted that the Fed typically doesn't raise rates during a supply shock until there are second- or third-order inflationary effects.\n\nThe administration's pressure comes at a difficult time for Warsh.", "source": "CNBC Top News", "pub_date_str": "06 Sep 2026, 12:42 AM IST", "pub_date_relative": "6h ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Bitcoin consolidates near $82K resistance: Live levels", "full_content": "", "source": "Investing.com News", "pub_date_str": "06 Sep 2026, 12:32 AM IST", "pub_date_relative": "6h ago", "cfa_topics": ["A     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
