 Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "India bonds sink deeper on RBI commentary, inflation concerns", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Bonds \u203a India bonds sink deeper on RBI commentary, inflation concerns Powered By The Economic Times daily newspaper is available online now. Read Today's Paper India bonds sink deeper on RBI commentary, inflation concerns SECTIONS India bonds sink deeper on RBI commentary, inflation concerns Reuters Last Updated: Oct 14, 2026, 05:41:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Indian government bonds are currently facing notable losses, pushing the 10-year yield to its highest since March 2023. This downturn comes in the wake of hawkish remarks from Reserve Bank of India Governor Sanjay Malhotra about financial stability. Additionally, India's wholesale inflation saw an unexpected rise in September, leading to growing concerns over potential future monetary policy shifts.\n\nIndian government bonds are currently facing notable losses, pushing the 10-year yield to its highest since March 2023. This downturn comes in the wake of hawkish remarks from Reserve Bank of India Governor Sanjay Malhotra about financial stability. Additionally, India's wholesale inflation saw an unexpected rise in September, leading to growing concerns over potential future monetary policy shifts.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "14 Oct 2026, 05:41 PM IST", "pub_date_relative": "47m ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Cabinet clears Rs 53,428 crore for social assistance scheme, revises disability pension norms", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a Cabinet clears Rs 53,428 crore for social assistance scheme, revises disability pension norms The Economic Times daily newspaper is available online now. Read Today's Paper Cabinet clears Rs 53,428 crore for social assistance scheme, revises disability pension norms SECTIONS Cabinet clears Rs 53,428 crore for social assistance scheme, revises disability pension norms PTI Last Updated: Oct 14, 2026, 05:41:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Union Cabinet has approved an outlay of Rs 53,428 crore for the National Social Assistance Programme. This approval will support the program's continuation from 2026-27 to 2030-31 with updated eligibility criteria. Monthly assistance rates for disability pension beneficiaries will increase with adjustments for age and disability severity.\n\nCabinet approves Rs 52,878 crore IDBI Bank sale to Fairfax arm in India\u2019s largest financial-sector FDI\n\nCabinet approves 78-day bonus worth Rs 2,009 crore for 11.4 lakh railway employees ahead of Diwali\n\nOnion inflation at 108%? Yes, but not really. What is different this time?\n\nCurbing rupee bets: What the RBI\u2019s new rules mean for the hedge-now-or-wait question\n\nBrinjal, buffalo, bacteria: Inside India\u2019s pay-for-nature system\n\nHomebuyers wait as NCLT panel picks holes in unfinished Jaypee projects\n\nThe NBFC saga - Part 3: How one default in 2018 changed the way RBI reads risk", "source": "Economic Times Economy", "pub_date_str": "14 Oct 2026, 05:41 PM IST", "pub_date_relative": "47m ago", "cfa_topics": ["Economics", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Delta's business-class revamp: New seats, menus, plates and more Porsches", "full_content": "Delta Air Lines , the country's most profitable airline, has a problem serving its top-tier customers: not enough Porsches.\n\nThe airline uses a fleet of 40 of the luxury vehicles to drive its high-value flyers right to the plane.\n\n\"What's happened over the last several years is the demand has continued to rise, and we realized that the 40 cars that we have weren't enough to meet the demand. So we're moving that fleet to 70,\" Ranjan Goswami, Delta's chief marketing and product officer, told CNBC.\n\nIt's just one of many changes Delta is making for customers who fly in its most luxurious and expensive cabin, known as Delta One . The Porsche service is part of a VIP add-on option.\n\nThe carrier on Wednesday unveiled new crockery for the cabins, new Missoni mini pillows and fresh food and beverage menus, including Champagne served over sorbet and Blanton's bourbon. Many of the new items will appear on flights originating in Los Angeles later this month and on other routes in the coming months.\n\nDelta is also planning to debut updated suites with a bigger screen and a more cushioned, lighter lie-flat seat when it starts flying its first Airbus A350-1000 planes early next year.\n\nDelta didn't announce changes to the coach and premium economy cabins.\n\nThe airline's executives said the company is already thinking about adjustments on other aircraft, including smaller Airbus jets and on Boeing 787 Dreamliners that Delta has ordered and that will come in the next decade.", "source": "CNBC Top News", "pub_date_str": "14 Oct 2026, 05:40 PM IST", "pub_date_relative": "48m ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Dynamatic Technologies among 7 stocks hitting 52-week highs; rally up to 32% in a month", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News Dynamatic Technologies among 7 stocks hitting 52-week highs; rally up to 32% in a month Written by Ritesh Presswala , ETMarkets.com | Oct 14, 2026, 05:39:15 PM IST 1 / 8 New Highs Benchmark Sensex slipped 252 points to close at 72,781 on Wednesday. Despite the market decline, seven stocks from the BSE 1000 index touched fresh 52-week highs, reaching their highest price levels in the past year. A 52-week high represents the highest price at which a stock has traded over the previous 12 months and may indicate increased investor interest and trading activity.\n\nNew 52-week high: Rs 977.15| CMP: Rs 938.15. In the last one month stock has gained about 32%.\n\nNew 52-week high: Rs 14500| CMP: Rs 14460.05. In the last one month stock has gained about 20%.\n\nNew 52-week high: Rs 1060.1| CMP: Rs 1044.4. In the last one month stock has gained about 16%.\n\nNew 52-week high: Rs 4619.1| CMP: Rs 4415. In the last one month, the stock has gained about 15%.\n\nNew 52-week high: Rs 2785| CMP: Rs 2673. In the last one month, the stock has gained about 13%.\n\nNew 52-week high: Rs 616| CMP: Rs 590.75. In the last one month, the stock has gained about 9%.\n\nNew 52-week high: Rs 463.6| CMP: Rs 463.5. In the last one month, the stock has gained about 8%.", "source": "Economic Times Markets", "pub_date_str": "14 Oct 2026, 05:35 PM IST", "pub_date_relative": "53m ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Top 2 stocks to buy for short-term: Sagility, Rain Industries by Nagaraj Shetti - Check stop loss, targets", "full_content": "Stock market today: Indian equity benchmarks closed lower on Wednesday, 14 October, as rising oil prices and sustained foreign investor outflows dampened sentiment following the previous session\u2019s rally. Investors also assessed corporate earnings and awaited key US inflation data.\n\nThe Nifty 50 fell 0.44% to close at 22,622.70, while the Sensex declined 0.34% to 72,781.89. Eight of the 16 major sectors ended in the red, while the broader market also weakened, with small-cap and mid-cap indices falling 0.3% and 0.1%, respectively.\n\nThe decline followed a strong rebound on Tuesday, when the Nifty and Sensex gained around 1.6% each, led by IT stocks after HCLTech reported quarterly profit that exceeded expectations.\n\nNagaraj Shetti, Senior Technical Research Analyst at HDFC Securities, has recommended buying Sagility at \u20b9 45.60, with a target price of \u20b9 49.50 and a stop-loss at \u20b9 43.50. The trade has a timeframe of two to three weeks.\n\nHe has also recommended buying Rain Industries at \u20b9 236, with a target of \u20b9 255 and a stop-loss at \u20b9 223, for a similar investment horizon of two to three weeks.\n\nThe alternative candle pattern of bull and bear continued in the market for the fifth consecutive session on Wednesday and Nifty 50 closed the day lower by 99 points. A small negative candle was formed on the daily chart that signals consolidation movement in the market after a sharp upmove seen on Tuesday. The bearish pattern like lower tops and bottoms is intact on the daily chart. A decisive close above 22,800 is likely to negate this bearish setup.\n\nNifty 50 is currently placed at the crucial resistance around 22,700-22,800 levels and a decisive break out of this hurdle could open further short covering in the market towards 23,100-23,200 levels. Any weakness from here could find support around 22,300 levels.\n\nAfter showing a consolidation movement in the last few weeks, the stock price has witnessed sharp bounce back on Wednesday and closed higher.", "source": "LiveMint Markets", "pub_date_str": "14 Oct 2026, 05:35 PM IST", "pub_date_relative": "53m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Sebi proposes market cap-based SME IPO norms, seeks public comments on regulatory overhaul", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Sebi proposes market cap-based SME IPO norms, seeks public comments on regulatory overhaul BSE Share Price Multi Commodity Exchange of India Share Price Indian Energy Exchange Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Sebi proposes market cap-based SME IPO norms, seeks public comments on regulatory overhaul SECTIONS Sebi proposes market cap-based SME IPO norms, seeks public comments on regulatory overhaul By Kumar Gaurav , ETMarkets.com Last Updated: Oct 14, 2026, 05:34:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Sebi has proposed a sweeping overhaul of SME IPO regulations, including market capitalisation-based eligibility thresholds, higher profitability requirements, lower minimum application values and changes to allotment norms. The proposals also cover underwriting, market making, lock-in periods and migration to the main board. Public comments are invited until November 4, 2026.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "14 Oct 2026, 05:34 PM IST", "pub_date_relative": "54m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Cabinet Approves IDBI Bank Stake Sale To Fairfax For Rs 52,878 Crore; FM Calls It Strategic Restructuring", "full_content": "Fairfax's winning bid for IDBI Bank has been fixed at Rs 81 per share, above the benchmark price of Rs 75.99 per share determined using two independent valuations.", "source": "NDTV Profit", "pub_date_str": "14 Oct 2026, 05:32 PM IST", "pub_date_relative": "56m ago", "cfa_topics": ["Corporate Issuers", "Portfolio Management"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Even more borrowers choose riskier mortgages, as higher interest rates crush affordability", "full_content": "Mortgage rates moved to the highest level in nearly three years last week, causing overall demand to drop. Riskier mortgages, however, continue to gain a growing share of what demand there is.\n\nTotal mortgage application volume dropped 2.7% last week compared with the previous week, according to the Mortgage Bankers Association's seasonally adjusted index. It is also 37.5% lower than the same week one year ago.\n\nThe average contract interest rate for 30-year fixed-rate mortgages with conforming loan balances, $832,750 or less, increased to 7.50% from 7.49%, with points decreasing to 0.83 from 0.84, including the origination fee, for loans with a 20% down payment. The rate was more than a full percentage point higher than it was a year ago.\n\n\"As a result, borrowers continue to rely more on ARM [adjustable-rate mortgage] loans to help lower their monthly payments,\" said Joel Kan, an MBA economist, in a release. \"The ARM share at 10.5 percent was at its highest level since October 2025.\"\n\nARMs offer lower interest rates and can be fixed for up to 10 years, but then they adjust depending on future interest rates. That is why they are considered riskier.\n\nApplications to refinance a home loan have been hit hardest by higher rates, as a shrinking pool of borrowers can now find much relief. These applications declined 0.4% for the week and were 56% lower year over year.\n\nCNBC's Property Play with Diana Olick covers new and evolving opportunities for the real estate investor, delivered weekly to your inbox.\n\nApplications for a mortgage to purchase a home fell 4% for the week and were 16% lower than the same week one year ago. There are more homes available for sale now, but mostly on the higher end of the market. Supply is also rising not because of new listings, but because of slower sales. Home prices also continue to rise.", "source": "CNBC Top News", "pub_date_str": "14 Oct 2026, 05:31 PM IST", "pub_date_relative": "57m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "BlackRock draws $205 billion in client funds as quarterly profit beats estimates", "full_content": "BlackRock surpassed Wall Street profit expectations and attracted $205 billion in total inflows in the third quarter, sending the world's largest asset manager's shares up 5% in premarket trading on \u2060Wednesday.\n\nThe benchmark S&P 500 extended its steady climb in the quarter to hover near its all-time highs on a rally in AI-focused \u200bstocks, encouraging investors to pour \u200bmoney into asset management firms \u200bsuch as BlackRock.\n\n\"Market fundamentals are strong and well supported, with higher margins and earnings momentum catalyzed by new technology,\" CEO Larry Fink said in a statement.\n\nBlackRock's assets under management \u2014 which determine a large chunk of the earnings \u2014 \u2060rose \u200cto $15.49 trillion, from $13.46 trillion a year earlier and $15.34 trillion \u2060in the second quarter.\n\nThe growth was driven by a combination of $134.5 billion of new flows into BlackRock's flagship iShares ETFs, and the rising valuations of its investments in a robust equity market.\n\nThe company posted an adjusted profit of $15.93 per share, beating Wall Street \u200cexpectations of $14.13, according to data compiled by LSEG.\n\nThe robust results will help alleviate pressure on BlackRock's shares, which have underperformed the broader market this year over fears of a slowdown in \u200bactivity from cautious investor sentiment.\n\nEven as markets have remained sturdy, the combination of surging bond yields and the expectation that the Federal Reserve's recent interest rate hike marks the beginning of a tightening cycle has called into question whether the rally can be sustained.", "source": "CNBC Top News", "pub_date_str": "14 Oct 2026, 05:27 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Market wrap: Nestle India, Infosys, Shriram Finance, HDFC Life top gainers and losers on Nifty and Sensex on Wednesday", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Market wrap: Nestle India, Infosys, Shriram Finance, HDFC Life top gainers and losers on Nifty and Sensex on Wednesday The Economic Times daily newspaper is available online now. Read Today's Paper Market wrap: Nestle India, Infosys, Shriram Finance, HDFC Life top gainers and losers on Nifty and Sensex on Wednesday SECTIONS Market wrap: Nestle India, Infosys, Shriram Finance, HDFC Life top gainers and losers on Nifty and Sensex on Wednesday By Kumar Gaurav , ETMarkets.com Last Updated: Oct 14, 2026, 05:26:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Indian equities closed lower on Wednesday as investors booked profits ahead of key US inflation data. The Nifty 50 fell 0.44% to 22,623, while the Sensex declined 0.34% to 72,782. Nestle India and Infosys led Nifty gainers, while Shriram Finance and HDFC Life topped the losers\u2019 list.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "14 Oct 2026, 05:26 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "EPF withdrawal rules: Form 121 replaces Forms 15G and 15H from April 2026", "full_content": "Employees planning to withdraw money from their Employees\u2019 Provident Fund (EPF) accounts will need to familiarise themselves with a change in the tax documentation process. From the financial year 2026-27, Form 121 will replace Forms 15G and 15H for eligible individuals seeking exemption from tax deducted at source (TDS) on specified income, including eligible provident fund withdrawals.\n\nThe Employees\u2019 Provident Fund Organisation ( EPFO ) has informed its members of the change, which took effect on April 1, 2026. The new form is intended to simplify the process by removing the need to submit different declarations based on age.\n\nHowever, the introduction of Form 121 does not mean that all provident fund withdrawals will automatically become tax-free. Members must meet the applicable eligibility conditions to claim relief from TDS.\n\nPreviously, individuals below 60 years of age who met the prescribed conditions could submit Form 15G to request non-deduction of TDS. Eligible senior citizens used Form 15H for the same purpose.\n\nUnder the revised framework, both forms have been replaced by a single declaration, Form 121. This removes the distinction between the two forms based on the applicant\u2019s age and is expected to make tax compliance more straightforward for eligible taxpayers.\n\nThe new form allows individuals to declare that their estimated total income for the relevant financial year will not result in any tax liability, subject to the conditions prescribed under the applicable income tax provisions.\n\nEligible EPF members can submit the declaration to seek relief from TDS on qualifying withdrawals. The declaration must meet the applicable requirements, and submitting the form does not guarantee exemption if the individual does not satisfy the prescribed conditions.\n\nForm 121 is intended for individuals who qualify under the relevant tax provisions and whose estimated tax liability meets the prescribed criteria.", "source": "LiveMint Money", "pub_date_str": "14 Oct 2026, 05:24 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Meerut Blue Drum Murder Case: Death Penalty For Muskaan Rastogi, Sahil Shukla", "full_content": "Muskaan Rastogi and Sahil Shukla were convicted after 126 hearings and 22 witness statements, with the court citing their conspiracy to murder Saurabh Rajput and conceal his body.", "source": "NDTV Profit", "pub_date_str": "14 Oct 2026, 05:19 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Ultra-short-term borrowing costs spike; premium over policy rate hits 4-year high", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a Ultra-short-term borrowing costs spike; premium over policy rate hits 4-year high The Economic Times daily newspaper is available online now. Read Today's Paper Ultra-short-term borrowing costs spike; premium over policy rate hits 4-year high SECTIONS Ultra-short-term borrowing costs spike; premium over policy rate hits 4-year high Reuters Last Updated: Oct 14, 2026, 05:17:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Reserve Bank of India hiked rates for the first time in nearly four years last week and shifted its stance, signalling more increases, while Governor Sanjay Malhotra on Tuesday said monetary policy cannot be seen as separate from financial stability, prompting traders to ramp up rate hike bets.\n     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
