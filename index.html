la to wind down Cybertruck production in Texas next year to ramp Cybercab, Musk says", "full_content": "Tesla CEO Elon Musk on Friday said the electric vehicle maker will \"be winding down\" production of the Cybertruck at its Texas gigafactory around the middle of next year.\n\nMusk , who hailed the Cybertruck as the future of the pickup truck segment , said in a post on X early Friday morning that the end of production at the massive facility would make room for manufacturing of its Cybercab robotaxi.\n\nThe Cybertruck is exclusively produced at the company's plant in Texas alongside the Tesla Model Y and two-seat Cybercab, which Musk has touted as a crucial product for the automaker moving forward.\n\nMusk did not say whether the company would produce the Cybertruck at a different facility, but he later responded to a user on X who called the update an \"end of an era\" and said the Cybertruck was the \"best vehicle Tesla has ever made.\"\n\n\"True, but the Cybertruck fleet will be around for a long time,\" Musk said.\n\nTesla began Cybertruck deliveries in late 2023 . The company did not immediately respond to a request for comment from CNBC.\n\nThe Cybertruck and its polarizing design gained a niche following, but it did not achieve mass-market sales, despite Musk's pre-launch prediction that annual sales would eventually total 250,000.\n\n\"Trucks have been the same for a very long time,\" Musk said when the truck was unveiled in 2019. \"Like 100 years. Trucks have been basically the same. We want to try something different.\"", "source": "CNBC World Economy", "pub_date_str": "06 Nov 2026, 08:36 PM IST", "pub_date_relative": "9m ago"}, {"title": "US Stock Market Today: Nasdaq, S&P 500 Open Slightly Higher, After Rebound Post Chip Stocks Selloff, US Jobs Report", "full_content": "The Dow Jones Industrial Average was down 1%. The S&P 500 gained 0.3%, and the Nasdaq Composite increased 1.1%.", "source": "NDTV Profit", "pub_date_str": "06 Nov 2026, 08:33 PM IST", ning to buckle under tighter financial conditions.\"\n\nThe breadth of job growth also was strong, contrary to a trend in which healthcare had accounted for the bulk of gains.\n\nProfessional and business services saw an increase of 70,000 to lead all sectors, while healthcare was next at 42,000. Other areas seeing notable growth included transportation and warehousing (25,000) and manufacturing (19,000).", "source": "CNBC Top News", "pub_date_str": "06 Nov 2026, 08:27 PM IST", "pub_date_relative": "18m ago"}, {"title": "Deepinder Goyal Vs Doctors: What Is The Row Over 'Temple' - An Explainer", "full_content": "Deepinder Goyal's Rs 85,000 Temple wearable has sparked a war of words with doctors over its brain-monitoring claims, scientific evidence and validation.", "source": "NDTV Profit", "pub_date_str": "06 Nov 2026, 08:26 PM IST", "pub_date_relative": "19m ago"}, {"title": "Trump\u2019s Iran war has changed the future of Social Security", "full_content": "It\u2019s a mathematical certainty that the Iran war is going to have an enormous influence on the future of retirement in America.", "source": "MarketWatch Top Stories", "pub_date_str": "06 Nov 2026, 08:25 PM IST", "pub_date_relative": "21m ago"}, {"title": "PVR INOX Issues Clarification After Food Counter Temporarily Shut Over Complaint", "full_content": "Karnataka Health Minister UT Khader asked the public to report unhygienic food, packaging or serving practices by scanning the Food Safety QR code.", "source": "NDTV Profit", "pub_date_str": "06 Nov 2026, 08:24 PM IST", "pub_date_relative": "22m ago"}, {"title": "SEBI's New Settlement Formula: What Determines How Much An Applicant Pays, And How To Calculate?", "full_content": "SEBI has created a calculator which calculates settlement amount in accordance with the new Settlement Regulations.", "source": "NDTV Profit", "pub_date_str": "06 Nov 2026, 08:21 PM IST", "pub_date_relative": "24m ago"}, {"title": "The S&P 500 has become a big AI bet. Here are some simpl national service program in \u2060impoverished rural West Virginia from 1964 to 1966.\n\nWhen he was put in public office, he worked to increase healthcare access, fight poverty, provide health benefits to coal miners and assist military veterans. As a senator, he had a role in shaping the program created in 1997 under which the U.S.", "source": "CNBC Top News", "pub_date_str": "06 Nov 2026, 07:55 PM IST", "pub_date_relative": "50m ago"}, {"title": "Arini\u2019s credit troubles suggest roach-hunting season is back", "full_content": "The London-based fund ploughed billions into the riskiest parts of the junk bond market \u2014 and these have now soured", "source": "FT Markets", "pub_date_str": "06 Nov 2026, 07:53 PM IST", "pub_date_relative": "52m ago"}, {"title": "Ikea Sales Fall As Cash-Strapped Shoppers Curb Furniture Buying", "full_content": "In September, Inter Ikea and its retailers committed about \"1.2 billion to a fresh round of price reductions across Europe.", "source": "NDTV Profit", "pub_date_str": "06 Nov 2026, 07:52 PM IST", "pub_date_relative": "53m ago"}, {"title": "Family offices boost startup investments in October, backing women's health and caregivers", "full_content": "A version of this article appeared in CNBC's Inside Wealth newsletter, a weekly guide to the high-net-worth investor and consumer. Sign up to receive future editions, straight to your inbox.\n\nAfter a slow September, investment firms of ultra-wealthy families stepped up their deal-making last month. In October, family offices made 56 direct investments in companies, up about 30% from the month prior, according to data provided exclusively to CNBC by Fintrx, a private wealth intelligence platform.\n\nLaurene Powell Jobs' Emerson Collective was the most prolific investor of the month, backing three healthcare startups according to Fintrx data. Her investment and philanthropy firm seeks to address health equity and other complex challenges like the energy transition.\n\nLast month, Emerson Collective joined a $555 million Series G for Devoted Health, a healthcare provider and insurer of Medicare Advantage plans, alongside information technology billionaire Azim Premji's namesake family office. Devoted Health, which has counted Emerson Collective as an investor since 2021, announced that it will use the fundraise to expand to five additional states for a total of 34.\n\nPowell Jobs' firm also participated in two fundraises for healthcare data startups BioStack and Collective X Health. BioStack, which raised $9.5 million in seed funding, analyzes patient records across different institutions to create training datasets for artificial intelligence healthcare models. Collective X Health, fresh off a $3.2 million pre-seed round, seeks to close the gender data gap by compiling and licensing peer-reviewed, female-specific data and research.\n\nEmerson Collective is in good company as family offices continue to invest in healthcare innovations from telehealth to drug discovery.", "source": "CNBC Top News", "pub_date_str": "06 Nov 2026, 07:46 PM IST", "pub_date_relative": "59m ago"}, {"title": "Interpath executive in talks over Grant Thornton switch after tensions", "full_content": "Will Wright, UK head of the former KPMG restructuring arm, has won work on several high-profile company insolvencies", "source": "FT Markets", "pub_date_str": "06 Nov 2026, 07:46 PM IST", "pub_date_relative": "1h ago"}, {"title": "CBSE Releases Class 10 And 12 Date Sheets For 2027 Board Exams, Check Key Details", "full_content": "More than 46 lakh students have registered, with 26.5 lakh in Class 10 and 19.8 lakh in Class 12 for the 2027 examinations.", "source": "NDTV Profit", "pub_date_str": "06 Nov 2026, 07:45 PM IST", "pub_date_relative": "1h ago"}, {"title": "\u2018It seems bizarre\u2019: We\u2019re in our 80s with $950,000 in traditional IRAs. Why is our adviser pushing Roth conversions?", "full_content": "\u201cOur basic living expenses are covered by $110,000 in annual pensions and Social Security.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "06 Nov 2026, 07:45 PM IST", "pub_date_relative": "1h ago"}, {"title": "Who Is Sunil D\u2019Souza? Tata Consumer\u2019s CEO Set To Succeed Noel Tata As Voltas Chairman", "full_content": "Voltas has named Sunil D\u2019Souza its next chairman, marking a major leadership transition at the Tata Group\u2019s air-conditioning and engineering enterprise.", "source": "NDTV Profit", "pub_date_str": "06 Nov 2026, 07:43 PM IST", "pub_date_relative": "1h ago"}, {"title": "Stockal Says Two More Platforms Have Affected Investors After DriveWealth Breach. Is Yours Linked?", "full_content": "A list of 29 Indian platforms associated with DriveWealth through direct, indirect and historical relationships has been identified.", "source": "NDTV Profit", "pub_date_str": "06 Nov 2026, 07:43 PM IST", "pub_date_relative": "1h ago"}, {"title": "Pulse of the Street: Dalal Street shines before Diwali. Can the rally last?", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nIndian equities headed into Diwali with a second straight weekly gain, powered by cheaper crude amid rising hopes of an end to the Iran war following US President Donald Trump's midterm election setback, and renewed foreign buying, even as a sell-off in technology stocks battered several overseas markets.\n\nThe Nifty and Sensex rose nearly 9% each during the week, marking their strongest weekly gains since February 2021, when optimism over a growth-oriented Union Budget had sparked a rally of nearly 10%. On Friday, the Nifty rose 2% to close at 25,030.35, while the Sensex advanced 2.2% to 81,028.\n\nThe strong market momentum helped the index break above the 24,774.3 resistance level, not tested since 3 August. The current momentum could propel the market towards 25,178.65, the level at which it was trading before the West Asia war began February-end, said an analyst at Aditya Birla Money.\n\nConsumer durables, realty and financial services led the weekly rally as investors favoured businesses tied to domestic demand.\n\nIndia\u2019s limited exposure to the global artificial intelligence (AI) trade helped it buck the sell-off elsewhere, said Kranthi Bathini, director of research at WealthMills Securities.\n\nCorrections in AI, semiconductor and data-centre stocks weighed on overseas markets, while falling oil prices improved India\u2019s appeal, he added.\n\nThe rebound has raised hopes that Indian equities are regaining their footing after a difficult stretch. But analysts remain divided on whether it marks a durable recovery or reflects expectations of easing geopolitical tensions.", "source": "LiveMint Markets", "pub_date_str": "06 Nov 2026, 07:43 PM IST", "pub_date_relative": "1h ago"}, {"title": "Salman Khan Announces 'Maatrubhumi' Release Date; Denies Government Pressure", "full_content": "Salman Khan has announced Maatrubhumi\u2019s December 4 release after delays caused by VFX work and Chitrangda Singh\u2019s injury, while denying reports of government pressure to change the film\u2019s script.", "source": "NDTV Profit", "pub_date_str": "06 Nov 2026, 07:42 PM IST", "pub_date_relative": "1h ago"}, {"title": "Diwali stock picks: 4 large cap stocks to buy for Samvat 2083 - PL Capital bullish on BEL, Britannia to ICICI | Target", "full_content": "BRITANNIA ICICIBANK SHRIRAMFIN Sharmila Bhadoria Published 6 Nov 2026, 07:41 PM IST Prefer Livemint on Google Diwali stock picks: The Indian stock market saw a roller-coaster ride last Samvat with Nifty 50 testing 22,300 support for two times in the past 6 months. As Samvat 2083 is all set to begin with Diwali muhurat trading on November 8, PL Capital released its top picks for the new Samvat.\n\nBharat Electronics Limited (BEL), Britannia Industries Limited, ICICI Bank , and Shriram Finance are among the top Diwali large cap stock picks by PL Capital for Samvat 2083. Check target price for these large cap stock recommendations and target price.\n\nBharat Electronics share price closed 0.16% higher at \u20b9 395.50 per share on BSE with a market capitalisation of \u20b9 2,89,101.75 crore on Friday, November 6. Its strong order book will provide healthy execution visibility.\n\nThe company\u2019s QRSAM orders are \u201cexpected shortly with BEL well positioned to retain its role given its decade-long development experience,\u201d read PL Capital report. The brokerage gave a \u2018Buy\u2019 rating with a target price of \u20b9 490 per share.\n\nBritannia Industries share price closed 4790 per share on BSE with a market capitalisation of \u20b9 1,15,375.91 crore on Friday, November 6. The stock has delivered 5.33% return in two weeks, but has declined 20.28% in one year.\n\nBritannia Industries continues to remain a high-conviction pick, underpinned by leadership in biscuits and bakery, sustained growth in signature brands, which grew 3x faster than the rest of the portfolio in FY26, improving scalability and profitability, and a robust innovation pipeline, as per PL Capital report. The brokerage gave a target price of \u20b9 6,579 per share.\n\nEarnings quality has helped ICICI Bank to retain its top position among best performing private sector companies. Its balance sheet profile remained strong with CET-1 adequate at 16%, resilient margins and strong NII/fee income, highlighted PL Capital in its report.", "source": "LiveMint Markets", "pub_date_str": "06 Nov 2026, 07:41 PM IST", "pub_date_relative": "1h ago"}, {"title": "NHAI issues guidelines to standardise design and infrastructure for multi-lane free flow tolling", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Infrastructure \u203a NHAI issues guidelines to standardise design and infrastructure for multi-lane free flow tolling The Economic Times daily newspaper is available online now. Read Today's Paper NHAI issues guidelines to standardise design and infrastructure for multi-lane free flow tolling SECTIONS NHAI issues guidelines to standardise design and infrastructure for multi-lane free flow tolling PTI Last Updated: Nov 06, 2026, 07:40:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis NHAI, in a statement, said the guidelines will ensure that upcoming and ongoing national highway projects are equipped to support MLFF-based barrier-free toll collection without requiring vehicles to stop at toll booths.\n\nJunk bonds are cracking at the bottom. Will the noise get loud enough to make \u2018junk bond\u2019 a household term again?\n\nPNG connections rise half a million, but how many use piped gas for cooking?\n\nSome elections matter more than you know: No crop changed in the fields, yet sugar, coffee and soya got cheaper in a day\n\nYou can buy a walkie-talkie online. But can you legally use it?\n\nKYB and KYC: Quick commerce, the Damani premium and what DMart must deliver \u2013 3rd and concluding part\n\nKYC and KYB: Inside Damani\u2019s DMart, the retail chain for the middle class. And stock for the long term? \u2013 Part 2 of 3\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "06 Nov 2026, 07:40 PM IST", "pub_date_relative": "1h ago"}, {"title": "Is Your E20 Petrol Actually E30? Karnataka Minister Flags Excess Ethanol In Fuel Samples", "full_content": "Karnataka wants petrol pumps to display ethanol percentages and has sought a compensation mechanism for motorists alleging vehicle damage.", "source": "NDTV Profit", "pub_date_str": "06 Nov 2026, 07:40 PM IST", "pub_date_relative": "1h ago"}, {"title": "Wall Street's fear gauge may be flashing a buy sign", "full_content": "There's nothing like a good selloff to turn a trader into an investor \u2013 so the saying goes. It's an adage that echoes the sentiment of an even older one: buy when there's blood in the streets. The maxims ring true after Thursday's selloff in stocks that sent the Cboe Volatility Index (VIX) to its biggest one-day move since April 2025's \"Liberation\" week for tariffs , according to data from Bespoke Investment Group. In the 19 instances since 1990 in which the VIX rose at least five points from under 20 \u2013 it surged more than 11 points from 16.6 to 28.2 Thursday \u2013 the median return for the S&P 500 Index three months later was 4.2%, and 4.8% six months later, according to Bespoke analysis that also showed returns were positive 68% and 79% of the time over each period, respectively. \"These types of sharp spikes from placid levels are like a line of thunderstorms coming through in summer,\" said Paul Hickey, co-founder of Bespoke. \"The sky quickly darkens and wind gusts, but the loudest thunder and brightest lightning doesn't last long.\"\n\nCboe Volatility Index, YTD To be sure, the data do show the storms can be disruptive near-term. While the median return one month after such events was 2.1%, the average return was negative 0.4%, thanks to a few big downdrafts following volatility surges in 1990 and more recently, Feb. 24, 2020, when the Covid selloff was just getting started. According to X account OddStats, there were only 12 other days in stock market history prior to Thursday when the S&P 500 lost 4% and the Nasdaq 100 Index lost 6% \u2013 including one during Liberation week 2025 and three instances during the 2020 pandemic. Tech volatility was even more pronounced as the Nasdaq 100 posted its worst day since March 2020. The Cboe Nasdaq Volatility Index VXN jumped more than 13 points to 38.3, the highest since April 11, 2025. The selling was so intense in chipmakers that the VanEck Semiconductor ETF (SMH) traded below its net asset value.", "source": "CNBC Top News", "pub_date_str": "06 Nov 2026, 07:32 PM IST", "pub_date_relative": "1h ago"}, {"title": "Our top 10 things to watch in the stock market Friday", "full_content": "Nasdaq futures are rebounding, and the October jobs report came in strong.", "source": "CNBC Top News", "pub_date_str": "06 Nov 2026, 07:31 PM IST", "pub_date_relative": "1h ago"}, {"title": "Upcoming IPO: Coal India\u2019s Mahanadi Coalfields gets Sebi nod for public issue; top things to know about PSU public offer", "full_content": "Rajendra Saxena Published 6 Nov 2026, 07:31 PM IST Prefer Livemint on Google Mahanadi Coalfields Ltd (MCL), a subsidiary of state-owned Coal India Ltd, has received approval from the Securities and Exchange Board of India (Sebi) to proceed with its proposed initial public offering (IPO). The development brings the coal producer one step closer to entering the stock market, with the public issue expected to be launched in the second half of November or early December.\n\nAccording to news agency PTI , citing sources, Sebi issued its final observations on MCL's draft offer documents on November 4. The regulator's observations mark an important milestone in the IPO process, allowing the company to move ahead with preparations for the public issue, subject to applicable regulatory requirements.\n\nBloomberg , citing people familiar with the matter, reported that Coal India is preparing to launch the share sale as early as this month. MCL has reportedly started investor meetings to gauge interest in the proposed offering.\n\nThe IPO could raise up to $1 billion (approximately \u20b9 8,800 crore) and value Mahanadi Coalfields at as much as $10 billion, according to the Bloomberg report.\n\nMCL filed its draft red herring prospectus (DRHP) with Sebi in September. According to the draft documents, the proposed IPO will be entirely an offer for sale (OFS) by promoter Coal India.\n\nThe public issue will involve the sale of up to 66,18,36,300 equity shares held by Coal India. Since the offering is an OFS, Mahanadi Coalfields will not receive any proceeds from the IPO. The entire amount raised will go to Coal India as the selling shareholder.\n\nSBI Capital Markets, Axis Capital, BOB Capital Markets, IDBI Capital Markets & Securities and IIFL Capital Services have been appointed as book-running lead managers for the proposed issue.\n\nThe company's shares are proposed to be listed on both the Bombay Stock Exchange (BSE) and the National Stock Exchange (NSE).", "source": "LiveMint Markets", "pub_date_str": "06 Nov 2026, 07:31 PM IST", "pub_date_relative": "1h ago"}, {"title": "Stock market today: Nasdaq futures rebound after brutal sell-off, Dow and S&P 500 wobble as US adds 165K jobs - Yahoo Finance", "full_content": "Stock market today: Nasdaq futures rebound after brutal sell-off, Dow and S&P 500 wobble as US adds 165K jobs Yahoo Finance What sparked the stock market\u2019s $2.5 trillion sell-off? CNN Markets realise they hate America\u2019s blue wave The Economist Fears of an AI crackdown after midterms spark $2 trillion rout in tech stocks NPR Nasdaq attempts to recover from worst rout in 19 months as AI stocks see some buying: Live updates CNBC", "source": "Google News Business", "pub_date_str": "06 Nov 2026, 07:29 PM IST", "pub_date_relative": "1h ago"}, {"title": "SNVA Traveltech IPO: Updated DRHP Filed, Issue To Be Entirely An Offer For Sale", "full_content": "SNVA Traveltech, the parent company of online travel platform Travomint, has filed an updated DRHP for an IPO entirely comprising an offer for sale of 12.75 crore shares by its promoters.", "source": "NDTV Profit", "pub_date_str": "06 Nov 2026, 07:28 PM IST", "pub_date_relative": "1h ago"}, {"title": "Market sell-off hits hard: Advisors say 'stay the course with an eye on buying'", "full_content": "Top financial advisors aren't urging clients to change their portfolios after Thursday's sharp market sell-off, even as retail investors were heavy sellers of individual stocks .\n\nIn a Thursday flash poll of advisors from CNBC's Financial Advisor 100 and Financial Advisor Council , more than three-quarters of respondents said investors' first steps should be to check their allocation against their goals or stay the course. The online poll, conducted from 2:30 p.m. to 6 p.m. ET on Thursday, was sent to 121 firms and 38 responded.\n\nRetail investors sold individual stocks Thursday as technology stocks tumbled, and the Dow gave back its post-midterm election gains. The S&P 500 suffered its worst one-day drop since April 2025 on Thursday. Analysts linked the sell-off to fears of a data center construction slowdown following major Democratic election wins.\n\nThe Nasdaq Composite tumbled 5.5%, closing more than 10% below its most recent high and putting it in what Wall Street regards as a correction. The broad-market S&P 500 lost 4.4%, while the Dow fell more than 1,800 points, or 3.4%.\n\nYet, financial advisors who answered the CNBC poll overwhelmingly responded that they are not recommending changes to their clients' portfolios. The broader message from interviews with several advisors: review whether your portfolio still matches your goals, but don't let a sudden market move make the decision for you.\n\nFor investors who continue contributing to a 401(k), a market decline can mean buying investments at lower prices over time, said Andy Pratt, director of investment strategy at Burney Wealth Management in Reston, Virginia.\n\n\"If you have a 401(k), money is being allocated there biweekly, monthly, you know, whatever your pay period is, and so you're able to dollar-cost average in,\" Pratt said. \"So when the market does sell off, you're entering at a much better spot.\"\n\nPratt said a well-designed portfolio may not need changes during a downturn.", "source": "CNBC Top News", "pub_date_str": "06 Nov 2026, 07:26 PM IST", "pub_date_relative": "1h ago"}, {"title": "Asked to be a friend\u2019s loan guarantor? Know these financial risks before you agree to help, and when to avoid saying yes", "full_content": "Your friend asks you to stand as a guarantor for their loan and saying yes may seem like a simple way to help them. But one must understand that the decision comes with financial and legal responsibilities that can outlast the friendship.\n\nA loan guarantor is an individual who agrees to repay the debt if the borrower fails to do so. Banks may ask for one when the borrower does not meet their income or credit score requirements, or when the loan amount is substantial or the repayment period is long.\n\nHowever, becoming a guarantor is not just a formality. You sign a legally binding agreement, known as a guarantee, which outlines your obligation to repay the borrower's loan in case they end up defaulting.\n\nUnder Section 128 of the Indian Contract Act, the guarantor is liable to cover the debt, including any accrued interest and penalties. So, before agreeing to help a friend, understand the risks and when it may be wiser to say no.\n\nIn a blog post published in August 2025, HDFC Bank has flagged some risks that potential guarantors should consider before entering into a loan guarantee agreement. Here are four key risks to assess before agreeing:\n\nBefore you commit your friend to become their loan guarantor, it's a prudent approach to first check the said friend's financial stability and repayment history. You can also ask the borrower for their credit report .\n\nAlso read the guarantee agreement carefully, seek legal advice if needed, and understand your obligations in case of a default. You must also stay updated on EMI payments to spot any repayment delays early.\n\nIf possible, you can also consider having a co-guarantor to share the responsibility, although this does not automatically limit your liability. If you spot any discrepancies in your friend's credit report or see a trend of them relying on credit for daily expenses, it's better to say no to the arrangement.", "source": "LiveMint Money", "pub_date_str": "06 Nov 2026, 07:23 PM IST", "pub_date_relative": "1h ago"}, {"title": "A long-term Elon Musk backer is cashing out of Tesla \u2014 and cutting its SpaceX exposure", "full_content": "A key early investor has sold the last of its Tesla shares and sharply reduced its SpaceX holding, taking profits from two of its most successful long-term bets.\n\nScottish Mortgage Investment Trust , a London-listed closed-end fund managed by Baillie Gifford, said Friday that SpaceX represented 11.1% of its total assets as of Wednesday, down from 15% at Sept. 30.\n\nThe position helped drive Scottish Mortgage's 31.5% net asset value return in the six months to the end of September. In its half-year results statement, Scottish Mortgage also said it sold its remaining Tesla stake in April, ending an investment that dated back to 2013.\n\nScottish Mortgage first invested in SpaceX in December 2018, when Elon Musk 's rocket company had a reported valuation of about $31 billion, and committed roughly $200 million through 2021.\n\nScottish Mortgage Investment Trust. The investment surged in value as SpaceX expanded its launch business and Starlink satellite network. By the time of its blockbuster IPO in June, SpaceX represented roughly a quarter of Scottish Mortgage's portfolio by value.\n\nThe investment trust has since sold shares as post-IPO lock-up restrictions have lifted in stages, though it said its conviction in SpaceX remains high.\n\n\"The decision to reduce the position following its flotation, while retaining a substantial investment, demonstrates the importance of balancing conviction with disciplined portfolio management,\" Scottish Mortgage said.\n\nSpaceX was a major contributor to Scottish Mortgage's performance during the period, adding 8 percentage points to returns.", "source": "CNBC Top News", "pub_date_str": "06 Nov 2026, 07:21 PM IST", "pub_date_relative": "1h ago"}, {"title": "Nasdaq drops into correction territory \u2014 here\u2019s what typically happens next", "full_content": "The Nasdaq Composite plunged into correction territory on Thursday. History shows more selling can follow in the near term, but a recovery eventually takes hold three months later.\n\nThe tech-heavy index slid more than 5% on Thursday, closing more than 11% below its record reached last month. On Wall Street, any decline greater than 10% is a correction. A 20% pullback qualifies as a bear market.\n\nAcross 10 previous correction episodes over the last decade, selloffs in 2025, 2022, 2020 and 2018 were followed by further rough selling over the next one month. But the Nasdaq was back to rally mode again after six months for all those occasions except one: 2022.\n\nOverall, the Nasdaq gained an average of 9.41% from the correction bottom over the following three months and 17.03% over six months.\n\nThe January 2022 correction was the one that offered a harsher outcome. The Nasdaq lost another 18.3% over the next six months and was down 24.3% a year later.\n\nThe catalyst for this correction was Democrats sweeping the House and Senate in Tuesday's midterm elections. The party also made significant gains in Texas, where Gina Hinojosa won the race for governor after campaigning on an immediate moratorium for data center development.\n\nInvestors are now weighing whether tighter state-level restrictions could slow data center construction, putting pressure on companies tied to the artificial intelligence trade.\n\nFrank Cappelleri, founder of CappThesis, pointed to past midterm election cycles for guidance and found that points to more volatility in the near term as well.", "source": "CNBC Finance", "pub_date_str": "06 Nov 2026, 07:17 PM IST", "pub_date_relative": "1h ago"}, {"title": "Deepinder Goyal Apologises To Indian Doctors After Temple 'Scam' Row, Says Criticism Was For Influencers", "full_content": "Goyal had earlier defended Temple by citing a $30 million investment, a 14-day return policy and plans for further scientific validation.", "source": "NDTV Profit", "pub_date_str": "06 Nov 2026, 07:17 PM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "Franklin DE earnings beat by $0.17, revenue topped estimates", "full_content": "", "source": "Investing.com News", "pub_date_str": "06 Nov 2026, 08:42 PM IST", "pub_date_relative": "3m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Gogo Inc earnings missed by $0.10, revenue fell short of estimates", "full_content": "", "source": "Investing.com News", "pub_date_str": "06 Nov 2026, 08:40 PM IST", "pub_date_relative": "5m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Optimum Communications earnings missed by $10.06, revenue topped estimates", "full_content": "", "source": "Investing.com News", "pub_date_str": "06 Nov 2026, 08:40 PM IST", "pub_date_relative": "5m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Moderna raises its revenue outlook \u2014 but all eyes are on what happens next with its cancer vaccine", "full_content": "The company lifted its revenue outlook for the year, saying it expects revenue to grow as much as 25% in 2026.", "source": "MarketWatch Top Stories", "pub_date_str": "06 Nov 2026, 08:39 PM IST", "pub_date_relative": "7m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Muhurat Trading 2026: Equirus Prive's 16 Diwali picks include HDFC Bank, M&M, ESFB Voltas; upside seen up to 54%", "full_content": "ARMANFIN LLOYDSENGG MASFIN ANTELOPUS A Ksheerasagar Published 6 Nov 2026, 08:36 PM IST Prefer Livemint on Google Equirus Prive, the private wealth offering of Equirus Wealth, has unveiled its Diwali Picks 2026, a curated portfolio of 16 high-conviction stock recommendations spanning large-cap, mid-cap, and emerging companies.\n\nWith an investment horizon extending to December 2027, the portfolio identifies businesses that, in Equirus Prive's assessment, are well positioned to benefit from India's evolving economic landscape and long-term structural growth opportunities.\n\nThe list spans sectors such as financial services, automobiles, manufacturing, infrastructure, and energy and consumption, bringing together established market leaders and emerging businesses positioned to capitalise on India's evolving growth landscape.\n\nThe portfolio has a higher allocation to financial services, reflecting Equirus Prive's positive outlook on India's credit growth, financial inclusion, and the increasing formalisation of savings.\n\nPallav Bagaria, Managing Director of Equirus Wealth, said, \"India's long-term growth story continues to offer opportunities across businesses and sectors, driven by rising domestic consumption, infrastructure development, manufacturing investments, and the increasing formalisation of the economy.\"\n\n\"Through our Diwali Picks 2026, we have identified 16 companies that, in our assessment, offer compelling opportunities to participate in these structural trends. Our approach brings together established businesses with strong competitive positions and emerging companies with differentiated growth opportunities, supported by fundamental research and a focus on long-term value creation,\" Bagaria added.\n\nThe brokerage has picked HDFC Bank, with a target price of \u20b9 990, indicating an upside potential of 30% from its current market price (CMP) of \u20b9 760.", "source": "LiveMint Markets", "pub_date_str": "06 Nov 2026, 08:36 PM IST", "pub_date_relative": "9m ago", "cfa_topics": ["Alternative Investments", "Portfolio Management"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "US Stock Market Today: Nasdaq, S&P 500 Open Slightly Higher, After Rebound Post Chip Stocks Selloff, US Jobs Report", "full_content": "The Dow Jones Industrial Average was down 1%. The S&P 500 gained 0.3%, and the Nasdaq Composite increased 1.1%.", "source": "NDTV Profit", "pub_date_str": "06 Nov 2026, 08:33 PM IST", "pub_date_relative": "12m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "U.S. economy added 165,000 jobs in October, way more than expected; unemployment rate slips to 4.1%", "full_content": "The U.S. economy added jobs at a much stronger-than-expected pace in October, while the unemployment rate moved lower as the labor market showed surprising strength.\n\nNonfarm payrolls increased by a seasonally adjusted 165,000 for the month, compared with the Dow Jones estimate for 59,000, the Bureau of Labor Statistics reported Friday.\n\nThe unemployment rate nudged down to 4.1%, compared with the forecast for 4.2%. A more encompassing measure that includes discouraged workers and those holding part-time jobs for economic reasons rose to 7.9%, up 0.3 percentage point, amid an increase of 421,000 in the civilian labor force.\n\nIn addition to the strong payroll gains for October, prior months were revised up substantially: The August figure moved to 186,000, an upward revision of 53,000, while the September count shifted to 60,000 following an upward revision of 31,000.\n\nPayroll gains also came in better than forecast. Average hourly earnings increased 0.4% on the month and 3.1% annually, compared with respective estimates for 0.3% and 2.9%. The average workweek was unchanged at 34.4 hours.\n\n\"Today's jobs report is a strong rebuttal to fears that the economy is heading into a meaningful slowdown,\" said Seema Shah, chief global strategist at Principal Asset Management. \"Payrolls growth surprised firmly to the upside, unemployment fell back to 4.1%, and job creation remains broad-based, pointing to an economy that is still absorbing labor comfortably rather than one beginning to buckle under tighter financial conditions.\"\n\nThe breadth of job growth also was strong, contrary to a trend in which healthcare had accounted for the bulk of gains.\n\nProfessional and business services saw an increase of 70,000 to lead all sectors, while healthcare was next at 42,000. Other areas seeing notable growth included transportation and warehousing (25,000) and manufacturing (19,000).", "source": "CNBC Top News", "pub_date_str": "06 Nov 2026, 08:27 PM IST", "pub_date_relative": "18m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "The S&P 500 has become a big AI bet. Here are some simple alternatives.", "full_content": "The large-cap index is nowhere near as diversified as you think.", "source": "MarketWatch Top Stories", "pub_date_str": "06 Nov 2026, 08:21 PM IST", "pub_date_relative": "25m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Live Updates: U.S. Jobs Report Shows Strength After Stock Market Falls - The New York Times", "full_content": "Live Updates: U.S. Jobs Report Shows Strength After Stock Market Falls The New York Times 'A blowout': US added 165,000 jobs in October, trouncing expectations Yahoo Finance 10-year Treasury yield rises after much stronger-than-expected October jobs report CNBC US job growth surges in October; unemployment rate falls to 4.1% Reuters Jobs report today: Payrolls and wages were stronger than expected in October, pressuring Fed \u2014 live updates MarketWatch", "source": "Google News Business", "pub_date_str": "06 Nov 2026, 08:20 PM IST", "pub_date_relative": "25m ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income"], "exam_note" se nearly 9% each during the week, marking their strongest weekly gains since February 2021, when optimism over a growth-oriented Union Budget had sparked a rally of nearly 10%. On Friday, the Nifty rose 2% to close at 25,030.35, while the Sensex advanced 2.2% to 81,028.\n\nThe strong market momentum helped the index break above the 24,774.3 resistance level, not tested since 3 August. The current momentum could propel the market towards 25,178.65, the level at which it was trading before the West Asia war began February-end, said an analyst at Aditya Birla Money.\n\nConsumer durables, realty and financial services led the weekly rally as investors favoured businesses tied to domestic demand.\n\nIndia\u2019s limited exposure to the global artificial intelligence (AI) trade helped it buck the sell-off elsewhere, said Kranthi Bathini, director of research at WealthMills Securities.\n\nCorrections in AI, semiconductor and data-centre stocks weighed on overseas markets, while falling oil prices improved India\u2019s appeal, he added.\n\nThe rebound has raised hopes that Indian equities are regaining their footing after a difficult stretch. But analysts remain divided on whether it marks a durable recovery or reflects expectations of easing geopolitical tensions.", "source": "LiveMint Markets", "pub_date_str": "06 Nov 2026, 07:43 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Diwali stock picks: 4 large cap stocks to buy for Samvat 2083 - PL Capital bullish on BEL, Britannia to ICICI | Target", "full_content": "BRITANNIA ICICIBANK SHRIRAMFIN Sharmila Bhadoria Published 6 Nov 2026, 07:41 PM IST Prefer Livemint on Google Diwali stock picks: The Indian stock market saw a roller-coaster ride last Samvat with Nifty 50 testing 22,300 support for two times in the past 6 months. As Samvat 2083 is all set to begin with Diwali muhurat trading on November 8, PL Capital released its top picks for the new Samvat.\n\nBharat Electronics Limited (BEL), Britannia Industries Limited, ICICI Bank , and Shriram Finance are among the top Diwali large cap stock picks by PL Capital for Samvat 2083. Check target price for these large cap stock recommendations and target price.\n\nBharat Electronics share price closed 0.16% higher at \u20b9 395.50 per share on BSE with a market capitalisation of \u20b9 2,89,101.75 crore on Friday, November 6. Its strong order book will provide healthy execution visibility.\n\nThe company\u2019s QRSAM orders are \u201cexpected shortly with BEL well positioned to retain its role given its decade-long development experience,\u201d read PL Capital report. The brokerage gave a \u2018Buy\u2019 rating with a target price of \u20b9 490 per share.\n\nBritannia Industries share price closed 4790 per share on BSE with a market capitalisation of \u20b9 1,15,375.91 crore on Friday, November 6. The stock has delivered 5.33% return in two weeks, but has declined 20.28% in one year.\n\nBritannia Industries continues to remain a high-conviction pick, underpinned by leadership in biscuits and bakery, sustained growth in signature brands, which grew 3x faster than the rest of the portfolio in FY26, improving scalability and profitability, and a robust innovation pipeline, as per PL Capital report. The brokerage gave a target price of \u20b9 6,579 per share.\n\nEarnings quality has helped ICICI Bank to retain its top position among best performing private sector companies. Its balance sheet profile remained strong with CET-1 adequate at 16%, resilient margins and strong NII/fee income, highlighted PL Capital in its report.", "source": "LiveMint Markets", "pub_date_str": "06 Nov 2026, 07:41 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "NHAI issues guidelines to standardise design and infrastructure for multi-lane free flow tolling", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Infrastructure \u203a NHAI issues guidelines to standardise design and infrastructure for multi-lane free flow tolling The Economic Times daily newspaper is available online now. Read Today's Paper NHAI issues guidelines to standardise design and infrastructure for multi-lane free flow tolling SECTIONS NHAI issues guidelines to standardise design and infrastructure for multi-lane free flow tolling PTI Last Updated: Nov 06, 2026, 07:40:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis NHAI, in a statement, said the guidelines will ensure that upcoming and ongoing national highway projects are equipped to support MLFF-based barrier-free toll collection without requiring vehicles to stop at toll booths.\n\nJunk bonds are cracking at the bottom. Will the noise get loud enough to make \u2018junk bond\u2019 a household term again?\n\nPNG connections rise half a million, but how many use piped gas for cooking?\n\nSome elections matter more than you know: No crop changed in the fields, yet sugar, coffee and soya got cheaper in a day\n\nYou can buy a walkie-talkie online. But can you legally use it?\n\nKYB and KYC: Quick commerce, the Damani premium and what DMart must deliver \u2013 3rd and concluding part\n\nKYC and KYB: Inside Damani\u2019s DMart, the retail chain for the middle class. And stock for the long term? \u2013 Part 2 of 3\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "06 Nov 2026, 07:40 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Wall Street's fear gauge may be flashing a buy sign", "full_content": "There's nothing like a good selloff to turn a trader into an investor \u2013 so the saying goes. It's an adage that echoes the sentiment of an even older one: buy when there's blood in the streets. The maxims ring true after Thursday's selloff in stocks that sent the Cboe Volatility Index (VIX) to its biggest one-day move since April 2025's \"Liberation\" week for tariffs , according to data from Bespoke Investment Group. In the 19 instances since 1990 in which the VIX rose at least five points from under 20 \u2013 it surged more than 11 points from 16.6 to 28.2 Thursday \u2013 the median return for the S&P 500 Index three months later was 4.2%, and 4.8% six months later, according to Bespoke analysis that also showed returns were positive 68% and 79% of the time over each period, respectively. \"These types of sharp spikes from placid levels are like a line of thunderstorms coming through in summer,\" said Paul Hickey, co-founder of Bespoke. \"The sky quickly darkens and wind gusts, but the loudest thunder and brightest lightning doesn't last long.\"\n\nCboe Volatility Index, YTD To be sure, the data do show the storms can be disruptive near-term. While the median return one month after such events was 2.1%, the average return was negative 0.4%, thanks to a few big downdrafts following volatility surges in 1990 and more recently, Feb. 24, 2020, when the Covid selloff was just getting started. According to X account OddStats, there were only 12 other days in stock market history prior to Thursday when the S&P 500 lost 4% and the Nasdaq 100 Index lost 6% \u2013 including one during Liberation week 2025 and three instances during the 2020 pandemic. Tech volatility was even more pronounced as the Nasdaq 100 posted its worst day since March 2020. The Cboe Nasdaq Volatility Index VXN jumped more than 13 points to 38.3, the highest since April 11, 2025. The selling was so intense in chipmakers that the VanEck Semiconductor ETF (SMH) traded below its net asset value.", "source": "CNBC Top News", "pub_date_str": "06 Nov 2026, 07:32 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Derivatives", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Our top 10 things to watch in the stock market Friday", "full_content": "Nasdaq futures are rebounding, and the October jobs report came in strong.", "source": "CNBC Top News", "pub_date_str": "06 Nov 2026, 07:31 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Derivatives"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Upcoming IPO: Coal India\u2019s Mahanadi Coalfields gets Sebi nod for public issue; top things to know about PSU public offer", "full_content": "Rajendra Saxena Published 6 Nov 2026, 07:31 PM IST Prefer Livemint on Google Mahanadi Coalfields Ltd (MCL), a subsidiary of state-owned Coal India Ltd, has received approval from the Securities and Exchange Board of India (Sebi) to proceed with its proposed initial public offering (IPO). The development brings the coal producer one step closer to entering the stock market, with the public issue expected to be launched in the second half of November or early December.\n\nAccording to news agency PTI , citing sources, Sebi issued its final observations on MCL's draft offer documents on November 4. The regulator's observations mark an important milestone in the IPO process, allowing the company to move ahead with preparations for the public issue, subject to applicable regulatory requirements.\n\nBloomberg , citing people familiar with the matter, reported that Coal India is preparing to launch the share sale as early as this month. MCL has reportedly started investor meetings to gauge interest in the proposed offering.\n\nThe IPO could raise up to $1 billion (approximately \u20b9 8,800 crore) and value Mahanadi Coalfields at as much as $10 billion, according to the Bloomberg report.\n\nMCL filed its draft red herring prospectus (DRHP) with Sebi in September. According to the draft documents, the proposed IPO will be entirely an offer for sale (OFS) by promoter Coal India.\n\nThe public issue will involve the sale of up to 66,18,36,300 equity shares held by Coal India. Since the offering is an OFS, Mahanadi Coalfields will not receive any proceeds from the IPO. The entire amount raised will go to Coal India as the selling shareholder.\n\nSBI Capital Markets, Axis Capital, BOB Capital Markets, IDBI Capital Markets & Securities and IIFL Capital Services have been appointed as book-running lead managers for the proposed issue.\n\nThe company's shares are proposed to be listed on both the Bombay Stock Exchange (BSE) and the National Stock Exchange (NSE).", "source": "LiveMint Markets", "pub_date_str": "06 Nov 2026, 07:31 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Stock market today: Nasdaq futures rebound after brutal sell-off, Dow and S&P 500 wobble as US adds 165K jobs - Yahoo Finance", "full_content": "Stock market today: Nasdaq futures rebound after brutal sell-off, Dow and S&P 500 wobble as US adds 165K jobs Yahoo Finance What sparked the stock market\u2019s $2.5 trillion sell-off? CNN Markets realise they hate America\u2019s blue wave The Economist Fears of an AI crackdown after midterms spark $2 trillion rout in tech stocks NPR Nasdaq attempts to recover from worst rout in 19 months as AI stocks see some buying: Live updates CNBC", "source": "Google News Business", "pub_date_str": "06 Nov 2026, 07:29 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Derivatives"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "SNVA Traveltech IPO: Updated DRHP Filed, Issue To Be Entirely An Offer For Sale", "full_content": "SNVA Traveltech, the parent company of online travel platform Travomint, has filed an updated DRHP for an IPO entirely comprising an offer for sale of 12.75 crore shares by its promoters.", "source": "NDTV Profit", "pub_date_str": "06 Nov 2026, 07:28 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Market sell-off hits hard: Advisors say 'stay the course with an eye on buying'", "full_content": "Top financial advisors aren't urging clients to change their portfolios after Thursday's sharp market sell-off, even as retail investors were heavy sellers of individual stocks .\n\nIn a Thursday flash poll of advisors from CNBC's Financial Advisor 100 and Financial Advisor Council , more than three-quarters of respondents said investors' first steps should be to check their allocation against their goals or stay the course. The online poll, conducted from 2:30 p.m. to 6 p.m. ET on Thursday, was sent to 121 firms and 38 responded.\n\nRetail investors sold individual stocks Thursday as technology stocks tumbled, and the Dow gave back its post-midterm election gains. The S&P 500 suffered its worst one-day drop since April 2025 on Thursday. Analysts linked the sell-off to fears of a data center construction slowdown following major Democratic election wins.\n\nThe Nasdaq Composite tumbled 5.5%, closing more than 10% below its most recent high and putting it in what Wall Street regards as a correction. The broad-market S&P 500 lost 4.4%, while the Dow fell more than 1,800 points, or 3.4%.\n\nYet, financial advisors who answered the CNBC poll overwhelmingly responded that they are not recommending changes to their clients' portfolios. The broader message from interviews with several advisors: review whether your portfolio still matches your goals, but don't let a sudden market move make the decision for you.\n\nFor investors who continue contributing to a 401(k), a market decline can mean buying investments at lower prices over time, said Andy Pratt, director of investment strategy at Burney Wealth Management in Reston, Virginia.\n\n\"If you have a 401(k), money is being allocated there biweekly, monthly, you know, whatever your pay period is, and so you're able to dollar-cost average in,\" Pratt said. \"So when the market does sell off, you're entering at a much better spot.\"\n\nPratt said a well-designed portfolio may not need changes during a downturn.", "source": "CNBC Top News", "pub_date_str": "06 Nov 2026, 07:26 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "A long-term Elon Musk backer is cashing out of Tesla \u2014 and cutting its SpaceX exposure", "full_content": "A key early investor has sold the last of its Tesla shares and sharply reduced its SpaceX holding, taking profits from two of its most successful long-term bets.\n\nScottish Mortgage Investment Trust , a London-listed closed-end fund managed by Baillie Gifford, said Friday that SpaceX represented 11.1% of its total assets as of Wednesday, down from 15% at Sept. 30.\n\nThe position helped drive Scottish Mortgage's 31.5% net asset value return in the six months to the end of September. In its half-year results statement, Scottish Mortgage also said it sold its remaining Tesla stake in April, ending an investment that dated back to 2013.\n\nScottish Mortgage first invested in SpaceX in December 2018, when Elon Musk 's rocket company had a reported valuation of about $31 billion, and committed roughly $200 million through 2021.\n\nScottish Mortgage Investment Trust. The investment surged in value as SpaceX expanded its launch business and Starlink satellite network. By the time of its blockbuster IPO in June, SpaceX represented roughly a quarter of Scottish Mortgage's portfolio by value.\n\nThe investment trust has since sold shares as post-IPO lock-up restrictions have lifted in stages, though it said its conviction in SpaceX remains high.\n\n\"The decision to reduce the position following its flotation, while retaining a substantial investment, demonstrates the importance of balancing conviction with disciplined portfolio management,\" Scottish Mortgage said.\n\nSpaceX was a major contributor to Scottish Mortgage's performance during the period, adding 8 percentage points to returns.", "source": "CNBC Top News", "pub_date_str": "06 Nov 2026, 07:21 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Portfolio Management"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Nasdaq drops into correction territory \u2014 here\u2019s what typically happens next", "full_content": "The Nasdaq Composite plunged into correction territory on Thursday. History shows more selling can follow in the near term, but a recovery eventually takes hold three months later.\n\nThe tech-heavy index slid more than 5% on Thursday, closing more than 11% below its record reached last month. On Wall Street, any decline greater than 10% is a correction. A 20% pullback qualifies as a bear market.\n\nAcross 10 previous correction episodes over the last decade, selloffs in 2025, 2022, 2020 and 2018 were followed by further rough selling over the next one month. But the Nasdaq was back to rally mode again after six months for all those occasions except one: 2022.\n\nOverall, the Nasdaq gained an average of 9.41% from the correction bottom over the following three months and 17.03% over six months.\n\nThe January 2022 correction was the one that offered a harsher outcome. The Nasdaq lost another 18.3% over the next six months and was down 24.3% a year later.\n\nThe catalyst for this correction was Democrats sweeping the House and Senate in Tuesday's midterm elections. The party also made significant gains in Texas, where Gina Hinojosa won the race for governor after campaigning on an immediate moratorium for data center development.\n\nInvestors are now weighing whether tighter state-level restrictions could slow data center construction, putting pressure on companies tied to the artificial intelligence trade.\n\nFrank Cappelleri, founder of CappThesis, pointed to past midterm election cycles for guidance and found that points to more volatility in the near term as well.", "source": "CNBC Finance", "pub_date_str": "06 Nov 2026, 07:17 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Dan Ives says tech rout is 'golden buying opportunity' just like during Covid, tariff sell-off", "full_content": "Technology stocks are sinking after Democrats regained control of Congress earlier this week, creating buying opportunities in the market, per analyst Dan Ives.", "source": "CNBC Top News", "pub_date_str": "06 Nov 2026, 07:16 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "As Market Returns Moderate, Nilesh Shah Has Sectoral Advice For Investors", "full_content": "Kotak AMC's Nilesh Shah favours large- and mid-cap stocks, banking and premium consumption, while urging investors to moderate return expectations and maintain asset allocation.", "source": "NDTV Profit", "pub_date_str": "06 Nov 2026, 07:06 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "My portfolio returns went from hero to zero (actually I\u2019d take zero)", "full_content": "One stock in my Asia fund made me look clever for months. Not so much now", "source": "FT Markets", "pub_date_str": "06 Nov 2026, 07:04 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Moderna Boosts Revenue Guidance on Covid Vaccine Sales", "full_content": "A researcher works in the lab at the Moderna Inc. headquarters in Cambridge, Massachusetts.", "source": "NDTV Profit", "pub_date_str": "06 Nov 2026, 07:03 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Multibagger stock to buy: Motilal Oswal sees 37% upside in Himadri Speciality Chemical; key triggers, target price", "full_content": "A Ksheerasagar Published 6 Nov 2026, 06:56 PM IST Prefer Livemint on Google Domestic brokerage firm Motilal Oswal has maintained its \u2018Buy\u2019 rating on Himadri Speciality Chemical , setting a target price of \u20b9 780 per share. This implies an upside potential of around 37% from the stock\u2019s Friday closing price of \u20b9 568.\n\nThe brokerage's bullish outlook is supported by several growth drivers, including China+1 sourcing opportunities, the One Big Beautiful Bill Act (OBBBA), India's expanding cell manufacturing capacity and rising global adoption of lithium iron phosphate (LFP) batteries.\n\nMotilal Oswal believes Himadri is positioning itself to benefit from the growing demand for battery materials and higher-value specialty carbon products, while its expansion into tyre manufacturing through the acquisition of Birla Tyres offers additional opportunities for business integration and value addition.\n\nHimadri is expanding into the lithium-ion battery materials business through LFP cathode active materials and anode materials. The company aims to scale its LFP cathode capacity from 2,000 metric tonnes per annum (MTPA) in the third quarter of FY27 to 40,000 MTPA by FY28, involving a capital expenditure of around \u20b9 1,125 crore.\n\nIt is also developing anode materials through a 200 MTPA pilot facility, backed by an investment of approximately \u20b9 120 crore. The company is building capabilities through an exclusive technology partnership with Sicona for silicon-carbon anode materials, a 19.44% stake in IBC and a 40% stake in Invati Creations.\n\nAccording to Motilal Oswal, India's cell manufacturing capacity is expected to increase by around 178 GWh over the next five years, taking the country's total capacity to nearly 181 GWh. This could create a battery materials opportunity worth approximately $7 billion.\n\nHimadri is targeting around $3 billion in battery chemicals revenue over the next six years, implying a potential 2% share of the estimated $193 billion global market by FY35.", "source": "LiveMint Markets", "pub_date_str": "06 Nov 2026, 06:56 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "'The whole landscape changed': Gaming CEOs see new opportunities post-midterms", "full_content": "Midterm election results have created new openings for U.S. gambling expansion, while raising the prospect of greater political and legal pressure on prediction markets, according to gaming industry executives.\n\n\"The whole landscape changed,\" said Craig Billings, CEO of Wynn Resorts , during the company's earnings call Thursday.\n\nWynn has been closely watchng developments in the Middle East as it looks to open the United Arab Emirates' first legal casino in 2027. Billings said he suspects the election will have an impact on the \"likely trajectory of the conflict in the region.\"\n\nCloser to home, Billings sees opportunities in Texas. And he's not the only one. On the heels of reporting record third-quarter revenue and raising guidance for its brick-and-mortar business, Penn Entertainment CEO Jay Snowden called out specific opportunities made possible by state leadership changes.\n\nElection Day was \"a very good day overall for the industry, and certainly for Penn,\" Snowden said on Thursday's earnings call.\n\nTexas, in particular, could be a jackpot for the casino industry. In a massive upset, Democrat Vikki Goodwin defeated longtime Lt. Gov. Dan Patrick, who has been persistent in blocking gambling expansion in the Lone Star State.\n\n\"Texas is a fascinating market,\" Billings said, explaining how many consumers travel to Oklahoma to gamble at tribal casions. \"So it's kind of a stealth market that is giant.\"\n\nPenn has been building a position in Texas for years, Snowden said. It operates two of the state's three Class 1 thoroughbred racetracks and has established relationships with local leaders.", "source": "CNBC Top News", "pub_date_str": "06 Nov 2026, 06:50 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Where's the growth? Legacy automakers face a tougher 2027 as costs rise, market tightens", "full_content": "DETROIT \u2014 There's a growing concern that the global automotive industry may be stuck in neutral, if not reverse, heading into 2027.\n\nThe auto industry \u2014 from the companies to their customers \u2014 has been surprisingly resilient this decade, but there are fears that rising costs, weaker vehicle pricing and a more challenging market could threaten profits and growth going forward.\n\nAutomakers also face pressure outside the U.S. from an onslaught of Chinese carmakers, a thinner new-product pipeline after retreating from some all-electric plans, and company- and region-specific challenges.\n\n\"With investor focus increasingly shifting to 2027, the setup appears challenging,\" Barclays analyst Dan Levy said in an investor note last month. \"Rising inflation, continued China pressure, affordability concerns in the U.S., and a flat global production outlook suggest another year of limited earnings growth.\"\n\nSeveral Wall Street analysts have said automakers will need continued pricing strength and additional cost savings to offset inflation, higher investment spending and a potentially weaker economy just to maintain their current levels.\n\n\"It's a little bit more optimistic in the U.S. and then very pessimistic in Europe,\" RBC Capital Markets analyst Tom Narayan told CNBC. \"As a whole, there's some negativity on '27.\"\n\nAutomakers from the U.S. to Europe to Asia have been facing a growing list of headwinds.\n\nFor U.S.-based legacy automakers, Ford Motor said it expects next year's results to be in line with 2026, while General Motors grew more cautious about its ability to continue growing earnings as much as it had previously expected.", "source": "CNBC Top News", "pub_date_str": "06 Nov 2026, 06:49 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Q2 Results Live: Kwality Wall's Narrows Loss, Voltas Net Profit Rises 53%", "full_content": "Siemens, Bosch, 3M India, Hindalco, Voltas and KIOCL are among the 223 companies scheduled to announce their Q2 results today. Track the latest earnings announcements, financial performance, management commentary and stock market reaction live on NDTV Profit.", "sou PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "56% returns in 6 months! TAAL Tech dividend record date ahead- Check eligibility, dividend amount, payment timeline", "full_content": "TAAL Tech declared its first interim dividend for FY27 at \u20b95 per share, or 250%. Shareholders on record November 13, 2026, are eligible, with payment due by December 2.&nbsp;", "source": "LiveMint Markets", "pub_date_str": "06 Nov 2026, 05:05 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Indian IT stocks emerge as 'safe AI trade' amid rising Big Tech spending; Anand Rathi prefers TechM, LTM, Mphasis", "full_content": "Anand Rathi sees Indian IT firms benefiting as rising AI infrastructure costs put pressure on global technology giants. It favors asset-light companies with strong cash generation, naming Tech Mahindra, LTIMindtree, and Mphasis as top picks.&nbsp;", "source": "LiveMint Markets", "pub_date_str": "06 Nov 2026, 05:04 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "British Airways parent profit drops on higher fuel costs", "full_content": "IAG, the owner of British Airways and Iberia, said Friday that its net profit dropped more than 12 percent in the third quarter on soaring fuel costs and flight disruptions caused by the Middle East conflict. The group said its overall flight capacity had been hit \"by cancellations due to the conflict in the Middle East, together with aircraft availability linked to engine issues and disruption related to air traffic control disruption\".", "source": "Economic Times Markets", "pub_     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>

</body>
</html>
