<script>

    const allData = {"general": [{"title": "U.S. sues California in fight over checking citizenship of mail voters", "full_content": "The federal government sued the state of California on Thursday in an escalating battle over how to prevent non-U.S. citizens from voting by mail in federal elections.\n\nThe lawsuit is the latest action by the Department of Justice targeting state administration of elections, which President Donald Trump has often critcized as being subject to fraud and voting by noncitizens.\n\nThe civil complaint, which the DOJ had threatened to file, asks a judge to prevent California officials from tabulating mail-in ballots \"from likely non-citizens in the upcoming federal election until the voter's citizenship status can be determined.\"\n\nThe Department of Justice asks that a judge order the state to set aside mail ballots from voters \"identified by the Federal Government likely to be noncitizens,\" and to verify their citizenship status before their ballot is counted.\n\nCalifornia Gov. Gavin Newsom, in a post on X on Wednesday, said, in anticipation of the suit, \"More dangerous nonsense from a President losing his grip on reality.\"\n\n\"Trump is now demanding that California election officials VIOLATE federal law,\" Newsom wrote. \"Apparently, the rule of law only matters when it's convenient for MAGA's dear leader. California's elections are NOT Donald Trump's to control. We will ensure EVERY California voter can participate in a free and fair election.\n\nThe suit in U.S. District Court in Los Angeles came two days after acting U.S. Deputy Attorney General Trent McCotter, in a letter to California Secretary of State Shirley Weber, gave the state 48 hours to determine whether any U.S. citizens were on a list of people the DOJ believes are likely noncitizens who were sent ballots for the Nov. 3 election.\n\nThe DOJ previously gave officials in Los Angeles County a thumb drive containing the questioned names to officials in Los Angeles County.", "source": "CNBC Top News", "pub_date_str": "15 Oct 2026, 11:17 PM IST", "pub_date_relative": "1m ago"}, {"title": "Anduril CEO defends Trump administration contracts: 'We've done incredibly well under Biden'", "full_content": "Anduril CEO Brian Schimpf addressed ethics questions over co-founder Palmer Luckey 's close ties to the Trump administration as the defense tech giant competes for lucrative government contracts.\n\n\"We've done incredibly well under [President Joe] Biden,\" he told CNBC's \"Squawk on the Street\" on Thursday. \"That was one of the biggest ramps that we've had as a company. I'm a lifelong Dem and have great relationships on both sides of the aisle of this.\"\n\nOn Oct. 6, Anduril announced an up to $2.9 billion shipyard contract a few days after Luckey was named to a Department of Defense group known as Project Meridian. The company also won a multi-year DOD contract worth up to $20 billion in March.\n\nThe appointments of both Luckey and SpaceX CEO Elon Musk to the initiative have raised concerns over whether executives whose companies get billions in government contracts should play an active role in defense strategy.\n\n\"The reality is that the [Department of Defense] has just an incredibly structured process for how they evaluate all these incoming bids,\" Schimpf said. \"So everything goes through these very competitive processes, and we win based on the merits.\"\n\nMusk has contributed more than $276 million to Republican groups since July, CNBC reported this week. Luckey, who helped raise money for President Donald Trump 's 2020 campaign , has donated more than $500,000 to Republican candidates and GOP-aligned groups this year, according to a CNBC analysis of FEC filings.\n\nThis week, Anduril opened a tender offer to employees in 16 countries that would value the company at $90 billion, five months after it topped a $60 billion valuation .\n\nSchimpf said the setup allows Anduril to give liquidity to employees without the distraction of stock price fluctuations. Like Anthropic , OpenAI and Databricks, Anduril has benefitted from an abundance of private market funding opportunities that have allowed businesses to extend the timeline to any public offering.", "source": "CNBC Top News", "pub_date_str": "15 Oct 2026, 11:12 PM IST", "pub_date_relative": "6m ago"}, {"title": "Stocks making the biggest moves midday: CoreWeave, Salesforce, Rocket Lab, Kimberly-Clark & more", "full_content": "Here are some of the companies making headlines in midday trading.", "source": "CNBC Top News", "pub_date_str": "15 Oct 2026, 11:04 PM IST", "pub_date_relative": "14m ago"}, {"title": "Retired before April 2023? ITAT allows LIC employee to claim tax exemption on \u20b99.04 lakh leave encashment", "full_content": "A retired Life Insurance Corporation of India (LIC) employee has won relief from the Income Tax Appellate Tribunal (ITAT), Jaipur, in Renu Moongia vs ITO (assessment year 2021-22), after the tax department restricted the exemption on her \u20b9 9.04 lakh leave encashment to \u20b9 3 lakh.\n\nIn its order pronounced on 28 September 2026, the tribunal directed the assessing officer to allow exemption on the entire amount, relying on earlier tribunal decisions that applied the enhanced \u20b9 25 lakh exemption limit introduced in 2023.\n\nMoongia retired on 30 June 2020 after serving LIC for more than 30 years. She received \u20b9 9,04,669 as leave encashment along with other retirement benefits and claimed exemption on the entire amount under Section 10(10AA) of the Income Tax Act, 1961.\n\nHowever, while processing her income tax return for assessment year 2021-22, the Centralised Processing Centre (CPC) allowed only \u20b9 3 lakh as exempt and treated the remaining \u20b9 6,04,669 as taxable. The first appellate authority upheld the restriction, prompting her to approach the tribunal.\n\nThe dispute arose from a change in the tax treatment of leave encashment. In the Union Budget 2023, the government announced an increase in the exemption limit for non-government salaried employees from \u20b9 3 lakh to \u20b9 25 lakh. The Central Board of Direct Taxes (CBDT) notified the revised ceiling through Notification No. 31/2023 on 24 May 2023, with effect from 1 April 2023.\n\nMoongia, however, had retired in June 2020, before the revised limit was announced. The question was whether she could benefit from the enhanced ceiling despite retiring earlier.\n\nThe Jaipur tribunal relied on earlier decisions by coordinate benches that had allowed the enhanced exemption limit to apply in similar cases. It directed the assessing officer to allow exemption on the full \u20b9 9,04,669 received by Moongia.\n\nThe tribunal also condoned a delay of 1,277 days in filing her appeal.", "source": "LiveMint Money", "pub_date_str": "15 Oct 2026, 11:03 PM IST", "pub_date_relative": "15m ago"}, {"title": "Volvo Cars expands Nvidia partnership for self-driving tech", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Oct 2026, 11:02 PM IST", "pub_date_relative": "17m ago"}, {"title": "Gold price forecast: Why investors expect record highs within 2 years", "full_content": "Gold prices could climb to fresh record highs within the next 24 months, according to investors and industry executives cited by the Financial Times, as central banks increase their bullion purchases and concerns over government debt, geopolitical tensions and the US dollar\u2019s dominance support demand for the precious metal.\n\nThe bullish forecasts come despite a recent decline in gold prices . Bullion fell 2% to $4,075 per troy ounce on Wednesday amid expectations that the US Federal Reserve could raise interest rates again, the news outlet stated.\n\nHowever, fund managers cited by FT expect gold to rebound, supported by investors seeking safe-haven assets amid growing economic and financial market uncertainty.\n\nCentral banks\u2019 reported gold purchases in September reached their highest monthly level since November 2024, with provisional data showing about 63 tonnes of buying so far, according to the World Gold Council. The figures were reportedly compiled using central bank and International Monetary Fund data.\n\nGold surged to a record high of more than $5,500 per troy ounce in January before retreating. Despite the subsequent fall, the metal remains at historically elevated levels.\n\nCharlotte Yonge, a fund manager at Troy Asset Management, told the FT\u2019s Precious Metals Symposium on Wednesday that gold could reach a new record high within 12 to 18 months.\n\nYonge sees bullion as a hedge against deteriorating government finances, particularly rising US debt. She also pointed to the possibility that central banks could expand money supply during a future recession, potentially weakening confidence in currencies.\n\nUnlike fiat currencies, gold cannot be created through monetary expansion, making it attractive to investors seeking to preserve wealth, she said.", "source": "LiveMint Money", "pub_date_str": "15 Oct 2026, 11:02 PM IST", "pub_date_relative": "17m ago"}, {"title": "ASML\u2019s \u2019sold out\u2019 outlook forces investors to look beyond demand", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Oct 2026, 11:00 PM IST", "pub_date_relative": "18m ago"}, {"title": "Jefferies raises DT Midstream stock price target on project outlook", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Oct 2026, 11:00 PM IST", "pub_date_relative": "18m ago"}, {"title": "US producer prices post largest gain in 4-1/2 years; expensive gasoline boosts retail sales", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Oct 2026, 11:00 PM IST", "pub_date_relative": "19m ago"}, {"title": "Sectora Foundation Announces Final Testing of Four Products and $SECT Token Availability on Uniswap", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Oct 2026, 11:00 PM IST", "pub_date_relative": "19m ago"}, {"title": "NUBURU Completes Tekne Acquisition, Adding a $93 Million Defense & Dual-Use Program Portfolio and Advancing Expansion Across NATO and Allied Markets", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Oct 2026, 11:00 PM IST", "pub_date_relative": "19m ago"}, {"title": "Perplexity to open source tool used to contain AI agents", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Oct 2026, 11:00 PM IST", "pub_date_relative": "19m ago"}, {"title": "My sister moved in with our mother, 78, and says she deserves the $925,000 family home. Is she right?", "full_content": "\u201cThe house is worth $925,000 and mom owns it outright. She also has $480,000 in investments.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "15 Oct 2026, 11:00 PM IST", "pub_date_relative": "19m ago"}, {"title": "Apple and Meta team up to make Muse AI model run on Mac computers", "full_content": "Tim Cook and Mark Zuckerberg have clashed for years, but with John Ternus taking the reins at Apple , the rivals are finding common ground in artificial intelligence.\n\nMeta and Apple revealed a new collaboration Thursday that will enable developers to easily run Meta's new open-weight AI model on Apple's high-end desktop computers.\n\nThe collaboration centers on Muse Spark Open, the most capable open-weight model released under a license that allows for limited commercial use, according to Meta. It's an 816-billion-parameter model using a so-called mixture-of-experts architecture . As an open-weight model, developers can download the technology's parameters, or weights, from the internet and run the model on a wide range of hardware.\n\nCustomers will be able to pair between two and four Mac Studio PCs to use Muse Spark to code, analyze video or do other agentic work. The model runs locally, instead of in the cloud, adding a layer of security and saving users money, the companies said.\n\nThursday's announcement, following months of collaboration, is a sign that the AI boom has shifted historical alliances in Silicon Valley. For years, Apple and Meta regarded each other warily and avoided public partnerships, and the relationship hit rock bottom after Apple introduced privacy changes in 2021 that limited the targeting capabilities of digital ad companies. Meta estimated in early 2022 that the change would cut its revenue that year by $10 billion.\n\nRepresentatives from Apple and Meta declined to say if the Muse Spark Open collaboration was the start of a deeper relationship.\n\nMeta AI chief Alexandr Wang said in an interview that many powerful open-weight models are too big to be run on the majority of personal computers, but Apple's Mac Studios make enough memory available to users so that it's practical to run Muse Spark Open.\n\nThe move represents an important show of confidence in Meta's rebooted AI efforts and could pose a challenge to OpenAI and Anthropic.", "source": "CNBC World Economy", "pub_date_str": "15 Oct 2026, 10:59 PM IST", "pub_date_relative": "20m ago"}, {"title": "Anthropic grants employee access to METR for AI safety review", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Oct 2026, 10:52 PM IST", "pub_date_relative": "26m ago"}, {"title": "US stocks: Nasdaq reports network disruption, US equities data feeds impacted", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a US stocks: Nasdaq reports network disruption, US equities data feeds impacted Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US stocks: Nasdaq reports network disruption, US equities data feeds impacted SECTIONS US stocks: Nasdaq reports network disruption, US equities data feeds impacted By Reuters Last Updated: Oct 15, 2026, 10:49:00 PM IST Rate Story Follow us Share Font d to lose into speculative stuff.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "15 Oct 2026, 10:45 PM IST", "pub_date_relative": "34m ago"}, {"title": "S&P 500, Nasdaq pare declines as AI rout teeters; healthcare, staples gain - Reuters", "full_content": "S&P 500, Nasdaq pare declines as AI rout teeters; healthcare, staples gain Reuters Stock market today: Dow, S&P 500 rise, Nasdaq trims losses as Treasury yields sink Yahoo Finance Stock Market Today: Investors Boost Dow, Treasurys as They Rotate Out of Tech \u2014 Live Updates WSJ Stock Market Today: Dow, S&P 500 Rise; Nasdaq Falls; Micron, CoreWeave, Rocket Lab; More Movers Barron's Stocks Fall as AI Rout Spurs Flight to Treasuries: Markets Wrap Bloomberg.com", "source": "Google News Business", "pub_date_str": "15 Oct 2026, 10:39 PM IST", "pub_date_relative": "39m ago"}, {"title": "Morgan Stanley says quantum computing could be a $100 billion market one day. Here\u2019s its top stock to play the trend", "full_content": "The investment bank upgraded Quantinuum to overweight from equal-weight, with a $62 price target that implies roughly 88% upside from Wednesday's close.", "source": "CNBC Top News", "pub_date_str": "15 Oct 2026, 10:39 PM IST", "pub_date_relative": "39m ago"}, {"title": "Did this year\u2019s COLA beat inflation? Here\u2019s how spending by American seniors stacks up so far in 2026.", "full_content": "The cost-of-living adjustment for 2027 will be 3.6%, which will give Social Security recipients an average of $75 more per month.", "source": "MarketWatch Top Stories", "pub_date_str": "15 Oct 2026, 10:37 PM IST", "pub_date_relative": "42m ago"}, {"title": "The COLA wars are coming for Social Security", "full_content": "The annual cost-of-living adjustment may soon be capped, curtailed, means-tested or scrapped altogether under various proposals being actively considered", "source": "MarketWatch Top Stories", "pub_date_str": "15 Oct 2026, 10:37 PM IST", "pub_date_relative": "42m ago"}, {"title": "How to weather the current AI stock storm that we were all dreading", "full_content": "We are at that moment.", "source": "CNBC Top News", "pub_date_str": "15 Oct 2026, 10:36 PM IST", "pub_date_relative": "43m ago"}, {"title": "S&P 500\u2019s road to 8,000 grows tougher as yields rise, AI doubts mount; all eyes on quarterly earnings", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a S&P 500\u2019s road to 8,000 grows tougher as yields rise, AI doubts mount; all eyes on quarterly earnings Powered By The Economic Times daily newspaper is available online now. Read Today's Paper S&P 500\u2019s road to 8,000 grows tougher as yields rise, AI doubts mount; all eyes on quarterly earnings SECTIONS S&P 500\u2019s road to 8,000 grows tougher as yields rise, AI doubts mount; all eyes on quarterly earnings ETMarkets.com Last Updated: Oct 15, 2026, 10:36:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Analysts are doubtful about the S&P 500 crossing the 8,000 points mark despite strong earnings expectations. The rise in oil prices and bond yields has increased market uncertainty ahead of midterm elections. Major technology companies have reported mixed outcomes indicating potential risks for equity investments. Analysts suggest a growing divide in market performance among large and small companies.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "15 Oct 2026, 10:36 PM IST", "pub_date_relative": "43m ago"}, {"title": "Your Social Security check will rise an average of $75 a month \u2014 will it be able to keep up with inflation?", "full_content": "The 3.6% COLA for 2027 is aimed at helping more than 68 million beneficiaries keep pace with the cost of living", "source": "MarketWatch Top Stories", "pub_date_str": "15 Oct 2026, 10:36 PM IST", "pub_date_relative": "43m ago"}, {"title": "The truth about being a landlord in retirement", "full_content": "Investing in rental property isn\u2019t easy or \u2018passive\u2019", "source": "MarketWatch Top Stories", "pub_date_str": "15 Oct 2026, 10:35 PM IST", "pub_date_relative": "44m ago"}, {"title": "What's behind the sell-off in AI neocloud stocks like CoreWeave and Nebius", "full_content": "Neoclouds share the same business model and many of the same customers.", "source": "CNBC Top News", "pub_date_str": "15 Oct 2026, 10:34 PM IST", "pub_date_relative": "45m ago"}, {"title": "Trump says Nidal Hasan execution won't be livestreamed", "full_content": "President Donald Trump said Thursday that the planned execution by firing squad of convicted Fort Hood mass killer Nidal Hasan would not be livestreamed , canceling the Pentagon 's plans to do so.\n\nTrump's announcement came after growing backlash against Defense Secretary Pete Hegseth 's effort to show the former U.S. Army major's execution live online, with concern that the footage would become a recruiting tool for terrorists.\n\nHasan, who is paralyzed from the waist down, is scheduled to be executed Dec. 3 by an Army firing squad at 1 p.m. Central Time in Fort Hood, which is located in Killeen, Texas.\n\nHasan, who during his 2013 court-martial said he was motivated to defend the \"leadership of the Islamic Emirate of Afghanistan, the Taliban,\" could seek to delay the execution with a new legal challenge.\n\n\"Nidal Malik Hasan, a former U.S. Army Major turned traitor, is a very bad and evil man,\" Trump said in a Truth Social post. The president noted that Hasan had killed 13 people \u2014 one of whom was pregnant \u2014 and injured 32 others in the Nov. 5, 2009, shooting spree.\n\n\"With all of that being said, I think streaming the execution for all to see might have been a strong deterrent for the World to witness how America deals with Terrorists and SCUM like Hasan but, many very good and well meaning people would rather not watch him die, through streaming, or through any other visual device,\" Trump wrote.\n\n\"He will die, as scheduled, by firing squad, but this event will not be streamed.\"\n\n\"That said, the execution may be viewed in person by the immediate families of the victims, if they so choose,\" Trump wrote. \"They deserve to witness JUSTICE!\"", "source": "CNBC Top News", "pub_date_str": "15 Oct 2026, 10:30 PM IST", "pub_date_relative": "49m ago"}, {"title": "Sundaram Finance hikes interest rates on fixed deposits; offers up to 8% returns \u2014 check details and effective date", "full_content": "Non-banking financial company Sundaram Finance Limited on Thursday announced an increase in interest rates across various fixed deposit tenures, with the revised rates coming into effect from Friday, October 16, 2026.\n\nThe company has raised interest rates on one-year deposits by 30 basis points and those on two- and three-year deposits by 25 basis points. The hike will apply to both regular depositors and senior citizens.\n\nFor regular depositors, the interest rate on one-year deposits has been raised from 6.70% per annum to 7% per annum, while two- and three-year deposit rates witnessed a hike of 25 basis points each.\n\nSenior citizens will continue to earn higher rates than regular depositors, with the interest rate on three-year deposits now reaching 8% per annum.\n\nSundaram Finance has a deposit base of \u20b9 6,088 crore and holds AAA ratings with a stable outlook from credit rating agencies including ICRA and CRISIL, indicating the highest degree of safety for its deposits.\n\nSundaram Finance's decision to raise interest rates on its fixed deposits comes after the Reserve Bank of India (RBI) on 7 October raised repo rate by 25 bps to 5.50% from 5.25%, marking the first such increase since February 2023.\n\nA repo rate hike increases the cost at which banks borrow money from the central bank and thus can influence lending and deposit rates across the financial system. Banks and NBFCs may respond by revising their rates to manage funding costs, attract deposits and remain competitive in the market.\n\nHowever, the impact of a repo rate change on deposit rates is not always immediate or the same across different companies or banks. The timing and extent of any revision depend on factors such as an institution's liquidity position, funding requirements and competitive strategy.", "source": "LiveMint Money", "pub_date_str": "15 Oct 2026, 10:29 PM IST", "pub_date_relative": "50m ago"}, {"title": "USPS postmarks can lag mailing dates. What taxpayers and voters should know", "full_content": "U.S. Postal Service postmark practices that were formalized in a December 2025 rule could mean a longer delay between when something is mailed and when it's postmarked \u2014 a distinction that matters for tax returns, mail-in ballots and other time-sensitive documents.\n\nThe issue may crop up as two deadlines approach: Oct. 15 for taxpayers who received a six-month extension to file their federal income tax returns, and Nov. 3 for voters casting ballots in the midterm elections .\n\nTaxpayers who mail their return can meet Thursday's deadline by taking it to the post office for a manual postmark. But voters casting ballots by mail for the midterms can't necessarily count on the same rule.\n\nThat's because while the IRS generally considers a return filed on the day it is postmarked, most states require mail-in ballots to arrive by Election Day, regardless of when they were mailed or postmarked. A postmark shows the date your mail was processed, which may not be the day you mailed the ballot.\n\nThirty-five states require mailed absentee ballots to be received by election officials on or before Election Day, according to the National Conference of State Legislatures , a bipartisan organization that tracks state laws and policies. The other 15 states \u2014 along with Washington, Guam, Puerto Rico and the Virgin Islands \u2014 generally allow ballots postmarked by Election Day to arrive afterward, usually within a specified number of days.\n\n\"State laws govern elections for the most part, and every state has chosen a little bit different way of doing things,\" said Katy Owens Hubler, director of elections and redistricting for the NCSL.\n\nNearly 48 million voters cast absentee ballots in the 2024 presidential election, representing roughly 30% of the total 158.2 million ballots cast, according to the U.S. Election Assistance Commission .", "source": "CNBC Top News", "pub_date_str": "15 Oct 2026, 10:26 PM IST", "pub_date_relative": "53m ago"}, {"title": "TSMC chip capacity is \u2018fierce\u2019 battleground for AI customers, amid record quarter", "full_content": "As Taiwan Semiconductor Manufacturing Co.'s record quarter makes clear, demand from chipmakers shows no sign of slowing down. In fact, TSMC can't manufacture quickly enough.\n\nThe artificial intelligence boom has created unending need for space on factory lines at the world's leading chip manufacturer, and it could put a chokehold on the entire industry's ability to scale. Last year, TSMC said it had the capacity to make more than 17 million 12-inch equivalent wafers. But customers want more.\n\n\"The competition is extremely fierce,\" said Jordan Klein, an analyst at Mizuho Securities. \"It's a game of who can get the most leverage and supply.\"\n\nTSMC makes the vast majority of the world's most advanced semiconductors, the graphics processors and central processors from Nvidia , AMD and Broadcom that are necessary for running AI workloads. Now a growing number of tech firms \u2013 Apple , Google , Amazon , Microsoft , Meta and OpenAI \u2013 also rely on TSMC to make custom in-house AI accelerators.\n\nTSMC North American CEO Sajiv Dalal told CNBC he gets at least 10 calls a day about wafer capacity. TSMC posted record profit for a sixth straight quarter on Thursday and expects fourth-quarter revenue to be 58% higher than a year earlier, driven by strong demand for its advanced chipmaking technologies.\n\nIf compute demand continues to grow at the current rate over the next 12 to 18 months, Klein said capacity constraints at TSMC could threaten some of the industry's massive infrastructure investments and the \"aggressive revenue growth targets\" from the AI companies. U.S. hyperscalers are projecting well over $700 billion in capital expenditures this year, and analysts expect that figure to jump in 2027.\n\nAI ambitions are also threatened by a global shortage of memory chips. The logic chips that TSMC manufactures are more complex and expensive to produce.", "source": "CNBC World Economy", "pub_date_str": "15 Oct 2026, 10:26 PM IST", "pub_date_relative": "53m ago"}, {"title": "Nvidia and other chip stocks face renewed pressure as AI fears swell", "full_content": "Reported details about Anthropic\u2019s financial progress are adding to concerns about the health of the AI ecosystem.", "source": "MarketWatch Top Stories", "pub_date_str": "15 Oct 2026, 10:25 PM IST", "pub_date_relative": "54m ago"}, {"title": "Investors are dumping AI stocks as \u2018tech wreck\u2019 worsens. Here\u2019s where they\u2019re turning now.", "full_content": "A continued selloff in the AI trade is forcing investors to move from tech names to the relative safety of government bonds and defensive stock sectors.", "source": "MarketWatch Top Stories", "pub_date_str": "15 Oct 2026, 10:23 PM IST", "pub_date_relative": "56m ago"}, {"title": "CoreWeave credit default swaps hit distress levels as investors sour on AI debt", "full_content": "CoreWeave 's credit stress continued to spiral on Thursday amid a broader sell-off in AI-related names.\n\nCoreWeave \u2014 a so-called neocloud company \u2014 has taken on more than $51 billion of debt and obligations to finance its AI infrastructure buildout. It's now facing a rebellion from stock and bond investors as concerns mount about AI overspending and debt levels.\n\nYields on CoreWeave debt have continued to climb, with the yield to maturity on its 9.75% bond due in 2031 reaching 15.78%. Bond yields move inversely to prices. Meanwhile, the spread on its five-year credit default swaps, which are insurance against default, at one point soared above 1,140 basis points. It last stood at 1,088 bps \u2014 a 33% week-over-week jump and 177% higher than a year ago.\n\nCredit concerns are spreading into AI equities too. CoreWeave's stock was down again Thursday, adding to Wednesday's 15.5% nosedive .\n\nOther neocloud stocks were under similar pressure. Nebius was down 5% and Iren sank 8% in Thursday trading.\n\nAnxiety about AI overspending is also spreading. For instance, shares of Micron Technology and Advanced Micro Devices shed 4% and 6%, respectively, following a big sell-off in South Korean chip stocks.\n\nWhile AI debt worries have been rising steadily, investors have suddenly grown skittish about the underlying finances of companies borrowing heavily to buy chips, build data centers, and rent out computing power.\n\nCoreweave's credit default swaps are one place to see that stress.", "source": "CNBC World Economy", "pub_date_str": "15 Oct 2026, 10:22 PM IST", "pub_date_relative": "57m ago"}, {"title": "Sebi writes to IRDAI to include investors' insurance policy details in consolidated account statement", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Sebi writes to IRDAI to include investors' insurance policy details in consolidated account statement The Economic Times daily newspaper is available online now. Read Today's Paper Sebi writes to IRDAI to include investors' insurance policy details in consolidated account statement SECTIONS Sebi writes to IRDAI to include investors' insurance policy details in consolidated account statement PTI Last Updated: Oct 15, 2026, 10:21:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Sebi Chairman Tuhin Kanta Pandey announced efforts to include insurance information in the Consolidated Account Statement. The initiative aims to provide investors with a comprehensive financial overview of their investments. Additionally, RBI's support for integrating bank deposits into the framework is also underway. A comprehensive review of existing regulations is being conducted to improve transparency and ease compliance for businesses.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "15 Oct 2026, 10:21 PM IST", "pub_date_relative": "57m ago"}, {"title": "International Energy Agency to release more than 20 million barrels of diesel as soon as possible", "full_content": "International Energy Agency members have agreed to release more than 20 million barrels of diesel \"as soon as possible\" as fuel prices surge globally, the group said in a statement Thursday.\n\nPresident Donald Trump said earlier this month that Europe had agreed to deploy a \"massive amount of their heavily stocked Diesel Oil.\" The release detailed by the IEA on Thursday is equivalent to less than one day of global diesel demand or slightly more than five days of U.S. consumption.\n\nThe IEA did not specify a timeline for the release in its Thursday statement. The Group of Seven nations led by France said on Oct. 2 that they would deploy substantial diesel stocks over 20 days. If that is the IEA's timeline, its members would supply about 1 million barrels each day for almost three weeks.\n\nDiesel futures are trading more than 1% lower Thursday at $4.86.\n\nThe IEA, headquartered in Paris, has more than 30 member states, including the U.S. and key European and Asian allies. The agency, created in 1974 in the wake of the Arab oil embargo, is tasked with maintaining energy security by deploying oil stockpiles in response to crises like the wars in the Middle East and Eastern Europe.\n\nThe Trump administration has pushed Europe to release diesel inventories as prices in the U.S. surged to record highs in September. The retail price of diesel stood at an average $6.32 per gallon Thursday, more than 70% above the same period last year, according to AAA.\n\nTrump is facing political pressure to address fuel prices ahead of the U.S. midterm elections on Nov. 3. The president struck a diesel deal with Russia last week that analysts have said will do little to reduce prices.\n\nThe G7 nations, led by France, announced earlier this month that they would deploy stocks through the IEA in response to the diesel crisis but did not give specific quantities.", "source": "CNBC Top News", "pub_date_str": "15 Oct 2026, 10:17 PM IST", "pub_date_relative": "1h ago"}, {"title": "Sebi reintroduces VWAP for derivatives expiry after CAS turns markets volatile", "full_content": "The Securities and Exchange Board of India (Sebi) on Thursday pulled back the two-month-old closing auction framework for settlement of derivatives contracts, after it led to abrupt price swings and uncertainty on expiry days.\n\nIn a late-night circular, the market regulator said that the closing price will be calculated based on a 30-minute volume-weighted average price (VWAP) on derivatives expiry days i.e. Tuesday and Thursday.\n\nSebi reviewed the framework through a consultation paper in September, following pushback from market participants over a liquidity squeeze during the auction. The paper outlined two options for calculating closing prices on derivatives expiry days: adopt a blended VWAP-based methodology or retain the existing VWAP calculation based on the last 30 minutes of continuous trading on settlement days for at least a year.\n\nUnlike a simple average, VWAP takes into account both the price and volume of trades. For instance, if 100 shares are traded at \u20b9 10 each and 50 shares at \u20b9 12 each, the WAP is \u20b9 10.67, compared with a simple average price of \u20b9 11. On the other hand, a CAS uses an auction to match orders and derive the closing price.\n\nMany market participants have urged Sebi to retain VWAP-based settlement pricing on expiry days-Tuesday for Nifty options and Thursday for Sensex options-and introduce blended pricing on non-expiry days for a year before transitioning fully to the blended framework.\n\nCAS, introduced in August, led to abrupt price swings on expiry day, making it difficult for traders to participate in the futures and options (F&O) segment.\n\nInitial operational challenges, including the need for market participants to modify their trading software and the early closure of the continuous trading session (CTS), have kept some participants, including arbitrage funds, away.", "source": "LiveMint Markets", "pub_date_str": "15 Oct 2026, 10:15 PM IST", "pub_date_relative": "1h ago"}, {"title": "Tesla may finally debut a flying car today, after testing fans\u2019 patience for nearly a decade", "full_content": "Elon Musk is set to reintroduce the Roadster sports car, possibly equipped with SpaceX thrusters.", "source": "MarketWatch Top Stories", "pub_date_str": "15 Oct 2026, 10:13 PM IST", "pub_date_relative": "1h ago"}, {"title": "Banks with Jeffrey Epstein ties eyed by Democrats Warren and Garcia", "full_content": "Financial institutions and bank executives that may have aided the late financier Jeffrey Epstein' s sex trafficking operation are in the sights of a bipartisan group of lawmakers .\n\nLegislation introduced Thursday \u2014 and led by Sen. Elizabeth Warren , D-Mass., and Rep. Robert Garcia , D-Calif. \u2014 would require financial regulators to produce records related to Epstein, compel those regulators to investigate banks and executives with ties to the deceased convicted sex offender, and require industry bans and civil penalties for those found to have aided him.\n\n\"I have spent the last year calling on Donald Trump 's financial regulators to launch investigations into the big banks and executives who may have enabled Jeffrey Epstein's horrific crimes,\" Warren, who leads the Senate banking committee's Democrats, said in a statement. \"Since they have failed to act, Congress must. The bipartisan Epstein Wall Street Records Act will ensure overdue accountability for the wealthy and well-connected on Wall Street who put profits over people.\"\n\nThe legislation is co-led in the House by Reps. Ro Khanna , D-Calif., Thomas Massie , R-Ky., and Raja Krishnamoorthi, D-Ill. Sens. Richard Blumenthal , D-Conn., Ron Wyden , D-Ore., and Ben Ray Lujan , D-N.M., signed on to the Senate version. The House version has 17 Democratic co-sponsors.\n\nThe proposal would apply to the Federal Reserve , Federal Deposit Insurance Corporation , Treasury's Office of the Comptroller of the Currency and the Securities and Exchange Commission. A spokesperson for the Federal Reserve declined to comment.", "source": "CNBC Top News", "pub_date_str": "15 Oct 2026, 10:09 PM IST", "pub_date_relative": "1h ago"}, {"title": "IIFL Finance Q2 profit nearly doubles to Rs 805 crore; AUM rises 38%", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a Earnings \u203a IIFL Finance Q2 profit nearly doubles to Rs 805 crore; AUM rises 38% IIFL Finance Share Price Sundaram Finance Share Price Piramal Finance Share Price Poonawalla Fincorp Share Price Capri Global Capital Share Price The Economic Times daily newspaper is available online now. Read Today's Paper IIFL Finance Q2 profit nearly doubles to Rs 805 crore; AUM rises 38% SECTIONS IIFL Finance Q2 profit nearly doubles to Rs 805 crore; AUM rises 38% By Sangita Mehta , ET Bureau Last Updated: Oct 15, 2026, 10:06:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis IIFL Finance reported a significant increase in profit after tax for the quarter, rising to Rs 805 crore. This growth was attributed to stronger operating leverage and reduced loan losses during the period. The company's assets under management also rose substantially to Rs 1.24 lakh crore, primarily due to growth in gold loans.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "15 Oct 2026, 10:06 PM IST", "pub_date_relative": "1h ago"}, {"title": "Treasuries rally as investors seek shelter from AI turbulence", "full_content": "Global chip stocks hit with two-day sell-off amid fears over sustainability of AI boom", "source": "FT Markets", "pub_date_str": "15 Oct 2026, 09:53 PM IST", "pub_date_relative": "1h ago"}, {"title": "L&T Finance Q2 net profit rises 33% to Rs 975 crore", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a Earnings \u203a L&T Finance Q2 net profit rises 33% to Rs 975 crore The Economic Times daily newspaper is available online now. Read Today's Paper L&T Finance Q2 net profit rises 33% to Rs 975 crore SECTIONS L&T Finance Q2 net profit rises 33% to Rs 975 crore By Sangita Mehta , ET Bureau Last Updated: Oct 15, 2026, 11:10:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis L&T Finance reported a 33% increase in consolidated net profit for the quarter ending September 30, 2026. The company's consolidated loan book rose 28% year-on-year to reach Rs 1.36 lakh crore. Net interest margin improved to 10.48%, while total income increased by 26% to Rs 5,484 crore. Asset quality also showed improvement, with gross non-performing loans declining to 2.7%.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "15 Oct 2026, 09:53 PM IST", "pub_date_relative": "1h ago"}, {"title": "SEBI CAS: Framework revised; auction window set, reference price calculation for eligible securities changed - Details", "full_content": "The Securities and Exchange Board of India (SEBI) has revised the framework for the Clearing and Settlement (CAS) mechanism, introducing changes to the auction window and the calculation of reference prices for eligible securities.\n\nIn a late-night circular issued on Thursday, SEBI said that closing prices on derivatives expiry days \u2014 Tuesdays and Thursdays \u2014 will be calculated using the volume-weighted average price (VWAP) of trades executed during the final 30 minutes of the continuous trading session (CTS). The revised rules will come into effect on December 7, 2026.\n\nIn September, the regulator proposed two options for calculating settlement prices for index and single-stock derivatives on expiry days:\n\nIt proposed a blended VWAP based on trades executed during the final 30 minutes of the Continuous Trading Session (CTS) and the 10-minute Closing Auction Session (CAS), or retaining the existing method based solely on the final 30 minutes of CTS trading.\n\nThe Closing Auction Session (CAS) will operate as a separate 10-minute session from 3:30 p.m. to 3:40 p.m. on all trading days. The order-entry window will close at a randomly determined time, with the closure controlled by the system.\n\nOnce order entry ends, stock exchanges will match orders in accordance with the CAS framework. The closing price determined through the auction, along with the quantity of securities traded, will be disseminated to market participants as soon as practicable after order matching is completed.\n\nTrading in index derivatives contracts will continue until 3:45 p.m. on regular trading days. However, on expiry days, trading in expiring index derivatives contracts will end at 3:30 p.m. Stock derivatives contracts, meanwhile, will remain open for trading until 3:45 p.m. on all trading days, including expiry days.\n\nThe closing prices of securities covered by CAS will also be determined through the auction mechanism during special trading sessions conducted by stock exchanges.", "source": "LiveMint Markets", "pub_date_str": "15 Oct 2026, 09:50 PM IST", "pub_date_relative": "1h ago"}, {"title": "CoreWeave investors are feeling spooked, as the company\u2019s stock and bonds see fresh pressure", "full_content": "It\u2019s getting more expensive for investors to buy protection against a CoreWeave default.", "source": "MarketWatch Top Stories", "pub_date_str": "15 Oct 2026, 09:50 PM IST", "pub_date_relative": "1h ago"}, {"title": "Nvidia, AMD, Dell sell-off in global tech rout on AI funding worries", "full_content": "Stocks tied to the artificial intelligence trade sank on Thursday, continuing a global sell-off.\n\nCollectively, 20 of the most valuable global AI and semiconductor stocks have shed more than $1 trillion in value so far this week, as interest rate hikes, AI financing and intensifying competition weighed on sentiment.\n\nNvidia fell about 2% while AMD and Intel each lost about 4%. Dell Technologies sank 8%. Neoclouds also dropped, with CoreWeave sinking 3%, Nebius down 5% and IREN falling more than 8%. Micron was down about 5% earlier but turned positive around noon ET.\n\nShares in the neoclouds pared some of the earlier losses after comments from Nvidia CEO Jensen Huang seemed to settle fears in the AI trade.\n\nHuang told Bloomberg at an event in Stockholm, Sweden, that he didn't see a need for Nvidia to backstop CoreWeave and that, \"Their cost of capital is actually decreasing.\"\n\nA sell-off in global technology hardware stocks also deepened across Asia and Europe on Thursday.\n\nSouth Korean chip giant SK Hynix plunged more than 10%, while rival Samsung Electronics fell 8.73%. Other South Korean chip-related stocks also came under pressure. LG Innotek sank 8.95%, Seoul Semiconductor shed 9.28% and Samsung SDI declined 6.26%.\n\nIn Japan, technology investment giant SoftBank Group tumbled 7.9%. Semiconductor testing equipment maker Advantest plunged almost 14%, while chipmaking equipment supplier Tokyo Electron lost 6.45%. Renesas Electronics declined 8%. Taiwan's TSMC , the world's largest contract chipmaker, fell 1.81%.", "source": "CNBC World Economy", "pub_date_str": "15 Oct 2026, 09:49 PM IST", "pub_date_relative": "1h ago"}, {"title": "Nifty bucks global AI selloff as heavyweights flex muscle", "full_content": "Indian stocks surged on Thursday, bucking a global sell-off in artificial intelligence (AI) and technology shares as domestic buying and a rush by traders to reverse their bets against the market fuelled the rally. However, market experts do not see the uptrend sustaining as of now as foreign funds continue to pull money out of Indian equities.\n\nThe Nifty 50 index closed 1.66% higher at 22,997.35 on Thursday, clocking its biggest rise in percentage terms since 12 June. The Sensex 30 index closed 2.1% up at 74,315.61, similarly recording its highest rise since 12 June.\n\nHeavyweights ICICI Bank, Reliance Industries Ltd, HDFC Bank and Bharti Airtel buoyed the index. Domestic institutional investors (DIIs) net bought shares worth \u20b9 3,319 crore, while FIIs net sold shares worth \u20b9 5,285 crore. However, the foreign institutional investors (FIIs), on a gross basis, still bought shares worth \u20b9 12,735 crore on Thursday.\n\nThe proof of short-covering was visible in the put-call ratio of weekly options contracts on the Nifty, which witnessed a dramatic rise, said analysts.\n\nThe put-call ratio of Nifty options expiring on 19 October jumped to 1.65 on Thursday from 1.01 a day earlier, implying that call sellers were forced to cut their short call positions due to the smacking rally in heavyweights such as RIL , ICICI Bank, Bharti Airtel and HDFC Bank, they said.\n\n\u201cThis means that for every 100 calls sold on Thursday, 165 puts were sold, skewing the market in favour of the bulls,\u201d said Sudhir Joshi, consultant at Khambatta Securities.\n\nThis ratio shows the number of outstanding puts relative to the outstanding calls. When the ratio rises, it's a bullish sign as investors and traders sell more puts than calls, hoping to pocket the premium paid by the put buyers who are bearish.\n\nWhile heavyweight stocks rose, the Nifty Smallcap 250 index fell 1.01% and Nifty Midcap 150 fell 0.8% on Thursday.", "source": "LiveMint Markets", "pub_date_str": "15 Oct 2026, 09:47 PM IST", "pub_date_relative": "1h ago"}, {"title": "Online ads weaponised to deliver \u2018zero-click\u2019 spyware, researchers say - The Guardian", "full_content": "Online ads weaponised to deliver \u2018zero-click\u2019 spyware, researchers say The Guardian Exposing AdFection: How Discover-Tech Turned Targeted Ads Into a Pipeline for Zero-Click Mercenary Spyware The Citizen Lab Israeli company used online ads to run vast spy operation, researchers say The Times of Israel Israeli ad-tech firm helped place spyware on Al Jazeera devices Al Jazeera \u2018Nightmare Scenario\u2019: Zero-Click Spyware Is Infecting Phones via Targeted Ads WIRED", "source": "Google News Business", "pub_date_str": "15 Oct 2026, 09:47 PM IST", "pub_date_relative": "1h ago"}, {"title": "SEBI Revises CAS Timings; Revises Order Types, Timings And Settlement From Dec 7", "full_content": "Under the revised framework, the reference price for the closing auction will be based on the VWAP of trades executed during the final 15 minutes of continuous trading in the cash market.", "source": "NDTV Profit", "pub_date_str": "15 Oct 2026, 09:46 PM IST", "pub_date_relative": "1h ago"}, {"title": "Wholesale prices jumped 6.3% annually in September, biggest gain since 2022", "full_content": "September's producer price index came in much hotter than economists forecast on Thursday, underscoring the continued inflationary pressure from energy amid the U.S. war with Iran.\n\nThe measure of underlying inflation pressures climbed 1.3% in September and 6.3% on an annual basis, according to the Bureau of Labor Statistics. That marked the largest monthly and annual gains since March 2022 and December 2022, respectively.\n\nBoth readings topped expectations of economists polled by Dow Jones, who forecast an advance of 0.6% on the month and 5.5% annually.\n\nEnergy drove a sizable chunk of those increases as the Middle East conflict curtailed oil supply and sent prices surging. The so-called core PPI, which excludes volatile food and energy prices from the wholesaler inflation index, added 0.7% on the month and 5% over the 12-month period.\n\nBut there are signs that soaring energy prices are having downstream effects on other categories. The BLS said in Thursday's release that almost half of September's increase in processed goods for immediate demand was connected to the rise in diesel fuel prices.\n\nIt's the latest report in recent days showing that inflation continues to hit consumers and companies.\n\nWednesday's consumer price index release showed a rise of 0.6% from August to September and 3.7% on a 12-month basis. Economists polled by Dow Jones had forecast growth of 0.6% and 3.6%, respectively.\n\nExcluding food and energy, the core CPI added 0.3% on the month and 2.6% compared with a year ago. Economists anticipated increases of 0.2% and 2.5%, respectively.", "source": "CNBC Top News", "pub_date_str": "15 Oct 2026, 09:45 PM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "U.S. sues California in fight over checking citizenship of mail voters", "full_content": "The federal government sued the state of California on Thursday in an escalating battle over how to prevent non-U.S. citizens from voting by mail in federal elections.\n\nThe lawsuit is the latest action by the Department of Justice targeting state administration of elections, which President Donald Trump has often critcized as being subject to fraud and voting by noncitizens.\n\nThe civil complaint, which the DOJ had threatened to file, asks a judge to prevent California officials from tabulating mail-in ballots \"from likely non-citizens in the upcoming federal election until the voter's citizenship status can be determined.\"\n\nThe Department of Justice asks that a judge order the state to set aside mail ballots from voters \"identified by the Federal Government likely to be noncitizens,\" and to verify their citizenship status before their ballot is counted.\n\nCalifornia Gov. Gavin Newsom, in a post on X on Wednesday, said, in anticipation of the suit, \"More dangerous nonsense from a President losing his grip on reality.\"\n\n\"Trump is now demanding that California election officials VIOLATE federal law,\" Newsom wrote. \"Apparently, the rule of law only matters when it's convenient for MAGA's dear leader. California's elections are NOT Donald Trump's to control. We will ensure EVERY California voter can participate in a free and fair election.\n\nThe suit in U.S. District Court in Los Angeles came two days after acting U.S. Deputy Attorney General Trent McCotter, in a letter to California Secretary of State Shirley Weber, gave the state 48 hours to determine whether any U.S. citizens were on a list of people the DOJ believes are likely noncitizens who were sent ballots for the Nov. 3 election.\n\nThe DOJ previously gave officials in Los Angeles County a thumb drive containing the questioned names to officials in Los Angeles County.", "source": "CNBC Top News", "pub_date_str": "15 Oct 2026, 11:17 PM IST", "pub_date_relative": "1m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Anduril CEO defends Trump administration contracts: 'We've done incredibly well under Biden'", "full_content": "Anduril CEO Brian Schimpf addressed ethics questions over co-founder Palmer Luckey 's close ties to the Trump administration as the defense tech giant competes for lucrative government contracts.\n\n\"We've done incredibly well under [President Joe] Biden,\" he told CNBC's \"Squawk on the Street\" on Thursday. \"That was one of the biggest ramps that we've had as a company. I'm a lifelong Dem and have great relationships on both sides of the aisle of this.\"\n\nOn Oct. 6, Anduril announced an up to $2.9 billion shipyard contract a few days after Luckey was named to a Department of Defense group known as Project Meridian. The company also won a multi-year DOD contract worth up to $20 billion in March.\n\nThe appointments of both Luckey and SpaceX CEO Elon Musk to the initiative have raised concerns over whether executives whose companies get billions in government contracts should play an active role in defense strategy.\n\n\"The reality is that the [Department of Defense] has just an incredibly structured process for how they evaluate all these incoming bids,\" Schimpf said. \"So everything goes through these very competitive processes, and we win based on the merits.\"\n\nMusk has contributed more than $276 million to Republican groups since July, CNBC reported this week. Luckey, who helped raise money for President Donald Trump 's 2020 campaign , has donated more than $500,000 to Republican candidates and GOP-aligned groups this year, according to a CNBC analysis of FEC filings.\n\nThis week, Anduril opened a tender offer to employees in 16 countries that would value the company at $90 billion, five months after it topped a $60 billion valuation .\n\nSchimpf said the setup allows Anduril to give liquidity to employees without the distraction of stock price fluctuations. Like Anthropic , OpenAI and Databricks, Anduril has benefitted from an abundance of private market funding opportunities that have allowed businesses to extend the timeline to any public offering.", "source": "CNBC Top News", "pub_date_str": "15 Oct 2026, 11:12 PM IST", "pub_date_relative": "6m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Gold price forecast: Why investors expect record highs within 2 years", "full_content": "Gold prices could climb to fresh record highs within the next 24 months, according to investors and industry executives cited by the Financial Times, as central banks increase their bullion purchases and concerns over government debt, geopolitical tensions and the US dollar\u2019s dominance support demand for the precious metal.\n\nThe bullish forecasts come despite a recent decline in gold prices . Bullion fell 2% to $4,075 per troy ounce on Wednesday amid expectations that the US Federal Reserve could raise interest rates again, the news outlet stated.\n\nHowever, fund managers cited by FT expect gold to rebound, supported by investors seeking safe-haven assets amid growing economic and financial market uncertainty.\n\nCentral banks\u2019 reported gold purchases in September reached their highest monthly level since November 2024, with provisional data showing about 63 tonnes of buying so far, according to the World Gold Council. The figures were reportedly compiled using central bank and International Monetary Fund data.\n\nGold surged to a record high of more than $5,500 per troy ounce in January before retreating. Despite the subsequent fall, the metal remains at historically elevated levels.\n\nCharlotte Yonge, a fund manager at Troy Asset Management, told the FT\u2019s Precious Metals Symposium on Wednesday that gold could reach a new record high within 12 to 18 months.\n\nYonge sees bullion as a hedge against deteriorating government finances, particularly rising US debt. She also pointed to the possibility that central banks could expand money supply during a future recession, potentially weakening confidence in currencies.\n\nUnlike fiat currencies, gold cannot be created through monetary expansion, making it attractive to investors seeking to preserve wealth, she said.", "source": "LiveMint Money", "pub_date_str": "15 Oct 2026, 11:02 PM IST", "pub_date_relative": "17m ago", "cfa_topics": ["Economics", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "NUBURU Completes Tekne Acquisition, Adding a $93 Million Defense & Dual-Use Program Portfolio and Advancing Expansion Across NATO and Allied Markets", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Oct 2026, 11:00 PM IST", "pub_date_relative": "19m ago", "cfa_topics": ["Corporate Issuers", "Portfolio Management"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Apple and Meta team up to make Muse AI model run on Mac computers", "full_content": "Tim Cook and Mark Zuckerberg have clashed for years, but with John Ternus taking the reins at Apple , the rivals are finding common ground in artificial intelligence.\n\nMeta and Apple revealed a new collaboration Thursday that will enable developers to easily run Meta's new open-weight AI model on Apple's high-end desktop computers.\n\nThe collaboration centers on Muse Spark Open, the most capable open-weight model released under a license that allows for limited commercial use, according to Meta. It's an 816-billion-parameter model using a so-called mixture-of-experts architecture . As an open-weight model, developers can download the technology's parameters, or weights, from the internet and run the model on a wide range of hardware.\n\nCustomers will be able to pair between two and four Mac Studio PCs to use Muse Spark to code, analyze video or do other agentic work. The model runs locally, instead of in the cloud, adding a layer of security and saving users money, the companies said.\n\nThursday's announcement, following months of collaboration, is a sign that the AI boom has shifted historical alliances in Silicon Valley. For years, Apple and Meta regarded each other warily and avoided public partnerships, and the relationship hit rock bottom after Apple introduced privacy changes in 2021 that limited the targeting capabilities of digital ad companies. Meta estimated in early 2022 that the change would cut its revenue that year by $10 billion.\n\nRepresentatives from Apple and Meta declined to say if the Muse Spark Open collaboration was the start of a deeper relationship.\n\nMeta AI chief Alexandr Wang said in an interview that many powerful open-weight models are too big to be run on the majority of personal computers, but Apple's Mac Studios make enough memory available to users so that it's practical to run Muse Spark Open.\n\nThe move represents an important show of confidence in Meta's rebooted AI efforts and could pose a challenge to OpenAI and Anthropic.", "source": "CNBC World Economy", "pub_date_str": "15 Oct 2026, 10:59 PM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "US stocks: Nasdaq reports network disruption, US equities data feeds impacted", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a US stocks: Nasdaq reports network disruption, US equities data feeds impacted Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US stocks: Nasdaq reports network disruption, US equities data feeds impacted SECTIONS US stocks: Nasdaq reports network disruption, US equities data feeds impacted By Reuters Last Updated: Oct 15, 2026, 10:49:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Nasdaq is currently experiencing a network disruption at its Carteret facility, affecting US equities markets. A technical issue has caused data gaps within several multicast groups. Clients are urged to transition to backup feeds from Chicago to avoid impacts. Those facing data gaps should file recovery requests for missing information. Nasdaq is actively investigating the problem and has issued an apology for the inconvenience caused.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "15 Oct 2026, 10:49 PM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "S&P 500, Nasdaq pare declines as AI rout teeters; healthcare, staples gain - Reuters", "full_content": "S&P 500, Nasdaq pare declines as AI rout teeters; healthcare, staples gain Reuters Stock market today: Dow, S&P 500 rise, Nasdaq trims losses as Treasury yields sink Yahoo Finance Stock Market Today: Investors Boost Dow, Treasurys as They Rotate Out of Tech \u2014 Live Updates WSJ Stock Market Today: Dow, S&P 500 Rise; Nasdaq Falls; Micron, CoreWeave, Rocket Lab; More Movers Barron's Stocks Fall as AI Rout Spurs Flight to Treasuries: Markets Wrap Bloomberg.com", "source": "Google News Business", "pub_date_str": "15 Oct 2026, 10:39 PM IST", "pub_date_relative": "39m ago", "cfa_topics": ["Equity Investments", "Fixed Income"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Did this year\u2019s COLA beat inflation? Here\u2019s how spending by American seniors stacks up so far in 2026.", "full_content": "The cost-of-living adjustment for 2027 will be 3.6%, which will give Social Security recipients an average of $75 more per month.", "source": "MarketWatch Top Stories", "pub_date_str": "15 Oct 2026, 10:37 PM IST", "pub_date_relative": "42m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "S&P 500\u2019s road to 8,000 grows tougher as yields rise, AI doubts mount; all eyes on quarterly earnings", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a S&P 500\u2019s road to 8,000 grows tougher as yields rise, AI doubts mount; all eyes on quarterly earnings Powered By The Economic Times daily newspaper is available online now. Read Today's Paper S&P 500\u2019s road to 8,000 grows tougher as yields rise, AI doubts mount; all eyes on quarterly earnings SECTIONS S&P 500\u2019s road to 8,000 grows tougher as yields rise, AI doubts mount; all eyes on quarterly earnings ETMarkets.com Last Updated: Oct 15, 2026, 10:36:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Analysts are doubtful about the S&P 500 crossing the 8,000 points mark despite strong earnings expectations. The rise in oil prices and bond yields has increased market uncertainty ahead of midterm elections. Major technology companies have reported mixed outcomes indicating potential risks for equity investments. Analysts suggest a growing divide in market performance among large and small companies.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "15 Oct 2026, 10:36 PM IST", "pub_date_relative": "43m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Fixed Income"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Your Social Security check will rise an average of $75 a month \u2014 will it be able to keep up with inflation?", "full_content": "The 3.6% COLA for 2027 is aimed at helping more than 68 million beneficiaries keep pace with the cost of living", "source": "MarketWatch Top Stories", "pub_date_str": "15 Oct 2026, 10:36 PM IST", "pub_date_relative": "43m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Sundaram Finance hikes interest rates on fixed deposits; offers up to 8% returns \u2014 check details and effective date", "full_content": "Non-banking financial company Sundaram Finance Limited on Thursday announced an increase in interest rates across various fixed deposit tenures, with the revised rates coming into effect from Friday, October 16, 2026.\n\nThe company has raised interest rates on one-year deposits by 30 basis points and those on two- and three-year deposits by 25 basis points. The hike will apply to both regular depositors and senior citizens.\n\nFor regular depositors, the interest rate on one-year deposits has been raised from 6.70% per annum to 7% per annum, while two- and three-year deposit rates witnessed a hike of 25 basis points each.\n\nSenior citizens will continue to earn higher rates than regular depositors, with the interest rate on three-year deposits now reaching 8% per annum.\n\nSundaram Finance has a deposit base of \u20b9 6,088 crore and holds AAA ratings with a stable outlook from credit rating agencies including ICRA and CRISIL, indicating the highest degree of safety for its deposits.\n\nSundaram Finance's decision to raise interest rates on its fixed deposits comes after the Reserve Bank of India (RBI) on 7 October raised repo rate by 25 bps to 5.50% from 5.25%, marking the first such increase since February 2023.\n\nA repo rate hike increases the cost at which banks borrow money from the central bank and thus can influence lending and deposit rates across the financial system. Banks and NBFCs may respond by revising their rates to manage funding costs, attract deposits and remain competitive in the market.\n\nHowever, the impact of a repo rate change on deposit rates is not always immediate or the same across different companies or banks. The timing and extent of any revision depend on factors such as an institution's liquidity position, funding requirements and competitive strategy.", "source": "LiveMint Money", "pub_date_str": "15 Oct 2026, 10:29 PM IST", "pub_date_relative": "50m ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "TSMC chip capacity is \u2018fierce\u2019 battleground for AI customers, amid record quarter", "full_content": "As Taiwan Semiconductor Manufacturing Co.'s record quarter makes clear, demand from chipmakers shows no sign of slowing down. In fact, TSMC can't manufacture quickly enough.\n\nThe artificial intelligence boom has created unending need for space on factory lines at the world's leading chip manufacturer, and it could put a chokehold on the entire industry's ability to scale. Last year, TSMC said it had the capacity to make more than 17 million 12-inch equivalent wafers. But customers want more.\n\n\"The competition is extremely fierce,\" said Jordan Klein, an analyst at Mizuho Securities. \"It's a game of who can get the most leverage and supply.\"\n\nTSMC makes the vast majority of the world's most advanced semiconductors, the graphics processors and central processors from Nvidia , AMD and Broadcom that are necessary for running AI workloads. Now a growing number of tech firms \u2013 Apple , Google , Amazon , Microsoft , Meta and OpenAI \u2013 also rely on TSMC to make custom in-house AI accelerators.\n\nTSMC North American CEO Sajiv Dalal told CNBC he gets at least 10 calls a day about wafer capacity. TSMC posted record profit for a sixth straight quarter on Thursday and expects fourth-quarter revenue to be 58% higher than a year earlier, driven by strong demand for its advanced chipmaking technologies.\n\nIf compute demand continues to grow at the current rate over the next 12 to 18 months, Klein said capacity constraints at TSMC could threaten some of the industry's massive infrastructure investments and the \"aggressive revenue growth targets\" from the AI companies. U.S. hyperscalers are projecting well over $700 billion in capital expenditures this year, and analysts expect that figure to jump in 2027.\n\nAI ambitions are also threatened by a global shortage of memory chips. The logic chips that TSMC manufactures are more complex and expensive to produce.", "source": "CNBC World Economy", "pub_date_str": "15 Oct 2026, 10:26 PM IST", "pub_date_relative": "53m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "CoreWeave credit default swaps hit distress levels as investors sour on AI debt", "full_content": "CoreWeave 's credit stress continued to spiral on Thursday amid a broader sell-off in AI-related names.\n\nCoreWeave \u2014 a so-called neocloud company \u2014 has taken on more than $51 billion of debt and obligations to finance its AI infrastructure buildout. It's now facing a rebellion from stock and bond investors as concerns mount about AI overspending and debt levels.\n\nYields on CoreWeave debt have continued to climb, with the yield to maturity on its 9.75% bond due in 2031 reaching 15.78%. Bond yields move inversely to prices. Meanwhile, the spread on its five-year credit default swaps, which are insurance against default, at one point soared above 1,140 basis points. It last stood at 1,088 bps \u2014 a 33% week-over-week jump and 177% higher than a year ago.\n\nCredit concerns are spreading into AI equities too. CoreWeave's stock was down again Thursday, adding to Wednesday's 15.5% nosedive .\n\nOther neocloud stocks were under similar pressure. Nebius was down 5% and Iren sank 8% in Thursday trading.\n\nAnxiety about AI overspending is also spreading. For instance, shares of Micron Technology and Advanced Micro Devices shed 4% and 6%, respectively, following a big sell-off in South Korean chip stocks.\n\nWhile AI debt worries have been rising steadily, investors have suddenly grown skittish about the underlying finances of companies borrowing heavily to buy chips, build data centers, and rent out computing power.\n\nCoreweave's credit default swaps are one place to see that stress.", "source": "CNBC World Economy", "pub_date_str": "15 Oct 2026, 10:22 PM IST", "pub_date_relative": "57m ago", "cfa_topics": ["Fixed Income", "Alternative Investments"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Sebi writes to IRDAI to include investors' insurance policy details in consolidated account statement", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Sebi writes to IRDAI to include investors' insurance policy details in consolidated account statement The Economic Times daily newspaper is available online now. Read Today's Paper Sebi writes to IRDAI to include investors' insurance policy details in consolidated account statement SECTIONS Sebi writes to IRDAI to include investors' insurance policy details in consolidated account statement PTI Last Updated: Oct 15, 2026, 10:21:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Sebi Chairman Tuhin Kanta Pandey announced efforts to include insurance information in the Consolidated Account Statement. The initiative aims to provide investors with a comprehensive financial overview of their investments. Additionally, RBI's support for integrating bank deposits into the framework is also underway. A comprehensive review of existing regulations is being conducted to improve transparency and ease compliance for businesses.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "15 Oct 2026, 10:21 PM IST", "pub_date_relative": "57m ago", "cfa_topics": ["Equity Investments", "Ethical & Professional Standards"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "International Energy Agency to release more than 20 million barrels of diesel as soon as possible", "full_content": "International Energy Agency members have agreed to release more than 20 million barrels of diesel \"as soon as possible\" as fuel prices surge globally, the group said in a statement Thursday.\n\nPresident Donald Trump said earlier this month that Europe had agreed to deploy a \"massive amount of their heavily stocked Diesel Oil.\" The release detailed by the IEA on Thursday is equivalent to less than one day of global diesel demand or slightly more than five days of U.S. consumption.\n\nThe IEA did not specify a timeline for the release in its Thursday statement. The Group of Seven nations led by France said on Oct. 2 tha
