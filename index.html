ng financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Joint ownership over: Former property holder still uses address on Aadhaar and bank\u2014should you worry? Experts explain", "full_content": "Suppose two brothers jointly own a residential property, with each holding a 50% share. Later, one brother buys the other brother\u2019s 50% share, becoming the sole owner of the property. The former co-owner then moves out of the residence.\n\nHowever, he continues to use the property\u2019s address on his Aadhaar card and maintains bank accounts with the same address. Does this create any legal risk for the sole owner? Can the former co-owner\u2019s Aadhaar or bank records affect the ownership of the property? Here\u2019s what experts have to say.\n\n\u201cOnce a co-owner has validly transferred his share in an immovable property through a duly executed and registered instrument, the fact that he continues to use the property\u2019s address on Aadhaar, bank accounts or other records does not, by itself, establish any continuing ownership interest in the property,\u201d Ketan Mukhija, Partner and Co-Head of PE/VC at Kochhar & Co., said.\n\nAadhaar is an identity document, and its address field is not a title document. Similarly, a bank\u2019s KYC address records a customer's contact or address particulars; it does not establish ownership of the premises. Therefore, retaining the old address does not automatically make the Aadhaar or bank records invalid or void after the sale, Amitraj Kaushal, Advocate at the Supreme Court of India, explained.\n\nAn address appearing in an identity or financial record does not, by itself, trigger a change. However, he said the former co-owner should update his address where required under applicable KYC and, practically, provide his new address to banks and other institutions.\n\n\u201cThe critical distinction is between the former owner's debt and the ownership of the property.", "source": "LiveMint Money", "pub_date_str": "01 Oct 2026, 11:26 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Why are world bond markets selling off again?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Why are world bond markets selling off again? Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Why are world bond markets selling off again? SECTIONS Why are world bond markets selling off again? Reuters Last Updated: Oct 01, 2026, 11:24:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis As inflation fears and mounting debt pressure rise, government borrowing costs have soared to unprecedented levels. The US Treasury yield, now the highest since 2002, signifies a shift in global market dynamics. These increasing bond yields adversely affect loans for families and businesses, posing challenges for governmental finances. Intervention by central banks could be on the horizon to maintain fiscal order, especially with future artificial intelligence-related bond issues looming.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "01 Oct 2026, 11:24 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "EU countries in crisis talks over release of diesel stocks", "full_content": "Trump administration has pressured European countries to release strategic reserves, warning that it could ban US diesel exports if they do not do so", "source": "FT Markets", "pub_date_str": "01 Oct 2026, 11:20 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "What is Pension Adalat to be held in Gurugram on October 12 and 13? Check timings, documents and more", "full_content": "A Pension Adalat will be organised in Gurugram on October 12 and 13 to address pension-related grievances of retired Haryana government employees and serving employees who are General Provident Fund (GPF) subscribers, according to an official.\n\nThe two-day event is being organised by the Office of the Principal Accountant General (Accounts and Entitlement), Haryana, Chandigarh. Gurugram Treasurer Nancy Yadav has urged eligible pensioners and employees to attend the Pension Adalat to seek resolution of their pension-related concerns.\n\nA Pension Adalat is a grievance-redressal forum where pensioners can raise issues related to their pension payments and seek assistance from the concerned authorities. Such forums provide pensioners an opportunity to present their complaints and have them examined for resolution.\n\nThe Pension Adalat will be held from 10:30 am to 1 pm on both days.\n\nThe event will take place at Ramanujan Hall, Science Block, First Floor, SCERT, Sohna Road, Gurugram.\n\nPensioners have been advised to bring documents related to their pension grievances, including:\n\nThe authorities have urged pensioners and eligible employees to carry the necessary documents so their concerns can be examined during the Pension Adalat.\n\nMeanwhile, the Office of the Controller of Communication Accounts (CCA), Maharashtra & Goa, conducted a Quarterly Pension Adalat in Nashik on September 18, the Ministry of Communications said in a statement.", "source": "LiveMint Money", "pub_date_str": "01 Oct 2026, 11:13 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Another Fed Leader Suggests Next Rate Increase Can Wait - WSJ", "full_content": "Another Fed Leader Suggests Next Rate Increase Can Wait WSJ Top Fed official signals central bank will keep rates on hold in October Financial Times Jefferson Says Fed May Need More Time to Weigh Next Move Bloomberg.com COMMENTARY: Morning Bid: October doubts Reuters FED GOV JEFFERSON/CHARLOTTESVILLE: 'EXPECT INFLATION TO BE ELEVATED IN THE SHORT RUN BEFORE RESUMING ITS DECLINE TOWARD OUR 2% GOAL' TradingView", "source": "Google News Business", "pub_date_str": "01 Oct 2026, 11:07 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Large-cap mutual fund or Nifty 50 index? Expert weighs in on where to invest \u2014 and if SIP is better", "full_content": "Large-cap mutual funds and Nifty 50 index funds are two ways investors can get exposure to large-cap stocks in their portfolio.\n\nNifty 50 index funds replicate the 50 stocks in the index and follow a passive strategy, while active large-cap funds must invest at least 80% of their assets in large-cap stocks and generally pick stocks from the top 100 companies by market capitalisation.\n\nLarge-cap funds can hold a varying number of stocks, with some holding more than 50 stocks and others fewer, depending on the fund manager\u2019s strategy.\n\nBut should investors choose both or keep only one, given that both offer large-cap exposure? Here\u2019s what an expert has to say.\n\nHarsh Vardhan Dawar, ACA, CFA, FRM, Founder - Wealth Cafe, said investors should tag all investments in their portfolio as either passive or active, and also by market-cap category \u2014 large, mid or small cap.\n\nHe suggested that a typical 30-year-old growth investor may have:\n\nDawar said a new investor can consider both these funds and allocate funds in line with his portfolio allocation. However, a risk-averse investor can prefer Nifty 50 index funds, while a riskier investor can prefer actively managed large-cap funds.\n\nFor both Nifty 50 index funds and large-cap funds, SIP would be the preferred route, Dawar said.", "source": "LiveMint Money", "pub_date_str": "01 Oct 2026, 11:05 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "As Mortgage Rates Hit Highest Level Since 2023, Buyers Look at ARMs - The New York Times", "full_content": "As Mortgage Rates Hit Highest Level Since 2023, Buyers Look at ARMs The New York Times How 7% Mortgages Are Wrecking the Home-Buyer Playbook WSJ US mortgage rates jump the most in four years as bond sell-off hits Main Street Financial Times Mortgage rates approach their highest level in 3 years: Mortgage and refinance interest rates today, Thursday, October 1, 2026 Yahoo Finance Mortgage rates just hit 7.28%. But there are ways to get a lower rate | CNN Business cnn.com", "source": "Google News Business", "pub_date_str": "01 Oct 2026, 11:01 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Anthropic Said to Target Mega-IPO Before Thanksgiving Holiday - Bloomberg.com", "full_content": "Anthropic Said to Target Mega-IPO Before Thanksgiving Holiday Bloomberg.com Anthropic reportedly looking to IPO as early as mid-November Yahoo Finance NEWSLETTER: Inside Anthropic\u2019s confidential S-1: a Q&A Reuters Google And Amazon Are The Reason For Anthropic\u2019s Eye-Watering $42 Billion Loss Forbes Anthropic plans to go public before Thanksgiving: report Seeking Alpha", "source": "Google News Business", "pub_date_str": "01 Oct 2026, 10:57 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "FPIs pull out \u20b936,000 cr from Indian equities in Sept as high oil, bond yields weigh \u2014 should retail investors worry?", "full_content": "It appears that overseas investors are losing confidence in Asia's third-largest economy, as reflected in their resumption of selling in domestic stocks, with investors seemingly finding better opportunities elsewhere.\n\nForeign portfolio investors turned net sellers again in September, selling \u20b9 35,860 crore worth of stocks, according to NSDL data. The latest selling came after FPIs invested \u20b9 20,200 crore in July and \u20b9 29,631 crore in August.\n\nWith the September outflows, total FPI withdrawals from Indian equities in 2026 have reached \u20b9 2.69 lakh crore, surpassing the \u20b9 1.66 lakh crore outflow recorded during the whole of 2025.\n\nThe record outflows have clearly been visible in the Nifty 50's performance, with the index logging double-digit losses in 2026, falling over 14% so far and remaining on track for its first annual decline in 15 years.\n\nThe gauge has remained lower for the last eight straight weeks, with the last similar losing streak occurring 25 years ago, reflecting the deepening pressure on the broader market. If not for the support from the domestic mutual funds, the fall would have been even more severe.\n\nBarring stocks, the heavy selling has added more pressure to the Indian rupee, which has registered multiple record lows and turned into one of Asia's worst-performing currencies. The local currency has also been affected by elevated crude oil prices, global bond yields, and strong dollar demand.\n\nIn addition to equity, FPIs also turned into net sellers in the debt (general limit) at \u20b9 5,247 crore, in debt (VRR or Voluntary Retention Route) at \u20b9 5,049 crore, in debt (FAR or Fully Accessible Route) at \u20b9 10,431 crore, and in hybrid at \u20b9 2,078 crore.\n\nBesides, frontrunners in the AI trade, Taiwan and South Korea, are also seeing outflows after attracting money in August, as per media reports. The reversal in the East Asian markets follows an improvement in foreign demand earlier in the quarter.", "source": "LiveMint Markets", "pub_date_str": "01 Oct 2026, 10:45 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Fixed Income", "Alternative Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Eurozone borrowing costs surge in global bond rout", "full_content": "European debt hit with bout of selling after US 10-year borrowing costs strike highest level since 2002", "source": "FT Markets", "pub_date_str": "01 Oct 2026, 10:44 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Global markets rattled as bond yields surge, offsetting AI-stock optimism", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Caree derstand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Trump Accounts have auto-enrolled more than 60 million children, Treasury says", "full_content": "More than 60 million children have been automatically enrolled in Trump Accounts, according to a Treasury Department announcement exclusively provided to CNBC.", "source": "CNBC Top News", "pub_date_str": "01 Oct 2026, 10:22 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Amazon, Flipkart Audit Security Camera Listings in India Over Govt Compliance: Report", "full_content": "E-commerce platforms review third-party camera listings after a report flagged hundreds of devices lacked mandatory approvals.", "source": "NDTV Profit", "pub_date_str": "01 Oct 2026, 10:19 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Exclusive | David Ellison Asks CNN CEO to Stay After Paramount-Warner Deal Closes - WSJ", "full_content": "Exclusive | David Ellison Asks CNN CEO to Stay After Paramount-Warner Deal Closes WSJ Paramount, CNN Chief Mark Thompson in \u2018Early Stages\u2019 of Discussions to Keep Him in Post Variety MAGA-Curious CBS Boss Suffers Humiliating Final Blow in Media Shake-Up The Daily Beast Bari Weiss\u2019 role at CNN revealed after David Ellison makes Mark Thompson decision New York Post CNN\u2019s Mark Thompson to Keep Job After Paramount Merger Bloomberg.com", "source": "Google News Business", "pub_date_str": "01 Oct 2026, 10:03 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Corteva Stock Is     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
