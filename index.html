<script>

    const allData = {"general": [{"title": "A tough job market is pushing more young Americans to make a big bet: on themselves", "full_content": "There has been a rise in entrepreneurship among young Americans as the entry-level labor market has become tougher to join.", "source": "MarketWatch Top Stories", "pub_date_str": "03 Oct 2026, 10:54 PM IST", "pub_date_relative": "3m ago"}, {"title": "Dino Morea Questioned By Mumbai EOW In Mithi River Case Over Alleged Rs 65.54 Crore Loss", "full_content": "Morea was previously questioned after investigators found phone records linking him to people connected with the probe into alleged irregularities in Mithi River work.", "source": "NDTV Profit", "pub_date_str": "03 Oct 2026, 10:36 PM IST", "pub_date_relative": "21m ago"}, {"title": "Are you planning your retirement correctly? Tax free, govt security\u2014research explains key reasons why Indians prefer NPS", "full_content": "HDFC Pension Fund Management's \u2018NPS Preference Index Study 2026\u2019 found that preference for the National Pension Scheme (NPS) among Indians has risen to 57, up three points from the inaugural 2023 reading of 54.\n\nThe research highlighted key behavioural insights amongst Indians towards retirement planning and their preference towards the NPS as an instrument for retirement planning, an official release said. The readings are made on a scale of 0 to 100 by the research team.\n\nAs per the study, India\u2019s NPS Preference Index rose to 57 this year, with the gain led by \u201cConsideration\u201d, which climbed six points to 59, ahead of \u201cFamiliarity,\u201d (58, up three points) and \u201cAppeal\u201d (56, up two points). This indicated that Indian savers are moving from passive awareness of NPS to active evaluation of the product, it added.\n\nSriram Iyer, MD and CEO of the pension fund said, \u201cIndia\u2019s retirement story is building steadily\u201d, adding that it will empower Indians and help them build a strong corpus for their retirement needs. \u201cSeeing a rise in preference index is an indication that we are moving in the right direction, however, there is more ground to cover\u2026 While we see improvement in Consideration for NPS, it is essential to convert this into enrolment,\u201d he added.\n\nAs per the research report, the recent enhancements to NPS emerged as key reasons for enrolment in the scheme at 39%, ahead of tax savings (38%) and better returns (36%).\n\nDisclaimer: This story is for educational purposes only. The views and recommendations made above are those of individual analysts or broking companies, and not of Mint.", "source": "LiveMint Money", "pub_date_str": "03 Oct 2026, 10:32 PM IST", "pub_date_relative": "24m ago"}, {"title": "Russia-Ukraine War: Ukraine Calls India's Peace Proposal 'Most Comprehensive' Among Four Plans", "full_content": "Ukraine is weighing four peace proposals from India, Turkiye, Egypt and the US, with Kyiv calling New Delhi's plan the most comprehensive.", "source": "NDTV Profit", "pub_date_str": "03 Oct 2026, 10:32 PM IST", "pub_date_relative": "25m ago"}, {"title": "Harsh Goenka Praises Odisha's Babeijoda Village, Says 'Why Not Every Village And City?'", "full_content": "Babeijoda village in Odisha has remained litter-free and plastic-free for 15 years, with Harsh Goenka highlighting its community-led cleanliness efforts.", "source": "NDTV Profit", "pub_date_str": "03 Oct 2026, 10:29 PM IST", "pub_date_relative": "28m ago"}, {"title": "India At Asian Games 2026 Day 16: Full Schedule, Match Timings For Sunday Events", "full_content": "Double gold medallist Neeru Dhanda will carry India's flag at the Asian Games 2026 closing ceremony in Nagoya.", "source": "NDTV Profit", "pub_date_str": "03 Oct 2026, 10:23 PM IST", "pub_date_relative": "34m ago"}, {"title": "Bessent says rising Treasury yields reflect global trend, not cause for alarm", "full_content": "", "source": "Investing.com News", "pub_date_str": "03 Oct 2026, 10:19 PM IST", "pub_date_relative": "38m ago"}, {"title": "Carlo Ancelotti's Brazil Cruise Past India 4-0 In International Friendly At Salt Lake Stadium", "full_content": "Carlo Ancelotti's new-look side, which is in a rebuilt mode post their pre-quarterfinal exit in the World Cup 2026, largely played within themselves without injecting much pace in their historic friendly.", "source": "NDTV Profit", "pub_date_str": "03 Oct 2026, 10:19 PM IST", "pub_date_relative": "38m ago"}, {"title": "Switching jobs to get higher pay works best in these industries", "full_content": "Finding a new job is one way to get a pay increase at a time when inflation has been outpacing wage growth.", "source": "MarketWatch Top Stories", "pub_date_str": "03 Oct 2026, 10:12 PM IST", "pub_date_relative": "45m ago"}, {"title": "\u2018Less exciting long-term savings crucial for financial security in old age\u2019: CEA encourages pension investment", "full_content": "Chief Economic Adviser V Anantha Nageswaran believes more Indians must shift investment behaviour from short-term trading to long-term savings, noting that pension assets are crucial for financial security in old age, PTI reported.\n\nIt added that of the \u20b9 18 lakh crore corpus under the National Pension System ( NPS ) as of September, around 47% is invested in government securities (G-Secs), 28% in equity, and 21% in corporate debt.\n\n\u201cThe Indian saver has shown a willingness to accept market risk or so we would like to believe. What the saver has not yet done at scale is to commit savings for a longer tenure. That is a different decision because in general Indians do not optimise for the long term,\u201d ANI quoted Nageswaran saying. It added that he noted that behaviour shift would require trust in institutions, accessible financial information and products that do not require savers to become financial experts.\n\nNageswarana noted that Economic Survey data showed the share of equity and mutual funds in annual household savings rose from about 2% in FY12 to around 15% in FY25, while the share of bank deposits fell from over 58% to about 35%.\n\nMonthly systematic investment plan (SIP) flows also rose from under \u20b9 4,000 crore in FY17 to over \u20b9 28,000 crore in the first eight months of FY26. However, the share of pension and insurance assets in household savings remained unchanged between FY19 and FY24.\n\nNageswaran said India's total pension assets were about 17% of GDP, against at least 80% in OECD peer countries, indicating significant scope for expansion.\n\nLong-term investing provides durable and sustainable financial security and peace of mind post-retirement, he said.", "source": "LiveMint Money", "pub_date_str": "03 Oct 2026, 10:06 PM IST", "pub_date_relative": "50m ago"}, {"title": "High interest rates are foreclosing on the American dream of home remodeling", "full_content": "With mortgage rates continuing to stay untenably high for most Americans, many are staying put. But that doesn't mean homes don't need improving and upkeep. And some homeowners figure that if they can't move into a new home, they'll make their old home \"newer\" \u2014 a new deck or perhaps a walk-in closet.\n\nTraditionally, a home equity loan or home equity line of credit would be the first tool to reach for. But even those are getting too expensive for homeowners. This leaves homeowners effectively trapped in aging homes with no easy way out, or way to improve them.\n\nAnd even when homeowners are tapping into home equity loans \u2014 homeowners did originate nearly 20% more second mortgages or HELOCs in the second quarter of this year compared with the first quarter \u2014 they likely aren't using the equity for improvements. Experts say they are using them to stay afloat.\n\nUntapped or expensive, Americans are sitting on a record amount of home equity .\n\n\"As rates keep rising, tapping into home equity will become more and more expensive for homeowners. This will generally hold back consumer spending, but it will hit big-ticket items, like home renovations, particularly hard,\" said Tom Graff, chief investment officer of Facet, a financial planning and wealth management firm.\n\nThis struggle is something built into the rate hikes, according to Graff.\n\n\"The Fed is hiking interest rates in an attempt to control inflation. One of the ways that is supposed to work is by pushing down consumer spending. So the fact that consumers will struggle to finance large purchases is by design,\" he said.\n\nBut the Fed policy also comes with risks for a consumer-driven economy.", "source": "CNBC Top News", "pub_date_str": "03 Oct 2026, 10:03 PM IST", "pub_date_relative": "54m ago"}, {"title": "Turkey extends lower margin trading requirement to Oct. 30", "full_content": "", "source": "Investing.com News", "pub_date_str": "03 Oct 2026, 10:02 PM IST", "pub_date_relative": "54m ago"}, {"title": "My wife never went back to work after raising our kids. Do I have to share my retirement savings 50/50?", "full_content": "\u201cFor 14 years I have gotten up every morning and gone to work while she has been free to pursue whatever interested her.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "03 Oct 2026, 10:00 PM IST", "pub_date_relative": "57m ago"}, {"title": "US-Iran Conflict: Bessent Says Tehran To Have No Oil At Sea, No Revenues This Week", "full_content": "US Treasury Secretary Scott Bessent says Iran will have no oil at sea or related revenues this week as Washington steps up its economic pressure on Tehran.", "source": "NDTV Profit", "pub_date_str": "03 Oct 2026, 09:48 PM IST", "pub_date_relative": "1h ago"}, {"title": "SEBI Receives 20,000 Comments On Consultation Paper Regarding Closing Auction Session", "full_content": "The number of responses reached 20,000 by the end of the consultation period, significantly higher than the over 3,500 comments that Sebi Chairman Tuhin Kanta Pandey had earlier said the regulator had received.", "source": "NDTV Profit", "pub_date_str": "03 Oct 2026, 09:47 PM IST", "pub_date_relative": "1h ago"}, {"title": "Adani Airports To Begin Redevelopment Of Mumbai Airport's Terminal 1B North Section", "full_content": "AAHL assured to support airlines through this transition and will provide all necessary assistance to ensure a smooth and seamless migration of services.", "source": "NDTV Profit", "pub_date_str": "03 Oct 2026, 09:43 PM IST", "pub_date_relative": "1h ago"}, {"title": "Piyush Goyal Pushes India Investment Pitch In Meetings With US Companies", "full_content": "Goyal's US meetings with Target, Mondelez, Aon, Cognition, ADM and Nike covered India's manufacturing ecosystem, consumer market, AI capabilities and investment opportunities.", "source": "NDTV Profit", "pub_date_str": "03 Oct 2026, 09:42 PM IST", "pub_date_relative": "1h ago"}, {"title": "\u2018I have $400,000 in equity\u2019: I\u2019m 80. Should I sell my house because of dangerous stairs \u2014 or spend thousands renovating?", "full_content": "\u201cGenerally, the advice I\u2019ve read says not to sell because I have a low-interest-rate mortgage.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "03 Oct 2026, 09:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "A $28B hemp THC industry is fighting to save itself from a looming federal ban - AP News", "full_content": "A $28B hemp THC industry is fighting to save itself from a looming federal ban AP News See more headlines & perspectives on Google News", "source": "Google News Business", "pub_date_str": "03 Oct 2026, 09:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "EPS: What to do if employer fails to make pension contribution", "full_content": "Employees who begin their first job with a basic wage of up to \u20b9 25,000 can qualify for pension benefits under the Employees\u2019 Pension Scheme (EPS), 2026, subject to the scheme\u2019s eligibility conditions. If an eligible employee finds that the employer is not making the required EPS contribution, the Employees\u2019 Provident Fund Organisation (EPFO) has advised them to first take up the matter with the employer.\n\nThe EPFO, in a post on X, formerly Twitter, said employees whose issue is not resolved by the employer can subsequently lodge a grievance through the EPFiGMS portal.\n\nEmployees starting their first job with wages within the revised EPF wage ceiling of \u20b9 25,000 can become members of the EPS, subject to applicable rules.\n\nOnce an employee qualifies for EPS membership, the employer is required to make the prescribed contribution towards the employee\u2019s EPS account in accordance with the scheme.\n\nThe revised wage ceiling is expected to bring more employees within the scope of mandatory EPF and EPS coverage.\n\nEmployees who are eligible for EPS but find that the required contribution is missing should initially approach their employer or the human resources and payroll department.\n\nThey should ask the employer to verify their EPF and EPS contribution records and confirm whether their membership and contributions have been correctly reflected.\n\nIf the employer fails to resolve the issue, the employee can approach the EPFO by registering a grievance through the EPFiGMS portal.", "source": "LiveMint Money", "pub_date_str": "03 Oct 2026, 09:27 PM IST", "pub_date_relative": "1h ago"}, {"title": "SC Order On Unpaid Traffic Challans: Impact On RC, PUC, Licence \u2014 What We Know", "full_content": "The Supreme Court's directions cover RC renewal, duplicate RCs, address updates and fitness certificates, while unpaid e-challans can also affect PUC and vehicle transfers.", "source": "NDTV Profit", "pub_date_str": "03 Oct 2026, 09:26 PM IST", "pub_date_relative": "1h ago"}, {"title": "OpenAI Safety Employee Quits, Calls for Nuclear-Level Safeguards - Bloomberg.com", "full_content": "OpenAI Safety Employee Quits, Calls for Nuclear-Level Safeguards Bloomberg.com I Quit OpenAI Because Its Culture Is Broken The Atlantic OpenAI safety leader Davi recast stays at 7%, uncertainty range remains wide: NITI Aayog\u2019s Arvind Virmani SECTIONS India GDP forecast stays at 7%, uncertainty range remains wide: NITI Aayog\u2019s Arvind Virmani ET Online Last Updated: Oct 03, 2026, 09:04:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis NITI Aayog Member Arvind Virmani has retained his India GDP growth forecast at 7% for the year, with an uncertainty range of plus or minus 1%, citing unresolved trade issues and global developments. He also backed a gradual shift towards cost-based UPI MDR after the subsidy helped establish the payments platform.\n\nA for apple, Y for yak and, for the first time, a price next to it. Will this change the non-agri part of the rural economy?\n\nSix months after oil spiked, why are markets reacting so sharply now?\n\nGold paradox: Why India, a refining giant, is not a big bullion exporter\n\nA refinery is not a laptop: Why America's diesel problem can't be switched off\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers\n\nLogin using your ET Prime credentials to enjoy all member benefits", "source": "Economic Times Economy", "pub_date_str": "03 Oct 2026, 09:04 PM IST", "pub_date_relative": "1h ago"}, {"title": "The corporate insurance trap: Relying solely on your company\u2019s health cover is a bad idea; here\u2019s why", "full_content": "Your office health insurance may feel like enough protection. A \u20b9 10 lakh cover sounds reassuring when your employer pays the premium. But depending entirely on this benefit can leave you exposed.\n\nCorporate policies can offer useful benefits, including cashless hospital treatment and family coverage. Some also cover existing illnesses without waiting periods. These benefits make employer insurance valuable, but they do not guarantee lifelong protection.\n\nThe biggest weakness is its connection with your job. Losing your job, taking a long break or retiring can end your health insurance cover. Moving to another company without insurance benefits creates the same problem. Medical needs, however, do not stop when employment ends.\n\nBuying personal insurance later can become harder and more expensive. Older applicants may face higher premiums, medical checks and waiting periods for existing illnesses. It mentions waiting periods ranging from two to four years. This can leave families struggling when they need treatment most.\n\nEven \u20b9 10 lakh may fall short during a major hospital stay. Some bypass surgeries and specialised cancer treatments can cost \u20b9 8 lakh to \u20b9 15 lakh.\n\nRoom charges, doctors' fees, intensive care and consumables can increase the bill. A large coverage amount does not automatically mean every expense gets paid.\n\nPolicy conditions can also raise your share of the costs. Some corporate plans limit the daily room charge in the health coverage . Choosing a costlier room may trigger deductions beyond the difference in room price. This can leave you paying more of the hospital bill out of pocket.\n\nSome plans also include a clause requiring you to share claim costs. Such contributions range from 10% to 20%. Understanding these conditions matters as much as checking the total cover amount.", "source": "LiveMint Money", "pub_date_str": "03 Oct 2026, 09:03 PM IST", "pub_date_relative": "1h ago"}, {"title": "\u2018I\u2019m never selling\u2019: I\u2019m 47 and buy bitcoin with every dollar I earn. Am I crazy?", "full_content": "\u201cWhen my paycheck lands, it takes a detour through bitcoin.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "03 Oct 2026, 09:00 PM IST", "pub_date_relative": "1h ago"}, {"title": "Week That Was: HDFC Bank's New CEO, Smit Machchhar's Heroics, Yield Spike, US-Iran Conflict & More", "full_content": "Here are key developments from the last week of September that kept the week buzzing for the global and domestic market.", "source": "NDTV Profit", "pub_date_str": "03 Oct 2026, 08:59 PM IST", "pub_date_relative": "1h ago"}, {"title": "Exclusive-Key ShinyHunters hacker detained in Jordan, is cooperating, sources say", "full_content": "", "source": "Investing.com News", "pub_date_str": "03 Oct 2026, 08:48 PM IST", "pub_date_relative": "2h ago"}, {"title": "Man City Whistleblower Rui Pinto To Lose Witness Protection, Says He Has Received 'Multiple Death Threats'", "full_content": "The Football Leaks founder says he has moved to an undisclosed location after Portugal decided to end his protection despite his claims of multiple death threats.", "source": "NDTV Profit", "pub_date_str": "03 Oct 2026, 08:41 PM IST", "pub_date_relative": "2h ago"}, {"title": "UPI MDR Charges: Start date, slabs and why is this Merchant Discount Rate being introduced now? All questions answered", "full_content": "The Centre will impose Merchant discount rate (MDR) charge on select online transactions conducted under the unified payments interface (UPI) system in India from this month, as per the National Payments Council of India (NPCI).\n\nThe NPCI in an announcement has month said that MDR would apply on person-to-merchant (P2M) UPI payments, above a certain threshold, under a revised UPI MDR framework. The rules come into effect from mid-October and keeping UPI free for all customer (person-to-person / P2P) transactions.\n\nMDR charge will apply on each P2M UPI transaction above \u20b9 2,000, with effect from 15 October 2026, according to the NPCI statement.\n\nThe rules keep 95% of low-value UPI transactions below \u20b9 2,000 and small merchant transactions (P2PM) completely free and proposes a new fund to support the expansion of UPI acceptance among small merchants.\n\nThe NPCI statement said that there will be no impact on small-value UPI transactions up to \u20b9 2,000 for all merchants , which account for more than 95% of all UPI P2M transactions.\n\nRevised UPI MDR remains lower than charges associated with several other digital payment instruments, including credit cards, debit cards, and wallets, the FAQ document added.\n\nAccording to the Ministry of Finance's press release, small merchants, including street vendors receiving up to \u20b9 1 lakh per month through UPI QR codes under the Person-to-Person-Merchant (P2PM) category, will continue to enjoy zero MDR on all transactions. \u201cThis provision will protect street vendors, neighbourhood shops and other small businesses from additional payment costs,\u201d it added.\n\nIt added that overall, \u201cUPI transactions accounting for 70% of (total) transaction value will remain completely outside the MDR framework \u201d.", "source": "LiveMint Money", "pub_date_str": "03 Oct 2026, 08:39 PM IST", "pub_date_relative": "2h ago"}, {"title": "How Nvidia, Micron and a surprising jobs report drove last week's stock action", "full_content": "Here's a closer look at the three developments that drove the action in our portfolio last week.", "source": "CNBC World Economy", "pub_date_str": "03 Oct 2026, 08:36 PM IST", "pub_date_relative": "2h ago"}, {"title": "The Treasury Department started Trump accounts for 60 million kids \u2014 but families still have to take this step if they want one", "full_content": "Here\u2019s what parents seeking the $1,000 seed money for their child need to know.", "source": "MarketWatch Top Stories", "pub_date_str": "03 Oct 2026, 08:36 PM IST", "pub_date_relative": "2h ago"}, {"title": "U.S. to lend $4.2 billion to Vistra to boost nuclear power output, source says", "full_content": "The U.S. will lend Vistra about $4.2 billion to boost its nuclear power generation, a person familiar with the \u2060matter said on Saturday.\n\nU.S. Energy Secretary Chris Wright will announce the loan on Monday at Vistra's nuclear plant along Lake Erie in Ohio, the person said, speaking on condition of anonymity.\n\nThe loan would be used to boost \u2060power \u200coutput, or \"uprate\" at least three of Vistra's \u2060four nuclear stations, which can be done without requiring new licenses from the Nuclear Regulatory Commission.\n\nThe Department of Energy and Vistra did not immediately respond to \u200crequests for comment.\n\nAccording to the U.S. Nuclear Regulatory Commission, utilities can uprate nuclear plants by refueling with \u200bslightly more enriched uranium, a higher percentage of new fuel, or major plant modifications such as replacing main turbines. Utilities since the 1970s have \u2060used uprates to generate more power from reactors, the NRC's website says. \u200cAs of 2022 the agency had approved \u200cmore than 170 uprates, according to the NRC.\n\nVistra has six reactors at four U.S. plants that generate more than 6.5 gigawatts of electricity, \u2060enough to power about 3.25 million homes.\n\nU.S. power demand is growing for the first time in decades, driven by surging demand from the expansion of AI data centers, electrification of transportation, and cryptocurrency mining.\n\nPresident Donald \u200bTrump set a goal to \u200cquadruple U.S. nuclear power capacity by 2050. The Department of Energy has hundreds of billions of dollars in financing available from its loan office and Energy Secretary Wright has said the bulk of that loan \u200bcapacity will support nuclear power plants.", "source": "CNBC Top News", "pub_date_str": "03 Oct 2026, 08:30 PM IST", "pub_date_relative": "2h ago"}, {"title": "Commerce Minister Piyush Goyal meets US corporate leaders to push India investment opportunities", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a Commerce Minister Piyush Goyal meets US corporate leaders to push India investment opportunities The Economic Times daily newspaper is available online now. Read Today's Paper Commerce Minister Piyush Go al-day surge across hockey, cricket, wrestling, golf and archery.", "source": "NDTV Profit", "pub_date_str": "03 Oct 2026, 08:14 PM IST", "pub_date_relative": "2h ago"}, {"title": "Bitchat Removed From India App Store: Apple Cites MeitY Demand Under Section 69A", "full_content": "Apple has removed Jack Dorsey-backed offline messaging app Bitchat from India's App Store after MeitY issued a takedown demand under Section 69A of the IT Act.", "source": "NDTV Profit", "pub_date_str": "03 Oct 2026, 08:10 PM IST", "pub_date_relative": "2h ago"}, {"title": "Cars have become unaffordable for many Americans. Here\u2019s what the numbers show.", "full_content": "At today\u2019s prices and rates, even the average used vehicle can exceed some commonly used affordability measures.", "source": "MarketWatch Top Stories", "pub_date_str": "03 Oct 2026, 08:06 PM IST", "pub_date_relative": "2h ago"}, {"title": "Mankind Pharma To Give Rs 1 Crore To Flydubai Captain Smit Machchhar, Family For Averting Flight Disaster", "full_content": "Mankind Pharma said Capt. Smit Machchhar's courage and leadership during the Flydubai crisis made the country proud, prompting its Rs 1 crore contribution to him and his family.", "source": "NDTV Profit", "pub_date_str": "03 Oct 2026, 08:05 PM IST", "pub_date_relative": "2h ago"}, {"title": "Parliamentary panel may recommend stricter monitoring of crypto transactions in India", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a Parliamentary panel may recommend stricter monitoring of crypto transactions in India The Economic Times daily newspaper is available online now. Read Today's Paper Parliamentary panel may recommend stricter monitoring of crypto transactions in India SECTIONS Parliamentary panel may recommend stricter monitoring of crypto transactions in India ET Online Last Updated: Oct 03, 2026 his 14-year-old daughter had thousands of dollars sitting in her digital wallet .\n\n\"She does all this entrepreneurial stuff . She has a lemonade stand where she's making \u2014 like on a Saturday she'll make four or five hundred dollars,\" he says. That hasn't stopped her from acting like a kid, he says: \"she goes to Starbucks and asks me for 10 bucks.\"\n\nPedersen, retail leader at professional services firm PricewaterhouseCoopers, says this kind of money maneuvering isn't uncommon for kids his daughter's age and younger. In fact, 86% of kids ages 7 to 14 \u2014 which PwC refers to as Gen Alpha \u2014 have their own money, according to a PwC survey published in March. Nearly all of them, 97%, say they make independent spending decisions at least sometimes. PwC surveyed 1,004 kids ages 7 to 14 with a margin of error of plus or minus 3.7 percentage points and 1,009 parents of children in that age range with a margin of error of plus or minus 4.1 percentage points between January 29 and February 13, 2026 .\n\n\"Gen Alpha, they're entrepreneurial. They have their own money. Sometimes their parents don't even know they have money,\" Pedersen says.\n\n\"They're all into resale ,\" Ali Furman, consumer markets leader at PwC adds. \"They're doing online auctions, they're buying and selling and participating in those markets, and they're making money. And even if they're not, they're getting money for allowance and chores and odd jobs, and they really care about making money.\" Resale website Depop has a minimum age requirement of 13 for sellers on its platform and those sellers under 18 may need a parent's permission and assistance with payments.\n\nAnd while those young folks may know how to spend money, many of their parents would also like to see their kids thinking about the future and starting to build savings or investment portfolios. Families have a variety of tools to support that goal.", "source": "CNBC Top News", "pub_date_str": "03 Oct 2026, 07:30 PM IST", "pub_date_relative": "3h ago"}], "cfa": [{"title": "Dino Morea Questioned By Mumbai EOW In Mithi River Case Over Alleged Rs 65.54 Crore Loss", "full_content": "Morea was previously questioned after investigators found phone records linking him to people connected with the probe into alleged irregularities in Mithi River work.", "source": "NDTV Profit", "pub_date_str": "03 Oct 2026, 10:36 PM IST", "pub_date_relative": "21m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Are you planning your retirement correctly? Tax free, govt security\u2014research explains key reasons why Indians prefer NPS", "full_content": "HDFC Pension Fund Management's \u2018NPS Preference Index Study 2026\u2019 found that preference for the National Pension Scheme (NPS) among Indians has risen to 57, up three points from the inaugural 2023 reading of 54.\n\nThe research highlighted key behavioural insights amongst Indians towards retirement planning and their preference towards the NPS as an instrument for retirement planning, an official release said. The readings are made on a scale of 0 to 100 by the research team.\n\nAs per the study, India\u2019s NPS Preference Index rose to 57 this year, with the gain led by \u201cConsideration\u201d, which climbed six points to 59, ahead of \u201cFamiliarity,\u201d (58, up three points) and \u201cAppeal\u201d (56, up two points). This indicated that Indian savers are moving from passive awareness of NPS to active evaluation of the product, it added.\n\nSriram Iyer, MD and CEO of the pension fund said, \u201cIndia\u2019s retirement story is building steadily\u201d, adding that it will empower Indians and help them build a strong corpus for their retirement needs. \u201cSeeing a rise in preference index is an indication that we are moving in the right direction, however, there is more ground to cover\u2026 While we see improvement in Consideration for NPS, it is essential to convert this into enrolment,\u201d he added.\n\nAs per the research report, the recent enhancements to NPS emerged as key reasons for enrolment in the scheme at 39%, ahead of tax savings (38%) and better returns (36%).\n\nDisclaimer: This story is for educational purposes only. The views and recommendations made above are those of individual analysts or broking companies, and not of Mint.", "source": "LiveMint Money", "pub_date_str": "03 Oct 2026, 10:32 PM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "India At Asian Games 2026 Day 16: Full Schedule, Match Timings For Sunday Events", "full_content": "Double gold medallist Neeru Dhanda will carry India's flag at the Asian Games 2026 closing ceremony in Nagoya.", "source": "NDTV Profit", "pub_date_str": "03 Oct 2026, 10:23 PM IST", "pub_date_relative": "34m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Bessent says rising Treasury yields reflect global trend, not cause for alarm", "full_content": "", "source": "Investing.com News", "pub_date_str": "03 Oct 2026, 10:19 PM IST", "pub_date_relative": "38m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Switching jobs to get higher pay works best in these industries", "full_content": "Finding a new job is one way to get a pay increase at a time when inflation has been outpacing wage growth.", "source": "MarketWatch Top Stories", "pub_date_str": "03 Oct 2026, 10:12 PM IST", "pub_date_relative": "45m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "\u2018Less exciting long-term savings crucial for financial security in old age\u2019: CEA encourages pension investment", "full_content": "Chief Economic Adviser V Anantha Nageswaran believes more Indians must shift investment behaviour from short-term trading to long-term savings, noting that pension assets are crucial for financial security in old age, PTI reported.\n\nIt added that of the \u20b9 18 lakh crore corpus under the National Pension System ( NPS ) as of September, around 47% is invested in government securities (G-Secs), 28% in equity, and 21% in corporate debt.\n\n\u201cThe Indian saver has shown a willingness to accept market risk or so we would like to believe. What the saver has not yet done at scale is to commit savings for a longer tenure. That is a different decision because in general Indians do not optimise for the long term,\u201d ANI quoted Nageswaran saying. It added that he noted that behaviour shift would require trust in institutions, accessible financial information and products that do not require savers to become financial experts.\n\nNageswarana noted that Economic Survey data showed the share of equity and mutual funds in annual household savings rose from about 2% in FY12 to around 15% in FY25, while the share of bank deposits fell from over 58% to about 35%.\n\nMonthly systematic investment plan (SIP) flows also rose from under \u20b9 4,000 crore in FY17 to over \u20b9 28,000 crore in the first eight months of FY26. However, the share of pension and insurance assets in household savings remained unchanged between FY19 and FY24.\n\nNageswaran said India's total pension assets were about 17% of GDP, against at least 80% in OECD peer countries, indicating significant scope for expansion.\n\nLong-term investing provides durable and sustainable financial security and peace of mind post-retirement, he said.", "source": "LiveMint Money", "pub_date_str": "03 Oct 2026, 10:06 PM IST", "pub_date_relative": "50m ago", "cfa_topics": ["Economics", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "High interest rates are foreclosing on the American dream of home remodeling", "full_content": "With mortgage rates continuing to stay untenably high for most Americans, many are staying put. But that doesn't mean homes don't need improving and upkeep. And some homeowners figure that if they can't move into a new home, they'll make their old home \"newer\" \u2014 a new deck or perhaps a walk-in closet.\n\nTraditionally, a home equity loan or home equity line of credit would be the first tool to reach for. But even those are getting too expensive for homeowners. This leaves homeowners effectively trapped in aging homes with no easy way out, or way to improve them.\n\nAnd even when homeowners are tapping into home equity loans \u2014 homeowners did originate nearly 20% more second mortgages or HELOCs in the second quarter of this year compared with the first quarter \u2014 they likely aren't using the equity for improvements. Experts say they are using them to stay afloat.\n\nUntapped or expensive, Americans are sitting on a record amount of home equity .\n\n\"As rates keep rising, tapping into home equity will become more and more expensive for homeowners. This will generally hold back consumer spending, but it will hit big-ticket items, like home renovations, particularly hard,\" said Tom Graff, chief investment officer of Facet, a financial planning and wealth management firm.\n\nThis struggle is something built into the rate hikes, according to Graff.\n\n\"The Fed is hiking interest rates in an attempt to control inflation. One of the ways that is supposed to work is by pushing down consumer spending. So the fact that consumers will struggle to finance large purchases is by design,\" he said.\n\nBut the Fed policy also comes with risks for a consumer-driven economy.", "source": "CNBC Top News", "pub_date_str": "03 Oct 2026, 10:03 PM IST", "pub_date_relative": "54m ago", "cfa_topics": ["Economics", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "US-Iran Conflict: Bessent Says Tehran To Have No Oil At Sea, No Revenues This Week", "full_content": "US Treasury Secretary Scott Bessent says Iran will have no oil at sea or related revenues this week as Washington steps up its economic pressure on Tehran.", "source": "NDTV Profit", "pub_date_str": "03 Oct 2026, 09:48 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "A $28B hemp THC industry is fighting to save itself from a looming federal ban - AP News", "full_content": "A $28B hemp THC industry is fighting to save itself from a looming federal ban AP News See more headlines & perspectives on Google News", "source": "Google News Business", "pub_date_str": "03 Oct 2026, 09:30 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "EPS: What to do if employer fails to make pension contribution", "full_content": "Employees who begin their first job with a basic wage of up to \u20b9 25,000 can qualify for pension benefits under the Employees\u2019 Pension Scheme (EPS), 2026, subject to the scheme\u2019s eligibility conditions. If an eligible employee finds that the employer is not making the required EPS contribution, the Employees\u2019 Provident Fund Organisation (EPFO) has advised them to first take up the matter with the employer.\n\nThe EPFO, in a post on X, formerly Twitter, said employees whose issue is not resolved by the employer can subsequently lodge a grievance through the EPFiGMS portal.\n\nEmployees starting their first job with wages within the revised EPF wage ceiling of \u20b9 25,000 can become members of the EPS, subject to applicable rules.\n\nOnce an employee qualifies for EPS membership, the employer is required to make the prescribed contribution towards the employee\u2019s EPS account in accordance with the scheme.\n\nThe revised wage ceiling is expected to bring more employees within the scope of mandatory EPF and EPS coverage.\n\nEmployees who are eligible for EPS but find that the required contribution is missing should initially approach their employer or the human resources and payroll department.\n\nThey should ask the employer to verify their EPF and EPS contribution records and confirm whether their membership and contributions have been correctly reflected.\n\nIf the employer fails to resolve the issue, the employee can approach the EPFO by registering a grievance through the EPFiGMS portal.", "source": "LiveMint Money", "pub_date_str": "03 Oct 2026, 09:27 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Drishyam: The Conclusion Box Office Collection Day 2: Ajay Devgn Starrer Continues Strong Run In India \u2014 Check Earnings", "full_content": "Directed by Abhishek Pathak, the film stars Ajay Devgn as Vijay Salgaonkar, Tabu as Meera Deshmukh and Jaideep Ahlawat as SP Rajveer Singh Tomar in major roles.", "source": "NDTV Profit", "pub_date_str": "03 Oct 2026, 09:22 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "India GDP forecast stays at 7%, uncertainty range remains wide: NITI Aayog\u2019s Arvind Virmani", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Indicators \u203a India GDP forecast stays at 7%, uncertainty range remains wide: NITI Aayog\u2019s Arvind Virmani The Economic Times daily newspaper is available online now. Read Today's Paper India GDP forecast stays at 7%, uncertainty range remains wide: NITI Aayog\u2019s Arvind Virmani SECTIONS India GDP forecast stays at 7%, uncertainty range remains wide: NITI Aayog\u2019s Arvind Virmani ET Online Last Updated: Oct 03, 2026, 09:04:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis NITI Aayog Member Arvind Virmani has retained his India GDP growth forecast at 7% for the year, with an uncertainty range of plus or minus 1%, citing unresolved trade issues and global developments. He also backed a gradual shift towards cost-based UPI MDR after the subsidy helped establish the payments platform.\n\nA for apple, Y for yak and, for the first time, a price next to it. Will this change the non-agri part of the rural economy?\n\nSix months after oil spiked, why are markets reacting so sharply now?\n\nGold paradox: Why India, a refining giant, is not a big bullion exporter\n\nA refinery is not a laptop: Why America's diesel problem can't be switched off\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers\n\nLogin using your ET Prime credentials to enjoy all member benefits", "source": "Economic Times Economy", "pub_date_str": "03 Oct 2026, 09:04 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "\u2018I\u2019m never selling\u2019: I\u2019m 47 and buy bitcoin with every dollar I earn. Am I crazy?", "full_content": "\u201cWhen my paycheck lands, it takes a detour through bitcoin.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "03 Oct 2026, 09:00 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Week That Was: HDFC Bank's New CEO, Smit Machchhar's Heroics, Yield Spike, US-Iran Conflict & More", "full_content": "Here are key developments from the last week of September that kept the week buzzing for the global and domestic market.", "source": "NDTV Profit", "pub_date_str": "03 Oct 2026, 08:59 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Man City Whistleblower Rui Pinto To Lose Witness Protection, Says He Has Received 'Multiple Death Threats'", "full_content": "The Football Leaks founder says he has moved to an undisclosed location after Portugal decided to end his protection despite his claims of multiple death threats.", "source": "NDTV Profit", "pub_date_str": "03 Oct 2026, 08:41 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "UPI MDR Charges: Start date, slabs and why is this Merchant Discount Rate being introduced now? All questions answered", "full_content": "The Centre will impose Merchant discount rate (MDR) charge on select online transactions conducted under the unified payments interface (UPI) system in India from this month, as per the National Payments Council of India (NPCI).\n\nThe NPCI in an announcement has month said that MDR would apply on person-to-merchant (P2M) UPI payments, above a certain threshold, under a revised UPI MDR framework. The rules come into effect from mid-October and keeping UPI free for all customer (person-to-person / P2P) transactions.\n\nMDR charge will apply on each P2M UPI transaction above \u20b9 2,000, with effect from 15 October 2026, according to the NPCI statement.\n\nThe rules keep 95% of low-value UPI transactions below \u20b9 2,000 and small merchant transactions (P2PM) completely free and proposes a new fund to support the expansion of UPI acceptance among small merchants.\n\nThe NPCI statement said that there will be no impact on small-value UPI transactions up to \u20b9 2,000 for all merchants , which account for more than 95% of all UPI P2M transactions.\n\nRevised UPI MDR remains lower than charges associated with several other digital payment instruments, including credit cards, debit cards, and wallets, the FAQ document added.\n\nAccording to the Ministry of Finance's press release, small merchants, including street vendors receiving up to \u20b9 1 lakh per month through UPI QR codes under the Person-to-Person-Merchant (P2PM) category, will continue to enjoy zero MDR on all transactions. \u201cThis provision will protect street vendors, neighbourhood shops and other small businesses from additional payment costs,\u201d it added.\n\nIt added that overall, \u201cUPI transactions accounting for 70% of (total) transaction value will remain completely outside the MDR framework \u201d.", "source": "LiveMint Money", "pub_date_str": "03 Oct 2026, 08:39 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Quantitative Methods", "Financial Statement Analysis"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "How Nvidia, Micron and a surprising jobs report drove last week's stock action", "full_content": "Here's a closer look at the three developments that drove the action in our portfolio last week.", "source": "CNBC World Economy", "pub_date_str": "03 Oct 2026, 08:36 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "The Treasury Department started Trump accounts for 60 million kids \u2014 but families still have to take this step if they want one", "full_content": "Here\u2019s what parents seeking the $1,000 seed money for their child need to know.", "source": "MarketWatch Top Stories", "pub_date_str": "03 Oct 2026, 08:36 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "U.S. to lend $4.2 billion to Vistra to boost nuclear power output, source says", "full_content": "The U.S. will lend Vistra about $4.2 billion to boost its nuclear power generation, a person familiar with the \u2060matter said on Saturday.\n\nU.S. Energy Secretary Chris Wright will announce the loan on Monday at Vistra's nuclear plant along Lake Erie in Ohio, the person said, speaking on condition of anonymity.\n\nThe loan would be used to boost \u2060power \u200coutput, or \"uprate\" at least three of Vistra's \u2060four nuclear stations, which can be done without requiring new licenses from the Nuclear Regulatory Commission.\n\nThe Department of Energy and Vistra did not immediately respond to \u200crequests for comment.\n\nAccording to the U.S. Nuclear Regulatory Commission, utilities can uprate nuclear plants by refueling with \u200bslightly more enriched uranium, a higher percentage of new fuel, or major plant modifications such as replacing main turbines. Utilities since the 1970s have \u2060used uprates to generate more power from reactors, the NRC's website says. \u200cAs of 2022 the agency had approved \u200cmore than 170 uprates, according to the NRC.\n\nVistra has six reactors at four U.S. plants that generate more than 6.5 gigawatts of electricity, \u2060enough to power about 3.25 million homes.\n\nU.S. power demand is growing for the first time in decades, driven by surging demand from the expansion of AI data centers, electrification of transportation, and cryptocurrency mining.\n\nPresident Donald \u200bTrump set a goal to \u200cquadruple U.S. nuclear power capacity by 2050. The Department of Energy has hundreds of billions of dollars in financing available from its loan office and Energy Secretary Wright has said the bulk of that loan \u200bcapacity will support nuclear power plants.", "source": "CNBC Top News", "pub_date_str": "03 Oct 2026, 08:30 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Commerce Minister Piyush Goyal meets US corporate leaders to push India investment opportunities", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a Commerce Minister Piyush Goyal meets US corporate leaders to push India investment opportunities The Economic Times daily newspaper is available online now. Read Today's Paper Commerce Minister Piyush Goyal meets US corporate leaders to push India investment opportunities SECTIONS Commerce Minister Piyush Goyal meets US corporate leaders to push India investment opportunities ET Online Last Updated: Oct 03, 2026, 08:30:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis During his visit to the United States, Piyush Goyal held meetings with executives from several major American companies. The discussions focused on expanding investment and manufacturing opportunities within India under the Make in India initiative. Goyal highlighted the rising potential of India's consumer market as a strong base for global brands.\n\nA for apple, Y for yak and, for the first time, a price next to it. Will this change the non-agri part of the rural economy?\n\nSix months after oil spiked, why are markets reacting so sharply now?\n\nGold paradox: Why India, a refining giant, is not a big bullion exporter\n\nA refinery is not a laptop: Why America's diesel problem can't be switched off\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers\n\nLogin using your ET Prime credentials to enjoy all member benefits", "source": "Economic Times Economy", "pub_date_str": "03 Oct 2026, 08:30 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Asian Games 2026 Medal Tally: Check India Position After Day 15 As China Lead Standings", "full_content": "India finished fourth at the Asian Games 2026 with 85 medals, including 21 gold, after a final-day surge across hockey, cricket, wrestling, golf and archery.", "source": "NDTV Profit", "pub_date_str": "03 Oct 2026, 08:14 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Parliamentary panel may recommend stricter monitoring of crypto transactions in India", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a Parliamentary panel may recommend stricter monitoring of crypto transactions in India The Economic Times daily newspaper is available online now. Read Today's Paper Parliamentary panel may recommend stricter monitoring of crypto transactions in India SECTIONS Parliamentary panel may recommend stricter monitoring of crypto transactions in India ET Online Last Updated: Oct 03, 2026, 07:56:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis A committee in Parliament is in the process of exploring the legal avenues for regulating cryptocurrency transactions and assets within India. They aim to identify technological strategies for tracking these digital assets responsibly. Highlighting the government's earlier stance on cryptocurrencies as unregulated and risky, recent notices under the Prevention of Money Laundering Act have been dispatched.\n\nA for apple, Y for yak and, for the first time, a price next to it. Will this change the non-agri part of the rural economy?\n\nSix months after oil spiked, why are markets reacting so sharply now?\n\nGold paradox: Why India, a refining giant, is not a big bullion exporter\n\nA refinery is not a laptop: Why America's diesel problem can't be switched off\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers\n\nLogin using your ET Prime credentials to enjoy all member benefits", "source": "Economic Times Economy", "pub_date_str": "03 Oct 2026, 07:56 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Raven Raises at $90M Valuation From CMCC Global and Coinbase Ventures for Prediction Markets", "full_content": "", "source": "Investing.com News", "pub_date_str": "03 Oct 2026, 07:32 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Gen Alpha kids are earning money. Here's how parents can help them save and invest", "full_content": "Kelly Pedersen was recently surprised to find out his 14-year-old daughter had thousands of dollars sitting in her digital wallet .\n\n\"She does all this entrepreneurial stuff . She has a lemonade stand where she's making \u2014 like on a Saturday she'll make four or five hundred dollars,\" he says. That hasn't stopped her from acting like a kid, he says: \"she goes to Starbucks and asks me for 10 bucks.\"\n\nPedersen, retail leader at professional services firm PricewaterhouseCoopers, says this kind of money maneuvering isn't uncommon for kids his daughter's age and younger. In fact, 86% of kids ages 7 to 14 \u2014 which PwC refers to as Gen Alpha \u2014 have their own money, according to a PwC survey published in March. Nearly all of them, 97%, say they make independent spending decisions at least sometimes. PwC surveyed 1,004 kids ages 7 to 14 with a margin of error of plus or minus 3.7 percentage points and 1,009 parents of children in that age range with a margin of error of plus or minus 4.1 percentage points between January 29 and February 13, 2026 .\n\n\"Gen Alpha, they're entrepreneurial. They have their own money. Sometimes their parents don't even know they have money,\" Pedersen says.\n\n\"They're all into resale ,\" Ali Furman, consumer markets leader at PwC adds. \"They're doing online auctions, they're buying and selling and participating in those markets, and they're making money. And even if they're not, they're getting money for allowance and chores and odd jobs, and they really care about making money.\" Resale website Depop has a minimum age requirement of 13 for sellers on its platform and those sellers under 18 may need a parent's permission and assistance with payments.\n\nAnd while those young folks may know how to spend money, many of their parents would also like to see their kids thinking about the future and starting to build savings or investment portfolios. Families have a variety of tools to support that goal.", "source": "CNBC Top News", "pub_date_str": "03 Oct 2026, 07:30 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "8th pay commission: Stakeholder meetings underway \u2014 Here are the key dates and FAQs answered", "full_content": "The 8th central pay commission (CPC) is in its consultation stage and has scheduled meetings in Bengaluru and Mumbai this month to hold discussions with employee unions, representatives, groups, pensioner associations, federations, and other stakeholders, before releasing its official recommendations.\n\nFormer Supreme Court Justice Ranjana Prakash Desai is the Chairperson, with Pankaj Jain, a former IAS officer as Member-Secretary, and Professor Pulak Ghosh, a tenured Professor of Finance and Member of the Economic Advisory Council to the Prime Minister as Member of the Commission.\n\nOverall, the recommendations are set to benefit over 1 crore individuals, including about 50 lakh central government employees and close to 65 lakh pensioners, including personnel and retirees with the defence and railway ministries.\n\nEstablished by the central government every 10 years to revise the allowances, pay and pensions of its employees, the pay commission or CPC, is responsible for decisions on contributions, retirement benefits and government spending.\n\nAll central government employees and retired former servicemen are impacted by the revisions. The current panel is the Centre's eight since Independence. It was constituted by Prime Minister Narendra Modi last year and issued its Terms of Reference (ToR) in November.\n\nThe 8th CPC's recommendations are not directly applicable to state government employees , as it only covers personnel employed by the Centre. However, a Clear Tax report noted that most states conduct their own independent reviews and eventually adopt similar pay structures to the central pay commission, following cabinet approvals.\n\nNotably, the 8th CPC also does not apply to bank employees.", "source": "LiveMint Money", "pub_date_str": "03 Oct 2026, 07:13 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Goldman Sachs says buy these stocks now, ahead of their earnings", "full_content": "The firm said this week that it sees several quality buying opportunities ahead of companies' quarterly reports.", "source": "CNBC Top News", "pub_date_str": "03 Oct 2026, 06:51 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Lula or Bolsonaro: Wall Street braces for two wildly different results in Brazil election", "full_content": "With the first round of Brazil's presidential election taking place Sunday, Wall Street is gearing up with starkly different market predictions depending on the outcome of the neck-and-neck race.\n\n\"The Brazil trade is: Does Lula win or does Bolsonaro win?\" said Fernando Marengo, chief economist at Black Toro Global Investments.\n\nThose names should sound familiar. Lula is 80-year-old leftist Luiz Inacio Lula da Silva, who is running for a fourth term against 45-year-old right-winger Flavio Bolsonaro, son of former President Jair Bolsonaro. If neither candidate gets more than 50% of the vote, a runoff will take place Oct. 25.\n\nIn short, if Bolsonaro wins, Wall Street expects a rally in the country's bonds, currency and stocks.\n\nAs Bolsonaro has come from behind in the last few months, Brazilian stocks have moved higher along with his poll numbers. In a recent note to clients, JPMorgan noted that the MSCI Brazil \"rose by 0.25% on average each day that Flavio gained in the polls.\"\n\nKalshi markets now show Bolsonaro favored to win 60% to Lula's 39%. Prediction markets are prohibited in Brazil, so they may not reflect local sentiment. In a note to clients, Aurora Macro Strategies senior advisor Richard Lapper said, \"the balance has shifted toward Flavio over the past month, but not nearly as far as the prediction markets are pricing.\"\n\nBovespa since Nov. 1, 2016 Bolsonaro is the favored candidate of the markets because he's promising more fiscal discipline, something many economists say Brazil desperately needs. Debt-to-GDP stands at 81.9%, up 10% since Lula took office.\n\n\"We need a 3-3.5% fiscal adjustment to stabilize the public debt in relation to GDP,\" said Leonardo Porto, Brazil head economist for Citi. And it can't just come from one-offs like privatization of state assets, he said. \"Brazil needs a permanent fiscal adjustment.\"", "source": "CNBC Finance", "pub_date_str": "03 Oct 2026, 06:42 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Gadkari calls for global code of conduct for infrastructure sector", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Infrastructure \u203a Gadkari calls for global code of conduct for infrastructure sector The Economic Times daily newspaper is available online now. Read Today's Paper Gadkari calls for global code of conduct for infrastructure sector SECTIONS Gadkari calls for global code of conduct for infrastructure sector PTI Last Updated: Oct 03, 2026, 06:40:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Nitin Gadkari highlighted the significance of infrastructure development in transforming India into a leading economy. He advocated for the use of alternative materials, including municipal waste, in construction to enhance sustainability. Gadkari urged the formulation of an international code of conduct to integrate new ideas and technologies in the sector. He suggested creating a 'Bank of Ideas' website for global research collaboration.\n\nA for apple, Y for yak and, for the first time, a price next to it. Will this change the non-agri part of the rural economy?\n\nSix months after oil spiked, why are markets reacting so sharply now?\n\nGold paradox: Why India, a refining giant, is not a big bullion exporter\n\nA refinery is not a laptop: Why America's diesel problem can't be switched off\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "03 Oct 2026, 06:40 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Sebi gets 3,500+ comments on Closing Auction Session rules: Circular likely soon, says Tuhin Kanta Pandey", "full_content": "The Securities and Exchange Board of India (Sebi) is set to finalise its proposed framework for changes to the Closing Auction Session (CAS) mechanism after receiving more than 3,500 comments on its consultation paper, Sebi Chairman Tuhin Kanta Pandey said on Saturday.\n\nThe capital markets regulator is expected to examine the feedback shortly and take the process forward. Pandey said the responses should not take long to compile and analyse as the proposals outlined in the consultation paper were specific and clearly defined.\n\n\"Today is the last date, and we will actually quickly look at all these comments and go ahead, because I think our proposals are quite clear,\" Pandey said at an event organised by CPAI (Commodity & Capital Market Participants Association of India).\n\nSebi had invited public comments on proposed changes relating to the CAS, trading hours and the methodology used to determine settlement prices for derivative contracts. The consultation period closes on October 3.\n\nIn September, Sebi proposed a review of the CAS framework as well as the methodology for calculating settlement prices for index and stock derivatives on expiry days.\n\nThe move followed the introduction of CAS in the equity cash market and concerns regarding its potential impact on the prices used to settle derivative contracts.\n\nUnder the CAS mechanism, closing prices are determined through an auction-based process. Sebi has said the proposed review seeks to address specific concerns while giving market participants an opportunity to offer alternative solutions.\n\nPandey said the consultation exercise was structured around a clearly identified issue, with stakeholders free to suggest different methods of addressing it.", "source": "LiveMint Markets", "pub_date_str": "03 Oct 2026, 06:35 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Derivatives", "Alternative Investments"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Larry Ellison Risk Exposed by Paramount and Oracle Debt Binges - Bloomberg.com", "full_content": "Larry Ellison Risk Exposed by Paramount and Oracle Debt Binges Bloomberg.com Paramount picked a bad time to fund a $110bn leveraged buyout Financial Times Paramount\u2019s Record Bond Sale Has a Rough Opening Day Yahoo Finance Paramount Skydance bonds fall on first trading day after debt sale qz.com Paramount Bonds Yield Over 10% After New Debt Falls In Price Barron's", "source": "Google News Business", "pub_date_str": "03 Oct 2026, 06:30 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "DA news: Sikkim govt hikes dearness allowance for employees, dearness relief for pensioners \u2014 Check details", "full_content": "Sikkim has this month announced increase in dearness allowance (DA) and dearness relief (DR) for state government employees and pensioners under pre-revised and revised pay structures, according to a PTI report citing an officia ", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "D-Mart Q2 revenue rises 18% to Rs 19,206 cr; store count at 518", "full_content": "Avenue Supermarts has achieved an impressive 18.4% growth in standalone revenue for the second quarter of 2026, totaling Rs 19,206.18 crore, a substantial rise from Rs 16,218.79 crore compared to the same period last year. This also reflects a 4.7% increase from the preceding quarter's revenue of Rs 18,343.49 crore.", "source": "Economic Times Markets", "pub_date_str": "03 Oct 2026, 03:36 PM IST", "pub_date_relative": "7h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "After Sept, bond yields to peak in Oct too? Experts decode future of Indian bond market; RBI's next move holds key", "full_content": "Shorter-tenure corporate bonds may offer better risk-reward opportunities, while dynamic bond funds provide flexibility for various risk profiles. RBI is expected to raise the repo rate by 50-75 basis points amid inflation risks, driven by higher food and oil prices.", "source": "LiveMint Markets", "pub_date_str": "03 Oct 2026, 03:17 PM IST", "pub_date_relative": "7h ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Sebi examining position limits for non-agri contracts to boost liquidity", "full_content": "Sebi is actively investigating position limits for non-agricultural contracts to improve market liquidity and depth. Chairman Tuhin Kanta Pandey has highlighted the importance of phased physical settlement for agricultural commodities. The organization is focused on addressing structural issues and increasing technology integration in commodity markets. Furthermore, Sebi plans to expand its educational outreach through Project Jagrook to better inform market participants.", "source": "Economic Times Markets", "pub_date_str": "03 Oct 2026, 03:16 PM IST", "pub_date_relative": "7h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Dalal Street Week Ahead: Oversold Nifty may rebound as volatility stays high", "full_content": "The technical structure has weakened materially, with the most important development being the Nifty's modest violation of its 200-week moving average, presently placed at 22,606.97. This is the first breach of this long-term average since March 2020 and makes the 22,600 area particularly important over the coming days.", "source": "Economic Times Markets", "pub_date_str": "03 Oct 2026, 03:08 PM IST", "pub_date_relative": "7h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "What\u2019s driving the global bond sell-off?", "full_content": "Looking at the most cited factors reveals a mixed picture", "source": "FT Markets", "pub_date_str": "03 Oct 2026, 03:00 PM IST", "pub_date_relative": "7h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "RBI remains cautious on crypto, backs underlying technology: Governor Sanjay Malhotra", "full_content": "India's cautious approach towards cryptocurrencies emphasises the importance of underlying technologies like distributed ledger and tokenisation. RBI Governor Sanjay Malhotra expressed concerns regarding monetary sovereignty and its effects on capital flows. While domestic payments are efficient, challenges remain in cross-border transactions, which may benefit from central bank digital currencies. The rising public debt and bond yield movements reflect the increased spending attributed     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
