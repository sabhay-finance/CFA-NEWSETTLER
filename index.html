<script>

    const allData = {"general": [{"title": "SGB 2020-21 Series XII redemption today: RBI fixes \u20b915,355 price; check how much your investment has grown", "full_content": "The Reserve Bank of India (RBI) has fixed the premature redemption price of Sovereign Gold Bond (SGB) 2020-21 Series XII at \u20b9 15,355 per unit for September 9, 2026. The tranche was originally issued on March 9, 2021, and investors become eligible for premature redemption after five years, subject to the scheme's redemption conditions.\n\nThe RBI's September 8 press release said the redemption price is based on the simple average of the closing price of 999-purity gold for the three business days preceding the redemption date. For this redemption window, the relevant dates were September 4, September 7 and September 8, 2026.\n\nThe SGB 2020-21 Series XII was issued at \u20b9 4,662 per gram for offline applications, while investors applying online received a \u20b9 50 discount, taking the issue price to \u20b9 4,612 per gram.\n\nFor an investor who bought the bond online, the capital appreciation can be calculated as follows.\n\nTherefore, a \u20b9 1 lakh investment at the online issue price would have purchased around 21.68 grams of gold through the SGB.\n\nAt the September 9 redemption price of \u20b9 15,355 per gram, those units would be worth approximately \u20b9 3.33 lakh.\n\nThis calculation represents the capital appreciation alone and does not include the interest paid on the SGB.\n\nFor investors who purchased the bonds offline at \u20b9 4,662 per gram, a \u20b9 1 lakh investment would translate into approximately \u20b9 3.29 lakh at the same redemption price, before accounting for interest.", "source": "LiveMint Money", "pub_date_str": "09 Sep 2026, 12:57 PM IST", "pub_date_relative": "11m ago"}, {"title": "Google to invest $15 billion into AI infrastructure in Finland in biggest-ever Europe investment", "full_content": "Google on Wednesday said it would invest 13 billion euros ($15.1 billion) into AI infrastructure in Finland, marking the tech giant's largest single investment in Europe.\n\nFinland has emerged as a key location for data centers amid the AI boom, with hyperscalers and developers eyeing its available land and power, which is in short supply throughout most of Europe.", "source": "CNBC World Economy", "pub_date_str": "09 Sep 2026, 12:57 PM IST", "pub_date_relative": "12m ago"}, {"title": "Energean shares jump on better-than-expected H1 results", "full_content": "", "source": "Investing.com News", "pub_date_str": "09 Sep 2026, 12:53 PM IST", "pub_date_relative": "15m ago"}, {"title": "From cashback to portfolio management: Why high spenders are hiring credit card advisors", "full_content": "Getting the right credit card used to mean comparing annual fees, reward rates, and perhaps lounge access. For a growing number of cardholders, it now resembles portfolio management.\n\nWhich cards should you hold? Which one should pay for groceries, insurance , utilities, or a large purchase? Should reward points be converted into airline miles or hotel points, or simply used to settle the monthly bill? When a card gets devalued, what should replace it? And when it is finally time to travel, which redemption route offers peak value?\n\nTo answer these questions, a rising crop of platforms and independent consultants\u2014including The Points Code, CardExpert, 1A, and LiveFromALounge founder Ajay Awtaney\u2014now provide personalised advice for a fee.\n\nDigital platforms like SaveSage combine app-based tracking with access to human experts, while apps like FLIP use technology to determine which card in a user's existing wallet works best for a specific swipe.\n\nAt the entry level, most platforms offer a one-time portfolio review, suggest additions or trims based on spending patterns, and provide basic redemption advice.\n\nRohan Varshnei, co-founder of The Points Code, told Shipra Singh from Mint that one-time guidance is generally more practical than an ongoing retainer for cardholders spending \u20b9 20\u201340 lakh annually:\n\n\u201cFor cardholders spending around \u20b9 20-25 lakh annually, rewards may be worth roughly \u20b9 50,000 to \u20b9 1 lakh, depending on the cards and spending patterns. At this level, paying about \u20b9 7,000-10,000 for one-time assistance will make sense, instead of paying a higher fee for ongoing card portfolio management,\u201d said Varshnei.\n\nHigher-tier programmes operate much like family offices or private wealth desks, featuring periodic reviews, customised redemption roadmaps, and on-call support for major ticket spends or international itineraries. These services focus on high-net-worth individuals (HNIs) logging over \u20b9 40 lakh in annual discretionary card spending.", "source": "LiveMint Money", "pub_date_str": "09 Sep 2026, 12:53 PM IST", "pub_date_relative": "16m ago"}, {"title": "Oil extends rally, Brent nears $100/bbl as U.S.-Iran fighting escalates", "full_content": "", "source": "Investing.com News", "pub_date_str": "09 Sep 2026, 12:53 PM IST", "pub_date_relative": "16m ago"}, {"title": "Tekmar Group settles legacy defect claim with customer", "full_content": "", "source": "Investing.com News", "pub_date_str": "09 Sep 2026, 12:52 PM IST", "pub_date_relative": "16m ago"}, {"title": "E20 and your car: what Zuno\u2019s new Fuel Guard covers\u2014and what it doesn\u2019t", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nAs India moves towards higher ethanol blending in petrol, Zuno General Insurance has launched an add-on cover to protect vehicle owners against accidental engine and fuel-system damage due to the use of approved blended fuels, the insurer said in a statement on Wednesday.\n\nCalled Fuel Guard, the company describes it as an industry-first add-on that provides an additional layer of protection as the use of blended fuels expands.\n\nHowever, the cover is available only for vehicles manufactured on or after 1 April 2023, and only where the manufacturer has approved the use of the specific blended fuel. A vehicle using E20, for example, must be approved by its manufacturer for E20 fuel .\n\nThe vehicle must also be serviced according to the manufacturer's prescribed maintenance schedule and should not have any unauthorised engine or fuel-system modifications.\n\n\u201cEvery accidental damage is typically covered irrespective of the fuel. There is no confusion on that. There may, however, be situations in the future where a garage says that some damage is not because of an accident but because of fuel, which may have accumulated over time or caused damage. We want customers to drive without that anxiety,\u201d said Shanai Ghosh, managing director and chief executive officer, Zuno General Insurance.\n\nAccording to Pooja Yadav, chief product officer, Zuno General Insurance, the scope of the Fuel Guard add-on could be expanded as new blended fuels are introduced.\n\nFor a compact SUV such as a Kia Seltos that is around two years old, with an Insured Declared Value (IDV) of approximately \u20b9 10 lakh, the Fuel Guard add-on would cost around \u20b9 4,000-5,000, according to the insurer.", "source": "LiveMint Money", "pub_date_str": "09 Sep 2026, 12:52 PM IST", "pub_date_relative": "17m ago"}, {"title": "Jefferies initiates Liberty Formula One stock with buy on margin expansion outlook", "full_content": "", "source": "Investing.com News", "pub_date_str": "09 Sep 2026, 12:50 PM IST", "pub_date_relative": "18m ago"}, {"title": "Jefferies initiates Lindblad Expeditions stock at Hold, sets $29 target", "full_content": "", "source": "Investing.com News", "pub_date_str": "09 Sep 2026, 12:50 PM IST", "pub_date_relative": "18m ago"}, {"title": "Oil hits $100 for first time since July", "full_content": "Brent crude advances amid fears of a renewed global supply crunch", "source": "FT Markets", "pub_date_str": "09 Sep 2026, 12:49 PM IST", "pub_date_relative": "19m ago"}, {"title": "UBS increases debt buyback offer to $4 billion from $2 billion", "full_content": "", "source": "Investing.com News", "pub_date_str": "09 Sep 2026, 12:47 PM IST", "pub_date_relative": "22m ago"}, {"title": "LCC Projects IPO Day 1: Issue subscribed 44% so far. GMP signals 23% listing pop - Apply or not?", "full_content": "The LCC Projects IPO opened for subscription on Wednesday, September 9. Investors looking to participate in the issue can place their bids starting today. The \u20b9 427 crore IPO will remain for subscription till 11 September.\n\nThe shares of LCC Projects IPO are commanding a premium of \u20b9 34 in the unlisted market. The GMP of LCC Projects IPO is +34, according to Investorgain. This indicates an estimated listing price of \u20b9 180, which is 23.29% higher than the IPO price of \u20b9 146.\n\nThe LCC Projects IPO has been subscribed over 44% so far on the first day of bidding on 9 September. The issue has received 92,99,034 bids so far, as compared to 2,09,27,281 offered.\n\nThe retail portion has been booked 0.51% so far. Meanwhile, non-institutional investors (NIIs) have been subscribed 0.16%. QIB section has been booked 0.55%.\n\nBrokerage firm Anand Rathi has given \u2018subscribe -long-term\u2019 rating to the LCC Projects IPO, saying that the company is valued at 14.8x FY26 P/E and 9.61x FY26 EV/EBITDA, implying a post-issue market capitalization of \u20b9 42,292 million.\n\n\u201cThe company\u2019s strong order book, improving profitability and established execution capabilities provide a favourable growth outlook. However, the business remains exposed to government project dependence, customer and geographical concentration, project execution risks and relatively high leverage, warranting a balanced valuation outlook,\u201d he said.\n\nMeanwhile, brokerage firm Swastika Investmart said that the company has \u20b9 7,953 Cr Order Book and Around 83% of the order book is still related to irrigation and water-supply projects.\n\n\u201cLCC Projects as a stable infrastructure growth play. Its combination of modest valuation (~14x FY26 P/E), high return metrics, strong order book, and immediate debt reduction via IPO proceeds makes it suitable for long term investors,\u201d it added.", "source": "LiveMint Markets", "pub_date_str": "09 Sep 2026, 12:47 PM IST", "pub_date_relative": "22m ago"}, {"title": "HSBC downgrades LVMH stock rating on soft luxury challenges", "full_content": "", "source": "Investing.com News", "pub_date_str": "09 Sep 2026, 12:46 PM IST", "pub_date_relative": "22m ago"}, {"title": "FTSE 100 today: Stocks retreat as Gulf strikes send oil toward $100", "full_content": "", "source": "Investing.com News", "pub_date_str": "09 Sep 2026, 12:46 PM IST", "pub_date_relative": "22m ago"}, {"title": "First Hydrogen acquires 60% stake in robotics firm", "full_content": "", "source": "Investing.com News", "pub_date_str": "09 Sep 2026, 12:46 PM IST", "pub_date_relative": "22m ago"}, {"title": "Adar1 Capital Management, 10% owner, buys $1.6m in Tenax Therapeutics", "full_content": "", "source": "Investing.com News", "pub_date_str": "09 Sep 2026, 12:46 PM IST", "pub_date_relative": "23m ago"}, {"title": "Oil nears $100 as US launches new strikes on Iranian tankers", "full_content": "American military hit \u2018multiple\u2019 ships linked to Revolutionary Guards following attempted missile attacks on US warship", "source": "FT Markets", "pub_date_str": "09 Sep 2026, 12:43 PM IST", "pub_date_relative": "25m ago"}, {"title": "India Inc shakes off war worries as business confidence jumps in Q2", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Indicators \u203a India Inc shakes off war worries as business confidence jumps in Q2 The Economic Times daily newspaper is available online now. Read Today's Paper India Inc shakes off war worries as business confidence jumps in Q2 SECTIONS India Inc shakes off war worries as business confidence jumps in Q2 By Anoushka Sawhney , ET Bureau Last Updated: Sep 09, 2026, 12:41:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Indian business confidence strengthened in Q2FY27, with CII\u2019s index rising to 66 from 60.8. Companies are increasingly optimistic about domestic demand, capacity utilisation and hiring, with 53% planning to expand their workforce, even as global trade and commodity-price risks persist.\n\nBigger or Better: One order from Power Grid Corp added $1 billion to the market cap of a company \u2013 Final part\n\nBanks have received a flood of money. Now comes the real test\n\nNew aircraft order opens door for ATR assembly line in India: CEO\n\nSeason of change in accounting policy: A simple AI prompt can tell you a lot\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers\n\nLogin using your ET Prime credentials to enjoy all member benefits", "source": "Economic Times Economy", "pub_date_str": "09 Sep 2026, 12:41 PM IST", "pub_date_relative": "28m ago"}, {"title": "Anthropic researcher says AI has more than 10% chance of 'killing all humans' after colleague quits", "full_content": "There is more than a 10% chance that artificial intelligence could \"kill all humans,\" an Anthropic safety researcher said on Tuesday, hours after another employee said he was quitting the company over concerns that AI labs are \"gambling with our lives.\"\n\nThe comments underscore growing concerns among those at the heart of AI development that the technology could get out of control and pose a threat to humanity, even as Anthropic and OpenAI continue to raise large sums of money and head toward expected public listings .\n\nJacob Coxon, a researcher at Anthropic, said on Tuesday he resigned from the company. Coxon said neither Anthropic nor OpenAI is acting responsibly.\n\n\"They are racing straight to self-improving superintelligence and gambling with our lives,\" Coxon said in a post on X .\n\nSelf-improvement is the idea that AI systems can improve themselves without much human intervention. Recursive self-improvement, as it is often called, is not yet possible, but AI labs are working toward the goal.\n\n\"Do not underestimate the power of this technology. These will soon be superhuman systems that can hack anything, revolutionize any field overnight, and acquire real power and resources. We have all witnessed the progress in each of these domains, and progress is not slowing,\" Coxon said.\n\nHe added that \"people building AI earnestly believe that it could kill us all by the end of the decade.\"\n\nThat comment prompted a response from Evan Hubinger, an alignment science lead at Anthropic, who said that not only was Coxon's statement \"correct,\" but also that Anthropic has no plan for this scenario.", "source": "CNBC World Economy", "pub_date_str": "09 Sep 2026, 12:36 PM IST", "pub_date_relative": "32m ago"}, {"title": "Gold ETF inflows halve in July as profit-booking and price volatility cool investor appetite", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nNet inflows into gold ETFs dipped sharply in July, falling nearly 55% month-on-month to \u20b9 1,559 crore, according to data released by the Association of Mutual Funds in India (Amfi). Gold ETFs saw an outflow of \u20b9 725 crore in May 2026 before flows turned positive in June, with inflows worth \u20b9 3,443 crore.\n\nThe decline comes after an extended rally that pushed gold ETF assets under management to record highs, followed by a sharp market correction that prompted retail investors to pause fresh allocations, according to industry experts.\n\nThe sudden decline in flows points to a shift from aggressive momentum-chasing to cautious profit-booking. Following a major price surge in gold ETFs between April 2020 and early 2026, gold and silver prices corrected significantly, down nearly 30% and 50% from their peak levels, respectively.\n\nAccording to Navneet Damani, head of research for commodities and currency at Motilal Oswal Financial Services, retail participation is heavily tied to price momentum.\n\n\"Whenever something is moving, investors try to jump in to chase that. And when prices start to correct, the traction or the kind of flows which come into any kind of segment starts to pause,\" Damani explained, noting that many investors paused SIPs as prices retreated.\n\nVikram Dhawan, head commodities and fund manager at Nippon India Mutual Fund, attributed the pullback to profit-taking and the unwinding of speculative positions.\n\n\"What happened initially in 2026 was profit-taking, which snowballed into huge volatility, partly because a lot of leverage bets had been taken in gold and silver in overseas markets,\" Dhawan said.", "source": "LiveMint Money", "pub_date_str": "09 Sep 2026, 12:33 PM IST", "pub_date_relative": "36m ago"}], "cfa": [{"title": "SGB 2020-21 Series XII redemption today: RBI fixes \u20b915,355 price; check how much your investment has grown", "full_content": "The Reserve Bank of India (RBI) has fixed the premature redemption price of Sovereign Gold Bond (SGB) 2020-21 Series XII at \u20b9 15,355 per unit for September 9, 2026. The tranche was originally issued on March 9, 2021, and investors become eligible for premature redemption after five years, subject to the scheme's redemption conditions.\n\nThe RBI's September 8 press release said the redemption price is based on the simple average of the closing price of 999-purity gold for the three business days preceding the redemption date. For this redemption window, the relevant dates were September 4, September 7 and September 8, 2026.\n\nThe SGB 2020-21 Series XII was issued at \u20b9 4,662 per gram for offline applications, while investors applying online received a \u20b9 50 discount, taking the issue price to \u20b9 4,612 per gram.\n\nFor an investor who bought the bond online, the capital appreciation can be calculated as follows.\n\nTherefore, a \u20b9 1 lakh investment at the online issue price would have purchased around 21.68 grams of gold through the SGB.\n\nAt the September 9 redemption price of \u20b9 15,355 per gram, those units would be worth approximately \u20b9 3.33 lakh.\n\nThis calculation represents the capital appreciation alone and does not include the interest paid on the SGB.\n\nFor investors who purchased the bonds offline at \u20b9 4,662 per gram, a \u20b9 1 lakh investment would translate into approximately \u20b9 3.29 lakh at the same redemption price, before accounting for interest.", "source": "LiveMint Money", "pub_date_str": "09 Sep 2026, 12:57 PM IST", "pub_date_relative": "11m ago", "cfa_topics": ["Financial Statement Analysis", "Fixed Income", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Google to invest $15 billion into AI infrastructure in Finland in biggest-ever Europe investment", "full_content": "Google on Wednesday said it would invest 13 billion euros ($15.1 billion) into AI infrastructure in Finland, marking the tech giant's largest single investment in Europe.\n\nFinland has emerged as a key location for data centers amid the AI boom, with hyperscalers and developers eyeing its available land and power, which is in short supply throughout most of Europe.", "source": "CNBC World Economy", "pub_date_str": "09 Sep 2026, 12:57 PM IST", "pub_date_relative": "12m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "From cashback to portfolio management: Why high spenders are hiring credit card advisors", "full_content": "Getting the right credit card used to mean comparing annual fees, reward rates, and perhaps lounge access. For a growing number of cardholders, it now resembles portfolio management.\n\nWhich cards should you hold? Which one should pay for groceries, insurance , utilities, or a large purchase? Should reward points be converted into airline miles or hotel points, or simply used to settle the monthly bill? When a card gets devalued, what should replace it? And when it is finally time to travel, which redemption route offers peak value?\n\nTo answer these questions, a rising crop of platforms and independent consultants\u2014including The Points Code, CardExpert, 1A, and LiveFromALounge founder Ajay Awtaney\u2014now provide personalised advice for a fee.\n\nDigital platforms like SaveSage combine app-based tracking with access to human experts, while apps like FLIP use technology to determine which card in a user's existing wallet works best for a specific swipe.\n\nAt the entry level, most platforms offer a one-time portfolio review, suggest additions or trims based on spending patterns, and provide basic redemption advice.\n\nRohan Varshnei, co-founder of The Points Code, told Shipra Singh from Mint that one-time guidance is generally more practical than an ongoing retainer for cardholders spending \u20b9 20\u201340 lakh annually:\n\n\u201cFor cardholders spending around \u20b9 20-25 lakh annually, rewards may be worth roughly \u20b9 50,000 to \u20b9 1 lakh, depending on the cards and spending patterns. At this level, paying about \u20b9 7,000-10,000 for one-time assistance will make sense, instead of paying a higher fee for ongoing card portfolio management,\u201d said Varshnei.\n\nHigher-tier programmes operate much like family offices or private wealth desks, featuring periodic reviews, customised redemption roadmaps, and on-call support for major ticket spends or international itineraries. These services focus on high-net-worth individuals (HNIs) logging over \u20b9 40 lakh in annual discretionary card spending.", "source": "LiveMint Money", "pub_date_str": "09 Sep 2026, 12:53 PM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "UBS increases debt buyback offer to $4 billion from $2 billion", "full_content": "", "source": "Investing.com News", "pub_date_str": "09 Sep 2026, 12:47 PM IST", "pub_date_relative": "22m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "LCC Projects IPO Day 1: Issue subscribed 44% so far. GMP signals 23% listing pop - Apply or not?", "full_content": "The LCC Projects IPO opened for subscription on Wednesday, September 9. Investors looking to participate in the issue can place their bids starting today. The \u20b9 427 crore IPO will remain for subscription till 11 September.\n\nThe shares of LCC Projects IPO are commanding a premium of \u20b9 34 in the unlisted market. The GMP of LCC Projects IPO is +34, according to Investorgain. This indicates an estimated listing price of \u20b9 180, which is 23.29% higher than the IPO price of \u20b9 146.\n\nThe LCC Projects IPO has been subscribed over 44% so far on the first day of bidding on 9 September. The issue has received 92,99,034 bids so far, as compared to 2,09,27,281 offered.\n\nThe retail portion has been booked 0.51% so far. Meanwhile, non-institutional investors (NIIs) have been subscribed 0.16%. QIB section has been booked 0.55%.\n\nBrokerage firm Anand Rathi has given \u2018subscribe -long-term\u2019 rating to the LCC Projects IPO, saying that the company is valued at 14.8x FY26 P/E and 9.61x FY26 EV/EBITDA, implying a post-issue market capitalization of \u20b9 42,292 million.\n\n\u201cThe company\u2019s strong order book, improving profitability and established execution capabilities provide a favourable growth outlook. However, the business remains exposed to government project dependence, customer and geographical concentration, project execution risks and relatively high leverage, warranting a balanced valuation outlook,\u201d he said.\n\nMeanwhile, brokerage firm Swastika Investmart said that the company has \u20b9 7,953 Cr Order Book and Around 83% of the order book is still related to irrigation and water-supply projects.\n\n\u201cLCC Projects as a stable infrastructure growth play. Its combination of modest valuation (~14x FY26 P/E), high return metrics, strong order book, and immediate debt reduction via IPO proceeds makes it suitable for long term investors,\u201d it added.", "source": "LiveMint Markets", "pub_date_str": "09 Sep 2026, 12:47 PM IST", "pub_date_relative": "22m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "FTSE 100 today: Stocks retreat as Gulf strikes send oil toward $100", "full_content": "", "source": "Investing.com News", "pub_date_str": "09 Sep 2026, 12:46 PM IST", "pub_date_relative": "22m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "India Inc shakes off war worries as business confidence jumps in Q2", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Indicators \u203a India Inc shakes off war worries as business confidence jumps in Q2 The Economic Times daily newspaper is available online now. Read Today's Paper India Inc shakes off war worries as business confidence jumps in Q2 SECTIONS India Inc shakes off war worries as business confidence jumps in Q2 By Anoushka Sawhney , ET Bureau Last Updated: Sep 09, 2026, 12:41: s Yahoo Finance Oil prices surge as US-Iran strikes intensify in Strait of Hormuz Al Jazeera", "source": "Google News Business", "pub_date_str": "09 Sep 2026, 12:30 PM IST", "pub_date_relative": "38m ago", "cfa_topics": ["Equity Investments", "Derivatives"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Paytm shares jump 5% as workplace AI push gains traction", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Paytm shares jump 5% as workplace AI push gains traction One97 Communications Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Paytm shares jump 5% as workplace AI push gains traction SECTIONS Paytm shares jump 5% as workplace AI push gains traction By Somanjali Das , ETMarkets.com Last Updated: Sep 09, 2026, 12:27:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Paytm shares surged on Wednesday, as investors welcomed the company\u2019s push into enterprise AI, marking an expansion beyond its core payments business. The stock has gained over 20% in the past month, significantly outperforming the broader Nifty 500 and Nifty 50.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "09 Sep 2026, 12:27 PM IST", "pub_date_relative": "42m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "US bond yields near 5%: What it could mean for stocks, corporate borrowing and the economy", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a US bond yields near 5%: What it could mean for stocks, corporate borrowing and the economy Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US bond yields near 5%: What it could mean for stocks, corporate borrowing and the economy SECTIONS US bond yields near 5%: What it could mean for stocks, corporate borrowing and the economy By Anupam Nagar , ETMarkets.com Last Updated: Sep 09, 2026, 12:25:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis US 10-year Treasury yields are nearing the 5% mark, raising concerns over the impact of higher borrowing costs on stocks, corporate financing, dealmaking and the broader economy. While elevated yields can pressure valuations and debt servicing costs, they may also signal stronger economic growth and robust demand for capital.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "09 Sep 2026, 12:25 PM IST", "pub_date_relative": "43m ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Innovision share price jumps 18% after bagging NHAI toll collection contract in Madhya Pradesh", "full_content": "Innovision share price jumped 18% on Wednesday, 9 September, after the company received a Letter of Award (LoA) from the National Highways Authority of India (NHAI) for user fee collection at Pachwara Fee Plaza on NH-39 in Madhya Pradesh.\n\nThe latest order is worth \u20b9 24.52 crore and covers user fee collection at the fee plaza for the four-laning of the Jhansi-Khajuraho section of NH-39. The contract also includes the upkeep and maintenance of adjacent toilet blocks, along with replenishment of consumable items. The order is to be executed over a period of one year.\n\nIn a separate order, Innovision has been appointed as a user fee collection agency for the IDTL A and IDTL B fee plazas for the six-laning of the Indore-Dewas section of NH-3 in Madhya Pradesh. The contract, awarded through competitive bidding via e-tender, has a total commercial consideration of \u20b9 219.07 crore and is also valid for one year.\n\nThe company said both orders were awarded by domestic entities and that no promoter, promoter group or group company has any interest in the entities awarding the contracts.\n\nThe latest contracts add to a series of NHAI orders secured by Innovision in recent months.\n\nEarlier this month, the company received an LoA worth \u20b9 48.25 crore for user fee collection at Mangapatnam Fee Plaza on NH-67 in Andhra Pradesh. The contract covers the Tadipatri-Jammalamadugu route via Muddanur and includes the upkeep and maintenance of adjacent toilet blocks and the replenishment of consumable items.\n\nIn August, Innovision secured another NHAI contract worth \u20b9 30.36 crore for user fee collection at Manambadi Fee Plaza on the Sethiyathope-Cholapauram section of NH-36 in Tamil Nadu. The order also includes maintenance of adjacent toilet blocks and replenishment of consumables.\n\nThe latest contract wins strengthen Innovision\u2019s order pipeline and expand its presence across highway fee-collection projects in multiple states.", "source": "LiveMint Markets", "pub_date_str": "09 Sep 2026, 12:23 PM IST", "pub_date_relative": "45m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "10 IPOs available for subscription today: Which shows most potential for listing gains | Check latest GMP", "full_content": "Investors on Dalal Street are dealing with an unusually busy primary market on Wednesday, September 9, with as many as 10 IPOs at different stages of their offerings. Collectively, these issues are looking to raise \u20b9 7,288.34 crore from investors.\n\nOf the 10 IPOs , six are opening for subscription today, while three have moved into their second day of bidding. The Pranav Constructions IPO, meanwhile, is entering its final day of subscription.\n\nAdding to the excitement around the primary market is the buzz surrounding the upcoming mega IPOs of NSE and JIO, which has further lifted sentiment in the IPO space.\n\nWith several issues competing for investor attention, grey market premium ( GMP ) trends offer one of the key indicators being tracked ahead of listing. Here is a look at the latest GMP, estimated listing price, potential listing gain and issue details for the IPOs.\n\nRentomojo: The Rentomojo IPO is commanding a GMP of \u20b9 134. Based on the upper end of its price band at \u20b9 404 per share, the implied listing price works out to \u20b9 538. This indicates a potential listing gain of 33.17% over the issue price.\n\nRentomojo is looking to raise \u20b9 1,255.57 crore through its IPO. The issue consists of 37.15 lakh fresh shares worth \u20b9 150 crore and an offer for sale (OFS) of 2.74 crore shares aggregating to \u20b9 1,105.57 crore. The company has fixed its IPO price band at \u20b9 384 to \u20b9 404 per equity share. The application lot size for retail investors is 37 shares, taking the minimum investment required by an individual investor to \u20b9 14,948.\n\nKaramtara Engineering: Karamtara Engineering is commanding a GMP of \u20b9 65. At the upper price band of \u20b9 254 per share, this points to an estimated listing price of \u20b9 319 per share. The implied potential listing gain stands at 25.59% over the issue price.\n\nThe company is seeking to raise \u20b9 875 crore through the IPO. The offering includes 2.66 crore fresh shares aggregating to \u20b9 675 crore and an offer for sale of 78.74 lakh shares worth \u20b9 200 crore.", "source": "LiveMint Markets", "pub_date_str": "09 Sep 2026, 12:17 PM IST", "pub_date_relative": "51m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Rupee's RBI-backed rally falters, slips past 95 on oil, slowing intervention", "full_content": "The Indian rupee slid past ninety-five against the dollar on Wednesday, influenced by climbing oil prices that have offset recent interventions by the central bank. The situation is exacerbated by escalating tensions in the Middle East, which are pushing Brent crude prices toward one hundred dollars per barrel. As a major oil importer, India faces considerable challenges, and the rupee's downturn underscores its susceptibility to adverse global  in West Asia drove crude oil prices close to the $100-per-barrel mark. The 30-share BSE Sensex fell 500.25 points to 75,060.61, while the 50-share NSE Nifty declined 129.40 points to 23,506.10.\n\nIn an exchange filing dated 9 September, Astec Lifesciences gave a clarification on significant increase in the volume of security across exchange.\n\n\u201cWe wish to inform you that as a Listed Company, we are conscious of our responsibility to disseminate to the Stock Exchanges, information that could have an impact on the price of the Company\u2019s shares. Consistent with this approach, we have been promptly disseminating to the Stock Exchanges, events or information which are required to be disclosed pursuant to the Regulation 30 of the Securities and Exchange Board of India (Listing Obligations and Disclosure Requirements) Regulations, 2015 (\u201cthe Listing Regulations\u201d),\u201d the firm said.\n\nThe company further informed that in compliance with respect to disclosures that are required to be made under the Listing Regulations and also confirm that there are no developments that have taken place requiring mandatory disclosure under Listing Regulations or the Securities and Exchange Board of India.\n\nThe company reported consolidated total income of \u20b9 84.3 crore in Q1FY27, compared with \u20b9 91.6 crore in Q1FY26, reflecting a decline in income during the quarter.\n\nDespite the lower total income, the company witnessed a significant improvement in operating performance.", "source": "LiveMint Markets", "pub_date_str": "09 Sep 2026, 12:10 PM IST", "pub_date_relative": "58m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Alternative Investments", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "NSE cuts IPO price range, giving up shot at India's top listing", "full_content": "National Stock Exchange of India Ltd. has lowered the price range for its long-awaited IPO and may shrink the stake on sale, according to people familiar with the matter, leaving the deal poised to fall short of becoming India\u2019s biggest-ever listing.\n\nNSE is likely to set its IPO price at \u20b9 1,700-1,785 per share, below an earlier marketed range of \u20b9 2,000-2,100, the people said, asking not to be identified because the information is private. It may also reduce the stake being offered to about 5.5% of the total equity capital from the originally planned 6%, after some shareholders backed out of selling their stakes at the lower price, they said.\n\nAt the top of the proposed range, the sale of a 5.5% stake would raise about \u20b9 24,300 crore, below the \u20b9 27,900 crore raised by Hyundai Motor India Ltd. in 2024 in the country\u2019s largest-ever IPO. That would peg the NSE IPO valuation at as much as \u20b9 4.42 lakh crore, compared with previously targeted \u20b9 5.26 lakh crore.\n\nNSE\u2019s decision to downsize the deal reflects unease over its valuation as growth slows and regulators step up scrutiny of stock-market activity. Options trading, a key driver of the exchange\u2019s success, has come under particular pressure, with the government doubling the transaction tax on some derivatives and proposing a higher short-term capital gains tax.\n\nAlso denting the sentiment around the industry, Indian stocks have been chronic under-performers. The benchmark Nifty 50 index is down 10% this year, compared with a 25% gain in the MSCI Emerging Markets Index.\n\n\u201cThe bar to win investors over has moved higher, not just for this IPO but for Indian equities more broadly after a year of underperforming many of its Asian peers,\u201d said Hebe Chen, a senior market analyst at Vantage Global Prime in Sydney. \u201cWeaker returns and persistent foreign outflows mean they now need a much stronger valuation argument before putting fresh money to work.", "source": "LiveMint Markets", "pub_date_str": "09 Sep 2026, 12:06 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Derivatives", "Portfolio Management"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Wheels India share price hits a 52-week high, jumps over 55% in just 6 sessions- Should you buy?", "full_content": "Wheels India's share price has been on a strong uptrend recently, defying weak stock market sentiment. On Wednesday, 9 September, Wheels India shares surged 15% to hit a 52-week high of \u20b9 2,417.70 during the session.\n\nThe stock is up for the sixth consecutive session. In this period, Wheels India share price has surged 57%. On a monthly scale, the stock is up 51% so far in September after a 10% rise in August.\n\nThe recent rise in the stock price can be attributed to the company's healthy financial results.\n\nIts Q1FY27 net profit rose to \u20b9 37 crore from \u20b9 26 crore in the corresponding quarter of the previous financial year.\n\nRevenue increased to \u20b9 1,386 crore from \u20b9 1,187 crore in the same quarter last year.\n\nExports during the quarter grew 17.3% to \u20b9 380 crore from \u20b9 324 crore in the same quarter last year.\n\n\"The company's sales grew along with the domestic market for cars, trucks, and agriculture tractor that continued their momentum post GST 2.0 reforms. We saw strong growth in the export of construction equipment wheels. We expect the growth momentum to continue in Q2,\" said Srivats Ram, CMD, Wheels India.\n\nAccording to technical experts, the stock's structure remains bullish, and a consolidation or a pullback would be healthy.", "source": "LiveMint Markets", "pub_date_str": "09 Sep 2026, 12:02 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Adani Enterprises shares jump as airport unit enters into $1 billion fundraising deal", "full_content": "Shares of Adani Enterprises rose nearly 5% Wednesday after its airport unit announced it had entered into a deal to raise about 98.25 billion rupees ($1 billion) from a group of global and domestic investors.\n\nThe binding agreement with Alpha Wave Global, Premji Invest, Temasek and BlackRock managed funds values Adani Airport Holdings at about $18 billion on a pre-money basis, according to the company statement .\n\nThe investors will subscribe to new shares in three tranches and collectively own about 5.54% of the airport operator after the final tranche, which is expected to be completed by July 2027. The deal remains subject to customary conditions and regulatory approvals.\n\nLatest fundraising follows Adani Enterprises' 150 billion rupee qualified institutional placement in July.\n\nThe investment marks an \"important milestone\" in building out the airports platform, with the company planning to continue investing in infrastructure, city-side developments and non-aeronautical businesses, said Jeet Adani, non-executive director at Adani Airport Holdings.\n\nCEO Arun Bansal said the company aims to become the world's largest airports platform, citing growth opportunities in India, rising consumer spending power and the expansion of its city-side developments.\n\nThe funds will support the expansion and modernization of airport infrastructure, accelerate the development of Adani Airport City projects and scale passenger-facing and other non-aeronautical businesses, including ground handling.\n\nThe investments are expected to increase capacity to serve about 200 million passengers annually, the company said.", "source": "CNBC Finance", "pub_date_str": "09 Sep 2026, 11:56 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Non-compliance notices issued to 15 Virtual Digital Asset service providers under PMLA", "full_content": "India's Financial Intelligence Unit issued notices to fifteen Virtual Digital Assets Service Providers. These firms operated without complying with anti-money laundering regulations in India. The Director of FIU-India also ordered the takedown of illegal applications and URLs. Fifteen firms were brought under the AML/CFT framework in March 2023. Virtual Digital Assets Service Providers must register with FIU-India and follow mandated obligations.", "source": "Economic Times Economy", "pub_date_str": "09 Sep 2026, 11:56 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "IFCI shares fall 4% on reports of lower price band for NSE IPO", "full_content": "IFCI shares fell sharply on Wednesday after reports suggested NSE could price its IPO below earlier indications and reduce the stake offered. The proposed price band of Rs 1,700\u20131,785 values NSE at around Rs 4.4 lakh crore. IFCI\u2019s indirect exposure to NSE through Stock Holding Corporation has put its shares under pressure.", "source": "Economic Times Markets", "pub_date_str": "09 Sep 2026, 11:45 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}], "updated_at": "09 Sep 2026, 01:09 PM IST", "total_stories": 365};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
