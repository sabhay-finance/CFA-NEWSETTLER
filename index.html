    const allData = {"general": [{"title": "Buying a \u20b91 crore house? Here's the monthly salary you need to afford the home loan EMI comfortably", "full_content": "Buying a \u20b9 1 crore house involves more than arranging the down payment and securing a home loan. Buyers also need to ensure that the monthly equated monthly instalment (EMI) does not eat into their household budget, emergency savings and long-term financial goals. While a lender may approve a substantial loan based on a borrower's income and credit profile, that does not necessarily mean the borrower can comfortably afford the repayment.\n\nFor a buyer making a 20% down payment of \u20b9 20 lakh, the remaining \u20b9 80 lakh would need to be financed through a home loan . At an illustrative interest rate of 8% a year over 20 years, the EMI would be approximately \u20b9 66,900 a month. To manage this repayment without putting other financial priorities under pressure, the buyer would ideally need a monthly take-home salary of around \u20b9 2.2\u20132.3 lakh, assuming no significant existing debt, said Sanjiv Bajaj, joint chairman and managing director of Bajaj Capital.\n\n\u201cThe first thing to look at is not just how much loan a bank is willing to offer, but how comfortably the buyer can repay it every month,\u201d Bajaj said.\n\nThe monthly income required to afford a \u20b9 1 crore property depends on the loan amount, interest rate, repayment tenure and the buyer's existing financial commitments. A longer tenure reduces the monthly EMI but increases the total interest paid over the life of the loan.\n\nFor an \u20b9 80 lakh home loan at an illustrative interest rate of 8% a year, the EMI varies significantly depending on the repayment tenure.\n\nBajaj recommends keeping the home loan EMI within 25-30% of monthly take-home income. This leaves room for routine household expenses, savings and unexpected financial needs.\n\nA shorter tenure helps borrowers repay the loan sooner and reduces the overall interest burden, but the higher EMI requires greater monthly income.", "source": "LiveMint Money", "pub_date_str": "11 Oct 2026, 12:43 PM IST", "pub_date_relative": "10m ago"}, {"title": "ET Alpha Wealth Summit 2.0: What do Shah Rukh Khan and SIFs have in common? Radhika Gupta explains", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a ET Alpha Wealth Summit 2.0: What do Shah Rukh Khan and SIFs have in common? Radhika Gupta explains The Economic Times daily newspaper is available online now. Read Today's Paper ET Alpha Wealth Summit 2.0: What do Shah Rukh Khan and SIFs have in common? Radhika Gupta explains SECTIONS ET Alpha Wealth Summit 2.0: What do Shah Rukh Khan and SIFs have in common? Radhika Gupta explains By Kshitij Anand , ETMarkets.com Last Updated: Oct 11, 2026, 12:40:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Edelweiss Mutual Fund MD and CEO Radhika Gupta says investors should approach Specialised Investment Funds (SIFs) with clear portfolio goals rather than chase new products or returns. Speaking at the ET Alpha Wealth Summit 2.0, she highlighted their tax efficiency, the importance of understanding derivatives-based strategies, and the need to assess risks, costs and realistic return expectations before investing.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "11 Oct 2026, 12:40 PM IST", "pub_date_relative": "12m ago"}, {"title": "NTPC invites industrial partners for 26% equity in co-generation projects", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a NTPC invites industrial partners for 26% equity in co-generation projects NTPC Share Price Adani Power Share Price JSW Energy Share Price NLC India Share Price Jaiprakash Power Ventures Share Price The Economic Times daily newspaper is available online now. Read Today's Paper NTPC invites industrial partners for 26% equity in co-generation projects SECTIONS NTPC invites industrial partners for 26% equity in co-generation projects ANI Last Updated: Oct 11, 2026, 12:32:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis NTPC Limited invited Expressions of Interest from commercial and industrial entities willing to invest 26 per cent equity in co-generation projects, according to the state-run power company.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "11 Oct 2026, 12:32 PM IST", "pub_date_relative": "21m ago"}, {"title": "Health insurance renewal: 5 key numbers you should review every year", "full_content": "Are you looking to renew your health insurance policy? Do you know that when renewing your health insurance policy, it is vital to recheck several fundamentals of your policy to ensure you are adequately protected, that the policy still adds meaningful value to your life, and that it provides the health protection you need?\n\nThis is because renewing health insurance involves more than just paying the premium before the due date. The individual health insurance policyholder should diligently review recent changes in medical costs, any amendments to policy terms, and their current financial condition and personal circumstances, as these factors, when taken holistically, can impact both the adequacy of individual coverage and the amount paid under a claim.\n\nTherefore, before renewing, keep these core fundamentals in mind and review 5 critical metrics/ numbers to determine whether your policy continues to provide adequate financial protection.\n\nThis metric determines the maximum coverage available to an individual. It is subject to policy terms and applicable limits. A cover that was adequate a few years ago might fall short today, as hospitalisation costs continue to rise. That is why you should review your coverage against potential treatment costs in your city and increase it if necessary.\n\nTo ensure a correct decision in individual cases, it is wise to seek guidance from a certified health professional and a financial advisor. This way, your policy decision will align with professional insights in a meaningful way.\n\nYou should also check and compare the renewable premium with last year\u2019s payment. See how it has changed and evolved. Premiums may also increase or change due to age-related pricing, insurer rate revisions, or changes in coverage.", "source": "LiveMint Money", "pub_date_str": "11 Oct 2026, 12:22 PM IST", "pub_date_relative": "30m ago"}, {"title": "9 penny stocks surged up to 315% in 6 months; 3 turned multibaggers", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News 9 penny stocks surged up to 315% in 6 months; 3 turned multibaggers Written by Ritesh Presswala , ETMarkets.com | Oct 11, 2026, 12:30:02 PM IST 1 / 10 \u200bTiny titans\u200b Over the last six months, nine penny stocks delivered returns ranging from 25% to 315%. The stocks were shortlisted using specific filters: a market capitalisation of less than Rs 1,000 crore, a share price below Rs 20, and a minimum latest trading volume of 5 lakh shares. These criteria helped identify low-priced, actively traded micro-cap stocks that recorded strong price momentum during the period. (Data Source: ACE Equity)", "source": "Economic Times Markets", "pub_date_str": "11 Oct 2026, 12:15 PM IST", "pub_date_relative": "37m ago"}, {"title": "Trump weighs renewed Iran strikes as Saudi airport attack kills 12", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Oct 2026, 12:12 PM IST", "pub_date_relative": "40m ago"}, {"title": "What changed inside India's insurance regulator?", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nWhen the Insurance Regulatory and Development Authority of India (Irdai) released its consultation paper on insurance distribution last month, I did not expect to find much to comment on. Much to my surprise, the data was remarkably candid and unusually granular. I found enough material to write two columns in a fortnight.\n\nOne used Irdai's benefits data to show that insurers pay five times as much because of policy surrenders as they do to the families of deceased policyholders. The second used complaints data to show that policyholders who complain and keep escalating win more often than insurers at every stage of the process. I have written about this industry\u2019s awful incentives for literally decades, but never expected to find vindication in data released by Irdai itself.\n\nThe media and social media have covered the commission caps proposed in the paper, but my question is different: how did such a candid document come to be?\n\nIf you turn to part 2, practically every page has numbers that Irdai has never published before. Here are just a few examples: individual insurers are named by code and ranked on cost. Individual banks are shown by how many insurers they have tied up with and what each tie-up costs.\n\nAt one point, we discover that group health insurance commissions touch 93% of premiums at some insurers. In the regulator's own words, this is \"unusual and counter-intuitive,\" since group schemes typically have lower claims and the corporate buyer should have bargaining power. Given its decades-long track record, Irdai did not write \"unusual and counter-intuitive\" about high costs by accident. This kind of comment shows that something has changed.\n\nTwo more interesting examples from the same document fit the same pattern. When a bank ties up with only one insurer, the average payout is 13% of new business premium.", "source": "LiveMint Money", "pub_date_str": "11 Oct 2026, 12:07 PM IST", "pub_date_relative": "45m ago"}, {"title": "Best defence stocks to buy: HAL, BEL, Azad among ICICI Securities\u2019 top picks ahead of Q2 2026 results", "full_content": "Private defence companies could outperform public sector undertakings (PSUs) in Q2 FY27, with select players expected to benefit from stronger execution, higher realisations and company-specific growth drivers. ICICI Securities remains constructive on Hindustan Aeronautics (HAL), Bharat Electronics (BEL) and Azad Engineering .\n\nThe Indian defence sector is likely to deliver mixed performance in the September quarter, with private-sector players expected to outpace their public-sector counterparts. While first-half execution has historically been weak, select private companies could report stronger-than-expected growth, partly supported by order execution spilling over from the June quarter.\n\nAccording to ICICI Securities\u2019 Q2 FY27 preview, most private defence companies are expected to post higher double-digit revenue growth, while PSU defence companies could report growth ranging from flat to the lower double digits. PSU margins may remain steady or contract amid changes in product mix and input cost pressures.\n\nExcluding outliers in its defence coverage, the brokerage expects average revenue growth of around 13% year-on-year in Q2 FY27. Zen Technologies, Solar Industries India and Azad Engineering are likely to stand out, with projected revenue growth of 55%, 52% and 30%, respectively.\n\nZen Technologies is expected to report strong execution, with revenue projected to rise 55% year-on-year and 90% sequentially in the September quarter. Solar Industries India could benefit from higher realisations in its international and defence businesses, supporting an estimated 52% revenue growth.\n\nAzad Engineering is expected to post 30% revenue growth, while its EBITDA could increase 34% year-on-year. Its margins are likely to remain elevated, partly aided by rupee depreciation.\n\nDynamatic Technologies is also expected to deliver a strong quarter, with EBITDA projected to grow around 31% year-on-year.", "source": "LiveMint Markets", "pub_date_str": "11 Oct 2026, 12:01 PM IST", "pub_date_relative": "52m ago"}, {"title": "F&O Talk: Nifty\u2019s break above 22,750 could open doors for 23,000; Sudeep Shah picks 5 stocks for next week", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics rending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets .", "source": "Economic Times Markets", "pub_date_str": "11 Oct 2026, 11:44 AM IST", "pub_date_relative": "1h ago"}, {"title": "World Bank in talks with dozens of countries about crisis aid, Banga says", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Oct 2026, 11:42 AM IST", "pub_date_relative": "1h ago"}, {"title": "UPI MDR Charges: Will consumer prices rise at stores if merchants start paying a nominal fee? Govt answers", "full_content": "The central government announced in September that it would end more than six years of zero-fee UPI usage by introducing a 0.4% surcharge on merchant transactions above \u20b9 2,000, capped at \u20b9 300 for payments of \u20b9 75,000 and above.\n\nThe decision led to immediate pushback from local business owners, who argued that the extra charge could eat into their margins on products and services.\n\nThe UPI network powers payments for more than 500 million consumers purchasing everyday items, from street tea and food to smartphones and home appliances, across Asia's third-largest market.\n\nWhile the government has assured consumers that UPI transactions will remain free, as they have been so far, concerns persist that merchants may pass on the additional charge to buyers. This could eventually push up the cost of everyday essentials and other products as well as services.\n\nThe National Payments Corporation of India (NPCI), which facilitates services such as UPI payments, has responded to concerns that MDR on high-value UPI transactions could lead merchants to increase prices of products and services, potentially passing on the additional cost to consumers.\n\nIn its FAQs document published last month, it noted that market dynamics and historical payment trends show that merchants absorb nominal digital processing costs to drive higher business volume.\n\n\u201cPayment acceptance costs are considered standard operational overheads that are offset by increased footfall, higher average ticket values, and reduced cash-handling risks,\u201d the FAQ's response read.\n\nAs the proposed UPI MDR is much lower than credit card fees and applies only above specific transaction thresholds, shopkeepers have no economic incentive to inflate retail shelf prices, the payments corporation noted, assuring consumers they will continue paying the exact listed price for goods and services.", "source": "LiveMint Money", "pub_date_str": "11 Oct 2026, 11:41 AM IST", "pub_date_relative": "1h ago"}, {"title": "8 emerging markets to consider in 2027: HSBC", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Oct 2026, 11:39 AM IST", "pub_date_relative": "1h ago"}, {"title": "India\u2019s rupee defence raises question of how far RBI will go", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a India\u2019s rupee defence raises question of how far RBI will go The Economic Times daily newspaper is available online now. Read Today's Paper India\u2019s rupee defence raises question of how far RBI will go SECTIONS India\u2019s rupee defence raises question of how far RBI will go By Subhadip Sircar and Bhaskar Dutta , Bloomberg Last Updated: Oct 11, 2026, 11:29:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Reserve Bank of India implemented strong measures to stabilise the rupee as external pressures intensify. This includes opening a dollar window for state-owned oil refiners and introducing a new reserve requirement for foreign-exchange derivatives. Analysts expect the rupee ME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a India has the hair, China has the wigs: Inside a $940 million trade The Economic Times daily newspaper is available online now. Read Today's Paper India has the hair, China has the wigs: Inside a $940 million trade SECTIONS India has the hair, China has the wigs: Inside a $940 million trade By Shantanu Nandan Sharma , ET Bureau Last Updated: Oct 11, 2026, 11:00:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Indian hair has emerged as a sought-after commodity on the international stage, prized for its vibrant hues and high quality. Yet, the country is encountering significant challenges due to the smuggling of raw hair to China, creating a shortage. The market for processed hair, essential for wigs and extensions, remains limited in India.\n\nWhat is the real impact of 13x jump in cash transfers to women?\n\nThe NBFC saga - Part 2: Line drawn in 2006 is reason for the headlines today\n\nAirlines Q2 turbulence: Fewer passengers, rising fares and a crude shock\n\nBritannia\u2019s next big bet for young India lies beyond biscuits\n\nThe world is witnessing a bond rout. Why should it matter to you?\n\nQ2 earnings season: Will it settle or add to confusion in the stock market?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "11 Oct 2026, 11:00 AM IST", "pub_date_relative": "1h ago"}, {"title": "US hits commercial tanker in Gulf of Oman as tensions flare", "full_content": "The ship tried to break through America\u2019s naval blockade of Iranian ports, Central Command says of its first attack in a month", "source": "FT Markets", "pub_date_str": "11 Oct 2026, 10:56 AM IST", "pub_date_relative": "1h ago"}, {"title": "HCL Tech Q2 Preview: Will the IT major narrow its guidance? 5 things to watch out for", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a Earnings \u203a HCL Tech Q2 Preview: Will the IT major narrow its guidance? 5 things to watch out for JM Financial Share Price Choice International Share Price IIFL Capital Services Share Price Anand Rathi Share & Stock Brokers Share Price SMC Global Securities Share Price The Economic Times daily newspaper is available online now. Read Today's Paper HCL Tech Q2 Preview: Will the IT major narrow its guidance? 5 things to watch out for SECTIONS HCL Tech Q2 Preview: Will the IT major narrow its guidance? 5 things to watch out for By Akash Podishetti , ETMarkets.com Last Updated: Oct 11, 2026, 10:54:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis HCL Tech is set to announce its September quarter results on October 12, with brokerages expecting 12% year-on-year profit growth and 16% revenue growth. Acquisitions, deal ramp-ups and seasonal strength are likely to support performance. Investors will track FY27 revenue guidance, margin trends, discretionary spending, deal wins and AI-led pricing pressures for clues on the company\u2019s growth outlook.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "11 Oct 2026, 10:54 AM IST", "pub_date_relative": "1h ago"}, {"title": "Nifty target: 27,000 in 1-year - Why Emkay stock market experts are bullish despite poor performance", "full_content": "The Nifty 50 could rally 20% to 27,000 by September 2027, according to Emkay Global Financial Services , which remains constructive on Indian equities despite a prolonged market correction, elevated crude oil prices and global uncertainties.\n\nThe domestic benchmark indices rose on Friday, 9 October, snapping their longest weekly losing streak in 25 years, although gains remained modest amid concerns over tighter monetary policy and rising crude oil prices. The Nifty 50 climbed 1.3% to 22,520.45, while the BSE Sensex advanced 1.23% to 72,472.33, led by IT stocks after Tata Consultancy Services' quarterly earnings highlighted growing AI-related revenue contributions and robust international business growth.\n\nDespite Friday's rebound, the Nifty 50 declined for eight consecutive weeks, falling 8.7% over the period.\n\nAgainst this backdrop, Emkay sees scope for a recovery as resilient corporate earnings, reasonable valuations and strong domestic fundamentals support the market. The brokerage has set a September 2027 target of 27,000 for the Nifty 50, implying an upside of around 20% at a valuation of 18.8 times one-year forward earnings.\n\nEmkay expects earnings growth to remain healthy in the September quarter, even as geopolitical tensions, trade uncertainty and elevated developed-market bond yields weigh on investor sentiment.\n\nThe brokerage estimates that companies under its coverage will report 24.8% year-on-year revenue growth and 21.5% adjusted profit growth in Q2 FY27. Energy, utilities and automobiles are expected to lead revenue growth.\n\nFor the Nifty 50, excluding banking, financial services and insurance (BFSI), Emkay expects revenue to grow 28% year-on-year and profit after tax (PAT) to rise 21.6%.\n\nIndustrials are expected to lead sectoral earnings growth, with PAT projected to rise 78.7%, followed by metals and mining at 74.9%. Utilities and automobiles are also expected to deliver strong growth, with projected PAT increases of 42.6% and 41.2%, respectively.", "source": "LiveMint Markets", "pub_date_str": "11 Oct 2026, 10:51 AM IST", "pub_date_relative": "2h ago"}, {"title": "US May Consider Direct Intervention in Saudi-Houthi Conflict After Riyadh Airport Strike: What Trump Said", "full_content": "Trump said the US may join Saudi-led strikes against Yemen\u2019s Houthis after a missile hit Riyadh\u2019s King Khalid International Airport, injuring several people and escalating regional tensions. No final decision has been announced.", "source": "NDTV Profit", "pub_date_str": "11 Oct 2026, 10:50 AM IST", "pub_date_relative": "2h ago"}, {"title": "Thai Bourse Revises Short-Selling, High-Frequency Trading Rules", "full_content": "(Bloomberg) -- Thailand\u2019s stock exchange will roll out revised rules from Nov. 16, including changes to short-selling and high-frequency trading, as it seeks to improve market stability, liquidity and investor confidence, according to a filing.\n\nThe Stock Exchange of Thailand will allow stocks priced between 5 baht (15 US cents) and 50 baht to trade in smaller price increments, a move aimed at narrowing bid-ask spreads and reducing trading costs, according to the statement.\n\nThe bourse will also limit short selling to more liquid securities, including SET100 shares, underlying securities of single-stock futures, depositary receipts and exchange-traded funds.\n\nUnder the new rules, investors will be allowed to short-sell a security at a value equal to or higher than its latest traded price. The SET will also impose additional fees on accounts that submit large numbers of orders but execute relatively few trades.\n\nThe exchange will also scrap dynamic price bands, which limit how far individual securities can move within a certain period, for individual securities to reduce trading barriers; cut restrictions on what high-frequency traders can buy and sell; and get rid of minimum resting-time requirements to improve order-management efficiency.\n\nThe SET will also extend morning hours for transactions in derivative warrants and ETFs linked to foreign securities from Nov. 16. Trading will start at 8 a.m., two hours earlier than at present, and closing times will remain unchanged, according to a separate filing.\n\nThe new measures were approved by Thailand\u2019s Securities and Exchange Commission following a public consultation, the SET said.\n\nCatch all the Business News , Market News , Breaking News Events and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.", "source": "LiveMint Markets", "pub_date_str": "11 Oct 2026, 10:46 AM IST", "pub_date_relative": "2h ago"}, {"title": "Adani Cement Marks Navratri With A 15,000-Bag Aerial Tribute To Maa Durga", "full_content": "Adani Cement created a 70x70 ft aerial tribute to Maa Durga using 15,000 cement bags at its Kymore plant, symbolizing strength and trust in its Navratri and Durga Puja 2026 campaign.", "source": "NDTV Profit", "pub_date_str": "11 Oct 2026, 10:46 AM IST", "pub_date_relative": "2h ago"}, {"title": "Car loan rates start at 7.35%: Check EMIs and processing fees of 18 lenders", "full_content": "A car loan can help a borrower spread the cost of a vehicle over several years. Still, interest rates and other expenses can affect the overall cost of borrowing. This makes it vital for aspiring car loan applicants to diligently compare lending institutions on aspects such as interest rates, equated monthly instalment (EMI), and processing charges.\n\nSuch an approach can go a long way in helping borrowers acknowledge and understand the overall cost before applying. It can also assist in better financial planning and towards devising a strategic approach towards car loan EMI repayments.\n\nAs per the data compiled by Paisabazaar , car loan interest rates among 18 lending institutions begin from 7.35% per annum. UCO Bank, for example, has the lowest starting rate. This is followed by other prominent lending institutions such as Maharashtra Bank and Canara Bank, both offering car lorates starting at 7.45%.\n\nFor a simple example, on a \u20b9 5 lakh car loan for 5 years, the EMI at UCO Bank ranges primarily from \u20b9 9,983 to \u20b9 10,624 depending on the applicable interest rate. On similar lines, at Bank of Maharashtra, the EMI ranges from \u20b9 10,007 to \u20b9 11,059. Keeping in mind these fundamentals, the complete list is discussed below:\n\nIt is vital to note that the interest rate range varies widely across lending institutions. Punjab and Sindh Bank has the widest range in the table, from 7.55% to 14.05%, whereas Bank of India charges between 7.60% and 12.55%. Hence, borrowers should note that the final interest rate offered may depend on factors such as their credit profile , loan amount, tenure, and lender-specific eligibility criteria.\n\nThe applicable processing fee is yet another vital aspect that requires proper consideration. The Central Bank of India and Indian Overseas Bank have nil processing fees. Whereas, UCO Bank charges about 0.5%, subject to a maximum of \u20b9 5,000.", "source": "LiveMint Money", "pub_date_str": "11 Oct 2026, 10:41 AM IST", "pub_date_relative": "2h ago"}, {"title": "Delhi CJP Protests: Abhijeet Dipke, Saurav Das, Ashutosh Ranka Released By Court On Second Day", "full_content": "The preventive arrests of the three CJP leaders happened on the second day of the planned protest against CEC Gyanesh Kumar over alleged irregularities in the voter roll cleanup exercise SIR.", "source": "NDTV Profit", "pub_date_str": "11 Oct 2026, 10:32 AM IST", "pub_date_relative": "2h ago"}, {"title": "AI may change the price of your Big Mac and groceries \u2014 what this means for shoppers", "full_content": "Fast-food giants and supermarkets are rolling out a range of AI tools that could affect the prices shoppers pay, but experts warn the spread of data-driven tools could make personalized pricing easier to deploy.\n\nJust this week, a federal antitrust lawsuit filed against McDonald's alleged the fast food giant uses an AI-powered \"pricing engine\" to set menu prices across U.S. locations and overcharge customers for Big Macs and fries.\n\nMcDonald's has denied that it's using AI to determine what individual customers are willing to pay and said it provides its franchisees with \"tools, resources, research and recommendations to help them make informed decisions.\"\n\nEven so, food businesses globally are increasingly digitizing operations with AI. Earlier this year, American grocery chain Kroger said it's using an AI platform called FlashFood to mark down perishables nearing the end of their shelf life and marketing them to shoppers via an app.\n\nMeanwhile, electronic shelf labels (ESLs), which display the price of items in store on digital screens, are becoming increasingly popular at supermarkets like Kroger, Amazon Fresh, Walmart , and Whole Foods.\n\nThe technology is also gaining traction among U.K. supermarkets such as Tesco , Morrisons, and Asda. More recently, global financial platform Revolut trialed facial recognition checkout in select coffee shops, allowing customers to pay with just a glance.\n\nCNBC reached out to Amazon Fresh, Whole Foods, Tesco, Morrisons, Asda and Revolut for comment on the use of AI but didn't immediately hear back.\n\nAs AI use becomes normalized among retailers, experts warn that this could lead to more dynamic pricing, which refers to frequent, rapid real-time changes in prices that could dramatically affect shoppers' experiences.", "source": "CNBC World Economy", "pub_date_str": "11 Oct 2026, 10:30 AM IST", "pub_date_relative": "2h ago"}, {"title": "Retirement corpus can't be treated as monthly income for maintenance, Delhi High Court clarifies in matrimonial dispute", "full_content": "Retirement savings cannot be treated as a substitute for monthly income when courts decide maintenance claims, the Delhi High Court has clarified. While the accumulated retirement corpus may be considered when assessing a person's overall financial resources, only the interest and other returns actually generated from investments can be counted as recurring income.\n\nIn its 8 October judgment in Meenakshi Batra v. Vijay Kumar Batra, a Division Bench of Justices Vivek Chaudhary and Renu Bhatnagar said a retired person cannot be expected to consume accumulated retirement savings simply because the corpus is substantial. However, the court also made clear that having savings does not automatically disqualify a spouse from claiming maintenance.\n\nThe ruling came while the court dismissed an appeal filed by a retired Central government teacher seeking interim maintenance from her husband, a retired Army officer, during matrimonial proceedings. The court found that the woman had sufficient independent income and financial resources to meet her reasonable needs while the proceedings were pending.\n\nThe dispute arose after the Family Court in Delhi rejected the wife's application for interim maintenance in April 2022. It had noted that both spouses were retired government employees receiving pensions and had sufficient financial resources to support themselves.\n\nThe wife challenged the order, arguing that the Family Court had treated her retirement benefits and savings as a continuing source of income without properly assessing her expenses and the husband's financial position.\n\nThe High Court said the distinction between accumulated capital and income generated from that capital was important when assessing a maintenance claim.\n\n\"The retirement corpus is accumulated capital,\" the court observed, adding that it could not be treated as monthly income merely because the amount was substantial.", "source": "LiveMint Money", "pub_date_str": "11 Oct 2026, 10:22 AM IST", "pub_date_relative": "2h ago"}, {"title": "Dhruv Rathee Released From Detention, Police Says Can Be Detained Again", "full_content": "Dhruv Rathee was detained from his residence in Gurugram's Sector 56 on Saturday as police stepped up security across the national capital to prevent protesters from reaching Jantar Mantar.", "source": "NDTV Profit", "pub_date_str": "11 Oct 2026, 10:21 AM IST", "pub_date_relative": "2h ago"}, {"title": "US green-card programme suspension: What happens to your 401(k), stocks and property if you return to India?", "full_content": "The Trump administration on Thursday suspended several technology giants and IT outsourcing companies, including Microsoft, Infosys, Cognizant, Tata, Wipro, HCL Technologies, Capgemini and Adobe, from the US government's permanent labour certification programme or PERM.\n\nPERM is an important route through which employers sponsor eligible foreign workers for permanent residency in the United States. The suspension does not automatically revoke existing H-1b visas, but it could disrupt the green-card pathway for workers whose applications are affected.\n\n\u201cLegally, there is presently no prohibition on these companies employing foreign workers in the United States on otherwise valid H-1b visas . What has been suspended is the PERM process, which, for a large category of employees, is a crucial step in moving from temporary employment status towards permanent residency,\u201d said Siddharth Batra, Advocate at the Supreme Court of India.\n\nIndian tech professionals on a H-1b visa could face disruptions in securing permanent residency through employer sponsorship, but the longer-term impact will depend on how long the suspensions remain in place and how the US government handles affected applications.\n\nAn H-1b visa allows foreign workers to stay in the US for up to six years, with an initial period of up to three years and an extension of up to another three years.\n\nApart from the 6-year validity, an additional one-year extension is available if a qualifying PERM or I-140 was filed at least 365 days before the extension would begin. These can even be filings made by a previous employer, said two experts who spoke to Livemint .\n\nIn case, the suspension forces an Indian worker to return home, they may still have to manage their US retirement accounts, tax obligations investments and property from India. Here's how they can do it.\n\nLeaving the United States does not by itself require closing a 401(k), the retirement savings account most US employers offer.", "source": "LiveMint Money", "pub_date_str": "11 Oct 2026, 10:06 AM IST", "pub_date_relative": "2h ago"}, {"title": "Anthropic Reveals Claude AI Model Went Rogue, Submitted Fake Tip To Police In Homicide Case", "full_content": "In one example of the improper behavior it found, Anthropic said its Claude Haiku 4.5 model submitted a tip to a local police department about a homicide.", "source": "NDTV Profit", "pub_date_str": "11 Oct 2026, 10:00 AM IST", "pub_date_relative": "2h ago"}, {"title": "India expanding trade footprint to strengthen global ties and empower MSMEs: Piyush Goyal", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a India expanding trade footprint to strengthen global ties and empower MSMEs: Piyush Goyal The Economic Times daily newspaper is available online now. Read Today's Paper India expanding trade footprint to strengthen global ties and empower MSMEs: Piyush Goyal SECTIONS India expanding trade footprint to strengthen global ties and empower MSMEs: Piyush Goyal ANI Last Updated: Oct 11, 2026, 10:23:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India is increasing its network of free trade agreements (FTAs) to integrate deeply with global economies. Nine trade pacts covering 38 developed economies have been concluded in the past four and a half years. The trade pacts are not merely confined to bureacratic corridors but also include discussions with stakeholders. India is wrapping up deals with Canada and UK while pursuing energy deals with GCC and trade relations in West Asia and Americas.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\nWhat is the real impact of 13x jump in cash transfers to women?\n\nThe NBFC saga - Part 2: Line drawn in 2006 is reason for the headlines today\n\nAirlines Q2 turbulence: Fewer passengers, rising fares and a crude shock\n\nBritannia\u2019s next big bet for young India lies beyond biscuits\n\nThe world is witnessing a bond rout. Why should it matter to you?\n\nQ2 earnings season: Will it settle or add to confusion in the stock market?", "source": "Economic Times Economy", "pub_date_str": "11 Oct 2026, 09:59 AM IST", "pub_date_relative": "2h ago"}, {"title": "IPO calendar: After a week of lull, 5 companies to raise nearly Rs 1,600 crore this week", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a IPO calendar: After a week of lull, 5 companies to raise nearly Rs 1,600 crore this week The Economic Times daily newspaper is available online now. Read Today's Paper IPO calendar: After a week of lull, 5 companies to raise nearly Rs 1,600 crore this week SECTIONS IPO calendar: After a week of lull, 5 companies to raise nearly Rs 1,600 crore this week By Akash Podishetti , ETMarkets.com Last Updated: Oct 11, 2026, 10:26:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Five IPOs are scheduled to open for subscription next week, including mainboard issues from HD Fire Protect, Fusion CX and Sahajanand Medical Technologies. The three mainboard offerings span fire protection, customer experience and medical devices, alongside two SME issues.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "11 Oct 2026, 09:54 AM IST", "pub_date_relative": "2h ago"}, {"title": "Apple\u2019s Chinese supplier Luxshare downplays impact of U.S. patent probe", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Oct 2026, 09:52 AM IST", "pub_date_relative": "3h ago"}, {"title": "Adani Power shares up 27% in 2026 but Elara sees 16% more upside - What\u2019s powering stock? Target price", "full_content": "Adani Power shares have gained 27% so far in 2026, and domestic brokerage Elara Capital has initiated coverage on the stock with an \u2018Accumulate\u2019 rating and a target price of \u20b9 220, implying an upside of over 16% from its closing price of \u20b9 189 on the BSE on Friday, 9 October.\n\nIn its coverage initiation report, Elara Capital said the company offers strong medium-term growth visibility, supported by a substantial capacity expansion pipeline, increasing long-term power purchase agreement (PPA) coverage and opportunities in the merchant power market. However, the brokerage cautioned that much of the company's growth potential is already reflected in its current valuation.\n\nElara Capital has set its target price at \u20b9 220, based on 12 times its estimated FY29 enterprise value-to-EBITDA (EV/EBITDA).\n\nHowever, Adani Power shares have remained under pressure in the near term, declining 4.04% over the past week and 6.90% over two weeks. The stock has fallen 11.89% in the past month and 12.62% over the last three months, indicating sustained weakness in recent trading.\n\nElara Capital believes thermal power will continue to play a crucial role in India's power system over the near- to medium-term by providing reliable, dispatchable baseload electricity to complement the growing share of renewable energy.\n\nThe brokerage noted that the intermittent nature of renewable energy, transmission constraints and increasing grid-balancing requirements reinforce the need for dependable thermal generation. Battery energy storage systems and pumped storage are also expected to play a complementary role as renewable energy penetration rises.\n\nAgainst this backdrop, coal-based power is likely to remain important for India's energy security.", "source": "LiveMint Markets", "pub_date_str": "11 Oct 2026, 09:44 AM IST", "pub_date_relative": "3h ago"}, {"title": "DOJ Probes TV Networks Over White House Coverage Decisions", "full_content": "The Justice Department is investigating CNN, NBC, CBS, Fox, and ABC over a boycott of White House coverage after Trump barred several news outlets from access.", "source": "NDTV Profit", "pub_date_str": "11 Oct 2026, 09:43 AM IST", "pub_date_relative": "3h ago"}, {"title": "Income tax on gold jewellery: ITAT says CBDT limits cannot cap family holdings, deletes \u20b920.45 lakh addition", "full_content": "Families may accumulate gold jewellery over decades through weddings, inheritance and gifts. When the Income Tax Department finds jewellery during a search, the absence of old purchase bills can make it difficult to establish when and how the gold was acquired.\n\nIn a ruling involving Ankur Sharma, the Delhi bench of the Income Tax Appellate Tribunal (ITAT) held that the tax department cannot mechanically restrict the quantity of jewellery accepted as explained to the limits mentioned in Central Board of Direct Taxes (CBDT) instructions. The tribunal deleted a \u20b9 20.45 lakh addition to Sharma\u2019s taxable income after considering the family\u2019s financial circumstances and income-tax returns.\n\nThe order was pronounced on 6 October 2023 in ITA No. 1843/Del/2022 for assessment year 2019-20. It concerned gold jewellery worth \u20b9 1.46 crore found at the family\u2019s residence in Ghaziabad during an income-tax search.\n\nDuring the search, officials found 3,877.5 grams of gold jewellery valued at \u20b9 1.46 crore at the family\u2019s residence. The family explained that the jewellery had accumulated over generations and included gold inherited by the father, jewellery received at weddings and gifts given during family ceremonies.\n\nThe assessing officer accepted 2,250 grams of jewellery for nine family members, applying the quantities referred to in CBDT Instruction No. 1916, dated 11 May 1994, and a CBDT press release issued on 1 December 2016.\n\nThe remaining 1,627.5 grams, valued at \u20b9 61.35 lakh, was treated as unexplained jewellery. The officer divided the amount equally among Sharma, his father and his brother, adding \u20b9 20.45 lakh to each person\u2019s income.\n\nThe addition to Sharma\u2019s income was made under Section 69A read with Section 115BBE of the Income-tax Act, 1961.", "source": "LiveMint Money", "pub_date_str": "11 Oct 2026, 09:42 AM IST", "pub_date_relative": "3h ago"}, {"title": "Delhi CJP Protests: Abhijeet Dipke, Two Others Under Preventive Arrest Before Second Day Of Protest", "full_content": "Delhi Police placed CJP leaders Abhijeet Dipke, Saurav Das and Ashutosh Ranka under preventive arrest ahead of Jantar Mantar protests demanding CEC Gyanesh Kumar\u2019s resignation over alleged voter-list irregularities. Organisers vowed to continue the agitation.", "source": "NDTV Profit", "pub_date_str": "11 Oct 2026, 09:40 AM IST", "pub_date_relative": "3h ago"}, {"title": "Middle East war, high debt levels to dominate IMF-World Bank meetings in Bangkok", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Oct 2026, 09:36 AM IST", "pub_date_relative": "3h ago"}, {"title": "Houthi Strike On Riyadh Airport Leaves 12 Dead, Over 300 Injured; Operations Suspended", "full_content": "The attack has added to concerns about the safety of civilian aviation in the region, with several Western diplomatic missions advising their citizens to avoid Riyadh airport.", "source": "NDTV Profit", "pub_date_str": "11 Oct 2026, 09:35 AM IST", "pub_date_relative": "3h ago"}, {"title": "Private equity can cut \u2018best\u2019 deals in current climate, says Permira boss", "full_content": "Lower valuations and reduced competition should help sector to \u2018exceptional returns\u2019, says Dipan Patel", "source": "FT Markets", "pub_date_str": "11 Oct 2026, 09:30 AM IST", "pub_date_relative": "3h ago"}, {"title": "JPMorgan bets on European asset management growth", "full_content": "Patrick Thomson, who heads the bank\u2019s asset management business in Europe, said he was \u2018bullish on the UK\u2019", "source": "FT Markets", "pub_date_str": "11 Oct 2026, 09:30 AM IST", "pub_date_relative": "3h ago"}, {"title": "Green Card Freeze? Infosys Shrugs Off US PERM Suspension, Sees No Material Blow: Here's Why", "full_content": "Infosys said the US Department of Labour's suspension of certain Permanent Labor Certification applications will not materially impact the company and it is ready to cooperate with authorities.", "source": "NDTV Profit", "pub_date_str": "11 Oct 2026, 09:24 AM IST", "pub_date_relative": "3h ago"}, {"title": "Musk says Terrafab chip factory could outperform rivals despite challenges", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Oct 2026, 09:07 AM IST", "pub_date_relative": "3h ago"}, {"title": "Company FD rates: Muthoot Capital, Manipal Housing offer up to 8.95%; check the rates offered by 10 firms", "full_content": "Company fixed deposits (FDs) also known as Corporate Fixed deposits, can provide investors with meaningful fixed returns over a predetermined period. Still, it is vital to note that company fixed deposits carry issuer-specific credit and liquidity risks. This makes it important for aspiring investors to carefully analyse and assess more than just the headline interest rate before investing.\n\nAs per data compiled by Paisabazaar, Muthoot Capital Services offers the highest interest rate among prominent financial institutions. The firm is offering 8.95% per annum for a 3-year (i.e., 36-month) deposit. On similar lines, Manipal Housing Finance Syndicate offers up to 8%, whereas Bajaj Finance offers up to 7.75%. With these essentials in mind, let us take a look at the detailed table.\n\nMuthoot Capital Services offers the highest rate in the table at 8.95% for a three-year deposit. Its rates for one-year and five-year deposits stand at 7.90% and 8.50%, respectively. Manipal Housing Finance Syndicate offers 8% for one-, two- and three-year deposits.\n\nBajaj Finance offers 7.75% for deposits with tenures ranging from 31 to 60 months. Shriram Finance offers 7.50% for three- to five-year deposits , while Can Fin Homes offers the same rate for a 36-month tenure.\n\nSenior citizen investors generally receive an additional 0.25-0.50 percentage point over the applicable regular interest rate. Shriram Finance offers an additional 0.50%, while Sundaram Home Finance and Can Fin Homes offer up to 0.50%, depending on the applicable terms.\n\nShriram Finance also provides an additional 0.05% per annum for aspiring women investors and 0.15% per annum on eligible renewals of matured deposits, as per the compiled data.", "source": "LiveMint Money", "pub_date_str": "11 Oct 2026, 09:05 AM IST", "pub_date_relative": "3h ago"}, {"title": "Elon Musk Slams Mukesh Ambani's Backers Over 'Absurd Hypocrisy' As Starlink Feud Escalates", "full_content": "Musk argued that if, indeed, Starlink's services were too expensive in India, consumers would not buy them, forcing the company to make its pricing affordable.", "source": "NDTV Profit", "pub_date_str": "11 Oct 2026, 08:41 AM IST", "pub_date_relative": "4h ago"}], "cfa": [{"title": "Buying a \u20b91 crore house? Here's the monthly salary you need to afford the home loan EMI comfortably", "full_content": "Buying a \u20b9 1 crore house involves more than arranging the down payment and securing a home loan. Buyers also need to ensure that the monthly equated monthly instalment (EMI) does not eat into their household budget, emergency savings and long-term financial goals. While a lender may approve a substantial loan based on a borrower's income and credit profile, that does not necessarily mean the borrower can comfortably afford the repayment.\n\nFor a buyer making a 20% down payment of \u20b9 20 lakh, the remaining \u20b9 80 lakh would need to be financed through a home loan . At an illustrative interest rate of 8% a year over 20 years, the EMI would be approximately \u20b9 66,900 a month. To manage this repayment without putting other financial priorities under pressure, the buyer would ideally need a monthly take-home salary of around \u20b9 2.2\u20132.3 lakh, assuming no significant existing debt, said Sanjiv Bajaj, joint chairman and managing director of Bajaj Capital.\n\n\u201cThe first thing to look at is not just how much loan a bank is willing to offer, but how comfortably the buyer can repay it every month,\u201d Bajaj said.\n\nThe monthly income required to afford a \u20b9 1 crore property depends on the loan amount, interest rate, repayment tenure and the buyer's existing financial commitments. A longer tenure reduces the monthly EMI but increases the total interest paid over the life of the loan.\n\nFor an \u20b9 80 lakh home loan at an illustrative interest rate of 8% a year, the EMI varies significantly depending on the repayment tenure.\n\nBajaj recommends keeping the home loan EMI within 25-30% of monthly take-home income. This leaves room for routine household expenses, savings and unexpected financial needs.\n\nA shorter tenure helps borrowers repay the loan sooner and reduces the overall interest burden, but the higher EMI requires greater monthly income.", "source": "LiveMint Money", "pub_date_str": "11 Oct 2026, 12:43 PM IST", "pub_date_relative": "10m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "ET Alpha Wealth Summit 2.0: What do Shah Rukh Khan and SIFs have in common? Radhika Gupta explains", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a ET Alpha Wealth Summit 2.0: What do Shah Rukh Khan and SIFs have in common? Radhika Gupta explains The Economic Times daily newspaper is available online now. Read Today's Paper ET Alpha Wealth Summit 2.0: What do Shah Rukh Khan and SIFs have in common? Radhika Gupta explains SECTIONS ET Alpha Wealth Summit 2.0: What do Shah Rukh Khan and SIFs have in common? Radhika Gupta explains By Kshitij Anand , ETMarkets.com Last Updated: Oct 11, 2026, 12:40:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Edelweiss Mutual Fund MD and CEO Radhika Gupta says investors should approach Specialised Investment Funds (SIFs) with clear portfolio goals rather than chase new products or returns. Speaking at the ET Alpha Wealth Summit 2.0, she highlighted their tax efficiency, the importance of understanding derivatives-based strategies, and the need to assess risks, costs and realistic return expectations before investing.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "11 Oct 2026, 12:40 PM IST", "pub_date_relative": "12m ago", "cfa_topics": ["Equity Investments", "Derivatives", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "NTPC invites industrial partners for 26% equity in co-generation projects", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a NTPC invites industrial partners for 26% equity in co-generation projects NTPC Share Price Adani Power Share Price JSW Energy Share Price NLC India Share Price Jaiprakash Power Ventures Share Price The Economic Times daily newspaper is available online now. Read Today's Paper NTPC invites industrial partners for 26% equity in co-generation projects SECTIONS NTPC invites industrial partners for 26% equity in co-generation projects ANI Last Updated: Oct 11, 2026, 12:32:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis NTPC Limited invited Expressions of Interest from commercial and industrial entities willing to invest 26 per cent equity in co-generation projects, according to the state-run power company.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "11 Oct 2026, 12:32 PM IST", "pub_date_relative": "21m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "9 penny stocks surged up to 315% in 6 months; 3 turned multibaggers", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News 9 penny stocks surged up to 315% in 6 months; 3 turned multibaggers Written by Ritesh Presswala , ETMarkets.com | Oct 11, 2026, 12:30:02 PM IST 1 / 10 \u200bTiny titans\u200b Over the last six months, nine penny stocks delivered returns ranging from 25% to 315%. The stocks were shortlisted using specific filters: a market capitalisation of less than Rs 1,000 crore, a share price below Rs 20, and a minimum latest trading volume of 5 lakh shares. These criteria helped identify low-priced, actively traded micro-cap stocks that recorded strong price momentum during the period. (Data Source: ACE Equity)", "source": "Economic Times Markets", "pub_date_str": "11 Oct 2026, 12:15 PM IST", "pub_date_relative": "37m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "What changed inside India's insurance regulator?", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nWhen the Insurance Regulatory and Development Authority of India (Irdai) released its consultation paper on insurance distribution last month, I did not expect to find much to comment on. Much to my surprise, the data was remarkably candid and unusually granular. I found enough material to write two columns in a fortnight.\n\nOne used Irdai's benefits data to show that insurers pay five times as much because of policy surrenders as they do to the families of deceased policyholders. The second used complaints data to show that policyholders who complain and keep escalating win more often than insurers at every stage of the process. I have written about this industry\u2019s awful incentives for literally decades, but never expected to find vindication in data released by Irdai itself.\n\nThe media and social media have covered the commission caps proposed in the paper, but my question is different: how did such a candid document come to be?\n\nIf you turn to part 2, practically every page has numbers that Irdai has never published before. Here are just a few examples: individual insurers are named by code and ranked on cost. Individual banks are shown by how many insurers they have tied up with and what each tie-up costs.\n\nAt one point, we discover that group health insurance commissions touch 93% of premiums at some insurers. In the regulator's own words, this is \"unusual and counter-intuitive,\" since group schemes typically have lower claims and the corporate buyer should have bargaining power. Given its decades-long track record, Irdai did not write \"unusual and counter-intuitive\" about high costs by accident. This kind of comment shows that something has changed.\n\nTwo more interesting examples from the same document fit the same pattern. When a bank ties up with only one insurer, the average payout is 13% of new business premium.", "source": "LiveMint Money", "pub_date_str": "11 Oct 2026, 12:07 PM IST", "pub_date_relative": "45m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Best defence stocks to buy: HAL, BEL, Azad among ICICI Securities\u2019 top picks ahead of Q2 2026 results", "full_content": "Private defence companies could outperform public sector undertakings (PSUs) in Q2 FY27, with select players expected to benefit from stronger execution, higher realisations and company-specific growth drivers. ICICI Securities remains constructive on Hindustan Aeronautics (HAL), Bharat Electronics (BEL) and Azad Engineering .\n\nThe Indian defence sector is likely to deliver mixed performance in the September quarter, with private-sector players expected to outpace their public-sector counterparts. While first-half execution has historically been weak, select private companies could report stronger-than-expected growth, partly supported by order execution spilling over from the June quarter.\n\nAccording to ICICI Securities\u2019 Q2 FY27 preview, most private defence companies are expected to post higher double-digit revenue growth, while PSU defence companies could report growth ranging from flat to the lower double digits. PSU margins may remain steady or contract amid changes in product mix and input cost pressures.\n\nExcluding outliers in its defence coverage, the brokerage expects average revenue growth of around 13% year-on-year in Q2 FY27. Zen Technologies, Solar Industries India and Azad Engineering are likely to stand out, with projected revenue growth of 55%, 52% and 30%, respectively.\n\nZen Technologies is expected to report strong execution, with revenue projected to rise 55% year-on-year and 90% sequentially in the September quarter. Solar Industries India could benefit from higher realisations in its international and defence businesses, supporting an estimated 52% revenue growth.\n\nAzad Engineering is expected to post 30% revenue growth, while its EBITDA could increase 34% year-on-year. Its margins are likely to remain elevated, partly aided by rupee depreciation.\n\nDynamatic Technologies is also expected to deliver a strong quarter, with EBITDA projected to grow around 31% year-on-year.", "source": "LiveMint Markets", "pub_date_str": "11 Oct 2026, 12:01 PM IST", "pub_date_relative": "52m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "F&O Talk: Nifty\u2019s break above 22,750 could open doors for 23,000; Sudeep Shah picks 5 stocks for next week", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Expert Views \u203a F&O Talk: Nifty\u2019s break above 22,750 could open doors for 23,000; Sudeep Shah picks 5 stocks for next week Tata Consultancy Services Share Price Infosys Share Price HCL Technologies Share Price Wipro Share Price Tech Mahindra Share Price The Economic Times daily newspaper is available online now. Read Today's Paper F&O Talk: Nifty\u2019s break above 22,750 could open doors for 23,000; Sudeep Shah picks 5 stocks for next week SECTIONS F&O Talk: Nifty\u2019s break above 22,750 could open doors for 23,000; Sudeep Shah picks 5 stocks for next week By Veer Sharma , ETMarkets.com Last Updated: Oct 11, 2026, 11:52:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Nifty snapped its eight-week losing streak as bullish technical signals emerged near key support levels. Analysts see Nifty Private Bank outperforming in the short term, while Radico Khaitan, Karur Vysya Bank, ICICI General Insurance and Nykaa remain on traders' radar.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and
