    const allData = {"general": [{"title": "Jio has record IPO fully subscribed within hours", "full_content": "The initial public offering of Jio Platforms Ltd. was fully subscribed on the first day of bidding, keeping billionaire Mukesh Ambani\u2019s digital venture on track to complete India\u2019s largest-ever listing.\n\nBids exceeded the 197.5 million shares on offer within the first two hours, according to data on BSE Ltd.\u2019s website as of 10.40 a.m. local time. The portions reserved for institutional and wealthy investors were subscribed 3.25 times and 26%, respectively. Retail investors bid for nearly 23% of the shares set aside for them.\n\nA decade after storming into the Indian telecom market with free calls and cheap data that decimated its rivals, the company is aiming for a historic milestone with the IPO.\n\nBut unlike in the triumphant fall of 2016, when its aggressive strategy stoked a price war that left only a single competitor profitable, Ambani\u2019s upstart is coming to the market more cautious and humble. the owner of India\u2019s largest wireless operator, is seeking a valuation that\u2019s roughly 10% lower than its nearest sector rival, Bharti Airtel Ltd.\n\nThe listing marks billionaire Ambani\u2019s return to the capital market after 20 years, an offering that he said will \u201cunlock great value\u201d for parent Reliance Industries Ltd. But a closer look paints a more sobering picture. Reliance shares are on track for their worst annual performance since 2011 and the energy-to-entertainment conglomerate had to prune Jio\u2019s valuations to attract marquee investors.\n\nIt\u2019s a reflection of the roller-coaster ride for the nation\u2019s telecom sector, which features some of the world\u2019s cheapest data plans and a massive user base. Jio\u2019s market value adjustment shows that the market is saturating fast and investors now prefer companies that earn more from each customer over those that service more subscribers.\n\n\u201cWe believe that, following its listing, Jio will likely need to demonstrate growth to public shareholders,\u201d Nomura Holdings Inc.", "source": "LiveMint Markets", "pub_date_str": "21 Oct 2026, 11:37 AM IST", "pub_date_relative": "1m ago"}, {"title": "Basic-Fit reiterates guidance as membership growth continues", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Oct 2026, 11:34 AM IST", "pub_date_relative": "5m ago"}, {"title": "Swedencare lowers full-year growth ambition after Q3 revenue, EBITDA miss", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Oct 2026, 11:33 AM IST", "pub_date_relative": "5m ago"}, {"title": "Storebrand Q3 earnings miss estimates as guaranteed pensions weaken", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Oct 2026, 11:33 AM IST", "pub_date_relative": "5m ago"}, {"title": "Halfords reports 7.1% like-for-like sales growth in first half", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Oct 2026, 11:32 AM IST", "pub_date_relative": "6m ago"}, {"title": "Neobo Fastigheter earnings capacity drops despite record occupancy", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Oct 2026, 11:31 AM IST", "pub_date_relative": "7m ago"}, {"title": "M&T Bank vice chairman Pearson sells $441,500 in common stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Oct 2026, 11:31 AM IST", "pub_date_relative": "7m ago"}, {"title": "Oklo general counsel Narayanadas sells $65,179 in stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Oct 2026, 11:31 AM IST", "pub_date_relative": "7m ago"}, {"title": "Trump says companies should pay \u2019dividend\u2019 to communities to make data centers popular", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Oct 2026, 11:30 AM IST", "pub_date_relative": "8m ago"}, {"title": "Klepierre raises 2026 guidance after strong third quarter", - What is driving rally? More rise ahead? Expert view", "full_content": "South Indian Bank share price rose more than 3% in intraday trade on the BSE on Wednesday, 21 October, to hit a 52-week high of \u20b9 56.21. The stock has been on a roll this month, rising as much as 15% so far in October. In fact, South Indian Bank shares have been hitting back-to-back 52-week highs for the last four consecutive sessions.\n\nThe stock has been witnessing healthy buying interest after the company announced its September quarter (Q2FY27) results during market hours on 15 October.\n\nSouth Indian Bank's net profit was \u20b9 426.13 crore for Q2FY27, up 21.28% year-on-year (YoY).\n\nFor the quarter, the bank reported its highest-ever net interest income (NII) of \u20b9 1,116 crore, up 37.95% YoY. Net interest margin (NIM) improved to 3.33% from 2.80% YoY.\n\nGNPA declined by 169 bps from 2.93% to 1.24% YoY, while NNPA eased by 47 bps from 0.56% to 0.09 % YoY.\n\nThe stock jumped 3.71% on 15 October. However, in the next session, it declined by 0.06% due to profit booking but resumed its upward March on 19 October, rising 5.5%.\n\nMeanwhile, the bank also announced the change in designation of Anto George T from Executive Vice President and Chief Operating Officer to Executive Vice President and Chief Business Officer, effective 1 November 2026.\n\nAdditionally, on 17 October, the company announced the revision of marginal cost of funds based lending rates (MCLR) applicable for multiple tenors, effective 20 October. Overnight MCLR is now 8.20%, while one-year MCLR stands at 9.50%.", "source": "LiveMint Markets", "pub_date_str": "21 Oct 2026, 11:23 AM IST", "pub_date_relative": "16m ago"}, {"title": "Samsung, SK Hynix upgrading China plants to make more advanced chips, people say: Reuters", "full_content": "Samsung Electronics and SK Hynix are upgrading their China factories to produce more advanced memory chips, four people familiar with the plans said, aiming to fend off competition from a fast-growing Chinese rival and meet huge AI demand.\n\nHow much to invest in their Chinese operations has become a tricky question for the South Korean semiconductor giants ever since the US began imposing export controls on some chip-making equipment in 2022 amid an effort to slow China's technological progress.\n\nBoth companies are now required to seek US licenses annually if they want to install US-made equipment such as etching machines in China. The US Commerce Department's Bureau of Industry and Security also said in 2025 it did not intend to grant licenses to upgrade technology and expand capacity at the foreign chipmakers' factories in China.\n\nThe regulatory headaches have limited their ability to refit their factories and contributed to loss of market share to Yangtze Memory Technologies Co (YMTC). Executives at the South Korean chipmakers have publicly warned that geopolitical tensions are undermining their Chinese operations.\n\nSamsung and SK Hynix confirmed in statements to Reuters that upgrades were underway and were being done in close consultation with Washington, but did not disclose details of production plans that are being reported here for the first time.\n\nReuters could not, however, determine to what extent US authorities have granted export licenses for equipment that Samsung and SK Hynix need for their planned upgrades.\n\nAccording to the people, the two companies are working to manufacture flash NAND memory chips with more than 200 layers at their Chinese plants, which would bring them in line with what is being produced in South Korea.\n\nNAND, a type of memory chip that retains data without power, is widely used in smartphones, PCs and solid-state drives for AI data centers. More layers per chip means more storage density and lower costs.", "source": "CNBC Top News", "pub_date_str": "21 Oct 2026, 11:14 AM IST", "pub_date_relative": "24m ago"}, {"title": "IT stocks on fire, rally up to 15% today; check performance of TCS, L&T Technology, Wipro, Infosys | Jefferies bullish", "full_content": "IT Stocks Today : Indian IT stocks witnessed strong buying on Wednesday, October 21, with L&T Technology Services leading the rally after reporting robust second-quarter results. Moreover, a bullish outlook for the sector by global brokerage house Jefferies also added to the positive sentiment.\n\nThe Nifty IT index climbed as much as 2.6% to an intraday high of 32,348.25, significantly outperforming the benchmark Nifty 50, which gained around 1%. All IT constituents traded in positive territory, suggesting that the buying extended beyond individual earnings announcements.\n\nL&T Technology Services (LTTS) surged as much as 15%, while Wipro advanced 4%. Infosys, Tata Consultancy Services (TCS), Tech Mahindra, HCL Technologies and Mphasis gained between 2% and 3.5%. Persistent Systems, LTIMindtree (LTM) and Coforge also rose more than 1% each.\n\nA strong start to the second-quarter earnings season has helped improve sentiment towards IT companies, with investors responding to better-than-expected results and signs of stabilisation in business conditions. TCS and HCL Technologies have also reported earnings above expectations, offering some reassurance amid concerns about technology spending and the disruptive impact of AI.\n\nL&T Technology Services emerged as the standout performer after reporting higher revenue and profitability for the September quarter.\n\nThe company's Q2FY27 revenue increased 3.4% quarter-on-quarter (QoQ) and 12.1% year-on-year (YoY) to \u20b9 3,040.4 crore. Dollar revenue rose 2.7% QoQ and 4.8% YoY in constant currency terms to $317 million. Net income jumped 53.7% QoQ and 66.8% YoY to \u20b9 548.2 crore.\n\nAnother factor supporting the sector is renewed interest in traditional IT expenditure following Accenture's guidance for the next financial year.", "source": "LiveMint Markets", "pub_date_str": "21 Oct 2026, 11:06 AM IST", "pub_date_relative": "33m ago"}, {"title": "Small caps: not a great AI hedge", "full_content": "Plus, fewer Fed meetings", "source": "FT Markets", "pub_date_str": "21 Oct 2026, 11:00 AM IST", "pub_date_relative": "39m ago"}, {"title": "Missed reversal in IT stocks? Jefferies gives 3 ideas with up to 50% re-rating potential", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Missed reversal in IT stocks? Jefferies gives 3 ideas with up to 50% re-rating potential Infosys Share Price Tata Consultancy Services Share Price HCL Technologies Share Price Wipro Share Price Tech Mahindra Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Missed reversal in IT stocks? Jefferies gives 3 ideas with up to 50% re-rating potential SECTIONS Missed reversal in IT stocks? Jefferies gives 3 ideas with up to 50% re-rating potential By Nikhil Agarwal , ETMarkets.com Last Updated: Oct 21, 2026, 11:00:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Jefferies sees further valuation upside in Indian IT stocks despite a muted sector growth outlook. Infosys and TCS offer over 20% rerating potential, while Sagility could deliver more than 50% in a best-case scenario. The brokerage raised target prices for Infosys and TCS, citing scope for growth expectations to stabilise.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "21 Oct 2026, 11:00 AM IST", "pub_date_relative": "39m ago"}, {"title": "Oil prices climb as traders assess Middle East developments", "full_content": "Oil prices climbed Wednesday as worries over Middle East supply disruptions keep the market on edge, with attacks on tankers near the Strait of Hormuz and Saudi energy facilities denting sentiment.\n\nBrent crude futures gained 1.22% $110.13 a barrel, while U.S. West Texas Intermediate crude rose 1.11% to $98.92 a barrel.\n\nBrent crude prices this year Iran's Revolutionary Guards said Tuesday that naval mines had prevented three tankers attempting to pass through the Strait of Hormuz using routes Tehran deemed unauthorized.\n\n\"Two violating oil tankers were set ablaze and halted due to the explosion of mines planted by the brave sailors of the IRGC Navy at an illegal crossing point in the southern part of the Strait of Hormuz,\" IRGC said in a statement published on their official Sepah News website .\n\nAdding to regional worries, Yemen's Houthi militants claimed responsibility on Monday for strikes targeting Saudi Aramco facilities in Yanbu, the Shaybah oilfield and airports in Riyadh and Abha.\n\nThe escalating tensions have also sent global oil shipping costs soaring, adding another layer of pressure to energy markets.\n\nThe global average crude freight rate has surged above $20 per barrel, compared with just $3 a year earlier, according to a Goldman Sachs report published Tuesday. While rates have eased slightly in recent days, they remain roughly seven times higher than a year ago.\n\nGoldman estimated that war-risk premiums associated with crossing the Strait of Hormuz accounted for about $7 of the $20 year-on-year increase in average crude freight rates, while ship-to-ship transfers outside the Persian Gulf contributed another $4.", "source": "CNBC Top News", "pub_date_str": "21 Oct 2026, 10:57 AM IST", "pub_date_relative": "41m ago"}, {"title": "Multibagger stock: PC Jeweller shares jump 5% after surging 40% in 2 weeks | Q2 beat, bulk deal in focus | Key levels", "full_content": "PC Jeweller shares jumped nearly 5% on Wednesday, 21 October, amid a broadly positive trend in the Indian stock market. The stock has rallied around 40% over the past two weeks, supported by strong buying momentum following the company\u2019s Q2 FY27 results and renewed investor interest after reports of a bulk deal involving Aditya Kumar Halwasiya, who is associated with Cupid Ltd.\n\nThe stock\u2019s gains have extended beyond the recent rally. PC Jeweller shares have surged 27.44% in one week, 40.23% in two weeks and 44.18% over one month. The stock has gained 83.30% over three months, 92.08% over six months, and 98.07% year-to-date, according to the BSE data.\n\nHowever, technical analysts caution that the sharp rally has pushed the stock into overbought territory, with key resistance levels around \u20b9 19\u2013 \u20b9 20 likely to determine its next move.\n\nInvestor attention has also turned to a reported bulk deal on 16 October, in which Aditya Kumar Halwasiya, associated with Cupid Ltd, purchased 5.10 crore PC Jeweller shares worth approximately \u20b9 73.59 crore at an average price of \u20b9 14.43 per share.\n\nThe transaction has drawn attention amid the jewellery retailer\u2019s ongoing financial turnaround. However, the bulk deal alone does not establish the investor\u2019s long-term intentions or explain the stock\u2019s subsequent price movement.\n\nThe company\u2019s Q2 FY27 performance has provided another focus for investors. PC Jeweller reported a 28% year-on-year increase in consolidated revenue for the July\u2013September quarter, citing healthy consumer demand.\n\nThe company also said it received remittances of \u20b9 142 crore during the quarter from outstanding export debtors.\n\nIn September, PC Jeweller announced that it had cleared its dues to all 14 consortium banks, effectively becoming debt-free after addressing borrowings that had amounted to around \u20b9 3,000 crore. The company had opted for a one-time settlement (OTS) of its outstanding bank dues in September 2024.", "source": "LiveMint Markets", "pub_date_str": "21 Oct 2026, 10:51 AM IST", "pub_date_relative": "48m ago"}, {"title": "Bajaj Finance shares fall 3% after Q2 results. What Jefferies, Nomura, other brokerages now expect?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Bajaj Finance shares fall 3% after Q2 results. What Jefferies, Nomura, other brokerages now expect? 360 One Wam Share Price Anand Rathi Wealth Share Price Nuvama Wealth Management Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Bajaj Finance shares fall 3% after Q2 results. What Jefferies, Nomura, other brokerages now expect? SECTIONS Bajaj Finance shares fall 3% after Q2 results. What Jefferies, Nomura, other brokerages now expect? By Debaroti Adhikary , ETMarkets.com Last Updated: Oct 21, 2026, 10:47:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Bajaj Finance shares dropped on Wednesday after the NBFC reported a 29% year-on-year rise in Q2FY27 net profit to Rs 6,367 crore. Nomura and Jefferies retained Buy ratings, with Jefferies cutting its target price, while 360 One WAM upgraded the stock to Buy, citing improving risk-reward and strong growth.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "21 Oct 2026, 10:47 AM IST", "pub_date_relative": "52m ago"}, {"title": "Hindustan Zinc share jumps 4% after strong Q2 results 2026 | Should you buy Vedanta Group stock? Target, stop loss", "full_content": "Hindustan Zinc share price surged as much as 4%, touching an intraday high of \u20b9 559.85 on NSE, in Wednesday's trading session after the Vedanta Group company reported strong quarterly results on Monday.\n\nHindustan Zinc share price opened at the day's high of \u20b9 559.85, as compared to previous close of \u20b9 538.40 on Monday.\n\nHindustan Zinc on Monday reported a consolidated net profit of \u20b9 6,412 crore for the second quarter of FY27, registering a 142% year-on-year (YoY) jump from \u20b9 2,649 crore in the corresponding quarter last year. The company\u2019s shares surged to \u20b9 560 apiece on the NSE on Wednesday morning.\n\nThe metal producer\u2019s revenue from operations rose 76.5% YoY to \u20b9 15,093 crore in the July-September quarter of FY27, compared with \u20b9 8,549 crore in the year-ago period. The growth was driven by higher metal prices, increased production volumes, better realisations from by-products, and a stronger US dollar. Meanwhile, total expenses increased nearly 31.5% YoY to \u20b9 6,895 crore during the quarter.\n\nHindustan Zinc\u2019s EBITDA more than doubled year-on-year (YoY), rising 108% to \u20b9 9,285 crore, while its EBITDA margin expanded to 62% from 52% in the corresponding period last year. The growth was supported by a 141% YoY surge in net silver sales to \u20b9 4,111 crore and a 54% increase in zinc sales to \u20b9 8,224 crore. Lead sales and other metal sales also rose 35% and 151% YoY, respectively.\n\nHindustan Zinc share price has remained largely flat over the past week, rising just 0.06%, but the stock has witnessed a sharper correction over the past month. The shares have declined 8.69% in one month and are down 11.70% year-to-date (YTD), indicating pressure on the stock in the near term.\n\nDespite the recent weakness, Hindustan Zinc has delivered positive returns over longer periods, gaining 11.68% over the past year and 75.10% over three years.", "source": "LiveMint Markets", "pub_date_str": "21 Oct 2026, 10:44 AM IST", "pub_date_relative": "54m ago"}, {"title": "Transrail Lighting shares rally 9% after bagging orders worth Rs 927 crore", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Transrail Lighting shares rally 9% after bagging orders worth Rs 927 crore Transrail Lighting Share Price Kalpataru Projects International Share Price GE Power India Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Transrail Lighting shares rally 9% after bagging orders worth Rs 927 crore SECTIONS Transrail Lighting shares rally 9% after bagging orders worth Rs 927 crore By Ritesh Presswala , ETMarkets.com Last Updated: Oct 21, 2026, 10:44:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Transrail Lighting shares rose nearly 9% after the company secured fresh orders worth Rs 927 crore, taking its financial year order intake to Rs 3,356 crore. However, foreign institutional investors trimmed their stake in the company during the September 2026 quarter.\n\n(What's movin timistic, citing Jio\u2019s telecom leadership, improving profitability and growth opportunities in broadband and artificial intelligence (AI).\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "21 Oct 2026, 10:40 AM IST", "pub_date_relative": "58m ago"}, {"title": "Global Market | Safe-haven assets under pressure: Dollar, Swiss franc, German bonds and gold in focus", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a Global Market | Safe-haven assets under pressure: Dollar, Swiss franc, German bonds and gold in focus Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market | Safe-haven assets under pressure: Dollar, Swiss franc, German bonds and gold in focus SECTIONS Global Market | Safe-haven assets under pressure: Dollar, Swiss franc, German bonds and gold in focus By Anupam Nagar , ETMarkets.com Last Updated: Oct 21, 2026, 10:40:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Safe-haven demand is shifting amid AI-driven market volatility, geopolitical tensions, rising energy prices and mounting government debt. The US dollar, Swiss franc, German Bunds, short-term government bonds and gold offer potential protection, but differing risks and volatile returns highlight the challenges of safeguarding portfolios during market uncertainty.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "21 Oct 2026, 10:40 AM IST", "pub_date_relative": "59m ago"}, {"title": "Global Market: Japanese government bond yields fall as safe-haven demand returns", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Global Market: Japanese government bond yields fall as safe-haven demand returns Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market: Japanese government bond yields fall as safe-haven demand returns SECTIONS Global Market: Japanese government bond yields fall as safe-haven demand returns By Anupam Nagar , ETMarkets.com Last Updated: Oct 21, 2026, 10:34:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Japanese government bond prices rose for a third session as attractive yields and safe-haven demand boosted investor interest. Record demand at a 20-year bond auction supported the recovery, while global yields declined. Economists expect the Bank of Japan to raise interest rates to 1.50% in December, though October rates may remain unchanged.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "21 Oct 2026, 10:34 AM IST", "pub_date_relative": "1h ago"}, {"title": "How Reliance Jio IPO is acting as shot in the arm for RIL shares \u2014 Will Mukesh Ambani company stock fly more? Buy now?", "full_content": "Reliance Industries share | Jio Platforms IPO: Shares of Reliance Industries Ltd (RIL) have been on an uptrend ever since the Jio Platforms IPO RHP was filed. After hitting the 52-week low of \u20b9 1,152.20 per share ahead of the Jio Platforms IPO subscription opening, strong buying triggers are fueling RIL shares for the last few sessions. As the Jio Platforms IPO subscription opens today, Reliance share price opened with an upside gap at \u20b9 1,212 and touched an intraday high of \u20b9 1,234.30 per share within a few minutes of the Opening Bell, clocking an intraday gain of 1.75%.\n\nAccording to stock market experts, this rally in Mukesh Ambani's company's shares can be attributed to the opening of Jio Platforms' IPO subscription. They said that RIL holds around two-thirds of Jio Platforms' stake, and a rise in Reliance Jio Platforms' market cap or valuation would translate into a two-thirds benefit for Reliance Industries and its shares. They said that the market is expecting around \u20b9 350 to \u20b9 500 per share value addition by Jio Platforms' share listing in the RIL shares. However, this may not happen in the short term, but they advised a \u2018buy-on-dips\u2019 strategy in Reliance shares as it may touch up to \u20b9 1,700 per share by the end of FY27.\n\nWhether Jio Platforms IPO is acting as a shot in the arm of Reliance Industries shares, Avinash Gorakshkar, Founder of Avinash Mentor Research, said, \u201cThe market is expecting the benefit of value unlocking for RIL, as it holds around one-third stake in Reliance Jio Platforms. So, this rally in the RIL shares can be attributed to the Jio Platforms IPO subscription opening.\u201d\n\nOn how one can connect Jio Platforms IPO with Reliance Industries' shares. Avinnash Gorakshkar said that even after value unlock from RIL, the balance sheets of these two companies would be connected due to RIL's strong two-thirds shareholding.", "source": "LiveMint Markets", "pub_date_str": "21 Oct 2026, 10:33 AM IST", "pub_date_relative": "1h ago"}, {"title": "Hindustan Zinc\u2019s Q2 earnings glow on lower costs, higher metal prices", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nHindustan Zinc Ltd\u2019s (HZL) earnings are benefiting from three key factors: higher metal prices, lower cost of production (CoP) and improved volumes.\n\nThe September quarter (Q2FY27) results were strong, with year-on-year growth in revenue and earnings similar to Q1. Q2\u2019s consolidated revenue rose a whopping 77% year-on-year to \u20b9 15,100 crore. Operating leverage and a sharp drop in production cost meant Ebitda grew 108% to \u20b9 9,250 crore.\n\nSilver prices on LBMA averaged $62.6 per ounce (oz) in Q2, up nearly 60% year-on-year. Sales volumes rose 24% to 183 tonnes, including 10 tonnes in lead concentrate, following capacity augmentation through debottlenecking projects completed in H2FY26. H1 production of 340 tonnes was in line with FY27 guidance of 680 tonnes. However, the benefit from higher realizations could moderate from Q3FY27, with silver prices declining to around $58 per oz currently, close to the Q3FY26 average of $54.7 per oz.\n\nZinc prices also rose sharply, averaging $3,825 per tonne on the London Metal Exchange in Q2FY27, up 35% year-on-year. The market is seeing a sharp demand-supply mismatch, driven by mine closures and inadequate fresh investment. Prices have since fallen from a mid-September peak of about $4,200 per tonne to around $3,740 per tonne, which could limit the upside in Q3FY27.\n\nCost savings have also fuelled earnings. HZL\u2019s zinc CoP, excluding royalty, fell 29% year-on-year to $703 per tonne in Q2 and to $776 per tonne in H1, aided by higher prices for the key by-product sulphuric acid and an increased share of renewable energy. Disruption in sulphur supplies amid the West Asia war has lifted sulphuric acid prices. Thus, the management has lowered its FY27 CoP guidance to $825-850 per tonne from $975-1,000 per tonne earlier.\n\nSales volumes of refined metals, comprising zinc and lead, increased 8% to 0.26 million tonnes (mt) last quarter.", "source": "LiveMint Markets", "pub_date_str": "21 Oct 2026, 10:33 AM IST", "pub_date_relative": "1h ago"}, {"title": "Global Market: China's yuan hits four-year high on export strength, weak dollar", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Global Market: China's yuan hits four-year high on export strength, weak dollar Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market: China's yuan hits four-year high on export strength, weak dollar SECTIONS Global Market: China's yuan hits four-year high on export strength, weak dollar By Anupam Nagar , ETMarkets.com Last Updated: Oct 21, 2026, 10:21:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis China\u2019s onshore yuan touched a more than four-year high against the US dollar, supported by robust exports, resilient economic growth, foreign exchange inflows and a weaker greenback. The currency has gained 4.7% against the dollar so far in 2026.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "21 Oct 2026, 10:21 AM IST", "pub_date_relative": "1h ago"}, {"title": "HD Fire Protect IPO Listing: Shares Debut With 24% On NSE, BSE", "full_content": "HD Fire Protect Ltd debuted on the stock market with a 23% premium, opening at Rs 335 on NSE against an IPO price of Rs 271.", "source": "NDTV Profit", "pub_date_str": "21 Oct 2026, 10:19 AM IST", "pub_date_relative": "1h ago"}, {"title": "U.S. eyes refining muscle of Indian billionaire Ambani's Reliance as Rubio visits Jamnagar plant", "full_content": "U.S. Secretary of State Marco Rubio will discuss refining Western energy supplies with Indian billionaire Mukesh Ambani's Reliance Industries when he visits the company's plant in Jamnagar, Gujarat \u2014 the world's largest single-site refinery.\n\nThe U.S. is looking to \"work together more closely\" with Reliance for refining energy from the \"Western Hemisphere,\" Rubio said in an interview with India's Network 18, which is owned by Reliance. \"I think that's helpful to India, but it's also helpful to us,\" he added.\n\nReliance's Jamnagar refinery, which Rubio will visit on Wednesday, has a crude processing capacity of 1.4 million barrels per day. Reliance has also emerged as the biggest buyer of Venezuelan crude outside of the U.S., as of end-September.\n\nThe company's \"extraordinary\" refining capacity could help India diversify its energy supplies, Rubio said, hinting at possibly greater offtake of Venezuelan crude.\n\n\"We think there's an opportunity for them [Reliance Industries] to continue to help India diversify its supply chain, its supply of energy,\" Rubio said, adding that Venezuela was ramping up energy production, and that \"India has had a long history of being able to refine some of that.\"\n\nU.S. President Donald Trump has been pushing India to buy more Venezuelan oil to replace Russian barrels, and while state-owned oil companies are making opportunistic purchases, Reliance has been the primary buyer.\n\nBeyond oil purchases, Reliance has been deepening ties with the U.S. this year, with Trump announcing in March that America will build its first new oil refinery in 50 years, helped by investment from Ambani's Reliance.\n\nWhile Reliance has not confirmed the size of investment, Trump in a Truth Social post had said that \"THIS IS A HISTORIC $300 BILLION DOLLAR DEAL \u2014 THE BIGGEST IN U.S. HISTORY.\"", "source": "CNBC Top News", "pub_date_str": "21 Oct 2026, 10:17 AM IST", "pub_date_relative": "1h ago"}, {"title": "Bajaj Finance Stock Falls Nearly 3% After Q2 Asset Quality Disappoints", "full_content": "The shares have fallen over 5% year-to-date and 13.8% in the last 12 months.", "source": "NDTV Profit", "pub_date_str": "21 Oct 2026, 10:15 AM IST", "pub_date_relative": "1h ago"}, {"title": "Indian bonds sell off on oil shock ahead of RBI policy minutes", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Bonds \u203a Indian bonds sell off on oil shock ahead of RBI policy minutes Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Indian bonds sell off on oil shock ahead of RBI policy minutes SECTIONS Indian bonds sell off on oil shock ahead of RBI policy minutes Reuters Last Updated: Oct 21, 2026, 10:11:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Indian government bonds experienced a significant decline due to rising oil prices, raising concerns about inflation among investors. The benchmark bond yield has reached its highest point since March, leading to a more cautious trading environment. Additionally, consumer inflation in India rose to 5.54%, with forecasts indicating further increases in October.\n\nIndian government bonds experienced a significant decline due to rising oil prices, raising concerns about inflation among investors. The benchmark bond yield has reached its highest point since March, leading to a more cautious trading environment. Additionally, consumer inflation in India rose to 5.54%, with forecasts indicating further increases in October.\n\nYes Bank CET1 may fall to 10% if past AT1 coupons are paid: Crisil\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "21 Oct 2026, 10:11 AM IST", "pub_date_relative": "1h ago"}, {"title": "Why is stock market up today? Sensex rises 829 points, Nifty surges 1% | Top 4 reasons behind D-Street soar explained", "full_content": "Stock Market Today : Indian stock market benchmarks Sensex and Nifty 50 opened sharply higher on Wednesday, buoyed by hopes of a potential India-US trade agreement. However, rising crude oil prices and elevated US bond yields remained key concerns that could limit further gains.\n\nThe BSE Sensex surged 829 points, or 1.1%, to an intraday high of 74,682.19, while the Nifty 50 climbed 232 points, or 1%, to 23,120.90.\n\nAt the opening bell, the Sensex stood at 74,337.93, compared with its previous close of 73,852.90. The Nifty 50 began trading at 23,016, against its previous close of 22,888.95.\n\nInvestors were also tracking the much-anticipated Jio Platforms IPO, which opened for subscription on Wednesday, alongside developments in the ongoing second-quarter earnings season.\n\nSectoral performance was broadly positive, led by information technology stocks. The Nifty IT index advanced 2.03%, while the Nifty PSU Bank and Nifty Metal indices gained 0.74% and 0.70%, respectively. The Nifty Media index was the sole major sectoral laggard, declining 0.15%.\n\nAmong Nifty 50 constituents, Infosys topped the gainers with a 2.47% rise, followed by Tata Consultancy Services (TCS), which advanced 2.08%, and UltraTech Cement, up 1.96%.\n\nOn the losing side, Bajaj Finance fell 2.32%, emerging as the biggest laggard on the benchmark, while Bajaj Finserv slipped 0.49%.\n\n\"With Brent crude prices and US bond yields remaining elevated, the market is likely to remain under pressure. The sell-on-rally market construct will continue in the near term. However, the improving earnings growth, fair valuations of large-caps, and strong domestic liquidity will support the market on declines,\" said V K Vijayakumar, Chief Investment Strategist, Geojit Investments Limited.", "source": "LiveMint Markets", "pub_date_str": "21 Oct 2026, 10:10 AM IST", "pub_date_relative": "1h ago"}, {"title": "Jio Platforms IPO Live Updates: Issue Subscribed 83%, QIBs Lead Bidding", "full_content": "Jio Platforms' Rs 30,213-crore IPO opens today. Track subscription trends, investor demand, GMP, allotment details and listing updates here.", "source": "NDTV Profit", "pub_date_str": "21 Oct 2026, 10:05 AM IST", "pub_date_relative": "1h ago"}, {"title": "L&T Tech Services shares surge 15% after Q2 2026 results - Should investors buy, sell, or hold stock? Experts suggestion", "full_content": "L&T Technology Services shares soared as much as 15% in morning deals on the BSE on Wednesday, 21 October, buoyed by the company's September quarter (Q2FY27) results. L&T Technology Services share price opened at \u20b9 3,848 against its previous close of \u20b9 3,609.80 and jumped 14.70% to an intraday high of \u20b9 4,140.50.\n\nAfter market hours on Monday, 19 October, L&T Technology Services announced its Q2FY27 revenue stood at \u20b9 3,040.4 crore, rising 3.4% quarter-on-quarter (QoQ) and 12.1% year-on-year (YoY).\n\nDollar revenue increased by 2.7% QoQ and 4.8% YoY in constant currency (CC) terms to $317 million for the quarter.\n\nThe company's net income for the quarter rose by 53.7% QoQ and 66.8% YoY to \u20b9 548.2 crore, including one-time gain of \u20b9 165 crore from the disinvestment of the SWC business.\n\nMoreover, the comapny also Iannounced an interim dividend of \u20b9 20 per share, with a record date of 27 October 2026.\n\nL&T Technology Services' Q2 results were better-than-expected which prompted positive reviews by some of the top domestic brokerage firms.\n\nBrokerage firm JM Financial maintained an \"add\" call on the stock after the Q2 results but raised the target price to \u20b9 3,890 from \u20b9 3,575 earlier.\n\n\"L&T Technology Services reported a strong Q2FY27 with revenue and margins beating estimates. Forward-looking indicators includes large-deal TCV stood at $203 million, higher sequentially (nearly $100 million in Q1FY27), while the deal pipeline increased more than 25% YoY,\" JM Financial noted.", "source": "LiveMint Markets", "pub_date_str": "21 Oct 2026, 10:03 AM IST", "pub_date_relative": "1h ago"}, {"title": "Transrail Lighting shares skyrocket 10% | \u20b9927 cr order wins, 990 MW solar deal in focus - what investors should know", "full_content": "Transrail Lighting share price jumped nearly 10% on Wednesday, 21 October, after the company announced fresh orders worth \u20b9 927 crore, largely in its domestic power transmission and distribution (T&D) business.\n\nWith these wins, the company\u2019s order intake for the year has risen to \u20b9 3,356 crore. The latest orders primarily comprise engineering, procurement and construction (EPC) projects for 765 kV and 400 kV transmission lines in the domestic market, along with conductor supply orders from the US.\n\nThe latest wins extend Transrail Lighting\u2019s order-winning momentum, with the company announcing orders worth more than \u20b9 2,300 crore over the past three weeks.\n\nThe company said its expansion of in-house manufacturing capabilities for transmission towers and conductors, coupled with robust domestic and international demand for T&D infrastructure, positions it to sustain growth.\n\n\u201cThe strong momentum in our order inflows underscores Transrail\u2019s growing scale and competitiveness in the power T&D sector. Our ability to secure complex transmission EPC projects, backed by our in-house tower and conductor manufacturing capabilities, remains a key differentiator,\u201d said Randeep Narang, Managing Director and CEO of Transrail Lighting.\n\nHe added that the company would continue to leverage its strong domestic presence and expanding international business to build a well-diversified portfolio across products and services.\n\nThe company\u2019s board also approved the proposed acquisition of a 49% equity stake in NOPL Pace Green Energy for a cash consideration of \u20b9 20 crore, subject to the requisite approvals and fulfilment of agreed conditions.\n\nNOPL is developing a 990 MW (AC) solar power portfolio in Maharashtra under the PM-KUSUM scheme. The portfolio is backed by a 25-year power purchase agreement (PPA) with Maharashtra State Electricity Distribution Company (MSEDCL) at a tariff of \u20b9 3.10 per unit.", "source": "LiveMint Markets", "pub_date_str": "21 Oct 2026, 10:02 AM IST", "pub_date_relative": "1h ago"}, {"title": "Salman Khan's Security Upgraded After Attack On Tiger Shroff; Shooters Conducted Recce Of Actor's House", "full_content": "The three accused scouted the area around Khan's residence before the attack, but found they could not get close to him and backed off.", "source": "NDTV Profit", "pub_date_str": "21 Oct 2026, 09:58 AM IST", "pub_date_relative": "1h ago"}, {"title": "Gold, silver prices today, 21 October: Check retail rates of 24K, 22K gold, 999 silver in Delhi, Mumbai and Kolkata", "full_content": "Gold and silver prices: Gold prices fell for a fourth consecutive session on Wednesday as rising oil prices fuelled concerns over inflation. Investors are also awaiting next week\u2019s US Federal Reserve policy meeting for clues about the future direction of interest rates.\n\nSpot gold declined 0.2% to $4,118.18 per ounce, while US gold futures for December delivery fell 0.2% to $4,136.20, according to Reuters.\n\nMarkets are pricing in a 16% chance of a rate hike at the Fed\u2019s October 27\u201328 policy meeting, while the probability of a hike in December remains around 90%. Higher interest rates typically weigh on gold prices as they increase the opportunity cost of holding the non-interest-bearing metal. Meanwhile, the US dollar index stabilised after recent losses, limiting demand for bullion.\n\nInvestors are also awaiting US Personal Consumption Expenditures (PCE) inflation data due next week. The PCE price index is the Fed\u2019s preferred measure for tracking inflation against its 2% target, according to Reuters. Among other precious metals, spot silver fell 0.9% to $57.44 per ounce.\n\nIn the domestic market, MCX gold futures were trading 0.40% lower at \u20b9 1,45,939 per 10 grams on October 21. MCX silver futures declined around 0.94% to \u20b9 2,09,494 per kg at approximately 9:40 am.\n\nGold is available in different purities in the retail market, with 24-karat gold being the purest form and 22-karat gold commonly used to make jewellery due to its greater durability.\n\nHere\u2019s a look at the latest gold prices in major Indian cities on 21 October.\n\nDisclaimer: Gold and silver prices are indicative and may vary across jewellers and locations. This is for informational purposes only.", "source": "LiveMint Money", "pub_date_str": "21 Oct 2026, 09:56 AM IST", "pub_date_relative": "1h ago"}, {"title": "Ranbir Kapoor And Yash\u2019s Ramayana To Be Tax-Free In West Bengal: CM Suvendu Adhikari", "full_content": "West Bengal Chief Minister Suvendu Adhikari has announced that Nitesh Tiwari's Ramayana will be tax-free in the state.", "source": "NDTV Profit", "pub_date_str": "21 Oct 2026, 09:54 AM IST", "pub_date_relative": "1h ago"}, {"title": "Your First Rs 10 Lakh Corpus: SIP, Savings Or A Mix Of Both?", "full_content": "Keeping debt components in your portfolio can help balance it and protect you during market volatility even if you have a higher risk appetite.", "source": "NDTV Profit", "pub_date_str": "21 Oct 2026, 09:53 AM IST", "pub_date_relative": "1h ago"}, {"title": "'Not Targeted At India': Rubio Seeks To Calm Nerves On Tariffs And Visa Curbs", "full_content": "The US Secretary of State says the India-US trade deal is \"weeks not months\" away and that visa changes are part of a global overhaul.", "source": "NDTV Profit", "pub_date_str": "21 Oct 2026, 09:53 AM IST", "pub_date_relative": "1h ago"}, {"title": "Sobha Shares Fall Over 4% After Q2 Results", "full_content": "
