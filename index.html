<script>
    // This variable will be injected during the build process
    const allData = {"general": [{"title": "Global AI stocks under pressure as safety fears erupt", "full_content": "South Korea\u2019s tech-heavy Kospi slides as Wall Street is set to open lower", "source": "FT Markets", "pub_date_str": "14 Sep 2026, 01:09 PM IST", "pub_date_relative": "just now"}, {"title": "Asian currencies under pressure as dollar gains, yen stays elevated", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Sep 2026, 01:03 PM IST", "pub_date_relative": "6m ago"}, {"title": "AirBaltic files for Chapter 11 bankruptcy in New York", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Sep 2026, 01:01 PM IST", "pub_date_relative": "8m ago"}, {"title": "Oil hits $108 as Gulf states postpone talks with Iran over Hormuz", "full_content": "Deferred meeting on vital waterway comes on top of Saudi pipeline closure following drone attack last week", "source": "FT Markets", "pub_date_str": "14 Sep 2026, 01:01 PM IST", "pub_date_relative": "8m ago"}, {"title": "Diplomacy stumbles with postponement of meeting on Strait of Hormuz proposal", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Sep 2026, 01:00 PM IST", "pub_date_relative": "9m ago"}, {"title": "European shares muted as tech slides, oil surge weighs", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Sep 2026, 01:00 PM IST", "pub_date_relative": "9m ago"}, {"title": "Iran says it destroys U.S. advanced drone over Hormuz as Middle East conflict intensifies", "full_content": "Iranian military said it has destroyed an advanced American drone over the Strait of Hormuz, the latest exchange as Tehran and Washington trade warnings and strikes with no sign of de-escalation.\n\nThe Islamic Revolutionary Guard Corps said Monday that its \"new advanced aerospace defence system\" intercepted and destroyed an advanced MQ-1 drone over the Hormuz strait, without providing further details on the drone's mission. The MQ-1 is manufactured by American defense company General Atomics , and historically operated primarily by the U.S. Air Force and the CIA.\n\nThe incident followed a series of Iranian operations against U.S. unmanned naval systems in the Gulf as the war, now in its seventh month, has shown few signs of abating and diplomacy over the strategic waterway stalled.\n\nOn Sunday, President Donald Trump said the U.S. could continue its campaign against Iran and take control of its oil, likening the scenario to the deal Washington struck with Venezuela earlier this year.\n\n\"We'll ultimately get out (of the war), unless we decide to stay and keep the oil like Venezuela,\" Trump said of the Iran conflict Sunday at the Irish Open golf championship in Ireland. He added that U.S. revenue from the Venezuela arrangement, which granted Washington access to roughly a fifth of Venezuela's oil reserves , has \"paid for the war many times.\"\n\nUnder the agreement reached in August, Venezuela ceded majority U.S. control of more than 65 billion barrels of oil reserves \u2014 more than double America's own reserves \u2014 in exchange for $209 billion to Venezuela's state treasury.", "source": "CNBC Top News", "pub_date_str": "14 Sep 2026, 12:54 PM IST", "pub_date_relative": "15m ago"}, {"title": "Motilal Oswal Nasdaq Q50 ETF jumps 41% in a week even as underlying US stocks fall. What is happening?", "full_content": "The Motilal Oswal Nasdaq Q50 ETF has seen an extraordinary jump in its market price over the past week, even as the value of the US stocks it holds has moved lower.\n\nBetween 4 and 10 September, the ETF' s price on the stock exchange rose 41%, from \u20b9 141.99 to \u20b9 199.89. Over the same period, the value of the 50 stocks in its portfolio fell 2.6%, according to Value Research data.\n\nThe divergence has pushed the ETF's market price well above its NAV. On 10 September, its NAV was \u20b9 115.69, compared with a closing market price of \u20b9 199.89. This represented a premium of 72.8%, according to Value Research.\n\nThe sharp increase in the premium has been linked to limited availability of units in the ETF, strong demand on the exchange and a recent change in the rules governing ETF price bands.\n\nAn ETF's NAV reflects the value of the securities held by the fund. Its market price, meanwhile, is determined by buying and selling on the stock exchange.\n\nNormally, the two prices remain relatively close because ETF units can be created when demand increases. The additional units provide more supply in the market and help keep the traded price aligned with the value of the underlying portfolio .\n\nFor international ETFs such as the Nasdaq Q50, that mechanism has been constrained by India's overseas investment limits.\n\nThe overseas investment limit for ETFs was reached in April 2024, after which fresh units could not be created in the same manner. With the supply of existing units limited, an increase in demand can instead show up as a higher market price.", "source": "LiveMint Money", "pub_date_str": "14 Sep 2026, 12:54 PM IST", "pub_date_relative": "15m ago"}, {"title": "The claim settlement playbook: from filing to final payout", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nA life insurance policy is bought on a simple promise: one's family will be financially protected when it matters most. That promise is put to test at a difficult time\u2014following the death of a loved one, when the family must navigate the claims process, often for the first time.\n\nAwareness of this process, and the documentation needed to speed up approval, remains limited among policyholders and their families. It is therefore important to understand how a death claim moves from intimation to final payout, and what nominees need to do at each step to ensure a smoother settlement.\n\nFollowing a policyholder's demise, the insurer initiates the payment of the life insurance policy's death benefit to the declared nominee(s) after receiving a claim intimation. Before this process begins, the nominees need to be aware that a policy exists and have access to its basic details. Therefore, policyholders are strongly encouraged to keep their families informed of their coverage.\n\nOnce aware, beneficiaries can file a claim with the insurer by providing policy details, the date and cause of death, and contact information. While an in-person branch visit or intimation through the call centre are commonly used reporting channels, insurers have increasingly embraced digitalization which allows nominees to notify a death claim through WhatsApp, website or a dedicated mobile application. Irrespective of the channel chosen, the insurer creates an official claim and shares the claim ID along with expected timelines for processing.\n\nPost the registration of a claim, the insurer collects supporting documents such as death certificate, original policy (if needed), hospital records or post-mortem report in case of an accidental death.", "source": "LiveMint Money", "pub_date_str": "14 Sep 2026, 12:53 PM IST", "pub_date_relative": "16m ago"}, {"title": "Trump urges Ukraine to stop \u2018knocking out\u2019 Russian oil refineries as U.S. diesel hits record", "full_content": "U.S. President Donald Trump has urged Ukrainian President Volodymyr Zelenskyy to stop targeting Russian oil refineries, saying the attacks are \"hurting the world\" as fuel supply disruptions from the Ukraine and Iran wars propel U.S. diesel prices to a record high.\n\nUkraine has stepped up its attacks on Russian oil facilities and logistics infrastructure in recent months, seeking to raise the cost of the war for Moscow after more than four-and-a-half years of conflict.\n\nThe attacks have significantly hampered Russia's refining capacity and prompted widespread fuel shortages, with Moscow recently extending a ban on diesel exports through the end of September as part of a push to stabilize domestic supplies.\n\n\"Mr. Zelenskyy has to do one thing. He has to stop knocking out diesel fuel in Russia,\" Trump said during an official visit to Ireland on Sunday.\n\n\"Let him go after targets but not diesel fuel because he's causing a shortage of diesel. This isn't done by the Middle East; this is done by what's happening with Russia and Ukraine.\"\n\nA spokesperson for Ukraine's Foreign Ministry was not immediately available to comment when contacted by CNBC on Monday morning.\n\nUkraine, which fears an extremely difficult winter period amid expectations of another Russian assault on its energy infrastructure, has previously characterized Russian oil refineries as legitimate military targets.\n\nTrump's warning comes shortly after the price of diesel, a critically important fuel for everything from heavy-duty transportation and commercial shipping to industries like mining and agriculture, topped $6 per gallon for the first time ever on Friday.", "source": "CNBC Top News", "pub_date_str": "14 Sep 2026, 12:52 PM IST", "pub_date_relative": "18m ago"}, {"title": "Health insurance portability: How underwriters filter out the policyholders who need it most", "full_content": "Every renewal cycle, an all-too-familiar friction plays out across Indian households. Consider a 62-year-old retired teacher who, exasperated by delayed claim settlements and another steep premium hike, decides to move her coverage to a rival insurer.\n\nShe expects her decade of policy continuity and waiting-period credits to transition seamlessly. Instead, after weeks of paperwork and medical evaluations, her application is turned down without a clear explanation. Left with no realistic alternative at her age, she quietly renews with her existing insurer.\n\nHer predicament captures a structural blind spot in retail health insurance: portability is merely a right to apply, not a guaranteed transfer.\n\nAccording to Suresh Mathur, former executive director at the Insurance Regulatory and Development Authority of India ( Irdai ), while the framework was introduced in 2011 to dismantle customer lock-ins, its real-world execution remains heavily constrained by commercial underwriting.\n\nWhen the regulator introduced the portability mandate, the intent was to empower policyholders to vote with their feet, Mathur noted. The rules established that accrued benefits\u2014specifically, waiting periods served for pre-existing diseases and accumulated bonuses\u2014must be transferred to the new insurer. However, destination insurers retain the statutory prerogative to underwrite every incoming proposal from scratch.\n\nThis discretion creates an acute selection bias, he said. Insurers compete aggressively for young, healthy policyholders through instant digital approvals. But for senior citizens, diabetics, or individuals with recent hospitalisations, the underwriting gates narrow sharply.\n\nThose with the strongest reasons to exit an underperforming insurer are precisely the profiles underwriters avoid. When older applicants are accepted, policies frequently arrive laden with heavy premium loadings, mandatory co-payments, or fresh exclusions.", "source": "LiveMint Money", "pub_date_str": "14 Sep 2026, 12:51 PM IST", "pub_date_relative": "18m ago"}, {"title": "Why is Kioxia stock sliding today?", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Sep 2026, 12:50 PM IST", "pub_date_relative": "19m ago"}, {"title": "Exclusive-IPO for humanoid robot maker Boston Dynamics unlikely in 2027, executive says", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Sep 2026, 12:48 PM IST", "pub_date_relative": "21m ago"}, {"title": "AI-linked stocks slump after top lab CEOs call for slowing technology\u2019s development", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Sep 2026, 12:48 PM IST", "pub_date_relative": "21m ago"}, {"title": "Stock futures fall as investors weigh AI safety concerns, oil gains: Live updates - cnbc.com", "full_content": "Stock futures fall as investors weigh AI safety concerns, oil gains: Live updates cnbc.com AI-linked stocks slump after top lab CEOs call for slowing technology's development Reuters Asian shares are mixed and OpenAI investor SoftBank shares plunge after calls to slow AI industry AP News Futures Fall; AI Leaders' Call For Slowdown Hits These Stocks Investor's Business Daily Anthropic\u2019s AI Warning May Weigh on Chips, But Trade Seen Intact bloomberg.com", "source": "Google News Business", "pub_date_str": "14 Sep 2026, 12:48 PM IST", "pub_date_relative": "22m ago"}, {"title": "Straumann stock gains after Goldman Sachs upgrade to buy", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Sep 2026, 12:46 PM IST", "pub_date_relative": "23m ago"}, {"title": "Chip, memory stocks fall amid calls for AI development slowdown", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Sep 2026, 12:44 PM IST", "pub_date_relative": "25m ago"}, {"title": "FTSE 100 today: Stocks gain as Mideast supply fears lift oil", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Sep 2026, 12:44 PM IST", "pub_date_relative": "25m ago"}, {"title": "Yen appreciation has carry-trade seekers looking at these two currencies", "full_content": "The Japanese yen's recent appreciation has investors looking elsewhere for carry-trade funding, with the currencies of China and Canada eyed as potential replacements.\n\nThe yen, the best-performing G10 currency, has appreciated around 6% against the dollar since late July, when authorities intervened in currency markets, according to LSEG data.\n\nSpeculators flipped net long on the yen in the week to Sept. 8, according to the Commodity Futures Trading Commission. Such positions totaled around 10,800 contracts, compared to around 92,200 yen short positions the prior week.\n\nHawkish commentary from Bank of Japan board members, which left open the possibility of accelerated rate hikes, has helped strengthen the yen in a way the historic joint U.S.-Japan currency intervention couldn't. Plus, Treasury Secretary Scott Bessent continued to warn speculators about betting against the yen, saying last week, \"I am the house now.\"\n\nThat all makes the yen less attractive for carry trades, where investors borrow in low-yielding assets to invest in higher-yielding ones.\n\nThe Chinese yuan is being floated as a contender, according to Bank of America.\n\n\"I like to quip that Japan is becoming like China was 20 years ago, and China is becoming like Japan\" concerning deflation, said Claudio Piron, head of Asia forex and rates.\n\n\"The openness of the capital account of China is much more restricted than that of Japan,\" he said on \"Squawk Box Asia\" on Friday. \"But we've seen a lot of issuance in CNH [offshore yuan] bonds, and a lot of foreign multinational companies seek funding and issuance in those markets.\"", "source": "CNBC Top News", "pub_date_str": "14 Sep 2026, 12:40 PM IST", "pub_date_relative": "29m ago"}, {"title": "ETMarkets Smart Talk | Retail traders lost \u20b91.8 lakh crore in F&O: Can algo trading change the game? Rakesh Pujara explains", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Expert Views \u203a ETMarkets Smart Talk | Retail traders lost \u20b91.8 lakh crore in F&O: Can algo trading change the game? Rakesh Pujara explains Angel One Share Price Choice International Share Price JM Financial Share Price IIFL Capital Services Share Price Anand Rathi Share & Stock Brokers Share Price The Economic Times daily newspaper is available online now. Read Today's Paper ETMarkets Smart Talk | Retail traders lost \u20b91.8 lakh crore in F&O: Can algo trading change the game? Rakesh Pujara explains SECTIONS ETMarkets Smart Talk | Retail traders lost \u20b91.8 lakh crore in F&O: Can algo trading change the game? Rakesh Pujara explains By Kshitij Anand , ETMarkets.com Last Updated: Sep 14, 2026, 12:32:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis More than 90% of individual F&O traders lost money between FY22 and FY24, with retail losses reaching around \u20b91.8 lakh crore. With algorithmic trading now widespread, automation could help level the playing field by giving retail investors access to tools once largely available to institutions, says Rakesh Pujara of Compounding Wealth Advisors.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "14 Sep 2026, 12:32 PM IST", "pub_date_relative": "37m ago"}], "cfa": [{"title": "AirBaltic files for Chapter 11 bankruptcy in New York", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Sep 2026, 01:01 PM IST", "pub_date_relative": "8m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Iran says it destroys U.S. advanced drone over Hormuz as Middle East conflict intensifies", "full_content": "Iranian military said it has destroyed an advanced American drone over the Strait of Hormuz, the latest exchange as Tehran and Washington trade warnings and strikes with no sign of de-escalation.\n\nThe Islamic Revolutionary Guard Corps said Monday that its \"new advanced aerospace defence system\" intercepted and destroyed an advanced MQ-1 drone over the Hormuz strait, without providing further details on the drone's mission. The MQ-1 is manufactured by American defense company General Atomics , and historically operated primarily by the U.S. Air Force and the CIA.\n\nThe incident followed a series of Iranian operations against U.S. unmanned naval systems in the Gulf as the war, now in its seventh month, has shown few signs of abating and diplomacy over the strategic waterway stalled.\n\nOn Sunday, President Donald Trump said the U.S. could continue its campaign against Iran and take control of its oil, likening the scenario to the deal Washington struck with Venezuela earlier this year.\n\n\"We'll ultimately get out (of the war), unless we decide to stay and keep the oil like Venezuela,\" Trump said of the Iran conflict Sunday at the Irish Open golf championship in Ireland. He added that U.S. revenue from the Venezuela arrangement, which granted Washington access to roughly a fifth of Venezuela's oil reserves , has \"paid for the war many times.\"\n\nUnder the agreement reached in August, Venezuela ceded majority U.S. control of more than 65 billion barrels of oil reserves \u2014 more than double America's own reserves \u2014 in exchange for $209 billion to Venezuela's state treasury.", "source": "CNBC Top News", "pub_date_str": "14 Sep 2026, 12:54 PM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Financial Statement Analysis", "Fixed Income"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Motilal Oswal Nasdaq Q50 ETF jumps 41% in a week even as underlying US stocks fall. What is happening?", "full_content": "The Motilal Oswal Nasdaq Q50 ETF has seen an extraordinary jump in its market price over the past week, even as the value of the US stocks it holds has moved lower.\n\nBetween 4 and 10 September, the ETF' s price on the stock exchange rose 41%, from \u20b9 141.99 to \u20b9 199.89. Over the same period, the value of the 50 stocks in its portfolio fell 2.6%, according to Value Research data.\n\nThe divergence has pushed the ETF's market price well above its NAV. On 10 September, its NAV was \u20b9 115.69, compared with a closing market price of \u20b9 199.89. This represented a premium of 72.8%, according to Value Research.\n\nThe sharp increase in the premium has been linked to limited availability of units in the ETF, strong demand on the exchange and a recent change in the rules governing ETF price bands.\n\nAn ETF's NAV reflects the value of the securities held by the fund. Its market price, meanwhile, is determined by buying and selling on the stock exchange.\n\nNormally, the two prices remain relatively close because ETF units can be created when demand increases. The additional units provide more supply in the market and help keep the traded price aligned with the value of the underlying portfolio .\n\nFor international ETFs such as the Nasdaq Q50, that mechanism has been constrained by India's overseas investment limits.\n\nThe overseas investment limit for ETFs was reached in April 2024, after which fresh units could not be created in the same manner. With the supply of existing units limited, an increase in demand can instead show up as a higher market price.", "source": "LiveMint Money", "pub_date_str": "14 Sep 2026, 12:54 PM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Trump urges Ukraine to stop \u2018knocking out\u2019 Russian oil refineries as U.S. diesel hits record", "full_content": "U.S. President Donald Trump has urged Ukrainian President Volodymyr Zelenskyy to stop targeting Russian oil refineries, saying the attacks are \"hurting the world\" as fuel supply disruptions from the Ukraine and Iran wars propel U.S. diesel prices to a record high.\n\nUkraine has stepped up its attacks on Russian oil facilities and logistics infrastructure in recent months, seeking to raise the cost of the war for Moscow after more than four-and-a-half years of conflict.\n\nThe attacks have significantly hampered Russia's refining capacity and prompted widespread fuel shortages, with Moscow recently extending a ban on diesel exports through the end of September as part of a push to stabilize domestic supplies.\n\n\"Mr. Zelenskyy has to do one thing. He has to stop knocking out diesel fuel in Russia,\" Trump said during an official visit to Ireland on Sunday.\n\n\"Let him go after targets but not diesel fuel because he's causing a shortage of diesel. This isn't done by the Middle East; this is done by what's happening with Russia and Ukraine.\"\n\nA spokesperson for Ukraine's Foreign Ministry was not immediately available to comment when contacted by CNBC on Monday morning.\n\nUkraine, which fears an extremely difficult winter period amid expectations of another Russian assault on its energy infrastructure, has previously characterized Russian oil refineries as legitimate military targets.\n\nTrump's warning comes shortly after the price of diesel, a critically important fuel for everything from heavy-duty transportation and commercial shipping to industries like mining and agriculture, topped $6 per gallon for the first time ever on Friday.", "source": "CNBC Top News", "pub_date_str": "14 Sep 2026, 12:52 PM IST", "pub_date_relative": "18m ago", "cfa_topics": ["Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Health insurance portability: How underwriters filter out the policyholders who need it most", "full_content": "Every renewal cycle, an all-too-familiar friction plays out across Indian households. Consider a 62-year-old retired teacher who, exasperated by delayed claim settlements and another steep premium hike, decides to move her coverage to a rival insurer.\n\nShe expects her decade of policy continuity and waiting-period credits to transition seamlessly. Instead, after weeks of paperwork and medical evaluations, her application is turned down without a clear explanation. Left with no realistic alternative at her age, she quietly renews with her existing insurer.\n\nHer predicament captures a structural blind spot in retail health insurance: portability is merely a right to apply, not a guaranteed transfer.\n\nAccording to Suresh Mathur, former executive director at the Insurance Regulatory and Development Authority of India ( Irdai ), while the framework was introduced in 2011 to dismantle customer lock-ins, its real-world execution remains heavily constrained by commercial underwriting.\n\nWhen the regulator introduced the portability mandate, the intent was to empower policyholders to vote with their feet, Mathur noted. The rules established that accrued benefits\u2014specifically, waiting periods served for pre-existing diseases and accumulated bonuses\u2014must be transferred to the new insurer. However, destination insurers retain the statutory prerogative to underwrite every incoming proposal from scratch.\n\nThis discretion creates an acute selection bias, he said. Insurers compete aggressively for young, healthy policyholders through instant digital approvals. But for senior citizens, diabetics, or individuals with recent hospitalisations, the underwriting gates narrow sharply.\n\nThose with the strongest reasons to exit an underperforming insurer are precisely the profiles underwriters avoid. When older applicants are accepted, policies frequently arrive laden with heavy premium loadings, mandatory co-payments, or fresh exclusions.", "source": "LiveMint Money", "pub_date_str": "14 Sep 2026, 12:51 PM IST", "pub_date_relative": "18m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Exclusive-IPO for humanoid robot maker Boston Dynamics unlikely in 2027, executive says", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Sep 2026, 12:48 PM IST", "pub_date_relative": "21m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Stock futures fall as investors weigh AI safety concerns, oil gains: Live updates - cnbc.com", "full_content": "Stock futures fall as investors weigh AI safety concerns, oil gains: Live updates cnbc.com AI-linked stocks slump after top lab CEOs call for slowing technology's development Reuters Asian shares are mixed and OpenAI investor SoftBank shares plunge after calls to slow AI industry AP News Futures Fall; AI Leaders' Call For Slowdown Hits These Stocks Investor's Business Daily Anthropic\u2019s AI Warning May Weigh on Chips, But Trade Seen Intact bloomberg.com", "source": "Google News Business", "pub_date_str": "14 Sep 2026, 12:48 PM IST", "pub_date_relative": "22m ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "FTSE 100 today: Stocks gain as Mideast supply fears lift oil", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Sep 2026, 12:44 PM IST", "pub_date_relative": "25m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Yen appreciation has carry-trade seekers looking at these two currencies", "full_content": "The Japanese yen's recent appreciation has investors looking elsewhere for carry-trade funding, with the currencies of China and Canada eyed as potential replacements.\n\nThe yen, the best-performing G10 currency, has appreciated around 6% against the dollar since late July, when authorities intervened in currency markets, according to LSEG data.\n\nSpeculators flipped net long on the yen in the week to Sept. 8, according to the Commodity Futures Trading Commission. Such positions totaled around 10,800 contracts, compared to around 92,200 yen short positions the prior week.\n\nHawkish commentary from Bank of Japan board members, which left open the possibility of accelerated rate hikes, has helped strengthen the yen in a way the historic joint U.S.-Japan currency intervention couldn't. Plus, Treasury Secretary Scott Bessent continued to warn speculators about betting against the yen, saying last week, \"I am the house now.\"\n\nThat all makes the yen less attractive for carry trades, where investors borrow in low-yielding assets to invest in higher-yielding ones.\n\nThe Chinese yuan is being floated as a contender, according to Bank of America.\n\n\"I like to quip that Japan is becoming like China was 20 years ago, and China is becoming like Japan\" concerning deflation, said Claudio Piron, head of Asia forex and rates.\n\n\"The openness of the capital account of China is much more restricted than that of Japan,\" he said on \"Squawk Box Asia\" on Friday. \"But we've seen a lot of issuance in CNH [offshore yuan] bonds, and a lot of foreign multinational companies seek funding and issuance in those markets.\"", "source": "CNBC Top News", "pub_date_str": "14 Sep 2026, 12:40 PM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Economics", "Fixed Income", "Derivatives", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "ETMarkets Smart Talk | Retail traders lost \u20b91.8 lakh crore in F&O: Can algo trading change the game? Rakesh Pujara explains", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Expert Views \u203a ETMarkets Smart Talk | Retail traders lost \u20b91.8 lakh crore in F&O: Can algo trading change the game? Rakesh Pujara explains Angel One Share Price Choice International Share Price JM Financial Share Price IIFL Capital Services Share Price Anand Rathi Share & Stock Brokers Share Price The Economic Times daily newspaper is available online now. Read Today's Paper ETMarkets Smart Talk | Retail traders lost \u20b91.8 lakh crore in F&O: Can algo trading change the game? Rakesh Pujara explains SECTIONS ETMarkets Smart Talk | Retail traders lost \u20b91.8 lakh crore in F&O: Can algo trading change the game? Rakesh Pujara explains By Kshitij Anand , ETMarkets.com Last Updated: Sep 14, 2026, 12:32:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis More than 90% of individual F&O traders lost money between FY22 and FY24, with retail losses reaching around \u20b91.8 lakh crore. With algorithmic trading now widespread, automation could help level the playing field by giving retail investors access to tools once largely available to institutions, says Rakesh Pujara of Compounding Wealth Advisors.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "14 Sep 2026, 12:32 PM IST", "pub_date_relative": "37m ago", "cfa_topics": ["Quantitative Methods", "Equity Investments"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "Novo Nordisk rebrands to 'Novo,' unveils corporate changes as it fights for obesity market share", "full_content": "Novo Nordisk on Monday said it is rebranding its name to \"Novo\" and updating its corporate culture, as the company works to win back market share in the obesity drug space.\n\nThe Danish drugmaker called the changes the beginning of a new chapter, as it has been grappling with stiff competition from chief rival Eli Lilly and investor pressure to deliver new blockbuster products and chart a path toward long-term growth. Novo is preparing to detail its business strategy changes during its Capital Markets Day event on Sept. 21.\n\nIn a release, Novo also announced a broader company rebrand focused around the phrase \"Lasting Health Starts Now,\" which promotes the idea that patients should make progress toward long-term well-being immediately rather than later. The company said the marketing is a bid to build relevance and trust with the public and other stakeholders, and bring \"breakthrough science closer to people's daily lives.\"\n\nShares of Novo have dropped about 15% this year despite the successful launch of the oral version of Wegovy, which surpassed 3 million prescriptions as of June. The company recently scrapped three trials on an experimental cardiovascular drug. That challenge came as it continues to lag in the obesity space with 38.8% market share compared to Lilly's 60.9% in the second quarter, according to a Lilly earnings presentation citing IQVIA data.\n\nNovo Nordisk will remain the legal name for the company, according to the release.", "source": "CNBC Top News", "pub_date_str": "14 Sep 2026, 12:30 PM IST", "pub_date_relative": "40m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "U.S. Treasury yields are steady as 10-year closes in on 5% ahead of Fed rates decision", "full_content": "U.S. Treasury yields were little changed, tracking multiyear highs, on Monday as bond markets assessed the latest consumer price report for August ahead of this week's Federal Reserve interest rate decision.\n\nOdds that the Federal Reserve will raise interest rates by a quarter percentage point at its policy meeting are at 86.7%, based on trading in 30-day fed funds futures at the Chicago Mercantile Exchange.\n\nThe 2-year Treasury note yield, the most sensitive to short-term Federal Reserve interest rate policy, was down by 3 basis points at 4.611% as of 2:09 a.m. ET on Monday, after touching its highest level since July 2024 last week. The 10-year U.S. Treasury note yield \u2014 which influences mortgages, auto loans and credit card debt \u2014 fell by 1 basis point to 4.968%. The benchmark yield rose to 4.992%, its highest level since October 2023, on Friday.\n\nThe longer-dated 30-year Treasury bond yield, more sensitive to geopolitical risks, was last little changed at 5.359%.\n\nOne basis point equals 0.01%, and yields and prices move in opposite directions.\n\nIt comes after data from the Bureau of Labor Statistics on Friday that showed the consumer price index rose by a seasonally adjusted 0.4% last month, putting the 12-month increase at 3.4%. Both readings matched the Dow Jones consensus while remaining far above the central bank's goal of 2% inflation.\n\nThe report is the final major inflation indicator the Fed will see before it holds its policy meeting this week, with a vote on its key interest rate, which currently stands at 3.50% to 3.75%.\n\nThe 10-year Treasury yield is once again closing in on the psychologically important 5% threshold. For investors, the biggest issue may be what drives it across the line.", "source": "CNBC Top News", "pub_date_str": "14 Sep 2026, 12:23 PM IST", "pub_date_relative": "46m ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Derivatives", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Indiabulls shares to be in focus on Tuesday | Here's why", "full_content": "Indiabulls share price will remain in focus on Tuesday, 15 September, after the company announced it has entered into a definitive agreement with Fintech Cloud to acquire a 70% stake in the company.\n\nIndiabulls shares closed 5% higher on Friday, ending the session at \u20b9 25.89 apiece on BSE.\n\nIn an exchange filing on Friday, September 11, Indiabulls said that it has signed a definitive agreement to acquire a 70% stake in Fintech Cloud Private Ltd for \u20b9 1,050 crore, implying a valuation of \u20b9 1,500 crore for the company.\n\nThe acquisition will be undertaken through a scheme approved by the National Company Law Tribunal (NCLT), under which Indiabulls will also assume control of Fintech Cloud\u2019s board.\n\nFintech Cloud is a technology solutions provider that operates as a Loan Service Provider (LSP) for regulated entities. It offers technology-driven solutions and support to Non-Banking Financial Companies (NBFCs) across loan origination, underwriting and servicing.\n\nAs part of the proposed transaction, Indiabulls will acquire a 70% stake in Fintech Cloud\u2019s issued, subscribed and paid-up equity share capital. It will also have the right to appoint a majority of directors to the target company\u2019s board with immediate effect.\n\nThe \u20b9 1,050 crore acquisition consideration will be paid by issuing up to 21 crore fully paid-up equity shares of Indiabulls to the shareholders holding the 70% stake in Fintech Cloud.\n\nThe share issuance will be undertaken through an NCLT-approved Scheme of Amalgamation and will comply with applicable pricing norms, including those prescribed under the Securities and Exchange Board of India (SEBI) Issue of Capital and Disclosure Requirements (ICDR) regulations.", "source": "LiveMint Markets", "pub_date_str": "14 Sep 2026, 12:22 PM IST", "pub_date_relative": "47m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "India's wholesale inflation accelerates to 9.92% in August from 9.78% in July", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Indicators \u203a India's wholesale inflation accelerates to 9.92% in August from 9.78% in July The Economic Times daily newspaper is available online now. Read Today's Paper India's wholesale inflation accelerates to 9.92% in August from 9.78% in July SECTIONS India's wholesale inflation accelerates to 9.92% in August from 9.78% in July ET Online Last Updated: Sep 14, 2026, 12:48:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India\u2019s wholesale inflation accelerated to 9.92% in August from 9.78% in July, slightly above the 9.89% expected in a Reuters poll. Consumer inflation data is due later on Monday and is expected to hit a 20-month high, driven by higher food and fuel prices.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\nFour rules made HDFC Bank a compounder. All four have stopped. Can the new CEO rewrite them?\n\nGold rush on Dalal St as regional jewellers bid to be the next Tanishq\n\nHormuz is a state, not a strait. There are 10 other possible chokepoints for the global economy, including India\n\nBigger or Better: One order from Power Grid Corp added $1 billion to the market cap of a company \u2013 Final part\n\nBanks have received a flood of money. Now comes the real test\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "14 Sep 2026, 12:11 PM IST", "pub_date_relative": "58m ago", "cfa_topics": ["Economics", "Equity Investments", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Dividend stocks alert, record date: Last chance to buy - Blue Dart, Karnataka Bank, Aarti Pharma, ITDC | Full list", "full_content": "Dividend alert: Shares of Blue Dart Express Limited, Karnataka Bank Limited, Aarti Pharmalabs Limited, Dilip Buildcon, Hexagon Nutrition, Aarti Pharmalabs, etc will remain in focus during Tuesday\u2019s intraday trading session due to their scheduled dividend record dates.\n\nThese companies have fixed Tuesday (September 15) as the dividend record date to determine the eligibility of     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
