en to a diplomatic solution to the conflict that has disrupted energy markets for eight months.\n\nU.S. West Texas Intermediate futures shed 7.4% to close at $96.46 a barrel, the biggest daily loss since July 27. Brent crude , the international benchmark, lost 7.6% to settle at $104.77 a barrel.\n\nPresident Donald Trump told reporters Monday that Iran wants to \"make a deal and that could happen.\" U.S. Secretary of State Marco Rubio said over the weekend that Trump prefers not to use military force against Iran and would like to resolve the conflict diplomatically.\n\nTrump has previously said that he will not attack Iran before the U.S. midterms. But the oil market had priced in the risk of a major military escalation after the elections, gaining more than 10% in October.\n\nThe oil market has sold off during previous phases of the war on rumors of a possible settlement, only for the conflict to subsequently escalate and spike prices again.\n\nBrent Trump \"hasn't made a decision\" on whether to strike Iran again, Rubio told reporters.\n\n\"What the president expresses to you is incredible confidence that if we needed to do something militarily, we would have the ability to do it,\" the secretary of State said. \"But we would prefer to do it peacefully.\"\n\nIran's President Masoud Pezeshkian said Tehran is seeking to resolve problems through dialogue, according to state-owned Islamic Republic News Agency . Iran's Supreme Leader Ayatollah Mojtaba Khamenei has granted the government certain authorities to do this, Pezeshkian said.", "source": "CNBC Top News", "pub_date_str": "03 Nov 2026, 01:49 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Wall Street Braces for Biggest Treasury Sales Overhaul in Years - Bloomberg.com", "full_content": "Wall Street Braces for Biggest Treasury Sales Overhaul in Years Bloomberg.com See more headlines & perspectives on Google News", "source": "Google News Business", "pub_date_str": "03 Nov 2026, 01:40 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "El Nino could add to US inflation pressures in 2027, San Francisco Fed paper warns", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a El Nino could add to US inflation pressures in 2027, San Francisco Fed paper warns Powered By The Economic Times daily newspaper is available online now. Read Today's Paper El Nino could add to US inflation pressures in 2027, San Francisco Fed paper warns SECTIONS El Nino could add to US inflation pressures in 2027, San Francisco Fed paper warns ETMarkets.com Last Updated: Nov 03, 2026, 01:31:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis A San Francisco Fed study warns the current strong El Ni\u00f1o could drive US inflation up by 1 percentage point in 2027, despite temporarily boosting jobs. With inflation already above the 2% target, the climate shock adds further pressure on the Fed to raise interest rates.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "03 Nov 2026, 01:31 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Trump Account holders to receive SpaceX stock from Gwynne Shotwell in December", "full_content": "Eligible Trump Account holders will begin receiving donated shares of SpaceX stock next month, according to an X post on Friday.\n\n\"Robert and I are thrilled that our gift of over 2 million shares of SpaceX stock will be distributed to children's Trump accounts in December!\" President and COO Gwynne Shotwell wrote in the post.\n\nThe gift from Shotwell and her husband will provide a share apiece to around 2 million Trump Accounts holders ages 11 to 17 who live in ZIP codes with median family incomes of $57,000 or less, or in ZIP codes with too few residents for a median family income to be reported by the U.S. Census Bureau. These families should receive a notice by Monday, Shotwell wrote on X.\n\n\"In a few weeks, an additional gift will be finalized for eligible 11 to 17-year-old children in military families serving overseas, children in foster care, and more children whose MFI is $90,000 or less living in counties near our home in the great state of Texas,\" she also wrote.\n\nParents or guardians can check eligibility for the donation through Invest America, a nonprofit advocacy group, and track account activity with the Trump Accounts app .\n\nTrump Accounts, also known as 530A accounts, are open to any U.S. child under 18 with a Social Security number.\n\nChildren born from 2025 through 2028 may also receive a one-time $1,000 deposit from the U.S. Department of the Treasury.\n\nOther funds may also be available, depending on certain criteria. In a separate funding announcement in October, Elon Musk wrote in an X post that he plans to give every kid in America a share of SpaceX sometime in 2027, which may also come via Trump Accounts .", "source": "CNBC Top News", "pub_date_str": "03 Nov 2026, 01:16 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Govt consults seed, fertiliser firms on easing regulatory hurdles", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Agriculture \u203a Govt consults seed, fertiliser firms on easing regulatory hurdles The Economic Times daily newspaper is available online now. Read Today's Paper Govt consults seed, fertiliser firms on easing regulatory hurdles SECTIONS Govt consults seed, fertiliser firms on easing regulatory hurdles By Shambhavi Anand , ET Bureau Last Updated: Nov 03, 2026, 12:57:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Indian government is engaging with agricultural companies to address regulatory challenges that affect the sector. Consultations focus on updating the Seeds Act, 1966, to align with modern agricultural technology. Industry representatives have pointed out delays in approvals and licensing processes that hinder market access.\n\nSome elections matter more than you know: No crop changed in the fields, yet sugar, coffee and soya got cheaper in a day\n\nYou can buy a walkie-talkie online. But can you legally use it?\n\nKYB and KYC: Quick commerce, the Damani premium and what DMart must deliver \u2013 3rd and concluding part\n\nKYC and KYB: Inside Damani\u2019s DMart, the retail chain for the middle class. And stock for the long term? \u2013 Part 2 of 3\n\nWill it be a regulatory nightmare if an exchange lists on its own platform?\n\nKYC and KYB: Inside Damani\u2019s Avenue Supermarts that refuses to charge more \u2013 Part 1 of 3\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "03 Nov 2026, 12:57 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Manufacturing activity eases in Oct as new order growth drops", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Indicators \u203a Manufacturing activity eases in Oct as new order growth drops The Economic Times daily newspaper is available online now. Read Today's Paper Manufacturing activity eases in Oct as new order growth drops SECTIONS Manufacturing activity eases in Oct as new order growth drops ET Bureau Last Updated: Nov 03, 2026, 12:52:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Manufacturing activity in India experienced a slowdown in October, decreasing from the previous month's growth. Despite this, the sector remained above its long-run average due to stronger international demand. A survey indicated that nearly 18% of manufacturers anticipated increased output over the next year, supported by fresh client inquiries.\n\nSome elections matter more than you know: No crop changed in the fields, yet sugar, coffee and soya got cheaper in a day\n\nYou can buy a walkie-talkie online. But can you legally use it?\n\nKYB and KYC: Quick commerce, the Damani premium and what DMart must deliver \u2013 3rd and concluding part\n\nKYC and KYB: Inside Damani\u2019s DMart, the retail chain for the middle class. And stock for the long term? \u2013 Part 2 of 3\n\nWill it be a regulatory nightmare if an exchange lists on its own platform?\n\nKYC and KYB: Inside Damani\u2019s Avenue Supermarts that refuses to charge more \u2013 Part 1 of 3\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "03 Nov 2026, 12:52 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Fed will vote on rates less often. What that could mean for borrowers", "full_content": "After the Federal Reserve held its benchmark interest rate steady last week, Fed Chairman Kevin Warsh announced plans to reduce the number of rate-setting votes over the next two years. That move could potentially extend the timeline for everyday Americans to see borrowing costs adjust, some experts say.\n\n\"Fewer Fed meetings in 2027 could mean consumers wait longer to see relief when borrowing costs are elevated,\" said James Vrachas, executive director at advisory firm Post Oak Group.\n\nAmericans may feel somewhat removed from the Fed, but the central bank's moves have a ripple effect on many types of consumer products, including the borrowing rates for credit cards , home loans and auto financing.\n\nFor example, most credit cards have variable rates tied to the prime rate, which moves with the Fed's benchmark. However, even with the central bank holding rates unchanged, credit card rates are edging higher as issuers protect themselves from risk, according to LendingTree.\n\nCard issuers are mitigating their exposure from borrowers who may fall behind on payments or default in the face of stubborn inflation in everyday expenses, said Matt Schulz, LendingTree's chief credit analyst.\n\nGenerally, card issuers are slow to bring rates down, unless prompted by the Fed's actions, said Schulz: \"Issuers will tinker with rates a bit at the margins at other times, but the big moves tend to only come when issuers are pushed.\"\n\nOn Oct. 28, the central bank voted to keep the benchmark borrowing rate at the current target range of 3.75% to 4% as policymakers deliberated next steps with inflation remaining well above the Fed's 2% goal.\n\nThe Fed will keep meeting eight times a year, Warsh said at the news conference following the October meeting, but next year, one of the eight meetings will not entail a vote on interest rates or include a post-meeting statement.", "source": "CNBC Top News", "pub_date_str": "03 Nov 2026, 12:51 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Judge tosses DOJ case against ex-FBI officials accused of lying about Hunter Biden probe", "full_content": "A federal judge on Monday blasted the Department of Justice for \"weaponization\" as he dismissed its case accusing two former FBI officials of lying to Congress about investigations into Hunter Biden , multiple news outlets reported.\n\nMagistrate Judge Zia Faruqui, in a hearing in U.S. District Court in Washington, reportedly tore into the DOJ over its \"slapdash job\" prosecuting ex-officials Nikki Floris and Bradley Benavides, saying he was \"deeply troubled by what has happened here.\"\n\nFaruqui said the government lacked probable cause and failed to present evidence that the officials' statements before the House Judiciary Committee in 2023 were knowingly false, MS NOW reported.\n\nHe also accused the DOJ of wrongly rushing the case ahead of the midterm election . The situation \"cannot be described as anything other than weaponization,\" he said, according to MS NOW.\n\nThe judge even apologized to the government's lawyers, calling it \"incredibly unfai     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
