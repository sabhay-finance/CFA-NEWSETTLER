    const allData = {"general": [{"title": "Siemens\u2019 order book shines, but input costs remain a concern", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nSiemens\u2019 strong order pipeline in the September quarter (Q2FY27), healthy execution and improving sequential margins suggest that the capital expenditure cycle is gathering momentum. But rising input costs weighed on profitability, raising questions about how much of the growth opportunity can translate into earnings.\n\nConsolidated Q2 revenue increased 17% year-on-year to \u20b9 5,734 crore, with broad-based growth taking it ahead of analyst estimates. The smart infrastructure business led the way, clocking 20% revenue growth to \u20b9 3,281 crore. Mobility and digital industries grew 14% and 8% to \u20b9 1,291 crore and \u20b9 1,150 crore, respectively.\n\nSmart infrastructure is expected to maintain its momentum, as investments in power distribution, grid modernisation, renewable energy integration and data centres create a favourable demand environment. Battery storage , electronics manufacturing and EV charging infrastructure offer additional opportunities.\n\nMotilal Oswal Financial Services expects the segment to clock a 17% revenue CAGR over FY26-FY29, with Ebit margin ranging between 11% and 14%. As the segment gradually transitions from a hardware-centric business towards a solutions-led one, with a greater contribution from value-added products, software and services, Nomura expects its Ebit margin to improve from around 10% in H1FY27 to 13% by FY29.\n\nMobility could receive a leg-up from a ramp-up in locomotive deliveries, even as the broader railway, transportation and industrial capex cycles pick up pace. But its Ebit margin remains a concern, having compressed 364 basis points (bps) year-on-year to 7.5%. Digital industries\u2019 Ebit margin compressed by 200bps to 5%, but Motilal Oswal believes the metric has stabilised around this level.", "source": "LiveMint Markets", "pub_date_str": "11 Nov 2026, 01:20 PM IST", "pub_date_relative": "2m ago"}, {"title": "Alibaba announces plans to list T-Head, its Nvidia chip rival", "full_content": "Chinese tech and e-commerce giant Alibaba announced late Tuesday that the Hong Kong Stock Exchange will allow the company to spin off its semiconductor subsidiary T-Head.\n\nTo do so, Alibaba said it plans a public offering for shares of T-Head in Hong Kong, subject to approval from the exchange and the China Securities Regulatory Commission.\n\nThe filing did not disclose a date or proposed size of a listing.\n\nAlibaba noted it had already filed confidentially on Sept. 11 to list T-Head on the Hong Kong Stock Exchange.\n\nMeanwhile, Hong Kong-listed shares of Alibaba traded 1% lower Wednesday morning. The stock is down about 29% year-to-date.\n\nIn late September, Alibaba announced its next-generation AI chip, the Zhenwu V900, that it said delivers three times the performance of its predecessor, the Zhenwu M890 released in May.\n\nAlibaba is one of several Chinese companies, including Huawei, developing homegrown semiconductors to power artificial intelligence, amid growing U.S. restrictions on China's ability to access the chips.\n\nShort seller Culper Research alleged in May that Alibaba was able to obtain restricted Nvidia chips by indirectly financing entities in Southeast Asia . Alibaba did not immediately respond to a request for comment.", "source": "CNBC Finance", "pub_date_str": "11 Nov 2026, 01:17 PM IST", "pub_date_relative": "4m ago"}, {"title": "Techstep Q3 2026 slides: EBITA turns positive as cost cuts accelerate", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Nov 2026, 01:15 PM IST", "pub_date_relative": "6m ago"}, {"title": "Astor Group reports 218% revenue surge in third quarter", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Nov 2026, 01:14 PM IST", "pub_date_relative": "7m ago"}, {"title": "Amex makes U-turn on reward points deductions after complaints from cardholders", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nNEW DELHI: Several American Express (Amex) credit cardholders woke up on 9 November to find that thousands, and in some cases lakhs, of reward points had disappeared from their accounts. Some even found their rewards balances in the negative. These were points that did not expire as long as customers held at least one active card, with rewards earned across multiple cards accumulated in a common pool.\n\nMint spoke to five affected Amex cardholders, who confirmed deductions from their accounts, with some reporting losses running into lakhs of points.\n\nBy the night of 10 November, Amex had moved to reverse the deductions following a spate of complaints from cardholders. Many had threatened to escalate the matter to the Reserve Bank of India Ombudsman if the issuer failed to resolve the issue or provide a clear breakdown of how the deductions had been calculated.\n\nEmails signed by Sanjay Khanna, chief executive officer of American Express Banking Corp., India, were sent to several cardholders on 10 November, saying the deducted points would be restored and credited to one of their active Amex card accounts within 48\u201372 hours. Mint has seen the email sent to an Amex cardholder.\n\nIn response to Mint's queries, Amex said the adjustments to membership rewards points balances on 9 November were in line with its applicable terms and conditions, which stipulate that unredeemed points associated with cancelled cards are forfeited 30 days after cancellation. \u201cAfter carefully considering the concerns shared by our Card Members, we have decided to reverse these adjustments.", "source": "LiveMint Money", "pub_date_str": "11 Nov 2026, 01:12 PM IST", "pub_date_relative": "9m ago"}, {"title": "HDFC Defence Fund October 2026 portfolio: Active mutual fund adds 3 stocks; raises stake in BEL, Tata Motors and others", "full_content": "HDFC Defence Fund has reshuffled its portfolio in October 2026, increasing its holdings in five existing stocks and adding three new stocks. With these additions, the fund's total portfolio expanded to 27 stocks by the end of October.\n\nHDFC Defence Fund is India's only open-ended equity thematic scheme that invests mainly in equities of companies operating in the defence and allied sectors.\n\nThe fund manager has the flexibility to actively invest across segments such as aerospace and defence, auto components, chemicals and petrochemicals, industrial manufacturing, and other related industries.\n\nThe fund's assets under management (AUM) stood at \u20b9 11,493 crore as of 30 September 2026, declining to \u20b9 11,131 crore as of 31 October 2026.\n\nAs of 9 November 2026, HDFC Defence Fund delivered a one-year return of 21.04%, outperforming its benchmark, Nifty India Defence TRI, which returned 14.19%. However, over three years, the fund's return stood at 34.08%, lower than the benchmark's 39.70%.\n\nHere's how the fund's holdings changed between 30 September and 31 October 2026.\n\nBharat Electronics accounted for the largest increase in the fund's holdings. Its shareholding rose by 30.18 lakh shares, from 440 lakh shares in September to 470.18 lakh shares in October 2026.\n\nHDFC Defence Fund also increased its holdings in Tata Motors by 1.42 lakh shares, taking its total holding to 30.46 lakh shares. Its exposure to BEML rose to 30.11 lakh shares, while Bharat Forge holdings increased to 77.51 lakh shares. Bosch holdings also increased by 0.13 lakh shares to 1.13 lakh shares.", "source": "LiveMint Money", "pub_date_str": "11 Nov 2026, 01:12 PM IST", "pub_date_relative": "9m ago"}, {"title": "Earnings call transcript: Nissan posts H1 turnaround but shares slip on China weakness", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Nov 2026, 01:09 PM IST", "pub_date_relative": "12m ago"}, {"title": "RWE earnings beat estimates as strong energy trading lifts outlook", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Nov 2026, 01:09 PM IST", "pub_date_relative": "12m ago"}, {"title": "ITV warns Q4 ad revenue to fall 5-10% as demand weakens, cuts costs", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Nov 2026, 01:08 PM IST", "pub_date_relative": "14m ago"}, {"title": "ICG targets zero net debt, plans to return excess capital as H1 earnings rise 18%", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Nov 2026, 01:07 PM IST", "pub_date_relative": "14m ago"}, {"title": "Earnings call transcript: Ensurge trims costs, secures funding in Q3 2024", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Nov 2026, 01:07 PM IST", "pub_date_relative": "14m ago"}, {"title": "Foreign investors pull out $50 billion from Asian equities in October on AI, cash burn woes", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Nov 2026, 01:06 PM IST", "pub_date_relative": "15m ago"}, {"title": "Earnings call transcript: Techstep Q3 2026 loss narrows as cost cuts lift EBITA", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Nov 2026, 01:03 PM IST", "pub_date_relative": "19m ago"}, {"title": "Txo Partners director Bob Simpson buys $3.08M in common units", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Nov 2026, 01:01 PM IST", "pub_date_relative": "20m ago"}, {"title": "PepsiCo Layoffs: Why Is Beverage Manufacturer Cutting 1,000 Jobs? Here's All You Need To Know", "full_content": "PepsiCo plans to cut about 1000 jobs in North America to simplify its structure and improve decision making, says CEO Ram Krishnan.", "source": "NDTV Profit", "pub_date_str": "11 Nov 2026, 12:58 PM IST", "pub_date_relative": "23m ago"}, {"title": "Why Shakti Pumps shares are rising 11% today amid Sensex, Nifty rally? Buy for more returns? Target, upside, rationale", "full_content": "Shakti Pumps shares surged as much as 11% in Wednesday's trading session amid positive sentiments on Dalal Street. The stock opened at \u20b9 359 per share today, as compared to previous close of \u20b9 355.80 on Monday.\n\nIt is to be noted that there is no fundamental trigger behind the significant rally in Shakti Pumps shares. The stock witnessed a spurt in its trading volume as around 95.32 lakh shares changed hands on NSE during the intraday session on Wednesday.\n\nMeanwhile, Indian equity benchmarks, the Sensex and Nifty, opened Wednesday's session on a strong note, supported by foreign institutional inflows, better-than-expected September-quarter earnings and a continued decline in crude oil prices. The BSE Sensex surged 1,097.33 points to 82,186.92 in early trade, while the NSE Nifty 50 advanced 274.30 points to 25,317.55.\n\nShakti Pumps (India) reported a 12% year-on-year increase in consolidated revenue from operations to \u20b9 746 crore in Q2 FY27, compared with \u20b9 666.4 crore in the corresponding quarter last year. However, the company's profitability came under significant pressure during the quarter, with EBITDA declining 52.9% to \u20b9 64 crore from \u20b9 136 crore in Q2 FY26.\n\nThe company's EBITDA margin contracted sharply to 8.6% in the September quarter, compared with 20.4% in the year-ago period, reflecting pressure on operating profitability. Profit before tax (PBT) declined 59.3% year-on-year to \u20b9 49.5 crore from \u20b9 121.5 crore in Q2 FY26.\n\nShakti Pumps' consolidated profit after tax (PAT) fell 57.6% year-on-year to \u20b9 38.5 crore in Q2 FY27, against \u20b9 90.7 crore in the corresponding quarter of the previous financial year. Its PAT margin also declined to 5.2% from 13.6% a year ago.\n\nShakti Pumps (India) shares have witnessed a sharp recovery in the near term, gaining 10.04% over the past week.", "source": "LiveMint Markets", "pub_date_str": "11 Nov 2026, 12:52 PM IST", "pub_date_relative": "30m ago"}, {"title": "Q2 Results Live: Orient Green Net Profit Flat, But Margin Expands; Tata Power, GRSE, Hind Copper In Focus", "full_content": "The September-quarter earnings season continues with results due from Tata Power, Garden Reach Shipbuilders & Engineers, Hindustan Copper, Triveni Turbine, Power Mech Projects and other companies.", "source": "NDTV Profit", "pub_date_str": "11 Nov 2026, 12:47 PM IST", "pub_date_relative": "34m ago"}, {"title": "Indian Airlines Expand Premium Seats Despite Capacity Cuts, IndiGo Leads Push | Profit Exclusive", "full_content": "Indian carriers added 3.1% more premium seats in Winter Schedule 2026, with IndiGo accounting for the biggest expansion even as Air India and Air India Express cut capacity.", "source": "NDTV Profit", "pub_date_str": "11 Nov 2026, 12:44 PM IST", "pub_date_relative": "38m ago"}, {"title": "Gold Glitters, Silver Shine: Yellow Metal Prices Rise By Rs 1,400; White Metal Jumps By Rs 5,000", "full_content": "Precious metal prices recovered on MCX, with gold rising to Rs 1,41,670 per 10 grams and silver climbing to Rs 1,87,550 per kilogram amid a rebound in international bullion prices.", "source": "NDTV Profit", "pub_date_str": "11 Nov 2026, 12:40 PM IST", "pub_date_relative": "41m ago"}, {"title": "Found Bugs In Code, Flagged Security Risks, Still Rejected: Techie\u2019s Interview Tale Goes Viral", "full_content": "The rejection email acknowledged that the candidate had shown impressive technical abilities during the assessment.", "source": "NDTV Profit", "pub_date_str": "11 Nov 2026, 12:38 PM IST", "pub_date_relative": "43m ago"}, {"title": "Hijack Threat Note On Air India Plane: Kolkata-Mumbai Flight Moved To Isolation Bay, Security Checks Underway", "full_content": "A threat note warning of a hijack was found on an Air India flight from Kolkata to Mumbai, prompting a security alert at the airport.", "source": "NDTV Profit", "pub_date_str": "11 Nov 2026, 12:37 PM IST", "pub_date_relative": "45m ago"}, {"title": "Singapore wants a bigger slice of the global gold market. Is it too late to the party?", "full_content": "Singapore is stepping up efforts to become a major player in the global gold market, betting that a new central bank vaulting service and tax incentives will help it attract more bullion flows.\n\nThe Monetary Authority of Singapore on Tuesday launched a gold vaulting service for foreign central banks and sovereign entities, with an initial capacity of 500 metric tons.\n\nThe city-state also plans to introduce tax exemptions for certain wholesale gold-related services such as vaulting, refining, recasting, testing and broking. In June, Singapore unveiled plans for a physical gold clearing system to facilitate the settlement of bullion transactions in the city-state, with operations expected to begin in the first quarter of 2027.\n\nThe initiatives mark the country's latest attempt to establish itself as a key bullion hub alongside established centers such as London and Switzerland, as more gold trading activity shifts toward Asia.\n\nBut breaking into a market dominated by established trading hubs may prove an uphill battle. For instance, London vaults held about 9,850 metric tons of gold at the end of October, including commercial and central bank storage.\n\nThe push from Singapore also comes as rival Hong Kong is also expanding its gold storage and clearing infrastructure, leveraging its proximity to China, the world's largest gold market.\n\n\"Singapore is very late to the party as building up a physical hub requires volume when it comes to trade backed structures,\" said Juerg Kiener, chief investment officer at Swiss Asia Capital.\n\n\"The largest gold market is China and its window to the rest of the world is Hong Kong,\" he told CNBC, adding that Singapore is not well-positioned to compete with Hong Kong in gold-backed trade.", "source": "CNBC Top News", "pub_date_str": "11 Nov 2026, 12:32 PM IST", "pub_date_relative": "49m ago"}, {"title": "Trump\u2019s PERM Move Hits Indian IT Workers, Still Firms May Not Hire More Americans: Here\u2019s What\u2019s Next", "full_content": "Last month, the Trump administration announced a suspension of Permanent Labor Certification (PERM) applications involving eight companies.", "source": "NDTV Profit", "pub_date_str": "11 Nov 2026, 12:32 PM IST", "pub_date_relative": "49m ago"}, {"title": "CoreWeave stock jumps after earnings: 7 things driving the AI cloud company's rally", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News Powered By CoreWeave stock jumps after earnings: 7 things driving the AI cloud company's rally Written by Anupam Nagar , ETMarkets.com | Nov 11, 2026, 12:50:04 PM IST 1 / 7 CoreWeave shares surge after Q3 earnings beat CoreWeave shares climb as much as 8% in after-hours trading following stronger-than-expected third-quarter results. The AI cloud infrastructure provider reports robust revenue growth, raises its full-year outlook and highlights a $132.5 billion revenue backlog, reinforcing expectations of sustained demand for AI computing capacity. (Sources: Stocktwits | InvestingLive)\n\nCoreWeave reports third-quarter revenue of $3.66 billion, up 168% from $1.37 billion a year earlier. The figure also beats analyst expectations of approximately $3.54 billion. Revenue increases by more than $1 billion sequentially, reflecting strong demand for its AI infrastructure services.\n\nThe company's revenue backlog reaches approximately $132.5 billion at the end of September, compared with $104.2 billion at the end of June. The growing backlog signals strong customer commitments and provides greater visibility into future revenue, although delivery and service availability remain important conditions.\n\nCoreWeave raises its full-year 2026 revenue forecast to $13 billion-$13.3 billion. It also increases its adjusted operating income outlook to $1.275 billion-$1.375 billion and expects annualised run-rate revenue of $20 billion-$21 billion by the end of the year.\n\nDespite strong revenue growth, CoreWeave reports a net loss of $709 million, compared with $110 million a year earlier. Net interest expense rises to $846 million.", "source": "Economic Times Markets", "pub_date_str": "11 Nov 2026, 12:31 PM IST", "pub_date_relative": "51m ago"}, {"title": "Asian Stocks, Bonds to Drop as Fed Hike Bets Mount: Markets Wrap - Bloomberg.com", "full_content": "Asian Stocks, Bonds to Drop as Fed Hike Bets Mount: Markets Wrap Bloomberg.com Stocks moving the most after hours: Neocloud company CoreWeave shares swing after quarterly report CNBC Stocks rally as CoreWeave soothes, bonds reel on rate hike fears Reuters CoreWeave stock pops as Q3 revenue beats estimates, company raises full-year outlook Yahoo Finance CoreWeave Earnings Beat Expectations, Assuaging Market Nervousness Barron's", "source": "Google News Business", "pub_date_str": "11 Nov 2026, 12:30 PM IST", "pub_date_relative": "52m ago"}, {"title": "BMC Demolishes Iconic Juhu Chowpatty Vada Pav Stall; MMB Had Said Site Falls Under Its Jurisdiction", "full_content": "The BMC demolished a nearly 30-year-old vada pav stall at Juhu Chowpatty despite the MMB's objection, leaving the owner questioning the action.", "source": "NDTV Profit", "pub_date_str": "11 Nov 2026, 12:26 PM IST", "pub_date_relative": "55m ago"}, {"title": "Once AI darling of shareholders, Nvidia sued by own stock buyers over CEO Jensen Huang affair; $420 bn lost in 2 days", "full_content": "Nvidia Scandal : Nvidia, once a favourite among investors riding the artificial intelligence ( AI ) boom, is facing mounting scrutiny after shareholders filed a class-action lawsuit against CEO Jensen Huang and the company over his affair with Alice Huang, suspected of having links to Chinese intelligence.\n\nThe lawsuit has brought the chipmaker's leadership, corporate governance and potential national security exposure under the spotlight. The controversy also involves Singapore-based Megaspeed, the woman's former employer, which has faced scrutiny over suspected links to the movement of advanced Nvidia chips into China. Huang has acknowledged the affair and apologised.\n\nThe controversy has already taken a toll on Nvidia's market valuation. Its shares declined 4.27% on the New York Stock Exchange on Monday, wiping out $192.1 billion in market capitalisation in a single session. The AI stock extended its losses on Tuesday, down another 5.5% to $168.89 per share. Nvidia's market cap dropped to $4.08 trillion, wiping out over $420 billion in just two sessions.\n\nThe shareholder lawsuit has added to investor concerns, with plaintiffs arguing that the revelations and potential national security implications were responsible for the losses.\n\nA group of shareholders filed the lawsuit in the US District Court for the Northern District of California on Monday, accusing Huang and Nvidia of violating federal securities laws. They are seeking compensation for losses suffered after the revelations triggered a sell-off in the company's shares.\n\nThe plaintiffs argue that investor losses followed disclosures about Huang's relationship with Alice Huang and the potential national security risks associated with her former employer.\n\nAccording to the Financial Times, Alice Huang and Chinese business partner Kang Wei approached investors in early 2025 to raise hundreds of millions of dollars for a data centre project in Southeast Asia.", "source": "LiveMint Markets", "pub_date_str": "11 Nov 2026, 12:26 PM IST", "pub_date_relative": "55m ago"}, {"title": "October Mutual Fund Data: MF Industry Bounces Back As Total Net Inflows Stand At Rs 1.73 Lakh Crore", "full_content": "Mutual funds added approximately 3.06 lakh crore in the month under reviewafter recording total net outflow of Rs1.33 lakh crore in the month of September.", "source": "NDTV Profit", "pub_date_str": "11 Nov 2026, 12:22 PM IST", "pub_date_relative": "59m ago"}, {"title": "Nvidia's $470 Billion Sell-Off: Indian Mutual Funds That Have Exposure To The Chipmaker", "full_content": "Several Indian mutual fund schemes hold Nvidia shares, including diversified equity funds, as the chipmaker faces a potential $470 billion erosion in market value over two trading sessions.", "source": "NDTV Profit", "pub_date_str": "11 Nov 2026, 12:21 PM IST", "pub_date_relative": "1h ago"}, {"title": "SIP Inflows Fall To Rs 32,160 Crore In October; Equity MF Inflows Drop 14%", "full_content": "Overall, mutual funds recorded net inflows of Rs 1.73 lakh crore in October, compared with net outflows of Rs 1.33 lakh crore in September.", "source": "NDTV Profit", "pub_date_str": "11 Nov 2026, 12:21 PM IST", "pub_date_relative": "1h ago"}, {"title": "EPS-95 pensioners: EPFO says submit Digital Life Certificate from home using Umang app; here's step-by-step process", "full_content": "The Employees' Provident Fund Organisation (EPFO) has informed pensioners covered under the Employees' Pension Scheme 1995 about the facility to generate and submit their Digital Life Certificate (DLC) online through the Umang app.\n\nIn a post on X, the EPFO wrote, \u201cDear EPS-95 Pensioners, is your Jeevan Pramaan due for renewal? No need to step out! Submit your Digital Life Certificate from the comfort of your home using the UMANG App and Face Authentication Technology.\u201d\n\nEPS-95 pensioners should renew their Digital Life Certificate before it expires to avoid any disruption in pension payments. They can submit the certificate at any time during the year, and it remains valid for one year from the date of submission. Here is a step-by-step guide for submitting the certificate through the Umang app.\n\nPensioners can follow the steps below to generate and submit their Jeevan Pramaan.\n\nNo. Once successfully generated, the Digital Life Certificate is stored in the Jeevan Pramaan repository and is made available electronically to the pension disbursing agency. Pensioners do not need to submit a physical copy separately to the bank or EPFO. The Pramaan ID can be used to retrieve the certificate.\n\nDisclaimer: This is for informational purposes only. Pensioners should follow the latest instructions on the official EPFO and Jeevan Pramaan websites before submitting their Digital Life Certificate.\n\nSheetal Goel is a Content Producer at Livemint, where she covers corporate developments, personal finance, business trends, markets, and SEBI-related updates. She focuses on simplifying complex financial concepts and presenting them in a clear, reader-friendly manner, thereby helping audiences better understand investment trends, personal finance, and market developments. Her writing focuses on making finance more accessible to everyday readers while maintaining clarity, accuracy, and relevance.", "source": "LiveMint Money", "pub_date_str": "11 Nov 2026, 12:19 PM IST", "pub_date_relative": "1h ago"}, {"title": "Railway stocks on fast track! RVNL, IRFC jump up to 10% amid Sensex, Nifty rise | What's behind momentum? Key levels", "full_content": "Dhanya Nagasundaram Published 11 Nov 2026, 12:17 PM IST Prefer Livemint on Google Rail Vikas Nigam Ltd (RVNL) and Indian Railway Finance Corporation (IRFC) shares rallied as much as 10% on Wednesday, 11 November, amid a strong recovery in the broader equity market and renewed investor interest in railway stocks.\n\nIndian benchmark indices gained over 1% in morning trade, with the Nifty 50 rising 1.25% to 25,358 and the Sensex advancing 1.47% to 82,301.10 around 10:07 am. Both indices touched their highest levels since 27 February.\n\nThe broader market rally was supported by easing crude oil prices and a shift in global investment sentiment. According to a Reuters report, concerns over elevated artificial intelligence (AI) valuations and investment spending have prompted investors to reassess their global allocations, triggering fresh foreign fund inflows into Indian equities after an extended period of selling.\n\nAdding to the positive sentiment around railway stocks was a significant development in India's railway manufacturing sector. According to news reports, Japan has placed its first order for indigenously manufactured electronic train propulsion systems from India, marking a milestone for the country's railway technology and export ambitions.\n\nAccording to news reports, the development is particularly significant as propulsion systems account for nearly 40% of a train's total value. The order highlights India's growing capabilities in railway engineering and its potential to emerge as a supplier of advanced railway technologies to global markets.\n\nIndia has already exported railway components to countries such as Germany, France, Switzerland and the US.", "source": "LiveMint Markets", "pub_date_str": "11 Nov 2026, 12:17 PM IST", "pub_date_relative": "1h ago"}, {"title": "Stock futures rise as market tries to recover from Nvidia-led decline: Live updates", "full_content": "Stock futures rose early Wednesday following a losing session in which Nvidia, coupled with hotter-than-expected inflation data, pressured the broader market.\n\nDow Jones Industrial Average futures gained 92 points, or 0.18%. S&P 500 futures climbed 0.6%, while Nasdaq-100 futures advanced 1.43%.\n\nIn Asia, Japan's Nikkei 225 traded 0.85% higher on Wednesday. South Korea's Kospi was up 1.22%, while Australia's S&P/ASX 200 added 0.23%. Hong Kong's Hang Seng Index was down 0.66%, while the CSI 300 fell 0.39%.\n\nThe Dow pulled back more than 150 points in regular U.S. trading, while the S&P 500 and Nasdaq Composite shed 0.4% and 0.7%, respectively. At the center of the decline was Nvidia . The chipmaker pulled back 5.5%, as CEO Jensen Huang's affair with an alleged Chinese spy weighed on the stock for the second consecutive session.\n\nNvidia's two-day slide pulled the company's market cap down to around $4.07 trillion, its lowest since late March.\n\nEquities also fell on Tuesday after the latest U.S. inflation data solidified expectations for a December Federal Reserve rate hike. The consumer price index increased by 0.4% month over month in October , topping expectations.\n\nExpectations for a quarter-point rate increase next month rose to about 90% following the release, per the CME Group's FedWatch tool.\n\n\"Despite some technical uncertainty, higher than desired levels of inflation should keep the Fed in a stance of dissatisfaction with the degree of progress on inflation remaining lackluster, so hiking the Fed Funds policy rate in December is our and the market's base case,\" wrote Rick Rieder, CIO of global fixed income at BlackRock. \"The question now is more of one of the extent of the hike.\"", "source": "CNBC Top News", "pub_date_str": "11 Nov 2026, 12:13 PM IST", "pub_date_relative": "1h ago"}, {"title": "Nvidia Stock Sell-Off Deepens: Spy scandal, price target cuts put AI giant under pressure", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News Powered By Nvidia Stock Sell-Off Deepens: Spy scandal, price target cuts put AI giant under pressure Written by Anupam Nagar , ETMarkets.com | Nov 11, 2026, 12:27:08 PM IST 1 / 5 Nvidia stock loses 10% as sell-off intensifies Nvidia shares suffer a sharp decline, losing nearly 10% in a single session as investors react to mounting concerns surrounding CEO Jensen Huang, a broader technology sell-off and uncertainty over the artificial intelligence trade. The latest losses put the chipmaker under pressure just days before its quarterly earnings announcement scheduled for November 17. (Sources: Yahoo Finance, Investopedia)\n\nThe sell-off intensifies following reports that Nvidia CEO Jensen Huang may have been targeted by a suspected Chinese intelligence operation involving Alice Huang, a former executive at Singapore-based data centre company Megaspeed. Nvidia's board has launched an independent investigation into the matter, although the company says it has no reason to believe that national security or its proprietary technology has been compromised.\n\nThe latest decline wipes out hundreds of billions of dollars in Nvidia's market capitalisation, with shares falling to levels last seen in the spring. The stock is also heading towards its steepest monthly decline in years. Broader concerns about AI-sector valuations and uncertainty over future infrastructure spending add to the selling pressure.\n\nThe controversy triggers a fresh wave of analyst caution. Citi lowers its price target on Nvidia to $285 from $315, while Wells Fargo cuts its target to $300 from $315. Other analysts also reassess the risks, citing leadership uncertainty and potential regulatory scrutiny.", "source": "Economic Times Markets", "pub_date_str": "11 Nov 2026, 12:10 PM IST", "pub_date_relative": "1h ago"}, {"title": "Gold ETF Inflows Fall 22% To Rs 3,474 Crore In October, Silver ETFs See 56% MoM Jump: AMFI Data", "full_content": "Gold ETFs received net inflows of Rs 3,474.03 crore last month, down by nearly 22% from Rs 4,450.61 crore in September.", "source": "NDTV Profit", "pub_date_str": "11 Nov 2026, 12:04 PM IST", "pub_date_relative": "1h ago"}, {"title": "Oil traders give peace a chance (but should they?)", "full_content": "Plus Chris Waller, inflation hawk", "source": "FT Markets", "pub_date_str": "11 Nov 2026, 12:00 PM IST", "pub_date_relative": "1h ago"}, {"title": "From 13% Down To Near Flat: How Nifty And Sensex Recovered From War-Time Losses", "full_content": "The rebound, analysts believe, has come amid easing crude oil prices, hopes of de-escalation in West Asia, improving corporate earnings and a return of foreign portfolio investors (FPIs) to Indian equities.", "source": "NDTV Profit", "pub_date_str": "11 Nov 2026, 11:58 AM IST", "pub_date_relative": "1h ago"}, {"title": "Uber Parking: How It Works, What Users Can Expect And Where It Will Initially Be Available", "full_content": "To complete a reservation, users must provide vehicle details, including model and registration number.", "source": "NDTV Profit", "pub_date_str": "11 Nov 2026, 11:58 AM IST", "pub_date_relative": "1h ago"}, {"title": "Berger Paints hopes for gloss back on volume and margin after pale Q2", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nBerger Paints India\u2019s earnings estimates were downgraded after gross margin compression in the September quarter (Q2FY27) proved steeper than anticipated. Consolidated gross margin shrank 225 basis points (bps) year-on-year and 160 bps sequentially to 39.3%. Q2 saw the full impact of double-digit raw material inflation, liquidation of high-cost inventory and delayed price hikes in the industrial paint portfolio.\n\nCost efficiency initiatives helped curb Ebitda margin drop to 90 bps year-on-year, but it fell 530 bps sequentially to 11.6%, missing consensus estimate of 13%, dragged by additional spends in the Rang Bana Rahe campaign done to strengthen brand visibility and consumer engagement. Berger eyes 15-17% Ebitda margin in Q3FY27 and Q4FY27 driven by price hikes and operating leverage.\n\nDecorative volume growth was modest at 3%, lagging Asian Paints\u2019 6%. Double-digit value growth was driven by an approximately 8% price hike across the decorative portfolio.\n\nVolumes were hurt by festive demand shifting to Q3, rationalization of dealer rebates to cushion gross margins, extended rainfall in key eastern markets and a decline in sales of price-sensitive categories such as putty, textures and enamel. Berger expects robust demand growth in Q3 and said October\u2019s decorative sales growth was the highest in the past 25-30 months.\n\nTo mend margins, Berger plans more calibrated price hikes. How volumes respond amid elevated competition should be monitored.\n\nNew entrant Birla Opus \u2019 decorative paint prices are now in line with industry levels, after being nearly 5% lower, Berger said. While Berger\u2019s market share remained broadly stable at nearly 20.2% in H1FY27, competition remains a threat as Birla continues to offer higher dealer rebates.\n\nBerger is also strengthening its retail network, which exceeded 2,000 stores as of H1FY27, alongside a tinting machine network of 4,800.", "source": "LiveMint Markets", "pub_date_str": "11 Nov 2026, 11:57 AM IST", "pub_date_relative": "1h ago"}, {"title": "CLAT 2027 First Mock Test Released Ahead Of December 6 Exam", "full_content": "The Consortium of National Law Universities has advised applicants to ensure they have a stable internet connection when attempting the test.", "source": "NDTV Profit", "pub_date_str": "11 Nov 2026, 11:52 AM IST", "pub_date_relative": "1h ago"}, {"title": "Renu Desai Pens Cryptic Note After Pawan Kalyan's Separation From Anna Konidala", "full_content": "Renu Desai penned a cryptic note on social media saying if someone is going through a difficult time,' it is not right to criticise them.", "source": "NDTV Profit", "pub_date_str": "11 Nov 2026, 11:51 AM IST", "pub_date_relative": "1h ago"}, {"title": "Driver Seen Reporting Brake Failure Moments Before Assam Train Derailment | Watch", "full_content": "In the 45-second shaky video shared by NDTV, a man is heard saying, \"BP pressure kam nahi ho raha,\" referring to the brake pipe pressure not reducing.", "source": "NDTV Profit", "pub_date_str": "11 Nov 2026, 11:51 AM IST", "pub_date_relative": "1h ago"}, {"title": "'I Bought A Bengaluru Flat and It Returned 0% For Six Years. Then This Happened'", "full_content": "A Reddit user shared how holding a 1,900 sq ft 3BHK on Bengaluru's Harlur Road paid off.", "source": "NDTV Profit", "pub_date_str": "11 Nov 2026, 11:44 AM IST", "pub_date_relative": "1h ago"}, {"title": "Mint Explainer | US AI sell-off: Are Indian AI-linked stocks next?", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nA month of losses in US technology stocks has revived fears of an AI bubble. The sell-off has spread to Indian companies riding the AI buildout, from data centres to power and cooling suppliers. Though India lags in foundational AI, its listed firms are exposed to the global investment cycle. Are India's AI and IT stocks headed for a similar reckoning? Mint explores.\n\nIn September, Goldman Sachs identified 42 Indian companies outperforming global and Asian AI stocks. Of these, 34 fell an average 7% in October, a Mint analysis shows.\n\nAnant Raj, a data centre operator, and Himadri Speciality Chemical, a supplier of materials used in cooling systems, led the losses, falling 25% each. Bharti Airtel and Blue Star were among the few major gainers.\n\nThe sell-off mirrored a broader correction: the Nasdaq fell 5% in October, with Intel down 45%, Google 19%, and Meta 15%.\n\nInvestors are questioning whether generative AI can deliver returns to justify the hundreds of billions of dollars being invested in it. AI has yet to demonstrate consistent productivity gains or create higher-quality jobs to offset those displaced, while cybersecurity and sensitive enterprise data risks remain concerns.\n\nThe sell-off deepened as Amazon, Google , Microsoft and Meta pledged further data centre investments, even as some reported earnings below Street expectations. The question is no longer whether AI will grow, but whether it can generate enough revenue and profits to justify the spending.\n\nData centre infrastructure suppliers have been among the biggest beneficiaries. Goldman Sachs's September report valued the 42 identified companies at a combined $670 billion. These span power generation, transmission, electrical equipment and cooling, including Tata Power, Adani Green Energy, Cummins India and Blue Star. They stand to benefit from data centre expansion regardless of which AI platforms win.", "source": "LiveMint Markets", "pub_date_str": "11 Nov 2026, 11:43 AM IST", "pub_date_relative": "1h ago"}, {"title": "BSE Share Price Gains Over 2% After ICICI Securities Upgrades Rating To 'Add', Raises Target", "full_content": "ICICI Securities highlighted a sharp improvement in BSE's operating performance, with quarterly EBITDA, excluding the Settlement Guarantee Fund (SGF), rising to Rs 10.9 billion in Q2FY27 from Rs 1.9 billion in Q2FY24.", "source": "NDTV Profit", "pub_date_str": "11 Nov 2026, 11:42 AM IST", "pub_date_relative": "1h ago"}, {"title": "Why KPI Green Energy, Waaree Energies shares are rising today; over 5% jump amid post Diwali Sensex, Nifty fireworks", "full_content": "WAAREEENER Vaamanaa Sethi Published 11 Nov 2026, 11:41 AM IST Prefer Livemint on Google Indian energy stocks like KPI Green Energy and Waaree Energies jumped up to 5% in Wednesday's trading session amid strong rally in the Indian stock market after Diwali.\n\nWaaree Energies shares rallied 4.91% to hit an intraday high of \u20b9 2,613.30 apiece on Wednesday. Meanwhile, KPI Green shares advanced nearly 2% to \u20b9 347.75 per share during the trading session on November 11.\n\nMeanwhile, Indian equity benchmarks surged more than 1% on Wednesday, climbing to an eight-month high as softer crude oil prices and growing concerns over AI investments triggered foreign investor inflows, following nearly two years of sustained outflows. At 10:07 am IST, the Nifty 50 advanced 1.25% to 25,358, while the Sensex jumped 1.47% to 82,301.1. Both indices touched their highest levels since February 27.\n\nIt is worth noting that the sharp rally in KPI Green Energy shares was not backed by any specific fundamental trigger. However, the stock witnessed a significant jump in trading activity, with around 72.25 lakh shares changing hands during the intraday session on November 11.\n\nWaaree Energies is planning to invest approximately \u20b9 15,000 crore in setting up a green ammonia manufacturing facility in Andhra Pradesh's Kakinada Special Economic Zone (SEZ). The proposed plant will have an annual production capacity of 1.2 million tonnes, according to a report by The Economic Times.\n\nLocated near Kakinada Gateway Port, the project is expected to boost Andhra Pradesh's emergence as a key destination for green energy and clean fuel industries. Waaree Clean Energy has already acquired nearly 300 acres of land in the Kakinada SEZ, close to the port, for the proposed facility.\n\nAccording to the report, the company is likely to formally announce the investment at the two-day Andhra Pradesh Investment Summit scheduled to take place in Visakhapatnam this week.", "source": "LiveMint Markets", "pub_date_str": "11 Nov 2026, 11:41 AM IST", "pub_date_relative": "1h ago"}, {"title": "How Did Jensen Huang Meet The Alleged Chinese Spy Alice? Viral AI-Generated Trailer Imagines 'First Meeting'", "full_content": "A viral AI-generated spy trailer has sparked online buzz by imagining how Jensen Huang met Alice, amid reports about their association and allegations of her links to Chinese intelligence.", "source": "NDTV Profit", "pub_date_str": "11 Nov 2026, 11:38 AM IST", "pub_date_relative": "1h ago"}, {"title": "AI stock Nvidia crashed but Netweb Technologies shares jumped 8% today after falling 13% in 1 month? Reasons; target", "full_content": "Pranati Deva Published 11 Nov 2026, 11:30 AM IST Prefer Livemint on Google Netweb share price : While global AI heavyweight Nvidia came under pressure on Wall Street, Indian AI infrastructure company Netweb Technologies moved in the opposite direction, with its shares rallying nearly 8% in morning trade on Wednesday, November 11.\n\nWhile Nvidia shares tumbled 5.5% in overnight trading on Wall Street amid an investigation into CEO Jensen Huang's relationship with a woman suspected of being a Chinese spy, Indian AI stock Netweb Technologies moved in the opposite direction, surging nearly 8% on Wednesday, November 11.\n\nThe contrast is notable given Netweb Technologies' 15-year partnership with Nvidia, one of the world's leading AI chipmakers. Huang has acknowledged the reported relationship and apologised, while US President Donald Trump said the FBI was investigating the matter. Nvidia's independent board members have also brought in law firm Wachtell, Lipton, Rosen & Katz to assist with the probe.\n\nDespite the pressure on its global technology partner, Netweb Technologies shares attracted strong buying interest, supported by value buying following a recent correction and the company's record September-quarter earnings.\n\nIn today's deals, the stock advanced as much as 7.8% to an intra-day high of \u20b9 4141.75 per share. However, it remains around 28% below its 52-week high of \u20b9 5,810, recorded in August 2026. Its 52-week low stands at \u20b9 2,942.45, touched in December last year.\n\nThe stock had declined 13% in one month and 15% over three months before Wednesday's rally. The company's strong Q2 FY27 performance, growing AI infrastructure business and sizeable order pipeline have provided fresh triggers for investor interest.\n\nThe rebound in Netweb Technologies shares was supported by improving sentiment across technology stocks. The Nifty IT index jumped around 4%, as heavyweight IT and technology companies witnessed strong buying interest.", "source": "LiveMint Markets", "pub_date_str": "11 Nov 2026, 11:30 AM IST", "pub_date_relative": "1h ago"}, {"title": "Investors pivot to defensive stocks as markets enter a \u2018state of alert\u2019", "full_content": "Markets are in a \"state of alert,\" according to analysts monitoring a pivot from riskier tech sector bets into defensive stocks.\n\nTechnology stocks \u2014 a key driver of rallies in recent years \u2014 have been notably volatile in 2026. Concerns about artificial intelligence \u2014 particularly when it comes to capital expenditure, cash flow, debt and circular financing \u2014 have sparked multiple bouts of volatility this year.\n\nThe Democrats' sweep of Congress in the U.S. midterm elections amplified pressure on the sector last week.\n\nWall Street's tech-heavy Nasdaq Composite Index is up by around 8.7% since the start of the year as of Nov. 9 close, but gave up some of its year-to-date gains in October when it shed 5.3% over the course of the month. The index \u2014 home to Big Tech names including Nvidia , Microsoft , Alphabet and Apple \u2014 has staged a recovery in recent days, but remains in the red for November and is down 0.7% for the month so far after dipping into correction territory last week.\n\nNasdaq Composite's performance over the past month The Nasdaq isn't the only tech-focused index to have seen big losses over the past month. South Korea's Kospi index, which is heavily exposed to the semiconductor sector, lost 16.2% in October and is down more than 8% month-to-date.\n\nThe MSCI World Information Technology index lost 7% in October, and has shed a further 4.6% so far this month. MSCI's U.S.-only IT index is down 11.5% since October.\n\nAt the same time, stocks in defensive sectors have seen broad gains.\n\nMSCI's indexes encompassing the consumer staples, healthcare and utilities sectors \u2014 widely seen as more stable assets in the equity market during times of volatility or uncertainty \u2014 have all risen significantly over the last month.", "source": "CNBC World Economy", "pub_date_str": "11 Nov 2026, 11:30 AM IST", "pub_date_relative": "1h ago"}, {"title": "Scoop: Commerce Department received national security warning on Nvidia CEO affair - Axios", "full_content": "Scoop: Commerce Department received national security warning on Nvidia CEO affair Axios Despite Denial, Trump Was Told on Trip to China About Spying on Nvidia\u2019s Jensen Huang The New York Times Nvidia spy scandal exposes Singapore\u2019s role in China\u2019s AI chip trade Financial Times Nvidia's Huang tries to project 'business as usual' in return to office after affair revelation CNBC Big Tech has a spy problem CNN", "source": "Google News Business", "pub_date_str": "11 Nov 2026, 11:17 AM IST", "pub_date_relative": "2h ago"}], "cfa": [{"title": "Siemens\u2019 order book shines, but input costs remain a concern", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nSiemens\u2019 strong order pipeline in the September quarter (Q2FY27), healthy execution and improving sequential margins suggest that the capital expenditure cycle is gathering momentum. But rising input costs weighed on profitability, raising questions about how much of the growth opportunity can translate into earnings.\n\nConsolidated Q2 revenue increased 17% year-on-year to \u20b9 5,734 crore, with broad-based growth taking it ahead of analyst estimates. The smart infrastructure business led the way, clocking 20% revenue growth to \u20b9 3,281 crore. Mobility and digital industries grew 14% and 8% to \u20b9 1,291 crore and \u20b9 1,150 crore, respectively.\n\nSmart infrastructure is expected to maintain its momentum, as investments in power distribution, grid modernisation, renewable energy integration and data centres create a favourable demand environment. Battery storage , electronics manufacturing and EV charging infrastructure offer additional opportunities.\n\nMotilal Oswal Financial Services expects the segment to clock a 17% revenue CAGR over FY26-FY29, with Ebit margin ranging between 11% and 14%. As the segment gradually transitions from a hardware-centric business towards a solutions-led one, with a greater contribution from value-added products, software and services, Nomura expects its Ebit margin to improve from around 10% in H1FY27 to 13% by FY29.\n\nMobility could receive a leg-up from a ramp-up in locomotive deliveries, even as the broader railway, transportation and industrial capex cycles pick up pace. But its Ebit margin remains a concern, having compressed 364 basis points (bps) year-on-year to 7.5%. Digital industries\u2019 Ebit margin compressed by 200bps to 5%, but Motilal Oswal believes the metric has stabilised around this level.", "source": "LiveMint Markets", "pub_date_str": "11 Nov 2026, 01:20 PM IST", "pub_date_relative": "2m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Alibaba announces plans to list T-Head, its Nvidia chip rival", "full_content": "Chinese tech and e-commerce giant Alibaba announced late Tuesday that the Hong Kong Stock Exchange will allow the company to spin off its semiconductor subsidiary T-Head.\n\nTo do so, Alibaba said it plans a public offering for shares of T-Head in Hong Kong, subject to approval from the exchange and the China Securities Regulatory Commission.\n\nThe filing did not disclose a date or proposed size of a listing.\n\nAlibaba noted it had already filed confidentially on Sept. 11 to list T-Head on the Hong Kong Stock Exchange.\n\nMeanwhile, Hong Kong-listed shares of Alibaba traded 1% lower Wednesday morning. The stock is down about 29% year-to-date.\n\nIn late September, Alibaba announced its next-generation AI chip, the Zhenwu V900, that it said delivers three times the performance of its predecessor, the Zhenwu M890 released in May.\n\nAlibaba is one of several Chinese companies, including Huawei, developing homegrown semiconductors to power artificial intelligence, amid growing U.S. restrictions on China's ability to access the chips.\n\nShort seller Culper Research alleged in May that Alibaba was able to obtain restricted Nvidia chips by indirectly financing entities in Southeast Asia . Alibaba did not immediately respond to a request for comment.", "source": "CNBC Finance", "pub_date_str": "11 Nov 2026, 01:17 PM IST", "pub_date_relative": "4m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Astor Group reports 218% revenue surge in third quarter", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Nov 2026, 01:14 PM IST", "pub_date_relative": "7m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "HDFC Defence Fund October 2026 portfolio: Active mutual fund adds 3 stocks; raises stake in BEL, Tata Motors and others", "full_content": "HDFC Defence Fund has reshuffled its portfolio in October 2026, increasing its holdings in five existing stocks and adding three new stocks. With these additions, the fund's total portfolio expanded to 27 stocks by the end of October.\n\nHDFC Defence Fund is India's only open-ended equity thematic scheme that invests mainly in equities of companies operating in the defence and allied sectors.\n\nThe fund manager has the flexibility to actively invest across segments such as aerospace and defence, auto components, chemicals and petrochemicals, industrial manufacturing, and other related industries.\n\nThe fund's assets under management (AUM) stood at \u20b9 11,493 crore as of 30 September 2026, declining to \u20b9 11,131 crore as of 31 October 2026.\n\nAs of 9 November 2026, HDFC Defence Fund delivered a one-year return of 21.04%, outperforming its benchmark, Nifty India Defence TRI, which returned 14.19%. However, over three years, the fund's return stood at 34.08%, lower than the benchmark's 39.70%.\n\nHere's how the fund's holdings changed between 30 September and 31 October 2026.\n\nBharat Electronics accounted for the largest increase in the fund's holdings. Its shareholding rose by 30.18 lakh shares, from 440 lakh shares in September to 470.18 lakh shares in October 2026.\n\nHDFC Defence Fund also increased its holdings in Tata Motors by 1.42 lakh shares, taking its total holding to 30.46 lakh shares. Its exposure to BEML rose to 30.11 lakh shares, while Bharat Forge holdings increased to 77.51 lakh shares. Bosch holdings also increased by 0.13 lakh shares to 1.13 lakh shares.", "source": "LiveMint Money", "pub_date_str": "11 Nov 2026, 01:12 PM IST", "pub_date_relative": "9m ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Earnings call transcript: Nissan posts H1 turnaround but shares slip on China weakness", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Nov 2026, 01:09 PM IST", "pub_date_relative": "12m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "RWE earnings beat estimates as strong energy trading lifts outlook", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Nov 2026, 01:09 PM IST", "pub_date_relative": "12m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "ITV warns Q4 ad revenue to fall 5-10% as demand weakens, cuts costs", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Nov 2026, 01:08 PM IST", "pub_date_relative": "14m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "ICG targets zero net debt, plans to return excess capital as H1 earnings rise 18%", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Nov 2026, 01:07 PM IST", "pub_date_relative": "14m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Earnings call transcript: Ensurge trims costs, secures funding in Q3 2024", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Nov 2026, 01:07 PM IST", "pub_date_relative": "14m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Earnings call transcript: Techstep Q3 2026 loss narrows as cost cuts lift EBITA", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Nov 2026, 01:03 PM IST", "pub_date_relative": "19m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Why Shakti Pumps shares are rising 11% today amid Sensex, Nifty rally? Buy for more returns? Target, upside, rationale", "full_content": "Shakti Pumps shares surged as much as 11% in Wednesday's trading session amid positive sentiments on Dalal Street. The stock opened at \u20b9 359 per share today, as compared to previous close of \u20b9 355.80 on Monday.\n\nIt is to be noted that there is no fundamental trigger behind the significant rally in Shakti Pumps shares. The stock witnessed a spurt in its trading volume as around 95.32 lakh shares changed hands on NSE during the intraday session on Wednesday.\n\nMeanwhile, Indian equity benchmarks, the Sensex and Nifty, opened Wednesday's session on a strong note, supported by foreign institutional inflows, better-than-expected September-quarter earnings and a continued decline in crude oil prices. The BSE Sensex surged 1,097.33 points to 82,186.92 in early trade, while the NSE Nifty 50 advanced 274.30 points to 25,317.55.\n\nShakti Pumps (India) reported a 12% year-on-year increase in consolidated revenue from operations to \u20b9 746 crore in Q2 FY27, compared with \u20b9 666.4 crore in the corresponding quarter last year. However, the company's profitability came under significant pressure during the quarter, with EBITDA declining 52.9% to \u20b9 64 crore from \u20b9 136 crore in Q2 FY26.\n\nThe company's EBITDA margin contracted sharply to 8.6% in the September quarter, compared with 20.4% in the year-ago period, reflecting pressure on operating profitability. Profit before tax (PBT) declined 59.3% year-on-year to \u20b9 49.5 crore from \u20b9 121.5 crore in Q2 FY26.\n\nShakti Pumps' consolidated profit after tax (PAT) fell 57.6% year-on-year to \u20b9 38.5 crore in Q2 FY27, against \u20b9 90.7 crore in the corresponding quarter of the previous financial year. Its PAT margin also declined to 5.2% from 13.6% a year ago.\n\nShakti Pumps (India) shares have witnessed a sharp recovery in the near term, gaining 10.04% over the past week.", "source": "LiveMint Markets", "pub_date_str": "11 Nov 2026, 12:52 PM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Q2 Results Live: Orient Green Net Profit Flat, But Margin Expands; Tata Power, GRSE, Hind Copper In Focus", "full_content": "The September-quarter earnings season continues with results due from Tata Power, Garden Reach Shipbuilders & Engineers, Hindustan Copper, Triveni Turbine, Power Mech Projects and other companies.", "source": "NDTV Profit", "pub_date_str": "11 Nov 2026, 12:47 PM IST", "pub_date_relative": "34m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Indian Airlines Expand Premium Seats Despite Capacity Cuts, IndiGo Leads Push | Profit Exclusive", "full_content": "Indian carriers added 3.1% more premium seats in Winter Schedule 2026, with IndiGo accounting for the biggest expansion even as Air India and Air India Express cut capacity.", "source": "NDTV Profit", "pub_date_str": "11 Nov 2026, 12:44 PM IST", "pub_date_relative": "38m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Gold Glitters, Silver Shine: Yellow Metal Prices Rise By Rs 1,400; White Metal Jumps By Rs 5,000", "full_content": "Precious metal prices recovered on MCX, with gold rising to Rs 1,41,670 per 10 grams and silver climbing to Rs 1,87,550 per kilogram amid a rebound in international bullion prices.", "source": "NDTV Profit", "pub_date_str": "11 Nov 2026, 12:40 PM IST", "pub_date_relative": "41m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Singapore wants a bigger slice of the global gold market. Is it too late to the party?", "full_content": "Singapore is stepping up efforts to become a major player in the global gold market, betting that a new central bank vaulting service and tax incentives will help it attract more bullion flows.\n\nThe Monetary Authority of Singapore on Tuesday launched a gold vaulting service for foreign central banks and sovereign entities, with an initial capacity of 500 metric tons.\n\nThe city-state also plans to introduce tax exemptions for certain wholesale gold-related services such as vaulting, refining, recasting, testing and broking. In June, Singapore unveiled plans for a physical gold clearing system to facilitate the settlement of bullion transactions in the city-state, with operations expected to begin in the first quarter of 2027.\n\nThe initiatives mark the country's latest attempt to establish itself as a key bullion hub alongside established centers such as London and Switzerland, as more gold trading activity shifts toward Asia.\n\nBut breaking into a market dominated by established trading hubs may prove an uphill battle. For instance, London vaults held about 9,850 metric tons of gold at the end of October, including commercial and central bank storage.\n\nThe push from Singapore also comes as rival Hong Kong is also expanding its gold storage and clearing infrastructure, leveraging its proximity to China, the world's largest gold market.\n\n\"Singapore is very late to the party as building up a physical hub requires volume when it comes to trade backed structures,\" said Juerg Kiener, chief investment officer at Swiss Asia Capital.\n\n\"The largest gold market is China and its window to the rest of the world is Hong Kong,\" he told CNBC, adding that Singapore is not well-positioned to compete with Hong Kong in gold-backed trade.", "source": "CNBC Top News", "pub_date_str": "11 Nov 2026, 12:32 PM IST", "pub_date_relative": "49m ago", "cfa_topics": ["Economics", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "CoreWeave stock jumps after earnings: 7 things driving the AI cloud company's rally", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News Powered By CoreWeave stock jumps after earnings: 7 things driving the AI cloud company's rally Written by Anupam Nagar , ETMarkets.com | Nov 11, 2026, 12:50:04 PM IST 1 / 7 CoreWeave shares surge after Q3 earnings beat CoreWeave shares climb as much as 8% in after-hours trading following stronger-than-expected third-quarter results. The AI cloud infrastructure provider reports robust revenue growth, raises its full-year outlook and highlights a $132.5 billion revenue backlog, reinforcing expectations of sustained demand for AI computing capacity. (Sources: Stocktwits | InvestingLive)\n\nCoreWeave reports third-quarter revenue of $3.66 billion, up 168% from $1.37 billion a year earlier. The figure also beats analyst expectations of approximately $3.54 billion. Revenue increases by more than $1 billion sequentially, reflecting strong demand for its AI infrastructure services.\n\nThe company's revenue backlog reaches approximately $132.5 billion at the end of September, compared with $104.2 billion at the end of June. The growing backlog signals strong customer commitments and provides greater visibility into future revenue, although delivery and service availability remain important conditions.\n\nCoreWeave raises its full-year 2026 revenue forecast to $13 billion-$13.3 billion. It also increases its adjusted operating income outlook to $1.275 billion-$1.375 billion and expects annualised run-rate revenue of $20 billion-$21 billion by the end of the year.\n\nDespite strong revenue growth, CoreWeave reports a net loss of $709 million, compared with $110 million a year earlier. Net interest expense rises to $846 million.", "source": "Economic Times Markets", "pub_date_str": "11 Nov 2026, 12:31 PM IST", "pub_date_relative": "51m ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Asian Stocks, Bonds to Drop as Fed Hike Bets Mount: Markets Wrap - Bloomberg.com", "full_content": "Asian Stocks, Bonds to Drop as Fed Hike Bets Mount: Markets Wrap Bloomberg.com Stocks moving the most after hours: Neocloud company CoreWeave shares swing after quarterly report CNBC Stocks rally as CoreWeave soothes, bonds reel on rate hike fears Reuters CoreWeave stock pops as Q3 revenue beats estimates, company raises full-year outlook Yahoo Finance CoreWeave Earnings Beat Expectations, Assuaging Market Nervousness Barron's", "source": "Google News Business", "pub_date_str": "11 Nov 2026, 12:30 PM IST", "pub_date_relative": "52m ago", "cfa_topics": ["Economics", "Financial Statement Analysis"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Once AI darling of shareholders, Nvidia sued by own stock buyers over CEO Jensen Huang affair; $420 bn lost in 2 days", "full_content": "Nvidia Scandal : Nvidia, once a favourite among investors riding the artificial intelligence ( AI ) boom, is facing mounting scrutiny after shareholders filed a class-action lawsuit against CEO Jensen Huang and the company over his affair with Alice Huang, suspected of having links to Chinese intelligence.\n\nThe lawsuit has brought the chipmaker's leadership, corporate governance and potential national security exposure under the spotlight. The controversy also involves Singapore-based Megaspeed, the woman's former employer, which has faced scrutiny over suspected links to the movement of advanced Nvidia chips into China. Huang has acknowledged the affair and apologised.\n\nThe controversy has already taken a toll on Nvidia's market valuation. Its shares declined 4.27% on the New York Stock Exchange on Monday, wiping out $192.1 billion in market capitalisation in a single session. The AI stock extended its losses on Tuesday, down another 5.5% to $168.89 per share. Nvidia's market cap dropped to $4.08 trillion, wiping out over $420 billion in just two sessions.\n\nThe shareholder lawsuit has added to investor concerns, with plaintiffs arguing that the revelations and potential national security implications were responsible for the losses.\n\nA group of shareholders filed the lawsuit in the US District Court for the Northern District of California on Monday, accusing Huang and Nvidia of violating federal securities laws. They are seeking compensation for losses suffered after the revelations triggered a sell-off in the company's shares.\n\nThe plaintiffs argue that investor losses followed disclosures about Huang's relationship with Alice Huang and the potential national security risks associated with her former employer.\n\nAccording to the Financial Times, Alice Huang and Chinese business partner Kang Wei approached investors in early 2025 to raise hundreds of millions of dollars for a data centre project in Southeast Asia.", "source": "LiveMint Markets", "pub_date_str": "11 Nov 2026, 12:26 PM IST", "pub_date_relative": "55m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "October Mutual Fund Data: MF Industry Bounces Back As Total Net Inflows Stand At Rs 1.73 Lakh Crore", "full_content": "Mutual funds added approximately 3.06 lakh crore in the month under reviewafter recording total net outflow of Rs1.33 lakh crore in the month of September.", "source": "NDTV Profit", "pub_date_str": "11 Nov 2026, 12:22 PM IST", "pub_date_relative": "59m ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Nvidia's $470 Billion Sell-Off: Indian Mutual Funds That Have Exposure To The Chipmaker", "full_content": "Several Indian mutual fund schemes hold Nvidia shares, including diversified equity funds, as the chipmaker faces a potential $470 billion erosion in market value over two trading sessions.", "source": "NDTV Profit", "pub_date_str": "11 Nov 2026, 12:21 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "SIP Inflows Fall To Rs 32,160 Crore In October; Equity MF Inflows Drop 14%", "full_content": "Overall, mutual funds recorded net inflows of Rs 1.73 lakh crore in October, compared with net outflows of Rs 1.33 lakh crore in September.", "source": "NDTV Profit", "pub_date_str": "11 Nov 2026, 12:21 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "EPS-95 pensioners: EPFO says submit Digital Life Certificate from home using Umang app; here's step-by-step process", "full_content": "The Employees' Provident Fund Organisation (EPFO) has informed pensioners covered under the Employees' Pension Scheme 1995 about the facility to generate and submit their Digital Life Certificate (DLC) online through the Umang app.\n\nIn a post on X, the EPFO wrote, \u201cDear EPS-95 Pensioners, is your Jeevan Pramaan due for renewal? No need to step out! Submit your Digital Life Certificate from the comfort of your home using the UMANG App and Face Authentication Technology.\u201d\n\nEPS-95 pensioners should renew their Digital Life Certificate before it expires to avoid any disruption in pension payments. They can submit the certificate at any time during the year, and it remains valid for one year from the date of submission. Here is a step-by-step guide for submitting the certificate through the Umang app.\n\nPensioners can follow the steps below to generate and submit their Jeevan Pramaan.\n\nNo. Once successfully generated, the Digital Life Certificate is stored in the Jeevan Pramaan repository and is made available electronically to the pension disbursing agency. Pensioners do not need to submit a physical copy separately to the bank or EPFO. The Pramaan ID can be used to retrieve the certificate.\n\nDisclaimer: This is for informational purposes only. Pensioners should follow the latest instructions on the official EPFO and Jeevan Pramaan websites before submitting their Digital Life Certificate.\n\nSheetal Goel is a Content Producer at Livemint, where she covers corporate developments, personal finance, business trends, markets, and SEBI-related updates. She focuses on simplifying complex financial concepts and presenting them in a clear, reader-friendly manner, thereby helping audiences better understand investment trends, personal finance, and market developments. Her writing focuses on making finance more accessible to everyday readers while maintaining clarity, accuracy, and relevance.", "source": "LiveMint Money", "pub_date_str": "11 Nov 2026, 12:19 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Railway stocks on fast track! RVNL, IRFC jump up to 10% amid Sensex, Nifty rise | What's behind momentum? Key levels", "full_content": "Dhanya Nagasundaram Published 11 Nov 2026, 12:17 PM IST Prefer Livemint on Google Rail Vikas Nigam Ltd (RVNL) and Indian Railway Finance Corporation (IRFC) shares rallied as much as 10% on Wednesday, 11 November, amid a strong recovery in the broader equity market and renewed investor interest in railway stocks.\n\nIndian benchmark indices gained over 1% in morning trade, with the Nifty 50 rising 1.25% to 25,358 and the Sensex advancing 1.47% to 82,301.10 around 10:07 am. Both indices touched their highest levels since 27 February.\n\nThe broader market rally was supported by easing crude oil prices and a shift in global investment sentiment. According to a Reuters report, concerns over elevated artificial intelligence (AI) valuations and investment spending have prompted investors to reassess their global allocations, triggering fresh foreign fund inflows into Indian equities after an extended period of selling.\n\nAdding to the positive sentiment around railway stocks was a significant development in India's railway manufacturing sector. According to news reports, Japan has placed its first order for indigenously manufactured electronic train propulsion systems from India, marking a milestone for the country's railway technology and export ambitions.\n\nAccording to news reports, the development is particularly significant as propulsion systems account for nearly 40% of a train's total value. The order highlights India's growing capabilities in railway engineering and its potential to emerge as a supplier of advanced railway technologies to global markets.\n\nIndia has already exported railway components to countries such as Germany, France, Switzerland and the US.", "source": "LiveMint Markets", "pub_date_str": "11 Nov 2026, 12:17 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Stock futures rise as market tries to recover from Nvidia-led decline: Live updates", "full_content": "Stock futures rose early Wednesday following a losing session in which Nvidia, coupled with hotter-than-expected inflation data, pressured the broader market.\n\nDow Jones Industrial Average futures gained 92 points, or 0.18%. S&P 500 futures climbed 0.6%, while Nasdaq-100 futures advanced 1.43%.\n\nIn Asia, Japan's Nikkei 225 traded 0.85% higher on Wednesday. South Korea's Kospi was up 1.22%, while Australia's S&P/ASX 200 added 0.23%. Hong Kong's Hang Seng Index was down 0.66%, while the CSI 300 fell 0.39%.\n\nThe Dow pulled back more than 150 points in regular U.S. trading, while the S&P 500 and Nasdaq Composite shed 0.4% and 0.7%, respectively. At the center of the decline was Nvidia . The chipmaker pulled back 5.5%, as CEO Jensen Huang's affair with an alleged Chinese spy weighed on the stock for the second consecutive session.\n\nNvidia's two-day slide pulled the company's market cap down to around $4.07 trillion, its lowest since late March.\n\nEquities also fell on Tuesday after the latest U.S. inflation data solidified expectations for a December Federal Reserve rate hike. The consumer price index increased by 0.4% month over month in October , topping expectations.\n\nExpectations for a quarter-point rate increase next month rose to about 90% following the release, per the CME Group's FedWatch tool.\n\n\"Despite some technical uncertainty, higher than desired levels of inflation should keep the Fed in a stance of dissatisfaction with the degree of progress on inflation remaining lackluster, so hiking the Fed Funds policy rate in December is our and the market's base case,\" wrote Rick Rieder, CIO of global fixed income at BlackRock. \"The question now is more of one of the extent of the hike.\"", "source": "CNBC Top News", "pub_date_str": "11 Nov 2026, 12:13 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Nvidia Stock Sell-Off Deepens: Spy scandal, price target cuts put AI giant under pressure", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News Powered By Nvidia Stock Sell-Off Deepens: Spy scandal, price target cuts put AI giant under pressure Written by Anupam Nagar , ETMarkets.com | Nov 11, 2026, 12:27:08 PM IST 1 / 5 Nvidia stock loses 10% as sell-off intensifies Nvidia shares suffer a sharp decline, losing nearly 10% in a single session as investors react to mounting concerns surrounding CEO Jensen Huang, a broader technology sell-off and uncertainty over the artificial intelligence trade. The latest losses put the chipmaker under pressure just days before its quarterly earnings announcement scheduled for November 17. (Sources: Yahoo Finance, Investopedia)\n\nThe sell-off intensifies following reports that Nvidia CEO Jensen Huang may have been targeted by a suspected Chinese intelligence operation involving Alice Huang, a former executive at Singapore-based data centre company Megaspeed. Nvidia's board has launched an independent investigation into the matter, although the company says it has no reason to believe that national security or its proprietary technology has been compromised.\n\nThe latest decline wipes out hundreds of billions of dollars in Nvidia's market capitalisation, with shares falling to levels last seen in the spring. The stock is also heading towards its steepest monthly decline in years. Broader concerns about AI-sector valuations and uncertainty over future infrastructure spending add to the selling pressure.\n\nThe controversy triggers a fresh wave of analyst caution. Citi lowers its price target on Nvidia to $285 from $315, while Wells Fargo cuts its target to $300 from $315. Other analysts also reassess the risks, citing leadership uncertainty and potential regulatory scrutiny.", "source": "Economic Times Markets", "pub_date_str": "11 Nov 2026, 12:10 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Gold ETF Inflows Fall 22% To Rs 3,474 Crore In October, Silver ETFs See 56% MoM Jump: AMFI Data", "full_content": "Gold ETFs received net inflows of Rs 3,474.03 crore last month, down by nearly 22% from Rs 4,450.61 crore in September.", "source": "NDTV Profit", "pub_date_str": "11 Nov 2026, 12:04 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments", "Portfolio Management"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Oil traders give peace a chance (but should they?)", "full_content": "Plus Chris Waller, inflation hawk", "source": "FT Markets", "pub_date_str": "11 Nov 2026, 12:00 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "From 13% Down To Near Flat: How Nifty And Sensex Recovered From War-Time Losses", "full_content": "The rebound, analysts believe, has come amid easing crude oil prices, hopes of de-escalation in West Asia, improving corporate earnings and a return of foreign portfolio investors (FPIs) to Indian equities.", "source": "NDTV Profit", "pub_date_str": "11 Nov 2026, 11:58 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Berger Paints hopes for gloss back on volume and margin after pale Q2", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nBerger Paints India\u2019s earnings estimates were downgraded after gross margin compression in the September quarter (Q2FY27) proved steeper than anticipated. Consolidated gross margin shrank 225 basis points (bps) year-on-year and 160 bps sequentially to 39.3%. Q2 saw the full impact of double-digit raw material inflation, liquidation of high-cost inventory and delayed price hikes in the industrial paint portfolio.\n\nCost efficiency initiatives helped curb Ebitda margin drop to 90 bps year-on-year, but it fell 530 bps sequentially to 11.6%, missing consensus estimate of 13%, dragged by additional spends in the Rang Bana Rahe campaign done to strengthen brand visibility and consumer engagement. Berger eyes 15-17% Ebitda margin in Q3FY27 and Q4FY27 driven by price hikes and operating leverage.\n\nDecorative volume growth was modest at 3%, lagging Asian Paints\u2019 6%. Double-digit value growth was driven by an approximately 8% price hike across the decorative portfolio.\n\nVolumes were hurt by festive demand shifting to Q3, rationalization of dealer rebates to cushion gross margins, extended rainfall in key eastern markets and a decline in sales of price-sensitive categories such as putty, textures and enamel. Berger expects robust demand growth in Q3 and said
