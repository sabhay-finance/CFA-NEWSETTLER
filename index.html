d new capacity can sustain earnings growth.", "source": "NDTV Profit", "pub_date_str": "25 Sep 2026, 07:24 AM IST", "pub_date_relative": "18m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stock futures are little changed as Dow heads for fourth straight losing week: Live updates", "full_content": "U.S. equity futures were little changed Thursday evening as Treasury yields continued their climb.\n\nS&P 500 futures were down 0.1%, and Nasdaq-100 futures were also off 0.1%. Futures tied to the Dow Jones Industrial Average fell 59 points, or 0.1%.\n\nIn Thursday's regular trading, the S&P 500 and Nasdaq Composite both finished flat.\n\nIn Asia-Pacific, Japan's Nikkei 225 added 0.25% while the Topix rose 0.40%. Australia's benchmark S&P/ASX 200 was 0.48% lower. Markets in mainland China and South Korea are closed for a holiday. Hong Kong's Hang Seng index was 1.46% lower.\n\nThe drama continued in the bond market, where the 10-year Treasury yield climbed to 5.225% late Thursday, the highest level since 2007, while the 30-year yield reached 5.502%.\n\nThis week's ascent in yields was fueled by hawkish comments from Federal Reserve Governor Michael Barr, persistently high energy prices due to the Iran war, and a hot purchasing managers' report. Fed funds futures trading suggests a roughly 68% likelihood of a rate hike in October, according to the CME FedWatch tool .\n\nThe 30-year fixed rate mortgage , which tracks the 10-year note, rose to 7.45%, the highest level since 2024, as borrowing costs for consumers looked poised to increase ahead of the midterm elections.\n\n\"Even before the moves of the past few days, the declines in credit card [annual percentage rates] and auto loan rates that occurred from mid- 2024 through the start of 2026 had stalled, and mortgage rates reaccelerated,\" Heather Berger, economist at Morgan Stanley, wrote in a note to clients.", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 07:22 AM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Derivatives", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Stock Market Today: All You Need To Know Before Going Into Trade On Sept 25", "full_content": "Stocks in the news, big brokerage calls of the day, complete trade setup and much more!", "source": "NDTV Profit", "pub_date_str": "25 Sep 2026, 07:14 AM IST", "pub_date_relative": "27m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Stock Market Live: GIFT Nifty Hints At Muted Open For Sensex, Nifty; Crude Above $105, US-Iran War Eyed", "full_content": "At 6:33 am, GIFT Nifty futures were trading 348 points lower against the previous close of Nifty futures at 23,449.80, signalling a weak start for domestic equities.", "source": "NDTV Profit", "pub_date_str": "25 Sep 2026, 07:13 AM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Equity Investments", "Derivatives"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Surging US Yields Push Spreads With Asia Toward Extremes", "full_content": "The surge in Treasury yields has pushed yield gaps with emerging Asia bonds toward record levels, raising the risk of capital outflows from the region, according to strategists.\n\nA selloff in US government bonds deepened this week, with the 30-year yield surging to its highest level since 2004 on Thursday and the benchmark 10-year yield hitting its highest since 2007. This has pushed Malaysia\u2019s 10-year yield discount to Treasuries to the widest since 2007, while yield gaps for Indonesia and Thailand are also nearing record levels.\n\n\u201cLonger-dated EM Asia bonds are particularly at risk from higher Treasury yields, especially low-yielders such as South Korea and Thailand,\u201d said Stephen Chiu, chief emerging markets FX strategist at Bloomberg Intelligence. US yields\u2019 rise could \u201ceither spur foreign outflows, or reduce net foreign inflows\u201d into the region\u2019s bonds.\n\nFor emerging Asia, the widening yield gap and potential capital outflows may result in a myriad of consequences, including putting downward pressure on local currencies. Regional central banks may then be driven to keep domestic interest rates elevated to defend currencies, which could boost borrowing costs and potentially weigh on economic growth.\n\nBy comparison, yield moves in emerging Asia have been more modest, rising by only as much as 7 basis points in Malaysia and Thailand on Thursday.", "source": "LiveMint Markets", "pub_date_str": "25 Sep 2026, 07:02 AM IST", "pub_date_relative": "39m ago", "cfa_topics": ["Economics", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Rate-sensitive stocks to watch after the Fed hike", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nThe US Federal Reserve\u2019s latest 25-basis-point interest rate hike has yet to be fully priced in by Dalal Street . While modest on paper, the move signals the start of a broader tightening cycle from the central bank.\n\nHere is a closer look at how higher US rates could ripple through the Indian market, and three rate-sensitive stocks worth watching.\n\nPersistent inflation, still hovering above the Federal Reserve\u2019s 2% target, was the primary trigger for the move.\n\nAt the same time, the US economy continues to show resilience, with steady GDP growth and strong consumer spending absorbing the shock of high oil prices.\n\nConfident that a recession is not imminent, the central bank prioritized price stability, resulting in a unanimous 12\u20130 vote.\n\nThis remains the central question for global markets. Fed watchers increasingly agree that the central bank has embarked on a new tightening cycle. Projections submitted by 16 of the 18 Federal Open Market Committee (FOMC) members point to at least one more rate increase by the end of 2026, with the door open to further hikes in 2027 if inflation fails to cool.\n\nHigher borrowing costs threaten to dampen US consumer spending, which is already under pressure from elevated fuel prices. While a recession is not the immediate baseline, the cumulative impact of further rate hikes on economic growth remains uncertain.", "source": "LiveMint Markets", "pub_date_str": "25 Sep 2026, 07:00 AM IST", "pub_date_relative": "41m ago", "cfa_topics": ["Economics", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Stock Market Today: Gift Nifty, Bond Yields To Oil Prices \u2014 Five Key Factors That May Drive Sensex, Nifty 50 On September 25", "full_content": "Asian markets traded mostly higher, while the US stock market ended mixed overnight, as Treasury yields rose on inflation concerns after crude oil prices spiked.", "source": "NDTV Profit", "pub_date_str": "25 Sep 2026, 06:58 AM IST", "pub_date_relative": "43m ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "China's Xi urges U.S. to cooperate on AI", "full_content": "BEIJING \u2014 Chinese President Xi Jinping told U.S. President Donald Trump that there is more opportunity for cooperation than competition on artificial intelligence.\n\nThat's according to a state media readout of the two leaders' meeting in the White House Oval Office Thursday local time.\n\n\"The two sides can continue AI dialogue, exchange views on risks and benefits, and together guard against the misuse or malicious use of AI,\" Xi said in Chinese, according to a CNBC translation of the state media readout.\n\nHe noted AI is important to both the U.S. and China. \"Both sides have competition. Cooperation, even more so,\" he said.\n\nXi also emphasized that humans should maintain control of the technology, and that AI should support human progress.\n\nThe U.S. has restricted China's ability to access advanced semiconductors for training AI models, and criticized Chinese companies for allegedly taking part in illicit distillation of American AI capabilities.\n\nRecent incidents have raised fears that increasingly autonomous AI models could make attacks faster and harder to contain.\n\nFollowing a meeting with Chinese negotiators in New York, U.S. Treasury Secretary Scott Bessent said earlier this week the two sides had discussed setting up a \"U.S.-China AI Dialogue.\" He said the U.S. proposed introducing an alert system for AI incidents.", "source": "CNBC Finance", "pub_date_str": "25 Sep 2026, 06:52 AM IST", "pub_date_relative": "49m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "CBB Bancorp appoints Jeffrey Green to board of directors", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Sep 2026, 06:50 AM IST", "pub_date_relative": "51m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Sensex, Nifty 50 prediction today: Stock market outlook for 25 Sept 2026 | GIFT Nifty, Nikkei, Taiwan cues to watch", "full_content": "Stock market prediction on Friday, 25 September, 2026 : Indian equities were set for a muted opening on Friday, September 25, with GIFT Nifty indicating a subdued start as investors remained cautious amid developments in the Middle East. Reuters reported that US and Iranian negotiators were exploring a phased route towards ending the war, while elevated bond yields and crude oil prices continued to weigh on sentiment.\n\nAsian markets traded mixed in early deals, while US stock futures edged lower on Friday, adding to the cautious tone across global markets.\n\nSiddhartha Khemka, Head of Research, Wealth Management, Motilal Oswal Financial Services , said Indian equities could remain under pressure in the near term as uncertainty around a potential resolution to the US-Iran conflict persists, alongside elevated crude oil prices and rising global bond yields.\n\nHe noted that hopes of an early US-Iran deal had weakened after US President Donald Trump indicated that any potential agreement with Iran could come only after the November US midterm elections.\n\nMeanwhile, renewed Houthi activity in the Red Sea and tensions involving Saudi Arabia have added to concerns over global supply disruptions, further increasing inflationary pressures.\n\nThe Indian stock market endured a sharp sell-off on Thursday, September 24, with benchmark indices falling more than 1.5%, wiping out recent gains and slipping below key psychological levels. Rising global bond yields and crude oil volatility weighed heavily on sentiment.\n\nThe Nifty 50 plunged 1.64% to 25,169.50, while the Sensex declined 1.67% to 73,580.", "source": "LiveMint Markets", "pub_date_str": "25 Sep 2026, 06:45 AM IST", "pub_date_relative": "57m ago", "cfa_topics": ["Equity Investments", "Fixed Income", "Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Atlanta is getting pandas: China's Xi revives a longtime diplomatic strategy at summit with U.S.", "full_content": "Chinese leader Xi Jinping promised two giant pandas to Zoo Atlanta, reviving Beijing's decades-old charm offensive on the opening day of his first state visit to the U.S. in more than a decade.\n\nTwo giant pandas, Ping Ping and Fu Shuang, from a research base in Chengdu will arrive at the Georgia zoo \"in the coming days,\" Xi said. They would be Zoo Atlanta's first pandas since its previous four returned to China in November 2024, when it became the last U.S. zoo to lose its bears.\n\nThe Chinese president made the announcement at the start of his state visit in Washington, where he and President Donald Trump are meeting through Friday on an agenda spanning artificial intelligence, tariffs, critical minerals, Taiwan and the Iran war.\n\n\"The giant panda has been an envoy of friendship between the Chinese and Americans,\" he said at a White House ceremony.\n\nChina has used pandas as a diplomatic barometer since Mao Zedong sent a pair to Washington's National Zoo following Richard Nixon's 1972 visit, a gift so anticipated that more than a million people came to see the animals in their first year.\n\nBeijing shifted from gifting pandas outright to leasing them in 1984, and the loans have since tracked the temperature of the relationship \u2014 thinning as trade and Taiwan tensions rose, then resuming as San Diego and the Washington DC National Zoo took in new pairs in 2024.\n\nPandas on loan to the U.S. have bred 17 cubs, including six in San Diego, four in Washington and seven in Atlanta, according to Chinese state media .\n\n\"Panda diplomacy conveys a message of friendship and goodwill from China,\" said Wu Xinbo, director of the Center for American Studies at Fudan University. \"Americans may not like China, but they will certainly like pandas.\"", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 06:42 AM IST", "pub_date_relative": "59m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Gold edges lower, set for weekly loss as oil fuels Fed hike bets", "full_content": "", "so     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
