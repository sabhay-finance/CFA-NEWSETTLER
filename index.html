<script>
    // This variable will be injected during the build process
    const allData = {"general": [{"title": "I\u2019m 77, pay rent and live off Social Security, but I help homeless people. Why are so many people going hungry?", "full_content": "\u201cI am a retired senior citizen living check-to-check.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "26 Sep 2026, 07:00 PM IST", "pub_date_relative": "3m ago"}, {"title": "What is Passive Investing? How\u2019s it different from putting your money through active investments? Explained", "full_content": "Passive investing means putting money into investments that follow a market index. The aim is to earn returns close to that index, after accounting for costs. It usually involves holding investments for years and avoiding frequent buying or selling.\n\nAn index measures the performance of a group of investments. In India, examples include the Nifty 50 and Sensex. Think of an index as a basket containing shares from different companies. A fund that follows that index aims to replicate the basket and its proportions.\n\nFor example, imagine you put \u20b9 1,000 into a Nifty 50 index fund. Your money joins other investors' money to buy shares that track that index. You do not need to choose each company yourself. However, you own units of the fund, rather than those shares directly.\n\nThis approach differs from active investing. An active fund manager selects investments in hopes of beating a chosen market index. A passive fund manager works to follow the index. The fund still needs management, especially when the index changes its holdings.\n\nIndex mutual funds and many exchange-traded funds, called ETFs, offer passive investing. ETFs trade on stock exchanges, where their prices change during trading hours. Index mutual fund purchases follow the applicable daily price, called net asset value (NAV). Both can provide access to multiple investments through a single fund.\n\nLower costs are a major attraction. Passive funds usually spend less on research and engage in less frequent trading than active funds. Their expenses are often lower although charges vary between funds. These expenses reduce your returns, so even small differences matter over many years.\n\nSpreading money across companies can reduce dependence on any single business. However, passive investing does not remove risk or guarantee profits. If the tracked market falls, your investment can also lose value.", "source": "LiveMint Money", "pub_date_str": "26 Sep 2026, 06:51 PM IST", "pub_date_relative": "11m ago"}, {"title": "\u2018It doesn\u2019t seem fair\u2019: I\u2019m retired and have plenty of money. Why can\u2019t I qualify for a retail credit card?", "full_content": "\u201cI draw from my IRA as needed for household repairs, trips and other larger expenses.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "26 Sep 2026, 06:45 PM IST", "pub_date_relative": "18m ago"}, {"title": "Berkshire adds to nearly doubled stake in slumping homebuilder", "full_content": "(This is the Warren Buffett Watch newsletter, news and analysis on all things Warren Buffett and Berkshire Hathaway. You can sign up here to receive it every Friday evening in your inbox.)\n\nBerkshire Hathaway has increased its bet on a long-term recovery for the struggling U.S. housing market by nearly doubling its stake in Lennar , the nation's second largest homebuilder, since the beginning of July.\n\nAs of late Friday, Berkshire reports owning almost 25.4 million shares of LEN and another 549 thousand of its Class B super-voting shares for a total of 25.9 million shares, currently valued at $2.1 billion .\n\nThat's 10.9% of Lennar's roughly 238 million shares outstanding for both classes.\n\nAnd it's a 93% increase from the 13.4 million shares Berkshire owned as of June 30, according to the company's mid-August SEC 13F portfolio snapshot filing for its second quarter.\n\nDespite the big increase, it's still a medium-to-small sized position by Berkshire standards and is likely the work of portfolio manager Ted Weschler.\n\nFor most of the stocks in its portfolio, we will have to wait until mid-November for the next 13F to find out whether Berkshire was buying or selling during its third quarter ending this coming Wednesday.\n\nIn this case, however, Berkshire had to quickly disclose its stake had hit 10% on September 21 under an SEC rule that defines any holder at or above that trigger as an \"insider\" potentially able to \"change or influence company management and policies.\"", "source": "CNBC Top News", "pub_date_str": "26 Sep 2026, 06:44 PM IST", "pub_date_relative": "19m ago"}, {"title": "Supply glut, lab-grown alternatives: What's behind the fall of diamond prices to record lows", "full_content": "Natural diamonds have lost more than half of their value over the past five years. On average, a 1-carat stone now goes for $3,898, or 51% less than its average price of $8,007 in 2021, data from diamond trading platform Rapaport Group shows. The Diamond Standard Index, which tracks prices of so-called investment-grade diamonds, hit 2,490 in early August \u2014 its lowest level ever. This week, it was hovering just north of 2,500.\n\nSeveral drivers are conspiring against diamonds, including a glut of mined stones that has hit the market over the past few years. And while attempts to clear out that oversupply are underway, another trend is compounding the issue: a rise in lab-grown diamonds.\n\n\"There's a lot of doom and gloom about natural diamonds,\" Diamond Standard CEO Cormac Kinney told CNBC. \"There was a very large overhang of excess inventory back in 2023 and 2024 after excess production during Covid, and then [there's been] the falling sales due to the lab-grown [diamonds].\"\n\nLab-grown diamonds are gems with the same chemical and physical properties as natural diamonds that are produced by applying heat and pressure to carbon seeds or from carbon-containing gas in a vacuum chamber. Although they are grown above ground, they look and feel identical to stones that are formed deep within the Earth.\n\nThe key difference between the two is price. A nearly colorless lab diamond with very, very slightly included clarity that has an excellent cut can go for $450 on Brilliant Earth's online marketplace, a CNBC search found. By comparison, a natural stone with the same specs falls in the range of $2,800 to $3,200. The price differential is due largely to how resource-intensive mining natural diamonds can be, as the process requires lots of fuel and labor.\n\nLab-grown alternatives are priced lower than natural diamonds at every carat weight, according to Brilliant Earth.", "source": "CNBC Top News", "pub_date_str": "26 Sep 2026, 06:39 PM IST", "pub_date_relative": "24m ago"}, {"title": "27-year-old started a run club to meet new people\u2014now his NYC side hustle brings in $640K a year", "full_content": "At 6 a.m. on Sept. 5, 2025, Owen Akhibi Herrera realized his side hustle was in trouble.\n\nAkhibi, the founder of New York City-based social fitness group Peak and Pace, had spent weeks planning a 5K run and after-party on Governor's Island, a former military base off the tip of Manhattan that's only accessible by water. He and his team loaded up 18 trucks with supplies, and planned to put them onto a ferry. The morning before the event, he got a call that the boat broke down, leaving the vehicles stranded on Wall Street in the city's bustling financial district.\n\nWorried about refunding 2,000 people who bought tickets to the event, he spent hours on the phone with Governor's Island officials, he says. He managed to get another boat, and the last of his inventory \u2014 about 30 port-a-potties \u2014 arrived as the first guests got to the island, he adds. By the end of the day, the effort felt worthwhile: Akhibi watched a 25-year-old member place a medal around an older participant's neck at the finish line, he says.\n\nAkhibi, 27, originally founded Peak and Pace as a run club in 2024 while working in algorithmic trading sales for investment bank J.P. Morgan. Running with Peak and Pace is always free, and its larger-scale parties typically require a $15 to $25 ticket, he says. Almost entirely through those parties, the company brought in over $640,000 in 2025 revenue, according to documents reviewed by CNBC Make It.\n\nNot every party is profitable, but the company operates overall at a 15% profit margin, says Akhibi, who currently works full-time as the head of partnerships at San Francisco-based AI robotics lab Grounded Superintelligence. He invests the profits back into the side hustle instead of taking a second salary, he says.\n\nRun clubs, Akhibi acknowledges, are a dime-a-dozen, with at least 200 in New York alone.", "source": "CNBC Top News", "pub_date_str": "26 Sep 2026, 06:35 PM IST", "pub_date_relative": "28m ago"}, {"title": "My friend is terminally ill. Should she sell her rental home and pay $100,000 in capital gains?", "full_content": "\u201cHer younger son lives in the condo, but wants to move elsewhere with friends.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "26 Sep 2026, 06:30 PM IST", "pub_date_relative": "33m ago"}, {"title": "Gold Fields approaches Northern Star over potential takeover, Bloomberg reports", "full_content": "", "source": "Investing.com News", "pub_date_str": "26 Sep 2026, 06:18 PM IST", "pub_date_relative": "45m ago"}, {"title": "The worst airports if you have a connecting flight - The Washington Post", "full_content": "The worst airports if you have a connecting flight The Washington Post", "source": "Google News Business", "pub_date_str": "26 Sep 2026, 06:16 PM IST", "pub_date_relative": "47m ago"}, {"title": "Trump rejects Iran's conditional ceasefire proposal, WSJ reports, as Saudi coalition intercepts projectiles", "full_content": "President Donald Trump has rejected Iran's conditional proposal for reopening the Strait of Hormuz, telling aides he expects to resume bombing the country after November's mid-term elections, The Wall Street Journal reported Saturday, quoting unnamed U.S. officials.\n\nMeanwhile, Yemen's Saudi-led coalition forces said they intercepted projectiles fired by Iran-backed Houthi rebels.\n\nIranian Foreign Minister Abbas Araghchi on Friday proposed reopening the strategically vital strait and resuming nuclear talks with the U.S. within seven days if the Trump administration accepts its conditions.\n\n\"If certain conditions are met, the Strait of Hormuz will be open at the end of seven days, and talks will be restarted,\" Araghchi told reporters on the sidelines of the United Nations General Assembly in New York.\n\nTehran's conditions include a halt to what it calls U.S. \"acts of aggression,\" an end to the naval blockade and economic warfare, and the release of Iranian assets, Iranian foreign ministry spokesman Esmaeil Baghaei said this week.\n\nTrump said earlier this month that he expects the war, which began on Feb. 28 with U.S. and Israeli airstrikes on Iran, to end shortly after the midterms and for oil prices to fall afterward.\n\nBut privately, Trump is skeptical Iran would meet his demands and has told his staff that he sees a renewed bombing campaign as likely, the WSJ quoted officials as saying.\n\nThe Journal quoted a U.S. official as saying Washington and Tehran were still negotiating through mediators, including over U.S. demands intended to prevent Iran from developing a nuclear weapon.", "source": "CNBC Top News", "pub_date_str": "26 Sep 2026, 06:09 PM IST", "pub_date_relative": "54m ago"}, {"title": "China is playing a different game when it comes to AI", "full_content": "Experts say the U.S. and China aren\u2019t in an AI race because they aren\u2019t targeting the same goals.", "source": "MarketWatch Top Stories", "pub_date_str": "26 Sep 2026, 06:00 PM IST", "pub_date_relative": "1h ago"}, {"title": "Drone stock Ideaforge gets buy rating; Ashika sees 27% upside - check target price", "full_content": "India\u2019s drone industry is moving beyond being a niche defence technology into a strategically important part of the country\u2019s military procurement architecture, and analysts expect this shift to create a multi-year opportunity for domestic drone manufacturers.\n\nAshika Institutional Research said drones had reached an inflection point following Operation Sindoor, the Russia-Ukraine war and conflicts in West Asia.\n\nThe brokerage initiated coverage on ideaForge Technology with a BUY rating and a target price of \u20b9 942, compared with its then current market price of \u20b9 741, implying 27% upside.\n\nThe brokerage\u2019s thesis was built around rising defence procurement, a protected domestic market, Ideaforge\u2019s technology capabilities and a sharp improvement in profitability as revenue scales.\n\n\u201cThe investment case is fundamentally an operating leverage story - fixed employee costs and other expenses not growing as much as revenue nearly doubling each year will drive EBITDA margin from 2% to 29% over two years,\" it said.\n\nAshika valued the company at 32x FY28E P/E, based on estimated FY28 earnings per share of \u20b9 29.4, to arrive at its \u20b9 942 target price. The brokerage said the valuation was supported by a sub-1.0 PEG, its position within the 30\u201365x peer P/E range and a scarcity premium for India\u2019s sole listed pure-play drone manufacturer.\n\nThe drone stock has lost 7.5% in 1 month and 11.5% in 3 months. Meanwhile, in 6 months, it advanced over 80% while added 38.5% in the last 1 year. LTP at Trading at \u20b9 730.90, the stock is currently 27% away from its 52-week high of \u20b9 997, hit in June 2026. Meanwhile, it touched its 52-week low of \u20b9 367.95 in March 2026.\n\nAshika highlighted the \u20b9 200 billion Fast Track Procurement (FTP) pipeline as a major near-term catalyst for the sector.", "source": "LiveMint Markets", "pub_date_str": "26 Sep 2026, 05:57 PM IST", "pub_date_relative": "1h ago"}, {"title": "Bitcoin holds near $84,000 as rising bond yields offset regulatory progress", "full_content": "", "source": "Investing.com News", "pub_date_str": "26 Sep 2026, 05:57 PM IST", "pub_date_relative": "1h ago"}, {"title": "In Brazil, frustration over cost of living undermines Lula\u2019s reelection bid", "full_content": "", "source": "Investing.com News", "pub_date_str": "26 Sep 2026, 05:54 PM IST", "pub_date_relative": "1h ago"}, {"title": "Airlines waive change fees ahead of nor'easter as flight disruptions trickle in", "full_content": "U.S. airlines waived change fees for flights Friday through Sunday ahead of a nor'easter that federal forecasters warn will bring high winds and rainfall with the potential for dangerous flooding.\n\nAs of Saturday morning, around 250 Boston flights were canceled, about a quarter of the day's schedule, according to FlightAware. On Friday, more than 600 flights to and from LaGuardia Airport in New York were delayed, close to 60% of the schedule. Dozens of others were delayed at major New England and New York-area airports.\n\nCarriers will often cancel a chunk, if not most, of their schedules during severe winter storms or hurricanes to ensure planes, passengers, and crews aren't out of place, but airlines are still assessing the nor'easter's potential path and impact.\n\nAmerican Airlines , United Airlines , Delta Air Lines , and JetBlue Airways said customers can change flights to a range of airports in the New York City area, Boston, and smaller New England airports without paying a change fee or fare difference if they can fly anytime before the middle of next week.\n\nPotential weekend disruptions follow an equipment outage on Monday that forced carriers to cancel hundreds of flights bound for the New York area and Philadelphia.", "source": "CNBC Top News", "pub_date_str": "26 Sep 2026, 05:49 PM IST", "pub_date_relative": "1h ago"}, {"title": "8th pay commission: Here's how to apply for official state visits in Mumbai and Bengaluru", "full_content": "The 8th central pay commission (CPC) has announced official meetings and state visits as part of its consultation stage. According to notices on its official portal, the commission plans to discuss suggestions with employee unions, representatives, groups, pensioner associations, federations, and other stakeholders during its visits before releasing its official recommendations.\n\nThe panel's decisions are expected to benefit more than 1 crore people, including around 50 lakh central government employees and nearly 65 lakh pensioners, and defence and railway personnel and retirees.\n\nSince March, the commission has conducted multiple state visits to meet employee representative groups, unions and stakeholders to collect and analyse data before deciding on pay, allowances , and pensions for employees and pensioners.\n\nIn Mumbai, the commission will host discussion meetings with employee unions, representative groups, pensioner associations, federations, and other stakeholders from Maharashtra who submit an appointment request on or before 10 October deadline, via the official portal here \u2014 https://8cpc.gov.in/\n\nhttps://nicforms.nic.in/enRhYmxlNmFhYTQwYzY5YTg5NTIwMjYwOTE2MTQz\n\nFormer Supreme Court Justice Ranjana Prakash Desai is the Chair, and the panel includes Member-Secretary \u2014 Pankaj Jain, a former IAS officer, and Member of the Commission \u2014 Professor Pulak Ghosh, a tenured Professor of Finance and Member of the Economic Advisory Council to the Prime Minister.", "source": "LiveMint Money", "pub_date_str": "26 Sep 2026, 05:47 PM IST", "pub_date_relative": "1h ago"}, {"title": "China wants in on U.S. AI data center boom. Here's why", "full_content": "China and the U.S. may be competing for dominance in artificial intelligence, but some Chinese manufacturers are eyeing the U.S. data center buildout as an opportunity.\n\n\"We can see very big potential in the U.S. market,\" said S.K. Lee, a global vice president with Singapore-registered Brightray, an AI infrastructure company. \"The China market is equally important, but we can see that there's a stronger demand in the U.S.\"\n\nBrightray's sole manufacturer is Chinese firm PrefabDC, which makes prefabricated data centers. Brightray manages the construction of the buildouts.\n\nEven with public backlash over the AI data center buildout growing, the U.S. boasts more AI data centers than any other country, with 5,427 in 2025, according to data published by the Stanford Institute for Human-Centered Artificial Intelligence . China had 449, according to the same report.\n\nU.S. tech giants like Alphabet , Microsoft , Meta and Amazon are estimated to spend around $765 billion combined this year on AI infrastructure. JPMorgan Chase CEO Jamie Dimon recently said that figure could hit $1 trillion next year .\n\nChinese companies like Alibaba have committed far less. But the Chinese government has outlined plans to invest $295 billion to build data centers over the next five years, though it's still a far cry from U.S. private-sector investment.\n\n\"Chinese companies just are not generating as much revenues from their AI services,\" said Jeffrey Ding, AI expert and assistant professor at The George Washington University. \"And that's one of the reasons why they're not able to invest in these enormous data center buildouts that their competitors in the U.S. are doing.\"\n\nDing said the deeper issue is \"there is not as much demand for the AI services.\"", "source": "CNBC World Economy", "pub_date_str": "26 Sep 2026, 05:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "Why bond-market volatility hasn\u2019t spilled over into stocks", "full_content": "The bond market has a reputation for being boring. But lately, it has been the source of much of the action in the U.S.", "source": "MarketWatch Top Stories", "pub_date_str": "26 Sep 2026, 05:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "\u2018We lived within our means\u2019: I earned $30,000 as a pastor and still retired comfortably. Why don\u2019t you tell people that?", "full_content": "\u201cAs a country, we have grown dangerously comfortable.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "26 Sep 2026, 05:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "DA hike July 2026: Will DA rise to 64% from 60%? \u20b918,000, to \u20b956,100 basic salary | Calculate your likely increase", "full_content": "The next Dearness Allowance (DA) hike in July may raise the allowance for central government employees from 60% to 64%, based on the latest Consumer Price Index for Industrial Workers (AICPI-IW) data, an Economic Times article noted. However, the numbers are still an estimate as the government has yet to announce the final rate.\n\nMeanwhile, the Confederation of Central Government Employees and Workers has urged the Department of Expenditure to expedite the process for the July 2026 DA/DR instalment, effective from 1 July. And also said that it should be placed before the competent authority once the relevant Consumer Price Index (CPI) data and prescribed formula allow the new rate to be determined\n\nThe Confederation said the existing DA/DR rate stands at 60% from January 2026. It pointed to the movement in DA/DR from 46% in July 2023 to 50% in January 2024, 53% in July 2024, 55% in January 2025, 58% in July 2025 and 60% from January 2026, saying the increase reflected the continuing impact of rising prices.\n\nDA is calculated depending on an employee's basic pay. For example, if an employee earns a basic salary of \u20b9 18,000, then at the current 60% rate, he receives \u20b9 10,800 as DA. At 64%, this would rise to \u20b9 11,520\u2014an increase of \u20b9 720 per month.\n\nFor a basic pay of \u20b9 44,900, DA would increase from \u20b9 26,940 to \u20b9 28,736, adding \u20b9 1,796 a month. For a basic pay of \u20b9 56,100, the increase would be \u20b9 2,244 per month.\n\nThe final amount will depend on the Centre\u2019s official DA announcement.\n\nWith the festive season approaching, the Confederation of Central Government Employees and Workers has urged the government to speed up the formal process for the July 1, 2026 DA instalment, citing rising household expenses and other financial commitments.\n\nThe organisation clarified that it was not seeking any advance payment or additional benefit.", "source": "LiveMint Money", "pub_date_str": "26 Sep 2026, 05:25 PM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "What is Passive Investing? How\u2019s it different from putting your money through active investments? Explained", "full_content": "Passive investing means putting money into investments that follow a market index. The aim is to earn returns close to that index, after accounting for costs. It usually involves holding investments for years and avoiding frequent buying or selling.\n\nAn index measures the performance of a group of investments. In India, examples include the Nifty 50 and Sensex. Think of an index as a basket containing shares from different companies. A fund that follows that index aims to replicate the basket and its proportions.\n\nFor example, imagine you put \u20b9 1,000 into a Nifty 50 index fund. Your money joins other investors' money to buy shares that track that index. You do not need to choose each company yourself. However, you own units of the fund, rather than those shares directly.\n\nThis approach differs from active investing. An active fund manager selects investments in hopes of beating a chosen market index. A passive fund manager works to follow the index. The fund still needs management, especially when the index changes its holdings.\n\nIndex mutual funds and many exchange-traded funds, called ETFs, offer passive investing. ETFs trade on stock exchanges, where their prices change during trading hours. Index mutual fund purchases follow the applicable daily price, called net asset value (NAV). Both can provide access to multiple investments through a single fund.\n\nLower costs are a major attraction. Passive funds usually spend less on research and engage in less frequent trading than active funds. Their expenses are often lower although charges vary between funds. These expenses reduce your returns, so even small differences matter over many years.\n\nSpreading money across companies can reduce dependence on any single business. However, passive investing does not remove risk or guarantee profits. If the tracked market falls, your investment can also lose value.", "source": "LiveMint Money", "pub_date_str": "26 Sep 2026, 06:51 PM IST", "pub_date_relative": "11m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Berkshire adds to nearly doubled stake in slumping homebuilder", "full_content": "(This is the Warren Buffett Watch newsletter, news and analysis on all things Warren Buffett and Berkshire Hathaway. You can sign up here to receive it every Friday evening in your inbox.)\n\nBerkshire Hathaway has increased its bet on a long-term recovery for the struggling U.S. housing market by nearly doubling its stake in Lennar , the nation's second largest homebuilder, since the beginning of July.\n\nAs of late Friday, Berkshire reports owning almost 25.4 million shares of LEN and another 549 thousand of its Class B super-voting shares for a total of 25.9 million shares, currently valued at $2.1 billion .\n\nThat's 10.9% of Lennar's roughly 238 million shares outstanding for both classes.\n\nAnd it's a 93% increase from the 13.4 million shares Berkshire owned as of June 30, according to the company's mid-August SEC 13F portfolio snapshot filing for its second quarter.\n\nDespite the big increase, it's still a medium-to-small sized position by Berkshire standards and is likely the work of portfolio manager Ted Weschler.\n\nFor most of the stocks in its portfolio, we will have to wait until mid-November for the next 13F to find out whether Berkshire was buying or selling during its third quarter ending this coming Wednesday.\n\nIn this case, however, Berkshire had to quickly disclose its stake had hit 10% on September 21 under an SEC rule that defines any holder at or above that trigger as an \"insider\" potentially able to \"change or influence company management and policies.\"", "source": "CNBC Top News", "pub_date_str": "26 Sep 2026, 06:44 PM IST", "pub_date_relative": "19m ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Supply glut, lab-grown alternatives: What's behind the fall of diamond prices to record lows", "full_content": "Natural diamonds have lost more than half of their value over the past five years. On average, a 1-carat stone now goes for $3,898, or 51% less than its average price of $8,007 in 2021, data from diamond trading platform Rapaport Group shows. The Diamond Standard Index, which tracks prices of so-called investment-grade diamonds, hit 2,490 in early August \u2014 its lowest level ever. This week, it was hovering just north of 2,500.\n\nSeveral drivers are conspiring against diamonds, including a glut of mined stones that has hit the market over the past few years. And while attempts to clear out that oversupply are underway, another trend is compounding the issue: a rise in lab-grown diamonds.\n\n\"There's a lot of doom and gloom about natural diamonds,\" Diamond Standard CEO Cormac Kinney told CNBC. \"There was a very large overhang of excess inventory back in 2023 and 2024 after excess production during Covid, and then [there's been] the falling sales due to the lab-grown [diamonds].\"\n\nLab-grown diamonds are gems with the same chemical and physical properties as natural diamonds that are produced by applying heat and pressure to carbon seeds or from carbon-containing gas in a vacuum chamber. Although they are grown above ground, they look and feel identical to stones that are formed deep within the Earth.\n\nThe key difference between the two is price. A nearly colorless lab diamond with very, very slightly included clarity that has an excellent cut can go for $450 on Brilliant Earth's online marketplace, a CNBC search found. By comparison, a natural stone with the same specs falls in the range of $2,800 to $3,200. The price differential is due largely to how resource-intensive mining natural diamonds can be, as the process requires lots of fuel and labor.\n\nLab-grown alternatives are priced lower than natural diamonds at every carat weight, according to Brilliant Earth.", "source": "CNBC Top News", "pub_date_str": "26 Sep 2026, 06:39 PM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Quantitative Methods", "Financial Statement Analysis"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "27-year-old started a run club to meet new people\u2014now his NYC side hustle brings in $640K a year", "full_content": "At 6 a.m. on Sept. 5, 2025, Owen Akhibi Herrera realized his side hustle was in trouble.\n\nAkhibi, the founder of New York City-based social fitness group Peak and Pace, had spent weeks planning a 5K run and after-party on Governor's Island, a former military base off the tip of Manhattan that's only accessible by water. He and his team loaded up 18 trucks with supplies, and planned to put them onto a ferry. The morning before the event, he got a call that the boat broke down, leaving the vehicles stranded on Wall Street in the city's bustling financial district.\n\nWorried about refunding 2,000 people who bought tickets to the event, he spent hours on the phone with Governor's Island officials, he says. He managed to get another boat, and the last of his inventory \u2014 about 30 port-a-potties \u2014 arrived as the first guests got to the island, he adds. By the end of the day, the effort felt worthwhile: Akhibi watched a 25-year-old member place a medal around an older participant's neck at the finish line, he says.\n\nAkhibi, 27, originally founded Peak and Pace as a run club in 2024 while working in algorithmic trading sales for investment bank J.P. Morgan. Running with Peak and Pace is always free, and its larger-scale parties typically require a $15 to $25 ticket, he says. Almost entirely through those parties, the company brought in over $640,000 in 2025 revenue, according to documents reviewed by CNBC Make It.\n\nNot every party is profitable, but the company operates overall at a 15% profit margin, says Akhibi, who currently works full-time as the head of partnerships at San Francisco-based AI robotics lab Grounded Superintelligence. He invests the profits back into the side hustle instead of taking a second salary, he says.\n\nRun clubs, Akhibi acknowledges, are a dime-a-dozen, with at least 200 in New York alone.", "source": "CNBC Top News", "pub_date_str": "26 Sep 2026, 06:35 PM IST", "pub_date_relative": "28m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Gold Fields approaches Northern Star over potential takeover, Bloomberg reports", "full_content": "", "source": "Investing.com News", "pub_date_str": "26 Sep 2026, 06:18 PM IST", "pub_date_relative": "45m ago", "cfa_topics": ["Corporate Issuers", "Alternative Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Drone stock Ideaforge gets buy rating; Ashika sees 27% upside - check target price", "full_content": "India\u2019s drone industry is moving beyond being a niche defence technology into a strategically important part of the country\u2019s military procurement architecture, and analysts expect this shift to create a multi-year opportunity for domestic drone manufacturers.\n\nAshika Institutional Research said drones had reached an inflection point following Operation Sindoor, the Russia-Ukraine war and conflicts in West Asia.\n\nThe brokerage initiated coverage on ideaForge Technology with a BUY rating and a target price of \u20b9 942, compared with its then current market price of \u20b9 741, implying 27% upside.\n\nThe brokerage\u2019s thesis was built around rising defence procurement, a protected domestic market, Ideaforge\u2019s technology capabilities and a sharp improvement in profitability as revenue scales.\n\n\u201cThe investment case is fundamentally an operating leverage story - fixed employee costs and other expenses not growing as much as revenue nearly doubling each year will drive EBITDA margin from 2% to 29% over two years,\" it said.\n\nAshika valued the company at 32x FY28E P/E, based on estimated FY28 earnings per share of \u20b9 29.4, to arrive at its \u20b9 942 target price. The brokerage said the valuation was supported by a sub-1.0 PEG, its position within the 30\u201365x peer P/E range and a scarcity premium for India\u2019s sole listed pure-play drone manufacturer.\n\nThe drone stock has lost 7.5% in 1 month and 11.5% in 3 months. Meanwhile, in 6 months, it advanced over 80% while added 38.5% in the last 1 year. LTP at Trading at \u20b9 730.90, the stock is currently 27% away from its 52-week high of \u20b9 997, hit in June 2026. Meanwhile, it touched its 52-week low of \u20b9 367.95 in March 2026.\n\nAshika highlighted the \u20b9 200 billion Fast Track Procurement (FTP) pipeline as a major near-term catalyst for the sector.", "source": "LiveMint Markets", "pub_date_str": "26 Sep 2026, 05:57 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Bitcoin holds near $84,000 as rising bond yields offset regulatory progress", "full_content": "", "source": "Investing.com News", "pub_date_str": "26 Sep 2026, 05:57 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "In Brazil, frustration over cost of living undermines Lula\u2019s reelection bid", "full_content": "", "source": "Investing.com News", "pub_date_str": "26 Sep 2026, 05:54 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Airlines waive change fees ahead of nor'easter as flight disruptions trickle in", "full_content": "U.S. airlines waived change fees for flights Friday through Sunday ahead of a nor'easter that federal forecasters warn will bring high winds and rainfall with the potential for dangerous flooding.\n\nAs of Saturday morning, around 250 Boston flights were canceled, about a quarter of the day's schedule, according to FlightAware. On Friday, more than 600 flights to and from LaGuardia Airport in New York were delayed, close to 60% of the schedule. Dozens of others were delayed at major New England and New York-area airports.\n\nCarriers will often cancel a chunk, if not most, of their schedules during severe winter storms or hurricanes to ensure planes, passengers, and crews aren't out of place, but airlines are still assessing the nor'easter's potential path and impact.\n\nAmerican Airlines , United Airlines , Delta Air Lines , and JetBlue Airways said customers can change flights to a range of airports in the New York City area, Boston, and smaller New England airports without paying a change fee or fare difference if they can fly anytime before the middle of next week.\n\nPotential weekend disruptions follow an equipment outage on Monday that forced carriers to cancel hundreds of flights bound for the New York area and Philadelphia.", "source": "CNBC Top News", "pub_date_str": "26 Sep 2026, 05:49 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "China wants in on U.S. AI data center boom. Here's why", "full_content": "China and the U.S. may be competing for dominance in artificial intelligence, but some Chinese manufacturers are eyeing the U.S. data center buildout as an opportunity.\n\n\"We can see very big potential in the U.S. market,\" said S.K. Lee, a global vice president with Singapore-registered Brightray, an AI infrastructure company. \"The China market is equally important, but we can see that there's a stronger demand in the U.S.\"\n\nBrightray's sole manufacturer is Chinese firm PrefabDC, which makes prefabricated data centers. Brightray manages the construction of the buildouts.\n\nEven with public backlash over the AI data center buildout growing, the U.S. boasts more AI data centers than any other country, with 5,427 in 2025, according to data published by the Stanford Institute for Human-Centered Artificial Intelligence . China had 449, according to the same report.\n\nU.S. tech giants like Alphabet , Microsoft , Meta and Amazon are estimated to spend around $765 billion combined this year on AI infrastructure. JPMorgan Chase CEO Jamie Dimon recently said that figure could hit $1 trillion next year .\n\nChinese companies like Alibaba have committed far less. But the Chinese government has outlined plans to invest $295 billion to build data centers over the next five years, though it's still a far cry from U.S. private-sector investment.\n\n\"Chinese companies just are not generating as much revenues from their AI services,\" said Jeffrey Ding, AI expert and assistant professor at The George Washington University. \"And that's one of the reasons why they're not able to invest in these enormous data center buildouts that their competitors in the U.S. are doing.\"\n\nDing said the deeper issue is \"there is not as much demand for the AI services.\"", "source": "CNBC World Economy", "pub_date_str": "26 Sep 2026, 05:30 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Why bond-market volatility hasn\u2019t spilled over into stocks", "full_content": "The bond market has a reputation for being boring. But lately, it has been the source of much of the action in the U.S.", "source": "MarketWatch Top Stories", "pub_date_str": "26 Sep 2026, 05:30 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "DA hike July 2026: Will DA rise to 64% from 60%? \u20b918,000, to \u20b956,100 basic salary | Calculate your likely increase", "full_content": "The next Dearness Allowance (DA) hike in July may raise the allowance for central government employees from 60% to 64%, based on the latest Consumer Price Index for Industrial Workers (AICPI-IW) data, an Economic Times article noted. However, the numbers are still an estimate as the government has yet to announce the final rate.\n\nMeanwhile, the Confederation of Central Government Employees and Workers has urged the Department of Expenditure to expedite the process for the July 2026 DA/DR instalment, effective from 1 July. And also said that it should be placed before the competent authority once the relevant Consumer Price Index (CPI) data and prescribed formula allow the new rate to be determined\n\nThe Confederation said the existing DA/DR rate stands at 60% from January 2026. It pointed to the movement in DA/DR from 46% in July 2023 to 50% in January 2024, 53% in July 2024, 55% in January 2025, 58% in July 2025 and 60% from January 2026, saying the increase reflected the continuing impact of rising prices.\n\nDA is calculated depending on an employee's basic pay. For example, if an employee earns a basic salary of \u20b9 18,000, then at the current 60% rate, he receives \u20b9 10,800 as DA. At 64%, this would rise to \u20b9 11,520\u2014an increase of \u20b9 720 per month.\n\nFor a basic pay of \u20b9 44,900, DA would increase from \u20b9 26,940 to \u20b9 28,736, adding \u20b9 1,796 a month. For a basic pay of \u20b9 56,100, the increase would be \u20b9 2,244 per month.\n\nThe final amount will depend on the Centre\u2019s official DA announcement.\n\nWith the festive season approaching, the Confederation of Central Government Employees and Workers has urged the government to speed up the formal process for the July 1, 2026 DA instalment, citing rising household expenses and other financial commitments.\n\nThe organisation clarified that it was not seeking any advance payment or additional benefit.", "source": "LiveMint Money", "pub_date_str": "26 Sep 2026, 05:25 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Same playbook, different numbers: Why FPI selling may not be the story it looks like", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Same playbook, different numbers: Why FPI selling may not be the story it looks like National Stock Exchange of India Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Same playbook, different numbers: Why FPI selling may not be the story it looks like SECTIONS Same playbook, different numbers: Why FPI selling may not be the story it looks like By Kumar Gaurav , ETMarkets.com Last Updated: Sep 26, 2026, 05:05:00 P ng market share, integrated technology stack, deep liquidity and broad range of services.\n\n\u201cWe view NSE , India's largest stock exchange, as \u2018The Dominator\u2019, due to its leading market share and power. Full set of services, technology stack and deep liquidity make NSE the lynchpin of India's financialisation,\u201d Macquarie said.\n\nAt the brokerage's target, the stock would have an upside of around 10% from its last closing price of \u20b9 1,792.\n\nMacquarie said NSE's entrenched network effects and strong cash generation support its premium valuation, while new products and rising non-transaction revenues could provide further upside.\n\nThe brokerage expects the exchange to deliver a 12% revenue CAGR between FY26 and FY30, with margins remaining around the mid-70% range. It also expects India's broader stock-exchange market to grow at a 12-14% CAGR over the same period, supported by rising investor participation and product expansion.\n\nNational Stock Exchange (NSE) shares witnessed some profit booking on Friday, September 25, falling 1.4% to \u20b9 1792 per share on BSE, after gaining nearly 2% in the previous session. The stock had made its debut on the BSE on Thursday at \u20b9 1,800 per share, a modest 0.84% premium to its issue price of \u20b9 1785.\n\nMacquarie's bullish thesis on NSE rests largely on the exchange's scale and its position across multiple segments of India's capital-market infrastructure.", "source": "LiveMint Markets", "pub_date_str": "26 Sep 2026, 04:57 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "InvestingPro\u2019s Fair Value nailed 68% gain in Capital Bancorp stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "26 Sep 2026, 04:42 PM IST", "pub_date_relative": "2h ago", "cfa_to     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
