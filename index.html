orities.\n\nAccording to the Tribune, the District Consumer Disputes Redressal Commission in Chandigarh directed the Branch Manager of the UCO Bank branch in Rupnagar, Punjab, to pay \u20b9 15,000 in compensation to the complainant for deficiency in service, mental agony, and litigation expenses.\n\nThe commission also dismissed the bank's defense, noting that the hardship and harassment suffered by the family cannot be overlooked simply because the bank cleared the pending arrears while the case was being heard.\n\nRupnagar resident Sukhwinder Singh had filed a complaint on behalf of his mother, Prakash Kaur. Sukhwinder's father, Nasib Singh, had retired from the Chandigarh Transport Undertaking (CTU) on March 31, 1995 and his pension was sanctioned as per rules, The Tribune reported.\n\nAfter his death on November 28, 2001, the family pension was transferred to his mother from November 29, 2001, but subsequent revisions in the pension were not correctly implemented.\n\nThe complainant alleged that despite multiple official communications from the pension-sanctioning authorities, repeated visits to the branch, and formal representations, the bank failed to release the correctly revised family pension, admissible old-age allowance, Leave Travel Concession (LTC) benefits and revised medical allowances, the report added.\n\nDuring the proceedings, UCO Bank's counsel submitted that it had no role in the matter, claiming its responsibility was strictly limited to maintaining the complainant\u2019s pension account and facilitating withdrawals.\n\nThe counsel denied any deliberate delay or deficiency, stating that the lag was bona fide and arose during recalculation and verification of the claim.", "source": "LiveMint Money", "pub_date_str": "09 Nov 2026, 01:11 PM IST", "pub_date_relative": "29m ago"}, {"title": "Why Sun Pharma Advanced Research shares surge 11% despite weak sentiments on D-Street; what's boosting medical stock?", "full_content": "Vaamanaa Sethi Published 9 Nov 2026, 01:10 PM IST Prefer Livemint on Google Sun Pharma Advanced Research (SPARC) shares jumped over 11.30% in Monday's trading session, defying weak sentiment in the Indian stock market. The pharma stock opened in green at \u20b9 198.50 apiece on the NSE today, as compared to the previous close of \u20b9 197.03 on Sunday's Muhurat Trading and touched an intraday high of \u20b9 219.49 on 9 November.\n\nMeanwhile, Indian equity benchmark indices, Sensex and Nifty, opened lower on Monday, weighed down by selling pressure in heavyweight IT stocks and profit-booking following the recent sharp rally in the stock market. The 30-share BSE Sensex fell 93.95 points to 80,919.19 in early trading, while the NSE Nifty 50 declined 30 points to 24,968.80.\n\nThe stock rally came in after Sun Pharma Advanced Research shares witnessed a spurt in trading volume. According to data available on NSE, around 251.75 lakh shares have changed hands so far on Monday.\n\nSPARC reported a consolidated net loss of \u20b9 24.39 crore for the second quarter of FY27, narrowing from a net loss of \u20b9 75.85 crore in the corresponding quarter of the previous financial year. The pharmaceutical company's financial performance showed an improvement in profitability, although it continued to remain in the red.\n\nThe company's consolidated revenue from operations surged 282.1% year-on-year to \u20b9 30.03 crore in Q2 FY27, compared with \u20b9 7.86 crore in Q2 FY26. The sharp increase in revenue indicates improved business performance during the quarter.\n\nSPARC's basic and diluted loss per share improved to \u20b9 0.75 in Q2 FY27 from \u20b9 2.34 in the year-ago quarter, reflecting a reduction in losses. However, the company's operating expenses stood at \u20b9 75.60 crore during the reporting quarter, remaining significantly higher than its revenue from operations.\n\nOn a standalone basis, the company reported total income of \u20b9 53.65 crore for Q2 FY27, while its net loss after tax stood at \u20b9 24.58 crore.", "source": "LiveMint Markets", "pub_date_str": "09 Nov 2026, 01:10 PM IST", "pub_date_relative": "30m ago"}, {"title": "Anirudh Ravichander-Kavya Maran Wedding: Rajinikanth, MK Stalin Head To Greece", "full_content": "Photos and videos of Rajinikanth and MK Stalin at the airport have gone viral on social media as they head to Greece for Anirudh Ravichander and Kavya Maran's wedding.", "source": "NDTV Profit", "pub_date_str": "09 Nov 2026, 01:09 PM IST", "pub_date_relative": "31m ago"}, {"title": "Argenx to acquire biotech firm Unnatural Products for $1.15 billion", "full_content": "", "source": "Investing.com News", "pub_date_str": "09 Nov 2026, 01:06 PM IST", "pub_date_relative": "34m ago"}, {"title": "Exclusive-Chinese banks boost dollar deposit rates, sources say, as Beijing seeks to smooth yuan rally", "full_content": "", "source": "Investing.com News", "pub_date_str": "09 Nov 2026, 01:06 PM IST", "pub_date_relative": "34m ago"}, {"title": "Stock futures climb as investors eye AI trade, brace for more data and earnings: Live updates", "full_content": "Stock futures were higher on Monday, with traders eyeing whether technology shares can continue to recover, while awaiting the release of key inflation data and earnings from major AI companies this week.\n\nS&P 500 futures gained 0.42%, while the Nasdaq 100 futures added 0.18%. Futures tied to the Dow Jones Industrial Average added 375 points, or 0.73%. Over in Asia, markets were mostly up on Monday, with Taiwanese equities leading the rise. The Taiwan Weighted Index closed 4.94% up at 41,664.7, marking the largest one-day gain since 31 July.\n\nThe index was powered by gains in tech heavyweights Taiwan Semiconductor Manufacturing Company and Hon Hai Precision Industry \u2014 also known as Foxconn.\n\nSouth Korea's Kospi fell 0.81% after a choppy session to end at 5,018.85, while Japan's Nikkei 225 closed 2.33% higher at 58,775.5.\n\nMainland China's CSI 300 rose marginally to 4,056.11, s predict yields on the 10-year bond could oscillate between 7.30% and 7.10%, with particular attention on India's October inflation report due for release this Thursday.\n\nIndian government bonds exhibited limited movement today as oil prices showed signs of stabilization. Investors are remaining cautious, especially with inflation data from both the United States and India on the horizon. Scheduled for later today is a bond auction totaling 290.5 billion rupees. Analysts predict yields on the 10-year bond could oscillate between 7.30% and 7.10%, with particular attention on India's October inflation report due for release this Thursday.\n\nBond yields muddy the books as banks prepare for new accounting rules\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "09 Nov 2026, 01:03 PM IST", "pub_date_relative": "37m ago"}, {"title": "Stock Market Today: Sensex Falls, Nifty 50 Below 24,900; HCL Tech, Tata Steel, Infosys Top Drags", "full_content": "Among sectors,losses were seen in Nifty IT, Nifty Metal, Nifty FMCG and Nifty Oil & Gas, whileNifty Pharma, Nifty PSU Bank, Nifty Media and Nifty Private Bank were in the green.", "source": "NDTV Profit", "pub_date_str": "09 Nov 2026, 01:02 PM IST", "pub_date_relative": "38m ago"}, {"title": "Financial Mistakes People Make In Their 20s That Can Cost Them Lakhs Later", "full_content": "A stable income does not guarantee financial security against unforeseen events. Job uncertainty, medical emergencies and unplanned expenses can quickly disrupt even carefully managed finances.", "source": "NDTV Profit", "pub_date_str": "09 Nov 2026, 01:01 PM IST", "pub_date_relative": "39m ago"}, {"title": "Explained: Why Nvidia shares dropped 4% in overnight trade and what analysts warn can trigger a bloodbath?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Explained: Why Nvidia shares dropped 4% in overnight trade and what analysts warn can trigger a bloodbath? The Economic Times daily newspaper is available online now. Read Today's Paper Explained: Why Nvidia shares dropped 4% in overnight trade and what analysts warn can trigger a bloodbath? SECTIONS Explained: Why Nvidia shares dropped 4% in overnight trade and what analysts warn can trigger a bloodbath? By Debaroti Adhikary , Last Updated: Nov 09, 2026, 01:00:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Nvidia shares dropped over 4% after CEO Jensen Huang acknowledged an affair with Alice Huang. Jensen Huang's relationship with Alice, a Chinese national, raised security concerns following intelligence reports. Nvidia has initiated an investigation into these allegations, although the board believes no secrets were compromised. Analysts suggest the company's upcoming earnings report will be crucial for market sentiment. Concerns linger over Huang's position if further evidence of wrongdoing emerges.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "09 Nov 2026, 01:00 PM IST", "pub_date_relative": "40m ago"}, {"title": "Bigg Boss 20: Salman Khan Gets Teary Eyed As Mohit Chauhan Sings For Salim Khan", "full_content": "Salman Khan was moved to tears on Bigg Boss 20 after singer Mohit Chauhan expressed his admiration for Salim Khan.", "source": "NDTV Profit", "pub_date_str": "09 Nov 2026, 12:58 PM IST", "pub_date_relative": "42m ago"}, {"title": "A Rat Has Grounded This Rs 1-Crore Car In Thane For Nearly 3 Months", "full_content": "The owner couple are still paying EMIs of Rs 2.5 lakh a month for a car they cannot use, and they have not been given a courtesy vehicle.", "source": "NDTV Profit", "pub_date_str": "09 Nov 2026, 12:52 PM IST", "pub_date_relative": "48m ago"}, {"title": "8th Pay Commission: Expert explains report deadline, when revised salaries and pensions may take effect", "full_content": "Central government employees and pensioners are awaiting the final 8th Pay Commission report, expected in the coming months, which will help determine revised salaries, pensions and allowances. But when the new pay structure takes effect depends on when the commission submits its report and how quickly the government accepts and implements its recommendations.\n\nThe 8th Pay Commission is a temporary three-member body headed by Justice Ranjana Prakash Desai. It was constituted on November 3, 2025, and has 18 months to submit its recommendations, which puts the expected deadline around May 2027. Submitting the report does not mean revised salaries will be credited immediately.\n\nExplaining the likely timeline, Adhil Shetty, CEO of BankBazaar, said:\n\n\u201cThe 8th Pay Commission has been given 18 months from its constitution in November 2025 to submit its report, placing the broad timeline around May 2027. The panel also has the option of submitting interim reports on specific matters along the way, so parts of its work could become visible before the final deadline. Commissions of this scale have historically had the provision to seek more time if needed, since the exercise involves detailed consultation across a wide range of service and pay-related matters.\u201d\n\nIn other words, employees and pensioners could see updates on specific recommendations before the final report if the panel submits interim reports . But an interim report does not mean any salary or pension revision will be implemented immediately. The final decision rests with the central government.\n\nReport submission is only one stage. The government will have to examine the recommendations , decide which to accept, reject or amend based on fiscal considerations, and make the necessary financial provisions before implementing the revised pay structure. The government has also told Parliament that implementation will be decided after the final report is tabled.", "source": "LiveMint Money", "pub_date_str": "09 Nov 2026, 12:46 PM IST", "pub_date_relative": "54m ago"}, {"title": "47% rally in one month! Infra stock under \u20b9100 inches close to 52-week high after announcement of Q2 Results 2026 date", "full_content": "Sharmila Bhadoria Published 9 Nov 2026, 12:40 PM IST Prefer Livemint on Google Shares of Highway Infrastructure rallied nearly 1.18% during Monday\u2019s intraday trading session despite weaker sentiment prevailing across the Indian stock market today. The uptick in the infra stock has come ahead of the board meeting scheduled for this week.\n\nHighway Infrastructure share price has surged 47% in one month and around 57.73% in three months. Here are all the details about the infrastructure stock.\n\nThe company\u2019s board of directors meeting is scheduled for Saturday, November 14. The board meeting will consider and approve \u201cUnaudited Financial Results (Standalone and Consolidated) of the Company for the quarter and half year ended 30th September 2026, alongwith the Limited Review Report.\u201d Additionally, the board will also consider any other matter with the permission of the chairman.\n\nAccording to Mahesh M Ojha, VP- Research and Business Development at KC Securities, the stock is facing a hurdle at \u20b9 78. \u201cOn breaking above this resistance, we can expect a fresh bull trend in the stock. So, fresh buying is allowed only above \u20b9 78, as the stock has already rallied a lot. Existing shareholders can hold the stock, maintaining a strict stop-loss at \u20b9 68,\u201d stated the expert.\n\nThe stock was trading in green earlier in the day, but gave up most of its gains in the second-half of Monday\u2019s trading session. Shares of Highway Infrastructure were trading 1.58% lower at \u20b9 71.01 per share on BSE with a market capitalisation of \u20b9 509.29 crore at 12:34 pm on Monday, November 9.\n\nIts share price value touched an intraday high of \u20b9 74.95 per share and an intraday low of \u20b9 71.01 per share. The infra stock has delivered 47% return in one month, 62% in three months and around 37.5% in six months, as per BSE data at 12:35 pm on Monday.\n\nCatch all the Business News , Market News , Breaking News Events, JIO IPO Listing Today LIVE and Latest News Updates on Live Mint.", "source": "LiveMint Markets", "pub_date_str": "09 Nov 2026, 12:40 PM IST", "pub_date_relative": "1h ago"}, {"title": "Asian stocks rebound after AI rout", "full_content": "Declines last week had pushed many indices into bear market territory", "source": "FT Markets", "pub_date_str": "09 Nov 2026, 12:39 PM IST", "pub_date_relative": "1h ago"}, {"title": "HFCL shares locked in 5% lower circuit, down 21% in a month despite record Q2 profit: What lies ahead?", "full_content": "HFCL share price remained locked in the 5% lower circuit on Monday, 9 November, extending its recent decline despite the telecom equipment maker reporting its strongest-ever quarterly performance in Q2 FY27.\n\nThe stock has fallen 6.23% over the past week and 15.73% in the last two weeks. It has declined 21.14% over the past month and 1.01% in the past three months. However, the stock continues to trade significantly higher, with gains of 45.98% over six months and 199.10% on a year-to-date (YTD) basis.\n\nThe weakness comes despite a sharp improvement in the company's financial performance, with HFCL reporting a multi-fold increase in consolidated net profit for the September quarter, supported by strong demand for optical fibre cables from artificial intelligence (AI) data centres. The company has also outlined an ambitious growth outlook, backed by a sizeable order book and planned investments to expand manufacturing capacity.\n\nHFCL reported a multi-fold jump in consolidated net profit to \u20b9 394.22 crore in Q2 FY27, compared with approximately \u20b9 72 crore in the corresponding quarter last year, according to its regulatory filing.\n\nConsolidated revenue from operations more than doubled to \u20b9 2,541.79 crore during the quarter, from \u20b9 1,043.34 crore in the year-ago period. The company's profit after tax (PAT) margin also expanded sharply to 14.36% from 2.23% a year earlier.\n\nThe strong performance was driven by rising demand for optical fibre cables, particularly from AI data centres, alongside growing opportunities across telecom networks and data centre infrastructure.\n\nCalling it the best-ever quarterly performance in HFCL's history, Managing Director Mahendra Nahata said the results reflected the growing scale, strength and momentum of the business.", "source": "LiveMint Markets", "pub_date_str": "09 Nov 2026, 12:32 PM IST", "pub_date_relative": "1h ago"}, {"title": "Bank Holiday, closed tomorrow 10 Nov 2026: Ahmedabad, Bengaluru, Belapur, Dehradun, Gangtok, Mumbai, Nagpur; here\u2019s why", "full_content": "Bank Holiday, closed tomorrow 10 Nov 2026: Banks including the State Bank of India and HDFC Bank will be closed in Ahmedabad, Bengaluru, Belapur, Dehradun, Gangtok, Mumbai and Nagpur on Tuesday, 10 November.\n\nAccording to Reserve Bank of India's rules, all scheduled and non-scheduled banks observe listed holidays and mandatory closure on second and fourth Saturdays and every Sunday in a month. In-branch services are shut, but digital services (online net banking, app) will remain operational.\n\nUsually, in addition to the common national and gazetted holidays, or weekend offs, banks in India could have local holidays and festivals off, as required. The central bank releases its annual, official bank holiday list in January. Please contact your nearest local bank branch for their confirmed holiday schedule for 2026.\n\nBanks will be closed for a total of 16 days this month, including state and regional holidays and weekend offs, as per the official RBI calendar for November. This includes weekend offs on November 1, 8, 15, 22, 28, and 29 for Sunday; and November 14 and 28 for second and fourth Saturday holidays, respectively. Besides these are regional holidays on November 9, 10, 11, 13, 16, 20, 23, 24 and 27.\n\nBanks, including the SBI , HDFC Bank, ICICI Bank, Axis Bank, Punjab National Bank, Canara Bank, Bank of Baroda and other lenders across India will remain closed tomorrow in the following cities:\n\nOn Tuesday, 10 November 2026, public and private sector lenders will be closed for customers in Ahmedabad, Belapur, Bengaluru , Dehradun, Gangtok, Mumbai and Nagpur on account of Diwali / Bali Pratipada, Deepawali / Govardhan Puja, Laxmi Puja and Vikram Samvat New Year.\n\n\u2014 Diwali / Balipratipada: This is the fourth day of Diwali and is celebrated in honour of the notional return of the daitya-king Bali (Mahabali) to earth.\n\n\u2014 Deepawali / Govardhan Puja : This is the Hindu festival celebrated on the first lunar day in the month of Kartika, on the fourth day of Diwali.", "source": "LiveMint Money", "pub_date_str": "09 Nov 2026, 12:31 PM IST", "pub_date_relative": "1h ago"}, {"title": "Asian Markets at Risk of Pressure on Nvidia Probe: Markets Wrap - Bloomberg.com", "full_content": "Asian Markets at Risk of Pressure on Nvidia Probe: Markets Wrap Bloomberg.com Asian stocks bounce as AI, Mideast jitters recede; dollar firm on Fed bets Reuters Paraguay President Pe\u00f1a under investigation, faces removal from office over bank collapse AP News Asian stocks rebound after AI rout Financial Times Korea, Taiwan and Japan take first jolt from Democratic AI shock Asia Times", "source": "Google News Business", "pub_date_str": "09 Nov 2026, 12:26 PM IST", "pub_date_relative": "1h ago"}, {"title": "Gold Glitters: Yellow Metal Prices Jump Above Rs 1,44,000; Silver Prices Up By Rs 4,300", "full_content": "Gold and silver prices extended their recovery on MCX on Monday, Nov. 9. December gold futures rose to Rs 1,44,400 per 10 grams, while silver touched Rs 1,89,399 per kg, outperforming gold with a 2.3% gain.", "source": "NDTV Profit", "pub_date_str": "09 Nov 2026, 12:23 PM IST", "pub_date_relative": "1h ago"}, {"title": "Cops, I-T And GST Officials Under ED Lens For Allegedly Aiding Cyber Fraudsters: Report", "full_content": "The cash was taken out and swapped for foreign currency through RBI-licensed dealers.", "source": "NDTV Profit", "pub_date_str": "09 Nov 2026, 12:18 PM IST", "pub_date_relative": "1h ago"}, {"title": "Two incomes, no cradle: what India\u2019s DINK couples are telling policymakers", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nAt wedding receptions across the country, the question that follows the blessings has not changed in decades: \u2018Any good news?\u2019 What has changed is the answer. A growing number of young couples now reply with a polite smile and a firm no.\n\nThey draw two salaries, share an EMI, and have decided, for now or for good, that a child is not part of the plan. Social media calls them DINKs, short for double income, no kids, and the numbers suggest this is more than a fad.\n\nThe sample registration system report for 2023 places India\u2019s total fertility rate at 1.9, below the replacement level of 2.1. Eighteen states and Union Territories are already under that line, with Tamil Nadu at 1.3 and Delhi at 1.2. Even a decade ago, the National Family Health Survey of 2015 to 2016 found about 7% of married women aged 40 to 49 had no children.\n\nDINK is only the best-known entry in a lengthening list. DINKYs have double income and no kids yet, but plan to have them later. DISKs, with double incomes and a single kid, fill urban apartment complexes, while DEWKs, dual-employed with kids, juggle careers and school runs. SINKs live on a single income with no kids, GINKs (green inclination, no kids) cite climate anxiety, and DINKWADs have swapped a baby for a dog.\n\nThen there is the wry SITCOM: single income, two children, oppressive mortgage. The acronyms are playful, yet together they map the trade-offs couples make among money, time and care. The DINKY category deserves special attention, because postponement can quietly harden into permanence as age catches up with intention.\n\nIt is tempting to dismiss this as a generation that prefers travel to toddlers. The evidence says otherwise.", "source": "LiveMint Money", "pub_date_str": "09 Nov 2026, 12:16 PM IST", "pub_date_relative": "1h ago"}, {"title": "Nvidia stock in focus: 3 key risks after Jensen Huang probe", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News Powered By Nvidia stock in focus: 3 key risks after Jensen Huang probe Written by Anupam Nagar , ETMarkets.com | Nov 09, 2026, 12:35:19 PM IST 1 / 8 Nvidia CEO Jensen Huang faces scrutiny Nvidia has launched an independent investigation into whether CEO Jensen Huang was targeted by a foreign intelligence operation. The probe follows reports of Huang's alleged relationship with Alice Huang, a businesswoman suspected by US authorities of having links to Chinese intelligence. Huang has admitted to being unfaithful to his wife and apologised to his family, employees and shareholders. The controversy has brought Nvidia's leadership and corporate governance under scrutiny. (Sources: Reuters, Yahoo Finance, CNBC)\n\nNvidia's board has initiated an independent investigation overseen by a committee of independent directors, with external legal counsel assisting the review. Huang has agreed to cooperate with the investigation and remains committed to leading the company. Nvidia has said it has no reason to believe that its confidential information or US national security has been compromised. The board has also expressed confidence in Huang and his leadership team.\n\nAlice Huang is a businesswoman and former executive associated with Singapore-based Megaspeed, an Nvidia customer that has faced scrutiny over suspected efforts to obtain advanced AI chips restricted from export to China. US authorities reportedly concluded that Alice Huang was a Chinese intelligence asset. The allegations have raised questions about potential access to sensitive technology and information, although no evidence has established that Nvidia's technology or confidential information was compromised.\n\nThe first major risk is leadership uncertainty.", "source": "Economic Times Markets", "pub_date_str": "09 Nov 2026, 12:13 PM IST", "pub_date_relative": "1h ago"}, {"title": "Nuvama Wealth Management Q2 Results: Profit rises 19% YoY to Rs 304 crore", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Nuvama Wealth Management Q2 Results: Profit rises 19% YoY to Rs 304 crore Nuvama Wealth Management Share Price 360 One Wam Share Price Anand Rathi Wealth Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Nuvama Wealth Management Q2 Results: Profit rises 19% YoY to Rs 304 crore SECTIONS Nuvama Wealth Management Q2 Results: Profit rises 19% YoY to Rs 304 crore PTI Last Updated: Nov 09, 2026, 12:09:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Nuvama Wealth Management Ltd achieved a consolidated net profit of Rs 303.5 crore for Q2 FY27. The company saw a revenue increase of 20.35% to Rs 1,366 crore for the same quarter. Client assets reached Rs 5.5 lakh crore, reflecting a 25% year-on-year growth. Wealth management, asset services, and capital markets drove this substantial growth. The company demonstrated strong operating profits with a return on equity remaining robust at 29%.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "09 Nov 2026, 12:09 PM IST", "pub_date_relative": "1h ago"}, {"title": "Citi Raises Nifty 50 Target To 28,000; Adds Bajaj Finance To Its Top Picks", "full_content": "Citi added Bajaj Finance to its top picks, citing 25%+ growth visibility with diversified product bouquet and healthy provisioning buffer, that supports earnings resilience and superior return ratios.", "source": "NDTV Profit", "pub_date_str": "09 Nov 2026, 12:08 PM IST", "pub_date_relative": "1h ago"}, {"title": "Jensen Huang-Alice Huang Row: More Photos Surface Amid Chinese Spy Allegations", "full_content": "The photos emerged as Nvidia's board investigates reports that Nvidia chief executive Jensen Huang was targeted by a foreign intelligence operation.", "source": "NDTV Profit", "pub_date_str": "09 Nov 2026, 12:06 PM IST", "pub_date_relative": "1h ago"}, {"title": "'Ramayana' Scores Biggest Worldwide IMAX Debut For An Indian Film; See Global Collection", "full_content": "'Ramayana: Rise of a Legend' earned $55.7 million worldwide in four days, including a record $6 million from IMAX screenings.", "source": "NDTV Profit", "pub_date_str": "09 Nov 2026, 12:06 PM IST", "pub_date_relative": "1h ago"}, {"title": "Q2 results effect? Small-cap stock under \u20b950 MIC Electronics rises 3% despite weak market trends. Do you own?", "full_content": "Vaamanaa Sethi Published 9 Nov 2026, 12:05 PM IST Prefer Livemint on Google Small-cap stock under \u20b9 50 : MIC Electronics shares rose as much as 2.71% in Monday's trading session, defying weak sentiment on Dalal Street. The small-cap stock opened in green at \u20b9 40.96 apiece on BSE today, as compared to the previous close of \u20b9 40.19 on Sunday's Muhurat Trading and touched an intraday high of \u20b9 41.64 on 9 November.\n\nMIC Electronics share price hit a 52-week high of \u20b9 57.60 per share on 8 November (Muhurat Trading day).\n\nThe stock rally came in after the company reported its financial results for the quarter ending on 30 September 2026.\n\nMeanwhile, Indian equity benchmark indices Sensex and Nifty opened lower on Monday, weighed down by selling pressure in heavyweight IT stocks and profit-booking following the recent sharp rally in the domestic stock market. The 30-share BSE Sensex fell 93.95 points to 80,919.19 in early trade, while the 50-share NSE Nifty declined 30 points to 24,968.80.\n\nMIC Electronics reported a strong financial performance for the September quarter of FY27, with its consolidated revenue from operations surging 140.2% year-on-year (YoY) to \u20b9 91.01 crore, compared with \u20b9 37.89 crore in the corresponding quarter last year.\n\nTotal income also increased to \u20b9 91.47 crore in Q2 FY27 from \u20b9 38.42 crore in Q2 FY26.\n\nThe company's operating performance improved during the quarter, with EBITDA (earnings before interest, taxes, depreciation and amortisation) rising 70.1% YoY to \u20b9 6.48 crore, against \u20b9 3.81 crore in the year-ago period.\n\nMIC Electronics' profit before tax (PBT) more than doubled to \u20b9 4.60 crore in Q2 FY27, compared with \u20b9 2.17 crore in Q2 FY26. The company reported a similar increase in its net profit, with profit after tax (PAT) rising 112% YoY to \u20b9 4.60 crore from \u20b9 2.17 crore in the corresponding quarter of the previous financial year.", "source": "LiveMint Markets", "pub_date_str": "09 Nov 2026, 12:05 PM IST", "pub_date_relative": "1h ago"}, {"title": "Coal India, IOCL, Vedanta to BPCL: What dividends mean for the Indian stock market amid bull trend buzz? Experts decode", "full_content": "COALINDIA BPCL IOC ONGC Asit Manohar Published 9 Nov 2026, 12:04 PM IST Prefer Livemint on Google Dividend stocks 2026: Amid high volatility in the Indian stock market throughout the year, dividend stocks, especially PSU energy stocks Coal India Ltd, Bharat Petroleum Corporation Ltd (BPCL), Indian Oil Corporation Ltd (IOCL), Oil and Natural Gas Corporation (ONGC), etc., remained in the news for announcing cash rewards for their eligible shareholders in the form of dividends. In the year 2026, Coal India Ltd has given away dividends on four occasions, and the net dividend paid by the energy PSU is \u20b9 26.50 per share. BPCL has announced a \u20b9 10 per share dividend for 2026, whereas IOCL's dividend is \u20b9 3.25 per share, and ONGC's dividend for 2026 is \u20b9 7.25 per share. It should be noted that ONGC will trade ex-dividend on 12 November 2026 to finalise the list of eligible shareholders for the dividend, which is yet to be announced. The PSU energy stocks are expected to have a dividend yield in the 5% to 7% range in 2026.\n\nAccording to stock market experts, dividend payments are cash distributions, indicating that the company has cash reserves. Amid volatile Indian markets, we saw energy, IT, and financial companies leading the way by announcing dividends to their shareholders. They said that dividend-paying stocks are popular among retail investors, but they are equally popular among institutional investors because dividends provide steady income beyond the stock's rally.\n\nDecoding the dividends pay hike by the energy PSUs in 2026, Avinash Gorakshkar, Founder of Avinash Mentor Research, said, \u201cDividend-paying companies are those that have huge cash reserves. That's why we see PSUs, banking and IT companies leading the list in dividend payouts.", "source": "LiveMint Markets", "pub_date_str": "09 Nov 2026, 12:04 PM IST", "pub_date_relative": "1h ago"}, {"title": "Mark Blyth: \u2018I call it the barbell from hell\u2019", "full_content": "The political economist on AI", "source": "FT Markets", "pub_date_str": "09 Nov 2026, 12:00 PM IST", "pub_date_relative": "1h ago"}, {"title": "Remember Durga Puja Couple Whose Video Won Hearts But Also Attracted Trolls? Their New Video Has Surfaced", "full_content": "The earlier clip showed a family of three singing along to 'Dugga Ma Asche' by Infra during a rickshaw ride through festive streets.", "source": "NDTV Profit", "pub_date_str": "09 Nov 2026, 11:56 AM IST", "pub_date_relative": "1h ago"}, {"title": "IRB Infra shares surge 6% after Q2 results: Is a bigger breakout on the cards? Stock market experts identify key levels", "full_content": "Dhanya Nagasundaram Published 9 Nov 2026, 11:53 AM IST Prefer Livemint on Google IRB Infrastructure Developers shares jumped over 6% on Monday, 9 November, extending their gains for the second consecutive trading session following the company's Q2 FY27 results.\n\nThe infrastructure company reported an 84.85% year-on-year (YoY) increase in consolidated net profit to \u20b9 260.15 crore for the September quarter of FY27, compared with \u20b9 141 crore in the corresponding period last year. The growth was driven by robust toll revenue and distributions from its Infrastructure Investment Trust (InvIT), according to the company's regulatory filing.\n\nTotal income for the July-September quarter increased to \u20b9 18,970.8 crore from \u20b9 17,510.16 crore in the year-ago period.\n\nCommenting on the performance, Chairman and Managing Director Virendra D Mhaiskar said the company's Q2 FY27 results demonstrated the counter-cyclical strength and structural resilience of its business model, despite global economic deceleration, supply chain fragmentation and geopolitical volatility.\n\nHe added that toll revenue grew around 15% year-on-year, supported by resilient traffic demand and effective tariff-linking mechanisms. This also contributed to steady cash flow generation and distributions from the InvIT.\n\nIRB Group has a portfolio of 27 revenue-generating highway assets, with an aggregate value of approximately \u20b9 94,000 crore across 13 states. With around 1.5 million vehicles crossing its assets every day, the group accounts for nearly one-tenth of India's total toll revenue.\n\nIRB Infrastructure Developers share price today opened at \u20b9 17.45 apiece on the BSE; the stock touched an intraday high of \u20b9 18.47 per share and an intraday low of \u20b9 17.19 apiece.\n\nRajesh Bhosale, Technical Analyst at My Advisor Alpha, said IRB Infrastructure has witnessed strong buying interest, breaking above its September swing high and the 89-day exponential moving average (EMA).", "source": "LiveMint Markets", "pub_date_str": "09 Nov 2026, 11:53 AM IST", "pub_date_relative": "1h ago"}, {"title": "Global Markets: 5 key themes to watch this week", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News Powered By Global Markets: 5 key themes to watch this week Written by Anupam Nagar , ETMarkets.com | Nov 09, 2026, 12:01:15 PM IST 1 / 7 Global markets brace for another turbulent week Global markets face a packed week as investors assess the AI-led technology selloff, US inflation data, oil price movements and geopolitical risks. Developments in Europe and Asia, along with the COP31 climate summit, will also remain in focus. (Sources: Reuters)\n\nThe Nasdaq plunged 5.5% on Thursday, marking its biggest single-day decline since April 2025 and wiping out $2.5 trillion in market value. Concerns over rising AI infrastructure costs and the prospect of tighter regulations following Democratic gains in the US midterm elections are weighing on technology stocks.\n\nInvestors will closely track Tuesday's US consumer price index (CPI) data and Friday's producer price index (PPI) numbers. The CPI is expected to rise 0.3% month-on-month, according to a Reuters poll. Markets are pricing in more than an 80% chance of another Federal Reserve rate hike in December.\n\nCrude oil prices have retreated amid expectations that US President Donald Trump could seek to de-escalate the Iran conflict following Republican losses in the midterm elections. Any fresh escalation could push energy prices higher, stoke inflation and complicate the Federal Reserve's policy outlook.\n\nEuropean markets will assess employment figures and revised third-quarter GDP data. The euro zone's preliminary GDP estimate showed 0.4% growth.", "source": "Economic Times Markets", "pub_date_str": "09 Nov 2026, 11:44 AM IST", "pub_date_relative": "1h ago"}, {"title": "Post Office Savings Account ATM facility: Withdrawal, transaction rules explained for POSA holders; top things to know", "full_content": "A Post Office Savings Account (POSA) gives holders convenient access to their savings through ATM, internet and mobile banking. But customers who use a POSA ATM card should keep track of withdrawal limits, the minimum balance requirement and transaction charges.\n\nUnderstanding these rules makes it easier to plan expenses and avoid declined transactions and extra charges.\n\nAs of 9 November 2026, the Department of Posts allows eligible POSA holders to withdraw up to \u20b9 25,000 a day from ATMs , subject to a maximum of \u20b9 10,000 per transaction. Account holders must also make sure withdrawals do not reduce the balance below the \u20b9 500 minimum. Transactions that exceed the available balance, the per-transaction limit or the daily cap may be declined.\n\nThe Department of Posts offers 5 free financial and non-financial transactions at its own ATMs. At other banks\u2019 ATMs, the free limit is 3 transactions a month in six metro cities and 5 in non-metro locations. These limits cover both financial and non-financial transactions and may change with government policy.\n\nSince November 1, 2025, transactions beyond the free limit at other banks\u2019 ATMs cost \u20b9 23 plus GST for financial transactions and \u20b9 11 plus GST for non-financial ones. At Department of Posts ATMs, the charges are \u20b9 10 plus GST and \u20b9 5 plus GST, respectively.\n\nInterest is calculated on the lowest balance held between the 10th and the last day of each month and is credited annually. If the balance is below \u20b9 500 at the end of a financial year, a \u20b9 50 account maintenance charge may be levied.\n\nA POSA combines accessible savings with convenient ATM facilities. To avoid declined transactions and extra charges, check the applicable rules, monitor your daily withdrawals and free transaction count, and keep your balance above the minimum.\n\nDisclaimer: The above information is based on the Department of Posts' published rules and available guidelines as of 9 November 2026. ATM charges and operating conditions may change.", "source": "LiveMint Money", "pub_date_str": "09 Nov 2026, 11:41 AM IST", "pub_date_relative": "1h ago"}, {"title": "What the global AI rout means for India", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nOn 5 November, US technology stocks saw their worst day since April 2025. The Nasdaq composite index fell 5.5% after Democrats swept the US midterm elections, raising fears that new limits on data centres could slow AI spending. Indian stocks moved the other way. Foreign investors bought $1.6 billion of Indian shares that day, their largest one-day purchase in nearly six years, according to exchange data.\n\nAnalysts at JPMorgan and elsewhere now call India a hedge against the AI trade. However, India is not completely insulated from the risks\u2014the exposure goes beyond the stock market as it runs through equipment suppliers, IT services firms and a planned data centre build-out.\n\nIndia's appeal during the rout comes from its low exposure to AI. Companies related to AI account for about 16% of MSCI India's value, against 70-80% in Taiwan and Korea, according to Goldman Sachs. Chipmakers dominate those markets. On 6 November, South Korea's Kospi closed 6% lower as SK Hynix fell 10% and Samsung Electronics 6%, while the Nifty 50 rose about 2%.\n\nThe same low exposure hurt India earlier in the year. Its lack of AI-linked stocks kept foreign investors away, Reuters reported, and they sold a record $30 billion of Indian shares between January and October. The Kospi was still up 20% for the year on 6 November. The Nifty 50 was down about 6%.\n\nSome investors now treat that gap as protection. JP Morgan describes India as an \"AI hedge\" for funds cutting crowded AI positions. Goldman's Timothy Moe expects markets less exposed to AI, such as India, to see \"some relative outperformance\". Bernstein says India is \"neither an AI beneficiary nor an anti-AI trade\", pointing to its valuation of 18.6 times forward earnings, higher than in South Korea and Taiwan.\n\nWhile the benchmark indices rose, India's own AI-linked stocks fell with global markets.", "source": "LiveMint Markets", "pub_date_str": "09 Nov 2026, 11:37 AM IST", "pub_date_relative": "2h ago"}, {"title": "Up 118% in 6 months! This volume shocker pharma stock skyrockets 14% despite weak trends on Dalal Street Do you own?", "full_content": "Pharma stock rally: Shares of IOL Chemicals and Pharmaceuticals Limited rallied nearly 14% during Monday\u2019s intraday trading session after a surge in trading volume. The sharp spike in the pharmaceutical stock has come days after a 117% rally over the last six months.\n\nWhile the stock has delivered strong returns over the past few months, its recently-announced quarterly results have sparked fresh interest among investors. IOL Chemicals and Pharmaceuticals\u2019 net profit more than doubled during the second quarter of financial year 2026-27.\n\nIOL Chemicals and Pharmaceuticals share price witnessed a sharp surge in trading volume by more than 8.81 times during Monday\u2019s trading session. At 9:51 am, over 96,059 shares had changed hands during the trading session.\n\nThe company\u2019s net profit surged to \u20b9 65.03 crore in Q2FY27 against \u20b9 30 crore reported in the year ago period. Its net revenue surged to \u20b9 795.03 crore during the quarter under review against \u20b9 567.53 crore reported in Q2FY27. Its net revenue from operations stood at \u20b9 756.26 crore in Q1FY27.\n\n\u201cOur diversified business model has enabled us to sustain growth momentum amid continued geopolitical uncertainties and evolving global market conditions. Better product mix and operating efficiencies also contributed to a 321-basis-point year-on-year expansion in EBITDA margin,\u201d stated Vikas Gupta, Joint Managing Director.\n\nThe stock was trading 12.78% higher at \u20b9 206.80 per share on BSE with a market capitalisation of \u20b9 6070.15 crore at 11:20 am. The stock touched an intraday high of \u20b9 214.55 per share and an intraday low of \u20b9 183.30 per share. Its share price value has surged 13.77% in one week, 22.24% in two weeks, 111.69% in six months and around 126% in one year.\n\nCatch all the Business News , Market News , Breaking News Events, JIO IPO Listing Today LIVE and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.\n\nLog in to our website to save your bookmarks. It'll just take a moment.", "source": "LiveMint Markets", "pub_date_str": "09 Nov 2026, 11:34 AM IST", "pub_date_relative": "2h ago"}, {"title": "Charting the rise and fall of currencies through the ages", "full_content": "Currencies are like human beings. Currencies have a life also.", "source": "FT Markets", "pub_date_str": "09 Nov 2026, 11:30 AM IST", "pub_date_relative": "2h ago"}, {"title": "Dixon's Working Capital Is Swallowing Cash As Receivables And Inventory Surge", "full_content": "Dixon's operating cash flow turned negative as inventory and receivables absorbed nearly Rs 9,100 crore in H1FY27, even as revenue rose 35% and expansion plans gathered pace.", "source": "NDTV Profit", "pub_date_str": "09 Nov 2026, 11:26 AM IST", "pub_date_relative": "2h ago"}, {"title": "Lifestyle Inflation: Why Your Savings Aren't Growing Even As Your Salary Increases", "full_content": "Peer influence can further encourage lifestyle inflation. When friends and colleagues move into bigger homes, buy expensive cars or take international holidays, others may feel the need to follow suit.", "source": "NDTV Profit", "pub_date_str": "09 Nov 2026, 11:23 AM IST", "pub_date_relative": "2h ago"}, {"title": "The Liver Doc vs Deepinder Goyal: Temple Row Escalates As Doctor Calls For Government Regulatory Scrutiny", "full_content": "The Liver Doc said he and other clinical scientists had gone through the science published on Temple's website and found nothing proving the device measures what it claims.", "source": "NDTV Profit", "pub_date_str": "09 Nov 2026, 11:23 AM IST", "pub_date_relative": "2h ago"}, {"title": "Bosch shares falls 3% after stock split, bonus issue, Q2 results announcement | What should investors do?", "full_content": "Vaamanaa Sethi Published 9 Nov 2026, 11:22 AM IST Prefer Livemint on Google Bosch share price tumbled over 3% in Monday's trading session after the company announced 1:5 stock split and a 3:1 bonus issue and strong set of numbers during the July-September quarter for FY27.\n\nThe stock also plunged amid weak sentiments on Dalal Street. Indian equity benchmark indices, Sensex and Nifty, opened lower on Monday, weighed down by selling pressure in heavyweight IT stocks and profit-booking following the recent sharp rally in the domestic market. The 30-share BSE Sensex fell 93.95 points to 80,919.19 in early trading, while the 50-share NSE Nifty slipped 30 points to 24,968.80.\n\nBosch shares opened at \u20b9 50,985 per share on NSE today, as compared to previous close of \u20b9 50,800 on Sunday (Muhurat Trading) and touched an intraday low of \u20b9 49,105 on 9 November.\n\nBosch board of directors last week approved a stock split in the ratio of 1:5. Under this arrangement, each existing equity share with a face value of \u20b9 10 will be subdivided into five shares with a face value of \u20b9 2 each. The proposed stock split will be implemented after receiving shareholders' approval through a postal ballot.\n\nThe stock split will be followed by a bonus issue, meaning that an investor holding one Bosch share before the corporate actions will first see their holding increase to five shares after the split. Subsequently, under the bonus issue, the investor will receive 15 additional shares, taking the total holding to 20 equity shares of \u20b9 2 face value each.\n\nIn addition to the stock split, Bosch's board has approved a bonus issue in the ratio of 3:1. This means eligible shareholders will receive three additional fully paid-up equity shares of \u20b9 2 face value each for every one existing equity share of \u20b9 2 face value held on the record date.\n\nBosch posted an 18.6% year-on-year growth in net profit at \u20b9 839.4 crore in Q2 FY27, compared with \u20b9 708 crore in the corresponding quarter last year.", "source": "LiveMint Markets", "pub_date_str": "09 Nov 2026, 11:22 AM IST", "pub_date_relative": "2h ago"}], "cfa": [{"title": "Nifty\u2019s 25,000 hurdle: Bulls see breakout, bears dig in for weekly expiry today", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nBulls and bears slugged it out at the 25000 mark on Monday, a level the Nifty hasn't convincingly tested since the US-Iran war began in late February, when the Nifty traded at 25178.65. Analysts, though, remain bullish on a decisive break above 25000.\n\nThe tug-of-war followed a 13% recovery in the Nifty from its 52-week low of 22179.9 on 8 October to 25030.35 on Friday. Nearly 70% of the gains came in the first week of November.\n\nThough markets were open for Muhurat trading on Sunday, cash volumes were tepid at \u20b9 23,275 crore against average daily volume of over \u20b9 1.2 trillion this month. The special session is, therefore, excluded from the analysis.\n\nBy noon on Monday, which coincides with the Nifty weekly expiry, the index traded one tenth of a percent down at 24965 .\n\nMarkets will remain closed on Tuesday for Diwali-Balipratipada.\n\nOn Monday, traders added 297,941 Nifty incremental contracts at the 25000 strike call expiring today, taking the total open position to 447,151 contracts. This compared with 56,492 incremental shares at the 25000 strike put, which had open positions of 162,707 contracts, per NSE data.\n\nHigher sales of calls relative to puts indicates confidence of bears that markets won\u2019t cross that level plus the premium paid and they would be able to pocket the premium or price of call options paid by buyers . Option sellers tend to be stronger hands than option buyers .", "source": "LiveMint Markets", "pub_date_str": "09 Nov 2026, 01:38 PM IST", "pub_date_relative": "2m ago", "cfa_topics": ["Equity Investments", "Derivatives"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Ulker Biskuvi shares drop 4% on unexpected third quarter loss", "full_content": "", "source": "Investing.com News", "pub_date_str": "09 Nov 2026, 01:20 PM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Enka Insaat shares drop 4% on disappointing Q3 earnings", "full_content": "", "source": "Investing.com News", "pub_date_str": "09 Nov 2026, 01:20 PM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Rothschild Redburn upgrades Airbnb stock rating on growth momentum", "full_content": "", "source": "Investing.com News", "pub_date_str": "09 Nov 2026, 01:14 PM IST", "pub_date_relative": "26m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "UCO Bank paid widow\u2019s pending pension arrears, but why did court still impose a \u20b915,000 fine?", "full_content": "A UCO Bank branch in Chandigarh was reportedly penalised for not revising the family pension of a widow despite receiving instruction from disbursing authorities.\n\nAccording to the Tribune, the District Consumer Disputes Redressal Commission in Chandigarh directed the Branch Manager of the UCO Bank branch in Rupnagar, Punjab, to pay \u20b9 15,000 in compensation to the complainant for deficiency in service, mental agony, and litigation expenses.\n\nThe commission also dismissed the bank's defense, noting that the hardship and harassment suffered by the family cannot be overlooked simply because the bank cleared the pending arrears while the case was being heard.\n\nRupnagar resident Sukhwinder Singh had filed a complaint on behalf of his mother, Prakash Kaur. Sukhwinder's father, Nasib Singh, had retired from the Chandigarh Transport Undertaking (CTU) on March 31, 1995 and his pension was sanctioned as per rules, The Tribune reported.\n\nAfter his death on November 28, 2001, the family pension was transferred to his mother from November 29, 2001, but subsequent revisions in the pension were not correctly implemented.\n\nThe complainant alleged that despite multiple official communications from the pension-sanctioning authorities, repeated visits to the branch, and formal representations, the bank failed to release the correctly revised family pension, admissible old-age allowance, Leave Travel Concession (LTC) benefits and revised medical allowances, the report added.\n\nDuring the proceedings, UCO Bank's counsel submitted that it had no role in the matter, claiming its responsibility was strictly limited to maintaining the complainant\u2019s pension account and facilitating withdrawals.\n\nThe counsel denied any deliberate delay or deficiency, stating that the lag was bona fide and arose during recalculation and verification of the claim.", "source": "LiveMint Money", "pub_date_str": "09 Nov 2026, 01:11 PM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Why Sun Pharma Advanced Research shares surge 11% despite weak sentiments on D-Street; what's boosting medical stock?", "full_content": "Vaamanaa Sethi Published 9 Nov 2026, 01:10 PM IST Prefer Livemint on Google Sun Pharma Advanced Research (SPARC) shares jumped over 11.30% in Monday's trading session, defying weak sentiment in the Indian stock market. The pharma stock opened in green at \u20b9 198.50 apiece on the NSE today, as compared to the previous close of \u20b9 197.03 on Sunday's Muhurat Trading and touched an intraday high of \u20b9 219.49 on 9 November.\n\nMeanwhile, Indian equity benchmark indices, Sensex and Nifty, opened lower on Monday, weighed down by selling pressure in heavyweight IT stocks and profit-booking following the recent sharp rally in the stock market. The 30-share BSE Sensex fell 93.95 points to 80,919.19 in early trading, while the NSE Nifty 50 declined 30 points to 24,968.80.\n\nThe stock rally came in after Sun Pharma Advanced Research shares witnessed a spurt in trading volume. According to data available on NSE, around 251.75 lakh shares have changed hands so far on Monday.\n\nSPARC reported a consolidated net loss of \u20b9 24.39 crore for the second quarter of FY27, narrowing from a net loss of \u20b9 75.85 crore in the corresponding quarter of the previous financial year. The pharmaceutical company's financial performance showed an improvement in profitability, although it continued to remain in the red.\n\nThe company's consolidated revenue from operations surged 282.1% year-on-year to \u20b9 30.03 crore in Q2 FY27, compared with \u20b9 7.86 crore in Q2 FY26. The sharp increase in revenue indicates improved business performance during the quarter.\n\nSPARC's basic and diluted loss per share improved to \u20b9 0.75 in Q2 FY27 from \u20b9 2.34 in the year-ago quarter, reflecting a reduction in losses. However, the company's operating expenses stood at \u20b9 75.60 crore during the reporting quarter, remaining significantly higher than its revenue from operations.\n\nOn a standalone basis, the company reported total income of \u20b9 53.65 crore for Q2 FY27, while its net loss after tax stood at \u20b9 24.58 crore.", "source": "LiveMint Markets", "pub_date_str": "09 Nov 2026, 01:10 PM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stock futures climb as investors eye AI trade, brace for more data and earnings: Live updates", "full_content": "Stock futures were higher on Monday, with traders eyeing whether technology shares can continue to recover, while awaiting the release of key inflation data and earnings from major AI companies this week.\n\nS&P 500 futures gained 0.42%, while the Nasdaq 100 futures added 0.18%. Futures tied to the Dow Jones Industrial Average added 375 points, or 0.73%. Over in Asia, markets were mostly up on Monday, with Taiwanese equities leading the rise. The Taiwan Weighted Index closed 4.94% up at 41,664.7, marking the largest one-day gain since 31 July.\n\nThe index was powered by gains in tech heavyweights Taiwan Semiconductor Manufacturing Company and Hon Hai Precision Industry \u2014 also known as Foxconn.\n\nSouth Korea's Kospi fell 0.81% after a choppy session to end at 5,018.85, while Japan's Nikkei 225 closed 2.33% higher at 58,775.5.\n\nMainland China's CSI 300 rose marginally to 4,056.11, while Hong Kong's Hang Seng Index was flat in its last hour of trade.\n\nInvestors in Asia are also assessing October inflation data out from China, with the producer price index hitting its highest in over four years at 5.7%, and consumer inflation coming in slower than expected at 0.7%.\n\nFriday's market partially rebounded from Thursday's brutal AI-driven selloff, as chip stocks recovered on renewed buying. The tech-heavy Nasdaq Composite bounced 1.09% to 24,579.42 and the broad-market S&P 500 rose 0.31% to 7,376.86. The blue-chip Dow , however, lost 237.33 points, or 0.46%, to settle at 51,285.73.\n\nBroader investor sentiment remained cautious following a batch of stronger-than-expected jobs data. Additionally, concerns linger after the Democrats' strong midterm results, amid fears that tighter regulations on data center construction, energy use, and development costs could slow the AI infrastructure boom.", "source": "CNBC Top News", "pub_date_str": "09 Nov 2026, 01:03 PM IST", "pub_date_relative": "37m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Derivatives", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Indian bonds drift with oil; inflation data in focus", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Bonds \u203a Indian bonds drift with oil; inflation data in focus Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Indian bonds drift with oil; inflation data in focus SECTIONS Indian bonds drift with oil; inflation data in focus Reuters Last Updated: Nov 09, 2026, 01:03:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Indian government bonds exhibited limited movement today as oil prices showed signs of stabilization. Investors are remaining cautious, especially with inflation data from both the United States and India on the horizon. Scheduled for later today is a bond auction totaling 290.5 billion rupees. Analysts predict yields on the 10-year bond could oscillate between 7.30% and 7.10%, with particular attention on India's October inflation report due for release this Thursday.\n\nIndian government bonds exhibited limited movement today as oil prices showed signs of stabilization. Investors are remaining cautious, especially with inflation data from both the United States and India on the horizon. Scheduled for later today is a bond auction totaling 290.5 billion rupees. Analysts predict yields on the 10-year bond could oscillate between 7.30% and 7.10%, with particular attention on India's October inflation report due for release this Thursday.\n\nBond yields muddy the books as banks prepare for new accounting rules\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "09 Nov 2026, 01:03 PM IST", "pub_date_relative": "37m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Stock Market Today: Sensex Falls, Nifty 50 Below 24,900; HCL Tech, Tata Steel, Infosys Top Drags", "full_content": "Among sectors,losses were seen in Nifty IT, Nifty Metal, Nifty FMCG and Nifty Oil & Gas, whileNifty Pharma, Nifty PSU Bank, Nifty Media and Nifty Private Bank were in the green.", "source": "NDTV Profit", "pub_date_str": "09 Nov 2026, 01:02 PM IST", "pub_date_relative": "38m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Explained: Why Nvidia shares dropped 4% in overnight trade and what analysts warn can trigger a bloodbath?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Explained: Why Nvidia shares dropped 4% in overnight trade and what analysts warn can trigger a bloodbath? The Economic Times daily newspaper is available online now. Read Today's Paper Explained: Why Nvidia shares dropped 4% in overnight trade and what analysts warn can trigger a bloodbath? SECTIONS Explained: Why Nvidia shares dropped 4% in overnight trade and what analysts warn can trigger a bloodbath? By Debaroti Adhikary , Last Updated: Nov 09, 2026, 01:00:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Nvidia shares dropped over 4% after CEO Jensen Huang acknowledged an affair with Alice Huang. Jensen Huang's relationship with Alice, a Chinese national, raised security concerns following intelligence reports. Nvidia has initiated an investigation into these allegations, although the board believes no secrets were compromised. Analysts suggest the company's upcoming earnings report will be crucial for market sentiment. Concerns linger over Huang's position if further evidence of wrongdoing emerges.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "09 Nov 2026, 01:00 PM IST", "pub_date_relative": "40m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "8th Pay Commission: Expert explains report deadline, when revised salaries and pensions may take effect", "full_content": "Central government employees and pensioners are awaiting the final 8th Pay Commission report, expected in the coming months, which will help determine revised salaries, pensions and allowances. But when the new pay structure takes effect depends on when the commission submits its report and how quickly the government accepts and implements its recommendations.\n\nThe 8th Pay Commission is a temporary three-member body headed by Justice Ranjana Prakash Desai. It was constituted on November 3, 2025, and has 18 months to submit its recommendations, which puts the expected deadline around May 2027. Submitting the report does not mean revised salaries will be credited immediately.\n\nExplaining the likely timeline, Adhil Shetty, CEO of BankBazaar, said:\n\n\u201cThe 8th Pay Commission has been given 18 months from its constitution in November 2025 to submit its report, placing the broad timeline around May 2027. The panel also has the option of submitting interim reports on specific matters along the way, so parts of its work could become visible before the final deadline. Commissions of this scale have historically had the provision to seek more time if needed, since the exercise involves detailed consultation across a wide range of service and pay-related matters.\u201d\n\nIn other words, employees and pensioners could see updates on specific recommendations before the final report if the panel submits interim reports . But an interim report does not mean any salary or pension revision will be implemented immediately. The final decision rests with the central government.\n\nReport submission is only one stage. The government will have to examine the recommendations , decide which to accept, reject or amend based on fiscal considerations, and make the necessary financial provisions before implementing the revised pay structure. The government has also told Parliament that implementation will be decided after the final report is tabled.", "source": "LiveMint Money", "pub_date_str": "09 Nov 2026, 12:46 PM IST", "pub_date_relative": "54m ago", "cfa_topics": ["Financial Statement Analysis", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "47% rally in one month! Infra stock under \u20b9100 inches close to 52-week high after announcement of Q2 Results 2026 date", "full_content": "Sharmila Bhadoria Published 9 Nov 2026, 12:40 PM IST Prefer Livemint on Google Shares of Highway Infrastructure rallied nearly 1.18% during Monday\u2019s intraday trading session despite weaker sentiment prevailing across the Indian stock market today. The uptick in the infra stock has come ahead of the board meeting scheduled for this week.\n\nHighway Infrastructure share price has surged 47% in one month and around 57.73% in three months. Here are all the details about the infrastructure stock.\n\nThe company\u2019s board of directors meeting is scheduled for Saturday, November 14. The board meeting will consider and approve \u201cUnaudited Financial Results (Standalone and Consolidated) of the Company for the quarter and half year ended 30th September 2026, alongwith the Limited Review Report.\u201d Additionally, the board will also consider any other matter with the permission of the chairman.\n\nAccording to Mahesh M Ojha, VP- Research and Business Development at KC Securities, the stock is facing a hurdle at \u20b9 78. \u201cOn breaking above this resistance, we can expect a fresh bull trend in the stock. So, fresh buying is allowed only above \u20b9 78, as the stock has already rallied a lot. Existing shareholders can hold the stock, maintaining a strict stop-loss at \u20b9 68,\u201d stated the expert.\n\nThe stock was trading in green earlier in the day, but gave up most of its gains in the second-half of Monday\u2019s trading session. Shares of Highway Infrastructure were trading 1.58% lower at \u20b9 71.01 per share on BSE with a market capitalisation of \u20b9 509.29 crore at 12:34 pm on Monday, November 9.\n\nIts share price value touched an intraday high of \u20b9 74.95 per share and an intraday low of \u20b9 71.01 per share. The infra stock has delivered 47% return in one month, 62% in three months and around 37.5% in six months, as per BSE data at 12:35 pm on Monday.\n\nCatch all the Business News , Market News , Breaking News Events, JIO IPO Listing Today LIVE and Latest News Updates on Live Mint.", "source": "LiveMint Markets", "pub_date_str": "09 Nov 2026, 12:40 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Asian stocks rebound after AI rout", "full_content": "Declines last week had pushed many indices into bear market territory", "source": "FT Markets", "pub_date_str": "09 Nov 2026, 12:39 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "HFCL shares locked in 5% lower circuit, down 21% in a month despite record Q2 profit: What lies ahead?", "full_content": "HFCL share price remained locked in the 5% lower circuit on Monday, 9 November, extending its recent decline despite the telecom equipment maker reporting its strongest-ever quarterly performance in Q2 FY27.\n\nThe stock has fallen 6.23% over the past week and 15.73% in the last two weeks. It has declined 21.14% over the past month and 1.01% in the past three months. However, the stock continues to trade significantly higher, with gains of 45.98% over six months and 199.10% on a year-to-date (YTD) basis.\n\nThe weakness comes despite a sharp improvement in the company's financial performance, with HFCL reporting a multi-fold increase in consolidated net profit for the September quarter, supported by strong demand for optical fibre cables from artificial intelligence (AI) data centres. The company has also outlined an ambitious growth outlook, backed by a sizeable order book and planned investments to expand manufacturing capacity.\n\nHFCL reported a multi-fold jump in consolidated net profit to \u20b9 394.22 crore in Q2 FY27, compared with approximately \u20b9 72 crore in the corresponding quarter last year, according to its regulatory filing.\n\nConsolidated revenue from operations more than doubled to \u20b9 2,541.79 crore during the quarter, from \u20b9 1,043.34 crore in the year-ago period. The company's profit after tax (PAT) margin also expanded sharply to 14.36% from 2.23% a year earlier.\n\nThe strong performance was driven by rising demand for optical fibre cables, particularly from AI data centres, alongside growing opportunities across telecom networks and data centre infrastructure.\n\nCalling it the best-ever quarterly performance in HFCL's history, Managing Director Mahendra Nahata said the results reflected the growing scale, strength and momentum of the business.", "source": "LiveMint Markets", "pub_date_str": "09 Nov 2026, 12:32 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Bank Holiday, closed tomorrow 10 Nov 2026: Ahmedabad, Bengaluru, Belapur, Dehradun, Gangtok, Mumbai, Nagpur; here\u2019s why", "full_content": "Bank Holiday, closed tomorrow 10 Nov 2026: Banks including the State Bank of India and HDFC Bank will be closed in Ahmedabad, Bengaluru, Belapur, Dehradun, Gangtok, Mumbai and Nagpur on Tuesday, 10 November.\n\nAccording to Reserve Bank of India's rules, all scheduled and non-scheduled banks observe listed holidays and mandatory closure on second and fourth Saturdays and every Sunday in a month. In-branch services are shut, but digital services (online net banking, app) will remain operational.\n\nUsually, in addition to the common national and gazetted holidays, or weekend offs, banks in India could have local holidays and festivals off, as required. The central bank releases its annual, official bank holiday list in January. Please contact your nearest local bank branch for their confirmed holiday schedule for 2026.\n\nBanks will be closed for a total of 16 days this month, including state and regional holidays and weekend offs, as per the official RBI calendar for November. This includes weekend offs on November 1, 8, 15, 22, 28, and 29 for Sunday; and November 14 and 28 for second and fourth Saturday holidays, respectively. Besides these are regional holidays on November 9, 10, 11, 13, 16, 20, 23, 24 and 27.\n\nBanks, including the SBI , HDFC Bank, ICICI Bank, Axis Bank, Punjab National Bank, Canara Bank, Bank of Baroda and other lenders across India will remain closed tomorrow in the following cities:\n\nOn Tuesday, 10 November 2026, public and private sector lenders will be closed for customers in Ahmedabad, Belapur, Bengaluru , Dehradun, Gangtok, Mumbai and Nagpur on account of Diwali / Bali Pratipada, Deepawali / Govardhan Puja, Laxmi Puja and Vikram Samvat New Year.\n\n\u2014 Diwali / Balipratipada: This is the fourth day of Diwali and is celebrated in honour of the notional return of the daitya-king Bali (Mahabali) to earth.\n\n\u2014 Deepawali / Govardhan Puja : This is the Hindu festival celebrated on the first lunar day in the month of Kartika, on the fourth day of Diwali.", "source": "LiveMint Money", "pub_date_str": "09 Nov 2026, 12:31 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Asian Markets at Risk of Pressure on Nvidia Probe: Markets Wrap - Bloomberg.com", "full_content": "Asian Markets at Risk of Pressure on Nvidia Probe: Markets Wrap Bloomberg.com Asian stocks bounce as AI, Mideast jitters recede; dollar firm on Fed bets Reuters Paraguay President Pe\u00f1a under investigation, faces removal from office over bank collapse AP News Asian stocks rebound after AI rout Financial Times Korea, Taiwan and Japan take first jolt from Democratic AI shock Asia Times", "source": "Google News Business", "pub_date_str": "09 Nov 2026, 12:26 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Gold Glitters: Yellow Metal Prices Jump Above Rs 1,44,000; Silver Prices Up By Rs 4,300", "full_content": "Gold and silver prices extended their recovery on MCX on Monday, Nov. 9. December gold futures rose to Rs 1,44,400 per 10 grams, while silver touched Rs 1,89,399 per kg, outperforming gold with a 2.3% gain.", "source": "NDTV Profit", "pub_date_str": "09 Nov 2026, 12:23 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Derivatives", "Alternative Investments"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Nvidia stock in focus: 3 key risks after Jensen Huang probe", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News Powered By Nvidia stock in focus: 3 key risks after Jensen Huang probe Written by Anupam Nagar , ETMarkets.com | Nov 09, 2026, 12:35:19 PM IST 1 / 8 Nvidia CEO Jensen Huang faces scrutiny Nvidia has launched an independent investigation into whether CEO Jensen Huang was targeted by a foreign intelligence operation. The probe follows reports of Huang's alleged relationship with Alice Huang, a businesswoman suspected by US authorities of having links to Chinese intelligence. Huang has admitted to being unfaithful to his wife and apologised to his family, employees and shareholders. The controversy has brought Nvidia's leadership and corporate governance under scrutiny. (Sources: Reuters, Yahoo Finance, CNBC)\n\nNvidia's board has initiated an independent investigation overseen by a committee of independent directors, with external legal counsel assisting the review. Huang has agreed to cooperate with the investigation and remains committed to leading the company. Nvidia has said it has no reason to believe that its confidential information or US national security has been compromised. The board has also expressed confidence in Huang and his leadership team.\n\nAlice Huang is a businesswoman and former executive associated with Singapore-based Megaspeed, an Nvidia customer that has faced scrutiny over suspected efforts to obtain advanced AI chips restricted from export to China. US authorities reportedly concluded that Alice Huang was a Chinese intelligence asset. The allegations have raised questions about potential access to sensitive technology and information, although no evidence has established that Nvidia's technology or confidential information was compromised.\n\nThe first major risk is leadership uncertainty.", "source": "Economic Times Markets", "pub_date_str": "09 Nov 2026, 12:13 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Corporate Issuers", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Nuvama Wealth Management Q2 Results: Profit rises 19% YoY to Rs 304 crore", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Nuvama Wealth Management Q2 Results: Profit rises 19% YoY to Rs 304 crore Nuvama Wealth Management Share Price 360 One Wam Share Price Anand Rathi Wealth Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Nuvama Wealth Management Q2 Results: Profit rises 19% YoY to Rs 304 crore SECTIONS Nuvama Wealth Management Q2 Results: Profit rises 19% YoY to Rs 304 crore PTI Last Updated: Nov 09, 2026, 12:09:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Nuvama Wealth Management Ltd achieved a consolidated net profit of Rs 303.5 crore for Q2 FY27. The company saw a revenue increase of 20.35% to Rs 1,366 crore for the same quarter. Client assets reached Rs 5.5 lakh crore, reflecting a 25% year-on-year growth. Wealth management, asset services, and capital markets drove this substantial growth. The company demonstrated strong operating profits with a return on equity remaining robust at 29%.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "09 Nov 2026, 12:09 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Citi Raises Nifty 50 Target To 28,000; Adds Bajaj Finance To Its Top Picks", "full_content": "Citi added Bajaj Finance to its top picks, citing 25%+ growth visibility with diversified product bouquet and healthy provisioning buffer, that supports earnings resilience and superior return ratios.", "source": "NDTV Profit", "pub_date_str": "09 Nov 2026, 12:08 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fin
