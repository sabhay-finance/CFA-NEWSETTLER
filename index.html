"cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Pfizer CEO Says Covid Is \u2018Irrelevant.\u2019 He\u2019s Betting on Cancer and Weight-Loss Drugs. - Barron's", "full_content": "Pfizer CEO Says Covid Is \u2018Irrelevant.\u2019 He\u2019s Betting on Cancer and Weight-Loss Drugs. Barron's Pfizer hikes full-year outlook as newer products grow, taps company veteran as new CFO CNBC Pfizer increases annual profit forecast amid solid demand for blood thinner drug Yahoo Finance Pfizer raises 2026 forecasts as Eliquis, cancer drugs drive third-quarter results Reuters Pfizer Raises Revenue Forecast, Extending Pharma Windfall Bloomberg.com", "source": "Google News Business", "pub_date_str": "04 Nov 2026, 12:25 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Ferrari raises 2026 guidance after Q3 earnings beat", "full_content": "Ferrari on Tuesday raised its 2026 guidance after the sports car maker slightly beat Wall Street's third-quarter expectations.\n\nHere's how Ferrari performed in the third quarter compared with average estimates compiled by LSEG:\n\nFerrari raised its guidance to revenue of 7.65 billion euros, up from 7.6 billion euros; adjusted earnings before interest, taxes, depreciation and amortization to 3 billion euros, up from 2.97 billion euros; and adjusted EPS to at least 9.85 euros, up from at least 9.68 euros.\n\nThe automaker also upgraded its expectations for industrial free cash flow to up to 1.65 billion euros, up from previous expectations for at least 1.55 billion euros.\n\nThis is the second consecutive quarter Ferrari has raised its 2026 guidance, despite vehicle shipments being lower by 318 units through the first nine months of the year, at 10,170 vehicles, compared with last year. The decline is led by fewer shipments to the Americas and China, Hong Kong and Taiwan.\n\nFerrari said Tuesday that the guidance improvements were a result of stronger-than-expected customer personalizations, lower than anticipated currency headwinds and a second place finish in the Formula 1 championship.\n\n\"Our order book now reaches into 2028, and we still have two more launches to come this year. In addition, we continue to create engaging events around the world to further tighten the bonds with our clients and partners across Racing, Sports Cars and Lifestyle,\" Ferrari CEO Benedetto Vigna said in a release.\n\nRBC Capital Markets analyst Tom Narayan said Tuesday that Ferrari's results were largely in line with Wall Street expectations. However, he said shares may be \"under slight pressure given some were hoping for a bigger guidance raise, but expect it to get better once folks realize these results are healthy.\"", "source": "CNBC Top News", "pub_date_str": "04 Nov 2026, 12:22 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stock Market Today: Dow Dips, Palantir Fights Back; These Insurance Stocks Clear Entry Points (Live Coverage) - Investor's Business Daily", "full_content": "Stock Market Today: Dow Dips, Palantir Fights Back; These Insurance Stocks Clear Entry Points (Live Coverage) Investor's Business Daily Nvidia and other Big Tech stocks lift Wall Street and make up for a drop by Apple AP News Update: US Equity Indexes Mixed as Apple's Fiscal Q4 Disappoints While Investors Await Midterm Election Results Yahoo Finance S&P 500 Edges Up as Oil Falls on US Election Day: Markets Wrap Bloomberg.com Stock market to be jolted by Apple earnings, midterms, and October jobs report this week Business Insider", "source": "Google News Business", "pub_date_str": "04 Nov 2026, 12:22 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Festive season: Pistachio prices nearly double, almonds up 20% on West Asia crisis and US crop shortfall", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Agriculture \u203a Festive season: Pistachio prices nearly double, almonds up 20% on West Asia crisis and US crop shortfall The Economic Times daily newspaper is available online now. Read Today's Paper Festive season: Pistachio prices nearly double, almonds up 20% on West Asia crisis and US crop shortfall SECTIONS Festive season: Pistachio prices nearly double, almonds up 20% on West Asia crisis and US crop shortfall By Jayashree Bhosale , ET Bureau Last Updated: Nov 04, 2026, 12:16:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis \"Pistachio have been the game spoiler this year. The prices of pistachio from all origins including Iran, Afghanistan and California have increased,\" said Ravindra Mehta, member of central governing council at Nuts and Dry Fruits Council of India (NDFC-I). \"The current pistachio crop in California is expected to be only about 40% of last year, which has led to an increase of 50% in pista prices in the wholesale markets and even more in retail,\" he added.\n\nSome elections matter more than you know: No crop changed in the fields, yet sugar, coffee and soya got cheaper in a day\n\nYou can buy a walkie-talkie online. But can you legally use it?\n\nKYB and KYC: Quick commerce, the Damani premium and what DMart must deliver \u2013 3rd and concluding part\n\nKYC and KYB: Inside Damani\u2019s DMart, the retail chain for the middle class. And stock for the long term? \u2013 Part 2 of 3\n\nWill it be a regulatory nightmare if an exchange lists on its own platform?\n\nKYC and KYB: Inside Damani\u2019s Avenue Supermarts that refuses to charge more \u2013 Part 1 of 3\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "04 Nov 2026, 12:16 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "What the midterm elections could mean for markets, debt - Fox Business", "full_content": "What the midterm elections could mean for markets, debt Fox Business Midterm elections could jolt stocks if Democrats sweep Congress CNBC How Wall Street analysts think the midterms could affect the stock market CBS News Wall Street braces as voters go to polls in high-stakes US midterm elections Financial Times What a Democratic sweep could mean for stocks \u2014 and why history says not much Yahoo Finance", "source": "Google News Business", "pub_date_str": "04 Nov 2026, 12:16 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Binance co-CEO Richard Teng says hackers used fake job interviews, AI tool to steal $6.3 billion in crypto", "full_content": "Binance said hackers used fake job interviews, malicious software and compromised internal AI tools to infiltrate its wallet infrastructure, leading to the record-breaking Oct. 29 cyberattack that resulted in more than $6 billion in assets being stolen from the world's largest crypto exchange.\n\nThe attackers \"spent months building their way in,\" Binance co-CEO Richard Teng told CNBC's \" Squawk on the Street \" Tuesday, rejecting suggestions that there was a single point of failure through one employee's laptop.\n\n\"In June, [the attackers] set up a fake version of a developer tool and lured one of our engineers to install that,\" he added. \"In September they posed as recruiters and ran a series of job interviews with another engineer, and that ended up in a coding exercise that contained hidden malware designed to evade security ... from there they moved violently through our internal AI tools and obtain[ed] access that breach[ed] the system that authorized our wallet transaction.\"\n\nHe also said Binance has replenished 98% of $6.34 billion in affected assets, and that it is still in the process of purchasing outstanding, more illiquid assets.\n\nTeng himself did not attribute the attack to North Korea but acknowledged that the FBI has linked it to North Korean hackers tied to the TraderTraitor group.\n\nPreparations for the attack began in June, when a Binance Wallet DevOps engineer downloaded a tampered Homebrew installation \"to install a popular AI coding tool after searching for it on a search engine,\" according to a security report published by Binance Tuesday.", "source": "CNBC World Economy", "pub_date_str": "04 Nov 2026, 12:10 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Sugar Slides to Five-Week Low as High Indian Output Jolts Market", "full_content": "Sugar slid after data showed Indian production is running well ahead of last season, deepening a slump that has futures down more than 13% from last month\u2019s peak.\n\nRaw sugar futures in New York fell as much as 3.7% to their lowest intraday price since Sept. 23. White sugar in London was also down.\n\nIndia produced 845,000 tons of the sweetener this season to the end of October, more than eight times the output from the same period last year, data from the National Federation of Cooperative Sugar Factories Ltd. showed.\n\nWhile mills have been crushing cane earlier than last year and the Indian government has taken steps to stabilize local supplies, the data rattled a market where prices had surged because of tight stockpiles in the top sugar-consuming country.\n\nIndia\u2019s strong start to the season is not a surprise, according to Delhi-based analyst Harsh Soni of Greenleaf Consultancy. \u201cBut when reality strikes, markets react,\u201d he said.\n\nSugar had surged for much of the year, buoyed by fears that a super El Ni\u00f1o will curb yields and push the global market into a deficit. But the market has given back some gains as traders increasingly expect less demand for imports in India and also potentially more incentive for Brazilian producers to export given a recent rout of the country\u2019s currency.\n\nThe Brazilian real weakened again on Tuesday, which can encourage more farmer selling.\n\nThe selloff has been exacerbated by speculative funds, which recently piled into sugar to build their most bullish position in years, paring back those bets. The latest CFTC positioning report shows money managers trimming their net-long position to a four-week low through Oct. 27.", "source": "LiveMint Markets", "pub_date_str": "04 Nov 2026, 12:10 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Rs 9,000 crore land assets monetised so far in FY27", "full_content": "The NLMC, which is working under the aegis of the Department of Public Enterprises under the finance ministry, also has land assets worth another Rs 4,000-5,000 crore belonging to public sector undertakings (PSUs) in the pipeline. These are at various stages of processing, providing an additional pipeline of potential transactions.\n\nSome elections matter more than you know: No crop changed in the fields, yet sugar, coffee and soya got cheaper in a day\n\nYou can buy a walkie-talkie online. But can you legally use it?\n\nKYB and KYC: Quick commerce, the Damani premium and what DMart must deliver \u2013 3rd and concluding part\n\nKYC and KYB: Inside Damani\u2019s DMart, the retail chain for the middle class. And stock for the long term? \u2013 Part 2 of 3\n\nWill it be a regulatory nightmare if an exchange lists on its own platform?\n\nKYC and KYB: Inside Damani\u2019s Avenue Supermarts that refuses to charge more \u2013 Part 1 of 3\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "04 Nov 2026, 12:07 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Polymarket unit gets US industry organization's approval to be futures broker", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Polymarket unit gets US industry organization's approval to be futures broker Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Polymarket unit gets US industry organization's approval to be futures broker SECTIONS Polymarket unit gets US industry organization's approval to be futures broker Reuters Last Updated: Nov 04, 2026, 12:05:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Polymarket has received approval from the National Futures Association for PM Derivatives LLC to act as a broker. This approval allows the company to expand its operations if it obtains further approval from the Commodity Futures Trading Commission. The firm is actively under investigation by the CFTC regarding its marketing practices. Currently, Polymarket serves as a popular platform for betting on various events and elections.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "04 Nov 2026, 12:05 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Derivatives", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Meta seeks to raise up to $25 billion in debt sale as AI spending jumps", "full_content": "Meta is seeking to raise between $20 billion and $25 billion in a bond sale on Tuesday as the company ramps up its spending on artificial intelligence infrastructure along with AI models and services.\n\nThe debt sale is expected to be two-thirds in U.S. dollars and one-third in euros, according to people familiar with the matter who asked not to be named because the details are private. Final pricing for the bond sale should come Tuesday afternoon, the sources said.\n\nMeta declined to comment. Bloomberg News first reported on Meta's plans.\n\nMeta's bond sale comes days after S&P Global Ratings revised the company's outlook from AA- stable to AA- negative, citing \"uncertainty\" about its hefty capex spending and negative free cash flow.\n\nIn its third-quarter earnings report last month, the Facebook parent revealed that its full-year capex will come in between $135 billion to $145 billion, representing a $5 billion increase to the low end of its previous guidance. Meta posted negative free cash flow of $2.12 billion for its latest quarter, joining Alphabet and Amazon in reporting a negative figure.\n\nMeta previously raised $25 billion in an April bond sale, and said last week that it plans to raise $95 billion in an effort to fund its AI initiatives. Of that, Meta intends to first raise $35 billion in underwritten public equity offerings, and an additional $60 billion through an at-the-market program.\n\nMeta's stock rose 2.7% on Tuesday after dropping in 12 of the prior 14 trading sessions and closing out October with its worst month in four years.\n\nWATCH : AI challenge is lack of compute in the marketplace: Plexo Capital's Toney .", "source": "CNBC World Economy", "pub_date_str": "04 Nov 2026, 12:03 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Fixed Income", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stocks To Watch Today: NSE, Bata India, MCX, IEX, M K Sons Fine Jewels, Dabur India & More", "full_content": "Here's a look at stocks that are likely to be in focus during the trading session on Wednesday.", "source": "NDTV Profit", "pub_date_str": "04 Nov 2026, 12:00 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Ethical & Professional Standards"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Down 38% in 2026, Aditya Birla Real Estate gets Buy rating from Anand Rathi; 30% upside see", "full_content": "A Ksheerasagar Published 3 Nov 2026, 11:56 PM IST Prefer Livemint on Google Domestic brokerage firm Anand Rathi, in its latest note, has initiated coverage on Aditya Birla Real Estate with a 'Buy' rating and a target price of \u20b9 1,345 per share, indicating an upside potential of 30% from the stock's latest closing price.\n\nDespite the stock remaining under severe selling pressure and losing 38% of its value in 2026 so far to trade at around \u20b9 1,036 apiece, the brokerage remains confident about its long-term growth prospects.\n\nIt believes the company is positioned for renewed growth acceleration, citing expectations of a recovery in pre-sales, supported by the enhanced gross development value (GDV) of Niyaara Tower C and a stronger launch pipeline.\n\nAnand Rathi said that the company is transitioning from a Worli-led growth story to a diversified, capital-efficient real estate platform, with an expanding multi-city portfolio and commercial annuity assets.\n\nIt highlighted that Worli residential portfolio accounts for approximately \u20b9 243 billion (50%) of the company's approximately \u20b9 483 billion upcoming launch pipeline, making it the key contributor to near-term launch visibility, with the planned Tower C launch expected to drive the next phase of Worli-led growth.\n\nAnand Rathi said that following a sharp scale-up in pre-sales on the back of strong business development (BD) during FY23-25, a moderation in BD additions and deferment of the Niyaara Tower C launch to FY28 are likely to weigh on FY27 pre-sales.\n\nHowever, the brokerage believes the deferment is value-accretive, with the redesign and amalgamation of adjoining land parcels adding approximately \u20b9 19 billion to the overall Worli gross development value (GDV).\n\nWith approximately \u20b9 60 billion of BD additions year-to-date (YTD), a further \u20b9 600 billion opportunity pipeline and a stronger launch pipeline from FY28, Anand Rathi expects pre-sales to regain momentum, supporting management's target of \u20b9 150 billion by F.", "source": "LiveMint Markets", "pub_date_str": "03 Nov 2026, 11:56 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "The 'poison pill' ballot measure that could kill the California billionaire tax", "full_content": "The Inside Wealth newsletter by Robert Frank is your weekly guide to high-net-worth investors and the industries that serve them.\n\nThe California billionaire tax could face a stiff challenge from a competing ballot measure that would ban state taxes on retirement accounts, according to tax experts.\n\nCalifornia voters will decide the fate today of Proposition 40, known as the Billionaire Tax Act, which would impose a one-time tax of 5% on the total net worth of Californians worth over $1 billion. The so-called \"billionaire tax\" is one of the most widely watched ballot measures this election season, since it would be the first state tax on net worth and taps popular anger over the rising power and wealth of tech billionaires.\n\nThe tax requires a simple majority to pass. Since it would only tax the state's roughly 250 billionaires, many political experts initially predicted easy passage. Yet a recent poll by the Public Policy Institute of California shows it falling short, with 46% supporting and 52% against.\n\nSupporters of the tax blame a $300 million ad blitz funded by tech billionaires and business groups opposing the measure. Many of the ads claim the ballot measure would allow the Legislature, with a two-thirds vote, to expand the tax to everyday Californians.\n\nYet tax experts cite another potential roadblock to the tax: Proposition 42.", "source": "CNBC Top News", "pub_date_str": "03 Nov 2026, 11:53 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Stock market after midterm elections: What S&P 500 history shows", "full_content": "Markets are sweating it out ahead of the midterm elections , but the event historically heralds strong performance for stocks \u2014 regardless of whether it's a red or blue wave , split decision, or status quo in Washington.\n\nThe S&P 500 tends to perform well after both midterm and presidential elections. According to a CNBC analysis of S&P 500 returns after elections from 1980 through 2024, the index rose an average of 0.2% after one day and one week, and 1.1% after one month across both presidential and midterm elections.\n\nA year later, the index gained an average of 13.7% after midterms and 13.8% after presidential elections. Returns were positive in 91% of cases. And the S&P 500 was up after all 11 midterms from 1982 through 2022.\n\nShort-term returns were less reliable, particularly after presidential contests, which produced slightly negative average returns after one day and one week.\n\n\"There's some anxiousness before these elections,\" Ryan Detrick, CNBC contributor and chief market strategist at Carson Group, told CNBC. \"Once you are through it, it's a big relief and markets tend to do pretty well.\"\n\nStill, the market usually prefers divided government : one party in charge of the White House and the other holding at least one house of Congress.\n\nAcross 10 midterm and five presidential elections that left no single party in charge, the S&P 500 rose an average 15% after one year. One-year returns were positive in 14 out of 15 cases. By comparison, the index gained an average of 11.5% over the year after elections that resulted in single-party control.\n\n\"If you have a huge red wave or a big blue wave, markets actually kind of don't like that as much because you have too much spending one way and too much power,\" Detrick said.", "source": "CNBC Finance", "pub_date_str": "03 Nov 2026, 11:51 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "US midterms put Trump-era crypto boom and prediction markets at risk", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a US midterms put Trump-era crypto boom and prediction markets at risk Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US midterms put Trump-era crypto boom and prediction markets at risk SECTIONS US midterms put Trump-era crypto boom and prediction markets at risk ETMarkets.com Last Updated: Nov 03, 2026, 11:55:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The US midterm elections could threaten the crypto friendly regulatory environment created under President Donald Trump. A potential Democratic takeover of Congress may bring tighter oversight of digital assets and prediction markets, putting companies such as Coinbase, Strategy and Bullish under pressure as investors reassess the sector's regulatory outlook.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "03 Nov 2026, 11:39 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Midterm elections could jolt stocks if Democrats sweep Congress", "full_content": "The stock market is not yet pricing in a Democratic sweep of Congress \u2014 despite some polls and most prediction markets pointing that way \u2014 so that scenario could weigh on share prices Wednesday, according to investors and analysts.\n\nRepublicans managing to keep control could cause a short-term relief rally, they said.\n\nShort-term moves aside, the typical post-midterm pattern in the months ahead is bullish. But some wonder if the market could buck the positive historical trend this time because the S&P 500 is already up so much this year going into the election.\n\nAs far as certain stocks to watch, a big Democratic win on Tuesday night \u2014 especially in the Texas governor race \u2014 could add fuel to an artificial intelligence stock sell-off on the notion that more data center restrictions would gain momentum nationally. Defense stocks could come under pressure on fears of limits on spending.\n\nPolls are pointing to a Democratic victory in the House and a toss-up in the Senate. Prediction markets have been more favorable to Democrats, calling for a blue sweep .\n\nWhile investors are signaling \"begrudging acceptance\" to a base-case scenario that there will indeed be a Democratic sweep, that's not how they're positioning, said Tobin Marcus, head of U.S. policy and politics at Wolfe Research. The firm's recent survey data among more than 100 institutional investors suggests they are not strongly positioned for any particular result.\n\n\"Investors seem to have a significant dose of skepticism about whether the final outcome is going to be quite as favorable to Democrats as the polling suggests,\" Marcus told CNBC, noting that the firm shares the view that the \"polling is likely overstating Democratic strength.\"\n\nJPMorgan sees a blue wave knocking the S&P 500 by about a half percent on Wednesday.", "source": "CNBC Top News", "pub_date_str": "03 Nov 2026, 11:35 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments", "Fixed Income"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Q2 Results Highlights: MCX Profit Up 10%; INOX India Revenue Up 27%; NSE Profit Slips 17%; SBI Asset Quality Improves", "full_content": "The companies in focus include SBI, NSE, Bajaj Finserv, MCX, Lupin, Solar Industries, Emcure Pharmaceuticals and Bata India.", "source": "NDTV Profit", "pub_date_str": "03 Nov 2026, 11:35 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "\u20b98.66 crore cash trail found on woman's computer during Income Tax raid: Why ITAT gave her a clean chit", "full_content": "The Income Tax Appellate Tribunal (ITAT), Hyderabad, has ruled in favour of a woman taxpayer after the Income Tax Department treated cash expenditure of more than \u20b9 8.66 crore found in documents recovered during a search at her residence as unexplained income.\n\nThe tribunal held that the expenditure related to a real estate company's business and could not be added to her taxable income without establishing her connection with the transactions.\n\nIn its order dated 9 October 2026 in ACIT, Central Circle-2(2), Hyderabad vs Chinthakunta Ramesh Sridevi (ITA Nos. 698 and 699/HYD/2022), the tribunal dismissed the tax department's appeals for assessment years 2017-18 and 2018-19.\n\nThe dispute arose after a search and seizure operation under Section 132 of the Income Tax Act was conducted on 12 October 2018 as part of an investigation into the Rithwik group of companies.\n\nDuring the search, officials recovered 97 pages of documents from a computer located in an office room at the taxpayer's residence. These documents contained details of cash payments towards land purchases, property registration, house construction and other expenses.\n\nThe assessing officer treated \u20b9 7.72 crore in expenditure during assessment year 2017-18 and another \u20b9 94.26 lakh during assessment year 2018-19 as unexplained cash expenditure. The amounts were added to the woman's taxable income under Section 115BBE of the Income Tax Act.\n\nThe taxpayer denied that the transactions belonged to her and argued that the seized documents related to Rithwik Projects Pvt Ltd, a company engaged in real estate development and project execution.\n\nShe submitted a confirmation from the company and ledger extracts to establish that the expenditure related to its business activities, including purchases of earth, sand, aggregates and other project-related expenses.", "source": "LiveMint Money", "pub_date_str": "03 Nov 2026, 11:32 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Ghosted after a job interview? There's a website for that\u2014and thousands of frustrated job seekers have weighed in", "full_content": "Gary Meyer didn't intend to become a ghostbuster. But his website, Did They Ghost You , has become an outlet for thousands of frustrated job seekers who have been ghosted by employers.\n\nBased on anonymous reports \u2014 2,888 at last count \u2014 the site tracks and ranks the companies that are most often accused of abruptly ceasing contact with candidates, including some of the biggest names in the S&P 500.\n\nGhosting is a widespread issue. A recent report from hiring platform Greenhouse found that 45% of job seekers who made it to the interview stage of a hiring process said they were ghosted by an employer afterward, based on a survey of 1,200 U.S. candidates conducted in September 2026.\n\nMeyer, 42, an artificial intelligence-focused marketing consultant who lives in Toronto, created Did They Ghost You in June after listening to his friends vent about interviewing with companies and then never hearing back.\n\nHe never intended for the website to be more than a \"fun little side project,\" but when he shared a link to his site on LinkedIn, the reports started pouring in. He says that within the first few days, the site received more than two million visitors: \"Clearly, it struck a bit of a nerve.\"\n\nMeyer, who reads and approves each report himself, says he fielded five or six new submissions every minute at the height of the site's popularity over the summer. To protect people's identities, Meyer typically doesn't publish the contents of the report, and his site doesn't track personal information. Each report contributes to an overall tally of ghosting incidents.\n\n\"Was told that I was the preferred candidate by the Director of HR in a debrief immediately following the final interview and then just didn't hear back,\" one report featured on the site said.\n\n\"Ghosted, then reposted their ad a week later,\" said another.", "source": "CNBC Top News", "pub_date_str": "03 Nov 2026, 11:30 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Nasdaq rebounds as chip stocks bounce, Dow dragged lower by Apple: Live updates - CNBC", "full_content": "Nasdaq rebounds as chip stocks bounce, Dow dragged lower by Apple: Live updates CNBC See more headlines & perspectives on Google News", "source": "Google News Business", "pub_date_str": "03 Nov 2026, 11:29 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "How to check gold purity at home: 5 simple tests to identify genuine gold jewellery; check BIS hallmark and HUID", "full_content": "Many consumers may not know how to distinguish genuine gold from jewellery containing a higher proportion of other metals. While professional laboratory testing remains the most reliable way to establish gold purity, certain simple checks at home can help identify possible irregularities", "source": "LiveMint Money", "pub_date_str": "03 Nov 2026, 11:26 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Govt Proposes Mandatory SAF Blending For Airlines From Jan 2027 In Draft Policy; Target 20% By 2040", "full_content": "Airlines and oil marketing companies (OMCs) could also face penalties for failing to comply with the proposed SAF blending requirements, according to the draft seen by NDTV Profit.", "source": "NDTV Profit", "pub_date_str": "03 Nov 2026, 11:24 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Diwali stock picks: Titan, Eternal, BSE to Adani Ports \u2014 10 long-term bets by Motilal Oswal with up to 41% upside", "full_content": "Motilal Oswal has shortlisted 10 stocks for Samvat 2083, forecasting potential returns of up to 41% over the next year. Its picks span sectors including banking, ports, pharmaceuticals, technology and consumer businesses.&nbsp;", "source": "LiveMint Markets", "pub_date_str": "03 Nov 2026, 11:17 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "US FAA Team to Audit India's Aviation Safety Oversight From Nov 16-20: Report", "full_content": "The review wi r exam valuation questions."}, {"title": "Anthropic is still grappling with the economics of compute - TechCrunch", "full_content": "Anthropic is still grappling with the economics of compute TechCrunch Everything you need to know ahead of Anthropic's IPO Yahoo Finance The IPO Market Is Open For Anthropic. Not For Everyone Else. WSJ World in Brief: Anthropic\u2019s big spending plans; Apple\u2019s earnings beat estimates The Economist Anthropic reports $17 billion in Q3 revenue, purchase commitments of $895.4 billion in revised S-1 CNBC", "source": "Google News Business", "pub_date_str": "03 Nov 2026, 10:37 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "How to identify fake silver coins at home: 4 simple tests to check purity before buying this Dhanteras", "full_content": "While hallmarking provides an important means of verifying the purity of precious metals, consumers should not rely solely on the appearance of a silver coin. There are several simple tests that can offer preliminary indications of whether a silver coin is genuine.", "source": "LiveMint Money", "pub_date_str": "03 Nov 2026, 10:33 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Binance hackers used fake interviews and social media profiles in $6.3bn heist", "full_content": "Crypto exchange\u2019s internal investigation reveals the role of human error in the biggest theft in history", "source": "FT Markets", "pub_date_str": "03 Nov 2026, 10:30 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Buy, Sell Or Hold: Eternal, Bharat Dynamics, MRF, ICICI Bank, Granules | Ask Profit", "full_content": "Market experts shared their insights on fundamentals and technical levels for key stocks.", "source": "NDTV Profit", "pub_date_str": "03 Nov 2026, 10:29 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "CleanMax beats Q2 EBITDA estimates, reports strong H1 growth", "full_content": "CleanMax has surpassed analyst estimates for the third consecutive quarter, driven by portfolio expansion and strong business performance. The company reported a 58% rise in H1 EBITDA and a six-fold increase in profit after tax (PAT), highlighting its robust growth momentum and improving financial performance.", "source": "Economic Times Markets", "pub_date_str": "03 Nov 2026, 10:29 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Bagmane REIT declares Rs 527cr distribution to unitholders for September quarter", "full_content": "Bagmane Prime Office REIT announced a distribution of Rs 527 crore to unitholders for the September quarter. The company leased 1.2 million square feet during this period, achieving a committed occupancy rate of 99 percent. Most of the leasing activity was directed towards Global Capability Centres in Bengaluru, which highlights their preference for quality assets. The average rent achieved was slightly above the prevailing market rates, reflecting strong demand.", "source": "Economic Times Markets", "pub_date_str": "03 Nov 2026, 10:28 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Shopify falls 7% after Q3 revenue and merchandise volume miss estimates", "full_content": "Shopify stock fell after the e-commerce platform's Q3 revenue and gross merchandise volume missed estimates, despite an adjusted earnings beat.", "source": "CNBC World Economy", "pub_date_str": "03 Nov 2026, 10:23 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}], "updated_at": "04 Nov 2026, 01:41 AM IST", "total_stories": 310};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
