    const allData = {"general": [{"title": "Thousands of Flights Are Canceled After Friday\u2019s Nationwide Ground Stop: Live Updates - The New York Times", "full_content": "Thousands of Flights Are Canceled After Friday\u2019s Nationwide Ground Stop: Live Updates The New York Times FAA ground stop latest updates: Duffy blames contractor L3Harris; thousands more flights canceled Saturday; no sign of cyberattack Yahoo \u2018No answer\u2019: Messaging failures worsened the air traffic freeze and sowed distrust in government CNN US air travel schedule should recover from ground stop by the end of Sunday, FAA says AP News FAA ground stop throws sports world into travel chaos ahead of weekend games ESPN", "source": "Google News Business", "pub_date_str": "15 Nov 2026, 12:07 AM IST", "pub_date_relative": "9m ago"}, {"title": "Nationwide ground stop followed contractor upgrade to L3Harris telecommunication system: DOT\u2019s Duffy", "full_content": "The longest halt in flight departures to U.S. airports since 9/11 came after updates to a telecommunications system made by L3Harris Technologies , Transportation Secretary Sean Duffy said Saturday, as travel disruptions lingered for thousands of passengers nationwide.\n\nThere was \"zero evidence\" that the problem was caused by something \"nefarious\" or anything related to artificial intelligence, Bryan Bedford, the head of the Federal Aviation Administration, said at a press conference.\n\nThe updates were part of ongoing work of switching from a copper wire system to fiberoptic cable, Duffy said. When a router was switched to fiberoptic cable from copper, it had \"flooded\" other routers in the air traffic control system with over 1,000 connection attempts roughly every five seconds, Duffy said, creating problems with airplane communications and radar feeds.\n\nBedford said no FAA facilities went dark but that officials decided to ground flights because of \"instability\" in information feeds to air traffic control centers that handle en route aircraft at high altitudes and eventually to others closer to airports.\n\n\"We were unwilling to take any risk that this propagation could actually result in a center losing connectivity with aircraft,\" said Bedford.\n\nDuffy told the press conference that the FAA is investigating.\n\n\"What we're working to determine was whether we had incompetence, meaning was it user error, installator error from L3 Harris, or did they install a faulty router,\" he said.\n\nFlight disruptions continued on Saturday. More than 3,700 U.S. flights were canceled Saturday and close to 2,000 were delayed as of 9:40 a.m. ET, according to flight-tracking site FlightAware. That's on top of about 9,000 U.S. flight cancellations and more than 7,000 delays on Friday, though some disruptions were due to bad weather.", "source": "CNBC Top News", "pub_date_str": "15 Nov 2026, 12:02 AM IST", "pub_date_relative": "14m ago"}, {"title": "All passengers and crew on New Orleans cruise ship survive crash with tanker on Mississippi River", "full_content": "A tanker in New Orleans that apparently lost steering slammed into a docked river cruise boat carrying 180 people Friday, the mayor said. All aboard survived after the crash prompted a massive rescue operation for passengers and crew who plunged into the Mississippi River as the ship took on water and began to topple over.\n\nVideo from the scene showed the much larger Atlantic Asphalt tanker hit the American Heritage cruise boat while it was docked as metal and glass crashed and crunched.\n\nTugboat operators, nearby workers, police and other rescuers rushed to help.\n\n\"We have zero people unaccounted for, which truly is a miracle on the Mississippi,\" New Orleans Mayor Helena Moreno said at a news conference as rescuers and others cheered.\n\nThe mayor said 32 people were taken to the hospital, but none of them had critical injuries.\n\nThe boat started listing within minutes and flipped while emergency workers were still ang' by two major investors", "full_content": "Two major Nvidia shareholders are calling on the board of directors to weigh all options for the company's future leadership, including \"the potential return of Jensen Huang.\"\n\nAltimeter Capital CEO Brad Gerstner posted a letter on X on Friday that urges Nvidia's board to \"pursue a slow, measured, and deliberate process regarding the future leadership of Nvidia.\" The letter is also signed by Atreides Management's Gavin Baker.\n\nNvidia was Altimeter Capital's largest disclosed equity holding in its most recent SEC filing , with a 9.4 million-share stake worth nearly $1.9 billion as of June 30. Atreides held 1.2 million shares worth nearly $250 million at the end of June.\n\nThe letter said Nvidia will be \"capably led\" by interim CEO Colette Kress , who served as Nvidia's CFO for 13 years before the board announced Thursday that she'd lead the company in Huang's absence.\n\n\"But the Founder and long time incredible leader of this extraordinary company has earned the right for a deliberate process that avoids any needless rush to replace him before all the facts are known,\" the letter concludes. The document did not call for Huang's immediate reinstatement.\n\nNvidia founder Jensen Huang resigned on Thursday amid multiple affair allegations, including one with suspected Chinese spy Alice Huang , who also worked with Nvidia customer Megaspeed . The Singapore-based company is being investigated by the Justice Department for possibly redirecting some of its supply of Nvidia's restricted artificial intelligence chips to China.\n\nSpaceX CEO Elon Musk said on X Friday that he signed a petition asking to reinstate Huang. A petition circulating online called \"Stand with Jensen\" claims to have more than 100,000 signatures, including more than 5,000 current Nvidia employees.\n\nMusk said on X Saturday that without Huang, some \"critical deals will be lost.\"", "source": "CNBC World Economy", "pub_date_str": "14 Nov 202 mportance of protecting pension income that supports retirees and their families.\n\nIn its 13 November 2026 judgment in Nazir Ahmad Kuchay v. Jammu and Kashmir Bank Limited , Justice Moksha Khajuria Kazmi set aside a trial court order and restrained the bank from recovering loan dues from the retired employee's pension account. The court took note of the fact that pension was his family's sole source of income and that he had stood as guarantor while still in government service .\n\nKuchay, a retired police personnel and senior citizen, had stood as guarantor for a loan taken by another individual from Jammu and Kashmir Bank. When the borrower defaulted on repayments, the bank began deducting the outstanding instalments from Kuchay's bank account.\n\nBy then, Kuchay had retired from government service and depended on his pension to support himself and his family. He approached the bank, informing it about his retirement and financial circumstances. According to his submissions, the bank assured him that further deductions would stop. However, the recovery continued.\n\nKuchay subsequently filed a civil suit seeking a refund of the amounts deducted and an injunction against further recovery.", "source": "LiveMint Money", "pub_date_str": "14 Nov 2026, 10:20 PM IST", "pub_date_relative": "1h ago"}, {"title": "Not Just Jensen Huang: Why Trump Aide Howard Lutnick Is The Next Name In Nvidia Storm", "full_content": "Cantor Fitzgerald nearly halved its reported Nvidia shares over six months while continuing to do deals across the chipmaker's AI network.", "source": "NDTV Profit", "pub_date_str": "14 Nov 2026, 10:19 PM IST", "pub_date_relative": "1h ago"}, {"title": "Portugal vs Denmark Live Streaming: Likely Lineups; Where To Watch UEFA Nations League Match On TV, Online?", "full_content": "Here's everything you need to know about the Portugal vs Denmark UEFA Nations League match, including its live-streaming and telecast details in India.", "source": "NDTV Profit", "pub_d g top names in the Indian stock market when it comes to high dividend yield. It tells how much income investors can earn relative to investment in a stock.\n\nFor investors with keen interest in dividend yield stocks, here\u2019s a list of 10 lesser known stocks with up to 19.6% yield in the financial year 2025-26.\n\nCyberTech Systems, Majestic Auto , Jagran Prakash, IL&FS Investment Managers, Premco Global , Premco Global, and Indo Borax & Chemicals have more than 10% dividend yield for FY26.\n\nCyberTech Systems has announced a total of \u20b9 24 per equity share of dividend in the financial year 2025-26. With this, its dividend yield stood at 19.6% in one year. The stock closed 3.25% lower at \u20b9 126.50 per share on BSE on Friday, November 13.\n\nMajestic Auto has paid a total of \u20b9 68.1 per share dividend in FY26, and its annual dividend yield stood at 16.4% for FY26. The stock closed 1.23% lower at \u20b9 365.30 per share on BSE with a market capitalisation of \u20b9 379.82 crore on Friday.\n\nJagran Prakashan has announced a total of \u20b9 10 per equity share dividend in the previous financial year 2025-26. Its dividend yield stood at 16.1% for the financial year. The stock closed 0.31% lower at \u20b9 66.57 per share on BSE on Friday.\n\nThe company has announced \u20b9 1.2 per share payout over the last one year and its dividend yield stood at 15.9%. The stock closed 0.50% higher at \u20b9 8 per share on NSE on Friday.\n\nThe company has paid \u20b9 44 per equity share dividend in the previous financial year. With this, its annual dividend yield stood at 11.2% in FY26. The company stock closed 4.68% lower at \u20b9 395 apiece on BSE on Friday.", "source": "LiveMint Markets", "pub_date_str": "14 Nov 2026, 09:31 PM IST", "pub_date_relative": "2h ago"}, {"title": "Is All Money In Your Bank Account Your Income? A Rs 3.69-Crore Tax Case Has An Answer", "full_content": "A Firozabad woman who routed payments for bangle traders through her accounts has won relief from the Income Tax Appellate Tribunal, which said the tax department had not shown the money was her", "source": "NDTV Profit", "pub_date_str": "14 Nov 2026, 09:25 PM IST", "pub_date_relative": "2h ago"}, {"title": "How Nvidia turmoil and a Democratic Congress could reshape the AI trade, according to ETF experts", "full_content": "The largest technology stocks linked to the artificial intelligence trade could stand to benefit the most from Nvidia's woes and a Democratic-controlled Congress pushing back on data centers, according to investing experts interviewed on CNBC's \" ETF Edge \" earlier this week.\n\n\"We may have been put in an environment, as much as investors have sort of been looking for areas outside of Big Tech, where net-net Big Tech ends up as the winner once again,\" said Roundhill Investments CEO Dave Mazza, whose firm manages the Magnificent Seven ETF ( MAGS ).\n\nPart of his bull case: Other players in the AI trade are positioned to fill Nvidia's chip demand if investors lose trust in the company after a tumultuous week that saw its iconic founder and CEO Jensen Huang resign.\n\n\"If we get into an environment where people can't trust \u2026 Nvidia, they're going to look for other sources for these chips because they need them,\" Mazza said during the \"ETF Edge\" interview, which occurred Monday as the Nvidia scandal grew but before Huang had resigned.\n\nDiscussing recent fund flow activity for the MAGS ETF, as well as for the Roundhill Neocloud ETF ( NCLD ) \u2014 which focuses on smaller market cap, specialized cloud computing companies \u2014 Mazza said, \"In a weird way, [hyperscalers] may continue to benefit from this because they have the compute available. It's going to be more valuable if the demand is there.\"\n\nThe Roundhill Magnificent Seven ETF ended the week in the green, albeit with a gain of less than 1%, while the Roundhill Neocloud ETF was up over 1%, though earnings from top holdings Coreweave and Nebius presented a mixed picture.\n\nCoreWeave had its best day since April 2025 on Wednesday after its latest quarterly results, while Nebius shares sank after its Thursday report. The neocloud ETF remains deeply in the red since its August 2026 launch, down 39%, amid concerns about balance sheet strength, which could linger given Nvidia's role in financing the AI buildout.", "source": "CNBC Finance", "pub_date_str": "14 Nov 2026, 09:20 PM IST", "pub_date_relative": "2h ago"}, {"title": "Investing in IT stocks through mutual funds? Should you continue your SIP amid AI disruption and earnings concerns?", "full_content": "Technology funds have emerged as the worst-performing equity mutual fund category in 2026 so far, delivering an average return of-10.47%. The underperformance comes even as the global artificial intelligence (AI) boom drives investment in technology infrastructure and raises expectations of a new growth cycle for the sector.\n\nFor investors holding technology mutual funds, the disconnect raises a question. should they continue their systematic investment plans ( SIPs ), or reconsider their exposure?\n\nThe weakness reflects concerns about the near-term earnings outlook for Indian IT services companies. While AI could create significant opportunities over time, its impact on traditional outsourcing and technology services businesses remains uncertain. Companies are also facing intensifying competition, pressure on conventional service lines and cautious enterprise spending.\n\nAn investment outlook released by Axis Mutual Fund in November 2026 highlights these risks. The fund house has an underweight position in the information technology sector, citing the limited near-term benefit of AI investments to discretionary IT services spending.\n\nThe report notes that much of the current AI investment is concentrated in infrastructure development. This does not necessarily translate immediately into higher spending on IT services, consulting or outsourcing contracts. It also cautions that AI could remain a margin and growth overhang for traditional IT companies before becoming a meaningful revenue contributor.\n\nThe category's weak showing is also reflected in the returns of individual schemes. Among the 12 direct-plan technology and digital funds , only three have delivered positive one-year returns. The remaining nine are in the red.\n\nEdelweiss Technology Fund has delivered the highest one-year return of 6.20%, followed by Invesco India Technology Fund at 4.86% and Motilal Oswal Digital India Fund at 4.19%.", "source": "LiveMint Money", "pub_date_str": "14 Nov 2026, 09:12 PM IST", "pub_date_relative": "3h ago"}, {"title": "India-China Border Has Become 'More Alive', Needs Greater Troop Commitment Says EAM Jaishankar", "full_content": "Jaishankar also said that India has bolstered its military capabilities along the Line of Actual Control (LAC).", "source": "NDTV Profit", "pub_date_str": "14 Nov 2026, 09:10 PM IST", "pub_date_relative": "3h ago"}], "cfa": [{"title": "All passengers and crew on New Orleans cruise ship survive crash with tanker on Mississippi River", "full_content": "A tanker in New Orleans that apparently lost steering slammed into a docked river cruise boat carrying 180 people Friday, the mayor said. All aboard survived after the crash prompted a massive rescue operation for passengers and crew who plunged into the Mississippi River as the ship took on water and began to topple over.\n\nVideo from the scene showed the much larger Atlantic Asphalt tanker hit the American Heritage cruise boat while it was docked as metal and glass crashed and crunched.\n\nTugboat operators, nearby workers, police and other rescuers rushed to help.\n\n\"We have zero people unaccounted for, which truly is a miracle on the Mississippi,\" New Orleans Mayor Helena Moreno said at a news conference as rescuers and others cheered.\n\nThe mayor said 32 people were taken to the hospital, but none of them had critical injuries.\n\nThe boat started listing within minutes and flipped while emergency workers were still trying to get everyone off the ship.\n\nDozens of people on board and at least two police officers were dragged from the 66-degree Fahrenheit (19-degree Celsius) river onto nearby ships.\n\nDevon Flanagan was at his job nearby at the Port of New Orleans when workers rushed down the dock. He got out of his truck and saw the ship on its side and passengers in the water.", "source": "CNBC Top News", "pub_date_str": "15 Nov 2026, 12:01 AM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "JioBlackRock Flexi Cap Fund: 13 new stocks added, including Hindustan Zinc & IIFL Finance; 21 exits in October", "full_content": "JioBlackRock Flexi Cap Fund increased its holdings in 27 stocks in October, led by Punjab National Bank (PNB), Bank of India and GAIL (India), while adding Hindustan Zinc and 12 other companies to its portfolio. The fund also exited 21 stocks, including Tata Consultancy Services (TCS), ITC and Yes Bank, and reduced its positions in HDFC Bank and Adani Energy Solutions.\n\nThe fund's October portfolio disclosure shows that it raised its holding in PNB by nearly 23.38 lakh shares and Bank of India by 20.18 lakh shares. It also increased its positions in Steel Authority of India (SAIL), Tata Steel and Oil and Natural Gas Corporation (ONGC).\n\nThe fund's portfolio contained 129 stocks at the end of October, compared with 137 in September. It increased holdings in 27 existing stocks and reduced positions in 18 others, while keeping its share quantities unchanged in 71 companies.\n\nHindustan Zinc was the largest new addition to the fund's portfolio in October. The fund purchased 8.81 lakh shares of the company, representing 1.41% of its net assets at the end of the month. IIFL Finance was another notable addition, with 3.38 lakh shares and a portfolio allocation of 0.57%.\n\nThe fund also added South Indian Bank, Mahindra & Mahindra Financial Services, Bajaj Consumer Care, Tanla Platforms, Tips Music, Indian Energy Exchange, International Gemological Institute, Sky Gold and Diamonds, DCB Bank, Gujarat Ambuja Exports and Quess Corp.\n\nAt the other end, the fund completely exited 21 stocks. TCS was the largest exit by portfolio value, with its September holding of 2.25 lakh shares accounting for 1.45% of net assets. It also sold its entire holding of 38,510 shares in UltraTech Cement, which represented 1.33% of its September portfolio.\n\nYes Bank was another major exit, with the fund selling approximately 1.83 crore shares.", "source": "LiveMint Money", "pub_date_str": "14 Nov 2026, 11:45 PM IST", "pub_date_relative": "31m ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "The scandal at Nvidia is exactly what\u2019s wrong with the S&P 500", "full_content": "A big chunk of your retirement is likely invested in the computer-chip giant.", "source": "MarketWatch Top Stories", "pub_date_str": "14 Nov 2026, 11:20 PM IST", "pub_date_relative": "56m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Trump Mopped Up To $5-Million Nvidia Shares Days Before Chip Export Rule Was Scrapped, Watchdog Says", "full_content": "The purchases were made in the days leading up to May 2025, when the Trump administration withdrew the AI Diffusion Framework.", "source": "NDTV Profit", "pub_date_str": "14 Nov 2026, 11:17 PM IST", "pub_date_relative": "59m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Nvidia board urged orld Economy", "pub_date_str": "14 Nov 2026, 11:16 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Derivatives"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Italy Fines Meta \"805 Million Over Access To Users' Photos", "full_content": "The penalty was imposed on Meta Platforms Ireland Ltd., the company's main European subsidiary.", "source": "NDTV Profit", "pub_date_str": "14 Nov 2026, 11:06 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "SpaceX's S&P 500 Bid Gets New Life As Musk Pitches Tesla Merger", "full_content": "Talks have been progressing toward a tie-up that would consolidate Musk's business empire into a single behemoth.", "source": "NDTV Profit", "pub_date_str": "14 Nov 2026, 10:58 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Wall Street Makes Its Pitch for Anthropic\u2019s I.P.O. - The New York Times", "full_content": "Wall Street Makes Its Pitch for Anthropic\u2019s I.P.O. The New York Times Meet the seven co-founders of Anthropic CNBC Wall Street Braces for Anthropic\u2019s Spending The New York Times Anthropic\u2019s Dario Amodei \u2018not super fussed\u2019 about market turmoil ahead of IPO Financial Times 4 Takeaways From Dario Amodei\u2019s Anthropic IPO Chat With Jamie Dimon Barron's", "source": "Google News Business", "pub_date_str": "14 Nov 2026, 10:55 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "CMS Info Q2 Results: Profit Rises 10% As Services Revenue Hits Record For Fourth Straight Quarter", "full_content": "The fastest growth came from managed services and technology solutions, where revenue rose 19% to Rs 321 crore.", "source": "NDTV Profit", "pub_date_str": "14 Nov 2026, 10:50 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Can a bank recover someone else's loan from your pension if you are a guarantor? What the High Court ruled", "full_content": "A retired government employee who guarantees someone else's loan could face recovery proceedings if the borrower defaults. But can a bank directly deduct the outstanding loan amount from the guarantor's pension account after retirement? The Jammu and Kashmir and Ladakh High Court has restrained Jammu and Kashmir Bank from doing so in a case involving a retired police personnel, highlighting the importance of protecting pension income that supports retirees and their families.\n\nIn its 13 November 2026 judgment in Nazir Ahmad Kuchay v. Jammu and Kashmir Bank Limited , Justice Moksha Khajuria Kazmi set aside a trial court order and restrained the bank from recovering loan dues from the retired employee's pension account. The court took note of the fact that pension was his family's sole source of income and that he had stood as guarantor while still in government service .\n\nKuchay, a retired police personnel and senior citizen, had stood as guarantor for a loan taken by another individual from Jammu and Kashmir Bank. When the borrower defaulted on repayments, the bank began deducting the outstanding instalments from Kuchay's bank account.\n\nBy then, Kuchay had retired from government service and depended on his pension to support himself and his family. He approached the bank, informing it about his retirement and financial circumstances. According to his submissions, the bank assured him that further deductions would stop. However, the recovery continued.\n\nKuchay subsequently filed a civil suit seeking a refund of the amounts deducted and an injunction against further recovery.", "source": "LiveMint Money", "pub_date_str": "14 Nov 2026, 10:20 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Beyond Coal India, ONGC: 10 lesser-known dividend stocks with up to 19.6% yield - Premco, GOCL, Accelya to D-Link | List", "full_content": "JAGRAN Sharmila Bhadoria Published 14 Nov 2026, 09:31 PM IST Prefer Livemint on Google Lesser known stocks with high dividend yield: Coal India, Indian Oil Corporation, Vedanta, are among top names in the Indian stock market when it comes to high dividend yield. It tells how much income investors can earn relative to investment in a stock.\n\nFor investors with keen interest in dividend yield stocks, here\u2019s a list of 10 lesser known stocks with up to 19.6% yield in the financial year 2025-26.\n\nCyberTech Systems, Majestic Auto , Jagran Prakash, IL&FS Investment Managers, Premco Global , Premco Global, and Indo Borax & Chemicals have more than 10% dividend yield for FY26.\n\nCyberTech Systems has announced a total of \u20b9 24 per equity share of dividend in the financial year 2025-26. With this, its dividend yield stood at 19.6% in one year. The stock closed 3.25% lower at \u20b9 126.50 per share on BSE on Friday, November 13.\n\nMajestic Auto has paid a total of \u20b9 68.1 per share dividend in FY26, and its annual dividend yield stood at 16.4% for FY26. The stock closed 1.23% lower at \u20b9 365.30 per share on BSE with a market capitalisation of \u20b9 379.82 crore on Friday.\n\nJagran Prakashan has announced a total of \u20b9 10 per equity share dividend in the previous financial year 2025-26. Its dividend yield stood at 16.1% for the financial year. The stock closed 0.31% lower at \u20b9 66.57 per share on BSE on Friday.\n\nThe company has announced \u20b9 1.2 per share payout over the last one year and its dividend yield stood at 15.9%. The stock closed 0.50% higher at \u20b9 8 per share on NSE on Friday.\n\nThe company has paid \u20b9 44 per equity share dividend in the previous financial year. With this, its annual dividend yield stood at 11.2% in FY26. The company stock closed 4.68% lower at \u20b9 395 apiece on BSE on Friday.", "source": "LiveMint Markets", "pub_date_str": "14 Nov 2026, 09:31 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Fixed Income"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "How Nvidia turmoil and a Democratic Congress could reshape the AI trade, according to ETF experts", "full_content": "The largest technology stocks linked to the artificial intelligence trade could stand to benefit the most from Nvidia's woes and a Democratic-controlled Congress pushing back on data centers, according to investing experts interviewed on CNBC's \" ETF Edge \" earlier this week.\n\n\"We may have been put in an environment, as much as investors have sort of been looking for areas outside of Big Tech, where net-net Big Tech ends up as the winner once again,\" said Roundhill Investments CEO Dave Mazza, whose firm manages the Magnificent Seven ETF ( MAGS ).\n\nPart of his bull case: Other players in the AI trade are positioned to fill Nvidia's chip demand if investors lose trust in the company after a tumultuous week that saw its iconic founder and CEO Jensen Huang resign.\n\n\"If we get into an environment where people can't trust \u2026 Nvidia, they're going to look for other sources for these chips because they need them,\" Mazza said during the \"ETF Edge\" interview, which occurred Monday as the Nvidia scandal grew but before Huang had resigned.\n\nDiscussing recent fund flow activity for the MAGS ETF, as well as for the Roundhill Neocloud ETF ( NCLD ) \u2014 which focuses on smaller market cap, specialized cloud computing companies \u2014 Mazza said, \"In a weird way, [hyperscalers] may continue to benefit from this because they have the compute available. It's going to be more valuable if the demand is there.\"\n\nThe Roundhill Magnificent Seven ETF ended the week in the green, albeit with a gain of less than 1%, while the Roundhill Neocloud ETF was up over 1%, though earnings from top holdings Coreweave and Nebius presented a mixed picture.\n\nCoreWeave had its best day since April 2025 on Wednesday after its latest quarterly results, while Nebius shares sank after its Thursday report. The neocloud ETF remains deeply in the red since its August 2026 launch, down 39%, amid concerns about balance sheet strength, which could linger given Nvidia's role in financing the AI buildout.", "source": "CNBC Finance", "pub_date_str": "14 Nov 2026, 09:20 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Investing in IT stocks through mutual funds? Should you continue your SIP amid AI disruption and earnings concerns?", "full_content": "Technology funds have emerged as the worst-performing equity mutual fund category in 2026 so far, delivering an average return of-10.47%. The underperformance comes even as the global artificial intelligence (AI) boom drives investment in technology infrastructure and raises expectations of a new growth cycle for the sector.\n\nFor investors holding technology mutual funds, the disconnect raises a question. should they continue their systematic investment plans ( SIPs ), or reconsider their exposure?\n\nThe weakness reflects concerns about the near-term earnings outlook for Indian IT services companies. While AI could create significant opportunities over time, its impact on traditional outsourcing and technology services businesses remains uncertain. Companies are also facing intensifying competition, pressure on conventional service lines and cautious enterprise spending.\n\nAn investment outlook released by Axis Mutual Fund in November 2026 highlights these risks. The fund house has an underweight position in the information technology sector, citing the limited near-term benefit of AI investments to discretionary IT services spending.\n\nThe report notes that much of the current AI investment is concentrated in infrastructure development. This does not necessarily translate immediately into higher spending on IT services, consulting or outsourcing contracts. It also cautions that AI could remain a margin and growth overhang for traditional IT companies before becoming a meaningful revenue contributor.\n\nThe category's weak showing is also reflected in the returns of individual schemes. Among the 12 direct-plan technology and digital funds , only three have delivered positive one-year returns. The remaining nine are in the red.\n\nEdelweiss Technology Fund has delivered the highest one-year return of 6.20%, followed by Invesco India Technology Fund at 4.86% and Motilal Oswal Digital India Fund at 4.19%.", "source": "LiveMint Money", "pub_date_str": "14 Nov 2026, 09:12 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Trump doesn\u2019t plan to raise Nvidia, spy issue during China trip: U.S. officials", "full_content": "President Donald Trump is not expected to raise allegations of a Chinese intelligence operation involving former Nvidia CEO J ensen Huang during his upcoming meeting with Chinese President Xi Jinping, senior U.S. officials said Friday.\n\nOfficials also said that Elon Musk , the CEO of Tesla and SpaceX, will accompany Trump on the trip to Shenzhen, China, for the Asia-Pacific Economic Cooperation summit on Nov. 18 and 19.\n\nThe White House, earlier Friday, said Trump plans to have a three-way summit there with Xi and Russian President Vladimir Putin.\n\nJensen Huang's relationship with the suspected spy, Alice Huang, who is not related to him, has raised concerns that a Singapore-based company where she was an executive diverted restricted Nvidia chips to China.\n\n\"The situation with Nvidia should not really have any bearing on the trip,\" an official said on the press call, speaking on the condition that they not be identified.\n\n\"In all of our discussions and negotiations with the Chinese, we do not negotiate American export controls ... and we don't expect it to figure at all in any of our conversations with the Chinese while we're there.\"\n\nAsked if Trump would raise the allegations against Alice Huang to Chinese leader Xi Jinping, the official said, \"The focus of a meeting with President Xi, at least on the economic side, is going to be about implementation of the trade agreement.\"\n\n\"When it comes to some of these national security matters and examinations and investigations that are going on in the U.S., [that is] probably not something that we're going to read the Chinese in on at this moment,\" the official said.", "source": "CNBC Top News", "pub_date_str": "14 Nov 2026, 09:06 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Small-cap stock rallies 70% in a year: Motilal Oswal sees another 47% upside | Should you buy? Check target price", "full_content": "Sharmila Bhadoria Published 14 Nov 2026, 08:46 PM IST Prefer Livemint on Google Shares of small cap stock GNG Electronics ended marginally higher on Friday, November 13, reversing its losses made in the first half of the week. While the stock witnessed range-bound movement over the past few trading sessions, its share price value has delivered strong returns over the past six months.\n\nAdvantage due to scale across sourcing and distribution, expected improvement in inventory rotation, and pricing visibility are likely to benefit the company in near-term, according to Motilal Oswal, which sees nearly 47% upside potential in the stock.\n\nGNG Electronics growth is likely to remain resilient even if memory prices ease. The underlying demand for affordable refurbished PCs and its expanding distribution network extend beyond the shortage-led demand acceleration.\n\n\u201cWe estimate a CAGR of 34%/47%/49% revenue/EBITDA/PAT over FY26-29 and ~350bp gross-margin expansion in FY27E, which is estimated to be largely sustained thereafter,\u201d read Motilal Oswal report.\n\nThe memory shortage has lifted mainstream laptop prices in India by nearly 80% on an annual basis. The company has prioritised volume over pricing, raising ASPs only 10% and maintained refurbished laptop prices at nearly 30%-35% of new device prices.\n\nGNG has expanded to 55 countries (vs. 38 as of FY25 end), 5,542 channel touchpoints (vs. 4,154) and 820 procurement partners (vs. 557). The company is likely to benefit from inventory rotation due to scale across sourcing and distribution.\n\nThe brokerage maintained a \u2018Buy\u2019 rating for the stock with a target price of \u20b9 840 per share.\n\n\u201cWe reiterate BUY with a TP of INR840, based on ~30x FY28E EPS. Elevated inventory and channel credit will keep working capital high, with net debt expected to peak at ~INR5.3b in FY28E before declining,\u201d read the brokerage report.", "source": "LiveMint Markets", "pub_date_str": "14 Nov 2026, 08:46 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Rising rents draw Wall Street money to industrial outdoor storage lot investments across the U.S.", "full_content": "Nondescript lots holding idle bulldozers, trucks and other industrial equipment are a common sight in local real estate markets across the U.S., and increasingly, a focus for Wall Street private investment giants.\n\nIf you haven't noticed them, it's probably because they so easily fade into the landscape, just another non-branded bit of land in the miasma of suburbia. But Brookfield and Blackstone, two of the world's largest alternative asset managers, are among the institutional investors moving in on what the industry calls industrial outdoor storage, or IOS. Investors are eyeing these lots as the AI build-out increases the demand for heavy equipment.\n\n\"We have strong conviction in industrial outdoor storage, which plays a critical role in our supply chain,\" said Devin Barnwell, a managing partner and co-leader of Brookfield's logistics business.\n\nHe says that up until now, the segment has been fragmented, but Brookfield sees that changing.\n\n\"We see significant opportunity to bring institutional capital and operating expertise to this fragmented sector, improving the quality and efficiency of these assets while strengthening the resilience of our industrial supply chains,\" Barnwell said.\n\nBrookfield spent $1.2 billion earlier this year to take Peakstone Realty Trust private, a deal completed in May that gave it a portfolio of more than 70 industrial properties, most of them outdoor storage yards.\n\nBlackstone is also ramping up in the sector, mainly as a lender. Its real estate debt arm has made six loans to outdoor storage owners totaling more than $1.1 billion, including a $244 million loan in June to Alterra IOS to buy 37 properties.\n\nDespite the billions being bet on the market by Wall Street, there is still opportunity in the market for individual investors and local entrepreneurs looking to park their money where others park their equipment.", "source": "CNBC Top News", "pub_date_str": "14 Nov 2026, 08:44 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Alternative Investments", "Portfolio Management"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "How Rockstar's 'GTA VI' release could reshape gaming, streaming and even paid time off", "full_content": "It's been 13 years since the last installment of Grand Theft Auto , and fans are getting ready for what analysts say could be the biggest video game launch of all time.\n\nThe latest game in the franchise, \"Grand Theft Auto VI,\" is set to launch on Nov. 19, after Take-Two Interactive's Rockstar Games delayed its launch twice. Roth analyst Eric Handler estimated the game maker spent more than $1 billion developing the game.\n\nSales figures could end up breaking records. Sensor Tower estimated over 12 million preorders through Nov. 13, and Morgan Stanley forecast the game could sell 40 million copies by March 2027.\n\nBeyond launch week, the Grand Theft Auto, or GTA, franchise has a track record of lasting engagement over many years. Even 13 years after launch, \"Grand Theft Auto V\" is one of the top five most viewed games on Twitch this year.\n\nIn anticipation of the game's launch, investors have been taking note: Take-two's stock has more than doubled since the beginning of 2023.\n\nThe release is seen as not only a monumental moment for developer Rockstar Games and parent company Take-Two, but also a massive opportunity for the entire gaming industry.\n\nTake-Two CEO Strauss Zelnick addressed demand in a recent \"Squawk Box\" interview , saying, \"We tend to be pretty judicious when we talk about this sort of thing, but our expectations were high and they are being vastly exceeded so far.\"\n\nStreamers and creators across the digital ecosystem are looking at the launch as a massive opportunity to drive engagement with their content and fuel subscriber and ad revenue growth.", "source": "CNBC World Economy", "pub_date_str": "14 Nov 2026, 08:24 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Heating oil prices are up 59% from last winter. The spike is 'crushing folks,' Maine nonprofit says", "full_content": "Winter heating bills can strain household budgets. This year, a spike in heating oil prices could make the season especially difficult for households that depend on the fuel and have little financial wiggle room.\n\nThe national average price of heating oil was roughly $5.91 a gallon as of Nov. 9, up about $2.19, or 59%, from a year earlier, according to the U.S. Energy Information Administration.\n\nIn Maine, the average price per gallon is roughly $5.83, up about $2.49 from a year earlier, or about 75%. The state is among those whose residents may feel the price rise acutely \u2014 about 50% of homes there use heating oil.\n\nThe jump \"is crushing folks,\" said Jason Parent, CEO of AVEC Community Action, a nonprofit agency based in Presque Isle, Maine, that provides heating assistance and other social services in three of the state's 16 counties. Many residents face immediate crises, he said, such as empty fuel tanks or reliance on unsafe heating sources.\n\n\"My fear is that there are households out there who have secondary fuel sources like wood stoves, pellet stoves and other things that are no longer operating and functioning in a safe way,\" Parent said.\n\nThe price surge comes on the heels of years of high overall inflation that has already squeezed household budgets, he said.\n\n\"The cost of living has made it impossible for households who had been figuring out how to get by without [financial help],\" Parent said.\n\nThe price spike comes amid a tight global market for refined fuels, a category that includes heating oil and diesel . Supply shocks tied to the Iran war and the Russia-Ukraine war , low inventories and limited refining capacity have constrained supplies and added upward pressure on fuel prices, according to recent research from the Federal Reserve Bank of Kansas City.", "source": "CNBC Top News", "pub_date_str": "14 Nov 2026, 08:00 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Tesla is inviting some people to buy a Cybercab \u2018for personal use\u2019 \u2014 but read the fine print - The Verge", "full_content": "Tesla is inviting some people to buy a Cybercab \u2018for personal use\u2019 \u2014 but read the fine print The Verge Tesla Opens Sales of Autonomous Cybercab for \u2018Select\u2019 Customers WSJ Tesla Cybercab ownership will come with plenty of strings attached Teslarati Tesla: Sales Of Self-Driving Cybercab Coming Soon To Invitees: $20/hr? Forbes Tesla invites select customers to buy Cybercab for personal use Reuters", "source": "Google News Business", "pub_date_str": "14 Nov 2026, 07:48 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "How Canadian stocks could be big winners of U.S. midterms", "full_content": "Canadian stocks are up more than 1% since the vote, while the S&P 500 has sagged 0.5% in that time.", "source": "CNBC Top News", "pub_date_str": "14 Nov 2026, 07:41 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Dividend king PSU stock: Down 23% in 6 months! Nuvama sees 42% upside; target price, rationale", "full_content": "NMDC shares fell 1.76% to \u20b969.90 on Friday after its second-quarter EBITDA declined 3% year over year to \u20b919.4 billion, below expectations. Nuvama retained a Buy rating and raised its target price to \u20b9100, citing normalized supplies and potential second-half volume growth.", "source": "LiveMint Markets", "pub_date_str": "14 Nov 2026, 07:41 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "How Nvidia stock crash will impact Indian investors\u2019 US mutual fund and ETF holdings", "full_content": "Nvidia\u2019s 13% stock fall had a limited impact on most Indian US mutual funds, but ETFs trading at steep premiums pose a bigger risk. Investors could face losses even if the underlying US stocks remain stable.", "source": "LiveMint Money", "pub_date_str": "14 Nov 2026, 07:33 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "MAGA turns on Lutnick amid China spy scandal - Axios", "full_content": "MAGA turns on Lutnick amid China spy scandal Axios Bessent points finger at Commerce Department in Nvidia scandal as Trump advisers discuss possible Lutnick ouster CNN Nvidia Scandal Deals Blow to Trump\u2019s Tariff Strategy Newsweek The Jensen Huang scandal reaches Donald Trump\u2019s cabinet The Economist Bessent Faults Commerce Dept. for Failing to Blacklist Megaspeed The New York Times", "source": "Google News Business", "pub_date_str": "14 Nov 2026, 07:01 PM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Trump Media group stares down $1bn debt crunch as bitcoin bet fades", "full_content": "Plunge in shares and cryptocurrency prices could force Truth Social owner to sell assets or take on costly new debt", "source": "FT Markets", "pub_date_str": "14 Nov 2026, 06:30 PM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "NVIDIA shareholder Leo KoGuan backs Jensen Huang! Explains why he will not add more stake in flagship AI stock", "full_content": "Investor Leo KoGuan plans to reduce his Nvidia investment while continuing to support Jensen Huang, whom he hopes to back in a future superintelligence venture. KoGuan says Nvidia\u2019s growth outlook remains strong and that AI is not a bubble.", "source": "LiveMint Markets", "pub_date_str": "14 Nov 2026, 05:19 PM IST", "pub_date_relative": "6h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Wholesale food prices are on the rise - Axios", "full_content": "Wholesale food prices are on the rise Axios What got more expensive for US consumers in October? Reuters Baked foods CPI falls Supermarket Perimeter As Americans fret about everyday costs grocery prices just had their biggest jump since April The Independent Grocery Food Prices Rise 0.4% in October as Bakery Products Hold Steady Grain Journal", "source": "Google News Business", "pub_date_str": "14 Nov 2026, 04:43 PM IST", "pub_date_relative": "7h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Yes Bank moves SC seeking review of order on writing off of Rs 8,415 cr AT-1 bonds", "full_content": "Yes Bank has filed a petition with the Supreme Court to review an order from October 15. This order upheld a Bombay High Court ruling that quashed the bank's decision to write off AT-1 bonds. These bonds, worth Rs 8,415 crore, were questioned during Yes Bank's financial difficulties. The high court ruled that the bank's administrator lacked authority for such a write-off.", re. Strong Q2 results, a robust order book and upgraded guidance have supported the stock, which SBI Securities rates Buy with a \u20b9732 target.", "source": "LiveMint Markets", "pub_date_str": "14 Nov 2026, 03:57 PM IST", "pub_date_relative": "8h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Mahanadi Coalfields files RHP for proposed IPO worth nearly Rs 9,500 crore", "full_content": "Mahanadi Coalfields Ltd has filed its Red Herring Prospectus for an initial public offering with regulatory bodies. This IPO features an offer for sale of roughly 66.18 crore equity shares from Coal India, amounting to a 10 percent stake in the subsidiary MCL. The intended capital raise is around Rs 9,500 crore, with the final execution reliant on regulatory approval and market conditions.", "source": "Economic Times Markets", "pub_date_str": "14 Nov 2026, 03:42 PM IST", "pub_date_relative": "8h ago", "cfa_topics": ["Corporate Issuers", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Dalal Street Week Ahead: Can Nifty bulls overcome key resistance levels?", "full_content": "The Nifty's current technical structure remains positive. Although a sharp rebound from the vicinity of the 200-week moving average has significantly improved the near-term technical setup, the Index is near its overhead resistance area.", "source": "Economic Times Markets", "pub_date_str": "14 Nov 2026, 03:38 PM IST", "pub_date_relative": "8h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "This Man Stole $9 Million in Gold Bars on the Upper West Side, Police Say - The New York Times", "full_content": "This Man Stole $9 Million in Gold Bars on the Upper West Side, Police Say The New York Times Upper W     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
