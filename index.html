<script>

    const allData = {"general": [{"title": "Stock futures rebound ahead of busy week of earnings, jobs data and the midterm elections: Live updates", "full_content": "Stock futures moved higher early Monday after a losing week on Wall Street as investors braced for a packed week of earnings results, jobs reports and the upcoming midterm elections.\n\nS&P 500 futures traded up 0.5%, while Nasdaq-100 futures gained 0.9%. Futures linked to the Dow Jones Industrial Average added 186 points, or 0.4%.\n\nThe moves come after the three major averages suffered a losing week, bogged down by selling pressure in tech as investors continued to scrutinize names related to the artificial intelligence buildout. The S&P 500 and Dow Jones Industrial Average each fell less than 1% on the week, while the Nasdaq Composite dropped 2%.\n\nIn Asia, Japan's Nikkei 225 gained 0.33% to 63,081.86, while South Korea's Kospi led gains with a 2.38% rise to 5,859.08.\n\nAustralia's benchmark S&P/ASX 200 was 0.53% lower. Hong Kong's Hang Seng index gained 0.44% in its last hour of trade, while mainland China's CSI 300 added 0.79%.\n\nThe week got off to a good start after Anthropic publicly filed for an IPO , which boosted AI-linked stocks. However, selling pressure resumed later in the week amid signs that capex spending could be abating after both Alphabet and Microsoft posted lower-than-expected capex forecasts . Amazon also left its full-year capex guidance unchanged .\n\nStill, 3Fourteen Research's Warren Pies isn't too concerned, pointing to a ramp-up in forward earnings estimates and adding that \"there's a lot to like\" about Anthropic's S-1 filing.\n\n\"I just don't see anything broken with the AI trade fundamentally,\" he said on CNBC's \"Closing Bell Overtime\" on Friday. \"Technicals are another story.\"", "source": "CNBC Top News", "pub_date_str": "02 Nov 2026, 01:16 PM IST", "pub_date_relative": "2m ago"}, {"title": "Got a Diwali gift from your employer? Check the tax rules", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nAwaiting your Diwali gift from your employer, or have you already received one? Before celebrating, make sure you understand the tax implications. While gifts from employers can be tax-free up to a specified limit, bonuses are taxable from the very first rupee. The distinction could make a significant difference to your tax liability.\n\nThe Income-tax Act, 2025, which came into effect on 1 April 2026 and replaced the Income-tax Act, 1961, has raised the annual tax-exempt limit for gifts received from employers to less than \u20b9 15,000, from less than \u20b9 5,000 earlier.\n\n\"The exemption applies from tax year 2026-27 (FY27). The gift exemption limit of \u20b9 15,000 covers non-cash gifts, vouchers and tokens, including physical gifts and digital gift cards redeemable for goods or services, provided their aggregate value is below \u20b9 15,000 during the tax year. Gifts to a member of the employee's household are also covered,\" said SR Patnaik, Partner (head-taxation), Cyril Amarchand Mangaldas.\n\nIf the total value of gifts reaches \u20b9 15,000 or exceeds it, the entire amount becomes taxable. \"Rule 15 of the Income-tax Rules, 2026 states that when the aggregate value of all gifts in a tax year is less than \u20b9 15,000, only then the value of such gifts shall be considered as 'nil'. Hence, conservatively, the entire aggregate value of all gifts may become taxable as a part of salary in the hands of the employees,\" Patnaik said.\n\nFor instance, if your employer gives you a mobile phone worth \u20b9 10,000 during Diwali and you receive another gift worth \u20b9 4,000 later in the same tax year, the aggregate value of \u20b9 14,000 remains tax-free. But if the total value reaches or crosses \u20b9 15,000, the entire amount becomes taxable.\n\nNot every payment received during Diwali qualifies as a gift.", "source": "LiveMint Money", "pub_date_str": "02 Nov 2026, 01:14 PM IST", "pub_date_relative": "4m ago"}, {"title": "China\u2019s top three airlines head for full-year losses as fuel costs weigh", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Nov 2026, 01:12 PM IST", "pub_date_relative": "6m ago"}, {"title": "Deutsche Bank downgrades Novartis stock rating to sell on valuation", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Nov 2026, 01:10 PM IST", "pub_date_relative": "8m ago"}, {"title": "Earnings call transcript: Crizac Q2 2026 revenue drops 37% as stock slips", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Nov 2026, 01:10 PM IST", "pub_date_relative": "8m ago"}, {"title": "Kosmos Energy earnings missed by $0.03, revenue fell short of estimates", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Nov 2026, 01:09 PM IST", "pub_date_relative": "9m ago"}, {"title": "Ganesha Ecosphere Q2 FY27 slides: revenue surges, margins compress", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Nov 2026, 01:08 PM IST", "pub_date_relative": "10m ago"}, {"title": "Muthoot\u2019s solid gold loan AUM loses sheen amid asset quality stress, stiff competition", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nMuthoot Finance shares slid to a new 52-week low of \u20b9 2,305 on the National Stock Exchange on Monday as investors tried to digest the asset quality deterioration in the September quarter (Q2FY27) with rising loan delinquencies. This was when its mainstay gold loan assets under management (AUM) increased by 43% year-on-year, backed by higher prices, improved tonnage and client additions.\n\nBetter yields led to a 152 basis points (bps) sequential rise in net interest margin (NIM) to 11.93%. On the flip side, credit costs increased, with risky stage-III assets soaring sequentially to \u20b9 7,268 crore in Q2 from \u20b9 3,926.5 crore in Q1, and stage-II assets surging to \u20b9 23,466 crore from \u20b9 1,876 crore in Q1 and \u20b9 1,062 crore in Q4FY26.\n\nFollowing implementation of the Reserve Bank of India\u2019s revised regulations effective 1 April, Muthoot introduced structured monthly interest-servicing gold loan schemes. Earlier, it offered bullet repayment loans, wherein customers could pay interest at any point during the loan tenure without any prepayment penalty.\n\nThis transition led to missed payments and consequently, a sharp movement into stage-II and stage-III buckets. As customers get accustomed to the new repayment cycle, the management expects asset quality stress to ease. It doesn\u2019t view this spike as an indication of underlying borrower stress.\n\nBut a pivot toward monthly interest repayment, which necessitates higher collection efforts, raises the risk of a structural compression in yields and NIM for NBFC gold financers.", "source": "LiveMint Markets", "pub_date_str": "02 Nov 2026, 01:07 PM IST", "pub_date_relative": "11m ago"}, {"title": "MCX Gold vs MCX Silver rates today, 2 Nov: Check how precious metals are performing on Monday amid Sensex, Nifty surge", "full_content": "Domestic gold and silver futures traded higher on Monday, 2 November, as investors tracked global commodity markets ahead of the closely watched US midterm elections, which could shape global geopolitics over the next few years.\n\nSilver outperformed gold in percentage terms during the morning session, though both metals remain highly volatile and vulnerable to geopolitical developments.\n\nIndian equities, meanwhile, staged a strong recovery. The Nifty 50 reclaimed the 23,000 level and was trading 1.13%, or 260 points, higher at 23,313.95 at 11:42 AM.\n\nAs of 11:59 AM, MCX gold futures were trading at \u20b9 1,39,112 per 10 grams, up \u20b9 627, or 0.42%, from the previous close of \u20b9 1,38,485. The contract opened at \u20b9 1,39,003 and touched a high of \u20b9 1,39,179.\n\nSilver futures were trading at \u20b9 1,81,999 per kg, up \u20b9 2,867, or 1.57%, from the previous close of \u20b9 1,79,132. The contract opened at \u20b9 1,81,094 and touched an intraday high of \u20b9 1,82,701.\n\nSilver\u2019s sharper rise points to stronger momentum in the morning session, but one session does not make a trend. Gold and silver prices have stayed volatile over the past few months amid ongoing geopolitical developments.\n\nEquity markets also opened higher. The BSE Sensex was trading 1.17% higher at 75,355.37 at 12:04 PM, after opening at 75,178.24, while the NSE Nifty 50 was up 1.09% at 23,304.35, after opening at 23,222.30.\n\nSentiment was supported by the upcoming US midterm elections , hopes of lower crude oil prices, expectations of progress in talks to end the US-Iran conflict, and strong corporate earnings.", "source": "LiveMint Money", "pub_date_str": "02 Nov 2026, 01:06 PM IST", "pub_date_relative": "12m ago"}, {"title": "Euronext names NN Group\u2019s Knibbe as next chief executive", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Nov 2026, 01:00 PM IST", "pub_date_relative": "18m ago"}, {"title": "Earnings call transcript: Ganesha Ecosphere posts strong Q2 2026 growth", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Nov 2026, 12:57 PM IST", "pub_date_relative": "21m ago"}, {"title": "Barclays downgrades Dr. Martens to underweight, cuts price target", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Nov 2026, 12:57 PM IST", "pub_date_relative": "21m ago"}, {"title": "Coal India shares jump 4% after firm records highest-ever monthly coal supplies in October", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Coal India shares jump 4% after firm records highest-ever monthly coal supplies in October Coal India Share Price NMDC Share Price KIOCL Share Price Gujarat Mineral Development Corporation Share Price Sandur Manganese & Iron Ores Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Coal India shares jump 4% after firm records highest-ever monthly coal supplies in October SECTIONS Coal India shares jump 4% after firm records highest-ever monthly coal supplies in October By Debaroti Adhikary , ETMarkets.com Last Updated: Nov 02, 2026, 12:57:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Coal India shares jumped more than 4% after the state-run miner reported record monthly coal production and supplies in October. Total supplies crossed 70 million tonnes for the first time, while deliveries to the power sector reached an all-time high of 57.1 million tonnes.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "02 Nov 2026, 12:57 PM IST", "pub_date_relative": "22m ago"}, {"title": "Adnoc signs AI deal with OpenAI as Sam Altman visits Abu Dhabi", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Nov 2026, 12:56 PM IST", "pub_date_relative": "22m ago"}, {"title": "Marine sniper turned macro strategist says this bull market has six to 12 months left. Here\u2019s his playbook.", "full_content": "Alex Barrow, founder of Macro Ops, says the bull market is on borrowed time and will ratchet back painfully for investors who aren\u2019t prepared.", "source": "MarketWatch Top Stories", "pub_date_str": "02 Nov 2026, 12:55 PM IST", "pub_date_relative": "24m ago"}, {"title": "Oil prices ease 3% on optimism for Qatari-led talks on ending Iran war", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Nov 2026, 12:54 PM IST", "pub_date_relative": "24m ago"}, {"title": "Why investors may be ready to return to large-cap stocks", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nMutual fund investing has rarely followed a more inverted pattern than it does today. Capital has persistently chased small-cap and mid-cap funds, with money flowing largely one way into these categories through lump-sum investments. Investors have shunned bluechip-heavy large-cap funds, while incremental growth in the SIP book has also come largely from small-cap and mid-cap categories. The prevailing belief was that large-caps could no longer deliver the growth potential of these emerging categories.\n\nStrong inflows certainly helped small- and mid-cap stocks show strength and resilience for several quarters. However, two factors have changed the picture in recent months: a sharp spike in commodity prices and the significant valuation premium at which these market favourites trade relative to the rest of the market.\n\nDiscerning investors have begun trimming positions in overvalued stocks, while selling pressure is rising rapidly in companies that show even the slightest disappointment in quarterly results. Investors are also factoring in the impact of sustained commodity inflation on future demand, sales growth and margins.\n\nAt the same time, the sharp contraction in large-cap valuations has significantly widened the gap between these companies and the market's favourites. This has made investors more conscious of the relative attractiveness of large-caps, given their discount to historical valuations, strong ability to revive growth and superior balance sheets. These companies also have the capacity to reduce their capital base through share buybacks.\n\nThe prospect of management teams initiating buybacks, even amid investor apathy, is real. We are also seeing preferential issues in which promoters are buying shares in bluechips. Bajaj Finance is a prime example.", "source": "LiveMint Money", "pub_date_str": "02 Nov 2026, 12:52 PM IST", "pub_date_relative": "26m ago"}, {"title": "Pizza Hut, KFC India operator's Q2 loss naarrows sharply on strong same-store sales growth", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a Earnings \u203a Pizza Hut, KFC India operator's Q2 loss naarrows sharply on strong same-store sales growth Devyani International Share Price Jubilant Foodworks Share Price Westlife Foodworld Share Price Restaurant Brands Asia Share Price Sapphire Foods India Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Pizza Hut, KFC India operator's Q2 loss naarrows sharply on strong same-store sales growth SECTIONS Pizza Hut, KFC India operator's Q2 loss naarrows sharply on strong same-store sales growth Reuters Last Updated: Nov 02, 2026, 12:51:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Devyani International, the parent company of KFC and Pizza Hut in India, has recorded a significant reduction in losses during its second quarter. For the third straight quarter, same-store sales for KFC increased by 4.4%. With revenues climbing by 10.4% to 15.19 billion rupees and expenses only rising 8.3%, Chairman Ravi Jaipuria emphasized the ongoing challenges posed by inflation and increasing interest rates.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "02 Nov 2026, 12:51 PM IST", "pub_date_relative": "27m ago"}, {"title": "ITI shares: 111% returns in 5 years! Telco stock price hits 20% upper circuit | Time to book profits or hold?", "full_content": "Vaamanaa Sethi Published 2 Nov 2026, 12:50 PM IST Prefer Livemint on Google Multibagger stock ITI skyrocketed 20%, hitting the upper circuit in Monday's trading session amid positive sentiment on Dalal Street. ITI share price opened at \u20b9 216.25 apiece on NSE today, as compared to the previous close of \u20b9 215.95 on Friday last week and touched an intraday high of \u20b9 259.14 on 2 November.\n\nMeanwhile, Indian equity benchmark indices Sensex and Nifty opened higher on Monday, supported by a strong rally in heavyweight Reliance Industries following its earnings announcement and a decline in crude oil prices. The 30-share BSE Sensex climbed 764.72 points to 75,216.80 in early trade, while the 50-share NSE Nifty advanced 201.40 points to 23,255.90.\n\nThe stock rally came amid spurt in trading volume. Trading activity in the stock surged several-fold, with a combined 13.09 million shares, equivalent to 1.35% of ITI's total equity, changing hands on the NSE and BSE.\n\nITI share price has witnessed a strong recovery in the near term, gaining 19.18% over the past week. The stock has also delivered positive returns over the past month, rising 7.29%, indicating an improvement in its recent trading momentum.\n\nHowever, ITI shares continue to remain under pressure over longer time frames. The stock has declined 16.64% year-to-date (YTD) and is down 20.19% over the past year.", "source": "LiveMint Markets", "pub_date_str": "02 Nov 2026, 12:50 PM IST", "pub_date_relative": "28m ago"}, {"title": "Dixon Technologies shares gain 11% after Q2 revenue jumps 47% YoY", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Dixon Technologies shares gain 11% after Q2 revenue jumps 47% YoY Dixon Technologies (India) Share Price Syrma SGS Technology Share Price Amber Enterprises India Share Price Kaynes Technology India Share Price PG Electroplast Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Dixon Technologies shares gain 11% after Q2 revenue jumps 47% YoY SECTIONS Dixon Technologies shares gain 11% after Q2 revenue jumps 47% YoY By Surbhi Khanna , ET Online Last Updated: Nov 02, 2026, 12:45:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Dixon Technologies shares surged 11% after the company reported a 46.7% YoY rise in Q2FY27 revenue to Rs 21,794 crore. However, net profit fell 48.7% to Rs 343.7 crore, while EBITDA declined 37% to Rs 666 crore. EBITDA margin contracted to 3.1% from 7.1% a year ago, despite higher revenue and operating profit growth.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "02 Nov 2026, 12:45 PM IST", "pub_date_relative": "33m ago"}, {"title": "India, EU discuss FTA implementation ahead of December signing", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a India, EU discuss FTA implementation ahead of December signing The Economic Times daily newspaper is available online now. Read Today's Paper India, EU discuss FTA implementation ahead of December signing SECTIONS India, EU discuss FTA implementation ahead of December signing PTI Last Updated: Nov 02, 2026, 12:45:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis In an effort to advance their free trade agreement, India and the European Union held pivotal discussions led by Commerce Secretary Rajesh Agarwal, who visited Brussels for dialogues with prominent EU officials. Central to the talks were customs cooperation and trade facilitation, deemed critical for the agreement's efficacy. Additionally, industry stakeholders from the diamond sector were engaged to harness opportunities within India's expanding market.\n\nSome elections matter more than you know: No crop changed in the fields, yet sugar, coffee and soya got cheaper in a day\n\nYou can buy a walkie-talkie online. But can you legally use it?\n\nKYB and KYC: Quick commerce, the Damani premium and what DMart must deliver \u2013 3rd and concluding part\n\nKYC and KYB: Inside Damani\u2019s DMart, the retail chain for the middle class. And stock for the long term? \u2013 Part 2 of 3\n\nWill it be a regulatory nightmare if an exchange lists on its own platform?\n\nKYC and KYB: Inside Damani\u2019s Avenue Supermarts that refuses to charge more \u2013 Part 1 of 3\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "02 Nov 2026, 12:45 PM IST", "pub_date_relative": "33m ago"}, {"title": "Gold rate today 2 Nov: Chennai vs Bangalore prices compared \u2014 City wise details for yellow metal buyers, investors", "full_content": "Gold, silver prices today, 2 November: Gold prices in Bangalore and Chennai rose today on Monday, 2 November, as they jumped globally, bouncing from the previous selloff amid lower oil prices and tempering of inflation concerns, as per reports.\n\nBullion gained as much as 1.1% to near $3,915 an ounce, clawing back some losses after a 3.7% slump in the previous session that rounded off the worst October for the metal since 2008, Bloomberg reported.\n\nSpot gold climbed 0.7% to $3,903.15 an ounce at 11:34 am and spot silver climbed 1.8% to $49.97, according to a Reuters report.\n\nMCX gold futures were trading 0.40% higher at \u20b9 1,39,400 per 10 grams at around 9:13 am in the domestic futures market, while MCX silver futures rose by around 1.15% to \u20b9 1,82,250 per kg.\n\nAt time of writing, gold bullion was trading at \u20b9 1,39,310 per 10 grams on Monday, 2 November 2026, while Silver was at \u20b9 1,81,840 per kg, data on the official bullion website showed.\n\nToday, we compare prices between Chennai vs Bangalore for yellow metal buyers and investors in 18K, 22K and 24K gold and 999 Fine Silver. Also, check gold and silver rates in other key Indian cities including Ahmedabad, Delhi, Hyderabad, Kolkata, and Mumbai today as follows:\n\nGold prices in both Chennai and Bangalore were up, similar to other major cities in India, as per bullion data for 2 November. The 24-karat gold price in Chennai was \u20b9 1,39,420 per 10 grams, \u20b9 250 more compared to \u20b9 1,39,170 per 10 grams in the Garden City.\n\nFurther, the 22-karat gold price in Chennai was \u20b9 1,27,802 per 10 grams, \u20b9 229 more compared to \u20b9 1,27,573 per 10 grams in Bengaluru; and the 18-karat gold rate was \u20b9 1,04,565 per 10 grams in Chennai \u20b9 187 more than \u20b9 1,04,378 per 10 grams in Bengaluru.", "source": "LiveMint Money", "pub_date_str": "02 Nov 2026, 12:41 PM IST", "pub_date_relative": "37m ago"}, {"title": "Ramkrishna Forgings shares jump 10% after Q2 results, surge 35% in 2026: Is more upside ahead? | Key levels to watch", "full_content": "Dhanya Nagasundaram Published 2 Nov 2026, 12:28 PM IST Prefer Livemint on Google Ramkrishna Forgings shares surged 10% on Monday, 2 November, after the company reported a strong turnaround in its September quarter performance, posting a consolidated net profit of \u20b9 70.59 crore in Q2 FY27 against a loss of \u20b9 9.5 crore in the corresponding quarter last year.\n\nThe Kolkata-headquartered forged metal products manufacturer reported a sharp increase in revenue from operations, which rose to \u20b9 1,405.42 crore in the July-September quarter from \u20b9 907.53 crore a year earlier.\n\nEarnings before interest, tax, depreciation and amortisation (EBITDA) more than doubled to \u20b9 256.23 crore in Q2 FY27, compared with \u20b9 122.54 crore in the year-ago period.\n\nFor the first half of FY27, consolidated net profit climbed to \u20b9 117.47 crore from \u20b9 2.29 crore in the corresponding period of the previous financial year. Revenue during the six-month period increased to \u20b9 2,622.09 crore from \u20b9 1,922.79 crore.\n\nCommenting on the performance, Managing Director Naresh Jalan said domestic demand remained healthy during the September quarter, supported by firm commercial vehicle production schedules. Customer activity across key export markets also remained resilient, he added.\n\nLooking ahead, the company is expanding its presence in non-ferrous forgings, including aluminium, titanium, inconel and nimonic grades, targeting high-technology applications in aerospace, robotics and semiconductors, Jalan said.\n\nThe company also said its forged wheels facility near Chennai, established through a joint venture with Titagarh Rail Systems, is nearing the start of commercial production. The facility will enable Ramkrishna Forgings to enter a strategically important product category for Indian Railways and provide an additional long-term growth driver.\n\nRamkrishna Forgings is an integrated manufacturer of rolled, forged, machined and cast products.", "source": "LiveMint Markets", "pub_date_str": "02 Nov 2026, 12:28 PM IST", "pub_date_relative": "50m ago"}, {"title": "How to enjoy Diwali without giving your savings a hangover", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nThe festive season traditionally brings the highest consumer spending among Indian households. A recent report by YouGov and Rukam Capital found that 60% of Gen Z shoppers increase their spending during major festivals, with 25% spending significantly more and 35% somewhat more.\n\nBut the world around us is changing. News of layoffs in the IT sector, muted salary hikes and inflation inching up again warrant a closer look at how households spend and splurge. We spoke to individuals to gauge the mood and to experts on how households should respond.\n\nDiwali is usually when families want to celebrate, buy something new and gift friends and relatives. The festive spirit makes spending part of the occasion. Preeti Zende, a Sebi-registered investment adviser and founder of Apanadhan Financial Services, said people also tend to spend impulsively because of the fear of missing out ( FOMO ) fuelled by social media influencers.\n\nMany people also have extra money in hand through bonuses or variable pay, which can tempt them to treat it as \u201cfree money\u201d for celebrations, said Arindam Banerjee, professor and programme director of the Masters of Applied Finance & Wealth Management at SP Jain School of Global Management.\n\nThe market is designed to reinforce this mood. Retailers, banks and digital platforms all target consumers with offers during this period, lowering their resistance to spending. \u201cCashback, no-cost EMIs, limited-time deals and social pressure all arrive together,\u201d Banerjee said. In a normal year, he added, this may be manageable for a household with a stable income. But this year, households may need to tread more carefully.\n\nIn fact, many households have already begun exercising financial prudence. According to Sachin Taparia, founder and CEO of LocalCircles, urban households are likely to spend an average of \u20b9 20,000 this festive season, down from around \u20b9 45,000 last year.", "source": "LiveMint Money", "pub_date_str": "02 Nov 2026, 12:25 PM IST", "pub_date_relative": "53m ago"}, {"title": "AI is coming to construction sites. But does it make workers safer?", "full_content": "When Shelley Copsey was appointed by the Ontario Teachers' Pension Plan, one of the world's biggest infrastructure investors, her job was to find ways to use technology to solve problems across its portfolio.\n\nShe quickly learned that there were persistent problems facing front-line workers.\n\nFour years later, Copsey is CEO of FYLD, a London-headquartered software company that uses artificial intelligence to support workers in construction, utilities and infrastructure.\n\nIt comes as AI plays an increasingly important role in some of the most physically demanding jobs, from maintaining roads and railways to working on construction sites.\n\nAccording to Copsey, when fieldwork goes wrong, attention usually turns to budgets or cash flow.\n\n\"We always go to the back office and we're like: oh, if we could help them forecast the job better, maybe this wouldn't be a problem,\" she told CNBC. \"I think that what nobody ever did was just sit and say: well, what goes on in those field workers' lives and how do we make the life of the front line easier?\"\n\nFYLD uses AI to predict which permits a project will need, helping workers avoid delays. Previously, workers often arrived at a site without all of the information they needed, Copsey said. The system can also help crews plan around the weather, for example, rescheduling heavy lifting from a day when strong winds are forecast.\n\nWorkers record short videos describing their day's tasks and safety concerns. AI analyzes the information to help workers and managers anticipate potential problems.", "source": "CNBC Top News", "pub_date_str": "02 Nov 2026, 12:25 PM IST", "pub_date_relative": "53m ago"}, {"title": "Sebi backs removal of LTCG for foreign investors: Report", "full_content": "India's markets regulator has recommended the government remove the long-term capital gains (LTCG) tax imposed on foreign investors, two sources with direct knowledge of the matter said, as India looks to galvanise its underachieving equity markets.\n\nThe Securities and Exchange Board of India (SEBI) has also proposed tax relief for domestic mutual fund investors, suggesting they be exempt from LTCG if they are selling existing holdings to invest in new ones, the sources said.\n\nThe recommendations, which come months before the annual federal budget in February, are not binding and a final call rests with the government.\n\nIndia's equity market has lagged emerging market peers over the past two years. Foreign investors have sold a record $31 billion in Indian stocks this year and overseas investments by retail investors have surged as returns have stagnated.\n\nSEBI's recommendations follow scores of meetings held by the regulator with foreign investors over the last two years as selling persisted, putting pressure on the Indian currency.\n\nOne consistent piece of feedback from investors has been the need to change how India taxes them, the sources said.\n\n\"The proposals are aimed at reducing the upfront tax burden on foreign investors,\" one of the two sources said.\n\nThe sources declined to be named as the recommendations, which have not been reported previously, are part of its pre-budget representations and are private.", "source": "LiveMint Markets", "pub_date_str": "02 Nov 2026, 12:22 PM IST", "pub_date_relative": "56m ago"}, {"title": "Tokyo, Chubu Power Price Hit Multi-Year High as Fuel Costs Climb", "full_content": "(Bloomberg) -- Japan\u2019s spot power prices surged at the weekend, with elevated fuel costs driving rates in major electricity-consuming regions Tokyo and Chubu to multi-year highs.\n\nThe next-day spot power price for the Tokyo and Chubu areas, climbed 1.1% and 7.2% on a weekly basis to \u00a536.11 ($0.2)/kWh and \u00a536.29/kWh respectively on Sunday, the highest since September 2022, according to data from Japan Electric Power Exchange. Meanwhile, the nationwide average price was down 8.7% to \u00a530.09/kWh on the same day.\n\nSpot liquefied natural gas prices extended gains to about $34 per million British thermal units on Friday, according to traders, more than triple pre-war levels. LNG flows through the Strait of Hormuz \u2014 a key waterway for global exports \u2014 remain at less than a third of the rate before the conflict began.\n\nAverage household electricity bills in the Tokyo area are projected to reach a record \u00a59,738 in November, driven by rising fuel costs stemming from the conflict in the Middle East. The bill could soon top \u00a510,000 if the current surge in power prices continues, said Hiroyuki Yamaguchi, Executive Vice President of Tokyo Electric Power Co. during an earnings briefing on Friday.\n\nJapan\u2019s fuel-cost adjustment system automatically reflects changes in LNG, crude oil and coal import prices in electricity rates, based on a three-month average.\n\nTensions in the Middle East have escalated since a Pakistani LNG carrier was attacked near the Strait of Hormuz on Friday. This could signal a further prolonging of the waterway\u2019s effective closure, potentially driving fuel costs even higher and adding to pressure on Japanese utilities.\n\nCatch all the Business News , Market News , Breaking News Events, JIO IPO Listing Today LIVE and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.\n\nLog in to our website to save your bookmarks. It'll just take a moment.", "source": "LiveMint Markets", "pub_date_str": "02 Nov 2026, 12:17 PM IST", "pub_date_relative": "1h ago"}, {"title": "Apple Q4 earnings: 5 key things investors will watch", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide Powered By Apple Q4 earnings: 5 key things investors will watch Written by Anupam Nagar , ETMarkets.com | Nov 02, 2026, 12:54:13 PM IST 1 / 8 Apple Q4 earnings: iPhone 18 sales in spotlight Apple will announce its fiscal fourth-quarter 2026 results on Monday, November 2, after the US market closes. Investors will assess early demand for the iPhone 18 Pro lineup, the performance of its Services business and the company's outlook for the holiday quarter. The earnings announcement will also mark the first results presentation under new CEO John Ternus, who succeeded Tim Cook on September 1. (Sources: Yahoo Finance, BigGo Finance)\n\nAnalysts expect Apple to report revenue of around $113.4 billion, compared with $102.46 billion in the year-ago quarter. Earnings per share (EPS) are projected at approximately $2, up from $1.85 a year earlier. The estimates imply revenue growth of around 10.7% and EPS growth of about 8%.\n\niPhone revenue is expected to reach approximately $56.48 billion, representing growth of around 15% year on year. The iPhone 18 Pro and Pro Max went on sale in September, leaving roughly two weeks of sales in the September quarter. Investors will look for evidence that new-device demand can sustain Apple's smartphone growth momentum.\n\nApple's Services division is expected to generate more than $31.58 billion in revenue. The Mac business is forecast to contribute $9.69 billion, while wearables and iPad revenue are estimated at $8.99 billion and $6.83 billion, respectively. Investors will monitor Services growth and profitability for signs of the resilience of Apple's recurring revenue streams.\n\nApple's first foldable smartphone, the iPhone Duo, went up for preorder on October 16 and reached stores on October 23.", "source": "Economic Times Markets", "pub_date_str": "02 Nov 2026, 12:16 PM IST", "pub_date_relative": "1h ago"}, {"title": "India, EU discuss FTA implementation, customs cooperation and market access in Brussels", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a India, EU discuss FTA implementation, customs cooperation and market access in Brussels The Economic Times daily newspaper is available online now. Read Today's Paper India, EU discuss FTA implementation, customs cooperation and market access in Brussels SECTIONS India, EU discuss FTA implementation, customs cooperation and market access in Brussels ANI Last Updated: Nov 02, 2026, 12:15:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India and the European Union engaged in discussions regarding the implementation of their Free Trade Agreement. Commerce Secretary Rajesh Agrawal held meetings with various senior European Commission officials in Brussels, focusing on market access and customs procedures. The FTA is expected to eliminate tariffs on the majority of exports from both regions. Both parties are working towards the proposed signing and full ratification of the agreement.\n\nSome elections matter more than you know: No crop changed in the fields, yet sugar, coffee and soya got cheaper in a day\n\nYou can buy a walkie-talkie online. But can you legally use it?\n\nKYB and KYC: Quick commerce, the Damani premium and what DMart must deliver \u2013 3rd and concluding part\n\nKYC and KYB: Inside Damani\u2019s DMart, the retail chain for the middle class. And stock for the long term? \u2013 Part 2 of 3\n\nWill it be a regulatory nightmare if an exchange lists on its own platform?\n\nKYC and KYB: Inside Damani\u2019s Avenue Supermarts that refuses to charge more \u2013 Part 1 of 3\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "02 Nov 2026, 12:15 PM IST", "pub_date_relative": "1h ago"}, {"title": "Sebi backs removal of LTCG tax for foreign investors: Report", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Sebi backs removal of LTCG tax for foreign investors: Report The Economic Times daily newspaper is available online now. Read Today's Paper Sebi backs removal of LTCG tax for foreign investors: Report SECTIONS Sebi backs removal of LTCG tax for foreign investors: Report Reuters Last Updated: Nov 02, 2026, 12:47:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis To boost foreign investment interest, India's Securities and Exchange Board has put forth a proposal to scrap long-term capital gains tax for foreign investors and extend tax relief to mutual fund investors. This move is designed to counteract the high capital gains taxes and transaction costs faced rice Bluestone Jewellery and Lifestyle Share Price The Economic Times daily newspaper is available online now. Read Today's Paper PC Jeweller shares drop 4% after Sebi sends warning letters to MD, company secretary. Here's why SECTIONS PC Jeweller shares drop 4% after Sebi sends warning letters to MD, company secretary. Here's why By Debaroti Adhikary , ETMarkets.com Last Updated: Nov 02, 2026, 11:47:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis PC Jeweller shares fell over 4% after Sebi issued warning letters to two senior executives for failing to maintain a structured digital database linked to a 2025 business update. The company said the warnings would have no financial or operational impact.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "02 Nov 2026, 11:47 AM IST", "pub_date_relative": "1h ago"}, {"title": "Car loan calculator: What will a \u20b910 lakh loan cost over 3, 5 and 7 years? Full calculations", "full_content": "A well-planned loan can make buying a new car more affordable and enjoyable. When taking a car loan, focus on the repayment tenure, the monthly EMI and the total outlay, since each affects the overall cost of borrowing.\n\nWithout proper planning, however, a car loan can become hard to manage later. Responsible borrowing and careful management of the loan are essential.\n\nIf you are planning a \u20b9 10 lakh car loan , compare repayment tenures, actual loan offers (not just headline interest rates), and the lender's credibility.\n\nThese factors, when kept in check, can go a long way toward striking the right balance between monthly affordability and the overall cost of the loan and its management.\n\nAccording to Paisabazaar data, car loan interest rates at major banks and lenders ranged from 7.55% to 14.30% per annum as of 27 October 2026.\n\nHere is what a \u20b9 10 lakh car loan could cost over different repayment periods at these rates. The actual tenure and rate depend on the applicant\u2019s repayment capacity, credit score and existing debt. The calculations consider only the interest rate range and exclude processing fees and other charges, which vary by lender.\n\nNote: These are illustrative calculations based on a \u20b9 10 lakh loan at annual interest rates of 7.55% and 14.30%, using the monthly reducing balance method. In each range, the first figure represents the EMI, interest outgo or repayment amount at 7.55%, while the second represents the corresponding amount at 14.30%. Processing fees and other charges are excluded.\n\nThe calculations show how rates and tenure shape the final cost, and the clear trade-off between a lower EMI and higher interest.", "source": "LiveMint Money", "pub_date_str": "02 Nov 2026, 11:46 AM IST", "pub_date_relative": "1h ago"}, {"title": "Welspun Living shares: Up 80% in 6 months, rise 10% today post Q2 results; buy, sell or hold? What brokerages suggest", "full_content": "BSE ALPHA Dhanya Nagasundaram Published 2 Nov 2026, 11:45 AM IST Prefer Livemint on Google Welspun Living shares jumped over 10% on Monday, 2 November, after the home textiles major reported a multi-fold increase in its consolidated net profit for the September quarter of FY27.\n\nThe company posted a consolidated net profit of \u20b9 169.66 crore in the July-September quarter, compared with \u20b9 14.86 crore in the corresponding period last year, according to a regulatory filing.\n\nRevenue from operations rose 12.3% year-on-year to \u20b9 2,838.12 crore in Q2 FY27, from \u20b9 2,440.91 crore a year earlier. Total expenses increased 8.42% to \u20b9 2,636.77 crore.\n\nSegment-wise, revenue from the Home Textiles business grew 15.82% year-on-year to \u20b9 2,689.02 crore, while the Flooring segment reported a 19.3% increase to \u20b9 216.23 crore.\n\nThe company's total income rose 16.86% to \u20b9 2,869.90 crore during the quarter.\n\nFor the first half of FY27, Welspun Living's consolidated income from operations stood at \u20b9 5,698 crore, marking a 20.21% year-on-year increase.\n\nCommenting on the performance, Managing Director and CEO Dipali Goenka said the company delivered another quarter of robust growth, with revenue increasing 16.9% year-on-year and EBITDA margin expanding to 12.9%.\n\nShe attributed the broad-based growth to the resilience of the company's business model and its ability to deliver profitable growth through disciplined execution amid an evolving global operating environment.", "source": "LiveMint Markets", "pub_date_str": "02 Nov 2026, 11:45 AM IST", "pub_date_relative": "1h ago"}, {"title": "Rs 5,000 SIP At 25 Vs Rs 15,000 At 35: Who Could Have More Money At 60?", "full_content": "A simple way to build wealth, SIPs work by benefitting from rupee cost averaging and the power of compounding.", "source": "NDTV Profit", "pub_date_str": "02 Nov 2026, 11:45 AM IST", "pub_date_relative": "1h ago"}, {"title": "Gold Silver Rates Today Live Updates: Silver gains 2% on MCX, gold trades flat. Check estimates, key levels", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a Live Blog \u203a Gold Silver Rates Today Live Updates: Silver gains 2% on MCX, gold trades flat. Check estimates, key levels LIVE BLOG Gold Silver Rates Today Live Updates: Silver gains 2% on MCX, gold trades flat. Check estimates, key levels 02 Nov 2026 | 01:15:34 PM IST MCX Gold Silver City-wise Price Live Synopsis Gold rate today Live Updates: Gold and silver prices trade higher on MCX ahead of Diwali, even as persistent US inflation and expectations of a Federal Reserve rate hike threaten bullion\u2019s appeal.\n\nComments are moderated and will be allowed if they are about the topic and not abusive.\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Markets", "pub_date_str": "02 Nov 2026, 11:44 AM IST", "pub_date_relative": "1h ago"}, {"title": "HPCL vs BPCL, IOCL vs ONGC: Which OMC stock to buy as $110/bbl crude oil price becomes a new nornal? Experts' views", "full_content": "ONGC OIL Asit Manohar Updated 2 Nov 2026, 11:53 AM IST Prefer Livemint on Google HPCL vs BPCL , IOCL vs ONGC : Amid crude oil prices sustaining at elevated levels and $110/bbl becoming the new normal for the most-traded commodity on the MCX, stock investors are advised to devise their strategy and zero in on oil stocks that will be less affected by the change in the normal crude oil price due to the prolonged US-Iran war and closure of the Strait of Hormuz.\n\nAccording to stock market investors, stock investors need to shift focus from oil marketing companies to oil exploration companies, because Oil Exploration and Production (E&P) companies are getting the benefit of the rise in the crude oil and diesel oil price gap in the international market due to the disruption in crude oil supply post-US-Iran war.\n\nDecoding the new crude oil price normal and its impact on the oil companies in India, Seema Srivastava, Senior Research Analyst at SMC Global Securities, said, \u201cCrude oil prices have been sustaining at elevated levels, and there seems to be no solution to the Strait of Hormuz disruption. In such a scenario, $110 per barrel has become the new normal for international crude oil prices, and investors need to devise their investment plans keeping this factor in mind until there is an end to the US-Iran war and a solution to the Strait of Hormuz re-opening.\u201d\n\nHighlighting the investment plan regarding oil stocks in the wake of the new normal of crude oil prices, Avinash Gorakshkar, Founder of Avinash Mentor Research, said, \u201cOne should shift focus from oil marketing companies to oil exploration companies (E&P), as they are reaping the benefit of rise in the price gap between the crude oil price and diesel prices in the international market after the outbreak of the US-Iran war.\u201d\n\nGorakshkar said that the crude oil price was at $70 per barrel when the US-Iran war began, and the diesel price was at $108 per barrel.", "source": "LiveMint Markets", "pub_date_str": "02 Nov 2026, 11:41 AM IST", "pub_date_relative": "1h ago"}, {"title": "BOJ signals December rate hike, but path beyond 1.5% remains uncertain", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a BOJ signals December rate hike, but path beyond 1.5% remains uncertain Powered By The Economic Times daily newspaper is available online now. Read Today's Paper BOJ signals December rate hike, but path beyond 1.5% remains uncertain SECTIONS BOJ signals December rate hike, but path beyond 1.5% remains uncertain By Anupam Nagar , ETMarkets.com Last Updated: Nov 02, 2026, 11:37:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Bank of Japan has strengthened signals of a possible December rate hike as inflation remains above target. However, uncertainty over Japan\u2019s neutral interest rate and the impact of higher borrowing costs leaves the central bank\u2019s longer-term tightening path unclear.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "02 Nov 2026, 11:37 AM IST", "pub_date_relative": "1h ago"}, {"title": "South Korea targets 'world's highest performance' sovereign AI model in record new budget", "full_content": "South Korean President Lee Jae Myung unveiled the country's largest ever budget on Monday, pledging to \"boldly invest in AI and future growth engines.\"\n\nSpeaking to the National Assembly on Monday, Lee said total spending for 2027 would rise 12.8% to 820.9 trillion won ($610.14 billion), including 21.3 trillion won for semiconductors, physical AI and AI data centers \u2014 nearly double the 2026 level.\n\nA separate 4.7 trillion won will go toward developing a sovereign AI model with what Lee described as the \"world's highest performance.\"\n\nThe government also plans to invest heavily into talent, including training 2,000 specialists to \"lead semiconductor design and the regional semiconductor industry,\" while expanding AI education for students, job seekers and existing workers.\n\nSouth Korea has set up university \"contract departments,\" where students can enroll in company-linked degrees that offer pathways to jobs at firms like Samsung Electronics and SK Hynix before graduation.\n\nCompanies help design courses, provide financial support and recruit qualifying graduates.\n\nThe record spending plan comes as the International Monetary Fund forecasts South Korea's economy will grow 3.3% in 2026, its fastest pace since the post pandemic rebound in 2021.\n\nLee said the higher spending would result in \"virtually no net increase in government debt,\" with newly issued bonds used to repay existing debt.", "source": "CNBC World Economy", "pub_date_str": "02 Nov 2026, 11:32 AM IST", "pub_date_relative": "1h ago"}, {"title": "What data centre construction delays mean for debt holders", "full_content": "Boom?", "source": "FT Markets", "pub_date_str": "02 Nov 2026, 11:30 AM IST", "pub_date_relative": "1h ago"}, {"title": "The biggest-ever hedge fund spinout", "full_content": "Plus, insurers stay bullish on private markets, Binance suffers $6.3bn heist, and \u2018The Magic Flute\u2019 at New York\u2019s Metropolitan Opera", "source": "FT Markets", "pub_date_str": "02 Nov 2026, 11:30 AM IST", "pub_date_relative": "1h ago"}, {"title": "Sun Pharma Brokerage Review: Citi, HSBC Maintain Buy; BofA Retains Underperform", "full_content": "Ilumya's US sales challenges, higher R&D spending, and the growth prospects of Leqselvi and Unloxcyt remain key factors shaping brokerage views on Sun Pharma.", "source": "NDTV Profit", "pub_date_str": "02 Nov 2026, 11:22 AM IST", "pub_date_relative": "1h ago"}, {"title": "Interim Q2 Review: Strongest Earnings Growth In 12 Quarters As BFSI, Metals Drive Outperformance, Says Motilal Oswal", "full_content": "Earnings of the 35 Nifty companies that have declared results so far have grown 22% YoY, led by RIL, JSW Steel, ICICI Bank, Coal India, and Axis Bank.", "source": "NDTV Profit", "pub_date_str": "02 Nov 2026, 11:18 AM IST", "pub_date_relative": "2h ago"}, {"title": "India factory growth slows in October, export orders jump, PMI shows", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Indicators \u203a India factory growth slows in October, export orders jump, PMI shows The Economic Times daily newspaper is available online now. Read Today's Paper India factory growth slows in October, export orders jump, PMI shows SECTIONS India factory growth slows in October, export orders jump, PMI shows Reuters Last Updated: Nov 02, 2026, 11:53:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India's manufacturing growth slowed in October, with the HSBC Manufacturing PMI falling to 54.7 from 55.1 in September, as domestic demand and hiring weakened. However, export orders rose at their fastest pace in six months, providing some support to factory activity.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\nSome elections matter more than you know: No crop changed in the fields, yet sugar, coffee and soya got cheaper in a day\n\nYou can buy a walkie-talkie online. But can you legally use it?\n\nKYB and KYC: Quick commerce, the Damani premium and what DMart must deliver \u2013 3rd and concluding part\n\nKYC and KYB: Inside Damani\u2019s DMart, the retail chain for the middle class. And stock for the long term? \u2013 Part 2 of 3\n\nWill it be a regulatory nightmare if an exchange lists on its own platform?\n\nKYC and KYB: Inside Damani\u2019s Avenue Supermarts that refuses to charge more \u2013 Part 1 of 3", "source": "Economic Times Economy", "pub_date_str": "02 Nov 2026, 11:18 AM IST", "pub_date_relative": "2h ago"}, {"title": "Hong Kong Chip IPOs Tap Intertwined Investors, Boss\u2019s Networks", "full_content": "(Bloomberg) -- Hong Kong listing hopefuls are shedding light on the inner workings of their initial public offerings, revealing cross-investments and personal connections, just as regulators step up scrutiny of structures that risk distorting the market.\n\nThe unusual level of detail was on display Friday in the prospectus of Hosin Electronics Co., a Chinese memory product maker seeking to raise HK$1.22 billion ($156 million) in an IPO. The company disclosed that a circle of corporate allies and personal acquaintances are among its cornerstone investors \u2014 which receive guaranteed allocations in exchange for agreeing to hold the stock for a certain period \u2014 who agreed to absorb as much as 42% of the offering.\n\nThe Hosin backers include smartphone maker Shenzhen Transsion Holdings Co. and chip supplier Shenzhen Longsys Electronics Co. Hosin disclosed that it had also served as a cornerstone backer for both companies\u2019 own Hong Kong listings this year. While Hosin stated that the deals weren\u2019t \u201cinter-conditional,\u201d the dynamic illustrates how industry partners at times become involved in each other\u2019s deals. Hosin\u2019s filing also details how it was introduced to other wealthy investors through acquaintances and industry meetups.\n\nThe additional disclosures are among the first since Hong Kong regulators started ramping up scrutiny of the city\u2019s booming IPO market to boost transparency and improve the quality of listings. In mid-October, they asked IPO banks to look more closely into potential connections between investors and listing applicants, and to avoid arrangements that could paint an inaccurate picture of buyer demand.\n\nThere\u2019s no indication of anything untoward in the type of cross-investment detailed in the Friday filings. Business partners and close allies have long been part of the Hong Kong IPO scene, and there have been similar cases where companies invested in each other\u2019s listings.", "source": "LiveMint Markets", "pub_date_str": "02 Nov 2026, 11:18 AM IST", "pub_date_relative": "2h ago"}, {"title": "Rs 15,000 A Day From Maggi! Rohtang Pass Seller's Off-Season Earnings Will Stun You", "full_content": "Transporting supplies from Manali costs around Rs 2,000, while vendors face additional expenses for raw materials, gas cylinders, drinking water, disposable plates and other essentials.", "source": "NDTV Profit", "pub_date_str": "02 Nov 2026, 11:16 AM IST", "pub_date_relative": "2h ago"}, {"title": "South Korean shares rebound as strong exports spur dip-buying", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a South Korean shares rebound as strong exports spur dip-buying Powered By The Economic Times daily newspaper is available online now. Read Today's Paper South Korean shares rebound as strong exports spur dip-buying SECTIONS South Korean shares rebound as strong exports spur dip-buying By Anupam Nagar , ETMarkets.com Last Updated: Nov 02, 2026, 11:14:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis South Korean shares rose after early losses due to strong export data that improved investor sentiment. Exports from South Korea nearly doubled in October, marking their highest increase in over 50 years. Analysts indicated that this performance might lead to upward revisions in corporate earnings forecasts. However, factory activity in South Korea expanded at its slowest pace in eight months.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "02 Nov 2026, 11:14 AM IST", "pub_date_relative": "2h ago"}], "cfa": [{"title": "Stock futures rebound ahead of busy week of earnings, jobs data and the midterm elections: Live updates", "full_content": "Stock futures moved higher early Monday after a losing week on Wall Street as investors braced for a packed week of earnings results, jobs reports and the upcoming midterm elections.\n\nS&P 500 futures traded up 0.5%, while Nasdaq-100 futures gained 0.9%. Futures linked to the Dow Jones Industrial Average added 186 points, or 0.4%.\n\nThe moves come after the three major averages suffered a losing week, bogged down by selling pressure in tech as investors continued to scrutinize names related to the artificial intelligence buildout. The S&P 500 and Dow Jones Industrial Average each fell less than 1% on the week, while the Nasdaq Composite dropped 2%.\n\nIn Asia, Japan's Nikkei 225 gained 0.33% to 63,081.86, while South Korea's Kospi led gains with a 2.38% rise to 5,859.08.\n\nAustralia's benchmark S&P/ASX 200 was 0.53% lower. Hong Kong's Hang Seng index gained 0.44% in its last hour of trade, while mainland China's CSI 300 added 0.79%.\n\nThe week got off to a good start after Anthropic publicly filed for an IPO , which boosted AI-linked stocks. However, selling pressure resumed later in the week amid signs that capex spending could be abating after both Alphabet and Microsoft posted lower-than-expected capex forecasts . Amazon also left its full-year capex guidance unchanged .\n\nStill, 3Fourteen Research's Warren Pies isn't too concerned, pointing to a ramp-up in forward earnings estimates and adding that \"there's a lot to like\" about Anthropic's S-1 filing.\n\n\"I just don't see anything broken with the AI trade fundamentally,\" he said on CNBC's \"Closing Bell Overtime\" on Friday. \"Technicals are another story.\"", "source": "CNBC Top News", "pub_date_str": "02 Nov 2026, 01:16 PM IST", "pub_date_relative": "2m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Derivatives", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Deutsche Bank downgrades Novartis stock rating to sell on valuation", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Nov 2026, 01:10 PM IST", "pub_date_relative": "8m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Earnings call transcript: Crizac Q2 2026 revenue drops 37% as stock slips", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Nov 2026, 01:10 PM IST", "pub_date_relative": "8m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Kosmos Energy earnings missed by $0.03, revenue fell short of estimates", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Nov 2026, 01:09 PM IST", "pub_date_relative": "9m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Ganesha Ecosphere Q2 FY27 slides: revenue surges, margins compress", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Nov 2026, 01:08 PM IST", "pub_date_relative": "10m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Muthoot\u2019s solid gold loan AUM loses sheen amid asset quality stress, stiff competition", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nMuthoot Finance shares slid to a new 52-week low of \u20b9 2,305 on the National Stock Exchange on Monday as investors tried to digest the asset quality deterioration in the September quarter (Q2FY27) with rising loan delinquencies. This was when its mainstay gold loan assets under management (AUM) increased by 43% year-on-year, backed by higher prices, improved tonnage and client additions.\n\nBetter yields led to a 152 basis points (bps) sequential rise in net interest margin (NIM) to 11.93%. On the flip side, credit costs increased, with risky stage-III assets soaring sequentially to \u20b9 7,268 crore in Q2 from \u20b9 3,926.5 crore in Q1, and stage-II assets surging to \u20b9 23,466 crore from \u20b9 1,876 crore in Q1 and \u20b9 1,062 crore in Q4FY26.\n\nFollowing implementation of the Reserve Bank of India\u2019s revised regulations effective 1 April, Muthoot introduced structured monthly interest-servicing gold loan schemes. Earlier, it offered bullet repayment loans, wherein customers could pay interest at any point during the loan tenure without any prepayment penalty.\n\nThis transition led to missed payments and consequently, a sharp movement into stage-II and stage-III buckets. As customers get accustomed to the new repayment cycle, the management expects asset quality stress to ease. It doesn\u2019t view this spike as an indication of underlying borrower stress.\n\nBut a pivot toward monthly interest repayment, which necessitates higher collection efforts, raises the risk of a structural compression in yields and NIM for NBFC gold financers.", "source": "LiveMint Markets", "pub_date_str": "02 Nov 2026, 01:07 PM IST", "pub_date_relative": "11m ago", "cfa_topics": ["Equity Investments", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "MCX Gold vs MCX Silver rates today, 2 Nov: Check how precious metals are performing on Monday amid Sensex, Nifty surge", "full_content": "Domestic gold and silver futures traded higher on Monday, 2 November, as investors tracked global commodity markets ahead of the closely watched US midterm elections, which could shape global geopolitics over the next few years.\n\nSilver outperformed gold in percentage terms during the morning session, though both metals remain highly volatile and vulnerable to geopolitical developments.\n\nIndian equities, meanwhile, staged a strong recovery. The Nifty 50 reclaimed the 23,000 level and was trading 1.13%, or 260 points, higher at 23,313.95 at 11:42 AM.\n\nAs of 11:59 AM, MCX gold futures were trading at \u20b9 1,39,112 per 10 grams, up \u20b9 627, or 0.42%, from the previous close of \u20b9 1,38,485. The contract opened at \u20b9 1,39,003 and touched a high of \u20b9 1,39,179.\n\nSilver futures were trading at \u20b9 1,81,999 per kg, up \u20b9 2,867, or 1.57%, from the previous close of \u20b9 1,79,132. The contract opened at \u20b9 1,81,094 and touched an intraday high of \u20b9 1,82,701.\n\nSilver\u2019s sharper rise points to stronger momentum in the morning session, but one session does not make a trend. Gold and silver prices have stayed volatile over the past few months amid ongoing geopolitical developments.\n\nEquity markets also opened higher. The BSE Sensex was trading 1.17% higher at 75,355.37 at 12:04 PM, after opening at 75,178.24, while the NSE Nifty 50 was up 1.09% at 23,304.35, after opening at 23,222.30.\n\nSentiment was supported by the upcoming US midterm elections , hopes of lower crude oil prices, expectations of progress in talks to end the US-Iran conflict, and strong corporate earnings.", "source": "LiveMint Money", "pub_date_str": "02 Nov 2026, 01:06 PM IST", "pub_date_relative": "12m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Derivatives", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Earnings call transcript: Ganesha Ecosphere posts strong Q2 2026 growth", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Nov 2026, 12:57 PM IST", "pub_date_relative": "21m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Coal India shares jump 4% after firm records highest-ever monthly coal supplies in October", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Coal India shares jump 4% after firm records highest-ever monthly coal supplies in October Coal India Share Price NMDC Share Price KIOCL Share Price Gujarat Mineral Development Corporation Share Price Sandur Manganese & Iron Ores Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Coal India shares jump 4% after firm records highest-ever monthly coal supplies in October SECTIONS Coal India shares jump 4% after firm records highest-ever monthly coal supplies in October By Debaroti Adhikary , ETMarkets.com Last Updated: Nov 02, 2026, 12:57:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Coal India shares jumped more than 4% after the state-run miner reported record monthly coal production and supplies in October. Total supplies crossed 70 million tonnes for the first time, while deliveries to the power sector reached an all-time high of 57.1 million tonnes.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "02 Nov 2026, 12:57 PM IST", "pub_date_relative": "22m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Marine sniper turned macro strategist says this bull market has six to 12 months left. Here\u2019s his playbook.", "full_content": "Alex Barrow, founder of Macro Ops, says the bull market is on borrowed time and will ratchet back painfully for investors who aren\u2019t prepared.", "source": "MarketWatch Top Stories", "pub_date_str": "02 Nov 2026, 12:55 PM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Why investors may be ready to return to large-cap stocks", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nMutual fund investing has rarely followed a more inverted pattern than it does today. Capital has persistently chased small-cap and mid-cap funds, with money flowing largely one way into these categories through lump-sum investments. Investors have shunned bluechip-heavy large-cap funds, while incremental growth in the SIP book has also come largely from small-cap and mid-cap categories. The prevailing belief was that large-caps could no longer deliver the growth potential of these emerging categories.\n\nStrong inflows certainly helped small- and mid-cap stocks show strength and resilience for several quarters. However, two factors have changed the picture in recent months: a sharp spike in commodity prices and the significant valuation premium at which these market favourites trade relative to the rest of the market.\n\nDiscerning investors have begun trimming positions in overvalued stocks, while selling pressure is rising rapidly in companies that show even the slightest disappointment in quarterly results. Investors are also factoring in the impact of sustained commodity inflation on future demand, sales growth and margins.\n\nAt the same time, the sharp contraction in large-cap valuations has significantly widened the gap between these companies and the market's favourites. This has made investors more conscious of the relative attractiveness of large-caps, given their discount to historical valuations, strong ability to revive growth and superior balance sheets. These companies also have the capacity to reduce their capital base through share buybacks.\n\nThe prospect of management teams initiating buybacks, even amid investor apathy, is real. We are also seeing preferential issues in which promoters are buying shares in bluechips. Bajaj Finance is a prime example.", "source": "LiveMint Money", "pub_date_str": "02 Nov 2026, 12:52 PM IST", "pub_date_relative": "26m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Pizza Hut, KFC India operator's Q2 loss naarrows sharply on strong same-store sales growth", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a Earnings \u203a Pizza Hut, KFC India operator's Q2 loss naarrows sharply on strong same-store sales growth Devyani International Share Price
