<script>
    // This variable will be injected during the build process
    const allData = {"general": [{"title": "IRS announces new federal income tax brackets for 2027", "full_content": "The IRS has announced new federal income tax brackets and standard deductions for 2027.\n\nIn its announcement Thursday, the agency raised the income thresholds for each bracket, which apply to tax year 2027 for returns filed in 2028.\n\nThe IRS also increased figures for other key provisions, including long-term capital gains brackets, the estate and gift tax exemption , and eligibility for the earned income tax credit, among others.\n\nFor 2027, the top rate of 37% applies to individuals with taxable income above $661,375 and married couples filing jointly earning $793,650 or more.\n\nFederal income tax brackets show how much you owe on each part of your taxable income, which you calculate by subtracting the greater of the standard or itemized deductions from your adjusted gross income.\n\nThe standard deduction will also increase in 2027, rising to $33,200 for married couples filing jointly, up from $32,200 in 2026. Starting in 2027, single filers can claim $16,600, a bump up from $16,100.\n\nThe new tax brackets come as Americans wrestle with affordability issues amid the rising cost of housing , groceries , gasoline and other living expenses.\n\nThe consumer price index climbed 3.7% in September 2026 from one year earlier, up from a yearly pace of 3.4% in August, the Bureau of Labor Statistics reported in October.", "source": "CNBC Top News", "pub_date_str": "06 Nov 2026, 02:07 AM IST", "pub_date_relative": "7m ago"}, {"title": "Dow tumbles 1,800 points, erasing its postelection rally; Nasdaq plummets 5%: Live updates", "full_content": "Stocks plummeted on Thursday, erasing the sharp gains from the rally seen in the wake of the U.S. midterm elections , as investors accelerated their move away from technology stocks on fears of a data-center buildout slowdown.\n\nThe Nasdaq Composite declined 5.4% and dipped into correction territory, trading more than 10% below a record set last month. The S&P 500 was down 4.3%, heading for its worst day since April 2025. The Dow Jones Industrial Average shed 1,844 points, or 3.7%. The Dow erased about all of its advance from Wednesday's massive postelection rally. The small-cap Russell 2000 index decreased 4.4% and also entered a correction.\n\nNasdaq Composite, 5-day Stocks related to the artificial intelligence trade, particularly those linked to the chips industry and data centers, slid for a second day. Investors fear that a Democratic sweep of both chambers of Congress as well as victories in key gubernatorial races could decelerate the data center buildout .\n\nFor instance, Sen. Bernie Sanders of Vermont \u2014 who caucuses with Democrats \u2014 has called for a national data center moratorium. In a post on X Wednesday evening, Sanders wrote that \"Americans don't want Big Tech oligarchs wrecking the environment, gutting jobs and threatening humanity's future.\"\n\nChipmakers Broadcom and Nvidia each fell 9% Thursday, while software stock Oracle moved lower by 7%. Another chip stock, Qualcomm , reported earnings that beat estimates , but the stock dropped 10% on a weaker-than-expected earnings outlook.", "source": "CNBC Top News", "pub_date_str": "06 Nov 2026, 02:07 AM IST", "pub_date_relative": "7m ago"}, {"title": "The 2027 tax brackets are out. See what the standard deduction and SALT tax breaks will be.", "full_content": "The tax brackets at the heart of Americans\u2019 income-tax bills will be adjusting at a steeper level in 2027 compared to this year, underscoring inflation\u2019s rekindled presence.", "source": "MarketWatch Top Stories", "pub_date_str": "06 Nov 2026, 01:52 AM IST", "pub_date_relative": "22m ago"}, {"title": "Cisco Systems options suggest 7.9% stock move on earnings", "full_content": "", "source": "Investing.com News", "pub_date_str": "06 Nov 2026, 01:51 AM IST", "pub_date_relative": "22m ago"}, {"title": "Bloom Energy\u2019s stock is one of the S&P 500\u2019s biggest losers amid fears of data-center delays", "full_content": "Bloom Energy shares got swept in by tech stocks\u2019 sharp selloff Thursday, as investors fretted that the data-center buildout was at risk of stalling in the aftermath of the U.S. midterm elections.", "source": "MarketWatch Top Stories", "pub_date_str": "06 Nov 2026, 01:51 AM IST", "pub_date_relative": "23m ago"}, {"title": "Coherent earnings analysis: questions answered and next catalysts", "full_content": "", "source": "Investing.com News", "pub_date_str": "06 Nov 2026, 01:49 AM IST", "pub_date_relative": "25m ago"}, {"title": "Brent crude jumps, settles up over $3 after tanker attacks", "full_content": "", "source": "Investing.com News", "pub_date_str": "06 Nov 2026, 01:48 AM IST", "pub_date_relative": "26m ago"}, {"title": "Dlocal shares may move 12% on Nov. 12 earnings release", "full_content": "", "source": "Investing.com News", "pub_date_str": "06 Nov 2026, 01:48 AM IST", "pub_date_relative": "26m ago"}, {"title": "Dollar little changed as oil prices bounce, payrolls eyed", "full_content": "", "source": "Investing.com News", "pub_date_str": "06 Nov 2026, 01:48 AM IST", "pub_date_relative": "26m ago"}, {"title": "Top Democrats call to rein in AI buildout after midterms sweep: 'National data center moratorium now'", "full_content": "After a big win in the U.S. midterm elections on Tuesday, some Democrats are already signaling they want to take on the artificial build-out, specifically data centers.\n\nIn a post on X , Sen. Bernie Sanders, I-Vt., touted referendums across the U.S. on Tuesday where voters in localities approved restrictions on data centers . Sanders, who caucuses with the Democrats, said the message to political leaders is clear.\n\n\"National data center moratorium now,\" he wrote in the post. \"Americans don't want Big Tech oligarchs wrecking the environment, gutting jobs and threatening humanity's future.\"\n\nIn another post on X, Rep. Yassamin Ansari, D-Ariz., wrote that pausing AI development needs to be a top priority for the large Democratic majority in the House on Day 1. Rep. Greg Casar, D-Texas, the chair of the Congressional Progressive Caucus, amplified the post and said, \"Yes!\"\n\nAccording to the CNBC Voter Poll , 56% of voters said AI and data centers were a crucial or major factor in their decision at the ballot box. Of those voters, 65% said they cast a ballot for a Democratic candidate for Congress.\n\nStocks linked to the artificial intelligence build-out declined slightly on Wednesday in the wake of the election, but the selling intensified on Thursday as investors worried Democratic wins could have a real impact on data center construction. Chip stocks led the decline. The iShares Semiconductor ETF (SOXX) tumbled nearly 9% on Tuesday. Nvidia declined 8%, while Advanced Micro Devices sunk more than 14%.\n\nDemocrats who flipped critical races on Tuesday also singled out big tech companies and data centers.\n\nSouth Carolina Democrat Annie Andrews, who flipped a Senate seat in the state on Tuesday, launched a website during the campaign that branded her opponent \u2014 Sen. Darline Graham \u2014 \"data center Darline.\"", "source": "CNBC Finance", "pub_date_str": "06 Nov 2026, 01:47 AM IST", "pub_date_relative": "27m ago"}, {"title": "Why is Hertz stock crashing today?", "full_content": "", "source": "Investing.com News", "pub_date_str": "06 Nov 2026, 01:46 AM IST", "pub_date_relative": "28m ago"}, {"title": "Teekay Corp. stock may move 5.9% on upcoming earnings report", "full_content": "", "source": "Investing.com News", "pub_date_str": "06 Nov 2026, 01:45 AM IST", "pub_date_relative": "29m ago"}, {"title": "Truist raises Palomar Holdings stock price target on earnings growth", "full_content": "", "source": "Investing.com News", "pub_date_str": "06 Nov 2026, 01:44 AM IST", "pub_date_relative": "29m ago"}, {"title": "AI meltdown: Chip stocks and neoclouds plunge, pushing Nasdaq to worst day since April 2025", "full_content": "Chipmakers plummeted on Thursday, with Nvidia pushing the Nasdaq toward its worst day in 19 months, after this week's midterm election results raised concerns on Wall Street that the artificial intelligence buildout is poised to slow down. Neoclouds like CoreWeave tumbled for a second straight day.\n\nQualcomm contributed to the selloff after issuing a disappointing earnings forecast for the current quarter. Qualcomm and Nvidia both dropped about 8%.\n\nThe environment has gone from bad to worse for companies intimately tied to AI infrastructure, as the combination of rising interest rates, ballooning capital needs and the Democratic sweep in Congress has led to increased fears that wide swaths of the market are going to be weighed down by too much debt and too little revenue.\n\n\"The technology is still going to continue on in terms of its development, but if there is a slowdown in the actual development and the buildings and the infrastructure and so forth, that's what stocks are going to trade off,\" said Peter Boockvar, chief investment officer at OnePoint BFG Wealth Partners, in an interview with CNBC's \"Squawk on the Street.\"\n\nAdvanced Micro Devices , Micron and Applied Materials all suffered double-digit percentage losses on Thursday. Elon Musk , who contributed hundreds of millions of dollars to try and get Republicans elected in Texas and elsewhere, saw shares of his public companies, SpaceX and Tesla , tumble 7% and 10%, respectively.\n\nIn Tuesday's election, the states with the most ambitious AI data center plans all turned blue. Democrats won key contests for governor and the Senate in Texas and Ohio, while also coming up victorious in the gubernatorial race in Georgia, where Democratic Sen. Jon Ossoff also cruised to reelection.\n\nThere were 41 local ballot measures in 10 states up for a vote on Tuesday that would place restrictions on the construction of data centers in different ways, according to Ballotpedia .", "source": "CNBC World Economy", "pub_date_str": "06 Nov 2026, 01:38 AM IST", "pub_date_relative": "35m ago"}, {"title": "How Wall Street's postelection rally got obliterated \u2014 and what's next", "full_content": "Every weekday, the Investing Club releases the Homestretch; an actionable afternoon update just in time for the last hour of trading.", "source": "CNBC Top News", "pub_date_str": "06 Nov 2026, 01:36 AM IST", "pub_date_relative": "38m ago"}, {"title": "Treasuries Soar as Tech-Stock Selloff Lures Investors to Havens", "full_content": "(Bloomberg) -- Treasuries rose as a Democratic sweep in the US midterms led to a selloff in shares of large US technology companies, stoking demand for havens.\n\nThe rally in the US government bond market on Thursday sent yields down across maturities by as much as nine basis points to the lowest levels since early September. The yield retreat began after the US stock market opened, with the Nasdaq 100 index falling 4.75% and the Philadelphia Semiconductor Index down 8.83%.\n\nThe Treasury market last month notched its biggest gain in more than two years as investors lost faith in the sustainability of capital spending on artificial-intelligence infrastructure and rotated from stocks to bonds.\n\n\u201cThe fact that chip stocks are falling is an extension of the idea that there may be a pullback in the pace of capex spend,\u201d said Anmol Sinha, fixed income investment director at The Capital Group. \u201cThat\u2019s causing a reaction.\u201d\n\nBeyond haven demand for Treasuries, the prospect of a US economic slowdown resulting from fading enthusiasm for investment in the AI buildout has led to lower expectations for Federal Reserve interest-rate hikes in the coming months.\n\nWhile traders continue to almost fully price in a quarter-point increase when Fed policymakers hold their final vote this year on Dec. 9, Thursday\u2019s activity in short-term interest-rate options included trades targeting no move. Wagers on additional moves next year also were pared Thursday.\n\nIn the Treasury options market, there was strong demand for hedges for additional gains. Standout trades included one anticipating the 10-year yield \u2014 down about four basis points near 4.85% \u2014 could reach 4.7% by the end of next week. Another, expiring Nov. 20, targeted a decline to around 4.35%.\n\n\u201cToday is a risk-off move in our view,\u201d said Gregory Faranello, head of macro strategy at South Street Securities Holdings. \u201cWe are not chasing duration at these levels but respect the price action relative to risk assets for now.\u201d", "source": "LiveMint Markets", "pub_date_str": "06 Nov 2026, 01:33 AM IST", "pub_date_relative": "41m ago"}, {"title": "Stock Market Today: Nasdaq Sinks 5% as Investors Ditch Chip, Data-Center Stocks \u2014 Live Updates - WSJ", "full_content": "Stock Market Today: Nasdaq Sinks 5% as Investors Ditch Chip, Data-Center Stocks \u2014 Live Updates WSJ Stock market today: Nasdaq plunges 5% amid chip stock wipeout, Dow and S&P 500 erase post-election rally gains Yahoo Finance Stocks plunge as midterm results send AI trade into a tailspin CNN US Stock Futures Diverge as Chip Selloff Extends Into Second Day Bloomberg.com Stocks plunge as AI worries crush tech shares NBC News", "source": "Google News Business", "pub_date_str": "06 Nov 2026, 01:26 AM IST", "pub_date_relative": "48m ago"}, {"title": "IRS announces bigger estate and gift tax exemption for 2027", "full_content": "The Internal Revenue Service has announced a higher estate and gift tax exemption for 2027.\n\nIn its announcement Thursday, the agency increased the federal \"basic exclusion amount\" to $15.48 million per person for 2027, up from $15 million in 2026. The exemptions apply to tax-free transfers during life and at death.\n\nThe IRS also increased figures for dozens of other provisions, including federal income tax brackets , the capital gains tax brackets and eligibility for the earned income tax credit, among others.\n\nThe inflation adjustments for 2027 come as Americans wrestle with affordability amid the rising cost of housing, groceries, gasoline and other living expenses.\n\nPresident Donald Trump 's \"big beautiful bill\" increased the estate and gift tax exemption to $15 million per person. Without the change from Congress, the exemption would have reverted to 2017 levels \u2014 $5 million plus an inflation adjustment \u2014 after 2025, which spurred proactive estate planning from ultra-wealthy families before the legislation.\n\nUnder current law, few families are subject to federal estate taxes. For 2026, families will file about 6,890 federal estate tax returns , and roughly 3,900 will be taxable, according to estimates from the Tax Policy Center, a think tank.", "source": "CNBC Top News", "pub_date_str": "06 Nov 2026, 01:24 AM IST", "pub_date_relative": "50m ago"}, {"title": "After tech-stock rout, October jobs report could bring relief \u2014 or more pain", "full_content": "After a tech-led meltdown in the stock market, the October jobs report on Friday morning could bring investors some encouraging news \u2014 or add to their misery.", "source": "MarketWatch Top Stories", "pub_date_str": "06 Nov 2026, 01:16 AM IST", "pub_date_relative": "58m ago"}, {"title": "Three consumer stocks to buy after the midterm elections", "full_content": "Consumer discretionary stocks are gaining momentum following the midterm elections. Here's why Lennar, SharkNinja and Amazon could benefit from the market rotation.", "source": "CNBC Top News", "pub_date_str": "06 Nov 2026, 01:07 AM IST", "pub_date_relative": "1h ago"}, {"title": "This pancreatic cancer treatment is on track for \u2018one of the best drug launches of all time\u2019", "full_content": "Revolution Medicines\u2019 brand-new treatment brought in far higher sales than expected in its first few weeks on the market.", "source": "MarketWatch Top Stories", "pub_date_str": "06 Nov 2026, 01:02 AM IST", "pub_date_relative": "1h ago"}, {"title": "Trump\u2019s Iran war has changed the future of Social Security", "full_content": "It\u2019s a mathematical certainty that the Iran war is going to have an enormous influence on the future of retirement in America.", "source": "MarketWatch Top Stories", "pub_date_str": "06 Nov 2026, 01:02 AM IST", "pub_date_relative": "1h ago"}, {"title": "The \u2018Musk selloff\u2019 deepens as Tesla and SpaceX combine for $450 billion two-day wipeout", "full_content": "Investors worry a divided Washington could derail \u201cElon, Inc.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "06 Nov 2026, 12:59 AM IST", "pub_date_relative": "1h ago"}, {"title": "U.S. warns of 'ongoing cyber threat' to industrial refrigeration systems", "full_content": "The United States is warning of an \"ongoing cyber threat\" to industrial refrigeration systems, saying in a statement issued on Thursday that every organization that depends on cold storage should assume it could fall into the hackers' crosshairs.\n\nThe statement, which follows a spate of hacks against commercial freezers in the United States and Europe, said that unidentified \"malicious cyber actors\" were targeting vulnerabilities in internet-accessible electronic temperature and commercial refrigeration controllers in retail grocery and cold storage facilities.\n\nAlthough short on detail about the hackers involved, the statement suggested that the threat to commercial cold storage was ongoing.\n\n\"If successfully exploited, the actors could change the temperature and possibly cause physical impacts such as fire hazards, loss of inventory and changes to the service life of the system,\" said the statement, which was jointly issued by the FBI, the Cybersecurity and Infrastructure Security Agency and the departments of health, transport and agriculture.\n\n\"Every organization that depends on refrigeration and monitoring systems should assume it could be a target,\" said Chris Butera, CISA's acting executive assistant director for cybersecurity.\n\nFBI Cyber Branch Operations Director Brett Leatherman said that the government was \"seeing these systems targeted across critical infrastructure sectors globally.\"\n\nThe government urged operators of industrial refrigeration control systems to pull their devices off the public internet, isolate them from their corporate networks and promptly apply software updates.\n\nAt least three waves of hacks have hit commercial fridges and freezers in the past few months. Pentagon investigators are treating a series of mysterious malfunctions that hit grocery store refrigeration units on US military bases in August as a cyberattack, Reuters first reported last week.", "source": "CNBC Top News", "pub_date_str": "06 Nov 2026, 12:56 AM IST", "pub_date_relative": "1h ago"}, {"title": "JP Morgan to add Philippines and Saudi Arabia to key EM bond index over 10 months", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a JP Morgan to add Philippines and Saudi Arabia to key EM bond index over 10 months Powered By The Economic Times daily newspaper is available online now. Read Today's Paper JP Morgan to add Philippines and Saudi Arabia to key EM bond index over 10 months SECTIONS JP Morgan to add Philippines and Saudi Arabia to key EM bond index over 10 months Reuters Last Updated: Nov 06, 2026, 12:56:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis JP Morgan has announced plans to include Saudi Arabia and the Philippines in its emerging market debt index starting in 2027. The Saudi riyal-denominated sukuk and Philippine peso-denominated government bonds will be integrated over a ten-month period. The index is expected to adjust the maximum country weight limit from 10% to 9%. Saudi Arabia's weight will reach 2.71%, while the Philippines will have a weight of 1.64%.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "06 Nov 2026, 12:56 AM IST", "pub_date_relative": "1h ago"}, {"title": "The average US 30-year mortgage rate falls to 7.18% this week, its third straight decline", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a The average US 30-year mortgage rate falls to 7.18% this week, its third straight decline Powered By The Economic Times daily newspaper is available online now. Read Today's Paper The average US 30-year mortgage rate falls to 7.18% this week, its third straight decline SECTIONS The average US 30-year mortgage rate falls to 7.18% this week, its third straight decline AP Last Updated: Nov 06, 2026, 01:01:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The average long-term mortgage rates in the U.S. decreased for the third consecutive week, offering some respite. The average 30-year fixed-rate mortgage declined to 7.18% from 7.24%, according to Freddie Mac. Additionally, the 15-year fixed-rate mortgages saw a drop to 6.57%, slightly down from last week. These lower rates help to alleviate the financial burden on prospective homebuyers facing increased costs.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "06 Nov 2026, 12:54 AM IST", "pub_date_relative": "1h ago"}, {"title": "Wall Street's fear gauge surges the most since April. Why traders think it should be even higher", "full_content": "Whether it's a referendum on the midterms or just a continuation of a bear market in semiconductors that dates back to the group's peak in June, one thing's clear from the options action Thursday: few traders saw this coming.\n\nThat's evident in the surge in Cboe Volatility index (VIX) , which jumped as much as 5.7 points to above 28 about 90 minutes after the opening bell on Thursday. It's the highest reading on VIX since March 31, the day after the S&P 500 bottomed after selling off as tensions between Iran, Israel and the U.S. reached fever pitch.\n\nFrom its intraday low to high Thursday, VIX moved more than 11 points, the biggest one-day move since April 9. Yet with the S&P 500 down 3%, there's an argument to be made that volatility should be higher. Traders use a rule of thumb that 16 points for the VIX equate to a 1% move in the index.\n\nThe S&P 500 was headed for its worst decline since April 2025.\n\nCboe Volatility Index, YTD \"My data says to de-risk, but my gut says this is a blowout that could create a dip-buying opportunity\" said Noel Smith, \"I do not see macro stuff causing this, like oil or rates. Those things are relatively unchanged. The tape looks like a liquidation and that's exactly what it is according to what I'm hearing with regards to a hedge fund.\"\n\nLooking at Wednesday's response to the selloff in semiconductors adds a wrinkle for traders that pointed to a too-calm VIX despite Wednesday's tech-stock wreck. With the VanEck Semiconductor ETF down 3%, it was the first day in market history that the VIX concurrently fell more than 4 points, according to data from the X account \"OddStats.\" As of midday, nearly 800,000 calls traded on the VIX, 3.5 times higher than 30-day average, according to Cboe data.", "source": "CNBC Top News", "pub_date_str": "06 Nov 2026, 12:50 AM IST", "pub_date_relative": "1h ago"}, {"title": "SpaceX, Tesla extend losses as midterm results cloud data center, merger outlook - Reuters", "full_content": "SpaceX, Tesla extend losses as midterm results cloud data center, merger outlook Reuters Opinion | Elon Musk\u2019s Very Bad Night The New York Times Musk bet big on keeping Texas red. What happens to his business empire now? CNN Tesla Shares Tumble Again in Deepening Post-Election Slump Bloomberg.com The biggest loser of the 2026 midterms wasn\u2019t Trump. It was Elon Musk. The Boston Globe", "source": "Google News Business", "pub_date_str": "06 Nov 2026, 12:49 AM IST", "pub_date_relative": "1h ago"}, {"title": "US yields fall in choppy session as oil rises and equities sink", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a US yields fall in choppy session as oil rises and equities sink Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US yields fall in choppy session as oil rises and equities sink SECTIONS US yields fall in choppy session as oil rises and equities sink Reuters Last Updated: Nov 06, 2026, 12:54:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis As geopolitical tensions change the landscape, US Treasuries are witnessing a spike in demand while equity markets take a hit and oil prices show volatility. Investors are reassessing their outlook on the US-Iran relations following new election results. The labor market remains resilient with dropping unemployment claims and heightened productivity levels, pointing towards ongoing inflation risk.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "06 Nov 2026, 12:49 AM IST", "pub_date_relative": "1h ago"}, {"title": "Trump's energy deals are about to face a wave of investigations by Democrats", "full_content": "President Donald Trump is expected to face a wave of investigations when Democrats take control of Congress in January. His sweeping deal-making in the energy sector is likely to become a central focus.\n\nDemocrats have pressed the White House for months on the legality of its intervention in Venezuela's oil sector and its cancellation of renewable energy projects funded by the Biden administration. They have raised conflict of interest concerns over numerous deals in the minerals sector.\n\nBut, until now, the opposition party could do little more than send strongly worded letters to administration officials. When the next Congress convenes in January, the Democrats will wield the subpoena power that comes with committee control, giving them the authority to compel testimony and the disclosure of documents.\n\nThe House Energy and Commerce Committee in the next Congress intends to pursue an aggressive oversight agenda to root out corruption, Rep. Frank Pallone, the New Jersey Democrat who will likely chair the panel, said in a statement.\n\nWith comfortable majorities in the House and Senate, Democrats will likely pass a war powers resolution that demands an end to the conflict, which has hiked fuel prices in the U.S. and around the world.\n\nCrude oil prices sold off sharply Wednesday as the market expected the election defeat to push Trump to cut a deal with Iran. Vice President JD Vance blamed the Republican loss directly on the war, raising questions about whether there is support inside the administration to continue the conflict.\n\nHouse Minority Leader Hakeem Jeffries, who will likely take over the House speaker's gavel in January, said Wednesday that Democrats will \"end this reckless and costly war of choice that has skyrocketed gas prices all across the country.\"\n\nThe new Congress will try to rein in the administration by passing legislation to stop the conflict, said Rep. Ted Lieu, vice chairman of the Democratic caucus.", "source": "CNBC Top News", "pub_date_str": "06 Nov 2026, 12:43 AM IST", "pub_date_relative": "1h ago"}, {"title": "Solar stocks rallied on Democratic victories, but policy risks still threaten the group", "full_content": "Solar stocks rallied after Democrats won Congress, but policy, financing and data-center demand remain key risks for First Solar, Sunrun and Enphase.", "source": "CNBC Top News", "pub_date_str": "06 Nov 2026, 12:42 AM IST", "pub_date_relative": "1h ago"}, {"title": "Gathering AI storm clouds doom tech stocks to darkest day in a year", "full_content": "Nov 5 (Reuters) - Big tech stocks slumped Thursday, putting them on track for their biggest decline since the \"Liberation Day\" rout last year, the most significant shakeout yet in what has been a punishing autumn for the AI trade.\n\nThe Nasdaq 100 index was set for market-value declines exceeding $2 trillion on investor fears that the Democratic Party's sweeping midterm victory could stall AI infrastructure expansion and force a chaotic reckoning for smaller firms whose capacity to raise funds has already been limited by higher interest rates and tighter financial conditions.\n\nAnalysts and portfolio managers said declines in once-hot areas such as semiconductors and AI infrastructure weren't entirely surprising, given the scale of earlier gains in many of these stocks and the financing concerns that have shadowed the so-called neoclouds, smaller infrastructure firms such as Nebius and CoreWeave, since US interest rates rose late in the summer.\n\nBut many said the scale of the declines for a second straight day suggest a change in sentiment that could portend further selling.\n\n\"Despite the magnitude of today\u2019s move, volatility has not yet reached the capitulation or contrarian extremes historically associated with capitulation points,\" said Adam Turnquist, chief cross-asset strategist for LPL Financial in Charlotte, North Carolina.\n\nShares of semiconductor and neocloud companies posted the most significant declines, reflecting worries that data center buildouts worth billions of dollars could face delays. The Philadelphia SE Semiconductor index fell as much as 11.2% to touch its lowest level in more than six months. Nvidia dropped 9% and Advanced Micro slumped 15%.\n\nHyperscalers, which defied Wednesday's broad tech selloff, also dropped.", "source": "LiveMint Markets", "pub_date_str": "06 Nov 2026, 12:34 AM IST", "pub_date_relative": "1h ago"}, {"title": "Sandisk Stock Is Down 45% Over the Past Four Months. Is It a Bargain or a Value Trap? - Yahoo Finance", "full_content": "Sandisk Stock Is Down 45% Over the Past Four Months. Is It a Bargain or a Value Trap? Yahoo Finance Sandisk: A PEG Of 0.12x Is Just Too Cheap (NASDAQ:SNDK) Seeking Alpha Down 51% From Its High: Is This 84.6% Margin NAND Flash Maker a Bargain? Yahoo Finance Why is SanDisk stock tumbling today? Investing.com Memory Chip Stocks Fall Broadly in Pre-Market Trading; Seagate Technology (STX.US) Drops Over 4% Moomoo", "source": "Google News Business", "pub_date_str": "06 Nov 2026, 12:33 AM IST", "pub_date_relative": "1h ago"}, {"title": "Blue Origin pushes launch to January 2027 as it races to rebuild damaged launch pad", "full_content": "Jeff Bezos ' Blue Origin has delayed a return to flight for its flagship New Glenn rocket to January 2027, later than its earlier target of the end of this year, as it rushes to recover from a major explosion in May.\n\nBlue Origin CEO Dave Limp told employees in a memo Wednesday that the company's launch timing slipped as a result of delays with reconstructing its Cape Canaveral launch pad, including bad weather over the summer.\n\n\"This small adjustment doesn't diminish what we've accomplished or the importance of the work still ahead,\" Limp wrote in the memo, which was viewed by CNBC. \"Returning New Glenn to flight remains our top priority \u2014 it's worth it.\"\n\nThe Financial Times earlier reported the memo. The January 2027 timeframe is about 10 days later than Blue Origin's earlier launch target, a person familiar with the matter told CNBC, who spoke on condition of anonymity in order to discuss internal matters.\n\nThe New Glenn explosion in May, which occurred during a hot-fire test, badly damaged Blue Origin's Florida launchpad. The company was slated to deploy 48 satellites for Amazon 's Leo internet-from-space service just a few days later.\n\nSince then, the company has moved swiftly to repair the launch facility and reworked its pad configuration. Bezos told Fox News last month that the company was still expecting New Glenn to fly again in December.\n\nLimp said Blue Origin has made great progress on the recovery, but he noted that \"rebuilding at this pace hasn't been easy.\"\n\n\"Your collective work on our return to flight has been nothing short of remarkable,\" Limp wrote. \"In just six months, Team Blue has accomplished what many thought would take years.\"", "source": "CNBC World Economy", "pub_date_str": "06 Nov 2026, 12:32 AM IST", "pub_date_relative": "1h ago"}, {"title": "As Nvidia\u2019s stock heads for a bear market, bargain hunters see a golden buying opportunity", "full_content": "Portfolio managers say chip demand should be resilient even in a period of political uncertainty.", "source": "MarketWatch Top Stories", "pub_date_str": "06 Nov 2026, 12:29 AM IST", "pub_date_relative": "1h ago"}, {"title": "CNBC's experts on whether the AI trade is ending and what investors should do next - CNBC", "full_content": "CNBC's experts on whether the AI trade is ending and what investors should do next CNBC The AI Boom May Be Sowing Seeds of Another Financial Crisis Bloomberg.com AI Investors Are Racing to Get Insurance on the Biggest Market Bet in History WSJ Big Tech's massive AI spending is causing another problem for investors Yahoo Finance Big Tech\u2019s big AI buildout will not end until someone stops it The Verge", "source": "Google News Business", "pub_date_str": "06 Nov 2026, 12:28 AM IST", "pub_date_relative": "1h ago"}, {"title": "Goldman Sachs elevates record number of engineers to coveted partner ranks - Financial Times", "full_content": "Goldman Sachs elevates record number of engineers to coveted partner ranks Financial Times See more headlines & perspectives on Google News", "source": "Google News Business", "pub_date_str": "06 Nov 2026, 12:27 AM IST", "pub_date_relative": "1h ago"}, {"title": "HSA-eligible health plans in 2027: What to know about tax savings vs. higher deductibles", "full_content": "Healthcare affordability was part of the midterm election cost-of-living debate .\n\nIt is uncertain how a new Congress might try to address that pain point. Now, as workers choose their 2027 health insurance coverage , millions face a more immediate decision: whether to pick a plan that lets them contribute to a health savings account, or HSA.\n\nThe question is whether an HSA-eligible plan with lower premiums and tax benefits is worth the higher deductible and potential out-of-pocket costs.\n\n\"You have a triple tax advantage,\" said Kalei Cadinha-Pua'a, vice chair and CEO of Honolulu-based Cadinha & Co., which ranked No. 21 on this year's CNBC Financial Advisor 100 list.\n\nEmployer and employee contributions go into the fund before taxes, earnings in the account aren't taxed while they remain in the HSA, and withdrawals for qualified medical expenses are tax-free.\n\nRead coverage of CNBC's 2026 Financial Advisor 100 list, including stories featuring ranked firms and their advisors:\n\nFinancial advisors say employees often overlook another potential tax savings. HSA contributions made through an employer's Section 125 cafeteria plan generally aren't subject to Social Security and Medicare taxes.\n\nThat can make payroll contributions more tax-efficient than contributing on your own and claiming a deduction later, said certified financial planner and enrolled agent Andy Panko, the founder of Tenon Financial in Metuchen, New Jersey.", "source": "CNBC Top News", "pub_date_str": "06 Nov 2026, 12:27 AM IST", "pub_date_relative": "1h ago"}, {"title": "McDonald's plans new value menu offerings next year to boost sluggish sales - Fox Business", "full_content": "McDonald's plans new value menu offerings next year to boost sluggish sales Fox Business McDonald's pushes cheaper meals as customers cut back USA Today McDonald\u2019s Q3 sales seen slowing as spending cools, now value, drinks in focus Yahoo Finance McDonald\u2019s launches budget-friendly meal deals as fast food prices soar New York Post McDonald\u2019s plans new value bundles next year after US traffic falls in third quarter AP News", "source": "Google News Business", "pub_date_str": "06 Nov 2026, 12:27 AM IST", "pub_date_relative": "1h ago"}, {"title": "Voters rejected AI data centers over resource concerns. Here's why measuring water usage is hard", "full_content": "Voters made it clear this week that they want to see limits put on data centers for artificial intelligence, passing 40 of 41 proposed ballot measures that would place restrictions on some of the more than 2,000 new facilities planned for communities around the nation.\n\nWater and power top the list of ratepayers' concerns. But calculating how much each data center draws from local resources is an elusive task, with operators typically reporting usage figures companywide instead of site by site.\n\nGiant 1-gigawatt AI data centers from the likes of Meta , Google , Amazon and SpaceX can consume up to 10 million gallons of water per day, according to Shaolei Ren, a data center researcher and professor at University of California, Riverside.\n\nThe exact number varies greatly depending on what type of hardware is inside a data center, where it's built, and what method is used to cool the servers and the building as a whole.\n\nThe complex ways data centers use water have left room for misinformation from both the builders and those fighting against them. CNBC talked to experts to get a clearer picture.\n\nData centers need serious internal cooling methods to keep chips and servers from overheating.\n\nLegacy data centers, filled with lower-power servers used for things like networking or storage, are often air-cooled. Large fans move hot air away from the servers and outside the building.\n\nBut modern AI data centers are filled with high-power, denser graphics processing units, or GPUs, which Ren said can run so hot that the servers can \"boil your eggs.\"", "source": "CNBC World Economy", "pub_date_str": "06 Nov 2026, 12:22 AM IST", "pub_date_relative": "1h ago"}, {"title": "Jim Cramer says the AI trade is not going away as Nasdaq enters correction", "full_content": "The Investing Club holds its \"Morning Meeting\" every weekday at 10:20 a.m. ET.", "source": "CNBC World Economy", "pub_date_str": "06 Nov 2026, 12:16 AM IST", "pub_date_relative": "1h ago"}, {"title": "Goldman Traders\u2019 Phones Blow Up With Investors Seeking Answers to AI Rout - Bloomberg.com", "full_content": "Goldman Traders\u2019 Phones Blow Up With Investors Seeking Answers to AI Rout Bloomberg.com Goldman Sachs flags 'frozen' institutional buyers amid tech de-risking Seeking Alpha Goldman Sachs\u2019 Trading Desk Sees Buyers Disappear During Selloff TipRanks COIN and CRCL Stock Outlook as Goldman Sachs Flags 7 Recovery Signals for US Equities Cryptonews.net Wall Street's Risk Appetite Breaks: Goldman Finds a Market Still Carrying Too Much Leverage The Dark Side Of The Boom", "source": "Google News Business", "pub_date_str": "06 Nov 2026, 12:10 AM IST", "pub_date_relative": "2h ago"}, {"title": "Wall Street fear gauge jumps most since 'Liberation Day' as AI trade stumbles - Reuters", "full_content": "Wall Street fear gauge jumps most since 'Liberation Day' as AI trade stumbles Reuters Wall Street's fear gauge surges the most since April. Why traders think it should be even higher CNBC VIX Takes Biggest Leap Since 2025 WSJ The VIX Hasn't Surged Like This Since Trump Tariff Chaos Barron's VIX spikes to seven-month high, erasing post-midterm relief (VIX:) Seeking Alpha", "source": "Google News Business", "pub_date_str": "06 Nov 2026, 12:03 AM IST", "pub_date_relative": "2h ago"}, {"title": "Wife's LinkedIn isn't proof of income, rules Bengaluru court; can financially independent woman be denied maintenance?", "full_content": "A woman's educational qualifications and an active LinkedIn profile do not necessarily mean that she is financially independent, a Bengaluru court has recently held, rejecting a husband\u2019s argument that his wife was capable of earning and therefore did not need maintenance.\n\nThe husband argued that his wife, an engineering graduate, had completed a Systems, Applications and Products in Data Processing (SAP) course from New Jersey in the United States and was capable of earning.\n\nHe also submitted her photographs, LinkedIn and Facebook profiles as evidence to claim that she was working at a private company. However, he failed to provide details of her alleged employment or actual income.\n\nThe court noted that the wife was unemployed when she filed the domestic violence petition in 2021. Her husband\u2019s own statement of assets and liabilities also did not mention that she had a job, earned an income or owned any exclusive property that would generate income.\n\nIn its ruling pronounced on October 28, 2026, the Bengaluru court noted that photographs and social media profiles produced during arguments could not be relied upon as proof of her employment or earnings.\n\n\u201cEven if it is presumed that the petitioner has joined some job after 2023, then also it cannot be held that the petitioner is having sufficient income so as to maintain herself and her child,\u201d the ruling read.\n\nThe court also recognised the responsibilities involved in raising a minor child, observing that the time and effort spent on childcare cannot be measured merely in monetary terms.", "source": "LiveMint Money", "pub_date_str": "06 Nov 2026, 12:01 AM IST", "pub_date_relative": "2h ago"}, {"title": "2 arrested after mushroom gummies given to children on Halloween in Ocean Beach - NBC 7 San Diego", "full_content": "2 arrested after mushroom gummies given to children on Halloween in Ocean Beach NBC 7 San Diego SoCal police investigate suspected \u2018shroom\u2019 gummies found by trick-or-treaters KTLA Two arrested after allegedly distributing psilocybin gummies to trick-or-treaters FOX 5 San Diego & KUSI News Police find drugs and weapons in California home tied to psilocybin-infused Halloween gummies picked up by children The Mercury News Two Parents Confront Adult Neighbors on Video After Finding Psychedelic Gummies in Kids\u2019 Halloween Bags Yahoo", "source": "Google News Business", "pub_date_str": "05 Nov 2026, 11:58 PM IST", "pub_date_relative": "2h ago"}, {"title": "Nvidia Stock Is Below $200. What History Suggests Is the Floor. - Barron's", "full_content": "Nvidia Stock Is Below $200. What History Suggests Is the Floor. Barron's Nvidia has lost nearly $1.4 trillion since its October record Yahoo Finance Nvidia: Trade The Fear With NVDL (NASDAQ:NVDA) Seeking Alpha As Nvidia\u2019s stock heads for a bear market, bargain hunters see a golden buying opportunity MarketWatch Jim Cramer Says Nvidia Should Buy Shares on Thursday\u2019s 8% Drop: \u2018If the Cheapest Asset is Your Stock, You Benzinga", "source": "Google News Business", "pub_date_str": "05 Nov 2026, 11:53 PM IST", "pub_date_relative": "2h ago"}, {"title": "Micron, Sandisk and other AI stocks are falling hard: \u2018Investors don\u2019t like uncertainty\u2019", "full_content": "Wall Street is digesting the prospect of a slower AI buildout in the wake of the midterm election results.", "source": "MarketWatch Top Stories", "pub_date_str": "05 Nov 2026, 11:48 PM IST", "pub_date_relative": "2h ago"}, {"title": "Stock market today: Nasdaq plunges 5% as chip stocks sell off, Dow and S&P 500 give back post-election rally gains - Yahoo Finance", "full_content": "Stock market today: Nasdaq plunges 5% as chip stocks sell off, Dow and S&P 500 give back post-election rally gains Yahoo Finance Here's what the Democratic election rout could mean for the U.S. economy CNBC Wall Street welcomes gridlock after Democrats take control of Congress WJLA Stock markets diverge, oil prices rebound tracking Trump and AI Yahoo Finance What\u2019s Likely to Change for the U.S. Economy After Democrats\u2019 Resounding Victory in the Midterms? Investopedia", "source": "Google News Business", "pub_date_str": "05 Nov 2026, 11:47 PM IST", "pub_date_relative": "2h ago"}, {"title": "My 93-year-old father changed his will at the 11th hour, leaving my brother his entire $500,000 estate. Can I challenge it?", "full_content": "\u201cMy brother had no job and needed a place to live.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "05 Nov 2026, 11:45 PM IST", "pub_date_relative": "2h ago"}, {"title": "Stocks making the biggest moves midday: Micron, Tesla, Tripadvisor, AppLovin, Nvidia & more", "full_content": "Here are some of the companies making headlines in midday trading.", "source": "CNBC Top News", "pub_date_str": "05 Nov 2026, 11:39 PM IST", "pub_date_relative": "2h ago"}], "cfa": [{"title": "IRS announces new federal income tax brackets for 2027", "full_content": "The IRS has announced new federal income tax brackets and standard deductions for 2027.\n\nIn its announcement Thursday, the agency raised the income thresholds for each bracket, which apply to tax year 2027 for returns filed in 2028.\n\nThe IRS also increased figures for other key provisions, including long-term capital gains brackets, the estate and gift tax exemption , and eligibility for the earned income tax credit, among others.\n\nFor 2027, the top rate of 37% applies to individuals with taxable income above $661,375 and married couples filing jointly earning $793,650 or more.\n\nFederal income tax brackets show how much you owe on each part of your taxable income, which you calculate by subtracting the greater of the standard or itemized deductions from your adjusted gross income.\n\nThe standard deduction will also increase in 2027, rising to $33,200 for married couples filing jointly, up from $32,200 in 2026. Starting in 2027, single filers can claim $16,600, a bump up from $16,100.\n\nThe new tax brackets come as Americans wrestle with affordability issues amid the rising cost of housing , groceries , gasoline and other living expenses.\n\nThe consumer price index climbed 3.7% in September 2026 from one year earlier, up from a yearly pace of 3.4% in August, the Bureau of Labor Statistics reported in October.", "source": "CNBC Top News", "pub_date_str": "06 Nov 2026, 02:07 AM IST", "pub_date_relative": "7m ago", "cfa_topics": ["Economics", "Financial Statement Analysis"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Dow tumbles 1,800 points, erasing its postelection rally; Nasdaq plummets 5%: Live updates", "full_content": "Stocks plummeted on Thursday, erasing the sharp gains from the rally seen in the wake of the U.S. midterm elections , as investors accelerated their move away from technology stocks on fears of a data-center buildout slowdown.\n\nThe Nasdaq Composite declined 5.4% and dipped into correction territory, trading more than 10% below a record set last month. The S&P 500 was down 4.3%, heading for its worst day since April 2025. The Dow Jones Industrial Average shed 1,844 points, or 3.7%. The Dow erased about all of its advance from Wednesday's massive postelection rally. The small-cap Russell 2000 index decreased 4.4% and also entered a correction.\n\nNasdaq Composite, 5-day Stocks related to the artificial intelligence trade, particularly those linked to the chips industry and data centers, slid for a second day. Investors fear that a Democratic sweep of both chambers of Congress as well as victories in key gubernatorial races could decelerate the data center buildout .\n\nFor instance, Sen. Bernie Sanders of Vermont \u2014 who caucuses with Democrats \u2014 has called for a national data center moratorium. In a post on X Wednesday evening, Sanders wrote that \"Americans don't want Big Tech oligarchs wrecking the environment, gutting jobs and threatening humanity's future.\"\n\nChipmakers Broadcom and Nvidia each fell 9% Thursday, while software stock Oracle moved lower by 7%. Another chip stock, Qualcomm , reported earnings that beat estimates , but the stock dropped 10% on a weaker-than-expected earnings outlook.", "source": "CNBC Top News", "pub_date_str": "06 Nov 2026, 02:07 AM IST", "pub_date_relative": "7m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "The 2027 tax brackets are out. See what the standard deduction and SALT tax breaks will be.", "full_content": "The tax brackets at the heart of Americans\u2019 income-tax bills will be adjusting at a steeper level in 2027 compared to this year, underscoring inflation\u2019s rekindled presence.", "source": "MarketWatch Top Stories", "pub_date_str": "06 Nov 2026, 01:52 AM IST", "pub_date_relative": "22m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Cisco Systems options suggest 7.9% stock move on earnings", "full_content": "", "source": "Investing.com News", "pub_date_str": "06 Nov 2026, 01:51 AM IST", "pub_date_relative": "22m ago", "cfa_topics": ["Financial Statement Analysis", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Bloom Energy\u2019s stock is one of the S&P 500\u2019s biggest losers amid fears of data-center delays", "full_content": "Bloom Energy shares got swept in by tech stocks\u2019 sharp selloff Thursday, as investors fretted that the data-center buildout was at risk of stalling in the aftermath of the U.S. midterm elections.", "source": "MarketWatch Top Stories", "pub_date_str": "06 Nov 2026, 01:51 AM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Coherent earnings analysis: questions answered and next catalysts", "full_content": "", "source": "Investing.com News", "pub_date_str": "06 Nov 2026, 01:49 AM IST", "pub_date_relative": "25m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Dlocal shares may move 12% on Nov. 12 earnings release", "full_content": "", "source": "Investing.com News", "pub_date_str": "06 Nov 2026, 01:48 AM IST", "pub_date_relative": "26m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Top Democrats call to rein in AI buildout after midterms sweep: 'National data center moratorium now'", "full_content": "After a big win in the U.S. midterm elections on Tuesday, some Democrats are already signaling they want to take on the artificial build-out, specifically data centers.\n\nIn a post on X , Sen. Bernie Sanders, I-Vt., touted referendums across the U.S. on Tuesday where voters in localities approved restrictions on data centers . Sanders, who caucuses with the Democrats, said the message to political leaders is clear.\n\n\"National data center moratorium now,\" he wrote in the post. \"Americans don't want Big Tech oligarchs wrecking the environment, gutting jobs and threatening humanity's future.\"\n\nIn another post on X, Rep. Yassamin Ansari, D-Ariz., wrote that pausing AI development needs to be a top priority for the large Democratic majority in the House on Day 1. Rep. Greg Casar, D-Texas, the chair of the Congressional Progressive Caucus, amplified the post and said, \"Yes!\"\n\nAccording to the CNBC Voter Poll , 56% of voters said AI and data centers were a crucial or major factor in their decision at the ballot box. Of those voters, 65% said they cast a ballot for a Democratic candidate for Congress.\n\nStocks linked to the artificial intelligence build-out declined slightly on Wednesday in the wake of the election, but the selling intensified on Thursday as investors worried Democratic wins could have a real impact on data center construction. Chip stocks led the decline. The iShares Semiconductor ETF (SOXX) tumbled nearly 9% on Tuesday. Nvidia declined 8%, while Advanced Micro Devices sunk more than 14%.\n\nDemocrats who flipped critical races on Tuesday also singled out big tech companies and data centers.\n\nSouth Carolina Democrat Annie Andrews, who flipped a Senate seat in the state on Tuesday, launched a website during the campaign that branded her opponent \u2014 Sen. Darline Graham \u2014 \"data center Darline.\"", "source": "CNBC Finance", "pub_date_str": "06 Nov 2026, 01:47 AM IST", "pub_date_relative": "27m ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Teekay Corp. stock may move 5.9% on upcoming earnings report", "full_content": "", "source": "Investing.com News", "pub_date_str": "06 Nov 2026, 01:45 AM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Truist raises Palomar Holdings stock price target on earnings growth", "full_content": "", "source": "Investing.com News", "pub_date_str": "06 Nov 2026, 01:44 AM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "AI meltdown: Chip stocks and neoclouds plunge, pushing Nasdaq to worst day since April 2025", "full_content": "Chipmakers plummeted on Thursday, with Nvidia pushing the Nasdaq toward its worst day in 19 months, after this week's midterm election results raised concerns on Wall Street that the artificial intelligence buildout is poised to slow down. Neoclouds like CoreWeave tumbled for a second straight day.\n\nQualcomm contributed to the selloff after issuing a disappointing earnings forecast for the current quarter. Qualcomm and Nvidia both dropped about 8%.\n\nThe environment has gone from bad to worse for companies intimately tied to AI infrastructure, as the combination of rising interest rates, ballooning capital needs and the Democratic sweep in Congress has led to increased fears that wide swaths of the market are going to be weighed down by too much debt and too little revenue.\n\n\"The technology is still going to continue on in terms of its development, but if there is a slowdown in the actual development and the buildings and the infrastructure and so forth, that's what stocks are going to trade off,\" said Peter Boockvar, chief investment officer at OnePoint BFG Wealth Partners, in an interview with CNBC's \"Squawk on the Street.\"\n\nAdvanced Micro Devices , Micron and Applied Materials all suffered double-digit percentage losses on Thursday. Elon Musk , who contributed hundreds of millions of dollars to try and get Republicans elected in Texas and elsewhere, saw shares of his public companies, SpaceX and Tesla , tumble 7% and 10%, respectively.\n\nIn Tuesday's election, the states with the most ambitious AI data center plans all turned blue. Democrats won key contests for governor and the Senate in Texas and Ohio, while also coming up victorious in the gubernatorial race in Georgia, where Democratic Sen. Jon Ossoff also cruised to reelection.\n\nThere were 41 local ballot measures in 10 states up for a vote on Tuesday that would place restrictions on the construction of data centers in different ways, according to Ballotpedia .", "source": "CNBC World Economy", "pub_date_str": "06 Nov 2026, 01:38 AM IST", "pub_date_relative": "35m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Treasuries Soar as Tech-Stock Selloff Lures Investors to Havens", "full_content": "(Bloomberg) -- Treasuries rose as a Democratic sweep in the US midterms led to a selloff in shares of large US technology companies, stoking demand for havens.\n\nThe rally in the US government bond market on Thursday sent yields down across maturities by as much as nine basis points to the lowest levels since early September. The yield retreat began after the US stock market opened, with the Nasdaq 100 index falling 4.75% and the Philadelphia Semiconductor Index down 8.83%.\n\nThe Treasury market last month notched its biggest gain in more than two years as investors lost faith in the sustainability of capital spending on artificial-intelligence infrastructure and rotated from stocks to bonds.\n\n\u201cThe fact that chip stocks are falling is an extension of the idea that there may be a pullback in the pace of capex spend,\u201d said Anmol Sinha, fixed income investment director at The Capital Group. \u201cThat\u2019s causing a reaction.\u201d\n\nBeyond haven demand for Treasuries, the prospect of a US economic slowdown resulting from fading enthusiasm for investment in the AI buildout has led to lower expectations for Federal Reserve interest-rate hikes in the coming months.\n\nWhile traders continue to almost fully price in a quarter-point increase when Fed policymakers hold their final vote this year on Dec. 9, Thursday\u2019s activity in short-term interest-rate options included trades targeting no move. Wagers on additional moves next year also were pared Thursday.\n\nIn the Treasury options market, there was strong demand for hedges for additional gains. Standout trades included one anticipating the 10-year yield \u2014 down about four basis points near 4.85% \u2014 could reach 4.7% by the end of next week. Another, expiring Nov. 20, targeted a decline to around 4.35%.\n\n\u201cToday is a risk-off move in our view,\u201d said Gregory Faranello, head of macro strategy at South Street Securities Holdings. \u201cWe are not chasing duration at these levels but respect the price action relative to risk assets for now.\u201d", "source": "LiveMint Markets", "pub_date_str": "06 Nov 2026, 01:33 AM IST", "pub_date_relative": "41m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Fixed Income", "Derivatives", "Alternative Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Stock Market Today: Nasdaq Sinks 5% as Investors Ditch Chip, Data-Center Stocks \u2014 Live Updates - WSJ", "full_content": "Stock Market Today: Nasdaq Sinks 5% as Investors Ditch Chip, Data-Center Stocks \u2014 Live Updates WSJ Stock market today: Nasdaq plunges 5% amid chip stock wipeout, Dow and S&P 500 erase post-election rally gains Yahoo Finance Stocks plunge as midterm results send AI trade into a tailspin CNN US Stock Futures Diverge as Chip Selloff Extends Into Second Day Bloomberg.com Stocks plunge as AI worries crush tech shares NBC News", "source": "Google News Business", "pub_date_str": "06 Nov 2026, 01:26 AM IST", "pub_date_relative": "48m ago", "cfa_topics": ["Equity Investments", "Derivatives"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "IRS announces bigger estate and gift tax exemption for 2027", "full_content": "The Internal Revenue Service has announced a higher estate and gift tax exemption for 2027.\n\nIn its announcement Thursday, the agency increased the federal \"basic exclusion amount\" to $15.48 million per person for 2027, up from $15 million in 2026. The exemptions apply to tax-free transfers during life and at death.\n\nThe IRS also increased figures for dozens of other provisions, including federal income tax brackets , the capital gains tax brackets and eligibility for the earned income tax credit, among others.\n\nThe inflation adjustments for 2027 come as Americans wrestle with affordability amid the rising cost of housing, groceries, gasoline and other living expenses.\n\nPresident Donald Trump 's \"big beautiful bill\" increased the estate and gift tax exemption to $15 million per person. Without the change from Congress, the exemption would have reverted to 2017 levels \u2014 $5 million plus an inflation adjustment \u2014 after 2025, which spurred proactive estate planning from ultra-wealthy families before the legislation.\n\nUnder current law, few families are subject to federal estate taxes. For 2026, families will file about 6,890 federal estate tax returns , and roughly 3,900 will be taxable, according to estimates from the Tax Policy Center, a think tank.", "source": "CNBC Top News", "pub_date_str": "06 Nov 2026, 01:24 AM IST", "pub_date_relative": "50m ago", "cfa_topics": ["Economics", "Financial Statement Analysis"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "After tech-stock rout, October jobs report could bring relief \u2014 or more pain", "full_content": "After a tech-led meltdown in the stock market, the October jobs report on Friday morning could bring investors some encouraging news \u2014 or add to their misery.", "source": "MarketWatch Top Stories", "pub_date_str": "06 Nov 2026, 01:16 AM IST", "pub_date_relative": "58m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Three consumer stocks to buy after the midterm elections", "full_content": "Consumer discretionary stocks are gaining momentum following the midterm elections. Here's why Lennar, SharkNinja and Amazon could benefit from the market rotation.", "source": "CNBC Top News", "pub_date_str": "06 Nov 2026, 01:07 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "U.S. warns of 'ongoing cyber threat' to industrial refrigeration systems", "full_content": "The United States is warning of an \"ongoing cyber threat\" to industrial refrigeration systems, saying in a statement issued on Thursday that every organization that depends on cold storage should assume it could fall into the hackers' crosshairs.\n\nThe statement, which follows a spate of hacks against commercial freezers in the United States and Europe, said that unidentified \"malicious cyber actors\" were targeting vulnerabilities in internet-accessible electronic temperature and commercial refrigeration controllers in retail grocery and cold storage facilities.\n\nAlthough short on detail about the hackers involved, the statement suggested that the threat to commercial cold storage was ongoing.\n\n\"If successfully exploited, the actors could change the temperature and possibly cause physical impacts such as fire hazards, loss of inventory and changes to the service life of the system,\" said the statement, which was jointly issued by the FBI, the Cybersecurity and Infrastructure Security Agency and the departments of health, transport and agriculture.\n\n\"Every organization that depends on refrigeration and monitoring systems should assume it could be a target,\" said Chris Butera, CISA's acting executive assistant director for cybersecurity.\n\nFBI Cyber Branch Operations Director Brett Leatherman said that the government was \"seeing these systems targeted across critical infrastructure sectors globally.\"\n\nThe government urged operators of industrial refrigeration control systems to pull their devices off the public internet, isolate them from their corporate networks and promptly apply software updates.\n\nAt least three waves of hacks have hit commercial fridges and freezers in the past few months. Pentagon investigators are treating a series of mysterious malfunctions that hit grocery store refrigeration units on US military bases in August as a cyberattack, Reuters first reported last week.", "source": "CNBC Top News", "pub_date_str": "06 Nov 2026, 12:56 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "JP Morgan to add Philippines and Saudi Arabia to key EM bond index over 10 months", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a JP Morgan to add Philippines and Saudi Arabia to key EM bond index over 10 months Powered By The Economic Times daily newspaper is available online now. Read Today's Paper JP Morgan to add Philippines and Saudi Arabia to key EM bond index over 10 months SECTIONS JP Morgan to add Philippines and Saudi Arabia to key EM bond index over 10 months Reuters Last Updated: Nov 06, 2026, 12:56:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis JP Morgan has announced plans to include Saudi Arabia and the Philippines in its emerging market debt index starting in 2027. The Saudi riyal-denominated sukuk and Philippine peso-denominated government bonds will be integrated over a ten-month period. The index is expected to adjust the maximum country weight limit from 10% to 9%. Saudi Arabia's weight will reach 2.71%, while the Philippines will have a weight of 1.64%.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "06 Nov 2026, 12:56 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Fixed Income"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "The average US 30-year mortgage rate falls to 7.18% this week, its third straight decline", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a The average US 30-year mortgage rate falls to 7.18% this week, its third straight decline Powered By The Economic Times daily newspaper is available online now. Read Today's Paper The average US 30-year mortgage rate falls to 7.18% this week, its third straight decline SECTIONS The average US 30-year mortgage rate falls to 7.18% this week, its third straight decline AP Last Updated: Nov 06, 2026, 01:01:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The average long-term mortgage rates in the U.S. decreased for the third consecutive week, offering some respite. The average 30-year fixed-rate mortgage declined to 7.18% from 7.24%, according to Freddie Mac. Additionally, the 15-year fixed-rate mortgages saw a drop to 6.57%, slightly down from last week. These lower rates help to alleviate the financial burden on prospective homebuyers facing increased costs.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "06 Nov 2026, 12:54 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Wall Street's fear gauge surges the most since April. Why traders think it should be even higher", "full_content": "Whether it's a referendum on the midterms or just a continuation of a bear market in semiconductors that dates back to the group's peak in June, one thing's clear from the options action Thursday: few traders saw this coming.\n\nThat's evident in the surge in Cboe Volatility index (VIX) , which jumped as much as 5.7 points to above 28 about 90 minutes after the opening bell on Thursday. It's the highest reading on VIX since March 31, the day after the S&P 500 bottomed after selling off as tensions between Iran, Israel and the U.S. reached fever pitch.\n\nFrom its intraday low to high Thursday, VIX moved more than 11 points, the biggest one-day move since April 9. Yet with the S&P 500 down 3%, there's an argument to be made that volatility should be higher. Traders use a rule of thumb that 16 points for the VIX equate to a 1% move in the index.\n\nThe S&P 500 was headed for its worst decline since April 2025.\n\nCboe Volatility Index, YTD \"My data says to de-risk, but my gut says this is a blowout that could create a dip-buying opportunity\" said Noel Smith, \"I do not see macro stuff causing this, like oil or rates. Those things are relatively unchanged. The tape looks like a liquidation and that's exactly what it is according to what I'm hearing with regards to a hedge fund.\"\n\nLooking at Wednesday's response to the selloff in semiconductors adds a wrinkle for traders that pointed to a too-calm VIX despite Wednesday's tech-stock wreck. With the VanEck Semiconductor ETF down 3%, it was the first day in market history that the VIX concurrently fell more than 4 points, according to data from the X account \"OddStats.\" As of midday, nearly 800,000 calls traded on the VIX, 3.5 times higher than 30-day average, according to Cboe data.", "source": "CNBC Top News", "pub_date_str": "06 Nov 2026, 12:50 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "SpaceX, Tesla extend losses as midterm results cloud data center, merger outlook - Reuters", "full_content": "SpaceX, Tesla extend losses as midterm results cloud data center, merger outlook Reuters Opinion | Elon Musk\u2019s Very Bad Night The New York Times Musk bet big on keeping Texas red. What happens to his business empire now? CNN Tesla Shares Tumble Again in Deepening Post-Election Slump Bloomberg.com The biggest loser of the 2026 midterms wasn\u2019t Trump. It was Elon Musk. The Boston Globe", "source": "Google News Business", "pub_date_str": "06 Nov 2026, 12:49 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "US yields fall in choppy session as oil rises and equities sink", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a US yields fall in choppy session as oil rises and equities sink Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US yields fall in choppy session as oil rises and equities sink SECTIONS US yields fall in choppy session as oil rises and equities sink Reuters Last Updated: Nov 06, 2026, 12:54:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis As geopolitical tensions change the landscape, US Treasuries are witnessing a spike in demand while equity markets take a hit and oil prices show volatility. Investors are reassessing their outlook on the US-Iran relations following new election results. The labor market remains resilient with dropping unemployment claims and heightened productivity levels, pointing towards ongoing inflation risk.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "06 Nov 2026, 12:49 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Trump's energy deals are about to face a wave of investigations by Democrats", "full_content": "President Donald Trump is expected to face a wave of investigations when Democrats take control of Congress in January. His sweeping deal-making in the energy sector is likely to become a central focus.\n\nDemocrats have pressed the White House for months on the legality of its intervention in Venezuela's oil sector and its cancellation of renewable energy projects funded by the Biden administration. They have raised conflict of interest concerns over numerous deals in the minerals sector.\n\nBut, until now, the opposition party could do little more than send strongly worded letters to administration officials. When the next Congress convenes in January, the Democrats will wield the subpoena power that comes with committee control, giving them the authority to compel testimony and the disclosure of documents.\n\nThe House Energy and Commerce Committee in the next Congress intends to pursue an aggressive oversight agenda to root out corruption, Rep. Frank Pallone, the New Jersey Democrat who will likely chair the panel, said in a statement.\n\nWith comfortable majorities in the House and Senate, Democrats will likely pass a war powers resolution that demands an end to the conflict, which has hiked fuel prices in the U.S. and around the world.\n\nCrude oil prices sold off sharply Wednesday as the market expected the election defeat to push Trump to cut a deal with Iran. Vice President JD Vance blamed the Republican loss directly on the war, raisi
