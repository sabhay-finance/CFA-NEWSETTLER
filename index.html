ntent": "Dow futures are up this morning, and Nasdaq futures are down.", "source": "CNBC Top News", "pub_date_str": "05 Nov 2026, 08:09 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Derivatives"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Novo Nordisk Lifts Guidance as Rollout of Wegovy Weight-Loss Pill Continues - WSJ", "full_content": "Novo Nordisk Lifts Guidance as Rollout of Wegovy Weight-Loss Pill Continues WSJ Novo Nordisk CEO: Wegovy pill 'exceeded our expectations' Yahoo Finance Novo shares jump as Wegovy pill sales impress, drugmaker hikes outlook CNBC Novo Surges After Crushing Forecasts On The Back Of Its GLP-1s Investor's Business Daily No pain, no gain at Novo The Economist", "source": "Google News Business", "pub_date_str": "05 Nov 2026, 08:09 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Glenmark Pharma Q2 Results: Net profit plunges 56% to Rs 264 crore, revenue down at Rs 4,247 cr", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a Earnings \u203a Glenmark Pharma Q2 Results: Net profit plunges 56% to Rs 264 crore, revenue down at Rs 4,247 cr Glenmark Pharmaceuticals Share Price Mankind Pharma Share Price Aurobindo Pharma Share Price Lupin Share Price Alkem Laboratories Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Glenmark Pharma Q2 Results: Net profit plunges 56% to Rs 264 crore, revenue down at Rs 4,247 cr SECTIONS Glenmark Pharma Q2 Results: Net profit plunges 56% to Rs 264 crore, revenue down at Rs 4,247 cr PTI Last Updated: Nov 05, 2026, 08:08:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Glenmark Pharmaceuticals experienced a 56.78 percent drop in consolidated profit after tax during the September quarter. Total revenue from operations decreased to Rs 4,247.32 crore compared to the previous year. The company's total expenses also decreased during the same period, indicating some operational efficiency. A subsidiary of Glenmark Pharma entered into a settlement for USD 15 million with Humana Inc.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "05 Nov 2026, 08:08 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Qualcomm Slides After Supply Costs Take a Bite Out of Profit - Bloomberg.com", "full_content": "Qualcomm Slides After Supply Costs Take a Bite Out of Profit Bloomberg.com Qualcomm tops Q4 estimates, but Q1 earnings outlook falls short sending stock lower Yahoo Finance Qualcomm stock drops 7% on weak earnings forecast as memory shortage weighs on smartphone sales CNBC Qualcomm slumps as weak smartphone chip sales overshadow data-center momentum Reuters QCOM Q4 Earnings Call Highlights Data Center Ramp and Handset Risks Yahoo Finance", "source": "Google News Business", "pub_date_str": "05 Nov 2026, 08:08 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Muhurat Trading 2026: How has the Indian stock market performed over the past 10 years? What lies ahead in Samvat 2083", "full_content": "A Ksheerasagar Published 5 Nov 2026, 08:07 PM IST Prefer Livemint on Google Every Diwali, the Indian stock market marks the occasion with a special one-hour evening trading session known as Muhurat Trading. Considered an auspicious time to invest, the tradition has become symbolic of prosperity, with investors viewing it as an opportunity to usher in wealth and success to their portfolios.\n\nThis year, both the BSE and NSE will conduct the Muhurat Trading session on Sunday, November 8, from 2:20 PM to 3:30 PM. While markets will remain closed during the regular trading session, this special evening session allows investors to make token investments, keeping alive the long-standing tradition of trading during Diwali.\n\nHistorically, Muhurat trading sessions have often ended on a positive note, even though trading volumes tend to remain relatively low. The special session witnesses participation from traders, retail investors, and institutional investors alike, reflecting optimism and confidence about the year ahead.\n\nAlthough trading activity is usually subdued, the session symbolises optimism and confidence in the markets as investors look forward to achieving their financial milestones in the new Samvat year.\n\nOver the past 10 years, the Nifty has closed in positive territory on eight occasions during the special trading session, indicating a historically positive trend. Although the Nifty has ended higher eight times, it has never recorded a gain of more than 1%.", "source": "LiveMint Markets", "pub_date_str": "05 Nov 2026, 08:07 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Here's what the Democratic election rout could mean for the U.S. economy", "full_content": "The Democratic midterm election sweep could result in changes in economic policies related to trade, spending priorities and artificial intelligence. But the biggest forces shaping the economy aren't going to change just because the party in power did.\n\nAffordability pressures , heavy levels of government spending and growth that is dependent on the artificial intelligence tail wind are likely to persist, economists say. And all of those factors pose risks to the economy.\n\n\"It's in a very kind of fragile place, and I don't know that it would take a lot to push the economy off the rails, and recession becomes a much greater risk,\" said Mark Zandi, chief economist at Moody's Analytics. \"That isn't the case at the moment, but I don't think that's gone away.\"\n\nZandi said he had been worried before the election that the economy was under threat from inflation, an underwhelming labor market and geopolitical dangers, and remains concerned now.\n\nDemocrats romped to upset wins in not only House and Senate races but also governor and other state races. But economic and foreign policy is largely set in the executive branch, and President Donald Trump remains far apart from his Democratic adversaries, though he said Wednesday he anticipates working with them.\n\n\"I don't expect any change in economic policy. The Iran war, the tariffs and trade policy, the heavy-handed immigration policy, all are done under executive order. They're not legislatively driven,\" Zandi said.\n\n\"The president thought they were good policies before the election. I don't know why he'd change his mind after the election,\" Zandi added. \"So I think they will continue to be policies that restrain growth and a     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
