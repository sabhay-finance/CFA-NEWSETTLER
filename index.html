rkets", "pub_date_str": "30 Oct 2026, 12:35 PM IST", "pub_date_relative": "15m ago"}, {"title": "BOJ declares victory in hitting price target, signals near-term hikes", "full_content": "", "source": "Investing.com News", "pub_date_str": "30 Oct 2026, 12:30 PM IST", "pub_date_relative": "19m ago"}, {"title": "Sanofi lifts expectations for 2026 sales growth, looks to M&A", "full_content": "", "source": "Investing.com News", "pub_date_str": "30 Oct 2026, 12:30 PM IST", "pub_date_relative": "19m ago"}, {"title": "November 2026 income tax calendar: Check key deadlines for TDS payments, tax certificates and ITR filing", "full_content": "November has several important income tax compliance deadlines for taxpayers and TDS deductors. These include monthly TDS payments, issuance of TDS and TCS certificates, and the extended income tax return ( ITR ) filing deadline for audit taxpayers.\n\nTax deducted or collected at source (TDS/TCS) during October 2026 must be deposited with the Central Government by 7 November.\n\nThis applies to deductors and collectors responsible for depositing tax deducted or collected during the previous month.\n\nAnother compliance requirement due on this date relates to uploading declarations received in Form 127 under the Income-tax Rules, 2026. This form is a declaration furnished by a buyer to the seller under Section 394 of the Income-tax Act, 2025, where the buyer seeks to avoid tax deduction at source (TDS).\n\nDeductors must issue TDS certificates in Form 132 by 14 November for tax deducted during September 2026 under the Income-tax Act, 2025.\n\nForm No 132 is a TDS certificate issued for tax deducted on specified transactions, including rent payments, transfers of immovable property, payments for technical services, and transfers of Virtual Digital Assets (VDAs).\n\nDeductors must issue this certificate within 15 days from the due date for filing the corresponding challan-cum-statement in Form No 141.\n\n15 November is an important compliance date for deductors and collectors.", "source": "LiveMint Money", "pub_date_str": "30 Oct 2026, 12:27 PM IST", "pub_date_relative": "22m ago"}, {"title": "Tokyo Electron Q2 profit jumps 27% as AI demand drives outlook, \u00a5150 bln buyback", "full_content": "", "source": "Investing.com News", "pub_date_str": "30 Oct 2026, 12:27 PM IST", "pub_date_relative": "22m ago"}, {"title": "Sanofi ADR earnings beat by $2.46, revenue topped estimates", "full_content": "", "source": "Investing.com News", "pub_date_str": "30 Oct 2026, 12:26 PM IST", "pub_date_relative": "23m ago"}, {"title": "BOJ Governor Ueda\u2019s comments at news conference", "full_content": "", "source": "Investing.com News", "pub_date_str": "30 Oct 2026, 12:24 PM IST", "pub_date_relative": "25m ago"}, {"title": "Japan\u2019s Nikkei slumps up to 3% as tech stocks tumble on AI worries", "full_content": "", "source": "Investing.com News", "pub_date_str": "30 Oct 2026, 12:24 PM IST", "pub_date_relative": "25m ago"}, {"title": "Binance halts withdrawals after record $6.3bn heist", "full_content": "World\u2019s largest crypto exchange says an engineer\u2019s laptop was compromised in one of sector\u2019s biggest security breaches", "source": "FT Markets", "pub_date_str": "30 Oct 2026, 12:24 PM IST", "pub_date_relative": "26m ago"}, {"title": "Biggest crypto heist in history: How Binance\u2019s $6 billion hack rattled markets and what it means for investors?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Crypto \u203a Biggest crypto heist in history: How Binance\u2019s $6 billion hack rattled markets and what it means for investors? The Economic Times daily newspaper is available online now. Read Today's Paper Biggest crypto heist in history: How Binance\u2019s $6 billion hack rattled markets and what it means for investors? SECTIONS Biggest crypto heist in history: How Binance\u2019s $6 billion hack rattled markets and what it means for investors? By Debaroti Adhikary , ETMarkets.com Last Updated: Oct 30, 2026, 12:41:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Binance is investigating a reported security breach estimated to have caused $6.3 billion in losses, with North Korea-linked hackers suspected by TRM Labs. The exchange says user funds are safe and has pledged to cover all losses.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\nBinance's initial investigation suggests that the security incident may involve a compromised DevOps engineer\u2019s laptop, which allowed an attacker to gain access to a service container and submit unauthorized withdrawal transactions. We have found no evidence of any wallet private key leak. We will share a detailed technical post-mortem once the investigation is complete and the facts are fully verified.The estimated total impact sits at around $6.3B. We have worked with blockchain partners to freeze affected assets, with ~$3 billion frozen on-chain so far.Binance will cover all losses from the SAFU fund and the company\u2019s funds. User funds are safe.", "source": "Economic Times Markets", "pub_date_str": "30 Oct 2026, 12:23 PM IST", "pub_date_relative": "26m ago"}, {"title": "Sanofi Q3 earnings blow past expectations on Dupixent strength; hikes FY guidance", "full_content": "", "source": "Investing.com News", "pub_date_str": "30 Oct 2026, 12:22 PM IST", "pub_date_relative": "27m ago"}, {"title": "Swiss National Bank 9-month profit at at 44.2 bln francs as franc weakens", "full_content": "", "source": "Investing.com News", "pub_date_str": "30 Oct 2026, 12:22 PM IST", "pub_date_relative": "27m ago"}, {"title": "Reliance Group stocks ahead of Q2 results today: How Jio Platforms, RIL shares are performing? JPL-RIL earnings schedule", "full_content": "JPL Vaamanaa Sethi Published 30 Oct 2026, 12:21 PM IST Prefer Livemint on Google Reliance Group stocks ahead of Q2 results today : Mukesh Ambani-led Reliance Group stocks - Reliance Industries and newly listed Jio Platforms - are set to release their financial results for the quarter ending on 30 September, 2026, on Friday, 30 October.\n\nReliance Industries share price opened higher on Friday but soon lost momentum, slipping into negative territory and declining by less than 1%. The stock touched an intraday low of \u20b9 1,157.10 per share ahead of the company\u2019s earnings announcement.\n\nSimilarly, Jio Platforms share price reversed their initial gains after opening in the green during Friday\u2019s trading session. The stock declined by over 2.41%, hitting an intraday low during the session.\n\nBrokerage firm Kotak Institutional Equities expects Reliance Industries' consolidated EBITDA to increase 15% year-on-year (YoY) and 11.1% quarter-on-quarter (QoQ).\n\nAt the segment level, O2C EBITDA is projected to grow 47% YoY, while retail EBITDA is likely to decline marginally by 0.8% and oil and gas EBITDA is expected to fall 7.2%.\n\nThe brokerage expects the O2C business to benefit from strong SEZ refinery earnings, the absence of windfall tax impact, US ethane-based petrochemicals and a weaker rupee. In contrast, the retail business is likely to report relatively subdued performance, with revenue growth of 11.7% YoY and lower EBITDA margins. The oil and gas segment is also expected to remain weak due to declining production.\n\n\u201cWe expect consolidated EBITDA to decline 0.8% year-on-year (YoY) in the Retail segment, although it is likely to increase 7.2% quarter-on-quarter (QoQ).", "source": "LiveMint Markets", "pub_date_str": "30 Oct 2026, 12:21 PM IST", "pub_date_relative": "28m ago"}, {"title": "Alfa Laval refinances credit facility with \u20ac1 billion deal", "full_content": "", "source": "Investing.com News", "pub_date_str": "30 Oct 2026, 12:18 PM IST", "pub_date_relative": "31m ago"}, {"title": "Global Market: Chinese yuan hits four-year high, heads for fourth straight monthly gain", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Global Market: Chinese yuan hits four-year high, heads for fourth straight monthly gain Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market: Chinese yuan hits four-year high, heads for fourth straight monthly gain SECTIONS Global Market: Chinese yuan hits four-year high, heads for fourth straight monthly gain By Anupam Nagar , ETMarkets.com Last Updated: Oct 30, 2026, 12:17:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis China\u2019s yuan reached its strongest level against the US dollar in more than four years, supported by exporter dollar sales, robust exports and a weaker greenback. The currency has gained about 5% this year, while the PBOC\u2019s stronger daily fixing suggests policymakers are comfortable with its appreciation, though the pace may moderate.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "30 Oct 2026, 12:17 PM IST", "pub_date_relative": "32m ago"}, {"title": "Gig workers get a seat at the table as Centre notifies social security boards", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a Gig workers get a seat at the table as Centre notifies social security boards The Economic Times daily newspaper is available online now. Read Today's Paper Gig workers get a seat at the table as Centre notifies social security boards SECTIONS Gig workers get a seat at the table as Centre notifies social security boards By Yogima Seth Sharma , ET Bureau Last Updated: Oct 30, 2026, 12:16:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Ministry of Labour and Employment has notified the National Social Security Board for unorganised workers and gig workers. This board will enable the implementation of welfare schemes designed to address social security gaps. It will include representatives from government, companies, and civil society to ensure diverse input. The board is expected to meet regularly to discuss policies affecting these workers.\n\nCan new data protection law guard against SBI-like data breaches?\n\nKYB and KYC: Quick commerce, the Damani premium and what DMart must deliver \u2013 3rd and concluding part\n\nKYC and KYB: Inside Damani\u2019s DMart, the retail chain for the middle class. And stock for the long term? \u2013 Part 2 of 3\n\nWill it be a regulatory nightmare if an exchange lists on its own platform?\n\nKYC and KYB: Inside Damani\u2019s Avenue Supermarts that refuses to charge more \u2013 Part 1 of 3\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers", "source": "Economic Times Economy", "pub_date_str": "30 Oct 2026, 12:14 PM IST", "pub_date_relative": "35m ago"}, {"title": "Credit Agricole Q3 profit rises on investment banking strength", "full_content": "", "source": "Investing.com News", "pub_date_str": "30 Oct 2026, 12:12 PM IST", "pub_date_relative": "37m ago"}, {"title": "Retail investors borrow \u20b92,227 crore via MTF to buy Jio Platforms shares on listing debut", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nIndividual investors borrowed \u20b9 2,227 crore to buy shares of Jio Platforms on its trading debut, making it one of the five stocks with the highest amount of broker funding on 28 October.\n\nThose who missed getting shares in the initial public offering borrowed cash using the margin trading facility (MTF) to hop on to the Jio Platforms bandwagon.\n\nOf the borrowings of \u20b9 2,227 crore, an amount of \u20b9 2,182 crore was on the National Stock Exchange (NSE) and the remainder on the BSE. The MTF book on the NSE grew by \u20b9 2,337 crore on 28 October from a day before, of which 93% was directed towards financing purchases of Jio Platforms shares, according to exchange data.\n\nJio Platforms listed at a 27% premium to its issue price of \u20b9 1,119. The strong listing appears to have jacked up investor demand, with many turning to MTF to gain exposure to the stock on the same day.\n\nHDFC Bank was the most heavily funded stock on 28 October, with brokers financing purchases worth \u20b9 3,073 crore on the NSE. Reliance Industries and BSE Ltd were next with \u20b9 2,876 crore and \u20b9 2,433 crore in broker funding, respectively. Jio Platforms ranked next, attracting \u20b9 2,182 crore in financing on its debut day.\n\nThe NSE has the majority market share in terms of the MTF book. The NSE placed Jio Platforms in Group 1 on listing day, after which brokers followed suit by offering MTF on the stock. Group 1 securities are classified as highly liquid stocks.\n\nMTF-funded buying of \u20b9 2,000 crore in a stock is significant, considering that the average daily cash market turnover is about \u20b9 60,000 crore, making it equivalent to 3-4% of the market\u2019s daily turnover, said Shai Coelho, founder at Vtrender, a platform for traders.", "source": "LiveMint Markets", "pub_date_str": "30 Oct 2026, 12:09 PM IST", "pub_date_relative": "40m ago"}, {"title": "Global Market: Bank of Japan achieves 2% inflation target after 13 years", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Global Market: Bank of Japan achieves 2% inflation target after 13 years Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market: Bank of Japan achieves 2% inflation target after 13 years SECTIONS Global Market: Bank of Japan achieves 2% inflation target after 13 years By Anupam Nagar , ETMarkets.com Last Updated: Oct 30, 2026, 12:10:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Bank of Japan declared its long-standing 2% inflation target achieved after more than 13 years, but kept its benchmark interest rate unchanged at 1.25%. Persistent inflation, rising oil and semiconductor prices, and yen weakness have fuelled expectations of another rate hike in December as policymakers gradually tighten monetary policy.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "30 Oct 2026, 12:06 PM IST", "pub_date_relative": "44m ago"}, {"title": "Global tech rout deepens as US earnings stoke AI spending fears", "full_content": "Japan\u2019s tech-heavy Nikkei 225 index declines, while Wall Street set to open lower", "source": "FT Markets", "pub_date_str": "30 Oct 2026, 12:05 PM IST", "pub_date_relative": "45m ago"}, {"title": "Asian Paints\u2019 strokes of price hikes to fight inflation yet to brighten margins", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nAsian Paints\u2019 consolidated gross margin felt the heat of high-cost inventory absorption in the September quarter (Q2FY27), sliding to a 15-quarter low of 39.7%, down around 350 basis points (bps) year-on-year. The cost of goods sold rose 24% year-on-year last quarter. Since this pressure was already anticipated, Asian Paints took a 5% price hike in Q2, following the 7% increase in Q1.\n\nThe raw material inflation scenario remains uncertain, so a further price increase of 3.5% has been announced for November. This also factors in the anti-dumping duty on key input titanium dioxide (TiO2). Asian Paints estimates a cost impact of 2-3% from the duty, which it is mitigating by rationalizing TiO2 use through alternative chemistries.\n\nDealer channel checks by Systematix Shares and Stocks (India) indicate that Asian Paints will take another price hike of 3-4%, effective 21 November, likely across product categories. This would take the cumulative hikes since April to 19-20%. Asian Paints has said price hikes will remain calibrated as it wants to avoid disrupting consumer demand amid elevated competition. Aggressive cost pass-through could lead to downtrading, given the discretionary nature of paints, eventually hurting market share.\n\nBesides price actions, Asian Paints is also banking on sourcing efficiencies and cost optimization to protect profitability. It has guided for a gross margin band of 41-43% and expects to maintain an Ebitda margin of 18-20% for FY27, aided by premiumization. In Q2FY27, Ebitda margin fell 200 bps year-on-year to 15.6%.\n\nThe first phase of its vinyl acetate emulsion (VAE) manufacturing facility commenced operations in September, and management expects the facility to yield an overall gross margin benefit of 300-500 bps across product segments.", "source": "LiveMint Markets", "pub_date_str": "30 Oct 2026, 12:02 PM IST", "pub_date_relative": "47m ago"}, {"title": "Greaves Cotton share price: Stock jumps almost 11% despite 81% fall in Q2 profit: What's fuelling rally? Buy or sell?", "full_content": "Greaves Cotton share price jumped nearly 11% on Friday, October 30, after the company reported its September-quarter results.\n\nGreaves Cotton shares rose as investors looked beyond the sharp fall in reported profit and focused on the company's underlying business growth. The profit decline was largely driven by one-off expenses rather than a broad-based slowdown in operations.\n\nStrong demand across its core businesses, higher revenue and improved operating earnings pointed to continued business momentum. The company's plans to expand overseas, invest in technology and develop higher-value products also helped drive future growth.\n\nThe stock gained as much as 10.6% to hit the day's high of \u20b9 207.50. However, the stock remained below its 52-week high of \u20b9 272, recorded in July 2026. Its 52-week low stood at \u20b9 120.05 in March 2026.\n\nGreaves Cotton shares have declined 11% in one month and 12% in three months, although they have gained 23% in six months. Over the past year, the stock has fallen 12%.\n\nGreaves Cotton reported an 81% year-on-year decline in net profit to \u20b9 5 crore for the quarter ended September 30, 2026, compared with \u20b9 26 crore in the corresponding period last year. The decline came amid exceptional expenses totalling \u20b9 32.75 crore during the quarter.\n\nRevenue increased 44.2% year-on-year to \u20b9 1,176 crore from \u20b9 815.5 crore. Earnings before interest, taxes, depreciation and amortisation (EBITDA) rose 41% to \u20b9 74 crore from \u20b9 52.3 crore. However, the EBITDA margin remained largely unchanged at 6.3%, compared with 6.4% in the year-ago quarter.\n\nThe exceptional expenses included \u20b9 12.66 crore related to the proposed initial public offering (IPO) of Greaves Electric Mobility Ltd, a material subsidiary of Greaves Cotton. The subsidiary decided not to proceed with the offering amid plans for a rights issue and related regulatory restrictions.", "source": "LiveMint Markets", "pub_date_str": "30 Oct 2026, 12:02 PM IST", "pub_date_relative": "48m ago"}, {"title": "Q2 Results Live: Varun Beverages Q3 Net Profit Rises 14% YoY; Reliance Slips, Sun Pharma Gains Ahead Of Earnings", "full_content": "Reliance Industries, Jio Platforms, Sun Pharmaceutical Industries, Bharat Electronics, Indian Oil Corporation, and Dixon Technologies, are among the 213 companies scheduled to announce their Q2 results today, October 30. Track the latest earnings announcements, financial performance, management commentary and stock market reaction live on NDTV Profit.", "source": "NDTV Profit", "pub_date_str": "30 Oct 2026, 11:58 AM IST", "pub_date_relative": "51m ago"}, {"title": "Zota Health Care Q2 Review: Nirmal Bang Trims Target Price But Retains Rating; Details Inside", "full_content": "The brokerage expects revenues to clock a compound annual growth rate of 62% over FY26FY28E, driven by store additions, improved operations and continued network scale-up.", "source": "NDTV Profit", "pub_date_str": "30 Oct 2026, 11:50 AM IST", "pub_date_relative": "59m ago"}, {"title": "Talking Points This Week: AI Cash Burn, A Tiger Comeback And An India That Still Finds Its Own Path", "full_content": "India is not immune to higher oil or tighter global liquidity, yet its earnings base is broader, its domestic policy levers are still available, and its structural themes\u2014manufacturing scale, defence localisation, digital infrastructure, formalisation\u2014keep compounding underneath the noise.", "source": "NDTV Profit", "pub_date_str": "30 Oct 2026, 11:47 AM IST", "pub_date_relative": "1h ago"}, {"title": "UP PET 2026: Shoes Off, Jewellery Removed, Hair Checked As Candidates Face Strict Entry Checks", "full_content": "The PET is conducted by the Uttar Pradesh Subordinate Services Selection Commission (UPSSSC). It serves as a qualifying test for various Group B and Group C government posts in the state.", "source": "NDTV Profit", "pub_date_str": "30 Oct 2026, 11:43 AM IST", "pub_date_relative": "1h ago"}, {"title": "Amazon Shares Drop After Spending Soars, Online Business Slows", "full_content": "Amazon said it spent more than $77 billion on property and equipment in the third quarter, far more than analysts' estimates, while pursuing its effort to build data centers and fulfill demand for artificial intelligence services.", "source": "NDTV Profit", "pub_date_str": "30 Oct 2026, 11:43 AM IST", "pub_date_relative": "1h ago"}, {"title": "'IDBI Bank Was Handed To Us In Poor Shape': FM Sitharaman Hits Back At Rahul Gandhi Over Congress-Era Bad Loans", "full_content": "Finance Minister Nirmala Sitharaman accused the Congress of using banks to favour politically connected businesses, saying bad loans to companies such as Videocon, Winsome, ABG Shipyard and Kingfisher had left IDBI Bank in poor condition before the NDA government took charge.", "source": "NDTV Profit", "pub_date_str": "30 Oct 2026, 11:41 AM IST", "pub_date_relative": "1h ago"}, {"title": "'Ramayana': Revenue Dispute With Exhibitors Ends, More Theatres To Open Bookings For Ranbir-Starrer", "full_content": "'Ramayana: Part One's revenue-sharing deadlock has reportedly ended, but Bengaluru's Victory Cinema remains firm on its decision not to screen the film, citing differences over the proposed terms.", "source": "NDTV Profit", "pub_date_str": "30 Oct 2026, 11:38 AM IST", "pub_date_relative": "1h ago"}, {"title": "Escorts Kubota hikes tractor prices as Middle East war fuels cost pressures", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Agriculture \u203a Escorts Kubota hikes tractor prices as Middle East war fuels cost pressures The Economic Times daily newspaper is available online now. Read Today's Paper Escorts Kubota hikes tractor prices as Middle East war fuels cost pressures SECTIONS Escorts Kubota hikes tractor prices as Middle East war fuels cost pressures ET Online Last Updated: Oct 30, 2026, 11:43:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Escorts Kubota plans to implement price hikes on its tractor offerings in November 2026. The company cites inflation and geopolitical uncertainties as significant factors influencing this decision. Price adjustments will vary by model, variant, and geographical regions. These changes come after attempts to optimize costs and maintain operational efficiency. The increases aim to address the elevated expenses from manufacturing and logistics challenges.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\nCan new data protection law guard against SBI-like data breaches?\n\nKYB and KYC: Quick commerce, the Damani premium and what DMart must deliver \u2013 3rd and concluding part\n\nKYC and KYB: Inside Damani\u2019s DMart, the retail chain for the middle class. And stock for the long term? \u2013 Part 2 of 3\n\nWill it be a regulatory nightmare if an exchange lists on its own platform?\n\nKYC and KYB: Inside Damani\u2019s Avenue Supermarts that refuses to charge more \u2013 Part 1 of 3\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "30 Oct 2026, 11:38 AM IST", "pub_date_relative": "1h ago"}, {"title": "Nasdaq-100 futures fall as Amazon and Intel swoon after earnings: Live updates - CNBC", "full_content": "Nasdaq-100 futures fall as Amazon and Intel swoon after earnings: Live updates CNBC Stock market today: Dow, S&P 500, Nasdaq futures fall as Alphabet stock sells off, AI jitters return Yahoo Finance Stock Market News, Oct. 29, 2026: AI Jitters Spread as Intel, Amazon Results Disappoint WSJ Stock Market Today: Dow, S&P 500 and Nasdaq close lower for first time in 4 days, but most stocks rise MarketWatch Nasdaq Futures Dive 2% As Intel, Amazon Sell Off Investor's Business Daily", "source": "Google News Business", "pub_date_str": "30 Oct 2026, 11:33 AM IST", "pub_date_relative": "1h ago"}, {"title": "Motilal Oswal Multi Asset Omni Fund Of Funds: Multiple Asset Classes Through One Fund", "full_content": "Equity, debt, gold and silver respond differently to market conditions. This fund brings them together and actively manages the allocation, offering investors a single route to diversified exposure.", "source": "NDTV Profit", "pub_date_str": "30 Oct 2026, 11:33 AM IST", "pub_date_relative": "1h ago"}, {"title": "Intel Stock Crash: Can chipmaker revive its turnaround strategy?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News Powered By Intel Stock Crash: Can chipmaker revive its turnaround strategy? Written by Anupam Nagar , ETMarkets.com | Oct 30, 2026, 12:02:10 PM IST 1 / 7 Intel shares plunge over 20% Intel shares plunged more than 20% in after-hours trading on Thursday, October 29, after the chipmaker delivered a disappointing earnings outlook despite reporting strong revenue growth in the September quarter. Concerns over slowing PC demand, rising memory-chip prices and manufacturing bottlenecks weighed on investor sentiment. The selloff also raised fresh questions about the company's turnaround strategy. (Sources: The Wall Street Journal, CNBC)\n\nIntel reported third-quarter revenue of $16.5 billion, up 21% year-on-year, while adjusted earnings came in at 52 cents per share. Both figures exceeded or matched analyst expectations, reflecting stronger demand for data-centre and AI-related products. However, the upbeat quarterly performance failed to reassure investors as attention shifted to the company's weaker December-quarter forecast.\n\nIntel forecast fourth-quarter revenue of $15 billion to $16 billion, below analysts' expectations of around $17 billion. The company projected adjusted earnings of 25 cents per share, significantly lower than the market estimate of around 43 cents. The weaker-than-expected outlook intensified concerns that Intel's recovery could take longer than anticipated.\n\nIntel's data-centre and AI business emerged as a key growth driver, with revenue surging 78% year-on-year to $7.3 billion in the third quarter. Foundry revenue also climbed 58% to $6.7 billion.", "source": "Economic Times Markets", "pub_date_str": "30 Oct 2026, 11:33 AM IST", "pub_date_relative": "1h ago"}, {"title": "Trent Share Price Jumps Over 6% After Q2 Results. Should You Buy, Sell Or Hold?", "full_content": "Following the Q2 results, brokerages remained divided on Trent stock's outlook, with HSBC retaining its bullish stance, while Citi and Jefferies maintained cautious ratings.", "source": "NDTV Profit", "pub_date_str": "30 Oct 2026, 11:32 AM IST", "pub_date_relative": "1h ago"}, {"title": "A pharma giant is moving past one patent cliff \u2014 but another is already looming", "full_content": "\"This medicine could be one of our largest medicines in history,\" Novartis CEO Vas Narasimhan told CNBC on Tuesday, as the Swiss drugmaker backed remibrutinib, its experimental MS medicine, to generate more than $4 billion in peak annual sales.\n\nDays before, Barclays cut its forecast for the drug's peak sales after detailed results from two late-stage trials showed the drug had reduced relapses in MS patients by less than analysts expected.\n\nIt highlights a challenge for Novartis as it prepares to outline its long-term growth strategy in mid-November.\n\nThe drugmaker reported sales growth this week despite losing key patent protection for blockbuster heart drug Entresto. But Barclays analysts said that the market is already looking to the next patent cliff, with bestsellers Kisqali and Kesimpta facing patent expirations around 2032.\n\nThat's \"the market's bigger question,\" Barclays analysts said on Wednesday, noting Kisqali and Kesimpta expiries alone represent $18 billion in peak sales.\n\nAgainst that backdrop, Novartis has guided for $8 billion-plus in total sales of remibrutinib, including indications other than relapsing MS.\n\nAmit Bar-Or, a multiple sclerosis specialist at the University of Pennsylvania, told CNBC that remibrutinib appeared to offer a promising safety profile but was unlikely to control relapsing MS as effectively as high-efficacy antibodies like Novartis' own Kesimpta.\n\nHe added that the drug's biggest opportunity to expand the market could emerge if ongoing trials demonstrate a benefit in progressive multiple sclerosis, where treatment options remain limited.", "source": "CNBC Top News", "pub_date_str": "30 Oct 2026, 11:30 AM IST", "pub_date_relative": "1h ago"}, {"title": "A half-dozen Halloween charts to haunt and horrify investors", "full_content": "Warning: may contain graph(ic) content", "source": "FT Markets", "pub_date_str": "30 Oct 2026, 11:30 AM IST", "pub_date_relative": "1h ago"}, {"title": "Global Market: China stocks extend losing streak to 12 weeks as global AI selloff hits tech shares", "full_content": "Home ETPri arget price", "full_content": "Pranati Deva Published 30 Oct 2026, 11:28 AM IST Prefer Livemint on Google Suzlon Energy share price : Shares of Suzlon Energy plunged almost10% to a 52-week low of \u20b9 33.21 on Friday, October 30, after the renewable energy company reported its September-quarter results. The stock opened at \u20b9 36.09 before extending its losses.\n\nSuzlon shares have fallen 46% from their 52-week high of \u20b9 61.45, recorded in November 2025. The stock has declined 8% in one week, 13% in one month, 27% in three months, 38% in six months and 41% over the past year. However, it has delivered multibagger returns over the longer term, rising 455% in five years.\n\nSuzlon Energy reported a 69% year-on-year decline in consolidated net profit to \u20b9 394 crore for the September quarter, compared with \u20b9 1,279 crore a year earlier. Revenue, however, increased 26% to \u20b9 4,869 crore from \u20b9 3,866 crore, supported by record wind turbine deliveries and improved project execution.\n\nThe sharp reported profit decline largely reflected a high base in the year-ago quarter, when Suzlon recognised a one-time deferred tax asset benefit of \u20b9 891 crore. Excluding this benefit, comparable profit after tax rose 1.3% from \u20b9 389 crore in the September quarter of FY26.\n\nSequentially, net profit increased 29% from \u20b9 305 crore in the June quarter, while revenue grew 27% from \u20b9 3,819 crore. EBITDA stood at \u20b9 720 crore, broadly unchanged from \u20b9 721 crore a year earlier, but increased 21% from \u20b9 595 crore in the preceding quarter. The EBITDA margin contracted to 14.8% from 18.6% a year earlier and 15.6% sequentially.\n\nSuzlon recorded its highest-ever second-quarter wind turbine deliveries in India at 710 megawatts (MW), up 26% from 565 MW a year earlier. Commissioning jumped 196% year-on-year to 454 MW.", "source": "LiveMint Markets", "pub_date_str": "30 Oct 2026, 11:28 AM IST", "pub_date_relative": "1h ago"}, {"title": "Borosil shares skyrocket 16% after strong Q2 results | Is it time to book profits? Target price, stop loss here", "full_content": "Vaamanaa Sethi Published 30 Oct 2026, 11:26 AM IST Prefer Livemint on Google Borosil share price skyrocketed 16% in Friday's trading session after the company reported strong set of numbers for the quarter ending on 30 September, 2026, on Thursday.\n\nBorosil shares opened at \u20b9 255.40 apiece on NSE today, as compared to previous close of \u20b9 238.70 on Thursday and touched an intraday high of \u20b9 279.80 on 30 September.\n\nGlassware manufacturer Borosil reported a 40.5% year-on-year (YoY) growth in consolidated profit attributable to the company\u2019s owners at \u20b9 31.91 crore in the September quarter of FY27, compared with \u20b9 22.71 crore in the corresponding period last year.\n\nRevenue from operations increased 7.5% YoY to \u20b9 369.80 crore from \u20b9 344.13 crore in the year-ago quarter. Earnings before interest, tax, depreciation and amortisation (EBITDA) rose 32.7% to \u20b9 69 crore from \u20b9 52 crore. The EBITDA margin also improved to 18.7% from 14.19% in the September quarter of the previous financial year.\n\nMeanwhile, total expenses grew 4.2% to \u20b9 328.71 crore from \u20b9 315.60 crore. Total income, including other income, stood at \u20b9 371.55 crore during Q2 FY27, compared with \u20b9 346.07 crore in the corresponding quarter last year.\n\nOn a sequential basis, Borosil's consolidated profit attributable to owners surged 149.3% from \u20b9 12.80 crore in Q1 FY27 to \u20b9 31.91 crore in Q2 FY27. Revenue from operations climbed 43.6% quarter-on-quarter (QoQ) to \u20b9 369.80 crore from \u20b9 257.61 crore in the June quarter. Total expenses increased 35.4% to \u20b9 328.71 crore from \u20b9 242.80 crore during the same period.\n\nBorosil share price has witnessed a sharp recovery in the near term, gaining 15.48% over the past week. However, the recent rally comes after a period of weakness, with the stock declining 7.17% over the past month.", "source": "LiveMint Markets", "pub_date_str": "30 Oct 2026, 11:26 AM IST", "pub_date_relative": "1h ago"}, {"title": "Global Market: ECB may pause rate hikes after December amid growth risks", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a Global Market: ECB may pause rate hikes after December amid growth risks Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market: ECB may pause rate hikes after December amid growth risks SECTIONS Global Market: ECB may pause rate hikes after December amid growth risks By Anupam Nagar , ETMarkets.com Last Updated: Oct 30, 2026, 11:23:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis European Central Bank policymakers expect to raise interest rates by 25 basis points in December to counter energy-led inflation, before pausing further monetary tightening as rising bond yields are expected to weigh on economic growth and price pressures.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str" riday after Amazon and Intel shares slid following the companies' latest quarterly results.\n\nNasdaq-100 futures lost 2.1%, while futures tied to the S&P 500 slid 1%. Dow futures fell 104 points.\n\nIn Asia, Japan's Nikkei 225 slipped 2.63% while the Topix dropped 1.35%. The Kospi was down 4.74%, while the small-cap Kosdaq declined 4.08%. Australia's benchmark S&P/ASX 200 was 0.29% higher. Hong Kong's Hang Seng index was up 1.64% , while mainland China's CSI 300 fell 0.38%.\n\nAmazon shares lost 6% in extended trading after the company reported earnings and revenue for the third quarter that fell short of Wall Street's expectations . The company also posted negative free cash flow of $42.4 billion and maintained its 2026 capital expenditures forecast for $220 billion.\n\nIntel slid 21% after issuing a weak outlook for the current quarter, pointing to a slowdown in PCs. Revenue in the company's client computing and physical artificial intelligence group declined 5% from the year-ago quarter to $8.1 billion.\n\nSandisk also fell in extended trading, down 3% even as its fiscal first quarter results beat estimates. The data storage company announced an eight-for-one forward stock split.\n\nIn regular trading Thursday, Alphabet shares lost 12% after the company missed on earnings and revenue in the third quarter and posted negative free cash flow of $9.07 billion. The Google-parent's slide dragged the Nasdaq Composite to a 1.4% loss in the regular session, while the S&P 500 fell 0.3%.\n\nFriday marks the final trading day in October. The month has been rocky for the AI trade, with investors paying close attention to companies' spending around the build-out. Hyperscalers Alphabet and Microsoft haven't lifted their capital expenditures forecasts .", "source": "CNBC Top News", "pub_date_str": "30 Oct 2026, 12:48 PM IST", "pub_date_relative": "2m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Derivatives", "Portfolio Managem rice , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "30 Oct 2026, 12:39 PM IST", "pub_date_relative": "10m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Moneyview shares give 30% returns to allottees within a month of IPO listing | Buy, sell or hold? Experts' views, target", "full_content": "Asit Manohar Published 30 Oct 2026, 12:36 PM IST Prefer Livemint on Google Stocks to buy today | Shares to buy today | Moneyview shares: After listing at a strong premium of over 91%, Moneyview shares have remained under selling pressure throughout the month. However, the newly listed stock is still trading at a premium of over 30% to the upper price band of \u20b9 34 per equity share. Moneyview share price today opened flat at \u20b9 52.59 per share on the NSE and touched an intraday low of \u20b9 49.84, logging an intraday loss of over 5% against the previous close of \u20b9 52.64 per share. However, Moneyview shares saw some value buying and pared early-morning losses. The stock is currently around \u20b9 51.50 per share, up more than 30% against the upper price band of \u20b9 34.\n\nAccording to stock market experts, Moneyview shares are under downward pressure following their strong initial surge, driven by stretched valuations, rising credit and asset-quality risks, and profit-booking by early investors. They said that after listing at a heavy premium and rallying strongly, the stock is trading at a high multiple\u2014roughly 40 times FY26 reported earnings.\n\nSpeaking on the reason for the downtrend in Moneyview shares after a blockbuster debut on Dalal Street, Anuj Gupta, a SEBI-registered market expert, said, \u201cAs a digital credit and NBFC platform, Moneyview faces scrutiny over its loan book health.", "source": "LiveMint Markets", "pub_date_str": "30 Oct 2026, 12:36 PM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Equitas SFB shares tumble 27% in 2 days on CEO exit. More pain ahead?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Equitas SFB shares tumble 27% in 2 days on CEO exit. More pain ahead? JM Financial Share Price Choice International Share Price IIFL Capital Services Share Price Anand Rathi Share & Stock Brokers Share Price SMC Global Securities Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Equitas SFB shares tumble 27% in 2 days on CEO exit. More pain ahead? SECTIONS Equitas SFB shares tumble 27% in 2 days on CEO exit. More pain ahead? By Debaroti Adhikary , ETMarkets.com Last Updated: Oct 30, 2026, 12:35:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Equitas Small Finance Bank shares plunged 27% in two sessions after CEO and founder PN Vasudevan announced his resignation over a perceived conflict involving his daughter\u2019s NBFC.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "30 Oct 2026, 12:35 PM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Sanofi lifts expectations for 2026 sales growth, looks to M&A", "full_content": "", "source": "Investing.com News", "pub_date_str": "30 Oct 2026, 12:30 PM IST", "pub_date_relative": "19m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "November 2026 income tax calendar: Check key deadlines for TDS payments, tax certificates and ITR filing", "full_content": "November has several important income tax compliance deadlines for taxpayers and TDS deductors. These include monthly TDS payments, issuance of TDS and TCS certificates, and the extended income tax return ( ITR ) filing deadline for audit taxpayers.\n\nTax deducted or collected at source (TDS/TCS) during October 2026 must be deposited with the Central Government by 7 November.\n\nThis applies to deductors and collectors responsible for depositing tax deducted or collected during the previous month.\n\nAnother compliance requirement due on this date relates to uploading declarations received in Form 127 under the Income-tax Rules, 2026. This form is a declaration furnished by a buyer to the seller under Section 394 of the Income-tax Act, 2025, where the buyer seeks to avoid tax deduction at source (TDS).\n\nDeductors must issue TDS certificates in Form 132 by 14 November for tax deducted during September 2026 under the Income-tax Act, 2025.\n\nForm No 132 is a TDS certificate issued for tax deducted on specified transactions, including rent payments, transfers of immovable property, payments for technical services, and transfers of Virtual Digital Assets (VDAs).\n\nDeductors must issue this certificate within 15 days from the due date for filing the corresponding challan-cum-statement in Form No 141.\n\n15 November is an important compliance date for deductors and collectors.", "source": "LiveMint Money", "pub_date_str": "30 Oct 2026, 12:27 PM IST", "pub_date_relative": "22m ago", "cfa_topics": ["Financial Statement Analysis", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Tokyo Electron Q2 profit jumps 27% as AI demand drives outlook, \u00a5150 bln buyback", "full_content": "", "source": "Investing.com News", "pub_date_str": "30 Oct 2026, 12:27 PM IST", "pub_date_relative": "22m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Sanofi ADR earnings beat by $2.46, revenue topped estimates", "full_content": "", "source": "Investing.com News", "pub_date_str": "30 Oct 2026, 12:26 PM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Binance halts withdrawals after record $6.3bn heist", "full_content": "World\u2019s largest crypto exchange says an engineer\u2019s laptop was compromised in one of sector\u2019s biggest security breaches", "source": "FT Markets", "pub_date_str": "30 Oct 2026, 12:24 PM IST", "pub_date_relative": "26m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Biggest crypto heist in history: How Binance\u2019s $6 billion hack rattled markets and what it means for investors?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Crypto \u203a Biggest crypto heist in history: How Binance\u2019s $6 billion hack rattled markets and what it means for investors? The Economic Times daily newspaper is available online now. Read Today's Paper Biggest crypto heist in history: How Binance\u2019s $6 billion hack rattled markets and what it means for investors? SECTIONS Biggest crypto heist in history: How Binance\u2019s $6 billion hack rattled markets and what it means for investors? By Debaroti Adhikary , ETMarkets.com Last Updated: Oct 30, 2026, 12:41:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Binance is investigating a reported security breach estimated to have caused $6.3 billion in losses, with North Korea-linked hackers suspected by TRM Labs. The exchange says user funds are safe and has pledged to cover all losses.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\nBinance's initial investigation suggests that the security incident may involve a compromised DevOps engineer\u2019s laptop, which allowed an attacker to gain access to a service container and submit unauthorized withdrawal transactions. We have found no evidence of any wallet private key leak. We will share a detailed technical post-mortem once the investigation is complete and the facts are fully verified.The estimated total impact sits at around $6.3B. We have worked with blockchain partners to freeze affected assets, with ~$3 billion frozen on-chain so far.Binance will cover all losses from the SAFU fund and the company\u2019s funds. User funds are safe.", "source": "Economic Times Markets", "pub_date_str": "30 Oct 2026, 12:23 PM IST", "pub_date_relative": "26m ago", "cfa_topics": ["Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Sanofi Q3 earnings blow past expectations on Dupixent strength; hikes FY guidance", "full_content": "", "source": "Investing.com News", "pub_date_str": "30 Oct 2026, 12:22 PM IST", "pub_date_relative": "27m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Swiss National Bank 9-month profit at at 44.2 bln francs as franc weakens", "full_content": "", "source": "Investing.com News", "pub_date_str": "30 Oct 2026, 12:22 PM IST", "pub_date_relative": "27m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Reliance Group stocks ahead of Q2 results today: How Jio Platforms, RIL shares are performing? JPL-RIL earnings schedule", "full_content": "JPL Vaamanaa Sethi Published 30 Oct 2026, 12:21 PM IST Prefer Livemint on Google Reliance Group stocks ahead of Q2 results today : Mukesh Ambani-led Reliance Group stocks - Reliance Industries and newly listed Jio Platforms - are set to release their financial results for the quarter ending on 30 September, 2026, on Friday, 30 October.\n\nReliance Industries share price opened higher on Friday but soon lost momentum, slipping into negative territory and declining by less than 1%. The stock touched an intraday low of \u20b9 1,157.10 per share ahead of the company\u2019s earnings announcement.\n\nSimilarly, Jio Platforms share price reversed their initial gains after opening in the green during Friday\u2019s trading session. The stock declined by over 2.41%, hitting an intraday low during the session.\n\nBrokerage firm Kotak Institutional Equities expects Reliance Industries' consolidated EBITDA to increase 15% year-on-year (YoY) and 11.1% quarter-on-quarter (QoQ).\n\nAt the segment level, O2C EBITDA is projected to grow 47% YoY, while retail EBITDA is likely to decline marginally by 0.8% and oil and gas EBITDA is expected to fall 7.2%.\n\nThe brokerage expects the O2C business to benefit from strong SEZ refinery earnings, the absence of windfall tax impact, US ethane-based petrochemicals and a weaker rupee. In contrast, the retail business is likely to report relatively subdued performance, with revenue growth of 11.7% YoY and lower EBITDA margins. The oil and gas segment is also expected to remain weak due to declining production.\n\n\u201cWe expect consolidated EBITDA to decline 0.8% year-on-year (YoY) in the Retail segment, although it is likely to increase 7.2% quarter-on-quarter (QoQ).", "source": "LiveMint Markets", "pub_date_str": "30 Oct 2026, 12:21 PM IST", "pub_date_relative": "28m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Global Market: Chinese yuan hits four-year high, heads for fourth straight monthly gain", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Global Market: Chinese yuan hits four-year high, heads for fourth straight monthly gain Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market: Chinese yuan hits four-year high, heads for fourth straight monthly gain SECTIONS Global Market: Chinese yuan hits four-year high, heads for fourth straight monthly gain By Anupam Nagar , ETMarkets.com Last Updated: Oct 30, 2026, 12:17:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis China\u2019s yuan reached its strongest level against the US dollar in more than four years, supported by exporter dollar sales, robust istry of Labour and Employment has notified the National Social Security Board for unorganised workers and gig workers. This board will enable the implementation of welfare schemes designed to address social security gaps. It will include representatives from government, companies, and civil society to ensure diverse input. The board is expected to meet regularly to discuss policies affecting these workers.\n\nCan new data protection law guard against SBI-like data breaches?\n\nKYB and KYC: Quick commerce, the Damani premium and what DMart must deliver \u2013 3rd and concluding part\n\nKYC and KYB: Inside Damani\u2019s DMart, the retail chain for the middle class. And stock for the long term? \u2013 Part 2 of 3\n\nWill it be a regulatory nightmare if an exchange lists on its own platform?\n\nKYC and KYB: Inside Damani\u2019s Avenue Supermarts that refuses to charge more \u2013 Part 1 of 3\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers", "source": "Economic Times Economy", "pub_date_str": "30 Oct 2026, 12:14 PM IST", "pub_date_relative": "35m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Credit Agricole Q3 profit rises on investment banking strength", "full_content": "", "source": "Investing.com News", "pub_date_str": "30 Oct 2026, 12:12 PM IST", "pub_date_relative": "37m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Retail investors borrow \u20b92,227 crore via MTF to buy Jio Platforms shares on listing debut", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nIndividual investors borrowed \u20b9 2,227 crore to buy shares of Jio Platforms on its trading debut, making it one of the five stocks with the highest amount of broker funding on 28 October.\n\nThose who missed getting shares in the initial public offering borrowed cash using the margin trading facility (MTF) to hop on to the Jio Platforms bandwagon.\n\nOf the borrowings of \u20b9 2,227 crore, an amount of \u20b9 2,182 crore was on the National Stock Exchange (NSE) and the remainder on the BSE. The MTF book on the NSE grew by \u20b9 2,337 crore on 28 October from a day before, of which 93% was directed towards financing purchases of Jio Platforms shares, according to exchange data.\n\nJio Platforms listed at a 27% premium to its issue price of \u20b9 1,119. The strong listing appears to have jacked up investor demand, with many turning to MTF to gain exposure to the stock on the same day.\n\nHDFC Bank was the most heavily funded stock on 28 October, with brokers financing purchases worth \u20b9 3,073 crore on the NSE. Reliance Industries and BSE Ltd were next with \u20b9 2,876 crore and \u20b9 2,433 crore in broker funding, respectively. Jio Platforms ranked next, attracting \u20b9 2,182 crore in financing on its debut day.\n\nThe NSE has the majority market share in terms of the MTF book. The NSE placed Jio Platforms in Group 1 on listing day, after which brokers followed suit by offering MTF on the stock. Group 1 securities are classified as highly liquid stocks.\n\nMTF-funded buying of \u20b9 2,000 crore in a stock is significant, considering that the average daily cash market turnover is about \u20b9 60,000 crore, making it equivalent to 3-4% of the market\u2019s daily turnover, said Shai Coelho, founder at Vtrender, a platform for traders.", "source": "LiveMint Markets", "pub_date_str": "30 Oct 2026, 12:09 PM IST", "pub_date_relative": "40m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Global Market: Bank of Japan achieves 2% inflation target after 13 years", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Global Market: Bank of Japan achieves 2% inflation target after 13 years Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market: Bank of Japan achieves 2% inflation target after 13 years SECTIONS Global Market: Bank of Japan achieves 2% inflation target after 13 years By Anupam Nagar , ETMarkets.com Last Updated: Oct 30, 2026, 12:10:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Bank of Japan declared its long-standing 2% inflation target achieved after more than 13 years, but kept its benchmark interest rate unchanged at 1.25%. Persistent inflation, rising oil and semiconductor prices, and yen weakness have fuelled expectations of another rate hike in December as policymakers gradually tighten monetary policy.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "30 Oct 2026, 12:06 PM IST", "pub_date_relative": "44m ago", "cfa_topics": ["Economics", "Equity Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Global tech rout deepens as US earnings stoke AI spending fears", "full_content": "Japan\u2019s tech-heavy Nikkei 225 index declines, while Wall Street set to open lower", "source": "FT Markets", "pub_date_str": "30 Oct 2026, 12:05 PM IST", "pub_date_relative": "45m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Asian Paints\u2019 strokes of price hikes to fight inflation yet to brighten margins", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nAsian Paints\u2019 consolidated gross margin felt the heat of high-cost inventory absorption in the September quarter (Q2FY27), sliding to a 15-quarter low of 39.7%, down around 350 basis points (bps) year-on-year. The cost of goods sold rose 24% year-on-year last quarter. Since this pressure was already anticipated, Asian Paints took a 5% price hike in Q2, following the 7% increase in Q1.\n\nThe raw material inflation scenario remains uncertain, so a further price increase of 3.5% has been announced for November. This also factors in the anti-dumping duty on key input titanium dioxide (TiO2). Asian Paints estimates a cost impact of 2-3% from the duty, which it is mitigating by rationalizing TiO2 use through alternative chemistries.\n\nDealer channel checks by Systematix Shares and Stocks (India) indicate that Asian Paints will take another price hike of 3-4%, effective 21 November, likely across product categories. This would take the cumulative hikes since April to 19-20%. Asian Paints has said price hikes will remain calibrated as it wants to avoid disrupting consumer demand amid elevated competition. Aggressive cost pass-through could lead to downtrading, given the discretionary nature of paints, eventually hurting market share.\n\nBesides price actions, Asian Paints is also banking on sourcing efficiencies and cost optimization to protect profitability. It has guided for a gross margin band of 41-43% and expects to maintain an Ebitda margin of 18-20% for FY27, aided by premiumization. In Q2FY27, Ebitda margin fell 200 bps year-on-year to 15.6%.\n\nThe first phase of its vinyl acetate emulsion (VAE) manufacturing facility commenced operations in September, and management expects the facility to yield an overall gross margin benefit of 300-500 bps across product segments.", "source": "LiveMint Markets", "pub_date_str": "30 Oct 2026, 12:02 PM IST", "pub_date_relative": "47m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Greaves Cotton share price: Stock jumps almost 11% despite 81% fall in Q2 profit: What's fuelling rally? Buy or sell?", "full_content": "Greaves Cotton share price jumped nearly 11% on Friday, October 30, after the company reported its September-quarter results.\n\nGreaves Cotton shares rose as investors looked beyond the sharp fall in reported profit and focused on the company's underlying business growth. The profit decline was largely driven by one-off expenses rather than a broad-based slowdown in operations.\n\nStrong demand across its core businesses, higher revenue and improved operating earnings pointed to continued business momentum. The company's plans to expand overseas, invest in technology and develop higher-value products also helped drive future growth.\n\nThe stock gained as much as 10.6% to hit the day's high of \u20b9 207.50. However, the stock remained below its 52-week high of \u20b9 272, recorded in July 2026. Its 52-week low stood at \u20b9 120.05 in March 2026.\n\nGreaves Cotton shares have declined 11% in one month and 12% in three months, although they have gained 23% in six months. Over the past year, the stock has fallen 12%.\n\nGreaves Cotton reported an 81% year-on-year decline in net profit to \u20b9 5 crore for the quarter ended September 30, 2026, compared with \u20b9 26 crore in the corresponding period last year. The decline came amid exceptional expenses totalling \u20b9 32.75 crore during the quarter.\n\nRevenue increased 44.2% year-on-year to \u20b9 1,176 crore from \u20b9 815.5 crore. Earnings before interest, taxes, depreciation and amortisation (EBITDA) rose 41% to \u20b9 74 crore from \u20b9 52.3 crore. However, the EBITDA margin remained largely unchanged at 6.3%, compared with 6.4% in the year-ago quarter.\n\nThe exceptional expenses included \u20b9 12.66 crore related to the proposed initial public offering (IPO) of Greaves Electric Mobility Ltd, a material subsidiary of Greaves Cotton. The subsidiary decided not to proceed with the offering amid plans for a rights issue and related regulatory restrictions.", "source": "LiveMint Markets", "pub_date_str": "30 Oct 2026, 12:02 PM IST", "pub_date_relative": "48m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Q2 Results Live: Varun Beverages Q3 Net Profit Rises 14% YoY; Reliance Slips, Sun Pharma Gains Ahead Of Earnings", "full_content": "Reliance Industries, Jio Platforms, Sun Pharmaceutical Industries, Bharat Electronics, Indian Oil Corporation, and Dixon Technologies, are among the 213 companies scheduled to announce their Q2 results today, October 30. Track the latest earnings announcements, financial performance, management commentary and stock market reaction live on NDTV Profit.", "source": "NDTV Profit", "pub_date_str": "30 Oct 2026, 11:58 AM IST", "pub_date_relative": "51m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Talking Points This Week: AI Cash Burn, A Tiger Comeback And An India That Still Finds Its Own Path", "full_content": "India is not immune to higher oil or tighter global liquidity, yet its earnings base is broader, its domestic policy levers are still available, and its structural themes\u2014manufacturing scale, defence localisation, digital infrastructure, formalisation\u2014keep compounding underneath the noise.", "source": "NDTV Profit", "pub_date_str": "30 Oct 2026, 11:47 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Quantitative Methods", "Financial Statement Analysis", "Alternative Investments"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "'Ramayana': Revenue Dispute With Exhibitors Ends, More Theatres To Open Bookings For Ranbir-Starrer", "full_content": "'Ramayana: Part One's revenue-sharing deadlock has reportedly ended, but Bengaluru's Victory Cinema remains firm on its decision not to screen the film, citing differences over the proposed terms.", "source": "NDTV Profit", "pub_date_str": "30 Oct 2026, 11:38 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Escorts Kubota hikes tractor prices as Middle East war fuels cost pressures", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Agriculture \u203a Escorts Kubota hikes tractor prices as Middle East war fuels cost pressures The Economic Times daily newspaper is available online now. Read Today's Paper Escorts Kubota hikes tractor prices as Middle East war fuels cost pressures SECTIONS Escorts Kubota hikes tractor prices as Middle Ea     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
