elow and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Markets", "pub_date_str": "02 Nov 2026, 09:15 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "My wife and I are in our 70s. Should we pay off our 2.5% mortgage or invest in a stock market driven by AI?", "full_content": "\u201cWe are weighing up the wisdom of investing in a market driven by artificial intelligence.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "02 Nov 2026, 09:15 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "ITC shares to be in focus on Tuesday as Q2 net profit drops 18.5% on higher cigarette taxes", "full_content": "Diversified conglomerate ITC is likely to remain on investors\u2019 radar on Tuesday, November 3, after the company reported another set of weak numbers for the September quarter, weighed down by higher input costs and increased taxes on cigarettes, which hit profitability.\n\nThe company reported a consolidated net profit of \u20b9 4,229.33 crore after market hours on Monday, down 18.45% from \u20b9 5,186.55 crore in the July-September quarter a year ago. However, revenue from operations rose 43.85% to \u20b9 30,578.4 crore in the second quarter of FY27, compared with \u20b9 21,255.86 crore in the year-ago period.\n\nThe cigarettes business continued to face pressure from unprecedented tax increases, which affected legal industry volumes and raised the risk of consumers shifting to illicit products.\n\nOperating profit from its cigarettes business, which brings in the bulk of the group's earnings, fell more than 27% year on year to \u20b9 3,813 crore. ITC said it has introduced new variants and strengthened its portfolio to protect its market position.\n\nThe FMCG business sustained strong double-digit revenue growth of 19%, led by biscuits, snacks, noodles, spices and homecare products. However, sharp input cost increases weighed on the business, although improved product mix, cost management and calibrated price hikes helped expand segment EBITDA margins by over 50 basis points year-on-year.\n\nThe paperboards and packaging segment reported a strong recovery, with revenue rising 36% year-on-year and segment PBIT increasing 48%. Improved demand, pricing actions and strong performance in value-added products and exports supported growth, while elevated wood prices continued to pose a cost challenge.\n\nThe agri business recorded 12% revenue growth, driven by value-added products and leaf tobacco exports.", "source": "LiveMint Markets", "pub_date_str": "02 Nov 2026, 09:14 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Immigration Vs Inflation: Which Issue Could Swing The US Midterm Elections?", "full_content": "Polls show 48% of voters rank inflation and the cost of living as the top issue, while 62% disapprove of Trump's handling of it.", "source": "NDTV Profit", "pub_date_str": "02 Nov 2026, 09:13 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "SpaceX has big wireless dreams \u2014 and Boost Mobile may be its shortcut", "full_content": "In recent weeks there has been intense speculation surrounding SpaceX\u2019s ambitions in the cellular market with multiple acquisition targets suggested. Boost Mobile is the latest.", "source": "MarketWatch Top Stories", "pub_date_str": "02 Nov 2026, 09     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
