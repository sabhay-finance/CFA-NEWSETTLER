ome ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a Mansukh Mandaviya rolls out EPFO services on WhatsApp, starts auto-settlement of small inoperative accounts The Economic Times daily newspaper is available online now. Read Today's Paper Mansukh Mandaviya rolls out EPFO services on WhatsApp, starts auto-settlement of small inoperative accounts SECTIONS Mansukh Mandaviya rolls out EPFO services on WhatsApp, starts auto-settlement of small inoperative accounts PTI Last Updated: Nov 01, 2026, 06:27:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Union Labour & Employment Minister Mansukh Mandaviya launched EPFO services through WhatsApp for easier access. Subscribers can check their PF balance and transaction history conveniently using this platform. The automatic settlement for inoperative EPF accounts was also introduced, streamlining the process for beneficiaries. In total, around one lakh accounts will benefit from this initiative. The EPFO's commitment to evolve and focus on worker-centric innovations was emphasized during the celebration.\n\nYou can buy a walkie-talkie online. But can you legally use it?\n\nKYB and KYC: Quick commerce, the Damani premium and what DMart must deliver \u2013 3rd and concluding part\n\nKYC and KYB: Inside Damani\u2019s DMart, the retail chain for the middle class. And stock for the long term? \u2013 Part 2 of 3\n\nWill it be a regulatory nightmare if an exchange lists on its own platform?\n\nKYC and KYB: Inside Damani\u2019s Avenue Supermarts that refuses to charge more \u2013 Part 1 of 3\n\nCan new data protection law guard against SBI-like data breaches?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "01 Nov 2026, 06:27 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "EAM Jaishankar discusses Ukraine-Russia conflict solutions amid G20 summit", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a EAM Jaishankar discusses Ukraine-Russia conflict solutions amid G20 summit The Economic Times daily newspaper is available online now. Read Today's Paper EAM Jaishankar discusses Ukraine-Russia conflict solutions amid G20 summit SECTIONS EAM Jaishankar discusses Ukraine-Russia conflict solutions amid G20 summit ET Online Last Updated: Nov 01, 2026, 07:31:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India has engaged in discussions with Russia, Europe, and Ukraine regarding the ongoing conflict and its impact. These talks focused on preventing attacks on civilian shipping and restoring grain exports affected by Black Sea disruptions. External Affairs Minister S. Jaishankar emphasised the complexity of discussions around ceasing attacks on energy installations. Various interpretations of what constitutes energy installations have complicated these discussions.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\nSome elections matter more than you know: No crop changed in the fields, yet sugar, coffee and soya got cheaper in a day\n\nYou can buy a walkie-talkie online. But can you legally use it?\n\nKYB and KYC: Quick commerce, the Damani premium and what DMart must deliver \u2013 3rd and concluding part\n\nKYC and KYB: Inside Damani\u2019s DMart, the retail chain for the middle class. And stock for the long term? \u2013 Part 2 of 3\n\nWill it be a regulatory nightmare if an exchange lists on its own platform?\n\nKYC and KYB: Inside Damani\u2019s Avenue Supermarts that refuses to charge more \u2013 Part 1 of 3", "source": "Economic Times Economy", "pub_date_str": "01 Nov 2026, 06:21 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Companies promised AI gains \u2014 here's how the payoff showed up in earnings", "full_content": "Some companies are beginning to report financial benefits from artificial intelligence investments, as interest in the technology shifts from hype to measurable returns in the latest quarter.\n\nCorporate AI investment has surged as companies look to boost efficiency and become more profitable, reaching $581.7 billion in 2025, up 130% from the previous year, according to the Stanford HAI 2026 AI Index report .\n\nAs CEOs tout the tech's benefits and hyperscalers like Microsoft , Amazon , Google and Meta are expected to spend $700 billion combined this year on its infrastructure, investors are looking for measurable gains.\n\nNow, with third-quarter earnings season underway, some companies are beginning to put numbers around those benefits.\n\nSpanish banking giant Santander said Wednesday that it saw AI initiatives generate 194 million euros ($216 million) in business value in the first nine months of 2026 .\n\nSantander Chief Financial Officer Jos\u00e9 Garc\u00eda Cantera told CNBC that AI is helping the bank reduce low-value tasks so employees can focus on higher-value work.\n\n\"This affects both revenue and costs, so we are actually in the quarter where we can actually link directly to AI a positive contribution,\" Cantera said.\n\n\"AI is being embedded in all the processes that we are conducting at the bank, so it's really difficult to just say how much comes from AI, but clearly AI is improving the quality of our services to clients.\"", "source": "CNBC World Economy", "pub_date_str": "01 Nov 2026, 06:04 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Top Wall Street analysts are bullish on these 3 stocks for the long haul", "full_content": "The ongoing earnings season, Middle East tensions and buzz ahead of the U.S. midterm elections have been keeping investors busy. Further, worries about elevated artificial intelligence spending are weighing on investor sentiment.\n\nInvestors looking beyond the short-term noise and focusing on long-term returns can track top Wall Street analysts to pick the right stocks, backed by strong research.\n\nHere are three stocks favored by some of Wall Street's top pros, according to TipRanks, a platform that ranks analysts based on their past performance.\n\nThis week's first stock pick is Datadog , an AI-powered observability and security platform. The company will announce its results for the third quarter on Nov. 4. Datadog is seeing strong demand for its offerings, thanks to cloud migration and rapid AI adoption. TipRanks' KPIs tool for DDOG shows the growth in its customer base over the past few years amid increasing market penetration and growing adoption of its products.\n\nTipRanks Heading into Q3 FY26 earnings, Bank of America analyst Koji Ikeda reiterated a buy rating on Datadog stock and raised his price target to $335 from $305. The analyst noted that industry checks and data indicate that infrastructure software demand is strengthening, with AI increasingly driving usage and growth.\n\nIkeda called Datadog and Atlassian his top picks, saying that companies that can show that AI is a tailwind to growth could see their valuation rerate, even at premium multiples. He added that the total addressable market for observability is growing faster than anticipated, driven by accelerated growth of enterprise AI and the rapid ramp of consumer AI agents.\n\nThe five-star analyst believes that focus will be on revenue growth, which he estimates to be 28.7% for Q3 FY26 versus the Street's consensus of 29.1%. Ikeda thinks that the market is underestimating the growth prospects of DDOG 's security products.", "source": "CNBC Top News", "pub_date_str": "01 Nov 2026, 06:03 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Crocs stock jumped 25% after earnings. Here's why that might be just the beginning", "full_content": "Since CNBC flagged Crocs' depressed valuation on Oct. 13, the stock has surged 30%, fueled by a massive 25.5% post-earnings rally on Thursday.", "source": "CNBC Top News", "pub_date_str": "01 Nov 2026, 06:02 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Maruti Suzuki Hits Record Monthly Sales As Brezza Leads SUV Charge: Three Indicators To Watch", "full_content": "Maruti Suzuki achieved the milestone despite a high base following the previous GST rate cut. SUV sales touched an all-time monthly high of 73,058 units, while small car sales grew 38% year-on-year to 40,646 units.", "source": "NDTV Profit", "pub_date_str": "01 Nov 2026, 06:01 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "The midterm election could reshape the muni bond market. Here\u2019s what investors need to know", "full_content": "The outcome of Tuesday's election is expected to have broad implications across the market, including municipal bonds.\n\nThe spotlight has been on the battle for congressional control and whether Democrats will wrest the House of Representatives, the Senate or both from Republicans. But for the muni market, what happens at the state level could have bigger repercussions \u2014 at least in the near term.\n\nThere is an array of initiatives on ballots around the nation that could change tax laws and add to bond supply. Taxes matter to muni investors since the income received is free of federal tax, as well as state tax if the holder lives in the state where the bond is issued.\n\nDepending on the location, ballot measures are up for approval that would either provide tax breaks, or raise taxes on the wealthy.\n\n\"It's a complete bifurcation between red and blue states,\" said Dan Close, head of municipals at Nuveen. \"Blue states are trying to put in place graduated income tax structures, trying to capture more revenue from high-income earners. Red states are promoting affordability by trying to cut property taxes.\"\n\nRed states are those that predominantly vote Republican, while blue states swing toward Democrats.\n\nFor instance, California has a proposition known as the \" billionaire tax ,\" which would impose a one-time levy equal to 5% of the wealth of certain taxpayers with at least $1 billion in assets. The state also has a measure on the ballot that would make a temporary tax hike permanent on individuals earning over $371,000, adjusted annually for inflation. The tax is currently set to expire in 2031.\n\n\"The impact to the muni bond market will be to make the exemption more valuable,\" Close said of the possible passage of tax increases. Investors will likely seek shelter in the muni market, which would send bond prices higher, he noted.", "source": "CNBC Top News", "pub_date_str": "01 Nov 2026, 06:00 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Unicaja Q3 2026 slides show 8% profit gain, 95% payout ratio", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Nov 2026, 05:59 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Binance resumes withdrawals following $6.3 billion hack, says 90% of stolen user assets are covered", "full_content": "Binance said Sunday that it has resumed withdrawals of bitcoin and other cryptocurrencies following the record theft of around $6.3 billion in token assets from its hot wallets.\n\n\"First batch network now opened in phase one of withdrawals is $BTC bitcoin network,\" Binance said in an X post .\n\nIt later said withdrawals have also been restored for the Ethereum Network and BNB Smart Chain.\n\nThe exchange said Saturday that it has covered up to 90% of the assets in the heist announced Thursday.\n\nSeparately, the FBI said late Saturday that \u200bit has determined North \u200bKorea \u200bwas responsible for the \u2060theft.\n\nBinance also said it will continue to buy the remaining relevant token assets through market and over-the-counter channels until the covered amount reaches 100% for all tokens.\n\n\"All BTC, ETH, USDT, BNB, SOL, USDC, XRP, USD1, RLUSD, and ZEC are fully backed 100%,\" Binance said in a statement . \"Binance will absorb the financial impact of these stolen funds, not our users.\"\n\nThe exchange said the outstanding 10% consists of tokens outside its top 10 that are \"less liquid, which means they may take longer to source in the required amounts.\"", "source": "CNBC World Economy", "pub_date_str": "01 Nov 2026, 05:49 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Binance restarts customer withdrawals after $6.3bn heist", "full_content": "Crypto exchange to reimburse users whose assets were stolen in hack blamed on North Korea-linked group", "source": "FT Markets", "pub_date_str": "01 Nov 2026, 05:46 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Sun Pharma shares gain despite Q2 profit slips 36% YoY | Should you buy, sell or hold? What brokerage says, target price", "full_content": "Dhanya Nagasundaram Published 1 Nov 2026, 05:41 PM IST Prefer Livemint on Google Sun Pharmaceutical Industries shares ended 0.87% higher at \u20b9 1,778.25 apiece on the BSE on Friday, shrugging off a 36.36% year-on-year decline in consolidated net profit for the September quarter. The stock has gained 2.02% over the past week and 1.04% over the past two weeks.\n\nThe drugmaker reported a consolidated net profit of \u20b9 1,988.53 crore for the July-September quarter, compared with \u20b9 3,124.95 crore in the corresponding period last year. The decline was largely due to exceptional expenses linked to its proposed acquisition of Organon and litigation in the US.\n\nRevenue, however, continued to grow. Consolidated revenue from operations rose 11.9% year-on-year to \u20b9 16,198.71 crore from \u20b9 14,478.31 crore a year earlier.\n\nIndia remained a key growth driver, with formulation sales in the domestic market climbing 17.3% to \u20b9 5,552.3 crore. The segment contributed 34.5% to Sun Pharma's consolidated sales during the quarter.\n\nGlobal innovative medicines also supported revenue growth. Sales in this business rose 6.9% to around $356 million, accounting for 21.1% of the company's total sales. Emerging markets contributed another 20.7% to consolidated revenue.\n\nDuring the post-results earnings call, the company said growth in innovative medicines was supported by demand across the US and international markets, with products including Ilumya, Ciqua and Odumzo contributing to performance.\n\nHowever, higher costs weighed on the bottom line. Total expenses increased to \u20b9 12,287.83 crore during the quarter from \u20b9 10,780.62 crore in the year-ago period.\n\nSun Pharma reported exceptional charges of around \u20b9 1,269 crore, largely comprising approximately \u20b9 923 crore towards the settlement of a US generic-pricing antitrust litigation case and \u20b9 346 crore in expenses related to the proposed Organon acquisition.", "source": "LiveMint Markets", "pub_date_str": "01 Nov 2026, 05:41 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Tax twist for OMC stocks: Indian Oil, BPCL, HPCL shares in 2 Nov focus after this decision by Govt on petrol, diesel", "full_content": "IOC Sharmila Bhadoria Published 1 Nov 2026, 05:41 PM IST Prefer Livemint on Google Tax twist for OMC stocks: Shares of Indian Oil Corporation Limited (IOCL), Bharat Petroleum Corporation Limited (BPCL) and Hindustan Petroleum Corporation Limited (HPCL) will remain in focus on Monday following the central government\u2019s latest decision on fuel taxation.\n\nThe central government, on Saturday, October 31, raised windfall gains tax on export of diesel and aviation turbine fuel (ATF) and slashed the levy to zero on petrol for the fortnight beginning October 31.\n\nIOCL share price closed 0.12% lower at \u20b9 130 per share on BSE with a market capitalisation of \u20b9 1,83,576.10 crore on Friday, October 30. Higher diesel export duty can put pressure on export realisations from refining operations, whereas a cut on petrol export duty would bring some relief.\n\nBPCL stock closed 1.47% lower at \u20b9 284.30 per share on BSE with an Mcap of \u20b9 1,23,342.68 crore on Friday. HPCL share price ended 0.72% lower at \u20b9 339.50 per share on BSE with an MCap of \u20b9 72,239.57 crore.\n\nThe government marginally hiked duty on ATF exports to \u20b9 11/litre from \u20b9 10.5/litre for the fortnight. The special additional excise duty (SAED) rate also increased on diesel exports. The SAED, along with road and infrastructure cess on export of diesel surged from \u20b9 8.5 per litre to \u20b9 11.5 per litre.\n\nThe duty on petrol exports was also slashed to nil by the government on Saturday. Petrol exports duty stood at \u20b9 2.5 per litre earlier. The recent changes on petrol duty came months after the government imposed export duty on diesel and ATF in March.\n\nThe windfall tax was levied on fuels to increase their domestic availability amid the war in West Asia.", "source": "LiveMint Markets", "pub_date_str": "01 Nov 2026, 05:41 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Equity Investments", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "The Week Ahead: Q2 Earnings, PMI Data, US Jobs Report, IPO Listings In Focus", "full_content": "The September-quarter earnings season will remain in focus, with several major Indian companies scheduled to announce their results during the week.", "source": "NDTV Profit", "pub_date_str": "01 Nov 2026, 05:35 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Why AI is boosting Meta's ad business while hurting Google search", "full_content": "Google and Facebook have been dominant internet brands for the past two decades, turning billions of eyeballs into trillions in advertising dollars over that stretch. But with the ChatGPT era altering how consumers engage online, the companies are diverging.\n\nIn the third quarter , Meta's ad business grew more than twice as quickly as Google's Search and other unit, backing up Mark Zuckerberg's claim that his company's investments in artificial intelligence are leading to better targeting tools for brands to promote goods and services across Facebook and Instagram.\n\nGoogle's problem is that chatbots are becoming an alternative to search, leading consumers to do a lot less clicking on blue links, and thus hurting Google's ad revenue. Anthropic's Claude chatbot and Meta's recently launched Muse assistant are adding to the mix of options. Meanwhile, users are spending more time scrolling on Instagram, giving Meta more advertising opportunities.\n\n\"It's a double-edged sword, because as AI revolutionizes discovery, people might come across tools they like better than Google,\" Nate Elliott, an analyst covering AI at Emarketer, told CNBC in an email. \"If ChatGPT or Claude or Muse is better at helping them find what they're looking for, people's search habits might change for the first time in a generation. That's potentially catastrophic for Google's ad business.\"\n\nMeta's ad revenue increased 26% in the quarter from a year earlier to $63.1 billion, compared to 12% growth for Google's search division, which brought in $63.4 billion. That 14-point growth gap is the widest in Meta's favor since 2021, and it puts the two businesses neck and neck by size, though Google got an additional $11 billion in third-quarter revenue from YouTube.\n\nFollowing its disappointing third-quarter earnings report on Wednesday, Alphabet had its worst day ever on the stock market, plunging more than 12% and wiping out about $500 billion in market cap.", "source": "CNBC World Economy", "pub_date_str": "01 Nov 2026, 05:30 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "US critical minerals push delivers a gold rush \u2014 for Washington lobbyists", "full_content": "Billions in government backing have produced a flurry of deals but little increase in domestic production", "source": "FT Markets", "pub_date_str": "01 Nov 2026, 05:30 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Premada Oorali Box Office Collection Day 37: Kannada Sleeper Hit's Earnings Jump Over 60%", "full_content": "The film earned Rs 1.35 crore net on Day 37 from 747 shows.", "source": "NDTV Profit", "pub_date_str": "01 Nov 2026, 05:18 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Ahead of Market: 10 things that will decide stock market action on Monday", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Ahead of Market: 10 things that will decide stock market action on Monday The Economic Times daily newspaper is available online now. Read Today's Paper Ahead of Market: 10 things that will decide stock market action on Monday SECTIONS Ahead of Market: 10 things that will decide stock market action on Monday By Debaroti Adhikary , ETMarkets.com Last Updated: Nov 01, 2026, 05:16:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Sensex and Nifty ended the week up about 0.5%, supported by resilient large-cap, IT and healthcare stocks. However, midcap and smallcap indices fell as much as 2% amid rising crude oil prices, inflation concerns and a global technology sell-off.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "01 Nov 2026, 05:16 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Equity Investments", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "E100-compatible cars in India: Will motor insurance premiums rise, and what happens to coverage and claim settlements?", "full_content": "The Ministry of Road Transport and Highways (MoRTH) has amended the Central Motor Vehicles Rules, 1989, to formally recognise E100 alongside E85 for vehicles designed and certified to run on these higher ethanol blends. The amended rules provide a regulatory framework for manufacturers to bring E100-compatible vehicles to the market. However, the approval does not extend to conventional petrol cars or vehicles certified only for E20 fuel.\n\nFor buyers, the insurance implications are particularly relevant because fuel compatibility, engine protection and policy exclusions can affect whether a claim is accepted.\n\nThe good news is that E100 compatibility alone is not expected to result in higher motor insurance premiums. However, insurers will continue to assess these vehicles based on their design, repair costs and claims experience, industry experts said.\n\n\"These are factory-built, regulator-recognised vehicles rather than aftermarket conversions. We therefore see no inherent reason for E100-compatible vehicles to carry any premium loading,\" said Amit Agarwal, executive vice-president, retail underwriting (motor and health) and financial assurance, IndusInd General Insurance.\n\nThe introduction of E100-compatible vehicles does not automatically mean higher motor insurance premiums. Insurers consider several factors while pricing a policy, including the vehicle's make, model, variant, value , repair and replacement costs, safety features and claims experience.\n\nMotor insurance has two components: third-party liability and own-damage cover.\n\nThird-party premiums are determined by rates notified by MoRTH in consultation with the Insurance Regulatory and Development Authority of India (IRDAI). For private cars, these rates are linked to engine capacity.\n\nOwn-damage premiums, on the other hand, depend on the insured declared value (IDV), geographical location, cubic capacity, vehicle age and the insurer's claims experience.", "source": "LiveMint Money", "pub_date_str": "01 Nov 2026, 05:15 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "From Wall Street to D-Street: What history suggests for S&P 500 returns, impact on India stock market, Sensex, Nifty", "full_content": "The outcome of the November 2026 US midterm elections could have significant geopolitical and market implications for India, although the impact on domestic equities may be felt more through movements in crude oil prices, the dollar and US bond yields than through a direct shift in US policy towards New Delhi.\n\nEmkay Global Financial Services expects familiar trade and immigration-related frictions between India and the US to persist even if Democrats gain control of Congress. While a Democratic majority could increase scrutiny of President Donald Trump's tariff and immigration policies, it is unlikely to substantially limit his executive powers. For Indian markets, the bigger concern is the possibility of a renewed escalation in the Iran conflict after the elections, which could push crude oil prices higher, worsen India's balance of payments (BoP) position and put pressure on the rupee and equities.\n\nThe brokerage believes that a decline in the dollar, US Treasury yields and crude oil prices would be supportive of Indian equities. However, it cautions that the geopolitical backdrop could turn less favourable, with a possible escalation in the Iran conflict threatening to trigger another spike in oil prices.\n\nAgainst this backdrop, the US midterm elections will be closely watched by global investors. Historical data suggests that US equities have tended to perform well in the months following midterm elections, particularly when the result produces political gridlock. However, Emkay believes the current market environment is less favourable than in previous cycles, raising questions about whether the S&P 500 can repeat its historical post-election gains.\n\nAccording to Emkay Global Financial Services, the implications of a potential Democratic victory are likely to be more geopolitical than directly market-related for India.\n\nA Democratic-controlled Congress could intensify scrutiny of Trump's tariff decisions and immigration policies.", "source": "LiveMint Markets", "pub_date_str": "01 Nov 2026, 04:54 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Binance To Begin Customer Withdrawals In Phases After $6.3B Heist: What Phase 1 Includes", "full_content": "Binance's preliminary investigation suggested that the attackers gained access to systems associated with withdrawals and used them to facilitate unauthorised transfers from cryptocurrency wallets.", "source": "NDTV Profit", "pub_date_str": "01 Nov 2026, 04:51 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "GST refund new rules from November 1: here's what changes for businesses", "full_content": "The 57th GST council, at its October 8 meeting, approved several process reforms aimed at easing compliance for businesses. These changes include simplified registrations for small e-commerce sellers, faster refunds and easier norms for post supply discounts among others.\n\nThe council decisions implemented through administrative processes will be brought into effect in phases, starting from November 1, 2026.\n\nOne of the key changes is the move towards faster GST refund processing, which has traditionally been a time-consuming process. Under the existing framework, refund claims under Section 54 of the CGST Act are required to be processed within 60 days of receiving a complete application.\n\nHowever, businesses often face additional delays due to manual verification, repeated scrutiny and back-and-forth communication with tax officers. Even the initial acknowledgement of refund applications, which is required within 15 days from the claim submission, can take longer in practice.\n\nUnder the new system, full refund claim of excess balance in the electronic cash ledger will be sanctioned automatically by the system, without requiring any intervention from tax officers.\n\nFor refund claims on account of zero-rated supplies and inverted duty structure, 90% of the amount claimed will be sanctioned on provisional basis automatically by the system on the basis of identification and evaluation of risk.\n\nThis essentially means that eligible businesses will no longer have to wait for manual officer verification to receive the refund, potentially reducing processing delays and improving cash flow.\n\nEarlier, the facility of provisional refunds of up to 90% was available for specified refund categories, including those arising from zero-rated supplies. The latest reform extends this benefit to eligible refund claims arising from an inverted duty structure as well, according to a blog post by Taxguru .", "source": "LiveMint Money", "pub_date_str": "01 Nov 2026, 04:44 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Inter Kashi Vs FC Goa: Live Streaming, Telecast: When, Where To Watch ISL Match On TV, Online", "full_content": "Inter Kashi and FC Goa meet in an ISL 2026-27 clash, with both teams aiming to build momentum. Here's everything you need to know about the live streaming and telecast.", "source": "NDTV Profit", "pub_date_str": "01 Nov 2026, 04:30 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "AI stocks just lost $5 trillion \u2014 but history says the stock market's sweetest stretch starts now - Yahoo Finance", "full_content": "AI stocks just lost $5 trillion \u2014 but history says the stock market's sweetest stretch starts now Yahoo Finance US MARKET CALL: AI Spooking Investors Yardeni QuickTakes Markets Have Been Tricked, but Is There a Treat Around the Corner? Investing.com Wall Street's Earnings Boom Is Losing Speed: The Great AI Catch-Down Has Begun The Dark Side Of The Boom The Stock Market Is Roaring. It\u2019s (Basically) All From AI. WSJ", "source": "Google News Business", "pub_date_str": "01 Nov 2026, 04:30 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Binance resumes withdrawals for some major cryptocurrencies after $6 billion heist - CBS News", "full_content": "Binance resumes withdrawals for some major cryptocurrencies after $6 billion heist CBS News North Korea responsible for $6 billion Binance cryptocurrency hack, FBI says Fox Business Behind the Scenes of Crypto\u2019s Biggest Nightmare: a Record-Breaking Cyber Heist WSJ Binance resumes bitcoin, ether withdrawals after covering bulk of stolen $6.3 billion Reuters Binance hack spotlights North Korea\u2019s multibillion-dollar crypto theft operation NBC News", "source": "Google News Business", "pub_date_str": "01 Nov 2026, 04:05 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Binance Hack: Inside 24 hours at crypto\u2019s biggest-ever $6.3 bn internet bank robbery | Full story from 4:20 pm Thursday", "full_content": "Binance faced an unprecedented breach after more than $6 billion in digital assets flowed out of accounts linked to the exchange. Investigators attributed the attack to North Korean hacking group TraderTraitor. Binance pledged to cover losses, while industry partners froze some funds.", "source": "LiveMint Markets", "pub_date_str": "01 Nov 2026, 03:15 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Why your idle cash is quietly losing its value: Here's how to beat Inflation and get out of stagnant, low-interest traps", "full_content": "With inflation at 5.8%, savings accounts paying 2.7% to 3% lose purchasing power, despite growing balances. Keep three to six months of essential expenses accessible, then consider diversified investments for longer-term goals.&nbsp;", "source": "LiveMint Money", "pub_date_str": "01 Nov 2026, 03:15 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Dividend stocks, bonus shares, split, buyback issues in Nov 2026: Coal India, HUL, Infosys, Power Grid, others | List", "full_content": "Upcoming record dates: November 2026 brings a busy calendar of corporate actions, with companies including Coal India, Infosys, Hindustan Unilever and Power Grid setting record dates. Investors will also watch market performance after the Nifty 50 and Sensex rose in October.", "source": "LiveMint Markets", "pub_date_str": "01 Nov 2026, 03:11 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Festive-season clean-up: how to declutter your mutual fund and stock portfolio", "full_content": "Too many funds and stocks can make investments harder to track and manage. Here\u2019s how to weed out overlapping and underperforming holdings, rebalance your portfolio and keep your financial goals on track.", "source": "LiveMint Money", "pub_date_str": "01 Nov 2026, 03:07 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Global beverage majors advance India IPO plans, from DRHP filing to board approval", "full_content": "Carlsberg has filed an updated draft red herring prospectus for its potential IPO in India. Pernod Ricard continues to prepare for its proposed listing while awaiting board approval for its Indian business. Coca-Cola is exploring a potential IPO for its Indian bottling operations, emphasizing the value in the domestic market. These developments     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
