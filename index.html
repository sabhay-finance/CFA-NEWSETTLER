<script>
    // This variable will be injected during the build process
    const allData = {"general": [{"title": "Berkshire shares surge as Wall Street swoons amid AI fears", "full_content": "(This is the Warren Buffett Watch newsletter, news and analysis on all things Warren Buffett and Berkshire Hathaway. You can sign up here to receive it every Friday evening in your inbox.)\n\nBerkshire Hathaway shares roared past the S&P 500 index this week as investors moved money away from slumping tech stocks and moved into what appears to be the relative safety of a traditional conglomerate with relatively little exposure to artificial intelligence amid fears massive spending on data centers won't pay off .\n\nOne month ago, Berkshire's widely held B shares were underperforming the S&P by 13.6 percentage points for the year.\n\nWith help from three more record-high closes this week, Berkshire is now 5.8 percentage points ahead of the benchmark.\n\nBerkshire more than doubled its share repurchases last quarter to $9.6 billion, while operating earnings declined slightly, the company said on Saturday .\n\nBerkshire was up more than 5% this week while the S&P fell almost 2.7%.\n\nThe contrast is even sharper with the Nasdaq Composite , which fell 3.4% on the week.\n\nThursday's especially heavy tech selling pushed the index down more than 10% below its most recent high in what is commonly referred to as a \" correction ,\" but it did make up some of its lost ground Friday .", "source": "CNBC Top News", "pub_date_str": "07 Nov 2026, 07:36 PM IST", "pub_date_relative": "9m ago"}, {"title": "Berkshire Hathaway more than doubles buybacks in third quarter as earnings decline", "full_content": "Berkshire Hathaway said Saturday it accelerated its share repurchases during the third quarter, as operating and overall profits took a hit.\n\nThe Greg Abel-led conglomerate bought back $9.6 billion worth of Berkshire stock. That's more than double the $4.5 billion repurchased in the second quarter and brings the company's total buybacks for 2026 to about $14.4 billion.\n\nThe sharp increase came as Berkshire's operating earnings \u2014 those from wholly-owned businesses \u2014 fell year over year, as profits from its insurance business pulled back.\n\nBerkshire operating profits totaled $12.705 billion, down 5.8% from $13.485 billion in the year-earlier period. Insurance underwriting tumbled 43% year on year to $1.352 billion, while insurance investment income declined 14% to $2.734 billion. Berkshire's railroad, energy and manufacturing businesses all saw earnings grow year over year.\n\nThe company's overall earnings, which include Berkshire's sprawling stock market portfolio, also dropped 28% in the third quarter to $22.112 billion from $30.796 billion a year prior. Investment gains for the company fell nearly 50% to $9.407 billion.\n\nDespite the earnings pullback, Berkshire stock has outperformed recently amid a massive rotation out of technology stocks. Class A shares are up more than 12% over the past month, while the S&P 500 has dropped 5.5% in that time. Year to date, Berkshire has gained 13%, while the broad market index is up just 7.8%.\n\nBerkshire's five largest equity holdings remained the same in the third quarter: Alphabet , American Express , Apple , Bank of America and Coca-Cola .\n\nBerkshire's cash hoard also grew 3% in the third quarter $377.435 billion from $365.514 billion in the second quarter. However, excluding rail and utility cash along with T-bill payables, the conglomerate's cash holdings totaled $352.3 billion, down 1.9% quarter over quarter.", "source": "CNBC Finance", "pub_date_str": "07 Nov 2026, 07:32 PM IST", "pub_date_relative": "13m ago"}, {"title": "catalyst bancorp director Kirk Kleiser buys $30,254 in shares", "full_content": "", "source": "Investing.com News", "pub_date_str": "07 Nov 2026, 07:31 PM IST", "pub_date_relative": "14m ago"}, {"title": "A. O. Smith director Kevin Wheeler sells $963,284 in company stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "07 Nov 2026, 07:31 PM IST", "pub_date_relative": "15m ago"}, {"title": "Velocity Financial chief legal officer sells $57,600 in stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "07 Nov 2026, 07:30 PM IST", "pub_date_relative": "15m ago"}, {"title": "Will this week's blue wave election usher in a Democratic president in 2028?", "full_content": "In surfer slang, a wave that lasts a long time is a \"runner.\" A key question for investors is whether the blue wave that washed over the country Tuesday was that kind of wave, and could it ferry Democrats to victory in 2028.\n\nCNBC analyzed elections since 1938 and looked at the biggest midterm wave elections where the party in the White House lost seats to determine whether they portend anything about the presidential election two years later.\n\nTuesday's election was the biggest House seat loss for the incumbent party in the White House since 2018, but it only barely makes the historical Top 10. It ranks 10th in CNBC's analysis using an estimate of 41 House seats gained by the opposition party as close races are still being tallied . The largest loss came in 1938 when Democrats lost 72 House seats amid a renewed recession, opposition to court-packing by President Franklin Delano Roosevelt and the president's battle with conservatives in his own party. Roosevelt went on to win reelection two years later in 1940.\n\nIn more modern times, Republicans swept to power in the House in 2010 two years into Barack Obama's first presidential term, with Democrats losing 64 seats, though retaining control of the Senate. Obama went on to reelection two years later. Of the top four wave elections, which all occurred before a president's final term, the incumbent went on to win reelection each time.\n\nBut for the next five waves, the incumbent party lost, including John F. Kennedy beating Richard Nixon in 1960 after Republicans lost seats under President Dwight Eisenhower in 1958; and Joe Biden beating Donald Trump in 2020 after Republicans lost seats in 2018.\n\nJay Campbell, partner at Hart Associates, the Democratic pollster for the CNBC All-America Economic Survey , said the reason midterm waves may not carry forward is the importance of individual characters in presidential elections.\n\n\"A lot can happen in two years.", "source": "CNBC Top News", "pub_date_str": "07 Nov 2026, 07:30 PM IST", "pub_date_relative": "16m ago"}, {"title": "This retired professor has reinvented himself \u2014 as a Taylor Swift scholar", "full_content": "His niece convinced him to spend his retirement analyzing Taylor Swift lyrics. Now he\u2019s a successful podcaster at 72.", "source": "MarketWatch Top Stories", "pub_date_str": "07 Nov 2026, 07:30 PM IST", "pub_date_relative": "16m ago"}, {"title": "Christine Lagarde: Interview with Yomiuri Shimbun", "full_content": "On the glass ceiling and women in power \u2013 could you share your own experiences for Japanese women, not least because you know their situation as well?\n\nI discussed this topic a lot with Prime Minister Abe and his wife. He was determined to make a change for Japan at the time, and he had this programme called \u201cOne Million Women\u201d. He got one million additional women into the workplace by implementing quite a few policies that were really helpful, like giving more freedom to the municipalities to open childcare centres.\n\nSo thanks to Prime Minister Abe things changed a lot. And it helped women access positions of professional responsibility.\n\nAt the ECB you became the first female leader. Did you have any difficulties or challenges in terms of being the first woman to lead the ECB?\n\nIt\u2019s always challenging to be in a minority. In Governing Council meetings, when I look around the table, there are 27 people seated, and only two women. So that\u2019s definitely a minority. Isabel Schnabel, who is a Member of the Executive Board and who is stepping down at the beginning of January, and me. So just two. It\u2019s always a challenge when you\u2019re a minority, but I think when you reach that sort of high level, because you are the President, people have to accept that, because it\u2019s a matter of institutional strength and it\u2019s a matter of governance as well. But it\u2019s challenging, yes, of course.\n\nBut the situation has not changed from seven years ago. I mean, seven years ago, there was...\n\nThose decisions are made by the governments of the Member States and, typically, governments go for a man. First of all, because I think that while the pipeline of talented women is building up, this is only a recent development. And second, because people tend to choose other people who look like them. So you have many men in government, and they tend to appoint other men.\n\nI want to ask about monetary policy. Sorry to change to a serious question. How do you see the inflation outlook now?", "source": "ECB Press", "pub_date_str": "07 Nov 2026, 07:30 PM IST", "pub_date_relative": "16m ago"}, {"title": "Diwali shopping: Should you pay upfront or choose no-cost EMI for expensive purchases? Here\u2019s what buyers must know", "full_content": "Diwali is one of the biggest shopping occasions in India, with retailers and e-commerce platforms offering discounts on smartphones, televisions, refrigerators and other expensive consumer durables. For buyers planning big-ticket purchases, no-cost EMI offers can make spending easier by spreading payments over three, six or 12 months instead of paying the entire amount upfront.\n\nHowever, choosing between an upfront payment and no-cost EMI is not always straightforward. While no-cost EMI allows consumers to spread payments without directly bearing the interest, it does not necessarily make a purchase cheaper. Manufacturers or retailers typically absorb the interest cost, while buyers may still have to pay processing fees, GST and other charges.\n\nAn upfront payment, meanwhile, could help consumers negotiate an additional discount or receive cashback that may not be available on EMI transactions.\n\nHere's what buyers should consider before choosing between the two options.\n\n\"When a consumer opts for a no-cost EMI scheme, the purchase is turned into a loan, usually through a credit card, debit card or consumer durable loan, and repaid in equal monthly instalments. The lender still charges interest on the loan. The difference lies in who pays it,\" said Adhil Shetty, CEO of BankBazaar.\n\nAlthough the customer does not directly pay the interest, the lender still charges it. In most cases, the manufacturer or retailer bears this cost by paying interest to the lender or offering an upfront discount equivalent to the interest amount.\n\nFor instance, if a smartphone costs \u20b9 30,000 and is available on a three-month no-cost EMI, the buyer pays three instalments of \u20b9 10,000 each.\n\nAnanth Shroff, founder and CEO of DPDzero, explained that the manufacturer typically pays the lender an upfront subvention, effectively covering the interest cost. This allows the lender to finance an amount lower than the product's MRP, while the buyer's instalments add up to the listed price.", "source": "LiveMint Money", "pub_date_str": "07 Nov 2026, 07:27 PM IST", "pub_date_relative": "18m ago"}, {"title": "Berkshire Hathaway ploughs $9.6bn into share buybacks", "full_content": "New chief executive Greg Abel was a net seller of stocks as the conglomerate\u2019s shares beat the S&P 500", "source": "FT Markets", "pub_date_str": "07 Nov 2026, 07:23 PM IST", "pub_date_relative": "22m ago"}, {"title": "Dividend dhamaka: 4 high yield stocks from brokerages' Diwali stock picks for Samvat 2083- Annual return, target price", "full_content": "HEROMOTOCO CANBK Sharmila Bhadoria Published 7 Nov 2026, 07:16 PM IST Prefer Livemint on Google The Diwali 2026 Muhurat trading session is few hours away, with investors preparing for the auspicious special live trading session on NSE and BSE on Sunday, November 8. For investors who prioritise regular dividend income, alongside potential capital appreciation, here's a curated list of six dividend-paying stocks featured in brokerages' Diwali stock picks, offering attractive dividend yield.\n\nHCL Tech has announced a dividend of \u20b9 60 over the last twelve months. With this, its annual dividend yield stood at 3.96%. Its share price value closed at \u20b9 1438.60 per share on BSE on Friday, November 6.\n\nBPCL has announced a total of \u20b9 10 per equity share dividend over the last one year. Its annual dividend yield stood at 2.72%. Its share price value closed 0.63% higher at \u20b9 319 per share on BSE on Friday.\n\nCanara Bank\u2019s share price ended unchanged at \u20b9 122.80 per share on BSE on Friday. The financial lender has rewarded investors with \u20b9 4.20 per share dividend over the last one year. Its annual dividend yield stood at 3.02%.\n\nThe stock closed 0.45% higher at \u20b9 5530 per share on BSE on Friday. The company has paid \u20b9 187 per share dividend over the last 12 months. Its dividend yield stood at 3.47%.\n\n(Note: Dividend yields have been calculated based on the stocks' market prices as of one year ago.)\n\nCatch all the Business News , Market News , Breaking News Events, JIO IPO Listing Today LIVE and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.\n\nLog in to our website to save your bookmarks. It'll just take a moment.", "source": "LiveMint Markets", "pub_date_str": "07 Nov 2026, 07:16 PM IST", "pub_date_relative": "29m ago"}, {"title": "Berkshire Hathaway B earnings beat by $4.55, revenue topped estimates", "full_content": "", "source": "Investing.com News", "pub_date_str": "07 Nov 2026, 07:16 PM IST", "pub_date_relative": "29m ago"}, {"title": "Velocity Financial CFO Szczepaniak sells $36,000 stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "07 Nov 2026, 07:16 PM IST", "pub_date_relative": "29m ago"}, {"title": "Paccar executive chairman Mark Pigott sells $46 in common stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "07 Nov 2026, 07:16 PM IST", "pub_date_relative": "30m ago"}, {"title": "Meghalaya HC denies pension to ex-Assam Rifles rifleman, says voluntary discharge leads to forfeiture of past service", "full_content": "The Meghalaya High Court has dismissed a pension claim filed by a former Assam Rifles Rifleman who sought retirement benefits after serving for more than 13 years, holding that voluntary discharge from service on one's own request amounts to resignation and results in forfeiture of past service under the Central Civil Services ( Pension ) Rules, 1972, reported Live Law.\n\nThe court clarified that an employee cannot claim pensionary benefits under Rule 49(2) merely because he has completed 10 years of qualifying service if Rule 26(1), which provides for forfeiture of past service upon resignation, applies to his case.\n\nThe court also rejected the petitioner's challenge on the grounds of delay and laches, noting that he approached the authorities nearly 22 years after his discharge from service.\n\nThe court said: \u201cVoluntarily resignation from a post entails forfeiture of all past services and is therefore not entitled to pensionary benefits. Rule 26(1) placed in juxtaposition with Rule 49(2), it is apparent that since Rule 26(1) operates as a bar to future service benefits, therefore, Rule 49(2) would become inapplicable in such a scenario.\u201d\n\nThe petitioner, L. Pearlson, was appointed as a Rifleman (General Duty) in the Assam Rifles on January 3, 1986. He claimed that he was discharged from service on June 30, 1999, without voluntarily requesting discharge.\n\nAccording to him, his signatures had allegedly been obtained on a pre-typed document, which was subsequently used to establish that he had sought voluntary discharge.\n\nHowever, the respondents disputed his allegations, arguing that Pearlson had applied for premature discharge in 1998 on extreme compassionate grounds because of his wife's illness.\n\nThe authorities further maintained that he was aware that accepting discharge on his own request would make him ineligible for pensionary benefits.", "source": "LiveMint Money", "pub_date_str": "07 Nov 2026, 07:09 PM IST", "pub_date_relative": "36m ago"}, {"title": "World\u2019s No. 1 restaurant crowned as contest comes under increasing scrutiny", "full_content": "Asador Etxebarri in Atxondo, Spain, is the world's top restaurant.\n\nThat's according to The World's 50 Best Restaurants , which announced results on Wednesday evening in Lima, Peru. Asador Etxebarri, helmed by chef Bittor Arguinzoniz, sits in Basque Country and features grilled items like a charred beef chop, fresh mozzarella from the chef's buffalo, or house-made chorizo.\n\nChef Gaggan Anand's Gaggan in Bangkok, which combines progressive Indian cuisine with French, Thai and Japanese influences, was No. 2, and Alchemist in Copenhagen, from head chef Rasmus Munk, took the third spot.\n\nIndia returned to the top 50 for the first time since 2004, with Masque at No. 26 and NAAR at No. 49. Mainland China made the list for the first time since 2021, with Meet the Bund in Shanghai at No. 21 and Ru Yuan in Hangzhou at No. 36.\n\nChef-restaurateur Ferran Adri\u00e0 , who achieved worldwide renown with his avant-garde techniques at his now-closed restaurant El Bulli, received the SevenRooms Icon Award. Adria continues to support culinary research and education through the nonprofit El Bulli Foundation.\n\nThe 50, as the umbrella organization is called, creates lists of restaurants, bars, hotels and vineyards that it ranks as top in the world or region. It draws on industry networks to help rank establishments.\n\nFor years, The 50 has been seen as a kingmaker and an opportunity for restaurants and bars worldwide. Being \"on the list,\" many chefs and other restaurant-industry insiders have said, makes a huge difference for reservations and revenues.\n\nBut there's been increased scrutiny of the contest as well. Chef Ana Ro\u0161 of Hi\u0161a Franko in Slovenia, which was ranked 60th this year , posted on Instagram that she wouldn't be attending the Lima ceremony, saying she would rather invest resources \"in our guests, our team, our producers and the daily work of making the restaurant better.\"", "source": "CNBC Top News", "pub_date_str": "07 Nov 2026, 07:08 PM IST", "pub_date_relative": "37m ago"}, {"title": "Democrat shaping AI policy bought chip stocks despite backing congressional trading ban", "full_content": "Rep. Josh Gottheimer , a Democrat helping write his party's artificial intelligence agenda, has disclosed new purchases of AI-linked stocks \u2014 just months after voting to ban lawmakers and their families from buying individual shares.\n\nThe New Jersey Democrat disclosed an Oct. 12 purchase of between $1,001 and $15,000 of Benchmark Electronics stock, according to a filing released this week. His jointly owned Morgan Stanley account also bought up to $15,000 worth of Applied Materials shares on Oct. 26, following three earlier purchases of leading AI chipmaker Advanced Micro Devices .\n\nWhile there's no evidence of wrongdoing, the trades put Gottheimer's investments in the spotlight as Democrats prepare to take control of Congress in January, gaining new power to regulate and investigate the AI industry.\n\nGottheimer, a former Microsoft executive, sits on the House Financial Services subcommittee overseeing AI in finance, has introduced legislation on AI regulations and co-chairs a commission developing Democrats' broader AI agenda.\n\nGottheimer's spokesman, Haraden Bottomley, said the congressman turned over control of his investments to a third party with \"full investment discretion\" before taking office in 2017.\n\n\"Gottheimer is also awaiting approval from Congress of a blind trust. In the meantime, he has taken the extra step of setting up an independent trust,\" Bottomley said.\n\nDemocrats are already targeting the AI industry. Reps. Maxine Waters and Greg Casar introduced a resolution opposing taxpayer bailouts for AI companies, referred in part to Gottheimer's committee. Casar has also called for AI executives to testify under oath, while other Democrats are pushing to restrict data centers or halt new construction altogether.\n\nThe purchases also contrast with Gottheimer's longstanding support for restricting congressional stock trading .", "source": "CNBC World Economy", "pub_date_str": "07 Nov 2026, 07:00 PM IST", "pub_date_relative": "46m ago"}, {"title": "The AI trade is now counting on Anthropic\u2019s IPO \u2014 but it couldn\u2019t be happening at a worse time", "full_content": "The ongoing tech selloff is leading investors to wonder if Anthropic will delay its IPO or list at a discount.", "source": "MarketWatch Top Stories", "pub_date_str": "07 Nov 2026, 07:00 PM IST", "pub_date_relative": "46m ago"}, {"title": "Berkshire Hathaway steps up buybacks as operating profit falls", "full_content": "", "source": "Investing.com News", "pub_date_str": "07 Nov 2026, 06:52 PM IST", "pub_date_relative": "53m ago"}, {"title": "French presidential hopeful Melenchon pledges minimum wage rise, retirement at 60", "full_content": "", "source": "Investing.com News", "pub_date_str": "07 Nov 2026, 06:42 PM IST", "pub_date_relative": "1h ago"}, {"title": "Looking to invest in international funds? Only one scheme remains open for new investors amid fresh subscription curbs", "full_content": "Indian investors looking to diversify their portfolios through international mutual funds have fewer options again. A fresh suspension by Invesco Mutual Fund has left just one scheme accepting new systematic investment plan (SIP) registrations, while another continues to accept only lump-sum investments.\n\nThe latest restrictions also affect investors who already have SIPs running in three Invesco international schemes. From November 4, the fund house has stopped accepting instalments under existing SIPs in its Invesco India Pan European Equity Fund of Fund (FoF), Invesco India Global Equity Income FoF and Invesco India Global Consumer Trends FoF, according to Value Research. The suspension also covers fresh SIP registrations and switch-in transactions.\n\nAs of November 4, only two international mutual fund schemes were accepting fresh investments, according to Value Research. However, only one of them was allowing new SIP registrations.\n\nBaroda BNP Paribas Aqua FoF is currently the only scheme accepting both fresh lump-sum investments and new SIP registrations. PGIM India Global Select Real Estate Securities FoF is accepting lump-sum investments but has kept fresh SIP registrations closed.\n\nThe three Invesco schemes have stopped accepting fresh investments through lump-sum purchases and SIPs. Their existing SIP instalments have also been paused from November 4.\n\nInvestors who have already registered SIPs in the three Invesco schemes do not need to cancel their mandates immediately.\n\nInvesco has said that existing SIP registrations will remain in place and instalments will resume once the suspension is lifted. However, instalments falling due during the suspension period will not be processed.\n\nThis means investors may temporarily miss their planned investments, affecting the continuity of their investment schedules. They should check the fund house's subsequent notices for updates on when instalments will resume.", "source": "LiveMint Money", "pub_date_str": "07 Nov 2026, 06:40 PM IST", "pub_date_relative": "1h ago"}, {"title": "Small Savings, Big Goals: How Families Can Benefit From SBI's Lakhpati Recurring Deposit", "full_content": "The deposit tenure can be chosen from a range of three to 10 years. Depending on the maturity period and the depositor's category, customers are required to contribute different amounts each month.", "source": "NDTV Profit", "pub_date_str": "07 Nov 2026, 06:33 PM IST", "pub_date_relative": "1h ago"}, {"title": "Risk of Iran war escalation remains high despite Democratic sweep in U.S. midterm elections", "full_content": "The U.S. and Iran are careening toward renewed war despite growing hopes this week that the Democrats' decisive midterm election victory will bring the conflict to an end, analysts say.\n\nCrude oil prices fell more than 16% over the last five trading days after Vice President JD Vance publicly blamed the Republicans' stinging loss on the war. Vance's remarks raised questions about whether there is still support within the administration to continue the conflict with Iran.\n\nThe Democrats plan to use their comfortable majorities in both chambers of Congress to pass a war powers resolution that demands President Donald Trump end the war. But tensions in the Middle East have not eased since the election, and the Democrats aren't sworn in until January, the analysts say.\n\n\"Throughout the week, we were struck by the divergence between deepening escalation concerns in the Gulf and the headline driven off-ramp optimism of market participants thousands of miles away,\" Helima Croft, head of global commodity strategy at RBC Capital Markets, told investors in a note Friday.\n\nSeveral oil tankers have come under attack near Oman since the election, killing one seafarer, according to maritime security agencies. Iran's Houthi allies in Yemen continue to fire missiles at neighboring Saudi Arabia.\n\nMeanwhile, the U.S. military buildup continues, with a third carrier strike group en route to the region. The consulting group Rapidan Energy sees an 80% chance that fighting will resume as diplomacy stalls.\n\nPresident Donald Trump told reporters Thursday that he will make a decision soon on whether to attack Iran again.\n\n\"I would rather not destroy the rest of the country if possible but maybe I'll have to,\" Trump said in the Oval Office. \"You'll know soon enough.\"", "source": "CNBC Top News", "pub_date_str": "07 Nov 2026, 06:33 PM IST", "pub_date_relative": "1h ago"}, {"title": "Snapchat's AI Chatbot, Privacy Practices Face Scrutiny In West Virginia Lawsuit", "full_content": "Snapchat faces fresh scrutiny over child safety, AI chatbot risks and privacy practices as lawsuits against tech giants intensify, raising questions about safeguards for young users.", "source": "NDTV Profit", "pub_date_str": "07 Nov 2026, 06:31 PM IST", "pub_date_relative": "1h ago"}, {"title": "America doesn't like socialism. So why are socialists winning?", "full_content": "Democratic socialists just had their biggest election night yet.\n\nThere's just one complication: Most American voters don't actually like socialism.\n\nSix candidates backed by the Democratic Socialists of America won House seats Tuesday, giving the movement its largest foothold yet in Congress and greater clout in a Democratic Party already divided over how far left to go.\n\nThe victories, coming on the heels of New York City Mayor Zohran Mamdani's rise to power, mark another milestone for a movement that has spent years challenging the party establishment. Now, with Democrats sweeping control of Congress , the question is whether those electoral gains will translate into actual political power.\n\nThe results of the new CNBC Voter Poll show the potential hazard of handing too much power to the party's left flank. The survey of roughly 80,000 midterm voters found that 53% view socialism unfavorably, compared with 33% who viewed it favorably. Capitalism fared considerably better, with 56% expressing a positive view. Just 18% of voters identified themselves as democratic socialists.\n\nThat disconnect underscores both the opportunity and the challenge facing Democrats and their growing left flank. How the party reconciles the divide between reforming capitalism and fundamentally overhauling it could shape its legislative agenda in Congress, its economic message to voters and, ultimately, its direction heading into the 2028 presidential election.\n\nThe DSA's presence in Congress will be quadrupled when Tuesday's victors, all of whom won in safely Democratic districts, are sworn in.\n\nBut the projected Democratic landslide of more than 250 House seats could dilute their influence. Party leaders could afford to lose all eight DSA votes on most measures, leaving the group with far less bargaining power than it would wield in a narrowly controlled chamber.", "source": "CNBC Top News", "pub_date_str": "07 Nov 2026, 06:31 PM IST", "pub_date_relative": "1h ago"}, {"title": "\"House Feels Empty\": Sunita Ahuja Gets Emotional Recalling How Diwali Has Changed For Her", "full_content": "After living with Govinda in their Mumbai residence for nearly 38 years, Sunita Ahuja recently took viewers inside her house and spoke about how Diwali has changed.", "source": "NDTV Profit", "pub_date_str": "07 Nov 2026, 06:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "Anthropic IPO meets AI backlash after midterms show stinging rebuke of data centers", "full_content": "Americans were unequivocal at the ballot box this week as they expressed disdain for tech billionaires and mistrust of artificial intelligence. With that backdrop, Anthropic is about to try to go public.\n\nThe AI company is gearing up for a potentially historic IPO, likely targeting mid-November for its Nasdaq debut. CNBC reported on Friday that Anthropic investors see the company aiming for a valuation of $1 trillion to $1.5 trillion, down from a target of $2 trillion that had been floated in recent months.\n\nFrom Wall Street to Main Street, it's becoming a tougher environment for Anthropic. The Nasdaq on Thursday suffered its steepest drop in 19 months, and it's down to start November after October marked its worst month since March 2025. Chipmakers and neoclouds, the companies most closely tied to the AI buildout, are getting hit the hardest.\n\nVoters rebuked AI in Tuesday's midterm elections, while sending Democrats to sweeping congressional victories across the country. Candidates who advocated for more stringent AI regulation won handily in states like Michigan, Ohio, Texas and Georgia, which will all now have Democratic governors, and local communities opposed data center-related ballot measures in 40 out of 41 cases .\n\nMore than half of voters said AI data centers were a \"crucial\" or \"major factor\" in who they supported for Congress, according to an exit poll from NBC News.\n\n\"People don't want a data center going near them if it's just going to house AI that's going to help a big tech company profit,\" Maura Austin, a behavioral scientist at the University of Virginia, told CNBC. \"What Anthropic is doing when they're going public with such a high valuation is they're really leaning into that big tech, billionaire kind of caricature. I expect that's not going to go well with the public.\"\n\nAnthropic has long tried to position itself as a safety-conscious company that takes AI's potential risks and benefits seriously.", "source": "CNBC World Economy", "pub_date_str": "07 Nov 2026, 06:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "Cosm rides premium moviegoing wave with more immersive screenings and a wider library", "full_content": "The next big thing in premium large format theatrical viewing takes inspiration from the stars.\n\nCosm, an immersive entertainment technology company, got its start programming planetariums \u2014 its name a combination of \"cosmos\" and \"colosseum.\" The company's massive, domed screens first offered guests a view of the universe, now they mimic courtside seats at sports venues around the world and drop film fans into some of Hollywood's most iconic sets.\n\nAt a time when the theatrical industry is seeing its biggest growth from the sale of premium large format, or PLF, tickets , Cosm seeks to offer a fresh take on an elevated viewing experience. And it's quickly expanding both its footprint and its content library.\n\nSince 2024, Cosm has opened four theaters \u2014 near Los Angeles, Dallas, Atlanta and Detroit \u2014 with a Cleveland hub set to open in 2027. These experimental venues have garnered the attention of sports fans, screening live matchups in an arena-like environment. Showings often sell out, according to Cosm.\n\nMore recently, Cosm has partnered with Hollywood studios like Warner Bros., now a part of Skydance , to bring the likes of \"The Matrix,\" \"Willy Wonka & the Chocolate Factory,\" \"Harry Potter and the Sorcerer's Stone\" and \"It\" to its locations. Cosm recently signed a deal with Universal , which will bring \"Shrek\" to its domes in December.\n\nThe agreements mark a lucrative new chapter for the privately held Cosm, expanding its audience reach and viewing opportunities beyond timed, live events.\n\nAs a privately held company, Cosm doesn't disclose its financials. Tickets cost anywhere from $18 for a matinee to around $70 for prime seats or in-demand showings. That doesn't include added fees for concessions or items from special, themed menus tied to screenings.\n\nSony invested $100 million in the company in June, taking a minority stake and placing Sony Pictures Entertainment Chairman and CEO Ravi Ahuja onto its board of directors.", "source": "CNBC Top News", "pub_date_str": "07 Nov 2026, 06:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "'A New Height In Aviation History\u2019: IAF IL-76 Makes Highest-Ever Landing At Nyoma", "full_content": "An Indian Air Force IL-76MD has landed at Nyoma in Ladakh, at 13,629 feet, the highest altitude the aircraft has ever landed at anywhere in the world, the IAF said.", "source": "NDTV Profit", "pub_date_str": "07 Nov 2026, 06:29 PM IST", "pub_date_relative": "1h ago"}, {"title": "Anthropic\u2019s breakneck rise: What to know before the IPO", "full_content": "Anthropic began its journey as an under-the-radar research lab founded in 2021 by seven former OpenAI employees. Now, the company is poised to launch an historic public debut that could set the tone for the AI trade in 2027 and test investors\u2019 appetite for an entirely new asset class. CNBC explores Anthropic\u2019s rapid rise, its rivalry with OpenAI and its clash with the Pentagon, and what its public debut could mean for the AI trade.", "source": "CNBC Top News", "pub_date_str": "07 Nov 2026, 06:29 PM IST", "pub_date_relative": "1h ago"}, {"title": "Forget tech and hide out in these stocks instead, Goldman Sachs says", "full_content": "The giant Wall Street investment bank says there are plenty of quality buying opportunities even as market uncertainty remains.", "source": "CNBC Top News", "pub_date_str": "07 Nov 2026, 06:28 PM IST", "pub_date_relative": "1h ago"}, {"title": "These five stock groups could rally after Democrats' midterms sweep, analysts say", "full_content": "Clean energy firms, specialty REITs and airline companies and others may be beneficiaries of the 2026 U.S. midterm elections, per Wall Street analysts.", "source": "CNBC Top News", "pub_date_str": "07 Nov 2026, 06:24 PM IST", "pub_date_relative": "1h ago"}, {"title": "Four Songs Disallowed At Diljit Dosanjh's Indore Concert Over Concerns About Impact On Children", "full_content": "The District Child Protection Officer has issued directions to this effect to the manager of the concert venue following a complaint by Chandigarh-based Dr Punditrao Dharenavar, the officials added.", "source": "NDTV Profit", "pub_date_str": "07 Nov 2026, 06:20 PM IST", "pub_date_relative": "1h ago"}, {"title": "'First Learn Your Lines\u2019: Farah Khan Says Today\u2019s Actors Lack Confidence, Interfere In Every Department", "full_content": "Farah Khan has criticised the lack of confidence among today\u2019s actors, saying they want to interfere in everything from choreography and music to casting.", "source": "NDTV Profit", "pub_date_str": "07 Nov 2026, 06:10 PM IST", "pub_date_relative": "1h ago"}, {"title": "Diwali 2026 Lakshmi Puja Muhurat: Check City-Wise Shubh Timings, Amavasya Tithi", "full_content": "Drik Panchang recommends performing Lakshmi Puja during Pradosh Kaal when Amavasya Tithi is prevailing.", "source": "NDTV Profit", "pub_date_str": "07 Nov 2026, 06:07 PM IST", "pub_date_relative": "1h ago"}, {"title": "Diwali 2026 Puja Vidhi: Step-By-Step Lakshmi And Ganesh Puja At Home", "full_content": "While customs may vary across regions and families, the main steps include Sankalp, Ganesh Puja, Lakshmi Puja, offerings, aarti and lighting of diyas.", "source": "NDTV Profit", "pub_date_str": "07 Nov 2026, 06:04 PM IST", "pub_date_relative": "1h ago"}, {"title": "High Fares, Longer Journeys, Delays Make Special Trains Less Attractive To Passengers: Officials", "full_content": "Official said that while regular trains generally run on schedule, special trains are often delayed by several hours, causing uncertainty and inconvenience to passengers.", "source": "NDTV Profit", "pub_date_str": "07 Nov 2026, 06:02 PM IST", "pub_date_relative": "1h ago"}, {"title": "Diwali cheer missing? Nifty lights up, but your portfolio may be burning; what's driving the disconnect? SAMCO explains", "full_content": "Stock Market Outlook : Investors wondering why their stock portfolios are not rising despite the recent rally in the benchmark Nifty 50 may be overlooking one crucial factor: the market's gains are concentrated in a handful of heavyweight stocks, while midcaps, smallcaps and microcaps continue to struggle.\n\nAccording to Apurva Sheth, Head of Market Perspectives & Research at SAMCO Securities, the divergence between the performance of largecap stocks and the broader market explains why many investors are yet to see meaningful gains in their portfolios.\n\nOver the past month, the Nifty Top 10 Equal Weight Index surged 10.64%, significantly outperforming broader market indices. The index comprises the 10 heavyweight stocks in the Nifty 50, with each constituent assigned an equal weight of 10% and the index rebalanced every six months.\n\nIn contrast, the Nifty Midcap 150 declined 2.74% during the same period. The Nifty Smallcap 250 also fell 2.74%, while the Nifty Microcap 250 dropped 5.32%.\n\nThis divergence indicates that the recent market rally has not been broad-based, with gains concentrated in India's largest companies rather than extending across market capitalisations.\n\nSheth identified two major factors behind the divergence, the first being a valuation catch-up among heavyweight stocks.\n\nLargecap stocks were among the worst performers during the preceding market correction, which had been underway since January 2026. The correction pushed several heavyweight companies to relatively attractive valuations , creating room for a rebound as selling pressure eased and valuations normalised.\n\nThe performance of the 10 constituents of the Nifty Top 10 Equal Weight Index highlights this recovery. ICICI Bank and Infosys gained 16% each over the past month, followed by Bharti Airtel, which advanced 14.61%. Kotak Mahindra Bank rose 10.08%, while HDFC Bank gained 10%.", "source": "LiveMint Markets", "pub_date_str": "07 Nov 2026, 06:00 PM IST", "pub_date_relative": "1h ago"}, {"title": "Diwali 2026 Muhurat trading: Why do NSE, BSE break the holiday rule for special live trading session? Explained", "full_content": "India\u2019s stock markets will open for a special shortened session on Sunday as the country celebrates Diwali, its biggest festival, keeping alive a tradition that has survived the shift from handwritten ledgers and bustling trading floors to smartphones and algorithms.\n\nKnown as Muhurat trading, the ceremonial session marks the start of a new Hindu calendar year, called Samvat, for many of India\u2019s trading communities. The idea is simple: begin the year with a transaction intended to bring prosperity.\n\nBut this year\u2019s celebration comes against a mixed market backdrop. While a recent rebound has turned India into a relative bright spot amid the global tech selloff, equity benchmarks are ending Samvat 2082 down more than 3%, their worst annual performance in over a decade. Domestic markets are little changed from levels seen during Muhurat trading day two years ago.\n\nHere\u2019s what to know about one of the most enduring traditions of the Indian stock market:\n\nMuhurat trading is a special stock market session held on Diwali, the Hindu festival of lights. \u201cMuhurat\u201d refers to an auspicious period for beginning something new. For many Gujarati and Marwari business families, Diwali traditionally marks the end of one commercial cycle and the beginning of another. Conducting a transaction at the start of the new year is considered auspicious.\n\nThis year, NSE and BSE will hold Muhurat trading on Sunday, Nov. 8. A pre-open session will run from 2:05 p.m. to 2:20 p.m., followed by trading from 2:20 p.m. to 3:30 p.m. The trades aren\u2019t just ceremonial as orders executed result in regular settlement obligations.\n\nFor generations, merchant families in parts of India have used Diwali to reconcile accounts and open new ledgers for the coming business year. Central to the custom is the worship of Lakshmi, the Hindu goddess of wealth and prosperity.", "source": "LiveMint Markets", "pub_date_str": "07 Nov 2026, 05:57 PM IST", "pub_date_relative": "1h ago"}, {"title": "Jammu and Kashmir Opens Door For Top Private Universities, Sets 25% Quota For Locals in Admissions and Jobs", "full_content": "Chief Minister Omar Abdullah said the rules are designed to improve transparency, accountability and academic quality.", "source": "NDTV Profit", "pub_date_str": "07 Nov 2026, 05:52 PM IST", "pub_date_relative": "1h ago"}, {"title": "Vinod Kambli's Lost Cricketing Glory: Khalid Ansari On His Talent, Sachin Tendulkar And BCCI Support", "full_content": "Khalid Ansari recalled Vinod Kambli\u2019s exceptional early talent, saying some coaches once rated him ahead of Sachin Tendulkar. He also spoke about Kambli\u2019s struggles and whether the BCCI has provided enough support.", "source": "NDTV Profit", "pub_date_str": "07 Nov 2026, 05:51 PM IST", "pub_date_relative": "1h ago"}, {"title": "Bishan Bedi-Sunil Gavaskar Feud: How Khalid Ansari Bridged The Cricket Legends' Differences", "full_content": "Khalid Ansari revealed what made Bishan Bedi and Sunil Gavaskar clash, praised their strong principles and recalled how he convinced Gavaskar to put the past behind him and contribute to a book on Bedi.", "source": "NDTV Profit", "pub_date_str": "07 Nov 2026, 05:44 PM IST", "pub_date_relative": "2h ago"}, {"title": "ONGC shares: Venezuela oil project hopes lift focus after Q2 results | Should you buy? Key levels to watch", "full_content": "Dhanya Nagasundaram Published 7 Nov 2026, 05:43 PM IST Prefer Livemint on Google Oil and Natural Gas Corporation ( ONGC) shares will remain in focus after the company's finance head, Anupam Agarwal, said it expects to secure operatorship rights for two Venezuelan oil projects within the next three to six months. The company is in advanced discussions with the Venezuelan and US authorities, Agarwal said during an analyst call on Friday, according to a Reuters report.\n\nThe development comes ahead of the special one-hour Diwali Muhurat Trading session on Sunday, 8 November, marking the beginning of the new Hindu financial year, Samvat 2083. Indian stock exchanges will remain open for the special session from 2:20 pm to 3:30 pm, despite Sunday being a regular market holiday.\n\nAccording to the Reuters report, ONGC Videsh, the overseas investment arm of ONGC, has more than $500 million in pending dividends from its stakes in two Venezuelan projects \u2014 the San Cristobal oilfield and the Carabobo 1 field.\n\nAgarwal said the pending dividends would be adjusted once the new operatorship agreements are finalised. Under the proposed arrangement, ONGC would move beyond its existing role as an investor to operate the projects and sell their output.\n\nThe arrangement also includes a provision that could allow ONGC to acquire stakes in additional Venezuelan oilfields, he said.\n\nAgarwal said ONGC expects to secure full operatorship of the San Cristobal project, in which it holds a 40% stake, while Venezuelan state-owned oil company PDVSA owns the remaining interest. In the Carabobo project, ONGC would take up joint operatorship alongside other investors.\n\nONGC and other Indian companies collectively hold an 18% stake in the Carabobo project, while Spain's Repsol owns an 11% interest.\n\nAgarwal also said production from Russia's Sakhalin-1 project, in which ONGC holds a 20% stake, averaged around 183,000 barrels per day during April\u2013September.", "source": "LiveMint Markets", "pub_date_str": "07 Nov 2026, 05:43 PM IST", "pub_date_relative": "2h ago"}, {"title": "Muhurat trading, Diwali 2026: Stocks to buy in Samvat 2083 - Blue Star, CESC, Delhivery, Ingersoll - check share price", "full_content": "CESC Sharmila Bhadoria Published 7 Nov 2026, 05:39 PM IST Prefer Livemint on Google Samvat 2082: Nifty 50 and Sensex saw their biggest weekly gains in years just before the start of Samvat 2083. As investors await the Muhurat trading session, PL Capital sees strong upside potential in select mid and small-cap stocks including Blue Star , CES , Delhivery and Ingersoll-Rand (India).\n\nThe brokerage sees up to 56% upside in these stocks. As Nifty 50 closed Samvat 2082 with nearly 2.59% loss, market experts believe that the coming Samvat will see strong growth supported by attractive valuations, robust corporate earnings and policy support.\n\nBlue Star share price closed 0.73% higher at \u20b9 1580 per share on BSE with a market capitalisation of \u20b9 32,487.14 crore on BSE on Friday. The stock has delivered -11.48% return in one year.\n\nThe company is well-positioned to capitalise on India\u2019s structural cooling demand, supported by low RAC penetration, market share gains and expanding distribution. The RAC industry is expected to grow by 25% in the financial year 2026-27, highlighted PL Capital in its report. The company is expected to witness strong traction in data centre MEP, with order bookings expected to reach data centre business.\n\nPL Capital gave a \u2018Buy\u2019 rating for the stock with a target price of \u20b9 1783 per share. \u201cWe expect Revenue/EBITDA/PAT CAGR of 17.6%/18.1%/23.2% over FY26-29E. We maintain our positive view on the stock with a SOTP-based TP of INR1,783, implying 40x Sep\u201928E EPS.\u201d\n\nCESC share price closed 3.11% lower at \u20b9 126.20 per share on BSE with an MCap of \u20b9 16,728.70 crore on Friday. The stock has delivered -28% return in one year. The company is likely to benefit from its expanding renewable energy portfolio, alongside stable cash flows from its core distribution and generation businesses.\n\nThe brokerage gave \u2018Buy\u2019 rating with a target price of \u20b9 204 per share.", "source": "LiveMint Markets", "pub_date_str": "07 Nov 2026, 05:39 PM IST", "pub_date_relative": "2h ago"}, {"title": "Muhurat trading 2026: 80% to 90% \u2014 will Sensex, Nifty improve decadal strike rate on ceremonial Diwali session?", "full_content": "Diwali Muhurat Trading 2026 guide: After a strong rally over seven straight sessions, the Indian stock market is set for the ceremonial Muhurat Trading session on Diwali, i.e., 8 November 2026. The Muhurat Trading session 2026 will begin at 2:20 PM and end at 3:30 PM. Ahead of the special session on Sunday, investors and market observers are busy guessing whether the key indices Nifty 50, Sensex and Bank Nifty will maintain their track record and end higher on Sunday's special session or not.\n\nAccording to data available on HDFC Sky, from 2006 to 2025, the Nifty 50 index closed lower than its previous close on just five occasions: 2007, 2009, 2012, 2016, and 2017. The 50-stock index has been finishing higher since 2018. The 30-stock index Sensex finished lower on just four occasions: 2007, 2012, 2016, and 2017. So, in the last ten years, both Nifty 50 and Sensex have ended higher for the last eight straight sessions, and the key indices have ended higher on 8 out of 10 Muhurat Trading sessions in the last 10 years. This means the decadal strike rate for both the Sensex and the Nifty is 80%, and market observers expect it to rise to 90%.\n\nWhether this winning streak for the last eight years would continue on the ceremonial Muhurat Trading 2026 session on Diwali 2026 date , Sumeet Bagadia, Executive Director at Choice Broking, said, \u201c The broader bias remains positive, although some profit booking or consolidation may follow the sharp rally.\u201d\n\nExpecting a positive Muhurat Trading session 2026 on Sunday, Ganesh Dongre, AVP \u2014 Equity Research at Anand Rathi, said, \u201cDuring Muhurat Trading sessions, buying takes more during the early session and profit-booking triggers at the end of the session. This means we can expect the key indices to open with an upside gap and end below their opening levels.", "source": "LiveMint Markets", "pub_date_str": "07 Nov 2026, 05:36 PM IST", "pub_date_relative": "2h ago"}, {"title": "Tech companies face mounting child safety lawsuits while pushing AI into schools", "full_content": "Tech companies have spent years telling parents they're working to make their products safer for children. But ongoing jury trials, settlements and related litigation against the likes of Meta , Google and Snap suggest that they're not doing enough.\n\nThe latest examples landed this week. Snap confidentially settled a case claiming that its technology caused severe psychological distress to two teenage users. Meta , TikTok and YouTube previously settled with the plaintiffs in the same suit. And Google was sued this week by the parents of a child who allegedly suffered a psychological crisis after chatting with the Gemini AI chatbot in Google Classroom.\n\nConcern is intensifying as artificial intelligence companies pursue trillion-dollar valuations, and established internet giants pour money into developing advanced AI models while pushing them into the classroom. Products and features intended to maximize engagement can have detrimental effects on users, thus warranting \"broader systemic changes in tech design, particularly when children are using them,\" said developmental psychologist Kate Blocker.\n\n\"I think it's so so important that children's safety is being considered when these products \u2014 AI, social media, et cetera \u2014 are being designed, and not after the fact as these problems emerge,\" said Blocker, the director of research and programs for the nonprofit Children and Screens.\n\nSnap's settlement this week, which spared CEO Evan Spiegel from testifying in a Los Angeles court, continues a general trend of tech companies attempting to shield themselves from public scrutiny due to the various high-profile child-safety related trials this year, said Joseph McNally, the director of emerging litigation at McNicholas & McNicholas.\n\nThe case was one of several lawsuits related to the social media personal injury trial that Meta and YouTube lost earlier this year.", "source": "CNBC World Economy", "pub_date_str": "07 Nov 2026, 05:30 PM IST", "pub_date_relative": "2h ago"}, {"title": "Gold Rallies 3% In Five Days: Why Investors Shouldn't Chase The Recovery Yet", "full_content": "Gold has rebounded 3% in five sessions, but unresolved Iran tensions, firm oil prices and a hawkish Fed outlook could keep the metal under pressure. Why investors should remain cautious.", "source": "NDTV Profit", "pub_date_str": "07 Nov 2026, 05:20 PM IST", "pub_date_relative": "2h ago"}, {"title": "Dhanteras Boost: NSE Electronic Gold Receipts Hit Record 2.27 Lakh Units", "full_content": "On Dhanteras, NSE witnessed festive demand for EGRs, from across the country, which has been met by gold suppliers participating in the segment. The trading volumes in the NSE EGR segment touched a record 2,27,692 units.", "source": "NDTV Profit", "pub_date_str": "07 Nov 2026, 05:20 PM IST", "pub_date_relative": "2h ago"}, {"title": "IIT Bombay's SINE to launch national Hub-and-Spoke initiative for startups in Nagpur", "full_content": "IIT Bombay's SINE has been identified Nagpur as the first region to develop a collaborative and connected regional startup ecosystem", "source": "NDTV Profit", "pub_date_str": "07 Nov 2026, 05:11 PM IST", "pub_date_relative": "2h ago"}, {"title": "US Labour Market Strengthens In October, Payrolls Rise By 165,000", "full_content": "The October increase was broad-based, with professional and business services leading the gains by adding 70,000 jobs.", "source": "NDTV Profit", "pub_date_str": "07 Nov 2026, 05:10 PM IST", "pub_date_relative": "2h ago"}], "cfa": [{"title": "Berkshire shares surge as Wall Street swoons amid AI fears", "full_content": "(This is the Warren Buffett Watch newsletter, news and analysis on all things Warren Buffett and Berkshire Hathaway. You can sign up here to receive it every Friday evening in your inbox.)\n\nBerkshire Hathaway shares roared past the S&P 500 index this week as investors moved money away from slumping tech stocks and moved into what appears to be the relative safety of a traditional conglomerate with relatively little exposure to artificial intelligence amid fears massive spending on data centers won't pay off .\n\nOne month ago, Berkshire's widely held B shares were underperforming the S&P by 13.6 percentage points for the year.\n\nWith help from three more record-high closes this week, Berkshire is now 5.8 percentage points ahead of the benchmark.\n\nBerkshire more than doubled its share repurchases last quarter to $9.6 billion, while operating earnings declined slightly, the company said on Saturday .\n\nBerkshire was up more than 5% this week while the S&P fell almost 2.7%.\n\nThe contrast is even sharper with the Nasdaq Composite , which fell 3.4% on the week.\n\nThursday's especially heavy tech selling pushed the index down more than 10% below its most recent high in what is commonly referred to as a \" correction ,\" but it did make up some of its lost ground Friday .", "source": "CNBC Top News", "pub_date_str": "07 Nov 2026, 07:36 PM IST", "pub_date_relative": "9m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Berkshire Hathaway more than doubles buybacks in third quarter as earnings decline", "full_content": "Berkshire Hathaway said Saturday it accelerated its share repurchases during the third quarter, as operating and overall profits took a hit.\n\nThe Greg Abel-led conglomerate bought back $9.6 billion worth of Berkshire stock. That's more than double the $4.5 billion repurchased in the second quarter and brings the company's total buybacks for 2026 to about $14.4 billion.\n\nThe sharp increase came as Berkshire's operating earnings \u2014 those from wholly-owned businesses \u2014 fell year over year, as profits from its insurance business pulled back.\n\nBerkshire operating profits totaled $12.705 billion, down 5.8% from $13.485 billion in the year-earlier period. Insurance underwriting tumbled 43% year on year to $1.352 billion, while insurance investment income declined 14% to $2.734 billion. Berkshire's railroad, energy and manufacturing businesses all saw earnings grow year over year.\n\nThe company's overall earnings, which include Berkshire's sprawling stock market portfolio, also dropped 28% in the third quarter to $22.112 billion from $30.796 billion a year prior. Investment gains for the company fell nearly 50% to $9.407 billion.\n\nDespite the earnings pullback, Berkshire stock has outperformed recently amid a massive rotation out of technology stocks. Class A shares are up more than 12% over the past month, while the S&P 500 has dropped 5.5% in that time. Year to date, Berkshire has gained 13%, while the broad market index is up just 7.8%.\n\nBerkshire's five largest equity holdings remained the same in the third quarter: Alphabet , American Express , Apple , Bank of America and Coca-Cola .\n\nBerkshire's cash hoard also grew 3% in the third quarter $377.435 billion from $365.514 billion in the second quarter. However, excluding rail and utility cash along with T-bill payables, the conglomerate's cash holdings totaled $352.3 billion, down 1.9% quarter over quarter.", "source": "CNBC Finance", "pub_date_str": "07 Nov 2026, 07:32 PM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Will this week's blue wave election usher in a Democratic president in 2028?", "full_content": "In surfer slang, a wave that lasts a long time is a \"runner.\" A key question for investors is whether the blue wave that washed over the country Tuesday was that kind of wave, and could it ferry Democrats to victory in 2028.\n\nCNBC analyzed elections since 1938 and looked at the biggest midterm wave elections where the party in the White House lost seats to determine whether they portend anything about the presidential election two years later.\n\nTuesday's election was the biggest House seat loss for the incumbent party in the White House since 2018, but it only barely makes the historical Top 10. It ranks 10th in CNBC's analysis using an estimate of 41 House seats gained by the opposition party as close races are still being tallied . The largest loss came in 1938 when Democrats lost 72 House seats amid a renewed recession, opposition to court-packing by President Franklin Delano Roosevelt and the president's battle with conservatives in his own party. Roosevelt went on to win reelection two years later in 1940.\n\nIn more modern times, Republicans swept to power in the House in 2010 two years into Barack Obama's first presidential term, with Democrats losing 64 seats, though retaining control of the Senate. Obama went on to reelection two years later. Of the top four wave elections, which all occurred before a president's final term, the incumbent went on to win reelection each time.\n\nBut for the next five waves, the incumbent party lost, including John F. Kennedy beating Richard Nixon in 1960 after Republicans lost seats under President Dwight Eisenhower in 1958; and Joe Biden beating Donald Trump in 2020 after Republicans lost seats in 2018.\n\nJay Campbell, partner at Hart Associates, the Democratic pollster for the CNBC All-America Economic Survey , said the reason midterm waves may not carry forward is the importance of individual characters in presidential elections.\n\n\"A lot can happen in two years.", "source": "CNBC Top News", "pub_date_str": "07 Nov 2026, 07:30 PM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Economics", "Financial Statement Analysis"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Christine Lagarde: Interview with Yomiuri Shimbun", "full_content": "On the glass ceiling and women in power \u2013 could you share your own experiences for Japanese women, not least because you know their situation as well?\n\nI discussed this topic a lot with Prime Minister Abe and his wife. He was determined to make a change for Japan at the time, and he had this programme called \u201cOne Million Women\u201d. He got one million additional women into the workplace by implementing quite a few policies that were really helpful, like giving more freedom to the municipalities to open childcare centres.\n\nSo thanks to Prime Minister Abe things changed a lot. And it helped women access positions of professional responsibility.\n\nAt the ECB you became the first female leader. Did you have any difficulties or challenges in terms of being the first woman to lead the ECB?\n\nIt\u2019s always challenging to be in a minority. In Governing Council meetings, when I look around the table, there are 27 people seated, and only two women. So that\u2019s definitely a minority. Isabel Schnabel, who is a Member of the Executive Board and who is stepping down at the beginning of January, and me. So just two. It\u2019s always a challenge when you\u2019re a minority, but I think when you reach that sort of high level, because you are the President, people have to accept that, because it\u2019s a matter of institutional strength and it\u2019s a matter of governance as well. But it\u2019s challenging, yes, of course.\n\nBut the situation has not changed from seven years ago. I mean, seven years ago, there was...\n\nThose decisions are made by the governments of the Member States and, typically, governments go for a man. First of all, because I think that while the pipeline of talented women is building up, this is only a recent development. And second, because people tend to choose other people who look like them. So you have many men in government, and they tend to appoint other men.\n\nI want to ask about monetary policy. Sorry to change to a serious question. How do you see the inflation outlook now?", "source": "ECB Press", "pub_date_str": "07 Nov 2026, 07:30 PM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Diwali shopping: Should you pay upfront or choose no-cost EMI for expensive purchases? Here\u2019s what buyers must know", "full_content": "Diwali is one of the biggest shopping occasions in India, with retailers and e-commerce platforms offering discounts on smartphones, televisions, refrigerators and other expensive consumer durables. For buyers planning big-ticket purchases, no-cost EMI offers can make spending easier by spreading payments over three, six or 12 months instead of paying the entire amount upfront.\n\nHowever, choosing between an upfront payment and no-cost EMI is not always straightforward. While no-cost EMI allows consumers to spread payments without directly bearing the interest, it does not necessarily make a purchase cheaper. Manufacturers or retailers typically absorb the interest cost, while buyers may still have to pay processing fees, GST and other charges.\n\nAn upfront payment, meanwhile, could help consumers negotiate an additional discount or receive cashback that may not be available on EMI transactions.\n\nHere's what buyers should consider before choosing between the two options.\n\n\"When a consumer opts for a no-cost EMI scheme, the purchase is turned into a loan, usually through a credit card, debit card or consumer durable loan, and repaid in equal monthly instalments. The lender still charges interest on the loan. The difference lies in who pays it,\" said Adhil Shetty, CEO of BankBazaar.\n\nAlthough the customer does not directly pay the interest, the lender still charges it. In most cases, the manufacturer or retailer bears this cost by paying interest to the lender or offering an upfront discount equivalent to the interest amount.\n\nFor instance, if a smartphone costs \u20b9 30,000 and is available on a three-month no-cost EMI, the buyer pays three instalments of \u20b9 10,000 each.\n\nAnanth Shroff, founder and CEO of DPDzero, explained that the manufacturer typically pays the lender an upfront subvention, effectively covering the interest cost. This allows the lender to finance an amount lower than the product's MRP, while the buyer's instalments add up to the listed price.", "source": "LiveMint Money", "pub_date_str": "07 Nov 2026, 07:27 PM IST", "pub_date_relative": "18m ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Berkshire Hathaway ploughs $9.6bn into share buybacks", "full_content": "New chief executive Greg Abel was a net seller of stocks as the conglomerate\u2019s shares beat the S&P 500", "source": "FT Markets", "pub_date_str": "07 Nov 2026, 07:23 PM IST", "pub_date_relative": "22m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Dividend dhamaka: 4 high yield stocks from brokerages' Diwali stock picks for Samvat 2083- Annual return, target price", "full_content": "HEROMOTOCO CANBK Sharmila Bhadoria Published 7 Nov 2026, 07:16 PM IST Prefer Livemint on Google The Diwali 2026 Muhurat trading session is few hours away, with investors preparing for the auspicious special live trading session on NSE and BSE on Sunday, November 8. For investors who prioritise regular dividend income, alongside potential capital appreciation, here's a curated list of six dividend-paying stocks featured in brokerages' Diwali stock picks, offering attractive dividend yield.\n\nHCL Tech has announced a dividend of \u20b9 60 over the last twelve months. With this, its annual dividend yield stood at 3.96%. Its share price value closed at \u20b9 1438.60 per share on BSE on Friday, November 6.\n\nBPCL has announced a total of \u20b9 10 per equity share dividend over the last one year. Its annual dividend yield stood at 2.72%. Its share price value closed 0.63% higher at \u20b9 319 per share on BSE on Friday.\n\nCanara Bank\u2019s share price ended unchanged at \u20b9 122.80 per share on BSE on Friday. The financial lender has rewarded investors with \u20b9 4.20 per share dividend over the last one year. Its annual dividend yield stood at 3.02%.\n\nThe stock closed 0.45% higher at \u20b9 5530 per share on BSE on Friday. The company has paid \u20b9 187 per share dividend over the last 12 months. Its dividend yield stood at 3.47%.\n\n(Note: Dividend yields have been calculated based on the stocks' market prices as of one year ago.)\n\nCatch all the Business News , Market News , Breaking News Events, JIO IPO Listing Today LIVE and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.\n\nLog in to our website to save your bookmarks. It'll just take a moment.", "source": "LiveMint Markets", "pub_date_str": "07 Nov 2026, 07:16 PM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Fixed Income"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Berkshire Hathaway B earnings beat by $4.55, revenue topped estimates", "full_content": "", "source": "Investing.com News", "pub_date_str": "07 Nov 2026, 07:16 PM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Meghalaya HC denies pension to ex-Assam Rifles rifleman, says voluntary discharge leads to forfeiture of past service", "full_content": "The Meghalaya High Court has dismissed a pension claim filed by a former Assam Rifles Rifleman who sought retirement benefits after serving for more than 13 years, holding that voluntary discharge from service on one's own request amounts to resignation and results in forfeiture of past service under the Central Civil Services ( Pension ) Rules, 1972, reported Live Law.\n\nThe court clarified that an employee cannot claim pensionary benefits under Rule 49(2) merely because he has completed 10 years of qualifying service if Rule 26(1), which provides for forfeiture of past service upon resignation, applies to his case.\n\nThe court also rejected the petitioner's challenge on the grounds of delay and laches, noting that he approached the authorities nearly 22 years after his discharge from service.\n\nThe court said: \u201cVoluntarily resignation from a post entails forfeiture of all past services and is therefore not entitled to pensionary benefits. Rule 26(1) placed in juxtaposition with Rule 49(2), it is apparent that since Rule 26(1) operates as a bar to future service benefits, therefore, Rule 49(2) would become inapplicable in such a scenario.\u201d\n\nThe petitioner, L. Pearlson, was appointed as a Rifleman (General Duty) in the Assam Rifles on January 3, 1986. He claimed that he was discharged from service on June 30, 1999, without voluntarily requesting discharge.\n\nAccording to him, his signatures had allegedly been obtained on a pre-typed document, which was subsequently used to establish that he had sought voluntary discharge.\n\nHowever, the respondents disputed his allegations, arguing that Pearlson had applied for premature discharge in 1998 on extreme compassionate grounds because of his wife's illness.\n\nThe authorities further maintained that he was aware that accepting discharge on his own request would make him ineligible for pensionary benefits.", "source": "LiveMint Money", "pub_date_str": "07 Nov 2026, 07:09 PM IST", "pub_date_relative": "36m ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Democrat shaping AI policy bought chip stocks despite backing congressional trading ban", "full_content": "Rep. Josh Gottheimer , a Democrat helping write his party's artificial intelligence agenda, has disclosed new purchases of AI-linked stocks \u2014 just months after voting to ban lawmakers and their families from buying individual shares.\n\nThe New Jersey Democrat disclosed an Oct. 12 purchase of between $1,001 and $15,000 of Benchmark Electronics stock, according to a filing released this week. His jointly owned Morgan Stanley account also bought up to $15,000 worth of Applied Materials shares on Oct. 26, following three earlier purchases of leading AI chipmaker Advanced Micro Devices .\n\nWhile there's no evidence of wrongdoing, the trades put Gottheimer's investments in the spotlight as Democrats prepare to take control of Congress in January, gaining new power to regulate and investigate the AI industry.\n\nGottheimer, a former Microsoft executive, sits on the House Financial Services subcommittee overseeing AI in finance, has introduced legislation on AI regulations and co-chairs a commission developing Democrats' broader AI agenda.\n\nGottheimer's spokesman, Haraden Bottomley, said the congressman turned over control of his investments to a third party with \"full investment discretion\" before taking office in 2017.\n\n\"Gottheimer is also awaiting approval from Congress of a blind trust. In the meantime, he has taken the extra step of setting up an independent trust,\" Bottomley said.\n\nDemocrats are already targeting the AI industry. Reps. Maxine Waters and Greg Casar introduced a resolution opposing taxpayer bailouts for AI companies, referred in part to Gottheimer's committee. Casar has also called for AI executives to testify under oath, while other Democrats are pushing to restrict data centers or halt new construction altogether.\n\nThe purchases also contrast with Gottheimer's longstanding support for restricting congressional stock trading .", "source": "CNBC World Economy", "pub_date_str": "07 Nov 2026, 07:00 PM IST", "pub_date_relative": "46m ago", "cfa_topics": ["Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "The AI trade is now counting on Anthropic\u2019s IPO \u2014 but it couldn\u2019t be happening at a worse time", "full_content": "The ongoing tech selloff is leading investors to wonder if Anthropic will delay its IPO or list at a discount.", "source": "MarketWatch Top Stories", "pub_date_str": "07 Nov 2026, 07:00 PM IST", "pub_date_relative": "46m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Berkshire Hathaway steps up buybacks as operating profit falls", "full_content": "", "source": "Investing.com News", "pub_date_str": "07 Nov 2026, 06:52 PM IST", "pub_date_relative": "53m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Looking to invest in international funds? Only one scheme remains open for new investors amid fresh subscription curbs", "full_content": "Indian investors looking to diversify their portfolios through international mutual funds have fewer options again. A fresh suspension by Invesco Mutual Fund has left just one scheme accepting new systematic investment plan (SIP) registrations, while another continues to accept only lump-sum investments.\n\nThe latest restrictions also affect investors who already have SIPs running in three Invesco international schemes. From November 4, the fund house has stopped accepting instalments under existing SIPs in its Invesco India Pan European Equity Fund of Fund (FoF), Invesco India Global Equity Income FoF and Invesco India Global Consumer Trends FoF, according to Value Research. The suspension also covers fresh SIP registrations and switch-in transactions.\n\nAs of November 4, only two international mutual fund schemes were accepting fresh investments, according to Value Research. However, only one of them was allowing new SIP registrations.\n\nBaroda BNP Paribas Aqua FoF is currently the only scheme accepting both fresh lump-sum investments and new SIP registrations. PGIM India Global Select Real Estate Securities FoF is accepting lump-sum investments but has kept fresh SIP registrations closed.\n\nThe three Invesco schemes have stopped accepting fresh investments through lump-sum purchases and SIPs. Their existing SIP instalments have also been paused from November 4.\n\nInvestors who have already registered SIPs in the three Invesco schemes do not need to cancel their mandates immediately.\n\nInvesco has said that existing SIP registrations will remain in place and instalments will resume once the suspension is lifted. However, instalments falling due during the suspension period will not be processed.\n\nThis means investors may temporarily miss their planned investments, affecting the continuity of their investment schedules. They should check the fund house's subsequent notices for updates on when instalments will resume.", "source": "LiveMint Money", "pub_date_str": "07 Nov 2026, 06:40 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Derivatives", "Portfolio Management"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Small Savings, Big Goals: How Families Can Benefit From SBI's Lakhpati Recurring Deposit", "full_content": "The deposit tenure can be chosen from a range of three to 10 years. Depending on the maturity period and the depositor's category, customers are required to contribute different amounts each month.", "source": "NDTV Profit", "pub_date_str": "07 Nov 2026, 06:33 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Risk of Iran war escalation remains high despite Democratic sweep in U.S. midterm elections", "full_content": "The U.S. and Iran are careening toward renewed war despite growing hopes this week that the Democrats' decisive midterm election victory will bring the conflict to an end, analysts say.\n\nCrude oil prices fell more than 16% over the last five trading days after Vice President JD Vance publicly blamed the Republicans' stinging loss on the war. Vance's remarks raised questions about whether there is still support within the administration to continue the conflict with Iran.\n\nThe Democrats plan to use their comfortable majorities in both chambers of Congress to pass a war powers resolution that demands President Donald Trump end the war. But tensions in the Middle East have not eased since the election, and the Democrats aren't sworn in until January, the analysts say.\n\n\"Throughout the week, we were struck by the divergence between deepening escalation concerns in the Gulf and the headline driven off-ramp optimism of market participants thousands of miles away,\" Helima Croft, head of global commodity strategy at RBC Capital Markets, told investors in a note Friday.\n\nSeveral oil tankers have come under attack near Oman since the election, killing one seafarer, according to maritime security agencies. Iran's Houthi allies in Yemen continue to fire missiles at neighboring Saudi Arabia.\n\nMeanwhile, the U.S. military buildup continues, with a third carrier strike group en route to the region. The consulting group Rapidan Energy sees an 80% chance that fighting will resume as diplomacy stalls.\n\nPresident Donald Trump told reporters Thursday that he will make a decision soon on whether to attack Iran again.\n\n\"I would rather not destroy the rest of the country if possible but maybe I'll have to,\" Trump said in the Oval Office. \"You'll know soon enough.\"", "source": "CNBC Top News", "pub_date_str": "07 Nov 2026, 06:33 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Anthropic IPO meets AI backlash after midterms show stinging rebuke of data centers", "full_content": "Americans were unequivocal at the ballot box this week as they expressed disdain for tech billionaires and mistrust of artificial intelligence. With that backdrop, Anthropic is about to try to go public.\n\nThe AI company is gearing up for a potentially historic IPO, likely targeting mid-November for its Nasdaq debut. CNBC reported on Friday that Anthropic investors see the company aim
