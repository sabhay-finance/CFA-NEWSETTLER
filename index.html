<script>
    // This variable will be injected during the build process
    const allData = {"general": [{"title": "Decoded: Sensex lost nearly 3300 points, Nifty dip 1000 since announcement of blockbuster GDP of India | Top 3 reasons", "full_content": "Stock market latest news today: The key benchmark indices of the Indian stock market have been reeling under the selling pressure, despite the announcement of a blockbuster GDP of India in the April to June 2026 quarter. When the Ministry of Statistics and Programme Implementation (MoSPI) released the GDP data for India's Q1 FY2026-27 on 31 August 2026, experts felt it could attract foreign investors, who have been net sellers in the Indian stock market for more than a year. However, to their surprise, India's GDP for Q1FY27 remained uneven for Dalal Street.\n\nThis was surprising because Asian counterparts to Dalal Street have performed well despite their economies performing comparatively worse than India's in the first quarter of the current financial year.\n\nWhen India's GDP for Q1FY27 was announced on 31 August 2026, the BSE Sensex had ended at 76,957, the Nifty 50 index at 24,080, and the Bank Nifty index at 58,025. By 10:00 AM on Friday, the Bank Nifty is oscillating around 55,500, down 2,500 points in September 2026. The Nifty 50 index is around 23,075, down around 1,000 points, whereas the Sensex today is around 73,675, down around 3,300 points from the date of release of the Indian GDP for the Q1FY27.\n\nAccording to stock market experts, the Indian stock market has failed to capitalise on the blockbuster GDP data release because it has been dictated by the global triggers post-release of the Q1FY27 GDP data.", "source": "LiveMint Markets", "pub_date_str": "25 Sep 2026, 11:22 AM IST", "pub_date_relative": "2m ago"}, {"title": "Goldman Sachs buys stake in Firstcry brand parent owner Brainbees Solutions | Check price, quantity traded", "full_content": "Global investment bank Goldman Sachs has acquired a significant stake in FirstCry\u2019s parent company, Brainbees Solutions Ltd, through a bulk deal on the National Stock Exchange (NSE) on 24 September 2026.\n\nGoldman Sachs Investments Mauritius I Ltd purchased 68 lakh shares of Brainbees Solutions at \u20b9 175 per share, taking the total transaction value to around \u20b9 119 crore.\n\nGoldman Sachs has also been an anchor investor in Brainbees Solutions\u2019 initial public offering (IPO). The company had allocated shares worth \u20b9 1,885.80 crore to domestic and foreign institutional investors in its anchor round.\n\nOther investors participating in the anchor allocation included the Government of Singapore, Abu Dhabi Investment Authority, Nomura, Fidelity, SBI Blue Chip Fund, SBI Mutual Fund, ICICI Prudential Mutual Fund, HDFC Mutual Fund, Kotak Mahindra Mutual Fund, SBI Life Insurance, Nordea Asset Management, Max Life Insurance, Norges Bank, PSP Investments and Carmignac, among others.\n\nPrivate equity firm TPG has exited omnichannel kidswear company FirstCry through a \u20b9 202 crore bulk deal, according to a media report.\n\nTPG, through its investment arm NewQuest Asia Investments III Ltd, sold its entire 2.21% stake in FirstCry, comprising 1.2 crore shares, at \u20b9 175.15 per share, as per NSE data.\n\nThe transaction was executed at a discount of around 2.4% to FirstCry\u2019s previous closing price. TPG held a 2.21% stake in the company at the end of the June 2026 quarter.\n\nTPG had first invested in FirstCry in 2021 and has gradually pared its stake following the company\u2019s stock market debut in 2024.", "source": "LiveMint Markets", "pub_date_str": "25 Sep 2026, 11:19 AM IST", "pub_date_relative": "4m ago"}, {"title": "An absence of significant economic slowdown doesn't mean no signs of stagflation risks. Here's why", "full_content": "Keep watch for signs of stagflation, even if there isn't a significant slowdown in the economy, according to J.P. Morgan.", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 11:17 AM IST", "pub_date_relative": "7m ago"}, {"title": "Japanese government bond yields hit new high as global sell-off continues", "full_content": "Sharp increase in interest rate expectations across advanced economies, says Capital Economics", "source": "FT Markets", "pub_date_str": "25 Sep 2026, 11:11 AM IST", "pub_date_relative": "13m ago"}, {"title": "Iran says it's up to U.S. to end war as China presses for de-escalation", "full_content": "Iranian President Masoud Pezeshkian said it is up to the U.S. to decide whether to end their seven-month war, amid continued missile strikes in the Middle East and a fresh push by China to help broker a peace resolution.\n\n\"It's America that must choose whether it wants to end this or not,\" Pezeshkian said, responding to a question about whether the war could end by year-end, in an interview aired Thursday on Fox News.\n\nThe remarks came as the Houthis fired dozens of missiles and drones at Saudi targets on Friday morning, according to Saudi authorities, who said they intercepted six ballistic missiles.\n\nEmergency alerts were issued in Mecca, Jeddah and Yanbu. Saudi Arabia, Turkey and Pakistan planned an urgent meeting of their chiefs of staff to discuss ways to support the kingdom under the Mecca Joint Defense Agreement.\n\nPezeshkian has sought to distance Tehran from the escalation, telling Fox News \"the Houthis are responsible for their own actions\" and that Iran is \"not at war with Saudi Arabia.\" The Houthis, he said, \"have their own issues.\"\n\nSaudi Arabia's Grand Mufti struck a starkly different tone , telling troops to be ready \"to lay down their lives\" to fight the Houthis until the group is ousted from power.\n\nThe widening front has kept oil markets on edge. Futures for international benchmark Brent crude for November delivery declined 1% at $93.66 a barrel. U.S. West Texas Intermediate futures for November dropped 0.68% at $105.86 per barrel.\n\nVessel transits through the Strait of Hormuz, normally the route for about a fifth of global oil supply, fell to 9, far below peacetime levels, according to Reuters , citing preliminary ship-tracking data showed on Friday.", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 11:07 AM IST", "pub_date_relative": "17m ago"}, {"title": "Virginia tech CEO, Russian national charged with hiding firm's Russian ties from U.S. government", "full_content": "The Justice Department has charged the chief executive of a Virginia-based software company and a Russian businessman with lying to the U.S. government for years about who controlled the firm, according to a statement Wednesday.\n\nThe case came after a former employee publicly made similar allegations that prompted Oxygen Forensics to sue him.\n\nLee Reiber, 55, chief executive of Oxygen Forensics, was arrested Sunday in Boise, Idaho, where he lives, and released on bond. He is expected to be arraigned in federal court in Los Angeles in the coming weeks.\n\nHis co-defendant, Oleg Davydov, 52, of Moscow, was arrested the same day at London's Heathrow Airport, as he prepared to board a flight to Istanbul. U.S. authorities said they were expected to seek his extradition.\n\nBoth men are charged with conspiracy to commit wire fraud, a federal offense that carries a maximum sentence of 20 years in prison.\n\nOxygen Forensics sells digital forensics software that law enforcement and government agencies use to extract and analyze data from phones and computers. Its customers were reported to include the U.S. Secret Service, Homeland Security Investigations and the Department of War, the Pentagon's current official name.\n\nAccording to a criminal complaint , the company told those agencies for several years that it was independently owned and operated in the U.S. \u2014 a claim that prosecutors allege to be false. Davydov and four other Russian nationals secretly owned and controlled Oxygen Forensics through a holding company in Cyprus, and its software was written by a team in Russia that Davydov directed, according to the document.\n\nReiber became CEO in March 2022, shortly before the Russian owners' names were removed from the company's public filings, in the wake of Washington expanding sanctions on Moscow after the invasion of Ukraine.", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 11:00 AM IST", "pub_date_relative": "24m ago"}, {"title": "Centre permits sale of excess tobacco in Andhra Pradesh for 2025-26 crop season", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Agriculture \u203a Centre permits sale of excess tobacco in Andhra Pradesh for 2025-26 crop season The Economic Times daily newspaper is available online now. Read Today's Paper Centre permits sale of excess tobacco in Andhra Pradesh for 2025-26 crop season SECTIONS Centre permits sale of excess tobacco in Andhra Pradesh for 2025-26 crop season PTI Last Updated: Sep 25, 2026, 11:00:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Government of India has authorized the sale of excess Flue-Cured Virginia tobacco for the upcoming crop season. Registered growers and unregistered growers can participate in the auctions at authorized platforms. This decision follows a review of the market conditions conducted by the Department of Commerce.\n\nBuilding recycling plants is fine. Will they get enough scrap?\n\nBiogas found its ethanol moment this month. Can it now find scale?\n\nHas the US Fed and AI created a costlier world? And has the queue got longer for India?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "25 Sep 2026, 11:00 AM IST", "pub_date_relative": "24m ago"}, {"title": "Bonds can keep falling", "full_content": "Easy to explain, hard to live with", "source": "FT Markets", "pub_date_str": "25 Sep 2026, 11:00 AM IST", "pub_date_relative": "24m ago"}, {"title": "ESDS Software share price hits 5% lower circuit after Q1 results; stock still up 310% from IPO price - Should you buy?", "full_content": "ESDS Software Solution share price came under pressure on Friday after the recently listed enterprise cloud and artificial intelligence company reported its financial results for the quarter ended June 2026. The stock was locked in its 5% lower circuit at \u20b9 1,757.65 per share on the BSE as investors reacted to a sharp sequential decline in profitability and a moderation in revenue growth.\n\nDespite Friday\u2019s fall, ESDS Software shares have delivered a substantial gain since their market debut. The stock had touched a 52-week high of \u20b9 1,864.35 in September 2026, while its 52-week low stood at \u20b9 746.30 on September 4.\n\nThe stock-market debut took place on September 4, and the shares have since gained around 310% from their IPO price of \u20b9 429. ESDS Software Solution shares made their debut on the NSE at \u20b9 757 apiece earlier this month, representing a 76.46% premium over the issue price. The company\u2019s \u20b9 720-crore IPO was offered in the price band of \u20b9 408- \u20b9 429 per share.\n\nESDS Software Solution reported a 14% year-on-year increase in net profit for the quarter ended June 30, 2026, with profit rising to \u20b9 29.3 crore in Q1 FY27 from \u20b9 25.7 crore in the corresponding quarter of the previous year.\n\nHowever, the sequential comparison painted a weaker picture. Net profit plunged around 57% from \u20b9 67.7 crore in the previous quarter.\n\nOperating revenue increased 7.3% year-on-year to \u20b9 133.7 crore in Q1 FY27 from \u20b9 124.6 crore in Q1 FY26. On a quarter-on-quarter basis, however, operating revenue declined 20.2% from \u20b9 167.5 crore recorded in the preceding quarter.\n\nIncluding other income of \u20b9 1.5 crore, ESDS Software\u2019s total income for the quarter stood at \u20b9 135.2 crore. At the same time, total expenses rose 8.4% year-on-year and 16.5% sequentially to \u20b9 98.7 crore during Q1 FY27.\n\nThe company\u2019s latest revenue performance also marked a notable moderation from its recent growth trajectory.", "source": "LiveMint Markets", "pub_date_str": "25 Sep 2026, 10:56 AM IST", "pub_date_relative": "28m ago"}, {"title": "Trump to wrap up Xi summit with a tour of US archives", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Sep 2026, 10:48 AM IST", "pub_date_relative": "36m ago"}, {"title": "Sb financial director Richard Hardgrove sells $107,654 in stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Sep 2026, 10:45 AM IST", "pub_date_relative": "38m ago"}, {"title": "240% rally in six months! Defence stock Raymond hits 52-week high; exit or hold? Explained with target, stop-loss, ratio", "full_content": "Raymond share price gained more than 1% in early trade on Friday, 25 September, climbing to a fresh 52-week high of \u20b9 1,222.15 apiece on the BSE. The stock, however, later pared gains and slipped into negative territory.\n\nRecently, Raymond announced that its aerospace business is expanding into aircraft structures, with its subsidiary, JK Maini Global Aerospace Ltd, securing a contract to assemble wing and centre-fuselage structures for an indigenous fighter aircraft programme.\n\nAccording to the company\u2019s exchange filing, the order was awarded by a leading Indian aerospace and defence original equipment manufacturer (OEM). Raymond has not disclosed the identity of the customer, the specific fighter aircraft programme or the financial value of the contract.\n\nThe contract marks a strategic expansion of Raymond\u2019s aerospace operations. The group, which has traditionally focused on precision manufacturing and aerospace components, will now participate in the assembly of larger aircraft structures.\n\nThe project is expected to leverage the customer\u2019s existing manufacturing infrastructure. Raymond said this approach will allow the group to develop capabilities and gain execution experience without requiring significant upfront investments in new facilities.\n\nRakesh Tiwary, Group CFO, Raymond Group, said the opportunity extends beyond its immediate revenue potential and could help the company establish a presence in the high-value aircraft structures segment.\n\nAccording to Tiwary, the project will enable Raymond to build execution credentials that could support its subsidiaries in pursuing larger aerospace programmes in India and overseas. The company plans to focus on execution and gradually develop the business into a scalable growth platform.\n\nRaymond Limited currently operates two core businesses within its Engineering vertical: Aerospace and Defence & Tools, and Auto Components.", "source": "LiveMint Markets", "pub_date_str": "25 Sep 2026, 10:42 AM IST", "pub_date_relative": "42m ago"}, {"title": "Oil falls amid optimism over potential diplomatic solution to the Iran conflict", "full_content": "Oil fell Friday following a report that U.S. and Iranian negotiators in New York are discussing a phased deal to end the standoff in the Persian Gulf.\n\nFutures for international benchmark Brent crude for November delivery declined 0.92% to $105.68 a barrel. U.S. West Texas Intermediate futures for November dropped 1.52% to $93.09 per barrel.\n\nbrent Reuters reported that a senior Iranian official had said the most realistic path forward is for Tehran to allow navigation in the Strait of Hormuz in exchange for the U.S. ending its naval blockade.\n\nThe U.S. and Iran agreed to this approach under a June 17 memorandum of understanding, but the deal quickly collapsed into renewed fighting. It is unclear what is different about the current negotiations.\n\nIran now wants the U.S. to return to the memorandum of understanding before the U.S. midterm elections, according to Al Jazeera, which reported that this was told to media outlets by Iranian President Masoud Pezeshkian on the sidelines of the UN General Assembly.\n\nwti \"It is understood that the two sides have been communicating via mediators,\" said David Morrison, senior market analyst at Trade Nation. Investors are still expressing their concerns over sticky inflation, higher energy prices and bellicose statements from the US and Iran at the UN General Assembly in New York, Morrison said.", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 10:40 AM IST", "pub_date_relative": "44m ago"}, {"title": "China\u2019s Xi calls for cooperation with U.S. on AI", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Sep 2026, 10:40 AM IST", "pub_date_relative": "44m ago"}, {"title": "India records highest-ever FDI of $94.53 billion in FY26, inflows since 2014 reach $843 billion: Piyush Goyal", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Finance \u203a India records highest-ever FDI of $94.53 billion in FY26, inflows since 2014 reach $843 billion: Piyush Goyal The Economic Times daily newspaper is available online now. Read Today's Paper India records highest-ever FDI of $94.53 billion in FY26, inflows since 2014 reach $843 billion: Piyush Goyal SECTIONS India records highest-ever FDI of $94.53 billion in FY26, inflows since 2014 reach $843 billion: Piyush Goyal PTI Last Updated: Sep 25, 2026, 10:38:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India achieved its highest-ever annual Foreign Direct Investment of USD 94.53 billion in FY 2025-26. Cumulative FDI inflows from FY 2014-15 to FY 2025-26 reached USD 843 billion. The Production Linked Incentive schemes have attracted significant investments and generated millions of jobs. Key sectors benefited include electronics, pharmaceuticals, and IT hardware as outl  Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "25 Sep 2026, 10:33 AM IST", "pub_date_relative": "50m ago"}, {"title": "Nikkei 225 surges to 66,185 but stuck in range: Live levels", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Sep 2026, 10:32 AM IST", "pub_date_relative": "52m ago"}, {"title": "UPI payments above \u20b92,000: Who will pay the 0.4% MDR? FM Sitharaman clarifies", "full_content": "The proposed Merchant Discount Rate (MDR) on certain UPI payments above \u20b9 2,000 has raised concerns among users, merchants, and other stakeholders. To quell such concerns, Finance Minister Nirmala Sitharaman has now clarified that the charge will be levied on merchants and will not be passed on to consumers.\n\nAccording to a PTI report, Sitharaman said on 25 September that \u201cthe MDR is not a tax, cess or surcharge, and that the money collected will not go to the government\u201d.\n\nIn accordance with the new framework, a 0.4% will apply starting from 15 October 2026 to specified person-to-merchant UPI transactions above \u20b9 2,000. Furthermore, the charge is capped at \u20b9 300 for transactions of \u20b9 75,000 or more. Person-to-person UPI payments will remain free.\n\nThe government has also stated that about 96% of merchant UPI transactions will remain unaffected, while only small merchants with monthly UPI QR collections of up to \u20b9 1 lakh are exempt from the new MDR, as per a detailed press release recently issued by the Press Information Bureau.\n\nPTI quoted the Finance Minister as saying, \u201cI don't think customers are worried because we are clearly saying that this is not going to the consumer. There are, of course, I'm sorry to say, people who have not understood this properly... It is not on the consumer.\n\nThe MDR charge on the \u20b9 2,000 payment\"> \u20b9 2,000 payment is borne by the merchant, who already does so for other cards, the Finance Minister said. And, she added, with the other cards also, they are not passing it on to the consumer.\n\n\u201cThere may be many things they do, such as making offers or whatever. So, strictly speaking, this applies to many other cards. I am justifying it from that perspective.", "source": "LiveMint Money", "pub_date_str": "25 Sep 2026, 10:30 AM IST", "pub_date_relative": "54m ago"}], "cfa": [{"title": "Decoded: Sensex lost nearly 3300 points, Nifty dip 1000 since announcement of blockbuster GDP of India | Top 3 reasons", "full_content": "Stock market latest news today: The key benchmark indices of the Indian stock market have been reeling under the selling pressure, despite the announcement of a blockbuster GDP of India in the April to June 2026 quarter. When the Ministry of Statistics and Programme Implementation (MoSPI) released the GDP data for India's Q1 FY2026-27 on 31 August 2026, experts felt it could attract foreign investors, who have been net sellers in the Indian stock market for more than a year. However, to their surprise, India's GDP for Q1FY27 remained uneven for Dalal Street.\n\nThis was surprising because Asian counterparts to Dalal Street have performed well despite their economies performing comparatively worse than India's in the first quarter of the current financial year.\n\nWhen India's GDP for Q1FY27 was announced on 31 August 2026, the BSE Sensex had ended at 76,957, the Nifty 50 index at 24,080, and the Bank Nifty index at 58,025. By 10:00 AM on Friday, the Bank Nifty is oscillating around 55,500, down 2,500 points in September 2026. The Nifty 50 index is around 23,075, down around 1,000 points, whereas the Sensex today is around 73,675, down around 3,300 points from the date of release of the Indian GDP for the Q1FY27.\n\nAccording to stock market experts, the Indian stock market has failed to capitalise on the blockbuster GDP data release because it has been dictated by the global triggers post-release of the Q1FY27 GDP data.", "source": "LiveMint Markets", "pub_date_str": "25 Sep 2026, 11:22 AM IST", "pub_date_relative": "2m ago", "cfa_topics": ["Economics", "Equity Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Goldman Sachs buys stake in Firstcry brand parent owner Brainbees Solutions | Check price, quantity traded", "full_content": "Global investment bank Goldman Sachs has acquired a significant stake in FirstCry\u2019s parent company, Brainbees Solutions Ltd, through a bulk deal on the National Stock Exchange (NSE) on 24 September 2026.\n\nGoldman Sachs Investments Mauritius I Ltd purchased 68 lakh shares of Brainbees Solutions at \u20b9 175 per share, taking the total transaction value to around \u20b9 119 crore.\n\nGoldman Sachs has also been an anchor investor in Brainbees Solutions\u2019 initial public offering (IPO). The company had allocated shares worth \u20b9 1,885.80 crore to domestic and foreign institutional investors in its anchor round.\n\nOther investors participating in the anchor allocation included the Government of Singapore, Abu Dhabi Investment Authority, Nomura, Fidelity, SBI Blue Chip Fund, SBI Mutual Fund, ICICI Prudential Mutual Fund, HDFC Mutual Fund, Kotak Mahindra Mutual Fund, SBI Life Insurance, Nordea Asset Management, Max Life Insurance, Norges Bank, PSP Investments and Carmignac, among others.\n\nPrivate equity firm TPG has exited omnichannel kidswear company FirstCry through a \u20b9 202 crore bulk deal, according to a media report.\n\nTPG, through its investment arm NewQuest Asia Investments III Ltd, sold its entire 2.21% stake in FirstCry, comprising 1.2 crore shares, at \u20b9 175.15 per share, as per NSE data.\n\nThe transaction was executed at a discount of around 2.4% to FirstCry\u2019s previous closing price. TPG held a 2.21% stake in the company at the end of the June 2026 quarter.\n\nTPG had first invested in FirstCry in 2021 and has gradually pared its stake following the company\u2019s stock market debut in 2024.", "source": "LiveMint Markets", "pub_date_str": "25 Sep 2026, 11:19 AM IST", "pub_date_relative": "4m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "An absence of significant economic slowdown doesn't mean no signs of stagflation risks. Here's why", "full_content": "Keep watch for signs of stagflation, even if there isn't a significant slowdown in the economy, according to J.P. Morgan.", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 11:17 AM IST", "pub_date_relative": "7m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Japanese government bond yields hit new high as global sell-off continues", "full_content": "Sharp increase in interest rate expectations across advanced economies, says Capital Economics", "source": "FT Markets", "pub_date_str": "25 Sep 2026, 11:11 AM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Iran says it's up to U.S. to end war as China presses for de-escalation", "full_content": "Iranian President Masoud Pezeshkian said it is up to the U.S. to decide whether to end their seven-month war, amid continued missile strikes in the Middle East and a fresh push by China to help broker a peace resolution.\n\n\"It's America that must choose whether it wants to end this or not,\" Pezeshkian said, responding to a question about whether the war could end by year-end, in an interview aired Thursday on Fox News.\n\nThe remarks came as the Houthis fired dozens of missiles and drones at Saudi targets on Friday morning, according to Saudi authorities, who said they intercepted six ballistic missiles.\n\nEmergency alerts were issued in Mecca, Jeddah and Yanbu. Saudi Arabia, Turkey and Pakistan planned an urgent meeting of their chiefs of staff to discuss ways to support the kingdom under the Mecca Joint Defense Agreement.\n\nPezeshkian has sought to distance Tehran from the escalation, telling Fox News \"the Houthis are responsible for their own actions\" and that Iran is \"not at war with Saudi Arabia.\" The Houthis, he said, \"have their own issues.\"\n\nSaudi Arabia's Grand Mufti struck a starkly different tone , telling troops to be ready \"to lay down their lives\" to fight the Houthis until the group is ousted from power.\n\nThe widening front has kept oil markets on edge. Futures for international benchmark Brent crude for November delivery declined 1% at $93.66 a barrel. U.S. West Texas Intermediate futures for November dropped 0.68% at $105.86 per barrel.\n\nVessel transits through the Strait of Hormuz, normally the route for about a fifth of global oil supply, fell to 9, far below peacetime levels, according to Reuters , citing preliminary ship-tracking data showed on Friday.", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 11:07 AM IST", "pub_date_relative": "17m ago", "cfa_topics": ["Derivatives", "Portfolio Management"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Virginia tech CEO, Russian national charged with hiding firm's Russian ties from U.S. government", "full_content": "The Justice Department has charged the chief executive of a Virginia-based software company and a Russian businessman with lying to the U.S. government for years about who controlled the firm, according to a statement Wednesday.\n\nThe case came after a former employee publicly made similar allegations that prompted Oxygen Forensics to sue him.\n\nLee Reiber, 55, chief executive of Oxygen Forensics, was arrested Sunday in Boise, Idaho, where he lives, and released on bond. He is expected to be arraigned in federal court in Los Angeles in the coming weeks.\n\nHis co-defendant, Oleg Davydov, 52, of Moscow, was arrested the same day at London's Heathrow Airport, as he prepared to board a flight to Istanbul. U.S. authorities said they were expected to seek his extradition.\n\nBoth men are charged with conspiracy to commit wire fraud, a federal offense that carries a maximum sentence of 20 years in prison.\n\nOxygen Forensics sells digital forensics software that law enforcement and government agencies use to extract and analyze data from phones and computers. Its customers were reported to include the U.S. Secret Service, Homeland Security Investigations and the Department of War, the Pentagon's current official name.\n\nAccording to a criminal complaint , the company told those agencies for several years that it was independently owned and operated in the U.S. \u2014 a claim that prosecutors allege to be false. Davydov and four other Russian nationals secretly owned and controlled Oxygen Forensics through a holding company in Cyprus, and its software was written by a team in Russia that Davydov directed, according to the document.\n\nReiber became CEO in March 2022, shortly before the Russian owners' names were removed from the company's public filings, in the wake of Washington expanding sanctions on Moscow after the invasion of Ukraine.", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 11:00 AM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Fixed Income", "Ethical & Professional Standards"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Centre permits sale of excess tobacco in Andhra Pradesh for 2025-26 crop season", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Agriculture \u203a Centre permits sale of excess tobacco in Andhra Pradesh for 2025-26 crop season The Economic Times daily newspaper is available online now. Read Today's Paper Centre permits sale of excess tobacco in Andhra Pradesh for 2025-26 crop season SECTIONS Centre permits sale of excess tobacco in Andhra Pradesh for 2025-26 crop season PTI Last Updated: Sep 25, 2026, 11:00:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Government of India has authorized the sale of excess Flue-Cured Virginia tobacco for the upcoming crop season. Registered growers and unregistered growers can participate in the auctions at authorized platforms. This decision follows a review of the market conditions conducted by the Department of Commerce.\n\nBuilding recycling plants is fine. Will they get enough scrap?\n\nBiogas found its ethanol moment this month. Can it now find scale?\n\nHas the US Fed and AI created a costlier world? And has the queue got longer for India?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "25 Sep 2026, 11:00 AM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "ESDS Software share price hits 5% lower circuit after Q1 results; stock still up 310% from IPO price - Should you buy?", "full_content": "ESDS Software Solution share price came under pressure on Friday after the recently listed enterprise cloud and artificial intelligence company reported its financial results for the quarter ended June 2026. The stock was locked in its 5% lower circuit at \u20b9 1,757.65 per share on the BSE as investors reacted to a sharp sequential decline in profitability and a moderation in revenue growth.\n\nDespite Friday\u2019s fall, ESDS Software shares have delivered a substantial gain since their market debut. The stock had touched a 52-week high of \u20b9 1,864.35 in September 2026, while its 52-week low stood at \u20b9 746.30 on September 4.\n\nThe stock-market debut took place on September 4, and the shares have since gained around 310% from their IPO price of \u20b9 429. ESDS Software Solution shares made their debut on the NSE at \u20b9 757 apiece earlier this month, representing a 76.46% premium over the issue price. The company\u2019s \u20b9 720-crore IPO was offered in the price band of \u20b9 408- \u20b9 429 per share.\n\nESDS Software Solution reported a 14% year-on-year increase in net profit for the quarter ended June 30, 2026, with profit rising to \u20b9 29.3 crore in Q1 FY27 from \u20b9 25.7 crore in the corresponding quarter of the previous year.\n\nHowever, the sequential comparison painted a weaker picture. Net profit plunged around 57% from \u20b9 67.7 crore in the previous quarter.\n\nOperating revenue increased 7.3% year-on-year to \u20b9 133.7 crore in Q1 FY27 from \u20b9 124.6 crore in Q1 FY26. On a quarter-on-quarter basis, however, operating revenue declined 20.2% from \u20b9 167.5 crore recorded in the preceding quarter.\n\nIncluding other income of \u20b9 1.5 crore, ESDS Software\u2019s total income for the quarter stood at \u20b9 135.2 crore. At the same time, total expenses rose 8.4% year-on-year and 16.5% sequentially to \u20b9 98.7 crore during Q1 FY27.\n\nThe company\u2019s latest revenue performance also marked a notable moderation from its recent growth trajectory.", "source": "LiveMint Markets", "pub_date_str": "25 Sep 2026, 10:56 AM IST", "pub_date_relative": "28m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "240% rally in six months! Defence stock Raymond hits 52-week high; exit or hold? Explained with target, stop-loss, ratio", "full_content": "Raymond share price gained more than 1% in early trade on Friday, 25 September, climbing to a fresh 52-week high of \u20b9 1,222.15 apiece on the BSE. The stock, however, later pared gains and slipped into negative territory.\n\nRecently, Raymond announced that its aerospace business is expanding into aircraft structures, with its subsidiary, JK Maini Global Aerospace Ltd, securing a contract to assemble wing and centre-fuselage structures for an indigenous fighter aircraft programme.\n\nAccording to the company\u2019s exchange filing, the order was awarded by a leading Indian aerospace and defence original equipment manufacturer (OEM). Raymond has not disclosed the identity of the customer, the specific fighter aircraft programme or the financial value of the contract.\n\nThe contract marks a strategic expansion of Raymond\u2019s aerospace operations. The group, which has traditionally focused on precision manufacturing and aerospace components, will now participate in the assembly of larger aircraft structures.\n\nThe project is expected to leverage the customer\u2019s existing manufacturing infrastructure. Raymond said this approach will allow the group to develop capabilities and gain execution experience without requiring significant upfront investments in new facilities.\n\nRakesh Tiwary, Group CFO, Raymond Group, said the opportunity extends beyond its immediate revenue potential and could help the company establish a presence in the high-value aircraft structures segment.\n\nAccording to Tiwary, the project will enable Raymond to build execution credentials that could support its subsidiaries in pursuing larger aerospace programmes in India and overseas. The company plans to focus on execution and gradually develop the business into a scalable growth platform.\n\nRaymond Limited currently operates two core businesses within its Engineering vertical: Aerospace and Defence & Tools, and Auto Components.", "source": "LiveMint Markets", "pub_date_str": "25 Sep 2026, 10:42 AM IST", "pub_date_relative": "42m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Oil falls amid optimism over potential diplomatic solution to the Iran conflict", "full_content": "Oil fell Friday following a report that U.S. and Iranian negotiators in New York are discussing a phased deal to end the standoff in the Persian Gulf.\n\nFutures for international benchmark Brent crude for November delivery declined 0.92% to $105.68 a barrel. U.S. West Texas Intermediate futures for November dropped 1.52% to $93.09 per barrel.\n\nbrent Reuters reported that a senior Iranian official had said the most realistic path forward is for Tehran to allow navigation in the Strait of Hormuz in exchange for the U.S. ending its naval blockade.\n\nThe U.S. and Iran agreed to this approach under a June 17 memorandum of understanding, but the deal quickly collapsed into renewed fighting. It is unclear what is different about the current negotiations.\n\nIran now wants the U.S. to return to the memorandum of understanding before the U.S. midterm elections, according to Al Jazeera, which reported that this was told to media outl e with the new framework, a 0.4% will apply starting from 15 October 2026 to specified person-to-merchant UPI transactions above \u20b9 2,000. Furthermore, the charge is capped at \u20b9 300 for transactions of \u20b9 75,000 or more. Person-to-person UPI payments will remain free.\n\nThe government has also stated that about 96% of merchant UPI transactions will remain unaffected, while only small merchants with monthly UPI QR collections of up to \u20b9 1 lakh are exempt from the new MDR, as per a detailed press release recently issued by the Press Information Bureau.\n\nPTI quoted the Finance Minister as saying, \u201cI don't think customers are worried because we are clearly saying that this is not going to the consumer. There are, of course, I'm sorry to say, people who have not understood this properly... It is not on the consumer.\n\nThe MDR charge on the \u20b9 2,000 payment\"> \u20b9 2,000 payment is borne by the merchant, who already does so for other cards, the Finance Minister said. And, she added, with the other cards also, they are not passing it on to the consumer.\n\n\u201cThere may be many things they do, such as making offers or whatever. So, strictly speaking, this applies to many other cards. I am justifying it from that perspective.", "source": "LiveMint Money", "pub_date_str": "25 Sep 2026, 10:30 AM IST", "pub_date_relative": "54m ago", "cfa_topics": ["Quantitative Methods"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "NSE shares dip below listing price \u2014 will it rebound or more pain ahead? | Explained with support, resistance, target", "full_content": "NSE share price today: Shares of National Stock Exchange (NSE) declined on Friday, September 25, after closing nearly 2% higher in the previous session. NSE IPO listed on the BSE with a modest gain of about 0.84% over its issue price.\n\nThe stock was listed at \u20b9 1800 apiece on BSE on Thursday, but dipped to an intraday low of \u20b9 1,790.10 per share during Friday\u2019s trading session and was down nearly a half percentage point in the early trading session.\n\nExperts see the recent decline as an attractive entry point for investors looking for long-term investment gain. For investors\u2019 closely tracking NSE share price movement, here\u2019s what experts have to say about the stock outlook.\n\nThe stock is likely to see resistance near \u20b9 1950 and may go below 1785, which is the upper price band of the IPO, according to Arun Kejriwal, Founder of Kejriwal Research and Investment Services. He gave a stop loss of \u20b9 1740 per share for NSE.\n\nThe stock closed below its average weighted price, one should not be surprised if the stock goes below its upper price band, noted Kejriwal underlining it as an \u201copportunity to buy\u201d for long-term investors. The expert said that NSE share price can be a portfolio stock which can potentially give 15-20% annual return and is not for short-term investors.\n\n\u201cTo systematically manage downside exposure, short-term and listing-gain investors are advised to maintain a strict stop-loss at \u20b9 1,740 per share (roughly 2.5% below the issue price), which can be trailed upward as the stock consolidates, while long-term investors may hold through volume-driven volatility to capture the exchange's structural compounding potential,\u201d stated Shivani Nyati, Head of Wealth at Swastika Investmart.\n\nThe stock was trading 0.70% lower at \u20b9 1807.20 per share on BSE with a market capitalisation of \u20b9 4,47,480.00 at 10:23 am.", "source": "LiveMint Markets", "pub_date_str": "25 Sep 2026, 10:29 AM IST", "pub_date_relative": "54m ago", "cfa_topics": ["Quantitative Methods", "Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Portfolio Management"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "Trump raised weak yen with Takaichi, Japan     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
