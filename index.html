    const allData = {"general": [{"title": "CT UK Capital and Income Investment Trust changes name", "full_content": "", "source": "Investing.com News", "pub_date_str": "19 Oct 2026, 11:44 AM IST", "pub_date_relative": "7m ago"}, {"title": "Sweco wins three Specialfastigheter deals worth about 500 million crowns", "full_content": "", "source": "Investing.com News", "pub_date_str": "19 Oct 2026, 11:41 AM IST", "pub_date_relative": "10m ago"}, {"title": "Accession Therapeutics appoints Nicklasson as chairman", "full_content": "", "source": "Investing.com News", "pub_date_str": "19 Oct 2026, 11:41 AM IST", "pub_date_relative": "10m ago"}, {"title": "This multibagger stock jumps 4% despite weak market sentiments | Check share performance", "full_content": "Multibagger stock : Gabriel India share price jumped 7.41%, touching an intraday high of \u20b9 1557.80 per share on NSE, in Monday's trading session despite weak market sentiments.\n\nGabriel India shares opened at \u20b9 1,460 apiece today, as compared to previous close of \u20b9 1,448.90 on Friday last week.\n\nThe stock rally came in after the shares witnessed a spurt in its trading volume. According to data available on NSE, around 17.34 lakhs shares changed hands during the intraday session on 19 October.\n\n\u201cGabriel India\u2019s recent share-price surge indicates strengthening bullish momentum, supported by the formation of higher highs on the technical chart. The stock\u2019s breakout above the \u20b9 1,460 resistance level on October 12 attracted fresh buying interest and improved its near-term outlook,\u201d said Gaurav Garg, Head - Research, Lemonn.\n\nIn an exchange filing on 6 October, Gabriel India said that parent company Anand Group have signed a joint venture (JV) agreement with FORVIA to strengthen their presence in India's rapidly growing automotive market.\n\nThe filing further revealed that combining FORVIA's global seating expertise with ANAND Group's strong local footprint, the partnership will create a platform for growth in seat frames and complete seat.\n\nThe new joint venture, which will operate under the name Faurecia Anand Seating India Private Limited, will be majority-controlled by FORVIA and focus on manufacturing seat frames and complete seating systems. FORVIA will hold a 50% plus one share stake in the venture, while Gabriel India will own 50% minus one share. Gabriel India, listed on the National Stock Exchange and BSE, is the flagship company of the ANAND Group.\n\nBy combining FORVIA Seating\u2019s technological expertise and manufacturing strengths with ANAND Group\u2019s local capabilities, the partnership aims to create a strong foundation for expanding FORVIA Seating\u2019s presence in India.", "source": "LiveMint Markets", "pub_date_str": "19 Oct 2026, 11:39 AM IST", "pub_date_relative": "12m ago"}, {"title": "U.S. stock futures climb as investors return to AI trade after selloff", "full_content": "", "source": "Investing.com News", "pub_date_str": "19 Oct 2026, 11:38 AM IST", "pub_date_relative": "13m ago"}, {"title": "Loan NOC: Is it issued after every EMI or only after full repayment? Know the rules", "full_content": "When you pay your loan EMI on time, it can go a long way to help you stay on track with your repayment schedule. It can not only boost an individual borrower\u2019s confidence but can also be meaningfully positive for an individual\u2019s credit profile. Still, it does not mean that your loan is officially closed.\n\nA No Objection Certificate (NOC) is a vital document that helps confirm that an individual has cleared their outstanding loan dues. This raises an important question: Do lending institutions issue this certificate after every EMI or only when you repay the entire loan amount?\n\nThis write-up is dedicated towards discussing the basics of an NOC, its significance and when and how it is issued.\n\nSimply put, a No Objection Certificate is a formal document issued by a lending institution confirming that the borrower has repaid the loan amount in full and has no outstanding dues on the loan account.\n\nFurthermore, this document can also be referred to as a legitimate and official loan closure certificate or letter, depending on the lending institution.\n\nNow, it is vital to note that an NOC is generally issued only upon full repayment, not after each EMI. Every EMI is a scheduled instalment focused on repaying the principal and interest. That is why paying an instalment helps reduce your outstanding liability; still, it does not close the loan account completely.\n\nFurthermore, once you pay the final EMI and clear any fines, penalties, and other outstanding charges, the lending institution verifies the account details along with the borrower's complete credentials.\n\nAfter that, it issues the NOC or loan closure document . If you repay the entire outstanding amount early, you can also request the document after completing the required formalities in accordance with the loan agreement's prescribed terms and conditions.", "source": "LiveMint Money", "pub_date_str": "19 Oct 2026, 11:37 AM IST", "pub_date_relative": "13m ago"}, {"title": "Together prices \u00a3409m mortgage-backed securitisation", "full_content": "", "source": "Investing.com News", "pub_date_str": "19 Oct 2026, 11:37 AM IST", "pub_date_relative": "14m ago"}, {"title": "OpenAI bugging suspect WhatsApp'ed Saudi royal days before arrest, feds reveal", "full_content": "The Saudi national charged with planting a recording device in a sensitive OpenAI executive conference room in San Francisco was \"in frequent communications via WhatsApp with a member of the Saudi Royal Family\" throughout 2025 and 2026, prosecutors revealed in a bombshell court filing Sunday.\n\nThe defendant, Abdulrahman Alfozan , communicated with the Saudi royal as recently as Oct. 5 \u2014 four days before he was arrested, the U.S. Attorney's Office in San Francisco said in the filing, which requests that he be detained without bail.\n\nProsecutors did not identify the Saudi royal, or say in the filing how Alfozan, who then was working as an engineer at OpenAI, knew that person.\n\n\"Among other things, the individual [the royal family member] told the defendant [Alfozan] that an artificial intelligence initiative was being launched in Saudi Arabia and wanted the defendant to join it,\" prosecutors wrote in their filing.\n\n\"In May 2026, the individual told the defendant, 'Saudi needs you more then [sic] the US!' to which the defendant responded '100,' indicating he agreed,\" prosecutors wrote.\n\n\"The individual repeatedly tried to recruit the defendant and asked when he planned to leave OpenAI,\" prosecutors wrote. \" At the time, the defendant said he wouldn't leave until his stock vested.\"\n\nThe filing does not say that the Saudi royal directed Alfozan to install a recording device at OpenAI or steal information from that AI giant.\n\nAlfozan, who lives near the San Francisco airport, is a venture partner at Raed Ventures , a Saudi venture capital firm. Prince Khalid bin Bader Al Saud, a member of the Saudi royal family, joined the firm as a venture partner in 2025. In their filing Sunday, prosecutors did not mention that prince by name, or say that the unidentified royal who communicated with Alfozan had ties to Raed.", "source": "CNBC Top News", "pub_date_str": "19 Oct 2026, 11:36 AM IST", "pub_date_relative": "15m ago"}, {"title": "Analysis-Africa\u2019s minerals value-add drive interests investors but faces energy hurdle", "full_content": "", "source": "Investing.com News", "pub_date_str": "19 Oct 2026, 11:36 AM IST", "pub_date_relative": "15m ago"}, {"title": "Taiwan stocks lower at close of trade; Taiwan Weighted down 0.81%", "full_content": "", "source": "Investing.com News", "pub_date_str": "19 Oct 2026, 11:35 AM IST", "pub_date_relative": "16m ago"}, {"title": "S.Korea says SK Hynix\u2019s Solidigm listing could violate rules- reports", "full_content": "", "source": "Investing.com News", "pub_date_str": "19 Oct 2026, 11:33 AM IST", "pub_date_relative": "18m ago"}, {"title": "Beeks Financial Cloud secures $4m in Q1 contract extensions", "full_content": "", "source": "Investing.com News", "pub_date_str": "19 Oct 2026, 11:32 AM IST", "pub_date_relative": "19m ago"}, {"title": "How you can gift stocks, mutual funds this festive season", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nWith the festive season upon us around the corner, many people are looking for meaningful gifts for family and friends. One option is to gift financial assets such as shares, exchange-traded funds (ETFs), or mutual fund units, which can continue to grow long after the festivities are over.\n\nGifting these investments is now simpler than before. How you do it depends on the mode in which your investments are held, and the tax treatment depends on who receives the gift. Here is how you can do it.\n\nIf your shares, ETFs or mutual fund units are in a demat account, you can gift them by transferring them directly to the recipient's demat account without selling them. This is called an off-market transfer. This is a direct move between two demat accounts that does not go through the stock exchange.\n\nGifting securities is essentially an off-market transfer in which investments are moved from one demat account to another without being sold on the exchange. \u201cInvestors can gift shares, ETFs , mutual funds held in demat form and other eligible securities, provided the holdings are free from pledges, lock-ins or other transfer restrictions,\u201d said Yashas Khoday, co-founder and chief product officer, FYERS, a discount broker.\n\nSome brokers let you gift directly from your holdings, provided the recipient has an account with the same broker. The process typically starts with selecting the holdings and quantity, followed by entering the recipient\u2019s details. For any such transfer, the recipient must first be added as a beneficiary in the sender\u2019s account, using their Permanent Account Number (PAN) or 16-digit demat account number.\n\nYou can also do this directly by registering for CDSL Easiest or NSDL Speed-e.", "source": "LiveMint Money", "pub_date_str": "19 Oct 2026, 11:30 AM IST", "pub_date_relative": "21m ago"}, {"title": "Frank Elderson: From climate and nature risks to economic resilience and competitiveness", "full_content": "We are living in a time of profound economic, geopolitical and technological uncertainty. Yet amid all this uncertainty, one thing is clear: climate change and nature degradation will continue to shape our economies and societies, and we will have to deal with the consequences. Climate change and nature degradation are a certainty in an uncertain world. The events of this summer have reminded us of that reality in the most tangible way possible.\n\nFor Europe, the summer of 2026 was not simply another warm season. It was the warmest summer ever recorded in Western Europe, marked by severe droughts, devastating wildfires, water scarcity and mounting pressure on ecosystems across the continent. [ 1 ] Water levels in major European rivers fell to exceptionally low levels, affecting transport, industry and energy production. At the same time, large areas of land were destroyed by fires and important economic sectors faced disruptions. [ 2 ] Europe is warming faster than any other continent at more than twice the global average. [ 3 ] The human toll has been severe, with tens of thousands of excess deaths linked to extreme heat recorded during the summer months. [ 4 ]\n\nThis summer also served as a reminder of how much our economies depend on nature. Water scarcity affected not only households and agriculture, but also manufacturing, transport and energy production. Across Europe, pressure on ecosystems highlighted the fact that healthy forests, soils, rivers, wetlands and oceans are not just environmental assets, but that they provide essential ecosystem services on which economic activity relies every day, and which often go unnoticed until they are put under strain. [ 5 ]\n\nTaken together, this summer\u2019s events conveyed a simple but powerful message: climate and nature are not external to our economies.", "source": "ECB Press", "pub_date_str": "19 Oct 2026, 11:30 AM IST", "pub_date_relative": "21m ago"}, {"title": "Nasdaq futures gain as investors buy the dip in the AI trade: Live updates", "full_content": "Stock futures rebounded early Monday as traders cautiously dipped a toe back in following last week's rout in shares linked to the artificial intelligence trend.\n\nNasdaq 100 futures added 1.32%. Dow Jones Industrial Average futures ticked 0.53% higher, or 278 points. S&P 500 futures gained 0.2%.\n\nStable oil prices early Sunday also lent the equity market some support.\n\nIn Asia, Japan's Nikkei 225 lost 1.65%, while the Topix was down 1.12%. South Korea's Kospi was 1.29% lower, while the small-cap Kosdaq Index fell 0.93%. Australia's S&P/ASX 200 was up 0.37%. Mainland China's CSI 300 slid 0.28%.\n\nThe S&P 500 lost nearly 2% last week, its biggest weekly decline since late June. The Nasdaq tumbled 4.5%, snapping a four-week winning streak.\n\nConcerns around the health of the AI trade took center stage after CNBC reported, citing sources, that Anthropic's third-quarter revenue totaled $16.8 billion . And while that's up from $11.6 billion in the second quarter, it raised flags among investors about the pace of growth with the AI build-out.\n\nNeocloud stock CoreWeave, which uses large amounts of debt to build data centers that it rents out to tech companies, was at the center of those fears. The AI-linked name plummeted 25% last week \u2014 its largest one-week drop since November 2025. Investors in the corporate bond market have started to shun CoreWeave, with the company's credit default swaps reaching distress levels .\n\nIt's not just CoreWeave whose moves in the credit market are concerning. Goldman Sachs traders noted Friday: \"AI Credit Spreads and hyperscalers specifically are at the widest levels of the year. The last time spreads were nearly this high, the underlying equities were 15% lower.\"", "source": "CNBC Top News", "pub_date_str": "19 Oct 2026, 11:27 AM IST", "pub_date_relative": "24m ago"}, {"title": "America very close to finalising trade deal with India: Marco Rubio", "full_content": "Choose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "19 Oct 2026, 11:23 AM IST", "pub_date_relative": "28m ago"}, {"title": "Truecaller\u2019s preliminary Q3 net sales beat forecast", "full_content": "", "source": "Investing.com News", "pub_date_str": "19 Oct 2026, 11:23 AM IST", "pub_date_relative": "28m ago"}, {"title": "Kross share price jumps 20% after Q2 results: What lies ahead? Technical analyst weighs in", "full_content": "Kross share price jumped nearly 20% on Monday, 19 October, after the commercial vehicle components manufacturer reported a strong performance for the second quarter of FY27, with revenue, EBITDA and profit after tax (PAT) registering robust year-on-year growth.\n\nThe company\u2019s standalone revenue from operations surged 79.6% year-on-year to \u20b9 235.09 crore in Q2 FY27, compared with \u20b9 130.92 crore in the corresponding quarter last year.\n\nEBITDA more than doubled, rising 107.4% year-on-year to \u20b9 30.60 crore from \u20b9 14.75 crore a year ago. The EBITDA margin expanded to 13% from 11.3% in the year-ago quarter, an improvement of 175 basis points.\n\nKross reported a 143.5% year-on-year jump in profit after tax to \u20b9 19.69 crore in Q2 FY27, compared with \u20b9 8.08 crore in the corresponding period last year. The PAT margin improved to 8.4% from 6.2%, while earnings per share increased to \u20b9 3.08 from \u20b9 1.25.\n\nFor the first half of FY27, revenue from operations rose 55.2% year-on-year to \u20b9 419.43 crore from \u20b9 270.28 crore in H1 FY26. EBITDA increased 72.4% to \u20b9 53.32 crore from \u20b9 30.92 crore, while PAT climbed 76.5% to \u20b9 33.16 crore from \u20b9 18.78 crore.\n\nThe company attributed its growth outlook to healthy order books, sustained demand in the trailer and tractor segments, and ongoing capacity expansion initiatives.\n\nKross said supplies of precision hydraulic tipping jacks were progressing in line with its plan, with further volume ramp-up expected in the second half of FY27. Commercial production has also commenced at its axle beam extrusion plant, which is currently operating at around 60-65% utilisation.\n\nThe company is also expanding into manufacturing cold-drawn tubes as part of its efforts to strengthen itsin-house component manufacturing capabilities and adopt new technologies.", "source": "LiveMint Markets", "pub_date_str": "19 Oct 2026, 11:14 AM IST", "pub_date_relative": "37m ago"}, {"title": "Did Mutual Funds Stop Gold Investments? What Investors Need to Know", "full_content": "Choose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Markets", "pub_date_str": "19 Oct 2026, 11:11 AM IST", "pub_date_relative": "40m ago"}, {"title": "Why are banking stocks falling? Nifty Bank down 1%; Axis, HDFC Bank shares crash up to 5% - What should investors do?", "full_content": "Most private bank stocks suffered significant losses in morning trade on Monday, 19 October, dragging the Nifty Bank index down by 1%. Shares of Axis Bank crashed 5%, while those of HDFC Bank and ICICI Bank declined more than 2% and 1%, respectively, during the session. Stocks such as Kotak Mahindra Bank and YES Bank declined up to 1%.\n\nMajor banking stocks declined after announcing their Q2 results. HDFC Bank reported a nearly 5% year-on-year (YoY) increase in standalone net profit to \u20b9 19,509.96 crore. Net interest income (NII) increased 9.72% YoY to \u20b9 34,619.18 crore in Q2 FY27. Net interest margin (NIM) stood at 3.16% on total assets and 3.32% on interest-earning assets.\n\nICICI Bank reported a 20.1% YoY growth in standalone net profit to \u20b9 14,843 crore. NII increased 17.7% to \u20b9 25,339 crore, while NIM declined 12 basis points sequentially to 4.18%.\n\nAxis Bank reported a 37.6% YoY increase in standalone net profit to \u20b9 7,003 crore. NII rose 12% to \u20b9 15,371 crore, while NIM stood at 3.36%.\n\nYES Bank's net profit increased 65% YoY to \u20b9 1,080 crore. NII increased 22.7% YoY to \u20b9 2,822 crore, while NIM stood at 2.6% versus 2.5% in Q2FY26 and 2.7% in Q1FY27.\n\n\"Expectations were high, and the results were mixed, particularly on certain fronts. That is what is weighing on sentiment. However, if you look at the broader trend, especially in PSU banks, it appears strong. Some private banks, including Kotak Mahindra Bank, ICICI Bank and others, are also holding up,\" said Ajit Mishra, SVP \u2013 Research, Religare Broking.\n\nMishra added that crude oil prices are still around $106\u2013107 per barrel. If prices cross $110, they could move towards $115. Any further correction in the broader market could also lead to a decline in major private banking stocks.\n\nPankaj Pandey, the head of research at ICICI Securities , believes there is nothing particularly negative from a results perspective for large private banks.", "source": "LiveMint Markets", "pub_date_str": "19 Oct 2026, 11:08 AM IST", "pub_date_relative": "43m ago"}, {"title": "PNB shares jump 8% after Q2 results beat estimates; Jefferies, Motilal Oswal, others raise target prices", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a PNB shares jump 8% after Q2 results beat estimates; Jefferies, Motilal Oswal, others raise target prices JM Financial Share Price Choice International Share Price IIFL Capital Services Share Price Anand Rathi Share & Stock Brokers Share Price SMC Global Securities Share Price The Economic Times daily newspaper is available online now. Read Today's Paper PNB shares jump 8% after Q2 results beat estimates; Jefferies, Motilal Oswal, others raise target prices SECTIONS PNB shares jump 8% after Q2 results beat estimates; Jefferies, Motilal Oswal, others raise target prices By Debaroti Adhikary , ETMarkets.com Last Updated: Oct 19, 2026, 11:05:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Punjab National Bank shares rose sharply on Monday after the lender reported a 13% year-on-year rise in Q2FY27 net profit to Rs 5,532 crore. Stronger net interest income and improving asset quality prompted bullish brokerage calls, with Jefferies, Motilal Oswal and JM Financial setting target prices of Rs 140 apiece.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "19 Oct 2026, 11:05 AM IST", "pub_date_relative": "46m ago"}, {"title": "Japanese Prime Minister Takaichi rejects criticism around weak yen and high interest rates", "full_content": "Japan's Prime Minister Sanae Takaichi has rejected criticism that she was on one hand responsible for a weak yen and on the other for pushing up interest rates in the country.\n\nSpeaking in parliament, Takaichi said; \"I have been repeatedly criticized for 'Takaichi's weak yen' and 'Takaichi's high interest rates,' but I clearly deny that,\" according to a Reuters translation of her remarks in Japanese.\n\nShe was responding to a question from an opposition party lawmaker Yoshifumi Hamano, who asked about the compilation of a second supplementary budget for the country.\n\nTakaichi also said that her administration will increase confidence in the yen by building a strong economy.\n\nUnder her administration, yields on Japanese government bonds have risen to multi-decade highs, while the yen weakened to its lowest since 1986, prompting Tokyo and even Washington to step into the forex market to support the currency.\n\nIn January, Takaichi had reportedly said that a weak yen presented an opportunity for export industries and acted as a buffer against U.S. tariffs, though she quickly clarified that she held no specific preference for the currency's direction.\n\nJapan's exports have been partly boosted by yen's depreciation, as a weak currency makes exports more competitive.\n\nFor bond markets, Takaichi said that \"We intend to appropriately control the amount of government bond issuance,\" at a time when yields have been rising as Japan's central bank raises its policy rate and continues to normalize its monetary policy.", "source": "CNBC Top News", "pub_date_str": "19 Oct 2026, 10:59 AM IST", "pub_date_relative": "52m ago"}, {"title": "\u2018Frenzy\u2019 in Australian deals as investors swoop on cheap assets", "full_content": "EQT strikes $6.5bn deal for waste management group and Dai-ichi Life targets wealth manager", "source": "FT Markets", "pub_date_str": "19 Oct 2026, 10:58 AM IST", "pub_date_relative": "53m ago"}, {"title": "Global markets face fresh volatility as earnings season gains pace", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News Powered By Global markets face fresh volatility as earnings season gains pace Written by Anupam Nagar , ETMarkets.com | Oct 19, 2026, 11:00:49 AM IST 1 / 6 \u200bUS Earnings, China Data To Drive Markets This Week Markets face another volatile week as major US technology earnings, China's economic data, bond-market shifts and political developments in Brazil test investor sentiment.(Source: Reuters)\n\nInvestors will scrutinise Meta, Tesla, Lam Research and Texas Instruments for clues on AI demand and returns on massive infrastructure investments. Netflix, Procter & Gamble and GE Aerospace are also due to report. S&P 500 third-quarter earnings are expected to rise more than 30%, according to LSEG IBES.\n\nChina will release third-quarter GDP, September retail sales, industrial output and fixed-asset investment data on Monday. Investors will assess whether strong exports and manufacturing can offset patchy domestic demand. The loan prime rate decision is due Tuesday, with rates expected to remain unchanged.\n\nBond markets are showing signs of regaining their traditional defensive role as the relationship between stock prices and bond yields shifts in the US and Europe. Investors will watch whether bonds can cushion equity-market declines amid inflation concerns, high borrowing costs and government debt worries.\n\nBrazil's October 25 presidential runoff is keeping investors on edge. A poll puts Fl\u00e1vio Bolsonaro at 46% and Luiz In\u00e1cio Lula da Silva at 44%, a technical tie. Expectations of tighter fiscal policy under Bolsonaro have lifted stocks and the real, while a Lula victory could reverse some of those gains.\n\nIndonesia's central bank meets Wednesday and Turkey's policymakers meet Thursday.", "source": "Economic Times Markets", "pub_date_str": "19 Oct 2026, 10:54 AM IST", "pub_date_relative": "57m ago"}, {"title": rkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "19 Oct 2026, 10:51 AM IST", "pub_date_relative": "1h ago"}, {"title": "China's growth accelerates as AI export boom outweighs domestic weakness - BBC", "full_content": "China's growth accelerates as AI export boom outweighs domestic weakness BBC China's third-quarter economic growth quickens to 4.5% as exports surge, beating estimates CNBC China\u2019s economy grows 4.5 percent in Q3, beating forecasts Al Jazeera China economy grows thanks to AI export boom but domestic slump remains a drag CNN Strong Exports Stabilize China\u2019s Economic Growth in Official Statistics The New York Times", "source": "Google News Business", "pub_date_str": "19 Oct 2026, 10:47 AM IST", "pub_date_relative": "1h ago"}, {"title": "Easy exits hurting Indian stocks: Nirmala Sitharaman explains why equities are underperforming", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Easy exits hurting Indian stocks: Nirmala Sitharaman explains why equities are underperforming Central Depository Services (India) Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Easy exits hurting Indian stocks: Nirmala Sitharaman explains why equities are underperforming SECTIONS Easy exits hurting Indian stocks: Nirmala Sitharaman explains why equities are underperforming ETMarkets.com Last Updated: Oct 19, 2026, 10:46:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Finance Minister Nirmala Sitharaman says easy liquidity is allowing investors to exit Indian equities as the Nifty and Sensex struggle to deliver positive returns. Foreign investors have pulled out nearly $63.6 billion since October 2024, erasing nine years of inflows, amid rising US yields, a stronger dollar and AI-driven investment shifts.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "19 Oct 2026, 10:46 AM IST", "pub_date_relative": "1h ago"}, {"title": "Kross shares rally 16% after Q2 profit jumps 143% YoY; stock hits 52-week high", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Kross shares rally 16% after Q2 profit jumps 143% YoY; stock hits 52-week high Kross Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Kross shares rally 16% after Q2 profit jumps 143% YoY; stock hits 52-week high SECTIONS Kross shares rally 16% after Q2 profit jumps 143% YoY; stock hits 52-week high By Ritesh Presswala , ETMarkets.com Last Updated: Oct 19, 2026, 10:42:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Kross shares surged following strong Q2 FY27 results, with revenue rising 80% and net profit climbing 143% year-on-year. EBITDA more than doubled, while margins improved. Robust commercial vehicle demand, capacity expansion and operational efficiencies supported growth, alongside increased institutional shareholding and the stock reaching a fresh 52-week high.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "19 Oct 2026, 10:42 AM IST", "pub_date_relative": "1h ago"}, {"title": "Can LTM\u2019s pivot towards shorter-tenure AI deals accelerate revenue growth in H2?", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nLTM had promised a growth uptick from the September quarter (Q2FY27), but the 1.1% sequential constant currency (CC) revenue improvement was unsatisfactory. The drag came from seasonality in the technology and services vertical and its Saudi Arabian joint ventures, which reduced sequential growth by 60-70 basis points (bps).\n\nThe company has strategically shifted the deal mix towards shorter-tenure artificial intelligence (AI) projects as it aspires for a better H2FY27. H2 is poised to be buoyed by AI-led deals, recovery in client accounts and the Randstad Technology and Consulting Services acquisition (approvals on track for Q3FY27).\n\nAI deals have six-12 months duration and enable faster revenue conversion than traditional large IT deals with long transition periods. The former are also gross-margin accretive.\n\nLTM eyes CC year-on-year growth of 5.3% in FY27\u2014similar to FY26. But order inflow fell 25% sequentially and 21% year-on-year in Q2 to a multi-quarter low of $1.26 billion, clouding near-term revenue visibility.\n\nLTM attributed this drop to a change in mix. AI revenue grew 40% year-on-year to 13.4% of Q2 revenue. A significant portion of the orders comprised annual contract value (ACV)-based deals.\n\nThe pipeline is healthy, but LTM hasn\u2019t shared the ACV-total contract value (TCV) split. ACV measures the average revenue generated by a single contract over a 12-month period, while TCV gauges total revenue over the entire contract duration.\n\nThe absence of a disclosed ACV versus traditional TCV split makes it difficult to assess the quality and revenue visibility of bookings, said Nirmal Bang Institutional Equities. LTM may provide an ACV split from the next quarter.", "source": "LiveMint Markets", "pub_date_str": "19 Oct 2026, 10:40 AM IST", "pub_date_relative": "1h ago"}, {"title": "Stock Market Holiday 2026: Are NSE, BSE closed on October 20 for Dussehra? Check remaining holidays for the year", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Stock Market Holiday 2026: Are NSE, BSE closed on October 20 for Dussehra? Check remaining holidays for the year BSE Share Price Multi Commodity Exchange of India Share Price Indian Energy Exchange Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Stock Market Holiday 2026: Are NSE, BSE closed on October 20 for Dussehra? Check remaining holidays for the year SECTIONS Stock Market Holiday 2026: Are NSE, BSE closed on October 20 for Dussehra? Check remaining holidays for the year By Veer Sharma , ETMarkets.com Last Updated: Oct 19, 2026, 10:39:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The NSE and BSE will remain closed on October 20 for Dussehra. With 12 of the 16 scheduled stock market holidays for 2026 already passed, three more holidays remain after the October closure. These include Diwali-Balipratipada on November 10, Guru Nanak Jayanti on November 24 and Christmas on December 25.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "19 Oct 2026, 10:39 AM IST", "pub_date_relative": "1h ago"}, {"title": "Global Market: China\u2019s yuan hits four-year high as strong GDP data ease stimulus concerns", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Global Market: China\u2019s yuan hits four-year high as strong GDP data ease stimulus concerns Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market: China\u2019s yuan hits four-year high as strong GDP data ease stimulus concerns SECTIONS Global Market: China\u2019s yuan hits four-year high as strong GDP data ease stimulus concerns By Anupam Nagar , ETMarkets.com Last Updated: Oct 19, 2026, 10:36:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Commen Square; No Casualties Reported", "full_content": "The fire brigade received information about the blaze at 9.18 am.", "source": "NDTV Profit", "pub_date_str": "19 Oct 2026, 10:29 AM IST", "pub_date_relative": "1h ago"}, {"title": "Suzlon shares crash over 20% in six months but experts predict a strong rebound - here's why | Target price, stop-loss", "full_content": "Suzlon share price target | Stocks to buy today: Shares of Suzlon Energy Ltd witnessed selling pressure during the early morning dealings on Monday. Suzlon share price today opened with a downside gap at \u20b9 41.58 per share on the NSE and touched an intraday low of \u20b9 40.83 apiece within a few minutes of the Opening Bell, clocking around 3% dip on Monday. Even though Suzlon shares are among the beaten-down stocks on Dalal Street, having shed over 20% in six months, market experts are predicting a re-rating in the stock, provided the green energy stock controls its expenses and provides some extra breathing room for profit margins.\n\nAccording to stock market experts, Suzlon Energy shares witnessed a re-rating when it exited the group of loss-making companies and became profitable. Now, the market is waiting for a sharp improvement in the company's margins. They said that it can become possible once the company controls its higher expenses. Experts believe that Suzlon Energy Ltd is expected to contain its expenses, which would trigger a re-rating in the stock. They advised long-term investors to make the most of these dips and accumulate Suzon shares in one's portfolio. They predicted limited downside in Suzlon shares as the average weighted price of Suzlon shares fell to the \u20b9 38- \u20b9 40 band.\n\nHighlighting the reasons that are dragging Suzlon Energy's share price, Seema Srivastava, Senior Research Analyst at SMC Global Securities, said, \"Suzlon Energy shares witnessed the first round of re-rating when it became a profitable company, snapping the tag of a loss-making company. This event has been discounted, and the market is waiting for the next round of re-rating, because a company's margins improve once it becomes a profit-making company, leaving the losses in the balance sheet far behind.\u201d\n\nThe SMCC Global expert said the market expects Suzlon to contain its expenses, giving some extra room for its profit margin.", "source": "LiveMint Markets", "pub_date_str": "19 Oct 2026, 10:25 AM IST", "pub_date_relative": "1h ago"}, {"title": "IT Stocks Split: Infosys, TechM Lead Losses; Persistent Systems, HCLTech Jump", "full_content": "US equities faced investor pressure on Friday, with magnificent seven giants like Alphabet Inc. and Microsoft Corp. settling over 2% and nearly 2% lower.", "source": "NDTV Profit", "pub_date_str": "19 Oct 2026, 10:23 AM IST", "pub_date_relative": "1h ago"}, {"title": "Ixigo shares jump 13% on Q2 profit turnaround, but why does Motilal Oswal retain its Neutral rating?", "full_content": "Le Travenues Technology shares, which operate under the ixigo brand, jumped over 13% on Monday, 19 October, after the company reported its September quarter results, posting a consolidated net profit of \u20b9 63.42 crore for Q2 FY27, compared with a net loss in the year-ago period. The profit was aided by the partial sale of its stake in Freshbus and strong growth in hotel bookings.\n\nThe travel and ticket-booking platform had reported a consolidated net loss of \u20b9 3.46 crore in the July-September quarter of the previous financial year, according to a regulatory filing.\n\nHotels emerged as ixigo\u2019s fastest-growing business segment by gross transaction value (GTV), with the metric rising 159% year-on-year to \u20b9 111.34 crore. The company reported hotels as a separate business segment for the first time.\n\nIxigo\u2019s revenue from operations rose 13% year-on-year to \u20b9 320.96 crore in the second quarter of FY27, compared with \u20b9 284.23 crore in the corresponding period last year. However, total expenses increased to \u20b9 309.51 crore from \u20b9 291.89 crore.\n\nIn a joint statement, ixigo Group CEO Aloke Bajpai, Group Co-CEO Rajnish Kumar and Group CFO Saurabh Devendra Singh said the company recorded a quarterly GTV of \u20b9 5,304 crore in Q2 FY27, marking a 22% increase year-on-year. Revenue from operations stood at \u20b9 321 crore, up 13% from a year earlier.\n\nThe executives said the company\u2019s profit after tax (PAT) reached an all-time high, supported by the partial sale of its stake in Freshbus.", "source": "LiveMint Markets", "pub_date_str": "19 Oct 2026, 10:22 AM IST", "pub_date_relative": "1h ago"}, {"title": "Global Market: Japan bond yields fall as US tech selloff fuels safe-haven demand", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Global Market: Japan bond yields fall as US tech selloff fuels safe-haven demand Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market: Japan bond yields fall as US tech selloff fuels safe-haven demand SECTIONS Global Market: Japan bond yields fall as US tech selloff fuels safe-haven demand By Anupam Nagar , ETMarkets.com Last Updated: Oct 19, 2026, 10:19:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Japanese government bond yields fell as a selloff in US technology stocks triggered demand for safer assets. Prime Minister Sanae Takaichi\u2019s pledge to control debt issuance also supported sentiment, while Bank of Japan rate expectations remained in focus.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "19 Oct 2026, 10:19 AM IST", "pub_date_relative": "1h ago"}, {"title": "PNB Q2 Review: Nirmal Bang Upgrades Rating, Sees 1% ROA Sustaining In FY27; Check Revised Target Price", "full_content": "The brokerage believes PNB's valuation remains attractive at 0.73 times forward book value, while an improving net interest margin (NIM) profile and healthy loan growth provide support to its return ratios.", "source": "NDTV Profit", "pub_date_str": "19 Oct 2026, 10:19 AM IST", "pub_date_relative": "1h ago"}, {"title": "India\u2019s Finance Minister says easy exits and excess liquidity fuel equity market's underperformance", "full_content": "Excess liquidity in India's equity market has contributed to underperformance and may continue to do so, according to Finance Minister Nirmala Sitharaman.\n\n\"Because of the ease of liquidity, ease of availability, people are even exiting easily\" from equities, Sitharaman told CNBC in an exclusive interview on the sidelines of the IMF-World Bank meetings in Bangkok on Friday. However, the fundamentals of the Indian economy are \"fine,\" she said.\n\nSince January, India's key benchmark indexes have slipped nearly 12%, as per LSEG data, even though the country's economic growth has been resilient amid trade uncertainty and geopolitical shocks. India has been hit with record outflows by foreign investors from its equity markets, and Sitharaman said that continued capital outflows are one of the biggest risks for India in 2027.\n\nStill, domestic capital continues to flood the market. Indian equity mutual funds have recorded net inflows every month since March 2021, according to data released by industry body Association of Mutual Funds in India earlier this month.\n\nMultinational companies, private equity funds and foreign investors have been able to make partial or full exits from their investments at a premium. Between 2021 and 2025, Indian initial public offerings collectively raised $60.4 billion, of which \"a staggering\" $37.7 billion, or 63% of total proceeds, went to existing holders who sold their shares to the public, an EY report in August said.\n\nForeign portfolio investors have sold direct Indian equities of over $33 billion so far this year, as per Indian depository firm NSDL.", "source": "CNBC Top News", "pub_date_str": "19 Oct 2026, 10:16 AM IST", "pub_date_relative": "1h ago"}, {"title": "Sugar Stocks Fall Up To 6%; Bajaj Hindusthan, Dwarikesh Lead Losses; Here's Why", "full_content": "The move is expected to push oil marketing companies towards alternative feedstocks, including maize, while raising concerns over the loss of an important revenue stream for sugar mills with distillery businesses.", "source": "NDTV Profit", "pub_date_str": "19 Oct 2026, 10:11 AM IST", "pub_date_relative": "1h ago"}, {"title": "Tech picks: Indian Hotels among 5 stocks to buy for healthy returns in short term", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News Tech picks: Indian Hotels among 5 stocks to buy for healthy returns in short term Written by Akash Podishetti , ETMarkets.com | Oct 19, 2026, 10:13:35 AM IST 1 / 6 Taking stock Indian equities extended their recovery, led by sustained buying in IT stocks, as strong quarterly results and upbeat management commentary reinforced confidence in the sector\u2019s earnings outlook. While rupee appreciation and easing crude prices provide near-term support, analysts say global inflationary and geopolitical risks warrant caution. Sustaining the recovery will require broader earnings growth beyond IT, supported by an improvement in domestic demand and easing margin pressures.\n\nLemon Tree continues to find support in the Rs 102-100 band, which is a sacrosanct support cluster for the stock. A formation of a bullish anchor column from the same support band, and a follow through Double top buy on its Daily 0.25% P&F charts, indicates towards the presence of strong buyers are lower levels, and a shift in control towards buyers. At the same time, a bullish crossover of the 20DEMA, over its 50 DEMA, points towards improving momentum in the stock.\n\nHitesh Rathi, Technical Analyst - Equity & Derivatives, Angel One\n\nThe Rs 3,290-3,200 band is a very strong cushion for the stock, and the stock continues to attract buying in the zone, validated by the formation of a bullish anchor column from the same band.", "source": "Economic Times Markets", "pub_date_str": "19 Oct 2026, 10:06 AM IST", "pub_date_relative": "1h ago"}, {"title": "China's third-quarter economic growth quickens to 4.5% as exports surge, beating estimates", "full_content": "China's economic growth accelerated to 4.5% in the third quarter from a year earlier, as robust foreign demand for the country's technological goods largely offset drags from a deepening property slump and sluggish consumer demand.\n\nThird-quarter growth beat Reuters-polled economists' expectation of a 4.4% expansion, and was also higher than the three-year low of 4.3% in the second quarter .\n\n\"The rebound in September salvaged the lukewarm performance in July and August,\" said Tianchen Xu, senior economist at Economist Intelligence Unit, attributing the recovery to improved government investment that helped arrest the consistent worsening in fixed asset investment, an \"ever-strong\" external sector and a weak base. China's monthly trade surplus reached a record high of $133.5 billion .\n\nMomentum from the three forces will likely extend into the fourth quarter, Xu said, forecasting a full-year growth rate of 4.7%.\n\nThe data shows an economy still leaning on factories and overseas buyers while households and private investors hold back, with growth through the first nine months averaging 4.6%, broadly in line with Beijing's official target range of 4.5% to 5%.\n\nIn September, retail sales eked out a 1.1% growth, exceeding analysts' forecast for 0.6% increase, while industrial output grew 5.5% from a year earlier, in line with the forecast of 5.5% growth. The urban unemployment rate stood at 5.2% in September.\n\nFor the first nine months this year, fixed asset investment in urban areas declined 7.2% from the same period a year earlier, compared with a 7.3% drop estimated in a Reuters poll.", "source": "CNBC Top News", "pub_date_str": "19 Oct 2026, 10:06 AM IST", "pub_date_relative": "1h ago"}, {"title": "Bulls retreat as Sensex falls over 400 points, Nifty slips below 23,100. What's next for D-Street?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Bulls retreat as Sensex falls over 500 points, Nifty tests 23,000. What's next for D-Street? Hindustan Unilever Share Price Marico Share Price Godrej Consumer Products Share Price Dabur India Share Price Colgate-Palmolive (India) Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Bulls retreat as Sensex falls over 500 points, Nifty tests 23,000. What's next for D-Street? SECTIONS Bulls retreat as Sensex falls over 500 points, Nifty tests 23,000. What's next for D-Street? By Debaroti Adhikary , ETMarkets.com Last Updated: Oct 19, 2026, 11:44:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Indian stock market took lobal Market: South Korean shares fall as AI investment worries weigh on chipmakers By Anupam Nagar , ETMarkets.com Last Updated: Oct 19, 2026, 10:01:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis South Korea\u2019s Kospi fell as AI investment concerns triggered technology stock selling, although dip buying helped recover early losses. Semiconductor shares remained weak, while automakers, battery makers and select heavyweight stocks gained. Foreign investors were net sellers, while currency and bond markets showed mixed movements amid ongoing global market uncertainty.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "19 Oct 2026, 10:01 AM IST", "pub_date_relative": "1h ago"}, {"title": "LTM's AI Revenue Is Rising, But Its Deal Pipeline Tells A Different Story", "full_content": "LTM's revenue performance was broadly in line with expectations in the September quarter, but profitability and deal momentum remain key concerns.", "source": "NDTV Profit", "pub_date_str": "19 Oct 2026, 10:00 AM IST", "pub_date_relative": "1h ago"}, {"title": "Urban Company shares crash over 8% after Q2 results - Should investors buy, sell, or hold the stock? Experts explain", "full_content": "Urban Company shares crashed over 8% in morning trade on the BSE on Monday, 19 October, after the home services platform's September quarter (Q2FY27) results. Urban Company share price opened at \u20b9 148.15 against its previous close of \u20b9 158.30 and crashed 8.5% to an intraday low of \u20b9 144.85.\n\nAfter market hours on Friday, 16 October, Urban Company said its consolidated net transaction value (NTV) during Q2FY27 grew 39% year-on-year (YoY) to \u20b9 1,432 crore and revenue from operations rose by 41% YoY to \u20b9 537 crore. Orders delivered reached 1.51 crore, up 103% YoY, and annual transacting users reached nearly 1 crore, up 35% YoY.\n\nAdjusted EBITDA for the quarter was - \u20b9 144 crore due to a deliberate \u20b9 174 crore investment in InstaHelp. Excluding InstaHelp, Adjusted EBITDA was \u20b9 30 crore, up 213% YoY, said the company.\n\nThe Company closed the quarter with \u20b9 1,901 crore in cash and treasury investments.\n\nMeanwhile, its board has approved a fresh capital raise of up to \u20b9 2,500 crore, subject to shareholder approval.\n\nBrokerage firm Emkay Global Financial Services has maintained a \"buy\" recommendation on the stock and raised the 12-month target price to \u20b9 200.\n\nEmkay said the company's low core penetration, tier 2 expansion, improving International profitability, and approaching KSA breakeven support the outlook. Native offers further growth opportunities, while InstaHelp drives higher engagement.\n\nHowever, pricing recovery and unit economics remain key monitorables, the brokerage firm added.", "source": "LiveMint Markets", "pub_date_str": "19 Oct 2026, 09:59 AM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "This multibagger stock jumps 4% despite weak market sentiments | Check share performance", "full_content": "Multibagger stock : Gabriel India share price jumped 7.41%, touching an intraday high of \u20b9 1557.80 per share on NSE, in Monday's trading session despite weak market sentiments.\n\nGabriel India shares opened at \u20b9 1,460 apiece today, as compared to previous close of \u20b9 1,448.90 on Friday last week.\n\nThe stock rally came in after the shares witnessed a spurt in its trading volume. According to data available on NSE, around 17.34 lakhs shares changed hands during the intraday session on 19 October.\n\n\u201cGabriel India\u2019s recent share-price surge indicates strengthening bullish momentum, supported by the formation of higher highs on the technical chart. The stock\u2019s breakout above the \u20b9 1,460 resistance level on October 12 attracted fresh buying interest and improved its near-term outlook,\u201d said Gaurav Garg, Head - Research, Lemonn.\n\nIn an exchange filing on 6 October, Gabriel India said that parent company Anand Group have signed a joint venture (JV) agreement with FORVIA to strengthen their presence in India's rapidly growing automotive market.\n\nThe filing further revealed that combining FORVIA's global seating expertise with ANAND Group's strong local footprint, the partnership will create a platform for growth in seat frames and complete seat.\n\nThe new joint venture, which will operate under the name Faurecia Anand Seating India Private Limited, will be majority-controlled by FORVIA and focus on manufacturing seat frames and complete seating systems. FORVIA will hold a 50% plus one share stake in the venture, while Gabriel India will own 50% minus one share. Gabriel India, listed on the National Stock Exchange and BSE, is the flagship company of the ANAND Group.\n\nBy combining FORVIA Seating\u2019s technological expertise and manufacturing strengths with ANAND Group\u2019s local capabilities, the partnership aims to create a strong foundation for expanding FORVIA Seating\u2019s presence in India.", "source": "LiveMint Markets", "pub_date_str": "19 Oct 2026, 11:39 AM IST", "pub_date_relative": "12m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "U.S. stock futures climb as investors return to AI trade after selloff", "full_content": "", "source": "Investing.com News", "pub_date_str": "19 Oct 2026, 11:38 AM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Together prices \u00a3409m mortgage-backed securitisation", "full_content": "", "source": "Investing.com News", "pub_date_str": "19 Oct 2026, 11:37 AM IST", "pub_date_relative": "14m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "OpenAI bugging suspect WhatsApp'ed Saudi royal days before arrest, feds reveal", "full_content": "The Saudi national charged with planting a recording device in a sensitive OpenAI executive conference room in San Francisco was \"in frequent communications via WhatsApp with a member of the Saudi Royal Family\" throughout 2025 and 2026, prosecutors revealed in a bombshell court filing Sunday.\n\nThe defendant, Abdulrahman Alfozan , communicated with the Saudi royal as recently as Oct. 5 \u2014 four days before he was arrested, the U.S. Attorney's Office in San Francisco said in the filing, which requests that he be detained without bail.\n\nProsecutors did not identify the Saudi royal, or say in the filing how Alfozan, who then was working as an engineer at OpenAI, knew that person.\n\n\"Among other things, the individual [the royal family member] told the defendant [Alfozan] that an artificial intelligence initiative was being launched in Saudi Arabia and wanted the defendant to join it,\" prosecutors wrote in their filing.\n\n\"In May 2026, the individual told the defendant, 'Saudi needs you more then [sic] the US!' to which the defendant responded '100,' indicating he agreed,\" prosecutors wrote.\n\n\"The individual repeatedly tried to recruit the defendant and asked when he planned to leave OpenAI,\" prosecutors wrote. \" At the time, the defendant said he wouldn't leave until his stock vested.\"\n\nThe filing does not say that the Saudi royal directed Alfozan to install a recording device at OpenAI or steal information from that AI giant.\n\nAlfozan, who lives near the San Francisco airport, is a venture partner at Raed Ventures , a Saudi venture capital firm. Prince Khalid bin Bader Al Saud, a member of the Saudi royal family, joined the firm as a venture partner in 2025. In their filing Sunday, prosecutors did not mention that prince by name, or say that the unidentified royal who communicated with Alfozan had ties to Raed.", "source": "CNBC Top News", "pub_date_str": "19 Oct 2026, 11:36 AM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "S.Korea says SK Hynix\u2019s Solidigm listing could violate rules- reports", "full_content": "", "source": "Investing.com News", "pub_date_str": "19 Oct 2026, 11:33 AM IST", "pub_date_relative": "18m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "How you can gift stocks, mutual funds this festive season", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nWith the festive season upon us around the corner, many people are looking for meaningful gifts for family and friends. One option is to gift financial assets such as shares, exchange-traded funds (ETFs), or mutual fund units, which can continue to grow long after the festivities are over.\n\nGifting these investments is now simpler than before. How you do it depends on the mode in which your investments are held, and the tax treatment depends on who receives the gift. Here is how you can do it.\n\nIf your shares, ETFs or mutual fund units are in a demat account, you can gift them by transferring them directly to the recipient's demat account without selling them. This is called an off-market transfer. This is a direct move between two demat accounts that does not go through the stock exchange.\n\nGifting securities is essentially an off-market transfer in which investments are moved from one demat account to another without being sold on the exchange. \u201cInvestors can gift shares, ETFs , mutual funds held in demat form and other eligible securities, provided the holdings are free from pledges, lock-ins or other transfer restrictions,\u201d said Yashas Khoday, co-founder and chief product officer, FYERS, a discount broker.\n\nSome brokers let you gift directly from your holdings, provided the recipient has an account with the same broker. The process typically starts with selecting the holdings and quantity, followed by entering the recipient\u2019s details. For any such transfer, the recipient must first be added as a beneficiary in the sender\u2019s account, using their Permanent Account Number (PAN) or 16-digit demat account number.\n\nYou can also do this directly by registering for CDSL Easiest or NSDL Speed-e.", "source": "LiveMint Money", "pub_date_str": "19 Oct 2026, 11:30 AM IST", "pub_date_relative": "21m ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Nasdaq futures gain as investors buy the dip in the AI trade: Live updates", "full_content": "Stock futures rebounded early Monday as traders cautiously dipped a toe back in following last week's rout in shares linked to the artificial intelligence trend.\n\nNasdaq 100 futures added 1.32%. Dow Jones Industrial Average futures ticked 0.53% higher, or 278 points. S&P 500 futures gained 0.2%.\n\nStable oil prices early Sunday also lent the equity market some support.\n\nIn Asia, Japan's Nikkei 225 lost 1.65%, while the Topix was down 1.12%. South Korea's Kospi was 1.29% lower, while the small-cap Kosdaq Index fell 0.93%. Australia's S&P/ASX 200 was up 0.37%. Mainland China's CSI 300 slid 0.28%.\n\nThe S&P 500 lost nearly 2% last week, its biggest weekly decline since late June. The Nasdaq tumbled 4.5%, snapping a four-week winning streak.\n\nConcerns around the health of the AI trade took center stage after CNBC reported, citing sources, that Anthropic's third-quarter revenue totaled $16.8 billion . And while that's up from $11.6 billion in the second quarter, it raised flags among investors about the pace of growth with the AI build-out.\n\nNeocloud stock CoreWeave, which uses large amounts of debt to build data centers that it rents out to tech companies, was at the center of those fears. The AI-linked name plummeted 25% last week \u2014 its largest one-week drop since November 2025. Investors in the corporate bond market have started to shun CoreWeave, with the company's credit default swaps reaching distress levels .\n\nIt's not just CoreWeave whose moves in the credit market are concerning. Goldman Sachs traders noted Friday: \"AI Credit Spreads and hyperscalers specifically are at the widest levels of the year. The last time spreads were nearly this high, the underlying equities were 15% lower.\"", "source": "CNBC Top News", "pub_date_str": "19 Oct 2026, 11:27 AM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Fixed Income", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Kross share price jumps 20% after Q2 results: What lies ahead? Technical analyst weighs in", "full_content": "Kross share price jumped nearly 20% on Monday, 19 October, after the commercial vehicle components manufacturer reported a strong performance for the second quarter of FY27, with revenue, EBITDA and profit after tax (PAT) registering robust year-on-year growth.\n\nThe company\u2019s standalone revenue from operations surged 79.6% year-on-year to \u20b9 235.09 crore in Q2 FY27, compared with \u20b9 130.92 crore in the corresponding quarter last year.\n\nEBITDA more than doubled, rising 107.4% year-on-year to \u20b9 30.60 crore from \u20b9 14.75 crore a year ago. The EBITDA margin expanded to 13% from 11.3% in the year-ago quarter, an improvement of 175 basis points.\n\nKross reported a 143.5% year-on-year jump in profit after tax to \u20b9 19.69 crore in Q2 FY27, compared with \u20b9 8.08 crore in the corresponding period last year. The PAT margin improved to 8.4% from 6.2%, while earnings per share increased to \u20b9 3.08 from \u20b9 1.25.\n\nFor the first half of FY27, revenue from operations rose 55.2% year-on-year to \u20b9 419.43 crore from \u20b9 270.28 crore in H1 FY26. EBITDA increased 72.4% to \u20b9 53.32 crore from \u20b9 30.92 crore, while PAT climbed 76.5% to \u20b9 33.16 crore from \u20b9 18.78 crore.\n\nThe company attributed its growth outlook to healthy order books, sustained demand in the trailer and tractor segments, and ongoing capacity expansion initiatives.\n\nKross said supplies of precision hydraulic tipping jacks were progressing in line with its plan, with further volume ramp-up expected in the second half of FY27. Commercial production has also commenced at its axle beam extrusion plant, which is currently operating at around 60-65% utilisation.\n\nThe company is also expanding into manufacturing cold-drawn tubes as part of its efforts to strengthen itsin-house component manufacturing capabilities and adopt new technologies.", "source": "LiveMint Markets", "pub_date_str": "19 Oct 2026, 11:14 AM IST", "pub_date_relative": "37m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Did Mutual Funds Stop Gold Investments? What Investors Need to Know", "full_content": "Choose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Markets", "pub_date_str": "19 Oct 2026, 11:11 AM IST", "pub_date_relative": "40m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Why are banking stocks falling? Nifty Bank down 1%; Axis, HDFC Bank shares crash up to 5% - What should investors do?", "full_content": "Most private bank stocks suffered significant losses in morning trade on Monday, 19 October, dragging the Nifty Bank index down by 1%. Shares of Axis Bank crashed 5%, while those of HDFC Bank and ICICI Bank declined more than 2% and 1%, respectively, during the session. Stocks such as Kotak Mahindra Bank and YES Bank declined up to 1%.\n\nMajor banking stocks declined after announcing their Q2 results. HDFC Bank reported a nearly 5% year-on-year (YoY) increase in standalone net profit to \u20b9 19,509.96 crore. Net interest income (NII) increased 9.72% YoY to \u20b9 34,619.18 crore in Q2 FY27. Net interest margin (NIM) stood at 3.16% on total assets and 3.32% on interest-earning assets.\n\nICICI Bank reported a 20.1% YoY growth in standalone net profit to \u20b9 14,843 crore. NII increased 17.7% to \u20b9 25,339 crore, while NIM declined 12 basis points sequentially to 4.18%.\n\nAxis Bank reported a 37.6% YoY increase in standalone net profit to \u20b9 7,003 crore. NII rose 12% to \u20b9 15,371 crore, while NIM stood at 3.36%.\n\nYES Bank's net profit increased 65% YoY to \u20b9 1,080 crore. NII increased 22.7% YoY to \u20b9 2,822 crore, while NIM stood at 2.6% versus 2.5% in Q2FY26 and 2.7% in Q1FY27.\n\n\"Expectations were high, and the results were mixed, particularly on certain fronts. That is what is weighing on sentiment. However, if you look at the broader trend, especially in PSU banks, it appears strong. Some private banks, including Kotak Mahindra Bank, ICICI Bank and others, are also holding up,\" said Ajit Mishra, SVP \u2013 Research, Religare Broking.\n\nMishra added that crude oil prices are still around $106\u2013107 per barrel. If prices cross $110, they could move towards $115. Any further correction in the broader market could also lead to a decline in major private banking stocks.\n\nPankaj Pandey, the head of research at ICICI Securities , believes there is nothing particularly negative from a results perspective for large private banks.", "source": "LiveMint Markets", "pub_date_str": "19 Oct 2026, 11:08 AM IST", "pub_date_relative": "43m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "PNB shares jump 8% after Q2 results beat estimates; Jefferies, Motilal Oswal, others raise target prices", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a PNB shares jump 8% after Q2 results beat estimates; Jefferies, Motilal Oswal, others raise target prices JM Financial Share Price Choice International Share Price IIFL Capital Services Share Price Anand Rathi Share & Stock Brokers Share Price SMC Global Securities Share Price The Economic Times daily newspaper is available online now. Read Today's Paper PNB shares jump 8% after Q2 results beat estimates; Jefferies, Motilal Oswal, others raise target prices SECTIONS PNB shares jump 8% after Q2 results beat estimates; Jefferies, Motilal Oswal, others raise target prices By Debaroti Adhikary , ETMarkets.com Last Updated: Oct 19, 2026, 11:05:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Punjab National Bank shares rose sharply on Monday after the lender reported a 13% year-on-year rise in Q2FY27 net profit to Rs 5,532 crore. Stronger net interest income and improving asset quality prompted bullish brokerage calls, with Jefferies, Motilal Oswal and JM Financial setting target prices of Rs 140 apiece.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "19 Oct 2026, 11:05 AM IST", "pub_date_relative": "46m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Japanese Prime Minister Takaichi rejects criticism around weak yen and high interest rates", "full_content": "Japan's Prime Minister Sanae Takaichi has rejected criticism that she was on one hand responsible for a weak yen and on the other for pushing up interest rates in the country.\n\nSpeaking in parliament, Takaichi said; \"I have been repeatedly criticized for 'Takaichi's weak yen' and 'Takaichi's high interest rates,' but I clearly deny that,\" according to a Reuters translation of her remarks in Japanese.\n\nShe was responding to a question from an opposition party lawmaker Yoshifumi Hamano, who asked about the compilation of a second supplementary budget for the country.\n\nTakaichi also said that her administration will increase confidence in the yen by building a strong economy.\n\nUnder her administration, yields on Japanese government bonds have risen to multi-decade highs, while the yen weakened to its lowest since 1986, prompting Tokyo and even Washington to step into the forex market to support the currency.\n\nIn January, Takaichi had reportedly said that a weak yen presented an opportunity for export industries and acted as a buffer against U.S. tariffs, though she quickly clarified that she held no specific preference for the currency's direction.\n\nJapan's exports have been partly boosted by yen's depreciation, as a weak currency makes exports more competitive.\n\nFor bond markets, Takaichi said that \"We intend to appropriately control the amount of government bond issuance,\" at a time when yields have been rising as Japan's central bank raises its policy rate and continues to normalize its monetary policy.", "source": "CNBC Top News", "pub_date_str": "19 Oct 2026, 10:59 AM IST", "pub_date_relative": "52m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Global markets face fresh volatility as earnings season gains pace", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News Powered By Global markets face fresh volatility as earnings season gains pace Written by Anupam Nagar , ETMarkets.com | Oct 19, 2026, 11:00:49 AM IST 1 / 6 \u200bUS Earnings, China Data To Drive Markets This Week Markets face another volatile week as major US technology earnings, China's economic data, bond-market shifts and political developments in Brazil test investor sentiment.(Source: Reuters)\n\nInvestors will scrutinise Meta, Tesla, Lam Research and Texas Instruments for clues on AI demand and returns on massive infrastructure investments. Netflix, Procter & Gamble and GE Aerospace are also due to report. S&P 500 third-quarter earnings are expected to rise more than 30%, according to LSEG IBES.\n\nChina will release third-quarter GDP, September retail sales, industrial output and fixed-asset investment data on Monday. Investors will assess whether strong exports and manufacturing can offset patchy domestic demand. The loan prime rate decision is due Tuesday, with rates expected to remain unchanged.\n\nBond markets are showing signs of regaining their traditional defensive role as the relationship between stock prices and bond yields shifts in the US and Europe. Investors will watch whether bonds can cushion equity-market declines amid inflation concerns, high borrowing costs and government debt worries.\n\nBrazil's October 25 presidential runoff is keeping investors on edge. A poll puts Fl\u00e1vio Bolsonaro at 46% and Luiz In\u00e1cio Lula da Silva at 44%, a technical tie. Expectations of tighter fiscal policy under Bolsonaro have lifted stocks and the real, while a Lula victory could reverse some of those gains.\n\nIndonesia's central bank meets Wednesday and Turkey's policymakers meet Thursday.", "source": "Economic Times Markets", "pub_date_str": "19 Oct 2026, 10:54 AM IST", "pub_date_relative": "57m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Fixed Income", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "PC Jeweller shares soar 26% in just two sessions. Here\u2019s what\u2019s triggering the sharp surge", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a PC Jeweller shares soar 26% in just two sessions. Here\u2019s what\u2019s triggerin s growth accelerates as AI export boom outweighs domestic weakness BBC China's third-quarter economic growth quickens to 4.5% as exports surge, beating estimates CNBC China\u2019s economy grows 4.5 percent in Q3, beating forecasts Al Jazeera China economy grows thanks to AI export boom but domestic slump remains a drag CNN Strong Exports Stabilize China\u2019s Economic Growth in Official Statistics The New York Times", "source": "Google News Business", "pub_date_str": "19 Oct 2026, 10:47 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Easy exits hurting Indian stocks: Nirmala Sitharaman explains why equities are underperforming", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Easy exits hurting Indian stocks: Nirmala Sitharaman explains why equities are underperforming Central Depository Services (India) Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Easy exits hurting Indian stocks: Nirmala Sitharaman explains why equities are underperforming SECTIONS Easy exits hurting Indian stocks: Nirmala Sitharaman explains why equities are underperforming ETMarkets.com Last Updated: Oct 19, 2026, 10:46:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Finance Minister Nirmala Sitharaman says easy liquidity is allowing investors to exit Indian equities as the Nifty and Sensex struggle to deliver positive returns. Foreign investors have pulled out nearly $63.6 billion since October 2024, erasing nine years of inflows, amid rising US yields, a stronger dollar and AI-driven investment shifts.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Bud
