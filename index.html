electric trucks from an array of providers.\n\nTrucking firm Einride also recently said it agreed to order 500 Tesla Semi trucks for its fleet with some deployments planned this month.\n\nOn Tesla's last earnings call in July, Musk told investors that the company's automated driving systems (known as FSD, or Full Self-Driving) would be available for the Semi in the near future, but he declined to give a specific date. Musk said at the time that he sees driverless systems as essential for the trucking industry.\n\n\"There just aren't enough people around who want to drive trucks, which are crucial for transport throughout America,\" Musk said. \"An autonomous Semi is actually going to be very important to address the shortage of truck drivers.\"", "source": "CNBC World Economy", "pub_date_str": "25 Sep 2026, 04:11 AM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "RedBird Capital to acquire majority stake in Puck at $250 million valuation, memo says", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Sep 2026, 04:06 AM IST", "pub_date_relative": "35m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "City Therapeutics files for US IPO as biotech listings surge", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Sep 2026, 04:00 AM IST", "pub_date_relative": "41m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Anthropic seeks Palantir-style voting control for seven co-founders ahead of IPO, The Information reports", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Sep 2026, 03:54 AM IST", "pub_date_relative": "47m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Trump, Xi to attend state dinner after White House meeting", "full_content": "President Donald Trump and Chinese Leader Xi Jinping are meeting at the White House on Thursday for high-stakes talks focusing on trade , artificial intelligence and the Iran war \u2014 in between displays of military fanfare and a lavish banquet.\n\nTrump said in an arrival ceremony speech that the two countries have been \"working to encourage a more balanced trading relationship,\" and that the leaders plan to discuss \"pressing issues\" around security, technology and AI.\n\nTreasury Secretary Scott Bessent said Wednesday evening that the countries have agreed to extend their temporary trade truce , which lowered U.S. tariffs and suspended Beijing's controls on exports of rare earths and critical minerals, among other stipulations. That agreement, which was set to expire in mid-November, will be extended by two months to Jan. 10, Bessent told Fox News.\n\n\"The decisions we make in these areas today can promote peace and prosperity for decades and decades to come,\" Trump said in Thursday's remarks.\n\nXi joined in the bonhomie. \"China and the United States, as two major countries, stand to gain from cooperation and will both lose in confrontation,\" he said in his own remarks, which were translated live.\n\n\"We do not need to avoid mentioning competition, but our competition should be a healthy one and should be kept within bounds. It should be a race of catching up with one another, not a wrestle in which one either wins or loses,\" he said.\n\nXi also engaged in the Chinese specialty of \"panda diplomacy,\" announcing that two pandas will be coming to Georgia's Zoo Atlanta in the coming days.\n\nWhile China analysts broadly predict the leaders' personal relationship and policy goals will result in a cautious summit that yields few major deliverables, their latest face-to-face nevertheless carries real geopolitical risk .", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 03:39 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "8% mortgage rates are \u2018not an impossibility\u2019 as the 30-year fixed rate surges", "full_content": "With the 10-year Treasury up sharply and the outlook for the U.S. economy looking unclear, some say 8% mortgage rates are back on the table.", "source": "MarketWatch Top Stories", "pub_date_str": "25 Sep 2026, 03:33 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Shale oil magnate says Exxon chief \u2018threw me under the bus\u2019 after $60bn takeover", "full_content": "Scott Sheffield says supermajor launched \u2018smear campaign\u2019 to stop him joining company\u2019s board", "source": "FT Markets", "pub_date_str": "25 Sep 2026, 03:27 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Pete Hegseth reports at least $3.1 million in cash, investments and bitcoin", "full_content": "Defense Secretary Pete Hegseth reported at least $3.1 million in cash, retirement investments and bitcoin in his newly released 2025 annual financial disclosure , including more than $1 million in cash held in a single bank account.\n\nThe Office of Government Ethics filing provides the latest look at the finances of the former firebrand Fox News host, who was confirmed as Defense secretary in January 2025. Hegseth is facing calls to be impeached from members of his own party related to his handling of the war with Iran .\n\nThe disclosure lists five retirement accounts containing investments worth roughly $2.05 million to $4.35 million. Hegseth's three accounts accounted for about $500,000 to $1.25 million of that total, while his wife, Jennifer Hegseth, reported roughly $1.55 million to $3.1 million in two rollover individual retirement accounts.\n\nThe household also reported three cash accounts, including one worth more than $1 million, and bitcoin valued at between roughly $16,000 and $65,000.\n\nBecause financial disclosures report assets in broad ranges rather than exact amounts, it is not possible to determine whether Hegseth\u2019s total wealth increased or decreased from a year earlier. His December 2024 nominee disclosure listed roughly $1.4 million to $3.4 million in financial assets. His new filing shows at least $3.1 million, but no comparable upper limit because one bank account is reported only as \"worth more than $1 million.\"\n\nThe clearest change is in cash. In Hegseth's 2024 filing, an account listed as \"U.S. bank #2\" held between $15,001 and $50,000.", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 03:16 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "EU says Trump plan to ban US diesel exports would \u2018negatively impact both sides\u2019 - The Guardian", "full_content": "EU says Trump plan to ban US diesel exports would \u2018negatively impact both sides\u2019 The Guardian Big business warns Trump against diesel export ban in joint letter CNBC Trump Advisers Analyzing Impact of Short-Term Diesel Export Ban Bloomberg.com 'Let's push prices down': Wright asks oil industry to curb exports Politico \u2018Makes very little economic sense\u2019: Ex-Trump energy secretary warns Trump against diesel export ban CNN", "source": "Google News Business", "pub_date_str": "25 Sep 2026, 03:11 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Surging Treasury yields pose a brand new problem for Kevin Warsh and the Fed", "full_content": "The bond market is yelling at the Federal Reserve, but the messages are coming from different directions and pose a dilemma for policymakers as they seek to strike a balance that won't tank the economy.\n\nTreasury yields continued their upward march Thursday as investors sought to price in a variety of factors: inflation still hovering well above the Fed's 2% goal, another bump up in energy prices and the impact of a global hyperscaler financial arms race and accompanying debt issuance.\n\nIn the past, policymakers have been willing to look through inflation spurts from temporary shocks like high energy prices and tariffs. And the narrative not so long ago was that the artificial intelligence investing boom was a story that would last a year or two and ultimately prove disinflationary.\n\nBut now Fed officials are rethinking the impact of those factors and seeing the danger of more durable inflation.\n\nAt the same time, markets are grappling with a central bank that suddenly has no interest in telegraphing its next moves, leaving an uncertain calculus on who is calling the shots \u2014 policymakers or market players.\n\n\"The time of looking through the initial supply shock has come to an end,\" said Joseph Brusuelas, chief economist at RSM. \"The bias has to be towards restoring price stability, and they should take what's going on seriously.\"\n\nMarkets expect the central bank will indeed take a firmer hand on inflation.\n\nOver the past day or so, traders raised the odds of a rate hike in October, which would come only a month or so after last week's quarter percentage point increase . They also see a third increase either late this year or early in 2027, with additional hikes possible in subsequent months.", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 03:10 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Exclusive | MGM Resorts Eyeing Bid for Barry Diller\u2019s People Incorporated - WSJ", "full_content": "Exclusive | MGM Resorts Eyeing Bid for Barry Diller\u2019s People Incorporated WSJ MGM Falls 11% After Barry Diller Pulls Out of Takeover. Why the Stock Is Still a Good Bet. Barron's MGM Resorts buyout offer withdrawn after 4 months of negotiations KLAS 8 News Now Barry Diller's People withdraws bid for MGM Resorts reuters.com MGM Resorts shares sink 11% after Barry Diller's People Inc. rescinds takeover offer CNBC", "source": "Google News Business", "pub_date_str": "25 Sep 2026, 03:08 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Fired \u2018We Buy Ugly Houses' franchisee sentenced to federal prison for fraud scheme, DOJ says - NBC 5 Dallas-Fort Worth", "full_content": "Fired \u2018We Buy Ugly Houses' franchisee sentenced to federal prison for fraud scheme, DOJ says NBC 5 Dallas-Fort Worth Former Dallas 'We Buy Ugly Houses' franchisee sentenced to federal prison for investment scam FOX 4 News Dallas-Fort Worth Dallas \u201cWe Buy Ugly Houses\u201d franchisee sentenced to 15 years in prison Dallas News Ex-\u2018We Buy Ugly Houses\u2019 franchise owner in Dallas gets 15 years in prison for $39 million scheme KERA News 'We Buy Ugly Houses' partner gets 15 years for $40M scam Chron", "source": "Google News Business", "pub_date_str": "25 Sep 2026, 02:54 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Why investors aren\u2019t buying yet another attempt by the Treasury to calm the rattled bond market", "full_content": "Back-to-back weak auctions for Treasury notes show that government repurchases haven\u2019t spurred demand for bonds.", "source": "MarketWatch Top Stories", "pub_date_str": "25 Sep 2026, 02:53 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Hedge Fund With 235% Return Says Gold Price Decline Is Temporary", "full_content": "(Bloomberg) -- Australian hedge fund manager Raphael Lamm, whose long-short gold fund has delivered a net return of more than 200% to investors since its launch last year, sees the recent decline in bullion as temporary, arguing that the key forces underpinning its long-term rally remain intact.\n\nThe \u201cunsustainability of fiscal situations in key markets,\u201d particularly US government debt of more than $40 trillion, as well as the growing central-bank allocations will support gold over the medium to long term, said Lamm, who co-manages the A$1.5 billion ($1.1 billion) L1 Gold Fund with Mark Landau. In the near term, prices are set to be driven by developments in the US-Iran war, real interest rates and inflation data, he said.\n\nGold has been under pressure since hitting a record in January, as surging energy prices and bets on Federal Reserve rate hikes weigh on the non-yielding metal. It is down about 16% since the US-Iran war erupted in late February.\n\n\u201cWhile there\u2019s been some headwinds to gold markets and the gold price since the Iran war, we think they\u2019re very temporary in nature,\u201d Lamm said in an interview. \u201cMost of the key drivers of demand for gold are going to remain intact or even strengthen over the medium term.\u201d\n\nBullion traded at $4,286.01 an ounce on Thursday evening in Sydney.\n\nLamm\u2019s fund, which pairs long positions in gold-related stocks with a short position in gold futures as a hedge, has returned a net 235% through August since its launch in February last year, according to a spokesperson. That compares with a gain of about 148% for VanEck Gold Miners ETF and 55% advance in physical gold prices over the same period.\n\nPart of the Melbourne-based L1 Group Ltd., which manages about $14 billion in assets, the L1 Gold Fund is using the decline in bullion to add to its long gold equity positions. Most of its holdings are in companies with market value of at least $5 billion, Lamm said.", "source": "LiveMint Markets", "pub_date_str": "25 Sep 2026, 02:52 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Oracle Seeks \u2018Force Majeure\u2019 on Data Center. Why It\u2019s Sinking the Stock. - Barron's", "full_content": "Oracle Seeks \u2018Force Majeure\u2019 on Data Center. Why It\u2019s Sinking the Stock. Barron's Oracle Cites \u2018Force Majeure\u2019 to Shield Itself on Controversial Data Center Bloomberg.com Stock Market Today, Sept. 24: Oracle Stock Dips As it Issues Force Majeure Notice on Project Jupiter Data Center Yahoo Finance Oracle\u2019s $18bn data centre debt under strain amid local pushback Financial Times Oracle\u2019s stock is falling as investors fear a data-center setback MarketWatch", "source": "Google News Business", "pub_date_str": "25 Sep 2026, 02:42 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Oil jump sends 30-year yields to two-decade high", "full_content": "NEW YORK, Sept 24 (Reuters) - Bond markets came under renewed pressure on Thursday with US 30-year bond yields hitting a more than 20-year high as rising oil prices reignited concerns about higher inflation and more Federal Reserve interest rate hikes.\n\nOil prices climbed about 3% to a one-week high after a Houthi missile attack on Saudi Arabia revived fears of supply disruptions, but trade was volatile and prices came off session highs after reports the US and Iran discussed reopening the Strait of Hormuz.\n\nThe interest-rate-sensitive US 2-year note rose 2.51 basis points to 4.92%.\n\nThe yield on benchmark US 10-year notes increased 8.17 basis points to 5.196%, the highest since 2007.\n\nThe 30-year bond yield gained 7.96 basis points to 5.4816%, the highest since 2004.\n\n\"The move higher in Treasury yields has likely been driven by a combination of rising Fed hike expectations, higher growth expectations, higher oil prices, fiscal concerns, and hyperscaler issuance,\" said Gennadiy Goldberg, head of US rates strategy at TD Securities. \"The sharp rise in rates this week was likely exacerbated by investor positioning amid a rapid resurgence of oil prices.\"\n\nElsewhere, the yield gap between French and German 10-year debt widened to its broadest level since Mario Draghi's 2012 \"Whatever it Takes\" speech.\n\nThursday's move follows a sharp selloff on Wednesday when benchmark 10-year yields posted their largest daily increase since the April 2025 tariff turmoil. That was driven in part by stronger-than-expected US business activity data, which showed prices paid surged to a nearly four-year high this month.", "source": "LiveMint Markets", "pub_date_str": "25 Sep 2026, 02:37 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "History shows financial calamities occur when rates rise rapidly like this: 'Something always breaks'", "full_content": "The 10-year Treasury note yield is spiking to levels not seen in years, and that may be a bad omen for financial markets.", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 02:27 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Costco earnings beat expectations, thanks to tariff refunds", "full_content": "Tariff refunds helped deliver a profit beat during Costco\u2019s fourth quarter.", "source": "MarketWatch Top Stories", "pub_date_str": "25 Sep 2026, 02:24 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Financial Statement Analysis"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Here\u2019s how to position your portfolio for the next AI wave, according to Morgan Stanley", "full_content": "There\u2019s still room for AI hardware stocks to rise, but analysts at Morgan Stanley say it\u2019s time to diversify into a wide variety of industries that are starting to realize AI benefits.", "source": "MarketWatch Top Stories", "pub_date_str": "25 Sep 2026, 02:20 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}], "updated_at": "25 Sep 2026, 04:41 AM IST", "total_stories": 382};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
