<script>

    const allData = {"general": [{"title": "Bigger home, but at what cost? How cheaper suburban rent quietly eats into your money, precious time and peace of mind", "full_content": "A bigger suburban home can offer better amenities at a lower price per square foot. However, cheaper housing does not always mean cheaper living.\n\nLonger journeys can add fuel bills, toll charges, cab fares and vehicle maintenance. Time spent in traffic can also reduce the value of those housing savings.\n\nNamrata Singh QPFP\u00ae\ufe0f, Founder \u2013 Arthasadhana Investments, gives the example of a household saving \u20b9 25,000 after moving farther from the city. Additional commuting and convenience expenses could consume \u20b9 15,000- \u20b9 20,000 of that amount.\n\nThe remaining savings appear smaller, especially when family members lose several hours each week. Rent or housing instalments alone cannot show whether the move makes financial sense.\n\nFor hybrid workers , fewer office days do not automatically mean affordable travel. A longer journey each time can still create substantial costs.\n\nSingh picks a use case of a single professional earning \u20b9 1.15 lakh monthly and moving to an outskirts township. The distance to work increases from 6 km to 28 km each way. Even with three office days weekly, fuel and toll expenses can rise sharply.\n\nLate-night journeys may require cabs charging higher fares during busy periods. Meanwhile, daily travelling time could increase from around 40 minutes to 2.5 hours.\n\nThat leaves less time for personal activities and productive work. The financial benefit of moving needs to be weighed against this loss.", "source": "LiveMint Money", "pub_date_str": "30 Sep 2026, 12:10 AM IST", "pub_date_relative": "2m ago"}, {"title": "Euro Falls to 16-Month Low as Hawkish Fed Bets Boost Dollar", "full_content": "(Bloomberg) -- The euro fell to its weakest level in 16 months as expectations that the Federal Reserve will further boost interest rates supported the US dollar.\n\nThe common currency dropped as much as 0.5% to $1.1312 on Tuesday, the lowest since May 2025. It was set for its worst monthly performance since July 2025.\n\n\u201cThis is broad-based dollar strength on rising yields,\u201d said Win Thin, chief economist at Bank of Nassau 1982. The US 30-year yield rose to the highest level since 2002, with nearly all currencies in the Group of 10 losing against the greenback in Tuesday trading.\n\nThe euro has been on a weakening trend as the dollar appreciated on expectations that more US interest rate increases will be needed to fight inflation. While the European Central Bank is seen raising rates as well, many investors believe the US economy will be able to withstand more monetary tightening than the eurozone, accounting for the dollar\u2019s relative strength.\n\nThe Bloomberg Dollar Spot Index is up about 2% in September, with strategists expecting the US currency to extend its rally. The euro lost 2.6% against its US counterpart this month.\n\nECB President Christine Lagarde said Monday that rising bond yields will curb economic expansion and limit the transfer of elevated energy costs to inflation. That was a \u201csurprise dovish tilt,\u201d said ING Groep NV currency strategist Francesco Pesole, suggesting that \u201cif one central bank hikes in October, it will be the Fed, and not the ECB.\u201d\n\nOptions pricing points to more losses for the euro, with long-term sentiment turning the most bearish since March 2025 last week. Morgan Stanley recently revised its outlook and now expects the common currency to fall 3% versus the dollar by mid-2027.\n\nThe euro is heading to $1.12 as \u201cwe expect the market to continue to add to dollar long positions, with the Fed unlikely to unwind hawkishness before the ECB,\u201d said Macro Hive strategist Ben Ford.", "source": "LiveMint Markets", "pub_date_str": "30 Sep 2026, 12:08 AM IST", "pub_date_relative": "5m ago"}, {"title": "OpenAI launches a rival to Meta\u2019s Muse, as the battle for AI agents kicks into high gear", "full_content": "Personal AI assistants are shaping up to be the new frontier for tech companies.", "source": "MarketWatch Top Stories", "pub_date_str": "30 Sep 2026, 12:04 AM IST", "pub_date_relative": "9m ago"}, {"title": "US drug lobby group PhRMA names former House leader Cantor as CEO", "full_content": "", "source": "Investing.com News", "pub_date_str": "30 Sep 2026, 12:02 AM IST", "pub_date_relative": "11m ago"}, {"title": "OpenAI targets $30 billion funding at $1.4 trillion valuation, Bloomberg News reports", "full_content": "", "source": "Investing.com News", "pub_date_str": "30 Sep 2026, 12:01 AM IST", "pub_date_relative": "12m ago"}, {"title": "US consumer confidence near 12-1/2-year low amid labor market fears", "full_content": "", "source": "Investing.com News", "pub_date_str": "30 Sep 2026, 12:01 AM IST", "pub_date_relative": "12m ago"}, {"title": "First Busey Corp stock hits 52-week low at 25.18 USD", "full_content": "", "source": "Investing.com News", "pub_date_str": "30 Sep 2026, 12:00 AM IST", "pub_date_relative": "12m ago"}, {"title": "Exclusive-US lawmakers including Sen. Warren push energy regulators to reject acquisition of power company AES", "full_content": "", "source": "Investing.com News", "pub_date_str": "30 Sep 2026, 12:00 AM IST", "pub_date_relative": "13m ago"}, {"title": "U.S. stocks mostly lower amid volatile trading in the bond market", "full_content": "", "source": "Investing.com News", "pub_date_str": "29 Sep 2026, 11:59 PM IST", "pub_date_relative": "14m ago"}, {"title": "Wilton Resources closes second tranche of private placement", "full_content": "", "source": "Investing.com News", "pub_date_str": "29 Sep 2026, 11:58 PM IST", "pub_date_relative": "15m ago"}, {"title": "ITC market cap slips below \u20b93.4 lakh crore after 34% fall in 2026. Good time to enter? Analysts weigh in", "full_content": "Diversified conglomerate ITC saw its shares continue to crash on Dalal Street in 2026, hitting multi-year lows as investors appeared to be worried that elevated commodity prices and input costs could hit the company's margins in the near term, with analysts expecting more price hikes to protect margins and the top line.\n\nThe Government of India earlier this year imposed a higher excise duty on cigarettes, while ITC has raised prices across several cigarette brands. Although this is expected to improve realizations, the Street remains worried that higher prices could result in a sharper decline in cigarette volumes.\n\nFollowing the excise duty setback, surging key input prices, such as sugar, copra and palm oil, have sent the stock into a tailspin. In August, the stock hit a three-year low before seeing some modest recovery in September. The shares began the year with a massive drop of 20% in January, and the weakness persisted in the subsequent months, resulting in a 34% drop so far.\n\nThe fall not only created significant wealth erosion for shareholders but also wiped out \u20b9 1.72 lakh crore in the company's market capitalization, which fell to \u20b9 3.32 lakh crore at Tuesday's close.\n\nTo be precise, the stock came under pressure after touching a record high of \u20b9 499 in September 2024 and has so far lost 47% from that peak.\n\nFor a blue-chip stock, this kind of fall is a rare occurrence, but it highlights the deepening concerns.\n\nIn its recent report, domestic brokerage firm 360 ONE Capital Research has maintained its 'buy' rating on ITC with an unchanged target price of \u20b9 440 per share. The brokerage believes the recent weakness has created an opportunity as the impact of cigarette price increases starts flowing through profitability.\n\nAt the same time, the brokerage expects support from FMCG, paperboards and packaging, agri and ITC's technology businesses.", "source": "LiveMint Markets", "pub_date_str": "29 Sep 2026, 11:58 PM IST", "pub_date_relative": "15m ago"}, {"title": "Education Department extends deadline for student loan interest rate discount", "full_content": "The Trump administration announced on Tuesday that it will extend the deadline for federal student loan borrowers to get a reduction of 1 percentage point on their interest rate.\n\nPreviously, the U.S. Department of Education said borrowers had until the end of the day on Wednesday to sign up for the automatic payments and benefit from the reduced rate. Now it says federal student loan holders will have until Dec. 31.\n\nOnce borrowers enroll, the benefit will last through June 30, 2028.\n\nNearly 2 million federal student loan borrowers have signed up for autopay since the discount became available over the summer, the department said.\n\nTypically, borrowers on autopay have had access to a 0.25 percentage point discount.\n\nMore than 42 million Americans carry student loans, and the outstanding debt exceeds $1.7 trillion. The current average interest rate on federal student loans is 6.54%, according to higher education expert Mark Kantrowitz.\n\nTo qualify for the interest rate discount, your debt must be from the Direct Loan program, Kantrowitz said. That includes Direct Subsidized Loans, Direct Unsubsidized Loans, Direct PLUS Loans and Direct Consolidation Loans. Parent PLUS borrowers will also be eligible, as long as their loans are from the Direct Loan program, he said.\n\nFederal Family Education Loans, or FFEL, aren't eligible for the temporary reduced rate. As the federal government is offering the discount, the benefit does not extend to private student loans.", "source": "CNBC Top News", "pub_date_str": "29 Sep 2026, 11:58 PM IST", "pub_date_relative": "15m ago"}, {"title": "Good news for OpenAI is great news for Oracle\u2019s stock \u2014 here\u2019s why", "full_content": "Wall Street is cheering AI stocks as OpenAI gets closer to a revenue milestone.", "source": "MarketWatch Top Stories", "pub_date_str": "29 Sep 2026, 11:58 PM IST", "pub_date_relative": "15m ago"}, {"title": "Top 5 hybrid mutual funds: Quant Multi Asset tops the 10-year return chart at 18%; check which schemes lagged", "full_content": "Hybrid mutual funds invest across equity, debt, and, depending on the scheme, other asset classes. The allocation varies by category, making these funds suitable for investors looking for different levels of equity exposure and diversification within a single mutual fund.\n\nUnder the SEBI framework, hybrid mutual funds are divided into seven categories:\n\nHere are the top 5 hybrid funds that delivered the highest 10-year returns, along with those that lagged in this period.\n\n*Source: Value Research, Direct plans, CAGR as on 28 September 2026\n\nQuant Multi Asset Allocation Fund topped the list with a 10-year return of 18.39%. Bank of India Aggressive Hybrid Fund followed at 16.03%, while Quant Aggressive Hybrid Fund delivered 15.81%.\n\nICICI Prudential Multi Asset Allocation Fund and ICICI Prudential Aggressive Hybrid Fund also featured among the top performers, with returns of 15.04% and 14.80%, respectively.\n\nFor investors, the numbers also highlight that hybrid funds with higher equity exposure or greater flexibility in asset allocation can have significantly different long-term return outcomes.\n\n*Source: Value Research, Direct plans, CAGR as on 28 September 2026", "source": "LiveMint Money", "pub_date_str": "29 Sep 2026, 11:56 PM IST", "pub_date_relative": "17m ago"}, {"title": "Senate Republican says Chinese vehicle bill will not ban Mercedes-Benz", "full_content": "A sponsor of a bill to toughen a US government \u200cban on Chinese vehicles said on Tuesday that talks are ongoing to ensure that German automaker Mercedes-Benz is not banned from selling vehicles in the US.\n\nThe bill approved by the Senate Commerce Committee in July would ban companies with more than 15% ownership by Chinese entities from selling vehicles in the \u200bU.S. Mercedes-Benz has nearly 20% passive ownership from Chinese entities.\n\n\"What we're not going to do, obviously, is ban Mercedes-Benz vehicles in America,\" said Republican Bernie Moreno, adding, \"there's concern that, can they get to 15% without debilitating their company?\"\n\nMoreno hopes to try to win fast-track approval for the Chinese vehicle bill this week before the Senate adjourns until November as discussions continue with Senator Rand Paul.\n\nMoreno said there were discussions about how to ensure that Volvo Cars , majority owned by China's Geely Holding , could continue to sell vehicles in the US.\n\n\"We're looking at a variety of different things,\" Moreno said.\n\nMoreno also noted that Aston Martin \u2014 17% owned by Geely and Britain's Lotus, which is majority owned by Geely \u2014 both could be barred because of the law.\n\nThe bill's other chief sponsor, Democratic Senator Elissa Slotkin, said last week that all Democrats support moving ahead and only Paul opposes it.", "source": "CNBC Top News", "pub_date_str": "29 Sep 2026, 11:55 PM IST", "pub_date_relative": "18m ago"}, {"title": "Nifty 50 prediction: Hammer formation hints short term trend reversal | Support, resistance for Sept 30", "full_content": "The Nifty 50 witnessed one of its sharpest declines in the September series in recent years, registering a fall of 1,618 points or 6.6%.\n\nThe Nifty opened with a gap down and slipped to an intraday low of 22,569.65 within the first hour of trade. However, the index recovered from the lows and remained within the opening hour\u2019s range for the rest of the session. It finally closed at 22,716.20, down 64.05 points or 0.28%, after recovering more than 140 points from the day\u2019s low.\n\nTuesday\u2019s price action resulted in the formation of a hammer-like candlestick pattern, with a long lower shadow and a small real body near the upper end of the trading range. This pattern generally indicates that buyers emerged at lower levels after initial selling pressure.\n\nA hammer formation after a prolonged decline can indicate a possible short-term reversal, as it suggests that bears were unable to sustain lower levels. However, confirmation in the following session remains important before considering it a reliable reversal signal.\n\nTrading volumes were the highest since August 31, indicating increased participation during the recovery from lower levels. As long as Tuesday\u2019s low remains protected, the index may witness some buying interest at lower levels.\n\nMarket breadth remained negative, with more stocks declining than advancing, while trading volumes were higher compared with the previous session.\n\nThe Nifty closed below the lower Bollinger Band, which often indicates that the index has moved significantly away from its recent average range. After such sharp deviations, markets generally tend to move towards mean reversion, although the timing and strength of the recovery remain uncertain.\n\nThe index is currently trading around 5.08% below its 50-DMA, highlighting the extent of the recent correction. Additionally, the 14-period daily RSI is in oversold territory.", "source": "LiveMint Markets", "pub_date_str": "29 Sep 2026, 11:53 PM IST", "pub_date_relative": "19m ago"}, {"title": "Disney laying off around 300 employees in latest cuts under new CEO Josh D'Amaro", "full_content": "Disney is laying off around 300 employees in its latest round of job cuts since CEO Josh D'Amaro took the helm earlier this year , according to a person familiar with the matter.\n\nThe majority of the cuts were to human resources and technology roles, said the person, who spoke on the condition of anonymity because they were not authorized to speak publicly.\n\nIn April, Disney planned to eliminate as many as 1,000 roles , as D'Amaro consolidated its enterprise marketing division, CNBC reported at the time. Further cuts were made in July as the company reduced its workforce by several hundred people across corporate functions, including at Pixar, ESPN, Disney Entertainment Television and Disney's studios, according to various media reports. The majority of those layoffs occurred within Pixar and National Geographic.\n\nDisney warned about the most recent round of reductions in its August earnings report , saying it was evaluating ways to reduce costs at the company. Around that time, Disney also began offering early-retirement buyout packages to longtime executives.\n\n\"We remain highly focused on reducing costs across the enterprise to create incremental capacity to invest for growth and are evaluating a variety of levers, including reductions in labor and SG&A,\" Disney said in that report. \"We are mid-stream in this work and will provide future updates on progress.\"\n\nDeadline was first to report this most recent round of layoffs.\n\nD'Amaro stepped in as CEO at Disney in March, replacing longtime chief executive Bob Iger, and has prioritized a strategy dubbed \"One Disney\" that aims to better align the company's many divisions and integrate compatible businesses.\n\nThe goal is a seamless flywheel that brings together Disney's intellectual property across its film, streaming, theme park, consumer goods, gaming and sports divisions, D'Amaro has said.", "source": "CNBC Top News", "pub_date_str": "29 Sep 2026, 11:51 PM IST", "pub_date_relative": "22m ago"}, {"title": "Oura delayed IPO after some investors balked at valuation - report", "full_content": "", "source": "Investing.com News", "pub_date_str": "29 Sep 2026, 11:50 PM IST", "pub_date_relative": "23m ago"}, {"title": "Do homebuyers lose claim to interest on delayed flat once you accept possession? Here's what Allahabad HC ruling states\u2026", "full_content": "The Allahabad High Court in a ruling has held that homebuyers do not lose the statutory right to claim interest for delay in getting possession of a house, merely because they subsequently accepted the flat, PTI reported.\n\nIn its order dated Wednesday, 23 September, the Lucknow bench of the Allahabad HC noted that the Real Estate (Regulation and Development) Act i.e. RERA does not specifically state or prescribe any limitation period for claiming interest on account of delayed possession, the report added.\n\nAccording to the report, the bench of Justice Prashant Kumar dismissed the appeal filed by Antriksh Developers and Promoters regarding a dispute in its Antriksh Golf View project in Sector 78 of Noida , Uttar Pradesh.\n\nJustice Kumar observed that homebuyer Shyam Sunder Agrawal booked a flat in the project in question in 2010, with possession originally dated for November 2012. However, possession was offered by the builder only in May 2017, without the occupancy certificate and other necessary documents, it added.\n\nWhile hearing the case, the RERA Appellate Tribunal ordered the developer to pay interest on the amount deposited by Agrawal for the period from December 2012 to May 2017 at a rate of 1% above the Marginal Cost of Fund Based Lending Rate (MCLR), the report added.\n\nThis RERA tribunal order was challenged in the HC by the developer, who claimed that the delay was caused by a National Green Tribunal (NGT) order which restricted construction and the grant of occupancy certificates within a 10-km radius of the Okhla Bird Sanctuary.\n\nThe high court however rejected this claim, and noted that the developer's own case was that the project had been completed in 2014 and an application for the occupancy certificate had also been made that year.", "source": "LiveMint Money", "pub_date_str": "29 Sep 2026, 11:50 PM IST", "pub_date_relative": "23m ago"}, {"title": "Property Play: Homeowners are sitting on record equity \u2013 and not using it", "full_content": "A version of this article first appeared in the CNBC Property Play newsletter with Diana Olick. Property Play covers new and evolving opportunities for the real estate investor, from individuals to venture capitalists, private equity funds, family offices, institutional investors and large public companies. Sign up to receive future editions, straight to your inbox.\n\nU.S. homeowners have more housing wealth than ever before, thanks to fast-rising home prices over the last several years. But they aren't spending very much of it.\n\nIn the second quarter of this year, there was a collective $11.5 trillion in so-called \"tappable\" home equity, according to Cotality, a data technology company. That is the amount borrowers could take out in debt while still leaving enough in the home to satisfy lenders. In total equity, borrowers with a mortgage have $17.9 trillion, or, on average, $310,000 per homeowner, which is $6,000 more than they had in the previous three months.\n\nWhile homeowners did originate nearly 20% more second mortgages or home equity lines of credit (HELOCs) compared with the first quarter, it still represented less than 0.1% of the total tappable equity that they could have used.\n\nCNBC's Property Play with Diana Olick covers new and evolving opportunities for the real estate investor, delivered weekly to your inbox.\n\n\"The borrowers with the most housing wealth are often the least likely to tap it,\" said Thom Malone, principal economist at Cotality. \"They tend to have low mortgage rates, strong cash flow, and little reason to move.\"\n\nSo all that cash sits on the sidelines and continues to compound because home prices in most areas of the country are still seeing small gains. Consumers are also increasingly nervous about the state of the economy and rising interest rates.", "source": "CNBC Top News", "pub_date_str": "29 Sep 2026, 11:49 PM IST", "pub_date_relative": "24m ago"}, {"title": "Waldron long seen as next Goldman CEO. The question is when", "full_content": "", "source": "Investing.com News", "pub_date_str": "29 Sep 2026, 11:49 PM IST", "pub_date_relative": "24m ago"}, {"title": "Stock market today: Dow, S&P 500, Nasdaq slip as oil retreats, Anthropic and OpenAI fuel AI jitters - Yahoo Finance", "full_content": "Stock market today: Dow, S&P 500, Nasdaq slip as oil retreats, Anthropic and OpenAI fuel AI jitters Yahoo Finance U.S. Stocks Decline as Relentless Rise in Treasury Yields Continues WSJ Wall St falls as bond yields test multi-decade highs Reuters Stock Market Today: Major Indexes Decline as Treasury Yields Rise Further; Oil Prices Slip Investopedia Stock Market Today: Dow falls over 300 points, S&P 500 and Nasdaq edge lower as Treasury yields extend gains; tech CEOs to meet Trump MarketWatch", "source": "Google News Business", "pub_date_str": "29 Sep 2026, 11:49 PM IST", "pub_date_relative": "24m ago"}, {"title": "Axsome Therapeutics options flow shows heavy put skew ahead of binary catalyst", "full_content": "", "source": "Investing.com News", "pub_date_str": "29 Sep 2026, 11:47 PM IST", "pub_date_relative": "26m ago"}, {"title": "OpenAI DevDay live updates: AI lab unveils Dots agents and is in talks for new funding round", "full_content": "OpenAI is holding its annual DevDay developer conference on Tuesday, where the artificial intelligence company announced a flurry of new products and features .\n\nThis year's DevDay comes as OpenAI has been under intense pressure to address mounting safety concerns after it disclosed several incidents where its models behaved in unintended ways, and the startup held back its latest Astra model over safety concerns.\n\nEarlier this month, the company endorsed a call to slow down the pace of advanced AI model development in order to better address the technology's risks.\n\nTune in at 3:15 p.m. ET as OpenAI CFO Sarah Friar joins CNBC TV to talk about AI safety and the company's latest announcements. Watch in real time on CNBC+ or the CNBC Pro stream.\n\nCNBC's reporters are covering the OpenAI DevDay event live from San Francisco, and remotely from Englewood Cliffs, New Jersey.\n\nAltman left the stage, which means this year's DevDay keynote has come to a close.\n\nThe company showcased more than 20 different products and features to the roughly 2,500 people in attendance.\n\n\"AI should be about giving people more power over their own lives, more tools to create, learn, discover, expand knowledge, and with everything we launch today, and the incredible creative spirit that you all bring, we hope that we're going to get to that future,\" Altman said. \"That is the future we are excited to build with you all.\"", "source": "CNBC World Economy", "pub_date_str": "29 Sep 2026, 11:43 PM IST", "pub_date_relative": "30m ago"}, {"title": "YouTube Ecosystem Adds Over Rs 18,000 Crore To India's GDP, Supports 9.6 Lakh Jobs In 2025", "full_content": "The number of YouTube channels in India generating six figures or more in revenue (INR) rose by over 30% year-on-year.", "source": "NDTV Profit", "pub_date_str": "29 Sep 2026, 11:43 PM IST", "pub_date_relative": "30m ago"}, {"title": "OpenAI DevDay live updates: AI lab unveils Dots agents and is in talks for new funding round - CNBC", "full_content": "OpenAI DevDay live updates: AI lab unveils Dots agents and is in talks for new funding round CNBC Introducing dots openai.com OpenAI unveils \u2018dots\u2019 to rival to Meta\u2019s Muse, plus a $500 monthly plan Fortune The 5 biggest announcements from OpenAI's blockbuster AI conference Axios OpenAI debuts Dots AI agents in challenge to Meta\u2019s popular Muse agent Yahoo Finance", "source": "Google News Business", "pub_date_str": "29 Sep 2026, 11:43 PM IST", "pub_date_relative": "30m ago"}, {"title": "RBI Panel Recommends 11.2% Increase In States' WMA Limit To Rs 67,839 Crore", "full_content": "Based on the recommendations made by the previous Advisory Committee (Chairman: Sudhir Shrivastava), the RBI had revised the aggregate WMA limits for the states from Rs 32,225 crore to Rs 47,010 crore, effective from April 1, 2022.", "source": "NDTV Profit", "pub_date_str": "29 Sep 2026, 11:37 PM IST", "pub_date_relative": "36m ago"}, {"title": "Alaska Airlines CEO 'not overly concerned' about new Boeing Max 10 delay", "full_content": "Alaska Airlines CEO Ben Minicucci said Tuesday he is \"not overly concerned\" about a new software glitch that's further delaying the certification of Boeing's 737 Max 10 , which is already years behind schedule.\n\nAlaska earlier Tuesday unveiled a massive cabin overhaul with more premium seats across its fleet, including lie-flat suites on the Max 10, which are slated to start flying in late 2028. Minicucci told CNBC's Phil LeBeau that the launch could be postponed if the latest Max 10 delay lasts several months, but he added that the Seattle-based airline is working with the Federal Aviation Administration and Boeing on certification.\n\nFAA Administrator Bryan Bedford told reporters Monday that the agency is assessing a software issue on the planes and that its approval of the aircraft will be delayed, sending Boeing shares down sharply.\n\nThe Max 10 \u2014 which counts Alaska, United Airlines , Delta Air Lines and American Airlines among its customers \u2014 is the last model of Boeing's bestselling Max family of jets that's waiting for federal approval. Boeing's CEO said earlier this month that he expected approval of the Max 10 \"very soon.\"\n\nBoeing over the weekend said it recently flagged the problem, which could cut off some automated navigation information to pilots, in an updated software program to airlines. The issue could occur with the vertical navigation system after an aircraft misses an approach and has to go around and line up to land again.\n\nMichael O'Leary, CEO of European budget carrier Ryanair, which is a Max 10 customer, told reporters at a conference in Warsaw, Poland, earlier Tuesday that he expected the Max 10 certification to come in \"a matter of days, not weeks or months,\" Reuters reported.", "source": "CNBC Top News", "pub_date_str": "29 Sep 2026, 11:33 PM IST", "pub_date_relative": "39m ago"}, {"title": "India's Population To Age Sharply Later This Century As Fertility Falls Below Replacement: Moody's", "full_content": "More than 70% of the global population now lives in countries with fertility at or below replacement levels, with emerging markets including India also ageing.", "source": "NDTV Profit", "pub_date_str": "29 Sep 2026, 11:33 PM IST", "pub_date_relative": "39m ago"}, {"title": "Allcargo Logistics Appoints Vijay Nehra As Managing Director & CEO", "full_content": "Both Vijay Nehra and Ketan Kulkarni will report to Punit Misra, Chief Business Officer, Allcargo Group.", "source": "NDTV Profit", "pub_date_str": "29 Sep 2026, 11:33 PM IST", "pub_date_relative": "40m ago"}, {"title": "Skoda Cars To Get Costlier From October 1; Price Hike Capped At Rs 20,000", "full_content": "Skoda Auto India will revise ex-showroom prices from October 1, with the increase varying by model and variant and capped at Rs 20,000.", "source": "NDTV Profit", "pub_date_str": "29 Sep 2026, 11:32 PM IST", "pub_date_relative": "40m ago"}, {"title": "Trump Accounts will auto-enroll children, potentially adding 60 million accounts: Treasury", "full_content": "The U.S. Department of the Treasury said Trump Accounts will begin auto-enrolling millions of children as early as Oct. 1, according to temporary regulations published Tuesday.\n\nThe change could increase the number of children enrolled in Trump Accounts in 2026 by more than 60 million, the guidance said. In future years, the regulations could boost enrollment by about two million accounts a year.\n\nSo far, 7 to 8 million American children have been signed up for Trump Accounts, and \"we anticipate within a month we will have 70 million because we will go to auto-enroll,\" Treasury Secretary Scott Bessent said Sept. 15 at a hearing held by the House Financial Services Committee .\n\nThe tax-deferred investing accounts, which launched on July 4, include a one-time $1,000 deposit from the Treasury Department for kids born between 2025 and 2028. Other funds may also be available for qualifying families.\n\nBut because signing up for a Trump Account has required families to \"opt in\" by filing IRS Form 4547 with their tax return or via TrumpAccounts.gov \u2014 overall participation rates, especially among low-income families, has been low, other research shows.\n\nThe Social Security Administration previously said it would introduce a process to enroll newborns at the hospital at the same time families request a Social Security number during the birth registration process.\n\nAuto-enrollment \"would certainly reach the vast majority of parents and children,\" said Madeline Brown, senior policy associate at the Urban Institute, a Washington-based think tank.\n\nHowever, \"assuming that can happen, after families are enrolled there is still a lot of work to be done to build engagement and awareness,\" Brown said.", "source": "CNBC Top News", "pub_date_str": "29 Sep 2026, 11:31 PM IST", "pub_date_relative": "41m ago"}, {"title": "Govt Lowers Foodgrain Production Target By 2.63 mn Tonnes For 2026-27 Over El Nino Fears", "full_content": "Of the total target set for 2026-27, the foodgrain production target for the 2026 kharif season is 196.21 million tonnes and 177.72 million tonnes for the rabi crop season.", "source": "NDTV Profit", "pub_date_str": "29 Sep 2026, 11:30 PM IST", "pub_date_relative": "43m ago"}, {"title": "Tech leaders arrive at White House for AI luncheon with Trump", "full_content": "Major technology leaders converged on the White House on Tuesday for a luncheon with President Donald Trump and House Speaker Mike Johnson as calls for an artificial intelligence slowdown and regulation reach a fever pitch.\n\n\"The main issue that you have and I have is we have to take responsibility for the dangers we're aware of,\" Palantir CEO Alex Karp told CNBC outside the White House on Tuesday. \"All of us do. And by the way, American people don't want separate rules for tech people and for themselves.\"\n\nA seating chart posted to Trump's Truth Social account showed the president seated next to Nvidia CEO Jensen Huang and Tesla and SpaceX CEO Elon Musk , followed by Meta's Mark Zuckerberg and Google 's Sundar Pichai.\n\nThe chart shows Vice President JD Vance opposite the president, between Amazon founder Jeff Bezos and Johnson.\n\nOther attendees included Microsoft 's Satya Nadella, Anthropic 's Dario Amodei and Tom Brown, OpenAI 's president Greg Brockman and senior administration officials such as Treasury Secretary Scott Bessent.\n\nOpenAI is simultaneously hosting its annual DevDay developer conference in San Francisco. John Ternus, Apple 's new CEO, did not appear on the list.\n\nThe luncheon coincided with an all-day event hosted by the president and vice president, where the administration unveiled a new AI-powered chatbot for government websites.\n\nConcerns over the rapid pace of AI development have intensified in Washington and Silicon Valley as cases of agent-orchestrated attacks mount and major researchers warn of serious consequences for humanity.", "source": "CNBC World Economy", "pub_date_str": "29 Sep 2026, 11:28 PM IST", "pub_date_relative": "45m ago"}, {"title": "Want SIFs in your portfolio? Should you invest directly or choose the new mutual fund PRIM route \u2014 experts explain", "full_content": "With the introduction of SEBI \u2019s new Portfolio Managers Route for Investing in Mutual Fund units (PRIM), investors can get a PMS-like way to invest in direct mutual fund units and SIFs.\n\nThrough this route, investors can get a professionally managed portfolio of mutual funds, SIFs and ETFs, with a minimum investment of \u20b9 25 lakh.\n\nSIFs are specialised investment funds that follow specific strategies, with a minimum investment of \u20b9 10 lakh. This raises the question: should investors invest in SIFs directly or use the PRIM route? Here's what experts have to say.\n\n\u201cStart with what each route is. An SIF is a product. PRIM is a portfolio management service. An investor who buys an SIF directly is choosing one strategy. An investor who goes through a portfolio manager under PRIM is paying someone to decide which strategies to hold, how much of each, and when to change the mix,\u201d Sandeep Jethwani, Co-founder, Dezerv, said.\n\nThe real question, then, is whether you need that second layer of decision-making and whether you are willing to pay for it. Under PRIM, the portfolio manager invests in direct mutual fund plans too, but the investor pays a management fee of up to 1% of assets, Jethwani added.\n\nFor some investors, choosing an SIF directly may be a natural extension of how they already manage their investments. For others, paying for professional portfolio management may bring greater convenience and discipline. The right choice depends on the investor\u2019s needs, risk appetite and level of involvement, Sanjiv Bajaj, Joint Chairman and MD at Bajaj Capital, added.\n\nPRIM is a holistic portfolio, while an SIF is a standalone offering.", "source": "LiveMint Money", "pub_date_str": "29 Sep 2026, 11:24 PM IST", "pub_date_relative": "49m ago"}, {"title": "Medicare Advantage plans will be cheaper next year. Here\u2019s the new cost.", "full_content": "Medicare beneficiaries can change their coverage during open enrollment, which begins Oct. 15.", "source": "MarketWatch Top Stories", "pub_date_str": "29 Sep 2026, 11:15 PM IST", "pub_date_relative": "58m ago"}, {"title": "Rs 1 Lakh Invested In This Stock Nearly 7 Years Ago Is Now Worth Over Rs 53 Lakh", "full_content": "HBL Engineering shares have risen from around Rs 15 in 2019 to around Rs 800, while consolidated profit rose from Rs 26.2 crore in FY20 to Rs 814.9 crore in FY26", "source": "NDTV Profit", "pub_date_str": "29 Sep 2026, 11:12 PM IST", "pub_date_relative": "1h ago"}, {"title": "Anthropic Warns Of 'Unknown Legal Risks' From Rogue AI Agents In IPO Prospectus", "full_content": "Anthropic said errors, security vulnerabilities or misalignment could lead to data deletion or unauthorised financial transactions as agents operate autonomously.", "source": "NDTV Profit", "pub_date_str": "29 Sep 2026, 11:10 PM IST", "pub_date_relative": "1h ago"}, {"title": "US 30-Year Treasury Yields Spike To 5.6%, Highest Since 2002", "full_content": "The 30-year yield rose above 5.61% amid intensifying selloff across global debt markets.", "source": "NDTV Profit", "pub_date_str": "29 Sep 2026, 11:07 PM IST", "pub_date_relative": "1h ago"}, {"title": "Jamie Dimon has a plan to revive the West: A 'big, beautiful' deal with Europe", "full_content": "JPMorgan Chase boss Jamie Dimon is pitching his vision for the Western world's future \u2014 and it hinges on Europe rebooting its sluggish economy and strengthening its defense capabilities.\n\n\"I believe the U.S. should offer Europe a major inducement: If it executes meaningful economic and military reforms, including everything that we consider crucial for security and resiliency, the U.S. will negotiate one big, beautiful economic and free-trade agreement with Europe,\" Dimon wrote in an opinion piece in The Wall Street Journal published Monday .\n\n\"Many of the current disputes between Europe and the U.S. are minor compared with this agreement's size and benefits. This pact could be extended to friendly democracies including Canada, Mexico, Japan, South Korea, Australia and the Philippines,\" Dimon said.\n\nSeamless trade ties would be a \"game changer\" for the U.S. and its allies, allowing them to \"set the global rules on trade\" and binding them together \"in the face of autocratic pressure,\" he added.\n\nThe free trade approach advocated by Dimon stands in contrast to the more protectionist policies currently pursued by the Trump administration.\n\nWashington's relationship with some of its biggest trade partners, including the European Union and Canada , have soured amid President Donald Trump 's rollout of tariffs and combative negotiating tactics.\n\nDimon's Journal op-ed singled out the European Union's need to complete its long-awaited Capital Markets Union and Banking Union in order to boost its competitiveness; fulfilling the recommendations of the Draghi report ; and ensuring the bloc's defense, manufacturing and energy independence.\n\n\"A Europe that can mobilize capital, scale innovative companies, consolidate defense production, reduce strategic dependencies and generate stronger growth would be a more capable security partner, a more resilient economic partner and a stronger counterweight to Beijing's economic power,\" he said.", "source": "CNBC Top News", "pub_date_str": "29 Sep 2026, 11:04 PM IST", "pub_date_relative": "1h ago"}, {"title": "OpenAI Ignored Employees\u2019 Warnings About Safely Testing A.I. Models - The New York Times", "full_content": "OpenAI Ignored Employees\u2019 Warnings About Safely Testing A.I. Models The New York Times OpenAI Has Gone Rogue The Atlantic Scoop: Top AI companies probing tens of thousands of security incidents Axios OpenAI Agents Used Aggressive Techniques to Access U.N. Website WSJ OpenAI pauses training of latest models after agents searched U.S. government sites in unexpected ways NBC News", "source": "Google News Business", "pub_date_str": "29 Sep 2026, 11:03 PM IST", "pub_date_relative": "1h ago"}, {"title": "Nifty 50 down 13.5% in 2026, set for worst year in 15 years: Key factors weighing on market sentiment", "full_content": "The year 2026 is shaping up to be the worst for domestic equities in more than a decade, as a combination of weak global and domestic factors has added persistent downward pressure on Dalal Street, pushing the market into double-digit losses.\n\nBulls had hoped that this year could be another record-breaking year for equities, as recent economic reforms and higher capex spending could fuel the rally. However, those expectations soon faded after the US launched attacks on Iran in February, which completely changed the domestic equity backdrop for the worse.\n\nDomestic conditions were also challenging for bulls, as a falling rupee, limited exposure to AI, weakening agricultural conditions, and sustained selling by overseas investors have put the Nifty 50 on track for its first annual decline in a decade.\n\nIn the current year, the index has crashed 13.5% so far, positioning it for its biggest annual decline since 2011, when it plunged 24.62%. Major contributors to the index's decline were tech stocks, including Infosys, Wipro, and TCS. They were followed by Reliance Industries and ITC.\n\nOver the last two decades, the index has logged double-digit losses only twice. From 2016 to 2025, the markets enjoyed an uninterrupted bull run, closing each of those years in the green.\n\nIf not for the ongoing support from domestic mutual funds, largely backed by retail investors, the losses could have been even steeper.", "source": "LiveMint Markets", "pub_date_str": "29 Sep 2026, 11:02 PM IST", "pub_date_relative": "1h ago"}, {"title": "NPS Vatsalya: Who can make gift contributions to a child's account? Explained", "full_content": "The National Pension Scheme's spin-off for children, known as the NPS Vatsalya Scheme, allows parents to open and operate an account for their minor child, till such time that the sole beneficiary attains majority at 18 years of age.\n\nLaunched in September 2024, it is regulated and administered by the Pension Fund Regulatory Authority of India ( PFRDA ) and allows parents to secure their child's financial future.\n\n\u2013 Contributions under the scheme can be made by the guardian or the subscriber through various modes of contribution as stipulated by PFRDA from time to time.\n\n\u2013 The minimum contribution for account opening and annual contribution shall be \u20b9 1,000. However, as the objective of the scheme is to obtain a compounding effect for the long-term savings, it is advisable to contribute as much as possible, depending on the capacity to pay or contribute.\n\n\u2013 The parent or guardian needs to exercise the following choices at the time of opening of the account:\n\nAccording to an NPS circular, in addition to the child's parents or guardians, their relatives and friends may also make \u201cgift contributions\u201d to a subscriber by remitting the contributions to the NPS Vatsalya account.\n\nParents, guardians, relatives and friends may contribute through any of the following modes:\n\nDisclaimer: This story is for educational purposes only. We advise investors to check with certified experts before making any investment decisions.", "source": "LiveMint Money", "pub_date_str": "29 Sep 2026, 11:02 PM IST", "pub_date_relative": "1h ago"}, {"title": "I\u2019m 77, pay rent and live off Social Security, but I help homeless people. Why are so many people going hungry?", "full_content": "\u201cI am a retired senior citizen living check-to-check.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "29 Sep 2026, 11:00 PM IST", "pub_date_relative": "1h ago"}, {"title": "BMW Targets 25% Cut In Energy Use Per Vehicle By 2030, Pledges 100% Renewable Switch By 2050", "full_content": "BMW plans to cut energy use per vehicle by 25% by 2030, while targeting at least 25% recycled content and renewable power by 2050.", "source": "NDTV Profit", "pub_date_str": "29 Sep 2026, 10:58 PM IST", "pub_date_relative": "1h ago"}, {"title": "El Pollo Loco to open first New York restaurant as it aims to become national chicken chain", "full_content": "El Pollo Loco will open its first New York City restaurant next year as the California chain looks to become a national player.\n\nEl Pollo Loco has closed three development agreements for a total of 15 restaurants in the New York area over the next five years, the company announced on Tuesday. The first location will open in Queens in mid-2027.\n\nFounded in Mexico in 1975, El Pollo Loco opened its first U.S. restaurant in Los Angeles. The majority of its locations are still concentrated in California, but its footprint has grown to more than 500 restaurants across 10 states. It is best known for its bone-in grilled chicken, although its menu has grown.\n\nCEO Liz Williams wants to make El Pollo Loco into a national chain. To expand outside its Southwestern stronghold, El Pollo Loco will open restaurants on the East Coast and then move its way back to the West, she said.\n\nTo succeed in new markets, the chain will have to build its brand awareness in a crowded space where consumers are watching their budgets.\n\n\"Being a 50-year-old brand, people have seen it over the years and have always had that curiosity, but we have our work cut out,\" Williams said.\n\nUnder Williams' leadership, El Pollo Loco has embarked on a turnaround focused on modernizing its restaurants and expanding its menu into more convenient options, like wraps and chicken tenders. The efforts have started to pay off for the chain, which has reported three straight quarters of same-store sales growth.\n\n\"In the current quarter, we've expanded margins, and the business model is healthy overall,\" Williams said. \"The brand has gotten even stronger and healthier.\"", "source": "CNBC Top News", "pub_date_str": "29 Sep 2026, 10:56 PM IST", "pub_date_relative": "1h ago"}, {"title": "Meta is bringing Muse AI to small businesses \u2014 and it already has a huge head start", "full_content": "Meta announced Muse for Small Business, capitalizing on the 200 million small businesses already on its platform.", "source": "CNBC World Economy", "pub_date_str": "29 Sep 2026, 10:56 PM IST", "pub_date_relative": "1h ago"}, {"title": "US 30-year Treasury yield hits highest since 2002", "full_content": "Government debt extends decline as inflation and surging oil prices weigh on market", "source": "FT Markets", "pub_date_str": "29 Sep 2026, 10:55 PM IST", "pub_date_relative": "1h ago"}, {"title": "Trade Setup For Sept 30: Nifty Support Slips To 22,600 As Weakness Persists", "full_content": "However, a decisive break below 22,600 could intensify selling pressure. Chouhan expects the index to potentially slip towards 22,50022,400 if the support gives way.", "source": "NDTV Profit", "pub_date_str": "29 Sep 2026, 10:54 PM IST", "pub_date_relative": "1h ago"}, {"title": "Pharma's new top lobbyist is a former House majority leader - Politico", "full_content": "Pharma's new top lobbyist is a former House majority leader Politico Eric Cantor, former House leader, named PhRMA president and CEO Axios US Drug Lobby Group PhRMA Names Former House Leader Cantor as CEO U.S. News & World Report Exclusive: PhRMA picks Eric Cantor as next chief Endpoints News PhRMA locks in former House majority leader Cantor as next CEO Fierce Pharma", "source": "Google News Business", "pub_date_str": "29 Sep 2026, 10:53 PM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "Bigger home, but at what cost? How cheaper suburban rent quietly eats into your money, precious time and peace of mind", "full_content": "A bigger suburban home can offer better amenities at a lower price per square foot. However, cheaper housing does not always mean cheaper living.\n\nLonger journeys can add fuel bills, toll charges, cab fares and vehicle maintenance. Time spent in traffic can also reduce the value of those housing savings.\n\nNamrata Singh QPFP\u00ae\ufe0f, Founder \u2013 Arthasadhana Investments, gives the example of a household saving \u20b9 25,000 after moving farther from the city. Additional commuting and convenience expenses could consume \u20b9 15,000- \u20b9 20,000 of that amount.\n\nThe remaining savings appear smaller, especially when family members lose several hours each week. Rent or housing instalments alone cannot show whether the move makes financial sense.\n\nFor hybrid workers , fewer office days do not automatically mean affordable travel. A longer journey each time can still create substantial costs.\n\nSingh picks a use case of a single professional earning \u20b9 1.15 lakh monthly and moving to an outskirts township. The distance to work increases from 6 km to 28 km each way. Even with three office days weekly, fuel and toll expenses can rise sharply.\n\nLate-night journeys may require cabs charging higher fares during busy periods. Meanwhile, daily travelling time could increase from around 40 minutes to 2.5 hours.\n\nThat leaves less time for personal activities and productive work. The financial benefit of moving needs to be weighed against this loss.", "source": "LiveMint Money", "pub_date_str": "30 Sep 2026, 12:10 AM IST", "pub_date_relative": "2m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Euro Falls to 16-Month Low as Hawkish Fed Bets Boost Dollar", "full_content": "(Bloomberg) -- The euro fell to its weakest level in 16 months as expectations that the Federal Reserve will further boost interest rates supported the US dollar.\n\nThe common currency dropped as much as 0.5% to $1.1312 on Tuesday, the lowest since May 2025. It was set for its worst monthly performance since July 2025.\n\n\u201cThis is broad-based dollar strength on rising yields,\u201d said Win Thin, chief economist at Bank of Nassau 1982. The US 30-year yield rose to the highest level since 2002, with nearly all currencies in the Group of 10 losing against the greenback in Tuesday trading.\n\nThe euro has been on a weakening trend as the dollar appreciated on expectations that more US interest rate increases will be needed to fight inflation. While the European Central Bank is seen raising rates as well, many investors believe the US economy will be able to withstand more monetary tightening than the eurozone, accounting for the dollar\u2019s relative strength.\n\nThe Bloomberg Dollar Spot Index is up about 2% in September, with strategists expecting the US currency to extend its rally. The euro lost 2.6% against its US counterpart this month.\n\nECB President Christine Lagarde said Monday that rising bond yields will curb economic expansion and limit the transfer of elevated energy costs to inflation. That was a \u201csurprise dovish tilt,\u201d said ING Groep NV currency strategist Francesco Pesole, suggesting that \u201cif one central bank hikes in October, it will be the Fed, and not the ECB.\u201d\n\nOptions pricing points to more losses for the euro, with long-term sentiment turning the most bearish since March 2025 last week. Morgan Stanley recently revised its outlook and now expects the common currency to fall 3% versus the dollar by mid-2027.\n\nThe euro is heading to $1.12 as \u201cwe expect the market to continue to add to dollar long positions, with the Fed unlikely to unwind hawkishness before the ECB,\u201d said Macro Hive strategist Ben Ford.", "source": "LiveMint Markets", "pub_date_str": "30 Sep 2026, 12:08 AM IST", "pub_date_relative": "5m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Fixed Income", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "OpenAI targets $30 billion funding at $1.4 trillion valuation, Bloomberg News reports", "full_content": "", "source": "Investing.com News", "pub_date_str": "30 Sep 2026, 12:01 AM IST", "pub_date_relative": "12m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Exclusive-US lawmakers including Sen. Warren push energy regulators to reject acquisition of power company AES", "full_content": "", "source": "Investing.com News", "pub_date_str": "30 Sep 2026, 12:00 AM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "U.S. stocks mostly lower amid volatile trading in the bond market", "full_content": "", "source": "Investing.com News", "pub_date_str": "29 Sep 2026, 11:59 PM IST", "pub_date_relative": "14m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "ITC market cap slips below \u20b93.4 lakh crore after 34% fall in 2026. Good time to enter? Analysts weigh in", "full_content": "Diversified conglomerate ITC saw its shares continue to crash on Dalal Street in 2026, hitting multi-year lows as investors appeared to be worried that elevated commodity prices and input costs could hit the company's margins in the near term, with analysts expecting more price hikes to protect margins and the top line.\n\nThe Government of India earlier this year imposed a higher excise duty on cigarettes, while ITC has raised prices across several cigarette brands. Although this is expected to improve realizations, the Street remains worried that higher prices could result in a sharper decline in cigarette volumes.\n\nFollowing the excise duty setback, surging key input prices, such as sugar, copra and palm oil, have sent the stock into a tailspin. In August, the stock hit a three-year low before seeing some modest recovery in September. The shares began the year with a massive drop of 20% in January, and the weakness persisted in the subsequent months, resulting in a 34% drop so far.\n\nThe fall not only created significant wealth erosion for shareholders but also wiped out \u20b9 1.72 lakh crore in the company's market capitalization, which fell to \u20b9 3.32 lakh crore at Tuesday's close.\n\nTo be precise, the stock came under pressure after touching a record high of \u20b9 499 in September 2024 and has so far lost 47% from that peak.\n\nFor a blue-chip stock, this kind of fall is a rare occurrence, but it highlights the deepening concerns.\n\nIn its recent report, domestic brokerage firm 360 ONE Capital Research has maintained its 'buy' rating on ITC with an unchanged target price of \u20b9 440 per share. The brokerage believes the recent weakness has created an opportunity as the impact of cigarette price increases starts flowing through profitability.\n\nAt the same time, the brokerage expects support from FMCG, paperboards and packaging, agri and ITC's technology businesses.", "source": "LiveMint Markets", "pub_date_str": "29 Sep 2026, 11:58 PM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Education Department extends deadline for student loan interest rate discount", "full_content": "The Trump administration announced on Tuesday that it will extend the deadline for federal student loan borrowers to get a reduction of 1 percentage point on their interest rate.\n\nPreviously, the U.S. Department of Education said borrowers had until the end of the day on Wednesday to sign up for the automatic payments and benefit from the reduced rate. Now it says federal student loan holders will have until Dec. 31.\n\nOnce borrowers enroll, the benefit will last through June 30, 2028.\n\nNearly 2 million federal student loan borrowers have signed up for autopay since the discount became available over the summer, the department said.\n\nTypically, borrowers on autopay have had access to a 0.25 percentage point discount.\n\nMore than 42 million Americans carry student loans, and the outstanding debt exceeds $1.7 trillion. The current average interest rate on federal student loans is 6.54%, according to higher education expert Mark Kantrowitz.\n\nTo qualify for the interest rate discount, your debt must be from the Direct Loan program, Kantrowitz said. That includes Direct Subsidized Loans, Direct Unsubsidized Loans, Direct PLUS Loans and Direct Consolidation Loans. Parent PLUS borrowers will also be eligible, as long as their loans are from the Direct Loan program, he said.\n\nFederal Family Education Loans, or FFEL, aren't eligible for the temporary reduced rate. As the federal government is offering the discount, the benefit does not extend to private student loans.", "source": "CNBC Top News", "pub_date_str": "29 Sep 2026, 11:58 PM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Good news for OpenAI is great news for Oracle\u2019s stock \u2014 here\u2019s why", "full_content": "Wall Street is cheering AI stocks as OpenAI gets closer to a revenue milestone.", "source": "MarketWatch Top Stories", "pub_date_str": "29 Sep 2026, 11:58 PM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Top 5 hybrid mutual funds: Quant Multi Asset tops the 10-year return chart at 18%; check which schemes lagged", "full_content": "Hybrid mutual funds invest across equity, debt, and, depending on the scheme, other asset classes. The allocation varies by category, making these funds suitable for investors looking for different levels of equity exposure and diversification within a single mutual fund.\n\nUnder the SEBI framework, hybrid mutual funds are divided into seven categories:\n\nHere are the top 5 hybrid funds that delivered the highest 10-year returns, along with those that lagged in this period.\n\n*Source: Value Research, Direct plans, CAGR as on 28 September 2026\n\nQuant Multi Asset Allocation Fund topped the list with a 10-year return of 18.39%. Bank of India Aggressive Hybrid Fund followed at 16.03%, while Quant Aggressive Hybrid Fund delivered 15.81%.\n\nICICI Prudential Multi Asset Allocation Fund and ICICI Prudential Aggressive Hybrid Fund also featured among the top performers, with returns of 15.04% and 14.80%, respectively.\n\nFor investors, the numbers also highlight that hybrid funds with higher equity exposure or greater flexibility in asset allocation can have significantly different long-term return outcomes.\n\n*Source: Value Research, Direct plans, CAGR as on 28 September 2026", "source": "LiveMint Money", "pub_date_str": "29 Sep 2026, 11:56 PM IST", "pub_date_relative": "17m ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Senate Republican says Chinese vehicle bill will not ban Mercedes-Benz", "full_content": "A sponsor of a bill to toughen a US government \u200cban on Chinese vehicles said on Tuesday that talks are ongoing to ensure that German automaker Mercedes-Benz is not banned from selling vehicles in the US.\n\nThe bill approved by the Senate Commerce Committee in July would ban companies with more than 15% ownership by Chinese entities from selling vehicles in the \u200bU.S. Mercedes-Benz has nearly 20% passive ownership from Chinese entities.\n\n\"What we're not going to do, obviously, is ban Mercedes-Benz vehicles in America,\" said Republican Bernie Moreno, adding, \"there's concern that, can they get to 15% without debilitating their company?\"\n\nMoreno hopes to try to win fast-track approval for the Chinese vehicle bill this week before the Senate adjourns until November as discussions continue with Senator Rand Paul.\n\nMoreno said there were discussions about how to ensure that Volvo Cars , majority owned by China's Geely Holding , could continue to sell vehicles in the US.\n\n\"We're looking at a variety of different things,\" Moreno said.\n\nMoreno also noted that Aston Martin \u2014 17% owned by Geely and Britain's Lotus, which is majority owned by Geely \u2014 both could be barred because of the law.\n\nThe bill's other chief sponsor, Democratic Senator Elissa Slotkin, said last week that all Democrats support moving ahead and only Paul opposes it.", "source": "CNBC Top News", "pub_date_str": "29 Sep 2026, 11:55 PM IST", "pub_date_relative": "18m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Nifty 50 prediction: Hammer formation hints short term trend reversal | Support, resistance for Sept 30", "full_content": "The Nifty 50 witnessed one of its sharpest declines in the September series in recent years, registering a fall of 1,618 points or 6.6%.\n\nThe Nifty opened with a gap down and slipped to an intraday low of 22,569.65 within the first hour of trade. However, the index recovered from the lows and remained within the opening hour\u2019s range for the rest of the session. It finally closed at 22,716.20, down 64.05 points or 0.28%, after recovering more than 140 points from the day\u2019s low.\n\nTuesday\u2019s price action resulted in the formation of a hammer-like candlestick pattern, with a long lower shadow and a small real body near the upper end of the trading range. This pattern generally indicates that buyers emerged at lower levels after initial selling pressure.\n\nA hammer formation after a prolonged decline can indicate a possible short-term reversal, as it suggests that bears were unable to sustain lower levels. However, confirmation in the following session remains important before considering it a reliable reversal signal.\n\nTrading volumes were the highest since August 31, indicating increased participation during the recovery from lower levels. As long as Tuesday\u2019s low remains protected, the index may witness some buying interest at lower levels.\n\nMarket breadth remained negative, with more stocks declining than advancing, while trading volumes were higher compared with the previous session.\n\nThe Nifty closed below the lower Bollinger Band, which often indicates that the index has moved significantly away from its recent average range. After such sharp deviations, markets generally tend to move towards mean reversion, although the timing and strength of the recovery remain uncertain.\n\nThe index is currently trading around 5.08% below its 50-DMA, highlighting the extent of the recent correction. Additionally, the 14-period daily RSI is in oversold territory.", "source": "LiveMint Markets", "pub_date_str": "29 Sep 2026, 11:53 PM IST", "pub_date_relative": "19m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Disney laying off around 300 employees in latest cuts under new CEO Josh D'Amaro", "full_content": "Disney is laying off around 300 employees in its latest round of job cuts since CEO Josh D'Amaro took the helm earlier this year , according to a person familiar with the matter.\n\nThe majority of the cuts were to human resources and technology roles, said the person, who spoke on the condition of anonymity because they were not authorized to speak publicly.\n\nIn April, Disney planned to eliminate as many as 1,000 roles , as D'Amaro consolidated its enterprise marketing division, CNBC reported at the time. Further cuts were made in July as the company reduced its workforce by several hundred people across corporate functions, including at Pixar, ESPN, Disney Entertainment Television and Disney's studios, according to various media reports. The majority of those layoffs occurred within Pixar and National Geographic.\n\nDisney warned about the most recent round of reductions in its August earnings report , saying it was evaluating ways to reduce costs at the company. Around that time, Disney also began offering early-retirement buyout packages to longtime executives.\n\n\"We remain highly focused on reducing costs across the enterprise to create incremental capacity to invest for growth and are evaluating a variety of levers, including reductions in labor and SG&A,\" Disney said in that report. \"We are mid-stream in this work and will provide future updates on progress.\"\n\nDeadline was first to report this most recent round of layoffs.\n\nD'Amaro stepped in as CEO at Disney in March, replacing longtime chief executive Bob Iger, and has prioritized a strategy dubbed \"One Disney\" that aims to better align the company's many divisions and integrate compatible businesses.\n\nThe goal is a seamless flywheel that brings together Disney's intellectual property across its film, streaming, theme park, consumer goods, gaming and sports divisions, D'Amaro has said.", "source": "CNBC Top News", "pub_date_str": "29 Sep 2026, 11:51 PM IST", "pub_date_relative": "22m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Oura delayed IPO after some investors balked at valuation - report", "full_content": "", "source": "Investing.com News", "pub_date_str": "29 Sep 2026, 11:50 PM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Property Play: Homeowners are sitting on record equity \u2013 and not using it", "full_content": "A version of this article first appeared in the CNBC Property Play newsletter with Diana Olick. Property Play covers new and evolving opportunities for the real estate investor, from individuals to venture capitalists, private equity funds, family offices, institutional investors and large public companies. Sign up to receive future editions, straight to your inbox.\n\nU.S. homeowners have more housing wealth than ever before, thanks to fast-rising home prices over the last several years. But they aren't spending very much of it.\n\nIn the second quarter of this year, there was a collective $11.5 trillion in so-called \"tappable\" home equity, according to Cotality, a data technology company. That is the amount borrowers could take out in debt while still leaving enough in the home to satisfy lenders. In total equity, borrowers with a mortgage have $17.9 trillion, or, on average, $310,000 per homeowner, which is $6,000 more than they had in the previous three months.\n\nWhile homeowners did originate nearly 20% more second mortgages or home equity lines of credit (HELOCs) compared with the first quarter, it still represented less than 0.1% of the total tappable equity that they could have used.\n\nCNBC's Property Play with Diana Olick covers new and evolving opportunities for the real estate investor, delivered weekly to your inbox.\n\n\"The borrowers with the most housing wealth are often the least likely to tap it,\" said Thom Malone, principal economist at Cotality. \"They tend to have low mortgage rates, strong cash flow, and little reason to move.\"\n\nSo all that cash sits on the sidelines and continues to compound because home prices in most areas of the country are still seeing small gains. Consumers are also increasingly nervous about the state of the economy and rising interest rates.", "source": "CNBC Top News", "pub_date_str": "29 Sep 2026, 11:49 PM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Stock market today: Dow, S&P 500, Nasdaq slip as oil retreats, Anthropic and OpenAI fuel AI jitters - Yahoo Finance", "full_content": "Stock market today: Dow, S&P 500, Nasdaq slip as oil retreats, Anthropic and OpenAI fuel AI jitters Yahoo Finance U.S. Stocks Decline as Relentless Rise in Treasury Yields Continues WSJ Wall St falls as bond yields test multi-decade highs Reuters Stock Market Today: Major Indexes Decline as Treasury Yields Rise Further; Oil Prices Slip Investopedia Stock Market Today: Dow falls over 300 points, S&P 500 and Nasdaq edge lower as Treasury yields extend gains; tech CEOs to meet Trump MarketWatch", "source": "Google News Business", "pub_date_str": "29 Sep 2026, 11:49 PM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Equity Investments", "Fixed Income"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Axsome Therapeutics options flow shows heavy put skew ahead of binary catalyst", "full_content": "", "source": "Investing.com News", "pub_date_str": "29 Sep 2026, 11:47 PM IST", "pub_date_relative": "26m ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "YouTube Ecosystem Adds Over Rs 18,000 Crore To India's GDP, Supports 9.6 Lakh Jobs In 2025", "full_content": "The number of YouTube channels in India generating six figures or more in revenue (INR) rose by over 30% year-on-year.", "source": "NDTV Profit", "pub_date_str": "29 Sep 2026, 11:43 PM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Economics", "Financial Statement Analysis"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Alaska Airlines CEO 'not overly concerned' about new Boeing Max 10 delay", "full_content": "Alaska Airlines CEO Ben Minicucci said Tuesday he is \"not overly concerned\" about a new software glitch that's further delaying the certification of Boeing's 737 Max 10 , which is already years behind schedule.\n\nAlaska earlier Tuesday unveiled a massive cabin overhaul with more premium seats across its fleet, including lie-flat suites on the Max 10, which are slated to start flying in late 2028. Minicucci told CNBC's Phil LeBeau that the launch could be postponed if the latest Max 10 delay lasts several months, but he added that the Seattle-based airline is working with the Federal Aviation Administration and Boeing on certification.\n\nFAA Administrator Bryan Bedford told reporters Monday that the agency is assessing a software issue on the planes and that its approval of the aircraft will be delayed, sending Boeing shares down sharply.\n\nThe Max 10 \u2014 which counts Alaska, United Airlines , Delta Air Lines and American Airlines among its customers \u2014 is the last model of Boeing's bestselling Max family of jets that's waiting for federal approval. Boeing's CEO said earlier this month that he expected approval of the Max 10 \"very soon.\"\n\nBoeing over the weekend said it recently flagged the problem, which could cut off some automated navigation information to pilots, in an updated software program to airlines. The issue could occur with the vertical navigation system after an aircraft misses an approach and has to go around and line up to land again.\n\nMichael O'Leary, CEO of European budget carrier Ryanair, which is a Max 10 customer, told reporters at a conference in Warsaw, Poland, earlier Tuesday that he expected the Max 10 certification to come in \"a matter of days, not weeks or months,\" Reuters reported.", "source": "CNBC Top News", "pub_date_str": "29 Sep 2026, 11:33 PM IST", "pub_date_relative": "39m ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Trump Accounts will auto-enroll children, potentially adding 60 million accounts: Treasury", "full_content": "The U.S. Department of the Treasury said Trump Accounts will begin auto-enrolling millions of children as early as Oct. 1, according to temporary regulations published Tuesday.\n\nThe change could increase the number of children enrolled in Trump Accounts in 2026 by more than 60 million, the guidance said. In future years, the regulations could boost enrollment by about two million accounts a year.\n\nSo far, 7 to 8 million American children have been signed up for Trump Accounts, and \"we anticipate within a month we will have 70 million because we will go to auto-enroll,\" Treasury Secretary Scott Bessent said Sept. 15 at a hearing held by the House Financial Services Committee .\n\nThe tax-deferred investing accounts, which launched on July 4, include a one-time $1,000 deposit from the Treasury Department for kids born between 2025 and 2028. Other funds may also be available for qualifying families.\n\nBut because signing up for a Trump Account has required families to \"opt in\" by filing IRS Form 4547 with their tax return or via TrumpAccounts.gov \u2014 overall participation rates, especially among low-income families, has been low, other research shows.\n\nThe Social Security Administration previously said it would introduce a process to enroll newborns at the hospital at the same time families request a Social Security number during the birth registration process.\n\nAuto-enrollment \"would certainly reach the vast majority of parents and children,\" said Madeline Brown, senior policy associate at the Urban Institute, a Washington-based think tank.\n\nHowever, \"assuming that can happen, after families are enrolled there is still a lot of work to be done to build engagement and awareness,\" Brown said.", "source": "CNBC Top News", "pub_date_str": "29 Sep 2026, 11:31 PM IST", "pub_date_relative": "41m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Tech leaders arrive at White House for AI luncheon with Trump", "full_content": "Major technology leaders converged on the White House on Tuesday for a luncheon with President Donald Trump and House Speaker Mike Johnson as calls for an artificial intelligence slowdown and regulation reach a fever pitch.\n\n\"The main issue that you have and I have is we have to take responsibility for the dangers we're aware of,\" Palantir CEO Alex Karp told CNBC outside the White House on Tuesday. \"All of us do. And by the way, American people don't want separate rules for tech people and for themselves.\"\n\nA seating chart posted to Trump's Truth Social account showed the president seated next to Nvidia CEO Jensen Huang and Tesla and SpaceX CEO Elon Musk , followed by Meta's Mark Zuckerberg and Google 's Sundar Pichai.\n\nThe chart shows Vice President JD Vance opposite the president, between Amazon founder Jeff Bezos and Johnson.\n\nOther attendees included Microsoft 's Satya Nadella, Anthropic 's Dario Amodei and Tom Brown, OpenAI 's president Greg Brockman and senior administration officials such as Treasury Secretary Scott Bessent.\n\nOpenAI is simultaneously hosting its annual DevDay developer conference in San Francisco. John Ternus, Apple 's new CEO, did not appear on the list.\n\nThe luncheon coincided with an all-day event hosted by the president and vice president, where the administration unveiled a new AI-powered chatbot for government websites.\n\nConcerns over the rapid pace of AI development have intensified in Washington and Silicon Valley as cases of agent-orchestrated attacks mount and major researchers warn of serious consequences for humanity.", "source": "CNBC World Economy", "pub_date_str": "29 Sep 2026, 11:28 PM IST", "pub_date_relative": "45m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Want SIFs in your portfolio? Should you invest directly or choose the new mutual fund PRIM route \u2014 experts explain", "full_content": "With the introduction of SEBI \u2019s new Portfolio Managers Route for Investing in Mutual Fund units (PRIM), investors can get a PMS-like way to invest in direct mutual fund units and SIFs.\n\nThrough this route, investors can get a professionally managed portfolio of mutual funds, SIFs and ETFs, with a minimum investment of \u20b9 25 lakh.\n\nSIFs are specialised investment funds that follow specific strategies, with a minimum investment of \u20b9 10 lakh. This raises the question: should investors invest in SIFs directly or use the PRIM route? Here's what experts have to say.\n\n\u201cStart with what each route is. An SIF is a product. PRIM is a portfolio management service. An investor who buys an SIF directly is choosing one strategy. An investor who goes through a portfolio manager under PRIM is paying someone to decide which strategies to hold, how much of each, and when to change the mix,\u201d Sandeep Jethwani, Co-founder, Dezerv, said.\n\nThe real question, then, is whether you need that second layer of decision-making and whether you are willing to pay for it. Under PRIM, the portfolio manager invests in direct mutual fund plans too, but the investor pays a management fee of up to 1% of assets, Jethwani added.\n\nFor some investors, choosing an SIF directly may be a natural extension of how they already manage their investments. For others, paying for professional portfolio management may bring greater convenience and discipline. The right choice depends on the investor\u2019s needs, risk appetite and level of involvement, Sanjiv Bajaj, Joint Chairman and MD at Bajaj Capital, added.\n\nPRIM is a holistic portfolio, while an SIF is a standalone offering.", "source": "LiveMint Money", "pub_date_str": "29 Sep 2026, 11:24 PM IST", "pub_date_relative": "49m ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Rs 1 Lakh Invested In This Stock Nearly 7 Years Ago Is Now Worth Over Rs 53 Lakh", "full_content": "HBL Engineering shares have risen from around Rs 15 in 2019 to around Rs 800, while consolidated profit rose from Rs 26.2 crore in FY20 to Rs 814.9 crore in FY26", "source": "NDTV Profit", "pub_date_str": "29 Sep 2026, 11:12 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Anthropic Warns Of 'Unknown Legal Risks' From Rogue AI Agents In IPO Prospectus", "full_content": "Anthropic said errors, security vulnerabilities or misalignment could lead to data deletion or unauth
