jor importer. This scenario intensified expectations for monetary policy adjustments by the RBI. Critical upcoming events include the U.S. FOMC meeting and fluctuations in oil prices.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "03 Sep 2026, 12:37 PM IST", "pub_date_relative": "30m ago"}, {"title": "Motilal Oswal initiates coverage on Adani Power with Buy call, sees 20% upside. Time to hold or sell?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Motilal Oswal initiates coverage on Adani Power with Buy call, sees 20% upside. Time to hold or sell? Adani Power Share Price NTPC Share Price JSW Energy Share Price NLC India Share Price Jaiprakash Power Ventures Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Motilal Oswal initiates coverage on Adani Power with Buy call, sees 20% upside. Time to hold or sell? SECTIONS Motilal Oswal initiates coverage on Adani Power with Buy call, sees 20% upside. Time to hold or sell? By Somanjali Das , ETMarkets.com Last Updated: Sep 03, 2026, 12:31:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Motilal Oswal initiated coverage on Adani Power with a Buy rating and a target price of Rs 250, implying around 20% upside. The brokerage sees capacity expansion, its track record of turning around distressed assets and potential entry into nuclear power as key growth drivers.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "03 Sep 2026, 12:31 PM IST", "pub_date_relative": "36m ago"}, {"title": "Stocks to buy: Nagaraj Shetti recommends eClerx Services, UNO Minda shares to buy in the short-term", "full_content": "Stock market today: Domestic benchmark indices Nifty 50 and Sensex gained 0.35% each on Thursday, 3 September, led by banking stocks, after lenders mobilised a higher-than-expected $136.4 billion through the RBI\u2019s foreign-currency deposit and borrowing schemes. The fund mobilisation is expected to strengthen liquidity ahead of the festive season.\n\nThe gains come after both benchmarks declined around 1% over the previous three sessions, weighed down by rising crude oil prices and global bond yields as investors reassessed expectations for interest rates to remain elevated for longer.\n\nHowever, at 12:23 IST, the Nifty 50 was flat at 23,905 . 80, while the BSE Sensex was also flat trading at 76,604.93.\n\nMeanwhile, oil prices eased on Thursday after their recent rally, with Brent crude trading close to $95 a barrel, while Asian equities advanced and US stock futures edged higher.\n\nRenewed fighting between the US and Iran had pushed crude prices sharply higher earlier this week. US President Donald Trump said on Wednesday that he did not expect the US bombing campaign to continue for \u201cmuch longer\u201d.\n\nBrent crude, the international benchmark, fell 0.4% to $95.26 a barrel, while US West Texas Intermediate (WTI) crude slipped 0.1% to $90.84 a barrel.\n\nThe downtrend continued in the market on Wednesday on the back of weak global cues and Nifty 50 closed the day lower by 141 points amidst minor recovery from the day's low. A small green candle was formed on the daily chart with minor lower shadow, and the opening downside gap has been filled partially. Technically, this market action signals minor buying at the lower support of 23,800 (previous opening upside gap of 27 July), but still there is no confirmation of any bottom reversal in the market.\n\nThe overall trend of Nifty 50 remains weak. The ongoing bearish pattern like lower tops and bottoms signal sell on rise opportunity on any pullback from here.", "source": "LiveMint Markets", "pub_date_str": "03 Sep 2026, 12:28 PM IST", "pub_date_relative": "39m ago"}, {"title": "Gold vs Silver: Which precious metal offers a better bet for investors after the recent correction?", "full_content": "Gold and silver have rebounded after a recent correction, but the recovery has revived a key question for investors: which precious metal offers the better investment opportunity now?\n\nWhile both metals continue to benefit from long-term structural factors, their investment cases differ sharply. According to analysts, gold enjoys stronger support, while silver has delivered strong returns but remains more vulnerable to volatility.\n\nThe debate comes as precious metals recover from recent pressure triggered by the Jackson Hole shock.\n\nOn Thursday, September 3, gold rose more than 1% as the U.S. dollar and Treasury yields eased, while investors awaited U.S. nonfarm payrolls data that could shape expectations around the Federal Reserve's next policy move.\n\nSpot gold climbed 1.1% to $4,434.70 per ounce by 0425 GMT, after hitting a near one-month low in the previous session. U.S. gold futures gained 1.5% to $4,480.10, while spot silver rose 1.2% to $66.08.\n\nBack home, gold and silver prices jumped by up to 1% in morning deals on the MCX on Thursday, September 3, supported by easing U.S. dollar and bond yields. U.S. gold futures for December delivery also rose 1% to $4,473.21 per troy ounce.\n\nThe U.S. dollar remained under pressure, while Treasury yields eased from multi-year highs, improving the appeal of non-yielding assets such as gold. A weaker dollar also makes greenback-priced metals more affordable for buyers holding other currencies.\n\nThe recent correction in precious metals had gathered pace after the Jackson Hole meeting, where Warsh said the Fed would \"have work to do\" if policymakers failed to gain the confidence needed to ensure inflation was heading towards 2%.", "source": "LiveMint Markets", "pub_date_str": "03 Sep 2026, 12:08 PM IST", "pub_date_relative": "1h ago"}, {"title": "Iran strikes Kuwait as Trump says renewed Mideast hostilities will not last 'too long'", "full_content": "Kuwait's army on Thursday said it was confronting hostile missile and drone attacks from Iran, a day after U.S. President Donald Trump said that renewed hostilities in the Middle East would not last \"too long.\"\n\nKuwait advised residents to follow security and safety instructions, adding that any explosions heard in the country were due to air defense systems intercepting hostile targets. The strikes were targeted at U.S. bases in Kuwait, Iranian state media outlet IRIB said.\n\n\"I don't think it will [war] be very much longer ... I don't know how much more they [Iran] can take,\" Trump told reporters on Wednesday, describing the American strikes against Iran on Tuesday as a \"very heavy attack,\" adding that the U.S. was prepared for further military operations \"any time we want.\"\n\nIran had retaliated after the Tuesday strikes, targeting U.S. regional allies Jordan and Bahrain.\n\nReuters reported that top aides to Trump were pushing to keep the Iran war from escalating before November's midterm elections. Vice President JD Vance and Secretary \u200bof State Marco Rubio are trying to keep the Iran conflict relatively \"quiet\" until the elections are over, the outlet reported.\n\nCiting four people familiar with the discussions, Reuters said this was to limit Republican losses due to the conflict, which is proving increasingly unpopular with Americans.\n\nA University of Massachusetts Amherst poll of 1,000 respondents in August found more than two-thirds disapproved of Trump's handling of the war, and \"nearly as many now express disapproval in how he is handling his job overall,\" the university said.\n\nTrump also said Wednesday that, while he was not on the ballot at the midterm elections, he was going to help the Republican Party, which he said \"respects the fact that we're not allowing Iran to have a nuclear weapon.\"", "source": "CNBC Top News", "pub_date_str": "03 Sep 2026, 12:03 PM IST", "pub_date_relative": "1h ago"}, {"title": "Bharat NCAP 2.0 To Be Introduced From October 2027 To Evaluate Vehicle Chain Crash: Nitin Gadkari", "full_content": "Bharat NCAP offers testing at a 75% lower cost compared to international alternatives. This price advantage has led many foreign automobile companies to send their vehicles to India specifically for safety testing and certification.", "source": "NDTV Profit", "pub_date_str": "03 Sep 2026, 12:02 PM IST", "pub_date_relative": "1h ago"}, {"title": "Rs 10,000 SIP With A 10% Annual Step-Up: How Much Could You Have After 20 Years?", "full_content": "Step-Up SIP allows you to gradually increase your investment, without putting pressure on your monthly budget.", "source": "NDTV Profit", "pub_date_str": "03 Sep 2026, 12:00 PM IST", "pub_date_relative": "1h ago"}, {"title": "India can unlock over USD 1.5 billion wheat export opportunity as global buyers diversify sourcing: ASSOCHAM", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Agriculture \u203a India can unlock over USD 1.5 billion wheat export opportunity as global buyers diversify sourcing: ASSOCHAM The Economic Times daily newspaper is available online now. Read Today's Paper India can unlock over USD 1.5 billion wheat export opportunity as global buyers diversify sourcing: ASSOCHAM SECTIONS India can unlock over USD 1.5 billion wheat export opportunity as global buyers diversify sourcing: ASSOCHAM ANI Last Updated: Sep 03, 2026, 11:59:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India can unlock a wheat export opportunity of more than USD 1.5 billion as the gradual reopening of exports coincides with strong domestic production, comfortable stocks and efforts by major global buyers to diversify their sources, an ASSOCHAM report said.\n\nQ1 investment numbers look stellar, but are we celebrating too early?\n\nPatent Cliff approaching: Can Indian pharma companies repeat past success?\n\nET Prime special: Bigger, Better or Both? Understanding business to figure out the mystery: Power Grid Corp \u2013 Part 1\n\nET Prime special series: 2013 to 2026. Not years, but evidence: Power Grid, Part 2\n\nWhen a CFO resigns, is \u2018personal reasons\u2019 explanation enough?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "03 Sep 2026, 11:59 AM IST", "pub_date_relative": "1h ago"}, {"title": "Rays of Belief IPO Day 3: Issue subscribed 13.63x so far. Check GMP, reviews, & other details. Apply or not?", "full_content": "Rays of Belief IPO has entered its last day of bidding on Thursday, 3 September. Traders who wish to invest have a last chance to place their bids today.\n\nThe mainboard IPO, which opened for bidding on 1 September, has so far received a strong response from investors.\n\nThe IPO is currently trading at a grey market premium (GMP) of \u20b9 59. At the upper price band of \u20b9 239 per share, this translates into an estimated listing price of \u20b9 298, representing a potential gain of 24.69% over the issue price.\n\nHowever, grey market trends tracked over the past 15 sessions show that the GMP has risen to \u20b9 59 today, signalling expectations of a strong listing. During this period, the GMP has fluctuated between \u20b9 0 and \u20b9 59.\n\nThe Rays of Belief IPO has been subscribed over 13.63 times so far by the last day of bidding.\n\nThe retail portion has been booked 49.33 times, meanwhile, non institutional investors(NIIS) has received 21.54 times subscription. QIB section has received 0.04 times.\n\nSwastika Investmart said Rays of Belief Limited, which operates under the Mom\u2019s Belief brand, offers personalised intervention services for Neurodevelopmental Disorders (NDDs) through its growing network of centres. The brokerage noted that the company\u2019s expanding footprint across India and the US could drive further revenue growth, while increasing scale has also contributed to an improvement in operating margins.\n\nHowever, Swastika Investmart highlighted key concerns, including the company\u2019s relatively short history of profitability, negative operating cash flow in FY26 and execution risks arising from its aggressive expansion plans. The absence of directly comparable listed peers also makes it challenging to evaluate the company\u2019s valuation.", "source": "LiveMint Markets", "pub_date_str": "03 Sep 2026, 11:57 AM IST", "pub_date_relative": "1h ago"}, {"title": "Broadcom\u2019s AI chip boom powers record quarter, shares waver", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News Powered By Broadcom\u2019s AI chip boom powers record quarter, shares waver Written by Anupam Nagar , ETMarkets.com | Sep 03, 2026, 12:18:47 PM IST 1 / 6 Broadcom\u2019s AI boom hits another gear Broadcom delivered a strong fiscal third-quarter performance, with revenue jumping 86% year-on-year to $29.6 billion. Surging demand for custom AI accelerators and networking chips drove the results. (Sources: Broadcom, Reuters, Wall Street Journal, Yahoo Finance)\n\nBroadcom\u2019s AI semiconductor revenue surged 221% year-on-year to $16.7 billion in the quarter. The company expects AI semiconductor revenue to accelerate further to $21.7 billion in Q4, up 236% from a year earlier.\n\nBroadcom sees its AI semiconductor business reaching $115 billion in fiscal 2027 and potentially doubling again to around $230 billion in 2028. The outlook reflects rapidly expanding AI infrastructure spending by major technology companies.\n\nBroadcom is benefiting from demand for custom chips from leading AI developers, including OpenAI, Anthropic and Google, while Meta is also expected to begin receiving Broadcom custom chips. The company says it has visibility into major AI deployments extending through 2028.\n\nDespite beating expectations, Broadcom shares came under pressure after the results. The key concern was its $34.8 billion Q4 revenue forecast, which was only slightly above or below some analyst estimates depending on the data set, leaving investors looking for a bigger upside surprise.\n\nBroadcom's adjusted earnings came in at $3.32 per share, ahead of the $3.22 analyst estimate, while Q3 revenue also topped expectations. But with AI expectations already extremely high, investors appear to be demanding even stronger guidance and evidence that Broadcom can sustain its rapid AI growth.", "source": "Economic Times Markets", "pub_date_str": "03 Sep 2026, 11:55 AM IST", "pub_date_relative": "1h ago"}, {"title": "Eying Indian campuses of foreign universities to save education costs? Pros and cons of this alternative explained", "full_content": "Indian branch foreign university campuses appear as one of the best alternatives for those vying admission in overseas institutions but cannot make it due expensive visa application and tuition fee, steep living costs, recurring airfares and other expenses that could add up to crores. While foreign university campuses bridge this gap and promise global degrees at a fraction of overseas costs, the real question about the degree's validity in terms of market demand arises.\n\nThe National Education Policy (NEP) 2020 closed the divide created between domestic and overseas degrees by allowing foreign universities to set up branch campuses in India. Regulated by education ministry's University Grants Commission (UGC) and the International Financial Services Centres Authority (IFSCA) GIFT City framework, the gateway restricts entry to institutions listed in the top 500 global rankings, such as QS World University Rankings , which vary from subject to subject.\n\nConsidering the curiosity among students to enrol in foreign campuses, the Gen Z Outlook Report 2026 published by online education company Emeritus this week suggests that 60% of pre-college students want to study abroad. Meanwhile, 69% of students currently enroled in or having completed their undergraduate degree and looking for a PG course expressed their interest in an India-based international programme mainly to avoid visa uncertainty.\n\nLet's learn whether higher cost of degrees than established domestic universities offer better learning, employability, international exposure, industry access, future mobility, alumni networks and more.\n\nAt a fraction of overseas costs, foreign university campuses offer global degrees awarded by the parent university. According to Emeritus co-founder and CEO Ashwin Damera, the financial appeal of an Indian branch campus lies in the significant reduction in expenditure without sacrificing degree legitimacy.", "source": "LiveMint Money", "pub_date_str": "03 Sep 2026, 11:54 AM IST", "pub_date_relative": "1h ago"}, {"title": "Aequs Share Price Jumps Over 4% Amid Strong Volumes; Stock Up 80% In Six Months", "full_content": "Aequs share price rally was supported by robust volumes. Around 35 lakh equity shares of Aequs changed hands on stock exchanges on September 3, as compared with its one-week average trading volume of 19 lakh shares.", "source": "NDTV Profit", "pub_date_str": "03 Sep 2026, 11:53 AM IST", "pub_date_relative": "1h ago"}, {"title": "16 mutual funds delivered over 20% SIP returns in 10 years; \u20b910,000 monthly investment grew to \u20b938.8 lakh", "full_content": "For investors who stay with their mutual fund SIPs through market ups and downs, time can make a significant difference to the eventual corpus. A decade of regular investing can allow returns to compound across different market cycles, although not every fund is able to sustain strong performance for that long.\n\nAn analysis of Value Research data shows that 16 schemes delivered annualised SIP returns of more than 20% over the past 10 years.\n\nNippon India Small Cap Fund led the pack with a 22.51% 10-year SIP return. A \u20b9 10,000 monthly SIP in the fund over the period would have grown to about \u20b9 38.8 lakh, against a total investment of \u20b9 12 lakh.\n\nWhat stands out, however, is that the 10-year leaders were spread across different investment strategies. Small-cap and mid-cap funds featured prominently, but the list also included gold, infrastructure, healthcare, multi-asset and ELSS funds.\n\nNippon India Small Cap Fund was followed by Bank of India Manufacturing & Infrastructure Fund and Quant Multi Asset Allocation Fund, with 10-year SIP returns of 22.10% and 22.02%, respectively. Invesco India Mid Cap Fund was close behind at 21.95%.\n\n7 of the 16 funds were small-cap or mid-cap funds. The remaining nine came from infrastructure, healthcare, ELSS and multi-asset categories.\n\nThe long-term numbers, therefore, tell a story of sustained compounding rather than a single market rally. But the picture changes considerably when the analysis is narrowed to the past year.\n\nThe latest one-year SIP performance is heavily tilted towards small-cap funds. Bank of India Small Cap Fund topped the broader one-year list with a 52.89% return , followed by ITI Small Cap Fund at 44.21% and Union Small Cap Fund at 43.17%.", "source": "LiveMint Money", "pub_date_str": "03 Sep 2026, 11:49 AM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "Yen strengthens as traders bet on Japan interest rate rises", "full_content": "Currency rises close to \u00a5156 to the dollar after sudden jump overnight", "source": "FT Markets", "pub_date_str": "03 Sep 2026, 12:54 PM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Rays of Belief IPO subscribed 14x on Day 3 so far, retail portion booked 49x as GMP rises to 20%. Should you subscribe?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a Rays of Belief IPO subscribed 14x on Day 3 so far, retail portion booked 49x as GMP rises to 20%. Should you subscribe? The Economic Times daily newspaper is available online now. Read Today's Paper Rays of Belief IPO subscribed 14x on Day 3 so far, retail portion booked 49x as GMP rises to 20%. Should you subscribe? SECTIONS Rays of Belief IPO subscribed 14x on Day 3 so far, retail portion booked 49x as GMP rises to 20%. Should you subscribe? By Debaroti Adhikary , ETMarkets.com Last Updated: Sep 03, 2026, 12:52:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Rays of Belief IPO saw strong demand on its third and final day of bidding, with the Rs 125-crore issue receiving bids far exceeding the shares on offer. The retail portion led demand, while the NII segment also saw strong interest. Here\u2019s a look at the IPO, GMP, financials and investment outlook.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "03 Sep 2026, 12:52 PM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Rising Treasury yields emerge as key risk to Wall Street\u2019s record rally", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Rising Treasury yields emerge as key risk to Wall Street\u2019s record rally Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Rising Treasury yields emerge as key risk to Wall Street\u2019s record rally SECTIONS Rising Treasury yields emerge as key risk to Wall Street\u2019s record rally By Anupam Nagar , ETMarkets.com Last Updated: Sep 03, 2026, 12:47:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Investors in the US stock market are monitoring Treasury yields closely, aware that they may hinder any potential rally. The benchmark ten-year yield is nearing levels that could disrupt equity valuations. While robust corporate earnings currently mitigate rising borrowing costs, the focus is shifting to inflation and interest rates. Should yields surge past five percent, stock repricing may swiftly follow.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "03 Sep 2026, 12:47 PM IST", "pub_date_relative": "21m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "India wants tariff edge before signing final US trade deal: Piyush Goyal", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a India wants tariff edge before signing final US trade deal: Piyush Goyal The Economic Times daily newspaper is available online now. Read Today's Paper India wants tariff edge before signing final US trade deal: Piyush Goyal SECTIONS India wants tariff edge before signing final US trade deal: Piyush Goyal ET Online Last Updated: Sep 03, 2026, 12:54:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India awaits US tariff advantage for trade deal finalization. The agreement was announced on February 3, 2026, reducing US tariffs on Indian goods. New Delhi seeks a clear tariff edge over competing manufacturing economies. India has protected its agriculture and dairy sectors under the agreement. Sectors like MSMEs and textiles will benefit from lower tariffs.\n\nQ1 investment numbers look stellar, but are we celebrating too early?\n\nPatent Cliff approaching: Can Indian pharma companies repeat past success?\n\nET Prime special: Bigger, Better or Both? Understanding business to figure out the mystery: Power Grid Corp \u2013 Part 1\n\nET Prime special series: 2013 to 2026. Not years, but evidence: Power Grid, Part 2\n\nWhen a CFO resigns, is \u2018personal reasons\u2019 explanation enough?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers", "source": "Economic Times Economy", "pub_date_str": "03 Sep 2026, 12:42 PM IST", "pub_date_relative": "25m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Dutch central bank moves gold bars out of U.S. and Canada, citing \u2018crisis preparedness\u2019", "full_content": "The Dutch central bank (DNB) has transferred approximately 86 tons of gold out of the U.S. and Canada to the U.K., seeking to shore up its contingency planning in view of \"increasing geopolitical unrest.\"\n\nJust over one-quarter of the central bank's gold reserves held in New York and Ottawa had been shifted to London between March and August, DNB said Wednesday.\n\nThe transferred gold is now stored with the Bank of England because gold stored there must meet international trade standards and is recognized as \"the world's most easily tradable gold,\" DNB said, adding that the move strengthens its \"crisis preparedness.\"\n\nBy contrast, DNB said the gold bars held in the U.S. and Canada could not be utilized as quickly and directly in a crisis situation.\n\n\"With this relocation, we have improved the tradability of our gold reserves. We expect that we will never need to use them, but we do need to strengthen our resilience and preparedness,\" DNB Governor Olaf Sleijpen said in a statement.\n\nThe move comes amid a blockbuster rally in gold prices and continued U.S.-Iran geopolitical tensions over the strategically vital Strait of Hormuz, with a comprehensive settlement agreement far from certain.\n\nThe price of gold, which is typically considered a safe-haven asset at times of financial uncertainty, has jumped nearly 25% over the past 12 months. The yellow metal is currently trading at $4,429.61 per ounce, up nearly 1% for the session.\n\nThe move from the Dutch central bank comes after the French central bank replaced 129 tons of gold held at the New York Federal Reserve between July 2025 and January 2026.", "source": "CNBC Top News", "pub_date_str": "03 Sep 2026, 12:42 PM IST", "pub_date_relative": "25m ago", "cfa_topics": ["Economics", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Prasol Chemicals fixes price band for Rs 500-cr IPO; issue to open on Sep 8", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a Prasol Chemicals fixes price band for Rs 500-cr IPO; issue to open on Sep 8 JM Financial Share Price Choice International Share Price IIFL Capital Services Share Price Anand Rathi Share & Stock Brokers Share Price SMC Global Securities Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Prasol Chemicals fixes price band for Rs 500-cr IPO; issue to open on Sep 8 SECTIONS Prasol Chemicals fixes price band for Rs 500-cr IPO; issue to open on Sep 8 PTI Last Updated: Sep 03, 2026, 12:42:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Prasol Chemicals will launch its Rs 500-crore Initial Public Offering on September 8. The company has fixed the price band at Rs 643-676 per equity share. This public offering will close on September 10 after anchor investor bidding. The IPO includes a fresh issue of Rs 80 crore and an OFS of Rs 420 crore. Proceeds will fund debt payment, working capital, and general corporate needs.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "03 Sep 2026, 12:42 PM IST", "pub_date_relative": "26m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "India bonds gain as RBI FX inflows lift liquidity, spur short-term debt buying", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Bonds \u203a India bonds gain as RBI FX inflows lift liquidity, spur short-term debt buying Kotak Mahindra Bank Share Price Axis Bank Share Price Federal Bank Share Price IndusInd Bank Share Price IDFC First Bank Share Price Powered By The Economic Times daily newspaper is available online now. Read Today's Paper India bonds gain as RBI FX inflows lift liquidity, spur short-term debt buying SECTIONS India bonds gain as RBI FX inflows lift liquidity, spur short-term debt buying Reuters Last Updated: Sep 03, 2026, 12:37:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Indian government bonds saw gains early Thursday, led by shorter-term debt. Larger dollar inflows boosted rupee liquidity and improved sentiment for Indian assets. Banks raised significant foreign currency, adding to domestic liquidity for several years. This influx strengthened India's ability to support the rupee and domestic markets. Elevated oil prices and US Treasury yields continued to weigh on longer-dated bonds.\n\nIndian government bonds faced further declines for the fifth consecutive session as U.S. Treasury yields approached three-year peaks. The surge in oil prices reignited inflation concerns, particularly impacting India due to its status as a major importer. This scenario intensified expectations for monetary policy adjustments by the RBI. Critical upcoming events include the U.S. FOMC meeting and fluctuations in oil prices.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "03 Sep 2026, 12:37 PM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Motilal Oswal initiates coverage on Adani Power with Buy call, sees 20% upside. Time to hold or sell?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Motilal Oswal initiates coverage on Adani Power with Buy call, sees 20% upside. Time to hold or sell? Adani Power Share Price NTPC Share Price JSW Energy Share Price NLC India Share Price Jaiprakash Power Ventures Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Motilal Oswal initiates coverage on Adani Power with Buy call, sees 20% upside. Time to hold or sell? SECTIONS Motilal Oswal initiates coverage on Adani Power with Buy call, sees 20% upside. Time to hold or sell? By Somanjali Das , ETMarkets.com Last Updated: Sep 03, 2026, 12:31:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Motilal Oswal initiated coverage on Adani Power with a Buy rating and a target price of Rs 250, implying around 20% upside. The brokerage sees capacity expansion, its track record of turning around distressed assets and potential entry into nuclear power as key growth drivers.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "03 Sep 2026, 12:31 PM IST", "pub_date_relative": "36m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Stocks to buy: Nagaraj Shetti recommends eClerx Services, UNO Minda shares to buy in the short-term", "full_content": "Stock market today: Domestic benchmark indices Nifty 50 and Sensex gained 0.35% each on Thursday, 3 September, led by banking stocks, after lenders mobilised a higher-than-expected $136.4 billion through the RBI\u2019s foreign-currency deposit and borrowing schemes. The fund mobilisation is expected to strengthen liquidity ahead of the festive season.\n\nThe gains come after both benchmarks declined around 1% over the previous three sessions, weighed down by rising crude oil prices and global bond yields as investors reassessed expectations for interest rates to remain elevated for longer.\n\nHowever, at 12:23 IST, the Nifty 50 was flat at 23,905 . 80, while the BSE Sensex was also flat trading at 76,604.93.\n\nMeanwhile, oil prices eased on Thursday after their recent rally, with Brent crude trading close to $95 a barrel, while Asian equities advanced and US stock futures edged higher.\n\nRenewed fighting between the US and Iran had pushed crude prices sharply higher earlier this week. US President Donald Trump said on Wednesday that he did not expect the US bombing campaign to continue for \u201cmuch longer\u201d.\n\nBrent crude, the international benchmark, fell 0.4% to $95.26 a barrel, while US West Texas Intermediate (WTI) crude slipped 0.1% to $90.84 a barrel.\n\nThe downtrend continued in the market on Wednesday on the back of weak global cues and Nifty 50 closed the day lower by 141 points amidst minor recovery from the day's low. A small green candle was formed on the daily chart with minor lower shadow, and the opening downside gap has been filled partially. Technically, this market action signals minor buying at the lower support of 23,800 (previous opening upside gap of 27 July), but still there is no confirmation of any bottom reversal in the market.\n\nThe overall trend of Nifty 50 remains weak. The ongoing bearish pattern like lower tops and bottoms signal sell on rise opportunity on any pullback from here.", "source": "LiveMint Markets", "pub_date_str": "03 Sep 2026, 12:28 PM IST", "pub_date_relative": "39m ago", "cfa_topics": ["Equity Investments", "Fixed Income", "Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Gold vs Silver: Which precious metal offers a better bet for investors after the recent correction?", "full_content": "Gold and silver have rebounded after a recent correction, but the recovery has revived a key question for investors: which precious metal offers the better investment opportunity now?\n\nWhile both metals continue to benefit from long-term structural factors, their investment cases differ sharply. According to analysts, gold enjoys stronger support, while silver has delivered strong returns but remains more vulnerable to volatility.\n\nThe debate comes as precious metals recover from recent pressure triggered by the Jackson Hole shock.\n\nOn Thursday, September 3, gold rose more than 1% as the U.S. dollar and Treasury yields eased, while investors awaited U.S. nonfarm payrolls data that could shape expectations around the Federal Reserve's next policy move.\n\nSpot gold climbed 1.1% to $4,434.70 per ounce by 0425 GMT, after hitting a near one-month low in the previous session. U.S. gold futures gained 1.5% to $4,480.10, while spot silver rose 1.2% to $66.08.\n\nBack home, gold and silver prices jumped by up to 1% in morning deals on the MCX on Thursday, September 3, supported by easing U.S. dollar and bond yields. U.S. gold futures for December delivery also rose 1% to $4,473.21 per troy ounce.\n\nThe U.S. dollar remained under pressure, while Treasury yields eased from multi-year highs, improving the appeal of non-yielding assets such as gold. A weaker dollar also makes greenback-priced metals more affordable for buyers holding other currencies.\n\nThe recent correction in precious metals had gathered pace after the Jackson Hole meeting, where Warsh said the Fed would \"have work to do\" if policymakers failed to gain the confidence needed to ensure inflation was heading towards 2%.", "source": "LiveMint Markets", "pub_date_str": "03 Sep 2026, 12:08 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Derivatives", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Rs 10,000 SIP With A 10% Annual Step-Up: How Much Could You Have After 20 Years?", "full_content": "Step-Up SIP allows you to gradually increase your investment, without putting pressure on your monthly budget.", "source": "NDTV Profit", "pub_date_str": "03 Sep 2026, 12:00 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "India can unlock over USD 1.5 billion wheat export opportunity as global buyers diversify sourcing: ASSOCHAM", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Agriculture \u203a India can unlock over USD 1.5 billion wheat export opportunity as global buyers diversify sourcing: ASSOCHAM The Economic Times daily newspaper is available online now. Read Today's Paper India can unlock over USD 1.5 billion wheat export opportunity as global buyers diversify sourcing: ASSOCHAM SECTIONS India can unlock over USD 1.5 billion wheat export opportunity as global buyers diversify sourcing: ASSOCHAM ANI Last Updated: Sep 03, 2026, 11:59:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India can unlock a wheat export opportunity of more than USD 1.5 billion as the gradual reopening of exports coincides with strong domestic production, comfortable stocks and efforts by major global buyers to diversify their sources, an ASSOCHAM report said.\n\nQ1 investment numbers look stellar, but are we celebrating too early?\n\nPatent Cliff approaching: Can Indian pharma companies repeat past success?\n\nET Prime special: Bigger, Better or Both? Understanding business to figure out the mystery: Power Grid Corp \u2013 Part 1\n\nET Prime special series: 2013 to 2026. Not years, but evidence: Power Grid, Part 2\n\nWhen a CFO resigns, is \u2018personal reasons\u2019 explanation enough?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "03 Sep 2026, 11:59 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Rays of Belief IPO Day 3: Issue subscribed 13.63x so far. Check GMP, reviews, & other details. Apply or not?", "full_content": "Rays of Belief IPO has entered its last day of bidding on Thursday, 3 September. Traders who wish to invest have a last chance to place their bids today.\n\nThe mainboard IPO, which opened for bidding on 1 September, has so far received a strong response from investors.\n\nThe IPO is currently trading at a grey market premium (GMP) of \u20b9 59. At the upper price band of \u20b9 239 per share, this translates into an estimated listing price of \u20b9 298, representing a potential gain of 24.69% over the issue price.\n\nHowever, grey market trends tracked over the past 15 sessions show that the GMP has risen to \u20b9 59 today, signalling expectations of a strong listing. During this period, the GMP has fluctuated between \u20b9 0 and \u20b9 59.\n\nThe Rays of Belief IPO has been subscribed over 13.63 times so far by the last day of bidding.\n\nThe retail portion has been booked 49.33 times, meanwhile, non institutional investors(NIIS) has received 21.54 times subscription. QIB section has received 0.04 times.\n\nSwastika Investmart said Rays of Belief Limited, which operates under the Mom\u2019s Belief brand, offers personalised intervention services for Neurodevelopmental Disorders (NDDs) through its growing network of centres. The brokerage noted that the company\u2019s expanding footprint across India and the US could drive further revenue growth, while increasing scale has also contributed to an improvement in operating margins.\n\nHowever, Swastika Investmart highlighted key concerns, including the company\u2019s relatively short history of profitability, negative operating cash flow in FY26 and execution risks arising from its aggressive expansion plans. The absence of directly comparable listed peers also makes it challenging to evaluate the company\u2019s valuation.", "source": "LiveMint Markets", "pub_date_str": "03 Sep 2026, 11:57 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Broadcom\u2019s AI chip boom powers record quarter, shares waver", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News Powered By Broadcom\u2019s AI chip boom powers record quarter, shares waver Written by Anupam Nagar , ETMarkets.com | Sep 03, 2026, 12:18:47 PM IST 1 / 6 Broadcom\u2019s AI boom hits another gear Broadcom delivered a strong fiscal third-quarter performance, with revenue jumping 86% year-on-year to $29.6 billion. Surging demand for custom AI accelerators and networking chips drove the results. (Sources: Broadcom, Reuters, Wall Street Journal, Yahoo Finance)\n\nBroadcom\u2019s AI semiconductor revenue surged 221% year-on-year to $16.7 billion in the quarter. The company expects AI semiconductor revenue to accelerate further to $21.7 billion in Q4, up 236% from a year earlier.\n\nBroadcom sees its AI semiconductor business reaching $115 billion in fiscal 2027 and potentially doubling again to around $230 billion in 2028. The outlook reflects rapidly expanding AI infrastructure spending by major technology companies.\n\nBroadcom is benefiting from demand for custom chips from leading AI developers, including OpenAI, Anthropic and Google, while Meta is also expected to begin receiving Broadcom custom chips. The company says it has visibility into major AI deployments extending through 2028.\n\nDespite beating expectations, Broadcom shares came under pressure after the results. The key concern was its $34.8 billion Q4 revenue forecast, which was only slightly above or below some analyst estimates depending on the data set, leaving investors looking for a bigger upside surprise.\n\nBroadcom's adjusted earnings came in at $3.32 per share, ahead of the $3.22 analyst estimate, while Q3 revenue also topped expectations. But with AI expectations already extremely high, investors appear to be demanding even stronger guidance and evidence that Broadcom can sustain its rapid AI growth.", "source": "Economic Times Markets", "pub_date_str": "03 Sep 2026, 11:55 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Eying Indian campuses of foreign universities to save education costs? Pros and cons of this alternative explained", "full_content": "Indian branch foreign university campuses appear as one of the best alternatives for those vying admission in overseas institutions but cannot make it due expensive visa application and tuition fee, steep living costs, recurring airfares and other expenses that could add up to crores. While foreign university campuses bridge this gap and promise global degrees at a fraction of overseas costs, the real question about the degree's validity in terms of market demand arises.\n\nThe National Education Policy (NEP) 2020 closed the divide created between domestic and overseas degrees by allowing foreign universities to set up branch campuses in India. Regulated by education ministry's University Grants Commission (UGC) and the International Financial Services Centres Authority (IFSCA) GIFT City framework, the gateway restricts entry to institutions listed in the top 500 global rankings, such as QS World University Rankings , which vary from subject to subject.\n\nConsidering the curiosity among students to enrol in foreign campuses, the Gen Z Outlook Report 2026 published by online education company Emeritus this week suggests that 60% of pre-college students want to study abroad. Meanwhile, 69% of students currently enroled in or having completed their undergraduate degree and looking for a PG course expressed their interest in an India-based international programme mainly to avoid visa uncertainty.\n\nLet's learn whether higher cost of degrees than established domestic universities offer better learning, employability, international exposure, industry access, future mobility, alumni networks and more.\n\nAt a fraction of overseas costs, foreign university campuses offer global degrees awarded by the parent university. According to Emeritus co-founder and CEO Ashwin Damera, the financial appeal of an Indian branch campus lies in the significant reduction in expenditure without sacrificing degree legitimacy.", "source": "LiveMint Money", "pub_date_str": "03 Sep 2026, 11:54 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Aequs Share Price Jumps Over 4% Amid Strong Volumes; Stock Up 80% In Six Months", "full_content": "Aequs share price rally was supported by robust volumes. Around 35 lakh equity shares of Aequs changed hands on stock exchanges on September 3, as compared with its one-week average trading volume of 19 lakh shares.", "source": "NDTV Profit", "pub_date_str": "03 Sep 2026, 11:53 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "16 mutual funds delivered over 20% SIP returns in 10 years; \u20b910,000 monthly investment grew to \u20b938.8 lakh", "full_content": "For investors who stay with their mutual fund SIPs through market ups and downs, time can make a significant difference to the eventual corpus. A decade of regular investing can allow returns to compound across different market cycles, although not every fund is able to sustain strong performance for that long.\n\nAn analysis of Value Research data shows that 16 schemes delivered annualised SIP returns of more than 20% over the past 10 years.\n\nNippon India Small Cap Fund led the pack with a 22.51% 10-year SIP return. A \u20b9 10,000 monthly SIP in the fund over the period would have grown to about \u20b9 38.8 lakh, against a total investment of \u20b9 12 lakh.\n\nWhat stands out, however, is that the 10-year leaders were spread across different investment strategies. Small-cap and mid-cap funds featured prominently, but the list also included gold, infrastructure, healthcare, multi-asset and ELSS funds.\n\nNippon India Small Cap Fund was followed by Bank of India Manufacturing & Infrastructure Fund and Quant Multi Asset Allocation Fund, with 10-year SIP returns of 22.10% and 22.02%, respectively. Invesco India Mid Cap Fund was close behind at 21.95%.\n\n7 of the 16 funds were small-cap or mid-cap funds. The remaining nine came from infrastructure, healthcare, ELSS and multi-asset categories.\n\nThe long-term numbers, therefore, tell a story of sustained compounding rather than a single market rally. But the picture changes considerably when the analysis is narrowed to the past year.\n\nThe latest one-year SIP performance is heavily tilted towards small-cap funds. Bank of India Small Cap Fund topped the broader one-year list with a 52.89% return , followed by ITI Small Cap Fund at 44.21% and Union Small Cap Fund at 43.17%.", "source": "LiveMint Money", "pub_date_str": "03 Sep 2026, 11:49 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Quantitative Methods", "Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "Prasol Chemicals IPO: Price band set at \u20b9643- \u20b9676 per share; check key dates, issue details", "full_content": "Prasol Chemicals IPO price band: The Prasol Chemicals Limited IPO price band has been fixed in the range of \u20b9 643 to \u20b9 676 per equity share of the face value of \u20b9 2. The Prasol Chemicals IPO date of subscription is scheduled for Tuesday, 8 September and will close on Thursday, 10 September. The allocation to anchor investors for the Prasol Chemicals IPO is scheduled to take place on Monday, 7 September.\n\nThe Prasol Chemicals IPO lot size is 22 equity shares and in multiples of 22 equity shares thereafter.\n\nPrasol Chemicals IPO has reserved not more than 50% of the shares in the public issue for qualified institutional buyers (QIB), not less than 15% for non-institutional Institutional Investors (NII), and not less than 35% of the offer is reserved for retail investors.\n\nTentatively, Prasol Chemicals IPO basis of allotment of shares will be finalised on Friday, 11 September and the company will initiate refunds on Tuesday, 15 September, while the shares will be credited to the demat account of allottees on the same day following refund. Prasol Chemicals share price is likely to be listed on BSE and NSE on Wednesday, 16 September.\n\nPrasol Chemicals plans to raise \u20b9 80 crore through a fresh issue of shares, while promoters and existing shareholders will offload shares worth up to \u20b9 420 crore through an offer for sale ( OFS ).\n\nOf the net proceeds from the fresh issue, \u20b9 60 crore will be used to repay debt, against outstanding borrowings of \u20b9 343.7 crore as of 15 July 2026. The remaining funds will be utilised for general corporate purposes. Proceeds from the OFS will accrue entirely to the selling shareholders.\n\nDAM Capital Advisors has been appointed as the merchant banker for the Prasol Chemicals IPO, while Kfin Technologies will act as the registrar to the issue.\n\nPrasol Chemicals manufactures acetone- and phosphorus-based speciality chemicals, along with a range of customised speciality chemicals that are neither acetone- nor phosphorus-based.", "source": "LiveMint Markets", "pub_date_str": "03 Sep 2026, 11:45 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "SpiceJet Finalises Lease Agreements For 20 Aircraft Ahead Of Winter Schedule; Share Price Rises Nearly 5%", "full_content": "The planned induction comes as SpiceJet prepares to ramp up its operations during the winter schedule, when passenger demand typically receives a boost from the holiday and festive travel season.", "source": "NDTV Profit", "pub_date_str": "03 Sep 2026, 11:43 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Senior Citizen Savings Scheme: Can you invest \u20b950 lakh in SCSS? Here\u2019s what investors need to know", "full_content": "Have you retired with a tidy \u20b9 50 lakh corpus? Do you plan to park these funds in a completely safe, government-backed and high-paying investment scheme? Your first instinct might be the Senior Citizen Savings Scheme (SCSS).\n\nThis popular scheme offers one of the most lucrative interest rates for senior citizens. But can it actually accommodate such a large sum? The short answer is no. Here's why.\n\nThe SCSS is a savings instrument operated through post offices and banks. Launched in 2004, it was designed exclusively for retirees seeking a secure, predictable, government-guaranteed income stream.\n\nIt sits within the nation\u2019s broader family of small savings schemes, including instruments such as the Public Provident Fund (PPF), the National Savings Certificate (NSC), and the Sukanya Samriddhi Yojana (SSY), all backed by the Government of India. The interest rates on these schemes are revised quarterly by the Finance Ministry.\n\nEach scheme has a different objective: PPF, for example, is a scheme for long-term, tax-free wealth building; NSC, for medium-term, fixed-return investing; SSY, for a girl child's future; and SCSS, specifically for post-retirement income.\n\nHere are the current rates for the July\u2013September 2026 quarter. They have remained unchanged from the previous quarter.\n\nSource: India Post website Here are the limits, eligibility criteria, tenure, interest payouts and other aspects of the SCSS scheme.\n\nNote: The features discussed above are subject to change; refer to the official India Post website for the latest terms and conditions before making any investment decisions.", "source": "LiveMint Money", "pub_date_str": "03 Sep 2026, 11:33 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}], "updated_at": "03 Sep 2026, 01:08 PM IST", "total_stories": 373};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>

</body>
</html>
