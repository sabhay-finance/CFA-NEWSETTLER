    const allData = {"general": [{"title": "Japanese stocks post biggest single-day fall since \u2018liberation day\u2019 chaos", "full_content": "\u2018Complete carnage\u2019 as Nikkei 225 and Topix indices drop nearly 6% in flight from AI trade", "source": "FT Markets", "pub_date_str": "06 Nov 2026, 01:30 PM IST", "pub_date_relative": "2m ago"}, {"title": "Stock futures mixed after Nasdaq correction; Japan's Nikkei 225 enters bear market: Live updates", "full_content": "Stock futures were mixed early Friday after a punishing sell-off in artificial intelligence stocks that sent the Nasdaq into correction territory. Traders also awaited a key payrolls report.\n\nFutures tied to the Dow Jones Industrial Average slumped 1.3%. S&P 500 futures were down 0.35%, while Nasdaq-100 futures inched 0.3% higher, clawing back a fraction of heavy losses suffered on Thursday.\n\nIn Asia, South Korea led losses in the region, with the Kospi plunging more than 6%. Japan's Nikkei 225 dropped 5.9%, falling into bear market territory. Australia's S&P/ASX 200 slipped 0.9%. Hong Kong's Hang Seng Index fell 1%, and mainland China's CSI 300 declined 1.47%.\n\nThe moves follow a bout of heavy selling during Thursday's regular Wall Street session that saw the three major averages post their worst one-day performances since April 2025. The Nasdaq Composite tanked 5.5%, closing more than 10% below its most recent high and landing in correction territory. The broad-market S&P 500 lost 4.4%, while the Dow fell more than 1,800 points, or 3.4%.\n\nWhile all 11 sectors of the S&P 500 closed with losses, shares of companies tied to the AI build-out suffered keenly. Democrats' big wins in the House and Senate, as well as key governorships in states like Texas, sparked traders' worries of a potential slowdown in data center construction.\n\nMicron Technology and Advanced Micro Devices plummeted 17% each, while neocloud CoreWeave slid 10%. Even the Magnificent Seven weren't spared, as Nvidia dropped 9%, turning negative for 2026, and the cohort of tech juggernauts shed more than $1 trillion in aggregate market cap.\n\nThe three major averages are poised for losses on the week, with the Nasdaq down 4.4% and the S&P 500 off almost 3% in the period. The 30-stock Dow is the relative outperformer of the three, off just 0.5% week to date.\n\nThe pullback creates a buying opportunity, Victoria Greene, CIO at G Squared Private Wealth told CNBC Thursday.", "source": "CNBC Top News", "pub_date_str": "06 Nov 2026, 01:28 PM IST", "pub_date_relative": "4m ago"}, {"title": "Asian FX mixed as yen pares gains, Aussie hits 18-week low ahead of U.S. payrolls", "full_content": "", "source": "Investing.com News", "pub_date_str": "06 Nov 2026, 01:24 PM IST", "pub_date_relative": "8m ago"}, {"title": "Titan shines 3% on Dhanteras 2026 after 2x profit; Noel Tata's exit news from board adds to spotlight - Outlook, target", "full_content": "Sharmila Bhadoria Published 6 Nov 2026, 01:23 PM IST Prefer Livemint on Google Titan Stock: Shares of Titan Company Limited surged during Friday\u2019s trading session as its net profit more than doubled during the second quarter of financial year 2026-27. The sharp uptick in profit came as robust demand for higher-margin studded jewellery supported growth. Additionally, Noel Tata has announced his retirement as Vice Chairman and Director of Titan Company.\n\nTitan share price surged more than 3% to touch an intraday of \u20b9 5001.90 per share on Friday, Dhanteras. Here are all the details to know.\n\nNoel N Tata, Chairman of Tata Trusts, has announced his exit from Titan Company Board. He will retire as Director and VC of the leading jewellery and watchmaker Titan Company from November 12, 2026.\n\n\"We wish to inform you that, in accordance with the Tata Group Governance Guidelines, Noel N. Tata will retire from the office of Non- Executive, Non-Independent Director and Vice Chairman of the Company, with effect from 12th November 2026,\" Titan said in a regulatory filing.\n\nThe retirement of sixty nine-year old Noel Tata came as per the mandatory guidelines of the Companies Act 2013. The act mandates that any MD or Whole Time Director cannot be appointed or continue in employment if they are 70 years of age or older.\n\nIndia\u2019s leading branded jewellery and watch maker reported a twofold jump in its consolidated net profit to \u20b9 2,393 crore in the September quarter of FY27. Titan Company\u2019s net profit stood at \u20b9 1,120 crore in the same quarter of previous financial year.\n\nThe sharp jump in Titan net profit was due to \u20b9 671 crore accounting gain arising from a fair-value change in the NCI put-option liability associated with Damas acquisition.", "source": "LiveMint Markets", "pub_date_str": "06 Nov 2026, 01:23 PM IST", "pub_date_relative": "9m ago"}, {"title": "Tesla to wind down Cybertruck production at Texas factory, Musk says", "full_content": "", "source": "Investing.com News", "pub_date_str": "06 Nov 2026, 01:18 PM IST", "pub_date_relative": "14m ago"}, {"title": "BOJ to hike in December, seek terminal rate of 2%, says ex-central bank top economist", "full_content": "", "source": "Investing.com News", "pub_date_str": "06 Nov 2026, 01:18 PM IST", "pub_date_relative": "14m ago"}, {"title": "Rightmove raises 2026 EPS growth forecast to \"at least 7%\"", "full_content": "", "source": "Investing.com News", "pub_date_str": "06 Nov 2026, 01:15 PM IST", "pub_date_relative": "17m ago"}, {"title": "Monzo explores fundraising at \u00a37.5bn valuation as private equity talks stall", "full_content": "Lender had shifted focus to talks with buyout groups after failing to clinch a \u00a310bn takeover by Brazilian fintech Nubank", "source": "FT Markets", "pub_date_str": "06 Nov 2026, 01:14 PM IST", "pub_date_relative": "18m ago"}, {"title": "Goldman lowers year-end gold price forecast on hawkish Fed shift", "full_content": "", "source": "Investing.com News", "pub_date_str": "06 Nov 2026, 01:14 PM IST", "pub_date_relative": "18m ago"}, {"title": "AI boom turns chip packaging into the next battleground for semiconductors", "full_content": "", "source": "Investing.com News", "pub_date_str": "06 Nov 2026, 01:12 PM IST", "pub_date_relative": "20m ago"}, {"title": "South Korean corporate reforms hit rough patch as Samsung digs in", "full_content": "", "source": "Investing.com News", "pub_date_str": "06 Nov 2026, 01:12 PM IST", "pub_date_relative": "20m ago"}, {"title": "Airbus delivered 74 aircraft in October, faces year-end sprint to hit 2026 target", "full_content": "", "source": "Investing.com News", "pub_date_str": "06 Nov 2026, 01:10 PM IST", "pub_date_relative": "22m ago"}, {"title": "Asian markets battered after Wall Street AI rout", "full_content": "Investors fear Democrats will seek to slow US data centre build-out that underpins the AI boom", "source": "FT Markets", "pub_date_str": "06 Nov 2026, 01:09 PM IST", "pub_date_relative": "23m ago"}, {"title": "Markets fret over growth and inflation, just as tech rout gains speed", "full_content": "", "source": "Investing.com News", "pub_date_str": "06 Nov 2026, 01:06 PM IST", "pub_date_relative": "26m ago"}, {"title": "Hungary\u2019s retail sales rise 4.3% in September", "full_content": "", "source": "Investing.com News", "pub_date_str": "06 Nov 2026, 01:06 PM IST", "pub_date_relative": "26m ago"}, {"title": "Diwali, Dhanteras shopping by credit card: 5 simple ways to keep your expenses under control this festive season - List", "full_content": "Diwali and Dhanteras often bring lucrative discounts, cashback offers and special deals on a wide range of products and services, both online and offline. For such lucrative deals, it is a given that credit cards make festive shopping comfortable and convenient.\n\nThe benefits and the ease of use of these credit tools can encourage unnecessary spending and leave cardholders with difficult-to-manage bills after the festive season ends.\n\nHere are five practical ways that help an individual keep their credit card expenses under control.\n\nBefore you start spending, decide how much you can comfortably spend on items such as clothes, electronics, gold purchases, gifts for friends and family and household items. Generally, the festive shopping budget should come from available savings and monthly surplus. Such spending should not be funded by a fresh loan or piling up more credit card debt.\n\nA 20% discount or lucrative cashback offer on any product or service does not mean \u2018saving\u2019 money.\n\nPurchases should only be initiated after comparing prices across platforms, checking the final payable amount, and avoiding buying additional items primarily to qualify for more discounts, offers or reward points.\n\nWhile using your credit card during the festive season, another way to keep a tab on excessive expenses is to track your credit card utilisation.\n\nA high credit utilisation ratio over extended periods can adversely affect your overall credit profile and credit score. Keep the credit utilisation ratio below 30% of the total available credit limit. This means that if your credit card limit is \u20b9 1,00,000, then ensure that not more than \u20b9 25,000-30,000 of this limit is used.", "source": "LiveMint Money", "pub_date_str": "06 Nov 2026, 01:05 PM IST", "pub_date_relative": "27m ago"}, {"title": "Diwali Muhurat Trading 2026, Samvat 2083: Date, timings, history, settlement rules, more - Top 10 things for investors", "full_content": "MCX BSE Pranati Deva Published 6 Nov 2026, 01:02 PM IST Prefer Livemint on Google Muhurat Trading 2026 : Every year, on the auspicious occasion of Diwali, the Indian stock exchanges open especially for one hour for a special trading session in the evening. This special hour of trading is known as 'muhurat trading'. The word Muhurat itself stands for \u2018auspicious\u2019.\n\nThis year, the Indian stock market will open for a special trading session on Sunday, November 8, as BSE , the National Stock Exchange (NSE) and commodity exchange MCX continue the long-standing tradition of Diwali Muhurat Trading.\n\nMarking the beginning of Samvat 2083, or the new Hindu financial year, the one-hour session holds special significance for investors and traders who consider it an auspicious occasion to begin the year with a symbolic investment.\n\nAlthough trading volumes are generally lower than on regular market days, the session attracts participation from investors looking to honour the tradition of buying stocks during Lakshmi Puja.\n\nMuhurat Trading will take place on Sunday, November 8, coinciding with Diwali and Lakshmi Puja. The session will mark the beginning of Samvat 2083.\n\nThe main equity Muhurat Trading session will run from 2:20 pm to 3:30 pm. Unlike regular trading days, when markets operate from 9:15 am to 3:30 pm, this will be a special one-hour session.\n\nThe pre-open session will start at 2:05 pm. Investors can place limit and market orders until 2:10 pm, while only limit orders will be accepted between 2:10 pm and 2:15 pm. Order matching and confirmation will take place from 2:15 pm to 2:17 pm, followed by a buffer period until 2:20 pm.\n\nMCX will conduct its special session from 2:05 pm to 2:19 pm, followed by the main trading session from 2:20 pm to 3:30 pm. Contracts across all commodities and indices will be available for trading.", "source": "LiveMint Markets", "pub_date_str": "06 Nov 2026, 01:02 PM IST", "pub_date_relative": "30m ago"}, {"title": "The 'World's Best Airline' is updating its business and first-class experience", "full_content": "Singapore Airlines is rolling out new onboard seating, dining and entertainment options as part of an over S$2 billion ($1.6 billion) investment to keep up with rivals from around the world.\n\nThe cornerstone of this investment: new premium cabin seats for its long-haul flights, which will progressively debut on the Airbus A350 long-haul and ultra-long-range planes in mid-2027.\n\nFirst-class seats will come with 32-inch 4K high-definition screens, Bang and Olufsen noise-cancelling headphones and options for passengers to book double bed and face-to-face dining configurations.\n\nSeating in business class will come outfitted with 22-inch 4K screens, wireless charging and Bluetooth audio connectivity.\n\nThese retrofits to the A350 aircraft also come as SIA grapples with a long-running delay to the delivery of new Boeing 777-9 planes, which were slated to come in 2021 and now faces an uncertain date as to when it will take delivery of the aircraft.\n\nThese products will also debut with the 777-9 aircraft when they come into service with SIA.\n\nMinor refreshes will be added to other classes, such as an extra inch of reclining space in premium economy cabins, and new upholstery in economy class. Both will also come with new 4K seatback entertainment monitors, but the new features for economy and premium economy seats will only be on the incoming 777-9 aircraft.\n\nSpeaking at a media briefing on Nov 4, SIA Chief Commercial officer Lee Lik Hsin said that the decision to bring the products to the A350 was due to the delays with the 777-9.", "source": "CNBC Top News", "pub_date_str": "06 Nov 2026, 01:02 PM IST", "pub_date_relative": "30m ago"}, {"title": "Tanishq, Malabar Gold rate today Dhanteras 6 Nov: Latest price; Kolkata, Hyderabad, Mumbai, Chennai, Nagpur, Ahmedabad", "full_content": "Gold prices at Tanishq and Malabar Gold are worth checking before making a purchase on Dhanteras 2026, as households across India head to jewellery stores to buy gold and silver on the auspicious occasion.\n\nOn Friday, November 6, Tanishq's 22-karat gold rate stood at \u20b9 1,31,900 per 10 grams, down \u20b9 2,450, or 1.82%, from the previous day's rate of \u20b9 1,34,350.\n\nAt Malabar Gold, the 22-karat gold rate was \u20b9 13,150 per gram, while 24-karat gold was priced at \u20b9 14,345 per gram on November 6.\n\nBoth jewellery brands follow a uniform base gold pricing policy across their showrooms in India. This means customers in cities such as Kolkata, Hyderabad, Mumbai, Chennai, Nagpur and Ahmedabad can refer to the same daily base rate announced by the respective brands.\n\nAccording to Tanishq's official website, the 22-karat gold price on November 6 was \u20b9 13,190 per gram, or \u20b9 1,31,900 for 10 grams.\n\nThe rate declined from \u20b9 13,435 per gram on November 5, marking a fall of \u20b9 245 per gram.\n\nTanishq follows a uniform daily base gold rate for standard purities such as 22-karat and 18-karat across its national network. Therefore, its base rate does not significantly differ between cities.\n\nMalabar Gold's 22-karat gold rate stood at \u20b9 13,150 per gram on November 6. The company's 24-karat gold rate was \u20b9 14,345 per gram.", "source": "LiveMint Money", "pub_date_str": "06 Nov 2026, 01:00 PM IST", "pub_date_relative": "32m ago"}, {"title": "Equinix points to smaller facilities as scrutiny of U.S. data center construction grows", "full_content": "Equinix says its smaller data centers could be less exposed to potential U.S. construction restrictions as regulators scrutinize the rapid buildout of artificial intelligence infrastructure.\n\nThe company's facilities typically range from 30 to 60 megawatts, compared with the roughly 100-megawatt threshold that Cyrus Adaggra, Equinix's Asia-Pacific president, said is generally targeted by U.S. proposals.\n\n\"We will invest in markets where we see customer demand, and because we have a footprint that is typically less than 100 megawatts, we tend not to fall and be caught by the legislation or the regulation, which is typically at about 100 megawatts in the U.S.,\" Adaggra told CNBC's \" Squawk Box Asia. \"\n\nHis comments come as the U.S. midterm election results have heightened concerns that new restrictions on data center development could delay projects and raise construction costs.\n\nAbout 53% of projected growth in the U.S. hyperscaler development pipeline is concentrated in states where newly elected governors could impose restrictions on data center construction, according to a Wednesday report from BMI, a Fitch Solutions company.\n\nThe firm said any impact would likely become more apparent from 2028, as most projects planned for 2027 are already committed.\n\nEquinix has increased capital spending from about $2 billion a few years ago to $7 billion, driven by growing customer demand, Adaggra said.\n\n\"The number one determinant of our capex spend and build is customer demand,\" he said.", "source": "CNBC Top News", "pub_date_str": "06 Nov 2026, 12:53 PM IST", "pub_date_relative": "39m ago"}, {"title": "How US Midterm Election Results, AI sell-off impacted US stock market, Nikkei 225, Kospi, Taiwan and China; data details", "full_content": "US Midterm Election Results | AI stocks fall: After the humiliating defeat of Donald Trump's Republican Party in the US Midterm Elections 2026, a massive sell-off was triggered in AI and semiconductor stocks across global markets. In the US stock market, flagship AI and semiconductor stocks NVIDIA, AMD, and Micron shares crashed by up to 17%, wiping out $2.50 trillion in wealth from Wall Street, a BBC report claims. The sell-off in AI and semiconductor stocks was not limited to the US market. AI and semiconductor stocks listed on the Japanese Nikkei 225, South Korea's KOSPI, Taiwan's Taiex, China's CSI 300, and Hong Kong's Hang Seng Index witnessed heavy losses after the Democratic Party's sweeping victory in the US Midterm Elections.\n\nAfter the announcement of US Midterm Election Results 2026, the tech-heavy Nasdaq Composite index crashed over 5.50% and finished at 24,315 on Thursday. The Dow Jones Industrial Average crashed by close to 3.50% and finished at 51,523, while the S&P 500 index nosedived by4.36%. Other US stock indices also witnessed heavy losses, wiping out around $2.50 trillion of wealth from Wall Street, which saw its worst day since 2025.\n\nAI poster boy NVIDIA share price opened lower at $196.07 per share and finished at $181.60 per share, logging an intraday loss of 9.26% against Wednesday's close of $200.13 per share.\n\nShares of Advanced Micro Devices, or AMD, opened lower at $452.50 per share and ended at $404.40 apiece, recording an intraday loss of 17.26%.\n\nLikewise, Micron Technology Inc. shares saw strong selling pressure throughout Thursday's session and ended 17.46% lower at $656.39 per share.\n\nAsian stocks are also under heavy selling pressure for the last two straight sessions. The Japanese Nikkei 225 index has fallen from 62,188 to 57,269, recording a 7.90% loss after the announcement of the US Midterm Election Results.", "source": "LiveMint Markets", "pub_date_str": "06 Nov 2026, 12:45 PM IST", "pub_date_relative": "46m ago"}, {"title": "Thane Diwali Row: Light Decoration On Trees Trigger Controversy In Hiranandani Estate, TMC Approaches Police", "full_content": "The complaint follows objections from environmental activist Rohit Joshi, who criticised the commercial lighting and demanded legal action against those responsible.", "source": "NDTV Profit", "pub_date_str": "06 Nov 2026, 12:45 PM IST", "pub_date_relative": "47m ago"}, {"title": "Diwali Stock Picks 2026: BEL, Shriram Finance Among PL Capital's Eight Recommendations For Samvat 2083; Check Full List", "full_content": "With Dhanteras today and Diwali around the corner, PL Capital has unveiled a basket of eight stock ideas spanning defence, PSU, banks, NBFCs, industrials and consumption sectors including BEL, ICICI Bank, Britannia Industries, and more from large and mid-cap sector.", "source": "NDTV Profit", "pub_date_str": "06 Nov 2026, 12:43 PM IST", "pub_date_relative": "49m ago"}, {"title": "NSE Market Cap Crosses $50 Billion As Stock Price Jumps Over 3%", "full_content": "At today's highest price, the market capitalization of recently-listed NSE surpassed $50 billion, or Rs 4.84 lakh crore, making it the seventh biggest listed company, surpassing the giants like Infosys, Hindustan Unilever, LIC and ITC.", "source": "NDTV Profit", "pub_date_str": "06 Nov 2026, 12:41 PM IST", "pub_date_relative": "51m ago"}, {"title": "Is the AI stock bubble finally bursting?", "full_content": "Any reasonable person can see the hallmarks of an unsustainable party in markets", "source": "FT Markets", "pub_date_str": "06 Nov 2026, 12:41 PM IST", "pub_date_relative": "51m ago"}, {"title": "CM Yogi Diwali gift for UP govt employees: 30-day bonus approved; check \u20b96908 payout, GPF rules, eligibility criteria", "full_content": "The Uttar Pradesh government, led by Chief Minister Yogi Adityanath, has approved a 30-day ad hoc bonus for eligible state government employees for the financial year 2025-26, ahead of Diwali.\n\nUnder the new order, employees can receive a maximum bonus of \u20b9 6,908, subject to the prescribed salary ceiling. However, the entire amount will not be paid directly into their bank accounts. The government has decided to credit 75% of the approved bonus to employees' provident fund accounts, while the remaining 25% will be paid in cash.\n\nThe Finance Department issued the government order on 5 November 2026, specifying the eligibility criteria, calculation method and payment arrangements.\n\nThe bonus will cover full-time, non-gazetted state government employees working in posts up to Pay Matrix Level 8, with a pay range of \u20b9 47,600 to \u20b9 1,51,100. Employees under the earlier pay structure with a grade pay of up to \u20b9 4,800 will also qualify.\n\nThe benefit extends beyond regular state government departments. Employees of educational and technical institutions receiving grants from the state government, local bodies, district panchayats and work-charged establishments of government departments are also covered.\n\nAn employee must have completed at least one year of continuous service as of 31 March 2026 to qualify for the bonus. The order also clarifies that employees who have received financial upgradation to a higher pay matrix level will remain eligible if their substantive post falls within the prescribed pay level.\n\nHowever, employees who were penalised in departmental disciplinary proceedings or criminal cases during 2025-26 will not be eligible for that year's bonus. Where disciplinary proceedings or criminal cases are pending, payment will be withheld until the outcome is known.\n\nThe government has fixed \u20b9 7,000 as the maximum monthly emoluments considered for calculating the bonus.", "source": "LiveMint Money", "pub_date_str": "06 Nov 2026, 12:34 PM IST", "pub_date_relative": "57m ago"}, {"title": "Rupee falls 9 paise to 94.50 against US dollar in early trade", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Forex \u203a Rupee falls 9 paise to 94.50 against US dollar in early trade The Economic Times daily newspaper is available online now. Read Today's Paper Rupee falls 9 paise to 94.50 against US dollar in early trade SECTIONS Rupee falls 9 paise to 94.50 against US dollar in early trade PTI Last Updated: Nov 06, 2026, 12:34:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis In early trading on Friday, the rupee slipped by 9 paise to reach 94.50 against the US dollar, driven by a robust dollar and surging crude oil prices. After a brief bounce-back, it peaked at 94.36. The domestic equity market exhibited mixed performance, with Sensex rising yet Nifty falling. Notably, Foreign Institutional Investors remained active, purchasing substantial equities, bolstering market optimism.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "06 Nov 2026, 12:34 PM IST", "pub_date_relative": "58m ago"}, {"title": "Stock Market Today LIVE: Sensex Reclaims 80,000, Nifty 50 Above 24,700; M&M, Titan Lead Rally", "full_content": "Stock Market Today LIVE: Among sectors, Nifty IT, Nifty Pharma and Nifty Private Bank led the rally, while losses were seen in Nifty Metal, Nifty Realty, Nifty Auto, Nifty Media and Nifty PSU Bank indices.", "source": "NDTV Profit", "pub_date_str": "06 Nov 2026, 12:34 PM IST", "pub_date_relative": "58m ago"}, {"title": "India bonds emerge as top Asian performers as oil, Treasury yields decline", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Bonds \u203a India bonds emerge as top Asian performers as oil, Treasury yields decline CSB Bank Share Price YES Bank Share Price Karur Vysya Bank Share Price Bandhan Bank Share Price City Union Bank Share Price Powered By The Economic Times daily newspaper is available online now. Read Today's Paper India bonds emerge as top Asian performers as oil, Treasury yields decline SECTIONS India bonds emerge as top Asian performers as oil, Treasury yields decline Reuters Last Updated: Nov 06, 2026, 12:33:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis This week, Indian government bonds saw a positive trend following a Democratic win in the U.S. midterm elections. The reduction in oil prices and Treasury yields eased rupee pressure, boosting investor confidence. The benchmark bond yield improved significantly, declining by approximately 22 basis points. Furthermore, the surge in foreign investments into Indian bonds marked a notable high since July, leading to enhanced overall market sentiment.\n\nThis week, Indian government bonds saw a positive trend following a Democratic win in the U.S. midterm elections. The reduction in oil prices and Treasury yields eased rupee pressure, boosting investor confidence. The benchmark bond yield improved significantly, declining by approximately 22 basis points. Furthermore, the surge in foreign investments into Indian bonds marked a notable high since July, leading to enhanced overall market sentiment.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "06 Nov 2026, 12:33 PM IST", "pub_date_relative": "59m ago"}, {"title": "Diljit Dosanjh Makes History As Singer Set To Perform At 2026 Latin Grammy Awards", "full_content": "Diljit Dosanjh will share the stage with other well known Latin music stars, including Karol G and Bizarrap, at the ceremony in Las Vegas.", "source": "NDTV Profit", "pub_date_str": "06 Nov 2026, 12:28 PM IST", "pub_date_relative": "1h ago"}, {"title": "Deepinder Goyal's 12-Word Response To Techie's 'Never Build A Healthcare Startup In India' Comment", "full_content": "Temple opened for pre-orders on November 1 at Rs 85,000 as doctors have questioned its scientific claims.", "source": "NDTV Profit", "pub_date_str": "06 Nov 2026, 12:26 PM IST", "pub_date_relative": "1h ago"}, {"title": "Dhanteras 2026: Gold price soars over 360%! \u20b930,000 investment in gold 10 years ago is \u20b91.41 lakh today", "full_content": "Dhanteras 2026 : Dhanteras has always held a special place in the hearts of Indian consumers, as gold and silver purchases are deeply rooted in tradition, prosperity, and the sentiment of auspicious beginnings. For many, buying precious metals on this occasion goes beyond an investment decision; it is an emotional purchase associated with shagun, good fortune and the hope of prosperity for the family.\n\nGold has turned out to be a powerful wealth creator for investors who bought the precious metal on Dhanteras a decade ago and stayed invested. An investment of around \u20b9 29,989 per 10 grams on Dhanteras 2016 would be worth approximately \u20b9 1,41,444 today, representing 4.6 times growth.\n\nThe impressive returns underline gold's appeal not just as a traditional festive purchase but also as a long-term investment, even through periods of price corrections and volatility.\n\nHowever, in today's deals, MCX gold price declined around 2% to \u20b9 1,41,444 per 10 grams.\n\nMCX gold rose from \u20b9 29,989 per 10 grams on October 28, 2016, to \u20b9 1,41,444 today, November 6. This represents an absolute return of 362%, or a 4.6-fold increase. However, in today's deals, MCX gold price declined around 2% to \u20b9 1,41,444 per 10 grams.\n\nMeanwhile, International gold prices on COMEX, meanwhile, increased from $1,269.20 per ounce in 2016 to $4,076 in November 2026, delivering an absolute return of 221.1%, a CAGR of 12.30% and an annualised return of 14%.\n\nGold prices did not move upwards in a straight line. The metal experienced intermittent corrections, including a 5.6% decline in 2021, but resumed its upward trajectory in subsequent years. The rally became particularly strong in 2024 and 2025, when domestic prices jumped 30.6% and 61.5%, respectively.\n\nThe divergence between domestic and international returns also highlights the impact of currency movements and import-related costs on Indian gold prices.", "source": "LiveMint Markets", "pub_date_str": "06 Nov 2026, 12:15 PM IST", "pub_date_relative": "1h ago"}, {"title": "Q2 Results Live: Vardhman Textiles Profit Jumps 91%; Anup Engineering Profit Plunges 79%; Siemens, Hindalco, Voltas Also In Focus", "full_content": "Siemens, Bosch, 3M India, Hindalco, Voltas and KIOCL are among the 223 companies scheduled to announce their Q2 results today. Track the latest earnings announcements, financial performance, management commentary and stock market reaction live on NDTV Profit.", "source": "NDTV Profit", "pub_date_str": "06 Nov 2026, 12:14 PM IST", "pub_date_relative": "1h ago"}, {"title": "M&M in top gear even as margin compression, weak tractor sales woes linger", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nMahindra and Mahindra investors chose to overlook profitability concerns and a downward revision in the FY27 guidance for the tractor industry. Instead, they seem to have drawn comfort from the company\u2019s robust September quarter (Q2FY27) results and upward revision in the light commercial vehicle (LCV) industry guidance to double-digits from a high-single digit.\n\nReacting to its Q2 earnings announced on Thursday, the stock rallied 10% over the past two trading sessions.\n\nStandalone revenue rose 26% year-on-year to \u20b9 42,477 crore, beating consensus estimates by almost 8%. The automotive business, which manufactures a range of passenger and commercial vehicles, electric vehicles and mobility products, was the largest contributor, with revenue rising 36%.\n\nThis was aided by a 26% increase in SUV volumes to 183,000 units. Mahindra retained its leadership in the SUV segment, with a revenue market share of 24.3% and has maintained its FY27 SUV volume guidance at the mid-to-high teens.\n\nIts electric SUV business also gained traction, with a 30.1% revenue market share. M&M plans five major product launches by June 2027, including a vehicle on its new NU_IQ platform and an all-new electric SUV. It is expanding monthly production capacity to 82,000 vehicles by the end of FY27, from about 68,000 currently, to address demand that continues to exceed supply.\n\nFarm equipment revenue increased 1% in Q2, remaining a drag. Tractor volumes declined 6%, partly due to the festive calendar shift and weak rainfall in Maharashtra and Karnataka.\n\nThe management consequently revised its FY27 domestic tractor industry growth outlook to flattish, from its earlier expectation of about 5% growth.", "source": "LiveMint Markets", "pub_date_str": "06 Nov 2026, 12:12 PM IST", "pub_date_relative": "1h ago"}, {"title": "Keralam Holiday Calendar 2027: Government Releases Full List Of Public Holidays", "full_content": "According to the notification, Central government offices in Kerala will observe 17 public holidays while employees will also have 48 restricted holidays to choose from.", "source": "NDTV Profit", "pub_date_str": "06 Nov 2026, 12:10 PM IST", "pub_date_relative": "1h ago"}, {"title": "Mumbai's Air Quality Worsens, Yet BMC Moves To Concretise Another 311 km Of Roads", "full_content": "The tender call follows warnings over Mumbai's air. Two weeks ago, the Bombay High Court described the haze over the city as an \"emergency situation\" and asked state authorities what they were doing to tackle it.", "source": "NDTV Profit", "pub_date_str": "06 Nov 2026, 12:06 PM IST", "pub_date_relative": "1h ago"}, {"title": "The sell-off gets deep", "full_content": "But not broad, yet", "source": "FT Markets", "pub_date_str": "06 Nov 2026, 12:00 PM IST", "pub_date_relative": "1h ago"}, {"title": "Spot Fake Deals And OTP Traps: NPCI's Top Safety Tips For Festive Shoppers", "full_content": "The National Payments Corporation of India (NPCI) has stepped up its efforts to alert consumers to the risks associated with digital payments.", "source": "NDTV Profit", "pub_date_str": "06 Nov 2026, 11:52 AM IST", "pub_date_relative": "1h ago"}, {"title": "India\u2019s new wealth rituals: What are millennials and Gen Z buying on Dhanteras?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a India\u2019s new wealth rituals: What are millennials and Gen Z buying on Dhanteras? The Economic Times daily newspaper is available online now. Read Today's Paper India\u2019s new wealth rituals: What are millennials and Gen Z buying on Dhanteras? SECTIONS India\u2019s new wealth rituals: What are millennials and Gen Z buying on Dhanteras? By Minal Thukral , ET CONTRIBUTORS Last Updated: Nov 06, 2026, 11:51:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Dhanteras investing is evolving from physical gold purchases toward diversified digital portfolios. Younger investors are embracing gold ETFs, mutual funds, Bitcoin and tokenised assets while retaining the festival\u2019s core goal of building wealth and financial security patiently.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "06 Nov 2026, 11:51 AM IST", "pub_date_relative": "1h ago"}, {"title": "Pensioners Must Submit Life Certificate By November 30: What Happens If You Miss The Deadline?", "full_content": "Missing the November 30 deadline to submit your Jeevan Pramaan (Digital Life Certificate) can affect your monthly pension payments from December.", "source": "NDTV Profit", "pub_date_str": "06 Nov 2026, 11:50 AM IST", "pub_date_relative": "1h ago"}, {"title": "30,000 Counterfeit Gold Flake Cigarettes Seized In Delhi, Probe Underway", "full_content": "The seizure comes as the police intensify operations against the illegal distribution of fake tobacco products in the area.", "source": "NDTV Profit", "pub_date_str": "06 Nov 2026, 11:47 AM IST", "pub_date_relative": "1h ago"}, {"title": "Delhi Air Pollution: Capital Inches Towards 'Severe' AQI Ahead Of Diwali", "full_content": "Delhi's air quality worsened to an AQI of 391, nearing severe levels, with 30 out of 59 stations reporting severe pollution on Friday.", "source": "NDTV Profit", "pub_date_str": "06 Nov 2026, 11:44 AM IST", "pub_date_relative": "1h ago"}, {"title": "Fractal Analytics, PhysicsWallah, And More Q2 Review: Check PL Captial's Target Prices, Ratings", "full_content": "Among these updates, Samhi Hotels stands out with the highest projected upside of over 34%, supported by robust demand in the hospitality segment, followed closely by Fractal Analytics at 26.8% upside as its AI product business scales rapidly.", "source": "NDTV Profit", "pub_date_str": "06 Nov 2026, 11:40 AM IST", "pub_date_relative": "1h ago"}, {"title": "Gold ETFs performance on Dhanteras 2026 today 6 Nov 2026: Check how Nippon India, Tata Gold, ICICI Prudential fared", "full_content": "null Vaamanaa Sethi Published 6 Nov 2026, 11:39 AM IST Prefer Livemint on Google Dhanteras 2026 : Gold Exchange Traded Funds (ETFs) witnessed selling pressure on Friday, November 6, as investors booked profits in gold-backed investment products despite the auspicious occasion of Dhanteras 2026. Gold ETFs, including Nippon India ETF Gold BeES , Tata Gold ETF and ICICI Prudential Gold ETF , declined by up to 2.3% during the trading session.\n\nThe weakness in gold ETFs came amid a decline in international gold prices, as a rebound in crude oil prices revived inflation concerns and raised expectations that US interest rates could remain elevated for longer. A stronger US dollar also weighed on the yellow metal, limiting its appeal among investors.\n\nGold ETFs across fund houses witnessed selling pressure on Friday, with several schemes declining between 1.5% and 2.3%.\n\nAccording to data available on Groww, ICICI Prudential Gold ETF was among the biggest laggards, falling 2.28% to \u20b9 119.79. Nippon India ETF Gold BeES declined 2.12% to \u20b9 115.65, while Tata Gold Exchange Traded Fund slipped 1.87% to \u20b9 13.63.\n\nOther gold ETFs, including SBI Gold ETF, HDFC Gold ETF, Kotak Gold ETF and DSP Gold ETF, also traded lower.\n\nThe decline in gold ETFs is closely linked to movements in domestic and international bullion prices. Since gold ETFs track the price of physical gold, any correction in the underlying metal generally reflects in their market prices.\n\nInternational gold prices slipped on Friday, November 6, as rising crude oil prices renewed inflation concerns and strengthened expectations of higher interest rates in the US.\n\nAccording to Reuters, spot gold declined 0.6% to $4,063.39 per ounce on Friday. The yellow metal's decline came after a strong recovery earlier in the week, supported by a weaker US dollar and falling US Treasury yields following the US midterm election outcome.", "source": "LiveMint Markets", "pub_date_str": "06 Nov 2026, 11:39 AM IST", "pub_date_relative": "1h ago"}, {"title": "Beyond gold: What $340 billion in crypto flows says about India's investment preferences this Dhanteras", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Beyond gold: What $340 billion in crypto flows says about India's investment preferences this Dhanteras The Economic Times daily newspaper is available online now. Read Today's Paper Beyond gold: What $340 billion in crypto flows says about India's investment preferences this Dhanteras SECTIONS Beyond gold: What $340 billion in crypto flows says about India's investment preferences this Dhanteras By Prateek Gupta , ET CONTRIBUTORS Last Updated: Nov 06, 2026, 11:37:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Gold remains central to Indian household savings, but high prices are pushing investors toward ETFs and digital gold instead of physical holdings. Crypto is emerging as a separate portfolio option rather than replacing gold, reflecting a broader shift toward digital ownership and diversification.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "06 Nov 2026, 11:37 AM IST", "pub_date_relative": "1h ago"}, {"title": "India as an AI hedge? The country's stocks could see robust inflows as markets globally tank", "full_content": "The Indian stock market is emerging as an attractive hedge as investors seek refuge from a brutal sell-off in the artificial intelligence trade, making it a strong contender for global capital.\n\nAs sentiment around AI sours, foreign investors, who have been underweight on the Indian market for nearly two years due to high valuations, subdued earnings growth and lack of local AI tech champions, could start returning.\n\n\"If these foreign long only investor groups were to neutralize their underweight in Indian equities, this could translate into potential net inflows of around $115 billion,\" Rajiv Batra, head of Asia and co-head of global emerging markets equity strategy at JPMorgan, told CNBC.\n\nHe said that multiple factors are currently stacked in favor of the country, such as falling global oil prices, a drop in U.S. Treasury yields, a recovery in earnings growth of Indian companies and unwinding of global AI trade.\n\n\"India has emerged as an 'AI hedge' for portfolios trimming or diversifying out of crowded AI trades,\" Batra said.\n\nOver the last month, the country's benchmark Nifty 50 has gained nearly 9%, outperforming global markets with heavy AI exposure, including the U.S., Japan, South Korea and Taiwan that are deep in the red as investors ditch tech names.\n\nOn Friday, as major Asian markets tracked a sell-off on Wall Street overnight, India's benchmark indexes bucked the trend to trade higher. That divergence becomes stark as Japan's Nikkei 225 and Taiwan's Taiex entered bear territory, while South Korea's Kospi deepened its bear market and the tech-heavy Nasdaq Composite entered into correction territory overnight.\n\n\"India has been dubbed sort of the anti-AI trade, and our view there is that the underlying economic fundamentals have actually been better,\" Timothy Moe, chief Asia-Pacific equity strategist and co-head of Asia macro research at Goldman Sachs, told CNBC's \" Squawk Box Asia \" on Friday.", "source": "CNBC Top News", "pub_date_str": "06 Nov 2026, 11:32 AM IST", "pub_date_relative": "2h ago"}, {"title": "Ark Invest wants to bring some \u2018disruptive innovation\u2019 to interval funds", "full_content": "Tokenised, exchange-traded interval funds with venture capital exposure and hedge fund-level fees. What could go wrong?", "source": "FT Markets", "pub_date_str": "06 Nov 2026, 11:30 AM IST", "pub_date_relative": "2h ago"}, {"title": "Asian Stocks Brace for Selloff as AI Rout Deepens: Markets Wrap - Bloomberg.com", "full_content": "Asian Stocks Brace for Selloff as AI Rout Deepens: Markets Wrap Bloomberg.com Global stocks tumble as AI panic grips markets after Democrats\u2019 midterm success \u2013 business live The Guardian Asian markets follow US rout as AI investment jitters spread CNN Paraguay President Pe\u00f1a under investigation, faces removal from office over bank collapse AP News Nasdaq sell-off batters Asian chip stocks as SK Hynix, Samsung, Softbank, TSMC tumble CNBC", "source": "Google News Business", "pub_date_str": "06 Nov 2026, 11:27 AM IST", "pub_date_relative": "2h ago"}, {"title": "Dhanteras 2026 gold buying race: 10 cities in India where yellow metal is a religion \u2013 Is your city on the list?", "full_content": "Gold buying is deeply woven into India's festive traditions, particularly during Dhanteras and Diwali, when households purchase jewellery, coins, and other precious-metal items as symbols of prosperity and good fortune.\n\nFrom Chennai and Kochi in the south to Kolkata in the east and Jaipur in the north, several cities have established gold markets and strong jewellery-buying cultures. However, this year\u2019s Dhanteras buying comes amid volatile gold prices. On 6 November, gold is currently priced at \u20b9 1,42,390 per 10 grams, down \u20b9 2,070, or 1.43%, as of 10:50 am, according to Bullions.co.in .\n\nIn its November 2026 report, the World Gold Council (WGC) mentioned that domestic gold prices were around 45% higher year-on-year in the third quarter (July-September 2026). This weighed on jewellery demand, which fell 20% year-on-year to 100 tonnes, its weakest third-quarter level since 2020.\n\nAccording to search data from local search platform Justdial , reported by 7Globe , searches for gold jewellery increased 46% in India between November 2025 and October 2026 compared with the corresponding period a year earlier. Here are 10 Indian cities with established gold-buying traditions and jewellery markets.\n\nChennai's T. Nagar and NSC Bose Road are prominent jewellery shopping destinations. Traditional 22-carat jewellery, temple designs, and wedding purchases contribute to the city's gold-buying culture. Gold jewellery searches increased 36% during the November 2025 and October 2026 period tracked by Justdial.\n\nLaad Bazaar, Begum Bazaar and Basheerbagh are among Hyderabad's established jewellery markets. Traditional ornaments and wedding jewellery remain important purchases. Gold jewellery searches increased by 54%.\n\nBroadway and MG Road are important shopping destinations in Kochi.", "source": "LiveMint Money", "pub_date_str": "06 Nov 2026, 11:24 AM IST", "pub_date_relative": "2h ago"}, {"title": "Dhanteras 2026: Best time to buy gold, silver in Kochi, Thrissur; latest purchase rate today- Shopping Shubh Muhurat", "full_content": "The nation is celebrating Dhanteras today, Friday, 6 November. This is a special day that presents an auspicious occasion and opportunity for households in Kerala to purchase gold, silver jewellery, coins and utensils.\n\nPurchasing gold during this auspicious period is considered an important tradition during \u2018Dhantrayodashi \u2019; hence, buyers of the yellow metal in Kochi and Thrissur should check the latest prices, auspicious muhurat and shopping timing details before visiting jewellery stores.\n\nAccording to details on the MyPanchang website, a prominent platform that provides city-specific information and Panchang calculations by Panchangkarta, the Dhanteras Pradosh Kaal with Sthira Lagna in Kochi is from 6:35:44 PM to 8:27:33 PM. In Thrissur, the corresponding period is from 6:35:01 PM to 8:27:14 PM.\n\nHere are the favourable shopping windows for Kochi on 6 November, according to city-specific Choghadiya calculations, as provided on the Apna Panchang platform .\n\nThese shopping windows are separate from the evening Lakshmi-Kuber Puja. Timings can vary slightly across Panchang calculations; hence, cross-checking with legitimate sources is advised.\n\nGold prices in both cities are around \u20b9 13,386 per gram for 22-carat jewellery, according to the 6 November rate updates on BankBazaar . The table below shows the price comparison.\n\nNote: These are indicative rates only. They may change during the day. Jewellery buyers should also account for making charges, other associated expenses, wastage and 3% GST while calculating the final bill.\n\nBuyers should compare jewellery prices, check hallmarking details and metal purity before making any investment or purchase.", "source": "LiveMint Money", "pub_date_str": "06 Nov 2026, 11:23 AM IST", "pub_date_relative": "2h ago"}], "cfa": [{"title": "Stock futures mixed after Nasdaq correction; Japan's Nikkei 225 enters bear market: Live updates", "full_content": "Stock futures were mixed early Friday after a punishing sell-off in artificial intelligence stocks that sent the Nasdaq into correction territory. Traders also awaited a key payrolls report.\n\nFutures tied to the Dow Jones Industrial Average slumped 1.3%. S&P 500 futures were down 0.35%, while Nasdaq-100 futures inched 0.3% higher, clawing back a fraction of heavy losses suffered on Thursday.\n\nIn Asia, South Korea led losses in the region, with the Kospi plunging more than 6%. Japan's Nikkei 225 dropped 5.9%, falling into bear market territory. Australia's S&P/ASX 200 slipped 0.9%. Hong Kong's Hang Seng Index fell 1%, and mainland China's CSI 300 declined 1.47%.\n\nThe moves follow a bout of heavy selling during Thursday's regular Wall Street session that saw the three major averages post their worst one-day performances since April 2025. The Nasdaq Composite tanked 5.5%, closing more than 10% below its most recent high and landing in correction territory. The broad-market S&P 500 lost 4.4%, while the Dow fell more than 1,800 points, or 3.4%.\n\nWhile all 11 sectors of the S&P 500 closed with losses, shares of companies tied to the AI build-out suffered keenly. Democrats' big wins in the House and Senate, as well as key governorships in states like Texas, sparked traders' worries of a potential slowdown in data center construction.\n\nMicron Technology and Advanced Micro Devices plummeted 17% each, while neocloud CoreWeave slid 10%. Even the Magnificent Seven weren't spared, as Nvidia dropped 9%, turning negative for 2026, and the cohort of tech juggernauts shed more than $1 trillion in aggregate market cap.\n\nThe three major averages are poised for losses on the week, with the Nasdaq down 4.4% and the S&P 500 off almost 3% in the period. The 30-stock Dow is the relative outperformer of the three, off just 0.5% week to date.\n\nThe pullback creates a buying opportunity, Victoria Greene, CIO at G Squared Private Wealth told CNBC Thursday.", "source": "CNBC Top News", "pub_date_str": "06 Nov 2026, 01:28 PM IST", "pub_date_relative": "4m ago", "cfa_topics": ["Equity Investments", "Derivatives"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Titan shines 3% on Dhanteras 2026 after 2x profit; Noel Tata's exit news from board adds to spotlight - Outlook, target", "full_content": "Sharmila Bhadoria Published 6 Nov 2026, 01:23 PM IST Prefer Livemint on Google Titan Stock: Shares of Titan Company Limited surged during Friday\u2019s trading session as its net profit more than doubled during the second quarter of financial year 2026-27. The sharp uptick in profit came as robust demand for higher-margin studded jewellery supported growth. Additionally, Noel Tata has announced his retirement as Vice Chairman and Director of Titan Company.\n\nTitan share price surged more than 3% to touch an intraday of \u20b9 5001.90 per share on Friday, Dhanteras. Here are all the details to know.\n\nNoel N Tata, Chairman of Tata Trusts, has announced his exit from Titan Company Board. He will retire as Director and VC of the leading jewellery and watchmaker Titan Company from November 12, 2026.\n\n\"We wish to inform you that, in accordance with the Tata Group Governance Guidelines, Noel N. Tata will retire from the office of Non- Executive, Non-Independent Director and Vice Chairman of the Company, with effect from 12th November 2026,\" Titan said in a regulatory filing.\n\nThe retirement of sixty nine-year old Noel Tata came as per the mandatory guidelines of the Companies Act 2013. The act mandates that any MD or Whole Time Director cannot be appointed or continue in employment if they are 70 years of age or older.\n\nIndia\u2019s leading branded jewellery and watch maker reported a twofold jump in its consolidated net profit to \u20b9 2,393 crore in the September quarter of FY27. Titan Company\u2019s net profit stood at \u20b9 1,120 crore in the same quarter of previous financial year.\n\nThe sharp jump in Titan net profit was due to \u20b9 671 crore accounting gain arising from a fair-value change in the NCI put-option liability associated with Damas acquisition.", "source": "LiveMint Markets", "pub_date_str": "06 Nov 2026, 01:23 PM IST", "pub_date_relative": "9m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "BOJ to hike in December, seek terminal rate of 2%, says ex-central bank top economist", "full_content": "", "source": "Investing.com News", "pub_date_str": "06 Nov 2026, 01:18 PM IST", "pub_date_relative": "14m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Rightmove raises 2026 EPS growth forecast to \"at least 7%\"", "full_content": "", "source": "Investing.com News", "pub_date_str": "06 Nov 2026, 01:15 PM IST", "pub_date_relative": "17m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Monzo explores fundraising at \u00a37.5bn valuation as private equity talks stall", "full_content": "Lender had shifted focus to talks with buyout groups after failing to clinch a \u00a310bn takeover by Brazilian fintech Nubank", "source": "FT Markets", "pub_date_str": "06 Nov 2026, 01:14 PM IST", "pub_date_relative": "18m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Alternative Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Goldman lowers year-end gold price forecast on hawkish Fed shift", "full_content": "", "source": "Investing.com News", "pub_date_str": "06 Nov 2026, 01:14 PM IST", "pub_date_relative": "18m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Markets fret over growth and inflation, just as tech rout gains speed", "full_content": "", "source": "Investing.com News", "pub_date_str": "06 Nov 2026, 01:06 PM IST", "pub_date_relative": "26m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Diwali, Dhanteras shopping by credit card: 5 simple ways to keep your expenses under control this festive season - List", "full_content": "Diwali and Dhanteras often bring lucrative discounts, cashback offers and special deals on a wide range of products and services, both online and offline. For such lucrative deals, it is a given that credit cards make festive shopping comfortable and convenient.\n\nThe benefits and the ease of use of these credit tools can encourage unnecessary spending and leave cardholders with difficult-to-manage bills after the festive season ends.\n\nHere are five practical ways that help an individual keep their credit card expenses under control.\n\nBefore you start spending, decide how much you can comfortably spend on items such as clothes, electronics, gold purchases, gifts for friends and family and household items. Generally, the festive shopping budget should come from available savings and monthly surplus. Such spending should not be funded by a fresh loan or piling up more credit card debt.\n\nA 20% discount or lucrative cashback offer on any product or service does not mean \u2018saving\u2019 money.\n\nPurchases should only be initiated after comparing prices across platforms, checking the final payable amount, and avoiding buying additional items primarily to qualify for more discounts, offers or reward points.\n\nWhile using your credit card during the festive season, another way to keep a tab on excessive expenses is to track your credit card utilisation.\n\nA high credit utilisation ratio over extended periods can adversely affect your overall credit profile and credit score. Keep the credit utilisation ratio below 30% of the total available credit limit. This means that if your credit card limit is \u20b9 1,00,000, then ensure that not more than \u20b9 25,000-30,000 of this limit is used.", "source": "LiveMint Money", "pub_date_str": "06 Nov 2026, 01:05 PM IST", "pub_date_relative": "27m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Diwali Muhurat Trading 2026, Samvat 2083: Date, timings, history, settlement rules, more - Top 10 things for investors", "full_content": "MCX BSE Pranati Deva Published 6 Nov 2026, 01:02 PM IST Prefer Livemint on Google Muhurat Trading 2026 : Every year, on the auspicious occasion of Diwali, the Indian stock exchanges open especially for one hour for a special trading session in the evening. This special hour of trading is known as 'muhurat trading'. The word Muhurat itself stands for \u2018auspicious\u2019.\n\nThis year, the Indian stock market will open for a special trading session on Sunday, November 8, as BSE , the National Stock Exchange (NSE) and commodity exchange MCX continue the long-standing tradition of Diwali Muhurat Trading.\n\nMarking the beginning of Samvat 2083, or the new Hindu financial year, the one-hour session holds special significance for investors and traders who consider it an auspicious occasion to begin the year with a symbolic investment.\n\nAlthough trading volumes are generally lower than on regular market days, the session attracts participation from investors looking to honour the tradition of buying stocks during Lakshmi Puja.\n\nMuhurat Trading will take place on Sunday, November 8, coinciding with Diwali and Lakshmi Puja. The session will mark the beginning of Samvat 2083.\n\nThe main equity Muhurat Trading session will run from 2:20 pm to 3:30 pm. Unlike regular trading days, when markets operate from 9:15 am to 3:30 pm, this will be a special one-hour session.\n\nThe pre-open session will start at 2:05 pm. Investors can place limit and market orders until 2:10 pm, while only limit orders will be accepted between 2:10 pm and 2:15 pm. Order matching and confirmation will take place from 2:15 pm to 2:17 pm, followed by a buffer period until 2:20 pm.\n\nMCX will conduct its special session from 2:05 pm to 2:19 pm, followed by the main trading session from 2:20 pm to 3:30 pm. Contracts across all commodities and indices will be available for trading.", "source": "LiveMint Markets", "pub_date_str": "06 Nov 2026, 01:02 PM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "The 'World's Best Airline' is updating its business and first-class experience", "full_content": "Singapore Airlines is rolling out new onboard seating, dining and entertainment options as part of an over S$2 billion ($1.6 billion) investment to keep up with rivals from around the world.\n\nThe cornerstone of this investment: new premium cabin seats for its long-haul flights, which will progressively debut on the Airbus A350 long-haul and ultra-long-range planes in mid-2027.\n\nFirst-class seats will come with 32-inch 4K high-definition screens, Bang and Olufsen noise-cancelling headphones and options for passengers to book double bed and face-to-face dining configurations.\n\nSeating in business class will come outfitted with 22-inch 4K screens, wireless charging and Bluetooth audio connectivity.\n\nThese retrofits to the A350 aircraft also come as SIA grapples with a long-running delay to the delivery of new Boeing 777-9 planes, which were slated to come in 2021 and now faces an uncertain date as to when it will take delivery of the aircraft.\n\nThese products will also debut with the 777-9 aircraft when they come into service with SIA.\n\nMinor refreshes will be added to other classes, such as an extra inch of reclining space in premium economy cabins, and new upholstery in economy class. Both will also come with new 4K seatback entertainment monitors, but the new features for economy and premium economy seats will only be on the incoming 777-9 aircraft.\n\nSpeaking at a media briefing on Nov 4, SIA Chief Commercial officer Lee Lik Hsin said that the decision to bring the products to the A350 was due to the delays with the 777-9.", "source": "CNBC Top News", "pub_date_str": "06 Nov 2026, 01:02 PM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Tanishq, Malabar Gold rate today Dhanteras 6 Nov: Latest price; Kolkata, Hyderabad, Mumbai, Chennai, Nagpur, Ahmedabad", "full_content": "Gold prices at Tanishq and Malabar Gold are worth checking before making a purchase on Dhanteras 2026, as households across India head to jewellery stores to buy gold and silver on the auspicious occasion.\n\nOn Friday, November 6, Tanishq's 22-karat gold rate stood at \u20b9 1,31,900 per 10 grams, down \u20b9 2,450, or 1.82%, from the previous day's rate of \u20b9 1,34,350.\n\nAt Malabar Gold, the 22-karat gold rate was \u20b9 13,150 per gram, while 24-karat gold was priced at \u20b9 14,345 per gram on November 6.\n\nBoth jewellery brands follow a uniform base gold pricing policy across their showrooms in India. This means customers in cities such as Kolkata, Hyderabad, Mumbai, Chennai, Nagpur and Ahmedabad can refer to the same daily base rate announced by the respective brands.\n\nAccording to Tanishq's official website, the 22-karat gold price on November 6 was \u20b9 13,190 per gram, or \u20b9 1,31,900 for 10 grams.\n\nThe rate declined from \u20b9 13,435 per gram on November 5, marking a fall of \u20b9 245 per gram.\n\nTanishq follows a uniform daily base gold rate for standard purities such as 22-karat and 18-karat across its national network. Therefore, its base rate does not significantly differ between cities.\n\nMalabar Gold's 22-karat gold rate stood at \u20b9 13,150 per gram on November 6. The company's 24-karat gold rate was \u20b9 14,345 per gram.", "source": "LiveMint Money", "pub_date_str": "06 Nov 2026, 01:00 PM IST", "pub_date_relative": "32m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Equinix points to smaller facilities as scrutiny of U.S. data center construction grows", "full_content": "Equinix says its smaller data centers could be less exposed to potential U.S. construction restrictions as regulators scrutinize the rapid buildout of artificial intelligence infrastructure.\n\nThe company's facilities typically range from 30 to 60 megawatts, compared with the roughly 100-megawatt threshold that Cyrus Adaggra, Equinix's Asia-Pacific president, said is generally targeted by U.S. proposals.\n\n\"We will invest in markets where we see customer demand, and because we have a footprint that is typically less than 100 megawatts, we tend not to fall and be caught by the legislation or the regulation, which is typically at about 100 megawatts in the U.S.,\" Adaggra told CNBC's \" Squawk Box Asia. \"\n\nHis comments come as the U.S. midterm election results have heightened concerns that new restrictions on data center development could delay projects and raise construction costs.\n\nAbout 53% of projected growth in the U.S. hyperscaler development pipeline is concentrated in states where newly elected governors could impose restrictions on data center construction, according to a Wednesday report from BMI, a Fitch Solutions company.\n\nThe firm said any impact would likely become more apparent from 2028, as most projects planned for 2027 are already committed.\n\nEquinix has increased capital spending from about $2 billion a few years ago to $7 billion, driven by growing customer demand, Adaggra said.\n\n\"The number one determinant of our capex spend and build is customer demand,\" he said.", "source": "CNBC Top News", "pub_date_str": "06 Nov 2026, 12:53 PM IST", "pub_date_relative": "39m ago", "cfa_topics": ["Corporate Issuers", "Alternative Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "How US Midterm Election Results, AI sell-off impacted US stock market, Nikkei 225, Kospi, Taiwan and China; data details", "full_content": "US Midterm Election Results | AI stocks fall: After the humiliating defeat of Donald Trump's Republican Party in the US Midterm Elections 2026, a massive sell-off was triggered in AI and semiconductor stocks across global markets. In the US stock market, flagship AI and semiconductor stocks NVIDIA, AMD, and Micron shares crashed by up to 17%, wiping out $2.50 trillion in wealth from Wall Street, a BBC report claims. The sell-off in AI and semiconductor stocks was not limited to the US market. AI and semiconductor stocks listed on the Japanese Nikkei 225, South Korea's KOSPI, Taiwan's Taiex, China's CSI 300, and Hong Kong's Hang Seng Index witnessed heavy losses after the Democratic Party's sweeping victory in the US Midterm Elections.\n\nAfter the announcement of US Midterm Election Results 2026, the tech-heavy Nasdaq Composite index crashed over 5.50% and finished at 24,315 on Thursday. The Dow Jones Industrial Average crashed by close to 3.50% and finished at 51,523, while the S&P 500 index nosedived by4.36%. Other US stock indices also witnessed heavy losses, wiping out around $2.50 trillion of wealth from Wall Street, which saw its worst day since 2025.\n\nAI poster boy NVIDIA share price opened lower at $196.07 per share and finished at $181.60 per share, logging an intraday loss of 9.26% against Wednesday's close of $200.13 per share.\n\nShares of Advanced Micro Devices, or AMD, opened lower at $452.50 per share and ended at $404.40 apiece, recording an intraday loss of 17.26%.\n\nLikewise, Micron Technology Inc. shares saw strong selling pressure throughout Thursday's session and ended 17.46% lower at $656.39 per share.\n\nAsian stocks are also under heavy selling pressure for the last two straight sessions. The Japanese Nikkei 225 index has fallen from 62,188 to 57,269, recording a 7.90% loss after the announcement of the US Midterm Election Results.", "source": "LiveMint Markets", "pub_date_str": "06 Nov 2026, 12:45 PM IST", "pub_date_relative": "46m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "NSE Market Cap Crosses $50 Billion As Stock Price Jumps Over 3%", "full_content": "At today's highest price, the market capitalization of recently-listed NSE surpassed $50 billion, or Rs 4.84 lakh crore, making it the seventh biggest listed company, surpassing the giants like Infosys, Hindustan Unilever, LIC and ITC.", "source": "NDTV Profit", "pub_date_str": "06 Nov 2026, 12:41 PM IST", "pub_date_relative": "51m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Rupee falls 9 paise to 94.50 against US dollar in early trade", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Forex \u203a Rupee falls 9 paise to 94.50 against US dollar in early trade The Economic Times daily newspaper is available online now. Read Today's Paper Rupee falls 9 paise to 94.50 against US dollar in early trade SECTIONS Rupee falls 9 paise to 94.50 against US dollar in early trade PTI Last Updated: Nov 06, 2026, 12:34:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis In early trading on Friday, the rupee slipped by 9 paise to reach 94.50 against the US dollar, driven by a robust dollar and surging crude oil prices. After a brief bounce-back, it peaked at 94.36. The domestic equity market exhibited mixed performance, with Sensex rising yet Nifty falling. Notably, Foreign Institutional Investors remained active, purchasing substantial equities, bolstering market optimism.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "06 Nov 2026, 12:34 PM IST", "pub_date_relative": "58m ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Stock Market Today LIVE: Sensex Reclaims 80,000, Nifty 50 Above 24,700; M&M, Titan Lead Rally", "full_content": "Stock Market Today LIVE: Among sectors, Nifty IT, Nifty Pharma and Nifty Private Bank led the rally, while losses were seen in Nifty Metal, Nifty Realty, Nifty Auto, Nifty Media and Nifty PSU Bank indices.", "source": "NDTV Profit", "pub_date_str": "06 Nov 2026, 12:34 PM IST", "pub_date_relative": "58m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "India bonds emerge as top Asian performers as oil, Treasury yields decline", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Bonds \u203a India bonds emerge as top Asian performers as oil, Treasury yields decline CSB Bank Share Price YES Bank Share Price Karur Vysya Bank Share Price Bandhan Bank Share Price City Union Bank Share Price Powered By The Economic Times daily newspaper is available online now. Read Today's Paper India bonds emerge as top Asian performers as oil, Treasury yields decline SECTIONS India bonds emerge as top Asian performers as oil, Treasury yields decline Reuters Last Updated: Nov 06, 2026, 12:33:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis This week, Indian government bonds saw a positive trend following a Democratic win in the U.S. midterm elections. The reduction in oil prices and Treasury yields eased rupee pressure, boosting investor confidence. The benchmark bond yield improved significantly, declining by approximately 22 basis points. Furthermore, the surge in foreign investments into Indian bonds marked a notable high since July, leading to enhanced overall market sentiment.\n\nThis week, Indian government bonds saw a positive trend following a Democratic win in the U.S. midterm elections. The reduction in oil prices and Treasury yields eased rupee pressure, boosting investor confidence. The benchmark bond yield improved significantly, declining by approximately 22 basis points. Furthermore, the surge in foreign investments into Indian bonds marked a notable high since July, leading to enhanced overall market sentiment.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "06 Nov 2026, 12:33 PM IST", "pub_date_relative": "59m ago", "cfa_topics": ["Equity Investments", "Fixed Income", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Dhanteras 2026: Gold price soars over 360%! \u20b930,000 investment in gold 10 years ago is \u20b91.41 lakh today", "full_content": "Dhanteras 2026 : Dhanteras has always held a special place in the hearts of Indian consumers, as gold and silver purchases are deeply rooted in tradition, prosperity, and the sentiment of auspicious beginnings. For many, buying precious metals on this occasion goes beyond an investment decision; it is an emotional purchase associated with shagun, good fortune and the hope of prosperity for the family.\n\nGold has turned out to be a powerful wealth creator for investors who bought the precious metal on Dhanteras a decade ago and stayed invested. An investment of around \u20b9 29,989 per 10 grams on Dhanteras 2016 would be worth approximately \u20b9 1,41,444 today, representing 4.6 times growth.\n\nThe impressive returns underline gold's appeal not just as a traditional festive purchase but also as a long-term investment, even through periods of price corrections and volatility.\n\nHowever, in today's deals, MCX gold price declined around 2% to \u20b9 1,41,444 per 10 grams.\n\nMCX gold rose from \u20b9 29,989 per 10 grams on October 28, 2016, to \u20b9 1,41,444 today, November 6. This represents an absolute return of 362%, or a 4.6-fold increase. However, in today's deals, MCX gold price declined around 2% to \u20b9 1,41,444 per 10 grams.\n\nMeanwhile, International gold prices on COMEX, meanwhile, increased from $1,269.20 per ounce in 2016 to $4,076 in November 2026, delivering an absolute return of 221.1%, a CAGR of 12.30% and an annualised return of 14%.\n\nGold prices did not move upwards in a straight line. The metal experienced intermittent corrections, including a 5.6% decline in 2021, but resumed its upward trajectory in subsequent years. The rally became particularly strong in 2024 and 2025, when domestic prices jumped 30.6% and 61.5%, respectively.\n\nThe divergence between domestic and international returns also highlights the impact of currency movements and import-related costs on Indian gold prices.", "source": "LiveMint Markets", "pub_date_str": "06 Nov 2026, 12:15 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments", "Portfolio Management"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Q2 Results Live: Vardhman Textiles Profit Jumps 91%; Anup Engineering Profit Plunges 79%; Siemens, Hindalco, Voltas Also In Focus", "full_content": "Siemens, Bosch, 3M India, Hindalco, Voltas and KIOCL are among the 223 companies scheduled to announce their Q2 results today. Track the latest earnings announcements, financial performance, management commentary and stock market reaction live on NDTV Profit.", "source": "NDTV Profit", "pub_date_str": "06 Nov 2026, 12:14 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "M&M in top gear even as margin compression, weak tractor sales woes linger", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nMahindra and Mahindra investors chose to overlook profitability concerns and a downward revision in the FY27 guidance for the tractor industry. Instead, they seem to have drawn comfort from the company\u2019s robust September quarter (Q2FY27) results and upward revision in the light commercial vehicle (LCV) industry guidance to double-digits from a high-single digit.\n\nReacting to its Q2 earnings announced on Thursday, the stock rallied 10% over the past two trading sessions.\n\nStandalone revenue rose 26% year-on-year to \u20b9 42,477 crore, beating consensus estimates by almost 8%. The automotive business, which manufactures a range of passenger and commercial vehicles, electric vehicles and mobility products, was the largest contributor, with revenue rising 36%.\n\nThis was aided by a 26% increase in SUV volumes to 183,000 units. Mahindra retained its leadership in the SUV segment, with a revenue market share of 24.3% and has maintained its FY27 SUV volume guidance at the mid-to-high teens.\n\nIts electric SUV business also gained traction, with a 30.1% revenue market share. M&M plans five major product launches by June 2027, including a vehicle on its new NU_IQ platform and an all-new electric SUV. It is expanding monthly production capacity to 82,000 vehicles by the end of FY27, from about 68,000 currently, to address demand that continues to exceed supply.\n\nFarm equipment revenue increased 1% in Q2, remaining a drag. Tractor volumes declined 6%, partly due to the festive calendar shift and weak rainfall in Maharashtra and Karnataka.\n\nThe management consequently revised its FY27 domestic tractor industry growth outlook to flattish, from its earlier expectation of about 5% growth.", "source": "LiveMint Markets", "pub_date_str": "06 Nov 2026, 12:12 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "India\u2019s new wealth rituals: What are millennials and Gen Z buying on Dhanteras?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a India\u2019s new wealth rituals: What are millennials and Gen Z buying on Dhanteras? The Economic Times daily newspaper is available online now. Read Today's Paper India\u2019s new wealth rituals: What are millennials and Gen Z buying on Dhanteras? SECTIONS India\u2019s new wealth rituals: What are millennials and Gen Z buying on Dhanteras? By Minal Thukral , ET CONTRIBUTORS Last Updated: Nov 06, 2026, 11:51:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Dhanteras investing is evolving from physical gold purchases toward diversified digital portfolios. Younger investors are embracing gold ETFs, mutual funds, Bitcoin and tokenised assets while retaining the festival\u2019s core goal of building wealth and financial security patiently.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegr
