    const allData = {"general": [{"title": "Should you add equal-weight funds to your portfolio?", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nThe Nifty 50\u2014India's headline stock market index\u2014is down about 5% over the past 12 months and about 2% over the last six months. Yet a set of equal-weight index funds and exchange-traded funds (ETFs) have done better in the recent period.\n\nFor instance, an equal-weight fund tracking the Nifty 500 Equal Weight index returned about 15% over six months (as of 9 September 2026), funds tracking the Nifty 100 Equal Weight index returned around 7%, and the Nifty 50 Equal Weight-based funds are up about 2.7% over the same period.\n\nEqual weight simply assigns the same weight to every stock in an index, instead of weighting by market capitalization. In a Nifty 50 Equal Weight index, for instance, each of the 50 stocks carries an equal 2% weight, reset back to equal every quarter\u2014so no single stock or sector can dominate the way it can in the market-cap-weighted Nifty 50.\n\nEqual weighting can also change the characteristics of an index. For example, the Nifty 500 Equal Weight index has 50% exposure to small-cap, 30% to mid-cap and 20% to large-caps as a result of the equal-weighting, while the parent Nifty 500 index carries close to 70% exposure to large-caps, with just 10% in small-caps and 20% in mid-caps.\n\nThese strategies have also grown gradually. Investor assets in equal-weight index funds and ETFs have seen a 10x jump\u2014from about \u20b9 140 crore at the end of 2020 to over \u20b9 10,500 crore by December 2025. Several of these funds are new, but they track indices that have long historical data. Below is a look at how these strategies have performed over the long run\u2014and whether you should invest.\n\nOver rolling seven-year periods, these equal-weight indices have delivered average annualized returns of roughly 12-14%, and none posted a negative return over any seven-year window. The analysis is based on seven-year returns rolled daily between 11 September 2006 and 10 September 2026.", "source": "LiveMint Money", "pub_date_str": "15 Sep 2026, 01:08 PM IST", "pub_date_relative": "2m ago"}, {"title": "The Fed may be on the verge of a serious mistake, prominent economists warn", "full_content": "Some economists are calling on the central bank to wait before raising interest rates, out of concern the economy may be vulnerable beneath the surface.", "source": "MarketWatch Top Stories", "pub_date_str": "15 Sep 2026, 12:59 PM IST", "pub_date_relative": "12m ago"}, {"title": "Europe shares slip as banks drag, oil-driven inflation fears weigh", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Sep 2026, 12:54 PM IST", "pub_date_relative": "16m ago"}, {"title": "BHP Port Hedland workers to seek arbitration over wage deal dispute", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Sep 2026, 12:54 PM IST", "pub_date_relative": "16m ago"}, {"title": "Oil extends gains, Brent crude nears $108 following Houthi strikes on Saudi Arabia", "full_content": "Oil extended gains Tuesday, amid reports of fresh Houthi strikes on Saudi Arabia and attacks by Iran on ships in the Gulf.\n\nFutures for international benchmark Brent crude for November delivery gained 1.93% to $107.72 per barrel as of 3:10 a.m. ET. U.S. West Texas Intermediate futures for October advanced 1.88% at $103.30 per barrel.\n\nBrent Saudi Arabia closed its critical East-West pipeline that bypasses the Strait of Hormuz, after drones launched from Iraq damaged it, exacerbating oil supply disruptions at a time when the market is already tight.\n\nAl Jazeera reported that the Saudi-led coalition in Yemen says 13 civilians were injured on Monday, after Houthi forces launched a wave of ballistic missile and drone attacks into Saudi Arabia.\n\nMeanwhile, Iran's military said it destroyed an advanced American drone over the Strait of Hormuz, following a series of operations by Tehran against U.S. unmanned naval systems in the Gulf. U.S. President Donald Trump said Sunday that the U.S. could continue its campaign against Iran and take control of its oil.\n\nU.S. Central Command also disputed a claim by Iran's Islamic Revolutionary Guard Corps that Panama-flagged oil tanker El Gaia struck a naval mine in the Strait of Hormuz.\n\n\"The Panama-flagged oil tanker El Gaia was struck by an Iranian missile last month and rendered inoperable,\" CENTCOM said. \"The IRGC's false claim is yet another example of their lies and intimidation attempts while they try to impede commercial vessels in the strait.\"\n\nInflation is going to pick up, given the oil pipelines are being attacked and the Saudi east west pipeline is closed, Komal Sri-Kumar, the president of Sri-Kumar Global Strategies, said on CNBC's \" Squawk Box Asia .\"", "source": "CNBC Top News", "pub_date_str": "15 Sep 2026, 12:52 PM IST", "pub_date_relative": "18m ago"}, {"title": "FTSE 100 today: Stocks slip as oil surges, AI safety rift adds to unease", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Sep 2026, 12:51 PM IST", "pub_date_relative": "19m ago"}, {"title": "Ex-Google DeepMind researcher adds to warnings that AI could \u2019kill all humans\u2019", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Sep 2026, 12:49 PM IST", "pub_date_relative": "21m ago"}, {"title": "Bank of Korea minutes show possible policy rift on back-to-back rate hikes", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Sep 2026, 12:48 PM IST", "pub_date_relative": "22m ago"}, {"title": "Everplay says 2026 results to be materially ahead of expectations; shares jump", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Sep 2026, 12:47 PM IST", "pub_date_relative": "23m ago"}, {"title": "Hexaware Technologies stock gains 5% on Project NANDA Fellowship collaboration to advance AI agents", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Hexaware Technologies stock gains 5% on Project NANDA Fellowship collaboration to advance AI agents Hexaware Technologies Share Price Mphasis Share Price L&T Technology Services Share Price Tata Technologies Share Price Tata Elxsi Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Hexaware Technologies stock gains 5% on Project NANDA Fellowship collaboration to advance AI agents SECTIONS Hexaware Technologies stock gains 5% on Project NANDA Fellowship collaboration to advance AI agents By Surbhi Khanna , ET Online Last Updated: Sep 15, 2026, 12:44:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Hexaware Technologies shares rose sharply on Tuesday after the company partnered with Project NANDA Fellowship, a global programme focused on developing open-source infrastructure for AI agents. The three-month fellowship will bring together developers, including Hexaware engineers, to work on agent discovery, identity and secure coordination within an open, decentralised Internet of AI Agents.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets .", "source": "Economic Times Markets", "pub_date_str": "15 Sep 2026, 12:44 PM IST", "pub_date_relative": "26m ago"}, {"title": "How much debt should you hold? More debt can cushion market falls, but there is a trade-off", "full_content": "For investors building a long-term portfolio , the question is not just how much return they can earn, but also how much loss they can tolerate when markets fall. A portfolio with a higher allocation to debt can reduce the impact of an equity market correction, but the protection comes at a cost. Over the long term, a larger debt allocation can also lower the portfolio\u2019s return.\n\nA FundsIndia analysis of historical rolling returns illustrates this trade-off by comparing portfolios with different combinations of equity, debt and gold. The analysis uses Nifty 50 TRI for Indian equity, S&P 500 total returns for US equity, gold returns and a basket of low-duration and corporate bond funds for debt. The portfolios were rebalanced annually when the allocation moved beyond a 5% band.\n\nFundsIndia compared portfolios with 70%, 50% and 30% equity, with the rest allocated to debt. The results show a clear pattern. As the debt allocation increased, the portfolio's worst historical fall became smaller, but its average return also declined.\n\nThe first portfolio had 70% in equity and 30% in debt. Across the rolling seven-year periods studied, it delivered an average annualised return of 13.8%. However, its maximum drawdown, or the biggest fall from a previous peak, was 40%.\n\nWhen the debt allocation increased to 50%, the average return fell to 12.5%. At the same time, the maximum drawdown reduced to 27%.\n\nWith 70% debt and 30% equity, the average return fell further to 10.7%, but the maximum drawdown was only 14%.\n\nIn simple terms, an investor choosing more equity historically got greater return potential, but also had to be prepared for bigger falls. Increasing debt reduced the extent of those falls, but also reduced the return potential.\n\nFundsIndia's report makes the same point, noting that higher debt exposure lowers portfolio declines during market falls but also lowers long-term returns.", "source": "LiveMint Money", "pub_date_str": "15 Sep 2026, 12:43 PM IST", "pub_date_relative": "27m ago"}, {"title": "Ten-year Treasury yield hits highest since 2007", "full_content": "Benchmark 10-year hits 5.03% as investors continue to sell government debt in expectations of Fed rate increase", "source": "FT Markets", "pub_date_str": "15 Sep 2026, 12:42 PM IST", "pub_date_relative": "28m ago"}, {"title": "AI-led digital tech stock Kelton Tech Solutions around 7% | Do you own?", "full_content": "AI-led digital tech stock Kellton Tech Solutions rose around 7% in intra-day deals on Tuesday, 15 September, after the firm was chosen to build an enterprise loan integration platform for a leading automotive finance company.\n\nThe stock climbed as much as 6.75% to \u20b9 14.69 per share on the BSE after opening at \u20b9 13.92. It had closed at \u20b9 13.76 on Friday, while the Indian stock markets remained shut on Monday on account of Ganesh Chaturthi.\n\nMeanwhile, Indian equities remained under pressure today as elevated crude oil prices , weak global sentiment and concerns over global bond yields ahead of this week's Federal Reserve meeting weighed on the broader market.\n\nAccording to the company's press release, the platform will serve as an integration foundation for the lender, connecting its origination, customer management, credit assessment and servicing systems with external verification and financial data providers through a single governed layer.\n\nThe system will support applicant verification, credit assessment, eligibility decisioning and customer-record synchronisation, while reducing integration complexity across the lending ecosystem.\n\nKellton said the platform has been designed as a reusable framework, rather than a fixed set of connections. This would allow the automotive finance company to add new providers, channels and product lines onto the same foundation as its business expands. The platform is also designed with security, auditability and transaction integrity requirements for a regulated environment.\n\nThe engagement is expected to strengthen Kellton's credentials in financial services, lending technology, enterprise integration, platform engineering and AI-ready modernisation.", "source": "LiveMint Markets", "pub_date_str": "15 Sep 2026, 12:42 PM IST", "pub_date_relative": "28m ago"}, {"title": "Silver tests $63.08 Fibonacci support in bearish slide: Live", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Sep 2026, 12:42 PM IST", "pub_date_relative": "28m ago"}, {"title": "Hang Seng clings above support after bearish engulfing: Live", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Sep 2026, 12:41 PM IST", "pub_date_relative": "29m ago"}, {"title": "Gold clings to $4,320 support amid bearish momentum: Live levels", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Sep 2026, 12:41 PM IST", "pub_date_relative": "29m ago"}, {"title": "Asian stocks slip as AI rebound fades, banks and chips face fresh pressure", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Sep 2026, 12:41 PM IST", "pub_date_relative": "29m ago"}, {"title": "China\u2019s AI listings glut drags Hong Kong stocks lower", "full_content": "Disparity between equity issuance and overall performance highlights weak global demand for Chinese stocks", "source": "FT Markets", "pub_date_str": "15 Sep 2026, 12:40 PM IST", "pub_date_relative": "30m ago"}, {"title": "10-year Treasury yield rises to highest since 2007 as Fed rate-hike expectations rise", "full_content": "The benchmark 10-year Treasury yield climbed to its highest level since 2007 on Tuesday as a sell-off in U.S. government debt deepened ahead of the Federal Reserve's interest-rate decision.\n\nThe 10-year yield jumped more than 6 basis points to 5.025% as of 1.10 a.m. ET. On Monday, the 10-year yield had briefly crossed 5% , before sliding a little.\n\nOne basis point equals 0.01 percentage point, and yields and prices move in opposite directions.\n\nYields on the U.S. 10-year Treasury since the start of the year The yield on the longer-dated 30-year Treasury bond , more sensitive to geopolitical risks, was up over 5 basis points at 5.384%. The 2-year Treasury note yield climbed about 4 basis points to 4.68%\n\nThe move comes ahead of the Federal Reserve's two-day policy meeting beginning Tuesday, with markets pricing in higher chances of a quarter-point rate hike after August inflation remained well above the central bank's 2% target.\n\nTraders are pricing in a more than 92% chance that the Fed will raise rates by 25 basis points in its latest meeting, according to the CME FedWatch tool .\n\n\"U.S. 10-year treasuries are highly sensitive to inflation expectations, and with inflation gauges still above the Fed's target of 2%, we believe this tight correlation will likely persist for a while,\" said Jonathan Liang, Standard Chartered's CIO of fixed income and FX.\n\nThe tight relationship between oil and Treasurys could add further upward pressure on yields if crude prices remain elevated, as higher energy costs feed into inflation expectations, said experts told CNBC.", "source": "CNBC Top News", "pub_date_str": "15 Sep 2026, 12:37 PM IST", "pub_date_relative": "33m ago"}, {"title": "Stock futures are little changed as traders eye rising oil prices and rates: Live updates - CNBC", "full_content": "Stock futures are little changed as traders eye rising oil prices and rates: Live updates CNBC CNBC Daily Open: A 'hoax,' a sell-off and a dilemma for Warsh CNBC 10-year Treasury yield hits 5%, critical threshold for US economy and markets CNN Bonds slump as US 10-year Treasury yields hit highest since 2007 Reuters Asian Stocks to Fall on AI, Key US Yield Tops 5%: Markets Wrap Bloomberg.com", "source": "Google News Business", "pub_date_str": "15 Sep 2026, 12:36 PM IST", "pub_date_relative": "34m ago"}], "cfa": [{"title": "Should you add equal-weight funds to your portfolio?", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nThe Nifty 50\u2014India's headline stock market index\u2014is down about 5% over the past 12 months and about 2% over the last six months. Yet a set of equal-weight index funds and exchange-traded funds (ETFs) have done better in the recent period.\n\nFor instance, an equal-weight fund tracking the Nifty 500 Equal Weight index returned about 15% over six months (as of 9 September 2026), funds tracking the Nifty 100 Equal Weight index returned around 7%, and the Nifty 50 Equal Weight-based funds are up about 2.7% over the same period.\n\nEqual weight simply assigns the same weight to every stock in an index, instead of weighting by market capitalization. In a Nifty 50 Equal Weight index, for instance, each of the 50 stocks carries an equal 2% weight, reset back to equal every quarter\u2014so no single stock or sector can dominate the way it can in the market-cap-weighted Nifty 50.\n\nEqual weighting can also change the characteristics of an index. For example, the Nifty 500 Equal Weight index has 50% exposure to small-cap, 30% to mid-cap and 20% to large-caps as a result of the equal-weighting, while the parent Nifty 500 index carries close to 70% exposure to large-caps, with just 10% in small-caps and 20% in mid-caps.\n\nThese strategies have also grown gradually. Investor assets in equal-weight index funds and ETFs have seen a 10x jump\u2014from about \u20b9 140 crore at the end of 2020 to over \u20b9 10,500 crore by December 2025. Several of these funds are new, but they track indices that have long historical data. Below is a look at how these strategies have performed over the long run\u2014and whether you should invest.\n\nOver rolling seven-year periods, these equal-weight indices have delivered average annualized returns of roughly 12-14%, and none posted a negative return over any seven-year window. The analysis is based on seven-year returns rolled daily between 11 September 2006 and 10 September 2026.", "source": "LiveMint Money", "pub_date_str": "15 Sep 2026, 01:08 PM IST", "pub_date_relative": "2m ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "The Fed may be on the verge of a serious mistake, prominent economists warn", "full_content": "Some economists are calling on the central bank to wait before raising interest rates, out of concern the economy may be vulnerable beneath the surface.", "source": "MarketWatch Top Stories", "pub_date_str": "15 Sep 2026, 12:59 PM IST", "pub_date_relative": "12m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Europe shares slip as banks drag, oil-driven inflation fears weigh", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Sep 2026, 12:54 PM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Oil extends gains, Brent crude nears $108 following Houthi strikes on Saudi Arabia", "full_content": "Oil extended gains Tuesday, amid reports of fresh Houthi strikes on Saudi Arabia and attacks by Iran on ships in the Gulf.\n\nFutures for international benchmark Brent crude for November delivery gained 1.93% to $107.72 per barrel as of 3:10 a.m. ET. U.S. West Texas Intermediate futures for October advanced 1.88% at $103.30 per barrel.\n\nBrent Saudi Arabia closed its critical East-West pipeline that bypasses the Strait of Hormuz, after drones launched from Iraq damaged it, exacerbating oil supply disruptions at a time when the market is already tight.\n\nAl Jazeera reported that the Saudi-led coalition in Yemen says 13 civilians were injured on Monday, after Houthi forces launched a wave of ballistic missile and drone attacks into Saudi Arabia.\n\nMeanwhile, Iran's military said it destroyed an advanced American drone over the Strait of Hormuz, following a series of operations by Tehran against U.S. unmanned naval systems in the Gulf. U.S. President Donald Trump said Sunday that the U.S. could continue its campaign against Iran and take control of its oil.\n\nU.S. Central Command also disputed a claim by Iran's Islamic Revolutionary Guard Corps that Panama-flagged oil tanker El Gaia struck a naval mine in the Strait of Hormuz.\n\n\"The Panama-flagged oil tanker El Gaia was struck by an Iranian missile last month and rendered inoperable,\" CENTCOM said. \"The IRGC's false claim is yet another example of their lies and intimidation attempts while they try to impede commercial vessels in the strait.\"\n\nInflation is going to pick up, given the oil pipelines are being attacked and the Saudi east west pipeline is closed, Komal Sri-Kumar, the president of Sri-Kumar Global Strategies, said on CNBC's \" Squawk Box Asia .\"", "source": "CNBC Top News", "pub_date_str": "15 Sep 2026, 12:52 PM IST", "pub_date_relative": "18m ago", "cfa_topics": ["Economics", "Derivatives", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "FTSE 100 today: Stocks slip as oil surges, AI safety rift adds to unease", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Sep 2026, 12:51 PM IST", "pub_date_relative": "19m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Hexaware Technologies stock gains 5% on Project NANDA Fellowship collaboration to advance AI agents", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Hexaware Technologies stock gains 5% on Project NANDA Fellowship collaboration to advance AI agents Hexaware Technologies Share Price Mphasis Share Price L&T Technology Services Share Price Tata Technologies Share Price Tata Elxsi Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Hexaware Technologies stock gains 5% on Project NANDA Fellowship collaboration to advance AI agents SECTIONS Hexaware Technologies stock gains 5% on Project NANDA Fellowship collaboration to advance AI agents By Surbhi Khanna , ET Online Last Updated: Sep 15, 2026, 12:44:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Hexaware Technologies shares rose sharply on Tuesday after the company partnered with Project NANDA Fellowship, a global programme focused on developing open-source infrastructure for AI agents. The three-month fellowship will bring together developers, including Hexaware engineers, to work on agent discovery, identity and secure coordination within an open, decentralised Internet of AI Agents.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets .", "source": "Economic Times Markets", "pub_date_str": "15 Sep 2026, 12:44 PM IST", "pub_date_relative": "26m ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "How much debt should you hold? More debt can cushion market falls, but there is a trade-off", "full_content": "For investors building a long-term portfolio , the question is not just how much return they can earn, but also how much loss they can tolerate when markets fall. A portfolio with a higher allocation to debt can reduce the impact of an equity market correction, but the protection comes at a cost. Over the long term, a larger debt allocation can also lower the portfolio\u2019s return.\n\nA FundsIndia analysis of historical rolling returns illustrates this trade-off by comparing portfolios with different combinations of equity, debt and gold. The analysis uses Nifty 50 TRI for Indian equity, S&P 500 total returns for US equity, gold returns and a basket of low-duration and corporate bond funds for debt. The portfolios were rebalanced annually when the allocation moved beyond a 5% band.\n\nFundsIndia compared portfolios with 70%, 50% and 30% equity, with the rest allocated to debt. The results show a clear pattern. As the debt allocation increased, the portfolio's worst historical fall became smaller, but its average return also declined.\n\nThe first portfolio had 70% in equity and 30% in debt. Across the rolling seven-year periods studied, it delivered an average annualised return of 13.8%. However, its maximum drawdown, or the biggest fall from a previous peak, was 40%.\n\nWhen the debt allocation increased to 50%, the average return fell to 12.5%. At the same time, the maximum drawdown reduced to 27%.\n\nWith 70% debt and 30% equity, the average return fell further to 10.7%, but the maximum drawdown was only 14%.\n\nIn simple terms, an investor choosing more equity historically got greater return potential, but also had to be prepared for bigger falls. Increasing debt reduced the extent of those falls, but also reduced the return potential.\n\nFundsIndia's report makes the same point, noting that higher debt exposure lowers portfolio declines during market falls but also lowers long-term returns.", "source": "LiveMint Money", "pub_date_str": "15 Sep 2026, 12:43 PM IST", "pub_date_relative": "27m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Fixed Income", "Alternative Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Ten-year Treasury yield hits highest since 2007", "full_content": "Benchmark 10-year hits 5.03% as investors continue to sell government debt in expectations of Fed rate increase", "source": "FT Markets", "pub_date_str": "15 Sep 2026, 12:42 PM IST", "pub_date_relative": "28m ago", "cfa_topics": ["Fixed Income", "Portfolio Management"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "AI-led digital tech stock Kelton Tech Solutions around 7% | Do you own?", "full_content": "AI-led digital tech stock Kellton Tech Solutions rose around 7% in intra-day deals on Tuesday, 15 September, after the firm was chosen to build an enterprise loan integration platform for a leading automotive finance company.\n\nThe stock climbed as much as 6.75% to \u20b9 14.69 per share on the BSE after opening at \u20b9 13.92. It had closed at \u20b9 13.76 on Friday, while the Indian stock markets remained shut on Monday on account of Ganesh Chaturthi.\n\nMeanwhile, Indian equities remained under pressure today as elevated crude oil prices , weak global sentiment and concerns over global bond yields ahead of this week's Federal Reserve meeting weighed on the broader market.\n\nAccording to the company's press release, the platform will serve as an integration foundation for the lender, connecting its origination, customer management, credit assessment and servicing systems with external verification and financial data providers through a single governed layer.\n\nThe system will support applicant verification, credit assessment, eligibility decisioning and customer-record synchronisation, while reducing integration complexity across the lending ecosystem.\n\nKellton said the platform has been designed as a reusable framework, rather than a fixed set of connections. This would allow the automotive finance company to add new providers, channels and product lines onto the same foundation as its business expands. The platform is also designed with security, auditability and transaction integrity requirements for a regulated environment.\n\nThe engagement is expected to strengthen Kellton's credentials in financial services, lending technology, enterprise integration, platform engineering and AI-ready modernisation.", "source": "LiveMint Markets", "pub_date_str": "15 Sep 2026, 12:42 PM IST", "pub_date_relative": "28m ago", "cfa_topics": ["Equity Investments", "Fixed Income", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Silver tests $63.08 Fibonacci support in bearish slide: Live", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Sep 2026, 12:42 PM IST", "pub_date_relative": "28m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Hang Seng clings above support after bearish engulfing: Live", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Sep 2026, 12:41 PM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Gold clings to $4,320 support amid bearish momentum: Live levels", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Sep 2026, 12:41 PM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "10-year Treasury yield rises to highest since 2007 as Fed rate-hike expectations rise", "full_content": "The benchmark 10-year Treasury yield climbed to its highest level since 2007 on Tuesday as a sell-off in U.S. government debt deepened ahead of the Federal Reserve's interest-rate decision.\n\nThe 10-year yield jumped more than 6 basis points to 5.025% as of 1.10 a.m. ET. On Monday, the 10-year yield had briefly crossed 5% , before sliding a little.\n\nOne basis point equals 0.01 percentage point, and yields and prices move in opposite directions.\n\nYields on the U.S. 10-year Treasury since the start of the year The yield on the longer-dated 30-year Treasury bond , more sensitive to geopolitical risks, was up over 5 basis points at 5.384%. The 2-year Treasury note yield climbed about 4 basis points to 4.68%\n\nThe move comes ahead of the Federal Reserve's two-day policy meeting beginning Tuesday, with markets pricing in higher chances of a quarter-point rate hike after August inflation remained well above the central bank's 2% target.\n\nTraders are pricing in a more than 92% chance that the Fed will raise rates by 25 basis points in its latest meeting, according to the CME FedWatch tool .\n\n\"U.S. 10-year treasuries are highly sensitive to inflation expectations, and with inflation gauges still above the Fed's target of 2%, we believe this tight correlation will likely persist for a while,\" said Jonathan Liang, Standard Chartered's CIO of fixed income and FX.\n\nThe tight relationship between oil and Treasurys could add further upward pressure on yields if crude prices remain elevated, as higher energy costs feed into inflation expectations, said experts told CNBC.", "source": "CNBC Top News", "pub_date_str": "15 Sep 2026, 12:37 PM IST", "pub_date_relative": "33m ago", "cfa_topics": ["Quantitative Methods", "Economics", "Fixed Income", "Portfolio Management"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "Stock futures are little changed as traders eye rising oil prices and rates: Live updates - CNBC", "full_content": "Stock futures are little changed as traders eye rising oil prices and rates: Live updates CNBC CNBC Daily Open: A 'hoax,' a sell-off and a dilemma for Warsh CNBC 10-year Treasury yield hits 5%, critical threshold for US economy and markets CNN Bonds slump as US 10-year Treasury yields hit highest since 2007 Reuters Asian Stocks to Fall on AI, Key US Yield Tops 5%: Markets Wrap Bloomberg.com", "source": "Google News Business", "pub_date_str": "15 Sep 2026, 12:36 PM IST", "pub_date_relative": "34m ago", "cfa_topics": ["Fixed Income", "Derivatives"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "U.S. seeks to seize $61 million of crypto it claims are proceeds from Iranian petroleum sales to Chinese buyers", "full_content": "The U.S. has filed a civil forfeiture complaint against $61 million in cryptocurrency that it alleges proceeds from black-market sales of sanctioned Iranian crude oil and petroleum products. The complaint, brought by the U.S. Attorney's Office for the Southern District of New York, alleged Tehran used a network of cryptocurrency actors in China and elsewhere to launder more than $1.5 billion in illicit oil money intended to benefit the Iranian military and the Islamic Revolutionary Guard Corps. These proceeds were intended to finance the Iranian government and military components. \"Today we are seizing and seeking to forfeit more than $61 million of the Government of Iran's money, which otherwise would have promoted hostile military action and terrorist attacks against the U.S. and our allies,\" Deputy U.S. Attorney Sean S. Buckley said in a statement. Two Chinese companies, named Blessed Trust and Hexa Whale, allegedly used trading accounts at the Binance crypto exchange \"to launder the proceeds of black-market sales of Iranian oil, funneling the illicit funds to the Government of Iran, its agents, and/or its proxies, where they were used to finance terrorist and other activities of the Iranian government,\" the statement said.\n\n\"Binance has zero tolerance for sanctions violations or illicit activity, and Binance did not permit any transactions with sanctioned individuals,\" a Binance spokesperson said. \"We will continue to cooperate with law enforcement on this matter, and where sanctions or illicit-finance risk is identified, we will always investigate, restrict or freeze accounts where appropriate, offboard users, and report to relevant authorities.\" Blessed Trust represents itself as a wealth management or virtual asset custodial services firm, the complaint said, but it had received and transferred the proceeds and provided \"on-ramp\" services, which allow users to exchange fiat currency for cryptocurrencies.", "source": "CNBC Top News", "pub_date_str": "15 Sep 2026, 12:35 PM IST", "pub_date_relative": "35m ago", "cfa_topics": ["Alternative Investments", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "India's middle-income trap has a problem money may fix", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a India's middle-income trap has a problem money may fix The Economic Times daily newspaper is available online now. Read Today's Paper India's middle-income trap has a problem money may fix SECTIONS India's middle-income trap has a problem money may fix By PTI Last Updated: Sep 15, 2026, 12:30:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Economist Thomas Piketty says India can escape the middle-income trap through massive investment in education, healthcare and infrastructure, while deeper global cooperation is needed for inclusive growth. He warns that climate change, rather than artificial intelligence, could become the real geopolitical battleground, urging India to reduce its material footprint and support sustainable development and greater global economic justice.\n\nFour rules made HDFC Bank a compounder. All four have stopped. Can the new CEO rewrite them?\n\nGold rush on Dalal St as regional jewellers bid to be the next Tanishq\n\nHormuz is a state, not a strait. There are 10 other possible chokepoints for the global economy, including India\n\nBigger or Better: One order from Power Grid Corp added $1 billion to the market cap of a company \u2013 Final part\n\nBanks have received a flood of money. Now comes the real test\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "15 Sep 2026, 12:30 PM IST", "pub_date_relative": "40m ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Zensar Technologies share price jumps over 13% amid stock market rally. Do you own?", "full_content": "Midcap IT stock Zensar Technologies jumped over 13% on NSE in Tuesday's trading session amid strong buying interest in the IT stocks and stock market rally.\n\nZensar Technologies share price opened at \u20b9 430 apiece today, as compared to previous close of \u20b9 425.25 on Friday last week. The IT stock surged as much as 13%, hitting an intraday high of \u20b9 479.90 on 15 September.\n\nMeanwhile, benchmark indices Sensex and Nifty opened higher on Tuesday, supported by a strong buying interest in IT stocks. The 30-share BSE Sensex gained 233.66 points to trade at 75,022.37 in early deals, while the 50-share NSE Nifty rose 63.85 points to 23,462.30.\n\nAccording to experts, IT stocks are witnessing a rise amid growing concerns over a slowdown in AI-driven growth across global markets. They believe that the AI slowdown could prove positive for Indian IT and technology stocks, which may continue to remain in focus and attract bullish interest until concerns over the slowdown ease.\n\nExplaining the sharp rise in IT stocks, Amit Goel, Chief Global Strategist at PACE 360, said that IT and technology stocks had faced significant selling pressure during the global frenzy around AI stocks. However, with the AI-driven rally losing some momentum and growing concerns over a potential slowdown in the sector, these beaten-down stocks are once again drawing investor interest.\n\nGoel added that IT stocks are currently available at relatively attractive valuations, having been among the biggest casualties during sharp sell-offs in the Indian equity market in recent years.\n\nMeanwhile, Seema Srivastava, Senior Research Analyst at SMC Global Securities, said that IT stocks are witnessing a \u201cdouble bonanza\u201d as the broader market is also showing a positive trend in early trade.", "source": "LiveMint Markets", "pub_date_str": "15 Sep 2026, 12:28 PM IST", "pub_date_relative": "42m ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "ICICI Securities says buy this NBFC stock, sees 59% upside after an 80% jump in 6 months - Check target price", "full_content": "Brokerage firm ICICI Securities has initiated coverage on a non-banking financial company (NBFC) stock with a \"buy\" recommendation, anticipating a solid upside of as much as 59%.\n\nThe NBFC stock, Aye Finance , which has delivered a solid return of more than 80% in the last six months, appears to be ready for a further rally due to a formidable presence in India\u2019s mass-affluent lending market, according to the brokerage firm.\n\nAye Finance shares have surged 82% over the last six months, according to BSE data. It hit a 52-week high of \u20b9 197.95 on 21 July after hitting a 52-week low of \u20b9 88.40 on 2 April this year.\n\nIn intraday trade on Tuesday, 15 September, the stock jumped more than 5%, despite stock market volatility.\n\nICICI Securities recommends buying the stock now despite its steep gains in the recent past. The brokerage firm has set the stock's target price at \u20b9 285, valuing it at 2 times FY28E P/BV.\n\nThe current target price implies an upside potential of almost 59% from its previous session close of \u20b9 179.65 on the BSE.\n\nICICI Securities underscored that Aye is gradually emerging from an asset quality (AQ) cycle and has demonstrated a steady improvement in core earnings in recent quarters.\n\n\"Credit cost has consistently declined from 5% in FY26 to sub-4% in Q1FY27. Spread expanded to 11.6% by June 2026, up from 10.9% in June 2025, supported by a reduction of more than 45 basis points in the cost of funds (CoF), alongside an incremental CoF of 10.2% (book cost of 10.8%), which could further support spreads. Driven by enhanced operating efficiency, overall RoE improved to 16% by Q4FY26, from nearly 9\u201310% in the past seven quarters,\" said the brokerage firm.", "source": "LiveMint Markets", "pub_date_str": "15 Sep 2026, 12:26 PM IST", "pub_date_relative": "44m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "NSE IPO set to open on September 17; GMP signals 11% listing gain", "full_content": "Home ETPrime Markets Market Data Masterclass ontent": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Bond market turmoil puts Fed Rate decision under spotlight Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Bond market turmoil puts Fed Rate decision under spotlight SECTIONS Bond market turmoil puts Fed Rate decision under spotlight By Anupam Nagar , ETMarkets.com Last Updated: Sep 15, 2026, 12:21:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis A global bond market selloff has put the Federal Reserve\u2019s rate decision under the spotlight, with investors weighing the risks of another hike against a pause. Persistent inflation, rising oil prices, fiscal deficits and elevated Treasury yields have heightened concerns over the term premium and the outlook for long-term borrowing costs.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "15 Sep 2026, 12:21 PM IST", "pub_date_relative": "49m ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affec         document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>

</body>
</html>
