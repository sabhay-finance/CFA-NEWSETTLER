are Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "22 Oct 2026, 10:46 AM IST", "pub_date_relative": "56m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Lumpy Jio IPO inflows push rupee into \u2018overbought\u2019 zone just as oil renews rise", "full_content": "The Indian rupee nudged higher on Thursday, into a technically \u201coverbought\u201d zone, as chunky foreign inflows for Jio Platforms IPO added to tailwinds from recent regulatory measures that propped up the local currency .\n\nThe IPO-linked inflows helped the rupee gain to 94.35 per dollar, from its previous close at 94.46, despite higher oil prices. Brent crude rose nearly 2% to $110.6 per barrel on worries over hostilities in the Middle East after the United States ordered some diplomats to leave its missions in Saudi Arabia.\n\nThe currency is now on course for an eight-day streak of gains, having recovered from near record-low levels hit earlier in the month. Strong foreign portfolio flows drawn by the $3.2 billion record Jio IPO, have helped extend its rebound, with the public issue being fully subscribed within hours of opening for bids.\n\nThe sharp recovery has brought the rupee-dollar pair's 14-day relative strength index, a gauge of momentum, to nearly 74. A reading above 70 indicates the pair is overbought while below 30 signals it is oversold. The momentum has shifted sharply over the last two weeks, from 9 October, when the relative strength index had declined to about 27.\n\nThe rupee has also been supported by market expectations that Reserve Bank of India will deliver more rate hikes soon , after raising interest rates for the first time in nearly four years earlier this month. Minutes of the RBI's October policy meeting released after market hours on Wednesday signalled that policymakers reckon further tightening is necessary, but they also remain wary of an aggressive cycle over risks to growth.\n\n\u201cOur text-based net-hawkishness score\u2026suggests that the October MPC minutes were more hawkish than the Governor's statement (on October 7),\u201d analysts at Goldman Sachs said in a note.", "source": "LiveMint Markets", "pub_date_str": "22 Oct 2026, 10:44 AM IST", "pub_date_relative": "58m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "KEI Industries shares tumble 8% despite Q2 profit rising 29%, revenue up 39%", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a KEI Industries shares tumble 8% despite Q2 profit rising 29%, revenue up 39% KEI Industries Share Price Diamond Power Infrastructure Share Price Universal Cables Share Price Vindhya Telelinks Share Price Paramount Communications Share Price The Economic Times daily newspaper is available online now. Read Today's Paper KEI Industries shares tumble 8% despite Q2 profit rising 29%, revenue up 39% SECTIONS KEI Industries shares tumble 8% despite Q2 profit rising 29%, revenue up 39% By Ritesh Presswala , ETMarkets.com Last Updated: Oct 22, 2026, 10:41:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis KEI Industries shares fell despite strong Q2 FY27 results, with net profit rising 29% and revenue growing 39% year on year. Growth was supported by domestic wires and cables demand, higher dealer sales and improved profitability in the first half.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "22 Oct 2026, 10:41 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "M&M Financial Services shares crash 10% after Q2 results. What are Nomura and other analysts saying?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a M&M Financial Services shares crash 10% after Q2 results. What are Nomura and other analysts saying? The Economic Times daily newspaper is available online now. Read Today's Paper M&M Financial Services shares crash 10% after Q2 results. What are Nomura and other analysts saying? SECTIONS M&M Financial Services shares crash 10% after Q2 results. What are Nomura and other analysts saying? By Veer Sharma , ETMarkets.com Last Updated: Oct 22, 2026, 10:34:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Mahindra & Mahindra Financial Services shares fell sharply on despite a 55% year-on-year rise in Q2FY27 net profit to Rs 882 crore. Nomura lowered its target price to Rs 400 while retaining a Buy rating, citing asset quality concerns and rising funding costs. Motilal Oswal maintained its Buy rating.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "22 Oct 2026, 10:34 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Reliance Industries share price: Jio IPO gets blockbuster response, but stock near 52-week low; what should you do?", "full_content": "Reliance share price : Reliance Industries shares declined around 1.5% on Thursday, October 22, even as Mukesh Ambani -led Jio Platforms' initial public offering (IPO) drew strong investor demand. The stock's decline came amid weakness in the broader market. Both Sensex and Nifty fell over 0.5% each.\n\nJio Platforms' \u20b9 30,213-crore IPO was fully subscribed within approximately 100 minutes of opening on Wednesday, October 21, making it the fastest among India's mega IPOs to achieve full subscription.\n\nThe stock has remained under pressure over the past year, with technical indicators pointing to crucial support levels. Meanwhile, market experts differ in their assessment of the recovery prospects, making the stock's next move an important watch for investors.\n\nReliance Industries shares fell around 1.5% to an intraday low of \u20b9 1,190 apiece on the BSE. The stock is now approximately 26% below its 52-week high of \u20b9 1,611.20, recorded in January 2026. Meanwhile, it is now just over 3% away from its 52-week low of \u20b9 1,152.30 on October 13.\n\nThe stock has declined 4% over the past month, 7% in three months and 12% in six months. Its losses have exceeded 18% over the past year, highlighting the sustained pressure on the shares despite the attention surrounding the Jio Platforms IPO.\n\nReliance Industries shares have remained under pressure despite the strong response to Jio Platforms' IPO, leaving investors weighing the stock's recovery potential against continued technical weakness\n\nMonarch Networth Capital has recommended accumulating Reliance Industries shares in the \u20b9 1,180\u20131,220 range, with a target of \u20b9 1,350\u20131,450 over the next three to four months. The brokerage has advised a stop loss below \u20b9 1,100 on a closing basis.\n\nAccording to Monarch Networth Capital, the stock had rallied towards \u20b9 1,600\u20131,620 before entering a multi-month correction.", "source": "LiveMint Markets", "pub_date_str": "22 Oct 2026, 10:29 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Aditya Birla Sun Life AMC Q2 Review: MOFSL Raises Target Price After Inline Numbers; Buy, Sell Or Hold?", "full_content": "Continued improvement in flows and market share recovery remain key earnings drivers, adds the brokerage.", "source": "NDTV Profit", "pub_date_str": "22 Oct 2026, 10:21 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "PC Jeweller shares jump 9% after Q2 results, Aditya Kumar Halwasiya\u2019s bulk deal in focus | What investors should know", "full_content": "PC Jeweller shares jumped nearly 9% on Thursday, 22 October, following the company's strong Q2 FY27 results and amid investor attention on bulk deal transactions in the stock.\n\nPC Jeweller Ltd reported a 58% year-on-year jump in consolidated net profit to \u20b9 330.66 crore for the September quarter of FY27, supported by higher sales. The company had posted a net profit of \u20b9 209.54 crore in the corresponding quarter last year.\n\nTotal income rose 28% year-on-year to \u20b9 1,054.47 crore in Q2 FY27 from \u20b9 825.25 crore a year earlier, according to the company's regulatory filing. Total expenses increased to \u20b9 759.42 crore from \u20b9 688.85 crore in the year-ago period.\n\nA key milestone during the quarter was the company's return to debt-free status after it repaid outstanding dues to all 14 consortium banks ahead of schedule. PC Jeweller said the resulting reduction in interest costs, expected to become more significant from the second half of FY27, should support its profitability.\n\nThe company also received around \u20b9 142 crore in remittances from export debtors during the quarter following negotiations and resolution of outstanding issues. The receipts mark the beginning of recovery of long-pending export receivables, it said.\n\nLooking ahead, PC Jeweller plans to roll out up to 100 large-format showrooms across Tier I, Tier II and Tier III cities over the next 12\u201318 months. The expansion will combine company-owned outlets with an asset-light franchise model.\n\nBulk deals in PC Jeweller on 21 October saw Chairman and Managing Director of Cupid, Aditya Kumar Halwasiya, purchase 5.51 crore shares at \u20b9 18.39 apiece, amounting to approximately \u20b9 101.33 crore, as per NSE data.\n\nHRTI Private Limited bought 7.37 crore shares at \u20b9 18.44 per share, worth around \u20b9 135.99 crore, while selling 8.76 crore shares at \u20b9 18.36 apiece for \u20b9 160.81 crore.", "source": "LiveMint Markets", "pub_date_str": "22 Oct 2026, 10:12 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Defence Stocks Decline: Mazagon Dock, Garden Reach Lead Losses As Goldman Sachs Sees Earnings Pressure, Order Delays", "full_content": "Goldman Sachs initiated Sell ratings on both shipbuilders, citing weak order visibility and an expected earnings decline. It set 12-month price targets of Rs 1,855 for Mazagon Dock and Rs 1,515 for Garden Reach.", "source": "NDTV Profit", "pub_date_str": "22 Oct 2026, 10:09 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "U.S. pulls diplomats from Saudi Arabia as it reportedly readies Iran strikes after midterms", "full_content": "The U.S. ordered non-emergency government employees and their families to leave Saudi Arabia as Houthi attacks on the kingdom escalate.\n\nThe move comes as the U.S. and Israeli militaries have drawn up specific plans for renewed strikes on Iran after next month's midterm elections, according to The New York Times, citing unnamed U.S. officials.\n\nPlanning for a \"short but intensive\" operation is progressing, The Times said.\n\nThe developments point to a possible widening of the nearly eight-month war, while U.S. and Iranian negotiators continue talks on Tehran's nuclear program and the Strait of Hormuz.\n\nState Department spokesman Tommy Pigott in a post on X said the order applies only to Saudi Arabia, citing increasing attacks by Iran-aligned Houthis on civilian targets. Meanwhile, Reuters reported Washington also plans to withdraw family members from other missions in the region.\n\nA strike Wednesday on King Fahd International Airport in Dammam killed at least one person and injured eight. Two people died in a drone attack on Saudi Aramco's Shaybah oil field, the Saudi Press Agency reported, adding that operations were not affected.\n\nIn recent days, the U.S. and Israeli militaries have stepped up military exercises, including flying planes over Iraq to practice strike maneuvers, according to The New York Times. The Times also reported that Defense Secretary Pete Hegseth met Israeli Prime Minister Benjamin Netanyahu during an unannounced visit to Israel this week to discuss potential new strikes.\n\nThe renewed military strikes would likely target Iran's energy infrastructure, nuclear facilities, and missile and drone arsenal, according to The Times, noting that President Donald Trump has yet to approve the fresh strikes and has repeatedly vetoed plans for a return to major combat this year.", "source": "CNBC Top News", "pub_date_str": "22 Oct 2026, 10:05 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Stock futures fall as investors digest earnings from Meta and Tesla: Live updates", "full_content": "U.S. equity futures slid early Thursday after investors digested third-quarter earnings from Big Tech names including Meta Platforms and Tesla.\n\nS&P 500 futures fell 0.66%, and Nasdaq-100 futures dropped 1.32%. Dow Jones Industrial Average futures ticked down 0.28%, or 147 points.\n\nIn Asia, markets traded lower. South Korea's Kospi fell more than 1%, while Japan's Nikkei 225 declined 0.73%. Australia's S&P/ASX 200 lost 0.53%. Hong Kong's Hang Seng Index is down more than 2%. Mainland China's CSI 300 is down 0.37%.\n\nShares of Meta gained 2% in extended trading. The Facebook and Instagram parent delivered a revenue beat along with strong guidance for the current quarter. Meanwhile, Tesla reported a better-than-expected top and bottom line for its third-quarter results. Shares of the electric vehicle maker were last off 3%.\n\n\"The quarter showed the AI investment paying off in the core,\" said Dan Ives, partner and senior managing director at Yorkville Ives in his post Meta earnings reaction note. Spend is \"better controlled than feared,\" Ives added as Meta narrowed the range for its full-year data center-related capital expenditures.\n\nThe action follows a positive day on Wall Street, with the S&P 500 notching a three-day win streak, while the Dow jumped 360 points. The Nasdaq Composite closed 1% higher, catching a tailwind from SpaceX and Tesla .\n\nBlowout quarterly results from SpaceX fueled investors' excitement for the artificial intelligence trade, sending shares of Micron Technology and Advanced Micro Devices higher. Also fanning the flames was news from Super Micro Computer , which lifted its fiscal first-quarter revenue outlook .\n\nThere was also some focus on Nvidia's U.S. supply chain agreements Wednesday. The chip giant announced plans to expand global manufacturing capacity to meet growing demand for its accelerated computing and full-stack AI factory platform.", "source": "CNBC Top News", "pub_date_str": "22 Oct 2026, 10:03 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "'You Are A Stupid Person': Trump Snaps At ABC Reporter Over Russia Sanctions Question | Viral Video", "full_content": "The incident comes a day after Russia freed Hubbard, the second American released from Russian custody in about two months.", "source": "NDTV Profit", "pub_date_str": "22 Oct 2026, 09:59 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Your Salary Rises 10% Every Year. Should Your SIP Rise By 10% Too?", "full_content": "With time, this increment adds to your salary, which can be really helpful in improving your lifestyle and having more disposable income as well as planning your finances.", "source": "NDTV Profit", "pub_date_str": "22 Oct 2026, 09:56 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Infosys Q2 results preview: Will the results provide oomph to surging IT stocks?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a Earnings \u203a Infosys Q2 results preview: Will the results provide oomph to surging IT stocks? JM Financial Share Price Choice International Share Price IIFL Capital Services Share Price Anand Rathi Share & Stock Brokers Share Price SMC Global Securities Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Infosys Q2 results preview: Will the results provide oomph to surging IT stocks? SECTIONS Infosys Q2 results preview: Will the results provide oomph to surging IT stocks? By Akash Podishetti , ETMarkets.com Last Updated: Oct 22, 2026, 09:56:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Infosys is set to report an 11% rise in year-on-year revenues and an 8% increase in net profits. However, the company may lower its full-year revenue outlook due to declining discretionary spending and mounting pricing challenges. Analysts foresee sequential revenue growth driven by acquisitions and enhanced operating margins. The upcoming earnings report will be pivotal, offering valuable insights into client expenditures and potential recovery in demand.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "22 Oct 2026, 09:56 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Gold, silver prices today, 22 October: Check retail rates of 24K, 22K gold, 999 silver in Delhi, Mumbai and Kolkata", "full_content": "Gold and silver prices, 22 October: Gold and silver prices fell sharply in the domestic market on Thursday, extending their recent decline. The price of 24K gold dropped by 1.18% to \u20b9 1,44,650 per 10 grams, while silver prices fell by 2.29% to \u20b9 2,04,720 per kg, compared with 21 October.\n\nIn the international market, spot gold declined 1.22% to $4,090.51 per ounce, while spot silver fell 2.73% to $56.394 per ounce, indicating continued selling pressure on precious metals.\n\nInvestors are now closely watching the US Federal Reserve 's policy meeting scheduled for October 27\u201328 for clues about the future direction of interest rates. The Fed's decision will be important for bullion prices because interest rates influence the US dollar and bond yields. Higher interest rates and bond yields can make gold less attractive to investors because the metal does not generate regular interest income.\n\nIn the domestic futures market, MCX gold futures were trading 1.20% lower at \u20b9 1,44,331 per 10 grams, while MCX silver futures declined around 2.35% to \u20b9 2,04,264 per kg at approximately 9:40 am on 22 October.\n\nGold is available in different purities in the retail market, with 24-karat gold being the purest form and 22-karat gold commonly used to make jewellery due to its greater durability. Silver 999, also known as 99.9% pure silver, is a high-purity form of silver commonly used for investment purposes, including silver bars and coins.\n\nHere\u2019s a look at the latest gold and silver prices in major Indian cities on 22 October.\n\nGold prices fell 1.02% on 21 October, while they fell 1.99% over one week and 5.70% over one month. Silver prices declined 2.09% over one day, 2.92% over one week and 14.52% over one month.", "source": "LiveMint Money", "pub_date_str": "22 Oct 2026, 09:55 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income", "Derivatives", "Alternative Investments"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "GIFT City funds vs international mutual funds: Returns, minimum investment and tax compared", "full_content": "Indian investors seeking exposure to overseas equities have fewer choices among conventional international mutual funds, as several schemes are not accepting fresh investments.\n\nGIFT City funds offer an alternative to international mutual funds , many of which remain closed to fresh investments after the Reserve Bank of India (RBI) imposed a $7 billion industry-wide limit on overseas investments by domestic mutual funds. The cap has constrained fresh investments in several schemes, including those tracking the S&P 500 and Nasdaq-100.\n\nSet up in the International Financial Services Centre (IFSC) at Gujarat International Finance Tec-City, GIFT City funds operate under a separate regulatory framework and do not count towards the $7 billion limit. Here\u2019s what investors need to know.\n\nInvesting through GIFT City requires investors to remit money in foreign currency under the Liberalised Remittance Scheme (LRS). Under the RBI's LRS framework, resident individuals can remit up to $250,000 per financial year for permitted current and capital account transactions, including eligible overseas investments.\n\nWhile international mutual funds often allow investments starting at \u20b9 100 and offer SIP facilities, the minimum subscription amounts for GIFT City schemes are higher: $500 for the Parag Parikh S&P 500 and Nasdaq 100 funds and $5,000 for several other schemes.\n\nTaxation also differs. International mutual funds are taxed according to the applicable rules for specified mutual funds. For units acquired on or after April 1, 2023, gains are generally taxed at the investor's applicable income-tax slab rate.\n\nFor the GIFT City schemes, tax is levied at the fund level, with rates of 14.95% on long-term gains (holding period of more than 24 months), 42.74% on short-term gains (holding period of less than 24 months), and 35.88% on dividends. \u201cTax will be paid at the fund level on income arising to the Fund.", "source": "LiveMint Money", "pub_date_str": "22 Oct 2026, 09:52 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Hindalco Share Price: Motilal Oswal Stays Bullish On Multiple Growth Levers; Check Target Price", "full_content": "Hindalco offers strong earnings growth visibility, driven by aggressive capacity expansion, downstream integration, structural cost savings, and Novelis' operational recovery, positioning the company for a structural earnings inflection and balance sheet deleveraging, believes Motilal Oswal.", "source": "NDTV Profit", "pub_date_str": "22 Oct 2026, 09:52 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Sensex weekly expiry today prediction: Can bulls stage comeback despite crude oil shock? Key levels traders should watch", "full_content": "Stock Market Today: The Sensex and Nifty 50 opened lower on Thursday, October 22, extending their losing streak to a third consecutive session as escalating geopolitical tensions in the Middle East pushed crude oil prices higher and revived concerns over inflation. With traders also navigating global technology stock volatility, the Sensex expiry session could see heightened swings around crucial technical levels.\n\nAt 9:15 am, the Sensex fell 0.5% to 73,343.3, while the Nifty 50 declined 0.54% to 22,687.75. Brent crude futures rose 1.6% to $110.6 per barrel after attacks by Yemen's Houthis in Saudi Arabia prompted the US to order some diplomats and their families to leave its missions in the kingdom.\n\nBrent crude has surged more than 80% this year amid disruptions to Persian Gulf oil flows caused by the US-Iran war. Higher crude prices pose a significant risk to India, one of the world's largest oil importers, by potentially increasing inflationary pressures and corporate costs.\n\nAsian equities also weakened as mixed earnings from major US technology companies renewed concerns about the sustainability of artificial intelligence-related investments. South Korea's Kospi fell around 2%, while Japan's Nikkei 225 declined nearly 1%, adding to the cautious global backdrop for Indian equities.\n\nThe fall in Indian equities came on Sensex weekly expiry day, a session that can see heightened volatility as traders adjust or close their index derivatives positions. Sensex weekly expiry is the day when weekly Sensex derivatives contracts, such as futures and options, expire and are settled.\n\nAccording to V K Vijayakumar, Chief Investment Strategist at Geojit Investments Limited, the recent correction reflected a shift towards large-cap stocks after a period in which liquidity had supported valuations in mid- and small-caps.\n\n\u201cStrong external headwinds in the form of elevated crude prices and high US bond yields are emboldening bears to build short positions in the market.", "source": "LiveMint Markets", "pub_date_str": "22 Oct 2026, 09:46 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Fixed Income", "Derivatives", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Global Market: South Korean shares fall over 1% as chip stocks retreat", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Global Market: South Korean shares fall over 1% as chip stocks retreat Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market: South Korean shares fall over 1% as chip stocks retreat SECTIONS Global Market: South Korean shares fall over 1% as chip stocks retreat By Anupam Nagar , ETMarkets.com Last Updated: Oct 22, 2026, 09:45:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis South Korean shares fell as investors booked profits in semiconductor stocks after a sharp rally. Attention shifted to the Bank of Korea\u2019s policy outlook, while falling government bond yields and a marginally weaker won reflected mixed sentiment across financial markets.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "22 Oct 2026, 09:45 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Fixed Income"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "\u20b925k Cr Share Buyback: Why Shapoorji Pallonji Group wants Tata Sons to prioritise proposal at next board meeting", "full_content": "\u20b9 25k Cr Share Buyback: The Shapoorji Pallonji (SP) Group has urged Tata Sons to prioritise a proposal to buy back shares worth around \u20b9 25,000 crore at its next board meeting, as the debt-laden conglomerate looks to raise funds to repay its borrowings, according to a report by Business World .\n\nThe proposal was presented to the Tata Sons board at its previous meeting by Tata Trusts chairman Noel Tata and remains under consideration. The SP Group is seeking to monetise part of its 18.4% stake in Tata Sons, held through Sterling Investments Corporation and Cyrus Investments, to generate funds for debt repayment, the report said.\n\nThe proposed plan involves a selective reduction of Tata Sons\u2019 share capital over 18 months, which could generate gross proceeds of at least \u20b9 25,000 crore for the SP Group. The transaction\u2019s valuation would be based on fair value determined under the applicable income-tax rules.\n\nThe report further revealed that the SP Group has been exploring options to unlock value from its investment in Tata Sons to strengthen its balance sheet and reduce its debt burden. Its stake in the holding company has been pledged against borrowings, making it a potential source of liquidity.\n\nIn July, the group completed a \u20b9 21,500-crore refinancing exercise and subsequently repaid bonds worth around \u20b9 3,500 crore, easing immediate liquidity pressures. However, it co     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
