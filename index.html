 Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "05 Oct 2026, 12:28 PM IST", "pub_date_relative": "16m ago"}, {"title": "Stock futures are flat as investors grapple with higher yields, await Fed minutes: Live updates", "full_content": "Stock futures were little changed early Monday as elevated Treasury yields dented investor sentiment with focus on minutes from the Federal Reserve's latest meeting for clues about the central bank's next interest rate move.\n\nFutures tied to the Dow Jones Industrial Average slipped 51 points, or 0.1%, and S&P 500 futures was flat, Nasdaq-100 futures were up 0.2%\n\nIn Asia, Japan's Nikkei 225 closed 2.4% higher, while Australia's benchmark S&P/ASX 200 ended flat. Hong Kong's Hang Seng index was marginally higher. Markets in mainland China and South Korea are closed for holidays.\n\nOn Friday, U.S. stocks rose to close out the week, with the blue-chip Dow adding 250 points, or 0.5%, to close at 51,176.46, while the broad market S&P 500 climbed 0.7% to 7,722.72. The tech-heavy Nasdaq Composite rallied 1.2% to 27,190.86, after hitting an all-time high earlier in the session.\n\nStocks are coming off a week defined by surging Treasury yields and a surprisingly lackluster jobs report that helped ease concerns about another Fed rate hike this month. The data provided some relief after a week of pressure from rising bond yields.\n\nStill, Treasury yields remain a key focus for investors, with the 10-year yield climbing to its highest level in more than two decades and raising concerns that higher borrowing costs could weigh on stocks even if the Fed holds rates steady in the near term.\n\nTech stocks led Friday's advance, with Nvidia hitting an all-time high intraday and the Nasdaq reaching a record. Investors will be watching whether that momentum carries into the new week.\n\nWith a light economic calendar ahead, investors will be watching geopolitical and market developments before earnings season gets underway.", "source": "CNBC Top News", "pub_date_str": "05 Oct 2026, 12:28 PM IST", "pub_date_relative": "16m ago"}, {"title": "Akzo Nobel to Sell Southeast Asia Decorative Paints Business for $1.35 Billion - WSJ", "full_content": "Akzo Nobel to Sell Southeast Asia Decorative Paints Business for $1.35 Billion WSJ AkzoNobel to sell Southeast Asia paints business to Nippon Paint for $1.35 billion Reuters AkzoNobel to sell its SE Asia decorative paint unit to Nippon Paint Financial Times Nippon Paint to Buy Akzo\u2019s Southeast Asia Unit for $1.35 Billion Bloomberg.com AkzoNobel nears sale of south-east Asian paints unit to Nippon Paint - report Investing.com", "source": "Google News Business", "pub_date_str": "05 Oct 2026, 12:25 PM IST", "pub_date_relative": "19m ago"}, {"title": "ZCCM Investments Holdings resumes London trading", "full_content": "", "source": "Investing.com News", "pub_date_str": "05 Oct 2026, 12:24 PM IST", "pub_date_relative": "20m ago"}, {"title": "Euro hits 17-month low as political uncertainty in Spain and France rattles markets", "full_content": "The euro hit its weakest level against the U.S. dollar in 17 months on Monday, as concerns over the political trajectories of two of the euro zone's biggest economies spill over into wider markets.\n\nThe eurozone currency was last 0.6% lower against the greenback, hitting its lowest level since May 19, 2025, according to LSEG data.\n\nThat comes as the euro zone grapples with a simultaneous rise in inflation , interest rates and government borrowing costs .\n\nEuro/U.S. dollar The U.S. faces similar pressures, but investors are increasingly unsettled by additional vulnerabilities unique to Europe: persistently weak growth, a fragmented bond market and political uncertainty in Spain and France.\n\nSpanish Prime Minister Pedro S\u00e1nchez is on Monday expected to call a snap election, as protests over the country's housing crisis reach boiling point.\n\nFrance meanwhile remains the \"poster child\" for Europe's sovereign market problems, as mounting debt piles become more expensive to service.\n\nEconomists at Barclays said Friday that while the French government had presented a draft outline of its 2027 budget, aimed at reducing the public deficit from 5.4% of GDP to 5% next year, the country is unlikely meet its fiscal targets even if the plan is adopted in the coming months.\n\n\"French fiscal and political developments cloud the euro area outlook, with fiscal fundamentals remaining weak and unlikely to reach an inflection point before next year's presidential election,\" they said.", "source": "CNBC Top News", "pub_date_str": "05 Oct 2026, 12:24 PM IST", "pub_date_relative": "20m ago"}, {"title": "Deutsche Telekom sees AI driving \u20ac2.5 bln cost savings by 2030", "full_content": "", "source": "Investing.com News", "pub_date_str": "05 Oct 2026, 12:21 PM IST", "pub_date_relative": "23m ago"}, {"title": "Nifty rebounds after record 8-week rout, but is this a dead cat bounce investors should fear?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Nifty rebounds after record 8-week rout, but is this a dead cat bounce investors should fear? HDFC Bank Share Price ICICI Bank Share Price Kotak Mahindra Bank Share Price Axis Bank Share Price Federal Bank Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Nifty rebounds after record 8-week rout, but is this a dead cat bounce investors should fear? SECTIONS Nifty rebounds after record 8-week rout, but is this a dead cat bounce investors should fear? By Nikhil Agarwal , ETMarkets.com Last Updated: Oct 05, 2026, 12:21:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Nifty rebounded around 1% on Monday after its longest weekly losing streak in 25 years, while the Sensex gained as much as 700 points. However, after an 8-week slide that erased about 8.7%, investors remain unsure whether the gains mark a durable bottom or merely a temporary relief rally before another leg lower.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "05 Oct 2026, 12:21 PM IST", "pub_date_relative": "23m ago"}, {"title": "New IPO listings: Discount or premium? AceVector, Runwal, Orient, German Green Steel & Power - Check worst, best debut", "full_content": "The four new IPOs delivered mixed listing performance on Monday, October 5, with Orient Cables share price emerging as the strongest debut, while AceVector shares recorded the weakest. Orient Cables shares surged 65.44% over the IPO price of \u20b9 272 to list at \u20b9 450 on the NSE, while the stock debuted at \u20b9 448.10 on the BSE, a 64.74% premium.\n\nGerman Green Steel & Power followed with a more modest 3% premium, listing at \u20b9 142 on the NSE against its issue price of \u20b9 139, while its BSE debut at \u20b9 143.50 translated into a 3.24% premium. Runwal Enterprises had a largely flat listing, opening at \u20b9 305 on the NSE, exactly at its IPO price, while its BSE debut at \u20b9 306 represented a marginal 0.33% premium.\n\nAt the other end of the spectrum, AceVector, the parent of Snapdeal, made the weakest debut, listing at \u20b9 28.30 on the BSE against its IPO price of \u20b9 32, a 11.56% discount; on the NSE, it opened at \u20b9 28.32, down 11.50%.\n\nBased purely on listing-day performance, Orient Cables was the clear winner, while AceVector was the weakest performer, highlighting the sharp difference between premium and discount listings among the four new IPOs.\n\nHowever, Orient Cables, which was listed at a premium of more than 65%, was subsequently locked in a 10% lower circuit, but still traded over 48% above its IPO price.\n\nGerman Green Steel & Power, which had a relatively muted debut, slipped into the red and traded below its issue price. Runwal Enterprises also turned negative after a flat listing and was trading more than 3% below its IPO price.\n\nAceVector, meanwhile, extended its post-listing decline, falling another 8% and trading over 19% below its IPO price.\n\nDr Ravi Singh, Chief Research Officer at Master Capital Services, said Orient Cables made a stellar debut, listing at \u20b9 450 on the NSE, a 65.44% premium to its \u20b9 272 issue price. On the BSE, the stock debuted at \u20b9 448.10, up 64.74% from the IPO price.", "source": "LiveMint Markets", "pub_date_str": "05 Oct 2026, 12:20 PM IST", "pub_date_relative": "24m ago"}, {"title": "BT buys TalkTalk for \u00a3400 mln, sees value from integration", "full_content": "", "source": "Investing.com News", "pub_date_str": "05 Oct 2026, 12:19 PM IST", "pub_date_relative": "25m ago"}, {"title": "BT Group acquires TalkTalk out of administration for \u00a3400m", "full_content": "", "source": "Investing.com News", "pub_date_str": "05 Oct 2026, 12:19 PM IST", "pub_date_relative": "25m ago"}, {"title": "Taxpayer ignored 4 income-tax notices and faced \u20b91.55 crore additions: What Delhi ITAT ruled and why it matters", "full_content": "A taxpayer who failed to respond to multiple income-tax notices was facing additions of nearly \u20b9 1.55 crore to her income. In Jusbinder Kour vs ITO, ITA No. 4452/Del/2026, the Delhi bench of the Income Tax Appellate Tribunal (ITAT) has now ruled that the appellate authority cannot simply dismiss her appeal without examining the issues on merits and giving reasons.\n\nKour had filed her income-tax return on 4 January 2021, declaring total income of \u20b9 10.41 lakh, comprising salary income. The tax department subsequently received information about \u20b9 21.90 lakh in cash deposits and the purchase of an immovable property for \u20b9 74 lakh. The assessing officer (AO) sought an explanation, but Kour did not respond.\n\nThe AO then initiated reassessment proceedings and issued notices under sections 148, 142(1) and 144 of the Income-tax Act, along with show-cause notices. The taxpayer did not respond to these either. The AO subsequently sought information directly from Punjab and Sind Bank and Union Bank of India under section 133(6).\n\nInformation received from the banks showed cash deposits and other credits totalling \u20b9 80.94 lakh, excluding a \u20b9 34 lakh loan received by Kour. Since she had not explained the nature and source of the deposits , the AO treated \u20b9 80.94 lakh as unexplained money under section 69A and added it to her income.\n\nThe AO also made a separate \u20b9 74 lakh addition under section 69 for the property purchase because Kour had not explained the source of the investment.\n\nKour challenged the assessment before the Commissioner of Income Tax (Appeals), or CIT(A). However, the CIT(A) issued four notices, and she did not respond to any of them. The CIT(A) therefore dismissed the appeal and confirmed the assessment order.\n\nKour then approached the ITAT.", "source": "LiveMint Money", "pub_date_str": "05 Oct 2026, 12:19 PM IST", "pub_date_relative": "25m ago"}, {"title": "ESDS Software shares hit 5% lower circuit, crash nearly 30% in 6 sessions. What's behind the selloff?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a ESDS Software shares hit 5% lower circuit, crash nearly 30% in 6 sessions. What's behind the selloff? Swastika Investmart Share Price UVS Hospitality and Services Share Price Hi-Klass Trading & Investment Share Price Shree Salasar Investment Share Price GAMCO Share Price The Economic Times daily newspaper is available online now. Read Today's Paper ESDS Software shares hit 5% lower circuit, crash nearly 30% in 6 sessions. What's behind the selloff? SECTIONS ESDS Software shares hit 5% lower circuit, crash nearly 30% in 6 sessions. What's behind the selloff? By Veer Sharma , ETMarkets.com Last Updated: Oct 05, 2026, 12:18:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis ESDS Software shares hit the 5% lower circuit on Monday, extending their losing streak to six sessions and taking the decline to nearly 30%. The selloff follows the expiry of a one-month shareholder lock-in, while weaker sequential Q1 revenue and profit have also raised concerns over the stock\u2019s stretched valuation.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and N ares offset gains in technology stocks. The Hang Seng Index fell 0.08% by midday, while the Hang Seng Tech Index rose 0.3%. Trading remained subdued with mainland Chinese markets shut for the National Day holiday.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "05 Oct 2026, 12:10 PM IST", "pub_date_relative": "34m ago"}, {"title": "Euro slides to 17-month low against dollar", "full_content": "High energy prices and concerns over France\u2019s public finances add to pressure on the single currency", "source": "FT Markets", "pub_date_str": "05 Oct 2026, 12:08 PM IST", "pub_date_relative": "36m ago"}, {"title": "Morgan Stanley cuts stake in Ampeak Energy to 2.98%", "full_content": "", "source": "Investing.com News", "pub_date_str": "05 Oct 2026, 12:08 PM IST", "pub_date_relative": "36m ago"}, {"title": "35% dip in one year! ITC shares rise on better Q2 results buzz; experts give buy tag? Target price, stop-loss", "full_content": "Stocks to buy today: ITC shares are among the beaten-down stocks in the Indian stock market today . In YTD terms, the ITC share price has fallen by over 25%, whereas over the last year, it has corrected by around 35%. However, the market experts are bullish on this beaten-down stock after seeing up to 3% jump in the ITC share price today . They believe the tobacco company is expected to deliver better Q2 results due to improved margins following the fall in tobacco prices. They said that the ITC share price may go up to \u20b9 274 per share ahead of the announcement of the Q2 results 2026 .\n\nHighlighting the reason for the rise in the ITC shares, Avinash Gorakshkar, Founder of Avinash Mentor Research, said, \u201cITC share price is rising today for two major reasons: hopes for better Q2 results and positive sentiments on Dalal Street.\u201d\n\nGorakshkar said the market is expecting better ITC Q2 results, driven by higher margins and profitability from soft tobacco prices during the July to September 2026 quarter. He said that ITC is a portfolio stock and it is available at a discounted price. So, some investors are expected to engage in value buying of ITC shares.\n\nSharing details about the ITC share price target by 2026, Mahesh M Ojha, VP \u2014 Research and Business Development, said, \u201cThe ITC share price is facing a hurdle at the \u20b9 265.80 to \u20b9 269 range. On breaking above this resistance, we can expect a sharp upside in the ITC shares, and the stock may touch 274 after breaking above this resistance on a closing basis.\u201d\n\nOjha said that ITC shareholders can hold the scrip while maintaining a stop-loss at \u20b9 250.\n\nOn suggestion to the fresh investors, who want to add ITC shares in their portfolio, Mahesh M Ojha said, \u201cFresh investors can buy ITC shares at the current market price (CMP) for the targets of \u20b9 267 and \u20b9 274.", "source": "LiveMint Markets", "pub_date_str": "05 Oct 2026, 11:50 AM IST", "pub_date_relative": "54m ago"}, {"title": "50% up in 2026! Netweb Technologies share price rises 4% | Is it time to book profits?", "full_content": "Netweb Technologies share price surged as much as 3.70% on NSE during the intraday session on Monday amid positive sentiments on Dalal Street. Netweb Technologies shares opened at \u20b9 4,543 per share today, as compared to previous close of \u20b9 4,520.30 on Thursday and touched an intraday high of \u20b9 4,697 on 5 October.\n\nMeanwhile, Indian equity markets staged a strong rebound on Monday, with the Sensex rising more than 400 points and the Nifty trading above the 22,500 mark. The Sensex opened at 72,340.95 and was trading at around 72,362.54, gaining 452.84 points, or 0.63%, from its previous close of 71,909.70. The Nifty opened at 22,532.40 and was quoted at around 22,543.05, up 121.10 points, or 0.54%, compared with its previous close of 22,421.95.\n\nThe rally in Netweb Technologies shares came in after the stock witnessed a spurt in its trading volume. According to data available on NSE, around 5.77 lakhs shares changed hands during the intraday session on Monday.\n\nNetweb Technologies share price have gained 1.13% over the past week but remained under pressure over the one-month period, declining 11.07%. The stock has, however, delivered a strong 50.13% return year-to-date (YTD), indicating that it has significantly outperformed despite the recent correction.\n\nOver a longer timeframe, the stock has generated substantial returns, rising 7.10% over the past year and surging 459.69% in three years.\n\nVirat Jagad Sr. Technical Research Analyst at Bonanza, said that fresh buying in Netweb is not recommended at current levels. Netweb Technologies remains in a long-term uptrend, with the stock trading above its 200-day moving average around \u20b9 4,145.\n\nJagad added that the short-term structure remains weak as price is below the 20-day and 50-day moving averages. The stock is currently consolidating around the \u20b9 4,575\u2013 \u20b9 4,600 support zone.", "source": "LiveMint Markets", "pub_date_str": "05 Oct 2026, 11:49 AM IST", "pub_date_relative": "55m ago"}, {"title": "Chart beat: AI boom drives current account divergence between North and Southeast Asia", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nIn a stark contrast, the current account divergence between North and Southeast Asia is widening amid the artificial intelligence (AI) boom. Northeast Asia is seeing a current account surplus, with the reading surging to a record high of $538 billion, based on the 12-month sum to July 2026. On the other hand, current account deficits across parts of Southeast Asia have increased.\n\nA current account surplus is seen when a country has a positive current account balance, indicating that it exports more than imports. Conversely, a current account deficit occurs when a country's total payments for imported goods, services and income exceeds its total earnings from exports and receipts from abroad.\n\n\u201cTaiwan and Korea dominate higher-value upstream segments of the tech supply chain, which enable them to capture significant export upside from surging demand for AI servers and memory chips , whereas parts of Southeast Asia are more concentrated in lower-value assembly and downstream manufacturing, which benefit less from the AI boom ,\u201d said Nomura Global Markets Research report dated 28 September.\n\nMoreover, data centre investment is proving more import-intensive, leading to persistent electronics trade deficits in Thailand.\n\nIn the ongoing global macroeconomic backdrop, a steep current account deficit exposes Southeast Asian nations to increased risk of currency depreciation, making them more vulnerable. For North Asia, it means strong external financing conditions.\n\nFurther, the West Asia war -led oil supply shock is expected to amplify this divide.", "source": "LiveMint Markets", "pub_date_str": "05 Oct 2026, 11:48 AM IST", "pub_date_relative": "56m ago"}, {"title": "Titan, Kalyan Jewellers, PC Jeweller shares shine - Why jewellery stocks are glittering? Expert decodes rally", "full_content": "Shares of jewellery stocks including PC Jeweller , Kalyan Jewellers India, Titan Company , etc surged during Monday\u2019s trading session as part of wider positive sentiment prevailing across the Indian stock market. The surge has come ahead of the festive season as investors prepare for Diwali , Dussehra, Navratri and Durga Puja celebrations.\n\nShares of PC Jeweller and Titan Company Limited were trading nearly 1.5% higher during Monday\u2019s intraday trading session. However, Kalyan Jewellers emerged as the top gainers among them with nearly 4.5% rally during Monday\u2019s intraday trading session.\n\nFestive season demand and expectations of strong performance in the second quarter of financial year 2026-27 are driving the recent rally in jewellery stocks today.\n\n\u201c Early October marks the beginning of the key jewellery buying season, with Dhanteras and Diwali approaching. This is traditionally one of the strongest periods for gold and jewellery demand in India. Market is therefore positioning themselves ahead of potentially higher festive sales,\u201d Abhinav Tiwari Sr. Research Analyst at Bonanza.\n\nStrengthening of gold prices is also likely to support the sentiment around jewellery stocks.\n\n\u201cJewellery companies are expected to release their September-quarter provisional sales updates this week, but these updates have not been released yet. Therefore, today's rally is largely expectation driven. The market is essentially driven by the festive season and upcoming quarterly business updates,\u201d added Abhinav Tiwari.\n\nKalyan Jewellers shares were trading 4.72% higher at \u20b9 554.50 per share on BSE with a market capitalisation of \u20b9 57,266.04 crore at 11:30 am. The stock has touched an intraday high of \u20b9 556.40 per share and an intraday low of \u20b9 529.50 per share. The stock has delivered 40% return in six months and 12% return in one year.\n\nShares of PC Jeweller were up 1.25% at \u20b9 12.98 apiece. The stock touched an intraday high of \u20b9 13.31 per share and an intraday low of \u20b9 12.94 per share.", "source": "LiveMint Markets", "pub_date_str": "05 Oct 2026, 11:47 AM IST", "pub_date_relative": "57m ago"}, {"title": "EAM Jaishankar calls on Swiss President Parmelin, highlights momentum of India-EFTA TEPA", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a EAM Jaishankar calls on Swiss President Parmelin, highlights momentum of India-EFTA TEPA The Economic Times daily newspaper is available online now. Read Today's Paper EAM Jaishankar calls on Swiss President Parmelin, highlights momentum of India-EFTA TEPA SECTIONS EAM Jaishankar calls on Swiss President Parmelin, highlights momentum of India-EFTA TEPA ANI Last Updated: Oct 05, 2026, 11:46:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Swiss President Guy Parmelin is undertaking a three-day State visit to India at Prime Minister Modi's invitation. He aims to strengthen bilateral collaboration across various sectors including commerce and technology. Both leaders are scheduled to hold discussions on trade, investment, and multilateral cooperation. President Parmelin will also meet President Droupadi Murmu during his visit. This trip marks a significant opportunity for India and Switzerland to enhance their long-standing partnership.\n\nQ2 earnings season: Will it settle or add to confusion in the stock market?\n\nHow Sebi busted Growpital\u2019s \u2018assured\u2019 returns, LLPs and money trail\n\nA for apple, Y for yak and, for the first time, a price next to it. Will this change the non-agri part of the rural economy?\n\nSix months after oil spiked, why are markets reacting so sharply now?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "05 Oct 2026, 11:46 AM IST", "pub_date_relative": "58m ago"}, {"title": "FlyDubai's Perilous Plunge and Survival Puts Focus on Jet Design", "full_content": "FlyDubai's Boeing 737 Max survives a near-catastrophic plunge before making a safe landing in Saudi Arabia.", "source": "NDTV Profit", "pub_date_str": "05 Oct 2026, 11:44 AM IST", "pub_date_relative": "1h ago"}, {"title": "US-India Trade Deal Negotiations Have Reached A 'Plateau': FM Nirmala Sitharaman", "full_content": "Sitharaman remarked that trade deals are moving away from thespirit of negotiation", "source": "NDTV Profit", "pub_date_str": "05 Oct 2026, 11:40 AM IST", "pub_date_relative": "1h ago"}, {"title": "iPhone, iPad, MacBook: Best Apple Deals To Watch During Flipkart BBD & Amazon GIF Sale", "full_content": "MacBook Air M5 gets an effective Rs 25,000 discount in Flipkart\u2019s Big Billion Days sale, bringing it to Rs 1,24,990 with bank offers. Cashify says the deal includes no-cost EMI and prices may change.", "source": "NDTV Profit", "pub_date_str": "05 Oct 2026, 11:40 AM IST", "pub_date_relative": "1h ago"}, {"title": "5 global market themes investors need to watch this week", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News Powered By 5 global market themes investors need to watch this week Written by Anupam Nagar , ETMarkets.com | Oct 05, 2026, 11:45:43 AM IST 1 / 6 \u200bWorld Markets this week Global markets are confronting a tougher backdrop as borrowing costs remain elevated, oil prices stay above $100 a barrel and central banks continue tightening policy. Political uncertainty in France, currency volatility, Brazil's election and key central-bank signals could keep investors on edge. (Source: Reuters)\n\nFrance's minority government has presented its 2027 budget bill, setting the stage for weeks of political wrangling over spending cuts. The country's 10-year bond yield is hovering near 5%, its highest level since 2002, while public debt has climbed to almost 120% of economic output. France plans to issue a record \u20ac340 billion in bonds next year, adding to concerns over its finances. Strikes against planned budget cuts are also gaining momentum. With presidential elections approaching, investors are watching closely for signs of further market stress and the European Central Bank's response.\n\nCurrency markets are emerging from their summer lull, with the dollar on course for a third consecutive weekly gain. The dollar index is at its highest level in 18 months, supported by stronger US growth, elevated Treasury yields and high energy prices. The euro, meanwhile, has fallen below $1.13 for the first time since May 2025. Rising borrowing costs in heavily indebted euro zone economies, including France, combined with higher energy prices, are weighing on the region's growth outlook. Euro volatility has also increased as traders position for further weakness.\n\nBrazil voted in an election that could determine whether Latin America's largest economy follows the region's recent rightward political shift.", "source": "Economic Times Markets", "pub_date_str": "05 Oct 2026, 11:37 AM IST", "pub_date_relative": "1h ago"}, {"title": "How to trade HDFC Bank shares after new CEO appointment? Technical indicators still signal weakness", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a How to trade HDFC Bank shares after new CEO appointment? Technical indicators still signal weakness HDFC Bank Share Price ICICI Bank Share Price Kotak Mahindra Bank Share Price Axis Bank Share Price Federal Bank Share Price The Economic Times daily newspaper is available online now. Read Today's Paper How to trade HDFC Bank shares after new CEO appointment? Technical indicators still signal weakness SECTIONS How to trade HDFC Bank shares after new CEO appointm ll-time high earlier in the session.\n\nStocks are coming off a week defined by surging Treasury yields and a surprisingly lackluster jobs report that helped ease concerns about another Fed rate hike this month. The data provided some relief after a week of pressure from rising bond yields.\n\nStill, Treasury yields remain a key focus for investors, with the 10-year yield climbing to its highest level in more than two decades and raising concerns that higher borrowing costs could weigh on stocks even if the Fed holds rates steady in the near term.\n\nTech stocks led Friday's advance, with Nvidia hitting an all-time high intraday and the Nasdaq reaching a record. Investors will be watching whether that momentum carries into the new week.\n\nWith a light economic calendar ahead, investors will be watching geopolitical and market developments before earnings season gets underway.", "source": "CNBC Top News", "pub_date_str": "05 Oct 2026, 12:28 PM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Fixed Income", "Derivatives", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Euro hits 17-month low as political uncertainty in Spain and France rattles markets", "full_content": "The euro hit its weakest level against the U.S. dollar in 17 months on Monday, as concerns over the political trajectories of two of the euro zone's biggest economies spill over into wider markets.\n\nThe eurozone currency was last 0.6% lower against the greenback, hitting its lowest level since May 19, 2025, according to LSEG data.\n\nThat comes as the euro zone grapples with a simultaneous rise in inflation , interest rates and government borrowing costs .\n\nEuro/U.S. dollar The U.S. faces similar pressures, but investors are increasingly unsettled by additional vulnerabilities unique to Europe: persistently weak growth, a fragmented bond market and political uncertainty in Spain and France.\n\nSpanish Prime Minister Pedro S\u00e1nchez is on Monday expected to call a snap election, as protests over the country's housing crisis reach boiling point.\n\nFrance meanwhile remains the \"poster child\" for Europe's sovereign market problems, as mounting debt piles become more expensive to service.\n\nEconomists at Barclays said Friday that while the French government had presented a draft outline of its 2027 budget, aimed at reducing the public deficit from 5.4% of GDP to 5% next year, the country is unlikely meet its fiscal targets even if the plan is adopted in the coming months.\n\n\"French fiscal and political developments cloud the euro area outlook, with fiscal fundamentals remaining weak and unlikely to reach an inflection point before next year's presidential election,\" they said.", "source": "CNBC Top News", "pub_date_str": "05 Oct 2026, 12:24 PM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Nifty rebounds after record 8-week rout, but is this a dead cat bounce investors should fear?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Nifty rebounds after record 8-week rout, but is this a dead cat bounce investors should fear? HDFC Bank Share Price ICICI Bank Share Price Kotak Mahindra Bank Share Price Axis Bank Share Price Federal Bank Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Nifty rebounds after record 8-week rout, but is this a dead cat bounce investors should fear? SECTIONS Nifty rebounds after record 8-week rout, but is this a dead cat bounce investors should fear? By Nikhil Agarwal , ETMark d with a more modest 3% premium, listing at \u20b9 142 on the NSE against its issue price of \u20b9 139, while its BSE debut at \u20b9 143.50 translated into a 3.24% premium. Runwal Enterprises had a largely flat listing, opening at \u20b9 305 on the NSE, exactly at its IPO price, while its BSE debut at \u20b9 306 represented a marginal 0.33% premium.\n\nAt the other end of the spectrum, AceVector, the parent of Snapdeal, made the weakest debut, listing at \u20b9 28.30 on the BSE against its IPO price of \u20b9 32, a 11.56% discount; on the NSE, it opened at \u20b9 28.32, down 11.50%.\n\nBased purely on listing-day performance, Orient Cables was the clear winner, while AceVector was the weakest performer, highlighting the sharp difference between premium and discount listings among the four new IPOs.\n\nHowever, Orient Cables, which was listed at a premium of more than 65%, was subsequently locked in a 10% lower circuit, but still traded over 48% above its IPO price.\n\nGerman Green Steel & Power, which had a relatively muted debut, slipped into the red and traded below its issue price. Runwal Enterprises also turned negative after a flat listing and was trading more than 3% below its IPO price.\n\nAceVector, meanwhile, extended its post-listing decline, falling another 8% and trading over 19% below its IPO price.\n\nDr Ravi Singh, Chief Research Officer at Master Capital Services, said Orient Cables made a stellar debut, listing at \u20b9 450 on the NSE, a 65.44% premium to its \u20b9 272 issue price. On the BSE, the stock debuted at \u20b9 448.10, up 64.74% from the IPO price.", "source": "LiveMint Markets", "pub_date_str": "05 Oct 2026, 12:20 PM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "ESDS Software shares hit 5% lower circuit, crash nearly 30% in 6 sessions. What's behind the selloff?", "full_ conomy", "pub_date_str": "05 Oct 2026, 12:16 PM IST", "pub_date_relative": "28m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Air Liquide launches first ever \u20ac4 billion buyback under new 2030 strategy", "full_content": "", "source": "Investing.com News", "pub_date_str": "05 Oct 2026, 12:12 PM IST", "pub_date_relative": "32m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Global Market: Hang Seng dips as real estate, financial shares face selling pressure", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Global Market: Hang Seng dips as real estate, financial shares face selling pressure Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market: Hang Seng dips as real estate, financial shares face selling pressure SECTIONS Global Market: Hang Seng dips as real estate, financial shares face selling pressure By Anupam Nagar , ETMarkets.com Last Updated: Oct 05, 2026, 12:10:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Hong Kong stocks edged lower as selling pressure in real estate and financial shares offset gains in technology stocks. The Hang Seng Index fell 0.08% by midday, while the Hang Seng Tech Index rose 0.3%. Trading remained subdued with mainland Chinese markets shut for the National Day holiday.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "05 Oct 2026, 12:10 PM IST", "pub_date_relative": "34m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "35% dip in one year! ITC shares rise on better Q2 results buzz; experts give buy tag? Target price, stop-loss", "full_content": "Stocks to buy today: ITC shares are among the beaten-down stocks in the Indian stock market today . In YTD terms, the ITC share price has fallen by over 25%, whereas over the last year, it has corrected by around 35%. However, the market experts are bullish on this beaten-down stock after seeing up to 3% jump in the ITC share price today . They believe the tobacco company is expected to deliver better Q2 results due to improved margins following the fall in tobacco prices. They said that the ITC share price may go up to \u20b9 274 per share ahead of the announcement of the Q2 results 2026 .\n\nHighlighting the reason for the rise in the ITC shares, Avinash Gorakshkar, Founder of Avinash Mentor Research, said, \u201cITC share price is rising today for two major reasons: hopes for better Q2 results and positive sentiments on Dalal Street.\u201d\n\nGorakshkar said the market is expecting better ITC Q2 results, driven by higher margins and profitability from soft tobacco prices during the July to September 2026 quarter. He said that ITC is a portfolio stock and it is available at a discounted price. So, some investors are expected to engage in value buying of ITC shares.\n\nSharing details about the ITC share price target by 2026, Mahesh M Ojha, VP \u2014 Research and Business Development, said, \u201cThe ITC share price is facing a hurdle at the \u20b9 265.80 to \u20b9 269 range. On breaking above this resistance, we can expect a sharp upside in the ITC shares, and the stock may touch 274 after breaking above this resistance on a closing basis.\u201d\n\nOjha said that ITC shareholders can hold the scrip while maintaining a stop-loss at \u20b9 250.\n\nOn suggestion to the fresh investors, who want to add ITC shares in their portfolio, Mahesh M Ojha said, \u201cFresh investors can buy ITC shares at the current market price (CMP) for the targets of \u20b9 267 and \u20b9 274.", "source": "LiveMint Markets", "pub_date_str": "05 Oct 2026, 11:50 AM IST", "pub_date_relative": "54m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "50% up in 2026! Netweb Technologies share price rises 4% | Is it time to book profits?", "full_content": "Netweb Technologies share price surged as much as 3.70% on NSE during the intraday session on Monday amid positive sentiments on Dalal Street. Netweb Technologies shares opened at \u20b9 4,543 per share today, as compared to previous close of \u20b9 4,520.30 on Thursday and touched an intraday high of \u20b9 4,697 on 5 October.\n\nMeanwhile, Indian equity markets staged a strong rebound on Monday, with the Sensex rising more than 400 points and the Nifty trading above the 22,500 mark. The Sensex opened at 72,340.95 and was trading at around 72,362.54, gaining 452.84 points, or 0.63%, from its previous close of 71,909.70. The Nifty opened at 22,532.40 and was quoted at around 22,543.05, up 121.10 points, or 0.54%, compared with its previous close of 22,421.95.\n\nThe rally in Netweb Technologies shares came in after the stock witnessed a spurt in its trading volume. According to data available on NSE, around 5.77 lakhs shares changed hands during the intraday session on Monday.\n\nNetweb Technologies share price have gained 1.13% over the past week but remained under pressure over the one-month period, declining 11.07%. The stock has, however, delivered a strong 50.13% return year-to-date (YTD), indicating that it has significantly outperformed despite the recent correction.\n\nOver a longer timeframe, the stock has generated substantial returns, rising 7.10% over the past year and surging 459.69% in three years.\n\nVirat Jagad Sr. Technical Research Analyst at Bonanza, said that fresh buying in Netweb is not recommended at current levels. Netweb Technologies remains in a long-term uptrend, with the stock trading above its 200-day moving average around \u20b9 4,145.\n\nJagad added that the short-term structure remains weak as price is below the 20-day and 50-day moving averages. The stock is currently consolidating around the \u20b9 4,575\u2013 \u20b9 4,600 support zone.", "source": "LiveMint Markets", "pub_date_str": "05 Oct 2026, 11:49 AM IST", "pub_date_relative": "55m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Chart beat: AI boom drives current account divergence between North and Southeast Asia", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nIn a stark contrast, the current account divergence between North and Southeast Asia is widening amid the artificial intelligence (AI) boom. Northeast Asia is seeing a current account surplus, with the reading surging to a record high of $538 billion, based on the 12-month sum to July 2026. On the other hand, current account deficits across parts of Southeast Asia have increased.\n\nA current account surplus is seen when a country has a positive current account balance, indicating that it exports more than imports. Conversely, a current account deficit occurs when a country's total payments for imported goods, services and income exceeds its total earnings from exports and receipts from abroad.\n\n\u201cTaiwan and Korea dominate higher-value upstream segments of the tech supply chain, which enable them to capture significant export upside from surging demand for AI servers and memory chips , whereas parts of Southeast Asia are more concentrated in lower-value assembly and downstream manufacturing, which benefit less from the AI boom ,\u201d said Nomura Global Markets Research report dated 28 September.\n\nMoreover, data centre investment is proving more import-intensive, leading to persistent electronics trade deficits in Thailand.\n\nIn the ongoing global macroeconomic backdrop, a steep current account deficit exposes Southeast Asian nations to increased risk of currency depreciation, making them more vulnerable. For North Asia, it means strong external financing conditions.\n\nFurther, the West Asia war -led oil supply shock is expected to amplify this divide.", "source": "LiveMint Markets", "pub_date_str": "05 Oct 2026, 11:48 AM IST", "pub_date_relative": "56m ago", "cfa_topics": ["Economics", "Financial Statement Analysis"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Titan, Kalyan Jewellers, PC Jeweller shares shine - Why jewellery stocks are glittering? Expert decodes rally", "full_content": "Shares of jewellery stocks including PC Jeweller , Kalyan Jewellers India, Titan Company , etc surged during Monday\u2019s trading session as part of wider positive sentiment prevailing across the Indian stock market. The surge has come ahead of the festive season as investors prepare for Diwali , Dussehra, Navratri and Durga Puja celebrations.\n\nShares of PC Jeweller and Titan Company Limited were trading nearly 1.5% higher during Monday\u2019s intraday trading session. However, Kalyan Jewellers emerged as the top gainers among them with nearly 4.5% rally during Monday\u2019s intraday trading session.\n\nFestive season demand and expectations of strong performance in the second quarter of financial year 2026-27 are driving the recent rally in jewellery stocks today.\n\n\u201c Early October marks the beginning of the key jewellery buying season, with Dhanteras and Diwali approaching. This is traditionally one of the strongest periods for gold and jewellery demand in India. Market is therefore positioning themselves ahead of potentially higher festive sales,\u201d Abhinav Tiwari Sr. Research Analyst at Bonanza.\n\nStrengthening of gold prices is also likely to support the sentiment around jewellery stocks.\n\n\u201cJewellery companies are expected to release their September-quarter provisional sales updates this week, but these updates have not been released yet. Therefore, today's rally is largely expectation driven. The market is essentially driven by the festive season and upcoming quarterly business updates,\u201d added Abhinav Tiwari.\n\nKalyan Jewellers shares were trading 4.72% higher at \u20b9 554.50 per share on BSE with a market capitalisation of \u20b9 57,266.04 crore at 11:30 am. The stock has touched an intraday high of \u20b9 556.40 per share and an intraday low of \u20b9 529.50 per share. The stock has delivered 40% return in six months and 12% return in one year.\n\nShares of PC Jeweller were up 1.25% at \u20b9 12.98 apiece. The stock touched an intraday high of \u20b9 13.31 per share and an intraday low of \u20b9 12.94 per share.", "source": "LiveMint Markets", "pub_date_str": "05 Oct 2026, 11:47 AM IST", "pub_date_relative": "57m ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "EAM Jaishankar calls on Swiss President Parmelin, highlights momentum of India-EFTA TEPA", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a EAM Jaishankar calls on Swiss President Parmelin, highlights momentum of India-EFTA TEPA The Economic Times daily newspaper is available online now. Read Today's Paper EAM Jaishankar calls on Swiss President Parmelin, highlights momentum of India-EFTA TEPA SECTIONS EAM Jaishankar calls on Swiss President Parmelin, highlights momentum of India-EFTA TEPA ANI Last Updated: Oct 05, 2026, 11:46:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Swiss President Guy Parmelin is undertaking a three-day State visit to India at Prime Minister Modi's invitation. He aims to strengthen bilateral collaboration across various sectors including commerce and technology. Both leaders are scheduled to hold discussions on trade, investment, and multilateral cooperation. President Parmelin will also meet President Droupadi Murmu during his visit. This trip marks a significant opportunity for India and Switzerland to enhance their long-standing partnership.\n\nQ2 earnings season: Will it settle or add to confusion in the stock market?\n\nHow Sebi busted Growpital\u2019s \u2018assured\u2019 returns, LLPs and money trail\n\nA for apple, Y for yak and, for the first time, a price next to it. Will this change the non-agri part of the rural economy?\n\nSix months after oil spiked, why are markets reacting so sharply now?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "05 Oct 2026, 11:46 AM IST", "pub_date_relative": "58m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "5 global market themes investors need to watch this week", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News Powered By 5 global market themes investors need to watch this week Written by Anupam Nagar , ETMarkets.com | Oct 05, 2026, 11:45:43 AM IST 1 / 6 \u200bWorld Markets this week Global markets are confronting a tougher backdrop as borrowing costs remain elevated, oil prices stay above $100 a barrel and central banks continue tightening policy. Political uncertainty in France, currency volatility, Brazil's election and key central-bank signals could keep investors on edge. (Source: Reuters)\n\nFrance's minority government has presented its 2027 budget bill, setting the stage for weeks of political wrangling over spending cuts. The country's 10-year bond yield is hovering near 5%, its highest level since 2002, while public debt has climbed to almost 120% of economic output. France plans to issue a record \u20ac340 billion in bonds next year, adding to concerns over its finances. Strikes against planned budget cuts are also gaining momentum. With presidential elections approaching, investors are watching closely for signs of further market stress and the European Central Bank's response.\n\nCurrency markets are emerging from their summer lull, with the dollar on course for a third consecutive weekly gain. The dollar index is at its highest level in 18 months, supported by stronger US growth, elevated Treasury yields and high energy prices. The euro, meanwhile, has fallen below $1.13 for the first time since May 2025. Rising borrowing costs in heavily indebted euro zone economies, including France, combined with higher energy prices, are weighing on the region's growth outlook. Euro volatility has also increased as traders position for further weakness.\n\nBrazil voted in an election that could determine wh t's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "05 Oct 2026, 10:41 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "From Records To Gold: The Indian Women Who Ruled Asian Games 2026", "full_content": "Indian women made history at Asian Games 2026, winning medals in sailing, golf, archery, shooting, athletics and hockey. Their performances broke records, ended long medal droughts and delivered several firsts for Indian sport.", "source": "NDTV Profit", "pub_date_str": "05 Oct 2026, 10:40 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Floating-rate bond 2028: RBI sets 6.45% interest rate for October 2026-April 2027; what investors should know", "full_content": "The Reserve Bank of India (RBI) has fixed the interest rate on the Government of India Floating Rate Bond 2028 (FRB 2028) at 6.45% per annum for the six-month period from 4 October 2026 to 3 April 2027.\n\nThe rate is higher than the 6.17% coupon applicable to the bond during the previous six-month period, which ended on 3 October 2026.\n\nHowever, investors should not read the 6.45% rate as a return that will remain unchanged until the bond matures. As the name suggests, the bond has a floating coupon that is reset every six months.\n\nThe coupon on FRB 2028 is linked to short-term government borrowing rates. According to the RBI, its base rate is the average Weighted Average Yield (WAY) of the last three auctions of 182-day Treasury Bills, calculated from the rate-fixing day. A fixed spread of 0.64 percentage point is added to this base rate.\n\nFor the current half-year, this mechanism has resulted in a coupon of 6.45%.\n\nThis means the interest rate can change at the next reset. If yields on 182-day Treasury Bills rise, the coupon on the floating-rate bond can increase. If those yields fall, the coupon can decline.\n\nFor an investor, this is an important difference from a fixed-rate bond or fixed-rate deposit, where the contracted rate generally remains unchanged for the agreed tenure.\n\nAt a 6.45% annualised coupon, an investment of \u20b9 1 lakh would generate \u20b9 6,450 in interest over a full year if the rate remained unchanged for the entire year.", "source": "LiveMint Money", "pub_date_str": "05 Oct 2026, 10:40 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Some equity mutual funds earn dividends too; here's why it may not be credited to your bank account \u2014 why it happens?", "full_content": "Equity mutual funds invest in shares, which may generate dividends. Investors can choose either a growth or dividend plan. Here's when the dividend is not credited to an investor's bank account.&nbsp;", "source": "LiveMint Money", "pub_date_str": "05 Oct 2026, 10:37 AM IST", "pub_date_relative": "2h ag     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
