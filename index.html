<script>
    // This variable will be injected during the build process
    const allData = {"general": [{"title": "Gold rises as bargain hunters step in after steep weekly drop", "full_content": "Nov 23 (Reuters) - Gold prices recovered from a more than one-year low on Monday as investors bought the dip, while the market looked ahead to upcoming US inflation data for further clues on the Federal Reserve's interest rate trajectory.\n\nSpot gold climbed 3.5% to $3,654.97 per ounce by 2:10 p.m. ET (1910 GMT), after hitting its lowest level since September 2025 on Friday.\n\nGold prices fell more than 9% last week, as an AI-linked stocks selloff prompted some investors to liquidate gold to raise cash and meet margin requirements. [MKTS/GLOB]\n\n\"There is talk in the marketplace that if the stock indexes continue to melt down, that will prevent the Fed from raising interest rates. I think that's an outlier, but that's supporting the rebounds in the precious metals markets early this week,\" said Jim Wyckoff, a market analyst at American Gold Exchange.\n\n\"The next couple of days of trading will go a long way in determining whether we have put in market bottoms or whether this is just a dead camp bounce in bear markets.\"\n\nWhile market participants continue to expect a 25-basis-point Fed rate hike in December, they have priced out chances of a larger 50-basis-point increase, according to CME's FedWatch Tool.\n\nHigher interest rates reduce the appeal of non-yielding bullion.\n\nTraders are awaiting the October Personal Consumption Expenditures index, the Fed's preferred inflation measure, due on Wednesday, to gauge price pressures and determine the likelihood of further rate hikes.", "source": "LiveMint Markets", "pub_date_str": "24 Nov 2026, 12:49 AM IST", "pub_date_relative": "4m ago"}, {"title": "Tech stocks rally after Nvidia board approves Jensen Huang's return as CEO", "full_content": "Major tech stocks rebounded across the board Monday, following Friday's steep sell-off when artificial intelligence stocks fell in the Nasdaq's worst week since 2020.\n\nShares of Nvidia surged 30%, gaining back nearly $1 trillion in market cap after the company announced Monday morning that Jensen Huang was reinstated as CEO .\n\nNvidia's surge and Huang's reinstatement followed a more than 40% slump in the stock over the past month. The company has been embattled as reports surfaced about Huang's multiple extramarital affairs \u2014 one of which was with a woman U.S. intelligence reportedly believes to be a Chinese spy. Huang resigned as CEO of the company he founded on Nov. 12.\n\nThe Nasdaq Composite surged more than 6% Monday after sliding 10% last week. Tech stocks had a rocky week as investors remained nervous about the valuation of some AI companies and business models. All three major averages ended last week in correction territory, and the Nasdaq turned negative for 2026.\n\nNvidia stock chart Shares of Big Tech companies and other stocks related to the AI trade saw a lift Monday on the Nvidia news.\n\nShares of Alphabet and Meta each surged 6%, Amazon was up 4% and Microsoft jumped 2.5%. SpaceX added 6%, Arm Holdings surged 16% and AMD added more than 6%. Dell and Micron posted some of the sector's biggest gains of the day, gaining 21% and 18%, respectively. The iShares Semiconductor ETF gained 13%.\n\nNeoclouds, which have seen a particularly choppy few months amid AI boom financing concerns, surged on Huang's reinstatement. Nebius and CoreWeave were up 20%, and Iren gained 23%.\n\nFollowing a brief premarket surge, Anthropic shares traded largely flat in its third day of trading. Anthropic raised a record $93.5 billion in its IPO. The stock gained 17% in its debut on Thursday, before closing down 8.5% on Friday.", "source": "CNBC World Economy", "pub_date_str": "24 Nov 2026, 12:49 AM IST", "pub_date_relative": "5m ago"}, {"title": "Oil falls around 3% on increased Middle East flows, Libyan pipeline restart", "full_content": "HOUSTON, Nov 23 (Reuters) - Oil prices shed nearly 3% on Monday as traders weighed a rise in supplies from the Middle East and the restart of a Libyan oil pipeline, offsetting some unease around shipping and refinery attacks in the region.\n\nBrent crude futures fell $2.62, or 2.83%, to $89.95 a barrel by 1:49 p.m. EDT. US West Texas Intermediate futures were down $2.68, or 3.21%, at $80.73 a barrel.\n\nEarlier in the session, Brent hit a session low of $88.60 a barrel, its lowest since August 27, while WTI fell to a low of $79.95, its lowest since August 26.\n\nUS crude oil and product inventories are expected to have risen by about 900,000 barrels in the week ended November 20, a preliminary Reuters poll of five analysts showed on Monday.\n\nLibya's Sharara oil pipeline has reopened and crude is beginning to flow into storage tanks at the Akakus facility in Zawiya, the chairman of the National Oil Corporation told Reuters on Monday.\n\nMeanwhile, JPMorgan expects oil futures to fall to the high $70s in the first half of 2027 due to an estimated supply surplus, with higher Middle East production outside Iran next year along with more supply from the Americas led by the US.\n\nBank of America said geopolitics would remain the key driver of oil prices, with relatively low global inventories leaving much of the world vulnerable to supply disruptions.\n\n\"It is partly the growing signs of a glut, but with each passing day it seems less likely that Trump will attack again,\" said IG chief market analyst Chris Beauchamp.", "source": "LiveMint Markets", "pub_date_str": "24 Nov 2026, 12:46 AM IST", "pub_date_relative": "7m ago"}, {"title": "Nasdaq roars back by 6% as Nvidia soars on Huang\u2019s return, S&P 500 rebounds 5%: Live updates", "full_content": "U.S. equities surged on Monday after Nvidia reinstated Jensen Huang as CEO, reviving the artificial intelligence trade and pushing major indexes higher after all three major market averages ended Friday in a correction.\n\nThe S&P 500 added 5%, and the Nasdaq Composite jumped 6.7%. The Dow Jones Industrial Average gained 1,582 points, or 3.3%. Each of the three major averages is on pace for its best day since April 2025.\n\nNvidia soared 31% after the company's board returned Huang as the head of the company , effective immediately. Huang had resigned earlier this month after reportedly engaging in a number of extramarital affairs, one of which was with an alleged Chinese spy.\n\nPresident Donald Trump applauded the move and told CNBC that Huang \"did nothing wrong.\" The president also said that he spoke with Nvidia's board and \"convinced\" them to reinstate him.\n\n\"He had bad judgment having to do with somewhat unrelated incidents, but he did nothing wrong other than he created a chip that's invaluable, many chips that are invaluable,\" he told CNBC's Eamon Javers in a \" Squawk on the Street \" interview.\n\nOther stocks in the AI trade jumped in sympathy with Nvidia on Monday. Micron Technology added 19%, while CoreWeave skyrocketed 20%. Advanced Micro Devices was up 6%. \"Magnificent Seven\" members Alphabet and Meta Platforms popped 6% each, and Microsoft gained 2%.\n\n\"Jensen Huang's return restores and rebuilds confidence in the AI ecosystem: its major suppliers, its core building blocks, and its demand outlook,\" said Hendi Susanto, portfolio manager and research analyst at Gabelli Funds.\n\nTo be sure, the trade \"still has to push through a lot of noise about financing, geopolitics, durability and skepticism, even though companies across the AI supply chain keep reporting strong demand,\" Susanto added.", "source": "CNBC Top News", "pub_date_str": "24 Nov 2026, 12:45 AM IST", "pub_date_relative": "8m ago"}, {"title": "DNI Jay Clayton tapped as acting national cyber director", "full_content": "Director of National Intelligence Jay Clayton has been tapped to serve as acting national cyber director while the Trump administration's permanent nominee for the role awaits Senate confirmation, a White House official told CNBC on Monday.\n\nTrump had already added artificial intelligence czar to Clayton's portfolio in October. The official spoke on condition of anonymity because the pick hasn't been announced.\n\nThe White House last week announced that President Donald Trump had picked Kirsten Davies , the Pentagon's chief information officer, to lead the Office of the National Cyber Director.\n\nThe U.S. cyber director advises the president on cybersecurity and coordinates U.S. cyber policy across federal agencies. Federal law states that a person may not serve as an acting officer if the president has submitted that person's nomination to the Senate for full appointment and if that person served as first assistant to the office for less than 90 days.\n\nDavies would replace Sean Cairncross , who was confirmed to the role in August 2025 and whose departure was first reported by Axios last week.\n\nTrump, at a White House press conference on Friday, said he decided to replace Cairncross \"because I didn't think that person was good enough.\"", "source": "CNBC Top News", "pub_date_str": "24 Nov 2026, 12:42 AM IST", "pub_date_relative": "11m ago"}, {"title": "Kalshi pauses operations in Utah after adverse federal court ruling", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Nov 2026, 12:42 AM IST", "pub_date_relative": "11m ago"}, {"title": "ESPN, NFL to show Super Bowl 61 in Imax theaters", "full_content": "Super Bowl 61 will be telecast live in hundreds of Imax theaters in February via a partnership with the NFL and Disney's ESPN, which has the broadcast rights to the 2027 game.\n\nIt marks the largest Imax live event in the company's history and the first time that the Super Bowl will be available in the format, according to a news release.\n\nThe four-hour event on Feb. 14 will include ESPN's main Super Bowl game telecast, as well as Jay-Z's halftime performance and pregame and postgame coverage.\n\nTickets will be available for theaters in the United States and select international markets, including Australia, New Zealand and Brazil. Tickets are expected to go on sale in January. Pricing was not disclosed.\n\n\"Watching the Super Bowl with your fellow fans is one of the great shared experiences in sports, and this first-of-its-kind collaboration with the NFL and IMAX takes it to a historic new scale,\" said Ken Potrock, president of major event integration for The Walt Disney Company.\n\nIn addition to ESPN channels, this season's championship game will also be available on streaming platform Disney+ as well as Disney's broadcast network ABC.", "source": "CNBC Top News", "pub_date_str": "24 Nov 2026, 12:38 AM IST", "pub_date_relative": "15m ago"}, {"title": "TD Cowen names top infrastructure software stock for 2027", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Nov 2026, 12:38 AM IST", "pub_date_relative": "15m ago"}, {"title": "Nvidia, Micron among market cap stock movers on Monday", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Nov 2026, 12:37 AM IST", "pub_date_relative": "16m ago"}, {"title": "Kiniksa Pharmaceuticals stock hits all-time high of 99.37 USD", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Nov 2026, 12:37 AM IST", "pub_date_relative": "16m ago"}, {"title": "Jensen Huang reinstated as Nvidia CEO, board says - BBC", "full_content": "Jensen Huang reinstated as Nvidia CEO, board says BBC Stock market today: Dow, S&P 500, Nasdaq surge as Jensen Huang's reinstatement at Nvidia sparks stunning rally Yahoo Finance Congress reacts with anger and skepticism about Jensen Huang reinstatement NBC News Trump tells CNBC \u2018I made the deal\u2019 to reinstate Nvidia\u2019s Jensen Huang CNBC NVIDIA Board Reinstates Jensen Huang as President, CEO and Board Director NVIDIA Newsroom", "source": "Google News Business", "pub_date_str": "24 Nov 2026, 12:36 AM IST", "pub_date_relative": "17m ago"}, {"title": "Super Bowl LXI to be shown in IMAX theaters for first time", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Nov 2026, 12:34 AM IST", "pub_date_relative": "19m ago"}, {"title": "Jensen Huang went to war with Washington \u2014 and won a path to China - The Washington Post", "full_content": "Jensen Huang went to war with Washington \u2014 and won a path to China The Washington Post We shopped 147 early Black Friday sales to find the 98 best deals worth shopping now CNN Opinion | The Enraging Hypocrisy at the Heart of the Nvidia Scandal The New York Times A fight over chips is roiling Donald Trump\u2019s cabinet The Economist American State Capitalism Helped Produce the Nvidia Scandal WSJ", "source": "Google News Business", "pub_date_str": "24 Nov 2026, 12:33 AM IST", "pub_date_relative": "21m ago"}, {"title": "Williams Companies director Robb Turner buys $646,500 in shares", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Nov 2026, 12:31 AM IST", "pub_date_relative": "23m ago"}, {"title": "CB Consumer Confidence highlights economic data due Tuesday", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Nov 2026, 12:30 AM IST", "pub_date_relative": "23m ago"}, {"title": "Trump is open to capping credit-card interest rates \u2014 but holiday shoppers shouldn\u2019t bank on it yet", "full_content": "As Americans prepare to pull out their credit cards for the holiday shopping season, President Donald Trump is saying he\u2019s up for capping the interest rates they\u2019re paying on their cards.", "source": "MarketWatch Top Stories", "pub_date_str": "24 Nov 2026, 12:25 AM IST", "pub_date_relative": "29m ago"}, {"title": "An options strategy for making even more of your money back in Nvidia", "full_content": "Nvidia's board has officially reinstated Jensen Huang as CEO, igniting a roughly 28% relief rally into the low-$160s after last week's brutal sell-off drove shares down to $125.53. While Huang's return removes a major leadership vacuum, the stock still sits far below its $243.37 52-week high and autumn trading ranges above $200.\n\nTrapped shareholders now face a classic post-crash hurdle: heavy overhead supply. Investors who bought near prior peaks often use sharp rebounds to exit at breakeven, creating stubborn technical resistance between $175 and $210 \u2014 especially with congressional testimony and export scrutiny still lingering.\n\nNvidia, YTD Rather than waiting passively for a full V-shaped surge to all-time highs, underwater holders can deploy a stock repair strategy geared toward a partial recovery.\n\nFor every 100 shares of NVDA held, an investor can overlay a January 17/195 1x2 call ratio spread for a net debit of $1.10 ($110 per lot):\n\nBecause elevated post-event implied volatility inflates the value of the two short $190 calls, traders can finance nearly the entire cost of the long $170 call for just $1.10 out of pocket. This structure acts as a leveraged recovery accelerator across the 175-to-195 resistance zone without adding margin risk, since one short call is covered by the existing shares and the other by the long $175 call. At January expiration, three outcomes govern the position:\n\nThe trade-off is capped upside above $214.90, making the strategy ideal for shareholders who view 195\u2013215 as a realistic medium-term ceiling rather than a mere pit stop.\n\nDisclosures: Tidal owns/holds all the securities mentioned in the article.\n\nAll opinions expressed by CNBC Pro contributors are solely their opinions and do not reflect the opinions of CNBC, or its parent company or affiliates, and may have been previously disseminated by them on television, radio, internet or another medium.", "source": "CNBC Top News", "pub_date_str": "24 Nov 2026, 12:22 AM IST", "pub_date_relative": "31m ago"}, {"title": "Chicago soybeans higher on meal demand; wheat gains on supply concerns", "full_content": "CHICAGO, Nov 23 (Reuters) - Chicago soybean futures rose on Monday, supported by strong demand for soymeal. Wheat and corn were choppy amid light volume in pre-Thanksgiving trading.\n\nChicago Board of Trade most-active soybeans were last 2-3/4 cents higher at $12.23-1/2 per bushel as of 12:15 CT p.m.(1815 GMT). Wheat rose 3/4 cent to $5.75 a bushel, and corn fell 2-1/4 cents to $4.32-1/4 a bushel.\n\n\"Holiday trade this week doesn't have the ingredients to give big moves in either direction with volume fading out as week goes on,\" said Randy Place, analyst at Hightower Report.\n\nSoymeal has been firm amid improving demand, lending support to soybean futures.\n\n\"We're still trying to recover from tight meal supplies when the harvest started slow and we had crush plants that had to slow or shut down,\" Place said. \"The meal pipeline has been slow to replenish over the last month or two.\"\n\nSoybeans rose on Friday after the US Department of Agriculture announced sales of 100,000 metric tons of US soymeal to Spain.\n\nWheat gained underlying support from concerns about potential supply disruptions following a Baltic Sea shipping attack and new import demand with a big tender from Pakistan to buy 800,000 tons of wheat.\n\nHostilities between Russia and Ukraine were in focus, after a Russian cargo ship was hit by drones and caught fire in the Baltic Sea on Saturday, seen as an attack by Ukraine.", "source": "LiveMint Markets", "pub_date_str": "24 Nov 2026, 12:20 AM IST", "pub_date_relative": "33m ago"}, {"title": "CrowdStrike\u2019s Zscaler deal sets up Palo Alto rivalry, R.F. Lafferty analyst says", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Nov 2026, 12:20 AM IST", "pub_date_relative": "33m ago"}, {"title": "Amazon may have just found a \u2018cheap\u2019 way to get a lot more out of its chips", "full_content": "Amazon\u2019s deal for Decart\u2019s AI technology, with a reported price of $7.5 billion, may be a relatively inexpensive way to boost the speed and efficiency of its custom chips, says an analyst.", "source": "MarketWatch Top Stories", "pub_date_str": "24 Nov 2026, 12:17 AM IST", "pub_date_relative": "37m ago"}, {"title": "Why is Alphabet stock surging today?", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Nov 2026, 12:16 AM IST", "pub_date_relative": "38m ago"}, {"title": "Trump\u2019s push to reinstate Jensen Huang signals Nvidia\u2019s CEO is too big to fail", "full_content": "\u201cThe bigger threat would be losing the brainpower of somebody like Jensen,\u201d the president said amid concerns about corporate governance rules and export controls", "source": "MarketWatch Top Stories", "pub_date_str": "24 Nov 2026, 12:13 AM IST", "pub_date_relative": "41m ago"}, {"title": "Congress shreds Nvidia's 'outrageous' decision to bring back Huang: 'Failure of character'", "full_content": "Members of Congress from both parties on Monday expressed outrage and incredulity, and doubled down on their calls for investigations, after Nvidia announced it has reinstated Jensen Huang as its president and CEO.\n\nThe resurrection of Huang, who had resigned from the artificial intelligence behemoth just 11 days earlier, raises more questions about the company's decision-making and the Trump administration's national security assessments, on top of existing concerns about Nvidia's advanced AI chips being diverted to China, the lawmakers said.\n\n\"It's inexplicable to me why they want this guy back as CEO,\" Rep. Don Bacon , R-Neb., a China hawk who is retiring from Congress, told CNBC in a phone interview. \"To me it's a failure of character.\"\n\nPresident Donald Trump told CNBC in an extended interview later Monday morning that he personally intervened to convince Nvidia's board to bring Huang back, saying, \"I made the deal.\"\n\nBacon, chairman of the House Subcommittee on Cyber, Information Technologies, and Innovation, said he wants the next Congress to conduct thorough oversight, while questioning the Trump administration's motives.\n\n\"Somebody's responsible for this, and it may be\" Commerce Secretary Howard Lutnick, whose department is responsible for setting U.S. export controls on AI chips, Bacon said. \"But I think we should get to the bottom of this.\"\n\nThe Commerce Department didn't immediately respond to a request to comment on Bacon's remarks.\n\nHuang, who is scheduled to testify before multiple committees on Capitol Hill starting Dec. 1, is \"going to get high scrutiny in a bipartisan way when he comes next week,\" Bacon said.", "source": "CNBC World Economy", "pub_date_str": "24 Nov 2026, 12:12 AM IST", "pub_date_relative": "41m ago"}, {"title": "Morgan Stanley says this is a big buying opportunity: \u2018We\u2019re not going to miss it\u2019", "full_content": "Last week's sell-off gave sentiment and portfolio positioning a clear 'capitulation signal,' creating a buying opportunity.", "source": "CNBC Top News", "pub_date_str": "24 Nov 2026, 12:12 AM IST", "pub_date_relative": "41m ago"}, {"title": "Up to 5 InvITs expected to go public by March 2027? Which private trusts are likely to launch IPOs - Details here", "full_content": "INFRA INDINFR ANZEN ENERGY SHREMINVIT ROADSTAR Livemint Published 24 Nov 2026, 12:02 AM IST Prefer Livemint on Google India's Infrastructure Investment Trust (InvIT) market is preparing for a fresh wave of public offerings, with four to five privately placed trusts expected to tap the capital markets by March 2027 and collectively raise around \u20b9 17,000 crore.\n\nThe proposed IPOs come amid growing investor interest in infrastructure-backed investment products and increasing efforts by developers to unlock capital from operational assets to finance future expansion.\n\nAccording to a PTI report citing investment bankers, several privately placed InvITs are considering a transition to the public market. The development reflects the growing importance of the trust structure as an alternative source of long-term infrastructure financing.\n\nThe Bharat InvITs Association estimates that the sector has mobilised around \u20b9 88,000 crore through equity issuances during FY23-FY25. In March 2026, the National Highways Authority of India (NHAI)-sponsored Raajmarg Infra Investment Trust raised \u20b9 6,000 crore through its initial public offering.\n\nAmong the proposed offerings, Brookfield-backed Altius Telecom Infrastructure Trust has filed for a potential \u20b9 6,000-crore IPO as it looks to convert from a privately placed trust into a publicly offered InvIT .\n\nInvestcorp-backed NDR InvIT Trust is also planning to make the transition through a public issue of up to \u20b9 750 crore.\n\nMeanwhile, KKR and Ontario Teachers' Pension Plan (OTPP)-sponsored Vertis Infrastructure Trust is exploring a potential IPO, according to the report.\n\nThe proposed offerings could significantly expand the number of publicly accessible infrastructure investment products and provide developers with additional avenues to raise capital.", "source": "LiveMint Markets", "pub_date_str": "24 Nov 2026, 12:02 AM IST", "pub_date_relative": "51m ago"}, {"title": "Amazon to acquire AI startup Decart's chip software, hire founders", "full_content": "Amazon is scooping up much of the technology and talent behind artificial intelligence startup Decart, marking the latest reverse acquihire deal by a major tech company.\n\nIn a Monday blog post , Amazon said it agreed to purchase Decart's \"proprietary technology\" and hire the startup's three founders, as well as their AI researchers and engineers.\n\nThe Israeli startup, founded in 2023, is best known for its software that lets developers sync their AI models across different chips, allowing them to switch hardware quickly, known as the Decart Optimization Stack.\n\n\"Every leap forward in AI starts with getting more out of every chip,\" Peter DeSantis, a senior vice president at Amazon who oversees foundation models, custom silicon and quantum computing development, said in a statement. \"More efficient compute means better training, better reinforcement learning, faster inference, and better models for customers at a lower cost.\"\n\nDeSantis added, \"From our earliest work with Decart, we knew they were the kind of technologically fearless team who would help us push it even further.\"\n\nAmazon has moved deeper into building custom AI chips amid insatiable demand for the technology, and as companies seek alternatives to Nvidia , the dominant provider. Amazon has positioned its Trainium and Inferentia chips as lower-cost options for AI developers.\n\nLast month, Amazon CEO Andy Jassy said the company plans to make its Trainium chips externally available for the first time in \"late in 2027.\"\n\nSeveral outlets reported Amazon will pay $7.5 billion for Decart's assets, citing people familiar with the matter. Amazon declined to comment on the terms of the deal.", "source": "CNBC World Economy", "pub_date_str": "23 Nov 2026, 11:53 PM IST", "pub_date_relative": "1h ago"}, {"title": "Trump administration proposes rule that could curb ESG investing in 401(k)s", "full_content": "The Trump administration proposed a rule on Monday that officials said they expect to severely cripple so-called ESG investing in workplace retirement plans like 401(k)s.\n\nThe proposed regulation , if finalized, would amend provisions under the Employee Retirement Income Security Act of 1974, or ERISA, to clarify how employers and other plan \"fiduciaries\" can apply their duty of loyalty to 401(k) investors.\n\nThe rule affirms that the people who choose investments for their company retirement plan must make decisions \"solely in the financial interests of workers and retirees, not to advance political or social agendas,\" U.S. Secretary of Labor Keith Sonderling said Monday in a written statement.\n\nESG \u2014 short for environmental, social and governance \u2014 funds let people invest according to certain values like curbing climate change or improving corporate diversity. They're also known as socially responsible, sustainable, impact or values-based funds.\n\n\"We make clear in this rule that when you are selecting investments for a retirement plan ... you may not have any ulterior motives or collateral interests,\" a Labor Department official said during a press briefing Monday morning.\n\n\"We believe that will inform all fiduciaries as to whether an impact fund or ESG fund is appropriate for retirement funds,\" the official said. \"We believe the answer will be very rarely.\"\n\nAlready, few 401(k) plans offer ESG funds \u2014 partly due to whipsawing federal policy around their use .\n\nAbout 5% of 401(k) plans offered an ESG fund in 2025, according to a Plan Sponsor Council of America report issued earlier this month. On average, less than 1% of overall investor assets in 401(k) plans are held in ESG funds, the report said.", "source": "CNBC Top News", "pub_date_str": "23 Nov 2026, 11:44 PM IST", "pub_date_relative": "1h ago"}, {"title": "See how much more money the richest Americans are spending on the holidays compared to everyone else", "full_content": "Most households are getting \u201csqueezed by rising costs of everyday goods,\u201d according to Teneo, but upper-income households \u201care showing resilience.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "23 Nov 2026, 11:44 PM IST", "pub_date_relative": "1h ago"}, {"title": "Wall Street analysts scramble to upgrade Nvidia\u2019s stock after Huang\u2019s return", "full_content": "Nvidia welcomed back former CEO Jensen Huang on Monday, removing much of the concern that drove down the stock before and after his departure.", "source": "CNBC Top News", "pub_date_str": "23 Nov 2026, 11:41 PM IST", "pub_date_relative": "1h ago"}, {"title": "Stocks making the biggest moves Monday: Boeing, Nvidia, CoreWeave, Newmont & more", "full_content": "A slate of artificial intelligence stocks surged on the heels of Jensen Huang's return to the helm of Nvidia, with CoreWeave and Micron Technology soaring on Monday.\n\nA rally in gold prices also lifted shares of mining stocks like Newmont and Gold Fields.\n\nFollow below as CNBC highlights the biggest stock moves of the day.\n\nDecember gold futures rallied Monday Mining stocks rallied Monday alongside bullish moves in the price of gold, silver and copper. Gold futures climbed about 4%, silver by roughly 5% and copper added nearly 3%.\n\nNewmont Mining , AngloGold Ashanti , Coeur Mining and Gold Fields Ltd. all surged more than 7%, while Freeport McMoRan jumped almost 8%.\n\nShares of International Paper fell 4% after the packaging solutions company announced Monday that its board had approved the spinoff of its Europe, Middle East and Africa (EMEA) packaging business into a publicly traded company, DS Smith.\n\nInternational Paper will remain an important shareholder, retaining a 19.9% stake.\n\nThe company expects to complete the separation and distribution on Dec. 7, 2026, after the satisfaction of customary conditions and regulatory approvals are met. Additionally, the company announced its intention to delist from the London Stock Exchange after the completion of the separation.", "source": "CNBC Top News", "pub_date_str": "23 Nov 2026, 11:35 PM IST", "pub_date_relative": "1h ago"}, {"title": "Stocks making the biggest moves Monday: Boeing, Nvidia, CoreWeave, Newmont & more - CNBC", "full_content": "Stocks making the biggest moves Monday: Boeing, Nvidia, CoreWeave, Newmont & more CNBC Biggest stock movers Monday: NVDA, TSLA, and more Seeking Alpha TeraWulf, Arista Networks, Dell, CoreWeave, and Lumentum shares skyrocket, what you need to know StockStory Nvidia, Micron, Arm Holdings, Kymera Therapeutics And Other Big Stocks Moving Higher On Monday Benzinga Nvidia, Intel among market cap stock movers on Monday By Investing.com Investing.com India", "source": "Google News Business", "pub_date_str": "23 Nov 2026, 11:35 PM IST", "pub_date_relative": "1h ago"}, {"title": "\u2018This establishes a bottom\u2019: Jensen Huang\u2019s return seen as likely to stop market sell-off, for now", "full_content": "The major averages of U.S. equities surged on Monday after Nvidia reinstated Jensen Huang as CEO, giving investors some hope that the relentless selling pressure seen last week may subside \u2014 at least temporarily.\n\nThe relief rally came after the Dow Jones Industrial Average , S&P 500 and Nasdaq Composite ended Friday's session in correction territory . The S&P alone tumbled more than 9% after Huang's departure from the chipmaker was initially announced on Nov. 12 through Friday.\n\nThat sell-off may be over \u2014 at least temporarily \u2014 according to Wall Street experts. But key questions linger around Nvidia and the artificial intelligence trade that has carried the bull market.\n\n\"I think the AI trade is back on,\" said Mark Gibbens, founder of Gibbens Capital Management. \"I certainly believe this establishes a bottom and a floor in the AI trade and the recent market weakness.\"\n\nHe added that the news likely doesn't alleviate all concerns that have driven recent declines, including worries about data center approvals after the midterms and fears that the capital expenditures cycle may have peaked . But Gibbens thinks the \"keystone\" role that Nvidia plays in both financing the AI buildout and the technology's supply chain means a more stable picture of the chipmaker creates a brighter view of the overall market than before.\n\nAn encouraging sign that the correction may be over came even before Nvidia's Monday announcement, according to Art Hogan, chief market strategist at B. Riley Wealth Management. He said Friday's selling, which was indiscriminate and affected sectors beyond just AI-exposed companies, showed a bottom may have been building.\n\n\"Sometimes you just hit that crescendo where you know the market gets oversold, and I would argue that we'd be higher today, even without the Nvidia news,\" he said. Indeed, futures tied to the major stock indexes were broadly higher on Sunday night, before any news regarding Huang's return.", "source": "CNBC Finance", "pub_date_str": "23 Nov 2026, 11:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "77 best early Black Friday deals: Bose, Apple, Nintendo on sale - Mashable", "full_content": "77 best early Black Friday deals: Bose, Apple, Nintendo on sale Mashable Black Friday Deals Are Already Rolling In \u2014 Here Are the Best | Reviews by Wirecutter The New York Times Black Friday tech deals: Live updates on sales from Apple, Amazon, Bose, Ring and more during Cyber Week 2026 Yahoo Tech Black Friday deals are here and I\u2019m tracking 71+ of the best ones live up to 70% off NBC News The 15 best Black Friday sales to shop today USA Today", "source": "Google News Business", "pub_date_str": "23 Nov 2026, 11:25 PM IST", "pub_date_relative": "1h ago"}, {"title": "Stock Market Today: Dow Surges As Trump Says This On Huang's Nvidia Return; AI Plays Rocket (Live Coverage) - Investor's Business Daily", "full_content": "Stock Market Today: Dow Surges As Trump Says This On Huang's Nvidia Return; AI Plays Rocket (Live Coverage) Investor's Business Daily See more headlines & perspectives on Google News", "source": "Google News Business", "pub_date_str": "23 Nov 2026, 11:25 PM IST", "pub_date_relative": "1h ago"}, {"title": "Nvidia stock massive surge, Jensen reinstatement impact on Micron vs AMD vs Sandisk vs Oracle shares - Data details", "full_content": "Nvidia's dramatic stock market comeback following the reinstatement of co-founder Jensen Huang as chief executive has reignited investor interest across the broader artificial intelligence (AI) and semiconductor space.\n\nNvidia shares jumped nearly 37% to the day's high of $171.50 apiece. If the rally holds through the session, it will erase most of the losses suffered since the reports of extramarital affairs, including one involving an alleged Chinese spy, surfaced.\n\nThe company's sharp rebound has also lifted several AI-linked stocks, including Micron Technology, which surged 22%. It was followed by Intel, Advanced Micro Devices (AMD), Qualcomm, Sandisk, Marvell Technology and Oracle, all of which traded higher, with gains of up to 23% at their respective intraday highs.\n\nThe rally also powered the Nasdaq to surge 6.6%, putting it on track for its biggest one-day percentage gain since April 2025, after the index suffered its worst weekly performance since 2020. The broader market was on track to add more than $2 trillion in market value, with Nvidia alone accounting for nearly half of the increase.\n\nAI-linked stocks had faced heavy selling pressure recently amid concerns over elevated valuations. Meanwhile, Democratic gains in Congress had raised fears that data centre expansion in key states could face regulatory setbacks.\n\nHowever, Jensen Huang's reinstatement as Nvidia CEO has boosted sentiment across AI infrastructure stocks, while a decline in crude oil prices has also emerged as another key catalyst for the market recovery.\n\nHuang's return to Nvidia marked a dramatic turn of events, with media reports alleging that he had been involved in an extramarital affair with Alisa Huan, who was alleged to be a Chinese spy.", "source": "LiveMint Markets", "pub_date_str": "23 Nov 2026, 11:24 PM IST", "pub_date_relative": "1h ago"}, {"title": "Consumer stocks, seen as safe bet amid cracks in AI trade, are among the S&P 500\u2019s biggest losers Monday", "full_content": "Shares of Kroger and Tyson Foods are down, as Nvidia storms higher", "source": "MarketWatch Top Stories", "pub_date_str": "23 Nov 2026, 11:24 PM IST", "pub_date_relative": "1h ago"}, {"title": "Gold, Silver Rates Highlights: Check Latest Gold Rates In Mumbai, Delhi, Chennai, Hyderabad, Bengaluru And Kolkata", "full_content": "Gold and silver prices rebounded in early Asian trade after steep losses last week amid reduced expectations of a US rate hike.", "source": "NDTV Profit", "pub_date_str": "23 Nov 2026, 11:22 PM IST", "pub_date_relative": "1h ago"}, {"title": "'Jensen Huang Took A Week Off To Play GTA 6': Internet Flooded With Memes After Nvidia CEO's Return", "full_content": "Here's a look at some notable attempts at humour with regards to the reinstatement of Jensen Huang as CEO of Nvidia.", "source": "NDTV Profit", "pub_date_str": "23 Nov 2026, 11:21 PM IST", "pub_date_relative": "1h ago"}, {"title": "CrowdStrike to buy Zscaler in $44 billion deal as AI supercharges cyberattacks", "full_content": "CrowdStrike plans to buy Zscaler for $43.9 billion in an all-stock deal that combines two significant security businesses at a time when artificial intelligence is supercharging attacks.\n\nShares of CrowdStrike dropped 10% on Monday, while Zscaler surged more than 15%.\n\nThe deal is expected to close in the second half of CrowdStrike's fiscal year 2028. Under the agreement, Zscaler shareholders will receive 1.135 CrowdStrike shares for each share.\n\nCrowdStrike's acquisition pushes the Austin, Texas-based cyber vendor into the network security market and comes amid a massive year for cybersecurity deal-making in the wake of high-profile hacks like Hugging Face.\n\n\"With Zscaler, we're building cybersecurity's operating system: a single control plane to deploy AI, control AI, and enable any agentic application to run safely,\" CrowdStrike CEO George Kurtz said in a statement. \"We see a path to become the largest AI safety and security company the world has ever seen.\"\n\nRecent outages affecting Microsoft, the Federal Aviation Administration and JPMorgan Chase have sparked anxiety as businesses accelerate software patching and upgrades to aging systems in an effort to prevent bad actors from exploiting software vulnerabilities with AI.\n\nCrowdStrike has been a major beneficiary of skyrocketing demand for AI security, with shares soaring about 80% this year as of Monday's open. Zscaler shares are up about 5% year to date after Monday's surge. Their combined market value exceeded $265 billion as of Friday's close, behind market leader Palo Alto Networks at $282 billion.\n\nThe deal marks CrowdStrike's biggest acquisition to date and is among the largest in the sector as businesses consolidate and ramp up defenses to fend off AI-powered attacks.", "source": "CNBC World Economy", "pub_date_str": "23 Nov 2026, 11:20 PM IST", "pub_date_relative": "1h ago"}, {"title": "Average 401(k), IRA balances fall as more workers raid their accounts, Fidelity says", "full_content": "Retirement account balances fell slightly in the third quarter amid market volatility , according to data released Monday from Fidelity Investments , the nation's largest provider of 401(k) savings plans.\n\nSome workers also tapped their retirement accounts for cash, signaling that persistent affordability pressures continue to strain household finances, said Mike Shamrell, Fidelity's vice president of thought leadership.\n\nThe average 401(k) balance slipped 2% from the previous quarter to $152,500, while the average individual retirement account balance was down 1% to $142,261, Fidelity found. Both figures hit record highs during the second quarter.\n\nDespite the third-quarter decline, average balances in IRAs, 401(k)s and 403(b) plans \u2014 which are 401(k)-type plans offered by entities like public schools, churches and nonprofits \u2014 are higher year-over-year and continue to trend up over the long run.\n\nWall Street's major averages finished the third quarter on mixed footing , driven in part by war with Iran, which blocked passage through the Strait of Hormuz, a key transit artery for global energy supplies, and caused oil prices to spike. The stock market's slowdown in the third quarter marked a cooling after the double-digit gains posted in the previous quarter.\n\nThe S&P 500 index added 2.03% over the three-month period, while the Dow Jones Industrial Average fell 1.9% and the tech-heavy Nasdaq Composite ended the quarter 2.2% higher.\n\nAt the same time, financial pressures pushed more savers to reduce their contributions to retirement plans.\n\nThe average 401(k) contribution rate, including employee and employer contributions, edged down to 14.3% from 14.4% in the second quarter, Fidelity found. Fidelity's recommended combined annual savings benchmark is 15%.", "source": "CNBC Top News", "pub_date_str": "23 Nov 2026, 11:18 PM IST", "pub_date_relative": "1h ago"}, {"title": "The leveraged short Nvidia ETFs have just blown up", "full_content": "You love to see it", "source": "FT Markets", "pub_date_str": "23 Nov 2026, 11:14 PM IST", "pub_date_relative": "1h ago"}, {"title": "Checked IPO GMP Before Applying? SEBI Wants Intermediaries To Stop Publishing It", "full_content": "SEBI has asked registered intermediaries to stop publishing IPO grey market premiums, warning that the unofficial figures can mislead investors and lack regulatory protection.", "source": "NDTV Profit", "pub_date_str": "23 Nov 2026, 11:07 PM IST", "pub_date_relative": "1h ago"}, {"title": "More AI jobs are coming. That\u2019s one of the big hiring trends in 2027.", "full_content": "Maybe artificial intelligence will end up destroying lots of jobs, but the new technology might be creating more work in the short run.", "source": "MarketWatch Top Stories", "pub_date_str": "23 Nov 2026, 11:07 PM IST", "pub_date_relative": "1h ago"}, {"title": "The three most common holiday scams \u2014 and how to avoid them - The Washington Post", "full_content": "The three most common holiday scams \u2014 and how to avoid them The Washington Post Before you hit \u2018buy\u2019: How AI is making Black Friday scams harder to spot Global News Ohio Department of Commerce warns shoppers about holiday cyber scams Peak of Ohio Recent tech outages may mean more holiday scams. What to look for USA Today Electronic Transactions Association: How to avoid scammers while holiday shopping 13WHAM-TV", "source": "Google News Business", "pub_date_str": "23 Nov 2026, 11:02 PM IST", "pub_date_relative": "1h ago"}, {"title": "A 66-year-old nurse faces retirement with just $500 saved. Who\u2019s to blame?", "full_content": "\u201cRetirement is a financial status, not an age.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "23 Nov 2026, 11:00 PM IST", "pub_date_relative": "1h ago"}, {"title": "Nasdaq jumps 7% as Nvidia shares soar", "full_content": "Chip giant up 33% after Huang reinstated while S&P gains 4.3%", "source": "FT Markets", "pub_date_str": "23 Nov 2026, 10:59 PM IST", "pub_date_relative": "1h ago"}, {"title": "Jensen Huang Returns, Bernstein Flips: Nvidia Gets Two-Week Rating Rebound; With A $200 Catch", "full_content": "This comes two weeks afterBernstein was reluctant to buy the dip on Nvidia's shares, citing uncertainty around the chipmaker's leadership and potential investigations following Jensen Huang's resignation as chief executive officer (CEO).", "source": "NDTV Profit", "pub_date_str": "23 Nov 2026, 10:57 PM IST", "pub_date_relative": "1h ago"}, {"title": "Here's where we stand on AMD shares after Jensen Huang's return to Nvidia", "full_content": "The Investing Club holds its \"Morning Meeting\" every weekday at 10:20 a.m. ET.", "source": "CNBC Top News", "pub_date_str": "23 Nov 2026, 10:54 PM IST", "pub_date_relative": "1h ago"}, {"title": "Jensen Huang reinstated as Nvidia CEO. Stock skyrockets 33%", "full_content": "Nvidia on Monday announced Jensen Huang has been reinstated as CEO , effective immediately, a dramatic twist in a scandal that hammered the chipmaker's stock price and rocked the tech and artificial intelligence industries.\n\nThe board of directors said it unanimously voted to reinstate Huang following \"a series of discussions and meetings\" with him. The board added that it \"received input from senior levels of the United States government\" and that it is confident Huang's reinstatement \"poses no national security risk.\"\n\nPresident Donald Trump told CNBC on Monday that he had been speaking to Nvidia's board \"directly and indirectly,\" and that Huang \"did nothing wrong.\" Trump said he talked to Huang on Sunday and asked him to promise to \"work hard.\"\n\nHuang resigned from his role as chief executive earlier this month after a series of shocking reports about multiple extramarital affairs, including one with an alleged Chinese spy. The New York Times reported on Sunday that the woman, Alice Huang, was in contact with an officer of China's Ministry of State Security during at least part of the time that she was engaging in a relationship with Huang.\n\nShares of Nvidia surged 33% following Huang's reinstatement. The stock had shed nearly 33% from the time Huang admitted to an extramarital affair on Nov. 8. The stock closed at $186.64 on Nov.6.\n\n\"I am honored to return to NVIDIA and lead one of the most consequential technology companies in the world at the beginning of a new industrial revolution,\" Huang said in a statement. \"I take this responsibility with the greatest humility and renewed commitment. I want to thank the NVIDIA Board for its confidence and deliberation through this process.\"\n\nNvidia stock chart. Senior government officials briefed Nvidia's board late last week and communicated that no national security laws were violated, according to sources familiar with the discussion who asked to remain anonymous because they were not authorized to speak publicly.", "source": "CNBC World Economy", "pub_date_str": "23 Nov 2026, 10:53 PM IST", "pub_date_relative": "2h ago"}, {"title": "Trump tells CNBC \u2018I made the deal\u2019 to reinstate Nvidia\u2019s Jensen Huang", "full_content": "President Donald Trump told CNBC on Monday morning that he spoke directly to Nvidia 's board and urged them to reinstate CEO Jensen Huang .\n\n\"I spoke to them, let me put it that way,\" Trump told CNBC's Eamon Javers in a phone interview shortly after Nvidia's shock announcement that Huang was returning to lead the tech giant.\n\n\"And I convinced them,\" the president said. \"I made the deal.\"\n\nNvidia's decision to reinstate Huang came less than two weeks after he resigned. Huang had stepped down after admitting he cheated on his wife and amid claims his affairs included one with an alleged Chinese spy and two Nvidia employees.\n\nHuang's relationship with the suspected spy, Alice Huang, and her role as an executive at the Singapore-based company Megaspeed raised concerns that she was facilitating the diversion of Nvidia's most advanced semiconductor chip to China.\n\nTrump said Nvidia's board \"did ask for assurance on the national security threat,\" Trump said.\n\n\"And we gave them assurances at least with everything we know, and we know a lot,\" the president said.\n\nTrump said that after he spoke with Nvidia's board, \"when the deal was finished,\" he called Huang.", "source": "CNBC Top News", "pub_date_str": "23 Nov 2026, 10:46 PM IST", "pub_date_relative": "2h ago"}], "cfa": [{"title": "Gold rises as bargain hunters step in after steep weekly drop", "full_content": "Nov 23 (Reuters) - Gold prices recovered from a more than one-year low on Monday as investors bought the dip, while the market looked ahead to upcoming US inflation data for further clues on the Federal Reserve's interest rate trajectory.\n\nSpot gold climbed 3.5% to $3,654.97 per ounce by 2:10 p.m. ET (1910 GMT), after hitting its lowest level since September 2025 on Friday.\n\nGold prices fell more than 9% last week, as an AI-linked stocks selloff prompted some investors to liquidate gold to raise cash and meet margin requirements. [MKTS/GLOB]\n\n\"There is talk in the marketplace that if the stock indexes continue to melt down, that will prevent the Fed from raising interest rates. I think that's an outlier, but that's supporting the rebounds in the precious metals markets early this week,\" said Jim Wyckoff, a market analyst at American Gold Exchange.\n\n\"The next couple of days of trading will go a long way in determining whether we have put in market bottoms or whether this is just a dead camp bounce in bear markets.\"\n\nWhile market participants continue to expect a 25-basis-point Fed rate hike in December, they have priced out chances of a larger 50-basis-point increase, according to CME's FedWatch Tool.\n\nHigher interest rates reduce the appeal of non-yielding bullion.\n\nTraders are awaiting the October Personal Consumption Expenditures index, the Fed's preferred inflation measure, due on Wednesday, to gauge price pressures and determine the likelihood of further rate hikes.", "source": "LiveMint Markets", "pub_date_str": "24 Nov 2026, 12:49 AM IST", "pub_date_relative": "4m ago", "cfa_topics": ["Economics", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Tech stocks rally after Nvidia board approves Jensen Huang's return as CEO", "full_content": "Major tech stocks rebounded across the board Monday, following Friday's steep sell-off when artificial intelligence stocks fell in the Nasdaq's worst week since 2020.\n\nShares of Nvidia surged 30%, gaining back nearly $1 trillion in market cap after the company announced Monday morning that Jensen Huang was reinstated as CEO .\n\nNvidia's surge and Huang's reinstatement followed a more than 40% slump in the stock over the past month. The company has been embattled as reports surfaced about Huang's multiple extramarital affairs \u2014 one of which was with a woman U.S. intelligence reportedly believes to be a Chinese spy. Huang resigned as CEO of the company he founded on Nov. 12.\n\nThe Nasdaq Composite surged more than 6% Monday after sliding 10% last week. Tech stocks had a rocky week as investors remained nervous about the valuation of some AI companies and business models. All three major averages ended last week in correction territory, and the Nasdaq turned negative for 2026.\n\nNvidia stock chart Shares of Big Tech companies and other stocks related to the AI trade saw a lift Monday on the Nvidia news.\n\nShares of Alphabet and Meta each surged 6%, Amazon was up 4% and Microsoft jumped 2.5%. SpaceX added 6%, Arm Holdings surged 16% and AMD added more than 6%. Dell and Micron posted some of the sector's biggest gains of the day, gaining 21% and 18%, respectively. The iShares Semiconductor ETF gained 13%.\n\nNeoclouds, which have seen a particularly choppy few months amid AI boom financing concerns, surged on Huang's reinstatement. Nebius and CoreWeave were up 20%, and Iren gained 23%.\n\nFollowing a brief premarket surge, Anthropic shares traded largely flat in its third day of trading. Anthropic raised a record $93.5 billion in its IPO. The stock gained 17% in its debut on Thursday, before closing down 8.5% on Friday.", "source": "CNBC World Economy", "pub_date_str": "24 Nov 2026, 12:49 AM IST", "pub_date_relative": "5m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Portfolio Management"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Oil falls around 3% on increased Middle East flows, Libyan pipeline restart", "full_content": "HOUSTON, Nov 23 (Reuters) - Oil prices shed nearly 3% on Monday as traders weighed a rise in supplies from the Middle East and the restart of a Libyan oil pipeline, offsetting some unease around shipping and refinery attacks in the region.\n\nBrent crude futures fell $2.62, or 2.83%, to $89.95 a barrel by 1:49 p.m. EDT. US West Texas Intermediate futures were down $2.68, or 3.21%, at $80.73 a barrel.\n\nEarlier in the session, Brent hit a session low of $88.60 a barrel, its lowest since August 27, while WTI fell to a low of $79.95, its lowest since August 26.\n\nUS crude oil and product inventories are expected to have risen by about 900,000 barrels in the week ended November 20, a preliminary Reuters poll of five analysts showed on Monday.\n\nLibya's Sharara oil pipeline has reopened and crude is beginning to flow into storage tanks at the Akakus facility in Zawiya, the chairman of the National Oil Corporation told Reuters on Monday.\n\nMeanwhile, JPMorgan expects oil futures to fall to the high $70s in the first half of 2027 due to an estimated supply surplus, with higher Middle East production outside Iran next year along with more supply from the Americas led by the US.\n\nBank of America said geopolitics would remain the key driver of oil prices, with relatively low global inventories leaving much of the world vulnerable to supply disruptions.\n\n\"It is partly the growing signs of a glut, but with each passing day it seems less likely that Trump will attack again,\" said IG chief market analyst Chris Beauchamp.", "source": "LiveMint Markets", "pub_date_str": "24 Nov 2026, 12:46 AM IST", "pub_date_relative": "7m ago", "cfa_topics": ["Derivatives", "Alternative Investments"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Nasdaq roars back by 6% as Nvidia soars on Huang\u2019s return, S&P 500 rebounds 5%: Live updates", "full_content": "U.S. equities surged on Monday after Nvidia reinstated Jensen Huang as CEO, reviving the artificial intelligence trade and pushing major indexes higher after all three major market averages ended Friday in a correction.\n\nThe S&P 500 added 5%, and the Nasdaq Composite jumped 6.7%. The Dow Jones Industrial Average gained 1,582 points, or 3.3%. Each of the three major averages is on pace for its best day since April 2025.\n\nNvidia soared 31% after the company's board returned Huang as the head of the company , effective immediately. Huang had resigned earlier this month after reportedly engaging in a number of extramarital affairs, one of which was with an alleged Chinese spy.\n\nPresident Donald Trump applauded the move and told CNBC that Huang \"did nothing wrong.\" The president also said that he spoke with Nvidia's board and \"convinced\" them to reinstate him.\n\n\"He had bad judgment having to do with somewhat unrelated incidents, but he did nothing wrong other than he created a chip that's invaluable, many chips that are invaluable,\" he told CNBC's Eamon Javers in a \" Squawk on the Street \" interview.\n\nOther stocks in the AI trade jumped in sympathy with Nvidia on Monday. Micron Technology added 19%, while CoreWeave skyrocketed 20%. Advanced Micro Devices was up 6%. \"Magnificent Seven\" members Alphabet and Meta Platforms popped 6% each, and Microsoft gained 2%.\n\n\"Jensen Huang's return restores and rebuilds confidence in the AI ecosystem: its major suppliers, its core building blocks, and its demand outlook,\" said Hendi Susanto, portfolio manager and research analyst at Gabelli Funds.\n\nTo be sure, the trade \"still has to push through a lot of noise about financing, geopolitics, durability and skepticism, even though companies across the AI supply chain keep reporting strong demand,\" Susanto added.", "source": "CNBC Top News", "pub_date_str": "24 Nov 2026, 12:45 AM IST", "pub_date_relative": "8m ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "DNI Jay Clayton tapped as acting national cyber director", "full_content": "Director of National Intelligence Jay Clayton has been tapped to serve as acting national cyber director while the Trump administration's permanent nominee for the role awaits Senate confirmation, a White House official told CNBC on Monday.\n\nTrump had already added artificial intelligence czar to Clayton's portfolio in October. The official spoke on condition of anonymity because the pick hasn't been announced.\n\nThe White House last week announced that President Donald Trump had picked Kirsten Davies , the Pentagon's chief information officer, to lead the Office of the National Cyber Director.\n\nThe U.S. cyber director advises the president on cybersecurity and coordinates U.S. cyber policy across federal agencies. Federal law states that a person may not serve as an acting officer if the president has submitted that person's nomination to the Senate for full appointment and if that person served as first assistant to the office for less than 90 days.\n\nDavies would replace Sean Cairncross , who was confirmed to the role in August 2025 and whose departure was first reported by Axios last week.\n\nTrump, at a White House press conference on Friday, said he decided to replace Cairncross \"because I didn't think that person was good enough.\"", "source": "CNBC Top News", "pub_date_str": "24 Nov 2026, 12:42 AM IST", "pub_date_relative": "11m ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "TD Cowen names top infrastructure software stock for 2027", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Nov 2026, 12:38 AM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Nvidia, Micron among market cap stock movers on Monday", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Nov 2026, 12:37 AM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Jensen Huang reinstated as Nvidia CEO, board says - BBC", "full_content": "Jensen Huang reinstated as Nvidia CEO, board says BBC Stock market today: Dow, S&P 500, Nasdaq surge as Jensen Huang's reinstatement at Nvidia sparks stunning rally Yahoo Finance Congress reacts with anger and skepticism about Jensen Huang reinstatement NBC News Trump tells CNBC \u2018I made the deal\u2019 to reinstate Nvidia\u2019s Jensen Huang CNBC NVIDIA Board Reinstates Jensen Huang as President, CEO and Board Director NVIDIA Newsroom", "source": "Google News Business", "pub_date_str": "24 Nov 2026, 12:36 AM IST", "pub_date_relative": "17m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "An options strategy for making even more of your money back in Nvidia", "full_content": "Nvidia's board has officially reinstated Jensen Huang as CEO, igniting a roughly 28% relief rally into the low-$160s after last week's brutal sell-off drove shares down to $125.53. While Huang's return removes a major leadership vacuum, the stock still sits far below its $243.37 52-week high and autumn trading ranges above $200.\n\nTrapped shareholders now face a classic post-crash hurdle: heavy overhead supply. Investors who bought near prior peaks often use sharp rebounds to exit at breakeven, creating stubborn technical resistance between $175 and $210 \u2014 especially with congressional testimony and export scrutiny still lingering.\n\nNvidia, YTD Rather than waiting passively for a full V-shaped surge to all-time highs, underwater holders can deploy a stock repair strategy geared toward a partial recovery.\n\nFor every 100 shares of NVDA held, an investor can overlay a January 17/195 1x2 call ratio spread for a net debit of $1.10 ($110 per lot):\n\nBecause elevated post-event implied volatility inflates the value of the two short $190 calls, traders can finance nearly the entire cost of the long $170 call for just $1.10 out of pocket. This structure acts as a leveraged recovery accelerator across the 175-to-195 resistance zone without adding margin risk, since one short call is covered by the existing shares and the other by the long $175 call. At January expiration, three outcomes govern the position:\n\nThe trade-off is capped upside above $214.90, making the strategy ideal for shareholders who view 195\u2013215 as a realistic medium-term ceiling rather than a mere pit stop.\n\nDisclosures: Tidal owns/holds all the securities mentioned in the article.\n\nAll opinions expressed by CNBC Pro contributors are solely their opinions and do not reflect the opinions of CNBC, or its parent company or affiliates, and may have been previously disseminated by them on television, radio, internet or another medium.", "source": "CNBC Top News", "pub_date_str": "24 Nov 2026, 12:22 AM IST", "pub_date_relative": "31m ago", "cfa_topics": ["Economics", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Chicago soybeans higher on meal demand; wheat gains on supply concerns", "full_content": "CHICAGO, Nov 23 (Reuters) - Chicago soybean futures rose on Monday, supported by strong demand for soymeal. Wheat and corn were choppy amid light volume in pre-Thanksgiving trading.\n\nChicago Board of Trade most-active soybeans were last 2-3/4 cents higher at $12.23-1/2 per bushel as of 12:15 CT p.m.(1815 GMT). Wheat rose 3/4 cent to $5.75 a bushel, and corn fell 2-1/4 cents to $4.32-1/4 a bushel.\n\n\"Holiday trade this week doesn't have the ingredients to give big moves in either direction with volume fading out as week goes on,\" said Randy Place, analyst at Hightower Report.\n\nSoymeal has been firm amid improving demand, lending support to soybean futures.\n\n\"We're still trying to recover from tight meal supplies when the harvest started slow and we had crush plants that had to slow or shut down,\" Place said. \"The meal pipeline has been slow to replenish over the last month or two.\"\n\nSoybeans rose on Friday after the US Department of Agriculture announced sales of 100,000 metric tons of US soymeal to Spain.\n\nWheat gained underlying support from concerns about potential supply disruptions following a Baltic Sea shipping attack and new import demand with a big tender from Pakistan to buy 800,000 tons of wheat.\n\nHostilities between Russia and Ukraine were in focus, after a Russian cargo ship was hit by drones and caught fire in the Baltic Sea on Saturday, seen as an attack by Ukraine.", "source": "LiveMint Markets", "pub_date_str": "24 Nov 2026, 12:20 AM IST", "pub_date_relative": "33m ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Trump\u2019s push to reinstate Jensen Huang signals Nvidia\u2019s CEO is too big to fail", "full_content": "\u201cThe bigger threat would be losing the brainpower of somebody like Jensen,\u201d the president said amid concerns about corporate governance rules and export controls", "source": "MarketWatch Top Stories", "pub_date_str": "24 Nov 2026, 12:13 AM IST", "pub_date_relative": "41m ago", "cfa_topics": ["Economics", "Corporate Issuers"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Congress shreds Nvidia's 'outrageous' decision to bring back Huang: 'Failure of character'", "full_content": "Members of Congress from both parties on Monday expressed outrage and incredulity, and doubled down on their calls for investigations, after Nvidia announced it has reinstated Jensen Huang as its president and CEO.\n\nThe resurrection of Huang, who had resigned from the artificial intelligence behemoth just 11 days earlier, raises more questions about the company's decision-making and the Trump administration's national security assessments, on top of existing concerns about Nvidia's advanced AI chips being diverted to China, the lawmakers said.\n\n\"It's inexplicable to me why they want this guy back as CEO,\" Rep. Don Bacon , R-Neb., a China hawk who is retiring from Congress, told CNBC in a phone interview. \"To me it's a failure of character.\"\n\nPresident Donald Trump told CNBC in an extended interview later Monday morning that he personally intervened to convince Nvidia's board to bring Huang back, saying, \"I made the deal.\"\n\nBacon, chairman of the House Subcommittee on Cyber, Information Technologies, and Innovation, said he wants the next Congress to conduct thorough oversight, while questioning the Trump administration's motives.\n\n\"Somebody's responsible for this, and it may be\" Commerce Secretary Howard Lutnick, whose department is responsible for setting U.S. export controls on AI chips, Bacon said. \"But I think we should get to the bottom of this.\"\n\nThe Commerce Department didn't immediately respond to a request to comment on Bacon's remarks.\n\nHuang, who is scheduled to testify before multiple committees on Capitol Hill starting Dec. 1, is \"going to get high scrutiny in a bipartisan way when he comes next week,\" Bacon said.", "source": "CNBC World Economy", "pub_date_str": "24 Nov 2026, 12:12 AM IST", "pub_date_relative": "41m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Morgan Stanley says this is a big buying opportunity: \u2018We\u2019re not going to miss it\u2019", "full_content": "Last week's sell-off gave sentiment and portfolio positioning a clear 'capitulation signal,' creating a buying opportunity.", "source": "CNBC Top News", "pub_date_str": "24 Nov 2026, 12:12 AM IST", "pub_date_relative": "41m ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Up to 5 InvITs expected to go public by March 2027? Which private trusts are likely to launch IPOs - Details here", "full_content": "INFRA INDINFR ANZEN ENERGY SHREMINVIT ROADSTAR Livemint Published 24 Nov 2026, 12:02 AM IST Prefer Livemint on Google India's Infrastructure Investment Trust (InvIT) market is preparing for a fresh wave of public offerings, with four to five privately placed trusts expected to tap the capital markets by March 2027 and collectively raise around \u20b9 17,000 crore.\n\nThe proposed IPOs come amid growing investor interest in infrastructure-backed investment products and increasing efforts by developers to unlock capital from operational assets to finance future expansion.\n\nAccording to a PTI report citing investment bankers, several privately placed InvITs are considering a transition to the public market. The development reflects the growing importance of the trust structure as an alternative source of long-term infrastructure financing.\n\nThe Bharat InvITs Association estimates that the sector has mobilised around \u20b9 88,000 crore through equity issuances during FY23-FY25. In March 2026, the National Highways Authority of India (NHAI)-sponsored Raajmarg Infra Investment Trust raised \u20b9 6,000 crore through its initial public offering.\n\nAmong the proposed offerings, Brookfield-backed Altius Telecom Infrastructure Trust has filed for a potential \u20b9 6,000-crore IPO as it looks to convert from a privately placed trust into a publicly offered InvIT .\n\nInvestcorp-backed NDR InvIT Trust is also planning to make the transition through a public issue of up to \u20b9 750 crore.\n\nMeanwhile, KKR and Ontario Teachers' Pension Plan (OTPP)-sponsored Vertis Infrastructure Trust is exploring a potential IPO, according to the report.\n\nThe proposed offerings could significantly expand the number of publicly accessible infrastructure investment products and provide developers with additional avenues to raise capital.", "source": "LiveMint Markets", "pub_date_str": "24 Nov 2026, 12:02 AM IST", "pub_date_relative": "51m ago", "cfa_topics": ["Corporate Issuers", "Alternative Investments", "Portfolio Management"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Amazon to acquire AI startup Decart's chip software, hire founders", "full_content": "Amazon is scooping up much of the technology and talent behind artificial intelligence startup Decart, marking the latest reverse acquihire deal by a major tech company.\n\nIn a Monday blog post , Amazon said it agreed to purchase Decart's \"proprietary technology\" and hire the startup's three founders, as well as their AI researchers and engineers.\n\nThe Israeli startup, founded in 2023, is best known for its software that lets developers sync their AI models across different chips, allowing them to switch hardware quickly, known as the Decart Optimization Stack.\n\n\"Every leap forward in AI starts with getting more out of every chip,\" Peter DeSantis, a senior vice president at Amazon who oversees foundation models, custom silicon and quantum computing development, said in a statement. \"More efficient compute means better training, better reinforcement learning, faster inference, and better models for customers at a lower cost.\"\n\nDeSantis added, \"From our earliest work with Decart, we knew they were the kind of technologically fearless team who would help us push it even further.\"\n\nAmazon has moved deeper into building custom AI chips amid insatiable demand for the technology, and as companies seek alternatives to Nvidia , the dominant provider. Amazon has positioned its Trainium and Inferentia chips as lower-cost options for AI developers.\n\nLast month, Amazon CEO Andy Jassy said the company plans to make its Trainium chips externally available for the first time in \"late in 2027.\"\n\nSeveral outlets reported Amazon will pay $7.5 billion for Decart's assets, citing people familiar with the matter. Amazon declined to comment on the terms of the deal.", "source": "CNBC World Economy", "pub_date_str": "23 Nov 2026, 11:53 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Trump administration proposes rule that could curb ESG investing in 401(k)s", "full_content": "The Trump administration proposed a rule on Monday that officials said they expect to severely cripple so-called ESG investing in workplace retirement plans like 401(k)s.\n\nThe proposed regulation , if finalized, would amend provisions under the Employee Retirement Income Security Act of 1974, or ERISA, to clarify how employers and other plan \"fiduciaries\" can apply their duty of loyalty to 401(k) investors.\n\nThe rule affirms that the people who choose investments for their company retirement plan must make decisions \"solely in the financial interests of workers and retirees, not to advance political or social agendas,\" U.S. Secretary of Labor Keith Sonderling said Monday in a written statement.\n\nESG \u2014 short for environmental, social and governance \u2014 funds let people invest according to certain values like curbing climate change or improving corporate diversity. They're also known as socially responsible, sustainable, impact or values-based funds.\n\n\"We make clear in this rule that when you are selecting investments for a retirement plan ... you may not have any ulterior motives or collateral interests,\" a Labor Department official said during a press briefing Monday morning.\n\n\"We believe that will inform all fiduciaries as to whether an impact fund or ESG fund is appropriate for retirement funds,\" the official said. \"We believe the answer will be very rarely.\"\n\nAlready, few 401(k) plans offer ESG funds \u2014 partly due to whipsawing federal policy around their use .\n\nAbout 5% of 401(k) plans offered an ESG fund in 2025, according to a Plan Sponsor Council of America report issued earlier this month. On average, less than 1% of overall investor assets in 401(k) plans are held in ESG funds, the report said.", "source": "CNBC Top News", "pub_date_str": "23 Nov 2026, 11:44 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stocks making the biggest moves Monday: Boeing, Nvidia, CoreWeave, Newmont & more", "full_content": "A slate of artificial intelligence stocks surged on the heels of Jensen Huang's return to the helm of Nvidia, with CoreWeave and Micron Technology soaring on Monday.\n\nA rally in gold prices also lifted shares of mining stocks like Newmont and Gold Fields.\n\nFollow below as CNBC highlights the biggest stock moves of the day.\n\nDecember gold futures rallied Monday Mining stocks rallied Monday alongside bullish moves in the price of gold, silver and copper. Gold futures climbed about 4%, silver by roughly 5% and copper added nearly 3%.\n\nNewmont Mining , AngloGold Ashanti , Coeur Mining and Gold Fields Ltd. all surged more than 7%, while Freeport McMoRan jumped almost 8%.\n\nShares of International Paper fell 4% after the packaging solutions company announced Monday that its board had approved the spinoff of its Europe, Middle East and Africa (EMEA) packaging business into a publicly traded company, DS Smith.\n\nInternational Paper will remain an important shareholder, retaining a 19.9% stake.\n\nThe company expects to complete the separation and distribution on Dec. 7, 2026, after the satisfaction of customary conditions and regulatory approvals are met. Additionally, the company announced its intention to delist from the London Stock Exchange after the completion of the separation.", "source": "CNBC Top News", "pub_date_str": "23 Nov 2026, 11:35 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Derivatives", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Stocks making the biggest moves Monday: Boeing, Nvidia, CoreWeave, Newmont & more - CNBC", "full_content": "Stocks making the biggest moves Monday: Boeing, Nvidia, CoreWeave, Newmont & more CNBC Biggest stock movers Monday: NVDA, TSLA, and more Seeking Alpha TeraWulf, Arista Networks, Dell, CoreWeave, and Lumentum shares skyrocket, what you need to know StockStory Nvidia, Micron, Arm Holdings, Kymera Therapeutics And Other Big Stocks Moving Higher On Monday Benzinga Nvidia, Intel among market cap stock movers on Monday By Investing.com Investing.com India", "source": "Google News Business", "pub_date_str": "23 Nov 2026, 11:35 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "\u2018This establishes a bottom\u2019: Jensen Huang\u2019s return seen as likely to stop market sell-off, for now", "full_content": "The major averages of U.S. equities surged on Monday after Nvidia reinstated Jensen Huang as CEO, giving investors some hope that the relentless selling pressure seen last week may subside \u2014 at least temporarily.\n\nThe relief rally came after the Dow Jones Industrial Average , S&P 500 and Nasdaq Composite ended Friday's session in correction territory . The S&P alone tumbled more than 9% after Huang's departure from the chipmaker was initially announced on Nov. 12 through Friday.\n\nThat sell-off may be over \u2014 at least temporarily \u2014 according to Wall Street experts. But key questions linger around Nvidia and the artificial intelligence trade that has carried the bull market.\n\n\"I think the AI trade is back on,\" said Mark Gibbens, founder of Gibbens Capital Management. \"I certainly believe this establishes a bottom and a floor in the AI trade and the recent market weakness.\"\n\nHe added that the news likely doesn't alleviate all concerns that have driven recent declines, including worries about data center approvals after the midterms and fears that the capital expenditures cycle may have peaked . But Gibbens thinks the \"keystone\" role that Nvidia plays in both financing the AI buildout and the technology's supply chain means a more stable picture of the chipmaker creates a brighter view of the overall market than before.\n\nAn encouraging sign that the correction may be over came even before Nvidia's Monday announcement, according to Art Hogan, chief market strategist at B. Riley Wealth Management. He said Friday's selling, which was indiscriminate and affected sectors beyond just AI-exposed companies, showed a bottom may have been building.\n\n\"Sometimes you just hit that crescendo where you know the market gets oversold, and I would argue that we'd be higher today, even without the Nvidia news,\" he said. Indeed, futures tied to the major stock indexes were broadly higher on Sunday night, before any news regarding Huang's return.", "source": "CNBC Finance", "pub_date_str": "23 Nov 2026, 11:30 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Derivatives", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Stock Market Today: Dow Surges As Trump Says This On Huang's Nvidia Return; AI Plays Rocket (Live Coverage) - Investor's Business Daily", "full_content": "Stock Market Today: Dow Surges As Trump Says This On Huang's Nvidia Return; AI Plays Rocket (Live Coverage) Investor's Business Daily See more headlines & perspectives on Google News", "source": "Google News Business", "pub_date_str": "23 Nov 2026, 11:25 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Nvidia stock massive surge, Jensen reinstatement impact on Micron vs AMD vs Sandisk vs Oracle shares - Data details", "full_content": "Nvidia's dramatic stock market comeback following the reinstatement of co-founder Jensen Huang as chief executive has reignited investor interest across the broader artificial intelligence (AI) and semiconductor sp
