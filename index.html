<script>
    // This variable will be injected during the build process
    const allData = {"general": [{"title": "Wholesale prices jumped 6.3% annually in September, biggest gain since 2022", "full_content": "September's producer price index came in much hotter than economists forecasted on Thursday, underscoring the continued inflationary pressure from energy amid the U.S. war with Iran.\n\nThe measure of underlying inflation pressures climbed 1.3% in September and 6.3% on an annual basis, marking its largest 12-month advance since late 2022, according to the Bureau of Labor Statistics.\n\nEconomists polled by Dow Jones forecasted an advance of 0.6% on the month and 5.5% annually.\n\nEnergy drove a sizable chunk of those increases as the Middle East conflict has curtailed oil supply and sent prices surging. Excluding food, energy and trade, a stripped-down measure of PPI added just 0.5% in September and 5% compared with a year prior.\n\nIt's the latest report in recent days showing that inflation continues to hit consumers and companies.\n\nWednesday's consumer price index release showed an increase of 0.6% from August to September and 3.7% on a 12-month basis. Economists polled by Dow Jones had forecasted growth of 0.6% and 3.6%, respectively.\n\nSo-called core CPI, which removes volatile food and energy costs, added 0.3% on the month and 2.6% compared with a year ago. Economists anticipated increases of 0.2% and 2.5%, respectively.\n\nThis week's beige book from the Federal Reserve had the highest number of mentions of terms related to inflation on record, according to an analysis from Bespoke Investment Group.", "source": "CNBC Top News", "pub_date_str": "15 Oct 2026, 06:15 PM IST", "pub_date_relative": "just now"}, {"title": "Micron, Nvidia and other chip stocks face renewed pressure as AI fears swell", "full_content": "Reported details about Anthropic\u2019s financial progress are adding to concerns about the health of the AI ecosystem.", "source": "MarketWatch Top Stories", "pub_date_str": "15 Oct 2026, 06:13 PM IST", "pub_date_relative": "2m ago"}, {"title": "U.S. Treasury dismisses IMF debt warning and 'messy' forecasting", "full_content": "The International Monetary Fund should check its own forecasting record before criticizing U.S. fiscal policy, David Zervos, newly appointed counselor to the Treasury Secretary , said on Thursday.\n\n\"When we see pieces on the IMF, it's good to remember how messy their forecasts have been in the past,\" Zervos said in emailed comments to CNBC.\n\nThe former Wall Street economist was responding to the IMF's Managing Director Kristalina Georgieva, who cautioned during the IMF-World Bank annual meetings in Bangkok on Wednesday that strong U.S. economic growth would not be sufficient to put mounting federal debt on a sustainable course.\n\nGeorgieva was herself responding to U.S. Treasury Secretary Scott Bessent, who told CNBC in August that the U.S. could \"grow our way out\" of a rising debt-to-GDP ratio, after government debt surpassed $40 trillion .\n\nZervos, formerly chief market strategist at Jefferies, said Thursday: \"In 2008, [the IMF's World Economic Outlook] had world growth at 3% and we had the first global contraction in post-world history a year later. We saw them positive on Southeast Asia in 1997 before the collapse.\"\n\n\"We saw them very negative on Russia in 2022, and Russia actually barely saw a blip down in growth before it started growing strongly . We saw them very positive on Argentina after their big bailout of $57 billion . And by 2020, Argentina was basically in default again . And the history books go on and on, whether it's Greece, whether it was the transitory call on inflation in the U.S.\"\n\nMany economists warn that mounting U.S. interest payments and a high deficit have raised the risk of an unsustainable debt spiral. However, they are divided on whether the U.S. could be pushed into a true fiscal crisis .\n\nThe IMF's Georgieva has issued similar warnings to other big economies over the need for fiscal consolidation, telling CNBC on Oct. 7 that her message to France was: \"Get your house in order.\"", "source": "CNBC Top News", "pub_date_str": "15 Oct 2026, 06:10 PM IST", "pub_date_relative": "4m ago"}, {"title": "This 30-year market veteran is alarmed by a record-chasing S&P 500. Here\u2019s where he\u2019s investing instead.", "full_content": "Steven Jon Kaplan sees a completely irrational stock market right now, and investors ignoring a perfectly safe way to play that.", "source": "MarketWatch Top Stories", "pub_date_str": "15 Oct 2026, 06:10 PM IST", "pub_date_relative": "5m ago"}, {"title": "Bank of America shares flat after earnings-driven sell-off, slide over 20% from recent peak", "full_content": "After a 5% earnings-led crash in the previous session, shares of Bank of America (BofA) were trading flat in pre-market trading on Thursday. Profits at the second-largest US bank fell more than 15% in the third quarter after it took a $1.2 billion hit from a regulatory fine related to money laundering and sanctions violations.\n\nThe company announced a $1.2 billion non-tax-deductible charge related to the fines. The US Treasury Department said on Tuesday that the bank had effectively outsourced a key part of its compliance efforts as it sought to protect revenue.\n\nBofA said the costs of remediating the issues were already factored into its expenses.\n\nThe charge reduced earnings by 17 cents per share and contributed to a 17% decline in net income to $6.9 billion from $8.3 billion a year earlier. The bank's total revenue came in at nearly $30 billion, missing analysts' consensus estimates.\n\nIts trading businesses also delivered weaker-than-expected results. Fixed-income trading revenue declined 17% to $2.55 billion, while equity-trading revenue increased 10% to $2.51 billion.\n\nDespite the earnings pressure, Bank of America's loan balances increased 6.3% year-on-year to $1.23 trillion at the end of the third quarter, in line with analysts' estimates. Meanwhile, investment-banking revenue fell 11% to $1.82 billion, although it came in above analysts' expectations.\n\nFees for advising on mergers and acquisitions declined 19%. Revenue from equity issuance increased 9.1%, while debt-issuance revenue fell nearly 14%.\n\nMeanwhile, the results offered insights into the health of US consumers amid rising interest rates and elevated gas prices linked to the conflict in Iran. The bank set aside $1.27 billion for potentially souring loans, below analysts' expectations of $1.5 billion.", "source": "LiveMint Markets", "pub_date_str": "15 Oct 2026, 06:06 PM IST", "pub_date_relative": "9m ago"}, {"title": "U.S. producer prices rise by 1.3% month-on-month in September", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Oct 2026, 06:05 PM IST", "pub_date_relative": "9m ago"}, {"title": "Nasdaq 100 futures hold onto losses after hot U.S. producer inflation report", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Oct 2026, 06:05 PM IST", "pub_date_relative": "10m ago"}, {"title": "PPI surges as inflation concerns grow, exceeding forecasts", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Oct 2026, 06:04 PM IST", "pub_date_relative": "11m ago"}, {"title": "U.S. yields near 3-week lows as AI equities rout drives flight to safe-haven", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Oct 2026, 06:03 PM IST", "pub_date_relative": "12m ago"}, {"title": "Wall Street's latest AI spook, Netflix layoffs, 'good debt' and more in Morning Squawk", "full_content": "This is CNBC's Morning Squawk newsletter. Subscribe here to receive future editions in your inbox.\n\nHappy Thursday. CNBC's \"Halftime Report\" and \"Closing Bell\" will both air live from San Francisco for special \"AI in America\" shows today. Watch live on CNBC or CNBC+.\n\nNasdaq futures are lower this morning. The market is coming off a rough day , which we recap below.\n\nHere are five key things investors need to know to start the trading day:\n\nAfter a quiet start to the week, investors sent stocks sliding in yesterday's session amid worries of artificial intelligence overspending. The S&P 500 and Nasdaq Composite each dropped more than 1%, marking their worst days in over two months.\n\nYesterday's consumer price index data came in hotter than economists anticipated on a 12-month basis, largely thanks to surging energy prices.\n\nThe report marked the 66th straight annual CPI reading above the widely accepted inflation target of 2%, according to a CNBC analysis. That's the longest such stretch in this century. Cleveland Federal Reserve President Beth Hammack warned last week consumers might be starting to accept high inflation as a \"fact of life,\" which could have negative implications for the effectiveness of monetary policy tools.\n\nSeptember's producer price index \u2014 which tracks wholesaler inflation \u2014 and retail sales data are slated to be released this morning.", "source": "CNBC World Economy", "pub_date_str": "15 Oct 2026, 06:02 PM IST", "pub_date_relative": "13m ago"}, {"title": "Retail sales rise more than expected, boosting economic outlook", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Oct 2026, 06:02 PM IST", "pub_date_relative": "13m ago"}, {"title": "Earnings call transcript: Flerie Q3 2026 NAV slips as biotech write-downs weigh", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Oct 2026, 06:00 PM IST", "pub_date_relative": "15m ago"}, {"title": "Empire State Manufacturing Index Surges, Surpassing Expectations", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Oct 2026, 06:00 PM IST", "pub_date_relative": "15m ago"}, {"title": "Recursion raises $200M, reports trial data for two drug candidates", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Oct 2026, 05:58 PM IST", "pub_date_relative": "17m ago"}, {"title": "Alpha Modus to test AI platform at three grocery stores", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Oct 2026, 05:58 PM IST", "pub_date_relative": "17m ago"}, {"title": "Oil prices slips as US weighs easing sanctions on \u2019shadow fleet\u2019", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Oct 2026, 05:54 PM IST", "pub_date_relative": "21m ago"}, {"title": "Cyient DLM Q2: Revenue Jumps 26.5% To Rs 393 Crore, Margin Contracts", "full_content": "Cyient DLM reported 26.5% year-on-year revenue growth in Q2 FY27, while EBITDA margin narrowed to 8.7% from 10.1% a year ago. Its order book hit a record Rs 2,813.7 crore.", "source": "NDTV Profit", "pub_date_str": "15 Oct 2026, 05:50 PM IST", "pub_date_relative": "25m ago"}, {"title": "Tech Mahindra Q2: Board Recommends 1:1 Bonus Share Issue; To Pay Rs 15 Per Share Dividend", "full_content": "Tech Mahindra will pay an interim dividend of Rs 15 per share.", "source": "NDTV Profit", "pub_date_str": "15 Oct 2026, 05:50 PM IST", "pub_date_relative": "25m ago"}, {"title": "Here are Thursday's biggest analyst calls: Nvidia, CoreWeave, Walmart, Crocs, CarMax, Regeneron & more", "full_content": "Here are Thursday's biggest calls on Wall Street.", "source": "CNBC Top News", "pub_date_str": "15 Oct 2026, 05:50 PM IST", "pub_date_relative": "25m ago"}, {"title": "Rupee's Rebound: Indian Currency Strengthens By 2 Units Against US Dollar In A Week | What's Behind The Recovery?", "full_content": "In the last seven days, the rupee has sharply recovered by 2 percentage points or 2 units and settled at 95.06/dollar levels on Thursday. What prompted this swift comeback?", "source": "NDTV Profit", "pub_date_str": "15 Oct 2026, 05:50 PM IST", "pub_date_relative": "25m ago"}, {"title": "Nvidia CEO Jensen Huang urges U.S.-China dialogue on 'potentially dangerous' AI", "full_content": "Nvidia CEO Jensen Huang said the chipmaker \"absolutely must\" work with Chinese AI companies on monitoring risks around the \"potentially dangerous\" technology.\n\n\"We absolutely should work with each other so that we advance the technology safely,\" he told CNBC during a media briefing on Wednesday evening in London.\n\nDiscussions around AI safety have intensified in recent months, after researchers from AI labs including OpenAI and Anthropic called for a slowdown in developing the tech and warned of existential risks to humanity.\n\nWhile OpenAI's Sam Altman and Anthropic's Dario Amodei have called for greater regulation , Huang has emerged as a prominent voice in opposition to that view.\n\nHuang said that \"dialogue\" was the way to work with Chinese AI companies, adding that he has \"dialogues with many of the researchers in China.\"\n\n\"We ought to enhance the dialogue,\" he added. \"The United States should do it... I advocated that the U.K. do the same thing.\"\n\nAI safety has become a key topic between the U.S. and Chinese governments, with both countries weighing how to address the risks posed by the rapidly advancing tech.\n\nPrior to U.S. President Donald Trump's meeting with Chinese counterpart Xi Jinping, U.S. Treasury Secretary Scott Bessent discussed the prospect of a \"U.S.-China AI dialogue\" with his Chinese counterpart, He Lifeng, in September, including a channel for incidents \"up to a national security level.\"", "source": "CNBC World Economy", "pub_date_str": "15 Oct 2026, 05:47 PM IST", "pub_date_relative": "28m ago"}, {"title": "IRFC Q2 results 2026, dividend: Navratna PSU declares highest-ever dividend; Profit rises 10% to \u20b91,958 cr", "full_content": "IRFC Q2 results: Government-backed Indian Railways Finance Corporation (IRFC) Limited, on Thursday, October 15, reported a 10% year-on-year increase in its net profit to \u20b9 1,958 crore in the quarter ending in September, 2026. The Navratna PSU also declared its highest ever dividend today.\n\nIRFC share price ended marginally lower on Thursday after seeing some recovery during the closing session. The railway PSU stock has declined nearly 36.70% in one year.\n\nThe Navratna PSU\u2019s net profit increased by 10% to \u20b9 1,958.48 crore in Q2FY27, against \u20b9 1,776.98 crore reported in the year-ago period. The Ministry of Railway\u2019s NBFC reported a net profit of \u20b9 1,927.21 crore in the year-ago period. The company\u2019s net revenue increased to \u20b9 7,866.41 crore during the quarter under review. Its net revenue stood at \u20b9 6,371.89 crore in Q2FY27 and at \u20b9 8,261.11 crore in Q1FY27.\n\nThe company\u2019s board of directors approved an interim dividend of \u20b9 1.15 per equity share with a face value of \u20b9 10 each. This is the highest ever dividend amount announced by the Navratna PSU. IRFC has also announced record date to determine the eligibility of shareholders for the payout.\n\nIRFC has fixed Friday, Oct 23, 2026 , as the record date to determine the eligibility of shareholders for the payout. The payout will be made to \u201cthose shareholders, whose names appear (i) as beneficial owners in the statement(s) furnished by the depository(ies) as on the close of business hours on Friday, 23rd October 2026 in respect of shares held in dematerialized form; and (ii) as members in the register of members on Friday, 23rd October 2026 in respect of physical shares,\u201d stated the firm in its BSE filing.\n\nIRFC dividend will be paid to eligible shareholders within 30 days from the date of its declaration to those shareholder.\n\nIRFC share price closed 0.94% lower at \u20b9 79 per equity share with a market capitalisation of \u20b9 1,03,241.20 crore on Thursday.", "source": "LiveMint Markets", "pub_date_str": "15 Oct 2026, 05:46 PM IST", "pub_date_relative": "29m ago"}, {"title": "Memory stocks are getting hammered. China and a 2029 oversupply are the big worries", "full_content": "Memory chip stocks have taken a particularly bad beating this week amid broader equity market turmoil.\n\nTwo concerns are adding to the pressure \u2014 the debate over whether Chinese competition is threatening memory incumbents and speculation about when the market could become oversupplied.\n\nOver the last five days, SK Hynix has plunged 26%, Samsung has tanked 22% and Micron has dropped around 11%.\n\nThe initial jitters came at the start of the week after China's leading memory chipmaker ChangXin Memory Technologies, or CXMT , announced plans to roll out a server memory product based on new architecture .\n\nCXMT's design would allow higher storage density, raising concerns that the breakthrough could result in the Chinese company taking global market share from rivals Samsung, SK Hynix and Micron.\n\nHowever, a number of analysts questioned whether CXMT would be able to scale the production of such an advanced technology.\n\n\"The issue, of course, was with any architectural change ... you can make the chips, but what yield are you getting? If you're only getting a 50% yield, you're literally putting half the chips in the bin because they don't work very well,\" Ben Barringer, global head of technology research at Quilter Cheviot, told CNBC's \"Squawk Box Europe\" on Wednesday.\n\nKevin Cassidy, a senior research analyst at Rosenblatt Securities, also said the developments at CXMT are unlikely to add more supply of memory onto the market.", "source": "CNBC World Economy", "pub_date_str": "15 Oct 2026, 05:45 PM IST", "pub_date_relative": "30m ago"}, {"title": "Tata Trusts Challenges Mehli Mistry's Right To Contest Trustee Changes After Term Expiry", "full_content": "Tata Trusts has argued before the Maharashtra Charity Commissioner that Mehli Mistry cannot challenge trustee changes after his term expired, while a separate dispute involves Noel Tata's proposed appointment.", "source": "NDTV Profit", "pub_date_str": "15 Oct 2026, 05:44 PM IST", "pub_date_relative": "30m ago"}, {"title": "New Modern Metro Coaches For Mumbai Unveiled: These Made In India Coaches Can Run At 90 kmph Speed", "full_content": "Chief Minister Devendra Fadnavis has promised Mumbaikars completion of several undergoing metro projects by next year which will add at least 70km of Metro corridors to be completed by 2027.", "source": "NDTV Profit", "pub_date_str": "15 Oct 2026, 05:44 PM IST", "pub_date_relative": "30m ago"}, {"title": "Analysis: Why a $2 trillion deficit and 5% Treasury yields are becoming America's biggest economic challenge", "full_content": "Long-term bond yields above 5% and a $2 trillion deficit are giving Americans a taste of what a U.S. debt crisis would be like. A true emergency would hurt much more, and isn't baked in. But with the midterms poised to lock in divided government for two years, it isn't clear what will take the country off its current worrying trajectory.\n\nHigher interest rates exacerbated by the flood of federal debt issuance are starting to bite in some parts of the economy and threaten to worsen the government's debt problem. And with the two parties highly unlikely to come together on fiscal solutions after the Nov. 3 midterms, any fixes are years off in the future.\n\nThe housing market is showing signs of slowing as the average 30-year fixed-rate mortgage hovers around 7.5%. Pending home sales fell 4% in September, Redfin said Monday, the biggest monthly drop in three years.\n\nMortgage rates track the 10-year Treasury yield . The 10-year has climbed 123 basis points, or hundredths of a percentage point, since the end of February through Wednesday's close, when the 10-year traded at 5.19%.\n\nSeveral factors are pushing up the 10-year, including the war with Iran, which kicked off on Feb. 28 and precipitated the rise in long-term yields. Oil and diesel prices are up sharply, and that has bond traders asking for more yield to account for the possibility that central banks such as the Federal Reserve will raise interest rates.\n\nIn addition, investors want more compensation to hold longer-term bonds in part because they believe the U.S. government will continue to flood the market with them. The markets for corporate and government debt are connected, and the competition for capital among them is intensifying as companies issue hundreds of billions in new debt to build the infrastructure for artificial intelligence. Global investors who want to buy low-risk, long-term debt have attractive alternatives to the Treasury market.\n\nIf the U.S.", "source": "CNBC Top News", "pub_date_str": "15 Oct 2026, 05:41 PM IST", "pub_date_relative": "34m ago"}, {"title": "Rentomojo share price jumps 38% from IPO price in nearly 1 month | Check 5 factors driving the surge", "full_content": "Rentomojo shares have surged 38% above their IPO issue price of \u20b9 404, as investors assess the company\u2019s strong revenue growth, improving profitability and rising demand for rental furniture and appliances. Rentomojo shares listed on the stock exchanges on 17 September 2026.\n\nIshan Tanna, Senior Associate at Ashika Capital, said the company\u2019s Q1 FY27 results highlighted robust demand, improving monetisation and healthy utilisation of its rental inventory.\n\nRentomojo\u2019s \u20b9 1,250 crore initial public offering (IPO) was subscribed 73 times, and the stock listed at a premium of around 20% to its issue price. According to Tanna, the company\u2019s June-quarter performance has further strengthened investor interest, with its market capitalisation rising 8% to \u20b9 5,800 crore following the results announcement, less than three weeks after listing.\n\nRevenue from operations increased 51% year-on-year to \u20b9 126.3 crore in Q1 FY27. Tanna highlighted the company\u2019s normalised EBITDA of \u20b9 52.3 crore, translating into a margin of around 41%, while normalised earnings before interest and tax (EBIT) stood at \u20b9 29.2 crore, with a margin of nearly 23%.\n\nHowever, reported profitability was affected by an exceptional loss of \u20b9 11.37 crore following a fire at the company\u2019s Noida warehouse.\n\nTanna pointed to strong growth in customer demand, with items ordered increasing 45.8% year-on-year to 3.29 lakh and live subscribers rising 36.3% to 2.83 lakh. Rentomojo\u2019s live rental inventory also expanded 41% to 9.23 lakh items.\n\nInventory utilisation improved alongside this expansion. Average occupancy increased to 85.7% from 83.3% a year earlier, while period-end occupancy reached 86.8%. These trends highlight the company\u2019s ability to grow its rental inventory while maintaining healthy utilisation levels, according to the brokerage assessment.\n\nTanna also highlighted improvements in monetisation.", "source": "LiveMint Markets", "pub_date_str": "15 Oct 2026, 05:40 PM IST", "pub_date_relative": "35m ago"}, {"title": "There\u2019s a \u2018monstrous bull market\u2019 developing under the surface of the S&P 500. This hedge-fund manager tells you where it\u2019s at.", "full_content": "The index may not move much because the stocks with the biggest weightings lag, but there\u2019s a bull market starting to bubble elsewhere, says a hedge-fund manager.", "source": "MarketWatch Top Stories", "pub_date_str": "15 Oct 2026, 05:38 PM IST", "pub_date_relative": "37m ago"}, {"title": "Anthropic Revenue Jumps To $16.8 Billion In Quarter Before IPO", "full_content": "Anthropic is generating positive free cash flow, had adjusted gross margin of 85% and an over 11% positive adjusted operating margin as of the third quarter, according to the people.", "source": "NDTV Profit", "pub_date_str": "15 Oct 2026, 05:37 PM IST", "pub_date_relative": "38m ago"}, {"title": "RBI issues clarifications on forex hedging curbs", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Finance \u203a RBI issues clarifications on forex hedging curbs The Economic Times daily newspaper is available online now. Read Today's Paper RBI issues clarifications on forex hedging curbs SECTIONS RBI issues clarifications on forex hedging curbs ET Online Last Updated: Oct 15, 2026, 05:45:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Reserve Bank of India issued clarifications on its recent measures to support the rupee. This followed concerns about tighter hedging rules and cash margins on certain derivatives. Several lenders have held back on quoting dollar-rupee forwards due to confusion regarding transaction requirements. The measures included redirecting oil companies' dollar purchases and levying cash reserve requirements. The impact of these measures has raised uncertainties in the financial markets.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\nThe ABCD of the US mid-term elections \u2013 Part 1: Why it matters across the globe\n\nOnion inflation at 108%? Yes, but not really. What is different this time?\n\nCurbing rupee bets: What the RBI\u2019s new rules mean for the hedge-now-or-wait question\n\nBrinjal, buffalo, bacteria: Inside India\u2019s pay-for-nature system\n\nHomebuyers wait as NCLT panel picks holes in unfinished Jaypee projects\n\nThe NBFC saga - Part 3: How one default in 2018 changed the way RBI reads risk", "source": "Economic Times Economy", "pub_date_str": "15 Oct 2026, 05:34 PM IST", "pub_date_relative": "41m ago"}, {"title": "Torrent Power plans around $500 million bond sale, bankers say", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Bonds \u203a Torrent Power plans around $500 million bond sale, bankers say Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Torrent Power plans around $500 million bond sale, bankers say SECTIONS Torrent Power plans around $500 million bond sale, bankers say Reuters Last Updated: Oct 15, 2026, 05:32:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Torrent Power is set to launch a substantial bond sale of rupee-denominated bonds, aiming to raise around $500 million. This comes after their earlier issuance of 38 billion rupees. The company's initiative to diversify funding sources includes discussions with potential investors. The funds will be directed towards the acquisition of Nabha Power for approximately 69 billion rupees, reflecting a growing trend of companies exploring funding avenues beyond traditional banks.\n\nIn a pivotal decision, India's Supreme Court declared that the write-off of Yes Bank's 84 billion rupee AT-1 bonds is unlawful, causing a steep decline in Yes Bank shares. The ruling offers solace to bondholders, who successfully argued that their investments were misrepresented. This landmark decision raises critical questions about regulatory practices and bondholder rights, potentially reshaping market attitudes toward similar financial instruments.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "15 Oct 2026, 05:32 PM IST", "pub_date_relative": "42m ago"}, {"title": "Stocks making the biggest moves premarket: CoreWeave, Rocket Lab Corp, SK Hynix & more", "full_content": "These are the stocks posting the largest moves premarket.", "source": "CNBC Finance", "pub_date_str": "15 Oct 2026, 05:32 PM IST", "pub_date_relative": "43m ago"}, {"title": "Cboe to expand options trading hours for major stocks and ETFs", "full_content": "The options market is about to get even bigger on Monday when Cboe Global Markets extends trading hours for options on two-dozen stocks and a handful of ETFs. After first receiving approval by the SEC in May, regulators have now given the green light to the exchange and the Options Clearing Corp. to offer trading on 24 of the most actively traded companies and five exchange-traded funds between 7:30 a.m. and 9:25 a.m. ET and 4:00 p.m. to 4:15 p.m. ET. It's another step towards around-the-clock trading. Cboe already offers pre- and post-market periods for index options. Trading during those hours has grown in popularity, with a record 228,097 average options traded in the pre-market session daily last quarter, according to exchange data shared with CNBC. The list, which will be updated twice a year, starts with the so-called Magnificent Seven stocks, several big-tech giants, including Oracle and Micron, as well as popular retail-trading names like Robinhood, Nokia, and Palantir. Pfizer and Alibaba also make the cut. The ETF options include the State Street SPDR S&P 500 ETF Trust (SPY), Invesco QQQ Trust (QQQ), iShares Russell 2000 ETF (IWM), SPDR Gold Shares (GLD), and the State Street Financial Select Sector SPDR ETF (XLF). \"More investors than ever appreciate the power of optionality and what it can do for their portfolios, and the pace of adoption and growth of the market really reflect that,\" Rob Hocking, global head of derivatives at Cboe, said in an email. \"We continue to push the next frontier of innovation, expanding access and introducing new ways for investors to trade and manage risk.\" To meet the criteria for the extended hours, underlying securities must have an average daily volume for the preceding six months of 150,000 contracts or higher, a market value of $50 billion, and an average daily volume of at least 10 million shares. As a result, SpaceX does not yet qualify.", "source": "CNBC Top News", "pub_date_str": "15 Oct 2026, 05:31 PM IST", "pub_date_relative": "43m ago"}, {"title": "Why are credit default swaps unnerving AI investors?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Why are credit default swaps unnerving AI investors? Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Why are credit default swaps unnerving AI investors? SECTIONS Why are credit default swaps unnerving AI investors? Reuters Last Updated: Oct 15, 2026, 05:30:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The cost of insuring against the risk of potential US tech defaults has hit record levels in the latest sign of credit stress building in the so-called AI trade, especially for data centres dependent on future revenue.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\nThe ABCD of the US mid-term elections \u2013 Part 1: Why it matters across the globe", "source": "Economic Times Markets", "pub_date_str": "15 Oct 2026, 05:30 PM IST", "pub_date_relative": "45m ago"}, {"title": "Amazon launches new Bee 'personal AI' devices that listen to conversations", "full_content": "Amazon on Thursday unveiled two new Bee listening devices, including a wearable and a credit card-sized voice recorder, marking its latest push into the AI gadget market.\n\nThe Bee Frontier is an upgraded version of Amazon's existing wearable that can either be worn on a wrist or clipped to clothing. Similar to earlier generations, the Bee Frontier has up to seven days of battery life, but it's also more expensive, costing $75 compared with its $50 predecessor.\n\nAmazon acquired Bee , a San Francisco startup known for its always-listening bracelet, in July 2025 for an undisclosed amount. Bee bracelets are equipped with artificial intelligence and microphones that can record, transcribe and analyze conversations.\n\nThe dual mics on the Bee Frontier have upgraded noise filtering, \"so it can take note of what matters and ignore what doesn't, even in noisy environments like a crowded restaurant or open office,\" Amazon said in a blog post.\n\nAmazon also debuted the $100 Bee Eclipse, which functions like other Bee devices, but instead of being worn, the credit card-sized gadget magnetically snaps on to the back of a smartphone.\n\nThe Bee Frontier is available Thursday, while the Bee Eclipse \"will be available soon,\" the company said.\n\nAmazon is refreshing its Bee lineup as tech companies gear up for the holiday season with a slew of new AI hardware . Amazon nixed its budget-friendly Fire family of tablets in favor of three new AI-infused Alexa Tablets , while Microsoft showcased an Nvidia -powered Windows laptop and Apple unveiled its HomeView smart home hub with Siri AI.\n\nThe Bee gadgets will compete with other AI wearables already on the market.", "source": "CNBC World Economy", "pub_date_str": "15 Oct 2026, 05:30 PM IST", "pub_date_relative": "45m ago"}, {"title": "HDFC Life Q2 Results: Net Profit Rises 16% To Rs 522 Crore | Check Key Numbers", "full_content": "The net profit for the quarter is at Rs 522 crore as compared to Rs 448 crore in the same period the previous year.", "source": "NDTV Profit", "pub_date_str": "15 Oct 2026, 05:25 PM IST", "pub_date_relative": "49m ago"}, {"title": "What to know about Starshield, SpaceX's military-focused Starlink service", "full_content": "Uncertainty over who controls SpaceX's military satellite system, Starshield, has drawn renewed attention, as restrictions on the technology hinder Ukraine's defenses.\n\nUkraine has accused SpaceX -owned Starlink of restricting its military-grade services , known as Starshield, as Russia intensified attacks on Kyiv.\n\nOfficials in Kyiv said SpaceX had imposed restrictions on Starshield without advance notice, disrupting military operations and hampering efforts to protect civilians amid intense Russian attacks this week.\n\nIn response, SpaceX CEO Elon Musk appeared to shift responsibility for any changes to Starshield's use in Ukraine to the U.S. government and President Donald Trump . He said that Starshield systems are owned and controlled by Washington, with the U.S. military and ultimately the president determining any limits on their use. The White House and the Pentagon didn't immediately reply to CNBC's request for comment.\n\nHere's what to know about Starshield, and how it differs from Starlink.\n\nStarshield is SpaceX's satellite network designed for government and national security use, building on the technology developed for Starlink. On Tuesday, Ukrainian officials reported that their Starlink communication systems were no longer working for terminals moving at speeds above 100 miles per hour, or about 160 kilometers per hour.\n\nUkraine relies on this connectivity to track and intercept incoming threats. Ukraine's military also uses the commercial Starlink technology, according to media reports, but it is not clear which of its terminals operate under the commercial arm versus those provided through Starshield.\n\nSpeaking to Piers Morgan on Wednesday, Zelenskyy lamented that \"Starlink was switched off.\"", "source": "CNBC World Economy", "pub_date_str": "15 Oct 2026, 05:24 PM IST", "pub_date_relative": "51m ago"}, {"title": "Global stocks sell-off deepens as chipmakers tumble", "full_content": "European and Asian equities slide as investors question durability of AI boom", "source": "FT Markets", "pub_date_str": "15 Oct 2026, 05:24 PM IST", "pub_date_relative": "51m ago"}, {"title": "360 ONE WAM Q2 Results: Total Income Up 14%; Dividend Of Rs 7.5/Share Declared", "full_content": "360 ONE WAM's consolidated profit after tax declined nearly 5% year-on-year to Rs 300 crore in Q2 FY27, while total income rose 13.9% to Rs 1,261 crore.", "source": "NDTV Profit", "pub_date_str": "15 Oct 2026, 05:23 PM IST", "pub_date_relative": "52m ago"}, {"title": "You can take it with you: Five tax tips before selling your business", "full_content": "A version of this article appeared in CNBC's Inside Wealth newsletter, a weekly guide to the high-net-worth investor and consumer. Sign up to receive future editions, straight to your inbox.\n\nFor many entrepreneurs who sell their businesses, minimizing the taxes on their windfall is an afterthought. Nearly half (45%) of professional advisors say their clients spend too little time on tax and wealth transfer planning, according to a recent survey by BNY Wealth .\n\nProcrastination can come at a steep cost, according to Michael Paulus, founder of wealth advisory PCM Encore. He said he left hundreds of millions of dollars on the table when selling his first business, insurance tech firm Assurance IQ, for $2.4 billion in 2019.\n\n\"I think a lot of people think I'm good just as long as I take care of it before the deal closes. The reality is the perfect time would be two to three years before you're contemplating going to market,\" he told CNBC.\n\nPaulus said selling is top of mind for many business owners as baby boomers look to retire and realize their children do not want to take the reins.\n\nHere are five tax tips for business owners to maximize their windfall.\n\nThe first step is to assess your equity. Many company founders do not realize they are eligible for a powerful tax deduction on qualified small business stock, or QSBS , according to lawyer Edward Renn of Withers.\n\nThe QSBS exemption allows investors and founders to reduce their capital gains taxes when selling stock directly acquired from a qualifying C corp. In order to claim the full exemption, the stock must be held for more than five years. Prior to the passage of the One Big Beautiful Bill Act, the maximum exemption was $10 million or 10 times the original basis of the investment, whichever is greater. OBBBA raised the exclusion to $15 million for stock issued after July 4, 2025, and allowed stockholders to claim partial tax benefits after three or four years.", "source": "CNBC Top News", "pub_date_str": "15 Oct 2026, 05:21 PM IST", "pub_date_relative": "54m ago"}, {"title": "Rakesh Jhunjhunwala's Nifty 2030 Prediction: Did the Big Bull Get It Wrong?", "full_content": "Among Rakesh Jhunjhunwala's many famous calls, one prediction still turns heads for its sheer audacity: the forecast that the Nifty 50 would hit a staggering 1,25,000 by the year 2030.", "source": "NDTV Profit", "pub_date_str": "15 Oct 2026, 05:18 PM IST", "pub_date_relative": "57m ago"}, {"title": "Tecno Spark 50S 5G Could Be Cheaper Than Spark 50 5G: What We Know So Far", "full_content": "Tecno has revealed the Spark 50S 5G's design and two colour options ahead of its India launch, while the price, battery capacity and full specifications remain undisclosed.", "source": "NDTV Profit", "pub_date_str": "15 Oct 2026, 05:14 PM IST", "pub_date_relative": "1h ago"}, {"title": "Tech Mahindra Q2 Results: Net profit jumps 33% YoY to Rs 1,586 crore; co declares Rs 15/share dividend, 1:1 bonus issue", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a Earnings \u203a Tech Mahindra Q2 Results: Net profit jumps 33% YoY to Rs 1,586 crore; co declares Rs 15/share dividend, 1:1 bonus issue National Stock Exchange of India Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Tech Mahindra Q2 Results: Net profit jumps 33% YoY to Rs 1,586 crore; co declares Rs 15/share dividend, 1:1 bonus issue SECTIONS Tech Mahindra Q2 Results: Net profit jumps 33% YoY to Rs 1,586 crore; co declares Rs 15/share dividend, 1:1 bonus issue By Kumar Gaurav , ETMarkets.com Last Updated: Oct 15, 2026, 05:29:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Tech Mahindra Q2 Results: Along with the earnings, Tech Mahindra's board declared an interim dividend of Rs 15 per equity share of face value Rs 5 each, equivalent to 300%, for the financial year 2026-27. It also approved a 1:1 bonus issue, under which shareholders will receive one bonus equity share for every existing equity share held, subject to the applicable terms and conditions.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets .", "source": "Economic Times Markets", "pub_date_str": "15 Oct 2026, 05:14 PM IST", "pub_date_relative": "1h ago"}, {"title": "Second activist pushes for sale of UK self-storage company Big Yellow", "full_content": "Irenic Capital takes 4% stake in FTSE 250 real estate group and joins Ancora in lobbying for a sale", "source": "FT Markets", "pub_date_str": "15 Oct 2026, 05:13 PM IST", "pub_date_relative": "1h ago"}, {"title": "Private capex losing steam in India: Can it delay the stock market revival? Experts decode", "full_content": "While the Government of India has implemented a multi-pronged strategy, including aggressive public capital expenditure (capex) outlays in infrastructure, targeted production-linked incentive (PLI) schemes, and FDI liberalisation with new free trade agreements (FTAs), over the last few years to catalyse private sector investments, private capex in India has been languid after capex per enterprise peaked at \u20b9 260 crore in FY23.\n\nBrokerage firm Systematix Shares and Stocks (India), in its report on 15 October, highlighted the findings of capex surveys of the National Statistics Office (NSO), which showed capex per enterprise peaked at \u20b9 260 crore in FY23 before falling to \u20b9 160 crore in FY26, with intended FY27 spending showing no improvement.\n\nMoreover, the conversion of intended capex into actual spending has weakened significantly, with the realisation ratio (RR) declining from 112% in FY23 to 96% in FY25, suggesting FY26-FY27 investments may undershoot current plans.\n\nThe provisional capex for FY26 and the intended capex for FY27 stand at \u20b9 160 crore each, significantly lower than the actuals in FY23-FY24.\n\nAs per Systematix report, the survey showed capex in the manufacturing sector declined from \u20b9 220 crore in FY22 and FY23 to \u20b9 210 crore in FY24 and \u20b9 170 crore in FY25, before recovering to \u20b9 210 crore in FY26. The intended capex per enterprise for manufacturing in FY27 stands at \u20b9 190 crore.\n\nAgriculture, forestry and fishing, construction, wholesale and retail trade and repair of motor vehicles and motorcycles, information and communication, professional, scientific and technical activities, education, human health and social work activities, arts, entertainment and recreation are among the segments which have recorded lower or stagnant capex per enterprise in recent years.\n\nHowever, non-conventional energy is exhibiting a positive trend, led by strong momentum in solar investments, as per the survey.", "source": "LiveMint Markets", "pub_date_str": "15 Oct 2026, 05:13 PM IST", "pub_date_relative": "1h ago"}, {"title": "How much salary do you need to live comfortably in a Tier 1 city? Here\u2019s what a 25-year-old should aim for", "full_content": "A good salary does not always translate into a comfortable lifestyle. For young professionals, the real test is whether their income can cover rent, everyday expenses and personal interests while leaving enough money to save and invest for the future.\n\nFor a 25-year-old living independently, the monthly take-home salary needed to maintain this balance could range from \u20b9 70,000 in Pune to \u20b9 1.4 lakh in Mumbai, according to Uttam Agarwal, chief business officer at BajajCapital - La Premi\u00e8r. These estimates assume the individual wants to save 20-30% of their income.\n\nThere is no single salary that guarantees financial comfort, Agarwal said. The amount required depends on the city, neighbourhood, housing arrangements, personal preferences and financial commitments. Two people earning the same salary can have very different savings depending on how much they spend each month.\n\nHousing is often the biggest factor influencing the salary needed to live comfortably. Renting an apartment independently in Mumbai, for instance, can cost considerably more than sharing accommodation in Pune. The income required to maintain a similar lifestyle and savings rate can therefore vary significantly.\n\nThe following are Agarwal's indicative monthly take-home salary estimates for a 25-year-old living independently and aiming to save 20-30% of income.\n\nThese are indicative estimates, not fixed thresholds for comfortable living. Actual expenses will depend on rent, transport, food, discretionary spending and financial obligations. Someone sharing accommodation or living with family may be able to save more on a lower salary, while a person paying high rent or supporting family members may need a higher income to maintain the same savings rate.\n\nThe amount left after monthly expenses is therefore as important as the salary itself.", "source": "LiveMint Money", "pub_date_str": "15 Oct 2026, 05:10 PM IST", "pub_date_relative": "1h ago"}, {"title": "Newly listed stock has 30% upside potential! JM Financial issues buy call; Check target price and key triggers", "full_content": "E-commerce enablement platform Shiprocket , which debuted on Indian stock exchanges in August, has received a bullish outlook from domestic brokerage firm JM Financial.\n\nIn its latest report, the brokerage highlighted the company's diversified approach to capitalizing on India's expanding commerce enablement opportunity, its growing merchant base, and opportunities in its emerging businesses. JM Financial expects these factors to push revenue to \u20b9 43.4 billion by FY29E.\n\nJM Financial said Shiprocket\u2019s core shipping business serves as an entry point for merchant relationships, allowing the company to benefit from rising online sales and higher transaction volumes without owning logistics infrastructure.\n\nIt expects the core business to grow at a compound annual growth rate (CAGR) of around 18% between FY26 and FY29, with its adjusted EBITDA margin expanding from 12.6% to around 15.3%.\n\nThe brokerage also highlighted the growth potential of Shiprocket\u2019s emerging businesses, which include fulfillment, omnichannel solutions, checkout, marketing, and cross-border services. It estimates that revenue from these businesses will rise from \u20b9 5.4 billion in FY26 to \u20b9 18.8 billion by FY29, increasing their contribution to total revenue from around 27% to 43%.\n\nHowever, it expects the segment to remain loss-making through FY28 before turning profitable in FY29, with adjusted EBITDA of around \u20b9 0.7 billion.\n\nShiprocket operates across two segments\u2014Core Business and Emerging Business.", "source": "LiveMint Markets", "pub_date_str": "15 Oct 2026, 05:07 PM IST", "pub_date_relative": "1h ago"}, {"title": "Wall Street To Open Lower? AI Stock Selloff Among Key Reasons Weighing On US Stock Futures", "full_content": "US stock futures were mixed on Thursday, with Nasdaq-100 futures down over 1% as an AI stock selloff and renewed inflation concerns weighed on sentiment, while investors awaited fresh economic data and corporate earnings.", "source": "NDTV Profit", "pub_date_str": "15 Oct 2026, 05:03 PM IST", "pub_date_relative": "1h ago"}, {"title": "ICICI Life Insurance shares: Despite 34% slump in 2026, Religare sees 42% upside post Q2 results | Here's why", "full_content": "Shares of ICICI Life Insurance Ltd have declined 34% so far in 2026, but Religare Broking sees significant recovery potential following the insurer\u2019s September-quarter results. The brokerage has reiterated its \u2018Buy\u2019 rating with a target price of \u20b9 650, implying a 42.6% upside from the closing price of \u20b9 456 on 14 October.\n\nIn its assessment, Religare highlighted the company\u2019s leadership transition, distribution strategy and operating efficiency as key factors supporting its growth outlook. The appointment of Siddharth Mishra as Managing Director and CEO, alongside the company\u2019s rebranding as ICICI Life Insurance Ltd, is expected to ensure strategic continuity, with a continued focus on customer-centricity, deeper penetration of micro-markets and proprietary distribution channels.\n\nThe brokerage also views the Insurance Regulatory and Development Authority of India\u2019s (IRDAI) consultation paper on distribution economics constructively. It believes enhanced renewal commission allowances could better align the interests of distributors, policyholders and insurers, while encouraging better underwriting quality and policy persistency. Religare expects the company\u2019s lean cost structure to help cushion the impact of potential changes in industry-wide distribution economics.\n\nHowever, the brokerage anticipates near-term softness in market-linked savings products and a normalisation in retail protection growth following four quarters of strong expansion after the goods and services tax (GST) changes.\n\nReligare estimates ICICI Life Insurance\u2019s annualised premium equivalent (APE), value of new business (VNB) and embedded value (EV) to grow at compound annual growth rates of 15.3%, 19.2% and 11.9%, respectively, between FY26 and FY28.", "source": "LiveMint Markets", "pub_date_str": "15 Oct 2026, 05:02 PM IST", "pub_date_relative": "1h ago"}, {"title": "IT Stocks Bounce After A Brutal Year: Is It Bottom-Fishing Or The Start Of A Rally?", "full_content": "Nifty IT has risen more than 8% in three sessions after HCLTech's results, but a weak Wipro quarter and divided brokerages suggest the recovery is still selective.", "source": "NDTV Profit", "pub_date_str": "15 Oct 2026, 05:01 PM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "Wholesale prices jumped 6.3% annually in September, biggest gain since 2022", "full_content": "September's producer price index came in much hotter than economists forecasted on Thursday, underscoring the continued inflationary pressure from energy amid the U.S. war with Iran.\n\nThe measure of underlying inflation pressures climbed 1.3% in September and 6.3% on an annual basis, marking its largest 12-month advance since late 2022, according to the Bureau of Labor Statistics.\n\nEconomists polled by Dow Jones forecasted an advance of 0.6% on the month and 5.5% annually.\n\nEnergy drove a sizable chunk of those increases as the Middle East conflict has curtailed oil supply and sent prices surging. Excluding food, energy and trade, a stripped-down measure of PPI added just 0.5% in September and 5% compared with a year prior.\n\nIt's the latest report in recent days showing that inflation continues to hit consumers and companies.\n\nWednesday's consumer price index release showed an increase of 0.6% from August to September and 3.7% on a 12-month basis. Economists polled by Dow Jones had forecasted growth of 0.6% and 3.6%, respectively.\n\nSo-called core CPI, which removes volatile food and energy costs, added 0.3% on the month and 2.6% compared with a year ago. Economists anticipated increases of 0.2% and 2.5%, respectively.\n\nThis week's beige book from the Federal Reserve had the highest number of mentions of terms related to inflation on record, according to an analysis from Bespoke Investment Group.", "source": "CNBC Top News", "pub_date_str": "15 Oct 2026, 06:15 PM IST", "pub_date_relative": "just now", "cfa_topics": ["Economics", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "U.S. Treasury dismisses IMF debt warning and 'messy' forecasting", "full_content": "The International Monetary Fund should check its own forecasting record before criticizing U.S. fiscal policy, David Zervos, newly appointed counselor to the Treasury Secretary , said on Thursday.\n\n\"When we see pieces on the IMF, it's good to remember how messy their forecasts have been in the past,\" Zervos said in emailed comments to CNBC.\n\nThe former Wall Street economist was responding to the IMF's Managing Director Kristalina Georgieva, who cautioned during the IMF-World Bank annual meetings in Bangkok on Wednesday that strong U.S. economic growth would not be sufficient to put mounting federal debt on a sustainable course.\n\nGeorgieva was herself responding to U.S. Treasury Secretary Scott Bessent, who told CNBC in August that the U.S. could \"grow our way out\" of a rising debt-to-GDP ratio, after government debt surpassed $40 trillion .\n\nZervos, formerly chief market strategist at Jefferies, said Thursday: \"In 2008, [the IMF's World Economic Outlook] had world growth at 3% and we had the first global contraction in post-world history a year later. We saw them positive on Southeast Asia in 1997 before the collapse.\"\n\n\"We saw them very negative on Russia in 2022, and Russia actually barely saw a blip down in growth before it started growing strongly . We saw them very positive on Argentina after their big bailout of $57 billion . And by 2020, Argentina was basically in default again . And the history books go on and on, whether it's Greece, whether it was the transitory call on inflation in the U.S.\"\n\nMany economists warn that mounting U.S. interest payments and a high deficit have raised the risk of an unsustainable debt spiral. However, they are divided on whether the U.S. could be pushed into a true fiscal crisis .\n\nThe IMF's Georgieva has issued similar warnings to other big economies over the need for fiscal consolidation, telling CNBC on Oct. 7 that her message to France was: \"Get your house in order.\"", "source": "CNBC Top News", "pub_date_str": "15 Oct 2026, 06:10 PM IST", "pub_date_relative": "4m ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "This 30-year market veteran is alarmed by a record-chasing S&P 500. Here\u2019s where he\u2019s investing instead.", "full_content": "Steven Jon Kaplan sees a completely irrational stock market right now, and investors ignoring a perfectly safe way to play that.", "source": "MarketWatch Top Stories", "pub_date_str": "15 Oct 2026, 06:10 PM IST", "pub_date_relative": "5m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Bank of America shares flat after earnings-driven sell-off, slide over 20% from recent peak", "full_content": "After a 5% earnings-led crash in the previous session, shares of Bank of America (BofA) were trading flat in pre-market trading on Thursday. Profits at the second-largest US bank fell more than 15% in the third quarter after it took a $1.2 billion hit from a regulatory fine related to money laundering and sanctions violations.\n\nThe company announced a $1.2 billion non-tax-deductible charge related to the fines. The US Treasury Department said on Tuesday that the bank had effectively outsourced a key part of its compliance efforts as it sought to protect revenue.\n\nBofA said the costs of remediating the issues were already factored into its expenses.\n\nThe charge reduced earnings by 17 cents per share and contributed to a 17% decline in net income to $6.9 billion from $8.3 billion a year earlier. The bank's total revenue came in at nearly $30 billion, missing analysts' consensus estimates.\n\nIts trading businesses also delivered weaker-than-expected results. Fixed-income trading revenue declined 17% to $2.55 billion, while equity-trading revenue increased 10% to $2.51 billion.\n\nDespite the earnings pressure, Bank of America's loan balances increased 6.3% year-on-year to $1.23 trillion at the end of the third quarter, in line with analysts' estimates. Meanwhile, investment-banking revenue fell 11% to $1.82 billion, although it came in above analysts' expectations.\n\nFees for advising on mergers and acquisitions declined 19%. Revenue from equity issuance increased 9.1%, while debt-issuance revenue fell nearly 14%.\n\nMeanwhile, the results offered insights into the health of US consumers amid rising interest rates and elevated gas prices linked to the conflict in Iran. The bank set aside $1.27 billion for potentially souring loans, below analysts' expectations of $1.5 billion.", "source": "LiveMint Markets", "pub_date_str": "15 Oct 2026, 06:06 PM IST", "pub_date_relative": "9m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Fixed Income", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Nasdaq 100 futures hold onto losses after hot U.S. producer inflation report", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Oct 2026, 06:05 PM IST", "pub_date_relative": "10m ago", "cfa_topics": ["Economics", "Equity Investments", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "PPI surges as inflation concerns grow, exceeding forecasts", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Oct 2026, 06:04 PM IST", "pub_date_relative": "11m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Wall Street's latest AI spook, Netflix layoffs, 'good debt' and more in Morning Squawk", "full_content": "This is CNBC's Morning Squawk newsletter. Subscribe here to receive future editions in your inbox.\n\nHappy Thursday. CNBC's \"Halftime Report\" and \"Closing Bell\" will both air live from San Francisco for special \"AI in America\" shows today. Watch live on CNBC or CNBC+.\n\nNasdaq futures are lower this morning. The market is coming off a rough day , which we recap below.\n\nHere are five key things investors need to know to start the trading day:\n\nAfter a quiet start to the week, investors sent stocks sliding in yesterday's session amid worries of artificial intelligence overspending. The S&P 500 and Nasdaq Composite each dropped more than 1%, marking their worst days in over two months.\n\nYesterday's consumer price index data came in hotter than economists anticipated on a 12-month basis, largely thanks to surging energy prices.\n\nThe report marked the 66th straight annual CPI reading above the widely accepted inflation target of 2%, according to a CNBC analysis. That's the longest such stretch in this century. Cleveland Federal Reserve President Beth Hammack warned last week consumers might be starting to accept high inflation as a \"fact of life,\" which could have negative implications for the effectiveness of monetary policy tools.\n\nSeptember's producer price index \u2014 which tracks wholesaler inflation \u2014 and retail sales data are slated to be released this morning.", "source": "CNBC World Economy", "pub_date_str": "15 Oct 2026, 06:02 PM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Economics", "Equity Investments", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Earnings call transcript: Flerie Q3 2026 NAV slips as biotech write-downs weigh", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Oct 2026, 06:00 PM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Empire State Manufacturing Index Surges, Surpassing Expectations", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Oct 2026, 06:00 PM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Alpha Modus to test AI platform at three grocery stores", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Oct 2026, 05:58 PM IST", "pub_date_relative": "17m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Oil prices slips as US weighs easing sanctions on \u2019shadow fleet\u2019", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Oct 2026, 05:54 PM IST", "pub_date_relative": "21m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Cyient DLM Q2: Revenue Jumps 26.5% To Rs 393 Crore, Margin Contracts", "full_content": "Cyient DLM reported 26.5% year-on-year revenue growth in Q2 FY27, while EBITDA margin narrowed to 8.7% from 10.1% a year ago. Its order book hit a record Rs 2,813.7 crore.", "source": "NDTV Profit", "pub_date_str": "15 Oct 2026, 05:50 PM IST", "pub_date_relative": "25m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Tech Mahindra Q2: Board Recommends 1:1 Bonus Share Issue; To Pay Rs 15 Per Share Dividend", "full_content": "Tech Mahindra will pay an interim dividend of Rs 15 per share.", "source": "NDTV Profit", "pub_date_str": "15 Oct 2026, 05:50 PM IST", "pub_date_relative": "25m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Nvidia CEO Jensen Huang urges U.S.-China dialogue on 'potentially dangerous' AI", "full_content": "Nvidia CEO Jensen Huang said the chipmaker \"absolutely must\" work with Chinese AI companies on monitoring risks around the \"potentially dangerous\" technology.\n\n\"We absolutely should work with each other so that we advance the technology safely,\" he told CNBC during a media briefing on Wednesday evening in London.\n\nDiscussions around AI safety have intensified in recent months, after researchers from AI labs including OpenAI and Anthropic called for a slowdown in developing the tech and warned of existential risks to humanity.\n\nWhile OpenAI's Sam Altman and Anthropic's Dario Amodei have called for greater regulation , Huang has emerged as a prominent voice in opposition to that view.\n\nHuang said that \"dialogue\" was the way to work with Chinese AI companies, adding that he has \"dialogues with many of the researchers in China.\"\n\n\"We ought to enhance the dialogue,\" he added. \"The United States should do it... I advocated that the U.K. do the same thing.\"\n\nAI safety has become a key topic between the U.S. and Chinese governments, with both countries weighing how to address the risks posed by the rapidly advancing tech.\n\nPrior to U.S. President Donald Trump's meeting with Chinese counterpart Xi Jinping, U.S. Treasury Secretary Scott Bessent discussed the prospect of a \"U.S.-China AI dialogue\" with his Chinese counterpart, He Lifeng, in September, including a channel for incidents \"up to a national security level.\"", "source": "CNBC World Economy", "pub_date_str": "15 Oct 2026, 05:47 PM IST", "pub_date_relative": "28m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "IRFC Q2 results 2026, dividend: Navratna PSU declares highest-ever dividend; Profit rises 10% to \u20b91,958 cr", "full_content": "IRFC Q2 results: Government-backed Indian Railways Finance Corporation (IRFC) Limited, on Thursday, October 15, reported a 10% year-on-year increase in its net profit to \u20b9 1,958 crore in the quarter ending in September, 2026. The Navratna PSU also declared its highest ever dividend today.\n\nIRFC share price ended marginally lower on Thursday after seeing some recovery during the closing session. The railway PSU stock has declined nearly 36.70% in one year.\n\nThe Navratna PSU\u2019s net profit increased by 10% to \u20b9 1,958.48 crore in Q2FY27, against \u20b9 1,776.98 crore reported in the year-ago period. The Ministry of Railway\u2019s NBFC reported a net profit of \u20b9 1,927.21 crore in the year-ago period. The company\u2019s net revenue increased to \u20b9 7,866.41 crore during the quarter under review. Its net revenue stood at \u20b9 6,371.89 crore in Q2FY27 and at \u20b9 8,261.11 crore in Q1FY27.\n\nThe company\u2019s board of directors approved an interim dividend of \u20b9 1.15 per equity share with a face value of \u20b9 10 each. This is the highest ever dividend amount announced by the Navratna PSU. IRFC has also announced record date to determine the eligibility of shareholders for the payout.\n\nIRFC has fixed Friday, Oct 23, 2026 , as the record date to determine the eligibility of shareholders for the payout. The payout will be made to \u201cthose shareholders, whose names appear (i) as beneficial owners in the statement(s) furnished by the depository(ies) as on the close of business hours on Friday, 23rd October 2026 in respect of shares held in dematerialized form; and (ii) as members in the register of members on Friday, 23rd October 2026 in respect of physical shares,\u201d stated the firm in its BSE filing.\n\nIRFC dividend will be paid to eligible shareholders within 30 days from the date of its declaration to those shareholder.\n\nIRFC share price closed 0.94% lower at \u20b9 79 per equity share with a market capitalisation of \u20b9 1,03,241.20 crore on Thursday.", "source": "LiveMint Markets", "pub_date_str": "15 Oct 2026, 05:46 PM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Memory stocks are getting hammered. China and a 2029 oversupply are the big worries", "full_content": "Memory chip stocks have taken a particularly bad beating this week amid broader equity market turmoil.\n\nTwo concerns are adding to the pressure \u2014 the debate over whether Chinese competition is threatening memory incumbents and speculation about when the market could become oversupplied.\n\nOver the last five days, SK Hynix has plunged 26%, Samsung has tanked 22% and Micron has dropped around 11%.\n\nThe initial jitters came at the start of the week after China's leading memory chipmaker ChangXin Memory Technologies, or CXMT , announced plans to roll out a server memory product based on new architecture .\n\nCXMT's design would allow higher storage density, raising concerns that the breakthrough could result in the Chinese company taking global market share from rivals Samsung, SK Hynix and Micron.\n\nHowever, a number of analysts questioned whether CXMT would be able to scale the production of such an advanced technology.\n\n\"The issue, of course, was with any architectural change ... you can make the chips, but what yield are you getting? If you're only getting a 50% yield, you're literally putting half the chips in the bin because they don't work very well,\" Ben Barringer, global head of technology research at Quilter Cheviot, told CNBC's \"Squawk Box Europe\" on Wednesday.\n\nKevin Cassidy, a senior research analyst at Rosenblatt Securities, also said the developments at CXMT are unlikely to add more supply of memory onto the market.", "source": "CNBC World Economy", "pub_date_str": "15 Oct 2026, 05:45 PM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Equity Investments", "Fixed Income", "Derivatives"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Tata Trusts Challenges Mehli Mistry's Right To Contest Trustee Changes After Term Expiry", "full_content": "Tata Trusts has argued before the Maharashtra Charity Commissioner that Mehli Mistry cannot challenge trustee changes after his term expired, while a separate dispute involves Noel Tata's proposed appointment.", "source": "NDTV Profit", "pub_date_str": "15 Oct 2026, 05:44 PM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Analysis: Why a $2 trillion deficit and 5% Treasury yields are becoming America's biggest economic challenge", "full_content": "Long-term bond yields above 5% and a $2 trillion deficit are giving Americans a taste of what a U.S. debt crisis would be like. A true emergency would hurt much more, and isn't baked in. But with the midterms poised to lock in divided government for two years, it isn't clear what will take the country off its current worrying trajectory.\n\nHigher interest rates exacerbated by the flood of federal debt issuance are starting to bite in some parts of the economy and threaten to worsen the government's debt problem. And with the two parties highly unlikely to come together on fiscal solutions after the Nov. 3 midterms, any fixes are years off in the future.\n\nThe housing market is showing signs of slowing as the average 30-year fixed-rate mortgage hovers around 7.5%. Pending home sales fell 4% in September, Redfin said Monday, the biggest monthly drop in three years.\n\nMortgage rates track the 10-year Treasury yield . The 10-year has climbed 123 basis points, or hundredths of a percentage point, since the end of February through Wednesday's close, when the 10-year traded at 5.19%.\n\nSeveral factors are pushing up the 10-year, including the war with Iran, which kicked off on Feb. 28 and precipitated the rise in long-term yields. Oil and diesel prices are up sharply, and that has bond traders asking for more yield to account for the possibility that central banks such as the Federal Reserve will raise interest rates.\n\nIn addition, investors want more compensation to hold longer-term bonds in part because they believe the U.S. government will continue to flood the market with them. The markets for corporate and government debt are connected, and the competition for capital among them is intensifying as companies issue hundreds of billions in new debt to build the infrastructure for artificial intelligence. Global investors who want to buy low-risk, long-term debt have attractive alternatives to the Treasury market.\n\nIf the U.S.", "source": "CNBC Top News", "pub_date_str": "15 Oct 2026, 05:41 PM IST", "pub_date_relative": "34m ago", "cfa_topics": ["Fixed Income", "Alternative Investments"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Rentomojo share price jumps 38% from IPO price in nearly 1 month | Check 5 factors driving the surge", "full_content": "Rentomojo shares have surged 38% above their IPO issue price of \u20b9 404, as investors assess the company\u2019s strong revenue growth, improving profitability and rising demand for rental furniture and appliances. Rentomojo shares listed on the stock exchanges on 17 September 2026.\n\nIshan Tanna, Senior Associate at Ashika Capital, said the company\u2019s Q1 FY27 results highlighted robust demand, improving monetisation and healthy utilisation of its rental inventory.\n\nRentomojo\u2019s \u20b9 1,250 crore initial public offering (IPO) was subscribed 73 times, and the stock listed at a premium of around 20% to its issue price. According to Tanna, the company\u2019s June-quarter performance has further strengthened investor interest, with its market capitalisation rising 8% to \u20b9 5,800 crore following the results announcement, less than three weeks after listing.\n\nRevenue from operations increased 51% year-on-year to \u20b9 126.3 crore in Q1 FY27. Tanna highlighted the company\u2019s normalised EBITDA of \u20b9 52.3 crore, translating into a margin of around 41%, while normalised earnings before interest and tax (EBIT) stood at \u20b9 29.2 crore, with a margin of nearly 23%.\n\nHowever, reported profitability was affected by an exceptional loss of \u20b9 11.37 crore following a fire at the company\u2019s Noida warehouse.\n\nTanna pointed to strong growth in customer demand, with items ordered increasing 45.8% year-on-year to 3.29 lakh and live subscribers rising 36.3% to 2.83 lakh. Rentomojo\u2019s live rental inventory also expanded 41% to 9.23 lakh items.\n\nInventory utilisation improved alongside this expansion. Average occupancy increased to 85.7% from 83.3% a year earlier, while period-end occupancy reached 86.8%. These trends highlight the company\u2019s ability to grow its rental inventory while maintaining healthy utilisation levels, according to the brokerage assessment.\n\nTanna also highlighted improvements in monetisation.", "source": "LiveMint Markets", "pub_date_str": "15 Oct 2026, 05:40 PM IST", "pub_date_relative": "35m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "There\u2019s a \u2018monstrous bull market\u2019 developing under the surface of the S&P 500. This hedge-fund manager tells you where it\u2019s at.", "full_content": "The index may not move much because the stocks with the biggest weightings lag, but there\u2019s a bull market starting to bubble elsewhere, says a hedge-fund manager.", "source": "MarketWatch Top Stories", "pub_date_str": "15 Oct 2026, 05:38 PM IST", "pub_date_relative": "37m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Anthropic Revenue Jumps To $16.8 Billion In Quarter Before IPO", "full_content": "Anthropic is generating positive free cash flow, had adjusted gross margin of 85% and an over 11% positive adjusted operating margin as of the third quarter, according to the people.", "source": "NDTV Profit", "pub_date_str": "15 Oct 2026, 05:37 PM IST", "pub_date_relative": "38m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "RBI issues clarifications on forex hedging curbs", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Finance \u203a RBI issues clarifications on forex hedging curbs The Economic Times daily newspaper is available online now. Read Today's Paper RBI issues clarifications on forex hedging curbs SECTIONS RBI issues clarifications on forex hedging curbs ET Online Last Updated: Oct 15, 2026, 05:45:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Reserve Bank of India issued clarifications on its recent measures to support the rupee. This followed concerns about tighter hedging rules and cash margins on certain derivatives. Several lenders have held back on quoting dollar-rupee forwards due to confusion regarding transaction requirements. The measures included redirecting oil companies' dollar purchases and levying cash reserve requirements. The impact of these measures has raised uncertainties in the financial markets.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\nThe ABCD of the US mid-term elections \u2013 Part 1: Why it matters across the globe\n\nOnion inflation at 108%? Yes, but not really. What is different this time?\n\nCurbing rupee bets: What the RBI\u2019s new rules mean for the hedge-now-or-wait question\n\nBrinjal, buffalo, bacteria: Inside India\u2019s pay-for-nature system\n\nHomebuyers wait as NCLT panel picks holes in unfinished Jaypee projects\n\nThe NBFC saga - Part 3: How one default in 2018 changed the way RBI reads risk", "source": "Economic Times Economy", "pub_date_str": "15 Oct 2026, 05:34 PM IST", "pub_date_relative": "41m ago", "cfa_topics": ["Economics", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Torrent Power plans around $500
