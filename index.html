<script>

    const allData = {"general": [{"title": "I\u2019ve been married for 58 years. It\u2019s \u2018our\u2019 money, not \u2018his\u2019 and \u2018hers.\u2019 Why do so many couples keep their finances separate?", "full_content": "\u201cMy wife stopped working outside the home in 1970.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "24 Nov 2026, 06:31 AM IST", "pub_date_relative": "1m ago"}, {"title": "HPE just posted its strongest growth ever \u2014 but its stock is sinking", "full_content": "HPE boosted its financial forecast on Monday in the face of strong AI demand.", "source": "MarketWatch Top Stories", "pub_date_str": "24 Nov 2026, 06:31 AM IST", "pub_date_relative": "1m ago"}, {"title": "Amazon faces FAA probe after delivery drone strikes Michigan fiber cable, garage", "full_content": "The Federal Aviation Administration said Monday it will investigate a recent Amazon drone crash near Detroit.\n\nOn Friday, one of Amazon's MK30 drones \"landed on a resident's garage\" during a delivery in Huntington Woods, Michigan, a suburb north of Detroit, Amazon spokesperson Jack Stelzner told CNBC in a statement.\n\nThe crash occurred after the drone dropped off a customer's shampoo order around 4:30 p.m. local time, and one of its propellers was damaged in the incident, according to ABC affiliate WXYZ .\n\nA preliminary incident report posted to the FAA's website states the drone \"struck a fiber cable, a residential garage, and became entangled in power lines during takeoff.\" The report says the condition of the drone is unknown.\n\nStelzner said there were no injuries, the drone has been removed and Amazon is in contact with the resident.\n\n\"Safety is our top priority and incidents are extremely rare,\" Stelzner said. \"Anytime a delivery does not go as planned we investigate what happened and use the findings to further improve the service.\"\n\nAn FAA spokesperson confirmed it's investigating the incident. A spokesperson for the National Transportation Safety Board, a federal agency that also investigates aviation accidents, said it's aware of the incident and is continuing to gather information. The agency hasn't yet determined whether it will open a probe, the NTSB spokesperson added.\n\nAmazon has been working to make widespread drone delivery a reality ever since founder Jeff Bezos laid out his vision for the program nearly 13 years ago. The rollout has been slow, as the program encountered regulatory delays and staff cuts , as well as technical challenges and pushback from some communities where it conducted early pilots.", "source": "CNBC Top News", "pub_date_str": "24 Nov 2026, 06:26 AM IST", "pub_date_relative": "6m ago"}, {"title": "Nvidia partner and supplier stocks in Asia jump after Jensen Huang's return", "full_content": "Key Nvidia partners and suppliers in Asia saw their shares skyrocket on Tuesday as investors piled back into the tech market, following the reinstatement of Nvidia CEO Jensen Huang by its board.\n\nIn South Korea, Nvidia suppliers Samsung Electronics and SK Hynix jumped 6% and 8% respectively. The two companies, which together make up over 40% of the Kospi's weighting, sent the index up almost 6%, leading gains in Asia. The rise in the index triggered the Korea Exchange's sidecar on the index, reportedly making it the 100th sidecar the KRX has activated.\n\nJapan's Softbank Group Corp , a major investor in the chip space, climbed over 3%. Semiconductor test company Advantest , as well as counterpart Tokyo Electron , jumped 12% each. Both companies are collaborators with Nvidia.\n\nNvidia's stock had closed up 31% following Huang's reinstatement. It had previously shed nearly 33% from the time Huang admitted to an extramarital affair on Nov. 8. This is breaking news, please check back for updates.", "source": "CNBC World Economy", "pub_date_str": "24 Nov 2026, 06:23 AM IST", "pub_date_relative": "9m ago"}, {"title": "Jensen Huang\u2019s comeback to Nvidia underscores his outsized grip on AI", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Nov 2026, 06:19 AM IST", "pub_date_relative": "13m ago"}, {"title": "South Korea\u2019s central bank seen raising rates on Thursday, once more next quarter - Reuters poll", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Nov 2026, 06:19 AM IST", "pub_date_relative": "13m ago"}, {"title": "Trump orders US Army to pause detonation of lead explosives in Iowa", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Nov 2026, 06:19 AM IST", "pub_date_relative": "13m ago"}, {"title": "Explainer-What are the various US federal and state probes faced by Nvidia and Jensen Huang?", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Nov 2026, 06:18 AM IST", "pub_date_relative": "14m ago"}, {"title": "Japan factory activity strengthens in Nov, services growth slows", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Nov 2026, 06:14 AM IST", "pub_date_relative": "17m ago"}, {"title": "Stock futures inch higher as traders see whether Nvidia can extend rally from Jensen Huang\u2019s return: Live updates", "full_content": "U.S. stock futures were slightly higher Monday evening after Jensen Huang's return as Nvidia CEO sent the chipmaker's shares soaring and sparked a rebound in the artificial intelligence trade.\n\nFutures tied to the Nasdaq-100 futures were marginally higher. Dow Jones Industrial Average futures advanced 91 points, or 0.2%, while S&P 500 futures gained 0.2%.\n\nIn Asia, South Korea's Kospi jumped over 5% on Tuesday, leading gains in the region. Heavyweights Samsung Electronics and SK Hynix saw gains of about 7% and 8% respectively.\n\nJapan's Nikkei 225 also rose 2.82%, while the broad based Topix was up 1.6%. Australia's S&P/ASX 200 was also up 1.3%.\n\nNvidia surged 31% during Monday's regular session, leading a rally in chip stocks. The Nasdaq Composite closed 6.5% higher, the S&P 500 finished up 4.7% and the Dow Industrials rose 3% Monday.\n\nIt was the best session for the Nasdaq and the S&P 500 since April 9, 2025 when President Donald Trump announced a reprieve on tariffs.\n\nThe tech sector of the S&P 500 soared 9%, powered by sharp gains in semiconductors, memory names and neoclouds. Advanced Micro Devices added almost 7%, while Micron Technology surged 19%. Neocloud stock CoreWeave jumped 22%.\n\nThe market action was a sharp reversal from Friday's steep sell-off, which saw the S&P 500 and Dow close in correction as the AI trade suffered and Nvidia tanked.", "source": "CNBC Top News", "pub_date_str": "24 Nov 2026, 06:12 AM IST", "pub_date_relative": "20m ago"}, {"title": "334% return in 3 years! Smallcap textile stock's \u20b95 to \u20b92 stock split record date nears - Check eligibility, ratio", "full_content": "Sharmila Bhadoria Published 24 Nov 2026, 06:09 AM IST Prefer Livemint on Google Shares of Varvee Global Limited ended a percentage point higher on Monday, November 23, ahead of its upcoming stock split record date. The smallcap textile stock is set to split from face value of \u20b9 5 to \u20b9 2 each.\n\nFor investors who closely track corporate actions like stock-split, here are all the details to know.\n\nThe company\u2019s board of directors has approved stock split or subdivision of shares such that \u201cone equity share having face value of \u20b9 5 each, fully paid-up, be sub-divided/split into \u20b9 2 each.\u201d\n\nThe sub-divided shares post corporate action will \"rank pari-passu in all respects which was approved by the equity shareholders through postal ballot\". It means that the additional stocks will carry the same voting rights as existing equity shares, have equal entitlement to dividends, rank equally in the company's capital structure and will also have the same rights and privileges as existing shares.\n\nThe company\u2019s board of directors fixed Friday, November 27, as the record date to determine the eligibility of shareholders for the corporate action. Which means that investors must own the stock on or before the record date to qualify for stock split.\n\nThe stock closed 1% higher at \u20b9 54.37 per share on BSE with a market capitalisation of \u20b9 280.16 crore on Monday, November 23. Its share price value has declined 11.45% in two weeks, but surged 10.87% in one month. The stock has declined 20% in six months, 23% in 2026 so far, and 28% in one year.\n\nVarvee Global share price touched its 52-week high level of \u20b9 84.08 per share on BSE on December 18, 2025. The stock dipped to its 52-week low level of \u20b9 44 per share on October 23, 2026.\n\nCatch all the Business News , Market News , Breaking News Events, JIO IPO Listing Today LIVE and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.", "source": "LiveMint Markets", "pub_date_str": "24 Nov 2026, 06:09 AM IST", "pub_date_relative": "23m ago"}, {"title": "Japan\u2019s factory activity expands in November, PMI shows", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Nov 2026, 06:06 AM IST", "pub_date_relative": "26m ago"}, {"title": "ANZ brings forward RBA rate-cut call to June 2027 as jobs market weakens", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Nov 2026, 06:04 AM IST", "pub_date_relative": "28m ago"}, {"title": "Expensify director Steven McLaughlin sells $792,855 in stock, priced $1.47-$1.59", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Nov 2026, 06:01 AM IST", "pub_date_relative": "31m ago"}, {"title": "Four AI stocks with multi-year growth plans to watch for the long term", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nArtificial intelligence (AI) spending is still climbing. Yesterday, Nvidia reported that its Data Center revenue rose 110% year on year to US$ 107.6 billion (bn) in the September-October quarter and guided for total revenue of US$ 130 bn in the next quarter.\n\nThat money is being spent by companies building AI systems , and a large part of it will flow to the firms that help them build, run and use those systems.\n\nIn India, a few listed companies have turned that opportunity into stated, multi-year plans. Some are building capacity, such as an AI data centre. Others have set revenue targets for the end of this decade or are investing more in their own AI products.\n\nThese plans can take years to play out, but the current trajectory remains intact. AI is not in a bubble yet and is here to stay.\n\nWith that in mind, we looked at four Indian AI-related companies with clear multi-year plans. For each, we checked the latest results and what the plan involves.\n\nThe company is one of India's largest IT services and consulting companies, a part of the Tata Group.\n\nIts services include software development, cloud computing, artificial intelligence, cybersecurity, data analytics, enterprise solutions, and digital transformation.", "source": "LiveMint Markets", "pub_date_str": "24 Nov 2026, 06:01 AM IST", "pub_date_relative": "31m ago"}, {"title": "US blacklists Megaspeed cloud company linked to Nvidia scandal", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Nov 2026, 06:00 AM IST", "pub_date_relative": "31m ago"}, {"title": "Fermi director Toby Neugebauer sells $12.4M in stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Nov 2026, 06:00 AM IST", "pub_date_relative": "31m ago"}, {"title": "77 best early Black Friday deals: Bose, Apple, Nintendo on sale - Mashable", "full_content": "77 best early Black Friday deals: Bose, Apple, Nintendo on sale Mashable Black Friday Deals Are Already Rolling In \u2014 Here Are the Best | Reviews by Wirecutter The New York Times Black Friday deals are live: Major sales on Apple, Ugg, Michael Kors, Hoka, Dyson, Ring and more for Cyber Week 2026 Yahoo Black Friday deals are here and I\u2019m tracking 73+ of the best ones live up to 70% off NBC News Black Friday Fashion Sales Are Here\u2014These 18 Sites Are Worth Your Time ELLE", "source": "Google News Business", "pub_date_str": "24 Nov 2026, 05:41 AM IST", "pub_date_relative": "51m ago"}, {"title": "CrowdStrike CEO defends Zscaler acquisition, calls it a 'winning combination'", "full_content": "CrowdStrike CEO George Kurtz on Monday defended the cybersecurity company's planned acquisition of Zscaler , arguing the deal will strengthen its security capabilities and create significant growth opportunities despite a sharp sell-off in its shares.\n\n\"When you look at the tailwinds from these agentic attacks and you listen to customers, they're looking for a complete solution and a platform that delivers not only all of the capabilities we have, but also has network visibility, protection, and control, and zero trust from a network perspective,\" Kurtz told CNBC's Jim Cramer on \" Mad Money .\" \"This is why we acquired Zscaler today. The technology, the team, and we think it's a winning combination putting it together with the CrowdStrike platform.\"\n\nShares of CrowdStrike fell roughly 9% Monday after the company announced it would acquire Zscaler in an all-stock deal valued at roughly $44 billion, raising investor concerns about dilution. The deal is expected to close in the second half of CrowdStrike's fiscal year 2028. Zscaler shares rose more than 17%.\n\nThe acquisition overshadowed CrowdStrike's better-than-expected quarterly results released Monday morning. The company had been scheduled to report earnings on Dec. 1, but moved up the release date to coincide with the Zscaler announcement.\n\nThe acquisition fills a key gap in CrowdStrike's cybersecurity platform. While its Falcon platform protects devices and cloud systems, Zscaler adds security across the networks connecting them. Kurtz said the deal expands CrowdStrike's addressable market by roughly $185 billion.\n\nCrowdStrike's largest acquisition to date comes amid a wave of consolidation in the cybersecurity industry as companies ramp up defenses against increasingly sophisticated AI-powered attacks. Recent high-profile hacks and technology outages have heightened concerns about vulnerabilities in corporate systems.", "source": "CNBC World Economy", "pub_date_str": "24 Nov 2026, 05:23 AM IST", "pub_date_relative": "1h ago"}, {"title": "What Jensen Huang\u2019s return means for Nvidia\u2019s Colette Kress", "full_content": "Nvidia finance chief Colette Kress led the company for 11 days during Jensen Huang's sudden but brief departure. When Nvidia's board officially reinstated Huang as CEO on Monday, the company also announced that Kress would continue in her role as CFO.\n\nThe 59-year-old Kress currently has roughly 4.775 million shares directly and indirectly held, which makes her worth approximately $778 million at Monday's market close.\n\nThe 63-year-old Huang resigned earlier this month following revelations of extramarital relationships, including one involving an alleged Chinese spy.\n\nNvidia stock soared 31% and the Nasdaq surged more than 6% Monday after the company announced that Huang would return as CEO, president and board director, effective immediately. Huang returned to the office Monday to crowds of Nvidia employees cheering his return .\n\nKress, who stepped in as interim CEO during Nvidia's moment of crisis, joined the chipmaker as finance chief in September 2013 following stints at Cisco, Microsoft and Texas Instruments.\n\nAs CFO, Kress oversees the balance sheet of a company aggressively financing many of the infrastructure deals that power the artificial intelligence buildout. Those agreements also raise concerns over circular financing and Nvidia's AI exposure in the event of a slowdown.\n\nIn the first earnings call after Huang's resignation, Kress sought to reassure investors, raising the company's fiscal 2028 revenue-growth forecast to roughly 75% from 70%.\n\nShe told analysts during a Q&A portion that it was \"business as usual\" at the company. She later told CNBC's Jim Cramer that customers have stood by the chipmaker and that demand continues increasing.", "source": "CNBC World Economy", "pub_date_str": "24 Nov 2026, 05:20 AM IST", "pub_date_relative": "1h ago"}, {"title": "AI adoption grows in Asia, but measuring the gains remains tricky", "full_content": "Businesses across Asia-Pacific say their investments in artificial intelligence are paying off, with the technology helping boost productivity and revenue. But putting a number on those gains is proving far less straightforward.\n\nSome 58% of businesses using AI said their investments had already surpassed their initial costs, yet just 12% were very confident in their ability to accurately measure their return on investment, according to research conducted by Strand Partners for Amazon Web Services .\n\nThe survey included 9,750 business leaders across 10 Asia-Pacific markets: Australia, Indonesia, Japan, Malaysia, New Zealand, the Philippines, Singapore, South Korea, Thailand and Vietnam.\n\nThe biggest shift over the past year has been the growing number of companies moving AI projects into production, Jaime Vall\u00e9s, AWS vice president for Asia Pacific, Japan and China, told CNBC in an exclusive interview.\n\n\"From year over year, probably the biggest difference is you're seeing a lot of ideas put into production,\" Vall\u00e9s said.\n\nDespite the reported financial benefits, many businesses remain in the early stages of AI adoption.\n\nThe survey found that 64% of businesses using AI across Asia-Pacific and Japan still rely on general-purpose AI tools or ready-made solutions for specific tasks, while only 19% of businesses have a formal and comprehensive AI strategy.\n\nAmong those with such an AI strategy, 35% had reached the most advanced stage of adoption, compared with just 8% of businesses without one, according to the research.", "source": "CNBC World Economy", "pub_date_str": "24 Nov 2026, 05:12 AM IST", "pub_date_relative": "1h ago"}, {"title": "Trump sealed deal for Nvidia to rehire Jensen Huang as CEO", "full_content": "The stunning decision by Nvidia 's board to bring back Jensen Huang as CEO was sealed by a personal promise from President Donald Trump on Sunday that Huang had not broken national security laws, three people familiar with the board's thinking told CNBC.\n\nSeveral other factors also set the stage for Huang's return and accelerated discussions with him over the weekend, said the people, who spoke on condition of anonymity to discuss internal deliberations close to Nvidia's board.\n\nA sharp stock price drop after his resignation and questions about the leadership of interim CEO Colette Kress also spurred the board's decision, the people said.\n\n\"I convinced them,\" Trump told CNBC's Eamon Javers in a phone interview Monday morning , shortly after Nvidia announced Huang's return.\n\n\"I made the deal,\" the president said. \"It was a lot easier to convince them yesterday than it was a week and a half ago.\n\nTrump said Nvidia's board asked for guarantees that Huang, who resigned less than two weeks ago, was not a threat to national security.\n\n\"And we gave them assurances, at least with everything we know,\" the president said. \"We believe he's fine. He's absolutely fine.\"\n\nSenior Trump administration officials reached out to the board overnight Friday to inform them that Huang had not violated U.S. national security laws, people familiar with the board's actions said.", "source": "CNBC Top News", "pub_date_str": "24 Nov 2026, 05:12 AM IST", "pub_date_relative": "1h ago"}, {"title": "Employees at Eric Trump-backed robot startup lose health benefits as company's cash crunch deepens", "full_content": "Employees at Foundation Future Industries were told that their health benefits through administrator Rippling have been terminated, according to a memo obtained by CNBC, adding to mounting signs of financial distress at the humanoid robot startup advised and backed by Eric Trump .\n\nFoundation told staff in a Friday evening email that they'd be offered coverage through COBRA, the federal law that generally lets workers temporarily keep their health insurance after losing benefits by paying the full premium out of pocket.\n\n\"Because our last pay run through Rippling was in October, they have ended our benefits with them retroactive to October,\" a Foundation human resources manager said in the memo. \"COBRA will be offered to all employees to cover November.\"\n\nFoundation has garnered headlines for the bold claims that co-founder Sankaet Pathak \u2014 whose previous startup collapsed in 2024 \u2014 has made about his robots and their potential use in war zones. Employees were last paid on Oct. 15, and some inside the company are angry at Pathak for a $4.6 million loan he took from his company last year, CNBC reported earlier this month .\n\nA Foundation spokesman didn't immediately respond to an email or phone call seeking comment.\n\nIn the staff memo, Foundation blamed Rippling for the disruption to health coverage.", "source": "CNBC World Economy", "pub_date_str": "24 Nov 2026, 04:58 AM IST", "pub_date_relative": "1h ago"}, {"title": "Nvidia sets options-trading record after CEO comeback. Here are the big trades", "full_content": "One of the most dramatic about-faces in corporate America's history, Jensen Huang's return to the helm of AI chipmaker Nvidia spurred an equally historic record in the options market. More than 11 million options contracts traded on Nvidia stock Monday, the most active single day of trading for the stock's options in history. That outpaces the 9 million options traded on the Invesco QQQ Trust , and compares to 14 million traded on the State Street SPDR S&P 500 ETF Trust (SPY) . Despite Nvidia's monstrous 31% rally and options volume that was more than five times the 30-day average, positioning in the flows was not abnormally bullish. Of the top 10 trades by dollar amount, two big put sales stood out, but there were no likely outright call buys, based on data from Barchart and SpotGamma. If there was speculative call-buying, it was dwarfed by big trades between the 160 and 170 strikes, where four million options traded for almost $2 billion.\n\nNvidia, 1 month Nvidia closed near $165. \"People are mostly just trying to collect a lot of premiums through short vol trades and rolls once they heard about Jensen Huang, take advantage of the vol drop more than anything else,\" Jason DeLorenzo, founder of Volland, an options-analytics software, said by phone. \"It seems like options traders were all repricing, which created record volume, but did not create any obvious one-sidedness.\" Just under 6.7 million calls traded versus 4.3 million puts, according to Cboe LiveVol data. About 2.4 million calls were likely initiated by buyers, compared with 1.6 million purchasing puts, exchange data show. Open interest in calls was highest at the 170-strike, while open interest in puts was highest at the 150-strike, Barchart data show.", "source": "CNBC Top News", "pub_date_str": "24 Nov 2026, 04:54 AM IST", "pub_date_relative": "1h ago"}, {"title": "Republicans Break With Trump Over Jensen Huang\u2019s Reinstatement at Nvidia - The New York Times", "full_content": "Republicans Break With Trump Over Jensen Huang\u2019s Reinstatement at Nvidia The New York Times Trump Is Said to Have Pushed to Reinstate Nvidia CEO Jensen Huang The New York Times Dow soars 1,400 points; Nasdaq surges 6% in its best day since April 2025 as Jensen Huang returns to Nvidia CNBC NVIDIA Board Reinstates Jensen Huang as President, CEO and Board Director NVIDIA Newsroom Gold Holds Gain After Nvidia\u2019s Rehiring of Huang Sparks Rally Bloomberg.com", "source": "Google News Business", "pub_date_str": "24 Nov 2026, 04:48 AM IST", "pub_date_relative": "1h ago"}, {"title": "The newest addition to the S&P 500 is a maker of viral ice-cream machines", "full_content": "SharkNinja will join the S&P 500, replacing AES.", "source": "MarketWatch Top Stories", "pub_date_str": "24 Nov 2026, 04:48 AM IST", "pub_date_relative": "1h ago"}, {"title": "Jim Cramer sees more upside for Nvidia stock with Jensen Huang back as CEO", "full_content": "Nvidia's remarkable stock comeback isn't done yet now that Jensen Huang has returned as CEO , CNBC's Jim Cramer said Monday.\n\n\"It's terrific to have this admittedly tarnished national treasure back leading Nvidia,\" the \" Mad Money \" host said. \"It's kind of a miracle given the board's insistence that he would never get the CEO job again. But it's a miracle that saved the Nasdaq which, in turn, saved the market, at least for now.\"\n\nNvidia shares soared 31.5% on the news, fueling a broader rally in AI infrastructure stocks. The S&P 500 jumped 4.7%, while the tech-heavy Nasdaq Composite surged 6.5%, with both indexes posting their best days since April 2025. Monday's rebound erased nearly all of Nvidia's decline following Huang's Nov. 12 resignation amid reports of multiple extramarital affairs, including one involving an alleged Chinese spy. Before the rally Monday, the stock had fallen in all trading sessions since his departure.\n\n\"Jensen's only one man, and Nvidia is only one company,\" he said. \"But the truth is that Jensen is the linchpin that holds the AI solar system together, and Nvidia is the biggest beneficiary.\"\n\nCramer argued that Huang's reinstatement removes a major source of uncertainty for investors, strengthening the case for a higher valuation. The chipmaker delivered blockbuster quarterly results last week, raising its revenue growth outlook to 75%, but the results did little to stem the sell-off as investors remained concerned about its leadership.\n\n\"If it weren't for the Jensen overhang, and the insistence that Jensen could never come back, ... I think the stock would have been up significantly on that quarter,\" Cramer said.\n\nStill, Cramer cautioned that Huang's return doesn't erase the broader headwinds facing Nvidia. Growing political opposition to data center construction following the midterm elections could slow AI infrastructure expansion, while uncertainty surrounding chip sales to China threatens a potential source of demand.", "source": "CNBC World Economy", "pub_date_str": "24 Nov 2026, 04:44 AM IST", "pub_date_relative": "1h ago"}, {"title": "Jensen Huang cheered by Nvidia employees after return, pledges to be a better CEO", "full_content": "The mood inside Nvidia was jubilant as CEO Jensen Huang walked in on Monday to chants of his first name and three floors of cheering employees, according to a video shared with CNBC.\n\n\"Thank you all for the second chances,\" Huang said to the crowd. \"I'm going to be a better CEO the second time around.\"\n\nNvidia announced on Monday that Huang had been reinstated as CEO , effective immediately.\n\nIt was a dramatic turn in the chaos that's enveloped the chip giant and the entire tech trade since reports surfaced that Huang had an affair with an alleged Chinese spy . The reports sparked renewed investigations into the smuggling of restricted Nvidia chips into China.\n\nHuang admitted to an affair in a note to employees on Nov. 8 and resigned as CEO on Nov. 12. The New York Times and Reuters subsequently reported that Huang had relationships with two employees, one of whom was a direct report.\n\nOn Monday, cupcakes were circulating at the office with \"Jensen is back\" written on them, according to a person inside the company who asked not to be named because they were not authorized to speak publicly.\n\nThere was a sense of excitement among employees, as well as frustration over how the events of the last two weeks unfolded, the person said, adding that last Wednesday's all-hands meeting was a turning point.\n\nA side-by-side photo was circulated internally of an all-hands meeting hosted by Huang, contrasted with the most recent meeting with a group of executives and board members sitting on stage, according to the person.", "source": "CNBC World Economy", "pub_date_str": "24 Nov 2026, 04:43 AM IST", "pub_date_relative": "1h ago"}, {"title": "Nvidia live: Nvidia gains nearly $1tn in value after Jensen Huang reinstated - Financial Times", "full_content": "Nvidia live: Nvidia gains nearly $1tn in value after Jensen Huang reinstated Financial Times Why stocks are having their wildest Monday since 2008 Yahoo Finance Stock futures are flat after rally fueled by Jensen Huang\u2019s return to Nvidia\u2019s helm: Live updates CNBC How Epic Was Today\u2019s Stock Rally? WSJ Nvidia bears face $12.2 billion hit on Huang's surprise return Reuters", "source": "Google News Business", "pub_date_str": "24 Nov 2026, 04:38 AM IST", "pub_date_relative": "1h ago"}, {"title": "DNI Jay Clayton tapped as acting national cyber director", "full_content": "Director of National Intelligence Jay Clayton has been tapped to serve as acting national cyber director while the Trump administration's permanent nominee for the role awaits Senate confirmation, a White House official told CNBC on Monday.\n\nTrump had already added artificial intelligence czar to Clayton's portfolio in October. The official asked not to be named because the pick hasn't been announced.\n\nThe White House last week announced that President Donald Trump had picked Kirsten Davies , the Pentagon's chief information officer, to lead the Office of the National Cyber Director.\n\nThe U.S. cyber director advises the president on cybersecurity and coordinates U.S. cyber policy across federal agencies. Federal law states that a person may not serve as an acting officer if the president has submitted that person's nomination to the Senate for full appointment and if that person served as first assistant to the office for less than 90 days.\n\nDavies would replace Sean Cairncross , who was confirmed to the role in August 2025 and whose departure was first reported by Axios last week.\n\nTrump, at a White House press conference on Friday, said he decided to replace Cairncross \"because I didn't think that person was good enough.\"", "source": "CNBC World Economy", "pub_date_str": "24 Nov 2026, 04:32 AM IST", "pub_date_relative": "2h ago"}, {"title": "CNBC's The China Connection newsletter: AI race spreads from robots to smartphones", "full_content": "Hi, this is Evelyn, writing to you from Beijing. Welcome to the latest edition of The China Connection \u2014 a snapshot of what I'm seeing and hearing from local businesses.\n\nI'm just back from APEC in Shenzhen, where I saw the leaders of the U.S., China and Russia gather along with other member economies. Beneath the fanfare, what's changed on the tech front in what's often dubbed China's Silicon Valley?\n\nIt only took a few months for a humanoid robot to get better at picking up household items.\n\nEven after a human knocked a box and toys away from their original spots, a LimX robot quickly located them and moved them to pre-set locations. While still far from perfect, the smoothness of the demo contrasted with the robot's more stilted movements I'd seen early this summer \u2014 and inability then to react to rapid changes in tasks.\n\nWhen we caught up in Shenzhen last week, CFO Jesse Liu declined to comment on LimX's IPO plans . But he told me that his conversations around the APEC CEO Summit revealed an excitement around a new development for humanoids: growing demand for robot chips that can run smarter large language models locally, instead of on the cloud.\n\n\"A lot of chipmakers are now happy about the latest developments in LLMs because they think robotic OEMs will actually begin to integrate more storage, and reasoning, and compute, and inference infrastructure on the edge, or locally inside the robot body,\" Liu said, referring to original equipment manufacturers.\n\n\"They do see robots moving from hundreds of units to thousands of units, to tens of thousands of units, beginning to enter that kind of automotive quantity,\" he said, pointing to chip suppliers such as Horizon Robotics.\n\nNew AI models, particularly GPT-6 Astra, have shown not just improved reasoning, but better control of robots.", "source": "CNBC Top News", "pub_date_str": "24 Nov 2026, 04:30 AM IST", "pub_date_relative": "2h ago"}, {"title": "Stocks making the biggest moves Monday: Zoom, Hewlett Packard Enterprise, Agilent & more", "full_content": "In extended trading, shares of Hewlett Packard Enterprise slumped despite the company offering an outlook that surpassed the Street's estimates.\n\nAgilent Technologies rose after the bell, catching a tailwind from its stronger-than-anticipated forecast for the current quarter.\n\nFollow below as CNBC highlights the biggest stock moves of the day.\n\nThe manufacturer of the Ninja Creami ice cream maker will join the S&P 500 index on Dec. 2.\n\nSharkNinja will be replacing Virginia-based utility AES Corp, which is being taken private by a consortium of investors that includes BlackRock's Global Infrastructure Partners in a $33.4 billion deal.\n\nSharkNinja on Monday In turn, Paycom Software will move up to the S&P MidCap 400, taking SharkNinja's place in that index.\n\nShares of Zoom Communications were up nearly 6% during the day, but were near the flat line in extended trading after the company reported its third quarter earnings of fiscal year 2027.\n\nZoom -YTD Adjusted earnings were $1.59 per share, above analysts' $1.49 estimate, according to LSEG. Revenue was $1.29 billion, surpassing the consensus estimate of $1.28 billion.", "source": "CNBC Top News", "pub_date_str": "24 Nov 2026, 04:16 AM IST", "pub_date_relative": "2h ago"}, {"title": "Nvidia surge: What investors should do with the stock and the AI trade now", "full_content": "Nvidia shares gapped higher at the open by more than 30%, on pace for its biggest one-day gain in 23 years on Monday, following the news just before the bell that former Nvidia CEO Jensen Huang is going to be reinstated.\n\nInvestors and traders said that while this reflex rally may have more to run, cautiousness is warranted on Nvidia and the AI trade because of the overhang of investigations into the alleged Chinese espionage involving the company and others, as well as the possibility for data center moratoriums as Democrats take control of Congress and key governor posts in January.\n\n\"Am I as bullish on Nvidia now as I was on Friday? Of course not, you can't be,\" said Dan Niles, founder of Niles Investment Management, which counted Nvidia as its largest position as he bought on the dip over the last few weeks. \"I'm trimming back.\"\n\n\"All the same issues that were here before Jensen resigned are still here,\" he added.\n\nThe day before Huang resigned on Nov. 12 as CEO, Nvidia closed at $173.73. It's intraday high on Monday was $171.50, up from its recent low around $125 as it was selling off in the wake controversies. The VanEck Semiconductor ETF closed at $506.96 the day before his resignation. It reached a high of $469.35 before losing steam as trading wore on Monday.\n\nNvidia since Nov. 11 Mike Khouw, YieldMax strategist at Tidal Financial Group, told CNBC on Monday that there were \"sighs of relief,\" \"applause\" and even \"cheering\" among investors at the news of Huang's potential reinstatement. But he also said there are still considerable risks facing the AI trade.\n\nJensen Huang was not the only problem at Nvidia, he said, and there are still many vulnerabilities in the overall AI trade, which should give investors pause.", "source": "CNBC Top News", "pub_date_str": "24 Nov 2026, 04:13 AM IST", "pub_date_relative": "2h ago"}, {"title": "Jensen Huang went to war with Washington \u2014 and won a path to China - The Washington Post", "full_content": "Jensen Huang went to war with Washington \u2014 and won a path to China The Washington Post Opinion | The Enraging Hypocrisy at the Heart of the Nvidia Scandal The New York Times We shopped 147 early Black Friday sales to find the 98 best deals worth shopping now CNN A fight over chips is roiling Donald Trump\u2019s cabinet The Economist Asian American women feel the impact of Nvidia CEO affair scandal and \u2018spy\u2019 accusations AP News", "source": "Google News Business", "pub_date_str": "24 Nov 2026, 04:13 AM IST", "pub_date_relative": "2h ago"}, {"title": "Trump made up to $15mn on Nvidia shares after Huang\u2019s return", "full_content": "Profit on 30% jump in chip group\u2019s share price based on maximum amount US president could have owned in latest disclosure", "source": "FT Markets", "pub_date_str": "24 Nov 2026, 03:51 AM IST", "pub_date_relative": "2h ago"}, {"title": "US to blacklist Asian AI firm Megaspeed after Nvidia scandal - BBC", "full_content": "US to blacklist Asian AI firm Megaspeed after Nvidia scandal BBC U.S. Tracked Alice Huang\u2019s Contacts With China Spy Agency During Nvidia Affair The New York Times U.S. probes Megaspeed, Alice Huang as new figure emerges in Nvidia chip case CNBC US Probing Alleged Spy Tied to Ex-Nvidia CEO, Spy Chief Says Bloomberg.com Exclusive / Commerce adds Megaspeed to trade blacklist Semafor", "source": "Google News Business", "pub_date_str": "24 Nov 2026, 03:45 AM IST", "pub_date_relative": "2h ago"}, {"title": "What Jensen Huang\u2019s return means for Nvidia\u2019s Colette Kress - CNBC", "full_content": "What Jensen Huang\u2019s return means for Nvidia\u2019s Colette Kress CNBC Nvidia\u2019s Interim C.E.O. Tries to Soothe a Rattled Company: \u2018We\u2019ve Got This.\u2019 The New York Times Nvidia interim CEO says 'we\u2019ve got this' as company looks to future without Jensen Huang Fox Business Nvidia is offering engineers more money. That may not be enough to keep them. Business Insider Nvidia\u2019s Strong Fundamentals Give New CEO a Much-Needed Tailwind WSJ", "source": "Google News Business", "pub_date_str": "24 Nov 2026, 03:35 AM IST", "pub_date_relative": "2h ago"}, {"title": "Nvidia\u2019s stock is surging again. What to know before chasing the AI rally.", "full_content": "Jensen Huang\u2019s return to Nvidia was the good news that the AI trade needed, but investors should prepare for more volatility", "source": "MarketWatch Top Stories", "pub_date_str": "24 Nov 2026, 03:34 AM IST", "pub_date_relative": "2h ago"}, {"title": "Nasdaq jumps 7% as Nvidia shares soar", "full_content": "Chip giant gains 31.5% after Huang reinstated while S&P rises 4.7%", "source": "FT Markets", "pub_date_str": "24 Nov 2026, 03:31 AM IST", "pub_date_relative": "3h ago"}, {"title": "CNBC Points Pro: Should I keep or cancel my Amex Platinum Card?", "full_content": "Terms apply to American Express benefits and offers. Visit americanexpress.com to learn more.\n\nWelcome to the Points Pro, where I answer your credit card and travel rewards questions each week. If you have a question you'd like answered, you can submit it here .\n\nShould I keep my American Express Platinum Card\u00ae for Schwab ? The annual fee keeps increasing, and I'm not sure the benefits are worth it. But it's my oldest card, so I'm concerned about my credit score if I cancel.\n\nThe Schwab Amex Platinum is a co-branded version of the traditional American Express Platinum Card\u00ae . The benefits are largely the same, but you need an eligible Schwab account to qualify, and you can't downgrade it to a cheaper Amex card, like the American Express\u00ae Gold Card .\n\nSince the reader can't downgrade or product change to a more affordable card, she has to decide whether she's using enough of her Amex Platinum Card's benefits to make it worth paying for.\n\nYou can't beat the Amex Platinum Card's airport lounge access, which includes Amex Centurion Lounges, Delta Sky Clubs, Escape Lounges and more. (Enrollment required)\n\nYou may be eligible for as high as 175,000 Membership Rewards\u00ae points\n\nSee rates and fees , terms apply. Read our Amex Platinum Card review . The American Express Platinum Card\u00ae Welcome Offer: To view your personalized offer, you must first submit an application. If approved, you will: (1) receive your Welcome Offer details, (2) have the option to accept the Card with that offer, (3) be required to spend $12,000 on eligible purchases within the first 6 months of Card Membership, and (4) earn Membership Rewards\u00ae points. Welcome offers vary and you may not be eligible for an offer. If you're approved and accept your offer, a credit check may be conducted, which could impact your credit score. Terms apply.", "source": "CNBC Top News", "pub_date_str": "24 Nov 2026, 03:28 AM IST", "pub_date_relative": "3h ago"}, {"title": "ESPN, NFL to show Super Bowl 61 in Imax theaters", "full_content": "Super Bowl 61 will be telecast live in hundreds of Imax theaters in February via a partnership with the NFL and Disney's ESPN, which has the broadcast rights to the 2027 game.\n\nIt marks the largest Imax live event in the company's history and the first time that the Super Bowl will be available in the format, according to a news release.\n\nThe four-hour event on Feb. 14 will include ESPN's main Super Bowl game telecast, as well as Jay-Z's halftime performance and pregame and postgame coverage.\n\nTickets will be available for theaters in the United States and select international markets, including Australia, New Zealand and Brazil. Tickets are expected to go on sale in January. Pricing was not disclosed.\n\n\"Watching the Super Bowl with your fellow fans is one of the great shared experiences in sports, and this first-of-its-kind collaboration with the NFL and IMAX takes it to a historic new scale,\" said Ken Potrock, president of major event integration for The Walt Disney Co.\n\nIn addition to ESPN channels, this season's championship game will also be available on streaming platform Disney+ as well as Disney's broadcast network ABC.", "source": "CNBC Top News", "pub_date_str": "24 Nov 2026, 03:25 AM IST", "pub_date_relative": "3h ago"}, {"title": "Exclusive CNBC Transcript: See how Trump 'made the deal' to reinstate Huang as Nvidia CEO", "full_content": "President Donald Trump said Monday that he personally intervened to secure Jensen Huang \u2019s return as Nvidia CEO, telling CNBC that he spoke with the chipmaker\u2019s board before it reversed course and reinstated its co-founder.\n\n\u201cI made the deal,\u201d Trump told CNBC\u2019s Eamon Javers during an interview on \u201cSquawk on the Street.\u201d\n\nTrump described his involvement in the decision, which came less than two weeks after Huang resigned, and addressed questions about national security concerns surrounding the Nvidia executive's return.\n\nRead the full transcript of Trump's interview with CNBC here.", "source": "CNBC World Economy", "pub_date_str": "24 Nov 2026, 03:23 AM IST", "pub_date_relative": "3h ago"}, {"title": "U.S. stocks see best day in more than a year, as return of Jensen Huang revives AI enthusiasm", "full_content": "Jensen Huang\u2019s return as CEO of Nvidia powered a massive bounce in the U.S. stock market on Monday by helping to restore faith in the artificial-intelligence trade.", "source": "MarketWatch Top Stories", "pub_date_str": "24 Nov 2026, 03:21 AM IST", "pub_date_relative": "3h ago"}, {"title": "Nvidia\u2019s 31% Surge Exposes Wall Street\u2019s Growing Stock Trap", "full_content": "Monday\u2019s spectacular stock rebound exposes the latest trap facing investors in a market dominated by a handful of technology giants: Selling them offers protection when markets plunge, but risks missing the recovery.\n\nNvidia Corp. surged 31% after Jensen Huang was reinstated as chief executive, accounting for more than two-fifths of the Russell 1000 Growth Index\u2019s gain and a quarter of the Nasdaq 100\u2019s advance. Just days earlier, the chipmaker had been at the center of a six-week selloff that brought the Nasdaq 100 to the brink of a bear market.\n\nThe swings have made a long-standing problem harder to manage. Fund managers who own less of the giants can cushion the damage in a selloff, only to fall behind when the same stocks rebound.\n\nThe numbers are stark. At the end of October, the 10 largest holdings in the Russell 1000 Growth Index accounted for 60% of its weight, twice their median share over the past three decades, according to data compiled by Bloomberg. Nvidia alone made up 15%. Over a stretch in which the benchmark entered a correction, nearly half its constituent stocks managed to rise. Yet gains across much of the index were no match for losses in the handful of stocks that carried the most weight.\n\nThe dilemma is growing. SpaceX and Anthropic have joined the public market, with OpenAI potentially next. As more of their shares become available to investors, some of the biggest IPOs in history could leave the benchmark even more dependent on the fortunes of the AI boom.\n\n\u201cAn overwhelming concentration in one particular industry or one particular sub-industry is a systematic risk,\u201d said Jacob Pozharny, co-chief investment officer at Bridgeway Capital Management. \u201cIt\u2019s when you have a shock to one stock and it has a magnifying effect across all other companies. Nvidia is an example of that.\u201d\n\nOnly a small fraction of Anthropic\u2019s shares are available to trade at first, and OpenAI could start out much the same way.", "source": "LiveMint Markets", "pub_date_str": "24 Nov 2026, 03:19 AM IST", "pub_date_relative": "3h ago"}, {"title": "Consumer stocks, seen as safe bet amid cracks in AI trade, were among the S&P 500\u2019s biggest losers Monday", "full_content": "Shares of Kroger and Tyson Foods fall, as Nvidia storms higher", "source": "MarketWatch Top Stories", "pub_date_str": "24 Nov 2026, 03:15 AM IST", "pub_date_relative": "3h ago"}, {"title": "US moves to recover over $1B in crypto stolen by North Korean hackers in Binance heist - Fox Business", "full_content": "US moves to recover over $1B in crypto stolen by North Korean hackers in Binance heist Fox Business US files action to recover over $1 billion in cryptocurrency stolen in Binance hack Reuters US Seeks to Recover More Than $1 Billion From Binance Hack Bloomberg.com DOJ Aims To Recover $1.1 Billion From Binance Theft PYMNTS.com The Risk Beyond the Binance Hack Traders Magazine", "source": "Google News Business", "pub_date_str": "24 Nov 2026, 03:10 AM IST", "pub_date_relative": "3h ago"}, {"title": "Delta delays flights ahead of Thanksgiving holiday over system failure - Gothamist", "full_content": "Delta delays flights ahead of Thanksgiving holiday over system failure Gothamist Automation system problem at Delta causes flight delays as Americans travel for Thanksgiving AP News Delta Delays Flights as Thanksgiving Travel Begins, After Automated System Falters The New York Times Equipment outage in Atlanta causes over 1,600 Delta flight delays ABC News - Breaking News, Latest News and Videos Delta Resolves Automation Outage That Led to Over 1,000 Flight Delays WSJ", "source": "Google News Business", "pub_date_str": "24 Nov 2026, 03:08 AM IST", "pub_date_relative": "3h ago"}, {"title": "NYC Citi Bike member rides to be capped at $3.65 after Mamdani inks new deal with Lyft - Gothamist", "full_content": "NYC Citi Bike member rides to be capped at $3.65 after Mamdani inks new deal with Lyft Gothamist NYC Citi Bike caps member e-bike fares at $3.65, freezes prices through 2029 ABC7 New York Monday\u2019s Headlines: Mamdani\u2019s Big Lyft Streetsblog New York City Mamdani says New York will cap ebike fares to \u2018significantly\u2019 cut cost of rides The Guardian Mamdani to Cap E-Bike Rides at $3.65 for Citi Bike Members Starting Next Year The New York Times", "source": "Google News Business", "pub_date_str": "24 Nov 2026, 03:08 AM IST", "pub_date_relative": "3h ago"}, {"title": "These stocks are the biggest gainers after Jensen Huang\u2019s return to Nvidia", "full_content": "Huang\u2019s comeback offers relief to the battered AI trade and drives major boosts across the tech sector.", "source": "MarketWatch Top Stories", "pub_date_str": "24 Nov 2026, 03:06 AM IST", "pub_date_relative": "3h ago"}, {"title": "Amazon may have just found a \u2018cheap\u2019 way to get a lot more out of its chips", "full_content": "Amazon\u2019s deal for Decart\u2019s AI technology, with a reported price of $7.5 billion, may be a relatively inexpensive way to boost the speed and efficiency of its custom chips, says an analyst.", "source": "MarketWatch Top Stories", "pub_date_str": "24 Nov 2026, 03:03 AM IST", "pub_date_relative": "3h ago"}], "cfa": [{"title": "Amazon faces FAA probe after delivery drone strikes Michigan fiber cable, garage", "full_content": "The Federal Aviation Administration said Monday it will investigate a recent Amazon drone crash near Detroit.\n\nOn Friday, one of Amazon's MK30 drones \"landed on a resident's garage\" during a delivery in Huntington Woods, Michigan, a suburb north of Detroit, Amazon spokesperson Jack Stelzner told CNBC in a statement.\n\nThe crash occurred after the drone dropped off a customer's shampoo order around 4:30 p.m. local time, and one of its propellers was damaged in the incident, according to ABC affiliate WXYZ .\n\nA preliminary incident report posted to the FAA's website states the drone \"struck a fiber cable, a residential garage, and became entangled in power lines during takeoff.\" The report says the condition of the drone is unknown.\n\nStelzner said there were no injuries, the drone has been removed and Amazon is in contact with the resident.\n\n\"Safety is our top priority and incidents are extremely rare,\" Stelzner said. \"Anytime a delivery does not go as planned we investigate what happened and use the findings to further improve the service.\"\n\nAn FAA spokesperson confirmed it's investigating the incident. A spokesperson for the National Transportation Safety Board, a federal agency that also investigates aviation accidents, said it's aware of the incident and is continuing to gather information. The agency hasn't yet determined whether it will open a probe, the NTSB spokesperson added.\n\nAmazon has been working to make widespread drone delivery a reality ever since founder Jeff Bezos laid out his vision for the program nearly 13 years ago. The rollout has been slow, as the program encountered regulatory delays and staff cuts , as well as technical challenges and pushback from some communities where it conducted early pilots.", "source": "CNBC Top News", "pub_date_str": "24 Nov 2026, 06:26 AM IST", "pub_date_relative": "6m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "South Korea\u2019s central bank seen raising rates on Thursday, once more next quarter - Reuters poll", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Nov 2026, 06:19 AM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Stock futures inch higher as traders see whether Nvidia can extend rally from Jensen Huang\u2019s return: Live updates", "full_content": "U.S. stock futures were slightly higher Monday evening after Jensen Huang's return as Nvidia CEO sent the chipmaker's shares soaring and sparked a rebound in the artificial intelligence trade.\n\nFutures tied to the Nasdaq-100 futures were marginally higher. Dow Jones Industrial Average futures advanced 91 points, or 0.2%, while S&P 500 futures gained 0.2%.\n\nIn Asia, South Korea's Kospi jumped over 5% on Tuesday, leading gains in the region. Heavyweights Samsung Electronics and SK Hynix saw gains of about 7% and 8% respectively.\n\nJapan's Nikkei 225 also rose 2.82%, while the broad based Topix was up 1.6%. Australia's S&P/ASX 200 was also up 1.3%.\n\nNvidia surged 31% during Monday's regular session, leading a rally in chip stocks. The Nasdaq Composite closed 6.5% higher, the S&P 500 finished up 4.7% and the Dow Industrials rose 3% Monday.\n\nIt was the best session for the Nasdaq and the S&P 500 since April 9, 2025 when President Donald Trump announced a reprieve on tariffs.\n\nThe tech sector of the S&P 500 soared 9%, powered by sharp gains in semiconductors, memory names and neoclouds. Advanced Micro Devices added almost 7%, while Micron Technology surged 19%. Neocloud stock CoreWeave jumped 22%.\n\nThe market action was a sharp reversal from Friday's steep sell-off, which saw the S&P 500 and Dow close in correction as the AI trade suffered and Nvidia tanked.", "source": "CNBC Top News", "pub_date_str": "24 Nov 2026, 06:12 AM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Equity Investments", "Derivatives"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "334% return in 3 years! Smallcap textile stock's \u20b95 to \u20b92 stock split record date nears - Check eligibility, ratio", "full_content": "Sharmila Bhadoria Published 24 Nov 2026, 06:09 AM IST Prefer Livemint on Google Shares of Varvee Global Limited ended a percentage point higher on Monday, November 23, ahead of its upcoming stock split record date. The smallcap textile stock is set to split from face value of \u20b9 5 to \u20b9 2 each.\n\nFor investors who closely track corporate actions like stock-split, here are all the details to know.\n\nThe company\u2019s board of directors has approved stock split or subdivision of shares such that \u201cone equity share having face value of \u20b9 5 each, fully paid-up, be sub-divided/split into \u20b9 2 each.\u201d\n\nThe sub-divided shares post corporate action will \"rank pari-passu in all respects which was approved by the equity shareholders through postal ballot\". It means that the additional stocks will carry the same voting rights as existing equity shares, have equal entitlement to dividends, rank equally in the company's capital structure and will also have the same rights and privileges as existing shares.\n\nThe company\u2019s board of directors fixed Friday, November 27, as the record date to determine the eligibility of shareholders for the corporate action. Which means that investors must own the stock on or before the record date to qualify for stock split.\n\nThe stock closed 1% higher at \u20b9 54.37 per share on BSE with a market capitalisation of \u20b9 280.16 crore on Monday, November 23. Its share price value has declined 11.45% in two weeks, but surged 10.87% in one month. The stock has declined 20% in six months, 23% in 2026 so far, and 28% in one year.\n\nVarvee Global share price touched its 52-week high level of \u20b9 84.08 per share on BSE on December 18, 2025. The stock dipped to its 52-week low level of \u20b9 44 per share on October 23, 2026.\n\nCatch all the Business News , Market News , Breaking News Events, JIO IPO Listing Today LIVE and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.", "source": "LiveMint Markets", "pub_date_str": "24 Nov 2026, 06:09 AM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Japan\u2019s factory activity expands in November, PMI shows", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Nov 2026, 06:06 AM IST", "pub_date_relative": "26m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Four AI stocks with multi-year growth plans to watch for the long term", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nArtificial intelligence (AI) spending is still climbing. Yesterday, Nvidia reported that its Data Center revenue rose 110% year on year to US$ 107.6 billion (bn) in the September-October quarter and guided for total revenue of US$ 130 bn in the next quarter.\n\nThat money is being spent by companies building AI systems , and a large part of it will flow to the firms that help them build, run and use those systems.\n\nIn India, a few listed companies have turned that opportunity into stated, multi-year plans. Some are building capacity, such as an AI data centre. Others have set revenue targets for the end of this decade or are investing more in their own AI products.\n\nThese plans can take years to play out, but the current trajectory remains intact. AI is not in a bubble yet and is here to stay.\n\nWith that in mind, we looked at four Indian AI-related companies with clear multi-year plans. For each, we checked the latest results and what the plan involves.\n\nThe company is one of India's largest IT services and consulting companies, a part of the Tata Group.\n\nIts services include software development, cloud computing, artificial intelligence, cybersecurity, data analytics, enterprise solutions, and digital transformation.", "source": "LiveMint Markets", "pub_date_str": "24 Nov 2026, 06:01 AM IST", "pub_date_relative": "31m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "CrowdStrike CEO defends Zscaler acquisition, calls it a 'winning combination'", "full_content": "CrowdStrike CEO George Kurtz on Monday defended the cybersecurity company's planned acquisition of Zscaler , arguing the deal will strengthen its security capabilities and create significant growth opportunities despite a sharp sell-off in its shares.\n\n\"When you look at the tailwinds from these agentic attacks and you listen to customers, they're looking for a complete solution and a platform that delivers not only all of the capabilities we have, but also has network visibility, protection, and control, and zero trust from a network perspective,\" Kurtz told CNBC's Jim Cramer on \" Mad Money .\" \"This is why we acquired Zscaler today. The technology, the team, and we think it's a winning combination putting it together with the CrowdStrike platform.\"\n\nShares of CrowdStrike fell roughly 9% Monday after the company announced it would acquire Zscaler in an all-stock deal valued at roughly $44 billion, raising investor concerns about dilution. The deal is expected to close in the second half of CrowdStrike's fiscal year 2028. Zscaler shares rose more than 17%.\n\nThe acquisition overshadowed CrowdStrike's better-than-expected quarterly results released Monday morning. The company had been scheduled to report earnings on Dec. 1, but moved up the release date to coincide with the Zscaler announcement.\n\nThe acquisition fills a key gap in CrowdStrike's cybersecurity platform. While its Falcon platform protects devices and cloud systems, Zscaler adds security across the networks connecting them. Kurtz said the deal expands CrowdStrike's addressable market by roughly $185 billion.\n\nCrowdStrike's largest acquisition to date comes amid a wave of consolidation in the cybersecurity industry as companies ramp up defenses against increasingly sophisticated AI-powered attacks. Recent high-profile hacks and technology outages have heightened concerns about vulnerabilities in corporate systems.", "source": "CNBC World Economy", "pub_date_str": "24 Nov 2026, 05:23 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "What Jensen Huang\u2019s return means for Nvidia\u2019s Colette Kress", "full_content": "Nvidia finance chief Colette Kress led the company for 11 days during Jensen Huang's sudden but brief departure. When Nvidia's board officially reinstated Huang as CEO on Monday, the company also announced that Kress would continue in her role as CFO.\n\nThe 59-year-old Kress currently has roughly 4.775 million shares directly and indirectly held, which makes her worth approximately $778 million at Monday's market close.\n\nThe 63-year-old Huang resigned earlier this month following revelations of extramarital relationships, including one involving an alleged Chinese spy.\n\nNvidia stock soared 31% and the Nasdaq surged more than 6% Monday after the company announced that Huang would return as CEO, president and board director, effective immediately. Huang returned to the office Monday to crowds of Nvidia employees cheering his return .\n\nKress, who stepped in as interim CEO during Nvidia's moment of crisis, joined the chipmaker as finance chief in September 2013 following stints at Cisco, Microsoft and Texas Instruments.\n\nAs CFO, Kress oversees the balance sheet of a company aggressively financing many of the infrastructure deals that power the artificial intelligence buildout. Those agreements also raise concerns over circular financing and Nvidia's AI exposure in the event of a slowdown.\n\nIn the first earnings call after Huang's resignation, Kress sought to reassure investors, raising the company's fiscal 2028 revenue-growth forecast to roughly 75% from 70%.\n\nShe told analysts during a Q&A portion that it was \"business as usual\" at the company. She later told CNBC's Jim Cramer that customers have stood by the chipmaker and that demand continues increasing.", "source": "CNBC World Economy", "pub_date_str": "24 Nov 2026, 05:20 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "AI adoption grows in Asia, but measuring the gains remains tricky", "full_content": "Businesses across Asia-Pacific say their investments in artificial intelligence are paying off, with the technology helping boost productivity and revenue. But putting a number on those gains is proving far less straightforward.\n\nSome 58% of businesses using AI said their investments had already surpassed their initial costs, yet just 12% were very confident in their ability to accurately measure their return on investment, according to research conducted by Strand Partners for Amazon Web Services .\n\nThe survey included 9,750 business leaders across 10 Asia-Pacific markets: Australia, Indonesia, Japan, Malaysia, New Zealand, the Philippines, Singapore, South Korea, Thailand and Vietnam.\n\nThe biggest shift over the past year has been the growing number of companies moving AI projects into production, Jaime Vall\u00e9s, AWS vice president for Asia Pacific, Japan and China, told CNBC in an exclusive interview.\n\n\"From year over year, probably the biggest difference is you're seeing a lot of ideas put into production,\" Vall\u00e9s said.\n\nDespite the reported financial benefits, many businesses remain in the early stages of AI adoption.\n\nThe survey found that 64% of businesses using AI across Asia-Pacific and Japan still rely on general-purpose AI tools or ready-made solutions for specific tasks, while only 19% of businesses have a formal and comprehensive AI strategy.\n\nAmong those with such an AI strategy, 35% had reached the most advanced stage of adoption, compared with just 8% of businesses without one, according to the research.", "source": "CNBC World Economy", "pub_date_str": "24 Nov 2026, 05:12 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Trump sealed deal for Nvidia to rehire Jensen Huang as CEO", "full_content": "The stunning decision by Nvidia 's board to bring back Jensen Huang as CEO was sealed by a personal promise from President Donald Trump on Sunday that Huang had not broken national security laws, three people familiar with the board's thinking told CNBC.\n\nSeveral other factors also set the stage for Huang's return and accelerated discussions with him over the weekend, said the people, who spoke on condition of anonymity to discuss internal deliberations close to Nvidia's board.\n\nA sharp stock price drop after his resignation and questions about the leadership of interim CEO Colette Kress also spurred the board's decision, the people said.\n\n\"I convinced them,\" Trump told CNBC's Eamon Javers in a phone interview Monday morning , shortly after Nvidia announced Huang's return.\n\n\"I made the deal,\" the president said. \"It was a lot easier to convince them yesterday than it was a week and a half ago.\n\nTrump said Nvidia's board asked for guarantees that Huang, who resigned less than two weeks ago, was not a threat to national security.\n\n\"And we gave them assurances, at least with everything we know,\" the president said. \"We believe he's fine. He's absolutely fine.\"\n\nSenior Trump administration officials reached out to the board overnight Friday to inform them that Huang had not violated U.S. national security laws, people familiar with the board's actions said.", "source": "CNBC Top News", "pub_date_str": "24 Nov 2026, 05:12 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Nvidia sets options-trading record after CEO comeback. Here are the big trades", "full_content": "One of the most dramatic about-faces in corporate America's history, Jensen Huang's return to the helm of AI chipmaker Nvidia spurred an equally historic record in the options market. More than 11 million options contracts traded on Nvidia stock Monday, the most active single day of trading for the stock's options in history. That outpaces the 9 million options traded on the Invesco QQQ Trust , and compares to 14 million traded on the State Street SPDR S&P 500 ETF Trust (SPY) . Despite Nvidia's monstrous 31% rally and options volume that was more than five times the 30-day average, positioning in the flows was not abnormally bullish. Of the top 10 trades by dollar amount, two big put sales stood out, but there were no likely outright call buys, based on data from Barchart and SpotGamma. If there was speculative call-buying, it was dwarfed by big trades between the 160 and 170 strikes, where four million options traded for almost $2 billion.\n\nNvidia, 1 month Nvidia closed near $165. \"People are mostly just trying to collect a lot of premiums through short vol trades and rolls once they heard about Jensen Huang, take advantage of the vol drop more than anything else,\" Jason DeLorenzo, founder of Volland, an options-analytics software, said by phone. \"It seems like options traders were all repricing, which created record volume, but did not create any obvious one-sidedness.\" Just under 6.7 million calls traded versus 4.3 million puts, according to Cboe LiveVol data. About 2.4 million calls were likely initiated by buyers, compared with 1.6 million purchasing puts, exchange data show. Open interest in calls was highest at the 170-strike, while open interest in puts was highest at the 150-strike, Barchart data show.", "source": "CNBC Top News", "pub_date_str": "24 Nov 2026, 04:54 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Derivatives", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Republicans Break With Trump Over Jensen Huang\u2019s Reinstatement at Nvidia - The New York Times", "full_content": "Republicans Break With Trump Over Jensen Huang\u2019s Reinstatement at Nvidia The New York Times Trump Is Said to Have Pushed to Reinstate Nvidia CEO Jensen Huang The New York Times Dow soars 1,400 points; Nasdaq surges 6% in its best day since April 2025 as Jensen Huang returns to Nvidia CNBC NVIDIA Board Reinstates Jensen Huang as President, CEO and Board Director NVIDIA Newsroom Gold Holds Gain After Nvidia\u2019s Rehiring of Huang Sparks Rally Bloomberg.com", "source": "Google News Business", "pub_date_str": "24 Nov 2026, 04:48 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "The newest addition to the S&P 500 is a maker of viral ice-cream machines", "full_content": "SharkNinja will join the S&P 500, replacing AES.", "source": "MarketWatch Top Stories", "pub_date_str": "24 Nov 2026, 04:48 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Jim Cramer sees more upside for Nvidia stock with Jensen Huang back as CEO", "full_content": "Nvidia's remarkable stock comeback isn't done yet now that Jensen Huang has returned as CEO , CNBC's Jim Cramer said Monday.\n\n\"It's terrific to have this admittedly tarnished national treasure back leading Nvidia,\" the \" Mad Money \" host said. \"It's kind of a miracle given the board's insistence that he would never get the CEO job again. But it's a miracle that saved the Nasdaq which, in turn, saved the market, at least for now.\"\n\nNvidia shares soared 31.5% on the news, fueling a broader rally in AI infrastructure stocks. The S&P 500 jumped 4.7%, while the tech-heavy Nasdaq Composite surged 6.5%, with both indexes posting their best days since April 2025. Monday's rebound erased nearly all of Nvidia's decline following Huang's Nov. 12 resignation amid reports of multiple extramarital affairs, including one involving an alleged Chinese spy. Before the rally Monday, the stock had fallen in all trading sessions since his departure.\n\n\"Jensen's only one man, and Nvidia is only one company,\" he said. \"But the truth is that Jensen is the linchpin that holds the AI solar system together, and Nvidia is the biggest beneficiary.\"\n\nCramer argued that Huang's reinstatement removes a major source of uncertainty for investors, strengthening the case for a higher valuation. The chipmaker delivered blockbuster quarterly results last week, raising its revenue growth outlook to 75%, but the results did little to stem the sell-off as investors remained concerned about its leadership.\n\n\"If it weren't for the Jensen overhang, and the insistence that Jensen could never come back, ... I think the stock would have been up significantly on that quarter,\" Cramer said.\n\nStill, Cramer cautioned that Huang's return doesn't erase the broader headwinds facing Nvidia. Growing political opposition to data center construction following the midterm elections could slow AI infrastructure expansion, while uncertainty surrounding chip sales to China threatens a potential source of demand.", "source": "CNBC World Economy", "pub_date_str": "24 Nov 2026, 04:44 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Nvidia live: Nvidia gains nearly $1tn in value after Jensen Huang reinstated - Financial Times", "full_content": "Nvidia live: Nvidia gains nearly $1tn in value after Jensen Huang reinstated Financial Times Why stocks are having their wildest Monday since 2008 Yahoo Finance Stock futures are flat after rally fueled by Jensen Huang\u2019s return to Nvidia\u2019s helm: Live updates CNBC How Epic Was Today\u2019s Stock Rally? WSJ Nvidia bears face $12.2 billion hit on Huang's surprise return Reuters", "source": "Google News Business", "pub_date_str": "24 Nov 2026, 04:38 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "DNI Jay Clayton tapped as acting national cyber director", "full_content": "Director of National Intelligence Jay Clayton has been tapped to serve as acting national cyber director while the Trump administration's permanent nominee for the role awaits Senate confirmation, a White House official told CNBC on Monday.\n\nTrump had already added artificial intelligence czar to Clayton's portfolio in October. The official asked not to be named because the pick hasn't been announced.\n\nThe White House last week announced that President Donald Trump had picked Kirsten Davies , the Pentagon's chief information officer, to lead the Office of the National Cyber Director.\n\nThe U.S. cyber director advises the president on cybersecurity and coordinates U.S. cyber policy across federal agencies. Federal law states that a person may not serve as an acting officer if the president has submitted that person's nomination to the Senate for full appointment and if that person served as first assistant to the office for less than 90 days.\n\nDavies would replace Sean Cairncross , who was confirmed to the role in August 2025 and whose departure was first reported by Axios last week.\n\nTrump, at a White House press conference on Friday, said he decided to replace Cairncross \"because I didn't think that person was good enough.\"", "source": "CNBC World Economy", "pub_date_str": "24 Nov 2026, 04:32 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "CNBC's The China Connection newsletter: AI race spreads from robots to smartphones", "full_content": "Hi, this is Evelyn, writing to you from Beijing. Welcome to the latest edition of The China Connection \u2014 a snapshot of what I'm seeing and hearing from local businesses.\n\nI'm just back from APEC in Shenzhen, where I saw the leaders of the U.S., China and Russia gather along with other member economies. Beneath the fanfare, what's changed on the tech front in what's often dubbed China's Silicon Valley?\n\nIt only took a few months for a humanoid robot to get better at picking up household items.\n\nEven after a human knocked a box and toys away from their original spots, a LimX robot quickly located them and moved them to pre-set locations. While still far from perfect, the smoothness of the demo contrasted with the robot's more stilted movements I'd seen early this summer \u2014 and inability then to react to rapid changes in tasks.\n\nWhen we caught up in Shenzhen last week, CFO Jesse Liu declined to comment on LimX's IPO plans . But he told me that his conversations around the APEC CEO Summit revealed an excitement around a new development for humanoids: growing demand for robot chips that can run smarter large language models locally, instead of on the cloud.\n\n\"A lot of chipmakers are now happy about the latest developments in LLMs because they think robotic OEMs will actually begin to integrate more storage, and reasoning, and compute, and inference infrastructure on the edge, or locally inside the robot body,\" Liu said, referring to original equipment manufacturers.\n\n\"They do see robots moving from hundreds of units to thousands of units, to tens of thousands of units, beginning to enter that kind of automotive quantity,\" he said, pointing to chip suppliers such as Horizon Robotics.\n\nNew AI models, particularly GPT-6 Astra, have shown not just improved reasoning, but better control of robots.", "source": "CNBC Top News", "pub_date_str": "24 Nov 2026, 04:30 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers", "Alternative Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Stocks making the biggest moves Monday: Zoom, Hewlett Packard Enterprise, Agilent & more", "full_content": "In extended trading, shares of Hewlett Packard Enterprise slumped despite the company offering an outlook that surpassed the Street's estimates.\n\nAgilent Technologies rose after the bell, catching a tailwind from its stronger-than-anticipated forecast for the current quarter.\n\nFollow below as CNBC highlights the biggest stock moves of the day.\n\nThe manufacturer of the Ninja Creami ice cream maker will join the S&P 500 index on Dec. 2.\n\nSharkNinja will be replacing Virginia-based utility AES Corp, which is being taken private by a consortium of investors that includes BlackRock's Global Infrastructure Partners in a $33.4 billion deal.\n\nSharkNinja on Monday In turn, Paycom Software will move up to the S&P MidCap 400, taking SharkNinja's place in that index.\n\nShares of Zoom Communications were up nearly 6% during the day, but were near the flat line in extended trading after the company reported its third quarter earnings of fiscal year 2027.\n\nZoom -YTD Adjusted earnings were $1.59 per share, above analysts' $1.49 estimate, according to LSEG. Revenue was $1.29 billion, surpassing the consensus estimate of $1.28 billion.", "source": "CNBC Top News", "pub_date_str": "24 Nov 2026, 04:16 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Nvidia surge: What investors should do with the stock and the AI trade now", "full_content": "Nvidia shares gapped higher at the open by more than 30%, on pace for its biggest one-day gain in 23 years on Monday, following the news just before the bell that former Nvidia CEO Jensen Huang is going to be reinstated.\n\nInvestors and traders said that while this reflex rally may have more to run, cautiousness is warranted on Nvidia and the AI trade because of the overhang
