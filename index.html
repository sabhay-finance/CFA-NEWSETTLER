to 7, took the decision after reviewing aspects such as inflation and economic growth.", "source": "NDTV Profit", "pub_date_str": "07 Oct 2026, 12:15 PM IST", "pub_date_relative": "36m ago"}, {"title": "5GB Data, 60 Minute Calls And More: Airtel Offers Free International Roaming On Postpaid Plans; Check Details", "full_content": "Existing Airtel customers (both on old postpaid plans or on prepaid) can also upgrade to these plans.", "source": "NDTV Profit", "pub_date_str": "07 Oct 2026, 12:13 PM IST", "pub_date_relative": "37m ago"}, {"title": "Penny stock under \u20b910 hits 5% upper circuit after this fundraising update | Do you own?", "full_content": "Penny stock Elitecon International was locked in a 5% upper circuit on Wednesday, 7 October, after the company announced that its board will meet on 12 October to consider a proposal for raising funds.\n\nAccording to the company\u2019s exchange filing, the board will consider and, if deemed appropriate, approve a fundraise through the issuance of equity shares and/or other eligible securities.\n\nThe proposed fundraising could include instruments such as preference shares, convertible or non-convertible debentures, warrants and other securities convertible into or exchangeable for equity shares.\n\nThe company said the fundraise may be undertaken through one or more permitted routes, including a qualified institutions placement (QIP), preferential issue, private placement, rights issue, further public offer or debt issue, subject to applicable laws and regulatory approvals.\n\nThe board will also consider other matters related to the proposed fundraising, including the issue size, pricing mechanism, type of securities, timing and mode of issuance, as well as the appointment of intermediaries and advisers.\n\nAny proposal, including the final size and structure of the fundraise, will be subject to the board's approval and, where required, shareholder and other regulatory approvals.\n\nElitecon International Ltd, a diversified FMCG company, reported a more than three-fold jump in consolidated net profit to \u20b9 185.06 crore in FY26, compared with \u20b9 69.65 crore in FY25, driven by strong revenue growth and the consolidation of its subsidiaries.\n\nRevenue from operations surged nearly ninefold to \u20b9 5,074.80 crore in FY26 from \u20b9 548.76 crore in the previous financial year, according to the company's regulatory filing.", "source": "LiveMint Markets", "pub_date_str": "07 Oct 2026, 12:13 PM IST", "pub_date_relative": "37m ago"}, {"title": "Nifty earnings seen rising 27%, strongest growth in 17 quarters in Q2: Motilal Oswal", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a Earnings \u203a Nifty earnings seen rising 27%, strongest growth in 17 quarters in Q2: Motilal Oswal The Economic Times daily newspaper is available online now. Read Today's Paper Nifty earnings seen rising 27%, strongest growth in 17 quarters in Q2: Motilal Oswal SECTIONS Nifty earnings seen rising 27%, strongest growth in 17 quarters in Q2: Motilal Oswal By Veer Sharma , ETMarkets.com Last Updated: Oct 07, 2026, 12:13:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India\u2019s Q2FY27 earnings season is expected to mark a strong recovery in corporate profitability, with Nifty 50 earnings projected to grow 27% YoY, the highest in 17 quarters, according to Motilal Oswal. While resilient domestic fundamentals and liquidity support the outlook, persistent FII outflows, weak foreign investor sentiment and global macroeconomic pressures remain key challenges for Indian equities.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "07 Oct 2026, 12:13 PM IST", "pub_date_relative": "38m ago"}, {"title": "'We Will Do It': PM Modi Vows For Viksit Bharat On Completion Of 25 Years In Public Life; 10 Key Points", "full_content": "PM Modi said well-wishers encouraged him, critics taught him to look within, and those who opposed him taught him the power of democracy.", "source": "NDTV Profit", "pub_date_str": "07 Oct 2026, 12:11 PM IST", "pub_date_relative": "40m ago"}, {"title": "10 BSE 500 stocks tumble up to 45% in just one month", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News 10 BSE 500 stocks tumble up to 45% in just one month Written by Ritesh Presswala , ETMarkets.com | Oct 07, 2026, 12:22:45 PM IST 1 / 12 Stocks Under Pressure Indian equities have been trading amid heightened volatility, with the market showing weakness over the past month. The benchmark Sensex has declined around 4.5%, while the broader BSE 500 index has also fallen by a similar magnitude during the period. However, the decline has been far steeper for several individual stocks. As many as 83 stocks in the BSE 500 index have fallen more than 10% in the past month. Among these laggards, we highlight the top 10 losers, whose shares have plunged between 15% and 45% during the period. (Data Source: ACE Equity)\n\nIn just one month, the stock declined 44%, falling from Rs 1,853 to Rs 1,035.\n\nIn just one month, the stock declined 35%, falling from Rs 101 to Rs 66.\n\nIn just one month, the stock declined 30%, falling from Rs 230 to Rs 161.\n\nIn just one month, the stock declined 22%, falling from Rs 614 to Rs 476.\n\nIn just one month, the stock declined 21%, falling from Rs 1,372 to Rs 1,080.\n\nIn just one month, the stock declined 19%, falling from Rs 1,990 to Rs 1,605.\n\nIn just one month, the stock declined 19%, falling from Rs 363 to Rs 295.", "source": "Economic Times Markets", "pub_date_str": "07 Oct 2026, 12:09 PM IST", "pub_date_relative": "42m ago"}, {"title": "US Market: Treasury bill yields rise as money-fund demand weakens", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a US Market: Treasury bill yields rise as money-fund demand weakens Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US Market: Treasury bill yields rise as money-fund demand weakens SECTIONS US Market: Treasury bill yields rise as money-fund demand weakens By Anupam Nagar , ETMarkets.com Last Updated: Oct 07, 2026, 12:08:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Slower inflows into U.S. money-market funds are weakening demand for Treasury bills, pushing bill yields above short-term rate benchmarks. Heavier Treasury issuance and rate uncertainty could add pressure, though funding markets remain orderly.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "07 Oct 2026, 12:08 PM IST", "pub_date_relative": "42m ago"}, {"title": "RBI raises policy rates 25 bps to tame inflation as India hurdles growth barriers", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Indicators \u203a RBI raises policy rates 25 bps to tame inflation as India hurdles growth barriers The Economic Times daily newspaper is available online now. Read Today's Paper RBI raises policy rates 25 bps to tame inflation as India hurdles growth barriers SECTIONS RBI raises policy rates 25 bps to tame inflation as India hurdles growth barriers By Joel Rebello , ET Bureau Last Updated: Oct 07, 2026, 12:16:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Reserve Bank of India has unanimously decided to increase the benchmark repo rate by 25 basis points. This decision was made amid rising inflation projections and increasing US bond yields. The bank also revised its economic growth forecast for FY27 to 7.1%, indicating strong economic activity. Inflation is expected to reach an average of 5.2% through FY27, affecting consumer prices.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\nBritannia\u2019s next big bet for young India lies beyond biscuits\n\nThe world is witnessing a bond rout. Why should it matter to you?\n\nQ2 earnings season: Will it settle or add to confusion in the stock market?\n\nHow Sebi busted Growpital\u2019s \u2018assured\u2019 returns, LLPs and money trail\n\nA for apple, Y for yak and, for the first time, a price next to it. Will this change the non-agri part of the rural economy?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "07 Oct 2026, 12:08 PM IST", "pub_date_relative": "43m ago"}, {"title": "At the upper circuit and record high! Asset Reconstruction Company shares surge 10% - What is fuelling the stock rise?", "full_content": "Asset Reconstruction Company's share price surged 10% to hit its upper circuit as well as its record high on the BSE in intraday trade on Wednesday, 7 October, in an otherwise weak stock market. Asset Reconstruction Company shares opened at \u20b9 149 against their previous close of \u20b9 145.70 and jumped 10% to their upper price band and all-time high of \u20b9 160.25. Meanwhile, equity benchmark Sensex declined by 0.75% during the session.\n\nWhile the stock has been rising for three consecutive sessions now, Wednesday's rise in the stock can be attributed to a 54% year-on-year (YoY) rise in its consolidated profit for the June quarter of the financial year 2027 (Q1FY27).\n\nIn an exchange filing on 6 October, the company said its Q1FY27 consolidated profit stood at \u20b9 89.15 crore, up 54.2% from \u20b9 57.83 crore in the same quarter last year and 8.4% from \u20b9 82.23 crore in Q4FY26.\n\nConsolidated total revenue from operations jumped 11.5% year-on-year and 19.8% quarter-on-quarter to \u20b9 234.74 crore.\n\nThe company's assets under management (AUM) for FY26 stood at nearly \u20b9 20,150 crore.\n\nAsset Reconstruction Company (Arcil) debuted on the exchanges on 17 September this year. At the current market price of \u20b9 160.25, it is up 15% from its IPO price of \u20b9 139. The stock hit an all-time low of \u20b9 124.10 on 18 September.\n\nAsset Reconstruction Company launched its initial public offering (IPO) on 9 September. The issue concluded on 11 September with an overall subscription of 14 times. The IPO was an offer for sale (OFS) of 52,731,946 shares for \u20b9 732.97 crore.\n\nAsset Reconstruction Company operates across India and is engaged in acquiring stressed assets from banks and financial institutions and implementing resolution strategies through restructuring, enforcement of rights over underlying securities, and settlement aimed at maximising recovery and optimising the value of such stressed assets to generate revenue streams.", "source": "LiveMint Markets", "pub_date_str": "07 Oct 2026, 11:59 AM IST", "pub_date_relative": "51m ago"}, {"title": "RBI sets up panel to deepen financial market engagement", "full_content": "The Reserve Bank of India (RBI) will constitute a financial market consultative committee (FMCC) to deepen engagement with market participants as financial markets and infrastructure evolve rapidly, governor Sanjay Malhotra said on Wednesday.\n\nThe committee will serve as a forum for structured engagement with market participants and stakeholders on policy and operational matters related to money, government securities and foreign exchange markets, as well as their respective derivatives markets and infrastructure.\n\nThe composition and terms of reference for FMCC will be separately notified, the central bank said in a press release.\n\nThe RBI on Wednesday raised its key interest rate for the first time in nearly four years as rising inflation risks and a sharp shift in the global rate environment prompted the central bank to reverse its easing cycle. The Monetary Policy Committee ( MPC ) increased the key repo rate by 25 basis points to 5.50%. Nine of 10 economists surveyed by Mint had expected a rate hike, while only one called for a pause.\n\nThis has come as rising bond yields in advanced economies and an appreciating dollar are keeping global financial market sentiments nervous and fragile.\n\nFurther tightening of global financial conditions, uncertainty about the fair valuation of artificial intelligence stocks, and an elusive resolution of the West Asia conflict pose significant downside risks to the global economic outlook, the governor said during the speech.\n\nOn Wednesday, yield on the 10-year benchmark government bond rose to a high of 7.26%, up from its opening level of 7.21% after the governor announced the shift in policy stance to \u201ccalibrated tightening\u201d from its \u201cneutral\u201d stance earlier.\n\nCurrently, yield on the 10-year paper is trading at around 7.24%, unchanged from its previous close.", "source": "LiveMint Markets", "pub_date_str": "07 Oct 2026, 11:58 AM IST", "pub_date_relative": "52m ago"}, {"title": "EIA raises oil price forecasts as Iran war tightens global markets", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a EIA raises oil price forecasts as Iran war tightens global markets Powered By The Economic Times daily newspaper is available online now. Read Today's Paper EIA raises oil price forecasts as Iran war tightens global markets SECTIONS EIA raises oil price forecasts as Iran war tightens global markets By Anupam Nagar , ETMarkets.com Last Updated: Oct 07, 2026, 11:58:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The EIA raised its oil price forecasts, citing tight global inventories, limited diesel supplies and ongoing Middle East supply risks. Brent crude is expected to average $105 per barrel in Q4 2026 and $84 in 2027. Recovering Gulf exports and record U.S. production may ease supply pressures next year, though geopolitical risks remain.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "07 Oct 2026, 11:58 AM IST", "pub_date_relative": "52m ago"}, {"title": "RBI MPC Live: SBI MD Expects Credit Growth To Remain Strong; Experts Say Real Estate Demand Will Not Derail", "full_content": "RBI MPC Meeting Live: Follow live updates on the repo rate decision, Governor Sanjay Malhotra's speech, key announcements and market reaction.", "source": "NDTV Profit", "pub_date_str": "07 Oct 2026, 11:53 AM IST", "pub_date_relative": "58m ago"}, {"title": "CGST To Go Faceless, On Income Tax Lines; Centre Plans Assessment Overhaul", "full_content": "The CGST administration currently covers around 6.5 million registrations, which could eventually come under the proposed faceless assessment framework.", "source": "NDTV Profit", "pub_date_str": "07 Oct 2026, 11:50 AM IST", "pub_date_relative": "1h ago"}, {"title": "RBI repo rate hike: How will the 25 bps increase affect your home-loan EMI? Experts explain", "full_content": "The Reserve Bank of India (RBI) has raised the repo rate by 25 basis points to 5.50%, marking the first increase since February 2023. For home-loan borrowers, the rate hike could translate into a higher EMI or a longer repayment tenure, depending on the lender and the loan's reset mechanism.\n\nThe impact will be quicker for borrowers with floating-rate home loans linked to external benchmarks such as the repo rate. Existing borrowers should check their loan's benchmark and reset frequency to understand when the rate hike could affect their repayments, said Santosh Agarwal, CEO, Paisabazaar.\n\nThe impact of the 25-basis-point hike will depend on the outstanding loan amount, remaining tenure and the interest rate applicable to the borrower.\n\nFor illustration, at an interest rate of 7.5% over a 25-year tenure, the monthly EMI could rise by about \u20b9 490 on a \u20b9 30 lakh loan, \u20b9 654 on a \u20b9 40 lakh loan and \u20b9 817 on a \u20b9 50 lakh loan once the increase is passed on, said Adhil Shetty, CEO, BankBazaar.\n\nThe actual impact will vary depending on the borrower's loan terms and the lender's reset mechanism.\n\nShetty said the effect on borrowers would be gradual. The latest increase is one-fifth of the 125 basis points of rate cuts delivered earlier, meaning much of the relief from those earlier cuts remains in place.\n\nA rate hike does not necessarily mean that every borrower will immediately see a higher EMI. Lenders may also extend the repayment tenure while keeping the EMI unchanged.\n\n\"Many lenders extend the tenure to keep the EMI unchanged, which feels easier but costs more over time,\" Shetty said.", "source": "LiveMint Money", "pub_date_str": "07 Oct 2026, 11:48 AM IST", "pub_date_relative": "1h ago"}, {"title": "Why AI is both the hope and the hazard for world leaders, according to IMF chief Georgieva", "full_content": "SINGAPORE \u2014 The technology that investors and governments are counting on to lift the global economy is also adding pressure that threatens growth, the head of the International Monetary Fund said, urging policymakers to stop delaying painful choices on debt.\n\nManaging Director Kristalina Georgieva told the audience at a Wednesday event in Singapore that artificial intelligence is \"rapidly becoming a key driver of countries' relative fortunes in the world economy.\"\n\nBut the triple forces of AI advancement, soaring energy costs and record public debt are challenging the already \"underwhelming\" growth this decade.\n\nSpeaking ahead of a series of IMF and World Bank annual meetings that kick off next week, Georgieva framed the global economy as being tugged in two directions at once: a \"negative energy supply shock\" from the war in the Gulf, now in its eighth month, and a \"positive demand shock\" from the AI investment boom. The combined effect, she said, is \"highly uneven across the world.\"\n\nOn the upside, global AI investment as a share of GDP will reach, and likely exceed, the amounts that went into building the railroads, electricity grid, or telecommunications network. AI hardware and related technology products already account for more than a tenth of world goods trade, she said.\n\nThe IMF estimates that AI could add up to half a percentage point to annual world growth if done right. \"Going from 3% to 3.5% over a decade \u2014 that is like adding an economy the size of ASEAN to the world economy,\" Georgieva said.\n\nBut the benefits are likely highly concentrated. The boom largely bypasses economies less involved in the global AI supply chain, \"increasing the risk of widening economic inequality across the globe,\" she said.\n\nThe boom also feeds the inflation worry that has dogged policymakers from the U.S. to Europe and Asia. \"The AI building boom is inflationary,\" she said, as are energy and food shocks, tariffs and defense spending.", "source": "CNBC World Economy", "pub_date_str": "07 Oct 2026, 11:46 AM IST", "pub_date_relative": "1h ago"}, {"title": "Deepa Jewellers share price rallies 13% despite stock market rout | Q1 growth, IPO gains in focus", "full_content": "Deepa Jewellers share price jumped over 13% on Wednesday, bucking the broader market sell-off as Indian equities came under pressure after the Reserve Bank of India (RBI) raised the policy rate by 25 basis points. Rate-sensitive sectors bore the brunt of the decline amid persistent inflationary pressures stemming from the Middle East conflict, prompting central banks globally to reassess their monetary policy stance.\n\nHowever, Deepa Jewellers shares remained firmly in the green and were up around 37% from their IPO price, extending the strong gains seen since its market debut earlier this month.\n\nThe stock\u2019s rally comes shortly after the company reported strong Q1 FY27 financial results, with double-digit growth in revenue, EBITDA and net profit. While higher operating expenses led to a marginal contraction in EBITDA margin, the B2B jewellery processor continued to maintain its strong growth momentum following its stellar stock market debut.\n\nDeepa Jewellers' net profit rose 27.01% year-on-year to \u20b9 26.76 crore in the quarter ended June 2026, compared with \u20b9 21.07 crore in the corresponding quarter a year ago.\n\nRevenue from operations increased 39.04% to \u20b9 431.11 crore from \u20b9 310.06 crore in Q1 FY26.\n\nEBITDA rose 34.02% YoY to \u20b9 38.68 crore, compared with \u20b9 28.86 crore a year earlier. However, EBITDA margin moderated to 8.97% from 9.31%, a contraction of 34 basis points.\n\nThe company operates in the organised B2B designer, processor and supplier segment of India's gems and jewellery industry. The sector is witnessing a shift towards hallmarked jewellery and organised players, which could benefit high-volume B2B suppliers as national and regional jewellery chains expand their retail footprint.\n\nDeepa Jewellers made a strong debut on the exchanges on 8 September. On the BSE, the stock opened at \u20b9 221.05, a 24.88% premium to its IPO price of \u20b9 177, before ending the session at \u20b9 194.30, up 9.77%.", "source": "LiveMint Markets", "pub_date_str": "07 Oct 2026, 11:46 AM IST", "pub_date_relative": "1h ago"}, {"title": "Microsoft stock: AI gains, earnings and the road to new highs", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News Powered By Microsoft stock: AI gains, earnings and the road to new highs Written by Anupam Nagar , ETMarkets.com | Oct 07, 2026, 11:51:50 AM IST 1 / 8 \u200bMicrosoft nears record territory Microsoft shares have staged a powerful rebound, supported by renewed optimism around its AI strategy and improving earnings expectations. The stock is again trading close to its record levels. (Sources: Yahoo Finance, TradingView)\n\nMicrosoft is benefiting from rising demand for AI across Azure, Microsoft 365 Copilot and its broader enterprise software ecosystem. Azure growth and AI adoption are increasingly central to the investment case.\n\nMicrosoft has exceeded profit expectations for six consecutive quarters, according to the GuruFocus report carried by TradingView. This strong earnings record strengthens the case that its AI investments can translate into sustained business growth.\n\nThe biggest concern is the cost of the AI buildout. Microsoft is expected to spend about $116 billion in capital expenditure, while free cash flow has declined, raising questions about how quickly AI investments will generate returns.\n\nMicrosoft's commercial remaining performance obligations jumped 84% to $678 billion. The surge indicates strong customer commitments to Microsoft's cloud and AI ecosystem and could provide a significant revenue pipeline.\n\nA key advantage is Microsoft's deep relationships with large corporate customers. Enterprises may prefer Microsoft's established software, security and governance infrastructure when deploying AI rather than relying directly on newer AI companies.\n\nMelius Research upgraded Microsoft to Buy and raised its price target to $665, arguing that the company could be a relatively safer way for investors to participate in the AI boom.\n\nThe next major test will be Microsoft's earnings report.", "source": "Economic Times Markets", "pub_date_str": "07 Oct 2026, 11:46 AM IST", "pub_date_relative": "1h ago"}, {"title": "'Blessed Once Again': Kiara Advani, Sidharth Malhotra Announce Baby No. 2", "full_content": "Kiara Advani and Sidharth Malhotra are set to become parents again, more than a year after welcoming their daughter, Saraayah, in July 2025.", "source": "NDTV Profit", "pub_date_str": "07 Oct 2026, 11:45 AM IST", "pub_date_relative": "1h ago"}, {"title": "How RBI MPC 25 bps outcome impacted rate-sensitive sectors, Nifty Bank, Financial Services, Nifty Auto? Where to invest?", "full_content": "RBI Monetary Policy : Interest rate-sensitive sectors were mixed on Wednesday, October 7, after the Reserve Bank of India's Monetary Policy Committee (MPC) unanimously decided to raise the repo rate by 25 bps to 5.50% from 5.25%, marking the first rate hike in four years. The MPC also changed its stance to \u2018calibrated tightening\u2019.\n\nThe decision was already priced in by Dalal Street , with benchmark indices trimming losses following the announcement. The Sensex recovered around 450 points, or 0.6%, from the day's low to hit an intraday high of 72,969.57, while the Nifty recovered 123 points, or 0.5%, to an intraday high of 22,701.6.\n\nThe recovery came after the RBI raised its real GDP growth forecast for FY27 by 40 basis points to 7.1%.\n\n\"Strong capacity utilisation, robust credit flows and the government\u2019s thrust on infrastructure are expected to sustain investment activity. While services exports are expected to remain buoyant, bilateral trade agreements should boost merchandise exports,\" the RBI said.\n\nRBI Governor Sanjay Malhotra said that further rate cuts were off the table in the near term.\n\n\"The duration and extent of the rate hike cycle, therefore, would be contingent on the actual growth inflation development and outlook, especially that of underlying inflation, extent of broadening of price pressure, and speed round effects on the supply shock,\" he said.\n\nBanking and financial stocks moved higher after Governor Malhotra said the banking sector remained strong, with scheduled commercial banks maintaining healthy capital adequacy, liquidity, asset quality and profitability. He also said the financial health of non-banking financial companies (NBFCs) remained sound.\n\nAmid rapidly changing financial market conditions, the RBI plans to establish a technical consultative committee for financial markets. Malhotra also said, \"We are now allowing the interoperability amongst these NBFC account aggregators.\"", "source": "LiveMint Markets", "pub_date_str": "07 Oct 2026, 11:45 AM IST", "pub_date_relative": "1h ago"}, {"title": "More RBI rate hikes loading? Decoding what Malhotra's 'caliberated tightening' stance means", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a More RBI rate hikes loading? Decoding what Malhotra's 'caliberated tightening' stance means The Economic Times daily newspaper is available online now. Read Today's Paper More RBI rate hikes loading? Decoding what Malhotra's 'caliberated tightening' stance means SECTIONS More RBI rate hikes loading? Decoding what Malhotra's 'caliberated tightening' stance means By Surabhi Sarda , ET Online Last Updated: Oct 07, 2026, 11:58:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Reserve Bank of India has increased the repo rate to 5.50% after maintaining it for several months. This shift to a calibrated tightening stance indicates a focus on controlling inflation risks. Retail inflation rose recently, prompting the central bank to adjust its policy outlook for the future. While growth remains firm, inflation now takes priority in decision-making.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\nRBI Repo Rate 2026: Why RB ame period, following the completion of certain fixed-term contracts. Net profit for the quarter declined 8.4% YoY to \u20b9 2.84 crore from \u20b9 3.10 crore in the same quarter last year.\n\nAccording to Aditya Thukral, founder and analyst at AT Research and Risk Managers, Reliance Industrial Infrastructure has been in a corrective mode since the formation of multi-year highs in January 2024.\n\nThe correction seems to be still ongoing, and the prices are expected to approach fresh 52-week lows in the months to come.\n\n\"All the rallies will continue to get sold off till the time another leg of correction is completed on the downside. The stock is trading below all the major EMAs and is now approaching a resistance zone, which could be an exit opportunity for longs,\" said Thukral.", "source": "LiveMint Markets", "pub_date_str": "07 Oct 2026, 11:33 AM IST", "pub_date_relative": "1h ago"}, {"title": "Multiple Tata Trusts Move To Protect Hearing Rights, Filing 84 Caveats Before Charity Commissioner", "full_content": "The filings name Noel Tata and Neville Tata among the caveators, highlighting the involvement of key members of the Tata family in the ongoing proceedings.", "source": "NDTV Profit", "pub_date_str": "07 Oct 2026, 11:32 AM IST", "pub_date_relative": "1h ago"}, {"title": "PNB, Kotak Mahindra Bank, other bank stocks rise up to 2% after RBI\u2019s rate hike, Nifty Bank above 55,500", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a PNB, Kotak Mahindra Bank, other bank stocks rise up to 2% after RBI\u2019s rate hike, Nifty Bank above 55,500 Punjab National Bank Share Price Union Bank of India Share Price Bank of Baroda Share Price Indian Bank Share Price Canara Bank Share Price The Economic Times daily newspaper is available online now. Read Today's Paper PNB, Kotak Mahindra Bank, other bank stocks ris  depending on how the economic outlook and conditions develop.\n\n\"The duration and extent of the rate hike cycle, therefore, would be contingent on the actual growth inflation development and outlook, especially that of underlying inflation, extent of broadening of price pressure, and speed round effects on the supply shock,\" he said.\n\nOn Wednesday, RBI Monetary Policy Committee (MPC) unanimously increased the repo rate by 25 basis points to 5.5%, from 5.25%, as widely expected, marking the RBI\u2019s first rate hike in four years, as the central bank responds to persistent price pressures.\n\nThe Indian stock market remained volatile on Wednesday. After opening in negative territory, Indian benchmark indices pared some of their losses on Wednesday, October 7. The Sensex recovered nearly 450 points, or 0.6%, from the day\u2019s low to touch an intraday high of 72,969.57. The Nifty 50 also rebounded 123 points, or 0.5%, from its low to reach 22,701.60.\n\nEarlier in the session, the Sensex had slipped as much as 547 points, or 0.7%, to an intraday low of 72,520.73. The Nifty 50 declined by up to 198 points, or 0.8%, to hit a low of 22,578.25.\n\nHarshal Dasani, Business Head at INVasset PMS, said the Governor\u2019s statement that the next policy action \u201ccan only be a rate hike or a pause\u201d was the most important signal from the policy announcement.\n\nHe pointed to the RBI\u2019s projection of 6% inflation in the December quarter and the expectation that inflation will not return to the 4% target within the forecast horizon.", "source": "LiveMint Markets", "pub_date_str": "07 Oct 2026, 11:26 AM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "ESDS share price hits 5% upper circuit after 7-day losing streak: What fuelled rally?", "full_content": "ESDS Software Solution share price hit the 5% upper circuit on Wednesday, October 7, snapping a seven-session losing streak, amid a sharp increase in trading activity. The stock witnessed a significant surge in volumes compared with its recent averages\n\nESDS Software Solution recorded a volume of 25,17,952 shares, compared with an average volume of 58,340 shares, marking a 43.16-times increase. Against another average volume of 6,05,755 shares, the change stood at 4.16 times. The stock\u2019s LTP was \u20b9 1,359, up 5%, with traded value of \u20b9 34,184.22 lakh.\n\nDespite Wednesday's recovery, the stock had lost 10% over the past week and 24.15% over the previous two weeks. The recent correction followed a much stronger run over the longer term, with the shares still up 25% in the past month and a massive 217% above their issue price of \u20b9 429.\n\nThe stock's latest move also came shortly after the expiry of the company's one-month shareholder lock-in period on Monday. Following the expiry, around 3 million shares, equivalent to 2% of ESDS Software Solution's total outstanding shares, became eligible for trading.\n\nHowever, the end of the lock-in period does not automatically mean these shares will be sold. It simply allows the previously locked-in shares to be traded in the market.\n\nESDS Software Solution received a rating upgrade from India Ratings and Research (Ind-Ra) on September 29, 2026. The agency raised the long-term rating on the company's \u20b9 50 crore bank loan facilities to IND A/Stable from IND BBB+/Positive and upgraded its short-term rating to IND A1 from IND A2+.\n\nThe move came after a similar upgrade from CRISIL Ratings on September 16, 2026.", "source": "LiveMint Markets", "pub_date_str": "07 Oct 2026, 12:45 PM IST", "pub_date_relative": "6m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "RBI hikes rate, but analysts see shift to \u2018calibrated tightening\u2019 as bigger takeaway. How can this impact markets?", "full_content": "Home ETPrime Markets Market D  to Rs 161.\n\nIn just one month, the stock declined 22%, falling from Rs 614 to Rs 476.\n\nIn just one month, the stock declined 21%, falling from Rs 1,372 to Rs 1,080.\n\nIn just one month, the stock declined 19%, falling from Rs 1,990 to Rs 1,605.\n\nIn just one month, the stock declined 19%, falling from Rs 363 to Rs 295.", "source": "Economic Times Markets", "pub_date_str": "07 Oct 2026, 12:09 PM IST", "pub_date_relative": "42m ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "US Market: Treasury bill yields rise as money-fund demand weakens", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a US Market: Treasury bill yields rise as money-fund demand weakens Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US Market: Treasury bill yields rise as money-fund demand weakens SECTIONS US Market: Treasury bill yields rise as money-fund demand weakens By Anupam Nagar , ETMarkets.com Last Updated: Oct 07, 2026, 12:08:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Slower inflows into U.S. money-market funds are weakening demand for Treasury bills, pushing bill yields above short-term rate benchmarks. Heavier Treasury issuance and rate uncertainty could add pressure, though funding markets remain orderly.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "07 Oct 2026, 12:08 PM IST", "pub_date_relative": "42m ago", "cfa_topics": ["Equity Investments", "Fixed Income"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "RBI raises policy rates 25 bps to tame inflation as India hurdles growth barriers", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Indicators \u203a RBI raises policy rates 25 bps to tame inflation as India hurdles growth barriers The Economic Times daily newspaper is available online now. Read Today's Paper RBI raises policy rates 25 bps to tame inflation as India hurdles growth barriers SECTIONS RBI raises policy rates 25 bps to tame inflation as India hurdles growth barriers By Joel Rebello , ET Bureau Last Updated: Oct 07, 2026, 12:16:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Reserve Bank of India has unanimously decided to increase the benchmark repo rate by 25 basis points. This decision was made amid rising inflation projections and increasing US bond yields. The bank also revised its economic growth forecast for FY27 to 7.1%, indicating strong economic activity. Inflation is expected to reach an average of 5.2% through FY27, affecting consumer prices.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\nBritannia\u2019s next big bet for young India lies beyond biscuits\n\nThe world is witnessing a bond rout. Why should it matter to you?\n\nQ2 earnings season: Will it settle or add to confusion in the stock market?\n\nHow Sebi busted Growpital\u2019s \u2018assured\u2019 returns, LLPs and money trail\n\nA for apple, Y for yak and, for the first time, a price next to it. Will this change the non-agri part of the rural economy?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "07 Oct 2026, 12:08 PM IST", "pub_date_relative": "43m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "At the upper circuit and record high! Asset Reconstruction Company shares surge 10% - What is fuelling the stock rise?", "full_content": "Asset Reconstruction Company's share price surged 10% to hit its upper circuit as well as its record high on the BSE in intraday trade on Wednesday, 7 October, in an otherwise weak stock market. Asset Reconstruction Company shares opened at \u20b9 149 against their previous close of \u20b9 145.70 and jumped 10% to their upper price band and all-time high of \u20b9 160.25. Meanwhile, equity benchmark Sensex declined by 0.75% during the session.\n\nWhile the stock has been rising for three consecutive sessions now, Wednesday's rise in the stock can be attributed to a 54% year-on-year (YoY) rise in its consolidated profit for the June quarter of the financial year 2027 (Q1FY27).\n\nIn an exchange filing on 6 October, the company said its Q1FY27 consolidated profit stood at \u20b9 89.15 crore, up 54.2% from \u20b9 57.83 crore in the same quarter last year and 8.4% from \u20b9 82.23 crore in Q4FY26.\n\nConsolidated total revenue from operations jumped 11.5% year-on-year and 19.8% quarter-on-quarter to \u20b9 234.74 crore.\n\nThe company's assets under management (AUM) for FY26 stood at nearly \u20b9 20,150 crore.\n\nAsset Reconstruction Company (Arcil) debuted on the exchanges on 17 September this year. At the current market price of \u20b9 160.25, it is up 15% from its IPO price of \u20b9 139. The stock hit an all-time low of \u20b9 124.10 on 18 September.\n\nAsset Reconstruction Company launched its initial public offering (IPO) on 9 September. The issue concluded on 11 September with an overall subscription of 14 times. The IPO was an offer for sale (OFS) of 52,731,946 shares for \u20b9 732.97 crore.\n\nAsset Reconstruction Company operates across India and is engaged in acquiring stressed assets from banks and financial institutions and implementing resolution strategies through restructuring, enforcement of rights over underlying securities, and settlement aimed at maximising recovery and optimising the value of such stressed assets to generate revenue streams.", "source": "LiveMint Markets", "pub_date_str": "07 Oct 2026, 11:59 AM IST", "pub_date_relative": "51m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "RBI sets up panel to deepen financial market engagement", "full_content": "The Reserve Bank of India (RBI) will constitute a financial market consultative committee (FMCC) to deepen engagement with market participants as financial markets and infrastructure evolve rapidly, governor Sanjay Malhotra said on Wednesday.\n\nThe committee will serve as a forum for structured engagement with market participants and stakeholders on policy and operational matters related to money, government securities and foreign exchange markets, as well as their respective derivatives markets and infrastructure.\n\nThe composition and terms of reference for FMCC will be separately notified, the central bank said in a press release.\n\nThe RBI on Wednesday raised its key interest rate for the first time in nearly four years as rising inflation risks and a sharp shift in the global rate environment prompted the central bank to reverse its easing cycle. The Monetary Policy Committee ( MPC ) increased the key repo rate by 25 basis points to 5.50%. Nine of 10 economists surveyed by Mint had expected a rate hike, while only one called for a pause.\n\nThis has come as rising bond yields in advanced economies and an appreciating dollar are keeping global financial market sentiments nervous and fragile.\n\nFurther tightening of global financial conditions, uncertainty about the fair valuation of artificial intelligence stocks, and an elusive resolution of the West Asia conflict pose significant downside risks to the global economic outlook, the governor said during the speech.\n\nOn Wednesday, yield on the 10-year benchmark government bond rose to a high of 7.26%, up from its opening level of 7.21% after the governor announced the shift in policy stance to \u201ccalibrated tightening\u201d from its \u201cneutral\u201d stance earlier.\n\nCurrently, yield on the 10-year paper is trading at around 7.24%, unchanged from its previous close.", "source": "LiveMint Markets", "pub_date_str": "07 Oct 2026, 11:58 AM IST", "pub_date_relative": "52m ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "EIA raises oil price forecasts as Iran war tightens global markets", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a EIA raises oil price forecasts as Iran war tightens global markets Powered By The Economic Times daily newspaper is available online now. Read Today's Paper EIA raises oil price forecasts as Iran war tightens global markets SECTIONS EIA raises oil price forecasts as Iran war tightens global markets By Anupam Nagar , ETMarkets.com Last Updated: Oct 07, 2026, 11:58:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The EIA raised its oil price forecasts, citing tight global inventories, limited diesel supplies and ongoing Middle East supply risks. Brent crude is expected to average $105 per barrel in Q4 2026 and $84 in 2027. Recovering Gulf exports and record U.S. production may ease supply pressures next year, though geopolitical risks remain.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "07 Oct 2026, 11:58 AM IST", "pub_date_relative": "52m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "RBI MPC Live: SBI MD Expects Credit Growth To Remain Strong; Experts Say Real Estate Demand Will Not Derail", "full_content": "RBI MPC Meeting Live: Follow live updates on the repo rate decision, Governor Sanjay Malhotra's speech, key announcements and market reaction.", "source": "NDTV Profit", "pub_date_str": "07 Oct 2026, 11:53 AM IST", "pub_date_relative": "58m ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "RBI repo rate hike: How will the 25 bps increase affect your home-loan EMI? Experts explain", "full_content": "The Reserve Bank of India (RBI) has raised the repo rate by 25 basis points to 5.50%, marking the first increase since February 2023. For home-loan borrowers, the rate hike could translate into a higher EMI or a longer repayment tenure, depending on the lender and the loan's reset mechanism.\n\nThe impact will be quicker for borrowers with floating-rate home loans linked to external benchmarks such as the repo rate. Existing borrowers should check their loan's benchmark and reset frequency to understand when the rate hike could affect their repayments, said Santosh Agarwal, CEO, Paisabazaar.\n\nThe impact of the 25-basis-point hike will depend on the outstanding loan amount, remaining tenure and the interest rate applicable to the borrower.\n\nFor illustration, at an interest rate of 7.5% over a 25-year tenure, the monthly EMI could rise by about \u20b9 490 on a \u20b9 30 lakh loan, \u20b9 654 on a \u20b9 40 lakh loan and \u20b9 817 on a \u20b9 50 lakh loan once the increase is passed on, said Adhil Shetty, CEO, BankBazaar.\n\nThe actual impact will vary depending on the borrower's loan terms and the lender's reset mechanism.\n\nShetty said the effect on borrowers would be gradual. The latest increase is one-fifth of the 125 basis points of rate cuts delivered earlier, meaning much of the relief from those earlier cuts remains in place.\n\nA rate hike does not necessarily mean that every borrower will immediately see a higher EMI. Lenders may also extend the repayment tenure while keeping the EMI unchanged.\n\n\"Many lenders extend the tenure to keep the EMI unchanged, which feels easier but costs more over time,\" Shetty said.", "source": "LiveMint Money", "pub_date_str": "07 Oct 2026, 11:48 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Why AI is both the hope and the hazard for world leaders, according to IMF chief Georgieva", "full_content": "SINGAPORE \u2014 The technology that investors and governments are counting on to lift the global economy is also adding pressure that threatens growth, the head of the International Monetary Fund said, urging policymakers to stop delaying painful choices on debt.\n\nManaging Director Kristalina Georgieva told the audience at a Wednesday event in Singapore that artificial intelligence is \"rapidly becoming a key driver of countries' relative fortunes in the world economy.\"\n\nBut the triple forces of AI advancement, soaring energy costs and record public debt are challenging the already \"underwhelming\" growth this decade.\n\nSpeaking ahead of a series of IMF and World Bank annual meetings that kick off next week, Georgieva framed the global economy as being tugged in two directions at once: a \"negative energy supply shock\" from the war in the Gulf, now in its eighth month, and a \"positive demand shock\" from the AI investment boom. The combined effect, she said, is \"highly uneven across the world.\"\n\nOn the upside, global AI investment as a share of GDP will reach, and likely exceed, the amounts that went into building the railroads, electricity grid, or telecommunications network. AI hardware and related technology products already account for more than a tenth of world goods trade, she said.\n\nThe IMF estimates that AI could add up to half a percentage point to annual world growth if done right. \"Going from 3% to 3.5% over a decade \u2014 that is like adding an economy the size of ASEAN to the world economy,\" Georgieva said.\n\nBut the benefits are likely highly concentrated. The boom largely bypasses economies less involved in the global AI supply chain, \"increasing the risk of widening economic inequality across the globe,\" she said.\n\nThe boom also feeds the inflation worry that has dogged policymakers from the U.S. to Europe and Asia. \"The AI building boom is inflationary,\" she said, as are energy and food shocks, tariffs and defense spending.", "source": "CNBC World Economy", "pub_date_str": "07 Oct 2026, 11:46 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Deepa Jewellers share price rallies 13% despite stock market rout | Q1 growth, IPO gains in focus", "full_content": "Deepa Jewellers share price jumped over 13% on Wednesday, bucking the broader market sell-off as Indian equities came under pressure after the Reserve Bank of India (RBI) raised the policy rate by 25 basis points. Rate-sensitive sectors bore the brunt of the decline amid persistent inflationary pressures stemming from the Middle East conflict, prompting central banks globally to reassess their monetary policy stance.\n\nHowever, Deepa Jewellers shares remained firmly in the green and were up around 37% from their IPO price, extending the strong gains seen since its market debut earlier this month.\n\nThe stock\u2019s rally comes shortly after the company reported strong Q1 FY27 financial results, with double-digit growth in revenue, EBITDA and net profit. While higher operating expenses led to a marginal contraction in EBITDA margin, the B2B jewellery processor continued to maintain its strong growth momentum following its stellar stock market debut.\n\nDeepa Jewellers' net profit rose 27.01% year-on-year to \u20b9 26.76 crore in the quarter ended June 2026, compared with \u20b9 21.07 crore in the corresponding quarter a year ago.\n\nRevenue from operations increased 39.04% to \u20b9 431.11 crore from \u20b9 310.06 crore in Q1 FY26.\n\nEBITDA rose 34.02% YoY to \u20b9 38.68 crore, compared with \u20b9 28.86 crore a year earlier. However, EBITDA margin moderated to 8.97% from 9.31%, a contraction of 34 basis points.\n\nThe company operates in the organised B2B designer, processor and supplier segment of India's gems and jewellery industry. The sector is witnessing a shift towards hallmarked jewellery and organised players, which could benefit high-volume B2B suppliers as national and regional jewellery chains expand their retail footprint.\n\nDeepa Jewellers made a strong debut on the exchanges on 8 September. On the BSE, the stock opened at \u20b9 221.05, a 24.88% premium to its IPO price of \u20b9 177, before ending the session at \u20b9 194.30, up 9.77%.", "source": "LiveMint Markets", "pub_date_str": "07 Oct 2026, 11:46 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Microsoft stock: AI gains, earnings and the road to new highs", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News Powered By Microsoft stock: AI gains, earnings and the road to new highs Written by Anupam Nagar , ETMarkets.com | Oct 07, 2026, 11:51:50 AM IST 1 / 8 \u200bMicrosoft nears record territory Microsoft shares have staged a powerful rebound, supported by renewed optimism around its AI strategy and improving earnings expectations. The stock is again trading close to its record levels. (Sources: Yahoo Finance, TradingView)\n\nMicrosoft is benefiting from rising demand for AI across Azure, Microsoft 365 Copilot and its broader enterprise software ecosystem. Azure growth and AI adoption are increasingly central to the investment case.\n\nMicrosoft has exceeded profit expectations for six consecutive quarters, according to the GuruFocus report carried by TradingView. This strong earnings record strengthens the case that its AI investments can translate into sustained business growth.\n\nThe biggest concern is the cost of the AI buildout. Microsoft is expected to spend about $116 billion in capital expenditure, while free cash flow has declined, raising questions about how quickly AI investments will generate returns.\n\nMicrosoft's commercial remaining performance obligations jumped 84% to $678 billion. The surge indicates strong customer commitments to Microsoft's cloud and AI ecosystem and could provide a significant revenue pipeline.\n\nA key advantage is Microsoft's deep relationships with large corporate customers. Enterprises may prefer Microsoft's established software, security and governance infrastructure when deploying AI rather than relying directly on newer AI companies.\n\nMelius Research upgraded Microsoft to Buy and raised its price target to $665, arguing that the company could be a relatively safer way for investors to participate in the AI boom.\n\nThe next major test will be Microsoft's earnings report.", "source": "Economic Times Markets", "pub_date_str": "07 Oct 2026, 11:46 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "How RBI MPC 25 bps outcome impacted rate-sensitive sectors, Nifty Bank, Financial Services, Nifty Auto? Where to invest?", "full_content": "RBI Monetary Policy : Interest rate-sensitive sectors were mixed on Wednesday, October 7, after the Reserve Bank of India's Monetary Policy Committee (MPC) unanimously decided to raise the repo rate by 25 bps to 5.50% from 5.25%, marking the first rate hike in four years. The MPC also changed its stance to \u2018calibrated tightening\u2019.\n\nThe decision was already priced in by Dalal Street , with benchmark indices trimming losses following the announcement. The Sensex recovered around 450 points, or 0.6%, from the day's low to hit an intraday high of 72,969.57, while the Nifty recovered 123 points, or 0.5%, to an intraday high of 22,701.6.\n\nThe recovery came after the RBI raised its real GDP growth forecast for FY27 by 40 basis points to 7.1%.\n\n\"Strong capacity utilisation, robust credit flows and the government\u2019s thrust on infrastructure are expected to sustain investment activity. While services exports are expected to remain buoyant, bilateral trade agreements should boost merchandise exports,\" the RBI said.\n\nRBI Governor Sanjay Malhotra said that further rate cuts were off the table in the near term.\n\n\"The duration and extent of the rate hike cycle, therefore, would be contingent on the actual growth inflation development and outlook, especially that of underlying inflation, extent of broadening of price pressure, and speed round effects on the supply shock,\" he said.\n\nBanking and financial stocks moved higher after Governor Malhotra said the banking sector remained strong, with scheduled commercial banks maintaining healthy capital adequacy, liquidity, asset quality and profitability. He also said the financial health of non-banking financial companies (NBFCs) remained sound.\n\nAmid rapidly changing financial market conditions, the RBI plans to establish a technical consultative committee for financial markets. Malhotra also said, \"We are now allowing the interoperability amongst these NBFC account aggregators.\"", "source": "LiveMint Markets", "pub_date_str": "07 Oct 2026, 11:45 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "More RBI rate hikes loading? Decoding what Malhotra's 'caliberated tightening' stance means", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a More RBI rate hikes loading? Decoding what Malhotra's 'caliberated tightening' stance means The Economic Times daily newspaper is available online now. Read Today's Paper More RBI rate hikes loading? Decoding what Malhotra's 'caliberated tightening' stance means SECTIONS More RBI rate hikes loading? Decoding what Malhotra's 'caliberated tightening' stance means By Surabhi Sarda , ET Online Last Updated: Oct 07, 2026, 11:58:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Reserve Bank of India has increased the repo rate to 5.50% after maintaining it for several months. This shift to a calibrated tightening stance indicates a focus on controlling inflation risks. Retail inflation rose recently, prompting the central bank to adjust its policy outlook for the future. While growth remains firm, inflation now takes priority in decision-making.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\nRBI Repo Rate 2026: Why RBI MPC lifted repo rates for the first time in nearly four years in October policy\n\nBritannia\u2019s next big bet for young India lies beyond biscuits\n\nThe world is witnessing a bond rout. Why should it matter to you?\n\nQ2 earnings season: Will it settle or add to confusion in the stock market?\n\nHow Sebi busted Growpital\u2019s \u2018assured\u2019 returns, LLPs and money trail\n\nA for apple, Y for yak and, for the first time, a price next to it. Will this change the non-agri part of the rural economy?", "source": "Economic Times Economy", "pub_date_str": "0  it. Will this change the non-agri part of the rural economy?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers", "source": "Economic Times Economy", "pub_date_str": "07 Oct 2026, 11:35 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "RIIL share price surges 9%, up for the second straight day - Can Reliance Industrial Infrastructure stock rise further?", "full_content": "RIIL share price: Shares of Reliance Industrial Infrastructure (RIIL) surged almost 9% in morning trade on the BSE on Wednesday, 7 October, defying weak stock market sentiment. Reliance Industrial Infra share price opened at \u20b9 682 against its previous close of \u20b9 680.55 and jumped as much as 8.7% to an intraday high of \u20b9 740, looking set to extend gains for the second consecutive session. On the other hand, equity benchmark Sensex declined by 0.75% during the session.\n\nThe stock surged on Wednesday, with trading volume more than 5 times higher.\n\nThe stock is down 13% year-to-date, largely in sync with a 14% decline in the equity benchmark Sensex. It hit a 52-week high of \u20b9 963.65 on 8 October last year and a 52-week low of \u20b9 620.50 on 30 March this year.\n\nOn a monthly scale, the stock is up 6% so far in October after a 10% decline in September.\n\nOn 15 July, RIIL said its total income declined 18.4% year-on-year (YoY) to \u20b9 14.92 crore in Q1FY27 from \u20b9 18.28 crore for the same period, following the completion of certain fixed-term contracts. Net profit for the quarter declined 8.4% YoY to \u20b9 2.84 crore from \u20b9 3.10 crore in the same quarter last year.\n\nAccording to Aditya Thukral, founder and analyst at AT Research and Risk Managers, Reliance Industrial Infrastructure has been in a corrective mode since the formation of multi-year highs in January 2024.\n\nThe correction seems to be still ongoing, and the prices are expected to approach fresh 52-week lows in the months to come.\n\n\"All the rallies will continue to get sold off till the time another leg of correction is completed on the downside. The stock is trading below all the major EMAs and is now approaching a resistance zone, which could be an exit opportunity for longs,\" said Thukral.", "source": "LiveMint Markets", "pub_date_str": "07 Oct 2026, 11:33 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "PNB, Kotak Mahindra Bank, other bank stocks rise up to 2% after RBI\u2019s rate hike, Nifty Bank above 55,500", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a PNB, Kotak Mahindra Bank, other bank stocks rise up to 2% after RBI\u2019s rate hike, Nifty Bank above 55,500 Punjab National Bank Share Price Union Bank of India Share Price Bank of Baroda Share Price Indian Bank Share Price Canara Bank Share Price The Economic Times daily newspaper is available online now. Read Today's Paper PNB, Kotak Mahindra Bank, other bank stocks rise up to 2% after RBI\u2019s rate hike, Nifty Bank above 55,500 SECTIONS PNB, Kotak Mahindra Bank, other bank stocks rise up to 2% after RBI\u2019s rate hike, Nifty Bank above 55,500 By Debaroti Adhikary , ETMarkets.com Last Updated: Oct 07, 2026, 11:32:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Bank stocks including Kotak Mahindra Bank, PNB, Union Bank and Canara Bank gained up to 2% after the RBI rose on Monday after the repo rate by 25 basis points to 5.50%. The Nifty Bank index rose as investors assessed the impact of the rate hike and the RBI\u2019s shift to calibrated tightening.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "07 Oct 2026, 11:32 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "RBI Repo Rate Hike: Will FD Rates Increase? What Depositors Can Expect", "full_content": "The RBI has raised the repo rate by 25 basis points on October 7. While the move may put pressure on banks to offer higher FD rates, existing FDs are unlikely to be affected.", "source": "NDTV Profit", "pub_date_str": "07 Oct 2026, 11:30 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "One Dashboard Is Enough: RBI allows account aggregator interoperability", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a One Dashboard Is Enough: RBI allows account aggregator interoperability The Economic Times daily newspaper is available online now. Read Today's Paper One Dashboard Is Enough: RBI allows account aggregator interoperability SECTIONS One Dashboard Is Enough: RBI allows account aggregator interoperability By Shilpy Sinha , ET Bureau Last Updated: Oct 07, 2026, 11:30:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Move seen easing customer acquisition across the financial system \u2013 pensions, stocks, insurance, loans, or plain-vanilla banking\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\nBritannia\u2019s next big bet for young India lies beyond biscuits\n\nThe world is witnessing a bond rout. Why should it matter to you?\n\nQ2 earnings season: Will it settle or add to confusion in the stock market?\n\nHow Sebi busted Growpital\u2019s \u2018assured\u2019 returns, LLPs and money trail\n\nA for apple, Y for yak and, for the first time, a price next to it. Will this change the non-agri part of the rural economy?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "07 Oct 2026, 11:30 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Fixed Income"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "RBI MPC meeting Oct 2026: No rate cuts in future? What RBI Gov Sanjay Malhotra said; what it means for Sensex, Nifty", "full_content": "RBI MPC meeting October 2026 : After announcing a 25bps rate hike, Reserve Bank of India (RBI) Governor Sanjay Malhotra said the rate cuts in the near-term are unlikely given the prevailing economic conditions.\n\nHe indicated that the central bank\u2019s next policy action could therefore be either a rate hike or a pause, depending on how the economic outlook and conditions develop.\n\n\"The duration and extent of the rate hike cycle, therefore, would be contingent on the actual growth inflation development and outlook, especially that of underlying inflation, extent of broadening of price pressure, and speed round effects on the supply shock,\" he said.\n\nOn Wednesday, RBI Monetary Policy Committee (MPC) unanimously increased the repo rate by 25 basis points to 5.5%, from 5.25%, as widely expected, marking the RBI\u2019s first rate hike in four years, as the central bank responds to persistent price pressures.\n\nThe Indian stock market remained volatile on Wednesday. After opening in negative territory, Indian benchmark indices pared some of their losses on Wednesday, October 7. The Sensex recovered nearly 450 points, or 0.6%, from the day\u2019s low to touch an intraday high of 72,969.57. The Nifty 50 also rebounded 123 points, or 0.5%, from its low to reach 22,701.60.\n\nEarlier in the session, the Sensex had slipped as much as 547 points, or 0.7%, to an intraday low of 72,520.73. The Nifty 50 declined by up to 198 points, or 0.8%, to hit a low of 22,578.25.\n\nHarshal Dasani, Business Head at INVasset PMS, said the Governor\u2019s statement that the next policy action \u201ccan only be a rate hike or a pause\u201d was the most important signal from the policy announcement.\n\nHe pointed to the RBI\u2019s projection of 6% inflation in the December quarter and the expectation that inflation will not return to the 4% target within the forecast horizon.", "source": "LiveMint Markets", "pub_date_str": "07 Oct 2026, 11:26 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "RBI MPC Highlights: GDP Optimism Meets Hawkish Reality, Rates Hiked Under 'Calibrated Tightening'", "full_content": "MPC unanimously hikes repo rate by 25 bps to 5.50% and pivots stance to 'calibrated tightening'; Governor Sanjay Malhotra rules out near-term rate cuts as crude and food price pressures mount.", "source": "NDTV Profit", "pub_date_str": "07 Oct 2026, 11:19 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "RBI MPC speech: FDI, forex reserves, credit growth \u2014 what Governor Sanjay Malhotra said on global financials", "full_content": "The Reserve Bank of India (RBI) raised the repo rate by 25 basis points to 5.5% on Wednesday and changed its monetary policy stance to \u201ccalibrated tightening\u201d, as the central bank assessed rising inflation risks and a challenging global environment. The Monetary Policy Committee kept its options open for either a further rate hike or a pause, depending on how economic conditions evolve.\n\nBeyond the rate decision, RBI Governor Sanjay Malhotra's policy statement offered a detailed assessment of India's financial position. Foreign direct investment has strengthened, bank credit is growing at a faster pace and foreign exchange reserves remain high.\n\nAt the same time, foreign portfolio investors have continued to withdraw money from Indian markets amid global uncertainty, higher bond yields and elevated crude oil prices.\n\nIndia's net FDI inflows rose to $13.8 billion between April and August 2026, compared with $9.6 billion in the same period last year. The RBI said the improvement was driven by higher gross FDI inflows and slower outward FDI. Gross FDI grew 20.6% during the period.\n\nThe RBI also highlighted India's position in greenfield investments. India ranked third globally in announced greenfield FDI projects during April-August 2026, with projects worth $41.3 billion.\n\nPortfolio flows, however, have been weaker. FPIs recorded net outflows of $10.3 billion between April and 5 October 2026. The RBI said measures announced in June had supported capital inflows and that the balance of payments was expected to remain in healthy surplus.\n\nIndia's foreign exchange reserves stood at $734.6 billion as of 2 October 2026, according to the RBI. The reserves provide around 11 months of import cover and cover 94.4% of India's external debt.\n\nThe RBI said it would continue to facilitate an orderly adjustment of the exchange rate in line with macroeconomic fundamentals while curbing excessive volatility.", "source": "LiveMint Money", "pub_date_str": "07 Oct 2026, 11:19 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Fixed Income", "Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Global Market: Hong Kong stocks fall as oil rises, tech and biotech shares drag", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Global Market: Hong Kong stocks fall as oil rises, tech and biotech shares drag Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market: Hong Kong stocks fall as oil rises, tech and biotech shares drag SECTIONS Global Market: Hong Kong stocks fall as oil rises, tech and biotech shares drag By Anupam Nagar , ETMarkets.com Last Updated: Oct 07, 2026, 11:19:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Hong Kong stocks fell as rising oil prices, weak economic data and selling in major technology and biotechnology shares weighed on sentiment. The Hang Seng declined 0.5%, while tech stocks dropped 0.9%. A weak PMI, subdued consumer demand and mixed industrial data added caution, despite optimism from China\u2019s policy support.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "07 Oct 2026, 11:19 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "RBI rate hike: What happens to existing and new fixed deposits? Experts weigh in", "full_content": "The Reserve Bank of India\u2019s (RBI) 25-basis-point repo rate hike to 5.50% is likely to particularly impact those investing in fixed deposits (FDs). However, the impact will not be immediate for those who already hold FDs.\n\nThis is because a repo rate hike does not automatically change the interest rate on an FD investment that has already been booked. The rates continue to remain fixed for the agreed tenure. The impact is more relevant for new deposits and FDs that mature and are renewed after the bank revises its deposit rates.\n\nAdhil Shetty, CEO, BankBazaar, said, \u201cThe RBI's 25 basis point increase, to a
