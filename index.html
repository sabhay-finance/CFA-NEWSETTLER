<script>
    // This variable will be injected during the build process
    const allData = {"general": [{"title": "Income tax return filing: Why Nov 21 is an important date \u2013 valid for these ITR filers | Know details from CBDT", "full_content": "The Central Board of Direct Taxes (CBDT) has extended the income tax return filing deadline for taxpayers subject to audit requirements from October 31 to November 21, 2026, giving them additional time to do the needful.\n\nThe deadline for submitting tax audit reports for Assessment Year (AY) 2026-27 was also extended from September 30 to October 21, 2026.\n\nThe extensions came after chartered accountants and tax practitioners urged the government to provide more time for submitting tax audit reports , which are due a month before the return filing deadline.\n\nThe wave of demand, witnessed on social media, was driven partly by the heavy work overload in September, when tax professionals must also handle GST filings, company-related assignments and other statutory requirements.\n\nAny taxpayer with income from business or professional services , who is also required to submit an audit report shall file their return by November 21 to avoid penalties and tax notices.\n\nThose who have already submitted their audit reports should ensure they meet the extended ITR filing deadline.\n\nFor businesses, a tax audit is required if their total sales, annual turnover or gross receipts exceed \u20b9 1 crore in a relevant financial year. However, this threshold is raised to \u20b9 10 crore where the cash receipts and cash payments levels are less than 5% of total receipts and payments, respectively.\n\nFor professionals, on the other hand, the general threshold for requiring a tax audit is \u20b9 50 lakh in gross receipts.", "source": "LiveMint Money", "pub_date_str": "24 Oct 2026, 05:33 PM IST", "pub_date_relative": "5m ago"}, {"title": "Crisil shareholders alerts! \u20b917 per share dividend, record date announced in Q2 results; stock gained 7% in 2 weeks", "full_content": "Crisil dividend : Shares of Crisil Limited will remain in focus on Monday, after the company announced a 1700% dividend payout on Friday, following market hours. The company also reported a 20.2% year-on-year surge in net profit during the quarter ended in September, 2026.\n\nCrisil share price has surged nearly 7% over the last two weeks, and around 9.17% since the beginning of the year 2026. Here are all the details to know.\n\nThe company\u2019s board of directors, on Friday, considered and approved the payout of a third interim dividend for financial year 2026-27. The board had announced \u20b9 17 per share dividend, which is 1700% of the stock\u2019s face value of Re 1 each. As per Crisil\u2019s BSE filing, the dividend will be paid on or before November 17, 2026.\n\n\u201cThe Board of Directors has also approved the payment of third interim dividend of Rs. 17/- per equity share of face value of Re 1 each, for the financial year ending December 31, 2026, which will be paid on or before November 17, 2026\u201d\n\nThe board has fixed October 29, Thursday, as the record date to determine the eligibility of shareholders for the payout. Which means that investors must own the stock before record date to qualify for the payout.\n\nThe firm reported a net profit of \u20b9 204.64 crore, which is 5.9% higher than its corresponding quarter profits. Its revenue from operations stood at \u20b9 1,095.16 crore during the quarter under review, which is 20.20% higher than the same quarter of previous financial year.\n\nThe stock closed 0.84% lower at \u20b9 4748.10 per share on BSE with a market capitalisation of \u20b9 34,722.86 crore on Friday. Its share price value has 4.57% in one week, 7.14% over the last two weeks, 3.13% in one month, and around 7.93% in three months. Its share price value has declined 4.16% in one year. It has surged nearly 17.83% in one year, 68.61% in five years.\n\nCatch all the Business News , Market News , Breaking News Events and Latest News Updates on Live Mint.", "source": "LiveMint Markets", "pub_date_str": "24 Oct 2026, 05:33 PM IST", "pub_date_relative": "5m ago"}, {"title": "AI fever ignites a boom in thematic ETFs as fund managers hunt for their next big hit", "full_content": "The runaway success of the artificial-intelligence trade has left investors hungry for the next big market theme. Wall Street fund managers are happily obliging with a flurry of new targeted products, helping investors invest in everything from the rise of robotics to the incipient space economy.", "source": "MarketWatch Top Stories", "pub_date_str": "24 Oct 2026, 05:30 PM IST", "pub_date_relative": "8m ago"}, {"title": "My husband wants to sell our $1.5 million home and invest the proceeds. But this is where we raised our kids \u2014 and I can\u2019t bear to leave.", "full_content": "\u201cHe wants to buy something for $600,000 now that we are empty-nesters.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "24 Oct 2026, 05:30 PM IST", "pub_date_relative": "8m ago"}, {"title": "Can you be downgraded from business class despite paying full fare? Here's what Etihad offered customer after complaint", "full_content": "An Etihad Airways passenger has sparked a debate on social media after claiming they were moved from business class to economy despite paying the full fare for their ticket. According to an alleged apology letter shared on X, the airline attributed the downgrade to high demand and reportedly offered a 75% refund for the affected flight sector.\n\nThe incident has raised questions about airline overbooking, the treatment of premium-cabin passengers and the compensation available when travellers do not receive the service they paid for.\n\nThe passenger, X user @internpierre, criticised the airline\u2019s handling of the situation, arguing that customers should not have to bear the inconvenience of a downgrade after purchasing a business-class ticket.\n\n\u201cNice to know you can pay full price for a business class seat on @etihad, and when you show up at the airport they can simply \u201cdowngrade\" you to economy because they sold more seats than they have (not sure how that\u2019s my problem). Done flying these guys,\" the user wrote.\n\nIn the letter shared alongside the post, Etihad\u2019s airport duty supervisor reportedly apologised for being unable to accommodate the passenger in their originally booked cabin.\n\nThe letter stated that high demand had left the airline unable to provide the expected number of seats to all passengers. To ensure the traveller reached their destination on time, the airline said the passenger had been rebooked in economy class on the same flight.\n\nEtihad reportedly informed the passenger that they were eligible for a 75% refund for the affected flight sector. The letter also referred them to the airline\u2019s rules and notices for information on compensation, standards of treatment and complaint resolution.\n\nThe reported refund offer, however, did little to settle the debate. Several social media users questioned whether a partial refund adequately compensated a passenger for losing access to the business-class cabin they had booked.", "source": "LiveMint Money", "pub_date_str": "24 Oct 2026, 05:25 PM IST", "pub_date_relative": "13m ago"}, {"title": "Fire devastates the Eagle's Nest retreat built for Hitler in Germany. A person is detained", "full_content": "The retreat known as the Eagle's Nest, built for Adolf Hitler in the Bavarian Alps, was almost completely destroyed by fire, and authorities said work to extinguish the blaze was still underway Saturday. A suspect was detained.\n\nThe local tourism authority said it wasn't immediately clear whether authorities could salvage parts of the building. Police later said it burned down almost completely.\n\nA fire alarm at the building in Germany's southeastern corner, in the Berchtesgaden district, went off at about 9:15 p.m. on Friday, police said in a statement. Firefighters arriving on scene saw flames as they approached the site, on a cliff 1,834 meters (6,017 feet) above sea level.\n\nGetting fire engines to the site was difficult because of its location, and crews were still working to put out the fire on Saturday morning, police said. The building and its immediate surroundings could only be accessed with respiratory protection equipment.\n\nFirefighters found no one in the building, and authorities believe no one was injured.\n\nPolice said they detained a person who came into investigators' focus shortly after the fire broke out, but it has yet to be determined whether they had anything to do with the fire.\n\nThe building, the Kehlsteinhaus, was completed in 1938 and is reachable by elevator from the end of a road that winds up the mountain, partly through a series of tunnels. The road is closed to public traffic but used by buses for visitors.\n\nIt has been operated as a cafe and restaurant since 1952 and contains an exhibition on its history. It was not open on Friday before the fire broke out.", "source": "CNBC Top News", "pub_date_str": "24 Oct 2026, 05:24 PM IST", "pub_date_relative": "14m ago"}, {"title": "Changed Job Many Times? How To Check If Your PF Balance Was Transferred", "full_content": "Changed jobs multiple times? Learn how to check your EPF balance, verify whether your old PF money was transferred, and track pending transfer claims.", "source": "NDTV Profit", "pub_date_str": "24 Oct 2026, 05:15 PM IST", "pub_date_relative": "23m ago"}, {"title": "In U.S. Gas Talks With Kremlin, Hidden Financing for Alaska Project Emerges - The New York Times", "full_content": "In U.S. Gas Talks With Kremlin, Hidden Financing for Alaska Project Emerges The New York Times US executives quit $25bn gas venture over claims of secret Russian control Financial Times US LNG Project Developer Funded by Russia\u2019s Novatek, FT Says Bloomberg 3 U.S. LNG Infrastructure Stocks Investors Are Watching After Russian Project Scrutiny Yahoo Finance 3 LNG Stocks Investors Are Watching As Alaska Gas Export Risk Reshapes Infrastructure Simply Wall Street", "source": "Google News Business", "pub_date_str": "24 Oct 2026, 05:13 PM IST", "pub_date_relative": "25m ago"}, {"title": "Netanyahu explores crypto to bypass potential sanctions", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Oct 2026, 05:12 PM IST", "pub_date_relative": "26m ago"}, {"title": "Video: Piyush Goyal Says India Will Make Huge Contribution Towards Global GDP Growth", "full_content": "Piyush Goyal has invited German companies to deepen manufacturing, research and innovation partnerships with India, saying trade agreements could cover 75% of global GDP within 12-18 months.", "source": "NDTV Profit", "pub_date_str": "24 Oct 2026, 05:10 PM IST", "pub_date_relative": "28m ago"}, {"title": "Daler Mehndi Row: Uttarakhand CM Pushkar Singh Dhami Apologises To Singer On Minister\u2019s Behalf", "full_content": "Mika Singh said Daler Mehndi wants to end the Uttarakhand controversy after Chief Minister Pushkar Singh Dhami apologised on behalf of state minister Subodh Uniyal.", "source": "NDTV Profit", "pub_date_str": "24 Oct 2026, 05:08 PM IST", "pub_date_relative": "30m ago"}, {"title": "WhatsApp Users Can Now Share Instagram Reels Directly From Chats: Here's How", "full_content": "WhatsApp is testing a dedicated Instagram Reels shortcut for Android users, making it easier to find and share videos from chats.", "source": "NDTV Profit", "pub_date_str": "24 Oct 2026, 05:07 PM IST", "pub_date_relative": "31m ago"}, {"title": "Kerala Weather Warning: These 5 Districts Are Under Red Alert As IMD Warns Of Extreme Rain", "full_content": "Kerala's weather alerts include orange and yellow warnings for Saturday, with the IMD forecasting heavy to extremely heavy rainfall.", "source": "NDTV Profit", "pub_date_str": "24 Oct 2026, 05:02 PM IST", "pub_date_relative": "36m ago"}, {"title": "Tata Motors Has A 20% Revenue Cushion Against CV Downturns. Can It Grow It?", "full_content": "Business Operations Officer Girish said the segment is a clear focus area, laid out at the investor day, and works as a natural hedge against the cyclicality the CV industry generally faces.", "source": "NDTV Profit", "pub_date_str": "24 Oct 2026, 05:00 PM IST", "pub_date_relative": "38m ago"}, {"title": "\u2018Non-answers\u2019 aren\u2019t working. This is what investors really need from the Fed.", "full_content": "What really matters to investors, economists say, is for Fed Chairman Kevin Warsh to prove he can successfully communicate the central bank\u2019s strategy.", "source": "MarketWatch Top Stories", "pub_date_str": "24 Oct 2026, 05:00 PM IST", "pub_date_relative": "38m ago"}, {"title": "EAAA India Alternatives Secures Rs 360 Crore From Anchor Investors Ahead Of IPO", "full_content": "EAAA India Alternatives secured Rs 360 crore from anchor investors, allotting 21,62,161 equity shares at Rs 1,665 apiece. The Rs 1,200-crore IPO opens on Oct. 26 and closes on Oct. 28.", "source": "NDTV Profit", "pub_date_str": "24 Oct 2026, 04:56 PM IST", "pub_date_relative": "41m ago"}, {"title": "Equity mutual funds amid market correction 2026: Should you stay invested or trim your portfolio? What history tells us", "full_content": "Market corrections can leave mutual fund investors wondering whether to stay invested or sell their investments to avoid further losses. However, an analysis by Abakkus Mutual Fund offers insights by examining the returns of the Nifty 50 Total Return Index (TRI) from April 2005 to September 2026.\n\nThe Nifty 50 TRI captures both price movements and dividends. It serves as a benchmark for many active equity mutual fund schemes and passive funds, such as index funds and ETFs, providing a comparable measure for investors to assess performance and decide their next move.\n\nAs of 30 September 2026, the Nifty 50 stood at 22,716, up 1.7% from its March 2026 low of 22,331. However, it remained below its previous peak of 26,329, recorded on 2 January 2026, and required a further 15.9% gain to return to that level.\n\nFor mutual fund investors, this shows how market corrections are affecting their portfolio returns in 2026.\n\nAccording to the study, the benchmark index has experienced 13 corrections of 10% to 20% since its inception, or approximately one every three years. From the bottom of these corrections, the index recovered to its previous peak in around 91 days on average.\n\nThe longest recovery period followed the market crash in March 2025 and lasted until January 2026, when the Nifty 50 reached its previous all-time high.\n\nAbakkus Mutual Fund's analysis reveals how missing a few strong market sessions can affect long-term returns. Investors who stayed invested throughout the period from April 2005 to September 2026 recorded higher returns than those who missed some of the market's best-performing days.\n\nStaying fully invested in the Nifty 50 TRI throughout this period delivered a CAGR of 13.19%. However, missing just the five best-performing days dragged the CAGR down to 10.86%. For investors who missed the best 50 days, returns flatlined to a CAGR of 0.66%.", "source": "LiveMint Money", "pub_date_str": "24 Oct 2026, 04:56 PM IST", "pub_date_relative": "42m ago"}, {"title": "Updated Bajaj Pulsar NS200 Launched At Rs 1.60 Lakh: What's New", "full_content": "Bajaj Auto has launched the updated Pulsar NS200 with a 5 inch TFT display, ride modes, traction control and a bi directional quickshifter. The motorcycle also gets a small increase in engine power.", "source": "NDTV Profit", "pub_date_str": "24 Oct 2026, 04:54 PM IST", "pub_date_relative": "44m ago"}, {"title": "FICCI seeks Dutch investment in mfg, tech; calls for project-level follow-up", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a FICCI seeks Dutch investment in mfg, tech; calls for project-level follow-up The Economic Times daily newspaper is available online now. Read Today's Paper FICCI seeks Dutch investment in mfg, tech; calls for project-level follow-up SECTIONS FICCI seeks Dutch investment in mfg, tech; calls for project-level follow-up PTI Last Updated: Oct 24, 2026, 04:53:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis FICCI has called for enhanced Dutch investments in India\u2019s manufacturing and technology sectors during Piyush Goyal's visit. The discussions may lead to manufacturing partnerships and technology collaborations which would strengthen bilateral trade. Greater emphasis is placed on supply chain integration to meet Dutch quality and sustainability standards. The upcoming India-EU free trade agreement is expected to facilitate deeper commercial ties.\n\nKYB and KYC: Business behind the wealth creator called \u2018Divi\u2019s Lab\u2019 \u2013 Part 2, concluding\n\nKYB and KYC: Business behind the wealth creator called \u201cDivi\u2019s Lab\u201d \u2013 Part 1\n\nOne company, 2 words. Bond yield and CDS: Will they decide the fate of global markets?\n\nBusiness of Odd Things: Inside an industry that farms fish that nobody is meant to eat\n\nWar's second-order effects are becoming visible in critical sectors\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "24 Oct 2026, 04:53 PM IST", "pub_date_relative": "45m ago"}, {"title": "Ramayana 2 Release Date: Ranbir Kapoor And Yash Starrer Pushed To Diwali 2028? What We Know", "full_content": "Ranbir Kapoor and Yash's Ramayana 2, initially scheduled for Diwali 2027, has reportedly been pushed to Diwali 2028 as the makers need more time to complete filming action sequences.", "source": "NDTV Profit", "pub_date_str": "24 Oct 2026, 04:52 PM IST", "pub_date_relative": "46m ago"}, {"title": "FDA Crackdown On 'Unsafe Food': Patanjali Foods Gets Recall Order Of Sale Of Cow Ghee's Batch In MP", "full_content": "The order was issued by Food and Drug Administration of Madhya Pradesh.", "source": "NDTV Profit", "pub_date_str": "24 Oct 2026, 04:50 PM IST", "pub_date_relative": "48m ago"}, {"title": "Your Parents Depend On Your Salary: How Much Life Insurance Does Your Family Need?", "full_content": "You should ideally design your financial strategy in a way that makes you less dependent on the insurance as time passes by.", "source": "NDTV Profit", "pub_date_str": "24 Oct 2026, 04:47 PM IST", "pub_date_relative": "51m ago"}, {"title": "Rs 1 Lakh Monthly Income After Retirement: What Corpus Would You Need?", "full_content": "When deciding your long-term retirement corpus requirement, you must account for any financial obligations, as well as inflation and taxes, to avoid any financial stress later.", "source": "NDTV Profit", "pub_date_str": "24 Oct 2026, 04:46 PM IST", "pub_date_relative": "52m ago"}, {"title": "Rs 50 Lakh Today Or Rs 1 Crore In 10 Years: Which Is Worth More In Real Terms?", "full_content": "When planning for investments, savings or retirement, one has to be sure that they account for not only taxes but also inflation.", "source": "NDTV Profit", "pub_date_str": "24 Oct 2026, 04:43 PM IST", "pub_date_relative": "55m ago"}, {"title": "How InvestingPro\u2019s Fair Value spotted BWFG\u2019s 109% gain in advance", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Oct 2026, 04:39 PM IST", "pub_date_relative": "59m ago"}, {"title": "Airtel Adds YouTube Premium To Rs 200 Pack: 5 Things Prepaid Users Should Know", "full_content": "Airtel's Rs 200 add-on pack includes YouTube Premium, 30GB data for 28 days and access to over 20 OTT platforms for prepaid users.", "source": "NDTV Profit", "pub_date_str": "24 Oct 2026, 04:38 PM IST", "pub_date_relative": "1h ago"}, {"title": "Godrej Properties Q2 profit plunges 62% to \u20b9154 crore, real estate stock down 6.5% in 1 week - What next for investors", "full_content": "Godrej Properties Q2 profit: Godrej Properties share price closed 4.23% lower on Friday, after the realty firm reported 62% annual decline in its consolidated net profit to \u20b9 154.15 crore for the quarter ended September. The decline in Q2 profit was driven by higher expenses.\n\nRising costs and earnings expansion in the short term is a key concern for the company, and investors will closely monitor how the firm will manage to turn its strengths in operations into profitability as projects come closer to completion, according to Siddharth Maurya, Founder & Managing Director, Vibhavangal Anukulakara Pvt. Ltd.\n\n\u201cA fall in Godrej Properties\u2019 Q2 net profit by 62% is clearly a red flag regarding the issue of rising costs and earnings expansion in the short term, but it doesn\u2019t really undermine the company\u2019s prospects in the long run. Healthy bookings, collection from customers, and the pipeline of new launches are indicative of the positive housing market trend,\u201d explained Maurya.\n\nApart from increasing costs and earnings expansion, investors will closely track company\u2019s strategy to turn its strengths in operations into profitability. \u201cConstruction cost escalation and execution timeline will still be crucial concerns. In the coming months, share price dynamics will be contingent upon margins, cash flows, and new launches,\u201d he added.\n\nThe Mumbai-headquartered realty firm announced a 62% decline in its consolidated net profit to \u20b9 154.15 crore for the quarter ended September.", "source": "LiveMint Markets", "pub_date_str": "24 Oct 2026, 04:37 PM IST", "pub_date_relative": "1h ago"}, {"title": "Pune School Horror: Class 9 Boy Stabs Girl Classmate After Instagram Video Dispute", "full_content": "Police suspect the dispute began over videos of female students dancing during a school trip to Panchgani and Mahabaleshwar on October 17 and 18.", "source": "NDTV Profit", "pub_date_str": "24 Oct 2026, 04:34 PM IST", "pub_date_relative": "1h ago"}, {"title": "ProPetro\u2019s 49% decline: how Fair Value spotted the warning signs", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Oct 2026, 04:31 PM IST", "pub_date_relative": "1h ago"}, {"title": "Jennifer J. Kent, Kohl\u2019s chief legal officer, sells $550,560 in shares", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Oct 2026, 04:31 PM IST", "pub_date_relative": "1h ago"}, {"title": "Nvidia's role as AI financier faces first big test as neoclouds take market hit", "full_content": "Nvidia's emergence as financier for the global AI buildout is facing its first major stress test as credit markets tighten for key partners.\n\nAfter creating the chips that powered the early stages of the generative artificial intelligence era, Nvidia turned to using its financial prowess to fund AI model developers, data center companies and a host of so-called neoclouds. CEO Jensen Huang's strategy has been to not only build the most advanced technology but to provide customers with investment as well as help them take out loans so his systems can reach many more hands.\n\nThat's meant taking full advantage of Nvidia's investment grade credit rating and providing backstop guarantees on mega-projects for OpenAI so that buildouts can get funded at lower interest rates.\n\nAs of its last quarterly financial filing in July, Nvidia had $36 billion in off-balance-sheet AI cloud agreements, or backstops, for neoclouds, in addition to its guarantee on up to $105 billion for chips, land and power at a proposed 10 gigawatt OpenAI data center in Ohio. The company signed as a tenant for $20 billion in future data center leases, which will later be assigned to third parties.\n\nFor the vast majority of these deals, Nvidia won't have to pay up unless participants in the project default.\n\n\"If the demand for compute doesn't meet these really super lofty expectations, we're going to have a problem,\" said David Trainer, founder and CEO of financial research firm New Constructs, in an interview.\n\nMarket conditions may soon test Nvidia's mettle. Shares of neoclouds CoreWeave , Nebius and IREN , all cash-burning companies in Nvidia's portfolio, are down at least 30% this month. CoreWeave, the biggest of the group, has seen the spread on its credit default swaps soar past 11%, as investors are forced to pay up for insurance against default.\n\nNvidia has backed other neoclouds that have run into challenges.", "source": "CNBC World Economy", "pub_date_str": "24 Oct 2026, 04:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "Arsenal vs Everton Live Streaming: Likely Lineups; How To Watch Premier League Match On TV, Online?", "full_content": "Arsenal take on Everton in the Premier League as Mikel Arteta's side look to strengthen their title challenge. Here's when and where to watch the match live in India.", "source": "NDTV Profit", "pub_date_str": "24 Oct 2026, 04:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "Odisha FC vs NorthEastUnited FC Live Streaming, Telecast: When, Where To Watch ISL Match On TV, Online", "full_content": "NorthEast United FC will look to extend their winning start to the Indian Super League season, while Odisha FC aim to register their first victory. Here's everything you need to know about the live telecast and streaming details.", "source": "NDTV Profit", "pub_date_str": "24 Oct 2026, 04:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "Do machines have feelings? AI has philosophers and tech leaders rethinking consciousness.", "full_content": "As AI models become more advanced, tech leaders and philosophers are mulling the relationship between humanity and technology.", "source": "MarketWatch Top Stories", "pub_date_str": "24 Oct 2026, 04:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "Trump is pushing a massive AI buildout. His own voters are wary of what comes with it", "full_content": "President Donald Trump has cast America's artificial intelligence race with China as a national-security imperative, pushing faster development of the technology and an immense buildout of the data centers and power infrastructure needed to fuel it.\n\nBut the new CNBC All-America Economic Survey reveals a growing political tension beneath that agenda: Republican voters broadly support the push for AI development, but many oppose building the sprawling infrastructure needed to power it in their own backyards.\n\nNearly 55% of MAGA supporters want companies to keep developing advanced AI while Congress works on regulations, versus 27% who favor a pause. But only 29% would support a data center within 10 miles of their home, while 40% oppose one. Among all Republicans and Republican-leaning voters \u2014 not just those who identify themselves with the MAGA movement \u2014 those who say they would support a data center near their home falls to 24%.\n\nAcross the electorate, 63% don't want a nearby AI data center and just 13% support one. Democrats lead the opposition: 80% oppose nearby facilities while just 4% support them.\n\nThat resistance is increasingly forcing Trump and vulnerable Republicans who once championed data centers to recalibrate as they head into a bleak midterm election environment for the party.\n\n\"Many people are annoyed by these data centers,\" said Brad Carson , a former Democratic congressman from Oklahoma and co-founder of Public First Action PAC, an AI-industry-backed political group pushing for stronger regulation and safeguards. \"People are also strongly insistent upon reasonable guardrails of AI, and that's going to be hard to beat.\"\n\nThe CNBC survey of 1,000 registered voters nationwide was conducted Oct. 14-18 by Hart Research Associates and Public Opinion Strategies and has a margin of error of plus or minus 3.1 percentage points.", "source": "CNBC Top News", "pub_date_str": "24 Oct 2026, 04:29 PM IST", "pub_date_relative": "1h ago"}, {"title": "AU SMALL FINANCE BANK Q2: Profit Grows Over 50%, Asset Quality Improves", "full_content": "AU Small Finance Bank's Q2 net profit rose 52.9% to Rs 858 crore, while NII grew 31.5%. Gross NPA eased to 1.99% year-on-year as deposits and loans recorded strong growth.", "source": "NDTV Profit", "pub_date_str": "24 Oct 2026, 04:27 PM IST", "pub_date_relative": "1h ago"}, {"title": "Motilal Oswal Nifty Midcap150 Plus 8-13 Yr G-Sec 70:30 Index Fund: A Growth And Stability Engine", "full_content": "Motilal Oswal's hybrid index fund combines 70% midcap equities with 30% government securities to balance growth potential and portfolio stability.", "source": "NDTV Profit", "pub_date_str": "24 Oct 2026, 04:23 PM IST", "pub_date_relative": "1h ago"}, {"title": "Parliamentary Committee On Finance To Examine 46 Economic Issues, Including Crypto, AI In FY27", "full_content": "The panel would also look at customs, GST, and direct tax reforms, conduct a study on virtual digital assets and the way forward, analyse emerging issues and prospects of artificial intelligence in the financial sector, and regulatory gaps in the NBFC sector.", "source": "NDTV Profit", "pub_date_str": "24 Oct 2026, 04:23 PM IST", "pub_date_relative": "1h ago"}, {"title": "IT stocks Q2 results analysis: Infosys vs TCS vs Wipro vs HCL vs TechM: Who wins profit, revenue, dividend, AI race?", "full_content": "IT stocks Q2 results analysis : India\u2019s largest IT companies are showing signs of recovery, with most delivering stronger profits and deal bookings while some struggle with sluggish client spending and pressure on revenue growth.\n\nThe September quarter (Q2FY27) results of Tata Consultancy Services (TCS), Infosys , Wipro, HCLTech and Tech Mahindra reveal a widening gap in performance, particularly in constant-currency growth, artificial intelligence (AI) monetisation and future revenue visibility.\n\nWhile Tech Mahindra led profit and revenue growth, HCLTech stood out for raising its growth guidance, Infosys announced the highest interim dividend , and TCS retained its lead in deal bookings and AI revenue scale. Wipro, meanwhile, faced pressure on profitability and new business wins.\n\nNet profit : Tech Mahindra emerged as the strongest performer in year-on-year profit growth, with net profit surging 32.7% to \u20b9 1,586 crore. HCLTech followed with a 21.2% increase to \u20b9 5,132 crore, its highest-ever quarterly net income. TCS reported a 15% rise to \u20b9 13,884 crore, while Infosys posted a more modest 6% increase to \u20b9 7,823 crore. However, Wipro's consolidated net profit declined 1.4% to \u20b9 3,200.6 crore, making it the only company among the four to report a year-on-year profit decline.\n\nRevenue growth : Tech Mahindra also led year-on-year revenue growth, with consolidated revenue increasing 15.6% to \u20b9 16,180 crore. HCLTech recorded an 11.52% rise to \u20b9 35,620 crore, narrowly ahead of Infosys, which reported an 11% increase to \u20b9 49,244 crore. Meanwhile, TCS revenue grew 11.2% to \u20b9 73,188 crore, the highest in absolute terms among the five companies. Wipro's gross revenue rose 9.1% to \u20b9 24,752.7 crore, although its core IT services business continued to experience muted growth.\n\nConstant-currency revenue : Tech Mahindra led the reported constant-currency performance, with growth of 7.2% year-on-year and 2.4% quarter-on-quarter.", "source": "LiveMint Markets", "pub_date_str": "24 Oct 2026, 04:22 PM IST", "pub_date_relative": "1h ago"}, {"title": "Be an intelligent investor: Six key mistakes that separate successful investors from speculators | Dos and Don'ts", "full_content": "When you invest or speculate in financial markets, both may involve risk; but the difference lies in the approach you take. It is also about having a clear and fundamental understanding of what you are doing with your hard-earned money. Sensible investors focus on their long-term financial goals, business fundamentals, and current economic reality.\n\nOn the other hand, speculators act differently, since they focus more on chasing quick returns based on price movements, market rumours or short-term trends. That is why, to ensure meaningful success, it is vital for day-to-day financial market participants to avoid common mistakes, as this approach can also help investors make more disciplined and meaningful financial decisions .\n\nHence, the focus should be on saving money before thinking about generating quick money. Keeping these basics in mind, here are common mistakes investors should avoid to succeed in their wealth-creation journey .\n\nNote: These mistakes are illustrative in nature. Investors should seek professional guidance from a certified financial advisor before investing.\n\nTherefore, successful investing does not mean avoiding every loss or predicting every market movement correctly. No one can achieve perfection in investing. Investing, hence, means making informed decisions, managing risks properly, and remaining consistent with a well-defined financial plan.\n\nEven fundamentally strong investments can underperform due to market conditions, and diversification cannot completely eliminate the risk associated with market investments.\n\nThat is why investors should also review their portfolios and asset allocation (investments in stocks, bonds, fixed deposits, gold, and other asset classes) periodically and ensure they remain aligned with their long-term financial objectives.\n\nThe portfolio should be developed based on the guidance of a certified financial advisor, on changing circumstances and risk-taking appetite.", "source": "LiveMint Money", "pub_date_str": "24 Oct 2026, 04:17 PM IST", "pub_date_relative": "1h ago"}, {"title": "Rules explained: Old vs New Income Tax Act 2025 - Can you set off or carry forward losses from previous years? Details", "full_content": "The new Income-tax Act, 2025, came into effect on April 1, 2026. If you have carried forward losses from previous financial years to reduce your tax liability in the future, you may wonder whether these losses remain valid under the new tax framework.\n\nThe Central Board of Direct Taxes ( CBDT ), in its FAQs on the interplay and transition from the Income-tax Act, 1961, to the Income-tax Act, 2025, has clarified that the fundamental rules for setting off and carrying forward losses remain unchanged. Here is what taxpayers need to know.\n\nYes. Losses carried forward under the Income-tax Act, 1961, can continue to be carried forward and set off under the Income-tax Act, 2025. The new law does not restart the time limit for using these losses. The remaining period under the old law continues to apply.\n\nFor example, if you incurred an eligible business loss in assessment year (AY) 2023-24, you can carry it forward for up to eight assessment years. But the introduction of the new law does not give you an additional eight years from April 1, 2026.\n\nThe basic process remains the same. Losses are first adjusted against income under the same head, wherever permitted. Any remaining loss may then be adjusted against income under another head, subject to the applicable rules.\n\nYes. The CBDT has clarified that brought-forward losses from house property and capital gains remain eligible for set-off under the new law.\n\nFor example, a house property loss from AY 2024-25 can be carried forward and adjusted against eligible house property income in a subsequent tax year.\n\nSimilarly, a long-term capital loss from an earlier year can be set off against long-term capital gains, but not short-term capital gains. Short-term capital losses can be adjusted against short-term or long-term capital gains.", "source": "LiveMint Money", "pub_date_str": "24 Oct 2026, 04:13 PM IST", "pub_date_relative": "1h ago"}, {"title": "You can open only 2 Sukanya Samriddhi accounts \u2014 but what if you have triplet daughters?", "full_content": "The Sukanya Samriddhi Yojana (SSY) allows parents or legal guardians to open accounts for up to two girl children in a family. This government-backed small savings scheme helps parents build a fund for their daughters' education, marriage and other financial needs, while offering tax benefits as well.\n\nA parent or guardian can open a SSY account for a girl child anytime from her birth until she turns 10. The child must be a resident Indian at the time of opening the account and remain so until maturity to be eligible for the scheme.\n\nOnly one SSY account can be opened per girl child and a family can open accounts for a maximum of two girls, like we discussed above. This raises questions for families with triplet daughters born in their first delivery or those who have another daughter after having twins the first time.\n\nAccording to a Ministry of Finance release issued last year, an exception to the two-account limit is allowed in cases involving twin or triplet girl children. In such cases, a third SSY account may be permitted, subject to the scheme\u2019s conditions.\n\nAccording to Ministry of Finance's release issued in January 2025, an exception to the two-account limit is allowed in cases involving twin or triplet girl children. In such cases, a third SSY account can be permitted.\n\nHowever, the eligibility depends on the order in which the children are born:\n\nIn order to open a third SSY account, the parent or legal guardian must submit a medical certificate issued by an authorised medical institution. The document establish the birth of a twin or triplet girl children, as applicable.\n\nParents or guardians can deposit up to \u20b9 1.5 lakh a year in each SSY account . According to an illustration from the SBI Securities SSY calculator, investing maximum permitted amount annually from the time a girl child turns 10 until she turns 21 would result in a maturity value of \u20b9 71.82 lakh, comprising \u20b9 22.5 lakh in contributions and \u20b9 49.32 lakh in interest accrued.", "source": "LiveMint Money", "pub_date_str": "24 Oct 2026, 04:09 PM IST", "pub_date_relative": "1h ago"}, {"title": "Six Flags to Add Seat Belts to Rides Following Death - WSJ", "full_content": "Six Flags to Add Seat Belts to Rides Following Death WSJ Six Flags announces major safety change to Goliath coaster, others WSB-TV Higher, Faster, Gnarlier: Have Roller Coasters Become Too Extreme? The New York Times What the Six Flags Over Georgia death investigation will focus on, according to roller coaster inspection experts CBS News Roller coasters keep getting more extreme. Have they gone too far? Yahoo", "source": "Google News Business", "pub_date_str": "24 Oct 2026, 04:07 PM IST", "pub_date_relative": "1h ago"}, {"title": "As winter nears, heating oil emerges as hurdle for Republicans in US Senate races", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Oct 2026, 03:49 PM IST", "pub_date_relative": "1h ago"}, {"title": "Cables and wires stock turned multibagger with 318% return in 5 years; InCred sees 29% upside - Do you own? Target price", "full_content": "KEI Industries shares ended lower on Friday, October 23, extending their correction over the past six months. Despite the recent weakness, the cables and electricals stock has delivered a nearly 318% return over the past five years. Brokerage InCred Equities has upgraded its outlook on the stock, citing the company's sustained growth guidance, margin expansion driven by a favourable product mix, and rising exports.\n\nThe company has reported 28.94% annual jump in its consolidated net profit for the September quarter of financial year 2026-27.\n\nKEI Industries reported 39% annual growth in revenue, 40% surge in EBITDA, and around 29% jump in profit after tax (PAT). The management has also revised tis financial year 2026-27 guidance to 25% and 11% EBITDA margin.\n\nThe brokerage remained bullish on the cables and electricals stock because of its sustained \u201cgrowth guidance, Sanand plant ramp-up, margin expansion on product mix and rising exports.\u201d However InCred Equities highlighted intensifying competition and upcoming industry capacity additions.\n\n\u201cDespite a healthy medium-term growth outlook, we lower our target multiple to 33x from 36x, factoring in intensifying competition and upcoming industry capacity additions, which could weigh on margins,\u201d read InCred Equities report. However, the brokerage upgraded its rating for the company citing reasonable valuation.\n\nInCred Equities upgraded rating for KEI Industries from \u2018Hold\u2019 to \u2018Add\u2019 and revised target price to \u20b9 5,000 per share.\n\n\u201cWe upgrade our rating to ADD from HOLD because of reasonable valuation, with a revised target price of \u20b9 5,000, rolling forward our valuation to Sep 2028F earnings (previous target price was Rs5,760). The stock currently trades at ~33.6x/28.2x/23.2x FY27F/28F/29F EPS, respectively,\u201d read the brokerage report.\n\nThe stock closed 4.25% lower at \u20b9 3715.10 per share on BSE with a market capitalisation of \u20b9 35,533.29 crore on Friday, October 23.", "source": "LiveMint Markets", "pub_date_str": "24 Oct 2026, 03:43 PM IST", "pub_date_relative": "1h ago"}, {"title": "Power stock to buy: Despite almost 20% fall in 1 month, Deven Choksey Research sees 72% returns ahead - Do you own?", "full_content": "Despite nearly falling 20% in the last 1 month, domestic brokerage house Deven Choksey Research has initiated coverage on Siemens Energy India with a Buy rating and a target price of \u20b9 4,554, implying a potential upside of 72% from the last closing price of \u20b9 2,649.\n\nThe report said, \u201cWe assign multiple of 60x PE on FY28 EPS of 75.90 and arrive at TP of INR 4,554, implying 41% upside on Siemens Energy India Ltd. We have not factored HVDC into our TP, while new HVDC VSC orders and nuclear energy provide additional upside optionality.\u201d\n\nThe brokerage expects the power equipment maker to benefit from India's multi-year transmission investment cycle, rising electricity demand, renewable energy integration and expansion in high-voltage grid infrastructure.\n\nIt highlighted the company's position in high-voltage direct current (HVDC) transmission, grid-stabilisation solutions, power generation equipment and engineering services. Its strong parentage through Siemens Energy Germany and opportunities in exports could further support growth.\n\nDeven Choksey Research said, \u201cWe view Siemens Energy India as a high-potential play on the country\u2019s power transmission and generation opportunity, with a diversified business model spanning grid infrastructure, power generation, services and engineering, research & development (ER&D).\u201d\n\nThe stock ended 4.4% lower at \u20b9 2,649 on Friday, October 23. It has been under pressure in recent times. The power stock has declined around 10% in 1 week, nearly 20% in 1 month, and 3 months. Meanwhile, it has lost 15% in the last 1 year.\n\nIt hit its 52-week high of \u20b9 3,966.80 in May 2026 and its 52-week low of \u20b9 2105.15 in January 2026.\n\nThe brokerage's investment thesis centres on rising transmission expenditure as India expands renewable energy capacity and strengthens its electricity grid.", "source": "LiveMint Markets", "pub_date_str": "24 Oct 2026, 03:41 PM IST", "pub_date_relative": "1h ago"}, {"title": "Alaska LNG developer faces scrutiny over funding from sanctioned Russian firm - FT", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Oct 2026, 03:28 PM IST", "pub_date_relative": "2h ago"}, {"title": "Key income tax rules explained: Gifts above \u20b950,000 in a year: When is the full amount taxable? Marriage exemptions", "full_content": "Did you receive cash, jewellery, or other gifts from friends or relatives? While some gifts are tax-free, others may be taxable depending on their value, who gave them, and the occasion.\n\nThe FAQs on gifts received by an individual or Hindu Undivided Family (HUF) under the Income-Tax Act, 2025, explain when gifts are exempt and when they attract tax.\n\nGifts received from specified relatives are exempt from tax, irrespective of their value. These include:\n\nOther exempt categories include gifts received through a will or inheritance, gifts received in contemplation of the donor's death, and certain receipts from specified authorities and registered non-profit organisations.\n\nIf you receive cash gifts worth more than \u20b9 50,000 in a year, the entire amount is taxable if the gifts are received without consideration and are not from specified relatives. Gifts can be received in cash, by cheque, bank draft or other modes.\n\nFor example, if you receive \u20b9 1 lakh from your father, the gift is tax-free, irrespective of the amount. However, if you receive \u20b9 30,000 from one friend and \u20b9 25,000 from another during the year, the entire \u20b9 55,000 is taxable, as the total exceeds \u20b9 50,000 and no exemption applies.\n\nIf the total value of monetary gifts during a financial year (tax year) exceeds \u20b9 50,000, the entire amount becomes taxable, not just the portion above \u20b9 50,000.\n\nFor example, if you receive \u20b9 30,000 from one friend and \u20b9 25,000 from another during the same year, your total monetary gifts amount to \u20b9 55,000. Since friends are not included in the specified list of relatives and the total amount exceeds \u20b9 50,000, the entire \u20b9 55,000 is taxable, provided no exemption applies.", "source": "LiveMint Money", "pub_date_str": "24 Oct 2026, 03:21 PM IST", "pub_date_relative": "2h ago"}, {"title": "India, Uzbekistan discuss bilateral ties during foreign minister Jaishankar's Azerbaijan visit", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a India, Uzbekistan discuss bilateral ties during foreign minister Jaishankar's Azerbaijan visit The Economic Times daily newspaper is available online now. Read Today's Paper India, Uzbekistan discuss bilateral ties during foreign minister Jaishankar's Azerbaijan visit SECTIONS India, Uzbekistan discuss bilateral ties during foreign minister Jaishankar's Azerbaijan visit PTI Last Updated: Oct 24, 2026, 03:21:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis External Affairs Minister S Jaishankar met Uzbek Foreign Minister Bakhtiyor Saidov in Azerbaijan\u2019s Baku to discuss bilateral issues and stress the timely implementation of agreements reached at the highest level. The meeting follows Prime Minister Narendra Modi\u2019s August visit to Uzbekistan, during which the two countries upgraded ties to a comprehensive strategic partnership and set a $5 billion bilateral trade target.\n\nKYB and KYC: Business behind the wealth creator called \u2018Divi\u2019s Lab\u2019 \u2013 Part 2, concluding\n\nKYB and KYC: Business behind the wealth creator called \u201cDivi\u2019s Lab\u201d \u2013 Part 1\n\nOne company, 2 words. Bond yield and CDS: Will they decide the fate of global markets?\n\nBusiness of Odd Things: Inside an industry that farms fish that nobody is meant to eat\n\nWar's second-order effects are becoming visible in critical sectors\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "24 Oct 2026, 03:18 PM IST", "pub_date_relative": "2h ago"}, {"title": "NFO deadline alert! New Motilal Oswal Nifty Midcap150 Index Fund closes next week \u2014 Date, allocation, holding details", "full_content": "Motilal Oswal Mutual Fund (MOMF) last week announced the launch of its new fund offer (NFO), \u2018 Motilal Oswal Nifty Midcap150 Plus 8\u201313 Yr G-Sec 70:30 Index Fund\u2019, an open-ended fund tracking the Nifty Midcap150 index, the company said.\n\nThe hybrid scheme brings together the growth potential of Midcaps and the stability of Government Securities (G-Secs), the release added.\n\n\u201cMidcap companies are in the growth phase of their lifecycle, while government securities carry zero credit risk. The fund is rebalanced monthly to maintain the 70:30 allocation \u2014 buying more of what has fallen and selling some of what has risen \u2014 helping maintain the pre-defined allocation without requiring market prediction or active shift between assets,\u201d according to the statement.\n\nAccording to Motilal Oswal Asset Management Company (MOAMC), the Nifty Midcap150 Plus 8\u201313 Yr G-Sec 70:30 Index aka the \u201cHybrid Index\u201d, has delivered:\n\nDisclaimer: This story is for educational purposes only. The views and recommendations made above are those of individual analysts or broking companies, and not of Mint. We advise investors to check with certified experts before making any investment decisions.\n\nJocelyn Fernandes is a journalist and editor with nearly 13 years of experience covering the business, corporate, economy and markets beats in news.<br> As chief content producer for around three years at Livemint (Hindustan Times), Jocelyn publishes breaking stories, explainers, features and live blogs on a range of business and economy topics, including the Budget, corporate developments, stock markets, income tax, money and personal finance, cryptocurrency, government policy, impact of US tariffs, international developments and more.<br> Jocelyn's writing philosophy is focused on delivering news in an accurate and accessible format for readers.", "source": "LiveMint Money", "pub_date_str": "24 Oct 2026, 03:06 PM IST", "pub_date_relative": "2h ago"}], "cfa": [{"title": "Income tax return filing: Why Nov 21 is an important date \u2013 valid for these ITR filers | Know details from CBDT", "full_content": "The Central Board of Direct Taxes (CBDT) has extended the income tax return filing deadline for taxpayers subject to audit requirements from October 31 to November 21, 2026, giving them additional time to do the needful.\n\nThe deadline for submitting tax audit reports for Assessment Year (AY) 2026-27 was also extended from September 30 to October 21, 2026.\n\nThe extensions came after chartered accountants and tax practitioners urged the government to provide more time for submitting tax audit reports , which are due a month before the return filing deadline.\n\nThe wave of demand, witnessed on social media, was driven partly by the heavy work overload in September, when tax professionals must also handle GST filings, company-related assignments and other statutory requirements.\n\nAny taxpayer with income from business or professional services , who is also required to submit an audit report shall file their return by November 21 to avoid penalties and tax notices.\n\nThose who have already submitted their audit reports should ensure they meet the extended ITR filing deadline.\n\nFor businesses, a tax audit is required if their total sales, annual turnover or gross receipts exceed \u20b9 1 crore in a relevant financial year. However, this threshold is raised to \u20b9 10 crore where the cash receipts and cash payments levels are less than 5% of total receipts and payments, respectively.\n\nFor professionals, on the other hand, the general threshold for requiring a tax audit is \u20b9 50 lakh in gross receipts.", "source": "LiveMint Money", "pub_date_str": "24 Oct 2026, 05:33 PM IST", "pub_date_relative": "5m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Crisil shareholders alerts! \u20b917 per share dividend, record date announced in Q2 results; stock gained 7% in 2 weeks", "full_content": "Crisil dividend : Shares of Crisil Limited will remain in focus on Monday, after the company announced a 1700% dividend payout on Friday, following market hours. The company also reported a 20.2% year-on-year surge in net profit during the quarter ended in September, 2026.\n\nCrisil share price has surged nearly 7% over the last two weeks, and around 9.17% since the beginning of the year 2026. Here are all the details to know.\n\nThe company\u2019s board of directors, on Friday, considered and approved the payout of a third interim dividend for financial year 2026-27. The board had announced \u20b9 17 per share dividend, which is 1700% of the stock\u2019s face value of Re 1 each. As per Crisil\u2019s BSE filing, the dividend will be paid on or before November 17, 2026.\n\n\u201cThe Board of Directors has also approved the payment of third interim dividend of Rs. 17/- per equity share of face value of Re 1 each, for the financial year ending December 31, 2026, which will be paid on or before November 17, 2026\u201d\n\nThe board has fixed October 29, Thursday, as the record date to determine the eligibility of shareholders for the payout. Which means that investors must own the stock before record date to qualify for the payout.\n\nThe firm reported a net profit of \u20b9 204.64 crore, which is 5.9% higher than its corresponding quarter profits. Its revenue from operations stood at \u20b9 1,095.16 crore during the quarter under review, which is 20.20% higher than the same quarter of previous financial year.\n\nThe stock closed 0.84% lower at \u20b9 4748.10 per share on BSE with a market capitalisation of \u20b9 34,722.86 crore on Friday. Its share price value has 4.57% in one week, 7.14% over the last two weeks, 3.13% in one month, and around 7.93% in three months. Its share price value has declined 4.16% in one year. It has surged nearly 17.83% in one year, 68.61% in five years.\n\nCatch all the Business News , Market News , Breaking News Events and Latest News Updates on Live Mint.", "source": "LiveMint Markets", "pub_date_str": "24 Oct 2026, 05:33 PM IST", "pub_date_relative": "5m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "In U.S. Gas Talks With Kremlin, Hidden Financing for Alaska Project Emerges - The New York Times", "full_content": "In U.S. Gas Talks With Kremlin, Hidden Financing for Alaska Project Emerges The New York Times US executives quit $25bn gas venture over claims of secret Russian control Financial Times US LNG Project Developer Funded by Russia\u2019s Novatek, FT Says Bloomberg 3 U.S. LNG Infrastructure Stocks Investors Are Watching After Russian Project Scrutiny Yahoo Finance 3 LNG Stocks Investors Are Watching As Alaska Gas Export Risk Reshapes Infrastructure Simply Wall Street", "source": "Google News Business", "pub_date_str": "24 Oct 2026, 05:13 PM IST", "pub_date_relative": "25m ago", "cfa_topics": ["Economics", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Netanyahu explores crypto to bypass potential sanctions", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Oct 2026, 05:12 PM IST", "pub_date_relative": "26m ago", "cfa_topics": ["Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Video: Piyush Goyal Says India Will Make Huge Contribution Towards Global GDP Growth", "full_content": "Piyush Goyal has invited German companies to deepen manufacturing, research and innovation partnerships with India, saying trade agreements could cover 75% of global GDP within 12-18 months.", "source": "NDTV Profit", "pub_date_str": "24 Oct 2026, 05:10 PM IST", "pub_date_relative": "28m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Tata Motors Has A 20% Revenue Cushion Against CV Downturns. Can It Grow It?", "full_content": "Business Operations Officer Girish said the segment is a clear focus area, laid out at the investor day, and works as a natural hedge against the cyclicality the CV industry generally faces.", "source": "NDTV Profit", "pub_date_str": "24 Oct 2026, 05:00 PM IST", "pub_date_relative": "38m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "\u2018Non-answers\u2019 aren\u2019t working. This is what investors really need from the Fed.", "full_content": "What really matters to investors, economists say, is for Fed Chairman Kevin Warsh to prove he can successfully communicate the central bank\u2019s strategy.", "source": "MarketWatch Top Stories", "pub_date_str": "24 Oct 2026, 05:00 PM IST", "pub_date_relative": "38m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "EAAA India Alternatives Secures Rs 360 Crore From Anchor Investors Ahead Of IPO", "full_content": "EAAA India Alternatives secured Rs 360 crore from anchor investors, allotting 21,62,161 equity shares at Rs 1,665 apiece. The Rs 1,200-crore IPO opens on Oct. 26 and closes on Oct. 28.", "source": "NDTV Profit", "pub_date_str": "24 Oct 2026, 04:56 PM IST", "pub_date_relative": "41m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Equity mutual funds amid market correction 2026: Should you stay invested or trim your portfolio? What history tells us", "full_content": "Market corrections can leave mutual fund investors wondering whether to stay invested or sell their investments to avoid further losses. However, an analysis by Abakkus Mutual Fund offers insights by examining the returns of the Nifty 50 Total Return Index (TRI) from April 2005 to September 2026.\n\nThe Nifty 50 TRI captures both price movements and dividends. It serves as a benchmark for many active equity mutual fund schemes and passive funds, such as index funds and ETFs, providing a comparable measure for investors to assess performance and decide their next move.\n\nAs of 30 September 2026, the Nifty 50 stood at 22,716, up 1.7% from its March 2026 low of 22,331. However, it remained below its previous peak of 26,329, recorded on 2 January 2026, and required a further 15.9% gain to return to that level.\n\nFor mutual fund investors, this shows how market corrections are affecting their portfolio returns in 2026.\n\nAccording to the study, the benchmark index has experienced 13 corrections of 10% to 20% since its inception, or approximately one every three years. From the bottom of these corrections, the index recovered to its previous peak in around 91 days on average.\n\nThe longest recovery period followed the market crash in March 2025 and lasted until January 2026, when the Nifty 50 reached its previous all-time high.\n\nAbakkus Mutual Fund's analysis reveals how missing a few strong market sessions can affect long-term returns. Investors who stayed invested throughout the period from April 2005 to September 2026 recorded higher returns than those who missed some of the market's best-performing days.\n\nStaying fully invested in the Nifty 50 TRI throughout this period delivered a CAGR of 13.19%. However, missing just the five best-performing days dragged the CAGR down to 10.86%. For investors who missed the best 50 days, returns flatlined to a CAGR of 0.66%.", "source": "LiveMint Money", "pub_date_str": "24 Oct 2026, 04:56 PM IST", "pub_date_relative": "42m ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "FICCI seeks Dutch investment in mfg, tech; calls for project-level follow-up", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a FICCI seeks Dutch investment in mfg, tech; calls for project-level follow-up The Economic Times daily newspaper is available online now. Read Today's Paper FICCI seeks Dutch investment in mfg, tech; calls for project-level follow-up SECTIONS FICCI seeks Dutch investment in mfg, tech; calls for project-level follow-up PTI Last Updated: Oct 24, 2026, 04:53:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis FICCI has called for enhanced Dutch investments in India\u2019s manufacturing and technology sectors during Piyush Goyal's visit. The discussions may lead to manufacturing partnerships and technology collaborations which would strengthen bilateral trade. Greater emphasis is placed on supply chain integration to meet Dutch quality and sustainability standards. The upcoming India-EU free trade agreement is expected to facilitate deeper commercial ties.\n\nKYB and KYC: Business behind the wealth creator called \u2018Divi\u2019s Lab\u2019 \u2013 Part 2, concluding\n\nKYB and KYC: Business behind the wealth creator called \u201cDivi\u2019s Lab\u201d \u2013 Part 1\n\nOne company, 2 words. Bond yield and CDS: Will they decide the fate of global markets?\n\nBusiness of Odd Things: Inside an industry that farms fish that nobody is meant to eat\n\nWar's second-order effects are becoming visible in critical sectors\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "24 Oct 2026, 04:53 PM IST", "pub_date_relative": "45m ago", "cfa_topics": ["Economics", "Fixed Income", "Derivatives", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Rs 1 Lakh Monthly Income After Retirement: What Corpus Would You Need?", "full_content": "When deciding your long-term retirement corpus requirement, you must account for any financial obligations, as well as inflation and taxes, to avoid any financial stress later.", "source": "NDTV Profit", "pub_date_str": "24 Oct 2026, 04:46 PM IST", "pub_date_relative": "52m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Rs 50 Lakh Today Or Rs 1 Crore In 10 Years: Which Is Worth More In Real Terms?", "full_content": "When planning for investments, savings or retirement, one has to be sure that they account for not only taxes but also inflation.", "source": "NDTV Profit", "pub_date_str": "24 Oct 2026, 04:43 PM IST", "pub_date_relative": "55m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "How InvestingPro\u2019s Fair Value spotted BWFG\u2019s 109% gain in advance", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Oct 2026, 04:39 PM IST", "pub_date_relative": "59m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Godrej Properties Q2 profit plunges 62% to \u20b9154 crore, real estate stock down 6.5% in 1 week - What next for investors", "full_content": "Godrej Properties Q2 profit: Godrej Properties share price closed 4.23% lower on Friday, after the realty firm reported 62% annual decline in its consolidated net profit to \u20b9 154.15 crore for the quarter ended September. The decline in Q2 profit was driven by higher expenses.\n\nRising costs and earnings expansion in the short term is a key concern for the company, and investors will closely monitor how the firm will manage to turn its strengths in operations into profitability as projects come closer to completion, according to Siddharth Maurya, Founder & Managing Director, Vibhavangal Anukulakara Pvt. Ltd.\n\n\u201cA fall in Godrej Properties\u2019 Q2 net profit by 62% is clearly a red flag regarding the issue of rising costs and earnings expansion in the short term, but it doesn\u2019t really undermine the company\u2019s prospects in the long run. Healthy bookings, collection from customers, and the pipeline of new launches are indicative of the positive housing market trend,\u201d explained Maurya.\n\nApart from increasing costs and earnings expansion, investors will closely track company\u2019s strategy to turn its strengths in operations into profitability. \u201cConstruction cost escalation and execution timeline will still be crucial concerns. In the coming months, share price dynamics will be contingent upon margins, cash flows, and new launches,\u201d he added.\n\nThe Mumbai-headquartered realty firm announced a 62% decline in its consolidated net profit to \u20b9 154.15 crore for the quarter ended September.", "source": "LiveMint Markets", "pub_date_str": "24 Oct 2026, 04:37 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "ProPetro\u2019s 49% decline: how Fair Value spotted the warning signs", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Oct 2026, 04:31 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Nvidia's role as AI financier faces first big test as neoclouds take market hit", "full_content": "Nvidia's emergence as financier for the global AI buildout is facing its first major stress test as credit markets tighten for key partners.\n\nAfter creating the chips that powered the early stages of the generative artificial intelligence era, Nvidia turned to using its financial prowess to fund AI model developers, data center companies and a host of so-called neoclouds. CEO Jensen Huang's strategy has been to not only build the most advanced technology but to provide customers with investment as well as help them take out loans so his systems can reach many more hands.\n\nThat's meant taking full advantage of Nvidia's investment grade credit rating and providing backstop guarantees on mega-projects for OpenAI so that buildouts can get funded at lower interest rates.\n\nAs of its last quarterly financial filing in July, Nvidia had $36 billion in off-balance-sheet AI cloud agreements, or backstops, for neoclouds, in addition to its guarantee on up to $105 billion for chips, land and power at a proposed 10 gigawatt OpenAI data center in Ohio. The company signed as a tenant for $20 billion in future data center leases, which will later be assigned to third parties.\n\nFor the vast majority of these deals, Nvidia won't have to pay up unless participants in the project default.\n\n\"If the demand for compute doesn't meet these really super lofty expectations, we're going to have a problem,\" said David Trainer, founder and CEO of financial research firm New Constructs, in an interview.\n\nMarket conditions may soon test Nvidia's mettle. Shares of neoclouds CoreWeave , Nebius and IREN , all cash-burning companies in Nvidia's portfolio, are down at least 30% this month. CoreWeave, the biggest of the group, has seen the spread on its credit default swaps soar past 11%, as investors are forced to pay up for insurance against default.\n\nNvidia has backed other neoclouds that have run into challenges.", "source": "CNBC World Economy", "pub_date_str": "24 Oct 2026, 04:30 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income", "Portfolio Management"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Trump is pushing a massive AI buildout. His own voters are wary of what comes with it", "full_content": "President Donald Trump has cast America's artificial intelligence race with China as a national-security imperative, pushing faster development of the technology and an immense buildout of the data centers and power infrastructure needed to fuel it.\n\nBut the new CNBC All-America Economic Survey reveals a growing political tension beneath that agenda: Republican voters broadly support the push for AI development, but many oppose building the sprawling infrastructure needed to power it in their own backyards.\n\nNearly 55% of MAGA supporters want companies to keep developing advanced AI while Congress works on regulations, versus 27% who favor a pause. But only 29% would support a data center within 10 miles of their home, while 40% oppose one. Among all Republicans and Republican-leaning voters \u2014 not just those who identify themselves with the MAGA movement \u2014 those who say they would support a data center near their home falls to 24%.\n\nAcross the electorate, 63% don't want a nearby AI data center and just 13% support one. Democrats lead the opposition: 80% oppose nearby facilities while just 4% support them.\n\nThat resistance is increasingly forcing Trump and vulnerable Republicans who once championed data centers to recalibrate as they head into a bleak midterm election environment for the party.\n\n\"Many people are annoyed by these data centers,\" said Brad Carson , a former Democratic congressman from Oklahoma and co-founder of Public First Action PAC, an AI-industry-backed political group pushing for stronger regulation and safeguards. \"People are also strongly insistent upon reasonable guardrails of AI, and that's going to be hard to beat.\"\n\nThe CNBC survey of 1,000 registered voters nationwide was conducted Oct. 14-18 by Hart Research Associates and Public Opinion Strategies and has a margin of error of plus or minus 3.1 percentage points.", "source": "CNBC Top News", "pub_date_str": "24 Oct 2026, 04:29 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "AU SMALL FINANCE BANK Q2: Profit Grows Over 50%, Asset Quality Improves", "full_content": "AU Small Finance Bank's Q2 net profit rose 52.9% to Rs 858 crore, while NII grew 31.5%. Gross NPA eased to 1.99% year-on-year as deposits and loans recorded strong growth.", "source": "NDTV Profit", "pub_date_str": "24 Oct 2026, 04:27 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Motilal Oswal Nifty Midcap150 Plus 8-13 Yr G-Sec 70:30 Index Fund: A Growth And Stability Engine", "full_content": "Motilal Oswal's hybrid index fund combines 70% midcap equities with 30% government securities to balance growth potential and portfolio stability.", "source": "NDTV Profit", "pub_date_str": "24 Oct 2026, 04:23 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Fixed Income", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Parliamentary Committee On Finance To Examine 46 Economic Issues, Including Crypto, AI In FY27", "full_content": "The panel would also look at customs, GST, and direct tax reforms, conduct a study on virtual digital assets and the way forward, analyse emerging issues and prospects of artificial intelligence in the financial sector, and regulatory gaps in the NBFC sector.", "source": "NDTV Profit", "pub_date_str": "24 Oct 2026, 04:23 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "IT stocks Q2 results analysis: Infosys vs TCS vs Wipro vs HCL vs TechM: Who wins profit, revenue, dividend, AI race?", "full_content": "IT stocks Q2 results analysis : India\u2019s largest IT companies are showing signs of recovery, with most delivering stronger profits and deal bookings while some struggle with sluggish client spending and pressure on revenue growth.\n\nThe September quarter (Q2FY27) results of Tata Consultancy Services (TCS), Infosys , Wipro, HCLTech and Tech Mahindra reveal a widening gap in performance, particularly in constant-currency growth, artificial intelligence (AI) monetisation and future revenue visibility.\n\nWhile Tech Mahindra led profit and revenue growth, HCLTech stood out for raising its growth guidance, Infosys announced the highest interim dividend , and TCS retained its lead in deal bookings and AI revenue scale. Wipro, meanwhile, faced pressure on profitability and new business wins.\n\nNet profit : Tech Mahindra emerged as the strongest performer in year-on-year profit growth, with net profit surging 32.7% to \u20b9 1,586 crore. HCLTech followed with a 21.2% increase to \u20b9 5,132 crore, its highest-ever quarterly net income. TCS reported a 15% rise to \u20b9 13,884 crore, while Infosys posted a more modest 6% increase to \u20b9 7,823 crore. However, Wipro's consolidated net profit declined 1.4% to \u20b9 3,200.6 crore, making it the only company among the four to report a year-on-year profit decline.\n\nRevenue growth : Tech Mahindra also led year-on-year revenue growth, with consolidated revenue increasing 15.6% to \u20b9 16,180 crore. HCLTech recorded an 11.52% rise to \u20b9 35,620 crore, narrowly ahead of Infosys, which reported an 11% increase to \u20b9 49,244 crore. Meanwhile, TCS revenue grew 11.2% to \u20b9 73,188 crore, the highest in absolute terms among the five companies. Wipro's gross revenue rose 9.1% to \u20b9 24,752.7 crore, although its core IT services business continued to experience muted growth.\n\nConstant-currency revenue : Tech Mahindra led the reported constant-currency performance, with growth of 7.2% year-on-year and 2.4% quarter-on-quarter.", "source": "LiveMint Markets", "pub_date_str": "24 Oct 2026, 04:22 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Be an intelligent investor: Six key mistakes that separate successful investors from speculators | Dos and Don'ts", "full_content": "When you invest or speculate in financial markets, both may involve risk; but the difference lies in the approach you take. It is also about having a clear and fundamental understanding of what you are doing with your hard-earned money. Sensible investors focus on their long-term financial goals, business fundamentals, and current economic reality.\n\nOn the other hand, speculators act differently, since they focus more on chasing quick returns based on price movements, market rumours or short-term trends. That is why, to ensure meaningful success, it is vital for day-to-day financial market participants to avoid common mistakes, as this approach can also help investors make more disciplined and meaningful financial decisions .\n\nHence, the focus should be on saving money before thinking about generating quick money. Keeping these basics in mind, here are common mistakes investors should avoid to succeed in their wealth-creation journey .\n\nNote: These mistakes are illustrative in nature. Investors should seek professional guidance from a certified financial advisor before investing.\n\nTherefore, successful investing does not mean avoiding every loss or predicting every market movement correctly. No one can achieve perfection in investing. Investing, hence, means making informed decisions, managing risks properly, and remaining consistent with a well-defined financial plan.\n\nEven fundamentally strong investments can underperform due to market conditions, and diversification cannot completely eliminate the risk associated with market investments.\n\nThat is why investors should also review their portfolios and asset allocation (investments in stocks, bonds, fixed deposits, gold, and other asset classes) periodically and ensure they remain aligned with their long-term financial objectives.\n\nThe portfolio should be developed based on the guidance of a certified financial advisor, on changing circumstances and risk-taking appetite.", "source": "LiveMint Money", "pub_date_str": "24 Oct 2026, 04:17 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Rules explained: Old vs New Income Tax Act 2025 - Can you set off or carry forward losses from previous years? Details", "full_content": "The new Income-tax Act, 2025, came into effect on April 1, 2026. If you have carried forward losses from previous financial years to reduce your tax liability in the future, you may wonder whether these losses remain valid under the new tax framework.\n\nThe Central Board of Direct Taxes ( CBDT ), in its FAQs on the interplay and transition from the Income-tax Act, 1961, to the Income-tax Act, 2025, has clarified that the fundamental rules for setting off and carrying forward losses remain unchanged. Here is what taxpayers need to know.\n\nYes. Losses carried forward under the Income-tax Act, 1961, can continue to be carried forward and set off under the Income-tax Act, 2025. The new law does not restart the time limit for using these losses. The remaining period under the old law continues to apply.\n\nFor example, if you incurred an eligible busin
