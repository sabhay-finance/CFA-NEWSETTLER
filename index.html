    const allData = {"general": [{"title": "U.S. strikes Greenland deal for 'permanent control over security,' will send forces to Danish dogsled outpost and reopen Cold War base: Report", "full_content": "The U.S. reportedly plans to reopen a Cold War-era military base in southern Greenland and station forces at an eastern outpost currently run by the Danish dog sled patrol, part of a broader security agreement the U.S., Denmark and Greenland are set to sign Tuesday.\n\nPresident Donald Trump last Friday announced an agreement with Greenland and Denmark that would give the U.S. what he described as \"permanent control over security , and all other needs\" in the Danish island territory.\n\nThe two new sites are Narsarsuaq, home to just a few dozen residents after the U.S. shut its Bluie West One base in the 1950s, and Mestersvig, a military outpost used by the Sirius Patrol, a Danish special forces unit, Reuters reported, citing unnamed sources.\n\nTerms of the agreement remain undisclosed and may not be finalized until the three governments sign at the UN General Assembly in New York, according to the report. The White House and the governments of Denmark and Greenland did not immediately respond to CNBC's requests for comment.\n\nThe agreement came as Trump has pushed for U.S. control of Greenland and at times declined to rule out military or economic force to acquire the semi-autonomous Danish territory, alarming Greenlanders and opening a rift within NATO nations. Greenland has maintained it is not for sale, and the European Union earlier this year united to rebuke Trump over his push to acquire the island.\n\nBut Trump signaled Friday that he was satisfied by the new deal, claiming that it addresses \"ALL of our many U.S. concerns\" and at no cost to the U.S.\n\nGreenland's government, in a statement last week, said that the deal would strengthen its security and that of Denmark, the U.S. and the broader Western alliance. Danish Prime Minister Mette Frederiksen also noted the pact \"recognizes the sovereignty and territorial integrity of the Kingdom and the Greenlandic people's right to self-determination.\"\n\nU.S.", "source": "CNBC Top News", "pub_date_str": "22 Sep 2026, 07:01 PM IST", "pub_date_relative": "4m ago"}, {"title": "Trump to press Zelenskyy for energy truce, says Russia has \u2018lost control\u2019 of oil due to Ukraine war", "full_content": "U.S. President Donald Trump is expected to pressure his Ukrainian counterpart to agree to an energy truce with Russia in a high-stakes meeting on Tuesday, saying that Moscow has \"unfortunately lost control\" of its diesel oil industry due to the war.\n\nTrump is set to meet Ukrainian President Volodymyr Zelenskyy on the sidelines of the United Nations General Assembly in New York on Tuesday, in a rare sit-down meeting of the two leaders at a high-level event.\n\nThe pair are poised to discuss further air defense support for Kyiv ahead of winter, Ukrainian drone strikes on Russian oil refineries and how to bring an end to the more than 4\u00bd-year conflict.\n\nIn a post Monday on Truth Social , Trump said \"a large number\" of Russian diesel oil refineries had been \"blown up\" and were, at least temporarily, out of commission, without providing further details.\n\n\"This ridiculous and never ending War with Ukraine must be ended. The whole World suffers as 25,000 people, mostly soldiers, are being killed each month. What a shame!\" Trump said.\n\nA spokesperson for Russia's embassy in London was not immediately available to comment when contacted by CNBC.\n\nTrump has previously called on Zelenskyy to stop targeting Russian oil refineries with drone strikes, which he says are \"hurting the world\" as fuel supply disruptions from the Ukraine and Iran wars propel U.S. diesel prices to a record high.\n\nU.S. retail diesel prices have climbed above $6.50 per gallon for the first time, according to the latest figures from AAA, as global supplies through the strategically vital Strait of Hormuz have been curtailed by the Iran war.", "source": "CNBC Top News", "pub_date_str": "22 Sep 2026, 07:00 PM IST", "pub_date_relative": "4m ago"}, {"title": "Iran reportedly says it can reopen Strait of Hormuz within 7 days if U.S. eases military pressure", "full_content": "Iran has suggested it could reopen the strategically vital Strait of Hormuz within seven days if the U.S. eases military pressure and lifts its blockade on Iranian ports, according to media reports.\n\nThe prospect of renewed diplomacy between the U.S. and Iran comes after nearly seven months of war in the Middle East, with the Trump administration threatening to ramp up its economic pressure campaign against Tehran in recent days.\n\nReports from Reuters and Japan's Kyodo news agency, which both cited an unnamed senior Iranian government official, said Tehran had laid out the necessary conditions for reopening the Strait of Hormuz. CNBC could not independently verify the reports.\n\nThe war has severely disrupted shipping through the strait, a narrow waterway that typically handles around 20% of the world's oil and liquefied natural gas supplies, sending shock waves through the global economy.\n\nU.S. stock index futures traded mixed on the news, while oil prices reversed earlier gains.\n\nInternational benchmark Brent crude futures with November expiry traded 2.6% lower at $97.73 per barrel, while U.S. West Texas Intermediate futures with October expiry were last seen down 3.1% at $92.40.\n\nThe reports came just before U.S. President Donald Trump is due to address the United Nations General Assembly on Tuesday, amid mounting domestic pressure over his decision to launch a war against Iran , a conflict that has rattled the global economy.\n\nEarlier in the week, U.S. Treasury Secretary Scott Bessent threatened to \"shut down\" all Iranian airlines from as soon as Wednesday.", "source": "CNBC Top News", "pub_date_str": "22 Sep 2026, 06:57 PM IST", "pub_date_relative": "7m ago"}, {"title": "Kali Metals, JX Advanced Metals sign MoU for Southern Lachlan", "full_content": "Skip to navigation Skip to main content Skip to right column Kali Metals, JX Advanced Metals sign MoU for Southern Lachlan Shree Mishra Tue, September 22, 2026 at 6:25 AM PDT 2 min read 5016.T Kali Metals has signed a binding memorandum of understanding (MoU) with Japan's JX Advanced Metals concerning the Southern Lachlan Project, which spans Victoria and New South Wales, Australia.\n\nUnder the agreement, JX Advanced Metals will fund up to $498,746 (A$700,000) of exploration activities at the project during an initial phase ending 31 March 2027.\n\nThe project covers approximately 1,413km\u00b2 east of Albury-Wodonga and includes Palaeozoic granitoid and sedimentary units within the Southern Lachlan Fold Belt.\n\nThe site is considered to have potential for lithium-caesium-tantalum pegmatites, as well as tin and tungsten mineralisation.\n\nDuring the initial exploration and due diligence period, Kali Metals will remain the operator and manage the exploration programme.\n\nA joint Exploration Committee will be formed to oversee the progress of these activities.\n\nKali Metals is entitled to charge a management fee for its role in running the exploration works.\n\nAt the conclusion of the exploration phase, JX Advanced Metals will have an option to negotiate terms for either a farm-in or joint venture agreement, with a negotiation deadline set for 30 June 2027.", "source": "Yahoo Finance", "pub_date_str": "22 Sep 2026, 06:55 PM IST", "pub_date_relative": "10m ago"}, {"title": "Big investors haven't been this bullish since the housing crisis. Why this time may be different", "full_content": "Big investors really like stocks right now.", "source": "CNBC Top News", "pub_date_str": "22 Sep 2026, 06:55 PM IST", "pub_date_relative": "10m ago"}, {"title": "Oil falls to $98 as Saudi Arabia signals East-West pipeline reopening", "full_content": "Key route for Saudi crude to reach Red Sea has been closed for two weeks following drone strikes", "source": "FT Markets", "pub_date_str": "22 Sep 2026, 06:55 PM IST", "pub_date_relative": "10m ago"}, {"title": "Santoli: The S&P 500 is within striking distance of record as bull relies on familiar leadership", "full_content": "Get Mike Santoli's Market Memo in your inbox first. SUBSCRIBE HERE\n\nWhen there's a strong undertow near the beach, the move is to swim sideways, traveling parallel to the shore to reach a point beyond the narrow rip current's pull.\n\nThe stock market seems to have executed such a cautious, patient maneuver. Months of bend-don't-break action had kept the S&P 500 within sight of record highs while that undertow pulled at parts of the market most exposed to higher oil prices, rising interest rates and a tiring household sector: consumer cyclicals, industrial shares and, lately, the banks.\n\nMeantime, semiconductor stocks and most of the mega-cap tech platforms were convalescing as AI-overspending fears eroded investor conviction and compressed valuations.\n\nWas Monday's propulsive rally, concentrated in the AI implementers of Big Tech, a sign that the market is revving to escape its summer-long stasis? Could both the \"spenders\" (hyperscalers) and the vendors (AI hardware providers) rally together for more than a couple of days?\n\nLast week here I described an ambiguous setup in which the trend had held while a wall of worry built:\n\n\"The S&P 500\u2032s months-long sideways churn reflects a tape that continues to rescue itself through alacritous rotation. The S&P 500 has gone nowhere since June 1, but hasn't slipped more than 3% from a record high over that span. It has spent nearly the entire time since Aug. 4 inside the range of that single day's rally to a record high. Market breadth has eroded, but that also means internal oversold conditions are building. Seasonal tendencies are challenging, though everyone knows this.", "source": "CNBC Top News", "pub_date_str": "22 Sep 2026, 06:51 PM IST", "pub_date_relative": "13m ago"}, {"title": "RBI amends valuation rules for InvIT, REIT units held by all-India financial institutions", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a RBI amends valuation rules for InvIT, REIT units held by all-India financial institutions The Economic Times daily newspaper is available online now. Read Today's Paper RBI amends valuation rules for InvIT, REIT units held by all-India financial institutions SECTIONS RBI amends valuation rules for InvIT, REIT units held by all-India financial institutions ET Online Last Updated: Sep 22, 2026, 06:51:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The RBI has amended valuation norms for InvIT and REIT units held by all-India financial institutions, introducing separate provisions for quoted and unquoted units. Unquoted units will generally be valued at disclosed NAV, while units of trusts that fail to meet prescribed NAV disclosure requirements, or are classified as infrequently traded, will be valued at Re 1 for the purpose of the directions.\n\nHas the US Fed and AI created a costlier world? And has the queue got longer for India?\n\nGold rush on Dalal St as regional jewellers bid to be the next Tanishq\n\nA different kind of buyback. Is this the beginning of these kinds of buybacks?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers\n\nLogin using your ET Prime credentials to enjoy all member benefits\n\nLog out of your current logged-in account and log in again using your ET Prime credentials to enjoy all member benefits.", "source": "Economic Times Economy", "pub_date_str": "22 Sep 2026, 06:51 PM IST", "pub_date_relative": "14m ago"}, {"title": "M\u00fcller in talks to acquire dairy peer Vogtlandmilch", "full_content": "Skip to navigation Skip to main content Skip to right column M\u00fcller in talks to acquire dairy peer Vogtlandmilch Shivam Mishra Tue, September 22, 2026 at 6:20 AM PDT 2 min read Unternehmensgruppe Theo M\u00fcller has confirmed it is in talks to acquire local dairy peer Vogtlandmilch.\n\nA spokesperson for the German dairy group told Just Food discussions are under way with Vogtlandmilch's management and supervisory board over a possible takeover of the company, including its facility in Plauen.\n\n\"The discussions are at an early stage. Any potential transaction would also be subject to the necessary competition law approvals,\" the spokesperson said, adding the company was \"unable to comment further at this stage\".\n\nVogtlandmilch is headquartered in Plauen, the principal city of Saxony's Vogtland region in the south-west of the state, near the borders with Bavaria and the Czech Republic.\n\nThe company was established in 1928 and has about 150 employees at its Plauen plant, according to its website.\n\nIt processes milk from approximately 150 farms located within an 80km radius across Vogtland, western Saxony and eastern Thuringia.\n\nIts range includes quark, UHT milk, butter and buttermilk sold under the Vogtlandweide, Sachsenland brands as well as Joe Clever, a brand sold in local schools.\n\nInformation on the company's website says a recent investment upgraded the Plauen facility, increasing bottling and quark production capacity while expanding storage and improving infrastructure.", "source": "Yahoo Finance", "pub_date_str": "22 Sep 2026, 06:50 PM IST", "pub_date_relative": "15m ago"}, {"title": "Laredo Oil signs non-binding letter of intent for Argentina project", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Sep 2026, 06:50 PM IST", "pub_date_relative": "15m ago"}, {"title": "US says new air traffic control system will prevent future disruptions", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Sep 2026, 06:50 PM IST", "pub_date_relative": "15m ago"}, {"title": "Nvidia stock valuation hits decade low despite profit boom", "full_content": "Skip to navigation Skip to main content Skip to right column Nvidia stock valuation hits decade low despite profit boom Cris Tolomia Tue, September 22, 2026 at 6:19 AM PDT 2 min read NVDA Nvidia stock is trading near its lowest valuation in more than a decade, according to Bloomberg , even as the chipmaker's revenue and net income are each expected to grow by roughly 90% or more in its current fiscal year.\n\nAt under 17 times forward earnings, the stock's multiple has been cut in half compared with 2025 \u2014 a period when Nvidia's expansion was actually slower \u2014 and has fallen sharply from above 25 times expected profits just this past May, according to Bloomberg.\n\n\"The stock has de-rated pretty significantly, which suggests a healthy dose of skepticism that the company's current earnings power is sustainable,\" Eli Horton, a TCW senior portfolio manager overseeing thematic and durable growth equities, told Bloomberg. \"The stock's performance is surprising, given the backdrop of incredible fundamentals, but it tells you the market is expecting less than what the consensus is currently estimating.\"\n\nOne drag on the stock's valuation is a squeeze on profitability. Nvidia's gross margin came in at 75% last quarter but analyst estimates compiled by Bloomberg show it sliding under 72% by the fourth quarter, with a recovery expected thereafter. Rising costs for key components such as memory chips are a central factor.\n\nCompetition is another concern. David Russell, global head of market strategy at TradeStation, pointed to the growing threat of customers building their own silicon, noting that Meta Platforms and Alphabet are among the major Nvidia buyers that have moved to design AI chips internally \u2014 a shift he believes will gradually erode Nvidia's pricing power and market share.", "source": "Yahoo Finance", "pub_date_str": "22 Sep 2026, 06:49 PM IST", "pub_date_relative": "16m ago"}, {"title": "US battery startup that chose China over Kentucky opens first factory as Trump, Xi meet", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Sep 2026, 06:49 PM IST", "pub_date_relative": "16m ago"}, {"title": "DA news: Delhi govt to consult labour dept amid DTC drivers\u2019 strike \u2014 Here's a look at the top demands, latest updates", "full_content": "DA news: The Delhi government is set to hold consultations with the state labour department to discuss salaries of striking Delhi Transport Corporation (DTC) drivers, PTI reported on Monday, citing a senior government official.\n\nDelhi Transport Minister Pankaj Singh on Monday directed officials that the labour department be consulted on the issue, it said.\n\nDTC drivers working with private companies hired for the corporation's electric buses have been on strike for the past six days demanding hike in daily wages, with implementation of basic dearness allowance ( DA ), medical facilities and overtime payment, the report added.\n\nAccording to the DTC Karamachari Ekta Union, they will launch a complete \u2018kaam band\u2019 (stop work) protest from 28 September over non-implementation of basic DA for DTC contract employees . A letter to this effect has been submitted to the Delhi Chief Minister's and the Delhi Lieutenant Governor (LG) Office, the report added.\n\nThe letter stated, \u201cFor the past two years, the file regarding basic DA of DTC employees has been pending with you; it has also been passed from the DTC Board and is with the finance department.", "source": "LiveMint Money", "pub_date_str": "22 Sep 2026, 06:47 PM IST", "pub_date_relative": "18m ago"}, {"title": "Sazerac to buy German spirits producer Berentzen", "full_content": "Skip to navigation Skip to main content Skip to right column Sazerac to buy German spirits producer Berentzen Laurel Deppen Tue, September 22, 2026 at 6:17 AM PDT 2 min read This story was originally published on Food Dive. To receive daily news and insights, subscribe to our free daily Food Dive newsletter .\n\nFireball owner Sazerac has reached an agreement to acquire Germany-based spirits company Berentzen Group as it broadens its presence in Europe.\n\nSazerac will pay 5.55 euros per share, or about $6.31, in an agreement that would be 68% above the company's three-month weighted average price prior to Sept. 16. The deal, subject to shareholder approval, is expected to close at the end of the year and Sazerac will delist the company from the Frankfurt Stock Exchange, according to a press release\n\nBerentzen Group is one of Germany's oldest spirit producers, with a more than 250-year history. The company operates in more than 60 countries and is best known for brands including Berentzen schnapps and Puschkin vodka. It also owns several nonalcoholic beverage and juice brands.\n\nThe partnership will allow Sazerac to broaden its capabilities in Europe, including manufacturing and distributing the Buffalo Trace maker's own spirits products \"with greater flexibility and pace,\" Sazerac CEO Jake Wenz said in a statement.\n\nThe companies expect the deal to also broaden Berentzen's existing portfolio and capabilities, while also boosting investments at the German spirits producer's existing sites.\n\n\"The business combination will present the Berentzen Group with an excellent opportunity to consistently pursue its growth strategy and tap into further potential for value creation at a pace and on a scale that is only possible with a strong strategic partner in a challenging European market,\" Oliver Schwegmann and Ralf Bruehoefner, members of the Berentzen Group's Executive Board, said in a statement.\n\nThis is the second deal Sazerac has charted in Europe within the past year.", "source": "Yahoo Finance", "pub_date_str": "22 Sep 2026, 06:47 PM IST", "pub_date_relative": "18m ago"}, {"title": "FDA grants fee waivers to Jaguar Health for two drugs", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Sep 2026, 06:46 PM IST", "pub_date_relative": "19m ago"}, {"title": "Redwood Trust chief legal officer buys $20,593 in stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Sep 2026, 06:46 PM IST", "pub_date_relative": "19m ago"}, {"title": "Southern first director James Orders III disposes of $499k in stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Sep 2026, 06:46 PM IST", "pub_date_relative": "19m ago"}, {"title": "I\u2019m in my 50s. My mother died from Alzheimer\u2019s. Do I need long-term-care insurance?", "full_content": "\u201cBy the time my mother died, the insurance company had paid out almost $600,000.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "22 Sep 2026, 06:45 PM IST", "pub_date_relative": "20m ago"}, {"title": "Earnings call transcript: Oxford Biomedica H1 2026 misses forecasts, shares rise", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Sep 2026, 06:43 PM IST", "pub_date_relative": "22m ago"}], "cfa": [{"title": "Iran reportedly says it can reopen Strait of Hormuz within 7 days if U.S. eases military pressure", "full_content": "Iran has suggested it could reopen the strategically vital Strait of Hormuz within seven days if the U.S. eases military pressure and lifts its blockade on Iranian ports, according to media reports.\n\nThe prospect of renewed diplomacy between the U.S. and Iran comes after nearly seven months of war in the Middle East, with the Trump administration threatening to ramp up its economic pressure campaign against Tehran in recent days.\n\nReports from Reuters and Japan's Kyodo news agency, which both cited an unnamed senior Iranian government official, said Tehran had laid out the necessary conditions for reopening the Strait of Hormuz. CNBC could not independently verify the reports.\n\nThe war has severely disrupted shipping through the strait, a narrow waterway that typically handles around 20% of the world's oil and liquefied natural gas supplies, sending shock waves through the global economy.\n\nU.S. stock index futures traded mixed on the news, while oil prices reversed earlier gains.\n\nInternational benchmark Brent crude futures with November expiry traded 2.6% lower at $97.73 per barrel, while U.S. West Texas Intermediate futures with October expiry were last seen down 3.1% at $92.40.\n\nThe reports came just before U.S. President Donald Trump is due to address the United Nations General Assembly on Tuesday, amid mounting domestic pressure over his decision to launch a war against Iran , a conflict that has rattled the global economy.\n\nEarlier in the week, U.S. Treasury Secretary Scott Bessent threatened to \"shut down\" all Iranian airlines from as soon as Wednesday.", "source": "CNBC Top News", "pub_date_str": "22 Sep 2026, 06:57 PM IST", "pub_date_relative": "7m ago", "cfa_topics": ["Equity Investments", "Fixed Income", "Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Santoli: The S&P 500 is within striking distance of record as bull relies on familiar leadership", "full_content": "Get Mike Santoli's Market Memo in your inbox first. SUBSCRIBE HERE\n\nWhen there's a strong undertow near the beach, the move is to swim sideways, traveling parallel to the shore to reach a point beyond the narrow rip current's pull.\n\nThe stock market seems to have executed such a cautious, patient maneuver. Months of bend-don't-break action had kept the S&P 500 within sight of record highs while that undertow pulled at parts of the market most exposed to higher oil prices, rising interest rates and a tiring household sector: consumer cyclicals, industrial shares and, lately, the banks.\n\nMeantime, semiconductor stocks and most of the mega-cap tech platforms were convalescing as AI-overspending fears eroded investor conviction and compressed valuations.\n\nWas Monday's propulsive rally, concentrated in the AI implementers of Big Tech, a sign that the market is revving to escape its summer-long stasis? Could both the \"spenders\" (hyperscalers) and the vendors (AI hardware providers) rally together for more than a couple of days?\n\nLast week here I described an ambiguous setup in which the trend had held while a wall of worry built:\n\n\"The S&P 500\u2032s months-long sideways churn reflects a tape that continues to rescue itself through alacritous rotation. The S&P 500 has gone nowhere since June 1, but hasn't slipped more than 3% from a record high over that span. It has spent nearly the entire time since Aug. 4 inside the range of that single day's rally to a record high. Market breadth has eroded, but that also means internal oversold conditions are building. Seasonal tendencies are challenging, though everyone knows this.", "source": "CNBC Top News", "pub_date_str": "22 Sep 2026, 06:51 PM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "RBI amends valuation rules for InvIT, REIT units held by all-India financial institutions", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a RBI amends valuation rules for InvIT, REIT units held by all-India financial institutions The Economic Times daily newspaper is available online now. Read Today's Paper RBI amends valuation rules for InvIT, REIT units held by all-India financial institutions SECTIONS RBI amends valuation rules for InvIT, REIT units held by all-India financial institutions ET Online Last Updated: Se agement and supervisory board over a possible takeover of the company, including its facility in Plauen.\n\n\"The discussions are at an early stage. Any potential transaction would also be subject to the necessary competition law approvals,\" the spokesperson said, adding the company was \"unable to comment further at this stage\".\n\nVogtlandmilch is headquartered in Plauen, the principal city of Saxony's Vogtland region in the south-west of the state, near the borders with Bavaria and the Czech Republic.\n\nThe company was established in 1928 and has about 150 employees at its Plauen plant, according to its website.\n\nIt processes milk from approximately 150 farms located within an 80km radius across Vogtland, western Saxony and eastern Thuringia.\n\nIts range includes quark, UHT milk, butter and buttermilk sold under the Vogtlandweide, Sachsenland brands as well as Joe Clever, a brand sold in local schools.\n\nInformation on the company's website says a recent investment upgraded the Plauen facility, increasing bottling and quark production capacity while expanding storage and improving infrastructure.", "source": "Yahoo Finance", "pub_date_str": "22 Sep 2026, 06:50 PM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Corporate Issuers", "Alternative Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Nvidia stock valuation hits decade low despite profit boom", "full_content": "Skip to navigation Skip to main content Skip to right column Nvidia stock valuation hits decade low despite profit boom Cris Tolomia Tue, September 22, 2026 at 6:19 AM PDT 2 min read NVDA Nvidia stock is trading near its lowest valuation in more than a decade, according to Bloomberg , even as the chipmaker's revenue and net income are each expected to grow by roughly 90% or more in its current fiscal year.\n\nAt under 17 times forward earnings, the stock's multiple has been cut in half compared with 2025 \u able Dow Jones industrials is still in solid positive territory, up 11.1%. It is past time to look for value, dividend safety, quality, and stocks with meaningful upside for the rest of 2026 and next year.\n\nWe decided to screen the Dividend Kings, looking for companies that have underperformed this year but have strong upside potential for 2027. We picked the Dividend Kings because they rate highly with growth and income investors looking for passive income. The long-running AI/data center rally is losing steam, and those stocks are expensive. Now is the time to shift to value-priced Dividend Kings that will hold up better when the inevitable correction arrives.\n\n24/7 Wall St has helped investors make money for over two decades, and our top analysts just finished ranking the definitive Top 10 Stocks To Buy Now .", "source": "Yahoo Finance", "pub_date_str": "22 Sep 2026, 06:42 PM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Fixed Income", "Portfolio Management"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Self-Storage Could Be Entering a New Growth Cycle \u2014 Baron Capital Re-Initiated Public Storage (PSA)", "full_content": "Skip to navigation Skip to main content Skip to right column Self-Storage Could Be Entering a New Growth Cycle \u2014 Baron Capital Re-Initiated Public Storage (PSA) Soumya Eswaran Tue, September 22, 2026 at 6:11 AM PDT 3 min read PSA MORN Baron Capital , an investment management company, released its Q2 2026 letter for the \"Baron Real Estate Income Fund.\" The Fund gained 12.18% (Institutional Shares) during the quarter, modestly outperforming the MSCI US REIT Index, which increased 11.84%. The letter can be downloaded here . Its long-term performance also remains strong, with Morningstar ranking it the #2 real estate fund since its December 2017 inception. The letter discusses management's current views, portfolio composition, key contributors and detractors, recent activity, and the outlook for real estate and the Fund. Management believes a multi-year recovery in real estate is beginning to emerge, despite elevated interest rates, housing affordability pressures, and AI-related disruption. Its constructive outlook is supported by attractive valuations, accelerating M&A, favorable supply-demand dynamics, healthy balance sheets, improving debt conditions, and increasing recognition of real estate as an AI beneficiary. The Fund remains positioned to benefit from improving growth, rising dividends, and potential valuation normalization. Please review the Fund's top five holdings to gain insights into their key selections for 2026.\n\nIn its second-quarter 2026 investor letter, Baron Real Estate Income Fund highlighted Public Storage (NYSE: PSA ). Public Storage (NYSE:PSA) is a leading real estate investment trust that owns and operates self-storage facilities. On September 21, 2026, Public Storage (NYSE:PSA) closed at $296.67 per share. Over the past month, Public Storage (NYSE:PSA) declined 8.06% and its shares gained 5.09% over the past 52 weeks.", "source": "Yahoo Finance", "pub_date_str": "22 Sep 2026, 06:41 PM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Circle lands $100 million from Binance to ramp up global USDC expansion", "full_content": "Binance is investing $100 million in stablecoin issuer Circle as part of a five-year deal calling for world's largest crypto exchange to promote Circle's flagship USDC on its platform.\n\nShares of Circle rose more than 1% in premarket trading Tuesday.\n\nThe agreement signals a push to expand USDC beyond its historically U.S.-focused base and compete more directly with stablecoin giant Tether in international crypto markets. Under terms of the deal, USDC gains access to Binance's large global user base in exchange for Circle paying Binance \"a monthly incentive fee\" tied to USDC balances.\n\nAligning its financial interests with USDC growth, Binance agreed to buy $100 million of Circle shares at $80.84 each, subject to a lockup of as long as two years, with some exceptions.\n\n\"Binance has built one of the largest and most dynamic platforms in the world for using digital currency, creating the internet's largest financial super app, and becoming the most widely used wallets in the world for dollar stablecoins,\" Circle CEO Jeremy Allaire said in a statement. \"We see incredible opportunities to leverage USDC to expand dollar access, support savings and investment with innovative digital asset products and reach people and businesses throughout global emerging markets.\"\n\nCircle has been trying to build a business beyond issuing USDC \u2013 launching its Arc blockchain last week and pushing into nanopayments and agentic commerce \u2013 but the company still needs USDC to drive that expansion. By putting it in front of Binance's wide base of users, Circle is betting its flagship product can gain ground internationally and help build out other parts of the business.\n\n\"Circle has earned its place as one of the most credible issuers in the world spanning USDC, Arc and the infrastructure reshaping how value moves across borders,\" Binance co-CEO Richard Teng said in a statement.", "source": "CNBC World Economy", "pub_date_str": "22 Sep 2026, 06:38 PM IST", "pub_date_relative": "27m ago", "cfa_topics": ["Corporate Issuers", "Alternative Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "What Makes Prologis (PLD) a Strong Investment?", "full_content": "Skip to navigation Skip to main content Skip to right column What Makes Prologis (PLD) a Strong Investment? Soumya Eswaran Tue, September 22, 2026 at 6     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
