<script>

    const allData = {"general": [{"title": "SpaceX earnings live updates: Here's why analysts are bullish ahead of the report", "full_content": "SpaceX is set to announce third-quarter results after the bell on Tuesday, the second earnings report for Elon Musk's defense tech conglomerate since its record IPO in June.\n\nHere's what analysts are expecting, according to LSEG consensus estimates:\n\nWhile SpaceX is best known for its reusable rockets, most of its revenue and profit in recent quarters came from the company's connectivity segment, which consists of its Starlink satellite internet service.\n\nBuzz is building about Starlink's plans to build a U.S. mobile network after SpaceX, earlier this month, announced that it's buying 800 MHz of low-band spectrum, and after the Federal Communications Commission approved a plan for the company to build out a 15,000-satellite constellation.\n\nThe moves strengthen \"Starlink Mobile's ability to compete with major carriers by enabling broader, deeper coverage,\" RBC Capital Markets analysts wrote in a note ahead of earnings. The firm has a $225 price target on SpaceX stock and the equivalent of a buy rating.\n\nIn the third quarter, analysts are expecting AI revenue of $6.47 billion, connectivity sales of $4.84 billion, and revenue in the space business of $1.41 billion, according to StreetAccount.\n\nDuring the third quarter, SpaceX also closed its $60 billion purchase of AI coding startup Cursor.\n\nCoreWeave and Nebius in October SpaceX is relatively new to the cloud computing business. Many of its competitors in the space, the so-called neoclouds, have been getting hammered on Wall Street of late on concerns that rising interest rates are going to make the costly buildout financially burdensome.", "source": "CNBC World Economy", "pub_date_str": "20 Oct 2026, 11:27 PM IST", "pub_date_relative": "5m ago"}, {"title": "Housing is flashing warning signs just as the Fed weighs more interest rate hikes", "full_content": "The Federal Reserve's inflation fight is running into a growing complication: The housing market is slumping even as broader price pressures persist.\n\nHousing data deteriorated further in September , according to separate reports Tuesday, adding to an already complicated policy landscape for the central bank as it contemplates its next move on interest rates.\n\nThings appear poised to get worse before they get better. If the Fed raises short-term rates as expected over the next several months, mortgage rates that are already at 7.43% could push even higher, putting a further damper on affordability. Higher home borrowing costs have coincided with a general rise in inflation and a housing shortage.\n\n\"The housing market is about to go into a deep sleep unless Washington can do a 180 on its policies and make the cost of a new home more affordable,\" wrote Chris Rupkey, chief economist at Fwdbonds. \"It is not winter yet but housing is going into a deep freeze.\"\n\nThe National Association of Realtors reported that pending sales, a forward-looking index that measures home sales under agreement but not completed, hit an all-time low in records that stretch back to 2001. The index slid 7.3% for the month and was off 11.3% from a year ago. The Wall Street estimate was for a decline of just 0.4%.\n\nHousing starts, another important metrics when evaluating the state of the market, also posted a decline well outside already-muted expectations Tuesday.\n\nPrivately owned housing starts fell at a seasonally adjusted annualized rate of 5.2% on the month, against expectations for a decline of just 0.4%, while building permits were off 0.2%, against the Dow Jones consensus outlook for a 2% gain, according to Commerce Department data.\n\nMoreover, single-family permits totaled just 845,000, down 4% from August and the lowest number since 2023.", "source": "CNBC Top News", "pub_date_str": "20 Oct 2026, 11:20 PM IST", "pub_date_relative": "12m ago"}, {"title": "Why is BlackBerry stock surging today?", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Oct 2026, 11:20 PM IST", "pub_date_relative": "12m ago"}, {"title": "Trump sued over 50% tariffs on Canada in latest trade challenge", "full_content": "A new lawsuit filed Tuesday challenges President Donald Trump 's invocation of a Depression-era law to impose 50% tariffs on a range of Canadian goods .\n\nTrump in July used Section 338 of the Tariff Act of 1930 to slap those steep tariffs on Canadian hockey sticks, wine, honey, wigs, and other products in response to alleged trade discrimination by Ottawa. It was the first time the 96-year-old law had ever been used to impose a tariff.\n\n\"Section 338 is a relic of the retaliation-based tariff policy\" that has been \"impliedly repealed\" by subsequent legislation, the civil complaint filed in the U.S. Court of International Trade says.\n\nThe suit was filed by Gellert Global Group, a New Jersey-based food importer that says its cheeses are covered by the tariffs. The complaint asks the court to declare the tariffs unlawful, block their enforcement, and order the Trump administration to issue refunds for duties already paid, with interest.\n\nGellert Global is represented by the Liberty Justice Center, the same legal group that dealt a major blow to Trump's trade agenda by successfully contesting his \"reciprocal\" tariffs.\n\nThe Supreme Court struck those tariffs down in February. The administration is in the process of refunding the estimated $166 billion that the federal government collected from importers through the reciprocal duties.\n\nThe Liberty Justice Center is currently engaged in two other lawsuits against what it says is Trump's misuse of laws to impose sweeping tariffs.\n\n\"This case is not about the president. It is about the presidency,\" the group's CEO Sara Albrecht said in a statement Tuesday morning announcing Gellert Global's suit. \"No president should have the power to pull a dormant statute off the shelf and use it to impose sweeping tariffs or import bans without the limits Congress required.\"", "source": "CNBC Top News", "pub_date_str": "20 Oct 2026, 11:19 PM IST", "pub_date_relative": "13m ago"}, {"title": "U.S. stocks rise as tech fluctuations offset by earnings moves, fall in oil prices", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Oct 2026, 11:19 PM IST", "pub_date_relative": "13m ago"}, {"title": "Meta\u2019s global affairs officer Joel Kaplan to leave company after 15 years", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Oct 2026, 11:18 PM IST", "pub_date_relative": "14m ago"}, {"title": "Eagle Capital CFO David Sims buys $108,632 in company stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Oct 2026, 11:16 PM IST", "pub_date_relative": "16m ago"}, {"title": "Michelin Q3 2026 slides: organic growth returns despite volume headwinds", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Oct 2026, 11:15 PM IST", "pub_date_relative": "17m ago"}, {"title": "Food importer files new lawsuit to block Trump\u2019s Canada tariffs", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Oct 2026, 11:12 PM IST", "pub_date_relative": "20m ago"}, {"title": "Avepoint stock hits 52-week high of 15.45 USD", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Oct 2026, 11:12 PM IST", "pub_date_relative": "20m ago"}, {"title": "Carrefour Q3 2026 slides: solid sales growth, guidance cut on France unrest", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Oct 2026, 11:11 PM IST", "pub_date_relative": "21m ago"}, {"title": "Calix adds features to multifamily broadband platform", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Oct 2026, 11:10 PM IST", "pub_date_relative": "22m ago"}, {"title": "Grand City Properties acquires 20% stake in LEG Immobilien", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Oct 2026, 11:10 PM IST", "pub_date_relative": "22m ago"}, {"title": "Investors\u2019 search for safety has made toothpaste stocks more expensive than tech", "full_content": "Wall Street is fleeing tech for toothpaste and shampoo. Even those stocks are getting expensive.", "source": "MarketWatch Top Stories", "pub_date_str": "20 Oct 2026, 11:08 PM IST", "pub_date_relative": "24m ago"}, {"title": "Bought a \u20b950 lakh LIC policy on \u20b94.81 lakh income? Why ITAT rejected the woman\u2019s claim and upheld the tax addition", "full_content": "A \u20b9 50 lakh investment in a life insurance policy was treated as unexplained investment by the Income Tax Department after a taxpayer reported annual income of \u20b9 4.81 lakh. The taxpayer argued that the money belonged to her late husband\u2019s Hindu Undivided Family (HUF) and came from agricultural income earned through an orchard.\n\nHowever, the Income Tax Appellate Tribunal (ITAT), Chandigarh Bench, rejected her explanation, holding that she had failed to establish the source and movement of the funds through documentary evidence.\n\nIn its order dated 25 February 2026 in Pratibha Singh vs ACIT, Circle Shimla (ITA No. 860/Chd/2025), the tribunal upheld the addition of \u20b9 50 lakh under Section 69 of the Income Tax Act, 1961, as unexplained investment. The appeal related to assessment year 2009-10.\n\nThe dispute centred on an alleged arrangement under which the Virbhadra Singh HUF owned an orchard of around 100 bighas in Himachal Pradesh and engaged LIC agent Anand Chauhan to handle funds linked to its agricultural income.\n\nAccording to the tribunal\u2019s order, \u20b9 5 lakh each was received by Chauhan from Universal Apple Associated on 7 June and 13 June 2008. The taxpayer claimed that a memorandum of understanding (MoU) between the HUF and Chauhan had been executed on 15 June 2008. Another \u20b9 10 lakh was invested in an LIC policy through the agent on 19 June 2008. The total LIC investment in the taxpayer\u2019s name during financial year 2008-09 was \u20b9 50 lakh.\n\nThe Assessing Officer questioned why money had moved before the alleged agreement was executed. The tribunal also noted that neither the original MoU nor a copy had been produced during the assessment proceedings, before the Commissioner of Income Tax (Appeals) or before the tribunal.\n\nThe absence of the agreement, along with the unexplained transaction sequence, weakened the taxpayer\u2019s claim that the money belonged to the HUF.\n\nSingh argued that the HUF had sufficient agricultural income to fund the investment.", "source": "LiveMint Money", "pub_date_str": "20 Oct 2026, 10:59 PM IST", "pub_date_relative": "33m ago"}, {"title": "If Elon Musk gifts SpaceX stock through Trump Accounts, it will come with a catch", "full_content": "Elon Musk said on Monday that he will give every kid in America a share of SpaceX next year. He appeared to suggest the gift could land in Trump Accounts \u2014 thanking Brad Gerstner, an architect of the program, for \"helping enable this\" in a comment on X .\n\nBut if the shares are distributed through the new investment accounts for children, the gift could come with significant strings attached.\n\nMusk's announcement comes weeks after the U.S. Department of the Treasury rolled out guidelines for stock donations to Trump Accounts, also known as 530A accounts. Those include restrictions on selling donated stock: Children who receive it generally cannot sell for five years, even if the company runs into financial trouble.\n\nTreasury's temporary regulations, subject to revision after public comment, aim to encourage stock gifts. But they also give donors unusual influence over children's investments, according to lawyers and philanthropic experts who spoke with CNBC.\n\nIn the broader world of charitable giving, donors can typically express preferences about how their gifts are managed, but the receiving organization or trustee retains final authority, said Carolyn Schenck, an attorney and former national fraud counsel at the IRS.\n\nUnder the new Trump Account rules, however, it's \"the donor that's dictating the terms of the gift,\" she said.\n\nRepresentatives for Musk, Gerstner and the Treasury Department did not respond to CNBC's requests for comment on the proposed gift.\n\nAccording to the Treasury, about 70 million Trump Accounts have been created, including more than 60 million through a recent auto-enrollment effort . Trump Accounts are available to all children with U.S. citizenship under age 18 with valid Social Security numbers.", "source": "CNBC Top News", "pub_date_str": "20 Oct 2026, 10:59 PM IST", "pub_date_relative": "33m ago"}, {"title": "Dow jumps 500 points as solid earnings, falling crude oil stir rebound: Live updates", "full_content": "The Dow Jones Industrial Average rose on Tuesday as a number of upbeat earnings reports and a drop in oil prices overshadowed recent pressure seen among artificial intelligence-related stocks.\n\nThe blue-chip index gained 514 points, or 1%, while the S&P 500 added 0.4%. The Nasdaq Composite traded up 0.2%.\n\nShares of industrial and safety products producer 3M offered a boost to the Dow, jumping more than 5% following better-than-expected earnings results and a full-year guidance raise . Shares of aerospace and defense company Northrop Grumman also advanced more than 5% after it posted an earnings beat.\n\nMeanwhile, oil prices pulled back from earlier gains, helping investor sentiment. U.S. West Texas Intermediate crude futures were last down less than 1% at around $103 per barrel, while Brent crude futures fell about 1% to roughly $108 a barrel. The moves in oil, which added to the declines in Treasury yields , come as traders continued to monitor developments in the Middle East.\n\nThe market has been weighed down as of late by worries about the sustainability of the AI trade amid debt and demand concerns. In fact, sentiment in tech took a hit earlier in the day after Korean AI firm Elice tumbled more than 30% overnight in its public market debut. Asia-Pacific markets declined Tuesday, after U.S. stocks rose overnight, leading to declines in the South Korean market.\n\nHowever, AI-related stocks staged a bit of a comeback as the session went on. Micron Technology , Sandisk and Advanced Micro Devices all rose around 1%. Intel climbed more than 1%, while Seagate Technology , was up more than 2%. CoreWeave gained more than 2%.\n\nThe S&P 500 finished in positive territory on Monday, while the Nasdaq Composite advanced more than 1%.", "source": "CNBC Top News", "pub_date_str": "20 Oct 2026, 10:54 PM IST", "pub_date_relative": "38m ago"}, {"title": "Braze stock surges over 50% after Salesforce announces $5.66 billion acquisition", "full_content": "Shares of Braze surged in Tuesday\u2019s trade on October 20, rallying 52% to a 22-month high of $45.59 apiece on the Nasdaq after Salesforce (CRM) agreed to acquire the customer-engagement software company, handing existing investors a major windfall.\n\nFor Braze, the strategic attraction extends beyond the purchase price. Joining Salesforce Inc. could give the technology much broader distribution and greater resources for product development.\n\nFollowing the meteoric rally, Braze stock is trading at roughly three times its late-February price.\n\nSalesforce said on Tuesday that it would acquire Braze in a deal valued at about $5.66 billion, valuing Braze shares at $47.50 apiece and representing a 58.1% premium over the stock\u2019s previous closing price. The company expects the all-cash transaction to close in fiscal 2028, subject to the necessary approvals.\n\nNew York-based Braze gathers customer data in real time and uses artificial intelligence (AI) to generate personalized messages across different channels and communication platforms, including mobile apps, websites, email, and text messaging.\n\nThe company serves around 2,770 customers, including Canva, Equinox, Instacart, and Venmo, according to the statement.\n\nThe deal marks Salesforce\u2019s latest move to accelerate its AI transition as investors worry that the rapid adoption of the technology could erode demand for traditional software. Salesforce will use Braze\u2019s technology to bolster several of its products, particularly those focused on marketing and customer communication through Agentforce, its flagship AI platform.\n\nThe deal also reinforces Salesforce\u2019s return to a strategy of serial software acquisitions.", "source": "LiveMint Markets", "pub_date_str": "20 Oct 2026, 10:51 PM IST", "pub_date_relative": "41m ago"}, {"title": "My partner of 17 years left me his $1 million home. His children say I influenced him to do so. Should I share my inheritance?", "full_content": "\u201cI never paid rent, although I put about $45,000 toward a new kitchen and a roof.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "20 Oct 2026, 10:45 PM IST", "pub_date_relative": "47m ago"}, {"title": "\u2018I don\u2019t feel sorry for myself\u2019: I\u2019m 64 and will be renting for the rest of my life \u2014 but here\u2019s why I\u2019m still hopeful", "full_content": "\u201cIll-timed circumstances can change our financial future in unexpected ways.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "20 Oct 2026, 10:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "It\u2019s not just California\u2019s billionaire tax. Wealth is on the ballot in the midterm elections.", "full_content": "Several states are dealing with ballot measures tied to taxing the rich \u2014 and there may be even more initiatives on this front in 2028.", "source": "MarketWatch Top Stories", "pub_date_str": "20 Oct 2026, 10:25 PM IST", "pub_date_relative": "1h ago"}, {"title": "What Amazon must do to get its stumbling stock back to record highs and beyond", "full_content": "The performance of Amazon Web Services is the key.", "source": "CNBC World Economy", "pub_date_str": "20 Oct 2026, 10:19 PM IST", "pub_date_relative": "1h ago"}, {"title": "Stocks making the biggest moves midday: Hasbro, Northrop Grumman, Equifax, General Motors & more", "full_content": "These are the stocks posting the largest moves midday.", "source": "CNBC Finance", "pub_date_str": "20 Oct 2026, 10:15 PM IST", "pub_date_relative": "1h ago"}, {"title": "China slams US ban on DeepSeek AI over security concerns - Fox News", "full_content": "China slams US ban on DeepSeek AI over security concerns Fox News US banning Chinese AI DeepSeek from government agency IT systems Reuters US bans use of China\u2019s DeepSeek AI tools by government agencies The Guardian DHS Orders DeepSeek Technology Removed From Federal Civilian IT Systems WSJ DeepSeek deep-sixed at all US federal civilian agencies The Register", "source": "Google News Business", "pub_date_str": "20 Oct 2026, 10:14 PM IST", "pub_date_relative": "1h ago"}, {"title": "Wall Street gains ground on healthcare stocks rally, oil retreat - Reuters", "full_content": "Wall Street gains ground on healthcare stocks rally, oil retreat Reuters Dow jumps 500 points as solid earnings, falling crude oil stir rebound: Live updates CNBC Stock Market Today: Dow Jumps 500 Points; Investors Await SpaceX Earnings \u2014 Live Updates WSJ US stocks rise after companies deliver strong profits and oil prices retreat AP News Stock Market Today: Dow Surges, Oil Eases On U.S.-Iran Hopes; This Pharma Stock Clears Entry (Live Coverage) Investor's Business Daily", "source": "Google News Business", "pub_date_str": "20 Oct 2026, 10:09 PM IST", "pub_date_relative": "1h ago"}, {"title": "CBDT notifies Form 173A for government securities: New tax exemption rules for eligible foreign investors", "full_content": "The Central Board of Direct Taxes (CBDT) has made it mandatory for eligible foreign investors and the Bank for International Settlements (BIS) to submit Form 173A to claim income-tax exemptions on interest and capital gains from government securities. The requirement was introduced through the Income-tax (Seventh Amendment) Rules, 2026, notified on 19 October.\n\nThe new form lays down the information that eligible investors must furnish to claim exemptions under entries 13D and 13E of Schedule IV of the Income-tax Act, 2025. The amended rules came into force upon publication in the Official Gazette. The exemptions apply to qualifying income from government securities, subject to the conditions prescribed under the Act.\n\nThe change does not introduce a tax exemption for all government bond investors. It sets out the reporting requirements for investors seeking specific exemptions under the law.\n\nThe provisions cover specified foreign institutional investors (FIIs) under entry 13D and the Bank for International Settlements under entry 13E of Schedule IV. The exemptions relate to eligible interest income and capital gains arising from the sale, exchange or transfer of government securities .\n\nFor ordinary retail investors who buy government bonds or Treasury Bills, the new form does not create an additional tax benefit. Its requirements concern entities eligible for the specified exemptions.\n\nForm 173A has two parts, covering basic information about the claimant and details of income earned from government securities.\n\nThe first part requires the investor's name, country of residence, address, Permanent Account Number (PAN), tax year, email address and contact number. It also seeks the tax identification number issued by the investor's country of residence and the Securities and Exchange Board of India registration number as an FPI or FII, where applicable.", "source": "LiveMint Money", "pub_date_str": "20 Oct 2026, 10:08 PM IST", "pub_date_relative": "1h ago"}, {"title": "Stocks making the biggest moves premarket: RTX, General Motors, Northrop Grumman, Steel Dynamics & more", "full_content": "These are the stocks posting the largest moves in early trading.", "source": "CNBC Finance", "pub_date_str": "20 Oct 2026, 10:05 PM IST", "pub_date_relative": "1h ago"}, {"title": "What options traders expect from SpaceX earnings after the bell", "full_content": "The company delivered four astronauts to the International Space Station in record time, expanded its mobile network spectrum, is reportedly eyeing a $40 billion debt deal to buy Nvidia chips, and CEO Elon Musk said he plans to give shares to every kid in America next year.\n\nTraders think all that means more gains for the stock after it reports earnings after the bell Tuesday.\n\nOptions market-makers are pricing about a 6% swing for SpaceX after the event, according to Cboe LiveVol data. That's less than half the 13% it erased after its inaugural report in August, a selloff that turned out to be the low for the shares, which rallied 60% the following two months before reversing before dropping as much as 19% the past two weeks.\n\nWhile there are about as many open call contracts as puts on the stock, daily trading volume has leaned toward calls the past week, Barchart data shows.\n\nAmong the 1.1 million contracts traded Monday \u2013 20% higher volume than the 30-day average \u2013 665,000 were calls, with more bought than sold, according to Cboe LiveVol. Traders also bought more calls than puts, and sold more puts than they bought, the data show, decidedly bullish flow as the space giant heads into its second earnings.\n\nThe most popular call contract for Friday expiry was the 170-strike, which needs about a 14% rally, according to SpotGamma data. There was also notable buying in the 190-strike call for month-end, a 40-cent contract that needs SpaceX to rally 29% to break even.\n\nSpaceX, YTD For that to happen, SpaceX will have to rally through two more share lockup periods: a scheduled release two days after earnings, as well as another on October 26 that together will amount to over 1.6 billion eligible shares for sale. So far that hasn't been a problem for the stock, as releases on Sep. 9, 10, and 24 had no discernible effect on the share price.\n\nImplied volatility is much lower in SpaceX going into this report compared to last quarter, as reflected in the implied move.", "source": "CNBC Top News", "pub_date_str": "20 Oct 2026, 10:04 PM IST", "pub_date_relative": "1h ago"}, {"title": "US Eyes India's Reliance To Refine Venezuelan Oil", "full_content": "Describing India as \"a refining superpower\", Rubio said the country has the capacity to handle Venezuelan crude, which is heavy and waxy and difficult to process.", "source": "NDTV Profit", "pub_date_str": "20 Oct 2026, 10:01 PM IST", "pub_date_relative": "1h ago"}, {"title": "Brent Swings As Traders Parse Reports On Status Of US-Iran Talks", "full_content": "Crude prices have jumped in recent sessions as hostilities flare across the Middle East, with Iran stepping up attacks on tankers in the Strait of Hormuz.", "source": "NDTV Profit", "pub_date_str": "20 Oct 2026, 09:57 PM IST", "pub_date_relative": "1h ago"}, {"title": "\u2018I\u2019m naturally skeptical\u2019: I receive 10 calls a day offering me $15,000 loans at 8% interest. Is this a scam?", "full_content": "\u201cThey insist that the details will be provided after they have carried out a soft credit check.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "20 Oct 2026, 09:55 PM IST", "pub_date_relative": "1h ago"}, {"title": "Oil prices fall as traders hope for diplomatic progress in Middle East", "full_content": "Crude oil prices fell Tuesday as traders hoped for diplomatic progress between the U.S. and Iran, though attacks on tankers and strikes against Saudi Arabia have escalated recently.\n\nU.S. West Texas Intermediate futures for November were down 0.9% at $102.75 per barrel, pulling back dramatically from a session high of $110.48. The November contract expires on Tuesday. The WTI December contract was down 1% at $97.50 per barrel.\n\nGlobal benchmark Brent crude futures for December delivery fell 1% to $108.31 per barrel, well off a session high of $111.99.\n\nCrude oil futures Developments in the Middle East remain in focus, with attacks on commercial ships transiting the Strait of Hormuz escalating in recent weeks. At least 18 vessels have come under fire over the past two weeks, according to ship tracker Kpler.\n\nIran's Revolutionary Guard Corps said Tuesday that two \"non-compliant\" oil tankers had been set ablaze in the strait after hitting mines laid by its naval unit, Iranian state-affiliated news agency Tasnim reported.\n\nMeanwhile, Foreign Ministry Spokesperson Esmaeil Baqaei said at a weekly news conference on Tuesday that Tehran would respond to any American strike \"in equal measure, if not more forcefully,\" according to Tasnim.\n\nU.S. President Donald Trump said earlier this month that American forces will not attack Iran before the midterm elections on Nov. 3.\n\nTamas Varga, analyst at PVM Oil Associates, told CNBC in an email on Tuesday that front-end WTI strength ahead of the contract expiry is a sign of tightness in the global crude oil market.", "source": "CNBC Top News", "pub_date_str": "20 Oct 2026, 09:49 PM IST", "pub_date_relative": "1h ago"}, {"title": "Ahead of massive IPOs, AI companies are sketching plans to share their wealth - AP News", "full_content": "Ahead of massive IPOs, AI companies are sketching plans to share their wealth AP News AI takes on great experiment in self-rule Axios What to Know About the Obscure Trust Looming Over Anthropic\u2019s IPO WSJ Investing in the public benefit Anthropic SpaceX, Anthropic plan to share wealth with the public amid concern AI could trigger job losses Los Angeles Times", "source": "Google News Business", "pub_date_str": "20 Oct 2026, 09:46 PM IST", "pub_date_relative": "1h ago"}, {"title": "Sunburn Festival 2026 Full Lineup: The Chainsmokers, DJ Snake, Jason Derulo And More Set To Light Up Mumbai", "full_content": "Sunburn Festival 2026 will take place on Dec. 18 and 19 in Mumbai, with The Chainsmokers, DJ Snake, Jason Derulo, Sebastian Ingrosso, Nucleya, Sofi Tukker and more set to perform.", "source": "NDTV Profit", "pub_date_str": "20 Oct 2026, 09:44 PM IST", "pub_date_relative": "1h ago"}, {"title": "Novo's next-generation obesity drug shows 25% weight loss in women in late-stage analysis", "full_content": "Novo on Tuesday said its next-generation obesity drug, CagriSema, showed 25% weight loss on average among adult women in a new analysis conducted after a late-stage trial.\n\nThe Danish company said further work is needed to confirm the hypotheses of two post-study analyses. Still, the results are the latest evidence that the experimental injection can improve upon the weight loss and other benefits offered by Novo's GLP-1 drug semaglutide, the active ingredient in its blockbuster obesity shot Wegovy and diabetes counterpart Ozempic.\n\nCagriSema, a combination of semaglutide and another drug called cagrilintide that targets the amylin pathway, is expected to launch early next year. Obesity drug leaders Novo and Eli Lilly have built new treatments around amylin , which involves a hormone released in the pancreas alongside insulin that helps regulate hunger and fullness, hoping it will give them a new revenue stream beyond existing GLP-1s.\n\nIn an analysis of roughly 2,300 women with obesity or who are overweight, CagriSema was associated with 25% weight loss on average at 68 weeks compared with 3% with placebo. The results are based on an ideal scenario in which all patients stayed on treatment without interruptions.\n\nA second analysis of around 1,900 women grouped by their menopausal status found that weight loss reached 26.7%, 24.8% and 23.1% in premenopausal, perimenopausal and postmenopausal women, respectively, at 68 weeks, if all patients remained on the drug.", "source": "CNBC Top News", "pub_date_str": "20 Oct 2026, 09:41 PM IST", "pub_date_relative": "1h ago"}, {"title": "Gilt market catches up with peers as investor worries over Budget ease", "full_content": "UK bonds were initially hard hit after onset of Iran war but have since outperformed as traders\u2019 concerns shift to France", "source": "FT Markets", "pub_date_str": "20 Oct 2026, 09:40 PM IST", "pub_date_relative": "1h ago"}, {"title": "Trade Setup For Oct 21: Nifty Breaking Below 22,800 Support Can Trigger Another Bear Attack, Analysts Warn", "full_content": "Against this backdrop, traders are likely to monitor global cues alongside the Nifty's ability to defend its immediate support and reclaim key resistance levels.", "source": "NDTV Profit", "pub_date_str": "20 Oct 2026, 09:38 PM IST", "pub_date_relative": "1h ago"}, {"title": "Rishabh Pant's World Cup Hopes Under Cloud; Ravi Shastri Reveals One Thing He Needs To Do", "full_content": "With KL Rahul, Ishan Kishan and Sanju Samson competing for wicketkeeper-batter roles, Pant faces a tough challenge to regain his place in India's ODI plans.", "source": "NDTV Profit", "pub_date_str": "20 Oct 2026, 09:35 PM IST", "pub_date_relative": "1h ago"}, {"title": "Microsoft Expands Sovereign Cloud Capabilities, Adds EU Data Oversight", "full_content": "Microsoft has expanded its Sovereign Cloud portfolio, introducing enhanced data controls, AI security and connected or offline operations to help organisations meet regulatory requirements while maintaining flexibility and operational resilience.", "source": "NDTV Profit", "pub_date_str": "20 Oct 2026, 09:33 PM IST", "pub_date_relative": "1h ago"}, {"title": "Exclusive: Joel Kaplan leaving Meta after 15 years as policy chief - Axios", "full_content": "Exclusive: Joel Kaplan leaving Meta after 15 years as policy chief Axios Meta's power broker Joel Kaplan is leaving after helping repair ties with Trump Business Insider Meta policy chief Joel Kaplan to leave company in 2027 Quartz Meta's global affairs officer Joel Kaplan to leave company after 15 years Reuters Meta\u2019s Chief Global Affairs Officer Joel Kaplan Departing Bloomberg.com", "source": "Google News Business", "pub_date_str": "20 Oct 2026, 09:33 PM IST", "pub_date_relative": "1h ago"}, {"title": "Meta Shares Plunge Up To 3.5% Ahead Of Results. What Traders Are Looking At", "full_content": "Meta shares have fallen for four straight sessions ahead of Q3 results, with investors weighing strong advertising growth against rising AI spending, margin pressures and the outlook for 2027 capital expenditure.", "source": "NDTV Profit", "pub_date_str": "20 Oct 2026, 09:31 PM IST", "pub_date_relative": "2h ago"}, {"title": "Here's what to expect when Netflix reports earnings after the bell", "full_content": "Netflix is set to report quarterly earnings after market close on Tuesday as the media industry faces consolidation , spinouts and intensified competition.\n\nHere's how Netflix is expected to perform for the period ended Sept. 30, according to estimates from analysts polled by LSEG:\n\nLast week, Netflix said it was laying off about 6% of employees, or roughly 1,000 workers, and that Chief Content Officer Bela Bajaria was departing from that role.\n\nThe changes come as Netflix faces stagnating viewership and growing competition from the likes of YouTube. At the same time that streaming subscriber additions have slowed in recent years, advertising has once again become a major revenue driver for media companies.\n\nWith the help of its cheaper, ad-supported tier, Netflix continues to post solid profits and remains the biggest player in the streaming realm.\n\nOn Tuesday, Netflix announced new features for advertisers that it says will help better connect brands to the right audiences and measure the impact of their ads.\n\nHowever, the company's stock has fallen about 40% in the past year, and executives have been publicly exploring new avenues for growth.", "source": "CNBC Top News", "pub_date_str": "20 Oct 2026, 09:30 PM IST", "pub_date_relative": "2h ago"}, {"title": "Stuttgart Vs Atletico Madrid Live Streaming: Likely Lineups; How To Watch Champions League Match?", "full_content": "Stuttgart will aim to make home advantage count against an Atletico Madrid side that has been in impressive form across competitions. Here's all you need to know about the Champions League fixture, including the head-to-head record and live-streaming options.", "source": "NDTV Profit", "pub_date_str": "20 Oct 2026, 09:30 PM IST", "pub_date_relative": "2h ago"}, {"title": "'Risk appetite' for stocks is the worst since March, Goldman Sachs says", "full_content": "Recent bearish sentiment may prove a contrarian signal to add back to equities.", "source": "CNBC Top News", "pub_date_str": "20 Oct 2026, 09:28 PM IST", "pub_date_relative": "2h ago"}, {"title": "Looking for AI stocks that are still cheap? Consider these two under-the-radar picks.", "full_content": "Simon King of Saturna Capital names two stocks tied to base metals, for investors who want to look beyond the beaten path for AI-related trades.", "source": "MarketWatch Top Stories", "pub_date_str": "20 Oct 2026, 09:28 PM IST", "pub_date_relative": "2h ago"}, {"title": "It\u2019s no secret what the best financial advice for retirement is \u2014 but most people ignore it anyway", "full_content": "Research can prove a lot of facts, but that doesn\u2019t mean it changes how people act.", "source": "MarketWatch Top Stories", "pub_date_str": "20 Oct 2026, 09:24 PM IST", "pub_date_relative": "2h ago"}, {"title": "EXCLUSIVE: ByteDance, Alibaba, Tencent place over $35 billion worth of Nvidia chip orders - Reuters", "full_content": "EXCLUSIVE: ByteDance, Alibaba, Tencent place over $35 billion worth of Nvidia chip orders Reuters ByteDance, Alibaba and Tencent ordered over $35 billion of Nvidia chips at list price Quartz Not Even Rumors of a Big China Chip Purchase Can Lift Nvidia Stock Barron's How DeepSeek Is Shaping Huawei\u2019s AI Chips in a Growing Challenge to Nvidia The Information China\u2019s tech giants drop $35 billion on export-compliant Nvidia RTX Pro 5500 workstation GPU orders to power AI ambitions, according to reports \u2014 ByteDance, Alibaba and Tencent order 3 million cards despite warnings that only 10% of orders are fulfillable Tom's Hardware", "source": "Google News Business", "pub_date_str": "20 Oct 2026, 09:21 PM IST", "pub_date_relative": "2h ago"}, {"title": "Data center stocks remain under pressure after Korea IPO plunges 30%", "full_content": "Data center stocks are being squeezed on Tuesday following a lackluster initial public offering overnight from a South Korean cloud company that has been compared to U.S. neocloud CoreWeave.\n\nShares of Elice dropped 30% during their market debut overnight, as investors grow increasingly wary of artificial intelligence-dedicated computing power providers amid concerns about overcapacity.\n\nThe bearish sentiment spilled into U.S. tech equities before some names clambered back into the green. CoreWeave shares are up 1.6% after dropping 4% just after market open Tuesday; Nebius shed about 1% while Iren was down about 4% in late morning trading.\n\nHSBC said in a Monday note that the troubles for the heavily levered CoreWeave are not going away.\n\n\"Debt market woes and moderating LLM revenues are exacerbating structural concerns for neoclouds ,\" HSBC analyst Abhishek Shukla wrote. Shukla has a reduce rating on CoreWeave with a price target of $39, implying 36.5% downside.\n\nElice's IPO was small, having raised just $150 million, according to Reuters . Its market cap also equates to roughly $1.3 billion. The company provides a range of AI-related services, including cloud computing equipment, training libraries and application interfaces for businesses.\n\nDespite its size, investors are likely looking at it as a a signal of investor sentiment toward the AI build-out.\n\nTrouble for neoclouds, which some investors see as the weakest link in the emerging AI value chain, started earlier this month with less-than-stellar revenues reported by the private AI algorithm companies and pressure from higher interest rates.", "source": "CNBC Top News", "pub_date_str": "20 Oct 2026, 09:15 PM IST", "pub_date_relative": "2h ago"}, {"title": "General Motors beats Wall Street's Q3 earnings expectations, narrows full-year guidance", "full_content": "DETROIT \u2014 General Motors narrowed its 2026 earnings guidance and raised its free cash flow expectations after beating Wall Street's third-quarter expectations.\n\nThe Detroit automaker also announced a new multiyear stock buyback of $20 billion after GM completed a $6 billion share repurchase program that was announced in January. GM did not disclose a specific time to complete the program.\n\nDespite the positive news, GM stock was off roughly 5% during trading Tuesday as the company's outlook missed Wall Street's expectations.\n\nWall Street analysts were mixed before the report on whether GM would raise its guidance Tuesday amid concerns of slowing sales and rising commodity costs. Analysts' expectations included a midpoint of $13.41 per share for the year compared with GM's new $13.25 per share midpoint, according to LSEG.\n\nSeveral analysts in investor notes Tuesday said GM's third-quarter results were solid, but raised concerns about whether higher costs and pressures on vehicle pricing would limit earnings growth next year.\n\nHere's how GM performed in the third quarter, compared with average estimates compiled by LSEG:\n\nGM's new guidance includes adjusted earnings before interest and taxes of between $14.5 billion and $15.5 billion, or $12.75 to $13.75 adjusted earnings per share, and adjusted automotive free cash flow of between $11.5 billion and $12.5 billion.\n\nThat compares with its raised guidance from July that included adjusted EBIT of between $14 billion and $16 billion, or $12 to $14 adjusted EPS, and adjusted automotive free cash flow of $9.5 billion to $11.5 billion.", "source": "CNBC Top News", "pub_date_str": "20 Oct 2026, 09:13 PM IST", "pub_date_relative": "2h ago"}, {"title": "OpenAI Upgrades ChatGPT Slides With Live Teamwork, Comments And PowerPoint Export", "full_content": "OpenAI has upgraded ChatGPT Slides with real-time collaboration, comments and direct on-slide editing. Teams can now tag ChatGPT, or their Dots agent, to turn feedback into changes, then export decks to PowerPoint or Google Slides.", "source": "NDTV Profit", "pub_date_str": "20 Oct 2026, 09:10 PM IST", "pub_date_relative": "2h ago"}], "cfa": [{"title": "SpaceX earnings live updates: Here's why analysts are bullish ahead of the report", "full_content": "SpaceX is set to announce third-quarter results after the bell on Tuesday, the second earnings report for Elon Musk's defense tech conglomerate since its record IPO in June.\n\nHere's what analysts are expecting, according to LSEG consensus estimates:\n\nWhile SpaceX is best known for its reusable rockets, most of its revenue and profit in recent quarters came from the company's connectivity segment, which consists of its Starlink satellite internet service.\n\nBuzz is building about Starlink's plans to build a U.S. mobile network after SpaceX, earlier this month, announced that it's buying 800 MHz of low-band spectrum, and after the Federal Communications Commission approved a plan for the company to build out a 15,000-satellite constellation.\n\nThe moves strengthen \"Starlink Mobile's ability to compete with major carriers by enabling broader, deeper coverage,\" RBC Capital Markets analysts wrote in a note ahead of earnings. The firm has a $225 price target on SpaceX stock and the equivalent of a buy rating.\n\nIn the third quarter, analysts are expecting AI revenue of $6.47 billion, connectivity sales of $4.84 billion, and revenue in the space business of $1.41 billion, according to StreetAccount.\n\nDuring the third quarter, SpaceX also closed its $60 billion purchase of AI coding startup Cursor.\n\nCoreWeave and Nebius in October SpaceX is relatively new to the cloud computing business. Many of its competitors in the space, the so-called neoclouds, have been getting hammered on Wall Street of late on concerns that rising interest rates are going to make the costly buildout financially burdensome.", "source": "CNBC World Economy", "pub_date_str": "20 Oct 2026, 11:27 PM IST", "pub_date_relative": "5m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Housing is flashing warning signs just as the Fed weighs more interest rate hikes", "full_content": "The Federal Reserve's inflation fight is running into a growing complication: The housing market is slumping even as broader price pressures persist.\n\nHousing data deteriorated further in September , according to separate reports Tuesday, adding to an already complicated policy landscape for the central bank as it contemplates its next move on interest rates.\n\nThings appear poised to get worse before they get better. If the Fed raises short-term rates as expected over the next several months, mortgage rates that are already at 7.43% could push even higher, putting a further damper on affordability. Higher home borrowing costs have coincided with a general rise in inflation and a housing shortage.\n\n\"The housing market is about to go into a deep sleep unless Washington can do a 180 on its policies and make the cost of a new home more affordable,\" wrote Chris Rupkey, chief economist at Fwdbonds. \"It is not winter yet but housing is going into a deep freeze.\"\n\nThe National Association of Realtors reported that pending sales, a forward-looking index that measures home sales under agreement but not completed, hit an all-time low in records that stretch back to 2001. The index slid 7.3% for the month and was off 11.3% from a year ago. The Wall Street estimate was for a decline of just 0.4%.\n\nHousing starts, another important metrics when evaluating the state of the market, also posted a decline well outside already-muted expectations Tuesday.\n\nPrivately owned housing starts fell at a seasonally adjusted annualized rate of 5.2% on the month, against expectations for a decline of just 0.4%, while building permits were off 0.2%, against the Dow Jones consensus outlook for a 2% gain, according to Commerce Department data.\n\nMoreover, single-family permits totaled just 845,000, down 4% from August and the lowest number since 2023.", "source": "CNBC Top News", "pub_date_str": "20 Oct 2026, 11:20 PM IST", "pub_date_relative": "12m ago", "cfa_topics": ["Economics", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Trump sued over 50% tariffs on Canada in latest trade challenge", "full_content": "A new lawsuit filed Tuesday challenges President Donald Trump 's invocation of a Depression-era law to impose 50% tariffs on a range of Canadian goods .\n\nTrump in July used Section 338 of the Tariff Act of 1930 to slap those steep tariffs on Canadian hockey sticks, wine, honey, wigs, and other products in response to alleged trade discrimination by Ottawa. It was the first time the 96-year-old law had ever been used to impose a tariff.\n\n\"Section 338 is a relic of the retaliation-based tariff policy\" that has been \"impliedly repealed\" by subsequent legislation, the civil complaint filed in the U.S. Court of International Trade says.\n\nThe suit was filed by Gellert Global Group, a New Jersey-based food importer that says its cheeses are covered by the tariffs. The complaint asks the court to declare the tariffs unlawful, block their enforcement, and order the Trump administration to issue refunds for duties already paid, with interest.\n\nGellert Global is represented by the Liberty Justice Center, the same legal group that dealt a major blow to Trump's trade agenda by successfully contesting his \"reciprocal\" tariffs.\n\nThe Supreme Court struck those tariffs down in February. The administration is in the process of refunding the estimated $166 billion that the federal government collected from importers through the reciprocal duties.\n\nThe Liberty Justice Center is currently engaged in two other lawsuits against what it says is Trump's misuse of laws to impose sweeping tariffs.\n\n\"This case is not about the president. It is about the presidency,\" the group's CEO Sara Albrecht said in a statement Tuesday morning announcing Gellert Global's suit. \"No president should have the power to pull a dormant statute off the shelf and use it to impose sweeping tariffs or import bans without the limits Congress required.\"", "source": "CNBC Top News", "pub_date_str": "20 Oct 2026, 11:19 PM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "U.S. stocks rise as tech fluctuations offset by earnings moves, fall in oil prices", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Oct 2026, 11:19 PM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "If Elon Musk gifts SpaceX stock through Trump Accounts, it will come with a catch", "full_content": "Elon Musk said on Monday that he will give every kid in America a share of SpaceX next year. He appeared to suggest the gift could land in Trump Accounts \u2014 thanking Brad Gerstner, an architect of the program, for \"helping enable this\" in a comment on X .\n\nBut if the shares are distributed through the new investment accounts for children, the gift could come with significant strings attached.\n\nMusk's announcement comes weeks after the U.S. Department of the Treasury rolled out guidelines for stock donations to Trump Accounts, also known as 530A accounts. Those include restrictions on selling donated stock: Children who receive it generally cannot sell for five years, even if the company runs into financial trouble.\n\nTreasury's temporary regulations, subject to revision after public comment, aim to encourage stock gifts. But they also give donors unusual influence over children's investments, according to lawyers and philanthropic experts who spoke with CNBC.\n\nIn the broader world of charitable giving, donors can typically express preferences about how their gifts are managed, but the receiving organization or trustee retains final authority, said Carolyn Schenck, an attorney and former national fraud counsel at the IRS.\n\nUnder the new Trump Account rules, however, it's \"the donor that's dictating the terms of the gift,\" she said.\n\nRepresentatives for Musk, Gerstner and the Treasury Department did not respond to CNBC's requests for comment on the proposed gift.\n\nAccording to the Treasury, about 70 million Trump Accounts have been created, including more than 60 million through a recent auto-enrollment effort . Trump Accounts are available to all children with U.S. citizenship under age 18 with valid Social Security numbers.", "source": "CNBC Top News", "pub_date_str": "20 Oct 2026, 10:59 PM IST", "pub_date_relative": "33m ago", "cfa_topics": ["Fixed Income", "Ethical & Professional Standards"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Dow jumps 500 points as solid earnings, falling crude oil stir rebound: Live updates", "full_content": "The Dow Jones Industrial Average rose on Tuesday as a number of upbeat earnings reports and a drop in oil prices overshadowed recent pressure seen among artificial intelligence-related stocks.\n\nThe blue-chip index gained 514 points, or 1%, while the S&P 500 added 0.4%. The Nasdaq Composite traded up 0.2%.\n\nShares of industrial and safety products producer 3M offered a boost to the Dow, jumping more than 5% following better-than-expected earnings results and a full-year guidance raise . Shares of aerospace and defense company Northrop Grumman also advanced more than 5% after it posted an earnings beat.\n\nMeanwhile, oil prices pulled back from earlier gains, helping investor sentiment. U.S. West Texas Intermediate crude futures were last down less than 1% at around $103 per barrel, while Brent crude futures fell about 1% to roughly $108 a barrel. The moves in oil, which added to the declines in Treasury yields , come as traders continued to monitor developments in the Middle East.\n\nThe market has been weighed down as of late by worries about the sustainability of the AI trade amid debt and demand concerns. In fact, sentiment in tech took a hit earlier in the day after Korean AI firm Elice tumbled more than 30% overnight in its public market debut. Asia-Pacific markets declined Tuesday, after U.S. stocks rose overnight, leading to declines in the South Korean market.\n\nHowever, AI-related stocks staged a bit of a comeback as the session went on. Micron Technology , Sandisk and Advanced Micro Devices all rose around 1%. Intel climbed more than 1%, while Seagate Technology , was up more than 2%. CoreWeave gained more than 2%.\n\nThe S&P 500 finished in positive territory on Monday, while the Nasdaq Composite advanced more than 1%.", "source": "CNBC Top News", "pub_date_str": "20 Oct 2026, 10:54 PM IST", "pub_date_relative": "38m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Fixed Income", "Derivatives", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Braze stock surges over 50% after Salesforce announces $5.66 billion acquisition", "full_content": "Shares of Braze surged in Tuesday\u2019s trade on October 20, rallying 52% to a 22-month high of $45.59 apiece on the Nasdaq after Salesforce (CRM) agreed to acquire the customer-engagement software company, handing existing investors a major windfall.\n\nFor Braze, the strategic attraction extends beyond the purchase price. Joining Salesforce Inc. could give the technology much broader distribution and greater resources for product development.\n\nFollowing the meteoric rally, Braze stock is trading at roughly three times its late-February price.\n\nSalesforce said on Tuesday that it would acquire Braze in a deal valued at about $5.66 billion, valuing Braze shares at $47.50 apiece and representing a 58.1% premium over the stock\u2019s previous closing price. The company expects the all-cash transaction to close in fiscal 2028, subject to the necessary approvals.\n\nNew York-based Braze gathers customer data in real time and uses artificial intelligence (AI) to generate personalized messages across different channels and communication platforms, including mobile apps, websites, email, and text messaging.\n\nThe company serves around 2,770 customers, including Canva, Equinox, Instacart, and Venmo, according to the statement.\n\nThe deal marks Salesforce\u2019s latest move to accelerate its AI transition as investors worry that the rapid adoption of the technology could erode demand for traditional software. Salesforce will use Braze\u2019s technology to bolster several of its products, particularly those focused on marketing and customer communication through Agentforce, its flagship AI platform.\n\nThe deal also reinforces Salesforce\u2019s return to a strategy of serial software acquisitions.", "source": "LiveMint Markets", "pub_date_str": "20 Oct 2026, 10:51 PM IST", "pub_date_relative": "41m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "China slams US ban on DeepSeek AI over security concerns - Fox News", "full_content": "China slams US ban on DeepSeek AI over security concerns Fox News US banning Chinese AI DeepSeek from government agency IT systems Reuters US bans use of China\u2019s DeepSeek AI tools by government agencies The Guardian DHS Orders DeepSeek Technology Removed From Federal Civilian IT Systems WSJ DeepSeek deep-sixed at all US federal civilian agencies The Register", "source": "Google News Business", "pub_date_str": "20 Oct 2026, 10:14 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Wall Street gains ground on healthcare stocks rally, oil retreat - Reuters", "full_content": "Wall Street gains ground on healthcare stocks rally, oil retreat Reuters Dow jumps 500 points as solid earnings, falling crude oil stir rebound: Live updates CNBC Stock Market Today: Dow Jumps 500 Points; Investors Await SpaceX Earnings \u2014 Live Updates WSJ US stocks rise after companies deliver strong profits and oil prices retreat AP News Stock Market Today: Dow Surges, Oil Eases On U.S.-Iran Hopes; This Pharma Stock Clears Entry (Live Coverage) Investor's Business Daily", "source": "Google News Business", "pub_date_str": "20 Oct 2026, 10:09 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "CBDT notifies Form 173A for government securities: New tax exemption rules for eligible foreign investors", "full_content": "The Central Board of Direct Taxes (CBDT) has made it mandatory for eligible foreign investors and the Bank for International Settlements (BIS) to submit Form 173A to claim income-tax exemptions on interest and capital gains from government securities. The requirement was introduced through the Income-tax (Seventh Amendment) Rules, 2026, notified on 19 October.\n\nThe new form lays down the information that eligible investors must furnish to claim exemptions under entries 13D and 13E of Schedule IV of the Income-tax Act, 2025. The amended rules came into force upon publication in the Official Gazette. The exemptions apply to qualifying income from government securities, subject to the conditions prescribed under the Act.\n\nThe change does not introduce a tax exemption for all government bond investors. It sets out the reporting requirements for investors seeking specific exemptions under the law.\n\nThe provisions cover specified foreign institutional investors (FIIs) under entry 13D and the Bank for International Settlements under entry 13E of Schedule IV. The exemptions relate to eligible interest income and capital gains arising from the sale, exchange or transfer of government securities .\n\nFor ordinary retail investors who buy government bonds or Treasury Bills, the new form does not create an additional tax benefit. Its requirements concern entities eligible for the specified exemptions.\n\nForm 173A has two parts, covering basic information about the claimant and details of income earned from government securities.\n\nThe first part requires the investor's name, country of residence, address, Permanent Account Number (PAN), tax year, email address and contact number. It also seeks the tax identification number issued by the investor's country of residence and the Securities and Exchange Board of India registration number as an FPI or FII, where applicable.", "source": "LiveMint Money", "pub_date_str": "20 Oct 2026, 10:08 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Fixed Income"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "What options traders expect from SpaceX earnings after the bell", "full_content": "The company delivered four astronauts to the International Space Station in record time, expanded its mobile network spectrum, is reportedly eyeing a $40 billion debt deal to buy Nvidia chips, and CEO Elon Musk said he plans to give shares to every kid in America next year.\n\nTraders think all that means more gains for the stock after it reports earnings after the bell Tuesday.\n\nOptions market-makers are pricing about a 6% swing for SpaceX after the event, according to Cboe LiveVol data. That's less than half the 13% it erased after its inaugural report in August, a selloff that turned out to be the low for the shares, which rallied 60% the following two months before reversing before dropping as much as 19% the past two weeks.\n\nWhile there are about as many open call contracts as puts on the stock, daily trading volume has leaned toward calls the past week, Barchart data shows.\n\nAmong the 1.1 million contracts traded Monday \u2013 20% higher volume than the 30-day average \u2013 665,000 were calls, with more bought than sold, according to Cboe LiveVol. Traders also bought more calls than puts, and sold more puts than they bought, the data show, decidedly bullish flow as the space giant heads into its second earnings.\n\nThe most popular call contract for Friday expiry was the 170-strike, which needs about a 14% rally, according to SpotGamma data. There was also notable buying in the 190-strike call for month-end, a 40-cent contract that needs SpaceX to rally 29% to break even.\n\nSpaceX, YTD For that to happen, SpaceX will have to rally through two more share lockup periods: a scheduled release two days after earnings, as well as another on October 26 that together will amount to over 1.6 billion eligible shares for sale. So far that hasn't been a problem for the stock, as releases on Sep. 9, 10, and 24 had no discernible effect on the share price.\n\nImplied volatility is much lower in SpaceX going into this report compared to last quarter, as reflected in the implied move.", "source": "CNBC Top News", "pub_date_str": "20 Oct 2026, 10:04 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Oil prices fall as traders hope for diplomatic progress in Middle East", "full_content": "Crude oil prices fell Tuesday as traders hoped for diplomatic progress between the U.S. and Iran, though attacks on tankers and strikes against Saudi Arabia have escalated recently.\n\nU.S. West Texas Intermediate futures for November were down 0.9% at $102.75 per barrel, pulling back dramatically from a session high of $110.48. The November contract expires on Tuesday. The WTI December contract was down 1% at $97.50 per barrel.\n\nGlobal benchmark Brent crude futures for December delivery fell 1% to $108.31 per barrel, well off a session high of $111.99.\n\nCrude oil futures Developments in the Middle East remain in focus, with attacks on commercial ships transiting the Strait of Hormuz escalating in recent weeks. At least 18 vessels have come under fire over the past two weeks, according to ship tracker Kpler.\n\nIran's Revolutionary Guard Corps said Tuesday that two \"non-compliant\" oil tankers had been set ablaze in the strait after hitting mines laid by its naval unit, Iranian state-affiliated news agency Tasnim reported.\n\nMeanwhile, Foreign Ministry Spokesperson Esmaeil Baqaei said at a weekly news conference on Tuesday that Tehran would respond to any American strike \"in equal measure, if not more forcefully,\" according to Tasnim.\n\nU.S. President Donald Trump said earlier this month that American forces will not attack Iran before the midterm elections on Nov. 3.\n\nTamas Varga, analyst at PVM Oil Associates, told CNBC in an email on Tuesday that front-end WTI strength ahead of the contract expiry is a sign of tightness in the global crude oil market.", "source": "CNBC Top News", "pub_date_str": "20 Oct 2026, 09:49 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Ahead of massive IPOs, AI companies are sketching plans to share their wealth - AP News", "full_content": "Ahead of massive IPOs, AI companies are sketching plans to share their wealth AP News AI takes on great experiment in self-rule Axios What to Know About the Obscure Trust Looming Over Anthropic\u2019s IPO WSJ Investing in the public benefit Anthropic SpaceX, Anthropic plan to share wealth with the public amid concern AI could trigger job losses Los Angeles Times", "source": "Google News Business", "pub_date_str": "20 Oct 2026, 09:46 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Novo's next-generation obesity drug shows 25% weight loss in women in late-stage analysis", "full_content": "Novo on Tuesday said its next-generation obesity drug, CagriSema, showed 25% weight loss on average among adult women in a new analysis conducted after a late-stage trial.\n\nThe Danish company said further work is needed to confirm the hypotheses of two post-study analyses. Still, the results are the latest evidence that the experimental injection can improve upon the weight loss and other benefits offered by Novo's GLP-1 drug semaglutide, the active ingredient in its blockbuster obesity shot Wegovy and diabetes counterpart Ozempic.\n\nCagriSema, a combination of semaglutide and another drug called cagrilintide that targets the amylin pathway, is expected to launch early next year. Obesity drug leaders Novo and Eli Lilly have built new treatments around amylin , which involves a hormone released in the pancreas alongside insulin that helps regulate hunger and fullness, hoping it will give them a new revenue stream beyond existing GLP-1s.\n\nIn an analysis of roughly 2,300 women with obesity or who are overweight, CagriSema was associated with 25% weight loss on average at 68 weeks compared with 3% with placebo. The results are based on an ideal scenario in which all patients stayed on treatment without interruptions.\n\nA second analysis of around 1,900 women grouped by their menopausal status found that weight loss reached 26.7%, 24.8% and 23.1% in premenopausal, perimenopausal and postmenopausal women, respectively, at 68 weeks, if all patients remained on the drug.", "source": "CNBC Top News", "pub_date_str": "20 Oct 2026, 09:41 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Gilt market catches up with peers as investor worries over Budget ease", "full_content": "UK bonds were initially hard hit after onset of Iran war but have since outperformed as traders\u2019 concerns shift to France", "source": "FT Markets", "pub_date_str": "20 Oct 2026, 09:40 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Trade Setup For Oct 21: Nifty Breaking Below 22,800 Support Can Trigger Another Bear Attack, Analysts Warn", "full_content": "Against this backdrop, traders are likely to monitor global cues alongside the Nifty's ability to defend its immediate support and reclaim key resistance levels.", "source": "NDTV Profit", "pub_date_str": "20 Oct 2026, 09:38 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Microsoft Expands Sovereign Cloud Capabilities, Adds EU Data Oversight", "full_content": "Microsoft has expanded its Sovereign Cloud portfolio, introducing enhanced data controls, AI security and connected or offline operations to help organisations meet regulatory requirements while maintaining flexibility and operational resilience.", "source": "NDTV Profit", "pub_date_str": "20 Oct 2026, 09:33 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Meta Shares Plunge Up To 3.5% Ahead Of Results. What Traders Are Looking At", "full_content": "Meta shares have fallen for four straight sessions ahead of Q3 results, with investors weighing strong advertising growth against rising AI spending, margin pressures and the outlook for 2027 capital expenditure.", "source": "NDTV Profit", "pub_date_str": "20 Oct 2026, 09:31 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Here's what to expect when Netflix reports earnings after the bell", "full_content": "Netflix is set to report quarterly earnings after market close on Tuesday as the media industry faces consolidation , spinouts and intensified competition.\n\nHere's how Netflix is expected to perform for the period ended Sept. 30, according to estimates from analysts polled by LSEG:\n\nLast week, Netflix said it was laying off about 6% of employees, or roughly 1,000 workers, and that Chief Content Officer Bela Bajaria was departing from that role.\n\nThe changes come as Netflix faces stagnating viewership and growing competition from the likes of YouTube. At the same time that streaming subscriber additions have slowed in recent years, advertising has once again become a major revenue driver for media companies.\n\nWith the help of its cheaper, ad-supported tier, Netflix continues to post solid profits and remains the biggest player in the streaming realm.\n\nOn Tuesday, Netflix announced new features for advertisers that it says will help better connect brands to the right audiences and measure the impact of their ads.\n\nHowever, the company's stock has fallen about 40% in the past year, and executives have been publicly exploring new avenues for growth.", "source": "CNBC Top News", "pub_date_str": "20 Oct 2026, 09:30 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stuttgart Vs Atletico Madrid Live Streaming: Likely Lineups; How To Watch Champions League Match?", "full_content": "Stuttgart will aim to make home advantage count against an Atletico Madrid side that has been in impressive form across competitions. Here's all you need to know about the Champions League fixture, including the head-to-head record and live-streaming options.", "source": "NDTV Profit", "pub_date_str": "20 Oct 2026, 09:30 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "EXCLUSIVE: ByteDance, Alibaba, Tencent place over $35 billion worth of Nvidia chip orders - Reuters", "full_content": "EXCLUSIVE: ByteDance, Alibaba, Tencent place over $35 billion worth of Nvidia chip orders Reuters ByteDance, Alibaba and Tencent ordered over $35 billion of Nvidia chips at list price Quartz Not Even Rumors of a Big China Chip Purchase Can Lift Nvidia Stock Barron's How DeepSeek Is Shaping Huawei\u2019s AI Chips in a Growing Challenge to Nvidia The Information China\u2019s tech giants drop $35 billion on export-compliant Nvidia RTX Pro 5500 workstation GPU orders to power AI ambitions, according to reports \u2014 ByteDance, Alibaba and Tencent order 3 million cards despite warnings that only 10% of orders are fulfillable Tom's Hardware", "source": "Google News Business", "pub_date_str": "20 Oct 2026, 09:21 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Data center stocks remain under pressure after Korea IPO plunges 30%", "full_content": "Data center stocks are being squeezed on Tuesday following a lackluster initial public offering overnight from a South Korean cloud company that has been compared to U.S. neocloud CoreWeave.\n\nShares of Elice dropped 30% during their market debut overnight, as investors grow increasingly wary of artificial intelligence-dedicated computing power providers amid concerns about overcapacity.\n\nThe bearish sentiment spilled into U.S. tech equities before some names clambered back into the green. CoreWeave shares are up 1.6% after dropping 4% just after market open Tuesday; Nebius shed about 1% while Iren was down about 4% in late morning trading.\n\nHSBC said in a Monday note that the troubles for the heavily levered CoreWeave are not going away.\n\n\"Debt market woes and moderating LLM revenues are exacerbating structural concerns for neoclouds ,\" HSBC analyst Abhishek Shukla wrote. Shukla has a reduce rating on CoreWeave with a price target of $39, implying 36.5% downside.\n\nElice's IPO was small, having raised just $150 million, according to Reuters . Its market cap also equates to roughly $1.3 billion. The company provides a range of AI-related services, including cloud computing equipment, training libraries and application interfaces for businesses.\n\nDespite its size, investors are likely looking at it as a a signal of investor sentiment toward the AI build-out.\n\nTrouble for neoclouds, which some investors see as the weakest link in the emerging AI value chain, started earlier this month with less-than-stellar revenues reported by the private AI algorithm companies and pressure from higher interest rates.", "source": "CNBC Top News", "pub_date_str": "20 Oct 2026, 09:15 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Fixed Income"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "General Motors beats Wall Street's Q3 earnings expectations, narrows full-year guidance", "full_content": "DETROIT \u2014 General Motors narrowed its 2026 earnings guidance and raised its free cash flow expectations after beating Wall Street's third-quarter expectations.\n\nThe Detroit automaker also announced a new multiyear stock buyback of $20 billion after GM completed a $6 billion share repurchase program that was announced in January. GM did not disclose a specific time to complete the program.\n\nDespite the positive news, GM stock was off roughly 5% during trading Tuesday as the company's outlook missed Wall Street's expectations.\n\nWall Street analysts were mixed before the report on whether GM would raise its guidance Tuesday amid concerns of slowing sales and rising commodity costs. Analysts' expectations included a midpoint of $13.41 per share for the year compared with GM's new $13.25 per share midpoint, according to LSEG.\n\nSeveral analysts in investor notes Tuesday said GM's third-quarter results were solid, but raised concerns about whether higher costs and pressures on vehicle pricing would limit earnings growth next year.\n\nHere's how GM performed in the third quarter, compared with average estimates compiled by LSEG:\n\nGM's new guidance includes adjusted earnings before interest and taxes of between $14.5 billion and $15.5 billion, or $12.75 to $13.75 adjusted earnings per share, and adjusted automotive free cash flow of between $11.5 billion and $12.5 billion.\n\nThat compares with its raised guidance from July that included adjusted EBIT of between $14 billion and $16 billion, or $12 to $14 adjusted EPS, and adjusted automotive free cash flow of $9.5 billion to $11.5 billion.", "source": "CNBC Top News", "pub_date_str": "20 Oct 2026, 09:13 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "OpenAI Upgrades ChatGPT Slides With Live Teamwork, Comments And PowerPoint Export", "full_content": "OpenAI has upgraded ChatGPT Slides with real-time collaboration, comments and direct on-slide editing. Teams can now tag ChatGPT, or their Dots agent, to turn feedback into changes, then export decks to PowerPoint or Google Slides.", "source": "NDTV Profit", "pub_date_str": "20 Oct 2026, 09:10 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "GM Plans $20 Billion in Buybacks, but Warns of Bumpy 2027 - WSJ", "full_content": "GM Plans $20 Billion in Buybacks, but Warns of Bumpy 2027 WSJ GM beats on Q3 results, tightens profit outlook, unveils new $20 billion buyback Yahoo Finance General Motors beats Wall Street's Q3 earnings expectations, narrows full-year guidance CNBC GM shares sink as automaker signals rising cost pressures Reuters GM 2026 Q3 letter to shareholders General Motors", "source": "Google News Business", "pub_date_str": "20 Oct 2026, 09:09 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "In second visit within months, Rubio calls on India to scale up US energy and defence buys", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a In second visit within months, Rubio calls on India to scale up US energy and defence buys The Economic Times daily newspaper is available online now. Read Today's Paper In second visit within months, Rubio calls on India to scale up US energy and defence buys SECTIONS In second visit within months, Rubio calls on India to scale up US energy and defence buys PTI Last Updated: Oct 20, 2026, 08:56:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India and the US are actively working to expand energy and defence cooperation amidst existing tensions. US Secretary of State Marco Rubio emphasized India's potential as a crude oil refining superpower. Discussions included increasing energy trade and promoting the purchase of American technologies for mutual benefit. Rubio also plans to visit Reliance Industries Ltd's Jamnagar Refinery to discuss energy security.\n\nOne company, 2 words. Bond yield and CDS: Will they decide the fate of global markets?\n\nBusiness of Odd Things: Inside an industry that farms fish that nobody is meant to eat\n\nWar's second-order effects are becoming visible in critical sectors\n\nUS mid-term elections \u2013 Part 2: What does it mean for Trump to lose control of Congress?\n\nHomebuyers wait as NCLT panel picks holes in unfinished Jaypee projects\n\nWhat is the real impact of 13x jump in cash transfers to women?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "20 Oct 2026, 08:54 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Fixed Income", "Derivatives", "Alternative Investments"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Wall Street rebounds from lows as upbeat earnings, falling oil prices lift sentiment; Micron, Intel up 2%", "full_content": "The US stock market rebounded from opening losses in Tuesday\u2019s trade as a series of upbeat earnings reports and a retreat in crude oil prices overshadowed recent pressure on arti
