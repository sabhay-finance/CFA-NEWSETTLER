g off a losing session for the S&P 500 and Nasdaq Composite , after tech stocks gave back some of their gains from the prior session as Nvidia sank and Anthropic fell below its IPO price. The broader index fell 0.5% and the Nasdaq slid 1.5%. On the other hand, the 30-stock Dow , which has less exposure to tech, climbed more than 400 points, or 0.9%.\n\nThe choppy trading action was just the latest in a volatile month. Even before the ouster and reinstatement of Nvidia's Jensen Huang, and Democrats' sweep in the midterm elections, investors were deliberating the future of the artificial intelligence build-out amid a worsening macroeconomic outlook.\n\n\"Let's remember that the sell-off in the AI ecosystem predated the news about Huang and Nvidia,\" Liz Ann Sonders, chief investment strategist at Schwab Center for Financial Research, told CNBC's \" Closing Bell \" on Tuesday.\n\n\"The concerns about capex, the data center build-out, the spread between the cost of capital and return on invested capital, the bifurcation that's happening in the market now between sort of profitable segments of the market and unprofitable,\" she added. \"I think that is the bigger, more aggregate story.\"", "source": "CNBC Top News", "pub_date_str": "25 Nov 2026, 03:15 PM IST", "pub_date_relative": "12m ago"}, {"title": "Tech rout deepens globally; Softbank falls 15%, Nvidia down 4.5% premarket", "full_content": "Technology stocks tumbled globally on Wednesday, as renewed concerns over the artificial intelligence trade rattle investors and Monday's rally continues to fade.\n\nNvidia was down 4.65% in premarket trading at 4:11 a.m. ET. Anthropic dropped 3.82% and AMD 4.85%. Anthropic's shares fell below its IPO price on Tuesday after a 6.54% drop.\n\nIn Europe, chip were more stable, with ASML , SAP , BESI and Infineon down by less than or around 1%.\n\nJapanese semiconductor stocks tied to the global AI supply chain were among the hardest hit. Advantest , a supplier of chip-testing equipment to Nvidia, plunged 12.94%. Tokyo Electron , which supplies chipmaking equipment to Nvidia's manufacturing partner TSMC, slumped 12.53%.\n\nTechnology-focused investor SoftBank Group shed 14.83%, while semiconductor inspection equipment maker Lasertec lost 11.23%.\n\nTech stocks have seen heightened volatility over the past few months amid concerns over capital expenditure, skepticism over return on investments, circular AI financing, with Jensen Huang's ouster as Nvidia CEO adding fresh worries, and his return sparking a massive rally.\n\nRolf Bulk, an analyst at The Futurum Group, said the renewed sell-off largely reflects lingering concerns over the sustainability of AI spending beyond 2027, with Huang's return doing little to fundamentally alter the outlook.\n\n\"There are still concerns on the sustainability of AI demand, ability of the sector to finance the build-out, and questions around power supply,\" Bulk said, adding that Japanese chip equipment makers were particularly vulnerable to a potential slowdown in AI infrastructure spending, given the highly cyclical nature of their business.", "source": "CNBC Top News", "pub_date_str": "25 Nov 2026, 03:12 PM IST", "pub_date_relative": "15m ago"}, {"title": "Colman\u2019s sale could resolve concerns over Unilever-McCormick food deal, says watchdog", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Nov 2026, 03:06 PM IST", "pub_date_relative": "21m ago"}, {"title": "BioArctic Q3 2026 slides: royalties surge, subcutaneous Leqembi approved globally", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Nov 2026, 03:05 PM IST", "pub_date_relative": "21m ago"}, {"title": "Stellantis cuts Sochaux night shift amid weak demand", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Nov 2026, 03:05 PM IST", "pub_date_relative": "22m ago"}, {"title": "Germany\u2019s GDP grows 0.1% in Q3 2026, revised down slightly", "full_content": "", "source": "Investing.com iation is urging the government to impose stock limits on maize and soyabean. Rising feed prices have caused significant distress for poultry farmers amid claims of artificial scarcity. Many poultry farms are shutting down as production costs exceed earnings from chicken sales. The association estimates that chicken prices could increase significantly if conditions do not improve soon.\n\nThe fall is new, the pattern is 11 years old: Making sense of gold's crash\n\nAs AI sharpens cyber attacks, should listed companies follow one standard in reporting them?\n\nKYC and KYB: Zydus Lifesciences \u2013 From the chemist\u2019s counter to US pharmacies. Part 1 of 3\n\nWhat would it take for the world to stop needing the Strait of Hormuz?\n\nHidden export winners: The unlikely products finding real buyers abroad\n\nIndia\u2019s USD25 bn copper drive moves from building smelters to securing mines\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "25 Nov 2026, 02:49 PM IST", "pub_date_relative": "38m ago"}, {"title": "Ukraine tells Putin to \u2018stop complaining\u2019 over oil refinery attacks as Russia promises retaliation", "full_content": "Ukrainian Foreign Minister Andrii Sybiha has told Russian President Vladimir Putin to \"stop complaining\" over attacks on Russian refineries, saying Putin could end Kyiv's strikes on the oil facilities by bringing an end to the Kremlin's nearly five-year-long war.\n\nHis comments come shortly after Russia's president told a meeting of government officials and senior oil executives in the Kremlin on Tuesday that Ukraine continues to attack refining facilities despite U.S. President Donald Trump 's appeal to refrain from doing so.\n\n\"I would like to note that retaliatory action from our side is inevitable. Everyone must be aware of that,\" Putin said, according to Russian state news agency Tass .\n\nIn September, Trump called on Ukrainian President Volodymyr Zelenskyy to stop targeting Russian oil refineries, saying the attacks were \" hurting the world \" as fuel supply disruptions from the wars in Ukraine and Iran propelled U.S. diesel prices to a record high. Moscow welcomed Trump's push for Ukraine to halt strikes on Russia's diesel-producing facilities at the time.\n\n\"If Putin doesn't like Ukraine's strikes on his oil refineries, he can order an end to the war,\" Ukraine's Sybiha said Tuesday via social media.\n\n\"If he doesn't want his military vessels hit, he can order an end to the war. Not to mention the 432,000 Russian soldiers he has lost on the battlefield this year without coming any closer to the goals of his invasion. Clearly, he doesn't care about them. Stop complaining. End the war,\" he added. CNBC could not independently verify the figures.\n\nIn July, the Center for Strategic and International Studies estimated that about 1.4 million Russian troops were killed, wounded or went missing between the start of the full-scale invasion in Feb.", "source": "CNBC Top News", "pub_date_str": "25 Nov 2026, 02:48 PM IST", "pub_date_relative": "39m ago"}, {"title": "Multibagger Alert! Up 102% in 1 year, more rally seen in this small-cap power stock - here's why | Check target, upside", "full_content": "QPOWER Pranati Deva Published 25 Nov 2026, 02:45 PM IST Prefer Livemint on Google Multibagger power stock Quality Power Electrical Equipments has been giving strong returns to its investors in recent times. It has soared 102% in the last 1 year. Meanwhile, the small-cap stock has advanced 11% in 1 month, and 34% in 6 months.\n\nDespite strong returns, domestic brokerage house Dolat Capital sees more upside in the power stock going ahead.\n\nThe brokerage sees the company emerging as a key beneficiary of India's expanding power transmission infrastructure and the global shift towards high-voltage direct current (HVDC) technology. Initiating coverage on the stock, Dolat Capital has assigned a BUY rating with a target price of \u20b9 2,000, implying an upside of around 36% from its last closing price of \u20b9 1,468.50.\n\n\u201cThe number of globally qualified suppliers capable of serving HVDC and FACTS projects remains limited. Technical complexity, stringent reliability standards and lengthy customer-qualification cycles restrict the entry of new players,\u201d it noted.\n\nIndia's power transmission sector is entering a multi-year investment cycle, supported by rising electricity demand, renewable energy integration and the need to strengthen grid infrastructure. The National Electricity Plan envisages transmission investments of around \u20b9 9.15 trillion through FY32, including the addition of 33GW of HVDC capacity.\n\nThe global HVDC market is projected to expand from around $12.7 billion in CY25 to $17.6 billion by CY33. India's market is expected to grow faster, from $3 billion in 2024 to $5.9 billion by 2030, translating into a compound annual growth rate (CAGR) of 12.6%, according to the brokerage.\n\nQuality Power has a differentiated position in this market.", "source": "LiveMint Markets", "pub_date_str": "25 Nov 2026, 02:45 PM IST", "pub_date_relative": "41m ago"}, {"title": "Anthropic's Potential Bond Issues May Be Rated Junk Despite $1.1 Trillion Valuation, Says Report", "full_content": "An investment-grade rating would give Anthropic access to the $8.6 trillion high-grade corporate bond market. In comparison, the US junk-bond market is estimated at around $1.7 trillion and typically carries higher borrowing costs.", "source": "NDTV Profit", "pub_date_str": "25 Nov 2026, 02:40 PM IST", "pub_date_relative": "47m ago"}, {"title": "Asian Stocks to Slide as AI Trade Doubts Resurface: Markets Wrap - Bloomberg", "full_content": "Asian Stocks to Slide as AI Trade Doubts Resurface: Markets Wrap Bloomberg Stocks retreat as AI rebound stumbles, tariff threats loom Reuters SoftBank drops 15% as Wall Street AI sell-off ripples across Asian tech names CNBC Tech firms back in crosshairs as Huang rally reverses Yahoo Finance Asia\u2019s markets dive as return of Nvidia\u2019s Huang fails to quell AI doubts Al Jazeera", "source": "Google News Business", "pub_date_str": "25 Nov 2026, 02:40 PM IST", "pub_date_relative": "47m ago"}, {"title": "APL Apollo's Gupta Wants Minority Holders To Get Rs 200/Share More, Says Tata Steel's Narendran", "full_content": "With debt emerging as the biggest sticking point, Tata Steel is evaluating changes to the APL Apollo deal structure to reassure shareholders on both sides.", "source": "NDTV Profit", "pub_date_str": "25 Nov 2026, 02:40 PM IST", "pub_date_relative": "47m ago"}, {"title": "'A1/54' On Ticket, Only 52 Berths In Train Coach? Passenger Complains To Railways", "full_content": "Railway Seva requested Bajpai to share his mobile number through a direct message to facilitate further assistance.", "source": "NDTV Profit", "pub_date_str": "25 Nov 2026, 02:40 PM IST", "pub_date_relative": "47m ago"}, {"title": "Rs 1.27 Crore Salary, Yet No Compatible Partner: Why An IIT Graduate Is Struggling To Find A Match", "full_content": "The graduate's earlier matchmaking experiences reportedly highlighted differences in upbringing, cultural preferences and long-term expectations.", "source": "NDTV Profit", "pub_date_str": "25 Nov 2026, 02:38 PM IST", "pub_date_relative": "48m ago"}, {"title": "Ionic Wealth Announces Rs 177 Crore Fundraise From Angel One To Ramp Up Growth", "full_content": "The company said it will focus on strengthening its portfolio-led proposition and its global capabilities.", "source": "NDTV Profit", "pub_date_str": "25 Nov 2026, 02:36 PM IST", "pub_date_relative": "51m ago"}, {"title": "As markets recover, it's time to rebalance, not chase returns", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nThe Indian equity markets have staged a smart recovery over the past few weeks after two years of underperformance and heightened volatility. The Nifty has rebounded strongly, accompanied by substantial foreign institutional investor (FII) inflows and a more constructive stance from several international brokerages, including CLSA, Citigroup and Jefferies. Notably, FIIs have invested $7.5 billion in the first 10 sessions of November, the highest monthly inflow in five years.\n\nWhile these developments are encouraging, investors need to be careful not to confuse a market recovery with a signal to overhaul their investment strategy. Rather than chasing the rally or attempting to time the market, this may be an opportune moment to review portfolio allocations and undertake a much-needed rebalancing exercise.\n\nOne of the more interesting developments in recent years has been the change in Indian household asset allocation. Between 2023 and 2026, the share of gold in household financial asset allocation increased sharply from 15.4% to 24.2%. Much of this increase can be attributed to the substantial appreciation in gold prices rather than a corresponding increase in fresh investments.\n\nIn contrast, the allocation to equities barely moved, from 5.6% to 5.7% during the same period. This is despite a meaningful improvement in investor participation in equity markets. Monthly mutual fund SIP contributions, for instance, nearly doubled from \u20b9 16,928 crore in October 2023 to \u20b9 32,160 crore in October 2026.\n\nThough investors have continued to commit fresh money to equities, the correction in equity valuations over the past two years has largely offset the impact of these investments on overall portfolio values.", "source": "LiveMint Money", "pub_date_str": "25 Nov 2026, 02:27 PM IST", "pub_date_relative": "1h ago"}, {"title": "Shein to pay $100mn to resolve US allegations that it deceived customers", "full_content": "Regulators claim cotton that the retailer\u2019s suppliers said was US-grown was harvested in China", "source": "FT Markets", "pub_date_str": "25 Nov 2026, 02:25 PM IST", "pub_date_relative": "1h ago"}, {"title": "IPL 2027 Auction: Only 2 Indians Join Ben Stokes In Rs 2 Crore Base Price Bracket", "full_content": "Ben Stokes is among 30 players who have registered at the highest base price for the IPL 2027 mini-auction, with only two Indians featuring in the bracket.", "source": "NDTV Profit", "pub_date_str": "25 Nov 2026, 02:24 PM IST", "pub_date_relative": "1h ago"}, {"title": "Rupee Hits 8-Month High Against Dollar, Gains 2% In November: 4 Reasons Behind The Rally", "full_content": "The currency has gained more than 2% in November, supported by a return of foreign investors to domestic equities, lower crude oil prices and measures by the Reserve Bank of India (RBI) to ease pressure on the foreign exchange market.", "source": "NDTV Profit", "pub_date_str": "25 Nov 2026, 02:20 PM IST", "pub_date_relative": "1h ago"}, {"title": "'Dish Was Prepared Using...': Bengaluru Airport Responds After Flyer Reports Maggots' In Lounge Food", "full_content": "The airport makes the statement on X after a flyer alleges his daughter had eaten contaminated food shortly before an international flight.", "source": "NDTV Profit", "pub_date_str": "25 Nov 2026, 02:19 PM IST", "pub_date_relative": "1h ago"}, {"title": "Gold prices crash 27% in 3 months: Golden opportunity to invest in jewellery or should households wait? What experts say", "full_content": "Gold prices in India have corrected sharply from their peak of around \u20b9 1.8 lakh per 10 grams in January to nearly \u20b9 1.2 lakh currently.\n\nOn Wednesday, 24K gold is priced at \u20b9 1,21,090 per 10 grams, down \u20b9 1,770 (1.44%), while 22K gold stood at \u20b9 1,10,999 per 10 grams at 1:35 pm.\n\nOn the MCX , December gold futures are trading at \u20b9 1,20,401 on 25 November, down around 15% over the past month and 27% over three months.\n\nThe sharp correction has raised a key question for households planning jewellery purchases: Is this the right time to buy gold, or could prices fall further?\n\nHere's what experts say about the gold price outlook and what jewellery buyers should consider before making a purchase.\n\nGaurav Garg, Head of Research at Lemonn, shared the following indicative price estimates for gold:\n\nGarg expects gold prices to rise soon. By the end of 2027, a recovery in global demand and a more supportive interest-rate environment could take 24K gold prices to \u20b9 1.45\u20131.60 lakh and 22K gold prices to \u20b9 1.33\u20131.47 lakh per 10 grams.\n\nGarg said the recent correction in gold prices has improved buying opportunities for households. Those with immediate requirements can use the correction to buy in phases rather than wait for the market to hit an exact bottom.", "source": "LiveMint Money", "pub_date_str": "25 Nov 2026, 02:17 PM IST", "pub_date_relative": "1h ago"}, {"title": "Rollercoaster ride in stock market today: Nifty pares gains by 270 points, Sensex crashes over 800 from day's high", "full_content": "The Sensex and Nifty 50 retreated from their sharp intraday highs on Wednesday as investors booked profits at elevated levels. However, both benchmark indices remained firmly in positive territory, buoyed by continued foreign fund inflows and easing crude oil prices, helping domestic equities recover some of the losses incurred in the previous session.\n\nAt around 1:47 PM, the BSE Sensex was trading 1,272.59 points, or 1.54%, higher at 83,708.58, while the NSE Nifty 50 stood at 25,734.95, up 365 points, or 1.44\n\nEarlier in the session, the Sensex had rallied 2,062.22 points, or 2.5%, to an intraday high of 84,498.21. The Nifty 50 had also surged 602 points, or 2.4%, to touch 25,951.65 before surrendering a portion of its gains.\n\nThe total market capitalisation of BSE-listed companies surged by over \u20b9 2.2 lakh crore within minutes of Wednesday's opening bell, climbing to \u20b9 5,11,97,090.27 crore from \u20b9 5,09,75,499.68 crore on 23 November.\n\nAs the session progressed and benchmark indices pared some of their early gains, the combined market capitalisation stood at \u20b9 5,10,80,534.84 crore. This represented an increase of approximately \u20b9 1.05 lakh crore compared with the 23 November level.\n\nAccording to market analysts, the retreat from intraday highs was due to profit-booking following the sharp rally in early trade and a very weak global backdrop. The selling pressure was clearly there, with investors using the higher levels to exit rather than enter.\n\nSentiment was clearly under pressure as the Asian markets all delivered sharp declines. The Kospi was down 6.16%, the Nikkei 225 down 2.78%, the SSE Composite down 1.87% and the Hang Seng down 0.85%.", "source": "LiveMint Markets", "pub_date_str": "25 Nov 2026, 02:07 PM IST", "pub_date_relative": "1h ago"}, {"title": "Gold, Silver Rates Live Updates: Check Prices In Gujarat, Goa, Tamil, Nadu, Kerala And More", "full_content": "Gold price dipped slightly to Rs 1,22,250 per 10 grams in early trade on Wednesday as per MCX data.", "source": "NDTV Profit", "pub_date_str": "25 Nov 2026, 02:06 PM IST", "pub_date_relative": "1h ago"}, {"title": "Delhi Nursery School Admission: All You Need To Know About Latest Guidelines", "full_content": "Parents seeking admission for their children to Nursery, LKG, UKG and applicable Class 1 entry-level seats can submit applications until December 28", "source": "NDTV Profit", "pub_date_str": "25 Nov 2026, 02:05 PM IST", "pub_date_relative": "1h ago"}, {"title": "Thirupparankundram Deepam Row Explained: Why Tamil Nadu Govt Apologised In Supreme Court", "full_content": "The Madras High Court's records show similar attempts to light the lamp at the hilltop in 1862 and 1912.", "source": "NDTV Profit", "pub_date_str": "25 Nov 2026, 01:55 PM IST", "pub_date_relative": "1h ago"}, {"title": "Bengaluru man gets relief after consumer commission directs Aishwarya Co-op Society to refund \u20b92.5 lakh FD", "full_content": "An Urban District Consumer Disputes Redressal Commission in Bengaluru offered relief to a 65-year-old man after directing Aishwarya Co-operative Society to refund his fixed deposit of \u20b9 2.5 lakh, along with 13% annual interest, after the society failed to pay him interest from June 2024.\n\nAccording to a report in The Times of India , the commission, comprising president Ramachandra M S and members Nandini H Kumbhar and Savitha Airani, partly allowed the complaint filed by Gangadharaiah, a 65-year-old resident of Narasimhaiahnapalya, Magadi Main Road, against the society's president. In an order dated 30 September 2026, it held that the society was guilty of deficiency in service.\n\nBased in Rajajinagar, the society did not appear before the commission despite being allowed to do so. It was therefore placed ex parte, and the commission proceeded with the case in its absence.\n\nAccording to the report, Gangadharaiah said he deposited \u20b9 2.5 lakh with the society on 6 July 2021, at an interest rate of 13%. The society agreed to pay him monthly interest of \u20b9 2,700. It also issued a fixed deposit receipt valid from 6 July 2021 to 6 July 2022. The deposit was subsequently renewed on 6 July 2022, for another year, until 6 July 2023.\n\nThe society paid interest until June 2024, following which it reportedly stopped the payments and did not renew the 65-year-old man's fixed deposit. In his complaint, he alleged that his repeated requests for renewal of the deposit and payment of the outstanding dues did not receive satisfactory responses.\n\nFollowing these requests, he wrote to the Assistant Registrar of Co-operative Societies and several other authorities on 12 November 2024 and 13 February 2025, seeking repayment of the principal amount and interest within 15 days. However, he did not receive any response. The society was served a legal notice on 9 July 2025, but failed to act on it.", "source": "LiveMint Money", "pub_date_str": "25 Nov 2026, 01:55 PM IST", "pub_date_relative": "1h ago"}, {"title": "Stock Market Today: Sensex Cracks 1,100 Points From day's High, Nifty 50 Holds Above 25,700; Bajaj Finserv, IndiGo, HUL Top Gainers", "full_content": "Among sectors, Nifty FMCG, Nifty Private Bank, Nifty Pharma, Nifty IT and Nifty Auto traded higher, while selling was seen in Nifty Metals, Nifty Media, Nifty PSU Bank and Nifty Realty indices.", "source": "NDTV Profit", "pub_date_str": "25 Nov 2026, 01:50 PM IST", "pub_date_relative": "1h ago"}, {"title": "PL Capital Raises Nifty Target To 28,561: Amnish Aggarwal Names 18 Stocks For The Next Rally", "full_content": "In its India strategy report titled 'Resilient Growth Amid Global & Weather Headwinds', analyst Amnish Aggarwal said the brokerage remains \"cautiously optimistic\" on equities, although it expects the market to consolidate with a positive bias.", "source": "NDTV Profit", "pub_date_str": "25 Nov 2026, 01:48 PM IST", "pub_date_relative": "1h ago"}, {"title": "Aamir Khan Begins Cricket Training For Lalkaara, Shifts To Colaba For Easy Access To South Mumbai Ground", "full_content": "Aamir Khan, Vikrant Massey, Jitendra Kumar and Dhairya Karwa are being coached by two former Indian cricketers at a legacy club in South Mumbai.", "source": "NDTV Profit", "pub_date_str": "25 Nov 2026, 01:48 PM IST", "pub_date_relative": "1h ago"}, {"title": "Jeff Bezos\u2019 Ex-Wife MacKenzie Scott Donates $12.5 Million To Two US Nonprofits: Who Gets The Money?", "full_content": "On her divorce from Jeff Bezos after 25 years of marriage in 2019, Scott received a 4% stake in Amazon, valued at approximately $36 billion at the time.", "source": "NDTV Profit", "pub_date_str": "25 Nov 2026, 01:43 PM IST", "pub_date_relative": "1h ago"}, {"title": "FIIs back with a bang! Inflows return to Indian stocks after 2-month sell-off; 14 sectors attracted foreign money | List", "full_content": "Pranati Deva Published 25 Nov 2026, 01:40 PM IST Prefer Livemint on Google FII inflows : Foreign institutional investors ( FIIs ) have made a sharp comeback in Indian equities, pumping $13 billion into the market in just 14 trading sessions in November after withdrawing a substantial amount of money over the previous two months. The turnaround marks a significant shift in foreign investor sentiment, supported by falling crude oil prices, easing geopolitical concerns and a stronger-than-expected recovery in corporate earnings.\n\nAccording to JM Financial's strategy report, FIIs invested $13 billion between November 2 and November 20, more than reversing the combined net outflows of $6.3 billion recorded in September and October 2026. Foreign investors were net buyers in all 14 trading sessions during this period, with three sessions recording inflows of more than $1.5 billion each.\n\nThe scale of the buying is significant against the backdrop of sustained foreign selling through much of 2026. JM Financial said attractive valuations among large-cap Indian stocks and a rotation away from Asian artificial intelligence ( AI )-linked trades have also helped redirect foreign capital towards India.\n\nA sharp correction in crude oil prices has been one of the key factors improving India's investment outlook. Brent crude fell from $117.6 per barrel at the end of October to $95.8 by November 15, before declining further to around $88 currently. This represents a fall of approximately 25% from the end-October level.\n\nLower crude prices have eased concerns about India's import bill, inflation and external balances. The improvement in geopolitical sentiment has also played a role. JM Financial also pointed to the Democrats' victory in the US midterm elections as an important inflection point, with markets interpreting the result as increasing pressure on Washington to seek an end to the Iran conflict.", "source": "LiveMint Markets", "pub_date_str": "25 Nov 2026, 01:40 PM IST", "pub_date_relative": "1h ago"}, {"title": "Pune: Panic Grips Shivajinagar Area After Firing Outside District Court", "full_content": "Gunshots were fired outside Pune's Shivajinagar District Court, resulting in one death and a body recovered at the scene.", "source": "NDTV Profit", "pub_date_str": "25 Nov 2026, 01:38 PM IST", "pub_date_relative": "1h ago"}, {"title": "EPFO 3.0 launch by February 2027: From UPI withdrawals to retirement SWP, 6 key changes PF members should know about", "full_content": "The Employees\u2019 Provident Fund Organisation ( EPFO ) is preparing a series of changes to make provident fund services faster, more accessible and more flexible for subscribers.\n\nFrom withdrawing money through UPI and ATMs to receiving retirement savings in instalments, several initiatives could change how members access and manage their Employees' Provident Fund ( EPF ) savings.\n\nHere are six important developments EPF subscribers should know about.\n\nEPFO is preparing to overhaul its existing technology infrastructure as part of the EPFO 3.0 initiative. The upgraded system is expected to streamline services, improve claim processing and make it easier for members to access and manage their provident fund accounts.\n\nAccording to a Financial Express report dated 23 November, a person familiar with the matter said EPFO could announce the rollout of EPFO 3.0 at its next Central Board of Trustees (CBT) meeting in February 2027. The CBT approved the framework in October 2025.\n\nThe new platform is being designed to handle information relating to around 200 crore members over the next 50 years. This is significantly higher than EPFO's current membership base of more than 36 crore active members.\n\nEPFO members could soon have additional options for accessing their provident fund savings. Under EPFO 3.0, the organisation plans to introduce withdrawals through ATMs and the Unified Payments Interface ( UPI ).\n\nThe UPI facility could be introduced as early as December 2026, according to the FE report. The technology is reportedly ready, with testing nearing completion. This could make it quicker to access eligible PF balances and reduce members' dependence on the existing online claim process.", "source": "LiveMint Money", "pub_date_str": "25 Nov 2026, 01:34 PM IST", "pub_date_relative": "1h ago"}, {"title": "British household energy bills to soar 26% from January", "full_content": "Energy regulator Ofgem says new three-month price cap reflects surge in wholesale cost of gas", "source": "FT Markets", "pub_date_str": "25 Nov 2026, 01:28 PM IST", "pub_date_relative": "1h ago"}, {"title": "Tech stocks slide as confidence in AI trade fades", "full_content": "Nasdaq 100 set to open lower as weeks-long sell-off continues", "source": "FT Markets", "pub_date_str": "25 Nov 2026, 01:24 PM IST", "pub_date_relative": "2h ago"}, {"title": "LMIL Unlocks Commercial Launch of Radiation-Free Breast Cancer Screening Device With Official Manufacturing License", "full_content": "Lords Mark Industries secured a license for a radiation-free breast cancer screening device priced under \u20b9700 to improve early detection in India.", "source": "NDTV Profit", "pub_date_str": "25 Nov 2026, 01:23 PM IST", "pub_date_relative": "2h ago"}, {"title": "MCX rates: Gold crashes 13%, silver plunges 20% in Nov 2026; is worst over? What should precious metals investors do?", "full_content": "MCX rates: Gold and silver are losing their shine in November, with a sharp sell-off in domestic futures markets prompting investors to reassess their exposure to precious metals. MCX gold has fallen around 13% so far this month, while silver has plunged nearly 20%, extending losses after a strong rally over the past year. The correction has also pushed gold down around 11% and silver nearly 40% on a year-to-date basis, according to the figures provided.\n\nThe weakness continued on Wednesday, 25 November, with MCX gold opening 0.24%, or \u20b9 294, lower at \u20b9 1,22,035 per 10 grams. MCX silver began the session 0.21%, or \u20b9 301, lower at \u20b9 1,45,137 per kg. Both metals subsequently extended their losses to more than 1% during the session, tracking weakness in international markets.\n\nThe latest decline comes as investors reassess the US Federal Reserve's interest-rate outlook, while higher US yields, a firm dollar and unwinding of long positions weigh on bullion. With both metals trading in deeply oversold territory, the key question is whether the correction is creating a buying opportunity or whether further downside lies ahead.\n\nInternational gold prices stabilised on Wednesday after declining more than 2% in the previous session, as investors awaited US inflation data for clues on the Federal Reserve's monetary policy outlook, according to a Reuters report.\n\nSpot gold was little changed at $3,548.03 an ounce as of 0520 GMT, while US gold futures for December delivery fell 0.4% to $3,546.90. Silver declined 0.9% to $40.47 an ounce after losing more than 5% in the previous session.\n\nSilver is also facing concerns over its industrial-demand outlook.", "source": "LiveMint Markets", "pub_date_str": "25 Nov 2026, 01:18 PM IST", "pub_date_relative": "2h ago"}, {"title": "India allocates 8,606 tonnes of raw cane sugar for export to US under Tariff Rate Quota scheme", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Agriculture \u203a India allocates 8,606 tonnes of raw cane sugar for export to US under Tariff Rate Quota scheme The Economic Times daily newspaper is available online now. Read Today's Paper India allocates 8,606 tonnes of raw cane sugar for export to US under Tariff Rate Quota scheme SECTIONS India allocates 8,606 tonnes of raw cane sugar for export to US under Tariff Rate Quota scheme PTI Last Updated: Nov 25, 2026, 01:16:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India has allocated 8,606 metric tonnes of raw cane sugar for export to the US under the Tariff Rate Quota (TRQ) scheme for the 2027 US fiscal year, running from October 1, 2026, to September 30, 2027. The scheme allows shipments at zero or concessional import duty.\n\nThe fall is new, the pattern is 11 years old: Making sense of gold's crash\n\nAs AI sharpens cyber attacks, should listed companies follow one standard in reporting them?\n\nKYC and KYB: Zydus Lifesciences \u2013 From the chemist\u2019s counter to US pharmacies. Part 1 of 3\n\nWhat would it take for the world to stop needing the Strait of Hormuz?\n\nHidden export winners: The unlikely products finding real buyers abroad\n\nIndia\u2019s USD25 bn copper drive moves from building smelters to securing mines\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "25 Nov 2026, 01:14 PM IST", "pub_date_relative": "2h ago"}, {"title": "Treasury yields fall as investors await key inflation signal", "full_content": "U.S. Treasury yields edged lower Wednesday as investors looked ahead to fresh inflation and spending data in a holiday-shortened trading week.\n\nThe 10-year Treasury note yield \u2014 the main benchmark for mortgages, auto loans and credit card debt \u2014 was 3 basis points lower at 4.8699%.\n\nThe yield on the 2-year Treasury note, which typically moves in line with short-term Federal Reserve interest rate decisions, was down more than 4 basis points at 4.6291%.\n\nThe longer-dated 30-year Treasury yield, which tends to track geopolitical events, was 2 basis points lower at 5.2695%.\n\nOne basis point equals 0.01%, or 1/100th of 1%, and yields and prices move inversely to one another.\n\nThe dip comes after yields steadied on Tuesday , with traders digesting softer demand for a 5-year Treasury auction.\n\nWith trading shortened this week due to the Thanksgiving holiday, investors are awaiting more data releases for clearer insights into the U.S. economic outlook.\n\nOctober's personal consumption expenditures price index \u2014 the Federal Reserve's preferred gauge of underlying inflation \u2014 is expected to remain unchanged month-over-month at 0.3%, according to economists polled by Dow Jones.", "source": "CNBC Top News", "pub_date_str": "25 Nov 2026, 01:14 PM IST", "pub_date_relative": "2h ago"}, {"title": "Telangana Inter Exams 2027: No Change In Colleges for Practical Tests As TSBIE Drops Jumbling Plan", "full_content": "Practical exams for TSBIE are scheduled to commence on January 29, 2027. Both first and second-year students will participate in the assessment.", "source": "NDTV Profit", "pub_date_str": "25 Nov 2026, 01:11 PM IST", "pub_date_relative": "2h ago"}, {"title": "Road To 1,000: How Many Goals Cristiano Ronaldo Needs After Al Nassr Vs Al Sadd Clash", "full_content": "Cristiano Ronaldo won a penalty himself and converted it in the 13th minute to give Al Nassr a lead against Al Sadd.", "source": "NDTV Profit", "pub_date_str": "25 Nov 2026, 01:10 PM IST", "pub_date_relative": "2h ago"}, {"title": "Gold, Silver Lose Shine: Yellow Metal Prices Fall Below Rs 1,21,000; White Metal Rates Under Rs 1,42,000", "full_content": "Gold and silver prices extended losses for another session as expectations of a US Federal Reserve rate hike weighed on sentiment.", "source": "NDTV Profit", "pub_date_str": "25 Nov 2026, 01:09 PM IST", "pub_date_relative": "2h ago"}, {"title": "Jio Financial Services vs Reliance vs Jio Platforms shares: Which Mukesh Ambani's stock to buy amid Dalal Street rally?", "full_content": "Jio Financial Services vs Reliance vs Jio Platforms shares: Amid a bull trend on Dalal Street (By 1:10 PM, Sensex was up 1.65%, Nifty was up by 1.25%, Bank Nifty was up by 1.15%), Reliance Group stocks are expected to attract investor attention, with the core group stock, Reliance Industries, up over 2%. Jio Platforms shares were up in morning trading but failed to sustain gains and retraced after the profit-booking trigger. Another Mukesh Ambani-led stock, Jio Financial Services, is up by over 2%.\n\nAccording to stock market experts, all three Reliance Group stocks are attractive buys at current market valuations. However, when it comes to buying Mukesh Ambani's stock, for an investor with a low risk appetite, Reliance Industries shares should be preferred, followed by Jio Platforms and Jio Financial Services. However, for an investor with a high risk appetite, Jio Platforms shares should be preferred, followed by Reliance Industries and Jio Financial Services.\n\nComparing the fundamentals of three flagship Reliance Group shares, Avinash Gorakshkar, Founder of Avinash Mentor Research, said, \u201cReliance Industries reported strong YoY growth during the July to September 2026 quarter on the consolidated revenue, EBITDA, and net profit front. This could become possible due to the massive recovery in the Oil-to-Chemicals (O2C) EBITDA, which grew about 70% YoY to around \u20b9 25,200 crore during the September 2026 quarter.\u201d\n\nGorakshkar said that O2C recovery is expected to continue in the next quarter as well, and hence the market is estimating strong Q3 Results 2026 from Reliance Industries.\n\nSpeaking on Jio Platforms' financials, Avinash Gorakshkar said, \u201cLike RIL, JPL too posted strong YoY growth in consolidated revenue, EBITDA and net profit.", "source": "LiveMint Markets", "pub_date_str": "25 Nov 2026, 01:09 PM IST", "pub_date_relative": "2h ago"}, {"title": "Traders pull back from closing auction ahead of Sebi\u2019s revised framework", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nMumbai: Participation in the closing auction session (CAS) has declined as market participants await the Securities and Exchange Board of India\u2019s (Sebi) revised framework, which will restore the volume-weighted average price (VWAP) mechanism on derivatives expiry days from next month.\n\nVolumes in CAS have fallen 22.4% since Sebi announced the revised framework on 15 October, declining to 5.35 crore trades as of 23 November. The fall was steeper initially, with volumes plunging nearly 56% through 20 November before recovering partially in the following session.\n\nThe decline marks a reversal from the initial months of the auction's introduction, when participation had steadily increased. Between 3 August and 15 October, CAS volumes had risen 45% to 3.75 crore trades. Sebi's decision to restore VWAP on derivatives expiry days, however, has changed that calculation, leaving participants reluctant to adapt to a mechanism that will now operate alongside the earlier system.\n\n\"Traders are staying away from CAS as they have visibility into the introduction of VWAP on expiry days,\" said Nilesh Sharma, executive director and president at Samco Securities. \"They are waiting it out for now. Earlier, people thought they had no choice but to participate in CAS as the sentiment was that it's here to stay. They had to adapt, but now that is not the case.\"\n\nThe revised framework will restore the 30-minute VWAP calculation for determining closing prices on derivatives expiry days, while retaining CAS on other trading days. Traders will therefore continue to operate under a combination of the two mechanisms, rather than see a complete withdrawal of the auction. This uncertainty has further weighed on participation.\n\n\"The mechanism Sebi introduced in October is still a combination, with VWAP on expiry days while the rest of the days use CAS.", "source": "LiveMint Markets", "pub_date_str": "25 Nov 2026, 12:19 PM IST", "pub_date_relative": "3h ago"}], "cfa": [{"title": "Budget carrier Norse Atlantic falls 74% after warning its finances are \u2018critical\u2019 amid soaring fuel costs", "full_content": "Norse Atlantic shares plummeted Wednesday after it revealed the company is in a \"critical financial situation\" as soaring fuel costs amid the Iran war strain budget carriers during the winter season.\n\nThe Norwegian low-cost carrier said its situation is dependent on securing financing for its short-term liquidity needs.\n\nThe company has had discussions about a potential strategic takeover as well as other options including ACMI contracts, which refer to short-term capacity leasing.\n\n\"Norse is also engaged in discussions with selected parties on short term financing, however, there can be no assurances that such discussions will result in a viable solution,\" it added.\n\nNorse said in October that it was forced to fly with reduced capacity that month, due to \"prolonged high fuel prices.\"", "source": "CNBC Top News", "pub_date_str": "25 Nov 2026, 03:26 PM IST", "pub_date_relative": "1m ago", "cfa_topics": ["Corporate Issuers", "Derivatives"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Nasdaq futures slide amid reports of fresh U.S. tariffs as tech sell-off intensifies: Live updates", "full_content": "U.S. stock futures were lower early Wednesday, following a slide in tech stocks during the regular session that drove the S&P 500 and Nasdaq Composite lower.\n\nTraders also looked ahead to fresh inflation data and parsed reports that the White House will unveil a barrage of new tariffs on major trade partners, including China and the European Union.\n\nDow Jones Industrial Average futures lost 391 points, or 0.8%, while S&P 500 futures declined 1.4%. Nasdaq-100 futures slumped 2.3%.\n\nAmbarella plunged 37% in U.S. extended trading after the designer of low-power AI vision and video chips issued fourth-quarter revenue guidance of $70 million to $75 million. That fell massively short of the $112 million analysts polled by LSEG were expecting.\n\nWall Street is coming off a losing session for the S&P 500 and Nasdaq Composite , after tech stocks gave back some of their gains from the prior session as Nvidia sank and Anthropic fell below its IPO price. The broader index fell 0.5% and the Nasdaq slid 1.5%. On the other hand, the 30-stock Dow , which has less exposure to tech, climbed more than 400 points, or 0.9%.\n\nThe choppy trading action was just the latest in a volatile month. Even before the ouster and reinstatement of Nvidia's Jensen Huang, and Democrats' sweep in the midterm elections, investors were deliberating the future of the artificial intelligence build-out amid a worsening macroeconomic outlook.\n\n\"Let's remember that the sell-off in the AI ecosystem predated the news about Huang and Nvidia,\" Liz Ann Sonders, chief investment strategist at Schwab Center for Financial Research, told CNBC's \" Closing Bell \" on Tuesday.\n\n\"The concerns about capex, the data center build-out, the spread between the cost of capital and return on invested capital, the bifurcation that's happening in the market now between sort of profitable segments of the market and unprofitable,\" she added. \"I think that is the bigger, more aggregate story.\"", "source": "CNBC Top News", "pub_date_str": "25 Nov 2026, 03:15 PM IST", "pub_date_relative": "12m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Tech rout deepens globally; Softbank falls 15%, Nvidia down 4.5% premarket", "full_content": "Technology stocks tumbled globally on Wednesday, as renewed concerns over the artificial intelligence trade rattle investors and Monday's rally continues to fade.\n\nNvidia was down 4.65% in premarket trading at 4:11 a.m. ET. Anthropic dropped 3.82% and AMD 4.85%. Anthropic's shares fell below its IPO price on Tuesday after a 6.54% drop.\n\nIn Europe, chip were more stable, with ASML , SAP , BESI and Infineon down by less than or around 1%.\n\nJapanese semiconductor stocks tied to the global AI supply chain were among the hardest hit. Advantest , a supplier of chip-testing equipment to Nvidia, plunged 12.94%. Tokyo Electron , which supplies chipmaking equipment to Nvidia's manufacturing partner TSMC, slumped 12.53%.\n\nTechnology-focused investor SoftBank Group shed 14.83%, while semiconductor inspection equipment maker Lasertec lost 11.23%.\n\nTech stocks have seen heightened volatility over the past few months amid concerns over capital expenditure, skepticism over return on investments, circular AI financing, with Jensen Huang's ouster as Nvidia CEO adding fresh worries, and his return sparking a massive rally.\n\nRolf Bulk, an analyst at The Futurum Group, said the renewed sell-off largely reflects lingering concerns over the sustainability of AI spending beyond 2027, with Huang's return doing little to fundamentally alter the outlook.\n\n\"There are still concerns on the sustainability of AI demand, ability of the sector to finance the build-out, and questions around power supply,\" Bulk said, adding that Japanese chip equipment makers were particularly vulnerable to a potential slowdown in AI infrastructure spending, given the highly cyclical nature of their business.", "source": "CNBC Top News", "pub_date_str": "25 Nov 2026, 03:12 PM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Corporate Issuers", "Alternative Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Germany\u2019s GDP grows 0.1% in Q3 2026, revised down slightly", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Nov 2026, 03:05 PM IST", "pub_date_relative": "22m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Cregis and Centroid Solutions Partner to Expand Digital Asset Payment Capabilities for Financial Institutions", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Nov 2026, 02:59 PM IST", "pub_date_relative": "28m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Prosus H1 FY27 slides: revenue scales to $5.7B, buyback drives EPS", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Nov 2026, 02:56 PM IST", "pub_date_relative": "31m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Poultry body seeks stock limits on maize, soyabean; warns of Rs 40-50/kg rise in chicken price", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Agriculture \u203a Poultry body seeks stock limits on maize, soyabean; warns of Rs 40-50/kg rise in chicken price The Economic Times daily newspaper is available online now. Read Today's Paper Poultry body seeks stock limits on maize, soyabean; warns of Rs 40-50/kg rise in chicken price SECTIONS Poultry body seeks stock limits on maize, soyabean; warns of Rs 40-50/kg rise in chicken price PTI Last Updated: Nov 25, 2026, 02:49:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The All India Poultry Breeders Association is urging the government to impose stock limits on maize and soyabean. Rising feed prices have caused significant distress for poultry farmers amid claims of artificial scarcity. Many poultry farms are shutting down as production costs exceed earnings from chicken sales. The association estimates that chicken prices could increase significantly if conditions do not improve soon.\n\nThe fall is new, the pattern is 11 years old: Making sense of gold's crash\n\nAs AI sharpens cyber attacks, should listed companies follow one standard in reporting them?\n\nKYC and KYB: Zydus Lifesciences \u2013 From the chemist\u2019s counter to US pharmacies. Part 1 of 3\n\nWhat would it take for the world to stop needing the Strait of Hormuz?\n\nHidden export winners: The unlikely products finding real buyers abroad\n\nIndia\u2019s USD25 bn copper drive moves from building smelters to securing mines\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "25 Nov 2026, 02:49 PM IST", "pub_date_relative": "38m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Multibagger Alert! Up 102% in 1 year, more rally seen in this small-cap power stock - here's why | Check target, upside", "full_content": "QPOWER Pranati Deva Published 25 Nov 2026, 02:45 PM IST Prefer Livemint on Google Multibagger power stock Quality Power Electrical Equipments has been giving strong returns to its investors in recent times. It has soared 102% in the last 1 year. Meanwhile, the small-cap stock has advanced 11% in 1 month, and 34% in 6 months.\n\nDespite strong returns, domestic brokerage house Dolat Capital sees more upside in the power stock going ahead.\n\nThe brokerage sees the company emerging as a key beneficiary of India's expanding power transmission infrastructure and the global shift towards high-voltage direct current (HVDC) technology. Initiating coverage on the stock, Dolat Capital has assigned a BUY rating with a target price of \u20b9 2,000, implying an upside of around 36% from its last closing price of \u20b9 1,468.50.\n\n\u201cThe number of globally qualified suppliers capable of serving HVDC and FACTS projects remains limited. Technical complexity, stringent reliability standards and lengthy customer-qualification cycles restrict the entry of new players,\u201d it noted.\n\nIndia's power transmission sector is entering a multi-year investment cycle, supported by rising electricity demand, renewable energy integration and the need to strengthen grid infrastructure. The National Electricity Plan envisages transmission investments of around \u20b9 9.15 trillion through FY32, including the addition of 33GW of HVDC capacity.\n\nThe global HVDC market is projected to expand from around $12.7 billion in CY25 to $17.6 billion by CY33. India's market is expected to grow faster, from $3 billion in 2024 to $5.9 billion by 2030, translating into a compound annual growth rate (CAGR) of 12.6%, according to the brokerage.\n\nQuality Power has a differentiated position in this market.", "source": "LiveMint Markets", "pub_date_str": "25 Nov 2026, 02:45 PM IST", "pub_date_relative": "41m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Anthropic's Potential Bond Issues May Be Rated Junk Despite $1.1 Trillion Valuation, Says Report", "full_content": "An investment-grade rating would give Anthropic access to the $8.6 trillion high-grade corporate bond market. In comparison, the US junk-bond market is estimated at around $1.7 trillion and typically carries higher borrowing costs.", "source": "NDTV Profit", "pub_date_str": "25 Nov 2026, 02:40 PM IST", "pub_date_relative": "47m ago", "cfa_topics": ["Equity Investments", "Fixed Income"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Asian Stocks to Slide as AI Trade Doubts Resurface: Markets Wrap - Bloomberg", "full_content": "Asian Stocks to Slide as AI Trade Doubts Resurface: Markets Wrap Bloomberg Stocks retreat as AI rebound stumbles, tariff threats loom Reuters SoftBank drops 15% as Wall Street AI sell-off ripples across Asian tech names CNBC Tech firms back in crosshairs as Huang rally reverses Yahoo Finance Asia\u2019s markets dive as return of Nvidia\u2019s Huang fails to quell AI doubts Al Jazeera", "source": "Google News Business", "pub_date_str": "25 Nov 2026, 02:40 PM IST", "pub_date_relative": "47m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Ionic Wealth Announces Rs 177 Crore Fundraise From Angel One To Ramp Up Growth", "full_content": "The company said it will focus on strengthening its portfolio-led proposition and its global capabilities.", "source": "NDTV Profit", "pub_date_str": "25 Nov 2026, 02:36 PM IST", "pub_date_relative": "51m ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "As markets recover, it's time to rebalance, not chase returns", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nThe Indian equity markets have staged a smart recovery over the past few weeks after two years of underperformance and heightened volatility. The Nifty has rebounded strongly, accompanied by substantial foreign institutional investor (FII) inflows and a more constructive stance from several international brokerages, including CLSA, Citigroup and Jefferies. Notably, FIIs have invested $7.5 billion in the first 10 sessions of November, the highest monthly inflow in five years.\n\nWhile these developments are encouraging, investors need to be careful not to confuse a market recovery with a signal to overhaul their investment strategy. Rather than chasing the rally or attempting to time the market, this may be an opportune moment to review portfolio allocations and undertake a much-needed rebalancing exercise.\n\nOne of the more interesting developments in recent years has been the change in Indian household asset allocation. Between 2023 and 2026, the share of gold in household financial asset allocation increased sharply from 15.4% to 24.2%. Much of this increase can be attributed to the substantial appreciation in gold prices rather than a corresponding increase in fresh investments.\n\nIn contrast, the allocation to equities barely moved, from 5.6% to 5.7% during the same period. This is despite a meaningful improvement in investor participation in equity markets. Monthly mutual fund SIP contributions, for instance, nearly doubled from \u20b9 16,928 crore in October 2023 to \u20b9 32,160 crore in October 2026.\n\nThough investors have continued to commit fresh money to equities, the correction in equity valuations over the past two years has largely offset the impact of these investments on overall portfolio values.", "source": "LiveMint Money", "pub_date_str": "25 Nov 2026, 02:27 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Rupee Hits 8-Month High Against Dollar, Gains 2% In November: 4 Reasons Behind The Rally", "full_content": "The currency has gained more than 2% in November, supported by a return of foreign investors to domestic equities, lower crude oil prices and measures by the Reserve Bank of India (RBI) to ease pressure on the foreign exchange market.", "source": "NDTV Profit", "pub_date_str": "25 Nov 2026, 02:20 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Gold prices crash 27% in 3 months: Golden opportunity to invest in jewellery or should households wait? What experts say", "full_content": "Gold prices in India have corrected sharply from their peak of around \u20b9 1.8 lakh per 10 grams in January to nearly \u20b9 1.2 lakh currently.\n\nOn Wednesday, 24K gold is priced at \u20b9 1,21,090 per 10 grams, down \u20b9 1,770 (1.44%), while 22K gold stood at \u20b9 1,10,999 per 10 grams at 1:35 pm.\n\nOn the MCX , December gold futures are trading at \u20b9 1,20,401 on 25 November, down around 15% over the past month and 27% over three months.\n\nThe sharp correction has raised a key question for households planning jewellery purchases: Is this the right time to buy gold, or could prices fall further?\n\nHere's what experts say about the gold price outlook and what jewellery buyers should consider before making a purchase.\n\nGaurav Garg, Head of Research at Lemonn, shared the following indicative price estimates for gold:\n\nGarg expects gold prices to rise soon. By the end of 2027, a recovery in global demand and a more supportive interest-rate environment could take 24K gold prices to \u20b9 1.45\u20131.60 lakh and 22K gold prices to \u20b9 1.33\u20131.47 lakh per 10 grams.\n\nGarg said the recent correction in gold prices has improved buying opportunities for households. Those with immediate requirements can use the correction to buy in phases rather than wait for the market to hit an exact bottom.", "source": "LiveMint Money", "pub_date_str": "25 Nov 2026, 02:17 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Derivatives", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Rollercoaster ride in stock market today: Nifty pares gains by 270 points, Sensex crashes over 800 from day's high", "full_content": "The Sensex and Nifty 50 retreated from their sharp intraday highs on Wednesday as investors booked profits at elevated levels. However, both benchmark indices remained firmly in positive territory, buoyed by continued foreign fund inflows and easing crude oil prices, helping domestic equities recover some of the losses incurred in the previous session.\n\nAt around 1:47 PM, the BSE Sensex was trading 1,272.59 points, or 1.54%, higher at 83,708.58, while the NSE Nifty 50 stood at 25,734.95, up 365 points, or 1.44\n\nEarlier in the session, the Sensex had rallied 2,062.22 points, or 2.5%, to an intraday high of 84,498.21. The Nifty 50 had also surged 602 points, or 2.4%, to touch 25,951.65 before surrendering a portion of its gains.\n\nThe total market capitalisation of BSE-listed companies surged by over \u20b9 2.2 lakh crore within minutes of Wednesday's opening bell, climbing to \u20b9 5,11,97,090.27 crore from \u20b9 5,09,75,499.68 crore on 23 November.\n\nAs the session progressed and benchmark indices pared some of their early gains, the combined market capitalisation stood at \u20b9 5,10,80,534.84 crore. This represented an increase of approximately \u20b9 1.05 lakh crore compared with the 23 November level.\n\nAccording to market analysts, the retreat from intraday highs was due to profit-booking following the sharp rally in early trade and a very weak global backdrop. The selling pressure was clearly there, with investors using the higher levels to exit rather than enter.\n\nSentiment was clearly under pressure as the Asian markets all delivered sharp declines. The Kospi was down 6.16%, the Nikkei 225 down 2.78%, the SSE Composite down 1.87% and the Hang Seng down 0.85%.", "source": "LiveMint Markets", "pub_date_str": "25 Nov 2026, 02:07 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Gold, Silver Rates Live Updates: Check Prices In Gujarat, Goa, Tamil, Nadu, Kerala And More", "full_content": "Gold price dipped slightly to Rs 1,22,250 per 10 grams in early trade on Wednesday as per MCX data.", "source": "NDTV Profit", "pub_date_str": "25 Nov 2026, 02:06 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Bengaluru man gets relief after consumer commission directs Aishwarya Co-op Society to refund \u20b92.5 lakh FD", "full_content": "An Urban District Consumer Disputes Redressal Commission in Bengaluru offered relief to a 65-year-old man after directing Aishwarya Co-operative Society to refund his fixed deposit of \u20b9 2.5 lakh, along with 13% annual interest, after the society failed to pay him interest from June 2024.\n\nAccording to a report in The Times of India , the commission, comprising president Ramachandra M S and members Nandini H Kumbhar and Savitha Airani, partly allowed the complaint filed by Gangadharaiah, a 65-year-old resident of Narasimhaiahnapalya, Magadi Main Road, against the society's president. In an order dated 30 September 2026, it held that the society was guilty of deficiency in service.\n\nBased in Rajajinagar, the society did not appear before the commission despite being allowed to do so. It was therefore placed ex parte, and the commission proceeded with the case in its absence.\n\nAccording to the report, Gangadharaiah said he deposited \u20b9 2.5 lakh with the society on 6 July 2021, at an interest rate of 13%. The society agreed to pay him monthly interest of \u20b9 2,700. It also issued a fixed deposit receipt valid from 6 July 2021 to 6 July 2022. The deposit was subsequently renewed on 6 July 2022, for another year, until 6 July 2023.\n\nThe society paid interest until June 2024, following which it reportedly stopped the payments and did not renew the 65-year-old man's fixed deposit. In his complaint, he alleged that his repeated requests for renewal of the deposit and payment of the outstanding dues did not receive satisfactory responses.\n\nFollowing these requests, he wrote to the Assistant Registrar of Co-operative Societies and several other authorities on 12 November 2024 and 13 February 2025, seeking repayment of the principal amount and interest within 15 days. However, he did not receive any response. The society was served a legal notice on 9 July 2025, but failed to act on it.", "source": "LiveMint Money", "pub_date_str": "25 Nov 2026, 01:55 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Stock Market Today: Sensex Cracks 1,100 Points From day's High, Nifty 50 Holds Above 25,700; Bajaj Finserv, IndiGo, HUL Top Gainers", "full_content": "Among sectors, Nifty FMCG, Nifty Private Bank, Nifty Pharma, Nifty IT and Nifty Auto traded higher, while selling was seen in Nifty Metals, Nifty Media, Nifty PSU Bank and Nifty Realty indices.", "source": "NDTV Profit", "pub_date_str": "25 Nov 2026, 01:50 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "PL Capital Raises Nifty Target To 28,561: Amnish Aggarwal Names 18 Stocks For The Next Rally", "full_content": "In its India strategy report titled 'Resilient Growth Amid Global & Weather Headwinds', analyst Amnish Aggarwal said the brokerage remains \"cautiously optimistic\" on equities, although it expects the market to consolidate with a positive bias.", "source": "NDTV Profit", "pub_date_str": "25 Nov 2026, 01:48 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "FIIs back with a bang! Inflows return to Indian stocks after 2-month sell-off; 14 sectors attracted foreign money | List", "full_content": "Pranati Deva Published 25 Nov 2026, 01:40 PM IST Prefer Livemint on Google FII inflows : Foreign institutional investors ( FIIs ) have made a sharp comeback in Indian equities, pumping $13 billion into the market in just 14 trading sessions in November after withdrawing a substantial amount of money over the previous two months. The turnaround marks a significant shift in foreign investor sentiment, supported by falling crude oil prices, easing geopolitical concerns and a stronger-than-expected recovery in corporate earnings.\n\nAccording to JM Financial's strategy report, FIIs invested $13 billion between November 2 and November 20, more than reversing the combined net outflows of $6.3 billion recorded in September and October 2026. Foreign investors were net buyers in all 14 trading sessions during this period, with three sessions recording inflows of more than $1.5 billion each.\n\nThe scale of the buying is significant against the backdrop of sustained foreign selling through much of 2026. JM Financial said attractive valuations among large-cap Indian stocks and a rotation away from Asian artificial intelligence ( AI )-linked trades have also helped redirect foreign capital towards India.\n\nA sharp correction in crude oil prices has been one of the key factors improving India's investment outlook. Brent crude fell from $117.6 per barrel at the end of October to $95.8 by November 15, before declining further to around $88 currently. This represents a fall of approximately 25% from the end-October level.\n\nLower crude prices have eased concerns about India's import bill, inflation and external balances. The improvement in geopolitical sentiment has also played a role. JM Financial also pointed to the Democrats' victory in the US midterm elections as an important inflection point, with markets interpreting the result as increasing pressure on Washington to seek an end to the Iran conflict.", "source": "LiveMint Markets", "pub_date_str": "25 Nov 2026, 01:40 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "EPFO 3.0 launch by February 2027: From UPI withdrawals to retirement SWP, 6 key changes PF members should know about", "full_content": "The Employees\u2019 Provident Fund Organisation ( EPFO ) is preparing a series of changes to make provident fund services faster, more accessible and more flexible for subscribers.\n\nFrom withdrawing money through UPI and ATMs to receiving retirement savings in instalments, several initiatives could change how members access and manage their Employees' Provident Fund ( EPF ) savings.\n\nHere are six important developments EPF subscribers should know about.\n\nEPFO is preparing to overhaul its existing technology infrastructure as part of the EPFO 3.0 initiative. The upgraded system is expected to streamline services, improve claim processing and make it easier for members to access and manage their provident fund accounts.\n\nAccording to a Financial Express report dated 23 November, a person familiar with the matter said EPFO could announce the rollout of EPFO 3.0 at its next Central Board of Trustees (CBT) meeting in February 2027. The CBT approved the framework in October 2025.\n\nThe new platform is being designed to handle information relating to around 200 crore members over the next 50 years. This is significantly higher than EPFO's current membership base of more than 36 crore active members.\n\nEPFO members could soon have additional options for accessing their provident fund savings. Under EPFO 3.0, the organisation plans to introduce withdrawals through ATMs and the Unified Payments Interface ( UPI ).\n\nThe UPI facility could be introduced as early as December 2026, according to the FE report. The technology is reportedly ready, with testing nearing completion. This could make it quicker to access eligible PF balances and reduce members' dependence on the existing online claim process.", "source": "LiveMint Money", "pub_date_str": "25 Nov 2026, 01:34 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Derivatives", "Alternative Investments"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Tech stocks slide as confidence in AI trade fades", "full_content": "Nasdaq 100 set to open lower as weeks-long sell-off continues", "source": "FT Markets", "pub_date_str": "25 Nov 2026, 01:24 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "MCX rates: Gold crashes 13%, silver plunges 20% in Nov 2026; is worst over? What should precious metals investors do?", "full_content": "MCX rates: Gold and silver are losing their shine in November, with a sharp sell-off in domestic futures markets prompting investors to reassess their exposure to precious metals. MCX gold has fallen around 13% so far this month, while silver has plunged nearly 20%, extending losses after a strong rally over the past year. The correction has also pushed gold down around 11% and silver nearly 40% on a year-to-date basis, according to the figures provided.\n\nThe weakness continued on Wednesday, 25 November, with MCX gold opening 0.24%, or \u20b9 294, lower at \u20b9 1,22,035 per 10 grams. MCX silver began the session 0.21%, or \u20b9 301, lower at \u20b9 1,45,137 per kg. Both metals subsequently extended their losses to more than 1% during the session, tracking weakness in international markets.\n\nThe latest decline comes as investors reassess the US Federal Reserve's interest-rate outlook, while higher US yields, a firm dollar and unwinding of long positions weigh on bullion. With both metals trading in deeply oversold territory, the key question is whether the correction is creating a buying opportunity or whether further downside lies ahead.\n\nInternational gold prices stabilised on Wednesday after declining more than 2% in the previous session, as investors awaited US inflation data for clues on the Federal Reserve's monetary policy outlook, according to a Reuters report.\n\nSpot gold was little changed at $3,548.03 an ounce as of 0520 GMT, while US gold futures for December delivery fell 0.4% to $3,546.90. Silver declined 0.9% to $40.47 an ounce after losing more than 5% in the previous session.\n\nSilver is also facing concerns over its industrial-demand outlook.", "source": "LiveMint Markets", "pub_date_str": "25 Nov 2026, 01:18 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Equity Investments", "Derivatives", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "India allocates 8,606 tonnes of raw cane sugar for export to US under Tariff Rate Quota scheme", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Agriculture \u203a India allocates 8,606 tonnes of raw cane sugar for export to US under Tariff Rate Quota scheme The Economic Times daily newspaper is available online now. Read Today's Paper India allocates 8,606 tonnes of raw cane sugar for export to US under Tariff Rate Quota scheme SECTIONS India allocates 8,606 tonnes of raw cane sugar for export to US under Tariff Rate Quota scheme PTI Last Updated: Nov 25, 2026, 01:16:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India has allocated 8,606 metric tonnes of raw cane sugar for export to the US under the Tariff Rate Quota (TRQ) scheme for the 2027 US fiscal year, running from October 1, 2026, to September 30, 2027. The scheme allows shipments at zero or concessional import duty.\n\nThe fall is new, the pattern is 11 years old: Making sense of gold's crash\n\nAs AI sharpens cyber attacks, should listed companies follow one standard in reporting them?\n\nKYC and KYB: Zydus Lifesciences \u2013 From the chemist\u2019s counter to US pharmacies. Part 1 of 3\n\nWhat would it take for the world to stop needing the Strait of Hormuz?\n\nHidden export winners: The unlikely products finding real buyers abroad\n\nIndia\u2019s USD25 bn copper drive moves from building smelters to securing mines\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "25 Nov 2026, 01:14 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Treasury yields fall as investors await key inflation signal", "full_content": "U.S. Treasury yields edged lower Wednesday as investors looked ahead to fresh inflation and spending data in a holiday-shortened trading week.\n\nThe 10-year Treasury note yield \u2014 the main benchmark for mortgages, auto loans and credit card debt \u2014 was 3 basis points lower at 4.8699%.\n\nThe yield on the 2-year Treasury note, which typically moves in line with short-term Federal Reserve interest rate decisions, was down more than 4 basis points at 4.6291%.\n\nThe longer-dated 30-year Treasury yield, which tends to track geopolitical events, was 2 basis points lower at 5.2695%.\n\nOne basis point equals 0.01%, or 1/100th of 1%, and yields and prices move inversely to one another.\n\nThe dip comes after yields steadied on Tuesday , with traders digesting softer demand for a 5-year Treasury auction.\n\nWith trading shortened this week due to the Thanksgiving holiday, investors are awaiting more data releases for clearer insights into the U.S. economic outlook.\n\nOctober's personal consumption expenditures price index \u2014 the Federal Reserve's preferred gauge of underlying inflation \u2014 is expected to remain unchanged month-over-month at 0.3%, according to economists polled by Dow Jones.", "source": "CNBC Top News", "pub_date_str": "25 Nov 2026, 01:14 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Road To 1,000: How Many Goals Cristiano Ronaldo Needs After Al Nassr Vs Al Sadd Clash", "full_content": "Cristiano Ronaldo won a penalty himself and converted it in the 13th minute to give Al Nassr a lead against Al Sadd.", "source": "NDTV Profit", "pub_date_str": "25 Nov 2026, 01:10 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Gold, Silver Lose Shine: Yellow Metal Prices Fall Below Rs 1,21,000; White Metal Rates Under Rs 1,42,000", "full_content": "Gold and silver prices extended losses for another session as expectations of a US Federal Reserve rate hike weighed on sentiment.", "source": "NDTV Profit", "pub_date_str": "25 Nov 2026, 01:09 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Jio Financial Services vs Reliance vs Jio Platforms shares: Which Mukesh Ambani's stock to buy amid Dalal Street rally?", "full_content": "Jio Financial Services vs Reliance vs Jio Platforms shares: Amid a bull trend on Dalal Street (By 1:10 PM, Sensex was up 1.65%, Nifty was up by 1.25%, Bank Nifty was up by 1.15%), Reliance Group stocks are expected to attract investor attention, with the core group stock, Reliance Industries, up over 2%. Jio Platforms shares were up in morning trading but failed to sustain gains and retraced after the profit-booking trigger. Another Mukesh Ambani-led stock, Jio Financial Services, is up by over 2%.\n\nAccording to stock market experts, all three Reliance Group stocks are attractive buys at current market valuations. However, when it comes to buying Mukesh Ambani's stock, for an investor with a low risk appetite, Reliance Industries shares should be preferred, followed by Jio Platforms and Jio Financial Services. However, for an investor with a high risk appetite, Jio Platforms shares should be preferred, followed by Reliance Industries and Jio Financial Services.\n\nComparing the fundamentals of three flagship Reliance Group shares, Avinash Gorakshkar, Founder of Avinash Mentor Research, said, \u201cReliance Industries reported strong YoY growth during the July to September 2026 quarter on the consolidated revenue, EBITDA, and net profit front. This could become possible due to the massive recovery in the Oil-to-Chemicals (O2C) EBITDA, which grew about 70% YoY to around \u20b9 25,200 crore during the September 2026 quarter.\u201d\n\nGorakshkar said that O2C recovery is expected to continue in the next quarter as well, and hence the market is estimating strong Q3 Results 2026 from Reliance Industries.\n\nSpeaking on Jio Platforms' financials, Avinash Gorakshkar said, \u201cLike RIL, JPL too posted strong YoY growth in consolidated revenue, EBITDA and net profit.", "source": "LiveMint Markets", "pub_date_str": "25 Nov 2026, 01:09 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Traders pull back from closing auction ahead of Sebi\u2019s revised framework", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nMumbai: Participation in the closing auction session (CAS) has declined as market participants await the Securities and Exchange Board of India\u2019s (Sebi) revised framework, which will restore the volume-weighted average price (VWAP) mechanism on derivatives expiry days from next month.\n\nVolumes in CAS have fallen 22.4% since Sebi announced the revised framework on 15 October, declining to 5.35 crore trades as of 23 November. The fall was steeper initially, with volumes plunging nearly 56% through 20 November before recovering partially in the following session.\n\nThe decline marks a reversal from the initial months of the auction's introduction, when participation had steadily increased. Between 3 August and 15 October, CAS volumes had risen 45% to 3.75 crore trades. Sebi's decision to restore VWAP on derivatives expiry days, however, has changed that calculation, leaving participants reluctant to adapt to a mechanism that will now operate alongside the earlier system.\n\n\"Traders are staying away from CAS as they have visibility into the introduction of VWAP on expiry days,\" said Nilesh Sharma, executive director and president at Samco Securities. \"They are waiting it out for now. Earlier, people thought they had no choice but to participate in CAS as the sentiment was that it's here to stay. They had to adapt, but now that is not the case.\"\n\nThe revised framework will restore the 30-minute VWAP calculation for determining closing prices on derivatives expiry days, while retaining CAS on other trading days. Traders will therefore continue to operate under a combination of the two mechanisms, rather than see a complete withdrawal of the auction. This uncertainty has further weighed on participation.\n\n\"The mechanism Sebi introduced in October is still a combination, with VWAP on expiry days while the rest of the days use CAS.", "source": "LiveMint Markets", "pub_date_str": "25 Nov 2026, 12:19 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation question
