    const allData = {"general": [{"title": "Want to sell inherited agricultural land? Here are the tax breaks available", "full_content": "It is assumed that the agricultural land is urban agricultural land, located within the specified limits of a municipality or cantonment board, depending on its population. If the land is located beyond these specified limits, capital gains from its sale would not be taxable. It is also assumed that your father acquired the land at least two years before the intended sale and that all three of you are tax residents of India.\n\nAs the property is agricultural land, each of you may be able to claim an exemption under Section 54F (Section 86 of the Income Tax Act, 2025) to the extent the sale proceeds are reinvested in a residential house property. Alternatively, an exemption may be available under Section 54B (Section 83 of the 2025 Act) if the proceeds are used to purchase another agricultural land, assuming the inherited land was being cultivated by your father.\n\nThe three of you do not have to jointly reinvest the proceeds in a single residential property or parcel of agricultural land. Each of you can invest separately. However, for Section 54F, each person can claim the exemption for only one residential property.\n\nThe exemption under Section 86 is available provided you do not own more than one residential property, other than the new property, on the date of transfer of the agricultural land. If you purchase a residential property, the investment must be made within one year before or two years after the sale of the land.\n\nIf you construct a residential property, construction must be completed within three years of the sale. The amount eligible for exemption is capped at \u20b9 10 crore.\n\nFor Section 54B, the investment in agricultural land must be made within two years of the sale of the inherited land. The newly acquired agricultural land must then be held for at least three years from the date of purchase.\n\nYou may also claim an exemption under Section 54EC (Section 85 of the Income Tax Act, 2025) by investing the capital gains in specified capital gains bonds.", "source": "LiveMint Money", "pub_date_str": "30 Aug 2026, 06:41 PM IST", "pub_date_relative": "19m ago"}, {"title": "U.S. Treasury's Bessent faces G20 diplomacy test amid tariffs, Iran war, bond turmoil", "full_content": "U.S. Treasury Secretary Scott Bessent faces a major test of his economic diplomacy skills this week as he presses finance leaders from the G20 major economies to shrink global trade imbalances, boost growth and sever business ties to Iran, while trying to calm worries about rising U.S. debt and bond yields.\n\nAfter shunning the Group of 20 process last year in South Africa, Bessent is seeking to revamp it under U.S. leadership to push the Trump administration's worldview in the Blue Ridge Mountains city of Asheville, North Carolina.\n\nThe meeting of finance ministers and central bank governors on Monday and Tuesday comes at a time of massive uncertainty over the Trump administration's next tariff moves, its festering trade war with close ally Canada , and high energy and commodity prices due to the Iran war.\n\nThe unresolved conflict has kept the Strait of Hormuz closed, sapping growth from nearly all G20 economies. And Bessent has warned that countries face secondary U.S. sanctions if they continue to buy Iranian oil or facilitate other transactions with Tehran. On Friday he imposed curbs on a bank based in G20 member Egypt over links to Iran through its branches in the United Arab Emirates.\n\nThe combination of pressures adds up to potentially more discord in the widely diverse forum that includes China and Russia and has a hard time agreeing on any collective action while largely ignoring geopolitical tensions such as the war in Ukraine .\n\n\"Secretary Bessent will want to put Iran front and center and talk about tightening sanctions on Iran, and many countries around the G20 table will want to talk about anything else,\" said Josh Lipsky, international economics chair at the Atlantic Council.", "source": "CNBC Top News", "pub_date_str": "30 Aug 2026, 06:40 PM IST", "pub_date_relative": "21m ago"}, {"title": "Am I too old for Roth conversions? I\u2019m 84 and my wife is 77. We have $8 million saved.", "full_content": "\u201cWe are reluctant to pay a financial adviser 2% of assets \u2014 roughly $160,000 per year.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "30 Aug 2026, 06:31 PM IST", "pub_date_relative": "30m ago"}, {"title": "Jobs report, Broadcom results pose next hurdles for stock market rally", "full_content": "", "source": "Investing.com News", "pub_date_str": "30 Aug 2026, 06:30 PM IST", "pub_date_relative": "30m ago"}, {"title": "What new tariff walls in U.S.-Canada trade war mean for the economy's critical metals", "full_content": "As the U.S. and Canada stare down tens of billions of dollars in dueling tariff regimes as a result of President Trump's new trade war against the nation's second-biggest trading partner, companies, economists, and investors are back in the game of attempting to forecast the level of volatility to expect on corporate balance sheets and in stock prices.\n\nThe U.S. government's 50% tariffs on a wide range of Canadian goods were met with Canada's $20 billion in retaliatory tariffs slated to go into effect on Sept. 8. They encompass more than 700 U.S. goods, meant to mirror the size of Trump's import taxes on Canadian wine, cement, hockey sticks and more. The counter-tariffs, which range from 15% to 50%, target a wide array of U.S. imports into Canada, including dairy, seafood, appliances, wood and paper products, and clothes.\n\nThere were some real-time market winners as the new trade war dominated headlines last Monday. Consider the reaction in steel and materials stocks, including Nucor , Steel Dynamics , Cleveland-Cliffs and Century Aluminum , which all shot up on Monday after the U.S.-Canada ed on Sunday to find thousands of people missing after a glacier collapse unleashed a catastrophic mudslide across the Himalayas, as they faced challenging weather conditions and rising water levels.\n\nAuthorities said the death toll rose to 750 by Sunday morning, with more than 3,000 people missing on both sides of the Nepal-China border after a torrent of ice, rock, mud and debris swept through mountain valleys and rivers on Wednesday, causing widespread devastation.\n\nThe Red Cross has estimated that more than 90,000 people are likely to have been affected by the disaster, which China has linked to the effects of climate change.\n\nChinese Foreign Minister Wang Yi told his Nepalese counterpart during a Saturday telephone call that the mudslide was their \"most severe cross-border disaster\" in recent years and that rescue operations had risen to an unprecedented level of difficulty and complexity, state broadcaster CCTV reported.\n\nNepal's disaster authority said 734 people had died, 2,498 remained missing and 7,514 had been rescued. On the Chinese side, authorities said 16 people were killed in Gyirong County and 546 were missing.\n\nBeijing said 261 foreign nationals from 23 countries were unaccounted for in Tibet, near a key border crossing with Nepal.\n\nThe scale of the disaster has complicated rescue efforts across the rugged Himalayan terrain.\n\nLocal police in Nepal told Reuters that residents and rescue workers had moved to higher ground after the Trishuli River's water levels rose in recent hours following fresh rainfall, raising fears of additional flooding.", "source": "CNBC Top News", "pub_date_str": "30 Aug 2026, 06:06 PM IST", "pub_date_relative": "54m ago"}, {"title": "India mandates IST as common time reference; gives 180-day window for compliance", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a India mandates IST as common time reference; gives 180-day window for compliance The Economic Times daily newspaper is available online now. Read Today's Paper India mandates IST as common time reference; gives 180-day window for compliance SECTIONS India mandates IST as common time reference; gives 180-day window for compliance ET Online Last Updated: Aug 30, 2026, 06:04:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis New rules mandate Indian Standard Time as the single national reference. These rules will come into force 180 days after their official gazette publication. The move aims to synchronize digital and technology-based systems across India. It also reduces dependence on foreign satellite-based time sources. A pilot demonstration network is currently testing this initiative.\n\nET Prime special series: 2013 to 2026. Not years, but evidence: Power Grid, Part 2\n\nBehind the sugar price drop: Exports, imports and a non-factor called ethanol\n\nAs IndiGo, Air India scramble for pilots, fresh headwinds hit hard\n\nWhen a CFO resigns, is \u2018personal reasons\u2019 explanation enough?\n\nFCNR (B) scheme garners USD65 bn, but why isn't the rupee gaining?\n\nET Prime special: Bigger, Better or Both? Understanding business to figure out the mystery: Power Grid Corp \u2013 Part 1\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "30 Aug 2026, 06:04 PM IST", "pub_date_relative": "57m ago"}, {"title": "Why Gurgaon court upheld \u20b92 lakh monthly maintenance for estranged wife despite husband\u2019s 50% income drop", "full_content": "A family court in Gurgaon has directed a husband to pay \u20b9 2 lakh a month as maintenance to his estranged wife, rejecting his argument that a fifty per cent decline in his income and \u20b9 1.7 crore home loan liabilities had reduced his ability to make alimony payments.\n\nThe husband\u2019s income tax returns showed that his annual taxable income had fallen by nearly 50%. However, the court did not accept the decline as sufficient justification for reducing or avoiding his maintenance obligation. It directed him to deposit \u20b9 2 lakh with his wife by the 10th of every month.\n\nThe husband argued that his net annual salary had dropped to around \u20b9 36 lakh. He also pointed to outstanding home loan liabilities of approximately \u20b9 1.7 crore and said that he had financial responsibilities towards his parents.\n\nDespite these submissions, the court maintained the monthly maintenance amount at \u20b9 2 lakh.\n\nThe wife had originally sought \u20b9 4 lakh per month for herself and the couple\u2019s children, besides \u20b9 7.5 lakh towards litigation expenses, according to a Times of India report.\n\nThe couple married in Lucknow on July 12, 2005, and have twin children. The wife sought monthly maintenance from her husband, who works as a senior executive with Deloitte.\n\nIn his latest plea, the husband argued that his financial circumstances had changed considerably because of the fall in his annual income. He said he was already spending approximately \u20b9 19.2 lakh each year on the children\u2019s boarding education.\n\nThe family court, however, was not convinced by the explanation offered for the sharp reduction in income. Since the husband continued to hold the same employment, the court considered his earlier earning capacity while assessing the appropriate maintenance amount.", "source": "LiveMint Money", "pub_date_str": "30 Aug 2026, 06:03 PM IST", "pub_date_relative": "57m ago"}, {"title": "Icelanders reject reopening talks to join the EU despite Trump's Greenland threats", "full_content": "Icelanders voted to reject resuming talks to join the European Union , as issues such as domestic control over fishing appeared to override geopolitical security concerns.\n\nBroadcaster RUV reported that 52.8% of voters rejected the government's push to reopen EU membership negotiations, while 47.2% voted in favor.\n\nThe question put to the Nordic nation of nearly 400,000 was whether Iceland should resume accession negotiations with the European Union.\n\nA majority \"yes\" vote would have led to a negotiated agreement being put to a second referendum for Icelanders to accept or reject.\n\nThe debate has taken on deeper significance in the wake of U.S. President Donald Trump 's Arctic saber-rattling .\n\nBut in the end, concern over the potential loss of control over its fishing industry and an erosion of national identity won out over how Iceland might be affected by geopolitical rivalries.\n\n\"The 'No' side succeeded because it tapped into the most fundamental driver of Icelandic national identity: the demand for absolute self-governance. This is inextricably linked to control over natural resources and fisheries, which forms the very heart of the Icelandic understanding of sovereignty,\" said Eir\u00edkur Bergmann, professor of politics at Iceland's Bifr\u00f6st University.\n\nFishing's share of Iceland's broader economy has declined over the decades, even as seafood remains a major export industry.", "source": "CNBC Top News", "pub_date_str": "30 Aug 2026, 06:02 PM IST", "pub_date_relative": "58m ago"}, {"title": "PM Modi\u2019s Uzbekistan Visit Yields 11 Key Outcomes: What It Means For India | Full List", "full_content": "From critical minerals and UPI to finance, tourism and education, India deepens its strategic footprint in Central Asia", "source": "NDTV Profit", "pub_date_str": "30 Aug 2026, 06:02 PM IST", "pub_date_relative": "58m ago"}, {"title": "\u2018I feel shoehorned\u2019: My father funded my $800,000 Roth IRA. Does that give him the right to say how I invest it?", "full_content": "\u201cHis argument is essentially that, since my parents provided the money for the Roth, they have a say in how I invest it.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "30 Aug 2026, 06:02 PM IST", "pub_date_relative": "59m ago"}, {"title": "Sher-E-Punjab T20 League 2026: Live Streaming, Telecast, Schedule, Teams, Squads And Format", "full_content": "The Sher-E-Punjab T20 League 2026 begins August 30, with six teams competing in 27 matches featuring Punjab stars such as Shubman Gill and Abhishek Sharma.", "source": "NDTV Profit", "pub_date_str": "30 Aug 2026, 06:00 PM IST", "pub_date_relative": "1h ago"}, {"title": "India vs Thailand Women Live Streaming: When And Where To Watch Women's Asia Cup 2026 Match Online?", "full_content": "India take on Thailand in their opening Women's Asia Cup 2026 fixture, with Harmanpreet Kaur's side aiming to begin their campaign with a win in Dubai.", "source": "NDTV Profit", "pub_date_str": "30 Aug 2026, 06:00 PM IST", "pub_date_relative": "1h ago"}, {"title": "NASA's newest space telescope launches on a quest to explore the hidden universe", "full_content": "NASA's newest crown jewel blasted off Sunday to hunt for planets around other stars, explore secret dark energy and survey the cosmos like never before.\n\nSpaceX launched the $4.3 billion Roman Space Telescope shortly after daybreak aboard a triple-the-firepower Falcon Heavy rocket from Kennedy Space Center. Roman blazed toward an observation point 1 million miles (1.6 million kilometers) away that's home to the Webb Space Telescope, one of NASA's other big-ticket eyes in the sky.\n\nThe bus-sized telescope \u2014 named after the late Nancy Grace Roman, NASA's first chief astronomer \u2014 will take more than three months to reach its destination. Once there, it will cast the widest gaze yet on the hidden parts of the universe from space, uncovering the unimaginable with unsurpassed speed.\n\n\"It's going to find thousands of supernovae, tens of thousands of planets, billions of galaxies and tens of billions of stars,\" said NASA science mission director Nicky Fox. \"It's going to be able to do things that we've never been able nds after the Supreme Court ruled in February that the International Emergency Economic Powers Act did not authorize President Donald Trump to impose the tariffs. That money began flowing in during the second quarter, as retailers saw major boosts to their profits.\n\nFor the most part, those returns have helped companies offset cost inflation and prop up margins, especially as they face cost pressures like the rising price of fuel. But the way those retailers have reported those refunds and incorporated them into their earnings has differed greatly, leading to confusion about how to read the strength of their results and their future outlooks.\n\n\"These trails aren't always clean in terms of finding the right way to apply, in a fair sense, the rebate to prices,\" Bryan Eshelman, a managing director in the retail practice at consulting firm AlixPartners, told CNBC.\n\nEshelman said there are two factors at play with how retailers handled the refunds. Determining where the extra money goes depends largely on the retailer's price position in the market, where more value-driven companies are likely to apply funds to keep prices lower and \"proclaim that to the marketplace,\" he said.\n\nThe tariff refund situation has been further complicated for companies depending on whether they are the importer of record for the products, which determines who gets the refunds, Eshelman said. Much of what's sold in stores isn't necessarily imported by the retailer, or U.S. manufacturers may be the ones receiving rebates for raw materials.\n\n\"There's also just the reality of record-keeping internal to retailers and whether or not they easily have a way to attribute the rebate directly back to a product that was already sold,\" he said.", "source": "CNBC Top News", "pub_date_str": "30 Aug 2026, 05:30 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect m     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
