<script>

    const allData = {"general": [{"title": "Private payrolls rose by 38,000 in August, less than expected, ADP reports", "full_content": "Private U.S. companies added jobs at a slightly slower-than-expected pace in August, with gains concentrated heavily in health care and a few other industries, ADP reported Wednesday.\n\nThe payrolls processing firm said firms added 38,000 workers, fewer than the upwardly revised 46,000 in July and below the Dow Jones consensus estimate for 47,000.\n\nThough job creation held positive, August was the smallest gain since January and reflective of a broader slowdown in the labor market. Moreover, most of the jobs came from three sectors, with multiple others showing declines.\n\nEducation and health services added 45,000 to lead all categories, with the latter group being at the forefront of employment growth.\n\nLeisure and hospitality added 16,000 positions an construction was up 12,000. Outside of that, though, there were few growth areas.\n\nManufacturing lost 17,000 jobs, professional and business services was off 16,000 and both the natural resources and mining as well as trade, transportation and utilities reported declines of 5,000.\n\nAlmost all of the gains came from big business, with companies employing 500 or more workers adding 34,000 while those with fewer than 50 employees rose by 3,000.\n\nADP's numbers also showed that pay gains held steady for the month. The firm added a feature in August in which it broke down growth between base and gross pay, the latter including tips, commissions, bonuses and other earnings.", "source": "CNBC Top News", "pub_date_str": "02 Sep 2026, 07:01 PM IST", "pub_date_relative": "3m ago"}, {"title": "Uber to cut 10% of workforce in bid to move 'simpler and faster'", "full_content": "Uber on Wednesday announced plans to slash 10% of its workforce in a move to consolidate management layers and trim costs.\n\n\"The changes we're making today are designed to do two things: make Uber simpler and faster, and create more capacity to invest in our future,\" CEO Dara Khosrowshahi wrote in an email to employees.\n\nThe ride-hailing company's shares rose about 2% in premarket trading.\n\nUber declined to comment on the number of jobs cut. The company had around 34,000 employees at the end of 2025, according to an annual filing.\n\nUber is the latest company to flatten management structures to speed up decision-making and improve efficiency. Khosrowshahi did not attribute the cuts to artificial intelligence, which has been responsible for a recent wave of tech layoffs .\n\nThe changes include cutting small teams consisting of one to two reports by nearly half and trimming employees seven steps away from the CEO by 20%. Khosrowshahi said Uber has outgrown many of these structures at its current size.\n\nUber is also combining more teams and concentrating more employees in hubs like New York and San Francisco. The company will allow about 1% to continue working remotely, Khosrowshahi said.\n\n\"A leaner organization will mean clearer ownership, faster decisions, and more time spent building rather than coordinating,\" he said.", "source": "CNBC World Economy", "pub_date_str": "02 Sep 2026, 07:00 PM IST", "pub_date_relative": "4m ago"}, {"title": "Businesses created the fewest new jobs in 7 months, ADP says. Hiring slowed in the summer.", "full_content": "U.S. businesses created just 38,000 new jobs in August, ADP said, the second small increase in a row, pointing to a slowdown in hiring during the summer.", "source": "MarketWatch Top Stories", "pub_date_str": "02 Sep 2026, 06:56 PM IST", "pub_date_relative": "9m ago"}, {"title": "G20 live updates: Nvidia's Huang pushes for AI infrastructure in every country", "full_content": "Artificial intelligence is taking center stage at the G20 gatherings this week.\n\nNvidia CEO Jensen Huang, Anthropic Co-Founder Tom Brown and OpenAI CEO Sam Altman highlight the tech-focused guests on Wednesday for day 2 of the G20 Innovation Ministerial in Chapel Hill, North Carolina.\n\nCommerce Secretary Howard Lutnick and White House Office of Science and Technology Policy Director Michael Kratsios are leading the conference, which gathers representatives of the G20 nations , including China, Brazil, Canada, Germany and others.\n\nMeta CEO Mark Zuckerberg and Tesla / SpaceX CEO Elon Musk were among the tech titans at Tuesday's session.\n\nNvidia CEO Jensen Huang said that AI is as foundational to every country's development as core infrastructure.\n\n\"What every single country will have to do is you need to recognize that this is infrastructure, just as its water, roads, electricity, the internet,\" Huang told Commerce Secretary Howard Lutnick in a fireside chat.\n\n\"Every single country needs to build infrastructure so that you could support your own local economy,\" he said.\n\nHuang referenced his favored \"five-layer cake\" analogy for AI, with energy at the bottom, followed by chips, data centers, AI models themselves, and data and applications.", "source": "CNBC World Economy", "pub_date_str": "02 Sep 2026, 06:52 PM IST", "pub_date_relative": "12m ago"}, {"title": "Bond market sell-off: How investors can move and protect their money as rates rise", "full_content": "There's been a lot of noise in the bond market lately, and with the 10-year treasury hitting its highest level since 2023 on Wednesday, what's giving investors pause isn't going away.\n\nBetween planned Treasury buybacks and the Federal Reserve's latest announcement signaling a possible rate hike that puts the agency at odds with President Donald Trump's desires, many bond owners are scratching their heads about what's next. This comes amid broader inflation concerns weighing on bondholders, a roughly $2 trillion federal deficit, and over $40 trillion in government debt that doesn't show signs of easing.\n\n\"Tuning out the noise is one of the hardest things for anyone to do,\" said Ian Toner, partner and head of investments in the institutional consulting practice at New York-based Cerity Partners. Nonetheless, he cautions investors who are considering moving money based on headlines to think hard about whether something has fundamentally changed in the economy or the market on a long-term basis or whether they're reacting to short-term news flow. \"Most news is short-term, and most portfolios should be long-term. That intersection is emotionally hard, but really important to drive successful results,\" he said.\n\nFinancial advisors and investment strategists say there are plenty of options for investors to ride out bond market uncertainty rather than rush into potentially bad decisions.\n\nYields are higher across the curve, and despite Trump administration attempts to project calm, it can spook the markets. But for buy-and-hold investors, higher yields can be a good thing. \"To me, that's a positive sign for future returns because the yields are now higher for the bond market, generally speaking,\" said Marta Norton, chief investment strategist at Denver-based Empower. \"I do not agree that bonds are dead.", "source": "CNBC Top News", "pub_date_str": "02 Sep 2026, 06:49 PM IST", "pub_date_relative": "15m ago"}, {"title": "Invested near 2024 market peak? New study reveals lessons from past crashes on SIPs, lump sums and volatility", "full_content": "Investors who started SIPs or invested a lump sum between July and September 2024, when markets were near their highs, have now spent nearly 2 years dealing with flat-to-negative returns, according to the latest study by WhiteOak Capital Mutual Fund .\n\nThe Sensex has gone nearly 700 days without making a new record high, its longest such stretch since 2012. Also, 38% of trading days in 2026 have seen negative 2-year rolling returns, the highest in over a decade.\n\nBut history suggests that a difficult entry point does not necessarily mean a poor long-term outcome. \u201cHistory doesn't repeat, but it rhymes,\u201d the study notes.\n\nThe WhiteOak Capital Mutual Fund study highlighted three periods of sharp falls or prolonged weakness.\n\nThe Nifty 50 fell around 52% in 2008, while a lump sum invested at the peak remained in the red for 5\u20136 years.\n\nThe study notes that many investors \u201cquestioned every SIP instalment\u201d and stopped investing near the market bottom.\n\nHowever, those who continued their SIPs \u201cbroke even within 18 months\u201d of the crash and were earning an XIRR of 30% shortly thereafter.\n\nA monthly SIP between January 2008 and December 2009 delivered a 15% XIRR.", "source": "LiveMint Money", "pub_date_str": "02 Sep 2026, 06:49 PM IST", "pub_date_relative": "15m ago"}, {"title": "Ships adopt makeshift anti-drone defences as Black Sea attacks intensify", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Sep 2026, 06:48 PM IST", "pub_date_relative": "16m ago"}, {"title": "Energy Secretary Chris Wright tells CNBC more than 17 million barrels of oil transited Hormuz on Monday", "full_content": "More than 17 million barrels of oil transited the Strait of Hormuz by ship on Monday, a record since the Iran war began in late February, U.S. Energy Secretary Chris Wright told CNBC in an interview Wednesday.\n\nOil exports from the region on Monday were higher than pre-war levels when Saudi Arabia's and the United Arab Emirate's pipelines that bypass Hormuz are included, Wright said. Around 20 million bpd of crude and products passed through the strait before the war started on Feb. 28.\n\nIran is losing its ability to \"hold the world economic hostage\" as the U.S. military helps oil tankers sail through Hormuz, Wright said. Tehran is \"causing some disruption but they are losing that card,\" he said.\n\nThe Energy Secretary spoke to CNBC's Brian Sullivan in Venezuela on Wednesday, five days after President Donald Trump announced a massive oil deal with the interim government in Caracas.\n\nThe U.S. government has provided data on oil exports through Hormuz that are higher than those reported by independent ship tracking firms. Wright has said the U.S. military and Department of Energy have the best data as private companies often miss covert transits.\n\nU.S. crude oil was down about 1% Wednesday, though the futures contract hovered around $90 per barrel earlier in the session as Washington and Tehran traded military strikes, breaking a period of relative calm.\n\nThe U.S. military has established a shipping corridor along Oman's coast that tankers from its Gulf allies use to transit Hormuz, often at night with their transponders turned off to reduce the risk of attack.\n\n\"With or without Iran, oil and gas will flow out of the Arabian Gulf region and it's happening,\" Wright told CNBC Wednesday.", "source": "CNBC Top News", "pub_date_str": "02 Sep 2026, 06:48 PM IST", "pub_date_relative": "16m ago"}, {"title": "Stifel raises Medtronic stock price target to $95 on strong quarter", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Sep 2026, 06:46 PM IST", "pub_date_relative": "18m ago"}, {"title": "Earnings call transcript: Alimentation Couche-Tard posts solid Q1 2027 growth", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Sep 2026, 06:46 PM IST", "pub_date_relative": "18m ago"}, {"title": "Cantor Fitzgerald reiterates Neutral on GitLab stock at $50 target", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Sep 2026, 06:46 PM IST", "pub_date_relative": "18m ago"}, {"title": "Cantor Fitzgerald reiterates Palo Alto Networks stock Overweight rating", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Sep 2026, 06:46 PM IST", "pub_date_relative": "18m ago"}, {"title": "Why is G-III Apparel stock sliding today?", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Sep 2026, 06:46 PM IST", "pub_date_relative": "18m ago"}, {"title": "Puma VCT 13 admits 1.2 million new shares to trading", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Sep 2026, 06:46 PM IST", "pub_date_relative": "18m ago"}, {"title": "Nestl\u00e9 to sell \u201cmainstream\u201d supplements business for $1bn", "full_content": "Skip to navigation Skip to main content Skip to right column Nestl\u00e9 to sell \u201cmainstream\u201d supplements business for $1bn Aninda Chakraborty Wed, September 2, 2026 at 9:15 AM EDT 3 min read NESN.SW Nestl\u00e9 has found a buyer for the \"mainstream\" vitamins, minerals and supplements (VMS) brands it put under review last year.\n\nThe Swiss food giant has agreed to offload the portfolio to US private-equity firm Yellow Wood Partners for SFr800m ($1bn).\n\nThe disposal concludes the strategic review process that Nestl\u00e9 launched in July 2025 for its \"mainstream and value VMS brands\". The company bought the assets in 2021 as part of a $5.75bn deal with The Bountiful Company.\n\nNestl\u00e9 has labelled the portfolio being sold as the \"Holistic Health portfolio\". It includes seven brands: Nature's Bounty, Osteo Bi-Flex, Ester-C, Gard, Nuun, Puritan's Pride and Sisu.\n\nThe transaction also includes the associated US private-label supplements business along with \"dedicated manufacturing, packaging, warehousing and distribution operations\", according to a statement.\n\nThe so-called \"science-led\" VMS assets under the brands Solgar and Pure Encapsulations are not part of the transaction.\n\nNestl\u00e9 said the assets under the agreement with Yellow Wood generated sales of $1.2bn in 2025, with sales mostly in the US but also Canada and China.\n\nCEO Philipp Navratil said: \"This is another important step in the strategic transformation of our portfolio.", "source": "Yahoo Finance", "pub_date_str": "02 Sep 2026, 06:45 PM IST", "pub_date_relative": "19m ago"}, {"title": "Bouygues eyes US and Germany expansion amid France slowdown - Bloomberg", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Sep 2026, 06:45 PM IST", "pub_date_relative": "20m ago"}, {"title": "We\u2019re in our 60s. My wife and I have $345,000 in annual pensions and $1 million in 403(b)s. Is it too late for Roth conversions?", "full_content": "\u201cRoth assets would provide our children with tax-free distributions.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "02 Sep 2026, 06:45 PM IST", "pub_date_relative": "20m ago"}, {"title": "RBI Floating Rate Savings Bonds: Want to buy offline? Know where to apply, documents, interest and tax rules", "full_content": "RBI Floating Rate Savings Bonds can appeal to investors looking for a government-backed fixed-income investment, but choosing the offline route means consumers need to know where to apply, what information to keep ready and how the investment will be recorded.\n\nThe process is straightforward in principle, but practical issues such as branch-level familiarity, payment realisation and taxation can affect the experience and the return an investor ultimately earns.\n\n\u201cOffline is not a workaround here. It is the original route, and for a large part of the buyer base for this bond, it is still the primary one,\u201d said Anooj Mehta, partner at 1 Finance.\n\nAdhil Shetty, CEO of BankBazaar, said consumers should ensure that they use an authorised receiving office and provide accurate KYC and bank details because these details are important for receiving interest and redemption proceeds.\n\nRBI Floating Rate Savings Bonds can be purchased through authorised receiving offices, including specified banks and Stock Holding Corporation of India. Consumers opting for the offline route need to complete the prescribed application and provide the required KYC details.\n\nMehta said consumers should specifically ask for the application for Floating Rate Savings Bonds 2020 (Taxable). The prescribed application is Form B, rather than a bank's regular investment form. The investment amount is in multiples of \u20b9 1,000.\n\nNomination is handled separately through Form C, Mehta said. Consumers should have the nominee's name, date of birth, address and relationship ready. If the nominee is a minor, details of the person appointed on the minor's behalf are also required.\n\nPayment can be made through the modes permitted by the receiving office. RBI's guidelines provide for cash, cheque, demand draft or an electronic mode accepted by the receiving office. Cash payment is capped at \u20b9 20,000.", "source": "LiveMint Money", "pub_date_str": "02 Sep 2026, 06:45 PM IST", "pub_date_relative": "20m ago"}, {"title": "Citi Wealth appoints Liz McElherne to lead AIMS platform management", "full_content": "Skip to navigation Skip to main content Skip to right column Citi Wealth appoints Liz McElherne to lead AIMS platform management Vidhya Edwards Munnangi Wed, September 2, 2026 at 9:14 AM EDT 2 min read APO Citi Wealth has expanded its alternatives and investment manager solutions (AIMS) leadership team, appointing Elizabeth McElherne as head of AIMS platform management.\n\nShe will report to Daniel O'Donnell, who leads alternatives and investment manager solutions at the firm.\n\nMcElherne's remit will cover product management, product development and business execution.\n\nShe will join on 8 September and oversee the product lifecycle across global private equity, real estate, hedge funds, third-party mutual funds, exchange-traded funds and UCIT offerings.\n\nAccording to Citi Wealth, McElherne brings more than 17 years of leadership experience in wealth management and private markets.\n\nBefore joining Citi Wealth, she was a founding member of Alchelyst and served as the firm's global head of client solutions.\n\nAlchelyst was established in partnership with Apollo Global Management and Motive Partners.\n\nIn that position, she was responsible for expanding the company's general partner relationships on the commercial side.", "source": "Yahoo Finance", "pub_date_str": "02 Sep 2026, 06:44 PM IST", "pub_date_relative": "20m ago"}, {"title": "FuelCell Sinks 13% as Wider Loss Overshadows First Data Center Reservation Deal, Bloom Energy Slips, Plug Power Barely Budges", "full_content": "Skip to navigation Skip to main content Skip to right column FuelCell Sinks 13% as Wider Loss Overshadows First Data Center Reservation Deal, Bloom Energy Slips, Plug Power Barely Budges David Moadel Wed, September 2, 2026 at 9:13 AM EDT 5 min read FCEL BE PLUG XOM Quick Read FCEL plunged 13% after a $17M Fit Energy charge widened the gross loss, overshadowing its first 75 MW Texas data center reservation deal.\n\nHYDR held flat while XOM received FuelCell's first carbonate fuel cell carbon capture modules at its Rotterdam complex under a multi-year joint development deal.\n\nShares outstanding surged from 46 million to 80 million since October 2025, and FCEL doesn't target positive adjusted EBITDA until Q4 fiscal 2027.\n\nRead More: Learn 7 ways to generate income with a $1,000,000+ portfolio (sponsor)\n\nFuelCell Energy ( NASDAQ:FCEL ) stock is down 13% to $14.90 in early trading Wednesday after the company reported fiscal Q3 2026 results before the open. The Global X Hydrogen ETF ( NASDAQ:HYDR ) is unchanged at $42.06, keeping the sector barometer flat while FuelCell Energy takes the hit alone.\n\nMeanwhile, Bloom Energy ( NYSE:BE ) stock is down 2% to $209.98, and Plug Power ( NASDAQ:PLUG ) stock is down 0.6% to $2.08. Through Tuesday's close, FuelCell Energy stock was up 134% year to date (YTD), Bloom Energy stock was up 146%, and Plug Power stock was up 6%.\n\nFuelCell Energy reported revenue of $33 million, down 29% from $46.7 million a year ago, missing the $40 million consensus. The company posted a loss of $0.64 per share against an expected loss of $0.40 per share, and gross loss widened to $24.5 million from $5.1 million a year earlier.\n\nThe core issue was a $17 million charge tied to product costs and firm purchase commitments that exceed the contractual pricing set under the capital equipment purchase agreement with Fit Energy.", "source": "Yahoo Finance", "pub_date_str": "02 Sep 2026, 06:43 PM IST", "pub_date_relative": "21m ago"}], "cfa": [{"title": "Private payrolls rose by 38,000 in August, less than expected, ADP reports", "full_content": "Private U.S. companies added jobs at a slightly slower-than-expected pace in August, with gains concentrated heavily in health care and a few other industries, ADP reported Wednesday.\n\nThe payrolls processing firm said firms added 38,000 workers, fewer than the upwardly revised 46,000 in July and below the Dow Jones consensus estimate for 47,000.\n\nThough job creation held positive, August was the smallest gain since January and reflective of a broader slowdown in the labor market. Moreover, most of the jobs came from three sectors, with multiple others showing declines.\n\nEducation and health services added 45,000 to lead all categories, with the latter group being at the forefront of employment growth.\n\nLeisure and hospitality added 16,000 positions an construction was up 12,000. Outside of that, though, there were few growth areas.\n\nManufacturing lost 17,000 jobs, professional and business services was off 16,000 and both the natural resources and mining as well as trade, transportation and utilities reported declines of 5,000.\n\nAlmost all of the gains came from big business, with companies employing 500 or more workers adding 34,000 while those with fewer than 50 employees rose by 3,000.\n\nADP's numbers also showed that pay gains held steady for the month. The firm added a feature in August in which it broke down growth between base and gross pay, the latter including tips, commissions, bonuses and other earnings.", "source": "CNBC Top News", "pub_date_str": "02 Sep 2026, 07:01 PM IST", "pub_date_relative": "3m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "G20 live updates: Nvidia's Huang pushes for AI infrastructure in every country", "full_content": "Artificial intelligence is taking center stage at the G20 gatherings this week.\n\nNvidia CEO Jensen Huang, Anthropic Co-Founder Tom Brown and OpenAI CEO Sam Altman highlight the tech-focused guests on Wednesday for day 2 of the G20 Innovation Ministerial in Chapel Hill, North Carolina.\n\nCommerce Secretary Howard Lutnick and White House Office of Science and Technology Policy Director Michael Kratsios are leading the conference, which gathers representatives of the G20 nations , including China, Brazil, Canada, Germany and others.\n\nMeta CEO Mark Zuckerberg and Tesla / SpaceX CEO Elon Musk were among the tech titans at Tuesday's session.\n\nNvidia CEO Jensen Huang said that AI is as foundational to every country's development as core infrastructure.\n\n\"What every single country will have to do is you need to recognize that this is infrastructure, just as its water, roads, electricity, the internet,\" Huang told Commerce Secretary Howard Lutnick in a fireside chat.\n\n\"Every single country needs to build infrastructure so that you could support your own local economy,\" he said.\n\nHuang referenced his favored \"five-layer cake\" analogy for AI, with energy at the bottom, followed by chips, data centers, AI models themselves, and data and applications.", "source": "CNBC World Economy", "pub_date_str": "02 Sep 2026, 06:52 PM IST", "pub_date_relative": "12m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Bond market sell-off: How investors can move and protect their money as rates rise", "full_content": "There's been a lot of noise in the bond market lately, and with the 10-year treasury hitting its highest level since 2023 on Wednesday, what's giving investors pause isn't going away.\n\nBetween planned Treasury buybacks and the Federal Reserve's latest announcement signaling a possible rate hike that puts the agency at odds with President Donald Trump's desires, many bond owners are scratching their heads about what's next. This comes amid broader inflation concerns weighing on bondholders, a roughly $2 trillion federal deficit, and over $40 trillion in government debt that doesn't show signs of easing.\n\n\"Tuning out the noise is one of the hardest things for anyone to do,\" said Ian Toner, partner and head of investments in the institutional consulting practice at New York-based Cerity Partners. Nonetheless, he cautions investors who are considering moving money based on headlines to think hard about whether something has fundamentally changed in the economy or the market on a long-term basis or whether they're reacting to short-term news flow. \"Most news is short-term, and most portfolios should be long-term. That intersection is emotionally hard, but really important to drive successful results,\" he said.\n\nFinancial advisors and investment strategists say there are plenty of options for investors to ride out bond market uncertainty rather than rush into potentially bad decisions.\n\nYields are higher across the curve, and despite Trump administration attempts to project calm, it can spook the markets. But for buy-and-hold investors, higher yields can be a good thing. \"To me, that's a positive sign for future returns because the yields are now higher for the bond market, generally speaking,\" said Marta Norton, chief investment strategist at Denver-based Empower. \"I do not agree that bonds are dead.", "source": "CNBC Top News", "pub_date_str": "02 Sep 2026, 06:49 PM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Economics", "Fixed Income", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Invested near 2024 market peak? New study reveals lessons from past crashes on SIPs, lump sums and volatility", "full_content": "Investors who started SIPs or invested a lump sum between July and September 2024, when markets were near their highs, have now spent nearly 2 years dealing with flat-to-negative returns, according to the latest study by WhiteOak Capital Mutual Fund .\n\nThe Sensex has gone nearly 700 days without making a new record high, its longest such stretch since 2012. Also, 38% of trading days in 2026 have seen negative 2-year rolling returns, the highest in over a decade.\n\nBut history suggests that a difficult entry point does not necessarily mean a poor long-term outcome. \u201cHistory doesn't repeat, but it rhymes,\u201d the study notes.\n\nThe WhiteOak Capital Mutual Fund study highlighted three periods of sharp falls or prolonged weakness.\n\nThe Nifty 50 fell around 52% in 2008, while a lump sum invested at the peak remained in the red for 5\u20136 years.\n\nThe study notes that many investors \u201cquestioned every SIP instalment\u201d and stopped investing near the market bottom.\n\nHowever, those who continued their SIPs \u201cbroke even within 18 months\u201d of the crash and were earning an XIRR of 30% shortly thereafter.\n\nA monthly SIP between January 2008 and December 2009 delivered a 15% XIRR.", "source": "LiveMint Money", "pub_date_str": "02 Sep 2026, 06:49 PM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Energy Secretary Chris Wright tells CNBC more than 17 million barrels of oil transited Hormuz on Monday", "full_content": "More than 17 million barrels of oil transited the Strait of Hormuz by ship on Monday, a record since the Iran war began in late February, U.S. Energy Secretary Chris Wright told CNBC in an interview Wednesday.\n\nOil exports from the region on Monday were higher than pre-war levels when Saudi Arabia's and the United Arab Emirate's pipelines that bypass Hormuz are included, Wright said. Around 20 million bpd of crude and products passed through the strait before the war started on Feb. 28.\n\nIran is losing its ability to \"hold the world economic hostage\" as the U.S. military helps oil tankers sail through Hormuz, Wright said. Tehran is \"causing some disruption but they are losing that card,\" he said.\n\nThe Energy Secretary spoke to CNBC's Brian Sullivan in Venezuela on Wednesday, five days after President Donald Trump announced a massive oil deal with the interim government in Caracas.\n\nThe U.S. government has provided data on oil exports through Hormuz that are higher than those reported by independent ship tracking firms. Wright has said the U.S. military and Department of Energy have the best data as private companies often miss covert transits.\n\nU.S. crude oil was down about 1% Wednesday, though the futures contract hovered around $90 per barrel earlier in the session as Washington and Tehran traded military strikes, breaking a period of relative calm.\n\nThe U.S. military has established a shipping corridor along Oman's coast that tankers from its Gulf allies use to transit Hormuz, often at night with their transponders turned off to reduce the risk of attack.\n\n\"With or without Iran, oil and gas will flow out of the Arabian Gulf region and it's happening,\" Wright told CNBC Wednesday.", "source": "CNBC Top News", "pub_date_str": "02 Sep 2026, 06:48 PM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Derivatives", "Alternative Investments"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Earnings call transcript: Alimentation Couche-Tard posts solid Q1 2027 growth", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Sep 2026, 06:46 PM IST", "pub_date_relative": "18m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Nestl\u00e9 to sell \u201cmainstream\u201d supplements business for $1bn", "full_content": "Skip to navigation Skip to main content Skip to right column Nestl\u00e9 to sell \u201cmainstream\u201d supplements business for $1bn Aninda Chakraborty Wed, September 2, 2026 at 9:15 AM EDT 3 min read NESN.SW Nestl\u00e9 has found a buyer for the \"mainstream\" vitamins, minerals and supplements (VMS) brands it put under review last year.\n\nThe Swiss food giant has agreed to offload the portfolio to US private-equity firm Yellow Wood Partners for SFr800m ($1bn).\n\nThe disposal concludes the strategic review process that Nestl\u00e9 launched in July 2025 for its \"mainstream and value VMS brands\". The company bought the assets in 2021 as part of a $5.75bn deal with The Bountiful Company.\n\nNestl\u00e9 has labelled the portfolio being sold as the \"Holistic Health portfolio\". It includes seven brands: Nature's Bounty, Osteo Bi-Flex, Ester-C, Gard, Nuun, Puritan's Pride and Sisu.\n\nThe transaction also includes the associated US private-label supplements business along with \"dedicated manufacturing, packaging, warehousing and distribution operations\", according to a statement.\n\nThe so-called \"science-led\" VMS assets under the brands Solgar and Pure Encapsulations are not part of the transaction.\n\nNestl\u00e9 said the assets under the agreement with Yellow Wood generated sales of $1.2bn in 2025, with sales mostly in the US but also Canada and China.\n\nCEO Philipp Navratil said: \"This is another important step in the strategic transformation of our portfolio.", "source": "Yahoo Finance", "pub_date_str": "02 Sep 2026, 06:45 PM IST", "pub_date_relative": "19m ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "RBI Floating Rate Savings Bonds: Want to buy offline? Know where to apply, documents, interest and tax rules", "full_content": y Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "European shares slip to over 1-month lows as global yield surge deepens", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Sep 2026, 06:43 PM IST", "pub_date_relative": "21m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "10-year U.S. Treasury yield hits highest level since November 2023", "full_content": "The 10-year Treasury note yield reached a fresh multiyear high on Wednesday as inflation and debt concerns pressured global government borrowing costs.\n\nThe yield on the 10-year Treasury note \u2014 the main benchmark for mortgages, auto loans and credit card debt \u2014 was last seen down less than 1 basis point at 4.79%. It reached 4.814%, its highest level since November 2023 earlier in the day.\n\nThe 30-year Treasury yield was less than 1 basis point lower at 5.262%, while the yield on the 2-year Treasury note fell more than 1 basis point to 4.383%.\n\nOne basis point equals 0.01%, and yields and prices move inversely.\n\nYields had also risen higher globally as investors continued to demand a greater premium to take on medium- and long-term government debt.\n\nThee latest escalation in tensions in the Middle East has renewed fears about inflation proving entrenched, while traders increasingly expect interest rate hikes this month in the U.S. and beyond.\n\n\"Investors are now staring directly into the eyes of an inflation monster that threatens to become stronger unless action is taken. Central banks typically raise interest rates to fight inflation, and market expectations for the scale of rate hikes continues to evolve,\" Dan Coatsworth, head of markets at AJ Bell, said in a Wednesday note.\n\n\"Bonds are reaching the point where certain investors may seek to lock in high yields caused by the latest market volatility. What might be holding them back is an expectation that yields could get even higher if rates go up fast and hard, meaning certain bond investors could be playing a waiting game before piling in.\"", "source": "CNBC Top News", "pub_date_str": "02 Sep 2026, 06:40 PM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Economics", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "IDAK Food Group sells \u201cfounding\u201d business Kadi", "full_content": "Skip to navigation Skip to main content Skip to right column IDAK Food Group sells \u201cfounding\u201d business Kadi Satarupa Bhowmik Wed, September 2, 2026 at 9:10 AM EDT 2 min read Switzerland's IDAK Food Group is offloading potato products and snacks manufacturer Kadi to local private-equity firm Invision.\n\nZug-based Invision will hold a majority stake in Kadi, while the company's management will retain a minority holding.\n\nKadi, based in Langenthal, was the core asset behind the strategy that led to the creation of the current IDAK Food Group.\n\nInvision and fellow private-equity firm Nord Holding acquired a majority stake in the business in 2018.\n\nThe investors then used Kadi as the platform to build IDAK Food Group into a pan-European frozen-food group.\n\nInvision and Nord Holding exited that investment in 2024, selling their majority stake to TowerBrook Capital Partners.\n\nNow Kadi is returning to Invision's ownership as IDAK Food Group reshapes its portfolio around baked goods.\n\nThe move follows the group's January acquisition of French bakery business Onor\u00e9.", "source": "Yahoo Finance", "pub_date_str": "02 Sep 2026, 06:40 PM IST", "pub_date_relative": "25m ago", "cfa_topics": ["Corporate Issuers", "Portfolio Management"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Can Oracle Get Close to a $1 Trillion Market Cap Again?", "full_content": "Skip to navigation Skip to main content Skip to right column Can Oracle Get Close to a $1 Trillion Market Cap Again? Marc Guberti, The Motley Fool Wed, September 2, 2026 at 9:05 AM EDT 4 min read ORCL NVDA It wasn't long ago when Oracle (NYSE: ORCL) was approaching a $1 trillion market cap, thanks in large part to optimism about its cloud computing business. However, the stock is down by more than 50% from the all-time high it set almost a year ago, and it currently has a market cap below $500 billion.\n\nThis dramatic drop has created a buying opportunity, and if Oracle can continue to ride the tailwinds of the AI megatrend for multiple years, it has a real shot at recovering past that peak and reaching a $1 trillion valuation for the first time.\n\nMissed Nvidia in 2009? This Rare Signal Is Flashing Again. In 2009, a \"Double Down\" signal flashed for a little-known chipmaker called Nvidia. For the first time in years, that same \"Total Conviction\" signal is flashing for a company 1/100th the size of Nvidia. Continue \u00bb\n\nOracle's cloud segment is the most important part of the business to consider when assessing how far the stock can climb. That segment continues to do well. Oracle reported cloud revenue growth of 47% year over year in its fiscal 2026 fourth quarter. Total revenue for the company was up by 21%.\n\nThe major drag on the stock relates to Oracle's remaining performance obligations. It has $638 billion in its backlog. That's a good number on the surface since Oracle earned $19.2 billion in its fiscal 2026 fourth quarter. The issue is that its contract with OpenAI accounts for more than $300 billion of that $638 billion total.\n\nThere is a lot of uncertainty about that contract. First, in December, Bloomberg reported that Oracle was going to delay delivery of the OpenAI-related data center project by a year -- an assertion that Oracle promptly denied.", "source": "Yahoo Finance", "pub_date_str": "02 Sep 2026, 06:35 PM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Energy price surge hits bond markets as European gas reaches three-year high", "full_content": "US 10-year borrowing costs touch highest since 2023 as fears of return to full-blown Iran conflict rise", "source": "FT Markets", "pub_date_str": "02 Sep 2026, 06:32 PM IST", "pub_date_relative": "32m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Apple CEO John Ternus pay package: $58 million in fiscal 2027", "full_content": "Skip to navigation Skip to main content Skip to right column Apple CEO John Ternus pay package: $58 million in fiscal 2027 Cris Tolomia Wed, September 2, 2026 at 9:02 AM EDT 2 min read AAPL ^GSPC Apple disclosed the compensation package for new Chief Executive Officer John Ternus on Tuesday, his first day in the role: a $3 million annual salary and a targeted equity award of $55 million for fiscal 2027, bringing his total target compensation to approximately $58 million.\n\nApple's board People and Compensation Committee also awarded Ternus a prorated RSU grant with a target value of $2.5 million for his partial-year service as CEO in fiscal 2026, the company said. Performance-based RSUs account for three-quarters of his annual equity award, with vesting tied to how Apple's total shareholder return stacks up against the rest of the S&P 500. The other 25% comes in time-based RSUs, which vest every six months in equal 12.5% portions across a four-year period.\n\nApple also disclosed the compensation for Tim Cook in his new role as executive chairman. As executive chairman, Cook will earn a $2 million annual salary starting Sept. 26, along with a targeted equity award of $45 million for fiscal 2027, putting his total target compensation at roughly $47 million. Cook's equity is split evenly between performance-based RSUs benchmarked against the S&P 500 and time-based RSUs that follow the same semiannual vesting schedule as Ternus's. Cook's total pay package as CEO in 2025 was $74.3 million, according to Bloomberg . His salary is being reduced from $3 million in that prior role.\n\nThe filing left open the question of cash bonuses for both executives, according to The Wall Street Journal .\n\nTernus, 51, formally took over as Apple's chief executive on Tuesday , with Cook moving to executive chairman on the same date.", "source": "Yahoo Finance", "pub_date_str": "02 Sep 2026, 06:32 PM IST", "pub_date_relative": "33m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Chevron will expand Venezuela operations, more than doubling production through $7 billion investment", "full_content": "Chevron announced plans Wednesday to more than double its oil production in Venezuela over the next five years through a $7 billion investment that expands its position in the South American nation.\n\nThe oil major has been assigned two additional oilfields in the Orinoco Belt, the region that contains most of Venezuela's vast extra-heavy crude reserves. Chevron plans to increase its production in the country to 600,000 barrels per day compared with around 280,000 bpd currently.\n\nChevron is the only U.S. oil major active in Venezuela through joint ventures with state-owned oil company Petr\u00f3leos de Venezuela SA.\n\n\"With improved terms and additional acreage, we are strengthening a portfolio that we believe can deliver attractive low-cost oil growth, support energy supply and create differentiated long-term value,\" Chevron CEO Mike Wirth said in a statement.\n\nChevron's announcement comes as the U.S. government pushes to increase oil production in Venezuela through private investment. The country's oil infrastructure is in a state of disrepair after years of mismanagement by its socialist government.\n\nPresident Donald Trump announced Friday that the U.S. secured majority control over 65 billion barrels of Venezuela's crude oil reserves, about 20% of the 303 billion barrels the country is thought to possess. U.S. Energy Secretary Chris Wright is visiting Venezuela on Wednesday.\n\nWashington has partnered with the private oil company North American Blue Energy Partners to develop those reserves. Venezuela's interim government has given NABEP concessions to 17 oilfields for 100 years. NABEP, in turn, has granted the U.S. Defense Department a 35% equity stake.\n\nThe U.S. captured former President Nicol\u00e1s Maduro in a military raid in January and seized control of Venezuela's oil exports. Washington has partnered with interim President Delcy Rodr\u00edguez, who served as vice president under Maduro.", "source": "CNBC Top News", "pub_date_str": "02 Sep 2026, 06:28 PM IST", "pub_date_relative": "36m ago", "cfa_topics": ["Alternative Investments", "Portfolio Management"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Stock Market Today: Dow Rises On Surprise Jobs Data; AI Name Credo Dives On Earnings Report (Live Coverage)", "full_content": "Store Subscribe Sign In My Subscriptions Founder's Club SwingTrader Leaderboard MarketSurge eIBD IBD Digital IBD Live Customer Center My Stock Lists Email Preferences Help & Support Sign Out Market Trend Stock Lists Research News Videos Learn Store Search stocks or keywords Sections My IBD Market Trend MARKET TREND The Big Picture Stock Market Today ETF Market Strategy Stock Market Data Psychological Indicators New? Start Here IBD Digital: 2 Months for $20 Stock Lists STOCK LISTS IBD 50 IBD Sector Leaders IBD Big Cap 20 IBD Long-Term Leaders IPO Leaders My Stock Lists Stock Lists Update Sto relative": "43m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Indian banks raise over $136 bn via RBI forex swap, FCNR(B) deposits dominate inflows", "full_content": "India's banking system attracted over $136 billion through a special Reserve Bank of India swap facility. Foreign currency non-resident deposits accounted for the largest portion of these substantial inflows. This strong response prompted the Reserve Bank of India to close deposit mobilization earlier than planned. The inflows have significantly boosted banking system liquidity and strengthened foreign exchange reserves.", "source": "Economic Times Economy", "pub_date_str": "02 Sep 2026, 06:18 PM IST", "pub_date_relative": "46m ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}], "updated_at": "02 Sep 2026, 07:05 PM IST", "total_stories": 334};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
