    const allData = {"general": [{"title": "Earnings call transcript: Worldline Q3 2026 revenue stabilizes as turnaround gains pace", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Oct 2026, 12:14 AM IST", "pub_date_relative": "2m ago"}, {"title": "S&P 500 rises as chip stocks gain for a second day, oil prices ease: Live updates", "full_content": "The S&P 500 rose on Tuesday as enthusiasm surrounding chipmakers led traders to move into the names for another day. Investors also monitored a slide in oil prices and parsed through a slew of corporate earnings as the Federal Reserve began its two-day policy meeting.\n\nThe broad market index was up 0.5%, while the Dow Jones Industrial Average traded around the flatline. The Nasdaq Composite gained 1.1%.\n\nShares of Broadcom climbed 4% on the heels of a coalition of banks \u2014 namely, Bank of America , Citi and Morgan Stanley \u2014 and Blackstone announcing $63 billion in financing for the purchase of Broadcom's technology for Anthropic. Other chipmakers rose in sympathy. Micron Technology was up more than 3%, while Advanced Micro Devices advanced 5%.\n\nThe latest moves in those stocks add to their gains from the prior trading day, which saw the major averages record a winning session , thanks in part to a boost in artificial intelligence-related stocks after Anthropic filed to go public at the Nasdaq. This would mark another major tech IPO for 2026, following SpaceX's blockbuster listing in June.\n\n\"The market has these kind of periodic interludes where it gets concerned about AI spending, and then we tend to go back and tech leads us higher,\" said Jed Ellerbroek, Argent Capital Management portfolio manager. \"The light switch has been off for the last two weeks, and it looks like the first two days this week, the switch has been flipped up again.\"\n\nDespite those recent concerns, Ellerbroek still sees \"great\" conviction from companies that own data centers to continue to grow. \"The potential crack in the foundation remains just how volatile capital markets can be,\" he added.\n\nA decline in oil prices also supported sentiment Tuesday. The moves came after Iranian Supreme Leader Mojtaba Khamenei and his top national security official Mohsen Rezaei discussed the country's conditions for ending the conflict. U.S.", "source": "CNBC Top News", "pub_date_str": "28 Oct 2026, 12:14 AM IST", "pub_date_relative": "2m ago"}, {"title": "Wall Street rises on revived AI momentum as earnings season picks up", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Oct 2026, 12:12 AM IST", "pub_date_relative": "4m ago"}, {"title": "Amazon's anti-tokenmaxxing memo says engineers should be pickier about using AI", "full_content": "Amazon laid out its AI usage guidelines for software engineers in a memo to staffers, and discouraged employees from turning to \"tokenmaxxing\" in their push to embrace artificial intelligence tools.\n\nThe memo , which was circulated internally in September and posted to the company's website on Tuesday, revises how the company defines the role of software development engineers and managers in the age of AI.\n\n\"We're just seeing the beginning of AI's effect on software engineering,\" the company wrote. \"While we have a vision for what the future looks like, there's a lot that's still emerging. We are certain that whatever future best practices are, AI will be at the center of software engineering practice.\"\n\nUnder CEO Andy Jassy , Amazon has rapidly integrated AI across the company's sprawling business operations. Jassy has previously predicted that AI will \"change the scope and speed\" of day-to-day work, and potentially shrink its corporate workforce in the next few years through automation, though he's noted it will also create \"other jobs.\"\n\nAs employees rush to adopt AI tools, companies have grappled with the technology's surging costs and how to reliably measure whether the technology leads to a productivity boost or other valuable returns on investment.\n\nCompanies have recently cracked down on tokenmaxxing , in which developers use AI as much as possible with little regard for output. Some companies have set limits on employees' usage of tokens, or the units of data that are processed and generated by AI models, in a bid to slow rising AI bills. Others have switched to cheaper, open-source models for certain tasks.\n\nAn Amazon spokesperson said the company hasn't instituted caps on employees' token usage.", "source": "CNBC Top News", "pub_date_str": "28 Oct 2026, 12:11 AM IST", "pub_date_relative": "5m ago"}, {"title": "Temenos Q3-26 slides: profit growth accelerates on AI efficiency", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Oct 2026, 12:09 AM IST", "pub_date_relative": "7m ago"}, {"title": "Ecolab Q3 2026 slides: organic growth accelerates to 7%, margins expand", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Oct 2026, 12:09 AM IST", "pub_date_relative": "7m ago"}, {"title": "AI financing driving private credit growth as refinancing risks rise, Moody\u2019s says", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Oct 2026, 12:06 AM IST", "pub_date_relative": "10m ago"}, {"title": "What's behind the AI trade comeback \u2014 plus, our take on Intel's latest deal", "full_content": "Every weekday, the Investing Club releases the Homestretch; an actionable afternoon update just in time for the last hour of trading.", "source": "CNBC Top News", "pub_date_str": "28 Oct 2026, 12:05 AM IST", "pub_date_relative": "11m ago"}, {"title": "Earnings call transcript: Saint-Gobain Q3 2026 sales rise as pricing drives growth", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Oct 2026, 12:03 AM IST", "pub_date_relative": "13m ago"}, {"title": "Exclusive-US agency is again probing if Polymarket broke 2022 settlement, sources says", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Oct 2026, 12:01 AM IST", "pub_date_relative": "15m ago"}, {"title": "Exclusive-JetBlue CEO says no creditor talks, debt restructuring not under consideration", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Oct 2026, 12:01 AM IST", "pub_date_relative": "15m ago"}, {"title": "Food and household brands warn of more price hikes as Iran war costs bite", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Oct 2026, 12:00 AM IST", "pub_date_relative": "16m ago"}, {"title": "Boeing shares sell off on slower-than-expected 737 production, weaker free cash flow outlook", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Oct 2026, 12:00 AM IST", "pub_date_relative": "16m ago"}, {"title": "CNBC Workforce Executive Summit live updates: AI and the future of work", "full_content": "Today's workplace faces a litany of challenges. Whether it's shifting power dynamics between employers and employees, the accelerating impact of artificial intelligence on how we work and the skills we need, or the financial stresses that employees of all ranks are feeling, these issues and more are challenging the cohesion of workplace communities.\n\nTo address these issues, CNBC is convening its premiere council of human resource executives in New York City on Tuesday for the annual CNBC Workforce Executive Summit. The event is exclusive to members of CNBC's Workforce Executive Council.\n\nFor more about the WEC and to apply for membership, visit www.cnbccouncils.com/wec .\n\nAmericans are increasingly finding themselves strapped for cash amid the rising costs of groceries, gas and everyday expenses.\n\nThat is leading more companies to begin to offer earned wage access as a benefit, which allows employees to access money they've already earned ahead of payday\n\nNelson Chai, the CEO of on-demand pay platform DailyPay, told CNBC's Sharon Epperson about how the company's model works.\n\n\"We have over 2,000 of the largest companies, including many that you've heard of, and we really go in and partner with them,\" he said.\n\n\"If you had to wait 14 days to get paid, tomorrow you could go in and you could have access to your wages,\" he said.", "source": "CNBC Top News", "pub_date_str": "27 Oct 2026, 11:51 PM IST", "pub_date_relative": "25m ago"}, {"title": "Stock Market Today: Dow Wobbles As Boeing Dives; Broadcom Pops After Anthropic Report (Live Coverage) - Investor's Business Daily", "full_content": "Stock Market Today: Dow Wobbles As Boeing Dives; Broadcom Pops After Anthropic Report (Live Coverage) Investor's Business Daily See more headlines & perspectives on Google News", "source": "Google News Business", "pub_date_str": "27 Oct 2026, 11:44 PM IST", "pub_date_relative": "32m ago"}, {"title": "Early third-quarter earnings show a 'resilient' U.S. consumer, with signs of strain", "full_content": "One word keeps appearing in third-quarter earnings reports: \"resilient.\"\n\nThat's the early read on U.S. consumers from various companies that released their results this week. Many businesses say Americans are still spending despite inflationary pressures, though not every company has enjoyed the same success.\n\nThe commentary comes amid fears that diesel fuel prices, which hit an all-time high of $6.52 per gallon in September, would drive up prices on consumer products . Economists also worried that more expensive regular gas, combined with high borrowing costs and continued tension between the U.S. and Iran, would spur a pullback in consumer spending.\n\nRetail sales rose 0.8% in September, following a jump of 1.3% in August. Sales in September were boosted by rising gas station spending. Despite all those challenges, some corporate executives say the headwinds aren't yet affecting sales.\n\nWhile retail sales rose 0.8% in September, following a jump of 1.3% in August, the September came as gas station spending jumped. Despite all those challenges, some corporate executives say the headwinds aren't yet affecting sales.\n\n\"There's been a lot of noise in the market this year. There's a lot of geopolitical stuff,\" Royal Caribbean Chairman and CEO Jason Liberty said on the company's earnings call on Tuesday. \"But I look at our business [and our results], and I think that really talks to the resilience of the business, the resilience of the consumer.\"\n\nRoyal Caribbean reported an increase in bookings during its third quarter, while Sherwin-Williams's CEO said the quarter was evidence of the company's strength.\n\nHere's how companies are reading the consumer in the most recent three-month period:", "source": "CNBC Top News", "pub_date_str": "27 Oct 2026, 11:42 PM IST", "pub_date_relative": "34m ago"}, {"title": "Weil Gotshal Enlists Bankruptcy Lawyer, as Firm\u2019s Situation Worsens - WSJ", "full_content": "Weil Gotshal Enlists Bankruptcy Lawyer, as Firm\u2019s Situation Worsens WSJ Law firm Weil prepares for possible wind-down as crisis deepens Financial Times Weil\u2019s Succession Chaos Prompts Fear of \u2018Run on Bank\u2019 (1) Bloomberg Law News Exclusive / Weil\u2019s troubles mount with key partner\u2019s pending departure Semafor Weil's Tough Decisions in Path Ahead Law.com", "source": "Google News Business", "pub_date_str": "27 Oct 2026, 11:39 PM IST", "pub_date_relative": "38m ago"}, {"title": "I just bought this pharma stock for its next generation of blockbuster drugs \u2014 and its dividend", "full_content": "AbbVie is entering a new chapter of growth, fueled by its blockbuster immunology drugs and expanding neuroscience business. Investor Kevin Simpson shares why he's optimistic.", "source": "CNBC Top News", "pub_date_str": "27 Oct 2026, 11:33 PM IST", "pub_date_relative": "43m ago"}, {"title": "Speaker Mike Johnson calls election-transfer concerns \u2018absurd\u2019", "full_content": "U.S. House Speaker Mike Johnson , R-La., committed to a peaceful post-election transfer of power, calling concerns that President Donald Trump and congressional Republicans could contest the results if Democrats win control of Congress \"absurd.\"\n\n\"We're going to follow the Constitution. The Constitution says when a state certifies the election of members of Congress, then they're administered the oath. That's what I'll be doing on Jan. 3 to everybody who's there,\" Johnson said Tuesday during a campaign stop with New York Republican Rep. Mike Lawler , one week before the Nov. 3 midterm election , in response to a question from MS NOW. \"I may not like some of those outcomes, but that's our system. And for anybody to suggest otherwise is absurd.\"\n\nDemocrats and voting rights advocates are bracing for potential challenges if control of the House flips, as is widely projected to happen , or control changes in the Senate, which is more closely contested . Republicans have a majority in both chambers of Congress.\n\nTrump, who has continued to falsely claim that widespread fraud cost him the 2020 election , has fueled those fears by calling to \"nationalize\" elections earlier this year and repeatedly questioning the security of mail voting, while also suggesting noncitizens could vote in large enough numbers to skew results. His administration sued California earlier this month in a fight over noncitizens voting.\n\nThe Department of Justice also sued Alaska last week to block the certification of its results in the event of voter confusion. GOP Sen. Dan Sullivan will appear on the ballot beside Daniel J. Sullivan, a retired teacher whom Republicans have said is on the ballot only as a spoiler candidate.\n\nJohnson, who in the wake of the 2020 election was a key congressional ally of Trump's in his quest to overturn results, on Tuesday said questions about a peaceful transfer were \"a little silly.\"\n\n\"Of course we'll have a peaceful transfer of power.", "source": "CNBC Top News", "pub_date_str": "27 Oct 2026, 11:33 PM IST", "pub_date_relative": "43m ago"}, {"title": "Mother sells gold jewellery, gifts \u20b916 lakh to son, Income Tax Department questions deposits but ITAT grants relief", "full_content": "A Jaipur man who received \u20b9 16 lakh from his mother after she sold her gold jewellery has won relief from the Income Tax Appellate Tribunal (ITAT), which deleted a \u20b9 13.04 lakh addition made by the tax department over unexplained cash deposits.\n\nThe Jaipur bench of the ITAT, in Jhutha Ram v. ITO , ITA No. 1365/JPR/2025, relating to assessment year 2012-13, ruled on 6 October 2026 that the cash gift could not be doubted when it was supported by a notarised gift deed, witnesses and a registered valuer's report.\n\nThe dispute began when the Income Tax Department received information that Jhutha Ram had invested \u20b9 20,23,778 in immovable property, including stamp duty and registration charges, and deposited \u20b9 13,04,900 in his bank account during the relevant financial year.\n\nThe taxpayer had not originally filed his income tax return for assessment year 2012-13. Consequently, the tax department reopened his assessment by issuing a notice under Section 148 of the Income-tax Act on 29 March 2019.\n\nIn response, the taxpayer filed his return on 3 December 2019, declaring an income of \u20b9 2,14,997. However, the assessing officer was not satisfied with the explanation for the transactions.\n\nThe officer made two additions to the taxpayer's income: \u20b9 20,23,778 towards unexplained investment in property and \u20b9 13,04,900 towards unexplained cash deposits. The taxpayer challenged the additions before the Commissioner of Income Tax (Appeals).\n\nWhile the appellate authority deleted the addition relating to the property purchase, it upheld the \u20b9 13.04 lakh addition concerning cash deposits.\n\nDuring the tribunal proceedings, the taxpayer explained that he had received a cash gift of \u20b9 16 lakh from his mother on 2 February 2012.", "source": "LiveMint Money", "pub_date_str": "27 Oct 2026, 11:32 PM IST", "pub_date_relative": "44m ago"}, {"title": "GST registration gets easier as CBIC drops Udyam proof, sets seven-day limit for approvals", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Finance \u203a GST registration gets easier as CBIC drops Udyam proof, sets seven-day limit for approvals The Economic Times daily newspaper is available online now. Read Today's Paper GST registration gets easier as CBIC drops Udyam proof, sets seven-day limit for approvals SECTIONS GST registration gets easier as CBIC drops Udyam proof, sets seven-day limit for approvals ET Bureau Last Updated: Oct 27, 2026, 11:32:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Central Board of Indirect Taxes and Customs has issued clarifications regarding GST registration requirements for businesses. Companies will no longer need to provide Udyam certificates or face rejections due to unpaid bills. Registration applications must be processed within seven working days with Aadhaar authentication. Tax demands must include clear justifications and cannot be arbitrary. These changes aim to simplify compliance and reduce disputes in tax administration.\n\nKYC and KYB: Inside Damani\u2019s Avenue Supermarts that refuses to charge more \u2013 Part 1 of 3\n\nWill oil turn into a lingering problem? Is the world economy, India, or the market prepared?\n\nKYB and KYC: Business behind the wealth creator called \u2018Divi\u2019s Lab\u2019 \u2013 Part 2, concluding\n\nKYB and KYC: Business behind the wealth creator called \u201cDivi\u2019s Lab\u201d \u2013 Part 1\n\nOne company, 2 words. Bond yield and CDS: Will they decide the fate of global markets?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers", "source": "Economic Times Economy", "pub_date_str": "27 Oct 2026, 11:32 PM IST", "pub_date_relative": "45m ago"}, {"title": "Q2 Results Highlights: United Breweries Profit Triples, Doubles, SAIL Revenue Climbs 22%, Piramal Pharma Swings To Profit", "full_content": "From infrastructure and autos to pharma and financials, more than 50 companiesl announced Q2 results today, keeping investors on their toes.", "source": "NDTV Profit", "pub_date_str": "27 Oct 2026, 11:30 PM IST", "pub_date_relative": "46m ago"}, {"title": "The big reason Boeing\u2019s stock is falling so hard after earnings", "full_content": "Boeing will come up short on 737 Max deliveries, casting doubt on its turnaround plans.", "source": "MarketWatch Top Stories", "pub_date_str": "27 Oct 2026, 11:29 PM IST", "pub_date_relative": "48m ago"}, {"title": "Ligue 1 Changes Match Schedule Amid Protests Across France: Check The Latest Update", "full_content": "The LFP has altered the schedule of multiple matches following requests from public authorities as France faces protests and civil unrest.", "source": "NDTV Profit", "pub_date_str": "27 Oct 2026, 11:28 PM IST", "pub_date_relative": "48m ago"}, {"title": "Google Unveils Genie 4, An AI That Builds Interactive Worlds With Sound On The Spot", "full_content": "Google\u2019s new Genie 4 model can generate interactive, realistic worlds in real time, complete with music, ambient sound and talking characters.", "source": "NDTV Profit", "pub_date_str": "27 Oct 2026, 11:28 PM IST", "pub_date_relative": "48m ago"}, {"title": "Centre eases GST rules for post-sales discounts, no prior agreement needed from November 1", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Indicators \u203a Centre eases GST rules for post-sales discounts, no prior agreement needed from November 1 The Economic Times daily newspaper is available online now. Read Today's Paper Centre eases GST rules for post-sales discounts, no prior agreement needed from November 1 SECTIONS Centre eases GST rules for post-sales discounts, no prior agreement needed from November 1 ET Bureau Last Updated: Oct 27, 2026, 11:28:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Centre eases GST rules on post-sales discounts from November 1, no longer requiring a prior agreement, which is expected to help FMCG and pharma companies and retailers.\n\nKYC and KYB: Inside Damani\u2019s Avenue Supermarts that refuses to charge more \u2013 Part 1 of 3\n\nWill oil turn into a lingering problem? Is the world economy, India, or the market prepared?\n\nKYB and KYC: Business behind the wealth creator called \u2018Divi\u2019s Lab\u2019 \u2013 Part 2, concluding\n\nKYB and KYC: Business behind the wealth creator called \u201cDivi\u2019s Lab\u201d \u2013 Part 1\n\nOne company, 2 words. Bond yield and CDS: Will they decide the fate of global markets?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers", "source": "Economic Times Economy", "pub_date_str": "27 Oct 2026, 11:28 PM IST", "pub_date_relative": "48m ago"}, {"title": "GLP-1 drug coverage is being dropped by employer plans: What to know about 2027 weight-loss options", "full_content": "With open enrollment season in swing, many employees may notice something conspicuously missing from their benefits menu \u2014 coverage of GLP-1 drugs for weight loss.\n\nMore companies are dropping coverage completely or offering employees less generous payouts. In some cases, they're shifting to a different model altogether \u2014 offering employees a consolation prize of sorts \u2014 access to a weight management program through a third party.\n\nCoverage of these drugs for weight loss is pricey for employers \u2014 typically costing in the mid-$500s to mid-$600s per user monthly. Some companies say whatever the price, covering the drugs is worth it based on employee health. \"We spend about $250 million or more on GLPs, and that's up from zero\" four or five years ago, Bank of America CEO Brian Moynihan told CNBC's Andrew Ross Sorkin in August. \"We see a great impact on the employees. ... Believe me, we're pounding everybody on price and trying to get as cheap [as possible]. But our view is that [because of] the long-term health benefits, plus there may be more short-term health benefits ... it's a good investment.\"\n\nNevertheless, as healthcare costs continue to climb, more employers have been looking for an exit ramp on GLP-1 coverage for weight loss, and that includes bigger companies. A WTW annual health benefits survey fielded over the summer and being released in full on Wednesday found that 53% of employers with more than 100 employees cover GLP-1s for weight loss, down from 57% in 2025. That's the first decline in three years. What's more, 16% of employers said they cover the drugs now but are considering removing them, up from 9% last year.\n\nAccording to a recent Marsh survey of over 1,800 US employers, health insurance cost per employee is expected to rise 8.2% on average in 2027, the biggest increase since 2003, with GLP-1 use accounting for a full percentage point of the overall cost growth.", "source": "CNBC Top News", "pub_date_str": "27 Oct 2026, 11:27 PM IST", "pub_date_relative": "49m ago"}, {"title": "Honda warns 50% Canada auto tariffs would be catastrophic for industry", "full_content": "DETROIT \u2014 The automotive industry faces a \"catastrophic\" scenario if the U.S. and Canada cannot reach a new trade deal by the end of this year, an executive with Honda Motor warned Tuesday.\n\nPresident Donald Trump has threatened to double tariffs on Canadian vehicles and parts from 25% to 50% on Jan. 1 if the two countries don't reach a deal.\n\n\"That really would be catastrophic for the entire industry,\" Jennifer Thomas, senior vice president of corporate affairs at American Honda Motor Co., said during a Reuters automotive conference in Detroit.\n\nThomas said, ideally, the countries would also include Mexico in the arrangement and reach a trilateral deal, like the United States-Mexico-Canada Agreement, or USMCA. Trade associations representing Honda, as well as every major player in the U.S. automotive industry, have been advocating for that more comprehensive accord and against bilateral arrangements between two countries.\n\nHer comments come months after U.S. Trade Representative Jamieson Greer announced that the U.S. would not automatically extend the USMCA, moving the trade pact into an annual review process instead of a 16-year trilateral extension.\n\nTrump negotiated the USMCA to replace the North American Free Trade Agreement during his first term and it took effect in 2020. He later soured on it and accused Canada of \"ripping off the United States of America for years.\"\n\nThomas said she is \"cautiously optimistic\" that cooler heads will prevail to avoid the doubling of tariffs, which Trump threatened in August if no deal can be reached.\n\nShe said she's encouraged by recent reports that the U.S. and Canada have reestablished trade talks, including easing levies on critical materials such as aluminum.", "source": "CNBC Top News", "pub_date_str": "27 Oct 2026, 11:23 PM IST", "pub_date_relative": "53m ago"}, {"title": "Dollar General overcharged millions at checkout for years, FTC and 20 states allege - CBS News", "full_content": "Dollar General overcharged millions at checkout for years, FTC and 20 states allege CBS News California sues Dollar General for allegedly deceptive pricing Los Angeles Times Dollar General overcharged shoppers, FTC and states allege in lawsuit Yahoo Finance Michigan joins multistate lawsuit against Dollar General for overcharging customers ClickOnDetroit | WDIV Local 4 Wisconsin sues Dollar General over alleged price discrepancies Channel 3000", "source": "Google News Business", "pub_date_str": "27 Oct 2026, 11:23 PM IST", "pub_date_relative": "53m ago"}, {"title": "\u2018CryptoDad\u2019 on stablecoins, bitcoin\u2019s role in a portfolio and why he does not directly own any crypto", "full_content": "What former CFTC Chairman Chris Giancarlo tells his own children about buying their first crypto coin.", "source": "MarketWatch Top Stories", "pub_date_str": "27 Oct 2026, 11:23 PM IST", "pub_date_relative": "54m ago"}, {"title": "Apple\u2019s M6 Is Here, And The Mac Lineup Just Got A Big Upgrade", "full_content": "Apple\u2019s new M6 chip arrives in a 14-inch MacBook Pro and a refreshed iMac, with preorders opening October 28.", "source": "NDTV Profit", "pub_date_str": "27 Oct 2026, 11:19 PM IST", "pub_date_relative": "57m ago"}, {"title": "India to emerge as major exporter to China, ASEAN, get edge in US trade pact, says Piyush Goyal", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a India to emerge as major exporter to China, ASEAN, get edge in US trade pact, says Piyush Goyal The Economic Times daily newspaper is available online now. Read Today's Paper India to emerge as major exporter to China, ASEAN, get edge in US trade pact, says Piyush Goyal SECTIONS India to emerge as major exporter to China, ASEAN, get edge in US trade pact, says Piyush Goyal By Kirtika Suneja , ET Bureau Last Updated: Oct 27, 2026, 11:18:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Commerce and Industry Minister Piyush Goyal highlighted India's potential to expand exports to China and ASEAN. Negotiations are underway for a trade pact with the United States that could provide India a comparative advantage. The country is also working towards an Investment Protection Agreement with the European Union. Goyal indicated that discussions for preferential trade agreements are progressing with multiple countries and groups.\n\nKYC and KYB: Inside Damani\u2019s Avenue Supermarts that refuses to charge more \u2013 Part 1 of 3\n\nWill oil turn into a lingering problem? Is the world economy, India, or the market prepared?\n\nKYB and KYC: Business behind the wealth creator called \u2018Divi\u2019s Lab\u2019 \u2013 Part 2, concluding\n\nKYB and KYC: Business behind the wealth creator called \u201cDivi\u2019s Lab\u201d \u2013 Part 1\n\nOne company, 2 words. Bond yield and CDS: Will they decide the fate of global markets?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers", "source": "Economic Times Economy", "pub_date_str": "27 Oct 2026, 11:18 PM IST", "pub_date_relative": "58m ago"}, {"title": "'Biopic Wasn't Real': Mary Kom Says Priyanka Chopra's Film Showed Just 10% Of Her Struggles", "full_content": "After her eviction from Big Boss season 20, Mary Kom opened up about the 2014 biographical film on her, noting that it did not reflect the full extent of her struggles.", "source": "NDTV Profit", "pub_date_str": "27 Oct 2026, 11:14 PM IST", "pub_date_relative": "1h ago"}, {"title": "Stock Market Today: Dow stays flat, Nasdaq and S&P 500 surge as oil prices fall and chip stocks bounce - MarketWatch", "full_content": "Stock Market Today: Dow stays flat, Nasdaq and S&P 500 surge as oil prices fall and chip stocks bounce MarketWatch Stock market today: Dow, S&P 500, Nasdaq rise as semiconductor stocks lead tech sector higher Yahoo Finance Wall St rises as AI momentum holds heading into key earnings, Fed decision Reuters Tech's relief rally extends as attention turns to tough decisions for the Fed CNBC Stock Market Today: Tech Stocks Extend Gains After Yesterday\u2019s Anthropic Rally WSJ", "source": "Google News Business", "pub_date_str": "27 Oct 2026, 11:13 PM IST", "pub_date_relative": "1h ago"}, {"title": "Kirloskar Pneumatic Shares Drop Over 11% After Q2 Profit Dips, Revenue Falls", "full_content": "Kirloskar Pneumatic's shares steadied their decline by 9.45% to Rs 537.55 later in trade.", "source": "NDTV Profit", "pub_date_str": "27 Oct 2026, 11:11 PM IST", "pub_date_relative": "1h ago"}, {"title": "Judge blasts prosecutors, refuses to sign new criminal complaint against ex-FBI officials", "full_content": "A judge on Tuesday sharply criticized federal prosecutors for failing to get judicial approval before filing a new criminal complaint overnight against two ex-FBI officials accused of lying to Congress about investigations of Hunter Biden .\n\nMagistrate Judge Zia Faruqui said he would not sign off on the new complaint, which added a charge of obstruction against Nikki Floris and Bradley Benavides in U.S. District Court in Washington.\n\n\"I am not going to bless it as a superseding complaint,\" Faruqui said at a court hearing, after Floris' lawyers filed a motion arguing the new complaint was legally deficient and filed in bad faith.\n\nHe told prosecutors that if they wanted to file a superseding complaint, a judge first would have to find probable cause that a crime had been committed, instead of sending him the complaint in the middle of the night and expecting him to sign it.\n\nFaruqui said he did not believe that federal prosecutors had previously sought to file a criminal complaint without a judge's signature.\n\n\"It is not our court's practice \u2026 that unsigned complaints are filed in the docket,\" Faruqui said.\n\n\"I'm concerned with your view as to what the law is,\" the judge told the prosecutors. \"Why today, on this one case, have you changed the entire history of how you charge cases?\"\n\nThe superseding complaint that prosecutors in the office of D.C. U.S. Attorney Jeanine Pirro filed in court early Tuesday contained a signature block with Faruqui's name typed out. But the judge had not personally signed the complaint.", "source": "CNBC Top News", "pub_date_str": "27 Oct 2026, 11:09 PM IST", "pub_date_relative": "1h ago"}, {"title": "3 credit card rewards tips holiday shoppers should know", "full_content": "Many credit cards offer some kind of rewards these days, from simple cash back to travel rewards. With family gatherings and gift-giving, the holidays can be a great time to earn a stockpile of credit card points.\n\nYou don't have to be a credit card expert to do so (you can leave the travel hacking to the CNBC Points Pro ). Understanding the basics of how your card earns rewards and common ways to redeem them can help you maximize them.\n\nBelow, CNBC Select outlines what you need to know about your rewards credit card ahead of shopping this holiday season.\n\nOne of the first steps to understanding the credit cards in your wallet is knowing the type of rewards they earn \u2014 which can help you choose the right card for each gift. These tips can also help you choose a card to apply for.\n\nMany cards offer a base rewards rate of 1X on purchases, but this is typically combined with elevated rewards on specific categories, whether that's groceries, online purchases or gas.\n\nBonus category cards are often at their best when you consistently spend a larger portion of your income on one of the categories. For example, if you spend a lot on online shopping year-round, not just around the holidays, the Blue Cash Everyday\u00ae Card from American Express is a great option. It earns 3% cash back on U.S. online retail purchases on up to $6,000 in spending per year, then 1% back.\n\nAccess above average rewards for groceries and gas, plus receive a 0% intro APR for 15 months from account opening on purchases and balance transfers, then 19.74%-28.74% Variable.\n\nSee rates and fees , terms apply. Read our Blue Cash Everyday\u00ae Card from American Express review .", "source": "CNBC Top News", "pub_date_str": "27 Oct 2026, 11:08 PM IST", "pub_date_relative": "1h ago"}, {"title": "Boeing Sinks 9% To Multi-Month Low As Cash Flow Forecast Lags On Delayed 737 MAX Ramp-Up", "full_content": "Boeing shares plunged 9.6% to $170.23 after the planemaker warned it would miss its 500-aircraft delivery target for 2026 and delayed its 737 production ramp-up. The company now expects $3 billion in free cash flow in 2027.", "source": "NDTV Profit", "pub_date_str": "27 Oct 2026, 11:08 PM IST", "pub_date_relative": "1h ago"}, {"title": "Dune: Part Three Final Trailer Out: Timothee Chalamet's Paul Embraces Dark Side In Epic Finale", "full_content": "Paul Atreides is seen moving towards becoming a villain as years of war, immense power and his position as Emperor begin to change him and make his actions increasingly ruthless.", "source": "NDTV Profit", "pub_date_str": "27 Oct 2026, 11:07 PM IST", "pub_date_relative": "1h ago"}, {"title": "Hyperscale Push: Waaree Energies Bets Big On AI, Acquires 100% Stake In Green Data Centers From Subsidiary", "full_content": "Waaree Energies has approved the acquisition of Waaree Green Data Centers and its two wholly owned subsidiaries from Waaree Renewable Technologies for Rs 1 lakh.", "source": "NDTV Profit", "pub_date_str": "27 Oct 2026, 11:07 PM IST", "pub_date_relative": "1h ago"}, {"title": "Oracle integrates ChatGPT, Codex into apps and expands cloud chip lineup", "full_content": "Oracle on Tuesday announced an expanded collaboration with OpenAI that brings the artificial intelligence lab's ChatGPT and Codex into the software maker's applications to make databases more actionable.\n\nMahesh Thiagarajan, Oracle's president of Cloud Infrastructure, told CNBC at Oracle AI World in Las Vegas that using ChatGPT \"allows anybody to build an application, deploy it, manage it.\"\n\nOpenAI CEO Sam Altman is set to join Oracle co-CEO Clay Magouyrk on stage for an Oracle AI World keynote on Tuesday at 12:40 p.m. ET.\n\nFor OpenAI, the announcement represents another example of the frontier lab's push into the enterprise market, just one day after its key competitor, Anthropic , filed its S-1 as it heads toward an initial public offering .\n\nOracle's database plays a crucial role in underpinning businesses across healthcare and finance in logging and securing data.\n\nThiagarajan said his team observed OpenAI's GPT-6 Astra model get trained at Oracle's Stargate data center campus in Abilene, Texas, and could see the real-time benefits.\n\n\"More businesses are choosing OpenAI as we make it easier to put AI to work through the tools and systems they already use,\" said Greg Brockman, president and co-founder of OpenAI, in the press release.\n\nOracle also said Tuesday that it is making different hardware accessible on its cloud infrastructure, including Google 's tensor processing unit AI chips and OpenAI's Jalape\u00f1o chip.", "source": "CNBC Top News", "pub_date_str": "27 Oct 2026, 11:06 PM IST", "pub_date_relative": "1h ago"}, {"title": "Buy, Sell Or Hold: Vedanta, United Breweries, Bharti Airtel, Mazagon Dock And Godrej Consumer \u2014 Ask Profit", "full_content": "Market experts shared buy, sell and hold recommendations for an array of stocks including Vedanta, United Breweries, Bharti Airtel, Mazagon Dock and Godrej Consumer.", "source": "NDTV Profit", "pub_date_str": "27 Oct 2026, 11:05 PM IST", "pub_date_relative": "1h ago"}, {"title": "'Rs 11 Lakh To Quit': Microsoft Techie's Dilemma In Reddit Post Triggers Netizen Debate Over VEO Offer", "full_content": "A Microsoft engineer asked Reddit whether to accept Rs 11 lakh to leave Microsoft, while a screenshot of another Reddit post drew a sharp reaction on X, after Microsoft Buyout Offers circulate to employees.", "source": "NDTV Profit", "pub_date_str": "27 Oct 2026, 11:02 PM IST", "pub_date_relative": "1h ago"}, {"title": "Tech stocks gain as AI trade revives", "full_content": "Asia follows Wall Street higher in wake of Anthropic\u2019s long-awaited IPO filing", "source": "FT Markets", "pub_date_str": "27 Oct 2026, 10:59 PM IST", "pub_date_relative": "1h ago"}, {"title": "Oracle Adds OpenAI's ChatGPT, Codex To Business Apps; Expands Cloud Infra Chip Roster", "full_content": "Oracle is integrating OpenAI's ChatGPT and Codex into its business applications while adding Google TPUs, OpenAI's Jalapeo chip and Cerebras hardware to its cloud infrastructure.", "source": "NDTV Profit", "pub_date_str": "27 Oct 2026, 10:58 PM IST", "pub_date_relative": "1h ago"}, {"title": "Government mulls simplifying application process under Press Note 2 to ease FDI flow from border nations: Sources", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a Government mulls simplifying application process under Press Note 2 to ease FDI flow from border nations: Sources The Economic Times daily newspaper is available online now. Read Today's Paper Government mulls simplifying application process under Press Note 2 to ease FDI flow from border nations: Sources SECTIONS Government mulls simplifying application process under Press Note 2 to ease FDI flow from border nations: Sources PTI Last Updated: Oct 27, 2026, 10:56:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The government had relaxed FDI restrictions imposed under Press Note 3 for countries sharing land borders with India, such as China and Pakistan, through Press Note 2 in March.\n\nKYC and KYB: Inside Damani\u2019s Avenue Supermarts that refuses to charge more \u2013 Part 1 of 3\n\nWill oil turn into a lingering problem? Is the world economy, India, or the market prepared?\n\nKYB and KYC: Business behind the wealth creator called \u2018Divi\u2019s Lab\u2019 \u2013 Part 2, concluding\n\nKYB and KYC: Business behind the wealth creator called \u201cDivi\u2019s Lab\u201d \u2013 Part 1\n\nOne company, 2 words. Bond yield and CDS: Will they decide the fate of global markets?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "27 Oct 2026, 10:56 PM IST", "pub_date_relative": "1h ago"}, {"title": "Anthropic's IPO could be 'speculative fiction' or a 'generational moment' \u2014 investors are split", "full_content": "Anthropic's IPO prospectus is chock-full of details for investors to celebrate \u2014 and worry about.\n\nThe company's bulls are cheering its 1,300% annual sales growth, 900% net revenue retention and 85% implied gross margin. But its bears are pointing to roughly $80 billion in half-year net losses, hundreds of billions of dollars' worth of compute commitments and more than 90 pages of risk factors .\n\nFrom either camp, the numbers are staggering, and they put Anthropic in position to pursue what could be the largest initial stock offering in history . The IPO is also pushing investors firmly into uncharted territory as they work to value the first pure-play artificial intelligence company to go public at a time of rising interest rates and growing concerns about the size of the AI buildout.\n\nAnthropic was valued in May at $965 billion, and is reportedly looking for an IPO valuation in the range of $1.5 trillion to $2 trillion, which would instantly make it one of the 10 most valuable U.S. tech companies.\n\n\"This is a generational moment, and we'll look back in a decade, and this was the biggest paradigm shift in technology that will shape our lives like nothing else has,\" Denny Fish , a portfolio manager at Janus Henderson Investors, told CNBC's \"The Exchange\" on Monday. \"The devil comes down to the details, and we still don't have all the details yet.\"\n\nAnthropic, founded in 2021 by a group of researchers who defected from OpenAI , is best known for its Claude AI models and services sold through enterprise contracts and subscriptions.\n\nIn its long-awaited prospectus on Monday , Anthropic said its enterprise customer base included more than 11,900 customers with at least $100,000 spend over the prior year, more than 1,900 clients spending $1 million or more and roughly 250 customers spending $10 million or more.", "source": "CNBC Top News", "pub_date_str": "27 Oct 2026, 10:56 PM IST", "pub_date_relative": "1h ago"}, {"title": "AI stocks have rattled U.S. and emerging markets. Japan and Europe could help investors diversify", "full_content": "Turbulence in the tech sector underscores the importance of a more diversified portfolio.", "source": "CNBC Top News", "pub_date_str": "27 Oct 2026, 10:55 PM IST", "pub_date_relative": "1h ago"}, {"title": "Trade Setup For Oct 28: Nifty's Move Above 22,850 Could Trigger Bullish Momentum On Easing Crude Prices", "full_content": "The 22,800 mark continues to act as a hurdle for the Nifty, with the index repeatedly struggling to sustain gains above this level.", "source": "NDTV Profit", "pub_date_str": "27 Oct 2026, 10:52 PM IST", "pub_date_relative": "1h ago"}, {"title": "Prediction market Kalshi expands safeguards for young traders", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Prediction market Kalshi expands safeguards for young traders Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Prediction market Kalshi expands safeguards for young traders SECTIONS Prediction market Kalshi expands safeguards for young traders By Reuters Last Updated: Oct 27, 2026, 10:49:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Kalshi is tightening safeguards for traders aged 18 to 20, introducing a $2,500 monthly deposit limit and alerts for users who put a large share of their funds into one trade. The prediction market also announced partnerships with youth safety groups as scrutiny over gambling risks grows\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "27 Oct 2026, 10:49 PM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "Earnings call transcript: Worldline Q3 2026 revenue stabilizes as turnaround gains pace", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Oct 2026, 12:14 AM IST", "pub_date_relative": "2m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "S&P 500 rises as chip stocks gain for a second day, oil prices ease: Live updates", "full_content": "The S&P 500 rose on Tuesday as enthusiasm surrounding chipmakers led traders to move into the names for another day. Investors also monitored a slide in oil prices and parsed through a slew of corporate earnings as the Federal Reserve began its two-day policy meeting.\n\nThe broad market index was up 0.5%, while the Dow Jones Industrial Average traded around the flatline. The Nasdaq Composite gained 1.1%.\n\nShares of Broadcom climbed 4% on the heels of a coalition of banks \u2014 namely, Bank of America , Citi and Morgan Stanley \u2014 and Blackstone announcing $63 billion in financing for the purchase of Broadcom's technology for Anthropic. Other chipmakers rose in sympathy. Micron Technology was up more than 3%, while Advanced Micro Devices advanced 5%.\n\nThe latest moves in those stocks add to their gains from the prior trading day, which saw the major averages record a winning session , thanks in part to a boost in artificial intelligence-related stocks after Anthropic filed to go public at the Nasdaq. This would mark another major tech IPO for 2026, following SpaceX's blockbuster listing in June.\n\n\"The market has these kind of periodic interludes where it gets concerned about AI spending, and then we tend to go back and tech leads us higher,\" said Jed Ellerbroek, Argent Capital Management portfolio manager. \"The light switch has been off for the last two weeks, and it looks like the first two days this week, the switch has been flipped up again.\"\n\nDespite those recent concerns, Ellerbroek still sees \"great\" conviction from companies that own data centers to continue to grow. \"The potential crack in the foundation remains just how volatile capital markets can be,\" he added.\n\nA decline in oil prices also supported sentiment Tuesday. The moves came after Iranian Supreme Leader Mojtaba Khamenei and his top national security official Mohsen Rezaei discussed the country's conditions for ending the conflict. U.S.", "source": "CNBC Top News", "pub_date_str": "28 Oct 2026, 12:14 AM IST", "pub_date_relative": "2m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Wall Street rises on revived AI momentum as earnings season picks up", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Oct 2026, 12:12 AM IST", "pub_date_relative": "4m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Temenos Q3-26 slides: profit growth accelerates on AI efficiency", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Oct 2026, 12:09 AM IST", "pub_date_relative": "7m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Earnings call transcript: Saint-Gobain Q3 2026 sales rise as pricing drives growth", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Oct 2026, 12:03 AM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Exclusive-JetBlue CEO says no creditor talks, debt restructuring not under consideration", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Oct 2026, 12:01 AM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Stock Market Today: Dow Wobbles As Boeing Dives; Broadcom Pops After Anthropic Report (Live Coverage) - Investor's Business Daily", "full_content": "Stock Market Today: Dow Wobbles As Boeing Dives; Broadcom Pops After Anthropic Report (Live Coverage) Investor's Business Daily See more headlines & perspectives on Google News", "source": "Google News Business", "pub_date_str": "27 Oct 2026, 11:44 PM IST", "pub_date_relative": "32m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Early third-quarter earnings show a 'resilient' U.S. consumer, with signs of strain", "full_content": "One word keeps appearing in third-quarter earnings reports: \"resilient.\"\n\nThat's the early read on U.S. consumers from various companies that released their results this week. Many businesses say Americans are still spending despite inflationary pressures, though not every company has enjoyed the same success.\n\nThe commentary comes amid fears that diesel fuel prices, which hit an all-time high of $6.52 per gallon in September, would drive up prices on consumer products . Economists also worried that more expensive regular gas, combined with high borrowing costs and continued tension between the U.S. and Iran, would spur a pullback in consumer spending.\n\nRetail sales rose 0.8% in September, following a jump of 1.3% in August. Sales in September were boosted by rising gas station spending. Despite all those challenges, some corporate executives say the headwinds aren't yet affecting sales.\n\nWhile retail sales rose 0.8% in September, following a jump of 1.3% in August, the September came as gas station spending jumped. Despite all those challenges, some corporate executives say the headwinds aren't yet affecting sales.\n\n\"There's been a lot of noise in the market this year. There's a lot of geopolitical stuff,\" Royal Caribbean Chairman and CEO Jason Liberty said on the company's earnings call on Tuesday. \"But I look at our business [and our results], and I think that really talks to the resilience of the business, the resilience of the consumer.\"\n\nRoyal Caribbean reported an increase in bookings during its third quarter, while Sherwin-Williams's CEO said the quarter was evidence of the company's strength.\n\nHere's how companies are reading the consumer in the most recent three-month period:", "source": "CNBC Top News", "pub_date_str": "27 Oct 2026, 11:42 PM IST", "pub_date_relative": "34m ago", "cfa_topics": ["Economics", "Financial Statement Analysis"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Weil Gotshal Enlists Bankruptcy Lawyer, as Firm\u2019s Situation Worsens - WSJ", "full_content": "Weil Gotshal Enlists Bankruptcy Lawyer, as Firm\u2019s Situation Worsens WSJ Law firm Weil prepares for possible wind-down as crisis deepens Financial Times Weil\u2019s Succession Chaos Prompts Fear of \u2018Run on Bank\u2019 (1) Bloomberg Law News Exclusive / Weil\u2019s troubles mount with key partner\u2019s pending departure Semafor Weil's Tough Decisions in Path Ahead Law.com", "source": "Google News Business", "pub_date_str": "27 Oct 2026, 11:39 PM IST", "pub_date_relative": "38m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "I just bought this pharma stock for its next generation of blockbuster drugs \u2014 and its dividend", "full_content": "AbbVie is entering a new chapter of growth, fueled by its blockbuster immunology drugs and expanding neuroscience business. Investor Kevin Simpson shares why he's optimistic.", "source": "CNBC Top News", "pub_date_str": "27 Oct 2026, 11:33 PM IST", "pub_date_relative": "43m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Speaker Mike Johnson calls election-transfer concerns \u2018absurd\u2019", "full_content": "U.S. House Speaker Mike Johnson , R-La., committed to a peaceful post-election transfer of power, calling concerns that President Donald Trump and congressional Republicans could contest the results if Democrats win control of Congress \"absurd.\"\n\n\"We're going to follow the Constitution. The Constitution says when a state certifies the election of members of Congress, then they're administered the oath. That's what I'll be doing on Jan. 3 to everybody who's there,\" Johnson said Tuesday during a campaign stop with New York Republican Rep. Mike Lawler , one week before the Nov. 3 midterm election , in response to a question from MS NOW. \"I may not like some of those outcomes, but that's our system. And for anybody to suggest otherwise is absurd.\"\n\nDemocrats and voting rights advocates are bracing for potential challenges if control of the House flips, as is widely projected to happen , or control changes in the Senate, which is more closely contested . Republicans have a majority in both chambers of Congress.\n\nTrump, who has continued to falsely claim that widespread fraud cost him the 2020 election , has fueled those fears by calling to \"nationalize\" elections earlier this year and repeatedly questioning the security of mail voting, while also suggesting noncitizens could vote in large enough numbers to skew results. His administration sued California earlier this month in a fight over noncitizens voting.\n\nThe Department of Justice also sued Alaska last week to block the certification of its results in the event of voter confusion. GOP Sen. Dan Sullivan will appear on the ballot beside Daniel J. Sullivan, a retired teacher whom Republicans have said is on the ballot only as a spoiler candidate.\n\nJohnson, who in the wake of the 2020 election was a key congressional ally of Trump's in his quest to overturn results, on Tuesday said questions about a peaceful transfer were \"a little silly.\"\n\n\"Of course we'll have a peaceful transfer of power.", "source": "CNBC Top News", "pub_date_str": "27 Oct 2026, 11:33 PM IST", "pub_date_relative": "43m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Mother sells gold jewellery, gifts \u20b916 lakh to son, Income Tax Department questions deposits but ITAT grants relief", "full_content": "A Jaipur man who received \u20b9 16 lakh from his mother after she sold her gold jewellery has won relief from the Income Tax Appellate Tribunal (ITAT), which deleted a \u20b9 13.04 lakh addition made by the tax department over unexplained cash deposits.\n\nThe Jaipur bench of the ITAT, in Jhutha Ram v. ITO , ITA No. 1365/JPR/2025, relating to assessment year 2012-13, ruled on 6 October 2026 that the cash gift could not be doubted when it was supported by a notarised gift deed, witnesses and a registered valuer's report.\n\nThe dispute began when the Income Tax Department received information that Jhutha Ram had invested \u20b9 20,23,778 in immovable property, including stamp duty and registration charges, and deposited \u20b9 13,04,900 in his bank account during the relevant financial year.\n\nThe taxpayer had not originally filed his income tax return for assessment year 2012-13. Consequently, the tax department reopened his assessment by issuing a notice under Section 148 of the Income-tax Act on 29 March 2019.\n\nIn response, the taxpayer filed his return on 3 December 2019, declaring an income of \u20b9 2,14,997. However, the assessing officer was not satisfied with the explanation for the transactions.\n\nThe officer made two additions to the taxpayer's income: \u20b9 20,23,778 towards unexplained investment in property and \u20b9 13,04,900 towards unexplained cash deposits. The taxpayer challenged the additions before the Commissioner of Income Tax (Appeals).\n\nWhile the appellate authority deleted the addition relating to the property purchase, it upheld the \u20b9 13.04 lakh addition concerning cash deposits.\n\nDuring the tribunal proceedings, the taxpayer explained that he had received a cash gift of \u20b9 16 lakh from his mother on 2 February 2012.", "source": "LiveMint Money", "pub_date_str": "27 Oct 2026, 11:32 PM IST", "pub_date_relative": "44m ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "GST registration gets easier as CBIC drops Udyam proof, sets seven-day limit for approvals", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Finance \u203a GST registration gets easier as CBIC drops Udyam proof, sets seven-day limit for approvals The Economic Times daily newspaper is available online now. Read Today's Paper GST registration gets easier as CBIC drops Udyam proof, sets seven-day limit for approvals SECTIONS GST registration gets easier as CBIC drops Udyam proof, sets seven-day limit for approvals ET Bureau Last Updated: Oct 27, 2026, 11:32:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Central Board of Indirect Taxes and Customs has issued clarifications regarding GST registration requirements for businesses. Companies will no longer need to provide Udyam certificates or face rejections due to unpaid bills. Registration applications must be processed within seven working days with Aadhaar authentication. Tax demands must include clear justifications and cannot be arbitrary. These changes aim to simplify compliance and reduce disputes in tax administration.\n\nKYC and KYB: Inside Damani\u2019s Avenue Supermarts that refuses to charge more \u2013 Part 1 of 3\n\nWill oil turn into a lingering problem? Is the world economy, India, or the market prepared?\n\nKYB and KYC: Business behind the wealth creator called \u2018Divi\u2019s Lab\u2019 \u2013 Part 2, concluding\n\nKYB and KYC: Business behind the wealth creator called \u201cDivi\u2019s Lab\u201d \u2013 Part 1\n\nOne company, 2 words. Bond yield and CDS: Will they decide the fate of global markets?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers", "source": "Economic Times Economy", "pub_date_str": "27 Oct 2026, 11:32 PM IST", "pub_date_relative": "45m ago", "cfa_topics": ["Fixed Income", "Derivatives", "Ethical & Professional Standards"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Q2 Results Highlights: United Breweries Profit Triples, Doubles, SAIL Revenue Climbs 22%, Piramal Pharma Swings To Profit", "full_content": "From infrastructure and autos to pharma and financials, more than 50 companiesl announced Q2 results today, keeping investors on their toes.", "source": "NDTV Profit", "pub_date_str": "27 Oct 2026, 11:30 PM IST", "pub_date_relative": "46m ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "The big reason Boeing\u2019s stock is falling so hard after earnings", "full_content": "Boeing will come up short on 737 Max deliveries, casting doubt on its turnaround plans.", "source": "MarketWatch Top Stories", "pub_date_str": "27 Oct 2026, 11:29 PM IST", "pub_date_relative": "48m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Centre eases GST rules for post-sales discounts, no prior agreement needed from November 1", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Indicators \u203a Centre eases GST rules for post-sales discounts, no prior agreement needed from November 1 The Economic Times daily newspaper is available online now. Read Today's Paper Centre eases GST rules for post-sales discounts, no prior agreement needed from November 1 SECTIONS Centre eases GST rules for post-sales discounts, no prior agreement needed from November 1 ET Bureau Last Updated: Oct 27, 2026, 11:28:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Centre eases GST rules on post-sales discounts from November 1, no longer requiring a prior agreement, which is expected to help FMCG and pharma companies and retailers.\n\nKYC and KYB: Inside Damani\u2019s Avenue Supermarts that refuses to charge more \u2013 Part 1 of 3\n\nWill oil turn into a lingering problem? Is the world economy, India, or the market prepared?\n\nKYB and KYC: Business behind the wealth creator called \u2018Divi\u2019s Lab\u2019 \u2013 Part 2, concluding\n\nKYB and KYC: Business behind the wealth creator called \u201cDivi\u2019s Lab\u201d \u2013 Part 1\n\nOne company, 2 words. Bond yield and CDS: Will they decide the fate of global markets?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers", "source": "Economic Times Economy", "pub_date_str": "27 Oct 2026, 11:28 PM IST", "pub_date_relative": "48m ago", "cfa_topics": ["Fixed Income", "Derivatives", "Ethical & Professional Standards"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "GLP-1 drug coverage is being dropped by employer plans: What to know about 2027 weight-loss options", "full_content": "With open enrollment season in swing, many employees may notice something conspicuously missing from their benefits menu \u2014 coverage of GLP-1 drugs for weight loss.\n\nMore companies are dropping coverage completely or offering employees less generous payouts. In some cases, they're shifting to a different model altogether \u2014 offering employees a consolation prize of sorts \u2014 access to a weight management program through a third party.\n\nCoverage of these drugs for weight loss is pricey for employers \u2014 typically costing in the mid-$500s to mid-$600s per user monthly. Some companies say whatever the price, covering the drugs is worth it based on employee health. \"We spend about $250 million or more on GLPs, and that's up from zero\" four or five years ago, Bank of America CEO Brian Moynihan told CNBC's Andrew Ross Sorkin in August. \"We see a great impact on the employees. ... Believe me, we're pounding everybody on price and trying to get as cheap [as possible]. But our view is that [because of] the long-term health benefits, plus there may be more short-term health benefits ... it's a good investment.\"\n\nNevertheless, as healthcare costs continue to climb, more employers have been looking for an exit ramp on GLP-1 coverage for weight loss, and that includes bigger companies. A WTW annual health benefits survey fielded over the summer and being released in full on Wednesday found that 53% of employers with more than 100 employees cover GLP-1s for weight loss, down from 57% in 2025. That's the first decline in three years. What's more, 16% of employers said they cover the drugs now but are considering removing them, up from 9% last year.\n\nAccording to a recent Marsh survey of over 1,800 US employers, health insurance cost per employee is expected to rise 8.2% on average in 2027, the biggest increase since 2003, with GLP-1 use accounting for a full percentage point of the overall cost growth.", "source": "CNBC Top News", "pub_date_str": "27 Oct 2026, 11:27 PM IST", "pub_date_relative": "49m ago", "cfa_topics": ["Financial Statement Analysis", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Honda warns 50% Canada auto tariffs would be catastrophic for industry", "full_content": "DETROIT \u2014 The automotive industry faces a \"catastrophic\" scenario if the U.S. and Canada cannot reach a new trade deal by the end of this year, an executive with Honda Motor warned Tuesday.\n\nPresident Donald Trump has threatened to double tariffs on Canadian vehicles and parts from 25% to 50% on Jan. 1 if the two countries don't reach a deal.\n\n\"That really would be catastrophic for the entire industry,\" Jennifer Thomas, senior vice president of corporate affairs at American Honda Motor Co., said during a Reuters automotive conference in Detroit.\n\nThomas said, ideally, the countries would also include Mexico in the arrangement and reach a trilateral deal, like the United States-Mexico-Canada Agreement, or USMCA. Trade associations representing Honda, as well as every major player in the U.S. automotive industry, have been advocating for that more comprehensive accord and against bilateral arrangements between two countries.\n\nHer comments come months after U.S. Trade Representative Jamieson Greer announced that the U.S. would not automatically extend the USMCA, moving the trade pact into an annual review process instead of a 16-year trilateral extension.\n\nTrump negotiated the USMCA to replace the North American Free Trade Agreement during his first term and it took effect in 2020. He later soured on it and accused Canada of \"ripping off the United States of America for years.\"\n\nThomas said she is \"cautiously optimistic\" that cooler heads will prevail to avoid the doubling of tariffs, which Trump threatened in August if no deal can be reached.\n\nShe said she's encouraged by recent reports that the U.S. and Canada have reestablished trade talks, including easing levies on critical materials such as aluminum.", "source": "CNBC Top News", "pub_date_str": "27 Oct 2026, 11:23 PM IST", "pub_date_relative": "53m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "\u2018CryptoDad\u2019 on stablecoins, bitcoin\u2019s role in a portfolio and why he does not directly own any crypto", "full_content": "What former CFTC Chairman Chris Giancarlo tells his own children about buying their first crypto coin.", "source": "MarketWatch Top Stories", "pub_date_str": "27 Oct 2026, 11:23 PM IST", "pub_date_relative": "54m ago", "cfa_topics": ["Alternative Investments", "Portfolio Management"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "India to emerge as major exporter to China, ASEAN, get edge in US trade pact, says Piyush Goyal", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a India to emerge as major exporter to China, ASEAN, get edge in US trade pact, says Piyush Goyal The Economic Times daily newspaper is available online now. Read Today's Paper India to emerge as major exporter to China, ASEAN, get edge in US trade pact, says Piyush Goyal SECTIONS India to emerge as major exporter to China, ASEAN, get edge in US trade pact, says Piyush Goyal By Kirtika Suneja , ET Bureau Last Updated: Oct 27, 2026, 11:18:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Commerce and Industry Minister Piyush Goyal highlighted India's potential to expand exports to China and ASEAN. Negotiations are underway for a trade pact with the United States that could provide India a comparative advantage. The country is also working towards an Investment Protection Agreement with the European Union. Goyal indicated that discussions for preferential trade agreements are progressing with multiple countries and groups.\n\nKYC and KYB: Inside Damani\u2019s Avenue Supermarts that refuses to charge more \u2013 Part 1 of 3\n\nWill oil turn into a lingering problem? Is the world economy, India, or the market prepared?\n\nKYB and KYC: Business behind the wealth creator called \u2018Divi\u2019s Lab\u2019 \u2013 Part 2, concluding\n\nKYB and KYC: Business behind the wealth creator called \u201cDivi\u2019s Lab\u201d \u2013 Part 1\n\nOne company, 2 words. Bond yield and CDS: Will they decide the fate of global markets?\n\nChoose your reason below and click on the Report button. This will alert our m aaree Renewable Technologies for Rs 1 lakh.", "source": "NDTV Profit", "pub_date_str": "27 Oct 2026, 11:07 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Oracle integrates ChatGPT, Codex into apps and expands cloud chip lineup", "full_content": "Oracle on Tuesday announced an expanded collaboration with OpenAI that brings the artificial intelligence lab's ChatGPT and Codex into the software maker's applications to make databases more actionable.\n\nMahesh Thiagarajan, Oracle's president of Cloud Infrastructure, told CNBC at Oracle AI World in Las Vegas that using ChatGPT \"allows anybody to build an application, deploy it, manage it.\"\n\nOpenAI CEO Sam Altman is set to join Oracle co-CEO Clay Magouyrk on stage for an Oracle AI World keynote on Tuesday at 12:40 p.m. ET.\n\nFor OpenAI, the announcement represents another example of the frontier lab's push into the enterprise market, just one day after its key competitor, Anthropic , filed its S-1 as it heads toward an initial public offering .\n\nOracle's database plays a crucial role in underpinning businesses across healthcare and finance in logging and securing data.\n\nThiagarajan said his team observed OpenAI's GPT-6 Astra model get trained at Oracle's Stargate data center campus in Abilene, Texas, and could see the real-time benefits.\n\n\"More businesses are choosing OpenAI as we make it easier to put AI to work through the tools and systems they already use,\" said Greg Brockman, president and co-founder of OpenAI, in the press release.\n\nOracle also said Tuesday that it is making different hardware accessible on its cloud infrastructure, including Google 's tensor processing unit AI chips and OpenAI's Jalape\u00f1o chip.", "source": "CNBC Top News", "pub_date_str": "27 Oct 2026, 11:06 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments" half-year net losses, hundreds of billions of dollars' worth of compute commitments and more than 90 pages of risk factors .\n\nFrom either camp, the numbers are staggering, and they put Anthropic in position to pursue what could be the largest initial stock offering in history . The IPO is also pushing investors firmly into uncharted territory as they work to value the first pure-play artificial intelligence company to go public at a time of rising interest rates and growing concerns about the size of the AI buildout.\n\nAnthropic was valued in May at $965 billion, and is reportedly looking for an IPO valuation in the range of $1.5 trillion to $2 trillion, which would instantly make it one of the 10 most valuable U.S. tech companies.\n\n\"This is a generational moment, and we'll look back in a decade, and this was the biggest paradigm shift in technology that will shape our lives like nothing else has,\" Denny Fish , a portfolio manager at Janus Henderson Investors, told CNBC's \"The Exchange\" on Monday. \"The devil comes down to the details, and we still don't have all the details yet.\"\n\nAnthropic, founded in 2021 by a group of researchers who defected from OpenAI , is best known for its Claude AI models and services sold through enterprise contracts and subscriptions.\n\nIn its long-awaited prospectus on Monday , Anthropic said its enterprise customer base included more than 11,900 customers with at least $100,000 spend over the prior year, more than 1,900 clients spending $1 million or more and roughly 250 customers spending $10 million or more.", "source": "CNBC Top News", "pub_date_str": "27 Oct 2026, 10:56 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "AI stocks have rattled U.S. and emerging markets. Japan and Europe could help investors div expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "27 Oct 2026, 10:49 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "United Breweries Q2 results: Profit jumps 190%, revenue rises 24% as premium beer volumes surge; Kingfisher sales up 44%", "full_content": "Beer maker United Breweries reported strong financial performance for the September quarter on Tuesday, October 27, posting growth across key financial metrics, driven by a surge in premium volumes, premiumisation and productivity initiatives.\n\nThe Dutch multinational brewing company, controlled by Heineken NV, reported a consolidated net profit of \u20b9 134.81 crore in the September quarter, marking a 191% jump from \u20b9 46.34 crore in the July-September period a year ago, according to a regulatory filing.\n\nUnited Breweries\u2019 revenue from operations increased 23.7% year-on-year (YoY) to \u20b9 4,623 crore in the September quarter of FY27, compared with \u20b9 3,737 crore in the corresponding period last year.\n\nRevenue growth was driven by a 24% increase in net sales, supported by strong volume growth, structural price increases, premiumisation, a favorable geographic mix, and an improvement in the company\u2019s operating mix.\n\nThe beer category continued to deliver double-digit growth, with momentum accelerating during the quarter. United Breweries\u2019 sell-in volumes increased 16%, while inventory levels remained below those recorded in the corresponding period last year, reflecting strong consumer demand and healthy market fundamentals.\n\nPremium volumes grew 38%, accelerating by 31 percentage points from the previous quarter. This growth was led by the continued success of Heineken Silver, which recorded a 67% increase, and Kingfisher Ultra, which grew 44%, further strengthening United Breweries\u2019 premium portfolio and driving premiumisation at scale, its filing showed.\n\nEarlier this month, the company launched Heineken\u00ae Silver in Assam, expanding the brand reach to 11 markets.", "source": "LiveMint Markets", "pub_date_str": "27 Oct 2026, 10:47 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Sovereign Gold Bond: \u20b91 lakh grows to \u20b93.09 lakh as RBI fixes SGB redemption price at \u20b914,159; check returns", "full_content": "Investors who purchased Sovereign Gold Bonds (SGBs) in April 2020 have earned substantial returns, with the Reserve Bank of India (RBI) fixing the premature redemption price of the 2020-21 Series I tranche at \u20b9 14,159 per gram. The latest price represents a gain of nearly 209% for investors who subscribed online at a discount.\n\nAccording to the RBI's October 27 announcement, the redemption price will apply on October 28, 2026. The price is more than three times the original issue price, reflecting the sharp appreciation in gold over the past six-and-a-half years.\n\nThe SGB 2020-21 Series I bonds were issued on April 28, 2020, at \u20b9 4,639 per gram. Investors who applied online and paid digitally received a discount of \u20b9 50 per gram, bringing their purchase price down to \u20b9 4,589.\n\nWith the RBI fixing the redemption price at \u20b9 14,159 per gram, investors who subscribed online have earned a capital gain of \u20b9 9,570 per gram. This translates into an absolute return of approximately 208.5%, excluding interest.\n\nInvestors who purchased the bonds at the regular issue price of \u20b9 4,639 have earned \u20b9 9,520 per gram, representing a return of approximately 205.2%.\n\nFor instance, an investor who purchased 20 grams of SGBs online in April 2020 would have invested \u20b9 91,780. At the latest redemption price, those 20 units would be worth \u20b9 2,83,180, resulting in a capital gain of \u20b9 1,91,400.\n\nSimilarly, an investment equivalent to \u20b9 1 lakh at the discounted issue price would now be worth approximately \u20b9 3.09 lakh, excluding interest and taxes. Actual investments are made in whole units of one gram each.\n\nApart from capital appreciation, Sovereign Gold Bonds offer an annual interest rate of 2.5% on the original investment amount.", "source": "LiveMint Money", "pub_date_str": "27 Oct 2026, 10:46 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Fixed Income", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "GM to transfer stock listing to Nasdaq", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a GM to transfer stock listing to Nasdaq Powered By The Economic Times daily newspaper is available online now. Read Today's Paper GM to transfer stock listing to Nasdaq SECTIONS GM to transfer stock listing to Nasdaq By Reuters Last Updated: Oct 27, 2026, 10:44:00 PM IST Rate Story Follow us Share Font Size Abc
