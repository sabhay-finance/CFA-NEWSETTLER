<script>
    // This variable will be injected during the build process
    const allData = {"general": [{"title": "The case against buying and holding stocks for the long term", "full_content": "The number of stocks outperforming the index over time is shrinking, increasing the need for active managers to be nimble.", "source": "MarketWatch Top Stories", "pub_date_str": "25 Sep 2026, 12:36 AM IST", "pub_date_relative": "6m ago"}, {"title": "30-year Treasury yield hits highest level since 2004 as bond market rout continues", "full_content": "Treasury yields were trading at multidecade highs on Thursday, as investor bets on another rate hike from the Federal Reserve mounted.\n\nThe 30-year Treasury bond yield was up 6 basis points at 5.462% and reached a 2004 peak. The benchmark 10-year Treasury note yield , which is tied to rates on mortgages, rose more than 5 basis points to 5.166% and hit its highest level since July 2007. The yield on the 2-year note rose slightly to 4.897% and remained close to a 2023 high.\n\nOne basis point equals 0.01%, and yields and prices move in opposite directions.\n\nGlobal bonds also sold off. Japan's 10-year JGB yield rose its highest since August 1996. U.K. Gilts and German Bunds also moved higher, with yields on various European bonds hitting fresh multi-year highs.\n\nThursday's moves build on a U.S. Treasury rout that took place Wednesday. The 10-year Treasury yield had its biggest one-day jump since April 7, 2025 as traders reacted to stronger-than-expected U.S. economic data, hawkish commentary from a Federal Reserve official and high oil prices.\n\n\"The combination of fiscal, economic, geopolitical, and supply-side inflation pressures converging has bond markets in less familiar territory. The recent rise in yields can no longer be attributed simply to concerns over the deficit,\" said from Mike Sanders, head of fixed income at Madison Investments.\n\nThe data drove expectations of more rate hikes, with traders last pricing in a more-than-75 % chance that the Federal Open Market Committee will increase rates again at its October meeting, per the CME Group's FedWatch tool . That compares to a roughly 49% probability just a week ago.\n\n\"With markets pricing in four rate hikes through next year, the Fed is being pushed toward tighter policy at a time when the risk of a policy mistake is rising,\" he added.", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 12:31 AM IST", "pub_date_relative": "10m ago"}, {"title": "Magna at CIBC Eastern Institutional Investor Conference: margins, cash flow rise", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Sep 2026, 12:24 AM IST", "pub_date_relative": "17m ago"}, {"title": "Senate narrowly votes down resolution calling for end to Iran war", "full_content": "The Senate on Thursday narrowly voted down a measure demanding an end to the U.S. war with Iran .\n\nThe chamber voted 49-50 on the resolution, the latest to call for an end to the war.\n\nAll but four Republicans voted against the measure despite concerns GOP candidates will face fallout in November's midterm elections from the war's economic costs.\n\nThe Republicans who voted for the resolution were Sens. Thom Tillis of North Carolina, Maine's Susan Collins, Lisa Murkowski of Alaska and Rand Paul of Kentucky. Sen. John Fetterman of Pennsylvania was the lone Democrat to vote against it.\n\nAn affirmative vote on the measure, known as a War Powers Resolution , would have directed President Donald Trump to remove U.S. troops from hostilities in Iran unless Congress explicitly approves the war.\n\nThe Senate has voted repeatedly on similar measures since the war began, adopting one of them.\n\nThe measure being voted on Thursday \u2014 a \"concurrent resolution\" \u2014 did not carry the force of law and is never signed by the president, making the vote mostly symbolic if it had passed.\n\nThe Democratic leaders of the legislative push, however, argue that the Constitution vests authority to declare war in Congress, not the executive branch, and that the president must abide by their disapproval whether or not he signs it.", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 12:23 AM IST", "pub_date_relative": "19m ago"}, {"title": "Fidelity National Financial stock hits 52-week low at 41.1 USD", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Sep 2026, 12:19 AM IST", "pub_date_relative": "23m ago"}, {"title": "Alaska Air expects Boeing 737 MAX 10 certification by end-September", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Sep 2026, 12:18 AM IST", "pub_date_relative": "23m ago"}, {"title": "Hormel Foods stock hits 52-week low at 19.7 USD", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Sep 2026, 12:18 AM IST", "pub_date_relative": "23m ago"}, {"title": "Hyundai expected to outsell Ford in third quarter as Detroit automakers lack hybrids", "full_content": "DETROIT \u2014 Hyundai Motor is expected to outsell Ford Motor in quarterly sales for the first time ever, according to a new forecast released Thursday by Cox Automotive.\n\nThe South Korean automaker is expected to report a 6.5% increase in year-over-year sales from July through September to 511,421 units. That compares with an expected 7.1% decline for Ford over the third quarter to 504,172 new vehicles sold, according to Cox predictions.\n\nThe expected leaderboard change would make Hyundai the third best-selling automaker in the U.S. behind General Motors and Toyota Motor.\n\nThat change comes as new vehicle sales have been stronger than expected this year. Cox on Thursday raised its 2026 forecast by roughly 2%, to 16.1 million units.\n\n\"The automotive market this year has been pretty resilient,\" Jeremy Robb, Cox chief economist, said Thursday during a media call. \"New and used sales are both down year over year, but they're not down really that much.\"\n\nIn response to the forecast, Ford said it continues to outsell Hyundai through August.\n\nThe Detroit automaker also took the opportunity to say that the forecast \"does highlight the rapid growth of vehicles imported from Korea \u2013 by companies like Hyundai, Kia and GM,\" which has notably increased its U.S. vehicle sales from South Korean plants this decade.\n\n\"Currently, due to tariffs, currency, labor costs and supply chains, it is very advantageous to build in Korea versus building in the U.S. -- which Ford does more than any automaker,\" Ford said in the emailed statement.", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 12:16 AM IST", "pub_date_relative": "25m ago"}, {"title": "Trump-Xi summit in Washington begins with great fanfare but low expectations", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Sep 2026, 12:12 AM IST", "pub_date_relative": "30m ago"}, {"title": "Cerrado Gold at 96th Emerging Growth Conference: growth pipeline in focus", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Sep 2026, 12:12 AM IST", "pub_date_relative": "30m ago"}, {"title": "Gaming stocks fall after Meta unveils AI game-building tools", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Sep 2026, 12:09 AM IST", "pub_date_relative": "32m ago"}, {"title": "Analysis: Higher Treasury yields deliver a reality check on a hot, inflation-prone economy", "full_content": "The jump in Treasury yields this week is delivering a reality check about a strong economy, stubborn inflation and the growing cost of the national debt .\n\nThat will put the squeeze on the debt-heavy Trump administration as it tries to find a path forward for the economy.\n\nIt also highlights the tension between the nation's top two economic policymakers. Federal Reserve Chairman Kevin Warsh wants to hear what markets are saying. Treasury Secretary Scott Bessent wants to use his tools to change the message when he believes it's wrong.\n\nBond yields jumped Wednesday, and were trading near multiple-decade highs Thursday , as traders digested surprisingly positive purchasing managers indexes against the backdrop of a Fed that as of last week has started hiking its short-term policy rate. The 2-year Treasury yield rose 10 basis points to 4.87%, while the 10-year Treasury climbed 17 basis points to 5.12% on Thursday morning.\n\nThose yields are extraordinary by recent standards but less so over a longer horizon. The 10-year Treasury averaged about 5.9% from 1990 through 2006, before years of slow growth and usually low interest rates reset Americans' expectations about borrowing costs.\n\nNow the economy looks stronger, propelled in part by a surge in investment in artificial intelligence . Competition for capital has contributed to higher interest rates.\n\nThe boom appears to go deeper. The Census Bureau reported last week that in 2025 real median household income rose 2.6% to $87,460 and the poverty rate fell by half a percentage point to 10.2%.\n\nThe economy's recent strength has also come on the back of a flood of government deficit spending, driven in part by large tax cuts under the first and second Trump administrations, with Iran war spending piling on. The federal deficit is set to come in above 6% of gross domestic product this year, based on data from the Congressional Budget Office.", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 12:08 AM IST", "pub_date_relative": "33m ago"}, {"title": "Wall Street dips as investors focus on US-Iran war", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Sep 2026, 12:06 AM IST", "pub_date_relative": "35m ago"}, {"title": "Surging Treasury yields pose a brand new problem for Kevin Warsh and the Fed", "full_content": "The bond market is yelling at the Federal Reserve, but the messages are coming from different directions and pose a dilemma for policymakers as they seek to strike a balance that won't tank the economy.\n\nTreasury yields continued their upward march Thursday as investors sought to price in a variety of factors: inflation still hovering well above the Fed's 2% goal, another bump up in energy prices and the impact of a global hyperscaler financial arms race and accompanying debt issuance.\n\nIn the past, policymakers have been willing to look through inflation spurts from temporary shocks like high energy prices and tariffs. And the narrative not so long ago was that the artificial intelligence investing boom was a story that would last a year or two and ultimately prove disinflationary.\n\nBut now Fed officials are rethinking the impact of those factors and seeing the danger of more durable inflation.\n\nAt the same time, markets are grappling with a central bank that suddenly has no interest in telegraphing its next moves, leaving an uncertain calculus on who is calling the shots \u2014 policymakers or market players.\n\n\"The time of looking through the initial supply shock has come to an end,\" said Joseph Brusuelas, chief economist at RSM. \"The bias has to be towards restoring price stability, and they should take what's going on seriously.\"\n\nMarkets expect the central bank will indeed take a firmer hand on inflation.\n\nOver the past day or so, traders raised the odds of a rate hike in October, which would come only a month or so after last week's quarter percentage point increase . They also see a third increase either late this year or early in 2027, with additional hikes possible in subsequent months.", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 12:05 AM IST", "pub_date_relative": "37m ago"}, {"title": "Nearly 170,000 pounds of raw meat recalled for false inspection labels - The Washington Post", "full_content": "Nearly 170,000 pounds of raw meat recalled for false inspection labels The Washington Post More than 167,000 pounds of meat with false inspection labels recalled nationwide CNN More than 160,000 pounds of meat bearing false USDA inspection labels recalled AP News 167,000 pounds of meat recalled from NC company. What we know Raleigh News & Observer More than 80 tons of raw meat recalled as 'unsafe to eat'. See list USA Today", "source": "Google News Business", "pub_date_str": "25 Sep 2026, 12:04 AM IST", "pub_date_relative": "37m ago"}, {"title": "The \u2018Monster\u2019 Behind Russia\u2019s Global Effort to Evade Western Sanctions - The New York Times", "full_content": "The \u2018Monster\u2019 Behind Russia\u2019s Global Effort to Evade Western Sanctions The New York Times Russia\u2019s $6.9bn sanctions evasion scheme Financial Times Russian FinTech Allegedly Laundered $6.9 Billion Via Global Banks pymnts.com How a Russian-backed network linked to 2 African countries moved $6.9 billion through banks using forged documents Business Insider Africa A7 scandal exposes gaps in periodic compliance checks FinTech Global", "source": "Google News Business", "pub_date_str": "25 Sep 2026, 12:03 AM IST", "pub_date_relative": "39m ago"}, {"title": "Nifty outlook for tomorrow: Why 23,000 matters after breaking below 4-month support? Resistance, support levels | Friday", "full_content": "After forming an inside candle on Wednesday, the Nifty witnessed a breakdown from the inside candle pattern on Thursday, opening with a gap down. Selling pressure increased as the session progressed, with the index slipping below the low of the long bearish candle formed on September 15. The decline further intensified as the Nifty breached the horizontal trendline support near the 23,070 level.\n\nThe day\u2019s movement resulted in the formation of a long bearish candle with a gap-down opening, reflecting strong selling interest among market participants. The index closed below the June 8 swing low of 23,070, confirming a breakdown from the four-month-long horizontal support zone.\n\nThe overall technical setup has turned negative, with bears gaining control in the short term. A sustained break below the 23,000 mark could extend the decline towards the next support level of 22,719 in the near to medium term. On the upside, any recovery attempt is likely to face resistance in the September 24 gap zone, placed between 23,282 and 23,350.\n\nThe 14-period daily RSI is currently placed near 31. During the recent recovery attempt, the RSI failed to cross above the 40 mark and reversed lower, indicating a shift towards a super bearish range. The MACD histogram has also expanded on the downside, highlighting increasing bearish momentum.\n\nSouth Indian Bank witnessed a strong rally of nearly 32% from its May 18 low to the June 18 high. Thereafter, the stock retraced around 50% of the previous upmove and entered a consolidation phase, forming a triangular pattern.\n\nRecently, the stock has delivered a breakout from the triangular formation, supported by strong volumes. The NSE recorded the highest single-day trading volume in over two months, indicating increased participation during the breakout.", "source": "LiveMint Markets", "pub_date_str": "25 Sep 2026, 12:01 AM IST", "pub_date_relative": "41m ago"}, {"title": "I spend my time and money caring for my aging mother \u2014 yet she gave my brother $100,000. Should I pull back?", "full_content": "\u201cMy mother started having more trouble getting around. First a knee replacement, then a fall.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "25 Sep 2026, 12:01 AM IST", "pub_date_relative": "41m ago"}, {"title": "Sugar imports likely for second year", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Agriculture \u203a Sugar imports likely for second year The Economic Times daily newspaper is available online now. Read Today's Paper Sugar imports likely for second year SECTIONS Sugar imports likely for second year By Jayashree Bhosale , ET Bureau Last Updated: Sep 25, 2026, 12:00:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The world's second-largest sugar producer had remained structurally surplus for nearly a decade but was forced to import sugar in the 2025-26 season after lower output pushed domestic prices to record highs. Prolonged rainfall shortages in Maharashtra and Karnataka, coupled with the state prioritising reservoir water for drinking over irrigation, are expected to reduce sugar content in cane due for crushing from October, executives said.\n\nBuilding recycling plants is fine. Will they get enough scrap?\n\nBiogas found its ethanol moment this month. Can it now find scale?\n\nHas the US Fed and AI created a costlier world? And has the queue got longer for India?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers\n\nLogin using your ET Prime credentials to enjoy all member benefits\n\nLog out of your current logged-in account and log in again using your ET Prime credentials to enjoy all member benefits.", "source": "Economic Times Economy", "pub_date_str": "25 Sep 2026, 12:00 AM IST", "pub_date_relative": "41m ago"}, {"title": "Federal Reserve Board requests public comment on two proposals related to establishing a regulatory framework for Board-supervised payment stablecoin issuers under the GENIUS Act", "full_content": "Official websites use .gov A .gov website belongs to an official government organization in the United States.\n\nSecure .gov websites use HTTPS A lock ( Lock Locked padlock icon ) or https:// means you've safely connected to the .gov website. Share sensitive information only on official, secure websites.\n\nFor release at 2:30 p.m. EDT Share --> --> --> --> --> --> The Federal Reserve Board on Thursday requested public comment on two proposals related to establishing a regulatory framework for Board-supervised payment stablecoin issuers under the GENIUS Act.\n\nThe first proposal would require that Board-supervised payment stablecoin issuers fully back their stablecoins with certain permissible reserve assets, such as short-term Treasury bills and certain other high-quality, liquid assets. The proposal would also establish standardized capital requirements to address certain credit and operational risks of payment stablecoin activities, as well as risk management standards, in accordance with the law. Separately, the proposal would introduce rules for Board-supervised firms that safekeep the assets backing payment stablecoins. It would also clarify the permissibility of stablecoin and related activities for Board-supervised banks.\n\nThe second proposal would establish a tailored application process for Board-supervised banks applying to issue payment stablecoins. These applicants would be required to submit a business plan and financial information, among other documents. The proposal would also create a process governing appeals, hearings, and final determinations for applications.\n\nThe comment period will close 60 days after publication in the Federal Register .\n\nFor media inquiries, please email [email protected] or call (202) 452-2955.\n\nFederal Register notice: Application Procedures for Board-Supervised Insured Depository Institutions Seeking Approval for a Subsidiary to Issue Payment Stablecoins (PDF)", "source": "Federal Reserve", "pub_date_str": "25 Sep 2026, 12:00 AM IST", "pub_date_relative": "42m ago"}], "cfa": [{"title": "30-year Treasury yield hits highest level since 2004 as bond market rout continues", "full_content": "Treasury yields were trading at multidecade highs on Thursday, as investor bets on another rate hike from the Federal Reserve mounted.\n\nThe 30-year Treasury bond yield was up 6 basis points at 5.462% and reached a 2004 peak. The benchmark 10-year Treasury note yield , which is tied to rates on mortgages, rose more than 5 basis points to 5.166% and hit its highest level since July 2007. The yield on the 2-year note rose slightly to 4.897% and remained close to a 2023 high.\n\nOne basis point equals 0.01%, and yields and prices move in opposite directions.\n\nGlobal bonds also sold off. Japan's 10-year JGB yield rose its highest since August 1996. U.K. Gilts and German Bunds also moved higher, with yields on various European bonds hitting fresh multi-year highs.\n\nThursday's moves build on a U.S. Treasury rout that took place Wednesday. The 10-year Treasury yield had its biggest one-day jump since April 7, 2025 as traders reacted to stronger-than-expected U.S. economic data, hawkish commentary from a Federal Reserve official and high oil prices.\n\n\"The combination of fiscal, economic, geopolitical, and supply-side inflation pressures converging has bond markets in less familiar territory. The recent rise in yields can no longer be attributed simply to concerns over the deficit,\" said from Mike Sanders, head of fixed income at Madison Investments.\n\nThe data drove expectations of more rate hikes, with traders last pricing in a more-than-75 % chance that the Federal Open Market Committee will increase rates again at its October meeting, per the CME Group's FedWatch tool . That compares to a roughly 49% probability just a week ago.\n\n\"With markets pricing in four rate hikes through next year, the Fed is being pushed toward tighter policy at a time when the risk of a policy mistake is rising,\" he added.", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 12:31 AM IST", "pub_date_relative": "10m ago", "cfa_topics": ["Quantitative Methods", "Economics", "Equity Investments", "Fixed Income", "Portfolio Management"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "Cerrado Gold at 96th Emerging Growth Conference: growth pipeline in focus", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Sep 2026, 12:12 AM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Analysis: Higher Treasury yields deliver a reality check on a hot, inflation-prone economy", "full_content": "The jump in Treasury yields this week is delivering a reality check about a strong economy, stubborn inflation and the growing cost of the national debt .\n\nThat will put the squeeze on the debt-heavy Trump administration as it tries to find a path forward for the economy.\n\nIt also highlights the tension between the nation's top two economic policymakers. Federal Reserve Chairman Kevin Warsh wants to hear what markets are saying. Treasury Secretary Scott Bessent wants to use his tools to change the message when he believes it's wrong.\n\nBond yields jumped Wednesday, and were trading near multiple-decade highs Thursday , as traders digested surprisingly positive purchasing managers indexes against the backdrop of a Fed that as of last week has started hiking its short-term policy rate. The 2-year Treasury yield rose 10 basis points to 4.87%, while the 10-year Treasury climbed 17 basis points to 5.12% on Thursday morning.\n\nThose yields are extraordinary by recent standards but less so over a longer horizon. The 10-year Treasury averaged about 5.9% from 1990 through 2006, before years of slow growth and usually low interest rates reset Americans' expectations about borrowing costs.\n\nNow the economy looks stronger, propelled in part by a surge in investment in artificial intelligence . Competition for capital has contributed to higher interest rates.\n\nThe boom appears to go deeper. The Census Bureau reported last week that in 2025 real median household income rose 2.6% to $87,460 and the poverty rate fell by half a percentage point to 10.2%.\n\nThe economy's recent strength has also come on the back of a flood of government deficit spending, driven in part by large tax cuts under the first and second Trump administrations, with Iran war spending piling on. The federal deficit is set to come in above 6% of gross domestic product this year, based on data from the Congressional Budget Office.", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 12:08 AM IST", "pub_date_relative": "33m ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Surging Treasury yields pose a brand new problem for Kevin Warsh and the Fed", "full_content": "The bond market is yelling at the Federal Reserve, but the messages are coming from different directions and pose a dilemma for policymakers as they seek to strike a balance that won't tank the economy.\n\nTreasury yields continued their upward march Thursday as investors sought to price in a variety of factors: inflation still hovering well above the Fed's 2% goal, another bump up in energy prices and the impact of a global hyperscaler financial arms race and accompanying debt issuance.\n\nIn the past, policymakers have been willing to look through inflation spurts from temporary shocks like high energy prices and tariffs. And the narrative not so long ago was that the artificial intelligence investing boom was a story that would last a year or two and ultimately prove disinflationary.\n\nBut now Fed officials are rethinking the impact of those factors and seeing the danger of more durable inflation.\n\nAt the same time, markets are grappling with a central bank that suddenly has no interest in telegraphing its next moves, leaving an uncertain calculus on who is calling the shots \u2014 policymakers or market players.\n\n\"The time of looking through the initial supply shock has come to an end,\" said Joseph Brusuelas, chief economist at RSM. \"The bias has to be towards restoring price stability, and they should take what's going on seriously.\"\n\nMarkets expect the central bank will indeed take a firmer hand on inflation.\n\nOver the past day or so, traders raised the odds of a rate hike in October, which would come only a month or so after last week's quarter percentage point increase . They also see a third increase either late this year or early in 2027, with additional hikes possible in subsequent months.", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 12:05 AM IST", "pub_date_relative": "37m ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "The \u2018Monster\u2019 Behind Russia\u2019s Global Effort to Evade Western Sanctions - The New York Times", "full_content": "The \u2018Monster\u2019 Behind Russia\u2019s Global Effort to Evade Western Sanctions The New York Times Russia\u2019s $6.9bn sanctions evasion scheme Financial Times Russian FinTech Allegedly Laundered $6.9 Billion Via Global Banks pymnts.com How a Russian-backed network linked to 2 African countries moved $6.9 billion through banks using forged documents Business Insider Africa A7 scandal exposes gaps in periodic compliance checks FinTech Global", "source": "Google News Business", "pub_date_str": "25 Sep 2026, 12:03 AM IST", "pub_date_relative": "39m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Nifty outlook for tomorrow: Why 23,000 matters after breaking below 4-month support? Resistance, support levels | Friday", "full_content": "After forming an inside candle on Wednesday, the Nifty witnessed a breakdown from the inside candle pattern on Thursday, opening with a gap down. Selling pressure increased as the session progressed, with the index slipping below the low of the long bearish candle formed on September 15. The decline further intensified as the Nifty breached the horizontal trendline support near the 23,070 level.\n\nThe day\u2019s movement resulted in the formation of a long bearish candle with a gap-down opening, reflecting strong selling interest among market participants. The index closed below the June 8 swing low of 23,070, confirming a breakdown from the four-month-long horizontal support zone.\n\nThe overall technical setup has turned negative, with bears gaining control in the short term. A sustained break below the 23,000 mark could extend the decline towards the next support level of 22,719 in the near to medium term. On the upside, any recovery attempt is likely to face resistance in the September 24 gap zone, placed between 23,282 and 23,350.\n\nThe 14-period daily RSI is currently placed near 31. During the recent recovery attempt, the RSI failed to cross above the 40 mark and reversed lower, indicating a shift towards a super bearish range. The MACD histogram has also expanded on the downside, highlighting increasing bearish momentum.\n\nSouth Indian Bank witnessed a strong rally of nearly 32% from its May 18 low to the June 18 high. Thereafter, the stock retraced around 50% of the previous upmove and entered a consolidation phase, forming a triangular pattern.\n\nRecently, the stock has delivered a breakout from the triangular formation, supported by strong volumes. The NSE recorded the highest single-day trading volume in over two months, indicating increased participation during the breakout.", "source": "LiveMint Markets", "pub_date_str": "25 Sep 2026, 12:01 AM IST", "pub_date_relative": "41m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Sugar imports likely for second year", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Agriculture \u203a Sugar imports likely for second year The Economic Times daily newspaper is available online now. Read Today's Paper Sugar imports likely for second year SECTIONS Sugar imports likely for second year By Jayashree Bhosale , ET Bureau Last Updated: Sep 25, 2026, 12:00:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The world's second-largest sugar producer had remained structurally surplus for nearly a decade but was forced to import sugar in the 2025-26 season after lower output pushed domestic prices to record highs. Prolonged rainfall shortages in Maharashtra and Karnataka, coupled with the state prioritising reservoir water for drinking over irrigation, are expected to reduce sugar content in cane due for crushing from October, executives said.\n\nBuilding recycling plants is fine. Will they get enough scrap?\n\nBiogas found its ethanol moment this month. Can it now find scale?\n\nHas the US Fed and AI created a costlier world? And has the queue got longer for India?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers\n\nLogin using your ET Prime credentials to enjoy all member benefits\n\nLog out of your current logged-in account and log in again using your ET Prime credentials to enjoy all member benefits.", "source": "Economic Times Economy", "pub_date_str": "25 Sep 2026, 12:00 AM IST", "pub_date_relative": "41m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Federal Reserve Board requests public comment on two proposals related to establishing a regulatory framework for Board-supervised payment stablecoin issuers under the GENIUS Act", "full_content": "Official websites use .gov A .gov website belongs to an official government organization in the United States.\n\nSecure .gov websites use HTTPS A lock ( Lock Locked padlock icon ) or https:// means you've safely connected to the .gov website. Share sensitive information only on official, secure websites.\n\nFor release at 2:30 p.m. EDT Share --> --> --> --> --> --> The Federal Reserve Board on Thursday requested public comment on two proposals related to establishing a regulatory framework for Board-supervised payment stablecoin issuers under the GENIUS Act.\n\nThe first proposal would require that Board-supervised payment stablecoin issuers fully back their stablecoins with certain permissible reserve assets, such as short-term Treasury bills and certain other high-quality, liquid assets. The proposal would also establish standardized capital requirements to address certain credit and operational risks of payment stablecoin activities, as well as risk management standards, in accordance with the law. Separately, the proposal would introduce rules for Board-supervised firms that safekeep the assets backing payment stablecoins. It would also clarify the permissibility of stablecoin and related activities for Board-supervised banks.\n\nThe second proposal would establish a tailored application process for Board-supervised banks applying to issue payment stablecoins. These applicants would be required to submit a business plan and financial information, among other documents. The proposal would also create a process governing appeals, hearings, and final determinations for applications.\n\nThe comment period will close 60 days after publication in the Federal Register .\n\nFor media inquiries, please email [email protected] or call (202) 452-2955.\n\nFederal Register notice: Application Procedures for Board-Supervised Insured Depository Institutions Seeking Approval for a Subsidiary to Issue Payment Stablecoins (PDF)", "source": "Federal Reserve", "pub_date_str": "25 Sep 2026, 12:00 AM IST", "pub_date_relative": "42m ago", "cfa_topics": ["Fixed Income", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "8% mortgage rates are \u2018not an impossibility\u2019 as the 30-year fixed rate surges", "full_content": "With the 10-year Treasury up sharply and the outlook for the U.S. economy looking unclear, some say 8% mortgage rates are back on the table.", "source": "MarketWatch Top Stories", "pub_date_str": "24 Sep 2026, 11:59 PM IST", "pub_date_relative": "43m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "S&P 500 is little changed as traders weigh rising yields against optimism over Strait of Hormuz reopening: Live updates", "full_content": "Stocks wavered on Thursday, with traders digesting another move higher on Treasury yields as well as a report of the U.S. and Iran potentially reaching a deal to reopen the Strait of Hormuz.\n\nThe S&P 500 was flat, as was the Nasdaq Composite . The Dow Jones Industrial Average dropped 84 points, or 0.2%.\n\nStocks came off their session lows after Reuters, citing sources, reported that U.S. and Iranian negotiators in New York are considering a deal that would bring a phased end to the conflict in the Middle East, whereby Iran would reopen the Strait of Hormuz and the U.S. would lift its economic blockade on Tehran.\n\nBut any gains were restricted by the move higher in oil prices and bond yields. International Brent crude futures rose 2% to around $105 a barrel, while West Texas Intermediate crude gained 2% to around $94.\n\nMeanwhile, the 30-year Treasury bond yield touched 5.446%, a level not seen since June 2004. The benchmark 10-year Treasury note yield , which is tied to rates on mortgages, surged to 5.15%, near levels not reached since July 2007. The 2-year note yield was flat on the day, but scaled to a 2023 high earlier in the week.\n\nAs yields surged, so did the market's anticipation of further rate hikes from central bank policymakers. Fed funds futures trading suggests a 66% likelihood that the Federal Reserve lifts its key rate once more in October, per the CME FedWatch tool . That compares to a roughly 55% probability just a week ago.\n\nHigher bond yields tend to squeeze consumers' finances as they face higher borrowing costs at a time when they're already paying more in fuel costs.\n\nYet, Wednesday's readings from S&P Global's manufacturing and services purchasing managers' indexes suggested that U.S. businesses are continuing to boom.", "source": "CNBC Top News", "pub_date_str": "24 Sep 2026, 11:58 PM IST", "pub_date_relative": "43m ago", "cfa_topics": ["Quantitative Methods", "Economics", "Equity Investments", "Fixed Income", "Derivatives", "Portfolio Management"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "Bond liquidation wrecks small caps. Here's how bad some traders see it getting", "full_content": "While the S&P 500 powers through rising bond yields and higher crude oil prices, one section of the U.S. stock market is falling behind: small caps.\n\nAt the start of the month, the Russel 2000 was up 20% year to date, beating both the S&P 500's 13% gain and the Nasdaq-100's 17% advance. But September has meant big pain for small caps, with the Russell 2000 now only up 14% year to date, versus respective returns of 20% and 12% for the S&P 500 and Nasdaq-100.\n\nThe culprits seems clear: higher interest-rates and falling bond prices. The correlation between the iShares Russell 2000 ETF (IWM) and the 20+ Year Treasury Bond ETF (TLT) is currently 0.51, compared to 0.29 with the State Street SPDR S&P 500 ETF Trust (SPY) and 0.1 with the Invesco QQQ Trust . Last week, the correlation between small-caps and the price of the 10-year note touched a one-year high above 0.97.\n\nIWM 1-month chart \"Small caps have had a more difficult time adjusting to the Fed's hawkish turn and continued increase in rates at the long end, evidenced by the fact that their negative correlation to the 10-year Treasury yield is two times that of large caps,\" said Kevin Gordon, head of macro research and strategy at the Schwab Center for Financial Research.\n\nOptions trading around the IWM suggests the rate-driven shift in power rankings for the equity indexes can hold. More puts traded than calls in IWM on Thursday, while the volume ratio in SPY was close to even and calls outnumbered puts in QQQ.\n\nVolume in SPY and QQQ options was 40% above the 30-day average by midday Thursday, while volume in IWM was almost double. Traders likely bought 480,000 puts, compared to 371,000 calls, and total open interest in puts is now just shy of 7 million contracts, compared to 3 million in puts, Cboe LiveVol data show.\n\nOf the total $322 million in premium traded in IWM Thursday, $100 million was likely spent buying puts, compared to $50 million likely spent buying calls, according to SpotGamma data.", "source": "CNBC Top News", "pub_date_str": "24 Sep 2026, 11:52 PM IST", "pub_date_relative": "49m ago", "cfa_topics": ["Quantitative Methods", "Equity Investments", "Fixed Income", "Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "Ministry of Finnace to engage with banks and traders to allay Merchant Discount Rate concerns", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a Ministry of Finnace to engage with banks and traders to allay Merchant Discount Rate concerns The Economic Times daily newspaper is available online now. Read Today's Paper Ministry of Finnace to engage with banks and traders to allay Merchant Discount Rate concerns SECTIONS Ministry of Finnace to engage with banks and traders to allay Merchant Discount Rate concerns ET Bureau Last Updated: Sep 24, 2026, 11:52:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis In an effort to shield consumers from additional Merchant Discount Rate (MDR) charges, the finance ministry is set to consult with the Indian Banks Association. Meetings with traders' organizations are also scheduled to directly address their concerns about the recent MDR levy. Effective from October 15, transactions exceeding \u20b92,000 will incur a 0.\n\nBuilding recycling plants is fine. Will they get enough scrap?\n\nBiogas found its ethanol moment this month. Can it now find scale?\n\nHas the US Fed and AI created a costlier world? And has the queue got longer for India?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers\n\nLogin using your ET Prime credentials to enjoy all member benefits\n\nLog out of your current logged-in account and log in again using your ET Prime credentials to enjoy all member benefits.", "source": "Economic Times Economy", "pub_date_str": "24 Sep 2026, 11:52 PM IST", "pub_date_relative": "50m ago", "cfa_topics": ["Quantitative Methods", "Ethical & Professional Standards"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "Bond yields surge to fresh two-decade highs but oil prices buffeted by Iran headlines - NBC News", "full_content": "Bond yields surge to fresh two-decade highs but oil prices buffeted by Iran headlines NBC News See more headlines & perspectives on Google News", "source": "Google News Business", "pub_date_str": "24 Sep 2026, 11:51 PM IST", "pub_date_relative": "51m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "FAFSA opens early: Why families should apply for college aid now", "full_content": "The U.S. Department of Education opened the Free Application for Federal Student Aid , or FAFSA, on Wednesday, ahead of its anticipated Oct. 1 launch. The earlier rollout of the key college aid form could give more students a head start on securing much-needed financial assistance, experts say.\n\nFiling the FAFSA is the gateway to all federal aid, including grants, work-study and student loans . Many states and schools also use data from the form, including income and asset records, to help determine college financial aid offers .\n\nThe earlier college-bound students and their families fill out the form, the better their chances are of receiving aid, experts say \u2014 largely because some financial aid is awarded on a first-come, first-served basis, or from programs with limited funds.\n\n\"The biggest advantage of the FAFSA opening early this year is how quickly students and families can get a sense of what aid they might qualify for,\" said Rick Castellano, a spokesperson for Sallie , a financial institution that offers college-planning resources and private student loans.\n\nA new version of the FAFSA form, which launched in late December 2023, has simplified the process, making it easier for families to complete an application and get an estimate of their federal aid eligibility, he said: \"Getting that picture early is especially important given changes to Pell Grant eligibility and federal borrowing.\"\n\nStarting this year, provisions in President Donald Trump 's \"big beautiful bill\" cap how much students and their families can borrow from the federal government to pay for college and graduate school. The law also includes new terms for Pell Grants , a need-based aid program for low-income students.\n\n\"The sooner families file, the more time they have to understand what they may qualify for, plan for what they'll need to cover, and take advantage of first-come, first-served aid,\" Castellano said.\n\nFor many families, financial aid is increasingly essential to paying the tab.", "source": "CNBC Top News", "pub_d     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
