fications that the company enjoys for various relevant materials, it is well-positioned to win more orders from overseas customers,\u201d noted Antique Stock Broking in its Q1 results review.\n\nGiven the backlog and underlying demand momentum, Jefferies India projects Solar Industries \u2019s defence revenue to grow at a 42% compound annual growth rate (CAGR) during FY26-30, leading to earnings per share (EPS) growth of 31% CAGR.", "source": "LiveMint Markets", "pub_date_str": "10 Sep 2026, 01:02 PM IST", "pub_date_relative": "6m ago"}, {"title": "European shares edge higher as traders await ECB decision", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Sep 2026, 01:00 PM IST", "pub_date_relative": "9m ago"}, {"title": "Is Zerodha down? Brokerage flags BSE F&O issue on Sensex expiry day", "full_content": "Zerodha on September 10 flagged an issue affecting price updates and order placement across brokers for some futures and options (F&O) contracts on the BSE.\n\n\u201cThere is an issue with price updates and order placement across brokers for some F&O contracts on BSE. We\u2019re in touch with the exchange to resolve this at the earliest,\u201d the brokerage said.\n\nThe issue comes on September 10, which is the weekly F&O expiry day for the Sensex, making timely price updates and order execution particularly important for traders active in index derivatives.\n\nPranati Deva is a seasoned financial journalist with over a decade of experience in high-pressure newsroom environments, currently working as a Senior Sub Editor at LiveMint. Over the years, she has developed a reputation for sharp editorial judgement, a strong grasp of market dynamics, and the ability to translate complex financial developments into clear, engaging stories for a wide audience. <br><br> Her core areas of coverage include stock markets, leading listed companies, currencies, and commodities, with a particular strength in fast-paced, real-time market reporting. She is known for handling breaking market news, earnings-driven stock movements, and macroeconomic developments with speed, accuracy, and context\u2014qualities that are essential in financial journalism. <br><br> Pranati has built a diverse and credible professional track record across some of India\u2019s most respected news organisations, including MintGenie, CNBC-TV18, Business Standard and EconomicTimes.com. During her stints at these platforms, she produced data-driven market stories, curated and steered live blogs during volatile trading sessions, and conducted interviews with market veterans, fund managers, economists, and industry experts. Her work often combines on-ground reporting with analytical depth, helping readers make sense of daily market fluctuations and longer-term trends.", "source": "LiveMint Markets", "pub_date_str": "10 Sep 2026, 12:59 PM IST", "pub_date_relative": "10m ago"}, {"title": "Why is Associated British Foods stock tumbling today?", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Sep 2026, 12:59 PM IST", "pub_date_relative": "10m ago"}, {"title": "With the copper price surfing all-time highs, here\u2019s what one CEO thinks about the sector long term", "full_content": "While there\u2019s a bear case to be made on copper if the AI trade blows up, if Trump eschews tariffs or if peace descends over the Persian Gulf, the long-term rationale for higher prices is solid, a listed copper producer executive says.", "source": "MarketWatch Top Stories", "pub_date_str": "10 Sep 2026, 12:59 PM IST", "pub_date_relative": "10m ago"}, {"title": "Huntington initiates Janus Living stock with outperform rating", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Sep 2026, 12:58 PM IST", "pub_date_relative": "10m ago"}, {"title": "JPMorgan initiates SK Hynix stock with overweight rating on AI demand", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Sep 2026, 12:58 PM IST", "pub_date_relative": "10m ago"}, {"title": "Foresight Solar delays interim results publication to Sept. 22", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Sep 2026, 12:52 PM IST", "pub_date_relative": "17m ago"}, {"title": "Penny stock under \u20b910 jumps 5% despite muted trends on Dalal Street", "full_content": "Penny stock below \u20b9 10 Elitecon International share price bucked the muted trend on Dalal Street on Thursday, September 10, gaining 5% from its previous close. The stock, however, remains under intense selling pressure across multiple timeframes.\n\nElitecon International shares opened at their 52-week low of \u20b9 7.09 in Thursday's session. The stock subsequently staged a sharp recovery, climbing more than 10% from that low to touch \u20b9 7.83. From its previous close, the penny stock was up 5%.\n\nThe recovery came even as India's benchmark indices struggled for direction in early trade. The Sensex and Nifty opened on a weak note as crude oil prices remained above the $100-per-barrel mark amid persistent geopolitical tensions, keeping investor risk appetite subdued.\n\nThe indices later recovered from their early weakness. The Sensex climbed 147 points, or 0.1%, to touch an intraday high of 74,910.96, while the broader Nifty 50 advanced around 63 points, or 0.26%, to reach an intraday high of 23,494.95.\n\nBrent crude, the global oil benchmark, traded 0.20% lower at $101 per barrel. Investors are also keeping an eye on upcoming US inflation data for fresh signals on the Federal Reserve's policy trajectory.\n\n\u201cWith Nifty dipping below the 23500 resistance, the market construct has turned weak. Technically the market is vulnerable to further correction, and the fundamental macro trends continue to deteriorate. Brent crude has spiked above $101 and the U.S. 10-year yield has moved up to 4.83%. Probability of a Fed rate hike this month has increased and this is also contributing to the concerns in the market.", "source": "LiveMint Markets", "pub_date_str": "10 Sep 2026, 12:49 PM IST", "pub_date_relative": "19m ago"}, {"title": "Aldermore Group reports 74% drop in statutory profit", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Sep 2026, 12:46 PM IST", "pub_date_relative": "23m ago"}, {"title": "FTSE 100 today: Stocks rise ahead of ECB rate decision", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Sep 2026, 12:45 PM IST", "pub_date_relative": "24m ago"}, {"title": "Currys reports 7% LFL sales growth, maintains full-year guidance; shares slip", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Sep 2026, 12:43 PM IST", "pub_date_relative": "26m ago"}, {"title": "Global Market: Samsung, SK Hynix payouts put South Korea\u2019s corporate reform to the test", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Global Market: Samsung, SK Hynix payouts put South Korea\u2019s corporate reform to the test Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market: Samsung, SK Hynix payouts put South Korea\u2019s corporate reform to the test SECTIONS Global Market: Samsung, SK Hynix payouts put South Korea\u2019s corporate reform to the test By Anupam Nagar , ETMarkets.com Last Updated: Sep 10, 2026, 12:33:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Samsung Electronics and SK Hynix\u2019s massive shareholder-return plans are putting South Korea\u2019s efforts to narrow the \u201cKorea discount\u201d While investors welcome payouts worth over 130 trillion won, concerns remain over corporate governance, capital allocation and minority shareholder rights, with the KOSPI still trading at a steep valuation discount to regional peers.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "10 Sep 2026, 12:33 PM IST", "pub_date_relative": "35m ago"}, {"title": "PVR Inox buyback worth \u20b9300 crore opens today: How much can shareholders earn? Check participation details and more", "full_content": "PVR Inox's \u20b9 300 crore share buyback opens for subscription on Thursday, September 10, giving eligible shareholders an opportunity to tender their shares at \u20b9 1,450 apiece. The buyback, being conducted through the tender offer route, involves the repurchase of nearly 21 lakh equity shares.\n\nThe offer will remain open until September 17, while the record date was September 4.\n\nThis is crucial for investors looking to participate: only shareholders who held PVR Inox shares on the record date are eligible for the buyback. Therefore, buying the stock today will not make a new investor eligible for the offer.\n\nThe buyback price of \u20b9 1,450 is around 24% higher than the stock's last closing price of \u20b9 1,171.35 on 9 September.\n\nIn today's deals, the multiplex stock jumped 3.2% to its day's high of \u20b9 1,210.00 per share on BSE.\n\nPVR Inox has divided shareholders into reserved and general categories for the buyback . Small shareholders are entitled to tender 9 equity shares for every 157 shares held as on the record date, September 4, 2026. For shareholders in the general category, the entitlement has been set at 21 shares for every 1,108 shares held on the record date.\n\nA share buyback is a corporate action in which a company purchases its own shares from existing shareholders. Companies generally offer to buy shares at a price higher than the prevailing market price, which can encourage eligible investors to tender their holdings.\n\nPVR Inox has also disclosed that its promoters and promoter group have indicated their intention to participate in the buyback. They can tender a maximum of 5.69 lakh shares.", "source": "LiveMint Markets", "pub_date_str": "10 Sep 2026, 12:26 PM IST", "pub_date_relative": "42m ago"}, {"title": "Dilip Buildcon share price rallies 10% after winning \u20b91,800 crore order. Do you own?", "full_content": "Dilip Buildcon share price rallied as much as 10% on NSE in Thursday's trading session after the company bagged a new order worth \u20b9 1,800 crore from Petroleum and Natural Gas Regulatory Board.\n\nDilip Buildcon shares opened at \u20b9 429 apiece today, as compared to previous close of \u20b9 393 on Wednesday. The stock touched an intraday high of \u20b9 439.70 on 10 September.\n\nThe stock has remained under pressure amid weak market sentiment, declining 6% over the past month and 12% year-to-date (YTD). Over the longer term, the stock has gained 25% over the past three years but has declined 19% over a five-year period.\n\nIn an exchange filing on 9 September, Dilip Buildcon said that it has received a Letter of Intent (LoI) authorising it to lay, build, operate or expand an LPG pipeline connecting Paradip in Odisha with Raipur in Chhattisgarh.\n\nAccording to the filing, the project is worth around \u20b9 1,800 crore.\n\n\u201cThe Project entails the grant of an exclusive license by PNGRB to act as the authorized entity for the development of \u201cpipeline\u201d infrastructure for the transportation of LPG, including financing, construction, and operation of the same, and to levy and collect tariff for the transportation of LPG up to the designated delivery point for operation period of 25 years after construction period of 3 years,\u201d Dilip Buildcon said in a regulatory filing.\n\nThe project will be executed through a Special Purpose Vehicle (SPV), with Dilip Buildcon holding 100% equity in the entity. The project is expected to be completed within a period of 36 months.\n\nAs part of the project, Dilip Buildcon will be responsible for the design, financing, development, construction, operation and maintenance of the proposed LPG pipeline infrastructure, subject to the necessary approvals, authorisations and regulatory clearances from the Petroleum and Natural Gas Regulatory Board (PNGRB).", "source": "LiveMint Markets", "pub_date_str": "10 Sep 2026, 12:23 PM IST", "pub_date_relative": "45m ago"}, {"title": "BRICS 2026: From bigger to better? The New Delhi summit may put trade, tech and energy in focus", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a BRICS 2026: From bigger to better? The New Delhi summit may put trade, tech and energy in focus The Economic Times daily newspaper is available online now. Read Today's Paper BRICS 2026: From bigger to better? The New Delhi summit may put trade, tech and energy in focus SECTIONS BRICS 2026: From bigger to better? The New Delhi summit may put trade, tech and energy in focus ET Online Last Updated: Sep 10, 2026, 12:24:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis BRICS 2026 will test whether the expanded 11-member grouping can translate its growing economic and geopolitical weight into practical cooperation. With trade, payments, startups, AI, energy, critical minerals and climate finance on the agenda, India\u2019s presi  ( IPO ), reported total income of \u20b9 411.48 crore in the first quarter of the current fiscal, compared with \u20b9 100.47 crore in Q1 FY26.\n\nTruenat test-kit volumes rose sharply to 62.4 lakh units in Q1 FY27 from 7.9 lakh units in the corresponding quarter last year, supporting the company\u2019s revenue growth.\n\nAccording to the company\u2019s website, Truenat is designed to detect a wide range of infectious diseases with accuracy and speed at the point of care.\n\n\u201cFY27 is a milestone year for Molbio, marking our transition to a listed company. We have begun the year on a strong note, with healthy growth across both revenue and profitability in Q1,\u201d Sriram Natarajan, Executive Director and Chief Executive Officer, Molbio Diagnostics Ltd, said.\n\nShares of Molbio Diagnostics Ltd made a strong debut on the stock exchanges on Monday, listing at a premium of more than 21% over the IPO issue price of \u20b9 807 per share.", "source": "LiveMint Markets", "pub_date_str": "10 Sep 2026, 12:20 PM IST", "pub_date_relative": "48m ago"}, {"title": "Molbio Diagnostics shares rally 30% in 2 days, jump 80% since debut. What lies ahead?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Molbio Diagnostics shares rally 30% in 2 days, jump 80% since debut. What lies ahead? Molbio Diagnostics Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Molbio Diagnostics shares rally 30% in 2 days, jump 80% since debut. What lies ahead? SECTIONS Molbio Diagnostics shares rally 30% in 2 days, jump 80% since debut. What lies ahead? By Debaroti Adhikary , ETMarkets.com Last Updated: Sep 10, 2026, 12:19:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Molbio Diagnostics shares have surged nearly 30% in two sessions, extending \nTSMC has maintained its dominance in the global foundry market, with a 72.5% market share in the second quarter, according to a data released by TrendForce Wednesday. Strong demand for AI server processors kept TSMC's advanced 5-, 4- and 3-nanometer capacity fully booked during the quarter, the research firm said.\n\nSamsung Foundry ranked second with a 5.9% share, followed by China's SMIC at 5.4%.", "source": "CNBC World Economy", "pub_date_str": "10 Sep 2026, 12:15 PM IST", "pub_date_relative": "53m ago"}], "cfa": [{"title": "Euro zone yields hold near multi-year peaks as ECB rate decision looms", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Sep 2026, 01:02 PM IST", "pub_date_relative": "6m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Solar Industries: Defence exposure powers growth, but valuation may be running ahead of earnings", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nSolar Industries India Ltd has delivered a whopping return of over 80% in 2026 so far, as the industrial explosives manufacturer\u2019s rapidly expanding defence business drives strong earnings growth. With continued investment in domestic defence modernization and higher global military spending, the defence segment is expected to become increasingly significant to Solar Industries.\n\nThe company\u2019s defence order book, including international and domestic orders, stood at \u20b9 18,000 crore as of the June quarter-end (Q1FY27), or nearly six times the segment\u2019s trailing 12-month revenue. Strong defence order inflows have helped the total order book reach \u20b9 21,350 crore, up more than four times from the \u20b9 5,100 crore at FY24-end.\n\nAmong the large orders is the Pinaka rocket launcher system and its ammunition, worth \u20b9 6,100 crore, from the Indian Army , as well as another order from Armenia. The company started deliveries for both orders in Q4FY26, and a follow-on order from the Indian Army is being negotiated.\n\nBhargavastra, the guided micro-missile-based counter-drone system, is in the final stage of development, with trials expected to be completed in 2026. Solar hopes to receive orders for the system from FY28.\n\nDefence exports are also gaining traction amid heightened geopolitical tensions and record-high military spending.\n\n\u201cThe demand situation for ammunition and high-energy materials in the global market remains very favourable, and given the number of qualifications/certifications that the company enjoys for various relevant materials, it is well-positioned to win more orders from overseas customers,\u201d noted Antique Stock Broking in its Q1 results review.\n\nGiven the backlog and underlying demand momentum, Jefferies India projects Solar Industries \u2019s defence revenue to grow at a 42% compound annual growth rate (CAGR) during FY26-30, leading to earnings per share (EPS) growth of 31% CAGR.", "source": "LiveMint Markets", "pub_date_str": "10 Sep 2026, 01:02 PM IST", "pub_date_relative": "6m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Is Zerodha down? Brokerage flags BSE F&O issue on Sensex expiry day", "full_content": "Zerodha on September 10 flagged an issue affecting price updates and order placement across brokers for some futures and options (F&O) contracts on the BSE.\n\n\u201cThere is an issue with price updates and order placement across brokers for some F&O contracts on BSE. We\u2019re in touch with the exchange to resolve this at the earliest,\u201d the brokerage said.\n\nThe issue comes on September 10, which is the weekly F&O expiry day for the Sensex, making timely price updates and order execution particularly important for traders active in index derivatives.\n\nPranati Deva is a seasoned financial journalist with over a decade of experience in high-pressure newsroom environments, currently working as a Senior Sub Editor at LiveMint. Over the years, she has developed a reputation for sharp editorial judgement, a strong grasp of market dynamics, and the ability to translate complex financial developments into clear, engaging stories for a wide audience. <br><br> Her core areas of coverage include stock markets, leading listed companies, currencies, and commodities, with a particular strength in fast-paced, real-time market reporting. She is known for handling breaking market news, earnings-driven stock movements, and macroeconomic developments with speed, accuracy, and context\u2014qualities that are essential in financial journalism. <br><br> Pranati has built a diverse and credible professional track record across some of India\u2019s most respected news organisations, including MintGenie, CNBC-TV18, Business Standard and EconomicTimes.com. During her stints at these platforms, she produced data-driven market stories, curated and steered live blogs during volatile trading sessions, and conducted interviews with market veterans, fund managers, economists, and industry experts. Her work often combines on-ground reporting with analytical depth, helping readers make sense of daily market fluctuations and longer-term trends.", "source": "LiveMint Markets", "pub_date_str": "10 Sep 2026, 12:59 PM IST", "pub_date_relative": "10m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Penny stock under \u20b910 jumps 5% despite muted trends on Dalal Street", "full_content": "Penny stock below \u20b9 10 Elitecon International share price bucked the muted trend on Dalal Street on Thursday, September 10, gaining 5% from its previous close. The stock, however, remains under intense selling pressure across multiple timeframes.\n\nElitecon International shares opened at their 52-week low of \u20b9 7.09 in Thursday's session. The stock subsequently staged a sharp recovery, climbing more than 10% from that low to touch \u20b9 7.83. From its previous close, the penny stock was up 5%.\n\nThe recovery came even as India's benchmark indices struggled for direction in early trade. The Sensex and Nifty opened on a weak note as crude oil prices remained above the $100-per-barrel mark amid persistent geopolitical tensions, keeping investor risk appetite subdued.\n\nThe indices later recovered from their early weakness. The Sensex climbed 147 points, or 0.1%, to touch an intraday high of 74,910.96, while the broader Nifty 50 advanced around 63 points, or 0.26%, to reach an intraday high of 23,494.95.\n\nBrent crude, the global oil benchmark, traded 0.20% lower at $101 per barrel. Investors are also keeping an eye on upcoming US inflation data for fresh signals on the Federal Reserve's policy trajectory.\n\n\u201cWith Nifty dipping below the 23500 resistance, the market construct has turned weak. Technically the market is vulnerable to further correction, and the fundamental macro trends continue to deteriorate. Brent crude has spiked above $101 and the U.S. 10-year yield has moved up to 4.83%. Probability of a Fed rate hike this month has increased and this is also contributing to the concerns in the market.", "source": "LiveMint Markets", "pub_date_str": "10 Sep 2026, 12:49 PM IST", "pub_date_relative": "19m ago", "cfa_topics": ["Quantitative Methods", "Economics", "Equity Investments", "Fixed Income", "Alternative Investments", "Portfolio Management"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "Aldermore Group reports 74% drop in statutory profit", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Sep 2026, 12:46 PM IST", "pub_date_relative": "23m ago ancial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "10 Sep 2026, 12:33 PM IST", "pub_date_relative": "35m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "PVR Inox buyback worth \u20b9300 crore opens today: How much can shareholders earn? Check participation details and more", "full_content": "PVR Inox's \u20b9 300 crore share buyback opens for subscription on Thursday, September 10, giving eligible shareholders an opportunity to tender their shares at \u20b9 1,450 apiece. The buyback, being conducted through the tender offer route, involves the repurchase of nearly 21 lakh equity shares.\n\nThe offer will remain open until September 17, while the record date was September 4.\n\nThis is crucial for investors looking to participate: only shareholders who held PVR Inox shares on the record date are eligible for the buyback. Therefore, buying the stock today will not make a new investor eligible for the offer.\n\nThe buyback price of \u20b9 1,450 is around 24% higher than the stock's last closing price of \u20b9 1,171.35 on 9 September.\n\nIn today's deals, the multiplex stock jumped 3.2% to its day's high of \u20b9 1,210.00 per share on BSE.\n\nPVR Inox has divided shareholders into reserved and general categories for the buyback . Small shareholders are entitled to tender 9 equity shares for every 157 shares held as on the re opic by weight."}, {"title": "World\u2019s largest contract chipmaker TSMC sees August revenue surge over 53% to record high", "full_content": "Taiwan Semiconductor Manufacturing Co. reported record monthly revenue for August on Thursday, as demand for chips used in artificial intelligence applications remained strong.\n\nThe world's largest contract chipmaker posted revenue of $514.8 billion New Taiwan dollars ($16.35 billion) for last month, up 53.3% from a year earlier and 10.1% from July.\n\nTSMC shares closed 0.61% lower on Thursday ahead of the revenue release.\n\nThe company's monthly revenue has now risen for four straight months.\n\nDuring its second-quarter earnings call in July, TSMC said AI-related demand continued to be \"extremely robust.\"\n\nThe Taiwanese tech giant reported a more than 77% year-on-year jump in second-quarter profit and forecast third-quarter revenue between $44.6 billion and $45.8 billion.\n\nTSMC has maintained its dominance in the global foundry market, with a 72.5% market share in the second quarter, according to a data released by TrendForce Wednesday. Strong demand for AI server processors kept TSMC's advanced 5-, 4- and 3-nanometer capacity fully booked during the quarter, the research firm said.\n\nSamsung Foundry ranked second with a 5.9% share, followed by China's SMIC at 5.4%.", "source": "CNBC World Economy", "pub_date_str": "10 Sep 2026, 12:15 PM IST", "pub_date_relative": "53m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Govt asks sugar mills to ensure adequate supplies during festivals, keep prices 'reasonable'", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Agriculture \u203a Govt asks sugar mills to ensure adequate supplies during festivals, keep prices 'reasonable' The Economic Times daily newspaper is available online now. Read Today's Paper Govt asks sugar mills to ensure adequate supplies during festivals, keep prices 'reasonable' SECTIONS Govt asks sugar mills to ensure adequate supplies during festivals, keep prices 'reasonable' Reuters Last Updated: Sep 10, 2026, 12:15:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Indian sugar mills are asked to ensure adequate supplies for the upcoming festival season. Domestic mills are seeking to import nearly 800,000 tons of duty-free raw sugar. The government directed mills to sell sugar at reasonable prices. Officials will continue monitoring prices and take corrective measures. This aims to keep sugar rates stable for consumers.\n\nBigger or Better: One order from Power Grid Corp added $1 billion to the market cap of a company \u2013 Final part\n\nBanks have received a flood of money. Now comes the real test\n\nSeason of change in accounting policy: A simple AI prompt can tell you a lot\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers\n\nLogin using your ET Prime credentials to enjoy all member benefits\n\nLog out of your current logged-in account and log in again using your ET Prime credentials to enjoy all member benefits.", "source": "Economic Times Economy", "pub_date_str": "10 Sep 2026, 12:15 PM IST", "pub_date_relative": "54m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Kothari Industrial share price zooms 11%! Stock down 74% in one year | What\u2019s fuelling the rally?", "full_content": "Shares of Kothari Industrial Corporation Limited rallied nearly 13% during Thursday\u2019s intraday trading session. The recent surge in the stock came as the overall market sentiment remained muted on September 10. Multiple order wins, strong income growth, and logistics acquisition are some of the key factors supporting the Chennai-based firm\u2019s outlook.\n\nThe 13% rally in Kothari Industrial Corporation has come after the stock has declined close to 26% since the beginning of this year, and around 73% in one year.\n\nBullish momentum behind Kothari Industrial Corporation stock came as multiple developments linked to the company fuelled investors sentiment. \u201cKothari Industrial Corporation shares extended gains on Thursday, trading near \u20b9 151, as a steady stream of government order wins lifted sentiment,\u201d stated Khushi Mistry Research Analyst at Bonanza, while highlighting that the recent order wins had taken the company\u2019s disclosed order book past \u20b9 35 crore.\n\nThe recent rally in the company scrip sits against a widened \u20b9 31-crore net loss and auditor qualifications on unverified balances, keeping risk-reward finely balanced, warned Mistry.\n\n\u201cKothari Industrial Corp. has shown a strong reversal from \u20b9 130\u2013135 support with a sharp volume- backed breakout above short-term EMAs. RSI has improved above 55, confirming momentum. Fresh entry can be considered near \u20b9 150\u2013153, with SL \u20b9 140 and targets \u20b9 170\u2013180, while \u20b9 160 acts as immediate resistance,\u201d stated Virat Jagad Sr. Technical Research Analyst at Bonanza.\n\nThe stock was trading 13% higher at \u20b9 151.25 per share on BSE with a market capitalisation of \u20b9 1,633.83 crore at 11:55 am on Thursday. The company scrip had touched an intraday high of \u20b9 159.90 per share and an intraday low of \u20b9 138.25 per share. Its return on equity (ROE) stood at -63.24%.", "source": "LiveMint Markets", "pub_date_str": "10 Sep 2026, 12:13 PM IST", "pub_date_relative": "56m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Global Market: South Korean stocks fall over 1% as Middle East tensions weigh on risk sentiment", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Global Market: South Korean stocks fall over 1% as Middle East tensions weigh on risk sentiment Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market: South Korean stocks fall over 1% as Middle East tensions weigh on risk sentiment SECTIONS Global Market: South Korean stocks fall over 1% as Middle East tensions weigh on risk sentiment By Anupam Nagar , ETMarkets.com Last Updated: Sep 10, 2026, 12:08:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis South Korean shares fell over 1% on Thursday as escalating Middle East tensions and attacks near the Strait of Hormuz weighed on investor sentiment. The KOSPI declined 1.37%, with major technology and heavyweight stocks including Samsung Electronics, SK Hynix and Samsung BioLogics falling, while foreign investors remained net sellers.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "10 Sep 2026, 12:08 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Investing in FDs or small savings schemes? 5 factors investors should compare beyond interest rates", "full_content": "Investing in fixed deposits (FDs) or small savings schemes? The interest rate may be the first thing you check, but it should not be the only factor guiding your decision. While a higher rate can definitely mean better returns, the right investment also depends on how much you can invest, when you need the money and how you want to receive the returns later on.\n\nBefore choosing between a bank FD and a small savings scheme, investors should also compare investment limits, liquidity, tenure, interest payout options, taxation and maturity rules.\n\nThese factors can affect both the suitability of an investment and the actual returns earned. Understanding these differences can help investors choose an option that better matches their financial goals and cash-flow needs.\n\nThe first area of focus is the interest rates. For the July-September 2026 quarter, as in the previous one, the government has kept interest rates on small savings schemes unchanged. Currently, the Senior Citizen Savings Scheme (SCSS) and Sukanya Samriddhi Yojana (SSY) offer the highest rate among the major schemes at 8.2%, while Public Provident Fund (PPF) offers 7.1%.\n\nFor prominent banks, FD interest rates vary significantly by tenure, amount and bank category. Among large private-sector banks, Axis Bank and ICICI Bank offer up to 6.50%, while HDFC Bank offers up to 6.45% across the listed tenures.\n\nIn the public-sector segment, Bank of India offers up to 6.85%, while Bank of Baroda offers up to 6.75%. These rates are generally lower than the highest rates offered by several small finance banks , which exceed 8%, according to data compiled by Paisabazaar.\n\nHere is a look at the interest rates and key features offered by prominent small savings schemes today.\n\nSmall savings schemes and fixed deposits serve distinct purposes; hence, they have different eligibility criteria and are designed for specific investors.", "source": "LiveMint Money", "pub_date_str": "10 Sep 2026, 12:03 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Fixed Income", "Derivatives", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Share India Securities jumps 12% to 52-week high, up 24% in just 2 sessions- What is driving the stock price?", "full_content": "Share India Securities' share price continued to witness strong buying interest for the second consecutive session, with the stock jumping 12% to hit its 52-week high amid a spurt in volume. Share India shares opened at \u20b9 190.05 against their previous close of \u20b9 189.75 and jumped 11.7% to a 52-week high of \u20b9 212, with volume surging more than 19.47 times. In the previous session, the stock jumped 11%. Thus, in just two consecutive sessions, the stock's overall gains stand at more than 24%.\n\nThe stock witnessed a sharp jump after it said on 8 September that the National Company Law Tribunal (NCLT), Ahmedabad Bench - I, on 7 September, approved the scheme of amalgamation of Silverleaf Capital Services Private Limited with Share India Securities Limited.\n\nIn a separate exchange filing on 9 September, the company said it had issued a notice of early redemption to the holders of 5,000 non-convertible debentures (NCDs) of a face value of \u20b9 37,500 each, aggregating to \u20b9 18.75 crore and 4,990 NCDs having a face value of \u20b9 1,00,000 each, aggregating to \u20b9 49.90 crore. The scheduled maturity date of these NCDs was 10 June 2027, while the early redemption date is 30 September 2026.\n\nThe company said a meeting of the NCD holders was convened and held on 1 September, at which the requisite consent of the NCD holders was obtained for the early redemption of the NCDs prior to their scheduled maturity date.\n\nShare India Securities ' profit after tax (PAT) declined 1.1% year-on-year (YoY) to \u20b9 324 crore in FY26, while PAT margin declined 58 basis points YoY to 22.07%. Total income, however, increased 1.47% YoY to \u20b9 1,470 crore, EBITDA jumped 12.58% YoY to \u20b9 605 crore, while EBITDA margin increased by 406 basis points YoY to 41.18% in FY26, according to the company's annual report.\n\nThe stock has jumped 60% in the last three months. It hit a 52-week low of \u20b9 115.25 on 30 March.", "source": "LiveMint Markets", "pub_date_str": "10 Sep 2026, 11:57 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Fixed Income"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "US Treasury yields hit highest level since 2023 as buyback disappoints", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a US Treasury yields hit highest level since 2023 as buyback disappoints Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US Treasury yields hit highest level since 2023 as buyback disappoints SECTIONS US Treasury yields hit highest level since 2023 as buyback disappoints By Anupam Nagar , ETMarkets.com Last Updated: Sep 10, 2026, 11:55:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis U.S. 10-year Treasury yields touched their highest level since November 2023 before easing after strong auction demand. Rising oil prices and shifting Federal Reserve rate-hike expectations added to concerns over inflation and the interest-rate outlook.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "10 Sep 2026, 11:55 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Corporate Issuers", "Equity Investments", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "'Saved the day': How China helped keep the lid on oil price surge as Iran war disrupted supplies", "full_content": "China's years of stockpiling of crude and subsequent pullback on oil purchases since the Middle East war erupted in late February helped the world avoid a far deeper energy crisis. But that buffer may face a test as Beijing shows signs of resuming purchases, according to economists.\n\n\"China kind of saved the day,\" and helped the world avoid the \"doomsday scenario\" when the Strait of Hormuz closure choked off 20% of global energy supply, Paul Gruenwald, global chief economist at S&P Global Ratings, said at a conference in Singapore on Thursday.\n\nThe world's largest oil buyer has slashed its imports after the war broke out, tapping into its stockpiles, keeping a lid on global oil prices and safeguarding its economy.\n\nThe U.S. Energy Information Administration estimates China holds 1.4 billion barrels of strategic crude oil inventories, compared with 825 million barrels in the U.S., as of December 2025, including commercial inventories. Its crude imports dropped below 8 million barrels a day in May and June, falling for the first time since 2016, according to the EIA.\n\nSoon after the conflict broke out, oil analysts had forecast prices surging to $150 to $200 a barrel on the back of the abrupt supply disruption. \"Not only did we get the magnitude wrong, sometimes we got the direction wrong,\" Gruenwald said.\n\nBrent crude prices had eased to around $80 a barrel before shooting up again in recent days and crossing $100 a barrel on Wednesday amid renewed hostilities between Iran and the U.S. in the Gulf. But that handle is still \"digestible\" for the global economy, he said.\n\nThat buffer though isn't without limits, as signs are emerging that China's crude imports may be gradually recovering.\n\nChina's crude imports rebounded 22% and 6.2% month on month in July and August, respectively, though still significantly below last year's level, according to official trade data.", "source": "CNBC Top News", "pub_date_str": "10 Sep 2026, 11:53 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}], "updated_at": "10 Sep 2026, 01:09 PM IST", "total_stories": 370};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
