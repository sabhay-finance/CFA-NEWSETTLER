<script>

    const allData = {"general": [{"title": "The \u2018CIA\u2019 strategy beating the market: How one top-performing money manager spots mispriced stocks", "full_content": "Sebastien Mallet is on the verge of his best one-year performance ever as portfolio manager of T. Rowe Price Global Value Equity Fund. Here\u2019s what he\u2019s buying.", "source": "MarketWatch Top Stories", "pub_date_str": "16 Sep 2026, 07:03 PM IST", "pub_date_relative": "3m ago"}, {"title": "Oil prices fall after U.S. says damaged Saudi pipeline will restart operations in days", "full_content": "Crude oil prices fell Wednesday as the Trump administration tried to reassure the market that Saudi Arabia's damaged East-West pipeline will restart operations in days.\n\nU.S. West Texas Intermediate futures were down 1.6% to $104.09 per barrel by 8:57 a.m. ET. Brent crude, the international benchmark, traded 1.1% lower to $107.57 per barrel. Prices have rallied around 20% this month as fighting has sharply escalated in the Persian Gulf.\n\nEnergy Secretary Chris Wright told CNBC on Tuesday that the pipeline outage is a \"brief and temporary interruption\" that \"will be measured in days.\"\n\nThe Saudis have taken \"quick action\" to export more oil through the Strait of Hormuz with U.S. military help while the pipeline is down, Wright said.\n\nBut independent analysts warned the pipeline could remain down for weeks based on satellite images showing significant damage to a pumping station.\n\nRiyadh closed the pipeline late last week after it sustained damage in drone attacks launched from Iraq. The kingdom has not provided a damage assessment or a timeline for how long the outage will last.\n\nThe pipeline has allowed the Saudis to shift oil exports to the Red Sea while the U.S. and Iran battle for control over Hormuz. The strait was the Gulf states' main export corridor before the war.\n\nThe U.S. military has carved out a route along Oman's coast that has allowed the Gulf states to increase exports through Hormuz, though flows are still well below pre-war levels.", "source": "CNBC Top News", "pub_date_str": "16 Sep 2026, 07:01 PM IST", "pub_date_relative": "4m ago"}, {"title": "What history says about longer-term bond yields after an initial Fed hike", "full_content": "If the Federal Reserve hikes interest rates in an effort to slow down the rapid rise in longer-term yields, history shows it probably won\u2019t be a success.", "source": "MarketWatch Top Stories", "pub_date_str": "16 Sep 2026, 07:00 PM IST", "pub_date_relative": "6m ago"}, {"title": "Retail sales surged toward the end of summer. The U.S. economy has plenty of momentum.", "full_content": "Sales at U.S. retailers surged in August and posted the biggest increase in five months, offering another piece of evidence suggesting the economy sped up toward the end of summer.", "source": "MarketWatch Top Stories", "pub_date_str": "16 Sep 2026, 06:52 PM IST", "pub_date_relative": "14m ago"}, {"title": "The Federal Reserve is expected to hike rates for the first time in three years: Live updates", "full_content": "While it may have taken a while, Wall Street finally has warmed to the idea that the Federal Reserve likely will raise its benchmark interest rate as it seeks to slay a maddeningly persistent inflation problem.\n\nTraders have assigned a better than 90% probability that the central bank's Federal Open Market Committee will vote to raise the overnight funds rate a quarter percentage point, putting the target range at 3.75%-4%, according to the CME Group's FedWatch gauge of futures prices.\n\nA month ago, the odds were just 36%, as the market expected soft inflation readings and Chairman Kevin Warsh 's reluctance to commit the Fed to a hawkish policy path to keep the appetite in check for tighter monetary policy.\n\nHowever, Warsh's remarks during the Fed's annual symposium in Jackson Hole, Wyoming, started to turn the tide. Another raft of discouraging inflation data along with a firming labor market helped seal the deal. A resurgence in crude oil prices back above $100 a barrel because of the Iran conflict adds to pressures on the central bank to act.\n\nMorgan Stanley economists reflected the broader Street sentiment. In a note Monday, the firm said it had switched its forecast from no hikes this year to two, based in part on Warsh's public statements as well as the leg higher in oil prices , inflationary expansion in artificial intelligence and a broader shift toward expectations for hikes. The firm expects one this week, followed by another in December.\n\n\"Not doing so would risk loss of credibility and a potential rise in longer-term risk premia similar to the reaction after the July FOMC meeting,\" wrote Michael Gapen, chief U.S. economist for Morgan Stanley.\n\nIf approved, the hike would be the first since July 2023 . Since then, the FOMC has lowered rates six times for a total of 175 basis points, or 1.75 percentage points.\n\nInvestors also will be watching a slew of other indicators Wednesday, as the committee updates its Summary of Economic Projections.", "source": "CNBC Top News", "pub_date_str": "16 Sep 2026, 06:50 PM IST", "pub_date_relative": "15m ago"}, {"title": "Finance Ministry rejects foreign influence claims over UPI MDR, says India's digital payments decisions are made independently", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a Finance Ministry rejects foreign influence claims over UPI MDR, says India's digital payments decisions are made independently The Economic Times daily newspaper is available online now. Read Today's Paper Finance Ministry rejects foreign influence claims over UPI MDR, says India's digital payments decisions are made independently SECTIONS Finance Ministry rejects foreign influence claims over UPI MDR, says India's digital payments decisions are made independently ET Online Last Updated: Sep 16, 2026, 06:48:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India's finance ministry rejected claims of foreign pressure influencing UPI transaction charges. A 0.4% Merchant Discount Rate will apply to UPI payments over Rs 2,000. This charge will not affect consumers and most small merchants remain exempt. The revenue will support payment ecosystem participants and infrastructure development. UPI policy decisions are made independently for an affordable digital payments ecosystem.\n\nA different kind of buyback. Is this the beginning of these kinds of buybacks?\n\nCome January 2027, will India\u2019s online platforms get their own Tukaram?\n\nFour rules made HDFC Bank a compounder. All four have stopped. Can the new CEO rewrite them?\n\nGold rush on Dalal St as regional jewellers bid to be the next Tanishq\n\nHormuz is a state, not a strait. There are 10 other possible chokepoints for the global economy, including India\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers", "source": "Economic Times Economy", "pub_date_str": "16 Sep 2026, 06:48 PM IST", "pub_date_relative": "17m ago"}, {"title": "J.B. Hunt stock plunges 10% after company warns third-quarter earnings will fall", "full_content": "Shares of J.B. Hunt plunged more than 10% on Wednesday after the trucking company said it expects its earnings to drop in the third quarter.\n\n\"We kind of want to be transparent with investors and give an update that in light of these costs that are sort of hitting us, we are expecting our Q2 to Q3 earnings to actually drop 5% to 10%,\" CFO Brad Delco said at the Morgan Stanley Industrials conference.\n\nDelco said between costs for recruiting, advertising, onboarding, training and sign-on bonuses, the company expects to see about $25 million more in the third quarter compared with the second quarter. He said that means J.B. Hunt is \"preparing for growth.\"\n\nStill, he added the company has also seen \"some of the most radical and abnormal swings\" in fuel prices that it has ever seen and record-high diesel prices, which are causing at least a $10 million headwind.\n\nDelco added that he expects volumes to improve sequentially to offset the incremental pressures.\n\n\"It really is more of a timing issue,\" he said. \"I think you can look at a glass half-empty or a glass half-full. I'm really glad that we have visibility to these costs right now.\"\n\nDelco also said J.B. Hunt is working on repairing its margins, though he believes the company still has a long way to go.", "source": "CNBC Top News", "pub_date_str": "16 Sep 2026, 06:47 PM IST", "pub_date_relative": "19m ago"}, {"title": "JPMorgan reiterates Forgent Power Solutions stock rating on strong quarter", "full_content": "", "source": "Investing.com News", "pub_date_str": "16 Sep 2026, 06:46 PM IST", "pub_date_relative": "19m ago"}, {"title": "Piper Sandler reiterates Coca-Cola stock rating on strong execution", "full_content": "", "source": "Investing.com News", "pub_date_str": "16 Sep 2026, 06:46 PM IST", "pub_date_relative": "19m ago"}, {"title": "RBC Capital reiterates Corteva stock rating on seed spinoff outlook", "full_content": "", "source": "Investing.com News", "pub_date_str": "16 Sep 2026, 06:46 PM IST", "pub_date_relative": "19m ago"}, {"title": "Piper Sandler reiterates Inventiva stock rating on trial confidence", "full_content": "", "source": "Investing.com News", "pub_date_str": "16 Sep 2026, 06:46 PM IST", "pub_date_relative": "19m ago"}, {"title": "Truist maintains Buy on James Hardie stock, cites cost synergies", "full_content": "", "source": "Investing.com News", "pub_date_str": "16 Sep 2026, 06:46 PM IST", "pub_date_relative": "19m ago"}, {"title": "JPMorgan reiterates Mirion Technologies stock rating on 2H26 outlook", "full_content": "", "source": "Investing.com News", "pub_date_str": "16 Sep 2026, 06:46 PM IST", "pub_date_relative": "19m ago"}, {"title": "Tropical Smoothie Cafe is getting a makeover as it prepares for its 'next 3,000' locations", "full_content": "Tropical Smoothie Cafe on Wednesday unveiled a new look as the restaurant chain prepares to continue its streak of rapid growth under Blackstone's ownership .\n\n\"We are a company and a brand that has evolved significantly over the last few years and really over the last 10 years,\" CEO Max Wetzel told CNBC. \"We're thinking about what our next 3,000 cafes look like, and so it's a perfect time for us to roll this out.\"\n\nThe redesign comes as Tropical Smoothie prepares to introduce itself to more consumers, both in the U.S. and internationally. The chain, which also sells bowls and wraps, surpassed $1.6 billion in system sales over the 12 months ended in June. By the end of the year, it is projecting it will exceed 1,800 locations nationwide, up 50% since the end of 2022. Tropical Smoothie has plans to expand outside of the U.S., too.\n\nBut its bold plans come during a tricky time for the restaurant industry. Diners have been eating out less frequently, trying to save money while paying more for gas, groceries and other necessities. As a result, eateries have been battling for a smaller pool of customers and often leaning on discounts to win them over.\n\nTropical Smoothie last tinkered with its logo a decade ago. The new design, which will be found everywhere from packaging for its wraps to its mobile app interface, uses brighter colors and a uniform font, in part to try to set it apart from quick-service competitors.\n\n\"The color palette is entirely created by the ingredients that you can find in our cafe,\" Wetzel said. \"All these ingredients are very different than a category that's really dominated by browns and beiges and fried food.\"\n\nIt also introduces the \"Palm T,\" a frond-shaped icon that will represent the brand in \"shorthand,\" particularly on digital platforms, according to Wetzel.\n\nTropical Smoothie has been working on the new branding for more than a year. But it is just one step toward what Wetzel called his ultimate goal: \"building a best-in-class company.\"", "source": "CNBC Top News", "pub_date_str": "16 Sep 2026, 06:46 PM IST", "pub_date_relative": "19m ago"}, {"title": "OpenAI investors have approached the company about a new funding round", "full_content": "OpenAI investors have approached the company with proposals to kickstart a new funding round, but no formal discussions are underway, multiple sources told CNBC.\n\nInvestors have floated a $1.2 trillion valuation to OpenAI, and some have positioned the potential new funding round as a way for employees to sell stock, according to the people, who asked not to be named in order to discuss nonpublic information.\n\nOpenAI, which raised $122 billion at a $852 billion valuation in March, is not currently engaged in conversations, the people said.\n\nOpenAI declined to comment. The Financial Times was first to report the potential round.\n\nOpenAI burst onto the mainstream in 2022 following the launch of its artificial intelligence chatbot ChatGPT , and it's ballooned into one of the most valuable private companies in the world.\n\nThe startup is gearing up for what is widely expected to be a blockbuster IPO next year, after it confidentially filed its prospectus with the Securities and Exchange Commission in June.\n\nSarah Friar , OpenAI's CFO, told employees during an all-hands meeting last month that the company \"will be a public company in 2027,\" but that it could make its public market debut sooner if \"our business continues to inflect.\"\n\nCNBC's Kate Rooney and David Faber contributed to this article", "source": "CNBC World Economy", "pub_date_str": "16 Sep 2026, 06:46 PM IST", "pub_date_relative": "19m ago"}, {"title": "Your AI interviewer will see you now: How job seekers should navigate the 'jarring' new hiring technology", "full_content": "For both job seekers and employers, AI has already permeated almost every step of the hiring process, from evaluating resumes to writing cover letters.\n\nRather than hopping on a phone or Zoom call with a human recruiter, candidates are increasingly being asked to speak with an AI interviewer as the first step in the hiring process.\n\nNearly two-thirds (63%) of 2,950 active job seekers surveyed by Greenhouse, a hiring platform and applicant tracking system, say they have been interviewed by AI. That number grew 13% from the previous six months, according to the April 2026 report , which surveyed job seekers from the U.S., UK, Ireland, Germany and Australia.\n\nSome AI interviewers are faceless bots that simply ask questions through audio or text. Others are humanlike avatars that can smile, blink and nod their heads \u2014 albeit in a slightly uncanny manner.\n\nEither way, many candidates are struggling to adapt to the new technology, according to Katrina Kibben, a recruiting consultant and job post copywriter based in Rockford, Illinois.\n\nUntil recently, \"telling someone you had an interview always meant there was a person on the other side that you were interacting with,\" Kibben says. \"Now we've removed that human, and people are wondering: did the rules change?\"\n\nOne reason employers are adopting AI interviews is \"because they're getting more applications than they ever have,\" Kibben says.\n\nThe number of U.S. applicants for each open role has doubled since spring 2022, according to research from LinkedIn published in January 2026.", "source": "CNBC Top News", "pub_date_str": "16 Sep 2026, 06:46 PM IST", "pub_date_relative": "19m ago"}, {"title": "Aktis Oncology at Morgan Stanley conference: platform bets and capital strength", "full_content": "", "source": "Investing.com News", "pub_date_str": "16 Sep 2026, 06:46 PM IST", "pub_date_relative": "19m ago"}, {"title": "Tessera increases stake in drone testing firm to 15%", "full_content": "", "source": "Investing.com News", "pub_date_str": "16 Sep 2026, 06:46 PM IST", "pub_date_relative": "19m ago"}, {"title": "Climb Bio at Morgan Stanley conference: two lead drugs, long runway", "full_content": "", "source": "Investing.com News", "pub_date_str": "16 Sep 2026, 06:46 PM IST", "pub_date_relative": "19m ago"}, {"title": "Avidia Bancorp chairman Michael Murphy buys $110,600 in stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "16 Sep 2026, 06:46 PM IST", "pub_date_relative": "20m ago"}], "cfa": [{"title": "The \u2018CIA\u2019 strategy beating the market: How one top-performing money manager spots mispriced stocks", "full_content": "Sebastien Mallet is on the verge of his best one-year performance ever as portfolio manager of T. Rowe Price Global Value Equity Fund. Here\u2019s what he\u2019s buying.", "source": "MarketWatch Top Stories", "pub_date_str": "16 Sep 2026, 07:03 PM IST", "pub_date_relative": "3m ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Oil prices fall after U.S. says damaged Saudi pipeline will restart operations in days", "full_content": "Crude oil prices fell Wednesday as the Trump administration tried to reassure the market that Saudi Arabia's damaged East-West pipeline will restart operations in days.\n\nU.S. West Texas Intermediate futures were down 1.6% to $104.09 per barrel by 8:57 a.m. ET. Brent crude, the international benchmark, traded 1.1% lower to $107.57 per barrel. Prices have rallied around 20% this month as fighting has sharply escalated in the Persian Gulf.\n\nEnergy Secretary Chris Wright told CNBC on Tuesday that the pipeline outage is a \"brief and temporary interruption\" that \"will be measured in days.\"\n\nThe Saudis have taken \"quick action\" to export more oil through the Strait of Hormuz with U.S. military help while the pipeline is down, Wright said.\n\nBut independent analysts warned the pipeline could remain down for weeks based on satellite images showing significant damage to a pumping station.\n\nRiyadh closed the pipeline late last week after it sustained damage in drone attacks launched from Iraq. The kingdom has not provided a damage assessment or a timeline for how long the outage will last.\n\nThe pipeline has allowed the Saudis to shift oil exports to the Red Sea while the U.S. and Iran battle for control over Hormuz. The strait was the Gulf states' main export corridor before the war.\n\nThe U.S. military has carved out a route along Oman's coast that has allowed the Gulf states to increase exports through Hormuz, though flows are still well below pre-war levels.", "source": "CNBC Top News", "pub_date_str": "16 Sep 2026, 07:01 PM IST", "pub_date_relative": "4m ago", "cfa_topics": ["Economics", "Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "What history says about longer-term bond yields after an initial Fed hike", "full_content": "If the Federal Reserve hikes interest rates in an effort to slow down the rapid rise in longer-term yields, history shows it probably won\u2019t be a success.", "source": "MarketWatch Top Stories", "pub_date_str": "16 Sep 2026, 07:00 PM IST", "pub_date_relative": "6m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Retail sales surged toward the end of summer. The U.S. economy has plenty of momentum.", "full_content": "Sales at U.S. retailers surged in August and posted the biggest increase in five months, offering another piece of evidence suggesting the economy sped up toward the end of summer.", "source": "MarketWatch Top Stories", "pub_date_str": "16 Sep 2026, 06:52 PM IST", "pub_date_relative": "14m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "The Federal Reserve is expected to hike rates for the first time in three years: Live updates", "full_content": "While it may have taken a while, Wall Street finally has warmed to the idea that the Federal Reserve likely will raise its benchmark interest rate as it seeks to slay a maddeningly persistent inflation problem.\n\nTraders have assigned a better than 90% probability that the central bank's Federal Open Market Committee will vote to raise the overnight funds rate a quarter percentage point, putting the target range at 3.75%-4%, according to the CME Group's FedWatch gauge of futures prices.\n\nA month ago, the odds were just 36%, as the market expected soft inflation readings and Chairman Kevin Warsh 's reluctance to commit the Fed to a hawkish policy path to keep the appetite in check for tighter monetary policy.\n\nHowever, Warsh's remarks during the Fed's annual symposium in Jackson Hole, Wyoming, started to turn the tide. Another raft of discouraging inflation data along with a firming labor market helped seal the deal. A resurgence in crude oil prices back above $100 a barrel because of the Iran conflict adds to pressures on the central bank to act.\n\nMorgan Stanley economists reflected the broader Street sentiment. In a note Monday, the firm said it had switched its forecast from no hikes this year to two, based in part on Warsh's public statements as well as the leg higher in oil prices , inflationary expansion in artificial intelligence and a broader shift toward expectations for hikes. The firm expects one this week, followed by another in December.\n\n\"Not doing so would risk loss of credibility and a potential rise in longer-term risk premia similar to the reaction after the July FOMC meeting,\" wrote Michael Gapen, chief U.S. economist for Morgan Stanley.\n\nIf approved, the hike would be the first since July 2023 . Since then, the FOMC has lowered rates six times for a total of 175 basis points, or 1.75 percentage points.\n\nInvestors also will be watching a slew of other indicators Wednesday, as the committee updates its Summary of Economic Projections.", "source": "CNBC Top News", "pub_date_str": "16 Sep 2026, 06:50 PM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Quantitative Methods", "Economics", "Financial Statement Analysis", "Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "Finance Ministry rejects foreign influence claims over UPI MDR, says India's digital payments decisions are made independently", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a Finance Ministry rejects foreign influence claims over UPI MDR, says India's digital payments decisions are made independently The Economic Times daily newspaper is available online now. Read Today's Paper Finance Ministry rejects foreign influence claims over UPI MDR, says India's digital payments decisions are made independently SECTIONS Finance Ministry rejects foreign influence claims over UPI MDR, says India's digital payments decisions are made independently ET Online Last Updated: Sep 16, 2026, 06:48:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India's finance ministry rejected claims of foreign pressure influencing UPI transaction charges. A 0.4% Merchant Discount Rate will apply to UPI payments over Rs 2,000. This charge will not affect consumers and most small merchants remain exempt. The revenue will support payment ecosystem participants and infrastructure development. UPI policy decisions are made independently for an affordable digital payments ecosystem.\n\nA different kind of buyback. Is this the beginning of these kinds of buybacks?\n\nCome January 2027, will India\u2019s online platforms get their own Tukaram?\n\nFour rules made HDFC Bank a compounder. All four have stopped. Can the new CEO rewrite them?\n\nGold rush on Dalal St as regional jewellers bid to be the next Tanishq\n\nHormuz is a state, not a strait. There are 10 other possible chokepoints for the global economy, including India\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers", "source": "Economic Times Economy", "pub_date_str": "16 Sep 2026, 06:48 PM IST", "pub_date_relative": "17m ago", "cfa_topics": ["Quantitative Methods", "Financial Statement Analysis", "Corporate Issuers", "Alternative Investments"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "J.B. Hunt stock plunges 10% after company warns third-quarter earnings will fall", "full_content": "Shares of J.B. Hunt plunged more than 10% on Wednesday after the trucking company said it expects its earnings to drop in the third quarter.\n\n\"We kind of want to be transparent with investors and give an update that in light of these costs that are sort of hitting us, we are expecting our Q2 to Q3 earnings to actually drop 5% to 10%,\" CFO Brad Delco said at the Morgan Stanley Industrials conference.\n\nDelco said between costs for recruiting, advertising, onboarding, training and sign-on bonuses, the company expects to see about $25 million more in the third quarter compared with the second quarter. He said that means J.B. Hunt is \"preparing for growth.\"\n\nStill, he added the company has also seen \"some of the most radical and abnormal swings\" in fuel prices that it has ever seen and record-high diesel prices, which are causing at least a $10 million headwind.\n\nDelco added that he expects volumes to improve sequentially to offset the incremental pressures.\n\n\"It really is more of a timing issue,\" he said. \"I think you can look at a glass half-empty or a glass half-full. I'm really glad that we have visibility to these costs right now.\"\n\nDelco also said J.B. Hunt is working on repairing its margins, though he believes the company still has a long way to go.", "source": "CNBC Top News", "pub_date_str": "16 Sep 2026, 06:47 PM IST", "pub_date_relative": "19m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "RBC Capital reiterates Corteva stock rating on seed spinoff outlook", "full_content": "", "source": "Investing.com News", "pub_date_str": "16 Sep 2026, 06:46 PM IST", "pub_date_relative": "19m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Tropical Smoothie Cafe is getting a makeover as it prepares for its 'next 3,000' locations", "full_content": "Tropical Smoothie Cafe on Wednesday unveiled a new look as the restaurant chain prepares to continue its streak of rapid growth under Blackstone's ownership .\n\n\"We are a company and a brand that has evolved significantly over the last few years and really over the last 10 years,\" CEO Max Wetzel told CNBC. \"We're thinking about what our next 3,000 cafes look like, and so it's a perfect time for us to roll this out.\"\n\nThe redesign comes as Tropical Smoothie prepares to introduce itself to more consumers, both in the U.S. and internationally. The chain, which also sells bowls and wraps, surpassed $1.6 billion in system sales over the 12 months ended in June. By the end of the year, it is projecting it will exceed 1,800 locations nationwide, up 50% since the end of 2022. Tropical Smoothie has plans to expand outside of the U.S., too.\n\nBut its bold plans come during a tricky time for the restaurant industry. Diners have been eating out less frequently, trying to save money while paying more for gas, groceries and other necessities. As a result, eateries have been battling for a smaller pool of customers and often leaning on discounts to win them over.\n\nTropical Smoothie last tinkered with its logo a decade ago. The new design, which will be found everywhere from packaging for its wraps to its mobile app interface, uses brighter colors and a uniform font, in part to try to set it apart from quick-service competitors.\n\n\"The color palette is entirely created by the ingredients that you can find in our cafe,\" Wetzel said. \"All these ingredients are very different than a category that's really dominated by browns and beiges and fried food.\"\n\nIt also introduces the \"Palm T,\" a frond-shaped icon that will represent the brand in \"shorthand,\" particularly on digital platforms, according to Wetzel.\n\nTropical Smoothie has been working on the new branding for more than a year. But it is just one step toward what Wetzel called his ultimate goal: \"building a best-in-class company.\"", "source": "CNBC Top News", "pub_date_str": "16 Sep 2026, 06:46 PM IST", "pub_date_relative": "19m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "OpenAI investors have approached the company about a new funding round", "full_content": "OpenAI investors have approached the company with proposals to kickstart a new funding round, but no formal discussions are underway, multiple sources told CNBC.\n\nInvestors have floated a $1.2 trillion valuation to OpenAI, and some have positioned the potential new funding round as a way for employees to sell stock, according to the people, who asked not to be named in order to discuss nonpublic information.\n\nOpenAI, which raised $122 billion at a $852 billion valuation in March, is not currently engaged in conversations, the people said.\n\nOpenAI declined to comment. The Financial Times was first to report the potential round.\n\nOpenAI burst onto the mainstream in 2022 following the launch of its artificial intelligence chatbot ChatGPT , and it's ballooned into one of the most valuable private companies in the world.\n\nThe startup is gearing up for what is widely expected to be a blockbuster IPO next year, after it confidentially filed its prospectus with the Securities and Exchange Commission in June.\n\nSarah Friar , OpenAI's CFO, told employees during an all-hands meeting last month that the company \"will be a public company in 2027,\" but that it could make its public market debut sooner if \"our business continues to inflect.\"\n\nCNBC's Kate Rooney and David Faber contributed to this article", "source": "CNBC World Economy", "pub_date_str": "16 Sep 2026, 06:46 PM IST", "pub_date_relative": "19m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Think Nvidia Is Overpriced? The Irony Keeps Me Buying Again and Again", "full_content": "Skip to navigation Skip to main content Skip to right column Think Nvidia Is Overpriced? The Irony Keeps Me Buying Again and Again Alex Sirois Wed, September 16, 2026 at 6:15 AM MST 5 min read NVDA AMD AVGO Quick Read NVDA's forward P/E of 24 and PEG ratio of 0.46 reveal a GARP stock hiding inside a $5 trillion market cap.\n\nAMD and AVGO can't match NVDA's Networking segment, which alone generated $40 billion in one quarter, up 138% year over year.\n\nAnalyst EPS estimates for NVDA climbed from $12.67 to $15.57 in just 90 days, signaling earnings power is outrunning the valuation multiple.\n\nJust released. Our analysts combed the entire stock market and named the ten best stocks to buy right now, and NVIDIA didn't make the cut. Enter your email to see the names that beat NVDA. The report is free. Enter your email and see if any of your stocks made the cut.\n\nI keep hitting the buy button on NVIDIA ( NASDAQ:NVDA ), and the louder the \"it's overpriced\" chorus gets, the more shares I add. That sounds reckless until you look at what the multiple is actually paying for.\n\nAt $212.17 and a $5.12 trillion market cap, NVIDIA looks like the definition of a stretched stock. The trailing P/E of 43 is the number every skeptic quotes. The one they skip is the forward P/E of 24 and a PEG ratio of 0.46. Growth at a reasonable price rarely arrives in mega-cap wrapping, and that mismatch is what keeps me buying. The multi-trillion dollar valuation looks intimidating at face value, yet under the hood NVIDIA behaves like a GARP stock.\n\nStart with growth. Q2 FY2027 revenue landed at $96.22 billion, up 105.8% year over year, with Data Center alone at $89.02 billion, up 117%. Networking inside that segment printed $40.31 billion, up 138%. Management then guided Q3 to $108.0 billion, plus or minus 2%, and told analysts on the call to expect roughly 70% revenue growth in fiscal 2028.", "source": "Yahoo Finance", "pub_date_str": "16 Sep 2026, 06:45 PM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "\u2018My total balance should be $20 million\u2019: I invested $1.1 million in a crypto platform. Have I lost it all?", "full_content": "\u201cI invested on the recommendation of an executive vice president of a major New York investment bank.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "16 Sep 2026, 06:45 PM IST", "pub_date_relative": "21m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "WTO Report 2026: Is the world's trade rulebook breaking?", "full_content": "Choose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "16 Sep 2026, 06:43 PM IST", "pub_date_relative": "22m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Prediction: This Is What a $5,000 Investment in Broadcom Will Be Worth by 2028", "full_content": "Skip to navigation Skip to main content Skip to right column Prediction: This Is What a $5,000 Investment in Broadcom Will Be Worth by 2028 Keithen Drury, The Motley Fool Wed, September 16, 2026 at 6:08 AM MST 4 min read AVGO NVDA Broadcom (NASDAQ: AVGO) has been one of the quieter top-performing investments throughout the AI arms race. If you invested $5,000 at the start of the AI arms race in 2023, that sum is now worth more than $32,000. However, investors must look forward, not backward. Luckily, Broadcom's future is brighter than ever, and I think a $5,000 investment now could lead to a much larger sum later.\n\nWhile it won't be able to repeat the incredible performance it gave investors over the past three and a half years, I think it's still worth buying now.\n\nMissed Nvidia in 2009? This Rare Signal Is Flashing Again. In 2009, a \"Double Down\" signal flashed for a little-known chipmaker called Nvidia. For the first time in years, that same \"Total Conviction\" signal is flashing for a company 1/100th the size of Nvidia. Continue \u00bb\n\nBroadcom does a lot of different things as a company, ranging from software to virtual desktops to networking hardware. However, the most exciting product development over the past few years has been its custom AI chips. Instead of going head-to-head with companies in the GPU space , which excel at all types of workloads, Broadcom is partnering directly with AI hyperscalers to develop chips purpose-built for their workloads. These units can provide better performance at a lower price tag than their GPU counterparts, but only when the workloads are properly configured.\n\nBroadcom has several big-name clients, including Alphabet (NASDAQ: GOOG) (NASDAQ: GOOGL), Meta Platforms (NASDAQ: META), OpenAI, and Anthropic, to name a few.", "source": "Yahoo Finance", "pub_date_str": "16 Sep 2026, 06:38 PM IST", "pub_date_relative": "28m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Real REMAX Group (REAX) Stock Weakness Reflects Fears of AI-Driven Market Changes", "full_content": "Skip to navigation Skip to main content Skip to right column Real REMAX Group (REAX) Stock Weakness Reflects Fears of AI-Driven Market Changes Soumya Eswaran Wed, September 16, 2026 at 6:07 AM MST 2 min read REAX Wasatch Global Investors , an asset management company, released its \"Long/Short Alpha Fund\" Q2 2026 investor letter. The letter can be downloaded here . Small- and mid-cap growth stocks posted significant gains in Q2, led primarily by AI-related companies. The Russell 2500 Index rose 20.26%, while the Wasatch Long/Short Alpha Fund\u2014Investor Class increased by 8.29%. However, the fund faced challenges due to the outperformance of lower-quality companies, which negatively impacted its long positions. Despite trailing the benchmark and some losses in short positions, the fund remains confident in its long portfolio's fundamentals, which have not deteriorated. Additionally, reviewing the Fund's top five holdings could help identify its best picks for 2026.\n\nIn its second-quarter 2026 investor letter, Wasatch Long/Short Alpha Fund highlighted Real REMAX Group Inc. (NASDAQ: REAX ). Real REMAX Group Inc. (NASDAQ:REAX) is a real estate technology company that provides title, mortgage, wallet, and franchising and ancillary services. The Real Brokerage, Inc. changed its name to Real REMAX Group Inc. (NASDAQ:REAX) in August 2026. On September 15, 2026, Real REMAX Group Inc. (NASDAQ:REAX) closed at $19.27 per share. Over the past month, Real REMAX Group Inc. (NASDAQ:REAX) declined 30.93%, but its shares are down 61.84% over the past year. Real REMAX Group Inc. (NASDAQ:REAX) has a market capitalization of $422.42 million, and its stock has traded within a 52-week range of $15.50 to $52.50.\n\nWasatch Long/Short Alpha Fund stated the following regarding Real REMAX Group Inc. (NASDAQ:REAX) in its Q2 2026 investor letter:\n\n\"Among shorts, contributors to Fund performance were those stocks that declined in price. One of our largest contributors was REMAX Group Inc.", "source": "Yahoo Finance", "pub_date_str": "16 Sep 2026, 06:37 PM IST", "pub_date_relative": "28m ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Ed Yardeni slashes S&P 500 target, says \u2018proceed with caution\u2019 in stocks as rates rise", "full_content": "The sharp rise in bond yields is making even the biggest market bulls nervous. Ed Yardeni is no exception.", "source": "CNBC Top News", "pub_date_str": "16 Sep 2026, 06:37 PM IST", "pub_date_relative": "28m ago", "cfa_topics": ["Equity Investments", "Fixed Income"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "The 10-Year Treasury Broke 5% and Long Bond Holders Are Not Getting Rescued", "full_content": "Skip to navigation Skip to main content Skip to right column The 10-Year Treasury Broke 5% and Long Bond Holders Are Not Getting Rescued Omor Ibne Ehsan Wed, September 16, 2026 at 6:05 AM MST 5 min read TLT Quick Read TLT dropped to $80.71 as the 10-year Treasury yield pierced 5% for the first time since 2007, leaving the fund down 36% over five years.\n\nGovernments financing widening deficits and AI capital spending compete for the same finite pool of global savings, pushing long yields structurally higher.\n\nReal 10-year yields at 3% undermine TLT's bull case unless a recession forces the Fed into rapid cuts.\n\nRead More: Avoid these 13 retirement mistakes before they derail your future (sponsor)\n\nThe US 10-year Treasury yield touched 5% on September 15, 2026, and the fund most directly tied to that move, iShares 20+ Year Treasury Bond ETF ( NASDAQ:TLT ), closed the session at $80.71.\n\nBloomberg host Stephen Carroll described the 10-year Treasury yield punching through the 5% mark to its highest level since 2007, with surging energy prices adding inflation pressure.\n\nThe Fed's target range upper bound sits at 3.75% and has been unchanged since December 2025, so the long end is not being pulled higher by fresh tightening at the front.\n\nThe tension for anyone holding TLT as a rate-cut bet is that the price of long money has kept rising while policy has stood still. Persistent inflation of roughly 3% gives the market reason to demand more term premium rather than less, which is a different problem than a Fed that eventually pivots.", "source": "Yahoo Finance", "pub_date_str": "16 Sep 2026, 06:35 PM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Bloom Energy Corp. (BE) Short Position Weighs on Performance Amid Small-Cap AI Rally", "full_content": "Skip to navigation Skip to main content Skip to right column Bloom Energy Corp. (BE) Short Position Weighs on Performance Amid Small-Cap AI Rally Soumya Eswaran Wed, September 16, 2026 at 6:05 AM MST 3 min read BE Wasatch Global Investors , an asset management company, released its \"Long/Short Alpha Fund\" Q2 2026 investor letter. The letter can be downloaded here . Small- and mid-cap growth stocks posted significant gains in Q2, led primarily by AI-related companies. The Russell 2500 Index rose 20.26%, while the Wasatch Long/Short Alpha Fund\u2014Investor Class increased by 8.29%. However, the fund faced challenges due to the outperformance of lower-quality companies, which negatively impacted its long positions. Despite trailing the benchmark and some losses in short positions, the fund remains confident in its long portfolio's fundamentals, which have not deteriorated. Additionally, reviewing the Fund's top five holdings could help identify its best picks for 2026.\n\nIn its second-quarter 2026 investor letter, Wasatch Long/Short Alpha Fund highlighted Bloom Energy Corporation (NYSE: BE ). Bloom Energy Corporation (NYSE:BE), designs and manufactures solid-oxide fuel cell systems for clean, reliable, on-site power generation. On September 15, 2026, Bloom Energy Corporation closed at $259.35 per share. Over the past month, Bloom Energy Corporation returned 25.51%, and its shares are up 225.53% over the past year. Bloom Energy Corporation has a market capitalization of $76.39 billion, and its stock has traded within a 52-week range of $61.37 to $351.28.\n\nWasatch Long/Short Alpha Fund stated the following regarding Bloom Energy Corporation (NYSE:BE) in its Q2 2026 investor letter:\n\n\"Turning to short positions, detractors from Fund performance were those stocks that rose in price. One of the largest detractors was Bloom Energy Corporation (NYSE:BE).", "source": "Yahoo Finance", "pub_date_str": "16 Sep 2026, 06:35 PM IST", "pub_date_relative": "31m ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Govt hikes wage ceiling for EPF coverage: We calculate how this could impact your pension payout at retirement", "full_content": "The Union Cabinet on Wednesday has after 12 years, approved raising the wage ceiling eligibility for Employees Provident Fund (EPF) coverage by \u20b9 10,000, from the \u20b9 15,000 set in 2014, according to a statement from Union Information and Broadcasting (I&B) Minister Ashwini Vaishnaw.\n\nAccording to an official government release, the ceiling has been hiked in order to \u201creflect sustained wage growth , rising incomes and continued expansion of formal employment over the intervening years\u201d.\n\nWage ceiling for membership to the EPF Organisation has been raised to \u20b9 25,000 per month, bringing an additional 51 lakh employees under mandatory provident fund cover, and widening social security coverage for workers. Notably, the EPFO also administers pension under the Employees\u2019 Pension Scheme (EPS) and insurance protection under the Employees\u2019 Deposit Linked Insurance Scheme ( EDLI ).\n\nLatest EPFO data shows around 7.98 crore contributing members across about 7.68 lakh contributing establishments, while the EPS provides pension benefits to around 82 lakh pensioners.\n\nToday, we calculate how this decision can impact your pension and how much increase in payout you could expect:\n\nThe EPFO's pension benefit is provided to all subscribers who have an account with for more than 10 years. Under this, 8.33% of the 12% employer contribution to your EPF account is directed towards your EPS account. Further, the government also contributes 1.16% (subject to wage ceiling ) towards the fund.\n\nThus, with both the employer and government contribution subject to wage ceiling, the total accumulated corpus towards your final pension payout will increase.\n\nAt time of retirement, members can withdraw their provident fund amount in full and choose to maintain EPS annuity by availing a Scheme Certificate. As per the rules, 58 years is considered age of retirement, and members can choose to delay pension payments till 60 years of age, by either:", "source": "LiveMint Money", "pub_date_str": "16 Sep 2026, 06:34 PM IST", "pub_date_relative": "31m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Portfolio Management"], "exam_note": "Understand how macroeconomic indi     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
