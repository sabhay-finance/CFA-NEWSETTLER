<script>
    // This variable will be injected during the build process
    const allData = {"general": [{"title": "Stocks making the biggest moves Wednesday: CoreWeave, Nvidia, NextNav & more", "full_content": "CoreWeave surged 20% Wednesday, as investors breathed a sigh of relief after the struggling neocloud reported better-than-expected third quarter results.\n\nNvidia also rose as the chipmaker tries to recover from steep back-to-back losses.\n\nFollow below as CNBC covers the biggest stock market moves of the day.\n\nCoreWeave shares jumped 20% Wednesday after the neocloud posted quarterly earnings that beat estimates and raised its guidance for the year.\n\n\"Demand for the infrastructure is and remains overwhelming.\" CEO Michael Intrator told CNBC's \"Squawk on the Street\" Wednesday.\n\n\"I think I said that we are 10x oversubscribed to the existing capacity that we have left in 2027, and we are multiples ... oversubscribed on the capacity we have out in 2028,\" he said.\n\nTalen Energy stock advanced nearly 5% in the premarket trading Wednesday.\n\nIt comes after the power producer and energy infrastructure company announced a seven-year agreement to sell 750 megawatts of capacity to an investment-grade counterparty.", "source": "CNBC Top News", "pub_date_str": "11 Nov 2026, 08:59 PM IST", "pub_date_relative": "1m ago"}, {"title": "CoreWeave CEO Intrator tells CNBC he has canceled his planned share sale program", "full_content": "CoreWeave CEO Michael Intrator told CNBC on Wednesday that he has canceled his 10b5 stock sale plan after the company reported strong revenue growth and beat Q3 expectations.\n\n\"Until there is a material change in in, in our equity pricing, my 10b5 has been sidelined,\" he told CNBC's \"Squawk on the Street.\"\n\nHe said any further selling would be \"just normal tax stuff.\"\n\nUnder Intrator's 10b5-1 plan announced in November 2025, the CEO has sold 8.26 million shares at an average price of $96.14 per share for a total of $794.2 million.\n\nIntrator and his co-founders have faced criticism for their stock sales as the company's stock has struggled, with shares down 18% so far in 2026 despite a 20% post-earnings rally on Wednesday.\n\nThe company has faced further pressure from the sell-off in the aftermath of last week's sweeping electoral victory for Democrats, but Intrator told investors on the earnings call that the company isn't worried about the political changes on the horizon.\n\n\"We do not anticipate any impact from the seismic regulatory shift that's occurred,\" Intrator said on his company's earnings call late Tuesday, in response to a question about new pressures after the election. \"We believe that what has occurred is a statement around how you build. We want to build responsibly.\"\n\nIntrator's comments came after CoreWeave reported 168% year-over-year revenue growth, beating estimates, and lifted its forecast for 2026. The stock rallied in extended trading, as the report offered some relief to investors, who have pushed the shares down about 27% over the past month.", "source": "CNBC World Economy", "pub_date_str": "11 Nov 2026, 08:58 PM IST", "pub_date_relative": "1m ago"}, {"title": "Nasdaq surges as CoreWeave leads tech rebound: Live updates", "full_content": "Stocks were mostly higher Wednesday, boosted by sharp gains in CoreWeave and a rebound in Nvidia following back-to-back losing sessions for the chipmaker.\n\nThe Nasdaq Composite jumped 1.2%, while the S&P 500 advanced 0.8%. The Dow Jones Industrial Average fell 152 points, or 0.2%\n\nNeocloud stock CoreWeave rallied 20% after the company reported third-quarter revenue that beat analyst expectations. CoreWeave also lifted its operating income and revenue guidance for 2026.\n\nNvidia, meanwhile, climbed 2.7%, after the stock dropped nearly 10% to begin the week following CEO Jensen Huang confirming he had an affair with an alleged Chinese spy. The pullback in Nvidia weighed on the broader market Tuesday, with the major averages ending the session lower.\n\n\"The sentiment bump coming from CoreWeave results and Anthropic IPO demand is helping the broader ecosystem,\" Ross Mayfield, an Investment Strategist for Baird Private Wealth Management, told CNBC. \"Markets are continuing to unwind last week's overshoot to the downside with cleaner positioning now a tailwind and an attractive near-term valuation/earnings story in a lot of the AI stocks.\"\n\nEquities also fell on Tuesday after the latest U.S. inflation data solidified expectations for a December Federal Reserve rate hike. The consumer price index increased by 0.4% month over month in October , topping expectations.\n\nExpectations for a quarter-point rate increase next month rose to about 90% following the release, per the CME Group's FedWatch tool.\n\n\"Despite some technical uncertainty, higher than desired levels of inflation should keep the Fed in a stance of dissatisfaction with the degree of progress on inflation remaining lackluster, so hiking the Fed Funds policy rate in December is our and the market's base case,\" wrote Rick Rieder, CIO of global fixed income at BlackRock. \"The question now is more of one of the extent of the hike.\"", "source": "CNBC Top News", "pub_date_str": "11 Nov 2026, 08:58 PM IST", "pub_date_relative": "2m ago"}, {"title": "CoreWeave just gave a shot in the arm to Micron, Lumentum and the rest of the AI trade", "full_content": "CoreWeave\u2019s improved AI economics and its vow to show some discipline around debt are sparking a broad rally across the chip sector.", "source": "MarketWatch Top Stories", "pub_date_str": "11 Nov 2026, 08:56 PM IST", "pub_date_relative": "4m ago"}, {"title": "US tech stocks gain as AI trade revives", "full_content": "Nasdaq erases bulk of last week\u2019s losses as better-than-expected CoreWeave results and prospect of higher Anthropic IPO valuation boost sentiment", "source": "FT Markets", "pub_date_str": "11 Nov 2026, 08:55 PM IST", "pub_date_relative": "4m ago"}, {"title": "I\u2019m 63 and want to spend $95,000 on a roof deck for my $500,000 home. Is that a good investment?", "full_content": "\u201cI have a net worth of $2.3 million and my only debt is a 15-year mortgage with an outstanding balance of $295,000.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "11 Nov 2026, 08:55 PM IST", "pub_date_relative": "5m ago"}, {"title": "Market angst is driving investors into low-volatility stocks as AI trade stumbles", "full_content": "Anxiety in the U.S. stock market has surged amid a sharp selloff in artificial intelligence names and stubbornly high bond yields.", "source": "MarketWatch Top Stories", "pub_date_str": "11 Nov 2026, 08:45 PM IST", "pub_date_relative": "15m ago"}, {"title": "Measles is surging in the U.S. \u2014 and outbreaks can cost millions", "full_content": "Measles outbreaks aren't just a public health threat. They can also be a financial burden on the U.S. \u2014 and the cost could only deepen as the once-eliminated disease spreads more widely.\n\nThe U.S. is expected to lose its official measles elimination status following a review by the Pan American Health Organization this week, after cases ratcheted to recent highs this year.\n\nMore than 5,100 measles cases have been reported nationwide in 2026 as of early November, marking the country's worst outbreak in more than three decades. Eight deaths associated with the disease have been confirmed by states so far in 2026: six in Pennsylvania , one in New York and one in Wisconsin .\n\nBased on this year's case count, a new tool developed by researchers at Johns Hopkins University estimates an economic cost of nearly $83 million for the outbreaks. That total includes $56 million in public health response costs, almost $25 million in lost productivity and more than $1.8 million in direct medical expenses.\n\nThe tool also estimates that 2025 measles outbreaks in the U.S. \u2014 which involved 2,289 confirmed cases nationwide \u2013 carried an economic cost of more than $37 million.\n\nThe costs extend beyond treating people who become sick, accounting for the resources health departments spend investigating and containing outbreaks, as well as wages lost when people have to miss work. The tool uses more recent, state-specific cost and financing data than an initial study by the researchers, which relied on historical outbreak costs.\n\nThe estimates from the tool are not a definitive accounting of what the outbreaks actually cost. But it illustrates the hefty bill tied to the spread of a disease that can be prevented through vaccination, and the potential economic consequences of falling childhood immunization rates. CNBC previously reported on how the return of measles in the U.S.", "source": "CNBC Top News", "pub_date_str": "11 Nov 2026, 08:44 PM IST", "pub_date_relative": "15m ago"}, {"title": "Lowe\u2019s stock may move 4.7% on Nov. 18 earnings report", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Nov 2026, 08:43 PM IST", "pub_date_relative": "16m ago"}, {"title": "WEX at KBW Fintech Ecosystem Conference 2026: growth reset gains traction", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Nov 2026, 08:43 PM IST", "pub_date_relative": "16m ago"}, {"title": "CoreWeave soars 20% as CEO reaffirms AI compute demand after strong Q3 report", "full_content": "CoreWeave shares jumped 20% Wednesday after the neocloud posted quarterly earnings that beat estimates and raised its guidance for the year.\n\n\"Demand for the infrastructure is and remains overwhelming.\" CEO Michael Intrator told CNBC's \"Squawk on the Street\" Wednesday.\n\n\"I think I said that we are 10x oversubscribed to the existing capacity that we have left in 2027, and we are multiples ... oversubscribed on the capacity we have out in 2028,\" he said.\n\nNeoclouds such as CoreWeave, Nebius and IREN have come under scrutiny this month as investors assessed the sustainability of the AI trade. CoreWeave, in particular, sparked alarm when spreads on its CDS widened past 11% , generally viewed as a distress level, as investors have to pay up for protection against default.\n\nRevenue jumped 168% to $3.7 billion in the third quarter, the company said in a Tuesday statement .\n\nThe three months to Sept. 30 marked a \"breakout quarter\" for CoreWeave, CEO Michael Intrator said, adding that growth was supported by multiple sources of funding, including financing backed by customer contracts and around $9 billion in customer prepayments and deposits.\n\nOther neclouds also rose on CoreWeave's strong results, with Nebius up 12%, Applied Digital up 6% and Iren up 6% after the open.\n\nCoreWeave shares this year. CoreWeave expects $1.275 billion to $1.375 billion in adjusted operating income on $13 billion to $13.3 billion in revenue. Analysts surveyed by Visible Alpha were looking for $1.07 billion in adjusted operating income, and analysts polled by LSEG had expected $12.86 billion in 2026 revenue.", "source": "CNBC World Economy", "pub_date_str": "11 Nov 2026, 08:43 PM IST", "pub_date_relative": "16m ago"}, {"title": "Triumph Financial at KBW fintech ecosystem conference: monetizing its network", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Nov 2026, 08:43 PM IST", "pub_date_relative": "16m ago"}, {"title": "Why is Interfor stock sliding today?", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Nov 2026, 08:42 PM IST", "pub_date_relative": "17m ago"}, {"title": "RUM earnings missed by $0.09, revenue topped estimates", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Nov 2026, 08:42 PM IST", "pub_date_relative": "17m ago"}, {"title": "S&P 500, Nasdaq rise as CoreWeave results ease AI spending worries", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Nov 2026, 08:42 PM IST", "pub_date_relative": "17m ago"}, {"title": "Golar LNG shares may move 5.1% on Nov. 18 earnings release", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Nov 2026, 08:42 PM IST", "pub_date_relative": "18m ago"}, {"title": "Why is Celestica stock rallying today?", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Nov 2026, 08:41 PM IST", "pub_date_relative": "18m ago"}, {"title": "From living in his car to a 756 credit score: How one veteran rebuilt his finances", "full_content": "Many service members face an often invisible financial trap when they step out of uniform.", "source": "MarketWatch Top Stories", "pub_date_str": "11 Nov 2026, 08:38 PM IST", "pub_date_relative": "22m ago"}, {"title": "MRF share price target after Q2: Tyre maker faces margin pressure, but Citi sees 30% upside; sets \u20b91,65,238 target", "full_content": "A Ksheerasagar Published 11 Nov 2026, 08:35 PM IST Prefer Livemint on Google Global brokerage firm Citi has maintained its bullish outlook on MRF even as the company's September-quarter performance was hit by rising raw material prices. The brokerage has retained its 'Outperform' rating on the stock with a target price of \u20b9 1,65,238, indicating an upside potential of 30% from the stock's Wednesday closing price of \u20b9 1,27,125.\n\nEarlier this week, the tyre manufacturer reported an 18% year-on-year (YoY) increase in revenue to \u20b9 85.2 billion. However, higher-than-expected raw material inflation led to a 430-basis-point (bp) YoY contraction in its EBITDA margin to 10.7%. The margin pressure also resulted in a 28% YoY decline in profit after tax (PAT) to \u20b9 3.7 billion.\n\nThe brokerage said the margin pressure would have been even higher if the company had not undertaken price increases of 13-15% in the replacement segment during the first half of FY27. It also noted that cost-reduction initiatives had helped partially cushion the impact of higher input prices, CNBC-TV18 reported. Mint could not independently verify the report.\n\nCiti pointed out that the benefit of price increases in the original equipment manufacturer (OEM) segment typically flows through with a one-quarter lag. As a result, the full impact of the price hikes undertaken in Q2 FY27 is expected to be reflected in the current quarter.\n\nCiti expects costs to remain elevated in Q3 FY27, indicating that a recovery in margins could take time.", "source": "LiveMint Markets", "pub_date_str": "11 Nov 2026, 08:35 PM IST", "pub_date_relative": "24m ago"}, {"title": "JetBlue's CEO has pushed back on creditor fears and is betting on premium to return to profitability", "full_content": "JetBlue Airways executives have sought to calm investors after shares in the airline hit a record low following a report that bondholders had contracted restructuring advisors. \"We have no intention, no plans to file for bankruptcy. We are not engaged with any restructuring company,\" CEO Joanna Geraghty told CNBC in an interview last month.\n\nShares have bounced back and are up 40% so far this month as of Tuesday's close.\n\nGeraghty has said the company is focused on its turnaround plan. A major part of that strategy is the airline betting on the premium travel boom to make it profitable again. It will start the next chapter of the effort on Wednesday, when it unveils its new domestic first-class seats at its home hub at John F. Kennedy International Airport.\n\nTune in at 10:50 a.m. ET as JetBlue CEO Joanna Geraghty joins CNBC TV to discuss the company's target of getting back to profitability. Watch in real time on CNBC+ or the CNBC Pro stream.\n\nJetBlue announced it would offer a domestic first class \u2014 BlueFirst \u2014 in December 2024 and plans to start flying aircraft with the new seats and full on-board product next month. Retrofits will continue during 2027, Geraghty told CNBC late last month.\n\nBlueFirst is different from the lie-flat, longer-haul business class, Mint, that JetBlue offers on transcontinental and Europe routes. The carrier plans to offer BlueFirst on flights on popular leisure routes throughout Florida and the Caribbean.\n\nThe New York airline last posted a profit in 2019, before the pandemic. JetBlue is betting that resilient travel demand, especially for roomier seats, will help fuel its turnaround plan, which aims to get the carrier to an operating profit next year and $1 in adjusted earnings per share in 2028.\n\nThe company reported it ended the third quarter with $2.2 billion in liquidity and that its unencumbered asset base is now $7 billion, including $2.8 billion in aircraft and engines.", "source": "CNBC Top News", "pub_date_str": "11 Nov 2026, 08:30 PM IST", "pub_date_relative": "30m ago"}, {"title": "US stocks: US market opens higher as CoreWeave lifts AI trade", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a US stocks: S&P 500, Nasdaq rise as CoreWeave results ease AI spending concerns Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US stocks: S&P 500, Nasdaq rise as CoreWeave results ease AI spending concerns SECTIONS US stocks: S&P 500, Nasdaq rise as CoreWeave results ease AI spending concerns Reuters Last Updated: Nov 11, 2026, 08:57:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The S&P 500 and Nasdaq indices showed positive growth as CoreWeave posted impressive financial results, calming fears regarding AI expenditure. Following its projection of reaching profitability by 2028, CoreWeave's stock jumped 12.7%, boosting investor confidence about ongoing demand. AI infrastructure stocks mirrored this positive trend. Despite some volatility linked to interest rate fluctuations and inflation, most stocks rose in value, with oil prices recovering after Iran's comments.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "11 Nov 2026, 08:26 PM IST", "pub_date_relative": "33m ago"}, {"title": "Micron Is Rebounding but Goldman Prefers These Memory Stocks - Barron's", "full_content": "Micron Is Rebounding but Goldman Prefers These Memory Stocks Barron's Micron stock is a screaming buy at current valuation levels: Goldman Sachs Yahoo Finance Micron Is Down 40% Since Oct. 7. History Suggests a $5,000 Investment Today Could Be Worth This Much by 2030. The Motley Fool Only One Analyst Says Sell Micron, and It\u2019s a Strong Sell. Should Investors Listen? 24/7 Wall St. Micron: The $300 Nightmare And The $1,500 Opportunity (NASDAQ:MU) Seeking Alpha", "source": "Google News Business", "pub_date_str": "11 Nov 2026, 08:22 PM IST", "pub_date_relative": "38m ago"}, {"title": "India's net direct tax collections rise 11.8% to Rs 14.42 lakh crore from April 1 to Nov 10", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Finance \u203a India's net direct tax collections rise 11.8% to Rs 14.42 lakh crore from April 1 to Nov 10 The Economic Times daily newspaper is available online now. Read Today's Paper India's net direct tax collections rise 11.8% to Rs 14.42 lakh crore from April 1 to Nov 10 SECTIONS India's net direct tax collections rise 11.8% to Rs 14.42 lakh crore from April 1 to Nov 10 ET Online Last Updated: Nov 11, 2026, 08:39:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India's net direct tax collections recorded an increase of 11.76% to reach Rs 14.42 lakh crore. Gross direct tax collections rose by 14.02%, boosting receipts to Rs 17.50 lakh crore. Corporate tax collections grew by about 17.84%, amounting to Rs 6.32 lakh crore. Non-corporate tax collections saw a rise of 5.30%, increasing to Rs 7.56 lakh crore. Direct tax refunds increased significantly, reaching Rs 3.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\nBusiness of Odd Things: The farm that needs no land, freshwater, or fertiliser\n\nKYC and KYB: Inside Pidilite, the company that turned Fevicol into a word for a strong bond \u2013 Part 1 of 3\n\nSeoul halts trading, Nifty has its best week since 2021: Money leaving the AI trade \u2013 will it land in India?\n\nJunk bonds are cracking at the bottom. Will the noise get loud enough to make \u2018junk bond\u2019 a household term again?\n\nPNG connections rise half a million, but how many use piped gas for cooking?\n\nSome elections matter more than you know: No crop changed in the fields, yet sugar, coffee and soya got cheaper in a day", "source": "Economic Times Economy", "pub_date_str": "11 Nov 2026, 08:20 PM IST", "pub_date_relative": "40m ago"}, {"title": "CFTC investigates if Kalshi improperly self-certified event contracts", "full_content": "The Commodity Futures Trading Commission is investigating if prediction market platform Kalshi failed to properly inform the agency of proposed event contracts, Kalshi confirmed to CNBC.\n\nKalshi called it a minor issue in how the contracts were filed and said it is working with the CFTC to address the matter. The CFTC flagged weather-related contracts, Kalshi said. The leading prediction market platform didn't say when the agency began investigating Kalshi. The CFTC didn't immediately respond to a request for comment.\n\nPolitico first reported on the probe on Tuesday, noting charges could happen soon, based on the CFTC's private notification to Kalshi. The platform declined to comment on any possible charges.\n\nPrediction market platforms are allowed to self-certify event contracts without the federal agency's prior approval, as long as they comply with the Commodity Exchange Act. The self-regulation allows for faster introduction of new contracts.\n\n\"The notice is about a procedural error involving the submission of a handful of contracts, many of which weren't live,\" said Elisabeth Diana, head of communications at Kalshi. \"We are already addressing the issue.\"\n\nThe move is the latest by the CFTC as it seeks to rein in prediction markets, which face growing scrutiny in Washington D.C. from regulators and members of Congress .\n\nIn August, the CFTC ordered Kalshi to take down sports-related \" mention markets \" \u2014 where speculators can trade on what individuals will say in a broadcast or speech \u2014 while it looked into the event contract type.\n\nThe agency is also conducting a broad probe into competitor Polymarket , which includes reviewing if the company violated a 2022 settlement with the CFTC to prohibit U.S. traders from accessing its international trading platform. Polymarket's domestic exchange operates separately from the global platform.", "source": "CNBC Top News", "pub_date_str": "11 Nov 2026, 08:19 PM IST", "pub_date_relative": "41m ago"}, {"title": "Big investors are buying the dip. Retail traders are not", "full_content": "It's the large investors who are stepping up and scooping up shares after the recent market declines, Bank of America data shows.", "source": "CNBC Top News", "pub_date_str": "11 Nov 2026, 08:18 PM IST", "pub_date_relative": "42m ago"}, {"title": "Jensen Huang\u2019s Affair Puts His Wife in the Spotlight - The New York Times", "full_content": "Jensen Huang\u2019s Affair Puts His Wife in the Spotlight The New York Times Dan Ives warns removing Jensen Huang as Nvidia CEO could wipe $1.2 trillion from the company's value Yahoo Finance Spy scandal highlights contradictions at heart of Trump\u2019s China policy The Washington Post How Nvidia CEO Jensen Huang's extramarital affair could cause collateral damage in Washington AP News Who is Alice Huang, alleged spy who reportedly had affair with Nvidia CEO? The Hill", "source": "Google News Business", "pub_date_str": "11 Nov 2026, 08:16 PM IST", "pub_date_relative": "43m ago"}, {"title": "Stock Market Today: Nasdaq Jumps at Open After CoreWeave Earnings \u2014 Live Updates - WSJ", "full_content": "Stock Market Today: Nasdaq Jumps at Open After CoreWeave Earnings \u2014 Live Updates WSJ Nasdaq surges as CoreWeave leads tech rebound: Live updates CNBC Rebounding AI stocks lift Wall Street Pittsburgh Post-Gazette US Equity Futures Rise as AI Enthusiasm Counters Hot Inflation Bloomberg.com Nvidia stock rebounds, chip stocks surge as CoreWeave earnings boost AI trade Yahoo Finance", "source": "Google News Business", "pub_date_str": "11 Nov 2026, 08:11 PM IST", "pub_date_relative": "49m ago"}, {"title": "Jensen Huang's affair with alleged Chinese spy further complicates Nvidia\u2019s China problem", "full_content": "Following Nvidia CEO Jensen Huang's admission on Sunday to an extramarital affair with alleged Chinese spy Alice Huang, the chipmaker's relationship to China is about to come under intense scrutiny in Washington, D.C.\n\nSince October 2022, when the Biden administration announced sweeping controls to limit China's ability to obtain advanced U.S. chips, Nvidia has seen its business diminish in the world's second-largest economy. Months after an even stricter set of rules was implemented by the Trump administration, Huang said in October 2025, \"We are 100% out of China.\"\n\nThe recent allegations against Huang, while throwing the chipmaker into crisis, have also brought attention to the Nvidia CEO's potential influence over U.S. policy on chip sales to China, where its business once flourished. Of particular interest is whether restricted Nvidia chips have reached Chinese companies through customers like Singapore-based Megaspeed , the company linked to Alice Huang.\n\nThe New York Times first reported that the Chinese businesswoman was a spy for China's Ministry of State Security, according to people briefed on the intelligence circulated in a memo among the Trump administration in the spring. China has called the allegation a smear.\n\nJensen Huang has been closely aligned with President Donald Trump during his second administration, helping advise the White House on artificial intelligence safety regulations, while also pushing for looser restrictions on selling AI chips to China. In December, Trump said Nvidia would be allowed to ship its H200 chips to China, provided the U.S. got a 25% cut of sales.", "source": "CNBC World Economy", "pub_date_str": "11 Nov 2026, 08:09 PM IST", "pub_date_relative": "50m ago"}, {"title": "Capri Holdings names longtime Estee Lauder executive Justin Boxford new CEO", "full_content": "Michael Kors parent Capri on \u200bWednesday named Justin Boxford to replace \u200ccompany veteran John Idol as CEO, effective January 4. Boxford joins Capri after nearly 23 years at Estee Lauder , \u200bwhere he held various positions, including senior vice \u200bpresident for Estee Lauder and Tom Ford \u2060Beauty brands outside of North America. Boxford \u200bmost recently served as the global president \u200bof Estee Lauder's luxury beauty brands. The leadership change comes as Capri works to revive demand at Michael \u200bKors by revamping stores and investing in \u200bnew products, as inflation-weary consumers grow more selective about \u200cdiscretionary \u2060spending. The Jimmy Choo owner lifted its annual revenue and profit forecasts last month as it expects a return of sales growth, helped by new collections and increased \u200bmarketing. Idol, who has \u200bled the \u2060company since December 2003, oversaw its acquisition of Jimmy Choo \u200bnearly a decade ago and the purchase and \u200beventual $1.4 \u2060billion sale of Versace last year. He was also Capri's CEO during its failed $8.5 billion merger attempt \u2060with \u200bCoach parent Tapestry in \u200b2024. Shares of Capri fell marginally in premarket trading.", "source": "CNBC Top News", "pub_date_str": "11 Nov 2026, 08:09 PM IST", "pub_date_relative": "50m ago"}, {"title": "Nvidia shares rebound as Jensen Huang faces scrutiny ahead of earnings", "full_content": "Nvidia 's stock rose 3% on Wednesday, after falling for two days amid the scandal that has rocked the world's most valuable tech company.\n\nShares closed down 5.47% on Tuesday as more details were revealed about the impact of CEO Jensen Huang 's affair with an alleged Chinese spy . They fell 4.3% Monday.\n\nOn Tuesday, Nvidia announced it had hired law firm Wachtell, Lipton, Rosen & Katz to investigate whether company secrets or national security were compromised.\n\nHuang tried to project \"business as usual\" as he returned to the office on Monday, people familiar with the matter told CNBC. The CEO was also in the office on Tuesday, conducting meetings, ahead of the company's quarterly earnings on Nov. 17.\n\nInvestors are assessing whether the matter will have damaging spillover effects on the business.\n\nNvidia shares over the past five days. In a Tuesday note, Bank of America said it saw three scenarios with differing investment outcomes. In one scenario, the impact is contained with leadership continuity, and in another, prolonged uncertainty pressures valuation before earnings.\n\nIn the final scenario, the impact is escalated, with \"adverse findings, leadership disruption or tighter restrictions requiring earnings reassessment,\" BofA research analyst Vivek Arya said in the note.\n\nZacks' Chief Equity Strategist John Blank said the selloff reflected two concerns: that the U.S. might impose further restrictions in the wake of the affair and that further problems might arise as the news develops. \"What else has Jensen done?\" he said.", "source": "CNBC World Economy", "pub_date_str": "11 Nov 2026, 08:05 PM IST", "pub_date_relative": "54m ago"}, {"title": "Baird downgrades Nvidia on China curbs, AI demand worries", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Baird downgrades Nvidia on China curbs, AI demand worries Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Baird downgrades Nvidia on China curbs, AI demand worries SECTIONS Baird downgrades Nvidia on China curbs, AI demand worries Reuters Last Updated: Nov 11, 2026, 08:04:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Baird downgraded Nvidia's stock and cut its price target significantly due to various market risks. Concerns over US restrictions on chip sales to China have emerged, affecting Nvidia's revenue outlook. Demand for Nvidia's chips is showing signs of softening amid supply constraints and market uncertainties. Additionally, multiple brokerages have removed Nvidia from their top picks due to recent stock declines.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "11 Nov 2026, 08:04 PM IST", "pub_date_relative": "55m ago"}, {"title": "Oil Rebounds After Two-Day Drop on U.S.-Iran Conflict Uncertainty - WSJ", "full_content": "Oil Rebounds After Two-Day Drop on U.S.-Iran Conflict Uncertainty WSJ Oil rises from two-month low as Hormuz shipping attacks offset Iran truce hopes CNBC COMMENTARY: Trump\u2019s Iran war pause is as costly as new strikes Reuters Oil Prices Rebound as Middle East Supply Risks Persist WSJ Dow Jones Top Energy Headlines at 4 AM ET: Oil Prices Rebound as Middle East Supply Risks Persist | KKR, ... Moomoo", "source": "Google News Business", "pub_date_str": "11 Nov 2026, 07:58 PM IST", "pub_date_relative": "1h ago"}, {"title": "Why Nvidia Stock Is Rising Despite Wall Street\u2019s First Call for Jensen Huang to Step Down - Barron's", "full_content": "Why Nvidia Stock Is Rising Despite Wall Street\u2019s First Call for Jensen Huang to Step Down Barron's Jim Cramer says Nvidia investors need to prepare for a future without Jensen Huang CNBC Nvidia stock gets its first boost of the Jensen Huang scandal era. What's driving shares higher today? Fast Company Michael Burry calls Nvidia 'a heck of a trade' while betting big on MercadoLibre (NVDA:NASDAQ) Seeking Alpha Is Nvidia Still Cheap? Real Investment Advice", "source": "Google News Business", "pub_date_str": "11 Nov 2026, 07:56 PM IST", "pub_date_relative": "1h ago"}, {"title": "Fed's Goolsbee calls inflation report 'borderline disturbing' as central bank weighs more hikes", "full_content": "Chicago Federal Reserve President Austan Goolsbee called the latest inflation data \"borderline disturbing.\"\n\n\"It's another distressing report \u2014 borderline disturbing,\" Goolsbee said in an interview with the PBS NewsHour Tuesday.\n\n\"We've got a real inflation issue on our hands that has been developing,\" Goolsbee said. \"We're going to have to deal with that.\"\n\nThe consumer price index rose 0.4% on a seasonally adjusted basis in October, according to the Bureau of Labor Statistics' Tuesday morning release. That was higher than economists had predicted, and the third straight month of outsized price increases.\n\nGoolsbee said he had not seen drivers of prices like tariffs fade over time like he had hoped. He also said continuously high inflation on services concerned him.\n\nAnd the Chicago Fed chief said lofty prices are a top issue for many people he meets.\n\n\"It's on everyone's mind,\" Goolsbee said. \"It's on business mind. It's on nonprofits' minds. It's on ordinary consumers' mind.\"\n\nTuesday's inflation report landed at a critical juncture for the central bankers at the Federal Reserve as they considers their next interest-rate move \u2014 and the moves they may have to make in the months ahead if the numbers continue to come in hot.", "source": "CNBC Finance", "pub_date_str": "11 Nov 2026, 07:54 PM IST", "pub_date_relative": "1h ago"}, {"title": "My friend hates her job but shuts down when I give her advice. How can I help her?", "full_content": "It\u2019s counterintuitive, but the worst thing you could do is give your friend advice, says one career coach.", "source": "MarketWatch Top Stories", "pub_date_str": "11 Nov 2026, 07:54 PM IST", "pub_date_relative": "1h ago"}, {"title": "Small-cap fund inflows cool in October while large-cap funds gain favour. Is the investor mood changing?", "full_content": "Equity mutual fund inflows fell about 14% month-on-month to \u20b9 32,994 crore in October, compared with \u20b9 38,307 crore in the previous month, as investments in small and mid-cap funds eased from record highs.\n\nSmall-cap fund inflows declined 29% to nearly \u20b9 6,408 crore, while mid-cap fund inflows fell 38% to \u20b9 4,893 crore, according to data released by the Association of Mutual Funds in India (AMFI).\n\nNet inflow refers to the money a particular mutual fund category receives after subtracting repurchases and redemptions from funds mobilised.\n\nHowever, the trend changed for large-cap funds , which recorded a 20% increase in inflows to \u20b9 1,032 crore in October, compared with \u20b9 859 crore last month.\n\nThis marks the second consecutive monthly rise in investments in large-cap funds, suggesting a correction in valuations has renewed retail investor interest.\n\n\u201cWithin equities, the continued improvement in large-cap inflows is encouraging, particularly as valuations have become relatively attractive, suggesting investors are increasingly looking to balance their exposure across market capitalisations,\u201d Saugata Chatterjee, President and Deputy chief executive at Nippon India Mutual Fund, said in a statement.\n\nThe difference in market performance during October may also explain the shift. The benchmark Nifty 50 and BSE Sensex gained 1.9% and 2.7%, respectively, while small-caps and mid-caps fell 4.1% and 3.4%.\n\nMarket sentiment has further improved in November, with benchmark indices rising around 10% so far this month, putting them on track for their strongest monthly gains since November 2020, Reuters reported.", "source": "LiveMint Money", "pub_date_str": "11 Nov 2026, 07:47 PM IST", "pub_date_relative": "1h ago"}, {"title": "EasyJet shareholders approve \u00a35.7 billion Apollo takeover", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a EasyJet shareholders approve \u00a35.7 billion Apollo takeover Powered By The Economic Times daily newspaper is available online now. Read Today's Paper EasyJet shareholders approve \u00a35.7 billion Apollo takeover SECTIONS EasyJet shareholders approve \u00a35.7 billion Apollo takeover By Reuters Last Updated: Nov 11, 2026, 07:46:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis EasyJet's shareholders voted to approve a \u00a35.7 billion takeover by Apollo on Wednesday. This decision marks a major step towards removing EasyJet from the London stock market. With 97.07% of scheme shares in favor, the airline is targeting a deal completion by the first quarter of next year. Nonetheless, the takeover faces regulatory scrutiny in the EU regarding airline ownership rules.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "11 Nov 2026, 07:46 PM IST", "pub_date_relative": "1h ago"}, {"title": "Nifty 50 target: Index in sweet spot? 28,000 soon? HSBC, Citi and Bernstein raise targets after sharp 13.5% recovery", "full_content": "The Indian stock market continued its bullish run, with both frontline indices surging nearly 1% in Wednesday's trade, hitting an 8-month high and extending last week's phenomenal rally.\n\nThe Nifty 50 has now recovered around 13.5% from its war-induced lows, while its year-to-date losses have narrowed to just 3.35% after previously slipping into double-digit declines.\n\nAlthough the Indian market's performance was relatively subdued compared with its Asian peers, most of which were trading with stronger gains, domestic equities continued to build on their recent recovery, supported by improving investor confidence and renewed buying interest.\n\nThe recovery has largely been supported by the return of overseas investors, as India becomes an increasingly attractive investment destination following the global AI-led sell-off.\n\nAdditionally, the decline in crude oil prices has helped ease inflationary pressures and improved the outlook for India's macroeconomic fundamentals. FPIs have pumped \u20b9 53,739 crore into domestic stocks in November so far, according to NSDL data.\n\nIndia\u2019s relatively limited exposure to the AI trade had made its stocks among Asia\u2019s worst performers. However, as the once high-flying trade begins to unravel, that weakness has quickly turned into a blessing.\n\nThe recent losses have also made Indian stocks more attractive, while better-than-expected corporate performance has helped support valuation multiples. This has given investors an opportunity to return to Dalal Street after largely overlooking the market for nearly two years in pursuit of AI-linked stocks.\n\nThe fallout in AI-linked stocks and the decline in crude oil prices have also caught the attention of global brokerages, prompting them to raise their targets for the Nifty 50.", "source": "LiveMint Markets", "pub_date_str": "11 Nov 2026, 07:45 PM IST", "pub_date_relative": "1h ago"}, {"title": "Zelenskyy warns Ukraine is 'not real estate' as experts say a Russia peace deal remains elusive", "full_content": "Ukrainian President Volodymyr Zelenskyy warned that his country \"was not real estate,\" as a second and final day of U.S.-brokered peace talks wrapped up.\n\nSpeaking to reporters in Denmark late Tuesday, Zelenskyy said he was \"happy\" with what he was hearing from the peace talks in Abu Dhabi between Russian and Ukrainian representatives, but said he had been clear with U.S. envoys Steve Witkoff and Jared Kushner that \"this is a country of our nation, it is not real estate.\"\n\nHis comments come amid discussions on the future borders of Ukraine and post-war security guarantees, issues where the countries remain far apart.\n\n\"Everybody is ready for dialog. First, stop the war in Ukraine. Second, security guarantees for Ukraine. Third, maybe some dialog about these topics of security,\" Zelenskyy said. \"This sequence is very, very important.\"\n\nIt comes as the first trilateral peace talks between Russia, Ukraine and the U.S. since February concluded on Wednesday.\n\nSpeaking post-meeting, Kushner called the talks \"productive\" and said the parties had also discussed the difficult issue of territorial boundaries. The Ukrainian negotiator meanwhile said momentum was good and a solution could be reached before the end of the year.\n\nRussia chief negotiator and Putin aide Vladimir Medinsky said the parties on Wednesday had reached an agreement on a large-scale prisoner exchange, and that details would be announced soon.\n\nAnother round of exchanges of prisoners of war would be welcomed, Mykola Bielieskov, senior analyst at Ukrainian NGO Come Back Alive, told CNBC Tuesday. \"Otherwise there is no room for compromise,\" he said, adding, \"I don't have any expectations of major progress towards settlement.\"", "source": "CNBC Top News", "pub_date_str": "11 Nov 2026, 07:43 PM IST", "pub_date_relative": "1h ago"}, {"title": "India to switch bonds worth 250 billion rupees next week", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Bonds \u203a India to switch bonds worth 250 billion rupees next week Powered By The Economic Times daily newspaper is available online now. Read Today's Paper India to switch bonds worth 250 billion rupees next week SECTIONS India to switch bonds worth 250 billion rupees next week Reuters Last Updated: Nov 11, 2026, 07:43:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis On November 16, the Reserve Bank of India will initiate a significant switch auction worth 250 billion rupees. This maneuver involves replacing six bonds that are set to mature between 2027 and 2029 with longer-term securities extending to maturity in 2062. By doing so, the government seeks to optimize its debt repayment schedule. This follows a similar strategy of bond buyback and issuance enacted in October.\n\nDebt mutual funds staged a sharp turnaround in October, recording net inflows of Rs 1.13 lakh crore after heavy outflows in September. Liquid and overnight funds accounted for the bulk of the inflows, reflecting a seasonal reversal of quarter-end withdrawals. However, the recovery remained uneven, with several duration-oriented categories continuing to witness outflows.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "11 Nov 2026, 07:43 PM IST", "pub_date_relative": "1h ago"}, {"title": "Jim Cramer's top 10 things to watch in the stock market Wednesday", "full_content": "CoreWeave lifts the AI trade, and my advice to Nvidia.", "source": "CNBC Top News", "pub_date_str": "11 Nov 2026, 07:43 PM IST", "pub_date_relative": "1h ago"}, {"title": "Amul Milk Price Hike From November 12: What Gold, Taaza And Other Variants Will Cost Now", "full_content": "The dairy cooperative has increased prices by Rs 2-4 per litre across its fresh pouch milk range, citing higher input and processing costs.", "source": "NDTV Profit", "pub_date_str": "11 Nov 2026, 07:43 PM IST", "pub_date_relative": "1h ago"}, {"title": "At 3.6% Of US GDP, The AI Boom Is Bigger Than Dotcom Bubble. SBI MF Explains", "full_content": "AI expenditure marks one of the largest capital spending cycles in history, with average annual capex estimated at around 3.6% of US GDP over 202532, more than the 1.1% during the 2000 dotcom cycle and 2.2% during the 19th-century railroad boom.", "source": "NDTV Profit", "pub_date_str": "11 Nov 2026, 07:42 PM IST", "pub_date_relative": "1h ago"}, {"title": "Forget happy hour. \u2018Money parties\u2019 are having a moment.", "full_content": "There\u2019s evidence showing that talking about finances with your friends can help you save money.", "source": "MarketWatch Top Stories", "pub_date_str": "11 Nov 2026, 07:42 PM IST", "pub_date_relative": "1h ago"}, {"title": "Your CIBIL Score Now Moves Almost Weekly: Why Paying Monthly Bills May Not Be Helpful?", "full_content": "Credit reporting in India has become considerably more frequent following a regulatory change introduced by the RBI in July 2026.", "source": "NDTV Profit", "pub_date_str": "11 Nov 2026, 07:39 PM IST", "pub_date_relative": "1h ago"}, {"title": "'Best Is Still Ahead': Gaurav Munjal Hands Over Unacademy CEO Role", "full_content": "Unacademy founder Gaurav Munjal is transitioning from CEO to Executive Chairman, with Akhilendra Kumar taking charge as CEO. Munjal will remain closely involved in daily operations and support the upGrad IPO.", "source": "NDTV Profit", "pub_date_str": "11 Nov 2026, 07:37 PM IST", "pub_date_relative": "1h ago"}, {"title": "Veterans Day 2026 brings free meals at popular restaurants \u2014 and some deals don't end Nov. 11 - Fox News", "full_content": "Veterans Day 2026 brings free meals at popular restaurants \u2014 and some deals don't end Nov. 11 Fox News Veterans Day 2026 Free Meals, Freebies and Deals The American Legion Veterans Day 2026: free meals, discounts, and deals at top restaurants New York Post Groceries, gas, a \u2018Grand Slam\u2019: here are your Veterans Day discounts Military Times Veterans Day: Here's a list of deals and what's open and closed KCCI", "source": "Google News Business", "pub_date_str": "11 Nov 2026, 07:28 PM IST", "pub_date_relative": "1h ago"}, {"title": "Here\u2019s how Bernie Sanders wants to keep Social Security solvent \u2018for generations\u2019", "full_content": "The Vermont senator aims to eliminate the taxable maximum, making the wealthy pay more in taxes", "source": "MarketWatch Top Stories", "pub_date_str": "11 Nov 2026, 07:25 PM IST", "pub_date_relative": "1h ago"}, {"title": "Mutual Fund Expense Ratio: How Much Of Your Investment Is Lost To Fund Management Charges Over 20 Years?", "full_content": "Fund management charges have a longer-lasting impact than simply lowering an investor's returns in a given year.", "source": "NDTV Profit", "pub_date_str": "11 Nov 2026, 07:24 PM IST", "pub_date_relative": "1h ago"}, {"title": "Corporate America is making a trillion-dollar mistake about retirement", "full_content": "The market is dramatically underpricing the economic impact of Americans age 50 and older.", "source": "MarketWatch Top Stories", "pub_date_str": "11 Nov 2026, 07:22 PM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "Stocks making the biggest moves Wednesday: CoreWeave, Nvidia, NextNav & more", "full_content": "CoreWeave surged 20% Wednesday, as investors breathed a sigh of relief after the struggling neocloud reported better-than-expected third quarter results.\n\nNvidia also rose as the chipmaker tries to recover from steep back-to-back losses.\n\nFollow below as CNBC covers the biggest stock market moves of the day.\n\nCoreWeave shares jumped 20% Wednesday after the neocloud posted quarterly earnings that beat estimates and raised its guidance for the year.\n\n\"Demand for the infrastructure is and remains overwhelming.\" CEO Michael Intrator told CNBC's \"Squawk on the Street\" Wednesday.\n\n\"I think I said that we are 10x oversubscribed to the existing capacity that we have left in 2027, and we are multiples ... oversubscribed on the capacity we have out in 2028,\" he said.\n\nTalen Energy stock advanced nearly 5% in the premarket trading Wednesday.\n\nIt comes after the power producer and energy infrastructure company announced a seven-year agreement to sell 750 megawatts of capacity to an investment-grade counterparty.", "source": "CNBC Top News", "pub_date_str": "11 Nov 2026, 08:59 PM IST", "pub_date_relative": "1m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "CoreWeave CEO Intrator tells CNBC he has canceled his planned share sale program", "full_content": "CoreWeave CEO Michael Intrator told CNBC on Wednesday that he has canceled his 10b5 stock sale plan after the company reported strong revenue growth and beat Q3 expectations.\n\n\"Until there is a material change in in, in our equity pricing, my 10b5 has been sidelined,\" he told CNBC's \"Squawk on the Street.\"\n\nHe said any further selling would be \"just normal tax stuff.\"\n\nUnder Intrator's 10b5-1 plan announced in November 2025, the CEO has sold 8.26 million shares at an average price of $96.14 per share for a total of $794.2 million.\n\nIntrator and his co-founders have faced criticism for their stock sales as the company's stock has struggled, with shares down 18% so far in 2026 despite a 20% post-earnings rally on Wednesday.\n\nThe company has faced further pressure from the sell-off in the aftermath of last week's sweeping electoral victory for Democrats, but Intrator told investors on the earnings call that the company isn't worried about the political changes on the horizon.\n\n\"We do not anticipate any impact from the seismic regulatory shift that's occurred,\" Intrator said on his company's earnings call late Tuesday, in response to a question about new pressures after the election. \"We believe that what has occurred is a statement around how you build. We want to build responsibly.\"\n\nIntrator's comments came after CoreWeave reported 168% year-over-year revenue growth, beating estimates, and lifted its forecast for 2026. The stock rallied in extended trading, as the report offered some relief to investors, who have pushed the shares down about 27% over the past month.", "source": "CNBC World Economy", "pub_date_str": "11 Nov 2026, 08:58 PM IST", "pub_date_relative": "1m ago", "cfa_topics": ["Financial Statement Analysis", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Nasdaq surges as CoreWeave leads tech rebound: Live updates", "full_content": "Stocks were mostly higher Wednesday, boosted by sharp gains in CoreWeave and a rebound in Nvidia following back-to-back losing sessions for the chipmaker.\n\nThe Nasdaq Composite jumped 1.2%, while the S&P 500 advanced 0.8%. The Dow Jones Industrial Average fell 152 points, or 0.2%\n\nNeocloud stock CoreWeave rallied 20% after the company reported third-quarter revenue that beat analyst expectations. CoreWeave also lifted its operating income and revenue guidance for 2026.\n\nNvidia, meanwhile, climbed 2.7%, after the stock dropped nearly 10% to begin the week following CEO Jensen Huang confirming he had an affair with an alleged Chinese spy. The pullback in Nvidia weighed on the broader market Tuesday, with the major averages ending the session lower.\n\n\"The sentiment bump coming from CoreWeave results and Anthropic IPO demand is helping the broader ecosystem,\" Ross Mayfield, an Investment Strategist for Baird Private Wealth Management, told CNBC. \"Markets are continuing to unwind last week's overshoot to the downside with cleaner positioning now a tailwind and an attractive near-term valuation/earnings story in a lot of the AI stocks.\"\n\nEquities also fell on Tuesday after the latest U.S. inflation data solidified expectations for a December Federal Reserve rate hike. The consumer price index increased by 0.4% month over month in October , topping expectations.\n\nExpectations for a quarter-point rate increase next month rose to about 90% following the release, per the CME Group's FedWatch tool.\n\n\"Despite some technical uncertainty, higher than desired levels of inflation should keep the Fed in a stance of dissatisfaction with the degree of progress on inflation remaining lackluster, so hiking the Fed Funds policy rate in December is our and the market's base case,\" wrote Rick Rieder, CIO of global fixed income at BlackRock. \"The question now is more of one of the extent of the hike.\"", "source": "CNBC Top News", "pub_date_str": "11 Nov 2026, 08:58 PM IST", "pub_date_relative": "2m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "US tech stocks gain as AI trade revives", "full_content": "Nasdaq erases bulk of last week\u2019s losses as better-than-expected CoreWeave results and prospect of higher Anthropic IPO valuation boost sentiment", "source": "FT Markets", "pub_date_str": "11 Nov 2026, 08:55 PM IST", "pub_date_relative": "4m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Market angst is driving investors into low-volatility stocks as AI trade stumbles", "full_content": "Anxiety in the U.S. stock market has surged amid a sharp selloff in artificial intelligence names and stubbornly high bond yields.", "source": "MarketWatch Top Stories", "pub_date_str": "11 Nov 2026, 08:45 PM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Equity Investments", "Fixed Income"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Measles is surging in the U.S. \u2014 and outbreaks can cost millions", "full_content": "Measles outbreaks aren't just a public health threat. They can also be a financial burden on the U.S. \u2014 and the cost could only deepen as the once-eliminated disease spreads more widely.\n\nThe U.S. is expected to lose its official measles elimination status following a review by the Pan American Health Organization this week, after cases ratcheted to recent highs this year.\n\nMore than 5,100 measles cases have been reported nationwide in 2026 as of early November, marking the country's worst outbreak in more than three decades. Eight deaths associated with the disease have been confirmed by states so far in 2026: six in Pennsylvania , one in New York and one in Wisconsin .\n\nBased on this year's case count, a new tool developed by researchers at Johns Hopkins University estimates an economic cost of nearly $83 million for the outbreaks. That total includes $56 million in public health response costs, almost $25 million in lost productivity and more than $1.8 million in direct medical expenses.\n\nThe tool also estimates that 2025 measles outbreaks in the U.S. \u2014 which involved 2,289 confirmed cases nationwide \u2013 carried an economic cost of more than $37 million.\n\nThe costs extend beyond treating people who become sick, accounting for the resources health departments spend investigating and containing outbreaks, as well as wages lost when people have to miss work. The tool uses more recent, state-specific cost and financing data than an initial study by the researchers, which relied on historical outbreak costs.\n\nThe estimates from the tool are not a definitive accounting of what the outbreaks actually cost. But it illustrates the hefty bill tied to the spread of a disease that can be prevented through vaccination, and the potential economic consequences of falling childhood immunization rates. CNBC previously reported on how the return of measles in the U.S.", "source": "CNBC Top News", "pub_date_str": "11 Nov 2026, 08:44 PM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Lowe\u2019s stock may move 4.7% on Nov. 18 earnings report", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Nov 2026, 08:43 PM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "CoreWeave soars 20% as CEO reaffirms AI compute demand after strong Q3 report", "full_content": "CoreWeave shares jumped 20% Wednesday after the neocloud posted quarterly earnings that beat estimates and raised its guidance for the year.\n\n\"Demand for the infrastructure is and remains overwhelming.\" CEO Michael Intrator told CNBC's \"Squawk on the Street\" Wednesday.\n\n\"I think I said that we are 10x oversubscribed to the existing capacity that we have left in 2027, and we are multiples ... oversubscribed on the capacity we have out in 2028,\" he said.\n\nNeoclouds such as CoreWeave, Nebius and IREN have come under scrutiny this month as investors assessed the sustainability of the AI trade. CoreWeave, in particular, sparked alarm when spreads on its CDS widened past 11% , generally viewed as a distress level, as investors have to pay up for protection against default.\n\nRevenue jumped 168% to $3.7 billion in the third quarter, the company said in a Tuesday statement .\n\nThe three months to Sept. 30 marked a \"breakout quarter\" for CoreWeave, CEO Michael Intrator said, adding that growth was supported by multiple sources of funding, including financing backed by customer contracts and around $9 billion in customer prepayments and deposits.\n\nOther neclouds also rose on CoreWeave's strong results, with Nebius up 12%, Applied Digital up 6% and Iren up 6% after the open.\n\nCoreWeave shares this year. CoreWeave expects $1.275 billion to $1.375 billion in adjusted operating income on $13 billion to $13.3 billion in revenue. Analysts surveyed by Visible Alpha were looking for $1.07 billion in adjusted operating income, and analysts polled by LSEG had expected $12.86 billion in 2026 revenue.", "source": "CNBC World Economy", "pub_date_str": "11 Nov 2026, 08:43 PM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Derivatives", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "RUM earnings missed by $0.09, revenue topped estimates", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Nov 2026, 08:42 PM IST", "pub_date_relative": "17m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "S&P 500, Nasdaq rise as CoreWeave results ease AI spending worries", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Nov 2026, 08:42 PM IST", "pub_date_relative": "17m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Golar LNG shares may move 5.1% on Nov. 18 earnings release", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Nov 2026, 08:42 PM IST", "pub_date_relative": "18m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "MRF share price target after Q2: Tyre maker faces margin pressure, but Citi sees 30% upside; sets \u20b91,65,238 target", "full_content": "A Ksheerasagar Published 11 Nov 2026, 08:35 PM IST Prefer Livemint on Google Global brokerage firm Citi has maintained its bullish outlook on MRF even as the company's September-quarter performance was hit by rising raw material prices. The brokerage has retained its 'Outperform' rating on the stock with a target price of \u20b9 1,65,238, indicating an upside potential of 30% from the stock's Wednesday closing price of \u20b9 1,27,125.\n\nEarlier this week, the tyre manufacturer reported an 18% year-on-year (YoY) increase in revenue to \u20b9 85.2 billion. However, higher-than-expected raw material inflation led to a 430-basis-point (bp) YoY contraction in its EBITDA margin to 10.7%. The margin pressure also resulted in a 28% YoY decline in profit after tax (PAT) to \u20b9 3.7 billion.\n\nThe brokerage said the margin pressure would have been even higher if the company had not undertaken price increases of 13-15% in the replacement segment during the first half of FY27. It also noted that cost-reduction initiatives had helped partially cushion the impact of higher input prices, CNBC-TV18 reported. Mint could not independently verify the report.\n\nCiti pointed out that the benefit of price increases in the original equipment manufacturer (OEM) segment typically flows through with a one-quarter lag. As a result, the full impact of the price hikes undertaken in Q2 FY27 is expected to be reflected in the current quarter.\n\nCiti expects costs to remain elevated in Q3 FY27, indicating that a recovery in margins could take time.", "source": "LiveMint Markets", "pub_date_str": "11 Nov 2026, 08:35 PM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "JetBlue's CEO has pushed back on creditor fears and is betting on premium to return to profitability", "full_content": "JetBlue Airways executives have sought to calm investors after shares in the airline hit a record low following a report that bondholders had contracted restructuring advisors. \"We have no intention, no plans to file for bankruptcy. We are not engaged with any restructuring company,\" CEO Joanna Geraghty told CNBC in an interview last month.\n\nShares have bounced back and are up 40% so far this month as of Tuesday's close.\n\nGeraghty has said the company is focused on its turnaround plan. A major part of that strategy is the airline betting on the premium travel boom to make it profitable again. It will start the next chapter of the effort on Wednesday, when it unveils its new domestic first-class seats at its home hub at John F. Kennedy International Airport.\n\nTune in at 10:50 a.m. ET as JetBlue CEO Joanna Geraghty joins CNBC TV to discuss the company's target of getting back to profitability. Watch in real time on CNBC+ or the CNBC Pro stream.\n\nJetBlue announced it would offer a domestic first class \u2014 BlueFirst \u2014 in December 2024 and plans to start flying aircraft with the new seats and full on-board product next month. Retrofits will continue during 2027, Geraghty told CNBC late last month.\n\nBlueFirst is different from the lie-flat, longer-haul business class, Mint, that JetBlue offers on transcontinental and Europe routes. The carrier plans to offer BlueFirst on flights on popular leisure routes throughout Florida and the Caribbean.\n\nThe New York airline last posted a profit in 2019, before the pandemic. JetBlue is betting that resilient travel demand, especially for roomier seats, will help fuel its turnaround plan, which aims to get the carrier to an operating profit next year and $1 in adjusted earnings per share in 2028.\n\nThe company reported it ended the third quarter with $2.2 billion in liquidity and that its unencumbered asset base is now $7 billion, including $2.8 billion in aircraft and engines.", "source": "CNBC Top News", "pub_date_str": "11 Nov 2026, 08:30 PM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "US stocks: US market opens higher as CoreWeave lifts AI trade", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a US stocks: S&P 500, Nasdaq rise as CoreWeave results ease AI spending concerns Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US stocks: S&P 500, Nasdaq rise as CoreWeave results ease AI spending concerns SECTIONS US stocks: S&P 500, Nasdaq rise as CoreWeave results ease AI spending concerns Reuters Last Updated: Nov 11, 2026, 08:57:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The S&P 500 and Nasdaq indices showed positive growth as CoreWeave posted impressive financial results, calming fears regarding AI expenditure. Following its projection of reaching profitability by 2028, CoreWeave's stock jumped 12.7%, boosting investor confidence about ongoing demand. AI infrastructure stocks mirrored this positive trend. Despite some volatility linked to interest rate fluctuations and inflation, most stocks rose in value, with oil prices recovering after Iran's comments.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "11 Nov 2026, 08:26 PM IST", "pub_date_relative": "33m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Micron Is Rebounding but Goldman Prefers These Memory Stocks - Barron's", "full_content": "Micron Is Rebounding but Goldman Prefers These Memory Stocks Barron's Micron stock is a screaming buy at current valuation levels: Goldman Sachs Yahoo Finance Micron Is Down 40% Since Oct. 7. History Suggests a $5,000 Investment Today Could Be Worth This Much by 2030. The Motley Fool Only One Analyst Says Sell Micron, and It\u2019s a Strong Sell. Should Investors Listen? 24/7 Wall St. Micron: The $300 Nightmare And The $1,500 Opportunity (NASDAQ:MU) Seeking Alpha", "source": "Google News Business", "pub_date_str": "11 Nov 2026, 08:22 PM IST", "pub_date_relative": "38m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "India's net direct tax collections rise 11.8% to Rs 14.42 lakh crore from April 1 to Nov 10", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Finance \u203a India's net direct tax collections rise 11.8% to Rs 14.42 lakh crore from April 1 to Nov 10 The Economic Times daily newspaper is available online now. Read Today's Paper India's net direct tax collections rise 11.8% to Rs 14.42 lakh crore from April 1 to Nov 10 SECTIONS India's net direct tax collections rise 11.8% to Rs 14.42 lakh crore from April 1 to Nov 10 ET Online Last Updated: Nov 11, 2026, 08:39:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India's net direct tax collections recorded an increase of 11.76% to reach Rs 14.42 lakh crore. Gross direct tax collections rose by 14.02%, boosting receipts to Rs 17.50 lakh crore. Corporate tax collections grew by about 17.84%, amounting to Rs 6.32 lakh crore. Non-corporate tax collections saw a rise of 5.30%, increasing to Rs 7.56 lakh crore. Direct tax refunds increased significantly, reaching Rs 3.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\nBusiness of Odd Things: The farm that needs no land, freshwater, or fertiliser\n\nKYC and KYB: Inside Pidilite, the company that turned Fevicol into a word for a strong bond \u2013 Part 1 of 3\n\nSeoul halts trading, Nifty has its best week since 2021: Money leaving the AI trade \u2013 will it land in India?\n\nJunk bonds are cracking at the bottom. Will the noise get loud enough to make \u2018junk bond\u2019 a household term again?\n\nPNG connections rise half a million, but how many use piped gas for cooking?\n\nSome elections matter more than you know: No crop changed in the fields, yet sugar, coffee and soya got cheaper in a day", "source": "Economic Times Economy", "pub_date_str": "11 Nov 2026, 08:20 PM IST", "pub_date_relative": "40m ago", "cfa_topics": ["Equity Investments", "Fixed Income", "Ethical & Professional Standards"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "CFTC investigates if Kalshi improperly self-certified event contracts", "full_content": "The Commodity Futures Trading Commission is investigating if prediction market platform Kalshi failed to properly inform the agency of proposed event contracts, Kalshi confirmed to CNBC.\n\nKalshi called it a minor issue in how the contracts were filed and said it is working with the CFTC to address the matter. The CFTC flagged weather-related contracts, Kalshi said. The leading prediction market platform didn't say when the agency began investigating Kalshi. The CFTC didn't immediately respond to a request for comment.\n\nPolitico first reported on the probe on Tuesday, noting charges could happen soon, based on the CFTC's private notification to Kalshi. The platform declined to comment on any possible charges.\n\nPrediction market platforms are allowed to self-certify event contracts without the federal agency's prior approval, as long as they comply with the Commodity Exchange Act. The self-regulation allows for faster introduction of new contracts.\n\n\"The notice is about a procedural error involving the submission of a handful of contracts, many of which weren't live,\" said Elisabeth Diana, head of communications at Kalshi. \"We are already addressing the issue.\"\n\nThe move is the latest by the CFTC as it seeks to rein in prediction markets, which face growing scrutiny in Washington D.C. from regulators and members of Congress .\n\nIn August, the CFTC ordered Kalshi to take down sports-related \" mention markets \" \u2014 where speculators can trade on what individuals will say in a broadcast or speech \u2014 while it looked into the event contract type.\n\nThe agency is also conducting a broad probe into competitor Polymarket , which includes reviewing if the company violated a 2022 settlement with the CFTC to prohibit U.S. traders from accessing its international trading platform. Polymarket's domestic exchange operates separately from the global platform.", "source": "CNBC Top News", "pub_date_str": "11 Nov 2026, 08:19 PM IST", "pub_date_relative": "41m ago", "cfa_topics": ["Derivatives", "Alternative Investments"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Stock Market Today: Nasdaq Jumps at Open After CoreWeave Earnings \u2014 Live Updates - WSJ", "full_content": "Stock Market Today: Nasdaq Jumps at Open After CoreWeave Earnings \u2014 Live Updates WSJ Nasdaq surges as CoreWeave leads tech rebound: Live updates CNBC Rebounding AI stocks lift Wall Street Pittsburgh Post-Gazette US Equity Futures Rise as AI Enthusiasm Counters Hot Inflation Bloomberg.com Nvidia stock rebounds, chip stocks surge as CoreWeave earnings boost AI trade Yahoo Finance", "source": "Google News Business", "pub_date_str": "11 Nov 2026, 08:11 PM IST", "pub_date_relative": "49m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Capri Holdings names longtime Estee Lauder executive Justin Boxford new CEO", "full_content": "Michael Kors parent Capri on \u200bWednesday named Justin Boxford to replace \u200ccompany veteran John Idol as CEO, effective January 4. Boxford joins Capri after nearly 23 years at Estee Lauder , \u200bwhere he held various positions, including senior vice \u200bpresident for Estee Lauder and Tom Ford \u2060Beauty brands outside of North America. Boxford \u200bmost recently served as the global president \u200bof Estee Lauder's luxury beauty brands. The leadership change comes as Capri works to revive demand at Michael \u200bKors by revamping stores and investing in \u200bnew products, as inflation-weary consumers grow more selective about \u200cdiscretionary \u2060spending. The Jimmy Choo owner lifted its annual revenue and profit forecasts last month as it expects a return of sales growth, helped by new collections and increased \u200bmarketing. Idol, who has \u200bled the \u2060company since December 2003, oversaw its acquisition of Jimmy Choo \u200bnearly a decade ago and the purchase and \u200beventual $1.4 \u2060billion sale of Versace last year. He was also Capri's CEO during its failed $8.5 billion merger attempt \u2060with \u200bCoach parent Tapestry in \u200b2024. Shares of Capri fell marginally in premarket trading.", "source": "CNBC Top News", "pub_date_str": "11 Nov 2026, 08:09 PM IST", "pub_date_relative": "50m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Nvidia shares rebound as Jensen Huang faces scrutiny ahead of earnings", "full_content": "Nvidia 's stock rose 3% on Wednesday, after falling for two days amid the scandal that has rocked the world's most valuable tech company.\n\nShares closed down 5.47% on Tuesday as more details were revealed about the impact of CEO Jensen Huang 's affair with an alleged Chinese spy . They fell 4.3% Monday.\n\nOn Tuesday, Nvidia announced it had hired law firm Wachtell, Lipton, Rosen & Katz to investigate whether company secrets or national security were compromised.\n\nHuang tried to project \"business as usual\" as he returned to the office on Monday, people familiar with the matter told CNBC. The CEO was also in the office on Tuesday, conducting meetings, ahead of the company's quarterly earnings on Nov. 17.\n\nInvestors are assessing whether the matter will have damaging spillover effects on the business.\n\nNvidia shares over the past five days. In a Tuesday note, Bank of America said it saw three scenarios with differing investment outcomes. In one scenario, the impact is contained with leadership continuity, and in another, prolonged uncertainty pressures valuation before earnings.\n\nIn the final scenario, the impact is escalated, with \"adverse findings, leadership disruption or tighter restrictions requiring earnings reassessment,\" BofA research analyst Vivek Arya said in the note.\n\nZacks' Chief Equity Strategist John Blank said the selloff reflected two concerns: that the U.S. might impose further restrictions in the wake of the affair and that
