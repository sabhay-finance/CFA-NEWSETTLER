remium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "18 Nov 2026, 12:54 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Derivatives"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Luxury for less: do hotel memberships really pay off?", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nDo you enjoy luxury hotel stays, elaborate buffets, room service and access to premium gyms and spas? You may have come across hotel membership programmes that promise to make these experiences more affordable. For an annual fee, they offer complimentary stays, discounts on rooms, dining and spa services, upgrades and other privileges.\n\nOn paper, the proposition sounds tempting. But do these memberships deliver value for money? We spoke to people who have used hotel memberships to understand their experiences, the limitations they faced and whether they would recommend buying one.\n\nHotel memberships differ in geographical reach and benefits. We looked at some of the annual membership offers to understand the mix of benefits and discounts available.\n\nThe Leela Palaces , Hotels and Resorts and Radisson Hotels offer property-specific options. Taj Hotels and the Accor Group provide wider access across properties in India and overseas. ITC Hotels' Culinaire programme covers participating properties in India.\n\nITC's Culinaire Elite, priced at \u20b9 29,500 excluding GST, offers two complimentary-night vouchers, four buffet meal vouchers for two people each and two vouchers for 50% off eligible dining bills. Members also get 20% off regular dining, spa treatments and laundry. Its lower-priced options are Culinaire Select at \u20b9 19,000 and Culinaire Classic at \u20b9 8,500, with fewer complimentary benefits.\n\nTaj Epicure has two tiers: Preferred at \u20b9 25,000 plus GST and Privileged at \u20b9 50,000 plus GST. Both offer 25% off food and beverages at participating outlets.", "source": "LiveMint Money", "pub_date_str": "18 Nov 2026, 12:54 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Derivatives", "Ethical & Professional Standards"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Gold, Silver Prices Down To The Price Of iPhone 17 Pro, iPhone 18 Pro; Check Details", "full_content": "Gold is down 27.5% from its peak and silver has fallen 61% from its record high, putting bullion near iPhone Pro prices: iPhone 17 Pro costs Rs 1.28 lakh-1.75 lakh, while iPhone 18 Pro ranges from Rs 1.65 lakh to Rs 2.40 lakh.", "source": "NDTV Profit", "pub_date_str": "18 Nov 2026, 12:50 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Nvidia warns chip buyers of legal risks tied to China AI access, sources tell CNBC", "full_content": "Nvidia warned its customers that new legislation on Chinese companies remotely accessing its artificial-intelligence chips could expose it and them to U.S. \"legal action,\" sources told CNBC.\n\nThe chip giant is facing increasing scrutiny from U.S. lawmakers over Chinese companies' access to its advanced chips, which U.S. export controls restrict from going to China.\n\nNvidia messaged chip buyers in recent months to caution that the proposed Remote Access Security Act, or RASA, would give the U.S. government broader authority to control access to cloud services in the same way as physical hardware, potentially exposing both parties to legal risk, according to two people with direct knowledge of the matter. The people asked not to be named while discussing private communications.\n\nIt also said that, for now, it would not sell its chips to customers who rent more than 50% of the graphics processing units, or GPUs, to Chinese companies, the people said.\n\nSeparately, the Financial Times reported earlier this month that Nvidia verbally told data-center clients to direct at least 51% of their services to non-Chinese customers under future contracts.\n\nRegulators have had limited powers to control companies' access to those chips through cloud services hosted overseas.\n\nRASA passed the House of Representatives in January but has not yet passed the Senate. Remote access to the chips has provoked the ire of President Donald Trump 's administration, which has sought to keep the chips out of China to maintain the U.S. lead in the AI race.\n\nCNBC reported on Nov. 5 that Chinese lab Moonshot AI sought access to Nvidia chips through data centers in Europe. The Trump administration previously singled the company out, accusing it in July of accessing the chips through centers in East Asia.", "source": "CNBC World Economy", "pub_date_str": "18 Nov 2026, 12:46 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "How Ashish Kacholia, Radhakishan Damani, Madhusudan Kela and other ace investors reshuffled their portfolios in Q2", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News How Ashish Kacholia, Radhakishan Damani, Madhusudan Kela and other ace investors reshuffled their portfolios in Q2 Written by Eshita Gain , ETMarkets.com | Nov 18, 2026, 12:47:14 PM IST 1 / 8 Portfolio shuffle Some of India's most prominent individual investors in terms of their stock portfolio value, including Mukul Agrawal, Akash Bhanshali and Ashish Kacholia, emerged as the biggest portfolio gainers during the July-September quarter.\n\nHowever, the trend was not uniform across all ace investors. DMart founder Radhakishan Damani recorded the steepest decline in portfolio value among the prominent investors tracked, according to data from Prime Database.\n\nFor the study, only holdings in which these investors owned more than 1% equity in listed companies were considered. Here are the top three stocks held by these individual investors and the stocks in which they increased or decreased their holdings.\n\nMukul Agrawal, chairman and founder of Param Capital, holds stocks with a net worth of over Rs 7,474 crore. His portfolio gained 30% in the July-September quarter, making him the biggest gainer among his peers.\n\nHis top three stock holdings (as of September 30) are ESDS Software, Neuland Laboratories and Nuvama Wealth.\n\nCompanies in which he increased his shareholding include ESDS Software, Manipal Payment and Tega Industries, while he decreased his shareholding in Intellect Design, Vidhi Specialty and Raymond Lifestyle.\n\nAkash Bhanshali, an individual ace investor with stock holdings worth Rs 8,663 crore, saw a 15.5% increase in his portfolio during the July-September quarter, putting him second on the list of biggest gainers.\n\nHis top three stock holdings (as of September 30) include Gujarat Fluorochemicals, Laurus Labs and One97 Communications.", "source": "Economic Times Markets", "pub_date_str": "18 Nov 2026, 12:39 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Why Ashok Leyland\u2019s investors are wary despite robust demand", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nAshok Leyland\u2019s shares have declined around 6% this week even though its September quarter (Q2FY27) earnings were solid. Standalone revenue grew 39% year-on-year (y-o-y) to \u20b9 13,364 crore, while Ebitda rose 16% to \u20b9 1,350 crore. Perhaps, some profit-taking was overdue as the stock had outperformed over the past year, rising 10% versus a flat Nifty Auto index.\n\nIndustry-wide cost pressures also weighed on sentiment. Ebitda margin dipped y-o-y for the third consecutive quarter in Q2, falling 200 basis points to 10.1%. Raw-material costs jumped 47% y-o-y with a bulk of this rise coming sequentially. Operating leverage, a favourable product mix and price hikes helped keep Ebitda margins flat in Q2.\n\nThe management has already taken a 1-1.5% price hike in Q3, and indicated another increase in Q4. It has still retained the medium-term mid-teen Ebitda margin guidance.\n\nDemand has held up well through the price hikes, despite rising freight costs and interest rates. Fleet ageing and infrastructure spending have supported replacement demand, further buoyed by GST cuts and lower total cost of ownership for the new BS6 trucks. Despite a high base, October volumes grew 23%, following 32% volume growth in Q2.\n\nThe management expects to outpace the industry\u2019s mid-teens growth in FY27. Medium and heavy commercial vehicles (MHCV) have led the way. Aided by the Hippo and Taurus launches, market share is up 120 bps year-on-year to 32.1%.\n\nExports can recover from Q3, as the Ras Al-Khaimah plant returns to near-full capacity. The war in West Asia led to a 20% decline in GCC volumes in Q2.", "source": "LiveMint Markets", "pub_date_str": "18 Nov 2026, 12:38 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "16 microcap stocks surge up to 390% in CY26, emerge as multibaggers", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News 16 microcap stocks surge up to 390% in CY26, emerge as multibaggers Written by Ritesh Presswala , ETMarkets.com | Nov 18, 2026, 12:27:30 PM IST 1 / 17 Microcap Rally While the benchmark Nifty 50 has slipped nearly 3% in CY26 so far, the Nifty Microcap 250 index has bucked the trend, delivering an impressive 13% gain. What's even more striking is that nearly 50 stocks in the microcap index have surged over 50%, with 16 emerging as multibaggers, more than doubling investors' wealth in just over 10 months of 2026.\n\nThe stock has delivered a staggering 388% return in CY26 so far, surging from Rs 188 to Rs 918.\n\nShares have rallied 191% so far in CY26, climbing from Rs 334 to Rs 970.\n\nThe stock has gained 186% in CY26 so far, rising from Rs 321 to Rs 917.\n\nShares have surged 171% so far this year, jumping from Rs 375 to Rs 1,016.\n\nThe stock has advanced 165% in CY26 so far, moving up from Rs 138 to Rs 366.\n\nShares have gained 156% so far this year, rallying from Rs 3,110 to Rs 7,967.\n\nThe stock has climbed 154% in CY26 so far, rising from Rs 199 to Rs 506.", "source": "Economic Times Markets", "pub_date_str": "18 Nov 2026, 12:14 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Indoco Remedies share price jumps 13%; pharma stock up over 16% in 2 weeks: Can the rally extend? What experts say", "full_content": "Dhanya Nagasundaram Published 18 Nov 2026, 12:13 PM IST Prefer Livemint on Google Indoco Remedies shares rallied over 13% on Wednesday, 18 November, even as the broader stock market remained subdued. The pharmaceutical stock has gained 13.21% over the past week and 16.25% over the past two weeks, extending its recent recovery.\n\nThe stock opened at an intraday low of \u20b9 226.75 apiece before climbing to a high of \u20b9 254.75 during the session.\n\nThe sharp rally has brought the stock into focus, with technical experts pointing to improving momentum, strong volumes and crucial resistance levels that could determine its next move.\n\nSudeep Shah, Head of Technical and Derivatives Research at SBI Securities, said the stock has rebounded nearly 24% from its low of \u20b9 205.10 in just 14 trading sessions. Following the recovery, it has moved above its key moving averages, signalling an improvement in near-term momentum.\n\nHowever, Shah cautioned that the broader trend remains range-bound, with the stock having consolidated within the \u20b9 205\u2013288 range over the past few months.\n\nAccording to him, the \u20b9 256\u2013260 zone is likely to act as immediate resistance. A decisive breakout above \u20b9 260 could extend the ongoing rally towards \u20b9 288, which marks the upper boundary of the broader consolidation range. On the downside, the \u20b9 230\u2013233 zone is expected to provide strong support.\n\nGaurav Arora, Head of Research at SAHI, said Indoco Remedies is trading within a parallel channel and has gained around 12% in Wednesday's session. He noted that the stock has moved above the key resistance zone of \u20b9 235, with strong volumes supporting the breakout.\n\nArora sees the stock moving towards \u20b9 280\u2013285, adding that the technical structure will remain positive as long as it sustains above \u20b9 235, which has now turned into a support level.", "source": "LiveMint Markets", "pub_date_str": "18 Nov 2026, 12:13 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Derivatives"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Leukemia vaccine passes key trial, adding to breakthrough year for cancer drugs - The Washington Post", "full_content": "Leukemia vaccine passes key trial, adding to breakthrough year for cancer drugs The Washington Post Vaccine Improves Survival in People with Acute Myeloid Leukemia (AML) Memorial Sloan Kettering Cancer Center SLS Joins MRNA And ANL In Biotech\u2019s Top 3 This Year \u2014 Here\u2019s How A Late-2025 Bet Could Grow 10x From Here Yahoo Finance Sellas\u2019 experimental blood cancer immunotherapy reduced risk of death in clinical trial STAT Sellas vaccine extends survival in blood cancer trial, shares surge Reuters", "source": "Google News Business", "pub_date_str": "18 Nov 2026, 12:08 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "India bonds rise tracking easing crude oil, US Treasury yields", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Bonds \u203a India bonds rise tracking easing crude oil, US Treasury yields Powered By The Economic Times daily newspaper is available online now. Read Today's Paper India bonds rise tracking easing crude oil, US Treasury yields SECTIONS India bonds rise tracking easing crude oil, US Treasury yields Reuters Last Updated: Nov 18, 2026, 12:06:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Indian bond market is experiencing a positive shift, with bond yields decreasing as oil prices and Treasury yields fall. The 2036 benchmark bond yield is now at 7.2393%, reflecting a minor drop. Additionally, crude oil prices have plummeted more than 20% since their October peaks, providing a temporary buffer against inflation.\n\nShort-covering further boosted bonds, they said, as the 10-year benchmark yield closed at 7.25%, down six basis points from its previous close of 7.31%, CCIL data showed.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "18 Nov 2026, 12:06 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Wedding season 2026: Old gold jewellery exchange vs remodelling \u2013 which is better for you? Compare charges, GST and more", "full_content": "With the wedding season set to begin with Dev Uthani Ekadashi this Friday, 20 November, many households are looking to buy gold jewellery.\n\nAt the same time, many households may want to repurpose their old gold jewellery. With changing designs and preferences, they have two options: exchange their old jewellery for new pieces or remodel existing ornaments into new designs.\n\nBut which option is more cost-efficient, and what charges are involved in each? Here's what you need to know.\n\nIn an exchange, you take old or broken gold jewellery to a jeweller, who tests its purity, weighs it, and credits its gold value towards a new showroom piece. Deductions may apply for non-gold components such as stones and enamel.\n\nIn remodelling, the existing jewellery is melted down and crafted into a new design using the original gold.\n\nAccording to Amit Modak, Director of P. N. Gadgil & Sons, exchange involves paying the difference in gold value and making charges for the new design.\n\nIn remodelling, customers pay for additional gold, if required, along with labour and remaking charges. Melting loss may apply during melting and finishing, and the process takes longer due to manufacturing requirements, he added.\n\nModak said regular gold jewellery transactions generally attract 3% GST on the jewellery value, while separately billed making charges are subject to 5% GST. However, the applicable tax treatment may vary depending on how the transaction is structured and invoiced.", "source": "LiveMint Money", "pub_date_str": "18 Nov 2026, 12:02 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Derivatives", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "The name\u2019s bond", "full_content": "Fixed income is so box office right now", "source": "FT Markets", "pub_date_str": "18 Nov 2026, 12:00 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Nvidia's Jensen Huang $10.7 bn share transfer: CEO, wife Lory transfers 59 mn stocks to Trust - What SEC filing reveals?", "full_content": "TRUST Pranati Deva Published 18 Nov 2026, 11:52 AM IST Prefer Livemint on Google A massive transfer of Nvidia shares worth nearly $10.7 billion has brought the wealth structure of co-founder Jensen Huang and his family into focus. Months before his reported exit as the chipmaker's CEO, Huang and his wife, Lori, moved almost 59 million shares into an irrevocable family trust, according to SEC disclosures.\n\nThe transaction was part of a decade-long estate-planning arrangement involving two trusts set up in 2016. It follows the termination of two trusts established by the couple a decade earlier.\n\nA subsequent filing has now offered a closer look at how Huang's vast Nvidia shareholding is distributed across family trusts, charitable entities and investment companies.\n\nThe transfer took place around eight months before Huang's reported departure as Nvidia's chief executive in November 2026. It has attracted attention amid reports and allegations concerning his personal life. However, the regulatory disclosures do not link the share transfer to those allegations or his subsequent departure. Instead, they document a family wealth-transfer arrangement and the ownership of Nvidia shares across several trusts and companies.\n\nA separate Form 4 filing dated September 18, 2026, provides an updated snapshot of Huang's reported holdings and records another transaction involving 438,000 shares. Here is what the two SEC filings show.\n\nThe March 2026 transaction involved two grantor retained annuity trusts (GRATs) established by Jensen and Lori Huang in 2016. When the trusts ended on March 18, 2026, each transferred 29,481,301 Nvidia shares to the Huang Irrevocable Remainder Trust, taking the total transfer to 58,962,602 shares.\n\nThe shares were transferred as gifts without consideration, rather than being sold in the market.", "source": "LiveMint Markets", "pub_date_str": "18 Nov 2026, 11:52 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "'Who and what comes next': Analysts expect Nvidia investor uncertainty despite earnings beat", "full_content": "Analysts expect uncertainty around Nvidia 's future to linger despite another earnings beat, noting that much of the third quarter was already locked in before the turmoil that peaked in Jensen Huang 's resignation as CEO.\n\nNvidia's third-quarter revenue came in at $115.84 billion, more than $6 billion above analysts' expectations of $109.10 billion, while fourth-quarter guidance of $130 billion topped the $125.1 billion consensus, according to LSEG.\n\nPart of that increase reflects an extra week in the fiscal fourth quarter, which Melius Research estimated accounts for $9 billion to $10 billion of the sequential jump.\n\nThe company also lifted its fiscal 2028 growth forecast to 75% from 70%, even with China excluded from its data center compute revenue outlook.\n\nNvidia's latest movements. \"That's a team going full steam ahead, rather than just steadying the ship, and a clear signal that management believes next year can run just fine without Jensen Huang at the helm,\" said Josh Gilbert, eToro's lead analyst for Asia Pacific and the Middle East.\n\nStill, even with the results that he called \"nothing short of astonishing\", Gilbert said \"investors will still be left with the uncertainty of who and what comes next.\"\n\nIn his first statement since he resigned last week, Huang said before the results release that he was open to returning to the company. However, chair of Nvidia's board Harvey Jones said on the earnings call that the board does not intend to reinstate him as CEO.\n\nThe results should help ease some concerns created by Nvidia's recent leadership turmoil, said Morningstar senior equity analyst Brian Colello, who described the figures as \"solid\" and broadly in line with the firm's expectations.", "source": "CNBC World Economy", "pub_date_str": "18 Nov 2026, 11:51 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "JPMorgan is working on AI agent transactions that don\u2019t involve humans", "full_content": "Artificial intelligence agents have already proven to be helpful, or cause a lot of trouble, or both. One area seen as high-potential is in payments, where \u2014 if they're able to be trusted \u2014 the agents could deal with all sorts of money matters on behalf of people.\n\nThat's why JPMorgan Chase and South Korea's Hyundai Card are testing how AI agents can handle financial transactions without direct human intervention, including whether they can eventually negotiate and make payments with one another.\n\nThe companies have completed an initial proof-of-concept involving a simulated foreign exchange transaction and are targeting the first half of 2027 for a more complex phase involving multiple AI agents.\n\nWee Kee Toh, global head of Kinexys Insights at Kinexys by JP Morgan, told CNBC that the next step is to test what happens when autonomous agents move beyond execution and begin interacting with each other in an ecosystem.\n\n\"That, I would say, is really the biggest part of what we want to get as an expansion of the phase one scope,\" he added.\n\nThe initial trial involved a Hyundai Card AI agent requesting a foreign exchange transaction to maintain euro liquidity in its Kinexys blockchain deposit account. JPMorgan said it was the first private blockchain-based autonomous bank-agent-to-client-agent test for corporate treasury management.\n\nWhile the initial trial has been completed, JPMorgan has yet to set a timeline for commercializing the technology.\n\nToh said building the technology itself was relatively straightforward, but establishing appropriate governance and internal controls proved more difficult.", "source": "CNBC World Economy", "pub_date_str": "18 Nov 2026, 11:48 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Fixed Income", "Alternative Investments"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Anthropic IPO: Why Wall Street is betting big on Claude AI maker", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News Powered By Anthropic IPO: Why Wall Street is betting big on Claude AI maker Written by Anupam Nagar , ETMarkets.com | Nov 18, 2026, 11:45:31 AM IST 1 / 5 \u200bAnthropic IPO could value AI firm at up to $1.6 trillion Anthropic is preparing for one of the biggest stock market debuts in history, with the maker of Claude AI expected to command a valuation of around $1.4 trillion or higher. The company initially indicated an IPO price range of $70-$78 per share, implying a valuation of approximately $1.33 trillion. However, strong investor demand has prompted discussions about pricing the shares above the initial range, potentially pushing its valuation towards $1.5 trillion-$1.6 trillion. The shares are expected to list on Nasdaq under the ticker symbol ANT. (Sources: Yahoo Finance, The Guardian)\n\nAmazon and Google are set to hold more than 28% of Anthropic's outstanding shares following its IPO and concurrent private placement, highlighting the growing financial ties between the AI developer and its cloud partners. According to regulatory disclosures, Amazon is expected to own nearly 15% of the company, while Google's stake will be around 14%. Both companies are also major investors, cloud infrastructure providers and commercial partners for Anthropic, creating closely interconnected business relationships.\n\nAnthropic's public listing is expected to generate substantial gains for a diverse group of exis     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
