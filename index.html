    const allData = {"general": [{"title": "Japan vs India Live Streaming: When And Where To Watch JPN vs IND T20I", "full_content": "India vs Japan is set for a five-over-a-side contest after the match was shortened due to delays. India have won the toss and have opted to bat, with play to begin at 12:30 PM.", "source": "NDTV Profit", "pub_date_str": "22 Sep 2026, 12:56 PM IST", "pub_date_relative": "12m ago"}, {"title": "Oil rises amid worries of growing Iran-U.S. tensions after Bessent issues Iranian airline shutdown warning", "full_content": "Oil rose Tuesday amid concerns of growing Iran-U.S. tensions, after U.S. Treasury Secretary Scott Bessent told CNBC that all Iranian airlines will be shut down from Wednesday.\n\nFutures for international benchmark Brent crude for November delivery gained 1.36% at $101.70 a barrel as of 3:00 a.m. ET. U.S. West Texas Intermediate futures for October advanced 1.71% at $97.42 per barrel.\n\nBrent Bessent told CNBC that all Iranian airlines will be shut down from Wednesday. \"How do we do that? That if they land, you cannot provide them with fuel. You cannot provide them with landing services, you cannot sell them tickets, or you will be knocked out of the dollar system,\" Bessent said on CNBC's \" Squawk Box .\"\n\nInvestors are still eyeing a possible diplomatic solution to the Mideast conflict, following news that Iranian president Masoud Pezeshkian is set to fly to the United Nations in New York.\n\nPezeshkian will address the assembly and present Iran's positions on \"international developments,\" with a particular focus on its war with the U.S. and Israel, according to the country's semi-official Tasnim news agency. Talks with the leaders of several countries are also scheduled to take place Sept. 22 to 26, and 28, on the sidelines of the event.\n\nWTI Attention will likely remain focused on diplomatic developments, said Lukman Otunuga, head of market research at online brokerage FXTM.\n\n\"Confirmation of direct talks between Washington and Tehran could place additional selling pressure on prices by improving expectations for regional supply,\" Otunuga said.\n\n\" Conversely, Tehran has warned that renewed escalation would trigger a significant response, which could push crude prices higher,\" he added.", "source": "CNBC Top News", "pub_date_str": "22 Sep 2026, 12:54 PM IST", "pub_date_relative": "14m ago"}, {"title": "Glass Wall Systems share price hits record high, up 75% from IPO price | Why is the stock rallying?", "full_content": "Shares of facade solutions provider Glass Wall Systems (India) Ltd continued their sharp post-listing rally on Tuesday, 22 September, with the stock jumping more than 7% to touch a fresh all-time high of \u20b9 318 apiece on the BSE. At \u20b9 318, the stock is now about 75% above its \u20b9 182 IPO price, highlighting the scale of the post-listing gains.\n\nThe stock has seen strong buying interest since its market debut last week. However, the company has clarified that it is not aware of any specific reason behind the sharp movement in its share price.\n\nIn an exchange filing on Tuesday, Glass Wall Systems said it was responding to queries from the BSE and NSE regarding the significant movement in the price and volume of its shares.\n\nGlass Wall Systems said it has disclosed all events and information, including price-sensitive information, that it was required to report under Regulation 30 of the SEBI Listing Obligations and Disclosure Requirements (LODR) Regulations.\n\nThe company said it had not withheld any information or impending announcement that, in its view, could have an impact on the price or trading volume of the stock.\n\n\u201cPrice movement in the scrip of the Company is purely due to market conditions and absolutely market driven,\u201d the company said in its clarification.\n\nIt added that the management has neither control over nor knowledge of the reasons behind the significant movement in the stock.\n\nFor investors, this means the sharp rally should not automatically be linked to a fresh business announcement or undisclosed corporate development. The company has specifically attributed the movement to market conditions.", "source": "LiveMint Markets", "pub_date_str": "22 Sep 2026, 12:53 PM IST", "pub_date_relative": "14m ago"}, {"title": "Bhayander School Fines Student Rs 50 Over Methi In Tiffin, Receives Civic Notice", "full_content": "Tapovan Vidyalaya in Bhayander East faces civic scrutiny after MBMC issued a show-cause notice over a Rs 50 fine imposed on a student for bringing methi bhaji in the lunchbox.", "source": "NDTV Profit", "pub_date_str": "22 Sep 2026, 12:51 PM IST", "pub_date_relative": "17m ago"}, {"title": "Adroit Industries IPO GMP In Focus Ahead Of Launch: Here's What GMP Signals Before Sept. 23 Launch", "full_content": "Adroit Industries IPO opens on Sept. 23 with a GMP of Rs 32, implying a 23.88% premium over the upper price band of Rs 134.", "source": "NDTV Profit", "pub_date_str": "22 Sep 2026, 12:49 PM IST", "pub_date_relative": "19m ago"}, {"title": "Why is Smiths stock surging today?", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Sep 2026, 12:49 PM IST", "pub_date_relative": "19m ago"}, {"title": "Industrie De Nora shares tumble after Snam cuts stake by 5%", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Sep 2026, 12:48 PM IST", "pub_date_relative": "19m ago"}, {"title": "Why is M&C Saatchi stock sliding today?", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Sep 2026, 12:46 PM IST", "pub_date_relative": "21m ago"}, {"title": "India's Aviation Sector To Support 20 Million Jobs By 2040, Says Rammohan Naidu", "full_content": "Naidu said the government is working to expand India's aviation ecosystem, with the modified UDAN scheme having ambitious targets for connectivity and infrastructure development.", "source": "NDTV Profit", "pub_date_str": "22 Sep 2026, 12:45 PM IST", "pub_date_relative": "22m ago"}, {"title": "From Solar To Storage: Why KP Group Sees A Bigger Renewable Opportunity Ahead", "full_content": "KP Group has over 2.5 GWh of BESS orders in hand and is expanding into battery production, green data centres and overseas renewable opportunities.", "source": "NDTV Profit", "pub_date_str": "22 Sep 2026, 12:44 PM IST", "pub_date_relative": "23m ago"}, {"title": "Mandaadi Box Office Collection Day 12: Soori Starrer Crosses Rs 100 Crore Worldwide Despite 69% Drop", "full_content": "'Mandaadi' collected Rs 2.45 crore net in India on Day 12, taking its total India net collection to Rs 78 crore. Its India gross collection has reached Rs 91.20 crore.", "source": "NDTV Profit", "pub_date_str": "22 Sep 2026, 12:44 PM IST", "pub_date_relative": "23m ago"}, {"title": "IPO alert: Elevate Campuses\u2019 growth pitch faces a debt test", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nElevate Campuses Ltd, which owns and manages student accommodation and owns school properties leased to education operators, is tapping the capital markets to fund growth amid mounting debt. The company\u2019s revenue and margins are rising, but its debt pile is growing faster. For investors in its \u20b9 2,100-crore initial public offering (IPO), the question is whether an expanding education infrastructure portfolio can generate enough income to improve returns and ease the financial strain.\n\nReported net profit more than quadrupled over the period to \u20b9 173.8 crore in FY26, with its net profit margin rising from 10.9% to 28.8%, helped by a one-off \u20b9 109.4 crore gain from the sale of a hostel undertaking.\n\nIncluding the proposed acquisitions, pro forma FY26 revenue (assuming the acquisitions had already been completed) stood at \u20b9 806.9 crore and adjusted Ebitda at \u20b9 657.2 crore, with a margin of 77.6%. These figures illustrate the enlarged group's scale on pro forma consolidated basis.\n\nGrowth at existing campuses comes from contractual fee increases and services such as laundry, gyms and food outlets. Annual fee escalations of 5\u20136%, combined with these services, have helped deliver same-campus growth of about 8\u201310%, Rao said.\n\nLong contracts support revenue visibility. Owned student accommodation contracts generally span 50\u201360 years, while school leases typically run for 30 years, with a 15-year lock-in and contractual rent increases, he added.\n\nOn revenue visibility, Vedant Gupte, co-founder and chief executive officer of investment platform Trackk, notes that students pay upfront, contracts run for decades, and occupancy guarantees provide a revenue floor. However, he added that investors must distinguish underlying performance from acquisitions and one-off gains.\n\nThe acquisition strategy has expanded Elevate\u2019s financial commitments alongside its portfolio.", "source": "LiveMint Markets", "pub_date_str": "22 Sep 2026, 12:43 PM IST", "pub_date_relative": "25m ago"}, {"title": "Gold slips as firmer dollar revives Fed concerns, oil slide limits losses", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Sep 2026, 12:42 PM IST", "pub_date_relative": "26m ago"}, {"title": "Copper stalls 1% below ATH with double top risk rising: Live", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Sep 2026, 12:42 PM IST", "pub_date_relative": "26m ago"}, {"title": "European shares inch higher as UN diplomacy signals pull crude lower", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Sep 2026, 12:41 PM IST", "pub_date_relative": "26m ago"}, {"title": "Bitcoin overbought at $87K high, mean-reversion risk: Live levels", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Sep 2026, 12:41 PM IST", "pub_date_relative": "26m ago"}, {"title": "London Gas Oil slips below $1,450 support: Live levels", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Sep 2026, 12:41 PM IST", "pub_date_relative": "26m ago"}, {"title": "Natural Gas pinned in tight range, breakout looming: Live", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Sep 2026, 12:41 PM IST", "pub_date_relative": "26m ago"}, {"title": "BoB Capital upgrades this jewellery stock with buy rating | Check target, rationale, upside, returns", "full_content": "Brokerage firm BoB Capital Markets has upgraded the jewellery stock Thangamayil Jewellery from \u2018hold\u2019 to \u2018buy\u2019 with a target price of \u20b9 6,355 per share, seeing an upside potential up to 28%.\n\n\u201cWe believe the current valuation offers an attractive risk-reward opportunity and hence upgrade the stock to BUY (from HOLD) and value it at 35x Sep'28 EPS, implying a revised target price of \u20b9 6,355,\u201d the brokerage firm said in a report.\n\nThe brokerage firm further added that with a strong balance sheet, disciplined working capital management, and improving return ratios, the company is well positioned to deliver consistent earnings growth.\n\nAccording to the firm, the management of the jewellery company remains confident of delivering 25% rev growth while sustaining 6% EBITDA margins, supported by ongoing store expansion in Tamil Nadu, strong inventory rotation, and a capital-efficient business model.\n\n\u201cWith many purchases deferred rather than cancelled, management expects pent-up demand to drive a recovery in H2\u201927, particularly during the festive and wedding season in Q3 and Q4, including Diwali,\" it added.\n\nThangamayil Jewellery posted a net profit of \u20b9 85 crore for the quarter ended June 2026, marking an 86% year-on-year increase from \u20b9 45.7 crore recorded in the same quarter last year.\n\nRevenue from operations surged 71.2% year-on-year to \u20b9 2,666.4 crore during the quarter, compared with \u20b9 1,558 crore in the corresponding period of the previous financial year.\n\nThe company also reported robust operating performance, with EBITDA rising 66.2% to \u20b9 144.6 crore from \u20b9 87 crore a year earlier. However, the EBITDA margin moderated slightly to 5.4% from 5.6% in the year-ago quarter.", "source": "LiveMint Markets", "pub_date_str": "22 Sep 2026, 12:35 PM IST", "pub_date_relative": "32m ago"}, {"title": "Small-cap stock under \u20b9100: Aastha Spintex declares bonus shares record date, share hits 10% upper circuit", "full_content": "Small-cap stock under \u20b9 100: Shares of Aastha Spintex rallied nearly 9.9% to hit upper circuit during Tuesday\u2019s intraday trading session after fixing record date for bonus issue. The company\u2019s board of directors has approved a bonus in the ratio of 1:1.\n\nAastha Spintex share price has surged close to 11.8% over the past one month, and around 6.86% over the past one week.\n\nThe company\u2019s board of directors has fixed Monday, September 28, as the record date to determine the eligibility of shareholders for the payout. Investors must own the stock before the record date to become eligible for the bonus issue.\n\nThe board had announced bonus entitlement in the ratio of 1:1. Which means every eligible investor will get one fully paid-up equity share of face value of \u20b9 10 each for every one existing fully paid-up equity share of face value of \u20b9 10 each. This corporate action would lad to the issuance of up to 4,41,42,190 equity shares.\n\n\u201cThe Bonus Equity Shares shall rank pari passu in all respects with the existing fully paid-up Equity Shares of the Company,\u201d stated the firm in its BSE filing. It means that the newly issued shares will have the exact same value and rights as the firm\u2019s existing equity shares.\n\nApart from the record date of September 28, the company has also notified a timeline linked to allotment and payment of the shares as per the bonus issue corporate action. The company has fixed Tuesday, September 29 as the allotment date for bonus issue. Whereas, these newly issued shares will start trading from September 30, 2026.\n\nThe stock was trading 9.96% higher at \u20b9 81.73 per share on BSE with a market capitalisation of \u20b9 360.77 crore at 12:22 pm on Tuesday. The stock had touched an intraday high of \u20b9 81.76 per share and an intraday low of \u20b9 74.51 per share. The company scrip touched its 52-week high of \u20b9 140.25 per share on July 22, 2025.", "source": "LiveMint Markets", "pub_date_str": "22 Sep 2026, 12:34 PM IST", "pub_date_relative": "33m ago"}], "cfa": [{"title": "Oil rises amid worries of growing Iran-U.S. tensions after Bessent issues Iranian airline shutdown warning", "full_content": "Oil rose Tuesday amid concerns of growing Iran-U.S. tensions, after U.S. Treasury Secretary Scott Bessent told CNBC that all Iranian airlines will be shut down from Wednesday.\n\nFutures for international benchmark Brent crude for November delivery gained 1.36% at $101.70 a barrel as of 3:00 a.m. ET. U.S. West Texas Intermediate futures for October advanced 1.71% at $97.42 per barrel.\n\nBrent Bessent told CNBC that all Iranian airlines will be shut down from Wednesday. \"How do we do that? That if they land, you cannot provide them with fuel. You cannot provide them with landing services, you cannot sell them tickets, or you will be knocked out of the dollar system,\" Bessent said on CNBC's \" Squawk Box .\"\n\nInvestors are still eyeing a possible diplomatic solution to the Mideast conflict, following news that Iranian president Masoud Pezeshkian is set to fly to the United Nations in New York.\n\nPezeshkian will address the assembly and present Iran's positions on \"international developments,\" with a particular focus on its war with the U.S. and Israel, according to the country's semi-official Tasnim news agency. Talks with the leaders of several countries are also scheduled to take place Sept. 22 to 26, and 28, on the sidelines of the event.\n\nWTI Attention will likely remain focused on diplomatic developments, said Lukman Otunuga, head of market research at online brokerage FXTM.\n\n\"Confirmation of direct talks between Washington and Tehran could place additional selling pressure on prices by improving expectations for regional supply,\" Otunuga said.\n\n\" Conversely, Tehran has warned that renewed escalation would trigger a significant response, which could push crude prices higher,\" he added.", "source": "CNBC Top News", "pub_date_str": "22 Sep 2026, 12:54 PM IST", "pub_date_relative": "14m ago", "cfa_topics": ["Fixed Income", "Derivatives", "Portfolio Management"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Glass Wall Systems share price hits record high, up 75% from IPO price | Why is the stock rallying?", "full_content": "Shares of facade solutions provider Glass Wall Systems (India) Ltd continued their sharp post-listing rally on Tuesday, 22 September, with the stock jumping more than 7% to touch a fresh all-time high of \u20b9 318 apiece on the BSE. At \u20b9 318, the stock is now about 75% above its \u20b9 182 IPO price, highlighting the scale of the post-listing gains.\n\nThe stock has seen strong buying interest since its market debut last week. However, the company has clarified that it is not aware of any specific reason behind the sharp movement in its share price.\n\nIn an exchange filing on Tuesday, Glass Wall Systems said it was responding to queries from the BSE and NSE regarding the significant movement in the price and volume of its shares.\n\nGlass Wall Systems said it has disclosed all events and information, including price-sensitive information, that it was required to report under Regulation 30 of the SEBI Listing Obligations and Disclosure Requirements (LODR) Regulations.\n\nThe company said it had not withheld any information or impending announcement that, in its view, could have an impact on the price or trading volume of the stock.\n\n\u201cPrice movement in the scrip of the Company is purely due to market conditions and absolutely market driven,\u201d the company said in its clarification.\n\nIt added that the management has neither control over nor knowledge of the reasons behind the significant movement in the stock.\n\nFor investors, this means the sharp rally should not automatically be linked to a fresh business announcement or undisclosed corporate development. The company has specifically attributed the movement to market conditions.", "source": "LiveMint Markets", "pub_date_str": "22 Sep 2026, 12:53 PM IST", "pub_date_relative": "14m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Bhayander School Fines Student Rs 50 Over Methi In Tiffin, Receives Civic Notice", "full_content": "Tapovan Vidyalaya in Bhayander East faces civic scrutiny after MBMC issued a show-cause notice over a Rs 50 fine imposed on a student for bringing methi bhaji in the lunchbox.", "source": "NDTV Profit", "pub_date_str": "22 Sep 2026, 12:51 PM IST", "pub_date_relative": "17m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Adroit Industries IPO GMP In Focus Ahead Of Launch: Here's What GMP Signals Before Sept. 23 Launch", "full_content": "Adroit Industries IPO opens on Sept. 23 with a GMP of Rs 32, implying a 23.88% premium over the upper price band of Rs 134.", "source": "NDTV Profit", "pub_date_str": "22 Sep 2026, 12:49 PM IST", "pub_date_relative": "19m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "India's Aviation Sector To Support 20 Million Jobs By 2040, Says Rammohan Naidu", "full_content": "Naidu said the government is working to expand India's aviation ecosystem, with the modified UDAN scheme having ambitious targets for connectivity and infrastructure development.", "source": "NDTV Profit", "pub_date_str": "22 Sep 2026, 12:45 PM IST", "pub_date_relative": "22m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "IPO alert: Elevate Campuses\u2019 growth pitch faces a debt test", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nElevate Campuses Ltd, which owns and manages student accommodation and owns school properties leased to education operators, is tapping the capital markets to fund growth amid mounting debt. The company\u2019s revenue and margins are rising, but its debt pile is growing faster. For investors in its \u20b9 2,100-crore initial public offering (IPO), the question is whether an expanding education infrastructure portfolio can generate enough income to improve returns and ease the financial strain.\n\nReported net profit more than quadrupled over the period to \u20b9 173.8 crore in FY26, with its net profit margin rising from 10.9% to 28.8%, helped by a one-off \u20b9 109.4 crore gain from the sale of a hostel undertaking.\n\nIncluding the proposed acquisitions, pro forma FY26 revenue (assuming the acquisitions had already been completed) stood at \u20b9 806.9 crore and adjusted Ebitda at \u20b9 657.2 crore, with a margin of 77.6%. These figures illustrate the enlarged group's scale on pro forma consolidated basis.\n\nGrowth at existing campuses comes from contractual fee increases and services such as laundry, gyms and food outlets. Annual fee escalations of 5\u20136%, combined with these services, have helped deliver same-campus growth of about 8\u201310%, Rao said.\n\nLong contracts support revenue visibility. Owned student accommodation contracts generally span 50\u201360 years, while school leases typically run for 30 years, with a 15-year lock-in and contractual rent increases, he added.\n\nOn revenue visibility, Vedant Gupte, co-founder and chief executive officer of investment platform Trackk, notes that students pay upfront, contracts run for decades, and occupancy guarantees provide a revenue floor. However, he added that investors must distinguish underlying performance from acquisitions and one-off gains.\n\nThe acquisition strategy has expanded Elevate\u2019s financial commitments alongside its portfolio.", "source": "LiveMint Markets", "pub_date_str": "22 Sep 2026, 12:43 PM IST", "pub_date_relative": "25m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Alternative Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Gold slips as firmer dollar revives Fed concerns, oil slide limits losses", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Sep 2026, 12:42 PM IST", "pub_date_relative": "26m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Bitcoin overbought at $87K high, mean-reversion risk: Live levels", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Sep 2026, 12:41 PM IST", "pub_date_relative": "26m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Natural Gas pinned in tight range, breakout looming: Live", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Sep 2026, 12:41 PM IST", "pub_date_relative": "26m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "BoB Capital upgrades this jewellery stock with buy rating | Check target, rationale, upside, returns", "full_content": "Brokerage firm BoB Capital Markets has upgraded the jewellery stock Thangamayil Jewellery from \u2018hold\u2019 to \u2018buy\u2019 with a target price of \u20b9 6,355 per share, seeing an upside potential up to 28%.\n\n\u201cWe believe the current valuation offers an attractive risk-reward opportunity and hence upgrade the stock to BUY (from HOLD) and value it at 35x Sep'28 EPS, implying a revised target price of \u20b9 6,355,\u201d the brokerage firm said in a report.\n\nThe brokerage firm further added that with a strong balance sheet, disciplined working capital management, and improving return ratios, the company is well positioned to deliver consistent earnings growth.\n\nAccording to the firm, the management of the jewellery company remains confident of delivering 25% rev growth while sustaining 6% EBITDA margins, supported by ongoing store expansion in Tamil Nadu, strong inventory rotation, and a capital-efficient business model.\n\n\u201cWith many purchases deferred rather than cancelled, management expects pent-up demand to drive a recovery in H2\u201927, particularly during the festive and wedding season in Q3 and Q4, including Diwali,\" it added.\n\nThangamayil Jewellery posted a net profit of \u20b9 85 crore for the quarter ended June 2026, marking an 86% year-on-year increase from \u20b9 45.7 crore recorded in the same quarter last year.\n\nRevenue from operations surged 71.2% year-on-year to \u20b9 2,666.4 crore during the quarter, compared with \u20b9 1,558 crore in the corresponding period of the previous financial year.\n\nThe company also reported robust operating performance, with EBITDA rising 66.2% to \u20b9 144.6 crore from \u20b9 87 crore a year earlier. However, the EBITDA margin moderated slightly to 5.4% from 5.6% in the year-ago quarter.", "source": "LiveMint Markets", "pub_date_str": "22 Sep 2026, 12:35 PM IST", "pub_date_relative": "32m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Small-cap stock under \u20b9100: Aastha Spintex declares bonus shares record date, share hits 10% upper circuit", "full_content": "Small-cap stock under \u20b9 100: Shares of Aastha Spintex rallied nearly 9.9% to hit upper circuit during Tuesday\u2019s intraday trading session after fixing record date for bonus issue. The company\u2019s board of directors has approved a bonus in the ratio of 1:1.\n\nAastha Spintex share price has surged close to 11.8% over the past one month, and around 6.86% over the past one week.\n\nThe company\u2019s board of directors has fixed Monday, September 28, as the record date to determine the eligibility of shareholders for the payout. Investors must own the stock before the record date to become eligible for the bonus issue.\n\nThe board had announced bonus entitlement in the ratio of 1:1. Which means every eligible investor will get one fully paid-up equity share of face value of \u20b9 10 each for every one existing fully paid-up equity share of face value of \u20b9 10 each. This corporate action would lad to the issuance of up to 4,41,42,190 equity shares.\n\n\u201cThe Bonus Equity Shares shall rank pari passu in all respects with the existing fully paid-up Equity Shares of the Company,\u201d stated the firm in its BSE filing. It means that the newly issued shares will have the exact same value and rights as the firm\u2019s existing equity shares.\n\nApart from the record date of September 28, the company has also notified a timeline linked to allotment and payment of the shares as per the bonus issue corporate action. The company has fixed Tuesday, September 29 as the allotment date for bonus issue. Whereas, these newly issued shares will start trading from September 30, 2026.\n\nThe stock was trading 9.96% higher at \u20b9 81.73 per share on BSE with a market capitalisation of \u20b9 360.77 crore at 12:22 pm on Tuesday. The stock had touched an intraday high of \u20b9 81.76 per share and an intraday low of \u20b9 74.51 per share. The company scrip touched its 52-week high of \u20b9 140.25 per share on July 22, 2025.", "source": "LiveMint Markets", "pub_date_str": "22 Sep 2026, 12:34 PM IST", "pub_date_relative": "33m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Long-duration debt funds offer 7.8% yields, but further rate hikes could hurt returns. What should investors do?", "full_content": "Indian bond yields have climbed sharply in recent weeks, with the benchmark 10-year government bond yield rising to around 7.07% on 21 September, its fifth consecutive weekly increase. For debt investors, that means higher yields are now available, but the decision is not as simple as choosing the highest yield. If bond yields rise further, the prices of long-term bonds can fall sharply, which can drag down the fund's NAV despite the higher income.\n\nWith the outlook for interest rates and inflation still uncertain, investors face a choice between locking in current yields and taking the risk that yields could move higher. Vaibhav Porwal, Co-founder of Dezerv, expects Indian bond yields to rise further in Q3 and Q4 FY27 and cautions against aggressive long-duration exposure in the current environment.\n\nLong-duration funds currently offer running yields of around 7.50-7.80%, while the benchmark 10-year government security yield is around 7.05-7.20%, Porwal said. This may look attractive compared with other fixed-income options, but investors also need to consider interest-rate risk.\n\nLong-duration bonds are more sensitive to changes in yields. When yields rise, bond prices fall, which can result in mark-to-market losses for debt funds. These losses can offset the income earned from the bonds, particularly over shorter periods.\n\n\u201cLong-duration funds offer high running yields (accrual) and the potential for substantial capital gains during interest rate cuts,\u201d Porwal said. However, he expects Indian bond yields to rise further in Q3 and Q4 FY27 due to rate hikes and inflation pressures.\n\n\u201cIf yields rise, the mark-to-market price losses due to high duration sensitivity can erase short-term accrual income,\u201d he said.\n\nInvestors looking for relatively high fixed-income yields have several alternatives.\n\nMajor bank fixed deposits currently offer rates of around 6.50-7.15%, according to Porwal.", "source": "LiveMint Money", "pub_date_str": "22 Sep 2026, 12:34 PM IST", "pub_date_relative": "34m ago", "cfa_topics": ["Economics", "Fixed Income", "Derivatives", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Will Roadster reveal trigger a fresh rally in Tesla shares?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News Powered By Will Roadster reveal trigger a fresh rally in Tesla shares? Written by Anupam Nagar , ETMarkets.com | Sep 22, 2026, 12:46:44 PM IST 1 / 5 Tesla Stock Jumps Ahead of Roadster Reveal Tesla shares climbed nearly 3% on Monday, reaching their highest level in almost three weeks, as investors looked ahead to the highly anticipated unveiling of the next-generation Roadster. (Yahoo Finance, TradingView, Ad-hoc-news)\n\nTesla has reopened reservations for its second-generation Roadster, with the company scheduled to unveil the vehicle on October 1. Buyers are being asked for a $5,000 deposit followed by a $45,000 payment within 10 days.\n\nTesla's shares also gained support after Nvidia qualified Tesla's battery energy-storage systems for its DSX Ready AI factory programme. The move highlights Tesla's energy business as AI data centres seek reliable power and storage solutions.\n\nTesla's broader AI ambitions remain under scrutiny. Oppenheimer said meaningful revenue from the Optimus humanoid robot could take longer than expected, with limited revenue potentially before 2029 because of hardware, software and supply-chain challenges.\n\nThe Roadster, Cybercab, robotaxi technology, Optimus and energy-storage operations are increasingly shaping Tesla's growth narrative beyond electric vehicles. The latest rally reflects renewed attention on these businesses, while delays to Optimus and the pace of autonomous-driving development remain areas investors are watching. (Disclaimer: Recommendations, suggestions, views and opinions given by the experts are their own. These do not represent the views of The Economic Times)", "source": "Economic Times Markets", "pub_date_str": "22 Sep 2026, 12:28 PM IST", "pub_date_relative": "39m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Lessons from Nepal floods: What Indian businesses need to know about disaster insurance", "full_content": "The catastrophic glacial flood that struck Nepal on 26 August 2026, following a glacier and rock collapse near the Nepal-China border, is a stark reminder of the growing financial impact of natural catastrophes across the Himalayan region. Torrents of water, rocks, mud and debris caused extensive damage to homes, roads, bridges and critical hydropower infrastructure, with at least 11 hydropower projects reporting significant damage. More than 1,300 deaths have been reported, thousands remain missing, and more than 84,000 people have been affected.\n\nPreliminary estimates put Nepal\u2019s direct physical economic losses at around US$2.56 billion (approximately \u20b9 24,200 crore), while the broader reconstruction and recovery requirement could reach US$5 billion (approximately \u20b9 47,600 crore).\n\nThe insurance impact is also significant. As of 31 August 2026, 583 flood-related claims totalling around US$171 million had been reported across Nepal\u2019s non-life insurance sector. Engineering and contractors\u2019 risks, largely relating to hydropower and infrastructure, accounted for approximately US$136 million, while conventional property claims stood at around US$15.5 million. Life, personal accident and workers\u2019 compensation claims are still being assessed.\n\nThe Nepal disaster has particular relevance for India, where exposure to floods, cyclones, earthquakes, landslides and severe storms is increasing alongside rapid urbanisation and infrastructure development.\n\nAccording to Swiss Re, India suffers average annual economic losses of approximately US$8 billion from natural disasters. Floods are the biggest contributor, accounting for around 63% of India\u2019s average annual natural catastrophe losses between 2000 and 2023, followed by tropical cyclones at around 23%.\n\nThe scale of individual events is also increasing. Swiss Re estimates that natural catastrophe events causing around US$1 billion ( \u20b9 8,700 crore) in economic losses are becoming increasingly common in India.", "source": "LiveMint Money", "pub_date_str": "22 Sep 2026, 12:21 PM IST", "pub_date_relative": "47m ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "The price of innovation: why UPI needs revenue to stay free", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nLike every major policy move, UPI\u2019s new merchant discount rate framework has already drawn supporters and opponents. The debate is predictable: supporters see it as necessary for the ecosystem\u2019s health; critics worry about the cost to merchants and consumers.\n\nBut pause for a moment. Ten years ago, when UPI launched, it seemed almost too good to be true: an instant, free digital payment system built on open infrastructure. A decade on, it still feels that way. That is the genius of the model. But can it remain sustainable in the long run?\n\nThe scale of the system is already testing its infrastructure. UPI processed 23.66 billion transactions in July alone, a record. In April, the Reserve Bank of India mandated stricter authentication requirements for digital transactions, requiring at least two distinct authentication factors, one of them dynamic, for every UPI transfer.\n\nHistorically, UPI has experienced transaction failure rates of as much as 15-30% during volume surges. With volumes expected to rise from 24 billion to 50 billion transactions within two years, the underlying IT infrastructure will need continued investment to support real-time processing at scale.\n\nCybersecurity requirements are evolving just as quickly. Fraud detection is moving from rule-based systems towards artificial intelligence (AI)-driven models that can continuously learn new attack patterns. Last year, the financial fraud risk indicator helped prevent \u20b9 660 crore in fraud losses.\n\nThe question, then, is who pays for the next phase of investment. Under the new framework, part of that cost will be borne by merchants on qualifying transactions.\n\nThe same logic applies to newer UPI features. Credit-on-UPI, UPI Circle and international expansion to eight countries require continued investment in product development, regulatory compliance and infrastructure.", "source": "LiveMint Money", "pub_date_str": "22 Sep 2026, 12:20 PM IST", "pub_date_relative": "48m ago", "cfa_topics": ["Quantitative Methods", "Financial Statement Analysis", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "Volkswagen Warning Fails to Derail Optimism About Auto Stocks", "full_content": "(Bloomberg) -- So much bad news is priced into European auto stocks that some see Volkswagen AG\u2019s profit warning as further evidence that things can only get better for the struggling sector.\n\nThe automobiles and parts index is the second-biggest laggard of 2026, but lately there have been signs that it is turning the corner. The group has climbed 3.2% since the end of June while the market was flat, helped by the prospect of protectionist measures and major cost cuts.\n\nThe nascent recovery was severely tested on Friday as Volkswagen, Europe\u2019s biggest carmaker, slashed its profit forecast and said it expects an operating margin of no more than 1%. The news drew an analyst downgrade, but ultimately triggered only a brief selloff among peers. The sector rebounded on Monday.\n\nGoldman Sachs Group Inc. analyst Christian Frenes said the announcement was \u201cmaterial in optics but limited in incremental information content.\u201d He added that the company \u201cis largely aligning its assumptions with market realities that have been evident for some time.\u201d\n\nThe autos sub-index has slumped 16% this year as carmakers buckled under the twin impacts of competition from cheaper Chinese models at home and weak consumer spending in the Asian country, historically a big market for the likes of Mercedes-Benz Group AG and BMW AG.\n\nInvestors are betting that European regulators have taken note of carmakers\u2019 travails. An October deadline to address trade imbalances between the EU and China has come with an expectation that Europe will attempt to limit the availability of cheap Chinese cars in the region. European leaders have blamed a record trade disparity on overcapacity and unfair trading practices by China, charges Beijing denies.\n\n\u201cIf regulators go further and compel Chinese OEMs to source from western suppliers and comply with the full breadth of European regulations, their cost advantage could diminish materially,\u201d RBC analyst Tom Narayan wrote.", "source": "LiveMint Markets", "pub_date_str": "22 Sep 2026, 12:17 PM IST", "pub_date_relative": "51m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Swastika Infra IPO GMP Today: What Grey Market Signals Ahead Of September 23 Opening", "full_content": "Swastika Infra IPO opens Sept. 23 with a GMP of Rs 9.5, implying a listing price of Rs 194.5 and a 5.14% premium over the issue price.", "source": "NDTV Profit", "pub_date_str": "22 Sep 2026, 12:16 PM IST", "pub_date_relative": "51m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "AI optimism lifts Asian stocks after Nasdaq ends at record high", "full_content": "Taiwan\u2019s tech-heavy index hits highest level after rising more than 60% this year", "source": "FT Markets", "pub_date_str": "22 Sep 2026, 12:15 PM IST", "pub_date_relative": "53m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Meesho shares rally 12% after UBS hikes target price by 24%. What\u2019s keeping analysts bullish?", "full_content": "UBS has raised its Meesho estimates across NMV, contribution profit and EBITDA, citing stronger seller and buyer growth and improving unit economics. The brokerage expects contribution margins to expand as logistics costs ease and advertising revenue grows. Meesho\u2019s ability to sustain user additions, ordering frequency and NMV growth remains central to its outlook.", "source": "Economic Times Markets", "pub_date_str": "22 Sep 2026, 12:14 PM IST", "pub_date_relative": "54m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Transrail Lighting shares surge 13% | Is the pullback set to continue? Experts weigh in", "full_content": "Transrail Lighting surged nearly 13% after announcing a 70% increase in conductor manufacturing capacity at its Silvassa facility, rising to 40,800 km. The company is pursuing a second expansion phase to double capacity, emphasizing the potential for revenue growth and enhanced project execution.", "source": "LiveMint Markets", "pub_date_str": "22 Sep 2026, 12:09 PM IST", "pub_date_relative": "59m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}], "updated_at": "22 Sep 2026, 01:08 PM IST", "total_stories": 378};

    document.addEventListener("DOMContentLoaded", () => {

        renderAll();

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>

</body>
</html>
