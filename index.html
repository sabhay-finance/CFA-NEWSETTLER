    const allData = {"general": [{"title": "Saudis shut down oil pipeline as Houthis tighten grip on Red Sea shipping", "full_content": "", "source": "Investing.com News", "pub_date_str": "12 Sep 2026, 12:54 PM IST", "pub_date_relative": "11m ago"}, {"title": "Ford to recall about 223,500 U.S. vehicles over fuel tank issues", "full_content": "", "source": "Investing.com News", "pub_date_str": "12 Sep 2026, 12:54 PM IST", "pub_date_relative": "11m ago"}, {"title": "Hawkins Cookers FD opens on September 16; Know interest rates, minimum deposit required and other details", "full_content": "Hawkins Cookers Ltd. is set open a fresh fixed deposit (FD) scheme on September 16, offering investors interest rates of up to 8% for a 36-month tenure. Investors can apply from 9:30 am onwards, while the applications will be considered on a first-come, first-serve basis.\n\nThe unsecured deposit programme has been assigned an [ICRA] AA- (Stable) rating, which translates to high credit quality with low credit risk, according to the company's circular. It also claimed that it has no history of defaults on statutory dues or on loans from banks and financial institutions.\n\nThe new FD scheme will offer interest rates of 7.5% per annum for 13-month tenure, 7.75% per annum for 24 months and 8% per annum for 36 months, Hawkins Cookers' advertising circular states.\n\nThe minimum deposit required is \u20b9 25,000, while additional amounts can be placed in multiples of \u20b9 1,000. The maximum amount that an investor can place in new or renewed fixed deposits under the scheme is \u20b9 50 lakh.\n\nUnder the cumulative option, interest will be compounded monthly. A deposit of \u20b9 25,000 will mature at \u20b9 27,109 after 13 months, \u20b9 29,177 after 24 months and \u20b9 31,756 after 36 months.\n\nInvestors can also choose the non-cumulative option, under which interest will be payable on a half-yearly basis. The deposit tenure can extend up to three years.\n\nInterest payments and repayment of deposits will be made through ECS, direct credit, RTGS or NEFT, subject to applicable SEBI and RBI regulations\n\nHawkins has been raising FDs for over a decade, making the latest scheme part of an established funding programme. The interest rates offered under the new scheme are lower than those given under some earlier offerings, highlighting the shift in the interest-rate environment and the company\u2019s funding needs.", "source": "LiveMint Money", "pub_date_str": "12 Sep 2026, 12:44 PM IST", "pub_date_relative": "21m ago"}, {"title": "India-China trade: The numbers behind the relationship as Xi visits Delhi", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a India-China trade: The numbers behind the relationship as Xi visits Delhi The Economic Times daily newspaper is available online now. Read Today's Paper India-China trade: The numbers behind the relationship as Xi visits Delhi SECTIONS India-China trade: The numbers behind the relationship as Xi visits Delhi ET Online Last Updated: Sep 12, 2026, 12:34:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Chinese President Xi Jinping's visit highlights India-China trade's stark imbalance. India's imports from China vastly exceed its exports, creating a record deficit. Chinese industrial inputs are deeply embedded in India's critical manufacturing sectors. Bilateral goods trade reached $151 billion, with imports dominating the exchange. This economic relationship unfolds against the backdrop of an expanding BRICS grouping.\n\nET Prime special: Know Your Company \u2013 Coal India, Part 1: One tonne of coal, two prices\n\nHormuz is a state, not a strait. There are 10 other possible chokepoints for the global economy, including India\n\nBigger or Better: One order from Power Grid Corp added $1 billion to the market cap of a company \u2013 Final part\n\nBanks have received a flood of money. Now comes the real test\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers\n\nLogin using your ET Prime credentials to enjoy all member benefits", "source": "Economic Times Economy", "pub_date_str": "12 Sep 2026, 12:34 PM IST", "pub_date_relative": "31m ago"}, {"title": "Bitcoin consolidates above $76,500 support: Live levels", "full_content": "", "source": "Investing.com News", "pub_date_str": "12 Sep 2026, 12:32 PM IST", "pub_date_relative": "33m ago"}, {"title": "Sebi proposes changes to expiry settlement as closing auction faces pushback", "full_content": "The Securities and Exchange Board of India (Sebi) has proposed a revamp of the closing auction session (CAS) framework following concerns that the month-old system was leading to abrupt price swings and market uncertainty.\n\nIn a consultation paper issued on Saturday, the market regulator suggested expiry-day settlement prices for index and stock derivatives could be calculated using trades from the last 30 minutes of the continuous trading session (CTS) and 10 minutes of the closing auction session (CAS), under a blended volume-weighted average price (VWAP) approach.\n\nAs an alternative, the regulator has proposed retaining the existing VWAP methodology initially, with settlement based only on trades during the final 30 minutes of continuous trading, before potentially shifting to the blended approach after at least a year of experience with CAS .\n\nMint was the first to report on 7 September that the stock market regulator may look to bring back the old mechanism to settle derivative contracts on expiry days, with a proposal to settle weekly and monthly derivatives using the previous VWAP model, or using a combination of VWAP and CAS prices.\n\nThe proposals come barely weeks after CAS was introduced for F&O stocks on 3 August. Under the new framework, the closing price of securities is determined through an auction rather than the VWAP of trades in the final 30 minutes of continuous trading.", "source": "LiveMint Markets", "pub_date_str": "12 Sep 2026, 12:26 PM IST", "pub_date_relative": "39m ago"}, {"title": "De-dollarisation: BRICS takes a measured route, focuses more on payments and not on common currency", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a De-dollarisation: BRICS takes a measured route, focuses more on payments and not on common currency The Economic Times daily newspaper is available online now. Read Today's Paper BRICS treads carefully on de-dollarisation: Main focus on payments, not a common currency SECTIONS BRICS treads carefully on de-dollarisation: Main focus on payments, not a common currency PTI Last Updated: Sep 12, 2026, 12:25:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis There is no mention of a common BRICS currency or a formal call for replacement of the US dollar. Instead, the document sticks to the more incremental, technocratic language the bloc has used since Rio and Kazan: interoperable payment systems, local-currency settlement, and voluntary cooperation among members who \"respect national priorities.\"\n\nET Prime special: Know Your Company \u2013 Coal India, Part 1: One tonne of coal, two prices\n\nHormuz is a state, not a strait. There are 10 other possible chokepoints for the global economy, including India\n\nBigger or Better: One order from Power Grid Corp added $1 billion to the market cap of a company \u2013 Final part\n\nBanks have received a flood of money. Now comes the real test\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers\n\nLogin using your ET Prime credentials to enjoy all member benefits", "source": "Economic Times Economy", "pub_date_str": "12 Sep 2026, 12:25 PM IST", "pub_date_relative": "40m ago"}, {"title": "Sebi proposes new CAS framework, two options for expiry-day settlement", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Sebi proposes new CAS framework, two options for expiry-day settlement The Economic Times daily newspaper is available online now. Read Today's Paper Sebi proposes new CAS framework, two options for expiry-day settlement SECTIONS Sebi proposes new CAS framework, two options for expiry-day settlement By Kumar Gaurav , ETMarkets.com Last Updated: Sep 12, 2026, 12:26:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Securities and Exchange Board of India (SEBI) is set to implement crucial updates to the Closing Auction Session. A focus of these changes is on the process of derivatives settlement on expiry days. SEBI has laid out two alternatives for determining the derivatives settlement price: the first proposes a blended VWAP approach after one year, while the second keeps the current CTS VWAP process in place for the present.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "12 Sep 2026, 12:15 PM IST", "pub_date_relative": "50m ago"}, {"title": "Gold rate today under pressure as soaring crude oil price fuels US Fed rate hike buzz | Resistance, support to outlook", "full_content": "Gold rate today: Amid soaring crude oil prices due to escalating tensions in the US-Iran war , rising US Treasury yields, and a strong US dollar (USD), gold prices today are under pressure. The renewed tension from rising inflation has fueled buzz about a US Fed rate hike at next week's US Fed meeting , scheduled for 15th to 16th September 2026.\n\nIn the international market, the COMEX gold price finished around 1.50% lower at $4,408.90 per ounce, whereas the MCX gold rate edged higher last week and ended at \u20b9 1,52,784 per 10 gm, but ended below 20-DEMA on the technical chart.\n\nOn triggers that are dragging gold price today , Ponmudi R, CEO at Enrich Money, said, \u201cThe gold rate today is on edge as another surge in oil prices fed into inflation expectations and pushed markets to sharply raise the odds of a US Fed rate hike at next week\u2019s US Fed meeting. The resulting pressure on precious metals drove gold and silver into their third consecutive weekly declines, although both staged a notable rebound on Friday despite a hotter-than-expected headline inflation reading.\u201d\n\nPointing towards the major drag for the gold and silver rates today, Ponmudi R of Enrich Money said, \u201cOil once again dominated the commodity landscape, with WTI crude rising above $104 a barrel, gaining 9.6% over the five sessions and nearly 16% over the past month as US\u2013Iran tension continued to escalate.\u201d\n\nThe Enrich Money expert said the US diesel prices also climbed above $6 a gallon for the first time, underscoring the growing inflationary impact of higher energy costs. The sustained rise in crude has increasingly become the key transmission channel linking geopolitical tensions with inflation expectations and Federal Reserve policy.\n\nPointing towards the impact of soaring crude oil prices on the US Fed meeting outcome next week, Anuj Gupta, a SEBI-registered market expert, said, \u201cThe soaring crude oil price due to the US-Iran tension has renewed the inflation fear.", "source": "LiveMint Markets", "pub_date_str": "12 Sep 2026, 12:15 PM IST", "pub_date_relative": "50m ago"}, {"title": "Wrong ITR form led to \u20b926.69 lakh tax demand: How ITAT Chandigarh saved a small trader", "full_content": "A lapse of concentration by a small trader while filing his income tax returns resulted in a \u20b9 26.69 lakh tax demand. This occurred after the tax department treated the \u2018commission receipts\u2019 that were already included in the taxpayer's business income as fresh income.\n\nThe Income Tax Appellate Tribunal (ITAT), Chandigarh, has now deleted the entire addition, clearly explaining why it is necessary for taxpayers and tax authorities responsible for checking tax returns to distinguish between a filing error and actual income concealment, as they are entirely different.\n\nThis is a case concerning the assessment year 2017-18 and involves commission earned from the sale of mobile recharges and SIM cards, as reported by Moneycontrol. The taxpayer here, while filing their tax return, filed ITR-4 instead of ITR-3 for business income. This resulted in a \u2018procedural discrepancy.\u2019\n\nDuring the processing of the tax return under Section 143(1) of the Income Tax Act, 1961, the Centralised Processing Centre (CPC) relied entirely on Form 26AS, which showed gross commission receipts of \u20b9 26,69, 319 as reported by telecom operators after calculating and deducting tax under Section 194H.\n\nThe taxpayer , on his part, maintained that these receipts were already included in his clearly declared business income details. That is why adding the entire amount again resulted in the same income being taxed twice, as per him.\n\nFurthermore, the taxpayers' Section 154 rectification application was also rejected. This was followed by the dismissal of his appeal before the Commissioner of Income Tax (Appeals).", "source": "LiveMint Money", "pub_date_str": "12 Sep 2026, 12:12 PM IST", "pub_date_relative": "53m ago"}, {"title": "Houthis seize Red Sea coast as Saudi pipeline shutdown deepens oil risks", "full_content": "", "source": "Investing.com News", "pub_date_str": "12 Sep 2026, 12:09 PM IST", "pub_date_relative": "56m ago"}, {"title": "Trump's America-first world is pushing other powers to hedge their bets", "full_content": "When Chinese President Xi Jinping, Russian President Vladimir Putin and Indian Prime Minister Narendra Modi were together in China last year , images of the three leaders smiling, holding hands and chatting animatedly went viral.\n\nThis weekend, they meet again in New Delhi against an increasingly complicated geopolitical backdrop.\n\nIndia is hosting leaders of BRICS, a grouping of major emerging economies seeking greater influence in a global system long dominated by the U.S. and other Western powers. Xi, Putin and Iranian President Masoud Pezeshkian are among those expected to attend alongside Modi.\n\nThe U.S. and Israel are at war with Iran, Washington continues to push Moscow toward a deal to end the war in Ukraine, and U.S. President Donald Trump's trade policies have disrupted relationships with allies and rivals alike.\n\nAgainst that backdrop, the summit will put the spotlight on whether those pressures are giving some BRICS members more reason to cooperate on trade, energy and payments, even as deep divisions limit how far that cooperation can go.\n\nTrump's policies are not the reason these countries are talking. India and Russia have maintained close relations for decades, while the India-China thaw began before the latest U.S. trade tensions. But tariffs, sanctions and other economic pressure from Washington are adding another factor to their calculations.\n\nXi's visit will be his first to India since 2019, marking another step in a cautious thaw after deadly clashes along the countries' disputed Himalayan border in 2020.\n\nModi and Xi have sought to stabilize ties, with flights, visas and high-level contacts being restored. But tensions remain over their border, India's large trade deficit with Beijing and their strategic rivalry across Asia.", "source": "CNBC Top News", "pub_date_str": "12 Sep 2026, 11:55 AM IST", "pub_date_relative": "1h ago"}, {"title": "BRICS Summit 2026 Live Updates: PM Modi Meets Malaysian PM Anwar Ibrahim", "full_content": "Iran's President Masoud Pezeshkian, Russia's President Vladimir Putin, India's Prime Minister Narendra Modi, South Africa's President Cyril Ramaphosa and Brazil's Foreign Minister Mauro Vieira during the BRICS Business Forum", "source": "NDTV Profit", "pub_date_str": "12 Sep 2026, 11:41 AM IST", "pub_date_relative": "1h ago"}, {"title": "Burnham faces UK economic test as budget day approaches", "full_content": "", "source": "Investing.com News", "pub_date_str": "12 Sep 2026, 11:31 AM IST", "pub_date_relative": "1h ago"}, {"title": "Oracle Plans More Job Cuts, Adds $700 Million To Restructuring Costs Amid AI Spending", "full_content": "Oracle is reportedly under financial strain from an expensive expansion of AI data centres built for customers including OpenAI, having already begun cutting thousands of jobs earlier this year to conserve cash.", "source": "NDTV Profit", "pub_date_str": "12 Sep 2026, 11:29 AM IST", "pub_date_relative": "1h ago"}, {"title": "PMS Tracker: East Green, Atlas Integrated Finance, Hem Securities, 7 others deliver up to 14.7% returns in August", "full_content": "Home ETPrime Markets Mark orrowing costs are logical given the present situation, according to Governing Council member Ulo Kaasik.\n\n\u201cIt\u2019s true the markets are expecting the interest-rate hiking cycle to continue, and looking at the current developments it\u2019s understandable why the markets think that,\u201d the Estonian official told Aripaev on Friday.\n\nThe remarks come less than a day after the ECB delivered a widely anticipated quarter-point rate hike to 2.5%, the second since the start of the Middle East war. Officials expect to raise borrowing costs further to contain inflation that\u2019s hovering around 3%, with another increase possible as soon as next month, Bloomberg reported on Thursday.\n\nWith oil back above $100 a barrel, investors are now pricing in three more hikes.\n\n\u201cI would certainly not consider the current level very high yet,\u201d Kaasik said. \u201cRather it\u2019s a level that should not yet perhaps directly tighten economic activity too much.\u201d\n\nSpeaking separately, his Lithuanian counterpart Gediminas Simkus stressed that consumer-price growth is too strong.\n\n\u201cInflation is too high both in the euro zone and in Lithuania,\u201d he told national broadcaster LRT on Friday. \u201cGiven that the decision was made only yesterday, I will certainly refrain from speculating on what the ECB\u2019s future decisions might be,\u201d Simkus said.\n\nThursday\u2019s rate increase \u201cisn\u2019t a decision aimed at the future,\u201d Simkus said. \u201cRecent events have taught us to be truly responsible when communicating about what future decisions might entail.\u201d", "source": "LiveMint Markets", "pub_date_str": "12 Sep 2026, 11:25 AM IST", "pub_date_relative": "1h ago"}, {"title": "Concurrent Gainers: 9 smallcap stocks gain for 5 days in a row", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News Concurrent Gainers: 9 smallcap stocks gain for 5 days in a row Written by Ritesh Presswala , ETMarkets.com | Sep 12, 2026, 11:38:09 AM IST 1 / 13 \u200bConsistent performers Over the five trading sessions ending September 11, the Sensex declined 2.27%, or 1,734 points, to close at 74,781, falling in four of the five sessions. Despite the broader market weakness, about 17 stocks from the BSE SmallCap index advanced in each of the five consecutive sessions from September 7 to September 11. Of these, we identified 12 stocks that gained on all five days, delivering cumulative returns ranging from 10% to 30% during the period. (Data Source: ACE Equity)", "source": "Economic Times Markets", "pub_date_str": "12 Sep 2026, 11:25 AM IST", "pub_date_relative": "1h ago"}, {"title": "8th Pay Commission: Central government employees seek 5 MACP upgrades and promotional pay scales", "full_content": "The 8th Pay Commission has recently concluded its Puducherry visit on 9 September, and is now gearing up for its upcoming visit to Chandigarh on 16, 17 and 18th September, 2026. It is important to note that the 8th Pay Commission is a temporary body that was constituted by the central government on 3 November 2025.\n\nThe 8th Pay Commission, headed by Justice Ranjana Prakash Desai, with Prof. Pulak Ghosh as a part-time member and Pankaj Jain as member secretary, was given 18 months by the central government from its constitution to complete consultations and discussions with eligible unions and associations and to table its final report.\n\nThis means that with more than 10 months already elapsed, we are now at the business end of the consultation process, before the panel proceeds to draft their final recommendations. In line with this, central government employees and unions are putting forward their demands, grievances, and aspirations before the 8th Pay Commission to bring about constructive and meaningful changes in the lives of serving employees and pensioners.\n\nOne such demand revolves around the Modified Assured Career Progression (MACP) scheme. Central government employees are seeking major changes to the Modified Assured Career Progression (MACP) scheme ahead of the 8th Pay Commission.\n\nIn order to ensure the same, multiple employees' associations have demanded more financial upgradations, shorter waiting periods and pay progression linked to promotional hierarchy. This write-up is dedicated towards discussing these demands and their implications in detail.\n\nIn its present state, the MACP scheme provides serving employees with three financial upgradations after 10, 20 and 30 years of service.", "source": "LiveMint Money", "pub_date_str": "12 Sep 2026, 10:58 AM IST", "pub_date_relative": "2h ago"}, {"title": "Global funds retreat from Indian stocks as some cut exposure to zero - Bloomberg", "full_content": "", "source": "Investing.com News", "pub_date_str": "12 Sep 2026, 10:47 AM IST", "pub_date_relative": "2h ago"}], "cfa": [{"title": "Hawkins Cookers FD opens on September 16; Know interest rates, minimum deposit required and other details", "full_content": "Hawkins Cookers Ltd. is set open a fresh fixed deposit (FD) scheme on September 16, offering investors interest rates of up to 8% for a 36-month tenure. Investors can apply from 9:30 am onwards, while the applications will be considered on a first-come, first-serve basis.\n\nThe unsecured deposit programme has been assigned an [ICRA] AA- (Stable) rating, which translates to high credit quality with low credit risk, according to the company's circular. It also claimed that it has no history of defaults on statutory dues or on loans from banks and financial institutions.\n\nThe new FD scheme will offer interest rates of 7.5% per annum for 13-month tenure, 7.75% per annum for 24 months and 8% per annum for 36 months, Hawkins Cookers' advertising circular states.\n\nThe minimum deposit required is \u20b9 25,000, while additional amounts can be placed in multiples of \u20b9 1,000. The maximum amount that an investor can place in new or renewed fixed deposits under the scheme is \u20b9 50 lakh.\n\nUnder the cumulative option, interest will be compounded monthly. A deposit of \u20b9 25,000 will mature at \u20b9 27,109 after 13 months, \u20b9 29,177 after 24 months and \u20b9 31,756 after 36 months.\n\nInvestors can also choose the non-cumulative option, under which interest will be payable on a half-yearly basis. The deposit tenure can extend up to three years.\n\nInterest payments and repayment of deposits will be made through ECS, direct credit, RTGS or NEFT, subject to applicable SEBI and RBI regulations\n\nHawkins has been raising FDs for over a decade, making the latest scheme part of an established funding programme. The interest rates offered under the new scheme are lower than those given under some earlier offerings, highlighting the shift in the interest-rate environment and the company\u2019s funding needs.", "source": "LiveMint Money", "pub_date_str": "12 Sep 2026, 12:44 PM IST", "pub_date_relative": "21m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "India-China trade: The numbers behind the relationship as Xi visits Delhi", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a India-China trade: The numbers behind the relationship as Xi visits Delhi The Economic Times daily newspaper is available online now. Read Today's Paper India-China trade: The numbers behind the relationship as Xi visits Delhi SECTIONS India-China trade: The numbers behind the relationship as Xi visits Delhi ET Online Last Updated: Sep 12, 2026, 12:34:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Chinese President Xi Jinping's visit highlights India-China trade's stark imbalance. India's imports from China vastly exceed its exports, creating a record deficit. Chinese industrial inputs are deeply embedded in India's critical manufacturing sectors. Bilateral goods trade reached $151 billion, with imports dominating the exchange. This economic relationship unfolds against the backdrop of an expanding BRICS grouping.\n\nET Prime special: Know Your Company \u2013 Coal India, Part 1: One tonne of coal, two prices\n\nHormuz is a state, not a strait. There are 10 other possible chokepoints for the global economy, including India\n\nBigger or Better: One order from Power Grid Corp added $1 billion to the market cap of a company \u2013 Final part\n\nBanks have received a flood of money. Now comes the real test\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers\n\nLogin using your ET Prime credentials to enjoy all member benefits", "source": "Economic Times Economy", "pub_date_str": "12 Sep 2026, 12:34 PM IST", "pub_date_relative": "31m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Bitcoin consolidates above $76,500 support: Live levels", "full_content": "", "source": "Investing.com News", "pub_date_str": "12 Sep 2026, 12:32 PM IST", "pub_date_relative": "33m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Sebi proposes changes to expiry settlement as closing auction faces pushback", "full_content": "The Securities and Exchange Board of India (Sebi) has proposed a revamp of the closing auction session (CAS) framework following concerns that the month-old system was leading to abrupt price swings and market uncertainty.\n\nIn a consultation paper issued on Saturday, the market regulator suggested expiry-day settlement prices for index and stock derivatives could be calculated using trades from the last 30 minutes of the continuous trading session (CTS) and 10 minutes of the closing auction session (CAS), under a blended volume-weighted average price (VWAP) approach.\n\nAs an alternative, the regulator has proposed retaining the existing VWAP methodology initially, with settlement based only on trades during the final 30 minutes of continuous trading, before potentially shifting to the blended approach after at least a year of experience with CAS .\n\nMint was the first to report on 7 September that the stock market regulator may look to bring back the old mechanism to settle derivative contracts on expiry days, with a proposal to settle weekly and monthly derivatives using the previous VWAP model, or using a combination of VWAP and CAS prices.\n\nThe proposals come barely weeks after CAS was introduced for F&O stocks on 3 August. Under the new framework, the closing price of securities is determined through an auction rather than the VWAP of trades in the final 30 minutes of continuous trading.", "source": "LiveMint Markets", "pub_date_str": "12 Sep 2026, 12:26 PM IST", "pub_date_relative": "39m ago", "cfa_topics": ["Equity Investments", "Derivatives"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "De-dollarisation: BRICS takes a measured route, focuses more on payments and not on common currency", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a De-dollarisation: BRICS takes a measured route, focuses more on payments and not on common currency The Economic Times daily newspaper is available online now. Read Today's Paper BRICS treads carefully on de-dollarisation: Main focus on payments, not a common currency SECTI i proposes new CAS framework, two options for expiry-day settlement By Kumar Gaurav , ETMarkets.com Last Updated: Sep 12, 2026, 12:26:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Securities and Exchange Board of India (SEBI) is set to implement crucial updates to the Closing Auction Session. A focus of these changes is on the process of derivatives settlement on expiry days. SEBI has laid out two alternatives for determining the derivatives settlement price: the first proposes a blended VWAP approach after one year, while the second keeps the current CTS VWAP process in place for the present.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "12 Sep 2026, 12:15 PM IST", "pub_date_relative": "50m ago", "cfa_topics": ["Equity Investments", "Derivatives"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Gold rate today under pressure as soaring crude oil price fuels US Fed rate hike buzz | Resistance, support to outlook", "full_content": "Gold rate today: Amid soaring crude oil prices due to escalating tensions in the US-Iran war , rising US Treasury yields, and a strong US dollar (USD), gold prices today are under pressure. The renewed tension from rising inflation has fueled buzz about a US Fed rate hike at next week's US Fed meeting , scheduled for 15th to 16th September 2026.\n\nIn the international market, the COMEX gold price finished around 1.50% lower at $4,408.90 per ounce, whereas the MCX gold rate edged higher last week and ended at \u20b9 1,52,784 per 10 gm, but ended below 20-DEMA on the technical chart.\n\nOn triggers that are dragging gold price today , Ponmudi R, CEO at Enrich Money, said, \u201cThe gold rate today is on edge as another surge in oil prices fed into inflation expectations and pushed markets to sharply raise the odds of a US Fed rate hike at next week\u2019s US Fed meeting. The resulting pressure on precious metals drove gold and silver into their third consecutive weekly declines, although both staged a notable rebound on Friday despite a hotter-than-expected headline inflation reading.\u201d\n\nPointing towards the major drag for the gold and silver rates today, Ponmudi R of Enrich Money said, \u201cOil once again dominated the commodity landscape, with WTI crude rising above $104 a barrel, gaining 9.6% over the five sessions and nearly 16% over the past month as US\u2013Iran tension continued to escalate.\u201d\n\nThe Enrich Money expert said the US diesel prices also climbed above $6 a gallon for the first time, underscoring the growing inflationary impact of higher energy costs. The sustained rise in crude has increasingly become the key transmission channel linking geopolitical tensions with inflation expectations and Federal Reserve policy.\n\nPointing towards the impact of soaring crude oil prices on the US Fed meeting outcome next week, Anuj Gupta, a SEBI-registered market expert, said, \u201cThe soaring crude oil price due to the US-Iran tension has renewed the inflation fear.", "source": "LiveMint Markets", "pub_date_str": "12 Sep 2026, 12:15 PM IST", ith oil back above $100 a barrel, investors are now pricing in three more hikes.\n\n\u201cI would certainly not consider the current level very high yet,\u201d Kaasik said. \u201cRather it\u2019s a level that should not yet perhaps directly tighten economic activity too much.\u201d\n\nSpeaking separately, his Lithuanian counterpart Gediminas Simkus stressed that consumer-price growth is too strong.\n\n\u201cInflation is too high both in the euro zone and in Lithuania,\u201d he told national broadcaster LRT on Friday. \u201cGiven that the decision was made only yesterday, I will certainly refrain from speculating on what the ECB\u2019s future decisions might be,\u201d Simkus said.\n\nThursday\u2019s rate increase \u201cisn\u2019t a decision aimed at the future,\u201d Simkus said. \u201cRecent events have taught us to be truly responsible when communicating about what future decisions might entail.\u201d", "source": "LiveMint Markets", "pub_date_str": "12 Sep 2026, 11:25 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Concurrent Gainers: 9 smallcap stocks gain for 5 days in a row", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News Concurrent Gainers: 9 smallcap stocks gain for 5 days in a row Written by Ritesh Presswala , ETMarkets.com | Sep 12, 2026, 11:38:09 AM IST 1 / 13 \u200bConsistent performers Over the five trading sessions ending September 11, the Sensex declined 2.27%, or 1,734 points, to close at 74,781, falling in four of the five sessions. Despite the broader market weakness, about 17 stocks from the BSE SmallCap index advanced in each of the five consecutive sessions from September 7 to September 11. Of these, we identified 12 stocks that gained on all five days, delivering cumulative returns ranging from 10% to 30% during the period. (Data Source: ACE Equity)", "source": "Economic Times Markets", "pub_date_str": "12 Sep 2026, 11:25 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "EPF money withdrawal: When can employees claim their provident fund amount in advance?", "full_content": "There can be situations when you need to access your retirement savings before exiting the workforce, especially if you do not have enough money set aside for emergencies. These could include funding medical expenses, a family member's education or marriage, or even getting your house renovated.\n\nThe Employees' Provident Fund Organisation ( EPFO ) allows members to make partial withdrawals, known as EPF advances, for certain purposes, with eligibility conditions and limits on how often they can be claimed.\n\nHowever, one must remember that if provident fund is withdrawn before completing five years of continuous service and the withdrawal amount exceeds \u20b9 50,000 in a financial year, it becomes taxable. Here are some of the circumstances in which employees can withdraw their PF savings in advance.\n\nOne of the biggest changes concerns how much of their provident fund corpus employees can withdraw if they resign without having another job offer or lose their job for any other reason.\n\nEPF members can now withdraw up to 75% of their EPF balance immediately after losing or leaving a salaried job. Meanwhile, the remaining 25% of the EPF balance will become available only after you complete 12 months of continuous unemployment.\n\nFor education-related expenses for themselves or their family members, EPFO members are allowed to make advance withdrawals. This facility can be availed up to 10 times during the entire EPF membership.\n\nMedical treatment falls under the essential-needs category, with the revised rules giving individuals greater flexibility to use their EPF savings for urgent or substantial medical expenses.\n\nUnlike some other withdrawal categories, illness-related withdrawals are not subject to a fixed limit on the number of times a member can seek an advance, subject to the applicable rules.", "source": "LiveMint Money", "pub_date_str": "12 Sep 2026, 10:43 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Valuation question! Why did NSE cut its IPO size and price below unlisted market levels?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a Valuation question! Why did NSE cut its IPO size and price below unlisted market levels? Ashika Global Securities Share Price Authum Investment & Infrastructure Share Price Paisalo Digital Share Price Finkurve Financial Services Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Valuation question! Why did NSE cut its IPO size and price below unlisted market levels? SECTIONS Valuation question! Why did NSE cut its IPO size and price below unlisted market levels? By Akash Podishetti , ETMarkets.com Last Updated: Sep 12, 2026, 10:41:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis NSE MD and CEO Ashish Chauhan said the exchange had invited shareholders to tender shares before filing the draft red herring prospectus. He said bankers advised the exchange on pricing, while the IPO size was based on the shares tendered by shareholders on the day of the updated draft red herring prospectus.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "12 Sep 2026, 10:41 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Alternative Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Top stocks to Buy under \u20b9200: NHPC, IOCL, NBCC \u2014 Mehul Kothari of Anand Rathi stock recommends | Target, stop-loss", "full_content": "Mehul Kothari Stock Recommendations under \u20b9 200: The Indian stock market had a weak week (September 7\u201311, 2026), with the Sensex and Nifty 50 index declining for the fifth consecutive week amid soaring crude oil prices and geopolitical tensions. The Sensex fell from around 76,500 to 74,782, while the Nifty 50 index declined from nearly 23,900 to 23,398. The sell-off was largely driven by Brent crude crossing $100 per barrel and briefly touching $108, along with higher global bond yields, a weaker Indian National Rupee (INR) and broad-based selling. Although Thursday witnessed a modest recovery, Friday\u2019s volatile session erased most of the gains, with early losses followed by a partial rebound.\n\nMehul Kothari, Deputy Vice President \u2014 Technical Research at Anand Rathi, believes the Indian stock market is biased toward caution, as the Nifty 50 index is at a crucial support level of 23,200 to 23,100. However, the Anand Rathi expert expects a turnaround from this support, as the RSI is at its lowest level in the past few months.\n\nSpeaking on the outlook of the Nifty 50 index, Mehul Kothari of Anand Rathi said, \u201cThe index slipped towards 23,200 but importantly managed to hold its ground and recover from the lows. Going ahead, our view remains unchanged \u2014 the 23,200\u201323,100 zone is a crucial support area, and the market can start stabilising and turn around from these levels.\u201d\n\nThe daily RSI is now at its lowest levels seen in the past few months, while most lower time frames are already deeply oversold, suggesting that the scope for aggressive fresh selling may be limited from here.\n\n\u201cWe also expect crude prices to cool off somewhat, which could provide further relief to equities. On the upside, 23,600\u201323,800 remains the immediate hurdle, and a sustained move above this zone can trigger a sharper recovery.", "source": "LiveMint Markets", "pub_date_str": "12 Sep 2026, 10:39 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Fixed Income", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "De-dollarisation and its impact on commodities and global trade", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Forex \u203a Forex News \u203a De-dollarisation and its impact on commodities and global trade The Economic Times daily newspaper is available online now. Read Today's Paper De-dollarisation and its impact on commodities and global trade SECTIONS De-dollarisation and its impact on commodities and global trade By Hareesh V , ET CONTRIBUTORS Last Updated: Sep 12, 2026, 10:34:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis For decades, the US dollar has dominated global trade and commodity markets. Most commodities, including crude oil, natural gas, gold, industrial metals, and agricultural products, are priced and traded in dollars.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "12 Sep 2026, 10:34 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Will US 10-year bond yield crossing 5% really hurt markets? Yes Securities says fears overblown", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a Will US 10-year bond yield crossing 5% really hurt markets? Yes Securities says fears overblown Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Will US 10-year bond yield crossing 5% really hurt markets? Yes Securities says fears overblown SECTIONS Will US 10-year bond yield crossing 5% really hurt markets? Yes Securities says fears overblown By Debaroti Adhikary , ETMarkets.com Last Updated: Sep 12, 2026, 10:31:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The 10-year US Treasury yield has risen above 4.9% and is marching towards the crucial 5% level that it had last hit briefly in 2023. Yes Securities issued a contrarian bet, saying the rise in global yields increasingly reflects stronger nominal growth, a structurally higher equilibrium real rate and synchronised global monetary normalisation, rather than deteriorating economic fundamentals or an imminent fiscal crisis.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "12 Sep 2026, 10:31 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments", "Fixed Income"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Why data centers could be the next big market for catastrophe bonds", "full_content": "The rapid buildout of hyperscale data centers is creating tens of billions of dollars of concentrated physical assets \u2014 and an insurance challenge that traditional markets may struggle to handle on their own.\n\nThe soaring value of data center assets, which are increasingly concentrated in regions exposed to hurricanes, floods and other natural disasters, has underscored the need for insurance coverage .\n\nCAT bonds , or catastrophe bonds, could provide insurers and reinsurers with a way to offload some of that risk to capital market investors over the coming months, industry experts told CNBC, although the market is only just starting to take shape.\n\n\"The honest answer is that not a single dollar of data center risk has come to the cat bond market yet,\" said Ethan Powell, principal and chief investment officer of Brookmont Capital Management, a Texas-based firm with more than $1 billion in assets under management.\n\n\"What's happening right now is one layer upstream, through quota shares, sidecars and new reinsurance facilities, as reinsurers wrestle with how to price data center risk and find enough capacity to cover it.\"\n\nCAT bonds may become part of the solution, Powell said, particularly given that a single hyperscale campus could carry between $20 billion and $30 billion of insurable value, compared with roughly $66 billion outstanding across the entire CAT bond market.\n\n\"One campus can carry insured value equal to roughly a third of every catastrophe bond in existence. You cannot solve that with the traditional market alone. The arithmetic doesn't work, and that's why this ultimately ends up in the capital markets,\" Powell told CNBC by email.\n\nFirst created in the 1990s, CAT bonds refer to a type of financial instrument designed to raise money for insurers in the event of a natural disaster, such as a hurricane or earthquake.", "source": "CNBC World Economy", "pub_date_str": "12 Sep 2026, 10:30 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "L&T Leads India's Private Sector Into Tokenised Bond Market", "full_content": "L&T has raised Rs 500 crore through a three-year tokenised bond, becoming India's first private-sector corporate to issue such debt under SEBI's DLT framework, with settlement facilitated through a CBDC wallet.", "source": "NDTV Profit", "pub_date_str": "12 Sep 2026, 10:00 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Jefferies picks 5 financial stocks with upside of up to 25%. How many do you have?", "full_content": "With a stock price target price of Rs 1,250, the brokerage forecasts an upside of 17%. The lender will transition from a small-finance bank to a Universal bank that can lower funding cost, lift fees and strengthen brand to aid growth. Over FY26-29, strong deposit growth will aid credit growth of 22% CAGR and 29% in PPP (ex-treasury), highest in its coverage.", "source": "Economic Times Markets", "pub_date_str": "12 Sep 2026, 09:51 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}], "updated_at": "12 Sep 2026, 01:06 PM IST", "total_stories": 388};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
