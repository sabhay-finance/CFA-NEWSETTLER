    const allData = {"general": [{"title": "Linde delivers a good quarter and puts in a fix for an overhang on the stock", "full_content": "Slicing and dicing by end market for Linde's gases also looked solid.", "source": "CNBC Top News", "pub_date_str": "30 Oct 2026, 12:32 AM IST", "pub_date_relative": "1m ago"}, {"title": "Polymarket reports outage on international exchange, halts trading", "full_content": "Prediction market platform Polymarket's international platform is currently experiencing an outage following a hack of an unnamed third-party provider, the company said on Thursday.\n\nTraders first reported on social media platforms that they were seeing unauthorized withdrawals from their accounts on Thursday afternoon. In response, the company halted trading on its international platform.\n\nPolymarket said that it has fixed the issue on its end, and that trading will resume at 3:00 p.m. ET.\n\nThe company also said it will make whole any wallets that have been affected by the hack. A spokesperson also said it has referred the U.K. law enforcement, as that is the country of operation for the third-party provider.\n\nPolymarket's international prediction market exchange operates as a decentralized finance platform on the polygon blockchain and is not regulated in the U.S. The company's domestic exchange operated as normal during the outage.\n\nThe disruption comes just days before both the company's international and U.S. exchanges are expected to see heightened volumes during the U.S. midterm elections on Nov. 3.", "source": "CNBC Top News", "pub_date_str": "30 Oct 2026, 12:27 AM IST", "pub_date_relative": "5m ago"}, {"title": "Rare Stanley Druckenmiller post sends crypto-linked stock surging", "full_content": "The post appeared seemingly out of nowhere. Stanley Druckenmiller, the legendary hedge fund manager who brought the Bank of England to its knees in the 1990s, and whose annual returns are the envy of Wall Street, posted a simple message on an otherwise sparse X feed announcing his involvement with a new type of decentralized exchange. The post caused bedlam on social media and moved shares of a leading crypto treasury company and its token.\n\nTradeXYZ, the primary developer of perpetual futures, or \"perps\" markets, on exchange Hyperliquid, announced a partnership Thursday with Intercontinental Exchange (ICE) to bring its popular perpetual futures onshore into the U.S.\n\nShortly after the two said they are seeking regulatory approvals, Druckenmiller said on X that he is \"excited to be an investor in trade(xyz),\" and that he is \"looking forward to to using their innovative product to enhance my investment process.\" Representatives for Druckenmiller confirmed the statement to the Financial Times .\n\nOptions traders pounced on the closest publicly-traded play to the news: Hyperliquid Strategies (PURR) , the company that invests in the HYPE crypto token that powers the Hyperliquid exchange.\n\nMore than 111,000 options traded on Hyperliquid Strategies Thursday, more than six times the 30-day average, as underlying shares surged 19% to the highest in three weeks. The flows leaned bullish, with almost 86,000 calls and under 27,000 puts trading. Almost four times as many calls were likely initiated by buyers than puts, and of the top 10 trades, only one involved put-buying, Cboe LiveVol dat show.\n\n\"We are thrilled to see ICE partnering with Trade.XYZ to bring the markets and liquidity of Hyperliquid to American investors,\" David Schamis, CEO of Hyperliquid Strategies, said in a text.", "source": "CNBC Top News", "pub_date_str": "30 Oct 2026, 12:23 AM IST", "pub_date_relative": "9m ago"}, {"title": "Stock Market Today: Nasdaq Sinks 350 Points; Google Stock's Tumble in Focus \u2014 Live Updates - WSJ", "full_content": "Stock Market Today: Nasdaq Sinks 350 Points; Google Stock's Tumble in Focus \u2014 Live Updates WSJ Alphabet falls 12%, putting it on course for its biggest ever post-earnings drop CNBC Why Alphabet (GOOGL) shares are sliding today Yahoo Finance AI fears hammer Google parent\u2019s stock, erasing $500 billion in value NBC News Microsoft Up, Google Down. A Tale of Two Hyperscalers. The New York Times", "source": "Google News Business", "pub_date_str": "30 Oct 2026, 12:22 AM IST", "pub_date_relative": "10m ago"}, {"title": "Why Alphabet\u2019s stock is on track for its worst day ever after the latest results", "full_content": "A doubling of cloud revenue wasn\u2019t enough to appease Wall Street as investors grew more concerned that AI is hurting the company\u2019s ability to make money off search queries.", "source": "MarketWatch Top Stories", "pub_date_str": "30 Oct 2026, 12:20 AM IST", "pub_date_relative": "13m ago"}, {"title": "Why Microsoft stock isn't getting crushed like Google stock after its earnings report - Yahoo Finance", "full_content": "Why Microsoft stock isn't getting crushed like Google stock after its earnings report Yahoo Finance Press Release & Webcast Microsoft Wall Street's top analysts are loving Microsoft's Q1 results Yahoo Finance Microsoft stock jumps 4% as cloud growth drives earnings and revenue beat CNBC Microsoft's cloud growth, cash flow offer respite from AI spending fears Reuters", "source": "Google News Business", "pub_date_str": "30 Oct 2026, 12:19 AM IST", "pub_date_relative": "13m ago"}, {"title": "Dollar dips and euro rises after Fed, ECB rate decisions; pound extends gains", "full_content": "", "source": "Investing.com News", "pub_date_str": "30 Oct 2026, 12:15 AM IST", "pub_date_relative": "17m ago"}, {"title": "Why is Hyperliquid Strategies stock surging today?", "full_content": "", "source": "Investing.com News", "pub_date_str": "30 Oct 2026, 12:14 AM IST", "pub_date_relative": "18m ago"}, {"title": "Why is Trane Technologies stock sliding today?", "full_content": "", "source": "Investing.com News", "pub_date_str": "30 Oct 2026, 12:13 AM IST", "pub_date_relative": "19m ago"}, {"title": "Why is O\u2019Reilly Automotive stock sliding today?", "full_content": "", "source": "Investing.com News", "pub_date_str": "30 Oct 2026, 12:13 AM IST", "pub_date_relative": "19m ago"}, {"title": "Polymarket reports major outage, suspends trading actions", "full_content": "", "source": "Investing.com News", "pub_date_str": "30 Oct 2026, 12:12 AM IST", "pub_date_relative": "20m ago"}, {"title": "Explainer-What\u2019s next for law firm Weil Gotshal as it plans dissolution", "full_content": "", "source": "Investing.com News", "pub_date_str": "30 Oct 2026, 12:12 AM IST", "pub_date_relative": "20m ago"}, {"title": "Sugar prices rise amid rains in Brazil; arabica coffee hits one-month low", "full_content": "NEW YORK, Oct 29 (Reuters) - Raw sugar futures on ICE rose on Thursday as supply prospects worsened with more excess El Nino-linked rains forecast in top grower Brazil, while arabica coffee hit a one-month low.\n\n* Raw sugar \u200b\u200b\u200bsettled up 0.13 cent, or 0.7%, at 19.47 cents per lb, extending its recovery from Monday's 5.6% Brazilian currency-driven selloff.\n\n* Sugar production in Brazil's key center-south region fell 27.1% in the first half of October from a year earlier to 1.87 million metric tons, the Agriculture Ministry said on Wednesday.\n\n* The country's sugar areas have been battling excess El Nino-linked rains, and more are forecast for this weekend and for next week.\n\n* \"Sugar has been supported since July by declining forecasts for global supply, with heat and drought damaging Europe\u2019s beet crop and a lacklustre monsoon lowering expectations for India\u2019s cane crop,\" added broker AMDIS.\n\n* ICE arabica coffee futures settled down 1.3 cents, or 0.5%, at $2.8545 per lb\u200b, having hit their lowest since late September at 2.8080.\n\n* Weighing on coffee are signs the relentless drawdown in ICE-certified stocks might be moderating, with data showing more than 42,000 bags of coffee have arrived at exchange warehouses and are awaiting grading .\n\n* The weak Brazilian real is also weighing by encouraging mills, farmers and exporters in top grower Brazil to sell dollar-priced coffee futures because it raises their returns in local currency terms.", "source": "LiveMint Markets", "pub_date_str": "30 Oct 2026, 12:12 AM IST", "pub_date_relative": "20m ago"}, {"title": "Wall Street slides as Alphabet revenue miss revives AI capex jitters", "full_content": "", "source": "Investing.com News", "pub_date_str": "30 Oct 2026, 12:12 AM IST", "pub_date_relative": "20m ago"}, {"title": "It\u2019s the strangest job market the U.S. has ever seen. The low-hire, low-fire economy turns 3 years old.", "full_content": "America has always been a job-creating machine. It has broken down for three straight years, and the implications could be with us for a long time.", "source": "MarketWatch Top Stories", "pub_date_str": "30 Oct 2026, 12:12 AM IST", "pub_date_relative": "21m ago"}, {"title": "Guggenheim reiterates Sirius XM stock rating on stable trends", "full_content": "", "source": "Investing.com News", "pub_date_str": "30 Oct 2026, 12:10 AM IST", "pub_date_relative": "22m ago"}, {"title": "Why is eBay stock rallying today?", "full_content": "", "source": "Investing.com News", "pub_date_str": "30 Oct 2026, 12:10 AM IST", "pub_date_relative": "22m ago"}, {"title": "Why is Cheniere Energy stock surging today?", "full_content": "", "source": "Investing.com News", "pub_date_str": "30 Oct 2026, 12:09 AM IST", "pub_date_relative": "23m ago"}, {"title": "ServiceNow shares plunge 27% after earnings revive AI disruption fears", "full_content": "ServiceNow shares sank 27% on Thursday and headed for the worst day ever after the enterprise software company's third-quarter results underwhelmed, reigniting artificial intelligence disruption concerns.\n\n\"This was a little bit uncharacteristic for ServiceNow standards, just in terms of the lack of upside,\" Citi's Tyler Radke told CNBC on Thursday.\n\nRevenue grew more than 20% during the period to $4.11 billion, which was roughly in line with a $4.10 billion estimate from analysts polled by LSEG. Adjusted earnings came up short at $1.00 per share, compared to a forecast of $1.02.\n\nThe results did little to overturn recent \"SaaSpocalypse\" fears, or concerns that new AI capabilities will upend traditional software business models.\n\nThe stock drop came even after the company slightly lifted its full-year 2026 subscription revenue outlook to between $15.78 billion and $15.79 billion. Net new AI average contract value jumped 65%.\n\nOne factor spooking investors is the lack of immediate payoff for the company's investments in its newly formed forward-deployed engineering team that embeds in enterprises to build AI solutions, Radke said.\n\n\"It's just going to be a little bit longer of a waiting game, and so I think the market, you know, wanted to see something a little bit sooner,\" he said. \"I think you got to wait until next year to really see that inflection.\"\n\nWATCH : ServiceNow shares plummet in extended trading on mixed Q3 results", "source": "CNBC World Economy", "pub_date_str": "30 Oct 2026, 12:08 AM IST", "pub_date_relative": "24m ago"}, {"title": "Alaska Gov. orders probe of Peltola Senate campaign's alleged recruitment of 2nd Sullivan", "full_content": "Alaska Gov. Mike Dunleavy ordered an investigation into whether the alleged recruitment of a candidate named Dan Sullivan for the state's U.S. Senate race, where the incumbent shares the same name, violated criminal or civil laws.\n\nDunleavy's order late Wednesday was in response to a report by The New York Times Wednesday that people in the campaign of Democratic nominee Mary Peltola and senior advisors at the Democratic Senatorial Campaign Committee worked to recruit retired schoolteacher Dan Sullivan to run to draw votes from Sen. Dan Sullivan.\n\nPeltola's campaign and the DSCC, in response to the Times article, said they are not involved in the campaign of the retired teacher Sullivan.\n\nThe governor's order came as a federal judge in Alaska allowed Peltola's campaign and the DSCC to intervene in a U.S. Justice Department lawsuit that seeks to block the state from immediately certifying any Senate election result \"that may be impacted by voter confusion ... pending an investigation to determine whether votes cast for Daniel J. Sullivan were meant to be cast for Senator Sullivan.\"\n\nThe campaign, the DSCC and state election officials have asked Judge Sharon Gleason to dismiss that lawsuit before Election Day, Nov. 3.\n\nPresident Donald Trump has said he ordered the DOJ to file the suit.\n\nThe political stakes in the Alaska Senate race are potentially momentous. The winner of the contest could determine the balance of power in the Senate, where Republicans hold a six-vote majority.\n\nDunleavy, in announcing his order, noted that Alaska's Division of Elections had investigated concerns that the retired teacher's entry into the Senate primary was designed to confuse voters, which led the division to block him from that ballot. A state court judge reversed that order, and the Alaska Supreme Court upheld that ruling, allowing him on the ballot.", "source": "CNBC Top News", "pub_date_str": "30 Oct 2026, 12:02 AM IST", "pub_date_relative": "30m ago"}, {"title": "Stocks To Watch Today: Dixon Tech, Syrma SGS, Sun Pharma, Wipro, Trent Among Others", "full_content": "Investors will track a range of corporate developments, including leadership changes, capacity expansion plans, new orders, project commissioning, regulatory updates and strategic investments.", "source": "NDTV Profit", "pub_date_str": "30 Oct 2026, 12:01 AM IST", "pub_date_relative": "31m ago"}, {"title": "Our church has a $1.5 million bequest earning 3.75% in a bank account. Is inflation eroding it?", "full_content": "\u201cGiven the size and long-term nature of this gift, we want to make sure the funds are managed prudently.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "30 Oct 2026, 12:00 AM IST", "pub_date_relative": "33m ago"}, {"title": "Iovance, A Top 1% Biotech Stock, Crashes In A Surprise Lung Cancer Twist - Investor's Business Daily", "full_content": "Iovance, A Top 1% Biotech Stock, Crashes In A Surprise Lung Cancer Twist Investor's Business Daily IOVA Stock Heads For Worst Day In Over 17 Months, Retail Says \u2018Selling Is Not Done\u2019 \u2013 What\u2019s Driving The Fall? Yahoo Finance Why is Iovance Biotherapeutics stock sliding today? Investing.com Iovance sees long-term response for Amtagvi in first-line melanoma (IOVA:NASDAQ) Seeking Alpha Can Iovance Stock Fall 50%? Trefis", "source": "Google News Business", "pub_date_str": "29 Oct 2026, 11:51 PM IST", "pub_date_relative": "41m ago"}, {"title": "How Todd Gordon is trading Meta as the stock market rotates out of growth and into value names", "full_content": "The Street is again heavily questioning Meta's spending, says Todd Gordon.", "source": "CNBC Top News", "pub_date_str": "29 Oct 2026, 11:50 PM IST", "pub_date_relative": "42m ago"}, {"title": "\u2018Fancy cars hold no appeal\u2019: We have a 99% chance of outliving our life savings. Why not spend, spend, spend?", "full_content": "\u201cI\u2019m 68, she\u2019s 74, and we\u2019re both in good health. We married later in life and have no children.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "29 Oct 2026, 11:46 PM IST", "pub_date_relative": "47m ago"}, {"title": "Godrej Consumer Q2: Net Profit Up 14%, Rs 5 Interim Dividend Declared", "full_content": "Revenue surged 19% toRs 4,413 crore for the quarter ended on September 30, 2026 from Rs 3,708 crore in the corresponding period last year.", "source": "NDTV Profit", "pub_date_str": "29 Oct 2026, 11:44 PM IST", "pub_date_relative": "48m ago"}, {"title": "Big Oil earnings are set to surge. Why investors may want to be cautious", "full_content": "GET THIS IN YOUR INBOX FIRST: Subscribe to CNBC's \"Power Insider\" newsletter.\n\nThat's not a reference to the reportedly amazing new documentary about disgraced Theranos founder Elizabeth Holmes. It's about the next few days and next week: days that will be dominated by earnings, a massive conference, and more on Europe's energy woes.\n\nI'll hit more on energy earnings in The Actionable Insider below.\n\nNext week for me, it's multiple flights through multiple time zones. First up is one of the most important energy conferences in the world: ADIPEC in Abu Dhabi. It's a who's who of the energy world. I'll be speaking with some of the most influential energy executives in the world. You'll see some clips on CNBC about it and then I'll write about it here next week. I'll also be meeting privately with some of the biggest power players in energy and having great conversations with country and company leaders about oil, gas, commodities, Hormuz, and more - all ahead of what some fear may be another round of hits on Iran or Iranian energy infrastructure. It remains a tense time.\n\nThat will be followed later in the week by a deeper dive into Europe's slow-rolling energy crisis. The Iran war and Hormuz risk have added another layer to an already risky situation, but let's be clear: it is not the reason why Europe is in an energy bind. Russia's horrible invasion and now four-year war on Ukraine added gasoline to a fire that began burning with bad policy decisions years ago. I have been covering the European energy story for five years - from the UK, Germany, Belgium, and the Netherlands - and next week I'll be in Italy highlighting where Europe is right now. Hint: it's not good. Natural gas storage levels are below their recent average, and prices are near record highs for imported LNG.\n\nOf course, there is a risk that travel plans change, much as they did a few weeks ago around a planned trip to Riyadh.", "source": "CNBC Top News", "pub_date_str": "29 Oct 2026, 11:43 PM IST", "pub_date_relative": "49m ago"}, {"title": "Stock Market Today: Dow, S&P 500 and Nasdaq fall as Alphabet, Caterpillar earnings disappoint, but most stocks rise - MarketWatch", "full_content": "Stock Market Today: Dow, S&P 500 and Nasdaq fall as Alphabet, Caterpillar earnings disappoint, but most stocks rise MarketWatch Stocks Struggling as Inflation, Earnings Weigh Schaeffer's Investment Research [U.S. Stocks] Dow turns lower, down $165; Nasdaq also declines (morning of the 29th) Moomoo U.S. Stocks Turn Lower; Nasdaq Drops 1.72% bloomingbit Why Is the Stock Market Down Today, 10/29/26? TipRanks", "source": "Google News Business", "pub_date_str": "29 Oct 2026, 11:43 PM IST", "pub_date_relative": "49m ago"}, {"title": "Q2 Results Highlights: Capital Small Finance Bank Profit Rises 31%; Coal India Profit Jumps 53%; Indegene Profit Surges 10%", "full_content": "Asian Paints, Trent, Coal India, Godrej Consumer Products, InterGlobe Aviation, Ambuja Cements, Apar Industries, Blue Star, Laurus Labs, Suzlon Energy and Welspun Corp are among the 140 companies announced their Q2 FY27 results today, October 29.", "source": "NDTV Profit", "pub_date_str": "29 Oct 2026, 11:42 PM IST", "pub_date_relative": "50m ago"}, {"title": "Govt Defends IDBI Bank Sale Process, Says Best-Offer Round Followed Approved Procedure", "full_content": "The government clarified that the bidders conduct own valuation and submit bids confidentially and independent agencies are hired for fair valuation of the enterprises, which is further used as a measure to evaluate the reasonability of the bids submitted.", "source": "NDTV Profit", "pub_date_str": "29 Oct 2026, 11:40 PM IST", "pub_date_relative": "52m ago"}, {"title": "Third-quarter U.S. GDP increases a better-than-expected 3.4% as September inflation accelerates", "full_content": "The pace of price increases stepped up in September, keeping inflation well above the Federal Reserve's target, while the economy grew faster than expected in the third quarter, according to Commerce Department reports Thursday.\n\nThe personal consumption expenditures price index increased a seasonally adjusted 0.5% for the month, putting the annual inflation rate at 3.6%. The monthly increase was the largest since March but in line with the Dow Jones consensus, while the annual rate was 0.1 percentage point below.\n\nExcluding food and energy, the core PCE posted respective readings of 0.3% and 3.1%, in line with the consensus. While the Fed follows both measures closely, officials generally see the core reading as more indicative of longer-term inflation trends.\n\nWhile inflation continued to run ahead of the Fed's 2% target, the Commerce Department also reported that gross domestic product was strong in the third quarter.\n\nGDP increased at a seasonally adjusted annualized pace of 3.4%, better than the 3.1% estimate and well ahead of the 2.2% in the second quarter.\n\nAlso, in September consumer spending proved resilient, climbing 0.5%, a bit below the forecast for a 0.6% gain, while personal income rose 0.2%, compared with the estimate for 0.3%.\n\nThe reports come the day after the Fed voted to hold its benchmark interest rate in a range between 3.75%-4%. Despite elevated inflation readings, central bank officials insist they can afford to evaluate incoming data before deciding on their next move.\n\n\"The period right in front of us is information rich. There is a lot that's happening in the world. My colleagues and I are keen to take notice of it,\" Fed Chairman Kevin Warsh said Wednesday.", "source": "CNBC Top News", "pub_date_str": "29 Oct 2026, 11:36 PM IST", "pub_date_relative": "56m ago"}, {"title": "S&P 500 heads for first loss in four days as Alphabet, Caterpillar crack after earnings: Live updates", "full_content": "Stocks were under pressure Thursday, weighed down by the latest batch of corporate earnings.\n\nThe Nasdaq Composite shed 1.7%, while the S&P 500 slipped 0.6%, on pace to snap a three-day advance. The Dow Jones Industrial Average lost 316 points, or 0.6%.\n\nAlphabet lost 13% after it missed expectations on adjusted earnings per share and revenue in the third quarter. The Google parent posted negative free cash flow of $9.07 billion. The company kept its full-year capital expenditures forecast at $195 billion to $205 billion.\n\nFellow Dow member Caterpillar slid 9%. While the industrial giant reported better-than-expected revenue and earnings for the third quarter, sales in its construction industries business came in slightly below estimates.\n\nMicrosoft was also lower, reversing course from its initial advance after growth in the Windows maker's Azure cloud infrastructure business helped earnings and revenue to beat analyst estimates in its fiscal first quarter ending in September, according to LSEG. The stock was last down almost 1%.\n\nNeoclouds pulled back as Microsoft's lower-than-expected capital spending commitment pointed to infrastructure partners taking longer to deliver data center capacity. Shares of CoreWeave dropped 3%, while Nebius declined more than 5%.\n\nThe results come amid heightened scrutiny of the artificial intelligence trade. AI stocks, such as the iShares Semiconductor ETF (SOXX) and the Roundhill Memory ETF (DRAM) , have been through a rough patch for most of October, only to perk up in recent days. On Thursday, both funds were lower, with SOXX down more than 2% and DRAM falling more than 4%.\n\n\"I think we're in a better, more stable place in October and heading into November in the tech trade than we were in August and September. But that said, I think investors are becoming much more selective,\" said Art Hogan, chief market strategist at B. Riley Wealth Management.", "source": "CNBC Top News", "pub_date_str": "29 Oct 2026, 11:34 PM IST", "pub_date_relative": "58m ago"}, {"title": "Income tax: Can your business income be clubbed with your husband\u2019s? ITAT ruling offers relief to woman", "full_content": "The Income Tax Appellate Tribunal (ITAT), Chandigarh Bench, has ruled in favour of a woman whose timber-trading business was treated by tax authorities as a benami concern of a family-owned firm, holding that the department had failed to establish a connection between the two businesses.\n\nIn Meena Garg vs Deputy Commissioner of Income Tax, ITA Nos. 1165 to 1170/CHD/2013, the tribunal set aside the order of the Commissioner of Income Tax (Appeals), which had upheld the department\u2019s decision to treat the income of Garg\u2019s proprietorship, Punjab Timber Trading Company, as income belonging to Punjab Plywood Industries.\n\nThe ruling, pronounced on 26 February 2014, covered six assessment years from 2002-03 to 2007-08.\n\nThe dispute arose following a search conducted on the family group in March 2007. During the search, Garg told tax officials that she was a housewife, depended on her husband for household expenses and was not running any business. She also said she had no knowledge of Punjab Timber Trading Company or its books of accounts.\n\nHowever, during subsequent assessment proceedings, Garg acknowledged that she had an independent timber-trading business. She said she had started it in 1997 after her husband suggested the idea , employed a worker and signed cheques presented by her husband, although she did not manage the business directly.\n\nThe assessing officer relied on her initial statement during the search to conclude that the proprietorship was merely operating in her name, while Punjab Plywood Industries was its actual owner. The officer consequently treated the business income as belonging to the family firm.\n\nThe Commissioner of Income Tax (Appeals) upheld the decision, prompting Garg to approach the tribunal.\n\nGarg argued that Punjab Timber Trading Company was her independent proprietorship and that she had a separate permanent account number (PAN).", "source": "LiveMint Money", "pub_date_str": "29 Oct 2026, 11:31 PM IST", "pub_date_relative": "1h ago"}, {"title": "Kriti Sanon's 'No No No' Obsession Scene With Varun Dhawan Wins The Internet \u2014 Check Reactions", "full_content": "Directed by Curry Barker, Obsession tells the story of a hopeless romantic whose life spirals into darkness after a mysterious wish appears to come true.", "source": "NDTV Profit", "pub_date_str": "29 Oct 2026, 11:29 PM IST", "pub_date_relative": "1h ago"}, {"title": "Did the Fed make a mistake with its October rate pause? The Treasury could help save the day.", "full_content": "As focus shifts to the Treasury\u2019s funding plans, there\u2019s some expectation that longer-term supply could be reduced in an attempt to boost demand and lower yields", "source": "MarketWatch Top Stories", "pub_date_str": "29 Oct 2026, 11:29 PM IST", "pub_date_relative": "1h ago"}, {"title": "New Jersey governor threatens to block delivery of Russian diesel cargoes", "full_content": "Mikie Sherrill calls Trump\u2019s deal with Putin \u2018corrupt and illegal\u2019 as she weighs moves to stop shipment to east coast port", "source": "FT Markets", "pub_date_str": "29 Oct 2026, 11:28 PM IST", "pub_date_relative": "1h ago"}, {"title": "Sagility block deal: Promoter to offload 12% stake at \u20b942.45 apiece; deal size \u20b92,377 crore", "full_content": "A Ksheerasagar Published 29 Oct 2026, 11:28 PM IST Prefer Livemint on Google Shares of Sagility are likely to remain volatile in Friday\u2019s session on October 30, as the healthcare services provider\u2019s promoter, Sagility B.V., is reportedly planning to sell a 12% stake in the company through a block deal, according to media reports.\n\nThe deal is estimated to be worth around \u20b9 2,377 crore, with the promoter expected to sell shares at \u20b9 42.45 apiece, representing a 5% discount to Thursday\u2019s closing price.\n\nAccording to the shareholding data for the September quarter, Sagility B.V. held 2,38,51,29,151 shares, representing a 50.95% stake in the company at the end of the quarter. The promoter has been gradually trimming its stake in the company. In the same period last year, Sagility B.V. held a 67.38% stake.\n\nIn November last year, Sagility B.V. sold 76.9 crore shares at an average price of \u20b9 47.60 apiece on the NSE. In a separate transaction on November 21, 2025, BNP Paribas Financial Markets purchased 35 lakh shares at an average price of \u20b9 48.23 apiece on the BSE.\n\nMeanwhile, mutual funds held a 15.13% stake in the company, while general retail shareholders owned a 16.1% stake.\n\nThe latest stake sale comes at a time when the stock has been reeling under significant selling pressure, falling 14% so far in 2026 to \u20b9 44.65 apiece. Although its performance for the year has remained weak, the stock has recovered 24% from its yearly low of \u20b9 35.83.\n\nFor the June quarter, the company reported a 46% year-on-year rise in net profit for the first quarter of FY27, driven by strong revenue growth and continued client additions.\n\nThe company\u2019s net profit stood at \u20b9 217 crore for the quarter ended June 30, 2026, compared with \u20b9 149 crore in the corresponding period last year.", "source": "LiveMint Markets", "pub_date_str": "29 Oct 2026, 11:28 PM IST", "pub_date_relative": "1h ago"}, {"title": "IKEA To Open 'City Store' In Bengaluru In November, Offer Over 5,200 Products", "full_content": "The 'city centre store' will open on Nov 5, 2026, as the company expands its presence in South Bengaluru.", "source": "NDTV Profit", "pub_date_str": "29 Oct 2026, 11:26 PM IST", "pub_date_relative": "1h ago"}, {"title": "Virat Kohli's One8 Merger Boosts Agilitas Stake To 6.4%; Sportswear Brand Eyes Rs 3,000 Crore", "full_content": "NCLT approval for One8's merger with Agilitas Sports lifts Virat Kohli's stake to 6.4%. The company targets Rs 3,000 crore in revenue over the next four to six years.", "source": "NDTV Profit", "pub_date_str": "29 Oct 2026, 11:26 PM IST", "pub_date_relative": "1h ago"}, {"title": "ED Searches Mudrex, Saber.money Under FEMA Over Alleged Rs 5,000 Crore Crypto Transfers", "full_content": "The ED alleged that the entity advertising the ability to transfer cash across borders via cryptocurrency despite not being authorised by the RBI to do so.", "source": "NDTV Profit", "pub_date_str": "29 Oct 2026, 11:24 PM IST", "pub_date_relative": "1h ago"}, {"title": "Ronaldo's Emotional Message After Beating Messi In Historic Ballon d'Or Vote: 'Football Belongs To The Fans'", "full_content": "Unlike the traditional Ballon d'Or, the inaugural BOAT award was decided entirely by online fan voting, with participants paying one euro to cast their votes.", "source": "NDTV Profit", "pub_date_str": "29 Oct 2026, 11:23 PM IST", "pub_date_relative": "1h ago"}, {"title": "India's HNI term insurance bookings double since 2023; younger buyers drive growth, shows new report", "full_content": "India's high net-worth individuals are purchasing higher life insurance coverage, with term insurance bookings in this segment doubling since April 2023 and the average sum assured rising 30%, according to Policybazaar data.\n\nThe data also shows that less than 5% of HNIs opt for term plan with return of premium (TROP), indicating that most prefer insurance primarily to protect their families financially rather than get their premiums back at maturity.\n\nMany people buy term insurance to ensure their families remain financially secure in the event of their untimely death. A term insurance policy is an agreement between the insurance company and the policyholder for a fixed period, typically ranging from 10 to 40 years, during which the insurer pays the death benefit to the beneficiaries if the policyholder passes away.\n\nThe insurance marketplace also said that younger affluent buyers are emerging as a key growth cohort, with customers below the age of 35 accounting for nearly 50% of high net-worth term insurance customers.\n\nThis emerging trend also challenges the traditional perception that high-value life insurance is primarily an older HNI\u2019s purchase. \u201cThis growth is not being driven solely by existing policyholders, topping up their protection, but by younger HNIs entering the market for higher protection,\u201d the report noted.\n\nMeanwhile, women accounted for around 18% of HNI term insurance buyers in 2025, while men made up the remaining 82%, the data showed.\n\nPolicybazaar's data shows a 25% rise in policies with a sum assured of \u20b9 3 crore or more, indicating growing demand for high-value life insurance among HNIs.", "source": "LiveMint Money", "pub_date_str": "29 Oct 2026, 11:21 PM IST", "pub_date_relative": "1h ago"}, {"title": "November Market Trends: HAL To Vodafone Idea Stocks That Consistently Gave Positive Returns Over A Decade", "full_content": "The Nifty Midcap 100 delivered an average return of 2.7% in November, while the Nifty Smallcap 100 averaged 2% over the 10-year period.", "source": "NDTV Profit", "pub_date_str": "29 Oct 2026, 11:18 PM IST", "pub_date_relative": "1h ago"}, {"title": "India's Poverty Decline Is Among The Fastest, But Its Top 10% Workers Earn 13x More Than The Bottom 10%", "full_content": "India's poverty rate fell sharply between 2011 and 2023, lifting 496 million people out of poverty, but wage inequality persists, with the top 10% of workers earning 13 times more than the bottom 10%.", "source": "NDTV Profit", "pub_date_str": "29 Oct 2026, 11:17 PM IST", "pub_date_relative": "1h ago"}, {"title": "Cruise companies aim to keep fuel costs down. Their strategies for doing so differ", "full_content": "Carnival , Royal Caribbean and Norwegian Cruise Line Holdings posted strong earnings for their most recent quarters despite rising fuel prices. How the leading cruise companies navigate fuel costs boils down to starkly different strategies.\n\nOil prices have skyrocketed since the U.S.-Israel war with Iran began on Feb. 28. Brent crude oil reached a six-month high on Friday, settling at $116.72 per barrel. With no clear end in sight for the conflict in the Middle East, the pressure affecting cruise ships' lifeblood seems poised to last into the holiday travel season and beyond.\n\nBoth Royal Caribbean and Norwegian practice \"hedging,\" or a strategy of using derivatives to reduce exposure to future fuel-price swings, to account for sharp price changes.\n\nCarnival CEO Josh Weinstein, on the other hand, told CNBC in an interview last month that cutting fuel consumption is the best way to avert the effects of expensive fuel.\n\n\"At the end of the day, fuel is an input cost for us. The best thing that we can do to control that cost is to use less,\" Weinstein said at the time.\n\nJefferies analyst David Katz told CNBC in an interview that companies that hedge do so primarily to manage the cost of fuel, but also to manage Wall Street expectations and prevent hectic stock trading based on fuel price fluctuations.\n\n\"When you're public, the Street will trade your stock around based on the price of fuel,\" Katz said. \"The Street's argument is that volatility puts pressure on your multiple.\"\n\n\"While it is mathematically most likely true that over the long term it is more expensive,\" he explained. \"The benefit of having less fuel volatility in the model and less trading volatility is [it's] good for your multiple.\"", "source": "CNBC Top News", "pub_date_str": "29 Oct 2026, 11:15 PM IST", "pub_date_relative": "1h ago"}, {"title": "Alphabet\u2019s AI risks deepen as filing reveals $98 billion in commitments beyond the $1 trillion spending", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a Alphabet\u2019s AI risks deepen as filing reveals $98 billion in commitments beyond the $1 trillion spending Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Alphabet\u2019s AI risks deepen as filing reveals $98 billion in commitments beyond the $1 trillion spending SECTIONS Alphabet\u2019s AI risks deepen as filing reveals $98 billion in commitments beyond the $1 trillion spending ETMarkets.com Last Updated: Oct 29, 2026, 11:30:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis In a recent regulatory disclosure, Alphabet reveals financial risks linked to its massive AI investments that surpass $1 trillion. The firm might be burdened with nearly $98.5 billion in contingent commitments, including data center leases and chip system repurchases. There are growing apprehensions about the sustainability of Google Cloud's expansion due to a substantial backlog from its collaboration with Blackstone.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "29 Oct 2026, 11:07 PM IST", "pub_date_relative": "1h ago"}, {"title": "IMF flags Super El Ni\u00f1o risks to India\u2019s growth, says impact yet to materialise", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Indicators \u203a IMF flags Super El Ni\u00f1o risks to India\u2019s growth, says impact yet to materialise The Economic Times daily newspaper is available online now. Read Today's Paper IMF flags Super El Ni\u00f1o risks to India\u2019s growth, says impact yet to materialise SECTIONS IMF flags Super El Ni\u00f1o risks to India\u2019s growth, says impact yet to materialise ET Online Last Updated: Oct 29, 2026, 11:06:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis According to the IMF, India continues to act as a significant growth engine within the global economy. Despite looming threats posed by weather phenomena like Super El Nino, these risks have yet to materialize. Recent adjustments have raised growth forecasts to 7 percent for the fiscal years 2027 and 2028, reflecting robust domestic demand and a thriving service sector.\n\nKYB and KYC: Quick commerce, the Damani premium and what DMart must deliver \u2013 3rd and concluding part\n\nKYC and KYB: Inside Damani\u2019s DMart, the retail chain for the middle class. And stock for the long term? \u2013 Part 2 of 3\n\nWill it be a regulatory nightmare if an exchange lists on its own platform?\n\nKYC and KYB: Inside Damani\u2019s Avenue Supermarts that refuses to charge more \u2013 Part 1 of 3\n\nWill oil turn into a lingering problem? Is the world economy, India, or the market prepared?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers", "source": "Economic Times Economy", "pub_date_str": "29 Oct 2026, 11:06 PM IST", "pub_date_relative": "1h ago"}, {"title": "NASA Reveals What Cyclone Arnab Looked Like From Space As It Hit India", "full_content": "NASA's NOAA-20 satellite captured Cyclone Arnab over the Bay of Bengal before landfall, with winds reaching 140 kmph.", "source": "NDTV Profit", "pub_date_str": "29 Oct 2026, 11:00 PM IST", "pub_date_relative": "1h ago"}, {"title": "US tech stocks fall after earnings fuel AI spending concerns", "full_content": "Nasdaq 100 drops 1.5% after Google parent Alphabet and Microsoft report lower than expected capex", "source": "FT Markets", "pub_date_str": "29 Oct 2026, 10:58 PM IST", "pub_date_relative": "1h ago"}, {"title": "Some investors have midterm election jitters. Here\u2019s what history shows about stocks", "full_content": "With the midterm elections approaching, some investors worry about how the results will impact their portfolios. Whether their anxiety is warranted is another question.\n\nNearly half of surveyed investors \u2014 48% \u2014 said they are concerned about the Nov. 3 midterms' potential impact on the stock market, according to Morgan Stanley Wealth Management's latest quarterly retail investor pulse survey , conducted Oct. 1-23 among 953 U.S. investors.\n\nSeparately, the Nationwide Retirement Institute, a research and education division of insurer Nationwide, found that 56% of surveyed investors said they feel more anxious because of the elections, and 75% believe the results could meaningfully affect their long-term financial plans. That survey was conducted Aug. 24-Sept. 11 among 2,029 investors with investable assets of at least $10,000.\n\n\"This summer and fall, the midterms have been probably the first topic of conversation with almost every [client] meeting that I've had,\" said John Mullen, managing director, president and CEO of Parsons Capital Management in Providence, Rhode Island. The firm ranked No. 25 on CNBC's Financial Advisor 100 list for 2026.\n\nRead coverage of CNBC's 2026 Financial Advisor 100 list, including stories featuring ranked firms and their advisors:\n\nWhile it's impossible to predict how the markets will behave following the midterms, historical data offers some perspective on how stocks have performed around past midterm elections.\n\nVoters will be heading to the polls amid broad concerns about affordability and dissatisfaction with President Donald Trump's handling of the economy .", "source": "CNBC Top News", "pub_date_str": "29 Oct 2026, 10:57 PM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "Polymarket reports outage on international exchange, halts trading", "full_content": "Prediction market platform Polymarket's international platform is currently experiencing an outage following a hack of an unnamed third-party provider, the company said on Thursday.\n\nTraders first reported on social media platforms that they were seeing unauthorized withdrawals from their accounts on Thursday afternoon. In response, the company halted trading on its international platform.\n\nPolymarket said that it has fixed the issue on its end, and that trading will resume at 3:00 p.m. ET.\n\nThe company also said it will make whole any wallets that have been affected by the hack. A spokesperson also said it has referred the U.K. law enforcement, as that is the country of operation for the third-party provider.\n\nPolymarket's international prediction market exchange operates as a decentralized finance platform on the polygon blockchain and is not regulated in the U.S. The company's domestic exchange operated as normal during the outage.\n\nThe disruption comes just days before both the company's international and U.S. exchanges are expected to see heightened volumes during the U.S. midterm elections on Nov. 3.", "source": "CNBC Top News", "pub_date_str": "30 Oct 2026, 12:27 AM IST", "pub_date_relative": "5m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Rare Stanley Druckenmiller post sends crypto-linked stock surging", "full_content": "The post appeared seemingly out of nowhere. Stanley Druckenmiller, the legendary hedge fund manager who brought the Bank of England to its knees in the 1990s, and whose annual returns are the envy of Wall Street, posted a simple message on an otherwise sparse X feed announcing his involvement with a new type of decentralized exchange. The post caused bedlam on social media and moved shares of a leading crypto treasury company and its token.\n\nTradeXYZ, the primary developer of perpetual futures, or \"perps\" markets, on exchange Hyperliquid, announced a partnership Thursday with Intercontinental Exchange (ICE) to bring its popular perpetual futures onshore into the U.S.\n\nShortly after the two said they are seeking regulatory approvals, Druckenmiller said on X that he is \"excited to be an investor in trade(xyz),\" and that he is \"looking forward to to using their innovative product to enhance my investment process.\" Representatives for Druckenmiller confirmed the statement to the Financial Times .\n\nOptions traders pounced on the closest publicly-traded play to the news: Hyperliquid Strategies (PURR) , the company that invests in the HYPE crypto token that powers the Hyperliquid exchange.\n\nMore than 111,000 options traded on Hyperliquid Strategies Thursday, more than six times the 30-day average, as underlying shares surged 19% to the highest in three weeks. The flows leaned bullish, with almost 86,000 calls and under 27,000 puts trading. Almost four times as many calls were likely initiated by buyers than puts, and of the top 10 trades, only one involved put-buying, Cboe LiveVol dat show.\n\n\"We are thrilled to see ICE partnering with Trade.XYZ to bring the markets and liquidity of Hyperliquid to American investors,\" David Schamis, CEO of Hyperliquid Strategies, said in a text.", "source": "CNBC Top News", "pub_date_str": "30 Oct 2026, 12:23 AM IST", "pub_date_relative": "9m ago", "cfa_topics": ["Fixed Income", "Derivatives", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Stock Market Today: Nasdaq Sinks 350 Points; Google Stock's Tumble in Focus \u2014 Live Updates - WSJ", "full_content": "Stock Market Today: Nasdaq Sinks 350 Points; Google Stock's Tumble in Focus \u2014 Live Updates WSJ Alphabet falls 12%, putting it on course for its biggest ever post-earnings drop CNBC Why Alphabet (GOOGL) shares are sliding today Yahoo Finance AI fears hammer Google parent\u2019s stock, erasing $500 billion in value NBC News Microsoft Up, Google Down. A Tale of Two Hyperscalers. The New York Times", "source": "Google News Business", "pub_date_str": "30 Oct 2026, 12:22 AM IST", "pub_date_relative": "10m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Why Alphabet\u2019s stock is on track for its worst day ever after the latest results", "full_content": "A doubling of cloud revenue wasn\u2019t enough to appease Wall Street as investors grew more concerned that AI is hurting the company\u2019s ability to make money off search queries.", "source": "MarketWatch Top Stories", "pub_date_str": "30 Oct 2026, 12:20 AM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Why Microsoft stock isn't getting crushed like Google stock after its earnings report - Yahoo Finance", "full_content": "Why Microsoft stock isn't getting crushed like Google stock after its earnings report Yahoo Finance Press Release & Webcast Microsoft Wall Street's top analysts are loving Microsoft's Q1 results Yahoo Finance Microsoft stock jumps 4% as cloud growth drives earnings and revenue beat CNBC Microsoft's cloud growth, cash flow offer respite from AI spending fears Reuters", "source": "Google News Business", "pub_date_str": "30 Oct 2026, 12:19 AM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Dollar dips and euro rises after Fed, ECB rate decisions; pound extends gains", "full_content": "", "source": "Investing.com News", "pub_date_str": "30 Oct 2026, 12:15 AM IST", "pub_date_relative": "17m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Sugar prices rise amid rains in Brazil; arabica coffee hits one-month low", "full_content": "NEW YORK, Oct 29 (Reuters) - Raw sugar futures on ICE rose on Thursday as supply prospects worsened with more excess El Nino-linked rains forecast in top grower Brazil, while arabica coffee hit a one-month low.\n\n* Raw sugar \u200b\u200b\u200bsettled up 0.13 cent, or 0.7%, at 19.47 cents per lb, extending its recovery from Monday's 5.6% Brazilian currency-driven selloff.\n\n* Sugar production in Brazil's key center-south region fell 27.1% in the first half of October from a year earlier to 1.87 million metric tons, the Agriculture Ministry said on Wednesday.\n\n* The country's sugar areas have been battling excess El Nino-linked rains, and more are forecast for this weekend and for next week.\n\n* \"Sugar has been supported since July by declining forecasts for global supply, with heat and drought damaging Europe\u2019s beet crop and a lacklustre monsoon lowering expectations for India\u2019s cane crop,\" added broker AMDIS.\n\n* ICE arabica coffee futures settled down 1.3 cents, or 0.5%, at $2.8545 per lb\u200b, having hit their lowest since late September at 2.8080.\n\n* Weighing on coffee are signs the relentless drawdown in ICE-certified stocks might be moderating, with data showing more than 42,000 bags of coffee have arrived at exchange warehouses and are awaiting grading .\n\n* The weak Brazilian real is also weighing by encouraging mills, farmers and exporters in top grower Brazil to sell dollar-priced coffee futures because it raises their returns in local currency terms.", "source": "LiveMint Markets", "pub_date_str": "30 Oct 2026, 12:12 AM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Wall Street slides as Alphabet revenue miss revives AI capex jitters", "full_content": "", "source": "Investing.com News", "pub_date_str": "30 Oct 2026, 12:12 AM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "ServiceNow shares plunge 27% after earnings revive AI disruption fears", "full_content": "ServiceNow shares sank 27% on Thursday and headed for the worst day ever after the enterprise software company's third-quarter results underwhelmed, reigniting artificial intelligence disruption concerns.\n\n\"This was a little bit uncharacteristic for ServiceNow standards, just in terms of the lack of upside,\" Citi's Tyler Radke told CNBC on Thursday.\n\nRevenue grew more than 20% during the period to $4.11 billion, which was roughly in line with a $4.10 billion estimate from analysts polled by LSEG. Adjusted earnings came up short at $1.00 per share, compared to a forecast of $1.02.\n\nThe results did little to overturn recent \"SaaSpocalypse\" fears, or concerns that new AI capabilities will upend traditional software business models.\n\nThe stock drop came even after the company slightly lifted its full-year 2026 subscription revenue outlook to between $15.78 billion and $15.79 billion. Net new AI average contract value jumped 65%.\n\nOne factor spooking investors is the lack of immediate payoff for the company's investments in its newly formed forward-deployed engineering team that embeds in enterprises to build AI solutions, Radke said.\n\n\"It's just going to be a little bit longer of a waiting game, and so I think the market, you know, wanted to see something a little bit sooner,\" he said. \"I think you got to wait until next year to really see that inflection.\"\n\nWATCH : ServiceNow shares plummet in extended trading on mixed Q3 results", "source": "CNBC World Economy", "pub_date_str": "30 Oct 2026, 12:08 AM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Alaska Gov. orders probe of Peltola Senate campaign's alleged recruitment of 2nd Sullivan", "full_content": "Alaska Gov. Mike Dunleavy ordered an investigation into whether the alleged recruitment of a candidate named Dan Sullivan for the state's U.S. Senate race, where the incumbent shares the same name, violated criminal or civil laws.\n\nDunleavy's order late Wednesday was in response to a report by The New York Times Wednesday that people in the campaign of Democratic nominee Mary Peltola and senior advisors at the Democratic Senatorial Campaign Committee worked to recruit retired schoolteacher Dan Sullivan to run to draw votes from Sen. Dan Sullivan.\n\nPeltola's campaign and the DSCC, in response to the Times article, said they are not involved in the campaign of the retired teacher Sullivan.\n\nThe governor's order came as a federal judge in Alaska allowed Peltola's campaign and the DSCC to intervene in a U.S. Justice Department lawsuit that seeks to block the state from immediately certifying any Senate election result \"that may be impacted by voter confusion ... pending an investigation to determine whether votes cast for Daniel J. Sullivan were meant to be cast for Senator Sullivan.\"\n\nThe campaign, the DSCC and state election officials have asked Judge Sharon Gleason to dismiss that lawsuit before Election Day, Nov. 3.\n\nPresident Donald Trump has said he ordered the DOJ to file the suit.\n\nThe political stakes in the Alaska Senate race are potentially momentous. The winner of the contest could determine the balance of power in the Senate, where Republicans hold a six-vote majority.\n\nDunleavy, in announcing his order, noted that Alaska's Division of Elections had investigated concerns that the retired teacher's entry into the Senate primary was designed to confuse voters, which led the division to block him from that ballot. A state court judge reversed that order, and the Alaska Supreme Court upheld that ruling, allowing him on the ballot.", "source": "CNBC Top News", "pub_date_str": "30 Oct 2026, 12:02 AM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Stocks To Watch Today: Dixon Tech, Syrma SGS, Sun Pharma, Wipro, Trent Among Others", "full_content": "Investors will track a range of corporate developments, including leadership changes, capacity expansion plans, new orders, project commissioning, regulatory updates and strategic investments.", "source": "NDTV Profit", "pub_date_str": "30 Oct 2026, 12:01 AM IST", "pub_date_relative": "31m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Our church has a $1.5 million bequest earning 3.75% in a bank account. Is inflation eroding it?", "full_content": "\u201cGiven the size and long-term nature of this gift, we want to make sure the funds are managed prudently.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "30 Oct 2026, 12:00 AM IST", "pub_date_relative": "33m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Iovance, A Top 1% Biotech Stock, Crashes In A Surprise Lung Cancer Twist - Investor's Business Daily", "full_content": "Iovance, A Top 1% Biotech Stock, Crashes In A Surprise Lung Cancer Twist Investor's Business Daily IOVA Stock Heads For Worst Day In Over 17 Months, Retail Says \u2018Selling Is Not Done\u2019 \u2013 What\u2019s Driving The Fall? Yahoo Finance Why is Iovance Biotherapeutics stock sliding today? Investing.com Iovance sees long-term response for Amtagvi in first-line melanoma (IOVA:NASDAQ) Seeking Alpha Can Iovance Stock Fall 50%? Trefis", "source": "Google News Business", "pub_date_str": "29 Oct 2026, 11:51 PM IST", "pub_date_relative": "41m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "How Todd Gordon is trading Meta as the stock market rotates out of growth and into value names", "full_content": "The Street is again heavily questioning Meta's spending, says Todd Gordon.", "source": "CNBC Top News", "pub_date_str": "29 Oct 2026, 11:50 PM IST", "pub_date_relative": "42m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Godrej Consumer Q2: Net Profit Up 14%, Rs 5 Interim Dividend Declared", "full_content": "Revenue surged 19% toRs 4,413 crore for the quarter ended on September 30, 2026 from Rs 3,708 crore in the corresponding period last year.", "source": "NDTV Profit", "pub_date_str": "29 Oct 2026, 11:44 PM IST", "pub_date_relative": "48m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Big Oil earnings are set to surge. Why investors may want to be cautious", "full_content": "GET THIS IN YOUR INBOX FIRST: Subscribe to CNBC's \"Power Insider\" newsletter.\n\nThat's not a reference to the reportedly amazing new documentary about disgraced Theranos founder Elizabeth Holmes. It's about the next few days and next week: days that will be dominated by earnings, a massive conference, and more on Europe's energy woes.\n\nI'll hit more on energy earnings in The Actionable Insider below.\n\nNext week for me, it's multiple flights through multiple time zones. First up is one of the most important energy conferences in the world: ADIPEC in Abu Dhabi. It's a who's who of the energy world. I'll be speaking with some of the most influential energy executives in the world. You'll see some clips on CNBC about it and then I'll write about it here next week. I'll also be meeting privately with some of the biggest power players in energy and having great conversations with country and company leaders about oil, gas, commodities, Hormuz, and more - all ahead of what some fear may be another round of hits on Iran or Iranian energy infrastructure. It remains a tense time.\n\nThat will be followed later in the week by a deeper dive into Europe's slow-rolling energy crisis. The Iran war and Hormuz risk have added another layer to an already risky situation, but let's be clear: it is not the reason why Europe is in an energy bind. Russia's horrible invasion and now four-year war on Ukraine added gasoline to a fire that began burning with bad policy decisions years ago. I have been covering the European energy story for five years - from the UK, Germany, Belgium, and the Netherlands - and next week I'll be in Italy highlighting where Europe is right now. Hint: it's not good. Natural gas storage levels are below their recent average, and prices are near record highs for imported LNG.\n\nOf course, there is a risk that travel plans change, much as they did a few weeks ago around a planned trip to Riyadh.", "source": "CNBC Top News", "pub_date_str": "29 Oct 2026, 11:43 PM IST", "pub_date_relative": "49m ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stock Market Today: Dow, S&P 500 and Nasdaq fall as Alphabet, Caterpillar earnings disappoint, but most stocks rise - MarketWatch", "full_content": "Stock Market Today: Dow, S&P 500 and Nasdaq fall as Alphabet, Caterpillar earnings disappoint, but most stocks rise MarketWatch Stocks Struggling as Inflation, Earnings Weigh Schaeffer's Investment Research [U.S. Stocks] Dow turns lower, down $165; Nasdaq also declines (morning of the 29th) Moomoo U.S. Stocks Turn Lower; Nasdaq Drops 1.72% bloomingbit Why Is the Stock Market Down Today, 10/29/26? TipRanks", "source": "Google News Business", "pub_date_str": "29 Oct 2026, 11:43 PM IST", "pub_date_relative": "49m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Q2 Results Highlights: Capital Small Finance Bank Profit Rises 31%; Coal India Profit Jumps 53%; Indegene Profit Surges 10%", "full_content": "Asian Paints, Trent, Coal India, Godrej Consumer Products, InterGlobe Aviation, Ambuja Cements, Apar Industries, Blue Star, Laurus Labs, Suzlon Energy and Welspun Corp are among the 140 companies announced their Q2 FY27 results today, October 29.", "source": "NDTV Profit", "pub_date_str": "29 Oct 2026, 11:42 PM IST", "pub_date_relative": "50m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Govt Defends IDBI Bank Sale Process, Says Best-Offer Round Followed Approved Procedure", "full_content": "The government clarified that the bidders conduct own valuation and submit bids confidentially and independent agencies are hired for fair valuation of the enterprises, which is further used as a measure to evaluate the reasonability of the bids submitted.", "source": "NDTV Profit", "pub_date_str": "29 Oct 2026, 11:40 PM IST", "pub_date_relative": "52m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Third-quarter U.S. GDP increases a better-than-expected 3.4% as September inflation accelerates", "full_content": "The pace of price increases stepped up in September, keeping inflation well above the Federal Reserve's target, while the economy grew faster than expected in the third quarter, according to Commerce Department reports Thursday.\n\nThe personal consumption expenditures price index increased a seasonally adjusted 0.5% for the month, putting the annual inflation rate at 3.6%. The monthly increase was the largest since March but in line with the Dow Jones consensus, while the annual rate was 0.1 percentage point below.\n\nExcluding food and energy, the core PCE posted respective readings of 0.3% and 3.1%, in line with the consensus. While the Fed follows both measures closely, officials generally see the core reading as more indicative of longer-term inflation trends.\n\nWhile inflation continued to run ahead of the Fed's 2% target, the Commerce Department also reported that gross domestic product was strong in the third quarter.\n\nGDP increased at a seasonally adjusted annualized pace of 3.4%, better than the 3.1% estimate and well ahead of the 2.2% in the second quarter.\n\nAlso, in September consumer spending proved resilient, climbing 0.5%, a bit below the forecast for a 0.6% gain, while personal income rose 0.2%, compared with the estimate for 0.3%.\n\nThe reports come the day after the Fed voted to hold its benchmark interest rate in a range between 3.75%-4%. Despite elevated inflation readings, central bank officials insist they can afford to evaluate incoming data before deciding on their next move.\n\n\"The period right in front of us is information rich. There is a lot that's happening in the world. My colleagues and I are keen to take notice of it,\" Fed Chairman Kevin Warsh said Wednesday.", "source": "CNBC Top News", "pub_date_str": "29 Oct 2026, 11:36 PM IST", "pub_date_relative": "56m ago", "cfa_topics": ["Economics", "Equity Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "S&P 500 heads for first loss in four days as Alphabet, Caterpillar crack after earnings: Live updates", "full_content": "Stocks were under pressure Thursday, weighed down by the latest batch of corporate earnings.\n\nThe Nasdaq Composite shed 1.7%, while the S&P 500 slipped 0.6%, on pace to snap a three-day advance. The Dow Jones Industrial Average lost 316 points, or 0.6%.\n\nAlphabet lost 13% after it missed expectations on adjusted earnings per share and revenue in the third quarter. The Google parent posted negative free cash flow of $9.07 billion. The company kept its full-year capital expenditures forecast at $195 billion to $205 billion.\n\nFellow Dow member Caterpillar slid 9%. While the industrial giant reported better-than-expected revenue and earnings for the third quarter, sales in its construction industries business came in slightly below estimates.\n\nMicrosoft was also lower, reversing course from its initial advance after growth in the Windows maker's Azure cloud infrastructure business helped earnings and revenue to beat analyst estimates in its fiscal first quarter ending in September, according to LSEG. The stock was last down almost 1%.\n\nNeoclouds pulled back as Microsoft's lower-than-expected capital spending commitment pointed to infrastructure partners taking longer to deliver data center capacity. Shares of CoreWeave dropped 3%, while Nebius declined more than 5%.\n\nThe results come amid heightened scrutiny of the artificial intelligence trade. AI stocks, such as the iShares Semiconductor ETF (SOXX) and the Roundhill Memory ETF (DRAM) , have been through a rough patch for most of October, only to perk up in recent days. On Thursday, both funds were lower, with SOXX down more than 2% and DRAM falling more than 4%.\n\n\"I think we're in a better, more stable place in October and heading into November in the tech trade than we were in August and September. But that said, I think investors are becoming much more selective,\" said Art Hogan, chief market strategist at B. Riley Wealth Management.", "source": "CNBC Top News", "pub_date_str": "29 Oct 2026, 11:34 PM IST", "pub_date_relative": "58m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Did the Fed make a mistake with its October rate pause? The Treasury could help save the day.", "full_content": "As focus shifts to the Treasury\u2019s funding plans, there\u2019s some expectation that longer-term supply could be reduced in an attempt to boost demand and lower yields", "source": "MarketWatch Top Stories", "pub_date_str": "29 Oct 2026, 11:29 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Sagility block deal: Promoter to offload 12% stake at \u20b942.45 apiece; deal size \u20b92,377 crore", "full_content": "A Ksheerasagar Published 29 Oct 2026, 11:28 PM IST Prefer Livemint on Google Shares of Sagility are likely to remain volatile in Friday\u2019s session on October 30, as the healthcare services provider\u2019s promoter, Sagility B.V., is reportedly planning to sell a 12% stake in the company through a block deal, according to media reports.\n\nThe deal is estimated to be worth around \u20b9 2,377 crore, with the promoter expected to sell shares at \u20b9 42.45 apiece, representing a 5% discount to Thursday\u2019s closing price.\n\nAccording to the shareholding data for the September quarter, Sagility B.V. held 2,38,51,29,151 shares, representing a 50.95% stake in the company at the end of the quarter. The promoter has been gradually trimming its stake in the company. In the same period last year, Sagility B.V. held a 67.38% stake.\n\nIn November last year, Sagility B.V. sold 76.9 crore shares at an average price of \u20b9 47.60 apiece on the NSE. In a separate transaction on November 21, 2025, BNP Paribas Financial Markets purchased 35 lakh shares at an average price of \u20b9 48.23 apiece on the BSE.\n\nMeanwhile, mutual funds held a 15.13% stake in the company, while general retail shareholders owned a 16.1% stake.\n\nThe latest stake sale comes at a time when the stock has been reeling under significant selling pressure, falling 14% so far in 2026 to \u20b9 44.65 apiece. Although its performance for the year has remained weak, the stock has recovered 24% from its yearly low of \u20b9 35.83.\n\nFor the June quarter, the company reported a 46% year-on-year rise in net profit for the first quarter of FY27, driven by strong revenue growth and continued client additions.\n\nThe company\u2019s net profit stood at \u20b9 217 crore for the quarter ended June 30, 2026, compared with \u20b9 149 crore in the corresponding period last year.", "source": "LiveMint Markets", "pub_date_str": "29 Oct 2026, 11:28 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Virat Kohli's One8 Merger Boosts Agilitas Stake To 6.4%; Sportswear Brand Eyes Rs 3,000 Crore", "full_content": "NCLT approval for One8's merger with Agilitas Sports lifts Virat Kohli's stake to 6.4%. The company targets Rs 3,000 crore in revenue over the next four to six years.", "source": "NDTV Profit", "pub_date_str": "29 Oct 2026, 11:26 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "ED Searches Mudrex, Saber.money Under FEMA Over Alleged Rs 5,000 Crore Crypto Transfers", "full_content": "The ED alleged that the entity advertising the ability to transfer cash across borders via cryptocurrency despite not being authorised by the RBI to do so.", "source": "NDTV Profit", "pub_date_str": "29 Oct 2026, 11:24 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "India's HNI term insurance bookings double since 2023; younger buyers drive growth, shows new report", "full_content": "India's high net-worth individuals are purchasing higher life insurance coverage, with term insurance bookings in this segment doubling since April 2023 and the average sum assured rising 30%, according to Policybazaar data.\n\nThe data also shows that less than 5% of HNIs opt for term plan with return of premium (TROP), indicating that most prefer insurance primarily to protect their families financially rather than get their premiums back at maturity.\n\nMany people buy term insurance to ensure their families remain financially secure in the event of their untimely death. A term insurance policy is an agreement between the insurance company and the policyholder for a fixed period, typically ranging from 10 to 40 years, during which the insurer pays the death benefit to the beneficiaries if the policyholder passes away.\n\nThe insurance marketplace also said that younger affluent buyers are emerging as a key growth cohort, with customers below the age of 35 accounting for nearly 50% of high net-worth term insurance customers.\n\nThis emerging trend also challenges the traditional perception that high-value life insurance is primarily an older HNI\u2019s purchase. \u201cThis growth is not being driven solely by existing policyholders, topping up their protection, but by younger HNIs entering the market for higher protection,\u201d the report noted.\n\nMeanwhile, women accounted for around 18% of HNI term insurance buyers in 2025, while men made up the remaining 82%, the data showed.\n\nPolicybazaar's data shows a 25% rise in policies with a sum assured of \u20b9 3 crore or more, indicating growing demand for high-value life insurance among HNIs.", "source": "LiveMint Money", "pub_date_str": "29 Oct 2026, 11:21 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Fixed Income"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "November Market Trends: HAL To Vodafone Idea Stocks That Consistently Gave Positive Returns Over A Decade", "full_content": "The Nifty Midcap 100 delivered an average return of 2.7% in November, while the Nifty Smallcap 100 averaged 2% over the 10-year period.", "source": "NDTV Profit", "pub_date_str": "29 Oct 2026, 11:18 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Cruise companies aim to keep fuel costs down. Their strategies for doing so differ", "full_content": "Carnival , Royal Caribbean and Norwegian Cruise Line Holdings posted strong earnings for their most recent quarters despite rising fuel prices. How the leading cruise companies navigate fuel costs boils down to starkly different strategies.\n\nOil prices have skyrocketed since the U.S.-Israel war with Iran began on Feb. 28. Brent crude oil reached a six-month high on Friday, settling at $116.72 per barrel. With no clear end in sight for the conflict in the Middle East, the pressure affecting cruise ships' lifeblood seems poised to last into the holiday travel season and beyond.\n\nBoth Royal Caribbean and Norwegian practice \"hedging,\" or a strategy of using derivatives to reduce exposure to future fuel-price swings, to account for sharp price changes.\n\nCarnival CEO Josh Weinstein, on the other hand, told CNBC in an interview last month that cutting fuel consumption is the best way to avert the effects of expensive fuel.\n\n\"At the end of the day, fuel is an input cost for us. The best thing that we can do to control that cost is to use less,\" Weinstein said at the time.\n\nJefferies analyst David Katz told CNBC in an interview that companies that hedge do so primarily to manage the cost of fuel, but also to manage Wall Street expectations and prevent hectic stock trading based on fuel price fluctuations.\n\n\"When you're public, the Street will trade your stock around based on the price of fuel,\" Katz said. \"The Street's argument is that volatility puts pressure on your multiple.\"\n\n\"While it is mathematically most likely true that over the long term it is more expensive,\" he explained. \"The benefit of having less fuel volatility in the model and less trading volatility is [it's] good for your multiple.\"", "source": "CNBC Top News", "pub_date_str": "29 Oct 2026, 11:15 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Derivatives", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Alphabet\u2019s AI risks deepen as filing reveals $98 billion in commitments beyond the $1 trillion spending", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a Alphabet\u2019s AI risks deepen as filing reveals $98 billion in commitments beyond the $1 trillion spending Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Alphabet\u2019s AI risks deepen as filing reveals $98 billion in commitments beyond the $1 trillion spending SECTIONS Alphabet\u2019s AI risks deepen as filing reveals $98 billion in commitments beyond the $1 trillion spending ETMarkets.com Last Updated: Oct 29, 2026, 11:30:00
