 Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "21 Oct 2026, 09:52 AM IST", "pub_date_relative": "1h ago"}, {"title": "IT Stocks Rally: Wipro, Infosys, Birlasoft Shares Jump Over 3%; Jefferies Sees IT Re-Rating Potential", "full_content": "Wipro, Infosys and Birlasoft lead IT stock gains, while Jefferies sees selective upside in large- and mid-cap stocks and raises large-cap target prices by 1418%.", "source": "NDTV Profit", "pub_date_str": "21 Oct 2026, 09:48 AM IST", "pub_date_relative": "1h ago"}, {"title": "Jio IPO or RIL shares? Where should investors bet as Ambani's Rs 30,213 crore issue opens", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a Jio IPO or RIL shares? Where should investors bet as Ambani's Rs 30,213 crore issue opens Reliance Industries Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Jio IPO or RIL shares? Where should investors bet as Ambani's Rs 30,213 crore issue opens SECTIONS Jio IPO or RIL shares? Where should investors bet as Ambani's Rs 30,213 crore issue opens By Akash Podishetti , ETMarkets.com Last Updated: Oct 21, 2026, 09:48:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Jio Platforms is eyeing a staggering valuation of Rs 10 lakh crore for its upcoming IPO, sparking heated debates among analysts on whether to pursue Jio or Reliance Industries shares. The IPO holds the potential for investors to capitalize on India's booming digital economy, focusing specifically on Jio's telecommunications prowess, while Reliance offers broader sector diversification.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "21 Oct 2026, 09:48 AM IST", "pub_date_relative": "1h ago"}, {"title": "L&T Tech Q2 Review: IDBI Capital Upgrades Rating But Trims Target Price Despite Earnings Beat; Here's Why", "full_content": "L&T Tech's Ebit margin of 16.3% rose 60 basis points QoQ and 220 bps YoY, with all segments expanding, so the mid-16% aspiration arrived two quarters early, adds the brokerage.", "source": "NDTV Profit", "pub_date_str": "21 Oct 2026, 09:46 AM IST", "pub_date_relative": "1h ago"}, {"title": "Japan\u2019s Nikkei jumps over 1% as AI optimism lifts chip stocks; exports rise 16.7%", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Japan\u2019s Nikkei jumps over 1% as AI optimism lifts chip stocks; exports rise 16.7% Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Japan\u2019s Nikkei jumps over 1% as AI optimism lifts chip stocks; exports rise 16.7% SECTIONS Japan\u2019s Nikkei jumps over 1% as AI optimism lifts chip stocks; exports rise 16.7% By Anupam Nagar , ETMarkets.com Last Updated: Oct 21, 2026, 09:46:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Japan\u2019s Nikkei 225 rose 1.56% as renewed optimism over AI demand and gains on Wall Street lifted investor sentiment. Strong export growth and reports of major Chinese technology firms ordering Nvidia chips also supported the rally.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "21 Oct 2026, 09:46 AM IST", "pub_date_relative": "1h ago"}, {"title": "Dividend record date today! 2:1 bonus shares history, 500% returns in 5 years; do you own this multibagger stock?", "full_content": "Multibagger stocks in India: Shares of Elecon Engineering Company Ltd are trading ex-date to finalise the list of eligible shareholders for the payment of the \u20b9 0.50-per-share interim dividend . The company board has declared the dividend record date on 21 October 2026. So, Elecon Engineering shares would also be under the spotlight of investors who look at returns beyond stock movements. For such investors, the ex-date for the dividend payment is crucial, as it is the last day to buy or accumulate additional company shares to be eligible for the cash reward. Interestingly, Elecon Engineering shares have a track record of delivering whopping returns to its shareholders. It is among the multibagger stocks on Dalal Street, having rallied 500% in five years.\n\nThe company board had informed about the interim dividend through an exchange filing, saying, \u201cIn terms of the subject-referred Regulations, this is to inform you that the Board of Directors of the Company at its meeting held today i.e. on 14th October, 2026, inter alia, approved declaration of an Interim Dividend for FY 2026-27 of Re. 0.50/- (i.e. 50%) per Equity Share of Re. 1/- each.\u201d\n\nThe company board also declared the record date to finalise the list of eligible shareholders, saying, \"In terms of the subject-referred Regulations, this is to inform you that the Board of Directors of the Company at its meeting held today i.e. on 14th October, 2026, inter alia, approved the record date for determining the entitlement of the shareholders for the interim dividend shall be Wednesday, 21st October, 2026 pursuant to the Regulation 42 of the SEBI (Listing Obligations and Disclosure Requirements) Regulations, 2015.\"\n\nAccording to information available on the official BSE website, Elecon Engineering shares have a history of issuing bonus shares. The stock traded ex-date on 10 October 2007 to finalise the list of eligible shareholders for the 2:1 bonus share reward.", "source": "LiveMint Markets", "pub_date_str": "21 Oct 2026, 09:45 AM IST", "pub_date_relative": "1h ago"}, {"title": "Philip R. Lane: Euro liquidity lines and the international monetary system", "full_content": "The provision of liquidity is a basic task for a central bank. [ 1 ]\n\nThe ECB injects liquidity through its refinancing operations (currently the main refinancing operations and the longer-term refinancing operations, with very long-term refinancing operations and targeted longer-term refinancing operations deployed in the past) and asset portfolios (previously built up under the asset purchase programme and the pandemic emergency purchase programme). [ 2 ]\n\nSince the ECB only has domestic counterparties in its refinancing operations, it is essential to complement the domestic liquidity framework with international liquidity lines. These lines, which consist of both repo and swap lines, mitigate adverse spillovers in the event of increased demand for euro liquidity abroad and/or impairment in cross-border euro liquidity flows. In the absence of international liquidity provision, such shocks might exert upward pressure on euro money market rates or disrupt the functioning of securities markets and the banking system, and thereby impair monetary policy transmission.\n\nIn recent years, the world economy has undergone profound structural shifts related to geopolitics and changes in the international financial system. These shifts have altered the dynamics of global trade and financial integration and suggest that the macroeconomic and financial environment will remain uncertain and potentially more volatile. More frequent financial disruptions and possible knock-on effects on euro area financial markets have the potential to hamper the smooth transmission of monetary policy.\n\nGiven their backstop pricing, international liquidity lines are designed to be drawn down only in response to shocks and in crisis situations. However, their mere existence \u2013 even without being drawn upon \u2013 can help to prevent adverse market dynamics from arising in the first place.", "source": "ECB Press", "pub_date_str": "21 Oct 2026, 09:45 AM IST", "pub_date_relative": "1h ago"}, {"title": "Reliance Industries shares jump 2.5% on Jio Platforms IPO opening today; Should you buy RIL now? GMP, price band, more", "full_content": "Reliance Jio IPO | Reliance shares : Reliance Industries Ltd (RIL) shares rallied more than 2.5% on Wednesday as investors turned their attention to the highly anticipated initial public offering (IPO) of Jio Platforms, the digital and telecom business backed by billionaire Mukesh Ambani.\n\nThe public issue opened for subscription on October 21 and will close on October 23. Investors will find out their allotment status after the process is expected to be finalised on October 26, while the shares are scheduled to debut on the BSE and NSE on October 28.\n\nWith a potential fundraising of more than \u20b9 30,000 crore, the offering is set to become India's largest IPO by issue size, surpassing Hyundai Motor India's \u20b9 27,800-crore issue launched in October 2024.\n\nJio Platforms has priced its shares between \u20b9 1,065 and \u20b9 1,119 apiece. At the upper end of the band, the company is valued at approximately $108.3 billion, or around \u20b9 10.3 lakh crore.\n\nThe stock jumped as much as 2.6% to its day's high of \u20b9 1,234.60 per share on BSE. It is now 23% away from its 52-week high of \u20b9 1,611.20, hit in January 2026. Meanwhile, it touched its 52-week low of \u20b9 1,152.30 last week on October 13.\n\nIt has shed 2% in 1 month, 6% in 3 months, 10% in 6 months and over 16% in the last 1 year. However, in the last 1 week, it has risen over 4%.\n\nUnofficial grey market indicators point to strong demand for Jio Platforms shares ahead of their stock market debut. According to Investorgain, the IPO's grey market premium (GMP) stood at \u20b9 273 per share.\n\nBased on the upper price band of \u20b9 1,119 and the reported premium, the implied listing price works out to approximately \u20b9 1,392 per share. This translates into a potential gain of 24.40% for investors who receive shares at the upper end of the issue price range.", "source": "LiveMint Markets", "pub_date_str": "21 Oct 2026, 09:43 AM IST", "pub_date_relative": "1h ago"}, {"title": "Eternal Q2 results 2026 today: 24% returns in 6 months | Preview | should you buy multibagger stock ahead of earnings?", "full_content": "Eternal Q2 results 2026 today : Zomato and Blinkit parent company Eternal is all set to announce its financial results for the quarter ending on 30 September, 2026 on Wednesday, 21 October.\n\nEternal share price opened in green in Wednesday's trading session, was trading 0.45% higher at \u20b9 321.60 per share. The stock has given mixed returns in the near-term by falling over 4% in a month and gaining 24% in six months. Furthermore, Eternal shares have proven to be a multibagger stock by giving 155% returns since listing in July 2021.\n\nBrokerages anticipate Eternal to strengthen its market share in food delivery and quick commerce in Q2FY27, supported by improving margins, higher order values and continued store expansion by Blinkit.\n\nKotak Institutional Equities expects Eternal\u2019s revenue to grow 17.4% quarter-on-quarter (QoQ) to \u20b9 23,729.3 crore in Q2FY27. Ebitda is projected to jump 257.4% year-on-year (YoY) to \u20b9 854.2 crore, with the Ebitda margin expanding to 3.6%, up 184 basis points YoY and 66 basis points sequentially. Adjusted profit after tax is estimated to surge 351.1% YoY to \u20b9 293.2 crore, driven by an improvement in operating performance.\n\nThe brokerage forecasts 20% YoY growth in Eternal\u2019s food delivery net order value (NOV) and 75% growth in Blinkit\u2019s NOV. Blinkit\u2019s strong performance, with NOV expected to rise 75% YoY and 19% QoQ, is likely to be driven by rapid store expansion, improved productivity at existing stores and potential market-share gains.", "source": "LiveMint Markets", "pub_date_str": "21 Oct 2026, 09:42 AM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "Jio has record IPO fully subscribed within hours", "full_content": "The initial public offering of Jio Platforms Ltd. was fully subscribed on the first day of bidding, keeping billionaire Mukesh Ambani\u2019s digital venture on track to complete India\u2019s largest-ever listing.\n\nBids exceeded the 197.5 million shares on offer within the first two hours, according to data on BSE Ltd.\u2019s website as of 10.40 a.m. local time. The portions reserved for institutional and wealthy investors were subscribed 3.25 times and 26%, respectively. Retail investors bid for nearly 23% of the shares set aside for them.\n\nA decade after storming into the Indian telecom market with free calls and cheap data that decimated its rivals, the company is aiming for a historic milestone with the IPO.\n\nBut unlike in the triumphant fall of 2016, when its aggressive strategy stoked a price war that left only a single competitor profitable, Ambani\u2019s upstart is coming to the market more cautious and humble. the owner of India\u2019s largest wireless operator, is seeking a valuation that\u2019s roughly 10% lower than its nearest sector rival, Bharti Airtel Ltd.\n\nThe listing marks billionaire Ambani\u2019s return to the capital market after 20 years, an offering that he said will \u201cunlock great value\u201d for parent Reliance Industries Ltd. But a closer look paints a more sobering picture. Reliance shares are on track for their worst annual performance since 2011 and the energy-to-entertainment conglomerate had to prune Jio\u2019s valuations to attract marquee investors.\n\nIt\u2019s a reflection of the roller-coaster ride for the nation\u2019s telecom sector, which features some of the world\u2019s cheapest data plans and a massive user base. Jio\u2019s market value adjustment shows that the market is saturating fast and investors now prefer companies that earn more from each customer over those that service more subscribers.\n\n\u201cWe believe that, following its listing, Jio will likely need to demonstrate growth to public shareholders,\u201d Nomura Holdings Inc.", "source": "LiveMint Markets", "pub_date_str": "21 Oct 2026, 11:37 AM IST", "pub_date_relative": "1m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Swedencare lowers full-year growth ambition after Q3 revenue, EBITDA miss", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Oct 2026, 11:33 AM IST", "pub_date_relative": "5m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Storebrand Q3 earnings miss estimates as guaranteed pensions weaken", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Oct 2026, 11:33 AM IST", "pub_date_relative": "5m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Neobo Fastigheter earnings capacity drops despite record occupancy", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Oct 2026, 11:31 AM IST", "pub_date_relative": "7m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Trump says companies should pay \u2019dividend\u2019 to communities to make data centers popular", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Oct 2026, 11:30 AM IST", "pub_date_relative": "8m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Stock futures rise as traders evaluate latest raft of earnings; SpaceX shares surge: Live updates", "full_content": "U.S. stock futures were up early Wednesday as traders weighed the latest round of earnings reports.\n\nS&P 500 futures gained 0.29% and Nasdaq-100 futures added 0.7%. Dow futures were flat.\n\nIn Asia, South Korea's Kospi advanced 2.7%, rebounding from Tuesday's losses. Japan's Nikkei 225 was up 0.8%. The Hang Seng index declined 0.35%, while mainland China was flat. Australia's S&P/ASX 200 was little changed.\n\nShares of Elon Musk's SpaceX jumped 8% after the company said its revenue grew 161% in the third quarter. Musk also said that SpaceX and Tesla , his auto manufacturer, have formed special committees to discuss a merger. Tesla shares were up 1%.\n\nIn regular trading, the Dow Industrials advanced nearly 530 points, or 1%, buoyed by a post-earnings jump in 3M . Shares gained more than 5% after the industrial products company raised its full-year guidance for profit. The S&P 500 gained 0.3%, while the Nasdaq Composite ended the session marginally lower.\n\nOil prices ended the session slightly lower. West Texas Intermediate crude futures slipped 1.8% on the day, while Brent crude futures lost 0.7%.\n\nThis earnings season could help propel stocks as the year winds down, according to Christian Mueller-Glissmann, head of asset allocation for Goldman Sachs Research.\n\n\"Near term there might be more volatility due to [artificial intelligence] concerns, Middle East tensions and midterm elections, but we think earnings support with lighter positioning and lower valuations should help equities into year-end,\" he wrote in a note .", "source": "CNBC Top News", "pub_date_str": "21 Oct 2026, 11:26 AM IST", "pub_date_relative": "12m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Derivatives", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "South Indian Bank shares: Already up 15% in Oct, hit 52-week high - What is driving rally? More rise ahead? Expert view", "full_content": "South Indian Bank share price rose more than 3% in intraday trade on the BSE on Wednesday, 21 October, to hit a 52-week high of \u20b9 56.21. The stock has been on a roll this month, rising as much as 15% so far in October. In fact, South Indian Bank shares have been hitting back-to-back 52-week highs for the last four consecutive sessions.\n\nThe stock has been witnessing healthy buying interest after the company announced its September quarter (Q2FY27) results during market hours on 15 October.\n\nSouth Indian Bank's net profit was \u20b9 426.13 crore for Q2FY27, up 21.28% year-on-year (YoY).\n\nFor the quarter, the bank reported its highest-ever net interest income (NII) of \u20b9 1,116 crore, up 37.95% YoY. Net interest margin (NIM) improved to 3.33% from 2.80% YoY.\n\nGNPA declined by 169 bps from 2.93% to 1.24% YoY, while NNPA eased by 47 bps from 0.56% to 0.09 % YoY.\n\nThe stock jumped 3.71% on 15 October. However, in the next session, it declined by 0.06% due to profit booking but resumed its upward March on 19 October, rising 5.5%.\n\nMeanwhile, the bank also announced the change in designation of Anto George T from Executive Vice President and Chief Operating Officer to Executive Vice President and Chief Business Officer, effective 1 November 2026.\n\nAdditionally, on 17 October, the company announced the revision of marginal cost of funds based lending rates (MCLR) applicable for multiple tenors, effective 20 October. Overnight MCLR is now 8.20%, while one-year MCLR stands at 9.50%.", "source": "LiveMint Markets", "pub_date_str": "21 Oct 2026, 11:23 AM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Samsung, SK Hynix upgrading China plants to make more advanced chips, people say: Reuters", "full_content": "Samsung Electronics and SK Hynix are upgrading their China factories to produce more advanced memory chips, four people familiar with the plans said, aiming to fend off competition from a fast-growing Chinese rival and meet huge AI demand.\n\nHow much to invest in their Chinese operations has become a tricky question for the South Korean semiconductor giants ever since the US began imposing export controls on some chip-making equipment in 2022 amid an effort to slow China's technological progress.\n\nBoth companies are now required to seek US licenses annually if they want to install US-made equipment such as etching machines in China. The US Commerce Department's Bureau of Industry and Security also said in 2025 it did not intend to grant licenses to upgrade technology and expand capacity at the foreign chipmakers' factories in China.\n\nThe regulatory headaches have limited their ability to refit their factories and contributed to loss of market share to Yangtze Memory Technologies Co (YMTC). Executives at the South Korean chipmakers have publicly warned that geopolitical tensions are undermining their Chinese operations.\n\nSamsung and SK Hynix confirmed in statements to Reuters that upgrades were underway and were being done in close consultation with Washington, but did not disclose details of production plans that are being reported here for the first time.\n\nReuters could not, however, determine to what extent US authorities have granted export licenses for equipment that Samsung and SK Hynix need for their planned upgrades.\n\nAccording to the people, the two companies are working to manufacture flash NAND memory chips with more than 200 layers at their Chinese plants, which would bring them in line with what is being produced in South Korea.\n\nNAND, a type of memory chip that retains data without power, is widely used in smartphones, PCs and solid-state drives for AI data centers. More layers per chip means more storage density and lower costs.", "source": "CNBC Top News", "pub_date_str": "21 Oct 2026, 11:14 AM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "IT stocks on fire, rally up to 15% today; check performance of TCS, L&T Technology, Wipro, Infosys | Jefferies bullish", "full_content": "IT Stocks Today : Indian IT stocks witnessed strong buying on Wednesday, October 21, with L&T Technology Services leading the rally after reporting robust second-quarter results. Moreover, a bullish outlook for the sector by global brokerage house Jefferies also added to the positive sentiment.\n\nThe Nifty IT index climbed as much as 2.6% to an intraday high of 32,348.25, significantly outperforming the benchmark Nifty 50, which gained around 1%. All IT constituents traded in positive territory, suggesting that the buying extended beyond individual earnings announcements.\n\nL&T Technology Services (LTTS) surged as much as 15%, while Wipro advanced 4%. Infosys, Tata Consultancy Services (TCS), Tech Mahindra, HCL Technologies and Mphasis gained between 2% and 3.5%. Persistent Systems, LTIMindtree (LTM) and Coforge also rose more than 1% each.\n\nA strong start to the second-quarter earnings season has helped improve sentiment towards IT companies, with investors responding to better-than-expected results and signs of stabilisation in business conditions. TCS and HCL Technologies have also reported earnings above expectations, offering some reassurance amid concerns about technology spending and the disruptive impact of AI.\n\nL&T Technology Services emerged as the standout performer after reporting higher revenue and profitability for the September quarter.\n\nThe company's Q2FY27 revenue increased 3.4% quarter-on-quarter (QoQ) and 12.1% year-on-year (YoY) to \u20b9 3,040.4 crore. Dollar revenue rose 2.7% QoQ and 4.8% YoY in constant currency terms to $317 million. Net income jumped 53.7% QoQ and 66.8% YoY to \u20b9 548.2 crore.\n\nAnother factor supporting the sector is renewed interest in traditional IT expenditure following Accenture's guidance for the next financial year.", "source": "LiveMint Markets", "pub_date_str": "21 Oct 2026, 11:06 AM IST", "pub_date_relative": "33m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Missed reversal in IT stocks? Jefferies gives 3 ideas with up to 50% re-rating potential", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Missed reversal in IT stocks? Jefferies gives 3 ideas with up to 50% re-rating potential Infosys Share Price Tata Consultancy Services Share Price HCL Technologies Share Price Wipro Share Price Tech Mahindra Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Missed reversal in IT stocks? Jefferies gives 3 ideas with up to 50% re-rating potential SECTIONS Missed reversal in IT stocks? Jefferies gives 3 ideas with up to 50% re-rating potential By Nikhil Agarwal , ETMarkets.com Last Updated: Oct 21, 2026, 11:00:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Jefferies sees further valuation upside in Indian IT stocks despite a muted sector growth outlook. Infosys and TCS offer over 20% rerating potential, while Sagility could deliver more than 50% in a best-case scenario. The brokerage raised target prices for Infosys and TCS, citing scope for growth expectations to stabilise.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "21 Oct 2026, 11:00 AM IST", "pub_date_relative": "39m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Oil prices climb as traders assess Middle East developments", "full_content": "Oil prices climbed Wednesday as worries over Middle East supply disruptions keep the market on edge, with attacks on tankers near the Strait of Hormuz and Saudi energy facilities denting sentiment.\n\nBrent crude futures gained 1.22% $110.13 a barrel, while U.S. West Texas Intermediate crude rose 1.11% to $98.92 a barrel.\n\nBrent crude prices this year Iran's Revolutionary Guards said Tuesday that naval mines had prevented three tankers attempting to pass through the Strait of Hormuz using routes Tehran deemed unauthorized.\n\n\"Two violating oil tankers were set ablaze and halted due to the explosion of mines planted by the brave sailors of the IRGC Navy at an illegal crossing point in the southern part of the Strait of Hormuz,\" IRGC said in a statement published on their official Sepah News website .\n\nAdding to regional worries, Yemen's Houthi militants claimed responsibility on Monday for strikes targeting Saudi Aramco facilities in Yanbu, the Shaybah oilfield and airports in Riyadh and Abha.\n\nThe escalating tensions have also sent global oil shipping costs soaring, adding another layer of pressure to energy markets.\n\nThe global average crude freight rate has surged above $20 per barrel, compared with just $3 a year earlier, according to a Goldman Sachs report published Tuesday. While rates have eased slightly in recent days, they remain roughly seven times higher than a year ago.\n\nGoldman estimated that war-risk premiums associated with crossing the Strait of Hormuz accounted for about $7 of the $20 year-on-year increase in average crude freight rates, while ship-to-ship transfers outside the Persian Gulf contributed another $4.", "source": "CNBC Top News", "pub_date_str": "21 Oct 2026, 10:57 AM IST", "pub_date_relative": "41m ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Multibagger stock: PC Jeweller shares jump 5% after surging 40% in 2 weeks | Q2 beat, bulk deal in focus | Key levels", "full_content": "PC Jeweller shares jumped nearly 5% on Wednesday, 21 October, amid a broadly positive trend in the Indian stock market. The stock has rallied around 40% over the past two weeks, supported by strong buying momentum following the company\u2019s Q2 FY27 results and renewed investor interest after reports of a bulk deal involving Aditya Kumar Halwasiya, who is associated with Cupid Ltd.\n\nThe stock\u2019s gains have extended beyond the recent rally. PC Jeweller shares have surged 27.44% in one week, 40.23% in two weeks and 44.18% over one month. The stock has gained 83.30% over three months, 92.08% over six months, and 98.07% year-to-date, according to the BSE data.\n\nHowever, technical analysts caution that the sharp rally has pushed the stock into overbought territory, with key resistance levels around \u20b9 19\u2013 \u20b9 20 likely to determine its next move.\n\nInvestor attention has also turned to a reported bulk deal on 16 October, in which Aditya Kumar Halwasiya, associated with Cupid Ltd, purchased 5.10 crore PC Jeweller shares worth approximately \u20b9 73.59 crore at an average price of \u20b9 14.43 per share.\n\nThe transaction has drawn attention amid the jewellery retailer\u2019s ongoing financial turnaround. However, the bulk deal alone does not establish the investor\u2019s long-term intentions or explain the stock\u2019s subsequent price movement.\n\nThe company\u2019s Q2 FY27 performance has provided another focus for investors. PC Jeweller reported a 28% year-on-year increase in consolidated revenue for the July\u2013September quarter, citing healthy consumer demand.\n\nThe company also said it received remittances of \u20b9 142 crore during the quarter from outstanding export debtors.\n\nIn September, PC Jeweller announced that it had cleared its dues to all 14 consortium banks, effectively becoming debt-free after addressing borrowings that had amounted to around \u20b9 3,000 crore. The company had opted for a one-time settlement (OTS) of its outstanding bank dues in September 2024.", "source": "LiveMint Markets", "pub_date_str": "21 Oct 2026, 10:51 AM IST", "pub_date_relative": "48m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Bajaj Finance shares fall 3% after Q2 results. What Jefferies, Nomura, other brokerages now expect?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Bajaj Finance shares fall 3% after Q2 results. What Jefferies, Nomura, other brokerages now expect? 360 One Wam Share Price Anand Rathi Wealth Share Price Nuvama Wealth Management Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Bajaj Finance shares fall 3% after Q2 results. What Jefferies, Nomura, other brokerages now expect? SECTIONS Bajaj Finance shares fall 3% after Q2 results. What Jefferies, Nomura, other brokerages now expect? By Debaroti Adhikary , ETMarkets.com Last Updated: Oct 21, 2026, 10:47:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Bajaj Finance shares dropped on Wednesday after the NBFC reported a 29% year-on-year rise in Q2FY27 net profit to Rs 6,367 crore. Nomura and Jefferies retained Buy ratings, with Jefferies cutting its target price, while 360 One WAM upgraded the stock to Buy, citing improving risk-reward and strong growth.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "21 Oct 2026, 10:47 AM IST", "pub_date_relative": "52m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Hindustan Zinc share jumps 4% after strong Q2 results 2026 | Should you buy Vedanta Group stock? Target, stop loss", "full_content": "Hindustan Zinc share price surged as much as 4%, touching an intraday high of \u20b9 559.85 on NSE, in Wednesday's trading session after the Vedanta Group company reported strong quarterly results on Monday.\n\nHindustan Zinc share price opened at the day's high of \u20b9 559.85, as compared to previous close of \u20b9 538.40 on Monday.\n\nHindustan Zinc on Monday reported a consolidated net profit of \u20b9 6,412 crore for the second quarter of FY27, registering a 142% year-on-year (YoY) jump from \u20b9 2,649 crore in the corresponding quarter last year. The company\u2019s shares surged to \u20b9 560 apiece on the NSE on Wednesday morning.\n\nThe metal producer\u2019s revenue from operations rose 76.5% YoY to \u20b9 15,093 crore in the July-September quarter of FY27, compared with \u20b9 8,549 crore in the year-ago period. The growth was driven by higher metal prices, increased production volumes, better realisations from by-products, and a stronger US dollar. Meanwhile, total expenses increased nearly 31.5% YoY to \u20b9 6,895 crore during the quarter.\n\nHindustan Zinc\u2019s EBITDA more than doubled year-on-year (YoY), rising 108% to \u20b9 9,285 crore, while its EBITDA margin expanded to 62% from 52% in the corresponding period last year. The growth was supported by a 141% YoY surge in net silver sales to \u20b9 4,111 crore and a 54% increase in zinc sales to \u20b9 8,224 crore. Lead sales and other metal sales also rose 35% and 151% YoY, respectively.\n\nHindustan Zinc share price has remained largely flat over the past week, rising just 0.06%, but the stock has witnessed a sharper correction over the past month. The shares have declined 8.69% in one month and are down 11.70% year-to-date (YTD), indicating pressure on the stock in the near term.\n\nDespite the recent weakness, Hindustan Zinc has delivered positive returns over longer periods, gaining 11.68% over the past year and 75.10% over three years.", "source": "LiveMint Markets", "pub_date_str": "21 Oct 2026, 10:44 AM IST", "pub_date_relative": "54m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Transrail Lighting shares rally 9% after bagging orders worth Rs 927 crore", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Transrail Lighting shares rally 9% after bagging orders worth Rs 927 crore Transrail Lighting Share Price Kalpataru Projects International Share Price GE Power India Share Price The Economic Times d capital structure, dividends, M&A) are core exam material."}, {"title": "Global Market | Safe-haven assets under pressure: Dollar, Swiss franc, German bonds and gold in focus", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a Global Market | Safe-haven assets under pressure: Dollar, Swiss franc, German bonds and gold in focus Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market | Safe-haven assets under pressure: Dollar, Swiss franc, German bonds and gold in focus SECTIONS Global Market | Safe-haven assets under pressure: Dollar, Swiss franc, German bonds and gold in focus By Anupam Nagar , ETMarkets.com Last Updated: Oct 21, 2026, 10:40:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Safe-haven demand is shifting amid AI-driven market volatility, geopolitical tensions, rising energy prices and mounting government debt. The US dollar, Swiss franc, German Bunds, short-term government bonds and gold offer potential protection, but differing risks and volatile returns highlight the challenges of safeguarding portfolios during market uncertainty.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "21 Oct 2026, 10:40 AM IST", "pub_date_relative": "59m ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Global Market: Japanese government bond yields fall as safe-haven demand returns", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Global Market: Japanese government bond yields fall as safe-haven demand returns Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market: Japanese government bond yields fall as safe-haven demand returns SECTIONS Global Market: Japanese government bond yields fall as safe-haven demand returns By Anupam Nagar , ETMarkets.com Last Updated: Oct 21, 2026, 10:34:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Japanese government bond prices rose for a third session as attractive yields and safe-haven demand boosted investor interest. Record demand at a 20-year bond auction supported the recovery, while global yields declined. Economists expect the Bank of Japan to raise interest rates to 1.50% in December, though October rates may remain unchanged.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "21 Oct 2026, 10:34 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Fixed Income"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "How Reliance Jio IPO is acting as shot in the arm for RIL shares \u2014 Will Mukesh Ambani company stock fly more? Buy now?", "full_content": "Reliance Industries share | Jio Platforms IPO: Shares of Reliance Industries Ltd (RIL) have been on an uptrend ever since the Jio Platforms IPO RHP was filed. After hitting the 52-week low of \u20b9 1,152.20 per share ahead of the Jio Platforms IPO subscription opening, strong buying triggers are fueling RIL shares for the last few sessions. As the Jio Platforms IPO subscription opens today, Reliance share price opened with an upside gap at \u20b9 1,212 and touched an intraday high of \u20b9 1,234.30 per share within a few minutes of the Opening Bell, clocking an intraday gain of 1.75%.\n\nAccording to stock market experts, this rally in Mukesh Ambani's company's shares can be attributed to the opening of Jio Platforms' IPO subscription. They said that RIL holds around two-thirds of Jio Platforms' stake, and a rise in Reliance Jio Platforms' market cap or valuation would translate into a two-thirds benefit for Reliance Industries and its shares. They said that the market is expecting around \u20b9 350 to \u20b9 500 per share value addition by Jio Platforms' share listing in the RIL shares. However, this may not happen in the short term, but they advised a \u2018buy-on-dips\u2019 strategy in Reliance shares as it may touch up to \u20b9 1,700 per share by the end of FY27.\n\nWhether Jio Platforms IPO is acting as a shot in the arm of Reliance Industries shares, Avinash Gorakshkar, Founder of Avinash Mentor Research, said, \u201cThe market is expecting the benefit of value unlocking for RIL, as it holds around one-third stake in Reliance Jio Platforms. So, this rally in the RIL shares can be attributed to the Jio Platforms IPO subscription opening.\u201d\n\nOn how one can connect Jio Platforms IPO with Reliance Industries' shares. Avinnash Gorakshkar said that even after value unlock from RIL, the balance sheets of these two companies would be connected due to RIL's strong two-thirds shareholding.", "source": "LiveMint Markets", "pub_date_str": "21 Oct 2026, 10:33 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Hindustan Zinc\u2019s Q2 earnings glow on lower costs, higher metal prices", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nHindustan Zinc Ltd\u2019s (HZL) earnings are benefiting from three key factors: higher metal prices, lower cost of production (CoP) and improved volumes.\n\nThe September quarter (Q2FY27) results were strong, with year-on-year growth in revenue and earnings similar to Q1. Q2\u2019s consolidated revenue rose a whopping 77% year-on-year to \u20b9 15,100 crore. Operating leverage and a sharp drop in production cost meant Ebitda grew 108% to \u20b9 9,250 crore.\n\nSilver prices on LBMA averaged $62.6 per ounce (oz) in Q2, up nearly 60% year-on-year. Sales volumes rose 24% to 183 tonnes, including 10 tonnes in lead concentrate, following capacity augmentation through debottlenecking projects completed in H2FY26. H1 production of 340 tonnes was in line with FY27 guidance of 680 tonnes. However, the benefit from higher realizations could moderate from Q3FY27, with silver prices declining to around $58 per oz currently, close to the Q3FY26 average of $54.7 per oz.\n\nZinc prices also rose sharply, averaging $3,825 per tonne on the London Metal Exchange in Q2FY27, up 35% year-on-year. The market is seeing a sharp demand-supply mismatch, driven by mine closures and inadequate fresh investment. Prices have since fallen from a mid-September peak of about $4,200 per tonne to around $3,740 per tonne, which could limit the upside in Q3FY27.\n\nCost savings have also fuelled earnings. HZL\u2019s zinc CoP, excluding royalty, fell 29% year-on-year to $703 per tonne in Q2 and to $776 per tonne in H1, aided by higher prices for the key by-product sulphuric acid and an increased share of renewable energy. Disruption in sulphur supplies amid the West Asia war has lifted sulphuric acid prices. Thus, the management has lowered its FY27 CoP guidance to $825-850 per tonne from $975-1,000 per tonne earlier.\n\nSales volumes of refined metals, comprising zinc and lead, increased 8% to 0.26 million tonnes (mt) last quarter.", "source": "LiveMint Markets", "pub_date_str": "21 Oct 2026, 10:33 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Global Market: China's yuan hits four-year high on export strength, weak dollar", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Global Market: China's yuan hits four-year high on export strength, weak dollar Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market: China's yuan hits four-year high on export strength, weak dollar SECTIONS Global Market: China's yuan hits four-year high on export strength, weak dollar By Anupam Nagar , ETMarkets.com Last Updated: Oct 21, 2026, 10:21:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis China\u2019s onshore yuan touched a more than four-year high against the US dollar, supported by robust exports, resilient economic growth, foreign exchange inflows and a weaker greenback. The currency has gained 4.7% against the dollar so far in 2026.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "21 Oct 2026, 10:21 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "HD Fire Protect IPO Listing: Shares Debut With 24% On NSE, BSE", "full_content": "HD Fire Protect Ltd debuted on the stock market with a 23% premium, opening at Rs 335 on NSE against an IPO price of Rs 271.", "source": "NDTV Profit", "pub_date_str": "21 Oct 2026, 10:19 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Indian bonds sell off on oil shock ahead of RBI policy minutes", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Bonds \u203a Indian bonds sell off on oil shock ahead of RBI policy minutes Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Indian bonds sell off on oil shock ahead of RBI policy minutes SECTIONS Indian bonds sell off on oil shock ahead of RBI policy minutes Reuters Last Updated: Oct 21, 2026, 10:11:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Indian government bonds experienced a significant decline due to rising oil prices, raising concerns about inflation among investors. The benchmark bond yield has reached its highest point since March, leading to a more cautious trading environment. Additionally, consumer inflation in India rose to 5.54%, with forecasts indicating further increases in October.\n\nIndian government bonds experienced a significant decline due to rising oil prices, raising concerns about inflation among investors. The benchmark bond yield has reached its highest point since March, leading to a more cautious trading environment. Additionally, consumer inflation in India rose to 5.54%, with forecasts indicating further increases in October.\n\nYes Bank CET1 may fall to 10% if past AT1 coupons are paid: Crisil\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "21 Oct 2026, 10:11 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Why is stock market up today? Sensex rises 829 points, Nifty surges 1% | Top 4 reasons behind D-Street soar explained", "full_content": "Stock Market Today : Indian stock market benchmarks Sensex and Nifty 50 opened sharply higher on Wednesday, buoyed by hopes of a potential India-US trade agreement. However, rising crude oil prices and elevated US bond yields remained key concerns that could limit further gains.\n\nThe BSE Sensex surged 829 points, or 1.1%, to an intraday high of 74,682.19, while the Nifty 50 climbed 232 points, or 1%, to 23,120.90.\n\nAt the opening bell, the Sensex stood at 74,337.93, compared with its previous close of 73,852.90. The Nifty 50 began trading at 23,016, against its previous close of 22,888.95.\n\nInvestors were also tracking the much-anticipated Jio Platforms IPO, which opened for subscription on Wednesday, alongside developments in the ongoing second-quarter earnings season.\n\nSectoral performance was broadly positive, led by information technology stocks. The Nifty IT index advanced 2.03%, while the Nifty PSU Bank and Nifty Metal indices gained 0.74% and 0.70%, respectively. The Nifty Media index was the sole major sectoral laggard, declining 0.15%.\n\nAmong Nifty 50 constituents, Infosys topped the gainers with a 2.47% rise, followed by Tata Consultancy Services (TCS), which advanced 2.08%, and UltraTech Cement, up 1.96%.\n\nOn the losing side, Bajaj Finance fell 2.32%, emerging as the biggest laggard on the benchmark, while Bajaj Finserv slipped 0.49%.\n\n\"With Brent crude prices and US bond yields remaining elevated, the market is likely to remain under pressure. The sell-on-rally market construct will continue in the near term. However, the improving earnings growth, fair valuations of large-caps, and strong domestic liquidity will support the market on declines,\" said V K Vijayakumar, Chief Investment Strategist, Geojit Investments Limited.", "source": "LiveMint Markets", "pub_date_str": "21 Oct 2026, 10:10 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Fixed Income", "Alternative Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Jio Platforms IPO Live Updates: Issue Subscribed 83%, QIBs Lead Bidding", "full_content": "Jio Platforms' Rs 30,213-crore IPO opens today. Track subscription trends, investor demand, GMP, allotment details and listing updates here.", "source": "NDTV Profit", "pub_date_str": "21 Oct 2026, 10:05 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "L&T Tech Services shares surge 15% after Q2 2026 results - Should investors buy, sell, or hold stock? Experts suggestion", "full_content": "L&T Technology Services shares soared as much as 15% in morning deals on the BSE on Wednesday, 21 October, buoyed by the company's September quarter (Q2FY27) results. L&T Technology Services share price opened at \u20b9 3,848 against its previous close of \u20b9 3,609.80 and jumped 14.70% to an intraday high of \u20b9 4,140.50.\n\nAfter market hours on Monday, 19 October, L&T Technology Services announced its Q2FY27 revenue stood at \u20b9 3,040.4 crore, rising 3.4% quarter-on-quarter (QoQ) and 12.1% year-on-year (YoY).\n\nDollar revenue increased by 2.7% QoQ and 4.8% YoY in constant currency (CC) terms to $317 million for the quarter.\n\nThe company's net income for the quarter rose by 53.7% QoQ and 66.8% YoY to \u20b9 548.2 crore, including one-time gain of \u20b9 165 crore from the disinvestment of the SWC business.\n\nMoreover, the comapny also Iannounced an interim dividend of \u20b9 20 per share, with a record date of 27 October 2026.\n\nL&T Technology Services' Q2 results were better-than-expected which prompted positive reviews by some of the top domestic brokerage firms.\n\nBrokerage firm JM Financial maintained an \"add\" call on the stock after the Q2 results but raised the target price to \u20b9 3,890 from \u20b9 3,575 earlier.\n\n\"L&T Technology Services reported a strong Q2FY27 with revenue and margins beating estimates. Forward-looking indicators includes large-deal TCV stood at $203 million, higher sequentially (nearly $100 million in Q1FY27), while the deal pipeline increased more than 25% YoY,\" JM Financial noted.", "source": "LiveMint Markets", "pub_date_str": "21 Oct 2026, 10:03 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Transrail Lighting shares skyrocket 10% | \u20b9927 cr order wins, 990 MW solar deal in focus - what investors should know", "full_content": "Transrail Lighting share price jumped nearly 10% on Wednesday, 21 October, after the company announced fresh orders worth \u20b9 927 crore, largely in its domestic power transmission and distribution (T&D) business.\n\nWith these wins, the company\u2019s order intake for the year has risen to \u20b9 3,356 crore. The latest orders primarily comprise engineering, procurement and construction (EPC) projects for 765 kV and 400 kV transmission lines in the domestic market, along with conductor supply orders from the US.\n\nThe latest wins extend Transrail Lighting\u2019s order-winning momentum, with the company announcing orders worth more than \u20b9 2,300 crore over the past three weeks.\n\nThe company said its expansion of in-house manufacturing capabilities for transmission towers and conductors, coupled with robust domestic and international demand for T&D infrastructure, positions it to sustain growth.\n\n\u201cThe strong momentum in our order inflows underscores Transrail\u2019s growing scale and competitiveness in the power T&D sector. Our ability to secure complex transmission EPC projects, backed by our in-house tower and conductor manufacturing capabilities, remains a key differentiator,\u201d said Randeep Narang, Managing Director and CEO of Transrail Lighting.\n\nHe added that the company would continue to leverage its strong domestic presence and expanding international business to build a well-diversified portfolio across products and services.\n\nThe company\u2019s board also approved the proposed acquisition of a 49% equity stake in NOPL Pace Green Energy for a cash consideration of \u20b9 20 crore, subject to the requisite approvals and fulfilment of agreed conditions.\n\nNOPL is developing a 990 MW (AC) solar power portfolio in Maharashtra under the PM-KUSUM scheme. The portfolio is backed by a 25-year power purchase agreement (PPA) with Maharashtra State Electricity Distribution Company (MSEDCL) at a tariff of \u20b9 3.10 per unit.", "source": "LiveMint Markets", "pub_date_str": "21 Oct 2026, 10:02 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Corporate Issuers", "Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Gold, silver prices today, 21 October: Check retail rates of 24K, 22K gold, 999 silver in Delhi, Mumbai and Kolkata", "full_content": "Gold and silver prices: Gold prices fell for a fourth consecutive session on Wednesday as rising oil prices fuelled concerns over inflation. Investors are also awaiting next week\u2019s US Federal Reserve policy meeting for clues about the future direction of interest rates.\n\nSpot gold declined 0.2% to $4,118.18 per ounce, while US gold futures for December delivery fell 0.2% to $4,136.20, according to Reuters.\n\nMarkets are pricing in a 16% chance of a rate hike at the Fed\u2019s October 27\u201328 policy meeting, while the probability of a hike in December remains around 90%. Higher interest rates typically weigh on gold prices as they increase the opportunity cost of holding the non-interest-bearing metal. Meanwhile, the US dollar index stabilised after recent losses, limiting demand for bullion.\n\nInvestors are also awaiting US Personal Consumption Expenditures (PCE) inflation data due next week. The PCE price index is the Fed\u2019s preferred measure for tracking inflation against its 2% target, according to Reuters. Among other precious metals, spot silver fell 0.9% to $57.44 per ounce.\n\nIn the domestic market, MCX gold futures were trading 0.40% lower at \u20b9 1,45,939 per 10 grams on October 21. MCX silver futures declined around 0.94% to \u20b9 2,09,494 per kg at approximately 9:40 am.\n\nGold is available in different purities in the retail market, with 24-karat gold being the purest form and 22-karat gold commonly used to make jewellery due to its greater durability.\n\nHere\u2019s a look at the latest gold prices in major Indian cities on 21 October.\n\nDisclaimer: Gold and silver prices are indicative and may vary across jewellers and locations. This is for informational purposes only.", "source": "LiveMint Money", "pub_date_str": "21 Oct 2026, 09:56 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Quantitative Methods", "Economics", "Derivatives", "Alternative Investments"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "Your First Rs 10 Lakh Corpus: SIP, Savings Or A Mix Of Both?", "full_content": "Keeping debt components in your portfolio can help balance it and protect you during market volatility even if you have a higher risk appetite.", "source": "NDTV Profit", "pub_date_str": "21 Oct 2026, 09:53 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Sobha Shares Fall Over 4% After Q2 Results", "full_content": "Sobha's total traded volume so far in the day st s; exports rise 16.7% SECTIONS Japan\u2019s Nikkei jumps over 1% as AI optimism lifts chip stocks; exports rise 16.7% By Anupam Nagar , ETMarkets.com Last Updated: Oct 21, 2026, 09:46:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Japan\u2019s Nikkei 225 rose 1.56% as renewed optimism over AI demand and gains on Wall Street lifted investor sentiment. Strong export growth and reports of major Chinese technology firms ordering Nvidia chips also supported the rally.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "21 Oct 2026, 09:46 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Dividend record date today! 2:1 bonus shares history, 500% returns in 5 years; do you own this multibagger stock?", "full_content": "Multibagger stocks in India: Shares of Elecon Engineering Company Ltd are trading ex-date to finalise the list of eligible shareholders for the payment of the \u20b9 0.50-per-share interim dividend . The company board has declared the dividend record date on 21 October 2026. So, Elecon Engineering shares would also be under the spotlight of investors who look at returns beyond stock movements. For such investors, the ex-date for the dividend payment is crucial, as it is the last day to buy or accumulate additional company shares to be eligible for the cash reward. Interestingly, Elecon Engineering shares have a track record of delivering whopping returns to its shareholders. It is among the multibagger stocks on Dalal Street, having rallied 500% in five years.\n\nThe company board had informed about the interim dividend through an exchange filing, saying, \u201cIn terms of the subject-referred Regulations, this is to inform you that the Board of Directors of the Company at its meeting held today i.e. on 14th October, 2026, inter alia, approved declaration of an Interim Dividend for FY 2026-27 of Re. 0.50/- (i.e. 50%) per Equity Share of Re. 1/- each.\u201d\n\nThe company board also declared the record date to finalise the list of eligible shareholders, saying, \"In terms of the subject-referred Regulations, this is to inform you that the Board of Directors of the Company at its meeting held today i.e. on 14th October, 2026, inter alia, approved the record date for determining the entitlement of the shareholders for the interim dividend shall be Wednesday, 21st October, 2026 pursuant to the Regulation 42 of the SEBI (Listing Obligations and Disclosure Requirements) Regulations, 2015.\"\n\nAccording to information available on the official BSE website, Elecon Engineering shares have a history of issuing bonus shares. The stock traded ex-date on 10 October 2007 to finalise the list of eligible shareholders for the 2:1 bonus share reward.", "source": "LiveMint Markets", "pub_date_str": "21 Oct 2026, 09:45 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Philip R. Lane: Euro liquidity lines and the international monetary system", "full_content": "The provision of liquidity is a basic task for a central bank. [ 1 ]\n\nThe ECB injects liquidity through its refinancing operations (currently the main refinancing operations and the longer-term refinancing operations, with very long-term refinancing operations and targeted longer-term refinancing operations deployed in the past) and asset portfolios (previously built up under the asset purchase programme and the pandemic emergency purchase programme). [ 2 ]\n\nSince the ECB only has domestic counterparties in its refinancing operations, it is essential to complement the domestic liquidity framework with international liquidity lines. These lines, which consist of both repo and swap lines, mitigate adverse spillovers in the event of increased demand for euro liquidity abroad and/or impairment in cross-border euro liquidity flows. In the absence of international liquidity provision, such shocks might exert upward pressure on euro money market rates or disrupt the functioning of securities markets and the banking system, and thereby impair monetary policy transmission.\n\nIn recent years, the world economy has undergone profound structural shifts related to geopolitics and changes in the international financial system. These shifts have altered the dynamics of global trade and financial integration and suggest that the macroeconomic and financial environment will remain uncertain and potentially more volatile. More frequent financial disruptions and possible knock-on effects on euro area financial markets have the potential to hamper the smooth transmission of monetary policy.\n\nGiven their backstop pricing, international liquidity lines are designed to be drawn down only in response to shocks and in crisis situations. However, their mere existence \u2013 even without being drawn upon \u2013 can help to prevent adverse market dynamics from arising in the first place.", "source": "ECB Press", "pub_date_str": "21 Oct 2026, 09:45 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Fixed Income", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Reliance Industries shares jump 2.5% on Jio Platforms IPO opening today; Should you buy RIL now? GMP, price band, more", "full_content": "Reliance Jio IPO | Reliance shares : Reliance Industries Ltd (RIL) shares rallied more than 2.5% on Wednesday as investors turned their attention to the highly anticipated initial public offering (IPO) of Jio Platforms, the digital and telecom business backed by billionaire Mukesh Ambani.\n\nThe public issue opened for subscription on October 21 and will close on October 23. Investors will find out their allotment status after the process is expected to be finalised on October 26, while the shares are scheduled to debut on the BSE and NSE on October 28.\n\nWith a potential fundraising of more than \u20b9 30,000 crore, the offering is set to become India's largest IPO by issue size, surpassing Hyundai Motor India's \u20b9 27,800-crore issue launched in October 2024.\n\nJio Platforms has priced its shares between \u20b9 1,065 and \u20b9 1,119 apiece. At the upper end of the band, the company is valued at approximately $108.3 billion, or around \u20b9 10.3 lakh crore.\n\nThe stock jumped as much as 2.6% to its day's high of \u20b9 1,234.60 per share on BSE. It is now 23% away from its 52-week high of \u20b9 1,611.20, hit in January 2026. Meanwhile, it touched its 52-week low of \u20b9 1,152.30 last week on October 13.\n\nIt has shed 2% in 1 month, 6% in 3 months, 10% in 6 months and over 16% in the last 1 year. However, in the last 1 week, it has risen over 4%.\n\nUnofficial grey market indicators point to strong demand for Jio Platforms shares ahead of their stock market debut. According to Investorgain, the IPO's grey market premium (GMP) stood at \u20b9 273 per share.\n\nBased on the upper price band of \u20b9 1,119 and the reported premium, the implied listing price works out to approximately \u20b9 1,392 per share. This translates into a potential gain of 24.40% for investors who receive shares at the upper end of the issue price range.", "source": "LiveMint Markets", "pub_date_str": "21 Oct 2026, 09:43 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Eternal Q2 results 2026 today: 24% returns in 6 months | Preview | should you buy multibagger stock ahead of earnings?", "full_content": "Eternal Q2 results 2026 today : Zomato and Blinkit parent company Eternal is all set to announce its financial results for the quarter ending on 30 September, 2026 on Wednesday, 21 October.\n\nEternal share price opened in green in Wednesday's trading session, was trading 0.45% higher at \u20b9 321.60 per share. The stock has given mixed returns in the near-term by falling over 4% in a month and gaining 24% in six months. Furthermore, Eternal shares have proven to be a multibagger stock by giving 155% returns since listing in July 2021.\n\nBrokerages anticipate Eternal to strengthen its market share in food delivery and quick commerce in Q2FY27, supported by improving margins, higher order values and continued store expansion by Blinkit.\n\nKotak Institutional Equities expects Eternal\u2019s revenue to grow 17.4% quarter-on-quarter (QoQ) to \u20b9 23,729.3 crore in Q2FY27. Ebitda is projected to jump 257.4% year-on-year (YoY) to \u20b9 854.2 crore, with the Ebitda margin expanding to 3.6%, up 184 basis points YoY and 66 basis points sequentially. Adjusted profit after tax is estimated to surge 351.1% YoY to \u20b9 293.2 crore, driven by an improvement in operating performance.\n\nThe brokerage forecasts 20% YoY growth in Eternal\u2019s food delivery net order value (NOV) and 75% growth in Blinkit\u2019s NOV. Blinkit\u2019s strong performance, with NOV expected to rise 75% YoY and 19% QoQ, is likely to be driven by rapid store expansion, improved productivity at existing stores and potential market-share gains.", "source": "LiveMint Markets", "pub_date_str": "21 Oct 2026, 09:42 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Global Market: South Korean shares jump 3% as chipmakers rally on strong exports, AI demand", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Global Market: South Korean shares jump 3% as chipmakers rally on strong exports, AI demand Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market: South Korean shares jump 3% as chipmakers rally on strong exports, AI demand SECTIONS Global Market: South Korean shares jump 3% as chipmakers rally on strong exports, AI demand By Anupam Nagar , ETMarkets.com Last Updated: Oct 21, 2026, 09:40:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis South Korea\u2019s KOSPI surged 3.03% after hitting a six-month closing low, supported by a rally in chipmakers, record semiconductor exports and optimism over sustained AI infrastructure demand. Foreign investor buying also aided the rebound.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
