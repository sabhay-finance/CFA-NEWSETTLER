Thursday note. \"The U.S.", "source": "CNBC Top News", "pub_date_str": "05 Nov 2026, 09:09 PM IST", "pub_date_relative": "1m ago"}, {"title": "Why is Tesla stock sliding today?", "full_content": "", "source": "Investing.com News", "pub_date_str": "05 Nov 2026, 09:03 PM IST", "pub_date_relative": "7m ago"}, {"title": "UBS lowers Adient stock price target on industry headwinds", "full_content": "", "source": "Investing.com News", "pub_date_str": "05 Nov 2026, 09:03 PM IST", "pub_date_relative": "8m ago"}, {"title": "Stifel raises Chatham Lodging Trust price target on business travel strength", "full_content": "", "source": "Investing.com News", "pub_date_str": "05 Nov 2026, 09:02 PM IST", "pub_date_relative": "8m ago"}, {"title": "UBS cuts Flutter Entertainment stock price target on earnings outlook", "full_content": "", "source": "Investing.com News", "pub_date_str": "05 Nov 2026, 09:02 PM IST", "pub_date_relative": "8m ago"}, {"title": "Raymond James raises Edgewise Therapeutics price target on FDA feedback", "full_content": "", "source": "Investing.com News", "pub_date_str": "05 Nov 2026, 09:02 PM IST", "pub_date_relative": "8m ago"}, {"title": "Stifel reiterates Buy rating on Amylyx stock ahead of data", "full_content": "", "source": "Investing.com News", "pub_date_str": "05 Nov 2026, 09:02 PM IST", "pub_date_relative": "8m ago"}, {"title": "Nasdaq extends opening slide to over 4% amid post-midterms rotation out of chips", "full_content": "", "source": "Investing.com News", "pub_date_str": "05 Nov 2026, 09:02 PM IST", "pub_date_relative": "8m ago"}, {"title": "Betski secures a $15 Million Investment Commitment from Nimbus Capital to Accelerate its Global Growth", "full_content": "", "source": "Investing.com News", "pub_date_str": "05 Nov 2026, 09:02 PM IST", "pub_date_relative": "8m ago"}, {"title": "ConocoPhillips beats estimates on higher oil prices, raises dividend", "full_content": "", "source": "Investing.com News", "pub_date_str": "05 Nov 2026, 09:02 PM IST", "pub_date_relative": "9m ago"}, {"title": "Natural gas storage levels decline, signaling rising demand", "full_content": "", "source": "Investing.com News", "pub_date_str": "05 Nov 2026, 09:02 PM IST", "pub_date_relative": "9m ago"}, {"title": "Democratic sweep puts crypto on defensive in Washington", "full_content": "Democrats' sweep of Congress likely resets the political calculus for crypto, ushering in a more adversarial approach in Washington and pushing industry-friendly legislation like the Clarity Act to the back burner.\n\nWith crypto critics like Sherrod Brown (D-Ohio) returning to the Senate and Sen. Elizabeth Warren (D-Mass) retaining significant influence over financial policy, analysts say the new Congress is likely to focus on scrutinizing President Donald Trump's personal crypto dealings over supportive industry legislation.\n\nFor years, crypto fought an uphill battle in Washington, asking for clear operating rules, but often landing on the receiving end of regulation by enforcement. That shifted after Trump's 2024 election victory, giving the industry a reprieve and seat at the policy table.\n\n\"We see Sherrod Brown winning in Ohio as damaging the crypto industry's political clout as the industry worked to defeat him,\" Jaret Seiberg, TD Cowen's Washington analyst, said in a note Wednesday. \"We did not think Clarity could advance over the next two years. This makes us more confident in our prediction.\"\n\nThe crypto industry spent more than $200 million to sway the midterms, hoping to get leaders elected that could push a comprehensive crypto market structure bill over the finish line after the Clarity Act stalled in the Senate .\n\nSeiberg emphasized that Democrats \"will investigate Trump's crypto entanglements including World Liberty Financial\" and said \"the resulting political environment may make it impossible to advance a version of Clarity that the crypto sector could back.\"\n\nMike Townsend, Charles Schwab's managing director of legislative and regulatory affairs, said he expects \"Democrats to push next year for a version of the bill that is much tougher on cryptocurrency companies.\"\n\nThe stakes extend beyond market structure legislation via Clarity.", "source": "CNBC World Economy", "pub_date_str": "05 Nov 2026, 09:00 PM IST", "pub_date_relative": "10m ago"}, {"title": "\u2018My life could be cut short\u2019: I\u2019m 55, married and have a brain tumor. Should I splash out on a $210,000 Porsche?", "full_content": "\u201cI also want to preserve the opportunity to leave a meaningful legacy for my two sons.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "05 Nov 2026, 09:00 PM IST", "pub_date_relative": "11m ago"}, {"title": "\u2018I have no financial safety net\u2019: I\u2019m 66, rely on Social Security and have just $500 in savings. What hope do I have?", "full_content": "\u201cSometimes I wonder whether wealthier Americans should trade places with people like me.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "05 Nov 2026, 09:00 PM IST", "pub_date_relative": "11m ago"}, {"title": "Nasdaq tumbles 5% as chip rout intensifies in wake of midterms", "full_content": "AI trade remains in the spotlight as investors weigh possible impact of \u2018blue wave\u2019 on sectors favoured by Trump administration", "source": "FT Markets", "pub_date_str": "05 Nov 2026, 08:58 PM IST", "pub_date_relative": "12m ago"}, {"title": "Barkin sees interest rate hikes ahead, but at a gradual pace", "full_content": "Richmond Federal Reserve President Thomas Barkin said Thursday that he expects the central bank will have to raise interest rates further, though he's not sure by how much or at what pace.\n\nIn a CNBC interview that was part of the Richmond Fed's 2026 CFO Summit, the policymaker expressed concern over inflation and said monetary policy will need to adjust.\n\n\"Unemployment's near record lows, and inflation is too high. That means the path is pretty straightforward. The question, of course, is pace,\" Barkin said in the talk with CNBC's Steve Liesman.\n\n\"Gradual makes sense if you think there's uncertainty in the world, and if you think that there's information you're going to get in the period. And I think that's still a pace that makes sense to me,\" he added.\n\nBarkin's comments come a little more than a week after his colleagues voted to keep the Fed's benchmark overnight borrowing rate anchored in a range between 3.75% and 4%. While Barkin is not a voting member on the rate-setting Federal Open Market Committee now, he will be in 2027.\n\nIn its post-meeting statement, the FOMC said that it is awaiting the \"accumulation of more information\" as it deliberates where to go next. When the committee OK'd a quarter percentage point hike in September, officials largely agreed that another increase was likely before the end of 2026.\n\nMarkets are pricing in a better than 80% chance of a hike in December, then one more move in 2027, according to the CME Group's FedWatch tool.\n\nBarkin said he considers current policy close to a point where it neither restricts nor promotes growth, which officials consider a neutral rate.", "source": "CNBC Finance", "pub_date_str": "05 Nov 2026, 08:57 PM IST", "pub_date_relative": "13m ago"}, {"title": "Qualcomm slides 9% after earnings, leading postelection chip stock sell-off", "full_content": "Qualcomm stock slid 9% on Thursday, leading chip stocks lower after the company issued a light forecast.\n\nThe chipmaker, which reported Q4 financial results after the bell Wednesday, slightly beat Q4 estimates for earnings, but its current-quarter guidance came in weak .\n\nQualcomm projected first-quarter adjusted earnings between $2.15 and $2.35 per share, below analysts' estimates of $2.27 per share. The company expects Q1 revenue to range from $10.4 billion to $11.2 billion, versus Wall Street estimates of $10.48 billion.\n\nSemiconductor peers, including AMD , Micron , Arm and Intel , also declined Thursday, continuing a post-election selloff on fears of a data center slowdown , as Democrats indicated plans for artificial intelligence regulation.\n\nThe memory crunch has also weighed on the broader chip industry.\n\nQualcomm's biggest slice of sales is from chips for smartphones, but rising memory costs have forced price hikes for the devices and hit demand. The company's handset chip sales fell 26% to $5.14 billion during the quarter, coming in short of the $5.21 billion StreetAccount estimate, even as the company raised prices in September.\n\n\"We don't have a demand issue; it's a supply issue,\" CEO Cristiano Amon said. \"If I had more supply, I would probably be doing better.\"", "source": "CNBC World Economy", "pub_date_str": "05 Nov 2026, 08:54 PM IST", "pub_date_relative": "16m ago"}, {"title": "PSU dividend jackpot! ONGC vs NTPC vs CONCOR vs Petronet: Who offers highest payout? Record date, technical targets", "full_content": "DIVIDEND PETRONET ONGC NTPC Sharmila Bhadoria Published 5 Nov 2026, 08:46 PM IST Prefer Livemint on Google PSU dividend comparison: Oil and Natural Gas Corporation , NTPC , Container Corporation of India , and Petronet LNG are some of the key public sector undertakings (PSUs) which have announced dividends for the financial year 2026-27.\n\nRecord dates for dividend announced by most of these PSUs is set to fall in the coming days. For investors who closely track developments around PSU dividends, here are all the details from their payout amount, dividend record dates to technical targets by experts.\n\nOut of the four companies, ONGC has announced the highest payout for the financial year 2026-27. The PSU has fixed November 12 as the record date.\\\n\nONGC\u2019s board of directors announced an interim dividend of \u20b9 8 per equity share with a face value of \u20b9 5 each. The company has fixed November 12, 2026 as the record date to determine eligibility of investors for the payout.\n\nThe stock closed 1.90% lower at \u20b9 230.10 per share on BSE with a market capitalisation of \u20b9 2,89,472.22 crore on Thursday. The PSU stock reclaimed its 20 day exponential moving average \u201c(EMA) with RSI above 50, providing a buy-on-dips entry at \u20b9 226.00 \u20b9 229.00 (SL: \u20b9 221.00, Targets: \u20b9 238.00 / \u20b9 245.00),\u201d stated Virat Jagad Sr. Technical Research Analyst at Bonanza.\n\nNTPC\u2019s board of directors announced the first interim dividend at the rate of 30% on the face value of \u20b9 10 each. Which means that the PSU has announced \u20b9 3 per share dividend. NTPC dividend record date is fixed as November 6, 2026.\n\nShares of NTPC closed 1.65% lower at \u20b9 316.40 per share on BSE with a market capitalisation of \u20b9 3,06,802.52 crore on Thursday. The PSU stock has bounced off \u20b9 295 support to reclaim its 20 EMA at \u20b9 314.27 per share.\n\nAccording to Virat Jagad, the movement has set up a fresh entry point at \u20b9 314- \u20b9 317. The expert recommends to maintain stop loss at \u20b9 304 per share and target at \u20b9 325- \u20b9 333 per share.", "source": "LiveMint Markets", "pub_date_str": "05 Nov 2026, 08:46 PM IST", "pub_date_relative": "24m ago"}, {"title": "'No reason to go elsewhere': Zerodha CEO Nithin Kamath welcomes SEBI's NRI KYC changes", "full_content": "Zerodha founder and CEO Nithin Kamath has welcomed the Securities and Exchange Board of India's (SEBI) decision to ease digital Know Your Client (KYC) requirements for Non-Resident Indians (NRIs), Overseas Citizens of India (OCIs), and foreign nationals, saying the move will simplify account opening for overseas investors and help attract more long-term capital into India.\n\n\"In August, I'd written about SEBI's proposal to simplify account opening for NRIs. Good to see that the changes have now been finalised,\" Kamath said in a post on X.\n\nHe said account opening had been one of the biggest hurdles for NRIs wanting to invest in India for years. While those with existing KYC could open accounts digitally, anyone abroad needing fresh KYC had to get documents attested by a notary or the Indian embassy, courier physical copies to India, and wait weeks for the account to open.\n\n\"From December 3, NRIs and OCIs living in FATF-compliant countries will be able to complete digital KYC entirely from abroad. Something that took weeks can now be done in 2\u20133 days,\" Kamath said.\n\nIn a circular dated November 4, 2026, SEBI relaxed Know Your Client (KYC) requirements for Non-Resident Indians (NRIs), Overseas Citizens of India (OCIs), and foreign nationals, allowing them to complete digital onboarding while residing overseas, subject to certain conditions.\n\nThe move removes the earlier requirement for investors to be physically present in India while completing digital KYC, which had effectively restricted overseas investors from completing the onboarding process remotely.\n\nThe revised framework will come into effect from December 3, 2026, or 30 days from the date of the circular. It will apply to individual PROI clients, excluding those residing in FATF non-compliant countries.\n\nKamath said making it easier for NRIs to invest in India was one of the simplest ways to attract more long-term capital, as many already wanted to invest in the country but found the process complicated.", "source": "LiveMint Markets", "pub_date_str": "05 Nov 2026, 08:46 PM IST", "pub_date_relative": "24m ago"}, {"title": "Learning from \u2018Love Is Blind\u2019 money drama", "full_content": "Hear me out: These reality-TV couples are having really important conversations about love and money heading into tonight\u2019s finale.", "source": "MarketWatch Top Stories", "pub_date_str": "05 Nov 2026, 08:46 PM IST", "pub_date_relative": "25m ago"}, {"title": "Stock Market Today: Nasdaq Craters 3% As Chips Sell Off; Arm Misses Key Metric (Live Coverage) - Investor's Business Daily", "full_content": "Stock Market Today: Nasdaq Craters 3% As Chips Sell Off; Arm Misses Key Metric (Live Coverage) Investor's Business Daily Stock Market Today: Nasdaq Opens Lower, Dow Rises Amid Rotation Trade \u2014 Live Updates WSJ Global markets were already fragile. Big AI bets could break them Reuters After Tech Sell-Off, Investors Brace for More Market Volatility The New York Times 3 reasons why the tech stock rout is growing more alarming Yahoo Finance", "source": "Google News Business", "pub_date_str": "05 Nov 2026, 08:46 PM IST", "pub_date_relative": "25m ago"}, {"title": "Tax reporting lapses could risk India's sovereign rating, trigger withholding tax penalties: Income Tax Principal DG Debjyoti Das", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Indicators \u203a Tax reporting lapses could risk India's sovereign rating, trigger withholding tax penalties: Income Tax Principal DG Debjyoti Das The Economic Times daily newspaper is available online now. Read Today's Paper Tax reporting lapses could risk India's sovereign rating, trigger withholding tax penalties: Income Tax Principal DG Debjyoti Das SECTIONS Tax reporting lapses could risk India's sovereign rating, trigger withholding tax penalties: Income Tax Principal DG Debjyoti Das ANI Last Updated: Nov 05, 2026, 08:44:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Speaking to the media on the sidelines of the 'Summit on Global Financial Compliance (FATCA & CRS)' in Mumbai, Debjyoti Das, Principal Director General of Income Tax (Intelligence & Criminal Investigation), highlighted the growing risks associated with non-compliance in cross-border financial reporting.\n\nSome elections matter more than you know: No crop changed in the fields, yet sugar, coffee and soya got cheaper in a day\n\nYou can buy a walkie-talkie online. But can you legally use it?\n\nKYB and KYC: Quick commerce, the Damani premium and what DMart must deliver \u2013 3rd and concluding part\n\nKYC and KYB: Inside Damani\u2019s DMart, the retail chain for the middle class. And stock for the long term? \u2013 Part 2 of 3\n\nWill it be a regulatory nightmare if an exchange lists on its own platform?\n\nKYC and KYB: Inside Damani\u2019s Avenue Supermarts that refuses to charge more \u2013 Part 1 of 3\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "05 Nov 2026, 08:44 PM IST", "pub_date_relative": "27m ago"}, {"title": "Qualcomm Shares Sinks 14% At Open, Set For Worst Day Since 2020", "full_content": "Chipmaker Qualcomm is on track for its steepest single-day decline since 2020.", "source": "NDTV Profit", "pub_date_str": "05 Nov 2026, 08:41 PM IST", "pub_date_relative": "29m ago"}, {"title": "Emerging market outflows hit $33.8 billion, US midterms offer some relief", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a Emerging market outflows hit $33.8 billion, US midterms offer some relief Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Emerging market outflows hit $33.8 billion, US midterms offer some relief SECTIONS Emerging market outflows hit $33.8 billion, US midterms offer some relief Reuters Last Updated: Nov 05, 2026, 08:56:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis October witnessed an alarming withdrawal of $33.8 billion by foreign investors from emerging markets, the largest since March. Almost all of this outflow consisted of equities, severely impacting Taiwan. While Emerging Asia grappled with major losses, Latin America encountered minimal setbacks amid election-related volatility. Additionally, Chinese stocks continued to see foreign sell-offs for the fifth consecutive month.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "05 Nov 2026, 08:39 PM IST", "pub_date_relative": "32m ago"}, {"title": "Wendy's rejects $1.4 billion takeover proposal from Nelson Peltz\u2019s Trian", "full_content": "Wendy's on Thursday said it is rejecting a $1.4 billion takeover offer from a group of investors led by Nelson Peltz's Trian Fund Management.\n\nThe group offered $7.35 per share in cash on Oct. 28 to take the struggling burger chain private . In addition to Trian, it included investment firms BlueFive Capital and Sixth Street Partners, plus Flynn Group, one of Wendy's largest franchisees.\n\nIn February, Wendy's board formed a committee of independent directors to assess any potential bid from Trian in response to a regulatory filing from the firm. The committee found that the proposal \"substantially undervalues\" Wendy's and does not reflect potential gains from the chain's ongoing turnaround strategy, the company said in a press release Thursday.\n\n\"Our confidence rests firmly in [CEO] Bob Wright's proven track record of seasoned industry leadership, including restaurant business turnarounds,\" Art Winkleblack, Wendy's board chair and a member of the independent committee, said in a statement.\n\nTo stave off a hostile takeover, Wendy's has adopted a shareholder rights plan \u2014 or poison pill \u2014 with a one-year duration, as of Wednesday, the company said. Wendy's added that the investor group led by Trian rejected an offer from Wendy's for a standstill agreement that would have paused additional share purchases, adding to Wendy's decision to use a poison pill.\n\nThe rejection is the latest in the long-running saga between Peltz and the burger chain, which dates back to an activist campaign he led more than two decades ago. A Peltz firm has even owned Wendy's before. In 2008, his company Triarc, which also owned Arby's, bought Wendy's in a $2.3 billion deal. It later sold Arby's, turning Wendy's into a stand-alone company again.\n\nIn 2024, Wendy's named Peltz as chairman emeritus after he spent 17 years on the company's board. Trian executive Peter May and Peltz's son, Bradley, still sit on Wendy's board.\n\nWendy's also reported its third-quarter results on Thursday.", "source": "CNBC Top News", "pub_date_str": "05 Nov 2026, 08:38 PM IST", "pub_date_relative": "33m ago"}, {"title": "US Stock Market Today: Dow Spikes 330 Points Post-Midterm Rally; Nasdaq Down 3% As AI Stocks Drag", "full_content": "Dow Jones Industrial Average advanced 334 points or 0.5%, to 53,121 points, S&P 500 fell 104 points, or 1.4%, to 7,583.91, while the Nasdaq Composite slipped 317 points, or 1.23%, to 25,419.02.", "source": "NDTV Profit", "pub_date_str": "05 Nov 2026, 08:37 PM IST", "pub_date_relative": "33m ago"}, {"title": "Mumbai Traffic Congestion Sparks Online Complaints As Diwali Rush Approaches", "full_content": "The festive rush added to Mumbai's traffic woes, with people sharing their commuting experiences across social media.", "source": "NDTV Profit", "pub_date_str": "05 Nov 2026, 08:34 PM IST", "pub_date_relative": "36m ago"}, {"title": "Why Asian AI stocks tumbled after US midterm results as Kospi plunged over 5%; key reasons explained", "full_content": "South Korea\u2019s Kospi, which has swung between waves of buying and selling amid the artificial intelligence (AI) frenzy, crashed on Thursday, November 5, tumbling 5.3% to settle at 5,383.80.\n\nThe sharp selling triggered a temporary suspension of program trading on the main exchange, while the tech-heavy Kosdaq also activated a sell-side sidecar around noon as the index dropped below the 700 mark.\n\nThe sell-off in key heavyweights, including Samsung Electronics and memory chipmaker SK Hynix, dragged the Kospi to its biggest single-day decline in three weeks, even as Wall Street closed sharply higher.\n\nSemiconductor equipment and components manufacturers also came under pressure, with Hanmi Semiconductor and Samsung Electro-Mechanics recording significant declines. The weakness followed a drop of more than 3% in the Philadelphia Semiconductor Index overnight, even as the broader US stock market ended higher.\n\nInvestors are concerned that Democratic victories in the US midterm elections could lead to tighter restrictions on artificial intelligence infrastructure and data centre development.\n\nThe sell-off was not limited to South Korea. Other Asian markets with significant exposure to the AI industry, including Taiwan's Taiex and Japan's Nikkei 225, also closed lower, declining 1.8% and 2%, respectively.\n\nOpenAI investor SoftBank Group shed 6.9%, while Tokyo Electron, a manufacturer of semiconductor production equipment, skidded 9.5%. Semiconductor testing equipment maker Advantest tumbled 15%.\n\nA Democratic-led Congress could pressure US President Donald Trump to scale back the Iran war, weighing on shares of companies that manufacture weapons and other equipment for the US military. The possibility of pressure to pull back from the conflict also sent Brent crude oil, the international benchmark, plunging 8.7% to $94.62 a barrel.", "source": "LiveMint Markets", "pub_date_str": "05 Nov 2026, 08:33 PM IST", "pub_date_relative": "38m ago"}, {"title": "Billionaires aren\u2019t off the hook for higher taxes, even if they did dodge California\u2019s wealth tax", "full_content": "Silicon Valley spent big to kill California\u2019s wealth tax \u2014 but incoming Democrats are eyeing a national fight.", "source": "MarketWatch Top Stories", "pub_date_str": "05 Nov 2026, 08:31 PM IST", "pub_date_relative": "40m ago"}, {"title": "MSEDCL targets February 2027 IPO, aims to raise over \u20b910,000 crore", "full_content": "NEW DELHI: Maharashtra State Electricity Distribution Co. Ltd (MSEDCL) plans to file its draft prospectus by the first week of December and launch its initial public offering (IPO) by February 2027, targeting a fundraising of more than \u20b9 10,000 crore, its chairman and managing director Lokesh Chandra said on Thursday.\n\n\u201cWe expect to file for the IPO by December first week and launch the offer by February,\u201d Chandra told Mint .\n\nThe proposed listing follows a restructuring of the state-run power distribution utility, including the demerger of its agricultural power distribution business, to prepare its core operations for a public listing.\n\nIn July, Bloomberg reported that MSEDCL had appointed SBI Capital Markets Ltd, IIFL Capital Services Ltd, ICICI Securities Ltd, Motilal Oswal Investment Advisors, IDBI Capital Markets & Securities and HDFC Bank as advisers for the proposed share sale.\n\nIn April, the Maharashtra government approved a financial restructuring of MSEDCL, including taking over \u20b9 32,679 crore of its debt and demerging its agricultural business, paving the way for the listing.\n\nMSEDCL serves around 34 million consumers and has historically faced financial pressure from high receivables in the agricultural segment and gaps in subsidy payments.\n\nThe discom reported a net profit of \u20b9 930.62 crore in fiscal year 2026 (FY26), marginally lower than \u20b9 940.84 crore in the previous financial year. Revenue from operations rose about 6.5% year-on-year to around \u20b9 1.29 trillion in FY26.\n\nHowever, its balance sheet continues to reflect the burden of accumulated losses. According to the company's FY26 annual report, MSEDCL had accumulated losses of \u20b9 35,551.92 crore and a positive net worth of \u20b9 14,915.06 crore as of 31 March 2026. These figures included the financials of its agricultural business.", "source": "LiveMint Markets", "pub_date_str": "05 Nov 2026, 08:30 PM IST", "pub_date_relative": "40m ago"}, {"title": "Two months after my father\u2019s funeral, my stepmother asked me to repay his $40,000 wedding gift. Should I do what she says?", "full_content": "\u201cAbout two months after his funeral, my stepmother called and said she wanted the money back.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "05 Nov 2026, 08:30 PM IST", "pub_date_relative": "41m ago"}, {"title": "A record 10% of first-time home buyers now pay in cash. Here\u2019s where they get the money.", "full_content": "All-cash buyers are becoming more common, despite a housing market that\u2019s been struggling with affordability issues.", "source": "MarketWatch Top Stories", "pub_date_str": "05 Nov 2026, 08:30 PM IST", "pub_date_relative": "41m ago"}, {"title": "The wealthiest 10% of Americans are pulling ahead of everyone else. This is what\u2019s making them richer.", "full_content": "The wealthiest 10% have a median net worth that is $800,000 greater than it was three years ago.", "source": "MarketWatch Top Stories", "pub_date_str": "05 Nov 2026, 08:30 PM IST", "pub_date_relative": "41m ago"}, {"title": "Chips In Free Fall: Intel, Micron, AMD, SK Hynix Plunge Up To 8% In Second Day Of Slide", "full_content": "The fallout reached deep into semiconductor giants, with AMD tumbling nearly 11%, SK Hynix dropping almost 8%, Micron Technology shedding 6.5%, and Intel sliding nearly 6%.", "source": "NDTV Profit", "pub_date_str": "05 Nov 2026, 08:29 PM IST", "pub_date_relative": "41m ago"}, {"title": "Democrats to probe JPMorgan's relationship with Epstein when they take Senate control", "full_content": "Senate Democrats are gearing up to investigate JPMorgan Chase 's banking relationship with disgraced sex offender Jeffrey Epstein once they take control of Congress early next year.\n\nDemocratic staffers on the Senate Finance Committee, which is likely to be chaired in the next Congress by Sen. Ron Wyden , D-Ore., intend to home in on how high-ranking executives at the nation's largest bank handled Epstein, a source familiar with the committee's thinking told CNBC on Thursday. The person spoke on condition of anonymity because the probe has not been announced.\n\nThey aim to focus in particular on the Epstein-related decisions made by Mary Erdoes, CEO of the bank's Asset & Wealth Management business, according to the source.\n\nJPMorgan did not immediately respond to CNBC's request for comment.\n\nDemocrats are openly preparing to put a spotlight back on Epstein as they plan to launch sweeping investigations following their wipeout victories in Tuesday's midterm elections.\n\nWyden, who is currently the committee's ranking member, has made clear he plans to make full use of the subpoena powers that committee majorities wield.", "source": "CNBC Top News", "pub_date_str": "05 Nov 2026, 08:28 PM IST", "pub_date_relative": "42m ago"}, {"title": "How do Americans feel about the midterm results? It depends on how much money they make.", "full_content": "Most Americans are \u201cthrilled\u201d or \u201chappy\u201d about the results of this year\u2019s election. Some are especially so.", "source": "MarketWatch Top Stories", "pub_date_str": "05 Nov 2026, 08:27 PM IST", "pub_date_relative": "44m ago"}, {"title": "Brazil stocks have taken a beating. Here's why I see opportunity", "full_content": "Despite recent election-driven volatility, Brazil's long-term economic prospects make the iShares MSCI Brazil ETF (EWZ) an attractive investment opportunity, says investor Stephanie Link.", "source": "CNBC Top News", "pub_date_str": "05 Nov 2026, 08:25 PM IST", "pub_date_relative": "45m ago"}, {"title": "Airline says passenger was late, but can\u2019t prove it: Consumer court awards Delhi flyer \u20b971,587, details inside", "full_content": "A Delhi passenger who missed a Bengaluru -bound flight after alleging delays by airline staff has been awarded \u20b9 71,587 by the New Delhi District Consumer Disputes Redressal Commission. The commission ruled in his favour after the airline failed to produce evidence supporting its claim that he had reported late for check-in.\n\nThe commission, headed by President Poonam Chaudhry and member Bariq Ahmad, observed that the airline had not submitted CCTV footage or any other material to establish that the passenger arrived late at the check-in counter, The Indian Express reported.\n\n\"...the OP has not placed any cogent evidence like the CCTV footage or any other material to show that the complainant was not on time,\" the commission said while ruling in the passenger's favour.\n\nAccording to the complaint, the passenger had booked a round-trip ticket between Delhi and Bengaluru for June 2025 to attend an urgent office meeting.\n\nHe told the commission that he reached Delhi airport at around 5.45 am for his scheduled 6.45 am flight.\n\nHowever, he alleged that airline staff delayed his check-in for more than 45 minutes despite repeated requests for assistance.\n\nHe further claimed that a ground staff member incorrectly informed him that the flight was full and directed him to a help desk to explore rescheduling options.\n\nBy the time the issue was resolved, the passenger had missed his scheduled flight.", "source": "LiveMint Money", "pub_date_str": "05 Nov 2026, 08:21 PM IST", "pub_date_relative": "49m ago"}, {"title": "This is the secret sauce for the economy \u2014 and it\u2019s showing up in faster U.S. growth", "full_content": "(FILES) In this file photo taken on November 20, 2020 workers pack turkeys at a farm in Orefield, Pennsylvania, ahead of the Thanksgiving holiday. - Inflation is red-hot in the United States, reaching the highest levels in decades this year. And while some prices have eased in recent months, consumers say they are straining to handle their grocery bills -- a tough blow at the holidays. Turkey costs 21 percent more in the United States than it did last year, according to the American Farm Bureau. (Photo by Kena Betancur / AFP) (Photo by KENA BETANCUR/AFP via Getty Images)", "source": "MarketWatch Top Stories", "pub_date_str": "05 Nov 2026, 08:19 PM IST", "pub_date_relative": "52m ago"}, {"title": "AC Milan Vs Ferencvaros Live Streaming: Likely Lineups; How To Watch Europa League Match?", "full_content": "Milan will be eager to make home advantage count against a Ferencvaros side that has scored nine goals in its opening three Europa League matches.", "source": "NDTV Profit", "pub_date_str": "05 Nov 2026, 08:15 PM IST", "pub_date_relative": "56m ago"}, {"title": "Qualcomm, Micron, Sandisk, and AMD stocks sink, leading chip sector lower - Yahoo Finance", "full_content": "Qualcomm, Micron, Sandisk, and AMD stocks sink, leading chip sector lower Yahoo Finance The Semiconductor Sector May Be Nearing A Meltdown Seeking Alpha Asian chip stocks slide as disappointing Qualcomm, Arm earnings weigh Investing.com Chip stocks are suffering from a \u2018crisis of confidence\u2019 \u2014 but things aren\u2019t as gloomy as they seem MarketWatch Semiconductor Sell-Off: The Best Chip Stocks to Buy Right Now Before They Skyrocket Once Again The Motley Fool", "source": "Google News Business", "pub_date_str": "05 Nov 2026, 08:12 PM IST", "pub_date_relative": "59m ago"}, {"title": "US stocks today: Nasdaq falls at open day after midterms rally; chip, data center stocks fall", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SM tocks linked to the technology and instead move into other sectors.", "source": "CNBC Top News", "pub_date_str": "05 Nov 2026, 08:09 PM IST", "pub_date_relative": "1h ago"}, {"title": "Jim Cramer's top 10 things to watch in the stock market Thursday", "full_content": "Dow futures are up this morning, and Nasdaq futures are down.", "source": "CNBC Top News", "pub_date_str": "05 Nov 2026, 08:09 PM IST", "pub_date_relative": "1h ago"}, {"title": "Novo Nordisk Lifts Guidance as Rollout of Wegovy Weight-Loss Pill Continues - WSJ", "full_content": "Novo Nordisk Lifts Guidance as Rollout of Wegovy Weight-Loss Pill Continues WSJ Novo Nordisk CEO: Wegovy pill 'exceeded our expectations' Yahoo Finance Novo shares jump as Wegovy pill sales impress, drugmaker hikes outlook CNBC Novo Surges After Crushing Forecasts On The Back Of Its GLP-1s Investor's Business Daily No pain, no gain at Novo The Economist", "source": "Google News Business", "pub_date_str": "05 Nov 2026, 08:09 PM IST", "pub_date_relative": "1h ago"}, {"title": "Glenmark Pharma Q2 Results: Net profit plunges 56% to Rs 264 crore, revenue down at Rs 4,247 cr", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a Earnings \u203a Glenmark Pharma Q2 Results: Net profit plunges 56% to Rs 264 crore, revenue down at Rs 4,247 cr Glenmark Pharmaceuticals Share Price Mankind Pharma Share Price Aurobindo Pharma Share Price Lupin Share Price Alkem Laboratories Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Glenmark Pharma Q2 Results: Net profit plunges 56% to Rs 264 crore, revenue down at Rs 4,247 cr SECTIONS Glenmark Pharma Q2 Results: Net profit plunges 56% to Rs 264 crore, revenue down at Rs 4,247 cr PTI Last Updated: Nov 05, 2026, 08:08:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Glenmark Pharmaceuticals experienced a 56.78 percent drop in consolidated profit after tax during the September quarter. Total revenue from operations decreased to Rs 4,247.32 crore compared to the previous year. The company's total expenses also decreased during the same period, indicating some operational efficiency. A subsidiary of Glenmark Pharma entered into a settlement for USD 15 million with Humana Inc.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "05 Nov 2026, 08:08 PM IST", "pub_date_relative": "1h ago"}, {"title": "Qualcomm Slides After Supply Costs Take a Bite Out of Profit - Bloomberg.com", "full_content": "Qualcomm Slides After Supply Costs Take a Bite Out of Profit Bloomberg.com Qualcomm tops Q4 estimates, but Q1 earnings outlook falls short sending stock lower Yahoo Finance Qualcomm stock drops 7% on weak earnings forecast as memory shortage weighs on smartphone sales CNBC Qualcomm slumps as weak smartphone chip sales overshadow data-center momentum Reuters QCOM Q4 Earnings Call Highlights Data Center Ramp and Handset Risks Yahoo Finance", "source": "Google News Business", "pub_date_str": "05 Nov 2026, 08:08 PM IST", "pub_date_relative": "1h ago"}, {"title": "Muhurat Trading 2026: How has the Indian stock market performed over the past 10 years? What lies ahead in Samvat 2083", "full_content": "A Ksheerasagar Published 5 Nov 2026, 08:07 PM IST Prefer Livemint on Google Every Diwali, the Indian stock market marks the occasion with a special one-hour evening trading session known as Muhurat Trading. Considered an auspicious time to invest, the tradition has become symbolic of prosperity, with investors viewing it as an opportunity to usher in wealth and success to their portfolios.\n\nThis year, both the BSE and NSE will conduct the Muhurat Trading session on Sunday, November 8, from 2:20 PM to 3:30 PM. While markets will remain closed during the regular trading session, this special evening session allows investors to make token investments, keeping alive the long-standing tradition of trading during Diwali.\n\nHistorically, Muhurat trading sessions have often ended on a positive note, even though trading volumes tend to remain relatively low. The special session witnesses participation from traders, retail investors, and institutional investors alike, reflecting optimism and confidence about the year ahead.\n\nAlthough trading activity is usually subdued, the session symbolises optimism and confidence in the markets as investors look forward to achieving their financial milestones in the new Samvat year.\n\nOver the past 10 years, the Nifty has closed in positive territory on eight occasions during the special trading session, indicating a historically positive trend. Although the Nifty has ended higher eight times, it has never recorded a gain of more than 1%.", "source": "LiveMint Markets", "pub_date_str": "05 Nov 2026, 08:07 PM IST", "pub_date_relative": "1h ago"}, {"title": "Here's what the Democratic election rout could mean for the U.S. economy", "full_content": "The Democratic midterm election sweep could result in changes in economic policies related to trade, spending priorities and artificial intelligence. But the biggest forces shaping the economy aren't going to change just because the party in power did.\n\nAffordability pressures , heavy levels of government spending and growth that is dependent on the artificial intelligence tail wind are likely to persist, economists say. And all of those factors pose risks to the economy.\n\n\"It's in a very kind of fragile place, and I don't know that it would take a lot to push the economy off the rails, and recession becomes a much greater risk,\" said Mark Zandi, chief economist at Moody's Analytics. \"That isn't the case at the moment, but I don't think that's gone away.\"\n\nZandi said he had been worried before the election that the economy was under threat from inflation, an underwhelming labor market and geopolitical dangers, and remains concerned now.\n\nDemocrats romped to upset wins in not only House and Senate races but also governor and other state races. But economic and foreign policy is largely set in the executive branch, and President Donald Trump remains far apart from his Democratic adversaries, though he said Wednesday he anticipates working with them.\n\n\"I don't expect any change in economic policy. The Iran war, the tariffs and trade policy, the heavy-handed immigration policy, all are done under executive order. They're not legislatively driven,\" Zandi said.\n\n\"The president thought they were good policies before the election. I don't know why he'd change his mind after the election,\" Zandi added. \"So I think they will continue to be policies that restrain growth and add to inflationary pressures and interest rates.\"\n\nZandi sees the AI hyperscaler buildout as a key to economic growth, but also a source of potential peril.", "source": "CNBC Top News", "pub_date_str": "05 Nov 2026, 08:03 PM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "Nasdaq plummets into correction territory, Dow plunges 800 points as traders dump tech stocks: Live updates", "full_content": "The Nasdaq Composite plummeted on Thursday, erasing the sharp gains from the previous session , as investors continued to rotate away from technology stocks and into more defensive areas of the market.\n\nThe tech-heavy Nasdaq declined 4.2% and dipped into correction territory, trading more than 10% below a record set last month. The S&P 500 was down 2.6%. The Dow Jones Industrial Average shed 780 points, or 1.5%, as gains in stocks such as Chevron and Johnson & Johnson were not enough to spare the 30-stock index from the tech selling spree. The Dow erased around half of its advance from Wednesday's massive rally.\n\nNasdaq Composite, 5-day Stocks related to the artificial intelligence trade \u2014 particularly those linked to the chips industry and data centers \u2014 slid for a second day. Investors fear that a Democratic sweep of both chambers of Congress as well as victories in key gubernatorial races could spell more regulation of the AI buildout across the country.\n\nChipmakers Broadcom and Nvidia each fell 7% Thursday, while others such as software stock Oracle declined close to 5%. Another chip stock, Qualcomm , reported earnings that beat estimates , but the stock dropped 9% on a weaker-than-expected earnings outlook. The iShares Semiconductor ETF (SOXX) was down 9% as well.\n\nShares of neocloud companies also retreated, with CoreWeave losing 12%, Nebius sliding 17% and Iren shedding 15%, amid those worries about a backlash to the industry in light of the election results in various states.\n\nUnderneath the surface, other parts of the market appeared to be holding up. Consumer staples stocks saw gains, with the sector rising more than 1%. Healthcare and utilities stocks were also higher.\n\n\"A shakeout among the most speculative parts of the theme is underway,\" said MRB Partners in a Thursday note. \"The U.S.", "source": "CNBC Top News", "pub_date_str": "05 Nov 2026, 09:09 PM IST", "pub_date_relative": "1m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "UBS cuts Flutter Entertainment stock price target on earnings outlook", "full_content": "", "source": "Investing.com News", "pub_date_str": "05 Nov 2026, 09:02 PM IST", "pub_date_relative": "8m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Nasdaq extends opening slide to over 4% amid post-midterms rotation out of chips", "full_content": "", "source": "Investing.com News", "pub_date_str": "05 Nov 2026, 09:02 PM IST", "pub_date_relative": "8m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "ConocoPhillips beats estimates on higher oil prices, raises dividend", "full_content": "", "source": "Investing.com News", "pub_date_str": "05 Nov 2026, 09:02 PM IST", "pub_date_relative": "9m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Natural gas storage levels decline, signaling rising demand", "full_content": "", "source": "Investing.com News", "pub_date_str": "05 Nov 2026, 09:02 PM IST", "pub_date_relative": "9m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Democratic sweep puts crypto on defensive in Washington", "full_content": "Democrats' sweep of Congress likely resets the political calculus for crypto, ushering in a more adversarial approach in Washington and pushing industry-friendly legislation like the Clarity Act to the back burner.\n\nWith crypto critics like Sherrod Brown (D-Ohio) returning to the Senate and Sen. Elizabeth Warren (D-Mass) retaining significant influence over financial policy, analysts say the new Congress is likely to focus on scrutinizing President Donald Trump's personal crypto dealings over supportive industry legislation.\n\nFor years, crypto fought an uphill battle in Washington, asking for clear operating rules, but often landing on the receiving end of regulation by enforcement. That shifted after Trump's 2024 election victory, giving the industry a reprieve and seat at the policy table.\n\n\"We see Sherrod Brown winning in Ohio as damaging the crypto industry's political clout as the industry worked to defeat him,\" Jaret Seiberg, TD Cowen's Washington analyst, said in a note Wednesday. \"We did not think Clarity could advance over the next two years. This makes us more confident in our prediction.\"\n\nThe crypto industry spent more than $200 million to sway the midterms, hoping to get leaders elected that could push a comprehensive crypto market structure bill over the finish line after the Clarity Act stalled in the Senate .\n\nSeiberg emphasized that Democrats \"will investigate Trump's crypto entanglements including World Liberty Financial\" and said \"the resulting political environment may make it impossible to advance a version of Clarity that the crypto sector could back.\"\n\nMike Townsend, Charles Schwab's managing director of legislative and regulatory affairs, said he expects \"Democrats to push next year for a version of the bill that is much tougher on cryptocurrency companies.\"\n\nThe stakes extend beyond market structure legislation via Clarity.", "source": "CNBC World Economy", "pub_date_str": "05 Nov 2026, 09:00 PM IST", "pub_date_relative": "10m ago", "cfa_topics": ["Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Nasdaq tumbles 5% as chip rout intensifies in wake of midterms", "full_content": "AI trade remains in the spotlight as investors weigh possible impact of \u2018blue wave\u2019 on sectors favoured by Trump administration", "source": "FT Markets", "pub_date_str": "05 Nov 2026, 08:58 PM IST", "pub_date_relative": "12m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Barkin sees interest rate hikes ahead, but at a gradual pace", "full_content": "Richmond Federal Reserve President Thomas Barkin said Thursday that he expects the central bank will have to raise interest rates further, though he's not sure by how much or at what pace.\n\nIn a CNBC interview that was part of the Richmond Fed's 2026 CFO Summit, the policymaker expressed concern over inflation and said monetary policy will need to adjust.\n\n\"Unemployment's near record lows, and inflation is too high. That means the path is pretty straightforward. The question, of course, is pace,\" Barkin said in the talk with CNBC's Steve Liesman.\n\n\"Gradual makes sense if you think there's uncertainty in the world, and if you think that there's information you're going to get in the period. And I think that's still a pace that makes sense to me,\" he added.\n\nBarkin's comments come a little more than a week after his colleagues voted to keep the Fed's benchmark overnight borrowing rate anchored in a range between 3.75% and 4%. While Barkin is not a voting member on the rate-setting Federal Open Market Committee now, he will be in 2027.\n\nIn its post-meeting statement, the FOMC said that it is awaiting the \"accumulation of more information\" as it deliberates where to go next. When the committee OK'd a quarter percentage point hike in September, officials largely agreed that another increase was likely before the end of 2026.\n\nMarkets are pricing in a better than 80% chance of a hike in December, then one more move in 2027, according to the CME Group's FedWatch tool.\n\nBarkin said he considers current policy close to a point where it neither restricts nor promotes growth, which officials consider a neutral rate.", "source": "CNBC Finance", "pub_date_str": "05 Nov 2026, 08:57 PM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Economics", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Qualcomm slides 9% after earnings, leading postelection chip stock sell-off", "full_content": "Qualcomm stock slid 9% on Thursday, leading chip stocks lower after the company issued a light forecast.\n\nThe chipmaker, which reported Q4 financial results after the bell Wednesday, slightly beat Q4 estimates for earnings, but its current-quarter guidance came in weak .\n\nQualcomm projected first-quarter adjusted earnings between $2.15 and $2.35 per share, below analysts' estimates of $2.27 per share. The company expects Q1 revenue to range from $10.4 billion to $11.2 billion, versus Wall Street estimates of $10.48 billion.\n\nSemiconductor peers, including AMD , Micron , Arm and Intel , also declined Thursday, continuing a post-election selloff on fears of a data center slowdown , as Democrats indicated plans for artificial intelligence regulation.\n\nThe memory crunch has also weighed on the broader chip industry.\n\nQualcomm's biggest slice of sales is from chips for smartphones, but rising memory costs have forced price hikes for the devices and hit demand. The company's handset chip sales fell 26% to $5.14 billion during the quarter, coming in short of the $5.21 billion StreetAccount estimate, even as the company raised prices in September.\n\n\"We don't have a demand issue; it's a supply issue,\" CEO Cristiano Amon said. \"If I had more supply, I would probably be doing better.\"", "source": "CNBC World Economy", "pub_date_str": "05 Nov 2026, 08:54 PM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "PSU dividend jackpot! ONGC vs NTPC vs CONCOR vs Petronet: Who offers highest payout? Record date, technical targets", "full_content": "DIVIDEND PETRONET ONGC NTPC Sharmila Bhadoria Published 5 Nov 2026, 08:46 PM IST Prefer Livemint on Google PSU dividend comparison: Oil and Natural Gas Corporation , NTPC , Container Corporation of India , and Petronet LNG are some of the key public sector undertakings (PSUs) which have announced dividends for the financial year 2026-27.\n\nRecord dates for dividend announced by most of these PSUs is set to fall in the coming days. For investors who closely track developments around PSU dividends, here are all the details from their payout amount, dividend record dates to technical targets by experts.\n\nOut of the four companies, ONGC has announced the highest payout for the financial year 2026-27. The PSU has fixed November 12 as the record date.\\\n\nONGC\u2019s board of directors announced an interim dividend of \u20b9 8 per equity share with a face value of \u20b9 5 each. The company has fixed November 12, 2026 as the record date to determine eligibility of investors for the payout.\n\nThe stock closed 1.90% lower at \u20b9 230.10 per share on BSE with a market capitalisation of \u20b9 2,89,472.22 crore on Thursday. The PSU stock reclaimed its 20 day exponential moving average \u201c(EMA) with RSI above 50, providing a buy-on-dips entry at \u20b9 226.00 \u20b9 229.00 (SL: \u20b9 221.00, Targets: \u20b9 238.00 / \u20b9 245.00),\u201d stated Virat Jagad Sr. Technical Research Analyst at Bonanza.\n\nNTPC\u2019s board of directors announced the first interim dividend at the rate of 30% on the face value of \u20b9 10 each. Which means that the PSU has announced \u20b9 3 per share dividend. NTPC dividend record date is fixed as November 6, 2026.\n\nShares of NTPC closed 1.65% lower at \u20b9 316.40 per share on BSE with a market capitalisation of \u20b9 3,06,802.52 crore on Thursday. The PSU stock has bounced off \u20b9 295 support to reclaim its 20 EMA at \u20b9 314.27 per share.\n\nAccording to Virat Jagad, the movement has set up a fresh entry point at \u20b9 314- \u20b9 317. The expert recommends to maintain stop loss at \u20b9 304 per share and target at \u20b9 325- \u20b9 333 per share.", "source": "LiveMint Markets", "pub_date_str": "05 Nov 2026, 08:46 PM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "'No reason to go elsewhere': Zerodha CEO Nithin Kamath welcomes SEBI's NRI KYC changes", "full_content": "Zerodha founder and CEO Nithin Kamath has welcomed the Securities and Exchange Board of India's (SEBI) decision to ease digital Know Your Client (KYC) requirements for Non-Resident Indians (NRIs), Overseas Citizens of India (OCIs), and foreign nationals, saying the move will simplify account opening for overseas investors and help attract more long-term capital into India.\n\n\"In August, I'd written about SEBI's proposal to simplify account opening for NRIs. Good to see that the changes have now been finalised,\" Kamath said in a post on X.\n\nHe said account opening had been one of the biggest hurdles for NRIs wanting to invest in India for years. While those with existing KYC could open accounts digitally, anyone abroad needing fresh KYC had to get documents attested by a notary or the Indian embassy, courier physical copies to India, and wait weeks for the account to open.\n\n\"From December 3, NRIs and OCIs living in FATF-compliant countries will be able to complete digital KYC entirely from abroad. Something that took weeks can now be done in 2\u20133 days,\" Kamath said.\n\nIn a circular dated November 4, 2026, SEBI relaxed Know Your Client (KYC) requirements for Non-Resident Indians (NRIs), Overseas Citizens of India (OCIs), and foreign nationals, allowing them to complete digital onboarding while residing overseas, subject to certain conditions.\n\nThe move removes the earlier requirement for investors to be physically present in India while completing digital KYC, which had effectively restricted overseas investors from completing the onboarding process remotely.\n\nThe revised framework will come into effect from December 3, 2026, or 30 days from the date of the circular. It will apply to individual PROI clients, excluding those residing in FATF non-compliant countries.\n\nKamath said making it easier for NRIs to invest in India was one of the simplest ways to attract more long-term capital, as many already wanted to invest in the country but found the process complicated.", "source": "LiveMint Markets", "pub_date_str": "05 Nov 2026, 08:46 PM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Stock Market Today: Nasdaq Craters 3% As Chips Sell Off; Arm Misses Key Metric (Live Coverage) - Investor's Business Daily", "full_content": "Stock Market Today: Nasdaq Craters 3% As Chips Sell Off; Arm Misses Key Metric (Live Coverage) Investor's Business Daily Stock Market Today: Nasdaq Opens Lower, Dow Rises Amid Rotation Trade \u2014 Live Updates WSJ Global markets were already fragile. Big AI bets could break them Reuters After Tech Sell-Off, Investors Brace for More Market Volatility The New York Times 3 reasons why the tech stock rout is growing more alarming Yahoo Finance", "source": "Google News Business", "pub_date_str": "05 Nov 2026, 08:46 PM IST", "pub_date_relative": "25m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Tax reporting lapses could risk India's sovereign rating, trigger withholding tax penalties: Income Tax Principal DG Debjyoti Das", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Indicators \u203a Tax reporting lapses could risk India's sovereign rating, trigger withholding tax penalties: Income Tax Principal DG Debjyoti Das The Economic Times daily newspaper is available online now. Read Today's Paper Tax reporting lapses could risk India's sovereign rating, trigger withholding tax penalties: Income Tax Principal DG Debjyoti Das SECTIONS Tax reporting lapses could risk India's sovereign rating, trigger withholding tax penalties: Income Tax Principal DG Debjyoti Das ANI Last Updated: Nov 05, 2026, 08:44:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Speaking to the media on the sidelines of the 'Summit on Global Financial Compliance (FATCA & CRS)' in Mumbai, Debjyoti Das, Principal Director General of Income Tax (Intelligence & Criminal Investigation), highlighted the growing risks associated with non-compliance in cross-border financial reporting.\n\nSome elections matter more than you know: No crop changed in the fields, yet sugar, coffee and soya got cheaper in a day\n\nYou can buy a walkie-talkie online. But can you legally use it?\n\nKYB and KYC: Quick commerce, the Damani premium and what DMart must deliver \u2013 3rd and concluding part\n\nKYC and KYB: Inside Damani\u2019s DMart, the retail chain for the middle class. And stock for the long term? \u2013 Part 2 of 3\n\nWill it be a regulatory nightmare if an exchange lists on its own platform?\n\nKYC and KYB: Inside Damani\u2019s Avenue Supermarts that refuses to charge more \u2013 Part 1 of 3\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "05 Nov 2026, 08:44 PM IST", "pub_date_relative": "27m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Emerging market outflows hit $33.8 billion, US midterms offer some relief", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a Emerging market outflows hit $33.8 billion, US midterms offer some relief Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Emerging market outflows hit $33.8 billion, US midterms offer some relief SECTIONS Emerging market outflows hit $33.8 billion, US midterms offer some relief Reuters Last Updated: Nov 05, 2026, 08:56:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis October witnessed an alarming withdrawal of $33.8 billion by foreign investors from emerging markets, the largest since March. Almost all of this outflow consisted of equities, severely impacting Taiwan. While Emerging Asia grappled with major losses, Latin America encountered minimal setbacks amid election-related volatility. Additionally, Chinese stocks continued to see foreign sell-offs for the fifth consecutive month.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "05 Nov 2026, 08:39 PM IST", "pub_date_relative": "32m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Wendy's rejects $1.4 billion takeover proposal from Nelson Peltz\u2019s Trian", "full_content": "Wendy's on Thursday said it is rejecting a $1.4 billion takeover offer from a group of investors led by Nelson Peltz's Trian Fund Management.\n\nThe group offered $7.35 per share in cash on Oct. 28 to take the struggling burger chain private . In addition to Trian, it included investment firms BlueFive Capital and Sixth Street Partners, plus Flynn Group, one of Wendy's largest franchisees.\n\nIn February, Wendy's board formed a committee of independent directors to assess any potential bid from Trian in response to a regulatory filing from the firm. The committee found that the proposal \"substantially undervalues\" Wendy's and does not reflect potential gains from the chain's ongoing turnaround strategy, the company said in a press release Thursday.\n\n\"Our confidence rests firmly in [CEO] Bob Wright's proven track record of seasoned industry leadership, including restaurant business turnarounds,\" Art Winkleblack, Wendy's board chair and a member of the independent committee, said in a statement.\n\nTo stave off a hostile takeover, Wendy's has adopted a shareholder rights plan \u2014 or poison pill \u2014 with a one-year duration, as of Wednesday, the company said. Wendy's added that the investor group led by Trian rejected an offer from Wendy's for a standstill agreement that would have paused additional share purchases, adding to Wendy's decision to use a poison pill.\n\nThe rejection is the latest in the long-running saga between Peltz and the burger chain, which dates back to an activist campaign he led more than two decades ago. A Peltz firm has even owned Wendy's before. In 2008, his company Triarc, which also owned Arby's, bought Wendy's in a $2.3 billion deal. It later sold Arby's, turning Wendy's into a stand-alone company again.\n\nIn 2024, Wendy's named Peltz as chairman emeritus after he spent 17 years on the company's board. Trian executive Peter May and Peltz's son, Bradley, still sit on Wendy's board.\n\nWendy's also reported its third-quarter results on Thursday.", "source": "CNBC Top News", "pub_date_str": "05 Nov 2026, 08:38 PM IST", "pub_date_relative": "33m ago", "cfa_topics": ["Corporate Issuers", "Fixed Income", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "US Stock Market Today: Dow Spikes 330 Points Post-Midterm Rally; Nasdaq Down 3% As AI Stocks Drag", "full_content": "Dow Jones Industrial Average advanced 334 points or 0.5%, to 53,121 points, S&P 500 fell 104 points, or 1.4%, to 7,583.91, while the Nasdaq Composite slipped 317 points, or 1.23%, to 25,419.02.", "source": "NDTV Profit", "pub_date_str": "05 Nov 2026, 08:37 PM IST", "pub_date_relative": "33m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Why Asian AI stocks tumbled after US midterm results as Kospi plunged over 5%; key reasons explained", "full_content": "South Korea\u2019s Kospi, which has swung between waves of buying and selling amid the artificial intelligence (AI) frenzy, crashed on Thursday, November 5, tumbling 5.3% to settle at 5,383.80.\n\nThe sharp selling triggered a temporary suspension of program trading on the main exchange, while the tech-heavy Kosdaq also activated a sell-side sidecar around noon as the index dropped below the 700 mark.\n\nThe sell-off in key heavyweights, including Samsung Electronics and memory chipmaker SK Hynix, dragged the Kospi to its biggest single-day decline in three weeks, even as Wall Street closed sharply higher.\n\nSemiconductor equipment and components manufacturers also came under pressure, with Hanmi Semiconductor and Samsung Electro-Mechanics recording significant declines. The weakness followed a drop of more than 3% in the Philadelphia Semiconductor Index overnight, even as the broader US stock market ended higher.\n\nInvestors are concerned that Democratic victories in the US midterm elections could lead to tighter restrictions on artificial intelligence infrastructure and data centre development.\n\nThe sell-off was not limited to South Korea. Other Asian markets with significant exposure to the AI industry, including Taiwan's Taiex and Japan's Nikkei 225, also closed lower, declining 1.8% and 2%, respectively.\n\nOpenAI investor SoftBank Group shed 6.9%, while Tokyo Electron, a manufacturer of semiconductor production equipment, skidded 9.5%. Semiconductor testing equipment maker Advantest tumbled 15%.\n\nA Democratic-led Congress could pressure US President Donald Trump to scale back the Iran war, weighing on shares of companies that manufacture weapons and other equipment for the US military. The possibility of pressure to pull back from the conflict also sent Brent crude oil, the international benchmark, plunging 8.7% to $94.62 a barrel.", "source": "LiveMint Markets", "pub_date_str": "05 Nov 2026, 08:33 PM IST", "pub_date_relative": "38m ago", "cfa_topics": ["Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "MSEDCL targets February 2027 IPO, aims to raise over \u20b910,000 crore", "full_content": "NEW DELHI: Maharashtra State Electricity Distribution Co. Ltd (MSEDCL) plans to file its draft prospectus by the first week of December and launch its initial public offering (IPO) by February 2027, targeting a fundraising of more than \u20b9 10,000 crore, its chairman and managing director Lokesh Chandra said on Thursday.\n\n\u201cWe expect to file for the IPO by December first week and launch the offer by February,\u201d Chandra told Mint .\n\nThe proposed listing follows a restructuring of the state-run power distribution utility, including the demerger of its agricultural power distribution business, to prepare its core operations for a public listing.\n\nIn July, Bloomberg reported that MSEDCL had appointed SBI Capital Markets Ltd, IIFL Capital Services Ltd, ICICI Securities Ltd, Motilal Oswal Investment Advisors, IDBI Capital Markets & Securities and HDFC Bank as advisers for the proposed share sale.\n\nIn April, the Maharashtra government approved a financial restructuring of MSEDCL, including taking over \u20b9 32,679 crore of its debt and demerging its agricultural business, paving the way for the listing.\n\nMSEDCL serves around 34 million consumers and has historically faced financial pressure from high receivables in the agricultural segment and gaps in subsidy payments.\n\nThe discom reported a net profit of \u20b9 930.62 crore in fiscal year 2026 (FY26), marginally lower than \u20b9 940.84 crore in the previous financial year. Revenue from operations rose about 6.5% year-on-year to around \u20b9 1.29 trillion in FY26.\n\nHowever, its balance sheet continues to reflect the burden of accumulated losses. According to the company's FY26 annual report, MSEDCL had accumulated losses of \u20b9 35,551.92 crore and a positive net worth of \u20b9 14,915.06 crore as of 31 March 2026. These figures included the financials of its agricultural business.", "source": "LiveMint Markets", "pub_date_str": "05 Nov 2026, 08:30 PM IST", "pub_date_relative": "40m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Democrats to probe JPMorgan's relationship with Epstein when they take Senate control", "full_content": "Senate Democrats are gearing up to investigate JPMorgan Chase 's banking relationship with disgraced sex offender Jeffrey Epstein once they take control of Congress early next year.\n\nDemocratic staffers on the Senate Finance Committee, which is likely to be chaired in the next Congress by Sen. Ron Wyden , D-Ore., intend to home in on how high-ranking executives at the nation's largest bank handled Epstein, a source familiar with the committee's thinking told CNBC on Thursday. The person spoke on condition of anonymity because the probe has not been announced.\n\nThey aim to focus in particular on the Epstein-related decisions made by Mary Erdoes, CEO of the bank's Asset & Wealth Management business, according to the source.\n\nJPMorgan did not immediately respond to CNBC's request for comment.\n\nDemocrats are openly preparing to put a spotlight back on Epstein as they plan to launch sweeping investigations following their wipeout victories in Tuesday's midterm elections.\n\nWyden, who is currently the committee's ranking member, has made clear he plans to make full use of the subpoena powers that committee majorities wield.", "source": "CNBC Top News", "pub_date_str": "05 Nov 2026, 08:28 PM IST", "pub_date_relative": "42m ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Brazil stocks have taken a beating. Here's why I see opportunity", "full_content": "Despite recent election-driven volatility, Brazil's long-term economic prospects make the iShares MSCI Brazil ETF (EWZ) an attractive investment opportunity, says investor Stephanie Link.", "source": "CNBC Top News", "pub_date_str": "05 Nov 2026, 08:25 PM IST", "pub_date_relative": "45m ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Airline says passenger was late, but can\u2019t prove it: Consumer court awards Delhi flyer \u20b971,587, details inside", "full_content": "A Delhi passenger who missed a Bengaluru -bound flight after alleging delays by airline staff has been awarded \u20b9 71,587 by the New Delhi District Consumer Disputes Redressal Commission. The commission ruled in his favour after the airline failed to produce evidence supporting its claim that he had reported late for check-in.\n\nThe commission, headed by President Poonam Chaudhry and member Bariq Ahmad, observed that the airline had not submitted CCTV footage or any other material to establish that the passenger arrived late at the check-in counter, The Indian Express reported.\n\n\"...the OP has not placed any cogent evidence like the CCTV footage or any other material to show that the complainant was not on time,\" the commission said while ruling in the passenger's favour.\n\nAccording to the complaint, the passenger had booked a round-trip ticket between Delhi and Bengaluru for June 2025 to attend an urgent office meeting.\n\nHe told the commission that he reached Delhi airport at around 5.45 am for his scheduled 6.45 am flight.\n\nHowever, he alleged that airline staff delayed his check-in for more than 45 minutes despite repeated requests for assistance.\n\nHe further claimed that a ground staff member incorrectly informed him that the flight was full and directed him to a help desk to explore rescheduling options.\n\nBy the time the issue was resolved, the passenger had missed his scheduled flight.", "source": "LiveMint Money", "pub_date_str": "05 Nov 2026, 08:21 PM IST", "pub_date_relative": "49m ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "This is the secret sauce for the economy \u2014 and it\u2019s showing up in faster U.S. growth", "full_content": "(FILES) In this file photo taken on November 20, 2020 workers pack turkeys at a farm in Orefield, Pennsylvania, ahead of the Thanksgiving holiday. - Inflation is red-hot in the United States, reaching the highest levels in decades this year. And while some prices have eased in recent months, consumers say they are straining to handle their grocery bills -- a tough blow at the holidays. Turkey costs 21 percent more in the United States than it did last year, according to the American Farm Bureau. (Photo by Kena Betancur / AFP) (Photo by KENA BETANCUR/AFP via Getty Images)", "source": "MarketWatch Top Stories", "pub_date_str": "05 Nov 2026, 08:19 PM IST", "pub_date_relative": "52m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Qualcomm, Micron, Sandisk, and AMD stocks sink, leading chip sector lower - Yahoo Finance", "full_content": "Qualcomm, Micron, Sandisk, and AMD stocks sink, leading chip sector lower Yahoo Finance The Semiconductor Sector May Be Nearing A Meltdown Seeking Alpha Asian chip stocks slide as disappointing Qualcomm, Arm earnings weigh Investing.com Chip stocks are suffering from a \u2018crisis of confidence\u2019 \u2014 but things aren\u2019t as gloomy as they seem MarketWatch Semiconductor Sell-Off: The Best Chip Stocks to Buy Right Now Before They Skyrocket Once Again The Motley Fool", "source": "Google News Business", "pub_date_str": "05 Nov 2026, 08:12 PM IST", "pub_date_relative": "59m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "US stocks today: Nasdaq falls at open day after midterms rally; chip, data center stocks fall", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a US stocks today: Nasdaq falls at open day after midterms r
