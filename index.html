    const allData = {"general": [{"title": "Fed staff should have known Silicon Valley Bank was vulnerable, new report finds", "full_content": "An outside review of the Federal Reserve's oversight of the failure of Silicon Valley Bank in 2023 has found that the Fed's staff \"knew, or should have known,\" that the bank was vulnerable prior to the crisis, Fed Vice Chair for Supervision Michelle Bowman said Friday.\n\nBowman announced the results of the review, by the consulting firm Starling Advisory Group, in a speech in London Friday.\n\nSilicon Valley Bank experienced a run in March 2023 after the bank announced it had sold securities at a $1.8 billion loss and needed to raise more capital. The bank's large holdings of U.S. Treasuries had lost value after the Fed began raising interest rates.\n\nThe bank's deposits were \"94 percent uninsured and concentrated in venture capital\u2013backed technology companies,\" Bowman said the review found.\n\nAfter the run, the Federal Deposit Insurance Corporation and the Fed stepped in to close the bank and insure depositors.\n\nThe Fed's top supervisory officer at the time, then-Vice Chair for Supervision Michael Barr, conducted a review of the episode in 2023. It found the Fed's staff were overcautious in responding to the episode.\n\nThe new review goes farther in saying Fed supervisors knew, or should have know, about the risks in advance.\n\nBarr stepped down from the supervisory position in February 2025 to allow President Donald Trump to select a new top regulator for the Fed. The president picked Bowman, who was confirmed by the Senate for that role.", "source": "CNBC Top News", "pub_date_str": "18 Sep 2026, 07:00 PM IST", "pub_date_relative": "4m ago"}, {"title": "A sideways market and rising earnings are presenting a buying opportunity for this crucial sector", "full_content": "A reset for technology makes the sector more attractive relative to the market, says Truist.", "source": "MarketWatch Top Stories", "pub_date ence experts and evaluators are banding together to warn they won't have the necessary resources and protections to test the safety of AI technology, which is facing heightened scrutiny due to concerns from insiders about the potential dangers of frontier models.\n\n\"We're just trying to really demonstrate a shared common ground on basic principles and ensure that independent oversight can be a meaningful tool for managing AI risk broadly,\" said Conrad Stosz, chair of the AI Evaluator Forum consortium that organized the letter, in an interview.\n\nThe group published a public letter on the matter on Friday, and shared it exclusively with CNBC. The signatories include AI luminaries like Geoffrey Hinton and members of organizations such as Johns Hopkins University, Stanford University and the nonprofit evaluator METR. They want to compel foundation model providers to ensure that third-party AI evaluators are allowed the necessary \"scientific objectivity, transparency, independence, and robust protections\" to do their jobs effectively and credibly, the letter said.\n\nStosz said it's part of an effort to hold the foundation model companies accountable to their recent pledges to support more thorough third-party AI safety testing .\n\nThe niche community of evaluators has been catapulted into the limelight since Anthropic CEO Dario Amodei floated the idea over the weekend of providing some of them \"employee-like access\" to inspect and audit bleeding-edge foundation models and their development processes.", "source": "CNBC World Economy", "pub_date_str": "18 Sep 2026, 06:30 PM IST", "pub_date_relative": "34m ago"}, {"title": "The U.S. says China's AI progress is down to 'distillation.' But is it that clear cut?", "full_content": "This report is from this week's The Tech Download newsletter. Like what you see? You can subscribe here.\n\nIn the battle for AI supremacy between the U.S. and China, \"distillation\" has become a hot topic.\n\nThe term broadly refers to the training of an AI model using the output or answers from another more advanced model. In some instances the process has been deemed controversial because a less advanced lab could use the product of a model that has taken millions or billions of dollars to create to design a competitive product.\n\nAs China has continued to pump out highly advanced models which compete in some areas with their American rivals, U.S. companies and Washington have accused Chinese labs of using distillation to gain ground, denouncing their efforts as theft.\n\nBut Aidan Gomez, the CEO of Cohere, says not all of China's progress is down to this technique.\n\nGomez, who spoke to me on the latest episode of The Tech Download, is an authoritative figure in AI. He was a co-author of a 2017 research paper called \"Attention Is All You Need,\" which underpins many of the AI services we use today such as ChatGPT and Claude.\n\nGomez described Chinese AI models as \"world class,\" adding that the lead U.S. labs have is \"evaporating very quickly.\"\n\n\"There was like a lot of talk about the Chinese are just copying, they're just distilling, they're cheating. A lot of these tropes were applied, and that was definitely true to an extent,\" Gomez told me.", "source": "CNBC World Economy", "pub_date_str": "18 Sep 2026, 06:30 PM IST", "pub_date_relative": "34m ago"}, {"title": "AI stock swings could affect your 401(k). Here\u2019s what retirement savers need to know", "full_content": "A version of this article first appeared in \u2033CNBC's Money 101 newsletter with Sharon Epperson,\u2033 an eight-week series with monthly updates to help improve your financial well-being. Subscribe now to receive the series in your inbox. It is also available in Spanish .\n\nThe AI trade has been volatile this week as investors weigh questions about the pace of artificial intelligence development, capacity constraints and safety concerns. Even if you do not own an individual AI stock or AI-themed fund, the swings may still affect your retirement savings .\n\nA \"slowdown\" in AI innovation, adaptation or use \"could have some downstream implications for the companies that might be in the average 401(k) investor's portfolio,\" said John Sedunov, a professor of finance at Villanova University.\n\nThe reason: Many 401(k) investors already have meaningful exposure to the companies driving the AI boom.\n\nFive technology giants \u2014 Nvidia , Apple , Microsoft , Alphabet and Amazon \u2014 account for about 30% of the S&P 500 index, as of Wednesday's market close, according to Morningstar. For the millions of workers who have a portion of their retirement savings invested in an S&P 500 index fund, that means a relatively small group of mega-cap companies can have an outsized effect on stock returns.\n\nHere's a look at more stories on how to manage, grow and protect your money for the years ahead.\n\n\"A slowdown would represent a pullback in some of the AI stocks or the large-cap technology stocks that make up a large portion of investors' portfolios today,\" said Zachary Evens, a manager research analyst for Morningstar, because of the concentration within S&P 500 index funds that can make up a large share of their 401(k).\n\nThat doesn't mean an S&P 500 index fund isn't diversified. The index owns hundreds of companies across sectors.", "source": "CNBC Top News", "pub_date_str": "18 Sep 2026, 06:22 PM IST", "pub_date_relative": "42m ago"}, {"title": "Gas prices jump across the US. See map of state-by-state numbers - usatoday.com", "full_content": "Gas prices jump across the US. See map of state-by-state numbers usatoday.com Gas prices are about to take a big jump, analysts say, with the worst still to come The Washington Post Gas prices are surging past $4.40 a gallon as the Iran war squeezes U.S. drivers qz.com Pump Prices Keep Climbing as Crude Oil Remains High AAA Gas Prices Ohio diesel prices hit record high as gas prices surge 10TV", "source": "Google News Business", "pub_date_str": "18 Sep 2026, 06:14 PM IST", "pub_date_relative": "50m ago"}, {"title": "Why mortgage bonds are set to deteriorate, and possibly hit the whole market, according to this Wall Street expert", "full_content": "A flattening Treasury yield curve is part of the problem for mortgage-backed securities, says Harley Bassman.", "source": "MarketWatch Top Stories", "pub_date_str": "18 Sep 2026, 06:10 PM IST", "pub_date_relative": "54m ago"}], "cfa": [{"title": "Fed staff should have known Silicon Valley Bank was vulnerable, new report finds", "full_content": "An outside review of the Federal Reserve's oversight of the failure of Silicon Valley Bank in 2023 has found that the Fed's staff \"knew, or should have known,\" that the bank was vulnerable prior to the crisis, Fed Vice Chair for Supervision Michelle Bowman said Friday.\n\nBowman announced the results of the review, by the consulting firm Starling Advisory Group, in a speech in London Friday.\n\nSilicon Valley Bank experienced a run in March 2023 after the bank announced it had sold securities at a $1.8 billion loss and needed to raise more capital. The bank's large holdings of U.S. Treasuries had lost value after the Fed began raising interest rates.\n\nThe bank's deposits were \"94 percent uninsured and concentrated in venture capital\u2013backed technology companies,\" Bowman said the review found.\n\nAfter the run, the Federal Deposit Insurance Corporation and the Fed stepped in to close the bank and insure depositors.\n\nThe Fed's top supervisory officer at the time, then-Vice Chair for Supervision Michael Barr, conducted a review of the episode in 2023. It found the Fed's staff were overcautious in responding to the episode.\n\nThe new review goes farther in saying Fed supervisors knew, or should have know, about the risks in advance.\n\nBarr stepped down from the supervisory position in February 2025 to allow President Donald Trump to select a new top regulator for the Fed. The president picked Bowman, who was confirmed by the Senate for that role.", "source": "CNBC Top News", "pub_date_str": "18 Sep 2026, 07:00 PM IST", "pub_date_relative": "4m ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "A sideways market and rising earnings are presenting a buying opportunity for this crucial sector", "full_content": "A reset for technology makes the sector more attractive relative to the market, says Truist.", "source": "MarketWatch Top Stories", "pub_date_str": "18 Sep 2026, 07:00 PM IST", "pub_date_relative": "4m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stocks are headed for another losing week. One group is limiting the decline", "full_content": "The S&P 500 is on pace for its second consecutive weekly decline. If it wasn't for the \"Magnificent Seven\", the pullback would be much more severe.", "source": "CNBC Top News", "pub_date_str": "18 Sep 2026, 06:53 PM IST", "pub_date_relative": "10m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Strawberry Fields REIT raises $17 million in Israel bond and warrant offering", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Sep 2026, 06:51 PM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Fixed Income", "Alternative Investments"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Roundtable appoints Liz Truss to board of directors", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Sep 2026, 06:50 PM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Nauticus Robotics extends term loan maturity to January 2028 in new agreement", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Sep 2026, 06:46 PM IST", "pub_date_relative": "17m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Virbac H1 2026 slides: revenue up 7.4%, margin gains despite FX headwinds", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Sep 2026, 06:45 PM IST", "pub_date_relative": "19m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Anthropic and OpenAI need truly independent safety evaluators, experts say in public letter", "full_content": "Over 100 artificial intelligence experts and evaluators are banding together to warn they won't have the necessary resources and protections to test the safety of AI technology, which is facing heightened scrutiny due to concerns from insiders about the potential dangers of frontier models.\n\n\"We're just trying to really demonstrate a shared common ground on basic principles and ensure that independent oversight can be a meaningful tool for managing AI risk broadly,\" said Conrad Stosz, chair of the AI Evaluator Forum consortium that organized the letter, in an interview.\n\nThe group published a public letter on the matter on Friday, and shared it exclusively with CNBC. The signatories include AI luminaries like Geoffrey Hinton and members of organizations such as Johns Hopkins University, Stanford University and the nonprofit evaluator METR. They want to compel foundation model providers to ensure that third-party AI evaluators are allowed the necessary \"scientific objectivity, transparency, independence, and robust protections\" to do their jobs effectively and credibly, the letter said.\n\nStosz said it's part of an effort to hold the foundation model companies accountable to their recent pledges to support more thorough third-party AI safety testing .\n\nThe niche community of evaluators has been catapulted into the limelight since Anthropic CEO Dario Amodei floated the idea over the weekend of providing some of them \"employee-like access\" to inspect and audit bleeding-edge foundation models and their development processes.", "source": "CNBC World Economy", "pub_date_str": "18 Sep 2026, 06:30 PM IST", "pub_date_relative": "34m ago", "cfa_topics": ["Financial Statement Analysis", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "AI stock swings could affect your 401(k). Here\u2019s what retirement savers need to know", "full_content": "A version of this article first appeared in \u2033CNBC's Money 101 newsletter with Sharon Epperson,\u2033 an eight-week series with monthly updates to help improve your financial well-being. Subscribe now to receive the series in your inbox. It is also available in Spanish .\n\nThe AI trade has been volatile this week as investors weigh questions about the pace of artificial intelligence development, capacity constraints and safety concerns. Even if you do not own an individual AI stock or AI-themed fund, the swings may still affect your retirement savings .\n\nA \"slowdown\" in AI innovation, adaptation or use \"could have some downstream implications for the companies that might be in the average 401(k) investor's portfolio,\" said John Sedunov, a professor of finance at Villanova University.\n\nThe reason: Many 401(k) investors already have meaningful exposure to the companies driving the AI boom.\n\nFive technology giants \u2014 Nvidia , Apple , Microsoft , Alphabet and Amazon \u2014 account for about 30% of the S&P 500 index, as of Wednesday's market close, according to Morningstar. For the millions of workers who have a portion of their retirement savings invested in an S&P 500 index fund, that means a relatively small group of mega-cap companies can have an outsized effect on stock returns.\n\nHere's a look at more stories on how to manage, grow and protect your money for the years ahead.\n\n\"A slowdown would represent a pullback in some of the AI stocks or the large-cap technology stocks that make up a large portion of investors' portfolios today,\" said Zachary Evens, a manager research analyst for Morningstar, because of the concentration within S&P 500 index funds that can make up a large share of their 401(k).\n\nThat doesn't mean an S&P 500 index fund isn't diversified. The index owns hundreds of companies across sectors.", "source": "CNBC Top News", "pub_date_str": "18 Sep 2026, 06:22 PM IST", "pub_date_relative": "42m ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Gas prices jump across the US. See map of state-by-state numbers - usatoday.com", "full_content": "Gas prices jump across the US. See map of state-by-state numbers usatoday.com Gas prices are about to take a big jump, analysts say, with the worst still to come The Washington Post Gas prices are surging past $4.40 a gallon as the Iran war squeezes U.S. drivers qz.com Pump Prices Keep Climbing as Crude Oil Remains High AAA Gas Prices Ohio diesel prices hit record high as gas prices surge 10TV", "source": "Google News Business", "pub_date_str": "18 Sep 2026, 06:14 PM IST", "pub_date_relative": "50m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Why mortgage bonds are set to deteriorate, and possibly hit the whole market, according to this Wall Street expert", "full_content": "A flattening Treasury yield curve is part of the problem for mortgage-backed securities, says Harley Bassman.", "source": "MarketWatch Top Stories", "pub_date_str": "18 Sep 2026, 06:10 PM IST", "pub_date_relative": "54m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Hi-Tech Flow Solutions files DHRP for IPO, to raises Rs 300 cr via fresh issue", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a Hi-Tech Flow Solutions files DHRP for IPO, to raises Rs 300 cr via fresh issue The Economic Times daily newspaper is available online now. Read Today's Paper Hi-Tech Flow Solutions files DHRP for IPO, to raises Rs 300 cr via fresh issue SECTIONS Hi-Tech Flow Solutions files DHRP for IPO, to raises Rs 300 cr via fresh issue By Akash Podishetti , ETMarkets.com Last Updated: Sep 18, 2026, 06:08:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Hi-Tech Flow Solutions has filed its DRHP for a Rs 300 crore IPO comprising a fresh issue and offer-for-sale. The company plans capacity expansion, debt repayment and corporate purposes, while targeting growing demand for HSAW pipes across infrastructure sectors.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "18 Sep 2026, 06:08 PM IST", "pub_date_relative": "55m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Alternative Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Rediff.com IPO: New UPI MDR rules open an additional revenue stream for the company: Report", "full_content": "The government\u2019s recent announcement of a Merchant Discount Rate (MDR) on select high-value UPI merchant transactions could provide an additional monetisation opportunity for Rediff.com, an Indian internet and digital media company that is planning to enter the Indian primary market soon.\n\nThe framework, which comes into effect from October 15, ends zero-MDR pricing for large-ticket merchant UPI payments as the government moves to a tiered pricing model.\n\nThe MDR will apply to person-to-merchant UPI payments above \u20b9 2,000. The charge will be paid by merchants, not consumers, and will be capped at \u20b9 300 for transactions of \u20b9 75,000 or more. Payments between individuals, as well as the vast majority of everyday merchant payments, will remain free.\n\nFor Rediff.com, the timing could be favourable as it prepares to scale RediffPay, its consumer UPI app, alongside its planned listing. Rediff.com is authorised as a Third-Party Application Provider (TPAP) by NPCI, with Axis Bank as its Payment Service Provider bank, ANI reported.\n\nThe report, citing analysts, said payments of more than \u20b9 2,000 accounted for barely 4% of person-to-merchant UPI volume in FY26 but roughly two-thirds of transaction value. This means the new fee, while narrow in scope, could affect a majority of UPI transaction value.\n\nUnder the new framework, the 0.4% MDR will be shared across the UPI ecosystem rather than accruing directly to the government or NPCI. Industry estimates, however, suggest that TPAPs on the payer side could capture roughly 8 basis points of the 40-basis-point pool. The final revenue-sharing arrangement and eligible transaction volumes for each app will determine the actual impact.\n\nFor RediffPay, this would mean earning a share of the MDR on qualifying high-value merchant payments, rather than receiving a flat 0.4% of all UPI transactions, the report noted.", "source": "LiveMint Markets", "pub_date_str": "18 Sep 2026, 06:03 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Quantitative Methods", "Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "Buffett steps down, Wall Street bounces back, 2027 'truck wars' and more in Morning Squawk", "full_content": "This is CNBC's Morning Squawk newsletter. Subscribe here to receive future editions in your inbox.\n\nHappy Friday. In today's edition, we have the latest on the debate over whether to slow the development of artificial intelligence. There may even be some lessons to learn from one Oscar-winning film.\n\nStock futures are little changed this morning after the market put an end to its losing streak .\n\nHere are five key things investors need to know to start the trading day:\n\nAfter more than 60 years leading Berkshire Hathaway, Warren Buffett announced this morning that he will step down as chairman of the conglomerate. The legendary investor will become chairman emeritus and stay on Berkshire's board of directors, while his son Howard will succeed him as chairman.\n\n\"Father Time always wins,\" Buffett, 96, wrote in a letter to shareholders. \"He has, however, been generous with me. He has given me the opportunity to see Berkshire reach a point where I am more confident than ever about what lies ahead.\"\n\nFriday's announcement comes less than a year after Greg Abel replaced Buffett as Berkshire's CEO. But as CNBC's John Melloy notes, Buffett has since remained active in the conglomerate's business. Under Buffett's decades-long leadership, Berkshire posted a 19.7% compounded annual return to shareholders \u2014 almost double that of the S&P 500.\n\nFears about the safety of advanced artificial intelligence models have taken center stage this week, as more and more leaders from Silicon Valley to Washington, D.C. chime in on the regulation debate.", "source": "CNBC World Economy", "pub_date_str": "18 Sep 2026, 05:58 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Derivatives"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Bhumika Realty leases 24,000 sq ft retail space to Lifestyle in Faridabad", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Digital Real Estate \u203a Realty News \u203a Bhumika Realty leases 24,000 sq ft retail space to Lifestyle in Faridabad PVR INOX Share Price Tips Music Share Price Imagicaaworld Entertainment Share Price Panorama Studios International Share Price Balaji Telefilms Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Bhumika Realty leases 24,000 sq ft retail space to Lifestyle in Faridabad SECTIONS Bhumika Realty leases 24,000 sq ft retail space to Lifestyle in Faridabad PTI Last Updated: Sep 18, 2026, 05:55:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Bhumika Realty has secured a 24,000 sq ft lease with Lifestyle, marking a significant milestone for their new project, 'The Icon', currently under development in Faridabad. With this mixed-use venture, Faridabad is quickly positioning itself as a key player in the NCR's retail landscape. This deal underscores the rising interest of prominent brands in organized retail within the city, setting the stage for further growth.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "18 Sep 2026, 05:55 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Fed hike, RBI moves hand India bonds a fifth weekly loss", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Bonds \u203a Fed hike, RBI moves hand India bonds a fifth weekly loss Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Fed hike, RBI moves hand India bonds a fifth weekly loss SECTIONS Fed hike, RBI moves hand India bonds a fifth weekly loss Reuters Last Updated: Sep 18, 2026, 05:53:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Indian government bonds have fallen for five consecutive weeks. A Federal Reserve rate hike and RBI liquidity measures emboldened bond market bears. Global yields reached multi-decade peaks, and the Fed raised rates by twenty-five basis points. The Reserve Bank of India sold bonds, draining significant liquidity from the system. This situation increases the likelihood of an RBI rate hike in October.\n\nIndian government bonds maintained a steady performance as traders keenly monitored new debt supply cutoffs. In September, the Reserve Bank of India revealed plans for extensive open market debt sales. These initiatives are intended to absorb excess liquidity while enhancing the transmission of monetary policy. Market participants are also expecting further bond offerings from the central bank in light of anticipated rate increases from both the Federal Reserve and RBI.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "18 Sep 2026, 05:53 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Midcap roller-coaster: Sharp falls of over 20% can happen once every 4.2 years \u2014 here's what you need to know", "full_content": "Midcap stocks can witness sharp corrections, making volatility a key risk for investors. But avoiding market falls can create another challenge if the subsequent recovery is missed. A 21-year analysis of the Nifty Midcap 150 highlights this trade-off.", "source": "LiveMint Money", "pub_date_str": "18 Sep 2026, 05:50 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Putin targets Nestle's Russian business as Kremlin tightens grip on Western assets", "full_content": "Nestl\u00e9 is assessing its options after Russia placed the Swiss food giant\u2019s local assets under temporary external administration.", "source": "CNBC Top News", "pub_date_str": "18 Sep 2026, 05:48 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "NRI woman gets relief as ITAT cuts income tax penalty from 200% to 50%: Know why", "full_content": "ITAT Mumbai cut an NRI's tax penalty from 200% to 50% after she omitted \u20b914.46 lakh in interest income from her ITR. The tribunal held mere omission isn't automatic misreporting, citing her overseas residence, reliance on an accountant, and voluntary tax payment once notified.", "source": "LiveMint Money", "pub_date_str": "18 Sep 2026, 05:46 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Dow Jones| Nasdaq | S&P 500 | US Stock Market Today |Live Updates: Nasdaq futures lead US stock gains as oil retreat eases inflation fears", "full_content": "", "source": "Economic Times Markets", "pub_date_str": "18 Sep 2026, 05:43 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}], "updated_at": "18 Sep 2026, 07:04 PM IST", "total_stories": 386};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
