    const allData = {"general": [{"title": "Global stocks tumble as oil prices rise", "full_content": "Crude prices jump 3.5% while Eurozone bond sell-off deepens", "source": "FT Markets", "pub_date_str": "22 Oct 2026, 06:33 PM IST", "pub_date_relative": "1m ago"}, {"title": "Badger Meter earnings beat by $0.01, revenue fell short of estimates", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Oct 2026, 06:25 PM IST", "pub_date_relative": "9m ago"}, {"title": "Why is Direxion Daily Semiconductor Bull 3X Shares ETF tumbling today?", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Oct 2026, 06:24 PM IST", "pub_date_relative": "10m ago"}, {"title": "Saudi Aramco tells staff to evacuate Dhahran as clashes with Yemen\u2019s Houthis continue", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Oct 2026, 06:24 PM IST", "pub_date_relative": "10m ago"}, {"title": "Petra Diamonds delays annual results, faces trading suspension", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Oct 2026, 06:24 PM IST", "pub_date_relative": "11m ago"}, {"title": "Earnings call transcript: Curbline Properties raises Q3 2026 outlook as shares rise", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Oct 2026, 06:24 PM IST", "pub_date_relative": "11m ago"}, {"title": "France protests: Macron condemns 'stupid' comments from Trump, others as bond market pressure builds", "full_content": "French President Emmanuel Macron has criticized \"unacceptable\" and \"stupid\" comments made by foreign leaders and others after the country saw mass protests and its worst rioting in years.\n\n\"There was foreign disinformation in the aftermath, which prompted comments that were as unacceptable as they were stupid from many people, including foreign leaders,\" Macron told reporters on Wednesday, according to Reuters .\n\nMacron clarified he was talking about U.S. President Donald Trump \"among others,\" and said politicians were using the situation in France for their own ends.\n\nPosting on his Truth social platform, Trump earlier this week blamed the unrest on \"migrants, jihadists, and Communists\" and told Europe to close its borders.\n\nTrump and other Republicans, including Vice President JD Vance and House Speaker Mike Johnson , have referenced the unrest in France on the campaign trail ahead of the upcoming U.S. midterms . They have claimed that Democrat policies on immigration would raise similar tensions.\n\nPolitical sparring has extended to government agencies. U.S. Immigration and Customs Enforcement (ICE) wrote on X on Wednesday that it was \"fighting to prevent American streets from looking like this.\" The post included footage that appeared to reference rioters in France.\n\nThe French Ministry for Europe and Foreign Affairs responded on its own X account that it was \"fighting to prevent French stats from looking like this,\" showing a graphic displaying the gulf in U.S. firearm homicides per 100,000 people over G7 peers.\n\nOfficials in Iran \u2014 where rights groups say authorities killed hundreds of people during a crackdown on recent demonstrations \u2014 have also weighed in, with Foreign Minister Seyed Abbas Araghchi calling on Macron to listen to the protesters' demands.", "source": "CNBC Top News", "pub_date_str": "22 Oct 2026, 06:22 PM IST", "pub_date_relative": "12m ago"}, {"title": "Spain accuses Trump ally Milei of \u2018disgraceful\u2019 election interference", "full_content": "Spain's government has become embroiled in a dispute with Argentinian President Javier Milei after the latter accused Prime Minister Pedro Sanchez of being a \"dictator\" while endorsing his right-wing political rivals.\n\nSpeaking at an event in Madrid on Wednesday, Milei claimed that Spain \"suffers [with socialism] under the disgraceful dictator Pedro Sanchez,\" and urged voters to \"kick the socialists out, because you are the cradle of liberalism.\"\n\nThe Spanish Foreign Ministry issued a statement condemning Milei's comments \u2014 made during an unofficial visit to Spain \u2014 as \"insults and slander\" directed at the country, its prime minister and its population.\n\n\"Spain is a sovereign nation that does not accept external interference, nor attacks or insults against its Prime Minister and its freely, democratically and sovereignly elected institutions, nor does it tolerate anyone disrupting our peaceful and democratic coexistence,\" the government said.\n\n\"It is disgraceful that a person holding the highest office in a sister nation should visit our country with the sole aim of attempting to foster a climate of polarization and violence amongst Spaniards and between sister nations such as Spain and Argentina.\"\n\nMilei's unofficial visit to the Spanish capital on Wednesday comes as Spain gears up for a general election on Nov. 29.\n\nSanchez is the leader of the Spanish Socialist Workers' Party and has been Spain's prime minister since 2018.\n\nOn Oct. 5, Sanchez called an early election after lawmakers voted against housing reforms drawn up in the wake of nationwide protests over Spain's housing crisis.", "source": "CNBC Top News", "pub_date_str": "22 Oct 2026, 06:22 PM IST", "pub_date_relative": "12m ago"}, {"title": "Gentherm Q3 2026 slides: Modine deal reshapes growth strategy", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Oct 2026, 06:22 PM IST", "pub_date_relative": "12m ago"}, {"title": "Buffalo Potash secures C$8.5M royalty deal with Altius", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Oct 2026, 06:22 PM IST", "pub_date_relative": "13m ago"}, {"title": "Sky Quarry begins production at Eagle Springs refinery", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Oct 2026, 06:22 PM IST", "pub_date_relative": "13m ago"}, {"title": "Goldman Sachs forecasts 9% of workers could face AI displacement", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Oct 2026, 06:22 PM IST", "pub_date_relative": "13m ago"}, {"title": "Brent crude near $112 as U.S. and Israel reportedly weigh fresh Iran strikes", "full_content": "Oil prices climbed Thursday on worries over a possible escalation in the Middle East conflict as the U.S. reportedly plans to resume strikes against Iran.\n\nBrent crude futures rose 2.7% to $111.80 a barrel as of 8:39 a.m. ET, while U.S. West Texas Intermediate crude gained 2.21% to $99.30.\n\nThe U.S. and Israeli militaries have drawn up specific plans for renewed strikes on Iran after next month's midterm elections, unnamed U.S. officials told The New York Times . Planning for a \"short but intensive\" operation is progressing, the officials said.\n\nThe U.S. has also ordered non-emergency government employees and their families to leave Saudi Arabia.\n\nState Department spokesman Tommy Pigott in a post on X said the order applies only to Saudi Arabia, dismissing reports that the U.S. had directed some staff in the wider Gulf region to leave. He pointed to escalating attacks by Iran-aligned Houthis on civilian targets in Saudi Arabia.\n\nThe economic fallout from elevated oil prices, however, may be less severe than in previous decades, as consumers have become less vulnerable to energy shocks, according to David Wagner, head of equity and portfolio manager at Aptus Capital Advisors.\n\n\"$100 oil today is very different than $100 oil, you know, 20, 30 years ago,\" Wagner said, noting that crude prices remain well below their inflation-adjusted historical highs.\n\nHe pointed to U.S. government data showing that gasoline accounted for roughly 5% of the average American's disposable income a decade ago, compared with about half that today, suggesting households may be better positioned to withstand elevated energy costs.", "source": "CNBC Top News", "pub_date_str": "22 Oct 2026, 06:21 PM IST", "pub_date_relative": "13m ago"}, {"title": "Earnings call transcript: Allegion tops Q3 2026 estimates as shares jump premarket", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Oct 2026, 06:21 PM IST", "pub_date_relative": "14m ago"}, {"title": "Post Office vs FD vs Arbitrage Fund: Which one offers best post-tax returns? Compare risk and liquidity before investing", "full_content": "A post office time deposit offering 6.9% interest may appear more attractive than a bank fixed deposit (FD) offering 6.25%. But what if an arbitrage mutual fund delivering a slightly lower return leaves investors with more money after taxes? The answer depends largely on the investor's income tax bracket and how long the money remains invested.\n\nFor investors looking to park \u20b9 5 lakh for a year or longer, the difference in post-tax earnings can be substantial. While post office deposits and bank FDs offer predictable returns, arbitrage funds enjoy relatively favourable tax treatment when held for more than 12 months.\n\nUttam Agarwal, Chief Business Officer, Bajaj Capital - La Premi\u00e8r, explains how the three options compare on returns, taxation , liquidity and risk, and why the investment offering the highest post-tax return may not necessarily be the most suitable choice.\n\nThe biggest difference between these instruments lies in how their earnings are taxed.\n\nInterest from post office deposits and bank FDs is added to the investor's taxable income and taxed at the applicable slab rate. This means investors in higher tax brackets retain a smaller portion of their interest earnings.\n\nArbitrage funds, which qualify for equity-oriented mutual fund taxation, are treated differently. Gains on units held for up to 12 months attract short-term capital gains tax of 20%. For holdings exceeding 12 months, long-term capital gains above \u20b9 1.25 lakh in a financial year are taxed at 12.5%.\n\n\"When it comes down to how much of the return you get to keep,\" the tax treatment becomes crucial, Agarwal explained.\n\nFor illustration, he considered a one-year post office deposit offering 6.9%, a bank FD offering around 6.25%, and an arbitrage fund generating an assumed annual return of 6.5%.", "source": "LiveMint Money", "pub_date_str": "22 Oct 2026, 06:18 PM IST", "pub_date_relative": "16m ago"}, {"title": "Meta Platforms beat the Street. Here's why analysts are bullish on the stock", "full_content": "Meta posted third-quarter financial results postmarket Wednesday. Afterward, analysts said there is a lot to like about the Instagram parent's stock.", "source": "CNBC Top News", "pub_date_str": "22 Oct 2026, 06:18 PM IST", "pub_date_relative": "17m ago"}, {"title": "Critical PHP web security flaws spark global alarm as Google, OpenAI and Amazon respond", "full_content": "The tech world is racing to implement fixes after the discovery of critical security vulnerabilities in software used to power much of the internet.\n\nThe software, known as PHP, is an open-source programming language widely used to power websites and web applications. The discovery of the flaws prompted urgent warnings from governments worldwide, while tech giants including Google, OpenAI and Amazon have been involved in efforts to uncover the vulnerabilities, detect potential attacks and protect affected systems.\n\nThe two vulnerabilities, collectively known as \"PHP2Shell,\" could allow hackers to remotely execute malicious code on affected servers, potentially exposing sensitive data, according to cybersecurity researchers. While not every website using PHP is necessarily vulnerable, the software's widespread use has raised concerns about the potential scale of attacks.\n\nThe U.S. National Security Agency on Wednesday urged organizations using PHP to prepare security updates addressing the vulnerabilities, warning that the flaws could provide attackers with direct access to server file systems and databases. The agency recommended taking affected systems offline until the vulnerabilities are fully addressed if immediate updates are not possible.\n\nThe Federal Bureau of Investigation also warned that malicious actors could exploit the vulnerabilities to execute code remotely, putting sensitive data and networks at risk.\n\nCybersecurity authorities in Singapore , the United Kingdom , Australia , Canada and the European Union have issued similar alerts, underscoring concerns about the potential impact on businesses, government agencies and other organizations that rely on PHP-based systems.\n\nAmazon said its threat intelligence team had detected attempts to exploit the vulnerabilities before they were publicly disclosed, using its MadPot threat detection system, which monitors suspicious activity across internet-facing infrastructure.", "source": "CNBC World Economy", "pub_date_str": "22 Oct 2026, 06:16 PM IST", "pub_date_relative": "19m ago"}, {"title": "Trump's approval rating on economy hits all-time low as midterm looms: CNBC survey", "full_content": "With less than two weeks to go before the congressional elections, Americans are nearly as gloomy about the economy as they were when the nation was emerging from the pandemic, and President Donald Trump 's economic approval rating is hitting an all-time low, according to the latest CNBC All-America Economic Survey .\n\nEight out of 10 Americans rate the economy as fair or poor, the highest number since December 2023 and one of several ominous signs for Republicans in the new polling data released Thursday that show why their candidates are facing an uphill battle in the midterm .\n\nDownbeat views on the economy are most intense among Democrats and independents, but there's been a strong move toward economic pessimism even among Republicans in recent months. Overall, 63% of the public is pessimistic about the current state of the economy and the outlook, up 1 percentage point from the July survey . But that percentage now includes 35% of Republicans, up 6 points from July and the highest level of Republican pessimism of either of Trump's two terms.\n\n\"We got there not because of independents or Democrats getting more sour \u2014 it's because Republicans have,\" said Micah Roberts, partner at Public Opinion Strategies, the Republican pollster for the survey. \"Since Trump has been president, [Republicans] have held on to a small margin saying that the current economy is either excellent or good. And now that has kind of broken and changed.\"\n\nThe survey of 1,000 registered voters nationwide, with a margin of error of plus or minus 3.1%, found Americans preferring Democratic control of Congress by a 52% to 45% margin. The 7 percentage point Democratic edge represents a 3 percentage point gain for Democrats from the July survey.\n\nThe poll contained other foreboding signs for Republicans as well. It showed 72% of Democrats highly interested in the midterm election on Nov. 3, compared with just 62% of Republicans.", "source": "CNBC Top News", "pub_date_str": "22 Oct 2026, 06:14 PM IST", "pub_date_relative": "21m ago"}, {"title": "Southwest Airlines cuts 2026 profit forecast on higher fuel", "full_content": "Southwest Airlines became the third major U.S. airline this month to cut its 2026 profit forecast due to higher fuel prices, but CEO Bob Jordan said travelers continue to book despite higher fares.\n\nThe carrier expects to earn between $2.60 and $2.85 a share on an adjusted basis this year, down from its forecast in July of between $3.25 to as much as $4.25 a share.\n\nHere's what Southwest reported for third quarter compared with Wall Street expectations, according to consensus estimates from LSEG:\n\nSouthwest forecast per-share adjusted earnings of between 55 cents and 80 cents in the fourth quarter and unit revenue, a gauge of airfare, up as much as 21% from a year earlier. It said it expects to grow capacity by up to 4% year over year.\n\n\"Demand remained strong as we lapped last year's bag fee and other commercial initiatives, reinforcing our belief that the earnings power we've built is durable, even with significantly higher fuel costs,\" Jordan said in an earnings release.\n\nThe airline said its average passenger fare was $231.69 in the third quarter, up almost 27% from the same quarter of 2025. A spokesman said that number does not include add-on fees. The number of revenue passengers carried fell 3.2% to 33.47 million people.\n\nBut Jordan told CNBC's Phil LeBeau that demand was strong across every geography and product.\n\n\"The consumer is incredibly strong and we do not see that abating,\" Jordan said. \"We're seeing strength in both the holiday period and the non-holiday period.\"", "source": "CNBC Top News", "pub_date_str": "22 Oct 2026, 06:12 PM IST", "pub_date_relative": "23m ago"}, {"title": "Sebi allows margin relief against early pay-in of securities for subsequent trades", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Sebi allows margin relief against early pay-in of securities for subsequent trades The Economic Times daily newspaper is available online now. Read Today's Paper Sebi allows margin relief against early pay-in of securities for subsequent trades SECTIONS Sebi allows margin relief against early pay-in of securities for subsequent trades PTI Last Updated: Oct 22, 2026, 06:11:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Securities and Exchange Board of India (Sebi) has announced a new directive that eases margin requirements for clients with a net sell obligation. This policy is particularly applicable when early pay-in requests are accepted by the clearing corporation, allowing clients to execute trades more efficiently. No margin will be collected on future trades up to the value of accepted early pay-in securities.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "22 Oct 2026, 06:11 PM IST", "pub_date_relative": "24m ago"}, {"title": "Markets are pricing in long-term AI winners. This veteran investor says history proves customers win more than innovators.", "full_content": "Rob Arnott, chairman of Syzygy Asset Management, says the perceived AI winners of today may be far from reality.", "source": "MarketWatch Top Stories", "pub_date_str": "22 Oct 2026, 06:10 PM IST", "pub_date_relative": "25m ago"}, {"title": "163% return in 3 years! This AMC declares \u20b99.50 dividend despite 6% profit dip- Do you own? Check record date", "full_content": "Shares of Nippon Life India Asset Management Limited ended lower on Thursday, October 22, after the company announced second quarter results for the financial year 2026-27. Apart from Q2 FY27 results, the AMC also announced an interim dividend for the financial year 2026-27.\n\nNippon Life India Asset Management Limited share price closed 3.14% lower today after the announcement of Q2FY27 results.\n\nThe company\u2019s board of directors, on Thursday, declared an interim dividend of \u20b9 9.50 per equity share with a face value of \u20b9 10 each, which is 95% of its face value. The company has also fixed record dates to determine the eligibility of shareholders for the payout.\n\nNippon Life India AMC has fixed Wednesday, October 28, as the record date. Which means that investors must own the stock before Wednesday to qualify for the payout.\n\nNippon Life India Asset Management, on Thursday, reported a 6% annual decline in its net profit after tax (PAT) to \u20b9 324.4 crore for September quarter FY27. The decline in profit was driven by a one-time exceptional item of \u20b9 96.76 crore pertaining to Sebi settlement proceedings. The company earned a profit after tax of \u20b9 344.64 crore in the year-ago period.\n\nRevenue from operations surged 21% year-on-year to \u20b9 796 crore in the July-September period of FY27 from \u20b9 658.1 crore a year ago, the asset management firm said in a stock exchange filing.\n\nThe AMC\u2019s share price closed 3.14% lower at \u20b9 970 per share on BSE with a market capitalisation of \u20b9 62,084.07 crore. The stock has delivered 10.87% return year to date (YTD), 46.76% return in two years, and 163% return in three years.\n\nCatch all the Business News , Market News , Breaking News Events and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.", "source": "LiveMint Markets", "pub_date_str": "22 Oct 2026, 06:09 PM IST", "pub_date_relative": "25m ago"}, {"title": "Meta falls as investors balance Muse growth with rising AI costs", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Meta falls as investors balance Muse growth with rising AI costs Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Meta falls as investors balance Muse growth with rising AI costs SECTIONS Meta falls as investors balance Muse growth with rising AI costs Reuters Last Updated: Oct 22, 2026, 06:09:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment quarter profit rises on pricing strength Reuters Last Updated: Oct 22, 2026, 06:06:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Union Pacific showcased impressive third-quarter adjusted profit, primarily fueled by increased fuel surcharge revenue and solid core pricing strategies. The boost in operating revenue reflects their commitment to maintaining pricing discipline and enhancing operational efficiencies. Despite the hurdles posed by geopolitical-driven energy price hikes, US railroads have effectively sustained profitability, benefiting from improved service reliability that attracted new freight volumes while keeping existing customers engaged.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "22 Oct 2026, 06:06 PM IST", "pub_date_relative": "29m ago"}, {"title": "Why governments pulled websites offline over the decades-old PHP programming language", "full_content": "Government websites in Europe were taken offline on Wednesday as concerns spread about vulnerabilities in servers that host sites coded in PHP, the world's most popular server programming language.\n\nThe U.S. National Security Agency warned millions of organizations to either implement patches immediately or take their servers offline. It's the latest cyber scare in the artificial intelligence era, as vulnerabilities that previously took weeks or months for hackers to find can now be exploited in a matter of hours.\n\nMatt Suiche, a researcher at cybersecurity startup Tolmo, says this level of urgency is \"very new.\"\n\n\"That's not something that even existed a year ago,\" he said. \"The reason there is that sense of urgency now is really because everyone has AI-augmented capabilities, not only defenders but also attackers.\"\n\nPHP, created in the 1990s, is used by just under 70% of all websites with known server-side programming languages.\n\nIn mid-August, researchers at AI firm Calif and Google's Wiz identified vulnerabilities in all PHP installations serving web requests. For the discovery, Calif's researchers used OpenAI's GPT\u20115.6 Sol, while the Wiz team used its Wiz Atlas security AI agent, Google's Gemini 4 Argon, and GPT-5.6 Sol.\n\nThe vulnerabilities, dubbed \"PHP2Shell,\" allow for unauthenticated hackers to remotely execute code on any PHP server, letting bad actors potentially steal data and read sensitive information.\n\nThe PHP Foundation was intending to release patches for the bugs on Thursday. But news of the vulnerabilities leaked earlier in online forums, and then by Calif itself, which accidentally posted a proof-of-concept video on Tuesday that demonstrated an exploit chain.", "source": "CNBC World Economy", "pub_date_str": "22 Oct 2026, 06:05 PM IST", "pub_date_relative": "30m ago"}, {"title": "Oil is now flowing out of the Persian Gulf like before the Iran war. Why prices may still not come down anytime soon.", "full_content": "Oil flows out of the Persian Gulf in October nearly returned to levels seen before the start of the Iran war, but traders remain wary about a fragile recovery.", "source": "MarketWatch Top Stories", "pub_date_str": "22 Oct 2026, 06:05 PM IST", "pub_date_relative": "30m ago"}, {"title": "Here are Thursday's biggest analyst calls: Nvidia, Tesla, SpaceX, Meta, CoreWeave, IBM, Block & more", "full_content": "Here are Thursday's biggest calls on Wall Street.", "source": "CNBC Top News", "pub_date_str": "22 Oct 2026, 05:59 PM IST", "pub_date_relative": "35m ago"}, {"title": "California's Proposition 40: What voters need to know about the billionaire wealth tax", "full_content": "Proposition 40 , California's billionaire tax proposal, would authorize a one-time, 5% \"wealth tax\" on residents of the state with a net worth above $1 billion. The Nov. 3 Election Day ballot measure has divided politicians, the wealthy, economists, public policy groups, and voters, and it is looking more likely that the vote is headed down to the wire.\n\nThe initiative is a major test of the appetite for state-level taxation of extreme wealth \u2014 its result, economists say, could shape how other states approach wealth tax policy going forward.\n\nIn a University of California Berkeley Institute of Governmental Studies poll conducted in September, 45% of likely voters said they would vote \"Yes\" on Proposition 40, while 42% said they would vote \"No.\"\n\nThe results continued a recent shift in the pollster's data, with the \"Yes\" edge shrinking from 7% to 3%. In its early August survey, UC Berkeley IGS found 48% of likely voters said they would vote yes. In its polling last March, \"Yes\" on Prop 40 had a 19% margin, with 52% of those polled expressing support and only 33% expressing opposition. According to its September poll, 13% of voters remain undecided.\n\nA more recent poll conducted by Mason-Dixon Polling & Research for NBC Universal and Telemundo found \"Yes\" still has a sizable 10% advantage.\n\nLarge partisan differences characterize support and opposition to Proposition 40, with Democrats supporting it by more than three to one, while Republicans are opposed nearly eight to one. The views of non-partisan voters are similar to those of the overall electorate.\n\nWhile \"Yes\" continues to have an edge in the polls, prediction markets see Prop 40 going down to defeat by a wide margin. Both Kalshi and Polymarket have the odds of passage currently at under 30%.", "source": "CNBC Top News", "pub_date_str": "22 Oct 2026, 05:56 PM IST", "pub_date_relative": "39m ago"}, {"title": "Stock Market Today: Stocks Slide After Mideast Tensions, Tesla Earnings \u2014 Live Updates - WSJ", "full_content": "Stock Market Today: Stocks Slide After Mideast Tensions, Tesla Earnings \u2014 Live Updates WSJ Stock index futures fall as Iran tensions weigh on sentiment (SPX:) Seeking Alpha Markets sell off worldwide as further conflict looms in the Middle East and Elon Musk cuts capex guidance Fortune The S&P 500 holds gains despite pushback on an imminent US-Iran deal as hopes stay high ahead of midterms investingLive US Market Open: Iran's Foreign Ministry suggested that the country favous diplomacy, though crude benchmarks continued to move higher; GBP gains post-jobs data Newsquawk", "source": "Google News Business", "pub_date_str": "22 Oct 2026, 05:56 PM IST", "pub_date_relative": "39m ago"}, {"title": "HPCL Q2 Results: Profit slips 6% YoY to Rs 3,625 crore, revenue jumps 26%", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a Earnings \u203a HPCL Q2 Results: Profit slips 6% YoY to Rs 3,625 crore, revenue jumps 26% Hindustan Petroleum Corporation Share Price Indian Oil Corporation Share Price Bharat Petroleum Corporation Share Price The Economic Times daily newspaper is available online now. Read Today's Paper HPCL Q2 Results: Profit slips 6% YoY to Rs 3,625 crore, revenue jumps 26% SECTIONS HPCL Q2 Results: Profit slips 6% YoY to Rs 3,625 crore, revenue jumps 26% By Kumar Gaurav , ETMarkets.com Last Updated: Oct 22, 2026, 05:54:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment est, taxes, depreciation and amortization on $1.8 billion in revenue.\n\nPeacock paid subscribers grew to 48 million, up 17% year over year.\n\nThe streaming platform continued to reap the benefits of record-high viewership for the FIFA World Cup, as the final games played out at the beginning of the quarter and aired on NBCUniversal's Telemundo and on Peacock.\n\nRevenue in Comcast's media division, which includes the streaming service, rose 13% compared with the third quarter last year to $5.4 billion. The overall content and experiences unit, which also includes its film studio and theme parks, saw revenue rise 6.5%.\n\nComcast's connectivity and platforms sector, however, continued to face pressure, with revenue down 2.7% year over year.\n\nThe company reported a net loss in domestic broadband residential customers of 144,000 and a net loss in its cable customers of 274,000 during the period. Its mobile business added 368,000 customers.\n\nAfter years of stagnating growth in broadband and heightened competition from wireless providers like Verizon and T-Mobile, Comcast announced in January 2025 that it would refocus on its mobile business and pursue more competitive pricing plans.", "source": "CNBC Top News", "pub_date_str": "22 Oct 2026, 05:47 PM IST", "pub_date_relative": "47m ago"}, {"title": "Dow Jones| Nasdaq | S&P 500 | US Stock Market Today |Live Updates: Nasdaq futures sink as AI doubts resurface, oil jumps", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a Dow Jones| Nasdaq | S&P 500 | US Stock Market Today |Live Updates: Nasdaq futures sink as AI doubts resurface, oil jumps Powered By LIVE BLOG Dow Jones| Nasdaq | S&P 500 | US Stock Market Today |Live Updates: Nasdaq futures sink as AI doubts resurface, oil jumps 22 Oct 2026 | 06:23:25 PM IST Synopsis US Market | Dow Jones Live Updates: Nasdaq futures fall nearly 2% as renewed doubts over AI spending weigh on growth stocks, with Tesla and Meta sliding after their updates. Oil prices jump on supply disruption fears, while chip stocks and other megacaps also decline, signalling a broader risk-off mood.\n\nComments are moderated and will be allowed if they are about the topic and not abusive.\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Markets", "pub_date_str": "22 Oct 2026, 05:45 PM IST", "pub_date_relative": "49m ago"}, {"title": "A bond is like a party balloon", "full_content": "(Bear with us)", "source": "FT Markets", "pub_date_str": "22 Oct 2026, 05:40 PM IST", "pub_date_relative": "54m ago"}, {"title": "India-EU trade deal could become operational in early-2027, Piyush Goyal says", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a India-EU trade deal could become operational in early-2027, Piyush Goyal says The Economic Times daily newspaper is available online now. Read Today's Paper India-EU trade deal could become operational in early-2027, Piyush Goyal says SECTIONS India-EU trade deal could become operational in early-2027, Piyush Goyal says Reuters Last Updated: Oct 22, 2026, 05:35:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Piyush Goyal, India\u2019s trade minister, has revealed that a free-trade agreement with the European Union is on the horizon, with expectations to finalize it by year's end. Set to become operational within four to five months after signing, this deal aims to improve market access and foster investment collaborations between India and the 27 EU member states.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\nOne company, 2 words. Bond yield and CDS: Will they decide the fate of global markets?\n\nBusiness of Odd Things: Inside an industry that farms fish that nobody is meant to eat\n\nWar's second-order effects are becoming visible in critical sectors\n\nUS mid-term elections \u2013 Part 2: What does it mean for Trump to lose control of Congress?\n\nHomebuyers wait as NCLT panel picks holes in unfinished Jaypee projects\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "22 Oct 2026, 05:35 PM IST", "pub_date_relative": "59m ago"}, {"title": "Small-cap stock shows resilience against stock market crash; experts hint at strong Q2 results 2026 | Should you buy?", "full_content": "Small-cap stock to buy after Q2 Results 2026: The key benchmark indices continue to remain under the selling heat for the third straight session on Thursday. The Nifty 50 index finished 123 points lower at 22,687, the BSE Sensex corrected 460 points and closed at 73,249, while the Bank Nifty index went off 51 points and ended at 54,925. However, some stocks showed resilience against this continuous Indian stock market crash. Recently listed Varmora Granito shares are among them. The small-cap stock with a market cap of around \u20b9 3,000 crore, attracted buying interest on Thursday despite weak trends on Dalal Street and finished 1.60% higher at around \u20b9 135 apiece on the NSE.\n\nAccording to stock market experts, the small-cap stock is attracting buying interest after reporting strong Q2FY27 and H-1FY27 numbers. They said the company is in the tile manufacturing business, which was severely hit by a natural supply gap amid the ongoing Middle East crisis. However, the company came through the supply chain crisis and reported strong numbers. They said that the stock may touch \u20b9 170 once it decisively breaks above the \u20b9 146 hurdle.\n\nHighlighting the reason for resilience shown by the small-cap stock despite weak trends on Dalal Street, Anujm Gupta, a SEBI-registered market analyst, said, \u201cThe company had reported strong Q2 and H-1 earnings on Monday. This was cheered by bulls on Monday, and the stock finished higher, showing resilience against the selling pressure in the key benchmark indices. The company has reported around 500% YoY growth in the net profit in the first half of the recently ended September 2026 quarter. The company's revenue grew both in YoY and Qoq terms.\u201d\n\nOn why these earnings are cheered by Dalal Street bulls, Mahesh M Ojha, VP \u2014 Research and Business Development at KC Securities, said, \u201cThe small-cap company is a tile maker company.", "source": "LiveMint Markets", "pub_date_str": "22 Oct 2026, 05:35 PM IST", "pub_date_relative": "1h ago"}, {"title": "IBM\u2019s stock falls as investors struggle to shake off July earnings miss", "full_content": "Shares in International Business Machines declined 5% in Thursday\u2019s premarket trading as investors digested the company\u2019s third-quarter results.", "source": "MarketWatch Top Stories", "pub_date_str": "22 Oct 2026, 05:34 PM IST", "pub_date_relative": "1h ago"}, {"title": "Top 2 stocks to buy tomorrow: Federal Bank, Indian Hotel by market expert; check stop-loss, target price for Fri, 23 Oct", "full_content": "Stock market news: Indian equities declined for the third consecutive session on Thursday, 21 October as escalating conflict in the Middle East drove oil prices up to $112 a barrel, fuelling inflation concerns for the world's third-largest crude oil importer.\n\nThe Nifty 50 fell 0.54% to 22,687.65, while the Sensex dropped 0.62% to 73,249.39. Broader markets also came under pressure, with the small-cap and mid-cap indices declining 1.1% and 0.9%, respectively.\n\nMarket expert Chandan Taparia has recommended two stocks to buy tomorrow \u2014 Federal Bank and Indian Hotels Company \u2014 with defined target prices and stop-loss levels.\n\nTaparia has recommended buying Indian Hotels Company with a target price of \u20b9 830 and a stop loss of \u20b9 760. For Federal Bank, he has set a target price of \u20b9 368 and a stop loss of \u20b9 336.\n\nOn the Nifty options front, Chandan Taparia, Head Derivatives & Technicals, Wealth Management, Motilal Oswal Financial Services Ltd, said the maximum Call OI is at the 23,000 and 23,200 strikes, while the maximum Put OI is at the 22,600 and 22,500 strikes.\n\n\u201cCall writing is seen at 23,300 then 23,150 strike, while Put writing is seen at 22,650 then 22,600 strike. Option data suggests a broader trading range between 22,400 and 23,200 zones, while an immediate range is between 22,500 and 23,000 levels,\u201d said Taparia.\n\nThe Nifty 50 index opened with a gap-down and witnessed volatile swings throughout the session, remaining confined to a range. Despite sharp movements on either side, the index failed to establish a clear directional trend and formed a long-legged Doji-type candle on the daily frame, reflecting indecision between the bulls and bears.\n\n\u201cNow, till it holds below 22,700, weakness could extend towards 22,550, then 22,400 levels, while on the upside, immediate hurdles can be seen at 22,850, then 22,950 zones,\u201d said Taparia.", "source": "LiveMint Markets", "pub_date_str": "22 Oct 2026, 05:33 PM IST", "pub_date_relative": "1h ago"}, {"title": "Procter & Gamble earnings beat as sales rise 4%, boosted by laundry and home products", "full_content": "Procter & Gamble on Thursday reported quarterly earnings and revenue that beat analysts' expectations, fueled by growing demand for its laundry detergent and home care products.\n\nShares of the company rose more than 2% in premarket trading.\n\nHere's what the company reported compared with what Wall Street was expecting, based on a survey of analysts by LSEG:\n\nP&G reported fiscal first-quarter net income attributable to the company of $4.73 billion, or $1.97 per share, down from $4.75 billion, or $1.95 per share, a year earlier.\n\nExcluding restructuring costs and other items, the company earned $2 per share.\n\nP&G reported volume growth of 2.4%, a strong start for its new fiscal year. Like many consumer companies, P&G has seen demand for its products weaken as shoppers have become more value conscious.\n\nExecutives have previously said that consumers are now using every last drop of shampoo or laundry detergent, and value packs have become more popular. In fiscal 2026, P&G reported just one quarter of volume growth.\n\nP&G is still seeing signs of a bifurcated economy, CFO Andre Schulten said on CNBC's \"Squawk Box\" on Thursday. High-income consumers are willing to trade up to new products, even a $30 shampoo, while low-income consumers are trying to make brands like Tide and Pampers work for their tight budgets.", "source": "CNBC Top News", "pub_date_str": "22 Oct 2026, 05:31 PM IST", "pub_date_relative": "1h ago"}, {"title": "American Express brings Airbnb bookings and rewards to Amex Travel platform", "full_content": "American Express is bringing Airbnb into its travel rewards platform.\n\nThe companies on Thursday announced a new partnership to bring more than 1 million Airbnb listings to Amex's travel portal and allow cardholders to earn rewards when booking the stays. It does not currently allow members to redeem points to pay for Airbnb bookings.\n\nThe launch adds Airbnb rentals to Amex's hotel portfolio, which includes more than 3,400 properties across its Fine Hotels + Resorts and The Hotel Collection programs.\n\nAmex members with either the consumer or business Platinum card can also now apply their $600 annual lodging credit \u2014 previously called the hotel credit \u2014 to Airbnb's higher-end Luxe stays and take advantage of a new $250 statement credit on eligible Airbnb Experiences after making a Luxe booking.\n\n\"We're excited to bring more choice and flexibility to American Express Card Members with this exclusive partnership. Both of our companies exist to help people travel more and better, and this partnership helps people see more of the world by making travel more rewarding,\" said Juan David Borrero, head of partnerships at Airbnb, in a news release.\n\nThe changes come as competition among premium credit cards continues to ramp up.\n\nLast year, American Express raised the annual fee on its premium Platinum card to $895. In turn, it's been investing in cardholder perks such as new lounges in airports and at big-ticket events and experiences as a way to attract more high-paying customers.\n\nEarlier this month, it announced an expansion of its Centurion Lounges , with renovations coming to four existing lounges and new ones planned for Newark Liberty International Airport and London Heathrow Airport. The Newark lounge will be the largest in its network.", "source": "CNBC Top News", "pub_date_str": "22 Oct 2026, 05:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "Why this JPMorgan strategist thinks the stock market\u2019s tailspin might have run its course", "full_content": "Hedge fund positioning has lightened considerably since its recent September peak, and JPMorgan strategists deduce from this that downside for stocks is now limited.", "source": "MarketWatch Top Stories", "pub_date_str": "22 Oct 2026, 05:27 PM IST", "pub_date_relative": "1h ago"}, {"title": "American Airlines forecasts bigger loss in 2026 on fuel spike, plans to slow growth next year", "full_content": "American Airlines forecast deeper losses this year as record revenue failed to help the airline recover from this year's spike in fuel costs. The carrier plans to slow its capacity growth next year as a result.\n\nAmerican on Thursday said it expects to lose between $1 and $1.60 a share, on an adjusted basis for the full year. In July, it forecast earnings of up to 65 cents a share to a loss of as low as 65 cents a share.\n\n\"American delivered record third-quarter revenue and the strongest year-over-year revenue growth in my career, with premium performance leading the way,\" American CEO Robert Isom said in a news release. \"The investments we are making across the four pillars of our commercial strategy are working, and we expect another quarter of record revenue growth to close out the year.\"\n\nThe Fort Worth, Texas-based airline is the fourth major U.S. carrier to cut its forecast for 2026 due to a jump in jet fuel following the start of the Iran war. Rising jet fuel prices have also driven up airfare more than 20% from last year. Delta Air Lines , United Airlines , and Southwest Airlines also slashed their outlooks this month.\n\nJet fuel is airlines' biggest cost after labor, and the spike has added billions to costs this year. American's fuel bill was up 67.5% in the third quarter from last year to $4.64 billion.\n\nAmerican forecast it will lose between 50 cents and $1.10 a share, adjusted, in the fourth quarter, with revenue expected to be up as much as 22.5% from a year earlier and capacity up between 5.5% and 6.5%.\n\nHere is what American reported in the third quarter compared with Wall Street estimates compiled by LSEG:\n\nFor the third quarter, American had a net loss of $269 million or 41 cents a share, compared with $114 million, or 17 cents a share, a year earlier. Adjusting for one-time items, American reported a loss of 28 cents a share. Revenue jumped 19.3% from a year earlier to $16.34 billion.", "source": "CNBC Top News", "pub_date_str": "22 Oct 2026, 05:26 PM IST", "pub_date_relative": "1h ago"}, {"title": "Sebi eases margin rules for trades post EPI", "full_content": "Mumbai: The Securities and Exchange Board of India (Sebi) has waived margin requirements for trades using proceeds from sales under the early pay-in (EPI) mechanism, a move aimed at easing margin-funding requirements.\n\nIn a circular issued on Thursday, the capital markets regulator said clearing corporations must, in real time, refrain from collecting margin from trading members and clearing members on subsequent positions taken by clients, up to the value of EPI accepted by the clearing corporation.\n\nThe framework applies where a client has a net sell obligation in a settlement, and the clearing corporation has successfully accepted the EPI request for the securities sold.\n\nMint was the first to report in July that Sebi \u2019s risk management review committee (RMRC) was discussing a waiver of margin for trades made from proceeds from the same-day stock sale under EPI.\n\nEPI refers to delivering the shares you have sold to the stock market\u2019s clearing corporation before the normal settlement deadline. For example, if you sell shares worth \u20b9 1 lakh and deliver them early through EPI, the accepted value of those shares can be used to meet margin requirements for other trades.\n\nUnder Sebi\u2019s new circular, the clearing corporation will not collect margin from your broker on eligible subsequent buy or sell positions up to the accepted EPI value. This reduces the need for brokers to use their own funds to provide that margin, while normal margin requirements and risk controls continue to apply wherever the relief does not cover them.\n\nUnder the current framework, when an investor sells shares already held in the demat account through the EPI mechanism, the trade is cleared by the clearing corporation on the trade day itself, eliminating settlement risk.", "source": "LiveMint Markets", "pub_date_str": "22 Oct 2026, 05:22 PM IST", "pub_date_relative": "1h ago"}, {"title": "Market wrap: Bajaj Finance, Cipla, Nestle India, Eternal top gainers and losers on Nifty and Sensex on Thursday", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Market wrap: Bajaj Finance, Cipla, Nestle India, Eternal top gainers and losers on Nifty and Sensex on Thursday BSE Share Price Multi Commodity Exchange of India Share Price Indian Energy Exchange Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Market wrap: Bajaj Finance, Cipla, Nestle India, Eternal top gainers and losers on Nifty and Sensex on Thursday SECTIONS Market wrap: Bajaj Finance, Cipla, Nestle India, Eternal top gainers and losers on Nifty and Sensex on Thursday By Kumar Gaurav , ETMarkets.com Last Updated: Oct 22, 2026, 05:22:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Indian equity markets fell for a third consecutive session as weak global cues and sustained selling weighed on sentiment. The Nifty 50 declined 0.54% to 22,688, while the Sensex dropped 0.62% to 73,249.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "22 Oct 2026, 05:22 PM IST", "pub_date_relative": "1h ago"}, {"title": "Sellers are back in tech, while bear market grips Chinese stocks", "full_content": "This is CNBC's Morning Squawk newsletter. Subscribe here to receive future editions in your inbox.\n\nHello, this is Leonie Kidd with today's edition of Morning Squawk.\n\nThe pickup in volume during super early trading has been overwhelmingly to the downside.\n\nFutures are worse, Asia closed deep in the red, and Europe is also broadly lower.\n\nFutures are steadily declining this morning, with chip stocks once again under pressure.\n\nThe earnings handover from Wall Street was mixed, but investors seem more hung up on Tesla's disappointing forecasts than Meta's beat.\n\nTesla round-up: Better-than-expected third-quarter results are failing to support Tesla shares, with the stock falling in premarket trading. Lower average car sales prices and a battery supply crunch weighed on revenues.\n\nMusk also warned the group is \"not going to move the needle\" on its Robotaxi fleet this quarter.", "source": "CNBC World Economy", "pub_date_str": "22 Oct 2026, 05:20 PM IST", "pub_date_relative": "1h ago"}, {"title": "Global Rush to Fix Security Flaw Uncovered by A.I. Leaves Sites Offline - The New York Times", "full_content": "Global Rush to Fix Security Flaw Uncovered by A.I. Leaves Sites Offline The New York Times Websites shut down globally after AI finds cybersecurity flaw affecting 70% of the internet CNN PHP2Shell: AI uncovers critical RCE vulnerabilities affecting 70% of the Internet wiz.io Millions of hacking attempts as companies, governments rush to patch PHP flaws Reuters MSUFCU takes e-banking services offline after NSA issues warning Lansing State Journal", "source": "Google News Business", "pub_date_str": "22 Oct 2026, 05:18 PM IST", "pub_date_relative": "1h ago"}, {"title": "Need \u20b910 lakh emergency fund? How to split your money between savings accounts, FDs and mutual fund? Plan by experts", "full_content": "An emergency fund of \u20b9 10 lakh can provide financial support during a job loss, medical emergency or an unexpected household expense. However, keeping the entire amount in a savings account may mean earning relatively low interest, while locking it all into fixed deposits or mutual funds could make accessing the money less convenient when it is urgently needed.\n\nThe challenge is to balance three priorities: liquidity, capital safety and returns. Financial experts say an emergency fund should be divided according to how quickly the money might be required, rather than invested entirely in the instrument offering the highest returns.\n\nFor someone with a \u20b9 10 lakh emergency fund, one possible allocation is \u20b9 2 lakh in a savings account, \u20b9 4 lakh in liquid mutual funds and \u20b9 4 lakh in fixed deposits, preferably staggered across different maturities.\n\nRhishabh Garg, CEO of FundsIndia.com, suggests this allocation. According to him, the savings account should ideally cover one to two months of expenses, while the remaining amount can be divided between FDs and liquid funds depending on the individual's preference for certainty or flexibility.\n\nAnother approach is to keep \u20b9 1.5 lakh in a savings account, \u20b9 4.5 lakh in liquid mutual funds and the remaining \u20b9 4 lakh in an ultra-short duration debt fund.\n\nSandeep Jethwani, co-founder of Dezerv, recommends this allocation based on how quickly each portion of the money might be required. The savings account can cover immediate expenses, such as an emergency hospital admission, while liquid funds provide access to additional money.\n\nThe ultra-short duration fund holds the portion that is less likely to be needed during the first month, although returns are market-linked and not guaranteed.\n\nThe three options differ significantly in how quickly investors can access their money.", "source": "LiveMint Money", "pub_date_str": "22 Oct 2026, 05:17 PM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "Global stocks tumble as oil prices rise", "full_content": "Crude prices jump 3.5% while Eurozone bond sell-off deepens", "source": "FT Markets", "pub_date_str": "22 Oct 2026, 06:33 PM IST", "pub_date_relative": "1m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Badger Meter earnings beat by $0.01, revenue fell short of estimates", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Oct 2026, 06:25 PM IST", "pub_date_relative": "9m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Why is Direxion Daily Semiconductor Bull 3X Shares ETF tumbling today?", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Oct 2026, 06:24 PM IST", "pub_date_relative": "10m ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Earnings call transcript: Curbline Properties raises Q3 2026 outlook as shares rise", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Oct 2026, 06:24 PM IST", "pub_date_relative": "11m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "France protests: Macron condemns 'stupid' comments from Trump, others as bond market pressure builds", "full_content": "French President Emmanuel Macron has criticized \"unacceptable\" and \"stupid\" comments made by foreign leaders and others after the country saw mass protests and its worst rioting in years.\n\n\"There was foreign disinformation in the aftermath, which prompted comments that were as unacceptable as they were stupid from many people, including foreign leaders,\" Macron told reporters on Wednesday, according to Reuters .\n\nMacron clarified he was talking about U.S. President Donald Trump \"among others,\" and said politicians were using the situation in France for their own ends.\n\nPosting on his Truth social platform, Trump earlier this week blamed the unrest on \"migrants, jihadists, and Communists\" and told Europe to close its borders.\n\nTrump and other Republicans, including Vice President JD Vance and House Speaker Mike Johnson , have referenced the unrest in France on the campaign trail ahead of the upcoming U.S. midterms . They have claimed that Democrat policies on immigration would raise similar tensions.\n\nPolitical sparring has extended to government agencies. U.S. Immigration and Customs Enforcement (ICE) wrote on X on Wednesday that it was \"fighting to prevent American streets from looking like this.\" The post included footage that appeared to reference rioters in France.\n\nThe French Ministry for Europe and Foreign Affairs responded on its own X account that it was \"fighting to prevent French stats from looking like this,\" showing a graphic displaying the gulf in U.S. firearm homicides per 100,000 people over G7 peers.\n\nOfficials in Iran \u2014 where rights groups say authorities killed hundreds of people during a crackdown on recent demonstrations \u2014 have also weighed in, with Foreign Minister Seyed Abbas Araghchi calling on Macron to listen to the protesters' demands.", "source": "CNBC Top News", "pub_date_str": "22 Oct 2026, 06:22 PM IST", "pub_date_relative": "12m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Brent crude near $112 as U.S. and Israel reportedly weigh fresh Iran strikes", "full_content": "Oil prices climbed Thursday on worries over a possible escalation in the Middle East conflict as the U.S. reportedly plans to resume strikes against Iran.\n\nBrent crude futures rose 2.7% to $111.80 a barrel as of 8:39 a.m. ET, while U.S. West Texas Intermediate crude gained 2.21% to $99.30.\n\nThe U.S. and Israeli militaries have drawn up specific plans for renewed strikes on Iran after next month's midterm elections, unnamed U.S. officials told The New York Times . Planning for a \"short but intensive\" operation is progressing, the officials said.\n\nThe U.S. has also ordered non-emergency government employees and their families to leave Saudi Arabia.\n\nState Department spokesman Tommy Pigott in a post on X said the order applies only to Saudi Arabia, dismissing reports that the U.S. had directed some staff in the wider Gulf region to leave. He pointed to escalating attacks by Iran-aligned Houthis on civilian targets in Saudi Arabia.\n\nThe economic fallout from elevated oil prices, however, may be less severe than in previous decades, as consumers have become less vulnerable to energy shocks, according to David Wagner, head of equity and portfolio manager at Aptus Capital Advisors.\n\n\"$100 oil today is very different than $100 oil, you know, 20, 30 years ago,\" Wagner said, noting that crude prices remain well below their inflation-adjusted historical highs.\n\nHe pointed to U.S. government data showing that gasoline accounted for roughly 5% of the average American's disposable income a decade ago, compared with about half that today, suggesting households may be better positioned to withstand elevated energy costs.", "source": "CNBC Top News", "pub_date_str": "22 Oct 2026, 06:21 PM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Economics", "Derivatives", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Earnings call transcript: Allegion tops Q3 2026 estimates as shares jump premarket", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Oct 2026, 06:21 PM IST", "pub_date_relative": "14m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Post Office vs FD vs Arbitrage Fund: Which one offers best post-tax returns? Compare risk and liquidity before investing", "full_content": "A post office time deposit offering 6.9% interest may appear more attractive than a bank fixed deposit (FD) offering 6.25%. But what if an arbitrage mutual fund delivering a slightly lower return leaves investors with more money after taxes? The answer depends largely on the investor's income tax bracket and how long the money remains invested.\n\nFor investors looking to park \u20b9 5 lakh for a year or longer, the difference in post-tax earnings can be substantial. While post office deposits and bank FDs offer predictable returns, arbitrage funds enjoy relatively favourable tax treatment when held for more than 12 months.\n\nUttam Agarwal, Chief Business Officer, Bajaj Capital - La Premi\u00e8r, explains how the three options compare on returns, taxation , liquidity and risk, and why the investment offering the highest post-tax return may not necessarily be the most suitable choice.\n\nThe biggest difference between these instruments lies in how their earnings are taxed.\n\nInterest from post office deposits and bank FDs is added to the investor's taxable income and taxed at the applicable slab rate. This means investors in higher tax brackets retain a smaller portion of their interest earnings.\n\nArbitrage funds, which qualify for equity-oriented mutual fund taxation, are treated differently. Gains on units held for up to 12 months attract short-term capital gains tax of 20%. For holdings exceeding 12 months, long-term capital gains above \u20b9 1.25 lakh in a financial year are taxed at 12.5%.\n\n\"When it comes down to how much of the return you get to keep,\" the tax treatment becomes crucial, Agarwal explained.\n\nFor illustration, he considered a one-year post office deposit offering 6.9%, a bank FD offering around 6.25%, and an arbitrage fund generating an assumed annual return of 6.5%.", "source": "LiveMint Money", "pub_date_str": "22 Oct 2026, 06:18 PM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Financial Statement Analysis", "Derivatives", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Critical PHP web security flaws spark global alarm as Google, OpenAI and Amazon respond", "full_content": "The tech world is racing to implement fixes after the discovery of critical security vulnerabilities in software used to power much of the internet.\n\nThe software, known as PHP, is an open-source programming language widely used to power websites and web applications. The discovery of the flaws prompted urgent warnings from governments worldwide, while tech giants including Google, OpenAI and Amazon have been involved in efforts to uncover the vulnerabilities, detect potential attacks and protect affected systems.\n\nThe two vulnerabilities, collectively known as \"PHP2Shell,\" could allow hackers to remotely execute malicious code on affected servers, potentially exposing sensitive data, according to cybersecurity researchers. While not every website using PHP is necessarily vulnerable, the software's widespread use has raised concerns about the potential scale of attacks.\n\nThe U.S. National Security Agency on Wednesday urged organizations using PHP to prepare security updates addressing the vulnerabilities, warning that the flaws could provide attackers with direct access to server file systems and databases. The agency recommended taking affected systems offline until the vulnerabilities are fully addressed if immediate updates are not possible.\n\nThe Federal Bureau of Investigation also warned that malicious actors could exploit the vulnerabilities to execute code remotely, putting sensitive data and networks at risk.\n\nCybersecurity authorities in Singapore , the United Kingdom , Australia , Canada and the European Union have issued similar alerts, underscoring concerns about the potential impact on businesses, government agencies and other organizations that rely on PHP-based systems.\n\nAmazon said its threat intelligence team had detected attempts to exploit the vulnerabilities before they were publicly disclosed, using its MadPot threat detection system, which monitors suspicious activity across internet-facing infrastructure.", "source": "CNBC World Economy", "pub_date_str": "22 Oct 2026, 06:16 PM IST", "pub_date_relative": "19m ago", "cfa_topics": ["Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Southwest Airlines cuts 2026 profit forecast on higher fuel", "full_content": "Southwest Airlines became the third major U.S. airline this month to cut its 2026 profit forecast due to higher fuel prices, but CEO Bob Jordan said travelers continue to book despite higher fares.\n\nThe carrier expects to earn between $2.60 and $2.85 a share on an adjusted basis this year, down from its forecast in July of between $3.25 to as much as $4.25 a share.\n\nHere's what Southwest reported for third quarter compared with Wall Street expectations, according to consensus estimates from LSEG:\n\nSouthwest forecast per-share adjusted earnings of between 55 cents and 80 cents in the fourth quarter and unit revenue, a gauge of airfare, up as much as 21% from a year earlier. It said it expects to grow capacity by up to 4% year over year.\n\n\"Demand remained strong as we lapped last year's bag fee and other commercial initiatives, reinforcing our belief that the earnings power we've built is durable, even with significantly higher fuel costs,\" Jordan said in an earnings release.\n\nThe airline said its average passenger fare was $231.69 in the third quarter, up almost 27% from the same quarter of 2025. A spokesman said that number does not include add-on fees. The number of revenue passengers carried fell 3.2% to 33.47 million people.\n\nBut Jordan told CNBC's Phil LeBeau that demand was strong across every geography and product.\n\n\"The consumer is incredibly strong and we do not see that abating,\" Jordan said. \"We're seeing strength in both the holiday period and the non-holiday period.\"", "source": "CNBC Top News", "pub_date_str": "22 Oct 2026, 06:12 PM IST",
