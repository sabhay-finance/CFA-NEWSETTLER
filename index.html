s", "pub_date_str": "29 Aug 2026, 12:01 PM IST", "pub_date_relative": "56m ago"}, {"title": "Randy Shefman, Royal Gold SVP, sells $131,400 in common stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "29 Aug 2026, 12:00 PM IST", "pub_date_relative": "56m ago"}, {"title": "8th Pay Commission delay could cost lower-ranked staff up to \u20b93.45 lakh in lost HRA and transport allowance", "full_content": "The 8th Pay Commission panel is tentatively expected to submit its final report to the central government by May-June 2027. Once the final report is submitted, the government will decide on pay revisions, allowances, and pension reforms for serving and retired government servants.\n\nNow, in case the 8th Pay Commission\u2019s rollout drags on, the central government employees are going to brace for a financial hit. While they are tentatively set to be paid from January 1, 2026, history shows that these are generally confined to basic pay alone.\n\nProminent allowances such as dearness allowance (DA), house rent allowance (HRA), and transport allowance (TPTA) rarely get backdated. This is an important distinction, as for lower and mid-level working staff, these allowances make up a meaningful chunk of their monthly earnings.\n\nThis is because the dearness allowance (DA) is revised every six months to help serving employees cope with rising inflation and lifestyle costs, regardless of whether a pay commission is active. That is why there is no \u2018gap\u2019 left to compensate for.\n\nHRAs pegged at 24%, 16%, and 8% of basic pay, primarily depending on the city category, rise only once DA crosses certain thresholds, as it did in January 2024. TPTA, on the other hand, is a fixed sum tied to DA and gets revised with every new pay commission. For these reasons, none of the three generally qualify for retroactive payment, unlike basic pay.\n\nThe 8th Pay Commission was constituted on 3 November 2025. Since then, it has been given an 18-month window ": "24m ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Buy or sell stocks: Sumeet Bagadia recommends three shares to buy on Monday \u2014 31 August 2026", "full_content": "Buy or sell stocks for 31 August 2026: The Indian stock market ended the week on a cautious note, extending their recent corrective phase as concerns over global interest rates, geopolitical uncertainty, and volatility surrounding the new Closing Auction Session weighed on investor sentiment. Although markets recovered sharply on Friday, supported by strong buying in IT stocks following upbeat global technology cues, the benchmark indices remained under pressure for the third consecutive week.\n\nFor the week, the Nifty 50 index declined around 0.31% to close at 24,175.65, while the Sensex fell nearly 0.36% to settle at 77,264.51. In contrast, the broader market remained relatively resilient, with the Midcap and Smallcap indices gaining around 0.52% and 0.51%.\n\nSumeet Bagadia, Executive Director at Choice Broking, believes Indian stock market sentiment is cautious to positive as long as the Nifty 50 index trades above 23,900. He said that Nifty has an existing base at the 50-DEMA level (24,050) and the next strong base is in the 23,850-23,900 range. The Choice Broking expert predicted sharp selling pressure if the 50-stock index breaks decisively below 23,800.\n\nRegarding stocks to buy on Monday , Sumeet Bagadia recommended three shares to buy-or-sell on Monday: TCS, Axis Bank, and Bajaj Auto.\n\nTCS share price is showing signs of consolidation after a recent recovery, with the stock currently trading around \u20b9 2,342. The recent rally faced resistance near the 100-day EMA at \u20b9 2,361.60, where selling pressure emerged, keeping the stock below this key level.\n\nAxis Bank's share price is attempting to stabilise after a significant pullback from its recent highs, currently trading around \u20b9 1,265.", "source": "LiveMint Markets", "pub_date_str": "29 Aug 2026, 12:32 PM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "F&O Talk: Traders should maintain caution amid CAS volatility, says Sudeep Shah; picks 6 stocks for next week", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Expert Views \u203a F&O Talk: Traders should maintain caution amid CAS volatility, says Sudeep Shah; picks 6 stocks for next week The Economic Times daily newspaper is available online now. Read Today's Paper F&O Talk: Traders should maintain caution amid CAS volatility, says Sudeep Shah; picks 6 stocks for next week SECTIONS F&O Talk: Traders should maintain caution amid CAS volatility, says Sudeep Shah; picks 6 stocks for next week By Veer Sharma , ETMarkets.com Last Updated: Aug 29, 2026, 12:35:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Indian stock market ended higher on Friday, but heightened volatility and sharp index divergences amid the Closing Auction Session (CAS) have kept traders cautious. Technical analyst Sudeep Shah expects Nifty and Sensex to remain range-bound, while highlighting key support and resistance levels and identifying six stocks that could outperform in the coming week.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "29 Aug 2026, 12:32 PM IST", "pub_date_relative": "25m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Bethlehem Kudumba Unit Box Office Collection Day 8: Nivin Pauly Starrer Sees Growth, Check Earnings", "full_content": "After a strong first week, 'Bethlehem Kudumba Unit' saw a 9.1% jump on Day 8, pushing its India net collection to Rs 61.85 crore and gross to Rs 72.15 crore.", "source": "NDTV Profit", "pub_date_str": "29 Aug 2026, 12:11 PM IST", "pub_date_relative": "46m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Randy Shefman, Royal Gold SVP, sells $131,400 in common stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "29 Aug 2026, 12:00 PM IST", "pub_date_relative": "56m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "8th Pay Commission delay could cost lower-ranked staff up to \u20b93.45 lakh in lost HRA and transport allowance", "full_content": "The 8th Pay Commission panel is tentatively expected to submit its final report to the central government by May-June 2027. Once the final report is submitted, the government will decide on pay revisions, allowances, and pension reforms for serving and retired government servants.\n\nNow, in case the 8th Pay Commission\u2019s rollout drags on, the central government employees are going to brace for a financial hit. While they are tentatively set to be paid from January 1, 2026, history shows that these are generally confined to basic pay alone.\n\nProminent allowances such as dearness allowance (DA), house rent allowance (HRA), and transport allowance (TPTA) rarely get backdated. This is an important distinction, as for lower and mid-level working staff, these allowances make up a meaningful chunk of their monthly earnings.\n\nThis is because the dearness allowance (DA) is revised every six months to help serving employees cope with rising inflation and lifestyle costs, regardless of whether a pay commission is active. That is why there is no \u2018gap\u2019 left to compensate for.\n\nHRAs pegged at 24%, 16%, and 8% of basic pay, primarily depending on the city category, rise only once DA crosses certain thresholds, as it did in January 2024. TPTA, on the other hand, is a fixed sum tied to DA and gets revised with every new pay commission. For these reasons, none of the three generally qualify for retroactive payment, unlike basic pay.\n\nThe 8th Pay Commission was constituted on 3 November 2025. Since then, it has been given an 18-month window from the November 2025 terms of reference to submit its final recommendations.", "source": "LiveMint Money", "pub_date_str": "29 Aug 2026, 11:59 AM IST", "pub_date_relative": "58m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "IPO fever grips D-Street: 3 issues to open for subscription; 8 new listings lined up for next week", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a IPO fever grips D-Street: 3 issues to open for subscription; 8 new listings lined up for next week Unimech Aeros on Telegram.", "source": "Economic Times Markets", "pub_date_str": "29 Aug 2026, 11:16 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Derivatives", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Expert view: FPIs turn positive on India | OmniScience Capital CEO sees non-AI diversification boosting inflows", "full_content": "Expert view: As foreign portfolio investors (FPIs) have turned net buyers of Indian equities since July this year, Vikas Gupta, CEO and Strategist at OmniScience Capital, believes non-AI diversification could drive more FPI inflows to India. In an interview with Mint, Gupta said a spike in inflation will prompt the US Federal Reserve to hike rates, but the most likely course for the US Fed is to hold rates steady, given the balance between job growth and inflation. Edited excerpts:\n\nBased on the consistent July and August inflows, it looks like the beginning of a sentiment turnaround for FPIs . Most likely, this could be an initial exploration of allocating to the non-AI assets to balance or hedge their portfolios.\n\nIn the emerging market index, Taiwan and South Korea have higher allocations compared to their long-term weights. Even if that continues, India is likely to start getting more allocations from the non-AI diversification allocations.\n\nIf inflation spikes in the US, the interest rates are bound to increase. However, it is not a given. CPI/PCE seem to be stabilising, but remains above 3%, significantly above the Fed's 2% mandate.\n\nThe jobs data also show a decline in payrolls, which biases the market towards a rate cut. Given the balancing between job growth and inflation, the most likely course for the Fed is to hold the rates steady.\n\nThe Japanese central bank has to raise interest rates to safeguard and bolster the currency and avoid further import-driven inflation from oil and food imports.\n\nThe US is also trying to cooperate with Japan in its endeavour. However, the global energy, commodities, and food situation appears inflationary in the near term due to the various wars disrupting global trade.\n\nFurther, the huge AI capex also seems to be boosting the cost of capital. Finally, the pace of US Government debt at $1 trillion per quarter, which is pushing it toward $40 trillion, is also alarming bond markets.", "source": "LiveMint Markets", "pub_date_str": "29 Aug 2026, 11:10 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Corporate Issuers", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Stocks to buy under \u20b9100: Vaishali Parekh recommends three stocks to buy or sell", "full_content": "Stocks to buy under \u20b9 100: The key benchmark of the Indian stock market remained volatile during the week and continued to trade within a broadly range-bound structure. The Nifty 50 extended its losing streak to three consecutive weeks. Market sentiment remained cautious amid elevated geopolitical uncertainty, fluctuations in crude oil prices and concerns surrounding the US monetary policy outlook. Although the IT sector provided strong support towards the end of the week following robust Nvidia earnings, weakness in several large-cap stocks limited the broader recovery.\n\nInstitutional flows remained mixed during the week, with FIIs turning aggressive sellers on Friday and recording net outflows of around \u20b9 5,040 crore. However, the selling pressure was largely countered by strong DII participation, with domestic institutions recording purchases of approximately \u20b9 5,184 crore, providing a cushion to the market.\n\nOn a month-to-date (MTD) basis, FIIs continue to remain marginal net buyers at around \u20b9 454 crore, marking a notable shift after several months of sustained foreign selling. Meanwhile, DIIs have maintained strong buying momentum, with MTD inflows of approximately \u20b9 79,620 crore. The continued strength in domestic institutional participation remains an important stabilising factor and has helped limit the impact of foreign selling and prevent a sharper decline in the broader market.\n\nVaishali Parekh, Vice President \u2014 Technical Research at Prabhudas Lilladher, believes the Indian stock market bias is cautiously positive.", "source": "LiveMint Markets", "pub_date_str": "29 Aug 2026, 11:05 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Concurrent Gainers: 13 smallcap stocks that gain for 5 days in a row, surge up to 45%", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News Concurrent Gainers: 13 smallcap stocks that gain for 5 days in a row, surge up to 45% Written by Ritesh Presswala , ETMarkets.com | Aug 29, 2026, 11:33:25 AM IST 1 / 14 Consistent gainers Over the five trading sessions ending August 28, the Sensex benchmark declined 0.36%, or 276 points, to close at 77,264, falling in three of the five sessions. Despite the broader market decline, around 35 stocks from the BSE SmallCap index advanced in each of the five consecutive sessions between August 24 and 28. Of these, 13 smallcap stocks posted gains on all five days, delivering cumulative returns of between 10% and 45% during the period. (Data Source: ACE Equity)", "source": "Economic Times Markets", "pub_date_str": "29 Aug 2026, 10:57 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note"     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
