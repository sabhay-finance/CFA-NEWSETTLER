<script>

    const allData = {"general": [{"title": "The wages of American workers are under pressure. AI's potential role is drawing more attention", "full_content": "Job growth beat expectations in August, but wage growth has lagged the latest inflation readings, adding urgency to a question economists are only beginning to wrestle with: Could AI pressure workers' pay before it costs them their jobs?\n\nThe latest nonfarm payrolls report isn't the only source of government data showing deceleration in wage growth. The Bureau of Labor Statistics' Employment Cost Index showed that inflation-adjusted wages and salaries decreased 0.4 percent year over year through June. And there is also a concerning longer-term trend in the national data: labor's share of nonfarm business output/income was 52.8% in the second quarter of 2026, the lowest in the series beginning in the first quarter of 1947, according to the BLS productivity report . Some researchers are attributing that to decades of automation , which AI may accelerate.\n\nThere are reasons to avoid a rush to judgment. For one, the wage growth of the Covid era was atypical and reflected an extremely tight labor market, with the current level of wage gains closer to the recent historical norm. Higher pay sectors, such as tech and professional services, are also losing jobs while lower-pay sectors such as hospitality and health care have been leading job gains, which pushes down the average pay.\n\nBut the current labor market situation is leading more people to focus on the job earnings growth trend line rather than dire warnings like the recent one from Bill Gates about widespread job losses. What's been learned to date can't answer this question with authority, but it is moving the topic into a more central place in the AI jobs impact debate.\n\nA recent study from Apollo Global Management's chief economist Torsten Slok and his co-author Sania Edlich offers some evidence consistent with AI contributing to slower wage growth.", "source": "CNBC World Economy", "pub_date_str": "13 Sep 2026, 07:01 PM IST", "pub_date_relative": "just now"}, {"title": "I'm a psychologist who studies couples: Emotionally intelligent partners ask 1 question every morning\u2014that most neglect", "full_content": "A few years ago, I started paying closer attention to how couples talk to each other in the mornings. Not during fights or hard conversations, but in the ordinary 10-minute window they might get to chat between waking up and leaving the house.\n\nAs a psychologist who studies couples, I know that most of what happens during those sometimes chaotic moments has to do with logistics: \"Who's getting the kids from art class and soccer practice?\" \"What time is dinner?\" \"Did you move the car?\"\n\nSome might go beyond logistics to ask: \"How'd you sleep?\" \"How are you feeling?\" These are all good, useful questions, and couples who ask them are usually doing fine.\n\nBut some couples add one more type of question I call a \"capacity check.\" Over time, I've come to believe it might be the most useful and thoughtful question to ask in the morning \u2014 one that demonstrates emotional intelligence and builds stronger relationships.\n\nSome couples put a number on it: \"I'm about a 60 today, where are you?\" Others might ask: \"Is today a light one or a heavy one?\" or \"How's your tank?\" I know partners who describe their days as weather or ask each other what season they're in.\n\nThe wording doesn't matter much. What's consistent and important is the underlying question: \"How much do you have available today, and what should I expect from you?\"\n\nThe ubiquitous \" How are you? \" asks a person to summarize their entire internal state on the spot, which is genuinely difficult. Most of us fall back on \"fine,\" not because we're hiding something, but because assembling a real answer can take more time and headspace than we have at 7:40 a.m.\n\nA capacity check is easier \u2014 and rituals stick when they're easy. Almost everyone knows, without much reflection, how much energy they have today, whether the gauge reads 40 or 80. So the question gets a true answer, quickly, without a heavy emotional excavation.", "source": "CNBC Top News", "pub_date_str": "13 Sep 2026, 07:00 PM IST", "pub_date_relative": "2m ago"}, {"title": "Saudi Oil Shock: Pipeline Outage Risks 4% Of Supply Worldwide, Says Report", "full_content": "Saudi Arabia has been using the East-West pipeline to reroute around 4 million barrels of oil per day to the port of Yanbu on the Red Sea. That volume is equivalent to around 4% of global oil supply.", "source": "NDTV Profit", "pub_date_str": "13 Sep 2026, 06:48 PM IST", "pub_date_relative": "14m ago"}, {"title": "I want to pay for every customer at my late husband\u2019s favorite restaurant on his birthday. Could this backfire?", "full_content": "\u201cI\u2019m concerned that my card issuers might freeze or flag the cards when they suddenly see an extraordinary number of transactions.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "13 Sep 2026, 06:45 PM IST", "pub_date_relative": "17m ago"}, {"title": "Vodafone Idea shares up over 60% in 6 months \u2014 Will stock soar more? Guide for stock market investors", "full_content": "Vodafone Idea shares have been on an uptrend since the start of the new financial year 2026-2027. In FY 27, Vodafone Idea share price has risen from \u20b9 8.53 to \u20b9 14.96 per share on the NSE, delivering around 75% return to its shareholders. In the last six months, Vodafone Idea shares have risen over 60%, rising from \u20b9 9.27 to \u20b9 14.96 per share.\n\nAccording to stock market experts, Vodafone Idea's share price is zooming after the Government of India's (GoI) strong support, with its AGR dues converted into equity. Apart from this, relief on spectrum payout caps is another fundamental development that fueled confidence among bulls in Vodafone Idea shares. They said the Vodafone Idea share price has strong resistance at \u20b9 17. On breaking above this hurdle, the telecom stock may test another resistance at \u20b9 21.\n\nSpeaking on the triggers that are fueling Vodafone Idea shares, Avinash Gorakshkar, Founder at Avinash Mentor Research, said, \u201cThe market got an idea about the strong backing from the government when Vodafone Idea's AGR dues were adjusted by the GoI after conversion of the dues into equity. This formed the GoI as the single largest shareholder of the company.\u201d\n\nAvinash Gorakshkar said Vodafone Idea received another relief from the government when its previous spectrum payout was capped, reducing short-term pressure on the company's cash flow. This led to a YoY reduction in the Q1FY27 net loss, and its ARPU also improved to \u20b9 195. Gorakshkar said that such developments fueled investor confidence, and bulls started buying the dip in Vodafone Idea shares whenever the telecom stock fell sharply.\n\nWhat technical chart of the Vodafone Idea share signals, Anuj Gupta, a SEBI-registered market expert, said, \u201cVodafone Idea share is looking positive on the technical chart. The stock is facing a hurdle at \u20b9 17.", "source": "LiveMint Markets", "pub_date_str": "13 Sep 2026, 06:41 PM IST", "pub_date_relative": "21m ago"}, {"title": "Man United vs Man City Live Streaming: Likely Lineups; How To Watch Premier League Match On TV, Online?", "full_content": "The upcoming Premier League contest will be televised live in India on the Star Sports Network television channels.", "source": "NDTV Profit", "pub_date_str": "13 Sep 2026, 06:39 PM IST", "pub_date_relative": "23m ago"}, {"title": "Anuparna Roy's 'Lovers in the Blue Night' Wins NETPAC Award At Venice Film Festival", "full_content": "'Lovers in the Blue Night' competed in Venice's Orizzonti Competition, the festival's second-most important section, alongside 14 other films.", "source": "NDTV Profit", "pub_date_str": "13 Sep 2026, 06:33 PM IST", "pub_date_relative": "28m ago"}, {"title": "How to get a personal loan with bad credit (and the lenders that will approve you)", "full_content": "It's much harder to qualify for personal loans, mortgages, credit cards and other financial products with bad credit. Lenders use your three-digit credit score to determine how likely you are to make on-time, regular payments. The higher your score, the more likely you are to be approved.\n\nBut if you have weak credit, it doesn't mean you don't have options.\n\nFind out what qualifies as bad credit, where you can get a loan and how to improve your credit score.\n\nOffers in this section are from affiliate partners and selected based on a combination of engagement, product relevance, compensation, and consistent availability.\n\nCredit scoring models come from two main companies, FICO and VantageScore . Both use a scale from 300 to 850, but they use different formulas, meaning your score will look different depending on which company is used. Overall, lenders are more likely to utilize FICO Scores, which are used in 90% of lending decisions.\n\nVantageScore has a slightly different scale, with poor (or \"subprime\") considered anything below 600.\n\nOffers in this section are from affiliate partners and selected based on a combination of engagement, product relevance, compensation, and consistent availability.\n\nFreedom Debt Relief has resolved over $20 billion in outstanding debts since 2002. It offers free credit card debt relief consultations.", "source": "CNBC Top News", "pub_date_str": "13 Sep 2026, 06:30 PM IST", "pub_date_relative": "32m ago"}, {"title": "The price of almost everything on your dinner table is climbing at once \u2014 and Wall Street is taking notice", "full_content": "Rising crop prices are making the current inflation problem bigger than just oil and the Iran war.", "source": "MarketWatch Top Stories", "pub_date_str": "13 Sep 2026, 06:30 PM IST", "pub_date_relative": "32m ago"}, {"title": "Boiling Oceans, Dire Diseases, Climate Injustice: El Nino's Terrifying Trifecta", "full_content": "From scorching heat to sudden floods, a powerful climate phenomenon is set to test how prepared the world is for what comes next", "source": "NDTV Profit", "pub_date_str": "13 Sep 2026, 06:29 PM IST", "pub_date_relative": "33m ago"}, {"title": "India's Semiconductor Sector Draws USD 1.4 bn Funding, Half Of It Since 2025", "full_content": "India\u2019s semiconductor sector has attracted $1.4 billion in equity funding across 281 companies, with nearly half raised since 2025. Bengaluru leads funding, while acquisitions remain the preferred exit route for chip firms.", "source": "NDTV Profit", "pub_date_str": "13 Sep 2026, 06:28 PM IST", "pub_date_relative": "34m ago"}, {"title": "\u20b95 lakh health claim rejected over waiting period: Why Mumbai consumer forum backed policyholder", "full_content": "In a significant ruling for health insurance policyholders, a consumer forum has held that insurers cannot mechanically invoke a waiting-period clause to reject a claim unless they can establish that the illness was pre-existing.\n\nThe Mumbai Suburban District Consumer Disputes Redressal Commission passed the order in a case involving a \u20b9 5 lakh health insurance claim for pancreatitis. The commission directed Max Bupa Health Insurance Co. Ltd., now known as Niva Bupa Health Insurance Co. Ltd., to pay the policyholder's claim after the insurer rejected it by citing a 24-month specific waiting period applicable to pancreatitis.\n\nThe ruling highlights an important point for health insurance customers: the presence of a waiting-period clause in a policy does not automatically mean that every claim for the specified disease can be rejected. The insurer may still have to demonstrate that the circumstances of the case fall within the scope of the exclusion.\n\nThe deceased policyholder was covered under Max Bupa's Health Companion Variant 2 policy. The policy was initially purchased in October 2017 with a sum insured of \u20b9 5 lakh and was renewed in October 2018. His wife subsequently filed the consumer complaint.\n\nThe policyholder was suddenly hospitalised after experiencing severe abdominal pain and was diagnosed with acute pancreatitis during treatment. He later died on February 7, 2019, due to acute pancreatitis accompanied by multiple organ failure.\n\nHis family incurred hospital expenses of \u20b9 1.94 lakh at Criticare Hospital and another \u20b9 4.15 lakh at Lilavati Hospital. Despite the policy offering cashless treatment, the complainant paid the medical bills by borrowing money from relatives, expecting the insurer to reimburse the expenses once the claim was processed.\n\nThe family submitted two claims in March 2019.", "source": "LiveMint Money", "pub_date_str": "13 Sep 2026, 06:24 PM IST", "pub_date_relative": "38m ago"}, {"title": "Indonesian Ship Carrying Over 243 Passengers Loses Contact, Search Underway", "full_content": "Indonesia launched a search for Virgo Transport 8 carrying 243 people after contact was lost in bad weather. Separately, ferry Mutiara Sentosa 2 caught fire, killing five, while 225 were rescued and 41 remained missing.", "source": "NDTV Profit", "pub_date_str": "13 Sep 2026, 06:21 PM IST", "pub_date_relative": "41m ago"}, {"title": "5 lessons from Morgan Housel's The Psychology of Money: Why your financial intelligence doesn\u2019t matter", "full_content": "Your salary has increased, yet saving still feels difficult. A friend earns less but seems more financially secure. Why does this happen?\n\nMorgan Housel's The Psychology of Money, released in September 2020, explores how behaviour shapes financial decisions. Knowing calculations helps. But patience, fear and habits also influence money choices. Its lessons apply to situations ranging from shopping decisions to retirement planning.\n\nUnderstanding complicated financial terms does not make someone good with money. A knowledgeable person can still overspend, borrow heavily or panic during market falls. Meanwhile, someone with basic knowledge may save regularly and avoid unnecessary risks.\n\nImagine receiving a salary increase. Spending the entire increase leaves little room for future needs. Saving part of it reflects a useful habit.\n\nHousel encourages readers to focus on decisions they can repeat consistently. Financial success requires managing emotions alongside managing money.\n\nAn expensive car reveals spending but tells little about someone's savings or debts. Similarly, holiday photographs cannot show whether a household can manage an unexpected expense.\n\nHousel distinguishes visible purchases from money and assets kept for the future. Buying something impressive reduces the money available for other purposes.\n\nThis does not mean every enjoyable purchase is wrong. It means appearances are an unreliable measure of financial strength. Before matching a neighbour's lifestyle, consider your own needs, responsibilities and available savings.", "source": "LiveMint Money", "pub_date_str": "13 Sep 2026, 06:20 PM IST", "pub_date_relative": "42m ago"}, {"title": "Saudi Arabia stocks lower at close of trade; Tadawul All Share down 1.30%", "full_content": "", "source": "Investing.com News", "pub_date_str": "13 Sep 2026, 06:15 PM IST", "pub_date_relative": "47m ago"}, {"title": "It\u2019s the most common aviation accident. But how to stop it? - The Washington Post", "full_content": "It\u2019s the most common aviation accident. But how to stop it? The Washington Post", "source": "Google News Business", "pub_date_str": "13 Sep 2026, 06:12 PM IST", "pub_date_relative": "50m ago"}, {"title": "\u2018I still don\u2019t have my MRI\u2019: My health insurer canceled my plan without warning. Is that legal?", "full_content": "\u201cIt wasn\u2019t an ACA plan, but it was meaningfully cheaper than anything I could find on the ACA exchange.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "13 Sep 2026, 06:10 PM IST", "pub_date_relative": "52m ago"}, {"title": "U.S. equity ETFs see outflows of $4.5 billion as traders price in Fed rate hike", "full_content": "", "source": "Investing.com News", "pub_date_str": "13 Sep 2026, 06:07 PM IST", "pub_date_relative": "55m ago"}, {"title": "Saudi pipeline outage threatens loss of 4% of global oil supply", "full_content": "", "source": "Investing.com News", "pub_date_str": "13 Sep 2026, 06:00 PM IST", "pub_date_relative": "1h ago"}, {"title": "OpenAI rules out IPO this year as Altman, Musk & Amodei warn AI is moving too fast", "full_content": "OpenAI CEO Sam Altman now says his company will not go public this year, citing growing concerns about AI safety. In an interview with Fortune published Saturday , Altman said that an IPO now would be \"ill-advised.\" The decision pushes one of the most anticipated IPOs in history until at least 2027 and gives the clearest sign yet that mounting concerns about increasingly powerful AI are beginning to reshape the industry's business plans.\n\nOpenAI CFO Sarah Friar told employees just last month that the company would likely go public in 2027 or even sooner, if \"our business continues to inflect.\" Altman's comments came on the same day that Anthropic CEO Dario Amodei published an essay urging AI companies to slow how quickly they improve their most advanced models. Altman and Elon Musk quickly backed the proposal in social media posts, an unusual show of agreement among three fierce rivals. In his essay, Amodei proposed a three-step plan aimed at tempering the pace of development without \"sacrificing commercial advantage or the United States' lead in AI.\" Anthropic is actively gearing up for what is expected to be a historic IPO , though the company has not officially disclosed when it plans to debut. The sudden alignment among Altman, Amodei and Musk shows how quickly concern over AI has moved from the margins to the center of the industry \u2014 and is now beginning to collide with its enormous commercial ambitions.\n\nThe essay urged artificial intelligence companies to pace how quickly they improve model capabilities.", "source": "CNBC World Economy", "pub_date_str": "13 Sep 2026, 05:59 PM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "The wages of American workers are under pressure. AI's potential role is drawing more attention", "full_content": "Job growth beat expectations in August, but wage growth has lagged the latest inflation readings, adding urgency to a question economists are only beginning to wrestle with: Could AI pressure workers' pay before it costs them their jobs?\n\nThe latest nonfarm payrolls report isn't the only source of government data showing deceleration in wage growth. The Bureau of Labor Statistics' Employment Cost Index showed that inflation-adjusted wages and salaries decreased 0.4 percent year over year through June. And there is also a concerning longer-term trend in the national data: labor's share of nonfarm business output/income was 52.8% in the second quarter of 2026, the lowest in the series beginning in the first quarter of 1947, according to the BLS productivity report . Some researchers are attributing that to decades of automation , which AI may accelerate.\n\nThere are reasons to avoid a rush to judgment. For one, the wage growth of the Covid era was atypical and reflected an extremely tight labor market, with the current level of wage gains closer to the recent historical norm. Higher pay sectors, such as tech and professional services, are also losing jobs while lower-pay sectors such as hospitality and health care have been leading job gains, which pushes down the average pay.\n\nBut the current labor market situation is leading more people to focus on the job earnings growth trend line rather than dire warnings like the recent one from Bill Gates about widespread job losses. What's been learned to date can't answer this question with authority, but it is moving the topic into a more central place in the AI jobs impact debate.\n\nA recent study from Apollo Global Management's chief economist Torsten Slok and his co-author Sania Edlich offers some evidence consistent with AI contributing to slower wage growth.", "source": "CNBC World Economy", "pub_date_str": "13 Sep 2026, 07:01 PM IST", "pub_date_relative": "just now", "cfa_topics": ["Economics", "Financial Statement Analysis"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "I'm a psychologist who studies couples: Emotionally intelligent partners ask 1 question every morning\u2014that most neglect", "full_content": "A few years ago, I started paying closer attention to how couples talk to each other in the mornings. Not during fights or hard conversations, but in the ordinary 10-minute window they might get to chat between waking up and leaving the house.\n\nAs a psychologist who studies couples, I know that most of what happens during those sometimes chaotic moments has to do with logistics: \"Who's getting the kids from art class and soccer practice?\" \"What time is dinner?\" \"Did you move the car?\"\n\nSome might go beyond logistics to ask: \"How'd you sleep?\" \"How are you feeling?\" These are all good, useful questions, and couples who ask them are usually doing fine.\n\nBut some couples add one more type of question I call a \"capacity check.\" Over time, I've come to believe it might be the most useful and thoughtful question to ask in the morning \u2014 one that demonstrates emotional intelligence and builds stronger relationships.\n\nSome couples put a number on it: \"I'm about a 60 today, where are you?\" Others might ask: \"Is today a light one or a heavy one?\" or \"How's your tank?\" I know partners who describe their days as weather or ask each other what season they're in.\n\nThe wording doesn't matter much. What's consistent and important is the underlying question: \"How much do you have available today, and what should I expect from you?\"\n\nThe ubiquitous \" How are you? \" asks a person to summarize their entire internal state on the spot, which is genuinely difficult. Most of us fall back on \"fine,\" not because we're hiding something, but because assembling a real answer can take more time and headspace than we have at 7:40 a.m.\n\nA capacity check is easier \u2014 and rituals stick when they're easy. Almost everyone knows, without much reflection, how much energy they have today, whether the gauge reads 40 or 80. So the question gets a true answer, quickly, without a heavy emotional excavation.", "source": "CNBC Top News", "pub_date_str": "13 Sep 2026, 07:00 PM IST", "pub_date_relative": "2m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Vodafone Idea shares up over 60% in 6 months \u2014 Will stock soar more? Guide for stock market investors", "full_content": "Vodafone Idea shares have been on an uptrend since the start of the new financial year 2026-2027. In FY 27, Vodafone Idea share price has risen from \u20b9 8.53 to \u20b9 14.96 per share on the NSE, delivering around 75% return to its shareholders. In the last six months, Vodafone Idea shares have risen over 60%, rising from \u20b9 9.27 to \u20b9 14.96 per share.\n\nAccording to stock market experts, Vodafone Idea's share price is zooming after the Government of India's (GoI) strong support, with its AGR dues converted into equity. Apart from this, relief on spectrum payout caps is another fundamental development that fueled confidence among bulls in Vodafone Idea shares. They said the Vodafone Idea share price has strong resistance at \u20b9 17. On breaking above this hurdle, the telecom stock may test another resistance at \u20b9 21.\n\nSpeaking on the triggers that are fueling Vodafone Idea shares, Avinash Gorakshkar, Founder at Avinash Mentor Research, said, \u201cThe market got an idea about the strong backing from the government when Vodafone Idea's AGR dues were adjusted by the GoI after conversion of the dues into equity. This formed the GoI as the single largest shareholder of the company.\u201d\n\nAvinash Gorakshkar said Vodafone Idea received another relief from the government when its previous spectrum payout was capped, reducing short-term pressure on the company's cash flow. This led to a YoY reduction in the Q1FY27 net loss, and its ARPU also improved to \u20b9 195. Gorakshkar said that such developments fueled investor confidence, and bulls started buying the dip in Vodafone Idea shares whenever the telecom stock fell sharply.\n\nWhat technical chart of the Vodafone Idea share signals, Anuj Gupta, a SEBI-registered market expert, said, \u201cVodafone Idea share is looking positive on the technical chart. The stock is facing a hurdle at \u20b9 17.", "source": "LiveMint Markets", "pub_date_str": "13 Sep 2026, 06:41 PM IST", "pub_date_relative": "21m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "How to get a personal loan with bad credit (and the lenders that will approve you)", "full_content": "It's much harder to qualify for personal loans, mortgages, credit cards and other financial products with bad credit. Lenders use your three-digit credit score to determine how likely you are to make on-time, regular payments. The higher your score, the more likely you are to be approved.\n\nBut if you have weak credit, it doesn't mean you don't have options.\n\nFind out what qualifies as bad credit, where you can get a loan and how to improve your credit score.\n\nOffers in this section are from affiliate partners and selected based on a combination of engagement, product relevance, compensation, and consistent availability.\n\nCredit scoring models come from two main companies, FICO and VantageScore . Both use a scale from 300 to 850, but they use different formulas, meaning your score will look different depending on which company is used. Overall, lenders are more likely to utilize FICO Scores, which are used in 90% of lending decisions.\n\nVantageScore has a slightly different scale, with poor (or \"subprime\") considered anything below 600.\n\nOffers in this section are from affiliate partners and selected based on a combination of engagement, product relevance, compensation, and consistent availability.\n\nFreedom Debt Relief has resolved over $20 billion in outstanding debts since 2002. It offers free credit card debt relief consultations.", "source": "CNBC Top News", "pub_date_str": "13 Sep 2026, 06:30 PM IST", "pub_date_relative": "32m ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "The price of almost everything on your dinner table is climbing at once \u2014 and Wall Street is taking notice", "full_content": "Rising crop prices are making the current inflation problem bigger than just oil and the Iran war.", "source": "MarketWatch Top Stories", "pub_date_str": "13 Sep 2026, 06:30 PM IST", "pub_date_relative": "32m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "U.S. equity ETFs see outflows of $4.5 billion as traders price in Fed rate hike", "full_content": "", "source": "Investing.com News", "pub_date_str": "13 Sep 2026, 06:07 PM IST", "pub_date_relative": "55m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Saudi pipeline outage threatens loss of 4% of global oil supply", "full_content": "", "source": "Investing.com News", "pub_date_str": "13 Sep 2026, 06:00 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "OpenAI rules out IPO this year as Altman, Musk & Amodei warn AI is moving too fast", "full_content": "OpenAI CEO Sam Altman now says his company will not go public this year, citing growing concerns about AI safety. In an interview with Fortune published Saturday , Altman said that an IPO now would be \"ill-advised.\" The decision pushes one of the most anticipated IPOs in history until at least 2027 and gives the clearest sign yet that mounting concerns about increasingly powerful AI are beginning to reshape the industry's business plans.\n\nOpenAI CFO Sarah Friar told employees just last month that the company would likely go public in 2027 or even sooner, if \"our business continues to inflect.\" Altman's comments came on the same day that Anthropic CEO Dario Amodei published an essay urging AI companies to slow how quickly they improve their most advanced models. Altman and Elon Musk quickly backed the proposal in social media posts, an unusual show of agreement among three fierce rivals. In his essay, Amodei proposed a three-step plan aimed at tempering the pace of development without \"sacrificing commercial advantage or the United States' lead in AI.\" Anthropic is actively gearing up for what is expected to be a historic IPO , though the company has not officially disclosed when it plans to debut. The sudden alignment among Altman, Amodei and Musk shows how quickly concern over AI has moved from the margins to the center of the industry \u2014 and is now beginning to collide with its enormous commercial ambitions.\n\nThe essay urged artificial intelligence companies to pace how quickly they improve model capabilities.", "source": "CNBC World Economy", "pub_date_str": "13 Sep 2026, 05:59 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Mid and small-caps look expensive: Should you rebalance your portfolio as earnings could lift equities from October?", "full_content": "Indian equities could be heading for a re-rating as corporate earnings are expected to improve in the second half (H2) of the financial year and domestic institutional investors continue to support the market, according to Omniscience Capital.\n\nH2 refers to the second half of FY27, covering October 2026 to March 2027.\n\nHowever, investors may need to be more selective, particularly in the mid- and small-cap segments, where valuations remain elevated,\n\nFor investors with significant exposure to these segments, the key question is whether the current valuations leave enough room for future returns or whether portfolios need to be reassessed.\n\nOmniscience Capital points to a valuation gap across market-cap segments. While the broader market remains in a consolidation phase, pockets of small- and mid-caps remain overvalued.\n\nConsolidation is a period when markets move within a relatively narrow range without a clear upward or downward trend.\n\n\u201cThe Nifty Smallcap 250 and Midcap 150 trade at trailing P/E multiples of around 34x and 30x, respectively, compared with around 20x for the Nifty 100.\u201d The firm cautions that investors may already be paying for several years of strong earnings growth.\n\n\u201cMulti-year forward earnings execution is fully priced in, leaving prospective returns barely near the discount rate while exposing investors to severe de-rating risk,\u201d said Ashwin K. Shami, President & Chief Portfolio Manager, OmniScience Capital.", "source": "LiveMint Money", "pub_date_str": "13 Sep 2026, 05:56 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Quantitative Methods", "Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "DA news: Full list of states that have announced dearness allowance hikes, payment of arrears for employees so far", "full_content": "Updated biannually using data from the All-India Consumer Price Index (AICPI), dearness allowance (DA) is a percentage of employees' basic pay that aims to mitigate the inflation impact and rising cost of living.\n\nNew announcements usually come in March and October, with rollouts in January and July. The last hike was announced in April this year, when the Finance Ministry increased DA from 58% to 60% of basic salary, effective from 1 January 2026.\n\nOver 1 crore beneficiaries, comprising some 50 lakh central government employees and about 65 lakh pensioners, including defence and railway personnel and retirees, gain from an increase in DA and Dearness Relief (DR), respectively.\n\nFollowing the Finance Ministry's announcement, the Indian Banks' Association (IBA) announced revised DA and DR for workmen and officer employees across levels for the months of May, June and July 2026. It hiked basic salaries between \u20b9 48,000 to \u20b9 1,17,000 and DA from \u20b9 435 to \u20b9 1,050. Later, the Indian Railways also announced a 2% hike in DA and DR for staff and pensioners.\n\nHere's a look at the full list of DA hikes announced by states so far:\n\nDA is a component of the salary break-up for central and public sector employees, aimed at mitigating the rising cost of living. Notably, the basic salary also determines other components of compensation, such as provident fund contributions, pension, allowances, gratuity, and more.\n\nThus, higher DA, especially given DA merger demands, could lead to a substantial and automatic increase in overall pay and, consequently, in the other dependent allocations. Notably, employees and pensioners are expecting another hike from the Centre during Diwali year.\n\nMeanwhile, DA revision is under discussion by the 8th central pay commission (CPC), which is expected to submit its final recommendations around 18 months after its constitution, latest by May 2027.", "source": "LiveMint Money", "pub_date_str": "13 Sep 2026, 05:41 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Corporate Issuers", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Less Volatility, More Transparency?: Experts Back SEBI's Expiry-Day Trading Overhaul", "full_content": "SEBI's proposals follow feedback from market participants over the use of the CAS determined closing price for settling derivative contracts on expiry.", "source": "NDTV Profit", "pub_date_str": "13 Sep 2026, 05:37 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Derivatives", "Ethical & Professional Standards"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Dow Jones Futures: Fed Rate Hike Seen As Oil, Yields Pressure Stocks; Apple, Moderna Are New Buys - Investor's Business Daily", "full_content": "Dow Jones Futures: Fed Rate Hike Seen As Oil, Yields Pressure Stocks; Apple, Moderna Are New Buys Investor's Business Daily Wall Street Cheers Clarity on Fed Outlook\u2014Even if It Means Higher Rates WSJ Dow rises 500 points to snap 4-day slide as oil cools, traders look past inflation report: Live updates CNBC Futures Rise With Help From Oracle\u2019s Beat and Cooler Oil Prices Bloomberg.com Stock market today: Dow, S&P 500, Nasdaq end losing week on a high note as Fed rate-hike bets jump Yahoo Finance", "source": "Google News Business", "pub_date_str": "13 Sep 2026, 05:27 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Goldman picks China healthcare stocks for a post-AI trade", "full_content": "Chinese stocks' earnings tracked by Goldman Sachs grew at their highest quarterly pace in five years.", "source": "CNBC Finance", "pub_date_str": "13 Sep 2026, 05:24 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Top Wall Street analysts recommend these 3 dividend stocks for higher returns", "full_content": "Dividend-paying stocks can enhance portfolio returns by providing a steady income stream to investors and the potential for capital appreciation. Several investors seek exposure to dividend stocks in a volatile backdrop to ensure stable income.\n\nIn this regard, recommendations of top Wall Street analysts can help shortlist attractive dividend stocks, backed by strong financials and cash flows to support consistent dividend payments.\n\nHere are three dividend-paying stocks that are highlighted by Wall Street's top pros, as tracked by TipRanks, a platform that ranks analysts based on their past performance.\n\nEnergy Transfer ( ET ) is a diversified midstream energy company with about 140,000 miles of pipelines and associated energy infrastructure in 44 states. The company made a quarterly cash distribution of 34 cents per common unit for the second quarter of 2026. At an annualized payment of $1.36 per common unit, ET offers a yield of 6.3%.\n\nRecently, JPMorgan analyst Jeremy Tonet reiterated a buy rating on Energy Transfer stock and slightly raised his price target to $25 from $24. The analyst noted that the company delivered a strong Q2 beat across all key metrics.\n\nTonet highlighted that Energy Transfer raised its 2026 adjusted EBITDA guidance to $18.8 billion-$19.1 billion from $18.2 billion-$18.6 billion, reflecting robust base results and cost optimization. The 5-star analyst added that the company \"tightened\" its capex to $5.6 billion\u2013$5.9 billion and expects capex above $5 billion annually through 2029, given solid opportunities.\n\nAbout the Hugh Brinson pipeline, Tonet noted Phase 1 (1.5 bcfd) reaching full capacity by September 1 and Phase II capacity (0.7 bcfd) going online by Q1 2027.", "source": "CNBC Top News", "pub_date_str": "13 Sep 2026, 05:23 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Fixed Income", "Alternative Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Kamarajar Port invites bankers for \u20b91,200 crore IPO", "full_content": "Kamarajar Port has begun the process of appointing up to three bookrunning lead managers for its proposed IPO, which is likely to include a \u20b91,200 crore offer for sale.", "source": "LiveMint Markets", "pub_date_str": "13 Sep 2026, 05:15 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "BEML dividend 2026 record date soon: Over 33% returns in 6 months; now 246% dividend - Check amount per share, yield", "full_content": "BEML share price has gained 6.74% in a month and 33% in six months, suggesting a recovery in recent trading sessions.", "source": "LiveMint Markets", "pub_date_str": "13 Sep 2026, 05:05 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Fixed Income"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "NSE IPO: SBI, BoB, LIC to New India Assurance Company | Top 10 selling shareholders earn up to 5,57,700% return", "full_content": "NSE IPO: The weighted average cost of acquisition of the NSE shares for The New India Assurance Company and National Insurance Company is \u20b90.32 per share", "source": "LiveMint Markets", "pub_date_str": "13 Sep 2     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>

</body>
</html>
