 for an FDIC equivalent after Binance, the world's largest crypto exchange, was hacked on Oct. 29, with an estimated impact of $6.3 billion, raising questions about the recovery of stolen funds and the broader fallout for crypto markets. About $3 billion of the stolen assets has been frozen so far, according to a Binance security update.\n\nIn a security update on Saturday, the exchange said it had replenished 90% of stolen assets and was committed to covering the remaining 10%. Blockchain investigators at TRM Labs and Chainalysis have linked the attack to North Korea , but neither the U.S. government or Binance has publicly confirmed any source for the hack.\n\nUnderstanding how crypto is protected online and what mechanisms exist to serve a role similar to insurance is increasingly important as more Americans invest in cryptocurrency.\n\nRoughly one in five U.S. adults say they have invested in, traded, or used crypto , according to Pew Research Center, a figure that is even higher among upper income households (27%). The Securities and Exchange Commission's research from 2024 and 2025 puts that figure closer to 15%, and estimated that roughly 9% of the investing public owned crypto at the time of its survey.", "source": "CNBC Top News", "pub_date_str": "31 Oct 2026, 09:43 PM IST", "pub_date_relative": "1h ago"}, {"title": "OpenAI slashes funding target by $10 billion amid tech rout, FT reports", "full_content": "OpenAI has slashed the target for its latest funding round by $10 billion amid a selloff in tech stocks \u200bdriven by AI worries, the Financial Times reported on Friday, \u200cciting people with knowledge of the matter.\n\nThe ChatGPT maker is now seeking about $20 billion and its desired valuation has dropped to $1.25 trillion from $1.4 billion, the report \u200bsaid.\n\nOpenAI set a Friday deadline for investors to commit to \u200bthe funding round, but the \"first close\" is expected to raise \u2060less than $20 billion after some investors reduced their allocations, it \u200badded.\n\nA consortium of UAE investors that includes state-backed technology fund MGX is \u200bexpected to be the largest participant in the round, and as part of the deal, OpenAI would gain the option to lease newly developed computing capacity in \u200bthe region, the newspaper added.\n\nVenture capital firms including Founders Fund, Coatue, \u200bSequoia Capital and Andreessen Horowitz are also expected to participate, according to the \u200creport.\n\nWealthy \u2060individuals will have the option to invest in a subsequent retail offering at a $1.25 trillion valuation, the FT added.\n\nOpenAI, MGX, Coatue, Sequoia Capital and Andreessen Horowitz did not immediately respond to Reuters requests for comment \u200boutside regular business \u200bhours. Founders Fund \u2060could not be reached for comment.\n\nUS tech stocks have suffered a rout amid growing worries over massive spending \u200bon AI. The tech-heavy Nasdaq index dropped 2.9% on \u200bFriday \u2060and is down 7.8% from its all-time closing high reached on October 6.", "source": "CNBC Top News", "pub_date_str": "31 Oct 2026, 09:38 PM IST", "pub_date_relative": "1h ago"}, {"title": "Binance says 90% of $6.3 billion hack losses are now covered, plans to resume withdrawals Sunday", "full_content": "Binance said Saturday that it has covered up to 90% of the roughly $6.3 billion in token assets stolen from its hot wallets in a record crypto theft announced Thursday.\n\nBinance said it will continue to buy the remaining relevant token assets through market and over-the-counter channels until the covered amount reaches 100% for all tokens.\n\n\"All BTC, ETH, USDT, BNB, SOL, USDC, XRP, USD1, RLUSD, and ZEC are fully backed 100%,\" Binance said in a statement . \"Binance will absorb the financial impact of these stolen funds, not our users.\"\n\nThe exchange said the outstanding 10% consists of tokens outside its top 10 that are \"less liquid, which means they may take longer to source in the required amounts.\"\n\nBinance said it is tapping its Secure Asset Fund for Users (SAFU), a portion of its Futures insurance fund, and its corporate treasury to replenish the assets.\n\n\"Our commitment remains the same: Binance will fully cover the financial impact of the funds stolen in this incident. We will continue to demonstrate this commitment through measurable progress, transparent reporting, and concrete actions,\" Binance said.\n\nIts \"next milestone\" will be resuming withdrawal services for users by Sunday, subject to security checks, while the exchange continues its investigation into the attack, it said.\n\nBinance did not immediately respond to CNBC for additional details or updates on its investigation.", "source": "CNBC World Economy", "pub_date_str": "31 Oct 2026, 09:36 PM IST", "pub_date_relative": "1h ago"}, {"title": "SEBI Steps Up Investor Safeguards Amid Rising Market Participation: Chairman", "full_content": "Cautioning that wider market participation also brings greater responsibility, Pandey said opening an investment account had become easier, but understanding investment risks still required knowledge, care and sound judgement.", "source": "NDTV Profit", "pub_date_str": "31 Oct 2026, 09:35 PM IST", "pub_date_relative": "1h ago"}, {"title": "Uranium Stockpile Transfer, Strait Of Hormuz Reopening: What Iran's Reported Draft Deal With US Proposes", "full_content": "Iran's reported draft deal proposes relocating enriched uranium, reopening the Strait of Hormuz within seven days and easing sanctions, as Qatar pushes for direct US-Iran talks in Doha.", "source": "NDTV Profit", "pub_date_str": "31 Oct 2026, 09:35 PM IST", "pub_date_relative": "1h ago"}, {"title": "Binance Hack: Crypto Exchange Says 90% Of Stolen Assets Replenished", "full_content": "Binance says 90% of assets stolen in the $6.3 billion security breach have been replenished, with the exchange using SAFU reserves, insurance funds and corporate treasury to cover losses.", ed.\n\nIf approved, the move could give workers\u2019 retirement savings exposure to startups, private equity and other growth-oriented assets.\n\nIt would also mark a gradual shift in the retirement fund body's investment strategy, which has traditionally focused on government securities, debt instruments and other relatively safer options.\n\nHowever, the proposal is still under consideration and will require approval from EPFO\u2019s Central Board of Trustees (CBT).\n\nAccording to the news report, the proposed 3% of EPFO's fresh annual accretions could be invested into Category I and Category II AIFs. This means the allocation would come from new inflows receiving during the year, rather than the entire retirement corpus managed by the organisation.\n\nAIFs are privately pooled investment vehicles that collect money from investors and deploy it according to a defined investment strategy. Unlike conventional mutual funds, they can invest in less liquid assets, unlisted companies and specialised investment opportunities.\n\nEPFO manages retirement savings worth around \u20b9 30 lakh crore belonging to nearly 30 crore members. Since this money is meant to support workers after retirement, the organisation follows an investment strategy that balances returns with the need to protect the corpus from extreme volatility.\n\nThe Finance Ministry has prescribed an investment pattern that determines how EPFO can allocate its fresh funds across various asset classes . Fintoo's chief executive Manish P Hingar told Mint that the broad allocation limits are:", "source": "LiveMint Money", "pub_date_str": "31 Oct 2026, 09:24 PM IST", "pub_date_relative": "1h ago"}, {"title": "Centre releases addition instalment of tax devolution of Rs 1.09 lakh crore to states", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Finance \u203a Centre releas 0 formed a high wave candle, as it continued to reach higher high and a higher low.\n\n\u201cIndex sustaining above Friday\u2019s low of 22,905 will signal extension of the current pullback towards 23,150-23,200 levels. While a breach below 22,900 will signal some consolidation in the range of 22,900-22,600,\u201d explained Pabitro Mukherjee, Deputy Vice President-Research, Bajaj Broking.\n\n\u201cThe immediate short-term bias remains corrective below the 23,175\u201323,250 resistance zone, marked by the confluence of last month\u2019s high and the 50-day EMA, a sustained breakout above this zone would signal a pause in the downtrend,\u201d the expert added.", "source": "LiveMint Markets", "pub_date_str": "31 Oct 2026, 08:41 PM IST", "pub_date_relative": "2h ago"}, {"title": "Getting To Work Costs Women More | The Reason Why", "full_content": "There is a hidden commuting cost, especially for women. It is not just about women paying more than men. It is about women paying much more in cities than in villages.", "source": "NDTV Profit", "pub_date_str": "31 Oct 2026, 08:38 PM IST", "pub_date_relative": "2h ago"}, {"title": "My father has Alzheimer\u2019s and his caregiver is using his debit card for DoorDash. Do I intervene?", "full_content": "\u201cI suspect the live-in caregiver is benefiting from my parent\u2019s generosity.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "31 Oct 2026, 08:30 PM IST", "pub_date_relative": "2h ago"}, {"title": "Top 10 Polluted Cities Today: Hoshiarpur, Rohtak Have 'Hazardous' AQI; Punjab Has 5 More Cities In 'Severe' Zone", "full_content": "Hoshiarpur recorded an AQI of 330 and Rohtak 311, with both cities rated hazardous on the live tracker on Saturday evening.", "source": "NDTV Profit", "pub_date_str": "31 Oct 2026, 08:24 PM IST", "pub_date_relative": "2h ago"}, {"title": "GST reforms: Easier registration for small e-commerce sellers, faster refunds to take effect Nov 1", "full_content": "Home ETPrime Markets Market Dat ongress from President Donald Trump's Republican Party. While Democrats are widely expected to gain control of the House of Representatives, the Senate race remains uncertain.\n\nRepublicans currently control both chambers of Congress. A change in the balance of power could influence the Trump administration's legislative agenda and introduce fresh uncertainty for financial markets.\n\nOn the economic front, investors will closely monitor the US employment report for October, scheduled for release on Friday. The data is expected to provide important clues about the health of the labour market and help determine the Federal Reserve's next monetary policy moves.\n\nIn particular, investors will assess whether employment conditions and wage growth could influence the timing of another interest rate increase by the US central bank.\n\nThe employment figures will follow encouraging economic data released during the week. Figures published on Thursday showed that the US economy expanded at its fastest pace in a year during the third quarter, supported by resilient consumer spending and increased business investment in artificial intelligence (AI).\n\nThe Federal Reserve also upgraded its assessment of the US economy while keeping interest rates unchanged this week.\n\nInvestors will therefore examine the October jobs figures for indications of whether economic growth and labour market conditions could prompt the central bank to maintain its current policy stance or consider further tightening.", "source": "LiveMint Markets", "pub_date_str": "31 Oct 2026, 11:15 PM IST", "pub_date_relative": "4m ago", "cfa_topics": ["Economics", "Financial Statement Analysis"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Gold, Silver rates crash: What happened with precious metal rates? What didn't go in favour and brought them down?", "full_content": "Gold and silver prices have taken a sharp hit, wiping out a significant chunk of their previous gains and catching safe-haven investors off guard. In a steep sell-off on Friday, silver plunged by \u20b9 10,577 per kg on the multi commodity exchange (MCX), while gold tumbled \u20b9 4,347 per 10 grams.\n\nAs per MCX data, gold futures fell to \u20b9 1,38,419 per 10 grams and silver rates dropped to \u20b9 1,78,900 per kg at its closing hour yesterday.\n\nFriday's decline has put silver on track for its biggest monthly fall of 2026, while gold slipped to its lowest level since late March. This further raised questions about what went wrong for the precious metals.\n\nAfter a strong rally last year that extended into January 2026, a combination of unfavorable factors appears to have turned the tide. It is important for traders who invest in gold futures and derivative contracts to understand what is driving this decline to assess their current positions and decide their next move.\n\nAccording to a PTI report, gold and silver prices came under pressure from rising energy prices, which fuelled concerns about inflation . Another contributing factor is the hawkish commentary from the US Federal Reserve.\n\nA hawkish stance indicates that the Fed is more inclined to keep interest rates high to contain inflation, rather than cut them soon.\n\nThese developments tempered expectations of monetary easing and weighed on precious metals, which do not offer regular interest income. As a result, investors reassessed their positions.\n\nHigher oil prices and firm inflation have further revived expectations of a December Fed hike, strengthening the case for higher-for-longer interest rates by the US Federal Reserve .", "source": "LiveMint Money", "pub_date_str": "31 Oct 2026, 11:07 PM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Economics", "Derivatives", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Amitabh Kant pitches for development model with rural communities as producers, innovators", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a Amitabh Kant pitches for development model with rural communities as producers, innovators The Economic Times daily newspaper is available online now. Read Today's Paper Amitabh Kant pitches for development model with rural communities as producers, innovators SECTIONS Amitabh Kant pitches for development model with rural communities as producers, innovators PTI Last Updated: Oct 31, 2026, 10:50:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Kant also stressed the need to transform rural India into centres of economic activity, innovation and entrepreneurship rather than limiting it to welfare delivery.\n\nYou can buy a walkie-talkie online. But can you legally use it?\n\nKYB and KYC: Quick commerce, the Damani premium and what DMart must deliver \u2013 3rd and concluding part\n\nKYC and KYB: Inside Damani\u2019s DMart, the retail chain for the middle class. And stock for the long term? \u2013 Part 2 of 3\n\nWill it be a regulatory nightmare if an exchange lists on its own platform?\n\nKYC and KYB: Inside Damani\u2019s Avenue Supermarts that refuses to charge more \u2013 Part 1 of 3\n\nCan new data protection law guard against SBI-like data breaches?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "31 Oct 2026, 10:50 PM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Binance says it has replaced 90% of $6.3 billion stolen in record crypto hack", "full_content": "", "source": "Investing.com News", "pub_date_str": "31 Oct 2026, 10:26 PM IST", "pub_date_relative": "53m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Reliance Q2 FY27 slides: record EBITDA on O2C surge, Jio IPO milestone", "full_content": "", "source": "Investing.com News", "pub_date_str": "31 Oct 2026, 10:09 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Earnings call transcript: Reliance posts Q2 2026 beat as energy drives record profit", "full_content": "", "source": "Investing.com News", "pub_date_str": "31 Oct 2026, 09:51 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Binance, crypto and hacks: What to know about keeping coin safe as cyber criminals advance", "full_content": "For generations, most Americans have deposited their money in banks knowing that if somehow things went sideways, their funds would be covered by the full force of the government's treasury. Up to $250,000 in losses are covered through the Federal Deposit Insurance Corporation (FDIC), born out of the ashes of the Great Depression.\n\nCrypto investors are probably wishing for an FDIC equivalent after Binance, the world's largest crypto exchange, was hacked on Oct. 29, with an estimated impact of $6.3 billion, raising questions about the recovery of stolen funds and the broader fallout for crypto markets. About $3 billion of the stolen assets has been frozen so far, according to a Binance security update.\n\nIn a security update on Saturday, the exchange said it had replenished 90% of stolen assets and was committed to covering the remaining 10%. Blockchain investigators at TRM Labs and Chainalysis have linked the attack to North Korea , but neither the U.S. government or Binance has publicly confirmed any source for the hack.\n\nUnderstanding how crypto is protected online and what mechanisms exist to serve a role similar to insurance is increasingly important as more Americans invest in cryptocurrency.\n\nRoughly one in five U.S. adults say they have invested in, traded, or used crypto , according to Pew Research Center, a figure that is even higher among upper income households (27%). The Securities and Exchange Commission's research from 2024 and 2025 puts that figure closer to 15%, and estimated that roughly 9% of the investing public owned crypto at the time of its survey.", "source": "CNBC Top News", "pub_date_str": "31 Oct 2026, 09:43 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income", "Alternative Investments"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "OpenAI slashes funding target by $10 billion amid tech rout, FT reports", "full_content": "OpenAI has slashed the target for its latest funding round by $10 billion amid a selloff in tech stocks \u200bdriven by AI worries, the Financial Times reported on Friday, \u200cciting people with knowledge of the matter.\n\nThe ChatGPT maker is now seeking about $20 billion and its desired valuation has dropped to $1.25 trillion from $1.4 billion, the report \u200bsaid.\n\nOpenAI set a Friday deadline for investors to commit to \u200bthe funding round, but the \"first close\" is expected to raise \u2060less than $20 billion after some investors reduced their allocations, it \u200badded.\n\nA consortium of UAE investors that includes state-backed technology fund MGX is \u200bexpected to be the largest participant in the round, and as part of the deal, OpenAI would gain the option to lease newly developed computing capacity in \u200bthe region, the newspaper added.\n\nVenture capital firms including Founders Fund, Coatue, \u200bSequoia Capital and Andreessen Horowitz are also expected to participate, according to the \u200creport.\n\nWealthy \u2060individuals will have the option to invest in a subsequent retail offering at a $1.25 trillion valuation, the FT added.\n\nOpenAI, MGX, Coatue, Sequoia Capital and Andreessen Horowitz did not immediately respond to Reuters requests for comment \u200boutside regular business \u200bhours. Founders Fund \u2060could not be reached for comment.\n\nUS tech stocks have suffered a rout amid growing worries over massive spending \u200bon AI. The tech-heavy Nasdaq index dropped 2.9% on \u200bFriday \u2060and is down 7.8% from its all-time closing high reached on October 6.", "source": "CNBC Top News", "pub_date_str": "31 Oct 2026, 09:38 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Binance says 90% of $6.3 billion hack losses are now covered, plans to resume withdrawals Sunday", "full_content": "Binance said Saturday that it has covered up to 90% of the roughly $6.3 billion in token assets stolen from its hot wallets in a record crypto theft announced Thursday.\n\nBinance said it will continue to buy the remaining relevant token assets through market and over-the-counter channels until the covered amount reaches 100% for all tokens.\n\n\"All BTC, ETH, USDT, BNB, SOL, USDC, XRP, USD1, RLUSD, and ZEC are fully backed 100%,\" Binance said in a statement . \"Binance will absorb the financial impact of these stolen funds, not our users.\"\n\nThe exchange said the outstanding 10% consists of tokens outside its top 10 that are \"less liquid, which means they may take longer to source in the required amounts.\"\n\nBinance said it is tapping its Secure Asset Fund for Users (SAFU), a portion of its Futures insurance fund, and its corporate treasury to replenish the assets.\n\n\"Our commitment remains the same: Binance will fully cover the financial impact of the funds stolen in this incident. We will continue to demonstrate this commitment through measurable progress, transparent reporting, and concrete actions,\" Binance said.\n\nIts \"next milestone\" will be resuming withdrawal services for users by Sunday, subject to security checks, while the exchange continues its investigation into the attack, it said.\n\nBinance did not immediately respond to CNBC for additional details or updates on its investigation.", "source": "CNBC World Economy", "pub_date_str": "31 Oct 2026, 09:36 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income", "Derivatives", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Uranium Stockpile Transfer, Strait Of Hormuz Reopening: What Iran's Reported Draft Deal With US Proposes", "full_content": "Iran's reported draft deal proposes relocating enriched uranium, reopening the Strait of Hormuz within seven days and easing sanctions, as Qatar pushes for direct US-Iran talks in Doha.", "source": "NDTV Profit", "pub_date_str": "31 Oct 2026, 09:35 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Binance Hack: Crypto Exchange Says 90% Of Stolen Assets Replenished", "full_content": "Binance says 90% of assets stolen in the $6.3 billion security breach have been replenished, with the exchange using SAFU reserves, insurance funds and corporate treasury to cover losses.", "source": "NDTV Profit", "pub_date_str": "31 Oct 2026, 09:33 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income", "Alternative Investments"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Want guaranteed income in retirement without an annuity? Try laddering I bonds.", "full_content": "The new I-bond interest rate could be 5.5% or 5.4%, but that shouldn\u2019t change your strategy.", "source": "MarketWatch Top Stories", "pub_date_str": "31 Oct 2026, 09:32 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "We\u2019re in our 70s. Should we pay off our 2.5% mortgage \u2014 or put the money in a high-yield savings account?", "full_content": "\u201cLet\u2019s say 10 years from now, when I\u2019m 84, we need a substantial amount of cash.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "31 Oct 2026, 09:30 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "EPFO eyes startup, AIF investments: How does it currently invest your PF money and why is it done? | Explained", "full_content": "The Employees\u2019 Provident Fund Organisation (EPFO) is working on guidelines to invest 3% of its fresh annual investments in alternative investment funds (AIFs), including those that finance startups, The Times or India reported.\n\nIf approved, the move could give workers\u2019 retirement savings exposure to startups, private equity and other growth-oriented assets.\n\nIt would also mark a gradual shift in the retirement fund body's investment strategy, which has traditionally focused on government securities, debt instruments and other relatively safer options.\n\nHowever, the proposal is still under consideration and will require approval from EPFO\u2019s Central Board of Trustees (CBT).\n\nAccording to the news report, the proposed 3% of EPFO's fresh annual accretions could be invested into Category I and Category II AIFs. This means the allocation would come from new inflows receiving during the year, rather than the entire retirement corpus managed by the organisation.\n\nAIFs are privately pooled investment vehicles that collect money from investors and deploy it according to a defined investment strategy. Unlike conventional mutual funds, they can invest in less liquid assets, unlisted companies and specialised investment opportunities.\n\nEPFO manages retirement savings worth around \u20b9 30 lakh crore belonging to nearly 30 crore members. Since this money is meant to support workers after retirement, the organisation follows an investment strategy that balances returns with the need to protect the corpus from extreme volatility.\n\nThe Finance Ministry has prescribed an investment pattern that determines how EPFO can allocate its fresh funds across various asset classes . Fintoo's chief executive Manish P Hingar told Mint that the broad allocation limits are:", "source": "LiveMint Money", "pub_date_str": "31 Oct 2026, 09:24 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income", "Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Centre releases addition instalment of tax devolution of Rs 1.09 lakh crore to states", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Finance \u203a Centre releases addition instalment of tax devolution of Rs 1.09 lakh crore to states The Economic Times daily newspaper is available online now. Read Today's Paper Centre releases addition instalment of tax devolution of Rs 1.09 lakh crore to states SECTIONS Centre releases addition instalment of tax devolution of Rs 1.09 lakh crore to states PTI Last Updated: Oct 31, 2026, 09:16:00 PM IST Rate Story Follow us Share Font policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "NSDL Q2 Results: Consolidated Net Profit Rises 24.6% QoQ To Rs 122.5 Crore, Total Income Up 3.9%", "full_content": "NSDL reported a 24.6% sequential rise in consolidated net profit to Rs 122.5 crore in Q2 FY27, while total income grew 3.9% to Rs 582.6 crore.", "source": "NDTV Profit", "pub_date_str": "31 Oct 2026, 08:41 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stock market prediction Nov 2-6 week: Nifty, Sensex rebound from losses - Will bulls deliver a Diwali bonanza? Outlook", "full_content": "Stock market prediction Nov 2-6 week: The Nifty 50 and Sensex reversed their previous week's losses, ending the week on a positive note. Gains in the pharmaceuticals and IT stocks lifted market sentiment ahead of Diwali. The Nifty 50 surged 2.59% during the week, the BSE Sensex advanced 1.6%.\n\nAs we head for the first week of November, experts decode stock market outlook for the coming week, between November 2-6.\n\nThe Indian stock market next week is likely to showcase range-bound movement in the coming week as crude oil prices volatility, US mid-term elections, and US -Iran tensions are likely to drive sentiments.\n\n\u201cIndian equities are expected to remain range-bound with bouts of volatility next week, ahead of the US midterm elections on Tuesday and amid uncertainty over a potential escalation of geopolitical tensions between US and Iran, which is likely to keep market sentiment cautious,\u201d explained Siddhartha Khemka - Head of Research, Wealth Management, Motilal Oswal Financial Services Ltd.\n\nAdditionally, corporate earnings will also impact investors\u2019 sentiment. Brent crude oil prices continued to remain volatile over the last week. The commodity surged above $ 117 per barrel on Friday, and inched closer to the four-year high of $ 116.72 (recorded on October 23).\n\nThe Nifty 50 formed a high wave candle, as it continued to reach higher high and a higher low.\n\n\u201cIndex sustaining above Friday\u2019s low of 22,905 will signal extension of the current pullback towards 23,150-23,200 levels. While a breach below 22,900 will signal some consolidation in the range of 22,900-22,600,\u201d explained Pabitro Mukherjee, Deputy Vice President-Research, Bajaj Broking.\n\n\u201cThe immediate short-term bias remains corrective below the 23,175\u201323,250 resistance zone, marked by the confluence of last month\u2019s high and the 50-day EMA, a sustained breakout above this zone would signal a pause in the downtrend,\u201d the expert added.", "source": "LiveMint Markets", "pub_date_str": "31 Oct 2026, 08:41 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "GST reforms: Easier registration for small e-commerce sellers, faster refunds to take effect Nov 1", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a GST reforms: Easier registration for small e-commerce sellers, faster refunds to take effect Nov 1 The Economic Times daily newspaper is available online now. Read Today's Paper GST reforms: Easier registration for small e-commerce sellers, faster refunds to take effect Nov 1 SECTIONS GST reforms: Easier registration for small e-commerce sellers, faster refunds to take effect Nov 1 PTI Last Updated: Oct 31, 2026, 08:27:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Simplified GST registration processes will benefit small sellers using e-commerce platforms without physical presence in multiple states. The GST portal will offer user-friendly interfaces and clearer documentation requirements for registration applications. Automatic sanctioning of full refund claims for excess balance in electronic cash ledgers will expedite the refund process. Flexibility in post-supply discount taxation will support industries with volume-based incentives and trade schemes.\n\nYou can buy a walkie-talkie online. But can you legally use it?\n\nKYB and KYC: Quick commerce, the Damani premium and what DMart must deliver \u2013 3rd and concluding part\n\nKYC and KYB: Inside Damani\u2019s DMart, the retail chain for the middle class. And stock for the long term? \u2013 Part 2 of 3\n\nWill it be a regulatory nightmare if an exchange lists on its own platform?\n\nKYC and KYB: Inside Damani\u2019s Avenue Supermarts that refuses to charge more \u2013 Part 1 of 3\n\nCan new data protection law guard against SBI-like data breaches?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "31 Oct 2026, 08:24 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "The S&P 500 isn\u2019t the big winner you may think it is", "full_content": "The index\u2019s weakness may surprise a generation of investors raised on the cult of \u201cstocks always go up.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "31 Oct 2026, 08:24 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "NTPC vs NTPC Green Energy Q2 results 2026 compared: Which PSU wins on Q2 profit, revenue, EBITDA, dividend? Details", "full_content": "DIVIDEND Sharmila Bhadoria Published 31 Oct 2026, 07:53 PM IST Prefer Livemint on Google NTPC vs NTPC Green Energy Q2 results 2026 compared: State-run NTPC Limited and its subsidiary, NTPC Green Energy Limited, have recently announced their second quarter result for the financial year 2026-27. While the Maharatna PSU reported a 38.7% year-on-year (YoY) jump in its Q2 profit, its renewable energy arm reported a 59% annual growth in profit.\n\nAs investors will closely track these two PSU stocks\u2019 movement on Monday, November 2, post Q2 results announcement, here\u2019s a comparison of their Q2 profit, revenue, EBITDA and dividend announcement.\n\nNTPC reported a net profit of \u20b9 7,029.56 crore in the September quarter of FY27, which is 38.7% higher than \u20b9 5,066.78 crore reported in the year-ago period. Its net profit stood at \u20b9 6721.05 crore profit in Q1FY27. NTPC Green Energy\u2019s net profit stood at \u20b9 137.50 crore which is 59% higher than \u20b9 86.38 crore reported in the year ago period.\n\nThe state-run power generation firm reported a 21.2% annual jump in its net consolidated revenue to \u20b9 54,269.95 crore from \u20b9 44,784.05 crore a year earlier. Whereas its total income surged to \u20b9 \u20b9 54,715.69 crore from \u20b9 45,262.10 crore, while total expenses increased to \u20b9 48,059.30 crore from \u20b9 40,218.03 crore.\n\nNTPC\u2019s renewable energy arm, NTPC Green Energy, clocked a 52% annual growth in its total income to \u20b9 1,000.76 crore from \u20b9 656.72 crore in the same quarter a year ago. In Q2 FY27, the company's total expenses stood at \u20b9 876.03 crore as against \u20b9 551 crore in the year-ago period.\n\nNTPC\u2019s earnings before interest, tax, depreciation and amortisation (EBITDA) increased to \u20b9 \u20b9 15,627 crore in Q2FY27, against \u20b9 12,814 crore in Q2FY26. NTPC Green Energy\u2019s EBITDA increased to \u20b9 544.45 crore from \u20b9 368.28 crore YoY.\n\nNTPC announced its first interim dividend for FY27, at the rate of 30% ( \u20b9 3 per equity share) on the face value of \u20b9 10/- each for the Financial Year 2026-27.", "source": "LiveMint Markets", "pub_date_str": "31 Oct 2026, 07:53 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Jio Platforms up 27.8% since IPO listing but how RIL, Jio Fin, Alok Ind, Network 18, Lotus shares fared in 3 years?", "full_content": "The much awaited initial public offering (IPO), Jio Platforms , made a spectacular stock market debut this week, with shares listing at a nearly 21.36% premium over the issue price. Backed by Reliance Industries Limited, Jio shares have surged 27.8% over the IPO price.\n\nWhile Jio Platforms shares are stealing the spotlight, here's a look at how other stocks from Mukesh Ambani's Reliance group have performed over the past three years.\n\nThe Reliance Group\u2019s listed companies include Reliance Industries Limited, Jio Financial Services , Alok Industries , Network18 Media and Lotus Chocolate Company .\n\nRIL share price closed 0.44% lower at \u20b9 1163.55 per share on BSE with a market capitalisation of \u20b9 15,74,578.54 crore on Friday, October 30. The stock has declined 21.83% in one year, 13.42% in two years. Its share price value has surged merely 0.68% in three years.\n\nShares of Jio Financial Services closed 1.21% lower at \u20b9 204.50 per share on BSE with an MCap of \u20b9 1,35,034.25 crore on Friday. The stock has declined 5.59% in one month, 17.17% in three months and around 30.82% in 2026 so far (YTD).\n\nAlok Industries stock closed 5.49% lower at \u20b9 8.09 per share on BSE with an MCap of \u20b9 4,016.88 crore. The textile stock has declined 53.85% in one year. RIL holds 40.01% stake in the textile stock.\n\nShares of Network 18 Media & Investments Limited closed 1.86% lower at \u20b9 23.68 per share on BSE with an MCap of \u20b9 3,651.46 crore on BSE on Friday. Its share price value has declined 51.08% in one year, 70.84% in two years, and 65.78% in three years.\n\nLotus Chocolate Company\u2019s share price closed 508.40 per share on BSE with a market capitalisation of \u20b9 652.84 crore on Friday. Its share price value has declined 64.41% in two years, but has surged 88% in three years.", "source": "LiveMint Markets", "pub_date_str": "31 Oct 2026, 06:46 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Inflation, Inequality and Debt: The Charts Scaring Wall Street", "full_content": "(Bloomberg) -- US stocks are hovering near record highs, unfazed by the war with Iran, stubborn inflation and mounting questions over how Wall Street will finance the expanding AI buildout. But for investors looking for a scare this Halloween, some of the market\u2019s most unsettling signals are hiding just beneath the surface.\n\nFrom violent swings in semiconductor shares and ballooning AI-related debt, to a stock-bond hedge that\u2019s lost some of its reliability, as well as a widening wealth divide, the charts occupying Wall Street\u2019s attention paint a less comforting picture than the major indexes might suggest.\n\nBloomberg News asked nine financial professionals what charts spook them. Here\u2019s what they shared:\n\nWe find concerning the consensus forecasts for slower inflation in 2027 given recent data on prices. The consensus forecast for PCE inflation in 2027 is 2.5% and the average of the top 10 forecasts is 3.1%. Similarly, the Fed\u2019s September Summary of Economic Projections show a median forecast of 2.3% PCE inflation next year and no FOMC participant sees inflation above 2.6% in 2027.\n\nThus, even the most pessimistic forecasts don\u2019t envisage inflation running higher than current rates next year. These projections, which for private economists are based on the hope that the impulse from tariffs will fade, and oil prices will decline on the cessation of hostilities, have little support in the data. The PPI report shows scary trends in pipeline manufacturing goods prices with, for example, core processed goods PPI prices surging 24.3% over the last year. This is beginning to look like 2021/22, and if these soaring pipeline prices feed into finished goods prices, this may give Fed policymakers nightmares.\n\nTiffany Wilding, economist at Pacific Investment Management Co.:\n\nThe AI boom has raised concerns about a potential \u201ccrowding out\u201d of other companies that want to borrow in the capital markets, potentially increasing the concentration of AI in a U.S.", "source": "LiveMint Markets", "pub_date_str": "31 Oct 2026, 06:42 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "In the wake of Weil, a legal recruiter's advice for surviving a company wind-down", "full_content": "It's hard to believe a corporate giant like Weil, Gotshal & Manges \u2014 a top 20 U.S. law firm that reportedly had over $2 billion in revenue in 2025 \u2014 could move toward ceasing operations just like that. But occasionally a Weil-like wind-down \u2014 or even a collapse like Lehman Brothers , Silicon Valley Bank or FTX \u2014 is bound to occur.\n\nAnd here we are, seeing a major law firm move toward shutting down in real time.\n\nThe firm's management committee recommended that its partners prepare to close its doors after more than 90 years in business, Weil, Gotshal & Manges said on Wednesday. \"Following a careful review of strategic alternatives, the Firm's Management Committee has recommended to the partnership that the Firm pursue an orderly wind-down,\" the firm said in a statement to CNBC on Wednesday. \"The partners are expected to vote in the coming days.\"\n\nAs a legal recruiter and former big law associate, I'm here to provide practical insights to the employees, lawyers and non-lawyers alike, who've just learned they're about to be out of a job \u2014 and those who are scared their company might be next.\n\nFirst, let's be clear: From where I stand, Weil is an anomaly. But when a company does make headlines for winding down, or failing and shutting down, it's rarely the employees whose plight is highlighted: the people whose careers have been destabilized, whose anxiety shoots through the roof and who become the collateral damage of business decisions they had no idea were being made until far too late.\n\nHere are my top tips, for both lawyers and non-lawyers, for when your company announces or is headed toward dissolution. In the case of Weil, it's advice I hope the firm's roughly 1,200 lawyers plus staff take to heart in the next 90 days .\n\nYes, you can worry. Yes, you can grieve.", "source": "CNBC Top News", "pub_date_str": "31 Oct 2026, 06:37 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Bank of America says buy these stocks ahead of earnings before it's too late", "full_content": "The firm named a slew of undervalued stocks to buy ahead of quarterly reports.", "source": "CNBC Top News", "pub_date_str": "31 Oct 2026, 06:35 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Crypto industry pours more than $200 million into 2026 midterms to pressure Congress on favorable rules", "full_content": "Interest groups tied to cryptocurrency are spending millions to tilt the midterm elections. They had mixed success in 2024", "source": "CNBC World Economy", "pub_date_str": "31 Oct 2026, 06:34 PM IST", "pub_date tement Analysis", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Chart of the Week: Bond investors may cheer gridlock", "full_content": "Midterms will have higher stakes for the bond market", "source": "FT Markets", "pub_date_str": "31 Oct 2026, 04:00 PM IST", "pub_date_relative": "7h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "ET Wealth Expo | Only 6 of 1990's Sensex stocks survive: S Naren's case for smarter asset allocation", "full_content": "S Naren of ICICI Prudential Mutual Fund highlights how only six companies from the 1990 Sensex remain in the benchmark today. At ET Wealth Expo, he explained why beaten-down stocks may never recover and urged investors to distinguish between asset allocation and stock selection, while cautioning against chasing strong past returns.", "source": "Economic Times Markets", "pub_date_str": "31 Oct 2026, 03:40 PM IST", "pub_date_relative": "7h ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "SCSS investment at 55: Eligibility, rules \u2013 Can senior citizens open a Savings Scheme account before turning 60? Details", "full_content": "SCSS investment at 55 is permitted for eligible retired individuals before they turn 60. Check the Senior Citizens\u2019 Savings Scheme eligibility rules, three-month investment deadline, \u20b930 lakh deposit limit and latest 8.2% interest rate for October-December 2026.", "source": "LiveMint Money", "pub_date_str": "31 Oct 2026, 02:56 PM IST", "pub_date_relative": "8h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Shares down 28% in 6 months but InCred is bullish eight."}], "updated_at": "31 Oct 2026, 11:20 PM IST", "total_stories": 335};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
