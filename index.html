<script>
    // This variable will be injected during the build process
    const allData = {"general": [{"title": "Anthropic sets IPO price range of $70 to $78, looks to start trading Nov. 19, sources say", "full_content": "Anthropic said it will offer 825 million shares in its upcoming IPO at a price range between $70 and $78 per share, according to an updated filing on Tuesday, bringing the 5-year-old artificial intelligence lab a step closer to a potentially historic Nasdaq debut.\n\nThe company is planning to price on Nov. 18 and trade on Nov. 19, according to people familiar with the details who were granted anonymity because they were not authorized to speak publicly. Anthropic is targeting retail allocation of about 20%, the people said, a much higher percentage than the typical initial public offering, which is 5% to 10% for retail investors.\n\nAt the high end of the range, Anthropic would net up to $64.35 billion in proceeds through the IPO. The company could end up being worth up to $1.405 trillion on a fully diluted basis, rising from the $965 billion valuation it announced as part of a funding round in May.\n\nAnthropic said it has entered into an agreement with Advanced Micro Devices , Broadcom , Google , Micron , Microsoft , Nvidia and Taiwan Semiconductor Manufacturing Co. to purchase $26 billion of the company's Class N common stock in a private placement at a price per share equal to the IPO price. The shares sold in the private placement will not be registered in the offering and will not be subject to lock-up agreements with the underwriters, the company said.\n\nAs Anthropic executives get set to pitch the offering to investors, they have to contend with a tumultuous political environment , following last week's midterm elections that included a Democratic sweep in Congress and the passage of numerous statewide ballot measures that could slow the AI buildout.", "source": "CNBC World Economy", "pub_date_str": "10 Nov 2026, 09:12 PM IST", "pub_date_relative": "just now"}, {"title": "Stocks making the biggest moves in early trading: Sanmina, Hims & Hers, Securitize & more", "full_content": "Tokenization stock Securitize was among the big gainers in early trading Tuesday , after the company reported strong third-quarter results. Other stocks making moves include:\n\nFollow below as CNBC breaks down the biggest stock market moves of the day:\n\nData center power producer GE Vernova is sliding in Tuesday morning trading following revisions from SoftBank on its power equipment procurement strategy. Shares of GEV are down close to 7% as of 10:35 a.m. ET.\n\nShare of Steel Dynamics were up 4% after the company announced an additional $3 billion authorization for share repurchases. The authorization is effective immediately and is additive to the previous $1.5 billion program, which had $216 million remaining authorized and available for repurchase on Sept. 30, 2026.\n\nSteel dynamics - year to date The company's board of directors also declared a quarterly cash dividend of 53 cents per common share. The dividend is payable to shareholders of record at the close of business on Dec. 31, and is payable on or about Jan. 8, 2027.\n\n\"These actions reflect the Board's and senior leadership's continued confidence in our ability to consistently provide meaningful, industry-leading free cash flow generation throughout all market environments, in order to both continue our strong growth strategy and provide significant shareholder returns,\" stated Mark D. Millett, Chairman and Chief Executive Officer.\n\nChipmaker Nvidia is sagging for the second day in a row after CEO Jensen Huang issued an apology in the wake of a report that he was the target of a potential Chinese spying operation. Shares of the company were down 4% as of 9:45 a.m. in Tuesday trading. On Monday, shares also dropped 4%. Shares are down 25% over the past month amid broader struggles in the tech trade.\n\nShares of American Airlines were flat, outperforming the broader market after Rothschild upgraded the airline to buy from neutral.", "source": "CNBC Top News", "pub_date_str": "10 Nov 2026, 09:10 PM IST", "pub_date_relative": "2m ago"}, {"title": "Nvidia falls for second day as investors weigh fallout of CEO\u2019s affair with alleged spy", "full_content": "Nvidia shares sank a further 4% on Tuesday as investors continued to weigh the potential fallout from CEO Jensen Huang 's affair with an alleged Chinese spy.\n\nShares closed more than 4% lower on Monday, the day after Huang told staff in an email that he had been \"unfaithful\" to his wife and had \"fallen short\" of his responsibilities as CEO.\n\nHe reportedly had an affair with Alice Huang, an executive at Megaspeed , an Nvidia customer. The New York Times on Oct. 29 reported that U.S. officials had concluded she was \"a Chinese intelligence asset, funneling information to Beijing\" and \"possibly steering advanced Nvidia A.I. chips to China.\"\n\nU.S. President Donald Trump said Monday that the FBI is investigating .\n\n\"I've been reading a little bit about it over a period of time, but not too long ago,\" Trump told reporters at the White House . \"We'll look into it. I know the FBI is looking into it in terms of something else, and I think that he'll be in good shape.\"\n\nNvidia shares over the past five days. Adding to the tech giant's woes was a class-action shareholder lawsuit filed against Nvidia and Huang in federal court in San Jose, California.\n\nThe Rosen Law Firm's suit alleges the defendants made false or misleading statements about his affair with Huang and Nvidia's relationship with Megaspeed, thereby presenting a material risk to the company's reputation and business prospects.\n\n\"Right now the Street and investor chatter is assigning roughly a 15% chance he is removed as CEO of Nvidia with a high probability (85%) he stays on as CEO after the Board investigation is completed,\" said Dan Ives, senior and managing director at Yorkville Ives & Co, in a Tuesday note.", "source": "CNBC World Economy", "pub_date_str": "10 Nov 2026, 09:01 PM IST", "pub_date_relative": "10m ago"}, {"title": "\u2018The thought of living to 100 terrifies me\u2019: Is Social Security a giant Ponzi scheme?", "full_content": "There\u2019s already a demographic \u2018run\u2019 on Social Security.", "source": "MarketWatch Top Stories", "pub_date_str": "10 Nov 2026, 09:00 PM IST", "pub_date_relative": "12m ago"}, {"title": "Elon Musk was half right in his comment last week about SoftBank backpedaling on a gas-turbine order", "full_content": "Elon Musk in a social-media post last week said that SoftBank \u201cdefaulted\u201d on a gas-turbine order. The truth, revealed Tuesday in the Japanese\u2019s investment company\u2019s second-quarter earnings, wasn\u2019t far off.", "source": "MarketWatch Top Stories", "pub_date_str": "10 Nov 2026, 09:00 PM IST", "pub_date_relative": "12m ago"}, {"title": "Factbox-Amazon, Google set for big windfall from Anthropic IPO", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Nov 2026, 08:55 PM IST", "pub_date_relative": "17m ago"}, {"title": "Why is Broadcom stock rallying today?", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Nov 2026, 08:54 PM IST", "pub_date_relative": "17m ago"}, {"title": "Wall St falls as hot inflation data fuels rate-hike jitters", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Nov 2026, 08:54 PM IST", "pub_date_relative": "17m ago"}, {"title": "Earnings call transcript: Caixa Seguridade posts solid Q3 2026 results, stock rises", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Nov 2026, 08:53 PM IST", "pub_date_relative": "19m ago"}, {"title": "Brookdale Senior Living stock hits 52-week low at 8.85 USD", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Nov 2026, 08:53 PM IST", "pub_date_relative": "19m ago"}, {"title": "Bhai Dooj gift tax rules: Got money or gold from your brother? Check when festival presents become taxable", "full_content": "Following Dhanteras and Diwali, Indians are set to celebrate Bhai Dooj on Wednesday, November 11 this year, a traditional Hindu festival that honours the special bond between brothers and sisters.\n\nThis occasion is often celebrated by exchanging presents, with cash, gold, jewellery and other valuable items among the popular choices.\n\nHowever, such transfers may have tax implications depending on the relationship between the giver and the recipient and the value of the item being gifted.\n\nAny gifts received by a sister from her blood brother or sibling is exempt from income tax, irrespective of its value. Under Section 56(2)(x) of the Income-tax Act, 1961, gifts such as cash, jewellery and other assets received from specified relatives are tax-free, and brother is included in the definition of a relative.\n\nEven if the brother is a minor and the gift is funded by parents, no tax is applicable, as both the mother and father are also classified as relatives. This is true even if the value of the gift exceeds \u20b9 50,000.\n\nHowever, tax exemption does not necessarily mean that the gift does not have to be disclosed in your income tax return ( ITR ). Large financial gifts should be reported under the \u2018Receipts not in the nature of income\u2019 field in the ITR utilities, which is meant for disclosing such tax-exempt receipts.\n\nFor example, if your brother gifts you \u20b9 1 lakh in cash or gold worth \u20b9 3 lakh tomorrow, you must report the amount in your tax return for AY 2027-28, which is during the next tax filing season.\n\nAs per income tax rules, gifts received from maternal or paternal cousins are not exempt from tax if their aggregate value exceeds \u20b9 50,000 in a financial year. The same rule applies to gifts received from people who are not related to you, such as friends or neighbours, even if they are given during Bhai Dooj.", "source": "LiveMint Money", "pub_date_str": "10 Nov 2026, 08:52 PM IST", "pub_date_relative": "19m ago"}, {"title": "Earnings call transcript: Gilat Satellite Networks Q3 2026 revenue miss hits shares", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Nov 2026, 08:52 PM IST", "pub_date_relative": "20m ago"}, {"title": "Septerna Inc stock hits all-time high at 51.54 USD", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Nov 2026, 08:51 PM IST", "pub_date_relative": "20m ago"}, {"title": "Earnings call transcript: Urban One Q3 2026 loss widens as stock falls 7.7%", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Nov 2026, 08:51 PM IST", "pub_date_relative": "20m ago"}, {"title": "Nvidia CEO\u2019s affair with an alleged Chinese spy could be a problem for the economy - The Washington Post", "full_content": "Nvidia CEO\u2019s affair with an alleged Chinese spy could be a problem for the economy The Washington Post Nvidia\u2019s Board Has a History of Letting Jensen Huang Get His Way The New York Times Nvidia stock drops 3%, extending decline on report alleged Chinese spy linked to Nvidia CEO aided $7.5 billion in China chip shipments Yahoo Finance A Scandal at the Center of the Economy The Atlantic Jensen Huang's affair with alleged Chinese spy further complicates Nvidia\u2019s China problem CNBC", "source": "Google News Business", "pub_date_str": "10 Nov 2026, 08:51 PM IST", "pub_date_relative": "21m ago"}, {"title": "Universal Health Services at UBS Global Healthcare Conference: growth offsets headwinds", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Nov 2026, 08:51 PM IST", "pub_date_relative": "21m ago"}, {"title": "EXCLUSIVE: Anthropic eyes $1.4 trillion IPO valuation in test of Wall Street's AI fervor - Reuters", "full_content": "EXCLUSIVE: Anthropic eyes $1.4 trillion IPO valuation in test of Wall Street's AI fervor Reuters Anthropic to Seek $1.3 Trillion Valuation in IPO WSJ Anthropic seeks $1.4 trillion valuation in highly anticipated IPO amid AI boom Yahoo Finance Anthropic heads for lower than expected $1.3 trillion valuation in stock market debut BBC Anthropic Plans IPO Live Stream With Amodei, JPMorgan CEO Dimon Bloomberg.com", "source": "Google News Business", "pub_date_str": "10 Nov 2026, 08:48 PM IST", "pub_date_relative": "23m ago"}, {"title": "Traders raise odds of 50 bps Fed rate hike as CPI rise exceeds expectations", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a Traders raise odds of 50 bps Fed rate hike as CPI rise exceeds expectations Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Traders raise odds of 50 bps Fed rate hike as CPI rise exceeds expectations SECTIONS Traders raise odds of 50 bps Fed rate hike as CPI rise exceeds expectations ETMarkets.com Last Updated: Nov 10, 2026, 09:08:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis New data has revealed that US consumer prices rose faster than anticipated, prompting speculation about interest rate changes. Fed Governor Christopher Waller suggested a half percentage point hike may be necessary if core prices continue rising. The Consumer Price Index showed a month-over-month increase of 0.4% in October, with core inflation remaining persistent. The bond market reacted strongly to these developments, significantly affecting Treasury yields.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "10 Nov 2026, 08:45 PM IST", "pub_date_relative": "26m ago"}, {"title": "Rivian CEO says new R2 SUV, autonomy make 2027 an \u2018inflection year\u2019 as EV maker marks five years since IPO", "full_content": "It's been five years since Rivian Automotive celebrated its initial public offering with CEO and founder RJ Scaringe ringing the Nasdaq opening bell from the company's factory in Normal, Illinois, while the company's sleek vehicles sat outside the stock exchange in Times Square.\n\nIt was a euphoric time for all-electric vehicle companies that has since diminished . And much like the EV hype, Rivian's stock price is down more than 80% since the Amazon -backed company debuted on the Nasdaq at $78 per share on Nov. 10, 2021. That includes a nearly 30% decline this year.\n\nA host of internal and external factors have contributed to Rivian's stock decline, but the company continues to be the most promising EV maker to emerge during the early 2020s, as most of its peer group to go public during that time no longer exists .\n\nRivian founder and CEO RJ Scaringe acknowledges that not everything has gone to plan amid supply chain shortages, geopolitical tensions and slower-than-expected consumer EV adoption , but he said he believes the next year will prove to be a catalyst for the company and investors.\n\n\"2027 is really an inflection year for us,\" Scaringe told CNBC during an exclusive interview. \"I'm excited to start to really show what we believe so fully, the potential of the business.\"\n\nScaringe's bullishness comes as Rivian ramps up production of its midsize R2 SUV \u2014 meant to expand the brand to the mainstream market \u2014 and as the company continues to invest in its next generation of vehicle software and autonomy.\n\nScaringe said the R2, with an entry-level model at about $45,000, remains the core business to be able to showcase its newest technologies. Rivian delivered a record 19,248 vehicles in the third quarter of 2026, up 46% year over year, and said R2 was already its best-selling vehicle by volume, outselling both its R1 flagship products and its commercial van.\n\n\"That's going to define the business.", "source": "CNBC Top News", "pub_date_str": "10 Nov 2026, 08:41 PM IST", "pub_date_relative": "30m ago"}, {"title": "As Nvidia probes Jensen Huang affair, here\u2019s the board member likely to play a big role", "full_content": "Nvidia's investigation into CEO Jensen Huang over his affair with an alleged Chinese spy may hinge on a longtime criminal defense attorney with an extensive resume dealing with corporate scandals.\n\nStephen Neal is Nvidia's lead independent director and head of corporate governance. The company has not named specific investigators handling the allegations surrounding its CEO, but Nvidia said the board is leading the probe with help from outside counsel and Neal's experience makes him a likely key figure in the investigation.\n\nNvidia's board has said there is \"no reason to believe that either national security or Nvidia secrets were compromised.\" China has dismissed the espionage allegations, which were reported by The New York Times . Huang, one of the most powerful businessmen in the artificial intelligence boom, said he would \"cooperate fully\" with the process.\n\nNvidia's board has 10 independent members, including a former president of Taco Bell , a former Eli Lilly executive and a former vice chairman from Goldman Sachs .\n\nNeal, who joined Nvidia's board of directors in 2019, is a chairman emeritus and senior counsel of the law firm Cooley LLP, where he also served as CEO from 2001 to 2008.\n\nHe's previously represented Theranos founder Elizabeth Holmes and late financier Charles Keating, Jr.\n\nIt won't be his first corporate governance probe. According to Cooley , Neal has litigated cases across securities, bankruptcies, antitrust, takeovers and more. And he's conducted several investigations for multiple boards of directors, including at General Motors , where he advised the company in disputes with Ross Perot.\n\nAccording to the firm, Neal has conducted several investigations for committees of directors and independent directors, though most of those client names are confidential. He's also handled investigations with the Securities and Exchange Commission for both corporations and individuals.", "source": "CNBC World Economy", "pub_date_str": "10 Nov 2026, 08:40 PM IST", "pub_date_relative": "31m ago"}, {"title": "US stocks: US market opens lower after October's hot inflation print", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a US stocks: US market falls as hot inflation revives rate-hike fears; Nvidia sinks Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US stocks: US market falls as hot inflation revives rate-hike fears; Nvidia sinks SECTIONS US stocks: US market falls as hot inflation revives rate-hike fears; Nvidia sinks Reuters Last Updated: Nov 10, 2026, 09:03:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis On Tuesday, Wall Street faced a downturn as inflation figures surpassed projections, raising worries about potential interest rate hikes. The declines were evident across the Dow Jones Industrial Average, S&P 500, and Nasdaq Composite indices. While financial stocks showed minor gains, technology shares, especially Nvidia, experienced fluctuations due to uncertainty in leadership. Anthropic's looming IPO threatens to heat up competition in the AI field.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "10 Nov 2026, 08:40 PM IST", "pub_date_relative": "32m ago"}, {"title": "Monthly US inflation higher than expected in October", "full_content": "Figure of 0.4% comes as last year\u2019s government shutdown prevented data collection", "source": "FT Markets", "pub_date_str": "10 Nov 2026, 08:36 PM IST", "pub_date_relative": "36m ago"}, {"title": "Easing global headwinds, lower crude oil prices may further lift rupee in coming months: Economists", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Indicators \u203a Easing global headwinds, lower crude oil prices may further lift rupee in coming months: Economists The Economic Times daily newspaper is available online now. Read Today's Paper Easing global headwinds, lower crude oil prices may further lift rupee in coming months: Economists SECTIONS Easing global headwinds, lower crude oil prices may further lift rupee in coming months: Economists ANI Last Updated: Nov 10, 2026, 08:34:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Economists predict the Indian rupee will strengthen against the US dollar in the coming months. Factors contributing to this appreciation include lower crude oil prices and improving foreign capital inflows. Additionally, a weaker US dollar and the easing of geopolitical tensions are supporting this trend. The Reserve Bank of India has implemented measures to stabilize the currency and enhance dollar availability.\n\nBusiness of Odd Things: The farm that needs no land, freshwater, or fertiliser\n\nKYC and KYB: Inside Pidilite, the company that turned Fevicol into a word for a strong bond \u2013 Part 1 of 3\n\nSeoul halts trading, Nifty has its best week since 2021: Money leaving the AI trade \u2013 will it land in India?\n\nJunk bonds are cracking at the bottom. Will the noise get loud enough to make \u2018junk bond\u2019 a household term again?\n\nPNG connections rise half a million, but how many use piped gas for cooking?\n\nSome elections matter more than you know: No crop changed in the fields, yet sugar, coffee and soya got cheaper in a day\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "10 Nov 2026, 08:34 PM IST", "pub_date_relative": "37m ago"}, {"title": "Hindu Succession Act, 1956: Can a grandson claim a share in property inherited by his father? Supreme Court clarifies", "full_content": "A grandson cannot claim a share by birth in property that his father receives after the grandfather's estate is divided among legal heirs, the Supreme Court has ruled. The court held that once property devolves upon a Hindu male's Class I heirs under Section 8 of the Hindu Succession Act, 1956, and is subsequently partitioned, the share allotted to the father becomes his exclusive property.\n\nThe ruling in J. Rajesh (Minor) through his Mother and Natural Guardian J. Gomathi v. M. Kumaran (Dead) through LRs & Others, delivered on 6 November 2026, clarifies when inherited property can be treated as an individual's exclusive estate rather than joint Hindu family or coparcenary property.\n\nA bench of Justices Augustine George Masih and Sunita Agarwal dismissed an appeal by a son who had sought a half share in land allotted to his father during the partition of his grandfather's estate. The father had subsequently sold the property to two buyers.\n\nThe dispute concerned a 1,811 sq ft plot of land originally belonging to the grandfather, N. Ramakrishnan. His daughter had filed a partition suit in 1993 seeking a division of his estate. The matter was settled through a compromise decree dated 3 February 1994, under which the grandson's father received the disputed land .\n\nThe grandson was born on 6 January 1994. In 1997, his father sold the land through two sale deeds. The son, who was a minor, subsequently filed a suit through his mother, seeking partition and possession of half the property.\n\nHis argument was that the land was ancestral property and that he had acquired coparcenary rights in it by birth. He also contended that his father's share continued to retain its character as joint family property even after the partition.\n\nThe trial court initially passed a preliminary decree in his favour. However, the appellate court reversed the decision, holding that the father had become the absolute owner of the property.", "source": "LiveMint Money", "pub_date_str": "10 Nov 2026, 08:34 PM IST", "pub_date_relative": "37m ago"}, {"title": "Jensen Huang's affair with alleged Chinese spy further complicates Nvidia\u2019s China problem", "full_content": "Following Nvidia CEO Jensen Huang's admission on Sunday to an extramarital affair with alleged Chinese spy Alice Huang, the chipmaker's relationship to China is about to come under intense scrutiny in Washington, D.C.\n\nSince October 2022, when the Biden administration announced sweeping controls to limit China's ability to obtain advanced U.S. chips, Nvidia has seen its business diminish in the world's second-largest economy. Months after an even stricter set of rules was implemented by the Trump administration, Huang said in October 2025, \"We are 100% out of China.\"\n\nThe recent allegations against Huang, while throwing the chipmaker into crisis, have also brought attention to the Nvidia CEO's potential influence over U.S. policy on chip sales to China, where its business once flourished. Of particular interest is whether restricted Nvidia chips have reached Chinese companies through customers like Singapore-based Megaspeed , the company linked to Alice Huang.\n\nThe New York Times first reported that the Chinese businesswoman was a spy for China's Ministry of State Security, according to people briefed on the intelligence circulated in a memo among the Trump administration in the spring. China has called the allegation a smear.\n\nJensen Huang has been closely aligned with President Donald Trump during his second administration, helping advise the White House on artificial intelligence safety regulations, while also pushing for looser restrictions on selling AI chips to China. In December, Trump said Nvidia would be allowed to ship its H200 chips to China, provided the U.S. got a 25% cut of sales.", "source": "CNBC World Economy", "pub_date_str": "10 Nov 2026, 08:34 PM IST", "pub_date_relative": "38m ago"}, {"title": "CoreWeave earnings put debt-fueled AI build-out under scrutiny", "full_content": "CoreWeave faces a pivotal test when it reports its third-quarter financial results after the bell on Tuesday.\n\nThe market will be closely watching what the neocloud company says about artificial intelligence spending \u2014 and how it plans to finance its infrastructure buildout. The outcome could either calm concerns over its debt or stoke more fear.\n\n\"Investors need neoclouds to quantify how much financing they expect to raise to execute on existing backlog,\" Wolfe Research said in a note Monday. \"We think outlooks that communicate when and which avenues of funding will be tapped will increase investor confidence.\"\n\nCoreWeave stock and bonds have come under pressure as fears deepened about the enormous amount of debt it has taken out to build its data centers.\n\nIts stock is down roughly 40% over the past month. Meanwhile, the yield on its 9.75% bond due in 2031 was 15.5% on Tuesday, after jumping to 16.7% on Thursday as investors digested the election results and possible roadblocks to data center construction. Bond yields move inversely to prices.\n\nThe spread on its five-year credit default swaps \u2014 which is insurance against default and considered a barometer of perceived credit risk \u2014 is also at levels that are considered distressed. On Tuesday, its CDS spread stood around 1,152 basis points, after rising above its October peak to close at 1,278 basis points on Thursday. Rising CDS spreads mean investors view the debt as riskier.\n\nIn addition, the New Jersey-based company's leverage is high. CoreWeave has a debt-to-equity ratio of 702%, up from almost 291% a year ago.\n\nCEO Michael Intrator has sought to quell investor fear, posting on LinkedIn after the election last week that the company doesn't anticipate \"any impact to CoreWeave's existing customer commitments or associated backlog as a result of shifts in the political landscape.\"", "source": "CNBC World Economy", "pub_date_str": "10 Nov 2026, 08:31 PM IST", "pub_date_relative": "41m ago"}, {"title": "Market spooked because now the Fed may need a supersized hike in December", "full_content": "Wall Street was recently able to put inflation worries on the back burner, as traders focused on the midterm elections and swings in tech stocks. That\u2019s over now.", "source": "CNBC Top News", "pub_date_str": "10 Nov 2026, 08:29 PM IST", "pub_date_relative": "43m ago"}, {"title": "Forget happy hour. \u2018Money parties\u2019 are having a moment.", "full_content": "There\u2019s evidence showing that talking about finances with your friends can help you save money.", "source": "MarketWatch Top Stories", "pub_date_str": "10 Nov 2026, 08:28 PM IST", "pub_date_relative": "44m ago"}, {"title": "Mookuthi Amman 2 Box Office Collection Day 5: Nayanthara Starrer Sees Weekday Slump, Mints This Amount", "full_content": "Mookuthi Amman 2 recorded an occupancy of 33% across 1,103 shows on Tuesday, according to Sacnilk.", "source": "NDTV Profit", "pub_date_str": "10 Nov 2026, 08:26 PM IST", "pub_date_relative": "46m ago"}, {"title": "Anthropic's potential mega IPO joins ranks of world's biggest stock market listings", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Anthropic's potential mega IPO joins ranks of world's biggest stock market listings Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Anthropic's potential mega IPO joins ranks of world's biggest stock market listings SECTIONS Anthropic's potential mega IPO joins ranks of world's biggest stock market listings Reuters Last Updated: Nov 10, 2026, 08:25:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Anthropic has kicked off its U.S. IPO roadshow, seeking to raise up to $64.4 billion by offering 825 million shares. This latest valuation stands at roughly $1.4 trillion, representing a drop from earlier estimations of $2 trillion. Notably, tech giants like Alphabet and Microsoft are set to invest $26 billion in a private placement.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "10 Nov 2026, 08:25 PM IST", "pub_date_relative": "47m ago"}, {"title": "Consumer prices rose 0.4% in October, more than expected, complicating Fed's inflation fight", "full_content": "Costs for goods and services rose more than expected in October, providing fresh warning signs for the Federal Reserve in its fight to lower inflation.\n\nThe consumer price index , a broad gauge of costs across the U.S. economy, increased a seasonally adjusted 0.4% for the month, the Bureau of Labor Statistics reported Tuesday. Economists surveyed by Dow Jones had been looking for a 0.3% increase.\n\nStripping out volatile food and energy, so-called core CPI increased 0.3% against the forecast for a 0.2% gain.\n\nThe headline CPI had increased 0.6% in September while core was up 0.3%.\n\nThe BLS did not estimate a yearly rate. The government shutdown last year prevented the bureau from collecting sufficient data in October 2025, so there is no comparable figure to use. However, the report did include annual figures for some individual items where it was able to collect data.\n\nStock market futures drifted lower following the release while Treasury yields jumped. Traders fully priced in a quarter percentage point increase when the Fed next meets Dec. 8-9 and put odds of a half-point hike at 13.6%, after being around zero prior to the release, according to the CME Group's FedWatch tool.\n\nThe report comes at a critical juncture for the Federal Reserve as it considers its next move regarding interest rates. At its October meeting, central bank officials voted 10-2 to keep their benchmark rate in a range between 3.75%-4% while awaiting incoming data.\n\n\"This was the report the market could least afford to see,\" said Karen Manna, fixed income investment strategist at Federated Hermes. \"A hotter inflation print raises fresh questions about whether the Fed has done enough to contain price pressures and reinforces the risk that interest rates need to move higher and stay there for longer.\"", "source": "CNBC Top News", "pub_date_str": "10 Nov 2026, 08:20 PM IST", "pub_date_relative": "52m ago"}, {"title": "Pete Hegseth decries impeachment push, defends Iran war handling", "full_content": "Secretary of Defense Pete Hegseth on Tuesday railed against the Republican congressman who introduced articles of impeachment against him and aggressively defended his leadership in the Iran war and other military operations.\n\n\"What one disgruntled and defeated congressman is attempting is not oversight, and it's not accountability. It's a political spectacle, a personal manifesto driven by ego and resentment,\" Hegseth said a day after Rep. Thomas Massie, R-Ky., put forward the eight impeachment articles.\n\n\"It's a farce, and it's a stunt, and everybody knows it,\" Hegseth said during his first Pentagon news conference in six months.\n\nThe articles accuse Hegseth of waging war in contravention of Congress, carrying out extrajudicial killings tied to boat strikes in the Caribbean against purported drug smugglers and suppressing free speech by targeting Sen. Mark Kelly, D-Ariz., a military veteran.\n\nMassie, a libertarian who lost his Republican primary in May after clashing with President Donald Trump , kicked off the impeachment battle less than a week after a blue-wave midterm that will flip House and Senate control to Democrats.\n\nRep. Hakeem Jeffries , D-N.Y., who is poised to be speaker of the House in the next Congress, on Sunday said Democrats are a \"hard yes\" on impeaching Hegseth. He reiterated his support on Monday in a press conference.\n\nThe House is set to vote Tuesday on a procedural motion related to the impeachment resolution. If it passes, the measure will proceed to a debate and vote. Impeachment resolutions are privileged, meaning the House must act on them, table them or vote to refer them to committee within two legislative days.\n\nHegseth accused Massie of performing a \"stunt\" that sends dangerous signals to America's enemies.", "source": "CNBC Top News", "pub_date_str": "10 Nov 2026, 08:18 PM IST", "pub_date_relative": "53m ago"}, {"title": "Oil falls below $90 as Trump pulls back from threat to strike Iran", "full_content": "Falling crude prices have supported recovery in global stocks from last week\u2019s sell-off", "source": "FT Markets", "pub_date_str": "10 Nov 2026, 08:16 PM IST", "pub_date_relative": "56m ago"}, {"title": "FDA warns of vision loss risk linked to popular GLP-1 drugs like Wegovy, Zepbound", "full_content": "The U.S. Food and Drug Administration is requiring new safety warnings on all GLP-1 drugs after finding evidence of a potential increased risk of a rare eye condition, the agency said on Monday.\n\nThe condition, which can cause sudden vision loss, known as nonarteritic anterior ischemic optic neuropathy (NAION), is rare, and a causal relationship has not been established.\n\nThe FDA is requiring the makers of all GLP-1 medications to add a warning about the potential increased risk of NAION associated with use of these medications, it said.\n\nNAION is a condition that can result in sudden decreased vision, including permanent vision loss. It is caused by decreased blood flow to the front part of the \u200boptic nerve \u2014 the underlying cause is not completely understood, however.\n\nNAION cases have been reported for all currently marketed GLP-1 products, the FDA said.\n\nOzempic and Wegovy maker Novo Nordisk said it \"continues to believe the data do not establish a cause-and-effect relationship, and we remain confident in the benefit-risk profile of our GLP-1 medicines.\"\n\nCNBC has reached out to Eli Lilly, the company behind Mounjaro, Zepbound and Foundayo, for comment.\n\nDiabetes itself is a known risk factor for NAION, complicating efforts to determine if cases among GLP-1 users are caused by the medications or by patients' underlying health conditions.", "source": "CNBC Top News", "pub_date_str": "10 Nov 2026, 08:13 PM IST", "pub_date_relative": "59m ago"}, {"title": "Jim Cramer's top 10 things to watch in the stock market Tuesday", "full_content": "Futures are down after a higher-than-expected consumer price index this morning stoked inflation concerns.", "source": "CNBC Top News", "pub_date_str": "10 Nov 2026, 08:13 PM IST", "pub_date_relative": "59m ago"}, {"title": "Scene Box Office Collection Day 5: Will Suriya Starrer Cross Rs 100 Crore Mark Today? Check Total Earnings", "full_content": "The film added \u20b99.10 crore to its India net collection on Tuesday, taking its five-day total closer to the \u20b9100-crore mark.", "source": "NDTV Profit", "pub_date_str": "10 Nov 2026, 08:09 PM IST", "pub_date_relative": "1h ago"}, {"title": "'Not A Refuge From Hype': Anand Mahindra Says India Has A Compelling AI Opportunity Of Its Own", "full_content": "Anand Mahindra argues that India's software capabilities, domestic market and AI application ecosystem could drive its next phase of growth, beyond the global race for chips and foundational models.", "source": "NDTV Profit", "pub_date_str": "10 Nov 2026, 08:04 PM IST", "pub_date_relative": "1h ago"}, {"title": "Stocks, Bonds Fall as CPI Data Fuel Fed-Hike Bets: Markets Wrap - Bloomberg.com", "full_content": "Stocks, Bonds Fall as CPI Data Fuel Fed-Hike Bets: Markets Wrap Bloomberg.com S&P 500 falls slightly after hot CPI as tech shares try to keep comeback going: Live updates CNBC Stock market today: Dow, S&P 500, Nasdaq trade mixed ahead of key inflation data Yahoo Finance Stocks cut gains, dollar and yields up as US CPI cements December rate hike bets Reuters US stocks stumble after a discouraging update on inflation KSL News", "source": "Google News Business", "pub_date_str": "10 Nov 2026, 08:03 PM IST", "pub_date_relative": "1h ago"}, {"title": "US Stock Market Today: Dow, Nasdaq Trade Lower As Hotter CPI Fuels Fed Rate Hike Fears", "full_content": "The S&P 500 fell 0.7% to 7,497 whereas it had logged its best day since April just yesterday, while Dow Jones Industrial Average slipped 0.4% to 52,168. Nasdaq 100 also declined 1.20% to 27,571.", "source": "NDTV Profit", "pub_date_str": "10 Nov 2026, 08:02 PM IST", "pub_date_relative": "1h ago"}, {"title": "Does anyone feel safe from layoffs right now?", "full_content": "In late October, Bashel Lubarsky had a feeling something was off when she got a DM from her co-worker on the way to work. Once she opened her email and saw a note announcing layoffs, Lubarsky suspected she'd been cut.\n\nMinutes later, Lubarsky stepped off the subway to join an impromptu Zoom meeting with HR and got laid off in the middle of downtown Brooklyn, New York.\n\nUp until that point, Lubarsky, 28, says she held two ideas in her head: On the one hand, she had a feeling the company would be going through another round of October layoffs considering it had done the same in 2025. On the other, she felt pretty secure in her job as a graphic designer and illustrator. She'd gotten a promotion earlier in the year, had essential skills used across multiple projects and jokes that she was likely the \"cheapest\" member of her team. \"I never thought my job wasn't safe,\" Lubarsky tells CNBC Make It.\n\nLubarsky's experience hits home for many Americans these days . Despite official numbers saying the job market is relatively stable , with new jobs opening up, increased hiring and a steady unemployment rate , an increasing number of workers can't shake the feeling that layoffs are just around the corner and that nothing \u2014 not an artificial intelligence-related job, stellar performance or company success \u2014 is enough to keep them safe.\n\nAccording to the American Psychological Association's spring survey of 2,009 employed adults, some 32%, or 1 in 3, U.S. workers say they're concerned about losing their job in the next few weeks or months, up from 26% in 2025.\n\nU.S. employee engagement fell to 29% in the third quarter of 2026, its lowest level since 2011, according to Gallup . And employee confidence fell to its lowest point in September since Glassdoor began measuring it in 2016; confidence rebounded slightly in October, per Glassdoor's latest analysis, but remains near record lows.\n\nDespite the sour outlook, layoffs are less severe today than they were a year ago.", "source": "CNBC Top News", "pub_date_str": "10 Nov 2026, 08:00 PM IST", "pub_date_relative": "1h ago"}, {"title": "TSMC to invest up to $1 billion in Anthropic, OpenAI", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a TSMC to invest up to $1 billion in Anthropic, OpenAI Powered By The Economic Times daily newspaper is available online now. Read Today's Paper TSMC to invest up to $1 billion in Anthropic, OpenAI SECTIONS TSMC to invest up to $1 billion in Anthropic, OpenAI Reuters Last Updated: Nov 10, 2026, 07:52:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis TSMC is set to invest up to $1 billion in the AI landscape, directing $500 million each to Anthropic and OpenAI. As Anthropic prepares for its IPO, this financial move by TSMC underscores its belief in a booming AI industry. With surging demand for AI chips, TSMC also aims to enhance its production capabilities, reinforcing its role in evolving AI infrastructure.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "10 Nov 2026, 07:52 PM IST", "pub_date_relative": "1h ago"}, {"title": "Jailer 2 Box Office Day 27: Rajinikanth Starrer Holds Steady, Check Latest Collection", "full_content": "Jailer 2's Day 27 collection is lower than Monday's \u20b91.25 crore, according to Sacnilk's latest live estimate.", "source": "NDTV Profit", "pub_date_str": "10 Nov 2026, 07:50 PM IST", "pub_date_relative": "1h ago"}, {"title": "FPIs return to Dalal Street amid AI sell-off and oil slump; Can proposed tax cuts sustain inflows?", "full_content": "A Ksheerasagar ( with inputs from Deutsche Welle ) Published 10 Nov 2026, 07:48 PM IST Prefer Livemint on Google Indian stocks have staged a strong comeback in recent sessions, with benchmark indices witnessing a sustained rally that bulls had been eagerly awaiting since the beginning of the year.\n\nWhile there have been no significant domestic triggers behind the upmove, the rally has largely been driven by the return of foreign investors, who had largely stayed away from Asia's third-largest economy in recent months.\n\nTheir shift in sentiment comes amid a rotation away from AI-linked stocks, driven by concerns over a slowdown in data center expansion following the Democrats' victories in both houses.\n\nA sharp retreat in crude oil prices has also boosted foreign investors' optimism towards Indian equities, prompting FPIs to pour \u20b9 53,739 crore into domestic stocks in November so far, according to NSDL data. The inflows have helped the Nifty 50 extend its winning streak to seven consecutive sessions, enabling the benchmark index to pare its year-to-date losses to 4.15%.\n\nThe key question now is whether the return of foreign investors signals a durable turnaround or is merely a tactical shift driven by global developments and expectations of tax relief.\n\nTo understand what is driving the change in FPI sentiment, the possibility of capital gains tax relief, and whether the recent inflows can be sustained, Manoj Purohit, Partner & Leader, Financial Services Tax, Tax & Regulatory Services, BDO India, shared his views.\n\nForeign investors are reassessing their current exposure to India amid ongoing discussions and representations by industry bodies and various associations seeking tax breaks on long-term investments.\n\nIn addition to expectations of tax relief, the recent US midterm elections could influence the revision and revival of various trade policies.", "source": "LiveMint Markets", "pub_date_str": "10 Nov 2026, 07:48 PM IST", "pub_date_relative": "1h ago"}, {"title": "Central govt pension rules clarified: Who can commute pension without medical tests and when is examination compulsory", "full_content": "Central government pensioners can receive a lump-sum payment by commuting a portion of their monthly pension without necessarily undergoing a medical examination. However, whether they qualify for this facility depends on their pension category and when they submit their application.\n\nThe Department of Pension and Pensioners\u2019 Welfare (DoPPW) has issued a series of clarifications dated October 29, 2026, explaining the rules governing pension commutation under the Central Civil Services (Commutation of Pension) Rules, 1981. The clarifications cover eligibility for commutation without medical examination, the one-year application deadline, cases requiring medical fitness tests and the treatment of pension applications after departmental or judicial proceedings.\n\nFor retiring government employees, the timing of the application is particularly important. Even pensioners who are otherwise eligible to commute their pension without a medical examination may have to undergo one if they miss the prescribed deadline.\n\nUnder Rule 12 of the CCS (Commutation of Pension) Rules, 1981, five categories of pensioners can commute a portion of their pension without undergoing a medical examination.\n\nThe department has also clarified that provisional pension sanctioned under Rule 62 is covered in the specified categories of superannuation, retiring and compensation pension.\n\nThese provisions apply to pensions authorised under the CCS (Pension) Rules, 2021, through Rule 84(2), which makes the 1981 commutation rules applicable.\n\nUnder Rule 13 of the CCS (Commutation of Pension) Rules, 1981, pensioners belonging to the eligible categories must submit their application in the prescribed form within one year of retirement to commute a portion of their pension without a medical examination.\n\nThe application can be submitted any time after the day following retirement, but before the expiry of one year from the retirement date.", "source": "LiveMint Money", "pub_date_str": "10 Nov 2026, 07:43 PM IST", "pub_date_relative": "1h ago"}, {"title": "How much you can make in 2027 and still pay 0% capital gains tax", "full_content": "The IRS has released the capital gains tax brackets for 2027 , which include a six-figure earnings limit for the 0% rate for married couples.\n\nIf you're eager to sell profitable brokerage account investments, higher income thresholds for the 0% rate could help reduce your tax bill , experts say.\n\n\"The 0% capital gains bracket is easily one of the most overlooked strategies for tax-free income,\" said Stephen Maggard, a certified financial planner with Abacus Planning Group in Columbia, South Carolina.\n\nBut it's important to know how the tax brackets work and the possible trade-offs before selling investments.\n\nDespite recent stock market volatility , many investors have portfolio gains after years of market growth . As of market close Nov. 9, the S&P 500 was up about 10% year-to-date. The index also returned more than 16% in 2025, and over 23% in 2024.\n\nIf you're planning to leverage the 0% capital gains bracket in 2027 to sell or rebalance brokerage account assets, here are some key things to know.\n\nThe capital gains brackets \u2014 with rates of 0%, 15% or 20% \u2014 apply to assets owned for more than one year, known as long-term capital gains. By contrast, investments held for one year or less are short-term gains, subject to regular income tax rates .\n\nYour rate depends on taxable income, which you calculate by subtracting the greater of the standard or itemized deductions from your adjusted gross income , or AGI. Taxable income also includes any gains from investments that year.", "source": "CNBC Top News", "pub_date_str": "10 Nov 2026, 07:42 PM IST", "pub_date_relative": "1h ago"}, {"title": "Anthropic Unveils New Fable, Mythos AI Models Ahead Of IPO", "full_content": "Anthropic said Fable 5.2, set to be released Monday, can tackle more difficult software engineering work, take on more hardware-related tasks like controlling robots and handle long-running projects.", "source": "NDTV Profit", "pub_date_str": "10 Nov 2026, 07:40 PM IST", "pub_date_relative": "1h ago"}, {"title": "Here\u2019s how Bernie Sanders wants to keep Social Security solvent \u2018for generations\u2019", "full_content": "The Vermont senator aims to eliminate the taxable maximum, making the wealthy pay more in taxes", "source": "MarketWatch Top Stories", "pub_date_str": "10 Nov 2026, 07:40 PM IST", "pub_date_relative": "1h ago"}, {"title": "IRCTC Denies E-Ticketing Portal Outage, Says 'Heavy Festive Rush\u2019 Triggered Temporaray Login Snags", "full_content": "IRCTC said its e-ticketing portal remained operational on November 10, but heavy concurrent logins amid festive bookings caused temporary delays for some users.", "source": "NDTV Profit", "pub_date_str": "10 Nov 2026, 07:37 PM IST", "pub_date_relative": "1h ago"}, {"title": "Anthropic Run-Rate Revenue Jumps $10B To $81B; Discloses $900.9B In Total Spend Commitments", "full_content": "Anthropic's annualised revenue reached $81 billion by October 31, up $10 billion in a month, even as the AI company disclosed nearly $901 billion in aggregate spending commitments.", "source": "NDTV Profit", "pub_date_str": "10 Nov 2026, 07:36 PM IST", "pub_date_relative": "1h ago"}, {"title": "Salary slip shows PF deduction, but is the full amount reaching your EPF account? How to check and report shortfalls", "full_content": "Salaried employees usually check their salary slips to see whether provident fund (PF) has been deducted every month. However, this does not confirm that the employer has deposited the contribution with the Employees\u2019 Provident Fund Organisation (EPFO) and credited it to the employee's EPF account.\n\nCompanies covered under EPFO are required to deposit both the PF deducted from employees' salaries and their own matching contribution to the retirement fund within 15 days of the close of the month.\n\nBoth the employee and the employer contribute 12% of the employee's basic salary plus dearness allowance ( DA ) to EPF and the accumulated corpus can be used for financial needs after retirement. Mandatory EPF rules apply to a statutory wage ceiling of \u20b9 25,000 under the current framework.\n\nYou can check whether your employer is depositing PF contributions every month through the EPFO member portal. By accessing the EPF passbook, one can check the contributions credited under one's Universal Account Number (UAN), including one's contribution, employer's contribution and Employees\u2019 Pension Scheme ( EPS ) contribution, if applicable.\n\nNow, employees also have the option to keep track of their EPF contributions on WhatsApp. You can check your balance, view the last five transactions and download the PF passbook without logging in to the EPFO member portal.\n\nTo use the service, members need to send a simple 'Hi' message to EPFO's verified WhatsApp number, +91 8796441800.\n\nIt is advisable to check your EPF passbook every few months and compare the entries with your salary slips to ensure the deducted amount is not less than the deposited amount.", "source": "LiveMint Money", "pub_date_str": "10 Nov 2026, 07:34 PM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "Anthropic sets IPO price range of $70 to $78, looks to start trading Nov. 19, sources say", "full_content": "Anthropic said it will offer 825 million shares in its upcoming IPO at a price range between $70 and $78 per share, according to an updated filing on Tuesday, bringing the 5-year-old artificial intelligence lab a step closer to a potentially historic Nasdaq debut.\n\nThe company is planning to price on Nov. 18 and trade on Nov. 19, according to people familiar with the details who were granted anonymity because they were not authorized to speak publicly. Anthropic is targeting retail allocation of about 20%, the people said, a much higher percentage than the typical initial public offering, which is 5% to 10% for retail investors.\n\nAt the high end of the range, Anthropic would net up to $64.35 billion in proceeds through the IPO. The company could end up being worth up to $1.405 trillion on a fully diluted basis, rising from the $965 billion valuation it announced as part of a funding round in May.\n\nAnthropic said it has entered into an agreement with Advanced Micro Devices , Broadcom , Google , Micron , Microsoft , Nvidia and Taiwan Semiconductor Manufacturing Co. to purchase $26 billion of the company's Class N common stock in a private placement at a price per share equal to the IPO price. The shares sold in the private placement will not be registered in the offering and will not be subject to lock-up agreements with the underwriters, the company said.\n\nAs Anthropic executives get set to pitch the offering to investors, they have to contend with a tumultuous political environment , following last week's midterm elections that included a Democratic sweep in Congress and the passage of numerous statewide ballot measures that could slow the AI buildout.", "source": "CNBC World Economy", "pub_date_str": "10 Nov 2026, 09:12 PM IST", "pub_date_relative": "just now", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Stocks making the biggest moves in early trading: Sanmina, Hims & Hers, Securitize & more", "full_content": "Tokenization stock Securitize was among the big gainers in early trading Tuesday , after the company reported strong third-quarter results. Other stocks making moves include:\n\nFollow below as CNBC breaks down the biggest stock market moves of the day:\n\nData center power producer GE Vernova is sliding in Tuesday morning trading following revisions from SoftBank on its power equipment procurement strategy. Shares of GEV are down close to 7% as of 10:35 a.m. ET.\n\nShare of Steel Dynamics were up 4% after the company announced an additional $3 billion authorization for share repurchases. The authorization is effective immediately and is additive to the previous $1.5 billion program, which had $216 million remaining authorized and available for repurchase on Sept. 30, 2026.\n\nSteel dynamics - year to date The company's board of directors also declared a quarterly cash dividend of 53 cents per common share. The dividend is payable to shareholders of record at the close of business on Dec. 31, and is payable on or about Jan. 8, 2027.\n\n\"These actions reflect the Board's and senior leadership's continued confidence in our ability to consistently provide meaningful, industry-leading free cash flow generation throughout all market environments, in order to both continue our strong growth strategy and provide significant shareholder returns,\" stated Mark D. Millett, Chairman and Chief Executive Officer.\n\nChipmaker Nvidia is sagging for the second day in a row after CEO Jensen Huang issued an apology in the wake of a report that he was the target of a potential Chinese spying operation. Shares of the company were down 4% as of 9:45 a.m. in Tuesday trading. On Monday, shares also dropped 4%. Shares are down 25% over the past month amid broader struggles in the tech trade.\n\nShares of American Airlines were flat, outperforming the broader market after Rothschild upgraded the airline to buy from neutral.", "source": "CNBC Top News", "pub_date_str": "10 Nov 2026, 09:10 PM IST", "pub_date_relative": "2m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Nvidia falls for second day as investors weigh fallout of CEO\u2019s affair with alleged spy", "full_content": "Nvidia shares sank a further 4% on Tuesday as investors continued to weigh the potential fallout from CEO Jensen Huang 's affair with an alleged Chinese spy.\n\nShares closed more than 4% lower on Monday, the day after Huang told staff in an email that he had been \"unfaithful\" to his wife and had \"fallen short\" of his responsibilities as CEO.\n\nHe reportedly had an affair with Alice Huang, an executive at Megaspeed , an Nvidia customer. The New York Times on Oct. 29 reported that U.S. officials had concluded she was \"a Chinese intelligence asset, funneling information to Beijing\" and \"possibly steering advanced Nvidia A.I. chips to China.\"\n\nU.S. President Donald Trump said Monday that the FBI is investigating .\n\n\"I've been reading a little bit about it over a period of time, but not too long ago,\" Trump told reporters at the White House . \"We'll look into it. I know the FBI is looking into it in terms of something else, and I think that he'll be in good shape.\"\n\nNvidia shares over the past five days. Adding to the tech giant's woes was a class-action shareholder lawsuit filed against Nvidia and Huang in federal court in San Jose, California.\n\nThe Rosen Law Firm's suit alleges the defendants made false or misleading statements about his affair with Huang and Nvidia's relationship with Megaspeed, thereby presenting a material risk to the company's reputation and business prospects.\n\n\"Right now the Street and investor chatter is assigning roughly a 15% chance he is removed as CEO of Nvidia with a high probability (85%) he stays on as CEO after the Board investigation is completed,\" said Dan Ives, senior and managing director at Yorkville Ives & Co, in a Tuesday note.", "source": "CNBC World Economy", "pub_date_str": "10 Nov 2026, 09:01 PM IST", "pub_date_relative": "10m ago", "cfa_topics": ["Quantitative Methods", "Corporate Issuers", "Ethical & Professional Standards"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "Elon Musk was half right in his comment last week about SoftBank backpedaling on a gas-turbine order", "full_content": "Elon Musk in a social-media post last week said that SoftBank \u201cdefaulted\u201d on a gas-turbine order. The truth, revealed Tuesday in the Japanese\u2019s investment company\u2019s second-quarter earnings, wasn\u2019t far off.", "source": "MarketWatch Top Stories", "pub_date_str": "10 Nov 2026, 09:00 PM IST", "pub_date_relative": "12m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Factbox-Amazon, Google set for big windfall from Anthropic IPO", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Nov 2026, 08:55 PM IST", "pub_date_relative": "17m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Wall St falls as hot inflation data fuels rate-hike jitters", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Nov 2026, 08:54 PM IST", "pub_date_relative": "17m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Earnings call transcript: Caixa Seguridade posts solid Q3 2026 results, stock rises", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Nov 2026, 08:53 PM IST", "pub_date_relative": "19m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Bhai Dooj gift tax rules: Got money or gold from your brother? Check when festival presents become taxable", "full_content": "Following Dhanteras and Diwali, Indians are set to celebrate Bhai Dooj on Wednesday, November 11 this year, a traditional Hindu festival that honours the special bond between brothers and sisters.\n\nThis occasion is often celebrated by exchanging presents, with cash, gold, jewellery and other valuable items among the popular choices.\n\nHowever, such transfers may have tax implications depending on the relationship between the giver and the recipient and the value of the item being gifted.\n\nAny gifts received by a sister from her blood brother or sibling is exempt from income tax, irrespective of its value. Under Section 56(2)(x) of the Income-tax Act, 1961, gifts such as cash, jewellery and other assets received from specified relatives are tax-free, and brother is included in the definition of a relative.\n\nEven if the brother is a minor and the gift is funded by parents, no tax is applicable, as both the mother and father are also classified as relatives. This is true even if the value of the gift exceeds \u20b9 50,000.\n\nHowever, tax exemption does not necessarily mean that the gift does not have to be disclosed in your income tax return ( ITR ). Large financial gifts should be reported under the \u2018Receipts not in the nature of income\u2019 field in the ITR utilities, which is meant for disclosing such tax-exempt receipts.\n\nFor example, if your brother gifts you \u20b9 1 lakh in cash or gold worth \u20b9 3 lakh tomorrow, you must report the amount in your tax return for AY 2027-28, which is during the next tax filing season.\n\nAs per income tax rules, gifts received from maternal or paternal cousins are not exempt from tax if their aggregate value exceeds \u20b9 50,000 in a financial year. The same rule applies to gifts received from people who are not related to you, such as friends or neighbours, even if they are given during Bhai Dooj.", "source": "LiveMint Money", "pub_date_str": "10 Nov 2026, 08:52 PM IST", "pub_date_relative": "19m ago", "cfa_topics": ["Fixed Income", "Alternative Investments"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Earnings call transcript: Gilat Satellite Networks Q3 2026 revenue miss hits shares", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Nov 2026, 08:52 PM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Earnings call transcript: Urban One Q3 2026 loss widens as stock falls 7.7%", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Nov 2026, 08:51 PM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "EXCLUSIVE: Anthropic eyes $1.4 trillion IPO valuation in test of Wall Street's AI fervor - Reuters", "full_content": "EXCLUSIVE: Anthropic eyes $1.4 trillion IPO valuation in test of Wall Street's AI fervor Reuters Anthropic to Seek $1.3 Trillion Valuation in IPO WSJ Anthropic seeks $1.4 trillion valuation in highly anticipated IPO amid AI boom Yahoo Finance Anthropic heads for lower than expected $1.3 trillion valuation in stock market debut BBC Anthropic Plans IPO Live Stream With Amodei, JPMorgan CEO Dimon Bloomberg.com", "source": "Google News Business", "pub_date_str": "10 Nov 2026, 08:48 PM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Traders raise odds of 50 bps Fed rate hike as CPI rise exceeds expectations", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a Traders raise odds of 50 bps Fed rate hike as CPI rise exceeds expectations Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Traders raise odds of 50 bps Fed rate hike as CPI rise exceeds expectations SECTIONS Traders raise odds of 50 bps Fed rate hike as CPI rise exceeds expectations ETMarkets.com Last Updated: Nov 10, 2026, 09:08:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis New data has revealed that US consumer prices rose faster than anticipated, prompting speculation about interest rate changes. Fed Governor Christopher Waller suggested a half percentage point hike may be necessary if core prices continue rising. The Consumer Price Index showed a month-over-month increase of 0.4% in October, with core inflation remaining persistent. The bond market reacted strongly to these developments, significantly affecting Treasury yields.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "10 Nov 2026, 08:45 PM IST", "pub_date_relative": "26m ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Rivian CEO says new R2 SUV, autonomy make 2027 an \u2018inflection year\u2019 as EV maker marks five years since IPO", "full_content": "It's been five years since Rivian Automotive celebrated its initial public offering with CEO and founder RJ Scaringe ringing the Nasdaq opening bell from the company's factory in Normal, Illinois, while the company's sleek vehicles sat outside the stock exchange in Times Square.\n\nIt was a euphoric time for all-electric vehicle companies that has since diminished . And much like the EV hype, Rivian's stock price is down more than 80% since the Amazon -backed company debuted on the Nasdaq at $78 per share on Nov. 10, 2021. That includes a nearly 30% decline this year.\n\nA host of internal and external factors have contributed to Rivian's stock decline, but the company continues to be the most promising EV maker to emerge during the early 2020s, as most of its peer group to go public during that time no longer exists .\n\nRivian founder and CEO RJ Scaringe acknowledges that not everything has gone to plan amid supply chain shortages, geopolitical tensions and slower-than-expected consumer EV adoption , but he said he believes the next year will prove to be a catalyst for the company and investors.\n\n\"2027 is really an inflection year for us,\" Scaringe told CNBC during an exclusive interview. \"I'm excited to start to really show what we believe so fully, the potential of the business.\"\n\nScaringe's bullishness comes as Rivian ramps up production of its midsize R2 SUV \u2014 meant to expand the brand to the mainstream market \u2014 and as the company continues to invest in its next generation of vehicle software and autonomy.\n\nScaringe said the R2, with an entry-level model at about $45,000, remains the core business to be able to showcase its newest technologies. Rivian delivered a record 19,248 vehicles in the third quarter of 2026, up 46% year over year, and said R2 was already its best-selling vehicle by volume, outselling both its R1 flagship products and its commercial van.\n\n\"That's going to define the business.", "source": "CNBC Top News", "pub_date_str": "10 Nov 2026, 08:41 PM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "As Nvidia probes Jensen Huang affair, here\u2019s the board member likely to play a big role", "full_content": "Nvidia's investigation into CEO Jensen Huang over his affair with an alleged Chinese spy may hinge on a longtime criminal defense attorney with an extensive resume dealing with corporate scandals.\n\nStephen Neal is Nvidia's lead independent director and head of corporate governance. The company has not named specific investigators handling the allegations surrounding its CEO, but Nvidia said the board is leading the probe with help from outside counsel and Neal's experience makes him a likely key figure in the investigation.\n\nNvidia's board has said there is \"no reason to believe that either national security or Nvidia secrets were compromised.\" China has dismissed the espionage allegations, which were reported by The New York Times . Huang, one of the most powerful businessmen in the artificial intelligence boom, said he would \"cooperate fully\" with the process.\n\nNvidia's board has 10 independent members, including a former president of Taco Bell , a former Eli Lilly executive and a former vice chairman from Goldman Sachs .\n\nNeal, who joined Nvidia's board of directors in 2019, is a chairman emeritus and senior counsel of the law firm Cooley LLP, where he also served as CEO from 2001 to 2008.\n\nHe's previously represented Theranos founder Elizabeth Holmes and late financier Charles Keating, Jr.\n\nIt won't be his first corporate governance probe. According to Cooley , Neal has litigated cases across securities, bankruptcies, antitrust, takeovers and more. And he's conducted several investigations for multiple boards of directors, including at General Motors , where he advised the company in disputes with Ross Perot.\n\nAccording to the firm, Neal has conducted several investigations for committees of directors and independent directors, though most of those client names are confidential. He's also handled investigations with the Securities and Exchange Commission for both corporations and individuals.", "source": "CNBC World Economy", "pub_date_str": "10 Nov 2026, 08:40 PM IST", "pub_date_relative": "31m ago", "cfa_topics": ["Corporate Issuers", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "US stocks: US market opens lower after October's hot inflation print", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a US stocks: US market falls as hot inflation revives rate-hike fears; Nvidia sinks Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US stocks: US market falls as hot inflation revives rate-hike fears; Nvidia sinks SECTIONS US stocks: US market falls as hot inflation revives rate-hike fears; Nvidia sinks Reuters Last Updated: Nov 10, 2026, 09:03:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis On Tuesday, Wall Street faced a downturn as inflation figures surpassed projections, raising worries about potential interest rate hikes. The declines were evident across the Dow Jones Industrial Average, S&P 500, and Nasdaq Composite indices. While financial stocks showed minor gains, technology shares, especially Nvidia, experienced fluctuations due to uncertainty in leadership. Anthropic's looming IPO threatens to heat up competition in the AI field.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "10 Nov 2026, 08:40 PM IST", "pub_date_relative": "32m ago", "cfa_topics": ["Economics", "Corporate Issuers", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Monthly US inflation higher than expected in October", "full_content": "Figure of 0.4% comes as last year\u2019s government shutdown prevented data collection", "source": "FT Markets", "pub_date_str": "10 Nov 2026, 08:36 PM IST", "pub_date_relative": "36m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Easing global headwinds, lower crude oil prices may further lift rupee in coming months: Economists", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Indicators \u203a Easing global headwinds, lower crude oil prices may further lift rupee in coming months: Economists The Economic Times daily newspaper is available online now. Read Today's Paper Easing global headwinds, lower crude oil prices may further lift rupee in coming months: Economists SECTIONS Easing global headwinds, lower crude oil prices may further lift rupee in coming months: Economists ANI Last Updated: Nov 10, 2026, 08:34:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Economists predict the Indian rupee will strengthen against the US dollar in the coming months. Factors contributing to this appreciation include lower crude oil prices and improving foreign capital inflows. Additionally, a weaker US dollar and th
