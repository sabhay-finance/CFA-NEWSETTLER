    const allData = {"general": [{"title": "Rs 5,000 SIP vs Rs 5 Lakh Lumpsum: What Gives Better Results In 10 Years?", "full_content": "A Rs 5,000 monthly SIP and a Rs 5-lakh lump-sum investment may look similar at first. However, depending on market timing, fund house and other aspects, they can work very differently.", "source": "NDTV Profit", "pub_date_str": "14 Nov 2026, 07:45 PM IST", "pub_date_relative": "8m ago"}, {"title": "Bank of America says these stocks have major upside potential in an uncertain market", "full_content": "Bank of America named several stocks that still have more room to run despite market jitters.", "source": "CNBC Top News", "pub_date_str": "14 Nov 2026, 07:43 PM IST", "pub_date_relative": "9m ago"}, {"title": "How Canadian stocks could be big winners of U.S. midterms", "full_content": "Canadian stocks are up more than 1% since the vote, while the S&P 500 has sagged 0.5% in that time.", "source": "CNBC Top News", "pub_date_str": "14 Nov 2026, 07:41 PM IST", "pub_date_relative": "11m ago"}, {"title": "Dividend king PSU stock: Down 23% in 6 months! Nuvama sees 42% upside; target price, rationale", "full_content": "NMDC Sharmila Bhadoria Published 14 Nov 2026, 07:41 PM IST Prefer Livemint on Google Shares of PSU ended marginally lower on Friday, November 13, reversing all its gains made over the previous sessions in the week. Volatility in the PSU stock coincided with the announcement of second quarter results for the financial year 2026-27.\n\nThe government-backed iron ore mining giant is likely to see an uptick in volume in the second half of financial year 2026-27 as supplies have now normalised after monsoon-led logistic disruption, according to Nuvama which sees nearly 42% upside potential in the stock.\n\nNMDC reported lower-than-expected second quarter EBITDA of \u20b9 19.4 billion, which is down 3% on an annual basis. However, EBITDA/t was marginally lower by \u20b9 17/t on an annual basis to \u20b9 1,853, weighed by higher royalty and premium cost and lower sales volume, noted Nuvama in its report. The brokerage also reduced its FY27 EBITDA by nearly 8% to factor in the performance in the first half of FY27.\n\nNuvama maintained a \u2018Buy\u2019 rating for the stock with a target price of \u20b9 100 per share for a period of 12 months. \u201cRetain \u2018BUY\u2019 with a TP of INR100 (earlier INR97), valuing at 9x FY28E and FY29E average EPS; trades at 6.4x FY28E EPS at CMP.\u2019\n\nNMDC is one of the top PSUs with attractive dividend yield and strong dividend history. The PSU stock has rewarded investors with dividend continuously over the last twenty five years. The PSU stock\u2019s annual dividend yield stood at 3.6% in the financial year 2025-26.\n\nThe stock closed 1.76% lower at \u20b9 69.90 per share on BSE with a market capitalisation of \u20b9 61,454.80 crore on Friday, November 13. Its share price value has declined 2.17% in one month, 17.74% in three months, and 23% in six months.\n\nCatch all the Business News , Market News , Breaking News Events, JIO IPO Listing Today LIVE and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.\n\nLog in to our website to save your bookmarks.", "source": "LiveMint Markets", "pub_date_str": "14 Nov 2026, 07:41 PM IST", "pub_date_relative": "12m ago"}, {"title": "Ram Charan Is 'Parenting': Upasana Konidela Questions Why Fathers Are Praised For Doing Basic Duties", "full_content": "Upasana Konidela questioned why fathers are often praised for doing basic childcare duties while mothers are expected to do them without recognition.", "source": "NDTV Profit", "pub_date_str": "14 Nov 2026, 07:39 PM IST", "pub_date_relative": "13m ago"}, {"title": "Disruptions Persist as Air Travel Recovers from Nationwide Ground Stop: Live Updates - The New York Times", "full_content": "Disruptions Persist as Air Travel Recovers from Nationwide Ground Stop: Live Updates The New York Times FAA ground stop latest updates: Thousands more flights canceled Saturday; officials blame overloaded routers; no sign of cyberattack Yahoo Thousands of flights canceled as airlines work to dig out from nationwide ground stop AP News FAA ground stop throws sports world into travel chaos ahead of weekend games ESPN Hundreds of canceled at Chicago O'Hare, Midway airports on Saturday after nationwide ground stop lifted CBS News", "source": "Google News Business", "pub_date_str": "14 Nov 2026, 07:39 PM IST", "pub_date_relative": "14m ago"}, {"title": "Tukaram Mundhe Strikes: 5 Reasons Why FDA Suspended Licences Of Pune's Vaishali, Roopali Restaurants", "full_content": "Vaishali received only 58 marks out of 98 in the non-compliance criteria with the FDA flagging various major deficiencies.", "source": "NDTV Profit", "pub_date_str": "14 Nov 2026, 07:39 PM IST", "pub_date_relative": "14m ago"}, {"title": "Who Owns Jalsa? Amitabh Bachchan\u2019s Sister-In-Law Questions Transfer Of Bungalow To Wife Jaya", "full_content": "Ramola Bachchan alleges the 1993 transfer to Jaya Bachchan was made without her consent, raising questions over the gift deed and conflicting property ownership records.", "source": "NDTV Profit", "pub_date_str": "14 Nov 2026, 07:38 PM IST", "pub_date_relative": "15m ago"}, {"title": "Juice your growth and save on taxes in this workplace investment account", "full_content": "Workers are in the heart of open enrollment season for next year's benefits, and rising healthcare costs are shining a spotlight on an offering that includes a tax-advantaged investment account.\n\nHealthcare expenses are climbing for workers and employers alike, with average total family premiums, including the employer's share, averaging $28,303, up 5% from a year ago, according to data from health policy organization KFF , formerly the Kaiser Family Foundation.\n\nTo manage the costs, a growing number of employers are moving to high-deductible health plans, which work alongside health savings accounts or HSAs. Almost 40% of companies with at least 10 employees that offer health benefits also have an HSA-qualified plan, KFF found.\n\nHealth savings accounts have three major tax advantages. First, contributions that your employer automatically deducts from your pay aren't taxed. Second, money stashed into the HSA grows free of taxes. Finally, you can make tax-free withdrawals for qualified health expenses \u2013 just be sure to save your receipts.\n\n\"I love HSAs because of their triple-tax advantage,\" said Eileen Olson, CFP and founder of Emerald Wealth in Daufuskie Island, South Carolina, near Savannah, Georgia. \"For people who can afford to leave it alone, it can be one of the best retirement accounts they're going to have.\"\n\nIn 2027, those with individual healthcare coverage through a high-deductible plan can stash up to $4,500 in an HSA, including any contributions from employers. That number goes up to $9,000 for family plans. Individuals can kick in a catch-up contribution of $1,000 if they're aged 55 and older and not enrolled in Medicare.\n\nThe HSA differs from the healthcare flexible spending account, known as the FSA.\n\nFSA funds must be used by the end of the plan year unless your employer allows a carryover of up to $700 or an additional 2.5 months to use the money.", "source": "CNBC Top News", "pub_date_str": "14 Nov 2026, 07:38 PM IST", "pub_date_relative": "15m ago"}, {"title": "U.S. air travel could take days to recover after FAA\u2019s lifting of rare nationwide ground stop", "full_content": "Homeland Security Secretary Markwayne Mullin says \u201czero evidence\u201d of cyberattack, while high jet-fuel costs mean fewer flights available to travelers seeking to rebook.", "source": "MarketWatch Top Stories", "pub_date_str": "14 Nov 2026, 07:34 PM IST", "pub_date_relative": "19m ago"}, {"title": "How Nvidia stock crash will impact Indian investors\u2019 US mutual fund and ETF holdings", "full_content": "Nvidia\u2019s sharp stock decline has raised concerns among Indian investors holding mutual funds that invest in US equities. However, the impact on most diversified international funds has been relatively limited, with losses ranging between 1% and 3.2%, despite the chipmaker's shares falling 13% in a week.\n\nThe bigger risk for Indian investors may lie elsewhere, as some US-focused exchange-traded funds ( ETFs ) are trading at substantial premiums to the value of their underlying holdings. This exposes buyers to potential losses even if the stocks themselves remain unchanged.\n\nNvidia shares fell 13% in the week ended November 11. The stock declined another 4.3% the following day after its board opened an inquiry into chief executive Jensen Huang, who subsequently resigned.\n\nFor Indian investors, the correction highlights two distinct risks. These include the concentration of individual stocks in mutual fund portfolios and the premiums investors pay when buying overseas ETFs on Indian exchanges.\n\nAccording to Value Research, most Indian mutual funds investing in US equities lost between 1% and 3.2% during the week ended November 11, considerably less than Nvidia's 13% decline. Three funds even reported positive returns. Mirae Asset NYSE FANG+ ETF FoF gained 7.9%, Motilal Oswal Nasdaq 100 FoF rose 4% and Mirae Asset S&P 500 Top 50 ETF FoF gained 3.2%.\n\nThe difference largely comes down to diversification and how much exposure a fund has to Nvidia.\n\nSeven of India's 60 international funds track the Nasdaq 100, making it the most widely tracked overseas index among these schemes. Nvidia accounts for approximately 8% of the index. Therefore, a 13% decline in the stock would translate into an estimated 1% impact on the index, assuming other constituents remain unchanged.\n\nThe impact was higher in more concentrated indices. Nvidia accounts for around 10% of the NYSE FANG+ index, which holds just 10 companies, and approximately 12% of the S&P 500 Top 50 index.", "source": "LiveMint Money", "pub_date_str": "14 Nov 2026, 07:33 PM IST", "pub_date_relative": "20m ago"}, {"title": "Berkshire breaks out to record high with fourth-quarter rally reaching 19%", "full_content": "(This is the Warren Buffett Watch newsletter, news and analysis on all things Warren Buffett and Berkshire Hathaway. You can sign up here to receive it every Friday evening in your inbox.)\n\nBerkshire Hathaway's red-hot shares are ending a strong week with four consecutive fresh record high closes.\n\nSince the rally began with the start of the fourth quarter on October 1, the Class A shares have closed at record highs 11 times as they soared 19.1%.\n\nThe much more widely held B shares closed at new highs just 10 times but are also up 19.1% from their near-term low.\n\nThe gains are in sharp contrast to the S&P 500's 1.2% dip as investors appear to be seeing Berkshire as a relatively safe haven amid worries about AI stocks and spending.\n\nBoth Berkshire classes were up 3.9% on the week as the S&P advanced by 2.5%, its best week since early August .\n\nBerkshire's B shares are now 7.5 percentage points ahead of the benchmark for the year so far.\n\nAfter erasing their post-Buffett CEO announcement losses three weeks ago, Berkshire shares are now up almost 10% since last year's shareholders meeting.", "source": "CNBC Top News", "pub_date_str": "14 Nov 2026, 07:32 PM IST", "pub_date_relative": "20m ago"}, {"title": "ExlService Holdings evp Ajay Ayyappan sells $224,400 in stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Nov 2026, 07:31 PM IST", "pub_date_relative": "22m ago"}, {"title": "Flight disruptions continue after FAA lifts ground stop, some college football games delayed", "full_content": "Flight disruptions continued on Saturday and could extend through the weekend as airlines raced to recover from the Federal Aviation Administration's longest nationwide groundstop since 9/11, a measure the Trump administration blamed on a communications equipment failure in air traffic control.\n\nMore than 3,000 U.S. flights were canceled Saturday and close to 1,000 were delayed as of 5:45 a.m. ET, according to flight-tracking site FlightAware. That's on top of about 9,000 U.S. flight cancellations and more than 7,000 delays on Friday, though some disruptions were due to bad weather.\n\nPart of the job of untangling from the ground stop includes getting aircraft where they need to be. The ground stop forced many planes to divert to other airports.\n\nAirlines run one of the lightest schedules on Saturday and are deploying as many spare planes and crews as possible to get travelers and employees where they need to be as they're eager to start fresh for the upcoming Thanksgiving holiday period.\n\nAround 3 million people would typically be scheduled to fly on Saturday, according to aviation data firm Cirium.\n\nThe FAA had halted departing U.S. flights around 4 p.m. on Friday, a ground stop that lasted more than four hours. Routers were overloaded with data and started giving air traffic control centers inconsistent information, so the U.S. issued the ground stop, Transportation Secretary Sean Duffy said at a news conference late Friday.\n\nHe blamed outdated U.S. infrastructure for the problem and said Congress needs to approve more money to overhaul the country's air traffic control. Aging equipment and a shortage of air traffic controllers have angered airline executives for years, who have complained about the cost of resulting disruptions.\n\nIt was the second time the FAA has issued a nationwide ground stop since the Sept. 11, 2001 terror attacks. Trump administration officials said it did not appear to be a cyberattack.", "source": "CNBC Top News", "pub_date_str": "14 Nov 2026, 07:31 PM IST", "pub_date_relative": "22m ago"}, {"title": "How Rockstar's 'GTA IV' release could reshape gaming, streaming and even paid time off", "full_content": "It's been 13 years since the last installment of Grand Theft Auto , and fans are getting ready for what analysts say could be the biggest video game launch of all time.\n\nThe latest game in the franchise, \"Grand Theft Auto VI,\" is set to launch on Nov. 19, after Take-Two Interactive's Rockstar Games delayed its launch twice. Roth analyst Eric Handler estimated the game maker spent more than $1 billion developing the game.\n\nSales figures could end up breaking records. Sensor Tower estimated over 12 million preorders through Nov. 13, and Morgan Stanley forecast the game could sell 40 million copies by March 2027.\n\nBeyond launch week, the Grand Theft Auto, or GTA, franchise has a track record of lasting engagement over many years. Even 13 years after launch, \"Grand Theft Auto V\" is one of the top five most viewed games on Twitch this year.\n\nIn anticipation of the game's launch, investors have been taking note: Take-two's stock has more than doubled since the beginning of 2023.\n\nThe release is seen as not only a monumental moment for developer Rockstar Games and parent company Take-Two, but also a massive opportunity for the entire gaming industry.\n\nTake-Two CEO Strauss Zelnick addressed demand in a recent \"Squawk Box\" interview , saying, \"We tend to be pretty judicious when we talk about this sort of thing, but our expectations were high and they are being vastly exceeded so far.\"\n\nStreamers and creators across the digital ecosystem are looking at the launch as a massive opportunity to drive engagement with their content and fuel subscriber and ad revenue growth.", "source": "CNBC World Economy", "pub_date_str": "14 Nov 2026, 07:30 PM IST", "pub_date_relative": "23m ago"}, {"title": "Norway vs Wales Live Streaming: Likely Lineups; Where To Watch UEFA Nations League Match On TV, Online?", "full_content": "Erling Haaland-led Norway will host Wales in a UEFA Nations League Group A4 fixture. Here's where to watch the match live in India.", "source": "NDTV Profit", "pub_date_str": "14 Nov 2026, 07:30 PM IST", "pub_date_relative": "23m ago"}, {"title": "What\u2019s the most tax-efficient way to donate to charity?", "full_content": "How to make your donations beneficial for both you and the recipient", "source": "MarketWatch Top Stories", "pub_date_str": "14 Nov 2026, 07:30 PM IST", "pub_date_relative": "23m ago"}, {"title": "Rare Ministerial Trip: Pakistan Confirms Participation In SCO Forum In New Delhi", "full_content": "Islamabad nominates Climate Change Minister Musadik Masood Malik for November 20-22 gathering, marking a rare ministerial-level visit to India amid strained ties.", "source": "NDTV Profit", "pub_date_str": "14 Nov 2026, 07:18 PM IST", "pub_date_relative": "34m ago"}, {"title": "Italy fines Meta $887 million over Android users' data access", "full_content": "Italy's data \u200bprotection \u200bagency said \u200bon Saturday \u2060it \u200chad fined \u2060 Meta Platforms 805 million euros ($887 million) \u200cfor allegedly \u200baccessing Android users' photographs \u2060and \u200cvideos \u200cwithout obtaining \u2060their consent \u2060or informing \u2060them.\n\nMeta had access to Android users' photos and videos through a Facebook app feature that suggested content from users' personal galleries for them to post, the authority said in a statement.\n\nMeta has 60 days to disable the feature by default and seek users' consent separately, it added\n\nThe investigation, which began in 2025, did not cover the possible use of the content to train artificial intelligence models, a practice Meta denied, the authority said.\n\nIt added that it reserved the right to assess separately a new feature, launched in 2026, that allows content from users' galleries to be processed in the cloud.\n\nThe fine is equivalent to about 0.47% of the group's global revenue, the authority said.", "source": "CNBC Top News", "pub_date_str": "14 Nov 2026, 07:08 PM IST", "pub_date_relative": "45m ago"}, {"title": "Elizabeth Holmes' Theranos Story Comes To India With 'You Can See Everything' Documentary Release", "full_content": "Elizabeth Holmes\u2019 Theranos story comes alive in You Can See Everything, a new documentary that follows her life before prison and looks at the woman behind one of Silicon Valley\u2019s biggest scandals.", "source": "NDTV Profit", "pub_date_str": "14 Nov 2026, 07:01 PM IST", "pub_date_relative": "51m ago"}, {"title": "Washington can start delivering on affordability by rejecting Trump\u2019s tariffs", "full_content": "Americans voted against policies that drove up their costs. Will policymakers ignore them?", "source": "MarketWatch Top Stories", "pub_date_str": "14 Nov 2026, 07:00 PM IST", "pub_date_relative": "53m ago"}, {"title": "Democrats\u2019 midterm sweep \"not bad at all\" for SpaceX, analyst says", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Nov 2026, 06:59 PM IST", "pub_date_relative": "54m ago"}, {"title": "Giri Babu No More: Raghu Babu\u2019s Father And Telugu Veteran Of 600+ Films Dies", "full_content": "Giri Babu passed away at the age of 80, while undergoing a treatment at a hospital in Hyderabad.", "source": "NDTV Profit", "pub_date_str": "14 Nov 2026, 06:58 PM IST", "pub_date_relative": "55m ago"}, {"title": "Brookfield, CPPIB consortium enters next round in Uniper sales process, sources say", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Nov 2026, 06:48 PM IST", "pub_date_relative": "1h ago"}, {"title": "Samay Raina Takes Dig At Huma Qureshi Over Toxic Box Office; Actress Gives Befitting Reply", "full_content": "Huma pointed out that hate-watching gets high viewership these days. She added that this could explain why India's Got Latent continues to rank among the top shows.", "source": "NDTV Profit", "pub_date_str": "14 Nov 2026, 06:47 PM IST", "pub_date_relative": "1h ago"}, {"title": "Software company with thousands of Fortune 500 clients joins Microsoft in experiencing major outage - Fox Business", "full_content": "Software company with thousands of Fortune 500 clients joins Microsoft in experiencing major outage Fox Business Workday outage leaves clients unable to access workplace accounts San Francisco Chronicle Workday outage means employees across thousands of businesses can't access accounts LiveNOW from FOX Outage At HR Platform Workday Locks Millions Of Employees Out Of Their Account Engadget Workday users experiencing \u2018service interruption\u2019 KRON4", "source": "Google News Business", "pub_date_str": "14 Nov 2026, 06:43 PM IST", "pub_date_relative": "1h ago"}, {"title": "Delhi Environment and Traffic Ministers Order 50% Staff To Work From Home As AQI deteriorates", "full_content": "Delhi Environment Minister Manjinder Singh Sirsa and Transport Minister Pankaj Singh ordered 50 per cent staff in their departments to work from home.", "source": "NDTV Profit", "pub_date_str": "14 Nov 2026, 06:40 PM IST", "pub_date_relative": "1h ago"}, {"title": "CM Bhagwant Mann Announces 'Punjab Da Crorepati' Contest: Eligibility, Cash Prize And More", "full_content": "The Punjab Da Crorepati contest will have a total of 11 rounds, of which nine will be held on an online portal.", "source": "NDTV Profit", "pub_date_str": "14 Nov 2026, 06:38 PM IST", "pub_date_relative": "1h ago"}, {"title": "BoE\u2019s Greene says acting proactively now on inflation would \u2019screw\u2019 things up the least", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Nov 2026, 06:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "SpaceX Starship Flight 15 live updates: Starship heat shield looks good for landing attempt today - Space", "full_content": "SpaceX Starship Flight 15 live updates: Starship heat shield looks good for landing attempt today Space Live updates: SpaceX Starship soars in orbit, still aiming for ship catch in unprecedented test flight CNN Setback for SpaceX reusable rocket system despite successful launch DW.com SpaceX's Starship set for return to Earth after booster catch aborted Phys.org SpaceX deploys Starlink satellites in Starship test, but booster crashes into Gulf NPR", "source": "Google News Business", "pub_date_str": "14 Nov 2026, 06:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "Trump Media group stares down $1bn debt crunch as bitcoin bet fades", "full_content": "Plunge in shares and cryptocurrency prices could force Truth Social owner to sell assets or take on costly new debt", "source": "FT Markets", "pub_date_str": "14 Nov 2026, 06:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "Retailers are turning to entertainment to win shoppers\u2019 attention", "full_content": "Legacy retailer Gap Inc. made an unconventional hire earlier this year: a chief entertainment officer.\n\nIt was a newly created role as the company tapped former Paramount executive Pam Kaufman to helm its entertainment, content and licensing platform. Gap has since rolled out major campaigns, partnering with bands like Just Your Type and building on the success of last year's ads with girl group Katseye.\n\n\"Beloved brands have value beyond the products they sell. Consumers identify with them, trust them and want to be part of their world,\" Kaufman told CNBC in a statement. \"The key is authenticity: Every extension has to reflect what the brand stands for and give its fans a meaningful new way to experience it.\"\n\nShe said it's part of a broader goal to emphasize what Gap calls \"fashiontainment,\" a strategy to blend retail and entertainment to better align with consumers. Gap is part of a growing cohort of retailers investing in entertainment and experiences both in-store and through exclusive online content to drive engagement.\n\n\"Brands are stories, and we are the storytellers,\" CEO Richard Dickson said at the Goldman Sachs Global Consumer and Retail conference in September. \"I think you could see that come to life when you look at some of the work that we've done, putting our brands in the center of culture and cultural conversation.\"\n\nIn another blending of retail and media, Mattel made waves a few years ago for its \"Barbie\" movie, building on the intellectual property of a decades-old fan favorite and drawing in massive box office success . At the time, Dickson was president and chief operating officer of the company, witnessing firsthand the sectors' intersection before departing for Gap.\n\n\"I think the post-Covid consumer attitude around shopping certainly evolved a lot,\" said Bryan Eshelman, who leads the retail practice at consulting firm AlixPartners.", "source": "CNBC Top News", "pub_date_str": "14 Nov 2026, 06:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "These 6 battered AI stocks could bounce back big, an analyst says", "full_content": "The postelection panic over data centers has led to a widespread tech selloff, but some stocks are more insulated than they seem, according to Bernstein.", "source": "MarketWatch Top Stories", "pub_date_str": "14 Nov 2026, 06:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "Varun Dhawan Turns Horror Hero For YRF; Rocket Boys Fame Abhay Pannu To Direct First Film", "full_content": "The untitled horror film is scheduled to arrive in cinemas worldwide on March 31, 2028.", "source": "NDTV Profit", "pub_date_str": "14 Nov 2026, 06:27 PM IST", "pub_date_relative": "1h ago"}, {"title": "Pune, Bengaluru, Mumbai: The Cities Right Behind Delhi In Pollution-Linked Health Insurance Claims", "full_content": "Pollution-linked health insurance claims have jumped 4.3 times in three years, and heart conditions, not lung illnesses, make up the biggest share, data from Policybazaar shows.", "source": "NDTV Profit", "pub_date_str": "14 Nov 2026, 06:25 PM IST", "pub_date_relative": "1h ago"}, {"title": "'Processing Your Inbox Is Tougher': Trump Official Takes Dig At Microsoft's H-1B Use After Global Outage", "full_content": "US Labour Department Inspector General Anthony D'Esposito mocked Microsoft after its global outage, questioning how the company could process thousands of H-1B applications but struggle to restore Outlook services.", "source": "NDTV Profit", "pub_date_str": "14 Nov 2026, 06:16 PM IST", "pub_date_relative": "1h ago"}, {"title": "Ohio Valley Banc director Michael Isaac buys $2,999 in shares", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Nov 2026, 06:15 PM IST", "pub_date_relative": "1h ago"}, {"title": "Can income tax authorities tax money deposited in your bank account for someone else? ITAT rules in \u20b93.69 crore case", "full_content": "The Agra bench of the Income Tax Appellate Tribunal (ITAT) has deleted an income tax addition of \u20b9 3.69 crore imposed on a Firozabad-based woman whose bank accounts were used to facilitate payments between bangle traders across India and suppliers in the Uttar Pradesh town. The tribunal held that the Income Tax Department could not treat the entire amount deposited in her accounts as unexplained income without establishing that the money actually belonged to her.\n\nIn its order dated 4 November 2026, in Pooja Agarwal vs Income Tax Officer , ITA No. 309/Agr/2026, the tribunal ruled in favour of the taxpayer, setting aside the addition made under Section 69A of the Income Tax Act, 1961.\n\nThe case relates to assessment year 2018-19, when Agarwal filed her income tax return declaring a total income of \u20b9 3.20 lakh. During scrutiny, the assessing officer (AO) found that \u20b9 3.69 crore had been deposited into her two bank accounts, significantly higher than the turnover of \u20b9 4.98 lakh reported in her return.\n\nAgarwal explained that she operated a commission-based business through which she facilitated payments between bangle buyers located in different parts of the country and traders in Firozabad. Buyers deposited cash into her bank accounts, following which she withdrew the money and facilitated payments to the local suppliers.\n\nShe said she charged a commission of \u20b9 500 for every \u20b9 1 lakh handled and had declared commission income of \u20b9 1.85 lakh under the presumptive taxation scheme under Section 44AD.\n\nThe assessing officer, however, rejected her explanation. The department questioned why buyers from different parts of the country would deposit cash into her accounts instead of making payments directly to traders.", "source": "LiveMint Money", "pub_date_str": "14 Nov 2026, 06:14 PM IST", "pub_date_relative": "1h ago"}, {"title": "U.S. floated idea of Ukraine ceding Donbas for NATO membership, Zelenskyy says", "full_content": "U.S. negotiators have floated the idea of Ukraine's potential withdrawal from its eastern region of Donbas in exchange for joining NATO, President Volodymyr Zelenskyy said, after the latest round of peace talks with Russia in Abu Dhabi.\n\nThis is the first time the question of linking NATO membership to territorial concessions has been raised during the talks, Zelenskyy said in remarks to reporters released by his office on Saturday.\n\n\"The Americans raised a question: 'What if Ukraine joins NATO? Would Ukraine withdraw from Donbas?\" he said.\n\n\"That is why I believe NATO is back on the agenda. But you have also heard [Russian President Vladimir Putin's ] signals, and this is an extremely difficult conversation.\"\n\nPutin has long said Ukrainian membership of NATO is a red line for Moscow, citing the issue as one reason for launching Russia's full-blown invasion in 2022.\n\nZelenskyy reiterated that Kyiv was not ready to concede territory but said that if it received a comprehensive package including security guarantees, the right to a strong and well-funded Ukrainian army and funds to rebuild, he would put the question to a national referendum.\n\nEchoing comments made by European leaders at a summit in Dublin on Friday, Zelenskyy dismissed Russia's call for a broad agreement on European security architecture before agreeing on specifics for ending the war in Ukraine.\n\n\"We cannot turn everything upside down and start by talking about changing the security framework in the world or across the continent overall, and only then talk about ending this war. This war must be ended first,\" he said.", "source": "CNBC Top News", "pub_date_str": "14 Nov 2026, 06:14 PM IST", "pub_date_relative": "1h ago"}, {"title": "Trump official seeks $50 billion for air traffic control after outage", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Nov 2026, 06:06 PM IST", "pub_date_relative": "1h ago"}, {"title": "Saudi Crown Prince Reportedly Pleaded With Trump Not To Attack Iran. Here\u2019s What Happened Next", "full_content": "Trump weighs restraint after Saudi and Turkish appeals, but keeps military options open amid tensions with Tehran and preparations for a possible escalation.", "source": "NDTV Profit", "pub_date_str": "14 Nov 2026, 06:01 PM IST", "pub_date_relative": "1h ago"}, {"title": "After Marriage With Kavya Maran, Anirudh Ravichander Takes Break From Work Till January 2027? What We Know", "full_content": "Anirudh Ravichander has reportedly stopped taking new projects after October and is expected to resume his professional commitments in January 2027 with Kamal Haasan\u2019s Sandiyar.", "source": "NDTV Profit", "pub_date_str": "14 Nov 2026, 06:00 PM IST", "pub_date_relative": "1h ago"}, {"title": "Tesla Starts Taking Cybercab Orders From Select Customers", "full_content": "The Cybercab will work unsupervised in all the same locations as Tesla's robotaxi fleet.", "source": "NDTV Profit", "pub_date_str": "14 Nov 2026, 05:56 PM IST", "pub_date_relative": "1h ago"}, {"title": "Meet the seven co-founders of Anthropic", "full_content": "Four researchers, a former journalist, a public policymaker, and an engineer founded Anthropic in 2021. Six years later, the artificial intelligence company is about to go public, with trading expected to begin on Nov. 19, in what will be one of the biggest IPOs on record.\n\nThose seven co-founders are poised to each be worth many billions of dollars.\n\nAt the end of 2020, siblings Dario and Daniela Amodei were vice presidents at OpenAI , the company that kicked off the generative AI frenzy with the launch of ChatGPT. But the two had grown frustrated with their employer over its approach to AI safety. Fearing a world where AI models' capabilities would progress faster than our understanding of them, the duo launched Anthropic early the next year.\n\nThey took a handful of OpenAI colleagues with them: Tom Brown, the company's research engineering lead on GPT-3; Jack Clark, a policy director; Jared Kaplan, a contract research consultant; and Sam McCandlish and Chris Olah, both members of OpenAI's technical staff.\n\nThey were all deeply concerned about OpenAI's ambitions to focus on commercialization, and they now stand to be some of the first to cash in on the AI boom.\n\n\"They really started Anthropic not because they were hoping to get rich, but they started Anthropic because they like wanted to shape this really important thing in the world, and they thought that other people might do it worse than them,\" said Jeffrey Ladish, who joined Anthropic as a contract safety engineer in September 2021, and now serves as the executive director of AI safety institute Palisade Research.\n\nCollectively the co-founders own about 10% of Anthropic. Each has about 240,000,000 class A shares, or about a 1.4% stake.\n\nDuring Anthropic's most recent funding round, those shares \u2014 valued at $58.90 each \u2014 amounted to about $14 billion in value for each co-founder.", "source": "CNBC World Economy", "pub_date_str": "14 Nov 2026, 05:45 PM IST", "pub_date_relative": "2h ago"}, {"title": "Goldman Sachs just slashed its 2027 gold forecast. Here are the new numbers", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Nov 2026, 05:40 PM IST", "pub_date_relative": "2h ago"}, {"title": "Post Office Monthly Income Scheme: What Happens If You Don't Withdraw Monthly Interest?", "full_content": "The scheme can be useful for senior citizens, retired people and those looking for a steady source of income every month.", "source": "NDTV Profit", "pub_date_str": "14 Nov 2026, 05:40 PM IST", "pub_date_relative": "2h ago"}, {"title": "China To Meet All New Power Demand With Clean Energy, CCTV Says", "full_content": "Wind and solar are expected to become the main source of additional electricity supply by 2030.", "source": "NDTV Profit", "pub_date_str": "14 Nov 2026, 05:39 PM IST", "pub_date_relative": "2h ago"}, {"title": "CSEET October 2026 Results To Be Declared on November 15; How To Download Marksheet", "full_content": "The Company Secretary Executive Entrance Test (CSEET) October 2026 session results will be released on November 15, at 2 pm.", "source": "NDTV Profit", "pub_date_str": "14 Nov 2026, 05:39 PM IST", "pub_date_relative": "2h ago"}, {"title": "Bitcoin falls below $68,000 as ETF outflows extend to seventh straight day", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Nov 2026, 05:31 PM IST", "pub_date_relative": "2h ago"}, {"title": "Eric Trump-backed robot soldier startup can't pay staff after founder borrowed $4.6 million from company to buy home", "full_content": "Foundation Future Industries , a maker of military humanoid robots advised and backed by Eric Trump, failed to pay employees last month as its cash reserves dwindled, according to people with direct knowledge of the matter.\n\nWorkers have yet to receive paychecks after San Francisco-based Foundation missed payroll on Oct. 30, said the people, who asked for anonymity to speak candidly about a private company.\n\nThe situation has particularly angered some inside the startup because its CEO and co-founder, Sankaet Pathak , borrowed $4.6 million from the company last year to buy a luxury home, money that could have been used to pay workers, the people said.\n\nPublic records show that an LLC that names Pathak as sole principal purchased a $4.6 million Sausalito, California, property with \"sweeping, cinematic views\" of the San Francisco Bay in October 2025.\n\nA spokesman for Pathak acknowledged receiving a detailed list of the major points from this story on Thursday, but didn't respond to requests for comment. Pathak's previous startup, a fintech firm named Synapse, collapsed in 2024, leaving thousands of Americans locked out of their savings accounts .\n\nFoundation's cash crunch comes at a precarious moment for the company, which Pathak has said is close to unveiling a next-generation, weapons-ready robot that will help the U.S. compete against Chinese rivals. At the same time, Pathak is seeking to raise hundreds of millions of dollars in funding at a $3 billion valuation.\n\nThe company has garnered headlines this year for Pathak's claims that his robots could soon take on battlefield tasks in Ukraine or patrol the U.S. border with Mexico. Broadcast interviews and articles about Foundation also include claims that the company has won $24 million in Pentagon contracts.\n\n\"What we're about to unveil in the next couple of months [is] going to be the strongest humanoid robot that exists anywhere in the world, including China,\" Pathak said in an April television interview.", "source": "CNBC World Economy", "pub_date_str": "14 Nov 2026, 05:30 PM IST", "pub_date_relative": "2h ago"}], "cfa": [{"title": "Rs 5,000 SIP vs Rs 5 Lakh Lumpsum: What Gives Better Results In 10 Years?", "full_content": "A Rs 5,000 monthly SIP and a Rs 5-lakh lump-sum investment may look similar at first. However, depending on market timing, fund house and other aspects, they can work very differently.", "source": "NDTV Profit", "pub_date_str": "14 Nov 2026, 07:45 PM IST", "pub_date_relative": "8m ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "How Canadian stocks could be big winners of U.S. midterms", "full_content": "Canadian stocks are up more than 1% since the vote, while the S&P 500 has sagged 0.5% in that time.", "source": "CNBC Top News", "pub_date_str": "14 Nov 2026, 07:41 PM IST", "pub_date_relative": "11m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Dividend king PSU stock: Down 23% in 6 months! Nuvama sees 42% upside; target price, rationale", "full_content": "NMDC Sharmila Bhadoria Published 14 Nov 2026, 07:41 PM IST Prefer Livemint on Google Shares of PSU ended marginally lower on Friday, November 13, reversing all its gains made over the previous sessions in the week. Volatility in the PSU stock coincided with the announcement of second quarter results for the financial year 2026-27.\n\nThe government-backed iron ore mining giant is likely to see an uptick in volume in the second half of financial year 2026-27 as supplies have now normalised after monsoon-led logistic disruption, according to Nuvama which sees nearly 42% upside potential in the stock.\n\nNMDC reported lower-than-expected second quarter EBITDA of \u20b9 19.4 billion, which is down 3% on an annual basis. However, EBITDA/t was marginally lower by \u20b9 17/t on an annual basis to \u20b9 1,853, weighed by higher royalty and premium cost and lower sales volume, noted Nuvama in its report. The brokerage also reduced its FY27 EBITDA by nearly 8% to factor in the performance in the first half of FY27.\n\nNuvama maintained a \u2018Buy\u2019 rating for the stock with a target price of \u20b9 100 per share for a period of 12 months. \u201cRetain \u2018BUY\u2019 with a TP of INR100 (earlier INR97), valuing at 9x FY28E and FY29E average EPS; trades at 6.4x FY28E EPS at CMP.\u2019\n\nNMDC is one of the top PSUs with attractive dividend yield and strong dividend history. The PSU stock has rewarded investors with dividend continuously over the last twenty five years. The PSU stock\u2019s annual dividend yield stood at 3.6% in the financial year 2025-26.\n\nThe stock closed 1.76% lower at \u20b9 69.90 per share on BSE with a market capitalisation of \u20b9 61,454.80 crore on Friday, November 13. Its share price value has declined 2.17% in one month, 17.74% in three months, and 23% in six months.\n\nCatch all the Business News , Market News , Breaking News Events, JIO IPO Listing Today LIVE and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.\n\nLog in to our website to save your bookmarks.", "source": "LiveMint Markets", "pub_date_str": "14 Nov 2026, 07:41 PM IST", "pub_date_relative": "12m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Fixed Income"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Tukaram Mundhe Strikes: 5 Reasons Why FDA Suspended Licences Of Pune's Vaishali, Roopali Restaurants", "full_content": "Vaishali received only 58 marks out of 98 in the non-compliance criteria with the FDA flagging various major deficiencies.", "source": "NDTV Profit", "pub_date_str": "14 Nov 2026, 07:39 PM IST", "pub_date_relative": "14m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "How Nvidia stock crash will impact Indian investors\u2019 US mutual fund and ETF holdings", "full_content": "Nvidia\u2019s sharp stock decline has raised concerns among Indian investors holding mutual funds that invest in US equities. However, the impact on most diversified international funds has been relatively limited, with losses ranging between 1% and 3.2%, despite the chipmaker's shares falling 13% in a week.\n\nThe bigger risk for Indian investors may lie elsewhere, as some US-focused exchange-traded funds ( ETFs ) are trading at substantial premiums to the value of their underlying holdings. This exposes buyers to potential losses even if the stocks themselves remain unchanged.\n\nNvidia shares fell 13% in the week ended November 11. The stock declined another 4.3% the following day after its board opened an inquiry into chief executive Jensen Huang, who subsequently resigned.\n\nFor Indian investors, the correction highlights two distinct risks. These include the concentration of individual stocks in mutual fund portfolios and the premiums investors pay when buying overseas ETFs on Indian exchanges.\n\nAccording to Value Research, most Indian mutual funds investing in US equities lost between 1% and 3.2% during the week ended November 11, considerably less than Nvidia's 13% decline. Three funds even reported positive returns. Mirae Asset NYSE FANG+ ETF FoF gained 7.9%, Motilal Oswal Nasdaq 100 FoF rose 4% and Mirae Asset S&P 500 Top 50 ETF FoF gained 3.2%.\n\nThe difference largely comes down to diversification and how much exposure a fund has to Nvidia.\n\nSeven of India's 60 international funds track the Nasdaq 100, making it the most widely tracked overseas index among these schemes. Nvidia accounts for approximately 8% of the index. Therefore, a 13% decline in the stock would translate into an estimated 1% impact on the index, assuming other constituents remain unchanged.\n\nThe impact was higher in more concentrated indices. Nvidia accounts for around 10% of the NYSE FANG+ index, which holds just 10 companies, and approximately 12% of the S&P 500 Top 50 index.", "source": "LiveMint Money", "pub_date_str": "14 Nov 2026, 07:33 PM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Berkshire breaks out to record high with fourth-quarter rally reaching 19%", "full_content": "(This is the Warren Buffett Watch newsletter, news and analysis on all things Warren Buffett and Berkshire Hathaway. You can sign up here to receive it every Friday evening in your inbox.)\n\nBerkshire Hathaway's red-hot shares are ending a strong week with four consecutive fresh record high closes.\n\nSince the rally began with the start of the fourth quarter on October 1, the Class A shares have closed at record highs 11 times as they soared 19.1%.\n\nThe much more widely held B shares closed at new highs just 10 times but are also up 19.1% from their near-term low.\n\nThe gains are in sharp contrast to the S&P 500's 1.2% dip as investors appear to be seeing Berkshire as a relatively safe haven amid worries about AI stocks and spending.\n\nBoth Berkshire classes were up 3.9% on the week as the S&P advanced by 2.5%, its best week since early August .\n\nBerkshire's B shares are now 7.5 percentage points ahead of the benchmark for the year so far.\n\nAfter erasing their post-Buffett CEO announcement losses three weeks ago, Berkshire shares are now up almost 10% since last year's shareholders meeting.", "source": "CNBC Top News", "pub_date_str": "14 Nov 2026, 07:32 PM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Flight disruptions continue after FAA lifts ground stop, some college football games delayed", "full_content": "Flight disruptions continued on Saturday and could extend through the weekend as airlines raced to recover from the Federal Aviation Administration's longest nationwide groundstop since 9/11, a measure the Trump administration blamed on a communications equipment failure in air traffic control.\n\nMore than 3,000 U.S. flights were canceled Saturday and close to 1,000 were delayed as of 5:45 a.m. ET, according to flight-tracking site FlightAware. That's on top of about 9,000 U.S. flight cancellations and more than 7,000 delays on Friday, though some disruptions were due to bad weather.\n\nPart of the job of untangling from the ground stop includes getting aircraft where they need to be. The ground stop forced many planes to divert to other airports.\n\nAirlines run one of the lightest schedules on Saturday and are deploying as many spare planes and crews as possible to get travelers and employees where they need to be as they're eager to start fresh for the upcoming Thanksgiving holiday period.\n\nAround 3 million people would typically be scheduled to fly on Saturday, according to aviation data firm Cirium.\n\nThe FAA had halted departing U.S. flights around 4 p.m. on Friday, a ground stop that lasted more than four hours. Routers were overloaded with data and started giving air traffic control centers inconsistent information, so the U.S. issued the ground stop, Transportation Secretary Sean Duffy said at a news conference late Friday.\n\nHe blamed outdated U.S. infrastructure for the problem and said Congress needs to approve more money to overhaul the country's air traffic control. Aging equipment and a shortage of air traffic controllers have angered airline executives for years, who have complained about the cost of resulting disruptions.\n\nIt was the second time the FAA has issued a nationwide ground stop since the Sept. 11, 2001 terror attacks. Trump administration officials said it did not appear to be a cyberattack.", "source": "CNBC Top News", "pub_date_str": "14 Nov 2026, 07:31 PM IST", "pub_date_relative": "22m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "How Rockstar's 'GTA IV' release could reshape gaming, streaming and even paid time off", "full_content": "It's been 13 years since the last installment of Grand Theft Auto , and fans are getting ready for what analysts say could be the biggest video game launch of all time.\n\nThe latest game in the franchise, \"Grand Theft Auto VI,\" is set to launch on Nov. 19, after Take-Two Interactive's Rockstar Games delayed its launch twice. Roth analyst Eric Handler estimated the game maker spent more than $1 billion developing the game.\n\nSales figures could end up breaking records. Sensor Tower estimated over 12 million preorders through Nov. 13, and Morgan Stanley forecast the game could sell 40 million copies by March 2027.\n\nBeyond launch week, the Grand Theft Auto, or GTA, franchise has a track record of lasting engagement over many years. Even 13 years after launch, \"Grand Theft Auto V\" is one of the top five most viewed games on Twitch this year.\n\nIn anticipation of the game's launch, investors have been taking note: Take-two's stock has more than doubled since the beginning of 2023.\n\nThe release is seen as not only a monumental moment for developer Rockstar Games and parent company Take-Two, but also a massive opportunity for the entire gaming industry.\n\nTake-Two CEO Strauss Zelnick addressed demand in a recent \"Squawk Box\" interview , saying, \"We tend to be pretty judicious when we talk about this sort of thing, but our expectations were high and they are being vastly exceeded so far.\"\n\nStreamers and creators across the digital ecosystem are looking at the launch as a massive opportunity to drive engagement with their content and fuel subscriber and ad revenue growth.", "source": "CNBC World Economy", "pub_date_str": "14 Nov 2026, 07:30 PM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Italy fines Meta $887 million over Android users' data access", "full_content": "Italy's data \u200bprotection \u200bagency said \u200bon Saturday \u2060it \u200chad fined \u2060 Meta Platforms 805 million euros ($887 million) \u200cfor allegedly \u200baccessing Android users' photographs \u2060and \u200cvideos \u200cwithout obtaining \u2060their consent \u2060or informing \u2060them.\n\nMeta had access to Android users' photos and videos through a Facebook app feature that suggested content from users' personal galleries for them to post, the authority said in a statement.\n\nMeta has 60 days to disable the feature by default and seek users' consent separately, it added\n\nThe investigation, which began in 2025, did not cover the possible use of the content to train artificial intelligence models, a practice Meta denied, the authority said.\n\nIt added that it reserved the right to assess separately a new feature, launched in 2026, that allows content from users' galleries to be processed in the cloud.\n\nThe fine is equivalent to about 0.47% of the group's global revenue, the authority said.", "source": "CNBC Top News", "pub_date_str": "14 Nov 2026, 07:08 PM IST", "pub_date_relative": "45m ago", "cfa_topics": ["Financial Statement Analysis", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "BoE\u2019s Greene says acting proactively now on inflation would \u2019screw\u2019 things up the least", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Nov 2026, 06:30 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Trump Media group stares down $1bn debt crunch as bitcoin bet fades", "full_content": "Plunge in shares and cryptocurrency prices could force Truth Social owner to sell assets or take on costly new debt", "source": "FT Markets", "pub_date_str": "14 Nov 2026, 06:30 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Saudi Crown Prince Reportedly Pleaded With Trump Not To Attack Iran. Here\u2019s What Happened Next", "full_content": "Trump weighs restraint after Saudi and Turkish appeals, but keeps military options open amid tensions with Tehran and preparations for a possible escalation.", "source": "NDTV Profit", "pub_date_str": "14 Nov 2026, 06:01 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Goldman Sachs just slashed its 2027 gold forecast. Here are the new numbers", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Nov 2026, 05:40 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Bitcoin falls below $68,000 as ETF outflows extend to seventh straight day", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Nov 2026, 05:31 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Alternative Investments", "Portfolio Management"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Eric Trump-backed robot soldier startup can't pay staff after founder borrowed $4.6 million from company to buy home", "full_content": "Foundation Future Industries , a maker of military humanoid robots advised and backed by Eric Trump, failed to pay employees last month as its cash reserves dwindled, according to people with direct knowledge of the matter.\n\nWorkers have yet to receive paychecks after San Francisco-based Foundation missed payroll on Oct. 30, said the people, who asked for anonymity to speak candidly about a private company.\n\nThe situation has particularly angered some inside the startup because its CEO and co-founder, Sankaet Pathak , borrowed $4.6 million from the company last year to buy a luxury home, money that could have been used to pay workers, the people said.\n\nPublic records show that an LLC that names Pathak as sole principal purchased a $4.6 million Sausalito, California, property with \"sweeping, cinematic views\" of the San Francisco Bay in October 2025.\n\nA spokesman for Pathak acknowledged receiving a detailed list of the major points from this story on Thursday, but didn't respond to requests for comment. Pathak's previous startup, a fintech firm named Synapse, collapsed in 2024, leaving thousands of Americans locked out of their savings accounts .\n\nFoundation's cash crunch comes at a precarious moment for the company, which Pathak has said is close to unveiling a next-generation, weapons-ready robot that will help the U.S. compete against Chinese rivals. At the same time, Pathak is seeking to raise hundreds of millions of dollars in funding at a $3 billion valuation.\n\nThe company has garnered headlines this year for Pathak's claims that his robots could soon take on battlefield tasks in Ukraine or patrol the U.S. border with Mexico. Broadcast interviews and articles about Foundation also include claims that the company has won $24 million in Pentagon contracts.\n\n\"What we're about to unveil in the next couple of months [is] going to be the strongest humanoid robot that exists anywhere in the world, including China,\" Pathak said in an April television interview.", "source": "CNBC World Economy", "pub_date_str": "14 Nov 2026, 05:30 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "NVIDIA shareholder Leo KoGuan backs Jensen Huang! Explains why he will not add more stake in flagship AI stock", "full_content": "Billionaire investor Leo KoGuan has come out in full support for Jensen Huang after his resignation as Nvidia Chief Executive Officer (CEO). Stressing on Huang\u2019s importance \u2018beyond description,\u2019 Leo KoGuan, suggested that he would reduce his planned investment in the artificial intelligence (AI) chipmaker firm.\n\nApart from indicating his plans to cut investment in Nvidia , he also signed a virtual declaration to extend his support form Jensen Huang. Not only KoGuan, SpaceX and Tesla CEO Elon Musk , Garry Tan, President & CEO of Y Combinator, etc have also signed the declaration.\n\nWhile maintaining that Nvidia\u2019s growth trajectory remained intact over the last few years, KoGuan said that he will reduce his planned investment in the American semiconductor giant. He also expressed his interest in putting money in other AI firms.\n\n\u201cIn the next 3 years, nothing has changed on NVDA\u2019s trajectory. However, I will reduce my plan investment in NVDA,\u201d KoGuan said in his latest social media post on X. He also mentioned that he would invest more in other \u2018si companies\u2019, referring to Super Intelligence terminology.\n\n\u201cI hope and plan to invest in Jensen Huang if he creates or buys si company. I hope he will offer me the opportunity to invest in his future company,\u201d he added.\n\nLeo KoGuan has invested nearly $1.3 billion in Nvidia, and there will be no more money going to Nvidia \u201cwithout Jensen\u201d, said Leo KoGuan in a statement shared with Bloomberg. Founder and chairman of of IT provider SHI International, Leo KoGuan enjoys a net worth of nearly $8.6 billion, according to a Forbes report.\n\nEarlier in 2026, KoGuan had announced that he had purchased nearly 1 million shares in Nvidia, equivalent to $180 million at that time.", "source": "LiveMint Markets", "pub_date_str": "14 Nov 2026, 05:19 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Yes Bank moves SC seeking review of order on writing off of Rs 8,415 cr AT-1 bonds", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Bonds \u203a Yes Bank moves SC seeking review of order on writing off of Rs 8,415 cr AT-1 bonds Y 203a Stocks \u203a Earnings \u203a RHI Magnesita Q2 net profit jumps 62 pc to over Rs 62 cr The Economic Times daily newspaper is available online now. Read Today's Paper RHI Magnesita Q2 net profit jumps 62 pc to over Rs 62 cr SECTIONS RHI Magnesita Q2 net profit jumps 62 pc to over Rs 62 cr PTI Last Updated: Nov 14, 2026, 04:39:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis RHI Magnesita has reported a remarkable surge in net profit, soaring to Rs 62.09 crore for the September quarter. The consolidated revenues experienced a modest increase, hitting Rs 1,038.26 crore this period. Additionally, overall expenses decreased to Rs 953.06 crore compared to the last year. EBITDA saw a 30 percent growth, reflecting operational enhancements despite challenging economic conditions.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "14 Nov 2026, 04:39 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Tata Sons Listing: Noel Tata decodes why there should be no tinkering; what he said at Hindustan Times Leadership Summit", "full_content": "Pranati Deva Updated 14 Nov 2026, 06:05 PM IST Prefer Livemint on Google Tata Sons Listing : Tata Trusts Chairman Noel Tata has expressed concern that a potential listing of the Tata Group could fundamentally alter the way the conglomerate operates, warning that the interests of thousands of shareholders could eventually take precedence over its philanthropic commitments.\n\nSpeaking at the HT Leadership Summit 2026 on Saturday, November 14, Tata said continuity in the group's existing way of functioning was important. He said the Tata system of ownership could neither come to an end, be bought nor be retired.\n\n\u201cI fear that if the group listing happens, as some people have been suggesting, it could change the way Tata works. A day may come when we have 30,000-40,000 shareholders and profits become more important than philanthropy. This could bring a fundamental change in the way Tata works,\u201d Noel Tata said.\n\nHe added that Tata Trusts would play a constructive role in engaging with regulators and other stakeholders to find a solution that would preserve the Tata Group's existing way of functioning.\n\nHis remarks come amid discussions around the group's ownership structure and the role of Tata Trusts in maintaining the conglomerate's legacy and governance framework.\n\nAt the summit, Noel Tata also spoke about his experience of becoming chairman of Tata Trusts and how the responsibility gave him a closer understanding of social challenges in the country.\n\nHe said he had been a trustee before taking over as chairman, but the new role required him to understand the functioning of the organisation at a much deeper level.\n\n\u201cOne thing influenced me a lot and created a sense of humility within me. It was the opportunity to see the depth of problems faced by some sections of society and the opportunity to help the deprived people of the country. This influenced me the most,\u201d he said.", "source": "LiveMint Markets", "pub_date_str": "14 Nov 2026, 04:38 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Dividend stock to buy: TD Power shares rally 369% in 3 years, more upside ahead? Check target price before record date", "full_content": "TD Power Systems will be in focus ahead of its November 18 dividend record date. The board approved a dividend of \u20b90.65 per share. Strong Q2 results, a robust order book and upgraded guidance have supported the stock, which SBI Securities rates Buy with a \u20b9732 target.", "source": "LiveMint Markets", "pub_date_str": "14 Nov 2026, 03:57 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Mahanadi Coalfields files RHP for proposed IPO worth nearly Rs 9,500 crore", "full_content": "Mahanadi Coalfields Ltd has filed its Red Herring Prospectus for an initial public offering with regulatory bodies. This IPO features an offer for sale of roughly 66.18 crore equity shares from Coal India, amounting to a 10 percent stake in the subsidiary MCL. The intended capital raise is around Rs 9,500 crore, with the final execution reliant on regulatory approval and market conditions.", "source": "Economic Times Markets", "pub_date_str": "14 Nov 2026, 03:42 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Corporate Issuers", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Dalal Street Week Ahead: Can Nifty bulls overcome key resistance levels?", "full_content": "The Nifty's current technical structure remains positive. Although a sharp rebound from the vicinity of the 200-week moving average has significantly improved the near-term technical setup, the Index is near its overhead resistance area.", "source": "Economic Times Markets", "pub_date_str": "14 Nov 2026, 03:38 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "This Man Stole $9 Million in Gold Bars on the Upper West Side, Police Say - The New York Times", "full_content": "This Man Stole $9 Million in Gold Bars on the Upper West Side, Police Say The New York Times Upper West Sider Swindled Out of $9 Million in Gold Bars: Police West Side Rag Suspect steals $9M in gold bars in scam targeting Upper West Side man: NYPD Audacy NYC man loses $9M in gold bar scam; NYPD releases photos of suspect SILive.com A Warning on a Computer Screen Set Off a Staggering Multimillion-Dollar Theft on the Upper West Side iLovetheUpperWestSide.com", "source": "Google News Business", "pub_date_str": "14 Nov 2026, 03:32 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "India's consumption story remains strong, but rural demand faces inflation risks: Report", "full_content": "India's consumption growth is projected to be robust, driven by a young population and digital adoption. Despite this, rural income pressures and food inflation could pose challenges for near-term demand. Premium products are expected to outperform mass-market categories as consumer preferences evolve. The impact of Super El Nino may exacerbate rural demand issues due to agricultural pressures. Companies must adapt to changing consumer dynamics and enhance operational efficiencies for success.", "source": "Economic Times Economy", "pub_date_str": "14 Nov 2026, 03:25 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title":     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
