<script>

    const allData = {"general": [{"title": "Gold above permissible limit: What it means, can it be seized, how to store it safely \u2013 tax experts explain", "full_content": "Owning gold jewellery above the commonly cited permissible limits does not, by itself, mean that the gold held is illegal, unaccounted for or subject to seizure by the tax authorities.\n\nThe key factor in determining how such gold is treated, whether in ornaments or other forms, is the owner's ability to clearly explain its source and establish ownership.\n\nIf an individual holds gold but cannot identify the source, they risk serious tax issues with legal ramifications.\n\nUnder prevalent tax laws, there is no statutory cap on the amount of gold jewellery an individual may own. The widely discussed thresholds, 500 grams for a married woman, 250 grams for an unmarried woman, and 100 grams for a male member, generally relate to jewellery that would not typically be seized during an income-tax search. They do not restrict legal ownership rights.\n\nNishant Shanker, tax and investments expert, Navraj Global Advisors, explained, \u201cThere is no statutory limit on how much gold jewellery a person can own under the income-tax law. The commonly cited limits of 500 grams for a married woman, 250 grams for an unmarried woman and 100 grams for a male member come from the CBDT Instruction and indicate jewellery that generally need not be seized during an income-tax search.\u201d\n\nOn the question of where this gold can be kept, and the significance of establishing its source, he added, \u201cGold exceeding these quantities is not automatically seized or treated as undisclosed income. The key is the ability to establish its source and ownership through purchase bills , inheritance or gift records and other supporting documents. Jewellery may be kept at home or in a bank locker; the location does not determine its taxability.\u201d\n\nTax authorities are well within their rights to question gold that appears to represent undisclosed income, especially during a surprise search or raid.", "source": "LiveMint Money", "pub_date_str": "02 Sep 2026, 01:02 PM IST", "pub_date_relative": "5m ago"}, {"title": "China's Xi keeps Iranian president at arm's length weeks ahead of Trump summit", "full_content": "China's President Xi Jinping gave his Iranian counterpart Masoud Pezeshkian a brief, low-profile audience at a regional security summit, signaling Beijing's calibrated approach toward Tehran just weeks ahead of Xi's planned trip to Washington.\n\nThe two leaders met for several minutes on the sidelines of the Shanghai Cooperation Organization summit in Kyrgyzstan on Tuesday, according to Iranian state media . The gathering brought together leaders of the 10-member bloc, including Russian President Vladimir Putin and Indian Prime Minister Narendra Modi .\n\nThe semi-official Mehr News Agency said that the Xi-Pezeshkian meeting focused on \"bilateral ties in line with strengthening relations between Tehran and Beijing,\" without offering further detail.\n\nThat contrasted with Beijing's approach of keeping the meeting out of public view.\n\nChinese state media, including the Communist Party's flagship newspaper, People's Daily, gave extensive coverage to Xi's encounters with other visiting leaders on Tuesday, but made no mention of the meeting with Pezeshkian. Modi, by contrast, published photos of his meeting with the Iranian leader .\n\n\"Xi is keeping Iran at arm's length publicly while still maintaining contact privately,\" said Han Shen Lin, managing director for Greater China at the Asia Group, a Washington-based strategic-advisory firm.\n\nThe SCO leaders in a joint statement condemned the military strikes on Iran , while backing member states' right to civilian nuclear development under the Nuclear Non-Proliferation Treaty. The statement stopped short of committing members to any concrete military or economic support.\n\nThe absence of Xi-Pezeshkian coverage from the state newspaper's front page reinforces the view that Beijing is \"carefully managing optics,\" Lin said. China is seeking to preserve its strategic relationship with Tehran without signaling that it is siding with the country, he said, particularly ahead of Xi's planned meeting with President Trump later this month.", "source": "CNBC Top News", "pub_date_str": "02 Sep 2026, 12:56 PM IST", "pub_date_relative": "10m ago"}, {"title": "Why BSE shares are falling today - CAS impact or some other trigger? Details here", "full_content": "BSE share price fell as much as 3% in Wednesday's trading session the exchange acknowledged that the recently introduced Closing Auction Session has resulted in lower trading volumes.\n\nBSE share price opened at \u20b9 3,222.60 per share today, as compared to previous close of \u20b9 3,242 on Tuesday. The stock reached an intraday low of \u20b9 3,131.50 on 2 September.\n\nIntroduced on August 3, the Closing Auction Session (CAS) is a short end-of-day auction where buy and sell orders are matched to establish a stock\u2019s official closing price. Similar auction mechanisms are already in use across several Asian markets, including China, Taiwan, Hong Kong and South Korea.\n\n\"CAS has led to lower participations from HFT, proprietary accounts, retail traders. CAS participation needs to pick up,\" the exchange was quoted as saying by ZEE Business.\n\nThe CAS replaced the earlier system, under which a stock\u2019s closing price was determined using the average price of trades executed during the final 30 minutes of continuous trading. Regulators said the new mechanism was aimed at bringing Indian markets in line with global practices.\n\nHowever, since its introduction, the CAS has resulted in notable price swings and divergences in benchmark indices. Liquidity during the roughly 20-minute auction has remained low and has been largely driven by institutional participants.\n\nExchange data showed that trades executed during the CAS accounted for less than 1% of total daily cash-market turnover. The volume was also less than one-third of the activity recorded under the previous closing-price methodology.\n\nCAS is a mechanism that matches buy and sell orders at the end of a trading session to arrive at the closing price of eligible stocks, rather than basing it solely on transactions executed during continuous trading hours. According to NSE, the system is designed to bring greater transparency and fairness to the process of determining closing prices.", "source": "LiveMint Markets", "pub_date_str": "02 Sep 2026, 12:53 PM IST", "pub_date_relative": "14m ago"}, {"title": "European gas prices hit highest this year and oil rises", "full_content": "Resumption of US-Iran hostilities raises fears of return to full-blown conflict", "source": "FT Markets", "pub_date_str": "02 Sep 2026, 12:51 PM IST", "pub_date_relative": "16m ago"}, {"title": "JPMorgan downgrades Knife River stock rating on margin concerns", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Sep 2026, 12:49 PM IST", "pub_date_relative": "18m ago"}, {"title": "Bernstein reiterates Palo Alto Networks stock rating on strong results", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Sep 2026, 12:48 PM IST", "pub_date_relative": "18m ago"}, {"title": "RBC Capital upgrades OGE Energy stock rating on growth outlook", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Sep 2026, 12:48 PM IST", "pub_date_relative": "18m ago"}, {"title": "UBS upgrades InterContinental Hotels stock rating to Buy on valuation", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Sep 2026, 12:48 PM IST", "pub_date_relative": "19m ago"}, {"title": "Getinge stock initiated at neutral by UBS on quality concerns", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Sep 2026, 12:48 PM IST", "pub_date_relative": "19m ago"}, {"title": "Adidas shares gain on Barclays upgrade, sees stock as buying opportunity", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Sep 2026, 12:48 PM IST", "pub_date_relative": "19m ago"}, {"title": "European shares holds at 1-month lows on global yield surge squeeze", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Sep 2026, 12:48 PM IST", "pub_date_relative": "19m ago"}, {"title": "Q1FY27 GDP Surprise: '7.8% offers optimism but deeper analysis reveals uneven growth' - Systematix on India Economy", "full_content": "Q1FY27 GDP: India's GDP (gross domestic product) for the April-June quarter of the current financial year (Q1FY27) surprised many. The GDP , which accounts for the total monetary value of all final goods and services produced during a specific period, came at 7.8% for Q1FY27, exceeding the estimates of 7.4% in a Mint poll of 21 economists.\n\nThe stronger-than-expected GDP print is worth celebrating, as the economy remained resilient amid the ongoing West Asian conflict (which began on 28 February), a weak monsoon due to the El Ni\u00f1o effect, and US tariff-related uncertainties. The Q4FY26 GDP numbers were revised upward to 8.6% from 7.8%.\n\nHowever, according to Systematix Shares and Stocks (India), a stockbroking and wealth management firm, a deeper analysis of Q1 GDP details reveals \"uneven growth, muted policy transmission, and persistent household fragility.\"\n\nSystematix underscored that while the Q1FY27 GDP delivered a meaningful upside surprise, with real GDP growth accelerating to 7.8% and GVA expanding by 8.2%, there are several reasons to believe GDP growth is significantly overstated.\n\nAccording to the brokerage firm, the predominance of formal-sector data in GDP estimation continues to create a wedge between the lived economic reality and the official growth narrative.\n\n\"There is a high dependence on formal sector indicators such as auto sales that have been buoyed by GST rationalisation and household leveraged consumption, which essentially reflects affluent consumption patterns.", "source": "LiveMint Markets", "pub_date_str": "02 Sep 2026, 12:46 PM IST", "pub_date_relative": "21m ago"}, {"title": "FTSE 100 today: Stocks slip as Iran-U.S. strikes drive oil higher", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Sep 2026, 12:45 PM IST", "pub_date_relative": "22m ago"}, {"title": "Oil major BP completes search for chair after boardroom upheaval", "full_content": "Britain's BP on Wednesday formally appointed Ian Tyler as chair after the surprise dismissal of his predecessor Albert Manifold contributed to leadership upheaval at the oil major.\n\nTyler joined the company's Board as a non-executive director in April last year and was appointed interim chair on May 26.\n\nBP said Tyler, who has worked alongside more than 15 CEOs during a non-executive career spanning listed private companies across oil and gas, natural resources and engineering firms, will assume his role immediately.\n\n\"Ian brings significant experience providing challenge and support to executive teams, while maintaining strong governance and oversight on behalf of shareholders,\" Amanda Blanc, BP's senior independent director, said in a statement.\n\nThe company also announced that Blanc will not stand for re-election at the 2027 annual general meeting and will step down from the board once a successor has been appointed for her role.\n\nTyler said he had asked Blanc to stay, but she told him that after four years, now was an appropriate time to plan for her departure from the board.\n\n\"I will lead the board's evolution, ensuring we have the depth, experience and capabilities needed to support the company's strategic priorities and long-term value creation,\" Tyler said.\n\n\"I am committed to establishing regular and transparent engagement with our shareholders, while continuing to support the wider leadership team as they deliver the performance and value our shareholders rightfully expect,\" he added.", "source": "CNBC Top News", "pub_date_str": "02 Sep 2026, 12:43 PM IST", "pub_date_relative": "24m ago"}, {"title": "JPMorgan upgrades Martin Marietta stock rating on acquisition synergies", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Sep 2026, 12:43 PM IST", "pub_date_relative": "24m ago"}, {"title": "JPMorgan cuts Amrize stock rating on management turnover concerns", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Sep 2026, 12:42 PM IST", "pub_date_relative": "24m ago"}, {"title": "Japan\u2019s JCRA upgrades India\u2019s sovereign rating to A-, cites strong growth, financial stability", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Indicators \u203a Japan\u2019s JCRA upgrades India\u2019s sovereign rating to A-, cites strong growth, financial stability The Economic Times daily newspaper is available online now. Read Today's Paper Japan\u2019s JCRA upgrades India\u2019s sovereign rating to A-, cites strong growth, financial stability SECTIONS Japan\u2019s JCRA upgrades India\u2019s sovereign rating to A-, cites strong growth, financial stability ET Online Last Updated: Sep 02, 2026, 12:38:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Japan Credit Rating Agency (JCR) has upgraded India\u2019s sovereign rating by one notch to A- from BBB+, with a Stable outlook, citing sustained economic growth, stronger financial-sector soundness and policy measures supporting development. India grew 7.7% in real terms in FY2026, while its fiscal deficit narrowed and banking-sector asset quality improved.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\nPatent Cliff approaching: Can Indian pharma companies repeat past success?\n\nWhat LIC should do to remain money-spinner for govt, policyholders\n\nFrom survival to 193 mn subscribers: Is Vi finally making a comeback?\n\nET Prime special series: 2013 to 2026. Not years, but evidence: Power Grid, Part 2\n\nBehind the sugar price drop: Exports, imports and a non-factor called ethanol\n\nAs IndiGo, Air India scramble for pilots, fresh headwinds hit hard", "source": "Economic Times Economy", "pub_date_str": "02 Sep 2026, 12:32 PM IST", "pub_date_relative": "34m ago"}, {"title": "PVR Inox\u2019s \u20b9300-crore buyback: on track for a comeback?", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nPVR Inox\u2019s \u20b9 300-crore buyback gave investors another reason to cheer. The stock is up 1% since Monday\u2019s announcement, outperforming the Nifty 50\u2019s 1% drop, and taking its year-to-date gains in 2026 to about 20%. Yet, the broader picture remains less cheery: the stock sits about 15% below its 2023 level, when PVR and Inox Leisure merged.\n\nPVR Inox will buy back up to 2.11% of its paid-up equity capital at \u20b9 1,450 per share, a 20% premium to its 31 August price. The promoters, who hold a 27.53% stake, also intend to participate. According to JM Financial Institutional Securities, the buyback signals balance-sheet confidence, as PVR transitioned from net debt of \u20b9 162 crore at the end of March to net cash of \u20b9 81 crore by the end of June.\n\nRevenue and margins improved as well, helped by a strong movie slate including Dhurandhar: The Revenge, Michael, Obsession . Q1FY27 revenue rose 11.9% year-on-year to \u20b9 1,622 crore, with footfalls up 7.6% to 36.6 million. The average ticket price rose 7.5% to \u20b9 273, while food & beverage spending per head rose 8.8% to \u20b9 161. Pre-Ind AS Ebitda margin, a measure of core operating profitability that deducts actual lease rent expenses, expanded to 12.9%.\n\nWhile management expects to add around 80 net screens in FY27, 79% of these additions will follow the asset-light, franchise-owned company-operated (FOCO) model. As a result, the full-year capex guidance has been trimmed from \u20b9 400 crore to \u20b9 350 crore. Expansion into underpenetrated tier-II and tier-III cities is slated to begin in FY28.\n\nHowever, footfalls have been volatile, ranging from 30.4 million per quarter to 48.4 million in recent years, depending heavily on the festive season and the movie pipeline. PL Capital expects footfalls to compound at only 4.7% through FY28.\n\nOccupancy improved to 25.3% in Q1FY27 compared to last year, though it still leaves considerable room for growth.", "source": "LiveMint Markets", "pub_date_str": "02 Sep 2026, 12:32 PM IST", "pub_date_relative": "35m ago"}, {"title": "Yotta targets Jan-March 2027 IPO, seeks up to $1.5 billion amid AI boom", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a Yotta targets Jan-March 2027 IPO, seeks up to $1.5 billion amid AI boom The Economic Times daily newspaper is available online now. Read Today's Paper Yotta targets Jan-March 2027 IPO, seeks up to $1.5 billion amid AI boom SECTIONS Yotta targets Jan-March 2027 IPO, seeks up to $1.5 billion amid AI boom Reuters Last Updated: Sep 02, 2026, 12:29:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Yotta Data Services is gearing up for an initial public offering scheduled for early 2027, aiming to secure as much as $1.5 billion to settle debts and enhance their infrastructure. This strategic move taps into the surging demand for AI computing infrastructure seen across India. A noteworthy portion of Yotta\u2019s clientele comprises global customers, bolstered by a tax holiday that instils confidence among international data center users.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget yield could reach 3.2% in October.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "02 Sep 2026, 12:22 PM IST", "pub_date_relative": "45m ago"}], "cfa": [{"title": "Gold above permissible limit: What it means, can it be seized, how to store it safely \u2013 tax experts explain", "full_content": "Owning gold jewellery above the commonly cited permissible limits does not, by itself, mean that the gold held is illegal, unaccounted for or subject to seizure by the tax authorities.\n\nThe key factor in determining how such gold is treated, whether in ornaments or other forms, is the owner's ability to clearly explain its source and establish ownership.\n\nIf an individual holds gold but cannot identify the source, they risk serious tax issues with legal ramifications.\n\nUnder prevalent tax laws, there is no statutory cap on the amount of gold jewellery an individual may own. The widely discussed thresholds, 500 grams for a married woman, 250 grams for an unmarried woman, and 100 grams for a male member, generally relate to jewellery that would not typically be seized during an income-tax search. They do not restrict legal ownership rights.\n\nNishant Shanker, tax and investments expert, Navraj Global Advisors, explained, \u201cThere is no statutory limit on how much gold jewellery a person can own under the income-tax law. The commonly cited limits of 500 grams for a married woman, 250 grams for an unmarried woman and 100 grams for a male member come from the CBDT Instruction and indicate jewellery that generally need not be seized during an income-tax search.\u201d\n\nOn the question of where this gold can be kept, and the significance of establishing its source, he added, \u201cGold exceeding these quantities is not automatically seized or treated as undisclosed income. The key is the ability to establish its source and ownership through purchase bills , inheritance or gift records and other supporting documents. Jewellery may be kept at home or in a bank locker; the location does not determine its taxability.\u201d\n\nTax authorities are well within their rights to question gold that appears to represent undisclosed income, especially during a surprise search or raid.", "source": "LiveMint Money", "pub_date_str": "02 Sep 2026, 01:02 PM IST", "pub_date_relative": "5m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Why BSE shares are falling today - CAS impact or some other trigger? Details here", "full_content": "BSE share price fell as much as 3% in Wednesday's trading session the exchange acknowledged that the recently introduced Closing Auction Session has resulted in lower trading volumes.\n\nBSE share price opened at \u20b9 3,222.60 per share today, as compared to previous close of \u20b9 3,242 on Tuesday. The stock reached an intraday low of \u20b9 3,131.50 on 2 September.\n\nIntroduced on August 3, the Closing Auction Session (CAS) is a short end-of-day auction where buy and sell orders are matched to establish a stock\u2019s official closing price. Similar auction mechanisms are already in use across several Asian markets, including China, Taiwan, Hong Kong and South Korea.\n\n\"CAS has led to lower participations from HFT, proprietary accounts, retail traders. CAS participation needs to pick up,\" the exchange was quoted as saying by ZEE Business.\n\nThe CAS replaced the earlier system, under which a stock\u2019s closing price was determined using the average price of trades executed during the final 30 minutes of continuous trading. Regulators said the new mechanism was aimed at bringing Indian markets in line with global practices.\n\nHowever, since its introduction, the CAS has resulted in notable price swings and divergences in benchmark indices. Liquidity during the roughly 20-minute auction has remained low and has been largely driven by institutional participants.\n\nExchange data showed that trades executed during the CAS accounted for less than 1% of total daily cash-market turnover. The volume was also less than one-third of the activity recorded under the previous closing-price methodology.\n\nCAS is a mechanism that matches buy and sell orders at the end of a trading session to arrive at the closing price of eligible stocks, rather than basing it solely on transactions executed during continuous trading hours. According to NSE, the system is designed to bring greater transparency and fairness to the process of determining closing prices.", "source": "LiveMint Markets", "pub_date_str": "02 Sep 2026, 12:53 PM IST", "pub_date_relative": "14m ago", "cfa_topics": ["Equity Investments", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "UBS upgrades InterContinental Hotels stock rating to Buy on valuation", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Sep 2026, 12:48 PM IST", "pub_date_relative": "19m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "European shares holds at 1-month lows on global yield surge squeeze", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Sep 2026, 12:48 PM IST", "pub_date_relative": "19m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Q1FY27 GDP Surprise: '7.8% offers optimism but deeper analysis reveals uneven growth' - Systematix on India Economy", "full_content": "Q1FY27 GDP: India's GDP (gross domestic product) for the April-June quarter of the current financial year (Q1FY27) surprised many. The GDP , which accounts for the total monetary value of all final goods and services produced during a specific period, came at 7.8% for Q1FY27, exceeding the estimates of 7.4% in a Mint poll of 21 economists.\n\nThe stronger-than-expected GDP print is worth celebrating, as the economy remained resilient amid the ongoing West Asian conflict (which began on 28 February), a weak monsoon due to the El Ni\u00f1o effect, and US tariff-related uncertainties. The Q4FY26 GDP numbers were revised upward to 8.6% from 7.8%.\n\nHowever, according to Systematix Shares and Stocks (India), a stockbroking and wealth management firm, a deeper analysis of Q1 GDP details reveals \"uneven growth, muted policy transmission, and persistent household fragility.\"\n\nSystematix underscored that while the Q1FY27 GDP delivered a meaningful upside surprise, with real GDP growth accelerating to 7.8% and GVA expanding by 8.2%, there are several reasons to believe GDP growth is significantly overstated.\n\nAccording to the brokerage firm, the predominance of formal-sector data in GDP estimation continues to create a wedge between the lived economic reality and the official growth narrative.\n\n\"There is a high dependence on formal sector indicators such as auto sales that have been buoyed by GST rationalisation and household leveraged consumption, which essentially reflects affluent consumption patterns.", "source": "LiveMint Markets", "pub _date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "AI capital expenditure forecast to exceed the cost of building railways in both the U.S. and the U.K. \u2014 with the internet added on top", "full_content": "The accounting giant says the buildout of artificial intelligence differs from the development of railways and the internet because of its scale and spending growth.", "source": "MarketWatch Top Stories", "pub_date_str": "02 Sep 2026, 12:06 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "1000% rally in five years | Multibagger small-cap stock hits upper circuit", "full_content": "Multibagger small-cap stock Spice Lounge Food Works hit 5% upper circuit in Wednesday's trading session despite stock market crash.\n\nThe small-cap stock opened at \u20b9 23.42 on BSE today, as compared to previous close of \u20b9 22.32 on Tuesday. The multibagger stock touched an intraday high of \u20b9 23.43 on 2 September.\n\nMeanwhile, benchmark indices Sensex and Nifty opened sharply lower on Wednesday, tracking weak global market trends and rising crude oil prices amid the escalating conflict in West Asia. The 30-share BSE Sensex fell 788.52 points to 76,155.76 in early trade, while the 50-share NSE Nifty declined 269 points to 23,786.80.\n\nThe stock rally came in amid higher trading volumes. According to data available on BSE, around 2.55 lakh shares changed hands during the intraday session on 2 September.\n\nIn an exchange filing dated 1 September, Spice Lounge Food Works said that the company has launched its Food Emulsifier & Agro Division, a new food emulsifiers, agri-sourcing and processing vertical, including agro chemicals, built to backward-integrate the Company's supply chain, targeting revenue of approximately over \u20b9 1,200 crore.\n\nThe new vertical will cater to the company\u2019s restaurant, quick-service restaurant (QSR) and live-events business, including Xora World. In addition, it will operate independently as a B2B supplier of food emulsifiers and ingredients to hotels, QSR chains and food processing units.\n\nEarlier, the company had announced an accelerated expansion into India\u2019s live entertainment space through its events and entertainment vertical, Xora World. The vertical unveiled a four-event portfolio spanning destinations from Goa and Tirupati to Hyderabad.", "source": "LiveMint Markets", "pub_date_str": "02 Sep 2026, 12:00 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stock Market Crash LIVE: Sensex Tanks 650 Points, Nifty50 Below 23,850; Auto Shares Tumble Up To 7%", "full_content": "All the sectoral indices were trading in the red, with the Nifty IT, Nifty Auto, Nifty Metals, Nifty Realty, Nifty Media and Nifty PSU Bank falling the most.", "source": "NDTV Profit", "pub_date_str": "02 Sep 2026, 11:54 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Every time FIIs panicked, here's what happened next - Nikhil Kamath explains why smart foreign money isn't always right", "full_content": "Foreign institutional investors (FIIs) are often seen as the \u201csmart money\u201d in Indian equities, with their buying and selling patterns closely tracked by market participants. But a historical comparison shared by Zerodha co-founder Nikhil Kamath suggests that when FIIs have sold aggressively during major market crises, their timing has not always proved right in hindsight. In several instances, sharp foreign selling was followed by strong gains in the Nifty 50 over the subsequent 12 months, with domestic investors appearing to have navigated such periods more effectively.\n\n\u201cInteresting insight: smart foreign money isn't always right, it's often wrong, in terms of timing Indian stock markets. Foreign institutions vs. domestic: domestic seems to have done better...\u201d Kamath said in a recent LinkedIn post.\n\nThe analysis tracks some of the biggest market crashes and the heaviest FII selling months associated with them, along with Nifty 50 returns over the following 12 months and returns in US dollar terms.\n\nDuring the 2008 Global Financial Crisis, October saw FII selling of \u20b9 15.3K crore. Following the panic low, the Nifty 50 delivered a 92% return over the next 12 months, while the return in US dollar terms stood at 105%.\n\nThe 2015-16 China slowdown saw the heaviest FII selling in August at \u20b9 16.8K crore. The Nifty 50 subsequently gained 28%, while the return in US dollar terms was 31%.\n\nDuring the 2018 IL&FS default, FIIs recorded their heaviest selling in October, amounting to \u20b9 28.9K crore. The Nifty 50 went on to deliver a 15% return over the next 12 months, while the corresponding gain in US dollar terms stood at 19%.\n\nThe pattern was even more pronounced during the 2020 COVID crash. In March, FII selling reached \u20b9 61.9K crore. The Nifty 50 subsequently surged 95%, while returns in US dollar terms stood at 104% over the following 12 months.\n\nDuring the 2022 period of Fed hikes and the Ukraine conflict, the heaviest selling month was June, at \u20b9 50.2K crore.", "source": "LiveMint Markets", "pub_date_str": "02 Sep 2026, 11:48 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Family pension rules: Widow loses pension despite getting husband\u2019s PF and gratuity; what families must check", "full_content": "A Bank of Maharashtra employee\u2019s widow received his provident fund and gratuity but was denied family pension after missing the deadline to opt for a one-time pension scheme.&nbsp;", "source": "LiveMint Money", "pub_date_str": "02 Sep 2026, 11:44 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Sun Pharma Shares In Focus: US MFN Deal Eases Tariff Risk, Says ICICI Securities \u2014 Check Target Price", "full_content": "Sun Pharmaceutical Industries Ltd. has entered into a Most Favoured Nation (MFN) pricing agreement with the US government, along with eight other pharmaceutical companies under which Sun will extend MFN pricing to state Medicaid programmes for existing and future launches", "source": "NDTV Profit", "pub_date_str": "02 Sep 2026, 11:42 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}], "updated_at": "02 Sep 2026, 01:07 PM IST", "total_stories": 400};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
