    const allData = {"general": [{"title": "Stock Market Today: All You Need To Know Before Going Into Trade On Sept 17", "full_content": "Stocks in the news, big brokerage calls of the day, complete trade setup and much more!", "source": "NDTV Profit", "pub_date_str": "17 Sep 2026, 06:54 AM IST", "pub_date_relative": "10m ago"}, {"title": "NSE Subscription for India IPO Starts With Valuation in Focus", "full_content": "(Bloomberg) -- National Stock Exchange of India Ltd.\u2019s long-awaited initial public offering starts taking orders Thursday, testing investor appetite for a valuation that remains rich compared with some of the world\u2019s biggest listed exchanges.\n\nThe shares are being offered at 1,700 rupees to 1,785 rupees a share and will close for subscription on Sept. 21. NSE reduced the number of shares on offer to 126.44 million from 148.9 million planned earlier, according to its updated prospectus. The offering is entirely a sale by existing shareholders, meaning the exchange won\u2019t receive any of the proceeds.\n\nAt the top end of the range, the deal is set to raise 226 billion rupees ($2.4 billion), the second-most ever for an IPO in the country behind Hyundai Motor India Ltd.\u2019s 2024 listing, which netted 279 billion rupees. That price would value NSE at about 42.9 times its earnings for the year ended March. While that\u2019s a discount to domestic rival BSE Ltd., it\u2019s well above the roughly 24 to 25 times ratio for some of the world\u2019s largest listed exchanges.\n\nThe premium reflects NSE\u2019s dominant position in one of the world\u2019s fastest-growing capital markets and its high profitability. The exchange reported net income of 103 billion rupees on revenue of 166 billion rupees in the year ended March 2026, according to its prospectus, translating into a profit margin of about 62%, above most large global peers.\n\n\u201cNSE is well positioned to benefit from structural tailwinds and remains the best franchise among peers\u201d because of India\u2019s deepening capital markets and rising global investor participation, SBICAPS Securities said in a note to clients.\n\nStill, analysts and investors are divided over whether NSE\u2019s market dominance and growth prospects justify the premium. NSE\u2019s gray-market premium has fallen to about 160 rupees a share from as high as 285 rupees on Sept.", "source": "LiveMint Markets", "pub_date_str": "17 Sep 2026, 06:51 AM IST", "pub_date_relative": "13m ago"}, {"title": "Sandisk chairman & CEO David Goeckeler sells $51.7m in stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Sep 2026, 06:47 AM IST", "pub_date_relative": "17m ago"}, {"title": "Sandisk EVP & CFO Luis Visoso sells $1.57 million in stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Sep 2026, 06:46 AM IST", "pub_date_relative": "18m ago"}, {"title": "Stock Picks Today: SBI, UltraTech Cement, Emami, Lenskart, Torrent Power, And More On Brokerages' Radar", "full_content": "Check out the top stock calls, initiations, upgrades, downgrades, and target price revisions from leading brokerages ahead of today's trade.", "source": "NDTV Profit", "pub_date_str": "17 Sep 2026, 06:46 AM IST", "pub_date_relative": "18m ago"}, {"title": "U.S. House passes bill aimed at shielding households from data center power costs", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Sep 2026, 06:43 AM IST", "pub_date_relative": "21m ago"}, {"title": "Mark Walter and Todd Boehly sell Chelsea stakes to Clearlake", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Sep 2026, 06:42 AM IST", "pub_date_relative": "21m ago"}, {"title": "Top 5 breakout stocks to buy today by Sumeet Bagadia: Heritage Foods, HDFC Bank, JK Paper; check stop loss, target price", "full_content": "Stocks to buy : Benchmark indices Sensex and Nifty rebounded on Wednesday, supported by value buying after a sharp decline in the previous session, with banking stocks leading the recovery in the equity market.\n\nThe 30-share BSE Sensex rose 332.63 points, or 0.45%, to settle at 74,336.45. The index gained as much as 502.04 points, or 0.67%, during the session to touch 74,505.86. The 50-share NSE Nifty advanced 99 points, or 0.43%, to close at 23,217.60.\n\nNifty 50 closed at 23,217.60, up 99 points (+0.43%), recovering from an early dip as buying emerged near the 23,116 level. The index settled with a Doji-like candle, reflecting indecision after the recent sharp decline. Despite the recovery, RSI at 27.31 remains in oversold territory, while Nifty continues to trade below key moving averages, keeping the broader structure cautious.\n\n\u201cThe 23,000\u201323,080 zone remains the crucial support area, while 23,300\u201323,450 is the immediate hurdle, followed by the 50-Day EMA near 23,972. Put OI around 23,200\u201323,000 may provide some downside cushion, whereas Call OI around 23,300\u201323,500 could limit recovery. With PCR at 0.97 and VIX easing to 13.17, the near-term bias remains cautious, with oversold conditions supporting the possibility of a technical rebound,\u201d said Sumeet Bagadia, Executive Director at Choice Broking.\n\nBank Nifty closed at 56,292.45, up 497.70 points (+0.89%), staging a strong recovery after slipping to 55,812.20 during the first half. Buying from lower levels pushed the index towards the day\u2019s high of 56,368.70, resulting in a positive daily candle and indicating renewed demand in the banking space. PSU Banks showed relatively stronger participation, supporting the broader recovery.\n\n\u201cThe 55,700\u201356,000 region now forms the immediate support base, while 56,500\u201356,800 is the key resistance zone to watch. A sustained move above this resistance could improve short-term momentum, whereas failure to hold support may bring selling pressure back.", "source": "LiveMint Markets", "pub_date_str": "17 Sep 2026, 06:42 AM IST", "pub_date_relative": "22m ago"}, {"title": "Nifty technical view: Consolidation likely as index trades near crucial support", "full_content": "The Nifty 50 formed a small green-bodied candle on Wednesday with shadows on both sides, indicating indecision among market participants. Although the index ended the session with gains, the broader market remained under pressure as market breadth stayed negative and mid-cap and small-cap segments underperformed.\n\nThe index failed to close above the 23.6% retracement level of the previous day's decline and continued to form a lower low, keeping the short-term structure weak. As expected, the Nifty moved back inside the Bollinger Bands after the sharp fall, but it continues to trade below all key short-term moving averages, indicating that recovery attempts are yet to gain strength.\n\nThe 14-period daily RSI remains in the oversold zone, although it has recovered from the previous session\u2019s low, suggesting some improvement in momentum . The MACD histogram has shown a modest decline in negative momentum , indicating that selling pressure has eased slightly but has not yet reversed.\n\nThe immediate support for the index remains at 23,116\u201323,118, which represents the lows of the previous two trading sessions. Holding this zone will be important for the index to sustain the ongoing recovery attempt.\n\nThe Nifty may enter a consolidation phase over the next 2\u20133 sessions and could continue trading within Tuesday\u2019s range. A decisive close above 23,461, which is the 8-EMA, would provide the first indication of improving short-term sentiment.\n\nA close above Tuesday\u2019s high of 23,592 would further strengthen the recovery setup and could open the possibility of a counter-trend rally towards the 20-DMA, currently placed near 23,873.\n\nOn the downside, a break below the 23,116\u201323,118 support zone would indicate renewed weakness and may extend the decline towards 23,070, followed by 22,850.\n\nThe overall price structure remains damaged, and the index has not yet confirmed a trend reversal.", "source": "LiveMint Markets", "pub_date_str": "17 Sep 2026, 06:41 AM IST", "pub_date_relative": "22m ago"}, {"title": "US Fed rate hike impact on Indian banking: FOMC outcome effect on bank stocks", "full_content": "US Fed rate hike impact on Indian banking stocks : The Federal Reserve\u2019s latest interest-rate decision is expected to have implications for Indian markets, with the FOMC\u2019s policy outcome likely to influence the performance of Indian banking stocks.\n\nThe US Federal Reserve raised its benchmark interest rate by 25 basis points on Wednesday, taking the federal funds rate to a target range of 3.75%\u20134%. Policymakers also signalled the possibility of another rate hike later this year.\n\nThe rate increase came against the backdrop of persistent inflation, partly fuelled by continuing tensions in the Middle East, while the labour market remained relatively stable. The move marked the central bank\u2019s first rate hike in more than three years.\n\nMarket experts believe that the Federal Reserve\u2019s recent 25 basis point rate hike, coupled with a hawkish dot plot signaling another hike in 2026 and a higher long-run neutral rate of 3.25%, delivers an unmistakable message that the higher-for-longer policy regime is here to stay.\n\nWhen the US Federal Reserve changes its policy rates, the Reserve Bank of India (RBI) assesses the potential impact on the interest-rate differential, capital flows and currency markets.", "source": "LiveMint Markets", "pub_date_str": "17 Sep 2026, 06:40 AM IST", "pub_date_relative": "24m ago"}, {"title": "Oil prices extend losses as fears of Middle East supply disruptions ease", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Sep 2026, 06:36 AM IST", "pub_date_relative": "28m ago"}, {"title": "US temporarily eases curb on working hours for fuel truck drivers", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Sep 2026, 06:36 AM IST", "pub_date_relative": "28m ago"}, {"title": "SK Hynix stuck in \u20a91,670K-\u20a91,888K range: Live levels", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Sep 2026, 06:36 AM IST", "pub_date_relative": "28m ago"}, {"title": "Nikkei 225 bear flag 70% complete near support: Live levels", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Sep 2026, 06:36 AM IST", "pub_date_relative": "28m ago"}, {"title": "Byron Donalds from Florida\u2019s 19th District Makes Moves in Howmet Aerospace, Netflix, and Parker-Hannifin Stocks", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Sep 2026, 06:34 AM IST", "pub_date_relative": "30m ago"}, {"title": "Oil Prices On September 17: Brent Crude Falls Below $105 As Saudi Moves To Restore Key Pipeline", "full_content": "Brent crude slipped below $105 a barrel as signs of easing supply disruptions in the Middle East reduced some of the risk premium. West Texas Intermediate crude also weakened, trading near $101 a barrel.", "source": "NDTV Profit", "pub_date_str": "17 Sep 2026, 06:33 AM IST", "pub_date_relative": "31m ago"}, {"title": "LIVE: NSE IPO opens today; latest GMP price, subscription status, allotment and listing date; market debut prediction", "full_content": "LIVE NSE IPO: The much-awaited \u20b9 22,569-crore NSE IPO is finally set to open for subscription today, 17 September, putting the spotlight firmly on the National Stock Exchange\u2019s much-anticipated market debut. The NSE IPO date for subscription is Thursday, 17 September, and the issue will remain open until Monday, 21 September.\n\nThe NSE IPO price band has been fixed at \u20b9 1,700\u2013 \u20b9 1,785 per equity share, with the cap price at 1,785 times the face value. The NSE IPO lot size is 8 equity shares, with investors able to bid in multiples of 8 thereafter.\n\nAs part of the NSE IPO details, up to 50% of the issue is reserved for Qualified Institutional Buyers (QIBs), at least 15% for Non-Institutional Investors (NIIs), and at least 35% for retail investors.\n\nNSE IPO GMP today, or grey market premium, is +145. Considering the upper end of the IPO price band and the current premium in the grey market, the estimated listing price of NSE share price was indicated at \u20b9 1,930 apiece, which is 8.12% higher than the IPO price of \u20b9 1,785.\n\nThe IPO comprises an Offer for Sale (OFS) of up to 12.64 crore equity shares, each with a face value of Re 1. The issue does not include any fresh issuance of shares by the company.\n\nThe company has reduced the number of shares on offer to 12.644 crore from the 14.89 crore proposed earlier, according to its red herring prospectus.\n\nThe NSE IPO comprises an Offer for Sale (OFS) by existing shareholders, with the exchange itself not receiving any proceeds from the issue. Chauhan said NSE does not need to raise fresh capital, citing its strong profitability and dividend payout of around \u20b9 8,000 crore last year, according to reports.\n\nThe NSE has allocated 1.39 crore equity shares, accounting for 36.98% of the total anchor book, to 29 domestic mutual funds.", "source": "LiveMint Markets", "pub_date_str": "17 Sep 2026, 06:32 AM IST", "pub_date_relative": "32m ago"}, {"title": "This Energy Solution Stock Jumps 40% After Amazon Deal", "full_content": "Under the agreement, Generac issued Amazon warrants to purchase up to 1.69 million shares at $200.93 per share. If fully exercised, the investment would be worth nearly $340 million.", "source": "NDTV Profit", "pub_date_str": "17 Sep 2026, 06:32 AM IST", "pub_date_relative": "32m ago"}, {"title": "First Interstate BancSystem director Julie A. Scott sells $101,628 shares", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Sep 2026, 06:30 AM IST", "pub_date_relative": "33m ago"}, {"title": "Raja Venkatraman recommends three stocks for 17 September", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nOn 15 September 2026, broader markets came under sharp pressure as the Nifty Smallcap 100 index extended its losing streak to five sessions, slipping 2% intraday and ending the week down nearly 5%. This correction followed a strong six-month rally of 25%, highlighting the impact of persistent foreign outflows and global rate concerns on smaller companies.\n\nPOLICYBZR: Buy above \u20b9 1830, stop \u20b9 1740 target \u20b9 2005 (Multiday)\n\nPVRINOX: Buy above \u20b9 1260, stop \u20b9 1210 target \u20b9 1375 (Multiday)\n\nSelling was broad-based, with Afcons Infrastructure plunging 14% intraday, while Pine Labs, Tata Chemicals, Firstsource Solutions, Welspun Corp, Data Patterns (India), and Narayana Hrudayalaya dropped between 4\u20136%. Several counters, including Whirlpool of India, Ircon International, Brainbees Solutions, and Afcons Infrastructure, touched fresh 52-week lows.\n\nForeign institutional investors remained net sellers for the fifth straight session, offloading \u20b9 2,977.86 crore worth of equities, while domestic institutions absorbed part of the pressure with net purchases of \u20b9 2,686.05 crore. Elevated U.S. Treasury yields near 5% and Brent crude above $100 a barrel added to global risk aversion.\n\nBenchmark indices also weakened, with the Nifty 50 down 1.19% and Sensex lower by 1.04% in the previous session, underscoring the cautious tone ahead of the U.S. Federal Reserve\u2019s policy decision. The combination of foreign portfolio outflows, higher yields, and elevated commodity prices remains a key driver of near-term volatility in Indian equities.\n\nThe temperament in the current market is seen dissipating as the overall trends are not able to generate a steady upward bias. In the last few days we have noted that the trends have been supressed and more of selling is keeping trends under check.", "source": "LiveMint Markets", "pub_date_str": "17 Sep 2026, 06:30 AM IST", "pub_date_relative": "33m ago"}], "cfa": [{"title": "Stock Market Today: All You Need To Know Before Going Into Trade On Sept 17", "full_content": "Stocks in the news, big brokerage calls of the day, complete trade setup and much more!", "source": "NDTV Profit", "pub_date_str": "17 Sep 2026, 06:54 AM IST", "pub_date_relative": "10m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "NSE Subscription for India IPO Starts With Valuation in Focus", "full_content": "(Bloomberg) -- National Stock Exchange of India Ltd.\u2019s long-awaited initial public offering starts taking orders Thursday, testing investor appetite for a valuation that remains rich compared with some of the world\u2019s biggest listed exchanges.\n\nThe shares are being offered at 1,700 rupees to 1,785 rupees a share and will close for subscription on Sept. 21. NSE reduced the number of shares on offer to 126.44 million from 148.9 million planned earlier, according to its updated prospectus. The offering is entirely a sale by existing shareholders, meaning the exchange won\u2019t receive any of the proceeds.\n\nAt the top end of the range, the deal is set to raise 226 billion rupees ($2.4 billion), the second-most ever for an IPO in the country behind Hyundai Motor India Ltd.\u2019s 2024 listing, which netted 279 billion rupees. That price would value NSE at about 42.9 times its earnings for the year ended March. While that\u2019s a discount to domestic rival BSE Ltd., it\u2019s well above the roughly 24 to 25 times ratio for some of the world\u2019s largest listed exchanges.\n\nThe premium reflects NSE\u2019s dominant position in one of the world\u2019s fastest-growing capital markets and its high profitability. The exchange reported net income of 103 billion rupees on revenue of 166 billion rupees in the year ended March 2026, according to its prospectus, translating into a profit margin of about 62%, above most large global peers.\n\n\u201cNSE is well positioned to benefit from structural tailwinds and remains the best franchise among peers\u201d because of India\u2019s deepening capital markets and rising global investor participation, SBICAPS Securities said in a note to clients.\n\nStill, analysts and investors are divided over whether NSE\u2019s market dominance and growth prospects justify the premium. NSE\u2019s gray-market premium has fallen to about 160 rupees a share from as high as 285 rupees on Sept.", "source": "LiveMint Markets", "pub_date_str": "17 Sep 2026, 06:51 AM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Top 5 breakout stocks to buy today by Sumeet Bagadia: Heritage Foods, HDFC Bank, JK Paper; check stop loss, target price", "full_content": "Stocks to buy : Benchmark indices Sensex and Nifty rebounded on Wednesday, supported by value buying after a sharp decline in the previous session, with banking stocks leading the recovery in the equity market.\n\nThe 30-share BSE Sensex rose 332.63 points, or 0.45%, to settle at 74,336.45. The index gained as much as 502.04 points, or 0.67%, during the session to touch 74,505.86. The 50-share NSE Nifty advanced 99 points, or 0.43%, to close at 23,217.60.\n\nNifty 50 closed at 23,217.60, up 99 points (+0.43%), recovering from an early dip as buying emerged near the 23,116 level. The index settled with a Doji-like candle, reflecting indecision after the recent sharp decline. Despite the recovery, RSI at 27.31 remains in oversold territory, while Nifty continues to trade below key moving averages, keeping the broader structure cautious.\n\n\u201cThe 23,000\u201323,080 zone remains the crucial support area, while 23,300\u201323,450 is the immediate hurdle, followed by the 50-Day EMA near 23,972. Put OI around 23,200\u201323,000 may provide some downside cushion, whereas Call OI around 23,300\u201323,500 could limit recovery. With PCR at 0.97 and VIX easing to 13.17, the near-term bias remains cautious, with oversold conditions supporting the possibility of a technical rebound,\u201d said Sumeet Bagadia, Executive Director at Choice Broking.\n\nBank Nifty closed at 56,292.45, up 497.70 points (+0.89%), staging a strong recovery after slipping to 55,812.20 during the first half. Buying from lower levels pushed the index towards the day\u2019s high of 56,368.70, resulting in a positive daily candle and indicating renewed demand in the banking space. PSU Banks showed relatively stronger participation, supporting the broader recovery.\n\n\u201cThe 55,700\u201356,000 region now forms the immediate support base, while 56,500\u201356,800 is the key resistance zone to watch. A sustained move above this resistance could improve short-term momentum, whereas failure to hold support may bring selling pressure back.", "source": "LiveMint Markets", "pub_date_str": "17 Sep 2026, 06:42 AM IST", "pub_date_relative": "22m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Derivatives", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Nifty technical view: Consolidation likely as index trades near crucial support", "full_content": "The Nifty 50 formed a small green-bodied candle on Wednesday with shadows on both sides, indicating indecision among market participants. Although the index ended the session with gains, the broader market remained under pressure as market breadth stayed negative and mid-cap and small-cap segments underperformed.\n\nThe index failed to close above the 23.6% retracement level of the previous day's decline and continued to form a lower low, keeping the short-term structure weak. As expected, the Nifty moved back inside the Bollinger Bands after the sharp fall, but it continues to trade below all key short-term moving averages, indicating that recovery attempts are yet to gain strength.\n\nThe 14-period daily RSI remains in the oversold zone, although it has recovered from the previous session\u2019s low, suggesting some improvement in momentum . The MACD histogram has shown a modest decline in negative momentum , indicating that selling pressure has eased slightly but has not yet reversed.\n\nThe immediate support for the index remains at 23,116\u201323,118, which represents the lows of the previous two trading sessions. Holding this zone will be important for the index to sustain the ongoing recovery attempt.\n\nThe Nifty may enter a consolidation phase over the next 2\u20133 sessions and could continue trading within Tuesday\u2019s range. A decisive close above 23,461, which is the 8-EMA, would provide the first indication of improving short-term sentiment.\n\nA close above Tuesday\u2019s high of 23,592 would further strengthen the recovery setup and could open the possibility of a counter-trend rally towards the 20-DMA, currently placed near 23,873.\n\nOn the downside, a break below the 23,116\u201323,118 support zone would indicate renewed weakness and may extend the decline towards 23,070, followed by 22,850.\n\nThe overall price structure remains damaged, and the index has not yet confirmed a trend reversal.", "source": "LiveMint Markets", "pub_date_str": "17 Sep 2026, 06:41 AM IST", "pub_date_relative": "22m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "US Fed rate hike impact on Indian banking: FOMC outcome effect on bank stocks", "full_content": "US Fed rate hike impact on Indian banking stocks : The Federal Reserve\u2019s latest interest-rate decision is expected to have implications for Indian markets, with the FOMC\u2019s policy outcome likely to influence the performance of Indian banking stocks.\n\nThe US Federal Reserve raised its benchmark interest rate by 25 basis points on Wednesday, taking the federal funds rate to a target range of 3.75%\u20134%. Policymakers also signalled the possibility of another rate hike later this year.\n\nThe rate increase came against the backdrop of persistent inflation, partly fuelled by continuing tensions in the Middle East, while the labour market remained relatively stable. The move marked the central bank\u2019s first rate hike in more than three years.\n\nMarket experts believe that the Federal Reserve\u2019s recent 25 basis point rate hike, coupled with a hawkish dot plot signaling another hike in 2026 and a higher long-run neutral rate of 3.25%, delivers an unmistakable message that the higher-for-longer policy regime is here to stay.\n\nWhen the US Federal Reserve changes its policy rates, the Reserve Bank of India (RBI) assesses the potential impact on the interest-rate differential, capital flows and currency markets.", "source": "LiveMint Markets", "pub_date_str": "17 Sep 2026, 06:40 AM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Economics", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "LIVE: NSE IPO opens today; latest GMP price, subscription status, allotment and listing date; market debut prediction", "full_content": "LIVE NSE IPO: The much-awaited \u20b9 22,569-crore NSE IPO is finally set to open for subscription today, 17 September, putting the spotlight firmly on the National Stock Exchange\u2019s much-anticipated market debut. The NSE IPO date for subscription is Thursday, 17 September, and the issue will remain open until Monday, 21 September.\n\nThe NSE IPO price band has been fixed at \u20b9 1,700\u2013 \u20b9 1,785 per equity share, with the cap price at 1,785 times the face value. The NSE IPO lot size is 8 equity shares, with investors able to bid in multiples of 8 thereafter.\n\nAs part of the NSE IPO details, up to 50% of the issue is reserved for Qualified Institutional Buyers (QIBs), at least 15% for Non-Institutional Investors (NIIs), and at least 35% for retail investors.\n\nNSE IPO GMP today, or grey market premium, is +145. Considering the upper end of the IPO price band and the current premium in the grey market, the estimated listing price of NSE share price was indicated at \u20b9 1,930 apiece, which is 8.12% higher than the IPO price of \u20b9 1,785.\n\nThe IPO comprises an Offer for Sale (OFS) of up to 12.64 crore equity shares, each with a face value of Re 1. The issue does not include any fresh issuance of shares by the company.\n\nThe company has reduced the number of shares on offer to 12.644 crore from the 14.89 crore proposed earlier, according to its red herring prospectus.\n\nThe NSE IPO comprises an Offer for Sale (OFS) by existing shareholders, with the exchange itself not receiving any proceeds from the issue. Chauhan said NSE does not need to raise fresh capital, citing its strong profitability and dividend payout of around \u20b9 8,000 crore last year, according to reports.\n\nThe NSE has allocated 1.39 crore equity shares, accounting for 36.98% of the total anchor book, to 29 domestic mutual funds.", "source": "LiveMint Markets", "pub_date_str": "17 Sep 2026, 06:32 AM IST", "pub_date_relative": "32m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Raja Venkatraman recommends three stocks for 17 September", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nOn 15 September 2026, broader markets came under sharp pressure as the Nifty Smallcap 100 index extended its losing streak to five sessions, slipping 2% intraday and ending the week down nearly 5%. This correction followed a strong six-month rally of 25%, highlighting the impact of persist left invested at 12% annualised returns could grow to around Rs 3.11 crore in 10 years, without any further SIP contributions.", "source": "NDTV Profit", "pub_date_str": "17 Sep 2026, 06:30 AM IST", "pub_date_relative": "34m ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Global Market Today: Asian stocks tick higher as markets weigh further Fed hikes", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Global Market Today: Asian stocks tick higher as markets weigh further Fed hikes Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market Today: Asian stocks tick higher as markets weigh further Fed hikes SECTIONS Global Market Today: Asian stocks tick higher as markets weigh further Fed hikes Bloomberg Last Updated: Sep 17, 2026, 06:32:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis In a strategic shift, the Federal Reserve raised interest rates by 0.25%, aiming to address ongoing inflation challenges. This decision led to a dip in Asian sovereign bonds and the dollar, while gold maintained its losses. Interestingly, Asian stock markets posted minor gains, leaving investors speculating about the future trajectory of monetary policy adjustments.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "17 Sep 2026, 06:30 AM IST", "pub_date_relative": "34m ago", "cfa_topics": ["Economics", "Equity Investments", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "'Hostile act': Trump threatens EU with tariffs over Canada associate-membership proposal", "full_content": "President Donald Trump on Wednesday threatened to impose tariffs on the European Union or halt trade with the bloc entirely if it proceeds with its plan to make Canada its first-ever \"associate member.\"\n\n\"I think it's laughable ... Canada has been a terrible trade partner,\" Trump told reporters after landing in North Carolina. He conditioned his threat on the intention of European leaders, saying that \"if I think it's at all a hostile act, I will put very serious tariffs or stop trading with Europe on many things.\"\n\nTrump's remarks came after European Commission President Ursula von der Leyen said EU was opening the door for Canada to become the first associate member of the 27-member bloc.\n\nAssociate membership doesn't currently exist as a formal category under EU treaties, and any such arrangement would need to be created and ratified by member states.\n\nThe proposal came as Brussels and Ottawa seek to deepen ties, signaling a significant shift in the EU, which had been lukewarm to Germany's proposal in May for granting an associate membership to Ukraine.\n\nIn her annual state of the EU address in Strasbourg, France, the EU chief said the bloc wants to bring the relationship with Canada \"to the highest level possible.\"\n\nCanadian Prime Minister Mark Carney, who attended the address, has said in the past that Ottawa was keen to pursue a \"unique security and economic alliance\" with Europe, but not a full membership.\n\nCanada has sought to diversify away from the U.S. following months of escalating trade tensions and as bilateral trade talks have collapsed . Trump has slapped a 50% tariff on Canadian goods and plans to ban the country's dairy, alcohol and auto imports later this month, drawing retaliation from Ottawa.", "source": "CNBC Top News", "pub_date_str": "17 Sep 2026, 06:25 AM IST", "pub_date_relative": "39m ago", "cfa_topics": ["Economics", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Rupee ends flat at 95.95 as RBI dollar sales offset pressure", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Forex \u203a Rupee ends flat at 95.95 as RBI dollar sales offset pressure The Economic Times daily newspaper is available online now. Read Today's Paper Rupee ends flat at 95.95 as RBI dollar sales offset pressure SECTIONS Rupee ends flat at 95.95 as RBI dollar sales offset pressure By ET Bureau Last Updated: Sep 17, 2026, 06:35:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis On Wednesday, the Indian rupee maintained its position at 95.95 against the US dollar, thanks to the central bank's dollar sales which helped stabilize its value. However, ongoing demand from oil firms and importers kept the currency under strain. Market analysts predict further depreciation, especially if the US Federal Reserve opts for interest rate increases, with trading expected between 95.75 and 96.25 on Thursday.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "17 Sep 2026, 06:23 AM IST", "pub_date_relative": "41m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Here\u2019s what a Fed rate hike means for your mortgage, car loan and credit cards - The Washington Post", "full_content": "Here\u2019s what a Fed rate hike means for your mortgage, car loan and credit cards The Washington Post What a Fed rate hike means for your bank accounts, loans, credit cards, and investments Yahoo Finance Federal Reserve raises interest rates to 3.75%-4% range wwlp.com The Key Takeaways From Kevin Warsh\u2019s Press Conference WSJ Federal Reserve hikes interest rates for first time since 2023 amid stubborn inflation Fox Business", "source": "Google News Business", "pub_date_str": "17 Sep 2026, 06:18 AM IST", "pub_date_relative": "46m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Bond yields could rise to 7.5% on crude, inflation pressures", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Bonds \u203a Bond yields could rise to 7.5% on crude, inflation pressures Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Bond yields could rise to 7.5% on crude, inflation pressures SECTIONS Bond yields could rise to 7.5% on crude, inflation pressures By Rozebud Gonsalves , ET Bureau Last Updated: Sep 17, 2026, 06:19:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Domestic bond yields may rise as much as forty-five basis points. Elevated crude prices and rising inflation expectations weigh on sentiment. The Reserve Bank of India's open market operation sales will increase bond supply. This action drains surplus liquidity from the financial system. Bond traders anticipate yields could reach around seven point five zero percent.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\nDomestic bond yields may rise as much as forty-five basis points. Elevated crude prices and rising inflation expectations weigh on sentiment. The Reserve Bank of India's open market operation sales will increase bond supply. This action drains surplus liquidity from the financial system. Bond traders anticipate yields could reach around seven point five zero percent.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "17 Sep 2026, 06:14 AM IST", "pub_date_relative": "50m ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Thin margins, high costs: why discount brokers are upset over UPI fees", "full_content": "Brokers worried about the new fee on UPI payments have moved the stock market regulator, fearing a body blow to discount brokers operating on wafer-thin margins to serve a growing retail user base. The 0.02% fee on UPI transactions above \u20b9 2,000 for the stock market takes effect on 15 October.\n\nThe BSE Brokers' Forum (BBF) informed the Securities and Exchange Board of India (Sebi) that merchant discount rate (MDR) on each UPI fund transfer made by clients to their brokers' designated client bank accounts would be many times the brokerage earned, a person aware of the matter said. It also stated that the broker was merely a pass-through entity, and that a client's money for a trade has to be mandatorily sent (upstreamed) to the clearing corporation by the end of day - the broker cannot use this money. The clearing corporation provides a counterparty guarantee for trade settlement in the event of client default.\n\nSimilarly, unused funds must be transferred back to the client every month or quarter as he chooses. The levy comes at a time retail participation in the market has begun to rise.\n\nA Sebi spokesperson and BBF officials were not immediately available for comment.\n\nHowever, a person with knowledge of the issue said the matter was not in Sebi's domain.\n\n\u201cTreating stockbrokers as merchants for MDR is fundamentally misplaced: brokers are largely pass-through entities, with client funds flowing to clearing corporations for margins and settlement,\" said Uttam Bagri, managing director, BCB Brokerage Pvt. Ltd. \"So, levying MDR on the entire fund flow, rather than the broker\u2019s actual revenue which is brokerage, would make UPI prohibitively expensive and effectively a non-starter for the broking industry.\u201d\n\nAnother broker said certain brokers charge nothing for delivery-based cash market trades, while charging a flat \u20b9 10-20 per order for futures and options and other segments.\n\n\"This is a pay-in (by a client) and not a purchase,\" he added.", "source": "LiveMint Markets", "pub_date_str": "17 Sep 2026, 06:00 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Quantitative Methods", "Financial Statement Analysis", "Equity Investments", "Derivatives"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "Stock recommendations for 17 September from MarketSmith India", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nStock market recap: On Wednesday, Indian equities rebounded, recovering part of the previous session's sharp losses as value buying emerged at lower levels ahead of tonight's US Federal Reserve policy decision.\n\nNifty 50 gained 99 points, or 0.43%, to close at 23,217.60, while Sensex rose 332.63 points, or 0.45%, to settle at 74,336.45. Banking and financial stocks led the recovery, with Nifty Bank up 0.78%, buoyed by optimism over additional revenue from UPI merchant charges.\n\nSBI and Axis Bank were among the top gainers, along with ITC. IT stocks bucked the trend, with Nifty IT declining nearly 2% as TCS, Infosys, and Wipro slipped, giving back part of the previous day's rally. FMCG , oil & gas, auto, and metals also ended higher.\n\nCrude oil prices stayed elevated near $108 per barrel on Saudi supply disruption concerns. Investors turned cautious near the close, awaiting the Fed's rate decision for cues on global liquidity. Market breadth remained weak despite the index gains, with 1,688 stocks advancing, 1,855 stocks declining, and 119 remaining unchanged, reflecting a selective, stock-specific rally.\n\nOn Wednesday, Indian equities ended higher, recovering from the previous session\u2019s sharp decline, although weak market breadth indicated gains remained concentrated in larger stocks. Nifty 50 closed at 23,217.60, up 99 points or 0.43%, after trading between 23,116.10 and 23,284.75, while Sensex finished modestly higher around 74,250.\n\nOn the sectoral front, FMCG (+1.63%) and PSU Banks (+1.44%) led gains, supported by private banks and realty, while IT (-1.58%) was the clear laggard. TCS and Infosys remained under pressure.\n\nOn the other hand, ITC , Axis Bank, BEL, and SBI were among prominent gainers. Broader participation was less encouraging with 1,688 stocks advancing, 1,855 stocks declining, and 119 remaining unchanged, translating into an advance-decline ratio of about 0.91.", "source": "LiveMint Markets", "pub_date_str": "17 Sep 2026, 06:00 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stocks in news: Infosys, Mazagon Dock, Fortis Healthcare, JSW Energy and Kalpataru Projects", "full_content": "On September 16, Indian markets experienced a careful resurgence, with the Nifty and Sensex both moving upwards. This rebound was fueled by increased investments in banking and prominent stocks following a steep drop the previous day. Key players like Infosys and Mazagon Dock are under scrutiny due to recent corporate events.", "source": "Economic Times Markets", "pub_date_str": "17 Sep 2026, 06:00 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Pre-market action: Here's the trade setup for today's session", "full_content": "Indian benchmark indices closed marginally higher after a volatile trading session. The US Federal Reserve increased its main interest rate for the first time in three years. This decision led to a slip in US stock markets on Wednesday. Foreign portfolio investors were net sellers, while domestic institutional investors bought shares. The Indian Rupee weakened for the seventh consecutive session against the     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
