look to Iran truce, but remain wary of attacks on oil facilities", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Sep 2026, 08:00 AM IST", "pub_date_relative": "41m ago"}, {"title": "Nifty earnings estimates ambitious but a weak rupee doesn\u2019t complicate outlook: Nuvama\u2019s Prateek Parekh", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nThe Indian rupee has depreciated by 6.76% against the US dollar so far in 2026 and is currently at \u20b9 95.95 per US dollar. While a depreciating Indian rupee is typically viewed negatively due to foreign capital flight risks and inflation fears, its impact on corporate earnings is nuanced, said Prateek Parekh, executive director - equity research, Nuvama Institutional Equities. At an index level, a weak rupee acts as a net positive for earnings by boosting export-heavy sectors, even though it presents challenges for consumer-facing segments and margins facing broader supply shocks. Edited excerpts:\n\nRupee depreciation is generally perceived to hurt India Inc.\u2019s sentiments. This is because it causes capital flight (as FII returns turn sombre), which hurts stock valuations and creates inflation concerns over input prices. However, the impact of rupee swings on India Inc\u2019s earnings is a lot more nuanced. A weaker rupee tends to boost earnings as nearly two-third of India Inc\u2019s topline comprises tradeables (companies where exports/imports swing product prices) like IT (information technology), commodities, industrials, chemicals, etc.\n\nFor this basket, a weaker rupee is a boon as it helps make exports competitive and raises the domestic pricing power of their products. Thus, while weaker rupee can perhaps put consumers at a disadvantage, it\u2019s a boon for producers like Nifty companies. So, while earnings estimates are certainly ambitious, a weaker rupee does not complicate, but rather enhances the outlook.\n\nIf the rupee weakens further, aggregate earnings may, at the margin, see improvement as exporter earnings (IT, chemicals, pharma) and commodity earnings (metals, energy) may get a boost. Also, it may help drive exports in some of the industrials, auto companies.", "source": "LiveMint Markets", "pub_date_str": "25 Sep 2026, 08:00 AM IST", "pub_date_relative": "42m ago"}, {"title": "Varmora Granito Allotment Status Today: How To Check On BSE, NSE And Kfin Technologies", "full_content": "Varmora Granito IPO Allotment status will be available on Sept. 25. Here is how to check your allotment status as focus shifts to the grey market premium ahead of listing next week.", "source": "NDTV Profit", "pub_date_str": "25 Sep 2026, 08:00 AM IST", "pub_date_relative": "42m ago"}], "cfa": [{"title": "Trump Shared Concerns Over Weak Yen With Japan\u2019s Takaichi", "full_content": "US President Donald Trump shared his concerns over the yen during a meeting with Japanese Prime Minister Sanae Takaichi earlier this week in New York, according to Japan\u2019s finance minister. The yen rose.\n\n\u201cAt the recent Japan-US summit, President Trump expressed concern about the weakness of the yen,\u201d Finance Minister Satsuki Katayama said Friday in a post-cabinet meeting briefing in Tokyo.\n\nIn response, Takaichi said that an undervalued yen was problematic, Katayama told reporters. Katayama added that she would continue to coordinate with her US counterpart Scott Bessent.\n\n\u201cUS Treasury Secretary Bessent and I will continue to communicate closely on a range of issues, including foreign exchange,\u201d Katayama said.\n\nTrump and Takaichi met on the sidelines of the UN General Assembly earlier this week. During that meeting, the two leaders discussed a range of issues, from security and relations with China to Japan\u2019s $550 billion investment pledge in the US.\n\nThe yen strengthened to around 158.33 per dollar late morning Friday in Tokyo, from around 158.70 before Katayama spoke.\n\n\u201cThis is largely another way of jawboning in my view,\u201d said Charu Chanana, chief investment strategist at Saxo Markets. \u201cUnless it is followed by actual policy coordination, intervention or a clearer BOJ tightening path, I don\u2019t think it changes the underlying yen story materially.\u201d\n\nThe US joined Japan in conducting intervention in the currency market in late July to boost the yen.", "source": "LiveMint Markets", "pub_date_str": "25 Sep 2026, 08:38 AM IST", "pub_date_relative": "3m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "A-One Steels IPO Day 2: Check subscription status, latest GMP, reviews, other key details", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a A-One Steels IPO Day 2: Check subscription status, latest GMP, reviews, other key details The Economic Times daily newspaper is available online now. Read Today's Paper A-One Steels IPO Day 2: Check subscription status, latest GMP, reviews, other key details SECTIONS A-One Steels IPO Day 2: Check subscription status, latest GMP, reviews, other key details By Kumar Gaurav , ETMarkets.com Last Updated: Sep 25, 2026, 08:16:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Rs 405 crore public issue is a book-built IPO comprising a fresh issue of 87.65 lakh shares worth Rs 355 crore and an offer for sale (OFS) of 12.35 lakh shares aggregating to Rs 50 crore.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to tors and seeing the danger of more durable inflation.\n\nAt the same time, markets are grappling with a central bank that suddenly has no interest in telegraphing its next moves, leaving an uncertain calculus on who is calling the shots \u2014 policymakers or market players.\n\n\"The time of looking through the initial supply shock has come to an end,\" said Joseph Brusuelas, chief economist at RSM. \"The bias has to be towards restoring price stability, and they should take what's going on seriously.\"\n\nMarkets expect the central bank will indeed take a firmer hand on inflation.\n\nOver the past day or so, traders raised the odds of a rate hike in October, which would come only a month or so after last week's quarter percentage point increase . They also see a third increase either late this year or early in 2027, with additional hikes possible in subsequent months.", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 08:08 AM IST", "pub_date_relative": "33m ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Varmora Granito IPO allotment likely today: Flat GMP signals muted listing. Here\u2019s how to check status", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a Varmora Granito IPO allotment likely today: Flat GMP signals muted listing. Here\u2019s how to check status JM Financial Share Price Choice International Share Price IIFL Capital Services Share Price Anand Rathi Share & Stock Brokers Share Price SMC Global Securities Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Varmora Granito IPO allotment likely today: Flat GMP signals muted listing. Here\u2019s how to check status SECTIONS Varmora Granito IPO allotment likely today: .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price", "source": "Economic Times Markets", "pub_date_str": "25 Sep 2026, 07:54 AM IST", "pub_date_relative": "47m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Asian stocks weather bond storm, oil retreats slightly", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Sep 2026, 07:54 AM IST", "pub_date_relative": "48m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Can you inherit ancestral family property in India after becoming an NRI? Know rules", "full_content": "If you move abroad, your right to inherit property in India is not automatically taken away. However, the rules can differ depending on whether the inheritance involves movable assets, such as bank accounts, stocks and jewellery or immovable property, such as land or real estate.\n\nA person may move temporarily or permanently to another country for various reasons, such as employment, marriage or education. When it comes to inheriting property located within Indian borders, non-resident Indians (NRIs) are governed by the country's succession laws.\n\nIf an NRI inherits immovable property, let's say a flat in a housing society, the ownership transfer process depends on whether the property is self-acquired or ancestral and has not been divided for the last four generations.\n\nSelf-acquired property can generally be transferred through a valid will, whereas ancestral property is subject to succession laws that may be influenced by religious beliefs and local customs, according to a report by Tax2win .\n\nNRIs, like other Indian citizens, have the legal right to inherit various forms of immovable property in     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
