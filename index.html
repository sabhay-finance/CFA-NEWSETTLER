ata released Wednesday from the Commerce Department revealed that the U.S. economy exhibited much stronger growth for the third quarter than initially estimated, showing that real GDP grew at a 4.3% annualized rate . That was revised upward from the department's advance estimate of 3.4%.\n\nThat revision was a \"RECORD SETTING ERROR,\" Trump said in a Truth Social post , suggesting that the initial release could have influenced the outcome of the 2026 U.S. midterm elections , where Democrats flipped both chambers of Congress and even multiple governorships.\n\n\"I would like to wish a Happy Thanksgiving to even those who issued fake Economic Numbers, just prior to the Election, and corrected them yesterday, three weeks late, showing that the GDP was actually 4.3%, versus 3.4%, A RECORD SETTING ERROR, and one so grave that it should be immediately investigated,\" Trump wrote.\n\nHowever, the difference between the advance estimate and the figure in the second release is far from being an all-time record. It was the largest revision since the 1.2 percentage point revision seen in the second quarter of 2020.\n\nOn an absolute basis, the latest revision was tied for 16th among all revisions from the advance estimate to the second release since 1990. It also tied four other quarters with a similar 0.9 percentage point difference \u2014 and was approximately double the average revision of 0.43 percentage points for all 147 quarters.\n\nThe upward revision shows Trump's policies are \"delivering results\" that defy expectations, White House spokesman Matthew Middleton told CNBC.\n\nRevisions to U.S. economic numbers are not out of the ordinary . Initial reports count on partial survey data and early estimates. Those data are later updated with more survey responses \u2014 which sometimes leads to changes from the initial reports.", "source": "CNBC Top News", "pub_date_str": "27 Nov 2026, 02:43 AM IST", "pub_date_relative": "1h ago"}, {"title": "8th Pay Commission: JPMorgan ions that the US Federal Reserve will hike interest rates again pressured the precious metal.\n\nSpot gold was down 0.4% at $3,566.99 per ounce by 1901 GMT. Prices briefly fell below the psychologically important $3,500 level on Wednesday for the first time since September 2025.\n\nUS gold futures for December delivery rose 0.9% to $3,565.90.\n\n\"Spot gold is testing support around the mid-$3,000 region. Gold is unlikely to see a sustained rebound until markets sense that the Fed is nearing the end of its rate-hike cycle,\" said Han Tan, chief market analyst at Bybit.\n\n\"Bullion bulls are set to be kept on the back foot... But fresh risk-off events across global financial markets may support the precious metal, adding to persistent purchases from central banks.\"\n\nRobust domestic demand is fuelling inflation in the US, with a measure of underlying price pressures in October posting its biggest year-over-year increase since late 2023, data showed on Wednesday. It reinforced expectations that the Fed will raise interest rates next month and again in early 2027.\n\nThe Fed's first rate hike in three years was delivered in September.\n\nWhile gold is traditionally viewed as an inflation hedge, elevated rates can weigh on the non-yielding asset.", "source": "LiveMint Markets", "pub_date_str": "27 Nov 2026, 12:41 AM IST", "pub_date_relative": "3h ago"}, {"title": "A 66-year-old nurse is facing down retirement with just $500 saved. Who\u2019s to blame?", "full_content": "\u201cRetirement is a financial status, not an age.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "27 Nov 2026, 12:30 AM IST", "pub_date_relative": "3h ago"}, {"title": "Stocks To Watch Today: Patanjali Foods, Torrent Power, Asian Paints, KPI Green And Ashiana Housing", "full_content": "Here's a look at stocks that are likely to be in focus during the trading session on Friday.", "source": "NDTV Profit", "pub_date_str": "27 Nov 2026, 12:00 AM IST", "pub_date_relative": "3h ago"}, {"title": "I\u2019ve been married for 58 years. It\u2019s \u2018our\u2019 money, not \u2018his\u2019 and \u2018hers.\u2019 Why do so many couples keep their finances separate?", "full_content": "\u201cMy wife stopped working outside the home in 1970.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "27 Nov 2026, 12:00 AM IST", "pub_date_relative": "3h ago"}, {"title": "Microdrama apps chase profits as Hollywood moves into short-form, vertical video", "full_content": "Bogdan Nesvit says his mission is simple: \"We are essentially building Disney for the 21st century.\"\n\nNesvit is the co-founder of microseries app My Drama, built around the latest, bite-sized form of storytelling. Short, serialized \"microdrama\" videos are created specifically for mobile devices and have generated billions of views this year. They often feature romantic tropes and typically end in cliffhangers to keep viewers hooked.\n\nThe category has exploded at a time when traditional media faces waning interest and YouTube now claims more viewing hours than individual streaming platforms.\n\nThe microdrama industry is projected to reach $1.5 billion in revenue in the U.S. in 2026, according to research firm Media Partners Asia. In China, where the format originally gained popularity, microdrama revenue surpassed what was made at the box office in 2024.\n\n\"It has the potential to evolve into mainstream entertainment and basically become mobile-first video streaming of the size of Netflix,\" Nesvit said.\n\nTech companies and startups such as My Drama currently lead the category in metrics like downloads and time spent on the apps.\n\nTikTok's PineDrama is the most popular microdrama app of 2026 so far with 13.2 million U.S. downloads through September, according to Sensor Tower data.\n\nStartups DramaBox and ReelShort beat out entertainment giants Netflix and Disney in average mobile usage time in the U.S. in the third quarter, according to Sensor Tower.", "source": "CNBC Top News", "pub_date_str": "26 Nov 2026, 11:57 PM IST", "pub_date_relative": "4h ago"}, {"title": "Rohit Sharma To Return As Mumbai Indians Captain? '24 Hours To Go' Post Sparks Frenzy", "full_content": "The five-time champions are expected to make a key leadership announcement as they look to end their IPL title drought in 2027.", "source": "NDTV Profit", "pub_date_str": "26 Nov 2026, 11:57 PM IST", "pub_date_relative": "4h ago"}, {"title": "Marlboro Maker Could Return To Global Cigarette Sales For First Time In 20 Years Via Imperial Deal", "full_content": "Altria is evaluating an all-cash offer for British tobacco company Imperial Brands. Japan Tobacco is also reportedly exploring a takeover, sending Imperial shares sharply higher.", "source": "NDTV Profit", "pub_date_str": "26 Nov 2026, 11:55 PM IST", "pub_date_relative": "4h ago"}, {"title": "Juventus vs Omonia Live Streaming: When And Where To Watch Europa League Match In India?", "full_content": "Juventus host Omonia in a crucial Europa League league-phase clash. Check the match time, venue, predicted XIs and broadcast information.", "source": "NDTV Profit", "pub_date_str": "26 Nov 2026, 11:53 PM IST", "pub_date_relative": "4h ago"}, {"title": "Bitcoin price today: World's largest crypto rebounds above $60,000, but remains down over 50% from peak", "full_content": "Bitcoin reclaimed the $60,000 mark on Thursday, November 26, after falling to approximately $57,900 a day earlier. The recovery came as riskier assets tracked a rebound in technology stocks, lifting cryptocurrency markets ahead of a period of thin holiday trading.\n\nThe world's largest cryptocurrency rose as much as 2.2% during the Asian session before paring some of its gains to trade at around $60,500 in New York trading. Other major tokens, including Ether and XRP, also advanced.\n\nBitcoin has come under severe selling pressure, putting it on course for its biggest monthly decline since a crypto-market meltdown more than four years ago. The original cryptocurrency has lost more than half its value since reaching a peak above $126,000 in October 2025 and is now worth less than it was when crypto-friendly Donald Trump returned to the White House.\n\nThe sector has struggled to regain investor confidence amid a series of high-profile hacks, mounting macroeconomic pressures and regulatory uncertainty following the US midterm elections, Bloomberg reported.\n\nThe $6 billion hack of Binance at the end of October rattled cryptocurrency markets. Weakness in artificial intelligence-related trades and expectations of higher US interest rates have also weighed on demand for riskier assets.\n\nWithdrawals from Bitcoin exchange-traded funds (ETFs) have raised concerns about a potentially more fragile market, as these funds have been an important source of demand since their launch in the US in 2024. So far this year, investors have withdrawn more than $3.7 billion from the funds.\n\nMeanwhile, expectations that stronger risk appetite could give the Federal Reserve more room to raise interest rates in December have added pressure on the non-yielding asset.\n\nBitcoin also recorded its seventh consecutive weekly decline last week, amid liquidations of leveraged long positions and concerns over tighter cryptocurrency regulations.", "source": "LiveMint Markets", "pub_date_str": "26 Nov 2026, 11:53 PM IST", "pub_date_relative": "4h ago"}, {"title": "US Marlboro maker Altria explores Imperial cash bid, possible carve-up - Reuters", "full_content": "US Marlboro maker Altria explores Imperial cash bid, possible carve-up Reuters Marlboro Maker Altria Explores Deal for Rival Imperial Brands WSJ Altria Studies Deal for Cigarette Maker Imperial Brands Bloomberg Marlboro maker Altria considering takeover bid for Imperial Brands The Guardian Marlboro maker Altria explores takeover of UK's Imperial Brands CNBC", "source": "Google News Business", "pub_date_str": "26 Nov 2026, 11:48 PM IST", "pub_date_relative": "4h ago"}, {"title": "A Few Miles From Where Trump Met Xi, Banned Nvidia Chips Are Up for Sale: Report", "full_content": "Vendors in the city's Huaqiangbei electronics market quoted up to $3.4 million for servers said to carry eight Blackwell B300 chips, The Washington Post reported.", "source": "NDTV Profit", "pub_date_str": "26 Nov 2026, 11:43 PM IST", "pub_date_relative": "4h ago"}, {"title": "Flydubai Resumes Israel Flights: What Travellers Need To Know About December 3 Return", "full_content": "The airline suspended its Dubai-Tel Aviv services after an aircraft made an emergency landing in Saudi Arabia in September following an alleged cockpit attack.", "source": "NDTV Profit", "pub_date_str": "26 Nov 2026, 11:42 PM IST", "pub_date_relative": "4h ago"}, {"title": "Stocks, Nasdaq Futures Climb as AI Trade Rebounds: Markets Wrap - Bloomberg", "full_content": "Stocks, Nasdaq Futures Climb as AI Trade Rebounds: Markets Wrap Bloomberg Global stocks rally as investors shrug off U.S. tariffs and AI jitters to 'fish for bargains' CNBC Asian Stock Futures Signal Gains, Oil Climbs Again: Markets Wrap Bloomberg Global stocks rise and tech shares rebound as US closes for Thanksgiving AP News Stocks rally, Europe sizes up next ECB chief Reuters", "source": "Google News Business", "pub_date_str": "26 Nov 2026, 11:37 PM IST", "pub_date_relative": "4h ago"}, {"title": "India vs New Zealand 2nd Test Live Streaming: When And Where To Watch IND vs NZ On TV, Online?", "full_content": "India face New Zealand in the second Test from November 27 to December 1. Check match timings, venue, India TV telecast and online live streaming details.", "source": "NDTV Profit", "pub_date_str": "26 Nov 2026, 11:35 PM IST", "pub_date_relative": "4h ago"}, {"title": "Spanish economist to become new European Central Bank chief - Al Jazeera", "full_content": "Spanish economist to become new European Central Bank chief Al Jazeera European Central Bank Chooses Pablo Hern\u00e1ndez de Cos as Next President The New York Times Spain\u2019s Pablo Hern\u00e1ndez de Cos set to lead European Central Bank CNBC European Central Bank set to appoint its first Spanish leader CNN De Cos Is Poised to Take ECB Presidency in Era After Lagarde Bloomberg", "source": "Google News Business", "pub_date_str": "26 Nov 2026, 11:34 PM IST", "pub_date_relative": "4h ago"}, {"title": "From \u20b950,000 to \u20b97.5 lakh monthly revenue: How this entrepreneur built a millet idli business", "full_content": "Starting a food business does not necessarily require a large initial investment. Chittem Sudheer, an agricultural economics graduate from Visakhapatnam , Andhra Pradesh , began his entrepreneurial journey in 2018 with \u20b9 50,000. His idea was to give a traditional South Indian breakfast a different identity by replacing conventional rice-based recipes with millet-based alternatives.\n\nHis venture, Vasena Poli, operates in the MVP Colony area of Visakhapatnam. What began as a small business has reportedly grown into an enterprise generating around \u20b9 7.5 lakh in monthly revenue, according to NDTV.\n\nSudheer started the venture without extensive publicity, concentrating instead on developing his products and building a customer base. The menu focuses on millet idlis and other food options made with ingredients that offer an alternative to conventional meals.\n\nOne of the distinguishing features of the idlis is their preparation. They are made using a combination of eight varieties of millets and steamed in vistaraku leaves, traditionally used in parts of Andhra Pradesh.\n\nThe idlis are served with chutneys made from ingredients such as bottle gourd, ginger and carrot. The use of these accompaniments adds to the restaurant's focus on vegetable-based food options.\n\nExplaining the nutritional value of millets in an interview with The Better India , Sudheer said: \"Millets are lesser-known in India. However, they have rich mineral properties like iron, magnesium, potassium, and copper. They also contain essential vitamins like folate, B6, C, E, and K and have more nutritional value than rice.\u201d\n\nMillets are whole grains that contain dietary fibre and several other nutrients.", "source": "LiveMint Money", "pub_date_str": "26 Nov 2026, 11:28 PM IST", "pub_date_relative": "4h ago"}, {"title": "Semiconductor chips are the new oil. Here's why", "full_content": "The artificial intelligence boom has pushed semiconductors past oil and gas in global export value for the first time, according to a Deutsche Bank analysis of International Trade Centre data .\n\nYet the milestone arrives at an awkward moment, just as investors reassess the outlook for artificial intelligence spending and drive down the price of semiconductor stocks. Last week, before Monday's breathtaking reversal, semiconductor stocks suffered their worst weekly loss in a quarter century, with the PHLX Semiconductor Index (SOX) plunging nearly 11% last Friday alone, capping a more than 17% weekly decline.\n\nNvidia soared more than 31% Monday after the leading maker of artificial intelligence chips had fallen for a seventh straight week, plunging 46% during that stretch. Then it fell again, dropping almost 10% on Tuesday and Wednesday. Advanced Micro Devices tumbled 20% in two days last Thursday and Friday. Micron Technology sank 27% over the seven days ended last Friday.\n\n\"For decades we've talked about the petrodollar. Perhaps increasingly we need to think about the chip dollar,\" Jim Reid, global head of macro and thematic research at Deutsche Bank wrote in a report this month.\n\nSemiconductor exports overtook oil and gas for the first time during the January-March quarter of 2026, reaching about $1.61 trillion, compared with $1.53 trillion for oil and gas, the report said, using four-quarter rolling totals.\n\nThe gap widened in the second quarter, when semiconductor exports totaled about $1.60 trillion and oil and gas exports reached about $1.47 trillion. Disruptions to oil supplies through the Strait of Hormuz after the Iran war helped widen the gap. Daily oil flows through the Strait collapsed nearly 77%, to 4.9 million barrels in the second quarter of 2026 from 21.6 million barrels in the fourth quarter of 2025, according to the U.S.", "source": "CNBC Finance", "pub_date_str": "26 Nov 2026, 11:22 PM IST", "pub_date_relative": "4h ago"}, {"title": "Scene Box Office Collection Day 21: Suriya Starrer Continues Its Steady Theatrical Run Into Week Three", "full_content": "Scene is a Tamil action comedy starring Suriya, with Pooja Hegde and Jyothika in key roles. Directed by Jithu Madhavan, the film blends crime, conflict and chaos into its story.", "source": "NDTV Profit", "pub_date_str": "26 Nov 2026, 11:19 PM IST", "pub_date_relative": "4h ago"}, {"title": "ENE Repeat Box Office Collection Day 8: Telugu Film Keeps Rs 25 Crore Mark In Sight, Mints This Much", "full_content": "ENE Repeat, directed by Tharun Bhascker Dhaassyam, follows Vivek and his friends as they reunite years after their Goa trip, bringing back old memories, friendships and a fresh adventure.", "source": "NDTV Profit", "pub_date_str": "26 Nov 2026, 11:13 PM IST", "pub_date_relative": "4h ago"}, {"title": "Buyback alert! Supriya Lifescience sets December 2 board meeting to consider share buyback; details here", "full_content": "A Ksheerasagar Published 26 Nov 2026, 11:09 PM IST Prefer Livemint on Google Supriya Lifescience has scheduled a board meeting for December 2, 2026, to consider and approve a proposal for a buyback of its fully paid-up equity shares, subject to necessary statutory and regulatory approvals.\n\nIn an exchange filing on Thursday, the company said its board would also consider authorising the actions and matters related to or incidental to the proposed buyback in accordance with the provisions of the Companies Act, 2013, and the SEBI (Buy-back of Securities) Regulations, 2018.\n\nThe company further said its trading window for dealing in securities by designated persons and their immediate relatives would remain closed from December 1, 2026, until 48 hours after the outcome of the board meeting is made public.\n\nSupriya Lifescience reported a 42% year-on-year decline in its consolidated net profit to \u20b9 29.25 crore for the September quarter of FY27, compared with \u20b9 50.43 crore in the corresponding quarter last year.\n\nRevenue from operations rose 3.2% year-on-year to \u20b9 206.30 crore in Q2 FY27, from \u20b9 199.83 crore in Q2 FY26.\n\nEBITDA declined to \u20b9 45.40 crore during the quarter, from \u20b9 72.65 crore a year earlier, while the EBITDA margin contracted to 22% from 36.4% in the year-ago period. The company's profit after tax (PAT) margin also declined to 14.2% from 25.2% in Q2 FY26.\n\nExplaining the pressure on its operating performance, the company said regulatory changes in the Latin American (LATAM) market affected demand for some of its higher-margin products. This resulted in a shift in its product and geographical mix, with a higher share of sales coming from semi-regulated markets during the quarter.\n\nThe company also reported higher operating expenses at its Ambernath facility, which is currently in the ramp-up phase.", "source": "LiveMint Markets", "pub_date_str": "26 Nov 2026, 11:09 PM IST", "pub_date_relative": "4h ago"}, {"title": "Pregnant inmate escapes from New Mexico corrections facility - NBC News", "full_content": "Pregnant inmate escapes from New Mexico corrections facility NBC News Rebecca Taylor: Pregnant US inmate escapes in prison vehicle after medical appointment BBC Pregnant Inmate Escapes in New Mexico Prison Transport Vehicle The New York Times Search for escaped inmate underway in Albuquerque KRQE Pregnant prison inmate on the run after driving off from a Whataburger in Albuquerque KOB 4", "source": "Google News Business", "pub_date_str": "26 Nov 2026, 11:06 PM IST", "pub_date_relative": "4h ago"}, {"title": "Forget Nvidia Shares? Wealthy Europeans See A Different Way To Bet On AI", "full_content": "Amid volatility in technology stocks, wealthy European investors are increasingly looking at private equity, real estate and infrastructure to gain exposure to artificial intelligence and future technology growth, a Goldman Sachs survey finds.", "source": "NDTV Profit", "pub_date_str": "26 Nov 2026, 11:01 PM IST", "pub_date_relative": "4h ago"}, {"title": "Aakasamlo Oka Tara Box Office Collection Day 7: Dulquer Salmaan Starrer Nears Rs 25 Crore, Holds Steady", "full_content": "Aakasamlo Oka Tara, directed by Pavan Sadineni, is a Telugu sci-fi drama starring Dulquer Salmaan and Satvika Veeravalli. Shruti Haasan and Ruhani Sharma also feature in key roles.", "source": "NDTV Profit", "pub_date_str": "26 Nov 2026, 10:59 PM IST", "pub_date_relative": "4h ago"}, {"title": "How North Korea\u2019s Hackers Are Trying to Cash Out The $6.3 Billion Binance Heist", "full_content": "More than $600 million worth of cryptocurrency stolen in the October Binance hack has passed through THORChain. Another $342 million reportedly moved through a coinjoin service.", "source": "NDTV Profit", "pub_date_str": "26 Nov 2026, 10:56 PM IST", "pub_date_relative": "5h ago"}, {"title": "Gold, Silver Rates Updates, Nov 26: Check 24K, 22K Gold And Silver Rates In Mumbai, Delhi, Chennai, Bengaluru, Hyderabad", "full_content": "Gold in India is priced at Rs 121910 per 10 grams and silver at Rs 143770 per kilogram on November 26, 2026.", "source": "NDTV Profit", "pub_date_str": "26 Nov 2026, 10:49 PM IST", "pub_date_relative": "5h ago"}, {"title": "Trade Setup For Nov 27: Traders See Nifty Marching To 26,150 If Bulls Cross This Key Hurdle", "full_content": "On the downside, the zone of 25,730-25,700 will serve as a crucial support area for the Nifty 50 as per analysts.", "source": "NDTV Profit", "pub_date_str": "26 Nov 2026, 10:48 PM IST", "pub_date_relative": "5h ago"}, {"title": "OM: Operation Mole Box Office Collection Day 7: Dhanush-Mammootty Starrer Continues Its Run; Check Earnings" miliar with the situation told CNBC. The people asked not to be named when discussing private information.\n\nThe interim final rule was announced by the Department of Commerce's Bureau of Industry and Security, or BIS, and came into effect on Nov. 19. Previously imposed export controls have effectively banned the sale of the most advanced Nvidia chips to Chinese companies and their import into China.\n\nPrior to the new rule's announcement, Nvidia had said it would not sell its chips to customers renting more than 50% of the graphics processing units, or GPUs, to Chinese companies, CNBC reported.\n\nThe new rule impacts the full supply chain, from the companies selling Nvidia chips to the neoclouds who rent access to computing power. Neocloud stocks have come under renewed pressure lately as investors questioned the sustainability of the AI boom.\n\nNvidia and the U.S. Department of Commerce's Bureau of Industry and Security did not immediately respond to a request for comment.\n\nThe change has prompted Nvidia chip sellers to look for new buyers of the semiconductor giant's GPUs, CNBC reported on Wednesday, citing three people familiar with the matter. Two of those people said it appeared chip sellers were seeking to offload GPUs because they were originally for use in data centers through which Chinese companies would rent access.", "source": "CNBC World Economy", "pub_date_str": "26 Nov 2026, 10:34 PM IST", "pub_date_relative": "5h ago"}, {"title": "Netherlands to Fight Rollout of Proposed US Curbs on ASML - Bloomberg", "full_content": "Netherlands to Fight Rollout of Proposed US Curbs on ASML Bloomberg Dutch government working to prevent passing of US MATCH bill, minister says Reuters ASML\u2019s CEO makes the case for selling chips to China Semafor Netherlands draws line over U.S. plan to restrict ASML exports to China NL Times The Match Act could hand China the keys to advanced lithography Bits&Chips", "source": "Google News Business", "pub_date_str": "26 Nov 2026, 10:24 PM IST", "pub_date_relative": "5h ago"}, {"title": "Global stocks climb after volatile US trading over AI risks", "full_content": "Tech shares hit this month by fears over whether boom can be sustained", "source": "FT Markets", "pub_date_str": "26 Nov 2026, 10:19 PM IST", "pub_date_relative": "5h ago"}], "cfa": [{"title": "Bitcoin stays afloat above $60.5k, but rates, regulatory fears persist", "full_content": "", "source": "Investing.com News", "pub_date_str": "27 Nov 2026, 03:41 AM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "I\u2019m terrified of a market crash. Should I put $400,000 of my $1 million retirement savings into an annuity?", "full_content": "\u201cWe have a house worth $450,000. Our combined annual income is $125,000.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "27 Nov 2026, 03:15 AM IST", "pub_date_relative": "43m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Trump demands probe into \u2018record setting error\u2019 after third-quarter GDP data gets massive revision higher", "full_content": "President Donald Trump on Thursday falsely deemed the latest gross domestic product revision a mistake, claiming that it should be \"immediately investigated.\"\n\nData released Wednesday from the Commerce Department revealed that the U.S. economy exhibited much stronger growth for the third quarter than initially estimated, showing that real GDP grew at a 4.3% annualized rate . That was revised upward from the department's advance estimate of 3.4%.\n\nThat revision was a \"RECORD SETTING ERROR,\" Trump said in a Truth Social post , suggesting that the initial release could have influenced the outcome of the 2026 U.S. midterm elections , where Democrats flipped both chambers of Congress and even multiple governorships.\n\n\"I would like to wish a Happy Thanksgiving to even those who issued fake Economic Numbers, just prior to the Election, and corrected them yesterday, three weeks late, showing that the GDP was actually 4.3%, versus 3.4%, A RECORD SETTING ERROR, and one so grave that it should be immediately investigated,\" Trump wrote.\n\nHowever, the difference between the advance estimate and the figure in the second release is far from being an all-time record. It was the largest revision since the 1.2 percentage point revision seen in the second quarter of 2020.\n\nOn an absolute basis, the latest revision was tied for 16th among all revisions from the advance estimate to the second release since 1990. It also tied four other quarters with a similar 0.9 percentage point difference \u2014 and was approximately double the average revision of 0.43 percentage points for all 147 quarters.\n\nThe upward revision shows Trump's policies are \"delivering results\" that defy expectations, White House spokesman Matthew Middleton told CNBC.\n\nRevisions to U.S. economic numbers are not out of the ordinary . Initial reports count on partial survey data and early estimates. Those data are later updated with more survey responses \u2014 which sometimes leads to changes from the initial reports.", "source": "CNBC Top News", "pub_date_str": "27 Nov 2026, 02:43 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Trump alleges \u2018fake\u2019 economic figures released before US midterms but doesn\u2019t provide evidence - The Guardian", "full_content": "Trump alleges \u2018fake\u2019 economic figures released before US midterms but doesn\u2019t provide evidence The Guardian Trump demands probe into \u2018record setting error\u2019 after third-quarter GDP data gets massive revision higher CNBC The Economy Grew Way Faster Than First Reported: Q3 GDP Revised Up to 4.3% Yahoo Finance Trump calls the pre-election GDP figures 'fake' and demands an investigation of Commerce Department AP News US economy grew faster last quarter than initially reported CNN", "source": "Google News Business", "pub_date_str": "27 Nov 2026, 01:11 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Gold drifts lower as Fed rate-hike fears loom", "full_content": "Nov 26 (Reuters) - Gold prices drifted lower on Thursday, as lingering inflation concerns and the market's growing expectations that the US Federal Reserve will hike interest rates again pressured the precious metal.\n\nSpot gold was down 0.4% at $3,566.99 per ounce by 1901 GMT. Prices briefly fell below the psychologically important $3,500 level on Wednesday for the first time since September 2025.\n\nUS gold futures for December delivery rose 0.9% to $3,565.90.\n\n\"Spot gold is testing support around the mid-$3,000 region. Gold is unlikely to see a sustained rebound until markets sense that the Fed is nearing the end of its rate-hike cycle,\" said Han Tan, chief market analyst at Bybit.\n\n\"Bullion bulls are set to be kept on the back foot... But fresh risk-off events across global financial markets may support the precious metal, adding to persistent purchases from central banks.\"\n\nRobust domestic demand is fuelling inflation in the US, with a measure of underlying price pressures in October posting its biggest year-over-year increase since late 2023, data showed on Wednesday. It reinforced expectations that the Fed will raise interest rates next month and again in early 2027.\n\nThe Fed's first rate hike in three years was delivered in September.\n\nWhile gold is traditionally viewed as an inflation hedge, elevated rates can weigh on the non-yielding asset.", "source": "LiveMint Markets", "pub_date_str": "27 Nov 2026, 12:41 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics", "Derivatives", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Microdrama apps chase profits as Hollywood moves into short-form, vertical video", "full_content": "Bogdan Nesvit says his mission is simple: \"We are essentially building Disney for the 21st century.\"\n\nNesvit is the co-founder of microseries app My Drama, built around the latest, bite-sized form of storytelling. Short, serialized \"microdrama\" videos are created specifically for mobile devices and have generated billions of views this year. They often feature romantic tropes and typically end in cliffhangers to keep viewers hooked.\n\nThe category has exploded at a time when traditional media faces waning interest and YouTube now claims more viewing hours than individual streaming platforms.\n\nThe microdrama industry is projected to reach $1.5 billion in revenue in the U.S. in 2026, according to research firm Media Partners Asia. In China, where the format originally gained popularity, microdrama revenue surpassed what was made at the box office in 2024.\n\n\"It has the potential to evolve into mainstream entertainment and basically become mobile-first video streaming of the size of Netflix,\" Nesvit said.\n\nTech companies and startups such as My Drama currently lead the category in metrics like downloads and time spent on the apps.\n\nTikTok's PineDrama is the most popular microdrama app of 2026 so far with 13.2 million U.S. downloads through September, according to Sensor Tower data.\n\nStartups DramaBox and ReelShort beat out entertainment giants Netflix and Disney in average mobile usage time in the U.S. in the third quarter, according to Sensor Tower.", "source": "CNBC Top News", "pub_date_str": "26 Nov 2026, 11:57 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Marlboro Maker Could Return To Global Cigarette Sales For First Time In 20 Years Via Imperial Deal", "full_content": "Altria is evaluating an all-cash offer for British tobacco company Imperial Brands. Japan Tobacco is also reportedly exploring a takeover, sending Imperial shares sharply higher.", "source": "NDTV Profit", "pub_date_str": "26 Nov 2026, 11:55 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Bitcoin price today: World's largest crypto rebounds above $60,000, but remains down over 50% from peak", "full_content": "Bitcoin reclaimed the $60,000 mark on Thursday, November 26, after falling to approximately $57,900 a day earlier. The recovery came as riskier assets tracked a rebound in technology stocks, lifting cryptocurrency markets ahead of a period of thin holiday trading.\n\nThe world's largest cryptocurrency rose as much as 2.2% during the Asian session before paring some of its gains to trade at around $60,500 in New York trading. Other major tokens, including Ether and XRP, also advanced.\n\nBitcoin has come under severe selling pressure, putting it on course for its biggest monthly decline since a crypto-market meltdown more than four years ago. The original cryptocurrency has lost more than half its value since reaching a peak above $126,000 in October 2025 and is now worth less than it was when crypto-friendly Donald Trump returned to the White House.\n\nThe sector has struggled to regain investor confidence amid a series of high-profile hacks, mounting macroeconomic pressures and regulatory uncertainty following the US midterm elections, Bloomberg reported.\n\nThe $6 billion hack of Binance at the end of October rattled cryptocurrency markets. Weakness in artificial intelligence-related trades and expectations of higher US interest rates have also weighed on demand for riskier assets.\n\nWithdrawals from Bitcoin exchange-traded funds (ETFs) have raised concerns about a potentially more fragile market, as these funds have been an important source of demand since their launch in the US in 2024. So far this year, investors have withdrawn more than $3.7 billion from the funds.\n\nMeanwhile, expectations that stronger risk appetite could give the Federal Reserve more room to raise interest rates in December have added pressure on the non-yielding asset.\n\nBitcoin also recorded its seventh consecutive weekly decline last week, amid liquidations of leveraged long positions and concerns over tighter cryptocurrency regulations.", "source": "LiveMint Markets", "pub_date_str": "26 Nov 2026, 11:53 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "US Marlboro maker Altria explores Imperial cash bid, possible carve-up - Reuters", "full_content": "US Marlboro maker Altria explores Imperial cash bid, possible carve-up Reuters Marlboro Maker Altria Explores Deal for Rival Imperial Brands WSJ Altria Studies Deal for Cigarette Maker Imperial Brands Bloomberg Marlboro maker Altria considering takeover bid for Imperial Brands The Guardian Marlboro maker Altria explores takeover of UK's Imperial Brands CNBC", "source": "Google News Business", "pub_date_str": "26 Nov 2026, 11:48 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Stocks, Nasdaq Futures Climb as AI Trade Rebounds: Markets Wrap - Bloomberg", "full_content": "Stocks, Nasdaq Futures Climb as AI Trade Rebounds: Markets Wrap Bloomberg Global stocks rally as investors shrug off U.S. tariffs and AI jitters to 'fish for bargains' CNBC Asian Stock Futures Signal Gains, Oil Climbs Again: Markets Wrap Bloomberg Global stocks rise and tech shares rebound as US closes for Thanksgiving AP News Stocks rally, Europe sizes up next ECB chief Reuters", "source": "Google News Business", "pub_date_str": "26 Nov 2026, 11:37 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Equity Investments", "Derivatives"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Spanish economist to become new European Central Bank chief - Al Jazeera", "full_content": "Spanish economist to become new European Central Bank chief Al Jazeera European Central Bank Chooses Pablo Hern\u00e1ndez de Cos as Next President The New York Times Spain\u2019s Pablo Hern\u00e1ndez de Cos set to lead European Central Bank CNBC European Central Bank set to appoint its first Spanish leader CNN De Cos Is Poised to Take ECB Presidency in Era After Lagarde Bloomberg", "source": "Google News Business", "pub_date_str": "26 Nov 2026, 11:34 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "From \u20b950,000 to \u20b97.5 lakh monthly revenue: How this entrepreneur built a millet idli business", "full_content": "Starting a food business does not necessarily require a large initial investment. Chittem Sudheer, an agricultural economics graduate from Visakhapatnam , Andhra Pradesh , began his entrepreneurial journey in 2018 with \u20b9 50,000. His idea was to give a traditional South Indian breakfast a different identity by replacing conventional rice-based recipes with millet-based alternatives.\n\nHis venture, Vasena Poli, operates in the MVP Colony area of Visakhapatnam. What began as a small business has reportedly grown into an enterprise generating around \u20b9 7.5 lakh in monthly revenue, according to NDTV.\n\nSudheer started the venture without extensive publicity, concentrating instead on developing his products and building a customer base. The menu focuses on millet idlis and other food options made with ingredients that offer an alternative to conventional meals.\n\nOne of the distinguishing features of the idlis is their preparation. They are made using a combination of eight varieties of millets and steamed in vistaraku leaves, traditionally used in parts of Andhra Pradesh.\n\nThe idlis are served with chutneys made from ingredients such as bottle gourd, ginger and carrot. The use of these accompaniments adds to the restaurant's focus on vegetable-based food options.\n\nExplaining the nutritional value of millets in an interview with The Better India , Sudheer said: \"Millets are lesser-known in India. However, they have rich mineral properties like iron, magnesium, potassium, and copper. They also contain essential vitamins like folate, B6, C, E, and K and have more nutritional value than rice.\u201d\n\nMillets are whole grains that contain dietary fibre and several other nutrients.", "source": "LiveMint Money", "pub_date_str": "26 Nov 2026, 11:28 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Financial Statement Analysis", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Semiconductor chips are the new oil. Here's why", "full_content": "The artificial intelligence boom has pushed semiconductors past oil and gas in global export value for the first time, according to a Deutsche Bank analysis of International Trade Centre data .\n\nYet the milestone arrives at an awkward moment, just as investors reassess the outlook for artificial intelligence spending and drive down the price of semiconductor stocks. Last week, before Monday's breathtaking reversal, semiconductor stocks suffered their worst weekly loss in a quarter century, with the PHLX Semiconductor Index (SOX) plunging nearly 11% last Friday alone, capping a more than 17% weekly decline.\n\nNvidia soared more than 31% Monday after the leading maker of artificial intelligence chips had fallen for a seventh straight week, plunging 46% during that stretch. Then it fell again, dropping almost 10% on Tuesday and Wednesday. Advanced Micro Devices tumbled 20% in two days last Thursday and Friday. Micron Technology sank 27% over the seven days ended last Friday.\n\n\"For decades we've talked about the petrodollar. Perhaps increasingly we need to think about the chip dollar,\" Jim Reid, global head of macro and thematic research at Deutsche Bank wrote in a report this month.\n\nSemiconductor exports overtook oil and gas for the first time during the January-March quarter of 2026, reaching about $1.61 trillion, compared with $1.53 trillion for oil and gas, the report said, using four-quarter rolling totals.\n\nThe gap widened in the second quarter, when semiconductor exports totaled about $1.60 trillion and oil and gas exports reached about $1.47 trillion. Disruptions to oil supplies through the Strait of Hormuz after the Iran war helped widen the gap. Daily oil flows through the Strait collapsed nearly 77%, to 4.9 million barrels in the second quarter of 2026 from 21.6 million barrels in the fourth quarter of 2025, according to the U.S.", "source": "CNBC Finance", "pub_date_str": "26 Nov 2026, 11:22 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Economics", "Financial Statement Analysis"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Buyback alert! Supriya Lifescience sets December 2 board meeting to consider share buyback; details here", "full_content": "A Ksheerasagar Published 26 Nov 2026, 11:09 PM IST Prefer Livemint on Google Supriya Lifescience has scheduled a board meeting for December 2, 2026, to consider and approve a proposal for a buyback of its fully paid-up equity shares, subject to necessary statutory and regulatory approvals.\n\nIn an exchange filing on Thursday, the company said its board would also consider authorising the actions and matters related to or incidental to the proposed buyback in accordance with the provisions of the Companies Act, 2013, and the SEBI (Buy-back of Securities) Regulations, 2018.\n\nThe company further said its trading window for dealing in securities by designated persons and their immediate relatives would remain closed from December 1, 2026, until 48 hours after the outcome of the board meeting is made public.\n\nSupriya Lifescience reported a 42% year-on-year decline in its consolidated net profit to \u20b9 29.25 crore for the September quarter of FY27, compared with \u20b9 50.43 crore in the corresponding quarter last year.\n\nRevenue from operations rose 3.2% year-on-year to \u20b9 206.30 crore in Q2 FY27, from \u20b9 199.83 crore in Q2 FY26.\n\nEBITDA declined to \u20b9 45.40 crore during the quarter, from \u20b9 72.65 crore a year earlier, while the EBITDA margin contracted to 22% from 36.4% in the year-ago period. The company's profit after tax (PAT) margin also declined to 14.2% from 25.2% in Q2 FY26.\n\nExplaining the pressure on its operating performance, the company said regulatory changes in the Latin American (LATAM) market affected demand for some of its higher-margin products. This resulted in a shift in its product and geographical mix, with a higher share of sales coming from semi-regulated markets during the quarter.\n\nThe company also reported higher operating expenses at its Ambernath facility, which is currently in the ramp-up phase.", "source": "LiveMint Markets", "pub_date_str": "26 Nov 2026, 11:09 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Forget Nvidia Shares? Wealthy Europeans See A Different Way To Bet On AI", "full_content": "Amid volatility in technology stocks, wealthy European investors are increasingly looking at private equity, real estate and infrastructure to gain exposure to artificial intelligence and future technology growth, a Goldman Sachs survey finds.", "source": "NDTV Profit", "pub_date_str": "26 Nov 2026, 11:01 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "How North Korea\u2019s Hackers Are Trying to Cash Out The $6.3 Billion Binance Heist", "full_content": "More than $600 million worth of cryptocurrency stolen in the October Binance hack has passed through THORChain. Another $342 million reportedly moved through a coinjoin service.", "source": "NDTV Profit", "pub_date_str": "26 Nov 2026, 10:56 PM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Gold, Silver Rates Updates, Nov 26: Check 24K, 22K Gold And Silver Rates In Mumbai, Delhi, Chennai, Bengaluru, Hyderabad", "full_content": "Gold in India is priced at Rs 121910 per 10 grams and silver at Rs 143770 per kilogram on November 26, 2026.", "source": "NDTV Profit", "pub_date_str": "26 Nov 2026, 10:49 PM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Trade Setup For Nov 27: Traders See Nifty Marching To 26,150 If Bulls Cross This Key Hurdle", "full_content": "On the downside, the zone of 25,730-25,700 will serve as a crucial support area for the Nifty 50 as per analysts.", "source": "NDTV Profit", "pub_date_str": "26 Nov 2026, 10:48 PM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "OM: Operation Mole Box Office Collection Day 7: Dhanush-Mammootty Starrer Continues Its Run; Check Earnings", "full_content": "Written and directed by Rajkumar Periasamy, OM brings together the journeys of different characters whose lives cross paths as they find themselves caught in a larger conflict that changes everything.", "source": "NDTV Profit", "pub_date_str": "26 Nov 2026, 10:44 PM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "From A Black Monolith To Instamart Timer: The Mystery Gripping Gurugram And Mumbai", "full_content": "A black monolith at Gurugram's World Mark, a Mumbai billboard and an Instamart timer have fuelled speculation about a possible brand launch.", "source": "NDTV Profit", "pub_date_str": "26 Nov 2026, 10:36 PM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Nvidia chip buyers told to rule out Chinese renters to purchase GPUs, sources say", "full_content": "Neoclouds are being told they won't be able to purchase Nvidia chips if any of the computing capacity will be rented by Chinese companies, sources told CNBC.\n\nIt comes after a new rule restricting remote access to artificial-intelligence semiconductors was announced by the Trump administration on Nov. 16.\n\nChip sellers communicated the messaging to neoclouds after the announcement, which seeks to close an export controls loophole allowing Chinese companies to rent access to Nvidia's most advanced chips when hosted in data centers overseas, two people familiar with the situation told CNBC. The people asked not to be named when discussing private information.\n\nThe interim final rule was announced by the Department of Commerce's Bureau of Industry and Security, or BIS, and came into effect on Nov. 19. Previously imposed export controls have effectively banned the sale of the most advanced Nvidia chips to Chinese companies and their import into China.\n\nPrior to the new rule's announcement, Nvidia had said it would not sell its chips to customers renting more than 50% of the graphics processing units, or GPUs, to Chinese companies, CNBC reported.\n\nThe new rule impacts the full supply chain, from the companies selling Nvidia chips to the neoclouds who rent access to computing power. Neocloud stocks have come under renewed pressure lately as investors questioned the sustainability of the AI boom.\n\nNvidia and the U.S. Department of Commerce's Bureau of Industry and Security did not immediately respond to a request for comment.\n\nThe change has prompted Nvidia chip sellers to look for new buyers of the semiconductor giant's GPUs, CNBC reported on Wednesday, citing three people familiar with the matter. Two of those people said it appeared chip sellers were seeking to offload GPUs because they were originally for use in data centers through which Chinese companies would rent access.", "source": "CNBC World Economy", "pub_date_str": "26 Nov 2026, 10:34 PM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Nifty 50 to hit 29,000? J.P. Morgan calls Indian stocks a 'safe haven' from AI trades; sees 12% upside. Key reasons", "full_content": "The bull run in the Indian stock market appears set to continue, with global investment bank J.P. Morgan saying domestic equities are emerging as a potential safe haven for investors seeking to diversify away from AI-focused trades.\n\nSo far in November, the Nifty 50 has rebounded 12.3%. If the index maintains this momentum over the remaining two trading sessions, it will mark its biggest monthly gain since April 2020, when it surged 14.6%.\n\nThe rally has also narrowed the index's year-to-date losses to just 1%, from 13.5% at its 2026 low. To put the sharp recovery into perspective, the Nifty 50 recorded its longest monthly losing streak in 25 years in September. During the same period, nearly 50% of its constituent stocks slipped into bear market territory.\n\nJ.P. Morgan now expects the rally to extend, forecasting further gains in 2027 after what it called the \"great comeback of 2026\". It expects the Nifty 50 to reach 29,000 by the end of 2027 in its base-case scenario, implying an upside of about 12% from Thursday's close, Reuters reported.\n\nMint could not independently verify the report. The brokerage's bull- and bear-case targets stand at 31,000 and 22,000, respectively, analysts led by Rajiv Batra said in a note.\n\nJ.P. Morgan forecasted MSCI India earnings growth of 14% in 2027, up from 12% in 2026, citing resilient consumption, improving profitability, faster credit growth, and rising private investment.\n\nThe brokerage also said it favoured domestic cyclicals over exporters, citing lower oil prices and a firmer rupee. It sees the potential for $100 billion in net foreign inflows if long-only investors return to benchmark weights, following approximately $15.5 billion in overseas buying so far in November.\n\nEarlier, Goldman Sachs turned bullish on Indian equities, upgrading its rating on India to 'Overweight' from 'Marketweight' and setting a Nifty 50 target of 28,500 by December 2027.", "source": "LiveMint Markets", "pub_date_str": "26 Nov 2026, 10:18 PM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Trump, NATO chief caution Russia as attacks on Ukraine\u2019s energy infrastructure intensify", "full_content": "U.S. President Donald Trump and NATO chief Mark Rutte issued a joint statement on Thursday urging Russia not to take any actions, intentionally or otherwise, that would further expand the Ukraine war.\n\nThe statement comes as Ukraine's allies sound the alarm over Russia's growing threat to European security and just one week after Trump's historic trilateral meeting with Russian President Vladimir Putin and Chinese President Xi Jinping in Asia.\n\nTrump and Rutte described their meeting at the Mar-a-Lago club in Palm Beach, Florida on Wednesday as \"very impactful,\" with Russia's nearly five-year-long war in Ukraine and the Iran war among the key topics of conversation.\n\n\"We also discussed the importance of Russia avoiding any actions that intentionally, or unintentionally, expand the war, and the importance of obtaining a peaceful resolution to the war as rapidly as possible,\" Trump and Rutte said in their statement.\n\nMoreover, the two discussed the importance of further increasing defense spending as well as investment in the defense industrial base in both the U.S. and NATO countries, according to the statement.\n\nTrump also said in a post on Truth Social Thursday that he \"briefed NATO on the tremendous progress\" being made in growing defense production, noting that the focus will be on building Patriot air defense systems, THAAD systems and Tomahawk cruise missiles, as well as \"many new Weapons, both Offensive and Defensive, that have not yet been viewed by the Public, or other Countries.\"\n\n\"There has never been a time when the United States has produced more Military Equipment or Munitions than now. Our 'cupboard' will soon be full and, when it is, our Allies and Partners throughout the World will be benefitting greatly,\" he said in the post.\n\nTrump's meeting with Xi and Putin, in which he described the Russian president as his \"friend,\" sparked alarm among European lawmakers about Washington's commitment to transatlantic security.", "source": "CNBC Top News", "pub_date_str": "26 Nov 2026, 09:42 PM IST", "pub_date_relative": "6h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Buyer beware? Nvidia's volatile swings expose risks of single-stock ETFs", "full_content": "Nvidia 's latest bout of volatility is highlighting risks tied to single-stock exchange-traded funds.\n\nAmong the hardest hit: the GraniteShares 2x Short NVDA Daily ETF (NVD) . The fund sank 63% on Monday after Jensen Huang got reinstated as the chip giant's CEO. Meanwhile, the firm's 2x Long NVDA ETF (NVDL) soared nearly 62% on the same day.\n\nETF Action founding partner Mike Akins joined \" ETF Edge \" as Nvidia shares soared 31% during Monday's session, wiping a large portion of the losses from the days following Huang's resignation . Shares cooled on Tuesday and Wednesday, however.\n\n\"Historically speaking, we do not see these types of large drawdowns followed by huge drives up in a healthy market,\" Akins said on Monday. \"It usually tends to be when you're in a recession or in a bear market territory, which we're not technically in for the broader market, but we are in for this AI trade.\"\n\nBut it may not be time to go cold turkey on single-stock funds.\n\n\"[Leveraged ETFs are] definitely a retail trading vehicle\u2026 I think it's OK to have a little fun trying to trade that,\" Akins added. \"I'm certain there are people that are better at trading these than others. But on the whole, timing the market is very, very hard.\"\n\nGraniteShares founder and CEO Will Rhind also joined \"ETF Edge\" on Monday as Nvidia single-stock short ETFs overshadowed his firm's new Anthropic launches: The 2x Short Anthropic Daily ETF (ANS) and the 2x Long Anthropic Daily ETF (AIL) .\n\n\"We thought this was going to be the biggest news event of the day with Anthropic the first leveraged ETFs going live,\" he said. \"I can tell you this is like a sideshow compared to what we're seeing with Nvidia.\"", "source": "CNBC Finance", "pub_date_str": "26 Nov 2026, 09:30 PM IST", "pub_date_relative": "6h ago", "cfa_topics": ["Economics", "Equity Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Ashiana Housing JV buys 10-acre land in Chennai for senior living project, eyes Rs 1,100 cr revenue", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Digital Real Estate \u203a Realty News \u203a Ashiana Housing JV buys 10-acre land in Chennai for senior living project, eyes Rs 1,100 cr revenue Ashiana Housing Share Price Valor Estate Share Price Raymond Realty Share Price Kolte-Patil Developers Share Price AGI Infra Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Ashiana Housing JV buys 10-acre land in Chennai for senior living project, eyes Rs 1,100 cr revenue SECTIONS Ashiana Housing JV buys 10-acre land in Chennai for senior living project, eyes Rs 1,100 cr revenue PTI Last Updated: Nov 26, 2026, 09:21:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Ashiana Housing Ltd recently revealed its acquisition of nearly 10 acres in Chennai aimed at a senior living initiative. In collaboration with Arihant Foundations, the project estimates a saleable area of around 9 lakh square feet, with an anticipated revenue potential of Rs 1,100 crore. The land purchase cost remains undisclosed, furthering Ashiana's commitment to senior living and group housing developments across various regions.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets .", "source": "Economic Times Markets", "pub_date_str": "26 Nov 2026, 09:21 PM IST", "pub_date_relative": "6h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Missed SIP installment? Know the impact on your bank account, CIBIL score and investments", "full_content": "A failed systematic investment plan ( SIP ) payment can leave mutual fund investors wondering whether they will face penalties, see their credit score take a hit or lose the money they have already invested.\n\nHowever, a missed SIP instalment does not automatically affect an investor's existing mutual fund holdings. It is also not treated in the same way as a missed loan EMI or an unpaid credit card bill.\n\nWhile a failed debit may attract bank charges and repeated failures can eventually lead to the cancellation of an SIP, investors should understand the distinction between these consequences, CNBC TV18 reported.\n\nA failed SIP debit may attract a charge from the bank, particularly if the transaction fails because of insufficient funds or an issue with the auto-debit mandate.\n\nBanks may levy a return or dishonour charge for such failed transactions. This fee is separate from any charges that a mutual fund house may impose.\n\nThe amount varies depending on the bank and the type of account. Investors should check their bank's latest schedule of charges to determine whether a fee applies.\n\nAn SIP is an investment instruction, not a borrowing obligation. Therefore, a failed SIP debit is generally not treated like a missed loan EMI or an unpaid credit card bill.\n\nCredit scores are primarily influenced by an individual's borrowing and repayment behaviour. Since an SIP does not involve credit, a failed payment does not automatically affect an investor's credit score.", "source": "LiveMint Money", "pub_date_str": "26 Nov 2026, 09:02 PM IST", "pub_date_relative": "6h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Spain\u2019s Pablo Hern\u00e1ndez de Cos set to lead European Central Bank", "full_content": "De Cos will lead the ECB into a period of political uncertainty and choppy growth, after winning the backing needed to succeed Christine Lagarde next year.", "source": "CNBC Top News", "pub_date_str": "26 Nov 2026, 08:58 PM IST", "pub_date_relative": "6h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "What will happen to gold rates? Crash or surge after the US Fed FOMC meeting outcome - Scenarios explained", "full_content": "Investors are watching the Federal Reserve\u2019s December meeting for clues about gold and silver prices after a sharp 2026 correction. Persistent inflation may prompt further rate hikes, supporting the dollar and pressuring bullion, while a pause could offer relief.&nbsp;", "source": "LiveMint Markets", "pub_date_str": "26 Nov 2026, 08:30 PM IST", "pub_date_relative": "7h ago", "cfa_topics": ["Economics", "Equity Investments", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics to     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
