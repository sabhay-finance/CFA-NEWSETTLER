t they would deploy substantial diesel stocks over 20 days. If that is the IEA's timeline, its members would supply about 1 million barrels each day for almost three weeks.\n\nDiesel futures are trading more than 1% lower Thursday at $4.86.\n\nThe IEA, headquartered in Paris, has more than 30 member states, including the U.S. and key European and Asian allies. The agency, created in 1974 in the wake of the Arab oil embargo, is tasked with maintaining energy security by deploying oil stockpiles in response to crises like the wars in the Middle East and Eastern Europe.\n\nThe Trump administration has pushed Europe to release diesel inventories as prices in the U.S. surged to record highs in September. The retail price of diesel stood at an average $6.32 per gallon Thursday, more than 70% above the same period last year, according to AAA.\n\nTrump is facing political pressure to address fuel prices ahead of the U.S. midterm elections on Nov. 3. The president struck a diesel deal with Russia last week that analysts have said will do little to reduce prices.\n\nThe G7 nations, led by France, announced earlier this month that they would deploy stocks through the IEA in response to the diesel crisis but did not give specific quantities.", "source": "CNBC Top News", "pub_date_str": "15 Oct 2026, 10:17 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Sebi reintroduces VWAP for derivatives expiry after CAS turns markets volatile", "full_content": "The Securities and Exchange Board of India (Sebi) on Thursday pulled back the two-month-old closing auction framework for settlement of derivatives contracts, after it led to abrupt price swings and uncertainty on expiry days.\n\nIn a late-night circular, the market regulator said that the closing price will be calculated based on a 30-minute volume-weighted average price (VWAP) on derivatives expiry days i.e. Tuesday and Thursday.\n\nSebi reviewed the framework through a consultation paper in September, following pushback from market participants over a liquidity squeeze during the auction. The paper outlined two options for calculating closing prices on derivatives expiry days: adopt a blended VWAP-based methodology or retain the existing VWAP calculation based on the last 30 minutes of continuous trading on settlement days for at least a year.\n\nUnlike a simple average, VWAP takes into account both the price and volume of trades. For instance, if 100 shares are traded at \u20b9 10 each and 50 shares at \u20b9 12 each, the WAP is \u20b9 10.67, compared with a simple average price of \u20b9 11. On the other hand, a CAS uses an auction to match orders and derive the closing price.\n\nMany market participants have urged Sebi to retain VWAP-based settlement pricing on expiry days-Tuesday for Nifty options and Thursday for Sensex options-and introduce blended pricing on non-expiry days for a year before transitioning fully to the blended framework.\n\nCAS, introduced in August, led to abrupt price swings on expiry day, making it difficult for traders to participate in the futures and options (F&O) segment.\n\nInitial operational challenges, including the need for market participants to modify their trading software and the early closure of the continuous trading session (CTS), have kept some participants, including arbitrage funds, away.", "source": "LiveMint Markets", "pub_date_str": "15 Oct 2026, 10:15 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Derivatives"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Banks with Jeffrey Epstein ties eyed by Democrats Warren and Garcia", "full_content": "Financial institutions and bank executives that may have aided the late financier Jeffrey Epstein' s sex trafficking operation are in the sights of a bipartisan group of lawmakers .\n\nLegislation introduced Thursday \u2014 and led by Sen. Elizabeth Warren , D-Mass., and Rep. Robert Garcia , D-Calif. \u2014 would require financial regulators to produce records related to Epstein, compel those regulators to investigate banks and executives with ties to the deceased convicted sex offender, and require industry bans and civil penalties for those found to have aided him.\n\n\"I have spent the last year calling on Donald Trump 's financial regulators to launch investigations into the big banks and executives who may have enabled Jeffrey Epstein's horrific crimes,\" Warren, who leads the Senate banking committee's Democrats, said in a statement. \"Since they have failed to act, Congress must. The bipartisan Epstein Wall Street Records Act will ensure overdue accountability for the wealthy and well-connected on Wall Street who put profits over people.\"\n\nThe legislation is co-led in the House by Reps. Ro Khanna , D-Calif., Thomas Massie , R-Ky., and Raja Krishnamoorthi, D-Ill. Sens. Richard Blumenthal , D-Conn., Ron Wyden , D-Ore., and Ben Ray Lujan , D-N.M., signed on to the Senate version. The House version has 17 Democratic co-sponsors.\n\nThe proposal would apply to the Federal Reserve , Federal Deposit Insurance Corporation , Treasury's Office of the Comptroller of the Currency and the Securities and Exchange Commission. A spokesperson for the Federal Reserve declined to comment.", "source": "CNBC Top News", "pub_date_str": "15 Oct 2026, 10:09 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "IIFL Finance Q2 profit nearly doubles to Rs 805 crore; AUM rises 38%", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a Earnings \u203a IIFL Finance Q2 profit nearly doubles to Rs 805 crore; AUM rises 38% IIFL Finance Share Price Sundaram Finance Share Price Piramal Finance Share Price Poonawalla Fincorp Share Price Capri Global Capital Share Price The Economic Times daily newspaper is available online now. Read Today's Paper IIFL Finance Q2 profit nearly doubles to Rs 805 crore; AUM rises 38% SECTIONS IIFL Finance Q2 profit nearly doubles to Rs 805 crore; AUM rises 38% By Sangita Mehta , ET Bureau Last Updated: Oct 15, 2026, 10:06:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis IIFL Finance reported a significant increase in profit after tax for the quarter, rising to Rs 805 crore. This growth was attributed to stronger operating leverage and reduced loan losses during the period. The company's assets under management also rose substantially to Rs 1.24 lakh crore, primarily due to growth in gold loans.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "15 Oct 2026, 10:06 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "L&T Finance Q2 net profit rises 33% to Rs 975 crore", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a Earnings \u203a L&T Finance Q2 net profit rises 33% to Rs 975 crore The Economic Times daily newspaper is available online now. Read Today's Paper L&T Finance Q2 net profit rises 33% to Rs 975 crore SECTIONS L&T Finance Q2 net profit rises 33% to Rs 975 crore By Sangita Mehta , ET Bureau Last Updated: Oct 15, 2026, 11:10:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis L&T Finance reported a 33% increase in consolidated net profit for the quarter ending September 30, 2026. The company's consolidated loan book rose 28% year-on-year to reach Rs 1.36 lakh crore. Net interest margin improved to 10.48%, while total income increased by 26% to Rs 5,484 crore. Asset quality also showed improvement, with gross non-performing loans declining to 2.7%.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "15 Oct 2026, 09:53 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "SEBI CAS: Framework revised; auction window set, reference price calculation for eligible securities changed - Details", "full_content": "The Securities and Exchange Board of India (SEBI) has revised the framework for the Clearing and Settlement (CAS) mechanism, introducing changes to the auction window and the calculation of reference prices for eligible securities.\n\nIn a late-night circular issued on Thursday, SEBI said that closing prices on derivatives expiry days \u2014 Tuesdays and Thursdays \u2014 will be calculated using the volume-weighted average price (VWAP) of trades executed during the final 30 minutes of the continuous trading session (CTS). The revised rules will come into effect on December 7, 2026.\n\nIn September, the regulator proposed two options for calculating settlement prices for index and single-stock derivatives on expiry days:\n\nIt proposed a blended VWAP based on trades executed during the final 30 minutes of the Continuous Trading Session (CTS) and the 10-minute Closing Auction Session (CAS), or retaining the existing method based solely on the final 30 minutes of CTS trading.\n\nThe Closing Auction Session (CAS) will operate as a separate 10-minute session from 3:30 p.m. to 3:40 p.m. on all trading days. The order-entry window will close at a randomly determined time, with the closure controlled by the system.\n\nOnce order entry ends, stock exchanges will match orders in accordance with the CAS framework. The closing price determined through the auction, along with the quantity of securities traded, will be disseminated to market participants as soon as practicable after order matching is completed.\n\nTrading in index derivatives contracts will continue until 3:45 p.m. on regular trading days. However, on expiry days, trading in expiring index derivatives contracts will end at 3:30 p.m. Stock derivatives contracts, meanwhile, will remain open for trading until 3:45 p.m. on all trading days, including expiry days.\n\nThe closing prices of securities covered by CAS will also be determined through the auction mechanism during special trading sessions conducted by stock exchanges.", "source": "LiveMint Markets", "pub_date_str": "15 Oct 2026, 09:50 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Nvidia, AMD, Dell sell-off in global tech rout on AI funding worries", "full_content": "Stocks tied to the artificial intelligence trade sank on Thursday, continuing a global sell-off.\n\nCollectively, 20 of the most valuable global AI and semiconductor stocks have shed more than $1 trillion in value so far this week, as interest rate hikes, AI financing and intensifying competition weighed on sentiment.\n\nNvidia fell about 2% while AMD and Intel each lost about 4%. Dell Technologies sank 8%. Neoclouds also dropped, with CoreWeave sinking 3%, Nebius down 5% and IREN falling more than 8%. Micron was down about 5% earlier but turned positive around noon ET.\n\nShares in the neoclouds pared some of the earlier losses after comments from Nvidia CEO Jensen Huang seemed to settle fears in the AI trade.\n\nHuang told Bloomberg at an event in Stockholm, Sweden, that he didn't see a need for Nvidia to backstop CoreWeave and that, \"Their cost of capital is actually decreasing.\"\n\nA sell-off in global technology hardware stocks also deepened across Asia and Europe on Thursday.\n\nSouth Korean chip giant SK Hynix plunged more than 10%, while rival Samsung Electronics fell 8.73%. Other South Korean chip-related stocks also came under pressure. LG Innotek sank 8.95%, Seoul Semiconductor shed 9.28% and Samsung SDI declined 6.26%.\n\nIn Japan, technology investment giant SoftBank Group tumbled 7.9%. Semiconductor testing equipment maker Advantest plunged almost 14%, while chipmaking equipment supplier Tokyo Electron lost 6.45%. Renesas Electronics declined 8%. Taiwan's TSMC , the world's largest contract chipmaker, fell 1.81%.", "source": "CNBC World Economy", "pub_date_str": "15 Oct 2026, 09:49 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Corporate Issuers"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Nifty bucks global AI selloff as heavyweights flex muscle", "full_content": "Indian stocks surged on Thursday, bucking a global sell-off in artificial intelligence (AI) and technology shares as domestic buying and a rush by traders to reverse their bets against the market fuelled the rally. However, market experts do not see the uptrend sustaining as of now as foreign funds continue to pull money out of Indian equities.\n\nThe Nifty 50 index closed 1.66% higher at 22,997.35 on Thursday, clocking its biggest rise in percentage terms since 12 June. The Sensex 30 index closed 2.1% up at 74,315.61, similarly recording its highest rise since 12 June.\n\nHeavyweights ICICI Bank, Reliance Industries Ltd, HDFC Bank and Bharti Airtel buoyed the index. Domestic institutional investors (DIIs) net bought shares worth \u20b9 3,319 crore, while FIIs net sold shares worth \u20b9 5,285 crore. However, the foreign institutional investors (FIIs), on a gross basis, still bought shares worth \u20b9 12,735 crore on Thursday.\n\nThe proof of short-covering was visible in the put-call ratio of weekly options contracts on the Nifty, which witnessed a dramatic rise, said analysts.\n\nThe put-call ratio of Nifty options expiring on 19 October jumped to 1.65 on Thursday from 1.01 a day earlier, implying that call sellers were forced to cut their short call positions due to the smacking rally in heavyweights such as RIL , ICICI Bank, Bharti Airtel and HDFC Bank, they said.\n\n\u201cThis means that for every 100 calls sold on Thursday, 165 puts were sold, skewing the market in favour of the bulls,\u201d said Sudhir Joshi, consultant at Khambatta Securities.\n\nThis ratio shows the number of outstanding puts relative to the outstanding calls. When the ratio rises, it's a bullish sign as investors and traders sell more puts than calls, hoping to pocket the premium paid by the put buyers who are bearish.\n\nWhile heavyweight stocks rose, the Nifty Smallcap 250 index fell 1.01% and Nifty Midcap 150 fell 0.8% on Thursday.", "source": "LiveMint Markets", "pub_date_str": "15 Oct 2026, 09:47 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Derivatives"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Wholesale prices jumped 6.3% annually in September, biggest gain since 2022", "full_content": "September's producer price index came in much hotter than economists forecast on Thursday, underscoring the continued inflationary pressure from energy amid the U.S. war with Iran.\n\nThe measure of underlying inflation pressures climbed 1.3% in September and 6.3% on an annual basis, according to the Bureau of Labor Statistics. That marked the largest monthly and annual gains since March 2022 and December 2022, respectively.\n\nBoth readings topped expectations of economists polled by Dow Jones, who forecast an advance of 0.6% on the month and 5.5% annually.\n\nEnergy drove a sizable chunk of those increases as the Middle East conflict curtailed oil supply and sent prices surging. The so-called core PPI, which excludes volatile food and energy prices from the wholesaler inflation index, added 0.7% on the month and 5% over the 12-month period.\n\nBut there are signs that soaring energy prices are having downstream effects on other categories. The BLS said in Thursday's release that almost half of September's increase in processed goods for immediate demand was connected to the rise in diesel fuel prices.\n\nIt's the latest report in recent days showing that inflation continues to hit consumers and companies.\n\nWednesday's consumer price index release showed a rise of 0.6% from August to September and 3.7% on a 12-month basis. Economists polled by Dow Jones had forecast growth of 0.6% and 3.6%, respectively.\n\nExcluding food and energy, the core CPI added 0.3% on the month and 2.6% compared with a year ago. Economists anticipated increases of 0.2% and 2.5%, respectively.", "source": "CNBC Top News", "pub_date_str": "15 Oct 2026, 09:45 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Sebi revises CAS rules, changes derivatives expiry settlement methodology", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Sebi revises CAS rules, changes derivatives expiry settlement methodology The Economic Times daily newspaper is available online now. Read Today's Paper Sebi revises CAS rules, changes derivatives expiry settlement methodology SECTIONS Sebi revises CAS rules, changes derivatives expiry settlement methodology By Akash Podishetti , ETMarkets.com Last Updated: Oct 15, 2026, 09:45:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Sebi has announced changes to the closing auction session for the equity cash market, which will begin in December 2026. The revised session will run from 3.30 pm to 3.40 pm, with specific phases for order entry. Moreover, the methodology for calculating settlement prices for derivatives contracts has been updated. Unexecuted orders will transition under new rules while maintaining time priority differences.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "15 Oct 2026, 09:45 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Derivatives"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Treasury yields slide as investors flee to safety of bonds amid tech rout", "full_content": "Treasury yields dropped Thursday, as investors continued to cash in technology shares and fled to the safety of bonds following the latest wholesale inflation data.\n\nThe benchmark 10-year Treasury yield recently tumbled more than 9 basis points to 5.093%, as did the 30-year Treasury bond yield, to 5.425%. The 2-year Treasury note yield was down more than 4 basis points to 4.759%.\n\nOne basis point equals to 0.01%, and yields and prices move in opposite directions.\n\nWholesale prices jumped at an annual rate of 6.3% in September , the biggest gain since 2022, according to the Bureau of Labor Statistics. Economists polled by Dow Jones were forecasting an advance of 5.5%.\n\nThe producer price report comes on the heels of the latest consumer price index released Wednesday that also came in hotter than expected. The measure of goods and services costs across the U.S. economy rose 0.6% monthly and 3.7% on an annual basis in September against the consensus forecast for gains of 0.6% and 3.6%, respectively.\n\nInvestors rotated into bonds amid a broader flight to safety, as growing fears of higher inflation and interest rates, and their effect on the AI spending boom, saw investors dump shares of high-flying technology companies.\n\nThe data did little to change interest rate expectations, with fed funds futures pricing in at least one more quarter-point raise by the end of the year, according to the CME FedWatch tool . The likelihood that rates will move higher than the current fed funds range of 3.75% to 4.00% has risen sharply over the past month.\n\n\"With a second day in a row of higher-than-expected inflation numbers, it seems the Fed will have no choice but to raise rates again this year,\" said Chris Zaccarelli, chief investment officer at Northlight Asset Management. \"While we don't expect them to raise rates later this month (because it is so close to the mid-term election), we do think that they will increase the Fed Funds rate another [quarter point] in December.\"", "source": "CNBC Top News", "pub_date_str": "15 Oct 2026, 09:44 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Derivatives", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "JetBlue\u2019s new domestic first class, BlueFirst, is now on sale", "full_content": "JetBlue 's new domestic first class , BlueFirst, is now available for booking on flights across more than 30 routes, the airline said Thursday.\n\nThis option will be available on domestic flights that are not currently served by the airline's lie-flat Mint business class, which it offers on longer flights. It's part of an overhaul of the carrier's fare options , which will include basic options that don't come with things like seat assignments, a standard option, and a \"flex\" option, which is refundable and more easily changed.\n\nThe new first-class section comes as JetBlue seeks to return to steady profitability by growing its higher-priced offerings amid strong demand for more expensive and roomier seats.\n\nThe first flight with BlueFirst seats will be on Dec. 8, between Boston and Fort Lauderdale , Florida, followed by routes between Fort Lauderdale and New York's LaGuardia Airport, with additional flights being rolled out in the following weeks and months.\n\nJetBlue is offering some introductory fares for BlueFirst seats for select flights, including a $299 flight from Boston to Fort Lauderdale, a $249 option from New York to Fort Lauderdale and a $299 option from New York to Liberia, Costa Rica.\n\nThe first-class tickets will offer seats that recline up to 5 inches and have up to 7 inches more legroom than Main seats, JetBlue said. Other perks include Bluetooth-connected seatback screens, food and beverage options, Group 1 boarding and expedited security.\n\nWithin the BlueFirst class, there are three tiered fare option s:\n\n\"We designed BlueFirst to deliver a more accessible first-class experience that combines the thoughtful hospitality and service customers expect from JetBlue with exceptional value and comfort. We're excited that customers can now start making BlueFirst part of their travel plans,\" JetBlue CEO Joanna Geraghty said in a news release.", "source": "CNBC Top News", "pub_date_str": "15 Oct 2026, 09:43 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Reliance Jio IPO to be listed soon: Why a 12% tariff hike may be coming in 3-4 months? Experts explain reasons", "full_content": "Amid growing buzz around Reliance Industries Limited-backed Jio Platforms\u2019 initial public offerings, telecom users can see a 12% tariff hike over the coming three to     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>

</body>
</html>
