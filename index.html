from 12% to 15% in less than three weeks.\n\nWood had already tilted the portfolio further towards India earlier this month, raising its allocation to 14% from 12% by adding two percentage points.", "source": "LiveMint Markets", "pub_date_str": "21 Nov 2026, 01:39 PM IST", "pub_date_relative": "15m ago"}, {"title": "NRE FD interest rates in November 2026: PNB, Kotak, Federal Bank offer up to 6.80%; compare top bank rates for NRIs now", "full_content": "If you are a Non-Resident Indian (NRI) aiming to invest your overseas savings and acquired wealth in India, then you can earn up to 6.80% interest on Non-Resident External (NRE) fixed deposits in the month of November 2026.\n\nSeveral prominent banks and financial institutions, including Punjab National Bank (PNB), Kotak Mahindra Bank and Federal Bank, are offering aspiring investors competitive rates following the recent revisions. Still, returns may vary depending on the banking institution, individual investors, deposit tenure, and other terms and conditions.\n\nKeeping these important aspects in mind, here is a comparison of the latest NRE FD interest rates offered by 5 prominent banking institutions:\n\nIt is important to note that PNB, Kotak Mahindra Bank, and Federal Bank are offering the highest rate of 6.80%, although the qualifying tenures and other aspects might differ. HDFC Bank and ICICI Bank, on the other hand, are offering a maximum rate of 6.60%.\n\nThat is why, before proceeding with any FD investments , it becomes essential for aspiring investors to clearly understand the distinct options, their pros and cons, significance and how they can add value in your financial well-being.\n\nNow, it is a given that the convenience of investment and the headline rate promised by a financial institution are vital; still, NRIs should also carefully check and compare deposit tenures and premature withdrawal conditions, along with their liquidity requirements before proceeding with any investments.\n\nFurthermore, n the talks from a country supporting new laws said the outcome was \"disappointing but could have been much worse\".", "source": "CNBC Top News", "pub_date_str": "21 Nov 2026, 01:32 PM IST", "pub_date_relative": "21m ago"}, {"title": "Upcoming dividend, split, rights issue record dates next week, Nov 23-27: Pashupati Cotspin, Zee Ent, Varvee, and more", "full_content": "VRAJ BONLON ZEEL Sharmila Bhadoria Updated 21 Nov 2026, 01:13 PM IST Prefer Livemint on Google Dividend, split, rights issue record dates next week, November 23- 27: Shares of Pashupati Cotspin , Zee Entertainment, Indergiri Finance Limited, and several other companies will remain in focus due to their corporate actions next week, ie between November 23 and November 27.\n\nAt least nine companies have fixed record dates for dividend, rights issue, buy back, and stock split for the coming week. Meanwhile, the Indian stock market continued its bullish run for the fourth straight week. It marks the longest winning run of Nifty and Sensex in five months.\n\nAs the market cheers and investors continue to plan their next week, here are all the details about corporate actions scheduled for the coming week.\n\nPashupati Cotspin, Vraj Iron And Steel Ltd, and Fusion CX have fixed record dates for dividend in the coming week. Pashupati Cotspin has announced a \u20b9 0.020 per equity share dividend with November 23 as record date. Fusion CX has announced \u20b9 0.75 per equity share dividend. Vraj Iron And Steel Ltd has fixed a record date for the coming week for \u20b9 0.60 per share.\n\nBonlon Industries , Indergiri Finance , Vellora Impact, and JTL Defence have announced the right issue of equity shares with their record dates coming in the next seven days.\n\nVarvee Global Ltd has announced stock split from shares (with face value of \u20b9 5 each) to \u20b9 2 each. As per the company\u2019s BSE filing, \u201c1 (One) equity share having face value of \u20b9 5 (Rupees Five Only) each, fully paid-up, be sub-divided / split into \u20b9 2 (Rupee Two Only) each.\u201d Zee Entertainment Enterprises has fixed November 25 as record date for buy back of shares.\n\nNifty closed 1.12% higher at 25,800.60 points, whereas BSE Sensex registered 1.08% gain and ended above 83,919. With this, Nifty 50 and Sensex closed with gains for the fourth straight session.", "source": "LiveMint Markets", "pub_date_str": "21 Nov 2026, 01:10 PM IST", "pub_date_relative": "43m ago"}, {"title": "Explained: Mohammed Siraj\u2019s Absence From India\u2019s Playing XI Sparks Cricketing Debate And Political Row", "full_content": "Captain Shubman Gill and batting coach Sitanshu Kotak backed the selection as a tactical call for all 5 days of the Test, not just Day 1 conditions.", "source": "NDTV Profit", "pub_date_str": "21 Nov 2026, 01:08 PM IST", "pub_date_relative": "45m ago"}, {"title": "Finolex Cables Cuts Copper Armoured Cable Prices By Up To 6%; Polycab, RR Kabel May Follow", "full_content": "The reduced prices will come into effect from November 21, 2026 (today onwards), and Polycab India Ltd. and RR Kabel Ltd. are likely to introduce price cuts in armoured cables next week.", "source": "NDTV Profit", "pub_date_str": "21 Nov 2026, 01:08 PM IST", "pub_date_relative": "45m ago"}, {"title": "South Korea\u2019s Lee urges faster AI investment during $5.2bn data center visit", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Nov 2026, 01:08 PM IST", "pub_date_relative": "45m ago"}, {"title": "Rigetti Computing CFO Jeffrey Bertelsen sells $30,996 in stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Nov 2026, 01:01 PM IST", "pub_date_relative": "53m ago"}, {"title": "Golden lessons from past gold price fluctuations amid current gold price crash \u2014 32% down from its peak in 2026", "full_content": "Gold prices have corrected sharply in 2026, leaving investors wondering how long the precious metal could take to recover its previous highs. Historical data suggests that investors may need patience, as gold has taken several years to regain its peak after major corrections.\n\nGold prices in India stood at around \u20b9 1.22 lakh per 10 grams on 21 November 2026, down over 32% from their January 2026 peak of around \u20b9 1.80 lakh, according to the MCX data.\n\nThe November 2026 Wealth Conversations report by FundsIndia , which examined previous gold market cycles, found that large corrections of more than 30% and subsequent recoveries have historically taken around 7-8 years.\n\nIts analysis of three past cycles shows that the recovery period varied significantly depending on the severity of the fall and market conditions. Here's what you need to know.\n\nThe 1980 correction was the steepest among the three periods analysed. Gold fell 57% from its peak of \u20b9 6,555 (per 31.1035 grams) to \u20b9 2,837 in June 1982. It took another seven years and five months to regain its previous high, taking the entire fall-and-recovery cycle to nearly a decade.\n\nThe fall-and-recovery cycle refers to the total time gold takes to decline from its previous peak and regain that peak.\n\nThe 1996 correction was relatively smaller, at 31%. Gold took three years and five months to reach its bottom and another two years and 10 months to recover its previous peak. The overall cycle lasted six years and four months.\n\nSimilarly, after peaking in November 2012, gold declined 29% before recovering its previous high in June 2019. The complete cycle took six years and seven months.", "source": "LiveMint Money", "pub_date_str": "21 Nov 2026, 12:59 PM IST", "pub_date_relative": "54m ago"}, {"title": "What Is a Self-Respect Marriage? Know About Anirudh Ravichander And Kavya Maran's Wedding Tradition", "full_content": "The couple's wedding has also brought the concept of a self-respect marriage' into the spotlight.", "source": "NDTV Profit", "pub_date_str": "21 Nov 2026, 12:54 PM IST", "pub_date_relative": "59m ago"}, {"title": "Stocks to buy: HSBC lists 19 Indian stocks that saw FY27 earnings upgrades, check target prices", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News Stocks to buy: HSBC lists 19 Indian stocks that saw FY27 earnings upgrades, check target prices Written by Debaroti Adhikary , ETMarkets.com | Nov 21, 2026, 01:04:54 PM IST 1 / 16 \u200bStocks with earnings upgrades As Indian companies wrap up the Q2 results season, HSBC pointed out that around 67% of firms\u2019 earnings were ahead of or in line with estimates. In its latest \u2018India Equity Strategy\u2019, the global brokerage firm said sales of companies excluding commodities grew 17% year-on-year, while net income rose 19% in Q2, making this the strongest quarter since December 2023. Mid and small-cap companies continued to lead, with earnings growth of 30% and 32%, but the growth among large caps also accelerated and the recovery broadened across sectors, it noted. It listed 19 Indian companies with \u2018Buy\u2019 ratings that saw FY27 consensus earnings upgrades following their respective Q2 result announcements.\n\nAther Energy saw the sharpest spike in FY27 consensus earnings estimates at 56% following the EV-scooter maker\u2019s Q2 results. HSBC has a \u2018Buy\u2019 call on the stock with a target price of Rs 1,800 apiece. This however implies around 6.5% downside potential from the stock\u2019s Thursday closing price of Rs 1,925 apiece as the stock has surged more than 33% in one month and 163% in 2026 so far.\n\nGAIL saw a 42% jump in FY27 consensus earnings estimates. HSBC has a \u2018Buy\u2019 call on the gas utilities stock with a target price of Rs 215 apiece. This implies around 11.9% upside potential from the stock\u2019s Thursday closing price of Rs 192.1 apiece.\n\nIIFL Finance saw a 20% increase in FY27 consensus earnings estimates. HSBC has a \u2018Buy\u2019 call on the diversified financial services stock with a target price of Rs 810 apiece.", "source": "Economic Times Markets", "pub_date_str": "21 Nov 2026, 12:51 PM IST", "pub_date_relative": "1h ago"}, {"title": "Silver prices crash 64.2% from January peak: Check latest rates in Delhi, Mumbai, Chennai and other cities", "full_content": "The prices of gold and silver have slid to a 14-month low in the domestic market on Friday, with both metals suffering serious losses and touching their lowest levels since September 2025. The primary reason for this is a strong US dollar and expectations of more Federal Reserve rate hikes.\n\nMCX gold prices closed at \u20b9 122,510, whereas silver prices closed at \u20b9 149,590 on Friday, as per data provided on the bullion website.\n\nSubsequently, the crash in precious metal prices in international markets has also weighed on domestic silver rates, with the overall market witnessing significant losses amid volatility and investor uncertainty.\n\nKeeping these important developments in mind, let us take a look at the silver prices across major Indian cities today, on Saturday, 21 November, as per data provided on the bullion website. Do note, Chennai and Coimbatore recorded the highest rates among the cities, whereas Delhi had the lowest.\n\nThe 999-fine silver rate stood at \u20b9 1,49,590 per kg nationally at the time of reporting. Here is a city-wise breakdown of silver prices on 21 November, as per Bullion data.\n\nThe correction in gold and silver prices has been profound and deep since their January peaks this year, with silver taking the hardest hit, plunging 64.2% from its January peak, while gold has fallen 31.5%.\n\nThe primary reason for such a steep correction is investor concerns over artificial intelligence, geopolitical uncertainty involving the US and Iran, and expectations of further US Federal Reserve interest rate hikes, all of which have weighed on precious metals.\n\nFor Indian investors and buyers, however, domestic silver prices also depend on factors such as currency movements, import costs and local market premiums. Going forward, developments in global geopolitics and these factors will collectively define the next price action in silver.", "source": "LiveMint Money", "pub_date_str": "21 Nov 2026, 12:49 PM IST", "pub_date_relative": "1h ago"}, {"title": "PM Modi Says India Has Shown It Can Break Limits, Unlock Possibilities At Event In IIT Kharagpur", "full_content": "Prime Minister Modi highlighted India's progress over 12 years in breaking barriers to empower the poor and unlock the nation's potential.", "source": "NDTV Profit", "pub_date_str": "21 Nov 2026, 12:46 PM IST", "pub_date_relative": "1h ago"}, {"title": "Two MBBS Students Suspended At Sultanpur Medical College For 'ragging' Junior", "full_content": "Government Medical College in Sultanpur has suspended two MBBS students until further orders following allegations of ragging a first-year student", "source": "NDTV Profit", "pub_date_str": "21 Nov 2026, 12:36 PM IST", "pub_date_relative": "1h ago"}, {"title": "Gold vs silver price crash compared: White metal loses 65%, gold sheds 37% from record highs| Wealth wiped, returns", "full_content": "Gold vs Silver price crash : The precious metals rally that had rewarded investors handsomely at the beginning of 2026 has turned into a brutal reversal, with gold and silver surrendering a significant portion of their gains. But while both metals have suffered a sharp correction, silver has taken a considerably bigger hit. MCX silver has plunged 65% from its January record high, compared with a 37% decline in gold, wiping out much of the former's spectacular rally.\n\nThe November 20 crash further changed the investment equation. Silver, which had outperformed gold through mid-October, surrendered almost its entire annual advance, allowing gold to emerge as the better-performing metal for investors who entered the market in October 2025 and held through the latest correction. Silver fell 6.7% on November 20, while gold declined 4.7%.\n\nThe reversal raises an important question for Indian investors: Was gold or silver the better investment in 2026, and how much wealth has been wiped out since the January peaks?\n\nBoth precious metals touched record highs on January 29, 2026, as geopolitical tensions and aggressive retail buying fuelled demand. However, the subsequent reversal has been particularly punishing for silver.\n\nMCX gold 's December futures contract had reached an all-time high of \u20b9 1,93,096 per 10 grams in January. By November 20, it had slipped to an intraday low of \u20b9 1,21,424, translating into a loss of \u20b9 71,672 per 10 grams, or 37.12%, from its peak. Gold also plunged 4.7%, or \u20b9 6,028, during the November 20 session alone.\n\nSilver witnessed an even steeper correction. MCX silver, which had scaled a lifetime high of \u20b9 4,20,048 per kg on January 29, crashed to an intraday low of \u20b9 1,46,868 on November 20. This represented a staggering decline of \u20b9 2,73,180 per kg, or 65.04%, from its record high.", "source": "LiveMint Markets", "pub_date_str": "21 Nov 2026, 12:35 PM IST", "pub_date_relative": "1h ago"}, {"title": "Rigetti CTO Andrew Bestwick sells $219,551 in shares", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Nov 2026, 12:31 PM IST", "pub_date_relative": "1h ago"}, {"title": "Donegal Group sr. vp Pandey sells $17,355 in stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Nov 2026, 12:31 PM IST", "pub_date_relative": "1h ago"}, {"title": "AgEagle director Brent Klavon buys $2,999 in stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Nov 2026, 12:31 PM IST", "pub_date_relative": "1h ago"}, {"title": "Bangladesh A vs Afghanistan A Live Streaming: When And Where To Watch Men's Asia Cup Rising Stars Match", "full_content": "Both teams are part of Group A and will be looking to strengthen their chances of reaching the semi-finals.", "source": "NDTV Profit", "pub_date_str": "21 Nov 2026, 12:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "World's Best School Prize 2026: 2 Bengaluru Institutions Among Top-3 Finalists", "full_content": "EuroSchool Bannerghatta, which places nature at the centre of its schooling approach, is a finalist for the Environmental Action prize", "source": "NDTV Profit", "pub_date_str": "21 Nov 2026, 12:29 PM IST", "pub_date_relative": "1h ago"}, {"title": "How are AI chip flows reshaping dollar dominance? Deutsche Bank explains", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Nov 2026, 12:28 PM IST", "pub_date_relative": "1h ago"}, {"title": "Concurrent Gainers: These 13 stocks gained for 5 days in a row, all rose over 27%", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News Concurrent Gainers: These 13 stocks gained for 5 days in a row, all rose over 27% Written by Rounak Khare , ETMarkets.com | Nov 21, 2026, 12:47:25 PM IST 1 / 14 Concurrent Gainers Over the five trading sessions ending November 20, the Sensex surged 1.08%, or 897.96 points, to close at 83,919, marking gains in four of the five sessions. Around 99 stocks from the BSE 200 index advanced in all five consecutive sessions from November 13 to 20. Of these, we shortlisted 13 stocks that consistently gained throughout the period, delivering cumulative returns ranging from 27.5% to 31%. (Data Source: ACE Equity)", "source": "Economic Times Markets", "pub_date_str": "21 Nov 2026, 12:27 PM IST", "pub_date_relative": "1h ago"}, {"title": "Can You Get A Home Loan To Build On Your Father\u2019s Land?", "full_content": "If your father owns the plot outright, you generally cannot assume you can take a loan against it in your own name.", "source": "NDTV Profit", "pub_date_str": "21 Nov 2026, 12:26 PM IST", "pub_date_relative": "1h ago"}, {"title": "Dhurandhar Dominates Dadasaheb Phalke International Film Festival Awards 2026 With Six Wins, Check Full List Of Winners", "full_content": "Aditya Dhar's Dhurandhar leads the DPIFF Awards 2026 with six wins, including Best Film, Best Director and Best Actor for Ranveer Singh.", "source": "NDTV Profit", "pub_date_str": "21 Nov 2026, 12:26 PM IST", "pub_date_relative": "1h ago"}, {"title": "Scene Vs Mookuthi Amman 2 Box Office Collection: Suriya-Starrer Beats Nayanthara Film By A Huge Margin", "full_content": "On Day 15, Scene collected Rs 77 lakh in India, compared with just Rs 1 lakh earned by Mookuthi Amman 2 on the same day.", "source": "NDTV Profit", "pub_date_str": "21 Nov 2026, 12:17 PM IST", "pub_date_relative": "1h ago"}, {"title": "Rigetti Computing COO Rivas sells $72,148 in stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Nov 2026, 12:16 PM IST", "pub_date_relative": "1h ago"}, {"title": "AgEagle chairman Grant Begley buys $7,317 in company stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Nov 2026, 12:16 PM IST", "pub_date_relative": "1h ago"}, {"title": "IndusInd Bank Terminates Former CEO Sumant Kathpalia, Invokes Clawback From 2020", "full_content": "The private-sector lender stated in an exchange filing that the board actedon the findings of an inquiry report submitted on Nov. 18 by an enquiry officer, a former judge of the Bombay High Court.", "source": "NDTV Profit", "pub_date_str": "21 Nov 2026, 12:10 PM IST", "pub_date_relative": "1h ago"}, {"title": "Jushi Holdings director Denis Arsenault buys $38,104 in company stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Nov 2026, 12:02 PM IST", "pub_date_relative": "1h ago"}, {"title": "Builder fails to provide documents for home loan disbursal; later cancels flat over unpaid dues: How Noida couple won?", "full_content": "You work hard, save money, and take a home loan to buy your dream home. But what happens if the builder fails to provide the documents needed for the bank to release your sanctioned loan and then cancels your flat allotment over non-payment? A recent Noida couple's case has brought this issue into focus.\n\nThe district consumer commission has ruled in favour of the homebuyers and directed the builder to hand over possession of the flat. Here's what happened in the case and what the ruling means for homebuyers .\n\nAccording to a Times of India report, the dispute involved Manoj Kumar Bhrigu and his wife, Niranjana Sharma, who had booked a 1,595 sq ft apartment in a project developed by JSS Buildcon Pvt Ltd for \u20b9 77.35 lakh.\n\nThe couple paid \u20b9 1 lakh through cheque on 7 July 2023, followed by another \u20b9 6.5 lakh on 28 July, taking their total initial payment to \u20b9 7.5 lakh. Under the builder-buyer agreement, they had agreed to clear the remaining amount in one lump sum through a home loan instead of paying in instalments.\n\nThey approached the Central Bank of India's Shalimar Bagh branch in Delhi for a \u20b9 64 lakh home loan. The loan arrangement was processed on 27 September 2023, through a tripartite agreement involving the buyers, the builder and the bank.\n\nA tripartite agreement is a three-party arrangement that sets out the respective responsibilities of the homebuyer, builder and lender. It is commonly used to finance the purchase of under-construction properties, particularly when the sale deed has not yet been registered in the buyer's name.\n\nOn 24 November, the bank informed the developer through email that the loan had been approved and requested two documents required to release the funds. However, the builder allegedly did not provide the paperwork despite repeated reminders from the bank and the buyers.\n\nWith the loan amount still awaiting disbursal, the builder cancelled the flat allotment, citing non-payment of the outstanding amount.", "source": "LiveMint Money", "pub_date_str": "21 Nov 2026, 11:55 AM IST", "pub_date_relative": "1h ago"}, {"title": "Loud Calls, Music On Trains Could Land You In Jail", "full_content": "Railway officials said loud behaviour inconveniences fellow passengers and disrupts the calm of compartments, particularly air-conditioned coaches.", "source": "NDTV Profit", "pub_date_str": "21 Nov 2026, 11:51 AM IST", "pub_date_relative": "2h ago"}, {"title": "'I Feel Really Bad': Salman Khan Reveals He Called Shraddha Kapoor To Apologise Over Maatrubhumi-Eetha Clash", "full_content": "Salman Khan says he was unaware that Shraddha Kapoor\u2019s Eetha was releasing on December 4, the same day as Maatrubhumi.", "source": "NDTV Profit", "pub_date_str": "21 Nov 2026, 11:51 AM IST", "pub_date_relative": "2h ago"}, {"title": "Thinking Of Becoming A Loan Guarantor? Know The Risks Before You Say Yes", "full_content": "The Indian Contract Act also recognises continuing guarantees, which can cover a series of transactions rather than a single obligation.", "source": "NDTV Profit", "pub_date_str": "21 Nov 2026, 11:44 AM IST", "pub_date_relative": "2h ago"}, {"title": "Nvidia vs Anthropic shares: AI chip stock tanks 14% while Claude-maker falls 8.5% - See who wins in earnings, valuation?", "full_content": "Nvidia vs Anthropic : One builds the chips powering the artificial intelligence revolution, while the other develops some of the world's most advanced AI models. Yet, despite operating at opposite ends of the AI ecosystem, Nvidia and Anthropic are discovering that Wall Street's appetite for artificial intelligence stocks has limits. Nvidia shares plunged 14% on Friday, November 20, while Anthropic tumbled 8.5%, surrendering much of its gains following a record-breaking Nasdaq debut.\n\nThe contrasting fortunes of the two companies offer a glimpse into the changing dynamics of the AI trade. Nvidia remains a profit-generating chipmaking powerhouse, while Anthropic is betting on explosive revenue growth despite substantial operating losses and enormous computing commitments. Both companies are now facing questions about valuations, the sustainability of AI spending and how quickly the technology can translate into returns for investors.\n\nNvidia's latest decline extended its losing streak to seven consecutive weeks, its longest since the 2008 global financial crisis. The stock plunged 14.01% on Friday to close at $125.53, leaving it 48.4% below its 52-week high of $243.37.\n\nThe shares have declined approximately 28% since November 12, when founder Jensen Huang's resignation was announced. The decline has erased more than $1 trillion in market capitalisation over the period, according to reports. Nvidia, once the world's most valuable publicly listed company, has slipped to fourth place behind Apple , Microsoft and Alphabet .\n\nAnthropic's stock market journey has been equally volatile, despite its blockbuster IPO. The Claude developer priced 980 million shares at $83 apiece on November 18, raising $81.34 billion and surpassing SpaceX's June 2026 IPO record.\n\nShares opened at $111.50 on November 19 and closed their debut session at $97.17, a 17% gain over the offering price.", "source": "LiveMint Markets", "pub_date_str": "21 Nov 2026, 11:41 AM IST", "pub_date_relative": "2h ago"}, {"title": "AI to lead investment strategy in 2027; Energy and borrowing costs shape macro outlook: Barclays", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a AI to lead investment strategy in 2027; Energy and borrowing costs shape macro outlook: Barclays The Economic Times daily newspaper is available online now. Read Today's Paper AI to lead investment strategy in 2027; Energy and borrowing costs shape macro outlook: Barclays SECTIONS AI to lead investment strategy in 2027; Energy and borrowing costs shape macro outlook: Barclays ANI Last Updated: Nov 21, 2026, 11:39:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis According to the latest report from Barclays Private Bank, the impending year 2027 calls for a stronger investment focus on artificial intelligence. While infrastructure is steadily developing, the rising costs of debt financing could negatively impact the economics of these projects. The report warns of potential computing demand outpacing supply, which may hinder technology scalability. Investors should approach government bonds with caution due to elevated yields and inflation worries.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "21 Nov 2026, 11:39 AM IST", "pub_date_relative": "2h ago"}, {"title": "The American Dream: Is A US Degree Still Worth It As Tuition Fees Hit $100,000? Expert Answers", "full_content": "Mukesh Aghi President and CEO of the US-India Strategic Partnership Forum explains what Indian students need to think before the apply to US Universities.", "source": "NDTV Profit", "pub_date_str": "21 Nov 2026, 11:39 AM IST", "pub_date_relative": "2h ago"}, {"title": "WhatsApp Group Member Limit Increased To 1,500: Here's What Users Can Expect", "full_content": "The move is part of WhatsApp's broader efforts to improve group communication and make the platform more useful for people managing large communities.", "source": "NDTV Profit", "pub_date_str": "21 Nov 2026, 11:36 AM IST", "pub_date_relative": "2h ago"}, {"title": "How China is using summits to expand its global influence", "full_content": "SHENZHEN, China \u2014 For a second year in a row, Chinese President Xi Jinping has brought Russian President Vladimir Putin together with another major world leader on mainland Chinese shores.\n\nU.S. President Donald Trump had a trilateral meeting with Xi and Putin on Thursday, after the three met the prior evening during a welcome banquet for the Asia-Pacific Economic Leaders' Meeting in Shenzhen. It marked the first time they had met together in person.\n\nIn September 2025, Xi, Putin and Indian Prime Minister Narendra Modi briefly laughed together for a friendly photo-op alongside an annual meeting of the Shanghai Cooperation Organization in Tianjin, China. The gathering followed easing tensions between Beijing and New Delhi.\n\nChina's \"ability to engage directly with the world major powers\" reflects the country's influence across the Global South and Eurasia, said Jodie Wen, postdoctoral fellow at the Center for International Security and Strategy at Tsinghua University. \"China hopes to play a more constructive role in this conflict-[ridden], unstable world.\"\n\nIn the future, \"China will hope to provide more platforms\" within its borders for countries to discuss issues, she said.\n\nTrump, Xi, Putin said they plan to boost oil production, revamp UN after trilateral talks\n\nI watched Trump, Xi and Putin gather in China. Here are my top takeaways\n\nTrump holds talks separately with Putin and Xi ahead of their historic trilateral meeting", "source": "CNBC Finance", "pub_date_str": "21 Nov 2026, 11:30 AM IST", "pub_date_relative": "2h ago"}, {"title": "An early breakdown in the polar vortex is threatening already depleted gas stocks", "full_content": "An unprecedented early breakdown of the stratospheric polar vortex and a record-breaking El Ni\u00f1o event has put energy traders on alert this winter, with analysts warning the weather and climate phenomena could have an outsized impact on Europe.\n\nMeteorologists are currently observing a record early breakdown of the polar vortex, a large-scale circulation of strong winds that typically keeps extremely cold air over the North Pole.\n\nChanges in the strength and shape of the polar vortex can influence weather patterns much lower down in the atmosphere, potentially bringing in colder weather to parts of Europe and North America.\n\nThis year, however, the collapse of the stratospheric polar vortex, or SPV, is taking place at the same time as an unusually powerful El Ni\u00f1o, a climate event that can boost global temperatures and disrupt rainfall.\n\nThe collision of these two events raises the risk of a prolonged cold spell that could lift heating demand and force European countries to draw down already-low reserves faster. That would leave the continent more reliant on imported liquefied natural gas (LNG) at a time when supplies from the Middle East are disrupted.\n\nTo be sure, Europe's natural gas storage levels started the winter at their lowest level in more than a decade.\n\nThe International Energy Agency warned earlier this month that low European storage levels and limited storage options in several LNG-importing countries in Asia and South America could intensify the competition for cargoes and put upward pressure on prices during periods of high demand.\n\nSimon Lee, a lecturer in atmospheric science at the U.K.'s University of St Andrews, said the combination of a sudden stratospheric warming (SSW) with an El Ni\u00f1o event is not necessarily unusual, but meteorologists had been expecting a polar vortex breakdown in February \u2014 not as early as November.", "source": "CNBC Top News", "pub_date_str": "21 Nov 2026, 11:30 AM IST", "pub_date_relative": "2h ago"}, {"title": "Europe's cyber weak spot is the everyday businesses nobody thought to protect", "full_content": "Cyberattacks on refrigerators in French supermarkets in October spurred Swedish chain Coop to act. But it wasn't fast enough.\n\nAttackers hit refrigeration systems in seven of its stores in early November. The affected stores had been scheduled for security upgrades just two days later, a company spokesperson told CNBC.\n\nMundane but essential equipment, used by everyday businesses, has become a favorite target of cyber saboteurs in recent weeks.\n\nExperts are warning that a combination of known vulnerabilities, basic security failures and ambiguity over whether suppliers or their clients are responsible are making things worse, as AI makes cyber threats faster and more sophisticated.\n\nGuy Segal, CEO of cybersecurity firm Sygnia, told CNBC that his company handled 285% more incidents in October than a year earlier, with demand forcing it to turn away some businesses seeking emergency assistance.\n\n\"It's going to get worse before it's going to get better,\" Segal said.\n\nThe recent cyberattacks targeted refrigeration systems across hundreds of European supermarkets, remotely altering temperature settings and forcing retailers to discard spoiled food.\n\nFrance has since accused a cyber unit with links to Iran's Revolutionary Guard Corps of the attacks, an allegation Tehran denies.", "source": "CNBC Top News", "pub_date_str": "21 Nov 2026, 11:30 AM IST", "pub_date_relative": "2h ago"}, {"title": "India, Finland seek to deepen economic ties through startup cooperation: Envoy", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a India, Finland seek to deepen economic ties through startup cooperation: Envoy The Economic Times daily newspaper is available online now. Read Today's Paper India, Finland seek to deepen economic ties through startup cooperation: Envoy SECTIONS India, Finland seek to deepen economic ties through startup cooperation: Envoy PTI Last Updated: Nov 21, 2026, 11:30:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India and Finland are working to strengthen their economic relationship by focusing on startup collaboration. Finnish Ambassador Mikko Kivikoski stated the importance of engaging with Indian startups for promoting investment. The Polar Bear Pitching event showcased startups, with Yash Goliya winning to compete globally in 2027. Bilateral trade between the nations is growing, with significant increases in recent years.\n\nWhat would it take for the world to stop needing the Strait of Hormuz?\n\nHidden export winners: The unlikely products finding real buyers abroad\n\nIndia\u2019s USD25 bn copper drive moves from building smelters to securing mines\n\nWhy IndiGo could land a sharp rebound in profit despite a sluggish aviation market\n\nGold still rules, but with a difference: How young India is redefining wedding jewellery\n\nKYC and KYB: Pidilite\u2019s business has more tailwinds than headwinds, but a continuous test called raw material prices \u2013 Concluding part\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "21 Nov 2026, 11:28 AM IST", "pub_date_relative": "2h ago"}, {"title": "Explained: Why Are Workers And Students Protesting Across Italy?", "full_content": "Several labour groups, including the General Confederation of Italian Labour (CGIL) and Cobas, helped organise the demonstrations.", "source": "NDTV Profit", "pub_date_str": "21 Nov 2026, 11:26 AM IST", "pub_date_relative": "2h ago"}, {"title": "Market winners: Max Healthcare, Deepak Fertilisers among 10 stocks that surged up to 14% in last week", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News Market winners: Max Healthcare, Deepak Fertilisers among 10 stocks that surged up to 14% in last week Written by Kumar Gaurav , ETMarkets.com | Nov 21, 2026, 11:33:17 AM IST 1 / 11 \u200bMarket Winners Max Healthcare, Deepak Fertilisers, and Blue Star were among the top winners in the Nifty 500 universe last week, with stocks rallying up to 14.14%, outperforming the Nifty 500, which gained nearly 1.5%, and the benchmark Nifty 50, which rose around 2.5% during the same period. (Data Source: ACE Equity)\n\nThe healthcare sector stock topped the list of weekly gainers, rising 14.14% over the last one week.\n\nThe fertiliser and chemicals company ranked second, gaining 13.90% during the period.\n\nThe consumer durables and air-conditioning company ranked third, with its shares advancing 12.84% over the last one week.\n\nThe real estate sector player ranked fourth, posting a gain of 12.11% during the period.\n\nThe housing finance company ranked fifth, with its shares rising 11.78% over the last one week.\n\nThe healthcare diagnostics company ranked sixth, recording a weekly gain of 11.50%.\n\nThe renewable energy financing company ranked seventh, with its shares gaining 11.33% during the week.", "source": "Economic Times Markets", "pub_date_str": "21 Nov 2026, 11:21 AM IST", "pub_date_relative": "2h ago"}, {"title": "Mundhe-Led Maharashtra FDA Seizes Rs 152 Crore Food Stocks After 25,500 Inspections In Seven Months", "full_content": "The FDA's Food Division inspected 25,514 food manufacturing, storage, and retail establishments during this period, issuing improvement notices to 11,506 violators and suspending 1,651 licences for non-compliance.", "source": "NDTV Profit", "pub_date_str": "21 Nov 2026, 11:20 AM IST", "pub_date_relative": "2h ago"}, {"title": "Pensioners, Have You Submitted Your Life Certificate? 7 Things You Need To Know", "full_content": "If you or a family member receives a pension, here are 7 important things to know about the Life Certificate.", "source": "NDTV Profit", "pub_date_str": "21 Nov 2026, 11:17 AM IST", "pub_date_relative": "2h ago"}, {"title": "Bitcoin crashes to over two-year low below $60,000 level: What do experts expect from crypto markets going ahead?", "full_content": "Bitcoin price today: The world's largest cryptocurrency is trading near over two-year lows on 21 November, below the $60,000 level, in a spectacular reversal from its upward trajectory after United States President Donald Trump entered the White House, according to a Bloomberg report.\n\nBitcoin crashed by 6.1% to $57,716, the least since September 2024, and over half its value from the triumphant $1,26,000 high recorded in October 2025 ahead of Trump's US election win, it said.\n\n\u201cThe broader market has shifted into a sharp lack of confidence, and investors are de-risking. Bitcoin is along for the ride here, typically weak in deleveraging environments,\u201d Andy Baehr, MD of asset management at GSR told the publication.\n\nThe overall crypto market capitalisation has slipped by 7.58% to $1.95 trillion with 24-hour trading volume at $136.33 billion, according to CoinMarketCap. The Fear and Greed Index is in the \u2018Extreme Fear\u2019 range at 6, indication irrational selloff, it added.\n\nAmong the tokens, Bitcoin slipped 1.97% but retained dominance, holding 58.2% of the crypto market pie, followed by second largest crypto Ethereum, which comprises 9.8% of the market, down a slight 0.97%; while the remaining tokens make up 32% of the crypto space, up 2.94%, the CoinMarketCap data showed.\n\nNischal Shetty, Founder of WazirX noted that Bitcoin has fallen roughly 24% from its October close near $77,474 and more than 50% from its October 2025 peak above $1,26,000. It slipped 5.66% over the week and 13.64% over the month.\n\nEthereum traded near $1,619, down 8.31% for the week and 16.09% over the month, Shetty noted.\n\nThe slump comes amid a broader market selloff due to worry around AI, pressure on the crypto space amid the late October hack of the world's largest crypto exchange Binance, a wide Democratic win in the US midterm elections in November and also concerns over loss in momentum for crypto legislation in the US, Bloomberg said.", "source": "LiveMint Markets", "pub_date_str": "21 Nov 2026, 11:11 AM IST", "pub_date_relative": "2h ago"}, {"title": "Rs 38 Crore Fees Waived Off For Medical Students In Drought-Hit Areas Of Maharashtra", "full_content": "The waiver covers undergraduate and postgraduate students at medical colleges affiliated with Maharashtra University of Health Sciences.", "source": "NDTV Profit", "pub_date_str": "21 Nov 2026, 11:10 AM IST", "pub_date_relative": "2h ago"}, {"title": "Bought gold on Diwali? Prices fall 12.9% in a fortnight: Check today's value of your 22K and 24K gold purchases in India", "full_content": "All individuals who invested in gold during Diwali may now be staring at a lower market valuation, less than 15 days after the festival was celebrated across the country. With Diwali falling on 8 November this year, domestic gold prices have corrected sharply, resulting in a meaningful indicative price correction in the value of jewellery, coins, and bars bought during the festive period.\n\nAs per data compiled by the bullion website , 24-carat gold was priced at about \u20b9 12,508 per gram on 21 November, whereas 22-carat gold stood at \u20b9 11,465 per gram. The rate of 18-carat gold, on the other hand, was \u20b9 9,381 per gram.\n\nNow, let us take a look at how gold prices have performed over the last few weeks. On November 8, 2026, 22-carat gold was priced at \u20b9 1,31,600 per 10 grams, while 24-carat gold traded at \u20b9 1,43,570 per 10 grams. As of today, i.e., November 21, both have declined by approximately 12.9%.\n\nThis correction becomes even more pronounced when calculated against actual purchase quantities.\n\nFor example, an individual who purchased 10 grams of 22-carat gold on Diwali for \u20b9 1,31,600 would now find its indicative market value at around \u20b9 1,14,650, representing a difference of \u20b9 16,950. Similarly, a 10-gram purchase of 24-carat gold would show an indicative price difference of \u20b9 18,490.\n\nDo keep in mind that these calculations do not take into account the GST expenses and making charges. Jewellery resale values are also bound to include purity checks and other associated deductions; hence, prices may differ for every individual case.\n\nThis correction in gold prices since Diwali does not necessarily mean buyers have incurred any immediate financial losses.", "source": "LiveMint Money", "pub_date_str": "21 Nov 2026, 11:04 AM IST", "pub_date_relative": "2h ago"}], "cfa": [{"title": "GREED & fear Report: Jefferies Chris Wood hikes India exposure for 2nd time in 3 weeks, cuts Taiwan| New Allocations", "full_content": "Greed and Fear Report: Jefferies\u2019 global head of equity strategy Christopher Wood has increased his exposure to Indian equities for the second time in less than three weeks, taking the country\u2019s allocation in his Asia Pacific ex-Japan relative-return portfolio to 15%. The latest adjustment came as global artificial intelligence ( AI )-linked stocks faced a sharp sell-off, prompting renewed questions about the sustainability of the massive investments being made in the technology sector.\n\nWood raised India's portfolio weight by one percentage point and reduced Taiwan's allocation by an equal measure. The move followed another significant change earlier in November, when he increased India's weighting by two percentage points to 14%, while cutting exposure to South Korea and Taiwan by one percentage point each.\n\nThe successive changes mark a shift in Wood's positioning towards India after a period when the rally in semiconductor stocks had strengthened the appeal of North Asian markets.\n\nHis latest move also comes against a backdrop of growing uncertainty over whether the AI investment cycle is approaching a peak or merely undergoing a temporary correction.\n\nIn his weekly investor note, GREED & fear, Wood pointed to the disconnect between market concerns about AI spending and the evidence available on the ground.\n\n\"Financial markets continue to act like the AI capex cycle has peaked in spite of a lack of any compelling evidence as yet of any such development on the ground. GREED & fear will continue to assume for now that the market signal is the correct one where the only issue is whether this is the peak of the cycle or a mid-cycle correction,\" Wood wrote.\n\nWood's November revisions have increased India's allocation by a cumulative three percentage points, taking it from 12% to 15% in less than three weeks.\n\nWood had already tilted the portfolio further towards India earlier this month, raising its allocation to 14% from 12% by adding two percentage points.", "source": "LiveMint Markets", "pub_date_str": "21 Nov 2026, 01:39 PM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Portfolio Management"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "NRE FD interest rates in November 2026: PNB, Kotak, Federal Bank offer up to 6.80%; compare top bank rates for NRIs now", "full_content": "If you are a Non-Resident Indian (NRI) aiming to invest your overseas savings and acquired wealth in India, then you can earn up to 6.80% interest on Non-Resident External (NRE) fixed deposits in the month of November 2026.\n\nSeveral prominent banks and financial institutions, including Punjab National Bank (PNB), Kotak Mahindra Bank and Federal Bank, are offering aspiring investors competitive rates following the recent revisions. Still, returns may vary depending on the banking institution, individual investors, deposit tenure, and other terms and conditions.\n\nKeeping these important aspects in mind, here is a comparison of the latest NRE FD interest rates offered by 5 prominent banking institutions:\n\nIt is important to note that PNB, Kotak Mahindra Bank, and Federal Bank are offering the highest rate of 6.80%, although the qualifying tenures and other aspects might differ. HDFC Bank and ICICI Bank, on the other hand, are offering a maximum rate of 6.60%.\n\nThat is why, before proceeding with any FD investments , it becomes essential for aspiring investors to clearly understand the distinct options, their pros and cons, significance and how they can add value in your financial well-being.\n\nNow, it is a given that the convenience of investment and the headline rate promised by a financial institution are vital; still, NRIs should also carefully check and compare deposit tenures and premature withdrawal conditions, along with their liquidity requirements before proceeding with any investments.\n\nFurthermore, NRE fixed deposits are maintained in Indian rupees, with both principal and interest being repatriable. Not only this, but interest earned on eligible NRE deposits is exempt from income tax in India, subject to the applicable rules and residential-status conditions.\n\nIn summary, the highest advertised rate may not necessarily be the most suitable option.", "source": "LiveMint Money", "pub_date_str": "21 Nov 2026, 01:36 PM IST", "pub_date_relative": "18m ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Upcoming dividend, split, rights issue record dates next week, Nov 23-27: Pashupati Cotspin, Zee Ent, Varvee, and more", "full_content": "VRAJ BONLON ZEEL Sharmila Bhadoria Updated 21 Nov 2026, 01:13 PM IST Prefer Livemint on Google Dividend, split, rights issue record dates next week, November 23- 27: Shares of Pashupati Cotspin , Zee Entertainment, Indergiri Finance Limited, and several other companies will remain in focus due to their corporate actions next week, ie between November 23 and November 27.\n\nAt least nine companies have fixed record dates for dividend, rights issue, buy back, and stock split for the coming week. Meanwhile, the Indian stock market continued its bullish run for the fourth straight week. It marks the longest winning run of Nifty and Sensex in five months.\n\nAs the market cheers and investors continue to plan their next week, here are all the details about corporate actions scheduled for the coming week.\n\nPashupati Cotspin, Vraj Iron And Steel Ltd, and Fusion CX have fixed record dates for dividend in the coming week. Pashupati Cotspin has announced a \u20b9 0.020 per equity share dividend with November 23 as record date. Fusion CX has announced \u20b9 0.75 per equity share dividend. Vraj Iron And Steel Ltd has fixed a record date for the coming week for \u20b9 0.60 per share.\n\nBonlon Industries , Indergiri Finance , Vellora Impact, and JTL Defence have announced the right issue of equity shares with their record dates coming in the next seven days.\n\nVarvee Global Ltd has announced stock split from shares (with face value of \u20b9 5 each) to \u20b9 2 each. As per the company\u2019s BSE filing, \u201c1 (One) equity share having face value of \u20b9 5 (Rupees Five Only) each, fully paid-up, be sub-divided / split into \u20b9 2 (Rupee Two Only) each.\u201d Zee Entertainment Enterprises has fixed November 25 as record date for buy back of shares.\n\nNifty closed 1.12% higher at 25,800.60 points, whereas BSE Sensex registered 1.08% gain and ended above 83,919. With this, Nifty 50 and Sensex closed with gains for the fourth straight session.", "source": "LiveMint Markets", "pub_date_str": "21 Nov 2026, 01:10 PM IST", "pub_date_relative": "43m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Golden lessons from past gold price fluctuations amid current gold price crash \u2014 32% down from its peak in 2026", "full_content": "Gold prices have corrected sharply in 2026, leaving investors wondering how long the precious metal could take to recover its previous highs. Historical data suggests that investors may need patience, as gold has taken several years to regain its peak after major corrections.\n\nGold prices in India stood at around \u20b9 1.22 lakh per 10 grams on 21 November 2026, down over 32% from their January 2026 peak of around \u20b9 1.80 lakh, according to the MCX data.\n\nThe November 2026 Wealth Conversations report by FundsIndia , which examined previous gold market cycles, found that large corrections of more than 30% and subsequent recoveries have historically taken around 7-8 years.\n\nIts analysis of three past cycles shows that the recovery period varied significantly depending on the severity of the fall and market conditions. Here's what you need to know.\n\nThe 1980 correction was the steepest among the three periods analysed. Gold fell 57% from its peak of \u20b9 6,555 (per 31.1035 grams) to \u20b9 2,837 in June 1982. It took another seven years and five months to regain its previous high, taking the entire fall-and-recovery cycle to nearly a decade.\n\nThe fall-and-recovery cycle refers to the total time gold takes to decline from its previous peak and regain that peak.\n\nThe 1996 correction was relatively smaller, at 31%. Gold took three years and five months to reach its bottom and another two years and 10 months to recover its previous peak. The overall cycle lasted six years and four months.\n\nSimilarly, after peaking in November 2012, gold declined 29% before recovering its previous high in June 2019. The complete cycle took six years and seven months.", "source": "LiveMint Money", "pub_date_str": "21 Nov 2026, 12:59 PM IST", "pub_date_relative": "54m ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Stocks to buy: HSBC lists 19 Indian stocks that saw FY27 earnings upgrades, check target prices", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News Stocks to buy: HSBC lists 19 Indian stocks that saw FY27 earnings upgrades, check target prices Written by Debaroti Adhikary , ETMarkets.com | Nov 21, 2026, 01:04:54 PM IST 1 / 16 \u200bStocks with earnings upgrades As Indian companies wrap up the Q2 results season, HSBC pointed out that around 67% of firms\u2019 earnings were ahead of or in line with estimates. In its latest \u2018India Equity Strategy\u2019, the global brokerage firm said sales of companies excluding commodities grew 17% year-on-year, while net income rose 19% in Q2, making this the strongest quarter since December 2023. Mid and small-cap companies continued to lead, with earnings growth of 30% and 32%, but the growth among large caps also accelerated and the recovery broadened across sectors, it noted. It listed 19 Indian companies with \u2018Buy\u2019 ratings that saw FY27 consensus earnings upgrades following their respective Q2 result announcements.\n\nAther Energy saw the sharpest spike in FY27 consensus earnings estimates at 56% following the EV-scooter maker\u2019s Q2 results. HSBC has a \u2018Buy\u2019 call on the stock with a target price of Rs 1,800 apiece. This however implies around 6.5% downside potential from the stock\u2019s Thursday closing price of Rs 1,925 apiece as the stock has surged more than 33% in one month and 163% in 2026 so far.\n\nGAIL saw a 42% jump in FY27 consensus earnings estimates. HSBC has a \u2018Buy\u2019 call on the gas utilities stock with a target price of Rs 215 apiece. This implies around 11.9% upside potential from the stock\u2019s Thursday closing price of Rs 192.1 apiece.\n\nIIFL Finance saw a 20% increase in FY27 consensus earnings estimates. HSBC has a \u2018Buy\u2019 call on the diversified financial services stock with a target price of Rs 810 apiece.", "source": "Economic Times Markets", "pub_date_str": "21 Nov 2026, 12:51 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Silver prices crash 64.2% from January peak: Check latest rates in Delhi, Mumbai, Chennai and other cities", "full_content": "The prices of gold and silver have slid to a 14-month low in the domestic market on Friday, with both metals suffering serious losses and touching their lowest levels since September 2025. The primary reason for this is a strong US dollar and expectations of more Federal Reserve rate hikes.\n\nMCX gold prices closed at \u20b9 122,510, whereas silver prices closed at \u20b9 149,590 on Friday, as per data provided on the bullion website.\n\nSubsequently, the crash in precious metal prices in international markets has also weighed on domestic silver rates, with the overall market witnessing significant losses amid volatility and investor uncertainty.\n\nKeeping these important developments in mind, let us take a look at the silver prices across major Indian cities today, on Saturday, 21 November, as per data provided on the bullion website. Do note, Chennai and Coimbatore recorded the highest rates among the cities, whereas Delhi had the lowest.\n\nThe 999-fine silver rate stood at \u20b9 1,49,590 per kg nationally at the time of reporting. Here is a city-wise breakdown of silver prices on 21 November, as per Bullion data.\n\nThe correction in gold and silver prices has been profound and deep since their January peaks this year, with silver taking the hardest hit, plunging 64.2% from its January peak, while gold has fallen 31.5%.\n\nThe primary reason for such a steep correction is investor concerns over artificial intelligence, geopolitical uncertainty involving the US and Iran, and expectations of further US Federal Reserve interest rate hikes, all of which have weighed on precious metals.\n\nFor Indian investors and buyers, however, domestic silver prices also depend on factors such as currency movements, import costs and local market premiums. Going forward, developments in global geopolitics and these factors will collectively define the next price action in silver.", "source": "LiveMint Money", "pub_date_str": "21 Nov 2026, 12:49 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Gold vs silver price crash compared: White metal loses 65%, gold sheds 37% from record highs| Wealth wiped, returns", "full_content": "Gold vs Silver price crash : The precious metals rally that had rewarded investors handsomely at the beginning of 2026 has turned into a brutal reversal, with gold and silver surrendering a significant portion of their gains. But while both metals have suffered a sharp correction, silver has taken a considerably bigger hit. MCX silver has plunged 65% from its January record high, compared with a 37% decline in gold, wiping out much of the former's spectacular rally.\n\nThe November 20 crash further changed the investment equation. Silver, which had outperformed gold through mid-October, surrendered almost its entire annual advance, allowing gold to emerge as the better-performing metal for investors who entered the market in October 2025 and held through the latest correction. Silver fell 6.7% on November 20, while gold declined 4.7%.\n\nThe reversal raises an important question for Indian investors: Was gold or silver the better investment in 2026, and how much wealth has been wiped out since the January peaks?\n\nBoth precious metals touched record highs on January 29, 2026, as geopolitical tensions and aggressive retail buying fuelled demand. However, the subsequent reversal has been particularly punishing for silver.\n\nMCX gold 's December futures contract had reached an all-time high of \u20b9 1,93,096 per 10 grams in January. By November 20, it had slipped to an intraday low of \u20b9 1,21,424, translating into a loss of \u20b9 71,672 per 10 grams, or 37.12%, from its peak. Gold also plunged 4.7%, or \u20b9 6,028, during the November 20 session alone.\n\nSilver witnessed an even steeper correction. MCX silver, which had scaled a lifetime high of \u20b9 4,20,048 per kg on January 29, crashed to an intraday low of \u20b9 1,46,868 on November 20. This represented a staggering decline of \u20b9 2,73,180 per kg, or 65.04%, from its record high.", "source": "LiveMint Markets", "pub_date_str": "21 Nov 2026, 12:35 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Derivatives", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Concurrent Gainers: These 13 stocks gained for 5 days in a row, all rose over 27%", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News Concurrent Gainers: These 13 stocks gained for 5 days in a row, all rose over 27% Written by Rounak Khare , ETMarkets.com | Nov 21, 2026, 12:47:25 PM IST 1 / 14 Concurrent Gainers Over the five trading sessions ending November 20, the Sensex surged 1.08%, or 897.96 points, to close at 83,919, marking gains in four of the five sessions. Around 99 stocks from the BSE 200 index advanced in all five consecutive sessions from November 13 to 20. Of these, we shortlisted 13 stocks that consistently gained throughout the period, delivering cumulative returns ranging from 27.5% to 31%. (Data Source: ACE Equity)", "source": "Economic Times Markets", "pub_date_str": "21 Nov 2026, 12:27 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Builder fails to provide documents for home loan disbursal; later cancels flat over unpaid dues: How Noida couple won?", "full_content": "You work hard, save money, and take a home loan to buy your dream home. But what happens if the builder fails to provide the documents needed for the bank to release your sanctioned loan and then cancels your flat allotment over non-payment? A recent Noida couple's case has brought this issue into focus.\n\nThe district consumer commission has ruled in favour of the homebuyers and directed the builder to hand over possession of the flat. Here's what happened in the case and what the ruling means for homebuyers .\n\nAccording to a Times of India report, the dispute involved Manoj Kumar Bhrigu and his wife, Niranjana Sharma, who had booked a 1,595 sq ft apartment in a project developed by JSS Buildcon Pvt Ltd for \u20b9 77.35 lakh.\n\nThe couple paid \u20b9 1 lakh through cheque on 7 July 2023, followed by another \u20b9 6.5 lakh on 28 July, taking their total initial payment to \u20b9 7.5 lakh. Under the builder-buyer agreement, they had agreed to clear the remaining amount in one lump sum through a home loan instead of paying in instalments.\n\nThey approached the Central Bank of India's Shalimar Bagh branch in Delhi for a \u20b9 64 lakh home loan. The loan arrangement was processed on 27 September 2023, through a tripartite agreement involving the buyers, the builder and the bank.\n\nA tripartite agreement is a three-party arrangement that sets out the respective responsibilities of the homebuyer, builder and lender. It is commonly used to finance the purchase of under-construction properties, particularly when the sale deed has not yet been registered in the buyer's name.\n\nOn 24 November, the bank informed the developer through email that the loan had been approved and requested two documents required to release the funds. However, the builder allegedly did not provide the paperwork despite repeated reminders from the bank and the buyers.\n\nWith the loan amount still awaiting disbursal, the builder cancelled the flat allotment, citing non-payment of the outstanding amount.", "source": "LiveMint Money", "pub_date_str": "21 Nov 2026, 11:55 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Nvidia vs Anthropic shares: AI chip stock tanks 14% while Claude-maker falls 8.5% - See who wins in earnings, valuation?", "full_content": "Nvidia vs Anthropic : One builds the chips powering the artificial intelligence revolution, while the other develops some of the world's most advanced AI models. Yet, despite operating at opposite ends of the AI ecosystem, Nvidia and Anthropic are discovering that Wall Street's appetite for artificial intelligence stocks has limits. Nvidia shares plunged 14% on Friday, November 20, while Anthropic tumbled 8.5%, surrendering much of its gains following a record-breaking Nasdaq debut.\n\nThe contrasting fortunes of the two companies offer a glimpse into the changing dynamics of the AI trade. Nvidia remains a profit-generating chipmaking powerhouse, while Anthropic is betting on explosive revenue growth despite substantial operating losses and enormous computing commitments. Both companies are now facing questions about valuations, the sustainability of AI spending and how quickly the technology can translate into returns for investors.\n\nNvidia's latest decline extended its losing streak to seven consecutive weeks, its longest since the 2008 global financial crisis. The stock plunged 14.01% on Friday to close at $125.53, leaving it 48.4% below its 52-week high of $243.37.\n\nThe shares have declined approximately 28% since November 12, when founder Jensen Huang's resignation was announced. The decline has erased more than $1 trillion in market capitalisation over the period, according to reports. Nvidia, once the world's most valuable publicly listed company, has slipped to fourth place behind Apple , Microsoft and Alphabet .\n\nAnthropic's stock market journey has been equally volatile, despite its blockbuster IPO. The Claude developer priced 980 million shares at $83 apiece on November 18, raising $81.34 billion and surpassing SpaceX's June 2026 IPO record.\n\nShares opened at $111.50 on November 19 and closed their debut session at $97.17, a 17% gain over the offering price.", "source": "LiveMint Markets", "pub_date_str": "21 Nov 2026, 11:41 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "AI to lead investment strategy in 2027; Energy and borrowing costs shape macro outlook: Barclays", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a AI to lead investment strategy in 2027; Energy and borrowing costs shape macro outlook: Barclays The Economic Times daily newspaper is available online now. Read Today's Paper AI to lead investment strategy in 2027; Energy and borrowing costs shape macro outlook: Barclays SECTIONS AI to lead investment strategy in 2027; Energy and borrowing costs shape macro outlook: Barclays ANI Last Updated: Nov 21, 2026, 11:39:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis According to the latest report from Barclays Private Bank, the impending year 2027 calls for a stronger investment focus on artificial intelligence. While infrastructure is steadily developing, the rising costs of debt financing could negatively impact the economics of these projects. The report warns of potential computing demand outpacing supply, which may hinder technology scalability. Investors should approach government bonds with caution due to elevated yields and inflation worries.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "21 Nov 2026, 11:39 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Equity Investments", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "An early breakdown in the polar vortex is threatening already depleted gas stocks", "full_content": "An unprecedented early breakdown of the stratospheric polar vortex and a record-breaking El Ni\u00f1o event has put energy traders on alert this winter, with analysts warning the weather and climate phenomena could have an outsized impact on Europe.\n\nMeteorologists are currently observing a record early breakdown of the polar vortex, a large-scale circulation of strong winds that typically keeps extremely cold air over the North Pole.\n\nChanges in the strength and shape of the polar vortex can influence weather patterns much lower down in the atmosphere, potentially bringing in colder weather to parts of Europe and North America.\n\nThis year, however, the collapse of the stratospheric polar vortex, or SPV, is taking place at the same time as an unusually powerful El Ni\u00f1o, a climate event that can boost global temperatures and disrupt rainfall.\n\nThe collision of these two events raises the risk of a prolonged cold spell that could lift heating demand and force European countries to draw down already-low reserves faster. That would leave the continent more reliant on imported liquefied natural gas (LNG) at a time when supplies from the Middle East are disrupted.\n\nTo be sure, Europe's natural gas storage levels started the winter at their lowest level in more than a decade.\n\nThe International Energy Agency warned earlier this month that low European storage levels and limited storage options in several LNG-importing countries in Asia and South America could intensify the competition for cargoes and put upward pressure on prices during periods of high demand.\n\nSimon Lee, a lecturer in atmospheric science at the U.K.'s University of St Andrews, said the combination of a sudden stratospheric warming (SSW) with an El Ni\u00f1o event is not necessarily unusual, but meteorologists had been expecting a polar vortex breakdown in February \u2014 not as early as November.", "source": "CNBC Top News", "pub_date_str": "21 Nov 2026, 11:30 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Derivatives", "Alternative Investments"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "India, Finland seek to deepen economic ties through startup cooperation: Envoy", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SM ons affect markets \u2014 a core CFA economics topic."}, {"title": "Market winners: Max Healthcare, Deepak Fertilisers among 10 stocks that surged up to 14% in last week", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News Market winners: Max Healthcare, Deepak Fertilisers among 10 stocks that surged up to 14% in last week Written by Kumar Gaurav , ETMarkets.com | Nov 21, 2026, 11:33:17 AM IST 1 / 11 \u200bMarket Winners Max Healthcare, Deepak Fertilisers, and Blue Star were among the top winners in the Nifty 500 universe last week, with stocks rallying up to 14.14%, outperforming the Nifty 500, which gained nearly 1.5%, and the benchmark Nifty 50, which rose around 2.5% during the same period. (Data Source: ACE Equity)\n\nThe healthcare sector stock topped the list of weekly gainers, rising 14.14% over the last one week.\n\nThe fertiliser and chemicals company ranked second, gaining 13.90% during the period.\n\nThe consumer durables and air-conditioning company ranked third, with its shares advancing 12.84% over the last one week.\n\nThe real estate sector player ranked fourth, posting a gain of 12.11% during the period.\n\nThe housing finance company ranked fifth, with its shares rising 11.78% over the last one week.\n\nThe healthcare diagnostics company ranked sixth, recording a weekly gain of 11.50%.\n\nThe renewable energy financing company ranked seventh, with its shares gaining 11.33% during the week.", "source": "Economic Times Markets", "pub_date_str": "21 Nov 2026, 11:21 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Mundhe-Led Maharashtra FDA Seizes Rs 152 Crore Food Stocks After 25,500 Inspections In Seven Months", "full_content": "The FDA's Food Division inspected 25,514 food manufacturing, storage, and retail establishments during this period, issuing improvement notices to 11,506 violators and suspending 1,651 licences for non-compliance.", "source": "NDTV Profit", "pub_date_str": "21 Nov 2026, 11:20 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Pensioners, Have You Submitted Your Life Certificate? 7 Things You Need To Know", "full_content": "If you or a family member receives a pension, here are 7 important things to know about the Life Certificate.", "source": "NDTV Profit", "pub_date_str": "21 Nov 2026, 11:17 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Bitcoin crashes to over two-year low below $60,000 level: What do experts expect from crypto markets going ahead?", "full_content": "Bitcoin price today: The world's largest cryptocurrency is trading near over two-year lows on 21 November, below the $60,000 level, in a spectacular reversal from its upward trajectory after United States President Donald Trump entered the White House, according to a Bloomberg report.\n\nBitcoin crashed by 6.1% to $57,716, the least since September 2024, and over half its value from the triumphant $1,26,000 high recorded in October 2025 ahead of Trump's US election win, it said.\n\n\u201cThe broader market has shifted into a sharp lack of confidence, and investors are de-risking. Bitcoin is along for the ride here, typically weak in deleveraging environments,\u201d Andy Baehr, MD of asset management at GSR told the publication.\n\nThe overall crypto market capitalisation has slipped by 7.58% to $1.95 trillion with 24-hour trading volume at $136.33 billion, according to CoinMarketCap. The Fear and Greed Index is in the \u2018Extreme Fear\u2019 range at 6, indication irrational selloff, it added.\n\nAmong the tokens, Bitcoin slipped 1.97% but retained dominance, holding 58.2% of the crypto market pie, followed by second largest crypto Ethereum, which comprises 9.8% of the market, down a slight 0.97%; while the remaining tokens make up 32% of the crypto space, up 2.94%, the CoinMarketCap data showed.\n\nNischal Shetty, Founder of WazirX noted that Bitcoin has fallen roughly 24% from its October close near $77,474 and more than 50% from its October 2025 peak above $1,26,000. It slipped 5.66% over the week and 13.64% over the month.\n\nEthereum traded near $1,619, down 8.31% for the week and 16.09% over the month, Shetty noted.\n\nThe slump comes amid a broader market selloff due to worry around AI, pressure on the crypto space amid the late October hack of the world's largest crypto exchange Binance, a wide Democratic win in the US midterm elections in November and also concerns over loss in momentum for crypto legislation in the US, Bloomberg said.", "source": "LiveMint Markets", "pub_date_str": "21 Nov 2026, 11:11 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Bought gold on Diwali? Prices fall 12.9% in a fortnight: Check today's value of your 22K and 24K gold purchases in India", "full_content": "All individuals who invested in gold during Diwali may now be staring at a lower market valuation, less than 15 days after the festival was celebrated across the country. With Diwali falling on 8 November this year, domestic gold prices have corrected sharply, resulting in a meaningful indicative price correction in the value of jewellery, coins, and bars bought during the festive period.\n\nAs per data compiled by the bullion website , 24-carat gold was priced at about \u20b9 12,508 per gram on 21 November, whereas 22-carat gold stood at \u20b9 11,465 per gram. The rate of 18-carat gold, on the other hand, was \u20b9 9,381 per gram.\n\nNow, let us take a look at how gold prices have performed over the last few weeks. On November 8, 2026, 22-carat gold was priced at \u20b9 1,31,600 per 10 grams, while 24-carat gold traded at \u20b9 1,43,570 per 10 grams. As of today, i.e., November 21, both have declined by approximately 12.9%.\n\nThis correction becomes even more pronounced when calculated against actual purchase quantities.\n\nFor example, an individual who purchased 10 grams of 22-carat gold on Diwali for \u20b9 1,31,600 would now find its indicative market value at around \u20b9 1,14,650, representing a difference of \u20b9 16,950. Similarly, a 10-gram purchase of 24-carat gold would show an indicative price difference of \u20b9 18,490.\n\nDo keep in mind that these calculations do not take into account the GST expenses and making charges. Jewellery resale values are also bound to include purity checks and other associated deductions; hence, prices may differ for every individual case.\n\nThis correction in gold prices since Diwali does not necessarily mean buyers have incurred any immediate financial losses.", "source": "LiveMint Money", "pub_date_str": "21 Nov 2026, 11:04 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "US Treasury yields drop for day and week; AI trade concern spurs safe-haven bid", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Bonds \u203a US Treasury yields drop for day and week; AI trade concern spurs safe-haven bid Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US Treasury yields drop for d
