<script>

    const allData = {"general": [{"title": "Stock futures edge higher after OpenAI's revenue report prompts tech sector turmoil: Live updates", "full_content": "U.S. stock futures edged higher early Friday after an underwhelming revenue report from OpenAI took some steam out of the high-flying artificial intelligence trade.\n\nS&P 500 futures were up 0.3%, while Nasdaq 100 futures added 0.49%. Dow Jones Industrial Average futures advanced 105 points, or 0.2%.\n\nIn Asia on Friday, Japan's Nikkei 225 was little changed, mainland China's CSI 300 advanced 0.16%, while Australia's Australia's S&P/ASX 200 added 0.64%. Hong Kong's Hang Seng index was up 1.4% in its last hour of trade.\n\nShares of SpaceX rose 2% in extended trading after the rocket company announced a deal to buy a nationwide spectrum portfolio. Shares of AT&T , Verizon and T-Mobile slid as investors wondered worried the agreement could drive up competition.\n\nAI stocks dropped on Thursday after CNBC confirmed that OpenAI told investors that it saw $50 billion in annualized revenue at the end of September. A $68 billion figure was widely reported last month, though a person familiar with the matter said it also included gross revenue from partners.\n\nCoreWeave fell more than 7%, while Oracle , Intel and Super Micro Computer all lost around 5%. Advanced Micro Device slid close to 4%, while Nvidia shed almost 3%.\n\n\"If we have a number of days like this ... we could see a real rout in AI-related names,\" said Kristina Hooper, chief market strategist at Man Group, on CNBC's \"Closing Bell: Overtime.\" \"That could sour investors.\"\n\nThe Nasdaq Composite dropped more than 1%, marking its biggest one-day loss since mid August. Thursday marked the second down day in a row for the tech-heavy index after it climbed to fresh all-time records earlier in the week.", "source": "CNBC Top News", "pub_date_str": "09 Oct 2026, 01:02 PM IST", "pub_date_relative": "just now"}, {"title": "Buying insurance is easy. Knowing what you bought is harder", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nHere is a number worth sitting with. Between FY23 and FY25, what insurers paid corporate agents grew 125%. The premium those policies brought in grew 28%.\n\nYour premium paid for that gap. So what did you get for it after the sale?\n\nFor most policyholders, very little. Buying insurance feels easy; knowing what you bought often does not. That is no accident. Most distribution models earn their margin when a policy is issued. Renewals, claims and a family searching for a policy document in a hospital corridor have rarely been anyone's job.\n\nOn 23 September, the Insurance Regulatory and Development Authority of India (Irdai) released a consultation paper, Recalibrating Economics of Insurance Distribution, open for comments until 25 October. These are proposals, not final rules. But the regulator is finally asking the right question: who owns the customer's experience once the sale is done?\n\nIrdai wants to ban dark patterns, such as demanding your phone number before showing a product's price. Access to information, it says, should not be a lead generation opportunity.\n\nThe lesson : If a seller won't show the price and exclusions upfront, that tells you something about the seller.\n\nStandardised one-page sheets would put waiting periods, co-payments, sub-limits and room-rent caps in one place.", "source": "LiveMint Money", "pub_date_str": "09 Oct 2026, 12:56 PM IST", "pub_date_relative": "5m ago"}, {"title": "AWL Agri\u2019s growth metrics improve in Q2, but margins remain a pain point", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nAWL Agri Business\u2019 shares have risen more than 3% over the past four trading sessions, with the September quarter (Q2FY27) preliminary update announced on Monday after market hours, bringing some comfort.\n\nAWL delivered 12% year-on-year volume growth and 24% revenue growth in Q2, led by strong momentum in its food and FMCG portfolio and industry essentials. The edible oil business delivered steady volume growth, the company said. For perspective, volume and revenue growth stood at 7% and 18%, respectively, in the year-ago quarter. AWL\u2019s numbers also exceeded Nuvama Institutional Equities\u2019 Q2 estimates of 6% volume growth and 14% revenue growth.\n\nAWL\u2019s food and FMCG business recorded 33% revenue growth, crossing \u20b9 2,000 crore for the first time. Growth was broad-based, with wheat and rice performing strongly. Additional categories such as besan, pulses, soya nuggets, sugar , sattu and poha now account for over 35% of the food portfolio and together grew around 50% year-on-year in Q2.\n\nFortune pulses revenue crossed \u20b9 100 crore last quarter, with AWL looking to expand distribution across general trade and quick commerce. The Madhur Sugar deal could provide another leg to the food strategy. The company is using its distribution network to scale the licensed brand, with management targeting higher volumes through the year.\n\nIn FY26, edible oil contributed 80% of AWL\u2019s overall revenue, while food and FMCG, and industry essentials contributed 9% and 11%, respectively.\n\nMeanwhile, the industry essentials division recorded 25% year-on-year volume growth in Q2, led by oleochemicals, castor and de-oiled cakes. The edible oil business clocked just 3% volume growth, led by mustard oil and rice bran oil.\n\nEdible oil volume growth was 2% in Q1.", "source": "LiveMint Markets", "pub_date_str": "09 Oct 2026, 12:55 PM IST", "pub_date_relative": "7m ago"}, {"title": "OpenAI defends decision to fire researchers: 'These decisions were not about raising safety concerns or speaking out'", "full_content": "OpenAI on Friday defended its decision to fire three safety researchers, saying they had committed a \"significant breach of trust.\"\n\nThe AI lab said in a post on X that its decsion to part ways with Jasmine Wang, Tomek Korbak and Mikita Balesni, was not about the fact that they had raised safety concerns.\n\nThe three researchers who were let go from the company, raised safety concerns in a letter addressed to OpenAI board members and its safety committees, seen by the Wall Street Journal . They called on the company to pause developing models that would decrease the ability to monitor artificial intelligence.\n\nOpenAI said it agrees with the ethos of the letter around \"preserving the monitorability of frontier models,\" adding that it continues to invest significant resources in this area.", "source": "CNBC World Economy", "pub_date_str": "09 Oct 2026, 12:53 PM IST", "pub_date_relative": "8m ago"}, {"title": "Govt likely to finalise critical minerals stockpiling policy in a month", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a Govt likely to finalise critical minerals stockpiling policy in a month The Economic Times daily newspaper is available online now. Read Today's Paper Govt likely to finalise critical minerals stockpiling policy in a month SECTIONS Govt likely to finalise critical minerals stockpiling policy in a month PTI Last Updated: Oct 09, 2026, 12:50:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Mines Secretary Keshav Chandra indicated that a policy on stockpiling critical minerals will be announced soon. This initiative is designed to support strategic sectors like defence, advanced electronics, and aerospace. The government plans to establish four dedicated critical minerals processing parks across various states to enhance value addition. A comprehensive list of over 30 critical minerals has been released for essential industry needs.\n\nWhat is the real impact of 13x jump in cash transfers to women?\n\nThe NBFC saga - Part 2: Line drawn in 2006 is reason for the headlines today\n\nAirlines Q2 turbulence: Fewer passengers, rising fares and a crude shock\n\nBritannia\u2019s next big bet for young India lies beyond biscuits\n\nThe world is witnessing a bond rout. Why should it matter to you?\n\nQ2 earnings season: Will it settle or add to confusion in the stock market?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "09 Oct 2026, 12:50 PM IST", "pub_date_relative": "12m ago"}, {"title": "Fortis Healthcare, Apollo Hospitals, Max, Medanta shares rise: Should investors buy after 30% cancer drug price cap?", "full_content": "Hospital stocks rallied on Friday after the government decided to limit trade margins on non-scheduled anti-cancer drugs to 30%, a move expected to lower the prices of several cancer medicines by 20-70% and save patients an estimated \u20b9 2,500 crore annually. The decision lifted investor sentiment, although brokerages flagged potential margin pressure and said the full impact on hospital earnings would depend on further details.\n\nFortis Healthcare shares surged 5.3% to \u20b9 805.15, followed by Manipal Health Enterprises , which gained 4.3% to \u20b9 715.50. Krishna Institute of Medical Sciences advanced 4.2% to \u20b9 716.35, while Max Healthcare Institute rose 4.4% to \u20b9 915. Apollo Hospitals Enterprise shares climbed 4% to \u20b9 7,977.70, and Global Health gained 3.2% to \u20b9 1,317.25.\n\nHowever, the hospital stocks had fallen over the preceding two weeks after the Supreme Court raised concerns about the disparity between price-to-retailer (PTR) and maximum retail prices (MRP) of essential medicines. It cited an example of a cancer drug carrying an MRP of \u20b9 27,000 against a PTR of \u20b9 2,700.\n\nThe National Pharmaceutical Pricing Authority (NPPA), the drug pricing regulator, said the intervention could bring down MRPs by approximately 20-70%, depending on the existing distribution structure and mark-up for individual medicines.\n\nThe policy extends the government's earlier trade-margin restrictions, which covered only select oncology drugs, to non-scheduled anti-cancer medicines that do not fall under the existing list of drugs with government-set ceiling prices.\n\nNPPA's analysis found that non-scheduled cancer medicines carried an average price mark-up of around 170%, with some cases involving mark-ups of 700% or more.", "source": "LiveMint Markets", "pub_date_str": "09 Oct 2026, 12:49 PM IST", "pub_date_relative": "13m ago"}, {"title": "Why is Swedbank stock gaining today?", "full_content": "", "source": "Investing.com News", "pub_date_str": "09 Oct 2026, 12:43 PM IST", "pub_date_relative": "19m ago"}, {"title": "Why is Skandinaviska Enskilda Banken stock gaining today?", "full_content": "", "source": "Investing.com News", "pub_date_str": "09 Oct 2026, 12:43 PM IST", "pub_date_relative": "19m ago"}, {"title": "'Thoughtless Interference': HCG CMD On Cancer Drug Price Curbs", "full_content": "HCG's Ajai Kumar says the MRP can be cut, but the 30% trade margin cap on non-scheduled cancer drugs could keep new treatments from Indian patients.", "source": "NDTV Profit", "pub_date_str": "09 Oct 2026, 12:42 PM IST", "pub_date_relative": "19m ago"}, {"title": "U.S. stock futures rise after Nasdaq slide as OpenAI revenue concerns ease", "full_content": "", "source": "Investing.com News", "pub_date_str": "09 Oct 2026, 12:42 PM IST", "pub_date_relative": "19m ago"}, {"title": "Indonesia\u2019s Danantara says it could step in during market selloffs if valuations attractive", "full_content": "", "source": "Investing.com News", "pub_date_str": "09 Oct 2026, 12:42 PM IST", "pub_date_relative": "19m ago"}, {"title": "Global Market: Singapore likely to tighten monetary policy as growth and inflation risks mount", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME t With Family During The Festive Season In 2026", "full_content": "As the monsoons retreat and temperatures becoming comfortable, several beach destinations get busy to welcome travellers for the festive season. Although Goa has dominated beach vacation destinations in the past, India has plenty of alternative coastal escapes that are worth exploring for their turquoise waters and the dramatic cliffs. Read on to find out the best beach destinations you can plan a trip to during this festive season.", "source": "NDTV Profit", "pub_date_str": "09 Oct 2026, 12:42 PM IST", "pub_date_relative": "20m ago"}, {"title": "Crude Oil WTI trapped in $89-$92 chop zone: Live levels", "full_content": "", "source": "Investing.com News", "pub_date_str": "09 Oct 2026, 12:41 PM IST", "pub_date_relative": "20m ago"}, {"title": "European stocks attempt bounce, but heads for weekly loss as French debt weighs", "full_content": "", "source": "Investing.com News", "pub_date_str": "09 Oct 2026, 12:41 PM IST", "pub_date_relative": "20m ago"}, {"title": "Bitcoin breaks below range, tests $81K support: Live levels", "full_content": "", "source": "Investing.com News", "pub_date_str": "09 Oct 2026, 12:41 PM IST", "pub_date_relative": "21m ago"}, {"title": "Hang Seng tests $24,316 resistance cluster: Live levels", "full_content": "", "source": "Investing.com News", "pub_date_str": "09 Oct 2026, 12:41 PM IST", "pub_date_relative": "21m ago"}, {"title": "London Gas Oil bulls stall at $1,510-$1,530 ceiling: Live levels", "full_content": "", "source": "Investing.com News", "pub_date_str": "09 Oct 2026, 12:41 PM IST", "pub_date_relative": "21m ago"}, {"title": "Natural Gas stuck at $3.105 support: Live levels", "full_content": "", "source": "Investing.com News", "pub_date_str": "09 Oct 2026, 12:41 PM IST", "pub_date_relative": "21m ago"}, {"title": "Redington Stock In Focus After Report Of Apple Scaling Back iPhone 18 Pro Orders", "full_content": "Redington shares were in focus after a report by Nikkei Asia on Friday said Apple had asked some of its suppliers to cut production of the iPhone 18 Pro and iPhone 18 Pro Max amid weaker-than-expected initial demand.", "source": "NDTV Profit", "pub_date_str": "09 Oct 2026, 12:39 PM IST", "pub_date_relative": "22m ago"}, {"title": "Vedanta dividend 2026 record date, payment timeline, dividend yield and history; share performance - Full details here", "full_content": "Vedanta dividend 2026 : Anil Agarwal-led Vedanta, on Thursday, announced its first interim dividend since its demerger for the financial year 2026-27. The company announced an interim dividend of \u20b9 5 per share, taking the total payout to approximately \u20b9 1,955 crore.\n\nIn an exchange filing, the company said this is its first interim dividend since the demerger. The payout underscores Vedanta\u2019s commitment to shareholder value as it begins a new phase as a more focused and diversified natural resources company.\n\n\u201cWe wish to inform you that the Board of Directors of Vedanta Limited (the \u201cCompany\u201d), have, today i.e. October 08, 2026, approved the First Interim Dividend 2026-27 of \u20b9 5/- per equity share on face value of \u20b9 1/- per equity share for the Financial Year 2026-27 amounting to c. \u20b9 1,955 Crores,\u201d the company said in an exchange filing.\n\nThe dividend announcement follows Vedanta\u2019s strong Q2 FY27 operational performance, with the company reporting broad-based growth momentum across its businesses.\n\nThe company further notified that 14 October has been fixed as the record date for the purpose of dividend payment, and the payment date shall be Wednesday, with the payout to be made within the timelines stipulated by law.\n\n\u201cThe record date for payment of dividend shall be Wednesday, October 14, 2026, and the interim dividend shall be duly paid within the stipulated timelines as prescribed under law,\u201d the company said in the filing.\n\nVedanta has declared 50 dividends since 23 July 2001, reflecting its long history of distributing payouts to shareholders. The company has remained a dividend-focused stock, attracting investors seeking regular income alongside potential capital appreciation.\n\nOver the past 12 months, Vedanta has declared an equity dividend of \u20b9 11 per share. At the current share price of \u20b9 261.80, this translates into a dividend yield of approximately 4.20%.", "source": "LiveMint Markets", "pub_date_str": "09 Oct 2026, 12:36 PM IST", "pub_date_relative": "26m ago"}, {"title": "Gold Glitters, Silver Shines: Yellow Metal Prices Jump By Over Rs 2,000; White Metal Surges By Rs 4,100", "full_content": "The recovery in international bullion markets, supported by a weaker US dollar and easing US Treasury yields, is primarily driving precious metals' prices up today.", "source": "NDTV Profit", "pub_date_str": "09 Oct 2026, 12:29 PM IST", "pub_date_relative": "32m ago"}, {"title": "Vedanta shares up 4% after announcing first interim dividend for FY27 - Record date | A stock to buy? Expert view", "full_content": "Vedanta shares jumped 4% in intraday deals on the BSE on Friday, 9 October, a day after announcing the first interim dividend for the financial year 2026-27 (FY27).\n\nVedanta share price opened at \u20b9 255.60 against its previous close of \u20b9 253.10 and rose 4% to an intraday high of \u20b9 263.25, looking set to snap its two-day losing run.\n\nIn an exchange filing on 8 October, Vedanta said its board had approved the first interim dividend of \u20b9 5 per share for the financial year 2026-27.\n\nThe record date for the said dividend is Wednesday, 14 October 2026.\n\nThe stock is 50% up in the last one year, hitting a 52-week high of \u20b9 360.70 on 29 May this year and a 52-week low of \u20b9 168.30 on 9 October last year.\n\nOn a monthly scale, the stock is up 1% so far in October after a 7% decline in September.\n\nVedanta stock appears fundamentally strong, supported by its healthy financial performance in the previous quarter and expectations of another healthy showing in Q2FY27.\n\n\"Vedanta Limited exhibits a robust fundamental outlook, underpinned by stellar Q1 FY27 financial performance and progressive operational milestones in Q2FY27. During Q1 FY27, the company reported a massive 152% year-on-year surge in net profit to \u20b9 5,294 crore, driven by robust operational efficiencies, an expanding EBITDA margin of 57%, and a comfortable net debt-to-EBITDA ratio of 0.3 times,\" Seema Srivastava, Senior Research Analyst at SMC Global Securities, pointed out that.", "source": "LiveMint Markets", "pub_date_str": "09 Oct 2026, 12:29 PM IST", "pub_date_relative": "32m ago"}, {"title": "Drishyam 3: The Conclusion Box Office: How The First Week Unfolded?", "full_content": "'Drishyam 3: The Conclusion' wrapped up its first week with Rs 245.50 crore net in India and Rs 383.60 crore worldwide, surpassing Drishyam 2's lifetime India collection and entering Hindi cinema's top 10 first-week performers.", "source": "NDTV Profit", "pub_date_str": "09 Oct 2026, 12:25 PM IST", "pub_date_relative": "37m ago"}, {"title": "Anand Rathi Wealth Q2 results 2026, dividend amount announcement today: Date, time, quarterly earnings schedule", "full_content": "Anand Rathi Wealth Q2 results 2026: Shares of Anand Rathi Wealth Limited were trading lower ahead of the announcement of their second quarter result for the financial year 2026-27 on Friday, October 9.\n\nThe Q2 earnings season started this week, with companies like Tata Consultancy Services , GM Breweries, K&R Rail Engineering company announcing their quarterly results. Here are all the details about Anand Rathi Q2 result schedule, dividend record date, dividend expectations, etc .\n\nThe Mumbai-headquartered financial services firm is scheduled to announce its Q2FY27 result on Friday, October 9. Anand Rathi Wealth\u2019s board of directors will \u2018consider, approve and take on record the Unaudited standalone and consolidated financial results of the Company for the Second quarter and Half year ended 30th September, 2026.\u201d The result will be announced after review by the Audit Committee of the Board.\n\nThe company\u2019s hasn\u2019t specifically mentioned the time of Q2 result announcement.\n\nThe company\u2019s board of directors will consider and approve interim dividend for the financial year 2026-27. The board has fixed Thursday, October 15, as the record date to determine the eligibility of shareholders for the payout.\n\n\u201cWe hereby inform about revision in the Record Date as Thursday, 15th October, 2026, for the purpose of payment of Interim Dividend, if declared, by the Board of Directors at their meeting scheduled to be held on Friday, 09th October, 2026,\u201d read the firm\u2019s BSE filing released on Thursday.\n\nIn April this year, the company\u2019s board had announced a dividend of \u20b9 7 per equity share. In October 2025, the board had approved \u20b9 6 dividend for FY26. In May 2026, the board had recommended \u20b9 7 dividend per equity share. Going by the trend, the stock investors can expect dividend payout in the range of \u20b9 6-7 per share on Friday.\n\nThe stock was trading 3.67% lower at \u20b9 2065.25 per share on BSE at 12:12 pm on Friday.", "source": "LiveMint Markets", "pub_date_str": "09 Oct 2026, 12:17 PM IST", "pub_date_relative": "44m ago"}, {"title": "Q2 Results Live Updates: TCS Share Price Rises 4% After Earnings; Anand Rathi Slips Nearly 4% Ahead Of Numbers", "full_content": "Q2 FY27 Results Live Updates: Anand Rathi, Can Fin Homes and Poonawalla Fincorp will be among the key earnings announcements to watch.", "source": "NDTV Profit", "pub_date_str": "09 Oct 2026, 12:15 PM IST", "pub_date_relative": "46m ago"}, {"title": "Banking Recruitment Scam Busted: CBI Arrests Four In Pan-India Operation", "full_content": "The CBI Special Task Branch Mumbai executed coordinated, multi-state raids following an FIR registered on a complaint filed by the Institute of Banking Personnel Selection (IBPS).", "source": "NDTV Profit", "pub_date_str": "09 Oct 2026, 12:14 PM IST", "pub_date_relative": "48m ago"}, {"title": "Tankers Hit Mines? Several Heavy Explosions Reported In Hormuz", "full_content": "Military sources cited by IRIB said oil tankers using \"unauthorised\" routes through the strategic waterway may have struck mines deployed in the area.", "source": "NDTV Profit", "pub_date_str": "09 Oct 2026, 12:12 PM IST", "pub_date_relative": "50m ago"}, {"title": "Indian Army Averts Major Disaster, Neutralises 27 IEDs Along 8 Km Shangkhalok-Pilong Route", "full_content": "The Assam Rifles said the 48-hour, intelligence-led operation ran from October 4 to 7 along the 8-km stretch of road in Manipur's Kamjong district.", "source": "NDTV Profit", "pub_date_str": "09 Oct 2026, 12:09 PM IST", "pub_date_relative": "53m ago"}, {"title": "Five Reasons Why Stock Market Is Rising Today: Sensex Jumps 800 Points, Nifty 50 Above 22,500", "full_content": "Dalal Street bounced back from Thursday's rout as a massive IT rally, lower oil prices, and value buying pushed benchmark indices higher.", "source": "NDTV Profit", "pub_date_str": "09 Oct 2026, 12:06 PM IST", "pub_date_relative": "55m ago"}, {"title": "Mirae Asset Sharekhan Enables Indian Investors To Access Over 10,000 Us Stocks And ETFs Through Gift City", "full_content": "Powered through Mirae Asset Capital Markets (IFSC) Pvt. Ltd., which holds an IFSCA Broker Dealer registration and supported by a partner, the platform offers investors access to more than 10,000 US stocks and ETFs and over 2,500 fractional stocks and ETFs", "source": "NDTV Profit", "pub_date_str": "09 Oct 2026, 12:06 PM IST", "pub_date_relative": "56m ago"}, {"title": "Vivriti Asset Management returns over Rs 3,400 crore to investors across two fund vintages", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Vivriti Asset Management returns over Rs 3,400 crore to investors across two fund vintages The Economic Times daily newspaper is available online now. Read Today's Paper Vivriti Asset Management returns over Rs 3,400 crore to investors across two fund vintages SECTIONS Vivriti Asset Management returns over Rs 3,400 crore to investors across two fund vintages By Veer Sharma , ETMarkets.com Last Updated: Oct 09, 2026, 12:01:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Vivriti Asset Management has completed and exited its Vintage II credit funds, returning over Rs 2,260 crore in capital and income. The funds invested across more than 45 companies, delivering gross IRRs of around 12% to 15%.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "09 Oct 2026, 12:01 PM IST", "pub_date_relative": "1h ago"}, {"title": "Tokenization could unleash tens of billions of dollars in trapped capital, Nasdaq CEO says", "full_content": "Tokenization could free up tens of billions of dollars in capital tied up in assets used as collateral across the global financial system, Nasdaq CEO Adena Friedman said.\n\nTokenizing assets such as Treasurys, equities and money market funds, along with the flow of money, could make collateral more liquid, Friedman told CNBC's Joanna Ossinger at the TOKEN2049 conference in Singapore.\n\n\"If you tokenize all those instruments along with the flow of money, then the collateral becomes very fluid,\" Friedman said.\n\nTokenization involves representing financial assets, such as stocks and bonds, as digital tokens that can be transferred using blockchain technology.\n\nFriedman said institutional interest in tokenization has grown over the past year, pointing in part to the passage of the Genius Act in the U.S., which established a regulatory framework for stablecoins.\n\n\"If we can tokenize money, then we can tokenize the flow of capital,\" she said.\n\nThat growing institutional interest is converging with demand from retail investors, who have long sought the ability to trade around the clock, according to Friedman. The retail ecosystem \"has been about 10 years ahead,\" she said.\n\nMoving to a fully 24/7 market would be a major undertaking for the financial industry, Friedman said.", "source": "CNBC World Economy", "pub_date_str": "09 Oct 2026, 12:00 PM IST", "pub_date_relative": "1h ago"}, {"title": "R Systems International skyrockets 15% today after it was down 34% in a year \u2014 Book profit or buy more? Experts' view", "full_content": "Stocks to buy today: Following a sharp rally in the Nifty IT index, other IT-enabled stocks also witnessed a sharp upside during Friday's session. R Systems International Ltd shares are one of them. R Systems International's share price today opened upside at \u20b9 245.80 apiece on the NSE and touched an intraday high of \u20b9 284.60 per share within a few minutes of the Opening Bell, logging more than 15% rise against its previous close of \u20b9 242.85. Notably, shares of R Systems International Ltd are among the beaten-down stocks on Dalal Street. It has shed 30% YTD and about 34% over the past year.\n\nAccording to stock market experts, R Systems International shares are rising today due to buzz around IT and IT-enabled stocks. The Nifty IT index surged up to 4% during the intraday trade, led by a TCS Q2FY27 results-fueled rally in large-cap IT stocks. This also triggered buying in IT-enabled stocks. R Systems International Ltd, being an IT-enabled company, is benefiting from the buzz in IT shares, said experts. They said that R Systems International shares are on the cusp of a technical breakout. After the breakout, we can expect the R Systems International share price to touch \u20b9 358 soon.\n\nHighlighting the reason for the rally in the R Systems International Ltd share price today, Anuj Gupta, a SEBI-registered market expert, said, \u201cR Systems International Ltd is an IT-enabled company. It is benefiting from the buzz around IT stocks, fueled by TCS's Q2 results. The company's fundamentals are also strong, as it received an AA\u2212 (Stable) rating from the rating agency ICRA on Thursday.\u201d\n\nExpecting the rally to continue, Mahesh M Ojha, VP \u2014 Research and Business Development at KC Securities, said, \u201cR Systems International share price is on the cusp of giving a technical breakout at \u20b9 298. On breaking above this level on a closing basis, we can expect R Systems International share price to touch \u20b9 358 in the near term.", "source": "LiveMint Markets", "pub_date_str": "09 Oct 2026, 11:59 AM IST", "pub_date_relative": "1h ago"}, {"title": "Tata Technologies stock jumps 30% in 6 months, up 6% today: Should you buy now? Check target, support levels", "full_content": "Tata Technologies share price : Tata Technologies shares rallied on Friday, October 9, attracting investor attention after a recent correction. The stock's near-term technical setup has improved, but its performance across different time frames remains mixed. Investors are now watching whether the recovery can sustain and what levels could determine the stock's next move.\n\nThe stock gained 6% to \u20b9 736.50 per share on the BSE during the session.\n\nTata Technologies had touched a 52-week high of \u20b9 890.15 in August 2026 before declining to a 52-week low of \u20b9 507.50 in March 2026. Although the Tata Group stock has recovered from its lows, its recent performance has been uneven. It has fallen 8% in one month, gained 2% over three months and risen 30% in six months. Over the past year, however, the stock has remained largely flat, with a gain of just 1%.\n\nTata Technologies shares have rebounded sharply, drawing attention to key technical levels that could determine whether the recovery gains further momentum. Analysts have identified crucial support zones and resistance levels for investors to watch as the stock attempts to strengthen its upward trend.\n\nJigar S Patel, senior manager of technical research at Anand Rathi Share and Stock Brokers, said Tata Technologies had bounced back from the \u20b9 680\u2013700 support zone, which coincides with the 200-day double exponential moving average (DEMA).\n\n\u201cThe key level to watch is \u20b9 700. If the stock sustains above this level and witnesses fresh buying interest, it could strengthen the possibility of a recovery towards \u20b9 800 in the near term,\u201d Patel said.\n\nHe cautioned that the stock needs to maintain strength above this zone to confirm a positive reversal.", "source": "LiveMint Markets", "pub_date_str": "09 Oct 2026, 11:56 AM IST", "pub_date_relative": "1h ago"}, {"title": "Global Market: Maas Group shares plunge 11% after Nvidia-backed Firmus scraps $5 billion IPO", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Global Market: Maas Group shares plunge 11% after Nvidia-backed Firmus scraps $5 billion IPO Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market: Maas Group shares plunge 11% after Nvidia-backed Firmus scraps $5 billion IPO SECTIONS Global Market: Maas Group shares plunge 11% after Nvidia-backed Firmus scraps $5 billion IPO By Anupam Nagar , ETMarkets.com Last Updated: Oct 09, 2026, 11:56:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Maas Group shares plunged nearly 11% after Nvidia-backed Firmus withdrew its planned $5 billion IPO, raising valuation concerns. Despite the setback, contracts worth A$1.1 billion remain intact, providing revenue visibility amid uncertainty over Firmus's funding strategy and AI infrastructure valuations.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "09 Oct 2026, 11:56 AM IST", "pub_date_relative": "1h ago"}, {"title": "Russia's internet giant Yandex halts operations at major data center after drone attack", "full_content": "Russian internet giant Yandex suspended operations at one of its key data centers on Thursday after a drone strike as Ukraine continues to target the country's infrastructure.\n\nThe attack caused a fire at the company's data center in Sasovo, Ryazan, in western Russia, and affected part of its infrastructure, Yandex said in a statement to CNBC. The data center has stopped operating entirely, and some Yandex services may be unavailable to users, it added.\n\n\"We are still assessing the extent of the damage to our infrastructure. At this stage, we cannot confirm whether the equipment at our Sasovo data center can be restored,\" they said on Friday.\n\nIt confirmed that there are no casualties and emergency services are on site dealing with the aftermath.\n\nMoscow-headquartered Yandex, known as the Google of Russia, provides the country's most widely used search engine. It also developed the region's leading generative AI model, YandexGPT.\n\nAlthough Ukraine has not claimed responsibility for the Yandex attack, it has been stepping up its attacks on Russian infrastructure, including energy, over recent months, such as targeting Russian oil refineries , which President Volodymyr Zelenskyy has said are used to \"finance the war and the killing of Ukrainians.\"\n\nUkraine also increased attacks on Russian retail giant Wildberries , a critical part of the consumer infrastructure.\n\nLast week, Zelenskyy said the country will double down on its attacks on Russian oil refineries in response to a new policy of airstrikes from Moscow designed to force people to leave Kyiv and other cities.", "source": "CNBC World Economy", "pub_date_str": "09 Oct 2026, 11:54 AM IST", "pub_date_relative": "1h ago"}, {"title": "Stock Picks Today: TCS, LG Electronics, Havells, KEC International, And More On Brokerages' Radar", "full_content": "Check out the top stock calls, initiations, upgrades, downgrades, and target price revisions from leading brokerages ahead of today's trade.", "source": "NDTV Profit", "pub_date_str": "09 Oct 2026, 11:52 AM IST", "pub_date_relative": "1h ago"}, {"title": "Ray Dalio warns the stock market's cushion against rising bond yields is shrinking", "full_content": "Billionaire investor Ray Dalio warned on Thursday that stocks face mounting pressure from rising bond yields and the prospect of weaker corporate cash flows, even as earnings continue to grow.\n\nThe Bridgewater Associates founder told CNBC equities have so far weathered the global bond sell-off because earnings growth has kept expected stock returns attractive, relative to bonds. But that advantage will narrow, he said, potentially leaving equities more vulnerable as financial conditions tighten.\n\n\"We're in the part of the cycle where interest rates can rise without sending the equity market down because there's enough earnings growth and there's enough expected return,\" Dalio told CNBC's Sri Jegarajah at the Milken Institute Asia Summit in Singapore on Thursday.\n\n\"But when that cushion comes down, then you're coming later into that cycle. So that's where we are.\"\n\nHis warning comes as U.S. Treasury yields hover near multi-decade highs. Investors are grappling with large government deficits, persistent inflation and rising borrowing tied to artificial intelligence investment.\n\nDalio said equities entered the current cycle offering significantly higher expected returns than bonds, helping sustain demand for stocks even as borrowing costs rose.\n\nBut as stock prices climb and bond yields increase, that relative advantage is diminishing, leaving less room for equities to absorb higher rates.\n\n\"Because of that change in pricing, that cushion has come down, and so now you're starting to see credit spreads start to widen,\" he said.", "source": "CNBC Top News", "pub_date_str": "09 Oct 2026, 11:46 AM IST", "pub_date_relative": "1h ago"}, {"title": "OnePlus Phone Offers: Best Deals To Check During Amazon's Great Indian Festival 2026 Sale", "full_content": "Planning to buy a OnePlus smartphone this festive season? Amazon\u2019s Great Indian Festival 2026 brings price cuts across the brand\u2019s Nord and flagship lineups. From a performance focused smartphone to a premium device, here are the deals worth checking before making your purchase.", "source": "NDTV Profit", "pub_date_str": "09 Oct 2026, 11:44 AM IST", "pub_date_relative": "1h ago"}, {"title": "Stock Market Today LIVE: Sensex Jumps 800 Points, Nifty 50 Above 22,500 Led By IT, Banks; TCS, Wipro, HCL Tech Lead", "full_content": "Global market cues remain weak as Asian markets traded lower and the US stock market declined overnight, weighed down by selloff in technology stocks.", "source": "NDTV Profit", "pub_date_str": "09 Oct 2026, 11:40 AM IST", "pub_date_relative": "1h ago"}, {"title": "15,410% rally in 5 years! Multibagger Cupid shares jump 3% to hit fresh 52-week high", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a 15,410% rally in 5 years! Multibagger Cupid shares jump 3% to hit fresh 52-week high Cupid Share Price The Economic Times daily newspaper is available online now. Read Today's Paper 15,410% rally in 5 years! Multibagger Cupid shares jump 3% to hit fresh 52-week high SECTIONS 15,410% rally in 5 years! Multibagger Cupid shares jump 3% to hit fresh 52-week high By Debaroti Adhikary , ETMarkets.com Last Updated: Oct 09, 2026, 11:38:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Cupid shares jumped hit a fresh 52-week high of Rs 368 on Friday, extending their rally for a fourth straight session. Earlier this month, Cupid raised its FY27 revenue and profit guidance for the second time in less than two weeks, targeting revenue of Rs 800 crore and net profit of Rs 250 crore for the financial year.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "09 Oct 2026, 11:38 AM IST", "pub_date_relative": "1h ago"}, {"title": "Viral Video: Thailand Queen Suthida Makes First Solo Flight In Fighter Jet", "full_content": "The King of Thailand Maha Vajiralongkorn presented Queen Suthida with flowers and the special Gripen Order Golden Patch, a gold-embroidered insignia awarded to pilots who have successfully flown the Saab JAS 39 Gripen fighter jet.", "source": "NDTV Profit", "pub_date_str": "09 Oct 2026, 11:35 AM IST", "pub_date_relative": "1h ago"}, {"title": "Why is Broadcom stock falling despite strong AI demand?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News Powered By Why is Broadcom stock falling despite strong AI demand? Written by Anupam Nagar , ETMarkets.com | Oct 09, 2026, 11:50:23 AM IST 1 / 6 Broadcom shares fall despite strong AI demand Broadcom shares fell around 2.1% as selling across AI-related stocks outweighed optimism from TSMC\u2019s record quarterly revenue. Investors remained concerned about elevated expectations for AI growth. (Sources: GuruFocus, TradingView, Barron's)\n\nReports that Broadcom was exploring more than $50 billion in debt financing linked to OpenAI\u2019s custom AI chip purchases raised questions about the financial risks associated with large-scale AI infrastructure investments.\n\nTSMC reported third-quarter revenue of T$1.49 trillion, up 50% year-on-year. However, the strong performance failed to trigger a broader rally in AI stocks as investors weighed the sustainability of AI spending.\n\nBroadcom expects fourth-quarter AI semiconductor revenue of $21.7 billion, compared with $16.7 billion in the previous quarter. Meeting this target will be crucial to sustaining investor confidence in its AI growth story.\n\nReports about OpenAI\u2019s revenue outlook revived concerns over whether the company\u2019s income can keep pace with its ambitious spending plans. The concerns contributed to selling pressure across AI-related stocks.\n\nInvestors will track Broadcom\u2019s AI chip demand, revenue growth and execution against its forecasts, alongside developments in OpenAI\u2019s financing plans. The sustainability of AI infrastructure spending remains a key factor for the stock. (Disclaimer: This slideshow is based on inputs from agencies. These do not represent the views of The Economic Times.)", "source": "Economic Times Markets", "pub_date_str": "09 Oct 2026, 11:35 AM IST", "pub_date_relative": "1h ago"}, {"title": "Two people spend \u20b930,000 on credit cards, but one may have a lower credit score. Here's why it happens", "full_content": "You may spend \u20b9 30,000 on your credit card every month and see your credit score take a hit, while a friend spending the same amount sees no such impact. The difference could lie in your respective credit limits, which determine how much of your available credit you are using.\n\nThis is where your credit utilisation rate comes into play. If you have multiple credit cards at once, the utilisation rate is calculated across them collectively, rather than being assessed separately for each card.\n\nLet's say you and your friend each spend \u20b9 30,000 on your credit cards every month. Your friend has a total credit limit of \u20b9 1 lakh, while you have a limit of \u20b9 50,000. Your credit utilisation rates would be 30% and 60%, respectively.\n\nDespite spending the same amount, you have a higher credit utilisation rate, which could negatively affect your credit score.\n\nCredit utilisation rate refers to the percentage of a person's available credit limit that they are using at a given time. It is calculated by dividing that person's outstanding credit card balance by their total available credit limit.\n\nLending institutions are very particular about this metric. They closely monitor a borrower's credit utilisation ratio because consistently higher utilisation may indicate financial stress or a reliance on credit to meet day-to-day expenses, even if the borrower usually pays their bills on time.\n\nCredit utilisation is one of the factors reflected in credit assessments, with lenders and credit bureaus such as TransUnion CIBIL , Experian and CRIF High Mark. A lower credit score can affect your ability to secure future loans, the credit limit offered to you or the interest rate on such borrowings.\n\nHence, keeping your credit utilisation ratio below 30% is generally recommended to maintain a healthy credit score. Exceeding this threshold can negatively affect your score, particularly if high utilisation persists over time.", "source": "LiveMint Money", "pub_date_str": "09 Oct 2026, 11:32 AM IST", "pub_date_relative": "1h ago"}, {"title": "Most countries unprepared for bank failures, watchdog warns", "full_content": "Financial Stability Board says only US, UK, Japan and Hong Kong have a \u2018credible public sector backstop\u2019 to keep troubled lenders afloat before a sale or wind-down", "source": "FT Markets", "pub_date_str": "09 Oct 2026, 11:30 AM IST", "pub_date_relative": "1h ago"}, {"title": "Gold Corrects Over 24% From Peak: Should You Consider Gold ETFs?", "full_content": "You may consider gold investment if it isn\u2019t already a part of your portfolio since it acts as a diversification tool and typically protects during uncertain economic conditions.", "source": "NDTV Profit", "pub_date_str": "09 Oct 2026, 11:24 AM IST", "pub_date_relative": "1h ago"}, {"title": "Hexaware Technologies share price surges 12%, up for 5th consecutive session - What's next for the stock? Experts decode", "full_content": "Hexaware Technologies shares surged as much as 12% in intraday trade on the BSE on Friday, 9 October, with a strong spurt in volume. Hexaware Technologies share price opened at \u20b9 533 against its previous close of \u20b9 510.85 and jumped 12.4% to an intraday high of \u20b9 574.45, looking set to extend gains for the fifth consecutive session. The stock witnessed a more than 9.83 times spurt in volume in Friday's session.\n\nThe jump in stock prices on Friday followed the company's announcement of a multi-year partnership with Anthropic on Thursday, 8 October. Under the partnership, Hexaware\n\nbecomes a preferred partner in Anthropic\u2019s Claude Partner Network.\n\n\"Hexaware has more than 1,100 Claude-certified professionals. Hexaware and Anthropic will work together on go-to-market, joint solution development, and customer deployments, and Hexaware will expand Claude training across its delivery teams,\" said the company.\n\nThe stock is up 13% over the last six months, compared to a 6% fall in equity benchmark Sensex and a 10% decline in the BSE IT index.\n\nYear-to-date, however, the stock is down 29% compared to a 15% drop in Sensex and a 26% decline in the BSE IT index.\n\nThe stock hit a 52-week high of \u20b9 808.40 on 4 December last year and a 52-week low of \u20b9 400.35 on 12 March this year.\n\nAccording to Aditya Thukral, founder and analyst at AT Research and Risk Managers, Hexaware Technologies has been in a downtrend with the formation of lower highs and lower lows.", "source": "LiveMint Markets", "pub_date_str": "09 Oct 2026, 11:23 AM IST", "pub_date_relative": "1h ago"}, {"title": "Karnataka Food Safety Crackdown: 45 Ice Cream Units Inspected; Expired Biscuits, Milk Seized", "full_content": "Inspectors picked up 70 samples for laboratory testing including out-of-date stock from two Bengaluru outlets and flagged hygiene and labelling lapses at units in Raichur and Mysuru.", "source": "NDTV Profit", "pub_date_str": "09 Oct 2026, 11:20 AM IST", "pub_date_relative": "1h ago"}, {"title": "Chipotle shares rally: What investors should know about the Starbucks deal", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News Powered By Chipotle shares rally: What investors should know about the Starbucks deal Written by Anupam Nagar , ETMarkets.com | Oct 09, 2026, 11:27:23 AM IST 1 / 5 \u200bChipotle stock jumps Chipotle Mexican Grill shares rallied after reports that Starbucks was considering a potential acquisition of the burrito chain. The speculation revived investor interest in Chipotle, although a formal offer has not been confirmed. Any transaction would represent a major development for the restaurant industry.(Sources: Investopedia, Trefis)\n\nThe reported takeover interest has drawn attention to Starbucks CEO Brian Niccol, who led Chipotle from 2018 to 2024. Niccol played a key role in strengthening Chipotle's growth strategy before joining Starbucks. A potential acquisition could bring the executive back to the restaurant chain he once headed, although the strategic rationale and execution risks remain important considerations.\n\nThe takeover speculation comes after a difficult period for Chipotle shares, which have faced pressure from slower sales growth, rising operating costs and concerns about consumer demand. According to Trefis, the stock had fallen about 17% from its September 14 high as of October 7, 2026. The latest rally has offered some relief, but a sustained recovery will depend on business performance and further developments surrounding the reported deal.\n\nTrefis examined nine historical instances in which Chipotle shares fell at least 20% over 30 trading days and had sufficient subsequent performance data. The stock was higher a year later in six of those cases, with a median one-year return of 21%. However, investors who bought after these declines experienced a median further drawdown of 25% before the recovery.", "source": "Economic Times Markets", "pub_date_str": "09 Oct 2026, 11:17 AM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "Stock futures edge higher after OpenAI's revenue report prompts tech sector turmoil: Live updates", "full_content": "U.S. stock futures edged higher early Friday after an underwhelming revenue report from OpenAI took some steam out of the high-flying artificial intelligence trade.\n\nS&P 500 futures were up 0.3%, while Nasdaq 100 futures added 0.49%. Dow Jones Industrial Average futures advanced 105 points, or 0.2%.\n\nIn Asia on Friday, Japan's Nikkei 225 was little changed, mainland China's CSI 300 advanced 0.16%, while Australia's Australia's S&P/ASX 200 added 0.64%. Hong Kong's Hang Seng index was up 1.4% in its last hour of trade.\n\nShares of SpaceX rose 2% in extended trading after the rocket company announced a deal to buy a nationwide spectrum portfolio. Shares of AT&T , Verizon and T-Mobile slid as investors wondered worried the agreement could drive up competition.\n\nAI stocks dropped on Thursday after CNBC confirmed that OpenAI told investors that it saw $50 billion in annualized revenue at the end of September. A $68 billion figure was widely reported last month, though a person familiar with the matter said it also included gross revenue from partners.\n\nCoreWeave fell more than 7%, while Oracle , Intel and Super Micro Computer all lost around 5%. Advanced Micro Device slid close to 4%, while Nvidia shed almost 3%.\n\n\"If we have a number of days like this ... we could see a real rout in AI-related names,\" said Kristina Hooper, chief market strategist at Man Group, on CNBC's \"Closing Bell: Overtime.\" \"That could sour investors.\"\n\nThe Nasdaq Composite dropped more than 1%, marking its biggest one-day loss since mid August. Thursday marked the second down day in a row for the tech-heavy index after it climbed to fresh all-time records earlier in the week.", "source": "CNBC Top News", "pub_date_str": "09 Oct 2026, 01:02 PM IST", "pub_date_relative": "just now", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Derivatives", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Buying insurance is easy. Knowing what you bought is harder", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nHere is a number worth sitting with. Between FY23 and FY25, what insurers paid corporate agents grew 125%. The premium those policies brought in grew 28%.\n\nYour premium paid for that gap. So what did you get for it after the sale?\n\nFor most policyholders, very little. Buying insurance feels easy; knowing what you bought often does not. That is no accident. Most distribution models earn their margin when a policy is issued. Renewals, claims and a family searching for a policy document in a hospital corridor have rarely been anyone's job.\n\nOn 23 September, the Insurance Regulatory and Development Authority of India (Irdai) released a consultation paper, Recalibrating Economics of Insurance Distribution, open for comments until 25 October. These are proposals, not final rules. But the regulator is finally asking the right question: who owns the customer's experience once the sale is done?\n\nIrdai wants to ban dark patterns, such as demanding your phone number before showing a product's price. Access to information, it says, should not be a lead generation opportunity.\n\nThe lesson : If a seller won't show the price and exclusions upfront, that tells you something about the seller.\n\nStandardised one-page sheets would put waiting periods, co-payments, sub-limits and room-rent caps in one place.", "source": "LiveMint Money", "pub_date_str": "09 Oct 2026, 12:56 PM IST", "pub_date_relative": "5m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "AWL Agri\u2019s growth metrics improve in Q2, but margins remain a pain point", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nAWL Agri Business\u2019 shares have risen more than 3% over the past four trading sessions, with the September quarter (Q2FY27) preliminary update announced on Monday after market hours, bringing some comfort.\n\nAWL delivered 12% year-on-year volume growth and 24% revenue growth in Q2, led by strong momentum in its food and FMCG portfolio and industry essentials. The edible oil business delivered steady volume growth, the company said. For perspective, volume and revenue growth stood at 7% and 18%, respectively, in the year-ago quarter. AWL\u2019s numbers also exceeded Nuvama Institutional Equities\u2019 Q2 estimates of 6% volume growth and 14% revenue growth.\n\nAWL\u2019s food and FMCG business recorded 33% revenue growth, crossing \u20b9 2,000 crore for the first time. Growth was broad-based, with wheat and rice performing strongly. Additional categories such as besan, pulses, soya nuggets, sugar , sattu and poha now account for over 35% of the food portfolio and together grew around 50% year-on-year in Q2.\n\nFortune pulses revenue crossed \u20b9 100 crore last quarter, with AWL looking to expand distribution across general trade and quick commerce. The Madhur Sugar deal could provide another leg to the food strategy. The company is using its distribution network to scale the licensed brand, with management targeting higher volumes through the year.\n\nIn FY26, edible oil contributed 80% of AWL\u2019s overall revenue, while food and FMCG, and industry essentials contributed 9% and 11%, respectively.\n\nMeanwhile, the industry essentials division recorded 25% year-on-year volume growth in Q2, led by oleochemicals, castor and de-oiled cakes. The edible oil business clocked just 3% volume growth, led by mustard oil and rice bran oil.\n\nEdible oil volume growth was 2% in Q1.", "source": "LiveMint Markets", "pub_date_str": "09 Oct 2026, 12:55 PM IST", "pub_date_relative": "7m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Govt likely to finalise critical minerals stockpiling policy in a month", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a Govt likely to finalise critical minerals stockpiling policy in a month The Economic Times daily newspaper is available online now. Read Today's Paper Govt likely to finalise critical minerals stockpiling policy in a month SECTIONS Govt likely to finalise critical minerals stockpiling policy in a month PTI Last Updated: Oct 09, 2026, 12:50:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Mines Secretary Keshav Chandra indicated that a policy on stockpiling critical minerals will be announced soon. This initiative is designed to support strategic sectors like defence, advanced electronics, and aerospace. The government plans to establish four dedicated critical minerals processing parks across various states to enhance value addition. A comprehensive list of over 30 critical minerals has been released for essential industry needs.\n\nWhat is the real impact of 13x jump in cash transfers to women?\n\nThe NBFC saga - Part 2: Line drawn in 2006 is reason for the headlines today\n\nAirlines Q2 turbulence: Fewer passengers, rising fares and a crude shock\n\nBritannia\u2019s next big bet for young India lies beyond biscuits\n\nThe world is witnessing a bond rout. Why should it matter to you?\n\nQ2 earnings season: Will it settle or add to confusion in the stock market?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "09 Oct 2026, 12:50 PM IST", "pub_date_relative": "12m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Fixed Income"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Fortis Healthcare, Apollo Hospitals, Max, Medanta shares rise: Should investors buy after 30% cancer drug price cap?", "full_content": "Hospital stocks rallied on Friday after the government decided to limit trade margins on non-scheduled anti-cancer drugs to 30%, a move expected to lower the prices of several cancer medicines by 20-70% and save patients an estimated \u20b9 2,500 crore annually. The decision lifted investor sentiment, although brokerages flagged potential margin pressure and said the full impact on hospital earnings would depend on further details.\n\nFortis Healthcare shares surged 5.3% to \u20b9 805.15, followed by Manipal Health Enterprises , which gained 4.3% to \u20b9 715.50. Krishna Institute of Medical Sciences advanced 4.2% to \u20b9 716.35, while Max Healthcare Institute rose 4.4% to \u20b9 915. Apollo Hospitals Enterprise shares climbed 4% to \u20b9 7,977.70, and Global Health gained 3.2% to \u20b9 1,317.25.\n\nHowever, the hospital stocks had fallen over the preceding two weeks after the Supreme Court raised concerns about the disparity between price-to-retailer (PTR) and maximum retail prices (MRP) of essential medicines. It cited an example of a cancer drug carrying an MRP of \u20b9 27,000 against a PTR of \u20b9 2,700.\n\nThe National Pharmaceutical Pricing Authority (NPPA), the drug pricing regulator, said the intervention could bring down MRPs by approximately 20-70%, depending on the existing distribution structure and mark-up for individual medicines.\n\nThe policy extends the government's earlier trade-margin restrictions, which covered only select oncology drugs, to non-scheduled anti-cancer medicines that do not fall under the existing list of drugs with government-set ceiling prices.\n\nNPPA's analysis found that non-scheduled cancer medicines carried an average price mark-up of around 170%, with some cases involving mark-ups of 700% or more.", "source": "LiveMint Markets", "pub_date_str": "09 Oct 2026, 12:49 PM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "U.S. stock futures rise after Nasdaq slide as OpenAI revenue concerns ease", "full_content": "", "source": "Investing.com News", "pub_date_str": "09 Oct 2026, 12:42 PM IST", "pub_date_relative": "19m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Global Market: Singapore likely to tighten monetary policy as growth and inflation risks mount", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a Global Market: Singapore likely to tighten monetary policy as growth and inflation risks mount Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market: Singapore likely to tighten monetary policy as growth and inflation risks mount SECTIONS Global Market: Singapore likely to tighten monetary policy as growth and inflation risks mount By Anupam Nagar , ETMarkets.com Last Updated: Oct 09, 2026, 12:42:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Singapore\u2019s central bank is widely expected to tighten monetary policy on October 14 as resilient economic growth and rising inflation risks persist. Geopolitical tensions, higher oil prices and potential food supply disruptions are adding pressure. Economists anticipate a modest Singapore dollar appreciation adjustment, balancing inflation control with economic stability amid global uncertainty.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "09 Oct 2026, 12:42 PM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Economics", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Crude Oil WTI trapped in $89-$92 chop zone: Live levels", "full_content": "", "source": "Investing.com News", "pub_date_str": "09 Oct 2026, 12:41 PM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "European stocks attempt bounce, but heads for weekly loss as French debt weighs", "full_content": "", "source": "Investing.com News", "pub_date_str": "09 Oct 2026, 12:41 PM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Bitcoin breaks below range, tests $81K support: Live levels", "full_content": "", "source": "Investing.com News", "pub_date_str": "09 Oct 2026, 12:41 PM IST", "pub_date_relative": "21m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Hang Seng tests $24,316 resistance cluster: Live levels", "full_content": "", "source": "Investing.com News", "pub_date_str": "09 Oct 2026, 12:41 PM IST", "pub_date_relative": "21m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Natural Gas stuck at $3.105 support: Live levels", "full_content": "", "source": "Investing.com News", "pub_date_str": "09 Oct 2026, 12:41 PM IST", "pub_date_relative": "21m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Vedanta dividend 2026 record date, payment timeline, dividend yield and history; share performance - Full details here", "full_content": "Vedanta dividend 2026 : Anil Agarwal-led Vedanta, on Thursday, announced its first interim dividend since its demerger for the financial year 2026-27. The company announced an interim dividend of \u20b9 5 per share, taking the total payout to approximately \u20b9 1,955 crore.\n\nIn an exchange filing, the company said this is its first interim dividend since the demerger. The payout underscores Vedanta\u2019s commitment to shareholder value as it begins a new phase as a more focused and diversified natural resources company.\n\n\u201cWe wish to inform you that the Board of Directors of Vedanta Limited (the \u201cCompany\u201d), have, today i.e. October 08, 2026, approved the First Interim Dividend 2026-27 of \u20b9 5/- per equity share on face value of \u20b9 1/- per equity share for the Financial Year 2026-27 amounting to c. \u20b9 1,955 Crores,\u201d the company said in an exchange filing.\n\nThe dividend announcement follows Vedanta\u2019s strong Q2 FY27 operational performance, with the company reporting broad-based growth momentum across its businesses.\n\nThe company further notified that 14 October has been fixed as the record date for the purpose of dividend payment, and the payment date shall be Wednesday, with the payout to be made within the timelines stipulated by law.\n\n\u201cThe record date for payment of dividend shall be Wednesday, October 14, 2026, and the interim dividend shall be duly paid within the stipulated timelines as prescribed under law,\u201d the company said in the filing.\n\nVedanta has declared 50 dividends since 23 July 2001, reflecting its long history of distributing payouts to shareholders. The company has remained a dividend-focused stock, attracting investors seeking regular income alongside potential capital appreciation.\n\nOver the past 12 months, Vedanta has declared an equity dividend of \u20b9 11 per share. At the current share price of \u20b9 261.80, this translates into a dividend yield of approximately 4.20%.", "source": "LiveMint Markets", "pub_date_str": "09 Oct 2026, 12:36 PM IST", "pub_date_relative": "26m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Fixed Income"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Gold Glitters, Silver Shines: Yellow Metal Prices Jump By Over Rs 2,000; White Metal Surges By Rs 4,100", "full_content": "The recovery in international bullion markets, supported by a weaker US dollar and easing US Treasury yields, is primarily driving precious metals' prices up today.", "source": "NDTV Profit", "pub_date_str": "09 Oct 2026, 12:29 PM IST", "pub_date_relative": "32m ago", "cfa_topics": ["Fixed Income", "Alternative Investments"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Vedanta shares up 4% after announcing first interim dividend for FY27 - Record date | A stock to buy? Expert view", "full_content": "Vedanta shares jumped 4% in intraday deals on the BSE on Friday, 9 October, a day after announcing the first interim dividend for the financial year 2026-27 (FY27).\n\nVedanta share price opened at \u20b9 255.60 against its previous close of \u20b9 253.10 and rose 4% to an intraday high of \u20b9 263.25, looking set to snap its two-day losing run.\n\nIn an exchange filing on 8 October, Vedanta said its board had approved the first interim dividend of \u20b9 5 per share for the financial year 2026-27.\n\nThe record date for the said dividend is Wednesday, 14 October 2026.\n\nThe stock is 50% up in the last one year, hitting a 52-week high of \u20b9 360.70 on 29 May this year and a 52-week low of \u20b9 168.30 on 9 October last year.\n\nOn a monthly scale, the stock is up 1% so far in October after a 7% decline in September.\n\nVedanta stock appears fundamentally strong, supported by its healthy financial performance in the previous quarter and expectations of another healthy showing in Q2FY27.\n\n\"Vedanta Limited exhibits a robust fundamental outlook, underpinned by stellar Q1 FY27 financial performance and progressive operational milestones in Q2FY27. During Q1 FY27, the company reported a massive 152% year-on-year surge in net profit to \u20b9 5,294 crore, driven by robust operational efficiencies, an expanding EBITDA margin of 57%, and a comfortable net debt-to-EBITDA ratio of 0.3 times,\" Seema Srivastava, Senior Research Analyst at SMC Global Securities, pointed out that.", "source": "LiveMint Markets", "pub_date_str": "09 Oct 2026, 12:29 PM IST", "pub_date_relative": "32m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Anand Rathi Wealth Q2 results 2026, dividend amount announcement today: Date, time, quarterly earnings schedule", "full_content": "Anand Rathi Wealth Q2 results 2026: Shares of Anand Rathi Wealth Limited were trading lower ahead of the announcement of their second quarter result for the financial year 2026-27 on Friday, October 9.\n\nThe Q2 earnings season started this week, with companies like Tata Consultancy Services , GM Breweries, K&R Rail Engineering company announcing their quarterly results. Here are all the details about Anand Rathi Q2 result schedule, dividend record date, dividend expectations, etc .\n\nThe Mumbai-headquartered financial services firm is scheduled to announce its Q2FY27 result on Friday, October 9. Anand Rathi Wealth\u2019s board of directors will \u2018consider, approve and take on record the Unaudited standalone and consolidated financial results of the Company for the Second quarter and Half year ended 30th September, 2026.\u201d The result will be announced after review by the Audit Committee of the Board.\n\nThe company\u2019s hasn\u2019t specifically mentioned the time of Q2 result announcement.\n\nThe company\u2019s board of directors will consider and approve interim dividend for the financial year 2026-27. The board has fixed Thursday, October 15, as the record date to determine the eligibility of shareholders for the payout.\n\n\u201cWe hereby inform about revision in the Record Date as Thursday, 15th October, 2026, for the purpose of payment of Interim Dividend, if declared, by the Board of Directors at their meeting scheduled to be held on Friday, 09th October, 2026,\u201d read the firm\u2019s BSE filing released on Thursday.\n\nIn April this year, the company\u2019s board had announced a dividend of \u20b9 7 per equity share. In October 2025, the board had approved \u20b9 6 dividend for FY26. In May 2026, the board had recommended \u20b9 7 dividend per equity share. Going by the trend, the stock investors can expect dividend payout in the range of \u20b9 6-7 per share on Friday.\n\nThe stock was trading 3.67% lower at \u20b9 2065.25 per share on BSE at 12:12 pm on Friday.", "source": "LiveMint Markets", "pub_date_str": "09 Oct 2026, 12:17 PM IST", "pub_date_relative": "44m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Q2 Results Live Updates: TCS Share Price Rises 4% After Earnings; Anand Rathi Slips Nearly 4% Ahead Of Numbers", "full_content": "Q2 FY27 Results Live Updates: Anand Rathi, Can Fin Homes and Poonawalla Fincorp will be among the key earnings announcements to watch.", "source": "NDTV Profit", "pub_date_str": "09 Oct 2026, 12:15 PM IST", "pub_date_relative": "46m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Five Reasons Why Stock Market Is Rising Today: Sensex Jumps 800 Points, Nifty 50 Above 22,500", "full_content": "Dalal Street bounced back from Thursday's rout as a massive IT rally, lower oil prices, and value buying pushed benchmark indices higher.", "source": "NDTV Profit", "pub_date_str": "09 Oct 2026, 12:06 PM IST", "pub_date_relative": "55m ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Vivriti Asset Management returns over Rs 3,400 crore to investors across two fund vintages", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Vivriti Asset Management returns over Rs 3,400 crore to investors across two fund vintages The Economic Times daily newspaper is available online now. Read Today's Paper Vivriti Asset Management returns over Rs 3,400 crore to investors across two fund vintages SECTIONS Vivriti Asset Management returns over Rs 3,400 crore to investors across two fund vintages By Veer Sharma , ETMarkets.com Last Updated: Oct 09, 2026, 12:01:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Vivriti Asset Management has completed and exited its Vintage II credit funds, returning over Rs 2,260 crore in capital and income. The funds invested across more than 45 companies, delivering gross IRRs of around 12% to 15%.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "09 Oct 2026, 12:01 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Tokenization could unleash tens of billions of dollars in trapped capital, Nasdaq CEO says", "full_content": "Tokenization could free up tens of billions of dollars in capital tied up in assets used as collateral across the global financial system, Nasdaq CEO Adena Friedman said.\n\nTokenizing assets such as Treasurys, equities and money market funds, along with the flow of money, could make collateral more liquid, Friedman told CNBC's Joanna Ossinger at the TOKEN2049 conference in Singapore.\n\n\"If you tokenize all those instruments along with the flow of money, then the collateral becomes very fluid,\" Friedman said.\n\nTokenization involves representing financial assets, such as stocks and bonds, as digital tokens that can be transferred using blockchain technology.\n\nFriedman said institutional interest in tokenization has grown over the past year, pointing in part to the passage of the Genius Act in the U.S., which established a regulatory framework for stablecoins.\n\n\"If we can tokenize money, then we can tokenize the flow of capital,\" she said.\n\nThat growing institutional interest is converging with demand from retail investors, who have long sought the ability to trade around the clock, according to Friedman. The retail ecosystem \"has been about 10 years ahead,\" she said.\n\nMoving to a fully 24/7 market would be a major undertaking for the financial industry, Friedman said.", "source": "CNBC World Economy", "pub_date_str": "09 Oct 2026, 12:00 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "R Systems International skyrockets 15% today after it was down 34% in a year \u2014 Book profit or buy more? Experts' view", "full_content": "Stocks to buy today: Following a sharp rally in the Nifty IT index, other IT-enabled stocks also witnessed a sharp upside during Friday's session. R Systems International Ltd shares are one of them. R Systems International's share price today opened upside at \u20b9 245.80 apiece on the NSE and touched an intraday high of \u20b9 284.60 per share within a few minutes of the Opening Bell, logging more than 15% rise against its previous close of \u20b9 242.85. Notably, shar
