    const allData = {"general": [{"title": "CNBC AI Forum takeaways: AI costs, security and scale in focus", "full_content": "CNBC held its second-annual AI Forum in Dallas, Texas on Thursday, with conversations focusing on the debates around AI safety and security, data centers, the return on investment, and our lives.\n\nThe event focused on how enterprises are dealing with the practical challenges of moving from experimentation to deployment, along with the risks posed by autonomous agents, cybersecurity threats, uneven regulation and political pressure.\n\nDallas-based startup Colossal Biosciences has made headlines around its efforts to 'de-extinct' several extinct animals like the wooly mammoth, the dire wolf and the dodo through the use of AI, CRISPR and other technologies.\n\nBut CEO Ben Lamm told CNBC's Julia Boorstin that while that in itself is exciting, the potential ramifications go well beyond a Jurassic Park scenario.\n\n\"We are in a biodiversity crisis, so we need these tools because we're going to lose about half of biodiversity in the next 25 years, and that's really bad,\" Lamm said. \"We do need cryopreservation, we need biobanks, we need genetic rescue and these types of tools.\"\n\nLamm said that if you step beyond just the ideas of de-extinction and species preservation, the fundamental technologies that Colossal Biosciences is working on are essentially advanced genome engineering and developmental biology capabilities.\n\n\"We're pushing the boundaries of DNA synthesis to synthesize the largest cargos of DNA, and so that will be massively transformative about how we think about programmable life,\" Lamm said. \"Think about everything from like microbes to plastic in the oceans to gene therapies and targeted delivery for humans to eradicate genetic diseases in our offspring to crops that can grow 30% faster.\"\n\n\"All of that is something that will be powered by this kind of combination of developmental biology and genetic engineering,\" he said.", "source": "CNBC World Economy", "pub_date_str": "02 Oct 2026, 07:29 PM IST", "pub_date_relative": "1m ago"}, {"title": "Vaishali Parekh's top 3 stocks to buy: CG Power, Graphite India, Bectors Food | Target, stop-loss, market outlook", "full_content": "Vaishali Parekh's top 3 stocks to buy: In the truncated trading week, the benchmark indices corrected sharply. The Nifty 50 index ended down by 3.10%, while the Sensex fell nearly 2000 points. Among the sectors, almost all major sectoral indices saw profit-booking at higher levels. The Consumer and Auto indices lost the most: Consumer stocks corrected 6.15%, and Auto stocks fell 5.85%.\n\nThe market consistently faced selling pressure at higher levels during the week. On the weekly charts, it formed a long bearish candle. On the intraday charts, it continued to make lower highs and lower lows, indicating a largely negative trend.\n\nVaishali Parekh, Vice President \u2014 Technical Research at Prabhudas Lilladher, believes the Indian stock market bias has weakened after the crash across all four sessions last week. The Prabhudas Lilladher expert said the Nifty 50 index has crucial support placed at 21,800. Breaking below this support decisively may further intensify selling pressure.\n\nSpeaking on the outlook for the Nifty 50 index, Vaishali Parekh said, the 50-stock index witnessed another day of free fall with heavy selling pressure to almost touch the previous low made near the 22,180 zone, and finally, amid some volatility, managed to close just above the 22,400 zone with the overall bias and sentiment shattered as of now.\n\n\u201cThe Nifty 50 index would have the crucial support near the 22200 zone and thereafter, has the major and important level near the 21800 zone, which needs to be sustained, failing which the overall trend would turn weak and can invite further intensified selling pressure. Some revival cannot be ruled out, but needs to sustain above the 23000 zone,\u201d said Parekh.\n\nRegarding stocks to buy on Monday, Vaishali Parekh recommended these three shares: CG Power, Graphite India , and Bectors Food.\n\n2] Graphite India: Buy at \u20b9 786 | Target \u20b9 825 | Stop Loss \u20b9 770; and\n\n3] Bectors Food: Buy at \u20b9 213 | Target \u20b9 227 | Stop Loss \u20b9 208.", "source": "LiveMint Markets", "pub_date_str": "02 Oct 2026, 07:23 PM IST", "pub_date_relative": "6m ago"}, {"title": "Drishyam 3 Box Office Collection Day 1: Ajay Devgn-Tabu Starrer Posts Strong Numbers \u2014 Check Earnings", "full_content": "Directed by Abhishek Pathak, Drishyam 3: The Conclusion is the third and final chapter of the Hindi Drishyam franchise.", "source": "NDTV Profit", "pub_date_str": "02 Oct 2026, 07:23 PM IST", "pub_date_relative": "7m ago"}, {"title": "Mandaadi Box Office Collection Day 22: Soori Starrer Nears Rs 100 Crore, Can Long Weekend Help?", "full_content": "Mandaadi is a Tamil-Telugu sports action drama written and directed by Mathimaran Pugazhendhi. Produced by Elred Kumar with Vetrimaaran as creative producer.", "source": "NDTV Profit", "pub_date_str": "02 Oct 2026, 07:18 PM IST", "pub_date_relative": "11m ago"}, {"title": "Treasury Sec. Bessent, IRS crack down on ETF strategy the wealthy are using to avoid capital gains taxes", "full_content": "One of the selling points of ETFs is that they can be highly tax-efficient for managing capital gains and losses, but wealthy investors may have to rethink certain ETF tax-deferral strategies following recent communications from the Internal Revenue Service and U.S. Treasury.\n\nAt issue are certain use cases of Section 351 exchanges , in which wealthy individuals, through an intermediary, create new ETFs with a basket of highly appreciated stocks. The intent is to defer capital gains taxes \u2014 which remains a legitimate strategy, but with additional qualifications, according to new guidance from tax authorities.\n\nTreasury Secretary Scott Bessent said in an X post earlier this week that the guidance, \"makes clear Treasury is serious about cracking down on transactions designed to dodge taxes or exploit our federal tax code.\"\n\nHe added of a companion IRS revenue ruling related to Section 351 ETF conversions designed to avoid tax, \"Our message on these conversions is clear: they don't work under existing law.\"\n\nThe combined effort covers instances that tax authorities find troubling, including when an ETF is \"merely a conduit\" for transferring securities in an attempt to avoid taxes. A revenue ruling is an official interpretation of a specific set of facts by the IRS, in relation to the tax code and regulations, useful for anticipating tax treatment by the agency. A notice, meanwhile, sets out more general guidance for broader circumstances.\n\nSection 351 of the tax code generally lets investors transfer property to a corporation in exchange for its stock without recognizing a capital gain, under certain conditions. For example, no one asset can exceed 25% of the portfolio's value, and the top five holdings cannot exceed 50% of the overall value, according to Kitces.com .", "source": "CNBC Top News", "pub_date_str": "02 Oct 2026, 07:18 PM IST", "pub_date_relative": "11m ago"}, {"title": "Proto Labs stock hits 52-week high at 98.51 USD", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Oct 2026, 07:18 PM IST", "pub_date_relative": "12m ago"}, {"title": "Karat Packaging Inc stock hits all-time high of 54.78 USD", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Oct 2026, 07:17 PM IST", "pub_date_relative": "13m ago"}, {"title": "US Jobs Report: September Payrolls Rise Just 29,000, Unemployment Rate Hits 4.2%", "full_content": "US payrolls rose just 29,000 in September against expectations of 90,000, while unemployment climbed to 4.2%, adding to concerns over the labour market outlook.", "source": "NDTV Profit", "pub_date_str": "02 Oct 2026, 07:16 PM IST", "pub_date_relative": "13m ago"}, {"title": "Labor market faltered in September as jobs increased by just 29,000, unemployment rate rose to 4.2%", "full_content": "The U.S. economy created far fewer jobs than expected in September, pointing to a surprising soft spot in the labor market and broader economy.\n\nNonfarm payrolls rose a seasonally adjusted 29,000 for the month while the unemployment rate increased to 4.2%, the Bureau of Labor Statistics reported Friday. Economists surveyed by Dow Jones had been looking for job growth of 84,000 and an unemployment rate of 4.1%.\n\nIn addition to the weakness in September, the August jobs count was revised lower to reflect a gain of 133,000 while July switched from a gain to a loss as payrolls fell by 10,000. The revisions in total showed 60,000 fewer jobs than previously reported.\n\nMarket reaction was swift to the report, with traders interpreting the soft jobs numbers as good news as they likely further cemented the Federal Reserve staying put at its October meeting.\n\nStock futures rose sharply after the release while Treasury yields slumped after recently rising to levels not seen since the early part of the century. Market-implied odds that the Fed will hold rates steady at its Oct. 27-28 meeting jumped to 82.8%, according to the CME Group's FedWatch tool.\n\n\"For the Fed, this number should be the nail in the coffin for an October hike,\" Thomas Simons, chief U.S. economist at Jefferies, said in a note.\n\n\"The payroll data surged in August, and we had expected the momentum to continue this month, given the historically low prints on jobless claims in recent weeks,\" he added. \"However, it now appears that the August number was nothing more than a rebound from very weak hiring in June and July.\"\n\nFed officials more closely watch the unemployment rate than the headline payrolls numbers.", "source": "CNBC Top News", "pub_date_str": "02 Oct 2026, 07:15 PM IST", "pub_date_relative": "14m ago"}, {"title": "My wife never went back to work after raising our kids. Do I have to share my retirement savings 50/50?", "full_content": "\u201cFor 14 years I have gotten up every morning and gone to work while she has been free to pursue whatever interested her.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "02 Oct 2026, 07:15 PM IST", "pub_date_relative": "15m ago"}, {"title": "Oxford Biomedica grants share options to chief operating officer", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Oct 2026, 07:14 PM IST", "pub_date_relative": "15m ago"}, {"title": "Nvidia stock hits all-time high of 236.57 USD", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Oct 2026, 07:14 PM IST", "pub_date_relative": "15m ago"}, {"title": "Nike shares tumble after weak revenue outlook and layoff plans underway", "full_content": "Nike shares dropped Friday, falling for a second straight day after the company reported declining revenue and plans to lay off staff in 2027.\n\nThe sportswear giant said Thursday that its fiscal first-quarter revenues were down 4% to $11.2 billion, citing declines in Greater China, which was partially offset by growth in its North America segment. Its net income was $712 million, down 2% from $727 million the previous year.\n\n\"We have more work to do in NIKE Sportswear, Jordan Brand and Greater China, and we're taking deliberate actions to strengthen those businesses the right way for the long term,\" Nike President and CEO Elliott Hill said in the release.\n\nNike expects revenues to decline in the high-single digits in 2027. Its shares were last down about 6% in morning trading on Friday and have declined nearly 45% since the beginning of the year.\n\nNike's shares since the beginning of the year. The company also announced its new operating model \"Pace,\" which is expected to deliver $2.5 billion in cost savings by 2031, with plans to lay off more staff starting in 2027.\n\n\"This work will result in fewer roles across Nike, and I want to acknowledge that news like this creates uncertainty. I don't take that lightly,\" Hill said in a separate announcement on Thursday. \"Decisions about impacted roles related to this work will begin in calendar year 2027 and beyond.\"\n\nThe program also includes efforts to modernize Nike's global supply chain, organizing into three geographies, establishing a new campus in India, and further streamlining the organization to reduce costs.\n\nNike has already carried out layoffs twice since the beginning of the year, including cutting 775 jobs across its U.S. distribution centers in January, and letting go of a further 1,400 employees primarily in its tech division in April.", "source": "CNBC Top News", "pub_date_str": "02 Oct 2026, 07:13 PM IST", "pub_date_relative": "16m ago"}, {"title": "Wall St opens higher as softer payrolls data, lower yields lift sentiment", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Oct 2026, 07:13 PM IST", "pub_date_relative": "16m ago"}, {"title": "Analysis-Nike\u2019s struggles test investor confidence in CEO Hill\u2019s turnaround effort", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Oct 2026, 07:12 PM IST", "pub_date_relative": "17m ago"}, {"title": "US Stock Market Today: Nasdaq Jumps 1%, Dow Up 300 Points As Yields Retreat After Weak Jobs Data", "full_content": "Nasdaq Composite advanced 1.24%, S&P 500 surged 0.82%, while Dow Jones Industrial Average rose 0.61%.", "source": "NDTV Profit", "pub_date_str": "02 Oct 2026, 07:12 PM IST", "pub_date_relative": "17m ago"}, {"title": "David Ellison says combined Paramount and Warner Bros. Discovery will be named Skydance", "full_content": "Paramount Skydance CEO David Ellison announced Friday that upon closing his company's merger with Warner Bros. Discovery next week, the combined entity will be named Skydance.\n\nIt's a full-circle moment for a company that has undergone two major acquisitions within the last 18 months.\n\n\"Paramount and Warner Bros. shaped over a century of culture,\" Ellison wrote in social media post Friday. \"By combining them, we aren't rewriting history \u2014 we're equipping these iconic studios with a more powerful engine. Together, we are Skydance: a creative-first home for bold, quality storytelling.\"\n\nEllison noted the new name allows the company to preserve Paramount and Warner Bros. as distinct studios. The merged company will trade under the new ticker \"SKYD.\"\n\n\"We never wanted a new corporate identity to diminish, alter or overshadow either one,\" he said. \"Instead, we wanted a name that would give the combined company an identity of its own while allowing Paramount and Warner Bros. \u2014 and all our extraordinary brands \u2014 to remain in the spotlight.\"\n\nThe Paramount and Warner Bros. studios together are set to release 35 films next year, according to data from Rentrak.\n\nIn August 2025, Ellison's Skydance \u2014 the production company behind \"Mission Impossible\" movies and \"Top Gun: Maverick\" \u2014 closed its acquisition of Paramount. Weeks later, the CEO set his sights on Warner Bros. Discovery in a takeover effort that would ultimately launch a bidding war .\n\nIn February, Paramount Skydance and Warner Bros. Discovery struck an agreement worth roughly $110 billion on an enterprise basis.", "source": "CNBC Top News", "pub_date_str": "02 Oct 2026, 07:10 PM IST", "pub_date_relative": "19m ago"}, {"title": "Coupang stock hits 52-week low at $13.37", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Oct 2026, 07:10 PM IST", "pub_date_relative": "20m ago"}, {"title": "PC Connection stock hits all-time high at 93.89 USD", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Oct 2026, 07:09 PM IST", "pub_date_relative": "20m ago"}, {"title": "Avengers Endgame: Encore Box Office Collection Day 7 \u2014 Marvel Re-Release Wraps First Week On A Steady Note", "full_content": "'Avengers: Endgame Encore' returned to Indian theatres on September 25, ahead of 'Avengers: Doomsday', with new footage linking the two films.", "source": "NDTV Profit", "pub_date_str": "02 Oct 2026, 07:09 PM IST", "pub_date_relative": "20m ago"}, {"title": "BMO raises Accenture stock price target on strong quarter results", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Oct 2026, 07:08 PM IST", "pub_date_relative": "21m ago"}, {"title": "India Vs Brazil: Marquinhos Says Brazil Are 'Very Happy' To Face Blue Tigers In Kolkata", "full_content": "The Brazil clash is part of India's historic international window, with the Blue Tigers facing three teams that featured at the 2026 FIFA World Cup.", "source": "NDTV Profit", "pub_date_str": "02 Oct 2026, 07:04 PM IST", "pub_date_relative": "26m ago"}, {"title": "The volunteer internet sleuths hunting down rogue AI agents - washingtonpost.com", "full_content": "The volunteer internet sleuths hunting down rogue AI agents washingtonpost.com OpenAI alerts more than 100 groups about rogue AI agent activity Reuters They\u2019re Known as Swarm Chasers\u2014and They Spring Into Action When AI Goes Rogue WSJ \u201cWe\u2019re not going to shoot ourselves in the foot\u201d over hack fallout, says OpenAI\u2019s chief research officer MIT Technology Review OpenAI says rogue agents may have affected more than 100 organizations qz.com", "source": "Google News Business", "pub_date_str": "02 Oct 2026, 07:03 PM IST", "pub_date_relative": "27m ago"}, {"title": "Oil prices fall on report of potential diesel, crude stock release; Brent back below $100", "full_content": "Oil prices were lower on Friday, extending losses from earlier in the session, following reports of a potential move to release additional diesel and crude stocks to ease a global supply shortage.\n\nBrent crude futures, international benchmark, with December expiry traded down 2.6% at $99.65 per barrel, while U.S. West Texas Intermediate futures with November expiry fell 4% to $89.11.\n\nIt comes shortly after Reuters reported that European Union member states were discussing a French proposal to release additional diesel reserves following pressure from the Trump administration .\n\nThe report, which cited a single unnamed source familiar with details of the discussion, said France had proposed that EU nations release 50 million barrels of diesel and International Energy Agency members release 50 million barrels of crude oil.\n\nCNBC could not independently verify the report. A spokesperson for the French government and the IEA were not immediately available to comment.\n\nThe EU is holding crisis talks on Friday to discuss a coordinated response to soaring diesel prices after U.S. Treasury Secretary Scott Bessent called on European countries to urgently release some of the continent's reserves.\n\nIn a post on social media, Bessent said Thursday that America's European partners \"should accelerate delivery on their existing commitments and make additional supplies immediately available to address ongoing disruptions.\"\n\nHe added: \"American farmers, truckers, and businesses should not be left carrying the burden of a global diesel shortage.\"", "source": "CNBC Top News", "pub_date_str": "02 Oct 2026, 07:00 PM IST", "pub_date_relative": "29m ago"}, {"title": "Three reasons this Wall Street market-making powerhouse says investors should reload on stocks right now", "full_content": "September provided a stock-market reset, pointing to a good end to the year, says Scott Rubner of Citadel Securities.", "source": "MarketWatch Top Stories", "pub_date_str": "02 Oct 2026, 07:00 PM IST", "pub_date_relative": "30m ago"}, {"title": "\u2018I have $400,000 in equity\u2019: I\u2019m 80. Should I sell my house because of dangerous stairs \u2014 or spend thousands renovating?", "full_content": "\u201cGenerally, the advice I\u2019ve read says not to sell because I have a low-interest-rate mortgage.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "02 Oct 2026, 07:00 PM IST", "pub_date_relative": "30m ago"}, {"title": "Tesla\u2019s EV sales beat Wall Street\u2019s expectations again, and the stock jumps", "full_content": "EV giant Tesla had the best three-month period for vehicle sales this year, but it was less than a year ago.", "source": "MarketWatch Top Stories", "pub_date_str": "02 Oct 2026, 07:00 PM IST", "pub_date_relative": "30m ago"}, {"title": "UAE Calls Flydubai Cockpit Attack A Terrorist Act', Hails Captain Smit Machchhar For Averting Disaster", "full_content": "A UAE official called the Flydubai cockpit attack a \"terrorist act\" as Captain Smit Machchhar recovered after helping passengers and crew regain control of the flight.", "source": "NDTV Profit", "pub_date_str": "02 Oct 2026, 06:59 PM IST", "pub_date_relative": "30m ago"}, {"title": "Traders now see little chance of a Fed rate hike in October after weak jobs report", "full_content": "Investors now think the odds are extremely unlikely that the Federal Reserve raises interest rates again in October, following a weaker-than-expected September employment report .\n\nCME's FedWatch tool, based on trading in 30-day interest rate futures, shows only a 17% chance that the Fed increases rates by a quarter percentage point. One week ago, odds were close to 36%. On prediction market platform Kalshi, chances for a hike in October stood at just 18%, down from almost 70% a week ago.\n\nThe U.S. economy added only 29,000 jobs in September, below estimates for a gain of more than 80,000. A softer labor market could recalibrate the Fed's thinking in how it balances its dual mandate to ensure full employment and steady prices, after it raised interest rates at its September meeting to combat inflation that's remained above target for five years .\n\nOdds for a hike in October also fell in the middle of this week after the release of the personal consumption expenditures price index , the Fed's preferred inflation gauge, on Wednesday showed cooler-than-expected prices. Core prices, excluding food and energy, rose 3% in August, lighter than consensus estimates for a rise of 3.3%.\n\n\"This report strengthens the case for the Federal Reserve to remain patient,\" said Adam Schickling, a senior economist at Vanguard. \"The labor market has not deteriorated sharply, but there is also little evidence that it has meaningfully strengthened, giving policymakers reason to wait for additional data.\"\n\nWhile traders now think a hike in October is unlikely, they're still forecasting that the central bank will raise rates in December.\n\nOn FedWatch, odds are above 75% for a hike in December, while on Kalshi there are 65% odds that the Fed raises rates.\n\nThe Federal Reserve is set to announce its next decision on interest rates at the conclusion of a two-day policy meeting on Oct. 28.", "source": "CNBC Finance", "pub_date_str": "02 Oct 2026, 06:59 PM IST", "pub_date_relative": "30m ago"}, {"title": "India Gives Official Names To 28 Geographical Features In Ladakh", "full_content": "The MHA has standardised names of 28 geographical features in Ladakh, including peaks, mountains, glaciers, valleys, rivers, lakes and water bodies.", "source": "NDTV Profit", "pub_date_str": "02 Oct 2026, 06:53 PM IST", "pub_date_relative": "37m ago"}, {"title": "Tesla reports 486,532 vehicle deliveries for third quarter, topping expectation", "full_content": "Tesla just reported vehicle deliveries and production for the third quarter. Shares of Elon Musk' s EV maker climbed about 2% following the news.\n\nDeliveries fell about 2% from 497,099 a year earlier, but climbed from the second quarter, when Tesla recorded 480,126 deliveries.\n\nAnalysts were expecting around 461,100 deliveries, according to StreetAccount's consensus. Tesla's company-compiled consensus , published Tuesday, was for 461,974 deliveries.\n\nTesla doesn't break out exact delivery numbers by individual model or region, but the company said its entry-level Model 3 sedan and most popular Model Y SUVs accounted for a vast majority, or 98% , of its deliveries.\n\nDeliveries are the closest approximation of sales reported by Tesla but are not precisely defined in its shareholder communications.\n\nMusk's automaker is under pressure due to surging competition from Chinese electric vehicle makers, such BYD and Xiaomi, which sell more affordable and innovative EVs. Tesla is trying to recover from consecutive annual declines in vehicle sales that were partly caused by a consumer backlash against Musk, the world's wealthiest person, and by the loss of a U.S. federal tax credit.\n\nThe Inflation Reduction Act, signed in 2022 by President Joe Biden, had made the EV tax break available through 2032. President Donald Trump's spending bill curtailed it ahead of schedule, ending the tax break after Sept. 30, 2025.\n\nTesla's stock is down 21% this year as of Tuesday's close, underperforming all of its megacap tech peers.", "source": "CNBC World Economy", "pub_date_str": "02 Oct 2026, 06:50 PM IST", "pub_date_relative": "39m ago"}, {"title": "Ford fends off Hyundai to retain No. 3 U.S. sales position in third quarter", "full_content": "DETROIT \u2014 Ford Motor retained its No. 3 U.S. sales position during the third quarter by a narrow margin over Hyundai Motor, which had been forecast to overtake the Detroit automaker.\n\nFord on Friday reported a year-over-year sales decline of 6.6% during the third quarter to 507,395 light-duty vehicles. That figure excludes its largest heavy-duty trucks, which are classified differently.\n\nThat compares to the South Korean automaker, including Hyundai, Kia and Genesis brands, reporting a 5.4% increase to 506,200 vehicles during the quarter.\n\nBoth companies performed better than expected. A forecast last week by Cox Automotive had called for Hyundai to overtake Ford in quarterly sales for the first time.\n\nHyundai, including its luxury Genesis brand and corporate sibling Kia, has been making major inroads in the U.S. this year. Ford, meanwhile, has struggled with production of its crucial F-Series pickup trucks after two supplier fires last year that disrupted production and sales.\n\nThis is breaking news. Please check back for additional updates.", "source": "CNBC Top News", "pub_date_str": "02 Oct 2026, 06:45 PM IST", "pub_date_relative": "45m ago"}, {"title": "Anthropic Warns US Government Actions Could Hurt Customer Ties Ahead Of IPO: Report", "full_content": "Anthropic said government actions could cause revenue losses, business disruptions and reputational harm, potentially affecting customers, partners, employees and investors.", "source": "NDTV Profit", "pub_date_str": "02 Oct 2026, 06:44 PM IST", "pub_date_relative": "45m ago"}, {"title": "Jim Cramer's top 10 things to watch in the stock market Friday", "full_content": "The September jobs report was exactly what stock market bulls needed.", "source": "CNBC Top News", "pub_date_str": "02 Oct 2026, 06:43 PM IST", "pub_date_relative": "46m ago"}, {"title": "Tesla Is Winning the New EV Race. Here\u2019s How. - Barron's", "full_content": "Tesla Is Winning the New EV Race. Here\u2019s How. Barron's Tesla reports 486,532 vehicle deliveries for third quarter, topping expectation cnbc.com Tesla Sales Fell in Third Quarter WSJ Tesla stock rises as company reports Q3 deliveries that top analyst estimates Yahoo Finance Tesla\u2019s recovery hits a speed bump The Verge", "source": "Google News Business", "pub_date_str": "02 Oct 2026, 06:43 PM IST", "pub_date_relative": "47m ago"}, {"title": "HDFC Bank ADRs Extend Rally, Jump 3% Pre-Market After Anup Bagchi Named MD & CEO", "full_content": "HDFC Bank ADRs extended gains, rose nearly 3% before the opening bell on Friday.", "source": "NDTV Profit", "pub_date_str": "02 Oct 2026, 06:37 PM IST", "pub_date_relative": "52m ago"}, {"title": "India Clinch Asian Games 2026 Women's Hockey Gold With 1-0 Win Over China", "full_content": "With this gold medal, the Indian women's hockey team have ended a 44-year-long wait for the bility features of the digital euro app, the design of which will go beyond the requirements set out in the European Accessibility Act , and announcing that the ECB would start usability and accessibility testing as part of the digital euro pilot in 2027. The press release, together with the related underlying documentation, is available on the ECB\u2019s website.\n\nOn 15 September 2026 the ECB issued a call for expression of interest inviting e-commerce and mobile commerce (m-commerce) merchants operating in the euro area to take part in the digital euro pilot . The deadline to submit applications is 27 October 2026.\n\nFinally, on 28 September 2026 the ECB issued another call for expression of interest inviting private companies and organisations to collaborate in exploring how the digital euro infrastructure could support them in their innovation efforts. More detailed information is available in the related announcement published on the ECB\u2019s website. The deadline to submit applications is 9 November 2026.\n\nStrong participation in the ECB survey on the future design of the euro banknotes\n\nOn 23 September 2026 the ECB issued a press release reporting that almost ten million people across Europe and beyond had completed the ECB survey on the future design of euro banknotes, which ran between 23 July and 21 September 2026. This level of participation, equal to 2.6% of the euro area population, is unprecedented for such a survey. The press release also outlined the next steps in the process. More information on the future banknotes, the shortlisted proposals and the selection process is available on the ECB\u2019s website.\n\nAmendments to legal acts on the implementation of the Eurosystem monetary policy framework\n\nOn 22 September 2026 the Governing Council adopted amendments to the legal acts implementing the Eurosystem monetary policy framework.", "source": "ECB Press", "pub_date_str": "02 Oct 2026, 06:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "Why Western Digital and Seagate are seeing big stock drops today", "full_content": "Investors are worried that Toshiba will boost its production of a key AI storage product, potentially hurting the strong pricing power that Western Digital and Seagate currently enjoy.", "source": "MarketWatch Top Stories", "pub_date_str": "02 Oct 2026, 06:28 PM IST", "pub_date_relative": "1h ago"}, {"title": "RBI Appoints Sudhakar Malli As Executive Director", "full_content": "RBI has appointed Sudhakar Malli as Executive Director with effect from October 1, 2026.", "source": "NDTV Profit", "pub_date_str": "02 Oct 2026, 06:27 PM IST", "pub_date_relative": "1h ago"}, {"title": "I\u2019m even more bullish about stocks than a year ago", "full_content": "Then again, I\u2019d sold everything by the end of last October, so don\u2019t listen to me", "source": "FT Markets", "pub_date_str": "02 Oct 2026, 06:22 PM IST", "pub_date_relative": "1h ago"}, {"title": "Global Food Prices Hit Nearly Four-Year High In September Amid Supply Disruptions: UN FAO", "full_content": "Global food prices rose to their highest level since November 2022 in September, driven by sugar, cereals, weather risks and disruptions to Black Sea trade.", "source": "NDTV Profit", "pub_date_str": "02 Oct 2026, 06:21 PM IST", "pub_date_relative": "1h ago"}, {"title": "Nike Plans Job Cuts As Revenue Falls 4% To $11.2 Billion", "full_content": "Nike expects full-year fiscal 2027 sales to fall by high-single digits after quarterly revenue dropped 4% to $11.2 billion and profit fell 2% to $712 million.", "source": "NDTV Profit", "pub_date_str": "02 Oct 2026, 06:20 PM IST", "pub_date_relative": "1h ago"}, {"title": "Nike\u2019s stock heads for its worst year ever as the company\u2019s troubles mount", "full_content": "The company has faced struggles in China and in its sneaker business.", "source": "MarketWatch Top Stories", "pub_date_str": "02 Oct 2026, 06:20 PM IST", "pub_date_relative": "1h ago"}, {"title": "ICICI Life Insurance Names Siddhartha Mishra MD & CEO As Anup Bagchi Steps Down", "full_content": "ICICI Life Insurance has appointed Siddhartha Mishra as Managing Director and CEO.", "source": "NDTV Profit", "pub_date_str": "02 Oct 2026, 06:19 PM IST", "pub_date_relative": "1h ago"}, {"title": "YouTube sports strategy targets more live rights -- but not necessarily events", "full_content": "The CNBC Sport newsletter with Alex Sherman brings you the biggest news and exclusive interviews from the worlds of sports business and media, delivered weekly to your inbox.\n\nYouTube would like as many games as it can get its hands on \u2013 while also giving users as \"clean\" of an experience as possible, according to people familiar with the matter.\n\nYouTube has been coy with its sports strategy, acquiring the rights to one NFL game last year for its free, ad-supported platform and buying \"NFL Sunday Ticket\" rights until the end of the 2029-30 season. Beyond those two moves, YouTube has largely been quiet.\n\nStill, YouTube is an interested buyer in live sports for almost all of the major U.S. sports leagues if it can get bespoke rights that present an easy consumer message, such as all local games or all games in a tournament, said the people, who asked not to be named because the company's plans are private.\n\nYouTube's strategy is distinct from Netflix's \u2014 an interesting contrast between the two largest streaming services in the world by users. While Netflix wants individual games or tournaments that it can turn into mini-events, YouTube is more likely to buy games in bulk if there's a clear consumer proposition underlying the rights. In other words, YouTube isn't interested in a swath of games if there's no obvious connection to them.\n\nSports Business Journal reported earlier this year that YouTube is in advanced talks to be the NBA's new regional sports network solution, buying the rights for 20 to 25 teams for a price tag of potentially more than $1 billion. YouTube is interested in the FIFA Men's World Cup rights, as CNBC first reported in July.\n\nYouTube is still wrestling with the feasibility of this idea if it can't get all of the teams, said the people. YouTube ideally wants both in-market and out-of-market games, the people said.", "source": "CNBC Top News", "pub_date_str": "02 Oct 2026, 06:19 PM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "Vaishali Parekh's top 3 stocks to buy: CG Power, Graphite India, Bectors Food | Target, stop-loss, market outlook", "full_content": "Vaishali Parekh's top 3 stocks to buy: In the truncated trading week, the benchmark indices corrected sharply. The Nifty 50 index ended down by 3.10%, while the Sensex fell nearly 2000 points. Among the sectors, almost all major sectoral indices saw profit-booking at higher levels. The Consumer and Auto indices lost the most: Consumer stocks corrected 6.15%, and Auto stocks fell 5.85%.\n\nThe market consistently faced selling pressure at higher levels during the week. On the weekly charts, it formed a long bearish candle. On the intraday charts, it continued to make lower highs and lower lows, indicating a largely negative trend.\n\nVaishali Parekh, Vice President \u2014 Technical Research at Prabhudas Lilladher, believes the Indian stock market bias has weakened after the crash across all four sessions last week. The Prabhudas Lilladher expert said the Nifty 50 index has crucial support placed at 21,800. Breaking below this support decisively may further intensify selling pressure.\n\nSpeaking on the outlook for the Nifty 50 index, Vaishali Parekh said, the 50-stock index witnessed another day of free fall with heavy selling pressure to almost touch the previous low made near the 22,180 zone, and finally, amid some volatility, managed to close just above the 22,400 zone with the overall bias and sentiment shattered as of now.\n\n\u201cThe Nifty 50 index would have the crucial support near the 22200 zone and thereafter, has the major and important level near the 21800 zone, which needs to be sustained, failing which the overall trend would turn weak and can invite further intensified selling pressure. Some revival cannot be ruled out, but needs to sustain above the 23000 zone,\u201d said Parekh.\n\nRegarding stocks to buy on Monday, Vaishali Parekh recommended these three shares: CG Power, Graphite India , and Bectors Food.\n\n2] Graphite India: Buy at \u20b9 786 | Target \u20b9 825 | Stop Loss \u20b9 770; and\n\n3] Bectors Food: Buy at \u20b9 213 | Target \u20b9 227 | Stop Loss \u20b9 208.", "source": "LiveMint Markets", "pub_date_str": "02 Oct 2026, 07:23 PM IST", "pub_date_relative": "6m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Drishyam 3 Box Office Collection Day 1: Ajay Devgn-Tabu Starrer Posts Strong Numbers \u2014 Check Earnings", "full_content": "Directed by Abhishek Pathak, Drishyam 3: The Conclusion is the third and final chapter of the Hindi Drishyam franchise.", "source": "NDTV Profit", "pub_date_str": "02 Oct 2026, 07:23 PM IST", "pub_date_relative": "7m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Treasury Sec. Bessent, IRS crack down on ETF strategy the wealthy are using to avoid capital gains taxes", "full_content": "One of the selling points of ETFs is that they can be highly tax-efficient for managing capital gains and losses, but wealthy investors may have to rethink certain ETF tax-deferral strategies following recent communications from the Internal Revenue Service and U.S. Treasury.\n\nAt issue are certain use cases of Section 351 exchanges , in which wealthy individuals, through an intermediary, create new ETFs with a basket of highly appreciated stocks. The intent is to defer capital gains taxes \u2014 which remains a legitimate strategy, but with additional qualifications, according to new guidance from tax authorities.\n\nTreasury Secretary Scott Bessent said in an X post earlier this week that the guidance, \"makes clear Treasury is serious about cracking down on transactions designed to dodge taxes or exploit our federal tax code.\"\n\nHe added of a companion IRS revenue ruling related to Section 351 ETF conversions designed to avoid tax, \"Our message on these conversions is clear: they don't work under existing law.\"\n\nThe combined effort covers instances that tax authorities find troubling, including when an ETF is \"merely a conduit\" for transferring securities in an attempt to avoid taxes. A revenue ruling is an official interpretation of a specific set of facts by the IRS, in relation to the tax code and regulations, useful for anticipating tax treatment by the agency. A notice, meanwhile, sets out more general guidance for broader circumstances.\n\nSection 351 of the tax code generally lets investors transfer property to a corporation in exchange for its stock without recognizing a capital gain, under certain conditions. For example, no one asset can exceed 25% of the portfolio's value, and the top five holdings cannot exceed 50% of the overall value, according to Kitces.com .", "source": "CNBC Top News", "pub_date_str": "02 Oct 2026, 07:18 PM IST", "pub_date_relative": "11m ago", "cfa_topics": ["Financial Statement Analysis", "Fixed Income", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "US Jobs Report: September Payrolls Rise Just 29,000, Unemployment Rate Hits 4.2%", "full_content": "US payrolls rose just 29,000 in September against expectations of 90,000, while unemployment climbed to 4.2%, adding to concerns over the labour market outlook.", "source": "NDTV Profit", "pub_date_str": "02 Oct 2026, 07:16 PM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Labor market faltered in September as jobs increased by just 29,000, unemployment rate rose to 4.2%", "full_content": "The U.S. economy created far fewer jobs than expected in September, pointing to a surprising soft spot in the labor market and broader economy.\n\nNonfarm payrolls rose a seasonally adjusted 29,000 for the month while the unemployment rate increased to 4.2%, the Bureau of Labor Statistics reported Friday. Economists surveyed by Dow Jones had been looking for job growth of 84,000 and an unemployment rate of 4.1%.\n\nIn addition to the weakness in September, the August jobs count was revised lower to reflect a gain of 133,000 while July switched from a gain to a loss as payrolls fell by 10,000. The revisions in total showed 60,000 fewer jobs than previously reported.\n\nMarket reaction was swift to the report, with traders interpreting the soft jobs numbers as good news as they likely further cemented the Federal Reserve staying put at its October meeting.\n\nStock futures rose sharply after the release while Treasury yields slumped after recently rising to levels not seen since the early part of the century. Market-implied odds that the Fed will hold rates steady at its Oct. 27-28 meeting jumped to 82.8%, according to the CME Group's FedWatch tool.\n\n\"For the Fed, this number should be the nail in the coffin for an October hike,\" Thomas Simons, chief U.S. economist at Jefferies, said in a note.\n\n\"The payroll data surged in August, and we had expected the momentum to continue this month, given the historically low prints on jobless claims in recent weeks,\" he added. \"However, it now appears that the August number was nothing more than a rebound from very weak hiring in June and July.\"\n\nFed officials more closely watch the unemployment rate than the headline payrolls numbers.", "source": "CNBC Top News", "pub_date_str": "02 Oct 2026, 07:15 PM IST", "pub_date_relative": "14m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Fixed Income", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Oxford Biomedica grants share options to chief operating officer", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Oct 2026, 07:14 PM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Nike shares tumble after weak revenue outlook and layoff plans underway", "full_content": "Nike shares dropped Friday, falling for a second straight day after the company reported declining revenue and plans to lay off staff in 2027.\n\nThe sportswear giant said Thursday that its fiscal first-quarter revenues were down 4% to $11.2 billion, citing declines in Greater China, which was partially offset by growth in its North America segment. Its net income was $712 million, down 2% from $727 million the previous year.\n\n\"We have more work to do in NIKE Sportswear, Jordan Brand and Greater China, and we're taking deliberate actions to strengthen those businesses the right way for the long term,\" Nike President and CEO Elliott Hill said in the release.\n\nNike expects revenues to decline in the high-single digits in 2027. Its shares were last down about 6% in morning trading on Friday and have declined nearly 45% since the beginning of the year.\n\nNike's shares since the beginning of the year. The company also announced its new operating model \"Pace,\" which is expected to deliver $2.5 billion in cost savings by 2031, with plans to lay off more staff starting in 2027.\n\n\"This work will result in fewer roles across Nike, and I want to acknowledge that news like this creates uncertainty. I don't take that lightly,\" Hill said in a separate announcement on Thursday. \"Decisions about impacted roles related to this work will begin in calendar year 2027 and beyond.\"\n\nThe program also includes efforts to modernize Nike's global supply chain, organizing into three geographies, establishing a new campus in India, and further streamlining the organization to reduce costs.\n\nNike has already carried out layoffs twice since the beginning of the year, including cutting 775 jobs across its U.S. distribution centers in January, and letting go of a further 1,400 employees primarily in its tech division in April.", "source": "CNBC Top News", "pub_date_str": "02 Oct 2026, 07:13 PM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "US Stock Market Today: Nasdaq Jumps 1%, Dow Up 300 Points As Yields Retreat After Weak Jobs Data", "full_content": "Nasdaq Composite advanced 1.24%, S&P 500 surged 0.82%, while Dow Jones Industrial Average rose 0.61%.", "source": "NDTV Profit", "pub_date_str": "02 Oct 2026, 07:12 PM IST", "pub_date_relative": "17m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "David Ellison says combined Paramount and Warner Bros. Discovery will be named Skydance", "full_content": "Paramount Skydance CEO David Ellison announced Friday that upon closing his company's merger with Warner Bros. Discovery next week, the combined entity will be named Skydance.\n\nIt's a full-circle moment for a company that has undergone two major acquisitions within the last 18 months.\n\n\"Paramount and Warner Bros. shaped over a century of culture,\" Ellison wrote in social media post Friday. \"By combining them, we aren't rewriting history \u2014 we're equipping these iconic studios with a more powerful engine. Together, we are Skydance: a creative-first home for bold, quality storytelling.\"\n\nEllison noted the new name allows the company to preserve Paramount and Warner Bros. as distinct studios. The merged company will trade under the new ticker \"SKYD.\"\n\n\"We never wanted a new corporate identity to diminish, alter or overshadow either one,\" he said. \"Instead, we wanted a name that would give the combined company an identity of its own while allowing Paramount and Warner Bros. \u2014 and all our extraordinary brands \u2014 to remain in the spotlight.\"\n\nThe Paramount and Warner Bros. studios together are set to release 35 films next year, according to data from Rentrak.\n\nIn August 2025, Ellison's Skydance \u2014 the production company behind \"Mission Impossible\" movies and \"Top Gun: Maverick\" \u2014 closed its acquisition of Paramount. Weeks later, the CEO set his sights on Warner Bros. Discovery in a takeover effort that would ultimately launch a bidding war .\n\nIn February, Paramount Skydance and Warner Bros. Discovery struck an agreement worth roughly $110 billion on an enterprise basis.", "source": "CNBC Top News", "pub_date_str": "02 Oct 2026, 07:10 PM IST", "pub_date_relative": "19m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Oil prices fall on report of potential diesel, crude stock release; Brent back below $100", "full_content": "Oil prices were lower on Friday, extending losses from earlier in the session, following reports of a potential move to release additional diesel and crude stocks to ease a global supply shortage.\n\nBrent crude futures, international benchmark, with December expiry traded down 2.6% at $99.65 per barrel, while U.S. West Texas Intermediate futures with November expiry fell 4% to $89.11.\n\nIt comes shortly after Reuters reported that European Union member states were discussing a French proposal to release additional diesel reserves following pressure from the Trump administration .\n\nThe report, which cited a single unnamed source familiar with details of the discussion, said France had proposed that EU nations release 50 million barrels of diesel and International Energy Agency members release 50 million barrels of crude oil.\n\nCNBC could not independently verify the report. A spokesperson for the French government and the IEA were not immediately available to comment.\n\nThe EU is holding crisis talks on Friday to discuss a coordinated response to soaring diesel prices after U.S. Treasury Secretary Scott Bessent called on European countries to urgently release some of the continent's reserves.\n\nIn a post on social media, Bessent said Thursday that America's European partners \"should accelerate delivery on their existing commitments and make additional supplies immediately available to address ongoing disruptions.\"\n\nHe added: \"American farmers, truckers, and businesses should not be left carrying the burden of a global diesel shortage.\"", "source": "CNBC Top News", "pub_date_str": "02 Oct 2026, 07:00 PM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Fixed Income", "Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Traders now see little chance of a Fed rate hike in October after weak jobs report", "full_content": "Investors now think the odds are extremely unlikely that the Federal Reserve raises interest rates again in October, following a weaker-than-expected September employment report .\n\nCME's FedWatch tool, based on trading in 30-day interest rate futures, shows only a 17% chance that the Fed increases rates by a quarter percentage point. One week ago, odds were close to 36%. On prediction market platform Kalshi, chances for a hike in October stood at just 18%, down from almost 70% a week ago.\n\nThe U.S. economy added only 29,000 jobs in September, below estimates for a gain of more than 80,000. A softer labor market could recalibrate the Fed's thinking in how it balances its dual mandate to ensure full employment and steady prices, after it raised interest rates at its September meeting to combat inflation that's remained above target for five years .\n\nOdds for a hike in October also fell in the middle of this week after the release of the personal consumption expenditures price index , the Fed's preferred inflation gauge, on Wednesday showed cooler-than-expected prices. Core prices, excluding food and energy, rose 3% in August, lighter than consensus estimates for a rise of 3.3%.\n\n\"This report strengthens the case for the Federal Reserve to remain patient,\" said Adam Schickling, a senior economist at Vanguard. \"The labor market has not deteriorated sharply, but there is also little evidence that it has meaningfully strengthened, giving policymakers reason to wait for additional data.\"\n\nWhile traders now think a hike in October is unlikely, they're still forecasting that the central bank will raise rates in December.\n\nOn FedWatch, odds are above 75% for a hike in December, while on Kalshi there are 65% odds that the Fed raises rates.\n\nThe Federal Reserve is set to announce its next decision on interest rates at the conclusion of a two-day policy meeting on Oct. 28.", "source": "CNBC Finance", "pub_date_str": "02 Oct 2026, 06:59 PM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Economics", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Tesla reports 486,532 vehicle deliveries for third quarter, topping expectation", "full_content": "Tesla just reported vehicle deliveries and production for the third quarter. Shares of Elon Musk' s EV maker climbed about 2% following the news.\n\nDeliveries fell about 2% from 497,099 a year earlier, but climbed from the second quarter, when Tesla recorded 480,126 deliveries.\n\nAnalysts were expecting around 461,100 deliveries, according to StreetAccount's consensus. Tesla's company-compiled consensus , published Tuesday, was for 461,974 deliveries.\n\nTesla doesn't break out exact delivery numbers by individual model or region, but the company said its entry-level Model 3 sedan and most popular Model Y SUVs accounted for a vast majority, or 98% , of its deliveries.\n\nDeliveries are the closest approximation of sales reported by Tesla but are not precisely defined in its shareholder communications.\n\nMusk's automaker is under pressure due to surging competition from Chinese electric vehicle makers, such BYD and Xiaomi, which sell more affordable and innovative EVs. Tesla is trying to recover from consecutive annual declines in vehicle sales that were partly caused by a consumer backlash against Musk, the world's wealthiest person, and by the loss of a U.S. federal tax credit.\n\nThe Inflation Reduction Act, signed in 2022 by President Joe Biden, had made the EV tax break available through 2032. President Donald Trump's spending bill curtailed it ahead of schedule, ending the tax break after Sept. 30, 2025.\n\nTesla's stock is down 21% this year as of Tuesday's close, underperforming all of its megacap tech peers.", "source": "CNBC World Economy", "pub_date_str": "02 Oct 2026, 06:50 PM IST", "pub_date_relative": "39m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Anthropic Warns US Government Actions Could Hurt Customer Ties Ahead Of IPO: Report", "full_content": "Anthropic said government actions could cause revenue losses, business disruptions and reputational harm, potentially affecting customers, partners, employees and investors.", "source": "NDTV Profit", "pub_date_str": "02 Oct 2026, 06:44 PM IST", "pub_date_relative": "45m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Jim Cramer's top 10 things to watch in the stock market Friday", "full_content": "The September jobs report was exactly what stock market bulls needed.", "source": "CNBC Top News", "pub_date_str": "02 Oct 2026, 06:43 PM IST", "pub_date_relative": "46m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "India Clinch Asian Games 2026 Women's Hockey Gold With 1-0 Win Over China", "full_content": "With this gold medal, the Indian women's hockey team have ended a 44-year-long wait for the Asian Games Gold medal.", "source": "NDTV Profit", "pub_date_str": "02 Oct 2026, 06:36 PM IST", "pub_date_relative": "53m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Investors seek refuge from bond rout in haven German debt", "full_content": "Bund yields have fallen this week even as US, French and other governments\u2019 bonds have sold off sharply over inflation fears", "source": "FT Markets", "pub_date_str": "02 Oct 2026, 06:33 PM IST", "pub_date_relative": "57m ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Dow jumps 400 points after weak jobs data sends yields tumbling: Live updates - cnbc.com", "full_content": "Dow jumps 400 points after weak jobs data sends yields tumbling: Live updates cnbc.com US stocks rise toward their record after the latest jobs report calms the rattled bond market Pioneer Press Stock market today: Dow, S&P 500, Nasdaq jump as traders pare Fed rate-hike bets after September jobs miss Yahoo Finance Jobs Report Today: Dow Opens Higher, Yields Fall as Hiring Softens \u2014 Live Updates WSJ Stocks Roar Back in Face of Bond Yield Retreat Barron's", "source": "Google News Business", "pub_date_str": "02 Oct 2026, 06:33 PM IST", "pub_date_relative": "57m ago", "cfa_topics": ["Equity Investments", "Fixed Income"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Decisions taken by the Governing Council of the ECB (in addition to decisions setting interest rates)", "full_content": "On 30 July 2026 the ECB issued a press release outlining the accessibility features of the digital euro app, the design of which will go beyond the requirements set out in the European Accessibility Act , and announcing that the ECB would start usability and accessibility testing as part of the digital euro pilot in 2027. The press release, together with the related underlying documentation, is available on the ECB\u2019s website.\n\nOn 15 September 2026 the ECB issued a call for expression of interest inviting e-commerce and mobile commerce (m-commerce) merchants operating in the euro area to take part in the digital euro pilot . The deadline to submit applications is 27 October 2026.\n\nFinally, on 28 September 2026 the ECB issued another call for expression of interest inviting private companies and organisations to collaborate in exploring how the digital euro infrastructure could support them in their innovation efforts. More detailed information is available in the related announcement published on the ECB\u2019s website. The deadline to submit applications is 9 November 2026.\n\nStrong participation in the ECB survey on the future design of the euro banknotes\n\nOn 23 September 2026 the ECB issued a press release reporting that almost ten million people across Europe and beyond had completed the ECB survey on the future design of euro banknotes, which ran between 23 July and 21 September 2026. This level of participation, equal to 2.6% of the euro area population, is unprecedented for such a survey. The press release also outlined the next steps in the process. More information on the future banknotes, the shortlisted proposals and the selection process is available on the ECB\u2019s website.\n\nAmendments to legal acts on the implementation of the Eurosystem monetary policy framework\n\nOn 22 September 2026 the Governing Council adopted amendments to the legal acts implementing the Eurosystem monetary policy framework.", "source": "ECB Press", "pub_date_str": "02 Oct 2026, 06:30 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Nike Plans Job Cuts As Revenue Falls 4% To $11.2 Billion", "full_content": "Nike expects full-year fiscal 2027 sales to fall by high-single digits after quarterly revenue dropped 4% to $11.2 billion and profit fell 2% to $712 million.", "source": "NDTV Profit", "pub_date_str": "02 Oct 2026, 06:20 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Experts' view: Why would bears cheer Nifty's breakdown below 22,000?", "full_content": "After a successive stock market crash on all four sessions last week, the Nifty 50 index slipped from the 23,140 to 22,421 level, logging a weekly loss of 719 points or 3.10% weekly loss. Market experts believe persistent foreign selling, a weaker Indian Rupee and rising global bond yields outweighed the support from softer crude prices.\n\nSpeaking on the Indian stock market sell-off, Shrikant Chouhan, Head Equity Research at Kotak Securities, said, \u201cThe market consistently faced selling pressure at higher levels during the week. On the weekly charts, it formed a long bearish candle. On the intraday charts, it continued to make lower highs and lower lows, indicating a largely negative trend. We believe the market\u2019s short-term texture is weak but oversold. Therefore, the possibility of a pullback rally from current levels cannot be ruled out.\u201d\n\nThe Koak Securities expert said the relief rally may push the Nifty 50 index up to 22,500 levels.\n\nExpecting the relief rally to be a short-lived affair on Dalal Street, Avinash Gorakshkar, Founder of Avinash Mentor Research, said, \u201cThe market is estimating at least a 25 BPS rate hike in the RBI MPC meeting outcome next week. However, the Central Bank of India may surprise the market by announcing more hike in the key rates because this is for the first time when there is no commentary from the Government of India (GoI) despite successive selling on Dalal Street.\u201d\n\nGorakshkar said that if the RBI announces a more than 25 BPS key rate hike, we can expect the Nifty 50 index to break below 22,000 on a closing basis.\n\n\u201cThe recent stock market crash can be seen as market discounting the 25 BPS rate hike coming in the RBI MPC meeting. However, the market would wait for the outcome of the US Fed meeting expected at the end of October 2026.", "source": "LiveMint Markets", "pub_date_str": "02 Oct 2026, 06:06 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Big Pharma\u2019s China deal spree grows with latest tie-up worth up to $7.8 billion", "full_content": "Novartis has signed a deal worth up to $7.8 billion, in the latest of a flurry of tie-ups between Big Pharma and Chinese biotechs.\n\nThe Swiss pharma major is entering a licensing agreement with China-based Abogen Biosciences for its lead asset, an early-stage experimental treatment for autoimmune disease, Abogen said in a statement on Friday.\n\nChina offers Western biopharma companies hopes of finding their next blockbuster drug, as patents on top-selling drugs, which generate hundreds of billions in sales, face a \"patent cliff\" in the early 2030s.\n\nNovartis' normally stable shares fell last month by the most since 1987 following several clinical trial setbacks , raising questions about its ability to develop and source new drugs to offset the looming patent expirations.\n\nAs part of its Abogen deal, the company will pay $575 million upfront for the global rights to the Chinese company's messenger RNA therapy, with an additional $7.2 billion in milestone payments. It will also have the exclusive option to license Abogen's assets developed on its RNA platform.\n\nLicensing deals have emerged as the preferred way for Western drugmakers tapping Chinese science, allowing them to buy the rights to experimental medicines without acquiring the companies that developed them.\n\nSidley partner Ruchun Ji told CNBC that such agreements can reduce risk for Big Pharma because licenses can be terminated if a drug disappoints or development priorities change. For Chinese biotechs, meanwhile, upfront and milestone payments provide a source of funding while allowing them to continue developing drugs in their home market.\n\n\"The speed of innovation, speed of clinical trials in China is really, really fast,\" Ji said, attributing the development largely to regulatory reform by China's drug regulator NMPA, which has \"totally overhauled the systems over the last couple of years.\"", "source": "CNBC Top News", "pub_date_str": "02 Oct 2026, 06:01 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Western Digital, Seagate Stock Slide On AI Hard-Drive Competition Report - Investor's Business Daily", "full_content": "Western Digital, Seagate Stock Slide On AI Hard-Drive Competition Report Investor's Business Daily Toshiba to double hard disk drive supply to fill AI chip memory gap Nikkei Asia Seagate Tumbles 10%, Western Digital Drops 7% as Toshiba Moves to Double Hard Disk Output Yahoo Finance Seagate and Western Digital shares fall on Toshiba HDD expansion Investing.com Seagate, Western Digital dive amid report that Toshiba aims to boost hard disk drive supply (STX:NASDAQ) Seeking Alpha", "source": "Google News Business", "pub_date_str": "02 Oct 2026, 06:01 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "United Airlines gets aggressive in battle for top Delta, American flyers", "full_content": "The carrier is in the middle of an unusually pointed status-match campaign to woo travelers who have earned a spot in elite frequent flyer tiers with Delta Air Lines and American Airlines by offering similar treatment at United.\n\nHere's how the latest one it works: Travelers with any tier of elite status on Delta or American will be granted United status for 90 days.\n\nTo keep it through Jan. 31, 2028, they'll have to take a flight and spend a certain amount on United mainline or regional flights within those 90 days.\n\nFor example, if a traveler has the lowest level Delta Medallion status, silver, or the same on American, which is gold, they would have to spend $1,500 on United in the roughly three months.\n\nTo get a status match of United's 1K, its highest level before invitation-only Global Services, the person would have to spend $7,000.\n\nAirlines have been adding new lounges, extra premium seats and more international routes to lure those high-spenders. Faster in-flight Wi-Fi is the new front.\n\nDelta and American have their own status matches for a host of other airlines, but United's call-out of rivals and social media campaign shows how heated the battle for big-spending customers has become, said Henry Harteveldt, founder of travel consulting firm Atmosphere Research Group.\n\n\"This is war, airline style,\" he said. \"It's very rare for an airline to be as blatant as United is being\" with Delta and American.", "source": "CNBC World Economy", "pub_date_str": "02 Oct 2026, 06:00 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Derivatives", "Alternative Investments"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "US sanctions Kremlin-backed fintech A7 for allegedly assisting Iran", "full_content": "Payments group that moved almost $7bn through global banks is designated a transnational criminal organisation", "source": "FT Markets", "pub_date_str": "02 Oct 2026, 05:49 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "EXCLUSIVE: Europe weighs new diesel stocks release after US pressure, sources say - Reuters", "full_content": "EXCLUSIVE: Europe weighs new diesel stocks release after US pressure, sources say Reuters Oil prices fall over 3% on report of potential diesel, crude stock release; Brent back below $100 cnbc.com G7 leaders hold talks after US pressures EU on fuel reserves and diesel ban Le Monde.fr Iran war live: EU rejects Trump\u2019s diesel demand amid Iran war shortages Al Jazeera US pressures Europe to release diesel reserves \u2018immediately\u2019 to tame prices CNN", "source": "Google News Business", "pub_date_str": "02 Oct 2026, 05:44 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Dow Jones| Nasdaq | US Stock Market Today | Live: Nasdaq surges over 1% as softer payrolls data, lower yields lift sentiment", tories": 366};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
