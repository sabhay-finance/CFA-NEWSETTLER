<script>
    // This variable will be injected during the build process
    const allData = {"general": [{"title": "David Ellison says combined Paramount and Warner Bros. Discovery will be named Skydance", "full_content": "Paramount Skydance CEO David Ellison announced Friday that upon closing his company's merger with Warner Bros. Discovery next week, the combined entity will be named Skydance.\n\nIt's a full-circle moment for a company that has undergone two major acquisitions within the last 18 months.\n\n\"Paramount and Warner Bros. shaped over a century of culture,\" Ellison wrote in social media post Friday. \"By combining them, we aren't rewriting history \u2014 we're equipping these iconic studios with a more powerful engine. Together, we are Skydance: a creative-first home for bold, quality storytelling.\"\n\nEllison noted the new name allows the company to preserve Paramount and Warner Bros. as distinct studios. The merged company will trade under the new ticker \"SKYD.\"\n\n\"We never wanted a new corporate identity to diminish, alter or overshadow either one,\" he said. \"Instead, we wanted a name that would give the combined company an identity of its own while allowing Paramount and Warner Bros. \u2014 and all our extraordinary brands \u2014 to remain in the spotlight.\"\n\nThe Paramount and Warner Bros. studios together are set to release 35 films next year, according to data from Rentrak.\n\nIn August 2025, Ellison's Skydance \u2014 the production company behind the Mission: Impossible movies and \"Top Gun: Maverick\" \u2014 closed its acquisition of Paramount. Weeks later, the CEO set his sights on Warner Bros. Discovery in a takeover effort that would ultimately spark a bidding war .\n\nIn February, Paramount Skydance and Warner Bros. Discovery struck an agreement worth roughly $110 billion on an enterprise basis.", "source": "CNBC Top News", "pub_date_str": "03 Oct 2026, 12:01 AM IST", "pub_date_relative": "2m ago"}, {"title": "Earning in dollars? New FEMA rules from October 1: How freelancers and YouTubers need to file EDF declaration with banks", "full_content": "If you are a freelancer, content creator, YouTuber, influencer, consultant, or agency in India and earn money from overseas clients or entities, a new foreign-exchange reporting requirement may affect how you document those earnings.\n\nThe Reserve Bank of India\u2019s new Foreign Exchange Management (Export and Import of Goods and Services) Regulations, 2026 came into effect on 1 October 2026.\n\nThe regulations require an exporter of services to submit an Export Declaration Form (EDF) declaring the full value of services exported. For services other than software, the Authorised Dealer (AD) in the domestic tariff area is the specified authority. Here's what you need to know.\n\nThe requirement is relevant to people exporting services from India to overseas recipients. This can include freelancers, consultants, agencies, influencers, content creators, and other service providers earning from international clients or entities.\n\nFor example, this could be relevant where your income represents an export of services and is received from an overseas client or entity through arrangements involving platforms such as YouTube AdSense, Upwork, Fiverr or Meta.\n\nAn exporter of services has to declare the amount representing the full export value of services through an EDF.\n\nIf services have been exported to one or more recipients during a month, the exporter can submit a single EDF covering all such exports during that month.\n\nThe EDF form has to be submitted within 30 days from the end of the month in which the invoice for the services was raised. So, where an October 2026 service-export invoice falls under the requirement, the deadline would be 30 November 2026.", "source": "LiveMint Money", "pub_date_str": "03 Oct 2026, 12:01 AM IST", "pub_date_relative": "2m ago"}, {"title": "Top Democrats slam \u2018Trump\u2019s failing economic agenda\u2019 after weaker-than-expected jobs growth \u2013 US politics live - The Guardian", "full_content": "Top Democrats slam \u2018Trump\u2019s failing economic agenda\u2019 after weaker-than-expected jobs growth \u2013 US politics live The Guardian US posts weak job growth data in September Yahoo Finance U.S. labor market slows with midterms on the horizon NBC News U.S. economy added 29,000 jobs in September, signaling a slower labor market The Washington Post September's jobs market was rough, but data center and healthcare roles grew Business Insider", "source": "Google News Business", "pub_date_str": "02 Oct 2026, 11:58 PM IST", "pub_date_relative": "5m ago"}, {"title": "G7 countries agree on release of diesel and oil stocks after US pressure", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Oct 2026, 11:54 PM IST", "pub_date_relative": "9m ago"}, {"title": "Bridger Aerospace at Noble Capital Markets Virtual Equity Investor Conference: growth in a scarce market", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Oct 2026, 11:53 PM IST", "pub_date_relative": "10m ago"}, {"title": "G7 nations to release diesel stocks as wars in Europe and Middle East constrain fuel supplies", "full_content": "The Group of Seven nations agreed Friday to release 100 million barrels of reserves to address surging diesel fuel prices, after the Trump administration pushed Europe to deploy their stocks.\n\nThe G7 leaders said the deployment will begin immediately and continue over four months with \"a frontloaded substantial diesel release within the first 20 days\" coordinated through the International Energy Agency.\n\n\"We will convene in the context of the IEA in the coming days to discuss the possibility of additional diesel releases as necessary,\" the G7 leaders said in a joint statement . U.S. diesel prices hit record highs in September and remain elevated Friday at $6.37 per gallon on average .\n\nThe G7 members are France, Canada, Germany, Italy, Japan, the United Kingdom and the United States. France currently holds the group's presidency. The European Union also participates in its meetings.\n\nPresident Donald Trump said moments before the G7 announcement that Europe had \"agreed to release a massive amount of their heavily stocked Diesel Oil.\" The world is facing a fuel supply crisis due to Ukraine's attacks on Russian refineries and disruptions in the Middle East from the Iran war.\n\nThe Trump administration has been pressuring Europe to release diesel stocks as an alternative to the U.S. imposing an export ban . Treasury Secretary Scott Bessent said Thursday that U.S. partners in Europe \"should accelerate delivery on their existing commitments and make additional supplies immediately available to address ongoing disruptions.\"\n\nThe G7 leaders agreed Friday to \"refrain from export restrictions on energy and energy products\" between the members of the group, according to their joint statement. They also called \"on all producers to refrain from imposing bans that could exacerbate market tensions.\"\n\nTrump is facing mounting political pressure from Republican lawmakers to tackle soaring fuel prices ahead of the midterm elections in November.", "source": "CNBC Top News", "pub_date_str": "02 Oct 2026, 11:51 PM IST", "pub_date_relative": "12m ago"}, {"title": "Nvidia breaks to all-time high of $237.87, driven by buyback, analyst upgrade, and AI demand", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Oct 2026, 11:50 PM IST", "pub_date_relative": "13m ago"}, {"title": "Electrical OEM sector: strong demand, high valuation risk", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Oct 2026, 11:50 PM IST", "pub_date_relative": "14m ago"}, {"title": "Moderna to replace Warner Bros Discovery on Nasdaq 100", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Oct 2026, 11:49 PM IST", "pub_date_relative": "14m ago"}, {"title": "Starbucks loses bid to dismiss union trademark lawsuit", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Oct 2026, 11:49 PM IST", "pub_date_relative": "14m ago"}, {"title": "Boeing white-collar workers approve contract offer, averting strike fears", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Oct 2026, 11:49 PM IST", "pub_date_relative": "14m ago"}, {"title": "Nike earnings analysis: questions answered and next catalysts", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Oct 2026, 11:49 PM IST", "pub_date_relative": "14m ago"}, {"title": "WMS options activity points to possible hedge roll near 52-week low", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Oct 2026, 11:49 PM IST", "pub_date_relative": "14m ago"}, {"title": "Stock Market Today: Dow Opens Higher, Yields Fall as Hiring Softens \u2014 Live Updates - WSJ", "full_content": "Stock Market Today: Dow Opens Higher, Yields Fall as Hiring Softens \u2014 Live Updates WSJ Stocks rise after soft jobs data; Nasdaq hits record led by Nvidia: Live updates CNBC Stock Market Today: Nasdaq flirts with new record, Dow and S&P rise after soft jobs report, but Treasury yields reverse higher MarketWatch Update: Equities Rise Intraday Following Weak Jobs Report Yahoo Finance Update: US Equity Indexes Jump as Weak Jobs Report Slashes Fed Policy Tightening Bias, Crude Oil Slumps Yahoo Finance", "source": "Google News Business", "pub_date_str": "02 Oct 2026, 11:38 PM IST", "pub_date_relative": "26m ago"}, {"title": "Friday's rally in the S&P 500 might not be enough, but Linde is out of this world", "full_content": "Every weekday, the Investing Club releases the Homestretch; an actionable afternoon update just in time for the last hour of trading.", "source": "CNBC Top News", "pub_date_str": "02 Oct 2026, 11:33 PM IST", "pub_date_relative": "30m ago"}, {"title": "Stocks rise after soft jobs data; Nasdaq hits record led by Nvidia: Live updates", "full_content": "Stocks rose Friday, though were off their highs, following a surprisingly weak jobs report that raised hopes the Federal Reserve will hold rates steady in October.\n\nThe Dow Jones Industrial Average added 244 points, or 0.5%. The S&P 500 gained 0.7%, while the Nasdaq Composite climbed 1.2%, hitting an all-time high earlier in the day before retreating slightly from those levels.\n\nTreasury yields fell Friday initially following the employment report, though they rebounded, pushing U.S. equities off their highs for the session.\n\nTech stocks rallied as risk-taking resumed on Wall Street, with shares of Nvidia hitting an all-time high for the first time since May. CrowdStrike , Palo Alto Networks and AMD also all rose to all-time highs. Meanwhile, shares of AMD also and 2%.\n\nSeptember's nonfarm payrolls report showed the U.S. economy added 29,000 jobs last month, with unemployment rising to 4.2%. The Dow Jones consensus called for jobs growth of 84,000 and for the unemployment rate to hold steady at 4.1%.\n\n\"This is the exact kind of number the market wanted from a labor standpoint,\" said Phil Blancato, chief market strategist at Osaic. \"Not too hot, not too cold ... not overly great, and not weakening.\"\n\nThat number made traders reassess the next move for the Federal Reserve. Fed funds futures trading suggests a 78% likelihood the central bank will stand pat at this month's meeting, up from a roughly 76% chance just the prior day, according to the CME FedWatch Tool.\n\nSaira Malik, chief investment officer at Nuveen, told CNBC's \"Squawk Box\" that the report may give the market support before earnings season kicks off, which she thinks will be \"very strong.\"", "source": "CNBC Top News", "pub_date_str": "02 Oct 2026, 11:26 PM IST", "pub_date_relative": "38m ago"}, {"title": "Why Lilly and Novo are betting on amylin to power a new wave of obesity drugs after GLP-1s", "full_content": "The next generation of blockbuster obesity drugs isn't trying to replace GLP-1 medicines.\n\nInstead, drugmakers are developing treatments that can complement existing drugs and push weight loss further, or offer new options for potentially millions of people who may not get enough benefit from GLP-1s.\n\nThat's the early potential of a new slate of injections, pills, and combination regimens targeting the amylin pathway, which involves a hormone released in the pancreas alongside insulin that helps regulate hunger and fullness. Amylin gives Eli Lilly , Novo and several other companies another biological lever to pull in treating obesity and Type 2 diabetes, either as an independent treatment or layered on top of existing drugs.\n\nLilly offered a promising glimpse of that strategy this week.\n\nThe company's experimental amylin-targeting drug, eloralintide, helped produce substantially more weight loss when combined with tirzepatide \u2013 the active ingredient in its blockbuster Zepbound and Mounjaro shots \u2013 in a Phase 2 trial on patients with obesity and Type 2 diabetes.\n\nAt 48 weeks, people receiving the highest-dose combination lost an average of 23.3% of their body weight, compared with 14.8% among those only taking a high dose of tirzepatide. Those figures are based on efficacy analysis that assumes patients remained on treatment in the trial.\n\n\"These are encouraging results,\" said Benjamin Bikman, a professor at Brigham Young University and leading expert on metabolic health and insulin resistance. \"Adults with type 2 diabetes typically lose less weight on these therapies than those without diabetes.\"\n\nLilly is developing eloralintide both as a standalone treatment and as part of that combo therapy. The two components make up what some analysts view as a major future franchise for the company.", "source": "CNBC Top News", "pub_date_str": "02 Oct 2026, 11:25 PM IST", "pub_date_relative": "38m ago"}, {"title": "10-year Treasury yield ticks higher despite weaker-than-expected jobs report", "full_content": "Treasury yields rose on Friday, after initially falling following an unexpectedly weak September jobs report likely put the brakes on a Federal Reserve rate hike in October.\n\nThe benchmark 10-year Treasury yield rose 4 basis points to 5.281%. Earlier this week, the yield reached its highest levels since 2002. The 30-year Treasury yield added 3 basis points at 5.633%. The 2-year Treasury yield, which is the most sensitive to Fed moves, was higher by almost 5 basis points at 4.835%.\n\nOne basis point is equal to 0.01%, and yields and prices move in opposite directions.\n\nNonfarm payrolls increased by just 29,000 for the month while the unemployment rate increased to 4.2% from 4.1%, the Bureau of Labor Statistics reported Friday. Economists surveyed by Dow Jones had been predicting an 84,000 increase and unemployment to remain steady. The August jobs count was revised lower to a gain of 133,000.\n\nYields initially fell in reaction to the report, but throughout the trading session they moved back into positive territory.\n\n\"I think that's the right move because I don't think this report necessarily changes the story for the Fed,\" said Timothy Chubb, chief investment officer at Girard Advisory Services. \"I still think the trajectory from here is higher for longer.\"\n\nTraders now see a 78% chance that the Federal Reserve will hold rates steady at its October meeting, according to the CME Group's FedWatch tool , though traders still see a high likelihood for a hike at its meeting in December.\n\nLindsay Rosner, head of multi-sector fixed income investing at Goldman Sachs Asset Management, agrees that a rate increase is unlikely this month, but that it's likely the Fed's hiking cycle isn't over.", "source": "CNBC Top News", "pub_date_str": "02 Oct 2026, 11:24 PM IST", "pub_date_relative": "39m ago"}, {"title": "Stocks making the biggest moves midday: Tesla, Broadcom, Nike, ON Semiconductor & more", "full_content": "These are some of the stocks posting the largest moves midday.", "source": "CNBC Finance", "pub_date_str": "02 Oct 2026, 11:22 PM IST", "pub_date_relative": "41m ago"}, {"title": "How much higher can bond yields rise \u2014 and what does it mean for stocks?", "full_content": "Also in Weekend Reads: Adjustable-rate mortgage loans, Gen Z entrepreneurs and advice from the Moneyist.", "source": "MarketWatch Top Stories", "pub_date_str": "02 Oct 2026, 11:18 PM IST", "pub_date_relative": "46m ago"}, {"title": "Europe\u2019s leaders rush to release diesel from stockpiles as fuel shock hangs over U.S. midterms", "full_content": "Europe leaders agreed Friday to release some of diesel stockpiles, pulling prices of oil down by more than 4%.", "source": "MarketWatch Top Stories", "pub_date_str": "02 Oct 2026, 11:18 PM IST", "pub_date_relative": "46m ago"}, {"title": "Men are losing ground in the labor market. Here's why", "full_content": "Friday's weaker-than-expected jobs report may feel especially lousy for men.\n\nWomen outnumbered men in the workforce for eight straight months as of September, according to an analysis of government data by Indeed. That's the longest stretch since 2010, the job search platform found.\n\n\"Back then, the gap emerged because men were losing jobs,\" said Cory Stahle, senior economist at Indeed. \"This time, it's because women are gaining them.\"\n\nAcross the board, the Bureau of Labor Statistics said Friday that U.S. payrolls grew by 29,000 jobs on net in September, lower than economists consensus forecast for an increase of 84,000.\n\nMen represented slightly over half of net job growth in September, according to a CNBC analysis of Friday's BLS data. A month prior, men represented just 2% of payroll growth.\n\nDespite the monthly increase, the seasonally adjusted number of employed men in the U.S. was lower by about 1.2 million in September compared with a year ago. Women's employment rose by more than 650,000 in the same period.\n\nThis divergence in labor market performance by gender can be partially explained by which industries are growing, according to Stahle.\n\nHealthcare , a key driver of the U.S. job market for the last several years, accounted for more than half of overall payroll expansion in September. Women make up nearly four out of every five workers in the sector.", "source": "CNBC Top News", "pub_date_str": "02 Oct 2026, 11:08 PM IST", "pub_date_relative": "55m ago"}, {"title": "Why bond investors quickly lost their enthusiasm for weak jobs figures", "full_content": "A weak U.S. labor report did what bad news hadn\u2019t done in a while: It made U.S. debt look like a safe haven again \u2014 albeit briefly.", "source": "MarketWatch Top Stories", "pub_date_str": "02 Oct 2026, 11:08 PM IST", "pub_date_relative": "56m ago"}, {"title": "Fuel inflation explained: How changes in petrol, CNG, LPG and PNG prices could affect your household budget", "full_content": "Fuel costs can have a direct bearing on a household\u2019s monthly budget, from cooking gas and PNG to petrol , diesel and CNG used for commuting.\n\nThe Ministry of Finance\u2019s Monthly Economic Review for September 2026 highlights how inflation across these fuel categories changed in June, July and August. Here\u2019s what the latest figures mean for household expenses.\n\nThe Consumer Price Index ( CPI ) measures changes in the prices of goods and services that households regularly buy, including food, clothing, fuel, and transport.\n\nYear-on-year (Y-o-Y) inflation shows how prices in a particular month compare with the same month a year earlier.\n\n*Source: Ministry of Finance September 2026 report; For household fuel\n\nLPG and piped natural gas inflation rose from 4.60% in June 2026 to 5.28% in August 2026. This means households using these fuels were paying more, compared with the same period a year earlier.\n\nFor example, if an LPG cylinder costs \u20b9 1,000 in August 2026, a 5.28% Y-o-Y inflation rate implies that the comparable price a year earlier was around \u20b9 950. The increase is therefore about \u20b9 50 per cylinder.\n\nHowever, coal and firewood inflation was higher than LPG inflation in August, at 8.06% and 8.26%, respectively.", "source": "LiveMint Money", "pub_date_str": "02 Oct 2026, 11:06 PM IST", "pub_date_relative": "57m ago"}, {"title": "My wife never went back to work after raising our kids. Do I have to share my retirement savings 50/50?", "full_content": "\u201cFor 14 years I have gotten up every morning and gone to work while she has been free to pursue whatever interested her.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "02 Oct 2026, 11:00 PM IST", "pub_date_relative": "1h ago"}, {"title": "The U.S. can\u2019t find enough of this critical machine component to win the humanoid-robots race", "full_content": "Humanoid robots have the potential to revolutionize life as we know it \u2014 but the U.S. does not have a supply chain that can produce key parts.", "source": "MarketWatch Top Stories", "pub_date_str": "02 Oct 2026, 10:59 PM IST", "pub_date_relative": "1h ago"}, {"title": "Class 9 students to study personal income tax: How NCERT is teaching financial literacy at a young age", "full_content": "The National Council of Educational Research and Training (NCERT) has officially included personal income tax education in the Class 9 curriculum. The newly introduced module framework frames tax compliance as a fundamental civic duty, emphasising that honest tax contributions directly drive national progress and infrastructure development.\n\nThis educational shift is part of the newly published Social Science textbook titled \"Understanding Society India and Beyond-Part 2\" . The textbook was released on Tuesday, arriving six months into the current academic session following the earlier publication of Part 1 in June.\n\nAccording to NCERT Director Dinesh Prasad Saklani, this update enables Class 9 students to perform real-world, slab-wise tax calculations for the first time.\n\nThe chapter outlines step-by-step procedures to compute total tax liabilities using the new tax regime , deliberately omitting references to the old tax regime.\n\nIndia introduced the new tax regime in the Union Budget 2020, with its provisions applicable from FY 2020-21. From April 1, 2023, the new tax regime became the default system, although taxpayers can opt for the old regime where applicable.\n\n\"Managing money wisely is not just about earning more, it is about making careful financial decisions at every stage, whether it involves spending, saving, investing, protecting against risks, borrowing responsibly or paying taxes. The choices individuals make today shape their financial future and determine their ability to achieve financial stability while managing financial opportunities and challenges,\" the textbook read.\n\nWith a distinguished career spanning nearly two decades at the highest levels of financial journalism, Rajendra Kumar Saxena stands as a cornerstone of the editorial leadership team at Livemint.com. In his current capacity as Content Editor, he is responsible for managing the comprehensive editorial lifecycle of the publication.", "source": "LiveMint Money", "pub_date_str": "02 Oct 2026, 10:58 PM IST", "pub_date_relative": "1h ago"}, {"title": "Ford fends off Hyundai to retain No. 3 U.S. sales position in third quarter", "full_content": "DETROIT \u2014 Ford Motor retained its No. 3 U.S. sales position during the third quarter by a narrow margin over Hyundai Motor, which had been forecast to overtake the Detroit automaker.\n\nFord on Friday reported a year-over-year sales decline of 6.6% during the third quarter to 507,395 light-duty vehicles. That figure excludes its largest heavy-duty trucks, which are classified differently.\n\nThat compares to the South Korean automaker, including Hyundai, Kia and Genesis brands, reporting a 5.4% increase to 506,200 vehicles during the quarter.\n\nBoth companies performed better than expected. A forecast last week by Cox Automotive had called for Hyundai to overtake Ford in quarterly sales for the first time.\n\nHyundai has been making major inroads in the U.S. this year. Ford, meanwhile, has struggled with production of its crucial F-Series pickup trucks after two supplier fires last year that disrupted production and sales.\n\nFord retains a roughly 89,700-unit sales lead for the year over Hyundai through the third quarter, according to data reported this week by the companies.\n\nThe current U.S. sales leader for 2026 is General Motors , followed by Toyota Motor . However, the Japanese automakers has been making gains against GM this year.\n\nFord on Friday downplayed Hyundai's proximity in sales, citing Kia and Hyundai brands operating separately in the U.S. despite having a corporate parent.", "source": "CNBC Top News", "pub_date_str": "02 Oct 2026, 10:50 PM IST", "pub_date_relative": "1h ago"}, {"title": "Tesla stock jumps 5% on better-than-expected vehicle deliveries report", "full_content": "Tesla shares climbed 5% on Friday after the electric vehicle maker reported deliveries for the third quarter that topped analysts' estimates.\n\nDeliveries fell about 2% from 497,099 a year earlier, but climbed from the second quarter, when Tesla recorded 480,126 deliveries.\n\nAnalysts were expecting around 461,100 deliveries, according to StreetAccount's consensus. Tesla's company-compiled consensus , published Tuesday, was for 461,974 deliveries.\n\nTesla doesn't break out exact delivery numbers by individual model or region, but the company said its entry-level Model 3 sedan and most popular Model Y SUVs accounted for a vast majority, or 98% , of its deliveries.\n\nDeliveries are the closest approximation of sales reported by Tesla but are not precisely defined in its shareholder communications.\n\nElon Musk's automaker is under pressure due to surging competition from Chinese EV makers, such as BYD and Xiaomi, which sell more affordable and innovative EVs. Tesla is trying to recover from consecutive annual declines in vehicle sales that were partly caused by a consumer backlash against Musk, the world's wealthiest person, and by the loss of a U.S. federal tax credit.\n\nThe Inflation Reduction Act, signed in 2022 by President Joe Biden, had made the EV tax break available through 2032. President Donald Trump's spending bill curtailed it ahead of schedule, ending the tax break after Sept. 30, 2025.\n\nTesla's stock was down 21% this year as of Tuesday's close, underperforming all of its megacap tech peers.", "source": "CNBC World Economy", "pub_date_str": "02 Oct 2026, 10:50 PM IST", "pub_date_relative": "1h ago"}, {"title": "Oil prices mixed as G7 nations to release diesel stocks", "full_content": "Crude oil prices were mixed Friday, after the Group of Seven nations announced the release of diesel and crude stocks to ease a surging fuel prices.\n\nBrent crude futures, the international benchmark, were rose by 9 cents at $102.40 per barrel, while U.S. West Texas Intermediate futures fell $1.47 to $91.48.\n\nThe G7 will deploy 100 million barrels of reserves over the next four months \"with a frontloaded substantial diesel release within the first 20 days,\" the group's leaders said in a joint statement. The G7 are France, Canada, Germany, Italy, Japan, the United Kingdom and the United States.\n\nThe Trump administration has called on Europe to release diesel stocks. Treasury Secretary Scott Bessent said Thursday that \"American farmers, truckers, and businesses should not be left carrying the burden of a global diesel shortage.\"\n\nBrent crude prices over the last six months. U.S. President Donald Trump , who has repeatedly touted the prospect of a diesel export ban, appeared to cool on the idea earlier this week, following a resurgence in crude exports through the strategically vital Strait of Hormuz.\n\nThe U.S. supplied around half of the EU's diesel imports in August, according to the International Energy Agency, underscoring the 27-nation bloc's exposure to a potential export ban.\n\nOil prices settled higher in the previous session amid a report that the U.S. is sending a third aircraft carrier strike group to the Middle East, along with an amphibious force carrying 2,000 Marines, raising the stakes for an escalation in the months-long conflict.", "source": "CNBC Top News", "pub_date_str": "02 Oct 2026, 10:48 PM IST", "pub_date_relative": "1h ago"}, {"title": "Early October Prime Day deals are live 4 days before the sale officially starts \u2014 these 53+ are actually worth it - NBC News", "full_content": "Early October Prime Day deals are live 4 days before the sale officially starts \u2014 these 53+ are actually worth it NBC News October Prime Day 2026: The best Amazon deals from Hanes, Carhartt, Apple and more before Prime Big Deal Days Yahoo Watching Thursday Night Football? Here\u2019s another reason to try Prime USA Today Prime Day Hasn\u2019t Started Yet, but I\u2019ve Already Found Deals Worth Buying WIRED PSA: The Best Amazon Prime Day Deals Are Already Live Allure", "source": "Google News Business", "pub_date_str": "02 Oct 2026, 10:46 PM IST", "pub_date_relative": "1h ago"}, {"title": "Swiggy 'cost for two' misleading? What Delhi consumer court's \u20b91 lakh order means for diners", "full_content": "Are you relying on online dining apps for food prices? Be aware because it's not always what you see on these apps that you might have to pay at the restaurants. In one such case, a Delhi consumer court has held Swiggy and a Delhi-based eatery responsible for unfair trade practices, reported LiveLaw.\n\nThe issue erupted after a customer said that he was charged significantly higher buffet rates than the \"cost for two\" listed on the app.\n\nThe Commission held both Bundl Technologies Pvt. Ltd., which operates Swiggy , and Themis Barbeque House responsible for the misleading pricing. According to LiveLaw, it observed that the restaurant was the service provider that put up the advertisement, while Swiggy was the platform on which the representation was displayed.\n\nThe order was passed by a three-member bench including President Divya Jyoti Jaipuriar and members Ashwani Kumar Mehta and Harpreet Kaur Charya.\n\nAs per LiveLaw, complainant Praveen Kumar Singh said that he booked a table at the eatery through the \u201c Dineout \u201d section of the popular food app on April 7, 2024.\n\nThe booking was said to be made for 10 people through Singh's account, while another booking for four people was made using his wife's account. At the time of booking, Swiggy Dineout displayed the \u201ccost for two\u201d as \u20b9 1,500, which translated to a rate of \u20b9 750 per person.\n\nHowever, he said that the restaurant subsequently charged \u20b9 1,050 per person for a vegetarian buffet and \u20b9 1,100 for a non-vegetarian buffet.\n\nAs per the complaint, customers were charged \u20b9 300 and \u20b9 350 extra per person than the \u201ccost for two\u201d pricing.", "source": "LiveMint Money", "pub_date_str": "02 Oct 2026, 10:42 PM IST", "pub_date_relative": "1h ago"}, {"title": "This couple took out an adjustable-rate mortgage at 6.8% in 2023. Here\u2019s how it\u2019s worked out.", "full_content": "Adjustable-rate mortgages have made a comeback as mortgage rates surge and buyers seek relief from high housing costs.", "source": "MarketWatch Top Stories", "pub_date_str": "02 Oct 2026, 10:34 PM IST", "pub_date_relative": "1h ago"}, {"title": "\u2018I don\u2019t want to die on the sales floor\u2019: I\u2019m 67 and earn $19.50 an hour at a big-box store. When can I finally retire?", "full_content": "\u201cI started taking Social Security at 66 and receive $2,410 a month. I have $214,000 in my 401(k).\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "02 Oct 2026, 10:33 PM IST", "pub_date_relative": "1h ago"}, {"title": "G7 To Release 100 Million Barrels Of Oil, Diesel As Fuel Prices Surge", "full_content": "G7 countries have agreed to release 100 million barrels of diesel and crude oil from emergency reserves.", "source": "NDTV Profit", "pub_date_str": "02 Oct 2026, 10:31 PM IST", "pub_date_relative": "1h ago"}, {"title": "Invested in gold, silver, debt or equity ETFs? Check how capital gains tax maths differs across these mutual funds", "full_content": "If you have invested money in gold, silver, debt, and equity ETFs , the tax payable when you sell them can differ significantly depending on the type of ETF and how long you held it.\n\nThe holding period, nature of the ETF, and amount of capital gain determine whether the gain is taxed at a specific rate or your applicable income-tax slab rate. Here\u2019s what you need to know about the capital gains tax rules for ETFs.\n\nFor listed ETF units, the key cut-off is 12 months. Mutual fund units held for 12 months or less are treated as short-term capital assets, while those held for more than 12 months qualify as long-term capital assets.\n\nThe distinction is important because the tax rate can change substantially after the holding period crosses one year.\n\nEquity ETFs, such as Nifty 50 ETFs, qualify as equity-oriented funds as they invest more than 65% of their corpus in equity and equity-related instruments.\n\nShort-term capital gains ( STCG ) on such units are taxed at 20%. For long-term gains (LTCG), the tax rate is 12.5% on gains exceeding the overall annual exemption of \u20b9 1.25 lakh in a financial year.\n\nFor example, suppose an investor buys an equity ETF for \u20b9 1 lakh and sells it after 15 months for \u20b9 3 lakh. The capital gain is \u20b9 2 lakh. After the \u20b9 1.25 lakh annual exemption, \u20b9 75,000 is taxable at 12.5%, resulting in a capital gains tax of \u20b9 9,375, before applicable cess.\n\nGold and silver ETFs follow a different tax treatment. Short-term gains are taxed at the investor's applicable income-tax slab rate.", "source": "LiveMint Money", "pub_date_str": "02 Oct 2026, 10:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "Treasuries are losing their moneyness", "full_content": "For four decades, US government bonds have been both securities and money. They may no longer be that special", "source": "FT Markets", "pub_date_str": "02 Oct 2026, 10:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "US economy adds just 29,000 jobs in September as hiring slows sharply", "full_content": "Figure renews market debate about outlook for further Fed rate rises", "source": "FT Markets", "pub_date_str": "02 Oct 2026, 10:29 PM IST", "pub_date_relative": "1h ago"}, {"title": "Nvidia just hit a record high. Here\u2019s why the stock still looks cheap to me", "full_content": "Nvidia looks historically cheap despite strong AI demand and expectations for continued revenue growth.", "source": "CNBC World Economy", "pub_date_str": "02 Oct 2026, 10:25 PM IST", "pub_date_relative": "1h ago"}, {"title": "American starts letting customers mix cash and miles for tickets", "full_content": "American Airlines is joining carriers that allow customers to book with a combination of cash and miles, the latest change at the carrier as it tries to grow its lucrative loyalty program .\n\nAmerican said customers will see a slider bar allowing them to combine AAdvantage program miles with cash for their tickets at checkout.\n\nThe option could be useful when customers don't have enough miles for the entire ticket and are looking to shave some cash off the ticket price.\n\nOther airlines, including American's chief rivals United Airlines and Delta Air Lines , currently allow customers to combine their frequent flyer miles with cash. For example, a one-way ticket on United from its Newark Liberty International Airport hub in New Jersey to Paris the first week of November was going for 40,000 United MileagePlus miles plus $5.60 in tax, $428.50 in cash, or $369 plus 6,000 miles.\n\nThe slider bar American plans to roll out in the coming days will give customers the option of using more miles for a bigger discount.\n\nAmerican's updated tool comes as airlines' battles for high-spending customers extend to new airport lounges , bigger premium cabins and in-flight Wi-Fi .", "source": "CNBC Top News", "pub_date_str": "02 Oct 2026, 10:19 PM IST", "pub_date_relative": "1h ago"}, {"title": "Inside Ken Griffin\u2019s secret three-year negotiation for Florida\u2019s largest real estate deal in history - Fox Business", "full_content": "Inside Ken Griffin\u2019s secret three-year negotiation for Florida\u2019s largest real estate deal in history Fox Business Carnegie Mellon is coming to Miami \u2014 and these people have a problem with that Miami Herald Why Are Name-Brand Colleges Heading to Florida? The Chronicle of Higher Education Hedge Fund Executive Gives $3 Billion to Carnegie Mellon in Largest-Ever Gift The New York Times Carnegie Mellon University Announces Historic $3 Billion Gift from Ken Griffin, Pioneering a New Model for Higher Education Carnegie Mellon University", "source": "Google News Business", "pub_date_str": "02 Oct 2026, 10:18 PM IST", "pub_date_relative": "1h ago"}, {"title": "Global bond market steadies after sharp sell-off", "full_content": "Heavy selling this week pushed 10-year US Treasury yields to their highest level since 2002", "source": "FT Markets", "pub_date_str": "02 Oct 2026, 10:15 PM IST", "pub_date_relative": "1h ago"}, {"title": "HDFC Bank ADRs Extend Rally, Jump 3% Pre-Market After Anup Bagchi Named MD & CEO", "full_content": "HDFC Bank ADRs extended gains, rose nearly 3% before the opening bell on Friday.", "source": "NDTV Profit", "pub_date_str": "02 Oct 2026, 10:14 PM IST", "pub_date_relative": "1h ago"}, {"title": "Cipla Disappointed By Maharashtra FDA Action, Says Pune Warehouse Complies With Protocols", "full_content": "Cipla said it is reviewing the Maharashtra FDA order cancelling its Pune warehouse licences, while maintaining the facility follows storage and distribution protocols.", "source": "NDTV Profit", "pub_date_str": "02 Oct 2026, 10:12 PM IST", "pub_date_relative": "1h ago"}, {"title": "India At Asian Games 2026 Day 15: Full Schedule, Match Timings For Saturday Events", "full_content": "India will have two major gold-medal opportunities on October 3, with the cricket and hockey teams taking on Pakistan and Malaysia respectively.", "source": "NDTV Profit", "pub_date_str": "02 Oct 2026, 10:02 PM IST", "pub_date_relative": "2h ago"}, {"title": "RBI Rate Hike Ahead? SBI Research Flags Inflation, Rupee Risks For October MPC", "full_content": "SBI Research expects RBI to begin raising rates in October, citing inflation, rupee weakness, global risks and tighter liquidity conditions.", "source": "NDTV Profit", "pub_date_str": "02 Oct 2026, 10:00 PM IST", "pub_date_relative": "2h ago"}, {"title": "This SpaceX supplier has a front-row seat to major shifts in warfare and rocket use", "full_content": "Although this recent IPO is trading below its offer price, its supplier relationships with both SpaceX and Anduril bode well for future revenue growth.", "source": "CNBC Top News", "pub_date_str": "02 Oct 2026, 09:57 PM IST", "pub_date_relative": "2h ago"}, {"title": "Shivon Zilis Says She\u2019s Been \u2018Let Go\u2019 From Relationship With Elon Musk - Forbes", "full_content": "Shivon Zilis Says She\u2019s Been \u2018Let Go\u2019 From Relationship With Elon Musk Forbes Shivon Zilis, Mom of 4 of Elon Musk\u2019s Kids, Reveals Billionaire Abruptly Broke Up with Her and Posts Some Final Texts people.com Mother of Elon Musk\u2019s Children Says She Has Been \u201cLet Go\u201d by the Billionaire Futurism Breaking up (with Elon Musk) is hard to do theverge.com Elon Musk\u2019s Longtime Girlfriend Says She\u2019s Been \u2018Let Go\u2019 in Dramatic Post The Daily Beast", "source": "Google News Business", "pub_date_str": "02 Oct 2026, 09:57 PM IST", "pub_date_relative": "2h ago"}, {"title": "Your health insurance premiums may take a big jump in 2027 \u2014 here's why", "full_content": "Many consumers face much higher health insurance premiums and cost-sharing next year, as factors like increased use of GLP-1 drugs , the expiration of enhanced Obamacare subsidies and a high U.S. inflation rate push up costs across the healthcare system, experts said.\n\nThe dynamic is stressing household budgets at a time when they're already strained by broader affordability issues , a key issue in the upcoming midterm elections.\n\n\"They can expect to pay more,\" said Jonathan Oberlander, a professor of health policy and political science at the University of North Carolina at Chapel Hill. \"Not just in terms of premiums \u2014 but also in terms of deductibles and copayments.\"\n\nMost Americans under age 65 \u2014 about 166 million people \u2014 get health insurance via employer-sponsored health plans.\n\nEmployers generally subsidize the cost of health insurance for their workers by covering a large portion of their monthly premium payments. The average worker paid $6,850 of annual premiums in 2025, while employers contributed more than $20,000 per worker, according to KFF, a health policy research group.\n\nIn 2027, the cost for employers to provide health benefits will rise by an estimated 8.2% per worker, on average \u2014 the largest increase since 2003, even after accounting for cost-reduction measures by employers, according to Marsh, a consulting firm.\n\nSimilarly, WTW, a consulting firm, projects employer healthcare costs will rise 11.1% next year , the biggest jump in more than 20 years.\n\nAon, another consulting firm, expects employer costs to jump 9.5% in 2027 \u2014 the fourth consecutive year of \"elevated\" healthcare costs, \"extending one of the most sustained periods of health care inflation employers have faced in decades,\" the firm said in a press release in August.", "source": "CNBC Top News", "pub_date_str": "02 Oct 2026, 09:56 PM IST", "pub_date_relative": "2h ago"}, {"title": "Asian Games 2026 Medal Tally: Check India Position After Day 14 As China Lead Standings", "full_content": "India added 10 medals on Friday, including six golds, as its Asian Games tally reached 76 medals and the contingent moved to fifth in the overall standings.", "source": "NDTV Profit", "pub_date_str": "02 Oct 2026, 09:56 PM IST", "pub_date_relative": "2h ago"}], "cfa": [{"title": "David Ellison says combined Paramount and Warner Bros. Discovery will be named Skydance", "full_content": "Paramount Skydance CEO David Ellison announced Friday that upon closing his company's merger with Warner Bros. Discovery next week, the combined entity will be named Skydance.\n\nIt's a full-circle moment for a company that has undergone two major acquisitions within the last 18 months.\n\n\"Paramount and Warner Bros. shaped over a century of culture,\" Ellison wrote in social media post Friday. \"By combining them, we aren't rewriting history \u2014 we're equipping these iconic studios with a more powerful engine. Together, we are Skydance: a creative-first home for bold, quality storytelling.\"\n\nEllison noted the new name allows the company to preserve Paramount and Warner Bros. as distinct studios. The merged company will trade under the new ticker \"SKYD.\"\n\n\"We never wanted a new corporate identity to diminish, alter or overshadow either one,\" he said. \"Instead, we wanted a name that would give the combined company an identity of its own while allowing Paramount and Warner Bros. \u2014 and all our extraordinary brands \u2014 to remain in the spotlight.\"\n\nThe Paramount and Warner Bros. studios together are set to release 35 films next year, according to data from Rentrak.\n\nIn August 2025, Ellison's Skydance \u2014 the production company behind the Mission: Impossible movies and \"Top Gun: Maverick\" \u2014 closed its acquisition of Paramount. Weeks later, the CEO set his sights on Warner Bros. Discovery in a takeover effort that would ultimately spark a bidding war .\n\nIn February, Paramount Skydance and Warner Bros. Discovery struck an agreement worth roughly $110 billion on an enterprise basis.", "source": "CNBC Top News", "pub_date_str": "03 Oct 2026, 12:01 AM IST", "pub_date_relative": "2m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Earning in dollars? New FEMA rules from October 1: How freelancers and YouTubers need to file EDF declaration with banks", "full_content": "If you are a freelancer, content creator, YouTuber, influencer, consultant, or agency in India and earn money from overseas clients or entities, a new foreign-exchange reporting requirement may affect how you document those earnings.\n\nThe Reserve Bank of India\u2019s new Foreign Exchange Management (Export and Import of Goods and Services) Regulations, 2026 came into effect on 1 October 2026.\n\nThe regulations require an exporter of services to submit an Export Declaration Form (EDF) declaring the full value of services exported. For services other than software, the Authorised Dealer (AD) in the domestic tariff area is the specified authority. Here's what you need to know.\n\nThe requirement is relevant to people exporting services from India to overseas recipients. This can include freelancers, consultants, agencies, influencers, content creators, and other service providers earning from international clients or entities.\n\nFor example, this could be relevant where your income represents an export of services and is received from an overseas client or entity through arrangements involving platforms such as YouTube AdSense, Upwork, Fiverr or Meta.\n\nAn exporter of services has to declare the amount representing the full export value of services through an EDF.\n\nIf services have been exported to one or more recipients during a month, the exporter can submit a single EDF covering all such exports during that month.\n\nThe EDF form has to be submitted within 30 days from the end of the month in which the invoice for the services was raised. So, where an October 2026 service-export invoice falls under the requirement, the deadline would be 30 November 2026.", "source": "LiveMint Money", "pub_date_str": "03 Oct 2026, 12:01 AM IST", "pub_date_relative": "2m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "G7 nations to release diesel stocks as wars in Europe and Middle East constrain fuel supplies", "full_content": "The Group of Seven nations agreed Friday to release 100 million barrels of reserves to address surging diesel fuel prices, after the Trump administration pushed Europe to deploy their stocks.\n\nThe G7 leaders said the deployment will begin immediately and continue over four months with \"a frontloaded substantial diesel release within the first 20 days\" coordinated through the International Energy Agency.\n\n\"We will convene in the context of the IEA in the coming days to discuss the possibility of additional diesel releases as necessary,\" the G7 leaders said in a joint statement . U.S. diesel prices hit record highs in September and remain elevated Friday at $6.37 per gallon on average .\n\nThe G7 members are France, Canada, Germany, Italy, Japan, the United Kingdom and the United States. France currently holds the group's presidency. The European Union also participates in its meetings.\n\nPresident Donald Trump said moments before the G7 announcement that Europe had \"agreed to release a massive amount of their heavily stocked Diesel Oil.\" The world is facing a fuel supply crisis due to Ukraine's attacks on Russian refineries and disruptions in the Middle East from the Iran war.\n\nThe Trump administration has been pressuring Europe to release diesel stocks as an alternative to the U.S. imposing an export ban . Treasury Secretary Scott Bessent said Thursday that U.S. partners in Europe \"should accelerate delivery on their existing commitments and make additional supplies immediately available to address ongoing disruptions.\"\n\nThe G7 leaders agreed Friday to \"refrain from export restrictions on energy and energy products\" between the members of the group, according to their joint statement. They also called \"on all producers to refrain from imposing bans that could exacerbate market tensions.\"\n\nTrump is facing mounting political pressure from Republican lawmakers to tackle soaring fuel prices ahead of the midterm elections in November.", "source": "CNBC Top News", "pub_date_str": "02 Oct 2026, 11:51 PM IST", "pub_date_relative": "12m ago", "cfa_topics": ["Economics", "Fixed Income", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Nvidia breaks to all-time high of $237.87, driven by buyback, analyst upgrade, and AI demand", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Oct 2026, 11:50 PM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Electrical OEM sector: strong demand, high valuation risk", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Oct 2026, 11:50 PM IST", "pub_date_relative": "14m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Moderna to replace Warner Bros Discovery on Nasdaq 100", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Oct 2026, 11:49 PM IST", "pub_date_relative": "14m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Boeing white-collar workers approve contract offer, averting strike fears", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Oct 2026, 11:49 PM IST", "pub_date_relative": "14m ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Nike earnings analysis: questions answered and next catalysts", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Oct 2026, 11:49 PM IST", "pub_date_relative": "14m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "WMS options activity points to possible hedge roll near 52-week low", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Oct 2026, 11:49 PM IST", "pub_date_relative": "14m ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Stock Market Today: Dow Opens Higher, Yields Fall as Hiring Softens \u2014 Live Updates - WSJ", "full_content": "Stock Market Today: Dow Opens Higher, Yields Fall as Hiring Softens \u2014 Live Updates WSJ Stocks rise after soft jobs data; Nasdaq hits record led by Nvidia: Live updates CNBC Stock Market Today: Nasdaq flirts with new record, Dow and S&P rise after soft jobs report, but Treasury yields reverse higher MarketWatch Update: Equities Rise Intraday Following Weak Jobs Report Yahoo Finance Update: US Equity Indexes Jump as Weak Jobs Report Slashes Fed Policy Tightening Bias, Crude Oil Slumps Yahoo Finance", "source": "Google News Business", "pub_date_str": "02 Oct 2026, 11:38 PM IST", "pub_date_relative": "26m ago", "cfa_topics": ["Equity Investments", "Fixed Income", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Friday's rally in the S&P 500 might not be enough, but Linde is out of this world", "full_content": "Every weekday, the Investing Club releases the Homestretch; an actionable afternoon update just in time for the last hour of trading.", "source": "CNBC Top News", "pub_date_str": "02 Oct 2026, 11:33 PM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Stocks rise after soft jobs data; Nasdaq hits record led by Nvidia: Live updates", "full_content": "Stocks rose Friday, though were off their highs, following a surprisingly weak jobs report that raised hopes the Federal Reserve will hold rates steady in October.\n\nThe Dow Jones Industrial Average added 244 points, or 0.5%. The S&P 500 gained 0.7%, while the Nasdaq Composite climbed 1.2%, hitting an all-time high earlier in the day before retreating slightly from those levels.\n\nTreasury yields fell Friday initially following the employment report, though they rebounded, pushing U.S. equities off their highs for the session.\n\nTech stocks rallied as risk-taking resumed on Wall Street, with shares of Nvidia hitting an all-time high for the first time since May. CrowdStrike , Palo Alto Networks and AMD also all rose to all-time highs. Meanwhile, shares of AMD also and 2%.\n\nSeptember's nonfarm payrolls report showed the U.S. economy added 29,000 jobs last month, with unemployment rising to 4.2%. The Dow Jones consensus called for jobs growth of 84,000 and for the unemployment rate to hold steady at 4.1%.\n\n\"This is the exact kind of number the market wanted from a labor standpoint,\" said Phil Blancato, chief market strategist at Osaic. \"Not too hot, not too cold ... not overly great, and not weakening.\"\n\nThat number made traders reassess the next move for the Federal Reserve. Fed funds futures trading suggests a 78% likelihood the central bank will stand pat at this month's meeting, up from a roughly 76% chance just the prior day, according to the CME FedWatch Tool.\n\nSaira Malik, chief investment officer at Nuveen, told CNBC's \"Squawk Box\" that the report may give the market support before earnings season kicks off, which she thinks will be \"very strong.\"", "source": "CNBC Top News", "pub_date_str": "02 Oct 2026, 11:26 PM IST", "pub_date_relative": "38m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Fixed Income", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Why Lilly and Novo are betting on amylin to power a new wave of obesity drugs after GLP-1s", "full_content": "The next generation of blockbuster obesity drugs isn't trying to replace GLP-1 medicines.\n\nInstead, drugmakers are developing treatments that can complement existing drugs and push weight loss further, or offer new options for potentially millions of people who may not get enough benefit from GLP-1s.\n\nThat's the early potential of a new slate of injections, pills, and combination regimens targeting the amylin pathway, which involves a hormone released in the pancreas alongside insulin that helps regulate hunger and fullness. Amylin gives Eli Lilly , Novo and several other companies another biological lever to pull in treating obesity and Type 2 diabetes, either as an independent treatment or layered on top of existing drugs.\n\nLilly offered a promising glimpse of that strategy this week.\n\nThe company's experimental amylin-targeting drug, eloralintide, helped produce substantially more weight loss when combined with tirzepatide \u2013 the active ingredient in its blockbuster Zepbound and Mounjaro shots \u2013 in a Phase 2 trial on patients with obesity and Type 2 diabetes.\n\nAt 48 weeks, people receiving the highest-dose combination lost an average of 23.3% of their body weight, compared with 14.8% among those only taking a high dose of tirzepatide. Those figures are based on efficacy analysis that assumes patients remained on treatment in the trial.\n\n\"These are encouraging results,\" said Benjamin Bikman, a professor at Brigham Young University and leading expert on metabolic health and insulin resistance. \"Adults with type 2 diabetes typically lose less weight on these therapies than those without diabetes.\"\n\nLilly is developing eloralintide both as a standalone treatment and as part of that combo therapy. The two components make up what some analysts view as a major future franchise for the company.", "source": "CNBC Top News", "pub_date_str": "02 Oct 2026, 11:25 PM IST", "pub_date_relative": "38m ago", "cfa_topics": ["Financial Statement Analysis", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "10-year Treasury yield ticks higher despite weaker-than-expected jobs report", "full_content": "Treasury yields rose on Friday, after initially falling following an unexpectedly weak September jobs report likely put the brakes on a Federal Reserve rate hike in October.\n\nThe benchmark 10-year Treasury yield rose 4 basis points to 5.281%. Earlier this week, the yield reached its highest levels since 2002. The 30-year Treasury yield added 3 basis points at 5.633%. The 2-year Treasury yield, which is the most sensitive to Fed moves, was higher by almost 5 basis points at 4.835%.\n\nOne basis point is equal to 0.01%, and yields and prices move in opposite directions.\n\nNonfarm payrolls increased by just 29,000 for the month while the unemployment rate increased to 4.2% from 4.1%, the Bureau of Labor Statistics reported Friday. Economists surveyed by Dow Jones had been predicting an 84,000 increase and unemployment to remain steady. The August jobs count was revised lower to a gain of 133,000.\n\nYields initially fell in reaction to the report, but throughout the trading session they moved back into positive territory.\n\n\"I think that's the right move because I don't think this report necessarily changes the story for the Fed,\" said Timothy Chubb, chief investment officer at Girard Advisory Services. \"I still think the trajectory from here is higher for longer.\"\n\nTraders now see a 78% chance that the Federal Reserve will hold rates steady at its October meeting, according to the CME Group's FedWatch tool , though traders still see a high likelihood for a hike at its meeting in December.\n\nLindsay Rosner, head of multi-sector fixed income investing at Goldman Sachs Asset Management, agrees that a rate increase is unlikely this month, but that it's likely the Fed's hiking cycle isn't over.", "source": "CNBC Top News", "pub_date_str": "02 Oct 2026, 11:24 PM IST", "pub_date_relative": "39m ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "How much higher can bond yields rise \u2014 and what does it mean for stocks?", "full_content": "Also in Weekend Reads: Adjustable-rate mortgage loans, Gen Z entrepreneurs and advice from the Moneyist.", "source": "MarketWatch Top Stories", "pub_date_str": "02 Oct 2026, 11:18 PM IST", "pub_date_relative": "46m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Why bond investors quickly lost their enthusiasm for weak jobs figures", "full_content": "A weak U.S. labor report did what bad news hadn\u2019t done in a while: It made U.S. debt look like a safe haven again \u2014 albeit briefly.", "source": "MarketWatch Top Stories", "pub_date_str": "02 Oct 2026, 11:08 PM IST", "pub_date_relative": "56m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Fuel inflation explained: How changes in petrol, CNG, LPG and PNG prices could affect your household budget", "full_content": "Fuel costs can have a direct bearing on a household\u2019s monthly budget, from cooking gas and PNG to petrol , diesel and CNG used for commuting.\n\nThe Ministry of Finance\u2019s Monthly Economic Review for September 2026 highlights how inflation across these fuel categories changed in June, July and August. Here\u2019s what the latest figures mean for household expenses.\n\nThe Consumer Price Index ( CPI ) measures changes in the prices of goods and services that households regularly buy, including food, clothing, fuel, and transport.\n\nYear-on-year (Y-o-Y) inflation shows how prices in a particular month compare with the same month a year earlier.\n\n*Source: Ministry of Finance September 2026 report; For household fuel\n\nLPG and piped natural gas inflation rose from 4.60% in June 2026 to 5.28% in August 2026. This means households using these fuels were paying more, compared with the same period a year earlier.\n\nFor example, if an LPG cylinder costs \u20b9 1,000 in August 2026, a 5.28% Y-o-Y inflation rate implies that the comparable price a year earlier was around \u20b9 950. The increase is therefore about \u20b9 50 per cylinder.\n\nHowever, coal and firewood inflation was higher than LPG inflation in August, at 8.06% and 8.26%, respectively.", "source": "LiveMint Money", "pub_date_str": "02 Oct 2026, 11:06 PM IST", "pub_date_relative": "57m ago", "cfa_topics": ["Economics", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Class 9 students to study personal income tax: How NCERT is teaching financial literacy at a young age", "full_content": "The National Council of Educational Research and Training (NCERT) has officially included personal income tax education in the Class 9 curriculum. The newly introduced module framework frames tax compliance as a fundamental civic duty, emphasising that honest tax contributions directly drive national progress and infrastructure development.\n\nThis educational shift is part of the newly published Social Science textbook titled \"Understanding Society India and Beyond-Part 2\" . The textbook was released on Tuesday, arriving six months into the current academic session following the earlier publication of Part 1 in June.\n\nAccording to NCERT Director Dinesh Prasad Saklani, this update enables Class 9 students to perform real-world, slab-wise tax calculations for the first time.\n\nThe chapter outlines step-by-step procedures to compute total tax liabilities using the new tax regime , deliberately omitting references to the old tax regime.\n\nIndia introduced the new tax regime in the Union Budget 2020, with its provisions applicable from FY 2020-21. From April 1, 2023, the new tax regime became the default system, although taxpayers can opt for the old regime where applicable.\n\n\"Managing money wisely is not just about earning more, it is about making careful financial decisions at every stage, whether it involves spending, saving, investing, protecting against risks, borrowing responsibly or paying taxes. The choices individuals make today shape their financial future and determine their ability to achieve financial stability while managing financial opportunities and challenges,\" the textbook read.\n\nWith a distinguished career spanning nearly two decades at the highest levels of financial journalism, Rajendra Kumar Saxena stands as a cornerstone of the editorial leadership team at Livemint.com. In his current capacity as Content Editor, he is responsible for managing the comprehensive editorial lifecycle of the publication.", "source": "LiveMint Money", "pub_date_str": "02 Oct 2026, 10:58 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Tesla stock jumps 5% on better-than-expected vehicle deliveries report", "full_content": "Tesla shares climbed 5% on Friday after the electric vehicle maker reported deliveries for the third quarter that topped analysts' estimates.\n\nDeliveries fell about 2% from 497,099 a year earlier, but climbed from the second quarter, when Tesla recorded 480,126 deliveries.\n\nAnalysts were expecting around 461,100 deliveries, according to StreetAccount's consensus. Tesla's company-compiled consensus , published Tuesday, was for 461,974 deliveries.\n\nTesla doesn't break out exact delivery numbers by individual model or region, but the company said its entry-level Model 3 sedan and most popular Model Y SUVs accounted for a vast majority, or 98% , of its deliveries.\n\nDeliveries are the closest approximation of sales reported by Tesla but are not precisely defined in its shareholder communications.\n\nElon Musk's automaker is under pressure due to surging competition from Chinese EV makers, such as BYD and Xiaomi, which sell more affordable and innovative EVs. Tesla is trying to recover from consecutive annual declines in vehicle sales that were partly caused by a consumer backlash against Musk, the world's wealthiest person, and by the loss of a U.S. federal tax credit.\n\nThe Inflation Reduction Act, signed in 2022 by President Joe Biden, had made the EV tax break available through 2032. President Donald Trump's spending bill curtailed it ahead of schedule, ending the tax break after Sept. 30, 2025.\n\nTesla's stock was down 21% this year as of Tuesday's close, underperforming all of its megacap tech peers.", "source": "CNBC World Economy", "pub_date_str": "02 Oct 2026, 10:50 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Oil prices mixed as G7 nations to release diesel stocks", "full_content": "Crude oil prices were mixed Friday, after the Group of Seven nations announced the release of diesel and crude stocks to ease a surging fuel prices.\n\nBrent crude futures, the international benchmark, were rose by 9 cents at $102.40 per barrel, while U.S. West Texas Intermediate futures fell $1.47 to $91.48.\n\nThe G7 will deploy 100 million barrels of reserves over the next four months \"with a frontloaded substantial diesel release within the first 20 days,\" the group's leaders said in a joint statement. The G7 are France, Canada, Germany, Italy, Japan, the United Kingdom and the United States.\n\nThe Trump administration has called on Europe to release diesel stocks. Treasury Secretary Scott Bessent said Thursday that \"American farmers, truckers, and businesses should not be left carrying the burden of a global diesel shortage.\"\n\nBrent crude prices over the last six months. U.S. President Donald Trump , who has repeatedly touted the prospect of a diesel export ban, appeared to cool on the idea earlier this week, following a resurgence in crude exports through the strategically vital Strait of Hormuz.\n\nThe U.S. supplied around half of the EU's diesel imports in August, according to the International Energy Agency, underscoring the 27-nation bloc's exposure to a potential export ban.\n\nOil prices settled higher in the previous session amid a report that the U.S. is sending a third aircraft carrier strike group to the Middle East, along with an amphibious force carrying 2,000 Marines, raising the stakes for an escalation in the months-long conflict.", "source": "CNBC Top News", "pub_date_str": "02 Oct 2026, 10:48 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Fixed Income", "Derivatives", "Alternative Investments", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "G7 To Release 100 Million Barrels Of Oil, Diesel As Fuel Prices Surge", "full_content": "G7 countries have agreed to release 100 million barrels of diesel and crude oil from emergency reserves.", "source": "NDTV Profit", "pub_date_str": "02 Oct 2026, 10:31 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Invested in gold, silver, debt or equity ETFs? Check how capital gains tax maths differs across these mutual funds", "full_content": "If you have invested money in gold, silver, debt, and equity ETFs , the tax payable when you sell them can differ significantly depending on the type of ETF and how long you held it.\n\nThe holding period, nature of the ETF, and amount of capital gain determine whether the gain is taxed at a specific rate or your applicable income-tax slab rate. Here\u2019s what you need to know about the capital gains tax rules for ETFs.\n\nFor listed ETF units, the key cut-off is 12 months. Mutual fund units held for 12 months or less are treated as short-term capital assets, while those held for more than 12 months qualify as long-term capital assets.\n\nThe distinction is important because the tax rate can change substantially after the holding period crosses one year.\n\nEquity ETFs, such as Nifty 50 ETFs, qualify as equity-oriented funds as they invest more than 65% of their corpus in equity and equity-related instruments.\n\nShort-term capital gains ( STCG ) on such units are taxed at 20%. For long-term gains (LTCG), the tax rate is 12.5% on gains exceeding the overall annual exemption of \u20b9 1.25 lakh in a financial year.\n\nFor example, suppose an investor buys an equity ETF for \u20b9 1 lakh and sells it after 15 months for \u20b9 3 lakh. The capital gain is \u20b9 2 lakh. After the \u20b9 1.25 lakh annual exemption, \u20b9 75,000 is taxable at 12.5%, resulting in a capital gains tax of \u20b9 9,375, before applicable cess.\n\nGold and silver ETFs follow a different tax treatment. Short-term gains are taxed at the investor's applicable income-tax slab rate.", "source": "LiveMint Money", "pub_date_str": "02 Oct 2026, 10:30 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Nvidia just hit a record high. Here\u2019s why the stock still looks cheap to me", "full_content": "Nvidia looks historically cheap despite strong AI demand and expectations for continued revenue growth.", "source": "CNBC World Economy", "pub_date_str": "02 Oct 2026, 10:25 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "American starts letting customers mix cash and miles for tickets", "full_content": "American Airlines is joining carriers that allow customers to book with a combination of cash and miles, the latest change at the carrier as it tries to grow its lucrative loyalty program .\n\nAmerican said customers will see a slider bar allowing them to combine AAdvantage program miles with cash for their tickets at checkout.\n\nThe option could be useful when customers don't have enough miles for the entire ticket and are looking to shave some cash off the ticket price.\n\nOther airlines, including American's chief rivals United Airlines and Delta Air Lines , currently allow customers to combine their frequent flyer miles with cash. For example, a one-way ticket on United from its Newark Liberty International Airport hub in New Jersey to Paris the first week of November was going for 40,000 United MileagePlus miles plus $5.60 in tax, $428.50 in cash, or $369 plus 6,000 miles.\n\nThe slider bar American plans to roll out in the coming days will give customers the option of using more miles for a bigger discount.\n\nAmerican's updated tool comes as airlines' battles for high-spending customers extend to new airport lounges , bigger premium cabins and in-flight Wi-Fi .", "source": "CNBC Top News", "pub_date_str": "02 Oct 2026, 10:19 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Inside Ken Griffin\u2019s secret three-year negotiation for Florida\u2019s largest real estate deal in history - Fox Business", "full_content": "Inside Ken Griffin\u2019s secret three-year negotiation for Florida\u2019s largest real estate deal in history Fox Business Carnegie Mellon is coming to Miami \u2014 and these people have a problem with that Miami Herald Why Are Name-Brand Colleges Heading to Florida? The Chronicle of Higher Education Hedge Fund Executive Gives $3 Billion to Carnegie Mellon in Largest-Ever Gift The New York Times Carnegie Mellon University Announces Historic $3 Billion Gift from Ken Griffin, Pioneering a New Model for Higher Education Carnegie Mellon University", "source": "Google News Business", "pub_date_str": "02 Oct 2026, 10:18 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Global bond market steadies after sharp sell-off", "full_content": "Heavy selling this week pushed 10-year US Treasury yields to their highest level since 2002", "source": "FT Markets", "pub_date_str": "02 Oct 2026, 10:15 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "India At Asian Games 2026 Day 15: Full Schedule, Match Timings For Saturday Events", "full_content": "India will have two major gold-medal opportunities on October 3, with the cricket and hockey teams taking on Pakistan and Malaysia respectively.", "source": "NDTV Profit", "pub_date_str": "02 Oct 2026, 10:02 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "RBI Rate Hike Ahead? SBI Research Flags Inflation, Rupee Risks For October MPC", "full_content": "SBI Research expects RBI to begin raising rates in October, citing inflation, rupee weakness, global risks and tighter liquidity conditions.", "source": "NDTV Profit", "pub_date_str": "02 Oct 2026, 10:00 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "This SpaceX supplier has a front-row seat to major shifts in warfare and rocket use", "full_content": "Although this recent IPO is trading below its offer price, its supplier relationships with both SpaceX and Anduril bode well for future revenue growth.", "source": "CNBC Top News", "pub_date_str": "02 Oct 2026, 09:57 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Your health insurance premiums may take a big jump in 2027 \u2014 here's why", "full_content": "Many consumers face much higher health insurance premiums and cost-sharing next year, as factors like increased use of GLP-1 drugs , the expiration of enhanced Obamacare subsidies and a high U.S. inflation rate push up costs across the healthcare system, experts said.\n\nThe dynamic is stressing household budgets at a time when they're already strained by broader affordability issues , a key issue in the upcoming midterm elections.\n\n\"They can expect to pay more,\" said Jonathan Oberlander, a professor of health policy and political science at the University of North Carolina at Chapel Hill. \"Not just in terms of premiums \u2014 but also in terms of deductibles and copayments.\"\n\nMost Americans under age 65 \u2014 about 166 million people \u2014 get health insurance via employer-sponsored health plans.\n\nEmployers generally subsidize the cost of health insurance for their workers by covering a large portion of their monthly premium payments. The average worker paid $6,850 of annual premiums in 2025, while employers contributed more than $20,000 per worker, according to KFF, a health policy research group.\n\nIn 2027, the cost for employers to provide health benefits will rise by an estimated 8.2% per worker, on average \u2014 the largest increase since 2003, even after accounting for cost-reduction measures by employers, according to Marsh, a consulting firm.\n\nSimilarly, WTW, a consulting firm, projects employer healthcare costs will rise 11.1% next year , the biggest jump in more than 20 years.\n\nAon, another consulting firm, expects employer costs to jump 9.5% in 2027 \u2014 the fourth consecutive year of \"elevated\" healthcare costs, \"extending one of the most sustained periods of health care inflation employers have faced in decades,\" the firm said in a press release in August.", "source": "CNBC Top News", "pub_date_str": "02 Oct 2026, 09:56 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "US backs down from fuel export ban threat as G7 agrees to release 100mn barrels", "full_content": "G7 leaders said after a meeting on Friday that they would release 100mn barrels of crude and diesel", "source": "FT Markets", "pub_date_str": "02 Oct 2026, 09:50 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Ethical & Professional Standards"], "exam_note
