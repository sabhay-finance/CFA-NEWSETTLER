 Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Adani Enterprises gets rating upgrade from CARE Ratings to AA; Stable; shares up 21% in 2026 CARE Ratings Share Price Crisil Share Price ICRA Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Adani Enterprises gets rating upgrade from CARE Ratings to AA; Stable; shares up 21% in 2026 SECTIONS Adani Enterprises gets rating upgrade from CARE Ratings to AA; Stable; shares up 21% in 2026 By Kumar Gaurav , ETMarkets.com Last Updated: Oct 07, 2026, 07:34:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Adani Enterprises secured its highest-ever credit rating after CARE Ratings upgraded its long-term rating to CARE AA; Stable from CARE AA-; Stable. The agency cited stronger financial flexibility following a Rs 15,000 crore QIP and Adani Airports stake sale.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "07 Oct 2026, 07:34 PM IST", "pub_date_relative": "34m ago", "cfa_topics": ["Equity Investments", "Fixed Income"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Best 3 stocks to buy: Balrampur Chini, Bluestone, Kotak Bank by Vaishali Parekh | Target, stop-loss, Nifty prediction", "full_content": "Stocks to buy today | Vaishali Parekh's stock recommendations for today: The key benchmark indices of the Indian stock market opened sharply lower and remained under pressure as markets witnessed a sell-off following the RBI\u2019s rate hike. The central bank raised rates by 25 basis points and shifted its stance to \u201ccalibrated tightening,\u201d triggering a negative reaction across the benchmarks. Continued weakness in the rupee further weighed on investor sentiment.\n\nThe Nifty 50 declined 0.76% to close at 22,603, while the Sensex fell 0.59% to close at 72,638.\n\nOn the sectoral front, PSU Banks and Media were the key gainers, while Metal, Realty, Auto and IT remained the major laggards. The broader market remained mixed, with the Nifty Midcap 100 declining 0.63%, while the Nifty Smallcap 100 gained 0.30%.\n\nVaishali Parekh, Vice President \u2014 Technical Research at Prabhudas Lilladher, believes the Indian stock market is biased toward caution, as the 50-stock index remains below 23,000. She said the Nifty 50 index is trading in a broader range of 22,000 to 23,000.", "source": "LiveMint Markets", "pub_date_str": "07 Oct 2026, 07:31 PM IST", "pub_date_relative": "37m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Micron\u2019s ridiculously cheap stock could triple from here, according to this analyst\u2019s math", "full_content": "A D.A. Davidson analyst thinks investors aren\u2019t properly appreciating the company\u2019s growth potential or the impact of an upcoming buyback program.", "source": "MarketWatch Top Stories", "pub_date_str": "07 Oct 2026, 07:31 PM IST", "pub_date_relative": "37m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "US stocks: US market opens lower as bond yields and oil rebound; Fed minutes in focus", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a US stocks: US market opens lower as bond yields and oil rebound; Fed minutes in focus Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US stocks: US market opens lower as bond yields and oil rebound; Fed minutes in focus SECTIONS US stocks: US market opens lower as bond yields and oil rebound; Fed minutes in focus Reuters Last Updated: Oct 07, 2026, 07:29:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis On Wednesday, Wall Street opened to a downturn, with the Dow Jones Industrial Average declining by 325.06 points, highlighting a sense of caution among investors. The S&P 500 and Nasdaq Composite mirrored this negativity, influenced by the spike in Treasury yields. With the release of the Federal Reserve's meeting minutes looming, investor sentiment remained cautious amid climbing Treasury yields and oil prices.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "07 Oct 2026, 07:29 PM IST", "pub_date_relative": "38m ago", "cfa_topics": ["Equity Investments", "Fixed Income"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Stocks made a record high. Two big bearish trades point to skepticism", "full_content": "The Nasdaq-100 is up 15% since its July low and is now 2% above its previous record from June. The S&P 500 , after a two-month-long battle with surging interest rates, is back trading at an all-time high.\n\nYou'd think that resilience would be met with some fanfare. Instead, the two biggest options trades on the tape Tuesday reeked of skepticism.\n\nIn the State Street SPDR S&P 500 ETF Trust (SPY) , about an hour after the opening bell on Tuesday, someone traded a 100,000-lot put spread that cost a net $44 million and likely included buying $61 million of 655-strike puts expiring in March and selling $17 million of 500-strike puts in the same expiry.\n\nIt's a bearish bet that is most profitable if the SPY falls to $500 \u2014 a 35% decline from its current levels.\n\nSPX year to date \"If you're trying to hedge, these March options are the cheapest they've been in 90 days,\" said Brent Kochuba of options analytics firm SpotGamma. \"The vol is fairly low.\"\n\nCboe's VIX Index did slip below 15 at one point Tuesday, meaning options generally got cheaper, but the put spread was the biggest trade in SPY on a day where options volume was more than 20% higher than the 30-day average.\n\nThe bulky trade, which starts making money if the S&P 500 drops more than 18%, was about four times bigger than the next-biggest trade, a net $11 million call spread, SpotGamma data show.\n\nAt the same time, an even bigger trade went off in options on Meta despite the social media giant rallying 20% the past month as downloads of the tech giant's personal assistant Muse soar.", "source": "CNBC Top News", "pub_date_str": "07 Oct 2026, 07:29 PM IST", "pub_date_relative": "39m ago", "cfa_topics": ["Equity Investments", "Derivatives", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "This part of the bond market offers compelling yields with minimal risk", "full_content": "You can earn good yields with very low price risk in ultrashort bond funds.", "source": "MarketWatch Top Stories", "pub_date_str": "07 Oct 2026, 07:23 PM IST", "pub_date_relative": "45m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Sebi expands debt maturity limits to help issuers manage cash flow", "full_content": "The Securities and Exchange Board of India (Sebi) has laid out a new framework for the number of debt instruments by an issuer that can mature in a given financial year. The new norms come into effect immediately.\n\nIn a circular issued on Wednesday, the market regulator increased the maximum number of International Securities Identification Numbers (ISINs) that can mature annually from 14 to 17 for privately placed debt securities. The norms were previously published for consultation in August. An ISIN is a unique 12-digit code used to identify a specific security issue globally.\n\nOf the 17 issues, entities can have up to 12 plain vanilla debt securities. Such securities can be secured or unsecured instruments. Once the total outstanding amount of plain vanilla debt maturing in a financial year touches \u20b9 15,000 crore, one additional ISIN could be permitted for every subsequent \u20b9 3,000 crore. This would allow companies with large repayment obligations to spread their redemptions more evenly through the year.\n\nAnother five ISINs would be available for structured debt, market-linked debt, floating-rate bonds, zero-coupon bonds and debt capital instruments.\n\nThe move is intended to help companies, especially non-banking financial companies (NBFCs), better manage their cash flows and prevent debt repayments from bunching up. The proposal comes after market participants told Sebi that current limits hamper liquidity management and exacerbate asset-liability mismatches.\n\nSeparately, Sebi eased listing norms for small-value debt issuers on Wednesday. Currently, issuers of debt securities or non-convertible redeemable preference shares, issued through private placement at a face value of \u20b9 10,000, are required to appoint at least one merchant banker.", "source": "LiveMint Markets", "pub_date_str": "07 Oct 2026, 07:21 PM IST", "pub_date_relative": "46m ago", "cfa_topics": ["Corporate Issuers", "Fixed Income"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "FCNR-B deposits: Economic benefits outweigh hedging costs, says Sanjay Malhotra", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a FCNR-B deposits: Economic benefits outweigh hedging costs, says Sanjay Malhotra The Economic Times daily newspaper is available online now. Read Today's Paper FCNR-B deposits: Economic benefits outweigh hedging costs, says Sanjay Malhotra SECTIONS FCNR-B deposits: Economic benefits outweigh hedging costs, says Sanjay Malhotra ET Online Last Updated: Oct 07, 2026, 07:17:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The RBI had introduced the special USD-INR forex swap facility on June 8, 2026, as part of efforts to strengthen foreign exchange reserves and support balance of payments conditions. The facility allowed banks to offer higher interest rates on FCNR(B) deposits by transferring the currency hedging cost to the central bank.\n\nThe NBFC saga - Part 1: How RBI moved from protecting depositors to policing systemic risk\n\nBritannia\u2019s next big bet for young India lies beyond biscuits\n\nThe world is witnessing a bond rout. Why should it matter to you?\n\nQ2 earnings season: Will it settle or add to confusion in the stock market?\n\nHow Sebi busted Growpital\u2019s \u2018assured\u2019 returns, LLPs and money trail\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers", "source": "Economic Times Economy", "pub_date_str": "07 Oct 2026, 07:17 PM IST", "pub_date_relative": "51m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Fixed Income", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Trading platform Webull's China ties create national security risk, congressional panel finds; stock drops 18%", "full_content": "Digital investment platform Webull , which counts 28 million global users , is quietly \"tied in structural ways\" to China's government, representing a national security threat to U.S. finance, according to a bipartisan congressional panel's findings shared exclusively with CNBC.\n\nThe bipartisan House Select Committee on China in its new report being released Wednesday found \"a profound gap\" between Webull's public marketing as \"an American company\" and actual control of the St. Petersburg, Florida-based firm.\n\n\"Webull's ownership architecture, technical workforce, technology infrastructure, cross-border data routing, corporate financing, and compliance frameworks are tied in structural ways to the People's Republic of China,\" the committee found.\n\nThe panel asserted that national security concerns around the company have \"escalated\" since October 2025, when Webull began carrying customer cash directly, according to a regulatory filing the panel cited. The committee alleges that creates a \"structural exposure of billions of dollars in American capital.\"\n\nThe committee said the company's corporate structure means the firm's \"software development, data pipelines, and core engineering operations\" are dependent on infrastructure subject directly to Beijing's laws. And those laws in China can compel firms to cooperate with the government in myriad ways, including data transfers.\n\nWebull took issue with the report, saying via a spokesperson, \"It is deeply disappointing that the Select Committee published a report containing significant inaccuracies and unsupported conclusions without ever seeking clarification from Webull.\" \"Webull's U.S. business is conducted from its global headquarters in St. Petersburg, Florida and its office in New York City, while U.S. customer data is stored in the U.S. and access to sensitive customer data is controlled by the U.S.,\" the spokesperson said via email.", "source": "CNBC Top News", "pub_date_str": "07 Oct 2026, 07:16 PM IST", "pub_date_relative": "52m ago", "cfa_topics": ["Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "EPFO wage ceiling hiked to \u20b925,000: Likely enhancements in social security coverage \u2014 pension, insurance, explained", "full_content": "The Cabinet last month raised the wage ceiling eligibility for Employees Provident Fund (EPF) coverage by \u20b9 10,000, from the \u20b9 15,000 set in 2014, Union Information and Broadcasting Minister Ashwini Vaishnaw said.\n\nThe hike, which comes after 12 years, seeks to \u201creflect sustained wage growth, rising incomes and continued expansion of formal employment over the intervening years\u201d, the minister said.\n\nFor employees whose EPF contribution was earlier restricted to the \u20b9 15,000 ceiling, the employee contribution can increase. See illustration below:\n\nThe employer's statutory contribution in such a case would also increase from \u20b9 1,800 to \u20b9 3,000. However, the actual impact on an employee's take-home pay will depend on how the employer structures the salary and calculates PF contributions.\n\nThe wage ceiling for membership to the Employees\u2019 Provident Fund Organisation ( EPFO ) has been raised to \u20b9 25,000 per month, bringing an additional 51 lakh employees under mandatory provident fund cover, and widening social security coverage for workers.\n\nNotably, the EPFO also administers pension under the Employees\u2019 Pension Scheme (EPS) and insurance protection under the Employees\u2019 Deposit Linked Insurance Scheme (EDLI). Hence, benefits under these heads are also likely to be enhanced.\n\nThe latest EPFO data shows around 7.98 crore contributing members across about 7.68 lakh contributing establishments, while the EPS provides pension benefits to around 82 lakh pensioners.\n\nThe EPFO's pension benefit is available to all subscribers who have had an account for more than 10 years. Under this, 8.33% of the 12% employer contribution to your EPF account is directed towards your EPS account. Further, the government also contributes 1.16% (subject to wage ceiling) towards the fund.", "source": "LiveMint Money", "pub_date_str": "07 Oct 2026, 07:11 PM IST", "pub_date_relative": "57m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "US Stock Market Today: Dow Tumbles Over 300 Points, Nasdaq, S&P 500 In Red As Yields Climb", "full_content": "Nasdaq Composite dropped 0.54% to 27,451.32, S&P 500 declined 0.40% to 7,787.71, while Dow Jones Industrial Average traded 0.67% or 347 points lower at 51,173.8.", "source": "NDTV Profit", "pub_date_str": "07 Oct 2026, 07:11 PM IST", "pub_date_relative": "57m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Used car prices fall in Q3, while demand for fuel-efficient vehicles grows", "full_content": "DETROIT \u2014 Used vehicle prices are forecast to fall more than previously expected this year, as high gas prices and broader inflationary costs hit Americans' pocketbooks.\n\nCox Automotive on Wednesday lowered its forecast for the company's Manheim Used Vehicle Value Index, from a 2% increase to a rise of only 0.2% for the year. That slight increase would mark the third consecutive year of relatively flat pricing after large increases and then declines during the pandemic.\n\nThe lower forecast follows a 1.95% decline in the index from July to September, including a 0.6% decline last month compared to a year earlier. September marked the first time since March 2025 that the monthly index hadn't been higher than a year earlier.\n\n\"As we enter Q4, interest rates are rising, consumer sentiment is falling, and yet a wealth effect from strong and sustained financial-asset growth is providing some offsetting cushion. Many metrics we watch are converging back toward pre-pandemic norms, but the road to get there has been anything but smooth,\" Cox Automotive's chief economist, Jeremy Robb, said in a release\n\nThe historical average for the Manheim index is about a 2.3% year-over-year gain. Non-adjusted wholesale used-vehicle prices fell 1.2% year over year in September and 1.3% from August as depreciation accelerated in the third quarter, Cox said.\n\nThe index is a closely monitored gauge for used vehicle prices that tracks the pricing of used vehicles sold at Manheim U.S. wholesale auctions. Retail prices for consumers traditionally follow changes in wholesale costs.\n\nCox noted electric vehicle sales and off-lease volume continued to grow, reshaping used-vehicle market dynamics as EVs and smaller, fuel-efficient vehicle values increased during the quarter. That compares with poor performances of large trucks and SUVs, the company said.\n\n\"The first half of the year actually showed more appreciation than usual, even in the face of higher fuel prices.", "source": "CNBC Top News", "pub_date_str": "07 Oct 2026, 07:07 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Dow falls 500 points as 10-year yield rises to highest level in 24 years: Live updates - CNBC", "full_content": "Dow falls 500 points as 10-year yield rises to highest level in 24 years: Live updates CNBC Dow drops 451 points as Treasury yields hit 24-year highs Quartz Stock Market Today: Dow Futures Fall, 30-Year Treasury Yield Hits Fresh 24-Year High \u2014 Live Updates WSJ Wall St opens lower as bond yields and oil rebound; Fed minutes in focus Reuters U.S. equities tumble while Treasury yields push higher Seeking Alpha", "source": "Google News Business", "pub_date_str": "07 Oct 2026, 07:06 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Fixed Income", "Derivatives"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "RBI Removes Paytm Payments Bank From List Of Scheduled Banks", "full_content": "The RBI has formally removed Paytm Payments Bank from the list of scheduled banks after cancelling its banking licence over regulatory non-compliance.", "source": "NDTV Profit", "pub_date_str": "07 Oct 2026, 07:06 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "NSE cautions investors over pricey overseas ETFs as demand surges", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a NSE cautions investors over pricey overseas ETFs as demand surges National Stock Exchange of India Share Price The Economic Times daily newspaper is available online now. Read Today's Paper NSE cautions investors over pricey overseas ETFs as demand surges SECTIONS NSE cautions investors over pricey overseas ETFs as demand surges Reuters Last Updated: Oct 07, 2026, 07:05:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The NSE has cautioned investors about the escalating hazards linked to international exchange-traded funds as they experience steep premiums. While certain ETF prices have risen dramatically, their underlying net asset values stay constant. This disparity is primarily due to supply limitations and new regulations impacting ETF units. Investors should proceed cautiously; purchasing at inflated prices may result in sudden declines.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "07 Oct 2026, 07:05 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "'Calibrated' Turn Vs Off-Cycle Shocker: How The New RBI Hike Cycle Compares To 2022", "full_content": "After a 43-month pause, the RBI has resumed rate hikes to tame inflation\u2014but economists warn this new tightening cycle carries stagflationary whispers.", "source": "NDTV Profit", "pub_date_str": "07 Oct 2026, 07:01 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "TCS Q2 results 2026: Expectations, date and time, dividend announcement schedule, quarterly earnings preview", "full_content": "Tata Consultancy Services (TCS), India's largest IT services company, is set to announce its financial performance for the second quarter of FY27 on Thursday, October 8, with the Street largely anticipating another soft quarter from the tech bellwether.\n\nIndian tech majors are expected to post a modest sequential performance, rather than a meaningful revival in demand. Accenture's latest results support this view, with its management stating that overall demand, including discretionary spending, did not meaningfully change during the quarter.\n\nHowever, analysts expect TCS Q2 to be better than Q1, based on an uptick in July and August. However, September is likely to have been affected by rate hikes and weakness in the Middle East, particularly in the manufacturing and retail sectors.\n\nTCS had released its June-quarter results after market hours and is therefore expected to announce its Q2FY27 results after market hours, around a similar time. The board is also expected to consider an interim dividend.\n\nThe company has announced a interim dividend of \u20b9 12 per equity share in Q1. In FY26, TCS returned \u20b9 39,571 crore to shareholders through dividends.\n\nMeanwhile, since the release of last quarter's results, TCS shares have corrected 11%, widening their year-to-date losses to 35% and putting the stock on track for its biggest annual drop since 2008. Investors are now likely to focus on the company's deal wins, revenue growth, margins, management commentary, and outlook for the remainder of FY27.\n\nThe global economic backdrop has worsened since June, as global central banks have begun hiking interest rates in an effort to control inflationary pressures, which have been brought about by the ongoing war in West Asia.\n\nDomestic brokerage firm JM Financial expects TCS to report a 0.5% quarter-on-quarter (QoQ) constant-currency (CC) revenue growth in Q2 FY27, with a 20-bps sequential decline in CC growth.", "source": "LiveMint Markets", "pub_date_str": "07 Oct 2026, 07:00 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Eternal Vs TCS: Q-Comm Startup Flips IT Giant In Nifty 50 Weightage. Should You Buy, Sell Or Hold?", "full_content": "The divergence in index weightage also highlights the contrasting investment narratives around the two stocks.", "source": "NDTV Profit", "pub_date_str": "07 Oct 2026, 06:59 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Bank Of India Raises Repo-Linked Lending Rate After RBI Hike \u2014 What You Should Know", "full_content": "Bank of India raised repo based lending rate by 25 basis points to 5.50% and effective repo based lending rate from 8.10% to 8.35%, while mark up rate remains the same at 2.85%.", "source": "NDTV Profit", "pub_date_str": "07 Oct 2026, 06:55 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "France is caught between angry students and unforgiving bond markets", "full_content": "France's student protests took a breather on Wednesday after weeks of unrest, but market pressure on the French government intensified ahead of crucial budget negotiations due to start next week.\n\nThe student rallies, now stretching into their third week after violent clashes with police, mass school closures and thousands of arrests, are expected to resume on Thursday. What began as a Parisian student protest pressuring the government to address teacher shortages, lengthy timetables and derelict schools has evolved into a nationwide movement that has garnered support from people of various ages.\n\nPrime Minister S\u00e9bastien Lecornu said Wednesday morning that officials would use the pause in demonstrations to open dialogue with high school students. He is due to address the nation on Wednesday evening.\n\n\"The demands [of students] are numerous and vary from one high school to the next. They must be assessed objectively, school by school,\" he said in a post on X on Tuesday. \"Substitutes, the state of the buildings, guidance, organization of school time, high school democracy: all topics must be put on the table.\"\n\nBut he added that conversations must be had \"without giving in to politicized manipulations.\"\n\nLecornu's government has accused radical-left party La France Insoumise (LFI) of hijacking the student movement. Some of the party's sitting politicians have publicly backed the student protests.\n\nThe unrest in France has highlighted and intensified the economic and political challenges facing the country.\n\nIn the coming weeks, the French government faces tough budget negotiations, during which it must convince lawmakers in the politically divided National Assembly \u2014 which includes the far-right National Rally , the left-wing New Popular Front and Lecornu's center-right grouping \u2014 to agree to a fiscal adjustment worth tens of billions of euros.", "source": "CNBC Top News", "pub_date_str": "07 Oct 2026, 06:53 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "HUL Q2 Results: Date, Time, Dividend News, Earnings Call Schedule And More", "full_content": "The firm will hold a presentation for investors and analysts to discuss its financial results for the quarter and a half year ended Sept 30, 2027 on Oct. 28, 2026.", "source": "NDTV Profit", "pub_date_str": "07 Oct 2026, 06:48 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Looking West For Alpha? Three Reasons Why Indian Investors May Eye US Stocks Post-RBI Rate Hike", "full_content": "For investors, a primary driver behind potential shift towards Wall Street is the historical disconnect between domestic rate hikes and currency resilience.", "source": "NDTV Profit", "pub_date_str": "07 Oct 2026, 06:37 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "RBI removes Paytm Payments Bank from list of scheduled banks after cancellation of banking licence \u2014 What we know", "full_content": "The Reserve Bank of India has removed Paytm Payments Bank from its list of recognised scheduled banks due to non-compliance with regulations. The bank's licence, cancelled in April 2023, was deemed detrimental to depositors' interests.", "source": "LiveMint Money", "pub_date_str": "07 Oct 2026, 06:34 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Margin boost: Jefferies picks 3 bank stocks to gain the most from RBI rate hikes", "full_content": "Jefferies expects RBI\u2019s 25-basis-point rate hike and calibrated tightening stance to support bank earnings, particularly ICICI Bank, SBI and Axis Bank. Faster loan repricing could drive margin expansion, while smaller private banks, NBFCs and life insurers may face greater pressure.", "source": "Economic Times Markets", "pub_date_str": "07 Oct 2026, 06:20 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "S&P 500 record, ICE's economic chill, Webull's China ties and more in Morning Squawk", "full_content": "Here are five key things investors need to know to start the trading day.", "source": "CNBC World Economy", "pub_date_str": "07 Oct 2026, 06:20 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Valiant Organics among 5 commodity stocks that hit 52-week highs and rallied up to 48% in a month", "full_content": "The Sensex fell 429 points to 72,638 on Wednesday, but five BSE Commodities Index stocks hit fresh 52-week highs. Valiant Organics led gains, followed by OCCL, Tatva Chintan Pharma Chem, Fine Organic Industries and Manali Petrochemicals.", "source": "Economic Times Markets", "pub_date_str": "07 Oct 2026, 06:14 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Repo rate hike may raise borrowing costs, but real estate demand likely to be resilient: Realtors", "full_content": "The Reserve Bank of India increased the repo rate by 25 basis points to 5.50 percent. Real estate companies in West Bengal anticipate a slight rise in borrowing costs for home loans. Developers believe that genuine homebuyers will remain undeterred in the long term. Concerns about affordability for first-time buyers may arise during the festive season. Developers are introducing flexible payment plans to sustain demand despite these pressures.", "source": "Economic Times Markets", "pub_date_str": "07 Oct 2026, 06:11 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "10-year Treasury note yield hits highest level since 2002 as traders brace for key bond sale", "full_content": "U.S. Treasury yields climbed Wednesday after retreating in the previous session, as oil prices moved higher.", "source": "CNBC Top News", "pub_date_str": "07 Oct 2026, 06:11 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Landmark Group raises Rs 330 crore SBI finance for Gurugram project", "full_content": "Landmark Group has raised Rs 330 crore in construction finance from the State Bank of India. This funding is aimed at developing Landmark One, a Grade A+ commercial project in Gurugram. The development boasts spacious floor plates and extensive parking options. Private equity investments in Indian real estate have significantly increased, showing a 23% rise year on year.", "source": "Economic Times Markets", "pub_date_str": "07 Oct 2026, 06:09 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Derivatives", "Alternative Investments"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "RBI rate hike dampens consumption stocks\u2019 festive cheer", "full_content": "Unlike past ra aying it could make things worse", "full_content": "His comments come as rising Middle East crude exports and an emergency G7 stockpile release appear to have helped to ease supply fears.", "source": "CNBC Top News", "pub_date_str": "07 Oct 2026, 05:55 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Billionaires like former Twitter CEO Parag Agrawal are bullish on artificial intelligence: Check options to invest in AI", "full_content": "India's AI sector is gaining prominence, with 19 individuals listed on the M3M Hurun India Rich List 2026, collectively worth \u20b93.07 lakh crore.&nbsp;", "source": "LiveMint Money", "pub_date_str": "07 Oct 2026, 05:54 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "RBI Policy: Complex oil math explains rise in FY27 inflation estimates", "full_content": "The Reserve Bank of India revised its crude oil price projections for the fiscal year 2026-27. This adjustment has led to increased inflation forecasts, now projected at 5.2% for FY27. The bank notes ongoing supply pressures and volatility in international oil prices contributing to these changes. India's merchandise trade deficit has also widened due to rising imports, especially in crude oil.", "source": "Economic Times Economy", "pub_date_str": "07 Oct 2026, 05:50 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "ET Alpha Wealth Summit 2.0: The ideas, trends and opportunities shaping future of wealth creation", "full_content": "ET Alpha Wealth Summit 2.0 bri     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
