o ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "20 Oct 2026, 09:30 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Bank Indonesia faces mounting pressure to hike after MSCI threat fuels market rout", "full_content": "Bank Indonesia faces mounting pressure to raise interest rates on Wednesday as economists revise their forecasts after global index provider MSCI warned it may downgrade the country's stock market from emerging-market status, setting off a selloff in stocks and the rupiah.\n\nCitibank now expects a pre-emptive 50 basis-point increase to 6.25%, abandoning its earlier call for no change. Capital Economics and Permata Bank expect a 25 basis-point hike to 6%. The central bank has held its benchmark seven-day reverse repurchase rate at 5.75% since June.\n\nMSCI said Friday it is considering moving Indonesia to \"standalone\" from the emerging-market status it has held since 1989, causing the Jakarta Composite Index to suffer the worst two-day sell-off recorded, before recovering about 3% Tuesday after authorities announced steps to improve market transparency and price discovery, including expelling tightly held companies from the flagship index.\n\nMeanwhile, rupiah weakened to 18,030 per dollar on Tuesday, near its June record low, falling about 8% this year.\n\n\"Not delivering a rate hike [on Wednesday] would run the risk of disappointing investors and fueling further downward pressure on the currency,\" said Jason Tuvey, deputy chief emerging markets economist at Capital Economics. \"A decision to hold rates on Wednesday could also revive concerns among investors that Bank Indonesia is kowtowing to political pressure.\"\n\nCiti's Helmi Arman said a hike would aim to stop equity outflows spilling into bonds and prompting capital flight by domestic investors. He expects it to be a \"one-off\" followed by other support such as government foreign-currency borrowing or another round of bilateral currency swaps with foreign central banks.\n\nThe central bank has already raised rates by a combined 100 basis points since May. Headline inflation quickened to a three-month high of 3.28% in September, within the 1.5%-3.5% target range, while core inflation eased to 2.84%.", "source": "CNBC Top News", "pub_date_str": "20 Oct 2026, 09:29 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Equity Investments", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "India eyes a $20 billion pot of gold in New Zealand as its trade pact goes live", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a India eyes a $20 billion pot of gold in New Zealand as its trade pact goes live The Economic Times daily newspaper is available online now. Read Today's Paper India eyes a $20 billion pot of gold in New Zealand as its trade pact goes live SECTIONS India eyes a $20 billion pot of gold in New Zealand as its trade pact goes live ET Online Last Updated: Oct 20, 2026, 09:25:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The free trade agreement between India and New Zealand promises to promote trade and enhance professional movement. While some goods may enjoy duty-free status, a significant rise in merchandise exports might take time. However, New Zealand's engagement in several service sectors holds potential benefits for Indian companies. The agreement also opens up new job opportunities for Indian students and creates pathways for skilled professionals.\n\nOne company, 2 words. Bond yield and CDS: Will they decide the fate of global markets?\n\nBusiness of Odd Things: Inside an industry that farms fish that nobody is meant to eat\n\nWar's second-order effects are becoming visible in critical sectors\n\nUS mid-term elections \u2013 Part 2: What does it mean for Trump to lose control of Congress?\n\nHomebuyers wait as NCLT panel picks holes in unfinished Jaypee projects\n\nWhat is the real impact of 13x jump in cash transfers to women?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "20 Oct 2026, 09:25 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Fixed Income", "Derivatives", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Top banking share to buy after Q2 results 2026? HDFC Bank vs Axis Bank vs ICICI Bank vs Yes Bank vs IDBI Bank - Details", "full_content": "Top banking share to buy : Amid ongoing earnings season, private sector banks like HDFC Bank , ICICI Bank , Axis Bank, Yes Bank and IDBI Bank have already released their financial results for the quarter ending on 30 September, 2026.\n\nWhile market analysts remain bullish on banking stocks, they have identified the companies best positioned to perform following their Q2 results for 2026.\n\nHDFC Bank posted a 4.6% year-on-year increase in net profit to \u20b9 19,510 crore in the second quarter of FY27, compared with \u20b9 18,641 crore in the corresponding quarter of the previous financial year.\n\nThe bank\u2019s net interest income (NII), calculated as the difference between interest earned and interest expended, grew 9.7% year-on-year to \u20b9 34,620 crore for the quarter ended September 30, 2026, from \u20b9 31,550 crore a year earlier. Its net interest margin (NIM) stood at 3.16% on total assets and 3.32% on interest-earning assets.\n\nAccording to Seema Srivastava, Senior Research Analyst at SMC Global Securities , HDFC Bank showcases outstanding cost management with an industry-best cost-to-income ratio of 39.1%, strong credit quality (GNPA of 1.11%), and an impressive Capital Adequacy Ratio (CAR) of 18.9%.\n\nAxis Bank posted a 37.6% year-on-year rise in net profit to \u20b9 7,003.3 crore in Q2 FY27. Its net interest income (NII) grew 11.8% to \u20b9 15,371.4 crore, surpassing the estimated \u20b9 14,970 crore.\n\nThe bank reported a net interest margin (NIM) of 3.36%, which stood at 3.47% after excluding the impact of FCNR-B deposits. Asset quality also improved, with the gross non-performing asset (NPA) ratio declining to 1.16% from 1.46% a year ago. The net NPA ratio eased to 0.35% from 0.44% over the same period.\n\n\u201c Axis Bank also displayed stable execution with 23% YoY advance growth, controlled credit costs, and an improved GNPA ratio of 1.16%, though its lower CASA ratio (36%) and moderate NIM (3.36%) place it slightly behind ICICI and HDFC Bank,\u201d said Srivastava.", "source": "LiveMint Markets", "pub_date_str": "20 Oct 2026, 09:08 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Global Market: South Korea's Elice shares plunge 28% in market debut as data centre stocks shunned", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a M argest CFA L1 topic by weight."}], "updated_at": "20 Oct 2026, 11:40 AM IST", "total_stories": 315};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
