ay 9th Oct? Expert decodes", "full_content": "TCS share price prediction post Q2: Tata Consultancy Services marginally beat the Street estimates after reporting its second quarter result for the financial year 2026-27 on Thursday, October 8. The Tata Group\u2019s flagship IT software services provider reported a slightly higher-than-expected September-quarter revenue. With TCS Q2 result out today, all eyes are on how the IT stock will perform in the next trading session, i.e. on Friday, October 9.\n\nTCS share price stock can see a slightly positive opening on Friday followed by range-bound movement throughout the day, according to Tushar Badjate, Director, Badjate Wealth1 Pvt. Ltd.\n\nFor Friday, Tushar Badjate is \u201cnot expecting fireworks\u201d. He believes that the stock may see flat to slightly positive opening.\n\n\u201cTechnically, \u20b9 2,000 is the level I'm watching. The stock found support there after the August fall. If it holds, \u20b9 2,250 to 2,300 is possible over the next few months. For Friday, I'd expect it to trade somewhere between \u20b9 2,080 and \u20b9 2,200,\u201d he explained.\n\nTCS Q2 profit came in better than what the Street was expecting, Badjate noted, highlighting the company\u2019s order book as one of the key positives. The IT heavyweight has signed $9.6 billion of deals in a quarter where the West Asia situation had clients holding back.\n\nThe Mumbai-headquartered firm's AI momentum remained strong, with annualised AI revenues now exceeding $3 billion, and it has crossed 10% of total revenue. But AI is not adding to the business yet, rather it is eating into the older business, Badjate pointed out.\n\n\u201cTCS does roughly $7.6 billion of revenue a quarter. A 0.5% growth adds only about $38 million. In the same quarter, annualised AI revenue went up by $500 million, which works out to about $125 million for the quarter. So AI added around $125 million, while total revenue grew by only $38 million.", "source": "LiveMint Markets", "pub_date_str": "08 Oct 2026, 07:20 PM IST", "pub_date_relative": "55m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "FPI selling accelerates in October; \u20b931,000 crore withdrawn in 4 sessions: What\u2019s next for Indian stock market?", "full_content": "FPIs extended their selling spree in the Indian stock market in October, withdrawing another \u20b9 31,282 crore in just five trading sessions. This came on top of the \u20b9 35,857 crore worth of selling in September, according to NSDL data.\n\nThe severe selling by overseas investors came amid rising inflationary pressures, driven by escalating tensions in the Middle East, while the bond market sell-off showed no signs of slowing, with US Treasuries hovering near multi-decade highs.\n\nDomestic factors also turned unfavourable, with poor monsoon rains linked to El Ni\u00f1o compounding price pressures in Asia\u2019s third-largest economy. The RBI was the latest central bank to raise interest rates, joining the US Federal Reserve, Bank of Japan, and European Central Bank in the fight against rising price pressures.\n\nHigher crude oil prices were among the major reasons behind the increased pressure on Indian equities. For India, higher oil prices are particularly uncomfortable because they simultaneously raise the import bill, inflation risks, and pressure on the currency.\n\nBrent continued to remain above $100 per barrel, while recent media reports showed that the White House had asked the Pentagon to draw up strike options against Iran that could be executed before the midterm elections. US President Donald Trump also said on Wednesday that he no longer wanted a deal with Iran.\n\nMeanwhile, higher Treasury yields, along with a rising US dollar, are also influencing FPI sentiment. The yield on the 10-year US Treasury hit a 24-year high of 5.36% on Wednesday and remained close to that level today, hovering around 5.35%. The 30-year Treasury bond yield also remained around a 24-year high.\n\nInvestors are demanding greater compensation to hold bonds amid concerns about inflation, government spending, and surging corporate borrowing to finance the artificial-intelligence buildout.", "source": "LiveMint Markets", "pub_date_str": "08 Oct 2026, 07:16 PM IST", "pub_date_relative": "58m ago", "cfa_topics": ["Quantitative Methods", "Economics", "Equity Investments", "Fixed Income", "Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "TCS Q2 Concall Live: AI Revenue Crosses $3.1 Billion, 10% Of Overall Revenue", "full_content": "TCS Q2 Results Live: Track the earnings announcement, dividend decision, management commentary, key financial metrics and TCS share price reaction here.", "source": "NDTV Profit", "pub_date_str": "08 Oct 2026, 07:13 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Republican megadonors dominate 2026 midterm election as crypto and AI money surges, CNBC analysis finds", "full_content": "The biggest donors in the 2026 midterm election are breaking decisively toward Republican candidates and causes, a CNBC analysis of Federal Election Commission records found.\n\nFourteen of the 20 largest donors and donor groups this election cycle have exclusively or nearly exclusively backed GOP candidates or aligned groups, according to a CNBC analysis of federal campaign-finance records. Together, the 20 account for $1.2 billion, or about an eighth of the roughly $9.8 billion raised this election cycle through Sept. 25 across the campaigns and super PACs CNBC examined.\n\nCNBC analyzed FEC records for contributions reported during the 2026 election cycle, covering Jan. 1, 2025, through the latest filings available, combining spouses and closely affiliated donor entities where appropriate and removing duplicate or superseded transactions. The analysis of disclosed federal political committee contributions provides the most up-to-date snapshot of who is financing the 2026 midterms and shows a stark divide in where the biggest donors are putting their money.\n\nDemocratic megadonors, meanwhile, are increasingly bypassing the national party, though in some cases they're giving directly to candidates instead.\n\nWith less than four weeks until Election Day , some of the biggest six-figure checks that once routinely flowed to the Democratic National Committee haven't materialized. Fundraisers told CNBC the hesitation reflects lingering 2024 election \"trauma\" from Kamala Harris' defeat, fears of democratic socialism and disillusionment with the DNC's leadership in Washington.\n\n\"We don't have the kind of donors they've got,\" said Matt Bennett of the centrist Democratic think tank Third Way.", "source": "CNBC Top News", "pub_date_str": "08 Oct 2026, 07:10 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "US Stock Market Today: Dow, S&P 500, Nasdaq In Red As Oil, Treasury Yields Jump", "full_content": "Nasdaq Composite fell 0.47% to 27,410.59, S&P 500 slid 0.38% to 7,772.41, while Dow Jones Industrial Average traded 0.33% lower at 51,009.78.", "source": "NDTV Profit", "pub_date_str": "08 Oct 2026, 07:08 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Fixed Income"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "RBI bid to drain surplus liquidity and improve rate transmission sees muted response", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a RBI bid to drain surplus liquidity and improve rate transmission sees muted response The Economic Times daily newspaper is available online now. Read Today's Paper RBI bid to drain surplus liquidity and improve rate transmission sees muted response SECTIONS RBI bid to drain surplus liquidity and improve rate transmission sees muted response By Atmadip Ray , ET Bureau Last Updated: Oct 08, 2026, 07:03:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Banks parked just Rs 79,655 crore in the central bank\u2019s 29-day variable rate reverse repo (VRRR) auction, less than half the Rs 2 lakh crore absorption planned in the offer. Draining liquidity is considered crucial for quicker and effective transmission of increases in policy rates.\n\nThe NBFC saga - Part 2: Line drawn in 2006 is reason for the headlines today\n\nAirlines Q2 turbulence: Fewer passengers, rising fares and a crude shock\n\nBritannia\u2019s next big bet for young India lies beyond biscuits\n\nThe world is witnessing a bond rout. Why should it matter to you?\n\nQ2 earnings season: Will it settle or add to confusion in the stock market?\n\nThe NBFC saga - Part 1: How RBI moved from protecting depositors to policing systemic risk\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "08 Oct 2026, 07:03 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "PepsiCo to cut costs as weak North America business hurts annual core profit forecast", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a PepsiCo to cut costs as weak North America business hurts annual core profit forecast Powered By The Economic Times daily newspaper is available online now. Read Today's Paper PepsiCo to cut costs as weak North America business hurts annual core profit forecast SECTIONS PepsiCo to cut costs as weak North America business hurts annual core profit forecast Reuters Last Updated: Oct 08, 2026, 07:00:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis PepsiCo is gearing up to implement further cost-cutting measures in response to rising input costs and a slowdown in consumer demand. CEO Ramon Laguarta indicated that actionable strategies would be rolled out shortly to bolster investments. The company has revised its fiscal 2026 core earnings per share growth estimate to a modest 1% to 2%, down from previous figures, while annual organic revenue growth is now anticipated at approximately 3%.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "08 Oct 2026, 07:00 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Options traders start calling bottom on bond rout after 'bullet bid' 10-year auction", "full_content": "Calling a bottom in the nonstop U.S. Treasury bond sell-off might seem crazy, but a handful of options traders look increasingly willing to do it.\n\nTrading in the iShares 20+ Year Treasury Bond ETF (TLT) Wednesday was very call-heavy on volume that was 50% above the 30-day average, according to data compiled from Cboe LiveVol and SpotGamma. Traders bought almost 370,000 calls versus under 100,000 puts in TLT, and sold more puts than they bought.\n\nNine of the top 10 traded contracts in the ETF were calls, and while there was some call-selling, volume and premium was on the side of bulls, suggesting traders think the risk-reward of betting on higher yields isn't great. A rally in the TLT would mean a decline in rates.\n\nWhat's more is the most popular trade in the monthly Oct. 30 expiry for TLT was buying the 82-strike call. That's a 10-cent contract that traded about 16,000 times today, and needs long bonds to recover all their lost ground since Sep. 22 \u2013 the particularly nasty stretch of this year's sell-off that saw TLT drop 6% and the 30-year yield passing 5.6%.\n\nMost of the buying came from one aggressive buyer at 10:01 ET, who spent at least $250,000 buying 25,00 of the 82-strike calls expiring Oct. 16 and 30th, and 5,000 of the 80-strike calls expiring Oct. 30. The trades weren't massive by dollar amount, but they marked the biggest purchase of any contracts for month-end expiry, and came shortly before an auction of 10-year notes that sparked a strong rally in bonds.\n\niShares 20+ Year Treasury Bond ETF, (TLT) \"Tens had a bullet bid today \u2013 auction demand has been very strong,\" Jim Perry, founder and chief investment officer of Perry International Capital Partners, said in a text. \"Demand is strong. It was `fill my market order at market prices because I want them.'\"\n\nAnother key test arrives today with the auction of 30-year bonds at 1 p.m.", "source": "CNBC Top News", "pub_date_str": "08 Oct 2026, 06:59 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income", "Derivatives", "Portfolio Management"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Inflation on many everyday items was entirely due to tariffs, NY Fed says", "full_content": "The cost of many everyday items would have declined last year and early this year without President Donald Trump 's tariffs, according to the New York Federal Reserve .\n\nThe cost of 67 categories of goods was 2.9 percentage points higher as of February thanks to tariffs, according to a paper from a team of researchers at the central bank's New York arm.\n\nWithout the levies, the team found that prices for the products they studied would have pulled back by almost 1%.\n\nThe New York Fed's report offers the clearest evidence yet of the impact of Trump's tariffs \u2014 a core policy of his most recent campaign and second term in the White House \u2014 on consumers' wallets. Economists had widely expected his levies to push up prices, though the precise effects had been hard to estimate due to the changing nature of the policy and the lack of transparency on how companies set their prices.\n\nThe researchers didn't say which 67 types of goods they evaluated.\n\nFor each percentage point increase in the average tariff, the team said that consumer goods prices were higher by roughly a quarter of a percent a year later.\n\nAnnual price growth in the dozens of goods they tracked peaked at the start of 2026, according to the report. But consumers are still expected to pay elevated prices into 2027 as a result of the policy, it said.\n\nRoughly two-thirds of the tariff-related price impact has directly come from the levies themselves, according to the New York Fed's report. The remaining increase was driven by knock-on effects, such as U.S.-based companies that use imported parts and materials in their products.", "source": "CNBC Top News", "pub_date_str": "08 Oct 2026, 06:58 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "China has no need or intention to weaken yuan for trade edge, central bank says", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a China has no need or intention to weaken yuan for trade edge, central bank says Powered By The Economic Times daily newspaper is available online now. Read Today's Paper China has no need or intention to weaken yuan for trade edge, central bank says SECTIONS China has no need or intention to weaken yuan for trade edge, central bank says By Reuters Last Updated: Oct 08, 2026, 06:58:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis China's central bank stated it does not intend to depreciate the yuan for competitive trade advantages. It emphasized that the market plays a decisive role in determining exchange rates. The central bank will not set exchange rate targets nor intervene in long-term trends. Starting in 2027, additional foreign exchange data will be reported to the International Monetary Fund.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Ec     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
