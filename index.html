 rally in crude oil-linked stocks?", "full_content": "Shares of oil and gas companies, including Indian Oil Corporation (IOC), Hindustan Petroleum Corporation (HPCL), Bharat Petroleum Corporation (BPCL), and GAIL, climbed up to 3% in intraday trade on the BSE on Wednesday, 30 September, amid a drop in crude oil prices.\n\nStocks like Petronet LNG, Indraprastha Gas, and Reliance Industries also gained significantly during the session.\n\nOn the other hand, shares of upstream exploration and production companies, such as ONGC and Oil India, declined 1% and 3%, respectively, during the session.\n\nCrude oil-linked stocks are seeing decent gains despite a decline in oil prices. Crude oil prices suffered their biggest drop in more than a week, falling 2.5% on Tuesday, amid signs that Middle East supply has risen to near pre-war levels after Saudi Arabia resumed shipments from its Red Sea port of Yanbu, which avoids the Strait of Hormuz.\n\nInternational crude oil benchmark, Brent Crude, traded near $103 per barrel on Wednesday morning.\n\nA drop in crude prices tends to benefit oil marketing stocks, as it boosts their marketing margins on petrol and diesel retail sales. However, a drop in oil prices is negative for upstream exploration and production companies, as their revenues and realisations decline.\n\nAccording to InCred Capital Wealth, oil prices will get rebalanced before gas. It expects Brent at $88, $76 and $72 per barrel over the calendar years 2026 to 2028.\n\nThe financial services company underscored that the International Energy Agency (IEA) expects a 4.6-5.1mbpd oil surplus in 2027 as about 8mbpd of shut-in and rerouted supply returns, after a 1.7mbpd deficit in 2026.", "source": "LiveMint Markets", "pub_date_str": "30 Sep 2026, 11:55 AM IST", "pub_date_relative": "28m ago"}, {"title": "IPO GMPs compared: Shah Investor's Home IPO vs SRIT India IPO - Which one is winning in grey market?", "full_content": "Two IPOs \u2014 SRIT India and Shah Investor\u2019s Home \u2014 entered their final day of subscription on Wednesday, 30 September 2026. Both issues are entirely fresh issues, with allotment expected to be finalised on 1 October and listing scheduled for 6 October, subject to the proposed timelines.\n\nThe SRIT India IPO has been fully subscribed 18.74 times so far, led by non-institutional investors (NIIs), who have subscribed 45.91 times, as per BSE data.\n\nMeanwhile, the Shah Investor\u2019s Home IPO has been subscribed 3.74 times, with the NII category leading at 7.68 times.\n\nLet's take a look at grey market premium ( GMP ) trends on the last bidding day:\n\nSRIT India IPO GMP today, or grey market premium, is +33. Considering the upper end of the IPO price band and the current premium in the grey market, the estimated listing price of SRIT India share price was indicated at \u20b9 163 apiece, which is 25.38% higher than the IPO price of \u20b9 130.\n\nOver the past 8 sessions, the IPO GMP has increased from \u20b9 12 to \u20b9 33, a total increase of \u20b9 21. An upward trend was observed in around 57% of the sessions, reflecting a positive shift in grey market sentiment, according to analysts.\n\nSRIT India IPO is a \u20b9 218.40-crore book-built issue, comprising an entirely fresh issue of 1.68 crore shares. The IPO does not have an offer-for-sale ( OFS ) component.\n\nThe company has set the price band at \u20b9 123\u2013 \u20b9 130 per share, with a lot size of 115 shares. Retail investors are required to apply for at least 115 shares, which translates to a minimum investment of \u20b9 14,950 at the upper end of the price band.", "source": "LiveMint Markets", "pub_date_str": "30 Sep 2026, 11:55 AM IST", "pub_date_relative": "29m ago"}, {"title": "TCS, Wipro, other IT stocks rebound up to 6%, snapping 8-day losing streak. Why is Jefferies cautious?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business Ne 1 bidder for RailTel contract worth Rs 250 crore", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a STL Networks shares jump 5% after emerging as L1 bidder for RailTel contract worth Rs 250 crore RailTel Corporation of India Share Price Indus Towers Share Price Tejas Networks Share Price Nelco Share Price GTL Infrastructure Share Price The Economic Times daily newspaper is available online now. Read Today's Paper STL Networks shares jump 5% after emerging as L1 bidder for RailTel contract worth Rs 250 crore SECTIONS STL Networks shares jump 5% after emerging as L1 bidder for RailTel contract worth Rs 250 crore By Surbhi Khanna , ET Online Last Updated: Sep 30, 2026, 11:38:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis STL Networks shares rose 5% after emerging as the lowest bidder for a Rs 249.8 crore RailTel contract to deploy cloud infrastructure at data centre and disaster recovery sites. The company is also planning a wholly owned subsidiary focused on data centres and connectivity. Its stock has gained sharply in recent months.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "30 Sep 2026, 11:38 AM IST", "pub_date_relative": "45m ago"}, {"title": "Hotmail's Sabeer Bhatia reiterates his support for 55% inheritance tax, says it will \u2018primarily affect super-wealthy\u2019", "full_content": "Hotmail co-founder Sabeer Bhatia got the Internet talking with his recent controversial suggestion for a 55% inheritance tax, arguing that opportunities should be based on what individuals build.\n\n\u201cIf India wants to become a truly competitive nation, it should consider a 55% inheritance tax. Opportunity should come from what you build - not simply from what you inherit,\u201d he said on Saturday.\n\nThe post sparked intense social media chatter, with critics debating the proposal's viability and warning it would squeeze middle-class pockets. Reacting to the pushback, Bhatia has now reiterated his proposal to clarify his stance, saying the massive tax would impact only the super-wealthy.\n\n\u201cI simply don't agree. Now, what was built by your father or grandfather should be distributed. Why, it is not the person who has worked hard. The whole family worked hard to earn that status. Wealth distribution is a bizarre suggestion. You may come forward and distribute yours,\u201d a user said.\n\nAnother added, \u201cIt won\u2019t affect the wealthy. They operate the money through trusts, which are protected from any kind of taxation worldwide or debt. So it will, in the end, affect those small farmers who own agricultural land and have it further divided amongst their sons. Govt helps rich.\u201d\n\n\u201cYou trust politicians with your 55% wealth locked in companies, which instantly becomes state-controlled once a major shareholder dies? Scheme to make India communist in one fell swoop,\u201d another user commented.\n\n\u201cImagine imposing inheritance tax on the people who invested earlier for their next generations while sacrificing their own Lifestyles..just because some people burnt all the money they made in their rich lifestyle and built no assets,\u201d a user noted.\n\nHowever, late on Tuesday, Sabeer Bhatia backed his proposed inheritance tax , saying it would only hit the top 2-3% of the super-wealthy who control disproportionate assets, leaving 97-98% unaffected.", "source": "LiveMint Money", "pub_date_str": "30 Sep 2026, 11:35 AM IST", "pub_date_relative": "48m ago"}, {"title": "Avalon Tech shares fall 6% after Rs 883 crore block deal; 3 promoter entities likely sellers", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Avalon Tech shares fall 6% after Rs 883 crore block deal; 3 promoter entities likely sellers Avalon Technologies Share Price Dixon Technologies (India) Share Price Syrma SGS Technology Share Price Amber Enterprises India Share Price Kaynes Technology India Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Avalon Tech shares fall 6% after Rs 883 crore block deal; 3 promoter entities likely sellers SECTIONS Avalon Tech shares fall 6% after Rs 883 crore block deal; 3 promoter entities likely sellers By Veer Sharma , ETMarkets.com Last Updated: Sep 30, 2026, 11:32:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Avalon Technologies shares sharply on Wednesday after an Rs 883 crore block deal involving 6.06% of the company\u2019s equity. Three promoter entities were reported to be the likely sellers. The transaction is estimated to be worth between Rs 861.9 crore and Rs 922 crore.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our T mic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "30 Sep 2026, 11:31 AM IST", "pub_date_relative": "52m ago"}, {"title": "Global Market: Chinese stocks struggle near one-year lows as policy support disappoints", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Global Market: Chinese stocks struggle near one-year lows as policy support disappoints Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market: Chinese stocks struggle near one-year lows as policy support disappoints SECTIONS Global Market: Chinese stocks struggle near one-year lows as policy support disappoints By Anupam Nagar , ETMarkets.com Last Updated: Sep 30, 2026, 11:27:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Chinese blue-chip stocks stayed near one-year lows despite Beijing\u2019s latest credit, mortgage and investment support measures. The CSI 300 was headed for its steepest quarterly decline since 2022, while property and technology shares remained under pressure. Weak domestic demand, subdued trading ahead of the holiday and limited investor confidence continued to weigh on markets.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "30 Sep 2026, 11:27 AM IST", "pub_date_relative": "57m ago"}, {"title": "Molbio Diagnostics shares rally 9% as Jefferies initiates 'high conviction top pick' call for recently listed stock. Why is it bullish?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Molbio Diagnostics shares rally 9% as Jefferies initiates 'high conviction top pick' call for recently listed stock. Why is it bullish? Molbio Diagnostics Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Molbio Diagnostics shares rally 9% as Jefferies initiates 'high conviction top pick' call for recently listed stock. Why is it bullish? SECTIONS Molbio Diagnostics shares rally 9% as Jefferies initiates 'high conviction top pick' call for recently listed stock. Why is it bullish? By Debaroti Adhikary , ETMarkets.com Last Updated: Sep 30, 2026, 11:24:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Molbio Diagnostics shares jumped after Jefferies initiated coverage with a Buy rating and named it a high-conviction top pick. The brokerage set a Rs 1,600 target price, implying 27% upside from Tuesday\u2019s close and nearly 98% above its Rs 807 IPO price. The stock had listed at a 21% premium at Rs 980.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "30 Sep 2026, 11:24 AM IST", "pub_date_relative": "59m ago"}, {"title": "Mahindra Manulife Mutual Fund debuts in SIF segment with an equity long-short fund", "full_content": "Mahindra Manulife Mutual Fund has announced the launch of the MSIF Equity Long-Short Fund, an open-ended equity investment strategy under its specialised investment fund (SIF) platform. The launch marks Mahindra Manulife Mutual Fund's entry into the rapidly evolving SIF segment.\n\nThe fund will invest primarily in listed equities and equity-related instruments while selectively employing short positions through derivatives, said the fund house. It aims to generate long-term capital appreciation by identifying opportunities across different market environments and seeking risk-adjusted returns across market cycles.\n\nAccording to the fund house's media statement, the new fund offer (NFO) opens on 30 September and closes on 14 October. The fund will reopen for continuous sale and repurchase from 26 October 2026.\n\nAbhishek Jaiswal and Aalap Shah will manage the fund, according to Mahindra Manulife. Jaiswal has more than 18 years of investment management experience, while Shah has over 20 years of experience in the Indian equity and derivatives markets.\n\nSIFs are designed to bridge the gap between traditional mutual funds and portfolio management services (PMS), providing sophisticated investors access to differentiated investment strategies within a regulated mutual fund framework.\n\n\"The launch of the MSIF Equity Long-Short Fund marks our entry into the specialised investment fund space and reflects our commitment to offering differentiated investment solutions aligned with evolving investor needs. As markets become increasingly dynamic, investors are looking for strategies that can navigate opportunities across market cycles.", "source": "LiveMint Money", "pub_date_str": "30 Sep 2026, 11:20 AM IST", "pub_date_relative": "1h ago"}, {"title": "8th Pay Commission: Shamli pensioners' 12 demands include coverage for retirees before 1 Jan 2026", "full_content": "Retired employees and pensioners staged a protest at the Collectorate in Shamli, Uttar Pradesh, on Tuesday, seeking the inclusion of government employees who retired before 1 January 2026 within the scope of the 8th Pay Commission.\n\nThe retired employees and pensioners' association raised a 12-point set of demands and submitted a memorandum to Prime Minister Narendra Modi and Uttar Pradesh Chief Minister Yogi Adityanath through the District Magistrate.\n\nAccording to a report by Dainik Bhaskar , the protesters highlighted a lack of clarity over the treatment of older pensioners following the constitution of the 8th Pay Commission. The association also argued that previous pay commissions did not create such a distinction between employees and pensioners based on their date of retirement.\n\nAccording to the report, the association demanded that no distinction be made by date of retirement and that the pensions of older retirees be revised as well. It also sought the restoration of the old pension system and the exemption of pension income from tax.\n\nOther key demands included a 5% increase in the pension every 5 years after age 65 and an end to deductions related to pension commutation after 10 years. The pensioners also sought payment of 18 months of dearness allowance/dearness relief (DA/DR) arrears withheld during the Covid-19 pandemic.\n\nThe memorandum further called for dearness allowance above 50% to be merged with basic pension. The association also sought interim relief for employees, teachers and pensioners, citing delays in the Pay Commission process.\n\nFor senior citizens, the pensioners demanded a 50% concession on railway fares, along with an increase in the cashless treatment limit under Ayushman Bharat to \u20b9 10 lakh. They also called for the creation of a \u2018Senior Citizens Commission\u2019.\n\nAssociation officials said signature petitions outlining their demands had previously been sent to the Prime Minister\u2019s Office .", "source": "LiveMint Money", "pub_date_str": "30 Sep 2026, 11:19 AM IST", "pub_date_relative": "1h ago"}, {"title": "New IPO listings today: Price gains - Adroit Industries, Elevate Campuses, Swastika Infra, Armee Infotech shares debut", "full_content": "New listings today : Around four new mainboard initial public offerings (IPOs) - Adroit Industries (India) IPO, Elevate Campuses IPO, Swastika Infra, and ArMee Infotech IPO - made their stock market debut on Wednesday, 30 September.\n\nAdroit Industries share price made a strong debut on Dalal Street on Wednesday, September 30. The stock opened at \u20b9 250 on the BSE, marking an 86.57% premium over its IPO price of \u20b9 134. On the NSE, the shares began trading at \u20b9 235, representing a 75.37% premium to the issue price.\n\nAdroit Industries shares hit 5% upper circuit at \u20b9 248.39 per share, after blockbuster debut.\n\nThe \u20b9 150.71-crore initial public offering (IPO) had received a strong response from investors during its three-day subscription window. By the close of bidding on September 25, the issue had been subscribed 176.85 times, with investors bidding for 139.23 crore shares compared with the 78.73 lakh shares available for subscription.\n\nElevate Campuses share price made a subdued debut on the stock exchanges on Wednesday. The stock opened at \u20b9 355.10 on the NSE, marking a 1.91% discount to its IPO price of \u20b9 362 per share. On the BSE, the shares listed at \u20b9 356.50, representing a 1.52% discount to the issue price.\n\nElevate Campuses shares fell over 3% after the listing, touching an intraday low of \u20b9 321 per share on NSE.\n\nThe \u20b9 2,100-crore initial public offering (IPO) received a subscription of 1.79 times during its three-day bidding window from September 23 to September 25.\n\nSwastika Infra share price made a positive debut on the stock exchanges on Wednesday. The stock listed at \u20b9 200 apiece on both the NSE and BSE, against its issue price of \u20b9 185, marking an 8.11% premium on its listing.", "source": "LiveMint Markets", "pub_date_str": "30 Sep 2026, 11:17 AM IST", "pub_date_relative": "1h ago"}, {"title": "Bond markets steady after sell-off", "full_content": "US long-term borrowing costs hit their highest level in almost 25 years on Tuesday", "source": "FT Markets", "pub_date_str": "30 Sep 2026, 11:13 AM IST", "pub_date_relative": "1h ago"}, {"title": "Why uniQure shares are sinking after AMT-130 update", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News Powered By Why uniQure shares are sinking after AMT-130 update Written by Anupam Nagar , ETMarkets.com | Sep 30, 2026, 11:22:17 AM IST 1 / 10 \u200buniQure stock plunges on Huntington\u2019s data Shares of uniQure plunged on September 29 after the biotech company released four-year data for AMT-130, its experimental gene therapy for Huntington\u2019s disease. The update showed a smaller treatment effect than the company had reported at the three-year mark. (Sources: Reuters, Pluang, StocksToTrade)\n\nAt 48 months, AMT-130 showed a 44% slowing of disease progression on the composite Unified Huntington\u2019s Disease Rating Scale (cUHDRS) among 12 high-dose patients. The result was not statistically significant, with a nominal p-value of 0.144. The figure was substantially below the treatment effect reported at 36 months.\n\nEarlier results had shown a much larger benefit The updated 36-month analysis, covering 15 high-dose patients, showed 80% slowing of disease progression on cUHDRS, with a nominal p-value of 0.005. On the Total Functional Capacity (TFC) measure, the treatment showed 67% slowing at 36 months.\n\nWhile the cUHDRS result weakened, AMT-130 showed 61% slowing of functional decline on TFC at 48 months, with a nominal p-value of 0.008. TFC measures patients' ability to perform everyday activities. The company highlighted the TFC result as evidence that the therapy continued to provide a meaningful effect over four years.\n\nThe 48-month results were compared with an updated external control group from the ENROLL-HD natural-history dataset. The company said missing data increased to 53% at 48 months among the matched controls.", "source": "Economic Times Markets", "pub_date_str": "30 Sep 2026, 11:10 AM IST", "pub_date_relative": "1h ago"}, {"title": "Solar Industries shares up over 6%! What's driving defence stock that has surged 60% in YTD | Check target, stop loss", "full_content": "Defence stock Solar Industries share price jumped over 6% in intra-day deals on Wednesday, September 30, after the company announced the incorporation of a new subsidiary in the Republic of Botswana.\n\n\"...this is to inform that Solar Overseas Mauritius Limited a Wholly Owned Subsidiary Company, of the Company, has incorporated \u201cSolar Explochem Proprietary Limited\u201c a Subsidiary in Republic of Botswana, on September 29, 2026,\" it said in an exchange filing.\n\nSolar Industries shares rose as much as 6.2% to its day's high of \u20b9 19,820. The stock has opened at \u20b9 19,030 after previously closing at \u20b9 18,650 (on September 29).\n\nThe company's shares had jumped over 60% in 2026 YTD and more than 47% in the past year. The defence stock was at a 15.3% decline from its 52-week high of \u20b9 22,700. Meanwhile, it has hit its 52-week low of \u20b9 11,646 in December 2025.\n\nIn near term, it fell over 4% in 1 month but rose 4.5% in 3 months and around 62% in 6 months.In 5 eyars, the stock has given multibagger returns, soaring around 820%.\n\nSolar Industries India has incorporated Solar Explochem Proprietary Limited in Botswana through its wholly owned subsidiary, Solar Overseas Mauritius Limited. The new entity was incorporated on September 29, 2026, and will operate in the explosives industry as part of the company's expansion of business operations. It is a step-down subsidiary of Solar Industries India, with Solar Overseas Mauritius Limited as its holding company.\n\nThe Botswana entity has been set up through an initial cash capital subscription of US$325,000, with Solar Industries India and/or its subsidiaries holding 65% shareholding or control. The company said no government or regulatory approvals were applicable for the incorporation.\n\nThe Botswana subsidiary's incorporation comes as Solar Industries continues to expand its international footprint.", "source": "LiveMint Markets", "pub_date_str": "30 Sep 2026, 11:05 AM IST", "pub_date_relative": "1h ago"}, {"title": "Tega Industries shares jump 6% | What\u2019s driving the stock\u2019s 30% monthly rally?", "full_content": "Tega Industries shares jumped over 6% on Wednesday, 30 September, even as the broader market remained muted. The Indian stock market rebounded across most sectors after a two-day sell-off, although persistent foreign selling and elevated oil prices amid the absence of a US-Iran peace deal continued to weigh on sentiment.\n\nTega Industries share price today opened at an intraday low of \u20b9 2,052.35 apiece on the BSE ; the stock touched an intraday high of \u20b9 2,197.50 per share.\n\nThe stock has risen 3.67% in the past week, 25.42% over two weeks, and 29.94% in one month. Over a longer horizon, Tega Industries shares have gained 27.09% in three months and 30.08% in six months.\n\nSudeep Shah, Vice President \u2013 Technical and Derivatives Research at SBI Securities, said Tega Industries broke out of a downward-sloping trendline three weeks ago, followed by a strong follow-through move. The breakout was supported by a healthy increase in volumes, lending further strength to the price action.\n\nHe noted that the rising ADX signals strengthening bullish momentum, while the widening DI lines, with DI+ comfortably above DI\u2212, indicate that bulls remain firmly in control. Shah identified the \u20b9 2,060\u2013 \u20b9 2,050 zone as the immediate support, adding that the uptrend is likely to remain intact as long as the stock sustains above this level.\n\nTega Industries declared a final dividend of \u20b9 2 per equity share for FY26 at its 50th Annual General Meeting (AGM) held on 24 September 2026. The payout represents a 20% return on the face value of \u20b9 10 per share.\n\nShareholders also approved the adoption of the company\u2019s audited standalone and consolidated financial statements for the year ended 31 March 2026. They also approved the reappointment of Madan Mohan Mohanka as a director retiring by rotation.\n\nA special resolution was further passed approving the remuneration payable to Mohanka in his capacity as Chairman and Non-Executive Director.", "source": "LiveMint Markets", "pub_date_str": "30 Sep 2026, 11:04 AM IST", "pub_date_relative": "1h ago"}, {"title": "Midterms and the market", "full_content": "How much will it matter?", "source": "FT Markets", "pub_date_str": "30 Sep 2026, 11:00 AM IST", "pub_date_relative": "1h ago"}, {"title": "Inox Clean Energy files DRHP for Rs 10,000 crore IPO. Check details", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a Inox Clean Energy files DRHP for Rs 10,000 crore IPO. Check details JM Financial Share Price Choice International Share Price IIFL Capital Services Share Price Anand Rathi Share & Stock Brokers Share Price SMC Global Securities Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Inox Clean Energy files DRHP for Rs 10,000 crore IPO. Check details SECTIONS Inox Clean Energy files DRHP for Rs 10,000 crore IPO. Check details By Mohit Bhalla , ET Bureau Last Updated: Sep 30, 2026, 11:34:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Inox Clean Energy has filed its DRHP for a Rs 10,000 crore IPO with Sebi. The issue includes a Rs 8,000 crore fresh share sale and Rs 2,000 crore OFS. The company has a 9.29 GW renewable power portfolio and 6 GW solar module manufacturing capacity across India and the US.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "30 Sep 2026, 10:59 AM IST", "pub_date_relative": "1h ago"}, {"title": "RBI may raise repo rate by 100 bps through H1 2027: BofA Securities", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Indicators \u203a RBI may raise repo rate by 100 bps through H1 2027: BofA Securities The Economic Times daily newspaper is available online now. Read Today's Paper RBI may raise repo rate by 100 bps through H1 2027: BofA Securities SECTIONS RBI may raise repo rate by 100 bps through H1 2027: BofA Securities ANI Last Updated: Sep 30, 2026, 10:53:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Bank of America Securities has revised its forecast for the Reserve Bank of India\u2019s interest rate hikes. It now anticipates a total increase of 100 basis points by mid-2027. The first hike is expected during the monetary policy meeting in October. Economic growth remains strong, while inflation risks are increasing, prompting the RBI to adjust its monetary policy.\n\nGold paradox: Why India, a refining giant, is not a big bullion exporter\n\nA refinery is not a laptop: Why America's diesel problem can't be switched off\n\nHow Irdai\u2019s big reset can change insurance landscape, customer choice\n\nCan Fly91\u2019s flightpath for India\u2019s smallest airline defy the doomy past?\n\nSmugglonomics: Geckos, dry dates, human hair \u2013 what makes something worth smuggling?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "30 Sep 2026, 10:53 AM IST", "pub_date_relative": "1h ago"}, {"title": "Stock futures inch higher as traders weather latest rise in Treasury yields: Live updates", "full_content": "Stock futures inched higher early Wednesday, following another session in which equities succumbed to pressure from rising bond yields.\n\nContracts tied to the Dow Jones Industrial Average rose 0.36%. S&P 500 futures gained 0.23%. Nasdaq-100 futures inched up 0.10%.\n\nIn Asia, Japan's Nikkei 225 gained 1.81% and the broader Topix was up 1.58%. South Korea's benchmark Kospi slipped 0.38% and the small-cap Kosdaq added 0.84%. Hong Kong's Hang Seng index was flat, while mainland China's CSI 300 was 0.15% higher.\n\nThe 30-year Treasury bond yield hit crossed 5.6% on Tuesday, reaching levels not seen since June 2002. The 10-year yield, meanwhile, scaled to a fresh 2007 high near 5.3%. Those moves led the Dow to decline more than 100 points, while the S&P 500 and Nasdaq slid 0.2% and 0.1%, respectively.\n\nJose Torres, senior economist at Interactive Brokers, noted that equities are \"trying to hang in there, but tighter financial conditions are emboldening the bears and lifting interest in downside hedges.\"\n\nTo be sure, new comments from New York Federal Reserve President John Williams appeared to have eased fears of higher central bank rates, at least for the moment. Williams said late Tuesday, \"there is no need for urgency, and we have time to gather more information\" before the Fed's October meeting.\n\nThe CME Group's FedWatch tool shows traders are pricing in a 49% chance of a quarter-point rate hike next month. That's down from 71% on Monday.\n\nHeading into Wednesday, traders will have their sights set on the August reading of the Personal Consumption Expenditures price index, the Federal Reserve's preferred inflation gauge. Economists polled by Dow Jones see the metric rising 0.3% for the month, leading to an annual pace of 3.7%.", "source": "CNBC Top News", "pub_date_str": "30 Sep 2026, 10:53 AM IST", "pub_date_relative": "1h ago"}, {"title": "Cupid, Sterlite Tech among 10 smallcap stocks set for sharp fund flows after Nifty rejig. See full list", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News Cupid, Sterlite Tech among 10 smallcap stocks set for sharp fund flows after Nifty rejig. See full list Written by Veer Sharma , ETMarkets.com | Sep 30, 2026, 11:14:51 AM IST 1 / 11 Reshuffle Impact The National Stock Exchange\u2019s (NSE) semi-annual rejig of Nifty indices takes effect from September 30, with Nuvama Alternative & Quantitative Research highlighting the stocks likely to see the highest inflows and outflows as a result. Here are 10 small-cap stocks that could see the sharpest inflows and outflows.\n\nSTL Technologies is among the top five stocks expected to see inflows following the Nifty Smallcap 250 rejig. Nuvama estimates $14 million in inflows, equivalent to 0.8x its average daily traded value (ADTV).\n\nBIRET is estimated to see $13 million in inflows, the second-highest among the top five inclusion candidates. The estimated flow is equivalent to 8.5x its ADTV.\n\nSansera Engineering is expected to see $12 million in inflows following the index rejig, according to Nuvama Alternative Research. This is equivalent to 0.8x its ADTV.\n\nCupid, a healthcare and consumer products company, is estimated to see $10 million in inflows, equivalent to 0.2x its ADTV.\n\nTD Power Systems, which manufactures generators and alternators, is expected to see $10 million in inflows. Nuvama estimates this at 0.5x the stock\u2019s ADTV.\n\nPiramal Finance is among the top five stocks expected to see outflows from the Nifty Smallcap 250 rejig. Nuvama estimates $15 million in outflows, equivalent to 1.3x its ADTV.\n\nAster DM Healthcare is estimated to see $12 million in outflows following the rejig. The estimated outflow is equivalent to 1.1x its ADTV.", "source": "Economic Times Markets", "pub_date_str": "30 Sep 2026, 10:53 AM IST", "pub_date_relative": "1h ago"}, {"title": "Parag Thakkar Bets On HDFC Bank At Rs 925, Sees Nearly 30% Upside", "full_content": "HDFC Bank shares have delivered muted returns across several time frames. The stock is down around 2.1% over the past five trading sessions, while it has gained around 0.8% in the past month.", "source": "NDTV Profit", "pub_date_str": "30 Sep 2026, 10:47 AM IST", "pub_date_relative": "1h ago"}, {"title": "Molbio Diagnostics Stock Soars 9% As It Becomes Jefferies Top Med Tech Pick At Initiation", "full_content": "Shares soared to a high of Rs 1,369.20, but pared most of their gains to trade 4% higher at Rs 1,305 apiece on the NSE.", "source": "NDTV Profit", "pub_date_str": "30 Sep 2026, 10:46 AM IST", "pub_date_relative": "1h ago"}, {"title": "Million-dollar question: Between S&P 500 bulls and bears, who would likely win?", "full_content": "The bulls are convinced that the SPX is poised for a \"massive upside reversion,\" while the bears argue that the SPX \"can't hold up much longer.\"", "source": "CNBC Top News", "pub_date_str": "30 Sep 2026, 10:41 AM IST", "pub_date_relative": "1h ago"}, {"title": "Coromandel Intl, Paradeep Phosphates, And More: Fertiliser Stocks Face El Nino Test As Rabi Season Nears", "full_content": "Coromandel International, Chambal Fertilisers and Paradeep Phosphates could be among the listed names in focus. Other listed companies to watch include RCF, NFL, FACT and Gujarat State Fertilizers & Chemicals (GSFC).", "source": "NDTV Profit", "pub_date_str": "30 Sep 2026, 10:41 AM IST", "pub_date_relative": "1h ago"}, {"title": "Stock Market Today Live: Sensex Jumps 200 Points, Nifty Pares Early Losses To Trade Above 22,700 As Crude Oil Price Drops", "full_content": "Stock Market Today Live Updates: Analysts believe the market bias is cautiously positive, but the undertone stays subdued while the Nifty 50 trades below 22,800. The immediate support for the index sits at 22,500, while a break would expose the 22,200 level.", "source": "NDTV Profit", "pub_date_str": "30 Sep 2026, 10:39 AM IST", "pub_date_relative": "1h ago"}, {"title": "Up 254% in 5 years! KSB share price jumps 10% after \u20b9118 crore international order - Check details, share performance", "full_content": "Shares of KSB jumped almost 10% on Wednesday, September 30, after the company announced a significant order win. The firm had received an international export order from Dangote Projects Free Zone Enterprise for the supply of boiler feed pump packages.\n\nThe order, valued at approximately \u20b9 118 crore, strengthens KSB's presence in the international fertiliser and energy sectors. The company said the order reinforces its capabilities in delivering high-efficiency, engineered pumping solutions for critical process applications.\n\nThe project is scheduled to be executed over a period extending from September 2027 to March 2028. According to the terms disclosed by KSB, delivery of the equipment is also scheduled between September 2027 and March 2028, while payment will be made after installation.\n\nThe order is classified as an international contract, with the nature of the assignment involving the supply of boiler feed pump packages.\n\nThe order involves approximately 18 boiler feed pump packages, with the overall consideration estimated at US$12,400,051. At the conversion disclosed by the company, this works out to approximately \u20b9 1180 million, or around \u20b9 118 crore.\n\nThe latest contract strengthens KSB's international presence in the fertiliser and energy sectors while expanding its portfolio of engineered pumping solutions for critical industrial applications. The company said the significant export order highlights its technology and engineering capabilities in serving international customers.\n\nKSB Ltd. is listed on both the BSE and NSE, with BSE scrip code 500249 and NSE symbol KSB. The company was formerly known as KSB Pumps Ltd. Its registered office is in Mumbai, while its head office is located on Mumbai-Pune Road in Pimpri, Pune.\n\nThe stock surged as much as 9.8% during the session, touching an intraday high of \u20b9 902. The rally added to its recent one-month gains, with the stock up 9% over the period.", "source": "LiveMint Markets", "pub_date_str": "30 Sep 2026, 10:37 AM IST", "pub_date_relative": "1h ago"}, {"title": "India's Drought Risk: Which Stocks Could Feel The Impact Of A Weak Monsoon And Rural Demand Shock?", "full_content": "India's 12% monsoon deficit and widespread drought are raising Rabi risks. Here's how El Nino could impact NBFCs, tractors, fertilisers, FMCG and building materials.", "source": "NDTV Profit", "pub_date_str": "30 Sep 2026, 10:37 AM IST", "pub_date_relative": "1h ago"}, {"title": "Power Mech Projects shares rise 4% after company secures Rs 549 crore order from Adani Group firm", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Power Mech Projects shares rise 4% after company secures Rs 549 crore order from Adani Group firm Power Mech Projects Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Power Mech Projects shares rise 4% after company secures Rs 549 crore order from Adani Group firm SECTIONS Power Mech Projects shares rise 4% after company secures Rs 549 crore order from Adani Group firm By Ritesh Presswala , ETMarkets.com Last Updated: Sep 30, 2026, 10:37:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Power Mech Projects shares gained after securing a Rs 549.37-crore O&M order from Moxie Power Generation for its 2x600 MW Tuticorin thermal power plant, with the contract spanning five years.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "30 Sep 2026, 10:37 AM IST", "pub_date_relative": "1h ago"}, {"title": "Hospital stocks Max Healthcare, Apollo Hospitals, Fortis plunge up to 7% - What is driving the stocks down?", "full_content": "Hospital stocks came under strong selling pressure on Wednesday morning, with counters falling up to 7% amid heavy volume.\n\nStocks, such as Max Healthcare Institute (down 7%), Apollo Hospitals Enterprise (down 6%), Yatharth Hospital (down 5%), Fortis Healthcare (down 6%), Artemis Medicare Services (down 5%), and Aster DM Quality Care (down 5%), crashed 5-7%.\n\nOther players from the segment, such as HealthCare Global Enterprises (down 4%), Krishna Institute of Medical Sciences (KIMS) (down 4%), Medanta (down 4%), and Rainbow Children's Medicare (down 3%), also lost significantly.\n\nMost hospital stocks are falling today due to profit-booking after the US announced that certain speciality medicines and their ingredients will be exempt from a new 100% tariff on patented drugs.\n\nThe exemption covers medicines used to treat rare diseases and several specialised therapies, including infertility treatments, cell and gene therapies and antibody-drug conjugates. The same zero-tariff treatment will apply to qualifying ingredients used in these products.\n\nThe US Commerce Department listed India among 20 countries eligible for the exemption in a notice published in the Federal Register.\n\nExperts say the pharma and hospital segments are witnessing profit-booking after their outperformance. Year-to-date, the BSE Healthcare index is up 15% compared to a 15% fall in the benchmark Sensex.\n\n\"Healthcare stocks are witnessing profit booking as they have outperformed this year. Market participants are using the positive news on US tariff exemption to take some money off the table,\" said Ajit Mishra, SVP \u2013 Research, Religare Broking.", "source": "LiveMint Markets", "pub_date_str": "30 Sep 2026, 10:36 AM IST", "pub_date_relative": "1h ago"}, {"title": "Sensex rises 130 points, Nifty falls below 22,700 amid cooling oil, rising bond yields. What lies ahead?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Sensex rises 130 points, Nifty falls below 22,700 amid cooling oil, rising bond yields. What lies ahead? Adani Ports & Special Economic Zone Share Price JSW Infrastructure Share Price Gujarat Pipavav Port Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Sensex rises 130 points, Nifty falls below 22,700 amid cooling oil, rising bond yields. What lies ahead? SECTIONS Sensex rises 130 points, Nifty falls below 22,700 amid cooling oil, rising bond yields. What lies ahead? By Debaroti Adhikary , ETMarkets.com Last Updated: Sep 30, 2026, 10:34:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Indian shares traded mixed as easing oil prices supported sentiment, while surging US bond yields kept investors cautious. Sensex gained around 130 points, while Nifty slipped below 22,700 amid weak global cues.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "30 Sep 2026, 10:34 AM IST", "pub_date_relative": "1h ago"}, {"title": "AI broke the job application. What replaces it?", "full_content": "The resume is \"broken,\" according to Barb Hyman, London-based founder and CEO of recruitment platform Sapia.ai. \"How many people are you missing out on because you're relying on an artefact?\" Hyman said, adding that AI can now tailor a resume \u2014 or CV, as it's known in the U.K. \u2014 to any role.\n\nU.K. graduate employers received an average of 140 applications per vacancy in 2025, the highest level recorded in three decades, according to data from the Institute of Student Employers . In a crowded market where candidates can use AI to create endless resumes and cover letters, finding the right person may be harder than ever.\n\nSkills, rather than employment history, will increasingly determine who gets hired, according to Hyman. A hairdresser, for example, might not look like an obvious fit for a contact center job on paper, she told CNBC, but could excel in the role because hairdressers tend to have high levels of empathy, listen to people all day and spend hours solving complex problems.\n\nAssessing skills directly can reveal strengths and weaknesses that a traditional resume hides, according to Hyman \u2014 sometimes painting a picture even the candidates themselves weren't sure of.\n\nHyman isn't alone in seeing hiring move in this direction. Around two-thirds of U.K. organizations have adopted skills-based hiring, according to 2026 research from Michael Page , a recruitment firm headquartered in Surrey, England. Almost 60% of candidates said they were more likely to apply for roles defined by skills rather than traditional qualifications or career history.\n\nIt's leading employers to think carefully about which skills they actually value.", "source": "CNBC World Economy", "pub_date_str": "30 Sep 2026, 10:30 AM IST", "pub_date_relative": "1h ago"}, {"title": "Cupid shares rally 16% in two sessions. What\u2019s behind the sharp uptick in the multibagger stock?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Cupid shares rally 16% in two sessions. What\u2019s behind the sharp uptick in the multibagger stock? Cupid Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Cupid shares rally 16% in two sessions. What\u2019s behind the sharp uptick in the multibagger stock? SECTIONS Cupid shares rally 16% in two sessions. What\u2019s behind the sharp uptick in the multibagger stock? By Veer Sharma , ETMarkets.com Last Updated: Sep 30, 2026, 10:27:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Cupid shares surged 7% after entering the Nifty Smallcap 250 index, extending gains to 16% in two sessions. The company has raised FY27 revenue and profit guidance following strong quarterly growth. Nuvama estimates around $10 million in potential inflows, while Cupid targets continued expansion across healthcare exports and consumer businesses.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "30 Sep 2026, 10:27 AM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "GE Shipping rides high freight rates, builds cash for the next cycle", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nGreat Eastern Shipping Co. (GE Shipping) is benefiting from the sharp rise in shipping freight rates amid disruptions in global trade flows following the Russia-Ukraine war and the West Asia war. With only about 25-26% of the company\u2019s tonnage operating under time charters currently, it has a vast presence in the spot market, thus benefitting from the surge in freight rates.\n\nAverage Suezmax rates in the June quarter (Q1FY27) more than tripled to $143,000 per day from Q1FY26. Freight rates for other segments also rose by 70-180%. So, consolidated Ebitda rose 110% year-on-year to \u20b9 1,327 crore last quarter. Elevated freight rates should continue to support near-term earnings prospects.\n\nAdditionally, a strong cash position gives it the flexibility to expand its fleet when the downcycle begins. GE\u2019s strategy comprises avoiding new vessel purchases in an upcycle when asset prices are elevated. This has helped it build a cash reserve of around \u20b9 8,000 crore at Q1FY27-end, about 40% of its balance sheet. Consequently, net debt-to-equity ratio has improved from 0.12 times in FY22 to negative 0.45 times.\n\n\u201cGE shipping\u2019s cash reserve positions it to pursue opportunistic, counter-cyclical acquisitions at attractive valuations as the downturn typically depresses asset prices,\u201d said Nomura Research. The brokerage projects freight rates to drop by 50% for oil tankers and 10% for others in FY28. It estimates GE Shipping\u2019s Ebitda to drop at a slower 19%, aided by a larger fleet, after 55% Ebitda growth in FY27.\n\nGE Shipping operates a fleet of 40 vessels, comprising 25 crude oil and product tankers and 15 dry bulk carriers. It also provides offshore services to oil exploration companies through four oil rigs and associated vessels.", "source": "LiveMint Markets", "pub_date_str": "30 Sep 2026, 12:19 PM IST", "pub_date_relative": "5m ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Pressure on U.S. Treasurys eases after 30-year yield hits highest level since 2002", "full_content": "U.S. Treasury yields were lower on Wednesday, recovering ground after facing heavy selling pressure in the previous session, amid investors concerns about inflation, government debt and the potential for tighter monetary policy.\n\nThe 30-year Treasury bond was last 4 basis points lower to 5.553%, after rising to its highest level since 2002 on Wednesday. The 10-year Treasury was down 3 basis points to 5.221% and the 2-year Treasury note yield was 1 basis point lower to 4.876%.\n\nOne basis point is equal to 0.01%, and yields and prices move in opposite directions.\n\nRecent pressure on yields reflects the potential for future Federal Reserve interest rate decisions, as high oil prices driven by the Middle East conflict lift inflation expectations.\n\nTraders are now pricing in a 45% chance of another Fed rate hike at its next meeting in October, according to the CME FedWatch tool .\n\nNew York Federal Reserve President John Williams said in comments late Tuesday that \"there is no need for urgency, and we have time to gather more information\" before the Fed's October meeting.\n\nInvestors will await the Federal Reserve's preferred inflation gauge on Wednesday, with the reading of the Personal Consumption Expenditures price index due. Economists polled by Dow Jones expect a monthly rise of 0.3%, and an annual rise of 3.7%.", "source": "CNBC Top News", "pub_date_str": "30 Sep 2026, 12:16 PM IST", "pub_date_relative": "7m ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Global Market: China factory activity returns to growth in September as AI boom supports industrial sector", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a Global Market: China factory activity returns to growth in September as AI boom supports industrial sector Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market: China factory activity returns to growth in September as AI boom supports industrial sector SECTIONS Global Market: China factory activity returns to growth in September as AI boom supports industrial sector By Anupam Nagar , ETMarkets.com Last Updated: Sep 30, 2026, 12:04:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis China\u2019s factory activity returned to growth in September, with the official manufacturing PMI rising above the expansion threshold. Strong production and AI-linked demand supported the rebound, though weak domestic demand, employment and property activity remained concerns.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram ng volume on exchanges. According to the data available on NSE, around 21.74 lakhs shares changed hands during the intraday session on Wednesday.\n\nFor the April-June 2026 quarter, the company posted a record performance, reporting its highest-ever quarterly revenue of \u20b9 1,513 crore and profit before tax (PBT) of \u20b9 387 crore. Revenue and PBT rose 49.2% and 434.7%, respectively, year-on-year (YoY).\n\nThe company reported double-digit YoY volume growth in its Export and Lubricating Oil businesses, while domestic white oil volumes declined. The West Asia crisis disrupted feedstock availability and created logistical bottlenecks at ports, significantly affecting volumes in April. However, volumes started to recover and normalize following the month.\n\nAccording to the company's FY26 annual report, the transformer fluids industry is expected to benefit from continued investments in power generation, transmission infrastructure and renewable energy integration.", "source": "LiveMint Markets", "pub_date_str": "30 Sep 2026, 12:03 PM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Golden Rock Global reports \u00a3656,355 loss, appoints advisor", "full_content": "", "source": "Investing.com News", "pub_date_str": "30 Sep 2026, 12:02 PM IST", "pub_date_relative": "21m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Global Market: Japan 10-Year bond yield heads for record fifth quarterly gain", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall der H1 loss as North America investment weighs", "full_content": "", "source": "Investing.com News", "pub_date_str": "30 Sep 2026, 12:00 PM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Inox Clean Energy files DRHP for Rs 10,000 crore IPO, largest in Indian private sector renewable energy space", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a Inox Clean Energy files DRHP for Rs 10,000 crore IPO, largest in Indian private sector renewable energy space Crisil Share Price CARE Ratings Share Price ICRA Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Inox Clean Energy files DRHP for Rs 10,000 crore IPO, largest in Indian private sector renewable energy space SECTIONS Inox Clean Energy files DRHP for Rs 10,000 crore IPO, largest in Indian private sector renewable energy space By Sakshi Kumari , ETMarkets.com Last Updated: Sep 30, 2026, 12:00:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Inox Clean Energy has filed for a Rs 10,000-crore IPO, comprising a fresh issue of up to Rs 8,000 crore and an OFS of up to Rs 2,000 crore, as it expands its renewable power and solar manufacturing business.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "30 Sep 2026, 12:00 PM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "IOC, HPCL, BPCL shares rise - What is behind the rally in crude oil-linked stocks?", "full_content": "Shares of oil and gas companies, including Indian Oil Corporation (IOC), Hindustan Petroleum Corporation (HPCL), Bharat Petroleum Corporation (BPCL), and GAIL, climbed up to 3% in intraday trade on the BSE on Wednesday, 30 September, amid a drop in crude oil prices.\n\nStocks like Petronet LNG, Indraprastha Gas, and Reliance Industries also gained significantly during the session.\n\nOn the other hand, shares of upstream exploration and production companies, such as ONGC and Oil India, declined 1% and 3%, respectively, during the session.\n\nCrude oil-linked stocks are seeing decent gains despite a decline in oil prices. Crude oil prices suffered their biggest drop in more than a week, falling 2.5% on Tuesday, amid signs that Middle East supply has risen to near pre-war levels after Saudi Arabia resumed shipments from its Red Sea port of Yanbu, which avoids the Strait of Hormuz.\n\nInternational crude oil benchmark, Brent Crude, traded near $103 per barrel on Wednesday morning.\n\nA drop in crude prices tends to benefit oil marketing stocks, as it boosts their marketing margins on petrol and diesel retail sales. However, a drop in oil prices is negative for upstream exploration and production companies, as their revenues and realisations decline.\n\nAccording to InCred Capital Wealth, oil prices will get rebalanced before gas. It expects Brent at $88, $76 and $72 per barrel over the calendar years 2026 to 2028.\n\nThe financial services company underscored that the International Energy Agency (IEA) expects a 4.6-5.1mbpd oil surplus in 2027 as about 8mbpd of shut-in and rerouted supply returns, after a 1.7mbpd deficit in 2026.", "source": "LiveMint Markets", "pub_date_str": "30 Sep 2026, 11:55 AM IST", "pub_date_relative": "28m ago", "cfa_topics": ["Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "IPO GMPs compared: Shah Investor's Home IPO vs SRIT India IPO - Which one is winning in grey market?", "full_content": "Two IPOs \u2014 SRIT India and Shah Investor\u2019s Home \u2014 entered their final day of subscription on Wednesday, 30 September 2026. Both issues are entirely fresh issues, with allotment expected to be finalised on 1 October and listing scheduled for 6 October, subject to the proposed timelines.\n\nThe SRIT India IPO has been fully subscribed 18.74 times so far, led by non-institutional investors (NIIs), who have subscribed 45.91 times, as per BSE data.\n\nMeanwhile, the Shah Investor\u2019s Home IPO has been subscribed 3.74 times, with the NII category leading at 7.68 times.\n\nLet's take a look at grey market premium ( GMP ) trends on the last bidding day:\n\nSRIT India IPO GMP today, or grey market premium, is +33. Considering the upper end of the IPO price band and the current premium in the grey market, the estimated listing price of SRIT India share price was indicated at \u20b9 163 apiece, which is 25.38% higher than the IPO price of \u20b9 130.\n\nOver the past 8 sessions, the IPO GMP has increased from \u20b9 12 to \u20b9 33, a total increase of \u20b9 21. An upward trend was observed in around 57% of the sessions, reflecting a positive shift in grey market sentiment, according to analysts.\n\nSRIT India IPO is a \u20b9 218.40-crore book-built issue, comprising an entirely fresh issue of 1.68 crore shares. The IPO does not have an offer-for-sale ( OFS ) component.\n\nThe company has set the price band at \u20b9 123\u2013 \u20b9 130 per share, with a lot size of 115 shares. Retail investors are required to apply for at least 115 shares, which translates to a minimum investment of \u20b9 14,950 at the upper end of the price band.", "source": "LiveMint Markets", "pub_date_str": "30 Sep 2026, 11:55 AM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "TCS, Wipro, other IT stocks rebound up to 6%, snapping 8-day losing streak. Why is Jefferies cautious?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a TCS, Wipro, other IT stocks rebound up to 6%, snapping 8-day losing streak. Why is Jefferies cautious? Coforge Share Price LTM Share Price Oracle Financial Services Software Share Price Persistent Systems Share Price Mphasis Share Price The Economic Times daily newspaper is available online now. Read Today's Paper TCS, Wipro, other IT stocks rebound up to 6%, snapping 8-day losing streak. Why is Jefferies cautious? SECTIONS TCS, Wipro, other IT stocks rebound up to 6%, snapping 8-day losing streak. Why is Jefferies cautious? By Debaroti Adhikary , ETMarkets.com Last Updated: Sep 30, 2026, 11:51:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis IT stocks rebounded on Wednesday, with TCS, Wipro and Coforge snapping an eight-session losing streak. The Nifty IT index rose nearly 3%, aided by a stronger US dollar and higher US bond yields, though brokerages remain cautious ahead of the Q2 earnings season.\n\n(What's moving Sensex and Nifty Track latest m Opportunity should come from what you build - not simply from what you inherit,\u201d he said on Saturday.\n\nThe post sparked intense social media chatter, with critics debating the proposal's viability and warning it would squeeze middle-class pockets. Reacting to the pushback, Bhatia has now reiterated his proposal to clarify his stance, saying the massive tax would impact only the super-wealthy.\n\n\u201cI simply don't agree. Now, what was built by your father or grandfather should be distributed. Why, it is not the person who has worked hard. The whole family worked hard to earn that status. Wealth distribution is a bizarre suggestion. You may come forward and distribute yours,\u201d a user said.\n\nAnother added, \u201cIt won\u2019t affect the wealthy. They operate the money through trusts, which are protected from any kind of taxation worldwide or debt. So it will, in the end, affect those small farmers who own agricultural land and have it further divided amongst their sons. Govt helps rich.\u201d\n\n\u201cYou trust politicians with your 55% wealth locked in companies, which instantly becomes state-controlled once a major shareholder dies? Scheme to make India communist in one fell swoop,\u201d another user commented.\n\n\u201cImagine imposing inheritance tax on the people who invested earlier for their next generations while sacrificing their own Lifestyles..just because some people burnt all the money they made in their rich lifestyle and built no assets,\u201d a user noted.\n\nHowever, late on Tuesday, Sabeer Bhatia backed his proposed inheritance tax , saying it would only hit the top 2-3% of the super-wealthy who control disproportionate assets, leaving 97-98% unaffected.", "source": "LiveMint Money", "pub_date_str": "30 Sep 2026, 11:35 AM IST", "pub_date_relative": "48m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Avalon Tech shares fall 6%
