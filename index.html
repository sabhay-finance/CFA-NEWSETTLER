ess loss in assessment year (AY) 2023-24, you can carry it forward for up to eight assessment years. But the introduction of the new law does not give you an additional eight years from April 1, 2026.\n\nThe basic process remains the same. Losses are first adjusted against income under the same head, wherever permitted. Any remaining loss may then be adjusted against income under another head, subject to the applicable rules.\n\nYes. The CBDT has clarified that brought-forward losses from house property and capital gains remain eligible for set-off under the new law.\n\nFor example, a house property loss from AY 2024-25 can be carried forward and adjusted against eligible house property income in a subsequent tax year.\n\nSimilarly, a long-term capital loss from an earlier year can be set off against long-term capital gains, but not short-term capital gains. Short-term capital losses can be adjusted against short-term or long-term capital gains.", "source": "LiveMint Money", "pub_date_str": "24 Oct 2026, 04:13 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "You can open only 2 Sukanya Samriddhi accounts \u2014 but what if you have triplet daughters?", "full_content": "The Sukanya Samriddhi Yojana (SSY) allows parents or legal guardians to open accounts for up to two girl children in a family. This government-backed small savings scheme helps parents build a fund for their daughters' education, marriage and other financial needs, while offering tax benefits as well.\n\nA parent or guardian can open a SSY account for a girl child anytime from her birth until she turns 10. The child must be a resident Indian at the time of opening the account and remain so until maturity to be eligible for the scheme.\n\nOnly one SSY account can be opened per girl child and a family can open accounts for a maximum of two girls, like we discussed above. This raises questions for families with triplet daughters born in their first delivery or those who have another daughter after having twins the first time.\n\nAccording to a Ministry of Finance release issued last year, an exception to the two-account limit is allowed in cases involving twin or triplet girl children. In such cases, a third SSY account may be permitted, subject to the scheme\u2019s conditions.\n\nAccording to Ministry of Finance's release issued in January 2025, an exception to the two-account limit is allowed in cases involving twin or triplet girl children. In such cases, a third SSY account can be permitted.\n\nHowever, the eligibility depends on the order in which the children are born:\n\nIn order to open a third SSY account, the parent or legal guardian must submit a medical certificate issued by an authorised medical institution. The document establish the birth of a twin or triplet girl children, as applicable.\n\nParents or guardians can deposit up to \u20b9 1.5 lakh a year in each SSY account . According to an illustration from the SBI Securities SSY calculator, investing maximum permitted amount annually from the time a girl child turns 10 until she turns 21 would result in a maturity value of \u20b9 71.82 lakh, comprising \u20b9 22.5 lakh in contributions and \u20b9 49.32 lakh in interest accrued.", "source": "LiveMint Money", "pub_date_str": "24 Oct 2026, 04:09 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Six Flags to Add Seat Belts to Rides Following Death - WSJ", "full_content": "Six Flags to Add Seat Belts to Rides Following Death WSJ Six Flags announces major safety change to Goliath coaster, others WSB-TV Higher, Faster, Gnarlier: Have Roller Coasters Become Too Extreme? The New York Times What the Six Flags Over Georgia death investigation will focus on, according to roller coaster inspection experts CBS News Roller coasters keep getting more extreme. Have they gone too far? Yahoo", "source": "Google News Business", "pub_date_str": "24 Oct 2026, 04:07 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Cables and wires stock turned multibagger with 318% return in 5 years; InCred sees 29% upside - Do you own? Target price", "full_content": "KEI Industries shares ended lower on Friday, October 23, extending their correction over the past six months. Despite the recent weakness, the cables and electricals stock has delivered a nearly 318% return over the past five years. Brokerage InCred Equities has upgraded its outlook on the stock, citing the company's sustained growth guidance, margin expansion driven by a favourable product mix, and rising exports.\n\nThe company has reported 28.94% annual jump in its consolidated net profit for the September quarter of financial year 2026-27.\n\nKEI Industries reported 39% annual growth in revenue, 40% surge in EBITDA, and around 29% jump in profit after tax (PAT). The management has also revised tis financial year 2026-27 guidance to 25% and 11% EBITDA margin.\n\nThe brokerage remained bullish on the cables and electricals stock because of its sustained \u201cgrowth guidance, Sanand plant ramp-up, margin expansion on product mix and rising exports.\u201d However InCred Equities highlighted intensifying competition and upcoming industry capacity additions.\n\n\u201cDespite a healthy medium-term growth outlook, we lower our target multiple to 33x from 36x, factoring in intensifying competition and upcoming industry capacity additions, which could weigh on margins,\u201d read InCred Equities report. However, the brokerage upgraded its rating for the company citing reasonable valuation.\n\nInCred Equities upgraded rating for KEI Industries from \u2018Hold\u2019 to \u2018Add\u2019 and revised target price to \u20b9 5,000 per share.\n\n\u201cWe upgrade our rating to ADD from HOLD because of reasonable valuation, with a revised target price of \u20b9 5,000, rolling forward our valuation to Sep 2028F earnings (previous target price was Rs5,760). The stock currently trades at ~33.6x/28.2x/23.2x FY27F/28F/29F EPS, respectively,\u201d read the brokerage report.\n\nThe stock closed 4.25% lower at \u20b9 3715.10 per share on BSE with a market capitalisation of \u20b9 35,533.29 crore on Friday, October 23.", "source": "LiveMint Markets", "pub_date_str": "24 Oct 2026, 03:43 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Power stock to buy: Despite almost 20% fall in 1 month, Deven Choksey Research sees 72% returns ahead - Do you own?", "full_content": "Despite nearly falling 20% in the last 1 month, domestic brokerage house Deven Choksey Research has initiated coverage on Siemens Energy India with a Buy rating and a target price of \u20b9 4,554, implying a potential upside of 72% from the last closing price of \u20b9 2,649.\n\nThe report said, \u201cWe assign multiple of 60x PE on FY28 EPS of 75.90 and arrive at TP of INR 4,554, implying 41% upside on Siemens Energy India Ltd. We have not factored HVDC into our TP, while new HVDC VSC orders and nuclear energy provide additional upside optionality.\u201d\n\nThe brokerage expects the power equipment maker to benefit from India's multi-year transmission investment cycle, rising electricity demand, renewable energy integration and expansion in high-voltage grid infrastructure.\n\nIt highlighted the company's position in high-voltage direct current (HVDC) transmission, grid-stabilisation solutions, power generation equipment and engineering services. Its strong parentage through Siemens Energy Germany and opportunities in exports could further support growth.\n\nDeven Choksey Research said, \u201cWe view Siemens Energy India as a high-potential play on the country\u2019s power transmission and generation opportunity, with a diversified business model spanning grid infrastructure, power generation, services and engineering, research & development (ER&D).\u201d\n\nThe stock ended 4.4% lower at \u20b9 2,649 on Friday, October 23. It has been under pressure in recent times. The power stock has declined around 10% in 1 week, nearly 20% in 1 month, and 3 months. Meanwhile, it has lost 15% in the last 1 year.\n\nIt hit its 52-week high of \u20b9 3,966.80 in May 2026 and its 52-week low of \u20b9 2105.15 in January 2026.\n\nThe brokerage's investment thesis centres on rising transmission expenditure as India expands renewable energy capacity and strengthens its electricity grid.", "source": "LiveMint Markets", "pub_date_str": "24 Oct 2026, 03:41 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Key income tax rules explained: Gifts above \u20b950,000 in a year: When is the full amount taxable? Marriage exemptions", "full_content": "Did you receive cash, jewellery, or other gifts from friends or relatives? While some gifts are tax-free, others may be taxable depending on their value, who gave them, and the occasion.\n\nThe FAQs on gifts received by an individual or Hindu Undivided Family (HUF) under the Income-Tax Act, 2025, explain when gifts are exempt and when they attract tax.\n\nGifts received from specified relatives are exempt from tax, irrespective of their value. These include:\n\nOther exempt categories include gifts received through a will or inheritance, gifts received in contemplation of the donor's death, and certain receipts from specified authorities and registered non-profit organisations.\n\nIf you receive cash gifts worth more than \u20b9 50,000 in a year, the entire amount is taxable if the gifts are received without consideration and are not from specified relatives. Gifts can be received in cash, by cheque, bank draft or other modes.\n\nFor example, if you receive \u20b9 1 lakh from your father, the gift is tax-free, irrespective of the amount. However, if you receive \u20b9 30,000 from one friend and \u20b9 25,000 from another during the year, the entire \u20b9 55,000 is taxable, as the total exceeds \u20b9 50,000 and no exemption applies.\n\nIf the total value of monetary gifts during a financial year (tax year) exceeds \u20b9 50,000, the entire amount becomes taxable, not just the portion above \u20b9 50,000.\n\nFor example, if you receive \u20b9 30,000 from one friend and \u20b9 25,000 from another during the same year, your total monetary gifts amount to \u20b9 55,000. Since friends are not included in the specified list of relatives and the total amount exceeds \u20b9 50,000, the entire \u20b9 55,000 is taxable, provided no exemption applies.", "source": "LiveMint Money", "pub_date_str": "24 Oct 2026, 03:21 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "India, Uzbekistan discuss bilateral ties during foreign minister Jaishankar's Azerbaijan visit", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a India, Uzbekistan discuss bilateral ties during foreign minister Jaishankar's Azerbaijan visit The Economic Times daily newspaper is available online now. Read Today's Paper India, Uzbekistan discuss bilateral ties during foreign minister Jaishankar's Azerbaijan visit SECTIONS India, Uzbekistan discuss bilateral ties during foreign minister Jaishankar's Azerbaijan visit PTI Last Updated: Oct 24, 2026, 03:21:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis External Affairs Minister S Jaishankar met Uzbek Foreign Minister Bakhtiyor Saidov in Azerbaijan\u2019s Baku to discuss bilateral issues and stress the timely implementation of agreements reached at the highest level. The meeting follows Prime Minister Narendra Modi\u2019s August visit to Uzbekistan, during which the two countries upgraded ties to a comprehensive strategic partnership and set a $5 billion bilateral trade target.\n\nKYB and KYC: Business behind the wealth creator called \u2018Divi\u2019s Lab\u2019 \u2013 Part 2, concluding\n\nKYB and KYC: Business behind the wealth creator called \u201cDivi\u2019s Lab\u201d \u2013 Part 1\n\nOne company, 2 words. Bond yield and CDS: Will they decide the fate of global markets?\n\nBusiness of Odd Things: Inside an industry that farms fish that nobody is meant to eat\n\nWar's second-order effects are becoming visible in critical sectors\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "24 Oct 2026, 03:18 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Fixed Income", "Derivatives", "Ethical & Professional Standards"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "NFO deadline alert! New Motilal Oswal Nifty Midcap150 Index Fund closes next week \u2014 Date, allocation, holding details", "full_content": "Motilal Oswal Mutual Fund (MOMF) last week announced the launch of its new fund offer (NFO), \u2018 Motilal Oswal Nifty Midcap150 Plus 8\u201313 Yr G-Sec 70:30 Index Fund\u2019, an open-ended fund tracking the Nifty Midcap150 index, the company said.\n\nThe hybrid scheme brings together the growth potential of Midcaps and the stability of Government Securities (G-Secs), the release added.\n\n\u201cMidcap companies are in the growth phase of their lifecycle, while government securities carry zero credit risk. The fund is rebalanced monthly to maintain the 70:30 allocation \u2014 buying more of what has fallen and selling some of what has risen \u2014 helping maintain the pre-defined allocation without requiring market prediction or active shift between assets,\u201d according to the statement.\n\nAccording to Motilal Oswal Asset Management Company (MOAMC), the Nifty Midcap150 Plus 8\u201313 Yr G-Sec 70:30 Index aka the \u201cHybrid Index\u201d, has delivered:\n\nDisclaimer: This story is for educational purposes only. The views and recommendations made above are those of individual analysts or broking companies, and not of Mint. We advise investors to check with certified experts before making any investment decisions.\n\nJocelyn Fernandes is a journalist and editor with nearly 13 years of experience covering the business, corporate, economy and markets beats in news.<br> As chief content producer for around three years at Livemint (Hindustan Times), Jocelyn publishes breaking stories, explainers, features and live blogs on a range of business and economy topics, including the Budget, corporate developments, stock markets, income tax, money and personal finance, cryptocurrency, government policy, impact of US tariffs, international developments and more.<br> Jocelyn's writing philosophy is focused on delivering news in an accurate and accessible format for readers.", "source": "LiveMint Money", "pub_date_str": "24 Oct 2026, 03:06 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments", "Fixed Income", "Alternative Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Portfolio Killers: 10 US stocks that wiped out up to 66% of investors\u2019 wealth in 2026", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News Powered By Portfolio Killers: 10 US stocks that wiped out up to 66% of investors\u2019 wealth in 2026 Written by Kumar Gaurav , ETMarkets.com | Oct 24, 2026, 03:15:34 PM IST 1 / 11 Wall Street Losers Amid the AI trade and ongoing geopolitical tensions, several US-listed stocks have come under pressure in 2026. Here are the top 10 stocks with market capitalisations above $5 billion that have fallen between 49% and 66% year to date, according to Vested Finance data.\n\nThe Trade Desk has emerged as the biggest loser on this list, with shares plunging 65.75% in 2026, from $37.96 at the end of last year to $13.00. The digital advertising technology company now has a market capitalisation of $6.1 billion.\n\nFlutter Entertainment has fallen 62.76% in 2026, with shares plunging from $215.04 at the end of last year to $80.09. The global sports betting and gaming company now has a market capitalisation of $13.9 billion.\n\nStellantis has shed 62.72% in 2026, with shares sliding from $10.89 at the end of last year to $4.06. The automaker, which owns brands such as Jeep, Fiat and Peugeot, now has a market capitalisation of $10.6 billion.\n\nAppLovin has plunged 61.38% in 2026, with shares tumbling from $673.82 at the end of last year to $260.25. The advertising technology company still commands a market capitalisation of $87.1 billion.\n\nLululemon Athletica has declined 52.36% in 2026, with shares falling from $207.81 at the end of last year to $99.01. The premium athletic apparel company now has a market capitalisation of $11 billion.\n\nBoston Scientific has lost 52.08% in 2026, with shares dropping from $95.35 at the end of last year to $45.69.", "source": "Economic Times Markets", "pub_date_str": "24 Oct 2026, 03:03 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "French government and corporate bond yields are converging", "full_content": "Some companies\u2019 bonds now yield less than government bonds", "source": "FT Markets", "pub_date_str": "24 Oct 2026, 03:00 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Amazon Pay ICICI Bank Credit Card: No joining fee, no annual charges \u2014 Cashback, Prime benefits and rewards on orders", "full_content": "The Amazon Pay ICICI Bank Credit Card is a lifetime-free credit card for customers who are into consistent shopping on Amazon India and utilise Amazon Pay extensively. This is a credit card issued by ICICI Bank in association with Amazon and Visa.\n\nIt is an offering that comes with cashback opportunities on eligible purchases, with no joining or annual fee. This write-up is dedicated towards discussing its key features and charges as of 24 October 2026.\n\nLet us discuss these aspects in detail to help aspiring applicants better understand the essential features, basic eligibility criteria, and the documents required to apply for this credit card.\n\nThe card offers cashback depending on the shopping platform and the cardholder\u2019s Prime membership status.\n\nNote: These features are illustrative only. For complete details refer to the official website\n\nNow, do note that Non-Prime cardholders earn 2% on specified digital products, gift cards and services instead of the standard 3% Amazon shopping cashback. Earnings are credited automatically to the cardholder\u2019s Amazon Pay balance within 2 working days of the billing cycle\u2019s completion. Furthermore, cashback has no expiry date, no overall earning cap and no minimum redemption requirement.\n\nStill, it is important to keep in mind that exclusions do apply. Transactions involving fuel, rent, taxes, gold and other precious metals, and eligible EMI purchases do not earn cashback. Customers should therefore understand the applicable rules and check the bank's latest terms for a complete list of exclusions.\n\nThe card has no joining fee or annual fee. It also charges 3.75% per month on amounts withdrawn via the ATM. Furthermore, if only the minimum due is paid, the holder must pay 3.75% interest per month. For late bill payments, a fee is charged ranging from \u20b9 100 to \u20b9 1300.", "source": "LiveMint Money", "pub_date_str": "24 Oct 2026, 02:56 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Derivatives", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Govt of Singapore\u2019s India portfolio: 10 stocks rally up to 100% in FY27 so far", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News Govt of Singapore\u2019s India portfolio: 10 stocks rally up to 100% in FY27 so far Written by Ritesh Presswala , ETMarkets.com | Oct 24, 2026, 03:19:56 PM IST 1 / 12 Portfolio Watch The Government of Singapore (GoS) maintains a significant presence in the Indian stock market and ranks among the major foreign institutional investors (FIIs) by portfolio value. According to its latest shareholding disclosures for the September 2026 quarter, GoS held stakes in 36 Indian listed companies, with a combined market value of approximately Rs 1,26,299 crore as of October 24, 2026. This marks a decline of nearly 24% from its portfolio value of Rs 1,65,129 crore in March 2026. In terms of stock performance, around 14 stocks in the portfolio have delivered positive returns so far in FY27, while nearly half have posted negative returns. We highlight the top 10 performers, whose shares have gained between 20% and 100%. We also look at six stocks that were newly added to the portfolio in the September quarter. (Data Source: ACE Equity, Trendlyne)\n\nThe stock has surged 101% so far in FY27, climbing from Rs 1,511 to Rs 3,034. As of the June 2026 quarter, the Government of Singapore held a 2.32% stake in the company, valued at around Rs 310 crore as of October 23, 2026. This stock was newly added to the portfolio in the September 2026 quarter.\n\nThe stock has rallied 56% so far in FY27, rising from Rs 482 to Rs 753. As of the June 2026 quarter, the Government of Singapore held a 6.38% stake in the company, valued at around Rs 2,999 crore as of October 23, 2026.\n\nThe stock has gained 51% so far in FY27, advancing from Rs 5,947 to Rs 8,984.", "source": "Economic Times Markets", "pub_date_str": "24 Oct 2026, 02:50 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Still sending checks in the mail? It's time to stop - USA Today", "full_content": "Still sending checks in the mail? It's time to stop USA Today Check Fraud Moves Fast: How Financial Institutions Can Detect It Earlier www.marketscreener.com Rethink the Trade-offs Between Fraud Prevention and Account Opening Speed The Financial Brand Check Washing Starts in Your Mailbox \u2013 Send Checks From Inside the Post Office Money Crashers", "source": "Google News Business", "pub_date_str": "24 Oct 2026, 02:33 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "EPS-95 pension: Bombay High Court rules in favour of private sector employees seeking pension on higher wages", "full_content": "The Bombay High Court has ruled that EPFO cannot reject eligible private sector employees\u2019 EPS 95 higher-pension applications solely because     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
