    const allData = {"general": [{"title": "Elon Musk invests about $1 billion in Skydance", "full_content": "Elon Musk has made an investment in Skydance of roughly $1 billion, according to a person familiar with the matter who asked not to be named because they were not authorized to speak publicly.\n\nThe financial injection comes as the company looks to cut costs. Paramount closed its acquisition of Warner Bros. Discovery on Oct. 6, naming the combined entity Skydance . Co-CEOs David Ellison and Ynon Kreiz are tasked with merging two major film studios in Paramount and Warner Bros., two popular streaming platforms \u2014 Paramount+ and HBO Max \u2014 and a host of corporate functions to support a portfolio of TV networks and two news divisions.\n\nSkydance has said it expects to see $6 billion in cost savings over three years, though it faces a debt burden of nearly $80 billion.\n\nMusk's commitment is part of a wider effort by Skydance to raise equity investments, according to Semafor, which first reported the news Thursday . Representatives for Musk and Skydance did not immediately respond to CNBC's requests for comment.\n\nEllison's father, Larry Ellison, has a history with Musk. The Oracle co-founder invested $1 billion in Musk's 2022 deal to purchase Twitter, now called X. Larry Ellison also invested in Tesla in 2018 and served on the company's board of directors.\n\nThe elder Ellison also personally guaranteed more than $40 billion of equity financing in Paramount's offer to take over WBD.", "source": "CNBC Top News", "pub_date_str": "22 Oct 2026, 11:32 PM IST", "pub_date_relative": "1m ago"}, {"title": "Mutual Fund SIP returns: Can you still lose money after investing for 10 yrs? How small-cap, mid, large-cap SIPs fared", "full_content": "Investing through a systematic investment plan (SIP) for 10 years is often considered a way to navigate stock market volatility and build long-term wealth . But does investing consistently for a decade guarantee positive returns? Historical data shows that even a 10-year SIP could have ended with a loss, particularly in small-cap stocks.\n\nAccording to a research by Edelweiss Mutual Fund, the worst 10-year rolling SIP return for the Nifty Smallcap 250 Total Returns Index (TRI) was -0.13%. In comparison, the Nifty Midcap 150 TRI delivered a minimum annualised return of 6.37%, while the Nifty 100 TRI, representing large-cap stocks, generated at least 5.07%.\n\nThe findings highlight the differences in returns across market capitalisations. While small-caps recorded the highest maximum return among the three categories, mid-caps delivered the strongest average returns over both five- and ten-year SIP periods.\n\nThe Edelweiss Mutual Fund data shows that small-cap SIPs experienced the widest variation in returns over ten-year periods.\n\nThe Nifty Smallcap 250 TRI recorded a minimum annualised return of -0.13% and a maximum of 22.20%. Its average rolling return stood at 15.01%.\n\nMid-caps performed better on average. The Nifty Midcap 150 TRI generated an average annualised SIP return of 17.61%, with returns ranging between 6.37% and 23.60%.\n\nLarge-cap index delivered an average return of 12.95%, with the minimum and maximum returns standing at 5.07% and 17.02%, respectively.\n\nThe figures show that small-cap SIPs could deliver significantly higher returns during favourable market periods, but they also experienced weaker outcomes when markets were unfavourable.", "source": "LiveMint Money", "pub_date_str": "22 Oct 2026, 11:32 PM IST", "pub_date_relative": "1m ago"}, {"title": "Brent crude tops $113, highest level since May, after Trump hints at action on Iran", "full_content": "Oil prices spiked Thursday on worries over a possible escalation in the Middle East conflict as the U.S. reportedly plans to resume strikes against Iran.\n\nBrent crude futures rose 4% to $113.25 a barrel as of 1:54 p.m. ET. U.S. West Texas Intermediate crude gained 3% to $100.06.\n\nThe U.S. and Israeli militaries have drawn up specific plans for renewed strikes on Iran after next month's midterm elections, unnamed U.S. officials told The New York Times . Planning for a \"short but intensive\" operation is progressing, the officials said.\n\nPresident Donald Trump subsequently said the U.S. is not negotiating with Iran when asked by a reporter late Wednesday. Trump said \"something one way or the other\" will \"happen fairly soon\" on Iran without elaborating.\n\n\"Most people seem to think it's after the election,\" Trump said. \"We're going to see what happens.\"\n\nThe U.S. has also ordered non-emergency government employees and their families to leave Saudi Arabia. State Department spokesman Tommy Pigott in a post on X said the order applies only to Saudi Arabia, dismissing reports that the U.S. had directed some staff in the wider Gulf region to leave.\n\nPigott pointed to escalating attacks by Iran-allied Houthis on civilian targets in Saudi Arabia as the reason for the order. At least two people were killed and eight injured in an attack on King Fahd International Airport in Dammam on Saudi Arabia's East Coast Wednesday, according to Saudi state media .\n\nMeanwhile, oil giant Saudi Aramco has told staff to evacuate its headquarters in Dhahran and work remotely, people familiar with the matter told Reuters Thursday. Aramco facilities have repeatedly come under attack by the Houthis.", "source": "CNBC Top News", "pub_date_str": "22 Oct 2026, 11:30 PM IST", "pub_date_relative": "3m ago"}, {"title": "Meta sell-off drags US tech stocks lower as AI spending fears flare up", "full_content": "US Treasuries rally strongly as traders rush into haven assets", "source": "FT Markets", "pub_date_str": "22 Oct 2026, 11:28 PM IST", "pub_date_relative": "5m ago"}, {"title": "F1 2026: Can Kimi Antonelli Clinch World Title At US GP? All Permutations Explained", "full_content": "Kimi Antonelli leads George Russell by 102 points as the Mercedes driver targets a historic F1 title at the United States Grand Prix in Austin.", "source": "NDTV Profit", "pub_date_str": "22 Oct 2026, 11:26 PM IST", "pub_date_relative": "7m ago"}, {"title": "PM Modi Warns Trade, Technology And Sea Routes Are Being Weaponised Amid Changing World Order", "full_content": "At the NDTV World Summit 2026, the Prime Minister called for stronger global institutions amid a changing world order and rising geopolitical tensions.", "source": "NDTV Profit", "pub_date_str": "22 Oct 2026, 11:25 PM IST", "pub_date_relative": "8m ago"}, {"title": "Rhode Island sues Meta over alleged tolerance for scam advertising", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Oct 2026, 11:24 PM IST", "pub_date_relative": "9m ago"}, {"title": "World Now Trusts India's 'Mindpower' As Global Order Shifts Says PM Modi", "full_content": "Prime Minister Narendra Modi says India is moving beyond its traditional back-office role to become a global innovation hub, while warning that trade, technology and sea routes are increasingly being weaponised.", "source": "NDTV Profit", "pub_date_str": "22 Oct 2026, 11:24 PM IST", "pub_date_relative": "9m ago"}, {"title": "RLI stock hits 52-week high at 67.15 USD", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Oct 2026, 11:24 PM IST", "pub_date_relative": "9m ago"}, {"title": "Lockheed lands Pentagon deal for 850 F-35 jets, lifts annual forecast", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Oct 2026, 11:24 PM IST", "pub_date_relative": "9m ago"}, {"title": "Mp Materials stock hits 52-week low at $37.81", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Oct 2026, 11:23 PM IST", "pub_date_relative": "10m ago"}, {"title": "Daler Mehndi Controversy: CM Pushkar Singh Dhami Steps In After Mika Singh\u2019s Apology Demand", "full_content": "CM Dhami spoke to Mika Singh and said the misunderstanding over Daler Mehndi\u2019s performance should be resolved through mutual dialogue in a cordial atmosphere.", "source": "NDTV Profit", "pub_date_str": "22 Oct 2026, 11:23 PM IST", "pub_date_relative": "10m ago"}, {"title": "Bill Ackman says 2027 will be an amazing year for stocks as wars, inflation ease", "full_content": "Pershing Square CEO Bill Ackman said two geopolitical conflicts \u2014 the Ukraine-Russia and Iran wars \u2014 along with elevated inflation and interest rates are holding back an otherwise \"booming market environment.\"\n\n\"Once the overhang of the war is done \u2014 and it sounds like we're also potentially heading in the right direction with Russia-Ukraine \u2014 energy prices could come way down, and obviously that would be very good for inflation and markets,\" Ackman told CNBC's \"Squawk on the Street\" on Thursday. \"We're going to have an amazing 2027.\"\n\nAckman, who called the Iran conflict an \"extremely well-executed war,\" believes that once there's peace in the Middle East, it will be great for the region and \"ultimately great for the United States.\"\n\nHigher crude prices have pressured stocks all year, as traders fear elevated energy costs will drive up inflation and force the Federal Reserve to raise rates. U.S. oil is up 72% in 2026, while Brent crude has surged 83%.\n\nWTI in 2026 Rising oil appears to have trickled down to consumer prices. Gasoline prices accounted for over half of the increase in the latest consumer price index report. Inflation has been stubborn, moving away from the Federal Reserve's 2% target. Consumer prices rose 3.7% year over year in September.\n\nHigher prices put the Fed in a bind to keep interest rates elevated to tame inflation.\n\nAckman also discussed individual long-term stock opportunities on his radar.\n\nThe hedge fund manager said he viewed Netflix's earnings favorably. The streaming stock dropped more than 5% on Wednesday after reporting lackluster advertising and revenue guidance. On Thursday, however, they bounced more than 3%.", "source": "CNBC Top News", "pub_date_str": "22 Oct 2026, 11:23 PM IST", "pub_date_relative": "10m ago"}, {"title": "AeroVironment stock hits 52-week low at $115.60", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Oct 2026, 11:23 PM IST", "pub_date_relative": "10m ago"}, {"title": "Earnings call transcript: S&T Bancorp tops Q3 2026 forecasts as shares rise", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Oct 2026, 11:19 PM IST", "pub_date_relative": "13m ago"}, {"title": "Lawsuit accuses Trump of illegally profiting off foreign crypto deals", "full_content": "A lawsuit filed Thursday accuses President Donald Trump and his family's crypto company of \"corruptly profiting\" off more than $2 billion in digital currency -related deals, violating constitutional restrictions on accepting foreign money.\n\n\"No president in American history has profited from his office so brazenly,\" alleges the federal civil complaint from a shareholder of Circle Internet Group , a publicly traded U.S. crypto company and competitor of the Trump family business, World Liberty Financial .\n\nThe suit filed in U.S. District Court in Washington by shareholder and former Circle employee J. Benjamin Greenberg centers on two allegedly \"illegal foreign emoluments\" involving World Liberty and Sheikh Tahnoon bin Zayed Al Nahyan, the national security advisor to the United Arab Emirates.\n\nDays before Trump's inauguration in January 2025, an entity backed by Tahnoon \u2014 widely known as the \"Spy Sheikh\" because of his powerful intelligence role \u2014 agreed to buy a 49% stake in World Liberty for $500 million.\n\nThe company told The Wall Street Journal , which revealed the transaction in January 2026, that Trump had no involvement in the deal. But Trump would receive millions of dollars from that purchase after becoming president, according to his financial disclosures.\n\nThe lawsuit also highlights a \"scheme\" by an Abu Dhabi-based investment fund chaired by Tahnoon to \"inflate the value of President Trump's crypto holdings\" through last year's purchase of $2 billion in World Liberty's stablecoin, USD1.\n\nThe lawsuit asserts the conduct violates the U.S. Constitution's Foreign Emoluments Clause, which forbids federal officeholders from accepting money or other gifts from foreign officials without the consent of Congress.\n\n\"This is yet another frivolous lawsuit that echoes the same, tired narrative that Democrats have pushed against President Trump, his family, and his administration for a decade,\" White House spokesperson Anna Kelly told CNBC in a statement.", "source": "CNBC Top News", "pub_date_str": "22 Oct 2026, 11:19 PM IST", "pub_date_relative": "14m ago"}, {"title": "Meta stock sinks 6% as AI spend pushes free cash flow negative", "full_content": "Meta shares slumped roughly 6% on Thursday as the social media giant showed negative free cash flow in its third-quarter earnings and raised the floor of its full-year capital expenditures.\n\nThe spread on the social media giant's five-year credit default swaps reached all-time highs on Thursday, a signal of growing credit concerns from investors as the company leans deeper into its artificial intelligence spending plans.\n\nMeta said it expects its full-year capex to range from $135 billion to $145 billion, raising the bottom of the range from a previous $130 billion.\n\nFree cash flow came in at a negative $2.12 billion during the quarter.\n\nThe company revealed Wednesday that it would create a new class of nonvoting Class C common stock during its earnings release, meant to maintain its \"founder-led structure\" and \"provide Meta the ability to finance its growth.\"\n\nMeta also said CEO Mark Zuckerberg could leave the state if the \"California Wealth Tax\" were to pass, as he \"could become liable for a significant, multi-billion-dollar tax payment based on his ownership of stock in the Company,\" according to the SEC filing.\n\nZuckerberg was convinced to stay in California with the company's new stock plan, the filing noted.\n\nRevenue for the social media giant jumped 26% in the third quarter from a year ago, coming in at $64.60 billion versus the $63.37 billion analysts expected. Earnings per share were reported at $3.83, though it wasn't clear if it was directly comparable with the $5.75 per share Wall Street was looking for.", "source": "CNBC World Economy", "pub_date_str": "22 Oct 2026, 11:18 PM IST", "pub_date_relative": "15m ago"}, {"title": "FCC blocks devices with Huawei surveillance chips from US market", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Oct 2026, 11:18 PM IST", "pub_date_relative": "15m ago"}, {"title": "MetroCity Bankshares declares $0.31 quarterly dividend", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Oct 2026, 11:18 PM IST", "pub_date_relative": "15m ago"}, {"title": "Kering Q3 2026 slides: Gucci drags as jewelry, eyewear shine", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Oct 2026, 11:18 PM IST", "pub_date_relative": "15m ago"}, {"title": "Gautam Singhania Unveils Raymond 3.0 With 22 Senior Hires, Says Succession Plan Is Complete", "full_content": "Describing the shift as \"Raymond 3.0\", Singhania said the focus was on building a new team that is in line with the group's future direction.", "source": "NDTV Profit", "pub_date_str": "22 Oct 2026, 11:17 PM IST", "pub_date_relative": "16m ago"}, {"title": "Dutch Bros 10% owner sells $4.18m in stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Oct 2026, 11:16 PM IST", "pub_date_relative": "17m ago"}, {"title": "Polymarket's X Account Withheld In India In Response To Legal Demand", "full_content": "India's restrictions on real-money gaming have widened, with Polymarket's official X account now withheld in the country months after authorities blocked access to its prediction-market website.", "source": "NDTV Profit", "pub_date_str": "22 Oct 2026, 11:14 PM IST", "pub_date_relative": "19m ago"}, {"title": "Virginia state Sen. L. Louise Lucas, a Trump critic, charged in marijuana racketeering case", "full_content": "Virginia state Sen. L. Louise Lucas has been charged in a federal indictment with leading an alleged marijuana racketeering conspiracy that included family members of the powerful Democrat , according to court documents made public on Thursday.\n\nThe indictment and the FBI said the five-year scheme, which was worth an estimated $4.5 million, obtained and illegally distributed \"large quantities of illegal marijuana,\" and aimed to procure \"generational wealth\" for members of the enterprise.\n\nLucas, 82, is a critic of President Donald Trump , and was an architect of ultimately failed efforts in Virginia to redraw the state's congressional map for November to boost chances for Democrats to win certain districts. She also has been a proponent of legalizing marijuana in the state.\n\nThe criminal case, which also charges members of Lucas' family, was made public by the Department of Justice less than two weeks before the midterm election . Those contests will determine what political party controls both chambers of Congress.\n\nLucas, the state Senate's president pro tempore and chairman of the Finance and Appropriations Committee, is not on the ballot this year. The indictment alleges that Lucas, who was first elected to the Senate in 1991, leveraged her position as chairman of the powerful committee to protect her marijuana enterprise.\n\nThe indictment says Lucas \"was the leader of the enterprise,\" that she \"arranged for the acquisition and distribution of marijuana, supervises the laundering of marijuana proceeds,\" and \"used her political influence to attempt to influence Virginia legislation for the benefit of herself and her family and maintained a premise for the distribution of marijuana.\" The alleged scheme used two stores, CBD Shopped and The Cannabis Outlet, for its operation.\n\n\"On May 6, the FBI executed federal search warrants at The Cannabis Outlet and The CBD Shoppe,\" the Department of Justice said in a statement.", "source": "CNBC Top News", "pub_date_str": "22 Oct 2026, 11:09 PM IST", "pub_date_relative": "24m ago"}, {"title": "Third-party evaluators found vulnerabilities in OpenAI monitoring system during test pilot", "full_content": "Nonprofit evaluators METR and Redwood Research on Thursday said they conducted a pilot review of an internal monitoring system at OpenAI , the artificial intelligence company's latest effort to determine how it will deepen its work with third-party safety organizations .\n\nMETR and Redwood said the exercise was designed for OpenAI to test what it would look like to give external researchers \"a deep level of access\" to its internal infrastructure.\n\nFrom July 21 to Aug. 11, an employee from each organization had access to OpenAI's internal codebase, documentation and some technical staffers. The employees were chaperoned while on-site and used OpenAI-issued devices that \"never left the premises,\" according to a release.\n\nThe evaluators discovered several \"novel vulnerabilities,\" including an exploit that would allow agents to prevent \"hundreds\" of recent actions from being monitored. OpenAI told METR and Redwood that it has patched the identified vulnerabilities that impact its production safeguards, according to the release.\n\nMETR and Redwood said they agreed to only publish a high-level public post about their findings since the pilot was not designed to \"provide robust public transparency about OpenAI's monitoring system.\" They shared a 61-page internal report with OpenAI, and said they expect to publicly share more details about future exercises.\n\n\"This collaboration builds on our longstanding commitment to pioneering new approaches to third-party testing, and we're using what we learned to strengthen our safeguards and shape future collaborations with independent evaluators,\" an OpenAI spokesperson told CNBC in a statement.\n\nOpenAI CEO Sam Altman pledged to grant independent evaluators \" employee-like access \" to the company in September, after Anthropic CEO Dario Amodei proposed the idea as part of his plan to slow the pace of AI development . Anthropic has since announced agreements with organizations like Accenture , METR and SecureBio.", "source": "CNBC World Economy", "pub_date_str": "22 Oct 2026, 11:07 PM IST", "pub_date_relative": "26m ago"}, {"title": "Elon Musk\u2019s Stake in Skydance Could Transform Media As We Know It - The Hollywood Reporter", "full_content": "Elon Musk\u2019s Stake in Skydance Could Transform Media As We Know It The Hollywood Reporter Elon Musk reportedly invests about $1 billion in Skydance CNBC Exclusive / Elon Musk makes $1 billion investment in Ellison\u2019s Skydance Semafor Skydance (SKYD) Soars on Potential Billion-Dollar Investment \u2014 The Next Key Event to Watch Yahoo Finance John Malone Predicts a Major Deal Between Skydance and Elon Musk\u2019s SpaceX The Hollywood Reporter", "source": "Google News Business", "pub_date_str": "22 Oct 2026, 11:07 PM IST", "pub_date_relative": "26m ago"}, {"title": "Q2 Results Highlights: Nuvoco Vistas Profit Jumps 81%, HPCL Swings To Profit", "full_content": "Street to track results from Swiggy, Havells, Colgate-Palmolive, Adani Total Gas, HPCL, Nippon Life AMC and J&K Bank amid a busy earnings day.", "source": "NDTV Profit", "pub_date_str": "22 Oct 2026, 11:02 PM IST", "pub_date_relative": "31m ago"}, {"title": "'Never Done Till It's Done': Jaishankar On India-US Trade Deal And Tariff Risks", "full_content": "External trade talks are progressing, but S Jaishankar says the final stages remain challenging as global tariff uncertainty, sanctions and supply-chain disruptions reshape India's economic strategy.", "source": "NDTV Profit", "pub_date_str": "22 Oct 2026, 10:59 PM IST", "pub_date_relative": "34m ago"}, {"title": "Elon Musk promised a SpaceX share to every kid in America \u2014 don\u2019t hold your breath", "full_content": "Trick or treat? Musk has a long record of saying things have little relation to reality.", "source": "MarketWatch Top Stories", "pub_date_str": "22 Oct 2026, 10:59 PM IST", "pub_date_relative": "34m ago"}, {"title": "We're dipping back into the AI trade with our first data center buy in weeks", "full_content": "The stock is also getting an upgrade, with the expectation of a bounce ahead.", "source": "CNBC Top News", "pub_date_str": "22 Oct 2026, 10:58 PM IST", "pub_date_relative": "35m ago"}, {"title": "The Social Security Administration wants more babies signed up for \u2018Trump accounts.\u2019 But there\u2019s still a catch.", "full_content": "Social Security is looking to reverse an initially slow uptake on Trump accounts", "source": "MarketWatch Top Stories", "pub_date_str": "22 Oct 2026, 10:54 PM IST", "pub_date_relative": "39m ago"}, {"title": "Stocks making the biggest moves midday: Procter & Gamble, Lam Research, Blackstone, Southwest & more", "full_content": "These are some of the stocks posting the largest moves midday.", "source": "CNBC Top News", "pub_date_str": "22 Oct 2026, 10:53 PM IST", "pub_date_relative": "40m ago"}, {"title": "Netanyahu Invites PM Modi To Israel's Independence Day; Smit Machchhar To Be Honoured", "full_content": "Machchhar was injured while confronting his co-pilot aboard a Dubai-Tel Aviv flight carrying 174 passengers on September 30.", "source": "NDTV Profit", "pub_date_str": "22 Oct 2026, 10:52 PM IST", "pub_date_relative": "41m ago"}, {"title": "Young investors are betting on prediction markets and crypto. But this bestselling author says the boring money moves still work.", "full_content": "Beth Kobliner, author of \u201cGet a Financial Life,\u201d explains why today\u2019s young people face a tougher financial world and reveals the three money moves she would make first.", "source": "MarketWatch Top Stories", "pub_date_str": "22 Oct 2026, 10:51 PM IST", "pub_date_relative": "42m ago"}, {"title": "\u2018AI is on trial\u2019: Bond yields sink below 5% as investors look for safety", "full_content": "Investors are flooding back into Treasurys for safety to hedge the risks of more AI fallout in stock and credit markets.", "source": "MarketWatch Top Stories", "pub_date_str": "22 Oct 2026, 10:46 PM IST", "pub_date_relative": "47m ago"}, {"title": "AI's future hinges on public safety concern, cybersecurity, regulatory work in Congress - Fox News", "full_content": "AI's future hinges on public safety concern, cybersecurity, regulatory work in Congress Fox News Anthropic quietly pitches its own AI safety bill to lawmakers Politico Rogue AI Must Threaten 50 Lives Before Being Shut Down, Anthropic Suggests Novara Media Dario Amodei spent 2,000 words laying out to a critic on X why Anthropic must persist in the AI \u2018race to the top\u2019 Business Insider Anthropic pitches AI safety bill that may block a model if 50+ people could be killed TechCrunch", "source": "Google News Business", "pub_date_str": "22 Oct 2026, 10:43 PM IST", "pub_date_relative": "50m ago"}, {"title": "Race to update services' computer systems after cyber-security flaw found - BBC", "full_content": "Race to update services' computer systems after cyber-security flaw found BBC AI finds cybersecurity issue affecting 70% of the internet, forcing websites to shut down CNN PHP2Shell: AI uncovers critical RCE vulnerabilities affecting 70% of the Internet wiz.io Millions of hacking attempts as companies, governments rush to patch PHP flaws Reuters What to know about the AI-detected security bug impacting wide swaths of the internet AP News", "source": "Google News Business", "pub_date_str": "22 Oct 2026, 10:42 PM IST", "pub_date_relative": "51m ago"}, {"title": "PM Modi Targets Congress, Calls Rahul Gandhi 'Failed Product'", "full_content": "Speaking at the NDTV World Summit 2026, PM Modi accused the Congress of trying to launch a \"failed product\" more often than Sriharikota sees rocket launches, in a veiled attack on Rahul Gandhi.", "source": "NDTV Profit", "pub_date_str": "22 Oct 2026, 10:41 PM IST", "pub_date_relative": "52m ago"}, {"title": "Apple stock rises 28% in 2026 as AI stocks wobble: Why investors are betting on the iPhone maker", "full_content": "Apple Inc. has emerged as one of the most reliable trades in the stock market as sentiment towards artificial intelligence (AI) swings wildly. While AI stocks face volatility amid concerns over rising infrastructure spending, the iPhone maker\u2019s shares have continued to climb, making it a preferred choice for investors seeking exposure to Big Tech without taking on the same level of risk.\n\nAccording to a Bloomberg report, Apple\u2019s stock has risen 28% in 2026, making it the biggest contributor to the S&P 500 Index\u2019s 12% climb. It is also the best performer among the Magnificent Seven technology giants this year, marking a sharp reversal from 2025, when its 8% gain placed it near the bottom of the group.\n\nThe report said that the divergence is largely driven by Apple\u2019s strategy of avoiding the massive AI infrastructure spending undertaken by its mega-cap technology peers. While companies such as Microsoft, Amazon, Alphabet and Meta Platforms are investing heavily in AI infrastructure, Apple is focusing on its core strength of developing consumer products that generate excitement, including its new foldable iPhone Duo.\n\nWith Wall Street\u2019s view of AI capital expenditure constantly shifting, Apple\u2019s shares have become a way for investors to maintain exposure to Big Tech while avoiding some of the volatility affecting the broader AI trade.\n\nAccording to the Bloomberg report, the divergence has become more pronounced as investors reassess whether the hundreds of billions of dollars being invested in AI infrastructure will generate sufficient returns. Concerns over debt at cloud computing provider CoreWeave recently triggered widespread selling in AI stocks.\n\nThe semiconductor index, known as the SOX, fell more than 11% last week, marking its worst weekly performance since April 2025, while an index tracking the Magnificent Seven declined 3.1%.", "source": "LiveMint Markets", "pub_date_str": "22 Oct 2026, 10:38 PM IST", "pub_date_relative": "55m ago"}, {"title": "PM Modi's Top 10 Quotes At NDTV World Summit 2026: From 2-3nm Chips To A New World Order", "full_content": "Modi says Indian engineers are designing 2-3 nm chips as India seeks to expand its semiconductor capabilities and strengthen its position in the global technology ecosystem.", "source": "NDTV Profit", "pub_date_str": "22 Oct 2026, 10:35 PM IST", "pub_date_relative": "58m ago"}, {"title": "Magnitude 7 Earthquake Strikes Tibet, Weeks After Deadly Floods Hit Nepal-Tibet Border", "full_content": "Tibet was hit by a powerful magnitude 7 earthquake on Thursday, with two more quakes recorded shortly after. There is no immediate word on casualties or damage.", "source": "NDTV Profit", "pub_date_str": "22 Oct 2026, 10:32 PM IST", "pub_date_relative": "1h ago"}, {"title": "FIFA launches tender of 2030 men's World Cup U.S. media rights, plans to choose winner by end of year", "full_content": "The CNBC Sport newsletter with Alex Sherman brings you the biggest news and exclusive interviews from the worlds of sports business and media, delivered weekly to your inbox.\n\nThe FIFA men's World Cup U.S. television rights are formally up for auction.\n\nFIFA is launching its tender offer Thursday for the 2030 U.S. media rights with an option for potential partners to also buy rights for the 2034 World Cup. FIFA wants bids in by Nov. 19.\n\nYouTube, Netflix, Amazon and Disney are all interested, CNBC reported in July. Rights could sell for between $1.5 billion and $2 billion, some media executives predicted at the time. FIFA hasn't sold U.S. men's World Cup TV rights since 2011.\n\nFox paid $425 million for the 2026 World Cup, which broke U.S. ratings records. Matches averaged 13.5 million viewers \u2014 up 166% from 2022.\n\nThe 2030 World Cup will take place in Spain, Portugal and Morocco.\n\nFIFA would prefer to sell the English and the Spanish-language rights packaged together to one media partner \u2013 a departure from previous deals. For this past World Cup, NBCUniversal's Telemundo owned the Spanish rights while Fox owned the English rights. That led to some tension between the broadcasters and FIFA, as Peacock carried the Spanish-language rights for a less expensive price than Fox One, which streamed the games with English announcers.\n\nFIFA Chief Business Officer Romy Gai said it's too early to gauge what price is realistic for the 2030 World Cup. FIFA is willing to listen to offers where just one media company buys the entire package or a joint offering \u2013 potentially between a streamer and a traditional broadcaster.", "source": "CNBC Top News", "pub_date_str": "22 Oct 2026, 10:31 PM IST", "pub_date_relative": "1h ago"}, {"title": "IIFA 2026: Salman Khan Steals The Show With Little Fan Kiss, Kareena Hug And Paps Warning | Watch Video", "full_content": "Salman Khan grabbed attention at the IIFA 2026 press conference as he kissed a little fan, hugged Kareena Kapoor and warned paps about camera angles while posing for pictures.", "source": "NDTV Profit", "pub_date_str": "22 Oct 2026, 10:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "Judge orders Trump to sit for deposition in BBC defamation lawsuit by Dec. 11: Reports", "full_content": "A federal judge in Miami on Thursday ordered that President Donald Trump sit for a deposition in his $10 billion defamation lawsuit against the BBC by Dec. 11, according to multiple news outlets.\n\nU.S. Magistrate Judge Enjoliqu\u00e9 Lett, at a court hearing Thursday, also warned Trump's attorneys that if the president does not comply with court orders to give lawyers for the British media outlet records that are relevant to the lawsuit, his complaint could be dismissed, Politico reported.\n\nTrump's lawyers had requested that his deposition be conducted between Jan. 11 and Jan. 22.\n\nCharles Tobin, the attorney for the BBC , told Lett at the hearing that although Trump had originally agreed to sit for a deposition on Oct. 16, the president canceled it for a \"matter of national importance,\" The Associated Press reported.\n\nBut in fact, Tobin said, Trump was campaigning in Georgia that day, the AP reported.\n\n\"He was participating in party politics and prioritized that over sitting for the deposition,\" Tobin told judge.\n\nWhen contacted by CNBC for comment, the BBC said: \"We have nothing to add.\"\n\nLawyers for the BBC in a recent court filing had accused Trump's legal team of foot-dragging in complying with requests for documents and records relevant to the case, a process known as discovery.", "source": "CNBC Top News", "pub_date_str": "22 Oct 2026, 10:29 PM IST", "pub_date_relative": "1h ago"}, {"title": "Pershing's Ackman sees a $1 trillion Israeli company within a decade", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Pershing's Ackman sees a $1 trillion Israeli company within a decade Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Pershing's Ackman sees a $1 trillion Israeli company within a decade SECTIONS Pershing's Ackman sees a $1 trillion Israeli company within a decade Reuters Last Updated: Oct 22, 2026, 10:26:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Billionaire investor Bill Ackman said he remained bullish on Israel\u2019s economy and financial markets, predicting the country could produce a $1 trillion company within a decade. He highlighted Israel\u2019s technology ecosystem, AI potential and growing ambitions to build global companies, while saying the country\u2019s small population could become an advantage.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "22 Oct 2026, 10:26 PM IST", "pub_date_relative": "1h ago"}, {"title": "IndiGo Q2 Results: Date, Time, Dividend News, Earnings Call Schedule And More", "full_content": "InterGlobe Aviation\u2019s board will review September-quarter earnings on October 29; the company has yet to disclose the results announcement time or dividend plans.", "source": "NDTV Profit", "pub_date_str": "22 Oct 2026, 10:26 PM IST", "pub_date_relative": "1h ago"}, {"title": "Musk's clash with Ukraine accelerates demand for Starlink alternatives. Few exist", "full_content": "Elon Musk 's latest clash with Ukraine underscores the critical role that his company's Starlink satellite internet service has played in Kyiv's defense against Russia, which invaded unprovoked in 2022.\n\nIt's also laid bare the downsides of depending on a single provider for satellite internet communications, though other options are not yet comparable to SpaceX's Starlink and its military-grade Starshield offering.\n\nOn Oct. 14, Ukrainian officials accused SpaceX of undermining the country's ability to defend itself.\n\nSpaceX and the U.S., they said, had suddenly and without warning imposed speed limits on Starshield . SpaceX describes Starshield as a \"secured satellite network for government entities\" that \"leverages Starlink technology.\"\n\nThe changes cut wireless internet connectivity in drones and other aircraft moving at speeds over 100 mph that Ukrainian forces were using in the campaign against Russia. A Ukrainian senior commander told The New York Times the Starlink restrictions cost his unit more than $1 million and delayed missions by three days.\n\nMusk and President Donald Trump , both critics of Ukrainian President Volodymyr Zelenskyy , have each shirked accountability for the communications disruptions in the war-torn nation.\n\nOn Tuesday, The Wall Street Journal reported that Musk individually ordered the service changes, and had discussed them with Trump before putting them in place. Trump insisted on Wednesday that he \"was not involved.\"\n\nRobert Weissman, who is co-president of watchdog group Public Citizen, said the situation is an \"extreme danger \" that raises antitrust and security concerns around Musk's ability to control a \"crucial means of communication.\"", "source": "CNBC World Economy", "pub_date_str": "22 Oct 2026, 10:24 PM IST", "pub_date_relative": "1h ago"}, {"title": "Average long-term US mortgage rate eases to 7.32% in first pullback since late August", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Average long-term US mortgage rate eases to 7.32% in first pullback since late August Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Average long-term US mortgage rate eases to 7.32% in first pullback since late August SECTIONS Average long-term US mortgage rate eases to 7.32% in first pullback since late August By AP Last Updated: Oct 22, 2026, 10:22:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis US mortgage rates eased for the first time since late August, with the average 30-year fixed rate falling to 7.32% from 7.40% last week, Freddie Mac said. The decline offers some relief to homebuyers, but borrowing costs remain elevated, with higher rates continuing to weigh on US home sales and demand.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "22 Oct 2026, 10:22 PM IST", "pub_date_relative": "1h ago"}, {"title": "Young Americans are giving up their cars. It\u2019s a path to financial freedom, for some.", "full_content": "With vehicle prices soaring and ownership increasingly out of reach, some young adults are discovering that life without a car leaves them with breathing room to spend on other things", "source": "MarketWatch Top Stories", "pub_date_str": "22 Oct 2026, 10:18 PM IST", "pub_date_relative": "1h ago"}, {"title": "Zuckerberg\u2019s California tax move is a win for Meta \u2014 and for him", "full_content": "He has bought some good PR and gets to live and work where he wants.", "source": "MarketWatch Top Stories", "pub_date_str": "22 Oct 2026, 10:18 PM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "Elon Musk invests about $1 billion in Skydance", "full_content": "Elon Musk has made an investment in Skydance of roughly $1 billion, according to a person familiar with the matter who asked not to be named because they were not authorized to speak publicly.\n\nThe financial injection comes as the company looks to cut costs. Paramount closed its acquisition of Warner Bros. Discovery on Oct. 6, naming the combined entity Skydance . Co-CEOs David Ellison and Ynon Kreiz are tasked with merging two major film studios in Paramount and Warner Bros., two popular streaming platforms \u2014 Paramount+ and HBO Max \u2014 and a host of corporate functions to support a portfolio of TV networks and two news divisions.\n\nSkydance has said it expects to see $6 billion in cost savings over three years, though it faces a debt burden of nearly $80 billion.\n\nMusk's commitment is part of a wider effort by Skydance to raise equity investments, according to Semafor, which first reported the news Thursday . Representatives for Musk and Skydance did not immediately respond to CNBC's requests for comment.\n\nEllison's father, Larry Ellison, has a history with Musk. The Oracle co-founder invested $1 billion in Musk's 2022 deal to purchase Twitter, now called X. Larry Ellison also invested in Tesla in 2018 and served on the company's board of directors.\n\nThe elder Ellison also personally guaranteed more than $40 billion of equity financing in Paramount's offer to take over WBD.", "source": "CNBC Top News", "pub_date_str": "22 Oct 2026, 11:32 PM IST", "pub_date_relative": "1m ago", "cfa_topics": ["Corporate Issuers", "Portfolio Management"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Mutual Fund SIP returns: Can you still lose money after investing for 10 yrs? How small-cap, mid, large-cap SIPs fared", "full_content": "Investing through a systematic investment plan (SIP) for 10 years is often considered a way to navigate stock market volatility and build long-term wealth . But does investing consistently for a decade guarantee positive returns? Historical data shows that even a 10-year SIP could have ended with a loss, particularly in small-cap stocks.\n\nAccording to a research by Edelweiss Mutual Fund, the worst 10-year rolling SIP return for the Nifty Smallcap 250 Total Returns Index (TRI) was -0.13%. In comparison, the Nifty Midcap 150 TRI delivered a minimum annualised return of 6.37%, while the Nifty 100 TRI, representing large-cap stocks, generated at least 5.07%.\n\nThe findings highlight the differences in returns across market capitalisations. While small-caps recorded the highest maximum return among the three categories, mid-caps delivered the strongest average returns over both five- and ten-year SIP periods.\n\nThe Edelweiss Mutual Fund data shows that small-cap SIPs experienced the widest variation in returns over ten-year periods.\n\nThe Nifty Smallcap 250 TRI recorded a minimum annualised return of -0.13% and a maximum of 22.20%. Its average rolling return stood at 15.01%.\n\nMid-caps performed better on average. The Nifty Midcap 150 TRI generated an average annualised SIP return of 17.61%, with returns ranging between 6.37% and 23.60%.\n\nLarge-cap index delivered an average return of 12.95%, with the minimum and maximum returns standing at 5.07% and 17.02%, respectively.\n\nThe figures show that small-cap SIPs could deliver significantly higher returns during favourable market periods, but they also experienced weaker outcomes when markets were unfavourable.", "source": "LiveMint Money", "pub_date_str": "22 Oct 2026, 11:32 PM IST", "pub_date_relative": "1m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Brent crude tops $113, highest level since May, after Trump hints at action on Iran", "full_content": "Oil prices spiked Thursday on worries over a possible escalation in the Middle East conflict as the U.S. reportedly plans to resume strikes against Iran.\n\nBrent crude futures rose 4% to $113.25 a barrel as of 1:54 p.m. ET. U.S. West Texas Intermediate crude gained 3% to $100.06.\n\nThe U.S. and Israeli militaries have drawn up specific plans for renewed strikes on Iran after next month's midterm elections, unnamed U.S. officials told The New York Times . Planning for a \"short but intensive\" operation is progressing, the officials said.\n\nPresident Donald Trump subsequently said the U.S. is not negotiating with Iran when asked by a reporter late Wednesday. Trump said \"something one way or the other\" will \"happen fairly soon\" on Iran without elaborating.\n\n\"Most people seem to think it's after the election,\" Trump said. \"We're going to see what happens.\"\n\nThe U.S. has also ordered non-emergency government employees and their families to leave Saudi Arabia. State Department spokesman Tommy Pigott in a post on X said the order applies only to Saudi Arabia, dismissing reports that the U.S. had directed some staff in the wider Gulf region to leave.\n\nPigott pointed to escalating attacks by Iran-allied Houthis on civilian targets in Saudi Arabia as the reason for the order. At least two people were killed and eight injured in an attack on King Fahd International Airport in Dammam on Saudi Arabia's East Coast Wednesday, according to Saudi state media .\n\nMeanwhile, oil giant Saudi Aramco has told staff to evacuate its headquarters in Dhahran and work remotely, people familiar with the matter told Reuters Thursday. Aramco facilities have repeatedly come under attack by the Houthis.", "source": "CNBC Top News", "pub_date_str": "22 Oct 2026, 11:30 PM IST", "pub_date_relative": "3m ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Bill Ackman says 2027 will be an amazing year for stocks as wars, inflation ease", "full_content": "Pershing Square CEO Bill Ackman said two geopolitical conflicts \u2014 the Ukraine-Russia and Iran wars \u2014 along with elevated inflation and interest rates are holding back an otherwise \"booming market environment.\"\n\n\"Once the overhang of the war is done \u2014 and it sounds like we're also potentially heading in the right direction with Russia-Ukraine \u2014 energy prices could come way down, and obviously that would be very good for inflation and markets,\" Ackman told CNBC's \"Squawk on the Street\" on Thursday. \"We're going to have an amazing 2027.\"\n\nAckman, who called the Iran conflict an \"extremely well-executed war,\" believes that once there's peace in the Middle East, it will be great for the region and \"ultimately great for the United States.\"\n\nHigher crude prices have pressured stocks all year, as traders fear elevated energy costs will drive up inflation and force the Federal Reserve to raise rates. U.S. oil is up 72% in 2026, while Brent crude has surged 83%.\n\nWTI in 2026 Rising oil appears to have trickled down to consumer prices. Gasoline prices accounted for over half of the increase in the latest consumer price index report. Inflation has been stubborn, moving away from the Federal Reserve's 2% target. Consumer prices rose 3.7% year over year in September.\n\nHigher prices put the Fed in a bind to keep interest rates elevated to tame inflation.\n\nAckman also discussed individual long-term stock opportunities on his radar.\n\nThe hedge fund manager said he viewed Netflix's earnings favorably. The streaming stock dropped more than 5% on Wednesday after reporting lackluster advertising and revenue guidance. On Thursday, however, they bounced more than 3%.", "source": "CNBC Top News", "pub_date_str": "22 Oct 2026, 11:23 PM IST", "pub_date_relative": "10m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Earnings call transcript: S&T Bancorp tops Q3 2026 forecasts as shares rise", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Oct 2026, 11:19 PM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Lawsuit accuses Trump of illegally profiting off foreign crypto deals", "full_content": "A lawsuit filed Thursday accuses President Donald Trump and his family's crypto company of \"corruptly profiting\" off more than $2 billion in digital currency -related deals, violating constitutional restrictions on accepting foreign money.\n\n\"No president in American history has profited from his office so brazenly,\" alleges the federal civil complaint from a shareholder of Circle Internet Group , a publicly traded U.S. crypto company and competitor of the Trump family business, World Liberty Financial .\n\nThe suit filed in U.S. District Court in Washington by shareholder and former Circle employee J. Benjamin Greenberg centers on two allegedly \"illegal foreign emoluments\" involving World Liberty and Sheikh Tahnoon bin Zayed Al Nahyan, the national security advisor to the United Arab Emirates.\n\nDays before Trump's inauguration in January 2025, an entity backed by Tahnoon \u2014 widely known as the \"Spy Sheikh\" because of his powerful intelligence role \u2014 agreed to buy a 49% stake in World Liberty for $500 million.\n\nThe company told The Wall Street Journal , which revealed the transaction in January 2026, that Trump had no involvement in the deal. But Trump would receive millions of dollars from that purchase after becoming president, according to his financial disclosures.\n\nThe lawsuit also highlights a \"scheme\" by an Abu Dhabi-based investment fund chaired by Tahnoon to \"inflate the value of President Trump's crypto holdings\" through last year's purchase of $2 billion in World Liberty's stablecoin, USD1.\n\nThe lawsuit asserts the conduct violates the U.S. Constitution's Foreign Emoluments Clause, which forbids federal officeholders from accepting money or other gifts from foreign officials without the consent of Congress.\n\n\"This is yet another frivolous lawsuit that echoes the same, tired narrative that Democrats have pushed against President Trump, his family, and his administration for a decade,\" White House spokesperson Anna Kelly told CNBC in a statement.", "source": "CNBC Top News", "pub_date_str": "22 Oct 2026, 11:19 PM IST", "pub_date_relative": "14m ago", "cfa_topics": ["Corporate Issuers", "Alternative Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Meta stock sinks 6% as AI spend pushes free cash flow negative", "full_content": "Meta shares slumped roughly 6% on Thursday as the social media giant showed negative free cash flow in its third-quarter earnings and raised the floor of its full-year capital expenditures.\n\nThe spread on the social media giant's five-year credit default swaps reached all-time highs on Thursday, a signal of growing credit concerns from investors as the company leans deeper into its artificial intelligence spending plans.\n\nMeta said it expects its full-year capex to range from $135 billion to $145 billion, raising the bottom of the range from a previous $130 billion.\n\nFree cash flow came in at a negative $2.12 billion during the quarter.\n\nThe company revealed Wednesday that it would create a new class of nonvoting Class C common stock during its earnings release, meant to maintain its \"founder-led structure\" and \"provide Meta the ability to finance its growth.\"\n\nMeta also said CEO Mark Zuckerberg could leave the state if the \"California Wealth Tax\" were to pass, as he \"could become liable for a significant, multi-billion-dollar tax payment based on his ownership of stock in the Company,\" according to the SEC filing.\n\nZuckerberg was convinced to stay in California with the company's new stock plan, the filing noted.\n\nRevenue for the social media giant jumped 26% in the third quarter from a year ago, coming in at $64.60 billion versus the $63.37 billion analysts expected. Earnings per share were reported at $3.83, though it wasn't clear if it was directly comparable with the $5.75 per share Wall Street was looking for.", "source": "CNBC World Economy", "pub_date_str": "22 Oct 2026, 11:18 PM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "MetroCity Bankshares declares $0.31 quarterly dividend", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Oct 2026, 11:18 PM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Virginia state Sen. L. Louise Lucas, a Trump critic, charged in marijuana racketeering case", "full_content": "Virginia state Sen. L. Louise Lucas has been charged in a federal indictment with leading an alleged marijuana racketeering conspiracy that included family members of the powerful Democrat , according to court documents made public on Thursday.\n\nThe indictment and the FBI said the five-year scheme, which was worth an estimated $4.5 million, obtained and illegally distributed \"large quantities of illegal marijuana,\" and aimed to procure \"generational wealth\" for members of the enterprise.\n\nLucas, 82, is a critic of President Donald Trump , and was an architect of ultimately failed efforts in Virginia to redraw the state's congressional map for November to boost chances for Democrats to win certain districts. She also has been a proponent of legalizing marijuana in the state.\n\nThe criminal case, which also charges members of Lucas' family, was made public by the Department of Justice less than two weeks before the midterm election . Those contests will determine what political party controls both chambers of Congress.\n\nLucas, the state Senate's president pro tempore and chairman of the Finance and Appropriations Committee, is not on the ballot this year. The indictment alleges that Lucas, who was first elected to the Senate in 1991, leveraged her position as chairman of the powerful committee to protect her marijuana enterprise.\n\nThe indictment says Lucas \"was the leader of the enterprise,\" that she \"arranged for the acquisition and distribution of marijuana, supervises the laundering of marijuana proceeds,\" and \"used her political influence to attempt to influence Virginia legislation for the benefit of herself and her family and maintained a premise for the distribution of marijuana.\" The alleged scheme used two stores, CBD Shopped and The Cannabis Outlet, for its operation.\n\n\"On May 6, the FBI executed federal search warrants at The Cannabis Outlet and The CBD Shoppe,\" the Department of Justice said in a statement.", "source": "CNBC Top News", "pub_date_str": "22 Oct 2026, 11:09 PM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Corporate Issuers", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Third-party evaluators found vulnerabilities in OpenAI monitoring system during test pilot", "full_content": "Nonprofit evaluators METR and Redwood Research on Thursday said they conducted a pilot review of an internal monitoring system at OpenAI , the artificial intelligence company's latest effort to determine how it will deepen its work with third-party safety organizations .\n\nMETR and Redwood said the exercise was designed for OpenAI to test what it would look like to give external researchers \"a deep level of access\" to its internal infrastructure.\n\nFrom July 21 to Aug. 11, an employee from each organization had access to OpenAI's internal codebase, documentation and some technical staffers. The employees were chaperoned while on-site and used OpenAI-issued devices that \"never left the premises,\" according to a release.\n\nThe evaluators discovered several \"novel vulnerabilities,\" including an exploit that would allow agents to prevent \"hundreds\" of recent actions from being monitored. OpenAI told METR and Redwood that it has patched the identified vulnerabilities that impact its production safeguards, according to the release.\n\nMETR and Redwood said they agreed to only publish a high-level public post about their findings since the pilot was not designed to \"provide robust public transparency about OpenAI's monitoring system.\" They shared a 61-page internal report with OpenAI, and said they expect to publicly share more details about future exercises.\n\n\"This collaboration builds on our longstanding commitment to pioneering new approaches to third-party testing, and we're using what we learned to strengthen our safeguards and shape future collaborations with independent evaluators,\" an OpenAI spokesperson told CNBC in a statement.\n\nOpenAI CEO Sam Altman pledged to grant independent evaluators \" employee-like access \" to the company in September, after Anthropic CEO Dario Amodei proposed the idea as part of his plan to slow the pace of AI development . Anthropic has since announced agreements with organizations like Accenture , METR and SecureBio.", "source": "CNBC World Economy", "pub_date_str": "22 Oct 2026, 11:07 PM IST", "pub_date_relative": "26m ago", "cfa_topics": ["Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Q2 Results Highlights: Nuvoco Vistas Profit Jumps 81%, HPCL Swings To Profit", "full_content": "Street to track results from Swiggy, Havells, Colgate-Palmolive, Adani Total Gas, HPCL, Nippon Life AMC and J&K Bank amid a busy earnings day.", "source": "NDTV Profit", "pub_date_str": "22 Oct 2026, 11:02 PM IST", "pub_date_relative": "31m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "'Never Done Till It's Done': Jaishankar On India-US Trade Deal And Tariff Risks", "full_content": "External trade talks are progressing, but S Jaishankar says the final stages remain challenging as global tariff uncertainty, sanctions and supply-chain disruptions reshape India's economic strategy.", "source": "NDTV Profit", "pub_date_str": "22 Oct 2026, 10:59 PM IST", "pub_date_relative": "34m ago", "cfa_topics": ["Economics", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Young investors are betting on prediction markets and crypto. But this bestselling author says the boring money moves still work.", "full_content": "Beth Kobliner, author of \u201cGet a Financial Life,\u201d explains why today\u2019s young people face a tougher financial world and reveals the three money moves she would make first.", "source": "MarketWatch Top Stories", "pub_date_str": "22 Oct 2026, 10:51 PM IST", "pub_date_relative": "42m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "\u2018AI is on trial\u2019: Bond yields sink below 5% as investors look for safety", "full_content": "Investors are flooding back into Treasurys for safety to hedge the risks of more AI fallout in stock and credit markets.", "source": "MarketWatch Top Stories", "pub_date_str": "22 Oct 2026, 10:46 PM IST", "pub_date_relative": "47m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "AI's future hinges on public safety concern, cybersecurity, regulatory work in Congress - Fox News", "full_content": "AI's future hinges on public safety concern, cybersecurity, regulatory work in Congress Fox News Anthropic quietly pitches its own AI safety bill to lawmakers Politico Rogue AI Must Threaten 50 Lives Before Being Shut Down, Anthropic Suggests Novara Media Dario Amodei spent 2,000 words laying out to a critic on X why Anthropic must persist in the AI \u2018race to the top\u2019 Business Insider Anthropic pitches AI safety bill that may block a model if 50+ people could be killed TechCrunch", "source": "Google News Business", "pub_date_str": "22 Oct 2026, 10:43 PM IST", "pub_date_relative": "50m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Apple stock rises 28% in 2026 as AI stocks wobble: Why investors are betting on the iPhone maker", "full_content": "Apple Inc. has emerged as one of the most reliable trades in the stock market as sentiment towards artificial intelligence (AI) swings wildly. While AI stocks face volatility amid concerns over rising infrastructure spending, the iPhone maker\u2019s shares have continued to climb, making it a preferred choice for investors seeking exposure to Big Tech without taking on the same level of risk.\n\nAccording to a Bloomberg report, Apple\u2019s stock has risen 28% in 2026, making it the biggest contributor to the S&P 500 Index\u2019s 12% climb. It is also the best performer among the Magnificent Seven technology giants this year, marking a sharp reversal from 2025, when its 8% gain placed it near the bottom of the group.\n\nThe report said that the divergence is largely driven by Apple\u2019s strategy of avoiding the massive AI infrastructure spending undertaken by its mega-cap technology peers. While companies such as Microsoft, Amazon, Alphabet and Meta Platforms are investing heavily in AI infrastructure, Apple is focusing on its core strength of developing consumer products that generate excitement, including its new foldable iPhone Duo.\n\nWith Wall Street\u2019s view of AI capital expenditure constantly shifting, Apple\u2019s shares have become a way for investors to maintain exposure to Big Tech while avoiding some of the volatility affecting the broader AI trade.\n\nAccording to the Bloomberg report, the divergence has become more pronounced as investors reassess whether the hundreds of billions of dollars being invested in AI infrastructure will generate sufficient returns. Concerns over debt at cloud computing provider CoreWeave recently triggered widespread selling in AI stocks.\n\nThe semiconductor index, known as the SOX, fell more than 11% last week, marking its worst weekly performance since April 2025, while an index tracking the Magnificent Seven declined 3.1%.", "source": "LiveMint Markets", "pub_date_str": "22 Oct 2026, 10:38 PM IST", "pub_date_relative": "55m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Alternative Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Pershing's Ackman sees a $1 trillion Israeli company within a decade", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Pershing's Ackman sees a $1 trillion Israeli company within a decade Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Pershing's Ackman sees a $1 trillion Israeli company within a decade SECTIONS Pershing's Ackman sees a $1 trillion Israeli company within a decade Reuters Last Updated: Oct 22, 2026, 10:26:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Billionaire investor Bill Ackman said he remained bullish on Israel\u2019s economy and financial markets, predicting the country could produce a $1 trillion company within a decade. He highlighted Israel\u2019s technology ecosystem, AI potential and growing ambitions to build global companies, while saying the country\u2019s small population could become an advantage.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "22 Oct 2026, 10:26 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "IndiGo Q2 Results: Date, Time, Dividend News, Earnings Call Schedule And More", "full_content": "InterGlobe Aviation\u2019s board will review September-quarter earnings on October 29; the company has yet to disclose the results announcement time or dividend plans.", "source": "NDTV Profit", "pub_date_str": "22 Oct 2026, 10:26 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Musk's clash with Ukraine accelerates demand for Starlink alternatives. Few exist", "full_content": "Elon Musk 's latest clash with Ukraine underscores the critical role that his company's Starlink satellite internet service has played in Kyiv's defense against Russia, which invaded unprovoked in 2022.\n\nIt's also laid bare the downsides of depending on a single provider for satellite internet communications, though other options are not yet comparable to SpaceX's Starlink and its military-grade Starshield offering.\n\nOn Oct. 14, Ukrainian officials accused SpaceX of undermining the country's ability to defend itself.\n\nSpaceX and the U.S., they said, had suddenly and without warning imposed speed limits on Starshield . SpaceX describes Starshield as a \"secured satellite network for government entities\" that \"leverages Starlink technology.\"\n\nThe changes cut wireless internet connectivity in drones and other aircraft moving at speeds over 100 mph that Ukrainian forces were using in the campaign against Russia. A Ukrainian senior commander told The New York Times the Starlink restrictions cost his unit more than $1 million and delayed missions by three days.\n\nMusk and President Donald Trump , both critics of Ukrainian President Volodymyr Zelenskyy , have each shirked accountability for the communications disruptions in the war-torn nation.\n\nOn Tuesday, The Wall Street Journal reported that Musk individually ordered the service changes, and had discussed them with Trump before putting them in place. Trump insisted on Wednesday that he \"was not involved.\"\n\nRobert Weissman, who is co-president of watchdog group Public Citizen, said the situation is an \"extreme danger \" that raises antitrust and security concerns around Musk's ability to control a \"crucial means of communication.\"", "source": "CNBC World Economy", "pub_date_str": "22 Oct 2026, 10:24 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Average long-term US mortgage rate eases to 7.32% in first pullback since late August", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Average long-term US mortgage rate eases to 7.32% in first pullback since late August Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Average long-term US mortgage rate eases to 7.32% in first pullback since late August SECTIONS Average long-term US mortgage rate eases to 7.32% in first pullback since late August By AP Last Updated: Oct 22, 2026, 10:22:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis US mortgage rates eased for the first time since late August, with the average 30-year fixed rate falling to 7.32% from 7.40% last week, Freddie Mac said. The decline offers some relief to homebuyers, but borrowing costs remain elevated, with higher rates continuing to weigh on US home sales and demand.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "22 Oct 2026, 10:22 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Wall Street sinks as Nasdaq falls over 2% on AI cost worries - Reuters", "full_content": "Wall Street sinks as Nasdaq falls over 2% on AI cost worries Reuters Nasdaq tumbles 2% on AI spending concerns and jump in oil prices: Live updates CNBC Stock Market Today: Stocks Slide After Mideast Tensions Push Oil Higher \u2014 Live Updates WSJ Nasdaq leads Wall Street lower on AI spending jitters; oil prices rebound Yahoo Finance Sinking AI stocks undercut markets worldwide as oil climbs to its highest price since May AP News", "source": "Google News Business", "pub_date_str": "22 Oct 2026, 10:14 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Jobless claims near the lowest since the 1960s as low-fire trend continues", "full_content": "Employers continue to hold onto workers even as hiring remains weak, sending weekly jobless claims to around their lowest levels in records that stretch back nearly six decades.\n\nInitial filings for unemployment insurance slipped to a seasonally adjusted 194,000 for the week ended Oct. 17, the Labor Department reported Thursday.\n\nThat marked another leg lower in the low-fire trend, with the total just off the 189,000 reported for the week of July 18 that was the lowest since September 1969. Claims have averaged 212,000 over the past year, and the four-week moving average is down to 197,750.\n\nThose numbers come against an uncertain backdrop for the labor market.\n\nNonfarm payrolls rose by just 29,000 in September and have averaged a gain of just 69,000 a month in 2026. The unemployment rate rose to 4.2%, an increase largely due to a sharp spike in labor force participation. Layoffs have remained modest, declining by 61,000 in August, according to Bureau of Labor Statistics data released Sept. 29.\n\nOver the prior 12 months, the layoff rate measured as a share of the total workforce fell to 1%, down 0.2 percentage point during the period. Job openings were relatively flat during the period.\n\n\"Despite extremely pessimistic views expressed in consumer confidence surveys regarding the economy overall, countless headlines describing job cuts from a variety of businesses, and the phantom job-stealing power of AI, the claims data suggests that labor market conditions are stable,\" Thomas Simons, chief U.S. economist at Jefferies, said in a client note.\n\nThe data comes during the reference week that the BLS uses to calculate the payrolls growth number. The October jobs report will be released Nov. 6.", "source": "CNBC Top News", "pub_date_str": "22 Oct 2026, 10:10 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Critical PHP web security flaws spark global alarm as Google, OpenAI and Amazon respond", "full_content": "The tech world is racing to implement fixes after the discovery of critical security vulnerabilities in software used to power much of the internet.\n\nThe software, known as PHP, is an open-source programming language widely used to power websites and web applications. The discovery of the flaws prompted urgent warnings from governments worldwide, while tech giants including Google, OpenAI and Amazon have been involved in efforts to uncover the vulnerabilities, detect potential attacks and protect affected systems.\n\nThe two vulnerabilities, collectively known as \"PHP2Shell,\" could allow hackers to remotely execute malicious code on affected servers, potentially exposing sensitive data, according to cybersecurity researchers. While not every website using PHP is necessarily vulnerable, the software's widespread use has raised concerns about the potential scale of attacks.\n\nThe U.S. National Security Agency on Wednesday urged organizations using PHP to prepare security updates addressing the vulnerabilities, warning that the flaws could provide attackers with direct access to server file systems and databases. The agency recommended taking affected systems offline until the vulnerabilities are fully addressed if immediate updates are not possible.\n\nThe Federal Bureau of Investigation also warned that malicious actors could exploit the vulnerabilities to execute code remotely, putting sensitive data and networks at risk.\n\nCybersecurity authorities in Singapore , the United Kingdom , Australia , Canada and the European Union have issued similar alerts, underscoring concerns about the potential impact on businesses, government agencies and other organizations that rely on PHP-based systems.\n\nAmazon said its threat intelligence team had detected attempts to exploit the vulnerabilities before they were publicly disclosed, using its MadPot threat detection system, which monitors suspicious activity across internet-facing infrastructure.", "source": "CNBC World Economy", "pub_date_str": "22 Oct 2026, 09:50 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Stock Market Today: Dow Cuts Loss But Chips Hammered As Lam Tumbles 10% (Live Coverage) - Investor's Business Daily", "full_content": "Stock Market Today: Dow Cuts Loss But Chips Hammered As Lam Tumbles 10% (Live Coverage) Investor's Business Daily See more headlines & perspectives on Google News", "source": "Google News Business", "pub_date_str": "22 Oct 2026, 09:50 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements
