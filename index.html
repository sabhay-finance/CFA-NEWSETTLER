ed by floods or droughts, yet its economic consequences can be profound for farming households. Drylands cover nearly 47 per cent of the world's land surface, support more than two billion people, and account for over 40 per cent of cultivated land globally. In India, dryland covers60\u201368% of the net sown area and contributing 40\u201344% of total food-grain production, with substantial concentrations across the central, western and southern plateaus that contribute significantly to national production of millets, pulses and oilseeds. Historically constrained by water scarcity, dryland regions have increasingly diversified from low-value coarse grains towards pulses, oilseeds, horticulture and livestock. However, groundwater-led intensification has created serious sustainability risks, with water tables declining by 1\u20133 metres annually in some areas. Therefore, is not whether dryland agriculture can survive climate stress, but how it can remain productive and economically viable under conditions of persistent uncertainty.", "source": "Economic Times Economy", "pub_date_str": "10 Sep 2026, 06:46 AM IST", "pub_date_relative": "17m ago"}, {"title": "Roblox chief legal officer Mark Reinstra sells $258,620 in stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Sep 2026, 06:46 AM IST", "pub_date_relative": "17m ago"}, {"title": "Crowdstrike CEO George Kurtz sells $4.2m in company stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Sep 2026, 06:46 AM IST", "pub_date_relative": "17m ago"}, {"title": "Mpm Bioventures 2018 sells $1.9m in Entrada Therapeutics shares", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Sep 2026, 06:45 AM IST", "pub_date_relative": "18m ago"}, {"title": "Entrada therapeutics 10% owner MPM BioVentures sells $1.9M stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Sep 2026, 06:45 AM IST", "pub_date_relative": "18m ago"}, {"title": "Xe ers see sharp rise in active trading users SECTIONS India\u2019s niche brokers see sharp rise in active trading users By ET Bureau Last Updated: Sep 10, 2026, 06:02:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The landscape of Indian brokerage firms is changing as smaller platforms enjoy a boom in clientele, leaving larger firms in a state of flux. Experienced traders are gravitating toward these nimble, innovative platforms that emphasize robust trading capabilities rather than just competitive pricing. In contrast, giants such as Groww, Zerodha, and Angel One are seeing a notable decline in user growth.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "10 Sep 2026, 06:02 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Stock futures are little changed as traders brace for wholesale inflation report: Live updates", "full_content": "Stock futures traded near the flatline on Wednesday evening as traders looked ahead to the first of two inflation reports due this week.\n\nFutures tied to the Dow Jones Industrial Average advanced 54 points, or 0.1%. S&P 500 futures added 0.04%, and Nasdaq-100 futures were marginally lower.\n\nThe action comes after the major averages tumbled for a third day. The Dow lost just over 400 points, or 0.8%, while the S&P 500 fell 0.5%. The Nasdaq Composite declined 0.6%.\n\nAsia markets were in the red on Thursday. Japan's Nikkei 225 dropped 0.62%, while South Korea's Kospi lost 0.24%. Australia's benchmark S&P/ASX 200 was down 1.36%.\n\nHigher Treasury yields kept the U.S. stock market under pressure after the Treasury Department said it would buy back up to $6 billion in longer-term debt \u2013 triple the usual amount. Less than a month ago, the Treasury said it would more than double the size of its government debt repurchases.\n\nFollowing the move, the yield on the 10-year Treasury note climbed to a session high of 4.857%, its highest level since November 2023.\n\nRising oil prices amid escalating tensions between the U.S. and Iran also weighed down stocks. International Brent crude futures advanced 3.4% to close at $101.21 a barrel, while U.S. West Texas Intermediate crude futures advanced 3.3% to end at $96.05. Both saw the highest settlement prices since May.\n\nThe recent surge in oil prices comes as traders set their sights on two inflation reports due this week.", "source": "CNBC Top News", "pub_date_str": "10 Sep 2026, 06:01 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Derivatives", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Stock recommendations for 10 September from MarketSmith India", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nStock market recap: Indian equities extended their losing streak to a third straight session on Wednesday as Brent crude touched $100 per barrel for the first time since late July, deepening worries over inflation and import costs.\n\nNifty 50 fell 203.60 points, or 0.86%, to close at 23,431.50, while Sensex dropped 813.35 points, or 1.08%, to settle at 74,764.23. IT was the standout laggard, declining for a sixth consecutive session, as Coforge, Infosys, and TCS fell sharply amid continued Fed rate-hike concerns.\n\nNifty IT declined more than 3%. Banking , FMCG, and Auto also ended lower, while heavy primary market activity added to selling pressure as several IPOs opened during the week. Metals bucked the trend to close firmly higher, offering some support. The rupee weakened further against the dollar, and continued foreign institutional selling weighed on sentiment. Market breadth remained weak, with 1,484 stocks advancing, 2,092 stocks declining, and 100 remaining unchanged. With crude prices near multi-month highs and global rate expectations still in flux, near-term volatility is likely to persist.\n\nOn 9 September, Indian equities ended lower, extending their recent weakness amid elevated crude oil prices, geopolitical concerns in the Middle East, and sustained pressure on technology stocks. Nifty 50 closed at 23,431.50, down 203.60 points or 0.86%, finishing at the day\u2019s low after trading between 23,431.50 and 23,571.55, indicating selling pressure into the close. Sensex also remained under pressure throughout the session. Market breadth was distinctly negative, with 1,484 stocks advancing, 2,092 stocks declining, and 100 remaining unchanged, translating into an advance-decline ratio of roughly 0.71:1. On the sectoral front, Nifty IT was the biggest drag, falling 3.24%, followed by Realty (-2.23%) and Financial Services (-1.23%).", "source": "LiveMint Markets", "pub_date_str": "10 Sep 2026, 06:00 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "NSE vs BSE: Which stock is better for investors?", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nBSE Ltd is a listed compan y whose shares trade on National Stock Exchange of India Ltd (NSE). And when NSE lists, its shares will trade on BSE.\n\nThis is because the Securities and Exchange Board of India (Sebi) does not permit an exchange to list on its own platform, for the obvious reason that no company should regulate the trading of its own stock.\n\nSo each exchange\u2019s shares are priced, every single day, on the platform run by its rival.\n\nBSE was listed on NSE in February 2017 at \u20b9 1,085 against an issue price of \u20b9 806. In due course, NSE will return the favour.\n\nBut which is ultimately better? Should you apply for the initial public offering (IPO) when it launches, or are you better off buying the already-listed company?\n\nIf you bought shares this week through an app, you almost certainly did not decide which exchange the order went to. Your broker did, through smart order routing, and it picked whichever venue offered the better price.\n\nEven if you did choose, the difference would be tiny for anything liquid. The same share listed on both exchanges is arbitraged continuously by traders whose entire business is closing gaps of a few paise. By the time a retail order arrives, the prices are effectively the same.", "source": "LiveMint Markets", "pub_date_str": "10 Sep 2026, 06:00 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Stocks in news: Reliance Industries, Wipro, ICICI Bank, Coal India and Hindustan Zinc", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Stocks 0.32 an ounce at 7:22 a.m. in Singapore. Silver was little changed at $67.29 an ounce, after adding 2.4% in the previous session. Platinum and palladium edged higher. The Bloomberg Dollar Spot Index, a gauge of the US dollar, fell 0.1%.\n\nCatch all the Business News , Market News , Breaking News Events and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.\n\nLog in to our website to save your bookmarks.", "source": "LiveMint Markets", "pub_date_str": "10 Sep 2026, 05:55 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Fixed Income", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Sebi proposes easing eligibility norms for MII directors", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Sebi proposes easing eligibility norms for MII directors The Economic Times daily newspaper is available online now. Read Today's Paper Sebi proposes easing eligibility norms for MII directors SECTIONS Sebi proposes easing eligibility norms for MII directors By ET Bureau Last Updated: Sep 10, 2026, 05:57:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Securities and Exchange Board of India (Sebi) said the current rules have made it difficult for MIIs to find suitable candidates, particularly for public interest direc\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
