    const allData = {"general": [{"title": "Horizon Kinetics Asset Management, RENN Fund 10% owner, buys $2,305", "full_content": "", "source": "Investing.com News", "pub_date_str": "27 Sep 2026, 12:45 PM IST", "pub_date_relative": "22m ago"}, {"title": "OpenAI, Anthropic CEOs called to appear at Australian AI probe", "full_content": "The CEOs of OpenAI and Anthropic have been called to appear at an Australian Senate inquiry on AI, the head of the probe said on Sunday, days after the revelation that a rogue OpenAI bot had hacked the country's health-system database.\n\nThe Medicare breach, condemned by Prime Minister Anthony Albanese, is one of the highest-profile incidents of AI agents accessing external systems outside the U.S.\n\nOpenAI's Sam Altman and Anthropic's Dario Amodei have been sent written requests to appear at the inquiry, which is to hold public hearings in the capital Canberra on Thursday, said a spokesperson for Senator Sarah Hanson-Young of the Australian Greens party, who chairs the probe.\n\nOpenAI and Anthropic did not immediately respond to requests for comment outside business hours.\n\nThe OpenAI agent's incursion on one of the country's most used government agencies may prompt Albanese's Labor government to toughen AI-specific laws it is readying for next year, adding pressure to Australia-US relations already tested by Canberra's ban on social media for teens, tech policy experts say.\n\nThe Senate inquiry is examining the potential impacts of AI and data centers on Australian communities, industries, water and energy. It is one of several state and federal probes into AI.\n\n\"There are serious questions for Sam Altman to answer about the OpenAI hack of Australian government websites,\" Hanson-Young said in a statement. Altman and Amodei \"must front up, face the Senate's questions and have an honest conversation about what effective, lasting regulation of this industry should look like\", she said.\n\nAlbanese, who revealed the June breach of Medicare on Thursday, called it \"unacceptable\", saying he had voiced \"extreme concern\" to Altman.", "source": "CNBC Top News", "pub_date_str": "27 Sep 2026, 12:43 PM IST", "pub_date_relative": "25m ago"}, {"title": "ETMarkets Smart Talk| How to find India\u2019s next multibaggers? Pritam Deuskar explains his GIANTS framework", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Expert Views \u203a ETMarkets Smart Talk| How to find India\u2019s next multibaggers? Pritam Deuskar explains his GIANTS framework The Economic Times daily newspaper is available online now. Read Today's Paper ETMarkets Smart Talk| How to find India\u2019s next multibaggers? Pritam Deuskar explains his GIANTS framework SECTIONS ETMarkets Smart Talk| How to find India\u2019s next multibaggers? Pritam Deuskar explains his GIANTS framework By Kshitij Anand , ETMarkets.com Last Updated: Sep 27, 2026, 12:37:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis To achieve successful long-term investments, investors should target companies with a competitive edge. Pritam Deuskar introduces the GIANTS framework, emphasizing the importance of evaluating market position and awareness of emerging trends in India. Despite external challenges, India's economy stands robust and adaptable. By concentrating on companies that fulfill these standards, investors can maximize their returns in the dynamic marketplace.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "27 Sep 2026, 12:37 PM IST", "pub_date_relative": "31m ago"}, {"title": "Nwpx infrastructure CFO Aaron Wilkins sells $2,038 in company stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "27 Sep 2026, 12:31 PM IST", "pub_date_relative": "36m ago"}, {"title": "Nwpx director Keith Larson sells $102,310 in company stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "27 Sep 2026, 12:31 PM IST", "pub_date_relative": "37m ago"}, {"title": "9 midcap stocks with over 50% YoY sales growth", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News 9 midcap stocks with over 50% YoY sales growth Written by Ritesh Presswala , ETMarkets.com | Sep 27, 2026, 12:34:09 PM IST 1 / 10 Stock Watch A significant rise in quarterly sales on a year-over-year (YoY) basis indicates growth in a company\u2019s revenue during the period. Among the NSE Midcap segment, excluding banking and financial stocks, nine companies recorded sales growth of more than 50% in the June 2026 quarter compared with the same period in 2025, according to turnover scan data from StockEdge.com.\n\nJune 2026 quarter sales rose 209% YoY to Rs 7,354 crore, compared with Rs 2,384 crore in the same quarter last year.\n\nJune 2026 quarter sales increased 131% YoY to Rs 572 crore, from Rs 248 crore in June 2025.\n\nJune 2026 quarter sales grew 111% YoY to Rs 3,820 crore, compared with Rs 1,813 crore a year earlier.\n\nJune 2026 quarter sales climbed 81% YoY to Rs 937 crore, up from Rs 516 crore in June 2025.\n\nJune 2026 quarter sales increased 79% YoY to Rs 7,932 crore, compared with Rs 4,426 crore in June 2025.\n\nJune 2026 quarter sales rose 78% YoY to Rs 2,684 crore, from Rs 1,507 crore in the year-ago quarter.\n\nJune 2026 quarter sales grew 69% YoY to Rs 3,125 crore, compared with Rs 1,852 crore in June 2025.", "source": "Economic Times Markets", "pub_date_str": "27 Sep 2026, 12:29 PM IST", "pub_date_relative": "38m ago"}, {"title": "26% returns in 6 months, SAIL stock final dividend 2026 record date next week; check amount per share, payment date", "full_content": "SAIL dividend 2026 : Maharatna PSU Steel Authority of India (SAIL) is set to turn ex-dividend next week, with Wednesday, 30 September 2026 fixed as the record date for its final dividend.\n\nThe company had announced a final dividend of \u20b9 2.35 per share, with a face value of \u20b9 10 at its Annual General Meeting in in May 2026.\n\nDuring its 54th Annual General Meeting (AGM) meeting, SAIL informed the exchanges, \"In continuation of the intimation mentioned above and Pursuant to Regulation 42 of SEBI (Listing Obligations and Disclosure Requirements) Regulations, 2015, it is hereby informed that the record date for determining the eligibility of the shareholders to receive the Final Dividend for the Financial Year 2025-26 has been fixed as Wednesday, 30\"' September, 2026. The Final dividend for FY 2025-26 as recommended by the Board, if approved by the Shareholders in the ensuing Annual General Meeting (AGM) shall be paid (subject to TDS) within 30 days from the date of approval by the shareholders.\"\n\nThe Board of Directors, at its meeting held on 15 May 2026, recommended a final dividend of \u20b9 2.35 per equity share of \u20b9 10 each for the financial year 2025\u201326. The dividend represents 23.50% of the company\u2019s paid-up equity share capital.\n\nSAIL final dividend offers an estimated dividend yield of 1.27%, calculated using its final dividend of \u20b9 2.35 per share and the prevailing market price of \u20b9 184.85.\n\nSAIL is set to mark the sixth consecutive year of dividend payouts to its shareholders. In 2025, the company declared a final dividend of \u20b9 1.60 per share, with 9 September 2025 fixed as the record date. In 2024, SAIL\u2019s shares traded ex-dividend on 19 September to determine the shareholders eligible for the Re 1 final dividend. The final payout followed an interim dividend of Re 1 per share, for which the stock had traded ex-dividend on 20 February 2024.\n\nThe Maharatna PSU declared dividends on two occasions in 2023.", "source": "LiveMint Markets", "pub_date_str": "27 Sep 2026, 12:19 PM IST", "pub_date_relative": "48m ago"}, {"title": "Horizon Kinetics Asset Management buys $361 of Texas Pacific Land stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "27 Sep 2026, 12:16 PM IST", "pub_date_relative": "52m ago"}, {"title": "EPF withdrawal rules: What happens if you withdraw full amount due to unemployment and later get a new job", "full_content": "Losing a job and being unable to find another one, or staying out of the workforce due to other issues for a long period can put pressure on your savings, including the money accumulated in your Employees\u2019 Provident Fund (EPF) account.\n\nFor members facing an extended spell of unemployment, withdrawing the accumulated PF balance can seem like an option to manage expenses. Salaried individuals are allowed to make partial withdrawals, known as EPF advances, for certain purposes, with eligibility conditions.\n\nAfter leaving employment, an individual can apply to the Employees' Provident Fund Organisation (EPFO) for withdrawing their PF balance.\n\nUnder the EPF Scheme, 2026 , members can withdraw up to 75% of their PF balance immediately after losing a job. The remaining 25% stays locked in until the member completes 12 months of continuous unemployment. Only then does full withdrawal open up, which includes the employee share, employer share and accumulated interest.\n\nEarlier, full withdrawal was allowed after two months of unemployment. But that changed with the introduction of the new scheme in July this year.\n\nHowever, the 12-month waiting period will not apply to female members who have resigned from their job for getting married.\n\nIf an individual finds a job after making a full withdrawal under the prescribed conditions, the person will have to qualify again for membership of the fund, and they will be treated as a fresh member, according to information available on the official website of the retirement fund body.\n\nIn simple terms, getting employed again does not reverse the earlier EPF withdrawal. Instead, the new employer will generally create or link EPF contributions to the member\u2019s existing UAN , allowing fresh contributions to accumulate under the new employment.", "source": "LiveMint Money", "pub_date_str": "27 Sep 2026, 12:12 PM IST", "pub_date_relative": "55m ago"}, {"title": "How AI shopping agents could reshape hardline, broadline and food retail - UBS", "full_content": "", "source": "Investing.com News", "pub_date_str": "27 Sep 2026, 12:10 PM IST", "pub_date_relative": "58m ago"}, {"title": "East German espionage raised GDP by 7.4% in late 1980s, study finds", "full_content": "", "source": "Investing.com News", "pub_date_str": "27 Sep 2026, 12:06 PM IST", "pub_date_relative": "1h ago"}, {"title": "Will your insurance premium get cheaper? Here\u2019s what IRDAI\u2019s proposed reforms could change", "full_content": "Insurance premiums could come under pressure if the Insurance Regulatory and Development Authority of India\u2019s (IRDAI) proposed reforms reduce distribution and operating costs, but the regulator has not said that premiums will automatically become cheaper. The consultation paper proposes changes to insurers\u2019 Expenses of Management (EoM), commission structures, sales incentives and disclosures, with the broader objective of reducing structural costs and improving value for policyholders.\n\nThe impact on premiums will depend on how insurers respond to lower costs. An industry expert, who did not wish to be named, said it would be too early to conclude that premiums will necessarily become cheaper. For term plans, mortality is a much larger pricing driver than distribution costs, while pricing is also periodically recalibrated based on experience and other underlying factors.\n\nAmit Goel, Director, Equirus Raghnall Insurance Broking, said the proposed reforms could potentially put downward pressure on premiums if lower distribution costs are passed on by insurers. However, he said insurance premiums are also driven by claims experience, reinsurance costs, risk appetite, capital costs and competition. \u201cA reduction in commission does not mechanically mean a reduction in premium,\u201d he said.\n\nIRDAI has proposed lowering Expenses of Management limits through a phased glide path. For life insurers, the proposal is to move towards a 12.5% of gross direct premium income (GDPI) company-level EoM cap. For general insurers, the proposal is to move from 30% of gross written premium to 20% of GDPI over five years. The regulator has also proposed changes to the way EoM is calculated to prevent workarounds.\n\nFor consumers, the proposal matters because IRDAI says reducing the cost of doing business should improve value for policyholders.", "source": "LiveMint Money", "pub_date_str": "27 Sep 2026, 12:04 PM IST", "pub_date_relative": "1h ago"}, {"title": "Will Nifty, Sensex tumble on Monday? 5 factors which will drive D-Street action this week", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Will Nifty, Sensex tumble on Monday? 5 factors which will drive D-Street action this week LKP Securities Share Price AK Capita boot Sees Sharp 92.3% Rise", "full_content": "The horror reboot 'Resident Evil' saw a 92.3% jump on Day 9, earning Rs 96.95 lakh and taking its total India gross to Rs 20.59 crore.", "source": "NDTV Profit", "pub_date_str": "27 Sep 2026, 11:50 AM IST", "pub_date_relative": "1h ago"}, {"title": "World Tourism Day 2026 Special: How much should you budget for your next international holiday?", "full_content": "An international trip or holiday can quickly become expensive if an individual\u2019s budget allocates funds only to flights and hotels, without paying close attention to the trip as a whole and its other associated costs. A better and more prudent approach to planning an international trip is to estimate the total cost in advance. A broad and diversified approach is key here.\n\nThis is because the expenses for such trips include several other core aspects, such as visas, insurance, food, local transport, sightseeing, shopping, and an emergency buffer to cover unforeseen expenses. Such an approach helps keep unexpected costs and budget overruns in check.\n\nAs an illustration, a budget of \u20b9 3 lakh per person in September 2026 could provide considerable flexibility for a one-week international holiday, although the actual cost can vary significantly depending on the destination and travel style. Recent estimates for popular destinations show how widely these costs can differ.\n\nFor example, Zurich Kotak's September 2026 estimate puts a six-day mid-range Thailand trip at around \u20b9 70,000\u2013 \u20b9 1.15 lakh per person, including flights, accommodation, food, transport and insurance.\n\nNow, the Thailand estimate shows why destination and travel style can make a significant difference to the overall cost of an international holiday. However, travellers can also use a broad budget framework to plan their spending before choosing a destination. For illustration, here is how a \u20b9 3 lakh per-person budget could be divided across the major expenses of a one-week international holiday.\n\nNote: These are illustrative planning figures for an individual, not destination-specific prices.", "source": "LiveMint Money", "pub_date_str": "27 Sep 2026, 11:50 AM IST", "pub_date_relative": "1h ago"}, {"title": "Globe Life EVP & CIO Robert Hensley sells over $1.7m in stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "27 Sep 2026, 11:46 AM IST", "pub_date_relative": "1h ago"}, {"title": "Rtb digital (RTB) director Jason Dorsett buys $91,520 in shares", "full_content": "", "source": "Investing.com News", "pub_date_str": "27 Sep 2026, 11:46 AM IST", "pub_date_relative": "1h ago"}, {"title": "Gas Vs Green: Who Wins Under Trump\u2019s Relaxed Fuel Rules That Ends Biden's EV Mandate?", "full_content": "The Trump administration approved lower vehicle fuel-economy standards, aiming to reduce new-car costs. However, US officials estimate the changes could increase fuel consumption, spending and carbon dioxide emissions through 2050.", "source": "NDTV Profit", "pub_date_str": "27 Sep 2026, 11:44 AM IST", "pub_date_relative": "1h ago"}, {"title": "U.S. understands Taiwan\u2019s defence needs amid China threat, official says", "full_content": "", "source": "Investing.com News", "pub_date_str": "27 Sep 2026, 11:30 AM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "OpenAI, Anthropic CEOs called to appear at Australian AI probe", "full_content": "The CEOs of OpenAI and Anthropic have been called to appear at an Australian Senate inquiry on AI, the head of the probe said on Sunday, days after the revelation that a rogue OpenAI bot had hacked the country's health-system database.\n\nThe Medicare breach, condemned by Prime Minister Anthony Albanese, is one of the highest-profile incidents of AI agents accessing external systems outside the U.S.\n\nOpenAI's Sam Altman and Anthropic's Dario Amodei have been sent written requests to appear at the inquiry, which is to hold public hearings in the capital Canberra on Thursday, said a spokesperson for Senator Sarah Hanson-Young of the Australian Greens party, who chairs the probe.\n\nOpenAI and Anthropic did not immediately respond to requests for comment outside business hours.\n\nThe OpenAI agent's incursion on one of the country's most used government agencies may prompt Albanese's Labor government to toughen AI-specific laws it is readying for next year, adding pressure to Australia-US relations already tested by Canberra's ban on social media for teens, tech policy experts say.\n\nThe Senate inquiry is examining the potential impacts of AI and data centers on Australian communities, industries, water and energy. It is one of several state and federal probes into AI.\n\n\"There are serious questions for Sam Altman to answer about the OpenAI hack of Australian government websites,\" Hanson-Young said in a statement. Altman and Amodei \"must front up, face the Senate's questions and have an honest conversation about what effective, lasting regulation of this industry should look like\", she said.\n\nAlbanese, who revealed the June breach of Medicare on Thursday, called it \"unacceptable\", saying he had voiced \"extreme concern\" to Altman.", "source": "CNBC Top News", "pub_date_str": "27 Sep 2026, 12:43 PM IST", "pub_date_relative": "25m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "ETMarkets Smart Talk| How to find India\u2019s next multibaggers? Pritam Deuskar explains his GIANTS framework", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Expert Views \u203a ETMarkets Smart Talk| How to find India\u2019s next multibaggers? Pritam Deuskar explains his GIANTS framework The Economic Times daily newspaper is available online now. Read Today's Paper ETMarkets Smart Talk| How to find India\u2019s next multibaggers? Pritam Deuskar explains his GIANTS framework SECTIONS ETMarkets Smart Talk| How to find India\u2019s next multibaggers? Pritam Deuskar explains his GIANTS framework By Kshitij Anand , ETMarkets.com Last Updated: Sep 27, 2026, 12:37:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis To achieve successful long-term investments, investors should target companies with a competitive edge. Pritam Deuskar introduces the GIANTS framework, emphasizing the importance of evaluating market position and awareness of emerging trends in India. Despite external challenges, India's economy stands robust and adaptable. By concentrating on companies that fulfill these standards, investors can maximize their returns in the dynamic marketplace.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "27 Sep 2026, 12:37 PM IST", "pub_date_relative": "31m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Nwpx infrastructure CFO Aaron Wilkins sells $2,038 in company stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "27 Sep 2026, 12:31 PM IST", "pub_date_relative": "36m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "9 midcap stocks with over 50% YoY sales growth", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News 9 midcap stocks with over 50% YoY sales growth Written by Ritesh Presswala , ETMarkets.com | Sep 27, 2026, 12:34:09 PM IST 1 / 10 Stock Watch A significant rise in quarterly sales on a year-over-year (YoY) basis indicates growth in a company\u2019s revenue during the period. Among the NSE Midcap segment, excluding banking and financial stocks, nine companies recorded sales growth of more than 50% in the June 2026 quarter compared with the same period in 2025, according to turnover scan data from StockEdge.com.\n\nJune 2026 quarter sales rose 209% YoY to Rs 7,354 crore, compared with Rs 2,384 crore in the same quarter last year.\n\nJune 2026 quarter sales increased 131% YoY to Rs 572 crore, from Rs 248 crore in June 2025.\n\nJune 2026 quarter sales grew 111% YoY to Rs 3,820 crore, compared with Rs 1,813 crore a year earlier.\n\nJune 2026 quarter sales climbed 81% YoY to Rs 937 crore, up from Rs 516 crore in June 2025.\n\nJune 2026 quarter sales increased 79% YoY to Rs 7,932 crore, compared with Rs 4,426 crore in June 2025.\n\nJune 2026 quarter sales rose 78% YoY to Rs 2,684 crore, from Rs 1,507 crore in the year-ago quarter.\n\nJune 2026 quarter sales grew 69% YoY to Rs 3,125 crore, compared with Rs 1,852 crore in June 2025.", "source": "Economic Times Markets", "pub_date_str": "27 Sep 2026, 12:29 PM IST", "pub_date_relative": "38m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "26% returns in 6 months, SAIL stock final dividend 2026 record date next week; check amount per share, payment date", "full_content": "SAIL dividend 2026 : Maharatna PSU Steel Authority of India (SAIL) is set to turn ex-dividend next week, with Wednesday, 30 September 2026 fixed as the record date for its final dividend.\n\nThe company had announced a final dividend of \u20b9 2.35 per share, with a face value of \u20b9 10 at its Annual General Meeting in in May 2026.\n\nDuring its 54th Annual General Meeting (AGM) meeting, SAIL informed the exchanges, \"In continuation of the intimation mentioned above and Pursuant to Regulation 42 of SEBI (Listing Obligations and Disclosure Requirements) Regulations, 2015, it is hereby informed that the record date for determining the eligibility of the shareholders to receive the Final Dividend for the Financial Year 2025-26 has been fixed as Wednesday, 30\"' September, 2026. The Final dividend for FY 2025-26 as recommended by the Board, if approved by the Shareholders in the ensuing Annual General Meeting (AGM) shall be paid (subject to TDS) within 30 days from the date of approval by the shareholders.\"\n\nThe Board of Directors, at its meeting held on 15 May 2026, recommended a final dividend of \u20b9 2.35 per equity share of \u20b9 10 each for the financial year 2025\u201326. The dividend represents 23.50% of the company\u2019s paid-up equity share capital.\n\nSAIL final dividend offers an estimated dividend yield of 1.27%, calculated using its final dividend of \u20b9 2.35 per share and the prevailing market price of \u20b9 184.85.\n\nSAIL is set to mark the sixth consecutive year of dividend payouts to its shareholders. In 2025, the company declared a final dividend of \u20b9 1.60 per share, with 9 September 2025 fixed as the record date. In 2024, SAIL\u2019s shares traded ex-dividend on 19 September to determine the shareholders eligible for the Re 1 final dividend. The final payout followed an interim dividend of Re 1 per share, for which the stock had traded ex-dividend on 20 February 2024.\n\nThe Maharatna PSU declared dividends on two occasions in 2023.", "source": "LiveMint Markets", "pub_date_str": "27 Sep 2026, 12:19 PM IST", "pub_date_relative": "48m ago", "cfa_topics": ["Corporate Issuers", "Fixed Income", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "EPF withdrawal rules: What happens if you withdraw full amount due to unemployment and later get a new job", "full_content": "Losing a job and being unable to find another one, or staying out of the workforce due to other issues for a long period can put pressure on your savings, including the money accumulated in your Employees\u2019 Provident Fund (EPF) account.\n\nFor members facing an extended spell of unemployment, withdrawing the accumulated PF balance can seem like an option to manage expenses. Salaried individuals are allowed to make partial withdrawals, known as EPF advances, for certain purposes, with eligibility conditions.\n\nAfter leaving employment, an individual can apply to the Employees' Provident Fund Organisation (EPFO) for withdrawing their PF balance.\n\nUnder the EPF Scheme, 2026 , members can withdraw up to 75% of their PF balance immediately after losing a job. The remaining 25% stays locked in until the member completes 12 months of continuous unemployment. Only then does full withdrawal open up, which includes the employee share, employer share and accumulated interest.\n\nEarlier, full withdrawal was allowed after two months of unemployment. But that changed with the introduction of the new scheme in July this year.\n\nHowever, the 12-month waiting period will not apply to female members who have resigned from their job for getting married.\n\nIf an individual finds a job after making a full withdrawal under the prescribed conditions, the person will have to qualify again for membership of the fund, and they will be treated as a fresh member, according to information available on the official website of the retirement fund body.\n\nIn simple terms, getting employed again does not reverse the earlier EPF withdrawal. Instead, the new employer will generally create or link EPF contributions to the member\u2019s existing UAN , allowing fresh contributions to accumulate under the new employment.", "source": "LiveMint Money", "pub_date_str": "27 Sep 2026, 12:12 PM IST", "pub_date_relative": "55m ago", "cfa_topics": ["Economics", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "East German espionage raised GDP by 7.4% in late 1980s, study finds", "full_content": "", "source": "Investing.com News", "pub_date_str": "27 Sep 2026, 12:06 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Will your insurance premium get cheaper? Here\u2019s what IRDAI\u2019s proposed reforms could change", "full_content": "Insurance premiums could come under pressure if the Insurance Regulatory and Development Authority of India\u2019s (IRDAI) proposed reforms reduce distribution and operating costs, but the regulator has not said that premiums will automatically become cheaper. The consultation paper proposes changes to insurers\u2019 Expenses of Management (EoM), commission structures, sales incentives and disclosures, with the broader objective of reducing structural costs and improving value for policyholders.\n\nThe impact on premiums will depend on how insurers respond to lower costs. An industry expert, who did not wish to be named, said it would be too early to conclude that premiums will necessarily become cheaper. For term plans, mortality is a much larger pricing driver than distribution costs, while pricing is also periodically recalibrated based on experience and other underlying factors.\n\nAmit Goel, Director, Equirus Raghnall Insurance Broking, said the proposed reforms could potentially put downward pressure on premiums if lower distribution costs are passed on by insurers. However, he said insurance premiums are also driven by claims experience, reinsurance costs, risk appetite, capital costs and competition. \u201cA reduction in commission does not mechanically mean a reduction in premium,\u201d he said.\n\nIRDAI has proposed lowering Expenses of Management limits through a phased glide path. For life insurers, the proposal is to move towards a 12.5% of gross direct premium income (GDPI) company-level EoM cap. For general insurers, the proposal is to move from 30% of gross written premium to 20% of GDPI over five years. The regulator has also proposed changes to the way EoM is calculated to prevent workarounds.\n\nFor consumers, the proposal matters because IRDAI says reducing the cost of doing business should improve value for policyholders.", "source": "LiveMint Money", "pub_date_str": "27 Sep 2026, 12:04 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Will Nifty, Sensex tumble on Monday? 5 factors which will drive D-Street action this week", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Will Nifty, Sensex tumble on Monday? 5 factors which will drive D-Street action this week LKP Securities Share Price AK Capital Services Share Price Master Trust Share Price Prime Securities Share Price Dolat Algotech Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Will Nifty, Sensex tumble on Monday? 5 factors which will drive D-Street a ets gives \u2018Hold\u2019 to this realty stock | Check target, stop loss, rationale", "full_content": "Brokerage firm BoB Capital Markets has initiated coverage on on realty stock Knowledge Realty Trust (KRT), recommending \u2018hold'. The brokerage firm has given a target price of \u20b9 122 per share, seeing an upside potential up to 7%.\n\nAccording to the brokerage firm, the realty stock is to trade at a slightly lower-than-peer DPU multiple of 16.4x, compared with the peer average of 16.6x, reflecting its slower pace of DPU growth.\n\nThe firm highlighted that KRT has the lowest loan-to-value (LTV) ratio among its peers, at 18% as of Q1FY27, compared with the peer average of around 26.2%. It also has the lowest weighted average cost of debt at approximately 7.23%, marginally below the peer average of 7.3%. This lower leverage reduces KRT\u2019s exposure to refinancing risks.\n\nKRT is well positioned to generate organic growth through improved asset utilisation, supported by the location and quality of its properties. However, as of Q1FY27, the REIT had around 2.6 million sq ft (msf) of leasable area under construction and access to a right of first offer (ROFO) pipeline of approximately 6.7 msf. These figures remain below peer averages of around 4.0 msf of assets under construction and 8.35 msf of ROFO pipeline, respectively, it added.\n\nAs of Q1FY27, the listed office REITs\u2014Embassy, Mindspace, Brookfield India REIT, Knowledge Realty Trust (KRT) and Brookfield-backed Bagmane\u2014collectively managed an average leasable area of around 33 million sq ft. Their portfolios had an average committed occupancy of nearly 93%, while average in-place rentals stood at about \u20b9 98.2 per sq ft per month.\n\n\u201cIn-line with the demand for office spaces, the REITs exhibit regional dominance with EMBASSY being the largest REIT (leasable area) in BLR, BIRET in NCR, MINDSPCE in HYD and MUMBAI.", "source": "LiveMint Markets", "pub_date_str": "27 Sep 2026, 11:22 AM     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
