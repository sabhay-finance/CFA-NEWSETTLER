<script>
    // This variable will be injected during the build process
    const allData = {"general": [{"title": "FDI rises 6% to USD 19.81 billion in April-June", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Finance \u203a FDI rises 6% to USD 19.81 billion in April-June The Economic Times daily newspaper is available online now. Read Today's Paper FDI rises 6% to USD 19.81 billion in April-June SECTIONS FDI rises 6% to USD 19.81 billion in April-June PTI Last Updated: Sep 25, 2026, 07:06:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis In the first quarter of this fiscal, India received the maximum investments from countries like Singapore, Mauritius and the US.\n\nBuilding recycling plants is fine. Will they get enough scrap?\n\nBiogas found its ethanol moment this month. Can it now find scale?\n\nHas the US Fed and AI created a costlier world? And has the queue got longer for India?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "25 Sep 2026, 07:06 PM IST", "pub_date_relative": "just now"}, {"title": "Stocks tick higher, but Dow heads for fourth straight losing week: Live updates", "full_content": "U.S. equities rose slightly on Friday as Wall Street gets set to wrap up a volatile week of trading, with a surge in Treasury yields rippling through financial markets.\n\nThe S&P 500 was up 0.2%, as was the Nasdaq Composite . The Dow Jones Industrial Average gained 117 points, or 0.2%.\n\nShares of Akamai Technologies led technology higher, jumping more than 14% after announcing a multi-year deal with Anthropic . Other tech stocks such as Fastly and Cloudflare also saw gains.\n\nAlso helping sentiment, oil prices slid amid optimism that the Strait of Hormuz could be reopened, as Iran's Foreign Minister Abbas Araghchi has proposed to do so as well as restart nuclear talks with the U.S. within seven days if Washington accepts its conditions.\n\nOn Thursday, Reuters reported that the U.S. and Iranian negotiators in New York are considering a phased agreement to end the Middle East conflict.\n\nU.S. West Texas Intermediate crude futures dropped 2% to around $92 per barrel, while international benchmark Brent crude futures declined 1% to around $104 a barrel.\n\nThe Dow is heading for a fourth consecutive losing week, down 0.6% through Thursday's close. The S&P 500 is on track for a 0.7% advance, while the Nasdaq is up 1.6% week to date.\n\nThe drama continued in the bond market, where the 10-year Treasury yield climbed to its highest level since 2007 on Thursday, while the 30-year yield reached its highest level since 2004. The two were last seen up slightly at 5.183% and 5.478%, respectively.", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 07:04 PM IST", "pub_date_relative": "1m ago"}, {"title": "CEO who posted 'Lake America' sweatshirt photos is no longer with the company", "full_content": "The CEO of U.S.-based credit union Family First is no longer with the company, days after she posted an allegedly artificial intelligence-edited photo of her family with \"Lake America\" sweatshirts.\n\nOn Wednesday, a statement posted on the credit union's website revealed that Jane Smith was no longer with Family First \"effective immediately,\" with Chief Operations Officer Jason Acosta serving as interim CEO. It was signed by Maurice Patterson, chairman of the Family First Credit Union board, and Acosta.\n\nFamily First did not state that if the reaction was the reason for Smith leaving, even though the credit union posted on Thursday that \"we sincerely apologize for the concern, disappointment and pain this situation has caused our members and community.\"\n\nFamily First is based in Michigan, a state that borders Canada.\n\nSmith on Sept. 11 had posted the photo on Facebook with the caption: \"Like our sweatshirts? Not sure Canada will. Lol lol\"\n\nThe post has since been deleted from Facebook, CBC News reported.\n\nU.S. President Donald Trump declared the renaming of Lake Ontario on the U.S.-Canadian border to \"Lake America\" last month, prompting massive backlash from Canadians, Prime Minister Mark Carney, and even animated comedy TV show \"South Park,\" which changed its name to \"South America\" in a jab at the U.S. president's order. In an interview on Sept. 17 with ABC12 News in Michigan , Smith said that the picture contained an artificial intelligence marker, but was later reposted by her sister without the AI marker.\n\n\"We weren't trying to make a political statement,\" Smith reportedly said. \"However, we were, you know, kind of poking fun at the fact that you know one of the Great Lakes' names were getting changed.\"", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 07:02 PM IST", "pub_date_relative": "3m ago"}, {"title": "Iran offers to reopen Strait of Hormuz within 7 days and restart nuclear talks", "full_content": "Iran's foreign minister, Abbas Araghchi, has proposed reopening the strategically vital Strait of Hormuz and resuming nuclear talks with the U.S. within seven days if the Trump administration accepts its conditions.\n\nThe latest offer comes shortly after Iranian President Masoud Pezeshkian delivered a defiant response to President Donald Trump 's \" annihilation \" threat at the United Nations General Assembly this week, and nearly seven months after the U.S. and Israel launched their war against Tehran.\n\n\"If certain conditions are met, the Strait of Hormuz will be open at the end of seven days, and talks will be restarted,\" Araghchi told reporters on the sidelines of the General Assembly, according to state media .\n\n\"The conditions we have asked the U.S. to meet are nothing new, nothing more than what was already in the Islamabad MOU, which was signed by the U.S. president,\" he added.\n\nThe Islamabad Memorandum of Understanding refers to a June ceasefire agreement between the U.S. and Iran that ultimately collapsed in early July. The Trump administration has previously said it will not return to the terms of the June agreement.\n\nOil prices were slightly lower on Friday. International benchmark Brent crude futures with November expiry traded down 1% at $105.56 per barrel, while U.S. West Texas Intermediate futures with November expiry were last seen down 1.8% at $92.94.\n\nThe subject of the war has been a feature of this week's U.S.-China summit in Washington. Chinese President Xi Jinping is on a three-day state visit to the U.S., meeting with Trump on issues spanning trade, artificial intelligence, Taiwan and Iran.\n\nTrump has sought Beijing's help pressuring Tehran toward a settlement, after indirect U.S.-Iran talks resumed on the sidelines of the U.N. General Assembly in New York this week.", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 07:01 PM IST", "pub_date_relative": "5m ago"}, {"title": "\u2018We were wrong.\u2019 Why Morgan Stanley changed its tune on the U.S. dollar \u2014 and what it expects now.", "full_content": "Rising bond yields and expected Fed rate hikes have wrecked the bank\u2019s forecast for the buck", "source": "MarketWatch Top Stories", "pub_date_str": "25 Sep 2026, 07:00 PM IST", "pub_date_relative": "6m ago"}, {"title": "NPS Swasthya from 1 October: What you need to know about the new pension option and health cover", "full_content": "The National Pension System ( NPS ) is set to offer a new scheme that combines retirement savings with healthcare benefits. Called NPS Swasthya, the scheme will allow eligible NPS subscribers to build a separate corpus while also getting a super top-up health insurance policy.\n\nNPS Swasthya is expected to be launched on 1 October 2026, NPS Diwas, by Union Finance Minister Nirmala Sitharaman, according to an Outlook Money report citing sources.\n\nThe Pension Fund Regulatory and Development Authority (PFRDA) issued the operational guidelines for NPS Swasthya on 18 September. Here\u2019s what you need to know.\n\nNPS Swasthya is a new NPS option designed to provide retirement savings along with healthcare benefits.\n\nThe super top-up insurance will cover eligible medical expenses once the applicable annual deductible is crossed. Separately, subscribers can also use their NPS Swasthya corpus for eligible healthcare expenses, subject to the scheme's withdrawal rules.\n\nThe contributions to NPS Swasthya will be invested according to the investment pattern prescribed for the Central Government Scheme under the applicable PFRDA investment guidelines.\n\nAny individual who is eligible to join NPS can enrol in NPS Swasthya, subject to the scheme's conditions.\n\nThe standard health insurance covers the subscriber, spouse, and up to two dependent children under one family floater. Parents are not covered.", "source": "LiveMint Money", "pub_date_str": "25 Sep 2026, 06:59 PM IST", "pub_date_relative": "7m ago"}, {"title": "Needham initiates Wealthfront stock with buy rating on robo-advisor growth", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Sep 2026, 06:56 PM IST", "pub_date_relative": "9m ago"}, {"title": "RBC Capital raises Natera stock price target on MRD testing growth", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Sep 2026, 06:56 PM IST", "pub_date_relative": "9m ago"}, {"title": "See which incumbents have the biggest cash advantage in the tightest U.S. House races", "full_content": "The most competitive races for control of the House of Representatives in the 2026 midterm election may be toss-ups on the political map. But in the most fiercely contested districts, one candidate often holds a massive financial edge.\n\nIn 11 of the 19 incumbent-versus-challenger matchups rated as \"toss ups\" by The Cook Political Report with Amy Walter , a clear financial divide emerged: One campaign had at least twice as much money available as the other, according to Federal Election Commission data compiled by OpenSecrets , a nonprofit, nonpartisan organization that tracks money in politics. In every one of those races, the incumbent held that commanding lead.\n\nThe latest uniform quarterly reports covered activity through June 30, though some candidates have since filed additional reports tied to their states' primary calendars. CNBC used figures from the most recent FEC reporting period available for each candidate as of Sept. 18.\n\nThe pattern cuts across party lines, but it matters especially for Republicans because the GOP is defending most of the seats at the center of the House battlefield. The Cook Report currently rates 21 House races as toss-ups, including 16 Republican-held seats and five Democratic -held seats.\n\nIn Michigan's 7th District , Republican Rep. Tom Barrett had about $2.9 million on hand compared with roughly $383,000 for Democratic challenger William Lawrence \u2014 a more than 7-to-1 advantage.\n\nRepublican Rep. Gabe Evans had about $3.9 million available in Colorado's 8th District compared with roughly $601,000 for Democratic challenger Manny Rutinel. And in California's 22nd District , Republican Rep. David Valadao held about $3.4 million , nearly six times the roughly $572,000 held by Democratic challenger Randy Villegas.\n\nDemocratic incumbents have built large cushions of their own. Democratic Rep.", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 06:54 PM IST", "pub_date_relative": "11m ago"}, {"title": "Generation Income Properties retires $4.2M Loci obligation", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Sep 2026, 06:54 PM IST", "pub_date_relative": "11m ago"}, {"title": "Details on U.S.-China trade negotiations coming Monday, USTR Greer says", "full_content": "U.S. Trade Representative Jamieson Greer told CNBC on Friday that the U.S. and China have reached agreements covering a subset of goods the two countries can trade on more favorable terms, marking fresh progress in negotiations between the world's two largest economies.\n\n\"We've actually reached agreement with the Chinese on a number of these things,\" Greer said on CNBC's \"Squawk Box,\" referring to goods including U.S. agricultural products and medical devices and Chinese consumer goods considered non-sensitive.\n\nGreer said the Trump administration plans to release \"a lot more details\" Monday about what the two sides have accomplished in negotiations over the past several weeks. He said the goal is to carve out areas of trade that could remain insulated from future tariff measures or broader trade disputes.\n\nThe two countries want some goods to be traded on a \"more preferential basis\" and potentially left aside if either country imposes new tariffs.\n\nGreer did not specify Friday which products are covered by the agreements, how tariffs on those goods could change or when the new terms would take effect. Negotiations under the new U.S.-China \"Board of Trade\" mechanism are focused on \"pure trade issues,\" Greer said, rather than U.S. national security restrictions on advanced technology.\n\n\"All those export controls that are national security issues, we take those off the table,\" Greer said.\n\nTrump and Xi, after they met in Beijing in May, announced the establishment of the \"Board of Trade\" to manage trade between the two rivals in non-sensitive products. Businesses have been waiting for more details on what categories of trade would be set aside, under the new framework, for lower tariffs.", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 06:54 PM IST", "pub_date_relative": "11m ago"}, {"title": "EU vote on Tesla Full Self-Driving approval delayed to December", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Sep 2026, 06:51 PM IST", "pub_date_relative": "14m ago"}, {"title": "Nifty 50 posts biggest weekly drop in 6 years amid crude surge, rising global yields. Can bulls roar back?", "full_content": "It appears that control of the Indian stock market has been fully taken over by the bears, as headwinds continue to hit Dalal Street one after another, giving investors much-needed reasons to liquidate stocks at a much faster pace and dragging the headline indices to multi-month lows.\n\nWhile other key Asian markets are hitting record highs in 2026, domestic equities are struggling to find momentum. Even as mutual funds, largely backed by retail investors, continue to offset the selling pressure from FPIs, the markets have still slipped into bear market territory.\n\nOn Thursday, the Nifty 50 slumped 1.64%, marking its biggest one-day decline in 10 weeks. Although it recovered part of its losses in today's trade, it could not cut down the weekly losses.\n\nIt closed last week with a cut of 0.88%, extending its weekly losing streak to seven. This was the index's biggest sustained decline since 2020, indicating weak sentiment across the broader market. What's more concerning for the bulls is that the Nifty has recorded seven-week losing streaks only four times in the last 25 years.\n\nBarring 2020, the index logged a seven-week decline in 2008 and twice in 2021, and in the same year, it registered one of its longest losing runs after falling for nine consecutive weeks.\n\nFinancials were the biggest drag on the markets last week on concerns that proposed insurance commission caps could hurt earnings. This came as an additional headwind for the markets at a time when sentiment was already weak amid surging crude oil prices.\n\nCrude oil prices have been a focal point for markets since late February, when the US and Israel launched joint strikes on Iran, triggering a war in the Middle East. US and Iranian leaders exchanged barbs at the UN General Assembly this week, sending Brent crude prices back above $100 a barrel.\n\nAdding to concerns, the elevated oil prices have added pressure on global bonds, pushing yields to multi-decade highs.", "source": "LiveMint Markets", "pub_date_str": "25 Sep 2026, 06:51 PM IST", "pub_date_relative": "15m ago"}, {"title": "HSBC upgrades Synopsys stock rating to buy on AI growth outlook", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Sep 2026, 06:51 PM IST", "pub_date_relative": "15m ago"}, {"title": "RBC Capital maintains ConAgra stock rating on freight cost concerns", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Sep 2026, 06:50 PM IST", "pub_date_relative": "15m ago"}, {"title": "RBC Capital cuts Ameren stock price target on valuation concerns", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Sep 2026, 06:50 PM IST", "pub_date_relative": "15m ago"}, {"title": "RBC Capital raises Zscaler stock price target on smooth transition", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Sep 2026, 06:50 PM IST", "pub_date_relative": "15m ago"}, {"title": "RBC Capital maintains Sector Perform on Akamai stock after Anthropic deal", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Sep 2026, 06:50 PM IST", "pub_date_relative": "15m ago"}, {"title": "Global bond selloff rolls on, US 30-year yield at highest since 2004", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Sep 2026, 06:48 PM IST", "pub_date_relative": "17m ago"}, {"title": "India's viral Cockroach Party calls election panel head 'biggest threat' to democracy. Here's why it matters", "full_content": "Cockroach Janta Party, the viral pseudo-political movement behind the Gen Z protests that rattled Prime Minister Narendra Modi's government in July, has demanded the resignation of India's chief election officer after claiming he had undermined the country's democracy.\n\nOn Friday, Abhijeet Dipke, the founder of the CJP, said the party will begin a nationwide protest from Oct. 2 if the chief election officer does not resign by Saturday.\n\nIn a press conference on Thursday, Dipke said the country's Chief Election Commissioner, Gyanesh Kumar, \"is the biggest threat to India's democracy,\" raising questions over his role in a recent electoral roll revision exercise that has led to the deletion of millions of voters.\n\nThe exercise has given the government the power to select who can vote, rather than empowering voters to choose the government, Dipke said at a press conference.\n\nThe three members of the Election Commission are handpicked by the government and appointed by a selection panel of the prime minister, the home minister and the leader of opposition. The Indian National Congress, the main opposition political party, had opposed the selection of Kumar as the head of the election panel last year, as per local media reports.\n\nLast year, the Election Commission of India began conducting \"special intensive revisions\", or SIR, to update voter lists across the country. The authority said the exercise aimed to ensure \"electoral rolls are accurate, up-to-date, and free of ineligible or duplicate entries, while ensuring that no eligible elector is left out.\"\n\nHowever, local media reports earlier this month showed millions of voters had been deleted from the draft electoral rolls.", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 06:45 PM IST", "pub_date_relative": "21m ago"}], "cfa": [{"title": "FDI rises 6% to USD 19.81 billion in April-June", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Finance \u203a FDI rises 6% to USD 19.81 billion in April-June The Economic Times daily newspaper is available online now. Read Today's Paper FDI rises 6% to USD 19.81 billion in April-June SECTIONS FDI rises 6% to USD 19.81 billion in April-June PTI Last Updated: Sep 25, 2026, 07:06:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis In the first quarter of this fiscal, India received the maximum investments from countries like Singapore, Mauritius and the US.\n\nBuilding recycling plants is fine. Will they get enough scrap?\n\nBiogas found its ethanol moment this month. Can it now find scale?\n\nHas the US Fed and AI created a costlier world? And has the queue got longer for India?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "25 Sep 2026, 07:06 PM IST", "pub_date_relative": "just now", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Stocks tick higher, but Dow heads for fourth straight losing week: Live updates", "full_content": "U.S. equities rose slightly on Friday as Wall Street gets set to wrap up a volatile week of trading, with a surge in Treasury yields rippling through financial markets.\n\nThe S&P 500 was up 0.2%, as was the Nasdaq Composite . The Dow Jones Industrial Average gained 117 points, or 0.2%.\n\nShares of Akamai Technologies led technology higher, jumping more than 14% after announcing a multi-year deal with Anthropic . Other tech stocks such as Fastly and Cloudflare also saw gains.\n\nAlso helping sentiment, oil prices slid amid optimism that the Strait of Hormuz could be reopened, as Iran's Foreign Minister Abbas Araghchi has proposed to do so as well as restart nuclear talks with the U.S. within seven days if Washington accepts its conditions.\n\nOn Thursday, Reuters reported that the U.S. and Iranian negotiators in New York are considering a phased agreement to end the Middle East conflict.\n\nU.S. West Texas Intermediate crude futures dropped 2% to around $92 per barrel, while international benchmark Brent crude futures declined 1% to around $104 a barrel.\n\nThe Dow is heading for a fourth consecutive losing week, down 0.6% through Thursday's close. The S&P 500 is on track for a 0.7% advance, while the Nasdaq is up 1.6% week to date.\n\nThe drama continued in the bond market, where the 10-year Treasury yield climbed to its highest level since 2007 on Thursday, while the 30-year yield reached its highest level since 2004. The two were last seen up slightly at 5.183% and 5.478%, respectively.", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 07:04 PM IST", "pub_date_relative": "1m ago", "cfa_topics": ["Equity Investments", "Fixed Income", "Derivatives", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Iran offers to reopen Strait of Hormuz within 7 days and restart nuclear talks", "full_content": "Iran's foreign minister, Abbas Araghchi, has proposed reopening the strategically vital Strait of Hormuz and resuming nuclear talks with the U.S. within seven days if the Trump administration accepts its conditions.\n\nThe latest offer comes shortly after Iranian President Masoud Pezeshkian delivered a defiant response to President Donald Trump 's \" annihilation \" threat at the United Nations General Assembly this week, and nearly seven months after the U.S. and Israel launched their war against Tehran.\n\n\"If certain conditions are met, the Strait of Hormuz will be open at the end of seven days, and talks will be restarted,\" Araghchi told reporters on the sidelines of the General Assembly, according to state media .\n\n\"The conditions we have asked the U.S. to meet are nothing new, nothing more than what was already in the Islamabad MOU, which was signed by the U.S. president,\" he added.\n\nThe Islamabad Memorandum of Understanding refers to a June ceasefire agreement between the U.S. and Iran that ultimately collapsed in early July. The Trump administration has previously said it will not return to the terms of the June agreement.\n\nOil prices were slightly lower on Friday. International benchmark Brent crude futures with November expiry traded down 1% at $105.56 per barrel, while U.S. West Texas Intermediate futures with November expiry were last seen down 1.8% at $92.94.\n\nThe subject of the war has been a feature of this week's U.S.-China summit in Washington. Chinese President Xi Jinping is on a three-day state visit to the U.S., meeting with Trump on issues spanning trade, artificial intelligence, Taiwan and Iran.\n\nTrump has sought Beijing's help pressuring Tehran toward a settlement, after indirect U.S.-Iran talks resumed on the sidelines of the U.N. General Assembly in New York this week.", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 07:01 PM IST", "pub_date_relative": "5m ago", "cfa_topics": ["Derivatives", "Portfolio Management"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "\u2018We were wrong.\u2019 Why Morgan Stanley changed its tune on the U.S. dollar \u2014 and what it expects now.", "full_content": "Rising bond yields and expected Fed rate hikes have wrecked the bank\u2019s forecast for the buck", "source": "MarketWatch Top Stories", "pub_date_str": "25 Sep 2026, 07:00 PM IST", "pub_date_relative": "6m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "NPS Swasthya from 1 October: What you need to know about the new pension option and health cover", "full_content": "The National Pension System ( NPS ) is set to offer a new scheme that combines retirement savings with healthcare benefits. Called NPS Swasthya, the scheme will allow eligible NPS subscribers to build a separate corpus while also getting a super top-up health insurance policy.\n\nNPS Swasthya is expected to be launched on 1 October 2026, NPS Diwas, by Union Finance Minister Nirmala Sitharaman, according to an Outlook Money report citing sources.\n\nThe Pension Fund Regulatory and Development Authority (PFRDA) issued the operational guidelines for NPS Swasthya on 18 September. Here\u2019s what you need to know.\n\nNPS Swasthya is a new NPS option designed to provide retirement savings along with healthcare benefits.\n\nThe super top-up insurance will cover eligible medical expenses once the applicable annual deductible is crossed. Separately, subscribers can also use their NPS Swasthya corpus for eligible healthcare expenses, subject to the scheme's withdrawal rules.\n\nThe contributions to NPS Swasthya will be invested according to the investment pattern prescribed for the Central Government Scheme under the applicable PFRDA investment guidelines.\n\nAny individual who is eligible to join NPS can enrol in NPS Swasthya, subject to the scheme's conditions.\n\nThe standard health insurance covers the subscriber, spouse, and up to two dependent children under one family floater. Parents are not covered.", "source": "LiveMint Money", "pub_date_str": "25 Sep 2026, 06:59 PM IST", "pub_date_relative": "7m ago", "cfa_topics": ["Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Details on U.S.-China trade negotiations coming Monday, USTR Greer says", "full_content": "U.S. Trade Representative Jamieson Greer told CNBC on Friday that the U.S. and China have reached agreements covering a subset of goods the two countries can trade on more favorable terms, marking fresh progress in negotiations between the world's two largest economies.\n\n\"We've actually reached agreement with the Chinese on a number of these things,\" Greer said on CNBC's \"Squawk Box,\" referring to goods including U.S. agricultural products and medical devices and Chinese consumer goods considered non-sensitive.\n\nGreer said the Trump administration plans to release \"a lot more details\" Monday about what the two sides have accomplished in negotiations over the past several weeks. He said the goal is to carve out areas of trade that could remain insulated from future tariff measures or broader trade disputes.\n\nThe two countries want some goods to be traded on a \"more preferential basis\" and potentially left aside if either country imposes new tariffs.\n\nGreer did not specify Friday which products are covered by the agreements, how tariffs on those goods could change or when the new terms would take effect. Negotiations under the new U.S.-China \"Board of Trade\" mechanism are focused on \"pure trade issues,\" Greer said, rather than U.S. national security restrictions on advanced technology.\n\n\"All those export controls that are national security issues, we take those off the table,\" Greer said.\n\nTrump and Xi, after they met in Beijing in May, announced the establishment of the \"Board of Trade\" to manage trade between the two rivals in non-sensitive products. Businesses have been waiting for more details on what categories of trade would be set aside, under the new framework, for lower tariffs.", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 06:54 PM IST", "pub_date_relative": "11m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Nifty 50 posts biggest weekly drop in 6 years amid crude surge, rising global yields. Can bulls roar back?", "full_content": "It appears that control of the Indian stock market has been fully taken over by the bears, as headwinds continue to hit Dalal Street one after another, giving investors much-needed reasons to liquidate stocks at a much faster pace and dragging the headline indices to multi-month lows.\n\nWhile other key Asian markets are hitting record highs in 2026, domestic equities are struggling to find momentum. Even as mutual funds, largely backed by retail investors, continue to offset the selling pressure from FPIs, the markets have still slipped into bear market territory.\n\nOn Thursday, the Nifty 50 slumped 1.64%, marking its biggest one-day decline in 10 weeks. Although it recovered part of its losses in today's trade, it could not cut down the weekly losses.\n\nIt closed last week with a cut of 0.88%, extending its weekly losing streak to seven. This was the index's biggest sustained decline since 2020, indicating weak sentiment across the broader market. What's more concerning for the bulls is that the Nifty has recorded seven-week losing streaks only four times in the last 25 years.\n\nBarring 2020, the index logged a seven-week decline in 2008 and twice in 2021, and in the same year, it registered one of its longest losing runs after falling for nine consecutive weeks.\n\nFinancials were the biggest drag on the markets last week on concerns that proposed insurance commission caps could hurt earnings. This came as an additional headwind for the markets at a time when sentiment was already weak amid surging crude oil prices.\n\nCrude oil prices have been a focal point for markets since late February, when the US and Israel launched joint strikes on Iran, triggering a war in the Middle East. US and Iranian leaders exchanged barbs at the UN General Assembly this week, sending Brent crude prices back above $100 a barrel.\n\nAdding to concerns, the elevated oil prices have added pressure on global bonds, pushing yields to multi-decade highs.", "source": "LiveMint Markets", "pub_date_str": "25 Sep 2026, 06:51 PM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "RBC Capital cuts Ameren stock price target on valuation concerns", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Sep 2026, 06:50 PM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Global bond selloff rolls on, US 30-year yield at highest since 2004", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Sep 2026, 06:48 PM IST", "pub_date_relative": "17m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Top 10 things to watch in the stock market Friday", "full_content": "Stocks are heading for a higher open, and the S&P 500 and Nasdaq are poised to post winning weeks.", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 06:39 PM IST", "pub_date_relative": "26m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Russia could attack a NATO country within months, Danish intelligence warns", "full_content": "Danish intelligence officials have warned that Russia could launch a \"limited\" military attack against a NATO member in the coming months, saying the Kremlin appears more willing to take risks after more than 4\u00bd years of war against Ukraine.\n\nThe Danish Defence Intelligence Service, or DDIS, on Thursday identified a \"low but growing risk\" that Russia could carry out isolated strikes with long-range weapons on infrastructure that is critical to the support of Ukraine.\n\n\"A limited military attack would be a desperate move on Russia's part and, like the intensified hybrid attacks, could potentially take place in the coming months,\" it wrote in a report.\n\n\"The purpose would be to redirect European resources away from supporting Ukraine and to sow division within NATO, should the alliance fail to agree on a collective response.\"\n\nThe DDIS added that it saw no indications that Russia would launch an outright invasion of a NATO country, although it said it could not rule this out.\n\nRussia could also deploy a limited number of troops, possibly without national insignia, into NATO countries on its border, the DDIS said. However, it said that such a buildup would be difficult to conceal and take several months to prepare.\n\nThe new threat assessment joins a chorus of Russia warnings from top European security officials and lawmakers in recent days.\n\nNATO members that border Russia are Finland, Norway and Poland as well as the Baltic states of Latvia, Estonia and Lithuania.", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 06:30 PM IST", "pub_date_relative": "35m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Asian Games: Gulveer Singh Clinches Silver In Men\u2019s 10,000m", "full_content": "Gulveer Singh clocked 28:29.38 to finish behind Bahrain's Birhanu Balew, winning his second consecutive Asian Games medal in the men's 10,000m.", "source": "NDTV Profit", "pub_date_str": "25 Sep 2026, 06:27 PM IST", "pub_date_relative": "39m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "The stock market could be due for a nasty selloff, judging by these two signals", "full_content": "A jump in bond-market anxiety coupled with a selloff in financial stocks may mean a serious shock to markets, according to Bank of America.", "source": "MarketWatch Top Stories", "pub_date_str": "25 Sep 2026, 06:22 PM IST", "pub_date_relative": "44m ago", "cfa_topics": ["Equity Investments", "Fixed Income"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Novo is betting on its next chapter as Eli Lilly gains more ground in GLP-1s", "full_content": "Every time Novo urges investors to look ahead, Eli Lilly gives them another reason to look back at its widening lead over the Danish drugmaker.\n\nNovo this week laid out an ambitious strategy to reignite growth beyond its top-selling Wegovy and Ozempic injections, which face patent expirations in key markets in the early 2030s. At its Capital Markets Day on Monday, the company promised a pipeline of potential blockbuster products, including drugs that would diversify from its core area of obesity and diabetes.\n\nBut Wall Street so far isn't convinced by Novo's road map. Investors pummeled the drugmaker's stock, underwhelmed by growth targets that matched industry averages rather than outpacing them. They were also skeptical of the lack of clarity around a near-term turnaround plan.\n\nAt the same time, Lilly continues to chip away at its rival's market share \u2014 including in the burgeoning obesity pill space.\n\nNovo hopes to keep its early lead in the oral weight loss market after the successful launch of the Wegovy pill, months ahead of Lilly's rival pill, Foundayo. Novo CEO Mike Doustdar told CNBC on Tuesday that early adoption suggests patients may have been waiting for an alternative to injections.\n\n\"If that continues to the extent that we have seen, then yes, mathematically, by the end of the decade, there is going to be a larger portion on the pill than injectable,\" he said.\n\nBut Lilly is hot on its heels, backed by its commercial firepower.\n\nIn an exclusive interview with CNBC on Monday, Lilly CEO Dave Ricks said the drugmaker's new obesity pill, Foundayo, is slowly gaining ground in the U.S. One-third of new GLP-1 pill patients are taking Lilly's drug, and its share of that oral market is growing \"week by week,\" Ricks told CNBC in Houston, Texas.", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 06:21 PM IST", "pub_date_relative": "44m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "India plans Rs 7.86 lakh crore bond sales in H2, trims borrowing amid yield pressure", "full_content": "India's government aims to raise 7.86 trillion rupees through bond sales between October and March. The gross borrowing limit for the fiscal year has been reduced to 16 trillion rupees. Issuance of longer duration securities has been increased to 45.6% of total borrowing. Treasury bills will be sold weekly, albeit at a lower amount than earlier this year.", "source": "Economic Times Economy", "pub_date_str": "25 Sep 2026, 06:17 PM IST", "pub_date_relative": "49m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Bitget crypto exchange hit by $350mn hack", "full_content": "Company says action was \u2018highly consistent\u2019 with methods of North Korean criminals", "source": "FT Markets", "pub_date_str": "25 Sep 2026, 06:16 PM IST", "pub_date_relative": "49m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Market wrap: Axis Bank, Asian Paints, Max Healthcare, Infosys top gainers and losers on Nifty and Sensex on Friday", "full_content": "Indian equity benchmarks ended higher on Friday, with the Nifty 50 rising 0.34% and the Sensex gaining 0.43%. Axis Bank and Asian Paints led the gainers, while Max Healthcare and Infosys were among the top losers. Here\u2019s a look at the biggest movers across the Nifty and Sensex.", "source": "Economic Times Markets", "pub_date_str": "25 Sep 2026, 06:13 PM IST", "pub_date_relative": "53m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "U.S. Treasury yields tick higher as global bond rout slows", "full_content": "U.S. Treasury yields continued to climb higher to end the week following a global bond selloff and stronger-than-expected U.S. economic data.", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 06:11 PM IST", "pub_date_relative": "54m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Gold Edges Higher Even As US Treasury Yields Spike: Will MCX Rates Break Rs 1.55 Lakh Resistance?", "full_content": "According to Kotak, the fundamental outlook for the bullion is cautiously positive medium term, but pressured near term.", "source": "NDTV Profit", "pub_date_str": "25 Sep 2026, 06:02 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income", "Alternative Investments"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Embassy REIT raises Rs 1,000 cr via debentures to refinance debt", "full_content": "Embassy Office Parks REIT has effectively secured Rs 1,000 crore via non-convertible debentures, aimed at refinancing its existing debts and boosting its financial position. This notable transaction highlights a pivotal moment in the evolution of India's REIT market and was fully subscribed by a reputable European bank, showcasing substantial international interest and the ongoing regulatory support from SEBI and RBI for the sector.", "source": "Economic Times Markets", "pub_date_str": "25 Sep 2026, 05:52 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}], "updated_at": "25 Sep 2026, 07:06 PM IST", "total_stories": 345};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>

</body>
</html>
