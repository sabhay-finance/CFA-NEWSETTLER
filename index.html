mposite Index collapsing today? Investing.com What Happens If Indonesia Is Removed From MSCI\u2019s Global Indexes? Bloomberg.com", "source": "Google News Business", "pub_date_str": "16 Oct 2026, 05:48 PM IST", "pub_date_relative": "19m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Cantor Fitzgerald reiterates Varonis stock rating on acquisition news", "full_content": "", "source": "Investing.com News", "pub_date_str": "16 Oct 2026, 05:46 PM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Dividend champions of auto ancillaries: Majestic Auto, PTL, or Banco Products - Who drives home the highest yield?", "full_content": "Dividend champion of auto ancillaries: Majestic Auto, PTL Enterprises, and Honda India Power are some of the key auto ancillary companies with attractive dividend yield. For investors who prefer to pick stocks with high annual yield for constant income, here\u2019s a comparison of dividends by these auto ancillary companies.\n\nMajestic Auto paid an annual dividend per share of \u20b9 60 over the last twelve months. With this, its annual dividend yield stood at 16.21%.\n\nThe auto ancillary stock ended 2.09% lower at \u20b9 370.10 per share on BSE with a market capitalisation of \u20b9 384.81 crore. The auto ancillary stock has delivered 17.36% return in six months, 7.43% return in 2026 so far, and around 11.17% return in one year.\n\nPTL Enterprises has paid an annual dividend of \u20b9 2.5 per equity share in last one year. Its annual dividend yield stood at 6.5%. The stock closed 0.18% lower at \u20b9 38.72 per share on BSE with an Mcap of \u20b9 512.56 crore on Friday. PTL Enterprises share price value has declined 3.03% in three months, 3.22% in one year, and around 10.58% in two years.\n\nBanco Products has declared nearly 36 dividends since 2001. The company has announced an equity dividend of \u20b9 23 per equity share in 2026. With this, its dividend yield stood at 3.79%.\n\nBanco Products India share price closed 0.46% lower at \u20b9 604.50 per share on BSE on Friday. Its share price value has declined at 18.57% in one year, but surged 66.12% in two years, and jumped around 150.99% in three years.\n\nMajestic Auto has the highest annual dividend yield for last one year, followed by PTL Enterprises and Banco Products. Investors must note that the high dividend yield of Majestic Auto is due to one-time special dividend paid by the two firms.\n\nCatch all the Business News , Market News , Breaking News Events and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.", "source": "LiveMint Markets", "pub_date_str": "16 Oct 2026, 05:44 PM IST", "pub_date_relative": "22m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Fixed Income"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Royalty Pharma declares $0.235 Q4 dividend, payable Dec. 10", "full_content": "", "source": "Investing.com News", "pub_date_str": "16 Oct 2026, 05:42 PM IST", "pub_date_relative": "25m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Cantor Fitzgerald raises Bentley Systems stock price target on infrastructure demand", "full_content": "", "source": "Investing.com News", "pub_date_str": "16 Oct 2026, 05:40 PM IST", "pub_date_relative": "26m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "India to reach 100 billion dollar of bilateral trade with Russia by 2030: Ambassador Vinay Kumar", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a India to reach 100 billion dollar of bilateral trade with Russia by 2030: Ambassador Vinay Kumar The Economic Times daily newspaper is available online now. Read Today's Paper India to reach 100 billion dollar of bilateral trade with Russia by 2030: Ambassador Vinay Kumar SECTIONS India to reach 100 billion dollar of bilateral trade with Russia by 2030: Ambassador Vinay Kumar ANI Last Updated: Oct 16, 2026, 05:39:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India is pursuing negotiations for a Free Trade Agreement with the Eurasian Economic Union to increase exports. Indian Ambassador to Russia Vinay Kumar stated that bilateral trade is projected to reach USD 100 billion by 2030. The current trade turnover is reported at USD 38 billion for the first half of this year. Efforts are underway to diversify India's export basket and improve market access in Russia.\n\nUS mid-term elections \u2013 Part 2: What does it mean for Trump to lose control of Congress?\n\nThe ABCD of the US mid-term elections \u2013 Part 1: Why it matters across the globe\n\nCurbing rupee bets: What the RBI\u2019s new rules mean for the hedge-now-or-wait question\n\nBrinjal, buffalo, bacteria: Inside India\u2019s pay-for-nature system\n\nHomebuyers wait as NCLT panel picks holes in unfinished Jaypee projects\n\nThe NBFC saga - Part 3: How one default in 2018 changed the way RBI reads risk\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "16 Oct 2026, 05:39 PM IST", "pub_date_relative": "28m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Futures Mixed; Tesla Flies As Anthropic Value Questioned - Investor's Business Daily", "full_content": "Futures Mixed; Tesla Flies As Anthropic Value Questioned Investor's Business Daily S&P 500 Futures Gain After Warsh\u2019s Remarks; Chip Stocks Extend Slide Barchart.com Why Are Nasdaq Futures Edging Higher Premarket? TSLA, CRWV, TSM, NVDA, RKLB, ASST, PEP Stocks In Focus Yahoo Finance Stocks to Watch: CoreWeave, Tesla, Netflix WSJ US futures mostly higher with the Fed's Warsh touting AI LancasterOnline", "source": "Google News Business", "pub_date_str": "16 Oct 2026, 05:39 PM IST", "pub_date_relative": "28m ago", "cfa_topics": ["Equity Investments", "Derivatives"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "S&P 500 futures tick higher, but index heads for losing week: Live updates", "full_content": "S&P 500 futures rose slightly on Friday, as traders headed for a mostly losing week amid declines in tech and artificial intelligence-related names.\n\nFutures tied to the broad market average traded 0.2% higher, while Nasdaq-100 futures teetered around the flat line. Futures linked to the Dow Jones Industrial Average gained 61 point, or 0.1%.\n\nTesla shares rose 3% after the electric vehicle maker unveiled its next-generation roadster. To be sure, the model won't go into production until 2028.\n\nChipmakers were lower again, however. The VanEck Semiconductor ETF (SMH) shed 0.7%, led by declines in Micron, AMD and Sandisk. Semiconductors have struggled this week amid jitters about competition from China . The SMH is down 7.4% week to date heading into Friday's open.\n\nThose declines, coupled with drops in other stocks linked to artificial intelligence, put the S&P 500 on pace for a losing week. The benchmark index is down 0.9% this week, while the Nasdaq has shed 2.4%.\n\n\"One of the real challenges we've had in AI and technology overall for the last six to 12 months is that so much of what's happening is happening in private markets,\" Jeff Richards, managing partner at Notable Capital, told CNBC's \" Closing Bell \" on Thursday. He noted that AI-linked companies like Anthropic and OpenAI, among others, going public could help assuage investor concerns.\n\n\"Once we get more of the information out there \u2013 analyst coverage, detailed information on core metrics \u2013 into the market over the course of '27, I think a lot of those fears will ease,\" he said.\n\nOutside of tech, investors have been grappling with hotter-than-expected inflation data, which has been exacerbated by elevated energy prices in the wake of the U.S.-Iran war. Wholesale inflation this week saw its biggest gain since 2022 , while consumer inflation remained well above the Federal Reserve's target of 2%.", "source": "CNBC Top News", "pub_date_str": "16 Oct 2026, 05:35 PM IST", "pub_date_relative": "31m ago", "cfa_topics": ["Economics", "Equity Investments", "Derivatives", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "S&P 500 futures tick higher, but index heads for losing week: Live updates - CNBC", "full_content": "S&P 500 futures tick higher, but index heads for losing week: Live updates CNBC Stock market today: Dow, S&P 500, Nasdaq futures mixed amid volatile week Yahoo Finance Wall St futures mixed as tech wobbles again, Tesla gains Reuters Chipmaker sell-off sends investors to other stocks and bonds for safety CNN Wall Street muscles higher despite more swings for AI stocks AP News", "source": "Google News Business", "pub_date_str": "16 Oct 2026, 05:35 PM IST", "pub_date_relative": "32m ago", "cfa_topics": ["Equity Investments", "Derivatives"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Battered Indian IT stocks rally as AI fears ease and global tech sells off", "full_content": "Bengaluru: India\u2019s beaten-down information technology (IT) stocks are rebounding as fears that artificial intelligence (AI) will disrupt traditional tech services ease and investors rotate out of a global tech sell-off, even after a weak September quarter for the sector\u2019s biggest names.\n\nShares of India\u2019s four of five largest IT services companies rose by as much as 8% on Friday, extending gains even after a muted September quarter. Three of the top four, Tata Consultancy Services Ltd (TCS), HCL Technologies Ltd and Wipro Ltd, posted their weakest September-quarter performance in three years.\n\nThe rally came as technology stocks sold off in South Korea, with the Kospi\u2019s 14% decline this week pointing to a shift in global investor positioning. Easing concerns over AI and a rotation in global tech investments appear to be lifting sentiment toward Indian IT, whose valuations had been under pressure since the AI boom stoked disruption fears.\n\nAI stocks have come under pressure in recent days amid concerns that slowing revenue growth, rising infrastructure costs and tighter financing conditions could undermine lofty valuations. The Nasdaq 100 has fallen 3% since Monday. Sentiment also got a lift from finance minister Nirmala Sitharaman\u2019s remarks earlier this week that she was open to views on taxation in capital markets.\n\n\u201cOne of the factors may be the finance minister\u2019s comments that foreign portfolio investors may be exempted from capital gains tax.", "source": "LiveMint Markets", "pub_date_str": "16 Oct 2026, 05:23 PM IST", "pub_date_relative": "43m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Nifty, Sensex investors alert! US bond yields remain above 5% - 5 ways this could impact your investments, portfolio", "full_content": "US Bond Yield Rise : The sharp reversal in US Treasury yields has drawn attention to the outlook for global financial markets, with implications for capital flows, currencies, borrowing costs and equity valuations.\n\nThe US 10-year Treasury yield retreated from a peak of 5.33% following Wednesday's inflation data to 5.086% by Thursday's close, holding near that level on Friday. The 10-basis-point decline on Thursday marked its biggest single-day fall since August 2025, despite September consumer inflation accelerating to 3.7%, producer prices rising 6.3% year on year, stronger retail sales and crude oil prices remaining above $100.\n\nSandip Jha, Chief Product Officer at Godrej Wealth, cautioned that the decline may not signal a sustained turnaround in the bond market.\n\n\u201cThe decline in US 10-year yields looks more like a tactical correction than a change in the underlying trend. While yields have eased amid risk-off flows and a flight to safe-haven assets, the underlying macro backdrop remains far from supportive of a sustained bond rally. With inflationary pressures expected to remain sticky and economic activity remaining resilient, the fundamental case for a sustained rally in Treasuries remains weak. Unless the macro data begin to soften meaningfully, yields could reverse course and move higher again,\u201d Jha said.\n\nThe US 10-year Treasury yield had climbed from 4.76% at the end of August 2026 to 5.33% on Wednesday, reaching a multi-decade high.\n\nThe increase comes amid elevated crude oil prices , resilient US economic activity, widening fiscal deficits and growing investor demands for higher compensation for holding long-term government debt.", "source": "LiveMint Markets", "pub_date_str": "16 Oct 2026, 05:21 PM IST", "pub_date_relative": "45m ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "DEE Development Engineers signs framework pact with domestic EPC firm for nuclear power sector", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Companies \u203a DEE Development Engineers signs framework pact with domestic EPC firm for nuclear power sector DEE Development Engineers Share Price The Economic Times daily newspaper is available online now. Read Today's Paper DEE Development Engineers signs framework pact with domestic EPC firm for nuclear power sector SECTIONS DEE Development Engineers signs framework pact with domestic EPC firm for nuclear power sector PTI Last Updated: Oct 16, 2026, 05:20:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis DEE Development Engineers Limited announced a framework agreement with a domestic engineering contractor for the nuclear power sector. This collaboration aims to strengthen its presence in various nuclear power projects across India. The focus will include comprehensive engineering support like design services, budgetary offers, and sourcing of essential components. Indian nuclear energy ambitions are driving the need for reliable engineering expertise and strict quality standards.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "16 Oct 2026, 05:20 PM IST", "pub_date_relative": "46m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "India's forex reserves drop by $8.58 billion to $726.03 billion in week ended October 9: RBI", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Indicators \u203a India's forex reserves drop by $8.58 billion to $726.03 billion in week ended October 9: RBI The Economic Times daily newspaper is available online now. Read Today's Paper India's forex reserves drop by $8.58 billion to $726.03 billion in week ended October 9: RBI SECTIONS India's forex reserves drop by $8.58 billion to $726.03 billion in week ended October 9: RBI ET Online Last Updated: Oct 16, 2026, 05:23:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India\u2019s foreign exchange reserves fell by $8.578 billion to $726.027 billion in the week ended October 9, according to data released by the Reserve Bank of India (RBI). The decline followed a $12.952 billion drop in the previous week. Foreign currency assets and gold reserves recorded significant declines, while special drawing rights and India\u2019s reserve position with the IMF also fell.\n\nUS mid-term elections \u2013 Part 2: What does it mean for Trump to lose control of Congress?\n\nThe ABCD of the US mid-term elections \u2013 Part 1: Why it matters across the globe\n\nCurbing rupee bets: What the RBI\u2019s new rules mean for the hedge-now-or-wait question\n\nBrinjal, buffalo, bacteria: Inside India\u2019s pay-for-nature system\n\nHomebuyers wait as NCLT panel picks holes in unfinished Jaypee projects\n\nThe NBFC saga - Part 3: How one default in 2018 changed the way RBI reads risk\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "16 Oct 2026, 05:17 PM IST", "pub_date_relative": "49m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Treasuries head for best week since February as AI jitters halt bond rout", "full_content": "Borrowing costs fall back from highest levels in decades as investors seek safety in government debt", "source": "FT Markets", "pub_date_str": "16 Oct 2026, 05:15 PM IST", "pub_date_relative": "51m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Worst over for IT stocks? Experts analyse Q2 results of TCS, HCL, Tech Mahindra and others, suggest top picks", "full_content": "IT stocks have been on a roll over the last few sessions boosted by better-than-expected Q2 results and selloff in AI stocks globally as investors shift their focus from hype to financial performance and structural outlook. The Nifty IT index surged 3.92% on Friday, 16 October, extending gains for the fourth consecutive session. In just four sessions, the index has jumped nearly 13%.\n\nIT stocks are rising after a prolonged period of stress due to macroeconomic challenges, cautious discretionary spending by clients, and AI-led disruptions.\n\nThe sector remains at a crucial juncture as experts believes, the next leg of growth will depend on translating deal wins into revenue and scaling AI-led services sufficiently to offset productivity-driven deflation in traditional engagements.\n\nThe Q2 numbers of several IT players, including TCS and HCL Tech came better-than-expected.\n\nSumit Pokharna, SVP- Fundamental Research at Kotak Neo, said the demand environment has not materially changed since the last quarter. Discretionary programs without near-term value remain under scrutiny. AI revenue grew faster in BFSI relative to other verticals.\n\n\"Enterprises are investing in (1) AI native business solutions, (2) core modernization with the help of AI, (3) autonomous GBS in horizontal functions such as finance, HR and procurement, (4) modernizing legacy data estate and (5) data foundations. Cybersecurity, AI governance, AI guardrails, tokenomics, orchestration, access controls, security observability, etc. are becoming important for clients, creating a significant and growing opportunity,\" said Pokharna.\n\nAI capabilities continue to improve across the spectrum of skills and tasks. There has been meaningful progress in capabilities in software engineering tasks in the past 6-9 months when measured on performance of AI models on benchmarks. Older benchmarks for software engineering tasks have been saturated.", "source": "LiveMint Markets", "pub_date_str": "16 Oct 2026, 05:15 PM IST", "pub_date_relative": "51m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Nifty IT posts best weekly gain in 18 years as Q2 earnings revive investor interest; which stocks led the rally?", "full_content": "Tech Mahindra, TCS, HCL Technologies, Infosys, and Wipro were among the large-cap IT stocks that ended the week with strong double-digit gains, powered by stronger-than-expected September-quarter performances and a weakening global AI trade that prompted investors to rotate back into the software sector.\n\nSix of the 10 constituents of the Nifty IT index ended the week with gains of over 10%, with Tech Mahindra leading the pack after surging 18.7% as it closed higher in each of the last four trading sessions.\n\nIt was followed by Tata Consultancy Services (TCS), HCL Technologies , Infosys , Wipro , and LTM which ended the week with gains of 18.7%, 17.3%, 16.5%, 16.4%, and 12.1%, respectively.\n\nAmid strong support from heavyweight stocks, the Nifty IT index finished the week with an 11.72% surge, marking its best weekly gain in 18 years. It reclaimed the 30,000 mark and also touched an eight-month high.\n\nThe recovery has also helped the stock recoup nearly half of its 2026 losses, after it had fallen 32%. The index\u2019s year-to-date decline now stands at 15.7%. Alongside, the recovery rally has boosted confidence on Dalal Street, helping the Nifty post its best weekly performance in six months.\n\nThe rally has provided a much-needed boost to a battered sector that had been plagued by fears of AI-driven disruption, concerns over interest rates, and sustained foreign institutional investor (FII) selling, dragging several constituents to multi-year lows.\n\nHowever, the September-quarter results have offered investors some reassurance about the sector\u2019s near-term growth prospects, helping revive sentiment towards IT stocks.\n\nStronger-than-expected performances from major companies have also eased some concerns over slowing demand and the potential impact of artificial intelligence on traditional software services.", "source": "LiveMint Markets", "pub_date_str": "16 Oct 2026, 05:05 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Ladakh\u2019s infrastructure plan: 5 projects worth \u20b93,350 cr to boost air connectivity, roads, tourism", "full_content": "Choose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "16 Oct 2026, 04:58 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Bajaj Housing Finance Q2 Results: PAT rises 18% YoY to Rs 757 crore, AUM grows 25%", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a Earnings \u203a Bajaj Housing Finance Q2 Results: PAT rises 18% YoY to Rs 757 crore, AUM grows 25% Bajaj Housing Finance Share Price Housing and Urban Development Corporation Share Price PNB Housing Finance Share Price LIC Housing Finance Share Price Aadhar Housing Finance Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Bajaj Housing Finance Q2 Results: PAT rises 18% YoY to Rs 757 crore, AUM grows 25% SECTIONS Bajaj Housing Finance Q2 Results: PAT rises 18% YoY to Rs 757 crore, AUM grows 25% By Kumar Gaurav , ETMarkets.com Last Updated: Oct 16, 2026, 04:52:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Bajaj Housing Finance reported an 18% year-on-year rise in Q2 FY27 profit to Rs 757 crore, while net interest income increased 10%. Assets under management grew 25% to Rs 1.58 lakh crore, with asset quality remaining largely stable.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "16 Oct 2026, 04:52 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Banking tax raid fears hit London lenders' shares ahead of crucial budget", "full_content": "Shares in some of Britain's biggest banks sold off Friday amid reports that the U.K. government will hike taxes on London-listed lenders' profits later this month.\n\nLloyds Banking Group led losses, sliding 1.8%, while NatWest was 1.51% lower by 11:30 a.m. in London (6:30 a.m. ET).\n\nBarclays moved 0.13% higher, reversing earlier losses. London-listed shares of HSBC and Standard Chartered \u2014 which both derive much of their profits overseas \u2014 added 1.2% and 0.71%, respectively.\n\nFinance Minister John Healey is expected to raise the sector-specific surcharge on banks' profits to 8%, up from 3%, when he delivers his first budget as Chancellor, scheduled for Oct. 28.\n\nLloyds Banking Group. The levy, which sits on top of corporation tax, was earlier cut to 3% from 8% under Rishi Sunak's Conservative government in 2023. While the hike could raise \u00a32 billion ($2.67 billion) per year for the U.K. Treasury, it could also slice 6% off lenders' earnings, KBW analysts said in a note Oct. 12.\n\nHealey on Thursday described banks as the \"jewel\" in the U.K.'s economic crown in an interview with Bloomberg.\n\nHowever, the proposed levy has revived wider concerns about the Labour government's approach to financial services, and how the sector may be treated as ministers seek to fund public services and meet fiscal targets.\n\nAmanda Blanc, CEO of Aviva , said the financial services sector is one of the U.K.'s \"core industries\".", "source": "CNBC Top News", "pub_date_str": "16 Oct 2026, 04:49 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Fixed Income"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "My wife says we can\u2019t afford to retire. I vetoed her $8,000 trip to Italy. We\u2019re in our 60s and have $4 million. Do I keep working?", "full_content": "\u201cI worry about healthcare, long-term care, inflation, a long bear market and living to 95.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "16 Oct 2026, 04:45 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "MoSPI conducting new surveys to improve economic data: Secretary Saurabh Garg", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Indicators \u203a MoSPI conducting new surveys to improve economic data: Secretary Saurabh Garg The Economic Times daily newspaper is available online now. Read Today's Paper MoSPI conducting new surveys to improve economic data: Secretary Saurabh Garg SECTIONS MoSPI conducting new surveys to improve economic data: Secretary Saurabh Garg ANI Last Updated: Oct 16, 2026, 04:44:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis MoSPI is conducting new surveys, including one on cooperatives, to improve India's economic data, Secretary Saurabh Garg said. He expressed confidence in the country's growth trajectory after GDP expanded 7.8% in the first quarter, while highlighting inflation concerns, gaps in measuring household work and care activities, and methodological improvements to national accounts.\n\nUS mid-term elections \u2013 Part 2: What does it mean for Trump to lose control of Congress?\n\nThe ABCD of the US mid-term elections \u2013 Part 1: Why it matters t Today: Investors Pare Rate-Hike Bets After Warsh Declines to Guide on Next Move - WSJ", "full_content": "Stock Market Today: Investors Pare Rate-Hike Bets After Warsh Declines to Guide on Next Move WSJ Warsh Vows Price Stability as A.I. Delivers \u2018Shock\u2019 to Economy The New York Times Warsh\u2019s Missing Words Fuel Bets Fed Will Hold Rates Bloomberg.com Key Moments From Kevin Warsh\u2019s Speech to the IMF WSJ Warsh signals steady Fed outlook despite inflation jump Axios", "source": "Google News Business", "pub_date_str": "16 Oct 2026, 04:36 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Market wrap: Tech Mahindra, TCS, InterGlobe, BSE top gainers and losers on Nifty and Sensex on Friday", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Market wrap: Tech Mahindra, TCS, InterGlobe, BSE top gainers and losers on Nifty and Sensex on Friday National Stock Exchange of India Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Market wrap: Tech Mahindra, TCS, InterGlobe, BSE top gainers and losers on Nifty and Sensex on Friday SECTIONS Market wrap: Tech Mahindra, TCS, InterGlobe, BSE top gainers and losers on Nifty and Sensex on Friday By Kumar Gaurav , ETMarkets.com Last Updated: Oct 16, 2026, 04:34:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Indian equities extended gains as strong IT earnings lifted sentiment, with the Nifty rising 149 points to 23,146 and Sensex gaining 413 points. Tech Mahindra led advances, while broader markets slipped. Analysts flagged 23,000 as crucial for further upside.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "16 Oct 2026, 04:34 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Q2 Results Live: Urban Company Net Loss More Than Doubles; PNB Profit NII Jumps 11%, Bajaj Housing AUM Grows 25%", "full_content": "Investors will track earnings from real estate, banking, consumer, telecom and technology companies, with DLF, PNB, Bajaj Housing Finance, Federal Bank, LTM, Oberoi Realty and Tejas Networks among the key names reporting September-quarter results.", "source": "NDTV Profit", "pub_date_str": "16 Oct 2026, 04:34 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "KFC to switch to Coca-Cola beverages in U.S. restaurants for the first time in decades", "full_content": "KFC's U.S. restaurants will ditch PepsiCo and switch to Coca-Cola beverages next year, marking the first time in decades that the Yum Brands chain has changed its drink supplier, the restaurant company said Thursday.\n\nSome of KFC's international markets serve Coke products, but the chain's U.S. restaurants have stuck with PepsiCo drinks ever since Pepsi bought KFC in 1986. At the time of the acquisition, KFC was Coke's second-largest fountain account, trailing only McDonald's. Pepsi later spun off KFC, along with sister chains Pizza Hut and Taco Bell \u2014 but even as the combined Yum Brands, the company stayed loyal to its previous owner. Without Pepsi, Taco Bell would not serve its iconic Mountain Dew Baja Blast.\n\nThe change comes as KFC aims to win back U.S. diners, who have ditched the fried chicken chain for rivals such as Chick-fil-A or Popeyes.\n\n\"This decision is a critical step in the Kentucky Fried Comeback,\" KFC U.S. President Catherine Tan-Gillespie wrote in a memo to franchisees and employees obtained by CNBC. \"A new beverage offering, with a new partner in Coca-Cola, gives us a platform to innovate, meet changing tastes and give customers more reasons to choose us.\"\n\nFor many fast-food chains, beverages have become a critical way to attract consumers. A number of restaurants, including McDonald's and Taco Bell, have broadened their drink offerings with options such as refreshers or \"dirty soda.\" For its part, KFC recently unveiled new drinks, including iced coffees and shakes, at Open House , its innovation restaurant in McKinney, Texas.\n\nCoke told CNBC earlier this year that the company has helped many of its restaurant partners create new drinks.\n\nKFC expects to be pouring Coke beverages in all of its U.S. restaurants by the end of the first quarter of 2027, Tan-Gillespie said.\n\nTan-Gillespie also said that Pepsi remains an important partner for KFC's parent company and the chain's international markets.", "source": "CNBC Top News", "pub_date_str": "16 Oct 2026, 04:32 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Derivatives"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Nike's India campus is a long-term growth bet amid turnaround", "full_content": "The retailer, which has been struggling to revive its business and regain momentum under CEO Elliott Hill, is hoping the world's most populous country can help it turn the page on its performance.\n\nAs it reported its fiscal first-quarter earnings on Oct. 1, the company announced it will create a new global campus in Bengaluru, India, as part of its growth strategy. Hill wrote in a letter to employees that the new facility would be a \"long-term investment\" to help position Nike for success.\n\n\"India is already an important growth market and manufacturing hub for Nike, with strong capabilities and access to talent,\" Hill wrote.\n\nThe new campus is expected to open in the next few years and span corporate roles across the organization, including the namesake Nike brand, Jordan Brand and Converse. Nike plans to discuss its India campus in detail at its investor day next month.\n\nIn a statement to CNBC, a Nike spokesperson said expanding into India is a \"natural\" next step for the company as it looks to grow its global presence.\n\n\"As participation in running, basketball, football, fitness and other sports continues to grow across India, we see an opportunity to better serve athletes through stronger local capabilities, consumer insights, and innovation,\" the spokesperson said.\n\nIndia will be the world's third-largest retail market by 2030, according to Indian conglomerate Reliance Industries. Its e-commerce market was valued at $159.25 billion in 2026 and is projected to reach $332.94 billion by 2031, according to IBEF, a business advocacy organization created by the Indian government.\n\nNike has endured a yearslong slump and is trying to right its business under Hill's turnaround plan. Nike also announced this month that it would lay off workers across the company as part of what it has dubbed its Pace strategy, which includes supply chain changes and reorganization of the company's geographic segments.", "source": "CNBC Top News", "pub_date_str": "16 Oct 2026, 04:30 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Norway's $2 trillion wealth fund was frozen out of major defense companies. That may be about to change", "full_content": "Norway's $2.3 trillion oil fund could soon invest in Western defense companies after years of being frozen out of much of the sector by state ethics guidelines.\n\nThe sovereign wealth fund is currently worth around 21.8 trillion Norwegian kroner, or $2.3 trillion, making it the largest fund of its kind in the world. With stakes in around 1.5% of the world's publicly listed companies, the fund is one of the biggest investors in the stock market worldwide.\n\nIn November 2025, a review was ordered into the ethical guidelines governing how Norges Bank invests, following controversy over divestments from some Israeli and American firms.\n\nOn Thursday, the independent Gjedrem Committee submitted the review's findings to the Norwegian Ministry of Finance. It included a recommendation for radical change to the fund's approach to defense investments, arguing that \"Norges Bank must be prepared for situations where conflicts escalate into war.\"\n\nCurrent ethical rules prohibit the fund from making investments in companies including Airbus , BAE Systems , Boeing , BWX Technologies and Lockheed Martin , as they contribute to the manufacturing of nuclear weapons. The fund does hold some defense stocks, including a 2.3% stake in Germany's Rheinmetall , and a 1.5% stake in Italy's Leonardo .\n\nThe Gjedrem Committee said Thursday that although the nuclear weapons criterion should be retained, \"its scope should change.\"\n\n\"The Fund is not to be invested in companies that produce nuclear weapons, unless the company is domiciled in a nuclear-weapon state under the Treaty on the Non-Proliferation of Nuclear Weapons (NPT) that is allied with Norway,\" it said in its report.", "source": "CNBC Top News", "pub_date_str": "16 Oct 2026, 04:26 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Nearly 40% of the S&P 500 is in a bear market. Here are 10 of those stocks that analysts say can gain up to 81%.", "full_content": "The S&P 500\u2019s strong overall performance reflects its heavy weighting at the top. Under the surface, nearly 40% of the index\u2019s stocks are down at least 20% from their 52-week highs.", "source": "MarketWatch Top Stories", "pub_date_str": "16 Oct 2026, 04:26 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Bajaj Housing Finance Q2 Results: Profit Rises 18%; AUM Grows 25%", "full_content": "Bajaj Housing Finance's gross non-performing assets (NPA) stood at 0.29% as of September 30, 2026, compared with 0.26% a year earlier.", "source": "NDTV Profit", "pub_date_str": "16 Oct 2026, 04:24 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Already up 86% in 6 months, ICICI Direct still sees another 39% upside in this small-cap stock - Check target, rationale", "full_content": "Small-cap stock GEE Ltd, a manufacturer of welding consumables, has emerged as a conviction pick for ICICI Direct, which has initiated coverage on the stock with a Buy rating and a target price of \u20b9 170. The brokerage's target implies an upside of 37% from the current market price of \u20b9 124, over a 12-month period.\n\nIn its recent research report, ICICI Direct said the company was positioned for an earnings recovery driven by capacity expansion, improving utilisation, specialised welding products and opportunities in nuclear power and defence shipbuilding. The brokerage also expects a sharp improvement in profitability over FY26-FY28, supported by operating leverage and a gradual shift towards higher- value products.\n\n\u201cGEE is well positioned to deliver a strong earnings recovery, supported by the expansion of installed capacity from 59,075 MTPA to 71,339 MTPA and improving utilisation of its existing manufacturing facilities,\u201d ICICI Direct said in its research report.\n\nIn today's trading session, the stock rose 3.5% to \u20b9 126.65 apiece on the BSE. It had touched a 52-week high of \u20b9 143.05 in September 2026 and a 52-week low of \u20b9 53.61 in March 2026.\n\nThe small-cap stock has gained 8% over the past week and three months, surged 86% in five months, and advanced 38% over the past year.\n\nICICI Direct identified capacity expansion and better utilisation of existing manufacturing facilities as key drivers of GEE's growth. The company's capacity utilisation improved from 48% in FY25 to 57% in FY26, and the brokerage expects it to rise to 60% in FY27 and 74% in FY28.\n\nThe brokerage said GEE's expanded manufacturing base could support revenue potential of around \u20b9 850 crore at mature utilisation levels. The company plans capital expenditure of \u20b9 30-40 crore over the next three to four years, including \u20b9 5-10 crore in FY27, to enhance capacity and improve operational efficiency.\n\nProduct diversification is another growth driver.", "source": "LiveMint Markets", "pub_date_str": "16 Oct 2026, 04:23 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stock to buy after SEBI CAS new rule: Experts bullish on Groww brand parent Billionbrains Garage Ventures shares; target", "full_content": "Stock to buy after SEBI CAS new rule: Following the Indian capital market regulator SEBI\u2019s action on the Closing Auction Session (CAS), to restore the final 30-minute continuous-session VWAP for derivatives settlement, brokerage stock Groww witnessed strong buying during the Friday session. Shares of Groww brand parent Billionbrains Garage Ventures Ltd finished around 1.50% higher on Friday, extending its uptrend for the second straight session.\n\nAccording to market experts, Billionbrains Garage Ventures shares are expected to benefit from SEBI's CAS new rule. Experts believe a change in the methodology for computing the settlement price of index derivatives may reduce volatility on the expiry date, which is highly visible under CAS. Global Investment Bank Jefferies picked Goww to outperform its peers, while some Indian experts cited three major reasons to buy this brokerage stock.\n\nSpeaking on the SEBI's CAS move, Jefferies India report said, \u201cSEBI has changed the methodology to compute the settlement price of index derivatives on expiry day, as proposed in the Sep'26 consultation paper, to the volume-weighted average price (VWAP), effective 7th Dec'26. This should reduce expiry-day volatility under the Closing Auction Session (CAS), benefiting brokers whose orders remain below pre-CAS levels. With premium turnover for exchanges back to pre-CAS levels, earnings upside may be limited.", "source": "LiveMint Markets", "pub_date_str": "16 Oct 2026, 04:12 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Gold vs silver vs platinum: Which metal saw biggest rally since last Dussehra? Experts explain outlook", "full_content": "Gold vs silver vs platinum: Gold has staged a spectacular rally over the past two years, but the yellow metal is not alone. Not just the yellow metal, silver and platinum also witnessed over the same period. As we gear up for Dussehra celebrations next week, let\u2019s understand which precious metal outperformed peers over the last one year.\n\nWhile gold saw a sharp rally in 2025, the yellow metal saw range-bound movement in 2026. Meanwhile, silver saw a highly volatile session by the end of 2025 and a steep surge in the beginning of the year 2026.\n\nSince the last Dussehra celebration, silver has outperformed gold and platinum. \u201cSilver is the winner of the year, but it has also been the biggest round-trip: up 155% by January, now 53% off its peak,\u201d stated Gaurav Garg, Head - Research, Lemonn, adding that anyone who bought silver near the January highs is still sitting on losses.\n\nThe gold rate in India has surged nearly 26% over the last one year. The yellow metal saw a sharp uptick in January this year, but steeply corrected in February. Central bank buying also supports the price. Central banks bought nearly 289 tonnes of gold in the second quarter of 2026, whereas China\u2019s central bank added 23 tonnes in September.\n\nSilver receives strong demand for its high utility and its demand among jewellery buyers. Silver reached its all-time high levels in January and February this year. The historical rally was followed by sharp corrections in March. Despite the correction, silver has surged around 47% over the last one year.\n\nApart from a rally in prices globally, weakness in the Indian Rupee was also a crucial factor that supported the precious metals\u2019 prices. \u201cTwo things outside the metals themselves pushed rupee returns higher. The rupee weakened from 88.71 to 95.05 per dollar .", "source": "LiveMint Markets", "pub_date_str": "16 Oct 2026, 04:10 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Rupee posts best week in seven months, fundamentals key for lasting turnaround", "full_content": "This week, the Indian rupee saw an impressive 2% increase, attributed to effective policy measures designed to alleviate short-term depreciation pressures. Despite the positive movement, analysts caution that a lasting recovery is contingent upon significant improvements in the overall economic landscape. Additionally, India's merchandise trade deficit climbed to $30.21 billion in September, prompting concerns among investors about the impact of frequent foreign exchange regulations on market stability.", "source": "Economic Times Markets", "pub_date_str": "16 Oct 2026, 04:04 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Financial Statement Analysis"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Bitcoin rebounds to $82,000 after briefly falling below $80,000 as inflation fears trigger $950 million in liquidations", "full_content": "Bitcoin recovered above $82,000 after briefly falling below $80,000 as hotter-than-expected US producer inflation intensified concerns over Federal Reserve rate hikes. Nearly $950 million in leveraged positions were liquidated, while spot Bitcoin ETFs recorded $261 million in outflows.", "source": "Economic Times Markets", "pub_date_str": "16 Oct 2026, 04:02 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "The best of the AI trade could be behind us. Here\u2019s how to prepare, according to Barclays.", "full_content": "The London-based bank recommends holding on to Big Tech stocks ahead of their earnings, but has a preference for companies with strong business models.", "source": "MarketWatch Top Stories", "pub_date_str": "16 Oct 2026, 03:51 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Proxy Leverage: How The Houthis Remain Iran's Ultimate Saudi Pressure Point", "full_content": "Houthi attacks on Saudi infrastructure and investment events are raising the stakes for Riyadh, as Iran seeks to counter US pressure and the kingdom's Vision 2030 ambitions face fresh risks.", "source": "NDTV Profit", "pub_date_str": "16 Oct 2026, 03:47 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers", "Alternative Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Urban Company shares: Will the proposed fundraise boost the stock or raise dilution concerns?", "full_content": "Urban Company is considering a fundraise as rivals Snabbit and Pronto rapidly expand in the instant home services market. JM Financial says fresh capital could help the company defend its position, though dilution and continued spending may weigh on its stock near term.&nbsp;", "source": "LiveMint Markets", "pub_date_str": "16 Oct 2026, 03:40 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Stock Market Highlights: Sensex Ends 414 Points Higher, Nifty Posts Biggest Weekly Gain In 27 Weeks; Tech Mahindra Zooms 8%", "full_content": "Stock Market Highlights: Broader markets, bucking the trend, ended lower. Nifty Small Cap 100 index closed 0.01% lower, while Nifty Mid Cap 100 index settled 0.11% lower.", "source": "NDTV Profit", "pub_date_str": "16 Oct 2026, 03:37 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Yes Bank Q2 preview: Will strong profit, NII growth offer relief for investors amid AT-1 bond saga?", "full_content": "Yes Bank is expected to post a 48% YoY jump in Q2 net profit to Rs 969 crore, driven by robust loan growth and higher NII. However, investor focus remains on the Supreme Court ruling invalidating its Rs 8,415 crore AT-1 bond write-off, which has pressured the stock.", "source": "Economic Times Markets", "pub_date_str": "16 Oct 2026, 03:28 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Fixed Income"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Nifty Breaks Out Of Rounding Bottom", "full_content": "On the downside, the 20-DMA at 22,847 is likely to provide immediate support, followed by the stronger support zone of 22,550-22,650.", "source": "NDTV Profit", "pub_date_str": "16 Oct 2026, 03:27 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Indonesia stocks, rupiah tumble as MSCI weighs market downgrade", "full_content": "Global index provider MSCI is contemplating downgrading Indonesia's stock market to standalone status. Such a reclassification could notably diminish Indonesia's appeal to global investors and alter its presence in international indexes. This year, Indonesia's share within MSCI's emerging markets index has dwindled. A downgrade would position Indonesia as the largest economy in this standalone category, inciting uncertainty for investment funds linked to MSCI indices.", "source": "Economic Times Markets", "pub_date_str": "16 Oct 2026, 03:25 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Global Market: Euro     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
