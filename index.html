hare Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "01 Oct 2026, 07:23 PM IST", "pub_date_relative": "47m ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "These bond strategies can help you get a safe 5% return on your cash", "full_content": "With U.S. Treasury yields on the rise, financial planners say they\u2019re seeing a growing interest in bonds, especially among investors looking to secure fixed income in retirement.", "source": "MarketWatch Top Stories", "pub_date_str": "01 Oct 2026, 07:22 PM IST", "pub_date_relative": "48m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Why Micron\u2019s big earnings report isn\u2019t lifting the stock", "full_content": "Expectations are high, and Micron isn\u2019t topping estimates to the degree that it used to.", "source": "MarketWatch Top Stories", "pub_date_str": "01 Oct 2026, 07:22 PM IST", "pub_date_relative": "48m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Why American investors should care as France\u2019s bond market stumbles", "full_content": "As French bond yields rise, is it a threat to the U.S.?", "source": "MarketWatch Top Stories", "pub_date_str": "01 Oct 2026, 07:19 PM IST", "pub_date_relative": "51m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Global bond sell-off pushes 10-year Treasury yield to highest since 2002", "full_content": "Sovereign debt costs around world return to multiyear highs", "source": "FT Markets", "pub_date_str": "01 Oct 2026, 07:15 PM IST", "pub_date_relative": "55m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "U.S. reportedly asks Germany and France to release diesel stockpiles: What that means for a U.S. ban on exports of the fuel", "full_content": "The Trump administration asked the European Union to draw down 120 million barrels of diesel over the next six months, Reuters reported.", "source": "MarketWatch Top Stories", "pub_date_str": "01 Oct 2026, 07:15 PM IST", "pub_date_relative": "55m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "US Stock Market Today: Dow Surges 260 Points; S&P 500, Nasdaq In Green Even As Yields Scale 2002 High", "full_content": "Nasdaq Composite rose 0.37%, S&P 500 and Dow Jones Industrial Average advanced 0.17% in early trade on Thursday.", "source": "NDTV Profit", "pub_date_str": "01 Oct 2026, 07:10 PM IST", "pub_date_relative": "59m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "South Korean President Lee pushes back on Alaska LNG project after Trump touts Seoul's participation", "full_content": "South Korea's $200 billion investment into the U.S., which President Donald Trump said would transform America \"for generations,\" is not a done deal in totality.\n\nThe South Korean investment plan includes nuclear power plants, a natural gas power facility in Texas and potentially the long-planned Alaska liquefied natural gas project.\n\nTrump in a Truth Social post late Wednesday stateside said the countries had agreed to work on the Alaska LNG project, pegging its value at $50 billion, drawing a response from South Korea's president, Lee Jae Myung, who emphasized that involvement in some of the projects remains subject to commercial considerations.\n\nLee in an X post on Thursday local time said that participation in the Alaska LNG project was dependent on its financial viability and legal compliance. He added that investments in nuclear power plants would also require assessment of commercial viability on a plant-by-plant basis.\n\nTrump had hailed South Korean investments in his post late Wednesday stateside, saying that the countries had agreed to work on the Alaska LNG project, pegging its value at $50 billion.\n\nThe joint statement earlier Wednesday, however, had mentioned that work on the project was contingent on \"commercial reasonableness,\" without highlighting details on allocations toward the project.\n\nThe Alaska LNG project seeks to transport natural gas roughly 1,300 kilometers (800 miles) from fields on Alaska's North Slope to the southern part of the state, where it would be liquefied for export to markets including Asia, reported Yonhap. The project has faced long-standing questions over its economics given the large up-front investment required.\n\nIndustry Minister Kim Jung-kwan had described it as \"high-risk\" last year and said participation would be difficult unless it could generate sufficient cash flow.", "source": "CNBC Top News", "pub_date_str": "01 Oct 2026, 07:10 PM IST", "pub_date_relative": "59m ago", "cfa_topics": ["Economics", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "The U.S. just made it much easier for retail investors to access private markets", "full_content": "The Securities and Exchange Commission has greenlit sweeping plans to widen access to private markets to individual investors \u2014 just as the industry's rush into retail faces sharper scrutiny.\n\nSEC chairman Paul Atkins said investor demand for private market investment opportunities is growing, adding that exposure to \"one of the great engines of American enterprise\" should \"not be reserved for the wealthiest or for those deemed to be the most sophisticated.\"\n\nThe proposals, approved Wednesday by the U.S. regulator, would seek to expand the number and type of ways for individuals to qualify as accredited investors.\n\n\"One of my priorities for the Commission is to explore ways to facilitate the ability of individual investors to participate in private markets, while at the same time protecting those investors from bad actors and fraud,\" Atkins said in a statement .\n\nThe SEC proposals include permitting registered investment advisers (RIAs) to charge performance fees of up to 20% \u2014 a level comparable to fees historically used in the hedge fund and alternatives space \u2014 to draw more private asset managers into the retail wealth space.\n\nThe Trump administration has been keen to ease regulatory guardrails on private markets and expand access to ordinary investors. Last August, U.S.", "source": "CNBC Top News", "pub_date_str": "01 Oct 2026, 07:08 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "45% YTD rally! Experts see up to 56% upside in these 3 stocks on China's export shift | Target, rationale", "full_content": "China's abrasive (materials used for grinding, cutting and polishing) products are losing export rebates, and this could benefit Indian-made abrasive more competitive. The sector is witnessing a blend of capex up-cycle with structural premiumisation, according to Monarch Networth Capital which sees up to 56% upside potential (bull case) in stocks like like Grindwell Norton , Carborundum Universal , and Wendt India.\n\nDemand from automotive precision, aerospace, electronics, semiconductor and EV-adjacent applications may also drive growth in the sector. The brokerage sees a nascent upcycle in the sector lifted by premiumisation.\n\nThe brokerage remains bullish on three stocks in the sector, ie Grindwell Norton, Carborundum Universal, and Wendt India. \u201cWe see a nascent upcycle, preferring a pecking order of GNO, CUMI, and then Wendt on fundamentals and risk-reward.\u201d\n\nThe brokerage gave a \u2018Buy\u2019 rating to the stock with a target price of \u20b9 2,371 per share in base case, \u20b9 2,986 per share in Bull case and \u20b9 1,778 per share in bear case. The brokerage sees nearly 23.8% upside in base case, 55.9% upside in the stock in bull case, and 7.2% decline in bear case.\n\n\u201cWe initiate coverage on GNO with a BUY. GNO combines a strong Saint-Gobain-backed competitive franchise with a broad abrasives portfolio, deep technology access and pricing discipline.\u201d\n\nThe stock closed 0.64% lower at \u20b9 1977.25 per share on BSE on Thursday. Its share price value has surged nearly 26% year to date (YTD).\n\nThe brokerage gave a \u2018Buy\u2019 rating to the stock with a target price of \u20b9 1563 per share (29.8% upside) in base case, \u20b9 1737 (44.3%) in bull case, \u20b9 848 (29% downside) per share in base case .\n\n\u201cCUMI\u2019s moat rests on upstream bauxite/alumina/SiC integration and Ceramics, its highest EBITDA margin segment (24.7%), now riding semiconductor and defense qualification ramps,\u201d stated the brokerage in its report.", "source": "LiveMint Markets", "pub_date_str": "01 Oct 2026, 07:04 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Sikkim govt raises DA for employees and pensioners; 50,000 to benefit", "full_content": "The Sikkim government has announced an increase in Dearness Allowance (DA) for state government employees and Dearness Relief (DR) for pensioners, according to a Finance Department circular issued on Thursday.\n\nThe revised rates will take effect on January 1 and will apply to employees and pensioners covered under both the pre-revised and revised basic pay structures.\n\nFor state government employees and pensioners drawing their pay or pension under the pre-revised basic pay structure, the DA and DR have been increased from 257% to 262%.\n\nThe revised rate will be effective from January 1, as specified in the government circular.\n\nFor those drawing pay under the revised basic pay structure, the DA and DR have been raised from 58% to 60%, also with effect from January 1.\n\nThe revised rates will additionally cover contractual employees and personnel working in work-charged establishments who receive revised pay under the regular scales applicable to state government employees.\n\nThe Sikkim government has also revised the DA applicable to All India Service (AIS) officers serving in the state.\n\nFor AIS officers who continue to draw salaries under the pre-revised pay band and grade pay structure based on the Sixth Central Pay Commission, the DA has been increased from 257% to 262% with effect from January 1.", "source": "LiveMint Money", "pub_date_str": "01 Oct 2026, 07:03 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Christine Lagarde: Where AI risks meet", "full_content": "It is a pleasure to welcome you to the tenth annual conference of the European Systemic Risk Board (ESRB), as we mark 15 years since its creation.\n\nThe ESRB was born of a hard lesson laid bare by the global financial crisis and reinforced by Europe\u2019s sovereign debt crisis.\n\nRisks had been building across institutions and markets, while the view of any one authority remained incomplete. Europe needed a way to see the financial system as a whole, so it brought central banks and supervisors together around one table to provide that overall perspective. [ 1 ]\n\n15 years on, the rising importance of artificial intelligence (AI) is putting that system-wide view to the test.\n\nGenerative AI is already widely used in finance. Nearly nine out of ten significant euro area banks use it. [ 2 ] Furthermore, in a recent survey of EU securities market firms, seven out of ten respondents expected to increase their investment in AI. [ 3 ]\n\nThere is good reason for that interest. AI can help financial institutions analyse vast amounts of data more quickly and improve how they assess risk. [ 4 ] More broadly, the potential productivity gains could allow firms to offer customers a better service while using their resources more efficiently.\n\nTo date, most uses of AI in finance involve limited autonomy. But AI agents are beginning to take on more discretion. They can pursue a goal with limited human direction, potentially devising trading strategies or finding vulnerabilities in the systems on which trading depends.\n\nThe ESRB is well placed to examine how recent developments in AI could create risks across the financial system. I see three areas that call for particular attention.", "source": "ECB Press", "pub_date_str": "01 Oct 2026, 07:00 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Inox Clean Energy IPO papers kept in abeyance by Sebi", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a Inox Clean Energy IPO papers kept in abeyance by Sebi IIFL Capital Services Share Price Choice International Share Price JM Financial Share Price Anand Rathi Share & Stock Brokers Share Price SMC Global Securities Share Price The Economic Times daily newspaper is avail     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
