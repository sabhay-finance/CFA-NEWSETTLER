hose funds could potentially be used to pay the income taxes associated with Roth conversions.", "source": "Yahoo Finance", "pub_date_str": "03 Sep 2026, 06:45 PM IST", "pub_date_relative": "19m ago"}, {"title": "\u2018Please don\u2019t let this happen to you\u2019: My best friend died without a will \u2014 her neglectful family gets everything", "full_content": "\u201cShe struggled with the thought of leaving everything to people who, in her eyes, had never made much time for her.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "03 Sep 2026, 06:45 PM IST", "pub_date_relative": "19m ago"}, {"title": "Stock futures rise as falling Treasury yields signal less pressure on Fed to hike rates: Live updates - CNBC", "full_content": "Stock futures rise as falling Treasury yields signal less pressure on Fed to hike rates: Live updates CNBC Stock Market Today: Dow Rises On Fed Comments; Broadcom Falls On Earnings (Live Coverage) Investor's Business Daily Stock Market Today: Treasury Yields Steady, Yen Jumps \u2014 Live Updates WSJ Stocks climb and US yields ease; yen jumps against dollar Reuters Stock Market Today: Futures Little Changed After Major Indexes Snap 3-Session Skids; Snowflake Shares Soar Investopedia", "source": "Google News Business", "pub_date_str": "03 Sep 2026, 06:42 PM IST", "pub_date_relative": "22m ago"}, {"title": "Artisan Sold Cencora (COR) as Earnings Momentum Slowed", "full_content": "Skip to navigation Skip to main content Skip to right column Artisan Sold Cencora (COR) as Earnings Momentum Slowed Soumya Eswaran Thu, September 3, 2026 at 9:11 AM EDT 3 min read COR Artisan Partners , an investment management company, released its second-quarter 2026 investor commentary for the \"Artisan Global Opportunities Strategy\". The letter can be downloaded here . Global equities rebounded sharply during the quarter, with the MSCI ACWI Index returning 15.3% as resilient economic growth, strong corporate earnings, and continued enthusiasm around arti e and expand access to AI for developers and institutions worldwide,\" Huang wrote.\n\nHugging Face CEO Cl\u00e9ment Delangue told CNBC on Thursday that the company approached Huang over the summer about a deal, \"and a few weeks later, here we are.\"\n\n\"During the summer, I think we realized that Hugging Face and open source AI in general was at the turning point, and that it needed more, more resources, more scale, more visibility,\" he told CNBC's Becky Quick on \"Squawk Box.\"\n\nDelangue said he approached first because Nvidia was \"a perfect home\" for his company, adding that discussions went quite fast to get a deal done.\n\nThe acquisition marks Nvidia's second biggest on record, following the $20 billion purchase of assets from chipmaker Groq in December. Prior to that, its largest deal was the purchase of Israeli chipmaker Mellanox for almost $7 billion in 2019.\n\nNvidia has become the world's most valuable company due to the insatiable demand for its graphics processing units, which have powered the generative AI boom. Hugging Face marks a big bet on a popular AI platform, as Nvidia continues to show that it's more than just a chip company.", "source": "CNBC World Economy", "pub_date_str": "03 Sep 2026, 06:40 PM IST", "pub_date_relative": "24m ago"}, {"title": "Verizon\u2019s Dividend Is One of the Biggest in the S&P 500\u2014But Is It Safe?", "full_content": "Skip to navigation Skip to main content Skip to right column Verizon\u2019s Dividend Is One of the Biggest in the S&P 500\u2014But Is It Safe? Chris Lange Thu, September 3, 2026 at 9:10 AM EDT 4 min read VZ ^GSPC Quick Read VZ's 5.6% yield looks safe, with free cash flow covering the $2.83 annual dividend nearly 2x and CFO Tony Skiadas calling it \"ironclad.\"\n\nThe Frontier acquisition pushed total debt to $172.5 billion, lifting leverage to 2.5x EBITDA, which is above management's 2027 target range.\n\nVerizon earns a solid B dividend grade, with shares up 30% year to date signaling the market prices in a turnaround, not a cut.\n\nJust released. Our analysts combed the entire stock market and named the ten best stocks to buy right now. The report is free. Enter your email and see if any of your stocks made the cut.\n\nVerizon ( NYSE:VZ ) just cut another check to shareholders. The telecom giant paid its $0.7075 quarterly dividend on August 3, 2026, extending one of the longest income streaks in large-cap America. At the current share price of $50.53, the $2.83 annualized payout translates to a yield of roughly 5.6%, still one of the fattest in the S&P 500. The question income investors keep asking: how safe is it?\n\nThe August payment matched the prior quarter's $0.7075, up from $0.69 in the first two quarters of the prior cycle. CFO Tony Skiadas told analysts the January raise of $0.07 per share, up 2.5% from our prior annual dividend rate marked \"the 20th consecutive year of dividend increases.\" Skiadas also reiterated the commitment in plain language: \"The dividend is still ironclad for us, and we raised the dividend.\"\n\nVerizon guided full-year 2026 adjusted EPS to $4.99 to $5.04, which comfortably covers the $2.83 annualized dividend with a payout ratio near 56%. Q2 2026 adjusted EPS came in at $1.30, beating the $1.27 consensus.", "source": "Yahoo Finance", "pub_date_str": "03 Sep 2026, 06:40 PM IST", "pub_date_relative": "24m ago"}, {"title": "Artisan Reduced Amer Sports (AS) After Its Rally Despite Long-Term Brand Strength", "full_content": "Skip to navigation Skip to main content Skip to right column Artisan Reduced Amer Sports (AS) After Its Rally Despite Long-Term Brand Strength Soumya Eswaran Thu, September 3, 2026 at 9:09 AM EDT 3 min read AS Artisan Partners , an investment management company, released its second-quarter 2026 investor commentary for the \"Artisan Global Opportunities Strategy\". The letter can be downloaded here . Global equities rebounded sharply during the quarter, with the MSCI ACWI Index returning 15.3% as resili teady at the central bank's September meeting provided there are no surprises from upcoming inflation data.\n\nIn remarks that seem to contrast with statements last week from Chairman Kevin Warsh, Waller expressed confidence in the current inflation trends, saying that tariff impacts likely have been muted and higher energy prices haven't had a substantial impact in other parts of the economy.\n\nWhile he conceded that inflation is \"meaningfully above\" the Fed's 2% target, he noted that recent trends \"suggest we are finally seeing some signs of disinflation.\"\n\n\"If this continues in the data due over the next two weeks, I would be inclined to support holding the target for the federal funds rate at its current setting,\" Waller said in remarks for a Reuters interview.\n\nMarket-implied odds for a rate hike at the Sept. 15-16 meeting dropped sharply following the remarks, with traders now pricing in just a 54.6% probability, down about 12 percentage points, according to the CME Group's FedWatch .\n\n\"I'm going to paraphrase John Lennon here: Give disinflation a chance. We can wait one meeting,\" Waller said. \"What's the cost of waiting one meeting? Hiking 25 basis points, one meeting right now, is not going to bring the CPI down to 2%.\"\n\nThe policymaker did add caveats, noting that if there are any indications between now and the meeting, he could change course. The only major inflation reports the Fed will get are the consumer and producer price indexes that the Bureau of Labor Statistics will release next week.\n\n\"I judge that policy is currently only slightly restricting aggregate demand, and it may not take much acceleration in inflation to nudge me into supporting tighter policy,\" Waller said. \"If there is evidence that progress toward 2% inflation reversed in August, a small adjustment in our stance would help ensure that it resumes.\"", "source": "CNBC Top News", "pub_date_str": "03 Sep 2026, 07:03 PM IST", "pub_date_relative": "1m ago", "cfa_topics": ["Quantitative Methods", "Economics"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "Stocks rise as Treasury yields fall on lower Fed rate hike expectations: Live updates", "full_content": "Equities moved higher on Thursday, while Treasury yields pulled back, as investors grew hopeful that the Federal Reserve may leave interest rates unchanged this month.\n\nThe S&P 500 rose 0.5%, while the Nasdaq Composite traded up 0.4%. The Dow Jones Industrial Average climbed 332 points or 0.6%.\n\nThe benchmark 10-year Treasury note yield last traded around 4.75%, seeing declines after Federal Reserve Governor Christopher Waller said he'd be \" inclined to support \" holding rates steady barring any surprises in upcoming inflation data. On Wednesday, the yield hit its highest level since November 2023 .\n\nBets among fed funds futures traders that the central bank would raise rates in a couple weeks fell to 54.6% after his statement, according to the CME FedWatch tool . That's down from 63.2% a day ago.\n\nWaller's remarks, along with the sharp rise in the yen, supported the drop in yields more broadly and offered some momentum to the market even as oil prices continued their climb Thursday. West Texas Intermediate crude futures traded 1% higher at around $92 per barrel, while Brent futures advanced less than 1% to above $96.\n\nRising crude has put upward pressure on Treasury yields recently, as investors worry elevated energy prices would drive inflation and force the Federal Reserve to increase rates. However, U.S. yields were already under pressure Thursday prior to Waller's comments as the Japanese yen rallied against the U.S. dollar . The yen was last up more than 1% against the dollar at 156.1 yen.\n\n\"A stronger JPY could be the thread that helps unravel a lot of the macro overhangs weighing on equities to the extent it continues (a sustained rally in the yen would in theory remove upward pressure from global yields),\" wrote Adam Crisafulli of Vital Knowledge.\n\nSnowflake shares were a bright spot, popping more than 25% after the company reported better-than-expected second-quarter earnings and revenue as well as issued strong guidance.", "source": "CNBC Top News", "pub_date_str": "03 Sep 2026, 07:02 PM IST", "pub_date_relative": "2m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Fixed Income", "Derivatives", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Earnings call transcript: Brady tops q4 2026 estimates but shares fall premarket", "full_content": "", "source": "Investing.com News", "pub_date_str": "03 Sep 2026, 06:55 PM IST", "pub_date_relative": "8m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Canada July trade surplus shrinks, weeks before new US tariffs", "full_content": "", "source": "Investing.com News", "pub_date_str": "03 Sep 2026, 06:49 PM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "What Makes DoorDash (DASH) an Attractive Bet Amid AI Disruption Concerns", "full_content": "Skip to navigation Skip to main content Skip to right column What Makes DoorDash (DASH) an Attractive Bet Amid AI Disruption Concerns Soumya Eswaran Thu, September 3, 2026 at 9:15 AM EDT 3 min read DASH Artisan Partners , an investment management company, released its second-quarter 2026 investor commentary for the \"Artisan Global Opportunities Strategy\". The letter can be downloaded here . Global equities rebounded sharply during the quarter, with the MSCI ACWI Index returning 15.3% as resilient economic growth, strong corporate earnings, _topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Better AI Infrastructure Stock: Nvidia vs. AMD", "full_content": "Skip to navigation Skip to main content Skip to right column Better AI Infrastructure Stock: Nvidia vs. AMD Chris Neiger, The Motley Fool Thu, September 3, 2026 at 9:06 AM EDT 5 min read NVDA AMD Artificial intelligence (AI) spending shows no signs of slowing as tech companies compete to offer the best AI models and sell advanced computing services to their customers. The latest estimates put AI data center infrastructure spending at around $750 billion this year and more than $1 trillion next year .\n\nTwo of the undisputed winners in this market are chip companies Nvidia (NASDAQ: NVDA) and Advanced Micro Devices (NASDAQ: AMD). Over the past three years, their share prices have soared 341% and 334%, respectively.\n\nMissed Nvidia in 2009? This Rare Signal Is Flashing Again. In 2009, a \"Double Down\" signal flashed for a little-known chipmaker called Nvidia. For the first time in years, that same \"Total Conviction\" signal is flashing for a company 1/100th the size of Nvidia. Continue \u00bb\n\nBut which company is the better AI infrastructure stock to own over the long term? Both stocks are worth owning, but Nvidia is likely the best. Here's why.\n\nAMD designs both graphics processing units (GPUs) and central processing units (CPUs). GPUs have been the backbone of the AI data center infrastructure build-out, benefiting AMD and its rival Nvidia. AMD's data center revenue more than doubled in the most recent quarter to $6.7 billion.\n\nAnd the company is beginning to tap into new demand for CPUs, too. As more tech companies focus on building out AI agents, demand for CPUs -- which are well-suited to processing agentic tasks -- will increase in the coming years.\n\nRaymond James analyst Simon Leopold thinks the CPU market could reach $201 billion by 2030, and AMD's management recently said its total addressable market for CPUs will be $220 billion that year.\n\nWhichever estimate is more accurate, AMD is already benefiting from the increased demand.", "source": "Yahoo Finance", "pub_date_str": "03 Sep 2026, 06:36 PM IST", "pub_date_relative": "28m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Leon Black sues House Oversight over Epstein probe subpoenas, won't appear Thursday", "full_content": "Former Apollo Global Management CEO Leon Black sued the House Oversight and Government Reform Committee on Thursday seeking to block two subpoenas issued to him for nondisclosure agreements in connection with its investigation of his ties to notorious sex offender Jeffrey Epstein .\n\nBlack was due to appear before the Oversight committee on Thursday morning but is refusing to do so, according to his lawyers. A top Democrat on the panel called on it to formally hold Black in contempt.\n\nBlack's attorneys say the NDAs being sought by the panel have nothing to do with his dealings with Epstein.\n\n\"The Committee is on a fishing expedition that oversteps its authority,\" one of the lawyers, Susan Estrich, said in a statement. \"This is no longer about finding the truth about Epstein. It is about trying to destroy Mr. Black.\"\n\nThe lawsuit in U.S. District Court in Washington claims the two subpoenas issued to Black are \"invalid to the extent they exceed OGR's delegated authority in seeking private information that bears no legitimate connection to OGR's legislative purpose.\"\n\n\"Additionally, the subpoenas would also expose women who value their privacy, who have no known or public connection to Epstein, who bargained for confidentiality and have refused to release it, and who have no ability to protect themselves and their privacy before the Committee,\" the suit says.\n\nRep. Robert Garcia of California, the ranking Democrat on the panel, said in a statement, \"By refusing to testify today, Leon Black is now defying two Congressional subpoenas. Black gave Jeffrey Epstein over $180 million over six years.\"\n\nBlack in June refused to answer the panel's questions when he appeared in person behind closed doors before the committee.", "source": "CNBC Top News", "pub_date_str": "03 Sep 2026, 06:35 PM IST", "pub_date_relative": "28m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Snowflake stock skyrockets on AI-driven Q2 revenue jump", "full_content": "Skip to navigation Skip to main content Skip to right column Snowflake stock skyrockets on AI-driven Q2 revenue jump Ines Ferr\u00e9 \u00b7 Senior Business Reporter Thu, September 3, 2026 at 9:05 AM EDT 1 min read SNOW What happened: Snowflake ( SNOW ) stock surged as much as 20% in premarket trading on Thursday.\n\nWhat's behind the move: The cloud-based software company posted a blowout second quarter with revenue surging 35% to $1.55 billion.\n\nSnowflake CEO Sridhar Ramaswamy noted that customers using AI on Snowflake consume more across the data platform, creating a structural multiplier for the business.\n\n\"Together, these dynamics show how the agentic enterprise has created a powerful flywheel across our business, and that flywheel is accelerating,\" he said during the company's earnings call on Wednesday afternoon.\n\nSnowflake reported adjusted earnings per share of $0.62 for its fiscal 2027 second quarter.\n\nWhat else you need to know: Snowflake has been benefiting from companies adopting AI. Its customers are not only storing their data on the platform but also using it to power their artificial intelligence projects.\n\nDuring the earnings call, management noted that AI products accounted for roughly half of the acceleration in growth this quarter. Tools such as Cortex, an AI coding assistant, and enterprise chatbot CoWork saw rapid customer adoption.\n\nClick here for the latest technology news that will impact the stock market", "source": "Yahoo Finance", "pub_date_str": "03 Sep 2026, 06:35 PM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Schwab Imposes Stricter Limits on Tax-Aware Long-Short Accounts", "full_content": "Skip to navigation Skip to main content Skip to right column Schwab Imposes Stricter Limits on Tax-Aware Long-Short Accounts Paige Smith Thu, September 3, 2026 at 9:02 AM EDT 2 min read SCHW You can find original article here WealthManagement . Subscribe to our free daily WealthManagement newsletters .\n\n(Bloomberg) -- Charles Schwab Corp. is imposing even stricter limits for customers interested in tax-aware long-short accounts, at least the third time the retail brokerage has done so, according to a note distributed to clients.\n\nSchwab clients will now have to have a minimum of $10 million of assets to fund some long-short separately managed accounts, an increase from $1 million, according to the note, which was sent to clients and obtained by Bloomberg on Wednesday. The firm also said it won't enroll new clients or accept new funds in portfolio margin accounts, which use greater leverage.\n\nIt's the latest in a series of moves that highlight the risks and concerns around one of the most popular trades on Wall Street. Over the past three years, legions of affluent Americans have flocked to tax-aware long-short accounts, a complex strategy that typically involves betting both on and against companies to generate losses that help investors slash capital-gains levies.\n\nSchwab and rival Fidelity Investments, the two major firms that were facilitating the strategy, have both pulled back recently amid concerns over unprecedented growth in the convoluted trades.\n\nWhile Schwab had already twice buckled down on who can open new accounts and placed borrowing and other limits on tax-aware investing, Fidelity has taken more drastic measures by indefinitely pausing onboarding of new clients.\n\nRead More: Schwab, Fidelity Turn Down Billions From Ultra-Rich Tax Strategy\n\n\"We regularly review our platform requirements to ensure we can effectively serve advisers and their clients across the full range of capabilities they rely on,\" a Schwab spokesperson said in an emailed statement.", "source": "Yahoo Finance", "pub_date_str": "03 Sep 2026, 06:32 PM IST", "pub_date_relative": "32m ago", "cfa_topics": ["Corporate Issuers", "Portfolio Management"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Polestar Automotive Holding UK Q2 Earnings Call Highlights", "full_content": "Skip to navigation Skip to main content Skip to right column Polestar Automotive Holding UK Q2 Earnings Call Highlights MarketBeat Thu, September 3, 2026 at 9:02 AM EDT 7 min read PSNY Key Points Interested in Polestar Automotive Holding UK PLC? Here are five stocks we like better.\n\nRecord sales but lower outlook: Polestar sold 30,423 vehicles in the first half of 2026, supported by the Polestar 4 and expanded retail network, but cut its full-year forecast to low- to mid-single-digit volume growth amid pricing pressure and intensifying EV competition.\n\nU.S. regulatory setback: The company will not appeal the U.S. decision barring model-year 2027 vehicle sales, and expects about $130 million in restructuring-related adjustments, with potentially more costs to come.\n\nLosses narrowed while liquidity remained pressured: First-half revenue fell 4% to $1.36 billion, but operating and net losses improved year over year. Polestar ended June with $888 million in cash after $850 million of operating cash outflow, while shareholder debt conversions and reduced capital spending supported its funding position.\n\nThese 2 Big Players Are Set to Compete With Elon Musk's Starlink\n\nPolestar Automotive Holding UK (NASDAQ:PSNY) reported record first-half retail sales as it expanded its retailer-led sales model and increased contributions from its Polestar 4 model, though the electric-vehicle maker lowered its full-year volume outlook amid pricing pressure, regulatory challenges in the U.S. and broader market competition.\n\nChief Executive Officer Michael Lohscheller said Polestar recorded retail sales of 30,423 vehicles in the first half of 2026. The company now expects low- to mid-single-digit volume growth for the full year, revising its outlook to reflect market pressure and portfolio changes.\n\n\u2192 AST SpaceMobile Is Down 54%\u2014Can FCC Progress and BlueBirds Reverse the Slide?", "source": "Yahoo Finance", "pub_date_str": "03 Sep 2026, 06:32 PM IST", "pub_date_relative": "32m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Major Drilling Group International Q1 Earnings Call Highlights", "full_content": "Skip to navigation Skip to main content Skip to right column Major Drilling Group International Q1 Earnings Call Highlights MarketBeat Thu, September 3, 2026 at 9:02 AM EDT 6 min read MDI.TO MDI Key Points Interested in Major Drilling Group International Inc.? Here are five stocks we like better.\n\nRecord fiscal Q1 performance: Revenue rose 22% year over year to CAD 277.3 million, while net earnings increased nearly 44% to CAD 14.5 million. Growth was broad-based across all regions, led by a more than 31% increase in Canada and the U.S.\n\nDemand remains strong but costs weigh on margins: Adjusted gross margin improved sequentially to 24% as pricing strengthened, though training, labor, consumable and contract ramp-up costs kept margins below the prior-year level. Management expects margins to improve more slowly than revenue.\n\nExpansion continues amid labor constraints: Major Drilling added five rigs, retired 10 older units and ended the quarter with 683 rigs. Management expects further deployment at higher prices as senior and junior customers increase exploration spending, but identified experienced driller availability as the primary industry constraint.\n\nMajor Drilling Group International (TSE:MDI) reported a record first quarter for fiscal 2027, with revenue rising 22% year over year as drilling activity increased across all operating regions and the company deployed additional rigs to meet customer demand.\n\nRevenue reached CAD 277.3 million, compared with CAD 226.6 million in the prior-year period. President and CEO Denis Larocque said the quarterly result represented a new company record and reflected \"meaningful year-over-year revenue growth\" in every region.", "source": "Yahoo Finance", "pub_date_str": "03 Sep 2026, 06:32 PM IST", "pub_date_relative": "32m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Hello Group Q2 Earnings Call Highlights", "full_content": "Skip to navigation Skip to main content Skip to right column Hello Group Q2 Earnings Call Highlights MarketBeat Thu, September 3, 2026 at 9:02 AM EDT 7 min read MOMO Key Points Interested in Hello Group Inc. Sponsored ADR? Here are five stocks we like better.\n\nSecond-quarter revenue fell 5% year over year to RMB2.49 billion , while non-GAAP net income recovered to RMB273.9 million from a loss a year earlier. Profitability weakened, with the adjusted operating margin declining to 11.1%.\n\nDomestic revenue dropped 17% amid tax scrutiny affecting agencies and broadcasters and reduced spending by high-value livestreaming users. Tantan's revenue also declined, though its user base stabilized and the company is adding payment options and AI-powered features.\n\nOverseas revenue surged 52% to RMB673 million , reaching 27% of total revenue, led by newer Middle East and North Africa products. Hello Group lowered its outlook, now expecting full-year revenue to decline at a mid-single-digit rate and acknowledging its RMB3 billion overseas revenue target may be missed.\n\nHello Group (NASDAQ:MOMO) reported second-quarter 2026 revenue of RMB2.49 billion, down 5% from a year earlier but up 4% sequentially, as growth in overseas operations partly offset continued pressure in its domestic business.\n\nNon-GAAP net income attributable to shareholders totaled RMB273.9 million, compared with a RMB96 million loss in the prior-year period and RMB328.8 million in the first quarter. Non-GAAP operating income was RMB276.1 million, producing an 11.1% operating margin, down from RMB447.7 million and a 17.1% margin a year earlier.\n\n\u2192 AST SpaceMobile Is Down 54%\u2014Can FCC Progress and BlueBirds Reverse the Slide?\n\nChief Operating Officer Jianhua Wen said domestic revenue was RMB1.81 billion, down 17% year over year and up 1% from the prior quarter. Momo's revenue was RMB1.54 billion, declining 16% year over year but increasing 2% sequentially.", "source": "Yahoo Finance", "pub_date_str": "03 Sep 2026, 06:32 PM IST", "pub_date_relative": "32m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Nvidia Buys Hugging Face in $12.9 Billion Deal - The New York Times", "full_content": "Nvidia Buys Hugging Face in $12.9 Billion Deal The New York Times Nvidia Agrees to $13 Billion Deal for AI Platform Hugging Face Bloomberg.com Nvidia\u2019s Hugging Face Acquisition Is a $12.9 Billion     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
