mains there, ahead of ChatGPT. However, Amazon is among the companies that have blocked Meta's agents, citing worries of website scraping.\n\nAmazon also blocked Perplexity's AI agent and sued the startup in November, alleging the company took steps to \"conceal\" its AI agents so they could continue to scrape Amazon's website without approval. Perplexity called the lawsuit a \"bully tactic.\"\n\nFor the new standard, Taylor compared it with the experience of logging into other websites with Google or Facebook credentials, technology he worked on when he was tech chief at Facebook.", "source": "CNBC World Economy", "pub_date_str": "07 Oct 2026, 12:18 AM IST", "pub_date_relative": "9m ago"}, {"title": "IMF says hedge funds\u2019 market footprint growing, merits closer scrutiny", "full_content": "", "source": "Investing.com News", "pub_date_str": "07 Oct 2026, 12:18 AM IST", "pub_date_relative": "9m ago"}, {"title": "Farmers say no to early sugarcane crushing, demand compensation and higher sugar, ethanol prices first", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Agriculture \u203a Farmers say no to early sugarcane crushing, demand compensation and higher sugar, ethanol prices first The Economic Times daily newspaper is available online now. Read Today's Paper Farmers say no to early sugarcane crushing, demand compensation and higher sugar, ethanol prices first SECTIONS Farmers say no to early sugarcane crushing, demand compensation and higher sugar, ethanol prices first By Jayashree Bhosale , ET Bureau Last Updated: Oct 07, 2026, 12:16:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Farmers' organizations in Maharashtra and Karnataka are resisting the government's early sugarcane crushing proposal. They demand compensation for low recovery and higher prices for sugar and ethanol. A meeting with Union Food Minister Pralhad Joshi has been scheduled to discuss these concerns. Crushing immature sugarcane may lead to substantial financial losses for both farmers and sugar mills.\n\nThe world is witnessing a bond rout. Why should it matter to you?\n\nQ2 earnings season: Will it settle or add to confusion in the stock market?\n\nHow Sebi busted Growpital\u2019s \u2018assured\u2019 returns, LLPs and money trail\n\nA for apple, Y for yak and, for the first time, a price next to it. Will this change the non-agri part of the rural economy?\n\nSix months after oil spiked, why are markets reacting so sharply now?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers", "source": "Economic Times Economy", "pub_date_str": "07 Oct 2026, 12:16 AM IST", "pub_date_relative": "10m ago"}, {"title": "How event contract bundles are boosting volume on prediction markets", "full_content": "The growing popularity of a combo contracts on prediction markets is leading to soaring volumes, even as they makes up only a small amount of total activity on the platforms.\n\nCombos, or multiple contracts stacked together that only pay out if all of them win \u2014 similar to parlays on traditional sportsbooks \u2014 have exploded in popularity.\n\nLast month, combos accounted for more than 50% of notional volume on Kalshi , driven by the start of the NFL season . Combos are overwhelmingly made up of combinations of multiple sports contracts.\n\nAs rival Polymarket worked to expand its U.S. exchange this year, combos were a priority following the domestic platform's official launch in May . Combos are now nearly 50% of daily volume on Polymarket U.S., helped by growth during the NFL season.\n\nBut while combos hold a large share of volume, they actually aren't where most speculators on prediction markets execute their trades. That's because of how the Commodity Futures Trading Commission , the federal regulator overseeing prediction markets, requires exchanges to report volume.\n\nThe multi-leg contracts are \"helping [Polymarket and Kalshi] claim a higher number with lower realistic cash output,\" said Chris Park, a researcher and founder of MSR Decode, a research firm analyzing prediction market data.\n\nWhen a trader places a trade on a prediction market, no matter the cash they put down, platforms measure it as $1 of notional volume. All event contracts have binary outcomes between $0 to $1, and no matter what price a speculator pays to place a trade, someone has to take the other side of that order and make $1 in total volume.\n\nBut combos can have payouts that are much greater than $1, meaning someone can put very little money down, pennies in some cases, and it will be measured as potentially thousands of dollars in volume thanks to the market makers who take the other side of these high-payout trades.", "source": "CNBC Finance", "pub_date_str": "07 Oct 2026, 12:16 AM IST", "pub_date_relative": "11m ago"}, {"title": "US appeals court weighs block on Kennedy\u2019s vaccine panel appointments", "full_content": "", "source": "Investing.com News", "pub_date_str": "07 Oct 2026, 12:12 AM IST", "pub_date_relative": "15m ago"}, {"title": "Best student loans for nursing school", "full_content": "Federal student loans are an important source of funding for nursing school, but they may not cover the full cost. That's especially relevant for graduate and professional nursing students following federal loan changes that took effect July 1, 2026. New borrowing limits are now in place, and most new graduate and professional students can no longer use Grad PLUS Loans to borrow up to the full cost of attendance.\n\nFor eligible professional students, federal Direct Unsubsidized Loans are generally capped at $50,000 per year and $200,000 in aggregate, although certain health-professions programs have additional rules and exceptions. If your nursing program costs more than your available federal aid, you may need another way to cover the remaining balance.\n\nThat's where private student loans come in. Private lenders can provide additional funding when federal loans and other resources don't cover your total education costs. However, private loans generally don't offer the same federal protections and benefits, so it's important to compare rates, fees, repayment terms and borrower protections before taking one out.\n\nBelow, we rounded up some of the best private student loans for nursing school. Note that eligibility may depend on your specific nursing program and school. You can read our methodology below.\n\nOffers in this section are from affiliate partners and selected based on a combination of engagement, product relevance, compensation, and consistent availability.\n\nUndergraduate and graduate students, parents, students in MBA, law, health professional and dental programs\n\n$5,000 (or state-mandated minimum) up to the cost of attendance\n\nUndergraduate, graduate, Master's, PhD, MBA, law school, medical school, health professions, dental school, medical and dental residency loans, bar study loans.", "source": "CNBC Top News", "pub_date_str": "07 Oct 2026, 12:11 AM IST", "pub_date_relative": "16m ago"}, {"title": "Kalshi, Polymarket trading volumes on some products raise questions amid massive growth", "full_content": "Trading volumes for certain products on prediction market platforms Kalshi and Polymarket are raising questions from some industry observers, who fear the numbers may be inflated.\n\nOn Polymarket, observers have flagged a quirk on the company's international exchange, which is not overseen by U.S. regulators: Markets that feature multiple contracts will see greater activity on those with lower odds of occurring versus those with higher probabilities. It's seen on markets related to elections, sports and central bank decisions.\n\nMeanwhile, a user on X on Sept. 20 flagged a strange pattern on Kalshi's perpetual futures market for the ether cryptocurrency. Trades of around $5,500 made up a large share of transactions on the contracts, and that 24-hour trading volume was abnormally high compared with actual resting liquidity. A CNBC analysis found that on Sept. 20, nearly half of the dollar volume traded on Kalshi's ether perpetuals came from trades sized between $5,495 and $5,505.\n\nBoth developments create concerns among some observers that the companies are overseeing inflated volumes or, at worst, are experiencing wash trading, in which traders collude to buy and sell an asset to create a false sense of economic activity.\n\nBoth Kalshi and Polymarket deny wash trading occurs on any of their products. They also deny that the respective patterns represent inorganic activity.\n\nA designated contract market, the type of exchange prediction markets are, \"has a duty to protect market integrity by monitoring market conditions, price movements, and volumes in real time for abnormalities,\" said Tamika Bent, a partner at K&L Gates. While she said the patterns described here don't alone establish misconduct by an exchange, she added observers would \"expect DCMs to be surveilling unusual volume and looking into any signs of market disruption.\"\n\nPolymarket is currently raising at a valuation north of $20 billion in the private market after the launch of its U.S.", "source": "CNBC Finance", "pub_date_str": "07 Oct 2026, 12:11 AM IST", "pub_date_relative": "16m ago"}, {"title": "Oil prices stable as market weighs supply risks, rising Middle East exports", "full_content": "Oil prices were steady on Tuesday after recovering earlier losses, as the market weighed increases in Middle Eastern crude exports and a planned \u200cGroup of Seven release of emergency diesel and crude stockpiles against supply concerns related to attacks by the Iran-backed Houthis in Yemen.\n\nBrent futures were up 44 cents at $100.76 a barrel at 2:34 p.m. ET, while US West Texas Intermediate (WTI) crude rose 1 cent to settle at $89.44.\n\n\"The price of the global crude benchmark, Brent, is once \u200bagain toiling around $100/barrel, as its reasons for trading much beyond the psychological 3-digit mark are being eroded ... for now the assumption of more crude getting through has \u200bdampened price fervour,\" said John Evans, an analyst at oil broker PVM.\n\nAround 12 million barrels per day of crude oil and 2 million \u2060bpd of refined products \u2014 volumes needed to dampen price pressure \u2014 have left the Middle East on tankers in the last seven to 10 days, the CEO of commodity trading giant \u200bVitol said on Tuesday.\n\nSaudi Energy Minister Prince Abdulaziz bin Salman said on Tuesday that oil pumped through the East-West Pipeline, which runs to the kingdom's Red Sea export hub of \u200bYanbu, had reached 5.8 million barrels as of Tuesday morning.\n\nOil price declines, however, have been limited by the possibility of further Middle East supply disruptions.\n\nSaudi Arabia's airports in Jazan and Najran were targeted in two attacks on Monday evening, injuring three people and causing limited damage, the Saudi aviation authority said, as hostilities between the kingdom and Yemen's Iran-backed Houthis escalated.\n\nThe attacks occurred as Saudi-backed Yemeni government forces pressed \u200ba major offensive to retake territory from the Houthis, after weeks of rebel advances, with Riyadh stepping up airstrikes in support of the campaign.", "source": "CNBC Top News", "pub_date_str": "07 Oct 2026, 12:11 AM IST", "pub_date_relative": "16m ago"}, {"title": "Boomers' dividend stocks take beating as bond yields rise, with retirement income on the line", "full_content": "Dividend stocks like utilities are being pummeled amid bond market chaos and the rise of the 10-year U.S. treasury , raising questions for seniors about how to continue meeting their income needs.\n\nWhile dividend stocks are only part of a diversified portfolio for older investors, many boomers often depend on dividend stocks and funds for at least some of their income. When returns are rocky, it can, understandably, cause some consternation.\n\nMany dividend funds are giving back some of their gains from earlier in the year when bond rates were lower, said Timothy Chubb, chief investment officer at Girard, a Univest Wealth Division, in King of Prussia, Pennsylvania.\n\nSectors including real estate, utilities, and materials have seen stock prices plummet as bond yields become more attractive and dividend stock yields less attractive on a relative risk-reward basis. For all the concern about bonds, inflows into bond ETFs have been rising. Consider the iShares 20+ Year Treasury ETF ( TLT ): it has taken in over $3.2 billion in net inflows from investors over the past month, according to ETFAction.com.\n\nTo be sure, there is a split in the market between investors who continue to pile into ultrashort bond funds, which had record inflows near $20 billion in September, according to Morningstar. And those investors making a bet that the worst in the bond market is over and the yields are too attractive to pass up. TLT's inflows were its largest monthly inflows on record as its yield hit the highest since 2002, according to Dow Jones data.\n\nBoomers, however, shouldn't necessarily give up on dividend-paying stocks. Instead, they should consider several strategies that can blunt the impact of rising bond yields on their income-stock portfolios.", "source": "CNBC Top News", "pub_date_str": "07 Oct 2026, 12:11 AM IST", "pub_date_relative": "16m ago"}, {"title": "\u2018Trump accounts\u2019 could force MAGA children to own New York Times stock", "full_content": "This is going to bring a lot of problems that almost anyone could have predicted", "source": "MarketWatch Top Stories", "pub_date_str": "07 Oct 2026, 12:09 AM IST", "pub_date_relative": "18m ago"}, {"title": "Why is Twist Bioscience stock plunging today?", "full_content": "", "source": "Investing.com News", "pub_date_str": "07 Oct 2026, 12:06 AM IST", "pub_date_relative": "21m ago"}, {"title": "Sinclair launches national news subscription service", "full_content": "", "source": "Investing.com News", "pub_date_str": "07 Oct 2026, 12:06 AM IST", "pub_date_relative": "21m ago"}, {"title": "Kalshi launches transparency features on its election contracts ahead of midterms", "full_content": "With less than a month until midterms, Kalshi is launching three features on its election contracts to ensure traders have more transparency on how active and accurate its markets are.\n\nFirst, the platform will provide tags that indicate which election markets are low volume, which Kalshi defines as those with less than $10,000. Prediction markets experts have warned prices in low-volume markets can fluctuate widely, while spreads between buying and selling can stretch.\n\nSecond, Kalshi's own election markets will have Brier scores, which will measure the accuracy of the market's probabilities versus actual outcomes.\n\nFinally, the platform is launching an activity feeds feature, where it shows individual trades happening on election contracts live.\n\nKalshi decided to provide these transparency features after noting election traders were participating on markets covering local races over national ones. Kalshi's co-founder and CEO Tarek Mansour called the midterms the \"first meaningful prediction market election,\" noting the platform's election markets have grown six times faster than football markets this year, compared to the year before.\n\nKalshi's internal data also indicates that more people are viewing their midterm markets than those who are trading by a ratio of five to one.\n\nIn July, the prediction markets platform released a \"Midterms Hub,\" which allows anyone to view traders' odds on markets tied to U.S. Senate and House of Representatives races.\n\nDisclosure: CNBC and Kalshi have a commercial relationship that includes customer acquisition and a minority investment.", "source": "CNBC Top News", "pub_date_str": "07 Oct 2026, 12:04 AM IST", "pub_date_relative": "23m ago"}, {"title": "Why is Capital Power stock rallying today?", "full_content": "", "source": "Investing.com News", "pub_date_str": "07 Oct 2026, 12:03 AM IST", "pub_date_relative": "24m ago"}, {"title": "Copart stock hits 52-week low at 26.72 USD", "full_content": "", "source": "Investing.com News", "pub_date_str": "07 Oct 2026, 12:01 AM IST", "pub_date_relative": "26m ago"}, {"title": "My wife never went back to work after raising our kids. Do I have to share my retirement savings 50/50?", "full_content": "\u201cFor 14 years I have gotten up every morning and gone to work while she has been free to pursue whatever interested her.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "07 Oct 2026, 12:00 AM IST", "pub_date_relative": "27m ago"}, {"title": "FAA proposes new rules to modernize space launch regulations", "full_content": "", "source": "Investing.com News", "pub_date_str": "06 Oct 2026, 11:58 PM IST", "pub_date_relative": "29m ago"}, {"title": "Gold industry expects price rise to $5,013 an ounce over 12 months", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Commodities \u203a Gold industry expects price rise to $5,013 an ounce over 12 months The Economic Times daily newspaper is available online now. Read Today's Paper Gold industry expects price rise to $5,013 an ounce over 12 months SECTIONS Gold industry expects price rise to $5,013 an ounce over 12 months Reuters Last Updated: Oct 06, 2026, 11:57:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Gold prices are set to soar to $5,013 per ounce in the next year, while silver is expected to jump from $61 to $97 per ounce. In addition, LBMA officials foresee platinum prices climbing to $1,914 an ounce and palladium rising to $1,415. This outlook occurs against a backdrop of rising interest rate worries and geopolitical strains that continue to shape the market landscape.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "06 Oct 2026, 11:57 PM IST", "pub_date_relative": "30m ago"}, {"title": "Why is Illumina stock sliding today?", "full_content": "", "source": "Investing.com News", "pub_date_str": "06 Oct 2026, 11:56 PM IST", "pub_date_relative": "31m ago"}, {"title": "Marvell just impressed Wall Street with \u2018good numbers plus a better story\u2019", "full_content": "Marvell\u2019s stock is popping after the company not only delivered with its financial forecasts but also demonstrated its diversified mix of customers and products.", "source": "MarketWatch Top Stories", "pub_date_str": "06 Oct 2026, 11:55 PM IST", "pub_date_relative": "32m ago"}, {"title": "14+ deals actually worth shopping during the Walmart Deals event - NBC News", "full_content": "14+ deals actually worth shopping during the Walmart Deals event NBC News Walmart Deals start now: We're eyeing 25+ discounts that rival October Prime Day Yahoo The 13 Best Deals From Walmart\u2019s Fall Sales Event The New York Times Walmart Fall Deals 2026: Best deals on headphones, TVs, Legos, and more Mashable Walmart has up to 50% off Dyson, Samsung and more. Here are my favorite finds CNN", "source": "Google News Business", "pub_date_str": "06 Oct 2026, 11:54 PM IST", "pub_date_relative": "33m ago"}, {"title": "US EIA lifts Brent forecast to $98 as Iran war tightens global supplies", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a US EIA lifts Brent forecast to $98 as Iran war tightens global supplies Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US EIA lifts Brent forecast to $98 as Iran war tightens global supplies SECTIONS US EIA lifts Brent forecast to $98 as Iran war tightens global supplies ETMarkets.com Last Updated: Oct 06, 2026, 11:52:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The US Energy Information Administration has revised its oil price forecasts for the coming years due to supply issues. Global benchmark Brent crude is expected to average approximately $98 a barrel in 2026. Retail diesel prices are projected to remain high initially before gradually declining to around $4.50 in 2027. Improvements in Middle Eastern oil production are anticipated as transit routes become safer and more efficient.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "06 Oct 2026, 11:52 PM IST", "pub_date_relative": "34m ago"}, {"title": "Stocks making the biggest moves midday: Marvell, Moderna, Lamb Weston, Constellation Energy & more", "full_content": "Here are some of the companies making headlines in midday trading.", "source": "CNBC Top News", "pub_date_str": "06 Oct 2026, 11:52 PM IST", "pub_date_relative": "35m ago"}, {"title": "Govt airs new ad after Trump says MAGA Inc. PAC will pay for controversial TV spots", "full_content": "President Donald Trump said Monday evening that he and his political action committee will pay for controversial television ads that praised him, and which reportedly were funded from up to $20 million set aside by the U.S. Department of Homeland Security .\n\nThe White House later clarified that the super PAC \u2014 MAGA Inc. \u2014 will pay for what it calls public service ads moving forward, and not for the ads that have already aired.\n\nTrump's announcement came after continued backlash to the ads, which have run in the weeks leading up to November's midterm election . Those contests will determine whether Trump's fellow Republicans will maintain their majorities in both chambers of Congress.\n\nOn Tuesday a new ad paid for by the U.S. government began airing. It features clips of Trump, Secretary of State Marco Rubio and Defense Secretary Pete Hegseth discussing the U.S. capture of Venezuelan leader Nicol\u00e1s Maduro earlier this year.\n\n\"Nicol\u00e1s Maduro had his chance ... until he didn't,\" Hegseth says in the ad. \"He effed around and he found out.\"\n\nAnother clip shows Rubio warning, \"Don't play games with [President Trump] in office.\"\n\nThe White House and MAGA Inc. did not immediately reply to CNBC's requests for comment on whether the super PAC would cover the cost of the new ad or whether the buy had already been placed before Trump's announcement and would remain taxpayer-funded.\n\nCritics say the ads mirror Republican campaign talking points. Another ads features images of Trump saying \"America will never be a communist country.\"", "source": "CNBC Top News", "pub_date_str": "06 Oct 2026, 11:52 PM IST", "pub_date_relative": "35m ago"}, {"title": "How Meta\u2019s stock can surge to $1,000, according to the biggest bull on Wall Street", "full_content": "A Wells Fargo analyst warns of a near-term profit hit from AI infrastructure spending and legal costs \u2014 but thinks that will set up massive gains by 2028.", "source": "MarketWatch Top Stories", "pub_date_str": "06 Oct 2026, 11:50 PM IST", "pub_date_relative": "37m ago"}, {"title": "RBI 25-bps rate hike or status quo: What should mutual fund investors do after the policy announcement? Expert explains", "full_content": "On October 7 (Wednesday), the Reserve Bank of India ( RBI ) is expected to deliver its first repo rate hike in nearly 3.5 years, since February 2023. A Reuters poll showed 35 of 61 economists expect a 25-basis-point hike, which would take the repo rate from 5.25% to 5.50%.\n\nHere\u2019s what investors should do after the RBI\u2019s monetary policy announcement. Experts suggest mutual fund portfolio strategies for both a 25-bps rate hike and a status quo.\n\nManish P. Hingar, Founder and Chief Executive Officer of Fintoo, said equity can be left alone. Keep the SIPs running and don't sell because of one rate decision. Rebalancing may be considered if equity allocation moves more than about 5% from the target.\n\nThe key question is whether the hike marks the start of a cycle, with some forecasts seeing rates at 5.75%-6% in FY27. Harsha Vardhana VM, Founder-Group CEO, Atom Financial Services, said this calls for measured adjustments, with debt needing the most attention. Investors in gilt or long-duration funds with short-term goals could shift towards low-duration, money-market or floating-rate funds, while those with three-year-plus horizons can stay with medium-duration funds.\n\nSouvik Biswas, Head of Research at Bajaj Capital, said arbitrage funds can be a better diversifier during rate-hike cycles, with new investments considered in arbitrage funds instead of other debt funds.\n\nIn equities, Piyush Jhunjhunwala, Founder and CEO of Stockify, said investors can reduce exposure to highly leveraged companies and rate-sensitive sectors such as real estate, automobiles and some financial segments.\n\nVardhana VM said higher borrowing costs could pressure heavily indebted companies and sectors such as real estate, autos and lending. For mutual fund investors, this means leaning on large-cap, flexi-cap or large and midcap funds for stability.", "source": "LiveMint Money", "pub_date_str": "06 Oct 2026, 11:48 PM IST", "pub_date_relative": "39m ago"}, {"title": "Young voters struggle to afford housing. But they don't expect help from political candidates", "full_content": "ALLENTOWN, Pa. \u2014 Mortgage rates are climbing sharply , home prices continue to gain and inflation in the broader economy is hitting consumers, leading housing affordability to weigh heavily on both renters and potential homebuyers.\n\nIn Pennsylvania \u2014 a swing state where House races could help decide control of the next U.S. Congress \u2014 renting or owning a home is cheaper than the national average, but the share of income needed to do either has also risen along with the rest of the country. In 2019, it took 20% of the median income to rent a home and 18% to own. Today it's 22% and 24%, respectively, according to Cotality.\n\n\"For that person trying to get an apartment, person moving from an apartment to a starter home, starter home to a larger home, each and every one of those cohorts is reporting that it's a challenge right now, and it's something that is weighing on them in a very important political place,\" Lehigh University political science professor Christopher Borick said.\n\nAmericans, especially renters, feel financially stretched by housing costs, according to a new CNBC and SurveyMonkey Quarterly Money Survey , released Oct. 5. It found one in five Americans who rent or have a mortgage spend at least half of their pre-tax income on housing, while 49% spend between 25% and 49%. Standard guidelines from banks and lenders say consumers should spend 28% to 30% of their income on housing.\n\nThe cost of housing is now the top political issue \u2014 even higher than the cost of food or protecting democracy \u2014 among U.S. voters aged 18 to 34, according to the most recent CNBC All-America Economic survey .\n\nGoing into the midterm election , the average rate on the popular 30-year fixed mortgage has jumped well over 7.5%, according to Mortgage News Daily. It hit a low of 5.99% days before the war with Iran started.", "source": "CNBC Top News", "pub_date_str": "06 Oct 2026, 11:41 PM IST", "pub_date_relative": "46m ago"}, {"title": "Gujarat Natural Resources sets November 5 as record date for the first-ever stock split. Details here", "full_content": "Gujarat Natural Resources , which is largely held by retail shareholders, announced the record date for its proposed stock split in a market regulatory filing on Tuesday. The company, which is engaged in the business of oil and gas exploration and trading of goods, has fixed Thursday, November 5, 2026, as the record date.\n\nThe record date will determine which shareholders are eligible for the proposed 1:10 stock split. Under the plan, each fully paid-up equity share with a face value of \u20b9 10 will be subdivided into 10 equity shares with a face value of Re 1 each.\n\nThe record date follows after the shareholders of the company, at the Annual General Meeting held on Wednesday, approved the split.\n\n\"Accordingly, 1 (one) equity share of the company having a face value of Rs. 10/- each shall be subdivided/split into 10 (ten) equity shares of the company having a face value of Re. 1/- each, fully paid-up, ranking pari-passu in all respects,\" the company said in its filing.\n\nGujarat Natural Resources Ltd is an upstream oil and gas explorer. It operates through subsidiaries and step-down subsidiaries. Its step-down subsidiary, GNRL Oil & Gas Limited (GOGL), has participating interests in six producing blocks in the Cambay Basin and is the operator in five of these blocks.\n\nThe portfolio comprises the Kanawara, North Kathana, Allora, Dholasan, North Balol, and Unawa fields. In FY26, the company, along with its then step-down subsidiary, GNRL Oil & Gas Limited (GOGL), continued to undertake drilling and development activities across its oil and gas fields in the Cambay Basin.\n\nThe company progressed with its seven-well drilling campaign, including development and appraisal-cum-development drilling in the Kanawara field and drilling activities in the North Kathana field.", "source": "LiveMint Markets", "pub_date_str": "06 Oct 2026, 11:37 PM IST", "pub_date_relative": "50m ago"}, {"title": "Anthropic expands Claude Startups program in bid to snag founders and fast-growing companies", "full_content": "Anthropic on Tuesday announced it's expanding its Claude Startups program, the artificial intelligence lab's latest push to deepen its ties to founders and fast-growing companies.\n\nClaude Startups initially launched in May, and thousands of companies are already participating, according to Anthropic. The company is opening up the program to more organizations, and members will get access to thousands of dollars' worth of Anthropic's Claude products and credits to help them build.\n\n\"Startups are often the first to push Claude to its limits,\" Beth Robertson, head of startups at Anthropic, told CNBC in a statement. \"When a new model ships, they're ready that same day to take on projects that used to seem out of reach. Claude Startups gives founders credits, tools and direct time with our team, so more companies can build this way from the start.\"\n\nThe vast majority of Anthropic's revenue comes from its business customers , and it has spent much of the last year trying to fend off rivals like OpenAI and Google , which both offer their own programs for startups.", "source": "CNBC World Economy", "pub_date_str": "06 Oct 2026, 11:36 PM IST", "pub_date_relative": "51m ago"}, {"title": "Fed plans bank-supervision overhaul to strengthen accountability, says Vice Chair Michelle Bowman", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a Fed plans bank-supervision overhaul to strengthen accountability, says Vice Chair Michelle Bowman Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Fed plans bank-supervision overhaul to strengthen accountability, says Vice Chair Michelle Bowman SECTIONS Fed plans bank-supervision overhaul to strengthen accountability, says Vice Chair Michelle Bowman By ETMarkets.com Last Updated: Oct 06, 2026, 11:35:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Federal Reserve is set to realign its bank supervision system for increased accountability and efficient decision-making. Five new geographic supervisory regions will be established, each led by a regional leader. This new structure aims to address concerns raised in an independent review of Silicon Valley Bank\u2019s collapse. The Fed will also reconsider asset thresholds for regulatory requirements to better align with inflation and economic growth.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "06 Oct 2026, 11:35 PM IST", "pub_date_relative": "52m ago"}, {"title": "Alito plans to stay on Supreme Court, even if Democrats regain Senate: Report", "full_content": "Supreme Court Justice Samuel Alito plans to remain on the court through at least next summer, even if Democrats regain majority control in the Senate from Republicans in November's midterm election , he said in a new report.\n\nBloomberg reported Tuesday that Alito, 76, has ruled out retiring during the brief lame-duck session of Congress after the election, when Republicans would still hold their Senate majority through early January even if they lose control for the next Congress.\n\nIf Democrats are the majority in the next Congress, they may block any Supreme Court nominee of President Donald Trump , a Republican.\n\n\"I intend to stick around through this term,\" Alito told Bloomberg, referring to the court's current term, which began Monday and which will end in late June or early July.\n\n\"I made that decision many months ago,\" said Alito, whose first book, \"So Ordered: An Originalist's View of the Constitution, the Court and Our Country,\" has just been published.\n\nAlito was nominated to the Supreme Court in 2005 by then-President George W. Bush, another Republican. Alito is one of six conservative justices on the nine-member court. Three of the other conservatives \u2014 Neil Gorsuch, Brett Kavanaugh and Amy Coney Barrett \u2014 were nominated by Trump.\n\nBloomberg reported that Alito, in the interview, acknowledged that the idea of retiring had crossed his mind.\n\nBut he also said, \"I don't feel mentally or physically decrepit,\" according to the news outlet.", "source": "CNBC Top News", "pub_date_str": "06 Oct 2026, 11:34 PM IST", "pub_date_relative": "53m ago"}, {"title": "My brother-in-law convinced his parents to sign over their home and life savings to buy a $3 million compound. Do I intervene?", "full_content": "\u201cBoth properties swill be solely in his name.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "06 Oct 2026, 11:31 PM IST", "pub_date_relative": "56m ago"}, {"title": "\u2018I don\u2019t want to die on the sales floor\u2019: I\u2019m 67 and earn $19.50 an hour at a big-box store. When can I finally retire?", "full_content": "\u201cI started taking Social Security at 66 and receive $2,410 a month. I have $214,000 in my 401(k).\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "06 Oct 2026, 11:30 PM IST", "pub_date_relative": "57m ago"}, {"title": "Stock Market Today: S&P 500 Hits New Record High - WSJ", "full_content": "Stock Market Today: S&P 500 Hits New Record High WSJ See more headlines & perspectives on Google News", "source": "Google News Business", "pub_date_str": "06 Oct 2026, 11:30 PM IST", "pub_date_relative": "57m ago"}, {"title": "America\u2019s renters are emerging as a political movement", "full_content": "Housing policy has long prioritized homeownership. As young Americans face the prospect of renting indefinitely, more tenants are seeking political clout.", "source": "MarketWatch Top Stories", "pub_date_str": "06 Oct 2026, 11:28 PM IST", "pub_date_relative": "59m ago"}, {"title": "British Airways plans record 106-seat business class on Airbus A380 jumbo jets", "full_content": "British Airways is building what it calls the \"world's largest\" business-class cabin and ripping out dozens of coach-class seats, the starkest example yet of how airlines are betting their future on high-spending travelers.\n\nThe changes are part of a massive overhaul of the British Airways fleet and its ground services, including lounges at its London Heathrow hub.\n\nAirlines have been spending years and hundreds of millions of dollars to expand their pricier seats, capitalizing on demand for roomier options and travelers' appetite for more luxurious trips.\n\nBritish Airways' joint-venture partner, American Airlines , last month debuted a 70-seat business class on its largest Boeing aircraft.\n\nThose more expensive seats command a premium. Even extra legroom on trips across the Atlantic can go for more than $200 per leg, with surcharges of more than $1,000 for premium economy seats after purchase.\n\nThe prices can be even higher if they're selected at booking. The top-end seats regularly run $5,000 and even well over $10,000 on lengthier flights.\n\nDeliveries of new aircraft have even been delayed because some of the new seats are so elaborate that carriers have been waiting for parts or federal certification.\n\nBritish Airways' overhaul of the cabins on its 12 A380s is also a bet on the jumbo jet, which many carriers have retired in recent years, opting for smaller, more fuel-efficient jets. Airbus delivered the last A380 to the plane's largest user, Emirates, in late 2021.", "source": "CNBC Top News", "pub_date_str": "06 Oct 2026, 11:23 PM IST", "pub_date_relative": "1h ago"}, {"title": "Cyber fraud: How customers can prevent their bank accounts from being used as mule accounts", "full_content": "Three people were recently arrested in Delhi for allegedly supplying and using mule bank accounts to facilitate cyber fraud . According to the allegations, the account holders provided access to their bank accounts to receive proceeds from cyber fraud in exchange for commissions.\n\nIn a separate case, police in Maharashtra's Thane district busted a cyberfraud syndicate allegedly involved in fraudulent transactions worth \u20b9 57.25 crore through several mule accounts.\n\nA mule account is a bank or financial account used by criminals to receive, hold or transfer illegally obtained money. Such accounts can be operated by the criminals themselves or by individuals who knowingly or unknowingly allow their accounts to be used for suspicious transactions.\n\nCustomers can become involved in such arrangements through fake job offers, easy-money schemes, fraudulent investment opportunities or low-interest loan offers. Unused or dormant bank accounts can also pose a risk if they are not regularly monitored.\n\nExperts advise customers to be particularly cautious about unsolicited job offers, schemes promising easy money and requests to \"rent\" or \"lend\" a bank account.\n\nShailendra Awasthi, Leader Technology at chartered accountancy firm Bhuta Shah & Co LLP, said customers should not treat their bank accounts as facilities that can be lent to others.\n\n\u201cThe biggest mistake customers make is treating their bank account as a facility that can be \u2018lent\u2019 to someone else. Your bank account should only be used for transactions that you personally understand and are responsible,\u201d Awasthi said.\n\nHe advised customers never to allow another person to use their account to receive or transfer money, even if they are promised a commission.", "source": "LiveMint Money", "pub_date_str": "06 Oct 2026, 11:14 PM IST", "pub_date_relative": "1h ago"}, {"title": "Rahul Gandhi, Congress MPs Released From Detention After High-Stakes Protest Outside EC Office | Watch", "full_content": "The high-stakes protest was organised by the INDIA Bloc over what the Opposition has described as unilateral decisions by Chief Election Commissioner Gyanesh Kumar and alleged irregularities in the Special Intensive Revision (SIR) of voter rolls. The protesters were demanding Kumar's resignation.", "source": "NDTV Profit", "pub_date_str": "06 Oct 2026, 11:13 PM IST", "pub_date_relative": "1h ago"}, {"title": "Why deep-red Kansas has become an unexpected Senate battleground", "full_content": "In a state that hasn't elected a Democratic senator since 1932, Republican Sen. Roger Marshall suddenly finds himself in a competitive race with weeks to go until the 2026 midterm elections .\n\nStubborn inflation, blowback from White House trade policies, and a formidable Democratic challenger in megachurch pastor Adam Hamilton have combined to turn ruby-red Kansas into an unexpected Senate battleground.\n\nThe tightening contest has forced Marshall into a balancing act confronting a growing number of vulnerable Republicans: creating space from President Donald Trump on issues that pose risks at home without alienating his base.\n\n\"When a sitting Republican senator in Kansas starts running away from their leader in the White House, the five-alarm bell is ringing for the entire party,\" said Bob Beatty , a political scientist at Washburn University. \"Loyalty to Washington is becoming a liability when voters are feeling the squeeze at home.\"\n\nThe Cook Political Report with Amy Walter shifted the race from \"Likely Republican\" to \"Lean Republican\" on Sept. 23.\n\nA September Emerson College/Nexstar survey of 750 Kansas likely voters put Hamilton at 45% and Marshall at 43%, a dead heat within the poll's 3.6% margin of error. In the same poll, Trump's approval in Kansas stood at 40%, with 53% disapproving and nearly half of likely voters naming the economy their top issue.\n\nNational Republican groups have taken note. Outside groups are now pouring millions into Kansas to defend the seat that once sat safely outside the Senate battlefield. At stake is the GOP's Senate majority.\n\nMarshall has been a stalwart Trump ally for years. Though Trump carried Kansas by 16 points in 2024, the senator has recently shown a willingness to distance himself.", "source": "CNBC Top News", "pub_date_str": "06 Oct 2026, 11:13 PM IST", "pub_date_relative": "1h ago"}, {"title": "Star Wars: Galactic Racer Goes Live Worldwide On October 6 \u2014 Check Timings, Gameplay, What to Expect", "full_content": "Fuse Games' Star Wars: Galactic Racer arrives on October 6. Check when it unlocks in your time zone, along with details on its online races and story campaign.", "source": "NDTV Profit", "pub_date_str": "06 Oct 2026, 11:09 PM IST", "pub_date_relative": "1h ago"}, {"title": "Did You Overpay For A Big Mac? McDonald's Sued Over AI-Powered Menu Price-Fixing", "full_content": "A proposed US class action accuses McDonald's of using AI-powered pricing tools to coordinate menu prices across franchises, raising fresh antitrust concerns.", "source": "NDTV Profit", "pub_date_str": "06 Oct 2026, 10:59 PM IST", "pub_date_relative": "1h ago"}, {"title": "India vs Uruguay: 90% Ticket Cut, Free Passes But Salt Lake Stadium Still Mostly Empty", "full_content": "Around 15,000 spectators were present at kick-off despite cheaper tickets and complimentary passes being offered.", "source": "NDTV Profit", "pub_date_str": "06 Oct 2026, 10:59 PM IST", "pub_date_relative": "1h ago"}, {"title": "Mid-cap and small-cap mutual funds have outperformed: Why should investors favour large-caps at this stage?", "full_content": "Mutual fund investors often spread their equity allocation across large-, mid-, and small-cap funds to balance growth and risk. However, recent mutual fund flows, with stronger inflows into mid- and small-cap categories and outflows from large-cap funds, also reflect changing investor preferences.\n\nIn the last one year, large-cap funds delivered a category-average return of -4.76%, compared with 2.87% for mid-cap funds and 8.02% for small-cap funds.\n\nAn October 2026 Netra report from DSP Mutual Fund points to a sharp divergence between large caps and the mid- and small-cap segments, raising an important question about why investors should review their equity fund allocations at this stage.\n\nDSP Mutual Fund says the market is unusually polarised, with small and mid-caps trading at elevated valuations while several large-cap segments have undergone a significant correction. Over the past year, small and mid-caps have outperformed the Sensex by 21.5% and 14.1%, respectively.\n\nThe report noted that \u201cLarge caps have corrected enough for valuations to be near fair/cheap zones. SMIDs (small-cap and mid-caps) have seen less valuation compression and still need stronger earnings delivery to justify broad exposure. Large-caps may offer more opportunities at this time.\u201d\n\nFor mutual fund investors, this means large-cap funds, which invest predominantly in established companies, could currently offer a relatively better margin of safety than mid- and small-caps. The report adds, \u201cBarring the COVID decline, large caps haven\u2019t been this attractive in over a decade.\u201d\n\nThe report also noted that \u201cduring each downcycle, SMIDs lose almost all the alpha generated during the upcycle.\u201d Currently, SMIDs have a large alpha over large-caps, suggesting that investors may be better served by increasing their focus on large-cap funds.\n\nThe report\u2019s valuation data also offers an important comparison for mutual fund investors.", "source": "LiveMint Money", "pub_date_str": "06 Oct 2026, 10:56 PM IST", "pub_date_relative": "1h ago"}, {"title": "Persistent Systems EGM Verdict: Shareholders Approve Plan To Raise Up To Rs 11,800 Crore", "full_content": "The approval comes after the IT services company's board in September approved plans to raise funds through debt and equity-linked instruments, potentially paving the way for a sizeable capital raise.", "source": "NDTV Profit", "pub_date_str": "06 Oct 2026, 10:55 PM IST", "pub_date_relative": "1h ago"}, {"title": "'SaaSpocalypse' Fades: Wall Street's Software Stocks Hit Fresh 2026 Highs On Easing AI Disruption Fears", "full_content": "US software stocks have climbed to fresh 2026 highs as stronger earnings expectations and fading concerns over AI-led disruption revive investor confidence in the sector.", "source": "NDTV Profit", "pub_date_str": "06 Oct 2026, 10:54 PM IST", "pub_date_relative": "1h ago"}, {"title": "Tu Hai Meri Kiran Trailer: Sonakshi Sinha-Zaheer Iqbal Twisted Love Story Blurs Line Between Love, Obsession", "full_content": "Tu Hai Meri Kiran stars Sonakshi Sinha and Zaheer Iqbal in lead roles and is directed by Karan Rawal.", "source": "NDTV Profit", "pub_date_str": "06 Oct 2026, 10:52 PM IST", "pub_date_relative": "1h ago"}, {"title": "Salesforce shares sit at the epicenter of AI confusion. Here's how to trade it", "full_content": "If ever there was a stock that personified the promise and peril of the AI trade, it's Salesforce .\n\nSalesforce shares have been in a tug of war throughout 2026, and it may present an opportunity for options traders. The stock bottomed in late June, down more than 40% from the start of the year on fears that AI agents would make traditional software subscriptions obsolete.\n\nFear collided with reality when the company released Q2 earnings in August that blew away Street expectations and put to rest, at least temporarily, that the so-called SasSpocalypse was upon us. The stock responded by jumping from $205 to a share price of $252 by the end of the following session, a rally of over 22% and the second biggest single day gain in the company's history.\n\nNow, just one month later, the stock has faded much of that post-earnings momentum and sits near a share price of $230, significantly above yearly lows but still down nearly 10% YTD.\n\nSalesforce, YTD Like many other legacy SaaS names, Salesforce has reported strong financials, but many investors remain unconvinced the business can grow through an AI driven overhaul of enterprise software. That unresolved debate may be part of why the stock has stayed stuck between its highs and lows rather than settling into a clear trend. With the next earnings announcement estimated in December, this gives options traders several weeks to potentially play this choppy range before the next major catalyst.\n\nImplied volatility on Salesforce currently sits around 39%, somewhat elevated relative to its annual range but fairly in line with levels for the past month. For context, that volatility spiked into the mid 50s back in August around the earnings reaction. Current volatility levels in Salesforce are more consistent with sustained, moderately elevated investor uncertainty as opposed to the market gearing up for another violent move.", "source": "CNBC Top News", "pub_date_str": "06 Oct 2026, 10:52 PM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "Cabinet approves Rs 10,000-crore SME Growth Fund and new authority to plan transport and logistics", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a Cabinet approves Rs 10,000-crore SME Growth Fund and new authority to plan transport and logistics The Economic Times daily newspaper is available online now. Read Today's Paper Cabinet approves Rs 10,000-crore SME Growth Fund and new authority to plan transport and logistics SECTIONS Cabinet approves Rs 10,000-crore SME Growth Fund and new authority to plan transport and logistics ET Bureau Last Updated: Oct 07, 2026, 12:19:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Indian government has approved a \u20b910,000-crore SME Growth Fund aimed at supporting small and medium enterprises. Additionally, an Integrated Transport & Logistics Authority has been established to enhance transport infrastructure planning. This fund is intended to address equity capital gaps currently faced by SMEs and facilitate their growth. ITLA will create a comprehensive National Transport Master Plan to improve coordination across various transport sectors.\n\nThe world is witnessing a bond rout. Why should it matter to you?\n\nQ2 earnings season: Will it settle or add to confusion in the stock market?\n\nHow Sebi busted Growpital\u2019s \u2018assured\u2019 returns, LLPs and money trail\n\nA for apple, Y for yak and, for the first time, a price next to it. Will this change the non-agri part of the rural economy?\n\nSix months after oil spiked, why are markets reacting so sharply now?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers", "source": "Economic Times Economy", "pub_date_str": "07 Oct 2026, 12:19 AM IST", "pub_date_relative": "8m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Fixed Income", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Aaron Szabo leaves EPA after overseeing major regulatory rollbacks", "full_content": "", "source": "Investing.com News", "pub_date_str": "07 Oct 2026, 12:19 AM IST", "pub_date_relative": "8m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Farmers say no to early sugarcane crushing, demand compensation and higher sugar, ethanol prices first", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Agriculture \u203a Farmers say no to early sugarcane crushing, demand compensation and higher sugar, ethanol prices first The Economic Times daily newspaper is available online now. Read Today's Paper Farmers say no to early sugarcane crushing, demand compensation and higher sugar, ethanol prices first SECTIONS Farmers say no to early sugarcane crushing, demand compensation and higher sugar, ethanol prices first By Jayashree Bhosale , ET Bureau Last Updated: Oct 07, 2026, 12:16:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Farmers' organizations in Maharashtra and Karnataka are resisting the government's early sugarcane crushing proposal. They demand compensation for low recovery and higher prices for sugar and ethanol. A meeting with Union Food Minister Pralhad Joshi has been scheduled to discuss these concerns. Crushing immature sugarcane may lead to substantial financial losses for both farmers and sugar mills.\n\nThe world is witnessing a bond rout. Why should it matter to you?\n\nQ2 earnings season: Will it settle or add to confusion in the stock market?\n\nHow Sebi busted Growpital\u2019s \u2018assured\u2019 returns, LLPs and money trail\n\nA for apple, Y for yak and, for the first time, a price next to it. Will this change the non-agri part of the rural economy?\n\nSix months after oil spiked, why are markets reacting so sharply now?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers", "source": "Economic Times Economy", "pub_date_str": "07 Oct 2026, 12:16 AM IST", "pub_date_relative": "10m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Fixed Income"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "How event contract bundles are boosting volume on prediction markets", "full_content": "The growing popularity of a combo contracts on prediction markets is leading to soaring volumes, even as they makes up only a small amount of total activity on the platforms.\n\nCombos, or multiple contracts stacked together that only pay out if all of them win \u2014 similar to parlays on traditional sportsbooks \u2014 have exploded in popularity.\n\nLast month, combos accounted for more than 50% of notional volume on Kalshi , driven by the start of the NFL season . Combos are overwhelmingly made up of combinations of multiple sports contracts.\n\nAs rival Polymarket worked to expand its U.S. exchange this year, combos were a priority following the domestic platform's official launch in May . Combos are now nearly 50% of daily volume on Polymarket U.S., helped by growth during the NFL season.\n\nBut while combos hold a large share of volume, they actually aren't where most speculators on prediction markets execute their trades. That's because of how the Commodity Futures Trading Commission , the federal regulator overseeing prediction markets, requires exchanges to report volume.\n\nThe multi-leg contracts are \"helping [Polymarket and Kalshi] claim a higher number with lower realistic cash output,\" said Chris Park, a researcher and founder of MSR Decode, a research firm analyzing prediction market data.\n\nWhen a trader places a trade on a prediction market, no matter the cash they put down, platforms measure it as $1 of notional volume. All event contracts have binary outcomes between $0 to $1, and no matter what price a speculator pays to place a trade, someone has to take the other side of that order and make $1 in total volume.\n\nBut combos can have payouts that are much greater than $1, meaning someone can put very little money down, pennies in some cases, and it will be measured as potentially thousands of dollars in volume thanks to the market makers who take the other side of these high-payout trades.", "source": "CNBC Finance", "pub_date_str": "07 Oct 2026, 12:16 AM IST", "pub_date_relative": "11m ago", "cfa_topics": ["Derivatives", "Alternative Investments"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Best student loans for nursing school", "full_content": "Federal student loans are an important source of funding for nursing school, but they may not cover the full cost. That's especially relevant for graduate and professional nursing students following federal loan changes that took effect July 1, 2026. New borrowing limits are now in place, and most new graduate and professional students can no longer use Grad PLUS Loans to borrow up to the full cost of attendance.\n\nFor eligible professional students, federal Direct Unsubsidized Loans are generally capped at $50,000 per year and $200,000 in aggregate, although certain health-professions programs have additional rules and exceptions. If your nursing program costs more than your available federal aid, you may need another way to cover the remaining balance.\n\nThat's where private student loans come in. Private lenders can provide additional funding when federal loans and other resources don't cover your total education costs. However, private loans generally don't offer the same federal protections and benefits, so it's important to compare rates, fees, repayment terms and borrower protections before taking one out.\n\nBelow, we rounded up some of the best private student loans for nursing school. Note that eligibility may depend on your specific nursing program and school. You can read our methodology below.\n\nOffers in this section are from affiliate partners and selected based on a combination of engagement, product relevance, compensation, and consistent availability.\n\nUndergraduate and graduate students, parents, students in MBA, law, health professional and dental programs\n\n$5,000 (or state-mandated minimum) up to the cost of attendance\n\nUndergraduate, graduate, Master's, PhD, MBA, law school, medical school, health professions, dental school, medical and dental residency loans, bar study loans.", "source": "CNBC Top News", "pub_date_str": "07 Oct 2026, 12:11 AM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Kalshi, Polymarket trading volumes on some products raise questions amid massive growth", "full_content": "Trading volumes for certain products on prediction market platforms Kalshi and Polymarket are raising questions from some industry observers, who fear the numbers may be inflated.\n\nOn Polymarket, observers have flagged a quirk on the company's international exchange, which is not overseen by U.S. regulators: Markets that feature multiple contracts will see greater activity on those with lower odds of occurring versus those with higher probabilities. It's seen on markets related to elections, sports and central bank decisions.\n\nMeanwhile, a user on X on Sept. 20 flagged a strange pattern on Kalshi's perpetual futures market for the ether cryptocurrency. Trades of around $5,500 made up a large share of transactions on the contracts, and that 24-hour trading volume was abnormally high compared with actual resting liquidity. A CNBC analysis found that on Sept. 20, nearly half of the dollar volume traded on Kalshi's ether perpetuals came from trades sized between $5,495 and $5,505.\n\nBoth developments create concerns among some observers that the companies are overseeing inflated volumes or, at worst, are experiencing wash trading, in which traders collude to buy and sell an asset to create a false sense of economic activity.\n\nBoth Kalshi and Polymarket deny wash trading occurs on any of their products. They also deny that the respective patterns represent inorganic activity.\n\nA designated contract market, the type of exchange prediction markets are, \"has a duty to protect market integrity by monitoring market conditions, price movements, and volumes in real time for abnormalities,\" said Tamika Bent, a partner at K&L Gates. While she said the patterns described here don't alone establish misconduct by an exchange, she added observers would \"expect DCMs to be surveilling unusual volume and looking into any signs of market disruption.\"\n\nPolymarket is currently raising at a valuation north of $20 billion in the private market after the launch of its U.S.", "source": "CNBC Finance", "pub_date_str": "07 Oct 2026, 12:11 AM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Economics", "Equity Investments", "Derivatives", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Oil prices stable as market weighs supply risks, rising Middle East exports", "full_content": "Oil prices were steady on Tuesday after recovering earlier losses, as the market weighed increases in Middle Eastern crude exports and a planned \u200cGroup of Seven release of emergency diesel and crude stockpiles against supply concerns related to attacks by the Iran-backed Houthis in Yemen.\n\nBrent futures were up 44 cents at $100.76 a barrel at 2:34 p.m. ET, while US West Texas Intermediate (WTI) crude rose 1 cent to settle at $89.44.\n\n\"The price of the global crude benchmark, Brent, is once \u200bagain toiling around $100/barrel, as its reasons for trading much beyond the psychological 3-digit mark are being eroded ... for now the assumption of more crude getting through has \u200bdampened price fervour,\" said John Evans, an analyst at oil broker PVM.\n\nAround 12 million barrels per day of crude oil and 2 million \u2060bpd of refined products \u2014 volumes needed to dampen price pressure \u2014 have left the Middle East on tankers in the last seven to 10 days, the CEO of commodity trading giant \u200bVitol said on Tuesday.\n\nSaudi Energy Minister Prince Abdulaziz bin Salman said on Tuesday that oil pumped through the East-West Pipeline, which runs to the kingdom's Red Sea export hub of \u200bYanbu, had reached 5.8 million barrels as of Tuesday morning.\n\nOil price declines, however, have been limited by the possibility of further Middle East supply disruptions.\n\nSaudi Arabia's airports in Jazan and Najran were targeted in two attacks on Monday evening, injuring three people and causing limited damage, the Saudi aviation authority said, as hostilities between the kingdom and Yemen's Iran-backed Houthis escalated.\n\nThe attacks occurred as Saudi-backed Yemeni government forces pressed \u200ba major offensive to retake territory from the Houthis, after weeks of rebel advances, with Riyadh stepping up airstrikes in support of the campaign.", "source": "CNBC Top News", "pub_date_str": "07 Oct 2026, 12:11 AM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Economics", "Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Boomers' dividend stocks take beating as bond yields rise, with retirement income on the line", "full_content": "Dividend stocks like utilities are being pummeled amid bond market chaos and the rise of the 10-year U.S. treasury , raising questions for seniors about how to continue meeting their income needs.\n\nWhile dividend stocks are only part of a diversified portfolio for older investors, many boomers often depend on dividend stocks and funds for at least some of their income. When returns are rocky, it can, understandably, cause some consternation.\n\nMany dividend funds are giving back some of their gains from earlier in the year when bond rates were lower, said Timothy Chubb, chief investment officer at Girard, a Univest Wealth Division, in King of Prussia, Pennsylvania.\n\nSectors including real estate, utilities, and materials have seen stock prices plummet as bond yields become more attractive and dividend stock yields less attractive on a relative risk-reward basis. For all the concern about bonds, inflows into bond ETFs have been rising. Consider the iShares 20+ Year Treasury ETF ( TLT ): it has taken in over $3.2 billion in net inflows from investors over the past month, according to ETFAction.com.\n\nTo be sure, there is a split in the market between investors who continue to pile into ultrashort bond funds, which had record inflows near $20 billion in September, according to Morningstar. And those investors making a bet that the worst in the bond market is over and the yields are too attractive to pass up. TLT's inflows were its largest monthly inflows on record as its yield hit the highest since 2002, according to Dow Jones data.\n\nBoomers, however, shouldn't necessarily give up on dividend-paying stocks. Instead, they should consider several strategies that can blunt the impact of rising bond yields on their income-stock portfolios.", "source": "CNBC Top News", "pub_date_str": "07 Oct 2026, 12:11 AM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Fixed Income", "Portfolio Management"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Kalshi launches transparency features on its election contracts ahead of midterms", "full_content": "With less than a month until midterms, Kalshi is launching three features on its election contracts to ensure traders have more transparency on how active and accurate its markets are.\n\nFirst, the platform will provide tags that indicate which election markets are low volume, which Kalshi defines as those with less than $10,000. Prediction markets experts have warned prices in low-volume markets can fluctuate widely, while spreads between buying and selling can stretch.\n\nSecond, Kalshi's own election markets will have Brier scores, which will measure the accuracy of the market's probabilities versus actual outcomes.\n\nFinally, the platform is launching an activity feeds feature, where it shows individual trades happening on election contracts live.\n\nKalshi decided to provide these transparency features after noting election traders were participating on markets covering local races over national ones. Kalshi's co-founder and CEO Tarek Mansour called the midterms the \"first meaningful prediction market election,\" noting the platform's election markets have grown six times faster than football markets this year, compared to the year before.\n\nKalshi's internal data also indicates that more people are viewing their midterm markets than those who are trading by a ratio of five to one.\n\nIn July, the prediction markets platform released a \"Midterms Hub,\" which allows anyone to view traders' odds on markets tied to U.S. Senate and House of Representatives races.\n\nDisclosure: CNBC and Kalshi have a commercial relationship that includes customer acquisition and a minority investment.", "source": "CNBC Top News", "pub_date_str": "07 Oct 2026, 12:04 AM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Corporate Issuers", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Gold industry expects price rise to $5,013 an ounce over 12 months", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Commodities \u203a Gold industry expects price rise to $5,013 an ounce over 12 months The Economic Times daily newspaper is available online now. Read Today's Paper Gold industry expects price rise to $5,013 an ounce over 12 months SECTIONS Gold industry expects price rise to $5,013 an ounce over 12 months Reuters Last Updated: Oct 06, 2026, 11:57:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Gold prices are set to soar to $5,013 per ounce in the next year, while silver is expected to jump from $61 to $97 per ounce. In addition, LBMA officials foresee platinum prices climbing to $1,914 an ounce and palladium rising to $1,415. This outlook occurs against a backdrop of rising interest rate worries and geopolitical strains that continue to shape the market landscape.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "06 Oct 2026, 11:57 PM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Economics", "Equity Investments", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "US EIA lifts Brent forecast to $98 as Iran war tightens global supplies", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a US EIA lifts Brent forecast to $98 as Iran war tightens global supplies Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US EIA lifts Brent forecast to $98 as Iran war tightens global supplies SECTIONS US EIA lifts Brent forecast to $98 as Iran war tightens global supplies ETMarkets.com Last Updated: Oct 06, 2026, 11:52:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The US Energy Information Administration has revised its oil price forecasts for the coming years due to supply issues. Global benchmark Brent crude is expected to average approximately $98 a barrel in 2026. Retail diesel prices are projected to remain high initially before gradually declining to around $4.50 in 2027. Improvements in Middle Eastern oil production are anticipated as transit routes become safer and more efficient.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "06 Oct 2026, 11:52 PM IST", "pub_date_relative": "34m ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "How Meta\u2019s stock can surge to $1,000, according to the biggest bull on Wall Street", "full_content": "A Wells Fargo analyst warns of a near-term profit hit from AI infrastructure spending and legal costs \u2014 but thinks that will set up massive gains by 2028.", "source": "MarketWatch Top Stories", "pub_date_str": "06 Oct 2026, 11:50 PM IST", "pub_date_relative": "37m ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "RBI 25-bps rate hike or status quo: What should mutual fund investors do after the policy announcement? Expert explains", "full_content": "On October 7 (Wednesday), the Reserve Bank of India ( RBI ) is expected to deliver its first repo rate hike in nearly 3.5 years, since February 2023. A Reuters poll showed 35 of 61 economists expect a 25-basis-point hike, which would take the repo rate from 5.25% to 5.50%.\n\nHere\u2019s what investors should do after the RBI\u2019s monetary policy announcement. Experts suggest mutual fund portfolio strategies for both a 25-bps rate hike and a status quo.\n\nManish P. Hingar, Founder and Chief Executive Officer of Fintoo, said equity can be left alone. Keep the SIPs running and don't sell because of one rate decision. Rebalancing may be considered if equity allocation moves more than about 5% from the target.\n\nThe key question is whether the hike marks the start of a cycle, with some forecasts seeing rates at 5.75%-6% in FY27. Harsha Vardhana VM, Founder-Group CEO, Atom Financial Services, said this calls for measured adjustments, with debt needing the most attention. Investors in gilt or long-duration funds with short-term goals could shift towards low-duration, money-market or floating-rate funds, while those with three-year-plus horizons can stay with medium-duration funds.\n\nSouvik Biswas, Head of Research at Bajaj Capital, said arbitrage funds can be a better diversifier during rate-hike cycles, with new investments considered in arbitrage funds instead of other debt funds.\n\nIn equities, Piyush Jhunjhunwala, Founder and CEO of Stockify, said investors can reduce exposure to highly leveraged companies and rate-sensitive sectors such as real estate, automobiles and some financial segments.\n\nVardhana VM said higher borrowing costs could pressure heavily indebted companies and sectors such as real estate, autos and lending. For mutual fund investors, this means leaning on large-cap, flexi-cap or large and midcap funds for stability.", "source": "LiveMint Money", "pub_date_str": "06 Oct 2026, 11:48 PM IST", "pub_date_relative": "39m ago", "cfa_topics": ["Economics", "Fixed Income", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Young voters struggle to afford housing. But they don't expect help from political candidates", "full_content": "ALLENTOWN, Pa. \u2014 Mortgage rates are climbing sharply , home prices continue to gain and inflation in the broader economy is hitting consumers, leading housing affordability to weigh heavily on both renters and potential homebuyers.\n\nIn Pennsylvania \u2014 a swing state where House races could help decide control of the next U.S. Congress \u2014 renting or owning a home is cheaper than the national average, but the share of income needed to do either has also risen along with the rest of the country. In 2019, it took 20% of the median income to rent a home and 18% to own. Today it's 22% and 24%, respectively, according to Cotality.\n\n\"For that person trying to get an apartment, person moving from an apartment to a starter home, starter home to a larger home, each and every one of those cohorts is reporting that it's a challenge right now, and it's something that is weighing on them in a very important political place,\" Lehigh University political science professor Christopher Borick said.\n\nAmericans, especially renters, feel financially stretched by housing costs, according to a new CNBC and SurveyMonkey Quarterly Money Survey , released Oct. 5. It found one in five Americans who rent or have a mortgage spend at least half of their pre-tax income on housing, while 49% spend between 25% and 49%. Standard guidelines from banks and lenders say consumers should spend 28% to 30% of their income on housing.\n\nThe cost of housing is now the top political issue \u2014 even higher than the cost of food or protecting democracy \u2014 among U.S. voters aged 18 to 34, according to the most recent CNBC All-America Economic survey .\n\nGoing into the midterm election , the average rate on the popular 30-year fixed mortgage has jumped well over 7.5%, according to Mortgage News Daily. It hit a low of 5.99% days before the war with Iran started.", "source": "CNBC Top News", "pub_date_str": "06 Oct 2026, 11:41 PM IST", "pub_date_relative": "46m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Gujarat Natural Resources sets November 5 as record date for the first-ever stock split. Details here", "full_content": "Gujarat Natural Resources , which is largely held by retail shareholders, announced the record date for its proposed stock split in a market regulatory filing on Tuesday. The company, which is engaged in the business of oil and gas exploration and trading of goods, has fixed Thursday, November 5, 2026, as the record date.\n\nThe record date will determine which shareholders are eligible for the proposed 1:10 stock split. Under the plan, each fully paid-up equity share with a face value of \u20b9 10 will be subdivided into 10 equity shares with a face value of Re 1 each.\n\nThe record date follows after the shareholders of the company, at the Annual General Meeting held on Wednesday, approved the split.\n\n\"Accordingly, 1 (one) equity share of the company having a face value of Rs. 10/- each shall be subdivided/split into 10 (ten) equity shares of the company having a face value of Re. 1/- each, fully paid-up, ranking pari-passu in all respects,\" the company said in its filing.\n\nGujarat Natural Resources Ltd is an upstream oil and gas explorer. It operates through subsidiaries and step-down subsidiaries. Its step-down subsidiary, GNRL Oil & Gas Limited (GOGL), has participating interests in six producing blocks in the Cambay Basin and is the operator in five of these blocks.\n\nThe portfolio comprises the Kanawara,
