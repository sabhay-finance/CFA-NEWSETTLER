    const allData = {"general": [{"title": "IMFC chair says global economy resilient; delegates walk out on Russian official", "full_content": "The global economy is showing remarkable resilience but there is no room for complacency, the head of the International Monetary Fund's steering committee said on Saturday, while divisions over Russia's ongoing war against Ukraine sparked a walkout of delegates.\n\nSaudi Finance Minister Mohammed Al-Jadaan, who heads the IMF's steering committee, acknowledged the walkout by nearly half of delegates during remarks by Russia's finance minister at a meeting on Saturday, but said the important thing was that members ultimately agreed to the chair's statement.\n\n\"We came here for a reason, and we achieved it.", "source": "CNBC Top News", "pub_date_str": "17 Oct 2026, 05:11 PM IST", "pub_date_relative": "1m ago"}, {"title": "Nifty soars 2.8% this week: What lies ahead for Dalal Street? - Experts decode 5 triggers, key levels for next week", "full_content": "Stock Market Outlook : Indian equities staged a strong comeback this week, with the Nifty 50 rising 2.77% and the Sensex surging 3.11%, as renewed buying in information technology (IT) stocks, easing global bond-yield pressures and resilient domestic institutional inflows lifted investor sentiment.\n\nBoth benchmarks also extended their gains for a second consecutive session on Friday, strengthening hopes of a recovery after the recent market correction.\n\nOn Friday, the Sensex climbed 413.66 points, or 0.56%, to close at 74,729.27 on Friday, while the Nifty advanced 148.80 points, or 0.65%, to settle at 23,146.15. For the week, the Sensex gained 2,256.94 points, while the Nifty added 625.7 points.\n\nHowever, the rally faces several tests, including whether earnings growth broadens beyond IT, foreign investor selling eases further and the Nifty breaks through immediate resistance. Market experts believe investors should remain selective as global macroeconomic uncertainty and domestic inflation concerns persist.\n\nThe September-quarter earnings season will remain a major driver of market sentiment. Investors will assess whether companies can deliver stronger revenue growth and margins across banking, consumption and industrials, rather than relying primarily on IT stocks to sustain the recovery.\n\nVinod Nair, Head of Research at Geojit Investments Limited, said, \u201cThe sustainability of the recovery will hinge on earnings growth broadening beyond IT, with revenue and margin delivery across financials, consumption and industrials under close scrutiny.\u201d\n\nForeign institutional investor (FII) flows remain a key variable for the market.", "source": "LiveMint Markets", "pub_date_str": "17 Oct 2026, 05:04 PM IST", "pub_date_relative": "7m ago"}, {"title": "Gold FoFs halt fresh investments, but silver mutual funds remain open: Experts decode the reasons and explain what to do", "full_content": "Investors can gain exposure to gold and silver through exchange-traded funds (ETFs), fund of funds (FoFs), and FOFs combining both metals. While ETFs trade on stock exchanges like shares and are backed by physical metal, FoFs invest in underlying ETFs and are priced at the end of the day.\n\nFollowing notices issued on 15 October 2026, several mutual fund houses have restricted fresh investments in gold FoFs and gold-silver FoFs , while gold ETFs, silver ETFs and FoFs remain open. Existing registered SIP s and STPs generally continue, while redemptions remain available.\n\nThe experts suggest that the move aims to curb gold imports and explain what investors should do.\n\nHarsh Vardhan Dawar, ACA, CFA, FRM, Founder of Wealth Cafe, said the restrictions align with the government's efforts to discourage gold investment and to offset some of the excess demand for physical gold as a result of the current festive season of Dussehra and Diwali, which also marks the wedding season of the year.\n\nEshaan Lazarus, Founder and CEO of 021 Trade, said gold has a greater impact on India's import bill. In FY2025-26, gold imports stood at about $72 billion against $12 billion for silver. During April-September 2026, gold imports were $19.27 billion and silver imports $2.40 billion, both lower year-on-year, partly following the May increase in import duty from 6% to 15%.\n\nHarsh Soni, Founder of NYVO Money, pointed to additional pressures, including rupee depreciation and Brent crude prices remaining above $105 a barrel. While oil imports are essential, gold imports can be curbed to ease pressure on the country's external balances.\n\n\u201cRestricting silver imports would hit manufacturing demand, not just investment demand. Silver has no cultural buying surge comparable to gold's Dhanteras peak,\u201d Soni added.\n\n\u201cIf silver inflows swell sharply, the same logic could be applied.", "source": "LiveMint Money", "pub_date_str": "17 Oct 2026, 05:00 PM IST", "pub_date_relative": "11m ago"}, {"title": "It was another great week for the average stock as market leadership shifts away from tech", "full_content": "The S&P 500\u2019s tech sector just had its worst week in a year and a half, while an equal-weighted version of the index cemented a second-straight weekly advance.", "source": "MarketWatch Top Stories", "pub_date_str": "17 Oct 2026, 05:00 PM IST", "pub_date_relative": "12m ago"}, {"title": "Best 3 stocks to buy under \u20b9100: Equitas SFB, UCO Bank, Suzlon by Mehul Kothari of Anand Rathi \u2014 Target, stop-loss", "full_content": "Stocks to buy under \u20b9 100 | Mehul Kothari's stock recommendations: The Indian stock market recorded its strongest weekly gains in nearly six months for the week ended October 16, 2026, with the Sensex rising 3.11% to 74,729 and the Nifty 50 index gaining 2.8% to 23,146, marking their second consecutive weekly advance.\n\nThe rally was led by a spectacular 11.7% surge in the Nifty IT index, its biggest weekly gain in nearly 18 years, supported by strong Q2 results 2026 and a global rotation towards traditional technology stocks.\n\nHighlighting the major triggers, which fueled buying in Sensex, Nifty and other index-listed stocks, Mehul Kothari, Deputy Vice President \u2014 Technical Research at Anand Rathi, said, \u201cA stronger Indian Rupee, softer crude oil prices, domestic institutional buying and optimism around a potential India-US trade deal further supported sentiment. However, the rally remained concentrated in large caps, with midcaps posting modest gains while smallcaps largely lagged, alongside weakness in FMCG and pharma stocks.\u201d\n\nSpeaking on the outlook for the Nifty 50 index, Mehul Kothari said, the 50-stock index has staged a remarkable recovery, rallying nearly 1,000 points from its recent low of around 22,150 to a high near 23,150 in a short span. This validates our earlier stance of not panicking during the breakdown near 22,200, as highlighted by the \u2018Triple Bullish Divergence\u2019 on RSI across NIFTY 50, NIFTY 500, NIFTY MIDCAP 100 and NIFTY MIDCAP 150.\n\n\u201cWith selling pressure easing and momentum improving, we now maintain our BUY ON DIPS stance. The crucial support has shifted to 22,600, and holding above this level will keep bullish confidence intact. On the upside, 23,200 remains the immediate hurdle, and a sustained breakout above it could open the door towards 23,600 in the coming week.", "source": "LiveMint Markets", "pub_date_str": "17 Oct 2026, 04:58 PM IST", "pub_date_relative": "14m ago"}, {"title": "ICICI Bank Q2 profit beats estimates on strong loan growth", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Oct 2026, 04:51 PM IST", "pub_date_relative": "20m ago"}, {"title": "InvestingPro Fair Value analysis captures 67% gain on Certara stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Oct 2026, 04:39 PM IST", "pub_date_relative": "33m ago"}, {"title": "HDFC Bank Q2 profit rises 5%, net interest income grows", "full_content": "", "s  Premium Content\n\nUS mid-term elections \u2013 Part 2: What does it mean for Trump to lose control of Congress?\n\nThe ABCD of the US mid-term elections \u2013 Part 1: Why it matters across the globe\n\nCurbing rupee bets: What the RBI\u2019s new rules mean for the hedge-now-or-wait question\n\nBrinjal, buffalo, bacteria: Inside India\u2019s pay-for-nature system\n\nHomebuyers wait as NCLT panel picks holes in unfinished Jaypee projects\n\nThe NBFC saga - Part 3: How one default in 2018 changed the way RBI reads risk", "source": "Economic Times Economy", "pub_date_str": "17 Oct 2026, 04:21 PM IST", "pub_date_relative": "51m ago"}, {"title": "Reliance Jio IPO GMP today: Listing-day jackpot or long-term bet? How should investors play Mukesh Ambani\u2019s mega IPO?", "full_content": "Reliance Jio IPO GMP today: The countdown to India\u2019s largest initial public offering (IPO) has begun. Jio Platforms IPO, backed by billionaire Mukesh Ambani\u2019s Reliance Industries Limited, is garnering heightened investors\u2019 interest ahead of the opening of its subscription period. Jio IPO\u2019s latest grey market premium (GMP) hints at 19.75% listing gains.\n\nJio Platforms is offering 27 crore new equity shares in the price band of between \u20b9 1,065 and \u20b9 1,119 per share to investors. Which makes the Jio IPO a \u20b9 30,213 crore issuance at the upper end of the price band. As all eyes are now on India\u2019s biggest ever IPO, let\u2019s understand whether the Jio IPO will be more than a listing day jackpot and long-term bet for investors.\n\nJio Platforms latest IPO GMP was recorded at \u20b9 221 at 2:02 pm on Saturday, October 17, as per media reports. With an upper price band of \u20b9 1,119 per share, the estimated listing price for the Jio Platforms IPO is \u20b9 1,340 (which is the sum of the upper price band and latest IPO GMP today). Considering the grey market premium of Jio Platforms IPO, the issue is likely to see 19.75% listing gain.\n\nInvestors must note that the grey market premium indicates demand for an issue in the unregulated market and is not an accurate representation of an IPO's listing day performance.\n\nThe IPO is a book-build issue of \u20b9 30,213 crores and an entirely fresh issue of 27 crore shares of \u20b9 30,213 crore. The IPO has fixed issue price band at \u20b9 1,065 to \u20b9 1,119 per share. The lot size for an application is 12 shares. The minimum amount a retail investor can put in Jio IPO is \u20b9 13,428 for 12 shares.\n\nThe IPO will open for subscriptions on October 21, 2026. The issue will close for subscription on October 23, 2026. The IPO allotment will likely be finalised for the Jio IPO on October 26, 2026.", "source": "LiveMint Markets", "pub_date_str": "17 Oct 2026, 04:17 PM IST", "pub_date_relative": "55m ago"}, {"title": "Bank of America buys $16.2k, sells $15.4k of PIMCO fund shares", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Oct 2026, 04:16 PM IST", "pub_date_relative": "56m ago"}, {"title": "ICICI Bank Q2 Results: Net Profit Rises 20% To Rs 14,843 Crore; NIM Dips To 4.18%", "full_content": "ICICI Bank reported a 20.1% YoY rise in consolidated net profit to Rs 14,843 crore for the second quarter, compared with Rs 12,359 crore a year earlier.", "source": "NDTV Profit", "pub_date_str": "17 Oct 2026, 04:15 PM IST", "pub_date_relative": "56m ago"}, {"title": "Made profits on Apple or Nvidia shares? Here's whether you can claim the \u20b91.25 lakh tax exemption in India", "full_content": "Finance Minister Nirmala Sitharaman recently indicated that the government will hear investors' views on long-term capital gains (LTCG) tax during upcoming Budget consultations, bringing equity taxation back into focus.\n\nThe discussion comes amid calls for tax relief, foreign investor outflows and concerns over the competitiveness of Indian equities.\n\nThose who put money in stocks and equity-oriented mutual funds are liable to pay tax on profits earned from selling them, though the applicable rate depends on whether the gains are short-term or long-term in nature.\n\nLong-term capital gains on eligible investments held for more than 12 months are exempt from tax up to \u20b9 1.25 lakh in a financial year.\n\nIndian investors who have made gains on global stocks such as Apple, Tesla and Nvidia may assume that the same exemption applies to their overseas investments. But, is that the case?\n\nThe one word answer to that question is no. \u201cThe exemption of \u20b9 1.25 lakh is available on certain long-term gains from qualifying Indian equity investments only and it does not benefit US-listed stocks,\u201d according to Gaurav Makhijani, Managing Partner at Makhijani Gera & Associates LLP.\n\nThe taxable capital gain on overseas shares is calculated by subtracting the cost of acquisition and eligible transfer-related expenses from the sale proceeds. Investors must also apply the prescribed foreign-exchange conversion rules to determine the gains in Indian rupees .\n\nUnlike listed Indian stocks, which require a holding period of 12 months and above for gains to qualify as long-term, shares listed on foreign exchanges are subject to a 24-month holding period to be considered as LTCG.", "source": "LiveMint Money", "pub_date_str": "17 Oct 2026, 04:14 PM IST", "pub_date_relative": "58m ago"}, {"title": "IDBI Bank Q2 Results: Net Profit Falls 39%, Net Interest Income Jumps Nearly 30%", "full_content": "Net interest income (NII) increased 28.7% to Rs 4,228 crore from Rs 3,285 crore in the year-ago quarter. Provisions stand at Rs 8.55 crore.", "source": "NDTV Profit", "pub_date_str": "17 Oct 2026, 04:14 PM IST", "pub_date_relative": "58m ago"}, {"title": "Corporate Actions This Week: ICICI Prudential AMC, Tech Mahindra, LTM, IRFC And Angel One", "full_content": "Corporate actions for the week include dividend, stock split, buyback and bonus issue, featuring ICICI Prudedntial AMC, Tech Mahindra, LTM and Indian Railway Finance Corporation.", "source": "NDTV Profit", "pub_date_str": "17 Oct 2026, 04:09 PM IST", "pub_date_relative": "1h ago"}, {"title": "India Vs West Indies Live Streaming: When And Where To Watch 5th T20I", "full_content": "On Friday, the BCCI announced that 36-year-old Bhuvneshwar Kumar had been added to India's squad for the fifth and final T20I in Bengaluru.", "source": "NDTV Profit", "pub_date_str": "17 Oct 2026, 04:00 PM IST", "pub_date_relative": "1h ago"}, {"title": "New Renault Duster Hybrid Launched: How Does It Compare With Maruti Vitara? Check Price, Range And More", "full_content": "Renault\u2019s Duster Strong Hybrid E-Tech 160 combines a 1.8-litre petrol engine, two electric motors and a 1.4kWh battery to deliver 160 PS of system power. The company claims an ARAI-certified fuel efficiency of 29 km per litre.", "source": "NDTV Profit", "pub_date_str": "17 Oct 2026, 03:59 PM IST", "pub_date_relative": "1h ago"}, {"title": "Parag Parikh Flexi Cap Fund cash falls to 9.77% after Rajeev Thakkar's \u2018single-digit\u2019 outlook: Where is the money going?", "full_content": "Parag Parikh Flexi Cap Fund, the country\u2019s largest active mutual fund scheme by AUM, has stepped up its investment deployment, reducing its allocation to cash and related instruments over the past six months.\n\nThe fund\u2019s factsheets show that its combined allocation to cash, debt and money market instruments, and arbitrage positions fell to 9.77% in September 2026 from 18.94% in March, nearly halving over six months. The share also dropped by 1.81 percentage points from 11.58% in August 2026. Here's what investors need to know.\n\nParag Parikh Flexi Cap Fund's September 2026 factsheet reiterates its focus on identifying individual investment opportunities rather than making allocation decisions primarily on the basis of macroeconomic conditions.\n\n\u201cWe continue to look at individual investments on their own merits and will not hesitate to invest if an opportunity looks attractive,\u201d the factsheet stated.\n\nIt added that the fund had about 9.77% in cash holdings, debt and money market instruments, and arbitrage positions that could be deployed into long-term investments at appropriate levels.\n\nThe March 2026 factsheet had reported the corresponding allocation at 18.94%, while the August factsheet put it at 11.58%. The successive declines indicate that the fund has been reducing its deployable reserves as investment opportunities emerge.\n\nIn his August 2026 communication to unitholders, Rajeev Thakkar, CIO - Equity and Director at PPFAS, said the fund was increasingly finding opportunities to invest.\n\n\u201cCash levels peaked at about 25%. They are down to about 14%-15% in Flexi Cap. We are increasingly finding opportunities to buy, and one may look forward to single-digit cash levels in some time,\u201d Thakkar said.", "source": "LiveMint Money", "pub_date_str": "17 Oct 2026, 03:55 PM IST", "pub_date_relative": "1h ago"}, {"title": "Trump waives broad new Russia sanctions and tariffs under Graham Act, citing national interest", "full_content": "President Donald Trump signed an executive order late Friday waiving parts of a recently enacted package of sanctions aimed at curbing Russia's ability to prosecute its war against Ukraine.\n\n\"I have submitted to the Congress a certification that the issuance of such a waiver is in the national interests of the United States,\" Trump wrote in Friday's order.\n\nThe House passed the Russia sanctions bill on Sept. 16, and Trump signed it into law two days later. The bill was introduced over a year ago, and its primary backer was the late Lindsey Graham , a veteran Republican senator who represented South Carolina.\n\nTitled the Lindsey O. Graham Sanctioning Russia and Iran Act of 2026 , the legislation targeted Russia's economy, intending to penalize the country over its continued full-scale invasion of Ukraine.\n\nThe act required the president to increase duties on all Russian goods imported into the U.S. by up to 500% no later than 30 days after enactment. It also required Trump to impose tariffs of up to 100% on countries including China and India that are among the top five purchasers of Russian crude oil or gas.\n\nTrump's latest order waives these two parts of the Graham Act and comes two days before the law's implementation deadline. However, the order preserves existing sanctions on Russia under earlier executive orders.\n\nThe law could also sanction Russian leaders, officials, and financial institutions, and expand sanctions on Iran.\n\nOil sales revenue is critical to funding Russia's war effort.", "source": "CNBC Top News", "pub_date_str": "17 Oct 2026, 03:50 PM IST", "pub_date_relative": "1h ago"}, {"title": "HDFC Bank Q2 Results: Net Profit Below Estimates, Provisions Rise Marginally", "full_content": "HDFC Bank Ltd.'s second-quarter net profit rose 5.2% year-on-year to Rs 19,610 crore in the quarter ended Sept. 30, compared with the Bloomberg estimate of Rs 19,727.43 crore.", "source": "NDTV Profit", "pub_date_str": "17 Oct 2026, 03:50 PM IST", "pub_date_relative": "1h ago"}, {"title": "ICICI Bank Q2 Results: Net profit jumps 20% YoY to Rs 14,843 crore, NII rises 18%", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a Earnings \u203a ICICI Bank Q2 Results: Net profit jumps 20% YoY to Rs 14,843 crore, NII rises 18% The Economic Times daily newspaper is available online now. Read Today's Paper ICICI Bank Q2 Results: Net profit jumps 20% YoY to Rs 14,843 crore, NII rises 18% SECTIONS ICICI Bank Q2 Results: Net profit jumps 20% YoY to Rs 14,843 crore, NII rises 18% By Veer Sharma , ETMarkets.com Last Updated: Oct 17, 2026, 03:56:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis ICICI Bank Q2 Results: Private lender ICICI Bank reported a net profit ll_content": "Dussehra is a festival that symbolises the victory of good over evil. It will be celebrated on Tuesday, 20 October this year. Beyond its religious significance, the festival offers individuals an opportunity to reflect on financial habits that may be holding back long-term economic progress and prosperity.\n\nIn the same vein, it is vital to acknowledge that festive spending usually leads to increased shopping, travel, lavish expenses and celebrations. That is why managing money wisely is essential in order to avoid unnecessary debt and protect savings.\n\nYudhajit Baul, Founder of Yudhajit Financial Services Pvt Ltd, explained this in detail, stating, \u201cThis Dussehra , as we celebrate the triumph of good over evil, it is time to vanquish the financial demons holding your portfolio back. True financial liberation begins when you consciously choose to forego toxic habits such as failing to control your expenses, procrastinating on crucial savings, investments, and insurance, treating loans as a luxury rather than an absolute necessity, engaging in reckless trading and market speculation, and letting your hard-earned money be driven by volatile social media noise.\u201d\n\nKeeping these important observations in mind, let us now discuss six bad money habits that an individual should try to overcome this festive season in order to ensure long-term financial stability and economic well-being.\n\n1. Spending without a budget: Festive discounts, coupons, credit card offers, and lucrative looking deals can result in encouraging impulsive purchases and reckless financial decisions. That is why, to prepare for such a situation and address it objectively, it is wise for individuals to set a clear spending limit. Focus on prioritising essential expenses and avoid buying products and services simply because they are on sale.\n\n2. Delaying savings and investments: In order to grow meaningfully in life and career, it is important to save money.", "source": "LiveMint Money", "pub_date_str": "17 Oct 2026, 03:38 PM IST", "pub_date_relative": "1h ago"}, {"title": "German minister seeks debt brake exemption to maintain Ukraine aid", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Oct 2026, 03:31 PM IST", "pub_date_relative": "1h ago"}, {"title": "Nwpx infrastructure director Roman sells $387k in stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Oct 2026, 03:31 PM IST", "pub_date_relative": "1h ago"}, {"title": "Trump exempts Russia from further sanctions mandated by new law", "full_content": "US president gives Putin a reprieve on threatened energy measures after cutting deal with Moscow to release diesel", "source": "FT Markets", "pub_date_str": "17 Oct 2026, 03:23 PM IST", "pub_date_relative": "1h ago"}, {"title": "Looking to purchase gold this festive season? Here's how to directly avail Tyohar BharatPe Gold Offer", "full_content": "Investors across India choose to purchase gold during the auspicious festive season during Dhanteras and Diwali and this year is no exception. For those looking to invest in digital gold, fintech company BharatPe has launched its \u2018Tyohar BharatPe Gold Offer\u2019 providing customers with 5% extra digital gold and prizes from a pool of \u20b9 20 lakh.\n\nThe financial services and UPI payments company has launched the limited-period campaign \u2014 from 11 October to 10 November 2026, across the BharatPe ecosystem to mark the festive season, it said in an official release.\n\n\u201cWith the Tyohar BharatPe Gold Offer, BharatPe aims to make digital gold investments more rewarding during the festive season. The campaign combines an assured additional gold benefit on eligible purchases with a leaderboard challenge, offering customers two ways to participate in the festive initiative,\u201d it stated.\n\nCustomers can access the offer directly through the Invest BharatPe app. The mobile application enables digital gold investments, setting up gold SIPs, and tracking of customer's holdings through a single platform.\n\nFounded in 2018, BharatPe launched India\u2019s first UPI interoperable QR code and in 2020 also launched a card acceptance terminal \u2014 BharatPe Swipe. It currently has a registered network of over 1.7 crore merchants across more than 450+ cities.\n\nIt is among the leading players in UPI offline transactions , processing over 450 million UPI transactions per month, with monthly Transaction Processed Value of \u20b9 12,000 crore. Its POS business processes payments of over \u20b9 27,000 crore annually on more than 1,25,000 machines.\n\nDisclaimer: This story is for educational purposes only. The views and recommendations made above are those of individual analysts or broking companies, and not of Mint.", "source": "LiveMint Money", "pub_date_str": "17 Oct 2026, 03:23 PM IST", "pub_date_relative": "1h ago"}, {"title": "Nifty reclaims 200 WMA; eyes further gains as key resistance shapes next move", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Nifty reclaims 200 WMA; eyes further gains as key resistance shapes next move The Economic Times daily newspaper is available online now. Read Today's Paper Nifty reclaims 200 WMA; eyes further gains as key resistance shapes next move SECTIONS Nifty reclaims 200 WMA; eyes further gains as key resistance shapes next move By Milan Vaishnav , ET CONTRIBUTORS Last Updated: Oct 17, 2026, 03:37:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Indian equity markets rebounded 2.78%, with the Nifty reclaiming its crucial 200-week moving average. However, weak momentum indicators and overhead resistance warrant caution. Banking, metal, media, pharma and IT stocks show relative strength. Investors should monitor key support levels, prioritise fundamentally strong stocks and maintain disciplined risk management strategies.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "17 Oct 2026, 03:19 PM IST", "pub_date_relative": "1h ago"}, {"title": "Vescent's Bet On Profitable Quantum Technology, One Precision Clock At A Time", "full_content": "At the company's laboratories, CEO Scott Davis showcases stabilised lasers and optical references being tested, alongside frequency combs that link optical frequencies to measurable reference points.", "source": "NDTV Profit", "pub_date_str": "17 Oct 2026, 03:18 PM IST", "pub_date_relative": "1h ago"}, {"title": "Idt director Judah Schorr sells $1.12m in class B common stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Oct 2026, 03:15 PM IST", "pub_date_relative": "1h ago"}, {"title": "Nuveen municipal credit fund trustee Toth sells $71,811 in shares", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Oct 2026, 03:15 PM IST", "pub_date_relative": "1h ago"}, {"title": "Rs 50,000 Basic Salary? See How Much Your EPF Could Grow In 10, 20 And 30 Years", "full_content": "With higher wages eligible for contributions, p correction has left investors wondering what went wrong and whether the worst is over. Let\u2019s understand from experts, along with their take on railway PSU stocks outlook.\n\nThe decline in railway PSU stocks is more of a correction after decades of rally, according to Tushar Badjate, Director of Badjate Stock & shares Pvt Ltd.\n\n\"This is a valuation correction first and an earnings correction second. In 2023 and 2024, these stocks were priced for a decade of perfection. IRCTC hit an all-time high of \u20b9 1,318 in May 2024 and is now down about 61% from that peak. RVNL and IRFC have fallen between 45% and 53% from their 52-week highs,\u201d added Badjate while highlighting that three things went wrong for these PSU stocks.\n\nSlow growth and decline in margins were among the key things that went wrong for railway PSUs. \u201cWhat did not break is spending. Railway capex for FY27 is a record \u20b9 2.93 lakh crore. The money is flowing. It is just not reaching these companies at the old margins,\u201d highlighted Badjate.\n\nPSU stocks often attract heightened investor interest because of their government-backing, relative stability and long-term growth prospects. The sharp correction in railway PSU stocks is largely a result of investor expectations running ahead of fundamentals, according to Tushar Badjate.\n\nHowever earnings concerns are real and they are about margins not orders, underlined the expert.\n\n\u201cOrder books look healthy. RVNL has \u20b9 93,492 crore and RITES has a record \u20b9 9,445 crore. The problem is conversion. Only about \u20b9 40,000 crore of RVNL's book is actually under execution. Its EBITDA margin is just 4.4%.", "source": "LiveMint Markets", "pub_date_str": "17 Oct 2026, 02:53 PM IST", "pub_date_relative": "2h ago"}, {"title": "Anthropic\u2019s Clark says AI\u2019s impact accelerating quickly and could vastly boost US GDP", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Oct 2026, 02:48 PM IST", "pub_date_relative": "2h ago"}], "cfa": [{"title": "Nifty soars 2.8% this week: What lies ahead for Dalal Street? - Experts decode 5 triggers, key levels for next week", "full_content": "Stock Market Outlook : Indian equities staged a strong comeback this week, with the Nifty 50 rising 2.77% and the Sensex surging 3.11%, as renewed buying in information technology (IT) stocks, easing global bond-yield pressures and resilient domestic institutional inflows lifted investor sentiment.\n\nBoth benchmarks also extended their gains for a second consecutive session on Friday, strengthening hopes of a recovery after the recent market correction.\n\nOn Friday, the Sensex climbed 413.66 points, or 0.56%, to close at 74,729.27 on Friday, while the Nifty advanced 148.80 points, or 0.65%, to settle at 23,146.15. For the week, the Sensex gained 2,256.94 points, while the Nifty added 625.7 points.\n\nHowever, the rally faces several tests, including whether earnings growth broadens beyond IT, foreign investor selling eases further and the Nifty breaks through immediate resistance. Market experts believe investors should remain selective as global macroeconomic uncertainty and domestic inflation concerns persist.\n\nThe September-quarter earnings season will remain a major driver of market sentiment. Investors will assess whether companies can deliver stronger revenue growth and margins across banking, consumption and industrials, rather than relying primarily on IT stocks to sustain the recovery.\n\nVinod Nair, Head of Research at Geojit Investments Limited, said, \u201cThe sustainability of the recovery will hinge on earnings growth broadening beyond IT, with revenue and margin delivery across financials, consumption and industrials under close scrutiny.\u201d\n\nForeign institutional investor (FII) flows remain a key variable for the market.", "source": "LiveMint Markets", "pub_date_str": "17 Oct 2026, 05:04 PM IST", "pub_date_relative": "7m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Gold FoFs halt fresh investments, but silver mutual funds remain open: Experts decode the reasons and explain what to do", "full_content": "Investors can gain exposure to gold and silver through exchange-traded funds (ETFs), fund of funds (FoFs), and FOFs combining both metals. While ETFs trade on stock exchanges like shares and are backed by physical metal, FoFs invest in underlying ETFs and are priced at the end of the day.\n\nFollowing notices issued on 15 October 2026, several mutual fund houses have restricted fresh investments in gold FoFs and gold-silver FoFs , while gold ETFs, silver ETFs and FoFs remain open. Existing registered SIP s and STPs generally continue, while redemptions remain available.\n\nThe experts suggest that the move aims to curb gold imports and explain what investors should do.\n\nHarsh Vardhan Dawar, ACA, CFA, FRM, Founder of Wealth Cafe, said the restrictions align with the government's efforts to discourage gold investment and to offset some of the excess demand for physical gold as a result of the current festive season of Dussehra and Diwali, which also marks the wedding season of the year.\n\nEshaan Lazarus, Founder and CEO of 021 Trade, said gold has a greater impact on India's import bill. In FY2025-26, gold imports stood at about $72 billion against $12 billion for silver. During April-September 2026, gold imports were $19.27 billion and silver imports $2.40 billion, both lower year-on-year, partly following the May increase in import duty from 6% to 15%.\n\nHarsh Soni, Founder of NYVO Money, pointed to additional pressures, including rupee depreciation and Brent crude prices remaining above $105 a barrel. While oil imports are essential, gold imports can be curbed to ease pressure on the country's external balances.\n\n\u201cRestricting silver imports would hit manufacturing demand, not just investment demand. Silver has no cultural buying surge comparable to gold's Dhanteras peak,\u201d Soni added.\n\n\u201cIf silver inflows swell sharply, the same logic could be applied.", "source": "LiveMint Money", "pub_date_str": "17 Oct 2026, 05:00 PM IST", "pub_date_relative": "11m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "It was another great week for the average stock as market leadership shifts away from tech", "full_content": "The S&P 500\u2019s tech sector just had its worst week in a year and a half, while an equal-weighted version of the index cemented a second-straight weekly advance.", "source": "MarketWatch Top Stories", "pub_date_str": "17 Oct 2026, 05:00 PM IST", "pub_date_relative": "12m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Best 3 stocks to buy under \u20b9100: Equitas SFB, UCO Bank, Suzlon by Mehul Kothari of Anand Rathi \u2014 Target, stop-loss", "full_content": "Stocks to buy under \u20b9 100 | Mehul Kothari's stock recommendations: The Indian stock market recorded its strongest weekly gains in nearly six months for the week ended October 16, 2026, with the Sensex rising 3.11% to 74,729 and the Nifty 50 index gaining 2.8% to 23,146, marking their second consecutive weekly advance.\n\nThe rally was led by a spectacular 11.7% surge in the Nifty IT index, its biggest weekly gain in nearly 18 years, supported by strong Q2 results 2026 and a global rotation towards traditional technology stocks.\n\nHighlighting the major triggers, which fueled buying in Sensex, Nifty and other index-listed stocks, Mehul Kothari, Deputy Vice President \u2014 Technical Research at Anand Rathi, said, \u201cA stronger Indian Rupee, softer crude oil prices, domestic institutional buying and optimism around a potential India-US trade deal further supported sentiment. However, the rally remained concentrated in large caps, with midcaps posting modest gains while smallcaps largely lagged, alongside weakness in FMCG and pharma stocks.\u201d\n\nSpeaking on the outlook for the Nifty 50 index, Mehul Kothari said, the 50-stock index has staged a remarkable recovery, rallying nearly 1,000 points from its recent low of around 22,150 to a high near 23,150 in a short span. This validates our earlier stance of not panicking during the breakdown near 22,200, as highlighted by the \u2018Triple Bullish Divergence\u2019 on RSI across NIFTY 50, NIFTY 500, NIFTY MIDCAP 100 and NIFTY MIDCAP 150.\n\n\u201cWith selling pressure easing and momentum improving, we now maintain our BUY ON DIPS stance. The crucial support has shifted to 22,600, and holding above this level will keep bullish confidence intact. On the upside, 23,200 remains the immediate hurdle, and a sustained breakout above it could open the door towards 23,600 in the coming week.", "source": "LiveMint Markets", "pub_date_str": "17 Oct 2026, 04:58 PM IST", "pub_date_relative": "14m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "ICICI Bank Q2 profit beats estimates on strong loan growth", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Oct 2026, 04:51 PM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "InvestingPro Fair Value analysis captures 67% gain on Certara stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Oct 2026, 04:39 PM IST", "pub_date_relat
