    const allData = {"general": [{"title": "The \u201990s Are Back in Style. Levi\u2019s Is Cashing In. - WSJ", "full_content": "The \u201990s Are Back in Style. Levi\u2019s Is Cashing In. WSJ", "source": "Google News Business", "pub_date_str": "04 Oct 2026, 10:53 PM IST", "pub_date_relative": "18m ago"}, {"title": "Middletown packaging plant set to close; dozens of layoffs planned - wlwt.com", "full_content": "Middletown packaging plant set to close; dozens of layoffs planned wlwt.com Fortune 500 firm to permanently close suburban plant, lay off 91 employees The Business Journals Tri-State plant to close, nearly 100 to be laid off WKRC Middletown packaging plant to shut down, lay off dozens of employees Cincinnati Enquirer Middletown\u2019s Packaging Corp. of America to close, lay off 91 employees Journal-News.com", "source": "Google News Business", "pub_date_str": "04 Oct 2026, 10:37 PM IST", "pub_date_relative": "34m ago"}, {"title": "Are you building a house or commercial property? Know when TDS applies to contractor payments under Income Tax Act 2025", "full_content": "If you have hired a contractor to repair, renovate, design, or build your house, office, or business premises, you need to know whether TDS applies before making the payment.\n\nFor payments made on or after 1 April 2026, TDS on contractor payments is governed by Section 393(1) of the Income-tax Act, 2025.\n\nSo, when do you need to deduct TDS on payments to a contractor, what rate applies, and when is TDS not required? Here\u2019s what you need to know.\n\nThe person making the payment to the contractor is responsible for deducting TDS.\n\nFor payments covered under Section 393(1), Table Sl. No. 6(i), the payer must be a \u201cdesignated person\u201d covered by the law. This includes specified entities such as companies, firms, government bodies, local authorities and other persons covered by the provision.\n\nFor payments to a resident contractor for carrying out work under a contract:\n\nTDS must be deducted either when the contractor's payment is recorded in the payer's books or when the payment is actually made, whichever happens first.\n\nAn individual or Hindu Undivided Family (HUF) making payments covered under Section 393(1), Table Sl. No. 6(ii), is also required to deduct TDS if the amount or aggregate of such payments during the tax year exceeds \u20b9 50 lakh. The TDS rate in this case is 2%. This provision can apply to payments made for personal as well as commercial purposes.", "source": "LiveMint Money", "pub_date_str": "04 Oct 2026, 10:31 PM IST", "pub_date_relative": "40m ago"}, {"title": "Musk says he will rename SpaceXAI to SpaceXSI", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Oct 2026, 10:18 PM IST", "pub_date_relative": "53m ago"}, {"title": "Sukanya Samriddhi Yojana calculator: Your daughter may have \u20b972 lakh for her education; here\u2019s how", "full_content": "Welcoming a baby daughter can mark the beginning of saving for her future. Sukanya Samriddhi Yojana offers a way to build money for education and other future needs. If you start at her birth, the account\u2019s 21-year term aligns with her 21st birthday.\n\nAn annual investment of \u20b9 1.5 lakh in SSY could grow to around \u20b9 71.8 lakh. This estimate assumes an annual interest rate of 8.2% throughout the investment period. Your total contribution would be \u20b9 22.5 lakh. The remaining \u20b9 49.3 lakh would come from interest.\n\nThese figures imply annual contributions of \u20b9 1.5 lakh for 15 years. The money then continues to grow over the remaining 6 years. Starting in 2026 would place maturity in 2047, after the full 21-year term.\n\nHowever, \u20b9 71.8 lakh is an estimate, rather than a guaranteed final payment for the Sukanya Samriddhi Yojana . The Ministry of Finance reviews the interest rate every quarter. Future changes could affect the amount your daughter eventually receives. The 8.2% annual rate applies to October through December 2026.\n\nInterest is compounded yearly. This means interest becomes part of the balance used to calculate future interest. Over time, earnings themselves begin earning more money. In this example, the estimated interest exceeds around twice the total amount contributed.\n\nYou do not need to invest the maximum amount. Contributions can start at \u20b9 250, with an annual maximum of \u20b9 1.5 lakh. A smaller contribution would build a smaller final amount under otherwise similar assumptions. The final estimate, therefore, depends on both contributions and future interest rates.\n\nFor SSY , the annual maximum equals \u20b9 12,500, divided into 12 equal monthly amounts. This comparison helps explain the yearly commitment involved. However, the \u20b9 71.8 lakh estimate uses annual contributions, rather than a separate monthly calculation.\n\nThe scheme has government backing and offers tax benefits. Deposits qualify for an annual tax deduction of up to \u20b9 1.5 lakh.", "source": "LiveMint Money", "pub_date_str": "04 Oct 2026, 10:14 PM IST", "pub_date_relative": "57m ago"}, {"title": "Yemeni government launches offensive to seize all areas from Iran-backed Houthis", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Oct 2026, 10:06 PM IST", "pub_date_relative": "1h ago"}, {"title": "Woman at center of Cornell rape allegations targeted with threats, lawyer says", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Oct 2026, 10:06 PM IST", "pub_date_relative": "1h ago"}, {"title": "Trump adviser Hassett urges Powell to leave Fed board after renovation report", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Oct 2026, 10:06 PM IST", "pub_date_relative": "1h ago"}, {"title": "After Outcry, Monitors the Trump Administration Tried to Scrap Return to Sea - The New York Times", "full_content": "After Outcry, Monitors the Trump Administration Tried to Scrap Return to Sea The New York Times", "source": "Google News Business", "pub_date_str": "04 Oct 2026, 09:59 PM IST", "pub_date_relative": "1h ago"}, {"title": "Merz unveils fresh military aid in Kyiv, says Germany won\u2019t be intimidated", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Oct 2026, 09:42 PM IST", "pub_date_relative": "1h ago"}, {"title": "Kroger and Publix have a Costco problem they can\u2019t fix - thestreet.com", "full_content": "Kroger and Publix have a Costco problem they can\u2019t fix thestreet.com The Friday Checkout: Has Costco become grocery\u2019s biggest threat? Grocery Dive Costco makes strategic move to capitalize on growing trend Yahoo Finance", "source": "Google News Business", "pub_date_str": "04 Oct 2026, 09:38 PM IST", "pub_date_relative": "1h ago"}, {"title": "Mandaadi Box Office Collection Day 24: Soori Starrer Sees Drop In Collection, Will It Touch Rs 100 Crore In India?", "full_content": "The film's India gross collection currently stands at Rs 114.45 crore. Overseas, Mandaadi has earned Rs 17.95 crore in gross collections, taking its worldwide gross total to Rs 132.40 crore.", "source": "NDTV Profit", "pub_date_str": "04 Oct 2026, 09:34 PM IST", "pub_date_relative": "1h ago"}, {"title": "Exclusive | Inside Dodgers Owner Mark Walter\u2019s Charity, a Funding Shift Led the CEO to Quit - WSJ", "full_content": "Exclusive | Inside Dodgers Owner Mark Walter\u2019s Charity, a Funding Shift Led the CEO to Quit WSJ", "source": "Google News Business", "pub_date_str": "04 Oct 2026, 09:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "At airports, secret bars promise an escape. If you can find them. - The Washington Post", "full_content": "At airports, secret bars promise an escape. If you can find them. The Washington Post", "source": "Google News Business", "pub_date_str": "04 Oct 2026, 09:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "Uruguay Team Play Cricket At Eden Gardens; Visit Victoria Memorial, St Paul's Cathedral", "full_content": "The visit to Eden Gardens also carried a touch of history, with Uruguay having played at the venue during the inaugural Nehru Cup in 1982.", "source": "NDTV Profit", "pub_date_str": "04 Oct 2026, 09:24 PM IST", "pub_date_relative": "1h ago"}, {"title": "Bosnia votes Sunday in election that could affect EU bid", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Oct 2026, 09:24 PM IST", "pub_date_relative": "1h ago"}, {"title": "IPL mega auction or a masterclass in behavioural economics? Sunk cost fallacy, winner\u2019s curse, FOMO and more | Explained", "full_content": "The IPL mega auction offers more than expensive player deals. It also reveals how emotions can overpower planning. Franchise owners face psychological traps similar to those affecting stock market investors.\n\nConsider a team that values a star player at \u20b9 12 crore. A rival pushes the bidding to \u20b9 13 crore. The first team remembers hours of preparation and other players it missed. Walking away now feels like wasting that effort. It raises its bid to \u20b9 15 crore, abandoning its original limit.\n\nThis is the sunk cost fallacy. People let past spending or effort influence decisions that need fresh judgment. An investor might similarly hold a falling stock because it has already lost 30%. Instead of examining its current value, the investor waits for recovery.\n\nAnother trap is the winner\u2019s curse. A team pays \u20b9 25 crore for one player from its \u20b9 100 crore budget. Celebration soon gives way to concern. With much of its money spent, the team must choose cheaper, unproven players. Its remaining 20 squad places become harder to fill without weakening team balance.\n\nWinning the bid can therefore result in a loss. The price paid exceeds what makes sense for the buyer. Investors face something similar when buying heavily promoted shares at extremely high prices. Excitement can fade quickly when prices fall after listing.\n\nScarcity creates another powerful pressure. Suppose only two Indian fast-bowling all-rounders can bat at number seven. Teams fear losing a rare opportunity. A high opening bid then becomes their reference point, even when it seems inflated.\n\nThis is anchoring bias, where the first number strongly shapes later decisions. Investors can anchor their expectations to a share\u2019s previous peak or sudden price jump.\n\nFear of missing out ( FOMO ) adds urgency. Together, these feelings encourage expensive purchases while financial figures receive less attention.", "source": "LiveMint Money", "pub_date_str": "04 Oct 2026, 09:19 PM IST", "pub_date_relative": "1h ago"}, {"title": "Here are 3 things we're watching in the stock market in the week ahead", "full_content": "The oil and bond markets will remain a critical driver of stocks.", "source": "CNBC Top News", "pub_date_str": "04 Oct 2026, 09:03 PM IST", "pub_date_relative": "2h ago"}, {"title": "Portugal vs Norway Live Streaming: Likely Lineups; How To Watch UEFA Nations League Match On TV, Online?", "full_content": "The match will also be Portugal's first home game since Cristiano Ronaldo left the national team's training camp ahead of the Denmark fixture.", "source": "NDTV Profit", "pub_date_str": "04 Oct 2026, 09:00 PM IST", "pub_date_relative": "2h ago"}, {"title": "Which value mutual funds lead in 1-, 3- and 5-year CAGR returns? Are they outperforming on alpha too?", "full_content": "Value mutual funds invest at least 65% of their assets in equities following a value-investing strategy. Under this approach, fund managers look for stocks that appear undervalued relative to their fundamentals, with the expectation that their valuations may improve over time.\n\nAccording to AMFI August 2026 data, there are 23 value funds in the category. While one-year returns can highlight recent performance, investors looking at equity mutual funds may also want to check whether a fund has remained among the better performers over longer periods.\n\nSo, which value funds are consistently leading across one, three, and five years? And does their performance also show up in alpha?\n\n*Source: Value Research, Direct plans, Returns as on 1 October 2026\n\nLIC MF Value Fund leads the category on a one-year basis, with a 19.65% return, followed by Quant Value Fund at 11.71%. ABSL Value Fund, Mahindra Manulife Value Fund and Axis Value Fund complete the top five.\n\n*Source: Value Research, Direct plans, CAGR as on 1 October 2026\n\nQuant Value Fund leads the three-year return chart at 19.26%, followed by LIC MF Value Fund and Axis Value Fund. DSP Value Fund and HDFC Value Fund also feature among the top five.\n\n*Source: Value Research, Direct plans, CAGR as on 1 October 2026", "source": "LiveMint Money", "pub_date_str": "04 Oct 2026, 08:52 PM IST", "pub_date_relative": "2h ago"}, {"title": "Wi-Fi 5 vs Wi-Fi 6: Speed, Range, Devices And Key Differences Explained", "full_content": "From maximum speeds to the number of devices they can handle, here\u2019s how Wi-Fi 5 compares with the newer Wi-Fi 6 standard.", "source": "NDTV Profit", "pub_date_str": "04 Oct 2026, 08:49 PM IST", "pub_date_relative": "2h ago"}, {"title": "India within striking distance of 8% GDP growth, resilience not accidental: Shaktikanta Das", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Indicators \u203a India within striking distance of 8% GDP growth, resilience not accidental: Shaktikanta Das The Economic Times daily newspaper is available online now. Read Today's Paper India within striking distance of 8% GDP growth, resilience not accidental: Shaktikanta Das SECTIONS India within striking distance of 8% GDP growth, resilience not accidental: Shaktikanta Das By Kirtika Suneja , ET Bureau Last Updated: Oct 04, 2026, 08:48:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment 2019s 2027 COLA announcement coming soon: What to expect, Medicare costs AL.com Social Security's Trump Bump-Led 2027 COLA Will Be One of the Largest in 35 Years, but It May Financially Cripple America's Leading Retirement Program The Motley Fool", "source": "Google News Business", "pub_date_str": "04 Oct 2026, 08:02 PM IST", "pub_date_relative": "3h ago"}, {"title": "Luxury sneaker industry set to cross $75 billion in 5 years: Check top brands, leading market, customer segments", "full_content": "Luxury sneakers are becoming everyday fashion choices, driving strong growth in the global market. The market was worth $46.2 billion ( \u20b9 4.45 lakh crore) in 2025.\n\nIt is projected to reach $98.7 billion ( \u20b9 9.5 lakh crore) by 2034, with annual growth averaging 8.8%. At that pace, calculations suggest it could cross $75 billion ( \u20b9 7.22 lakh crore) by 2031, according to Data Intelo.\n\nAsia Pacific leads the race, accounting for 37.4% of global sales in 2025. Its market was worth around $17.3 billion ( \u20b9 1.66 lakh crore). The region is also expected to grow fastest, averaging 10.1% annually through 2034.\n\nChina drives regional demand, accounting for around 61% of the Asia-Pacific\u2019s luxury sneaker purchases. Its expanding middle class and strong resale culture support growth.\n\nSouth Korea benefits from K-pop influence while Japan remains an important sneaker fashion centre, according to Data Intelo. Indonesia, Thailand and Vietnam are also seeing rising demand.\n\nNorth America ranks second, holding 28.6% of the global market. Europe follows with 22.1%. The Middle East and Africa account for 6.7% while Latin America holds 5.2%.\n\nBrands including Balenciaga, Gucci and Golden Goose attract buyers through distinctive designs. Balenciaga\u2019s Triple S remains popular while Golden Goose is known for deliberately worn-looking shoes.\n\nGucci draws attention through prominent branding. Buyers pay between $400 ( \u20b9 38,500) and $2,500 ( \u20b9 2.4 lakh) for sneakers combining fashion appeal and cultural value. Resale was worth $7.1 billion ( \u20b9 68,391 crore) in 2025.", "source": "LiveMint Money", "pub_date_str": "04 Oct 2026, 08:00 PM IST", "pub_date_relative": "3h ago"}, {"title": "Avengers: Endgame: Encore Box Office Collection Day 9: Marvel Epic's Earnings Slow Down After Strong First Week", "full_content": "Avengers: Endgame: Encore collected Rs 1.07 crore on Day 9, witnessing an 11.5% drop from the previous day's Rs 1.21 crore. The Marvel re-release has earned Rs 43.33 crore in total after nine days.", "source": "NDTV Profit", "pub_date_str": "04 Oct 2026, 07:57 PM IST", "pub_date_relative": "3h ago"}, {"title": "Viksit Bharat By 2047 Is Within Reach, Says Shaktikanta Das; Names 5 Key Priorities", "full_content": "India can sustain its growth momentum towards the Viksit Bharat 2047 goal by focusing on AI, a deeper financial ecosystem, strategic self-reliance, sustainable development and human capital, Shaktikanta Das said.", "source": "NDTV Profit", "pub_date_str": "04 Oct 2026, 07:49 PM IST", "pub_date_relative": "3h ago"}, {"title": "Filing belated ITR for AY 2026-27? Know which losses you can carry forward under income tax rules\u2014 and ones you can't", "full_content": "Missing the ITR deadline does not necessarily mean you can no longer file your return. For AY 2026-27, taxpayers who missed the applicable due date can file a belated return until 31 December 2026.\n\nHowever, filing late can affect your ability to carry certain losses into future years. This is particularly important for taxpayers who have incurred losses from shares, mutual funds, property or other capital assets.\n\nUnder Section 139(4) of the Income-tax Act, 1961, a belated return for AY 2026-27 can be furnished by 31 December 2026 or before completion of assessment, whichever is earlier.\n\nA late-filing fee under Section 234F can also apply. It is \u20b9 1,000 if total income does not exceed \u20b9 5 lakh and \u20b9 5,000 in other cases.\n\nFor taxpayers who missed the July or August deadlines, this provides an additional window to submit their return. But filing within this extended period does not necessarily preserve every tax benefit.\n\nCapital losses are the key concern. If you want to take an unused capital loss into later years, the return for the year in which that loss arose must have been filed by the original due date under Section 139(1).\n\nThis covers both short-term capital loss (STCL) and long-term capital loss (LTCL).\n\nFor example, suppose you incur a \u20b9 2 lakh STCL in AY 2026-27 and have \u20b9 1 lakh of eligible short-term capital gains ( STCG ) in the same year. The loss can be used against those gains even if you are filing a belated return this year. If you subsequently earn \u20b9 1 lakh in short-term capital gains next year, the carried-forward loss can reduce the taxable gain to \u20b9 1 lakh.", "source": "LiveMint Money", "pub_date_str": "04 Oct 2026, 07:48 PM IST", "pub_date_relative": "3h ago"}, {"title": "Employers may soon be able to claim ITC on GST paid for employee insurance cover", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a Employers may soon be able to claim ITC on GST paid for employee insurance cover The Economic Times daily newspaper is available online now. Read Today's Paper Employers may soon be able to claim ITC on GST paid for employee insurance cover SECTIONS Employers may soon be able to claim ITC on GST paid for employee insurance cover By PTI Last Updated: Oct 04, 2026, 07:44:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The GST Council is gearing up to consider a proposal regarding input tax credit for employee insurance premiums. Currently, businesses cannot claim input tax credit on insurance policies purchased for their employees. An 18 percent GST is imposed on these group insurance policies, impacting business expenses.\n\nQ2 earnings season: Will it settle or add to confusion in the stock market?\n\nA for apple, Y for yak and, for the first time, a price next to it. Will this change the non-agri part of the rural economy?\n\nSix months after oil spiked, why are markets reacting so sharply now?\n\nGold paradox: Why India, a refining giant, is not a big bullion exporter\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "04 Oct 2026, 07:44 PM IST", "pub_date_relative": "3h ago"}, {"title": "Don't Trouble The Trouble Box Office Collection Day 2: Telugu Comedy-Drama Sees Sharp Drop In Earnings", "full_content": "The film stars Fahadh Faasil, Ssara Palekar and Saurabh Sachdeva, with Mahesh Manjrekar, Venkatesh Kakumanu and Subbaraju in supporting roles.", "source": "NDTV Profit", "pub_date_str": "04 Oct 2026, 07:38 PM IST", "pub_date_relative": "3h ago"}, {"title": "This NYC startup requires 4 days in office but just let everyone work remote for a whole month", "full_content": "Bruno Solari spent his August traveling all around Spain, starting with a week in Ibiza, continuing on to Madrid, M\u00e1laga, Marbella and Barcelona, before finally returning to Ibiza for a bachelor party.\n\nHe also managed to squeeze in a few meetings and client calls all throughout.\n\nSolari, founder and CEO of the New York City-based PR firm SolComms, was among his company's 53 employees enjoying their inaugural \"Work from Anywhere August.\" Other employees logged on from all over the U.S. (the Jersey Shore, the Hamptons, Florida) and the world (Berlin, Prague, London, Portugal).\n\n\"I was in Spain the entire month of August, and I would have felt like a hypocrite if I was going to be there and making my team be in-office,\" Solari, 33, tells CNBC Make It. \"So I thought, 'OK, I'm doing this myself. I'm going to grant that flexibility to the entire agency.'\"\n\nThe end-of-summer experiment felt like a worthwhile risk to the 3-year-old startup: Employee surveys of the trial indicate boosted productivity, work-life balance and happiness, while the business also saw a modest revenue boost. It also runs counter to several big companies scaling back on remote-work flexibility in a job market where employers have the upper hand.\n\n\"I think people were surprised that I went for it,\" Solari says.\n\nFour weeks of fully remote work from anywhere in the world is a bold move for the millennial founder, who came up in PR agencies at the height of the hustle culture era and says he holds more \"traditional\" workplace values, like building company culture through in-person interactions rather than \"through a screen\" of fully remote work. Since its founding in 2023, SolComms has operated with a four days in-office requirement, with Fridays at home that end at 3 p.m. most weeks (and 12 p.m. during the summer).\n\nSome 25% of full-time U.S.", "source": "CNBC Top News", "pub_date_str": "04 Oct 2026, 07:30 PM IST", "pub_date_relative": "3h ago"}, {"title": "Corporate America has never been this upbeat about future profits", "full_content": "As third-quarter earnings kick off this week, more companies than ever have expressed optimism about their bottom lines.", "source": "MarketWatch Top Stories", "pub_date_str": "04 Oct 2026, 07:30 PM IST", "pub_date_relative": "3h ago"}, {"title": "Detroit\u2019s Favorite Dish Is Beige, Bland, and Bad at Photos. But There\u2019s a Reason It Remains So Beloved. - Slate", "full_content": "Detroit\u2019s Favorite Dish Is Beige, Bland, and Bad at Photos. But There\u2019s a Reason It Remains So Beloved. Slate", "source": "Google News Business", "pub_date_str": "04 Oct 2026, 07:30 PM IST", "pub_date_relative": "3h ago"}, {"title": "Wall Street's AI Party Is On Edge As Soaring Yields Raise Risks", "full_content": "Just last week, the long bond yield reached 5.69% and the 10-year rate topped 5.3%, something neither has done since 2002.", "source": "NDTV Profit", "pub_date_str": "04 Oct 2026, 07:27 PM IST", "pub_date_relative": "3h ago"}, {"title": "'US Has Deliberately Become A Lonelier Power\u2019: Jaishankar On Changing World Order", "full_content": "From a changing US posture to China\u2019s economic rise, Jaishankar outlined the forces driving a rapidly changing global landscape.", "source": "NDTV Profit", "pub_date_str": "04 Oct 2026, 07:26 PM IST", "pub_date_relative": "3h ago"}, {"title": "Why Oil Is Still Stuck Near $100 a Barrel", "full_content": "The amount of crude flowing from the Middle East has almost returned to levels last seen before the US attacked Iran, triggering one of the biggest supply disruptions in history. But global prices remain stuck above $100, roughly 40% higher than when the conflict began. They\u2019re sending shock waves through the global economy, feeding inflation and squeezing industries and consumers alike.\n\nEven Friday\u2019s announcement that the Group of Seven nations and its partners would release as much as 100 million barrels of emergency oil and diesel stocks couldn\u2019t bring prices down. Instead, a confluence of problems is keeping them high.\n\nTraders fear the unresolved war could reignite at any time, particularly now that the US is deploying an additional aircraft carrier and more troops to the Persian Gulf. Even the current stalemate carries risks, with Iran attacking some ships as it tries to control the Strait of Hormuz.\n\nAt the same time, oil inventories worldwide have been heavily depleted, now sitting at their lowest point in five years. Russia\u2019s ongoing war with Ukraine has blocked exports from many refineries that turn crude into finished fuels, so refineries elsewhere are willing to pay top dollar to lock in the oil supplies they need to run nonstop.\n\nAnd the sheer difficulty of moving oil out of a war zone via different shipping routes adds its own costs.\n\n\u201cWe\u2019ve lost supply, drawn down inventories and disrupted the ability to turn crude into products like diesel. Getting the oil moving again doesn\u2019t instantly fix any of that.\u201d said Haris Khurshid, chief investment officer at Chicago-based Karobaar Capital LP.\n\nThe market remains concerned fighting could escalate. The US and Iran are far apart on their demands for ending the war, and while they haven\u2019t returned to the all-out hostilities seen this spring, they have at times traded blows.", "source": "LiveMint Markets", "pub_date_str": "04 Oct 2026, 07:22 PM IST", "pub_date_relative": "3h ago"}, {"title": "OPEC+ agrees to keep November oil output targets steady", "full_content": "OPEC+ agreed to keep oil production targets steady for November at a meeting on Sunday, the producer group said, in line with expectations that further output policy adjustments are unlikely until next year.\n\nSeven core members of the group comprising the Organization of the Petroleum Exporting Countries and allies including Russia made the decision for November in a brief online meeting on Sunday. The core members are Saudi Arabia, Russia, Iraq, Kuwait, Algeria, Kazakhstan and Oman.\n\nGulf OPEC+ producers have been pumping well below output targets in the face of continuing export disruptions from the U.S.-Israeli war on Iran , with exports fluctuating at 60% to 80% of normal levels in recent months.\n\n\"The OPEC+ group of seven kept their production ceilings unchanged, in line with market expectations. That said, despite rising flows through the Strait of Hormuz, their output levels remain well below quota,\" said UBS analyst Giovanni Staunovo.\n\nOil prices had dropped on Friday after European leaders agreed to U.S. President Donald Trump's request to release diesel reserves. Crude oil prices settled lower after the Group of Seven nations announced the release of diesel and crude stocks to ease surging fuel prices.\n\nInternational benchmark Brent crude futures slipped 6 cents to close at $102.25 per barrel, while U.S. West Texas Intermediate crude slid $1.76 to $91.11 a barrel.\n\nThe G7 will release 100 million barrels of reserves over the next four months \"with a frontloaded substantial diesel release within the first 20 days,\" the group's leaders said in a joint statement. The G7 includes France, Canada, Germany, Italy, Japan, the United Kingdom and the U.S.\n\nDespite the G7 announcement, Brent crude remains above $100 a barrel, up from about $73 before the Iran war started in late February.", "source": "CNBC Top News", "pub_date_str": "04 Oct 2026, 07:19 PM IST", "pub_date_relative": "3h ago"}, {"title": "Starting a watch collection? What beginners should know before buying", "full_content": "Though smartphones and wearable devices like fitness bands can accurately tell time, many people still prefer using traditional watches whether for convenience, aesthetics or an appreciation of a well-constructed analog device. In fact, though the luxury market has been in a bit of a slump , watches are a big industry, with a global market exceeding $135 billion and annual growth projections exceeding 5.6%, according to the data aggregator Statista .\n\nA watch can convey status or accessorize an outfit, but they're also popular as collectibles . For beginners, watch collecting is best treated as a hobby first: Most watches lose value, while those that do appreciate can be difficult to identify and buy at retail.\n\nCNBC recently spoke with experts in the business to find out what a beginner might want to consider when starting a watch collection.\n\nFirst and foremost, building a collection because you enjoy the looks, mechanical details or history of watches can be satisfying. Collectibles are also becoming more accepted as an alternative investing asset class. But experts advise that you aren't likely to outperform more traditional investments.\n\nCharles Tian, the founder and CEO of WatchCharts, a market-research platform that tracks used-watch prices, explained that it's possible to make money buying and selling watches, but collectors are unlikely to beat investments such as an S&P 500 Index over the long term.", "source": "CNBC Top News", "pub_date_str": "04 Oct 2026, 07:14 PM IST", "pub_date_relative": "3h ago"}, {"title": "Saffron In The Cold Desert? Ladakh Is Putting 90,000 Iranian Corms To The Test", "full_content": "With 800 kg of Iranian saffron corms planted in Leh, Ladakh is testing the potential of a premium crop in its harsh mountain terrain.", "source": "NDTV Profit", "pub_date_str": "04 Oct 2026, 07:10 PM IST", "pub_date_relative": "4h ago"}, {"title": "Explainer-Who are the Houthis, Iran\u2019s allies in Yemen?", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Oct 2026, 07:06 PM IST", "pub_date_relative": "4h ago"}, {"title": "GST 2.0's next move: Council may scrap officers' arrest powers, raise prosecution bar to Rs 5 crore", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a GST 2.0's next move: Council may scrap officers' arrest powers, raise prosecution bar to Rs 5 crore The Economic Times daily newspaper is available online now. Read Today's Paper GST 2.0's next move: Council may scrap officers' arrest powers, raise prosecution bar to Rs 5 crore SECTIONS GST 2.0's next move: Council may scrap officers' arrest powers, raise prosecution bar to Rs 5 crore ET Online Last Updated: Oct 04, 2026, 07:14:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The GST Council is weighing changes to GST enforcement, including ending officials' arrest powers and shifting to court-ordered arrests. Criminal prosecution may be limited to cases involving more than Rs 5 crore, while routine disputes over GST interpretation could be handled through civil penalties and kept outside criminal courts.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\nQ2 earnings season: Will it settle or add to confusion in the stock market?\n\nA for apple, Y for yak and, for the first time, a price next to it. Will this change the non-agri part of the rural economy?\n\nSix months after oil spiked, why are markets reacting so sharply now?\n\nGold paradox: Why India, a refining giant, is not a big bullion exporter\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers", "source": "Economic Times Economy", "pub_date_str": "04 Oct 2026, 07:05 PM IST", "pub_date_relative": "4h ago"}], "cfa": [{"title": "Sukanya Samriddhi Yojana calculator: Your daughter may have \u20b972 lakh for her education; here\u2019s how", "full_content": "Welcoming a baby daughter can mark the beginning of saving for her future. Sukanya Samriddhi Yojana offers a way to build money for education and other future needs. If you start at her birth, the account\u2019s 21-year term aligns with her 21st birthday.\n\nAn annual investment of \u20b9 1.5 lakh in SSY could grow to around \u20b9 71.8 lakh. This estimate assumes an annual interest rate of 8.2% throughout the investment period. Your total contribution would be \u20b9 22.5 lakh. The remaining \u20b9 49.3 lakh would come from interest.\n\nThese figures imply annual contributions of \u20b9 1.5 lakh for 15 years. The money then continues to grow over the remaining 6 years. Starting in 2026 would place maturity in 2047, after the full 21-year term.\n\nHowever, \u20b9 71.8 lakh is an estimate, rather than a guaranteed final payment for the Sukanya Samriddhi Yojana . The Ministry of Finance reviews the interest rate every quarter. Future changes could affect the amount your daughter eventually receives. The 8.2% annual rate applies to October through December 2026.\n\nInterest is compounded yearly. This means interest becomes part of the balance used to calculate future interest. Over time, earnings themselves begin earning more money. In this example, the estimated interest exceeds around twice the total amount contributed.\n\nYou do not need to invest the maximum amount. Contributions can start at \u20b9 250, with an annual maximum of \u20b9 1.5 lakh. A smaller contribution would build a smaller final amount under otherwise similar assumptions. The final estimate, therefore, depends on both contributions and future interest rates.\n\nFor SSY , the annual maximum equals \u20b9 12,500, divided into 12 equal monthly amounts. This comparison helps explain the yearly commitment involved. However, the \u20b9 71.8 lakh estimate uses annual contributions, rather than a separate monthly calculation.\n\nThe scheme has government backing and offers tax benefits. Deposits qualify for an annual tax deduction of up to \u20b9 1.5 lakh.", "source": "LiveMint Money", "pub_date_str": "04 Oct 2026, 10:14 PM IST", "pub_date_relative": "57m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "IPL mega auction or a masterclass in behavioural economics? Sunk cost fallacy, winner\u2019s curse, FOMO and more | Explained", "full_content": "The IPL mega auction offers more than expensive player deals. It also reveals how emotions can overpower planning. Franchise owners face psychological traps similar to those affecting stock market investors.\n\nConsider a team that values a star player at \u20b9 12 crore. A rival pushes the bidding to \u20b9 13 crore. The first team remembers hours of preparation and other players it missed. Walking away now feels like wasting that effort. It raises its bid to \u20b9 15 crore, abandoning its original limit.\n\nThis is the sunk cost fallacy. People let past spending or effort influence decisions that need fresh judgment. An investor might similarly hold a falling stock because it has already lost 30%. Instead of examining its current value, the investor waits for recovery.\n\nAnother trap is the winner\u2019s curse. A team pays \u20b9 25 crore for one player from its \u20b9 100 crore budget. Celebration soon gives way to concern. With much of its money spent, the team must choose cheaper, unproven players. Its remaining 20 squad places become harder to fill without weakening team balance.\n\nWinning the bid can therefore result in a loss. The price paid exceeds what makes sense for the buyer. Investors face something similar when buying heavily promoted shares at extremely high prices. Excitement can fade quickly when prices fall after listing.\n\nScarcity creates another powerful pressure. Suppose only two Indian fast-bowling all-rounders can bat at number seven. Teams fear losing a rare opportunity. A high opening bid then becomes their reference point, even when it seems inflated.\n\nThis is anchoring bias, where the first number strongly shapes later decisions. Investors can anchor their expectations to a share\u2019s previous peak or sudden price jump.\n\nFear of missing out ( FOMO ) adds urgency. Together, these feelings encourage expensive purchases while financial figures receive less attention.", "source": "LiveMint Money", "pub_date_str": "04 Oct 2026, 09:19 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Here are 3 things we're watching in the stock market in the week ahead", "full_content": "The oil and bond markets will remain a critical driver of stocks.", "source": "CNBC Top News", "pub_date_str": "04 Oct 2026, 09:03 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments", "Fixed Income"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Which value mutual funds lead in 1-, 3- and 5-year CAGR returns? Are they outperforming on alpha too?", "full_content": "Value mutual funds invest at least 65% of their assets in equities following a value-investing strategy. Under this approach, fund managers look for stocks that appear undervalued relative to their fundamentals, with the expectation that their valuations may improve over time.\n\nAccording to AMFI August 2026 data, there are 23 value funds in the category. While one-year returns can highlight recent performance, investors looking at equity mutual funds may also want to check whether a fund has remained among the better performers over longer periods.\n\nSo, which value funds are consistently leading across one, three, and five years? And does their performance also show up in alpha?\n\n*Source: Value Research, Direct plans, Returns as on 1 October 2026\n\nLIC MF Value Fund leads the category on a one-year basis, with a 19.65% return, followed by Quant Value Fund at 11.71%. ABSL Value Fund, Mahindra Manulife Value Fund and Axis Value Fund complete the top five.\n\n*Source: Value Research, Direct plans, CAGR as on 1 October 2026\n\nQuant Value Fund leads the three-year return chart at 19.26%, followed by LIC MF Value Fund and Axis Value Fund. DSP Value Fund and HDFC Value Fund also feature among the top five.\n\n*Source: Value Research, Direct plans, CAGR as on 1 October 2026", "source": "LiveMint Money", "pub_date_str": "04 Oct 2026, 08:52 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "India within striking distance of 8% GDP growth, resilience not accidental: Shaktikanta Das", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME n for banks, nominated agencies for gold, silver imports may be withdrawn", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a GST exemption for banks, nominated agencies for gold, silver imports may be withdrawn The Economic Times daily newspaper is available online now. Read Today's Paper GST exemption for banks, nominated agencies for gold, silver imports may be withdrawn SECTIONS GST exemption for banks, nominated agencies for gold, silver imports may be withdrawn PTI Last Updated: Oct 04, 2026, 08:40:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The GST Council may end the IGST exemption on gold, silver and platinum imported by banks and nominated agencies, sources said. The exemption, introduced in 2017 when precious-metal imports were tightly regulated, could be withdrawn as the government seeks to curb non-essential imports and manage foreign exchange outflows.\n\nQ2 earnings season: Will it settle or add to confusion in the stock market?\n\nA for apple, Y for yak and, for the first time, a price next to it. Will this change the non-agri part of the rural economy?\n\nSix months after oil spiked, why are markets reacting so sharply now?\n\nGold paradox: Why India, a refining giant, is not a big bullion exporter\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "04 Oct 2026, 08:40 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Argentina Offers Citizenship For Investment: Rs 3.37 Crore Payment Vs Rs 7.71 Crore Bond", "full_content": "Argentina\u2019s new citizenship-by-investment programme offers foreign applicants two routes, requiring either a non-refundable $350,000 payment, around Rs 3.37 crore, or an $800,000 government bond worth nearly Rs 7.71 crore.", "source": "NDTV Profit", "pub_date_str": "04 Oct 2026, 08:33 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "GST Council may clear sweeping compliance reforms; e-commerce sellers, genuine buyers to get relief", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a GST Council may clear sweeping compliance reforms; e-commerce sellers, genuine buyers to get relief The Economic Times daily newspaper is available online now. Read Today's Paper GST Council may clear sweeping compliance reforms; e-commerce sellers, genuine buyers to get relief SECTIONS GST Council may clear sweeping compliance reforms; e-commerce sellers, genuine buyers to get relief ET Online Last Updated: Oct 04, 2026, 08:05:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The GST Council will assess various procedural reforms aimed at simplifying tax compliance for businesses. Proposed measures include enabling small e-commerce vendors to register using platform warehouses. Additionally, the input tax credit for genuine buyers will be protected even if suppliers fail to remit tax.\n\nQ2 earnings season: Will it settle or add to confusion in the stock market?\n\nA for apple, Y for yak and, for the first time, a price next to it. Will this change the non-agri part of the rural economy?\n\nSix months after oil spiked, why are markets reacting so sharply now?\n\nGold paradox: Why India, a refining giant, is not a big bullion exporter\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers\n\nLogin using your ET Prime credentials to enjoy all member benefits", "source": "Economic Times Economy", "pub_date_str": "04 Oct 2026, 08:05 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Luxury sneaker industry set to cross $75 billion in 5 years: Check top brands, leading market, customer segments", "full_content": "Luxury sneakers are becoming everyday fashion choices, driving strong growth in the global market. The market was worth $46.2 billion ( \u20b9 4.45 lakh crore) in 2025.\n\nIt is projected to reach $98.7 billion ( \u20b9 9.5 lakh crore) by 2034, with annual growth averaging 8.8%. At that pace, calculations suggest it could cross $75 billion ( \u20b9 7.22 lakh crore) by 2031, according to Data Intelo.\n\nAsia Pacific leads the race, accounting for 37.4% of global sales in 2025. Its market was worth around $17.3 billion ( \u20b9 1.66 lakh crore). The region is also expected to grow fastest, averaging 10.1% annually through 2034.\n\nChina drives regional demand, accounting for around 61% of the Asia-Pacific\u2019s luxury sneaker purchases. Its expanding middle class and strong resale culture support growth.\n\nSouth Korea benefits from K-pop influence while Japan remains an important sneaker fashion centre, according to Data Intelo. Indonesia, Thailand and Vietnam are also seeing rising demand.\n\nNorth America ranks second, holding 28.6% of the global market. Europe follows with 22.1%. The Middle East and Africa account for 6.7% while Latin America holds 5.2%.\n\nBrands including Balenciaga, Gucci and Golden Goose attract buyers through distinctive designs. Balenciaga\u2019s Triple S remains popular while Golden Goose is known for deliberately worn-looking shoes.\n\nGucci draws attention through prominent branding. Buyers pay between $400 ( \u20b9 38,500) and $2,500 ( \u20b9 2.4 lakh) for sneakers combining fashion appeal and cultural value. Resale was worth $7.1 billion ( \u20b9 68,391 crore) in 2025.", "source": "LiveMint Money", "pub_date_str": "04 Oct 2026, 08:00 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Avengers: Endgame: Encore Box Office Collection Day 9: Marvel Epic's Earnings Slow Down After Strong First Week", "full_content": "Avengers: Endgame: Encore collected Rs 1.07 crore on Day 9, witnessing an 11.5% drop from the previous day's Rs 1.21 crore. The Marvel re-release has earned Rs 43.33 crore in total after nine days.", "source": "NDTV Profit", "pub_date_str": "04 Oct 2026, 07:57 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Viksit Bharat By 2047 Is Within Reach, Says Shaktikanta Das; Names 5 Key Priorities", "full_content": "India can sustain its growth momentum towards the Viksit Bharat 2047 goal by focusing on AI, a deeper financial ecosystem, strategic self-reliance, sustainable development and human capital, Shaktikanta Das said.", "source": "NDTV Profit", "pub_date_str": "04 Oct 2026, 07:49 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Filing belated ITR for AY 2026-27? Know which losses you can carry forward under income tax rules\u2014 and ones you can't", "full_content": "Missing the ITR deadline does not necessarily mean you can no longer file your return. For AY 2026-27, taxpayers who missed the applicable due date can file a belated return until 31 December 2026.\n\nHowever, filing late can affect your ability to carry certain losses into future years. This is particularly important for taxpayers who have incurred losses from shares, mutual funds, property or other capital assets.\n\nUnder Section 139(4) of the Income-tax Act, 1961, a belated return for AY 2026-27 can be furnished by 31 December 2026 or before completion of assessment, whichever is earlier.\n\nA late-filing fee under Section 234F can also apply. It is \u20b9 1,000 if total income does not exceed \u20b9 5 lakh and \u20b9 5,000 in other cases.\n\nFor taxpayers who missed the July or August deadlines, this provides an additional window to submit their return. But filing within this extended period does not necessarily preserve every tax benefit.\n\nCapital losses are the key concern. If you want to take an unused capital loss into later years, the return for the year in which that loss arose must have been filed by the original due date under Section 139(1).\n\nThis covers both short-term capital loss (STCL) and long-term capital loss (LTCL).\n\nFor example, suppose you incur a \u20b9 2 lakh STCL in AY 2026-27 and have \u20b9 1 lakh of eligible short-term capital gains ( STCG ) in the same year. The loss can be used against those gains even if you are filing a belated return this year. If you subsequently earn \u20b9 1 lakh in short-term capital gains next year, the carried-forward loss can reduce the taxable gain to \u20b9 1 lakh.", "source": "LiveMint Money", "pub_date_str": "04 Oct 2026, 07:48 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Employers may soon be able to claim ITC on GST paid for employee insurance cover", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a Employers may soon be able to claim ITC on GST paid for employee insurance cover The Economic Times daily newspaper is available online now. Read Today's Paper Employers may soon be able to claim ITC on GST paid for employee insurance cover SECTIONS Employers may soon be able to claim ITC on GST paid for employee insurance cover By PTI Last Updated: Oct 04, 2026, 07:44:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The GST Council is gearing up to consider a proposal regarding input tax credit for employee insurance premiums. Currently, businesses cannot claim input tax credit on insurance policies purchased for their employees. An 18 percent GST is imposed on these group insurance policies, impacting business expenses.\n\nQ2 earnings season: Will it settle or add to confusion in the stock market?\n\nA for apple, Y for yak and, for the first time, a price next to it. Will this change the non-agri part of the rural economy?\n\nSix months after oil spiked, why are markets reacting so sharply now?\n\nGold paradox: Why India, a refining giant, is not a big bullion exporter\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "04 Oct 2026, 07:44 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Don't Trouble The Trouble Box Office Collection Day 2: Telugu Comedy-Drama Sees Sharp Drop In Earnings", "full_content": "The film stars Fahadh Faasil, Ssara Palekar and Saurabh Sachdeva, with Mahesh Manjrekar, Venkatesh Kakumanu and Subbaraju in supporting roles.", "source": "NDTV Profit", "pub_date_str": "04 Oct 2026, 07:38 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "This NYC startup requires 4 days in office but just let everyone work remote for a whole month", "full_content": "Bruno Solari spent his August traveling all around Spain, starting with a week in Ibiza, continuing on to Madrid, M\u00e1laga, Marbella and Barcelona, before finally returning to Ibiza for a bachelor party.\n\nHe also managed to squeeze in a few meetings and client calls all throughout.\n\nSolari, founder and CEO of the New York City-based PR firm SolComms, was among his company's 53 employees enjoying their inaugural \"Work from Anywhere August.\" Other employees logged on from all over the U.S. (the Jersey Shore, the Hamptons, Florida) and the world (Berlin, Prague, London, Portugal).\n\n\"I was in Spain the entire month of August, and I would have felt like a hypocrite if I was going to be there and making my team be in-office,\" Solari, 33, tells CNBC Make It. \"So I thought, 'OK, I'm doing this myself. I'm going to grant that flexibility to the entire agency.'\"\n\nThe end-of-summer experiment felt like a worthwhile risk to the 3-year-old startup: Employee surveys of the trial indicate boosted productivity, work-life balance and happiness, while the business also saw a modest revenue boost. It also runs counter to several big companies scaling back on remote-work flexibility in a job market where employers have the upper hand.\n\n\"I think people were surprised that I went for it,\" Solari says.\n\nFour weeks of fully remote work from anywhere in the world is a bold move for the millennial founder, who came up in PR agencies at the height of the hustle culture era and says he holds more \"traditional\" workplace values, like building company culture through in-person interactions rather than \"through a screen\" of fully remote work. Since its founding in 2023, SolComms has operated with a four days in-office requirement, with Fridays at home that end at 3 p.m. most weeks (and 12 p.m. during the summer).\n\nSome 25% of full-time U.S.", "source": "CNBC Top News", "pub_date_str": "04 Oct 2026, 07:30 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Corporate America has never been this upbeat about future profits", "full_content": "As third-quarter earnings kick off this week, more companies than ever have expressed optimism about their bottom lines.", "source": "MarketWatch Top Stories", "pub_date_str": "04 Oct 2026, 07:30 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Wall Street's AI Party Is On Edge As Soaring Yields Raise Risks", "full_content": "Just last week, the long bond yield reached 5.69% and the 10-year rate topped 5.3%, something neither has done since 2002.", "source": "NDTV Profit", "pub_date_str": "04 Oct 2026, 07:27 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Why Oil Is Still Stuck Near $100 a Barrel", "full_content": "The amount of crude flowing from the Middle East has almost returned to levels last seen before the US attacked Iran, triggering one of the biggest supply disruptions in history. But global prices remain stuck above $100, roughly 40% higher than when the conflict began. They\u2019re sending shock waves through the global economy, feeding inflation and squeezing industries and consumers alike.\n\nEven Friday\u2019s announcement that the Group of Seven nations and its partners would release as much as 100 million barrels of emergency oil and diesel stocks couldn\u2019t bring prices down. Instead, a confluence of problems is keeping them high.\n\nTraders fear the unresolved war could reignite at any time, particularly now that the US is deploying an additional aircraft carrier and more troops to the Persian Gulf. Even the current stalemate carries risks, with Iran attacking some ships as it tries to control the Strait of Hormuz.\n\nAt the same time, oil inventories worldwide have been heavily depleted, now sitting at their lowest point in five years. Russia\u2019s ongoing war with Ukraine has blocked exports from many refineries that turn crude into finished fuels, so refineries elsewhere are willing to pay top dollar to lock in the oil supplies they need to run nonstop.\n\nAnd the sheer difficulty of moving oil out of a war zone via different shipping routes adds its own costs.\n\n\u201cWe\u2019ve lost supply, drawn down inventories and disrupted the ability to turn crude into products like diesel. Getting the oil moving again doesn\u2019t instantly fix any of that.\u201d said Haris Khurshid, chief investment officer at Chicago-based Karobaar Capital LP.\n\nThe market remains concerned fighting could escalate. The US and Iran are far apart on their demands for ending the war, and while they haven\u2019t returned to the all-out hostilities seen this spring, they have at times traded blows.", "source": "LiveMint Markets", "pub_date_str": "04 Oct 2026, 07:22 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "OPEC+ agrees to keep November oil output targets steady", "full_content": "OPEC+ agreed to keep oil production targets steady for November at a meeting on Sunday, the producer group said, in line with expectations that further output policy adjustments are unlikely until next year.\n\nSeven core members of the group comprising the Organization of the Petroleum Exporting Countries and allies including Russia made the decision for November in a brief online meeting on Sunday. The core members are Saudi Arabia, Russia, Iraq, Kuwait, Algeria, Kazakhstan and Oman.\n\nGulf OPEC+ producers have been pumping well below output targets in the face of continuing export disruptions from the U.S.-Israeli war on Iran , with exports fluctuating at 60% to 80% of normal levels in recent months.\n\n\"The OPEC+ group of seven kept their production ceilings unchanged, in line with market expectations. That said, despite rising flows through the Strait of Hormuz, their output levels remain well below quota,\" said UBS analyst Giovanni Staunovo.\n\nOil prices had dropped on Friday after European leaders agreed to U.S. President Donald Trump's request to release diesel reserves. Crude oil prices settled lower after the Group of Seven nations announced the release of diesel and crude stocks to ease surging fuel prices.\n\nInternational benchmark Brent crude futures slipped 6 cents to close at $102.25 per barrel, while U.S. West Texas Intermediate crude slid $1.76 to $91.11 a barrel.\n\nThe G7 will release 100 million barrels of reserves over the next four months \"with a frontloaded substantial diesel release within the first 20 days,\" the group's leaders said in a joint statement. The G7 includes France, Canada, Germany, Italy, Japan, the United Kingdom and the U.S.\n\nDespite the G7 announcement, Brent crude remains above $100 a barrel, up from about $73 before the Iran war started in late February.", "source": "CNBC Top News", "pub_date_str": "04 Oct 2026, 07:19 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics", "Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Starting a watch collection? What beginners should know before buying", "full_content": "Though smartphones and wearable devices like fitness bands can accurately tell time, many people still prefer using traditional watches whether for convenience, aesthetics or an appreciation of a well-constructed analog device. In fact, though the luxury market has been in a bit of a slump , watches are a big industry, with a global market exceeding $135 billion and annual growth projections exceeding 5.6%, according to the data aggregator Statista .\n\nA watch can convey status or accessorize an outfit, but they're also popular as collectibles . For beginners, watch collecting is best treated as a hobby first: Most watches lose value, while those that do appreciate can be difficult to identify and buy at retail.\n\nCNBC recently spoke with experts in the business to find out what a beginner might want to consider when starting a watch collection.\n\nFirst and foremost, building a collection because you enjoy the looks, mechanical details or history of watches can be satisfying. Collectibles are also becoming more accepted as an alternative investing asset class. But experts advise that you aren't likely to outperform more traditional investments.\n\nCharles Tian, the founder and CEO of WatchCharts, a market-research platform that tracks used-watch prices, explained that it's possible to make money buying and selling watches, but collectors are unlikely to beat investments such as an S&P 500 Index over the long term.", "source": "CNBC Top News", "pub_date_str": "04 Oct 2026, 07:14 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "GST 2.0's next move: Council may scrap officers' arrest powers, raise prosecution bar to Rs 5 crore", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a GST 2.0's next move: Council may scrap officers' arrest powers, raise prosecution bar to Rs 5 crore The Economic Times daily newspaper is available online now. Read Today's Paper GST 2.0's next move: Council may scrap officers' arrest powers, raise prosecution bar to Rs 5 crore SECTIONS GST 2.0's next move: Council may scrap officers' arrest powers, raise prosecution bar to Rs 5 crore ET Online Last Updated: Oct 04, 2026, 07:14:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The GST Council is weighing changes to GST enforcement, including ending officials' arrest powers and shifting to court-ordered arrests. Criminal prosecution may be limited to cases involving more than Rs 5 crore, while routine disputes over GST interpretation could be handled through civil penalties and kept outside criminal courts.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\nQ2 earnings season: Will it settle or add to confusion in the stock market?\n\nA for apple, Y for yak and, for the first time, a price next to it. Will this change the non-agri part of the rural economy?\n\nSix months after oil spiked, why are markets reacting so sharply now?\n\nGold paradox: Why India, a refining giant, is not a big bullion exporter\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers", "source": "Economic Times Economy", "pub_date_str": "04 Oct 2026, 07:05 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Top Wall Street analysts are upbeat about the prospects for these 3 stocks", "full_content": "September ended on a mixed note, with the S&P 500 and Dow Jones Industrial Average falling 0.5% and 4.3%, respectively, while the Nasdaq Composite climbed 1.9%. Markets remained on edge with higher oil prices and Treasury yields weighing on investor sentiment and triggering fears of additional interest rate hikes.\n\nIn this climate, investors with a long-term horizon can track recommendations from top Wall Street analysts to find stocks with solid growth prospects.\n\nHere are three stocks favored by some of Wall Street's top pros, according to TipRanks, a platform that ranks analysts based on their past performance.\n\nNeocloud company CoreWeave ( CRWV ) is benefiting from robust AI-driven demand for cloud computing.\n\nRecently, JPMorgan analyst Samik Chatterjee upgraded CoreWeave to buy from hold, raising his price target to $125 from $120. The analyst cited favorable pricing, driven by solid demand, for the upgrade.\n\nChatterjee said CoreWeave is now more willing to sign premium priced, shorter-term contracts, which lift his revenue and margin estimates. CRWV stock performance has been underwhelming as investors worry about high capital spending, the analyst noted. That said, he believes that higher prices and increased margins will more than offset the rise in debt to fund capital spending, improving the stock's valuation.\n\nChatterjee noted the 25% price hike in July across CoreWeave's product offerings and frequent price increases by rivals like Nebius (NBIS), adding that some peers are charging nearly three times more for short-term compute contracts than what CoreWeave charges on longer-term deals.\n\n\"CoreWeave's leverage of the opportunity [is] evident in its recent press release highlighting contracts signed in F3Q at ~$40M/MW,\" said Chatterjee. JPMorgan said higher pricing is already contributing 5-10 percentage points to contract margins versus earlier deals.", "source": "CNBC Top News", "pub_date_str": "04 Oct 2026, 06:54 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "A 'weird' IPO pull, a tainted reputation and the stalled breakout moment for AI wearables", "full_content": "Two years ago, Bella Nowroozi was on a date at the mall when she noticed something odd: A blinking light on her companion's glasses.\n\nThe 24-year-old master's student instantly recognized the frames as the Meta Ray-Ban smart glasses she had seen on social media. She told him to delete the recordings.\n\n\"I was honestly pretty shocked,\" Nowroozi told CNBC, reflecting on the interaction. \"I hadn't really experienced anything like that before. I was also scared to go on dates after that as openly as I did before.\"\n\nApple , Google , Meta and a swarm of other tech contenders are betting that new artificial intelligence wearables in the form of glasses, rings, charms and pendants can push the market toward its category-defining moment. But as the gadgets have grown in notoriety, they've also been met with privacy backlash and doubts about whether the technology is beneficial enough to become a fixture in everyday life.\n\nMeta made a splash last week with the unveiling of its Tamagotchi-like Muse Charm , a custom housing for its personal agent app that quickly topped Apple's iOS App Store free apps list. The company has continued to release new iterations of its Meta Ray-Ban AI glasses and offers an array of models at different price points.\n\nThis week, OpenAI rolled out its own personal assistant called Dots . The ChatGPT maker is also working with iPhone designer Jony Ive on consumer devices, but its first offering does not appear to be a wearable, according to Bloomberg . Apple provided a look at its latest devices at the beginning of September, complete with AI features on the Watch Series 12 that will listen to your conversations.\n\nBesides the plethora of available devices, the market looked set this week to keep the momentum rolling with the debut of smart ring maker Oura .\n\nBut on Tuesday, the company delayed its expected initial public offering at the last minute, despite signaling strong demand for its products.", "source": "CNBC World Economy", "pub_date_str": "04 Oct 2026, 06:52 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "RBI May Hike Repo Rate By 25 Bps In October As Inflation Pressures Mount: Poll", "full_content": "The last repo rate hike was in February 2023, when the RBI raised the rate by 0.25% to 6.50%.", "source": "NDTV Profit", "pub_date_str": "04 Oct 2026, 06:27 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "LTM, Cyient, Zen, Birlasoft share price target, stop-loss - IT stocks to buy for over 32% returns ahead of Q2 results", "full_content": "IT stocks to buy: The brokerage has retained a positive stance on most of the IT stocks, with Larsen &amp; Toubro Technology Services (LTTS), Mphasis and Coforge among the picks offering meaningful upside from current levels.", "source": "LiveMint Markets", "pub_date_str": "04 Oct 2026, 05:06 PM IST", "pub_date_relative": "6h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Here\u2019s the Dividend ETF I\u2019d Invest $100 a Month Into Starting in October - 24/7 Wall St.", "full_content": "Here\u2019s the Dividend ETF I\u2019d Invest $100 a Month Into Starting in October 24/7 Wall St. See more headlines & perspectives on Google News", "source": "Google News Business", "pub_date_str     document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>

</body>
</html>
