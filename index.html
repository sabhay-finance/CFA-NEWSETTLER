ll the Business News , Market News , Breaking News Events, JIO IPO Listing Today LIVE and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.", "source": "LiveMint Markets", "pub_date_str": "14 Nov 2026, 12:10 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Corporate Issuers", "Fixed Income", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Stocks making the biggest moves Friday: Nvidia, Cisco Systems, AMD, Apple, Modine & more", "full_content": "Selling resumed in a swath of artificial intelligence names on Friday, with Advanced Micro Devices , CoreWeave and Dell Technologies skidding in afternoon trading.\n\nCisco Systems also fell, even as top- and bottom-line results delivered late Thursday surpassed estimates and projections for the current quarter came in ahead of expectations.\n\nNvidia continued its slump to cap a rocky week for the dominant maker of chips for use in artificial intelligence. Shares are on pace for their worst weekly performance since January 2025.\n\nApple shares climbed nearly 1% Friday, reaching an intraday record of $360.80, lifting the company's market value above $5.2 trillion.\n\nApple stock price The stock has benefited as investors move away from companies exposed to the AI infrastructure boom.\n\nWhile many of its Magnificent Seven peers are committed to AI infrastructure buildouts, Apple has managed to stay away from the costly AI arms race. Bernstein analysts recently called Apple a \"safe haven \" and reiterated an outperform rating on Apple in the report, and a $380 price target, implying about 7% upside from Thursday's close.\n\nLiftoff Mobile, a mobile advertising platform, soared 22% on the back of a quarterly beat and solid guidance.\n\nLiftoff Mobile on Friday Third-quarter earnings of 47 cents per share and revenue of $238 million surpassed the FactSet consensus estimate of 18 cents a share and $221.7 million.", "source": "CNBC Top News", "pub_date_str": "14 Nov 2026, 12:02 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Microsoft apologizes for massive outage that took down Outlook and other 365 services", "full_content": "Microsoft issued an apology Friday for a wide-ranging outage that shut down Outlook and other Microsoft 365 products, as the company worked to restore service nearly 24 hours after connectivity problems began.\n\n\"We are deeply sorry for the disruption this incident has caused our customers and partners. We know the trust they place in our services and take that responsibility extremely seriously,\" a Microsoft spokesperson said Friday. \"We are seeing broad recovery and stability across our services.\"\n\nIn a statement, Microsoft said the connectivity disruption stemmed from \"an issue during an earlier network capacity upgrade.\" The software giant said the underlying cause of the outage had been addressed and that they were still working to restore services to some customers.\n\nEngineers scrambled to solve connectivity problems that began shortly before 1 p.m. ET on Thursday.\n\nEmail and calendar service Outlook, along with multiple Microsoft 365 services such as Sharepoint and Copilot, were largely down during the morning hours in the U.S. on Friday and throughout the Asian and European business days. Numerous external services that connect with Microsoft products were also hit. Users began to regain access to email and other services Friday morning.\n\nIn an update around 10:30 a.m. ET, Microsoft noted \"encouraging recovery progress\" and said that \"service availability and email delivery performance [was] improving across a growing portion of affected infrastructure\" as Outlook and other Microsoft 365 tools began to come back online.\n\nIn an earlier update Friday morning, Microsoft said that email queues were \"approaching normal levels,\" but that intermittent issues were expected as recovery efforts continue. It had previously given updates by region, with Asia Pacific services among the first to start normalizing.\n\nEngineering teams have been taking affected systems offline for fixes and bringing them back online gradually stages.", "source": "CNBC World Economy", "pub_date_str": "13 Nov 2026, 11:48 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Short-duration vs long-duration debt mutual funds: Where should you invest as interest rates are expected to rise now?", "full_content": "Investors looking to invest in debt mutual funds may want to focus on short-duration strategies as interest rates are expected to rise further. Axis Mutual Fund expects the Reserve Bank of India (RBI) to tighten monetary policy by another 50\u201375 basis points in the near term. Against this backdrop, the fund house favours high-quality corporate bonds with three-to-five-year maturities and short-duration, accrual-focused investment strategies.\n\nIn its November 2026 fixed-income outlook, Axis Mutual Fund said bond yields could remain volatile over the next three to six months as markets respond to domestic and global developments. It expects the operative policy rate to move towards 6\u20136.25%, although the pace of further tightening will depend on inflation, crude oil prices and economic growth.\n\nThe 10-year government security (G-Sec) yield rose from 7.18% at the end of September to 7.41% at the end of October, according to the report. Axis Mutual Fund attributed the increase to elevated crude oil prices, tighter domestic liquidity, foreign investor outflows and a more restrictive monetary policy.\n\nThe RBI raised the repo rate by 25 basis points to 5.5%, its first rate hike since February 2023, and shifted its policy stance from neutral to calibrated tightening. It also raised its FY27 consumer price index (CPI) inflation forecast to 5.2%, while projecting GDP growth at 7.1%.\n\nAxis expects bond yields to trade in a broad range over the next three to six months, with intermittent volatility. While a meaningful part of the anticipated monetary tightening appears to have been reflected in market yields, the direction of rates will remain sensitive to domestic inflation and global developments.\n\nAxis Mutual Fund prefers high-quality corporate bonds in the three-to-five-year maturity segment.", "source": "LiveMint Money", "pub_date_str": "13 Nov 2026, 11:43 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Fixed Income", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Anthropic CEO Dario Amodei aims to 'underpromise and overdeliver' as IPO valuation drops below $2T hopes - Yahoo Finance", "full_content": "Anthropic CEO Dario Amodei aims to 'underpromise and overdeliver' as IPO valuation drops below $2T hopes Yahoo Finance Wall Street Braces for Anthropic\u2019s Aggressive Spending The New York Times Anthropic, PBC - S-1/A-2 SEC.gov How Anthropic stacks up against some of the biggest US IPOs Reuters Anthropic CEO Calls Computing Power \u2018Deepest Business Dilemma\u2019 Bloomberg.com", "source": "Google News Business", "pub_date_str": "13 Nov 2026, 11:42 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "'Commerce Has The Pen': Scott Bessent Points Finger At Lutnick Over Nvidia Chip Leakage To China", "full_content": "US Treasury Secretary Scott Bessent said several key departments had backed adding Singapore-based Megaspeed to the US trade blacklist for months, but the Commerce Department had yet to act.", "source": "NDTV Profit", "pub_date_str": "13 Nov 2026, 11:37 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "YES Bank files SC review plea over AT-1 bonds: What does it mean for investors after stock's 15% rebound?", "full_content": "A Ksheerasagar Published 13 Nov 2026, 11:35 PM IST Prefer Livemint on Google aimeShares of YES Bank are likely to remain in focus on Monday after the private sector lender approached the Supreme Court seeking a review of its October 15 judgment concerning the write-down of Additional Tier-1 (AT-1) bonds worth \u20b9 8,415 crore, reopening a legal battle over the controversial financial instruments.\n\nIn a regulatory filing on Friday, the lender said it had filed a review petition under Article 137 of the Constitution of India, seeking a review of the Supreme Court's judgment and order dated October 15, 2026.\n\nThe review petition comes days after Axis Trustee Services, acting on behalf of bondholders, filed a contempt petition in the Supreme Court, alleging that the lender had failed to provide a \"concrete roadmap\" for restoring the bonds and implementing the court's judgment.\n\nIn a notice dated October 28, Axis Trustee Services Ltd, which represents investors holding the bonds, asked YES Bank's managing director and board to restore the bonds in its register of holders to their status before the March 2020 write-down. The development was reported in a letter the trustee sent to the bondholders' association on Thursday, accessed by Mint.\n\nEarlier, Reuters reported, citing sources, that YES Bank was preparing to seek a review of the ruling after it refused to pay coupons due this year on its AT-1 bonds, despite the Supreme Court's judgment.\n\nThe latest development follows a series of disclosures made by the bank between October 15 and October 30 regarding the Supreme Court's ruling on the AT-1 bonds issued by the lender.\n\nYES Bank said it would make further disclosures about material developments in the matter as required under the listing regulations.\n\nYes Bank plunged into a liquidity crisis in March 2020 as bad loans mounted, prompting the Reserve Bank of India (RBI) to take control of the lender and impose restrictions on withdrawals.", "source": "LiveMint Markets", "pub_date_str": "13 Nov 2026, 11:35 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Is a bottom in for the Nasdaq-100? Charts to watch", "full_content": "Is the Nasdaq-100's recent bounce a sign that the bottom is in? We're going to look at several charts to help answer that question.\n\nFirst, let's remember how we got here. In September, the NDX broke out from a bullish cup-and-handle pattern, producing a 33,200-upside target. That breakout quickly failed, however, and gave way to a bearish pattern that broke down aggressively two weeks ago.\n\nCappThesis The decline brought the index relatively close to its 26,350 downside target before the current rebound began.\n\nCappThesis Zooming out, it's telling to see where the bounce originated. Three important forms of support converged in the 25,000-26,000 area:\n\nThis confluence of support helped encourage buying after a roughly 15% decline.\n\nFor perspective, we also see what larger drawdowns of 20%, 30%, 40%, and 50% would look like \u2026 a lot worse.\n\nCappThesis The following chart tracks NDX drawdowns from 52-week highs going back to just after the financial crisis. Only a handful of declines exceeded 20%, and three produced relatively quick reversals: late 2018, the Covid lows in 2020 and April 2025.\n\nHistorically, buying into declines of approximately 15%\u201325% has generally paid off, even when additional downside occurred first (yellow highlights).", "source": "CNBC Top News", "pub_date_str": "13 Nov 2026, 11:30 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "JLR Slashes Margin Guidance To 2-3%, Bets On 'Core\u2019 Double-Digit Growth In FY28", "full_content": "JLR's \u00a31.7-billion cost-cutting drive, new model launches and US expansion underpin its FY28 growth ambitions despite weaker margins and rising restructuring costs.", "source": "NDTV Profit", "pub_date_str": "13 Nov 2026, 11:28 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "CMS Info Q2 Results: Cash Logistics Firm's Profit Climbs As Income Crosses Rs 660 Crore", "full_content": "During the quarter, total expenses also rose to Rs 557 crore from Rs 524 crore in the same period a year ago", "source": "NDTV Profit", "pub_date_str": "13 Nov 2026, 11:21 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "US Wholesale Inflation Picks Up To Fastest Pace Since 2022", "full_content": "Excluding food and energy, wholesale prices climbed 5% from a year ago and 0.3% from September.", "source": "NDTV Profit", "pub_date_str": "13 Nov 2026, 11:16 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Everyone's fighting for your wallet \u2014 but this premium travel card stands above the rest", "full_content": "Various rewards credit cards have undergone updates in the past year, but one remains at the peak of premium travel: the American Express Platinum Card\u00ae.", "source": "CNBC Top News", "pub_date_str": "13 Nov 2026, 11:14 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Yes Bank Files Supreme Court Petition, Seeks Review Of Rs 8,415-Crore AT-1 Bond Write-Off Order", "full_content": "Yes Bank has filed a Supreme Court review petition challenging the October 15 ruling that overturned the Rs 8,415-crore AT-1 bond write-off. The move follows a contempt petition filed by the bondholders' trustee.", "source": "NDTV Profit", "pub_date_str": "13 Nov 2026, 11:10 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Fixed Income"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "10-year Treasury yield moves to 5.17% as traders weigh producer price report", "full_content": "Treasury yields moved higher as investor expectations for a December rate hike by the Federal Reserve gain strength.", "source": "CNBC Top News", "pub_date_str": "13 Nov 2026, 11:09 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Wall Street Trims Nvidia Bets With Downgrades, Yet Stays Bullish On A 14% S&P Rally: Here's Why", "full_content": "HSBC turns cautious on Nvidia amid leadership uncertainty and export curbs, while Goldman Sachs expects the S&P 500 to gain 14% over the next 12 months.", "source": "NDTV Profit", "pub_date_str": "13 Nov 2026, 11:07 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Equity Investments"], "exa nds Follow Suit WSJ Inflation Is Sending Bond Yields Higher Again. Here\u2019s Why We\u2019re Not Worried Morningstar", "source": "Google News Business", "pub_date_str": "13 Nov 2026, 10:00 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Airtel Payments Bank IPO in pipeline? Bharti Airtel payments business eyes D-Street debut, says report", "full_content": "Airtel Payments Bank could become a much larger financial services business and may pursue an IPO in three to four years, Sunil Bharti Mittal said. The bank has nearly 100 million users and is targeting \u20b910,000 crore in revenue and deposits, and \u20b91,000 crore in profit.", "source": "LiveMint Markets", "pub_date_str": "13 Nov 2026, 09:58 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Anthropic IPO share orders from China are said to be rebuffed", "full_content": "Investors based in mainland China and Hong Kong are excluded from placing orders in Anthropic's IPO. This decision reflects the strategic sensitivities between Washington and Beijing regarding technology advancements. Some investors are exploring alternative methods to participate in the public offering through offshore structures. Anthropic intends to complete its IPO on November 18, pricing the shares ahead of trading the next day.", "source": "Economic Times Markets", "pub_date_str": "13 Nov 2026, 09:58 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Cerebras pops after beating on quarterly revenue and announcing Microsoft deal", "full_content": "Cerebras annou     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
