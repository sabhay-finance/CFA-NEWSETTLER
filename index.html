last year to $5.4 billion. The overall content and experiences unit, which also includes its film studio and theme parks, saw revenue rise 6.5%.\n\nComcast's connectivity and platforms sector, however, continued to face pressure, with revenue down 2.7% year over year.\n\nThe company reported a net loss in domestic broadband residential customers of 144,000 and a net loss in its cable customers of 274,000 during the period. Its mobile business added 368,000 customers.\n\nAfter years of stagnating growth in broadband and heightened competition from wireless providers like Verizon and T-Mobile, Comcast announced in January 2025 that it would refocus on its mobile business and pursue more competitive pricing plans.", "source": "CNBC Top News", "pub_date_str": "22 Oct 2026, 05:47 PM IST", "pub_date_relative": "47m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Dow Jones| Nasdaq | S&P 500 | US Stock Market Today |Live Updates: Nasdaq futures sink as AI doubts resurface, oil jumps", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a Dow Jones| Nasdaq | S&P 500 | US Stock Market Today |Live Updates: Nasdaq futures sink as AI doubts resurface, oil jumps Powered By LIVE BLOG Dow Jones| Nasdaq | S&P 500 | US Stock Market Today |Live Updates: Nasdaq futures sink as AI doubts resurface, oil jumps 22 Oct 2026 | 06:23:25 PM IST Synopsis US Market | Dow Jones Live Updates: Nasdaq futures fall nearly 2% as renewed doubts over AI spending weigh on growth stocks, with Tesla and Meta sliding after their updates. Oil prices jump on supply disruption fears, while chip stocks and other megacaps also decline, signalling a broader risk-off mood.\n\nComments are moderated and will be allowed if they are about the topic and not abusive.\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Markets", "pub_date_str": "22 Oct 2026, 05:45 PM IST", "pub_date_relative": "49m ago", "cfa_topics": ["Equity Investments", "Derivatives"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "A bond is like a party balloon", "full_content": "(Bear with us)", "source": "FT Markets", "pub_date_str": "22 Oct 2026, 05:40 PM IST", "pub_date_relative": "54m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "India-EU trade deal could become operational in early-2027, Piyush Goyal says", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a India-EU trade deal could become operational in early-2027, Piyush Goyal says The Economic Times daily newspaper is available online now. Read Today's Paper India-EU trade deal could become operational in early-2027, Piyush Goyal says SECTIONS India-EU trade deal could become operational in early-2027, Piyush Goyal says Reuters Last Updated: Oct 22, 2026, 05:35:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Piyush Goyal, India\u2019s trade minister, has revealed that a free-trade agreement with the European Union is on the horizon, with expectations to finalize it by year's end. Set to become operational within four to five months after signing, this deal aims to improve market access and foster investment collaborations between India and the 27 EU member states.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\nOne company, 2 words. Bond yield and CDS: Will they decide the fate of global markets?\n\nBusiness of Odd Things: Inside an industry that farms fish that nobody is meant to eat\n\nWar's second-order effects are becoming visible in critical sectors\n\nUS mid-term elections \u2013 Part 2: What does it mean for Trump to lose control of Congress?\n\nHomebuyers wait as NCLT panel picks holes in unfinished Jaypee projects\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "22 Oct 2026, 05:35 PM IST", "pub_date_relative": "59m ago", "cfa_topics": ["Fixed Income", "Derivatives"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Small-cap stock shows resilience against stock market crash; experts hint at strong Q2 results 2026 | Should you buy?", "full_content": "Small-cap stock to buy after Q2 Results 2026: The key benchmark indices continue to remain under the selling heat for the third straight session on Thursday. The Nifty 50 index finished 123 points lower at 22,687, the BSE Sensex corrected 460 points and closed at 73,249, while the Bank Nifty index went off 51 points and ended at 54,925. However, some stocks showed resilience against this continuous Indian stock market crash. Recently listed Varmora Granito shares are among them. The small-cap stock with a market cap of around \u20b9 3,000 crore, attracted buying interest on Thursday despite weak trends on Dalal Street and finished 1.60% higher at around \u20b9 135 apiece on the NSE.\n\nAccording to stock market experts, the small-cap stock is attracting buying interest after reporting strong Q2FY27 and H-1FY27 numbers. They said the company is in the tile manufacturing business, which was severely hit by a natural supply gap amid the ongoing Middle East crisis. However, the company came through the supply chain crisis and reported strong numbers. They said that the stock may touch \u20b9 170 once it decisively breaks above the \u20b9 146 hurdle.\n\nHighlighting the reason for resilience shown by the small-cap stock despite weak trends on Dalal Street, Anujm Gupta, a SEBI-registered market analyst, said, \u201cThe company had reported strong Q2 and H-1 earnings on Monday. This was cheered by bulls on Monday, and the stock finished higher, showing resilience against the selling pressure in the key benchmark indices. The company has reported around 500% YoY growth in the net profit in the first half of the recently ended September 2026 quarter. The company's revenue grew both in YoY and Qoq terms.\u201d\n\nOn why these earnings are cheered by Dalal Street bulls, Mahesh M Ojha, VP \u2014 Research and Business Development at KC Securities, said, \u201cThe small-cap company is a tile maker company.", "source": "LiveMint Markets", "pub_date_str": "22 Oct 2026, 05:35 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "IBM\u2019s stock falls as investors struggle to shake off July earnings miss", "full_content": "Shares in International Business Machines declined 5% in Thursday\u2019s premarket trading as investors digested the company\u2019s third-quarter results.", "source": "MarketWatch Top Stories", "pub_date_str": "22 Oct 2026, 05:34 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Top 2 stocks to buy tomorrow: Federal Bank, Indian Hotel by market expert; check stop-loss, target price for Fri, 23 Oct", "full_content": "Stock market news: Indian equities declined for the third consecutive session on Thursday, 21 October as escalating conflict in the Middle East drove oil prices up to $112 a barrel, fuelling inflation concerns for the world's third-largest crude oil importer.\n\nThe Nifty 50 fell 0.54% to 22,687.65, while the Sensex dropped 0.62% to 73,249.39. Broader markets also came under pressure, with the small-cap and mid-cap indices declining 1.1% and 0.9%, respectively.\n\nMarket expert Chandan Taparia has recommended two stocks to buy tomorrow \u2014 Federal Bank and Indian Hotels Company \u2014 with defined target prices and stop-loss levels.\n\nTaparia has recommended buying Indian Hotels Company with a target price of \u20b9 830 and a stop loss of \u20b9 760. For Federal Bank, he has set a target price of \u20b9 368 and a stop loss of \u20b9 336.\n\nOn the Nifty options front, Chandan Taparia, Head Derivatives & Technicals, Wealth Management, Motilal Oswal Financial Services Ltd, said the maximum Call OI is at the 23,000 and 23,200 strikes, while the maximum Put OI is at the 22,600 and 22,500 strikes.\n\n\u201cCall writing is seen at 23,300 then 23,150 strike, while Put writing is seen at 22,650 then 22,600 strike. Option data suggests a broader trading range between 22,400 and 23,200 zones, while an immediate range is between 22,500 and 23,000 levels,\u201d said Taparia.\n\nThe Nifty 50 index opened with a gap-down and witnessed volatile swings throughout the session, remaining confined to a range. Despite sharp movements on either side, the index failed to establish a clear directional trend and formed a long-legged Doji-type candle on the daily frame, reflecting indecision between the bulls and bears.\n\n\u201cNow, till it holds below 22,700, weakness could extend towards 22,550, then 22,400 levels, while on the upside, immediate hurdles can be seen at 22,850, then 22,950 zones,\u201d said Taparia.", "source": "LiveMint Markets", "pub_date_str": "22 Oct 2026, 05:33 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Procter & Gamble earnings beat as sales rise 4%, boosted by laundry and home products", "full_content": "Procter & Gamble on Thursday reported quarterly earnings and revenue that beat analysts' expectations, fueled by growing demand for its laundry detergent and home care products.\n\nShares of the company rose more than 2% in premarket trading.\n\nHere's what the company reported compared with what Wall Street was expecting, based on a survey of analysts by LSEG:\n\nP&G reported fiscal first-quarter net income attributable to the company of $4.73 billion, or $1.97 per share, down from $4.75 billion, or $1.95 per share, a year earlier.\n\nExcluding restructuring costs and other items, the company earned $2 per share.\n\nP&G reported volume growth of 2.4%, a strong start for its new fiscal year. Like many consumer companies, P&G has seen demand for its products weaken as shoppers have become more value conscious.\n\nExecutives have previously said that consumers are now using every last drop of shampoo or laundry detergent, and value packs have become more popular. In fiscal 2026, P&G reported just one quarter of volume growth.\n\nP&G is still seeing signs of a bifurcated economy, CFO Andre Schulten said on CNBC's \"Squawk Box\" on Thursday. High-income consumers are willing to trade up to new products, even a $30 shampoo, while low-income consumers are trying to make brands like Tide and Pampers work for their tight budgets.", "source": "CNBC Top News", "pub_date_str": "22 Oct 2026, 05:31 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "American Express brings Airbnb bookings and rewards to Amex Travel platform", "full_content": "American Express is bringing Airbnb into its travel rewards platform.\n\nThe companies on Thursday announced a new partnership to bring more than 1 million Airbnb listings to Amex's travel portal and allow cardholders to earn rewards when booking the stays. It does not currently allow members to redeem points to pay for Airbnb bookings.\n\nThe launch adds Airbnb rentals to Amex's hotel portfolio, which includes more than 3,400 properties across its Fine Hotels + Resorts and The Hotel Collection programs.\n\nAmex members with either the consumer or business Platinum card can also now apply their $600 annual lodging credit \u2014 previously called the hotel credit \u2014 to Airbnb's higher-end Luxe stays and take advantage of a new $250 statement credit on eligible Airbnb Experiences after making a Luxe booking.\n\n\"We're excited to bring more choice and flexibility to American Express Card Members with this exclusive partnership. Both of our companies exist to help people travel more and better, and this partnership helps people see more of the world by making travel more rewarding,\" said Juan David Borrero, head of partnerships at Airbnb, in a news release.\n\nThe changes come as competition among premium credit cards continues to ramp up.\n\nLast year, American Express raised the annual fee on its premium Platinum card to $895. In turn, it's been investing in cardholder perks such as new lounges in airports and at big-ticket events and experiences as a way to attract more high-paying customers.\n\nEarlier this month, it announced an expansion of its Centurion Lounges , with renovations coming to four existing lounges and new ones planned for Newark Liberty International Airport and London Heathrow Airport. The Newark lounge will be the largest in its network.", "source": "CNBC Top News", "pub_date_str": "22 Oct 2026, 05:30 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Why this JPMorgan strategist thinks the stock market\u2019s tailspin might have run its course", "full_content": "Hedge fund positioning has lightened considerably since its recent September peak, and JPMorgan strategists deduce from this that downside for stocks is now limited.", "source": "MarketWatch Top Stories", "pub_date_str": "22 Oct 2026, 05:27 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "American Airlines forecasts bigger loss in 2026 on fuel spike, plans to slow growth next year", "full_content": "American Airlines forecast deeper losses this year as record revenue failed to help the airline recover from this year's spike in fuel costs. The carrier plans to slow its capacity growth next year as a result.\n\nAmerican on Thursday said it expects to lose between $1 and $1.60 a share, on an adjusted basis for the full year. In July, it forecast earnings of up to 65 cents a share to a loss of as low as 65 cents a share.\n\n\"American delivered record third-quarter revenue and the strongest year-over-year revenue growth in my career, with premium performance leading the way,\" American CEO Robert Isom said in a news release. \"The investments we are making across the four pillars of our commercial strategy are working, and we expect another quarter of record revenue growth to close out the year.\"\n\nThe Fort Worth, Texas-based airline is the fourth major U.S. carrier to cut its forecast for 2026 due to a jump in jet fuel following the start of the Iran war. Rising jet fuel prices have also driven up airfare more than 20% from last year. Delta Air Lines , United Airlines , and Southwest Airlines also slashed their outlooks this month.\n\nJet fuel is airlines' biggest cost after labor, and the spike has added billions to costs this year. American's fuel bill was up 67.5% in the third quarter from last year to $4.64 billion.\n\nAmerican forecast it will lose between 50 cents and $1.10 a share, adjusted, in the fourth quarter, with revenue expected to be up as much as 22.5% from a year earlier and capacity up between 5.5% and 6.5%.\n\nHere is what American reported in the third quarter compared with Wall Street estimates compiled by LSEG:\n\nFor the third quarter, American had a net loss of $269 million or 41 cents a share, compared with $114 million, or 17 cents a share, a year earlier. Adjusting for one-time items, American reported a loss of 28 cents a share. Revenue jumped 19.3% from a year earlier to $16.34 billion.", "source": "CNBC Top News", "pub_date_str": "22 Oct 2026, 05:26 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Sebi eases margin rules for trades post EPI", "full_content": "Mumbai: The Securities and Exchange Board of India (Sebi) has waived margin requirements for trades using proceeds from sales under the early pay-in (EPI) mechanism, a move aimed at easing margin-funding requirements.\n\nIn a circular issued on Thursday, the capital markets regulator said clearing corporations must, in real time, refrain from collecting margin from trading members and clearing members on subsequent positions taken by clients, up to the value of EPI accepted by the clearing corporation.\n\nThe framework applies where a client has a net sell obligation in a settlement, and the clearing corporation has successfully accepted the EPI request for the securities sold.\n\nMint was the first to report in July that Sebi \u2019s risk management review committee (RMRC) was discussing a waiver of margin for trades made from proceeds from the same-day stock sale under EPI.\n\nEPI refers to delivering the shares you have sold to the stock market\u2019s clearing corporation before the normal settlement deadline. For example, if you sell shares worth \u20b9 1 lakh and deliver them early through EPI, the accepted value of those shares can be used to meet margin requirements for other trades.\n\nUnder Sebi\u2019s new circular, the clearing corporation will not collect margin from your broker on eligible subsequent buy or sell positions up to the accepted EPI value. This reduces the need for brokers to use their own funds to provide that margin, while normal margin requirements and risk controls continue to apply wherever the relief does not cover them.\n\nUnder the current framework, when an investor sells shares already held in the demat account through the EPI mechanism, the trade is cleared by the clearing corporation on the trade day itself, eliminating settlement risk.", "source": "LiveMint Markets", "pub_date_str": "22 Oct 2026, 05:22 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Market wrap: Bajaj Finance, Cipla, Nestle India, Eternal top gainers and losers on Nifty and Sensex on Thursday", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Market wrap: Bajaj Finance, Cipla, Nestle India, Eternal top gainers and losers on Nifty and Sensex on Thursday BSE Share Price Multi Commodity Exchange of India Share Price Indian Energy Exchange Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Market wrap: Bajaj Finance, Cipla, Nestle India, Eternal top gainers and losers on Nifty and Sensex on Thursday SECTIONS Market wrap: Bajaj Finance, Cipla, Nestle India, Eternal top gainers and losers on Nifty and Sensex on Thursday By Kumar Gaurav , ETMarkets.com Last Updated: Oct 22, 2026, 05:22:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Indian equity markets fell for a third consecutive session as weak global cues and sustained selling weighed on sentiment. The Nifty 50 declined 0.54% to 22,688, while the Sensex dropped 0.62% to 73,249.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "22 Oct 2026, 05:22 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Sellers are back in tech, while bear market grips Chinese stocks", "full_content": "This is CNBC's Morning Squawk newsletter. Subscribe here to receive future editions in your inbox.\n\nHello, this is Leonie Kidd with today's edition of Morning Squawk.\n\nThe pickup in volume during super early trading has been overwhelmingly to the downside.\n\nFutures are worse, Asia closed deep in the red, and Europe is also broadly lower.\n\nFutures are steadily declining this morning, with chip stocks once again under pressure.\n\nThe earnings handover from Wall Street was mixed, but investors seem more hung up on Tesla's disappointing forecasts than Meta's beat.\n\nTesla round-up: Better-than-expected third-quarter results are failing to support Tesla shares, with the stock falling in premarket trading. Lower average car sales prices and a battery supply crunch weighed on revenues.\n\nMusk also warned the group is \"not going to move the needle\" on its Robotaxi fleet this quarter.", "source": "CNBC World Economy", "pub_date_str": "22 Oct 2026, 05:20 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Need \u20b910 lakh emergency fund? How to split your money between savings accounts, FDs and mutual fund? Plan by experts", "full_content": "An emergency fund of \u20b9 10 lakh can provide financial support during a job loss, medical emergency or an unexpected household expense. However, keeping the entire amount in a savings account may mean earning relatively low interest, while locking it all into fixed deposits or mutual funds could make accessing the money less convenient when it is urgently needed.\n\nThe challenge is to balance three priorities: liquidity, capital safety and returns. Financial experts say an emergency fund should be divided according to how quickly the money might be required, rather than invested entirely in the instrument offering the highest returns.\n\nFor someone with a \u20b9 10 lakh emergency fund, one possible allocation is \u20b9 2 lakh in a savings account, \u20b9 4 lakh in liquid mutual funds and \u20b9 4 lakh in fixed deposits, preferably staggered across different maturities.\n\nRhishabh Garg, CEO of FundsIndia.com, suggests this allocation. According to him, the savings account should ideally cover one to two months of expenses, while the remaining amount can be divided between FDs and liquid funds depending on the individual's preference for certainty or flexibility.\n\nAnother approach is to keep \u20b9 1.5 lakh in a savings account, \u20b9 4.5 lakh in liquid mutual funds and the remaining \u20b9 4 lakh in an ultra-short duration debt fund.\n\nSandeep Jethwani, co-founder of Dezerv, recommends this allocation based on how quickly each portion of the money might be required. The savings account can cover immediate expenses, such as an emergency hospital admission, while liquid funds provide access to additional money.\n\nThe ultra-short duration fund holds the portion that is less likely to be needed during the first month, although returns are market-linked and not guaranteed.\n\nThe three options differ significantly in how quickly investors can access their money.", "source": "LiveMint Money", "pub_date_str": "22 Oct 2026, 05:17 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Fixed Income", "Derivatives", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Cyient Q2 Results: Net Profit Rises 16%, EBIT Margin Expands To 10% QoQ", "full_content": "The company's revenue jumped 7.7% to Rs 2,235 crore in the July to September quarter from Rs 2,076 crore.", "source": "NDTV Profit", "pub_date_str": "22 Oct 2026, 05:10 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Global Market: Japanese banks see rising corporate loan demand ahead of BOJ meeting", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a Global Market: Japanese banks see rising corporate loan demand ahead of BOJ meeting Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market: Japanese banks see rising corporate loan demand ahead of BOJ meeting SECTIONS Global Market: Japanese banks see rising corporate loan demand ahead of BOJ meeting By Anupam Nagar , ETMarkets.com Last Updated: Oct 22, 2026, 05:10:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Japanese banks report rising corporate funding demand despite the Bank of Japan\u2019s 1.25% interest rate, reinforcing expectations of further monetary tightening. Persistent inflation risks, resilient lending and government concerns will shape the central bank\u2019s upcoming policy decision.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "22 Oct 2026, 05:10 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Tesla shares fall 4% in pre-market after capex forecast cut: Is Elon Musk\u2019s AI and robotics ambition facing a setback?", "full_content": "Shares of Tesla dropped 4% in pre-market trade on Thursday, October 22, as investor sentiment weakened after the electric vehicle maker cut its capital expenditure forecast, clouding Elon Musk\u2019s plan to transform the company into an AI and robotics business.\n\nCapital expenditure will be around $20 billion this year, the company said on Wednesday after reporting its earnings. This marked a reversal from earlier this year, when Tesla raised its target to more than $25 billion.\n\nThe reduction eases the immediate funding requirement but also raises questions about investment timing. Tesla did not specify which projects would account for the reduction.\n\nTesla had consistently fallen short of the pace needed to meet its spending target, particularly after reporting a $4.73 billion outlay in the third quarter. Analysts had expected capital expenditure of $7.95 billion on average, according to estimates compiled by Bloomberg .\n\nDuring the company\u2019s earnings call on Wednesday, Chief Financial Officer Vaibhav Taneja said capital expenditure would continue to grow as Tesla invests in its robotaxi fleet and expands production of the humanoid robot Optimus and solar products.\n\nHeavy spending is needed to help Tesla reorient its operations around futuristic business lines such as artificial intelligence, robotics and autonomous driving. The shift is seen as a central justification for a potential merger with SpaceX \u2014 a historic transaction that Musk said this week the companies are exploring.\n\nTesla reported third-quarter revenue of $28.05 billion, flat from the same quarter a year earlier. The company said revenue was affected by a decline in its energy business, lower average vehicle selling prices, and a year-on-year drop in deliveries.\n\nReported net income fell 43% to $787 million, while operating profit declined 56% to $718 million. Operating margin stood at 2.6%, compared with 5.8% a year earlier.", "source": "LiveMint Markets", "pub_date_str": "22 Oct 2026, 05:10 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Nasdaq futures sink as AI doubts resurface, oil jumps - Reuters", "full_content": "Nasdaq futures sink as AI doubts resurface, oil jumps Reuters Stock futures sell off as Meta and Tesla lead AI trade lower and oil rises: Live updates CNBC Stock Market Today: Dow Falls As Oil Prices Jump; Meta, Tesla Slide On Earnings (Live Coverage) Investor's Business Daily Stock Market Today: Tech Stocks Lead Futures Sharply Lower; Oil Prices Surge on Middle East Escalations Investopedia Dow futures lose 356 points as AI worries return and oil climbs Quartz", "source": "Google News Business", "pub_date_str": "22 Oct 2026, 05:09 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Barclays to slash 5,000 jobs in AI efficiency push", "full_content": "British lender Barclays has revealed plans to cut 5,000 jobs \u2014 about 5% of its total workforce \u2014 as part of an artificial intelligence-linked efficiency push.\n\nIn its third-quarter earnings statement Thursday, Barclays said it was \"structurally reducing the cost base to generate capacity for investment.\"\n\nAbout 60% of the cuts are expected to be in support functions, including developers, according to the earnings presentation, which also noted an outcome was \"organisational simplification and technology change efficiency driven by AI.\"\n\nShares in the bank were almost 1% lower by 8:50 a.m. in London (3:50 a.m. E.T.), less than an hour into the trading day.\n\nBarclays' third-quarter pre-tax profit rose 12% year on year to \u00a32.3 billion ($3.1 billion), matching LSEG-compiled forecasts. Group income for the period was \u00a37.4 billion, below analysts' estimate of \u00a37.61 billion.\n\nBarclays. Net interest income was broadly unchanged at \u00a33.91 billion. Its CET1 capital ratio, a measure of financial solvency, edged down to 14.2% from 14.3% at the end of the second quarter. Return on tangible equity fell to 11.7% from 16.1%.", "source": "CNBC Top News", "pub_date_str": "22 Oct 2026, 05:08 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "UBS acquires 4.8% stake in wealth manager 360 ONE WAM through warrant exercise", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a UBS acquires 4.8% stake in wealth manager 360 ONE WAM through warrant exercise 360 One Wam Share Price Anand Rathi Wealth Share Price Nuvama Wealth Management Share Price The Economic Times daily newspaper is available online now. Read Today's Paper UBS acquires 4.8% stake in wealth manager 360 ONE WAM through warrant exercise SECTIONS UBS acquires 4.8% stake in wealth manager 360 ONE WAM through warrant exercise By Debaroti Adhikary , ETMarkets.com Last Updated: Oct 22, 2026, 05:06:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis UBS has acquired a 4.8% stake in 360 ONE WAM by exercising 2.05 crore warrants and paying around Rs 1,584 crore. The transaction follows a partnership announced in April 2025, under which UBS agreed to sell its Indian onshore wealth management business to the Mumbai-based firm for about $32 million.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Pr irst Seven Framework\u2014a behavioural approach to retirement planning that focuses on making long-term investing easier to begin.\n\nDuring the first few years of a career, income may still be modest, but financial commitments are often at their lowest.\n\nIronically, retirement planning receives little attention. Retirement feels too distant to demand action today.\n\nThat's the thinking behind what I call the First Seven Framework\u2014a behavioural approach to retirement planning that focuses on making long-term investing easier to begin.\n\nDuring the first few years of a career, income may still be modest, but financial commitments are often at their lowest.", "source": "LiveMint Money", "pub_date_str": "22 Oct 2026, 05:04 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Quantitative Methods", "Portfolio Management"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "Indonesia Eyes Panda Bond As It Confronts MSCI Risk", "full_content": "The Southeast Asian nation has secured Chinese regulatory clearance to issue as much as 30 billion yuan of panda bonds from 2026 through 2028, a public filing shows. Its July issuance comprised of three-year notes at 1.9% and five-year notes at 2.19%.", "source": "NDTV Profit", "pub_date_str": "22 Oct 2026, 05:00 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income", "Ethical & Professional Standards"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Global Market: Why China could complicate Musk\u2019s Tesla-SpaceX merger plans", "full_content": "Elon Musk\u2019s proposed Tesla\u2013SpaceX merger faces potential regulatory hurdles in the US and China over national security, sensitive data and technology sharing. Tesla\u2019s dependence on Chinese manufacturing and revenue complicates efforts to integrate SpaceX\u2019s defence operations.", "source": "Economic Times Markets", "pu     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
