ST", "pub_date_relative": "21m ago"}, {"title": "SEBI widens FPI access to commodity derivatives; delivery rules laid out", "full_content": "The Securities and Exchange Board of India (SEBI) board on Thursday approved a proposal to allow foreign portfolio investors (FPIs) to participate in a wider range of non-agricultural commodity derivatives, including physically settled contracts, as part of measures aimed at deepening participation and liquidity in India\u2019s commodity markets.\n\nUnder the new framework, FPIs will be allowed to trade non-agricultural commodity index derivatives and non-agricultural commodity derivatives that are not cash-settled. However, for physically settled non-agricultural commodity contracts, FPIs will have to square off their positions three days before expiry, before the start of the tender or staggered delivery period.\n\nFPIs will not be permitted to increase their positions from the T-3 day. If any positions remain, they can be transferred to the proprietary account of a designated trading member (TM) or trading-cum-clearing member (CM).\n\nFPIs will need to have an agreement with the relevant TM/CM for handling or squaring off any residual positions. Such positions can be devolved to the TM/CM at the exchange-declared closing or daily settlement price, with applicable statutory levies charged on the devolution.\n\nCurrently, FPIs can participate in cash-settled non-agricultural commodity derivatives, while contracts such as bullion and base metals are physically deliverable. The broader access is aimed at encouraging greater foreign investor participation and boosting trading volumes in India's commodity derivatives market.\n\nKsheera Sagar has been working as a Market Research Analyst at LiveMint for the past four years, covering stocks, commodities, and broader financial markets. In this role, he closely tracks daily market movements, corporate earnings, sector trends, and macroeconomic developments. <br><br> He has over a deca  has a long way to go to turn its early momentum in Muse into a winning product.\n\n\"People are going to be very wary,\" said Joseph Turow , a professor emeritus at the University of Pennsylvania and an expert on digital media and privacy.", "source": "CNBC World Economy", "pub_date_str": "24 Sep 2026, 07:19 PM IST", "pub_date_relative": "24m ago"}], "cfa": [{"title": "White House still blocks some reporters despite judge's order lifting Trump ban", "full_content": "A federal judge on Thursday ordered that White House access to journalists from CNN, MS NOW and Politico be immediately restored for up to two weeks, saying President Donald Trump 's media ban was likely unconstitutional.\n\nDespite the ruling, some journalists from all three outlets were barred from entering the White House on Thursday morning.\n\nMS NOW reporter Laura Barr\u00f3n-L\u00f3pez and an MS NOW producer had their press passes confiscated when they tried to enter, but a second MS NOW producer was allowed to enter. Politico said that at least one of their reporters was also blocked, and CNN reported that some of its staff was denied access, but at least one was allowed in.\n\nIt was not clear if Secret Service officers were denying access to some journalists from the three outlets because of a lag in electronically reactivating their press passes and not as a result of a refusal to comply with the new judicial ruling.\n\nLater Thursday, an attorney for the outlets in a court filing notified Judge Timothy Kelly of the White House's \"non-compliance\" with his temporary restraining order and requested an immediate hearing on the situation.\n\n\"Defendants have already repeatedly violated the Court's Order,\" wrote the attorney, Theodore Boutrous Jr., in the filing in U.S. District Court in Washington.\n\n\"Plaintiffs respectfully request that the Court set a hearing by videoconference or teleconference as soon as possible this morning.\n\nThe White House didn't immediately respond to CNBC's request for comment on the ruling and about the continued denial of access for some reporters from the three outlets.", "source": "CNBC Top News", "pub_date_str": "24 Sep 2026, 07:38 PM IST", "pub_date_relative": "5m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Oracle sends 'force majeure' notice about data center project \u2014 stock sinks 7%", "full_content": "Oracle shares fell 4% on Thursday following news that the company sent a \"force majeure\" notice tied to its New Mexico data center project to protect itself from higher expenses.\n\n\"Project Jupiter remains on our planned schedule,\" an Oracle said in a statement to CNBC. \"We are fully committed to New Mexico and confident in our path forward.\"\n\nBloomberg was first to report the news, citing sources familiar with the matter.\n\nThe company is looking to delay payment on the campus, dubbed Project Jupiter, if it doesn't come online as expected in 2028, according to the report.\n\nOracle sent the notice to the developer, which is a unit of Blue Owl Capital . The company also saw its shares fall on Thursday.\n\n\"This notice does not change the financial commitments to this multi-year project,\" Blue Owl Capital said in a statement to CNBC.\n\nThe New Mexico data center project, which is part of the broader Stargate artificial intelligence infrastructure buildout with President Donald Trump , has been riddled with setbacks and regulatory hurdles.\n\nThat includes local opposition to data centers ahead of the upcoming midterm elections and concerns from environmental groups.", "source": "CNBC World Economy", "pub_date_str": "24 Sep 2026, 07:35 PM IST", "pub_date_relative": "8m ago", "cfa_topics": ["Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Bond market sell-off rumbles on ahead of Trump and XI talks", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Sep 2026, 07:24 PM IST", "pub_date_relative": "19m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Darden Restaurants stock falls as Olive Garden reports slower growth", "full_content": "Darden Restaurants on Thursday reported quarterly earnings and revenue that narrowly missed analysts' expectations as same-store sales growth at Olive Garden slows.\n\nShares of the company fell as much as 5% in premarket trading but pared back their losses as executives reassured investors on the company's earnings conference call. The stock was down about 2% in morning trading.\n\nShort-term challenges like consumers' cyclospora concerns and the World Cup tournament weighed on Darden's same-store sales during the quarter, executives said. However, CEO Rick Cardenas said that Darden's restaurant chains are performing better in September, and costs of key commodities, like beef, are projected to improve later in the fiscal year.\n\nHere's what the company reported for the quarter ended Aug. 30 compared with what Wall Street was expecting, based on a survey of analysts by LSEG:\n\nDarden reported fiscal first-quarter net income of $233.4 million, or $2.04 per share, down from $257.8 million, or $2.19 per share, a year earlier.\n\nThe company's same-store sales increased 3.1% during the fiscal quarter as each of Darden's business units reported growth. But the World Cup weighed on demand for Darden's restaurants early in the quarter, dragging the company's same-store sales down by 80 basis points, or 0.8%, CFO Raj Vennam said.\n\nLongHorn Steakhouse was once again the top performer of the portfolio this quarter, as same-store sales rose 6.2%. The chain has overtaken Olive Garden to become Darden's top performer, although it still accounts for a smaller share of the company's overall revenue.\n\nOlive Garden saw its same-store sales inch up 1.1%. While it is still the company's largest chain by both number of locations and sales, Olive Garden has seen its growth weaken as diners have become more choosy about their spending.", "source": "CNBC Top News", "pub_date_str": "24 Sep 2026, 07:24 PM IST", "pub_date_relative": "19m ago", "cfa_topics": ["Financial Statement Analysis", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Earnings call transcript: Darden Restaurants Q1 2026 meets EPS view, shares slip", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Sep 2026, 07:23 PM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Brazil central bank sees inflation near target, cuts growth outlook", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Sep 2026, 07:23 PM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Mexico\u2019s inflation rises to 3.42% in early September", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Sep 2026, 07:22 PM IST", "pub_date_relative": "21m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "SEBI widens FPI access to commodity derivatives; delivery rules laid out", "full_content": "The Securities and Exchange Board of India (SEBI) board on Thursday approved a proposal to allow foreign portfolio investors (FPIs) to participate in a wider range of non-agricultural commodity derivatives, including physically settled contracts, as part of measures aimed at deepening participation and liquidity in India\u2019s commodity markets.\n\nUnder the new framework, FPIs will be allowed to trade non-agricultural commodity index derivatives and non-agricultural commodity derivatives that are not cash-settled. However, for physically settled non-agricultural commodity contracts, FPIs will have to square off their positions three days before expiry, before the start of the tender or staggered delivery period.\n\nFPIs will not be permitted to increase their positions from the T-3 day. If any positions remain, they can be transferred to the proprietary account of a designated trading member (TM) or trading-cum-clearing member (CM).\n\nFPIs will need to have an agreement with the relevant TM/CM for handling or squaring off any residual positions. Such positions can be devolved to the TM/CM at the exchange-declared closing or daily settlement price, with applicable statutory levies charged on the devolution.\n\nCurrently, FPIs can participate in cash-settled non-agricultural commodity derivatives, while contracts such as bullion and base metals are physically deliverable. The broader access is aimed at encouraging greater foreign investor participation and boosting trading volumes in India's commodity derivatives market.\n\nKsheera Sagar has been working as a Market Research Analyst at LiveMint for the past four years, covering stocks, commodities, and broader financial markets. In this role, he closely tracks daily market movements, corporate earnings, sector trends, and macroeconomic developments. <br><br> He has over a decade of experience in the financial services industry and has previously worked with multiple organisations, including global investment bank J.P.", "source": "LiveMint Markets", "pub_date_str": "24 Sep 2026, 07:20 PM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Financial Statement Analysis", "Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Meta's standoff with Amazon over Muse could be a sign of things to come", "full_content": "Meta's rollout of its Muse AI personal agent has been a big hit with consumers and investors. The stock has jumped more than 20% in the two weeks since its introduction, and the app has shot up to the top of Apple's App Store, eclipsing ChatGPT.\n\nCEO Mark Zuckerberg took to the stage late Wednesday afternoon at the company's annual Connect conference for developers to relish in the excitement. He described the Muse AI agent as the \"centerpiece\" of his company's efforts to make the technology more easily available to the broader public and not just coders.\n\n\"In the coming years, I expect that Muse is going to grow into the personal superintelligence that billions of people around the world are going to use to accomplish their goals and improve their lives,\" Zuckerberg said.\n\nBut there are reasons for skepticism regarding Meta's latest effort to find a real and lasting niche in the consumer artificial intelligence market.\n\nMeta is touting Muse's ability to book appointments and travel, fill out electronic forms for users, and monitor home security cameras. It can also shop on a user's behalf, searching for a specific product across various sites and marketplaces and linking to Shopify or Stripe for payment.\n\nAmazon has said that's a no-go, blocking Muse from purchasing products on the e-commerce app, claiming that it would violate the company's terms of service. Whether it's other retailers taking similar steps out of concern that they're at risk of losing the direct relationship with customers, or it's consumers that don't trust the Facebook parent with sensitive data, experts say the social media giant has a long way to go to turn its early momentum in Muse into a winning product.\n\n\"People are going to be very wary,\" said Joseph Turow , a professor emeritus at the University of Pennsylvania and an expert on digital media and privacy.", "source": "CNBC World Economy", "pub_date_str": "24 Sep 2026, 07:19 PM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "US stocks: US stocks open lower as oil gains on Mideast uncertainty, eyes on Trump-Xi talks", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a US stocks: US stocks open lower as oil gains on Mideast uncertainty, eyes on Trump-Xi talks Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US stocks: US stocks open lower as oil gains on Mideast uncertainty, eyes on Trump-Xi talks SECTIONS US stocks: US stocks open lower as oil gains on Mideast uncertainty, eyes on Trump-Xi talks Reuters Last Updated: Sep 24, 2026, 07:17:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Wall Street's main stock indexes fell as Middle East tensions weighed on financial markets. Oil prices have risen, which is causing a spike in Treasury yields during this period. The Dow Jones Industrial Average, S&P 500, and Nasdaq Composite all opened lower this morning. Investors are also showing caution ahead of a significant summit between Donald Trump and Xi Jinping.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "24 Sep 2026, 07:17 PM IST", "pub_date_relative": "26m ago", "cfa_topics": ["Equity Investments", "Fixed Income"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "NSE sees no change in duties as listed entity; to protect market integrity, public interest:Chairman", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a NSE sees no change in duties as listed entity; to protect market integrity, public interest:Chairman BSE Share Price Multi Commodity Exchange of India Share Price Indian Energy Exchange Share Price The Economic Times daily newspaper is available online now. Read Today's Paper NSE sees no change in duties as listed entity; to protect market integrity, public interest:Chairman SECTIONS NSE sees no change in duties as listed entity; to protect market integrity, public interest:Chairman By PTI Last Updated: Sep 24, 2026, 07:15:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The National Stock Exchange recently celebrated a milestone with its highly anticipated IPO, entering the stock market with shares opening at Rs 1,800, surpassing the issue price of Rs 1,785. The chairperson and CEO expressed a commitment to prioritizing public interest while driving growth, as the IPO drew impressive institutional interest, reflecting strong investor belief in the exchange's promising future.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "24 Sep 2026, 07:15 PM IST", "pub_date_relative": "28m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Alternative Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "30-year Treasury yield hits highest level since 2004 as bond market rout continues", "full_content": "Treasury yields were trading near multidecade highs Thursday, as investor bets on another rate hike from the Federal Reserve mounted.\n\nThe 30-year Treasury bond yield was down less than 1 basis point 5.399%. Earlier in the day, it reached a 2004 peak of around 5.44%. The benchmark 10-year Treasury note yield , which is tied to rates on mortgages, dropped more than 1 basis point to 5.10% but hit its highest level since July 2007 earlier. The yield on the 2-year note fell more than 4 basis points to 4.854%, though it remained close to a 2023 high.\n\nOne basis point equals 0.01%, and yields and prices move in opposite directions.\n\nGlobal bonds also sold off. Japan's 10-year JGB yield rose its highest since August 1996. U.K. Gilts and German Bunds also moved higher, with yields on various European bonds hitting fresh multi-year highs.\n\nThursday's moves build on a U.S. Treasury rout that took place Wednesday. The 10-year Treasury yield had its biggest one-day jump since April 7, 2025 as traders reacted to stronger-than-expected U.S. economic data, hawkish commentary from a Federal Reserve official and high oil prices.\n\n\"The combination of fiscal, economic, geopolitical, and supply-side inflation pressures converging has bond markets in less familiar territory. The recent rise in yields can no longer be attributed simply to concerns over the deficit,\" said from Mike Sanders, head of fixed income at Madison Investments.\n\nThe data drove expectations of more rate hikes, with traders last pricing in a more-than-75 % chance that the Federal Open Market Committee will increase rates again at its October meeting, per the CME Group's FedWatch tool . That compares to a roughly 49% probability just a week ago.\n\n\"With markets pricing in four rate hikes through next year, the Fed is being pushed toward tighter policy at a time when the risk of a policy mistake is rising,\" he added.", "source": "CNBC Top News", "pub_date_str": "24 Sep 2026, 07:14 PM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Quantitative Methods", "Economics", "Equity Investments", "Fixed Income", "Portfolio Management"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "Sebi board approves FPI play in non-agri commodity derivatives, changes PMS rules", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Sebi board approves FPI play in non-agri commodity derivatives, expands scope of PMS The Economic Times daily newspaper is available online now. Read Today's Paper Sebi board approves FPI play in non-agri commodity derivatives, expands scope of PMS SECTIONS Sebi board approves FPI play in non-agri commodity derivatives, expands scope of PMS By Akash Podishetti , ETMarkets.com Last Updated: Sep 24, 2026, 07:27:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Sebi has approved new regulations allowing foreign portfolio investors to participate in non-agricultural commodity derivatives. This regulatory change aims to increase institutional participation and streamline existing portfolio manager regulations. The newly approved framework will clarify delivery structures for futures contracts to mitigate operational and tax challenges. Significant reforms were also made to simplify settlement proceedings and ease compliance burdens for research entities.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "24 Sep 2026, 07:13 PM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Equity Investments", "Derivatives", "Alternative Investments", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Sebi cancels registration of Religare Capital Mkts, 11 others for non-payment of renewal fee", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Sebi cancels registration of Religare Capital Mkts, 11 others for non-payment of renewal fee The Economic Times daily newspaper is available online now. Read Today's Paper Sebi cancels registration of Religare Capital Mkts, 11 others for non-payment of renewal fee SECTIONS Sebi cancels registration of Religare Capital Mkts, 11 others for non-payment of renewal fee PTI Last Updated: Sep 24, 2026, 07:12:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Sebi has revoked the registrations of Religare Capital Markets and 11 other entities due to their failure to pay required renewal fees for research analyst registrations. The fees were due between May 2024 and November 2025. Although these entities responded to show-cause notices, they could not substantiate their claims of non-payment, prompting Sebi to take measures to protect investors from potential misuses of expired registrations.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "24 Sep 2026, 07:12 PM IST", "pub_date_relative": "31m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Stocks slide again as Treasury yields push higher, Oracle leads Nasdaq names lower: Live updates", "full_content": "Stocks fell on Thursday as Treasury yields kept marching higher, with traders anticipating further rate hikes from the Federal Reserve. A pullback in Oracle weighed on tech.\n\nThe Nasdaq Composite sank 0.8%, while the Dow Jones Industrial Average fell 182 points, or 0.4%. The S&P 500 was down 0.5%.\n\nOracle shares sank more than 5% after Bloomberg News reported , citing sources, that the company was citing force majeure in order to protect itself from a data center project being built in New Mexico if it is delayed.\n\nThe 30-year Treasury bond yield touched 5.446%, a level not seen since June 2004. The benchmark 10-year Treasury note yield , which is tied to rates on mortgages, surged to 5.15%, near levels not reached since July 2007. The 2-year note yield was flat on the day, but scaled to a 2023 high earlier in the week.\n\nThose moves came as oil prices rose sharply. International Brent crude futures rose 1% to around $105 a barrel, while West Texas Intermediate crude gained 1% to around $93.\n\nAs yields surged, so did the market's anticipation of further rate hikes from central bank policymakers. Fed funds futures trading suggests a greater than 70% likelihood that the policy-setting Federal Open Market Committee lifts its key rate once more in October, according to the CME FedWatch tool . That compares to a roughly 55% probability just a week ago.\n\nHigher bond yields tend to squeeze consumers' finances as they face higher borrowing costs at a time when they're already paying more in fuel costs.\n\nIn a note Thursday, strategists at UBS Global Wealth Management said their base case was for energy disruption to remain relatively limited and an inflation shock insufficiently broad or persistent to derail economic growth.", "source": "CNBC Top News", "pub_date_str": "24 Sep 2026, 07:10 PM IST", "pub_date_relative": "33m ago", "cfa_topics": ["Quantitative Methods", "Economics", "Equity Investments", "Fixed Income", "Derivatives", "Portfolio Management"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "With the stock market \u2018priced for perfection,\u2019 the S&P 500 is in danger of a 20% slump next year", "full_content": "Clocktower\u2019s Eric Wallerstein believes stocks are headed for trouble next year, and safety-seeking investors could drive gold to $6,000 an ounce.", "source": "MarketWatch Top Stories", "pub_date_str": "24 Sep 2026, 07:10 PM IST", "pub_date_relative": "33m ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Listing lesson: NSE debut shows why mega-IPOs can disappoint despite high demand", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nThe exchange at the heart of India's stock market made a modest debut of its own. The National Stock Exchange (NSE) listed on the BSE at \u20b9 1,800 a share on Thursday, a 0.84% premium to its \u20b9 1,785 issue price, and ended the session about 1.8% above the offer price, even as the Sensex fell 1.67%.\n\nFor investors in India's second-largest initial public offering (IPO), the gain offered some comfort on a bruising market day. But it also underscored a familiar lesson from mega-IPOs: a large offering and a prominent business do not necessarily translate into a blockbuster debut.\n\nA Mint analysis of India's 20 largest IPOs, including NSE, shows a mixed record. Several offerings overcame broader market weakness to deliver strong first-day gains. Others disappointed despite heavy subscriptions, while debut-day winners have not always sustained their advantage .\n\nNSE\u2019s closing gain placed it near the bottom of the positive debuts in the sample. Of the 13 offerings that ended their first session above their issue prices, only Tata Capital posted a smaller gain, at 1.3%, according to Prime Database.\n\nNSE's \u20b9 22,562-crore offering, subscribed 5.71 times, trails only Hyundai Motor India in size. Its modest debut reflected competing forces: demand for a distinctive market-infrastructure business and selling by existing shareholders sitting on gains, according to analysts.\n\nAman Chowhan, senior fund manager, research and investment, at Abakkus Investment Managers, attributed the limited listing gains to NSE\u2019s large free float and profit-booking by existing shareholders. The resulting supply was sufficient to absorb fresh institutional demand, he said.\n\nSantosh Meena, head of research at Swastika Investmart , pointed to the factors supporting demand: strong fundamentals, a distinctive franchise, reasonable valuation and institutional participation.", "source": "LiveMint Markets", "pub_date_str": "24 Sep 2026, 07:08 PM IST", "pub_date_relative": "35m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Our top 10 things to watch in the stock market Thursday", "full_content": "The Trump-Xi summit kicks off today, and Meta delivers a big boost to its hardware lineup.", "source": "CNBC Top News", "pub_date_str": "24 Sep 2026, 06:54 PM IST", "pub_date_relative": "49m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Sebi board allows FPI access in non-farm goods, approves revamp of PMS, settlement rules", "full_content": "The Sebi board has widened FPI access to non-agri commodity derivatives and expanded the investment universe for PMS firms, while easing settlement and advertising rules.", "source": "LiveMint Markets", "pub_date_str": "24 Sep 2026, 06:53 PM IST", "pub_date_relative": "50m ago", "cfa_topics": ["Derivatives", "Alternative Investments"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "NSE debut boosts BSE's cash market turnover", "full_content": "The top-traded stock on BSE pushes the bourse's overall turnover to twice its average daily level so far this fiscal year. Euphoria seen persisting for the initial few days before abating.&nbsp;", "source": "LiveMint Markets", "pub_date_str": "24 Sep 2026, 06:49 PM IST", "pub_date_relative": "53m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}], "updated_at": "24 Sep 2026, 07:43 PM IST", "total_stories": 390};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>

</body>
</html>
