are fundamental CFA exam areas."}, {"title": "Aye Finance Q2 Results: Net profit more than doubles to Rs 87 crore", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a Earnings \u203a Aye Finance Q2 Results: Net profit more than doubles to Rs 87 crore Aye Finance Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Aye Finance Q2 Results: Net profit more than doubles to Rs 87 crore SECTIONS Aye Finance Q2 Results: Net profit more than doubles to Rs 87 crore PTI Last Updated: Oct 21, 2026, 06:05:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Aye Finance Ltd's net profit surged to Rs 87 crore in the second quarter of the financial year, a remarkable increase from Rs 35 crore in the same timeframe last year. Total income also climbed to Rs 527 crore, reflecting an 18.42% year-over-year growth. The interest income saw a rise to Rs 479 crore, while assets under management swelled by 26% to hit Rs 7,597 crore as of September 2026.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "21 Oct 2026, 06:05 PM IST", "pub_date_relative": "28m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Tokenized stock trading takes off overseas as Goldman, other U.S. companies object", "full_content": "Trading in so-called tokenized stocks is gaining momentum in international markets, even as major U.S. companies are pushing back against efforts to introduce them domestically.\n\nTrading activity around blockchain-based versions of traditional financial assets including equities is growing, according to the latest quarterly staking report by Bitwise Asset Management, published Tuesday. On Robinhood Chain, the brokerage firm's newly launched network for users and AI agents to trade various assets onchain, tokenized stocks volume surged from $526 million in July to $2.21 billion in August, then rocketed to $11.31 billion in September.\n\nIn the same quarter, non-crypto markets made up 36.5% of Hyperliquid's perpetuals volume, up from 32.7% in the previous quarter. Also, tokenized equities were the fastest-growing category on Solana.\n\nMeanwhile, Goldman Sachs , Microsoft , Qualcomm , Caterpillar , McDonald's , Western Digital and Alphabet have objected to having tokenized versions of their shares traded on the OKXICE platform, the tokenized securities venue jointly launched the crypto exchange OKX and New York Stock Exchange parent Intercontinental Exchange.\n\nOKXICE disclosed the company objections in a public notice Monday, adding them to a group of earlier objectors including CoreWeave , UnitedHealth , Broadcom , Applied Digital , AppLovin and Cerebras .\n\nThe contrast highlights a growing debate and challenge for the crypto industry: how to convince companies that tokenized trading of their stock is worth embracing. Tokenization \u2013 the process of issuing digital representations of publicly traded securities, real world assets or any other form of value on a blockchain network \u2013 has become a major topic of interest in the market given the potential for blockchain technology to improve accessibility and liquidity across financial assets.\n\nIt's also raising questions about what rights tokens should provide for holders.", "source": "CNBC World Economy", "pub_date_str": "21 Oct 2026, 06:03 PM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Best bank accounts for nonprofits of 2026", "full_content": "The right bank account can help a nonprofit manage its money and keep more available for its mission. Nonprofits have needs that many businesses don't, from managing restricted grants to depositing cash from fundraisers, so it pays to compare accounts before choosing one.\n\nCNBC Select reviewed nonprofit and business checking accounts from national banks, online platforms and mission-driven lenders to help you compare options. We considered monthly fees, transaction and cash deposit limits, interest, account management tools and nonprofit-specific support. Read more about our methodology below.\n\nOffers in this section are from affiliate partners and selected based on a combination of engagement, product relevance, compensation, and consistent availability.\n\n3.09% with a daily balance of $5,000,000 or below; 3.90% with a daily balance above $5,000,000\n\nVaries. The account has an option to earn interest, but rates are set at the bank's discretion, and you must keep the minimum balance for each tier to earn the stated APY\n\n1,800 free transactions per year, plus 300 free cash deposit units per calendar year. Includes a U.S. Bank Business Debit Card. Shared Access lets organizations assign user permissions.\n\n$36 for each overdraft item paid, up to three fees per day. No fee if the account is overdrawn by $50 or less at the end of the business day\n\nTerms apply. Deposit products are offered by U.S. Bank National Association. Member FDIC", "source": "CNBC Top News", "pub_date_str": "21 Oct 2026, 06:00 PM IST", "pub_date_relative": "33m ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Extent of rate hike cycle to depend on growth-inflation outlook: RBI Governor", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a Extent of rate hike cycle to depend on growth-inflation outlook: RBI Governor The Economic Times daily newspaper is available online now. Read Today's Paper Extent of rate hike cycle to depend on growth-inflation outlook: RBI Governor SECTIONS Extent of rate hike cycle to depend on growth-inflation outlook: RBI Governor PTI Last Updated: Oct 21, 2026, 05:56:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Reserve Bank of India (RBI) Governor Sanjay Malhotra said the duration and extent of the rate hike cycle will be contingent on the actual growth-inflation developments and outlook. The governor and other five Monetary Policy Committee (MPC) members voted to raise the repo rate by 25 bps to 5.5 per cent. The rate was hiked after a gap of nearly four years. He noted that there are increasing signs of generalisation of inflation.\n\nOne company, 2 words. Bond yield and CDS: Will they decide the fate of global markets?\n\nBusiness of Odd Things: Inside an industry that farms fish that nobody is meant to eat\n\nWar's second-order effects are becoming visible in critical sectors\n\nUS mid-term elections \u2013 Part 2: What does it mean for Trump to lose control of Congress?\n\nHomebuyers wait as NCLT panel picks holes in unfinished Jaypee projects\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "21 Oct 2026, 05:56 PM IST", "pub_date_relative": "36m ago", "cfa_topics": ["Economics", "Fixed Income", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Suzlon Energy declares Q2 results 2026 date; can Q2 earnings bring a bounce-back in share price? Target, stop-loss", "full_content": "Suzlon Energy Q2 Results 2026 Date | Stock to buy: The board of directors of Suzlon Energy Ltd., has declared the date for the announcement of the Q2 results 2026. The renewable energy company informed, through an exchange filing, that the board of directors will meet on 29th October 2026 to declare the company's financial results for the July to September 2026 quarter.\n\nSuzlon Energy declared the Q2 results 2026 date in an exchange filing, saying, \"Pursuant to Regulation 29 of the Securities and Exchange Board of India (Listing Obligations and Disclosure Requirements) Regulations, 2015, this is to inform that a Meeting of the Board of Directors of the Company will be held on Thursday, 29th October 2026 to, inter alia, consider and approve the Unaudited Financial Results of the Company on Standalone and Consolidated basis for the quarter and half year ended on 30th September 2026.\"\n\nSo, as per the Company\u2019s Code of Conduct to regulate, monitor and report trading by Insiders as required to be implemented in terms of the Securities and Exchange Board of India (Prohibition of Insider Trading) Regulations, 2015, as amended, the Trading Window of the Company has been closed from Thursday, 1st October 2026 till 48 (Forty Eight) hours after the declaration of the financial results of the Company (both days inclusive). Accordingly, the Trading Window shall remain closed till Saturday, 31st October 2026 and shall reopen on Sunday, 1st November 2026.\n\nAccording to stock market experts, Suzlon Energy is expected to report strong Q2FY27 numbers, which may work as a bounce-back factor for the energy counter. They said the renewable energy sector is well-positioned for better business during the July to September 2026 quarter.", "source": "LiveMint Markets", "pub_date_str": "21 Oct 2026, 05:54 PM IST", "pub_date_relative": "39m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "SpaceX up 8% in premarket after earnings beat and Musk hints at Tesla tie-up", "full_content": "SpaceX jumped in premarket trading on Wednesday after the company reported surging revenue growth in its third quarter, and owner Elon Musk floated a potential SpaceX- Tesla merger.\n\nThe space company, which made its debut on the Nasdaq in the biggest IPO ever in June, reported third-quarter revenue on Tuesday of $14.6 billion, up 161% from the previous year, and beating LSEG consensus estimates of $12.72 billion.\n\nMeanwhile, its operating income from operations came in at $2.8 billion, with net income of $4.4 billion, after reporting a net loss of $1.05 billion in the same period a year earlier.\n\nOn the earnings call, Musk said he's considering a combination with Tesla \u2014 which would mark the largest merger in history \u2014 and that the boards of both companies have created specific committees to discuss a consolidation.\n\n\"I do think there's a lot of merit to combining the companies as we are pretty much in the superintelligence singularity, and there's a lot to be gained from cooperating,\" Musk said on the call. Tesla is set to report third-quarter earnings after the closing bell on Wednesday.\n\nSpaceX shares last rose 8.25% before the markets opened on Wednesday. Meanwhile, Tesla shares were up 1.4% in premarket trading.\n\nShares of other space stocks, including Rocket Lab , Intuitive Machines , and AST SpaceMobile , were all higher in premarket trading.\n\nSpaceX shares since its debut on the Nasdaq. SpaceX forecasts first-quarter 2027 revenue between $33 billion and $37 billion, beating the average analyst estimate of $22.2 billion, per LSEG.", "source": "CNBC World Economy", "pub_date_str": "21 Oct 2026, 05:53 PM IST", "pub_date_relative": "40m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Investors are questioning neoclouds' business model but Nebius says AI computing prices are rising", "full_content": "BERLIN \u2014 Nebius is seeing AI computing prices rise more than expected, a top executive told CNBC on Wednesday, offering a bullish view as neocloud firms' business model comes under increasing scrutiny .\n\nInvestors have grown wary after CoreWeave , one of the biggest neocloud players, saw its cost of borrowing spike . The CoreWeave developments and questions around the amount of debt being used to fund the data center buildout have weighed heavily on other neoclouds like Iren and Nebius, whose stocks have dropped sharply over the last month.\n\nMarc Boroditsky, chief revenue officer at Nebius, said his company wasn't in CoreWeave's position because \"we're not carrying the kind of debt that they are.\"\n\nHe also said that if the AI infrastructure company brought its 2027 capacity online, it would sell out. There could be \"the same type of dynamic\" in 2028, supporting a positive longer-term demand outlook, he said, as companies race to secure access to computing power.\n\nWhen asked whether he sees the price per megawatt continuing to rise ahead of expectations, Boroditsky replied: \"Yeah.\"\n\nNebius is among a new wave of Neocloud companies that are investing billions to buy up Nvidia 's graphics processing units, build data centers and rent that capacity.\n\nNebius ran an auction for computing capacity on Tuesday, which showed continued price rises, the revenue chief said. \"We're seeing continued upward mobility in terms of the kind of price per megawatt,\" he told CNBC.\n\nPrice per megawatt, a key measure among new cloud companies, shows how much a company can charge customers for a certain amount of computing capacity.", "source": "CNBC World Economy", "pub_date_str": "21 Oct 2026, 05:51 PM IST", "pub_date_relative": "42m ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "OpenAI to bring AI models to Google's cloud, in further expansion beyond Microsoft", "full_content": "OpenAI will make its artificial intelligence models available for developers through Google's cloud, following years of competition between the two companies.\n\nFor OpenAI, the effort reflects a growing push to expand distribution of its technology to enterprise developers. That's critical as the ChatGPT creator looks to build its business beyond its consumer roots, and the move puts OpenAI's models on all three of the top cloud infrastructure providers.\n\nLess than six months ago, OpenAI said Microsoft would no longer have the exclusive license on its intellectual property. The day after that ended, cloud leader Amazon unveiled plans to host OpenAI models .\n\nNow Google is getting its shot, bringing OpenAI's GPT products to its cloud's model garden and Antigravity coding tool in the coming weeks.\n\n\"Google Cloud's longstanding investment in machine learning and AI has made it a destination for AI workloads and the developers and data scientists building them,\" OpenAI said in a blog post.\n\nGoogle has been on a run in cloud computing this year. Annualized revenue growth in the segment accelerated to about 82% in the second quarter from 63% in the first quarter, thanks partly to strong demand for AI models and custom chips. Amazon and Microsoft posted second-quarter cloud growth of 37% and 42% , respectively. All three report quarterly results next week.\n\nMost business spending on AI is on OpenAI and Anthropic, according to data from corporate card issuer Ramp, though some corporate IT departments have integrated Google's Gemini models into their systems. In September, Google announced its next-generation Gemini 4 Argon model.\n\nOpenAI was founded in 2015 partly as a counterweight to the concentration of AI research at companies like Google. Two years later, Google employees submitted the influential Transformer academic paper that propelled AI, but it was OpenAI that helped bring the technology forward with ChatGPT.", "source": "CNBC World Economy", "pub_date_str": "21 Oct 2026, 05:50 PM IST", "pub_date_relative": "43m ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Not A One-Off: RBI MPC Minutes Point To A Rate-Hike Cycle As Inflation Heads To 6% Ceiling", "full_content": "\"At some point, a larger pass-through of input costs to output prices may materialise. Under these circumstances, it is conceivable that a further increase in the policy rate might be needed,\" RBI Deputy Governor Poonam Gupta said.", "source": "NDTV Profit", "pub_date_str": "21 Oct 2026, 05:46 PM IST", "pub_date_relative": "46m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "India wants manufacturing at 25% of GDP \u2014 will AI in factories help?", "full_content": "Choose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "21 Oct 2026, 05:44 PM IST", "pub_date_relative": "49m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "India\u2019s economy stays resilient at 7.1%, but rising inflation raises a red flag, says RBI's Sanjay Malhotra", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Indicators \u203a India\u2019s economy stays resilient at 7.1%, but rising inflation raises a red flag, says RBI's Sanjay Malhotra The Economic Times daily newspaper is available online now. Read Today's Paper India\u2019s economy stays resilient at 7.1%, but rising inflation raises a red flag, says RBI's Sanjay Malhotra SECTIONS India\u2019s economy stays resilient at 7.1%, but rising inflation raises a red flag, says RBI's Sanjay Malhotra ET Online Last Updated: Oct 21, 2026, 06:11:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Indian economy is projected to maintain a growth rate of 7.1% for the year 2026-27. This projection is an increase from the previously estimated 6.7%. RBI governor Sanjay Malhotra noted that inflationary pressures are rising, which could impact the growth outlook. Despite turbulent global conditions, India's economic resilience has been remarkable according to the governor.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\nOne company, 2 words. Bond yield and CDS: Will they decide the fate of global markets?\n\nBusiness of Odd Things: Inside an industry that farms fish that nobody is meant to eat\n\nWar's second-order effects are becoming visible in critical sectors\n\nUS mid-term elections \u2013 Part 2: What does it mean for Trump to lose control of Congress?\n\nHomebuyers wait as NCLT panel picks holes in unfinished Jaypee projects\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "21 Oct 2026, 05:43 PM IST", "pub_date_relative": "50m ago", "cfa_topics": ["Economics", "Fixed Income", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Dow Jones| Nasdaq | S&P 500 | US Stock Market Today |Live Updates: Nasdaq futures lead gains as SpaceX, Super Micro results lift AI stocks", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a Dow Jones| Nasdaq | S&P 500 | US Stock Market Today |Live Updates: Nasdaq futures lead gains as SpaceX, Super Micro results lift AI stocks Powered By LIVE BLOG Dow Jones| Nasdaq | S&P 500 | US Stock Market Today |Live Updates: Nasdaq futures lead gains as SpaceX, Super Micro results lift AI stocks 21 Oct 2026 | 06:06:43 PM IST Synopsis US Market | Dow Jones Live Updates: Nasdaq futures lead Wall Street gains as SpaceX and Super Micro results revive the AI trade, while Netflix slides on a weak profit forecast. Nvidia and other chip stocks rise, offering relief after a prolonged selloff. Investors also track oil prices and Fed rate expectations.\n\nComments are moderated and will be allowed if they are about the topic and not abusive.\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Markets", "pub_date_str": "21 Oct 2026, 05:40 PM IST", "pub_date_relative": "53m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "United Airlines set to open its biggest airport lounge in $2.6 billion overhaul at Houston hub", "full_content": "United Airlines is set to open its biggest airport lounge this week, which it says is the largest in the Americas, as airlines continue to plow money into the facilities for high-spending customers.\n\nThe 54,000-square-foot lounge is opening Thursday at George Bush Intercontinental Airport's Terminal B in Houston, part of an overhaul of the airport that includes 22 gates for mainline aircraft.\n\nThe airport, with more than 500 departures a day, is United's main connecting hub for flights to and from Latin America.\n\nThe new club can seat 800 people and features an outdoor terrace for plane-spotting as well as two full-service bars and buffets.\n\nThe new lounge, part of United's $2.6 billion investment at the airport's Terminal B, shows how airlines are putting more money into larger spaces for premium-travel demand to attract the growing ranks of elite frequent flyers, co-branded credit card holders and customers just willing to spend more to fly.\n\nAmerican Airlines earlier this month said it is planning its largest-ever lounge at its Charlotte Douglas International Airport hub in North Carolina. Delta Air Lines has expanded both its popular Delta Sky Clubs and its top-tier Delta One Lounges.\n\nSouthwest Airlines is building its first-ever network of airport lounges , which are tied to its credit card partner, Chase . Last week, the carrier unveiled mock-ups of the lounges, which it is calling Icon. And JetBlue Airways opened lounges in New York and Boston in the past year.", "source": "CNBC Top News", "pub_date_str": "21 Oct 2026, 05:39 PM IST", "pub_date_relative": "53m ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Musk says Tesla and SpaceX formed special committees to discuss merger: Live updates", "full_content": "SpaceX shares climbed about 8% in extended trading on Tuesday after the company reported 161% revenue growth for the third quarter, beating Wall Street estimates, with its artificial intelligence business growing ninefold.\n\nOn the earnings call, CEO Elon Musk said a merger with Tesla , his automaker, would be a \"good idea,\" adding that the boards of both companies have formed special committees to discuss a tie-up. Tesla reports third-quarter results after the bell on Wednesday.\n\nSpaceX said in a release that it recorded operating income of $2.8 billion and net income of $4.4 billion. In the same period a year earlier, SpaceX reported a net loss of $1.05 billion.\n\nCFO Bret Johnsen said on the call that revenue in the first quarter of 2027 will be $33 billion to $37 billion, trouncing the average $22.2 billion average analyst estimate, according to LSEG. Johnsen attributed the forecast to \"increased visibility into our compute contract pipeline over the next six months.\"\n\nWhile SpaceX is best known for its reusable rockets, most of its revenue and profit in recent quarters came from the company's connectivity segment, which consists of its Starlink satellite internet service.\n\nStarlink's subscribers base grew to 13.6 million in the quarter, up from 12 million in the prior period.\n\nTotal connectivity revenue jumped 69% to $5.25 billion from $3.1 billion a year earlier. Analysts were expecting $4.84 billion, according to StreetAccount. Revenue from consumer Starlink subscribers amounted to $3.12 billion, while the company generated $2.13 billion from government and enterprise customers.\n\nBuzz has been building about Starlink's plans to build a U.S. mobile network after SpaceX, earlier this month, announced that it's buying 800 MHz of low-band spectrum, and after the Federal Communications Commission approved a plan for the company to build out a 15,000-satellite constellation.", "source": "CNBC World Economy", "pub_date_str": "21 Oct 2026, 05:38 PM IST", "pub_date_relative": "55m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "New policy in works to boost agrivoltaics in India; enhance farmers' income via energy generation", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Agriculture \u203a New policy in works to boost agrivoltaics in India; enhance farmers' income via energy generation The Economic Times daily newspaper is available online now. Read Today's Paper New policy in works to boost agrivoltaics in India; enhance farmers' income via energy generation SECTIONS New policy in works to boost agrivoltaics in India; enhance farmers' income via energy generation PTI Last Updated: Oct 21, 2026, 05:29:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India's government is formulating a policy to enhance the adoption of agrivoltaics across the country. This initiative aims to increase farmers' income by combining agricultural production with solar energy generation. States with significant agrivoltaic potential include Maharashtra, Rajasthan, and Madhya Pradesh, accounting for nearly half of India's cropland suitable for this practice.\n\nOne company, 2 words. Bond yield and CDS: Will they decide the fate of global markets?\n\nBusiness of Odd Things: Inside an industry that farms fish that nobody is meant to eat\n\nWar's second-order effects are becoming visible in critical sectors\n\nUS mid-term elections \u2013 Part 2: What does it mean for Trump to lose control of Congress?\n\nHomebuyers wait as NCLT panel picks holes in unfinished Jaypee projects\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "21 Oct 2026, 05:29 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Fixed Income", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stock futures rise as traders evaluate latest raft of earnings; SpaceX shares surge: Live updates - CNBC", "full_content": "Stock futures rise as traders evaluate latest raft of earnings; SpaceX shares surge: Live updates CNBC Stock Market Today: Dow Futures Steady; SpaceX Shares Surge on Tesla Deal Talks \u2014 Live Updates WSJ Elon Musk says SpaceX hitting $1 trillion in revenue in 2028 is 'no longer impossible' Business Insider SpaceX earnings left one big question unanswered Yahoo Finance Nasdaq futures lead gains as SpaceX, Super Micro results lift AI stocks Reuters", "source": "Google News Business", "pub_date_str": "21 Oct 2026, 05:28 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Jio Platforms IPO Day 1 Highlights: Issue Gets Subscribed 3.01 Times; QIBs Lead Bidding", "full_content": "Jio Platforms' Rs 30,213-crore IPO opens today. Track subscription trends, investor demand, GMP, allotment details and listing updates here.", "source": "NDTV Profit", "pub_date_str": "21 Oct 2026, 05:22 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Retirement planning: How much should you invest in stocks and mutual funds after 60? Here's what expert suggests", "full_content": "Retirement brings a fundamental change in how investors should manage their savings. While equities can help build wealth during working years, a sharp market correction after retirement can put years of accumulated savings at risk, particularly when investors depend on their portfolios to meet monthly expenses.\n\nFor someone retiring at 60, the challenge is not simply earning higher returns. It is ensuring that the retirement corpus lasts another 20 to 30 years, even as inflation pushes up household expenses and markets go through periods of volatility.\n\nSo, how much of a retirement portfolio should remain invested in stocks and equity mutual funds ?\n\nAccording to M. Pattabiraman, founder of personal finance platform Freefincal and professor at IIT Madras, a typical retiree should consider limiting equity exposure to 30% of the retirement corpus. Those with substantially larger savings than required may have greater flexibility to take equity risks.\n\nIn a Freefincal report, Pattabiraman outlined three principles for determining equity allocation after retirement, focusing on corpus size, inflation-adjusted returns and the ability to withstand prolonged market downturns.\n\nDuring their working years, investors may hold 50-70% of their portfolios in equities to benefit from long-term market growth. However, Pattabiraman argues that this allocation needs to be reconsidered once regular withdrawals begin.\n\nHis framework suggests keeping equity exposure below 30% for a typical retirement, although the appropriate allocation depends on the size of the corpus and the investor's financial circumstances.\n\nFor instance, consider two retirees who each need \u20b9 6 lakh annually to meet expenses. One has accumulated \u20b9 1.8 crore, equivalent to 30 times annual expenses, while the other has \u20b9 4.5 crore, or 75 times annual expenses.", "source": "LiveMint Money", "pub_date_str": "21 Oct 2026, 05:15 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "177% returns in 5 yrs! ICICI Sec sees 51% upside potential in this small finance bank stock; do you own? Target price", "full_content": "Shares of Ujjivan Small Finance Bank (USFB) ended lower on Wednesday, October 21. Despite the decline, the stock has surged 22.75% in one year. The Bengaluru-headquartered small finance reported stronger than expected performance in the first half of the financial year 2026-27.\n\nThe small finance bank is likely to perform well in the coming quarters backed by stable asset quality and strong growth, according to ICICI Securities , which sees nearly 51% upside potential in the bank stock.\n\nThe small finance bank showcased robust earnings momentum in the first quarter of financial year 2026-27, which continued in Q2FY27 as well. The bank delivered a robust 2.4% RoA/~20% RoE, supported by strong AUM growth of 32% YoY.\n\n\u201cTaking cognisance of the better-than-expected financial performance in H1FY27, management now anticipates full-year FY27 RoA to exceed its initial guidance range of 2%,\u201d noted ICICI Securities in its report highlighting that a 25 basis points (bps) repo rate hike poses a 10 bps headwind to NIM compression in H2FY27.\n\nThe brokerage maintained its \u2018Buy\u2019 recommendation for the stock and revised target price upwards. \u201cBacked by stable asset quality, strong growth, and well-timed capital raise of INR 4.1bn via a preferential issuance to IFC & others, we maintain BUY with an upwardly revised TP of INR 95 (earlier INR 90), basis 2x Sep\u201927E BVPS.\u201d The brokerage sees nearly 51% upside potential in the stock.\n\nThe stock closed 1.92% lower at \u20b9 61.95 per share on BSE with a market capitalisation of \u20b9 12,098.62 crore on Wednesday. Its share price value has declined 4.28% in one month, and around 5.77% in three months.\n\nDespite the decline, its share price value has surged 16.10% in 2026 so far. The stock has jumped 22.75% in one year and around 61% in two years. The small finance bank stock has delivered 177.18% return in five years.\n\nDisclaimer: This story is for educational and informational purposes only.", "source": "LiveMint Markets", "pub_date_str": "21 Oct 2026, 05:15 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Donald Trump Launches $25 Million Cash Reward Programme For Those Who Report Fraud", "full_content": "President Donald Trump has launched a $25 million whistleblower programme to encourage people to report suspected fraud involving government funds, with conservative YouTuber Nick Shirley becoming its first publicly announced as a recipient.", "source": "NDTV Profit", "pub_date_str": "21 Oct 2026, 05:12 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Bitcoin rebounds above $83,000 as strong US earnings and falling oil prices lift risk appetite", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Crypto \u203a Crypto News \u203a Bitcoin rebounds above $83,000 as strong US earnings and falling oil prices lift risk appetite The Economic Times daily newspaper is available online now. Read Today's Paper Bitcoin rebounds above $83,000 as strong US earnings and falling oil prices lift risk appetite SECTIONS Bitcoin rebounds above $83,000 as strong US earnings and falling oil prices lift risk appetite By Surbhi Khanna , ET Online Last Updated: Oct 21, 2026, 05:09:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Bitcoin rebounded 2.1% to $83,529 as stronger US equities, easing oil prices and $526.6 million in spot ETF inflows boosted sentiment. Analysts identified $86,000 as key r     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
