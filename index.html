:37:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The United States is currently experiencing modest economic growth; however, inflation continues to be a significant concern. This has prompted the Federal Reserve to contemplate potential interest rate adjustments. Recent reports show a marked increase in the Personal Consumption Expenditures Price Index for October versus a year ago. Businesses are facing rising expenses across multiple sectors, highlighting persistent economic challenges and uncertainties on the horizon.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "26 Nov 2026, 01:37 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Agencies announce dollar thresholds for applicability of truth in lending and consumer leasing rules for consumer credit and lease transactions", "full_content": "Official websites use .gov A .gov website belongs to an official government organization in the United States.\n\nSecure .gov websites use HTTPS A lock ( Lock Locked padlock icon ) or https:// means you've safely connected to the .gov website. Share sensitive information only on official, secure websites.\n\nFor release at 3:00 p.m. EST Share --> --> --> --> --> --> The Federal Reserve Board and the Consumer Financial Protection Bureau today announced the dollar thresholds used to determine whether certain consumer credit and lease transactions in 2027 are subject to certain protections under Regulation Z (Truth in Lending) and Regulation M (Consumer Leasing).\n\nBy law, the agencies are required to adjust the thresholds annually based on the annual percentage increase in the Consumer Price Index for Urban Wage Earners and Clerical Workers, known as CPI-W. Transactions at or below the thresholds are subject to the protections of the regulations.\n\nSpecifically, based on the 3.9 percent annual percentage increase in the CPI-W as of June 1, 2026, Regulation Z and Regulation M generally will apply to consumer credit transactions and consumer leases of $76,300 or less in 2027. However, private education loans and loans secured by real property, such as mortgages, are subject to Regulation Z regardless of the amount of the loan.\n\nFederal Register notice: Consumer Leasing (Regulation M) (PDF)\n\nFederal Register notice: Truth in Lending (Regulation Z) (PDF)", "source": "Federal Reserve", "pub_date_str": "26 Nov 2026, 01:30 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Agencies announce dollar thresholds for smaller loan exemption from appraisal requirements for higher-priced mortgage loans", "full_content": "Official websites use .gov A .gov website belongs to an official government organization in the United States.\n\nSecure .gov websites use HTTPS A lock ( Lock Locked padlock icon ) or https:// means you've safely connected to the .gov website. Share sensitive information only on official, secure websites.\n\nFor release at 3:00 p.m. EST Share --> --> --> --> --> --> The Consumer Financial Protection Bureau, the Federal Reserve Board, and the Office of the Comptroller of the Currency today announced that the 2027 threshold for higher-priced mortgage loans that are subject to special appraisal requirements will increase from $34,200 to $35,500.\n\nThe threshold amount will be effective January 1, 2027, and is based on the 3.9 percent annual percentage increase in the Consumer Price Index for Urban Wage Earners and Clerical Workers, known as CPI-W, as of June 1, 2026.\n\nThe Dodd-Frank Act added special appraisal requirements for higher-priced mortgage loans to the Truth in Lending Act, including that creditors obtain a written appraisal based on a physical visit to the interior of the home before making a higher-priced mortgage loan. The rules implementing these requirements contain an exemption for loans at or below a threshold amount that is adjusted annually to reflect CPI-W increases.\n\nFederal Register notice: Appraisals for Higher-Priced Mortgage Loans Exemption Threshold (PDF)", "source": "Federal Reserve", "pub_date_str": "26 Nov 2026, 01:30 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Copper slumps to lowest in 11 months as investors flee", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Commodities \u203a Copper slumps to lowest in 11 months as investors flee The Economic Times daily newspaper is available online now. Read Today's Paper Copper slumps to lowest in 11 months as investors flee SECTIONS Copper slumps to lowest in 11 months as investors flee Reuters Last Updated: Nov 26, 2026, 01:23:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Copper prices on the London Metal Exchange have plummeted to their lowest point in over 11 months, fueled by a shift away from technology and AI stocks, causing widespread market anxiety. Notably, open interest in copper reflects this trend, showing a significant dip in trading activity. Prices for other metals like tin and aluminum also saw sharp falls, as ongoing market uncertainties dampen investor confidence in commodities.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "26 Nov 2026, 01:23 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments", "Derivatives"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "US yields fall but move off lows as stocks pare sharp losses", "full_content": "NEW YORK, Nov 25 (Reuters) - US Treasury yields declined on Wednesday but were off their earlier lows, as another drop in AI-related stocks that caused sharp losses in equity markets lost steam and dampened the safe-haven appeal of bonds.\n\nUS stocks saw sharp losses in the first half of the trading session, with stocks related to the buildout of the emerging technology showing continued weakness, as the reinstatement of Nvidia CEO Jensen Huang earlier this week has proved to be only a temporary reprieve from the selling pressure in the space.\n\nBut stocks have mounted a comeback in the latter stages of trading, with the S&P 500 technology sector down 1.3% after falling as much as 5.4% on the day, while the Nasdaq Composite was down 0.7% after falling as much as 4.7%.\n\nThe yield on the benchmark US 10-year Treasury note fell 6.2 basis points to 4.84% and was on pace for its seventh daily drop in the past eight sessions. The yield on the 10-year had earlier fallen to 4.8%, its lowest since September 9.\n\n\"When the market moves this fast to the downside, everybody gets a little nervous. I'm not doing cartwheels or anything like that,\" said Scott Wren, market strategist at North Star Market Analysis LLC in St. Louis.\n\n\"You're not likely to go a whole lot below 4.80% or so in the yield on the 10-year.", "source": "LiveMint Markets", "pub_date_str": "26 Nov 2026, 01:13 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments", "Fixed Income", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Saudi national in OpenAI bugging case is out on bond after DOJ tries to block release", "full_content": "Abdulrahman Alfozan , the Saudi national accused of bugging an executive conference room at OpenAI 's headquarters, has been released from custody , his attorney told CNBC on Wednesday.\n\nThe confirmation of Alfozan's release came a day after a federal judge in San Francisco said the defendant would be allowed out of jail on a $1 million bond, despite prosecutors' warnings that he posed a serious flight risk.\n\nAlfozan, a former OpenAI engineer, is expected to be fitted with an ankle monitor, his attorney, David Rizk, previously told CNBC.\n\nAlfozan was scheduled to be released from detention Wednesday morning at 8 a.m. PT. Shortly before that deadline, U.S. Attorney Craig Missakian of the Northern District of California urged the court to maintain Alfozan's detention pending trial, \"given the significant risk that the defendant will flee to Saudi Arabia if he is released from custody.\"\n\nIn an order posted on the case docket later Wednesday, Judge Vince Chhabria said the court only learned of the government's last-minute bid to block Alfozan's release after he had already been let out. The government's motion \"is therefore denied as moot,\" Chhabria's order stated. The judge set a hearing for Dec. 3 on the bid to revoke the magistrate judge's order releasing Alfozan.\n\nPointing to Alfozan's \"ample resources, significant family and professional ties to Saudi Arabia, and few remaining ties to the United States,\" Missakian had argued in a court filing that the release conditions imposed by Magistrate Judge Alex Tse \"are insufficient to safeguard the defendant's appearance for future proceedings in this case.\"\n\nAlfozan \"presents a serious risk of flight that no set of release conditions can reasonably mitigate,\" Missakian wrote.\n\nHis office sought to pause the magistrate judge's release order until a ruling on a motion to revoke it. The Department of Justice did not immediately respond to CNBC's request for comment on Alfozan's release.", "source": "CNBC World Economy", "pub_date_str": "26 Nov 2026, 12:41 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Soybeans rebound ahead of holiday as soymeal futures climb", "full_content": "(Rewrites throughout with US trading, adds quote, updates prices, changes byline, changes dateline from PARIS/SINGAPORE)\n\nCHICAGO, Nov 25 (Reuters) - US soybean futures rebounded on Wednesday from overnight lows as soymeal futures rallied and as traders shrugged off concerns that trade tensions with China would disrupt a robust pace of US exports.\n\nCorn firmed on short covering ahead of the US Thanksgiving holiday market closure on Thursday after sinking to a five-month low the previous day, while wheat futures mixed amid demand headwinds from a strong dollar and improving US crop conditions.\n\nGrain markets will be closed on Thursday before reopening on Friday for an abbreviated trading session.\n\nFutures were mostly lower in overnight trading after US President Donald Trump's administration proposed new tariffs on 14 major trading partners including China.\n\nBut soybeans clawed back the losses as investors assessed that exports to China would not be severely impacted as the top soy importer was already on pace to meet its annual purchasing commitment, and as the two countries continue to work on resolving agricultural trade issues. Meanwhile, any crop shortfall in South America could spark additional US soy demand, analysts said.\n\nThe market also drew support from soaring soymeal futures as demand from the EU could rise due to new deforestation rules set take effect in late December.\n\n\"You've got meal on fire, the idea that our crush is going to be strong and that we're going to be exporting a lot of meal. China is going to buy the 25 million metric tons, come hell or high water, tariffs or no tariffs,\" said Ted Seifried, chief market strategist at Zaner Ag Hedge.", "source": "LiveMint Markets", "pub_date_str": "26 Nov 2026, 12:08 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "From ropeways to ring roads: Karan Adani reveals the group\u2019s next big bets at ET Bengal Ascends", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Infrastructure \u203a From ropeways to ring roads: Karan Adani reveals the group\u2019s next big bets at ET Bengal Ascends The Economic Times daily newspaper is available online now. Read Today's Paper From ropeways to ring roads: Karan Adani reveals the group\u2019s next big bets at ET Bengal Ascends SECTIONS From ropeways to ring roads: Karan Adani reveals the group\u2019s next big bets at ET Bengal Ascends By ET TEAM Last Updated: Nov 26, 2026, 12:08:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Adani Group aims to expand its operations in West Bengal by bidding for thermal power and infrastructure projects. The group plans to develop the Kolkata Outer Ring Road to ease urban congestion. Karan Adani highlighted the importance of strategic infrastructure planning to avoid bottlenecks in port operations. The company secured a renewable power supply contract for 1,750 MW starting July 2028.\n\nThe fall is new, the pattern is 11 years old: Making sense of gold's crash\n\nAs AI sharpens cyber attacks, should listed companies follow one standard in reporting them?\n\nKYC and KYB: Zydus Lifesciences \u2013 From the chemist\u2019s counter to US pharmacies. Part 1 of 3\n\nWhat would it take for the world to stop needing the Strait of Hormuz?\n\nHidden export winners: The unlikely products finding real buyers abroad\n\nIndia\u2019s USD25 bn copper drive moves from building smelters to securing mines\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "26 Nov 2026, 12:08 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Anthropic teeters at $1 trillion market cap. Why it may stabilize from here", "full_content": "Anthropic's post-IPO slide tests the AI trade as analysts defend its enterprise edge.", "source": "CNBC Top N inancial policies that uphold low interest rates, are under scrutiny. The US Trade Representative details factors tied to excess capacity in Indian manufacturing, pointing to issues in specific industries like steel and solar energy, which pose notable challenges for US companies and employees.\n\nThe fall is new, the pattern is 11 years old: Making sense of gold's crash\n\nAs AI sharpens cyber attacks, should listed companies follow one standard in reporting them?\n\nKYC and KYB: Zydus Lifesciences \u2013 From the chemist\u2019s counter to US pharmacies. Part 1 of 3\n\nWhat would it take for the world to stop needing the Strait of Hormuz?\n\nHidden export winners: The unlikely products finding real buyers abroad\n\nIndia\u2019s USD25 bn copper drive moves from building smelters to securing mines\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "25 Nov 2026, 11:55 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Economics", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "US Proposes 17% Tariff On India. Here's How That Compares With China, Japan And Vietnam", "full_content": "The US has proposed a 17% tariff rate for India following a trade probe, while fresh levies targeting major trading partners, including China, the EU and Japan, are also on the table.", "source": "NDTV Profit", "pub_date_str": "25 Nov 2026, 11:40 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Fixed deposit rates: Suryoday Small Finance Bank offers 8.25% on 5-year FDs; compare rates at SBI, HDFC Bank and others", "full_content": "Fixed deposits (FDs) remain a popular in     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
