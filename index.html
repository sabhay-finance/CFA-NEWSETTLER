e tasks and numbers and finding patterns, and those types of jobs are the clerical, administrative jobs that a lot of women hold,'' said Ariane Hegewisch, a senior research fellow at the Institute for Women's Policy Research. \"It's still 90% of secretaries and clerical workers who are women.\"\n\nNew research backs this up. The International Labour Organization in March concluded that nearly one in 10 women in high-income countries works in occupations at the highest risk from AI.\n\nIn the 1940s, nearly 95% of America's telephone operators were female. It was a relatively well-paying job for women at the time, and a complicated one: It took months of training to be able to handle the several hundred calls an hour that could come in at peak times. Operators were expected to be speedy, precise \u2014 and polite.\n\nThese women were hit hard when AT&T introduced the automated telephone switch. It was one of the largest automation investments in history \u2014 a close analog to the massive AI investment now underway \u2014 and created one of the biggest technological shocks the nation had ever seen.", "source": "CNBC World Economy", "pub_date_str": "19 Oct 2026, 07:50 PM IST", "pub_date_relative": "30m ago"}, {"title": "Rs 2,744 Crore From Bot Leads, 10 Bps Off The Cost Ratio: Bajaj Finance's AI Math So Far", "full_content": "Despite the surge in AI use and a sharp jump in generation of business leads, the key efficiency gauge has barely moved. Here's a look at the factors involved.", "source": "NDTV Profit", "pub_date_str": "19 Oct 2026, 07:49 PM IST", "pub_date_relative": "30m ago"}, {"title": "Bajaj Finance Targets Up To 27% Growth In FY27 Despite Marginal NIM Moderation", "full_content": "Bajaj Finance also said the winding down of its captive lending book could support an improvement in credit costs.", "source": "NDTV Profit", "pub_date_str": "19 Oct 2026, 07:47 PM IST", "pub_date_relative": "32m ago"}, {"title": "India sets import quotas for New Zealand apples, , 07:35 PM IST", "pub_date_relative": "44m ago"}, {"title": "China Announces Export Controls On Tunnel Boring Machines And Related Equipment", "full_content": "The restrictions on exports of tunnel boring machines (TBMs) and related items could affect several Indian projects.", "source": "NDTV Profit", "pub_date_str": "19 Oct 2026, 07:34 PM IST", "pub_date_relative": "45m ago"}, {"title": "US Stock Market Today: S&P, Nasdaq Trade Higher As AI Stocks Lift Wall Street Ahead Of Tech Earnings", "full_content": "Black Monday, which occurred on Oct 19, 1987, remains a landmark in market history. The Dow Jones Industrial Average plunged 22.6% in a single session, its largest one-day percentage decline.", "source": "NDTV Profit", "pub_date_str": "19 Oct 2026, 07:33 PM IST", "pub_date_relative": "47m ago"}, {"title": "Builders slash prices on new homes as buyer traffic drops to 14-year low", "full_content": "Four in 10 home builders are cutting prices to boost demand, even as they face rising construction costs.", "source": "MarketWatch Top Stories", "pub_date_str": "19 Oct 2026, 07:30 PM IST", "pub_date_relative": "50m ago"}, {"title": "Google Review scam: Over 20 people reportedly lose \u20b91 crore in a month; 5 warning signs to watch out for", "full_content": "More than 20 residents of Visakhapatnam have allegedly lost a combined \u20b9 1 crore in a month to an online scam that began with offers of money for posting Google reviews and escalated into demands for larger investments. The incident highlights how fraudsters use small initial payouts to build trust before persuading victims to transfer substantial sums of money.\n\nAccording to a report by The Times of India, individual victims reportedly lost between \u20b9 2 lakh and \u20b9 9 lakh. In one case, a 38-year-old resident was allegedly cheated of more than \u20b9 10 lakh after being approached through Telegram with offers to earn money by completing simple online tasks.\n\nThe complainant reportedly received a Telegram message offering \u20b9 100-200 for each task. He was subsequently added to a group where participants were asked to post reviews and submit screenshots as proof of completion.\n\nA person identifying himself as a customer manager initially paid the victim \u20b9 120 per task. The victim was then encouraged to deposit money to earn higher returns. After depositing \u20b9 500 and receiving \u20b9 630, he reportedly invested \u20b9 3,000 and received \u20b9 4,300.\n\nThese initial payouts helped establish trust and encouraged him to commit larger sums, according to the report. The fraudsters subsequently introduced him to another individual who claimed to be an operations manager and directed him towards an online trading platform.\n\nThe victim was allegedly promised higher profits in exchange for further deposits . However, when he attempted to withdraw his money, he was told that trading errors had frozen his account.\n\nThe alleged operators then demanded additional payments to reactivate the account and release the funds.", "source": "LiveMint Money", "pub_date_str": "19 Oct 2026, 07:28 PM IST", "pub_date_relative": "51m ago"}, {"title": "Oil Futures Pull Back on Russia Sanctions Waiver - WSJ", "full_content": "Oil Futures Pull Back on Russia Sanctions Waiver WSJ Oil prices slip after Trump waives sanctions against Russian crude (CL1:COM:Commodity) Seeking Alpha Gasoline Price 2026: RBOB Futures Up 85% This Year at US$3.17 \u2014 But Down 8.5% in a Month as US Driving Season Fades Kalkine Mixed Diesel and Fuel Market Signals Persist Amid Geopolitical Pressures and Import Skepticism Oklahoma Farm Report Price of gas falls a few cents a gallon in Delaware Delaware Business Now", "source": "Google News Business", "pub_date_str": "19 Oct 2026, 07:26 PM IST", "pub_date_relative": "54m ago"}, {"title": "UNIFYD: Shah Rukh Khan Brings Arijit Singh, Karan Aujla, Sonu Nigam And 15+ Artists To Abu Dhabi", "full_content": "Shah Rukh Khan-curated UNIFYD will bring diverse musical acts together at Etihad Live, Abu Dhabi, on March 20, 2027.", "source": "NDTV Profit", "pub_date_str": "19 Oct 2026, 07:25 PM IST", "pub_date_relative": "54m ago"}, {"title": "Chip Stocks Such As CoreWeave, Intel, Micron Rally Up To Over 6% Ahead Of Tech Earnings", "full_content": "Shares of Coreweave saw a 6.89% uptick to trade at $65.62 in pre-market trade.", "source": "NDTV Profit", "pub_date_str": "19 Oct 2026, 07:24 PM IST", "pub_date_relative": "55m ago"}, {"title": "BoE scrutinises Barclays over claim traders misrepresented private credit exposure", "full_content": "Regulator received complaint that UK lender understated the risk of derivatives it used to finance private credit loans", "source": "FT Markets", "pub_date_str": "19 Oct 2026, 07:24 PM IST", "pub_date_relative": "55m ago"}, {"title": "Redmi K100 Launch Date Confirmed for China: Will It Ever launch in India Buyers Says", "full_content": "Redmi has confirmed the K100 will launch in China on October 27 with a 165Hz display, Bose-tuned speakers and a new green colour. Will Indian buyers ever get it?", "source": "NDTV Profit", "pub_date_str": "19 Oct 2026, 07:24 PM IST", "pub_date_relative": "55m ago"}, {"title": "India probing Pernod, Diageo Scotch imports under India-UK trade pact, sources say", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a India probing Pernod, Diageo Scotch imports under India-UK trade pact, sources say The Economic Times daily newspaper is available online now. Read Today's Paper India probing Pernod, Diageo Scotch imports under India-UK trade pact, sources say SECTIONS India probing Pernod, Diageo Scotch imports under India-UK trade pact, sources say By Reuters Last Updated: Oct 19, 2026, 07:23:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Indian tax officials are investigating Pernod Ricard and Diageo for how they classified bulk Scotch imports. These companies may have improperly benefitted from reduced tariffs under a recent trade agreement. Tax inspectors made surprising visits to both companies' offices to gather information about their practices. The investigations are part of a broader scrutiny faced by foreign investors in India.\n\nBusiness of Odd Things: Inside an industry that farms fish that nobody is meant to eat\n\nWar's second-order effects are becoming visible in critical sectors\n\nUS mid-term elections \u2013 Part 2: What does it mean for Trump to lose control of Congress?\n\nHomebuyers wait as NCLT panel picks holes in unfinished Jaypee projects\n\nWhat is the real impact of 13x jump in cash transfers to women?\n\nAirlines Q2 turbulence: Fewer passengers, rising fares and a crude shock\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "19 Oct 2026, 07:23 PM IST", "pub_date_relative": "56m ago"}, {"title": "Diwali Muhurat trading 2026: NSE declares date, time for special trading session. Details here", "full_content": "Indian stock exchanges on Monday announced the timings for the Muhurat Trading 2026 session, a special trading session conducted by the BSE and NSE on Diwali to mark the beginning of the new Hindu calendar year.\n\nThe special trading session will be held on Sunday, November 8, according to separate circulars issued by the exchanges.\n\nUnlike regular trading days, when equity markets operate from 9:15 am to 3:30 pm, Muhurat trading is conducted for a shorter duration.\n\nHowever, trading will be available across various segments, including equity, commodity derivatives, currency derivatives, equity futures and options, and securities lending and borrowing (SLB), according to the exchange circulars.\n\nAccording to the exchange circulars, trading members will be allowed to log in between 1:15 pm and 1:50 pm, followed by the block deal window from 1:50 pm to 2:05 pm. The pre-opening session will run from 2:05 pm to 2:20 pm, while continuous trading will take place from 2:20 pm to 3:30 pm.\n\nThe periodic call auction session is scheduled to run from 2:25 pm to 3:20 pm.\n\nClosing auction activities will take place between 3:15 pm and 3:35 pm, while the closing session for non-CAS securities will run from 3:30 pm to 3:50 pm.\n\nThe closing buffer period for CAS securities is scheduled from 3:35 pm to 3:50 pm, followed by the post-closing session from 3:50 pm to 4 pm.", "source": "LiveMint Markets", "pub_date_str": "19 Oct 2026, 07:23 PM IST", "pub_date_relative": "56m ago"}, {"title": "Titan redeems Rs 1,000 crore commercial paper", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Bonds \u203a Titan redeems Rs 1,000 crore commercial paper Titan Company Share Price Kalyan Jewellers India Share Price PC Jeweller Share Price Thangamayil Jewellery Share Price Bluestone Jewellery and Lifestyle Share Price Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Titan redeems Rs 1,000 crore commercial paper SECTIONS Titan redeems Rs 1,000 crore commercial paper PTI Last Updated: Oct 19, 2026, 07:21:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Titan Company Ltd has successfully fulfilled its obligation by redeeming commercial papers worth Rs 1,000 crore, originally issued on July 21, 2026. As the maturity date has arrived, all investors have duly received their returns. This action adheres to the regulations established by the Securities and Exchange Board of India. As part of the Tata Group and functioning under the Tamil Nadu government, Titan encompasses various lifestyle brands.\n\nTitan Company Ltd has successfully fulfilled its obligation by redeeming commercial papers worth Rs 1,000 crore, originally issued on July 21, 2026. As the maturity date has arrived, all investors have duly received their returns. This action adheres to the regulations established by the Securities and Exchange Board of India. As part of the Tata Group and functioning under the Tamil Nadu government, Titan encompasses various lifestyle brands.\n\nOil, foreign flows in focus for rupee; bond traders eye rate-hike bets\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "19 Oct 2026, 07:21 PM IST", "pub_date_relative": "59m ago"}, {"title": "Man Struggles To Find Job After Layoff Despite 14 Years Of Experience: 'Starting To Mess With My Head\u2019", "full_content": "In his post, the man said the prolonged unemployment was beginning to affect his mental well-being.", "source": "NDTV Profit", "pub_date_str": "19 Oct 2026, 07:21 PM IST", "pub_date_relative": "59m ago"}, {"title": "Tiger Shroff Firing Case: CCTV Footage Catches Suspects Boarding Train At Surat Station", "full_content": "The suspects allegedly received Rs 50,000 collectively as an advance, while investigators examine their communications and possible links to the Lawrence Bishnoi gang.", "source": "NDTV Profit", "pub_date_str": "19 Oct 2026, 07:20 PM IST", "pub_date_relative": "59m ago"}, {"title": "Ranabaali Box Office Collection Day 4: Vijay Deverakonda's Telugu Film Continues Its Strong Box Office Run", "full_content": "Ranabaali has recorded Rs 3.94 crore on Day 4, taking its India gross collection to Rs 27.86 crore so far.", "source": "NDTV Profit", "pub_date_str": "19 Oct 2026, 07:19 PM IST", "pub_date_relative": "1h ago"}, {"title": "Piramal Finance Q2 net profit soars 67% to Rs 545 crore", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a Earnings \u203a Piramal Finance Q2 net profit soars 67% to Rs 545 crore Piramal Finance Share Price L&T Finance Share Price Motilal Oswal Financial Services Share Price Sundaram Finance Share Price HDB Financial Services Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Piramal Finance Q2 net profit soars 67% to Rs 545 crore SECTIONS Piramal Finance Q2 net profit soars 67% to Rs 545 crore By Sangita Mehta , ET Bureau Last Updated: Oct 19, 2026, 07:19:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Piramal Finance\u2019s assets under management grew 24% to Rs 1.13 lakh crore, led by a 30% rise in retail AUM. Net interest income increased 35%, while its net interest margin expanded 35 basis points to 6.5%.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "19 Oct 2026, 07:19 PM IST", "pub_date_relative": "1h ago"}, {"title": "Manipur Violence: Four Killed, Locals Take Bodies To CM Yumnam Singh's House", "full_content": "Protesting locals placed the two bodies outside the chief minister\u2019s residence in an expression of anger. Authorities later removed the bodies from the site.", "source": "NDTV Profit", "pub_date_str": "19 Oct 2026, 07:17 PM IST", "pub_date_relative": "1h ago"}, {"title": "NYSE becomes latest exchange to extend options hours as appetite for around-the-clock trading grows", "full_content": "The New York Stock Exchange becomes the second major exchange to announce extended-hours options trading for heavily-traded ETFs and single stocks, following CBOE's announcement that it will introduce extended trading for 25 single stocks and five ETFs.\n\nExtended options trading hours for the NYSE, which is owned and operated by the Intercontinental Exchange , begin Monday, and will operate from 7:30 AM to 9:25 AM ET, while the new late trading session will operate from 4:00 PM to 4:15 PM ET.\n\nTwenty-nine major stocks and funds are available for extended trading including Nvidia , Bank of America , the SPDR S&P 500 ETF Trust and the iShares Russell 2000 ETF .\n\nBeginning Dec. 6, 2026, NYSE will extend trading to 23 hours, five days a week in those same names.\n\n\"Markets have changed tremendously over the years, and that kind of progress only happens when you keep investing in your technology,\" said Kevin Tyrrell, chief product officer, NYSE, in a statement. \"Extended trading hours for options reflects market demand for investment opportunities and reliable risk management during a longer period of time.\"\n\nThe fresh offering from NYSE reflects growing demand for derivatives products among traders, as well as strong appetite for 24/7 trading instruments. Crypto was the first asset class to offer continuous trading. More recently, prediction markets and perpetual futures offer a 24/7 schedule and a unique exposure across demand-heavy areas of the market.\n\nData from CBOE confirms the growing appetite for trading beyond the regular session. Extended hours trading just hit its highest levels on record \u2013 more than 199,000 contracts per day on average \u2013 following steady growth and an explosion of activity this year.\n\nVolumes were very muted Monday for the first extended session for stocks. The standout volume is in options on Tesla ahead of earnings this Wednesday.", "source": "CNBC Top News", "pub_date_str": "19 Oct 2026, 07:16 PM IST", "pub_date_relative": "1h ago"}, {"title": "From Rs 258 To Rs 826: Multibagger Smallcap Delivers 220% Returns In Three Years, Q2 Topline Jumps 36% YoY", "full_content": "Waaree Renewable Technologies shares have gained around 220% in three years, climbing from Rs 258 to Rs 826. The company's Q2 FY27 revenue rose 36.5% year-on-year to Rs 1,058 crore.", "source": "NDTV Profit", "pub_date_str": "19 Oct 2026, 07:16 PM IST", "pub_date_relative": "1h ago"}, {"title": "8th Pay Commission fitment factor: Higher basic pay or more allowances\u2014what is better for govt employees?", "full_content": "The 8th Pay Commission has raised expectations among central government employees and pensioners, who are awaiting clarity on revised pay scales, allowances and retirement benefits. The Commission, established in November 2025, has been given 18 months to submit its recommendations, which will shape the next round of pay revisions.\n\nThe panel is expected to examine inflation, economic conditions and employees\u2019 financial requirements while recommending changes to salaries and pensions. Employee organisations have raised demands for higher pay, improved allowances and a higher fitment factor.\n\nAs discussions continue, a key question for employees is whether a higher basic salary or increased allowances would provide greater financial benefits under the proposed pay structure.\n\nThe fitment factor is a multiplier used to calculate revised basic pay under a new Pay Commission . Employee organisations have reportedly sought a factor ranging from 3.2 to 4 or higher for the 8th Pay Commission. However, the final figure will depend on the Commission\u2019s recommendations and the government\u2019s decision.\n\nFor example, if the fitment factor is assumed to be 3, an employee with a current basic pay of \u20b9 18,000 would receive a revised basic pay of \u20b9 54,000. This represents an increase of \u20b9 36,000 in basic pay.\n\nSimilarly, an employee drawing a basic salary of \u20b9 44,500 would see it rise to \u20b9 1,33,500 under the same assumed multiplier, an increase of \u20b9 89,000.\n\nThese are illustrative calculations, not confirmed salary revisions. The actual increase will depend on the fitment factor approved and the applicable pay rules.\n\nBasic pay is only one component of a government employee\u2019s salary. Dearness Allowance (DA), House Rent Allowance (HRA) and Transport Allowance may also contribute to overall earnings. The fitment factor is applied to basic pay, while allowances are governed by the relevant rules.", "source": "LiveMint Money", "pub_date_str": "19 Oct 2026, 07:15 PM IST", "pub_date_relative": "1h ago"}, {"title": "PC Jeweller among 8 stocks that hit 52-week high and rallied up to 42% in a month", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News PC Jeweller among 8 stocks that hit 52-week high and rallied up to 42% in a month Written by Ritesh Presswala , ETMarkets.com | Oct 19, 2026, 07:17:52 PM IST 1 / 9 Fresh Highs On Monday, the benchmark Sensex fell 876 points to close at 73,852. Despite the broader market decline, eight stocks from the BSE 1000 index touched fresh 52-week highs, reaching their highest price levels in the past year. A 52-week high marks the highest price at which a stock has traded over the previous 12 months and may indicate increased investor interest and trading activity.\n\nNew 52-week high: Rs 18.64| CMP: Rs 18.14. In the last one month stock has gained about 42%.\n\nNew 52-week high: Rs 1079.35| CMP: Rs 1029.4. In the last one month stock has gained about 31%.\n\nNew 52-week high: Rs 54.86| CMP: Rs 54.31. In the last one month stock has gained about 18%.\n\nNew 52-week high: Rs 785.6| CMP: Rs 773.1. In the last one month stock has gained about 18%.\n\nNew 52-week high: Rs 1240| CMP: Rs 1226.3. In the last one month stock has gained about 11%.\n\nNew 52-week high: Rs 1432.9| CMP: Rs 1402.45. In the last one month stock has gained about 6%.\n\nNew 52-week high: Rs 2087| CMP: Rs 2062.4. In the last one month stock has gained about 5%.", "source": "Economic Times Markets", "pub_date_str": "19 Oct 2026, 07:14 PM IST", "pub_date_relative": "1h ago"}, {"title": "PFRDA launches NPS Central: How simplified pension portal works, who can use, how to log in | Top features explained", "full_content": "The Pension Fund Regulatory and Development Authority (PFRDA) has launched NPS Central, a digital platform that allows National Pension System (NPS) subscribers to enrol, invest and manage their accounts in one place.\n\nLaunched on NPS Diwas , October 1, 2026, the platform has been jointly developed and is managed by the three Central Recordkeeping Agencies under NPS, namely Protean, KFintech and CAMS.\n\nThrough NPS Central, the pension schemes regulatory body aims to make NPS services more accessible and convenient for subscribers at every stage of their retirement planning journey, which can span decades and requires continued engagement with the pension system.\n\n\u201cThis initiative reaffirms PFRDA\u2019s commitment to subscriber convenience, transparency and ease of investment, while advancing a more integrated and subscriber-centric pension ecosystem,\u201d the release read.\n\nExisting NPS subscribers can log in using their registered mobile number and date of birth, authenticated through a one-time password (OTP). They do not need to remember their Permanent Retirement Account Number (PRAN).\n\nThe platform shows a single dashboard where subscribers can view their NPS accounts and investment portfolios across all three Central Recordkeeping Agencies (CRAs). Here's the link of the platform: www.npscentral.in .\n\nOn NPS Central, subscribers can contribute to their current schemes, explore and opt for new schemes, compare scheme features, returns and charges, update their profile details, download account statements and track the status of contributions made through various modes.\n\nThe platform also allows NPS subscribers to raise their grievances or seek clarity on a service through the Pension Sahayak portal.", "source": "LiveMint Money", "pub_date_str": "19 Oct 2026, 07:13 PM IST", "pub_date_relative": "1h ago"}, {"title": "BLS Polymers IPO: Firm Expected To Raise Rs 255 Crore; Price Band Of Rs 142\u2014Rs 150", "full_content": "At the upper end of the price band, the company is expected to raise Rs 255 crore through the public issue.", "source": "NDTV Profit", "pub_date_str": "19 Oct 2026, 07:12 PM IST", "pub_date_relative": "1h ago"}, {"title": "FTSE 100 newcomer Ithaca warns of halt to investment if Rosebank blocked", "full_content": "North Sea oil producer links approval of near-$4bn field delayed by environmental concerns to future projects in Britain", "source": "FT Markets", "pub_date_str": "19 Oct 2026, 07:07 PM IST", "pub_date_relative": "1h ago"}, {"title": "US stocks rebound after AI sell-off", "full_content": "Nasdaq 100 rises following biggest weekly drop since last year\u2019s trade war rout", "source": "FT Markets", "pub_date_str": "19 Oct 2026, 07:07 PM IST", "pub_date_relative": "1h ago"}, {"title": "Google says it can build data centers the right way. Some experts and residents are skeptical", "full_content": "If there's one thing most Americans can agree on, it's that they don't want a data center in their backyard.\n\nA Gallup survey conducted in March found that 71% of Americans opposed the construction of a data center in their local area. Chief among their concerns: energy usage. Half of Americans surveyed by Pew Research Center in July and August said data centers would be mostly bad for the environment and for household energy costs.\n\nNow Google is betting that a massive AI data center can help finance a cleaner, more reliable power grid. Its proposed deal with Xcel Energy would add more wind, solar and battery capacity than the data center is expected to use.\n\nUnder the agreement, Google would help pay for the added capacity and continue paying, even if it doesn't use all of the power.\n\nPine Island, Minnesota, is a small town of about 4,000 residents an hour southeast of Minneapolis. Google hopes that its new 780-megawatt data center plan will build goodwill with the Pine Island community and keep the company on track to meet its goal of operating on carbon-free energy, 24 hours a day, seven days a week by 2030 .\n\nGoogle \u2014 whose cloud business powers its own Gemini AI and brought in nearly $25 billion in second-quarter revenue, an 82% increase from a year earlier \u2014 says it has found a model for doing this the right way. The company plans to finance the addition of 1,400 megawatts of wind, 200 megawatts of solar and 300 megawatts of battery storage to Xcel's grid.\n\nThose additions amount to more than the capacity of the data center itself, which Google said is because wind and solar do not generate energy at all times. Xcel Energy said the new power will serve all customers in the local area, not just Google.", "source": "CNBC World Economy", "pub_date_str": "19 Oct 2026, 07:06 PM IST", "pub_date_relative": "1h ago"}, {"title": "S&P 500, Nasdaq open higher as AI stocks rebound ahead of major earnings - Reuters", "full_content": "S&P 500, Nasdaq open higher as AI stocks rebound ahead of major earnings Reuters Nasdaq futures gain as investors buy the dip in the AI trade: Live updates CNBC Tech stocks rebound as Nasdaq rises 1% and the Dow slips in early trading Quartz Stock Market Today: Nasdaq Rebounds at Open After Friday's Tech Selloff \u2014 Live Updates WSJ AI stocks lead a rebound on Wall Street as European markets drop following protests Boston Herald", "source": "Google News Business", "pub_date_str": "19 Oct 2026, 07:05 PM IST", "pub_date_relative": "1h ago"}, {"title": "Meet the home buyers totally unfazed by 7% mortgage rates", "full_content": "Individual investors and second-home buyers accounted for 1 in 5 home purchases in September \u2014 the highest share in a little over a year.", "source": "MarketWatch Top Stories", "pub_date_str": "19 Oct 2026, 07:03 PM IST", "pub_date_relative": "1h ago"}, {"title": "Why this bull market is unlike any we've seen before", "full_content": "The stock market has already reached a positive milestone despite growing consternation around the artificial intelligence trade.", "source": "CNBC Top News", "pub_date_str": "19 Oct 2026, 06:58 PM IST", "pub_date_relative": "1h ago"}, {"title": "Home loan prepayment vs SIP: Which is a better option and saves you more money? Here's the maths", "full_content": "When buying a home, many home loan borrowers make decisions based on their current financial situation. As their careers progress and financial strength increases, their dilemma is whether to increase their home loan EMI and pay off the loan first, or invest the incremental amount in an SIP without changing their home loan payment schedule.\n\nWith home loan EMIs spread over a 20-25-year tenure, even small payments in the initial years can significantly reduce overall interest outgoings over time. A home loan EMI may look like a single consolidated payment; however, it consists of two components - outstanding principal and interest. In the initial years of repayment, the interest component of the EMI is much higher because it is calculated on the outstanding principal. This method is called the reducing balance method.\n\nTo understand this, let's take two scenarios \u2014 in the first, Aman increases the EMI and pays off the home loan, and in the second, he doesn't make any changes in the home loan payment schedule and invests the incremental amount in SIP .\n\nLet's assume Aman borrows a home loan of \u20b9 1 crore for 25 years at 9% interest. His monthly EMI will be \u20b9 83,920. After 5 years, he is in a position to increase the EMI and reduce the tenure to 10 years. Here's how much interest he will save.\n\nNow, since Aman has prepaid the entire loan in 15 years, he decides to invest the EMI amount he would have paid in mutual funds through SIP for the next 10 years.\n\nSo, if the interest saved on the home loan and the returns earned on the investments are combined, the total benefit comes down to \u20b9 1.81 crore.\n\nIf Aman decides to invest the additional amount, here's how much returns he will earn:\n\nNow, combining the returns earned by investing and then deducting the extra interest he will be paying to the bank, his benefit will be between \u20b9 1.8 crore and \u20b9 2.12 crore.", "source": "LiveMint Money", "pub_date_str": "19 Oct 2026, 06:56 PM IST", "pub_date_relative": "1h ago"}, {"title": "Behind FSSAI's Fructose Crackdown: How Early Sugar Exposure Harms Infant Metabolism", "full_content": "Published in the Official Gazette on October 16, the draft amendment will be reviewed after FSSAI considers feedback from stakeholders.", "source": "NDTV Profit", "pub_date_str": "19 Oct 2026, 06:52 PM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "Nasdaq gains as investors buy the dip in the AI trade: Live updates", "full_content": "The Nasdaq Composite rose on Monday as traders moved back into tech following last week's artificial intelligence-related rout.\n\nThe tech-heavy index added 1.4%, while the S&P 500 gained 0.7%. The Dow Jones Industrial Average rose 52 points, or 0.1%.\n\nIntel advanced 5% after JPMorgan analysts upgraded their rating on the chipmaker. Advanced Micro Devices and Micron Technology were also up 3% and 4%, respectively.\n\nThe S&P 500 lost nearly 2% last week \u2014 its biggest weekly decline since late June. The Nasdaq tumbled 4.5%, snapping a four-week winning streak. Information technology also shed more than 6% to post its worst weekly performance since April 2025. It was the most net sold global sector last week , with hedge funds selling the largest percentage of tech on record, per Goldman Sachs.\n\nConcerns around the health of the AI trade took center stage after CNBC reported, citing sources, that Anthropic's third-quarter revenue totaled $16.8 billion . And while that's up from $11.6 billion in the second quarter, it raised flags among investors about the pace of growth with the AI build-out.\n\nInvestors in the corporate bond market have started to shun CoreWeave, with the company's credit default swaps reaching distress levels .\n\nGoldman Sachs traders noted Friday: \"AI Credit Spreads and hyperscalers specifically are at the widest levels of the year. The last time spreads were nearly this high, the underlying equities were 15% lower.\"\n\n\"The widening across the complex has forced investors to confront what happens as AI spending growth slows. AI Capex has likely peaked and financing, sustainability, and returns on capital have become the debate rather than the next near term earnings revision,\" they said. \"Pessimism is increasing, market breadth is low, and [Friday] we saw the second highest amount of puts traded (right behind June of this year).\"", "source": "CNBC Top News", "pub_date_str": "19 Oct 2026, 08:11 PM IST", "pub_date_relative": "8m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Fixed Income"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Hassett says inflation \"needing some work\"", "full_content": "", "source": "Investing.com News", "pub_date_str": "19 Oct 2026, 08:09 PM IST", "pub_date_relative": "11m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect ma ession, a special trading session conducted by the BSE and NSE on Diwali to mark the beginning of the new Hindu calendar year.\n\nThe special trading session will be held on Sunday, November 8, according to separate circulars issued by the exchanges.\n\nUnlike regular trading days, when equity markets operate from 9:15 am to 3:30 pm, Muhurat trading is conducted for a shorter duration.\n\nHowever, trading will be available across various segments, including equity, commodity derivatives, currency derivatives, equity futures and options, and securities lending and borrowing (SLB), according to the exchange circulars.\n\nAccording to the exchange circulars, trading members will be allowed to log in between 1:15 pm and 1:50 pm, followed by the block deal window from 1:50 pm to 2:05 pm. The pre-opening session will run from 2:05 pm to 2:20 pm, while continuous trading will take place from 2:20 pm to 3:30 pm.\n\nThe periodic call auction session is scheduled to run from 2:25 pm to 3:20 pm.\n\nClosing auction activities will take place between 3:15 pm and 3:35 pm, while the closing session for non-CAS securities will run from 3:30 pm to 3:50 pm.\n\nThe closing buffer period for CAS securities is scheduled from 3:35 pm to 3:50 pm, followed by the post-closing session from 3:50 pm to 4 pm.", "source": "LiveMint Markets", "pub_date_str": "19 Oct 2026, 07:23 PM IST", "pub_date_relative": "56m ago", "cfa_topics": ["Equity Investments", "Fixed Income", "Derivatives", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Titan redeems Rs 1,000 crore commercial paper", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Bonds \u203a Titan redeems Rs 1,000 crore commercial paper Titan Company Share Price Kalyan Jewellers India Share Price PC Jeweller Share Price Thangamayil Jew longed unemployment was beginning to affect his mental well-being.", "source": "NDTV Profit", "pub_date_str": "19 Oct 2026, 07:21 PM IST", "pub_date_relative": "59m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Piramal Finance Q2 net profit soars 67% to Rs 545 crore", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a Earnings \u203a Piramal Finance Q2 net profit soars 67% to Rs 545 crore Piramal Finance Share Price L&T Finance Share Price Motilal Oswal Financial Services Share Price Sundaram Finance Share Price HDB Financial Services Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Piramal Finance Q2 net profit soars 67% to Rs 545 crore SECTIONS Piramal Finance Q2 net profit soars 67% to Rs 545 crore By Sangita Mehta , ET Bureau Last Updated: Oct 19, 2026, 07:19:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Piramal Finance\u2019s assets under management grew 24% to Rs 1.13 lakh crore, led by a 30% rise in retail AUM. Net interest income increased 35%, while its net interest margin expanded 35 basis points to 6.5%.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "19 Oct 2026, 07:19 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "NYSE becomes latest exchange to extend options hours as appetite for around-the-clock trading grows", "full_content": "The New York Stock Exchange becomes the second major exchange to announce extended-hours options trading for heavily-traded ETFs and single stocks, following CBOE's announcement that it will introduce extended trading for 25 single stocks and five ETFs.\n\nExtended options trading hours for the NYSE, which is owned and operated by the Intercontinental Exchange , begin Monday, and will operate from 7:30 AM to 9:25 AM ET, while the new late trading session will operate from 4:00 PM to 4:15 PM ET.\n\nTwenty-nine major stocks and funds are available for extended trading including Nvidia , Bank of America , the SPDR S&P 500 ETF Trust and the iShares Russell 2000 ETF .\n\nBeginning Dec. 6, 2026, NYSE will extend trading to 23 hours, five days a week in those same names.\n\n\"Markets have changed tremendously over the years, and that kind of progress only happens when you keep investing in your technology,\" said Kevin Tyrrell, chief product officer, NYSE, in a statement. \"Extended trading hours for options reflects market demand for investment opportunities and reliable risk management during a longer period of time.\"\n\nThe fresh offering from NYSE reflects growing demand for derivatives products among traders, as well as strong appetite for 24/7 trading instruments. Crypto was the first asset class to offer continuous trading. More recently, prediction markets and perpetual futures offer a 24/7 schedule and a unique exposure across demand-heavy areas of the market.\n\nData from CBOE confirms the growing appetite for trading beyond the regular session. Extended hours trading just hit its highest levels on record \u2013 more than 199,000 contracts per day on average \u2013 following steady growth and an explosion of activity this year.\n\nVolumes were very muted Monday for the first extended session for stocks. The standout volume is in options on Tesla ahead of earnings this Wednesday.", "source": "CNBC Top News", "pub_date_str": "19 Oct 2026, 07:16 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "From Rs 258 To Rs 826: Multibagger Smallcap Delivers 220% Returns In Three Years, Q2 Topline Jumps 36% YoY", "full_content": "Waaree Renewable Technologies shares have gained around 220% in three years, climbing from Rs 258 to Rs 826. The company's Q2 FY27 revenue rose 36.5% year-on-year to Rs 1,058 crore.", "source": "NDTV Profit", "pub_date_str": "19 Oct 2026, 07:16 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "8th Pay Commission fitment factor: Higher basic pay or more allowances\u2014what is better for govt employees?", "full_content": "The 8th Pay Commission has raised expectations among central government employees and pensioners, who are awaiting clarity on revised pay scales, allowances and retirement benefits. The Commission, established in November 2025, has been given 18 months to submit its recommendations, which will shape the next round of pay revisions.\n\nThe panel is expected to examine inflation, economic conditions and employees\u2019 financial requirements while recommending changes to salaries and pensions. Employee organisations have raised demands for higher pay, improved allowances and a higher fitment factor.\n\nAs discussions continue, a key question for employees is whether a higher basic salary or increased allowances would provide greater financial benefits under the proposed pay structure.\n\nThe fitment factor is a multiplier used to calculate revised basic pay under a new Pay Commission . Employee organisations have reportedly sought a factor ranging from 3.2 to 4 or higher for the 8th Pay Commission. However, the final figure will depend on the Commission\u2019s recommendations and the government\u2019s decision.\n\nFor example, if the fitment factor is assumed to be 3, an employee with a current basic pay of \u20b9 18,000 would receive a revised basic pay of \u20b9 54,000. This represents an increase of \u20b9 36,000 in basic pay.\n\nSimilarly, an employee drawing a basic salary of \u20b9 44,500 would see it rise to \u20b9 1,33,500 under the same assumed multiplier, an increase of \u20b9 89,000.\n\nThese are illustrative calculations, not confirmed salary revisions. The actual increase will depend on the fitment factor approved and the applicable pay rules.\n\nBasic pay is only one component of a government employee\u2019s salary. Dearness Allowance (DA), House Rent Allowance (HRA) and Transport Allowance may also contribute to overall earnings. The fitment factor is applied to basic pay, while allowances are governed by the relevant rules.", "source": "LiveMint Money", "pub_date_str": "19 Oct 2026, 07:15 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "PC Jeweller among 8 stocks that hit 52-week high and rallied up to 42% in a month", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News PC Jeweller among 8 stocks that hit 52-week high and rallied up to 42% in a month Written by Ritesh Presswala , ETMarkets.com | Oct 19, 2026, 07:17:52 PM IST 1 / 9 Fresh Highs On Monday, the benchmark Sensex fell 876 points to close at 73,852. Despite the broader market decline, eight stocks from the BSE 1000 index touched fresh 52-week highs, reaching their highest price levels in the past year. A 52-week high marks the highest price at which a stock has traded over the previous 12 months and may indicate increased investor interest and trading activity.\n\nNew 52-week high: Rs 18.64| CMP: Rs 18.14. In the last one month stock has gained about 42%.\n\nNew 52-week high: Rs 1079.35| CMP: Rs 1029.4. In the last one month stock has gained about 31%.\n\nNew 52-week high: Rs 54.86| CMP: Rs 54.31. In the last one month stock has gained about 18%.\n\nNew 52-week high: Rs 785.6| CMP: Rs 773.1. In the last one month stock has gained about 18%.\n\nNew 52-week high: Rs 1240| CMP: Rs 1226.3. In the last one month stock has gained about 11%.\n\nNew 52-week high: Rs 1432.9| CMP: Rs 1402.45. In the last one month stock has gained about 6%.\n\nNew 52-week high: Rs 2087| CMP: Rs 2062.4. In the last one month stock has gained about 5%.", "source": "Economic Times Markets", "pub_date_str": "19 Oct 2026, 07:14 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "PFRDA launches NPS Central: How simplified pension portal works, who can use, how to log in | Top features explained", "full_content": "The Pension Fund Regulatory and Development Authority (PFRDA) has launched NPS Central, a digital platform that allows National Pension System (NPS) subscribers to enrol, invest and manage their accounts in one place.\n\nLaunched on NPS Diwas , October 1, 2026, the platform has been jointly developed and is managed by the three Central Recordkeeping Agencies under NPS, namely Protean, KFintech and CAMS.\n\nThrough NPS Central, the pension schemes regulatory body aims to make NPS services more accessible and convenient for subscribers at every stage of their retirement planning journey, which can span decades and requires continued engagement with the pension system.\n\n\u201cThis initiative reaffirms PFRDA\u2019s commitment to subscriber convenience, transparency and ease of investment, while advancing a more integrated and subscriber-centric pension ecosystem,\u201d the release read.\n\nExisting NPS subscribers can log in using their registered mobile number and date of birth, authenticated through a one-time password (OTP). They do not need to remember their Permanent Retirement Account Number (PRAN).\n\nThe platform shows a single dashboard where subscribers can view their NPS accounts and investment portfolios across all three Central Recordkeeping Agencies (CRAs). Here's the link of the platform: www.npscentral.in .\n\nOn NPS Central, subscribers can contribute to their current schemes, explore and opt for new schemes, compare scheme features, returns and charges, update their profile details, download account statements and track the status of contributions made through various modes.\n\nThe platform also allows NPS subscribers to raise their grievances or seek clarity on a service through the Pension Sahayak portal.", "source": "LiveMint Money", "pub_date_str": "19 Oct 2026, 07:13 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "BLS Polymers IPO: Firm Expected To Raise Rs 255 Crore; Price Band Of Rs 142\u2014Rs 150", "full_content": "At the upper end of the price band, the company is expected to raise Rs 255 crore through the public issue.", "source": "NDTV Profit", "pub_date_str": "19 Oct 2026, 07:12 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "FTSE 100 newcomer Ithaca warns of halt to investment if Rosebank blocked", "full_content": "North Sea oil producer links approval of near-$4bn field delayed by environmental concerns to future projects in Britain", "source": "FT Markets", "pub_date_str": "19 Oct 2026, 07:07 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "US stocks rebound after AI sell-off", "full_content": "Nasdaq 100 rises following biggest weekly drop since last year\u2019s trade war rout", "source": "FT Markets", "pub_date_str": "19 Oct 2026, 07:07 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Google says it can build data centers the right way. Some experts and residents are skeptical", "full_content": "If there's one thing most Americans can agree on, it's that they don't want a data center in their backyard.\n\nA Gallup survey conducted in March found that 71% of Americans opposed the construction of a data center in their local area. Chief among their concerns: energy usage. Half of Americans surveyed by Pew Research Center in July and August said data centers would be mostly bad for the environment and for household energy costs.\n\nNow Google is betting that a massive AI data center can help finance a cleaner, more reliable power grid. Its proposed deal with Xcel Energy would add more wind, solar and battery capacity than the data center is expected to use.\n\nUnder the agreement, Google would help pay for the added capacity and continue paying, even if it doesn't use all of the power.\n\nPine Island, Minnesota, is a small town of about 4,000 residents an hour southeast of Minneapolis. Google hopes that its new 780-megawatt data center plan will build goodwill with the Pine Island community and keep the company on track to meet its goal of operating on carbon-free energy, 24 hours a day, seven days a week by 2030 .\n\nGoogle \u2014 whose cloud business powers its own Gemini AI and brought in nearly $25 billion in second-quarter revenue, an 82% increase from a year earlier \u2014 says it has found a model for doing this the right way. The company plans to finance the addition of 1,400 megawatts of wind, 200 megawatts of solar and 300 megawatts of battery storage to Xcel's grid.\n\nThose additions amount to more than the capacity of the data center itself, which Google said is because wind and solar do not generate energy at all times. Xcel Energy said the new power will serve all customers in the local area, not just Google.", "source": "CNBC World Economy", "pub_date_str": "19 Oct 2026, 07:06 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "S&P 500, Nasdaq open higher as AI stocks rebound ahead of major earnings - Reuters", "full_content": "S&P 500, Nasdaq open higher as AI stocks rebound ahead of major earnings Reuters Nasdaq futures gain as investors buy the dip in the AI trade: Live updates CNBC Tech stocks rebound as Nasdaq rises 1% and the Dow slips in early trading Quartz Stock Market Today: Nasdaq Rebounds at Open After Friday's Tech Selloff \u2014 Live Updates WSJ AI stocks lead a rebound on Wall Street as European markets drop following protests Boston Herald", "source": "Google News Business", "pub_date_str": "19 Oct 2026, 07:05 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Why this bull market is unlike any we've seen before", "full_content": "The stock market has already reached a positive milestone despite growing consternation around the artificial intelligence trade.", "source": "CNBC Top News", "pub_date_str": "19 Oct 2026, 06:58 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Home loan prepayment vs SIP: Which is a better option and saves you more money? Here's the maths", "full_content": "When buying a home, many home loan borrowers make decisions based on their current financial situation. As their careers progress and financial strength increases, their dilemma is whether to increase their home loan EMI and pay off the loan first, or invest the incremental amount in an SIP without changing their home loan payment schedule.\n\nWith home loan EMIs spread over a 20-25-year tenure, even small payments in the initial years can significantly reduce overall interest outgoings over time. A home loan EMI may look like a single consolidated payment; however, it consists of two components - outstanding principal and interest. In the initial years of repayment, the interest component of the EMI is much higher because it is calculated on the outstanding principal. This method is called the reducing balance method.\n\nTo understand this, let's take two scenarios \u2014 in the first, Aman increases the EMI and pays off the home loan, and in the second, he doesn't make any changes in the home loan payment schedule and invests the incremental amount in SIP .\n\nLet's assume Aman borrows a home loan of \u20b9 1 crore for 25 years at 9% interest. His monthly EMI will be \u20b9 83,920. After 5 years, he is in a position to increase the EMI and reduce the tenure to 10 years. Here's how much interest he will save.\n\nNow, since Aman has prepaid the entire loan in 15 years, he decides to invest the EMI amount he would have paid in mutual funds through SIP for the next 10 years.\n\nSo, if the interest saved on the home loan and the returns earned on the investments are combined, the total benefit comes down to \u20b9 1.81 crore.\n\nIf Aman decides to invest the additional amount, here's how much returns he will earn:\n\nNow, combining the returns earned by investing and then deducting the extra interest he will be paying to the bank, his benefit will be between \u20b9 1.8 crore and \u20b9 2.12 crore.", "source": "LiveMint Money", "pub_date_str": "19 Oct 2026, 06:56 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Micron and other chip stocks spring back to life after bruising selloff", "full_content": "It\u2019s a key week for tech stocks as Nvidia gears up for a European conference and Meta prepares to report earnings.", "source": "MarketWatch Top Stories", "pub_date_str": "19 Oct 2026, 06:52 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "OpenAI bugging suspect communicated with Saudi royal on WhatsApp days before arrest, feds say", "full_content": "The Saudi national charged with planting a recording device in a sensitive OpenAI executive conference room in San Francisco was \"in frequent communications via WhatsApp with a member of the Saudi Royal Family\" throughout 2025 and 2026, prosecutors revealed in a bombshell court filing Sunday.\n\nThe defendant, Abdulrahman Alfozan , communicated with the Saudi royal as recently as Oct. 5 \u2014 four days before he was arrested, the U.S. Attorney's Office in San Francisco said in the filing, which requests that he be detained without bail.\n\nProsecutors did not identify the Saudi royal or say in the filing how Alfozan, who then was working as an engineer at OpenAI, knew that person.\n\n\"Among other things, the individual [the royal family member] told the defendant [Alfozan] that an artificial intelligence initiative was being launched in Saudi Arabia and wanted the defendant to join it,\" prosecutors wrote in their filing.\n\n\"In May 2026, the individual told the defendant, 'Saudi needs you more then [sic] the US!' to which the defendant responded '100,' indicating he agreed,\" prosecutors wrote.\n\n\"The individual repeatedly tried to recruit the defendant and asked when he planned to leave OpenAI,\" prosecutors wrote. \"At the time, the defendant said he wouldn't leave until his stock vested.\"\n\nThe filing does not say that the Saudi royal directed Alfozan to install a recording device at OpenAI or steal information from that AI giant.\n\nAlfozan, who lives near the San Francisco airport, is a venture partner at Raed Ventures , a Saudi venture capital firm. Prince Khalid bin Bader Al Saud, a member of the Saudi royal family, joined the firm as a venture partner in 2025. In their filing Sunday, prosecutors did not mention that prince by name or say that the unidentified royal who communicated with Alfozan had ties to Raed.", "source": "CNBC Top News", "pub_date_str": "19 Oct 2026, 06:51 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Small-cap stock under \u20b950 with a dividend, bonus shares, stock split history show resilience against market crash", "full_content": "Small-cap stock under \u20b9 50: The Indian stock market retreated sharply in Monday\u2019s trade, giving up much of its recent gains after snapping an eight-week losing streak, as market sentiment was dampened by weak earnings from large private sector banks, while elevated crude oil prices and weak global cues triggered profit booking.\n\nInvestors lost \u20b9 3.6 lakh crore in a single session as the overall market capitalisation of BSE-listed firms dropped to \u20b9 469 lakh crore from \u20b9 472.6 lakh crore in the previous session. However, PSU bank shares showed some resilience against the bloodbath on Dalal Street on Monday.\n\nApart from PSU bank shares, Aayush Wellness shares were also among the rare stocks that attracted buying interest during Monday's stock market crash. Aayush Wellness's share price today opened upside at \u20b9 26.29 on the BSE, which turned out to be its intraday high as well. The small-cap stock came under the profit-booking heat when the bloodbath began on Dalal Street and touched an intraday low of \u20b9 24.60 apiece. However, it soon caught the attention of beleaguered bulls, helping the stock pare its losses. The small-cap stock under \u20b9 50 soon turned green again and finished around 3.60% higher from its today's low of \u20b9 24.60.\n\nThe small-cap healthcare company has expanded its nutraceutical portfolio with the launch of Aayush Calcium Vitamin Tablets, a scientifically advanced formulation designed to address India\u2019s calcium and vitamin deficiencies.", "source": "LiveMint Markets", "pub_date_str": "19 Oct 2026, 06:40 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "China announces export curbs on key machinery used in India's infrastructure development", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a China announces export curbs on key machinery used in India's infrastructure d nds and Paris-listed stocks under pressure.\n\nThe euro was last seen down 0.15% against the U.S. dollar, and was 0.1% lower against the British pound.\n\nThe French 10-year bond yield jumped more than 10 basis points, taking it just shy of its highest level in decades. Higher yields represent higher borrowing costs for the government in the debt market. The country's 2-year and 30-year yields were up 6 basis points and 8 basis points, respectively.\n\nStocks are also feeling the heat, with the CAC 40 index down 1.7% in afternoon deals on Monday. The market has significantly underperformed its European peers in recent years as political volatility has mounted \u2014 despite only around 15% of its revenues being generated domestically \u2014 with banks under particular pressure.\n\nThe French stock market is historically sensitive to any widening in the so-called \"OAT-Bund spread\", the extra bond yield France pays over Germany, which has hit the highest level since the European Sovereign Debt Crisis of the early 2010s. French yields now also surpass those of Italy or Greece, implying higher risk.\n\nWidening bond spreads raise concerns about the cost for companies to raise capital and heighten fears of higher taxes and tighter regulation. The French stock market has also struggled due to the dominance of its luxury firms, which are suffering from a downturn in high-end Chinese consumer spending.\n\nHundreds of thousands of people marched over the weekend in protest over political paralysis , the cost of living and the state of public services, including schools and healthcare.\n\nMass gatherings in cities from Paris to Lyon and Marseille spilled into dramatic scenes of buildings and cars set on fire, clashes with police and more than 2,000 arrests.", "source": "CNBC Top News", "pub_date_str": "19 Oct 2026, 06:29 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Boomers are buying into the promise of monthly income from options ETFs, but there's a tax catch", "full_content": "Covered call ETFs have been widely adopted by baby boomers to meet monthly income needs, but unlike most ETFs, the tax implications can be significant.", "source": "CNBC Top News", "pub_date_str": "19 Oct 2026, 06:28 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "FSSAI Moves To Restrict Added Sugar In Foods For Babies Below Six Months", "full_content": "Early exposure to added sugars could shape a child\u2019s eating habits for life, the government says. Here\u2019s what FSSAI\u2019s proposed ban on added sugars in infant food means.", "source": "NDTV Profit", "pub_date_str": "19 Oct 2026, 06:25 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Reliance Jio IPO: 'Salute Mukesh Ambani' - Ace investor Manish Chokhani on '500 mn customers, $100 bn valuation", "full_content": "Jio Platforms\u2019 IPO will open October 21, with a price band of \u20b91,065\u2013 \u20b91,119 per share. The fresh issue could raise about \u20b930,213 crore, making it India\u2019s largest IPO. The offering has reportedly drawn strong interest from global and domestic institutional investors.", "source": "LiveMint Markets", "pub_date_str": "19 Oct 2026, 06:21 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Robot factories and hypersonic missiles: JPMorgan Chase's first $5 billion of defense investments", "full_content": nt": "CME Group on Monday said it will launch tungsten futures to meet rising demand for its metals complex, which registered record volume this year. * The contracts are expected to", "source": "Economic Times Markets", "pub_date_str": "19 Oct 2026, 05:35 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Gold price to touch \u20b91.60 lakh by Dec 2026 end? Time to buy? What experts say to earn money from yellow metal deals", "full_content": "Gold rate today: The gold futures contract for December 4, 2026 expiry is trading above \u20b91,48,000 per 10 gm", "source": "LiveMint Markets", "pub_date_str": "19 Oct 2026, 05:34 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Derivatives", "Alternative Investments"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Trump waives Russia sanctions, easing India\u2019s energy concerns as US trade deal nears", "full_content": "US President Donald Trump waived key Russian sanctions which may enhance trade relations with India. This decision is expected to provide negotiating space for a potential trade deal. India, one of the largest importers of Russian oil, faces challenges due to declining imports. Secretary of State Marco Rubio is visiting India to discuss cooperation on this matter. The waiver could help India secure more favorable tariffs while stabilizing energy policies.", "source": "Economic Times Economy", "pub_date_str": "19 Oct 2026, 05:33 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}], "updated_at": "19 Oct 2026, 08:20 PM IST", "total_stories": 296};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>

</body>
</html>
