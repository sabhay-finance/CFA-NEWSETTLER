    const allData = {"general": [{"title": "One Singapore ship was sunk, but here's why others are still transiting the Strait of Hormuz", "full_content": "Commercial vessels are likely to continue navigating the perilous Strait of Hormuz despite the sinking of a Singapore-flagged container ship this week, as strong demand for Middle Eastern energy and lucrative shipping opportunities keep some operators willing to brave escalating attacks, maritime experts said.\n\nThe latest attacks on two Singapore-flagged container ships have heightened concerns over the safety of commercial shipping through one of the world's most important maritime chokepoints. But analysts say the incidents are unlikely to bring remaining shipping activity through the Strait to a halt, even as major container lines largely stay away.\n\nCollin Koh, a senior fellow at Singapore's S. Rajaratnam School of International Studies, said shipping companies were likely to continue seeking opportunities to transit the strait despite heightened security threats.\n\n\"I don't see in the short term, that Singapore flagged ships or Singapore shipping companies would necessarily avoid taking the transit if there is an opportunity,\" Koh told CNBC.\n\nHis comments follow attacks on two Singapore-registered container ships, GFS Pride and GFS Giselle, this week. GFS Pride sank after being struck by a projectile and catching fire, while GFS Giselle was damaged. Crew members from both vessels were reported safe.\n\nCrossings through the Strait of Hormuz fell to 131 in the week ended Oct. 14, from 176 the previous week, according to maritime analytics firm Kpler, although the decline cannot be attributed solely to the latest incidents.\n\nDimitris Ampatzidis, maritime risk and compliance manager at Kpler, said the attacks underscored Iran's continuing ability to threaten commercial vessels, with the risks extending beyond oil and gas transportation.\n\nKoh said shipping companies around the world have continued l h Professor Pulak Ghosh as Member (Part-Time) and Pankaj Jain as Member Secretary. Under its Terms of Reference (ToR), the commission has been given 18 months from its constitution to submit its final report to the central government.\n\nHowever, the report can be submitted only after the commission completes its consultations with eligible employee unions and associations. To facilitate these discussions, the panel has held meetings across several states and union territories, including Delhi, Bengaluru, Odisha, Ladakh and Uttar Pradesh. Another round of consultations is scheduled to begin in Mumbai on 22 October, according to the commission's official website.\n\nThe report is expected to contain recommendations on several key issues, including the fitment factor, salary allowances, pension reforms and other service-related benefits.\n\nFor serving central government employees and pensioners, a key question is how the commission will determine the fitment factor and revised basic pay as it approaches its first anniversary on 3 November 2026.\n\nEqually important is the effective date of the revised pay structure. This will help determine whether eligible employees receive arrears for the period between the approved effective date and the actual implementation of revised salaries, subject to the government's decision and applicable rules.\n\nThe experience of previous Pay Commissions offers useful context. While the 5th and 6th Pay Commissions involved different implementation timelines, the recommendations of the 7th Pay Commission were implemented within six months of its report being submitted in November 2015.\n\nIn the case of the 8th Pay Commission, 1 January 2026 is emerging as a possible effective date, in line with the 10-year pay revision cycle . However, the date has not been officially confirmed.", "source": "LiveMint Money", "pub_date_str": "16 Oct 2026, 11:12 AM IST", "pub_date_relative": "16m ago"}, {"title": "Why is Wipro stock surging today?", "full_content": "", "source": "Investing.com News", "pub_date_str": "16 Oct 2026, 11:11 AM IST", "pub_date_relative": "17m ago"}, {"title": "AI selloff hammers hedge funds this week, Asia managers lead losses", "full_content": "", "source": "Investing.com News", "pub_date_str": "16 Oct 2026, 11:07 AM IST", "pub_date_relative": "21m ago"}, {"title": "China\u2019s super-rich scramble to exit offshore trusts, raise cash as taxman knocks", "full_content": "", "source": "Investing.com News", "pub_date_str": "16 Oct 2026, 11:06 AM IST", "pub_date_relative": "21m ago"}, {"title": "Analysis-India widens rupee defence to rates, but cautiously", "full_content": "", "source": "Investing.com News", "pub_date_str": "16 Oct 2026, 11:06 AM IST", "pub_date_relative": "21m ago"}, {"title": "Reliance Industries share price falls 2.5% despite Jio IPO buzz: What should Mukesh Ambani stock investors do?", "full_content": "Reliance Industries shares declined on Friday, October 16, reversing part of their recent gains as investors assessed the implications of the proposed initial public offering (IPO) of Jio Platforms, the company's digital services subsidiary.\n\nThe Mukesh Ambani stock fell as much as 2.5% to an intraday low of \u20b9 1,192.75 on the BSE, despite gaining around 5% over the preceding three sessions. It was trading close to its 52-week low of \u20b9 1,152.30, recorded in October 2026, and remained around 26% below its 52-week high of \u20b9 1,611.20, hit in January 2026.\n\nReliance Industries shares have lost more than 4% over the past month, 9% in three months, 12% in six months and 14% over the past year. Over five years, the stock has declined around 4%.\n\nThe latest weakness comes after Jio Platforms filed its red herring prospectus (RHP) for its proposed IPO, bringing the valuation of Reliance Industries' telecom and digital businesses into focus . With the public issue approaching, investors will be watching whether the listing plans can support sentiment towards the parent company's shares.\n\nJio Platforms' IPO is expected to be one of India's largest public offerings. The issue is scheduled to open for subscription on Wednesday, October 21, and close on Friday, October 23, 2026. The shares are expected to list on October 28.\n\nThe company has set a price band of \u20b9 1,065- \u20b9 1,119 per equity share and aims to raise between \u20b9 28,755 crore and \u20b9 30,213 crore.\n\nJio Platforms IPO was commanding a grey market premium (GMP) of \u20b9 220 as of October 16, 2026. Against the upper price band of \u20b9 1,119, this implies an estimated listing price of \u20b9 1,339, translating into a potential listing gain of 19.66%. However, GMP is an unofficial indicator and does not guarantee listing performance.\n\nThe offering comprises a fresh issue of up to 27 crore equity shares, with no offer-for-sale component. This means existing shareholders will not sell their shares as part of the issue.", "source": "LiveMint Markets", "pub_date_str": "16 Oct 2026, 10:58 AM IST", "pub_date_relative": "29m ago"}, {"title": "Warsh Avoids Signal on October Rate Move - WSJ", "full_content": "Warsh Avoids Signal on October Rate Move WSJ Fed's Warsh sees US economic tailwinds, mum on rate-path view Reuters Warsh says Fed is focused on taming rising prices, but gives no hint about next rate hike NBC News Warsh Boosts Market Expectations of Fed Hold in October Bloomberg Fed's Warsh to look beyond interest rates over next 100 days American Banker", "source": "Google News Business", "pub_date_str": "16 Oct 2026, 10:53 AM IST", "pub_date_relative": "35m ago"}, {"title": "PC Jeweller share: 70% returns in 6 months! What is driving the stock? Experts give 3 reasons to buy | Target, stop-loss", "full_content": "\" PC Jeweller share price target | Stocks to buy today: After the announcement of CUPID promoter Aditya Kumar Halwasia buying 5.10 crore PC Jeweller shares, paying \u20b9 14.43 per share. This sparked strong buying interest in the jewellery stock during the early morning session on Friday. PC Jeweller share price today opened with an upside gap at \u20b9 15.06 per share on the NSE and touched an intraday high of \u20b9 16.45 apiece within a few minutes of the Opening Bell, clocking an intraday rise of 14%. While hitting today's intraday high, PC Jeweller shares climbed to a new 52-week peak of \u20b9 16.45.\n\nAccording to stock market experts, today's rally in PC Jeweller share price today due to the CUPI promoter Aditya Kumar Halwasiya buying 5.10 crore company shares. However, the sustained rally in PC Jeweller shares can be attributed to the company achieving debt-free status, buzz around strong Q2 2026 results, and business expansions in the pipeline.\n\nSpeaking on the immediate reason for PC Jeweller's share price rise, Anuj Gupta, a SEBI-registered market expert, said, \u201cPC Jeweller's share is rising due to the bulk deal buzz. CUPID promoter has bought more than 5 crore shares of PC Jeweller in a bulk deal on Thursday. This has created a short-term buzz about the stock.\u201d\n\nHowever, one must remember that the PC Jeweller share price has been on an uptrend for a long time. The stock has risen 30% in one month and around 70% in the last six months.\n\n\u201cPC Jeweller share price rally in 2026 can be attributed to three major reasons: debt-free status, expectations for strong Q2 results, and regular fundraises are fueling expansion buzz for the jewellery stock,\u201d said Mahesh M Ojha, VP \u2014 Research and Business Development at KC Securities.\n\nOjha said the jewellery brand has repaid all its dues to the 14 banks, and all mortgaged assets and guarantees have been released, which has gone down well with market bulls.", "source": "LiveMint Markets", "pub_date_str": "16 Oct 2026, 10:50 AM IST", "pub_date_relative": "37m ago"}, {"title": "Persistent Systems shares slide 5% despite Q2 revenue growth. Buy, sell or hold?", "full_content": "Home ETPrime Markets Market Data Masterclass N gram.", "source": "Economic Times Markets", "pub_date_str": "16 Oct 2026, 10:48 AM IST", "pub_date_relative": "40m ago"}, {"title": "New CAS rules decoded: What Sebi\u2019s revised framework means for stock market traders", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a New CAS rules decoded: What Sebi\u2019s revised framework means for stock market traders BSE Share Price Multi Commodity Exchange of India Share Price Indian Energy Exchange Share Price The Economic Times daily newspaper is available online now. Read Today's Paper New CAS rules decoded: What Sebi\u2019s revised framework means for stock market traders SECTIONS New CAS rules decoded: What Sebi\u2019s revised framework means for stock market traders By Veer Sharma , ETMarkets.com Last Updated: Oct 16, 2026, 10:46:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Sebi has revised the Closing Auction Session (CAS) framework after receiving more than 20,000 comments from stakeholders. The updated rules introduce a 10-minute closing auction, restore the VWAP method for F&O expiry settlement prices and clarify order transfers. Most changes will take effect on December 7, 2026.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "16 Oct 2026, 10:46 AM IST", "pub_date_relative": "42m ago"}, {"title": "Fed's Warsh withholds Fed rate signal, praises recent global tightening with 'no free riders'", "full_content": "BANGKOK \u2014 Federal Reserve Chairman Kevin Warsh refrained from signaling whether there will be another interest rate hike again this month, while acknowledging a \"synchronous tightening\" by central banks around the world and there's \"no free riders.\"\n\n\"I don't prejudge meetings. I don't believe in saying now what I might do at the meetings that we have in the balance of this year,\" Warsh said, reiterating his opposition to the use of forward guidance for markets that should rely on interpreting data.\n\nHe also acknowledged that stance may disappoint anyone who had hoped for a steer ahead of the central bank meeting later this month. \"It's a new chapter at the Fed [and] we're not in that business anymore. But we can go in any direction you'd like,\" he said.\n\nWarsh spoke at a fireside chat with the International Monetary Fund's managing director, Kristalina Georgieva, as part of the weeklong IMF-World Bank Annual Meetings in Bangkok on Friday.\n\nStock market indexes in Asia and Treasury yields were largely stable following the remarks.\n\nWarsh described the global picture as a common fight on prices. Central banks made their own choices under their own mandates, he said, but the result was \"a synchronous tightening in monetary policy in most places around the world,\" which means \"there's no free riders.\"\n\nHe was more expansive on artificial intelligence, which he called \"probably the most consequential change to the U.S. and the global economy in my lifetime.\"\n\nHe expressed optimism about how AI will make economies that use it well more productive and wealthier, while warning the road there may be \"very bumpy,\" and its near-term effect on jobs is still uncertain.", "source": "CNBC Top News", "pub_date_str": "16 Oct 2026, 10:37 AM IST", "pub_date_relative": "51m ago"}, {"title": "Persistent Systems share price tumbles 5% after Q2 results 2026 | What should investors do? Check target price, rating", "full_content": "Persistent Systems share price crashed over 5% in Friday's trading session after the company reported its financial results for the September quarter FY27. The stock opened at \u20b9 5,600 per share today, as compared to previous close of \u20b9 5,840 on Thursday and touched an intraday low of \u20b9 5,492 on 16 October.\n\nPersistent Systems reported a 5% year-on-year rise in consolidated profit after tax (PAT), excluding exceptional expenses, to \u20b9 495.15 crore in the second quarter of FY27 on Thursday, October 15. However, reported PAT declined 25.4% to \u20b9 351.51 crore after the company incurred an exceptional expense of \u20b9 185.34 crore related to its proposed acquisition of Nagarro.\n\nRevenue from operations increased 20.8% year-on-year in constant currency terms. In rupee terms, revenue rose 30.3% to \u20b9 4,663.9 crore, while dollar-denominated revenue grew 20% to $487.6 million.\n\nOn a sequential basis, revenue increased 8.4% in rupee terms and 7.8% in US dollar terms, marking the company's 26th consecutive quarter of revenue growth.\n\nMeanwhile, earnings per share (EPS) declined 26% to \u20b9 22.40. Earnings before interest and tax (EBIT) rose 19.5% year-on-year to \u20b9 697.72 crore, although the EBIT margin contracted to 15% from 16.3% in the corresponding quarter last year.\n\nEarnings before interest, tax, depreciation and amortisation (EBITDA) grew 26.4% year-on-year to \u20b9 864.4 crore. However, the EBITDA margin moderated to 18.5% from 19.1% in Q2 FY26.\n\nMahesh M Ojha, VP Research & Business Development at Kantilal Chhaganlal Securities, believes that Persistent Systems shares look positive from a trading perspective. Investors can consider the stock with a stop-loss at \u20b9 5,380.\n\n\u201cThe stock could move towards the target prices of \u20b9 5,825, \u20b9 5,950 and \u20b9 6,150 or higher, provided the bullish momentum sustains. Traders should maintain strict stop-loss discipline and monitor price action before taking positions,\u201d Ojha said.", "source": "LiveMint Markets", "pub_date_str": "16 Oct 2026, 10:32 AM IST", "pub_date_relative": "55m ago"}, {"title": "Karur Vysya Bank shares jump 6% to hit a 52-week high after Q2 results - Should you buy? Rationale, target price", "full_content": "Karur Vysya Bank shares rose almost 6% in the morning deal on the BSE on Friday, 16 October, to hit their 52-week high, a day after the company reported its September quarter (Q2FY27) results.\n\nKarur Vysya Bank share price opened at \u20b9 353.90 against its previous close of \u20b9 345.50 and jumped 5.9% to its 52-week high of \u20b9 365.85.\n\nKarur Vysya Bank on 15 October reported a 40.91% year-on-year (YoY) rise in its net profit to \u20b9 1,543 crore for Q2FY27. Deposits increased by 15.96% YoY and 4.52% QoQ, while advances jumped 20.35% YoY and 6.60% QoQ. The bank's net interest margin (NIM) increased by 28 bps YoY to 4.34%.\n\nBrokerage firm Systematix Shares and Stocks (India) has maintained a buy call on the stock with a target price of \u20b9 410, underscoring strong asset quality , stable NIM, healthy growth in advances, and improvement in profitability.\n\n\"Karur Vysya Bank (KVB) reported Q2FY27 PAT 3.3% above our estimates. NIM remained stable QoQ, supported by an 8bps QoQ improvement in yield on advances. Asset quality improved, with GNPA declining by 5bps QoQ to 0.7% and NNPA declining by 1bp QoQ to 0.2%, while the annualised slippage ratio stood at 0.45%. Operating profit grew by 14% YoY,\" Systematix noted.\n\n\"Management expects NIMs to remain above 4% over the next two quarters, supported by the transmission of the 25bps repo rate hike, while acknowledging potential pricing pressure and rising funding costs. Management reiterated its FY27 guidance of 18\u201320% advances growth and RoA above 2%, while targeting a cost-to-income ratio below 45% over the next two quarters,\" Systematix said.\n\nBrokerage firm Emkay Global Financial Services has raised its earnings estimates by 2-11%, expecting ROA to remain at nearly 2% over FY27-29E.", "source": "LiveMint Markets", "pub_date_str": "16 Oct 2026, 10:32 AM IST", "pub_date_relative": "56m ago"}, {"title": "Global hedge funds suffer steep losses as AI trade unwinds, Asia funds hit hardest", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a Global hedge funds suffer steep losses as AI trade unwinds, Asia funds hit hardest Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global hedge funds suffer steep losses as AI trade unwinds, Asia funds hit hardest SECTIONS Global hedge funds suffer steep losses as AI trade unwinds, Asia funds hit hardest By Anupam Nagar , ETMarkets.com Last Updated: Oct 16, 2026, 10:32:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Global hedge funds suffered steep losses as investors unwound artificial intelligence-related trades amid inflation concerns and expectations of higher interest rates. Asia-focused stock pickers were hit hardest, losing 6.8% in early October, while global fundamental long-short funds fell 2.9% through October 15, according to Goldman Sachs data cited by Reuters.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "16 Oct 2026, 10:32 AM IST", "pub_date_relative": "56m ago"}, {"title": "Karur Vysya Bank shares rally 6% after Q2 profit jumps 37% YoY", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Karur Vysya Bank shares rally 6% after Q2 profit jumps 37% YoY Karur Vysya Bank Share Price RBL Bank Share Price YES Bank Share Price Bandhan Bank Share Price City Union Bank Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Karur Vysya Bank shares rally 6% after Q2 profit jumps 37% YoY SECTIONS Karur Vysya Bank shares rally 6% after Q2 profit jumps 37% YoY By Ritesh Presswala , ETMarkets.com Last Updated: Oct 16, 2026, 10:30:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Karur Vysya Bank shares rose sharply after the private sector lender reported a 37% year-on-year rise in Q2FY27 net profit to Rs 788 crore. Net interest income grew 19% to Rs 1,497.3 crore, while total business increased nearly 18% to Rs 2.40 lakh crore.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "16 Oct 2026, 10:30 AM IST", "pub_date_relative": "58m ago"}, {"title": "The IPO drought is driving private equity-owned companies to the debt market to pay investors", "full_content": "Private equity funds are increasingly pushing their portfolio companies to take on more debt to return cash to their investors, data suggests.\n\nIt comes as the typical ways of monetizing private equity investments \u2014 selling company stakes via IPOs, or offloading them to other PE funds or buyers \u2014 have dried up in recent years.\n\nWhile investors get paid, the practice of private equity sponsors adding more debt to companies \u2014 known as dividend recapitalizations \u2014 risks weakening their ability to invest or weather future downturns in trading.\n\n\"Dividend recap\" activity has surged since 2022, and Moody's Ratings expects it to remain high in Europe, the Middle East and Africa as private equity firms look for ways to return money to investors while company sales and IPOs remain subdued.\n\nThe ratings agency estimates that private equity-owned companies in the EMEA region could take on a further 41 billion euros ($46 billion) in debt before reaching leverage levels that typically prompt a downgrade.\n\nNew Moody's analysis indicates the practice remains limited to the strongest-performing companies with the greatest capacity to take on new debt, indicating this \"significant releveraging capacity\" could support a further ramp-up in dividend recaps.\n\nStill, it does not address the exit backlog weighing over private equity, where funds are now having to hold onto companies for much longer than the typical period of around five to six years.\n\n\"The fundamental problem is that exits are few and far between \u2013 the European IPO markets have been muted, and the capital that would generally fund strategic purchases by large corporates has become a lot more expensive after the last rate hike cycle,\" said Moody's analyst Mayank Mallik. \"Generally, we are more focused on the impact that the general PE ecosystem has on corporate credit quality \u2014 and this is one of the key transmission mechanisms currently.\"", "source": "CNBC Top News", "pub_date_str": "16 Oct 2026, 10:30 AM IST", "pub_date_relative": "58m ago"}, {"title": "Rupee rises 20 paise to 94.79 against US dollar in early trade", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Forex \u203a Forex News \u203a Rupee rises 20 paise to 94.79 against US dollar in early trade The Economic Times daily newspaper is available online now. Read Today's Paper Rupee rises 20 paise to 94.79 against US dollar in early trade SECTIONS Rupee rises 20 paise to 94.79 against US dollar in early trade PTI Last Updated: Oct 16, 2026, 10:25:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The rupee reached 94.79 against the US dollar following structural forex interventions by the Reserve Bank of India. Elevated crude oil prices and declining equity markets limited the currency's gains. The dollar index decreased by 0.54 per cent, reflecting the dollar's weakened strength. While US retail sales exceeded forecasts, the Producer Price Index was unexpectedly high. Foreign Institutional Investors also offloaded significant equities on Thursday, impacting domestic market performance.\n\n(What's moving Sensex and Nifty Track latest market news , stock tip sustained purchases tied to weddings could boost sales, even amid rising gold prices. While Titan Company and Kalyan Jewellers remain prominent, Senco Gold and Lalithaa Jewellery Mart are capturing investor interest.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "16 Oct 2026, 10:17 AM IST", "pub_date_relative": "1h ago"}, {"title": "8th pay commission: Constituted in November 2025 \u2014 Almost a year later, check key updates so far", "full_content": "Around 11 months after the 8th central pay commission (CPC) was constituted in November last year, it is in its consultation stage, gathering inputs from central government employees and pensioner groups, unions and stakeholders before it makes its final recommendations next year.\n\nThe commission has next week also scheduled meetings in Mumbai in order to hold discussions with employee unions, representatives, groups, pensioner associations, federations, and other stakeholders.\n\nIt is expected to examine and recommend changes that are desirable and feasible in the emoluments, including pay (usually includes salary structure, pay matrix, fitment factor), allowances (usually include DA, DR, HRA), other facilities / benefits, in cash or kind (includes increment, promotions, etc.).\n\nAll central government employees and retired former servicemen are impacted by the revisions. Overall, the recommendations are set to benefit over 1 crore people, including near 50 lakh central government employees and some 65 lakh pensioners, including personnel and retirees with the defence and railway ministries.\n\nResponding to questions in the Parliament earlier this year, Minister of State (MoS) for Finance Pankaj Chaudhary stated that the 8th CPC has been given 18 months from its date of constitution to submit its recommendations. He added that recommendations on revised salaries, allowances and pensions, and the implementation date are not known as the Commission has not yet submitted its report.\n\nEstablished by the central government every 10 years to revise the allowances, pay and pensions of its employees, the pay commission or CPC, is responsible for decisions on contributions, retirement benefits and government spending. The current panel is the Centre's eight since Independence.", "source": "LiveMint Money", "pub_date_str": "16 Oct 2026, 10:16 AM IST", "pub_date_relative": "1h ago"}, {"title": "Global Market: China's wealthy rush to unwind offshore trusts as tax deadline looms", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a Global Market: China's wealthy rush to unwind offshore trusts as tax deadline looms Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market: China's wealthy rush to unwind offshore trusts as tax deadline looms SECTIONS Global Market: China's wealthy rush to unwind offshore trusts as tax deadline looms By Anupam Nagar , ETMarkets.com Last Updated: Oct 16, 2026, 10:12:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis China\u2019s wealthy individuals are restruc ub_date_str": "16 Oct 2026, 10:10 AM IST", "pub_date_relative": "1h ago"}, {"title": "Yes Bank Faces Capital Risk After AT-1 Verdict; Citi Cuts Target, Morgan Stanley Retains 'Underweight'", "full_content": "Citi has maintained its 'Sell' rating on Yes Bank but lowered its target price to Rs 17.50 from Rs 22, describing the Supreme Court ruling as a reversal of the AT1 bond write-down that reopens the bank's capital-related concerns.", "source": "NDTV Profit", "pub_date_str": "16 Oct 2026, 10:06 AM IST", "pub_date_relative": "1h ago"}, {"title": "Persistent Systems among 4 F&O stocks with a sharp rise in futures open interest", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News Persistent Systems among 4 F&O stocks with a sharp rise in futures open interest Written by Ritesh Presswala , ETMarkets.com | Oct 16, 2026, 10:07:56 AM IST 1 / 5 Market Movers As of October 15, four stocks in the NSE F&O segment recorded a rise of more than 11% in futures open interest compared with the previous trading session, according to StockEdge F&O scan data. A notable increase in futures open interest indicates a substantial rise in the number of active, unexpired futures contracts in a security. This may reflect market participants initiating new positions or increasing the size of their existing positions.", "source": "Economic Times Markets", "pub_date_str": "16 Oct 2026, 10:05 AM IST", "pub_date_relative": "1h ago"}, {"title": "Global Market: South Korean shares rebound, but head for biggest weekly loss in 18 years", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Global Market: South Korean shares rebound, but head for biggest weekly loss in 18 years Powered By The Economic Tim ex advanced nearly 2%, supported by gains across major IT stocks.\n\nTech Mahindra added as much as 7% to its day's high of \u20b9 1,763.95 per share on BSE.\n\nInfosys and Wipro rose over 3.5% each, while Tata Consultancy Services (TCS) gained around 3%. L&T Technology Services, Mphasis, LTIMindtree and HCL Technologies also traded higher, while Persistent Systems fell over 4% and Coforge declined.\n\nTech Mahindra shares are now around 5% below their 52-week high of \u20b9 1,850, recorded in February 2026. The stock had touched a 52-week low of \u20b9 1,304.25 in March.\n\nTech Mahindra reported a 32.7% year-on-year (YoY) increase in consolidated net profit attributable to owners to \u20b9 1,585.6 crore in Q2FY27, compared with \u20b9 1,194.5 crore in the corresponding quarter last year.\n\nRevenue from operations rose 15.6% YoY to \u20b9 16,180.2 crore from \u20b9 13,994.9 crore. EBITDA increased 32.8% to \u20b9 2,878.5 crore from \u20b9 2,168 crore a year earlier.\n\nThe company's board declared an interim dividend of \u20b9 15 per equity share of face value \u20b9 5 for FY27, equivalent to 300%. It also approved a 1:1 bonus issue , subject to shareholder approval through a postal ballot. Under the proposal, eligible shareholders will receive one fully paid-up equity share for every existing equity share held.", "source": "LiveMint Markets", "pub_date_str": "16 Oct 2026, 09:56 AM IST", "pub_date_relative": "1h ago"}, {"title": "Wipro shares rise over 2% as Q2 revenue grows 9% YoY. What are Nomura, Goldman Sachs analysts saying?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Wipro shares rise over 2% as Q2 revenue grows 9% YoY. What are Nomura, Goldman Sachs analysts saying? Wipro Share Price Tata Consultancy Services Share Price Infosys Share Price HCL Technologies Share Price Tech Mahindra Share Price Th he spotlight.", "source": "NDTV Profit", "pub_date_str": "16 Oct 2026, 09:55 AM IST", "pub_date_relative": "1h ago"}, {"title": "Sahajanand Medical Technologies IPO GMP Today: Grey Market Premium Signals 13% Listing Gain", "full_content": "Sahajanand Medical Technologies IPO is expected to list at Rs 387 against the upper price band of Rs 344. The issue is worth Rs 475.48 crore and will remain open for subscription until Oct. 19.", "source": "NDTV Profit", "pub_date_str": "16 Oct 2026, 09:54 AM IST", "pub_date_relative": "1h ago"}, {"title": "IDBI Bank shares crashed after Fairfax deal; should you buy this to reap profits later? Will they rise? Experts' views", "full_content": "IDBI Bank-Fairfax Stake Sale | IDBI Bank share price target: Shares of IDBI Bank witnessed a sharp sell-off on Thursday after the announcement of the Government of India (GoI) and LIC offloading their shareholding in IDBI Bank to Prem Watsa-famed Fairfax. In this IDBI Bank's stake sale, the Indian Union Cabinet approved the sale of a 60.72% stake in IDBI Bank to Fairfax Financial Holdings for \u20b9 52,878 crore, valuing the IDBI Bank shares at \u20b9 81 apiece. However, the banking stock saw some value buying during the Opening Bell. IDBI Bank's share price today opened at \u20b9 83.70 per share, edging higher against the previous day's close of \u20b9 83.45 per share, and touched an intraday high of \u20b9 84.10 per share. However, the stock failed to sustain at higher levels and came under the profit-booking pressure, sparking debate over whether the Hyderabad-born Canadian investor and CEO of Fairax will be a lucky charm for the bank and its shareholders.\n\nAccording to stock market experts, the GoI's divestment plan may transform IDBI Bank from a traditional lender into a diversified financial services company offering banking, insurance, wealth management and investment banking. However, they maintained that such a transformation doesn't happen overnight and it takes time. So, long-term investors may take advantage of this crash in IDBI Bank shares and begin accumulating them in a calibrated manner.\n\nHighlighting the reason for IDBI Bank's share price slide, Avinash Gorakshkar, Founder of Avinash Mentor Research, said, \"The IDBI Bank stake sale is aimed at meeting the SEBI guidelines and its FY27 divestment target of \u20b9 80,000 crore. However, it doesn't mean they will offload their entire stake. They would remain there, along with the expertise of Prem Watsa, the CEO of Fairfax. However, this will take time and the recent crash should be seen as a panic sale.", "source": "LiveMint Markets", "pub_date_str": "16 Oct 2026, 09:53 AM IST", "pub_date_relative": "1h ago"}, {"title": "Wipro shares rise 5%, up 15% so far in October - Should you buy this IT stock after Q2 results? Experts suggest", "full_content": "Wipro shares climbed almost 5% in morning trade on the BSE on Friday, 16 October, a day after the company reported its September quarter (Q2FY26) results. Wipro share price opened at \u20b9 170.35 against its previous close of \u20b9 173.70 and jumped 4.72% to hit an intraday high of \u20b9 181.90. At this price, the stock has gained 15%.\n\nWipro's Q2FY27 net profit declined 1.9% year-on-year (YoY) to \u20b9 3,200 crore, while revenue from operations was \u20b9 24,752.7 crore, up 9% from \u20b9 22,697.3 crore in the year-ago quarter.\n\nRevenue from the IT services segment was \u20b9 24,667 crore, up 1% YoY.\n\nWipro said it expects revenue from the IT services business segment to be in the range of USD 2,571 million to USD 2,625 million in Q3 FY27, translating to a sequential guidance of (-)1.5 per cent to (+)0.5 per cent in constant currency terms.\n\nBrokerage firm Choice Equity Broking has a \"reduce\" view on the stock with a target price of \u20b9 160, citing Wipro\u2019s Q2FY27 performance remained subdued, with management guiding for Q3FY27 growth of -1.5% to +0.5% QoQ in CC, reflecting seasonal furloughs and fewer working days.\n\nAccording to Choice Broking, delayed deal signing is expected to provide a revenue tailwind into Q3 and Q4, while the demand environment remains largely unchanged.\n\n\"Clients are increasingly prioritising AI-led productivity and efficiency, creating opportunities for higher-value transformation. Wipro is scaling up investments across AI data centres, AI foundry services, physical AI, AI devices and design-to-manufacturing, broadening its position across the AI value chain,\" Choice Broking noted.\n\n\"We see improving deal conversion and monetisation of AI investments as key catalysts for a gradual growth recovery, though execution and margin delivery remain critical given near-term investment intensity. At 12 times average FY28 and 29 EPS, we arrive at a target price of \u20b9 160 and assign \u2018reduce\u2019, implying limited valuation re-rating until growth momentum improves,\" said Choice.", "source": "LiveMint Markets", "pub_date_str": "16 Oct 2026, 09:52 AM IST", "pub_date_relative": "1h ago"}, {"title": "Global Market: Yuan holds steady, set for third weekly gain on robust Chinese exports", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Global Market: Yuan holds steady, set for third weekly gain on robust Chinese exports Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market: Yuan holds steady, set for third weekly gain on robust Chinese exports SECTIONS Global Market: Yuan holds steady, set for third weekly gain on robust Chinese exports By Anupam Nagar , ETMarkets.com Last Updated: Oct 16, 2026, 09:50:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis China\u2019s yuan remained stable against the dollar, heading for a third consecutive weekly gain on resilient exports. The currency reached i n in four, with investors shaking off the latest sell-off in technology stocks.\n\nFutures tied to the broad market average traded 0.16% higher, while Nasdaq-100 futures gained 0.14%. Futures linked to the Dow Jones Industrial Average gained 81 points.\n\nIn Asia, Japan's Nikkei 225 added 1.90% while the Topix rose 1.87% on Friday. The Kospi advanced 4.07%, and the small-cap Kosdaq gained 5.33%. Australia's benchmark S&P/ASX 200 was 1.12% higher. Hong Kong's Hang Seng index rose 1.21%, while mainland China's CSI 300 was 0.75% higher.\n\nThe three major U.S. averages finished Thursday's session in the green as investors rotated out of key tech names and into other parts of the market. The S&P 500 finished up roughly 0.3%, while the Nasdaq Composite lagged, inching up only about 0.1%. Both snapped a three-day losing streak. The Dow was the leader among the three, jumping more than 500 points, or around 1.1%.\n\nA slide in stocks related to the artificial intelligence trade, especially those in the memory chip space, has weighed on the market this week amid jitters about competition from China . Micron Technology , which finished higher Thursday, is on pace for a decline of more than 9% on the week. Others like Seagate Technology and Western Digital are also pacing for a losing week.\n\nInvestors have also grown concerned that tech companies are borrowing too much for the AI buildout. Neocloud stocks like CoreWeave , which also recovered Thursday from a steep drop in the prior session , is heading for a 15% on the week.\n\nFurther, Anthropic has told investors that its third-quarter revenue is $16.8 billion . The disclosure comes as traders fixate on growth in the AI space and whether it's strong enough to back up the recent gains in chipmakers.", "source": "CNBC Top News", "pub_date_str": "16 Oct 2026, 09:48 AM IST", "pub_date_relative": "1h ago"}, {"title": "HD Fire Protect IPO allotment likely today; GMP at 30%. Here's how to check status", "full_content": "Home ETP b_date_relative": "1h ago"}, {"title": "BSE, Angel One Fall Over 3% On SEBI CAS Changes; MCX, Groww, NSE Also Decline", "full_content": "Under the revised framework, the closing auction session will run from 3:30 p.m. to 3:40 p.m., with most changes taking effect from December 7, 2026.", "source": "NDTV Profit", "pub_date_str": "16 Oct 2026, 09:47 AM IST", "pub_date_relative": "1h ago"}, {"title": "Jio IPO: Meta, Google sit on nearly \u20b91 lakh crore paper profit & neither is selling", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Jio IPO: Meta, Google sit on nearly \u20b91 lakh crore paper profit & neither is selling Reliance Industries Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Jio IPO: Meta, Google sit on nearly \u20b91 lakh crore paper profit & neither is selling SECTIONS Jio IPO: Meta, Google sit on nearly \u20b91 lakh crore paper profit & neither is selling By Nikhil Agarwal , ETMarkets.com Last Updated: Oct 16, 2026, 09:44:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Meta Platforms and Google are poised to realize significant gains from their Jio investment made in 2020. To bolster its growth, Jio Platforms is moving forward with an initial public offering planned to raise around \u20b930,213 crore, achieving a valuation of \u20b910.3 lakh crore. Neither Meta nor Google plans to divest shares in this round as existing backers maintain their stakes.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "16 Oct 2026, 09:44 AM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "One Singapore ship was sunk, but here's why others are still transiting the Strait of Hormuz", "full_content": "Commercial vessels are likely to continue navigating the perilous Strait of Hormuz despite the sinking of a Singapore-flagged container ship this week, as strong demand for Middle Eastern energy and lucrative shipping opportunities keep some operators willing to brave escalating attacks, maritime experts said.\n\nThe latest attacks on two Singapore-flagged container ships have heightened concerns over the safety of commercial shipping through one of the world's most important maritime chokepoints. But analysts say the incidents are unlikely to bring remaining shipping activity through the Strait to a halt, even as major container lines largely stay away.\n\nCollin Koh, a senior fellow at Singapore's S. Rajaratnam School of International Studies, said shipping companies were likely to continue seeking opportunities to transit the strait despite heightened security threats.\n\n\"I don't see in the short term, that Singapore flagged ships or Singapore shipping companies would necessarily avoid taking the transit if there is an opportunity,\" Koh told CNBC.\n\nHis comments follow attacks on two Singapore-registered container ships, GFS Pride and GFS Giselle, this week. GFS Pride sank after being struck by a projectile and catching fire, while GFS Giselle was damaged. Crew members from both vessels were reported safe.\n\nCrossings through the Strait of Hormuz fell to 131 in the week ended Oct. 14, from 176 the previous week, according to maritime analytics firm Kpler, although the decline cannot be attributed solely to the latest incidents.\n\nDimitris Ampatzidis, maritime risk and compliance manager at Kpler, said the attacks underscored Iran's continuing ability to threaten commercial vessels, with the risks extending beyond oil and gas transportation.\n\nKoh said shipping companies around the world have continued looking for opportunities to navigate the Strait since the conflict erupted, with some operators prepared to accept higher risks and costs.", "source": "CNBC Top News", "pub_date_str": "16 Oct 2026, 11:26 AM IST", "pub_date_relative": "2m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Earnings call transcript: Sterling and Wilson Renewable Q2 2026 profit improves", "full_content": "", "source": "Investing.com News", "pub_date_str": "16 Oct 2026, 11:21 AM IST", "pub_date_relative": "6m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Shanti Gold, PC Jeweller & other jewellery stocks rally up to 10% as gold ETF FoF subscriptions face curbs", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Shanti Gold, PC Jeweller & other jewellery stocks rally up to 10% as gold ETF FoF subscriptions face curbs PC Jeweller Share Price Titan Company Share Price Kalyan Jewellers India Share Price Thangamayil Jewellery Share Price Bluestone Jewellery and Lifestyle Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Shanti Gold, PC Jeweller & other jewellery stocks rally up to 10% as gold ETF FoF subscriptions face curbs SECTIONS Shanti Gold, PC Jeweller & other jewellery stocks rally up to 10% as gold ETF FoF subscriptions face curbs By Sakshi Kumari , ETMarkets.com Last Updated: Oct 16, 2026, 11:19:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Jewellery stocks, including Shanti Gold International, PC Jeweller and Sky Gold and Diamonds, rose sharply on Friday as mutual fund houses temporarily restricted fresh subscriptions to gold ETF Fund of Funds. With the festive and wedding season approaching, analysts expect resilient gold demand, while organised retailers could benefit from market share gains.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets .", "source": "Economic Times Markets", "pub_date_str": "16 Oct 2026, 11:19 AM IST", "pub_date_relative": "8m ago", "cfa_topics": ["Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Wipro shares hit two-month high as revenue beat offsets weak deal bookings", "full_content": "", "source": "Investing.com News", "pub_date_str": "16 Oct 2026, 11:19 AM IST", "pub_date_relative": "9m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "8th Pay Commission: Will central government employees get arrears from January 2026?", "full_content": "The 8th Pay Commission was constituted on 3 November 2025 under the chairmanship of Justice Ranjana Prakash Desai, with Professor Pulak Ghosh as Member (Part-Time) and Pankaj Jain as Member Secretary. Under its Terms of Reference (ToR), the commission has been given 18 months from its constitution to submit its final report to the central government.\n\nHowever, the report can be submitted only after the commission completes its consultations with eligible employee unions and associations. To facilitate these discussions, the panel has held meetings across several states and union territories, including Delhi, Bengaluru, Odisha, Ladakh and Uttar Pradesh. Another round of consultations is scheduled to begin in Mumbai on 22 October, according to the commission's official website.\n\nThe report is expected to contain recommendations on several key issues, including the fitment factor, salary allowances, pension reforms and other service-related benefits.\n\nFor serving central government employees and pensioners, a key question is how the commission will determine the fitment factor and revised basic pay as it approaches its first anniversary on 3 November 2026.\n\nEqually important is the effective date of the revised pay structure. This will help determine whether eligible employees receive arrears for the period between the approved effective date and the actual implementation of revised salaries, subject to the government's decision and applicable rules.\n\nThe experience of previous Pay Commissions offers useful context. While the 5th and 6th Pay Commissions involved different implementation timelines, the recommendations of the 7th Pay Commission were implemented within six months of its report being submitted in November 2015.\n\nIn the case of the 8th Pay Commission, 1 January 2026 is emerging as a possible effective date, in line with the 10-year pay revision cycle . However, the date has not been officially confirmed.", "source": "LiveMint Money", "pub_date_str": "16 Oct 2026, 11:12 AM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Reliance Industries share price falls 2.5% despite Jio IPO buzz: What should Mukesh Ambani stock investors do?", "full_content": "Reliance Industries shares declined on Friday, October 16, reversing part of their recent gains as investors assessed the implications of the proposed initial public offering (IPO) of Jio Platforms, the company's digital services subsidiary.\n\nThe Mukesh Ambani stock fell as much as 2.5% to an intraday low of \u20b9 1,192.75 on the BSE, despite gaining around 5% over the preceding three sessions. It was trading close to its 52-week low of \u20b9 1,152.30, recorded in October 2026, and remained around 26% below its 52-week high of \u20b9 1,611.20, hit in January 2026.\n\nReliance Industries shares have lost more than 4% over the past month, 9% in three months, 12% in six months and 14% over the past year. Over five years, the stock has declined around 4%.\n\nThe latest weakness comes after Jio Platforms filed its red herring prospectus (RHP) for its proposed IPO, bringing the valuation of Reliance Industries' telecom and digital businesses into focus . With the public issue approaching, investors will be watching whether the listing plans can support sentiment towards the parent company's shares.\n\nJio Platforms' IPO is expected to be one of India's largest public offerings. The issue is scheduled to open for subscription on Wednesday, October 21, and close on Friday, October 23, 2026. The shares are expected to list on October 28.\n\nThe company has set a price band of \u20b9 1,065- \u20b9 1,119 per equity share and aims to raise between \u20b9 28,755 crore and \u20b9 30,213 crore.\n\nJio Platforms IPO was commanding a grey market premium (GMP) of \u20b9 220 as of October 16, 2026. Against the upper price band of \u20b9 1,119, this implies an estimated listing price of \u20b9 1,339, translating into a potential listing gain of 19.66%. However, GMP is an unofficial indicator and does not guarantee listing performance.\n\nThe offering comprises a fresh issue of up to 27 crore equity shares, with no offer-for-sale component. This means existing shareholders will not sell their shares as part of the issue.", "source": "LiveMint Markets", "pub_date_str": "16 Oct 2026, 10:58 AM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Warsh Avoids Signal on October Rate Move - WSJ", "full_content": "Warsh Avoids Signal on October Rate Move WSJ Fed's Warsh sees US economic tailwinds, mum on rate-path view Reuters Warsh says Fed is focused on taming rising prices, but gives no hint about next rate hike NBC News Warsh Boosts Market Expectations of Fed Hold in October Bloomberg Fed's Warsh to look beyond interest rates over next 100 days American Banker", "source": "Google News Business", "pub_date_str": "16 Oct 2026, 10:53 AM IST", "pub_date_relative": "35m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "PC Jeweller share: 70% returns in 6 months! What is driving the stock? Experts give 3 reasons to buy | Target, stop-loss", "full_content": "\" PC Jeweller share price target | Stocks to buy today: After the announcement of CUPID promoter Aditya Kumar Halwasia buying 5.10 crore PC Jeweller shares, paying \u20b9 14.43 per share. This sparked strong buying interest in the jewellery stock during the early morning session on Friday. PC Jeweller share price today opened with an upside gap at \u20b9 15.06 per share on the NSE and touched an intraday high of \u20b9 16.45 apiece within a few minutes of the Opening Bell, clocking an intraday rise of 14%. While hitting today's intraday high, PC Jeweller shares climbed to a new 52-week peak of \u20b9 16.45.\n\nAccording to stock market experts, today's rally in PC Jeweller share price today due to the CUPI promoter Aditya Kumar Halwasiya buying 5.10 crore company shares. However, the sustained rally in PC Jeweller shares can be attributed to the company achieving debt-free status, buzz around strong Q2 2026 results, and business expansions in the pipeline.\n\nSpeaking on the immediate reason for PC Jeweller's share price rise, Anuj Gupta, a SEBI-registered market expert, said, \u201cPC Jeweller's share is rising due to the bulk deal buzz. CUPID promoter has bought more than 5 crore shares of PC Jeweller in a bulk deal on Thursday. This has created a short-term buzz about the stock.\u201d\n\nHowever, one must remember that the PC Jeweller share price has been on an uptrend for a long time. The stock has risen 30% in one month and around 70% in the last six months.\n\n\u201cPC Jeweller share price rally in 2026 can be attributed to three major reasons: debt-free status, expectations for strong Q2 results, and regular fundraises are fueling expansion buzz for the jewellery stock,\u201d said Mahesh M Ojha, VP \u2014 Research and Business Development at KC Securities.\n\nOjha said the jewellery brand has repaid all its dues to the 14 banks, and all mortgaged assets and guarantees have been released, which has gone down well with market bulls.", "source": "LiveMint Markets", "pub_date_str": "16 Oct 2026, 10:50 AM IST", "pub_date_relative": "37m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Persistent Systems shares slide 5% despite Q2 revenue re Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "16 Oct 2026, 10:48 AM IST", "pub_date_relative": "40m ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "New CAS rules decoded: What Sebi\u2019s revised framework means for stock market traders", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a New CAS rules decoded: What Sebi\u2019s revised framework means for stock market traders BSE Share Price Multi Commodity Exchange of India Share Price Indian Energy Exchange Share Price The Economic Times daily newspaper is available online now. Read Today's Paper New CAS rules decoded: What Sebi\u2019s revised framework means for stock market traders SECTIONS New CAS rules decoded: What Sebi\u2019s revised framework means for stock market traders By Veer Sharma , ETMarkets.com Last Updated: Oct 16, 2026, 10:46:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Sebi has revised the Closing Auction Session (CAS) framework after receiving more than 20,000 comments from stakeholders. The updated rules introduce a 10-minute closing auction, restore the VWAP method for F&O expiry settlement prices and clarify order transfers. Most changes will take effect on December 7, 2026.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "16 Oct 2026, 10:46 AM IST", "pub_date_relative": "42m ago", "cfa_topics": ["Equity Investments", "Derivatives", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Fed's Warsh withholds Fed rate signal, praises recent global tightening with 'no free riders'", "full_content": "BANGKOK \u2014 Federal Reserve Chairman Kevin Warsh refrained from signaling whether there will be another interest rate hike again this month, while acknowledging a \"synchronous tightening\" by central banks around the world and there's \"no free riders.\"\n\n\"I don't prejudge meetings. I don't believe in saying now what I might do at the meetings that we have in the balance of this year,\" Warsh said, reiterating his opposition to the use of forward guidance for markets that should rely on interpreting data.\n\nHe also acknowledged that stance may disappoint anyone who had hoped for a steer ahead of the central bank meeting later this month. \"It's a new chapter at the Fed [and] we're not in that business anymore. But we can go in any direction you'd like,\" he said.\n\nWarsh spoke at a fireside chat with the International Monetary Fund's managing director, Kristalina Georgieva, as part of the weeklong IMF-World Bank Annual Meetings in Bangkok on Friday.\n\nStock market indexes in Asia and Treasury yields were largely stable following the remarks.\n\nWarsh described the global picture as a common fight on prices. Central banks made their own choices under their own mandates, he said, but the result was \"a synchronous tightening in monetary policy in most places around the world,\" which means \"there's no free riders.\"\n\nHe was more expansive on artificial intelligence, which he called \"probably the most consequential change to the U.S. and the global economy in my lifetime.\"\n\nHe expressed optimism about how AI will make economies that use it well more productive and wealthier, while warning the road there may be \"very bumpy,\" and its near-term effect on jobs is still uncertain.", "source": "CNBC Top News", "pub_date_str": "16 Oct 2026, 10:37 AM IST", "pub_date_relative": "51m ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Persistent Systems share price tumbles 5% after Q2 results 2026 | What should investors do? Check target price, rating", "full_content": "Persistent Systems share price crashed over 5% in Friday's trading session after the company reported its financial results for the September quarter FY27. The stock opened at \u20b9 5,600 per share today, as compared to previous close of \u20b9 5,840 on Thursday and touched an intraday low of \u20b9 5,492 on 16 October.\n\nPersistent Systems reported a 5% year-on-year rise in consolidated profit after tax (PAT), excluding exceptional expenses, to \u20b9 495.15 crore in the second quarter of FY27 on Thursday, October 15. However, reported PAT declined 25.4% to \u20b9 351.51 crore after the company incurred an exceptional expense of \u20b9 185.34 crore related to its proposed acquisition of Nagarro.\n\nRevenue from operations increased 20.8% year-on-year in constant currency terms. In rupee terms, revenue rose 30.3% to \u20b9 4,663.9 crore, while dollar-denominated revenue grew 20% to $487.6 million.\n\nOn a sequential basis, revenue increased 8.4% in rupee terms and 7.8% in US dollar terms, marking the company's 26th consecutive quarter of revenue growth.\n\nMeanwhile, earnings per share (EPS) declined 26% to \u20b9 22.40. Earnings before interest and tax (EBIT) rose 19.5% year-on-year to \u20b9 697.72 crore, although the EBIT margin contracted to 15% from 16.3% in the corresponding quarter last year.\n\nEarnings before interest, tax, depreciation and amortisation (EBITDA) grew 26.4% year-on-year to \u20b9 864.4 crore. However, the EBITDA margin moderated to 18.5% from 19.1% in Q2 FY26.\n\nMahesh M Ojha, VP Research & Business Development at Kantilal Chhaganlal Securities, believes that Persistent Systems shares look positive from a trading perspective. Investors can consider the stock with a stop-loss at \u20b9 5,380.\n\n\u201cThe stock could move towards the target prices of \u20b9 5,825, \u20b9 5,950 and \u20b9 6,150 or higher, provided the bullish momentum sustains. Traders should maintain strict stop-loss discipline and monitor price action before taking positions,\u201d Ojha said.", "source": "LiveMint Markets", "pub_date_str": "16 Oct 2026, 10:32 AM IST", "pub_date_relative": "55m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Karur Vysya Bank shares jump 6% to hit a 52-week high after Q2 results - Should you buy? Rationale, target price", "full_content": "Karur Vysya Bank shares rose almost 6% in the morning deal on the BSE on Friday, 16 October, to hit their 52-week high, a day after the company reported its September quarter (Q2FY27) results.\n\nKarur Vysya Bank share price opened at \u20b9 353.90 against its previous close of \u20b9 345.50 and jumped 5.9% to its 52-week high of \u20b9 365.85.\n\nKarur Vysya Bank on 15 October reported a 40.91% year-on-year (YoY) rise in its net profit to \u20b9 1,543 crore for Q2FY27. Deposits increased by 15.96% YoY and 4.52% QoQ, while advances jumped 20.35% YoY and 6.60% QoQ. The bank's net interest margin (NIM) increased by 28 bps YoY to 4.34%.\n\nBrokerage firm Systematix Shares and Stocks (India) has maintained a buy call on the stock with a target price of \u20b9 410, underscoring strong asset quality , stable NIM, healthy growth in advances, and improvement in profitability.\n\n\"Karur Vysya Bank (KVB) reported Q2FY27 PAT 3.3% above our estimates. NIM remained stable QoQ, supported by an 8bps QoQ improvement in yield on advances. Asset quality improved, with GNPA declining by 5bps QoQ to 0.7% and NNPA declining by 1bp QoQ to 0.2%, while the annualised slippage ratio stood at 0.45%. Operating profit grew by 14% YoY,\" Systematix noted.\n\n\"Management expects NIMs to remain above 4% over the next two quarters, supported by the transmission of the 25bps repo rate hike, while acknowledging potential pricing pressure and rising funding costs. Management reiterated its FY27 guidance of 18\u201320% advances growth and RoA above 2%, while targeting a cost-to-income ratio below 45% over the next two quarters,\" Systematix said.\n\nBrokerage firm Emkay Global Financial Services has raised its earnings estimates by 2-11%, expecting ROA to remain at nearly 2% over FY27-29E.", "source": "LiveMint Markets", "pub_date_str": "16 Oct 2026, 10:32 AM IST", "pub_date_relative": "56m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Global hedge funds suffer steep losses as AI trade unwinds, Asia funds hit hardest", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks 2 profit jumps 37% YoY", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Karur Vysya Bank shares rally 6% after Q2 profit jumps 37% YoY Karur Vysya Bank Share Price RBL Bank Share Price YES Bank Share Price Bandhan Bank Share Price City Union Bank Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Karur Vysya Bank shares rally 6% after Q2 profit jumps 37% YoY SECTIONS Karur Vysya Bank shares rally 6% after Q2 profit jumps 37% YoY By Ritesh Presswala , ETMarkets.com Last Updated: Oct 16, 2026, 10:30:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Karur Vysya Bank shares rose sharply after the private sector lender reported a 37% year-on-year rise in Q2FY27 net profit to Rs 788 crore. Net interest income grew 19% to Rs 1,497.3 crore, while total business increased nearly 18% to Rs 2.40 lakh crore.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "16 Oct 2026, 10:30 AM IST", "pub_date_relative": "58m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "The IPO drought is driving private equity-owned companies to the debt market to pay investors", "full_content": "Private equity funds are increasingly pushing their portfolio companies to take on more debt to return cash to their investors, data suggests.\n\nIt comes as the typical ways of monetizing private equity investments \u2014 selling company stakes via IPOs, or offloading them to other PE funds or buyers \u2014 have dried up in recent years.\n\nWhile investors get paid, the practice of private equity sponsors adding more debt to companies \u2014 known as dividend recapitalizations \u2014 risks weakening their ability to invest or weather future downturns in trading.\n\n\"Dividend recap\" activity has surged since 2022, and Moody's Ratings expects it to remain high in Europe, the Middle East and Africa as private equity firms look for ways to return money to investors while company sales and IPOs remain subdued.\n\nThe ratings agency estimates that private equity-owned companies in the EMEA region could take on a further 41 billion euros ($46 billion) in debt before reaching leverage levels that typically prompt a downgrade.\n\nNew Moody's analysis indicates the practice remains limited to the strongest-performing companies with the greatest capacity to take on new debt, indicating this \"significant releveraging capacity\" could support a further ramp-up in dividend recaps.\n\nStill, it does not address the exit backlog weighing over private equity, where funds are now having to hold onto companies for much longer than the typical period of around five to six years.\n\n\"The fundamental problem is that exits are few and far between \u2013 the European IPO markets have been muted, and the capital that would generally fund strategic purchases by large corporates has become a lot more expensive after the last rate hike cycle,\" said Moody's analyst Mayank Mallik. \" te Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "IDBI Bank shares crashed after Fairfax deal; should you buy this to reap profits later? Will they rise? Experts' views", "full_content": "IDBI Bank-Fairfax Stake Sale | IDBI Bank share price target: Shares of IDBI Bank witnessed a sharp sell-off on Thursday after the announcement of the Government of India (GoI) and LIC offloading their shareholding in IDBI Bank to Prem Watsa-famed Fairfax. In this IDBI Bank's stake sale, the Indian Union Cabinet approved the sale of a 60.72% stake in IDBI Bank to Fairfax Financial Holdings for \u20b9 52,878 crore, valuing the IDBI Bank shares at \u20b9 81 apiece. However, the banking stock saw some value buying during the Opening Bell. IDBI Bank's share price today opened at \u20b9 83.70 per share, edging higher against the previous day's close of \u20b9 83.45 per share, and touched an intraday high of \u20b9 84.10 per share. However, the stock failed to sustain at higher levels and came under the profit-booking pressure, sparking debate over whether the Hyderabad-born Canadian investor and CEO of Fairax will be a lucky charm for the bank and its shareholders.\n\nAccording to stock market experts, the GoI's divestment plan may transform IDBI Bank from a traditional lender into a diversified financial services company offering banking, insurance, wealth management and investment banking. However, they maintained that such a transformation doesn't happen overnight and it takes time. So, long-term investors may take advantage of this crash in IDBI Bank shares and begin accumulating them in a calibrated manner.\n\nHighlighting the reason for IDBI Bank's share price slide, Avinash Gorakshkar, Founder of Avinash Mentor Research, said, \"The IDBI Bank stake sale is aimed at meeting the SEBI guidelines and its FY27 divestment target of \u20b9 80,000 crore. However, it doesn't mean they will offload their entire stake. They would remain there, along with the expertise of Prem Watsa, the CEO of Fairfax. However, this will take time and the recent crash should be seen as a panic sale.", "source": "LiveMint Markets", "pub_date_str": "16 Oct 2026, 09:53 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Wipro shares rise 5%, up 15% so far in October - Should you buy this IT stock after Q2 results? Experts suggest", "full_content": "Wipro shares climbed almost 5% in morning trade on the BSE on Friday, 16 October, a day after the company reported its September quarter (Q2FY26) results. Wipro share price opened at \u20b9 170.35 against its previous close of \u20b9 173.70 and jumped 4.72% to hit an intraday high of \u20b9 181.90. At this price, the stock has gained 15%.\n\nWipro's Q2FY27 net profit declined 1.9% year-on-year (YoY) to \u20b9 3,200 crore, while revenue from operations was \u20b9 24,752.7 crore, up 9% from \u20b9 22,697.3 crore in the year-ago quarter.\n\nRevenue from the IT services segment was \u20b9 24,667 crore, up 1% YoY.\n\nWipro said it expects revenue from the IT services business segment to be in the range of USD 2,571 million to USD 2,625 million in Q3 FY27, translating to a sequential guidance of (-)1.5 per cent to (+)0.5 per cent in constant currency terms.\n\nBrokerage firm Choice Equity Broking has a \"reduce\" view on the stock with a target price of \u20b9 160, citing Wipro\u2019s Q2FY27 performance remained subdued, with management guiding for Q3FY27 growth of -1.5% to +0.5% QoQ in CC, reflecting seasonal furloughs and fewer working days.\n\nAccording to Choice Broking, delayed deal signing is expected to provide a revenue tailwind into Q3 and Q4, while the demand environment remains largely unchanged.\n\n\"Clients are increasingly prioritising AI-led productivity and efficiency, creating opportunities for higher-value transformation. Wipro is scaling up investments across AI data centres, AI foundry services, physical AI, AI devices and design-to-manufacturing, broadening its position across the AI value chain,\" Choice Broking noted.\n\n\"We see improving deal conversion and monetisation of AI investments as key catalysts for a gradual growth recovery, though execution and margin delivery remain critical given near-term investment intensity. At 12 times average FY28 and 29 EPS, we arrive at a target price of \u20b9 160 and assign \u2018reduce\u2019, implying limited valuation re-rating until growth momentum improves,\" said Choice.", "source": "LiveMint Markets", "pub_date_str": "16 Oct 2026, 09:52 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Global Market: Yuan holds steady, set for third weekly gain on robust Chinese exports", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Global Market: Yuan holds steady, set for third weekly gain on robust Chinese exports Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market: Yuan holds steady, set for third weekly gain on robust Chinese exports SECTIONS Global Market: Yuan holds steady, set for third weekly gain on robust Chinese exports By Anupam Nagar , ETMarkets.com Last Updated: Oct 16, 2026, 09:50:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis China\u2019s yuan remained stable against the dollar, heading for a third consecutive weekly gain on resilient exports. The currency reached its strongest level since January 2023, despite domestic econo vestors shaking off the latest sell-off in technology stocks.\n\nFutures tied to the broad market average traded 0.16% higher, while Nasdaq-100 futures gained 0.14%. Futures linked to the Dow Jones Industrial Average gained 81 points.\n\nIn Asia, Japan's Nikkei 225 added 1.90% while the Topix rose 1.87% on Friday. The Kospi advanced 4.07%, and the small-cap Kosdaq gained 5.33%. Australia's benchmark S&P/ASX 200 was 1.12% higher. Hong Kong's Hang Seng index rose 1.21%, while mainland China's CSI 300 was 0.75% higher.\n\nThe three major U.S. averages finished Thursday's session in the green as investors rotated out of key tech names and into other parts of the market. The S&P 500 finished up roughly 0.3%, while the Nasdaq Composite lagged, inching up only about 0.1%. Both snapped a three-day losing streak. The Dow was the leader among the three, jumping more than 500 points, or around 1.1%.\n\nA slide in stocks related to the artificial intelligence trade, especially those in the memory chip space, has weighed on the market this week amid jitters about competition from China . Micron Technology , which finished higher Thursday, is on pace for a decline of more than 9% on the week. Others like Seagate Technology and Western Digital are also pacing for a losing week.\n\nInvestors have also grown concerned that tech companies are borrowing too much for the AI buildout. Neocloud stocks like CoreWeave , which also recovered Thursday from a steep drop in the prior session , is heading for a 15% on the week.\n\nFurther, Anthropic has told investors that its third-quarter revenue is $16.8 billion . The disclosure comes as traders fixate on growth in the AI space and whether it's strong enough to back up the recent gains in chipmakers.", "source": "CNBC Top News", "pub_date_str": "16 Oct 2026, 09:48 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Derivatives", "Portfolio Management", "Ethical & Professional Standard
