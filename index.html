organic sales growth of 42.2%, supported by volume growth of 31.8% and price growth of 7.9%. However, revenue from operations declined 47.3% sequentially from \u20b9 879.8 crore in Q1 FY27, when it had reported a net profit of \u20b9 50.7 crore.\n\nDespite the quarterly loss, EBITDA before exceptional items remained positive at \u20b9 27.2 crore, with a margin of 6%. Gross margin improved 282 basis points year-on-year to 46.4%, supported by a favourable product mix, productivity measures and disciplined pricing, despite higher input costs associated with the transition of its in-home portfolio to dairy-based products.\n\nThe company said the quarter marked its highest organic sales growth in the last 16 quarters, with volumes contributing the largest share.", "source": "LiveMint Markets", "pub_date_str": "13 Nov 2026, 12:53 PM IST", "pub_date_relative": "49m ago", "cfa_topics": ["Financial Statement Analysis", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "SpiceJet Share Price Hits 5% Upper Circuit After Fundraising Plan Announcement. Flies 13% In Three Sessions", "full_content": "The company proposes to raise funds by way of issuance of equity shares, preference shares, debt securities and/or other permissible instruments, through preferential issue, qualified institutions placement or any other mode.", "source": "NDTV Profit", "pub_date_str": "13 Nov 2026, 12:52 PM IST", "pub_date_relative": "50m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Isabel Schnabel: Made in Europe", "full_content": "We are living through a period of radical transformation. Technological progress is accelerating alongside profound geopolitical shifts, rewriting the rules that have governed global growth, trade and security for decades. [ 1 ]\n\nIn this polarised world, Europe is often portrayed as a continent in decline, squeezed between geopolitical rivals, held back by excessive regulation and struggling to keep pace with rapid technological change.\n\nIn my remarks this morning, I will argue that although this narrative is appealing in its simplicity, it is misleading.\n\nBy many measures, Europe is among the regions with the highest quality of life, grounded in strong institutions, a high degree of social protection and an exceptional capacity to adapt in times of crisis.\n\nEurope can build on these fundamentals to become even stronger.\n\nI will explain that the key is to unlock the full potential of the Single Market \u2013 one of Europe\u2019s most powerful assets \u2013 to deliver what Europe lacks today: not talent, not ideas, not research \u2013 but scale.\n\nBy giving firms seamless access to the entire European market, it would provide the scale needed to convert innovation into economic growth. It would allow Europe to compete as one economy rather than 27, and help create something Europe has long been missing: a true \u201cMade in Europe\u201d brand.\n\nEurope stands out globally for its quality of life, built on strong economic, social and institutional foundations.", "source": "ECB Press", "pub_date_str": "13 Nov 2026, 12:50 PM IST", "pub_date_relative": "52m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Why Singapore keeps turning up in the fight over Nvidia chips and China", "full_content": "Singapore, a hub for billions of dollars' worth of Nvidia sales each year, finds itself increasingly in the crosshairs of Washington's push to stop advanced AI chips from reaching China, as the chipmaker CEO's scandal once again thrusts the city-state into the spotlight.\n\nThe Southeast Asian nation said Thursday that it had barred Alice Huang, the businesswoman at the center of a scandal that catalyzed the end of Jensen Huang's run as Nvidia CEO, from re-entering the country.\n\nA fifth person was handed 41 charges on Friday in a Singapore fraud case involving computer servers that might have contained Nvidia chips and were exported to Malaysia. The alleged transactions in the broader case totaled about $390 million, prosecutors said March last year.\n\nThe investigations into several companies and key officials, including Megaspeed International, began in February 2025 and remained ongoing as of Thursday.\n\nAuthorities have been examining whether servers exported through Singapore to Malaysia without entering the domestic market were subsequently rerouted to another destination, contrary to declarations made in Singapore, the Ministry of Home Affairs said in a statement late Thursday.\n\nSingapore has faced growing international scrutiny, particularly from the U.S., over its role as a major billing and potential transit hub for Nvidia chips that U.S. officials say have reached China.\n\nThe U.S. has imposed export restrictions on Nvidia's most cutting-edge AI chips to China since 2022 to curb Beijing's surging AI development.\n\nNvidia's revenue linked to Singapore rose to 22% in the fiscal quarter ending July 2025, up from 8% in 2023, with the country's trade ministry estimating chips physically delivered there accounted for less than 1% of the chipmaker's revenue.", "source": "CNBC World Economy", "pub_date_str": "13 Nov 2026, 12:45 PM IST", "pub_date_relative": "57m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Gold Price Jumps By Rs 1,300, But Rate Still Below Rs 1,37,000 On MCX", "full_content": "Gold prices rebounded as bargain hunting and technical buying supported bullion after a nearly 3% decline in international prices in the previous session.", "source": "NDTV Profit", "pub_date_str": "13 Nov 2026, 12:31 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "After IPO listing, NSE shares hit \u20b92,000 mark for the first time - Buy, sell or hold? What stock market experts say", "full_content": "NSE share price: Extending the uptrend during the early morning session on Friday, NSE shares crossed the psychological \u20b9 2000 mark and hit a new peak of \u20b9 2007.60 per share on the BSE. While hitting this new peak, the NSE shares crossed the \u20b9 2000 mark for the first time after the IPO listing. By 11:50 AM, the NSE share price was trading around \u20b9 1,988 per share, up over 21% from the 52-week low of \u20b9 1,640.25 per share. This 52-week low was made after the selling pressure witnessed in the NSE shares after listing of the NSE IPO in September 2026.\n\nAccording to stock market experts, NSE shares have been on an uptrend after hitting the 52-week low of \u20b9 1640.25 per share. They said that NSE share price has crossed the psychological \u20b9 2000 for the first time post-IPO listing. So, it would be important to see whether it closes above the net weighted average price of \u20b9 1995, or below this level.\n\nCalling NSE shares as a hedge against volatility, Avinash Gorakshkar, Founder of Avinash Mentor Research, said, \u201cNSE is a market leader in cash equities, index F&O, stock F&O, and clearing & settlement. Around 60% of its operating revenue comes from the F&O derivative trading, which is almost unchallenged with BSE being the nearest rival with a long gap. So, NSE is expected to continue its uptrend as it reported a strong Q2 Results 2026. Its subsidiary NSE Clearing reported a total income of \u20b9 1,152 crore (up 16% YoY) and a PAT of \u20b9 597 crore in H1 FY27.\u201d\n\nJefferies India is also bullish on NSE shares. The global investment bank expects a fast growth in the NSE's revenue. Jefferies India believes the NSE's operating revenue CAGR was 6% between FY24-26, as its equity F&O business was adversely impacted by regulatory changes and higher taxes. We think these are now largely in the base.", "source": "LiveMint Markets", "pub_date_str": "13 Nov 2026, 12:24 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Tesla-SpaceX Merger: Musk eyes December deal announcement", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News Powered By Tesla-SpaceX Merger: Musk eyes December deal announcement Written by Anupam Nagar , ETMarkets.com | Nov 13, 2026, 12:44:25 PM IST 1 / 5 Tesla-SpaceX Merger Could Be Announced In December Elon Musk's Tesla and SpaceX are reportedly making progress on merger discussions, with an announcement possible as early as December. The proposed combination could become one of the largest corporate transactions in history. The announcement could coincide with Tesla's December 3 annual shareholder meeting, although the timeline could extend into early 2027. (Sources: TradingView, Investors.com)\n\nNegotiations have reportedly advanced to discussions over deal structure, valuation and governance arrangements. Boards and advisers from both companies are involved in the process, with independent director committees established to evaluate a potential combination. However, no final agreement has been reached, and there is no guarantee that a deal will materialise.\n\nA merger could bring together SpaceX's estimated $1.9 trillion valuation and Tesla's market capitalisation of approximately $1.6 trillion. The combination would bring Musk's major businesses under one corporate structure and could rank among the largest mergers ever. The share-exchange ratio and ownership allocation between investors remain key issues in the negotiations.\n\nThe proposed merger could combine Tesla's electric vehicle and robotics operations with SpaceX's aerospace and satellite businesses. Both companies have overlapping ambitions in artificial intelligence and advanced computing, creating potential opportunities in AI software, chip design, robotics and SpaceX's Starlink satellite network.", "source": "Economic Times Markets", "pub_date_str": "13 Nov 2026, 12:23 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Leh road trip turns into nightmare for Royal Enfield owner after bike loses power: How he won \u20b91 lakh in consumer court?", "full_content": "A motorcycle breakdown during a high-altitude road trip can quickly turn an adventure into a nightmare, particularly when the vehicle develops trouble despite being serviced before the journey. A Royal Enfield owner's experience on a Leh trip eventually turned into a consumer dispute over the service provided before his ride.\n\nThe South Delhi District Consumer Disputes Redressal Commission has directed Eicher Motors and Noida-based Shree Mahadev Motors to jointly pay \u20b9 1 lakh to the motorcycle owner over the incident. The commission passed its order on 4 November 2026.\n\nRoyal Enfield is a motorcycle brand owned by Eicher Motors , which manufactures and markets its motorcycles in India and international markets. Here's what happened and how the bike owner won the case.\n\nThe complainant, Hasan Murtaza, purchased a Royal Enfield Interceptor 650 from Ess Aar Motors on 13 April 2019. Before travelling to Leh in September 2021, he took the motorcycle to Shree Mahadev Motors in June 2021 for servicing.\n\nMurtaza informed the centre about his planned high-altitude journey and requested an electronic control unit (ECU) update to address reported power-loss issues at high altitudes. He alleged that the service centre assured him that the update had been installed and the motorcycle was ready for the trip.\n\nHowever, during the journey, the motorcycle reportedly lost power at an altitude of around 15,912 feet. Murtaza claimed that he had to drag the approximately 200 kg motorcycle downhill to get it started again. The problem continued during the ride to Leh, where he arrived on 21 September 2021.\n\nHe took the motorcycle to an authorised Royal Enfield service centre the following day. He was informed that the ECU update had not been carried out and that the workshop did not have the necessary equipment to perform it.\n\nConcerned about the motorcycle's condition, Murtaza left it at a hotel in Leh before eventually returning to collect it.", "source": "LiveMint Money", "pub_date_str": "13 Nov 2026, 12:23 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Zee Entertainment buyback: What happened with ZEEL stock after \u20b9600 cr announcement? Check record date, price", "full_content": "Pranati Deva Published 13 Nov 2026, 12:20 PM IST Prefer Livemint on Google Zee Entertainment Enterprises has announced a \u20b9 600 crore share buyback, offering shareholders an opportunity to tender their shares at \u20b9 91 apiece. The company's board approved the proposal on November 12, 2026, for the buyback of up to 6.59 crore fully paid-up equity shares with a face value of \u20b9 1 each.\n\nThe media stock fell over 3% on Friday, Nov 13, to its day's low of \u20b9 75.49 per share on BSE post the announcement of the buyback. The stock has lost 3% in 1 month, 26% in 3 months, 19% in 6 months and 28% in last 1 year.\n\nThe proposed buyback will be conducted through the tender offer route on a proportionate basis, with November 25, 2026, fixed as the record date to determine eligible shareholders.\n\nThe company said the move followed a detailed assessment of its financial position, free cash flow, business outlook and shareholder expectations. Here are the key things investors should know about the proposed Zee Entertainment buyback.\n\nZee Entertainment's board has approved a buyback of up to 6,59,34,065 fully paid-up equity shares, representing up to 6.86% of the company's existing paid-up equity share capital. The total buyback amount has been capped at \u20b9 600 crore.\n\nThe buyback size represents 7.22% and 6.61% of the aggregate paid-up equity share capital and free reserves, based on the company's latest standalone and consolidated audited financial statements, respectively, as of March 31, 2026.\n\nThe company has fixed the buyback price at \u20b9 91 per equity share, payable in cash. The offer will be made to shareholders and beneficial owners whose names appear on the company's records as of the record date.\n\nThe board has also authorised the possibility of revising the buyback price upwards and reducing the number of shares proposed to be bought back, provided the overall buyback size remains unchanged. Such a revision can be made up to one working day before the record date.", "source": "LiveMint Markets", "pub_date_str": "13 Nov 2026, 12:20 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Why Page Industries\u2019 optimism needs a reality check", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nPage Industries Ltd. is aiming high. Despite achieving 5.6% volume growth in the first half of FY27 (H1FY27), it is targeting double-digit growth for the full year. The company expects sales to accelerate in H2, driven by festive demand and new launches across key categories. The management said its newly launched Disney and Marvel collections have received an encouraging response from consumers.\n\nPage Industries manufactures, markets and distributes apparel brands such as Jockey and Speedo.\n\n\u201cAchieving the full-year double-digit volume growth guidance now requires around 14% volume growth in H2FY27, making the recovery fairly demanding,\u201d said Systematix Shares and Stocks (India).\n\nPage Industries\u2019 optimism on volume growth is yet to reflect in its earnings performance. In the June quarter (Q1FY27), Page lost 3-4 billing days due to the implementation of its auto replenishment system, with a corresponding benefit expected in Q2. But that did not play out. While volumes grew in double digits in July and August, September sales were muted. The festive shift to Q3 deferred primary volumes, while product availability challenges in select categories led to lower fulfilment rates.\n\nPage acknowledged supply-side constraints, with order fulfilment declining from its historical 98-99% levels to 96-97% in Q2. This led to an estimated 3-4% loss in primary orders, particularly in men\u2019s innerwear and women\u2019s outerwear. Volumes grew 5.5% in Q2, while revenue rose 11.5% year-on-year, aided by price hikes and premiumization.\n\nRaw material inflation pulled gross margin down 272 basis points (bps) year-on-year to 57.2%. The pressure was partially offset by a 2.5% price hike. Inflationary pressures have persisted, with the benefit of low-cost inventory exhausted in Q1.", "source": "LiveMint Markets", "pub_date_str": "13 Nov 2026, 12:07 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Anthropic IPO how to apply from India: Can Indian investors apply online? Check eligibility and step by step bid guide", "full_content": "Anthropic IPO: Anthropic, the AI firm behind the Claude chatbot, is gearing up for its stock market debut, giving investors an opportunity to gain exposure to the rapidly expanding generative AI sector.\n\nAnthropic has set its IPO price range at $70 to $78 per share for an offering of 825 million shares of Class A common stock on the Nasdaq under the ticker symbol \"ANT\".\n\nFor Indian investors, the proposed listing raises several questions, including whether they are eligible to subscribe to the IPO, how they can buy Anthropic shares and the tax implications of investing in overseas stocks.\n\nWith Anthropic targeting a valuation of up to $1.4 trillion and planning to raise as much as $64.4 billion, the offering could become one of the largest IPOs in stock market history. However, Indian investors may face an important limitation: India is not included in the list of countries covered under Anthropic's proposed international retail IPO programme.\n\nAccording to the list of international retail brokers and selling agents shared by Anthropic on its Claude Help Centre, the proposed retail IPO offering will be available across Australia, Canada, Japan, the UK, Switzerland and nine European countries, including Denmark, Finland, France, Germany, Ireland, the Netherlands, Norway, Spain and Sweden. India, however, is not included in the list of eligible markets.\n\nAnthropic has also clarified that it has not authorised any other firm or platform to promote or facilitate access to shares under its international retail offering.", "source": "LiveMint Markets", "pub_date_str": "13 Nov 2026, 11:57 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "NSEIX Global Access Expands Investment Opportunities Across European Markets", "full_content": "A key part of the expansion is access to UCITS ETFs, which are investment funds listed and traded on stock exchanges and follow the European regulatory framework.", "source": "NDTV Profit", "pub_date_str": "13 Nov 2026, 11:50 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Contact SpiceJet Directly: Delhi Airport Issues Advisory As Airline's Flights May Get Impacted", "full_content": "SpiceJet cancelled four flights from Dubai airport on Thursday, after DNATA halted check-in services, according to an email exchange reviewed by NDTV Profit.", "source": "NDTV Profit", "pub_date_str": "13 Nov 2026, 11:50 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Bank of Baroda hikes 555-day FD rates: How much will \u20b91 lakh, \u20b92 lakh and \u20b95 lakh earn?", "full_content": "Bank of Baroda (BoB) has raised interest rates on its special 555-day fixed deposit (FD) scheme by 10 basis points (bps), effective 12 November 2026. Under the BoB Golden Goal Deposit Scheme , resident super senior citizens investing in non-callable deposits can now earn up to 7.50% per annum.\n\nGeneral customers, including NRO and NRE account holders, will earn 6.85% on callable deposits and 6.90% on non-callable deposits. Senior citizens can earn up to 7.40%, and super senior citizens aged 80 and above can earn up to 7.50%.\n\nThe revised rates apply to retail term deposits below \u20b9 3 crore. For general customers, the callable FD rate has gone up from 6.75% to 6.85%.\n\nBelow is how the change could affect interest earnings for different deposit amounts over 555 days.\n\nNote: These are illustrative estimates based on quarterly compounding over 555 days. Actual returns may vary depending on the bank's calculation methodology, applicable deposit terms and other conditions. Refer to Bank of Baroda's official website for the latest interest rates, detailed terms and conditions, and maturity amount calculations.\n\nCustomers can open the special FD through the BoB World mobile banking app, internet banking or the nearest branch. New customers can also book an FD online on the bank\u2019s website without first opening a savings account .\n\nBefore investing, check the latest rates, payout options, eligibility criteria and premature withdrawal conditions on the bank\u2019s official website.\n\nA 10 bps hike improves returns only marginally, so compare FD options and weigh your liquidity needs before locking in your money for 555 days.", "source": "LiveMint Money", "pub_date_str": "13 Nov 2026, 11:49 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Quantitative Methods", "Financial Statement Analysis", "Fixed Income", "Derivatives"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "Bitcoin Price Slide Below $70,000 As Inflation Concerns Hurt Crypto", "full_content": "Bitcoin's weakness reflects a convergence of macro pressures on crypto in recent weeks. Elevated oil prices and high inflation have reinforced expectations for further Federal Reserve rate increases.", "source": "NDTV Profit", "pub_date_str": "13 Nov 2026, 11:41 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Nvidia on track for longest weekly losing streak since 2012 as market value sinks by $1.6 trillion", "full_content": "Nvidia investors turned bearish before this week's Jensen Huang saga. But the selling on Wall Street accelerated in the past few days, sending the stock toward its sixth straight weekly drop, the longest losing streak since 2012.\n\nThe chip giant, which spent most of the year as the world's most valuable company, has lost 29% of its value over that stretch as of Thursday's close. That's a drop of roughly $1.6 trillion in market cap, and it fell below Apple in the process.\n\nHuang, who co-founded Nvidia and led it for 33 years, resigned on Thursday after two separate extramarital affairs \u2014 one with an alleged Chinese spy and the other with an employee \u2014 were made public. The board named finance chief Colette Kress as interim CEO while it conducts a search for a full-time successor.\n\nNvidia shares fell 4.3% on Thursday, bringing their loss for the week to 11%. News of the first reported affair hit the front pages over the weekend, when Huang sent a letter to employees apologizing for being \"unfaithful to my wife.\" The board convened late Wednesday after The New York Times reported on the other affair , this one with the company's vice president of health care.\n\nBy early Thursday morning, Huang was out, capping a stunning fall for the Nvidia co-founder, who had emerged as one of President Donald Trump's top allies in the corporate world.\n\n\"With the unfortunate departure of CEO Jensen Huang we expect a challenging transition for NVIDIA over the next few months,\" Gil Luria, an analyst at D.A. Davidson, wrote in a report on Thursday. Luria lowered his price target to $200 from $300, but maintained his buy rating. \"We believe the market has appropriately adjusted for this transition,\" he wrote.\n\nLast week, prior to Huang's departure, Nvidia shares dropped about 9%.", "source": "CNBC World Economy", "pub_date_str": "13 Nov 2026, 11:21 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "TD Power Systems share price soars over 9%: Dividend declared, Q2 profit more than doubles - Should you buy?", "full_cont  in FY27, keeping the Reserve Bank of India (RBI) open to another interest rate hike despite expectations of gradual moderation in overall price pressures, according to a report by Nuvama Institutional Equities.", "source": "Economic Times Economy", "pub_date_str": "13 Nov 2026, 09:05 AM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}], "updated_at": "13 Nov 2026, 01:42 PM IST", "total_stories": 302};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
