y services business, with a growing focus on preventive healthcare, consumer wellness and technology-led health solutions.", "source": "LiveMint Markets", "pub_date_str": "23 Nov 2026, 02:41 PM IST", "pub_date_relative": "5m ago"}, {"title": "Why is Newron Pharmaceuticals stock rallying today?", "full_content": "", "source": "Investing.com News", "pub_date_str": "23 Nov 2026, 02:32 PM IST", "pub_date_relative": "14m ago"}, {"title": "Who is killing Nifty 50 rally? SBI, RIL, HDFC Bank, Axis Bank, Hindalco, JSW among stocks dragging index into red", "full_content": "HDFCBANK ICICIBANK SBIN JSWSTEEL Sharmila Bhadoria Updated 23 Nov 2026, 02:43 PM IST Prefer Livemint on Google Nifty 50 and Sensex witnessed steep decline during Monday\u2019s intraday trading session after witnessing spectacular rally over the past five trading sessions. Tata Steel , HDFC Bank , Axis Bank, Hindalco, ICICI Bank , State Bank of India , etc were among the top stocks which dragged the index in red.\n\nThe Nifty 50 opened higher on Monday, but failed to hold on to gains. The benchmark index extended its losses over the next five hours. The 50-stock benchmark failed to hold the crucial 25,500 mark and slipped below this level. Meanwhile, the BSE Sensex declined 1.50% to 82,751.33.\n\nThe sharp correction was driven by weakness in metal, banking and finance, and some FMCG stocks.\n\nTata Steel emerged as the top laggard. The metal stock was trading 8.75% lower at \u20b9 162.69 per share on NSE at 2:20 pm on Monday. Hindalco share price was trading 2.85% lower at \u20b9 903.05 per share. JSW Steel was another metal stock witnessing bearish momentum during the trade. The metal stock was down 1.77% at \u20b9 1311.60 per share.\n\nNifty Metal was down 3.56% today. The weakness in the metal stock coincided with sharp correction in precious metals and base metals prices over the past few days. Gold, silver, copper, aluminium, zinc, and platinum are currently trading near their multi-month low levels.\n\nApart from metal stocks, bank stocks also weighed on the index. Shares of Axis Bank were trading 3.08% lower at \u20b9 1,401.50 per share. ICICI Bank stock was down 2.82% at \u20b9 1,593.60 per share. Shares of HDFC Bank were trading 2.80% lower at \u20b9 822.30 per share.\n\nBank Nifty was down nearly 2.13%, as part of some correction after touching to fresh all-time high levels in the previous trading session.\n\nNifty 50 index was trading 1.34% lower at 25,452.05 points, whereas Sensex was down 1.38% lower at 82,751.33 points.", "source": "LiveMint Markets", "pub_date_str": "23 Nov 2026, 02:31 PM IST", "pub_date_relative": "15m ago"}, {"title": "Piper Sandler upgrades MiniMed Group stock rating on product outlook", "full_content": "", "source": "Investing.com News", "pub_date_str": "23 Nov 2026, 02:30 PM IST", "pub_date_relative": "15m ago"}, {"title": "Piper Sandler cuts Insulet stock rating on competitive pressures", "full_content": "", "source": "Investing.com News", "pub_date_str": "23 Nov 2026, 02:30 PM IST", "pub_date_relative": "15m ago"}, {"title": "Big Step In India-Nepal Diplomatic Ties: PM Modi, Balendra Shah Virtually Flag-Off Ayodhya-Janakpur Dham Train", "full_content": "The new railway service is expected to strengthen religious tourism, cross-border connectivity and people-to-people ties between India and Nepal.", "source": "NDTV Profit", "pub_date_str": "23 Nov 2026, 02:30 PM IST", "pub_date_relative": "16m ago"}, {"title": "ABB to acquire Germany\u2019s Ziehl-Abegg for $2.65 billion", "full_content": "", "source": "Investing.com News", "pub_date_str": "23 Nov 2026, 02:30 PM IST", "pub_date_relative": "16m ago"}, {"title": "Suzlon Energy Cyber Attack: Wind Turbine Maker Reports Incident, Sees No Critical Impact", "full_content": "Suzlon reported a cyber incident but said critical applications were unaffected, while Persistent Systems flagged a possible breach of employee immigration data at a US-based law firm it engaged.", "source": "NDTV Profit", "pub_date_str": "23 Nov 2026, 02:30 PM IST", "pub_date_relative": "16m ago"}, {"title": "Nasdaq 100 futures rebound sharply to rise 3%, kick-starting shortened week after tech rout: Live updates", "full_content": "U.S. equity futures bounced on Monday, as a shortened week on Wall Street got underway after all three major averages ended Friday in correction territory .\n\nFutures tied to the Dow Jones Industrial Average gained 774 points, or 1.61%. S&P 500 futures added 2.37%, and Nasdaq-100 futures rose 3.14%.\n\nAcross the Atlantic, European markets moved higher in morning trade. The pan-European Stoxx 600 started Monday 0.44% higher. Germany's DAX gained 0.47%, with the French CAC 40 rising 0.42%. The U.K.'s FTSE 100 was up 0.34%.\n\nIn Asia, markets closed mostly lower Monday, as the sell-off in the region's tech names extended from last week.\n\nSouth Korea's Kospi fell 3.31% to 4,708.54, while Australia's S&P/ASX 200 dropped 0.26%, declining for an eighth straight session, to end at 8,570.6.\n\nHong Kong's Hang Seng Index was down 0.15% in its final hour of trade, while mainland China's CSI 300 ended flat at 3,958.29.\n\nLast week, major indexes tumbled as worries about the artificial intelligence trade continued to spook investors, despite Anthropic's record debut on Thursday.\n\nBy the end of the rout last week \u2014 which was the worst weekly decline for the Nasdaq Composite and Dow in more than six years, and the largest for the S&P 500 since April 2025 \u2014 all three of the major averages were in correction territory, and the Nasdaq turned negative for the year.", "source": "CNBC Top News", "pub_date_str": "23 Nov 2026, 02:26 PM IST", "pub_date_relative": "19m ago"}, {"title": "Australian bank NAB apologises after staff learn of layoffs early through automated email", "full_content": "", "source": "Investing.com News", "pub_date_str": "23 Nov 2026, 02:25 PM IST", "pub_date_relative": "21m ago"}, {"title": "Bayer shares slip despite Roundup settlement approval", "full_content": "", "source": "Investing.com News", "pub_date_str": "23 Nov 2026, 02:24 PM IST", "pub_date_relative": "21m ago"}, {"title": "Why is Abivax stock surging today?", "full_content": "", "source": "Investing.com News", "pub_date_str": "23 Nov 2026, 02:24 PM IST", "pub_date_relative": "22m ago"}, {"title": "ZE PAK stock surges 30% as Argumenol raises tender offer price", "full_content": "", "source": "Investing.com News", "pub_date_str": "23 Nov 2026, 02:22 PM IST", "pub_date_relative": "23m ago"}, {"title": "Why is Julius Baer stock sliding today?", "full_content": "", "source": "Investing.com News", "pub_date_str": "23 Nov 2026, 02:22 PM IST", "pub_date_relative": "24m ago"}, {"title": "Up 115% in 6 months! Small-cap chemical stock under \u20b9200 jumps 11% despite stock market crash; reason for rise, target", "full_content": "Vaamanaa Sethi Published 23 Nov 2026, 02:21 PM IST Prefer Livemint on Google Small-cap stock under \u20b9 200 : Chemical stock Shalimar Paints jumped over 11% in Monday's trading session despite stock market crash. The small-cap stock opened at \u20b9 107 apiece today, as compared to previous close of \u20b9 97.42 on Friday last week and touched an intraday high of \u20b9 116.80.\n\nMeanwhile, Indian benchmark indices Sensex and Nifty opened on a positive note but soon slipped into the red during early trading on Monday, weighed down by a sharp decline in global markets and profit booking following a two-session rally. The 30-share BSE Sensex fell 243.95 points to 83,675.76 in early deals, while the NSE Nifty 50 declined 110.10 points to 25,672.00.\n\nIn an exchange filing dated 21 November, Shalimar Paints outlined how the company will be transformed into an integrated building-materials platform on completion of the proposed merger of its promoter, Infra.Market, with the company.\n\nThe merger remains subject to the requisite approvals, including from the stock exchanges, SEBI, the National Company Law Tribunal and illion, according to the company's investor presentation .\n\nThe Blue Lagoon traces its origins to 1992, when Blue Lagoon Ltd. was founded to study the water in the Blue Lagoon, an open-air pool of warm, milky-blue water set in a black lava field in southwestern Iceland. It grew into a business spanning a spa, hotels and skincare made with ingredients from the lagoon.\n\nShares will trade under the ticker \"BLUE\" on one of Europe's smallest stock exchanges, Nasdaq Iceland Main Market, part of the Nasdaq Nordic group, which also operates exchanges in Sweden, Denmark and Finland.\n\n\"Wellness is the new luxury, and we know that the wellness economy is growing faster than the economy as a whole, so we have tailwind from that,\" CEO Sigr\u00ed\u00f0ur Margr\u00e9t Oddsd\u00f3ttir told CNBC on Thursday.\n\n\"Now is the right time for us to list,\" she added. \"We are a company that thinks long-term, we have a clear vision for the next decade, and being publicly listed gives investors the opportunity to participate in our journey.\"\n\nThe company's operations are centered on Iceland's Reykjanes Peninsula, where, as well as the Blue Lagoon geothermal spa, it runs the Silica Hotel, the Retreat luxury hotel and spa, and the Michelin-starred Moss restaurant.\n\nIt also operates the Kerlingarfj\u00f6ll Highland Base and Hrauneyjar properties in Iceland's highlands, and sells Blue Lagoon-branded skincare products internationally.", "source": "CNBC Top News", "pub_date_str": "23 Nov 2026, 02:18 PM IST", "pub_date_relative": "27m ago"}, {"title": "Motorola Edge 70 Neo India Launch: What We Know About Price, Feature, Battery, Camera And Other Details", "full_content": "The smartphone packs a 50MP Sony LYTIA 710 OIS main camera, a 2MP macro lens, a light sensor, and a 32MP selfie camera. It supports 4K video, Night Vision, Portrait Mode, and Google Photos AI tools like Magic Eraser and Magic Editor.", "source": "NDTV Profit", "pub_date_str": "23 Nov 2026, 02:15 PM IST", "pub_da hed, So Why Did Gold Fall 9%? The Margin Call Nobody Saw Coming", "full_content": "Gold was supposed to be the hedge when the AI trade cracked. Instead, it had its worst week in eight months as investors sold what they could to cover losses elsewhere.", "source": "NDTV Profit", "pub_date_str": "23 Nov 2026, 02:05 PM IST", "pub_date_relative": "40m ago"}, {"title": "Leadership As Mission: Why The Age Of AI Demands More Human Leadership", "full_content": "Debjani Ghosh examines how AI is changing leadership, arguing that its success must be measured by its impact on people and the accountability of those guiding its use.", "source": "NDTV Profit", "pub_date_str": "23 Nov 2026, 02:05 PM IST", "pub_date_relative": "40m ago"}, {"title": "Wall Street set to rebound after AI stock sell-off", "full_content": "Asian markets decline as South Korean chipmakers shed about 3%", "source": "FT Markets", "pub_date_str": "23 Nov 2026, 02:02 PM IST", "pub_date_relative": "43m ago"}, {"title": "TCS vs Infosys vs Wipro shares: Despite global AI bloodbath, why are Indian IT stocks rising? Experts decode", "full_content": "WIPRO TCS Asit Manohar Published 23 Nov 2026, 01:59 PM IST Prefer Livemint on Google TCS vs Infosys vs Wipro shares: Amid heavy selling in AI stocks in global markets and the tech-heavy Nasdaq 100 Index recording its worst week since 2020 last week, Indian IT stocks have continued to rise. Indian IT majors, Tata Consultancy Services (TCS), Infosys, Wipro, HCL Technologies, Tech Mahindra, etc., have seen strong buying in the last fortnight. TCS share price today is up by over 3%; Infosys shares also went up around 3% but failed to sustain at higher levels; Wipro shares are trading green after rising up to 2% against Friday's close\n\nAccording to stock market experts, Indian IT stocks are rising despite the global AI bloodbath because capital is rotating out of capital-intensive AI builders and into traditional software and services firms. They said that Indian IT firms do not own expensive chips or data centres. Investors view them as insulated from AI capex blowups.\n\nOn the reasons that are fueling the Indian IT shares, Avinash Gorakshkar, Founder of Avinash Mentor Research, said, \u201cAfter steep corrections earlier in 2026\u2014triggered by fears that AI agents would automate outsourcing\u2014large-cap Indian IT stocks fell into oversold territory. Trading at roughly 14x\u201317x trailing P/E with strong free cash flows, buybacks, and around 2.7%\u20134.6% dividend yields, they have become defensive value plays.\u201d\n\nOn reasons for Indian IT majors remaining insulated from the global AI bloodbath, Anuj Gupta, a SEBI-registered market expert, said, \u201cUnlike hyperscalers, Indian IT firms do not own expensive chips or data centers. Investors view them as insulated from AI capex blowups: if AI adoption slows, enterprises still need traditional engineers; if AI scales rapidly, enterprises still need IT integrators to deploy it into legacy systems.\u201d\n\nThe SEBI-registered market expert said that investors are selling off U.S.", "source": "LiveMint Markets", "pub_date_str": "23 Nov 2026, 01:59 PM IST", "pub_date_relative": "46m ago"}, {"title": "Thomas Cook share price surges 15%, extends three-session rally to 19% | More upside ahead? Key levels to watch", "full_content": "Thomas Cook India shares extended their sharp upward run on Monday, 23 November, surging nearly 15% in intraday trade as buying interest gathered pace in the stock. The latest rally takes its gains to almost 19% over three trading sessions, with the stock continuing to attract attention after a series of business expansion announcements and strong operating performance in the September quarter.\n\nThe buying momentum has been particularly strong in recent sessions. Thomas Cook shares have advanced in 13 of the past 16 trading sessions, signalling sustained investor interest rather than a one-day spike.\n\nTrading activity also witnessed a sharp jump. Nearly 3 crore shares changed hands on the exchanges, compared with an average weekly trading volume of around 16 lakh shares and a monthly average of approximately 13 lakh shares. This indicates a significant increase in market participation as the stock rallied.\n\nThe latest surge has added to the stock's recent outperformance. Thomas Cook shares have gained 15.6% over one week, 26.92% over two weeks and 45.16% over one month.\n\nThe stock has also advanced 13.85% over three months and 39.75% over six months. However, it remains down 13.93% so far in 2026.\n\nOne of the recent developments in the company's hospitality business is the expansion of its Nature Trails resort portfolio. The company has added its seventh Nature Trails resort, with the latest property located near Goa in Dodamarg.\n\nThe new resort strengthens its presence in Maharashtra, where Nature Trails now has four properties. The expansion is part of Thomas Cook's broader push to grow its experiential hospitality portfolio and tap demand for nature-led holidays and leisure travel.\n\nThe company has also been expanding its travel retail footprint. In Uttar Pradesh, Thomas Cook opened its first outlet in Gorakhpur, taking its presence in the state to 12 locations.", "source": "LiveMint Markets", "pub_date_str": "23 Nov 2026, 01:55 PM IST", "pub_date_relative": "50m ago"}, {"title": "Drink And Drive Crash: Former Gokul Director's Son Runs Over Two At Midnight", "full_content": "Two youths were killed after a speeding vehicle hit their two-wheeler on Shahu Toll Naka road in Kolhapur.", "source": "NDTV Profit", "pub_date_str": "23 Nov 2026, 01:51 PM IST", "pub_date_relative": "55m ago"}, {"title": "Stock Market Today: Sensex Crashes 1,200 Points, Nifty 50 Below 25,500 As Banks, Metals Drag; Tata Steel Top Loser", "full_content": "Barring Nifty IT, all other sectoral indices were trading in the red. NiftyMetal was the top loser with nearly 4% fall. Nifty PSU Bank, Nifty Auto, Nifty Realty, Nifty Pharma and Nifty Oil & Gas were among other sectoral losers.", "source": "NDTV Profit", "pub_date_str": "23 Nov 2026, 01:47 PM IST", "pub_date_relative": "59m ago"}, {"title": "Pune-Ahmednagar Highway Accident: Three Young Men Killed, Two Injured As Speeding Car Crashes", "full_content": "Wagholi police have registered the incident and initiated further legal proceedings and have launched an investigation.", "source": "NDTV Profit", "pub_date_str": "23 Nov 2026, 01:46 PM IST", "pub_date_relative": "59m ago"}, {"title": "DA hike: Tripura increases dearness allowance by 3% to 44% of basic salary; CM says component enhanced by 36% since 2022", "full_content": "DA hike: Tripura enhanced dearness allowance and dearness relief (DR) for state government employees and pensioners by 3% in October, to 44% of basic salary \u2014 an increase of 8% this year and 36% since 2022, according to Chief Minister Manik Saha.\n\nThe Tripura Cabinet announced a second hike in DA and DR, and increased the House Rent Allowance ( HRA ) for government employees to 10% of basic pay, subject to a ceiling of \u20b9 10,000 per month, with effect from 1 October 2026, according to a report by India Today.\n\nThe hike will put an additional annual burden of about \u20b9 300 crore on the state exchequer, Saha added.\n\nNotably, this came after the state declared a 5% DA and DR increase for government employees, effective from 1 April, at an additional \u20b9 500 crore annually, Saha said. He also added that 1,02,563 state government employees and 81,019 pensioners will benefit from the increase.\n\n\u201cWe are continuously trying to increase the DA for the employees to narrow the gap with their central government counterparts,\u201d he stated, as per a PTI report. This is in reference to the Centre providing 60% DA to central government employees as of last month and 58% prior to that.\n\nAddressing a BJP programme in Agartala on Sunday, 22 November, ahead of the civic polls scheduled for Friday, 27 November, Saha stated that his government has increased DA by 36 percentage points since July 2022 \u2014 from 8% to 44% to narrow the gap between state and central government counterparts, PTI reported.\n\n\u201cNo government in the Northeast has increased DA by 36% in such a short period. It shows the present government's efforts to reduce the gap between state employees and central government staff. If we don't reduce the DA gap, the state as a whole will be a loser, since it receives funds to pay its employees and pensioners. A total of \u20b9 100 crore is needed to release 1% DA/ DR,\u201d he said.\n\nRegarding the revision of their pay during the tenure of the 8th Pay Commission, he said the state is committed.", "source": "LiveMint Money", "pub_date_str": "23 Nov 2026, 01:45 PM IST", "pub_date_relative": "1h ago"}, {"title": "When a winning trade makes investors take bigger risks", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nThere is something particularly seductive about making money quickly. Consider this: an investor buys a stock and makes 20% in two days. The investor buys another stock and makes another gain. The next time, perhaps they will be willing to put a larger sum into a similar opportunity.\n\nThis is how behaviour gets reinforced. The brain\u2019s reward system encourages us to repeat actions associated with positive outcomes. Pavlov\u2019s famous experiment illustrates this beautifully: after repeatedly ringing a bell just before feeding his dogs, he found that the dogs eventually salivated at the sound of the bell alone. The bell had become a signal of an expected reward.\n\nIn markets, a profitable investment can similarly encourage investors to repeat the behaviour that produced the returns.\n\nIPOs offer a clear example. A Sebi study of 144 mainboard IPOs listed between April 2021 and December 2023 found that when an IPO delivered a return of more than 20%, individual investors sold 67.6% of their shares by value within a week. This suggests that many investors treat IPOs as opportunities for relatively quick rewards.\n\nThere is nothing inherently wrong with booking a listing gain. The question is what follows. A successful IPO can become more than a profitable investment. It can become a learning experience: the investor learns that this type of trade can produce quick rewards. Expecting similar outcomes, participating in the next IPO may then become easier to justify.\n\nThis behaviour can extend beyond IPOs. Defence, for example, became one of India's most prominent investment themes after the Nifty India Defence Index more than doubled in nine months before peaking in July 2024. Investors expected such returns to continue, and several fund houses capitalised on these expectations by offering a slew of defence-focused products.\n\nA similar pattern was seen in gold.", "source": "LiveMint Money", "pub_date_str": "23 Nov 2026, 01:44 PM IST", "pub_date_relative": "1h ago"}, {"title": "Crash proof stocks: Sensex, Nifty bleed but these shares come out in flying green colour - HCL, TCS, Infy, Maruti - List", "full_content": "SHRIRAMFIN TECHM Sharmila Bhadoria Published 23 Nov 2026, 01:40 PM IST Prefer Livemint on Google Stock market crash: Nifty 50 failed to hold to the crucial 25,500 level during Monday\u2019s trading session after seeing strong upside over the past few trading sessions. Meanwhile, BSE Sensex, was down 1.25% to 82,866 during the intraday trading session.\n\nWhile bears tightened their grip on Dalal Street, several stocks defied the stock market crash and continued to rally on Monday. Stocks across the information and technology (IT), pharmaceutical, and hospital segment remained resilient.\n\nTata Consultancy Services (TCS), Tech Mahindra , and HCLTech were among the top IT stocks which registered up to 3% gains during Monday\u2019s trading session. Shriram Finance , Max Health, Maruti, Apollo Hospital, Infosys, Eicher Motors , ITC, Titan, Adani Ports were trading in green at 1:15 pm on Monday, November 23.\n\nTCS share price was trading 3.43% higher at \u20b9 2,457.80 per share on NSE with a market capitalisation. Tech Mahindra share price was trading 2.81% higher at \u20b9 1,795.20 per share. Whereas, HCL Tech stock was trading 1.03% higher at \u20b9 1,358.90 apiece. Shares of Infosys were up 0.64% at \u20b9 1,105.10 per share.\n\nUnfazed by the weakness in the Indian stock market, bulls continue to drive a rally in hospital stocks. Holding on to their previous trading sessions\u2019 gains, Apollo Hospital shares were trading 0.74% higher at \u20b9 9,268.00 per share. Shares of Max Health were up 1.48% at \u20b9 1,097.00 per share. Shares of Shriram Finance were up 1.94% at \u20b9 990.45 per share.\n\nNifty 50 was down 1.37% at 25,446.40 points, whereas Sensex was trading 1172 points lower at 82,747 points. Tata Steel, Axis Bank, Hindalco, HDFC Bank, JSW Steel, ICICI Bank, Kotak Mahindra Bank , were among the top laggards. Only 12 Nifty 50 stocks advanced, while 38 declined during Monday's trading session.\n\nBank Nifty was down nearly 2.33% after touching all-time high level in the previous trading session.", "source": "LiveMint Markets", "pub_date_str": "23 Nov 2026, 01:40 PM IST", "pub_date_relative": "1h ago"}, {"title": "HFCL 160% up in 2026 vs Sterlite Technologies up 476%; but both crashed today - Experts suggest which one to buy", "full_content": "HFCL Vaamanaa Sethi Published 23 Nov 2026, 01:35 PM IST Prefer Livemint on Google HFCL vs Sterlite Technologies: Shares of telecom equipment and optical fibre cable manufacturers HFCL and Sterlite Technologies witnessed a sharp sell-off on Monday, despite delivering significant gains in 2026. While HFCL shares have surged nearly 160% so far this year, Sterlite Technologies (STL) has outperformed with a massive rally of around 476% during the same period.\n\nOn Monday, both HFCL and Sterlite Technologies shares fell 5%, hitting the lower circuit limit, amid weak market sentiment on Dalal Street.\n\nAccording to market experts, both companies have benefited from rising global demand for optical fibre cables, increased investment in telecom infrastructure, and growing demand for high-speed connectivity to support artificial intelligence (AI) and hyperscale data centres. Their strong Q2 FY27 earnings and sizeable order books have further strengthened their growth outlook.\n\nHFCL reported a strong performance in the September quarter, with consolidated revenue rising 143.6% year-on-year (YoY) to \u20b9 2,541.79 crore. EBITDA increased 223.6% to \u20b9 658 crore, while net profit surged 448% to \u20b9 394.22 crore. Its EBITDA margin expanded to 25.89%, reflecting improved operating performance.\n\nThe company's order book stood at approximately \u20b9 28,911 crore, providing strong revenue visibility. Management expects revenue growth of at least 80% in FY27 compared with FY26. HFCL is also investing around \u20b9 1,800 crore in expanding its optical fibre, cable and preform manufacturing capacities.\n\nAdding to its growth visibility, the company secured fresh export orders worth \u20b9 834 crore in November, strengthening its international business prospects.\n\nSterlite Technologies reported record revenue of \u20b9 2,529 crore in Q2 FY27, registering growth of approximately 145% year-on-year.", "source": "LiveMint Markets", "pub_date_str": "23 Nov 2026, 01:35 PM IST", "pub_date_relative": "1h ago"}, {"title": "Trump to host private dinner for largest owners of his meme coin - Al Jazeera", "full_content": "Trump to host private dinner for largest owners of his meme coin Al Jazeera Trump Rewards Top Owners of His Declining Coin With Exclusive Dinner WSJ Trump Says U.S. Must Beat China In Crypto At Meme Coin Dinner As His Token Hovers Near Record Low Forbes Trump hosts third crypto gala for meme coin amid conflict of interest outcry The Guardian Trump hosts gala for meme coin investors as his token plunges to record lows Reuters", "source": "Google News Business", "pub_date_str": "23 Nov 2026, 01:33 PM IST", "pub_date_relative": "1h ago"}, {"title": "South Africa vs Bangladesh 2nd Test Live Streaming: When And Where To Watch SA vs BAN Match In India", "full_content": "South Africa face Bangladesh in the second Test from November 23. Check the match time, venue and live streaming details in India.", "source": "NDTV Profit", "pub_date_str": "23 Nov 2026, 01:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "Mediation Fails In Kalyani Family's Rs 1 Lakh Crore Inheritance Dispute: SC Told", "full_content": "A bench comprising Chief Justice Surya Kant and Justices Joymalya Bagchi and V Mohana asked the parties to explore appointment of a sole arbitrator to adjudicate all disputes.", "source": "NDTV Profit", "pub_date_str": "23 Nov 2026, 01:26 PM IST", "pub_date_relative": "1h ago"}, {"title": "Shubman Gill Explains Why India Settled For Draw Against New Zealand With 15 Overs Left", "full_content": "Gill is now hoping for a more bowler-friendly surface in Christchurch, where the second Test begins on November 27.", "source": "NDTV Profit", "pub_date_str": "23 Nov 2026, 01:26 PM IST", "pub_date_relative": "1h ago"}, {"title": "EPFO may enable PF withdrawals via UPI by December-end: What subscribers should know", "full_content": "EPFO is in the final stages of introducing UPI-based provident fund withdrawals, with the facility expected to go live by December-end, The Financial Express reported. The soon-to-be launched feature will allow EPF subscribers to access eligible PF money through the BHIM app, check their withdrawable balance and see the minimum amount that must remain in their retirement account.\n\nAs per the report, UPI withdrawal, which is one of the highly anticipated features, is in the final stages of rollout. All trials have been completed, and the glitches encountered during trials have been fixed, the report says.\n\nThe UPI withdrawal facility is part of EPFO's broader technology upgrade, EPFO 3.0, which is reportedly set to roll out in February 2027, when the Central Board of Trustees next meets.\n\nThe UPI withdrawal facility will be linked to a member's Universal Account Number (UAN) and UPI account. This feature is expected to work only for bank accounts that are verified and linked with an EPFO account.\n\nReportedly, subscribers will be allowed to withdraw 75% of their EPF money; however, no official limit has been announced yet. It may be recalled that the retirement fund body, in its board meeting on 19 November, approved a proposal to reduce the mandatory minimum balance in PF accounts from 25% to 10%. This move may also increase the partial withdrawal limit from 75% to 90% of their eligible balance.\n\nThe retirement fund body's partial withdrawal facility allows members to draw from their PF savings to meet specific needs during their working years. EPFO has consolidated 13 provisions governing partial withdrawals into three categories: Essential Needs, Housing Needs and Special Circumstances.\n\nAs of now, the EPFO allows up to 10 withdrawals for education and 5 for marriage. This frequency has been raised from 3 withdrawals for both purposes earlier.", "source": "LiveMint Money", "pub_date_str": "23 Nov 2026, 01:25 PM IST", "pub_date_relative": "1h ago"}, {"title": "Keralam Girl Kidney Damage Case: What We Know So Far As Case Registered Against Skin Cream Producer", "full_content": "An FIR has been filed against a cream producer for selling an adulterated product containing toxic mercury. A teenager suffered kidney damage after using it, costing \u20b91 lakh in treatment. Police are investigating under the BNS and Drugs Act.", "source": "NDTV Profit", "pub_date_str": "23 Nov 2026, 01:10 PM IST", "pub_date_relative": "1h ago"}, {"title": "From monthly payouts to easier withdrawals: what EPFO\u2019s changes mean", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nThe 240th meeting of the Employees\u2019 Provident Fund Organisation\u2019s (EPFO) Central Board of Trustees (CBT), held on 19 November 2026, approved several changes, including systematic withdrawals for retiring members, easier premature withdrawal rules and direct voluntary contributions.\n\nWhat do these decisions mean for existing EPF subscribers? Who stands to benefit, when will the revised rules take effect, and what should members keep in mind before dipping into their retirement savings? We explain the key announcements and their implications.\n\nThe board has approved a proposal to introduce a systematic withdrawal plan ( SWP ) for retiring EPF members. Instead of withdrawing their entire accumulated corpus at once, members will be able to receive their savings in periodic instalments, such as monthly, quarterly or half-yearly payments.\n\nThe remaining balance will continue to earn interest, allowing members to supplement their pension income during retirement.\n\n\u201cEPF has been built in a way that it first accumulates funds and pays out at once. A lumpsum at 58 is exposed to poor investment choices, mis-selling and family pressure. SWP will allow members to withdraw gradually, offering a safeguard,\u201d said Kunal Arora, advocate and principal consultant, SKVC Consulting.\n\nHowever, the proposed withdrawal period and the treatment of the remaining corpus need greater clarity.\n\n\u201cThere are reports that say the withdrawal window will be 20 years. Retiring at 58, the corpus runs out at about 78, exactly when health costs rise. Members need a longer tenure, an interest-only option or an undrawn reserve. Some reports claim that an interest-only option will be given. We have to wait and watch for the final notification,\u201d Arora said.", "source": "LiveMint Money", "pub_date_str": "23 Nov 2026, 01:08 PM IST", "pub_date_relative": "1h ago"}, {"title": "Gold price crash with 31% correction: Why investors should wait for November 25, December 4 and 9 - What\u2019s special?", "full_content": "Gold has corrected sharply from its record high earlier this year, leaving investors and jewellery buyers wondering whether the worst is over. Its next move could depend on three US economic events in the coming weeks: the October PCE inflation report on 25 November, the November jobs report on 4 December and the US Federal Reserve\u2019s policy decision on 9 December.\n\nAll three could shape the Fed\u2019s interest rate path and outlook, which in turn affects global bullion prices .\n\nGold has fallen about 31.7% from its January record of \u20b9 1.83 lakh per 10 grams. On 23 November, 99.9% pure gold traded at \u20b9 1,25,030 per 10 grams in New Delhi, a minor recovery after seven straight sessions of losses.\n\nA stronger US dollar, rising Treasury yields and expectations of further Fed rate hikes have weighed on gold and the wider bullion market. Gold pays no interest, unlike bank fixed deposits and similar investments, so higher interest rates generally reduce its appeal.\n\nWith these core fundamentals in mind, here are the three dates investors should watch over the next few weeks.\n\nThe October Personal Consumption Expenditures (PCE) inflation report is scheduled for release on Wednesday, 25 November. This will provide investors with clear clues about the underlying US price pressure. Core PCE inflation will be a key focus for top investors worldwide. This metric excludes food and energy prices and provides real insights. It is released by the US Bureau of Economic Analysis (BEA).\n\nThen next will be the November employment report, which will be released on Friday, 4 December. This is yet another critical report that will indicate whether the US labour market continues to hold and stays resilient.", "source": "LiveMint Money", "pub_date_str": "23 Nov 2026, 01:00 PM IST", "pub_date_relative": "1h ago"}, {"title": "Bought Gold On Akshaya Tritiya? Here's How Much You Lost After Rs 10 Lakh Investment", "full_content": "Gold price has declined nearly Rs 31,000, or 20%, from Akshaya Tritiya levels. Silver has plunged approximately Rs 1.02 lakh, or 41%, during the same period.", "source": "NDTV Profit", "pub_date_str": "23 Nov 2026, 12:58 PM IST", "pub_date_relative": "1h ago"}, {"title": "Gold, silver prices: Rates have rebounded, but experts feel precious metals could extend losses longer term \u2014 Here's why", "full_content": "Gold prices today: The yellow metal rebounded from its biggest weekly decline in eight months on Monday as traders sought safe haven assets amid growing concerns over artificial intelligence (AI) spending, a weaker United States Treasury yield and dollar, Bloomberg reported on 23 November.\n\nIn the international markets, bullion rose as much as 2.6% to around $3,630 an ounce, after falling 9% last week to a 14-month low, it added. Gold futures rose 2.14% to USD 3,614.25 per ounce in New York, PTI reported.\n\nMeanwhile, yellow metal futures trade on the domestic Multi Commodity Exchange ( MCX ), rose by \u20b9 2,899 to \u20b9 1,24,677 per 10 grams as speculators created fresh positions on firm spot demand, the PTI added.\n\nHowever, experts and analysts noted that gold bullion may extend losses during the week ahead as traders await US economic data, inflation data and cues on interest rate hikes from the US Federal Reserve cues, as per another PTI report.\n\nJateen Trivedi, VP Research Analyst \u2013 Commodity and Currency, LKP Securities. told PTI that the ongoing corrective trend in gold extended as profit booking intensified across international and domestic bullion markets. \u201cThe weakness was further amplified by appreciation in the rupee and a sharp decline in global gold prices. The stronger rupee has added another layer of pressure on MCX prices by reducing the landed cost of imported bullion,\u201d he felt.\n\nNotably, PMI readings from across major economies, US GDP data, housing data, durable goods orders and inflation numbers will impact expectations from the Fed and thus long outlook for the precious metals remains weak, it added.\n\n\u201cThe outlook for gold and silver remains weak, and the downward trajectory is likely to persist.", "source": "LiveMint Money", "pub_date_str": "23 Nov 2026, 12:57 PM IST", "pub_date_relative": "1h ago"}, {"title": "Investors gives a thumbs down to Tata Steel-APL Apollo $1.67 billion deal, plunging shares", "full_content": "Tata Steel , one of the world's leading steel producers, on Monday said it will buy a 26.4% stake in India's largest structural steel pipe and tube maker, APL Apollo , for 155.1 billion rupees ($1.67 billion).\n\nThe acquisition will boost Tata Steel's downstream integration to around 53% from 35%, the company said in a stock exchange filing. That will lead to more value addition, improved product mix, and greater exposure to higher-margin downstream segments, it said.\n\nInvestors reacted negatively to the deal, with shares of Tata Steel sliding over 9% on Monday, while APL Apollo's stock crashed more than 19% .\n\nWhile the deal is likely to be positive in the long term, the complex structure and lack of clarity have rattled investors, Deven Choksey, founder and managing director of wealth management firm DRChoksey FinServ, told CNBC.\n\nAs per Tata Steel, before acquiring APL Apollo, it will sell its steel tubes business and Tata Steel Colors to APL Apollo for 280 billion rupees. \"APL Apollo will initially fund the acquisition through a mix of acquisition financing and subsequently replace the debt with long-term capitalization,\" Tata Steel said.\n\n\"The deal is appearing very complex,\" said Choksey, adding that minority investors have not been given any clarity or taken into consideration while signing this deal.\n\nTata Steel will hold an investor call, post-market hours on Monday.\n\nAPL Apollo said after the deal it plans to more than double the downstream capacity to 15.5 million tons from the current 7.5 million tons, making it a leading global downstream steel firm.", "source": "CNBC Top News", "pub_date_str": "23 Nov 2026, 12:55 PM IST", "pub_date_relative": "1h ago"}, {"title": "Brigade Enterprises moves a step closer to FY27 pre-sales target with new launch", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nRealty company Brigade Enterprises has had a dull first half of FY27 (H1FY27) with sales volumes down 28% year-on-year. Pre-sales fell 8% year-on-year to \u20b9 2,888 crore in H1 versus FY27 target of \u20b9 9,000 crore. But visibility is improving as new launches accelerate. Last week, Brigade unveiled the first phase of Brigade Autograph in Whitefield, East Bengaluru\u2014a premium integrated residential development project of about 40 acres.\n\nChannel checks by PL Capital indicated a strong response to this launch and potential to contribute \u20b9 2,000-2,500 crore to Q3FY27 pre-sales. \u201cThis provides healthy visibility on achieving the balance H2FY27 pre-sales target of \u20b9 6,100 crore, supported by the upcoming launch pipeline across North Bengaluru (~0.6msf), Chennai (~1msf) and Hyderabad (~1msf) in H2FY27,\u201d added the PL report.\n\nBrigade sees new launches and sales in existing projects supporting pre-sales ahead. For H2FY27, Brigade has planned 7 msf launches worth \u20b9 7,600 crore gross development value or revenue potential across Bengaluru, Hyderabad, Chennai, and Mysore.\n\nThe management maintains residential demand has not been impacted by repo rate hike or by IT-sector job cuts, as GCC hiring continues to absorb talent. Its Bengaluru launches are largely in \u20b9 1\u20131.5 crore ticket range, with the rest around \u20b9 2 crore and nearly 20% of projects, at \u20b9 3 crore. Nuvama Research expects Brigade\u2019s likely pivot towards the mid-income segment in its upcoming launches to address soft volumes/sales velocity.\n\nHowever, interest rates are likely to rise further, making home loans dearer, so its impact on the mid-income segment should be tracked. Brigade\u2019s investments in business development/acquiring land bank acquisitions augur well for long-term growth, but its elevated debt amid rising interest rates can be a concern.\n\nNet debt rose sequentially at Q2FY27-end to \u20b9 2,088 from \u20b9 1,541 crore.", "source": "LiveMint Markets", "pub_date_str": "23 Nov 2026, 12:48 PM IST", "pub_date_relative": "1h ago"}, {"title": "India bonds give up marginal opening gains as profit booking takes over", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Bonds \u203a India bonds give up marginal opening gains as profit booking takes over Powered By The Economic Times daily newspaper is available online now. Read Today's Paper India bonds give up marginal opening gains as profit booking takes over SECTIONS India bonds give up marginal opening gains as profit booking takes over Reuters Last Updated: Nov 23, 2026, 12:46:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Indian government bonds fell after initial gains due to profit booking by traders and a sharp rupee decline. The benchmark yield of the 6.94% 2036 bond increased to 7.2185% during trading hours. Last week, the yield had dropped significantly due to lower US Treasury yields and a stronger rupee. Investors now focus on the upcoming Reserve Bank of India's policy decision on December 4.\n\nIndian government bonds fell after initial gains due to profit booking by traders and a sharp rupee decline. The benchmark yield of the 6.94% 2036 bond increased to 7.2185% during trading hours. Last week, the yield had dropped significantly due to lower US Treasury yields and a stronger rupee. Investors now focus on the upcoming Reserve Bank of India's policy decision on December 4.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "23 Nov 2026, 12:46 PM IST", "pub_date_relative": "1h ago"}, {"title": "Fund managers look to raise gold, silver exposure as price correction revives interest", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nMumbai: Some Indian fund managers are returning to gold and silver in their multi-asset funds, after trimming exposure in recent months, as a correction in prices and shifting expectations on US interest rates revive the case for precious metals.\n\nAxis Mutual Fund has started adding to its gold and silver holdings and plans to increase allocations gradually. DSP Mutual Fund has begun reducing its underweight position in precious metals, while SBI Mutual Fund is also finding the two metals more attractive.\n\nThe renewed interest follows a steep sell-off. MCX spot gold has fallen 41% from its 29 January peak to \u20b9 123,805 per 10 grams as of 20 November, while silver has dropped 59% to \u20b9 152,674 per kg. The declines have erased a large part of the gains from the metals' sharp rally in recent years, making valuations more appealing. At the same time, fears that a slowdown driven by the artificial intelligence (AI) trade could push the Federal Reserve to pause its rate-tightening cycle have bolstered the outlook for both metals\n\n\u201cUntil three weeks ago, the expectation was that the US Federal Reserve (Fed) would deliver at least two more rate hikes. However, concerns about a possible slowdown driven by artificial intelligence (AI) could prompt the Fed to pause after one more hike and focus more on growth than inflation,\u201d said Dinesh Balachandran, head of investments at SBI Mutual Fund.\n\n\u201cSuch a shift would strengthen the case for precious metals, as gold and silver tend to benefit when central banks prioritise growth over inflation.", "source": "LiveMint Markets", "pub_date_str": "23 Nov 2026, 12:40 PM IST", "pub_date_relative": "2h ago"}], "cfa": [{"title": "Up 32% in one month! Small-cap stock under \u20b950 hits 5% upper circuit despite weak trends on Dalal Street; do you have?", "full_content": "TAKE Limited shares remained in focus on Monday, 23 November, after the small-cap stock hit its 5% upper circuit, defying the weak trend across Dalal Street. The stock has gained nearly 32% over the past month, extending its recent recovery even as it remains sharply lower over a longer period.\n\nTAKE shares have risen by 12.27% over the past week and 10.79% over the pasttwo weeks. On a monthly basis, the stock is up 31.47%. However, the recent rally has not fully reversed its longer-term losses: the shares are down 31.60% over three months, 50.82% in six months and 64.35% so far in 2026.\n\nThe stock's recent momentum has also caught the attention of technical analysts, with improving price action and momentum indicators pointing to the possibility of further gains. However, its relatively low liquidity and tendency to move in circuits warrant caution.\n\nTAKE share price today opened at an intraday low of \u20b9 13.69 per share, and an intraday high of \u20b9 14.38 apiece.\n\nRajesh Bhosale, Technical Analyst at My Advisor Alpha, said TAKE has seen strong traction over the past three trading sessions and has closed decisively above its 50-day exponential moving average (50-DEMA) for the first time in several months.\n\nHe also noted that the stock's daily Relative Strength Index (RSI) has crossed above 60 for the first time in a prolonged period, indicating improved momentum. Based on these technical signals, Bhosale believes the stock could extend its upward move towards \u20b9 16.50.\n\nHowever, he cautioned that TAKE is a relatively illiquid counter and tends to witness circuit-to-circuit movements. Investors should therefore avoid taking aggressive positions in the stock, he said.\n\nThe recent rally comes amid TAKE Limited's efforts to expand beyond its traditional technology services business, with a growing focus on preventive healthcare, consumer wellness and technology-led health solutions.", "source": "LiveMint Markets", "pub_date_str": "23 Nov 2026, 02:41 PM IST", "pub_date_relative": "5m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Who is killing Nifty 50 rally? SBI, RIL, HDFC Bank, Axis Bank, Hindalco, JSW among stocks dragging index into red", "full_content": "HDFCBANK ICICIBANK SBIN JSWSTEEL Sharmila Bhadoria Updated 23 Nov 2026, 02:43 PM IST Prefer Livemint on Google Nifty 50 and Sensex witnessed steep decline during Monday\u2019s intraday trading session after witnessing spectacular rally over the past five trading sessions. Tata Steel , HDFC Bank , Axis Bank, Hindalco, ICICI Bank , State Bank of India , etc were among the top stocks which dragged the index in red.\n\nThe Nifty 50 opened higher on Monday, but failed to hold on to gains. The benchmark index extended its losses over the next five hours. The 50-stock benchmark failed to hold the crucial 25,500 mark and slipped below this level. Meanwhile, the BSE Sensex declined 1.50% to 82,751.33.\n\nThe sharp correction was driven by weakness in metal, banking and finance, and some FMCG stocks.\n\nTata Steel emerged as the top laggard. The metal stock was trading 8.75% lower at \u20b9 162.69 per share on NSE at 2:20 pm on Monday. Hindalco share price was trading 2.85% lower at \u20b9 903.05 per share. JSW Steel was another metal stock witnessing bearish momentum during the trade. The metal stock was down 1.77% at \u20b9 1311.60 per share.\n\nNifty Metal was down 3.56% today. The weakness in the metal stock coincided with sharp correction in precious metals and base metals prices over the past few days. Gold, silver, copper, aluminium, zinc, and platinum are currently trading near their multi-month low levels.\n\nApart from metal stocks, bank stocks also weighed on the index. Shares of Axis Bank were trading 3.08% lower at \u20b9 1,401.50 per share. ICICI Bank stock was down 2.82% at \u20b9 1,593.60 per share. Shares of HDFC Bank were trading 2.80% lower at \u20b9 822.30 per share.\n\nBank Nifty was down nearly 2.13%, as part of some correction after touching to fresh all-time high levels in the previous trading session.\n\nNifty 50 index was trading 1.34% lower at 25,452.05 points, whereas Sensex was down 1.38% lower at 82,751.33 points.", "source": "LiveMint Markets", "pub_date_str": "23 Nov 2026, 02:31 PM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Nasdaq 100 futures rebound sharply to rise 3%, kick-starting shortened week after tech rout: Live updates", "full_content": "U.S. equity futures bounced on Monday, as a shortened week on Wall Street got underway after all three major averages ended Friday in correction territory .\n\nFutures tied to the Dow Jones Industrial Average gained 774 points, or 1.61%. S&P 500 futures added 2.37%, and Nasdaq-100 futures rose 3.14%.\n\nAcross the Atlantic, European markets moved higher in morning trade. The pan-European Stoxx 600 started Monday 0.44% higher. Germany's DAX gained 0.47%, with the French CAC 40 rising 0.42%. The U.K.'s FTSE 100 was up 0.34%.\n\nIn Asia, markets closed mostly lower Monday, as the sell-off in the region's tech names extended from last week.\n\nSouth Korea's Kospi fell 3.31% to 4,708.54, while Australia's S&P/ASX 200 dropped 0.26%, declining for an eighth straight session, to end at 8,570.6.\n\nHong Kong's Hang Seng Index was down 0.15% in its final hour of trade, while mainland China's CSI 300 ended flat at 3,958.29.\n\nLast week, major indexes tumbled as worries about the artificial intelligence trade continued to spook investors, despite Anthropic's record debut on Thursday.\n\nBy the end of the rout last week \u2014 which was the worst weekly decline for the Nasdaq Composite and Dow in more than six years, and the largest for the S&P 500 since April 2025 \u2014 all three of the major averages were in correction territory, and the Nasdaq turned negative for the year.", "source": "CNBC Top News", "pub_date_str": "23 Nov 2026, 02:26 PM IST", "pub_date_relative": "19m ago", "cfa_topics": ["Equity Investments", "Derivatives"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Up 115% in 6 months! Small-cap chemical stock under \u20b9200 jumps 11% despite stock market crash; reason for rise, target", "full_content": "Vaamanaa Sethi Published 23 Nov 2026, 02:21 PM IST Prefer Livemint on Google Small-cap stock under \u20b9 200 : Chemical stock Shalimar Paints jumped over 11% in Monday's trading session despite stock market crash. The small-cap stock opened at \u20b9 107 apiece today, as compared to previous close of \u20b9 97.42 on Friday last week and touched an intraday high of \u20b9 116.80.\n\nMeanwhile, Indian benchmark indices Sensex and Nifty opened on a positive note but soon slipped into the red during early trading on Monday, weighed down by a sharp decline in global markets and profit booking following a two-session rally. The 30-share BSE Sensex fell 243.95 points to 83,675.76 in early deals, while the NSE Nifty 50 declined 110.10 points to 25,672.00.\n\nIn an exchange filing dated 21 November, Shalimar Paints outlined how the company will be transformed into an integrated building-materials platform on completion of the proposed merger of its promoter, Infra.Market, with the company.\n\nThe merger remains subject to the requisite approvals, including from the stock exchanges, SEBI, the National Company Law Tribunal and creditors.\n\nThe merged Shalimar will operate across four segments. Structural materials, the largest, give it a place on a project from day one. Finishing and lifestyle categories, including paints, follow the same customer through to handover.\n\nUnder the proposed Scheme of Amalgamation, Infra.Market shareholders will be allotted 314 equity shares of Shalimar (face value \u20b9 2 each) for every 100 shares of Infra.Market (face value \u20b9 10 each) held on a fully diluted basis. This translates into a share swap ratio of 3.14 Shalimar shares for every one Infra.Market share.\n\nAs part of the arrangement, Infra.Market's existing stake in Shalimar will be cancelled, while Shalimar's current public shareholders will continue to retain their shareholding.", "source": "LiveMint Markets", "pub_date_str": "23 Nov 2026, 02:21 PM IST", "pub_date_relative": "25m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Derivatives", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Forget Anthropic: In Europe, the IPO hype is about a blue lagoon", "full_content": "While investors are fixated on Anthropic's blockbuster stock market debut , a very different IPO is making waves in Europe: Iceland's Blue Lagoon, the operator of one of the world's most famous geothermal spas.\n\nBlue Lagoon Corp. raised roughly 14.3 billion Icelandic kronur ($110 million) through the offering, valuing the Icelandic geothermal spa operator at about $787 million, according to the company's investor presentation .\n\nThe Blue Lagoon traces its origins to 1992, when Blue Lagoon Ltd. was founded to study the water in the Blue Lagoon, an open-air pool of warm, milky-blue water set in a black lava field in southwestern Iceland. It grew into a business spanning a spa, hotels and skincare made with ingredients from the lagoon.\n\nShares will trade under the ticker \"BLUE\" on one of Europe's smallest stock exchanges, Nasdaq Iceland Main Market, part of the Nasdaq Nordic group, which also operates exchanges in Sweden, Denmark and Finland.\n\n\"Wellness is the new luxury, and we know that the wellness economy is growing faster than the economy as a whole, so we have tailwind from that,\" CEO Sigr\u00ed\u00f0ur Margr\u00e9t Oddsd\u00f3ttir told CNBC on Thursday.\n\n\"Now is the right time for us to list,\" she added. \"We are a company that thinks long-term, we have a clear vision for the next decade, and being publicly listed gives investors the opportunity to participate in our journey.\"\n\nThe company's operations are centered on Iceland's Reykjanes Peninsula, where, as well as the Blue Lagoon geothermal spa, it runs the Silica Hotel, the Retreat luxury hotel and spa, and the Michelin-starred Moss restaurant.\n\nIt also operates the Kerlingarfj\u00f6ll Highland Base and Hrauneyjar properties in Iceland's highlands, and sells Blue Lagoon-branded skincare products internationally.", "source": "CNBC Top News", "pub_date_str": "23 Nov 2026, 02:18 PM IST", "pub_date_relative": "27m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Nvidia Is A Buy After Sharp Correction, Says Ajay Srivastava; Sees Opportunity In US AI Stocks", "full_content": "Srivastava also pointed to Nvidia's recent quarterly performance as evidence that its fundamentals remain sound. In his view, lower valuations can offer an entry point into quality businesses, even if share prices face further pressure.", "source": "NDTV Profit", "pub_date_str": "23 Nov 2026, 02:12 PM IST", "pub_date_relative": "33m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Stock-market slides this steep and fast trigger a rebound 91% of the time over the last decade", "full_content": "The big question for traders is whether the S&P 500\u2019s swift fall into a correction is the start of something much worse for the stock market or actually a harbinger of a reversal.", "source": "MarketWatch Top Stories", "pub_date_str": "23 Nov 2026, 02:07 PM IST", "pub_date_relative": "39m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Iran To Break US Naval Blockade? Tehran Says Will Use All Available Tools To Confront", "full_content": "The restrictions have left Iran's crude oil exports near a standstill for months, although some LPG and jet fuel shipments have continued.", "source": "NDTV Profit", "pub_date_str": "23 Nov 2026, 02:06 PM IST", "pub_date_relative": "40m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "US Stocks Crashed, So Why Did Gold Fall 9%? The Margin Call Nobody Saw Coming", "full_content": "Gold was supposed to be the hedge when the AI trade cracked. Instead, it had its worst week in eight months as investors sold what they could to cover losses elsewhere.", "source": "NDTV Profit", "pub_date_str": "23 Nov 2026, 02:05 PM IST", "pub_date_relative": "40m ago", "cfa_topics": ["Derivatives", "Alternative Investments"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "TCS vs Infosys vs Wipro shares: Despite global AI bloodbath, why are Indian IT stocks rising? Experts decode", "full_content": "WIPRO TCS Asit Manohar Published 23 Nov 2026, 01:59 PM IST Prefer Livemint on Google TCS vs Infosys vs Wipro shares: Amid heavy selling in AI stocks in global markets and the tech-heavy Nasdaq 100 Index recording its worst week since 2020 last week, Indian IT stocks have continued to rise. Indian IT majors, Tata Consultancy Services (TCS), Infosys, Wipro, HCL Technologies, Tech Mahindra, etc., have seen strong buying in the last fortnight. TCS share price today is up by over 3%; Infosys shares also went up around 3% but failed to sustain at higher levels; Wipro shares are trading green after rising up to 2% against Friday's close\n\nAccording to stock market experts, Indian IT stocks are rising despite the global AI bloodbath because capital is rotating out of capital-intensive AI builders and into traditional software and services firms. They said that Indian IT firms do not own expensive chips or data centres. Investors view them as insulated from AI capex blowups.\n\nOn the reasons that are fueling the Indian IT shares, Avinash Gorakshkar, Founder of Avinash Mentor Research, said, \u201cAfter steep corrections earlier in 2026\u2014triggered by fears that AI agents would automate outsourcing\u2014large-cap Indian IT stocks fell into oversold territory. Trading at roughly 14x\u201317x trailing P/E with strong free cash flows, buybacks, and around 2.7%\u20134.6% dividend yields, they have become defensive value plays.\u201d\n\nOn reasons for Indian IT majors remaining insulated from the global AI bloodbath, Anuj Gupta, a SEBI-registered market expert, said, \u201cUnlike hyperscalers, Indian IT firms do not own expensive chips or data centers. Investors view them as insulated from AI capex blowups: if AI adoption slows, enterprises still need traditional engineers; if AI scales rapidly, enterprises still need IT integrators to deploy it into legacy systems.\u201d\n\nThe SEBI-registered market expert said that investors are selling off U.S.", "source": "LiveMint Markets", "pub_date_str": "23 Nov 2026, 01:59 PM IST", "pub_date_relative": "46m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Alternative Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Thomas Cook share price surges 15%, extends three-session rally to 19% | More upside ahead? Key levels to watch", "full_content": "Thomas Cook India shares extended their sharp upward run on Monday, 23 November, surging nearly 15% in intraday trade as buying interest gathered pace in the stock. The latest rally takes its gains to almost 19% over three trading sessions, with the stock continuing to attract attention after a series of business expansion announcements and strong operating performance in the September quarter.\n\nThe buying momentum has been particularly strong in recent sessions. Thomas Cook shares have advanced in 13 of the past 16 trading sessions, signalling sustained investor interest rather than a one-day spike.\n\nTrading activity also witnessed a sharp jump. Nearly 3 crore shares changed hands on the exchanges, compared with an average weekly trading volume of around 16 lakh shares and a monthly average of approximately 13 lakh shares. This indicates a significant increase in market participation as the stock rallied.\n\nThe latest surge has added to the stock's recent outperformance. Thomas Cook shares have gained 15.6% over one week, 26.92% over two weeks and 45.16% over one month.\n\nThe stock has also advanced 13.85% over three months and 39.75% over six months. However, it remains down 13.93% so far in 2026.\n\nOne of the recent developments in the company's hospitality business is the expansion of its Nature Trails resort portfolio. The company has added its seventh Nature Trails resort, with the latest property located near Goa in Dodamarg.\n\nThe new resort strengthens its presence in Maharashtra, where Nature Trails now has four properties. The expansion is part of Thomas Cook's broader push to grow its experiential hospitality portfolio and tap demand for nature-led holidays and leisure travel.\n\nThe company has also been expanding its travel retail footprint. In Uttar Pradesh, Thomas Cook opened its first outlet in Gorakhpur, taking its presence in the state to 12 locations.", "source": "LiveMint Markets", "pub_date_str": "23 Nov 2026, 01:55 PM IST", "pub_date_relative": "50m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stock Market Today: Sensex Crashes 1,200 Points, Nifty 50 Below 25,500 As Banks, Metals Drag; Tata Steel Top Loser", "full_content": "Barring Nifty IT, all other sectoral indices were trading in the red. NiftyMetal was the top loser with nearly 4% fall. Nifty PSU Bank, Nifty Auto, Nifty Realty, Nifty Pharma and Nifty Oil & Gas were among other sectoral losers.", "source": "NDTV Profit", "pub_date_str": "23 Nov 2026, 01:47 PM IST", "pub_date_relative": "59m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Pune-Ahmednagar Highway Accident: Three Young Men Killed, Two Injured As Speeding Car Crashes", "full_content": "Wagholi police have registered the incident and initiated further legal proceedings and have launched an investigation.", "source": "NDTV Profit", "pub_date_str": "23 Nov 2026, 01:46 PM IST", "pub_date_relative": "59m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "When a winning trade makes investors take bigger risks", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nThere is something particularly seductive about making money quickly. Consider this: an investor buys a stock and makes 20% in two days. The investor buys another stock and makes another gain. The next time, perhaps they will be willing to put a larger sum into a similar opportunity.\n\nThis is how behaviour gets reinforced. The brain\u2019s reward system encourages us to repeat actions associated with positive outcomes. Pavlov\u2019s famous experiment illustrates this beautifully: after repeatedly ringing a bell just before feeding his dogs, he found that the dogs eventually salivated at the sound of the bell alone. The bell had become a signal of an expected reward.\n\nIn markets, a profitable investment can similarly encourage investors to repeat the behaviour that produced the returns.\n\nIPOs offer a clear example. A Sebi study of 144 mainboard IPOs listed between April 2021 and December 2023 found that when an IPO delivered a return of more than 20%, individual investors sold 67.6% of their shares by value within a week. This suggests that many investors treat IPOs as opportunities for relatively quick rewards.\n\nThere is nothing inherently wrong with booking a listing gain. The question is what follows. A successful IPO can become more than a profitable investment. It can become a learning experience: the investor learns that this type of trade can produce quick rewards. Expecting similar outcomes, participating in the next IPO may then become easier to justify.\n\nThis behaviour can extend beyond IPOs. Defence, for example, became one of India's most prominent investment themes after the Nifty India Defence Index more than doubled in nine months before peaking in July 2024. Investors expected such returns to continue, and several fund houses capitalised on these expectations by offering a slew of defence-focused products.\n\nA similar pattern was seen in gold.", "source": "LiveMint Money", "pub_date_str": "23 Nov 2026, 01:44 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Crash proof stocks: Sensex, Nifty bleed but these shares come out in flying green colour - HCL, TCS, Infy, Maruti - List", "full_content": "SHRIRAMFIN TECHM Sharmila Bhadoria Published 23 Nov 2026, 01:40 PM IST Prefer Livemint on Google Stock market crash: Nifty 50 failed to hold to the crucial 25,500 level during Monday\u2019s trading session after seeing strong upside over the past few trading sessions. Meanwhile, BSE Sensex, was down 1.25% to 82,866 during the intraday trading session.\n\nWhile bears tightened their grip on Dalal Street, several stocks defied the stock market crash and continued to rally on Monday. Stocks across the information and technology (IT), pharmaceutical, and hospital segment remained resilient.\n\nTata Consultancy Services (TCS), Tech Mahindra , and HCLTech were among the top IT stocks which registered up to 3% gains during Monday\u2019s trading session. Shriram Finance , Max Health, Maruti, Apollo Hospital, Infosys, Eicher Motors , ITC, Titan, Adani Ports were trading in green at 1:15 pm on Monday, November 23.\n\nTCS share price was trading 3.43% higher at \u20b9 2,457.80 per share on NSE with a market capitalisation. Tech Mahindra share price was trading 2.81% higher at \u20b9 1,795.20 per share. Whereas, HCL Tech stock was trading 1.03% higher at \u20b9 1,358.90 apiece. Shares of Infosys were up 0.64% at \u20b9 1,105.10 per share.\n\nUnfazed by the weakness in the Indian stock market, bulls continue to drive a rally in hospital stocks. Holding on to their previous trading sessions\u2019 gains, Apollo Hospital shares were trading 0.74% higher at \u20b9 9,268.00 per share. Shares of Max Health were up 1.48% at \u20b9 1,097.00 per share. Shares of Shriram Finance were up 1.94% at \u20b9 990.45 per share.\n\nNifty 50 was down 1.37% at 25,446.40 points, whereas Sensex was trading 1172 points lower at 82,747 points. Tata Steel, Axis Bank, Hindalco, HDFC Bank, JSW Steel, ICICI Bank, Kotak Mahindra Bank , were among the top laggards. Only 12 Nifty 50 stocks advanced, while 38 declined during Monday's trading session.\n\nBank Nifty was down nearly 2.33% after touching all-time high level in the previous trading session.", "source": "LiveMint Markets", "pub_date_str": "23 Nov 2026, 01:40 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "HFCL 160% up in 2026 vs Sterlite Technologies up 476%; but both crashed today - Experts suggest which one to buy", "full_content": "HFCL Vaamanaa Sethi Published 23 Nov 2026, 01:35 PM IST Prefer Livemint on Google HFCL vs Sterlite Technologies: Shares of telecom equipment and optical fibre cable manufacturers HFCL and Sterlite Technologies witnessed a sharp sell-off on Monday, despite delivering significant gains in 2026. While HFCL shares have surged nearly 160% so far this year, Sterlite Technologies (STL) has outperformed with a massive rally of around 476% during the same period.\n\nOn Monday, both HFCL and Sterlite Technologies shares fell 5%, hitting the lower circuit limit, amid weak market sentiment on Dalal Street.\n\nAccording to market experts, both companies have benefited from rising global demand for optical fibre cables, increased investment in telecom infrastructure, and growing demand for high-speed connectivity to support artificial intelligence (AI) and hyperscale data centres. Their strong Q2 FY27 earnings and sizeable order books have further strengthened their growth outlook.\n\nHFCL reported a strong performance in the September quarter, with consolidated revenue rising 143.6% year-on-year (YoY) to \u20b9 2,541.79 crore. EBITDA increased 223.6% to \u20b9 658 crore, while net profit surged 448% to \u20b9 394.22 crore. Its EBITDA margin expanded to 25.89%, reflecting improved operating performance.\n\nThe company's order book stood at approximately \u20b9 28,911 crore, providing strong revenue visibility. Management expects revenue growth of at least 80% in FY27 compared with FY26. HFCL is also investing around \u20b9 1,800 crore in expanding its optical fibre, cable and preform manufacturing capacities.\n\nAdding to its growth visibility, the company secured fresh export orders worth \u20b9 834 crore in November, strengthening its international business prospects.\n\nSterlite Technologies reported record revenue of \u20b9 2,529 crore in Q2 FY27, registering growth of approximately 145% year-on-year.", "source": "LiveMint Markets", "pub_date_str": "23 Nov 2026, 01:35 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Trump to host private dinner for largest owners of his meme coin - Al Jazeera", "full_content": "Trump to host private dinner for largest owners of his meme coin Al Jazeera Trump Rewards Top Owners of His Declining Coin With Exclusive Dinner WSJ Trump Says U.S. Must Beat China In Crypto At Meme Coin Dinner As His Token Hovers Near Record Low Forbes Trump hosts third crypto gala for meme coin amid conflict of interest outcry The Guardian Trump hosts gala for meme coin investors as his token plunges to record lows Reuters", "source": "Google News Business", "pub_date_str": "23 Nov 2026, 01:33 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "South Africa vs Bangladesh 2nd Test Live Streaming: When And Where To Watch SA vs BAN Match In India", "full_content": "South Africa face Bangladesh in the second Test from November 23. Check the match time, venue and live streaming details in India.", "source": "NDTV Profit", "pub_date_str": "23 Nov 2026, 01:30 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "EPFO may enable PF withdrawals via UPI by December-end: What subscribers should know", "full_content": "EPFO is in the final stages of introducing UPI-based provident fund withdrawals, with the facility expected to go live by December-end, The Financial Express reported. The soon-to-be launched feature will allow EPF subscribers to access eligible PF money through the BHIM app, check their withdrawable balance and see the minimum amount that must remain in their retirement account.\n\nAs per the report, UPI withdrawal, which is one of the highly anticipated features, is in the final stages of rollout. All trials have been completed, and the glitches encountered during trials have been fixed, the report says.\n\nThe UPI withdrawal facility is part of EPFO's broader technology upgrade, EPFO 3.0, which is reportedly set to roll out in February 2027, when the Central Board of Trustees next meets.\n\nThe UPI withdrawal facility will be linked to a member's Universal Account Number (UAN) and UPI account. This feature is expected to work only for bank accounts that are verified and linked with an EPFO account.\n\nReportedly, subscribers will be allowed to withdraw 75% of their EPF money; however, no official limit has been announced yet. It may be recalled that the retirement fund body, in its board meeting on 19 November, approved a proposal to reduce the mandatory minimum balance in PF accounts from 25% to 10%. This move may also increase the partial withdrawal limit from 75% to 90% of their eligible balance.\n\nThe retirement fund body's partial withdrawal facility allows members to draw from their PF savings to meet specific needs during their working years. EPFO has consolidated 13 provisions governing partial withdrawals into three categories: Essential Needs, Housing Needs and Special Circumstances.\n\nAs of now, the EPFO allows up to 10 withdrawals for education and 5 for marriage. This frequency has been raised from 3 withdrawals for both purposes earlier.", "source": "LiveMint Money", "pub_date_str": "23 Nov 2026, 01:25 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "From monthly payouts to easier withdrawals: what EPFO\u2019s changes mean", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nThe 240th meeting of the Employees\u2019 Provident Fund Organisation\u2019s (EPFO) Central Board of Trustees (CBT), held on 19 November 2026, approved several changes, including systematic withdrawals for retiring members, easier premature withdrawal rules and direct voluntary contributions.\n\nWhat do these decisions mean for existing EPF subscribers? Who stands to benefit, when will the revised rules take effect, and what should members keep in mind before dipping into their retirement savings? We explain the key announcements and their implications.\n\nThe board has approved a proposal to introduce a systematic withdrawal plan ( SWP ) for retiring EPF members. Instead of withdrawing their entire accumulated corpus at once, members will be able to receive their savings in periodic instalments, such as monthly, quarterly or half-yearly payments.\n\nThe remaining balance will continue to earn interest, allowing members to supplement their pension income during retirement.\n\n\u201cEPF has been built in a way that it first accumulates funds and pays out at once. A lumpsum at 58 is exposed to poor investment choices, mis-selling and family pressure. SWP will allow members to withdraw gradually, offering a safeguard,\u201d said Kunal Arora, advocate and principal consultant, SKVC Consulting.\n\nHowever, the proposed withdrawal period and the treatment of the remaining corpus need greater clarity.\n\n\u201cThere are reports that say the withdrawal window will be 20 years. Retiring at 58, the corpus runs out at about 78, exactly when health costs rise. Members need a longer tenure, an interest-only option or an undrawn reserve. Some reports claim that an interest-only option will be given. We have to wait and watch for the final notification,\u201d Arora said.", "source": "LiveMint Money", "pub_date_str": "23 Nov 2026, 01:08 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Gold price crash with 31% correction: Why investors should wait for November 25, December 4 and 9 - What\u2019s special?", "full_content": "Gold has corrected sharply from its record high earlier this year, leaving investors and jewellery buyers wondering whether the worst is over. Its next move could depend on three US economic events in the coming weeks: the October PCE inflation report on 25 November, the November jobs report on 4 December and the US Federal Reserve\u2019s policy decision on 9 December.\n\nAll three could shape the Fed\u2019s interest rate path and outlook, which in turn affects global bullion prices .\n\nGold has fallen about 31.7% from its January record of \u20b9 1.83 lakh per 10 grams. On 23 November, 99.9% pure gold traded at \u20b9 1,25,030 per 10 grams in New Delhi, a minor recovery after seven straight sessions of losses.\n\nA stronger US dollar, rising Treasury yields and expectations of further Fed rate hikes have weighed on gold and the wider bullion market. Gold pays no interest, unlike bank fixed deposits and similar investments, so higher interest rates generally reduce its appeal.\n\nWith these core fundamentals in mind, here are the three dates investors should watch over the next few weeks.\n\nThe October Personal Consumption Expenditures (PCE) inflation report is scheduled for release on Wednesday, 25 November. This will provide investors with clear clues about the underlying US price pressure. Core PCE inflation will be a key focus for top investors worldwide. This metric excludes food and energy prices and provides real insights. It is released by the US Bureau of Economic Analysis (BEA).\n\nThen next will be the November employment report, which will be released on Friday, 4 December. This is yet another critical report that will indicate whether the US labour market continues to hold and stays resilient.", "source": "LiveMint Money", "pub_date_str": "23 Nov 2026, 01:00 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Bought Gold On Akshaya Tritiya? Here's How Much You Lost After Rs 10 Lakh Investment", "full_content": "Gold price has declined nearly Rs 31,000, or 20%, from Akshaya Tritiya levels. Silver has plunged approximately Rs 1.02 lakh, or 41%, during the same period.", "source": "NDTV Profit", "pub_date_str": "23 Nov 2026, 12:58 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Gold, silver prices: Rates have rebounded, but experts feel precious metals could extend losses longer term \u2014 Here's why", "full_content": "Gold prices today: The yellow metal rebounded from its biggest weekly decline in eight months on Monday as traders sought safe haven assets amid growing concerns over artificial intelligence (AI) spending, a weaker United States Treasury yield and dollar, Bloomberg reported on 23 November.\n\nIn the international markets, bullion rose as much as 2.6% to around $3,630 an ounce, after falling 9% last week to a 14-month low, it added. Gold futures rose 2.14% to USD 3,614.25 per ounce in New York, PTI reported.\n\nMeanwhile, yellow metal futures trade on the domestic Multi Commodity Exchange ( MCX ), rose by \u20b9 2,899 to \u20b9 1,24,677 per
