    const allData = {"general": [{"title": "Booking a Hilton stay? Stack a 20% discount, 5,000 bonus points and up to 200,000 points in card bonus offers", "full_content": "Terms apply to American Express benefits and offers. Visit americanexpress.com to learn more.\n\nIf you've got your eye on a Hilton hotel or resort for a winter ski trip or a cold-weather escape, you can stack limited-time credit card bonus offers with a 20%-off sale right now. In addition, eligible Amex Hilton cardholders can earn 5,000 bonus Hilton points on a qualifying stay.\n\nAnyone interested in opening a Hilton card can take advantage of increased welcome bonuses worth up to 200,000 bonus Hilton points through Jan. 13, 2027. The end date for the current Hilton sale varies by region, but for properties in the U.S. and Canada, you need to book by Dec. 22, 2026.\n\nBelow are the key details you need to know if you want to take advantage of any of these Hilton offers or stack all three.\n\nSenior reporter Jason Stauffer can answer your questions about how to make the most of your credit cards in his weekly Points Pro column. Submit yours here .\n\nHilton is running multiple promotions right now. You can take advantage of a 20% discount on eligible stays, and Hilton cardholders can earn bonus points.\n\nYou can stack these deals with the More Points to Play promotion that offers up to 3,000 bonus points on luxury, lifestyle and resort stays and 1,000 bonus points on stays at other properties. There is no limit on the number of More Points to Play bonuses you can earn. You must register before your stay begins . However, this deal is slated to end earlier than the other offers; stays must be completed by Dec. 31, 2026, to qualify for the points bonus.\n\nYou must be a Hilton member to be eligible for these offers, but it is free to enroll.", "source": "CNBC Top News", "pub_date_str": "19 Nov 2026, 10:07 PM IST", "pub_date_relative": "4m ago"}, {"title": "Nasdaq gains on strong Anthropic debut, but the broader market is lower: Live updates", "full_content": "The Nasdaq Composite traded higher, while the broader market declined on Thursday as the Anthropic IPO revived some enthusiasm around the artificial intelligence trade.\n\nThe tech-heavy Nasdaq last traded up 0.2% while the S&P 500 shed 0.3%. The Dow Jones Industrial Average lost 505 points, or 1%. At their peak, the Nasdaq and S&P 500 were up 2.1% and 1.3%, respectively, while the Dow rose more than 200 points, or 0.5%.\n\nKey technology stocks were higher. Chipmakers Nvidia and Micron Technology added more than 1% and more than 3%, respectively. Tech giant Microsoft moved up more than 1%, while neocloud CoreWeave traded up around 2%.\n\nAdvanced Micro Devices , however, lost more than 10% after Hunterbrook Capital disclosed a short position in the name, pointing to possible U.S. export control breaches that involve China.\n\nInvestors sold their shares outside of the tech sector on Thursday, with some of those people likely raising funds to participate in the Anthropic debut. Healthcare stocks such as Johnson & Johnson and Merck , each fell almost 3%, weighing on the Dow. Others like retailer Walmart declined nearly 2%.\n\nTraders are focused on how the company behind Claude performs when it debuts on the Nasdaq, trading under the ticker ANT. The artificial intelligence company priced its initial public offering at $83 a share, above the expected range.\n\nAnthropic is set to pop 25% when it opens for trading, according to indications from the perpetual futures markets. Retail trader demand is expected to be even stronger than seen during SpaceX, according to Vanda Research.\n\nAnthropic also upsized the offering, selling around 980 million shares, bringing the amount raised to $81.3 billion and surpassing SpaceX , which held a record IPO in June.", "source": "CNBC Top News", "pub_date_str": "19 Nov 2026, 10:05 PM IST", "pub_date_relative": "6m ago"}, {"title": "Wall Street mixed as investors await Anthropic\u2019s market debut", "full_content": "", "source": "Investing.com News", "pub_date_str": "19 Nov 2026, 10:05 PM IST", "pub_date_relative": "6m ago"}, {"title": "UniCredit at J.P. Morgan European Financials Conference: growth and deal plan", "full_content": "", "source": "Investing.com News", "pub_date_str": "19 Nov 2026, 10:05 PM IST", "pub_date_relative": "6m ago"}, {"title": "Poland stocks lower at close of trade; WIG30 down 0.48%", "full_content": "", "source": "Investing.com News", "pub_date_str": "19 Nov 2026, 10:05 PM IST", "pub_date_relative": "7m ago"}, {"title": "Anthropic indicated at $110 per share, source says: IPO live updates", "full_content": "Anthropic is set for its long-awaited Nasdaq debut on Thursday, after the artificial intelligence lab raised over $81 billion in a record IPO , surpassing SpaceX 's offering in June.\n\nThe Claude creator sold 980 million shares at $83 a piece on Wednesday, lifting the size and price of its offering. Its fully diluted market cap sits at around $1.5 trillion.\n\nThe 5-year-old company captivated the corporate world with its Claude AI models and products, which have fueled its meteoric rise this year. Anthropic said in its prospectus that it generated $33.24 billion in revenue for the nine months ended Sept. 30, up a staggering 1,200% from the same period last year.\n\nAnthropic CEO Dario Amodei co-founded the company in 2021 after he and a small group of researchers defected from OpenAI , now its chief rival. Anthropic has faced sharp criticism over its positions on safety, regulation and national security, including by President Donald Trump and other senior government officials.\n\nCNBC's reporters are covering Anthropic's IPO live on air and online from our bureaus in San Francisco and Englewood Cliffs, New Jersey, and from the Nasdaq in New York City.\n\nAnthropic is indicated to open at $110 a share, a person familiar told CNBC.\n\nAmodei told JPMorgan Chase CEO Jamie Dimon in a fireside chat on Friday that he thinks talent and culture are the \"most important things\" that drive a company's success, which is why he and his co-founders have tried to place so much emphasis on those areas at Anthropic.\n\nAnthropic requires every employee to pass a culture interview, which is taken very seriously, Amodei said. He added that he spends roughly half of his time focusing on talent and culture at the company.", "source": "CNBC World Economy", "pub_date_str": "19 Nov 2026, 10:03 PM IST", "pub_date_relative": "8m ago"}, {"title": "Anthropic IPO: Investors who flip the stock may face brokerage penalty", "full_content": "Retail investors with access to Anthropic's initial public offering who sell the stock quickly after buying could get penalized by their brokerage firm.\n\nAnthropic said in an IPO prospectus that it expected to make shares available to retail investors through various brokerages, including Charles Schwab , Fidelity, Robinhood , SoFi , E*Trade and some of their respective affiliates.\n\nFollow CNBC' s live coverage of Anthropic's IPO and Nasdaq debut\n\nThese broker-dealers have different \"anti-flipping\" policies meant to discourage investors who purchase IPO shares \u2014 including those of Anthropic \u2014 from dumping them quickly. Charles Schwab is the only one that doesn't have such a policy in place.\n\n\"One purpose is to discourage 'flippers' who are just buying with the hope of making a quick profit,\" Jay Ritter, director of The IPO Initiative at the University of Florida, said in an email. \"Their selling could put downward pressure on the price once trading starts.\"\n\nInvestors who run afoul of anti-flipping rules may be prohibited from accessing future IPOs, perhaps for several months or even more than a year for repeat offenders. In the worst case, the brokerage may bar them from all future IPOs.\n\nThese policies apply only to retail investors who place an order with their brokerage firm to buy the Anthropic IPO at its offering price \u2014 something many investors don't have access to.\n\nFor example, Fidelity customers are eligible to participate in the Anthropic IPO if they have at least $25,000 in certain assets, the firm said . Even then, customers are \"evaluated and ranked\" based on factors like account assets to determine who can access limited shares that may be available, it said .", "source": "CNBC Top News", "pub_date_str": "19 Nov 2026, 10:01 PM IST", "pub_date_relative": "10m ago"}, {"title": "U.S. Steel, United Steelworkers reach tentative four-year deal", "full_content": "", "source": "Investing.com News", "pub_date_str": "19 Nov 2026, 10:00 PM IST", "pub_date_relative": "11m ago"}, {"title": "8th Pay Commission: Will govt pensioners get a minimum monthly pension of \u20b945,000? Here's what the latest demand means", "full_content": "8th Pay Commission: A government pension of \u20b9 22,450 could rise to \u20b9 30,083 a month if a fresh proposal before the 8th Pay Commission is accepted. Bharat Pensioners Samaj wants the minimum monthly pension raised to \u20b9 45,000, the pension rate increased from 50% to 67% of last pay drawn, and family pension lifted from 30% to 50%.\n\nThe proposal could mean an additional \u20b9 7,633 a month for a retired employee drawing a last basic salary of \u20b9 44,900. For pensioners on lower salaries, the proposed \u20b9 45,000 minimum could prove even more significant.\n\nBut the demands are far from settled. The 7th Pay Commission had rejected a similar proposal to increase pension rates, arguing that successive pay revisions already improved retirement benefits. The 8th CPC must now weigh the case for higher payouts against the cost to government finances.\n\nThe BPS memorandum to the 8th CPC puts forward three key changes:\n\nThe demand for a higher pension rate is not new. Pensioners had made a similar representation to the 7th CPC, which considered the proposal but decided against increasing the existing rates.\n\nThe 7th CPC had argued that pension benefits had already been improved under the 6th CPC. The earlier revision removed the requirement of 33 years of qualifying service and ensured that pension was calculated at 50% of the last pay or average emoluments over the final 10 months, whichever was more beneficial.\n\nIt also pointed out that regular salary revisions would automatically increase the last pay drawn and, consequently, the pension amount.\n\nThe proposed increase from 50% to 67% could make a noticeable difference to monthly retirement income.", "source": "LiveMint Money", "pub_date_str": "19 Nov 2026, 10:00 PM IST", "pub_date_relative": "11m ago"}, {"title": "Grand Theft Auto VI draws rave reviews as gamers enter Vice City", "full_content": "", "source": "Investing.com News", "pub_date_str": "19 Nov 2026, 10:00 PM IST", "pub_date_relative": "11m ago"}, {"title": "NVR stock hits 52-week low at $5,493.27", "full_content": "", "source": "Investing.com News", "pub_date_str": "19 Nov 2026, 10:00 PM IST", "pub_date_relative": "11m ago"}, {"title": "Denmark stocks lower at close of trade; OMX Copenhagen 20 down 1.42%", "full_content": "", "source": "Investing.com News", "pub_date_str": "19 Nov 2026, 10:00 PM IST", "pub_date_relative": "12m ago"}, {"title": "Gold's bad year is getting worse. Why its price keeps falling", "full_content": "Precious metals investors can be forgiven if they feel like the past year has given them whiplash.\n\nFollowing a torrid run, which saw the price of gold hit new records 53 times in 2025, gold hit a historic high of $5,589.38 an ounce on Jan. 28, only to take an almost equally historic nosedive. On Wednesday, gold fell below $3,800 for the first time since September 2025, roughly a third below its peak.\n\nA convergence of factors pushed gold to historic highs earlier this year, according to Suki Cooper, global head of commodities research at Standard Chartered, the London-based multinational bank. Now a different convergence is bringing the price down.\n\nWhich role it plays depends on the factors dominating the market and the psyche of investors, and right now, it's the currency argument that is bringing the precious metal down.\n\nCooper said gold's climb began with strong physical demand that started in 2022 and raised the floor under prices. A second phase followed as investors rethought gold's place in their portfolios. With the cost of holding a non-yielding asset falling, they started thinking about the metal for the longer term. That, Cooper said, marked a turnaround.\n\nUntil early 2025, Cooper said, long-term investors, especially those in gold-backed exchange-traded funds, had been cutting their exposure, which effectively added supply to the market. Last year, that reversed: ETF holdings, led by the SPDR Gold Shares ( GLD ), rose by roughly 800 tons and helped absorb the market's excess supply.\n\n\"There was a lot of one-way interest, a lot of appetite to buy but not to sell,\" Cooper said.\n\nWith selling in the secondary market staying muted, prices kept rising. By the end of 2025, net ETF holdings had passed 4,000 tons. Globally, gold ETFs had their strongest year ever for inflows, $89 billion, led by North America, according to the World Gold Council, with assets more than doubling to $559 billion in total.", "source": "CNBC Top News", "pub_date_str": "19 Nov 2026, 09:59 PM IST", "pub_date_relative": "12m ago"}, {"title": "Josh Brown says the breakout potential in this stock is staring investors in the face", "full_content": "This name made Josh Brown's Best Stocks in the Market list earlier this fall.", "source": "CNBC Top News", "pub_date_str": "19 Nov 2026, 09:58 PM IST", "pub_date_relative": "13m ago"}, {"title": "Palo Alto stock jumps on earnings beat and company's big bet on securing open-weight models", "full_content": "Palo Alto Networks shares rose 6% on Thursday as businesses boosted spending on cybersecurity products and investors cheered the company's acquisition of a startup that pushes it into securing open-weight artificial intelligence models.\n\nThe company beat Wall Street's estimates for the fiscal first quarter. Revenue jumped 39% from a year ago and Palo Alto boosted its guidance for the year.\n\nRecent outages at Microsoft , banks and the Federal Aviation Administration have left businesses reeling. While U.S. officials haven't detected any malicious activity, the disruptions raise concerns over aging equipment and infrastructure. Many businesses are scrambling to patch vulnerabilities at a faster clip than ever before to keep pace with the growing risks of AI-powered cyberattacks.\n\nThose fears have led more businesses to consolidate platforms, which is fueling growth in areas like firewall and AI security, Palo Alto Networks CEO Nikesh Arora told CNBC's \" Mad Money \" on Wednesday.\n\n\"They're going to have to make sure they get the best players in the market to come support them because this is no longer child's play,\" Arora said.\n\nAlongside earnings, Palo Alto announced a $4.5 billion deal to buy Applied Compute, a startup that helps train customized open-weight models. It's one of several recent deals in Arora's aggressive acquisition spree and marks a significant shift beyond cybersecurity.\n\n\"Rather than being one player out of 10 in the industry serving compute, we want to be the one player with Palo Alto that delivers secure compute and security capability,\" Arora told CNBC.\n\nPalo Alto expects the deal to add more than $1 billion in annual recurring revenue to its next-generation security business by the 2029 fiscal year.", "source": "CNBC Top News", "pub_date_str": "19 Nov 2026, 09:58 PM IST", "pub_date_relative": "13m ago"}, {"title": "A CoreWeave co-founder just made an unconventional $30 million wager on its battered bonds", "full_content": "While executives typically buy shares to signal confidence, CoreWeave co-founder Brian Venturo is turning to the bond market to calm AI jitters.", "source": "MarketWatch Top Stories", "pub_date_str": "19 Nov 2026, 09:57 PM IST", "pub_date_relative": "15m ago"}, {"title": "Anthropic IPO Live Updates: Shares Indicated To Open At $110 Each, 32% Above IPO Price", "full_content": "Follow our live blog for the latest updates on Anthropic listing, stock performance, analyst ratings and investor sentiment.", "source": "NDTV Profit", "pub_date_str": "19 Nov 2026, 09:56 PM IST", "pub_date_relative": "15m ago"}, {"title": "AMD falls on short-seller report of alleged China exposure", "full_content": "Shares of chipmaker Advanced Micro Devices were down about 7% Wednesday after investment firm Hunterbrook Media issued a report alleging that the company \"has its own China problem.\"\n\nHunterbrook disclosed that it had taken a short position in AMD.\n\nThe report claims that \"after the U.S. blacklisted Chinese server maker IEIT Systems, the company kept getting newer AMD firmware, which enables AMD chips to run in servers.\"\n\nHunterbrook also said that new export rules in Washington could \"tighten restrictions on AMD's foreign business,\" alleging that AMD \"bills over 20% of its revenue to customers in China and Hong Kong,\" and \"depends on a Chinese partner to finish most of its chips.\"\n\nAMD, 1-day The allegations come amid investigations of rival chipmaker Nvidia over its sales to companies in Asia with ties to China. AMD has been viewed as beneficiary of the uncertainty surrounding Nvidia.\n\nLisa Su, CEO of AMD, said on the company's recent earnings call that China is an \"important\" market and that the semiconductor giant wants to be fully compliant with U.S. export controls.", "source": "CNBC Top News", "pub_date_str": "19 Nov 2026, 09:54 PM IST", "pub_date_relative": "17m ago"}, {"title": "Helmerich & Payne Q4 2026 slides: margins beat despite impairment hit", "full_content": "", "source": "Investing.com News", "pub_date_str": "19 Nov 2026, 09:54 PM IST", "pub_date_relative": "17m ago"}, {"title": "Trump pressures Congress to pass farm bill this year", "full_content": "", "source": "Investing.com News", "pub_date_str": "19 Nov 2026, 09:54 PM IST", "pub_date_relative": "17m ago"}, {"title": "Bitrue Among the First CEXs to Support ANTx as Anthropic Debuts on Nasdaq", "full_content": "", "source": "Investing.com News", "pub_date_str": "19 Nov 2026, 09:53 PM IST", "pub_date_relative": "18m ago"}, {"title": "Want to create more competition in grocery delivery? Let DoorDash and Instacart merge.", "full_content": "The combined company would be better able to challenge corporate juggernauts like Amazon, Walmart and Uber.", "source": "MarketWatch Top Stories", "pub_date_str": "19 Nov 2026, 09:51 PM IST", "pub_date_relative": "21m ago"}, {"title": "Anthropic IPO Live: AI Giant Prepares to Start Trading Stock at $83 a Share - WSJ", "full_content": "Anthropic IPO Live: AI Giant Prepares to Start Trading Stock at $83 a Share WSJ Anthropic to Start Trading After Record-Setting IPO: Live Updates The New York Times Anthropic IPO Live Updates: Nasdaq Futures Up Nearly 2%\u2014As Shares Could Pop 25% In Debut Forbes Anthropic Pushes the Reset Button for AI WSJ Anthropic IPO live: Claude maker goes public on Nasdaq after record share offering Reuters", "source": "Google News Business", "pub_date_str": "19 Nov 2026, 09:50 PM IST", "pub_date_relative": "22m ago"}, {"title": "Anthropic shares indicated to open 33% higher at $110", "full_content": "AI giant to begin trading after raising $81bn in record IPO", "source": "FT Markets", "pub_date_str": "19 Nov 2026, 09:49 PM IST", "pub_date_relative": "22m ago"}, {"title": "Trump, Xi, Putin said they plan to boost oil production, revamp UN after trilateral talks", "full_content": "The U.S., China and Russia on Thursday vowed to boost production of petroleum products and reaffirmed their commitment to reducing nuclear risks following their leaders' historic trilateral summit.\n\nPresident Donald Trump , Chinese President Xi Jinping and Russian President Vladimir Putin \"had an in-depth exchange of views on the current international situation and committed to maintaining strategic stability and international security,\" the countries said in identical statements shared after the meeting in Shenzhen, China.\n\n\"The three countries plan to increase the production and supply of refined petroleum products for the benefit of all nations. They reaffirmed the importance of stable energy flows,\" according to the statements, described as a \"Heads of State Declaration toward Peace.\"\n\nThe three presidents also \"reaffirmed that a nuclear war cannot be won and must never be fought,\" and committed to a \"dialogue on reducing nuclear risks and preventing the proliferation of nuclear weapons.\"\n\nAnd they committed to \"reform\" the United Nations so it \"can respond more effectively to global challenges and conform to its fundamental mission of international peace and security,\" according to the statements.\n\nTrump holds talks separately with Putin and Xi ahead of their historic trilateral meeting\n\nTakaichi gets chilly reception in China on first Japan leader visit since 2019\n\nI watched Trump, Xi and Putin gather in China. Here are my top takeaways", "source": "CNBC Top News", "pub_date_str": "19 Nov 2026, 09:49 PM IST", "pub_date_relative": "23m ago"}, {"title": "Hackers Leak Data Linked To JPMorgan's $10-Million-Club Card Holders; Visa, Mastercard Also Targeted", "full_content": "Customer names, email addresses and contact details may have been exposed in a data leak involving Visa, Mastercard and JPMorgan. However, the companies say their core payment systems remain unaffected.", "source": "NDTV Profit", "pub_date_str": "19 Nov 2026, 09:47 PM IST", "pub_date_relative": "24m ago"}, {"title": "Alphabet Shares Spike Nearly 5% After Opening Bell. Here's The Anthropic Link To It", "full_content": "Alphabet shares gained more than 4% as Anthropic's $83 IPO price put an estimated $149 billion value on Google's stake in the Claude developer, drawing attention to the returns from its AI investments.", "source": "NDTV Profit", "pub_date_str": "19 Nov 2026, 09:46 PM IST", "pub_date_relative": "25m ago"}, {"title": "Amazon launches in-app push against Mamdani-backed delivery bill in New York City", "full_content": "Amazon is taking its fight against a New York City delivery bill, which has been backed by Mayor Zohran Mamdani , to its shopping website and app.\n\nSome users who open the company's shopping app or website report being served with pop-ups and banners warning that the New York City Council \"could add up to $5 per order\" if it passes Intro 518, or the Delivery Protection Act.\n\nThe bill would require Amazon to employ its army of third-party delivery companies directly, disrupting the contractor model it has relied on since 2018. Amazon uses a network of thousands of small companies, who often solely work for Amazon, to handle the last-mile portion of shipments, in an effort to speed up deliveries and control more of its logistics operations.\n\n\"If this legislation passes, we'd no longer be able to work with them, and we'd be forced to consider moving our operations outside of the city,\" Amazon's in-app message states. \"That would likely mean slower and more expensive delivery for millions of customers in New York City, while also threatening small businesses and their thousands of employees.\"\n\nThe proposed legislation was introduced in February and is awaiting review by City Council Speaker Julie Menin.\n\nAmazon also posted a statement on its company website where it often publishes its policy positions . But rarely has it used its valuable e-commerce site and app real estate to push its perspectives. Other tech companies including Uber and Lyft have similarly used their apps to advocate for or against legislation in the past.\n\nAmazon's pop-up notices and a stationary banner on its store homepage direct users to a form where they can \"contact your council member to oppose Intro 518.\"\n\nThe Delivery Protection Act has received a swell of support from labor groups, including the International Brotherhood of Teamsters, which has sought to unionize Amazon delivery and warehouse workers.", "source": "CNBC Top News", "pub_date_str": "19 Nov 2026, 09:45 PM IST", "pub_date_relative": "26m ago"}, {"title": "We\u2019re in our 50s and terrified of a market crash. Should we put $400,000 of our $1 million retirement savings into an annuity?", "full_content": "\u201cWe have a house worth $450,000. Our combined annual income is $125,000.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "19 Nov 2026, 09:45 PM IST", "pub_date_relative": "27m ago"}, {"title": "\u2018Buyers are out for blood\u2019: With home sales at a record low, buyers are calling the shots", "full_content": "The few buyers left in the market braving record-high home prices and 7% mortgage rates are starting to call the shots, real-estate agents say.", "source": "MarketWatch Top Stories", "pub_date_str": "19 Nov 2026, 09:44 PM IST", "pub_date_relative": "28m ago"}, {"title": "Scene Box Office Collection Day 14: Suriya\u2019s Scene Refuses To Slow Down, Nears Rs 150 Crore", "full_content": "Scene earned Rs 1.70 crore on Day 14, taking its India net total to Rs 146.75 crore and gross collection to Rs 170.51 crore, as the Suriya-starrer nears the Rs 150 crore mark.", "source": "NDTV Profit", "pub_date_str": "19 Nov 2026, 09:41 PM IST", "pub_date_relative": "30m ago"}, {"title": "Stocks making the biggest moves Thursday: Palo Alto Networks, Take-Two Interactive, AMD, Walmart & more", "full_content": "Palo Alto Networks popped in early trading Thursday, boosted by quarterly results that beat analyst expectations. AMD, meanwhile, tumbled on the back of a short seller report.\n\nFollow along as CNBC covers the biggest stock market moves of the day.\n\nNeocloud CoreWeave gained 1% on enthusiasm from the Anthropic IPO plus a change in Texas permitting that favors data center development.\n\nTexas officials started issuing air permits again for data center construction projects, according to Reuters , which bodes well for the future of the physical component of the AI buildout.\n\nNvidia's highly anticipated earnings call earlier this week also offered clarity on the leadership direction for the firm, which Wall Street analysts responded positively to. Analysts at Truist were encouraged on Tuesday by Nvidia statements on the call about its relationship to neoclouds.\n\n\"Notably, NVIDIA's earnings commentary \u2026 [described] neoclouds as an 'increasingly important' part of the global AI infrastructure ecosystem and stating that it will continue working with and supporting leading neocloud partners, while becoming more disciplined and selective in that support.\"\n\nAMD shares tumbled more than 9% after Hunterbrook Capital revealed it took a short position on the company.\n\nIn a post titled \"AMD has its own China problem\", Hunterbrook alleges that \"AMD firmware keeps turning up at a blacklisted Chinese company and three companies tied to it, just as U.S. export restrictions are scheduled to expand.\"", "source": "CNBC Top News", "pub_date_str": "19 Nov 2026, 09:35 PM IST", "pub_date_relative": "36m ago"}, {"title": "School Holiday: Are Chennai Schools Open Or Closed On Nov 20 As Cyclone Akvan Closes In?", "full_content": "Check whether Chennai schools will remain open on November 20 amid Cyclone Akvan. Odisha has announced school closures in nine districts.", "source": "NDTV Profit", "pub_date_str": "19 Nov 2026, 09:34 PM IST", "pub_date_relative": "37m ago"}, {"title": "EPFO looks beyond bonds and ETFs, approves up to 3% of inflows in Alternate Investment Funds", "full_content": "The EPFO's Central Board of Trustees on 19 November gave in-principle approval for the retirement fund body to invest up to 3% of its fresh inflows in eligible Alternative Investment Funds (AIFs). The investments will initially be routed through government-backed entities and will fall within EPFO's existing investment limit. The move aims to diversify its portfolio while ensuring adequate safeguards and oversight, the Ministry of Labour & Employment said.\n\nThe decision was announced in the board meeting chaired by Mansukh Mandaviya, Union Minister for Labour & Employment.\n\n\"Globally, long-term capital pools such as endowment funds have broadened their portfolios beyond traditional investments into private equity, venture capital and other alternative assets, and this move reflects a similar principle. It signals growing confidence in AIFs as an asset class and can channel capital into India\u2019s growth story,\u201d Shrikant Goyal, Managing Director, Getfive Funds told Livemint.\n\nThe board also approved a Systematic Withdrawal Plan (SWP), allowing members to withdraw their PF savings in instalments. It reduced the minimum balance requirement for final withdrawals from 25% to 10% and cut the waiting period from 12 months to two months.\n\nThe board also eased EDLI exemption renewal rules, approved voluntary contributions through UAN and reviewed progress in speeding up automated claim settlements.\n\nAIFs are privately pooled investment vehicles that collect money from investors and deploy it in assets such as start-ups, unlisted companies, private equity and infrastructure projects. Unlike conventional mutual funds, they can invest in a wider range of assets, including businesses that are not listed on stock exchanges.", "source": "LiveMint Money", "pub_date_str": "19 Nov 2026, 09:34 PM IST", "pub_date_relative": "37m ago"}, {"title": "The outages keep coming. Some Americans are preparing for a collapse. - The Washington Post", "full_content": "The outages keep coming. Some Americans are preparing for a collapse. The Washington Post What is causing America\u2019s recent outages The Economist Everything Is Breaking The Atlantic How to Tell If It\u2019s a Cyberattack or Just an Outage WIRED What\u2019s causing all these outages? The internet is held together with shoestring and bubblegum CNN", "source": "Google News Business", "pub_date_str": "19 Nov 2026, 09:32 PM IST", "pub_date_relative": "39m ago"}, {"title": "Amundi CIO says not bearish on France bonds, AI at the start of repricing", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Amundi CIO says not bearish on France bonds, AI at the start of repricing Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Amundi CIO says not bearish on France bonds, AI at the start of repricing SECTIONS Amundi CIO says not bearish on France bonds, AI at the start of repricing By Reuters Last Updated: Nov 19, 2026, 09:31:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Amundi has chosen a reserved approach towards French government bonds, amidst climbing yields and worries regarding fiscal management. Chief Investment Officer Vincent Mortier expressed a preference for bonds from nations with lower debt-to-GDP ratios and shorter maturities. He also highlighted a potential future interest in Japanese government bonds, as local investors may re-enter the market.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Marke ch Top Stories", "pub_date_str": "19 Nov 2026, 09:27 PM IST", "pub_date_relative": "45m ago"}, {"title": "Keystone Realtors to launch Rs 5,000 cr worth housing properties in MMR by Mar: CMD", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Digital Real Estate \u203a Realty News \u203a Keystone Realtors to launch Rs 5,000 cr worth housing properties in MMR by Mar: CMD Keystone Realtors Share Price Ganesh Housing Share Price Kalpataru Share Price Puravankara Share Price Valor Estate Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Keystone Realtors to launch Rs 5,000 cr worth housing properties in MMR by Mar: CMD SECTIONS Keystone Realtors to launch Rs 5,000 cr worth housing properties in MMR by Mar: CMD PTI Last Updated: Nov 19, 2026, 09:26:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Keystone Realtors is set to unveil residential developments valued at Rs 5,000 crore across the Mumbai Metropolitan Region by next March. With sales bookings hitting Rs 2,000 crore in the first half of the fiscal year, the company is optimistic about achieving targets, particularly with anticipated festive demand boosting sales. Their robust project pipeline includes plans worth Rs 8,000 crore, having already developed over 30 million square feet.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "19 Nov 2026, 09:26 PM IST", "pub_date_relative": "45m ago"}, {"title": "EPFO\u2019s new SWP option: Who stands to benefit from monthly PF payouts after retirement? | Explained", "full_content": "The Employees' Provident Fund Organisation's (EPFO) proposed systematic withdrawal plan (SWP) could benefit retiring subscribers who want a regular income from their provident fund savings without having to withdraw the entire accumulated corpus at once. The facility will allow eligible members to receive their retirement savings in monthly, quarterly or half-yearly instalments, while the remaining balance continues to earn returns.\n\nThe Central Board of Trustees (CBT), EPFO's apex decision-making body, approved the proposal at its 240th meeting chaired by Union Labour and Employment Minister Mansukh Mandaviya on 19 November 2026. The facility will be voluntary, giving retiring employees the flexibility to choose between a lump-sum withdrawal and periodic payouts.\n\nAround 6.32 lakh EPF members aged above 55 years with provident fund accumulations exceeding \u20b9 5 lakh are expected to be the primary beneficiaries in the initial phase, according to the Labour Ministry. The facility is also expected to benefit future retirees who want to draw a regular income from their EPF savings instead of receiving the entire amount in one go.\n\nThis could be particularly useful for employees who do not have a substantial pension or another dependable source of income after retirement. Rather than moving their entire EPF corpus into a bank deposit or another investment immediately after retirement , they can retain the unwithdrawn amount in the provident fund and receive periodic payouts.\n\nThe plan could also help retirees who are concerned about reinvestment risks. When a large retirement corpus is withdrawn at once, individuals must decide where to invest it and how much to withdraw every month. A systematic withdrawal facility could make this process more structured.\n\nUnder the SWP framework, retiring members will be able to withdraw their EPF savings at regular intervals instead of taking the entire accumulated balance as a lump sum.", "source": "LiveMint Money", "pub_date_str": "19 Nov 2026, 09:25 PM IST", "pub_date_relative": "46m ago"}, {"title": "Signature Global acquires 10-acre land parcels in Gurugram to build realty projects", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Digital Real Estate \u203a Realty News \u203a Signature Global acquires 10-acre land parcels in Gurugram to build realty projects The Economic Times daily newspaper is available online now. Read Today's Paper Signature Global acquires 10-acre land parcels in Gurugram to build realty projects SECTIONS Signature Global acquires 10-acre land parcels in Gurugram to build realty projects PTI Last Updated: Nov 19, 2026, 09:23:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Signature Global has successfully acquired two land parcels in Sohna, Gurugram, covering around 10 acres as part of its initiative to bolster its project portfolio. This strategic move complements the company\u2019s focus on expanding its footprint in lucrative regions. Recently, Signature Global also secured a substantial land bid in Raigad, Maharashtra, signaling its ambitions beyond the Delhi-NCR area.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, t on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "19 Nov 2026, 09:22 PM IST", "pub_date_relative": "49m ago"}, {"title": "Anthropic IPO could create thousands of multimillionaire employees", "full_content": "A version of this article appeared in CNBC's Inside Wealth newsletter, a weekly guide to the high-net-worth investor and consumer. Sign up to receive future editions, straight to your inbox.\n\nThe average Anthropic employee could be worth over $40 million after the company's IPO today, with over 400 employees likely to be worth over $100 million, according to SEC filings and investors.\n\nAt a share price of $83, Anthropic's market value would top $1.4 trillion, making it one of the 10 most valuable companies in the U.S. It will not only be the largest IPO in history by dollar amounts, but it is also shaping up to be one of the most rapid wealth creation events in history.\n\nFollow CNBC' s live coverage of Anthropic's IPO and Nasdaq debut\n\nAnthropic was founded just five years ago and has only 5,300 employees. According to SEC filings, the artificial intelligence company has generated 1.77 billion options for employees, with a strike price of $2.91 a share. It has also paid out over 1 billion restricted stock units.\n\nIf the stock trades at $83 a share, the combined wealth of Anthropic employees will be around $232 billion, based on their share count in the filings. The total works out to an average of $44 million per employee.\n\nYet because many of the employees are later hires, earlier employees could have supersized gains since they've accumulated more stock. According to investors in the company, at least 400 early employees will be worth $100 million or more at an $83 share price. Several could become billionaires, they said.\n\nThe employee total doesn't include the seven founders, who each own between 230 million and 240 million shares, and each will be worth around $20 billion based on an $83 share price.", "source": "CNBC Top News", "pub_date_str": "19 Nov 2026, 09:21 PM IST", "pub_date_relative": "50m ago"}, {"title": "Can Anthropic\u2019s IPO do for the stock market what Nvidia\u2019s earnings couldn\u2019t?", "full_content": "Here\u2019s the case for energy stocks in your 401(k) and why Target\u2019s comeback runs through the shoe aisle. Plus, what \u201cGTA VI\u201d means for Take-Two investors.", "source": "MarketWatch Top Stories", "pub_date_str": "19 Nov 2026, 09:21 PM IST", "pub_date_relative": "51m ago"}, {"title": "Palo Alto's raised sales forecast powers rally in cybersecurity stocks", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Palo Alto's raised sales forecast powers rally in cybersecurity stocks Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Palo Alto's raised sales forecast powers rally in cybersecurity stocks SECTIONS Palo Alto's raised sales forecast powers rally in cybersecurity stocks Reuters Last Updated: Nov 19, 2026, 09:20:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Palo Alto Networks recently announced its acquisition of AI startup Applied Compute for $4.5 billion. The company raised its annual forecast, which positively influenced various cybersecurity stocks. Investors are increasingly focused on cybersecurity due to the rise of AI-enabled cyberattacks and recent technology outages. Shares of other cybersecurity firms have surged in response to Palo Alto's optimistic outlook. The Nasdaq composite also enjoyed gains ahead of Anthropic's market debut.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "19 Nov 2026, 09:20 PM IST", "pub_date_relative": "51m ago"}, {"title": "GTA VI Has Employees Booking Leave Across The World. Guess Which Country Is Leading", "full_content": "India ranks fourth globally, with leave bookings 45% higher than last year. Gen Z employees and finance teams recorded sharper increases.", "source": "NDTV Profit", "pub_date_str": "19 Nov 2026, 09:18 PM IST", "pub_date_relative": "53m ago"}, {"title": "India needs $430 billion in exports in five months to meet FY27 target: Piyush Goyal", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a India needs $430 billion in exports in five months to meet FY27 target: Piyush Goyal The Economic Times daily newspaper is available online now. Read Today's Paper India needs $430 billion in exports in five months to meet FY27 target: Piyush Goyal SECTIONS India needs $430 billion in exports in five months to meet FY27 target: Piyush Goyal ANI Last Updated: Nov 19, 2026, 09:14:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India requires approximately USD 430 billion in exports from November to March to meet its ambitious target. By the end of October, the country had achieved 57 percent of its export goal for 2026-27. October exports reached an all-time high of nearly USD 90 billion, which reflects substantial growth. Union Commerce Minister Piyush Goyal proposed a target of USD 1 trillion for this fiscal year.\n\nHidden export winners: The unlikely products finding real buyers abroad\n\nIndia\u2019s USD25 bn copper drive moves from building smelters to securing mines\n\nWhy IndiGo could land a sharp rebound in profit despite a sluggish aviation market\n\nGold still rules, but with a difference: How young India is redefining wedding jewellery\n\nKYC and KYB: Pidilite\u2019s business has more tailwinds than headwinds, but a continuous test called raw material prices \u2013 Concluding part\n\nTariffs, supply snags and a war: 6 sectors that pulled it off through all of the trouble\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "19 Nov 2026, 09:14 PM IST", "pub_date_relative": "57m ago"}], "cfa": [{"title": "Nasdaq gains on strong Anthropic debut, but the broader market is lower: Live updates", "full_content": "The Nasdaq Composite traded higher, while the broader market declined on Thursday as the Anthropic IPO revived some enthusiasm around the artificial intelligence trade.\n\nThe tech-heavy Nasdaq last traded up 0.2% while the S&P 500 shed 0.3%. The Dow Jones Industrial Average lost 505 points, or 1%. At their peak, the Nasdaq and S&P 500 were up 2.1% and 1.3%, respectively, while the Dow rose more than 200 points, or 0.5%.\n\nKey technology stocks were higher. Chipmakers Nvidia and Micron Technology added more than 1% and more than 3%, respectively. Tech giant Microsoft moved up more than 1%, while neocloud CoreWeave traded up around 2%.\n\nAdvanced Micro Devices , however, lost more than 10% after Hunterbrook Capital disclosed a short position in the name, pointing to possible U.S. export control breaches that involve China.\n\nInvestors sold their shares outside of the tech sector on Thursday, with some of those people likely raising funds to participate in the Anthropic debut. Healthcare stocks such as Johnson & Johnson and Merck , each fell almost 3%, weighing on the Dow. Others like retailer Walmart declined nearly 2%.\n\nTraders are focused on how the company behind Claude performs when it debuts on the Nasdaq, trading under the ticker ANT. The artificial intelligence company priced its initial public offering at $83 a share, above the expected range.\n\nAnthropic is set to pop 25% when it opens for trading, according to indications from the perpetual futures markets. Retail trader demand is expected to be even stronger than seen during SpaceX, according to Vanda Research.\n\nAnthropic also upsized the offering, selling around 980 million shares, bringing the amount raised to $81.3 billion and surpassing SpaceX , which held a record IPO in June.", "source": "CNBC Top News", "pub_date_str": "19 Nov 2026, 10:05 PM IST", "pub_date_relative": "6m ago", "cfa_topics": ["Economics", "Corporate Issuers", "Equity Investments", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Anthropic indicated at $110 per share, source says: IPO live updates", "full_content": "Anthropic is set for its long-awaited Nasdaq debut on Thursday, after the artificial intelligence lab raised over $81 billion in a record IPO , surpassing SpaceX 's offering in June.\n\nThe Claude creator sold 980 million shares at $83 a piece on Wednesday, lifting the size and price of its offering. Its fully diluted market cap sits at around $1.5 trillion.\n\nThe 5-year-old company captivated the corporate world with its Claude AI models and products, which have fueled its meteoric rise this year. Anthropic said in its prospectus that it generated $33.24 billion in revenue for the nine months ended Sept. 30, up a staggering 1,200% from the same period last year.\n\nAnthropic CEO Dario Amodei co-founded the company in 2021 after he and a small group of researchers defected from OpenAI , now its chief rival. Anthropic has faced sharp criticism over its positions on safety, regulation and national security, including by President Donald Trump and other senior government officials.\n\nCNBC's reporters are covering Anthropic's IPO live on air and online from our bureaus in San Francisco and Englewood Cliffs, New Jersey, and from the Nasdaq in New York City.\n\nAnthropic is indicated to open at $110 a share, a person familiar told CNBC.\n\nAmodei told JPMorgan Chase CEO Jamie Dimon in a fireside chat on Friday that he thinks talent and culture are the \"most important things\" that drive a company's success, which is why he and his co-founders have tried to place so much emphasis on those areas at Anthropic.\n\nAnthropic requires every employee to pass a culture interview, which is taken very seriously, Amodei said. He added that he spends roughly half of his time focusing on talent and culture at the company.", "source": "CNBC World Economy", "pub_date_str": "19 Nov 2026, 10:03 PM IST", "pub_date_relative": "8m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Anthropic IPO: Investors who flip the stock may face brokerage penalty", "full_content": "Retail investors with access to Anthropic's initial public offering who sell the stock quickly after buying could get penalized by their brokerage firm.\n\nAnthropic said in an IPO prospectus that it expected to make shares available to retail investors through various brokerages, including Charles Schwab , Fidelity, Robinhood , SoFi , E*Trade and some of their respective affiliates.\n\nFollow CNBC' s live coverage of Anthropic's IPO and Nasdaq debut\n\nThese broker-dealers have different \"anti-flipping\" policies meant to discourage investors who purchase IPO shares \u2014 including those of Anthropic \u2014 from dumping them quickly. Charles Schwab is the only one that doesn't have such a policy in place.\n\n\"One purpose is to discourage 'flippers' who are just buying with the hope of making a quick profit,\" Jay Ritter, director of The IPO Initiative at the University of Florida, said in an email. \"Their selling could put downward pressure on the price once trading starts.\"\n\nInvestors who run afoul of anti-flipping rules may be prohibited from accessing future IPOs, perhaps for several months or even more than a year for repeat offenders. In the worst case, the brokerage may bar them from all future IPOs.\n\nThese policies apply only to retail investors who place an order with their brokerage firm to buy the Anthropic IPO at its offering price \u2014 something many investors don't have access to.\n\nFor example, Fidelity customers are eligible to participate in the Anthropic IPO if they have at least $25,000 in certain assets, the firm said . Even then, customers are \"evaluated and ranked\" based on factors like account assets to determine who can access limited shares that may be available, it said .", "source": "CNBC Top News", "pub_date_str": "19 Nov 2026, 10:01 PM IST", "pub_date_relative": "10m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "8th Pay Commission: Will govt pensioners get a minimum monthly pension of \u20b945,000? Here's what the latest demand means", "full_content": "8th Pay Commission: A government pension of \u20b9 22,450 could rise to \u20b9 30,083 a month if a fresh proposal before the 8th Pay Commission is accepted. Bharat Pensioners Samaj wants the minimum monthly pension raised to \u20b9 45,000, the pension rate increased from 50% to 67% of last pay drawn, and family pension lifted from 30% to 50%.\n\nThe proposal could mean an additional \u20b9 7,633 a month for a retired employee drawing a last basic salary of \u20b9 44,900. For pensioners on lower salaries, the proposed \u20b9 45,000 minimum could prove even more significant.\n\nBut the demands are far from settled. The 7th Pay Commission had rejected a similar proposal to increase pension rates, arguing that successive pay revisions already improved retirement benefits. The 8th CPC must now weigh the case for higher payouts against the cost to government finances.\n\nThe BPS memorandum to the 8th CPC puts forward three key changes:\n\nThe demand for a higher pension rate is not new. Pensioners had made a similar representation to the 7th CPC, which considered the proposal but decided against increasing the existing rates.\n\nThe 7th CPC had argued that pension benefits had already been improved under the 6th CPC. The earlier revision removed the requirement of 33 years of qualifying service and ensured that pension was calculated at 50% of the last pay or average emoluments over the final 10 months, whichever was more beneficial.\n\nIt also pointed out that regular salary revisions would automatically increase the last pay drawn and, consequently, the pension amount.\n\nThe proposed increase from 50% to 67% could make a noticeable difference to monthly retirement income.", "source": "LiveMint Money", "pub_date_str": "19 Nov 2026, 10:00 PM IST", "pub_date_relative": "11m ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Gold's bad year is getting worse. Why its price keeps falling", "full_content": "Precious metals investors can be forgiven if they feel like the past year has given them whiplash.\n\nFollowing a torrid run, which saw the price of gold hit new records 53 times in 2025, gold hit a historic high of $5,589.38 an ounce on Jan. 28, only to take an almost equally historic nosedive. On Wednesday, gold fell below $3,800 for the first time since September 2025, roughly a third below its peak.\n\nA convergence of factors pushed gold to historic highs earlier this year, according to Suki Cooper, global head of commodities research at Standard Chartered, the London-based multinational bank. Now a different convergence is bringing the price down.\n\nWhich role it plays depends on the factors dominating the market and the psyche of investors, and right now, it's the currency argument that is bringing the precious metal down.\n\nCooper said gold's climb began with strong physical demand that started in 2022 and raised the floor under prices. A second phase followed as investors rethought gold's place in their portfolios. With the cost of holding a non-yielding asset falling, they started thinking about the metal for the longer term. That, Cooper said, marked a turnaround.\n\nUntil early 2025, Cooper said, long-term investors, especially those in gold-backed exchange-traded funds, had been cutting their exposure, which effectively added supply to the market. Last year, that reversed: ETF holdings, led by the SPDR Gold Shares ( GLD ), rose by roughly 800 tons and helped absorb the market's excess supply.\n\n\"There was a lot of one-way interest, a lot of appetite to buy but not to sell,\" Cooper said.\n\nWith selling in the secondary market staying muted, prices kept rising. By the end of 2025, net ETF holdings had passed 4,000 tons. Globally, gold ETFs had their strongest year ever for inflows, $89 billion, led by North America, according to the World Gold Council, with assets more than doubling to $559 billion in total.", "source": "CNBC Top News", "pub_date_str": "19 Nov 2026, 09:59 PM IST", "pub_date_relative": "12m ago", "cfa_topics": ["Alternative Investments", "Portfolio Management"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Palo Alto stock jumps on earnings beat and company's big bet on securing open-weight models", "full_content": "Palo Alto Networks shares rose 6% on Thursday as businesses boosted spending on cybersecurity products and investors cheered the company's acquisition of a startup that pushes it into securing open-weight artificial intelligence models.\n\nThe company beat Wall Street's estimates for the fiscal first quarter. Revenue jumped 39% from a year ago and Palo Alto boosted its guidance for the year.\n\nRecent outages at Microsoft , banks and the Federal Aviation Administration have left businesses reeling. While U.S. officials haven't detected any malicious activity, the disruptions raise concerns over aging equipment and infrastructure. Many businesses are scrambling to patch vulnerabilities at a faster clip than ever before to keep pace with the growing risks of AI-powered cyberattacks.\n\nThose fears have led more businesses to consolidate platforms, which is fueling growth in areas like firewall and AI security, Palo Alto Networks CEO Nikesh Arora told CNBC's \" Mad Money \" on Wednesday.\n\n\"They're going to have to make sure they get the best players in the market to come support them because this is no longer child's play,\" Arora said.\n\nAlongside earnings, Palo Alto announced a $4.5 billion deal to buy Applied Compute, a startup that helps train customized open-weight models. It's one of several recent deals in Arora's aggressive acquisition spree and marks a significant shift beyond cybersecurity.\n\n\"Rather than being one player out of 10 in the industry serving compute, we want to be the one player with Palo Alto that delivers secure compute and security capability,\" Arora told CNBC.\n\nPalo Alto expects the deal to add more than $1 billion in annual recurring revenue to its next-generation security business by the 2029 fiscal year.", "source": "CNBC Top News", "pub_date_str": "19 Nov 2026, 09:58 PM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "A CoreWeave co-founder just made an unconventional $30 million wager on its battered bonds", "full_content": "While executives typically buy shares to signal confidence, CoreWeave co-founder Brian Venturo is turning to the bond market to calm AI jitters.", "source": "MarketWatch Top Stories", "pub_date_str": "19 Nov 2026, 09:57 PM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Anthropic IPO Live Updates: Shares Indicated To Open At $110 Each, 32% Above IPO Price", "full_content": "Follow our live blog for the latest updates on Anthropic listing, stock performance, analyst ratings and investor sentiment.", "source": "NDTV Profit", "pub_date_str": "19 Nov 2026, 09:56 PM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "AMD falls on short-seller report of alleged China exposure", "full_content": "Shares of chipmaker Advanced Micro Devices were down about 7% Wednesday after investment firm Hunterbrook Media issued a report alleging that the company \"has its own China problem.\"\n\nHunterbrook disclosed that it had taken a short position in AMD.\n\nThe report claims that \"after the U.S. blacklisted Chinese server maker IEIT Systems, the company kept getting newer AMD firmware, which enables AMD chips to run in servers.\"\n\nHunterbrook also said that new export rules in Washington could \"tighten restrictions on AMD's foreign business,\" alleging that AMD \"bills over 20% of its revenue to customers in China and Hong Kong,\" and \"depends on a Chinese partner to finish most of its chips.\"\n\nAMD, 1-day The allegations come amid investigations of rival chipmaker Nvidia over its sales to companies in Asia with ties to China. AMD has been viewed as beneficiary of the uncertainty surrounding Nvidia.\n\nLisa Su, CEO of AMD, said on the company's recent earnings call that China is an \"important\" market and that the semiconductor giant wants to be fully compliant with U.S. export controls.", "source": "CNBC Top News", "pub_date_str": "19 Nov 2026, 09:54 PM IST", "pub_date_relative": "17m ago", "cfa_topics": ["Economics", "Financial Statement Analysis"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Helmerich & Payne Q4 2026 slides: margins beat despite impairment hit", "full_content": "", "source": "Investing.com News", "pub_date_str": "19 Nov 2026, 09:54 PM IST", "pub_date_relative": "17m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Bitrue Among the First CEXs to Support ANTx as Anthropic Debuts on Nasdaq", "full_content": "", "source": "Investing.com News", "pub_date_str": "19 Nov 2026, 09:53 PM IST", "pub_date_relative": "18m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Anthropic IPO Live: AI Giant Prepares to Start Trading Stock at $83 a Share - WSJ", "full_content": "Anthropic IPO Live: AI Giant Prepares to Start Trading Stock at $83 a Share WSJ Anthropic to Start Trading After Record-Setting IPO: Live Updates The New York Times Anthropic IPO Live Updates: Nasdaq Futures Up Nearly 2%\u2014As Shares Could Pop 25% In Debut Forbes Anthropic Pushes the Reset Button for AI WSJ Anthropic IPO live: Claude maker goes public on Nasdaq after record share offering Reuters", "source": "Google News Business", "pub_date_str": "19 Nov 2026, 09:50 PM IST", "pub_date_relative": "22m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Derivatives"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Anthropic shares indicated to open 33% higher at $110", "full_content": "AI giant to begin trading after raising $81bn in record IPO", "source": "FT Markets", "pub_date_str": "19 Nov 2026, 09:49 PM IST", "pub_date_relative": "22m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Alphabet Shares Spike Nearly 5% After Opening Bell. Here's The Anthropic Link To It", "full_content": "Alphabet shares gained more than 4% as Anthropic's $83 IPO price put an estimated $149 billion value on Google's stake in the Claude developer, drawing attention to the returns from its AI investments.", "source": "NDTV Profit", "pub_date_str": "19 Nov 2026, 09:46 PM IST", "pub_date_relative": "25m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "We\u2019re in our 50s and terrified of a market crash. Should we put $400,000 of our $1 million retirement savings into an annuity?", "full_content": "\u201cWe have a house worth $450,000. Our combined annual income is $125,000.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "19 Nov 2026, 09:45 PM IST", "pub_date_relative": "27m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Stocks making the biggest moves Thursday: Palo Alto Networks, Take-Two Interactive, AMD, Walmart & more", "full_content": "Palo Alto Networks popped in early trading Thursday, boosted by quarterly results that beat analyst expectations. AMD, meanwhile, tumbled on the back of a short seller report.\n\nFollow along as CNBC covers the biggest stock market moves of the day.\n\nNeocloud CoreWeave gained 1% on enthusiasm from the Anthropic IPO plus a change in Texas permitting that favors data center development.\n\nTexas officials started issuing air permits again for data center construction projects, according to Reuters , which bodes well for the future of the physical component of the AI buildout.\n\nNvidia's highly anticipated earnings call earlier this week also offered clarity on the leadership direction for the firm, which Wall Street analysts responded positively to. Analysts at Truist were encouraged on Tuesday by Nvidia statements on the call about its relationship to neoclouds.\n\n\"Notably, NVIDIA's earnings commentary \u2026 [described] neoclouds as an 'increasingly important' part of the global AI infrastructure ecosystem and stating that it will continue working with and supporting leading neocloud partners, while becoming more disciplined and selective in that support.\"\n\nAMD shares tumbled more than 9% after Hunterbrook Capital revealed it took a short position on the company.\n\nIn a post titled \"AMD has its own China problem\", Hunterbrook alleges that \"AMD firmware keeps turning up at a blacklisted Chinese company and three companies tied to it, just as U.S. export restrictions are scheduled to expand.\"", "source": "CNBC Top News", "pub_date_str": "19 Nov 2026, 09:35 PM IST", "pub_date_relative": "36m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "EPFO looks beyond bonds and ETFs, approves up to 3% of inflows in Alternate Investment Funds", "full_content": "The EPFO's Central Board of Trustees on 19 November gave in-principle approval for the retirement fund body to invest up to 3% of its fresh inflows in eligible Alternative Investment Funds (AIFs). The investments will initially be routed through government-backed entities and will fall within EPFO's existing investment limit. The move aims to diversify its portfolio while ensuring adequate safeguards and oversight, the Ministry of Labour & Employment said.\n\nThe decision was announced in the board meeting chaired by Mansukh Mandaviya, Union Minister for Labour & Employment.\n\n\"Globally, long-term capital pools such as endowment funds have broadened their portfolios beyond traditional investments into private equity, venture capital and other alternative assets, and this move reflects a similar principle. It signals growing confidence in AIFs as an asset class and can channel capital into India\u2019s growth story,\u201d Shrikant Goyal, Managing Director, Getfive Funds told Livemint.\n\nThe board also approved a Systematic Withdrawal Plan (SWP), allowing members to withdraw their PF savings in instalments. It reduced the minimum balance requirement for final withdrawals from 25% to 10% and cut the waiting period from 12 months to two months.\n\nThe board also eased EDLI exemption renewal rules, approved voluntary contributions through UAN and reviewed progress in speeding up automated claim settlements.\n\nAIFs are privately pooled investment vehicles that collect money from investors and deploy it in assets such as start-ups, unlisted companies, private equity and infrastructure projects. Unlike conventional mutual funds, they can invest in a wider range of assets, including businesses that are not listed on stock exchanges.", "source": "LiveMint Money", "pub_date_str": "19 Nov 2026, 09:34 PM IST", "pub_date_relative": "37m ago", "cfa_topics": ["Alternative Investments", "Portfolio Management"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Amundi CIO says not bearish on France bonds, AI at the start of repricing", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Amundi CIO says not bearish on France bonds, AI at the start of repricing Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Amundi CIO says not bearish on France bonds, AI at the start of repricing SECTIONS Amundi CIO says not bearish on France bonds, AI at the start of repricing By Reuters Last Updated: Nov 19, 2026, 09:31:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Amundi has chosen a reserved approach towards French government bonds, amidst climbing yields and worries regarding fiscal management. Chief Investment Officer Vincent Mortier expressed a preference for bonds from nations with lower debt-to-GDP ratios and shorter maturities. He also highlighted a potential future interest in Japanese government bonds, as local investors may re-enter the market.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Pric hieving targets, particularly with anticipated festive demand boosting sales. Their robust project pipeline includes plans worth Rs 8,000 crore, having already developed over 30 million square feet.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "19 Nov 2026, 09:26 PM IST", "pub_date_relative": "45m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "EPFO\u2019s new SWP option: Who stands to benefit from monthly PF payouts after retirement? | Explained", "full_content": "The Employees' Provident Fund Organisation's (EPFO) proposed systematic withdrawal plan (SWP) could benefit retiring subscribers who want a regular income from their provident fund savings without having to withdraw the entire accumulated corpus at once. The facility will allow eligible members to receive their retirement savings in monthly, quarterly or half-yearly instalments, while the remaining balance continues to earn returns.\n\nThe Central Board of Trustees (CBT), EPFO's apex decision-making body, approved the proposal at its 240th meeting chaired by Union Labour and Employment Minister Mansukh Mandaviya on 19 November 2026. The facility will be voluntary, giving retiring employees the flexibility to choose between a lump-sum withdrawal and periodic payouts.\n\nAround 6.32 lakh EPF members aged above 55 years with provident fund accumulations exceeding \u20b9 5 lakh are expected to be the primary beneficiaries in the initial phase, according to the Labour Ministry. The facility is also expected to benefit future retirees who want to draw a regular income from their EPF savings instead of receiving the entire amount in one go.\n\nThis could be particularly useful for employees who do not have a substantial pension or another dependable source of income after retirement. Rather than moving their entire EPF corpus into a bank deposit or another investment immediately after retirement , they can retain the unwithdrawn amount in the provident fund and receive periodic payouts.\n\nThe plan could also help retirees who are concerned about reinvestment risks. When a large retirement corpus is withdrawn at once, individuals must decide where to invest it and how much to withdraw every month. A systematic withdrawal facility could make this process more structured.\n\nUnder the SWP framework, retiring members will be able to withdraw their EPF savings at regular intervals instead of taking the entire accumulated balance as a lump sum.", "source": "LiveMint Money", "pub_date_str": "19 Nov 2026, 09:25 PM IST", "pub_date_relative": "46m ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Signature Global acquires 10-acre land parcels in Gurugram to build realty projects", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Digital Real Estate \u203a Realty News \u203a Signature Global acquires 10-acre land parcels in Gurugram to build realty projects The Economic Times daily newspaper is available on ic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Anthropic IPO could create thousands of multimillionaire employees", "full_content": "A version of this article appeared in CNBC's Inside Wealth newsletter, a weekly guide to the high-net-worth investor and consumer. Sign up to receive future editions, straight to your inbox.\n\nThe average Anthropic employee could be worth over $40 million after the company's IPO today, with over 400 employees likely to be worth over $100 million, according to SEC filings and investors.\n\nAt a share price of $83, Anthropic's market value would top $1.4 trillion, making it one of the 10 most valuable companies in the U.S. It will not only be the largest IPO in history by dollar amounts, but it is also shaping up to be one of the most rapid wealth creation events in history.\n\nFollow CNBC' s live coverage of Anthropic's IPO and Nasdaq debut\n\nAnthropic was founded just five years ago and has only 5,300 employees. According to SEC filings, the artificial intelligence company has generated 1.77 billion options for employees, with a strike price of $2.91 a share. It has also paid out over 1 billion restricted stock units.\n\nIf the stock trades at $83 a share, the combined wealth of Anthropic employees will be around $232 billion, based on their share count in the filings. The total works out to an average of $44 million per employee.\n\nYet because many of the employees are later hires, earlier employees could have supersized gains since they've accumulated more stock. According to investors in the company, at least 400 early employees will be worth $100 million or more at an $83 share price. Several could become billionaires, they said.\n\nThe employee total doesn't include the seven founders, who each own between 230 million and 240 million shares, and each will be worth around $20 billion based on an $83 share price.", "source": "CNBC Top News", "pub_date_str": "19 Nov 2026, 09:21 P
