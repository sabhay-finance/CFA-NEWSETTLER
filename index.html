 Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "17 Oct 2026, 09:32 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "UK dividend payments jump 14% in a year", "full_content": "Banks and miners lead payouts to investors", "source": "FT Markets", "pub_date_str": "17 Oct 2026, 09:30 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Stocks are risky right now \u2014 but so are all the alternatives", "full_content": "The value of stocks can fall suddenly in a way that cash can\u2019t. But introduce inflation and it\u2019s a different equation", "source": "FT Markets", "pub_date_str": "17 Oct 2026, 09:30 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Wall Street Week Ahead: As AI rally wobbles, stock market's spotlight turns to earnings", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Wall Street Week Ahead: As AI rally wobbles, stock market's spotlight turns to earnings Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Wall Street Week Ahead: As AI rally wobbles, stock market's spotlight turns to earnings SECTIONS Wall Street Week Ahead: As AI rally wobbles, stock market's spotlight turns to earnings Reuters Last Updated: Oct 17, 2026, 09:29:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Investor confidence in the market is wavering due to recent declines in AI-linked stocks and semiconductor firms. Upcoming quarterly results from major players, including Meta Platforms, are being closely monitored by investors. Analysts are watching whether hyperscalers can sustain profitability amid significant capital expenditures on AI infrastructure. The performance of companies such as Tesla and SpaceX will also influence market sentiment.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "17 Oct 2026, 09:29 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Brent Oil Taps $110 for First Time Since May as Middle East Risks Swirl", "full_content": "Iran-backed Houthi rebels continue to pummel Saudi Arabia with missile and drone strikes, while Russia and Ukraine exchange tit-for-tat attacks on energy infrastructure.", "source": "NDTV Profit", "pub_date_str": "17 Oct 2026, 09:26 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Trump Eases Russian Oil Sanctions That Could Have Triggered 100% Tariffs On India", "full_content": "US President Donald Trump signed the order using the waiver power written into the Lindsey O. Graham Sanctioning Russia and Iran Act of 2026.", "source": "NDTV Profit", "pub_date_str": "17 Oct 2026, 09:25 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "8th pay commission: DA merger, salary hike, fitment factor, inflation adjustment \u2014 Top 5 demands from employee groups", "full_content": "The 8th central pay commission (CPC) is in its consultation stage, gathering inputs from central government employees and pensioner groups, unions and stakeholders before it makes its final recommendations in May next year.\n\nIt is expected to examine and recommend changes that are desirable and feasible in the emoluments, including pay (usually includes salary structure, pay matrix, fitment factor), allowances (usually include DA, DR, HRA), other facilities / benefits, in cash or kind (includes increment, promotions, etc.).\n\nThe decisions are set to benefit more than 1 crore people, including around 50 lakh central government employees and about 65 lakh pensioners, including personnel and retirees with the defence and railway ministries.\n\nThe commission has scheduled an official state visit to Mumbai on 22-23 October to hold meetings with employee unions, representatives, groups, pensioner associations, federations, and other stakeholders.\n\nMultiple employee unions and representative groups have demanded that the Centre make an official announcement on DA merger . This is because the 7th CPC stipulated that DA may be merged with basic salary if it exceeds 50% and as of the last update, the component now comprises 60% of basic pay.\n\nNotably, the government has not officially announced a DA merger (which would expand basic pay) as of June 2026, the issue has gained traction because basic salary determines other components of compensation i.e. provident fund contribution, pension, allowances, gratuity, and more. Thus, higher DA and by association basic pay means increase in overall salary and linked allowances.\n\nThe big employee groups including the National Council \u2014 Joint Consultative Machinery (NC-JCM), the Maharashtra Old Pension Organisation and the All India Defence Employees Federation (AIDEF) have demanded hike in the minimum basic pay for central government employees.", "source": "LiveMint Money", "pub_date_str": "17 Oct 2026, 09:19 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Corporate Issuers", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "India notifies first New Zealand FTA duty cuts; sheep meat gets zero duty, kiwi fruit at 15%", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a India notifies first New Zealand FTA duty cuts; sheep meat gets zero duty, kiwi fruit at 15% The Economic Times daily newspaper is available online now. Read Today's Paper India notifies first New Zealand FTA duty cuts; sheep meat gets zero duty, kiwi fruit at 15% SECTIONS India notifies first New Zealand FTA duty cuts; sheep meat gets zero duty, kiwi fruit at 15% ET Online Last Updated: Oct 17, 2026, 10:10:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India has notified the first set of customs duty concessions for imports from New Zealand under their free trade agreement, effective October 20. The preferential rates cover products such as wine, manuka honey, kiwi fruit and sheep meat, with limited quantities of select goods allowed under tariff-rate quotas and dairy and other sensitive sectors excluded.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\nUS mid-term elections \u2013 Part 2: What does it mean for Trump to lose control of Congress?\n\nThe ABCD of the US mid-term elections \u2013 Part 1: Why it matters across the globe\n\nCurbing rupee bets: What the RBI\u2019s new rules mean for the hedge-now-or-wait question\n\nBrinjal, buffalo, bacteria: Inside India\u2019s pay-for-nature system\n\nHomebuyers wait as NCLT panel picks holes in unfinished Jaypee projects\n\nThe NBFC saga - Part 3: How one default in 2018 changed the way RBI reads risk", "source": "Economic Times Economy", "pub_date_str": "17 Oct 2026, 09:19 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Jio\u2019s $3.2 billion IPO tests Ambani appeal with young Indians", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a Jio\u2019s $3.2 billion IPO tests Ambani appeal with young Indians Reliance Industries Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Jio\u2019s $3.2 billion IPO tests Ambani appeal with young Indians SECTIONS Jio\u2019s $3.2 billion IPO tests Ambani appeal with young Indians By Hemal Savai, Ashutosh Joshi , Bloomberg Last Updated: Oct 17, 2026, 09:18:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment For generations of Indians, Reliance Industries Ltd. was their introduction to the stock market. Founder Dhirubhai Ambani drew middle-income savers into shares, building a following that endured for decades. Nearly fifty years after Reliance went public, his billionaire son Mukesh and grandson Akash are preparing to list the group\u2019s telecom and digital services arm in what is set to be India\u2019s biggest initial public offering. Jio Platforms Ltd. plans to raise about $3.2 billion in the offering, which opens on Oct. 21. The IPO will test how much the Reliance brand still matters to retail investors. Jio is pitching to a very different market from the one Dhirubhai knew. India now has more than 130 million registered stock-market investors, nearly 40% of them under 30, according to National Stock Exchange of India data. Thousands of stocks, a vast array of mutual funds and other assets compete for their money. Older shareholders regarded Reliance as a stock they could hold for decades. For younger investors, growth, profits and valuation play a bigger role in the investment decision. Mahendra Chheda, 69, started as a floor trader in the late 1960s before becoming a member of the Bombay Stock Exchange.", "source": "Economic Times Markets", "pub_date_str": "17 Oct 2026, 09:18 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "SGB 2020-21 Series VII: Investors to pocket 192% gains on premature redemption; RBI fixes October 19 date", "full_content": "The Reserve Bank of India ( RBI ) has fixed the premature redemption price of Sovereign Gold Bond (SGB) 2020-21 Series VII at \u20b9 14,614 per gram. The due date for premature redemption of this tranche is fixed at October 19, 2026 (Monday), as October 20 is a holiday on account of Dussehra.\n\nSovereign Gold Bonds are government securities denominated in grams of gold and issued by the RBI on behalf of the Government of India. They allow investors to benefit from movements in gold prices without physically holding the metal.\n\nIn addition to potential price appreciation, these gold bonds offer fixed interest of 2.5% per annum on the initial investment amount.\n\nAccording to the RBI's press release on Friday, \u201cpremature redemption of Gold Bond may be permitted after fifth year from the date of issue of such Gold Bond on the date on which interest is payable.\u201d\n\nAccordingly, the premature redemption date for the SGB 2020-21 Series VII tranche is October 19, 2026, since October 20 is a holiday.\n\nThe redemption price is determined using the simple average of the closing prices of 999-purity gold over the three preceding business days, as published by the India Bullion and Jewellers Association Ltd (IBJA).\n\n\u201cThe redemption price for premature redemption due on October 19, 2026 (October 20, 2026, being a holiday), shall be \u20b9 14,614/- (Rupees Fourteen Thousand Six Hundred and Fourteen Only) per unit of SGB based on the simple average of closing price of gold for the three business days, i.e., October 14, October 15, and October 16, 2026,\u201d according to the release.\n\nAccording to the Ministry of Finance's October 9, 2020, release, the original issue price of SGB 2020-21 Series VII was set at \u20b9 5,051 per gram. Investors who applied and paid digitally received a \u20b9 50-per-gram discount, bringing their purchase price to \u20b9 5,001.", "source": "LiveMint Money", "pub_date_str": "17 Oct 2026, 09:16 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income", "Alternative Investments"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "DA hike after Dussehra: Will central government employees get good news in October? - What we know so far", "full_content": "Central government employees and pensioners are awaiting the announcement of the dearness allowance (DA) hike for July 2026. The central government did not announce the increase in its cabinet meeting on 14 October.\n\nThough the cabinet announced a performance-linked bonus (PLB), or annual bonus, for all Railway employees, it did not announce any decision on the much-awaited DA hike.\n\nThis has left employees hoping for a decision on the dearness allowance at the next cabinet meeting, which is likely scheduled for 21 October, a day after Dussehra. Still, it is important to note that the government has not officially confirmed the announcement date.\n\nFor example, the last DA hike was announced on a Saturday (18 April). Before that, it was announced on Wednesday (1 October 2025) after a cabinet meeting. Prior to that, on a Saturday (28 March 2025), the government announced the January 2025 DA hike.\n\nThat is why the upcoming 21 October meeting is a possible opportunity, but the central government employees should not treat it as a confirmed announcement date or deadline.\n\nThe current DA rate for serving central government employees is 60% of basic pay. This allowance is revised twice a year . Generally, it is done with effect from January and July to help employees manage inflation, boost their purchasing power and meaningfully improve their livelihoods.\n\nFurthermore, the July 2026 revision is calculated using the 12-month average of the All India Consumer Price Index for Industrial Workers (AICPI-IW) from July 2025 to June 2026. Based on the available data and historical trends, the DA rate could rise to approximately 63%, thus implying a potential increase of three percentage points.\n\nStill, this is just a tentative number, with the final rate yet to be confirmed by the central government. Further clarity on this will emerge only after the central government announces its decision. Till then, the expected increase remains an estimate rather than an official figure.", "source": "LiveMint Money", "pub_date_str": "17 Oct 2026, 08:33 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Trump exempts Russia from further sanctions mandated by new law", "full_content": "US president gives Putin a reprieve on threatened energy measures after cutting deal with Moscow to release diesel", "source": "FT Markets", "pub_date_str": "17 Oct 2026, 08:01 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Nepal Vs Canada Live Streaming: When And Where To Watch ICC Cricket World Cup League 2 Match Live In India", "full_content": "Check the match time, venue and official streaming options for the Nepal vs Canada fixture.", "source": "NDTV Profit", "pub_date_str": "17 Oct 2026, 08:00 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "India Post sanctions 60 days\u2019 Productivity Linked Bonus: Check employee eligibility, salary limits and calculation rules", "full_content": "India Post has announced a Productivity Linked Bonus (PLB) equivalent to 60 days\u2019 emoluments for eligible employees for the accounting year 2025-26.\n\nThe order, issued by the Department of Posts on Friday, also provides for ex-gratia bonus payments to regularly engaged Gramin Dak Sevaks (GDS) and ad hoc bonuses to eligible full-time casual labourers, including those with temporary status.\n\n\u201cThe undersigned is directed to convey the sanction of the President for payment of Productivity Linked Bonus for the Accounting year 2025-26 equivalent of emoluments of 60 (Sixty) Days,\u201d order noted.\n\nHowever, the bonus calculation is subject to prescribed salary ceilings, the number of days worked, and the employee category.\n\nAccording to the order, the bonus applies to three categories:\n\nThe Productivity Linked Bonus for regular departmental employees will be calculated using the following formula specified in the order:\n\nHere, 30.4 represents the average number of days in a month, while average emoluments refer to the eligible salary components drawn during the accounting year, subject to the prescribed ceiling.\n\nThe order states: \u201cIn case of emoluments exceeding Rs.7000/- (Rupees Seven Thousand only) in any month during the accounting year 2025-26, the emoluments shall be restricted to Rs.7000/- per month only.\u201d", "source": "LiveMint Money", "pub_date_str": "17 Oct 2026, 07:43 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "8th Pay Commission: What central government employees need to know about OPS, NPS and UPS", "full_content": "The 8th Pay Commission is now nearing 1 year since its constitution on 3 November, 2025. Over the last few months, the 3-member panel of the 8th Pay Commission has held several critical discussions and meetings in prominent states and union territories across the country, including Delhi, Ladakh, Odisha, and Bengaluru. Another key set of meetings is set to begin on 22 October in Mumbai.\n\nIn these meetings, prominent employee unions have highlighted their grievances and demands. The demands have primarily revolved around the fitment factor multiplier, salary revision, rising inflation, DA merger, employee motivation, pension reforms, and meaningful changes in the lives of serving employees and pensioners.\n\nThere are also several employee unions such as the National Council of Joint Consultative Machinery (NC-JCM), Ministerial Staff Association (MSA), Survey of India, All India NPS Employees\u2019 Federation (AINPSEF) and the Federation of National Postal Organisations (FNPO) that have urged the 8th Pay Commission to introduce meaningful changes in pensions of central government employees, with some urging for the reintroduction of the old pension scheme, whereas others are urging for the complete rollback of the National Pension System (NPS) and Unified Pension Scheme (UPS).\n\nThese demands for meaningful changes in pensions come as the 8th Pay Commission continues consultations with employee organisations and other stakeholders on salary, pension and retirement benefits.\n\nThe three-member 8th Pay Commission, headed by Justice Ranjana Prakash Desai, has just concluded its most recent meetings in Bengaluru on 8 October. It is now scheduled to hold its next round of meetings in Mumbai on October 22 and 23.\n\nFurthermore, the final report of the 8th Pay Commission is tentatively expected to be tabled by May-June 2027.", "source": "LiveMint Money", "pub_date_str": "17 Oct 2026, 07:34 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics", "Corporate Issuers", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Q2 Results Today: Axis Bank, HDFC Bank, ICICI Bank Among 18 Firms To Report Earnings On Oct. 17", "full_content": "Besides HDFC Bank, ICICI Bank and Axis Bank, the calendar also features Bajaj Healthcare, Central Bank of India, IDBI Bank, India Cements, ixigo operator LE Travenues Technology, Punjab and Sind Bank, YES Bank, among others.", "source": "NDTV Profit", "pub_date_str": "17 Oct 2026, 07:00 AM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Economics", "Financial Statement Analysis"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Sunil Singhania makes a fresh entry in this defence stock", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nBuilding a successful stock portfolio requires a clear investment strategy , well-defined financial goals and a thorough understanding of market dynamics.\n\nAs you develop your own approach, you can also draw valuable lessons from the experience and investment philosophies of seasoned market veterans.\n\nStudying their decisions can offer useful insights, but these must be balanced with your own financial objectives, risk appetite and investment horizon.\n\nOne such investor is Sunil Singhania , whose investment moves and portfolio choices attract considerable attention.\n\nSunil Singhania is the founder of Abakkus Asset Manager, an investment management company.\n\nHe has a track record of over two decades in equity markets. He played a significant role in building Reliance-Nippon MF into one of India's largest asset management companies (AMCs).\n\nSunil Singhania has picked up a stake in defence stock Bharat Earth Movers.", "source": "LiveMint Markets", "pub_date_str": "17 Oct 2026, 07:00 AM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Anthropic offers Blackstone double-digit yield in latest chip financing", "full_content": "High borrowing costs complicate AI lab\u2019s goal of achieving investment-grade status", "source": "FT Markets", "pub_date_str": "17 Oct 2026, 06:17 AM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "\u2018For global trade\u2019s sake, hope our US deal is inked soon\u2019: FM Nirmala Sitharaman", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a \u2018For global trade\u2019s sake, hope our US deal is inked soon\u2019: FM Nirmala Sitharaman The Economic Times daily newspaper is available online now. Read Today's Paper \u2018For global trade\u2019s sake, hope our US deal is inked soon\u2019: FM Nirmala Sitharaman SECTIONS \u2018For global trade\u2019s sake, hope our US deal is inked soon\u2019: FM Nirmala Sitharaman By ET Bureau Last Updated: Oct 17, 2026, 05:00:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Nirmala Sitharaman expressed optimism regarding the speedy conclusion of the India-US trade agreement during her recent interaction. She highlighted challenges in trade relations with China due to non-tariff barriers causing problems for Indian exporters. The Finance Minister advocated for promoting rupee-denominated trade settlements to assist nations experiencing hard currency shortages. Sitharaman emphasized the importance of public investment in infrastructure to bolster economic growth despite global disruptions.\n\nUS mid-term elections \u2013 Part 2: What does it mean for Trump to lose control of Congress?\n\nThe ABCD of the US mid-term elections \u2013 Part 1: Why it matters across the globe\n\nCurbing rupee bets: What the RBI\u2019s new rules mean for the hedge-now-or-wait question\n\nBrinjal, buffalo, bacteria: Inside India\u2019s pay-for-nature system\n\nHomebuyers wait as NCLT panel picks holes in unfinished Jaypee projects\n\nThe NBFC saga - Part 3: How one default in 2018 changed the way RBI reads risk\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "17 Oct 2026, 05:00 AM IST", "pub_date_relative": "6h ago", "cfa_topics": ["Economics", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Analysis: Why a $2 trillion deficit and 5% Treasury yields are becoming America's biggest economic challenge", "full_content": "Long-term bond yields above 5% and a $2 trillion deficit are giving Americans a taste of what a U.S. debt crisis would be like. A true emergency would hurt much more, and isn't baked in. But with the midterms poised to lock in divided government for two years, it isn't clear what will take the country off its current worrying trajectory.\n\nHigher interest rates exacerbated by the flood of federal debt issuance are starting to bite in some parts of the economy and threaten to worsen the government's debt problem. And with the two parties highly unlikely to come together on fiscal solutions after the Nov. 3 midterms, any fixes are years off in the future.\n\nThe housing market is showing signs of slowing as the average 30-year fixed-rate mortgage hovers around 7.5%. Pending home sales fell 4% in September, Redfin said Monday, the biggest monthly drop in three years.\n\nMortgage rates track the 10-year Treasury yield . The 10-year has climbed 114 basis points, or hundredths of a percentage point, since the end of February through midday Friday, when the 10-year traded at 5.1%.\n\nSeveral factors are pushing up the 10-year, including the war with Iran, which kicked off on Feb. 28 and precipitated the rise in long-term yields. Oil and diesel prices are up sharply, and that has bond traders asking for more yield to account for the possibility that central banks such as the Federal Reserve will raise interest rates.\n\nIn addition, investors want more compensation to hold longer-term bonds in part because they believe the U.S. government will continue to flood the market with them. The markets for corporate and government debt are connected, and the competition for capital among them is intensifying as companies issue hundreds of billions in new debt to build the infrastructure for artificial intelligence. Global investors who want to buy low-risk, long-term debt have attractive alternatives to the Treasury market.\n\nIf the U.S.", "source": "CNBC Top News", "pub_date_str": "17 Oct 2026, 04:03 AM IST", "pub_date_relative": "7h ago", "cfa_topics": ["Fixed Income", "Alternative Investments"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Apple\u2019s $1,999 iPhone Duo puts the company's status-symbol power to the test", "full_content": "Apple 's iPhone Duo , its most expensive iPhone ever, went up for preorder Friday, with launch-day pickup inventory selling out and some online delivery estimates already slipping into late January.\n\nThe company said in a statement that the preorder demand was \"nothing short of extraordinary.\"\n\n\"We are working hard to get this revolutionary new product into customers' hands as quickly as possible, and we will continue accepting orders online,\" Apple said.\n\nApple's first foldable phone starts at $1,999 and passes $3,000 at the 2TB storage tier. It is the biggest change to the physical design of the iPhone in years and establishes an entirely new price point above the Pro and Pro Max.\n\nThe early rush offers a first glimpse at the demand behind Apple's bet: Whether a dramatic new design can persuade customers to spend more and push the iPhone even further as a status symbol.\n\nBut analysts who spoke with CNBC said Apple's bet is not that foldables suddenly become a mass-market product. It is that a relatively small group of its highest-spending customers can become significantly more valuable.\n\nFoldables are expected to make up just over 2% of global smartphone units this year but nearly 7% of industry revenue, according to IDC. By 2030, IDC expects the category to account for 10% of smartphone revenue while still representing only about 3% of units.\n\nThat gap between volume and value is central to Apple's opportunity.", "source": "CNBC World Economy", "pub_date_str": "17 Oct 2026, 04:01 AM IST", "pub_date_relative": "7h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Could an Anthropic IPO put your 401(k) at risk? The AI safety debate hits a new dimension.", "full_content": "Anthropic and New York City\u2019s comptroller have opened a line of communication to discuss \u201cexistential risks\u201d posed by AI and what that could mean for the company\u2019s future stock.", "source": "MarketWatch Top Stories", "pub_date_str": "17 Oct 2026, 03:05 AM IST", "pub_date_relative": "8h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "The bond market shrugged off two inflation shocks. Why stock investors should pay attention.", "full_content": "Hot CPI and PPI data should have pushed Treasury yields higher. Instead, bond buyers stepped in to suggest yields have risen high enough to become attractive for investors.", "source": "MarketWatch Top Stories", "pub_date_str": "17 Oct 2026, 03:00 AM IST", "pub_date_relative": "8h ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Tech stocks erase $1 trillion of wealth as oil surges to $110 for the first time since May - NBC News", "full_content": "Tech stocks erase $1 trillion of wealth as oil surges to $110 for the first time since May NBC News Wall Street tumbles as worries about AI trade and high oil prices weigh Reuters Nasdaq slides 2% Friday to post worst week since June, pressured by AI sell-off and oil prices: Live updates CNBC Nasdaq sinks more than 2% as investors raise questions about AI debt CNN Welcome to the \u2018AI burnout trade\u2019 \u2014 as investors grow tired of debating tech\u2019s promises MarketWatch", "source": "Google News Business", "pub_date_str": "17 Oct 2026, 02:46 AM IST", "pub_date_relative": "8h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Don\u2019t buy this dip: Several signs suggest there\u2019s more pain ahead for tech stocks", "full_content": "Thinking of buying the dip in technology stocks? The Nasdaq Composite\u2019s technical outlook suggests don\u2019t do it \u2014 at least not yet.", "source": "MarketWatch Top Stories", "pub_date_str": "17 Oct 2026, 02:28 AM IST", "pub_date_relative": "8h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Why Bad News in the Bond Market May Be Good News for Investors - The New York Times", "full_content": "Why Bad News in the Bond Market May Be Good News for Investors The New York Times Smart Ways to Invest for Higher Rates and Sticky Inflation Kiplinger Bonds Are Breaking, the Fed Is Boxed In: Why Stocks Can Keep Rising I/O Fund Bonds once again have a license to hedge TradingView Bond Market Mayhem: History Says This Is the 1 Thing That Matters Most for Investors The Motley Fool", "source": "Google News Business", "pub_date_str": "17 Oct 2026, 02:25 AM IST", "pub_date_relative": "8h ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Major earnings reports are due next week, but strong results may not be enough to quell market fears", "full_content": "Reports from Meta Platforms and Procter & Gamble are on deck as investors grow wary of the market.", "source": "CNBC Top News", "pub_date_str": "17 Oct 2026, 02:20 AM IST", "pub_date_relative": "8h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Oil hits $110 per barrel for first time since May - The Hill", "full_content": "Oil hits $110 per barrel for first time since May The Hill Brent oil touches $110 as Iran escalates Hormuz attacks, Ukraine vows to hit Russian refineries CNBC Oil touches $110 a barrel for first time since May on Middle East, Russia supply fears Reuters Oil Futures Rise on Middle East, Russia-Ukraine Concerns WSJ Brent Oil Taps $110 for First Time Since May as Risks Swirl Bloomberg.com", "source": "Google News Business", "pub_date_str": "17 Oct 2026, 02:18 AM IST", "pub_date_relative": "8h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Prediction: Micron Could Turn $10,000 Into a Fortune by 2030 - The Motley Fool", "full_content": "Prediction: Micron Could Turn $10,000 Into a Fortune by 2030 The Motley Fool Micron Is Down 23% From Its High. History Suggests This Is What Happens Next. Yahoo Finance How Much Upside Is Left In Micron Stock? Trefis Micron: Why You Should Buy Before Dec'26 (NASDAQ:MU) Seeking Alpha Micron Stocks Fall Although $35B Buyback Window Nears TradingView", "source": "Google News Business", "pub_date_str": "17 Oct 2026, 02:15 AM IST", "pub_date_relative": "8h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Big Tech stocks suffer biggest weekly drop since \u2018liberation day\u2019", "full_content": "AI trade jitters send investors scrambling for government debt in a move that halts a months-long Treasury sell-off", "source": "FT Markets", "pub_date_str": "17 Oct 2026, 02:12 AM IST", "pub_date_relative": "9h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Why did CoreWeave stock get crushed this week? Look to this corner of the debt market for clues", "full_content": "CoreWeave\u2019s bond yields and credit default swaps have surged as its stock sells off. Here\u2019s what those credit signals mean for stock investors.", "source": "CNBC Top News", "pub_date_str": "17 Oct 2026, 02:03 AM IST", "pub_date_relative": "9h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "ITC sets board meeting date to declare Q2 results 2026; net profit may decline due to cigarette taxation \u2014 share outlook", "full_content": "Q2 results 2026: ITC informed about the board meeting date to declare Q2FY27 earnings in an exchange filing on Friday", "source": "LiveMint Markets", "pub_date_str": "17 Oct 2026, 01:59 AM IST", "pub_date_relative": "9h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "US stocks: US market ends down sharply; worries about AI trade and high oil prices weigh", "full_content": "Wall Street faced a sharp decline on Friday as AI-related technology stocks came under renewed pressure. Concerns regarding debt-laden AI infrastructure companies affected investor sentiment heading into the weekend. Additionally, a rise in oil prices fueled market fears about economic stability and rising borrowing costs. The S&P 500, Dow Jones, and Nasdaq all recorded substantial losses amid these uncertainties.", "source": "Economic Times Markets", "pub_date_str": "17 Oct 2026, 01:38 AM IST", "pub_date_relative": "9h ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Brent oil touches $110 as Iran escalates Hormuz attacks, Ukraine vows to hit Russian refineries", "full_content": "U.S. crude oil prices rose sharply Friday as Iran escalated attacks in the Strait of Hormuz this week.", "source": "CNBC Top News", "pub_date_str": "17 Oct 2026, 01:32 AM IST", "pub_date_relative": "9h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Your Social Security check will rise an average of $75 a month \u2014 will it be able to keep up with inflation?", "full_content": "The 3.6% COLA for 2027 is aimed at helping more than 68 million beneficiaries keep pace with the cost of living", "source": "MarketWatch Top Stories", "pub_date_str": "17 Oct 2026, 01:15 AM IST", "pub_date_relative": "9h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}], "updated_at": "17 Oct 2026, 11:14 AM IST", "total_stories": 356};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
