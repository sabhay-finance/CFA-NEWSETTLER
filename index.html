"full_content": "", "source": "Investing.com News", "pub_date_str": "27 Nov 2026, 03:00 PM IST", "pub_date_relative": "16m ago"}, {"title": "1 mn views on Facebook vs Instagram vs YouTube: Why 2 different paychecks? Why viewer location rules creator economy", "full_content": "Two creators get one million views each. One earns a lot. The other earns very little. This confuses many new creators. The views look the same. The money is not. The reasons lie in how each platform pays and who is watching.\n\nNote: The figures below are rough ideas, not exact rates. Earnings often vary by niche, season and platform policy. Please check current official rules before planning your income.\n\nA view means different things on each platform. On YouTube, a view often means someone chose to watch. They may have searched for your topic. On Instagram and Facebook, many views come from autoplay. People scroll fast, and a video plays for a few seconds. That counts as a view.\n\nAdvertisers care about attention. A viewer who watches fully is more useful than one who scrolls past. So, the same one million views can carry very different values.\n\nYouTube has a long-running ad revenue share. Ads run before, during, or after videos. Creators who qualify for the Partner Programme get a share of ad income. Long videos can carry more ads, so they can earn more per view.\n\nFacebook pays through in-stream ads in longer videos and through some monetisation programmes. Rules on length and eligibility apply. Reels and short clips usually earn less than longer content.\n\nInstagram has relied less on direct ad sharing. Many influencers earn mainly through brand deals, bonuses and affiliate links. A million views may bring little platform money, but it can attract sponsors.\n\nThis is the biggest reason for pay gaps. Advertisers pay more to reach people in richer markets. A viewer in the US, UK or Australia is worth more to advertisers. Those viewers have higher spending power. So, ad rates there are higher.", "source": "LiveMint Money", "pub_date_str": "27 Nov 2026, 02:57 PM IST", "pub_date_relative": "19m ago"}, {"title": "Gold ETFs vs Gold Mutual Funds: Amid ups and downs in rates, which is better instrument to buy for good returns?", "full_content": "Asit Manohar Updated 27 Nov 2026, 02:55 PM IST Prefer Livemint on Google Gold Rate Today | Gold Price Today | Gold ETFs vs Gold Mutual Funds: After hitting the 15-month low of \u20b9 1,20,750 per 10 gm on Wednesday, the MCX gold rate has been ascending for the last two straight sessions. The gold rate today in India is around \u20b9 1,25,800, which means gold prices in India have rebounded around \u20b9 6,000 from the 15-month low. In the international market, the gold price in USD has broken above the $3,600 per ounce resistance and hit an intraday high of $3,679 per ounce. Though gold prices in India are still \u20b9 55,000 below the record high of \u20b9 1,80,779 per 10 gm, investing in physical gold is not a cheaper option for most of the public. For them, gold ETFs and gold mutual funds remain a better option. However, amid a strong rebound from the 15-month low, the Aam Aadmi may find it tricky to decide which investment tool offers betterreturns.\n\nComparing the two investment tools, which can enable an Aam Aadmi to make money amid the gold price rebound from the 15-month low, Pankaj Mathpal, MD & CEO at Optima Money Managers, said, \u201cFor investing in gold ETFs, it is mandatory for an investor to have a demat account, whereas for an investor planning to invest in gold mutual funds, just having a demat account is enough. Comparatively, investing in gold ETFs is better due to the lower cost, because even when you invest in gold mutual funds, your fund manager invests in gold ETFs, charging in the form of expense ratio, making your returns a little less than the gold ETFs.\u201d\n\nPankaj Mathpal of Optima Money said that gold ETFs are better suited for a long-term investor planning to invest in the SIP mode.", "source": "LiveMint Markets", "pub_date_str": "27 Nov 2026, 02:53 PM IST", "pub_date_relative": "24m ago"}, {"title": "Gold, equity ETFs or debt mutual funds: How should investors balance their portfolios in 2027? Expert shares allocation", "full_content": "Are you looking to build a balanced investment portfolio in 2027? One of the key decisions is how much to allocate to equities, debt and gold.\n\nSince each asset class serves a different purpose, focusing on one may not be the best strategy. Equity Exchange-Traded Funds (ETFs) offer exposure to the stock market and the potential for long-term wealth creation . However, they can be volatile and are subject to short-term market fluctuations.\n\nDebt mutual funds, on the other hand, invest in fixed-income securities and add stability to a portfolio. They generally offer greater predictability and may provide a regular income stream. However, returns are not guaranteed, as they remain exposed to interest-rate and credit-related risks.\n\nGold plays a slightly different role in comparison to other asset classes. It can help diversify a portfolio and may offer a cushion during periods of market uncertainty and geopolitical turmoil. However, it does not generate regular income, and its price can fluctuate, as has been witnessed throughout this year.\n\nAdhil Shetty, CEO of BankBazaar, said investors should focus on the role each asset class plays in their portfolio rather than trying to identify the best-performing investment option.\n\n\"Rather than picking one winner, investors can look at each asset by the role it plays. Equity ETFs are typically used for long-term growth, debt mutual funds for stability, and gold for diversification. For instance, with \u20b9 1 lakh, one may first decide how much is needed for stability, then allocate for growth based on time horizon, keeping gold as a smaller portion built gradually. A moderate investor might end up with roughly \u20b9 50,000 in an equity ETF, \u20b9 40,000 in debt funds and \u20b9 10,000 in gold. The mix would vary with individual goals and risk appetite,\" Shetty explained.\n\nThe allocation discussed above can serve as a prudent starting point.", "source": "LiveMint Money", "pub_date_str": "27 Nov 2026, 02:49 PM IST", "pub_date_relative": "28m ago"}, {"title": "Silver price prediction: After 67% crash from peak, is the white metal finally close to a bottom? Key levels to watch", "full_content": "Pranati Deva Published 27 Nov 2026, 02:48 PM IST Prefer Livemint on Google Silver price prediction : Silver prices have plunged nearly 67% from their January 2026 record, but a technical chart from PL Capital suggests the metal may be approaching a zone where the steep sell-off could begin to stabilise. The brokerage's analysis identifies a potential support band of $37\u201339.50 per ounce (approximately \u20b9 1.10 lakh\u2013 \u20b9 1.17 lakh per kg), while warning that the chart does not yet confirm a sustained reversal.\n\nThe COMEX silver price was around $39.964 per ounce (approximately \u20b9 1.19 lakh per kg) and the metal has fallen from a record high of $121.60 per ounce (around \u20b9 3.61 lakh per kg) on January 29 to a low of $39.50 (around \u20b9 1.17 lakh per kg) this week. PL Capital describes this as the second-deepest fall in modern silver-market history after the 1980 crash.\n\nSilver prices staged a sharp rebound in international markets on Friday, recovering from their lowest levels in more than a year ahead of the Thanksgiving holiday on Thursday. According to a Bloomberg report, bullion was on track to post weekly gains after hitting a 15-month low earlier this week. Spot silver surged 4.6% to $43.40 per ounce.\n\nIn domestic markets, MCX silver futures jumped 6% to \u20b9 1,54,332 per kg.\n\nSilver prices have come under pressure from a combination of rising interest-rate expectations, a stronger US dollar and forced selling across financial markets. A hawkish Federal Reserve, Treasury yields above 5.1% and a dollar hovering near a 19-month high have made non-yielding precious metals less attractive.\n\nMinutes of the Fed's October meeting, released on Wednesday, indicated that almost all policymakers favoured further monetary tightening to bring inflation towards the 2% target.", "source": "LiveMint Markets", "pub_date_str": "27 Nov 2026, 02:48 PM IST", "pub_date_relative": "29m ago"}, {"title": "US tech stocks set to jump at open as volatile trading continues", "full_content": "All-powerful AI trade has been eclipsed by wild swings in a market struggling to price future earnings", "source": "FT Markets", "pub_date_str": "27 Nov 2026, 02:47 PM IST", "pub_date_relative": "30m ago"}, {"title": "Looking for equity-debt mix? These hybrid mutual funds lead in 1, 3, 5-year returns and delivered consistent money gains", "full_content": "Mutual funds offer investors various options to invest across a basket of equity and debt securities. While equity funds primarily invest in stocks and debt funds invest in bonds and government securities, hybrid funds combine the two asset classes in varying proportions. The allocation depends on the scheme's category and investment mandate.\n\nFor investors looking for a mix of equity and debt exposure, hybrid funds offer an option to participate in equity market gains while also having some exposure to relatively stable debt instruments. However, their risk and return profiles vary depending on how much they invest in each asset class.\n\nHere are the top five active hybrid mutual funds that have delivered positive returns across the 1-year, 3-year, and 5-year periods.\n\nThe table below lists hybrid fund schemes ranked by their 1-year returns. It includes only funds that have delivered positive returns over all three periods, with performance data available for each timeframe.\n\n*Source: Value Research, CAGR as on 26 November 2026, Direct active plans\n\nBank of India Aggressive Hybrid Fund leads the list with 12.29% returns over one year. However, the picture changes over longer investment horizons.\n\nBandhan Aggressive Hybrid Fund delivered the highest returns over three years at 16.14%, while Bank of India Aggressive Hybrid Fund again topped the five-year period with 14.55%.\n\nThe five funds follow different investment strategies, which also means their risk exposures are not the same. Three of the five schemes belong to the aggressive hybrid category, while HSBC Equity Savings Fund falls under the equity savings category and ABSL Balanced Advantage Fund is a balanced advantage scheme.", "source": "LiveMint Money", "pub_date_str": "27 Nov 2026, 02:46 PM IST", "pub_date_relative": "30m ago"}, {"title": "ECB Consumer Expectations Survey results \u2013 October 2026", "full_content": "In October the median rate of perceived inflation over the previous 12 months increased to 4.1% from 3.6% in September and stood at its highest level since July 2024. Median expectations for inflation over the next 12 months also rose to 3.5% from 3.1%, but remained below the level reached at the start of the conflict in March 2026 (4.0%). Median expectations for inflation three years ahead increased to 3.0% from 2.9%, returning to the March 2026 level. Median expectations for inflation five years ahead were unchanged at 2.5% for the third consecutive month, the highest level since the start of the series in August 2022. Uncertainty about expectations for inflation over the next 12 months increased for the second consecutive month, remaining higher than the level prior to the start of the conflict in the Middle East. Respondents in the bottom income quintile continued to report higher inflation perceptions and expectations, on average, than those in the top quintile. Younger respondents (aged 18-34) continued to report lower inflation perceptions and expectations than older respondents (aged 35-54 and 55-70).\n\nConsumers\u2019 expectations for nominal income growth over the next 12 months fell to 0.6% from 1.1% in September. While expectations declined across all income quintiles, the decline was most pronounced in the bottom income quintile (by 0.7 percentage points to 0.8%) and in the top quintile (by 0.8 percentage points to 0.4%). Perceived nominal spending growth over the previous 12 months increased to 5.4% from 5.3% in September, while expected nominal spending growth over the next 12 months was unchanged at 3.7%.\n\nExpectations for economic growth over the next 12 months increased in October to -1.3% from -1.5% in September. Expectations for the unemployment rate 12 months ahead decreased to 11.0% from 11.3% in September.", "source": "ECB Press", "pub_date_str": "27 Nov 2026, 02:30 PM IST", "pub_date_relative": "47m ago"}, {"title": "Gold vs silver: Precious metals prices crashed and rebounded - which of them could deliver better returns in 2027?", "full_content": "Gold vs Silver : Gold and silver have witnessed a sharp reversal in November 2026, with both precious metals tumbling from their January record highs before staging a strong rebound towards the end of the month.\n\nOn the domestic futures market, MCX gold fell around 13% in November, while silver plunged nearly 20%, as a stronger US dollar, elevated bond yields and expectations of tighter US monetary policy triggered heavy selling. However, both metals bounced back on Friday, November 27, as bargain buying and short-covering emerged after the steep correction.\n\nThe rebound was sharp in global markets, too. Spot gold rose around 2.7% to $3,663.52 per ounce on November 27, recovering from a more than one-year low hit earlier in the week.\n\nSilver climbed around 6.5% to $44.18 per ounce. On MCX, December gold futures traded around \u20b9 1,24,856 per 10 grams, up 2.37%, while silver futures rose 5.3% to \u20b9 1,53,579 per kg.\n\nDespite the recovery, both metals remain well below their January peaks, raising the question of which could offer better returns in 2027.\n\nThe outlook for precious metals in 2027 will depend significantly on the direction of US monetary policy. A moderation in inflation and easing expectations of further rate hikes could weaken the US dollar and create a supportive environment for gold and silver.\n\nGold could draw support from continued central-bank purchases, geopolitical uncertainty and sustained investment demand. According to Kaynat Chainwala, AVP \u2013 Commodity Research at Kotak Neo, central-bank demand remained robust in 2026, with official-sector purchases reaching 675 tonnes in the first nine months of the year.\n\nHowever, gold's performance in 2026 also demonstrated that geopolitical uncertainty does not always translate into higher prices. Chainwala said tensions, including the US-Iran conflict, would typically support safe-haven demand. But higher oil prices fuelled inflation concerns and expectations of tighter monetary policy.", "source": "LiveMint Markets", "pub_date_str": "27 Nov 2026, 02:24 PM IST", "pub_date_relative": "53m ago"}, {"title": "IORA nations must enhance collaboration: EAM Jaishankar", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a IORA nations must enhance collaboration: EAM Jaishankar The Economic Times daily newspaper is available online now. Read Today's Paper IORA nations must enhance collaboration: EAM Jaishankar SECTIONS IORA nations must enhance collaboration: EAM Jaishankar PTI Last Updated: Nov 27, 2026, 02:21:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis External Affairs Minister S Jaishankar highlighted the significance of the Indian Ocean for global trade and energy security. He stated that regional cooperation is vital to address the shared challenges faced by littoral states. Jaishankar emphasized that IORA must adapt to geopolitical changes and enhance its collective voice. India's theme for IORA promotes innovation and resilience in the region.\n\nHow rare is Nvidia's CEO comeback, really? The record for 20 years has an answer\n\nThe fall is new, the pattern is 11 years old: Making sense of gold's crash\n\nAs AI sharpens cyber attacks, should listed companies follow one standard in reporting them?\n\nKYC and KYB: Zydus Lifesciences \u2013 From the chemist\u2019s counter to US pharmacies. Part 1 of 3\n\nWhat would it take for the world to stop needing the Strait of Hormuz?\n\nHidden export winners: The unlikely products finding real buyers abroad\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "27 Nov 2026, 02:21 PM IST", "pub_date_relative": "55m ago"}, {"title": "Income tax deadline 30 November: Who needs to file ITR by this date? Check eligibility, applicable rules and key details", "full_content": "The deadline to file income tax returns ( ITR ) for Assessment Year (AY) 2026\u201327 is 30 November 2026 for taxpayers who are required to furnish a transfer pricing report under Section 92E of the Income-tax Act, 1961.\n\nThis deadline also covers certain partners of firms and their spouses, subject to the conditions prescribed under the law.\n\nUnlike the general ITR filing deadline applicable to many individual taxpayers , the 30 November deadline applies to a specific category of taxpayers for whom the provisions of Section 92E are applicable.\n\nSection 92E requires taxpayers who enter into international transactions or specified domestic transactions to obtain a report from a chartered accountant.\n\nAn international transaction generally involves dealings between associated enterprises, such as two related companies. Specified domestic transactions cover certain transactions within India that meet prescribed conditions.\n\nThe accountant's report must be furnished in Form 3CEB. It contains details of the relevant transactions and helps tax authorities examine whether the pricing of these transactions complies with the arm's length principle under transfer pricing rules.\n\nTaxpayers who furnished Form 3CEB by 31 October 2026 must still file their income tax returns by 30 November 2026. The two filings serve different purposes: Form 3CEB reports details of applicable international or specified domestic transactions, along with the accountant's opinion, while the ITR captures the taxpayer's income, deductions, tax liability, and other prescribed disclosures.\n\nWhile preparing the ITR, taxpayers should reconcile the information reported in Form 3CEB with their audited financial statements and tax computations. Any transfer-pricing adjustments or other tax-related changes should be appropriately reflected in the return.", "source": "LiveMint Money", "pub_date_str": "27 Nov 2026, 02:17 PM IST", "pub_date_relative": "1h ago"}, {"title": "Asian Stocks Rise for Second Day, Treasuries Slip: Markets Wrap - Bloomberg.com", "full_content": "Asian Stocks Rise for Second Day, Treasuries Slip: Markets Wrap Bloomberg.com Stock futures rise as Wall Street gets set to wrap up a volatile holiday week: Live updates CNBC Stock market today: Dow, S&P 500, Nasdaq futures gain as AI jitters steady Yahoo Finance US tech stocks set to jump at open as volatile trading continues Financial Times Stock Futures Jump as AI Trade Set for Rebound WSJ", "source": "Google News Business", "pub_date_str": "27 Nov 2026, 02:07 PM IST", "pub_date_relative": "1h ago"}, {"title": "Chinese shares soar after Beijing signals more support", "full_content": "Biggest one-day rise for CSI 300 index in two years following months of weakness", "source": "FT Markets", "pub_date_str": "27 Nov 2026, 02:02 PM IST", "pub_date_relative": "1h ago"}, {"title": "Gold price forecast: Fed rate hike in December may limit recovery to \u20b91.30 lakh per 10 grams by 2026-end, says expert", "full_content": "Gold prices are closely linked to US Federal Reserve interest rate decisions. The Fed's next Federal Open Market Committee (FOMC) meeting is scheduled for 8-9 December 2026, with the interest rate decision expected on 9 December.\n\nThe Fed last raised interest rates by 25 basis points in September, taking the federal funds target range to 3.75%\u20134.00%. This was its first rate hike since 2023. At its subsequent October meeting, the FOMC kept rates unchanged at 3.75%\u20134.00%\n\nA Fed rate hike generally puts downward pressure on gold prices. Gold is a non-interest-bearing asset and does not generate regular income, unlike bonds or bank deposits.\n\nWhen interest rates rise, interest-bearing investments can become more attractive to investors, reducing gold's appeal. Higher US interest rates can also strengthen the dollar and push bond yields higher, creating further pressure on gold prices.\n\nHowever, gold prices have recovered over the past two days, after falling to around \u20b9 1.22 lakh per 10 grams from their January peak of \u20b9 1.8 lakh. On 27 November, MCX December gold futures were trading at \u20b9 1,25,354 per 10 grams, up 2.52%, as of 1:24 pm.\n\nWith the December Fed meeting approaching, what should Indian investors expect from gold prices? And should they invest now or wait for a correction? Here's what an expert says.\n\nGaurav Garg, Head \u2013 Research, Lemonn, a SEBI-registered online broking platform offering stocks, F&O, mutual funds and IPOs, told LiveMint that gold has recovered over the past two sessions, but the sustainability of this rebound remains uncertain. With expectations of a US Federal Reserve rate hike in December and potentially further tightening in early 2027, elevated US bond yields and a stronger dollar could continue to restrict gold\u2019s upside, he said.\n\nHe shared that higher interest rates reduced the attractiveness of non-interest-bearing assets such as gold.", "source": "LiveMint Money", "pub_date_str": "27 Nov 2026, 01:43 PM IST", "pub_date_relative": "1h ago"}, {"title": "Private markets are more accessible than ever for investors. Getting out is another matter", "full_content": "Retail investors are lining up to back private funds. But education on how restrictive these funds can be, particularly on when and how much money they can get back, may not be keeping pace with the influx of new capital.\n\nPwC research has found that 77% of fund distributors surveyed said access to private markets is becoming important or very important to what they plan to offer clients, but just 15% of asset managers said they provide comprehensive education for retail investors.\n\nUnlike the public markets retail investors are more used to, some private-market vehicles limit when investors can get their money back to set repurchase windows, and even then may return only part of what they request.\n\nA spike in redemption requests at several private-credit funds earlier this year exposed the tension between giving investors regular opportunities to cash out and holding assets that can be difficult to sell quickly .\n\nBlackstone restricted withdrawals from its $79 billion flagship nontraded BCRED private credit fund to 5% of shares in June, after redemption requests hit 10% during the second quarter. Apollo also capped withdrawals in its Apollo Debt Solutions vehicle at 5% after second-quarter redemption requests surged to almost 17%. Blue Owl , Morgan Stanley and Partners Group also limited investor withdrawals from some of their funds.\n\nLimitations on redemptions are a key trade-off in structures such as LTAFs in the U.K., ELTIFs in the EU and interval funds in the U.S., which broaden access to less-liquid assets.\n\nIt's emerged as a major pressure point as those structures come under closer scrutiny.\n\n\"Private markets can have very different characteristics from the products many wealth clients are used to, particularly around liquidity, valuations and holding periods,\" said Albertha Charles, global asset and wealth management leader at PwC.", "source": "CNBC Top News", "pub_date_str": "27 Nov 2026, 01:35 PM IST", "pub_date_relative": "1h ago"}, {"title": "Up 57% YTD! Healthcare stock shows resilience against the Indian stock market crash; should you buy? Target, stop-loss", "full_content": "Vaamanaa Sethi Published 27 Nov 2026, 01:33 PM IST Prefer Livemint on Google Healthcare stock Park Medi World has remained relatively resilient amid the weakness in the broader Indian stock market on Friday, November 27. The stock opened at \u20b9 240.81 and touched an intraday high of \u20b9 240.81 and a low of \u20b9 231.81 during the intraday session.\n\nMeanwhile, the benchmark indices were under pressure on Friday, with the Sensex falling nearly 700 points and the Nifty slipping below the 25,700 mark in morning trade. Selling in IT, banking and other heavyweight stocks weighed on market sentiment.\n\nPark Medi World recently announced the completion of its acquisition of Mehar Mediserve LLP, which owns and operates Mehar Hospital in Zirakpur, Punjab.\n\nIn an exchange filing dated November 26, the company confirmed that it had completed the acquisition of 100% of Mehar Mediserve LLP on a fully diluted basis. Following the transaction, Mehar Mediserve LLP has become a wholly owned subsidiary of Park Medi World.\n\nThe acquisition was initially announced on August 3, 2026, and involves a 150-bed hospital in Zirakpur. The transaction is expected to strengthen the company's presence in the Tricity region of Chandigarh, Mohali and Panchkula.\n\nEarlier, in its Q2 FY27 investor presentation, Park Medi World had highlighted plans to expand its hospital network through acquisitions, new facilities and capacity additions.\n\nThe company added 680 beds during the first half of FY27 through the acquisition of a hospital in Rudrapur and the commissioning of its Panchkula facility. This took its total bed capacity to 4,290 as of September 30, 2026.\n\nPark Medi World is also expanding its footprint through a 300-bed multi-super-speciality hospital in Kanpur under a long-term operations and management arrangement. The facility is expected to be commissioned in Q4 FY27.", "source": "LiveMint Markets", "pub_date_str": "27 Nov 2026, 01:33 PM IST", "pub_date_relative": "1h ago"}, {"title": "Is a US Fed rate hike confirmed in Dec meet? How will it impact Sensex, Nifty, Gold as US PCE inflation rises in October", "full_content": "Stock market today : Indian equity benchmarks Sensex and Nifty snapped their two-session winning streak on Friday as rising crude oil prices amid escalating geopolitical tensions in the Middle East weighed on investor sentiment. Sustained institutional buying, however, offered some support to the market. Meanwhile, hotter-than-expected core US inflation has added to concerns about the Federal Reserve's December policy decision, with investors assessing whether interest rates could rise further instead of coming down.\n\nUS Personal Consumption Expenditures (PCE) inflation, the Fed's preferred inflation gauge, rose to 3.8% in October from 3.6% in September, in line with expectations. However, core PCE inflation, which excludes food and energy prices, increased to 3.3%, against forecasts of 3.2%. Core prices also rose 0.3% for the third consecutive month.\n\nWhile headline inflation could ease in the coming months following the sharp decline in oil prices since late October, persistent core inflation indicates that underlying price pressures remain elevated. This is particularly important because the Fed closely monitors core inflation when assessing the sustainability of price pressures.\n\nThe Nifty 50 opened lower at 25,839 and touched an intraday low of 25,666.75. The 30-stock BSE Sensex also opened lower at 84,093 before slipping to an intraday low of 83,547. Sensex fell 781.5 points to the day's low, while Nifty 50 shed 218 points to its intraday low.\n\nThe latest inflation reading has weakened the case for near-term monetary easing, with core inflation remaining sticky despite softer consumer spending.", "source": "LiveMint Markets", "pub_date_str": "27 Nov 2026, 01:31 PM IST", "pub_date_relative": "1h ago"}, {"title": "'A golden age for builders': Here's what business leaders are thankful for this year - Business Insider", "full_content": "'A golden age for builders': Here's what business leaders are thankful for this year Business Insider The tech I\u2019m most grateful for this Thanksgiving Komando.com Tech Leaders Share Thanksgiving Messages of Gratitude Demokratis.co.id Not AI or ChatGPT, Sam Altman reveals what matters most to him and who keeps him from going crazy India Today Sam Altman shares what matters most to him in recent post The News International", "source": "Google News Business", "pub_date_str": "27 Nov 2026, 01:22 PM IST", "pub_date_relative": "1h ago"}, {"title": "Stock Market Today: Sensex Drops 700 Points, Nifty Below 25,700; Infosys, TCS, HCLTech Tumble", "full_content": "The BSE Sensex opened at 84,093.24, against its previous close of 84,328.59. Meanwhile, the NSE Nifty 50 opened at 25,839.25, compared with its previous close of 25,884.50.", "source": "NDTV Profit", "pub_date_str": "27 Nov 2026, 01:18 PM IST", "pub_date_relative": "1h ago"}, {"title": "Rs 5.58 Lakh Chairs, Rs 3.43 Lakh TV: What's Inside Ex-CM And AAP Leader Arvind Kejriwal's 'Sheesh Mahal'", "full_content": "A report by the Comptroller and Auditor General (CAG) tabled in the Delhi Assembly on March 23, 2026, recorded an expenditure of Rs 33.66 crore on the works, about 342 per cent above the preliminary estimate.", "source": "NDTV Profit", "pub_date_str": "27 Nov 2026, 01:17 PM IST", "pub_date_relative": "1h ago"}, {"title": "Nifty To See Limited Upside? CLSA's Vikash Jain Sees Low-Teens Even As FPI Investment Continues | Here's Why", "full_content": "Jain told NDTV Profit that India's recent outperformance against other markets was partly a reminder that global investors had become excessively concentrated in artificial intelligence-linked trades, leaving other markets under-owned.", "source": "NDTV Profit", "pub_date_str": "27 Nov 2026, 01:15 PM IST", "pub_date_relative": "2h ago"}, {"title": "'Minority Shareholders Come First': SEBI Chariman Pandey Says Investor Protection A Key In Tata Steel-APL Apollo Deal", "full_content": "SEBI is examining the Rs 28,000 crore transaction amid governance concerns, while IIAS has urged the regulator to clarify whether the related-party transaction purpose-and-effect test applies.", "source": "NDTV Profit", "pub_date_str": "27 Nov 2026, 01:07 PM IST", "pub_date_relative": "2h ago"}, {"title": "Why Asahi India Glass may keep sparkling, irrespective of ICE or EV growth", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nThe Asahi India Glass stock hit an all-time high of \u20b9 1,206 on Thursday, having risen almost 30% since the company announced strong September-quarter (Q2FY27) results on 3 November.\n\nICICI Securities expects revenue and Ebitda to grow at a CAGR of 15% and 24%, respectively, over FY26-FY29. The stock is currently trading at an EV/Ebitda multiple of 19x, based on the brokerage\u2019s FY29 estimates. While this valuation may look rich, some leading auto ancillary companies trade at even higher multiples. For instance, Uno Minda and Sona BLW Precision Forgings trade at EV/Ebitda multiples of 21x and 27x, respectively, based on Bloomberg consensus FY29 estimates.\n\nSceptics would argue that Asahi derives about 70% of its sales from the automobile industry and therefore does not deserve a valuation comparable to auto ancillary companies. Asahi makes automotive glass used in all types of vehicles, whether powered by internal combustion engines (ICE) or electricity. It derives the remaining 30% of sales from architectural glass used in construction and other segments. Both are manufactured from float glass, but processing automotive glass is generally more complex than architectural glass, requiring intricate 3D bending and tight safety norms for use in vehicles.\n\nThe point to note is that the profitability of architectural glass, used in construction and white goods, is even higher. Asahi\u2019s architectural glass Ebit margin in Q2FY27 was 22.6%, compared with 12.3% for automotive glass. Even when the more relevant metric of return on capital employed (ROCE) is considered, the difference is not significant: architectural glass had a ROCE of 8%, against 9.7% for automotive glass.", "source": "LiveMint Markets", "pub_date_str": "27 Nov 2026, 01:05 PM IST", "pub_date_relative": "2h ago"}, {"title": "Akshay Kumar, Shilpa Shetty And Suniel Shetty Starrer Dhadkan To Get A Sequel? What We Know", "full_content": "A sequel to the 2000 romantic drama Dhadkan is reportedly in the works, with Suniel Shetty expected to make a cameo appearance.", "source": "NDTV Profit", "pub_date_str": "27 Nov 2026, 01:00 PM IST", "pub_date_relative": "2h ago"}, {"title": "From selling business stake to donating \u20b9207 crore in gold at Tirupati: The story of Chennai entrepreneur Vardhaman Jain", "full_content": "A remarkable act of devotion has brought Chennai-based entrepreneur Vardhaman Jain and his wife, Radhika Jain, into the spotlight after they donated 121 kg of gold worth \u20b9 207 crore, according to a report by The Times of India.\n\nThe donation was made to Lord Venkateswara at Tirumala in Andhra Pradesh and is described as the largest of its kind to a temple in independent India.\n\nThe couple presented 46 intricately made gold ornaments to the deity at the temple on 26 November. They were accompanied by Andhra Pradesh Chief Minister N Chandrababu Naidu and senior officials from Tirumala Tirupati Devasthanams (TTD)\n\nAccording to the TTD, the ornaments weigh about 106 kg and are made of 24-carat gold . They include crowns, armlets, necklaces, anklets, waistbands and other traditional jewellery. The donation also includes precious stones , such as diamonds, blue and yellow sapphires, rubies and emeralds.\n\nThe remaining 15 kg of gold will be used to create a golden saree for Goddess Padmavathi, the consort of Lord Venkateswara, at the Tiruchanoor temple.\n\nVardhaman Jain co-founded a US-based healthcare business process outsourcing (BPO) company with his brother, Anurag Jain. He said the decision to donate followed the sale of his equity stake to a New York-based private equity firm last year.\n\nAccording to reports, he approached TTD officials in August 2025 with a proposal to donate 121 kg of gold. During a meeting with CM Naidu, he learned that the deity\u2019s daily jewellery weighs approximately 120 kg. The information further boosted the family's resolve to make the donation in the form of ornaments.\n\nNaidu praised the couple's gesture, saying their generosity stood out even among India\u2019s most prominent and wealthy individuals.", "source": "LiveMint Money", "pub_date_str": "27 Nov 2026, 12:55 PM IST", "pub_date_relative": "2h ago"}, {"title": "Gold, Silver Rates Live Updates, Nov 27: Gold Rebounds From 15-Month Low, Silver Surges Nearly 6%; Check City-Wise Prices", "full_content": "Gold and silver rebound as a weaker US dollar and a recovery in technology stocks lift bullion, even as expectations of Federal Reserve rate hikes persist. Track 22K and 24K gold prices across Mumbai, Delhi, Chennai, Bengaluru and Hyderabad.", "source": "NDTV Profit", "pub_date_str": "27 Nov 2026, 12:55 PM IST", "pub_date_relative": "2h ago"}, {"title": "Delimitation Bill Explained: What Is It, Who Supports It, Who Opposes It? 5 Key Things To Know", "full_content": "The Lok Sabha meets on 30 November and the Rajya Sabha on 2 December reportedly to pass the bill.", "source": "NDTV Profit", "pub_date_str": "27 Nov 2026, 12:54 PM IST", "pub_date_relative": "2h ago"}, {"title": "WhatsApp Users Can Now Stay Connected Abroad Without Changing Phone Numbers. Here's How", "full_content": "WhatsApp says users will be able to buy and install an e-SIM in just a few taps, right inside the app. After landing in another country, they can keep using WhatsApp on the same phone number.", "source": "NDTV Profit", "pub_date_str": "27 Nov 2026, 12:49 PM IST", "pub_date_relative": "2h ago"}, {"title": "Tech German software major SAP is reportedly weighing cutting at least 10,000 jobs in AI push", "full_content": "SAP is preparing a plan to eliminate at least 10,000 positions as the German firm reshapes its software business for the artificial intelligence era, Bloomberg reported on Thursday , citing people familiar with the matter.\n\nThe report came as the company flagged a cybersecurity attack, but said it had found \"no evidence of unauthorized access to customer business data.\"\n\n\"SAP has identified suspicious activity and promptly implemented the necessary measures to protect its customers and preserve the security of its services,\" a company spokesperson said.\n\n\"Our customers trust us to protect their data, and that remains our highest priority. In a highly dynamic threat environment, we will continue to strengthen our security to provide the secure and resilient environment our customers depend on.\"\n\nThe company did not respond to a request for comment on the reported job cuts. The number could change after labor negotiations.\n\nOther software companies have also tied workforce reductions to AI initiatives, though for different reasons. WiseTech Global said in February it planned to cut about 2,000 jobs over two years as it integrated AI into its products and operations.\n\nAtlassian said in March it would cut about 1,600 jobs partly to fund further AI investment, while Cloudflare said in May it would eliminate more than 1,100 roles as it moved toward an AI-first operating model.\n\nIn the U.S., employers cited AI in 121,401 job-cut announcements through October 2026, accounting for about 20% of the total, according to a Nov. 5 report from outplacement and executive coaching firm Challenger, Gray & Christmas.", "source": "CNBC World Economy", "pub_date_str": "27 Nov 2026, 12:45 PM IST", "pub_date_relative": "2h ago"}, {"title": "SpaceX shares jump on alternative trading platform after Musk says he will expand on Trump Account share donations", "full_content": "Shares of SpaceX jumped 7.47% in overnight trading on Blue Ocean ATS after CEO Elon Musk expanded his SpaceX share-donation plan for U.S. children.\n\n\"I will be donating another share of SpaceX to all kids in America every year,\" Musk said in a post on X .\n\nBlue Ocean ATS is an alternative trading system for U.S. equities that operates from 8 p.m. to 4 a.m. ET, outside regular U.S. stock market hours. According to the platform's holiday schedule , overnight trading resumed at 8 p.m. ET on Thanksgiving Day. U.S. stock exchanges were closed Thursday and are scheduled to close early Friday.\n\nSpaceX shares closed 1.30% higher on Wednesday ahead of Thanksgiving.\n\nThe latest pledge follows SpaceX's announcement Wednesday that it would donate one share of its Class A stock to every active Trump Account, tax-advantaged investment accounts for American children, with Musk personally matching the gift.\n\nIn a separate post on X, Musk said SpaceX's contribution would be transferred next month, while his personal donation would follow when his lockup period expires in June next year.\n\nNearly 70 million Trump Accounts had been created as of October, according to the White House.\n\nSince the program's launch in July, families and friends have contributed more than $1 billion to the accounts, bringing total deposits from all sources to more than $9 billion, CNBC reported earlier this week.", "source": "CNBC World Economy", "pub_date_str": "27 Nov 2026, 12:45 PM IST", "pub_date_relative": "2h ago"}, {"title": "MCX Shares Hit Record High, Surge Nearly 90% In One Year: What's Driving The Rally?", "full_content": "MCX reported a 130% year-on-year (YoY) rise in its consolidated net profit to Rs 454.57 crore in the September quarter of financial year 2027 (Q2FY27).", "source": "NDTV Profit", "pub_date_str": "27 Nov 2026, 12:42 PM IST", "pub_date_relative": "2h ago"}, {"title": "Gold prices hover around \u20b91.25 lakh: 2027 outlook, key drivers and what investors should do; experts weigh in", "full_content": "Gold prices have corrected sharply by 32% from their January 2026 peak of around \u20b9 1.8 lakh per 10 grams to approximately \u20b9 1.22 lakh per 10 grams.\n\nHowever, domestic gold prices have recovered slightly over the past two days. On 27 November, MCX gold prices were trading at \u20b9 1,24,816 per 10 grams, up 2.08%, while the retail price of 24-karat gold stood at \u20b9 1,25,440 per 10 grams.\n\nOn 26 November, December gold futures settled at \u20b9 1,22,349 per 10 grams, gaining 1% from the previous session.\n\nWith gold prices witnessing a recent recovery, what is the outlook for the precious metal by the end of 2027, and what should Indian investors do amid the ongoing volatility?\n\nDespite the correction, the medium-term outlook remains positive, according to Yuxuan Tang of JP Morgan Private Bank.\n\nIn an interview with CNBC , Tang said she expects gold to remain under pressure as monetary tightening continues, but remains bullish on the metal over the medium term.\n\nShe believes central bank purchases and demand for gold as a hedge against currency debasement will support prices, with gold reaching about $4,600 by the end of 2027.\n\nWith the current international gold price at around $3,648 per ounce, this implies an upside of approximately 26% by the end of 2027. Even from the $3,500 mark, gold would need to rise around 31% to reach the projected target.", "source": "LiveMint Money", "pub_date_str": "27 Nov 2026, 12:39 PM IST", "pub_date_relative": "2h ago"}, {"title": "Ye Prem Mol Liya Box Office Collection Day 1: Ayushmann Khurrana, Sharvari Film Records A Good Opening", "full_content": "Directed by Sooraj Barjatya, Ye Prem Mol Liya is a romantic family drama starring Ayushmann Khurrana and Sharvari in the lead roles.", "source": "NDTV Profit", "pub_date_str": "27 Nov 2026, 12:35 PM IST", "pub_date_relative": "2h ago"}, {"title": "TVS Succession Battle: Can Lakshmi Venu Open Ownership Claims Despite 2020 Family Pact?", "full_content": "Lakshmi's case is that the 2020 arrangement divided interests between the wider TVS family branches, but did not settle the economic rights of Venu's children.", "source": "NDTV Profit", "pub_date_str": "27 Nov 2026, 12:34 PM IST", "pub_date_relative": "2h ago"}, {"title": "SEBI Plans To Curb Duplicate Disclosures, Replace Multiple Fines Under LODR Review: Chairman Tuhin Kanta Pandey", "full_content": "SEBI is reviewing listing rules to remove disclosures that duplicate filings with the Ministry of Corporate Affairs and replace multiple exchange penalties for the same lapse with a single fine.", "source": "NDTV Profit", "pub_date_str": "27 Nov 2026, 12:34 PM IST", "pub_date_relative": "2h ago"}, {"title": "Why is Indian stock market falling today? Nifty down to near 25,600, Sensex crashes 900 points | Top 3 reasons explained", "full_content": "Stock market crash today: After rising for the last two sessions, the key benchmark indices of the Indian stock market came under selling pressure on Friday. The Nifty 50 today opened lower at 25,839 and touched an intraday low of 25,620, whereas the 30-stock index BSE Sensex today opened lower at 84,093 and touched an intraday low of 83,400. The Bank Nifty index also witnessed selling pressure, touching an intraday low of 63,097.\n\nBy 3:00 PM, the Sensex is down over 900 points, the Nifty 50 index is down nearly 250 points to 25,626, and the Bank Nifty index is down over 400 points to 63,121.\n\nAccording to stock market experts, the Indian stock market is under selling pressure due to three major reasons: weakness in the Indian Rupee, renewed inflation fear, and US Fed rate hike buzz. However, the long weekend due to the Thanksgiving celebrations in the US stock market is also a reason for people squaring off their positions before the long weekend. Trump's tariffs and delay in the India-US trade deal is also a reason for the Indian indices retracing from the higher levels.\n\nHighlighting the reasons for sharp selling in the Indian stock market, Avinash Gorakshkar, Founder of Avinash Mentor Research, said, \u201cThe Indian Rupee has descended on Friday to the tune of 92.65 levels, which might have paused the FIIs' buying, as INR-USD convertibility may weigh on their returns. Apart from this renewed fear of inflation after the US CPI data and soaring crude oil price to around $85 per barrel on Friday, and buzz for the US Fed rate hike are some other reasons.\u201d\n\n\u201cInvestors remain focused on the lack of clarity surrounding the India-US trade agreement, with concerns over US tariffs continuing to weigh on sentiment.", "source": "LiveMint Markets", "pub_date_str": "27 Nov 2026, 12:34 PM IST", "pub_date_relative": "2h ago"}, {"title": "Pakistan A vs Bangladesh A Live Streaming: When And Where To Watch Asia Cup Rising Stars 2nd Semi-Final?", "full_content": "Pakistan A face Bangladesh A in the second semi-final of the Asia Cup Rising Stars 2026 on November 27. Check match time, venue, live telecast and streaming details.", "source": "NDTV Profit", "pub_date_str": "27 Nov 2026, 12:30 PM IST", "pub_date_relative": "2h ago"}, {"title": "Can SpaceX's AI ambitions drive further upside in its stock?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News Powered By Can SpaceX's AI ambitions drive further upside in its stock? Written by Anupam Nagar , ETMarkets.com | Nov 27, 2026, 12:41:15 PM IST 1 / 5 SpaceX Shares Jump 9% After Bullish Trading Signal SpaceX shares surge as much as 9.23% intraday after a bullish Power Inflow signal points to increased buying interest from institutional and retail investors. The signal is triggered at $117.36 on November 25, with the stock subsequently climbing to $128.18, according to Benzinga. (Sources: Benzinga, Yahoo Finance, Al Jazeera, TradingView)\n\nElon Musk announces plans to give every child in the United States two SpaceX shares, with one share coming from the company and another from him personally. The giveaway is valued at nearly $18 billion based on SpaceX's November 25 closing price of $127.44. The initiative could also expand public participation in the company's growth story.\n\nThe US Federal Communications Commission grants conditional approval for SpaceX to deploy up to one million satellites for its proposed orbital data centre network, called Starmind. The project aims to support growing demand for artificial intelligence computing infrastructure, marking a major expansion of the company's ambitions beyond conventional satellite internet services.\n\nSpaceX reports a sharp improvement in its financial performance, with third-quarter revenue rising 161% year-on-year to $14.6 billion and net income reaching $4.4 billion, compared with a loss a year earlier. Its Super Intelligence business generates $7.6 billion in revenue, while satellite connectivity contributes $5.2 billion.\n\nDespite its leadership in rocket launches, satellite connectivity and artificial intelligence, SpaceX faces questions over its expensive valuation.", "source": "Economic Times Markets", "pub_date_str": "27 Nov 2026, 12:23 PM IST", "pub_date_relative": "2h ago"}, {"title": "Why Markets Are Falling Today? Sensex Tanks Nearly 800 Points, Nifty 50 Below 25,700; 4 Key Reasons Explained", "full_content": "The BSE Sensex fell as much as 781.5 points, or 0.92%, to an intraday low of 83,547.09. The NSE Nifty 50 declined up to 217.75 points, or 0.84%, to 25,666.75.", "source": "NDTV Profit", "pub_date_str": "27 Nov 2026, 12:21 PM IST", "pub_date_relative": "2h ago"}, {"title": "Spain\u2019s Pablo Hern\u00e1ndez de Cos set to lead European Central Bank", "full_content": "Pablo Hern\u00e1ndez de Cos is set to succeed Christine Lagarde as president of the European Central Bank next year.\n\nHe received backing from euro zone leaders at the European Council Summit on Thursday. The role still requires formal appointment after consultation with the European Parliament and the ECB's Governing Council, but neither has veto power and the decision follows intense political wrangling to reach a consensus on who should serve the eight-year term.\n\nDe Cos is a 55-year-old economist and career central banker who rose through the ranks of the Bank of Spain, starting as a researcher in the 1990s and working in various departments before becoming governor from 2018 to June 2024.\n\nHe chaired the Basel Committee on Banking Supervision from 2019 to 2024, and has been General Manager of the Basel-based Bank for International Settlements since July 2025.\n\nBoth de Cos and his main rival for the ECB top job, the Netherlands' Klaas Knot, were widely seen as candidates with deep knowledge and experience in monetary policy and financial stability \u2014 attributes that took on particular importance at a time of resurgent inflation, fragmentation and political uncertainty.\n\nLagarde had extensive experience in financial institutions but was criticized by some early in her tenure for a lack of central banking experience.\n\nDe Cos gained sufficient political backing in closed-door discussions and negotiations since Lagarde said she would step down on Feb. 7, 2027, over seven years after she became the first woman to helm the ECB. That was despite a final push by the Netherlands at the European Council meeting this week backing Knot.\n\nRepresentatives from the euro area's biggest economies \u2014 Germany, France, Italy, Spain and the Netherlands \u2014 have been horse-trading as they look to secure representation on the central bank's six-member Executive Board.", "source": "CNBC Top News", "pub_date_str": "27 Nov 2026, 12:20 PM IST", "pub_date_relative": "2h ago"}, {"title": "Nifty At 29,000 By 2027? JPMorgan's Sanjay Mookim Explains What Will Drive India's Market", "full_content": "JPMorgan expects India's earnings growth to support its Nifty target for December 2027, with financials likely to remain the biggest contributor even as growth moderates.", "source": "NDTV Profit", "pub_date_str": "27 Nov 2026, 12:16 PM IST", "pub_date_relative": "3h ago"}], "cfa": [{"title": "ECB survey shows rising inflation expectations in October 2026", "full_content": "", "source": "Investing.com News", "pub_date_str": "27 Nov 2026, 03:09 PM IST", "pub_date_relative": "7m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Zambia holds interest rate at 10.75% as inflation stays on target", "full_content": "", "source": "Investing.com News", "pub_date_str": "27 Nov 2026, 03:06 PM IST", "pub_date_relative": "10m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Earnings call transcript: Cathay Financial posts record 9m 2026 profit on broad gains", "full_content": "", "source": "Investing.com News", "pub_date_str": "27 Nov 2026, 03:05 PM IST", "pub_date_relative": "11m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "1 mn views on Facebook vs Instagram vs YouTube: Why 2 different paychecks? Why viewer location rules creator economy", "full_content": "Two creators get one million views each. One earns a lot. The other earns very little. This confuses many new creators. The views look the same. The money is not. The reasons lie in how each platform pays and who is watching.\n\nNote: The figures below are rough ideas, not exact rates. Earnings often vary by niche, season and platform policy. Please check current official rules before planning your income.\n\nA view means different things on each platform. On YouTube, a view often means someone chose to watch. They may have searched for your topic. On Instagram and Facebook, many views come from autoplay. People scroll fast, and a video plays for a few seconds. That counts as a view.\n\nAdvertisers care about attention. A viewer who watches fully is more useful than one who scrolls past. So, the same one million views can carry very different values.\n\nYouTube has a long-running ad revenue share. Ads run before, during, or after videos. Creators who qualify for the Partner Programme get a share of ad income. Long videos can carry more ads, so they can earn more per view.\n\nFacebook pays through in-stream ads in longer videos and through some monetisation programmes. Rules on length and eligibility apply. Reels and short clips usually earn less than longer content.\n\nInstagram has relied less on direct ad sharing. Many influencers earn mainly through brand deals, bonuses and affiliate links. A million views may bring little platform money, but it can attract sponsors.\n\nThis is the biggest reason for pay gaps. Advertisers pay more to reach people in richer markets. A viewer in the US, UK or Australia is worth more to advertisers. Those viewers have higher spending power. So, ad rates there are higher.", "source": "LiveMint Money", "pub_date_str": "27 Nov 2026, 02:57 PM IST", "pub_date_relative": "19m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Gold ETFs vs Gold Mutual Funds: Amid ups and downs in rates, which is better instrument to buy for good returns?", "full_content": "Asit Manohar Updated 27 Nov 2026, 02:55 PM IST Prefer Livemint on Google Gold Rate Today | Gold Price Today | Gold ETFs vs Gold Mutual Funds: After hitting the 15-month low of \u20b9 1,20,750 per 10 gm on Wednesday, the MCX gold rate has been ascending for the last two straight sessions. The gold rate today in India is around \u20b9 1,25,800, which means gold prices in India have rebounded around \u20b9 6,000 from the 15-month low. In the international market, the gold price in USD has broken above the $3,600 per ounce resistance and hit an intraday high of $3,679 per ounce. Though gold prices in India are still \u20b9 55,000 below the record high of \u20b9 1,80,779 per 10 gm, investing in physical gold is not a cheaper option for most of the public. For them, gold ETFs and gold mutual funds remain a better option. However, amid a strong rebound from the 15-month low, the Aam Aadmi may find it tricky to decide which investment tool offers betterreturns.\n\nComparing the two investment tools, which can enable an Aam Aadmi to make money amid the gold price rebound from the 15-month low, Pankaj Mathpal, MD & CEO at Optima Money Managers, said, \u201cFor investing in gold ETFs, it is mandatory for an investor to have a demat account, whereas for an investor planning to invest in gold mutual funds, just having a demat account is enough. Comparatively, investing in gold ETFs is better due to the lower cost, because even when you invest in gold mutual funds, your fund manager invests in gold ETFs, charging in the form of expense ratio, making your returns a little less than the gold ETFs.\u201d\n\nPankaj Mathpal of Optima Money said that gold ETFs are better suited for a long-term investor planning to invest in the SIP mode.", "source": "LiveMint Markets", "pub_date_str": "27 Nov 2026, 02:53 PM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Alternative Investments", "Portfolio Management"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Gold, equity ETFs or debt mutual funds: How should investors balance their portfolios in 2027? Expert shares allocation", "full_content": "Are you looking to build a balanced investment portfolio in 2027? One of the key decisions is how much to allocate to equities, debt and gold.\n\nSince each asset class serves a different purpose, focusing on one may not be the best strategy. Equity Exchange-Traded Funds (ETFs) offer exposure to the stock market and the potential for long-term wealth creation . However, they can be volatile and are subject to short-term market fluctuations.\n\nDebt mutual funds, on the other hand, invest in fixed-income securities and add stability to a portfolio. They generally offer greater predictability and may provide a regular income stream. However, returns are not guaranteed, as they remain exposed to interest-rate and credit-related risks.\n\nGold plays a slightly different role in comparison to other asset classes. It can help diversify a portfolio and may offer a cushion during periods of market uncertainty and geopolitical turmoil. However, it does not generate regular income, and its price can fluctuate, as has been witnessed throughout this year.\n\nAdhil Shetty, CEO of BankBazaar, said investors should focus on the role each asset class plays in their portfolio rather than trying to identify the best-performing investment option.\n\n\"Rather than picking one winner, investors can look at each asset by the role it plays. Equity ETFs are typically used for long-term growth, debt mutual funds for stability, and gold for diversification. For instance, with \u20b9 1 lakh, one may first decide how much is needed for stability, then allocate for growth based on time horizon, keeping gold as a smaller portion built gradually. A moderate investor might end up with roughly \u20b9 50,000 in an equity ETF, \u20b9 40,000 in debt funds and \u20b9 10,000 in gold. The mix would vary with individual goals and risk appetite,\" Shetty explained.\n\nThe allocation discussed above can serve as a prudent starting point.", "source": "LiveMint Money", "pub_date_str": "27 Nov 2026, 02:49 PM IST", "pub_date_relative": "28m ago", "cfa_topics": ["Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Silver price prediction: After 67% crash from peak, is the white metal finally close to a bottom? Key levels to watch", "full_content": "Pranati Deva Published 27 Nov 2026, 02:48 PM IST Prefer Livemint on Google Silver price prediction : Silver prices have plunged nearly 67% from their January 2026 record, but a technical chart from PL Capital suggests the metal may be approaching a zone where the steep sell-off could begin to stabilise. The brokerage's analysis identifies a potential support band of $37\u201339.50 per ounce (approximately \u20b9 1.10 lakh\u2013 \u20b9 1.17 lakh per kg), while warning that the chart does not yet confirm a sustained reversal.\n\nThe COMEX silver price was around $39.964 per ounce (approximately \u20b9 1.19 lakh per kg) and the metal has fallen from a record high of $121.60 per ounce (around \u20b9 3.61 lakh per kg) on January 29 to a low of $39.50 (around \u20b9 1.17 lakh per kg) this week. PL Capital describes this as the second-deepest fall in modern silver-market history after the 1980 crash.\n\nSilver prices staged a sharp rebound in international markets on Friday, recovering from their lowest levels in more than a year ahead of the Thanksgiving holiday on Thursday. According to a Bloomberg report, bullion was on track to post weekly gains after hitting a 15-month low earlier this week. Spot silver surged 4.6% to $43.40 per ounce.\n\nIn domestic markets, MCX silver futures jumped 6% to \u20b9 1,54,332 per kg.\n\nSilver prices have come under pressure from a combination of rising interest-rate expectations, a stronger US dollar and forced selling across financial markets. A hawkish Federal Reserve, Treasury yields above 5.1% and a dollar hovering near a 19-month high have made non-yielding precious metals less attractive.\n\nMinutes of the Fed's October meeting, released on Wednesday, indicated that almost all policymakers favoured further monetary tightening to bring inflation towards the 2% target.", "source": "LiveMint Markets", "pub_date_str": "27 Nov 2026, 02:48 PM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Economics", "Fixed Income", "Derivatives", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "US tech stocks set to jump at open as volatile trading continues", "full_content": "All-powerful AI trade has been eclipsed by wild swings in a market struggling to price future earnings", "source": "FT Markets", "pub_date_str": "27 Nov 2026, 02:47 PM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Looking for equity-debt mix? These hybrid mutual funds lead in 1, 3, 5-year returns and delivered consistent money gains", "full_content": "Mutual funds offer investors various options to invest across a basket of equity and debt securities. While equity funds primarily invest in stocks and debt funds invest in bonds and government securities, hybrid funds combine the two asset classes in varying proportions. The allocation depends on the scheme's category and investment mandate.\n\nFor investors looking for a mix of equity and debt exposure, hybrid funds offer an option to participate in equity market gains while also having some exposure to relatively stable debt instruments. However, their risk and return profiles vary depending on how much they invest in each asset class.\n\nHere are the top five active hybrid mutual funds that have delivered positive returns across the 1-year, 3-year, and 5-year periods.\n\nThe table below lists hybrid fund schemes ranked by their 1-year returns. It includes only funds that have delivered positive returns over all three periods, with performance data available for each timeframe.\n\n*Source: Value Research, CAGR as on 26 November 2026, Direct active plans\n\nBank of India Aggressive Hybrid Fund leads the list with 12.29% returns over one year. However, the picture changes over longer investment horizons.\n\nBandhan Aggressive Hybrid Fund delivered the highest returns over three years at 16.14%, while Bank of India Aggressive Hybrid Fund again topped the five-year period with 14.55%.\n\nThe five funds follow different investment strategies, which also means their risk exposures are not the same. Three of the five schemes belong to the aggressive hybrid category, while HSBC Equity Savings Fund falls under the equity savings category and ABSL Balanced Advantage Fund is a balanced advantage scheme.", "source": "LiveMint Money", "pub_date_str": "27 Nov 2026, 02:46 PM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Equity Investments", "Fixed Income", "Derivatives"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "ECB Consumer Expectations Survey results \u2013 October 2026", "full_content": "In October the median rate of perceived inflation over the previous 12 months increased to 4.1% from 3.6% in September and stood at its highest level since July 2024. Median expectations for inflation over the next 12 months also rose to 3.5% from 3.1%, but remained below the level reached at the start of the conflict in March 2026 (4.0%). Median expectations for inflation three years ahead increased to 3.0% from 2.9%, returning to the March 2026 level. Median expectations for inflation five years ahead were unchanged at 2.5% for the third consecutive month, the highest level since the start of the series in August 2022. Uncertainty about expectations for inflation over the next 12 months increased for the second consecutive month, remaining higher than the level prior to the start of the conflict in the Middle East. Respondents in the bottom income quintile continued to report higher inflation perceptions and expectations, on average, than those in the top quintile. Younger respondents (aged 18-34) continued to report lower inflation perceptions and expectations than older respondents (aged 35-54 and 55-70).\n\nConsumers\u2019 expectations for nominal income growth over the next 12 months fell to 0.6% from 1.1% in September. While expectations declined across all income quintiles, the decline was most pronounced in the bottom income quintile (by 0.7 percentage points to 0.8%) and in the top quintile (by 0.8 percentage points to 0.4%). Perceived nominal spending growth over the previous 12 months increased to 5.4% from 5.3% in September, while expected nominal spending growth over the next 12 months was unchanged at 3.7%.\n\nExpectations for economic growth over the next 12 months increased in October to -1.3% from -1.5% in September. Expectations for the unemployment rate 12 months ahead decreased to 11.0% from 11.3% in September.", "source": "ECB Press", "pub_date_str": "27 Nov 2026, 02:30 PM IST", "pub_date_relative": "47m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Gold vs silver: Precious metals prices crashed and rebounded - which of them could deliver better returns in 2027?", "full_content": "Gold vs Silver : Gold and silver have witnessed a sharp reversal in November 2026, with both precious metals tumbling from their January record highs before staging a strong rebound towards the end of the month.\n\nOn the domestic futures market, MCX gold fell around 13% in November, while silver plunged nearly 20%, as a stronger US dollar, elevated bond yields and expectations of tighter US monetary policy triggered heavy selling. However, both metals bounced back on Friday, November 27, as bargain buying and short-covering emerged after the steep correction.\n\nThe rebound was sharp in global markets, too. Spot gold rose around 2.7% to $3,663.52 per ounce on November 27, recovering from a more than one-year low hit earlier in the week.\n\nSilver climbed around 6.5% to $44.18 per ounce. On MCX, December gold futures traded around \u20b9 1,24,856 per 10 grams, up 2.37%, while silver futures rose 5.3% to \u20b9 1,53,579 per kg.\n\nDespite the recovery, both metals remain well below their January peaks, raising the question of which could offer better returns in 2027.\n\nThe outlook for precious metals in 2027 will depend significantly on the direction of US monetary policy. A moderation in inflation and easing expectations of further rate hikes could weaken the US dollar and create a supportive environment for gold and silver.\n\nGold could draw support from continued central-bank purchases, geopolitical uncertainty and sustained investment demand. According to Kaynat Chainwala, AVP \u2013 Commodity Research at Kotak Neo, central-bank demand remained robust in 2026, with official-sector purchases reaching 675 tonnes in the first nine months of the year.\n\nHowever, gold's performance in 2026 also demonstrated that geopolitical uncertainty does not always translate into higher prices. Chainwala said tensions, including the US-Iran conflict, would typically support safe-haven demand. But higher oil prices fuelled inflation concerns and expectations of tighter monetary policy.", "source": "LiveMint Markets", "pub_date_str": "27 Nov 2026, 02:24 PM IST", "pub_date_relative": "53m ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Derivatives", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "IORA nations must enhance collaboration: EAM Jaishankar", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a IORA nations must enhance collaboration: EAM Jaishankar The Economic Times daily newspaper is available online now. Read Today's Paper IORA nations must enhance collaboration: EAM Jaishankar SECTIONS IORA nations must enhance collaboration: EAM Jaishankar PTI Last Updated: Nov 27, 2026, 02:21:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis External Affairs Minister S Jaishankar highlighted the significance of the Indian Ocean for global trade and energy security. He stated that regional cooperation is vital to address the shared challenges faced by littoral states. Jaishankar emphasized that IORA must adapt to geopolitical changes and enhance its collective voice. India's theme for IORA promotes innovation and resilience in the region.\n\nHow rare is Nvidia's CEO comeback, really? The record for 20 years has an answer\n\nThe fall is new, the pattern is 11 years old: Making sense of gold's crash\n\nAs AI sharpens cyber attacks, should listed companies follow one standard in reporting them?\n\nKYC and KYB: Zydus Lifesciences \u2013 From the chemist\u2019s counter to US pharmacies. Part 1 of 3\n\nWhat would it take for the world to stop needing the Strait of Hormuz?\n\nHidden export winners: The unlikely products finding real buyers abroad\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "27 Nov 2026, 02:21 PM IST", "pub_date_relative": "55m ago", "cfa_topics": ["Economics", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Income tax deadline 30 November: Who needs to file ITR by this date? Check eligibility, applicable rules and key details", "full_content": "The deadline to file income tax returns ( ITR ) for Assessment Year (AY) 2026\u201327 is 30 November 2026 for taxpayers who are required to furnish a transfer pricing report under Section 92E of the Income-tax Act, 1961.\n\nThis deadline also covers certain partners of firms and their spouses, subject to the conditions prescribed under the law.\n\nUnlike the general ITR filing deadline applicable to many individual taxpayers , the 30 November deadline applies to a specific category of taxpayers for whom the provisions of Section 92E are applicable.\n\nSection 92E requires taxpayers who enter into international transactions or specified domestic transactions to obtain a report from a chartered accountant.\n\nAn international transaction generally involves dealings between associated enterprises, such as two related companies. Specified domestic transactions cover certain transactions within India that meet prescribed conditions.\n\nThe accountant's report must be furnished in Form 3CEB. It contains details of the relevant transactions and helps tax authorities examine whether the pricing of these transactions complies with the arm's length principle under transfer pricing rules.\n\nTaxpayers who furnished Form 3CEB by 31 October 2026 must still file their income tax returns by 30 November 2026. The two filings serve different purposes: Form 3CEB reports details of applicable international or specified domestic transactions, along with the accountant's opinion, while the ITR captures the taxpayer's income, deductions, tax liability, and other prescribed disclosures.\n\nWhile preparing the ITR, taxpayers should reconcile the information reported in Form 3CEB with their audited financial statements and tax computations. Any transfer-pricing adjustments or other tax-related changes should be appropriately reflected in the return.", "source": "LiveMint Money", "pub_date_str": "27 Nov 2026, 02:17 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Asian Stocks Rise for Second Day, Treasuries Slip: Markets Wrap - Bloomberg.com", "full_content": "Asian Stocks Rise for Second Day, Treasuries Slip: Markets Wrap Bloomberg.com Stock futures rise as Wall Street gets set to wrap up a volatile holiday week: Live updates CNBC Stock market today: Dow, S&P 500, Nasdaq futures gain as AI jitters steady Yahoo Finance US tech stocks set to jump at open as volatile trading continues Financial Times Stock Futures Jump as AI Trade Set for Rebound WSJ", "source": "Google News Business", "pub_date_str": "27 Nov 2026, 02:07 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Derivatives"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Gold price forecast: Fed rate hike in December may limit recovery to \u20b91.30 lakh per 10 grams by 2026-end, says expert", "full_content": "Gold prices are closely linked to US Federal Reserve interest rate decisions. The Fed's next Federal Open Market Committee (FOMC) meeting is scheduled for 8-9 December 2026, with the interest rate decision expected on 9 December.\n\nThe Fed last raised interest rates by 25 basis points in September, taking the federal funds target range to 3.75%\u20134.00%. This was its first rate hike since 2023. At its subsequent October meeting, the FOMC kept rates unchanged at 3.75%\u20134.00%\n\nA Fed rate hike generally puts downward pressure on gold prices. Gold is a non-interest-bearing asset and does not generate regular income, unlike bonds or bank deposits.\n\nWhen interest rates rise, interest-bearing investments can become more attractive to investors, reducing gold's appeal. Higher US interest rates can also strengthen the dollar and push bond yields higher, creating further pressure on gold prices.\n\nHowever, gold prices have recovered over the past two days, after falling to around \u20b9 1.22 lakh per 10 grams from their January peak of \u20b9 1.8 lakh. On 27 November, MCX December gold futures were trading at \u20b9 1,25,354 per 10 grams, up 2.52%, as of 1:24 pm.\n\nWith the December Fed meeting approaching, what should Indian investors expect from gold prices? And should they invest now or wait for a correction? Here's what an expert says.\n\nGaurav Garg, Head \u2013 Research, Lemonn, a SEBI-registered online broking platform offering stocks, F&O, mutual funds and IPOs, told LiveMint that gold has recovered over the past two sessions, but the sustainability of this rebound remains uncertain. With expectations of a US Federal Reserve rate hike in December and potentially further tightening in early 2027, elevated US bond yields and a stronger dollar could continue to restrict gold\u2019s upside, he said.\n\nHe shared that higher interest rates reduced the attractiveness of non-interest-bearing assets such as gold.", "source": "LiveMint Money", "pub_date_str": "27 Nov 2026, 01:43 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Derivatives", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Private markets are more accessible than ever for investors. Getting out is another matter", "full_content": "Retail investors are lining up to back private funds. But education on how restrictive these funds can be, particularly on when and how much money they can get back, may not be keeping pace with the influx of new capital.\n\nPwC research has found that 77% of fund distributors surveyed said access to private markets is becoming important or very important to what they plan to offer clients, but just 15% of asset managers said they provide comprehensive education for retail investors.\n\nUnlike the public markets retail investors are more used to, some private-market vehicles limit when investors can get their money back to set repurchase windows, and even then may return only part of what they request.\n\nA spike in redemption requests at several private-credit funds earlier this year exposed the tension between giving investors regular opportunities to cash out and holding assets that can be difficult to sell quickly .\n\nBlackstone restricted withdrawals from its $79 billion flagship nontraded BCRED private credit fund to 5% of shares in June, after redemption requests hit 10% during the second quarter. Apollo also capped withdrawals in its Apollo Debt Solutions vehicle at 5% after second-quarter redemption requests surged to almost 17%. Blue Owl , Morgan Stanley and Partners Group also limited investor withdrawals from some of their funds.\n\nLimitations on redemptions are a key trade-off in structures such as LTAFs in the U.K., ELTIFs in the EU and interval funds in the U.S., which broaden access to less-liquid assets.\n\nIt's emerged as a major pressure point as those structures come under closer scrutiny.\n\n\"Private markets can have very different characteristics from the products many wealth clients are used to, particularly around liquidity, valuations and holding periods,\" said Albertha Charles, global asset and wealth management leader at PwC.", "source": "CNBC Top News", "pub_date_str": "27 Nov 2026, 01:35 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Up 57% YTD! Healthcare stock shows resilience against the Indian stock market crash; should you buy? Target, stop-loss", "full_content": "Vaamanaa Sethi Published 27 Nov 2026, 01:33 PM IST Prefer Livemint on Google Healthcare stock Park Medi World has remained relatively resilient amid the weakness in the broader Indian stock market on Friday, November 27. The stock opened at \u20b9 240.81 and touched an intraday high of \u20b9 240.81 and a low of \u20b9 231.81 during the intraday session.\n\nMeanwhile, the benchmark indices were under pressure on Friday, with the Sensex falling nearly 700 points and the Nifty slipping below the 25,700 mark in morning trade. Selling in IT, banking and other heavyweight stocks weighed on market sentiment.\n\nPark Medi World recently announced the completion of its acquisition of Mehar Mediserve LLP, which owns and operates Mehar Hospital in Zirakpur, Punjab.\n\nIn an exchange filing dated November 26, the company confirmed that it had completed the acquisition of 100% of Mehar Mediserve LLP on a fully diluted basis. Following the transaction, Mehar Mediserve LLP has become a wholly owned subsidiary of Park Medi World.\n\nThe acquisition was initially announced on August 3, 2026, and involves a 150-bed hospital in Zirakpur. The transaction is expected to strengthen the company's presence in the Tricity region of Chandigarh, Mohali and Panchkula.\n\nEarlier, in its Q2 FY27 investor presentation, Park Medi World had highlighted plans to expand its hospital network through acquisitions, new facilities and capacity additions.\n\nThe company added 680 beds during the first half of FY27 through the acquisition of a hospital in Rudrapur and the commissioning of its Panchkula facility. This took its total bed capacity to 4,290 as of September 30, 2026.\n\nPark Medi World is also expanding its footprint through a 300-bed multi-super-speciality hospital in Kanpur under a long-term operations and management arrangement. The facility is expected to be commissioned in Q4 FY27.", "source": "LiveMint Markets", "pub_date_str": "27 Nov 2026, 01:33 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Portfolio Man
