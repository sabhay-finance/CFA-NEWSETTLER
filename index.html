opic."}, {"title": "Gold rally puzzles investors: Prices rise despite stronger dollar and higher yields; expert sees \u20b91.50 lakh in one year", "full_content": "Gold prices in India rose for the third consecutive day on Friday, 27 November, closing at \u20b9 1,25,350 per 10 grams. The precious metal gained more than 0.12% on MCX, putting it on course to snap a two-week losing streak.\n\nIn the international market, spot gold is trading at around $3,654 per ounce, up 2.44%, as of 11:52 PM on 28 November. The recovery comes despite a challenging global environment, as rising bond yields and a stronger US dollar generally put pressure on gold prices.\n\nThe next US Federal Open Market Committee (FOMC) interest rate decision is scheduled for 9 December.\n\nGold is a non-interest-bearing asset and does not generate regular income, unlike bonds. Therefore, higher interest rates generally make interest-bearing investments more attractive, reducing gold's appeal.\n\nA stronger US dollar makes gold more expensive for buyers using other currencies, while higher bond yields make gold less attractive compared with interest-paying investments. Both can put pressure on gold prices.\n\nAs of 28 November, the US Dollar Index had risen 0.20% over the past five sessions to 104.01, while the US 10-year Treasury yield stood at 4.93%, up 9.2 basis points over the past year. However, gold has continued to recover despite these headwinds.\n\nKaynat Chainwala, AVP \u2013 Commodity Research, Kotak Neo, said spot gold was trading near $3,670 per ounce, with prices recovering as a rebound in technology stocks and a softer US dollar eased liquidation pressure earlier in the week. Gold has gained more than 4% so far this week, recovering some of its recent losses.\n\n\u201cWhile prices could extend higher toward $3,750/oz for gold, upside is likely to be capped as the macro backdrop remains challenging, with a hawkish Fed outlook and strong US data,\u201d she added.", "source": "LiveMint Money", "pub_date_str": "28 Nov 2026, 12:52 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Fixed Income", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "RBI Steps Up Gold Loan Scrutiny As Bullion Rout Signals Strain", "full_content": "IIFL Finance's nonperforming assets in the gold portfolio edged higher to 0.9% of total loans as of end-September, from 0.6% in the prior quarter.", "source": "NDTV Profit", "pub_date_str": "28 Nov 2026, 12:47 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments", "Portfolio Management"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "RBI steps up scrutiny of gold loans as bullion price slump raises collateral risks", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Finance \u203a RBI steps up scrutiny of gold loans as bullion price slump raises collateral risks The Economic Times daily newspaper is available online now. Read Today's Paper RBI steps up scrutiny of gold loans as bullion price slump raises collateral risks SECTIONS RBI steps up scrutiny of gold loans as bullion price slump raises collateral risks By Siddhi Nayak , Bloomberg Last Updated: Nov 28, 2026, 12:44:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India's Reserve Bank is monitoring the gold-loan sector due to falling bullion prices and potential borrower distress. The sector has expanded significantly, but recent price drops could lead to loan delinquencies. Borrowers may need to pledge additional collateral or repay debts as their gold loans become inadequately backed. Encounters of repayment stress are already visible among major lenders such as IIFL Finance and Bajaj Finance.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\nKYC and KYB: Zydus Lifesciences \u2013 From sales to profit, how Zydus earns. Part 2 of 3\n\nHow rare is Nvidia's CEO comeback, really? The record for 20 years has an answer\n\nThe fall is new, the pattern is 11 years old: Making sense of gold's crash\n\nAs AI sharpens cyber attacks, should listed companies follow one standard in reporting them?\n\nKYC and KYB: Zydus Lifesciences \u2013 From the chemist\u2019s counter to US pharmacies. Part 1 of 3\n\nWhat would it take for the world to stop needing the Strait of Hormuz?", "source": "Economic Times Economy", "pub_date_str": "28 Nov 2026, 12:42 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Concurrent Gainers: 9 stocks that gain for 5 days in a row", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News Concurrent Gainers: 9 stocks that gain for 5 days in a row Written by Rounak Khare , ETMarkets.com | Nov 28, 2026, 12:42:46 PM IST 1 / 10 Consistent Gainers Over the five trading sessions ending November 27, the Sensex declined 1.17%, or 989.33 points, to close at 83,339, marking gains in three of the five sessions. Around 9 stocks from the BSE 500 index advanced in all five consecutive sessions from November 19 to 27, delivering cumulative returns ranging from 5% to 17%. (Data Source: ACE Equity)", "source": "Economic Times Markets", "pub_date_str": "28 Nov 2026, 12:36 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Natural Gas Services Group CEO buys $8,250 in company stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Nov 2026, 12:31 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "\u20b950 lakh HDFC Bank home loan for 20 years: How much EMI will you pay at 8%, 9% and 10% interest?", "full_content": "Taking a \u20b9 50 lakh home loan for 20 years can mean a substantial financial commitment, with the monthly EMI and the total interest outgo depending on a host of factors such as the applicable interest rates, the individual applicant, and their past payment history, credit score and overall credit profile.\n\nIt is vital to keep in mind that even a relatively minor-looking 1 percentage point difference in the interest rates can significantly change and alter the repayment cost an individual pays over the complete loan tenure.\n\nThis write-up is dedicated to understanding the possible implications of a percentage-point difference in home loan rates and how it can result in meaningful financial outgoings over the years.\n\nAs per the HDFC Bank's home loan EMI calculator, a borrower aspiring to avail a \u20b9 50 lakh loan for 20 years will be required to pay a monthly EMI of \u20b9 41,822 at 8% interest. Let us now compare the three different cases of home loans at 8%, 9% and 10%.\n\nAt an annual interest rate of 8%, the monthly EMI works out to \u20b9 41,822. Over 20 years, the borrower will pay approximately \u20b9 50.37 lakh in interest, taking the total repayment to a little more than \u20b9 1 crore. The complete details as per the HDFC Bank calculator are presented below.\n\nNow, if the interest rate increases to 9% while the other parameters remain the same, the monthly EMI rises to \u20b9 44,986. The total interest outgo also increases to nearly \u20b9 58 lakh over the repayment period . Highlighting how the burden of debt silently rises over the years with just a minor increase in the interest rates. The complete calculations of the same are as follows:\n\nThis is yet another interesting case for aspiring borrowers to carefully observe. In this case, where at 10% interest, the monthly EMI increases further to \u20b9 48,251.", "source": "LiveMint Money", "pub_date_str": "28 Nov 2026, 12:26 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "LIC portfolio stocks! 10 stocks where LIC had the highest stake in Q2. How many do you own?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News LIC portfolio stocks! 10 stocks where LIC had the highest stake in Q2. How many do you own? Written by Veer Sharma , ETMarkets.com | Nov 28, 2026, 12:32:34 PM IST 1 / 11 Portfolio Watch Life Insurance Corporation of India (LIC) holds significant stakes in several companies across different sectors of the Indian stock market. Data for the quarter ended September 30, 2026, highlights the 10 companies in which the insurer had its highest shareholding, along with their respective market capitalisations and LIC's ownership percentages. Here\u2019s the full list.\n\nLife Insurance Corporation of India (LIC) held a 49.24% stake in IDBI Bank as of September 30, 2026. The bank had a market capitalisation of Rs 82,191 crore.\n\nLIC held a 45.24% stake in LIC Housing Finance as of September 30, 2026. The company had a market capitalisation of Rs 26,953 crore.\n\nLIC owned a 16.45% stake in ITC as of September 30, 2026. The company had a market capitalisation of Rs 3,23,162 crore.\n\nLIC held a 13.47% stake in NMDC Steel as of September 30, 2026. The company had a market capitalisation of Rs 11,007 crore.\n\nLIC owned a 13.12% stake in Mahanagar Telephone Nigam as of September 30, 2026. The company had a market capitalisation of Rs 1,434 crore.\n\nLIC held a 13.07% stake in Larsen & Toubro as of September 30, 2026. The company had a market capitalisation of Rs 5,01,789 crore.\n\nLIC owned a 12.14% stake in Dr. Reddy's Laboratories as of September 30, 2026. The pharmaceutical company had a market capitalisation of Rs 1,02,624 crore.", "source": "Economic Times Markets", "pub_date_str": "28 Nov 2026, 12:23 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Multibagger circuit-to-circuit stock jumps 2350% in 2026, hits 5% upper circuit for 14 days in a row | Do you own?", "full_content": "Multibagger Circuit-to-Circuit Stocks in India: Shares of Mrugesh Trading Ltd have been on an uptrend for a long time. However, the stock has found no seller for the last 14 straight sessions, hitting the 5% upper circuit since 9 November 2026. Mrugesh Trading Ltd share price has rallied from \u20b9 5.73 to \u20b9 140.54 per share on the BSE , delivering over 2,350% returns to its shareholders in YTD. In six months, this multibagger stock has risen over 280%, whereas in one month, this circuit-to-circuit stock has almost doubled shareholders' money by rising 95%.\n\nOn Friday last week, Mrugesh Trading Ltd touched the upper circuit and finished at \u20b9 140.54 per share, which is its lifetime high as well. So, in other words, the multibagger circuit-to-circuit stock has been hitting a record high on a regular basis while finding no seller during the trading session on Dalal Street.\n\nThe commodity trading company\u2019s recent share price performance has coincided with an improvement in its financial performance. For the quarter ended September 2026, Mrugesh Trading reported total income of \u20b9 2.19 crore, an increase of approximately 123% compared with \u20b9 98.3 lakh in the corresponding quarter of the previous year. Net profit stood at \u20b9 14.2 lakh, against a net loss of Rs. 2.90 lakh in the year-ago period.\n\nProfitability indicators also improved during the quarter, with the operating profit margin moving from a negative 2.95% to more than 14%, and the net profit margin increasing from a negative 2.95% to 8.28%.\n\nThe multibagger stock Mrugesh Trading Ltd finished on Friday with a market capitalisation of \u20b9 10,150 crore. The trade volume of the BSE-listed stock on Friday was above 2.03 lakh. This means the multibagger stock, which has remained as one of the circuit-to-circuit stocks in the Indian stock market these days, is a high float stock.\n\nMrugesh Trading is engaged in commodity trading, with a focus on agricultural commodities and bulk goods.", "source": "LiveMint Markets", "pub_date_str": "28 Nov 2026, 12:12 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Top stocks to watch on Monday, Nov 30: Suzlon, Zee, Tata Group stocks, KEC, Bosch, APL Apollo, among 10 shares in focus", "full_content": "UJJIVANSFB null KEC SUZLON Pranati Deva Published 28 Nov 2026, 11:56 AM IST Prefer Livemint on Google Stocks to watch : After a volatile, holiday-shortened week that snapped the domestic market's four-week winning streak, investors will track a fresh set of corporate announcements, order wins and regulatory developments on Monday, November 30. Suzlon Energy , Tata Group companies, Zee Entertainment, KEC International , Bosch and APL Apollo are among the stocks likely to remain in focus.\n\nThe Nifty 50 declined 0.75% over the week, while the Sensex shed 0.69%, as rising crude oil prices, a weaker rupee and selling in heavyweight stocks weighed on sentiment. Here are 10 stocks to watch at the start of the next trading week.\n\nSuzlon Energy bagged India's first wind repowering project from the Tata Group. According to Suzlon Group CEO Ajay Kapur, the initial order is small, but the opportunity is significant, with wind repowering representing a potential 25 GW market. The government had announced a wind repowering policy three years ago to replace ageing, low-capacity turbines.\n\nTata Sons' board meeting scheduled for November 30 will proceed after the Bombay High Court refused to stay or defer it. However, the outcome will remain subject to the final decision in ongoing legal proceedings concerning Tata Trusts' affirmative voting rights. The trusts had approached the court seeking an injunction, alleging that the Tata Sons chairman's casting vote was used to override the mandatory voting rights of their nominee directors.\n\nBosch has fixed December 24, 2026, as the deemed date of allotment for its bonus shares. The company will submit the necessary documents to depositories for crediting the shares by noon on that day. The bonus shares are scheduled to become available for trading from December 28.\n\nAPL Apollo Tubes said SEBI has extended the deadline for Tata Steel's open offer to acquire up to a 26% stake in the company to December 8, from December 1.", "source": "LiveMint Markets", "pub_date_str": "28 Nov 2026, 11:56 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Defense company Chemring protects NATO fleets. Here's why an activist investor wants it to break up", "full_content": "A hedge fund activist says a Chemring overhaul could unlock up to 80% share upside in the defense stock.", "source": "CNBC Top News", "pub_date_str": "28 Nov 2026, 11:45 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Bond market to stay cautious ahead of RBI policy: Equirus", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Bonds \u203a Bond market to stay cautious ahead of RBI policy: Equirus Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Bond market to stay cautious ahead of RBI policy: Equirus SECTIONS Bond market to stay cautious ahead of RBI policy: Equirus PTI Last Updated: Nov 28, 2026, 11:43:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The bond market is expected to remain cautious due to persistent inflationary pressures and anticipated rate hikes. Analysts predict a 25 basis points hike in the RBI's upcoming monetary policy review. Market yields are likely to be influenced by geopolitical tensions and global bond movements. Foreign portfolio investor inflows and stable currency conditions may provide some support for bond yields.\n\nThe bond market is expected to remain cautious due to persistent inflationary pressures and anticipated rate hikes. Analysts predict a 25 basis points hike in the RBI's upcoming monetary policy review. Market yields are likely to be influenced by geopolitical tensions and global bond movements. Foreign portfolio investor inflows and stable currency conditions may provide some support for bond yields.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "28 Nov 2026, 11:43 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Saudi Arabia shifts Vision 2030 spending amid economic and security pressure", "full_content": "Saudi Arabia's economic diversification strategy has moved from \"spending and delivery at any cost\" to \"spending and delivery at the right cost,\" Economy Minister Faisal Alibrahim told CNBC on Friday.\n\nIt comes after the Kingdom scaled back or cut several flagship projects as it endures a sharp economic contraction.\n\nAlibrahim also said Saudi Arabia would \"stop at nothing from realizing long-term sustainable stability in the region\" amid ongoing Houthi strikes on civilian and energy infrastructure that have killed and injured dozens and repeatedly rocked oil markets .\n\n\"The phase we're in today is one where every riyal is deployed with greater precision... it was clear that while we want to diversify or restructure our economy to depend less on government spend, there was a lot of catch-up that needed to be done, and for that, you saw government spend leading the way,\" Alibrahim told CNBC's Dan Murphy.\n\n\"Right now, that is shifting from spending and delivery at any cost to spending and delivering at the right cost. We're moving towards a policy-first approach to many of our policy areas and... objectives.", "source": "CNBC Top News", "pub_date_str": "28 Nov 2026, 11:30 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Alternative Investments", "Portfolio Management"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Africa\u2019s richest man is taking his mega-refinery public in a blockbuster IPO", "full_content": "One of the world's largest oil refineries is set to become Africa's biggest public firm in a highly anticipated offering that the continent's richest man has marketed as an \"IPO for the people.\"\n\nDangote Petroleum Refinery and Petrochemicals FZE, founded by Nigerian billionaire Aliko Dangote, is expected to begin trading in Lagos on Dec. 1, according to multiple media reports , following regulatory approval. A Dangote Refinery spokesperson did not respond to a CNBC request for comment.\n\nThe IPO of a minority stake in the refinery has reportedly been heavily oversubscribed, with investors from 120 countries and all 54 African countries applying to buy shares, Dangote Refinery said. The shares were offered at 525 naira ($0.39).\n\nReuters' calculations put Dangote Refinery's IPO-implied valuation at about $47 billion, based on the offer price and the company's registered share count. That would make it the biggest stock market listing Africa has ever seen.\n\nThe Lagos-based refinery is regarded as a crown jewel of Nigeria's energy industry given the facility's role in transforming the oil-rich country's fuel market since it started operating in 2024.\n\n\"With a minimum subscription of just 10 shares, the offer is designed to give ordinary Nigerians and Africans an opportunity to own a stake in the refinery,\" Aliko Dangote said at the IPO launch in early September.\n\n\"The IPO is positioned not simply as a capital-raising exercise, but as an opportunity for workers, entrepreneurs and everyday Nigerians to participate in the refinery's future growth,\" he added.\n\nBuilt for around $20 billion, the Dangote Refinery is now one of the largest in the world, with a crude oil distillation capacity of between 650,000 to 700,000 barrels per day.", "source": "CNBC Top News", "pub_date_str": "28 Nov 2026, 11:30 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Bitcoin price falls below $60,000 as whales buy dip, ETF outflows mount", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Nov 2026, 11:26 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Alternative Investments", "Portfolio Management"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Suzlon Energy shares: Down 36% in 6 months! Will it rebound after winning wind repowering project from Tata Group?", "full_content": "Asit Manohar Published 28 Nov 2026, 11:14 AM IST Prefer Livemint on Google Stocks to buy | Suzlon Energy share price target: Suzlon Energy shares are one of the most watched stocks by Indian stock investors. The reason for this close watch is the long wait for the company's turnaround from debt to profitability. Suzlon shares witnessed a re-rating after the company became debt-free. Now, investors are eagerly awaiting the second round of re-rating \u2014 profit-making company status \u2014 which is expected to spur a fresh uptrend, followed by a re-rating in the stock.\n\nAccording to stock market experts, Indian stock investors' wait may not go on long as the company has won India's first wind repowering order from the Tata Group. The renewable energy sector will be opening a new avenue for revenue generation, as the Government of India (GoI) has been working on this policy for the last three years. They said that Tata Group's order is small, but the new revenue stream is expected to blossom at a faster rate, enabling the company to become profitable in the near term.\n\nSpeaking on the Tata Group's order bagged by Suzlon Energy, Seema Srivastava, Senior Research Analyst at SMC Global Securities, said, \u201cThe Tata Group order is small in size, but it is India's first wind repowering order, a policy on which the GoI has been working for the last three years. This is going to opene a new window of opportunity for the company and this business is expected to blossom at a very faster rate. So, a new business opportunity is expected to help the company attain profitability, for which stock investors have been waiting for a long time.\u201d\n\nPointing towards the push to re-rating in Suzlon share price, Seema Srivastava said, \u201cSuzlon shares witnessed a re-rating after becoming a debt-free company. However, the company is unable to enter the second phase of re-rating by becoming a profit-making company. Investors are eagerly waiting for the company's balance sheet turnaround.", "source": "LiveMint Markets", "pub_date_str": "28 Nov 2026, 11:14 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Gold, silver prices today, 28 November: Check retail rates of 24K, 22K gold, 999 silver in Delhi, Mumbai and Kolkata", "full_content": "Gold and silver prices, 28 November: Gold and silver prices closed higher in domestic markets on Friday, despite a strong US dollar and expectations of tighter Federal Reserve policy. The MCX will remain closed today and resume trading on Monday.\n\nIn the international market, gold prices edged higher on Friday after the previous \u200bsession\u2019s plunge to \u200ba 15-month low, \u200bas hot US inflation data reinforced expectations of Federal Reserve interest rate hikes, as per a report by Reuters.\n\nSpot gold rose 0.3% to $3,591.37 an ounce. Bullion briefly fell below the \u2060key $3,500 \u200clevel on Wednesday for the first time since \u2060September 2025. US gold futures for December delivery gained 1.5% to $3,589.50.\n\nIn the domestic market, MCX gold prices closed 2.61% higher at \u20b9 1,26,000 per 10 grams, while MCX silver prices closed 4.84% higher at \u20b9 1,53,640 per kg on Friday.\n\nGold is available in different purities in the retail market, with 24-karat gold being the purest form and 22-karat gold commonly used to make jewellery due to its greater durability. Silver 999, also known as 99.9% pure silver, is a     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
