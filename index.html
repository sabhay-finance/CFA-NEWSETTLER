    const allData = {"general": [{"title": "Trump tells South Korea to sign on to Alaska LNG deal or 'I'll just charge them more'", "full_content": "U.S. President Donald Trump said he \"didn't jump the gun\" in announcing South Korea's participation in a $50 billion Alaska liquefied natural gas project, warning Seoul could pay \"double\" if it does not sign on soon.\n\nHis remarks come amid a discrepancy between Washington and Seoul over South Korea's planned energy and infrastructure investments in the U.S., with Trump announcing projects that Seoul has said are not yet finalized.\n\n\"If they don't want to do it, that's OK with me. I'll just charge them more,\" Trump told reporters Friday, according to the White House. \"Tell them if they don't sign shortly, I'm going to double it up.\"\n\nTrump did not specify what would be doubled. South Korean local media, though, raised the possibility that he was referring to higher tariffs on the country.\n\nWhen asked whether he had prematurely announced South Korea's involvement in the Alaska LNG project, Trump said he \"didn't jump the gun.\"\n\nTrump's remarks come after South Korea said it was still assessing the Alaska LNG project, with any participation dependent on its commercial viability and compliance with domestic legal procedures.\n\nSeparately, Trump said Friday on Truth Social that South Korea's investment deal \"keeps getting BETTER,\" announcing an additional $8.4 billion enhanced oil recovery project.\n\nEnhanced oil recovery uses techniques such as carbon dioxide injection to increase the amount of crude produced from an oil field.", "source": "CNBC Top News", "pub_date_str": "05 Oct 2026, 09:44 PM IST", "pub_date_relative": "2m ago"}, {"title": "AI researchers detail safety risks at NYC Council with Anthropic, OpenAI, Google and Meta execs set to testify", "full_content": "Anthropic whistleblower Jacob Coxon, who raised early concerns about the dire risks of artificial intelligence , called out the industry's \"extremely reckless\" approach to development during a New York City Council hearing on Monday.\n\n\"On the current path, I think it is more likely than not that humanity loses control to these AIs, and it could end in human extinction,\" he told a packed room. \"From my experience, the companies are being extremely reckless given the stakes.\"\n\nBoth Coxon and former OpenAI researcher Daniel Kokotajlo warned of the dangers that the \"move fast and break things\" culture at the companies poses with such a transformative technology.\n\nCoxon said that method works for a \"photo-sharing app\" but not \"for building the most powerful technology ever built.\"\n\nKokotajlo suggested two policy recommendations during his testimony, calling on the AI industry to increase transparency and slow the leading model development.\n\nNew York City Council Speaker Julie Menin asked Coxon, Kokotajlo and former Google DeepMind research scientist Alex Turner how to balance frontier model development in the context of the technology race with China.\n\n\"China is not our only potential adversary,\" Turner said. \"With reasonably high chance, we are racing to build and grow our own adversary here at home, which is misaligned AI. Misaligned AI is everyone's adversary, including our own, and one day may be more powerful than China.\"\n\nSenior leaders from Anthropic , OpenAI, Google and Meta are also slated to testify under oath about the potential dangers of artificial intelligence on Monday, following a month of intense debate surrounding the risks posed by advanced AI models.", "source": "CNBC World Economy", "pub_date_str": "05 Oct 2026, 09:42 PM IST", "pub_date_relative": "4m ago"}, {"title": "Saudi Aramco\u2019s CEO may be too downbeat about the road to restocking global oil supplies", "full_content": "Some see record oil production and more alternative routes for delivery once the Strait of Hormuz fully opens.", "source": "MarketWatch Top Stories", "pub_date_str": "05 Oct 2026, 09:38 PM IST", "pub_date_relative": "8m ago"}, {"title": "\u2018The pain was excruciating\u2019: A friend in her 80s fell down her basement stairs. Could it have been avoided?", "full_content": "\u201cShe developed pleural effusion \u2014 fluid between the lungs and ribs \u2014 compressing her lungs and making it hard for her to breathe.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "05 Oct 2026, 09:30 PM IST", "pub_date_relative": "16m ago"}, {"title": "Ahead of Market: 10 things that will decide stock market action on Tuesday", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Ahead of Market: 10 things that will decide stock market action on Tuesday HDFC Bank Share Price ICICI Bank Share Price Kotak Mahindra Bank Share Price Axis Bank Share Price Federal Bank Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Ahead of Market: 10 things that will decide stock market action on Tuesday SECTIONS Ahead of Market: 10 things that will decide stock market action on Tuesday By Debaroti Adhikary , ETMarkets.com Last Updated: Oct 05, 2026, 09:27:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Indian equities rebounded on Monday after eight consecutive weekly losses, with Sensex rising 473 points and Nifty gaining 134 points. Softer US jobs data and lower crude prices supported sentiment, though analysts flagged bond yields, currency risks, RBI policy and earnings uncertainty.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "05 Oct 2026, 09:27 PM IST", "pub_date_relative": "18m ago"}, {"title": "Russia plague: What we know about the suspected case reportedly linked to a lab worker\u2019s death", "full_content": "A researcher at a Russian anti-plague institute has died of what's been identified as a case of the plague , according to reports.\n\nMuch is still unknown about the developing situation, but according to local media reports, as many as 189 people have also been placed under medical observation in Irkutsk, a region in eastern Siberia, due to exposure to the potentially deadly disease.\n\nThe World Health Organization said it was aware of reports that a laboratory worker in Irkutsk oblast died of severe pneumonia on Friday, and that it had offered support to Russia. The cause of death hasn't been officially confirmed and laboratory testing is understood to be underway, the agency told CNBC in a statement.\n\n\"All of the patient's contacts have reportedly been identified and are being monitored for illness, and none to date have shown symptoms of illness,\" the WHO said.\n\nPlague is a rare but potentially fatal bacterial infection that remains endemic in parts of the world, including the western parts of the U.S., but can be treated with antibiotics if identified quickly. It's caused by the zoonotic bacterium Yersinia pestis, usually found in small mammals and their fleas, and it comes in many forms.\n\nBubonic plague is the classic plague associated with the Black Death in the 14th century. Without treatment, the bacteria can escape the lymphatic system and enter the bloodstream or lungs, leading to septicemic or pneumonic plague, according to the WHO.\n\nThe recent case in Russia appears to be pneumonic plague, where the bacteria infect the lungs. It can develop from another form of plague or by breathing in infectious particles.\n\nAs opposed to bubonic plague, which produces swollen and painful lymph nodes (buboes) and generally doesn't travel person to person, pneumonic plague may be a bigger concern from a disease control perspective.", "source": "CNBC Top News", "pub_date_str": "05 Oct 2026, 09:27 PM IST", "pub_date_relative": "19m ago"}, {"title": "U.S. stocks tick higher as bond market moves, oil prices remain in the spotlight", "full_content": "", "source": "Investing.com News", "pub_date_str": "05 Oct 2026, 09:26 PM IST", "pub_date_relative": "20m ago"}, {"title": "Marico raises stake in Plix parent to 84.09%; Q2 revenue expected to grow in double digits", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Marico raises stake in Plix parent to 84.09%; Q2 revenue expected to grow in double digits Marico Share Price Godrej Consumer Products Share Price Dabur India Share Price Colgate-Palmolive (India) Share Price Gillette India Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Marico raises stake in Plix parent to 84.09%; Q2 revenue expected to grow in double digits SECTIONS Marico raises stake in Plix parent to 84.09%; Q2 revenue expected to grow in double digits By Kumar Gaurav , ETMarkets.com Last Updated: Oct 05, 2026, 09:25:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Marico has raised its stake in Satiya Nutraceuticals, owner of The Plant Fix\u2013Plix, to 84.09% after acquiring an additional 24.09% for Rs 1,012.03 crore. The company also reported strong Q2 momentum and expects double-digit revenue growth and mid-twenties operating profit growth.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "05 Oct 2026, 09:25 PM IST", "pub_date_relative": "21m ago"}, {"title": "US Supreme Court hears bid by oil companies to avoid climate lawsuit", "full_content": "", "source": "Investing.com News", "pub_date_str": "05 Oct 2026, 09:24 PM IST", "pub_date_relative": "22m ago"}, {"title": "Nasdaq rises to fresh record high led by tech; traders eye oil and yields: Live updates", "full_content": "The Nasdaq Composite sailed to a fresh all-time high as traders watched U.S. Treasury yields and digested new U.S. economic data.\n\nThe Nasdaq Composite was up more than 0.7% to hit as much as $27,403.57, or its highest level ever. Meanwhile, the Dow Jones Industrial Average last traded down 91 points, shedding nearly 0.2%. The S&P 500 advanced about 0.4%.\n\nThe tech-heavy Nasdaq was led higher by several stocks tied to the artificial intelligence trade. SpaceX jumped roughly 5%, while hyperscalers Meta and Microsoft ticked up more than 2% and 1%, respectively. Nvidia gained more than 1%, while Tesla rose nearly 2%.\n\nTech stocks rallied as bond yields also advanced. The benchmark 10-year Treasury note yield was last up about 2 basis points to 5.298%, while the 30-year was rose 3 basis points at 5.659%. Both yields surged to multiyear highs in recent weeks, as traders fretted that inflation would lead the Fed to keep rates higher for longer.\n\nStocks and bonds moved as traders processed the Institute for Supply Management's latest report on economic growth in the services sector. The ISM report showed that the Purchasing Manager's Index grew 54.9% in September, or roughly in line with expectations. However, that figure came in modestly below the index's rate of growth for the previous month.\n\nInvestors are now turning their attention to other sources of information. On Wednesday, the Fed will release notes from its September meeting, potentially shedding light on its decision to hike rates by a quarter of a percentage point last month.\n\nTraders also monitored oil prices, which were lower on Monday. Brent crude futures shed more than 0.7% to trade at $101.51 a barrel, while West Texas Intermediate crude was trading down 1% at $88.53 a barrel.\n\nStocks are coming off a week defined by surging Treasury yields and a surprisingly lackluster jobs report that helped ease concerns about another Fed rate hike this month.", "source": "CNBC Top News", "pub_date_str": "05 Oct 2026, 09:24 PM IST", "pub_date_relative": "22m ago"}, {"title": "Penguin Solutions options flow leans bullish amid high implied volatility", "full_content": "", "source": "Investing.com News", "pub_date_str": "05 Oct 2026, 09:22 PM IST", "pub_date_relative": "23m ago"}, {"title": "Qualcomm and Arm begin new trial over chip testing tools", "full_content": "", "source": "Investing.com News", "pub_date_str": "05 Oct 2026, 09:22 PM IST", "pub_date_relative": "23m ago"}, {"title": "AI stock Nvidia stock gets target upgrade from BNP Paribas; 47% further upside seen by experts - check revised price", "full_content": "Chipmaking giant and \u2018Magnificent Seven\u2019 favourite Nvidia, which registered multiple record highs in 2026, is likely to continue the same momentum, according to projections by BNP Paribas.\n\nAccording to an The Economic Times report, the brokerage has retained its \u2018Outperform\u2019 rating on Nvidia, raising its target price to $345 from $285. It projects that the chipmaker\u2019s full-stack platform remains a key advantage that rivals will struggle to replicate. Mint could not independently verify the report.\n\nThe latest target price indicates a potential 47% upside from Friday\u2019s closing price. The stock has not crossed the $300 mark, with its previous all-time high at $237, which it touched last week.\n\nThe strong bullish outlook also comes at a time when the Street is concerned about rising competition and major technology companies gradually moving towards building custom chips. However, the brokerage said that Nvidia\u2019s advantage is becoming more relevant as AI moves beyond training towards increasingly complex inference workloads.\n\nIt sees Nvidia\u2019s upcoming Vera Rubin platform as evidence that the company is adapting to the next stage of AI. The platform brings together GPUs, CPUs, networking and other components into an integrated rack-scale system designed for agentic AI, where models have to reason through multi-step tasks, call tools and handle longer contexts.\n\nThese workloads require more than raw computing power, making memory, networking and the ability to move information quickly across the system increasingly important. BNP Paribas argues that Nvidia\u2019s combination of its CUDA software ecosystem and NVLink hardware architecture could give it an advantage over individual chip competitors.\n\nThe brokerage expects Nvidia to retain at least three-fourths of the AI compute market in dollar terms, even as AMD and custom accelerators from major technology companies gain ground.\n\nNetworking is another increasingly important piece of the puzzle.", "source": "LiveMint Markets", "pub_date_str": "05 Oct 2026, 09:22 PM IST", "pub_date_relative": "24m ago"}, {"title": "David Ellison and Ynon Kreiz announce Skydance leadership team", "full_content": "Paramount Skydance CEO David Ellison and incoming co-CEO Ynon Kreiz on Monday announced the executives who will help lead Skydance, the soon-to-be merged Paramount Skydance and Warner Bros. Discovery , after the deal closes on Tuesday .\n\nThe full leadership team brings together executives from both companies and will report to Ellison and Kreiz, according to a news release .\n\nBari Weiss, editor-in-chief of CBS News, and Mark Thompson, chairman and editor-in-chief of CNN Worldwide, will remain in their roles and lead the company's news divisions after the merger is completed.\n\nWeiss joined Paramount Skydance in October 2025 when the company bought digital news outlet The Free Press, which she founded.\n\nCasey Bloys, currently chairman and CEO of HBO and Max content for WBD, will serve as co-chair and chief content officer of Skydance's direct-to-consumer division, overseeing the HBO Max and Paramount+ streaming businesses, while George Cheeks, formerly a co-CEO of Paramount, will serve as co-chair and chief content officer of Skydance TV, which includes the company's global sports group.\n\nJB Perrette, who most recently served as CEO and President of global streaming and games for Warner Bros. Discovery, will co-chair both divisions alongside Bloys and Cheeks.\n\nParamount Chief Strategy Officer and Chief Operating Officer Andy Gordon will become president of Skydance. Chief Financial Officer Dennis Cinelli will stay in his role.\n\n\"The leaders joining me have built some of the most beloved franchises and businesses in the industry, and they share a deep respect for the creative process and a belief that great stories have the power to entertain, unite and inspire audiences around the world,\" Ellison said in the release.", "source": "CNBC Top News", "pub_date_str": "05 Oct 2026, 09:21 PM IST", "pub_date_relative": "25m ago"}, {"title": "Polar Capital Technology Trust discloses top holdings", "full_content": "", "source": "Investing.com News", "pub_date_str": "05 Oct 2026, 09:18 PM IST", "pub_date_relative": "27m ago"}, {"title": "Brazilian stocks jump as Bolsonaro now seen as heavy favorite to win presidency", "full_content": "Brazilians will decide in just under three weeks whether to re-elect incumbent president Luiz In\u00e1cio Lula da Silva or oust him with Fl\u00e1vio Bolsonaro \u2014 the son of former president Jair Bolsonaro \u2014 as both advanced to a run-off after receiving the most votes in the first round vote on Sunday.\n\nBut the results of the first round are recalibrating how investors are pricing what the final decision will be.\n\nSpeculators on prediction market platform Kalshi now give Bolsonaro a more than 80% chance of winning the presidency. Before Sunday's first round results came in, he had about a 60% chance to win. On Polymarket , Bolsonaro's odds are now 85%, jumping from 63% before the first round count.\n\nWhile Bolsonaro was seen as a narrow favorite to win the presidency before Sunday's first round, he was widely expected to trail the incumbent Lula in that initial tally, according to pre-election polls . This was the case even as Bolsonaro was favored to win a run-off. However, Bolsonaro secured more than 47% of the votes, and beat Lula's first round total by nearly 2 percentage points.\n\nIf no candidate receives a majority of the votes in a first round Brazilian presidential election, the two who get the most votes advance to a run-off.\n\nThe iShares MSCI Brazil ETF (EWZ) was up more than 12% on Monday. U.S.-listed shares of Itau Unibanco gained 15%, and Banco Bradesco surged 19%. Brazil's local Bovespa index was up 8%.\n\niShares MSCI Brazil ETF 1-day chart. Investors broadly saw Bolsonaro as more favorable to markets , as the candidate is promising greater fiscal discipline. In June, Brazil's deficit-to-GDP ratio was almost 10%.\n\nLula is running for a fourth term as president. He won back the presidency in 2022 \u2014 after a 12-year stint out of the office \u2014 where he defeated then-incumbent Jair Bolsonaro. Lula's campaign has tried to tie Fl\u00e1vio Bolsonaro to his father's efforts to contest his 2022 loss and brand the son as corrupt .", "source": "CNBC Finance", "pub_date_str": "05 Oct 2026, 09:17 PM IST", "pub_date_relative": "28m ago"}, {"title": "Nvidia's $20 billion Groq deal faces lawsuit alleging startup's stockholders were shortchanged", "full_content": "Nvidia's $20 billion deal to acquire assets from Groq, an AI chip designer, \"squeezed out\" stockholders, a lawsuit brought by ex-engineers at the startup alleges.\n\nJoshua Rubin and Benjamin Serebrin alleged that the deal offered stockholders a \"lowball\" price, in documents filed on Oct. 2 at the Court of Chancery of the State of Delaware.\n\nRubin and Serebrin both left Groq before its Nvidia deal was announced, per their LinkedIn profiles, but held stock in the company, per their lawsuit.\n\nIn December, Groq announced it had entered into a licensing agreement with Nvidia for the company's inference technology. Groq founder and CEO Jonathan Ross and its president, Sunny Madra, joined the $5 trillion chip giant as part of the deal, along with other senior leaders.\n\nGroq said it would continue as an \"independent company\" and has raised around $1 billion since June, from investors including Nvidia.\n\nRubin and Serebrin's case alleges that Groq's board of directors \"sold the company to Nvidia without the stockholder vote Delaware law requires and without any process designed to test or maximize the value of what Nvidia bought.\"\n\n\"Our licensing agreement with NVIDIA delivered exceptional value for Groq, our investors, and our employees,\" a Groq spokesperson told CNBC.\n\n\"This lawsuit is meritless and we will vigorously defend ourselves against it,\" they added. \"We remain focused on serving our customers and building the world's leading AI inference cloud.\"", "source": "CNBC World Economy", "pub_date_str": "05 Oct 2026, 09:16 PM IST", "pub_date_relative": "29m ago"}, {"title": "Broadening rally in stocks hits an economic roadblock", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Broadening rally in stocks hits an economic roadblock Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Broadening rally in stocks hits an economic roadblock SECTIONS Broadening rally in stocks hits an economic roadblock By Michael Msika and Jan-Patrick Barnert , Bloomberg Last Updated: Oct 05, 2026, 09:15:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Elevated oil prices and surging bond yields are narrowing Wall Street\u2019s rally, leaving investors concentrated in AI-related stocks while broader market participation weakens. Strong economic and earnings growth offers support, but a widening gap between bond and equity volatility signals that stocks could face sharper swings ahead.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "05 Oct 2026, 09:15 PM IST", "pub_date_relative": "30m ago"}, {"title": "These are the cheapest and most expensive U.S. flights this November", "full_content": "How much is domestic airfare this fall? It depends where you're flying and when.\n\nThanksgiving fares are up more than 30% this year over last as airlines pass more of this year's surge in jet fuel prices along to customers, according to a tally of \"good deal\" fares from flight-tracking site Hopper. But there are some bargains outside of that period for certain routes, while others are sky-high.\n\nThe cheapest flights in November include routes between Atlanta, the world's busiest airport, and various Midwest and Southeastern cities. Others are short trips, like intra-island Hawaii flying or within Florida.\n\nBut the length of the flight alone doesn't dictate the price . Routes from Nantucket and Martha's Vineyard off the coast of Cape Cod, Massachusetts to New York and Washington D.C. are among the priciest.\n\nTrips originating in remote Alaska bound for the East Coast take the cake for most expensive flights. While it's an oil producing state, it imports a significant amount of jet fuel and other refined products.", "source": "CNBC Top News", "pub_date_str": "05 Oct 2026, 09:15 PM IST", "pub_date_relative": "31m ago"}, {"title": "SpaceX\u2019s stock could actually be a bargain, according to this metric", "full_content": "The stock is expensive when valued solely by operating profit, but SpaceX is cheaper than Meta and Alphabet when you bring growth into the mix.", "source": "MarketWatch Top Stories", "pub_date_str": "05 Oct 2026, 09:15 PM IST", "pub_date_relative": "31m ago"}, {"title": "Euro slides to 17-month low against dollar", "full_content": "High energy prices and concerns over France\u2019s public finances add to pressure on the single currency", "source": "FT Markets", "pub_date_str": "05 Oct 2026, 09:14 PM IST", "pub_date_relative": "32m ago"}, {"title": "US stocks mixed, while euro slides on France worries and Brazil markets surge", "full_content": "", "source": "Investing.com News", "pub_date_str": "05 Oct 2026, 09:13 PM IST", "pub_date_relative": "33m ago"}, {"title": "Mutual fund SIP returns: India averaged 8.4% over rolling 5-year periods; how did it compare with global markets?", "full_content": "Systematic investment plans ( SIPs ) are often associated with disciplined investing and rupee-cost averaging. But does investing a fixed amount every month necessarily lead to good returns, regardless of the market?\n\nAn analysis shared by Niranjan Avasthi, President at Edelweiss Asset Management, on X provides a global comparison of SIP returns.\n\nA comparison of 120 rolling five-year monthly SIPs across 10 global markets over the past 10 years, from October 2016 to September 2026, shows that the same SIP discipline has produced very different outcomes depending on the market. All returns in the analysis are measured in US dollars.\n\nThe Nasdaq-100 delivered the highest average XIRR at 19.1%, followed by the S&P 500 at 13.7%. India delivered an average XIRR of 8.4%, with 98% of the rolling five-year SIP outcomes ending in positive returns.\n\nThe 10 years refer to the overall period from October 2016 to September 2026, during which the 120 rolling five-year SIP outcomes were calculated. In other words, 120 different five-year windows, moving month by month across a 10-year period, were analysed.\n\nFor example, one SIP could be evaluated over January 2016\u2013December 2020, the next over February 2016\u2013January 2021, and so on. In this analysis, 120 such five-year monthly SIP periods were examined for each market.\n\nThis is useful for investors because one five-year period can be unusually strong or weak. Rolling returns provide a broader picture of how consistently an SIP has performed.\n\nOf the 120 rolling five-year SIP outcomes, 87% generated annualised returns between 6% and 12%, while 7% were between 0% and 6%. Only 2% were negative, meaning 98% of the outcomes were positive.", "source": "LiveMint Money", "pub_date_str": "05 Oct 2026, 09:12 PM IST", "pub_date_relative": "33m ago"}, {"title": "Oil market turmoil could last for years, executives say", "full_content": "", "source": "Investing.com News", "pub_date_str": "05 Oct 2026, 09:12 PM IST", "pub_date_relative": "33m ago"}, {"title": "Chevron elevates CFO to lead oil and gas operations", "full_content": "", "source": "Investing.com News", "pub_date_str": "05 Oct 2026, 09:12 PM IST", "pub_date_relative": "34m ago"}, {"title": "Johnson Controls stock hits all-time high at 157.06 USD", "full_content": "", "source": "Investing.com News", "pub_date_str": "05 Oct 2026, 09:11 PM IST", "pub_date_relative": "34m ago"}, {"title": "Charles River Laboratories stock hits 52-week high at 303.33 USD", "full_content": "", "source": "Investing.com News", "pub_date_str": "05 Oct 2026, 09:09 PM IST", "pub_date_relative": "36m ago"}, {"title": "Satya Nadella reinvented Microsoft once. Can he do it again in the AI era?", "full_content": "On a sunny day in Seattle in late September, about 50 executives representing large Microsoft customers had a rare opportunity. They could ask anything of CEO Satya Nadella .\n\nOne attendee wanted to know what Microsoft could do to help companies adapt to the artificial intelligence age. Nadella responded by emphasizing the importance of \"diffusion inside the enterprise,\" meaning AI tools need to be widely deployed.\n\n\"Like all things, change is always bottom up, top down, and middle up,\" said Nadella, sporting a tight black crewneck and dark gray slacks, as he strode across the stage at the downtown Paccar Pavilion.\n\nFor the 59-year-old Nadella, who's spent over half his life at Microsoft, the gathering landed at a pivotal moment, as the software giant tries to magnify its role in the AI boom. Of late, Nadella has been inserting himself more into the AI discourse, posting on X last month about the need for \"deliberate pacing\" in model development, and days later addressing safety fears at the All-In Summit in Los Angeles.\n\nDespite its almost $4 trillion market cap, Microsoft has yet to break out as an AI leader. Nvidia dominates in AI chips, Anthropic and OpenAI boast the foremost models, Meta just released the first mass-market personal agent, and Google's Gemini-powered services are popular with businesses and consumers.\n\nMicrosoft was aggressively early to AI through an investment in OpenAI, but that alliance has frayed. While the software giant has a big business in renting out chips for AI developers through its Azure cloud, its Copilot technology isn't pervasive in the workplace, and its proprietary AI models remain niche.\n\nThe company is hosting a Windows and Surface event in San Francisco on Wednesday, describing it in an invitation as \"a conversation on how local AI will shape the next chapter of the PC.\"\n\nWall Street is lukewarm on the story.", "source": "CNBC World Economy", "pub_date_str": "05 Oct 2026, 09:06 PM IST", "pub_date_relative": "39m ago"}, {"title": "Big Oil climate case likened to tobacco and opioid action in US Supreme Court", "full_content": "ExxonMobil and Suncor Energy look to the high court to block state action", "source": "FT Markets", "pub_date_str": "05 Oct 2026, 09:05 PM IST", "pub_date_relative": "41m ago"}, {"title": "Josh Brown takes a look at winners and losers on his Best Stocks list as Q4 begins", "full_content": "Josh Brown and Sean Russo take a look at four names that have made their Best Stocks in the Market list \u2014 two winners and two losers.", "source": "CNBC Top News", "pub_date_str": "05 Oct 2026, 09:00 PM IST", "pub_date_relative": "46m ago"}, {"title": "David Ellison just brought in a co-CEO to run his new empire: Meet Ynon Kreiz", "full_content": "David Ellison has spent two years fighting to build his media empire. Now, he's bringing in a heavyweight to help him run it.\n\nYnon Kreiz, outgoing CEO of Mattel , will serve as co-CEO of the combined Paramount Skydance and Warner Bros. Discovery , to be named simply Skydance , when the merger closes on Tuesday.\n\nThe new entity will unite the storied film studios of Paramount and Warner Bros.; the CBS broadcast network; a sprawling portfolio of pay-TV networks that include CNN, TNT, MTV and BET; and streaming services Paramount+ and HBO Max, all under one roof.\n\nThe appointment of Kreiz to a top executive position alongside Ellison speaks to a governance question that has surrounded Ellison's aggressive pursuit of the legacy media assets: The tech executive and son of billionaire Larry Ellison can buy it, but can he lead it?\n\nNot even 18 months ago, Ellison was the CEO of film production company Skydance with a limited portfolio of hits , namely the Tom Cruise-led Mission: Impossible franchise and \"Top Gun: Maverick.\"\n\nBy August 2025, he was successfully closing an acquisition of Paramount, a deal worth around $8 billion . Roughly a month later, he started his campaign for WBD, spurring a back-and-forth bidding war that would ultimately result in a deal worth roughly $110 billion on an enterprise basis to merge two of Hollywood's biggest media companies.\n\nKreiz is a 30-year veteran of the media space, arguably best known for ushering \"Barbie\" to the big screen in 2023. He's earned a reputation as a turnaround man, with roots in entertainment despite his more recent stint in consumer goods.\n\nHe joins Paramount Skydance on Monday , and becomes co-CEO on Tuesday upon closing. The pair of co-CEOs announced their full leadership team on Monday.", "source": "CNBC Top News", "pub_date_str": "05 Oct 2026, 08:59 PM IST", "pub_date_relative": "47m ago"}, {"title": "Europe\u2019s new robotics unicorn: Germany\u2019s RobCo hits $1B valuation - Tech Funding News", "full_content": "Europe\u2019s new robotics unicorn: Germany\u2019s RobCo hits $1B valuation Tech Funding News Exclusive | Robotics Startup RobCo Hits $1 Billion Valuation WSJ German robot startup RobCo hits $1 billion valuation, CEO moves to US Reuters Physical AI Builder RobCo Doubles Valuation to $1 Billion PYMNTS.com German robotics startup RobCo hits $1 billion valuation qz.com", "source": "Google News Business", "pub_date_str": "05 Oct 2026, 08:59 PM IST", "pub_date_relative": "47m ago"}, {"title": "Vedanta dividend countdown: Anil Agarwal-led company to consider first FY27 payout on October 8", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a Earnings \u203a Vedanta dividend countdown: Anil Agarwal-led company to consider first FY27 payout on October 8 BSE Share Price Multi Commodity Exchange of India Share Price Indian Energy Exchange Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Vedanta dividend countdown: Anil Agarwal-led company to consider first FY27 payout on October 8 SECTIONS Vedanta dividend countdown: Anil Agarwal-led company to consider first FY27 payout on October 8 By Kumar Gaurav , ETMarkets.com Last Updated: Oct 05, 2026, 08:49:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Vedanta will consider its first interim dividend for FY27 at a board meeting on October 8, 2026. The company has set October 14 as the record date. The dividend proposal follows strong Q2 production, including record Zinc India refined metal output.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "05 Oct 2026, 08:49 PM IST", "pub_date_relative": "57m ago"}, {"title": "Stock Market Today: Dow Dips As Services Data Shows This; Microsoft, SpaceX Pop (Live Coverage) - Investor's Business Daily", "full_content": "Stock Market Today: Dow Dips As Services Data Shows This; Microsoft, SpaceX Pop (Live Coverage) Investor's Business Daily S&P 500 up, Nasdaq at record high as megacap tech stocks rise Reuters Wall St futures dip as tech stocks take a breather TradingView Stock market today: S&P 500 and Nasdaq rise, Dow slips amid bond market caution Yahoo Finance Stocks Look for Direction as Bonds and Equities Trade in 'Different Worlds' Barron's", "source": "Google News Business", "pub_date_str": "05 Oct 2026, 08:48 PM IST", "pub_date_relative": "58m ago"}, {"title": "Top 5 stocks to buy: AU Bank, Poonawalla Fincorp, Groww, Graphite India, Usha Martin by Sumeet Bagadia | Target price", "full_content": "Stocks to buy: The key benchmark indices of the Indian stock market ended higher on Monday, extending the recovery after a strong gap-up opening as easing expectations of an immediate Federal Reserve rate hike and a pullback in crude oil prices improved risk appetite. The advance was notable for its breadth, with mid- and small-cap stocks participating alongside the benchmark indices, suggesting that the session was driven by broader buying rather than a narrow rebound in heavyweight stocks. Healthcare was the notable laggard, underperforming an otherwise constructive market.\n\nThe global backdrop also turned more supportive. Expectations of an October Federal Reserve rate hike eased sharply, reducing some of the pressure that higher US rates have placed on emerging-market assets. Crude oil prices also moderated as rising exports from West Asia and the prospect of a G7 release of strategic reserves eased concerns over supply disruptions, providing additional relief to oil-importing economies such as India.\n\nSumeet Bagadia, Executive Director at Choice Broking, believes the Indian stock market bias is weak, although the stabilisation from lower levels is encouraging. He said that a doji-like candle reflects indecision, with buyers defending lower levels but supply still evident near the highs.\n\nSpeaking on the outlook for the Nifty 50 index, Sumeet Bagadia said, \u201cImmediate support is placed at 22,350\u201322,400, while 22,600\u201322,650 remains the key hurdle. RSI at 28.15 continues to indicate weak momentum, although the stabilisation from lower levels is encouraging. PCR at 0.99 suggests a balanced derivatives setup, while a higher VIX at 14.775 points to increased volatility. A sustained move above 22,650 could strengthen the recovery attempt.\u201d\n\nOn the outlook for the Bank Nifty index, Bagadia said, \u201cThe setup remains cautious as the index is yet to overcome the overhead supply zone, while RSI at 36.31 remains below its average of 37.38 and signals subdued momentum.", "source": "LiveMint Markets", "pub_date_str": "05 Oct 2026, 08:42 PM IST", "pub_date_relative": "1h ago"}, {"title": "AirPods Pro 3 Drop To $179 At Amazon Ahead Of October Prime Day", "full_content": "Amazon is selling Apple's AirPods Pro 3 for $179, $70 below the $249 list price and close to their lowest-ever price of $169, with the deal arriving ahead of the Prime Big Deal Days event.", "source": "NDTV Profit", "pub_date_str": "05 Oct 2026, 08:42 PM IST", "pub_date_relative": "1h ago"}, {"title": "CNBC Points Pro: Is it better to book travel directly or through a credit card issuer's portal?", "full_content": "Welcome to the Points Pro, where I answer your credit cards and travel rewards questions each week. If you have a question you'd like answered, you can submit it here .\n\nIs it better to book hotels and airfare through card issuer travel sites or directly with the hotel or airline?\n\nMichael has these travel credit cards , all of which offer a travel booking site for cardholders:\n\nThe hotels and airlines that Michael uses include Southwest Airlines, United Airlines, Delta Air Lines, American Airlines, Marriott, IHG and Hilton.\n\nWith Points Boost, your rewards will be worth up to 1.5X on thousands of top-booked hotels and flights from select airlines through Chase Travel SM .\n\nThe Chase Sapphire Preferred\u00ae Card packs a punch for a $95 annual fee card, offering annual travel credits, comprehensive travel protections, flexible rewards and more.\n\nHighlights shown here are provided by the issuer and have not been reviewed by CNBC Select's editorial staff.\n\nEither $5 or 5% of the amount of each transfer, whichever is greater", "source": "CNBC Top News", "pub_date_str": "05 Oct 2026, 08:42 PM IST", "pub_date_relative": "1h ago"}, {"title": "UPI MDR charges: How does it compare to traditional Debit, Credit Card per transaction? Cost difference explained", "full_content": "With the UPI merchant discount rate (MDR) set to apply from 15 October 2026, merchants will pay a 0.4% charge on eligible person-to-merchant (P2M) UPI transactions above \u20b9 2,000. The charge will apply to the merchant and not to the customer making the payment.\n\nBut how does this UPI MDR compare with the charges merchants typically pay when customers use debit or credit cards? Here is what you need to know.\n\nAccording to NPCI FAQs released on 15 September, \u201cUPI MDR is structured to be much lower than all traditional card-based transaction fees. Standard credit card MDRs typically range from 1.5% to 2.5% per transaction, while debit card MDRs are capped up to 0.90%.\u201d\n\nCredit card MDRs can vary depending on factors such as the card network, merchant category, and agreements between banks and merchants. The actual rate charged to a merchant may therefore differ across transactions.\n\nBy setting the baseline UPI MDR at 0.4% on transactions above \u20b9 2,000 and capping it at \u20b9 300 for high-value purchases, UPI remains the most affordable digital payment acceptance tool for commercial enterprises, NPCI noted.\n\nConsider a customer making a \u20b9 10,000 payment to a merchant. At a 0.4% UPI MDR, the merchant would pay \u20b9 40 as the transaction charge.\n\nIf the same \u20b9 10,000 payment is made through a debit card at an MDR of 0.90%, the merchant charge would be \u20b9 90.\n\nAt a credit card MDR of 1.5%, the charge would be \u20b9 150. If the credit card MDR is 2.5%, the charge would rise to \u20b9 250.", "source": "LiveMint Money", "pub_date_str": "05 Oct 2026, 08:40 PM IST", "pub_date_relative": "1h ago"}, {"title": "Drishyam: The Conclusion Box Office Collection Day 4: Ajay Devgn Starrer Holds Strong", "full_content": "Drishyam: The Conclusion, directed by Abhishek Pathak, is the third and final instalment of the Hindi crime thriller franchise starring Ajay Devgn. The film brings back Vijay Salgaonkar as he faces another challenging situation involving his family.", "source": "NDTV Profit", "pub_date_str": "05 Oct 2026, 08:38 PM IST", "pub_date_relative": "1h ago"}, {"title": "Navi Mumbai International Airport Expands Multimodal Transport Network Ahead Of Winter Schedule", "full_content": "The airport is also expanding its taxi and autorickshaw options to provide passengers with more flexibility for short- and medium-distance journeys.", "source": "NDTV Profit", "pub_date_str": "05 Oct 2026, 08:35 PM IST", "pub_date_relative": "1h ago"}, {"title": "I\u2019m in my 20s and keep getting laid off. Should I invest in my employer\u2019s 401(k) or look into other options?", "full_content": "\u201cI have lost faith that the traditional career spanning decades at one company even exists anymore.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "05 Oct 2026, 08:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "\u2018People in the U.S. need to wake up\u2019: As a mortgage loan officer, I rejected wealthy couples due to overspending. We\u2019re all heading for trouble.", "full_content": "A reader writes: \u201cWe\u2019d better get real quick or we\u2019re going to have a financial crisis that makes the Great Recession of 2008 look like a picnic.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "05 Oct 2026, 08:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "East Bengal Run Riot With 7-2 Win, Kolkata Derby Awaits In IFA Shield Final", "full_content": "A seven-goal performance sent East Bengal into the final and set up another meeting with their biggest rivals.", "source": "NDTV Profit", "pub_date_str": "05 Oct 2026, 08:29 PM IST", "pub_date_relative": "1h ago"}, {"title": "Treasury yields rise to start the week; traders look ahead to Fed minutes", "full_content": "U.S. Treasury yields rebounded on Monday following their sharp decline last week as investors absorbed new economic data and looked ahead to the release of the Federal Reserve's September meeting notes.\n\nThe benchmark 10-year Treasury yield was last up about 2 basis points to 5.298%. The yield on the 30-year Treasury bond was 3 basis points higher at 5.659%. The yield on the 2-year Treasury fell nearly 1 basis point, to 4.818%.\n\nOne basis point equals 0.01%, and yields and prices move in opposite directions.\n\nThose moves came as traders took note of new data on service sector growth released Monday by the Institute for Supply Management. The ISM report showed that the Purchasing Manager's Index \u2014 a measure of economic activity in the service sector \u2014 grew to 54.9 in September, roughly in line with expectations and slightly below the August rate of growth.\n\nThe price index within the service ISM rose 1.4 points to 74, putting the 12-month average at its highest since March 2023.\n\nNow, investors are looking ahead to the release of minutes from the central bank's September policy meeting, due out on Wednesday.\n\nWhile investors have grappled with a bond market selloff over the past six weeks, a lackluster September jobs report on Friday helped to bring yields down, easing concern about another Federal Reserve rate hike at the bank's October meeting.\n\nTraders are now pricing in a nearly 82% likelihood that the Fed will keep rates unchanged at its next meeting, according to the CME Group's FedWatch tool .", "source": "CNBC Top News", "pub_date_str": "05 Oct 2026, 08:23 PM IST", "pub_date_relative": "1h ago"}, {"title": "Wipro to declare Q2 results on October 15; here\u2019s what investors should watch", "full_content": "Wipro , the country's fourth-largest IT services firm, on Monday, October 5, said its board of directors will meet on October 15 to consider and approve the audited standalone and consolidated financial results for the quarter, and half year ended September 30, 2026.\n\nThe company will announce its earnings after market hours, following which the senior management will discuss the company's performance for Q2 and H1 FY27.\n\nThe company has further informed the exchanges that the trading window for dealing in the company's securities by designated persons is closed from September 16, 2026, until the close of business on October 17, 2026.\n\nFor the second quarter ending September 2026, Wipro expects IT services revenue in the range of $2.574 billion to $2.627 billion, implying constant currency growth of -1.5% to +0.5% sequentially.\n\nSystematix Institutional Equities expects Wipro\u2019s CC revenue to decline 0.6% QoQ, amid weak demand, pricing pressure and wallet-share losses in large accounts. However, inorganic contribution from Alpha Net and a full quarter of Olam revenues should provide some support.\n\nThe brokerage expects EBIT margin to expand by 20 basis points QoQ, supported by lower integration costs and the absence of the wage-revision impact. It expects Wipro to guide for -2% to 0% QoQ CC growth in 3Q FY27E. Large-deal TCV is expected at ~$0.8 billion.\n\nJM Financial expects Wipro to report -0.5% CC QoQ growth, with a 10-basis-point cross-currency impact translating into -0.6% USD growth. The brokerage expects an inorganic contribution of around 80 bps during the quarter from Mindsprint (40 basis points) and Alphanet (40 basis points).\n\nIt expects a gradual improvement in margins as wage hikes are behind, with operational efficiencies providing a tailwind. Investments in the business and acquisitions are expected to remain headwinds.", "source": "LiveMint Markets", "pub_date_str": "05 Oct 2026, 08:23 PM IST", "pub_date_relative": "1h ago"}, {"title": "WWE Star Stephanie Vaquer, Myles Borne Together Again: What We Know About Split Rumours", "full_content": "The WWE stars were seen training together at the dojo as speculation about their relationship continues online.", "source": "NDTV Profit", "pub_date_str": "05 Oct 2026, 08:21 PM IST", "pub_date_relative": "1h ago"}, {"title": "NRI tax rules: What happens to losses on foreign shares?", "full_content": "I am an NRI living in the UK and left India in 2017 for employment. I regularly invest in the UK and India. Recently, I sold some UK and Indian stocks. I incurred a loss on the sale of UK stocks, whereas I earned gains on thesale of Indian stocks. Can I set off the UK capital loss against gains from Indian shares in my India tax return?\n\nAssuming you are a Non-Resident (NR) of India for FY 2026-27 under the Income-tax Act, 2025, only income which is received or deemed to be received in India, or accrues or arises or is deemed to accrue or arise in India, would generally form part of your total income in India.\n\nAccordingly, a capital gain or capital loss arising from the sale of UK shares by an NR would not be taxable in India. Since such capital loss does not form part of your total income in India, the question of adjusting such loss against capital gains arising in India would not arise.\n\nTherefore, such UK capital loss cannot be set off against capital gains arising from the sale of Indian shares while filing your Indian income-tax return.\n\nI moved to Singapore in 2024 and became an NRI. Before moving there in 2024, I invested in US stocks under LRS, but did not report them in Schedule FA. I recently received an Income-tax Department email regarding the Foreign Assets of Small Taxpayer Disclosure Scheme 2026 (FAST-DS).", "source": "LiveMint Money", "pub_date_str": "05 Oct 2026, 08:20 PM IST", "pub_date_relative": "1h ago"}, {"title": "Mandaadi Box Office Collection Day 25: Soori Starrer Inches Closer To Rs 100 Crore After Sunday Growth", "full_content": "Mandaadi is a Tamil sports action drama written and directed by Mathimaran Pugazhendhi.", "source": "NDTV Profit", "pub_date_str": "05 Oct 2026, 08:15 PM IST", "pub_date_relative": "1h ago"}, {"title": "WCL Season 3: Pakistan Champions Pull Out After NOC Dispute With PCB", "full_content": "Pakistan Champions have now ended their WCL Season 3 campaign without playing their scheduled opening match.", "source": "NDTV Profit", "pub_date_str": "05 Oct 2026, 08:10 PM IST", "pub_date_relative": "1h ago"}, {"title": "I bought a $126 concert ticket for my sister and now she can\u2019t go. What\u2019s the latest I can resell my ticket to break even?", "full_content": "\u201cI\u2019m having trouble accepting that I\u2019ll probably lose some money.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "05 Oct 2026, 08:08 PM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "Trump tells South Korea to sign on to Alaska LNG deal or 'I'll just charge them more'", "full_content": "U.S. President Donald Trump said he \"didn't jump the gun\" in announcing South Korea's participation in a $50 billion Alaska liquefied natural gas project, warning Seoul could pay \"double\" if it does not sign on soon.\n\nHis remarks come amid a discrepancy between Washington and Seoul over South Korea's planned energy and infrastructure investments in the U.S., with Trump announcing projects that Seoul has said are not yet finalized.\n\n\"If they don't want to do it, that's OK with me. I'll just charge them more,\" Trump told reporters Friday, according to the White House. \"Tell them if they don't sign shortly, I'm going to double it up.\"\n\nTrump did not specify what would be doubled. South Korean local media, though, raised the possibility that he was referring to higher tariffs on the country.\n\nWhen asked whether he had prematurely announced South Korea's involvement in the Alaska LNG project, Trump said he \"didn't jump the gun.\"\n\nTrump's remarks come after South Korea said it was still assessing the Alaska LNG project, with any participation dependent on its commercial viability and compliance with domestic legal procedures.\n\nSeparately, Trump said Friday on Truth Social that South Korea's investment deal \"keeps getting BETTER,\" announcing an additional $8.4 billion enhanced oil recovery project.\n\nEnhanced oil recovery uses techniques such as carbon dioxide injection to increase the amount of crude produced from an oil field.", "source": "CNBC Top News", "pub_date_str": "05 Oct 2026, 09:44 PM IST", "pub_date_relative": "2m ago", "cfa_topics": ["Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "AI researchers detail safety risks at NYC Council with Anthropic, OpenAI, Google and Meta execs set to testify", "full_content": "Anthropic whistleblower Jacob Coxon, who raised early concerns about the dire risks of artificial intelligence , called out the industry's \"extremely reckless\" approach to development during a New York City Council hearing on Monday.\n\n\"On the current path, I think it is more likely than not that humanity loses control to these AIs, and it could end in human extinction,\" he told a packed room. \"From my experience, the companies are being extremely reckless given the stakes.\"\n\nBoth Coxon and former OpenAI researcher Daniel Kokotajlo warned of the dangers that the \"move fast and break things\" culture at the companies poses with such a transformative technology.\n\nCoxon said that method works for a \"photo-sharing app\" but not \"for building the most powerful technology ever built.\"\n\nKokotajlo suggested two policy recommendations during his testimony, calling on the AI industry to increase transparency and slow the leading model development.\n\nNew York City Council Speaker Julie Menin asked Coxon, Kokotajlo and former Google DeepMind research scientist Alex Turner how to balance frontier model development in the context of the technology race with China.\n\n\"China is not our only potential adversary,\" Turner said. \"With reasonably high chance, we are racing to build and grow our own adversary here at home, which is misaligned AI. Misaligned AI is everyone's adversary, including our own, and one day may be more powerful than China.\"\n\nSenior leaders from Anthropic , OpenAI, Google and Meta are also slated to testify under oath about the potential dangers of artificial intelligence on Monday, following a month of intense debate surrounding the risks posed by advanced AI models.", "source": "CNBC World Economy", "pub_date_str": "05 Oct 2026, 09:42 PM IST", "pub_date_relative": "4m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Ahead of Market: 10 things that will decide stock market action on Tuesday", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a A
