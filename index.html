<script>

    const allData = {"general": [{"title": "How suspected North Korean hackers swiped billions in crypto in only minutes - The Washington Post", "full_content": "How suspected North Korean hackers swiped billions in crypto in only minutes The Washington Post Binance\u2019s $6.3 billion hack raises questions about crypto wallet safety CNBC A Very Bad 24 Hours for Crypto The Atlantic Expert warns of 'AI hacking bloodbath' following massive Binance cryptocurrency theft Fox Business How North Korea perfected the crypto heist Axios", "source": "Google News Business", "pub_date_str": "31 Oct 2026, 07:03 PM IST", "pub_date_relative": "12m ago"}, {"title": "Automatic 401(k) rollovers reduce cash-outs, research finds \u2014 but few accounts reach new employer plans", "full_content": "Leaving a job can make a small 401(k) hard to hold on to: Some employers ' plans cash out accounts under $1,000 or move slightly larger balances into an IRA. Taking the money in cash and moving on can feel like the simplest option, but it can have short- and long-term financial consequences.\n\nA system backed by major 401(k) administrators aims to make it easier for those savings to follow workers to their next job. New research from one of those companies, Vanguard, shows it's helping fewer people cash out \u2014 although most of the money has yet to reach workers' new retirement plans.\n\nAmong workers with less than $1,000 in their 401(k), the share who cashed out within 10 months of leaving their job fell to about 9% from roughly 50% after their employers began participating in a new system called the Portability Services Network, according to the Vanguard research . Among those with balances of between $1,000 and $7,000, the share cashing out fell to 31% from 39%.\n\nPortability Services Network is a coalition of large 401(k) administrators \u2014 including Vanguard, Fidelity Investments and Alight Solutions, among others \u2014 in conjunction with Retirement Clearinghouse and has been in operation since late 2023.\n\nHow it works: When a worker with a small 401(k) balance leaves an employer that participates in the network, the money is generally automatically rolled into a safe harbor IRA, where it remains until the network matches it with the worker's new employer plan. The balance then gets rolled into the new 401(k) from that interim IRA. The catch, however, is that the receiving employer must also participate in the network for the money to move to the next employer's plan.\n\nIn Vanguard's research, just 6% of accounts that have been transferred into IRAs as part of this automatic portability network successfully made it to a new employer's plan as of early 2026, largely because few employers have opted in.", "source": "CNBC Top News", "pub_date_str": "31 Oct 2026, 07:00 PM IST", "pub_date_relative": "16m ago"}, {"title": "Yuvraj Singh Shares Major Update On His Upcoming Biopic, Filming Could Begin Next Year", "full_content": "The biopic is being produced by T Series boss Bhushan Kumar in association with Ravi Bhagchandka.", "source": "NDTV Profit", "pub_date_str": "31 Oct 2026, 06:50 PM IST", "pub_date_relative": "26m ago"}, {"title": "Ram Gopal Varma Gets Rs 29.67 Crore Recovery Notice Over Pending Dues", "full_content": "Eclatant Films has warned the film industry against entering into transactions involving Ram Gopal Varma or his projects without first obtaining a written No-Objection Certificate (NOC) from them.", "source": "NDTV Profit", "pub_date_str": "31 Oct 2026, 06:48 PM IST", "pub_date_relative": "28m ago"}, {"title": "Jio Platforms up 27.8% since IPO listing but how RIL, Jio Fin, Alok Ind, Network 18, Lotus shares fared in 3 years?", "full_content": "RELIANCE JIOFIN ALOKINDS LOTUSCHO Sharmila Bhadoria Published 31 Oct 2026, 06:46 PM IST Prefer Livemint on Google The much awaited initial public offering (IPO), Jio Platforms , made a spectacular stock market debut this week, with shares listing at a nearly 21.36% premium over the issue price. Backed by Reliance Industries Limited, Jio shares have surged 27.8% over the IPO price.\n\nWhile Jio Platforms shares are stealing the spotlight, here's a look at how other stocks from Mukesh Ambani's Reliance group have performed over the past three years.\n\nThe Reliance Group\u2019s listed companies include Reliance Industries Limited, Jio Financial Services , Alok Industries , Network18 Media and Lotus Chocolate Company .\n\nRIL share price closed 0.44% lower at \u20b9 1163.55 per share on BSE with a market capitalisation of \u20b9 15,74,578.54 crore on Friday, October 30. The stock has declined 21.83% in one year, 13.42% in two years. Its share price value has surged merely 0.68% in three years.\n\nShares of Jio Financial Services closed 1.21% lower at \u20b9 204.50 per share on BSE with an MCap of \u20b9 1,35,034.25 crore on Friday. The stock has declined 5.59% in one month, 17.17% in three months and around 30.82% in 2026 so far (YTD).\n\nAlok Industries stock closed 5.49% lower at \u20b9 8.09 per share on BSE with an MCap of \u20b9 4,016.88 crore. The textile stock has declined 53.85% in one year. RIL holds 40.01% stake in the textile stock.\n\nShares of Network 18 Media & Investments Limited closed 1.86% lower at \u20b9 23.68 per share on BSE with an MCap of \u20b9 3,651.46 crore on BSE on Friday. Its share price value has declined 51.08% in one year, 70.84% in two years, and 65.78% in three years.\n\nLotus Chocolate Company\u2019s share price closed 508.40 per share on BSE with a market capitalisation of \u20b9 652.84 crore on Friday. Its share price value has declined 64.41% in two years, but has surged 88% in three years.", "source": "LiveMint Markets", "pub_date_str": "31 Oct 2026, 06:46 PM IST", "pub_date_relative": "30m ago"}, {"title": "'Paid For Luxury, Got A Lemon': Gautam Singhania Advises Buyers Against This Carmaker's 'Hype'", "full_content": "Raymond Group Chairman Gautam Singhania has warned prospective buyers against Maserati, alleging poor after-sales support and unresolved customer complaints as the Italian luxury carmaker renews its India expansion.", "source": "NDTV Profit", "pub_date_str": "31 Oct 2026, 06:46 PM IST", "pub_date_relative": "30m ago"}, {"title": "Medifast director Kiai Parsa buys $68,027 in company stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "31 Oct 2026, 06:46 PM IST", "pub_date_relative": "30m ago"}, {"title": "Google taught the world how to search. Now it faces a revolution it can\u2019t afford to lose.", "full_content": "Wall Street is grappling with a fundamental question: Are Google\u2019s AI Overviews bound to save search \u2014 or ruin the whole business?", "source": "MarketWatch Top Stories", "pub_date_str": "31 Oct 2026, 06:45 PM IST", "pub_date_relative": "31m ago"}, {"title": "Chinese Executive Close to Nvidia CEO Suspected of Giving China Information - WSJ", "full_content": "Chinese Executive Close to Nvidia CEO Suspected of Giving China Information WSJ Nvidia Chief, Jensen Huang, Is Seen as Target of Chinese Spy Plot The New York Times Nvidia CEO Says Ties to Company Under Spying Probe Were \u2018Normal\u2019 Bloomberg Chip hawks seize on report Chinese asset cozied up to Nvidia Politico Nvidia responds to report Jensen Huang was target of Chinese asset, says diversion allegations were 'investigated and debunked' CNBC", "source": "Google News Business", "pub_date_str": "31 Oct 2026, 06:42 PM IST", "pub_date_relative": "33m ago"}, {"title": "Inflation, Inequality and Debt: The Charts Scaring Wall Street", "full_content": "(Bloomberg) -- US stocks are hovering near record highs, unfazed by the war with Iran, stubborn inflation and mounting questions over how Wall Street will finance the expanding AI buildout. But for investors looking for a scare this Halloween, some of the market\u2019s most unsettling signals are hiding just beneath the surface.\n\nFrom violent swings in semiconductor shares and ballooning AI-related debt, to a stock-bond hedge that\u2019s lost some of its reliability, as well as a widening wealth divide, the charts occupying Wall Street\u2019s attention paint a less comforting picture than the major indexes might suggest.\n\nBloomberg News asked nine financial professionals what charts spook them. Here\u2019s what they shared:\n\nWe find concerning the consensus forecasts for slower inflation in 2027 given recent data on prices. The consensus forecast for PCE inflation in 2027 is 2.5% and the average of the top 10 forecasts is 3.1%. Similarly, the Fed\u2019s September Summary of Economic Projections show a median forecast of 2.3% PCE inflation next year and no FOMC participant sees inflation above 2.6% in 2027.\n\nThus, even the most pessimistic forecasts don\u2019t envisage inflation running higher than current rates next year. These projections, which for private economists are based on the hope that the impulse from tariffs will fade, and oil prices will decline on the cessation of hostilities, have little support in the data. The PPI report shows scary trends in pipeline manufacturing goods prices with, for example, core processed goods PPI prices surging 24.3% over the last year. This is beginning to look like 2021/22, and if these soaring pipeline prices feed into finished goods prices, this may give Fed policymakers nightmares.\n\nTiffany Wilding, economist at Pacific Investment Management Co.:\n\nThe AI boom has raised concerns about a potential \u201ccrowding out\u201d of other companies that want to borrow in the capital markets, potentially increasing the concentration of AI in a U.S.", "source": "LiveMint Markets", "pub_date_str": "31 Oct 2026, 06:42 PM IST", "pub_date_relative": "34m ago"}, {"title": "This Faridabad Man Invested Rs 3 Crore To Start A Gym; Here's How Much He Makes Every Month", "full_content": "Faridabad gym owner Nitesh Yadav revealed that his fitness centre generates monthly sales of around Rs 20 lakh, but after expenses and loan repayments, his savings are considerably lower.", "source": "NDTV Profit", "pub_date_str": "31 Oct 2026, 06:39 PM IST", "pub_date_relative": "37m ago"}, {"title": "In the wake of Weil, a legal recruiter's advice for surviving a company wind-down", "full_content": "It's hard to believe a corporate giant like Weil, Gotshal & Manges \u2014 a top 20 U.S. law firm that reportedly had over $2 billion in revenue in 2025 \u2014 could move toward ceasing operations just like that. But occasionally a Weil-like wind-down \u2014 or even a collapse like Lehman Brothers , Silicon Valley Bank or FTX \u2014 is bound to occur.\n\nAnd here we are, seeing a major law firm move toward shutting down in real time.\n\nThe firm's management committee recommended that its partners prepare to close its doors after more than 90 years in business, Weil, Gotshal & Manges said on Wednesday. \"Following a careful review of strategic alternatives, the Firm's Management Committee has recommended to the partnership that the Firm pursue an orderly wind-down,\" the firm said in a statement to CNBC on Wednesday. \"The partners are expected to vote in the coming days.\"\n\nAs a legal recruiter and former big law associate, I'm here to provide practical insights to the employees, lawyers and non-lawyers alike, who've just learned they're about to be out of a job \u2014 and those who are scared their company might be next.\n\nFirst, let's be clear: From where I stand, Weil is an anomaly. But when a company does make headlines for winding down, or failing and shutting down, it's rarely the employees whose plight is highlighted: the people whose careers have been destabilized, whose anxiety shoots through the roof and who become the collateral damage of business decisions they had no idea were being made until far too late.\n\nHere are my top tips, for both lawyers and non-lawyers, for when your company announces or is headed toward dissolution. In the case of Weil, it's advice I hope the firm's roughly 1,200 lawyers plus staff take to heart in the next 90 days .\n\nYes, you can worry. Yes, you can grieve.", "source": "CNBC Top News", "pub_date_str": "31 Oct 2026, 06:37 PM IST", "pub_date_relative": "39m ago"}, {"title": "Explained: Binance Hack And How To Protect Your Money", "full_content": "Safety measures such as two-factor authentication and using cold wallets can minimise the risk of losses in case of a crypto hack.", "source": "NDTV Profit", "pub_date_str": "31 Oct 2026, 06:36 PM IST", "pub_date_relative": "39m ago"}, {"title": "Bank of America says buy these stocks ahead of earnings before it's too late", "full_content": "The firm named a slew of undervalued stocks to buy ahead of quarterly reports.", "source": "CNBC Top News", "pub_date_str": "31 Oct 2026, 06:35 PM IST", "pub_date_relative": "41m ago"}, {"title": "35-year-old took on $20K in debt to launch a business from her dining room\u2014now it brings in 8 figures a year", "full_content": "Set Active CEO Lindsey Carter used to lose sleep, cry to her friends and struggle to be present in her personal life after a rough day at work.\n\nIt's not that she expected entrepreneurship to be easy. Carter took on $20,000 in personal credit card debt and filled her Los Angeles home with inventory when she started the athleisure company in May 2018, she says. Yet years of obstacles \u2014 familiar to many an entrepreneur \u2014 followed as she tried to break Set Active into a crowded activewear industry. It took her time to figure out how to separate her professional stress from her personal life.\n\n\"I started understanding that struggle wasn't necessarily a sign that something was going wrong. Sometimes it's just the reality of building something ambitious,\" says Carter, 35. \"And if I was going to let every setback rob me of my happiness, I'm going to be spending a very long time being unhappy.\"\n\nSet Active is no industry giant, but it brought in eight figures in 2025 net sales and is profitable, according to documents reviewed by CNBC Make It. That comes as growth in the broader activewear market has slowed: Women's activewear spending in the U.S. increased 2% between October 2025 and September 2026, down from 7% over the preceding 12 months, according to data from market research firm Circana.\n\nActivewear still makes up 30% of U.S. apparel spending, says Circana apparel industry analyst Kristen Classi-Zummo. Shoppers these days particularly gravitate toward casual outfits and loungewear, like sweatpants and sweatshirts, over more active items like leggings and sports bras, Classi-Zummo says. That's good news for Carter, who sells color- and pattern-filled clothing sets that aren't solely intended for workouts. Set Active's Instagram posts feature women sitting on pickleball courts or the banks of the Seine in Paris.\n\nBefore launching Set Active, Carter ran her own social media company.", "source": "CNBC Top News", "pub_date_str": "31 Oct 2026, 06:35 PM IST", "pub_date_relative": "41m ago"}, {"title": "Crypto industry pours more than $200 million into 2026 midterms to pressure Congress on favorable rules", "full_content": "The largest group of single-issue super PACs in United States history is pouring millions of dollars into congressional races across the country.\n\nCryptocurrency groups outpaced online betting and data center development groups in federal corporate political spending this election cycle, according to Public Citizen . Crypto-tied organizations have contributed more than $200 million in this election cycle.\n\nThe industry is hoping to repeat the success of 2024, when super PACs spent $250 million to elect pro-crypto lawmakers and reshape Congress.\n\nCrypto juggernaut Fairshake and its affiliated super PACs are throwing their support behind 33 House candidates \u2014 19 Republicans and 14 Democrats \u2014 seen as key supporters of the industry's priorities.\n\nThe network is prioritizing six House incumbents by injecting a baseline of $1 million into their campaigns. Republicans Bryan Steil of Wisconsin , who chairs a digital assets subcommittee in the lower chamber, as well as French Hill of Arkansas and Bill Huizenga of Michigan , who serve as the chair and vice chair of the House Financial Services Committee, respectively. Democratic lawmakers receiving at least $1 million from Fairshake include Reps. Janelle Bynum of Oregon; Derek Tran of California; and Steven Horsford of Nevada .\n\nFairshake's spending spree has been supercharged by digital asset-focused companies, like cryptocurrency exchange Coinbase Global.\n\nCoinbase established itself as one of the largest corporate political donors in modern history in the 2024 election cycle, contributing $79 million to federal races, according to OpenSecrets . That included a $1 million dollar personal contribution from CEO Brian Armstrong to Fairshake in 2023.\n\nCoinbase donated $25 million to Fairshake's midterm efforts in 2025, according to the super PAC.", "source": "CNBC World Economy", "pub_date_str": "31 Oct 2026, 06:34 PM IST", "pub_date_relative": "42m ago"}, {"title": "Intel stock plunges 29%. Analysts urge caution on buying the dip", "full_content": "Intel's sell-off could be a chance to buy the dip, but you need a long investing horizon.", "source": "CNBC Top News", "pub_date_str": "31 Oct 2026, 06:32 PM IST", "pub_date_relative": "44m ago"}, {"title": "The stock market\u2019s front-runners stumbled in October. Here\u2019s where the smart money is moving now.", "full_content": "U.S. stocks saw a stronger reversal in fortunes in October, as worries about dwindling free cash flows and rising borrowing costs threw a wrench into the works of the artificial-intelligence trade.", "source": "MarketWatch Top Stories", "pub_date_str": "31 Oct 2026, 06:31 PM IST", "pub_date_relative": "45m ago"}, {"title": "If you really want to help your adult kids and grandkids, give them money while you\u2019re still alive", "full_content": "How to manage \u201cgiving while living\u201d without endangering your own retirement.", "source": "MarketWatch Top Stories", "pub_date_str": "31 Oct 2026, 06:30 PM IST", "pub_date_relative": "46m ago"}, {"title": "Vijay To Make History At Davos: First Tamil Nadu Chief Minister To Attend WEF Summit", "full_content": "The proposed visit is aimed at positioning Tamil Nadu as a major global investment destination, with TVK alleging inadequate support from the Centre in attracting overseas investors.", "source": "NDTV Profit", "pub_date_str": "31 Oct 2026, 06:28 PM IST", "pub_date_relative": "47m ago"}, {"title": "How to start an art collection on any budget", "full_content": "The decision to invest in any collectibles market should start with curiosity and love, and buying art is no exception. While the rarest works of art in the world have sold for hundreds of millions of dollars, for most collectors, art is unlikely to match the returns offered by traditional investment markets.\n\nA recent analysis of 10-year annualized returns including data through 2024 showed that the stock market vastly outperformed art. True, it has been an incredibly strong bull market on a historical basis, but the performance from the art market over the same time period produced some of the worst 10-year returns in seven decades.\n\nAs with any asset class experiencing a downturn, some experts see the recent weakness as a buying opportunity. The 2025 market did see some improvement, and 2026 has been an ever better year to date, with younger buyers showing up in a big way. But experts also stress that the art world is the least transparent market imaginable, with significant \"insider information\" involved in anticipating big jumps and the next major wave of hype.\n\n\"What I tell people is that there is so much inside information in the art world \u2014 for instance, who has bought a particular artist or who is getting a museum show in two years \u2014 that if you are an outsider, you have little hope\" of catching the next big wave early, said Canice Prendergast, economics professor at the University of Chicago, who also oversees that Chicago Booth School of Business Harper Center's contemporary art collection, which houses more than 650 artworks.\n\nIt is important to understand that generating a repeatable investment strategy can be difficult \u2014 if not impossible.\n\n\"Most art is not a good investment,\" said Magnus Resch, who teaches art economics at Yale University and is widely recognized as a leading art market expert.", "source": "CNBC Top News", "pub_date_str": "31 Oct 2026, 06:28 PM IST", "pub_date_relative": "47m ago"}, {"title": "UPS Jeevan Setu Facility For Pensioners: How To Submit Digital Life Certificate Before November 30", "full_content": "The UPS Jeevan Setu facility allows eligible pensioners to generate and submit their Digital Life Certificates (DLCs) through Aadhaar-based authentication.", "source": "NDTV Profit", "pub_date_str": "31 Oct 2026, 06:28 PM IST", "pub_date_relative": "48m ago"}, {"title": "Trump promised to slash energy costs \u2014 but gasoline, diesel and jet fuel all soared instead", "full_content": "President Donald Trump promised voters angry about inflation that he would slash gas prices below $2 a gallon within his first year in office.\n\n\"My plan will cut energy prices in half or more than that within 12 months of taking office,\" Trump said in a speech to the New York Economic Club in September 2024 during his re-election campaign.\n\n\"Energy was what caused our problem initially,\" he told voters. \"Energy is going to bring us back. That means we're going down and getting gasoline below $2 a gallon.\"\n\nBut when voters head to the ballot box on Tuesday energy prices will remain a headache. Gas and diesel prices are forecast to be the highest ever on an election day, according to Patrick De Haan, head of petroleum analysis at GasBuddy.\n\n\"Prices have never been this high this late in the year,\" De Haan said.\n\nGas prices stood at a national average of $4.20 a gallon on Friday, nearly 40% above the same period last year. The price of diesel, critical to transportation and agriculture, has surged about 70% over the past year, to $6.32 a gallon.\n\nDuring the 2022 U.S. midterm elections, the year that Russia invaded Ukraine and triggered an energy crisis, retail gas prices stood at $3.80, according to AAA data.\n\n\"Trump got in his own way,\" De Haan said. \"Back in December, we predicted that 2026 was going to be the cheapest year for gas since 2020. That required no effort. And obviously, it hasn't gone that way.\"", "source": "CNBC Top News", "pub_date_str": "31 Oct 2026, 06:19 PM IST", "pub_date_relative": "56m ago"}, {"title": "Binance\u2019s $6.3 billion hack raises questions about crypto wallet safety", "full_content": "Two high-profile security breaches this week \u2013 including the biggest cryptocurrency theft in history \u2013 are raising questions on the safety of storing funds in a wallet on a crypto exchange .\n\nA security incident at digital asset exchange Binance on Thursday affected some $6.3 billion in client assets, making it the largest crypto theft on record.\n\nEarlier that day, prediction market platform Polymarket temporarily halted trading on its international exchange after a third-party data provider was hacked, resulting in at least $2.7 million being drained from users' wallets. The company's international platform operates on the Polygon blockchain.\n\nExperts whom CNBC interviewed said the security incidents on the crypto exchanges aren't surprising, especially in light of recent artificial intelligence hacking incidents .\n\nMost of these experts even said that observers should expect more security incidents, at least in the near term, as that problem worsens.\n\n\"I think it's extremely dangerous,\" said Tyler Moore, a cybersecurity professor at the University of Tulsa who has followed the asset class for more than a decade. \"I think you should be very wary of leaving any significant amount of funds in an exchange\u2026 there are no built-in protections for when these inevitable hacks take place.\"\n\nFor instance, banking customers can rely on the Federal Deposit Insurance Corporation to insure deposits up to $250,000 per depositor, per insured bank, in the event of an institution's failure.\n\nThere is no similar form of coverage available for funds lost from a cryptocurrency exchange, noted Moore.", "source": "CNBC Top News", "pub_date_str": "31 Oct 2026, 06:17 PM IST", "pub_date_relative": "59m ago"}, {"title": "Bhopal Road Rage: Blogger's Bike Hit By Car, Driver Pulls Out Pistol; Video Goes Viral", "full_content": "A Bhopal road rage video, showing a driver allegedly pulling a pistol on a biker, has gone viral. Police have registered a case, and the internet is divided.", "source": "NDTV Profit", "pub_date_str": "31 Oct 2026, 06:16 PM IST", "pub_date_relative": "1h ago"}, {"title": "Muthoot Finance Q2 cons profit jumps 36% YoY to Rs 3,278 crore", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a Earnings \u203a Muthoot Finance Q2 cons profit jumps 36% YoY to Rs 3,278 crore Muthoot Finance Share Price Manappuram Finance Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Muthoot Finance Q2 cons profit jumps 36% YoY to Rs 3,278 crore SECTIONS Muthoot Finance Q2 cons profit jumps 36% YoY to Rs 3,278 crore By Atmadip Ray , ET Bureau Last Updated: Oct 31, 2026, 06:15:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Muthoot Finance reported a 36% year-on-year rise in consolidated net profit to Rs 3,278 crore in Q2, while assets under management grew 42% to Rs 2.09 lakh crore. However, standalone gross NPA ratio rose to 3.87% from 2.28% in the previous quarter, indicating a deterioration in asset quality\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "31 Oct 2026, 06:15 PM IST", "pub_date_relative": "1h ago"}, {"title": "Iran's Khamenei Orders Military To Expand US Retaliation Plans", "full_content": "Iran's Supreme Leader Mojtaba Khamenei ordered his top military commanders to prepare for renewed confrontation with the US and Israel and expand Tehran's options for retaliation.", "source": "NDTV Profit", "pub_date_str": "31 Oct 2026, 06:11 PM IST", "pub_date_relative": "1h ago"}, {"title": "Aditya Birla Lifestyle Brands Q2 Results: PAT More Than Doubles 126% To Rs 53 Crore, Revenue Rises 11%", "full_content": "Aditya Birla Lifestyle Brands reports its fourth consecutive quarter of double-digit revenue growth, with Q2 net profit rising 126% to Rs 53 crore and EBITDA increasing 15%.", "source": "NDTV Profit", "pub_date_str": "31 Oct 2026, 06:07 PM IST", "pub_date_relative": "1h ago"}, {"title": "This Halloween, are full-size candy bars a better deal than fun-sized ones?", "full_content": "Several TikTokers influencers claim you can save money and be the coolest house on the block with bigger candy this year. Let\u2019s see how that adds up.", "source": "MarketWatch Top Stories", "pub_date_str": "31 Oct 2026, 06:07 PM IST", "pub_date_relative": "1h ago"}, {"title": "Alphabet Is In Talks To Join Trump's Golden Dome Defense Program", "full_content": "The Pentagon is standing up a new industry group that aims to secure the data that feeds into military software being built for Golden Dome.", "source": "NDTV Profit", "pub_date_str": "31 Oct 2026, 06:03 PM IST", "pub_date_relative": "1h ago"}, {"title": "Ramayana Advance Bookings: Ranbir-Yash Starrer Grosses Over Rs 20 Crore In Pre-Release Ticket Sales", "full_content": "Ramayana part 1 stars Ranbir Kapoor, Yash, Sai Pallavi, Sunny Deol, Ravi Dubey, Lara Dutta, Arun Govil, Kajal Aggarwal, Rakul Preet Singh and Vivek Oberoi in key roles.", "source": "NDTV Profit", "pub_date_str": "31 Oct 2026, 06:03 PM IST", "pub_date_relative": "1h ago"}, {"title": "Nvidia\u2019s Megaspeed ties show potential blind spots in the U.S. effort to block China from accessing advanced chips", "full_content": "Nvidia CEO Jensen Huang\u2019s business meetings are routine practice and existing U.S. export controls largely miss the cloud, experts say.", "source": "MarketWatch Top Stories", "pub_date_str": "31 Oct 2026, 06:00 PM IST", "pub_date_relative": "1h ago"}, {"title": "Cockroach Milk Becoming A Future Superfood? Elon Musk Has This To Say", "full_content": "Elon Musk's one-word reaction to a report on cockroach milk has sparked conversations online. The unusual substance, produced by Pacific beetle cockroaches, has attracted scientific interest because of its concentrated protein content.", "source": "NDTV Profit", "pub_date_str": "31 Oct 2026, 05:58 PM IST", "pub_date_relative": "1h ago"}, {"title": "GS flags interest rates and AI disruption as risks to long-term equity demand", "full_content": "", "source": "Investing.com News", "pub_date_str": "31 Oct 2026, 05:57 PM IST", "pub_date_relative": "1h ago"}, {"title": "NTPC Q2 FY27 slides show capacity growth, profit gains", "full_content": "", "source": "Investing.com News", "pub_date_str": "31 Oct 2026, 05:56 PM IST", "pub_date_relative": "1h ago"}, {"title": "Berkshire ekes out some new highs, but October rally stalls", "full_content": "(This is the Warren Buffett Watch newsletter, news and analysis on all things Warren Buffett and Berkshire Hathaway. You can sign up here to receive it every Friday evening in your inbox.)\n\nBerkshire Hathaway shares managed to set a few more all-time highs in an otherwise lackluster week of trading.\n\nThe Class A stock closed Monday at a record high $821,931 but ended the week up just 0.3% at $815,600.\n\nIt spiked at Friday's open to almost $822,929, but that wasn't enough to top its record intraday high of $824,765 set on Thursday of last week as Berkshire entirely erased what turned into a 15% pullback after Warren Buffett announced last year that he would step down as the company's CEO .\n\nThe more widely held Class B shares also set a new record high close on Monday, finishing that day at $548.56.\n\nBut their high during Friday's session of $550.47 is enough for a new all-time intraday record, edging out last Thursday's $549.96.\n\nDespite losing some steam this week, Berkshire shares are ending October with strong gains, especially when compared to the S&P 500 and the Nasdaq Composite .\n\nThe latter index lost 2.9% Friday, its worst one-day drop since June, as money moves away from high-flying AI and tech stocks over spending concerns.", "source": "CNBC Top News", "pub_date_str": "31 Oct 2026, 05:56 PM IST", "pub_date_relative": "1h ago"}, {"title": "Perfume Launch On Mount Everest! Kenz De Rasasi's Hawas Frost To Make Its Debut On On Nov 2", "full_content": "Hawas Frost will make its debut on November 2, with a Guinness World Records attempt planned at Mount Everest before its Dubai reveal.", "source": "NDTV Profit", "pub_date_str": "31 Oct 2026, 05:49 PM IST", "pub_date_relative": "1h ago"}, {"title": "SEBI To Make Direct Mutual Funds Default From November 1: How Much Can You Save On A Rs 5,000 SIP?", "full_content": "For someone investing Rs 5,000 every month through a systematic investment plan (SIP), even a small difference in annual returns can add up to lakhs over 20 years.", "source": "NDTV Profit", "pub_date_str": "31 Oct 2026, 05:45 PM IST", "pub_date_relative": "1h ago"}, {"title": "Earnings call transcript: NTPC posts strong Q2 2026 growth as stock rises", "full_content": "", "source": "Investing.com News", "pub_date_str": "31 Oct 2026, 05:44 PM IST", "pub_date_relative": "1h ago"}, {"title": "Jailer 2 Box Office Collection Day 17: Rajinikanth Starrer Maintains Strong Hold In Third Week", "full_content": "Directed by Nelson Dilipkumar, Jailer 2 is a Tamil action drama starring Rajinikanth as retired jailer Tiger Muthuvel Pandian.", "source": "NDTV Profit", "pub_date_str": "31 Oct 2026, 05:42 PM IST", "pub_date_relative": "1h ago"}, {"title": "Qatari mediators held talks in Tehran aimed at restarting direct U.S.-Iran negotiations, source says", "full_content": "Qatari mediators have held talks with Iranian officials in an attempt to restart direct negotiations between Washington and Tehran, an official source familiar with the discussions told CNBC on Saturday.\n\nIran promised a \"geographically unrestricted response\" to any new attacks by the U.S.\n\nQatari mediators held more than 12 hours of talks in Tehran on Friday to reach a deal to avoid a possible resumption of American-led attacks on Iran after the U.S. midterm elections, the source said, speaking on condition of anonymity.\n\nAxios first reported the talks, which it said are set to continue in the Qatari capital, Doha, on Saturday.\n\nA preliminary agreement signed on June 17 between the U.S. and Iran to halt the fighting \u2014 which began on Feb. 28 with U.S. and Israeli strikes on Iranian targets \u2014 broke down weeks later.\n\nOn Tuesday, U.S. President Donald Trump reiterated his claim that the Iran war will end \" whenever I want it to .\" Trump said it \"would be very quick, but we have to have an end properly ,\" with a \"total statement\" that Iran would never have a nuclear weapon.\n\nThe last confirmed U.S. strikes on Iran occurred on Sept. 1. Trump previously left open the possibility that attacks on Iran would resume after the Nov. 3 midterm elections, which are set for Tuesday. Tehran has said it is preparing a military response to any U.S. strikes.\n\nA statement posted on Iranian Supreme Leader Mojtaba Khamenei's Telegram account Saturday said that \"any level or type of threat must be met with an immediate, impactful, and geographically unrestricted response.\"", "source": "CNBC Top News", "pub_date_str": "31 Oct 2026, 05:41 PM IST", "pub_date_relative": "1h ago"}, {"title": "India extends cotton import duty exemption till December 31", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a India extends cotton import duty exemption till December 31 The Economic Times daily newspaper is available online now. Read Today's Paper India extends cotton import duty exemption till December 31 SECTIONS India extends cotton import duty exemption till December 31 By Anoushka Sawhney , ET Bureau Last Updated: Oct 31, 2026, 05:40:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Indian government has extended the customs duty exemption on cotton imports to December 31. This decision aims to support the textile industry by ensuring adequate raw material availability. The waiver allows greater flexibility for manufacturers to source inputs at reduced costs. Domestic cotton prices have remained firm due to production concerns, prompting this extension. The move is expected to strengthen Indian textiles in both domestic and international markets.\n\nYou can buy a walkie-talkie online. But can you legally use it?\n\nKYB and KYC: Quick commerce, the Damani premium and what DMart must deliver \u2013 3rd and concluding part\n\nKYC and KYB: Inside Damani\u2019s DMart, the retail chain for the middle class. And stock for the long term? \u2013 Part 2 of 3\n\nWill it be a regulatory nightmare if an exchange lists on its own platform?\n\nKYC and KYB: Inside Damani\u2019s Avenue Supermarts that refuses to charge more \u2013 Part 1 of 3\n\nCan new data protection law guard against SBI-like data breaches?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "31 Oct 2026, 05:40 PM IST", "pub_date_relative": "1h ago"}, {"title": "NTPC Q2 Results: Profit Jumps 41% To Rs 7,351 Crore, Declares Dividend", "full_content": "Revenue from operations surged 21.2% to Rs54,270 crore for the quarter ended on September 30, 2026.", "source": "NDTV Profit", "pub_date_str": "31 Oct 2026, 05:39 PM IST", "pub_date_relative": "1h ago"}, {"title": "Crime Branch Finds 45 Questions In Kerala PSC Exam Copied From Online Handbook", "full_content": "The Crime Branch has allegedly found deliberate manipulation in the Kerala PSC Assistant Motor Vehicle Inspector recruitment examination.", "source": "NDTV Profit", "pub_date_str": "31 Oct 2026, 05:38 PM IST", "pub_date_relative": "1h ago"}, {"title": "Sebi to release FII compliance consultation paper within weeks, says chairman Tuhin Kanta Pandey", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Sebi to release FII compliance consultation paper within weeks, says chairman Tuhin Kanta Pandey The Economic Times daily newspaper is available online now. Read Today's Paper Sebi to release FII compliance consultation paper within weeks, says chairman Tuhin Kanta Pandey SECTIONS Sebi to release FII compliance consultation paper within weeks, says chairman Tuhin Kanta Pandey By Atmadip Ray , ET Bureau Last Updated: Oct 31, 2026, 06:18:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Sebi is likely to release a consultation paper on foreign investor compliance requirements within weeks, chairman Tuhin Kanta Pandey said. The proposed document will explore aligning Indian norms with global standards amid heavy FII outflows. The regulator is also planning a capacity-building network to strengthen independent directors\u2019 effectiveness.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "31 Oct 2026, 05:36 PM IST", "pub_date_relative": "1h ago"}, {"title": "'Not For Us Or Anybody': Reddit CEO Says Google's AI Mode No Longer Drives Traffic", "full_content": "Reddit CEO Steve Huffman says AI search cannot replicate the community and human experiences offered by platforms such as Reddit.", "source": "NDTV Profit", "pub_date_str": "31 Oct 2026, 05:35 PM IST", "pub_date_relative": "1h ago"}, {"title": "Bank of Marin Bancorp director Anderson buys $1,137 in shares", "full_content": "", "source": "Investing.com News", "pub_date_str": "31 Oct 2026, 05:31 PM IST", "pub_date_relative": "1h ago"}, {"title": "France braces for fresh unrest, government vows tough response", "full_content": "", "source": "Investing.com News", "pub_date_str": "31 Oct 2026, 05:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "Humans are still doing the work behind some AI agents", "full_content": "The next time someone's supercharged AI agent attempts to make a phone call to negotiate a cable bill, it could be an actual human who haggles with customer service rather than the software.\n\nThat's because AI agents, powered by the bleeding-edge foundation models developed by companies like Meta and OpenAI , still can't reliably take actions across the web, particularly those involving phone calls. Former Yahoo CEO Marissa Mayer, who now helms agent startup Dazzle AI, says current top-tier AI models excel at surfacing online home renovation services for consumers, but might blow it when they need to book and schedule a rooftop upgrade.\n\n\"We're relying on the frontier models to give us good suggestions and a good candidate list, but we're checking that over to make sure that we're really delivering the type of service that we can stand behind,\" Mayer said, referring to how Dazzle funnels certain tasks to human contractors.\n\nDigital assistants driven by artificial intelligence are currently gaining renewed interest thanks to Meta, OpenAI and others that are pitching the technology as capable of tasks like scouting the internet for shoes.\n\nMeta's Muse, OpenAI's Dots and a host of other agents can accomplish a multitude of web-browsing feats, but it's still early days for the technology, and it often hits digital roadblocks. Those barriers typically involve tasks that would have an AI agent make a phone call, schedule a doctor's appointment on someone's behalf, or reserve a couch scrubbing from a local cleaning service, said Meghan Joyce, CEO of digital agent startup Duckbill.\n\nFor tasks that require real-world judgment, Joyce said humans still trump AI, and companies building consumer-grade digital assistants will need to patch in real people to take over.", "source": "CNBC World Economy", "pub_date_str": "31 Oct 2026, 05:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "Automakers like Rivian and Ford are \u2018democratizing 3D printing\u2019 to reduce costs and increase speed", "full_content": "DETROIT \u2014 Automakers including Ford Motor and Rivian Automotive are leaning into a new type of manufacturing line: 3D printing.\n\nManufacturers say it's helping them reduce costs and increase speed. The technology has been around for decades, but it's becoming more commoditized in the automotive industry, with 3D printers used to create everything from vehicle parts and accessories to tools for assembly plants and testing units for research and development labs.\n\n\"At this point, we don't have a choice but to scale up and begin using it through all factions of Rivian,\" Jared Beck, head of Rivian's additive manufacturing, told CNBC during a tour of the automaker's expansive 3D-printing operations in suburban Detroit. \"We're going to be democratizing 3D printing for the entire company.\"\n\nAlso known as additive manufacturing, 3D printing can create three-dimensional objects from digital designs by dispensing material layer by layer, much like a traditional printer does with ink on paper. Instead of ink, the machines use a wide variety of materials such as plastics, composites, ceramics and even metals.\n\nPrinters can range from hundreds of dollars for hobby-like devices to hundreds of thousands of dollars for specialty equipment, depending on how big the product being produced is and the material it needs. They can produce individual pieces or hundreds of smaller parts in a batch using powders and resins.\n\nRivian said it has spent more than $5 million on 3D-printing machines, with the cost of materials for the operations growing to about $1.7 million annually.\n\nBeck said despite the costs, the machines typically pay for themselves within a year. He said the technology helps lower supplier tooling costs, streamline logistics expenses and cut production times for parts from weeks to days, if not hours.\n\n\"It's well in the millions [for savings], but the main thing is speed for Rivian,\" Beck said.", "source": "CNBC World Economy", "pub_date_str": "31 Oct 2026, 05:30 PM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "How suspected North Korean hackers swiped billions in crypto in only minutes - The Washington Post", "full_content": "How suspected North Korean hackers swiped billions in crypto in only minutes The Washington Post Binance\u2019s $6.3 billion hack raises questions about crypto wallet safety CNBC A Very Bad 24 Hours for Crypto The Atlantic Expert warns of 'AI hacking bloodbath' following massive Binance cryptocurrency theft Fox Business How North Korea perfected the crypto heist Axios", "source": "Google News Business", "pub_date_str": "31 Oct 2026, 07:03 PM IST", "pub_date_relative": "12m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Jio Platforms up 27.8% since IPO listing but how RIL, Jio Fin, Alok Ind, Network 18, Lotus shares fared in 3 years?", "full_content": "RELIANCE JIOFIN ALOKINDS LOTUSCHO Sharmila Bhadoria Published 31 Oct 2026, 06:46 PM IST Prefer Livemint on Google The much awaited initial public offering (IPO), Jio Platforms , made a spectacular stock market debut this week, with shares listing at a nearly 21.36% premium over the issue price. Backed by Reliance Industries Limited, Jio shares have surged 27.8% over the IPO price.\n\nWhile Jio Platforms shares are stealing the spotlight, here's a look at how other stocks from Mukesh Ambani's Reliance group have performed over the past three years.\n\nThe Reliance Group\u2019s listed companies include Reliance Industries Limited, Jio Financial Services , Alok Industries , Network18 Media and Lotus Chocolate Company .\n\nRIL share price closed 0.44% lower at \u20b9 1163.55 per share on BSE with a market capitalisation of \u20b9 15,74,578.54 crore on Friday, October 30. The stock has declined 21.83% in one year, 13.42% in two years. Its share price value has surged merely 0.68% in three years.\n\nShares of Jio Financial Services closed 1.21% lower at \u20b9 204.50 per share on BSE with an MCap of \u20b9 1,35,034.25 crore on Friday. The stock has declined 5.59% in one month, 17.17% in three months and around 30.82% in 2026 so far (YTD).\n\nAlok Industries stock closed 5.49% lower at \u20b9 8.09 per share on BSE with an MCap of \u20b9 4,016.88 crore. The textile stock has declined 53.85% in one year. RIL holds 40.01% stake in the textile stock.\n\nShares of Network 18 Media & Investments Limited closed 1.86% lower at \u20b9 23.68 per share on BSE with an MCap of \u20b9 3,651.46 crore on BSE on Friday. Its share price value has declined 51.08% in one year, 70.84% in two years, and 65.78% in three years.\n\nLotus Chocolate Company\u2019s share price closed 508.40 per share on BSE with a market capitalisation of \u20b9 652.84 crore on Friday. Its share price value has declined 64.41% in two years, but has surged 88% in three years.", "source": "LiveMint Markets", "pub_date_str": "31 Oct 2026, 06:46 PM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Inflation, Inequality and Debt: The Charts Scaring Wall Street", "full_content": "(Bloomberg) -- US stocks are hovering near record highs, unfazed by the war with Iran, stubborn inflation and mounting questions over how Wall Street will finance the expanding AI buildout. But for investors looking for a scare this Halloween, some of the market\u2019s most unsettling signals are hiding just beneath the surface.\n\nFrom violent swings in semiconductor shares and ballooning AI-related debt, to a stock-bond hedge that\u2019s lost some of its reliability, as well as a widening wealth divide, the charts occupying Wall Street\u2019s attention paint a less comforting picture than the major indexes might suggest.\n\nBloomberg News asked nine financial professionals what charts spook them. Here\u2019s what they shared:\n\nWe find concerning the consensus forecasts for slower inflation in 2027 given recent data on prices. The consensus forecast for PCE inflation in 2027 is 2.5% and the average of the top 10 forecasts is 3.1%. Similarly, the Fed\u2019s September Summary of Economic Projections show a median forecast of 2.3% PCE inflation next year and no FOMC participant sees inflation above 2.6% in 2027.\n\nThus, even the most pessimistic forecasts don\u2019t envisage inflation running higher than current rates next year. These projections, which for private economists are based on the hope that the impulse from tariffs will fade, and oil prices will decline on the cessation of hostilities, have little support in the data. The PPI report shows scary trends in pipeline manufacturing goods prices with, for example, core processed goods PPI prices surging 24.3% over the last year. This is beginning to look like 2021/22, and if these soaring pipeline prices feed into finished goods prices, this may give Fed policymakers nightmares.\n\nTiffany Wilding, economist at Pacific Investment Management Co.:\n\nThe AI boom has raised concerns about a potential \u201ccrowding out\u201d of other companies that want to borrow in the capital markets, potentially increasing the concentration of AI in a U.S.", "source": "LiveMint Markets", "pub_date_str": "31 Oct 2026, 06:42 PM IST", "pub_date_relative": "34m ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "In the wake of Weil, a legal recruiter's advice for surviving a company wind-down", "full_content": "It's hard to believe a corporate giant like Weil, Gotshal & Manges \u2014 a top 20 U.S. law firm that reportedly had over $2 billion in revenue in 2025 \u2014 could move toward ceasing operations just like that. But occasionally a Weil-like wind-down \u2014 or even a collapse like Lehman Brothers , Silicon Valley Bank or FTX \u2014 is bound to occur.\n\nAnd here we are, seeing a major law firm move toward shutting down in real time.\n\nThe firm's management committee recommended that its partners prepare to close its doors after more than 90 years in business, Weil, Gotshal & Manges said on Wednesday. \"Following a careful review of strategic alternatives, the Firm's Management Committee has recommended to the partnership that the Firm pursue an orderly wind-down,\" the firm said in a statement to CNBC on Wednesday. \"The partners are expected to vote in the coming days.\"\n\nAs a legal recruiter and former big law associate, I'm here to provide practical insights to the employees, lawyers and non-lawyers alike, who've just learned they're about to be out of a job \u2014 and those who are scared their company might be next.\n\nFirst, let's be clear: From where I stand, Weil is an anomaly. But when a company does make headlines for winding down, or failing and shutting down, it's rarely the employees whose plight is highlighted: the people whose careers have been destabilized, whose anxiety shoots through the roof and who become the collateral damage of business decisions they had no idea were being made until far too late.\n\nHere are my top tips, for both lawyers and non-lawyers, for when your company announces or is headed toward dissolution. In the case of Weil, it's advice I hope the firm's roughly 1,200 lawyers plus staff take to heart in the next 90 days .\n\nYes, you can worry. Yes, you can grieve.", "source": "CNBC Top News", "pub_date_str": "31 Oct 2026, 06:37 PM IST", "pub_date_relative": "39m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Explained: Binance Hack And How To Protect Your Money", "full_content": "Safety measures such as two-factor authentication and using cold wallets can minimise the risk of losses in case of a crypto hack.", "source": "NDTV Profit", "pub_date_str": "31 Oct 2026, 06:36 PM IST", "pub_date_relative": "39m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Bank of America says buy these stocks ahead of earnings before it's too late", "full_content": "The firm named a slew of undervalued stocks to buy ahead of quarterly reports.", "source": "CNBC Top News", "pub_date_str": "31 Oct 2026, 06:35 PM IST", "pub_date_relative": "41m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "35-year-old took on $20K in debt to launch a business from her dining room\u2014now it brings in 8 figures a year", "full_content": "Set Active CEO Lindsey Carter used to lose sleep, cry to her friends and struggle to be present in her personal life after a rough day at work.\n\nIt's not that she expected entrepreneurship to be easy. Carter took on $20,000 in personal credit card debt and filled her Los Angeles home with inventory when she started the athleisure company in May 2018, she says. Yet years of obstacles \u2014 familiar to many an entrepreneur \u2014 followed as she tried to break Set Active into a crowded activewear industry. It took her time to figure out how to separate her professional stress from her personal life.\n\n\"I started understanding that struggle wasn't necessarily a sign that something was going wrong. Sometimes it's just the reality of building something ambitious,\" says Carter, 35. \"And if I was going to let every setback rob me of my happiness, I'm going to be spending a very long time being unhappy.\"\n\nSet Active is no industry giant, but it brought in eight figures in 2025 net sales and is profitable, according to documents reviewed by CNBC Make It. That comes as growth in the broader activewear market has slowed: Women's activewear spending in the U.S. increased 2% between October 2025 and September 2026, down from 7% over the preceding 12 months, according to data from market research firm Circana.\n\nActivewear still makes up 30% of U.S. apparel spending, says Circana apparel industry analyst Kristen Classi-Zummo. Shoppers these days particularly gravitate toward casual outfits and loungewear, like sweatpants and sweatshirts, over more active items like leggings and sports bras, Classi-Zummo says. That's good news for Carter, who sells color- and pattern-filled clothing sets that aren't solely intended for workouts. Set Active's Instagram posts feature women sitting on pickleball courts or the banks of the Seine in Paris.\n\nBefore launching Set Active, Carter ran her own social media company.", "source": "CNBC Top News", "pub_date_str": "31 Oct 2026, 06:35 PM IST", "pub_date_relative": "41m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Crypto industry pours more than $200 million into 2026 midterms to pressure Congress on favorable rules", "full_content": "The largest group of single-issue super PACs in United States history is pouring millions of dollars into congressional races across the country.\n\nCryptocurrency groups outpaced online betting and data center development groups in federal corporate political spending this election cycle, according to Public Citizen . Crypto-tied organizations have contributed more than $200 million in this election cycle.\n\nThe industry is hoping to repeat the success of 2024, when super PACs spent $250 million to elect pro-crypto lawmakers and reshape Congress.\n\nCrypto juggernaut Fairshake and its affiliated super PACs are throwing their support behind 33 House candidates \u2014 19 Republicans and 14 Democrats \u2014 seen as key supporters of the industry's priorities.\n\nThe network is prioritizing six House incumbents by injecting a baseline of $1 million into their campaigns. Republicans Bryan Steil of Wisconsin , who chairs a digital assets subcommittee in the lower chamber, as well as French Hill of Arkansas and Bill Huizenga of Michigan , who serve as the chair and vice chair of the House Financial Services Committee, respectively. Democratic lawmakers receiving at least $1 million from Fairshake include Reps. Janelle Bynum of Oregon; Derek Tran of California; and Steven Horsford of Nevada .\n\nFairshake's spending spree has been supercharged by digital asset-focused companies, like cryptocurrency exchange Coinbase Global.\n\nCoinbase established itself as one of the largest corporate political donors in modern history in the 2024 election cycle, contributing $79 million to federal races, according to OpenSecrets . That included a $1 million dollar personal contribution from CEO Brian Armstrong to Fairshake in 2023.\n\nCoinbase donated $25 million to Fairshake's midterm efforts in 2025, according to the super PAC.", "source": "CNBC World Economy", "pub_date_str": "31 Oct 2026, 06:34 PM IST", "pub_date_relative": "42m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "The stock market\u2019s front-runners stumbled in October. Here\u2019s where the smart money is moving now.", "full_content": "U.S. stocks saw a stronger reversal in fortunes in October, as worries about dwindling free cash flows and rising borrowing costs threw a wrench into the works of the artificial-intelligence trade.", "source": "MarketWatch Top Stories", "pub_date_str": "31 Oct 2026, 06:31 PM IST", "pub_date_relative": "45m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "How to start an art collection on any budget", "full_content": "The decision to invest in any collectibles market should start with curiosity and love, and buying art is no exception. While the rarest works of art in the world have sold for hundreds of millions of dollars, for most collectors, art is unlikely to match the returns offered by traditional investment markets.\n\nA recent analysis of 10-year annualized returns including data through 2024 showed that the stock market vastly outperformed art. True, it has been an incredibly strong bull market on a historical basis, but the performance from the art market over the same time period produced some of the worst 10-year returns in seven decades.\n\nAs with any asset class experiencing a downturn, some experts see the recent weakness as a buying opportunity. The 2025 market did see some improvement, and 2026 has been an ever better year to date, with younger buyers showing up in a big way. But experts also stress that the art world is the least transparent market imaginable, with significant \"insider information\" involved in anticipating big jumps and the next major wave of hype.\n\n\"What I tell people is that there is so much inside information in the art world \u2014 for instance, who has bought a particular artist or who is getting a museum show in two years \u2014 that if you are an outsider, you have little hope\" of catching the next big wave early, said Canice Prendergast, economics professor at the University of Chicago, who also oversees that Chicago Booth School of Business Harper Center's contemporary art collection, which houses more than 650 artworks.\n\nIt is important to understand that generating a repeatable investment strategy can be difficult \u2014 if not impossible.\n\n\"Most art is not a good investment,\" said Magnus Resch, who teaches art economics at Yale University and is widely recognized as a leading art market expert.", "source": "CNBC Top News", "pub_date_str": "31 Oct 2026, 06:28 PM IST", "pub_date_relative": "47m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Trump promised to slash energy costs \u2014 but gasoline, diesel and jet fuel all soared instead", "full_content": "President Donald Trump promised voters angry about inflation that he would slash gas prices below $2 a gallon within his first year in office.\n\n\"My plan will cut energy prices in half or more than that within 12 months of taking office,\" Trump said in a speech to the New York Economic Club in September 2024 during his re-election campaign.\n\n\"Energy was what caused our problem initially,\" he told voters. \"Energy is going to bring us back. That means we're going down and getting gasoline below $2 a gallon.\"\n\nBut when voters head to the ballot box on Tuesday energy prices will remain a headache. Gas and diesel prices are forecast to be the highest ever on an election day, according to Patrick De Haan, head of petroleum analysis at GasBuddy.\n\n\"Prices have never been this high this late in the year,\" De Haan said.\n\nGas prices stood at a national average of $4.20 a gallon on Friday, nearly 40% above the same period last year. The price of diesel, critical to transportation and agriculture, has surged about 70% over the past year, to $6.32 a gallon.\n\nDuring the 2022 U.S. midterm elections, the year that Russia invaded Ukraine and triggered an energy crisis, retail gas prices stood at $3.80, according to AAA data.\n\n\"Trump got in his own way,\" De Haan said. \"Back in December, we predicted that 2026 was going to be the cheapest year for gas since 2020. That required no effort. And obviously, it hasn't gone that way.\"", "source": "CNBC Top News", "pub_date_str": "31 Oct 2026, 06:19 PM IST", "pub_date_relative": "56m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Binance\u2019s $6.3 billion hack raises questions about crypto wallet safety", "full_content": "Two high-profile security breaches this week \u2013 including the biggest cryptocurrency theft in history \u2013 are raising questions on the safety of storing funds in a wallet on a crypto exchange .\n\nA security incident at digital asset exchange Binance on Thursday affected some $6.3 billion in client assets, making it the largest crypto theft on record.\n\nEarlier that day, prediction market platform Polymarket temporarily halted trading on its international exchange after a third-party data provider was hacked, resulting in at least $2.7 million being drained from users' wallets. The company's international platform operates on the Polygon blockchain.\n\nExperts whom CNBC interviewed said the security incidents on the crypto exchanges aren't surprising, especially in light of recent artificial intelligence hacking incidents .\n\nMost of these experts even said that observers should expect more security incidents, at least in the near term, as that problem worsens.\n\n\"I think it's extremely dangerous,\" said Tyler Moore, a cybersecurity professor at the University of Tulsa who has followed the asset class for more than a decade. \"I think you should be very wary of leaving any significant amount of funds in an exchange\u2026 there are no built-in protections for when these inevitable hacks take place.\"\n\nFor instance, banking customers can rely on the Federal Deposit Insurance Corporation to insure deposits up to $250,000 per depositor, per insured bank, in the event of an institution's failure.\n\nThere is no similar form of coverage available for funds lost from a cryptocurrency exchange, noted Moore.", "source": "CNBC Top News", "pub_date_str": "31 Oct 2026, 06:17 PM IST", "pub_date_relative": "59m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Muthoot Finance Q2 cons profit jumps 36% YoY to Rs 3,278 crore", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a Earnings \u203a Muthoot Finance Q2 cons profit jumps 36% YoY to Rs 3,278 crore Muthoot Finance Share Price Manappuram Finance Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Muthoot Finance Q2 cons profit jumps 36% YoY to Rs 3,278 crore SECTIONS Muthoot Finance Q2 cons profit jumps 36% YoY to Rs 3,278 crore By Atmadip Ray , ET Bureau Last Updated: Oct 31, 2026, 06:15:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Muthoot Finance reported a 36% year-on-year rise in consolidated net profit to Rs 3,278 crore in Q2, while assets under management grew 42% to Rs 2.09 lakh crore. However, standalone gross NPA ratio rose to 3.87% from 2.28% in the previous quarter, indicating a deterioration in asset quality\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "31 Oct 2026, 06:15 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Iran's Khamenei Orders Military To Expand US Retaliation Plans", "full_content": "Iran's Supreme Leader Mojtaba Khamenei ordered his top military commanders to prepare for renewed confrontation with the US and Israel and expand Tehran's options for retaliation.", "source": "NDTV Profit", "pub_date_str": "31 Oct 2026, 06:11 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Aditya Birla Lifestyle Brands Q2 Results: PAT More Than Doubles 126% To Rs 53 Crore, Revenue Rises 11%", "full_content": "Aditya Birla Lifestyle Brands reports its fourth consecutive quarter of double-digit revenue growth, with Q2 net profit rising 126% to Rs 53 crore and EBITDA increasing 15%.", "source": "NDTV Profit", "pub_date_str": "31 Oct 2026, 06:07 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Nvidia\u2019s Megaspeed ties show potential blind spots in the U.S. effort to block China from accessing advanced chips", "full_content": "Nvidia CEO Jensen Huang\u2019s business meetings are routine practice and existing U.S. export controls largely miss the cloud, experts say.", "source": "MarketWatch Top Stories", "pub_date_str": "31 Oct 2026, 06:00 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "NTPC Q2 FY27 slides show capacity growth, profit gains", "full_content": "", "source": "Investing.com News", "pub_date_str": "31 Oct 2026, 05:56 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Berkshire ekes out some new highs, but October rally stalls", "full_content": "(This is the Warren Buffett Watch newsletter, news and analysis on all things Warren Buffett and Berkshire Hathaway. You can sign up here to receive it every Friday evening in your inbox.)\n\nBerkshire Hathaway shares managed to set a few more all-time highs in an otherwise lackluster week of trading.\n\nThe Class A stock closed Monday at a record high $821,931 but ended the week up just 0.3% at $815,600.\n\nIt spiked at Friday's open to almost $822,929, but that wasn't enough to top its record intraday high of $824,765 set on Thursday of last week as Berkshire entirely erased what turned into a 15% pullback after Warren Buffett announced last year that he would step down as the company's CEO .\n\nThe more widely held Class B shares also set a new record high close on Monday, finishing that day at $548.56.\n\nBut their high during Friday's session of $550.47 is enough for a new all-time intraday record, edging out last Thursday's $549.96.\n\nDespite losing some steam this week, Berkshire shares are ending October with strong gains, especially when compared to the S&P 500 and the Nasdaq Composite .\n\nThe latter index lost 2.9% Friday, its worst one-day drop since June, as money moves away from high-flying AI and tech stocks over spending concerns.", "source": "CNBC Top News", "pub_date_str": "31 Oct 2026, 05:56 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "SEBI To Make Direct Mutual Funds Default From November 1: How Much Can You Save On A Rs 5,000 SIP?", "full_content": "For someone investing Rs 5,000 every month through a systematic investment plan (SIP), even a small difference in annual returns can add up to lakhs over 20 years.", "source": "NDTV Profit", "pub_date_str": "31 Oct 2026, 05:45 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Earnings call transcript: NTPC posts strong Q2 2026 growth as stock rises", "full_content": "", "source": "Investing.com News", "pub_date_str": "31 Oct 2026, 05:44 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "India extends cotton import duty exemption till December 31", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a India extends cotton import duty exemption till December 31 The Economic Times daily newspaper is available online now. Read Today's Paper India extends cotton import duty exemption till December 31 SECTIONS India extends cotton import duty exemption till December 31 By Anoushka Sawhney , ET Bureau Last Updated: Oct 31, 2026, 05:40:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Indian government has extended the customs duty exemption on cotton imports to December 31. This decision aims to support the textile industry by ensuring adequate raw material availability. The waiver allows greater flexibility for manufacturers to source inputs at reduced costs. Domestic cotton prices have remained firm due to production concerns, prompting this extension. The move is expected to strengthen Indian texti PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Bitcoin holds above $77,000 as FBI joins hunt for $6.3 billion Binance hackers", "full_content": "", "source": "Investing.com News", "pub_date_str": "31 Oct 2026, 05:18 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "RBI digital fraud new rules Jan 1, 2027: How much compensation can you claim? Check complaint filing deadline", "full_content": "Digital frauds have become quite common in India, with scammers using tactics such as fake customer care numbers, phishing links, fraudulent investment schemes and impersonation calls to trick people, mostly senior citizens, into transferring money or sharing sensitive banking details.\n\nIn many cases, victims realise they have been scammed only after money has been debited from their bank accounts, leaving them to navigate the process of reporting the fraud and seeking a refund.\n\nHowever, under new rules mandated by the Reserve Bank of India (RBI) you may no longer have to bear the entire loss from digital fraud. Victims can receive compensation of up to 85% of their net loss or \u20b9 25,000, whichever is lower.\n\nThe new rules will come into effect on January 1, 2027, and remain in force for one year. The RBI has also shifted the burden of proving customer liability in complaints involving fraudulent electronic banking transfers (EBTs) to banks.\n\nIn this case, EBTs would include transactions like point of sale (POS) transfers, automated teller machine transactions, direct deposits or withdrawal of funds, transfers initiated by telephone, internet and card payment.\n\nIndians have lost around \u20b9 52,976 crore to cyber-enabled frauds over the past six years, with nearly 8% of the losses linked to \u201c digital arrest \u201d scams, the National Human Rights Commission (NHRC) said on June 10, 2026.\n\nAs per RBI's directions, digital fraud victims will be eligible for a compensation of up to \u20b9 25,000, provided the value of the fraudulent transaction does not exceed \u20b9 50,000. The benefit is available only once during a customer's lifetime.\n\nHowever, citizens must note that the compensation is not a flat \u20b9 25,000. Eligible customers can receive 85% of the net loss, after deducting any amount already recovered, or \u20b9 25,000, whichever is lower.", "source": "LiveMint Money", "pub_date_str": "31 Oct 2026, 05:18 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "NTPC Q2 results 2026 brings good news of 1st interim dividend for investors! Check amount, record date, profit details", "full_content": "DIVIDEND Sharmila Bhadoria Published 31 Oct 2026, 05:12 PM IST Prefer Livemint on Google NTPC 1st interim dividend : State-owned NTPC Limited reported a 38.7% year-on-year jump in its consolidated net profit (attributable to owners of the company) to \u20b9 7,029.56 crore for the second quarter of financial year 2026-27. Besides Q2 results, the Maharatna PSU announced its first interim dividend for FY27.\n\nNTPC share price closed 2.23% higher at \u20b9 316 per share on BSE with a market capitalisation of \u20b9 3,06,414.65 crore on Friday, October 30. Here are all the details to know about NTPC Q2 result\n\nThe company\u2019s board of directors, on Saturday, declared an interim dividend at the rate of 30% on the face value of \u20b9 10 each for FY27. This is the first interim dividend announced by the PSU for the current financial year. The board has also fixed a record date for the payout to fix eligibility of shareholders for the corporate action.\n\nNTPC\u2019s board fixed November 6 as the record date to determine the eligibility of shareholders for the payout. The dividend is expected to be paid within the statutory period starting from November 25, 2026 onwards, as per the BSE filing.\n\nNTPC Limited reported a 38.7% annual jump in its net profit to \u20b9 7,029.56 crore for the September quarter of FY27, its net profit stood at \u20b9 5,066.78 crore reported in the year ago period.\n\nIts net consolidated revenue from operations surged by 21.2% to \u20b9 54,269.95 crore from \u20b9 44,784.05 crore a year earlier. Its total income increased to \u20b9 54,715.69 crore from \u20b9 45,262.10 crore.\n\nWhereas, its total expenses increased to \u20b9 48,059.30 crore during the quarter under review from \u20b9 40,218.03 crore. Its fuel cost surged to \u20b9 28,628.19 crore from \u20b9 23,062.34 crore during the same period.\n\nThe stock closed 2.23% higher at \u20b9 316 per share on BSE with a market capitalisation of \u20b9 3,06,414.65 crore on Friday.", "source": "LiveMint Markets", "pub_date_str": "31 Oct 2026, 05:12 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "NTPC Q2 Results: Standalone profit rises 14% YoY to Rs 5,320 crore; revenue up 17%", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a Earnings \u203a NTPC Q2 Results: Standalone profit rises 14% YoY to Rs 5,320 crore; revenue up 17% NTPC Share Price Adani Power Share Price JSW Energy Share Price NLC India Share Price KEC International Share Price The Economic Times daily newspaper is available online now. Read Today's Pape     function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>

</body>
</html>
