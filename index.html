 yield on the 10-year Treasury note is rising to levels not seen in years. But it's not necessarily the outright level that's most concerning for those on Wall Street, it's the speed of the move.\n\nWhen rates climb at such a rapid pace, history tells them something bad tends to happen.\n\nThe 10-year yield saw its most rapid one-day increase since April 7, 2025, on Wednesday, rising further on Thursday to top 5.17%, quite a move considering two weeks ago it was below 4.8% and at one point in August, it was below 4.6%.\n\n\"Something always breaks,\" proclaimed a recent note from John Roque, head of technical analysis at 22V Research.\n\nU.S. 10-year Treasury yield, 3 months Roque pointed out on a chart of the 10-year Treasury yield going back the last five decades 16 instances where it experienced a rapid advance like it is now. During each and every move, some sort of financial calamity resulted. While the scale of the crises varied in their market impact (from the jarring-but-short-lived Silicon Valley Bank failure of 2023 to the 1987 stock market crash), the jump in yields almost always led to some sort of disruption to financial markets that weighed on risk assets.\n\n\"As sure as day follows night, when the 10-year Treasury yield rises, something gets knocked out,\" Roque remarked to CNBC. \"It just pays to be cautious.\"\n\nThe 10-year Treasury yield is a benchmark for borrowing costs across the economy. Everything from mortgage rates to sophisticated hedge fund trades can become contingent on a stable 10-year yield. When it soars quickly, it can unravel risky plans by companies or investors that were counting on a stable borrowing rate.\n\nWhat will crack this time around? It's usually not evident until it is too late and it is not always directly related to borrowing costs on the surface. The Dotcom Bubble burst was because of a multitude of reasons, mostly unrealistic valuations for many tech businesses earning zero profits. But higher rates played their p est level since Mario Draghi's 2012 \"Whatever it Takes\" speech.\n\nThursday's move follows a sharp selloff on Wednesday when benchmark 10-year yields posted their largest daily increase since the April 2025 tariff turmoil. That was driven in part by stronger-than-expected US business activity data, which showed prices paid surged to a nearly four-year high this month.", "source": "LiveMint Markets", "pub_date_str": "25 Sep 2026, 02:37 AM IST", "pub_date_relative": "4m ago", "cfa_topics": ["Economics", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "History shows financial calamities occur when rates rise rapidly like this: 'Something always breaks'", "full_content": "The yield on the 10-year Treasury note is rising to levels not seen in years. But it's not necessarily the outright level that's most concerning for those on Wall Street, it's the speed of the move.\n\nWhen rates climb at such a rapid pace, history tells them something bad tends to happen.\n\nThe 10-year yield saw its most rapid one-day increase since April 7, 2025, on Wednesday, rising further on Thursday to top 5.17%, quite a move considering two weeks ago it was below 4.8% and at one point in August, it was below 4.6%.\n\n\"Something always breaks,\" proclaimed a recent note from John Roque, head of technical analysis at 22V Research.\n\nU.S. 10-year Treasury yield, 3 months Roque pointed out on a chart of the 10-year Treasury yield going back the last five decades 16 instances where it experienced a rapid advance like it is now. During each and every move, some sort of financial calamity resulted. While the scale of the crises varied in their market impact (from the jarring-but-short-lived Silicon Valley Bank failure of 2023 to the 1987 stock market crash), the jump in yields almost always led to some sort of disruption to financial markets that weighed on risk assets.\n\n\"As sure as day follows night, when the 10-year Treasury yield rises, something gets knocked out,\" Roque remarked to CNBC. \"It just pays to be cautious.\"\n\nThe 10-year Treasury yield is a benchmark for borrowing costs across the economy. Everything from mortgage rates to sophisticated hedge fund trades can become contingent on a stable 10-year yield. When it soars quickly, it can unravel risky plans by companies or investors that were counting on a stable borrowing rate.\n\nWhat will crack this time around? It's usually not evident until it is too late and it is not always directly related to borrowing costs on the surface. The Dotcom Bubble burst was because of a multitude of reasons, mostly unrealistic valuations for many tech businesses earning zero profits. But higher rates played their part.", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 02:27 AM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Equity Investments", "Fixed Income", "Alternative Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Costco earnings beat expectations, thanks to tariff refunds", "full_content": "Tariff refunds helped deliver a profit beat during Costco\u2019s fourth quarter.", "source": "MarketWatch Top Stories", "pub_date_str": "25 Sep 2026, 02:24 AM IST", "pub_date_relative": "18m ago", "cfa_topics": ["Economics", "Financial Statement Analysis"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Here\u2019s how to position your portfolio for the next AI wave, according to Morgan Stanley", "full_content": "There\u2019s still room for AI hardware stocks to rise, but analysts at Morgan Stanley say it\u2019s time to diversify into a wide variety of industries that are starting to realize AI benefits.", "source": "MarketWatch Top Stories", "pub_date_str": "25 Sep 2026, 02:20 AM IST" ghs.\n\nThursday's moves build on a U.S. Treasury rout that took place Wednesday. The 10-year Treasury yield had its biggest one-day jump since April 7, 2025 as traders reacted to stronger-than-expected U.S. economic data, hawkish commentary from a Federal Reserve official and high oil prices.\n\n\"The combination of fiscal, economic, geopolitical, and supply-side inflation pressures converging has bond markets in less familiar territory. The recent rise in yields can no longer be attributed simply to concerns over the deficit,\" said from Mike Sanders, head of fixed income at Madison Investments.\n\nThe data drove expectations of more rate hikes, with traders last pricing in a more-than-75 % chance that the Federal Open Market Committee will increase rates again at its October meeting, per the CME Group's FedWatch tool . That compares to a roughly 49% probability just a week ago.\n\n\"With markets pricing in four rate hikes through next year, the Fed is being pushed toward tighter policy at a time when the risk of a policy mistake is rising,\" he added.", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 01:55 AM IST", "pub_date_relative": "47m ago", "cfa_topics": ["Quantitative Methods", "Economics", "Equity Investments", "Fixed Income", "Portfolio Management"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "Stop trying to beat the market: Even the richest Americans can\u2019t do it consistently", "full_content": "The 400 richest Americans would collectively have performed better over the past 12 months had they invested their net worths in an S&P 500 index fund.", "source": "MarketWatch Top Stories", "pub_date_str": "25 Sep 2026, 01:50 AM IST", "pub_date_relative": "52m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Bond yields surge to fresh two-decade highs but oil prices buffeted by Iran r from billionaire Tilman Fertitta to acquire the casino company for $17.6 billion. Caesars shareholders will receive $31 per share in cash.", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 01:41 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "US stocks: S&P 500 ends nearly flat as US-Iran talks help stocks pare losses", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a US stocks: S&P 500 ends nearly flat as US-Iran talks help stocks pare losses Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US stocks: S&P 500 ends nearly flat as US-Iran talks help stocks pare losses SECTIONS US stocks: S&P 500 ends nearly flat as US-Iran talks help stocks pare losses ETMarkets.com Last Updated: Sep 25, 2026, 01:43:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis S&P 500 ended almost flat as Microsoft declined, while Meta Platforms recorded gains amid ongoing market fluctuations. Oil prices surged following geopolitical tensions and a missile attack on Saudi Arabia, raising supply concerns. Treasury yields also increased, with the 30-year bond yield reaching its highest level since 2004. Traders anticipate a significant chance of another Federal Reserve interest rate hike based on recent business activity data.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic T nvironmental groups. The site has also faced delays with the buildout of a natural gas pipeline intended to fuel the facility.", "source": "CNBC World Economy", "pub_date_str": "25 Sep 2026, 01:30 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Pete Hegseth reports at least $3.1 million in cash, investments and bitcoin", "full_content": "Defense Secretary Pete Hegseth reported at least $3.1 million in cash, retirement investments and bitcoin in his newly released 2025 annual financial disclosure , including more than $1 million in cash held in a single bank account.\n\nThe Office of Government Ethics filing provides the latest look at the finances of the former firebrand Fox News host, who was confirmed as defense secretary in January 2025. Hegseth is facing calls to be impeached from members of his own party related to his handling of the war in Iran .\n\nThe disclosure lists five retirement accounts containing investments worth roughly $2.05 million to $4.35 million. Hegseth's three accounts accounted for about $500,000 to $1.25 million of that total, while his wife, Jennifer Hegseth, reported roughly $1.55 million to $3.1 million in two rollover IRAs.\n\nThe household also reported three cash accounts, including one worth more than $1 million, and bitcoin valued at between roughly $16,000 and $65,000.\n\nBecause financial disclosures report assets in broad ranges rather than exact amounts, it is not possible to determine whether Hegseth\u2019s total wealth increased or decreased from a year earlier. His December 2024 nominee disclosure listed roughly $1.4 million to $3.4 million in financial assets. His new filing shows at least $3.1 million, but no comparable upper limit because one bank account is reported only as \"worth more than $1 million.\"\n\nThe clearest change is in cash. In Hegseth's 2024 filing, an account listed as \"U.S. bank #2\" held between $15,001 and $50,000.", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 01:27 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Bond yields keep rising. How income investors can best take advantage of the moves", "full_content": "As Treasury yields reach multiyear highs, income investors should employ these winning moves.", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 01:21 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "KFC debuts Open House restaurant in Texas to test new customer experiences", "full_content": "KFC is debuting a restaurant concept, Open House, where it will test new offerings such as breakfast, late-night and table service, the company said in a release Thursday .\n\nExpanded menu offerings include breakfast items \u2014 a first for KFC \u2014 such as breakfast sandwiches, mini cronuts and hot and iced coffee. There will also be beverages, including boba refreshers, and new sides such as fried green beans and spicy pickles. Table service will be available, in addition to dual drive-thru lanes and self-ordering kiosks.\n\nThe brand will use the space to identify ideas for implementation in restaurants nationwide, particularly as it works to regain its market share .\n\n\"It gives guests a reason to try us, or try us again, while giving us a real restaurant where we can learn what works for guests, our teams and the business, and scale the strongest ideas across the system,\" Catherine Tan-Gillespie, president of KFC U.S., said in a news release.\n\nThe 3,400-square-foot space will open Sept. 26 in McKinney, Texas, with a celebration planned for Sunday.\n\nOpen House comes with broader rebranding effort from KFC, part of Yum Brands . The fast-food chain recently announced changes such as emphasizing boneless chicken and expanding sauce choices.\n\nThose initiatives come as the company adjusts to competition from other fast-food chicken chains . In August, QSR Magazine reported that KFC ranked fifth among U.S. fast-food chicken chains in sales, behind Chick-fil-A, Popeyes, Raising Cane's and Wingstop.\n\nIn Yum Brands' second-quarter earnings report, KFC saw a same-store sales growth rate of 2% . Its largest market is in China, where sales rose 6% in that period.", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 01:17 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "White House allows blocked reporters in after judge lifts Trump ban", "full_content": "The White House on Thursday began readmitting journalists from three media outlets \u2014 MS NOW, CNN and Politico \u2014 after a federal judge temporarily lifted President Donald Trump 's ban on those outlets.\n\nThe move came after Secret Service officers initially barred some journalists from those outlets from entering the White House earlier Thursday despite the order by Judge Timothy Kelly .\n\nKelly ordered Trump and other defendants in a lawsuit by the outlets reply to their new court filing notifying him of non-compliance with his temporary restraining order against the president's ban .\n\nThe White House's director of operations responded to Kelly with a declaration that said the White House had restored press passes to the affected outlets. The outlets by that time had begun reporting that their journalists were being admitted to the White House.\n\nKelly issued his restraining order, which will last for at least 14 days, late Wednesday night. It directed the White House to \"immediately\" restore access to the three outlets.\n\nThe outlets had been blocked from entering the White House since Saturday, a day after Trump announced his ban.\n\nThe president had initially said he was blocking the outlets from the White House because of \"cumulative stories\" that contained lies about him and his administration.\n\nThe outlets in their civil complaint said that statement by Trump, and subsequent ones, bolstered their claim that he was violating their First Amendment rights to a free press by targeting them for what they reported about him.", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 01:16 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Iran War Updates: Oil prices back up as U.S. and Iran trade fresh threats to expand 7-month war - CBS News", "full_content": "Iran War Updates: Oil prices back up as U.S. and Iran trade fresh threats to expand 7-month war CBS News Oil Futures Post Back-to-Back Gains on Escalation Concerns Barron's Oil Prices Jump on Houthi Attacks, U.S.-Iran Escalation Fears WSJ Oil prices see-saw, as markets weigh Trump\u2019s UN speech, potential Saudi pipeline fix NBC News Oil prices rise above $106 as Iran-U.S. diplomacy stalls at UN Yahoo Finance", "source": "Google News Business", "pub_date_str": "25 Sep 2026, 01:13 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Mutual fund inflows over 1 year: Which equity, debt and hybrid categories attracted money despite being in the red?", "full_content": "Mutual fund flows over the last 12 months show a mixed picture across equity, debt, and hybrid categories. Some categories attracted substantial money despite negative returns, while others saw outflows even after delivering positive returns.&nbsp;", "source": "LiveMint Money", "pub_date_str": "25 Sep 2026, 01:12 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Companies keep raising prices. The Fed is trying to get them to reconsider.", "full_content": "Inflation pressures have been so persistent this year in part because businesses have been able to pass along higher prices to consumers.", "source": "MarketWatch Top Stories", "pub_date_str": "25 Sep 2026, 01:12 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}], "updated_at": "25 Sep 2026, 02:42 AM IST", "total_stories": 391};

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>

</body>
</html>
