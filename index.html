igious, invitation-only object of desire. The bank has said that in the future, this card will be only for customers who either spend a lot or have a large \u2018relationship value\u2019 with it. Everyone else's cards will be closed or downgraded.\n\nThe response has been extraordinary: X threads of hundreds of messages, screenshots of relationship managers' emails circulated as evidence, talk of complaints to the Reserve Bank of India (RBI) and consumer forums.\n\nTo be fair, some of that anger is justified. If (and I don't know for a fact if this is true) a bank collects an annual fee and then, before the year is over, tells customers they don't deserve to be members, then it has taken money for a promise it has since withdrawn, and asking a regulator to take a view is fair.\n\nBut what has amazed me is the sheer quality and intensity of the effort going into the matter. If you read the threads, you will find a standard of work worthy of a good investment research team. People have created Excel spreadsheets to track their spending. They know which categories are counted, how settlements can push a transaction into the next financial year. They have read all the fine print and understood it. This is sustained, numerate analytical work on a question that matters intensely to them.\n\nAsk one of these people what the expense ratio on their mutual fund is, or how their portfolio is split between equity and fixed income. I've done such experiments, and I know the answer.\n\nThis asymmetry isn't foolishness or laziness. A credit card programme is designed as a game that produces immediate rewards.", "source": "LiveMint Money", "pub_date_str": "20 Sep 2026, 07:00 AM IST", "pub_date_relative": "3m ago", "cfa_topics": ["Fixed Income", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "UNC endowment returns 37.8% fueled by early SpaceX investment", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Sep 2026, 06:14 AM IST", "pub_date_relative": "49m ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Pfizer to share overseas drug revenue with HHS under pricing deal", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Sep 2026, 05:28 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "80-year-old discount fashion chain closing 120 stores", "full_content": "Skip to navigation Skip to main content Skip to right column 80-year-old discount fashion chain closing 120 stores Daniel Kline Sat, September 19, 2026 at 7:02 PM EDT 5 min read TJX Pricing alone does not decide where people buy their clothes.\n\nWith a number of retail chains competing for the off-price, on-trend fashion crown, it's easy for one brand to fall out of favor. Consumers seem to have an enduring love for Marshalls and TJ Maxx, while the popularity of Ross Dress for Less has grown steadily in recent years.\n\nThese brands drive sales by foot traffic, and that's a battle the aforementioned chains have been winning.\n\n\"Off-price apparel remained on solid footing in Q2 2026, with Ross leading the segment. Visits to Ross Dress for Less rose 16.4% year over year (YoY), while dd's DISCOUNTS grew 8.4%. TJX's TJ Maxx and Marshalls, meanwhile, saw visits hover around last year's levels \u2014 significantly outperforming traditional apparel, which declined 3.5% YoY,\" according to data from Placer.ai .\n\nIn the battle for customers looking for deals on trendy, fashionable clothes, Cato has been struggling, and now plans to close about 15% of its retail stores.\n\nThe Cato Corporation reported net income of $1.1 million in the second quarter, compared to net income of $6.8 million for the second quarter, which ended Aug. 2, 2025.\n\nSales for the second quarter 2026 were $163.9 million, or a decrease of 6% from sales of $174.7 million for the second quarter ended Aug. 2, 2025, primarily due to a 3.7% same-store sales decrease for the quarter compared to 2025.\n\n\"Our results in the quarter are in large part due to the continued pressure on our customers' discretionary income, which is being negatively impacted in part by persistent inflation, higher fuel prices and continued elevated interest rates,\" CEO John Cato said in the earnings release.", "source": "Yahoo Finance", "pub_date_str": "20 Sep 2026, 04:32 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Financial Statement Analysis"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Flames, smoke seen near Riyadh airport; Houthis claim attacks on Saudi capital", "full_content": "Yemen's Houthis said they attacked \"sensitive\" sites in the Saudi capital Riyadh on Saturday with missiles and drones, hours after flames and a large plume of smoke were seen near the city's main airport.\n\nSaudi Arabia had sent alerts overnight warning of potential danger around Riyadh, amid an escalation in attacks by the Houthis in the kingdom.\n\nLate in the day, U.S. embassies in Jerusalem, Oman, and Iraq issued security alerts for American nationals in the Middle East because of heightened tensions and the potential for unforeseen escalation.\n\nReuters video and photographs showed a huge pillar of black smoke rising in the area, with the airport highway, main terminal building and other facilities in the foreground. At one point in the video, flames were visible rising from behind what appeared to be fuel tanks.\n\nThe Houthis did not specify what they had targeted in Riyadh, but said they had also attacked an Aramco facility in the Red Sea city of Yanbu, a key Saudi oil export hub.\n\nThe Houthis said the operation came as a response to an attack in the Yemeni capital Sanaa.\n\nThe Saudi-led military coalition fighting the Houthis said its air defenses had destroyed a missile fired by the Yemeni group toward Riyadh early on Saturday.\n\nIn a statement, the coalition also said it had foiled attacks targeting civilians in the Saudi cities of Bish and Farasan in the southwest and Taif in the west, as well as Yanbu on the Red Sea coast. It did not say whether there was any damage.", "source": "CNBC Top News", "pub_date_str": "20 Sep 2026, 03:43 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Treasury yields are blowing up CBO forecasts, and experts who downplayed US debt fears are worried - Fortune", "full_content": "Treasury yields are blowing up CBO forecasts, and experts who downplayed US debt fears are worried Fortune Markets are waking up to the rich world\u2019s reckless borrowing The Economist 5% Bond Yields A Wealth of Common Sense 2-Year Yield Hits Highest Level Since 2024 WSJ Treasury yields move higher as volatile week wraps up CNBC", "source": "Google News Business", "pub_date_str": "20 Sep 2026, 01:01 AM IST", "pub_date_relative": "6h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Price range, ready-to-move or under construction, 1, 2, or 3BHK \u2014 Check here for what homebuyers prefer", "full_content": "Demand for housing in India is \u201cresilient\u201d, with sales buoyant throughout 2026, data from Colliers' latest report, titled 'Homebuying Sentiment Survey 2026: Decoding India's Evolving Buyer Preferences' showed.\n\nThe report indicated that while homebuyers are becoming increasingly price-sensitive and selective, \u201ctheir willingness to purchase remains largely intact, supported by long-term homeownership aspirations and confidence in the residential market\u201d.\n\nIt also pointed to the upcoming festive season as holding immense potential to add further momentum to housing sales across major residential markets of the country. The study drew insights from around 1,800 respondents across 30+ established and emerging residential markets in India, it added.\n\n\u201cIndia\u2019s residential market remains fundamentally end-user driven, but the path from purchase intent to actual conversion is becoming increasingly nuanced. Prospective homebuyers are becoming more price-sensitive, risk-averse and selective in purchase decisions.", "source": "LiveMint Money", "pub_date_str": "20 Sep 2026, 12:12 AM IST", "pub_date_relative": "6h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "MS NOW, CNN and Politico journalists blocked from White House after Trump ban", "full_content": "Journalists from MS NOW, CNN and Politico were denied access to the White House grounds on Saturday, one day after President Donald Trump said he is banning the three outlets over their coverage of him.\n\nWhite House reporter Akayla Gardner said MS NOW journalists were blocked from the grounds for the first time Saturday morning.\n\n\"Yesterday our journalists were able to stay here working on the White House grounds,\" she said. \"This was the first action we know of them actually denying us entry into the White House.\"\n\n\"The White House belongs to the American people and the decisions made inside are funded by our tax dollars,\" MS NOW said in a statement. \"MS NOW intends to take any and all steps necessary to defend our First Amendment rights and the essential role of independent journalism in our democracy.\" MS NOW said it will \"continue to report on the President, the administration, and the issues that impact the American people.\"\n\nCNN reported later Saturday that its journalists were denied access to the White House.\n\n\"CNN's mission to report on the U.S. government will continue regardless of any attempts to restrict physical access to the White House and other government buildings, or any other attempts to impede our journalism,\" CNN said in a statement. \"We have a right under the U.S. Constitution to do our reporting without hindrance or interference from the government and this ban is an illegal assault under that right.\"\n\nThe news organization reiterated it \"stands fully behind our White House team.\"\n\nPolitico's editor-in-chief, Jonathan Greenberger, emailed the newsroom: \" A few minutes ago, our colleague Cheyenne Haslett attempted to enter the White House to do her job as a POLITICO reporter. Secret Service denied her entry to the complex and confiscated the pass that allows her access to the White House. We stand by her and all reporters here covering the White House. As we said yesterday, we will vigorously defend our First Amendment rights.\"", "source": "CNBC Top News", "pub_date_str": "19 Sep 2026, 11:42 PM IST", "pub_date_relative": "7h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "West Asia crisis: National Highways Builders Federation seeks 3-month extension of road relief measures", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Infrastructure \u203a West Asia crisis: National Highways Builders Federation seeks 3-month extension of road relief measures The Economic Times daily newspaper is available online now. Read Today's Paper West Asia crisis: National Highways Builders Federation seeks 3-month extension of road relief measures SECTIONS West Asia crisis: National Highways Builders Federation seeks     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
