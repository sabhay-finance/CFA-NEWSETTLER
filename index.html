n India's capital markets. The brokerage believes the exchange's competitive moat, improving market participation and potential growth from emerging business segments could support its earnings trajectory.\n\nNuvama said NSE's three-decade-long presence has created a strong liquidity moat that continues to reinforce its market leadership. The exchange commanded around 93% of the cash market, nearly 100% of equity futures and approximately 68% of options premium turnover value (PTV) as of H1 FY27.\n\nAccording to the brokerage, this market depth makes NSE the preferred trading venue for brokers, foreign portfolio investors (FPIs), market makers and algorithmic traders. Its cash market share has remained around 93% through FY20\u2013FY26, even after the introduction of market interoperability in 2019, while its equity futures market share is close to 100%.\n\nNuvama noted that NSE's options franchise is also more diversified than that of its rival BSE. The exchange held around 68% of index options premium as of Q2 FY27, while BSE's gains in the segment remain more concentrated around its own expiry day.\n\nThe brokerage believes several regulatory challenges facing the derivatives business have already been factored into the market outlook.", "source": "LiveMint Markets", "pub_date_str": "12 Nov 2026, 01:46 PM IST", "pub_date_relative": "12m ago"}, {"title": "GFPT Q3 2026 presentation: profit rises despite margin squeeze", "full_content": "", "source": "Investing.com News", "pub_date_str": "12 Nov 2026, 01:46 PM IST", "pub_date_relative": "12m ago"}, {"title": "Nasdaq-100 futures slide, dragged lower as Nvidia sell-off resumes: Live updates", "full_content": "Nasdaq-100 futures fell early Thursday as Nvidia shares slid on a report that the chip giant's board is preparing to unseat CEO Jensen Huang .\n\nFutures tied to the tech-heavy Nasdaq-100 lost 0.97 %, while S&P 500 futures fell 0.37%. Dow Jones Industrial Average futures rose 0.15%.\n\nIn Asia, Japan's Nikkei 225 cord high helped by strong earnings and lower energy prices", "full_content": "", "source": "Investing.com News", "pub_date_str": "12 Nov 2026, 01:42 PM IST", "pub_date_relative": "16m ago"}, {"title": "Nvidia shares tumble in after-market trading", "full_content": "Stock sinks almost 9 per cent after-market as chief executive\u2019s fate hangs in balance following more revelations", "source": "FT Markets", "pub_date_str": "12 Nov 2026, 01:40 PM IST", "pub_date_relative": "18m ago"}, {"title": "Up 118% from 52-week low, Rolex Rings hits year-high! Is the small-cap stock still a good buy? Check target, rationale", "full_content": "Pranati Deva Published 12 Nov 2026, 01:35 PM IST Prefer Livemint on Google Rolex Rings share price : A small-cap auto component stock that spent years delivering muted revenue growth is now attracting fresh investor attention after a sharp rally, stronger quarterly earnings and a bullish brokerage initiation. Rolex Rings shares climbed around 4% to a fresh 52-week high of \u20b9 216.55 on Thursday, November 12, taking their one-year gains to 86%.\n\nThe company has also reported a 67.5% jump in September-quarter net profit, while experts also have an optimistic outlook on the stock.\n\nThe brokerage believes the company is entering a new operating upcycle, backed by recovering export demand, European business opportunities and improving domestic demand. But after the stock's sharp run-up, how much further upside does the brokerage see?\n\nRolex Rings shares rose around 4% in Thursday's trading session to touch a 52-week high of \u20b9 216.55 apiece. The stock has surged 116% from its 52-week low of \u20b9 99.30, recorded in November 2025.\n\nThe small-cap stock has delivered strong returns across timeframes, gaining 23% over the past month and 23% in three months. Its six-month returns stood at 45%, while it has advanced 86% over the past year.\n\nRolex Rings reported revenue from operations of \u20b9 389 crore in Q2 FY27 , marking a 43.4% lore investment opportunities: CII President to industry SECTIONS Use FTAs to build joint ventures, explore investment opportunities: CII President to industry PTI Last Updated: Nov 12, 2026, 01:21:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis R Mukundan, the CII President, stressed the crucial role of Free Trade Agreements (FTAs) in fostering joint ventures and enhancing investment prospects. He noted India's resilient economic growth, even faced with global challenges like geopolitical tensions and elevated energy prices. The broadened scope of India's FTAs promises to enrich economic interactions and spur advancements in emerging technologies such as AI and biotechnology.\n\nBusiness of Odd Things: The farm that needs no land, freshwater, or fertiliser\n\nKYC and KYB: Inside Pidilite, the company that turned Fevicol into a word for a strong bond \u2013 Part 1 of 3\n\nSeoul halts trading, Nifty has its best week since 2021: Money leaving the AI trade \u2013 will it land in India?\n\nJunk bonds are cracking at the bottom. Will the noise get loud enough to make \u2018junk bond\u2019 a household term again?\n\nPNG connections rise half a million, but how many use piped gas for cooking?\n\nSome elections matter more than you know: No crop changed in the fields, yet sugar, coffee and soya got cheaper in a day\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "12 Nov 2026, 01:21 PM IST", "pub_date_relative": "38m ago"}, {"title": "Jensen Huang's affair with alleged spy revives push to tighten China chip curbs ahead of Trump-Xi summit", "full_content": "The scandal engulfing Nvidia Corp CEO Jensen Huang is bolstering the case for U.S. lawmakers seeking tighter restrictions on China's access to advanced AI chips, just days before President Donald Trump 's planned meeting with Xi Jinping next week.\n\nThe U.S. and China are locked in a race to achieve global AI supremacy, with Washington spending years restricting China's access to Nvidia's most advanced chips to slow its technological progress. Huang was among the loudest voices opposing U.S. strict export controls on advanced chips to China, which has irked some China hawks.\n\nThe alleged affair with Alice Huang, a Chinese citizen who is not related to him and was reportedly recruited by Chinese intelligence to gather information, has given lawmakers fresh ammunition to push for the inclusion of a series of chip-control measures in this year's National Defense Authorization Act (NDAA).\n\nThe bills include the AI Overwatch Act, the Chip Security Act and the MATCH Act \u2013 all of which are aimed at limiting the flow of advanced chips to U.S. adversaries, particularly China.\n\nHuang had been \"the industry's most effective lobbyist against tighter rules,\" said David Meale, head of Eurasia Group's China practice and an American diplomat who served as deputy chief of mission at the U.S. embassy in Beijing.\n\nBut the scandal has weakened Nvidia's \"singular ability to slow the progress of those bills\" \u2014 which were stalled by pushback from corporates and the White House\u2014 and made it \"politically harder for negotiators to strip chip provisions out of this year's NDAA,\" Meale said.\n\nSenate Democratic leader Chuck Schumer on Tuesday called on Congress to pass these bills and urged a full accounting of Trump's defense of Huang.", "source": "CNBC World Economy", "pub_date_str": "12 Nov 2026, 01:20 PM IST", "pub_date_relative": "38m ago"}, {"title": "Best fixed deposit rates, 11 Nov 2026: Earn up to 8.25%; check FD returns of top 5 small finance, private, public banks", "full_content": "The Reserve Bank of India ( RBI ) increased the benchmark repo rate by 25 basis points to 5.50% on 7 October, its first rate hike since February 2023. Following the policy change, fixed deposit (FD) interest rates have come into focus as banks adjust their deposit offerings to attract investors.\n\nFor depositors looking to lock in their savings, small finance banks, private sector banks and public sector banks offer different interest rates across tenures. As of 11 November, Suryoday Small Finance Bank offers the highest FD interest rate of 8.25% among the banks.\n\nHere are five banks offering the highest FD rates in each category, along with their rates for one-year, three-year, and five-year deposits.\n\nSource: Paisabazaar; As of 11 November 2026; FD interest rates for regular customers.\n\nSuryoday Small Finance Bank leads the category with an 8.25% interest rate on five-year deposits. Utkarsh Small Finance Bank and Ujjivan Small Finance Bank follow with maximum rates of 8.10%, although their highest-paying tenures differ.\n\nShivalik Small Finance Bank offers 7.50% on three-year deposits, while Equitas Small Finance Bank offers up to 8% on its Maxima FD product.\n\nSource: Paisabazaar; As of 11 November 2026; FD interest rates for regular customers.\n\nAmong private-sector banks, DCB Bank offers the highest rate of 7.75% for deposits with tenures of 17 and 20 months. SBM Bank follows with 7.65% for deposits in its specified tenure slab.", "source": "LiveMint Money", "pub_date_str": "12 Nov 2026, 01:19 PM IST", "pub_date_relative": "39m ago"}, {"title": "Nashik Lift Accident Caught On Camera: Elevator Collapses At Sunshine Apartment In Satpur", "full_content": "Questions are being raised about whether the incident was caused by a technical fault and whether the lift was undergoing regular maintenance.", "source": "NDTV Profit", "pub_date_str": "12 Nov 2026, 01:18 PM IST", "pub_date_relative": "40m ago"}, {"title": "Penny stock under \u20b910: Orient Green Power shares rise 4.50% after Q2 Results 2026 | Do you own?", "full_content": "Asit Manohar Published 12 Nov 2026, 01:17 PM IST Prefer Livemint on Google e Penny stock under \u20b9 10 | Q2 Results 2026: Shares of Orient Green Power Company Ltd witnessed strong buying interest during the Opening Bell on Thursday session. The penny stock under \u20b9 10 opened higher at \u20b9 9.42 per share on the NSE and touched an intraday high of \u20b9 9.75 per share within a few minutes of the Opening Bell, logging an intraday rise of 4.50% against the previous ay's close of \u20b9 9.32 per share. However, the penny stock failed to sustain at higher levels after the profit-booking trigger and retraced from the intraday high. By 12:45 PM, Orient Green Power Company share price was trading around \u20b9 9.40 apiece, nearly one per cent above the previous day's close.\n\nThe company came under the radar of Dalal Street bulls after the announcement of Q2 Results 2026 and H-1 FY27 earnings during the Thursday morning dealings.\n\nThe penny stock under \u20b9 10 with a market cap of \u20b9 1,100 crore and a P/E ratio of around 17, declared a strong second-quarter number for the financial year 2026-27.\n\nDuring the July to September 2026 quarter, the company posted 8% YoY growth in the total income to \u20b9 147 crore. The company's EBITDA grew 12% YoY to \u20b9 117 crore.\n\nOn account of Capacity additions and improved credit ratings, which helped sustain the same, the company posted H1 FY27 profit of \u20b9 100 crore+ this year without the \u20b9 16 crore one-time gain of last year.\n\nImproved wind conditions during the quarter, coupled with incremental generation from recently commissioned capacities, offset the previous quarter\u2019s deficit, leading to a marginal surplus.\n\nRevenues and EBITDA for the half year were marginally better by 2% YoY and 4% YoY, respectively.", "source": "LiveMint Markets", "pub_date_str": "12 Nov 2026, 01:17 PM IST", "pub_date_relative": "42m ago"}, {"title": "Stock Market Today: Sensex, Nifty 50 Trade Flat; Financials Lead, M&M, Nestle, PowerGrid Top Drags", "full_content": "Among sectors, Nifty Realty, Nifty Private Bank, Nifty Metals and Nifty Media led gains, while losses were seen in Nifty IT and Nifty Pharma indices.", "source": "NDTV Profit", "pub_date_str": "12 Nov 2026, 01:17 PM IST", "pub_date_relative": "42m ago"}, {"title": "Over 16,000% Return In 5 Years: This Condom Maker Rallies 10%, Hits Record High; Is There More Steam Left?", "full_content": "Cupid posted a 133% year-on-year (YoY) increase in consolidated net profit to Rs 56.22 crore in the September quarter of FY27, from Rs 24.13 crore in the same quarter a year ago.", "source": "NDTV Profit", "pub_date_str": "12 Nov 2026, 01:12 PM IST", "pub_date_relative": "46m ago"}, {"title": "Indian Railways Recruitment 2026: Check Vacancies, Important Dates, Steps To Apply", "full_content": "Eligible candidates can submit their applications online through the official Railway Recruitment Board application portal.", "source": "NDTV Profit", "pub_date_str": "12 Nov 2026, 01:10 PM IST", "pub_date_relative": "49m ago"}, {"title": "Gold Prices Fall By Rs 1,300 To Below Rs 1,39,000; Silver Rates Slump By Rs 2,800", "full_content": "Gold and silver prices extended their losses on MCX as a stronger US dollar and expectations of further Federal Reserve rate hikes weighed on bullion.", "source": "NDTV Profit", "pub_date_str": "12 Nov 2026, 01:09 PM IST", "pub_date_relative": "49m ago"}, {"title": "Arvind Kejriwal Receives Death Threat In Lawrence Bishnoi Gang's Name, Rs 7 Crore Demanded", "full_content": "Arvind Kejriwal received a death threat from the Lawrence Bishnoi gang demanding seven crore rupees ransom.", "source": "NDTV Profit", "pub_date_str": "12 Nov 2026, 01:09 PM IST", "pub_date_relative": "49m ago"}, {"title": "Treasury yields edge higher as investors await fresh inflation and housing data", "full_content": "U.S. Treasury yields edged higher Thursday as bond trading resumed after the Veterans Day closure and investors looked ahead to fresh inflation and housing data for clues about the economy and the Federal Reserve's next move.\n\nThe yield on the 10-year U.S. Treasury note \u2014 the benchmark for mortgages, auto loans and credit card debt \u2014 was up 2 basis points at 5.0100%.\n\nThe 2-year Treasury note yield, which is more sensitive to short-term Federal Reserve interest rate decisions, was 5 basis points higher at 4.7800%. The longer-dated 30-year Treasury note yield \u2014 which often moves on geopolitical developments \u2014 was steady at 5.3503%.\n\nOne basis point equals 0.01%, or 1/100th of 1%, and yields and prices move inversely to one another.\n\nThe rise in yields comes as traders await more domestic data releases this week for fresh insights into the U.S. economic picture.\n\nOn Friday, the latest monthly producer price inflation print, which tracks wholesale inflation, is expected to show a 0.4% rise in October, down from the 1.3% surge in September.\n\nBefore that, investors are also looking out for October's home sales report from the National Association of Realtors, due later Thursday. Existing home sales rose by 1.5% in September to 3.99 million, up from a two-year low the previous month, and are expected to reach 4 million last month, according to Trading Economics estimates.\n\nOil prices were broadly flat in early trading, as Middle East negotiations remain deadlocked. U.S. West Texas Intermediate futures were up less than 0.1% at $86.59 a barrel, while Brent crude rose 0.17% to $92.92.", "source": "CNBC Top News", "pub_date_str": "12 Nov 2026, 01:08 PM IST", "pub_date_relative": "50m ago"}, {"title": "Jensen Huang built Nvidia into a behemoth. His scandal puts the entire AI boom in jeopardy.", "full_content": "Huang fueled his company and the AI ecosystem with advanced chips and creative financing deals across the supply chain. What happens if he\u2019s gone?", "source": "MarketWatch Top Stories", "pub_date_str": "12 Nov 2026, 01:00 PM IST", "pub_date_relative": "59m ago"}, {"title": "China's Ministry of State Security thrust into the spotlight by Nvidia CEO affair", "full_content": "From recruitment of U.S. students to allegations surrounding Nvidia's Jensen Huang affair, reports point to one Chinese intelligence agency: the Ministry of State Security.\n\nThe opaque government entity \u2014 which lacks an official website other than one supporting whistleblowers \u2014 has gained prominence with Beijing's growing emphasis on national security since 2023. The ministry oversees a range of provincial and national-level bureaus, including for intelligence gathering.\n\nWhile the MSS is not Beijing's only intelligence entity , the ministry has often been named in high-profile cases. Following hacking attempts on U.S. entities, the U.S. Treasury Department has in recent years sanctioned Chinese entities and individuals it alleges are affiliated with MSS.\n\nThe Financial Times and The New York Times this month reported, citing sources, that U.S. government intelligence believe the MSS recruited businesswoman Alice Huang to gather information on Nvidia CEO Jensen Huang. The two are not related. Jensen Huang admitted to an affair over the weekend, but it remains unclear whether any sensitive information was shared.\n\nThe MSS earlier this year approached an individual who knows Alice Huang \u2014 to find out more information about her business and connections, The FT reported Wednesday, citing the person who was questioned .", "source": "CNBC Finance", "pub_date_str": "12 Nov 2026, 12:58 PM IST", "pub_date_relative": "1h ago"}, {"title": "147% up in five years! Multibagger stock TGV SRAAC rally 8% today | What's behind the rally? Q2 results, returns", "full_content": "Vaamanaa Sethi Published 12 Nov 2026, 12:55 PM IST Prefer Livemint on Google Multibagger chemical stock TGV SRAAC jumped over 7.71% in Thursday's trading session after the company reported strong financial results for the quarter ending on 30 September, 2026, on Wednesday.\n\nTGV SRAAC share price opened at \u20b9 125.50 apiece on BSE today, as compared to previous close of \u20b9 120.65 on Wednesday and touched an intraday high of \u20b9 137.80 on November 12.\n\nTGV SRAAC reported a strong performance in the second quarter of FY27, with its net profit rising 50.4% year-on-year (YoY) to \u20b9 55.72 crore, compared to \u20b9 37.05 crore in the corresponding quarter of the previous financial year.\n\nThe net profit figure includes discontinued operations. The company's profit before tax (PBT) increased to \u20b9 76.84 crore in Q2 FY27 from \u20b9 49.89 crore in Q2 FY26.\n\nThe company's revenue from operations increased 18.1% YoY to \u20b9 590.47 crore in Q2 FY27, compared to \u20b9 499.94 crore in the year-ago quarter. Total income also rose to \u20b9 596.57 crore from \u20b9 503.18 crore in Q2 FY26, reflecting growth in its overall operating performance.\n\nOn the operational front, TGV SRAAC reported EBITDA of \u20b9 111 crore for the September quarter, registering a 19.4% YoY increase. Its EBITDA margin stood at 18.78%, indicating an improvement in operating earnings alongside higher revenue.\n\nOverall, the company's Q2 FY27 performance reflected growth across revenue, operating earnings and profitability, with net profit recording a sharper increase than revenue during the quarter.\n\nShares of TGV SRAAC have delivered positive returns across most time periods, gaining 10.45% over the past week and 15% in the last two weeks. However, the stock's gains moderated to 5.70% over the past month, indicating some consolidation after its recent rally.", "source": "LiveMint Markets", "pub_date_str": "12 Nov 2026, 12:55 PM IST", "pub_date_relative": "1h ago"}, {"title": "Rs 3 Lakh Income, 19-Year Age Gap: Should Parents Prioritise Income Over Daughter's Happiness? X Post Sparks Debate", "full_content": "The discussion has brought attention to a larger debate surrounding arranged marriages.", "source": "NDTV Profit", "pub_date_str": "12 Nov 2026, 12:51 PM IST", "pub_date_relative": "1h ago"}, {"title": "Netweb Technologies share price rebounds over 13% in four sessions after long downtrend: Relief rally or trend reversal?", "full_content": "Dhanya Nagasundaram Published 12 Nov 2026, 12:47 PM IST Prefer Livemint on Google Netweb Technologies India shares gained over 3% on Thursday, 12 November, extending their recovery after a prolonged downtrend. The stock has rebounded more than 13% over the past four trading sessions, signalling a pickup in buying interest. However, it remains under pressure over a broader period, declining 16.92% in a month and 14.12% over three months. On a positive note, the stock has gained 3.40% over six months and is up 35.11% so far in 2026.\n\nNetweb Technologies, a domestic provider of high-performance computing solutions, reported a sharp rise in profitability for the September quarter of FY27, buoyed by strong demand for artificial intelligence (AI) infrastructure.\n\nThe company\u2019s consolidated profit after tax (PAT) surged to \u20b9 136.7 crore in Q2 FY27, compared with \u20b9 31.4 crore in the corresponding quarter last year. Revenue from operations also registered a multifold increase, climbing to \u20b9 1,323.3 crore from \u20b9 303.7 crore a year earlier.\n\nNetweb\u2019s order book stood at \u20b9 2,629 crore as of 30 September 2026, providing visibility for business growth in the coming quarters.\n\nChairman and Managing Director Sanjay Lodha said Q2 FY27 marked another record quarter for the company, with its highest-ever quarterly revenue from operations and PAT.\n\nHe added that Netweb\u2019s PAT for the first half of FY27 reached \u20b9 222 crore, exceeding its full-year FY26 profit of \u20b9 205.8 crore within just six months.\n\nAI Systems remained the biggest growth contributor, generating \u20b9 773.1 crore, or 58.4% of the company\u2019s Q2 revenue from operations. High-Performance Computing (HPC) and Private Cloud also delivered strong contributions of \u20b9 248.2 crore and \u20b9 244.8 crore, respectively.\n\nLodha said the company\u2019s order book stood at \u20b9 2,629 crore at the end of September, with an additional L1 position of \u20b9 652.5 crore, strengthening its revenue visibility for the coming quarters.", "source": "LiveMint Markets", "pub_date_str": "12 Nov 2026, 12:47 PM IST", "pub_date_relative": "1h ago"}, {"title": "HAL Cheapest Pure-Play Defence Stock Despite Sector-Leading Position, Says CLSA; Hikes Target Price", "full_content": "CLSA maintained its Outperform' rating and raised its 12-month HAL share price target to Rs 5,625 from Rs 5,481 earlier. The revised target implies an upside potential of nearly 14% from Wednesday's closing price.", "source": "NDTV Profit", "pub_date_str": "12 Nov 2026, 12:47 PM IST", "pub_date_relative": "1h ago"}, {"title": "Forget Hormuz, This Shipping Route Is Now The World's Deadliest", "full_content": "More than 570 vessels have been struck in the Black Sea this year. About 387 were hit between July and September, more than five times the previous quarter's tally.", "source": "NDTV Profit", "pub_date_str": "12 Nov 2026, 12:47 PM IST", "pub_date_relative": "1h ago"}, {"title": "Thermax\u2019s H2 recovery bet runs into old execution hurdles", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nThermax\u2019s share price has more than halved from its 52-week high of \u20b9 5,277.80 seen in June, weighed down by continued earnings disappointment.\n\nIn the September quarter (Q2FY27), deferred higher-margin international shipments, worth \u20b9 200\u2013300 crore, capped consolidated revenue growth at 11% year-on-year (y-o-y) to \u20b9 2,756 crore.\n\nManagement expects H2FY27 revenue to touch \u20b9 7,000 crore versus \u20b9 5,059 crore in H1. Revenue growth will be buoyed by export orders and lower contribution from low-margin legacy projects nearing completion.\n\nOrder inflows fell 8% y-o-y to \u20b9 3,259 crore, driven by weak intake in the industrial products segment. H1FY27 order inflows slid 4% to \u20b9 6,100 crore, taking the order book as of September to \u20b9 14,250 crore, up 16%.\n\nFrom its earlier guidance of over 10% growth in FY27 order inflows, Thermax now anticipates high single-digit growth. It expects at least one supercritical boiler order in H2.\n\nHowever, JM Financial Institutional Securities noted that even if one large thermal power win is factored in, FY27 order inflow growth is likely to be only 5%.\n\n\u201c Investors are occasionally enthused about the potential for order wins in the thermal power space, which seems fair. However, given the chronic execution issues Thermax continues to face, especially in PSU projects in India, we will be wary of such wins unless management addresses fundamental project engineering and execution issues,\u201d it said.", "source": "LiveMint Markets", "pub_date_str": "12 Nov 2026, 12:42 PM IST", "pub_date_relative": "1h ago"}, {"title": "Bloom Energy shares jump 13%: Can the AI power stock sustain its rally?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News Powered By Bloom Energy shares jump 13%: Can the AI power stock sustain its rally? Written by Anupam Nagar , ETMarkets.com | Nov 12, 2026, 01:04:36 PM IST 1 / 8 Bloom Energy shares surge 13% Bloom Energy shares rally 13% on Wednesday, November 11, after upbeat results and an improved revenue outlook from CoreWeave ease concerns about a slowdown in AI infrastructure spending. The stock records its strongest single-day percentage gain in nearly four months. (Sources: 24/7 Wall St, MarketWatch, BigGo Finance)\n\nThe rally follows CoreWeave's third-quarter results, which show revenue of $3.66 billion, up 168% year on year. The AI cloud computing company also reports a backlog of around $132.5 billion and raises its 2026 revenue forecast to $13 billion-$13.3 billion, signalling continued demand for AI infrastructure.\n\nBloom Energy supplies on-site power systems to data centres, making it a key beneficiary of the AI infrastructure expansion. Strong demand for computing capacity encourages data centre operators to continue investing in power infrastructure. CoreWeave's upbeat outlook therefore eases concerns about potential delays or cancellations of projects that could affect Bloom's order pipeline.\n\nDespite Wednesday's 13% rally, Bloom Energy shares remain 39% below their June 22 record closing high of $345.85. The stock had fallen 52% from that peak by November 5, marking the third time since its 2018 IPO that it had lost more than half its value from a previous high.\n\nHistorical data offer some encouragement to investors. According to 24/7 Wall St, Bloom Energy has recorded 40 sessions in which its shares jumped at least 12% while trading 35% or more below their previous peak. In 28 of 36 comparable instances, the stock traded higher six months later, with a median gain of 57%.", "source": "Economic Times Markets", "pub_date_str": "12 Nov 2026, 12:38 PM IST", "pub_date_relative": "1h ago"}, {"title": "Karan Johar Says He Started Koffee With Karan To Cope With Father Yash Johar's Death", "full_content": "Karan Johar revealed that Koffee With Karan was initially started as a way to distract himself from the emotional loss of his father, Yash Johar.", "source": "NDTV Profit", "pub_date_str": "12 Nov 2026, 12:38 PM IST", "pub_date_relative": "1h ago"}, {"title": "Stocks to buy: Minda Corporation, RK Forgings, ASK Automotive - MNCL picks 8 auto ancillary stocks with up to 63% upside", "full_content": "SUNDRMFAST MINDACORP FIEMIND Pranati Deva Published 12 Nov 2026, 12:32 PM IST Prefer Livemint on Google Auto stocks to buy : Strong festive demand and improved vehicle affordability drove healthy automobile sales across segments in October 2026, prompting Monarch Networth Capital (MNCL) to remain positive on select auto ancillary stocks.\n\nThe brokerage has identified eight stocks from its coverage universe with Buy ratings, including Minda Corporation, RK Forgings, Sundram Fasteners , ASK Automotive, Pricol and others.\n\nAmong these stocks, MNCL identified Minda Corporation, RK Forgings and Sundram Fasteners as its top picks. The brokerage also noted that valuations for all three appeared attractive at current market prices.\n\nMNCL has assigned Buy ratings to eight stocks, with target prices indicating potential upside ranging from 8% to 63% from their respective current market prices.\n\nThe brokerage has a target price of \u20b9 745 against a current market price of \u20b9 593, indicating a potential upside of 63%.\n\nFiem Industries has a target price of \u20b9 2,805 compared with its current market price of \u20b9 1,802, implying an upside of 36%.\n\nMNCL has set a target price of \u20b9 867 against a CMP of \u20b9 655, indicating a potential upside of 32%. The brokerage expects the company to deliver strong growth through increasing content per vehicle.\n\nPricol has a target price of \u20b9 810 compared with its current market price of \u20b9 658, implying an upside of 23%.", "source": "LiveMint Markets", "pub_date_str": "12 Nov 2026, 12:32 PM IST", "pub_date_relative": "1h ago"}, {"title": "Ramayana Box Office Collection Day 8 Live: Ranbir's Film Off To A Good Start, Check Earnings", "full_content": "Ranbir Kapoor, Sai Pallavi and Yash starrer 'Ramayana: Part One' maintains its box office momentum on Day 8 with strong audience turnout.", "source": "NDTV Profit", "pub_date_str": "12 Nov 2026, 12:29 PM IST", "pub_date_relative": "1h ago"}, {"title": "Stocks Slide on Nvidia Troubles, Oil Edges Lower: Markets Wrap - Bloomberg.com", "full_content": "Stocks Slide on Nvidia Troubles, Oil Edges Lower: Markets Wrap Bloomberg.com Nasdaq-100 futures slide, dragged lower as Nvidia sell-off resumes: Live updates CNBC Anthropic\u2019s Giant IPO Will Tie It Closer to Nvidia The New York Times Nvidia selloff deepens, adding to AI jitters Reuters Anthropic, Nvidia, CoreWeave, Take-Two, D-Wave, Securitize, and More That Explain Today\u2019s Market Barron's", "source": "Google News Business", "pub_date_str": "12 Nov 2026, 12:29 PM IST", "pub_date_relative": "1h ago"}, {"title": "CAMS, CDSL, Geojit Financial Services: Buy or hold? Capital market stocks rise up to 4%; do you own? Targets, stop-loss", "full_content": "CAMS GEOJITFSL GROWW Asit Manohar Published 12 Nov 2026, 12:20 PM IST Prefer Livemint on Google Stocks to buy | Shares to buy: Amid a rising stock market, capital stocks witnessed strong buying on Thursday. Capital markets' major CDSL share price opened today at \u20b9 1416 and touched an intraday high of \u20b9 1461, recording an over 4% intraday rise. CAMS share price today opened at \u20b9 723.50 per share and touched an intraday high of \u20b9 755.30 apiece on the NSE. Shares of Geojit Financial Services , Groww , and others also saw buying interest during Thursday's session.\n\nAccording to stock market experts, capital market companies are expected to leap frog once there is trend-reversal on Dalal Street. They said that one should look at the monopoly companies like CDSL, whose business is expected to rise with the rise in demat account holders. They said that companies like Geojit Financial Services, Groww, etc., are expected to see good business, but they may not outperform the segment or generate alpha returns. So, for a long-term investor, CDSL is best suited, whereas for a high ROE and mutual funds tailwinds, CAMS shares are better suited.\n\nUnveiling the investment strategy while choosing a capital market stock, Avinash Gorakshkar, Founder of Avinash Mentor Research, said, \u201cOne should look at the monopoly companies. Stocks like Geojit Financial Services, Groww are expected to give a good return but shares of CDSL and CAMS are expected to outperform the category and generate an aplpha return.\u201d\n\nGorakshakr said that investors looking for high ROE and mutual funds tailwind are advised to look at buying CAMS shares, while investors looking for long-term investment horizon, should look at CDSL shares.\n\nDecoding the technical chart pattern of CDSL shares, Mahesh M Ojha, VP \u2014 Research and Business Development at KC Securities, said, \u201cCDSL shares have strong support placed at \u20b9 1388. The stock is facing resistance at \u20b9 1480.", "source": "LiveMint Markets", "pub_date_str": "12 Nov 2026, 12:20 PM IST", "pub_date_relative": "1h ago"}, {"title": "How resilient is the US consumer?", "full_content": "A dialogue with Adam Josephson of Sakonnet Research", "source": "FT Markets", "pub_date_str": "12 Nov 2026, 12:00 PM IST", "pub_date_relative": "1h ago"}, {"title": "Mahindra & Mahindra among 5 stocks showing White Marubozu Pattern", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News Mahindra & Mahindra among 5 stocks showing White Marubozu Pattern Written by Rounak Khare , ETMarkets.com | Nov 12, 2026, 12:05:36 PM IST 1 / 6 Stock Watch On November 11, five stocks in the Nifty500 with a change of more than 5% appeared on the \u2018White Marubozu\u2019 bullish scanner, according to StockEdge\u2019s technical scan data. A White Marubozu is a bullish candlestick pattern in technical analysis that occurs when the opening price is the lowest for a given period and the closing price is the highest.\n\nThe pattern is represented by a long white (or green) candlestick with no upper shadow and little or no lower shadow. It reflects strong upward price movement during the session, with the price moving from the opening level toward the session high by the close. The pattern is commonly studied in technical analysis as an indicator of price momentum.", "source": "Economic Times Markets", "pub_date_str": "12 Nov 2026, 11:59 AM IST", "pub_date_relative": "1h ago"}, {"title": "Who is Wing Commander Namrita Chandi? How did she win pension battle 15 years after retiring from Indian Air Force?", "full_content": "Retired Wing Commander Namrita Chandi, a Short Service Commission (SSC) officer of the Indian Air Force (IAF), spent years fighting a legal battle over the denial of Permanent Commission and the retirement benefits that followed.\n\nAlthough she had approached the authorities for Permanent Commission before completing her initial service tenure, her request was turned down, and she eventually retired in 2011. Her fight continued through the courts, with the case passing from the Delhi High Court to the Armed Forces Tribunal (AFT) and eventually reaching the Supreme Court.\n\nThe case did not end with the initial legal victory. Chandi also had to pursue the retirement benefits linked to her claim, particularly her eligibility for pension after completing the qualifying period of service.\n\nAs reported by The Tribune , the Chandigarh Bench of the Armed Forces Tribunal (AFT), Chandimandir (Panchkula), has now modified its earlier order in her case, bringing a long-running dispute over her service and pension entitlement to another significant stage.\n\nThe ruling comes nearly 15 years after Chandi retired from the Indian Air Force in 2011, following a prolonged legal battle over the denial of Permanent Commission.\n\nNamrita Chandi was commissioned into the Indian Air Force under the Short Service Commission in 1996. An SSC is a fixed-tenure commission that allows officers to serve in the armed forces for a specified period, unlike Permanent Commission, which offers a longer career in service.\n\nChandi was initially appointed for 10 years. Before completing that tenure, she sought Permanent Commission. However, her request was rejected on the grounds that the applicable provisions did not allow SSC officers in the flying branch to be granted Permanent Commission. Instead, she received a five-year extension and subsequently retired in 2011.\n\nChandi challenged the decision by filing a writ petition before the Delhi High Court in 2011.", "source": "LiveMint Money", "pub_date_str": "12 Nov 2026, 11:51 AM IST", "pub_date_relative": "2h ago"}, {"title": "Fresh $280,000,000,000 Wipeout: Nvidia Shares Sink 8% On Reports Of Alleged Jensen Huang's Second Affair", "full_content": "The stock was trading 8.27% lower at $159.37 in after-hours trading at the last check, after closing higher during the regular trading session.", "source": "NDTV Profit", "pub_date_str": "12 Nov 2026, 11:51 AM IST", "pub_date_relative": "2h ago"}, {"title": "AICWA Seeks Maximum Screens for 'Pyre' After Vinod Kapri Alleges Nearly 75% Cut in Shows", "full_content": "AICWA seeks an investigation into Pyre's screen reduction following Ramayana's release and calls for fair opportunities for small films.", "source": "NDTV Profit", "pub_date_str": "12 Nov 2026, 11:48 AM IST", "pub_date_relative": "2h ago"}, {"title": "Indian bonds drift as US debt rout saps oil relief before CPI", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Bonds \u203a Indian bonds drift as US debt rout saps oil relief before CPI Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Indian bonds drift as US debt rout saps oil relief before CPI SECTIONS Indian bonds drift as US debt rout saps oil relief before CPI Reuters Last Updated: Nov 12, 2026, 11:46:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis On Thursday morning, Indian government bonds remained stable, reflecting a pause after recent volatility. Market sentiment is influenced by declining oil prices and climbing US Treasury yields, with inflation data on the horizon. The Reserve Bank of India is expected to modify its policy rate in light of these figures. Meanwhile, the ongoing Iran conflict could affect oil pricing, as traders prepare for a significant bond auction set for Friday.\n\nOn Thursday morning, Indian government bonds remained stable, reflecting a pause after recent volatility. Market sentiment is influenced by declining oil prices and climbing US Treasury yields, with inflation data on the horizon. The Reserve Bank of India is expected to modify its policy rate in light of these figures. Meanwhile, the ongoing Iran conflict could affect oil pricing, as traders prepare for a significant bond auction set for Friday.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "12 Nov 2026, 11:46 AM IST", "pub_date_relative": "2h ago"}, {"title": "'You're Either In Or Out': Kiara Advani Reveals She Called Off Relationship With Sidharth Malhotra During Shershaah", "full_content": "Kiara Advani recently revealed that she and Sidharth Malhotra had broken up before he left for the Kargil schedule of Shershaah.", "source": "NDTV Profit", "pub_date_str": "12 Nov 2026, 11:41 AM IST", "pub_date_relative": "2h ago"}, {"title": "Nvidia board meeting to decide CEO Jensen Huang\u2019s fate stretches into evening", "full_content": "Nvidia's board is meeting to decide whether to oust CEO Jensen Huang , CNBC confirmed late Wednesday, following reports of two extramarital affairs \u2014 one with an employee and another with an alleged Chinese spy. Shares of Nvidia fell more than 9% in post-market trading after The Wall Street Journal first reported that the board was preparing to force out Huang. That news landed minutes after The New York Times reported that Huang had a romantic relationship with Nvidia's vice president of health care.\n\nThe alleged relationship, according to the Times story, was with Kimberly Powell, vice president of health care at Nvidia. Powell's bio on the Nvidia website says she's \"responsible for the company's worldwide healthcare business, including hardware and software platforms for accelerated computing, AI, and visualization that power the ecosystem of medical imaging, life sciences, drug discovery, and healthcare analytics.\"\n\nHuang and Powell were reportedly captured on camera being affectionate with one another at a hotel in San Jose, California in March, according to the Times.\n\nNvidia and Powell didn't respond to CNBC's request for comment. Heller, the crisis PR firm Huang reportedly hired as early as last year, did not immediately respond to CNBC's request for comment.\n\nThe report comes days after Huang admitted to an affair with a woman who is believed by U.S. intelligence of being a Chinese spy. The CEO was romantically involved with Alice Huang, according to The Financial Times , who U.S. intelligence officials believe is a spy for China's Ministry of State Security, The New York Times reported.\n\nNvidia stock chart. Nvidia's board of directors has opened an independent investigation and hired the law firm Wachtell, Lipton, Rosen & Katz to look into the spying allegations.\n\n\"I was unfaithful to my wife. My actions hurt her and our children. There is no excuse for what I did,\" Huang wrote in the message to Nvidia staff on Sunday.", "source": "CNBC World Economy", "pub_date_str": "12 Nov 2026, 11:41 AM IST", "pub_date_relative": "2h ago"}, {"title": "Gold, silver prices today, 12 November: Check retail rates of 24K, 22K, 18K gold, 999 silver in Delhi, Mumbai, Bangalore", "full_content": "Gold, Silver rates today, 12 November: Gold prices slipped to over one-week low on Thursday amid strong United States inflation data, concern over the US Federal Reserve hiking interest rates, and a firm US Dollar, Reuters reported.\n\nSpot gold fell 0.2% to $3,977.99 per ounce by 0506 GMT, after touching its lowest since November 4 earlier; and US gold futures for December delivery dropped 0.4% to $3,983.20, the report said.\n\n\u201cThe (gold) market has had a meaningful pullback over the past several days in the wake of that US inflation data and the rise in rate hike expectations around that but I think the markets are pointedly struggling for a follow through,\u201d Ilya Spivak, head of global macro at Tastylive told the publication.\n\nAt the time of writing on 12 November, gold bullion was trading at \u20b9 1,39,510 per 10 grams, while Silver was at \u20b9 1,83,010 per kg, data on the bullion website showed.\n\nHere are gold and silver rates in key Indian cities on Thursday. Check the price of 18K, 22K and 24K gold and 999 Fine silver in Ahmedabad, Bengaluru, Chennai, Coimbatore, Delhi, Hyderabad, Kolkata, and Mumbai today as follows:\n\nThe gold price in Mumbai today, 12 November, was in line with the overall gold rate in India. The 24-karat gold price in Mumbai was \u20b9 1,39,250 per 10 grams. Meanwhile, the price of 22-karat gold in Mumbai was \u20b9 1,27,646 per 10 grams. On the other hand, the 18-karat gold rate in Mumbai was \u20b9 1,04,438 per 10 grams.\n\nThe silver price in Mumbai today, 12 November, was in line with the overall silver rates in India. The price of Silver 999 Fine in Mumbai was \u20b9 1,82,680 per kg.\n\nThe gold price in Delhi reflected the overall gold rates across India on 12 November. The 24-karat gold price in Delhi was \u20b9 1,39,010 per 10 grams. Meanwhile, the price of 22-karat gold in the national capital was \u20b9 1,27,426 per 10 grams, while the rate of 18-karat gold was \u20b9 1,04,258 per 10 grams.", "source": "LiveMint Money", "pub_date_str": "12 Nov 2026, 11:40 AM IST", "pub_date_relative": "2h ago"}, {"title": "Co-Payment In Health Insurance: Should You Opt For It? How To Decide The Amount", "full_content": "Under co-payment, a part of the hospital bill is paid by you and the remaining amount is paid by the insurer.", "source": "NDTV Profit", "pub_date_str": "12 Nov 2026, 11:39 AM IST", "pub_date_relative": "2h ago"}], "cfa": [{"title": "NORBIT Q3 2026 slides: revenue surges 34% on defense, tolling wins", "full_content": "", "source": "Investing.com News", "pub_date_str": "12 Nov 2026, 01:50 PM IST", "pub_date_relative": "8m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "What's Gold price future in India? Will it touch \u20b91.50 lakh per 10 grams again by December 2026? Experts' view", "full_content": "DOLLAR Vaamanaa Sethi Published 12 Nov 2026, 01:47 PM IST Prefer Livemint on Google Gold price outlook : Gold prices have come under pressure in recent trading sessions, with the precious metal struggling to find support despite a sharp correction in crude oil prices. With the US Federal Reserve maintaining a hawkish stance, expectations of further interest rate hikes and a strengthening US dollar have weighed on bullion sentiment.\n\nOn the Multi Commodity Exchange (MCX), gold prices are trading near \u20b9 1,38,500 per 10 grams, down from recent highs. Meanwhile, international spot gold is hovering around $3,955 per ounce.\n\nMarket experts remain divided on the near-term outlook, with some cautioning against further downside while others believe a recovery is possible if macroeconomic conditions turn favourable.\n\nSeveral global macroeconomic factors are currently influencing gold prices, with the US Federal Reserve's monetary policy outlook emerging as the biggest driver.\n\nAccording to Anuj Gupta, SEBI Registered Research Analyst, gold is facing selling pressure amid expectations that the US Federal Reserve could raise interest rates by 50 basis points.\n\nA potential rate hike would make interest-bearing assets more attractive compared with non-yielding assets such as gold, potentially triggering further selling in precious metals.\n\nGupta said gold is currently under pressure, with international spot prices trading near $3,955 per ounce, close to the session's low. On MCX, prices are hovering around \u20b9 1,38,500 per 10 grams.\n\nAnother factor weighing on gold is the strengthening US dollar. A stronger dollar generally makes dollar-denominated commodities more expensive for holders of other currencies, potentially reducing demand for bullion.", "source": "LiveMint Markets", "pub_date_str": "12 Nov 2026, 01:47 PM IST", "pub_date_relative": "11m ago", "cfa_topics": ["Economics", "Equity Investments", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "NSE shares hit fresh highs, rise over 2%; Nuvama sees 14% upside, calls the stock exchange a \u2018compelling buy\u2019", "full_content": "Dhanya Nagasundaram Published 12 Nov 2026, 01:46 PM IST Prefer Livemint on Google Shares of the National Stock Exchange of India (NSE) rose over 2% on Thursday, 12 November, touching a fresh all-time high of \u20b9 1,994.50. The stock had previously recorded a 52-week high of \u20b9 1,965 on 11 November, extending its recent upward momentum.\n\nThe rally comes as Nuvama Institutional Equities initiated coverage on NSE with a bullish outlook, describing the exchange as a \u2018compelling buy\u2019 and setting a target price of \u20b9 2,220. This implies an upside potential of around 14% from the brokerage's reference price.\n\nIn its initiation report, Nuvama said NSE's entrenched liquidity advantage and strong network effects underpin its dominant position in India's capital markets. The brokerage believes the exchange's competitive moat, improving market participation and potential growth from emerging business segments could support its earnings trajectory.\n\nNuvama said NSE's three-decade-long presence has created a strong liquidity moat that continues to reinforce its market leadership. The exchange commanded around 93% of the cash market, nearly 100% of equity futures and approximately 68% of options premium turnover value (PTV) as of H1 FY27.\n\nAccording to the brokerage, this market depth makes NSE the preferred trading venue for brokers, foreign portfolio investors (FPIs), market makers and algorithmic traders. Its cash market share has remained around 93% through FY20\u2013FY26, even after the introduction of market interoperability in 2019, while its equity futures market share is close to 100%.\n\nNuvama noted that NSE's options franchise is also more diversified than that of its rival BSE. The exchange held around 68% of index options premium as of Q2 FY27, while BSE's gains in the segment remain more concentrated around its own expiry day.\n\nThe brokerage believes several regulatory challenges facing the derivatives business have already been factored into the market outlook.", "source": "LiveMint Markets", "pub_date_str": "12 Nov 2026, 01:46 PM IST", "pub_date_relative": "12m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Derivatives", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "GFPT Q3 2026 presentation: profit rises despite margin squeeze", "full_content": "", "source": "Investing.com News", "pub_date_str": "12 Nov 2026, 01:46 PM IST", "pub_date_relative": "12m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Nasdaq-100 futures slide, dragged lower as Nvidia sell-off resumes: Live updates", "full_content": "Nasdaq-100 futures fell early Thursday as Nvidia shares slid on a report that the chip giant's board is preparing to unseat CEO Jensen Huang .\n\nFutures tied to the tech-heavy Nasdaq-100 lost 0.97 %, while S&P 500 futures fell 0.37%. Dow Jones Industrial Average futures rose 0.15%.\n\nIn Asia, Japan's Nikkei 225 fell 0.70%. South Korea's Kospi, which is dominated by Nvidia suppliers Samsung and SK Hynix, fell 0.61%. Hong Kong's Hang Seng index index was down 1.43% as of its last hour of trade, while mainland China's CSI 300 fell 0.78%. Australia's S&P/ASX 200 closed flat.\n\nIn extended U.S. trading, selling resumed in Nvidia after The New York Times reported that Huang had an extramarital relationship with an executive at the company. The Wall Street Journal also reported that Nvidia's board is gearing up to remove Huang from his post . Shares were last down more than 8%.\n\nIn regular trading, the Dow rose nearly 255 points, or 0.5%. The S&P 500 advanced 1.3%, and the Nasdaq Composite jumped 1.6%. The gains were driven by a post-earnings advance in CoreWeave and a rebound in Nvidia.\n\nInvestors are weighing whether the artificial intelligence-driven rally has more room to run given recent weakness in Nvidia, while CoreWeave's better-than-expected results and raised revenue outlook reinforced the longer-term growth story heading into Thursday's session.\n\nAI enthusiasm may be driving markets, with added momentum from Anthropic's upcoming IPO . However, macro and policy risks argue for staying selective rather than chasing performance, according to Sameer Samana, head of global equities and real assets at Wells Fargo Investment Institute.\n\n\"We would be a little circumspect about the bounce-back as there are some things changing at the margin [like] stubborn inflation, more fed rate hikes, higher long-term interest rates, change in configuration in Washington DC [and] AI/data center regulation demands,\" he said.", "source": "CNBC Top News", "pub_date_str": "12 Nov 2026, 01:45 PM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "European shares hit record high helped by strong earnings and lower energy prices", "full_content": "", "source": "Investing.com News", "pub_date_str": "12 Nov 2026, 01:42 PM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Up 118% from 52-week low, Rolex Rings hits year-high! Is the small-cap stock still a good buy? Check target, rationale", "full_content": "Pranati Deva Published 12 Nov 2026, 01:35 PM IST Prefer Livemint on Google Rolex Rings share price : A small-cap auto component stock that spent years delivering muted revenue growth is now attracting fresh investor attention after a sharp rally, stronger quarterly earnings and a bullish brokerage initiation. Rolex Rings shares climbed around 4% to a fresh 52-week high of \u20b9 216.55 on Thursday, November 12, taking their one-year gains to 86%.\n\nThe company has also reported a 67.5% jump in September-quarter net profit, while experts also have an optimistic outlook on the stock.\n\nThe brokerage believes the company is entering a new operating upcycle, backed by recovering export demand, European business opportunities and improving domestic demand. But after the stock's sharp run-up, how much further upside does the brokerage see?\n\nRolex Rings shares rose around 4% in Thursday's trading session to touch a 52-week high of \u20b9 216.55 apiece. The stock has surged 116% from its 52-week low of \u20b9 99.30, recorded in November 2025.\n\nThe small-cap stock has delivered strong returns across timeframes, gaining 23% over the past month and 23% in three months. Its six-month returns stood at 45%, while it has advanced 86% over the past year.\n\nRolex Rings reported revenue from operations of \u20b9 389 crore in Q2 FY27 , marking a 43.4% year-on-year increase from \u20b9 271 crore in the corresponding quarter last year, according to its investor presentation released on November 4, 2026.\n\nThe company's EBITDA increased 72% year-on-year to \u20b9 94 crore, while the EBITDA margin stood at 24.2%. Net profit rose 67.5% to approximately \u20b9 74 crore for the quarter.\n\nA separate results summary based on the standalone financial statements reported revenue of \u20b9 389.18 crore, operating profit of \u20b9 94.31 crore and net profit of \u20b9 73.94 crore.", "source": "LiveMint Markets", "pub_date_str": "12 Nov 2026, 01:35 PM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Q2 Results Live: HAL Profit Jumps 16%; IRCTC, Oil India, Ola Electric, Vodafone Idea In Focus", "full_content": "The September-quarter earnings season continues with results due from Hindustan Aeronautics, IRCTC, Oil India, Ola Electric, Vodafone Idea, Bharat Dynamics, NMDC, Page Industries, Alkem Laboratories and several other companies. Stay tuned for latest updates!", "source": "NDTV Profit", "pub_date_str": "12 Nov 2026, 01:25 PM IST", "pub_date_relative": "33m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Use FTAs to build joint ventures, explore investment opportunities: CII President to industry", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a Use FTAs to build joint ventures, explore investment opportunities: CII President to industry The Economic Times daily newspaper is available online now. Read Today's Paper Use FTAs to build joint ventures, explore investment opportunities: CII President to industry SECTIONS Use FTAs to build joint ventures, explore investment opportunities: CII President to industry PTI Last Updated: Nov 12, 2026, 01:21:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis R Mukundan, the CII President, stressed the crucial role of Free Trade Agreements (FTAs) in fostering joint ventures and enhancing investment prospects. He noted India's resilient economic growth, even faced with global challenges like geopolitical tensions and elevated energy prices. The broadened scope of India's FTAs promises to enrich economic interactions and spur advancements in emerging technologies such as AI and biotechnology.\n\nBusiness of Odd Things: The farm that needs no land, freshwater, or fertiliser\n\nKYC and KYB: Inside Pidilite, the company that turned Fevicol into a word for a strong bond \u2013 Part 1 of 3\n\nSeoul halts trading, Nifty has its best week since 2021: Money leaving the AI trade \u2013 will it land in India?\n\nJunk bonds are cracking at the bottom. Will the noise get loud enough to make \u2018junk bond\u2019 a household term again?\n\nPNG connections rise half a million, but how many use piped gas for cooking?\n\nSome elections matter more than you know: No crop changed in the fields, yet sugar, coffee and soya got cheaper in a day\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "12 Nov 2026, 01:21 PM IST", "pub_date_relative": "38m ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Jensen Huang's affair with alleged spy revives push to tighten China chip curbs ahead of Trump-Xi summit", "full_content": "The scandal engulfing Nvidia Corp CEO Jensen Huang is bolstering the case for U.S. lawmakers seeking tighter restrictions on China's access to advanced AI chips, just days before President Donald Trump 's planned meeting with Xi Jinping next week.\n\nThe U.S. and China are locked in a race to achieve global AI supremacy, with Washington spending years restricting China's access to Nvidia's most advanced chips to slow its technological progress. Huang was among the loudest voices opposing U.S. strict export controls on advanced chips to China, which has irked some China hawks.\n\nThe alleged affair with Alice Huang, a Chinese citizen who is not related to him and was reportedly recruited by Chinese intelligence to gather information, has given lawmakers fresh ammunition to push for the inclusion of a series of chip-control measures in this year's National Defense Authorization Act (NDAA).\n\nThe bills include the AI Overwatch Act, the Chip Security Act and the MATCH Act \u2013 all of which are aimed at limiting the flow of advanced chips to U.S. adversaries, particularly China.\n\nHuang had been \"the industry's most effective lobbyist against tighter rules,\" said David Meale, head of Eurasia Group's China practice and an American diplomat who served as deputy chief of mission at the U.S. embassy in Beijing.\n\nBut the scandal has weakened Nvidia's \"singular ability to slow the progress of those bills\" \u2014 which were stalled by pushback from corporates and the White House\u2014 and made it \"politically harder for negotiators to strip chip provisions out of this year's NDAA,\" Meale said.\n\nSenate Democratic leader Chuck Schumer on Tuesday called on Congress to pass these bills and urged a full accounting of Trump's defense of Huang.", "source": "CNBC World Economy", "pub_date_str": "12 Nov 2026, 01:20 PM IST", "pub_date_relative": "38m ago", "cfa_topics": ["Economics", "Financial Statement Analysis"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Best fixed deposit rates, 11 Nov 2026: Earn up to 8.25%; check FD returns of top 5 small finance, private, public banks", "full_content": "The Reserve Bank of India ( RBI ) increased the benchmark repo rate by 25 basis points to 5.50% on 7 October, its first rate hike since February 2023. Following the policy change, fixed deposit (FD) interest rates have come into focus as banks adjust their deposit offerings to attract investors.\n\nFor depositors looking to lock in their savings, small finance banks, private sector banks and public sector banks offer different interest rates across tenures. As of 11 November, Suryoday Small Finance Bank offers the highest FD interest rate of 8.25% among the banks.\n\nHere are five banks offering the highest FD rates in each category, along with their rates for one-year, three-year, and five-year deposits.\n\nSource: Paisabazaar; As of 11 November 2026; FD interest rates for regular customers.\n\nSuryoday Small Finance Bank leads the category with an 8.25% interest rate on five-year deposits. Utkarsh Small Finance Bank and Ujjivan Small Finance Bank follow with maximum rates of 8.10%, although their highest-paying tenures differ.\n\nShivalik Small Finance Bank offers 7.50% on three-year deposits, while Equitas Small Finance Bank offers up to 8% on its Maxima FD product.\n\nSource: Paisabazaar; As of 11 November 2026; FD interest rates for regular customers.\n\nAmong private-sector banks, DCB Bank offers the highest rate of 7.75% for deposits with tenures of 17 and 20 months. SBM Bank follows with 7.65% for deposits in its specified tenure slab.", "source": "LiveMint Money", "pub_date_str": "12 Nov 2026, 01:19 PM IST", "pub_date_relative": "39m ago", "cfa_topics": ["Economics", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Penny stock under \u20b910: Orient Green Power shares rise 4.50% after Q2 Results 2026 | Do you own?", "full_content": "Asit Manohar Published 12 Nov 2026, 01:17 PM IST Prefer Livemint on Google e Penny stock under \u20b9 10 | Q2 Results 2026: Shares of Orient Green Power Company Ltd witnessed strong buying interest during the Opening Bell on Thursday session. The penny stock under \u20b9 10 opened higher at \u20b9 9.42 per share on the NSE and touched an intraday high of \u20b9 9.75 per share within a few minutes of the Opening Bell, logging an intraday rise of 4.50% against the previous ay's close of \u20b9 9.32 per share. However, the penny stock failed to sustain at higher levels after the profit-booking trigger and retraced from the intraday high. By 12:45 PM, Orient Green Power Company share price was trading around \u20b9 9.40 apiece, nearly one per cent above the previous day's close.\n\nThe company came under the radar of Dalal Street bulls after the announcement of Q2 Results 2026 and H-1 FY27 earnings during the Thursday morning dealings.\n\nThe penny stock under \u20b9 10 with a market cap of \u20b9 1,100 crore and a P/E ratio of around 17, declared a strong second-quarter number for the financial year 2026-27.\n\nDuring the July to September 2026 quarter, the company posted 8% YoY growth in the total income to \u20b9 147 crore. The company's EBITDA grew 12% YoY to \u20b9 117 crore.\n\nOn account of Capacity additions and improved credit ratings, which helped sustain the same, the company posted H1 FY27 profit of \u20b9 100 crore+ this year without the \u20b9 16 crore one-time gain of last year.\n\nImproved wind conditions during the quarter, coupled with incremental generation from recently commissioned capacities, offset the previous quarter\u2019s deficit, leading to a marginal surplus.\n\nRevenues and EBITDA for the half year were marginally better by 2% YoY and 4% YoY, respectively.", "source": "LiveMint Markets", "pub_date_str": "12 Nov 2026, 01:17 PM IST", "pub_date_relative": "42m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stock Market Today: Sensex, Nifty 50 Trade Flat; Financials Lead, M&M, Nestle, PowerGrid Top Drags", "full_content": "Among sectors, Nifty Realty, Nifty Private Bank, Nifty Metals and Nifty Media led gains, while losses were seen in Nifty IT and Nifty Pharma indices.", "source": "NDTV Profit", "pub_date_str": "12 Nov 2026, 01:17 PM IST", "pub_date_relative": "42m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Over 16,000% Return In 5 Years: This Condom Maker Rallies 10%, Hits Record High; Is There More Steam Left?", "full_content": "Cupid posted a 133% year-on-year (YoY) increase in consolidated net profit to Rs 56.22 crore in the September quarter of FY27, from Rs 24.13 crore in the same quarter a year ago.", "source": "NDTV Profit", "pub_date_str": "12 Nov 2026, 01:12 PM IST", "pub_date_relative": "46m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Gold Prices Fall By Rs 1,300 To Below Rs 1,39,000; Silver Rates Slump By Rs 2,800", "full_content": "Gold and silver prices extended their losses on MCX as a stronger US dollar and expectations of further Federal Reserve rate hikes weighed on bullion.", "source": "NDTV Profit", "pub_date_str": "12 Nov 2026, 01:09 PM IST", "pub_date_relative": "49m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Treasury yields edge higher as investors await fresh inflation and housing data", "full_content": "U.S. Treasury yields edged higher Thursday as bond trading resumed after the Veterans Day closure and investors looked ahead to fresh inflation and housing data for clues about the economy and the Federal Reserve's next move.\n\nThe yield on the 10-year U.S. Treasury note \u2014 the benchmark for mortgages, auto loans and credit card debt \u2014 was up 2 basis points at 5.0100%.\n\nThe 2-year Treasury note yield, which is more sensitive to short-term Federal Reserve interest rate decisions, was 5 basis points higher at 4.7800%. The longer-dated 30-year Treasury note yield \u2014 which often moves on geopolitical developments \u2014 was steady at 5.3503%.\n\nOne basis point equals 0.01%, or 1/100th of 1%, and yields and prices move inversely to one another.\n\nThe rise in yields comes as traders await more domestic data releases this week for fresh insights into the U.S. economic picture.\n\nOn Friday, the latest monthly producer price inflation print, which tracks wholesale inflation, is expected to show a 0.4% rise in October, down from the 1.3% surge in September.\n\nBefore that, investors are also looking out for October's home sales report from the National Association of Realtors, due later Thursday. Existing home sales rose by 1.5% in September to 3.99 million, up from a two-year low the previous month, and are expected to reach 4 million last month, according to Trading Economics estimates.\n\nOil prices were broadly flat in early trading, as Middle East negotiations remain deadlocked. U.S. West Texas Intermediate futures were up less than 0.1% at $86.59 a barrel, while Brent crude rose 0.17% to $92.92.", "source": "CNBC Top News", "pub_date_str": "12 Nov 2026, 01:08 PM IST", "pub_date_relative": "50m ago", "cfa_topics": ["Economics", "Fixed Income", "Derivatives", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "China's Ministry of State Security thrust into the spotlight by Nvidia CEO affair", "full_content": "From recruitment of U.S. students to allegations surrounding Nvidia's Jensen Huang affair, reports point to one Chinese intelligence agency: the Ministry of State Security.\n\nThe opaque government entity \u2014 which lacks an official website other than one supporting whistleblowers \u2014 has gained prominence with Beijing's growing emphasis on national security since 2023. The ministry oversees a range of provincial and national-level bureaus, including for intelligence gathering.\n\nWhile the MSS is not Beijing's only intelligence entity , the ministry has often been named in high-profile cases. Following hacking attempts on U.S. entities, the U.S. Treasury Department has in recent years sanctioned Chinese entities and individuals it alleges are affiliated with MSS.\n\nThe Financial Times and The New York Times this month reported, citing sources, that U.S. government intelligence believe the MSS recruited businesswoman Alice Huang to gather information on Nvidia CEO Jensen Huang. The two are not related. Jensen Huang admitted to an affair over the weekend, but it remains unclear whether any sensitive information was shared.\n\nThe MSS earlier this year approached an individual who knows Alice Huang \u2014 to find out more information about her business and connections, The FT reported Wednesday, citing the person who was questioned .", "source": "CNBC Finance", "pub_date_str": "12 Nov 2026, 12:58 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "147% up in five years! Multibagger stock TGV SRAAC rally 8% today | What's behind the rally? Q2 results, returns", "full_content": "Vaamanaa Sethi Published 12 Nov 2026, 12:55 PM IST Prefer Livemint on Google Multibagger chemical stock TGV SRAAC jumped over 7.71% in Thursday's trading session after the company reported strong financial results for the quarter ending on 30 September, 2026, on Wednesday.\n\nTGV SRAAC share price opened at \u20b9 125.50 apiece on BSE today, as compared to previous close of \u20b9 120.65 on Wednesday and touched an intraday high of \u20b9 137.80 on November 12.\n\nTGV SRAAC reported a strong performance in the second quarter of FY27, with its net profit rising 50.4% year-on-year (YoY) to \u20b9 55.72 crore, compared to \u20b9 37.05 crore in the corresponding quarter of the previous financial year.\n\nThe net profit figure includes discontinued operations. The company's profit before tax (PBT) increased to \u20b9 76.84 crore in Q2 FY27 from \u20b9 49.89 crore in Q2 FY26.\n\nThe company's revenue from operations increased 18.1% YoY to \u20b9 590.47 crore in Q2 FY27, compared to \u20b9 499.94 crore in the year-ago quarter. Total income also rose to \u20b9 596.57 crore from \u20b9 503.18 crore in Q2 FY26, reflecting growth in its overall operating performance.\n\nOn the operational front, TGV SRAAC reported EBITDA of \u20b9 111 crore for the September quarter, registering a 19.4% YoY increase. Its EBITDA margin stood at 18.78%, indicating an improvement in operating earnings alongside higher revenue.\n\nOverall, the company's Q2 FY27 performance reflected growth across revenue, operating earnings and profitability, with net profit recording a sharper increase than revenue during the quarter.\n\nShares of TGV SRAAC have delivered positive returns across most time periods, gaining 10.45% over the past week and 15% in the last two weeks. However, the stock's gains moderated to 5.70% over the past month, indicating some consolidation after its recent rally.", "source": "LiveMint Markets", "pub_date_str": "12 Nov 2026, 12:55 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Netweb Technologies share price rebounds over 13% in four sessions after long downtrend: Relief rally or trend reversal?", "full_content": "Dhanya Nagasundaram Published 12 Nov 2026, 12:47 PM IST Prefer Livemint on Google Netweb Technologies India shares gained over 3% on Thursday, 12 November, extending their recovery after a prolonged downtrend. The stock has rebounded more than 13% over the past four trading sessions, signalling a pickup in buying interest. However, it remains under pressure over a broader period, declining 16.92% in a month and 14.12% over three months. On a positive note, the stock has gained 3.40% over six months and is up 35.11% so far in 2026.\n\nNetweb Technologies, a domestic provider of high-performance computing solutions, reported a sharp rise in profitability for the September quarter of FY27, buoyed by strong demand for artificial intelligence (AI) infrastructure.\n\nThe company\u2019s consolidated profit after tax (PAT) surged to \u20b9 136.7 crore in Q2 FY27, compared with \u20b9 31.4 crore in the corresponding quarter last year. Revenue from operations also registered a multifold increase, climbing to \u20b9 1,323.3 crore from \u20b9 303.7 crore a year earlier.\n\nNetweb\u2019s order book stood at \u20b9 2,629 crore as of 30 September 2026, providing visibility for business growth in the coming quarters.\n\nChairman and Managing Director Sanjay Lodha said Q2 FY27 marked another record quarter for the company, with its highest-ever quarterly revenue from operations and PAT.\n\nHe added that Netweb\u2019s PAT for the first half of FY27 reached \u20b9 222 crore, exceeding its full-year FY26 profit of \u20b9 205.8 crore within just six months.\n\nAI Systems remained the biggest growth contributor, generating \u20b9 773.1 crore, or 58.4% of the company\u2019s Q2 revenue from operations. High-Performance Computing (HPC) and Private Cloud also delivered strong contributions of \u20b9 248.2 crore and \u20b9 244.8 crore, respectively.\n\nLodha said the company\u2019s order book stood at \u20b9 2,629 crore at the end of September, with an additional L1 position of \u20b9 652.5 crore, strengthening its revenue visibility for the coming quarters.", "source": "LiveMint Markets", "pub_date_str": "12 Nov 2026, 12:47 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "HAL Cheapest Pure-Play Defence Stock Despite Sector-Leading Position, Says CLSA; Hikes Target Price", "full_content": "CLSA maintained its Outperform' rating and raised its 12-month HAL share price target to Rs 5,625 from Rs 5,481 earlier. The revised target implies an upside potential of nearly 14% from Wednesday's closing price.", "source": "NDTV Profit", "pub_date_str": "12 Nov 2026, 12:47 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Thermax\u2019s H2 recovery bet runs into old execution hurdles", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nThermax\u2019s share price has more than halved from its 52-week high of \u20b9 5,277.80 seen in June, weighed down by continued earnings disappointment.\n\nIn the September quarter (Q2FY27), deferred higher-margin international shipments, worth \u20b9 200\u2013300 crore, capped consolidated revenue growth at 11% year-on-year (y-o-y) to \u20b9 2,756 crore.\n\nManagement expects H2FY27 revenue to touch \u20b9 7,000 crore versus \u20b9 5,059 crore in H1. Revenue growth will be buoyed by export orders and lower contribution from low-margin legacy projects nearing completion.\n\nOrder inflows fell 8% y-o-y to \u20b9 3,259 crore, driven by weak intake in the industrial products segment. H1FY27 order inflows slid 4% to \u20b9 6,100 crore, taking the order book as of September to \u20b9 14,250 crore, up 16%.\n\nFrom its earlier guidance of over 10% growth in FY27 order inflows, Thermax now anticipates high single-digit growth. It expects at least one supercritical boiler order in H2.\n\nHowever, JM Financial Institutional Securities noted that even if one large thermal power win is factored in, FY27 order inflow growth is likely to be only 5%.\n\n\u201c Investors are occasionally enthused about the potential for order wins in the thermal power space, which seems fair. However, given the chronic execution issues Thermax continues to face, especially in PSU projects in India, we will be wary of such wins unless management addresses fundamental project engineering and execution issues,\u201d it said.", "source": "LiveMint Markets", "pub_date_str": "12 Nov 2026, 12:42 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Bloom Energy shares jump 13%: Can the AI power stock sustain its rally?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News Powered By Bloom Energy shares jump 13%: Can the AI power stock sustain its rally? Written by Anupam Nagar , ETMarkets.com | Nov 12, 2026, 01:04:36 PM IST 1 / 8 Bloom Energy shares surge 13% Bloom Energy shares rally 13% on Wednesday, November 11, after upbeat results and an improved revenue outlook from CoreWeave ease concerns about a slowdown in AI infrastructure spending. The stock records its strongest single-day percentage gain in nearly four months. (Sources: 24/7 Wall St, MarketWatch, BigGo Finance)\n\nThe rally follows CoreWeave's third-quarter results, which show revenue of $3.66 billion, up 168% year on year. The AI cloud computing company also reports a backlog of around $132.5 billion and raises its 2026 revenue forecast to $13 billion-$13.3 billion, signalling continued demand for AI infrastructure.\n\nBloom Energy supplies on-site power systems to data centres, making it a key beneficiary of the AI infrastructure expansion. Strong demand for computing capacity encourages data centre operators to continue investing in power infrastructure. CoreWeave's upbeat outlook therefore eases concerns about potential delays or cancellations of projects that could affect Bloom's order pipeline.\n\nDespite Wednesday's 13% rally, Bloom Energy shares remain 39% below their June 22 record closing high of $345.85. The stock had fallen 52% from that peak by November 5, marking the third time since its 2018 IPO that it had lost more than half its value from a previous high.\n\nHistorical data offer some encouragement to investors. According to 24/7 Wall St, Bloom Energy has recorded 40 sessions in which its shares jumped at least 12% while trading 35% or more below their previous peak. In 28 of 36 comparable instances, the stock traded higher six months later, with a median gain of 57%.", "source": "Economic Times Markets", "pub_date_str": "12 Nov 2026, 12:38 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Karan Johar Says He Started Koffee With Karan To Cope With Father Yash Johar's Death", "full_content": "Karan Johar revealed that Koffee With Karan was initially started as a way to distract himself from the emotional loss of his father, Yash Johar.", "source": "NDTV Profit", "pub_date_str": "12 Nov 2026, 12:38 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Ramayana Box Office Collection Day 8 Live: Ranbir's Film Off To A Good Start, Check Earnings", "full_content": "Ranbir Kapoor, Sai Pallavi and Yash starrer 'Ramayana: Part One' maintains its box office momentum on Day 8 with strong audience turnout.", "source": "NDTV Profit", "pub_date_str": "12 Nov 2026, 12:29 PM IST", "pub_date_relative"
