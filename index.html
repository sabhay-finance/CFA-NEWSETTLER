l be key to converting this pipeline into growth.\n\nAccording to news reports, during its earnings call, Data Patterns' management expressed confidence in delivering a stronger performance in the second half of FY27, citing its healthy order book and expectations of improved execution.\n\nThe company has retained its FY27 guidance of 20\u201325% revenue growth and 35\u201340% EBITDA margins. This comes even as revenue declined 31% year-on-year in the first half of FY27 and EBITDA margin stood at 25%.", "source": "LiveMint Markets", "pub_date_str": "10 Nov 2026, 12:50 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Nvidia, CEO Jensen Huang Face Shareholder Lawsuit Over Alleged China Spy Connection", "full_content": "Nvidia shares fell 4.3% on Monday, wiping out approximately $190 billion in market value, as the chipmaker faced a shareholder lawsuit over allegations involving CEO Jensen Huang.", "source": "NDTV Profit", "pub_date_str": "10 Nov 2026, 12:48 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Sensex, Nifty 50 rise over 6% in past 5 sessions: More rally from tomorrow or profit booking will dent returns hopes?", "full_content": "Sensex, Nifty 50 outlook : The Indian stock market is heading into Wednesday's trading session on a strong note, with the Sensex and Nifty 50 having surged over 6% in the past five trading sessions, raising hopes of further gains on Dalal Street. The benchmark indices have reclaimed crucial levels and climbed to their highest closing levels in more than eight months, supported by falling crude oil prices, renewed foreign investor buying and improving global sentiment.\n\nHowever, after a sharp rally, investors are now questioning whether the market can extend its gains or if profit booking will emerge at higher levels. The immediate trading direction will be closely linked to global market cues, crude oil movements, foreign institutional investor (FII) flows and upcoming inflation data.\n\nOn Monday, November 9, the Sensex advanced 107.25 points, or 0.13%, to close at 81,106.65, while the Nifty 50 gained 58.25 points, or 0.23%, to settle at 25,044.65. Both benchmarks ended at their highest closing levels since February 27, 2026. The Indian stock market remained closed on Tuesday, November 10, on account of Diwali-Balipratipada. Trading will resume on Wednesday, November 11.\n\nSeveral domestic and global factors have supported the recent recovery in Indian equities, helping benchmark indices register their strongest weekly performance.\n\nThe decline in international crude oil prices has emerged as one of the biggest catalysts for the Indian stock market rally. Brent crude prices fell nearly 14% last week to around $99 per barrel, easing concerns over India's import bill, inflation and corporate input costs.\n\nForeign investor buying has provided another major boost to domestic equities. Foreign investors have purchased Indian shares worth more than $4.1 billion so far in November, marking their biggest monthly inflows since September 2024.\n\nThe ongoing September-quarter earnings season has also supported investor sentiment.", "source": "LiveMint Markets", "pub_date_str": "10 Nov 2026, 12:43 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "LG Electronics is moving beyond its two-track strategy", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nLG Electronics India's September quarter (Q2FY27) performance has strengthened its growth narrative, even as the road ahead opens up new avenues.\n\nRevenue grew almost 20% year-on-year to \u20b9 7,380 crore, while Ebitda margin expanded 63 basis points to 9.5%. A richer product mix and operating leverage more than offset elevated commodity prices and higher go-to-market investments.\n\nLG\u2019s two-track strategy of premiumization and mass-premium penetration continued to deliver broad-based growth. Home appliances and air solutions revenue grew 21% to \u20b9 4,772 crore, with double-digit growth across washing machines, refrigerators and air conditioners. Home entertainment revenue grew 17% to \u20b9 2,608 crore, marking its third consecutive quarter of double-digit growth. Televisions larger than 55 inches led the segment, contributing over half of TV revenue.\n\nPremiumization through products such as French-door refrigerators and large-capacity washing machines can improve the product mix, even as LG\u2019s Essential series strengthens volume growth, helps capture first-time buyers, creates an upgrade pipeline for premium products and enables expansion into international markets.\n\nThe company\u2019s global presence has expanded to 68 countries, while its information display business has opened up B2B opportunities across corporate offices, retail, hospitality and public spaces.\n\nIts entry into vehicle solutions, spanning telematics, automotive displays, digital cockpits and connectivity solutions, opens up another B2B opportunity. Manufacturing at its Sri City facility can leverage LG\u2019s established global technology and manufacturing ecosystem.\n\nBut much depends on sustaining margins. Raw material costs have increased 20% from a year ago, leading to a 52-basis-point contraction in gross margin.", "source": "LiveMint Markets", "pub_date_str": "10 Nov 2026, 12:31 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Trump says Iran war to end 'fairly soon,' plays down prospects of new strikes", "full_content": "U.S. President Donald Trump said on Monday that the war with Iran could end \"fairly soon,\" adding that Tehran was \"talking very politely\" with Washington.\n\nTrump told reporters in the White House Monday, after a meeting with Qatari Prime Minister Sheikh Mohammed bin Abdulrahman Al Thani, that \"We're seeing momentum toward the end of this conflict. I think it's going to be ending fairly soon.\"\n\n\"Iran militarily is effectively over,\" Trump said, citing the destruction of its navy and surging inflation that he said has hollowed out its economy.\n\nQatar, Saudi Arabia, UAE, Bahrain, Kuwait would \"prefer the status quo\" which involves maintaining the naval blockade against Iran and \"Operation Iron Gate\" \u2014 a task force announced on Saturday aimed at preventing Iran from using ground routes to transport advanced weapons and other materials \u2014 Trump said in a Truth Social post.\n\nHe reiterated that Iran would not be allowed to have a nuclear weapon and kept the door open for potentially resuming strikes should circumstances change. \"America is 'docked and loaded' and ready to go,\" he said, though caveating that new strikes were \"quite unlikely.\"\n\nThe conflict, now in its ninth month, has driven a surge in fuel prices, hitting nearly every sector of the global economy.\n\nThe U.S. had reportedly planned for a potential increase in naval forces in the Middle East in the run-up to the midterm elections, with Trump hinting at escalating the conflict after the results.\n\nThe administration has since toned down the war rhetoric after bruising midterm election results that saw Republicans lose both chambers of Congress as voters expressed frustration with soaring living costs stemming from the war.", "source": "CNBC Top News", "pub_date_str": "10 Nov 2026, 12:30 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Asian Stocks to Rally on US Tech Surge, Oil Slump: Markets Wrap - Bloomberg.com", "full_content": "Asian Stocks to Rally on US Tech Surge, Oil Slump: Markets Wrap Bloomberg.com S&P 500 futures rise as traders brace for crucial consumer inflation report: Live updates CNBC Stock market today: Nasdaq surges despite Nvidia stock slide, Dow and S&P 500 rally as AI tech trade rises Yahoo Finance Nvidia, AMD, CoreWeave, Coherent, First Solar, Trade Desk, and More Stocks That Explain Today\u2019s Market Barron's Wall St jumps as oil slide cools inflation worries; Nvidia slumps Reuters", "source": "Google News Business", "pub_date_str": "10 Nov 2026, 12:29 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "UPI charges after Diwali: Will customers pay extra on payments above \u20b92,000? NPCI's MDR rollout likely in Nov", "full_content": "With Diwali celebrations over and Bhai Dooj falling tomorrow, 11 November, attention is now turning to when the Merchant Discount Rate (MDR) on person-to-merchant (P2M) UPI transactions will come into effect.\n\nThe National Payments Corporation of India ( NPCI ) had earlier deferred the implementation beyond its original 15 October start date.\n\nIn an official statement issued on 13 October, NPCI said the revised charges would be implemented immediately after Diwali, with the effective date to be announced separately.\n\nHowever, the festive period is now drawing to a close, and merchants and customers are awaiting clarity on when the new MDR rules will take effect.\n\nNPCI, in its 13 October statement, said that the UPI and Services Steering Committee had decided to defer the rollout to avoid introducing additional transaction costs during the festive season.\n\nNPCI said, \u201cKeeping in mind the festive season, Merchant Discount Rate (MDR) on select Person-to-Merchant (P2M) UPI transactions, shall be implemented immediately post Diwali at a date to be notified separately.\u201d\n\nAccording to NPCI's FAQs released on 15 September, an MDR of 0.4% will apply to eligible P2M UPI transactions exceeding \u20b9 2,000. However, the charge will be capped at \u20b9 300 for transactions of \u20b9 75,000 and above.\n\nFor example, a merchant receiving a UPI payment of \u20b9 1 lakh would otherwise incur a 0.4% charge of \u20b9 400. However, with the prescribed cap, the MDR would be limited to \u20b9 300.", "source": "LiveMint Money", "pub_date_str": "10 Nov 2026, 12:23 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Quantitative Methods"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "Jensen Huang affair puts Nvidia's future at risk, with no clear successor to the renowned CEO", "full_content": "Nvidia CEO Jensen Huang 's admission of an affair with a purported Chinese spy has raised questions about his future at the company, and what happens if the 63-year-old co-founder, who built the chipmaker into one of the most valuable businesses on the planet, is forced out.\n\nShares of Nvidia sank more than 4% on Monday, even as the broader market rallied sharply, after Huang acknowledged the affair in a message to staff on Sunday, and said that the board was launching an investigation into whether he was targeted by a foreign intelligence agency. The board said it has \"confidence in Jensen,\" and that it has \"no reason to believe that either national security or Nvidia secrets were compromised.\"\n\nThe New York Times first reported that the Chinese businesswoman was a spy for China's Ministry of State Security, according to people briefed on the intelligence circulated in a memo among the Trump administration in the spring. China has called the allegation a smear.\n\nWhile Nvidia says Huang will continue to lead the company during the probe, pressure is rapidly mounting on the chipmaker, whose technology has powered the first four years of the generative artificial intelligence boom. Leaders from both parties are calling for briefings, and Democrats poised to take control of both houses of Congress are calling for investigations and new legislation \"to stop advanced AI chips from fueling China's military,\" Sen. Elizabeth Warren of Massachusetts wrote in a post on X on Monday.\n\nHuang has outsized influence over Nvidia, and is the sole face of the company with no clear second-in-command.", "source": "CNBC World Economy", "pub_date_str": "10 Nov 2026, 12:22 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Asian stocks ride tech rally higher as oil falls", "full_content": "Asian stocks were on course for their biggest two-day advance in more than three months as a resurgent tech rally and falling oil prices lifted sentiment.\n\nMSCI Inc.\u2019s gauge of regional equities climbed 1.8%. That\u2019s after US benchmarks capped their best session in about seven months on Monday, as dip buyers stepped in following last week\u2019s technology-led selloff. South Korea\u2019s Kospi Index jumped 4% to be the top performer in Asia on Tuesday, followed by benchmarks in Japan and Taiwan. Futures for the S&P 500 Index edged up 0.1%, while those for the Nasdaq 100 fell 0.2%.\n\nElsewhere, Brent crude slipped further to trade below $92 a barrel after slumping almost 6% on Monday to close at its lowest since August. President Donald Trump said further strikes on Iran wouldn\u2019t be necessary, an indication that he\u2019s winding down the conflict after the US midterm results underscored its unpopularity.\n\nThe Nasdaq 100 climbed 3.4% on Monday and a gauge of chip stocks in the US surged nearly 7%. That\u2019s even as Nvidia Corp. slid 4.3% amid a probe into Chief Executive Officer Jensen Huang after his admission of an affair with a woman identified in a series of reports as a suspected Chinese spy.\n\nThe rally in global tech stocks follows a tumultuous week that saw chipmakers bear the brunt of a selloff sparked by worries that the Democrats\u2019 sweep of Congress in the US midterms may lead to tougher oversight of the AI sector. The durability of the rebound remains in question, with regulatory risks now layered on top of concerns that were weighing on the sector\u2014stretched valuations, soaring capital spending and uncertainty over the payoff from massive AI investments.\n\n\u201cThe sharp drop in oil prices has given markets some much-needed breathing room. It\u2019s eased some of the inflation pressure,\u201d said Dilin Wu, a strategist at Pepperstone Group. \u201cWe still need to see whether buying interest can hold up.", "source": "LiveMint Markets", "pub_date_str": "10 Nov 2026, 12:00 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Equity Investments", "Derivatives", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "India Win Two Gold Medals At Junior Astronomy Olympiad, Grab 5 In Total", "full_content": "Overall 104 students from 25 countries, and 53 team leaders participated in the 5th International Olympiad on Astronomy and Astrophysics for Juniors 2026", "source": "NDTV Profit", "pub_date_str": "10 Nov 2026, 11:58 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "TCPL Packaging shares: High-conviction stock! 60% returns in 6 months, InCred sees 18% more gain | Check target price", "full_content": "Brokerage firm InCred Equities has retained its high-conviction 'ADD' rating on TCPL Packaging shares, with a revised target price of \u20b9 5,270, implying an upside potential of nearly 18% from the stock's latest closing price of \u20b9 4,471 on November 9. The brokerage's positive outlook comes on the back of improving core business momentum, strong September-quarter performance and the company's planned entry into the lithium-ion battery separator film business.\n\nIn its latest research report, InCred Equities said TCPL Packaging's growth momentum has improved across its paperboard and flexible packaging segments, supported by healthy customer demand, better sales mix and price hikes. The brokerage also sees the company's new battery separator film venture as a potential long-term growth driver, with opportunities arising from India's expanding electric vehicle and energy storage ecosystem.\n\nTCPL Packaging reported a strong performance for the September quarter of FY27, with consolidated sales growing 21.8% year-on-year and 13.8% sequentially to \u20b9 560 crore. The revenue figure was 8% higher than InCred Equities' estimates. Revenue growth for the first half of FY27 stood at 19.1%.\n\nAccording to InCred Equities, this marked a significant acceleration from the 16.1% growth recorded in the June quarter and the subdued performance during Q2 and Q3 FY26, when exports were affected by geopolitical tensions.\n\nThe brokerage attributed the improvement to stable domestic FMCG demand, a recovery in exports on a lower base, better sales mix and price hikes that supported realisations. Management also highlighted healthy demand across both paperboard (folding cartons) and flexible packaging businesses.\n\nMeanwhile, the company's consolidated EBITDA stood at \u20b9 100.1 crore in Q2 FY27, with an EBITDA margin of 17.7%.", "source": "LiveMint Markets", "pub_date_str": "10 Nov 2026, 11:54 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Why Rocket Lab shares fell despite record revenue and booming Neutron demand", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News Powered By Why Rocket Lab shares fell despite record revenue and booming Neutron demand Written by Anupam Nagar , ETMarkets.com | Nov 10, 2026, 12:29:02 PM IST 1 / 9 Rocket Lab shares tumble after Q3 earnings Rocket Lab shares fell more than 6% in after-hours trading on November 9 after the space company reported a wider-than-expected quarterly loss. The decline came despite record revenue, a growing order backlog and rising demand for its upcoming Neutron rocket. (Sources: Asianet Newsable, TradingKey)\n\nRocket Lab reported third-quarter revenue of $267.83 million, up 73% from a year earlier and above analysts' estimates of around $257 million. It marked the company's sixth consecutive quarter of record revenue, reflecting growth across its launch and space systems businesses.\n\nThe company reported an adjusted loss of 12 cents per share, wider than analysts' expectations of a 7-cent loss. Higher research and development and operating expenses weighed on profitability, raising concerns among investors about the cost of scaling its business.\n\nRocket Lab's backlog increased 52% sequentially to approximately $3.57 billion at the end of the September quarter. The company expects around $1.17 billion of this amount to convert into revenue over the next 12 months, providing visibility into future business.\n\nRocket Lab secured more than $515 million in Neutron launch contracts during the quarter, covering eight missions. The company raised the rocket's base launch price to $70 million from $55 million for several missions, reflecting strong demand and tightening launch capacity.\n\nNeutron's launch backlog has reached 16 missions even before its maiden flight.", "source": "Economic Times Markets", "pub_date_str": "10 Nov 2026, 11:47 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "IPO Lock-in Expiry: $35 billion in shares set to unlock across 116 companies; Jio, NSE, Zetwerk in focus", "full_content": "SHIPROCKET MILKYMIST SBIFUNDS null Dhanya Nagasundaram Published 10 Nov 2026, 11:47 AM IST Prefer Livemint on Google The upcoming IPO lock-in expiries could put nearly $35 billion worth of shares on investors' radar over the next few months, as pre-listing shareholder lock-in periods across 116 companies are set to end between 9 November 2026 and 26 February 2027.\n\nThe list includes several prominent recent listings, such as Jio Platforms , Zetwerk Manufacturing Business, Shiprocket , Milky Mist Dairy Food , SBI Funds Management and the National Stock Exchange of India (NSE). However, unlocking shares does not necessarily mean they will be sold in the market. A substantial portion of the shares is held by promoters and their groups, who may continue to hold their stakes.\n\nAccording to an analysis by Nuvama Institutional Equities, the aggregate value of shares becoming eligible for trading during this period is estimated at around $35 billion. The brokerage has analysed promoter and non-promoter shareholdings across companies listed up to 5 November 2026.\n\nHere's a closer look at the upcoming IPO lock-in expiries, the companies in focus and the shareholding blocks set to unlock.\n\nIPO lock-in periods prevent certain shareholders, including promoters, anchor investors and pre-listing investors, from selling their shares for a specified period after a company's listing. Once the restriction ends, these shareholders become eligible to sell their holdings, potentially increasing the supply of shares in the market.\n\nNuvama Institutional Equities has identified 116 companies whose pre-listing shareholder lock-ins are scheduled to expire between 9 November 2026 and 26 February 2027. The aggregate value of these shares is estimated at around $35 billion.\n\nHowever, the brokerage cautioned that the entire unlocked shareholding should not be viewed as potential selling pressure, as a significant portion is held by promoters and promoter groups.", "source": "LiveMint Markets", "pub_date_str": "10 Nov 2026, 11:47 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Derivatives"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Zerodha CEO Nithin Kamath on cryptocurrency, prediction markets boom: \u2018Nothing expands the markets like greed, FOMO'", "full_content": "Nithin Kamath Tweet : The rapid expansion of speculative trading avenues in the US since the COVID-19 pandemic has fundamentally changed financial markets, bringing cryptocurrencies, prediction markets and several new asset classes into the mainstream, according to Zerodha co-founder and CEO Nithin Kamath.\n\nIn a post on X, Kamath reflected on how the market landscape has evolved, from the emergence of zero-day options before the pandemic to the growth of crypto derivatives, stablecoins, non-fungible tokens (NFTs), decentralised finance (DeFi) and prediction markets.\n\nKamath argued that the pace of change in US financial markets since the pandemic had been particularly striking, with several products that were once considered niche now attracting mainstream participation.\n\n\"The rate at which the US markets have changed (mutated) since COVID is nuts. Before COVID, the last major \"innovation\", if you want to call it that, was 0-day options. But since then, you've had crypto trading, and with that, stablecoins, derivatives, NFTs, and DeFi, not to forget shitcoins,\" said Zerodha CEO Nithin Kamath said in a post on X.\n\nHe noted that cryptocurrency had moved beyond its earlier image as a fringe asset class, with trading increasingly supported by established financial products and regulatory acceptance. Crypto futures and exchange-traded funds ( ETFs ) have helped bring digital assets closer to traditional financial markets, while the broader ecosystem has expanded to include stablecoins, derivatives, NFTs and DeFi.\n\nPrediction markets have followed a similar trajectory. Although they are often compared with betting and gambling because users speculate on the outcomes of future events, Kamath said their growing popularity had made them an increasingly important part of the financial ecosystem.", "source": "LiveMint Markets", "pub_date_str": "10 Nov 2026, 11:32 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Derivatives", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Penny stocks look cheap, but the risks can be expensive", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nRecently, Securities and Exchange Board of India (Sebi) chairperson Tuhin Kanta Pandey said the regulator is working on delisting companies with no economic activity, particularly penny stocks.\n\n\u201cThese companies pose a potential danger to investors, and therefore, it is necessary to remove them from the listed space. We are making efforts towards their delisting,\u201d the Sebi chairman said.\n\nPenny stocks are popular among retail investors. The lure of making large gains quickly with a small investment draws many to these shares. But their low prices can mask weak business fundamentals, poor liquidity and the risk of market manipulation. Here is a look at the risks they pose.\n\nPenny stocks are typically priced in single digits to low double digits. Several retail investors see a low share price as an opportunity to buy a stock near its bottom. But this is a flawed understanding.\n\nDeepak Jasani, an independent market expert, says several penny stocks have lost value during difficult periods. \u201cInvestors think that because prices are so cheap, it is unlikely for such stocks to see further correction and hence there is a margin of safety and the potential for profit is large. But this is not the right understanding of margin of safety,\u201d he added.\n\nIn several cases, these stocks may turn out to be value traps. A stock may appear cheap on price-to-earnings multiples or other valuation parameters, but remain undervalued for years because its deteriorating business fundamentals are beyond repair.\n\nAnother risk is a lack of liquidity , which makes penny stocks more susceptible to market manipulation and sharp price swings.", "source": "LiveMint Money", "pub_date_str": "10 Nov 2026, 11:13 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "TSMC's October sales jump as global chip boom rolls on", "full_content": "Taiwan Semiconductor Manufacturing Co . on Tuesday reported October revenue of 586.89 billion New Taiwan dollars ($17.88 billion), up 59.7% from a year earlier and up 14.7% from the previous month.\n\nThe world's largest contract chipmaker benefited from strong demand for advanced semiconductors, as major technology companies continue to invest heavily in artificial intelligence.\n\nLast month, TSMC reported a record third-quarter net profit of NT$763.1 billion, beating estimates while revenue came at NT$1.49 trillion.\n\nShares of TSMC on 10 Nov.     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
