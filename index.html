    const allData = {"general": [{"title": "Stocks fall as Brent crude trades above $100 per barrel: Live updates", "full_content": "Stocks fell on Wednesday as rising oil prices continued to rattle investors by stoking fears of higher inflation.\n\nThe Dow Jones Industrial Average dropped 300 points, or 0.6%. The S&P 500 shed 0.3%, while the Nasdaq Composite fell 0.5%.\n\nOil prices rose as escalating tensions between the U.S. and Iran fuel concerns over further disruptions to Middle East energy supplies. Futures for Brent crude , the international benchmark, added about 3% to trade above $100 a barrel for the first time since July. U.S. West Texas Intermediate futures gained 3% as well to above $95.\n\nThe latest rise in oil extends its gain from the prior trading day , which put downward pressure on the three major averages in their first session of a holiday-shortened trading week. Notably, the Dow saw its worst day in almost three weeks.\n\nThe stock market was dark on Monday in observance of the Labor Day holiday.\n\nThe 10-year U.S. Treasury yield briefly climbed above the closely watched 4.8% level on Tuesday as rising oil prices added to concerns about inflation. The action in yields further weighed down stocks in the session. The 10-year yield was last little changed Wednesday.\n\nIt's \"a little bit of a speed bump,\" said Kara Murphy, investment chief at Kestra Investment Management, on CNBC's \" Closing Bell .\" \"There's a little bit less to focus on with the earnings front, so I think the market has sort of shifted its attention now to the risk side.\"\n\nThe three major averages began Wednesday's session in the red.", "source": "CNBC Top News", "pub_date_str": "09 Sep 2026, 07:05 PM IST", "pub_date_relative": "1m ago"}, {"title": "Andreessen- and Thiel-backed defense startup opens U.S. missile factory as it exits stealth", "full_content": "Defense tech startup Covenant on Wednesday announced the opening of a 105,000-square-foot factory in Dallas to accelerate lower-cost missile manufacturing for the U.S. military.\n\nThe startup, which is coming out of stealth and is backed by Andreessen Horowitz, Peter Thiel 's Founders Fund, Lux, 8VC, Aleph and Lightspeed, also announced $250 million in funding over three rounds.\n\n\"What we're seeing now is an understanding that new market entrants can play a critical role in the defense ecosystem, and we're seeing that in this administration,\" Abby Denburg, Covenant's president and chief growth officer, told CNBC's Morgan Brennan .\n\nFounded in 2024, Covenant's Anthem long-range heavy-payload cruise missiles offer another option for the U.S. military in a class of weapons dominated by the defense primes, such as RTX's Tomahawk. Covenant said the Anthem is a fraction of the cost of legacy systems.\n\nThe company said its Dallas factory will produce 1,000 of its Anthem long-range missiles in its first year, beginning serial production in Q1 2027, eventually scaling to 5,000 annually.\n\nThat output is sorely needed as the war in Iran stretches into its seventh month and the U.S. weapons stockpile rapidly dwindles, according to multiple reports.\n\nDenburg noted the need for high-tech weapons systems and the growth in \"short-range, low payload\" drones that have risen to prominence in the Russia-Ukraine war.\n\n\"There is a gap in the middle of that for affordable mass and strategic range, and that's the gap that Anthem was filling,\" Denburg said, adding that the company wants to lower costs without sacrificing payloads.", "source": "CNBC World Economy", "pub_date_str": "09 Sep 2026, 07:01 PM IST", "pub_date_relative": "5m ago"}, {"title": "Oil hits $100 for first time since July", "full_content": "Brent crude advances as escalation in US-Iran war feeds fears of renewed global supply crunch", "source": "FT Markets", "pub_date_str": "09 Sep 2026, 07:00 PM IST", "pub_date_relative": "6m ago"}, {"title": "Apple is expected to announce foldable iPhone. What it means for the stock", "full_content": "Despite the hype, investors don't a big move \u2014 and some think the news could prompt some to offload shares.", "source": "CNBC Top News", "pub_date_str": "09 Sep 2026, 06:57 PM IST", "pub_date_relative": "10m ago"}, {"title": "Baker Hughes raises annual forecasts after Chart acquisition", "full_content": "", "source": "Investing.com News", "pub_date_str": "09 Sep 2026, 06:54 PM IST", "pub_date_relative": "12m ago"}, {"title": "MicroVision unit wins government contractor semiconductor deal", "full_content": "", "source": "Investing.com News", "pub_date_str": "09 Sep 2026, 06:54 PM IST", "pub_date_relative": "12m ago"}, {"title": "Tractor Supply at Barclays conference: growth bets amid pressure", "full_content": "", "source": "Investing.com News", "pub_date_str": "09 Sep 2026, 06:54 PM IST", "pub_date_relative": "12m ago"}, {"title": "Goodwin shares fall 8% despite \u00a31.1 bln engineering unit sale talks", "full_content": "", "source": "Investing.com News", "pub_date_str": "09 Sep 2026, 06:54 PM IST", "pub_date_relative": "13m ago"}, {"title": "Bessent says, \u2018I am the house now.\u2019 What that means for the yen \u2014 and U.S. stocks.", "full_content": "Treasury Secretary Scott Bessent has never been accused of being a wallflower, but speaking in front of Southern Methodist University\u2019s business school on Tuesday night, he made perhaps the most strident comment of his government career.", "source": "MarketWatch Top Stories", "pub_date_str": "09 Sep 2026, 06:54 PM IST", "pub_date_relative": "13m ago"}, {"title": "Corn futures decline ahead of USDA supply report on Friday", "full_content": "", "source": "Investing.com News", "pub_date_str": "09 Sep 2026, 06:53 PM IST", "pub_date_relative": "13m ago"}, {"title": "New Hampshire picks Pappas and Sununu in primary for key open Senate seat", "full_content": "New Hampshire voters on Tuesday nominate candidates for a key U.S. Senate race to replace the retiring Democratic Sen. Jeanne Shaheen . Both Democrats and Republicans are aiming to win the seat in their quest to control the Senate in the next Congress.\n\nRep. Chris Pappas , who led the fundraising race and has represented the state's 1st Congressional District since 2019, secured the Democratic nomination. He faced a challenge from scientist and democratic socialist Karishma Manzur , who had closed in slightly on Pappas in recent public polls.\n\nOn the Republican side, former U.S. Sen. John Sununu, of New Hampshire, secured the nomination over former U.S. Sen. Scott Brown, of Massachusetts. Shaheen defeated both Sununu and Brown in different years, but Sununu \u2014 whose brother Chris Sununu was a highly popular governor of the Granite State until 2025 \u2014 is seen as a formidable candidate in what is shaping up to be a tough election cycle for Republicans as the Iran war drags on and President Donald Trump's popularity slumps.\n\nThe New Hampshire Senate race is critical to both parties ahead of November's midterm election. Democratic hopes of flipping the Senate would dim if the party can't hold on to Shaheen's seat, as it needs to net four additional seats to flip the upper chamber. If Republicans flip the seat, it would provide a cushion for the GOP to hold on to its Senate majority by requiring Democrats to flip an additional seat.\n\nThe midterms will determine who controls Congress \u2014 and subpoena power \u2014 during the last two years of Trump's term. If Democrats flip one or both chambers, they are widely expected to launch sweeping investigations of the Trump administration that are likely to rope in companies that have done business with the administration.\n\nPappas, who has been endorsed by Shaheen and other top Democrats, such as U.S. Sen. Elizabeth Warren , of Massachusetts, has made anti-corruption efforts a top issue in his campaign.", "source": "CNBC Top News", "pub_date_str": "09 Sep 2026, 06:53 PM IST", "pub_date_relative": "13m ago"}, {"title": "Earnings call transcript: Nano-X Imaging Q2 2026 revenue miss sparks sharp premarket drop", "full_content": "", "source": "Investing.com News", "pub_date_str": "09 Sep 2026, 06:52 PM IST", "pub_date_relative": "14m ago"}, {"title": "Brent crude oil rises above $100 a barrel as Middle East conflict intensifies", "full_content": "Skip to navigation Skip to main content Skip to right column APPLE EVENT It's the first John Ternus-led annual event. Follow along here. Brent crude oil rises above $100 a barrel as Middle East conflict intensifies By Anushree Mukherjee and Robert Harvey Wed, September 9, 2026 at 9:24 AM EDT 4 min read CL=F By Anushree Mukherjee and Robert Harvey\n\nSept 9 (Reuters) - Brent crude futures breached $100 a barrel on Wednesday for the first time since July 24 as escalating attacks in the Middle East, including on tankers, stifled hopes of a normalisation of oil shipping in the region.\n\nThe move brought futures prices into line with physical crude and fuel markets, where prices \u200chave already been trading above the psychological threshold.\n\nFront-month Brent crude futures were up $2.74, or 2.8%, at $100.66 a barrel by 1315 GMT, after earlier touching $100.95. U.S. West Texas Intermediate crude was \u200cup $2.74, or 3%, at $95.77 a barrel, its highest level since early June.\n\nThe contracts were headed for their biggest daily rises in percentage terms since September 1.\n\nSince the Iran war began on February 28, Brent has surged as high as $126.41 a barrel, a peak \u200breached on April 30.\n\n\"The move towards and back above $100 Brent is reflecting a market that increasingly has to change its view on how long the Middle East crisis will continue to curb supply from the region,\" said Ole Hansen, head of commodity strategy at Saxo Bank.\n\nIn a sharp escalation of the six-month-old war in recent days, U.S. forces hit multiple Iranian oil tankers and Iran targeted a U.S. base in Jordan and attacked ships.", "source": "Yahoo Finance", "pub_date_str": "09 Sep 2026, 06:51 PM IST", "pub_date_relative": "15m ago"}, {"title": "Oddity Q2 2026 slides: revenue plunges 25% amid ad disruption", "full_content": "", "source": "Investing.com News", "pub_date_str": "09 Sep 2026, 06:51 PM IST", "pub_date_relative": "15m ago"}, {"title": "Fastly at Citi\u2019s 2026 Global TMT Conference: edge push gains traction", "full_content": "", "source": "Investing.com News", "pub_date_str": "09 Sep 2026, 06:50 PM IST", "pub_date_relative": "16m ago"}, {"title": "Figure Technology stock jumps after BofA upgrade to neutral", "full_content": "", "source": "Investing.com News", "pub_date_str": "09 Sep 2026, 06:50 PM IST", "pub_date_relative": "16m ago"}, {"title": "Bernstein cuts Lowe\u2019s stock price target on delayed home improvement recovery", "full_content": "", "source": "Investing.com News", "pub_date_str": "09 Sep 2026, 06:50 PM IST", "pub_date_relative": "16m ago"}, {"title": "Realizing Gains as MongoDB\u2019s (MDB) Competitive Landscape Shifts", "full_content": "Skip to navigation Skip to main content Skip to right column APPLE EVENT It's the first John Ternus-led annual event. Follow along here. Realizing Gains as MongoDB\u2019s (MDB) Competitive Landscape Shifts Soumya Eswaran Wed, September 9, 2026 at 9:20 AM EDT 3 min read MDB Artisan Partners , an investment management company, released its second-quarter 2026 investor letter for the \"Artisan Mid Cap Fund\". The letter can be downloaded here . Global equities rebounded sharply in Q2 2026, recovering from March lows as resilient economic data, strong corporate earnings, and continued AI investment improved investor sentiment despite inflation concerns, delayed rate cuts, and geopolitical uncertainty. The portfolio generated strong absolute returns and outperformed the Russell Midcap\u00ae Growth Index, benefiting from semiconductor exposure within IT and strong stock selection in health care and consumer discretionary. Its Investor Class: ARTMX returned 17.86%, Advisor Class: A port is free. Enter your email and see if any of your stocks made the cut.\n\nMeta Platforms ( NASDAQ:META ) put a price tag on its AI buildout Tuesday evening with Muse, a personal AI agent sold through a tiered consumer subscription, and investors moved quickly Wednesday morning. The launch answers the standing bear case that Meta Platforms' capital spending carried no direct consumer revenue line, and the reaction reads as a company-specific repricing rather than a broader bid for AI names. Overnight endorsements from commerce and startup leaders added credibility to the rollout heading into the open.\n\nMeta Platforms stock is up 6% to $649.20 Wednesday morning, the first meaningful vote for the company's AI monetization since its July earnings report. Meanwhile, Alphabet ( NASDAQ:GOOGL ) stock is down 2% to $330.53 as investors read Muse as encroachment on Gemini's consumer agent footprint.\n\nFor broader market context, the Invesco QQQ Trust ( NASDAQ:QQQ ) is down 0.5% to $714.55.", "source": "Yahoo Finance", "pub_date_str": "09 Sep 2026, 06:49 PM IST", "pub_date_relative": "17m ago"}, {"title": "Remitly Chief Business Officer Sells 21,000 Shares for $554,000", "full_content": "Skip to navigation Skip to main content Skip to right column APPLE EVENT It's the first John Ternus-led annual event. Follow along here. Remitly Chief Business Officer Sells 21,000 Shares for $554,000 Jack Delaney, The Motley Fool Wed, September 9, 2026 at 9:15 AM EDT 4 min read RELY Pankaj Sharma, Chief Business Officer at Remitly Global (NASDAQ:RELY), sold 21,000 shares of common stock on Aug. 28, 2026, according to a recent SEC Form 4 filing .\n\nTransaction value based on SEC Form 4 weighted average sale price ($26.39); post-transaction value based on Aug. 28, 2026, market close ($26.55).\n\nWhat was the regulatory context of this transaction? This sale was executed automatically pursuant to a Rule 10b5-1 trading plan that Sharma adopted on Nov. 18, 2025, which allows insiders to set up a predetermined schedule for selling company stock.\n\nHow does this sale affect the executive's total equity exposure? Following the sale of 21,000 shares, the executive maintains a significant direct position of 716,022 shares, representing a market value of $19 million as of the Aug. 28, 2026, market close.\n\nWhat is the recent market performance of Remitly Global equity? As of the transaction date on Aug. 28, 2026, Remitly Global shares delivered a total return of 44% over the past year, while the company continues to provide digital financial services for international money transfers in nearly 150 countries.\n\nRemitly Global operates a digital financial services platform specializing in international money transfers and remittances, generating revenue primarily from transaction fees and foreign exchange margins.", "source": "Yahoo Finance", "pub_date_str": "09 Sep 2026, 06:45 PM IST", "pub_date_relative": "22m ago"}], "cfa": [{"title": "Stocks fall as Brent crude trades above $100 per barrel: Live updates", "full_content": "Stocks fell on Wednesday as rising oil prices continued to rattle investors by stoking fears of higher inflation.\n\nThe Dow Jones Industrial Average dropped 300 points, or 0.6%. The S&P 500 shed 0.3%, while the Nasdaq Composite fell 0.5%.\n\nOil prices rose as escalating tensions between the U.S. and Iran fuel concerns over further disruptions to Middle East energy supplies. Futures for Brent crude , the international benchmark, added about 3% to trade above $100 a barrel for the first time since July. U.S. West Texas Intermediate futures gained 3% as well to above $95.\n\nThe latest rise in oil extends its gain from the prior trading day , which put downward pressure on the three major averages in their first session of a holiday-shortened trading week. Notably, the Dow saw its worst day in almost three weeks.\n\nThe stock market was dark on Monday in observance of the Labor Day holiday.\n\nThe 10-year U.S. Treasury yield briefly climbed above the closely watched 4.8% level on Tuesday as rising oil prices added to concerns about inflation. The action in yields further weighed down stocks in the session. The 10-year yield was last little changed Wednesday.\n\nIt's \"a little bit of a speed bump,\" said Kara Murphy, investment chief at Kestra Investment Management, on CNBC's \" Closing Bell .\" \"There's a little bit less to focus on with the earnings front, so I think the market has sort of shifted its attention now to the risk side.\"\n\nThe three major averages began Wednesday's session in the red.", "source": "CNBC Top News", "pub_date_str": "09 Sep 2026, 07:05 PM IST", "pub_date_relative": "1m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Fixed Income", "Derivatives", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Baker Hughes raises annual forecasts after Chart acquisition", "full_content": "", "source": "Investing.com News", "pub_date_str": "09 Sep 2026, 06:54 PM IST", "pub_date_relative": "12m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Bessent says, \u2018I am the house now.\u2019 What that means for the yen \u2014 and U.S. stocks.", "full_content": "Treasury Secretary Scott Bessent has never been accused of being a wallflower, but speaking in front of Southern Methodist University\u2019s business school on Tuesday night, he made perhaps the most strident comment of his government career.", "source": "MarketWatch Top Stories", "pub_date_str": "09 Sep 2026, 06:54 PM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Corn futures decline ahead of USDA supply report on Friday", "full_conten e $100 Brent is reflecting a market that increasingly has to change its view on how long the Middle East crisis will continue to curb supply from the region,\" said Ole Hansen, head of commodity strategy at Saxo Bank.\n\nIn a sharp escalation of the six-month-old war in recent days, U.S. forces hit multiple Iranian oil tankers and Iran targeted a U.S. base in Jordan and attacked ships.", "source": "Yahoo Finance", "pub_date_str": "09 Sep 2026, 06:51 PM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Derivatives", "Alternative Investments"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Oddity Q2 2026 slides: revenue plunges 25% amid ad disruption", "full_content": "", "source": "Investing.com News", "pub_date_str": "09 Sep 2026, 06:51 PM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Realizing Gains as MongoDB\u2019s (MDB) Competitive Landscape Shifts", "full_content": "Skip to navigation Skip to main content Skip to right column APPLE EVENT It's the first John Ternus-led annual event. Follow along here. Realizing Gains as MongoDB\u2019s (MDB) Competitive Landscape Shifts Soumya Eswaran Wed, September 9, 2026 at 9:20 AM EDT 3 min read MDB Artisan Partners , an investment management company, released its second-quarter 2026 investor letter for the \"Artisan Mid Cap Fund\". The letter can be downloaded here . Global equities rebounded sharply in Q2 2026, recovering from March lows as resilient economic data, strong corporate earnings, and continued AI investment improved investor sentiment despite inflation concerns, delayed rate cuts, and geopolitical uncertainty. The portfolio generated strong absolute returns and outperformed the Russell Midcap\u00ae Growth Index, benefiting from semiconductor exposure within IT and strong stock selec low collapsed to $784M from $8.55B a year ago while full-year capex guidance reaches $145B, making today's rally sentiment ahead of evidence.\n\nJust released. Our analysts combed the entire stock market and named the ten best stocks to buy right now, and Google didn't make the cut. Enter your email to see the names that beat GOOGL. The report is free. Enter your email and see if any of your stocks made the cut.\n\nMeta Platforms ( NASDAQ:META ) put a price tag on its AI buildout Tuesday evening with Muse, a personal AI agent sold through a tiered consumer subscription, and investors moved quickly Wednesday morning. The launch answers the standing bear case that Meta Platforms' capital spending carried no direct consumer revenue line, and the reaction reads as a company-specific repricing rather than a broader bid for AI names. Overnight endorsements from commerce and startup leaders added credibility to the rollout heading into the open.\n\nMeta Platforms stock is up 6% to $649.20 Wednesday morning, the first meaningful vote for the company's AI monetization since its July earnings report. Meanwhile, Alphabet ( NASDAQ:GOOGL ) stock is down 2% to $330.53 as investors read Muse as encroachment on Gemini's consumer agent footprint.\n\nFor broader market context, the Invesco QQQ Trust ( NASDAQ:QQQ ) is down 0.5% to $714.55.", "source": "Yahoo Finance", "pub_date_str": "09 Sep 2026, 06:49 PM IST", "pub_date_relative": "17m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Remitly Chief Business Officer Sells 21,000 Shares for $554,000", "full_content": "Skip to navigation Skip to main content Skip to right column APPLE EVENT It's the first John Ternus-led annual event. Follow along here. Remitly Chief Business Officer Sells 21,000 Shares for $554,000 Jack Delaney, The Motley Fool Wed, September 9, 2026 at 9:15 AM EDT 4 min read RELY Pankaj Sharma, Chief Business Officer at Remitly Global (NASDAQ:RELY), sold 21,000 shares of common stock on Aug. 28, 2026, according to a recent SEC Form 4 filing .\n\nTransaction value based on SEC Form 4 weighted average sale price ($26.39); post-transaction value based on Aug. 28, 2026, market close ($26.55).\n\nWhat was the regulatory context of this transaction? This sale was executed automatically pursuant to a Rule 10b5-1 trading plan that Sharma adopted on Nov. 18, 2025, which allows insiders to set up a predetermined schedule for selling company stock.\n\nHow does this sale affect the executive's total equity exposure? Following the sale of 21,000 shares, the executive maintains a significant direct position of 716,022 shares, representing a market value of $19 million as of the Aug. 28, 2026, market close.\n\nWhat is the recent market performance of Remitly Global equity? As of the transaction date on Aug. 28, 2026, Remitly Global shares delivered a total return of 44% over the past year, while the company continues to provide digital financial services for international money transfers in nearly 150 countries.\n\nRemitly Global operates a digital financial services platform specializing in international money transfers and remittances, generating revenue primarily from transaction fees and foreign exchange margins.", "source": "Yahoo Finance", "pub_date_str": "09 Sep 2026, 06:45 PM IST", "pub_date_relative": "22m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Credit card surcharge: Why do shops charge 2% extra and should you pay?", "full_content": "Many credit card users face a familiar situation when making expensive purchases at shops: the merchant asks them to pay an additional 2% on the total bill for using a credit card .\n\nThe answer is not as straightforward as it may appear. The Reserve Bank of India (RBI) has stated that it has not issued specific instructions regarding the levy of charges on credit card transactions. Card payments are also governed by agreements between merchants, banks, payment providers and card networks.\n\nWhen a customer pays by credit card , the merchant generally incurs a fee for accepting the payment. This cost is commonly known as the Merchant Discount Rate (MDR).\n\nThe entire transaction amount does not simply go from the merchant to the customer's bank. Card payment processing involves several participants, including the card-issuing bank, acquiring bank or payment provider and card network, with the associated costs distributed across the payment ecosystem.\n\nSome merchants try to recover these expenses by adding a percentage to the customer's bill.\n\nTherefore, when a shop demands an additional 2% for a credit card payment, it is generally attempting to transfer some or all of its card-acceptance cost to the customer.\n\nThe RBI has specifically clarified that it has not issued instructions on the levy of charges on credit card transactions.\n\nHowever, agreements between merchants and their banks, payment providers or card networks may contain rules governing whether such costs can be passed on to customers. If a shop asks for an additional payment, customers can question the charge and, if necessary, raise the matter with their card issuer.", "source": "LiveMint Money", "pub_date_str": "09 Sep 2026, 06:43 PM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Quantitative Methods"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "Here\u2019s Why Artisan Reduced Its Stake in Everpure (P)", "full_content": "Skip to navigation Skip to main content Skip to right column APPLE EVENT It's the first John Ternus-led annual event. Follow along here. Here\u2019s Why Artisan Reduced Its Stake in Everpure (P) Soumya Eswaran Wed, September 9, 2026 at 9:13 AM EDT 3 min read P Artisan Partners , an investment management company, released its second-quarter 2026 investor letter for the \"Artisan Mid Cap Fund\". The letter can be downloaded here . Global equities rebounded sharply in Q2 2026, recovering from March lows as resilient economic data, strong corporate earnings, and continued AI investment improved investor sentiment despite inflation concerns, delayed rate cuts, and geopolitical uncertainty. The portfolio generated strong absolute returns and outperformed the Russell Midcap\u00ae Growth Index, benefiting from semiconductor exposure within IT and strong stock selection in health care and consumer discretionary. Its Investor Class: ARTMX returned 17.86%, Advisor Class: APDMX returned 17.88%, and Institutional Class: APHMX returned 17.93% vs. a 14.55% gain for the index. Healthcare was the largest contributor, with biotech holdings driving gains, while consumer holdings also performed well. Software exposure, aerospace and defense holdings, and communication services positions weighed on relative performance. The fund continues to focus on identifying high-quality growth companies with durable secular trends and attractive valuation opportunities. Please check the fund's top five holdings for its best picks in 2026.\n\nIn its second-quarter 2026 investor letter, Artisan Mid Cap Fund highlighted Everpure, Inc. (NYSE: P ). Everpure, Inc. (NYSE:P) is a technology company specializing in enterprise-class data services and cloud storage solutions. On September 08, 2026, Everpure, Inc. (NYSE:P) closed at $101.14 per share. Over the past month, Everpure, Inc. (NYSE:P) declined 9.21%, while its shares gained 24.63% over the past 52 weeks. Everpure, Inc.", "source": "Yahoo Finance", "pub_date_str": "09 Sep 2026, 06:43 PM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Gold vs silver prices: Which one is overvalued? Which one remains relatively cheaper? Explained in current market trends", "full_content": "Gold prices above $4,400 appear expensive, while silver around $66 remains relatively cheap, according to Monarch PMS, which sees a clear divergence in the valuation of the two precious metals.\n\nThe brokerage's valuation framework suggests that gold has already moved back towards its fair-value zone after a sharp speculative overshoot earlier this year. Silver, meanwhile, has corrected its relative excess against gold and is now trading below Monarch PMS' estimated fair value.\n\nMonarch PMS has modelled a fair-value range of $3,248 to $4,595 an ounce for gold, with a midpoint of $3,922. As of September 8, gold was trading at around $4,355 an ounce, which was about 8% above the model's midpoint but still roughly 8% below the upper end of the estimated range.\n\nThe January peak of $5,589, however, was 22% above the upper ceiling of the entire modelled range. Monarch PMS describes this as an \"overshoot,\" suggesting that the January high was driven more by speculative factors than fundamental valuation.\n\nGold subsequently corrected sharply and touched $3,985 in June, a level that was within 2% of the model's $3,922 midpoint.\n\nMonarch PMS believes the June correction is significant because gold's decline stopped close to its estimated fair value before prices turned higher. The brokerage interprets the move as evidence that short-term and highly leveraged investors were among those who exited during the correction, while buyers stepped in around the fair-value zone.\n\nContinued central bank buying also supports this interpretation, according to Monarch PMS.\n\nThe brokerage's long-term gold valuation model shows that the metal traded below its modelled value for around 25 years before closing that gap in 2025. Gold then moved beyond the entire modelled range in January 2026 before correcting back into the range.", "source": "LiveMint Markets", "pub_date_str": "09 Sep 2026, 06:42 PM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "The U.S.-Canadian trade war could raise household costs for Americans. These rewards credit cards can help stretch your budget", "full_content": "Terms apply to American Express benefits and offers. Visit americanexpress.com to learn more.\n\nOn Tuesday, Canada imposed new tariffs as high as 50% on select U.S. goods, affecting $27.6 billion in imports from the U.S . This comes in response to those the United States placed on Canadian goods entering the U.S. on August 22, after ongoing trade talks collapsed .\n\nThe U.S.-imposed tariffs will likely cause price increases on a wide variety of imports from Canada , including alcohol, building materials, furniture, consumer electronics and more. It's unclear exactly how long tariffs from either country will stay in place, or if they'll be expanded to include even more goods if negotiations continue to stall.\n\nDuring a time when every dollar counts, using a rewards credit card could help reduce any price increases you face.\n\nSenior reporter Jason Stauffer can answer your questions about how to make the most of your credit cards in his weekly Points Pro column. Submit yours here .\n\nA tariff is a tax that governments charge on prespecified goods when they cross the border into that nation. The critical part of a tariff is who pays the tax, which is partially the business importing the goods.\n\nWith the August 22 tariffs on Canadian goods, U.S. retailers now pay more to import the same goods. To reduce the impact of this tax, businesses often raise prices, but the impact might not be immediate. A 2026 Federal Reserve study found that when tariffs are implemented, the increases are felt slowly over time rather than a one-time price spike.\n\n\"Price increases are a moving target,\" Ted Rossman, principal consumer finance analyst at Money Management International (MMI), tells CNBC Select, meaning it can be difficult to predict when the impact may be felt. \"The timing is generally faster for perishables such as dairy products and slower for durable goods such as furniture and cars,\" he says, noting American consumers are already stretched thin.", "source": "CNBC Top News", "pub_date_str": "09 Sep 2026, 06:42 PM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Kroger and Macy\u2019s: The Compounder vs the Turnaround", "full_content": "Skip to navigation Skip to main content Skip to right column APPLE EVENT It's the first John Ternus-led annual event. Follow along here. Kroger and Macy\u2019s: The Compounder vs the Turnaround Trey Thoelcke Wed, September 9, 2026 at 9:10 AM EDT 5 min read KR M Quick Read Kroger is down 16% over the past year but up 82% over ten years, making its current dip a buying opportunity, not a warning sign.\n\nKroger's dividend has grown from $0.105 in 2016 to $0.39 today, backed by a $2 billion buyback, while Macy's track record remains short and uncertain.\n\nNew Kroger CEO Greg Foran calls cost reduction \"the starting point for everything else,\" but regulatory risk around acquisitions remains the stock's biggest threat.\n\nJust released. Our analysts combed the entire stock market and named the ten best stocks to buy right now, and Kroger didn't make the cut. Enter your email to see the names that beat KR. The report is free. Enter your email and see if any of your stocks made the cut.\n\nWith Kroger ( NYSE:KR ) and Macy's ( NYSE:M ) both reporting before the open on consecutive mornings, but which one belongs in a long-duration income portfolio right now? Macy's reports Thursday, September 10, 2026, and Kroger follows on Friday, September 11, 2026. Here's the asymmetry: one has compounded for a decade and is temporarily on sale, the other just had its best year in memory but has structurally gone nowhere across ten years.\n\nBeta measures how a stock moves relative to the broader market. A reading above 1 implies bigger swings than the index, while below 1 implies smaller. Grocers historically sit well below 1 and department stores well above, which sets up the more important comparison: the horizon inversion.\n\nKroger closed at $57.20 on September 8, 2026, leaving the stock down 15.9% over the past year yet up 81.5% over ten years. Macy's closed at $22.45 and is up 31.4% over the past year but down 36.7% across ten years.", "source": "Yahoo Finance", "pub_date_str": "09 Sep 2026, 06:40 PM IST", "pub_date_relative": "27m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Fixed Income", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Leveraged loan issuer earnings growth persists, despite AI spending fears", "full_content": "Skip to navigation Skip to main content Skip to right column APPLE EVENT It's the first John Ternus-led annual event. Follow along here. Leveraged loan issuer earnings growth persists, despite AI spending fears John Atkins Wed, September 9, 2026 at 9:09 AM EDT 2 min read Leveraged borrowers turned out another quarter of resilient earnings strength, keeping a lid on credit pressure as the financing environment grows costlier. Across a sample of loan issuers in the Morningstar LSTA US Leveraged Loan Index, revenue grew 8% and EBITDA 9%, both repeating their growth rates from the first quarter.\n\nThose metrics held at their highest readings since 2022. (In Q2 2025, revenue was up 6% and EBITDA grew 4%.) The Q2 results were based on 165 issuers that file their results publicly, or 12% of the index by both issuer count and par amount of loans ($186 billion).\n\nThe humming earnings engine continues to propel borrowers mostly ahead of credit strains. Average leverage was lower in Q2 (4.85x, from 5.01x in Q1 and 5.08x a year ago). On a weighted average basis, it was up just four basis points sequentially (at 5.23x) and down 10 bps year to year.\n\nWith investors vigilant for signs of debt-servicing hiccups as rates rise, strong earnings were a salve for key coverage ratios as well. Earnings covered interest expense by 4.95x, on average, up five basis points sequentially and up 44 bps year to year. That's the highest coverage reading since Q1 2023. (On a weighted average basis, the measure was five basis points lower sequentially, at 4.51x, but still 48 bps higher year to year.)\n\nAnother coverage measure shows what's left after accounting for capital spending \u2014 a key credit risk emerging as companies scramble to adapt competitively to AI and other disruptions.", "source": "Yahoo Finance", "pub_date_str": "09 Sep 2026, 06:39 PM IST", "pub_date_relative": "27m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Fixed Income"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Michael Dell passes Jeff Bezos to become world's third-richest person", "full_content": "Skip to navigation Skip to main content Skip to right column APPLE EVENT It's the first John Ternus-led annual event. Follow along here. Michael Dell passes Jeff Bezos to become world's third-richest person Cris Tolomia Wed, September 9, 2026 at 9:08 AM EDT 2 min read DELL AMZN GOOG TSLA Michael Dell surpassed Jeff Bezos in Forbes' billionaire rankings on Tuesday, reaching the third spot on the wealth list for the first time as Dell Technologies stock closed at a record high.     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
