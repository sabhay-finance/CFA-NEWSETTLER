 Hydroelectric Project agreement signed in September 2025.", "source": "NDTV Profit", "pub_date_str": "06 Oct 2026, 11:41 AM IST", "pub_date_relative": "1h ago"}, {"title": "AWL Agri Business shares climb 4% as Q2 revenue rises 24% YoY, Food & FMCG posts record quarterly revenue", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a AWL Agri Business shares climb 4% as Q2 revenue rises 24% YoY, Food & FMCG posts record quarterly revenue AWL Agri Business Share Price Patanjali Foods Share Price Zydus Wellness Share Price LT Foods Share Price Bikaji Foods International Share Price The Economic Times daily newspaper is available online now. Read Today's Paper AWL Agri Business shares climb 4% as Q2 revenue rises 24% YoY, Food & FMCG posts record quarterly revenue SECTIONS AWL Agri Business shares climb 4% as Q2 revenue rises 24% YoY, Food & FMCG posts record quarterly revenue By Surbhi Khanna , ET Online Last Updated: Oct 06, 2026, 11:41:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis AWL Agri Business shares rose nearly 4% after Q2 revenue grew 24% year-on-year, driven by strong performance in Food & FMCG and Industry Essentials. Food & FMCG revenue jumped 33%, surpassing Rs 2,000 crore. Pulses, exports, e-commerce and specialty chemicals also recorded robust growth, while edible oils posted steady volume gains.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "06 Oct 2026, 11:41 AM IST", "pub_date_relative": "1h ago"}, {"title": "BFSI Could See High Inflows Once FIIs Return, Says Ashika Institutional Equities' Rahul Arora", "full_content": "Arora told NDTV Profit that banking is currently suffering collateral damage from the artificial intelligence (AI) trade, even as bank credit growth has grown by 15-20% every month. He also does not expect banks' asset quality to deteriorate.", "source": "NDTV Profit", "pub_date_str": "06 Oct 2026, 11:36 AM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "RBI MPC meeting October 2026: Why HDFC Bank, ICICI Lombard, Coal India, TCS likely to gain if bank announces rate hike?", "full_content": "RBI MPC meeting October 2026: The Reserve Bank of India (RBI) is all set to announce its policy decision outcome on Wednesday, 7 October, with market participants assessing the impact of a potential 25 basis point (bps) increase in the repo rate.\n\nWhile a rate hike is generally viewed as negative for rate-sensitive sectors such as real estate, automobiles and leveraged non-banking financial companies (NBFCs), analysts believe some pockets of the market could benefit from tighter monetary policy.\n\nAccording to Harshal Dasani, Business Head at INVasset PMS, a 25 bps hike to 5.50% is no longer a surprise, as market expectations already reflect a significant probability of such a move.\n\nMeanwhile, Maulik Patel, Head of Research, Equirus Securities, also said that the RBI would likely hike the policy rate by 25 bps. \u201cIndia\u2019s CPI rose to 4.82% in August 2026, up from 4.45% in July, with pressures starting to broaden in core categories also \u2013 core inflation rose to 4.16%. The pass-through of higher input prices is underway and retail prices will continue on an uptrend.", "source": "LiveMint Markets", "pub_date_str": "06 Oct 2026, 01:08 PM IST", "pub_date_relative": "2m ago", "cfa_topics": ["Quantitative Methods", "Economics", "Fixed Income"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "Reliance, Kotak Mahindra Bank, Welspun shares: Build model stock portfolio! Why Jefferies India is bullish on large-caps", "full_content": "Jefferies India report: Amid soaring US bond yields, which have put long-term pressure on the Indian stock market, Jefferies India has increased its weight in large-cap stocks. The global investment bank strongly believes that large-caps offer better risk-reward relative to mid-caps in the current market environment.\n\nAccording to the latest Jefferies India report dated October 6, 2026, it announced an increase in weightage in Reliance Industries shares. The global investment bank also declared that it has added two more large-cap stocks to its model portfolio. Those two stocks are Kotak Mahindra Bank and Welspun Corp . However, Jefferies India has trimmed weightage in the rate-sensitive segments, NBFC and Real Estate.\n\nHighlighting the reason for increasing weightage on the large-cap stocks, the Jefferies India report said, \u201cWe increase weight on Largecaps. We believe risk-reward is becoming more favourable for large caps on better relative valuations vs Midcaps, while the earnings growth gap is narrowing over FY26-28E.\u201d\n\nThe latest Jefferies report also hints at a possible bottom in the making on Dalal Street, saying, \u201cMarkets are facing rising yields with the US 10Y Treasury yield above 5% (20+yr high), Japan's 10Y yield above 3% (30yr highs), and UK & German govt bond yields also moving higher. Apart from inflation, markets are also pricing in worsening fiscal balances, declining participation from foreign central bank buyers and large debt-funded capex for AI buildout. Our global equity strategist Christopher Wood believes that US 10Y yields above 5% create a growing risk for US equities.\u201d\n\nIn an email interaction with LiveMint, Chris Wood, Head of Equities at Jefferies, said that equity investors can expect a boom in Indian equities once the correction in US bond yields begins.", "source": "LiveMint Markets", "pub_date_str": "06 Oct 2026, 01:07 PM IST", "pub_date_relative": "3m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "When can you claim tax benefits on home loan for under-construction property? Tax expert explains", "full_content": "If you have bought an under-construction home and have already started paying EMIs, do not assume you can immediately claim all available home loan tax benefits. The tax treatment varies depending on whether the deduction relates to principal payments or interest payments.\n\nWhile loan repayments may begin before possession of the property, eligibility for tax deductions is subject to specific conditions under the Income-tax Act. Understanding these rules can help taxpayers avoid incorrect claims.\n\nNishant Shanker, Tax Controversy & Dispute Resolution, Navraj Global Advisors, said, \u201cBuying an under-construction home means commencing EMIs before getting the home possession. Under the Income-tax Act, 2025, the answer depends on whether one is claiming the benefit for principal repayment or interest and whether the applicable conditions have been satisfied. For principal repayment, an important point is that merely starting repayment of the home loan does not automatically make every principal component immediately deductible. The deduction for eligible housing-loan principal repayment falls within the Rs. 1.5 lakh overall limit under Section 123 read with Schedule XV.\u201d\n\nHe added, \"For an under-construction property, the conditions relating to acquisition or completion of the residential house, therefore, need to be examined before claiming the deduction. A taxpayer should not assume that because the bank has begun recovering principal through EMIs , the entire principal paid during the construction period can automatically be claimed as a deduction. Hence, the completion /acquisition requirement is an important consideration.\u201d\n\nOn home loan interest treatment, he said, \u201cThe treatment of home loan interest is different.", "source": "LiveMint Money", "pub_date_str": "06 Oct 2026, 01:00 PM IST", "pub_date_relative": "10m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "BOJ chief calls for more focus on anchoring inflation around target", "full_content": "", "source": "Investing.com News", "pub_date_str": "06 Oct 2026, 12:55 PM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Banks vs NBFCs: Which stocks could benefit as RBI set to hike rates for the first time in 3 years?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Banks vs NBFCs: Which stocks could benefit as RBI set to hike rates for the first time in 3 years? Tata Capital Share Price Shriram Finance Share Price Jio Financial Services Share Price Cholamandalam Investment & Finance Company Share Price Aditya Birla Capital Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Banks vs NBFCs: Which stocks could benefit as RBI set to hike rates for the first time in 3 years? SECTIONS Banks vs NBFCs: Which stocks could benefit as RBI set to hike rates for the first time in 3 years? By Veer Sharma , ETMarkets.com Last Updated: Oct 06, 2026, 12:54:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The RBI\u2019s expected first rate hike in three years could have a mixed impact on banks and NBFCs. While higher funding costs may pressure NBFC margins, lenders with floating-rate assets and strong liquidity could benefit. Brokerages favour HDFC Bank, ICICI Bank, Kotak Mahindra Bank, Bajaj Finance and Tata Capital.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "06 Oct 2026, 12:54 PM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Economics", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "FTSE 100 today: Stocks rise as U.S. tech rally outweighs Iran war risk", "full_content": "", "source": "Investing.com News", "pub_date_str": "06 Oct 2026, 12:53 PM IST", "pub_date_relative": "17m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "BMO downgrades RXO stock rating on merger agreement terms", "full_content": "", "source": "Investing.com News", "pub_date_str": "06 Oct 2026, 12:50 PM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "JPMorgan upgrades RXO stock rating on acquisition deal", "full_content": "", "source": "Investing.com News", "pub_date_str": "06 Oct 2026, 12:50 PM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "JPMorgan upgrades Corteva stock rating on valuation after spinoff", "full_content": "", "source": "Investing.com News", "pub_date_str": "06 Oct 2026, 12:50 PM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Mozambique business activity falls in September as PMI drops", "full_content": "", "source": "Investing.com News", "pub_date_str": "06 Oct 2026, 12:49 PM IST", "pub_date_relative": "22m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Nykaa's Q2 business update brings a fresh bout of optimism", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nFSN E-Commerce Ventures (Nykaa\u2019s) seems to be entering the festive season on a stronger footing, going by its September quarter (Q2FY27) business update. The stock has gained 5% following the 4 October update, bringing the 2026 return to 28% despite pessimistic sentiment in the broader market.\n\nNykaa\u2019s consolidated GMV is expected to have grown around 30% year-on-year in Q2, with NSV growth higher in the early 30s and net revenue growth in the late 20s. Growth is ahead of JM Financial Institutional Securities\u2019 estimates, and follows 29% year-on-year revenue growth in Q1FY27 to \u20b9 2,782 crore.\n\nGMV is gross merchandise value before returns and cancellations, while NSV is net sales value after returns, taxes, discounts, and cancellations.\n\nNykaa\u2019s largest segment, beauty and personal care (BPC), is expected to have clocked NSV and revenue growth in the high 20s despite a larger base, as festive spending had started earlier last year. The performance was supported by new customer additions, repeat orders, and traction in House of Nykaa brands. Along with early-20s like-for-like store growth, the highest in six quarters, store footprint continued to expand. Nykaa added 14 stores last quarter, taking the total to 338 as of 30 September.\n\nThe fashion segment continues to be the swing factor. Its Q2 NSV growth is expected in the high 40s, while revenue is expected to grow in the early 40s. This is materially ahead of JM Financial\u2019s estimate of about 35%, and follows 53% NSV growth in Q1.\n\nThe drivers are encouraging: new customer additions, over 250 brands added in Q2 and continued traction from the Nike partnership, including exclusive product drops.", "source": "LiveMint Markets", "pub_date_str": "06 Oct 2026, 12:44 PM IST", "pub_date_relative": "26m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Despite an over 80% rise in less than 2 months, Motilal Oswal says buy this newly-listed stock - Reason, target price", "full_content": "A newly listed stock has seen a solid gain of over 80% in less than two months, and despite this sharp rise, domestic brokerage firm Motilal Oswal Financial Services has a \"buy\" recommendation on it, with a target price implying 20% upside potential.\n\nWe are discussing Molbio Diagnostics , a Goa-based healthcare company that develops fast, affordable, and accurate diagnostic tests. Its solutions help detect infectious and non-communicable diseases, making testing more accessible to people.\n\nMolbio Diagnostics share price was listed on the Indian bourses on 17 August this year. At the current market price of \u20b9 1,475.50, it is up 83% from its IPO price of \u20b9 807 in less than two months.\n\nOver the last month, the stock has been up about 27%. On a monthly scale, it is up 13% so far in October after an almost 21% rise in September.\n\nMeanwhile, the stock declined more than 2% in intraday trade on Tuesday, 6 October, looking set to extend losses for the second consecutive session.\n\nMotilal Oswal has initiated coverage on the stock with a buy rating, assigning a 45 times 12-month forward earnings multiple to arrive at a target price of \u20b9 1,800, implying a 20% potential upside from the stock's 5 October close of \u20b9 1,503.35 on the BSE. In a bull case, the stock could rise to \u20b9 2,575, while in a bear case, it can fall to \u20b9 1,100, according to Motilal Oswal.\n\nMotilal Oswal believes Molbio is \"well-positioned to capture the opportunity in decentralised molecular diagnostics via its integrated Truenat ecosystem, combining proprietary molecular diagnostic devices with a recurring test-kit franchise.\"\n\n\"The expanding installed base, widening assay menu and global scale-up are key levers for sustainable growth, while increasing utilisation should drive operating leverage,\" said Motilal.", "source": "LiveMint Markets", "pub_date_str": "06 Oct 2026, 12:36 PM IST", "pub_date_relative": "35m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Trump allows cheaper, dyed diesel on highways to blunt historic fuel-cost spike ahead of midterms", "full_content": "President Donald Trump has allowed the use of cheaper red-dyed diesel, typically reserved for farm operations, to be used more broadly in an attempt to bring down record-high fuel costs.\n\nTrump signed an executive order Monday evening stateside to temporarily allow truckers and farmers to use red-dyed diesel \u2014 which is exempt from highway fuel taxes \u2014 and deferred related taxes on the fuel through the end of this year.\n\nThe tax-free diesel is typically used by farm equipment, construction machinery, trucks and other off-road vehicles. It is therefore exempt from a 24.4 cent-per-gallon tax applied to diesel fuel sold for highway transportation.\n\nUsing dyed diesel in vehicles operated on public roads is considered illegal, and could result in fines for tax evasion. But several states this year have relaxed restrictions on the tax-exempt diesel to help Americans cope with surging fuel prices.\n\nThe U.S. national average price of diesel topped $6 a gallon in September for the first time ever, as fuel supply disruptions triggered by the conflicts in Ukraine and Iran pushed up transportation costs across the country. Americans are spending about $700 million more per day on gas and diesel than they did a year ago, according to Bob McNally, president of Rapidan Energy.\n\nThe White House said truckers could save more than $100 per fill-up .\n\nThe order also directed the Treasury Secretary , in consultation with the Department of War, to defer collection of the federal excise tax on highway diesel through the end of 2026, without interest or penalties, according to a fact sheet released by the White House. The Treasury is also directed to \"explore pathways to eliminate the obligation to pay the deferred taxes\" altogether.\n\nThe Trump administration cited tight global supply tied to the war in Ukraine and a lack of refining capacity as pushing up diesel prices and household costs.", "source": "CNBC Top News", "pub_date_str": "06 Oct 2026, 12:35 PM IST", "pub_date_relative": "35m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Treasury yields are broadly flat as investors anticipate FOMC minutes", "full_content": "U.S. Treasury yields were broadly flat on Tuesday morning after reaching fresh highs in the previous session, as investors looked ahead to the release of minutes from the Federal Reserve's last meeting.\n\nThe benchmark 10-year Treasury was last trading below the flatline at 5.302%, after reaching its highest level since April 2002 on Monday. Similarly, the 30-year Treasury bond rose less than a basis point to 5.665%, after also rising to levels not seen since May 2002. The 2-Year Treasury note yield was down 1 basis point to 4.818%.\n\nOne basis point is equal to 0.01%, and yields and prices move in opposite directions.\n\nTreasury yields once again soared on Monday, with the 10-year and 30-year recording 24-year highs, after fresh data from the Institute for Supply Management showed cooling services growth.\n\nThe PMI reading rose to 54.9 in September, in line with expectations but just below August's growth, while the price index within the service ISM was up 1.4 points to 74.\n\nTraders are now pricing in a 78% chance that the Fed will keep rates unchanged at its next meeting, according to the CME Group's FedWatch tool .\n\nThe event of the week will be the release of the FOMC minutes from its September meeting on Wednesday, which investors will parse closely for clues about future monetary policy.", "source": "CNBC Top News", "pub_date_str": "06 Oct 2026, 12:35 PM IST", "pub_date_relative": "35m ago", "cfa_topics": ["Economics", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Is CEG stock the biggest winner from the AI power boom?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News Powered By Is CEG stock the biggest winner from the AI power boom? Written by Anupam Nagar , ETMarkets.com | Oct 06, 2026, 12:52:06 PM IST 1 / 5 Why is CEG stock surging? Constellation Energy shares surged more than 4% in overnight trading after a report said Alphabet is close to a multiyear nuclear power agreement with the company. The potential deal, reportedly worth $1 billion or more, has strengthened investor optimism around nuclear energy's role in meeting the AI industry's rapidly growing electricity demand. (Sources: Stocktwits, Reuters, MarketWatch)\n\nAlphabet is reportedly close to an agreement to purchase nuclear power from Constellation Energy under a multiyear deal that could be worth $1 billion or more. The agreement could be announced as soon as this week, although neither company has officially confirmed the reported deal.\n\nConstellation's reported Google agreement would add to its growing portfolio of long-term contracts with technology companies. The company has already signed a 20-year power purchase agreement with Amazon covering 690 MW from its Calvert Cliffs nuclear plant, while Microsoft has a separate 20-year agreement linked to the restart of Three Mile Island Unit 1.\n\nCEG closed at $267.62 on October 5, gaining 3.93%, before extending its advance in overnight trading. Despite the recent rally, the stock remains well below its 52-week high of $412.70, highlighting both the strong recovery potential and the volatility surrounding the nuclear-energy play.\n\nThe rapid expansion of AI data centres is creating enormous demand for reliable electricity, putting nuclear power in the spotlight.", "source": "Economic Times Markets", "pub_date_str": "06 Oct 2026, 12:32 PM IST", "pub_date_relative": "38m ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Philip R. Lane: Interview with Ansa", "full_content": "The first question is about the scenarios that the ECB has run since the start of the Middle East war. Where we are right now in relation to these scenarios?\n\nWe have found it useful to put out these scenarios. But let me emphasise, they make different assumptions about the price of oil and the price of gas. But they also make different assumptions, for example, about the strength of the second round effects, how quickly the energy prices will transmit to the wider inflation rate and to the economy.\n\nThis is something we don\u2019t learn about every day. What is true is that energy prices are higher than we expected in our baseline. But I don't want to convert that into any one scenario. Because the scenarios are a collection of different assumptions. And on the second round effects, we have not seen, so far, very strong second round effects. We continue to look at them. That's why, even though I am a promoter of the scenarios, it is too simplistic to say we're in the adverse scenario or the baseline scenario. They are helpful illustrations. But we try to do a comprehensive analysis. And to repeat, clearly, energy prices are high but the strength of the pass-through to the rest of the economy remains uncertain.\n\nWe are seeing a mixed picture regarding growth. We have had some very good data in the second quarter. Also, the ECB has made it clear that the third quarter could be moderately good. But we have risks, of course, geopolitical risk, the energy shock. Now we have this marked increase in long-term yields propagating from the United States, with lots of European countries that are facing a pretty stark increase in yields. Would you single out the biggest risk that you are monitoring right now?\n\nYour question has highlighted the range of factors. But, maybe behind everything, globally, the biggest issue is AI. AI has meant that world trade has been strong this year because it is leading to a lot of trade, including in semiconductor chips and other materials.", "source": "ECB Press", "pub_date_str": "06 Oct 2026, 12:30 PM IST", "pub_date_relative": "41m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Global Market: Euro under pressure as France debt worries, Spain vote weigh", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a Global Market: Euro under pressure as France debt worries, Spain vote weigh Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market: Euro under pressure as France debt worries, Spain vote weigh SECTIONS Global Market: Euro under pressure as France debt worries, Spain vote weigh By Anupam Nagar , ETMarkets.com Last Updated: Oct 06, 2026, 12:28:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The euro hovered near a 17-month low at $1.1219 amid euro zone political uncertainty, high debt and French fiscal concerns. Meanwhile, the dollar strengthened as US Treasury yields climbed, with persistent inflation limiting expectations for monetary easing. Markets also monitored potential Bank of Japan tightening as the yen remained weak against the dollar.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "06 Oct 2026, 12:28 PM IST", "pub_date_relative": "42m ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Pulses prices surge: Will cheaper imports bring relief to consumers? Stakeholders divided", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Agriculture \u203a Pulses prices surge: Will cheaper imports bring relief to consumers? Stakeholders divided The Economic Times daily newspaper is available online now. Read Today's Paper Pulses prices surge: Will cheaper imports bring relief to consumers? Stakeholders divided SECTIONS Pulses prices surge: Will cheaper imports bring relief to consumers? Stakeholders divided By Ashish Pandey , ET Online Last Updated: Oct 06, 2026, 12:59:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India currently imposes a 10% import duty on red lentils and chickpeas, while yellow peas attract a 30% duty.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\nThe government has already allowed duty-free imports of pigeon peas and black gram until March 2027.\n\nYellow peas, a substitute for chana in food processing, have emerged as a pressure point as disrupted Russian supplies push up prices . \u200b\n\nThe world is witnessing a bond rout. Why should it matter to you?\n\nQ2 earnings season: Will it settle or add to confusion in the stock market?\n\nHow Sebi busted Growpital\u2019s \u2018assured\u2019 returns, LLPs and money trail\n\nA for apple, Y for yak and, for the first time, a price next to it. Will this change the non-agri part of the rural economy?", "source": "Economic Times Economy", "pub_date_str": "06 Oct 2026, 12:28 PM IST", "pub_date_relative": "42m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "How quant funds beat the market by being 'early, contrarian and right'", "full_content": "Hedge fund strategies that rely on complex algorithms and machine learning technology to build trades are beating the stock market this year.\n\nTrend-following hedge funds \u2014 also known as commodity trading advisors, or managed futures strategies \u2014 are computer-based funds that use quantitative programs, statistical models and price signals to crunch huge volumes of data and invest across futures markets.\n\nThey aim to identify and trade large and consistent trends \u2014 both upward and downward \u2014 across equities, bonds, commodities, and currencies, to profit from that ongoing momentum.\n\nSociete Generale's SG CTA Index \u2014 the sector's main performance benchmark, which tracks the daily net returns of major strategies including Man Group, PIMCO, AQR and Winton Capital funds \u2014 notched a 15.7% return in the nine months to the end of the third quarter. By comparison, the broad-based S&P 500 rose 11.7% over the same nine-month period.\n\nIndustry pros told CNBC how CTAs correctly called September's sudden bond sell-off with shorts against U.S. Treasurys. That added to earlier gains made from bullish dollar positions, as well as pre-Iran war long oil bets.\n\n\"CTAs are crushing the rest of the hedge fund world this year,\" said Andrew Beer, managing member at Dynamic Beta Investments. He said the sector was \"early, contrarian and right\" when it started buying crude oil in January prior to the Iran war, before successfully positioning for rising rates ahead of the global bond market turmoil.\n\nSimplify Managed Futures ETF. \"They've nailed the two major themes in the markets: on the one hand, feverish AI-driven optimism about equities and, on the other, panic about oil prices and inflation,\" Beer told CNBC via email. \"Humans are too emotional to time markets. Machines are much better.\"\n\nNicolas Gaussel, CEO and CIO of Metori Capital Management, said CTAs have effectively navigated inflationary tensions thanks to their ability to take short positions in fixed income.", "source": "CNBC Top News", "pub_date_str": "06 Oct 2026, 12:27 PM IST", "pub_date_relative": "43m ago", "cfa_topics": ["Quantitative Methods", "Economics", "Financial Statement Analysis", "Equity Investments", "Fixed Income", "Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "CAS U-turn ahead? BSE, Groww, NSE, other capital market stocks jump up to 4% amid buzz around Sebi tweaking F&O settlement rules", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a CAS U-turn ahead? BSE, Groww, NSE, other capital market stocks jump up to 4% amid buzz around Sebi tweaking F&O settlement rules Billionbrains Garage Ventures Share Price Angel One Share Price Choice International Share Price JM Financial Share Price IIFL Capital Services Share Price Powered By The Economic Times daily newspaper is available online now. Read Today's Paper CAS U-turn ahead? BSE, Groww, NSE, other capital market stocks jump up to 4% amid buzz around Sebi tweaking F&O settlement rules SECTIONS CAS U-turn ahead? BSE, Groww, NSE, other capital market stocks jump up to 4% amid buzz around Sebi tweaking F&O settlement rules By Debaroti Adhikary , ETMarkets.com Last Updated: Oct 06, 2026, 12:19:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Capital market stocks rallied after a Reuters report said Sebi may partly reverse its new Closing Auction Session rules for derivatives settlement. BSE, NSE, Groww and Angel One gained as options volumes recovered and CAS-related concerns eased.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "06 Oct 2026, 12:19 PM IST", "pub_date_relative": "51m ago", "cfa_topics": ["Equity Investments", "Derivatives"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Viceroy Hotels shares rise 2% as Zerodha founders Nithin, Nikhil Kamath pick 6.72% stake", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Viceroy Hotels shares rise 2% as Zerodha founders Nithin, Nikhil Kamath pick 6.72% stake Viceroy Hotels Share Price Asian Hotels (North) Share Price Benares Hotels Share Price Mac Charles (India) Share Price Royal Orchid Hotels Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Viceroy Hotels shares rise 2% as Zerodha founders Nithin, Nikhil Kamath pick 6.72% stake SECTIONS Viceroy Hotels shares rise 2% as Zerodha founders Nithin, Nikhil Kamath pick 6.72% stake By Sakshi Kumari , ETMarkets.com Last Updated: Oct 06, 2026, 12:18:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Viceroy Hotels shares witnessed an uptick on Tuesday after Zerodha founders Nithin and Nikhil Kamath acquired a 6.72% stake in the company during the September quarter. The hotel operator, which emerged from insolvency in 2024, is expanding its portfolio in Hyderabad and has plans to acquire SLN Terminus Hotels and Resorts.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "06 Oct 2026, 12:18 PM IST", "pub_date_relative": "52m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Portfolio Management"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Weak equity returns may test India\u2019s SIP momentum", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nSystematic investment plan (SIP) flows have held up despite Indian benchmark equity indices correcting 10% over the past two years. But that resilience is now facing its toughest test.\n\nSIP contributions hit a record \u20b9 32,297 crore in August 2026, the highest monthly inflow ever, showed data from the Association of Mutual Funds in India (Amfi). This steady stream of domestic money has helped keep the Indian market resilient even as foreign investors have remained cautious, said Sid Swaminathan, managing director and chief executive of Jio BlackRock Asset Management Pvt. Ltd, which manages over \u20b9 22,000 crore worth of assets.\n\n\u201cBut the headline SIP numbers mask some churn. There are significant stoppages and cancellations every month, even though net SIP flows continue to grow,\u201d he said.\n\nThe Amfi data showed that 5.38 million SIPs were either discontinued or reached the end of their tenure\u2014the highest since January 2026, when the number stood at 5.55 million,\n\nMore importantly, Swaminathan highlighted that many investors who have stopped their SIPs have held their investment for less than two years. That, he believes, raises a bigger concern for the mutual fund industry : if newer investors see a 5-10% market decline and exit, they may not stay invested long enough to benefit from equities\u2019 long-term wealth-creation potential.\n\n\u201cThe next challenge is not just getting people into SIPs, but helping them stay invested through periods when markets deliver little or even negative returns,\u201d he said.\n\nThe investment decisions of retail investors and a section of institutional investors are largely influenced by trailing returns or by expectations of near-term price movements, with sentiment\u2014fear and greed\u2014playing a large role in investment behaviour, said a 29 September report by Kotak Institutional Equities.", "source": "LiveMint Markets", "pub_date_str": "06 Oct 2026, 12:16 PM IST", "pub_date_relative": "54m ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Small caps have beaten large caps by 21.5% in a year. Should SIP investors rebalance now? Experts explain", "full_content": "Small-cap indices have significantly outperformed large caps over the past year, leaving investors to decide whether to continue their systematic investment plans (SIPs) or redirect fresh investments towards large-cap funds.\n\nWhile historical data suggests that periods of sharp small-cap outperformance can be followed by mean reversion, experts say investors should not change their investment strategy solely because of recent market movements.\n\nThe more important question for SIP investors is whether their portfolios have drifted from their intended asset allocation. Strong returns can increase the share of small- and mid-cap funds in a portfolio, making rebalancing necessary even if investors have not changed their monthly investments.\n\nVaibhav Porwal, co-founder of Dezerv, said investors should first assess their overall asset allocation rather than make decisions based on the performance of a particular market segment. The target mix across large-, mid- and small-cap funds, gold, debt and global equities should reflect their financial goals and risk appetite, he said.\n\nBharath Rathore, executive director at Anand Rathi Wealth, advised investors to continue their SIPs according to their strategy. He said investors should not make allocation changes based only on market movements or valuation figures.\n\nAccording to Rathore, midcaps were trading around 20% below their estimated fair value, while small caps were about 18% below it. The Nifty 50 was trading 16% below its estimated fair value, he said. These estimates suggest that the valuation argument is not limited to one market-cap segment.\n\nInvestors should instead assess whether their existing allocation remains aligned with their financial plan.", "source": "LiveMint Money", "pub_date_str": "06 Oct 2026, 12:16 PM IST", "pub_date_relative": "54m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "World Bank raises India FY27 growth forecast to 7.1%, flags oil, El Ni\u00f1o risks", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Indicators \u203a World Bank raises India FY27 growth forecast to 7.1%, flags oil, El Ni\u00f1o risks The Economic Times daily newspaper is available online now. Read Today's Paper World Bank raises India FY27 growth forecast to 7.1%, flags oil, El Ni\u00f1o risks SECTIONS World Bank raises India FY27 growth forecast to 7.1%, flags oil, El Ni\u00f1o risks ET Online Last Updated: Oct 06, 2026, 12:18:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The World Bank has upgraded India's economic growth forecast to 7.1% for fiscal 2026-27. This change reflects strong domestic consumption, despite ongoing inflationary pressures. Other major forecasters, including Moody's and S&P Global Ratings, have also revised their projections upward. However, elevated oil prices and potential climate-related challenges pose risks to this outlook. The World Bank emphasizes the need for accelerated AI adoption in the region for sustained economic growth.\n\nThe world is witnessing a bond rout. Why should it matter to you?\n\nQ2 earnings season: Will it settle or add to confusion in the stock market?\n\nHow Sebi busted Growpital\u2019s \u2018assured\u2019 returns, LLPs and money trail\n\nA for apple, Y for yak and, for the first time, a price next to it. Will this change the non-agri part of the rural economy?\n\nSix months after oil spiked, why are markets reacting so sharply now?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers", "source": "Economic Times Economy", "pub_date_str": "06 Oct 2026, 12:16 PM IST", "pub_date_relative": "54m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Gold Eases Below $4,150: Why American Hartford Gold Says The Bullion Floor Won't Break", "full_content": "Despite high real yields, gold is bound to gain traction on expanding sovereign debt, geopolitical stress, and systemic uncertainty, says Max Baecker, President of American Hartford Gold.", "source": "NDTV Profit", "pub_date_str": "06 Oct 2026, 12:15 PM IST", "pub_date_relative": "55m ago", "cfa_topics": ["Fixed Income", "Alternative Investments"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "World Bank Upgrades India's FY27 Growth Forecast To 7.1%; Says High Energy Prices, El Nino Pose Risk", "full_content": "World Bank expects India's FY27 GDP growth at 7.1% from 6.6% earlier. It said India's consumption, investment and exports point to strong momentum.", "source": "NDTV Profit", "pub_date_str": "06 Oct 2026, 12:14 PM IST", "pub_date_relative": "56m ago", "cfa_topics": ["Economics", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Rupee slips to over 2-month low on portfolio outflows, RBI likely steps in", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Forex \u203a Forex News \u203a Rupee slips to over 2-month low on portfolio outflows, RBI likely steps in The Economic Times daily newspaper is available online now. Read Today's Paper Rupee slips to over 2-month low on portfolio outflows, RBI likely steps in SECTIONS Rupee slips to over 2-month low on portfolio outflows, RBI likely steps in By Reuters Last Updated: Oct 06, 2026, 12:11:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Indian rupee faced a setback on Tuesday, falling to its weakest position in more than two months. Continuous foreign divestment in local assets heightened pressure on the currency, igniting discussions of possible intervention from the central bank. Analysts foresee a cautious depreciation of the rupee throughout the upcoming year, bolstered by positive capital inflows into foreign reserves.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "06 Oct 2026, 12:11 PM IST", "pub_date_relative": "59m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Bond laddering: a simple way to manage interest-rate risk", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nWhen you invest a large sum in bonds or fixed deposits (FDs), you have to pick a tenure. Lock in for five years and you may miss out if rates rise later. Stay short and you may have to reinvest at lower rates if they fall. Bond laddering offers a simple way to navigate both risks.\n\nIn a ladder, you split your money across several bonds or deposits that mature at different times, usually a year or so apart. Each maturity is one \"rung\" of the ladder.\n\nSay you have \u20b9 10 lakh. You don't put all of it in a five-year bond. Instead, you put \u20b9 2 lakh each into instruments maturing in one, two, three, four and five years. When the one-year rung matures, you reinvest that \u20b9 2 lakh in a new five-year instrument. After the first few years, one part of your money matures every year, and each new rung earns the longer-tenure rate.\n\nThe main benefit is that you spread out your reinvestment risk. Because only part of your money comes up for reinvestment each year, you don't have to deploy the whole amount at a bad time.\n\nIf rates go up, the maturing rung can be reinvested at the higher rate. If they fall, the rest of your portfolio continues to earn the older, higher rates.\n\nThe second benefit is liquidity. Since something matures every year, you have a regular flow of cash for planned expenses, such as school fees or a retiree's household costs, without having to break a deposit early or sell a bond before maturity.\n\n\"When interest rates rise, bond prices fall. If you have to sell a long-term bond early, you could take a loss. A ladder avoids this because a part of your money matures every year, and bonds held to maturity pay back the contracted amount,\" pointed out Joydeep Sen, corporate trainer ( financial markets ) and author.", "source": "LiveMint Money", "pub_date_str": "06 Oct 2026, 12:10 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Fixed Income", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "HFCL shares hit 5% upper circuit again: Up 338% from 52-week low | Buy? Check target, stop loss", "full_content": "HFCL shares continued their sharp rally on Tuesday, October 6, extending gains for the fifth consecutive session as the telecom equipment and optical fibre cable maker hit another 5% upper circuit. The stock also scaled a fresh 52-week high, extending its strong run in 2026 despite a weak broader market.\n\nHFCL shares opened at \u20b9 262 on the BSE before hitting the 5% upper circuit at \u20b9 262.25, which also marked a new 52-week high. The stock has now surged more than 338% from its 52-week low of \u20b9 59.83, recorded in January 2026.\n\nThe multibagger stock has gained 21.5% in one week, 13.5% in one month, 17% in three months, 260.5% in six months and 253% over the past year.\n\nHFCL, which manufactures and deploys telecommunications equipment, optical fibre cables (OFCs) and advanced digital network solutions, has significantly outperformed the broader market in 2026. The stock has delivered a multibagger return of 245% so far this year, while the Nifty 50 has fallen nearly 15% during the same period.\n\nThe recent rally comes against the backdrop of a sharp improvement in the company's financial performance and a record order book.\n\nHFCL returned to profitability in Q1FY27, reporting a net profit of \u20b9 245.64 crore compared with a net loss of \u20b9 29.30 crore in Q1FY26. Revenue more than doubled to \u20b9 1,914.98 crore during the quarter.\n\nThe company also ended the first quarter with its highest-ever order book of \u20b9 26,665 crore, which was nearly five times its FY26 revenue. The strong order pipeline has emerged as an important factor in the company's growth outlook.\n\nHowever, the sharp rise has also brought the stock under regulatory surveillance. Exchanges have placed HFCL under Long-Term Additional Surveillance Measure Stage 4 (LT ASM-4), a framework used to monitor stocks witnessing abnormal price volatility, high concentration or heavy speculation.", "source": "LiveMint Markets", "pub_date_str": "06 Oct 2026, 12:08 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Derivatives", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Jio IPO: Latest GMP today, launch date, Reliance shareholder quota, expected share price band, size, valuation - Details", "full_content": "Jio Platforms is moving closer to what could be India\u2019s biggest-ever IPO, with the Reliance Industries-backed digital services major expected to file its final offer documents with SEBI in the week beginning 12 October, according to a PTI report. The company has already concluded its overseas roadshows, while SEBI issued its final observations on 28 August after Jio Platforms filed its draft IPO papers in June.\n\nThe public offering could raise around $3.8 billion, with the company proposing to issue up to 27 crore fresh equity shares, equivalent to about 2.9% of its post-issue equity base. The IPO comes amid a strong revival in India\u2019s primary market, with more than two dozen issues launched or announced since July.\n\nJio Platforms houses Reliance\u2019s digital businesses, including Reliance Jio Infocomm, India\u2019s largest telecom operator. For FY26, Jio Platforms reported a 15% rise in profit after tax to \u20b9 30,053 crore, while revenue increased 14.5% to \u20b9 1,46,885 crore.\n\nIf launched as expected, the IPO would mark the Reliance Group\u2019s first public offering since 2008 and its first IPO of a consumer-focused business in the conglomerate.\n\nJio Platforms IPO GMP today or grey market premium is +150. In the past three sessions, the IPO GMP has remained stable, with fluctuations limited to \u20b9 2 and a range of \u20b9 8. The present IPO GMP is at \u20b9 150, reflecting a consistent sentiment in the grey market.", "source": "LiveMint Markets", "pub_date_str": "06 Oct 2026, 12:04 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "\u20b935 per share dividend stock: 15% down in 2026 but cash reward announced - Check record date", "full_content": "Dividend stock : IT stock Accelya Solutions India had announced a \u20b9 35-per-share final dividend for FY26 with a face value of \u20b9 10, offering shareholders a fresh cash payout.\n\nThe company had fixed October 9 as the record date to determine shareholders eligible for the dividend. The payout is scheduled for November 17, subject to shareholder approval.\n\n\u201cWe wish to inform you that the Board of Directors at its meeting held today, has recommended final dividend of \u20b9 35/- per share, subject to the approval of shareholders of the Company at the ensuing Annual General Meeting. The dividend payout date is Tuesday, 17th November 2026,\u201d the company said in the filing.\n\nIt is to be noted that the record date is the eligibility cut-off for investors to be eligible for dividend payout.\n\nAccelya Solutions India has a history of paying both interim and final dividends. In 2026, it paid an interim dividend of \u20b9 45 per share, with February 6, 2026 as the ex-dividend date. The company had earlier paid a \u20b9 40 final dividend in FY25 and a \u20b9 50 interim dividend in early 2025.\n\nAt a share price of around \u20b9 1,100, Accelya Solutions India's upcoming \u20b9 35 final dividend translates into a quarterly dividend yield of about 3.2%. Meanwhile, the company's total dividend for the year 2026 stands at \u20b9 80 per share, implying an annual dividend yield of roughly 7.21% at the same share price\n\nAccelya Solutions India share price has gained 1.42% over the past week, indicating a modest recovery in the near term. However, the recent uptick comes after a weak monthly performance, with the stock declining 1.78% over the past one month.\n\nOn a broader timeframe, the stock has remained under pressure. Accelya Solutions India shares have descended 15.15% year-to-date (YTD) and has declined 25.91% over the past year. The stock has also fallen 33.87% in the last three years and 13.63% over the past five years.", "source": "LiveMint Markets", "pub_date_str": "06 Oct 2026, 12:00 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Fixed Income"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Stock Market Today LIVE: Sensex Jumps 400 Points, Nifty 50 Touches 22,700; Trent Surges 11%, Kotak Bank Extends Gains", "full_content": "Stock Market Today LIVE: Among sectors, barring Nifty IT, all other sectoral indices traded in the green, led by Nifty Metals, Nifty Private Bank, Nifty Pharma, Nifty Media and Nifty Oil & Gas.", "source": "NDTV Profit", "pub_date_str": "06 Oct 2026, 11:57 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Digital arrest scam: 67-year-old woman loses \u20b913 lakh to fake police officials; 5 money lessons for senior citizens", "full_content": "A 67-year-old senior citizen in Chhatrapati Sambhajinagar, Maharashtra, allegedly lost \u20b9 13 lakh after cyber criminals posing as police officials kept her under \u201cdigital arrest\u201d for about a week.\n\nThe fraudsters allegedly threatened her with arrest, claiming that her bank account was linked to an account suspected of being involved in terrorism. Fearing legal action, the woman transferred money to bank accounts provided by the scammers, according to a report by The Times of India .\n\nThe woman received WhatsApp calls between 23 and 30 September from an individual claiming to be a police official. He allegedly told her that her bank account was linked to a suspected terrorist account and threatened her with arrest.\n\nFearing legal action and its consequences, she transferred \u20b9 8 lakh via Real-Time Gross Settlement (RTGS) to a bank account provided by the cybercriminals on 29 September.\n\nThe following day, she transferred another \u20b9 5 lakh to a different account. She later realised that she had been duped and approached the authorities to report the alleged cyber fraud.\n\nThere is no such thing as \u2018digital arrest\u2019 in Indian law, as explained by a former judge earlier in his exclusive conversation with Mint . Further, any caller asking for money in order to settle a criminal proceeding or to prevent arrest should be treated as a serious fraud warning. Cases are not resolved through digital interactions or phone calls alone.\n\nFraudsters focus on creating fear and urgency in victims. That is why senior citizens should pause, reflect, and independently verify any serious allegations before making any payments.\n\nScammers may use police uniforms, digital paperwork, logos, backgrounds and fake documents to appear genuine. Such visuals do not prove that the caller is an actual officer.", "source": "LiveMint Money", "pub_date_str": "06 Oct 2026, 11:50 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "West Asia Crisis: FIA Flags 'Unprecedented' Financial Impact On Airlines, Seeks Urgent Govt Intervention", ses 80% to Rs 18 crore", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Newly-listed Steamhouse India shares hit 10% circuit after Q1 net profit rises 80% to Rs 18 crore BSE Share Price Multi Commodity Exchange of India Share Price Indian Energy Exchange Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Newly-listed Steamhouse India shares hit 10% circuit after Q1 net profit rises 80% to Rs 18 crore SECTIONS Newly-listed Steamhouse India shares hit 10% circuit after Q1 net profit rises 80% to Rs 18 crore By Veer Sharma , ETMarkets.com Last Updated: Oct 06, 2026, 11:36:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Newly-listed Steamhouse India shares hit the 10% upper circuit after the company reported an 80.25% year-on-year rise in Q1 FY27 net profit to Rs 18 crore. Revenue from operations rose 13.35% to Rs 129 crore, while margins improved 700 basis points to 24.05% during the quarter.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "06 Oct 2026, 11:36 AM IST", "pub_date_relat
