<script>
    // This variable will be injected during the build process
    const allData = {"general": [{"title": "Metal stocks to buy! APL Apollo Tubes, Hindalco: Axis Sec lists 2 conviction picks post Q2 results 2026; check targets", "full_content": "Pranati Deva Published 18 Nov 2026, 02:06 PM IST Prefer Livemint on Google Metal stocks to buy : Metal stocks delivered a mixed performance in the September quarter, as stronger sales volumes and improved realisations supported earnings, while elevated raw material costs continued to put pressure on margins across parts of the sector.\n\nAgainst this backdrop, Axis Securities has identified two stocks as its top conviction ideas, with a preference for companies that can protect profitability through value-added products, operating efficiencies and expansion in higher-margin businesses.\n\nIn its November 2026 report, the brokerage has assigned Buy ratings to APL Apollo Tubes and Hindalco Industries , with target prices of \u20b9 2,500 and \u20b9 1,060, respectively.\n\nAmong aluminium companies, Hindalco reported consolidated revenue of \u20b9 91,708 crore in Q2 FY27, up 39% year-on-year, while EBITDA increased 43% to \u20b9 12,831 crore. Adjusted attributable profit after tax rose 59% to \u20b9 7,533 crore. National Aluminium Company (NALCO) recorded revenue growth of 26% to \u20b9 5,419 crore and a 25% rise in EBITDA to \u20b9 2,411 crore. However, its EBITDA margin contracted 100 basis points to 44%, as power, fuel and raw material expenses increased.\n\nSteel companies also reported varied results. Tata Steel's consolidated revenue rose 11% year-on-year to \u20b9 65,436 crore, while adjusted EBITDA increased 19% to \u20b9 13,462 crore. Steel Authority of India (SAIL) reported adjusted revenue of \u20b9 31,998 crore, up 20%, but adjusted EBITDA of \u20b9 4,216 crore was affected by higher coking coal costs. Coal India recorded a 21% increase in net sales to \u20b9 44,179 crore and a 53% rise in attributable net profit to \u20b9 6,516 crore, although operating profitability missed expectations.\n\nMeanwhile, APL Apollo Tubes reported revenue of \u20b9 6,797 crore, up 25% year-on-year.", "source": "LiveMint Markets", "pub_date_str": "18 Nov 2026, 02:06 PM IST", "pub_date_relative": "4m ago"}, {"title": "50% STT cut, LTCG and STCG tax relief: What the government is considering ahead of Union Budget 2027", "full_content": "A 50% reduction in the securities transaction tax (STT) is one of the proposals being reviewed by the Indian revenue officials, as the government considers raising taxes on derivatives to curb speculative trading, while lowering levies on share trading, Bloomberg reported on Wednesday.\n\nAs per the report, the shortlisted recommendations will be presented to Finance Minister Nirmala Sitharaman.\n\nCentral Board of Direct Taxes (CBDT) Chairman Ravi Agrawal had earlier said that the Finance Ministry was examining suggestions from various stakeholders during pre-Budget consultations.\n\nHe said the government was analysing the concerns and recommendations raised by stakeholders, including those related to capital gains taxation, while speaking on the sidelines of an event in New Delhi.\n\nHe added that the government would examine different aspects of the capital gains tax regime before announcing its decision in the Union Budget on 1 February 2027.\n\nThe proposals are being reviewed ahead of the Union Budget amid calls from market participants to address concerns over the taxation of equity investments.\n\nSTT is a tax charged on the value of every eligible trade, whether the investor makes a profit or a loss. Lower taxes on derivatives have encouraged speculative bets, particularly in options, while cash market trading has remained relatively subdued. According to the Securities and Exchange Board of India (SEBI), nearly 88% of individual traders in equity derivatives lost money in the year ended March 2026. Their combined losses stood at around \u20b9 91,700 crore ($10 billion), with options accounting for 92% of the total.\n\nSTT, along with the long-term and short-term capital gains tax, is often viewed as a double whammy by market participants. And there have been growing calls for abolition of LTCG tax on equities also.", "source": "LiveMint Money", "pub_date_str": "18 Nov 2026, 02:05 PM IST", "pub_date_relative": "6m ago"}, {"title": "Earnings call transcript: Omda Q3 2026 shares fall as integration weighs on margin", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Nov 2026, 02:02 PM IST", "pub_date_relative": "9m ago"}, {"title": "European shares muted as tech offsets mining weakness", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Nov 2026, 02:00 PM IST", "pub_date_relative": "10m ago"}, {"title": "Jet2 tumbles after cutting winter seat capacity, H1 profit declines", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Nov 2026, 02:00 PM IST", "pub_date_relative": "10m ago"}, {"title": "FTSE 100 today: Stocks dip as miners drag on metals slump, CPI up at 3.6%", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Nov 2026, 02:00 PM IST", "pub_date_relative": "11m ago"}, {"title": "Indonesia stocks lower at close of trade; IDX Composite Index down 0.77%", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Nov 2026, 02:00 PM IST", "pub_date_relative": "11m ago"}, {"title": "Putin says EU is losing industry, falling behind competition, ahead of meeting with Trump and Xi", "full_content": "SHENZHEN, China \u2014 Russian President Vladimir Putin said the European Union was falling behind competition in a speech Wednesday at the Asia-Pacific Economic Cooperation CEO Summit.\n\n\"The EU is now losing its industrial capacity and it's losing in the competition,\" Putin said, according to an official English translation.\n\nPutin used the speech to emphasize Russia's economic resilience despite U.S. sanctions, and played up opportunities for APEC members in the country, from tech to economic development.\n\nHe was the third APEC leader to speak at the summit, and followed remarks by Chinese President Xi Jinping and Malaysian Prime Minister Anwar Ibrahim.\n\nIn his speech, Putin highlighted the country's ability to withstand a sharp drop in its U.S. dollar- and euro-denominated transactions. He also urged members to support Russia in hosting APEC in 2035.\n\nThe Russian leader is set to hold talks on Thursday with Xi and U.S. President Donald Trump in a historic meeting that could see a wide range of issues being discussed, including nuclear non-proliferation and also possibly Russia's war with Ukraine. He met with Xi on Wednesday, according to Chinese state media.\n\nRussian presidential aide Yuri Ushakov said last week the meeting in Shenzhen would continue the efforts aimed at reaching a negotiated settlement to the Ukraine war, according to state-controlled local media Russia Today.\n\nThe summit will likely yield little concrete result, but presents an \"almost 100% photo op\" that lifts China's status and power at the top table, David Roche, strategist at Quantum Strategy, told CNBC's \" Access Middle East \" earlier this week.", "source": "CNBC Finance", "pub_date_str": "18 Nov 2026, 01:59 PM IST", "pub_date_relative": "11m ago"}, {"title": "Experian adds $500 million buyback as H1 earnings climb 15%; shares up", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Nov 2026, 01:58 PM IST", "pub_date_relative": "12m ago"}, {"title": "Workspace shares sink as dividend decision deferred and loss widens", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Nov 2026, 01:57 PM IST", "pub_date_relative": "13m ago"}, {"title": "Failed ATM, UPI or cheque transaction? Know when banks can charge you and how to seek redressal under RBI rules", "full_content": "A failed transaction does not always mean you escape the bank's service charges. A cheque returned due to insufficient funds, a failed automatic payment mandate, or an ATM transaction declined for lack of balance can attract a fee, depending on your bank's tariff and account terms.\n\nHowever, banks cannot levy arbitrary charges. The reason for the failure, applicable RBI guidelines and whether the fee was disclosed to you determine whether you can challenge the deduction and seek a refund. Here's what you need to know.\n\nBanks can collect charges for certain failed transactions if these are disclosed in their applicable schedule of charges and account terms.\n\nFor example, SBI charges \u20b9 250 plus GST for a failed NACH mandate and \u20b9 500 plus GST for a cheque returned due to insufficient funds. It also levies \u20b9 20 plus GST for ATM transactions declined due to insufficient balance in savings and current accounts. However, the bank does not charge for other failed ATM transactions, including declines due to an incorrect PIN.\n\nHDFC Bank charges \u20b9 500 for the first ECS/ACH mandate return in a month and \u20b9 550 for subsequent returns. Cheque returns due to insufficient funds incur similar charges, while an ATM transaction declined due to insufficient balance at another bank's ATM or merchant outlet incurs a \u20b9 25 charge plus applicable taxes. These charges are subject to the banks' applicable account terms and tariff schedules.\n\nThese protections apply only to failures not attributable to the customer, and the bank is liable to pay compensation to the customer.", "source": "LiveMint Money", "pub_date_str": "18 Nov 2026, 01:57 PM IST", "pub_date_relative": "13m ago"}, {"title": "Canada adjusts China ties, Carney says, aiming to clinch right deal with US", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Nov 2026, 01:55 PM IST", "pub_date_relative": "16m ago"}, {"title": "Analysis-Nvidia\u2019s numbers impress but investors fret over CEO succession", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Nov 2026, 01:54 PM IST", "pub_date_relative": "16m ago"}, {"title": "Deutsche Bank shares open 1.9% lower a day after leak news", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Nov 2026, 01:54 PM IST", "pub_date_relative": "16m ago"}, {"title": "Stock futures rise as Nvidia gains on earnings beat and solid outlook: Live updates", "full_content": "Stock futures climbed Wednesday morning after the S&P 500 fell for a fourth straight day. Traders also weighed Nvidia 's better-than-expected earnings report.\n\nNasdaq-100 futures were up 0.8%, while S&P 500 futures added 0.48%. Dow Jones Industrial Average futures were up 0.2%.\n\nMost Asian markets closed in positive territory after a choppy trading session.\n\nSouth Korea's Kospi led gains in the region as chip heavyweights gained ground, ending 1.99% higher at 5,067.44, while Japan's Nikkei 225 gained 0.28% to close at 59,024.28,\n\nHong Kong's Hang Seng Index was 0.87% lower in its final hour of trade, while the CSI 300 on mainland China advanced 0.18% to 3,983.77. Australia's S&P/ASX 200 slipped 0.69%, marking a fifth straight day of losses.\n\nShares of Nvidia jumped 4% in extended trading after the company's profit and revenue in the third quarter beat analysts' estimates. The company also lifted its revenue guidance for the fiscal year ending January 2028, calling for 75% growth year over year.\n\n\"The fact that they gave guidance is huge,\" said Gene Munster, managing partner at Deepwater Asset Management, on CNBC's \"Closing Bell: Overtime. \" \" That is a very bullish sign. I expect the stock to move higher based just on that alone.\"\n\nNeocloud companies also rose in extended trading. CoreWeave advanced 8%, while Nebius Group gained 10%.", "source": "CNBC Top News", "pub_date_str": "18 Nov 2026, 01:51 PM IST", "pub_date_relative": "19m ago"}, {"title": "Jio Platforms shares gain over 26% from IPO price: Should investors hold, buy more or book profits? What experts say", "full_content": "Dhanya Nagasundaram Published 18 Nov 2026, 01:50 PM IST Prefer Livemint on Google Jio Platforms shares have climbed over 26% from their IPO issue price of \u20b9 1,119, rewarding investors who subscribed to the country's largest public issue.\n\nJio Platforms share price today opened at \u20b9 1,399.70 apiece on the BSE; the stock touched an intraday high of \u20b9 1,413.95 per share and a low of \u20b9 1,388.25 apiece.\n\nBut after the strong listing gains, the focus is shifting to whether the stock can sustain its upward momentum.\n\nThe company's first results as a listed entity showed healthy growth in revenue and profitability, backed by subscriber additions, higher ARPU and expanding digital services.\n\nJio Platforms made its stock market debut on the NSE and BSE on 28 October 2026, following its \u20b9 30,188-crore IPO, which became India's largest public issue.\n\nThe shares listed at \u20b9 1,358 apiece, a premium of 21.36% over the issue price of \u20b9 1,119, and ended their first trading session at \u20b9 1,419. This translated into a gain of nearly 27% over the IPO price.\n\nThe IPO proceeds have also been directed towards strengthening the company's balance sheet. Of the total amount raised, \u20b9 27,500 crore has been utilised to prepay certain external commercial borrowings of its subsidiary, Reliance Jio Infocomm.\n\nThe strong debut quickly placed Jio Platforms among India's most valuable listed companies, reflecting investor interest in its telecom, digital services and technology businesses.", "source": "LiveMint Markets", "pub_date_str": "18 Nov 2026, 01:50 PM IST", "pub_date_relative": "20m ago"}, {"title": "BSF Tradesman Admit Card 2026 Out For December 2 Exam; Check Download Link and Shift Timing", "full_content": "The BSF has said that admit card download links have been shared on email addresses and mobile numbers registered during the application process.", "source": "NDTV Profit", "pub_date_str": "18 Nov 2026, 01:48 PM IST", "pub_date_relative": "23m ago"}, {"title": "Ramayana Box Office Collection Nears Rs 1,500 Crore. Why Its Production House's Investors Lost Over Rs 2,300 Crore", "full_content": "Since the film's release on November 5, Prime Focus shares have declined nearly 10%, erasing around Rs 2,305 crore from the company's market capitalisation in less than two weeks.", "source": "NDTV Profit", "pub_date_str": "18 Nov 2026, 01:46 PM IST", "pub_date_relative": "24m ago"}, {"title": "Stock Market Today: Sensex Falls 720 Points, Nifty 50 Below 25,200; Titan Tanks 5%", "full_content": "Oil prices were trading lower on Wednesday, with Brent crude trading around $93 a barrel. Concerns over rising tensions in the Middle East were outweighed by expectations of higher global supplies.", "source": "NDTV Profit", "pub_date_str": "18 Nov 2026, 01:42 PM IST", "pub_date_relative": "28m ago"}, {"title": "Karan Johar Urges Prince William To Watch 'Kabhi Khushi Kabhie Gham' During Mumbai Visit", "full_content": "Prince William visited Karan Johar's Dharma Productions in Mumbai, experiencing Indian cinema's song, dance, and hospitality.", "source": "NDTV Profit", "pub_date_str": "18 Nov 2026, 01:41 PM IST", "pub_date_relative": "29m ago"}, {"title": "Bird Flu Can Cost Rs 3,000 Crore Loss To India But Now There Is 'Made In India' Solution", "full_content": "Commonly known as bird flu, Highly Pathogenic Avian Influenza (HPAI) is a variant of the serious poultry disease that can cause mortality approaching 100% among infected birds.", "source": "NDTV Profit", "pub_date_str": "18 Nov 2026, 01:39 PM IST", "pub_date_relative": "31m ago"}, {"title": "Southeast Asia\u2019s data center boom leaned on Chinese demand. New U.S. rules put that pipeline at risk", "full_content": "New U.S. export rules could slow Southeast Asia's data center boom by tightening access to advanced AI chips and targeting the region's role in providing computing power to Chinese companies.\n\nAccording to an interim rule released Monday by the Commerce Department, data centers in Singapore, Malaysia, Thailand and Indonesia will need a U.S. government license to purchase advanced AI chips, including those from Nvidia.\n\nFacilities already serving large Chinese customers will have 90 days to apply for a license or face future export restrictions, the rule said.\n\nThe region has seen a surge in data center construction to house the semiconductors needed to train and develop artificial intelligence models.\n\nU.S. restrictions on China's access to Nvidia's most advanced chips have pushed Chinese technology firms, including Alibaba Group and ByteDance, to rent computing capacity in overseas data centers.\n\nAbout 75% of China's overseas AI compute was forecast to be concentrated in Southeast Asia by the end of 2026, according to October estimates by the Institute for Progress, a Washington-based think tank.\n\nThe buildout has come under greater scrutiny as Washington presses ahead with the investigation into Nvidia 's former CEO Jensen Huang .\n\nHuang left the company that he co-founded in 1993 after reports of several alleged extramarital affairs, including one with a suspected Chinese spy who is believed to facilitate billions of dollars worth of Nvidia chips into China.", "source": "CNBC World Economy", "pub_date_str": "18 Nov 2026, 01:39 PM IST", "pub_date_relative": "31m ago"}, {"title": "Why Stock Market Is Falling Today? Sensex Drops Over 700 Points, Nifty 50 Below 25,200", "full_content": "The 25,500 level remains a crucial near-term resistance for Nifty 50, and a sustained breakout above this hurdle could strengthen the upward momentum, opening the way for further gains towards the 25,80026,000 zone.", "source": "NDTV Profit", "pub_date_str": "18 Nov 2026, 01:39 PM IST", "pub_date_relative": "31m ago"}, {"title": "'PLEASE DON'T': After Temple, The Liver Doc Warns Against Yuvraj Singh's Newly-Launched P32 Supplement", "full_content": "The product is PROTOCOL32. Yuvraj launched it at The Bay Club in Mumbai on 31 October, as a daily sachet that packs 32 supplements.", "source": "NDTV Profit", "pub_date_str": "18 Nov 2026, 01:38 PM IST", "pub_date_relative": "33m ago"}, {"title": "Adani Stocks, Private Banks, Real Estate: Where Gautam Shah Sees Big Opportunities", "full_content": "Speaking to NDTV Profit, Shah said the Adani Group remains one of his preferred investment themes, reiterating his positive view on the conglomerate.", "source": "NDTV Profit", "pub_date_str": "18 Nov 2026, 01:37 PM IST", "pub_date_relative": "33m ago"}, {"title": "Panchayat Season 5 Release Date: Phulera Gang's New Chapter Will Start On THIS Day", "full_content": "Panchayat season five premieres on December three on Prime Video, continuing the story of village politics in Phulera with new leadership changes.", "source": "NDTV Profit", "pub_date_str": "18 Nov 2026, 01:30 PM IST", "pub_date_relative": "40m ago"}, {"title": "China\u2019s Xi calls for removing trade and investment barriers ahead of his meeting with Trump and Putin", "full_content": "SHENZHEN, China \u2014 Chinese President Xi Jinping opened a key Asia-Pacific Economic Cooperation meeting on Wednesday with calls for removing trade and investment barriers.\n\nThe leader spoke as he was expected to host Russian President Vladimir Putin and U.S. President Donald Trump this week alongside the APEC CEO and Economic Leaders Summit.\n\n\"We should remove trade and investment barriers,\" Xi said via an official English translation. He said a key reason for doing so was \"to promote development that is balanced.\"\n\nHe did not mention U.S. tariffs or other specific measures. Instead, Xi cast China as a \"promising land for development\" for global businesses, and indicated plans for \"Bay Area\" cooperation.\n\nShenzhen, home to major Chinese tech companies, is part of China's \"Greater Bay Area\" that includes Hong Kong and Macau. The Silicon Valley region around San Francisco is also known as the \"Bay Area\" in the U.S.\n\n\"China will not only cut tariffs and expand market access, but also go a step further,\" Xi said. He said China would \"reform\" rules and regulations to give foreign businesses \"full manufacturing access.\"\n\nChinese exports have steadily grown their share of global manufactured goods, drawing criticism from the European Union and other regions for overcapacity. The U.S. and China last year agreed to keep tariffs lower, but the world's two largest economies have yet to implement a planned $30 billion cut in duties on goods from each side.\n\n\"Global growth lacks momentum,\" Xi noted in his speech. But he said \"still global trade keeps growing against headwinds, and breakthroughs are being made in emerging technologies at a faster pace.\"", "source": "CNBC Top News", "pub_date_str": "18 Nov 2026, 01:30 PM IST", "pub_date_relative": "41m ago"}, {"title": "Samantha Ruth Prabhu Shares Family Pooja Pics As She Prepares To Welcome Her Baby | Photos", "full_content": "'Maa Inti Bangaaram' actor Samantha Ruth Prabhu shared pictures from an intimate puja ceremony at home with husband Raj Nidimoru as the couple prepare to welcome their first child.", "source": "NDTV Profit", "pub_date_str": "18 Nov 2026, 01:27 PM IST", "pub_date_relative": "44m ago"}, {"title": "Your PPF Nominee Is A Minor: Who Can Claim The Money And Who Receives It?", "full_content": "PPF scheme allows you to make a minor as the account nominee, but you need to appoint a guardian to handle the claim if you pass away.", "source": "NDTV Profit", "pub_date_str": "18 Nov 2026, 01:26 PM IST", "pub_date_relative": "44m ago"}, {"title": "Titan, Kalyan Jewellers, PC Jeweller fall up to 5%: Why are jewellery stocks losing shine despite lower gold prices?", "full_content": "PCJEWELLER SENCO MCX A Ksheerasagar Published 18 Nov 2026, 01:26 PM IST Prefer Livemint on Google Shares of major jewellery companies, including Titan, Kalyan Jewellers, Thangamayil Jewellery and PC Jeweller , witnessed selling pressure on Wednesday, November 18, falling up to 5%. The weakness comes despite the possibility that lower gold prices could support jewellery demand by making purchases more affordable for consumers.\n\nTitan shares dropped 4.8% to the day's low of \u20b9 4681, while Kalyan Jewellers slipped 5.3% to \u20b9 645.80 apiece. Thangamayil Jewellery PC Jeweller and Senco Gold were also down by over 2.5%.\n\nAlthough falling gold prices could boost jewellery sales, the Street was concerned that customers may delay purchases further in anticipation of additional price corrections, particularly for high-value wedding jewellery. This could postpone the recovery in sales volumes and weigh on retailers' near-term revenue growth.\n\nAnother factor investors are tracking is how jewellery retailers manage their gold inventory through hedging. While hedging helps protect companies against bullion price volatility, it can also limit the benefit of falling prices.\n\nThe impact of bullion price movements is also reflected in jewellery companies' earnings, with inventory gains and losses influencing profitability alongside sales volumes and margins.\n\nMCX gold dropped another 2.5% to their lowest level in more than a year, to reach \u20b9 1,31,063 per 10 grams, pressured by a stronger US dollar and expectations of higher US interest rates, while investors awaited minutes from the Federal Reserve's meeting for clues on its monetary policy outlook.\n\nMCX silver also slipped around 3.5% to \u20b9 6169 per kilo after touching its lowest level since late October 2025 earlier in the session.\n\nThe dollar hovered near a 19-month high, making greenback-priced bullion more expensive for overseas buyers.", "source": "LiveMint Markets", "pub_date_str": "18 Nov 2026, 01:26 PM IST", "pub_date_relative": "44m ago"}, {"title": "Ramayana Box Office Collection: Will Ranbir Kapoor's Ramayana Cross 900 Crore India Net Today?", "full_content": "Ranbir Kapoor, Sai Pallavi and Yash's 'Ramayana' is just Rs 17.38 crore away from entering the Rs 1,000 crore India gross club.", "source": "NDTV Profit", "pub_date_str": "18 Nov 2026, 01:20 PM IST", "pub_date_relative": "50m ago"}, {"title": "Six Days, Four Major Outages: Email, Flights, Banks And Digital Payments; What Caused Disruptions?", "full_content": "None of the four was blamed on hackers. Each traced back to routine changes inside complex systems: an upgrade, a network fault, a software bug and an update.", "source": "NDTV Profit", "pub_date_str": "18 Nov 2026, 01:18 PM IST", "pub_date_relative": "52m ago"}, {"title": "Nvidia's Leadership Crisis: Why IBM CEO Arvind Krishna Isn't Worried About Rivals", "full_content": "Krishna told NDTV in an interview that Nvidia sold out for the next two years and as long as the engineering talent is there, one leader disappearing is not going to make a big difference to the trajectory for the next two years", "source": "NDTV Profit", "pub_date_str": "18 Nov 2026, 01:15 PM IST", "pub_date_relative": "55m ago"}, {"title": "India\u2019s earnings recovery could put large-caps back in favour", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nEquity returns may be shaped by earnings over the long run, but in the short term they are driven by many more factors, collectively described as sentiment. In India, we are witnessing a shift on both fronts.\n\nLet\u2019s start with the most important factor: corporate profit growth. Second-quarter results indicate that Nifty 50 profit growth is likely to be around 25%. This follows high-teen growth (13-19%) in the first quarter, sustaining a recovery after two tepid years. Had someone projected these growth numbers for the next two quarters at the start of the West Asia war in March, the forecast would have been met with complete disbelief.\n\nTo begin with, discretionary consumption has remained strong, aided by the tax cuts in 2025, while other consumer segments are benefiting from a low base. The impact of cost pressures on margins has been gradual, though risks linger, particularly as companies have not fully passed on higher costs and poor monsoons could curtail demand.\n\nCredit growth in banks has picked up, helped by cyclical factors such as commodity prices and substitution from bond-market borrowing. Asset quality has remained pristine despite geopolitical upheavals. The rate-hike cycle would add further to positive earnings revisions for the banking sector over the next 12 months.\n\nAbove all, India offers a wide range of sectors across financial services, consumption, healthcare, manufacturing and infrastructure, providing relative stability in an uncertain macroeconomic environment.\n\nA couple of related points are key to understanding market returns and investor behaviour over the past two years, as well as what could happen next.\n\nNifty 50 profit growth over the last two years (FY24-26) was a paltry 6% CAGR.", "source": "LiveMint Money", "pub_date_str": "18 Nov 2026, 01:13 PM IST", "pub_date_relative": "57m ago"}, {"title": "He Is James Bond': Jeff Bezos Was Heavily Involved' In Decision To Choose Robert Pattinson As 007", "full_content": "Amazon now has a major say in the 007 franchise after buying MGM in 2022. This will be the first Bond film without the Broccoli family controlling its creative direction since 1962.", "source": "NDTV Profit", "pub_date_str": "18 Nov 2026, 01:12 PM IST", "pub_date_relative": "58m ago"}, {"title": "Nvidia's Strong Q3 Results Fail To Ease Investor Concerns; AI Spending, Leadership In Focus, Says Saxo's Charu Chanana", "full_content": "Chanana says Nvidia's strong results have helped address some concerns around business continuity but uncertainty around leadership remains.", "source": "NDTV Profit", "pub_date_str": "18 Nov 2026, 01:10 PM IST", "pub_date_relative": "1h ago"}, {"title": "97 Pages Of Doom: The Only IPO That Warns Its AI Might End The World", "full_content": "Several risks have already turned into business decisions. Anthropic says it limited the release of Mythos because of the model's advanced cyber capabilities, potentially giving up near-term revenue.", "source": "NDTV Profit", "pub_date_str": "18 Nov 2026, 01:07 PM IST", "pub_date_relative": "1h ago"}, {"title": "Indian economic growth seen at annual 7.6% in July-September quarter, economists say", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Indicators \u203a Indian economic growth seen at annual 7.6% in July-September quarter, economists say The Economic Times daily newspaper is available online now. Read Today's Paper Indian economic growth seen at annual 7.6% in July-September quarter, economists say SECTIONS Indian economic growth seen at annual 7.6% in July-September quarter, economists say Reuters Last Updated: Nov 18, 2026, 01:00:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India's economy is predicted to grow by 7.6% in the July-September quarter according to economists. Consumer demand has shown resilience, mitigating the effects of rising inflation pressures. Predictions indicate continued strength from passenger vehicle sales and bank credit growth. Despite potential slowdowns in the second half of the fiscal year, investments are expected to improve. The Reserve Bank of India may raise rates as economic conditions evolve.\n\nWhy IndiGo could land a sharp rebound in profit despite a sluggish aviation market\n\nKYC and KYB: Pidilite\u2019s business has more tailwinds than headwinds, but a continuous test called raw material prices \u2013 Concluding part\n\nGold still rules, but with a difference: How young India is redefining wedding jewellery\n\nTariffs, supply snags and a war: 6 sectors that pulled it off through all of the trouble\n\nHow India\u2019s INR22.5 lakh crore gold loan boom is hiding a big hole\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers", "source": "Economic Times Economy", "pub_date_str": "18 Nov 2026, 01:00 PM IST", "pub_date_relative": "1h ago"}, {"title": "Govt weighs tax tweaks to boost stock trading, curb derivatives: Report", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Govt weighs tax tweaks to boost stock trading, curb derivatives: Report The Economic Times daily newspaper is available online now. Read Today's Paper Govt weighs tax tweaks to boost stock trading, curb derivatives: Report SECTIONS Govt weighs tax tweaks to boost stock trading, curb derivatives: Report Bloomberg Last Updated: Nov 18, 2026, 01:15:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The government is reviewing proposals to cut securities transaction tax on cash equities by 50% while raising levies on derivatives to curb speculative trading and encourage broader market participation. Officials are also considering a reduction in long-term capital gains tax. The recommendations will be presented to Finance Minister Nirmala Sitharaman ahead of Budget 2027.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "18 Nov 2026, 12:54 PM IST", "pub_date_relative": "1h ago"}, {"title": "Luxury for less: do hotel memberships really pay off?", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nDo you enjoy luxury hotel stays, elaborate buffets, room service and access to premium gyms and spas? You may have come across hotel membership programmes that promise to make these experiences more affordable. For an annual fee, they offer complimentary stays, discounts on rooms, dining and spa services, upgrades and other privileges.\n\nOn paper, the proposition sounds tempting. But do these memberships deliver value for money? We spoke to people who have used hotel memberships to understand their experiences, the limitations they faced and whether they would recommend buying one.\n\nHotel memberships differ in geographical reach and benefits. We looked at some of the annual membership offers to understand the mix of benefits and discounts available.\n\nThe Leela Palaces , Hotels and Resorts and Radisson Hotels offer property-specific options. Taj Hotels and the Accor Group provide wider access across properties in India and overseas. ITC Hotels' Culinaire programme covers participating properties in India.\n\nITC's Culinaire Elite, priced at \u20b9 29,500 excluding GST, offers two complimentary-night vouchers, four buffet meal vouchers for two people each and two vouchers for 50% off eligible dining bills. Members also get 20% off regular dining, spa treatments and laundry. Its lower-priced options are Culinaire Select at \u20b9 19,000 and Culinaire Classic at \u20b9 8,500, with fewer complimentary benefits.\n\nTaj Epicure has two tiers: Preferred at \u20b9 25,000 plus GST and Privileged at \u20b9 50,000 plus GST. Both offer 25% off food and beverages at participating outlets.", "source": "LiveMint Money", "pub_date_str": "18 Nov 2026, 12:54 PM IST", "pub_date_relative": "1h ago"}, {"title": "Senators press acting U.S. Navy Secretary on Iran war costs, sailor health in confirmation hearing", "full_content": "Acting U.S. Navy Secretary Hung Cao's confirmation hearing before the Senate Armed Services Committee led to some heated exchanges as he was grilled about sailors' health and the Iran war.\n\nThe Navy changed condition codes on munitions previously classified as expired in order to use them, Cao told senators Tuesday, as lawmakers questioned the conflict's strain on weapons stocks and naval deployments. He also said the military had increased production of key weapons.\n\n\"When I was in uniform, we only produced 125 Tomahawks a year. Right now, we're well above 60 every month,\" he said, adding that the military was working to increase SM-6 missile production and bring in additional ammunition manufacturers.\n\nCao's confirmation hearing comes as the Republicans, who hold a majority in both the House and Senate, are coming to the end of their time in power in both houses. The Democratic Party flipped many seats in the midterm elections to win a comfortable majority in the next session starting in January. President Donald Trump's nominees for offices, and his legislative agenda, will face much tougher challenges then.\n\nCao said the Navy was accelerating work on unmanned surface vessels to relieve the 17 destroyers supporting the blockade of Iran's ships, in hopes of reducing the strain on the Fifth Fleet. But Senators still pointed to the war's effect on the Navy's resources.\n\n\"For the first time in many years, the United States has no forward-deployed carrier in the Pacific at this moment,\" Sen. Jack Reed (D-R.I.) noted.\n\nCao acknowledged that the war was \"stressing our naval resources.\" However, he argued that the demonstration of combined American military capabilities had \"really set China back on their heels,\" a characterization Sen. Mazie Hirono (D-Hawaii) disputed.\n\nLawmakers also pressed Cao on the war's financial costs, with Cao appearing to agree with Sen.", "source": "CNBC Top News", "pub_date_str": "18 Nov 2026, 12:54 PM IST", "pub_date_relative": "1h ago"}, {"title": "Salman Khan Surprises Maatrubhumi Team With Luxury Watches Worth Rs 2-6 Lakh Each", "full_content": "Salman Khan gifted 20 to 25 luxury watches, each worth between Rs 2 lakh and Rs 6 lakh, to the cast and crew of his upcoming war film Maatrubhumi.", "source": "NDTV Profit", "pub_date_str": "18 Nov 2026, 12:51 PM IST", "pub_date_relative": "1h ago"}, {"title": "Gold, Silver Prices Down To The Price Of iPhone 17 Pro, iPhone 18 Pro; Check Details", "full_content": "Gold is down 27.5% from its peak and silver has fallen 61% from its record high, putting bullion near iPhone Pro prices: iPhone 17 Pro costs Rs 1.28 lakh-1.75 lakh, while iPhone 18 Pro ranges from Rs 1.65 lakh to Rs 2.40 lakh.", "source": "NDTV Profit", "pub_date_str": "18 Nov 2026, 12:50 PM IST", "pub_date_relative": "1h ago"}, {"title": "Nvidia warns chip buyers of legal risks tied to China AI access, sources tell CNBC", "full_content": "Nvidia warned its customers that new legislation on Chinese companies remotely accessing its artificial-intelligence chips could expose it and them to U.S. \"legal action,\" sources told CNBC.\n\nThe chip giant is facing increasing scrutiny from U.S. lawmakers over Chinese companies' access to its advanced chips, which U.S. export controls restrict from going to China.\n\nNvidia messaged chip buyers in recent months to caution that the proposed Remote Access Security Act, or RASA, would give the U.S. government broader authority to control access to cloud services in the same way as physical hardware, potentially exposing both parties to legal risk, according to two people with direct knowledge of the matter. The people asked not to be named while discussing private communications.\n\nIt also said that, for now, it would not sell its chips to customers who rent more than 50% of the graphics processing units, or GPUs, to Chinese companies, the people said.\n\nSeparately, the Financial Times reported earlier this month that Nvidia verbally told data-center clients to direct at least 51% of their services to non-Chinese customers under future contracts.\n\nRegulators have had limited powers to control companies' access to those chips through cloud services hosted overseas.\n\nRASA passed the House of Representatives in January but has not yet passed the Senate. Remote access to the chips has provoked the ire of President Donald Trump 's administration, which has sought to keep the chips out of China to maintain the U.S. lead in the AI race.\n\nCNBC reported on Nov. 5 that Chinese lab Moonshot AI sought access to Nvidia chips through data centers in Europe. The Trump administration previously singled the company out, accusing it in July of accessing the chips through centers in East Asia.", "source": "CNBC World Economy", "pub_date_str": "18 Nov 2026, 12:46 PM IST", "pub_date_relative": "1h ago"}, {"title": "No MTF Decision Yet, Longer Market Hours Unlikely: SEBI Chair Tuhin Kanta Pandey", "full_content": "SEBI Chairman Tuhin Kanta Pandey said the regulator has not decided on proposals to revamp the Margin Trading Facility framework, while citing cybersecurity risks as a hurdle to extending market hours.", "source": "NDTV Profit", "pub_date_str": "18 Nov 2026, 12:42 PM IST", "pub_date_relative": "1h ago"}, {"title": "How Ashish Kacholia, Radhakishan Damani, Madhusudan Kela and other ace investors reshuffled their portfolios in Q2", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News How Ashish Kacholia, Radhakishan Damani, Madhusudan Kela and other ace investors reshuffled their portfolios in Q2 Written by Eshita Gain , ETMarkets.com | Nov 18, 2026, 12:47:14 PM IST 1 / 8 Portfolio shuffle Some of India's most prominent individual investors in terms of their stock portfolio value, including Mukul Agrawal, Akash Bhanshali and Ashish Kacholia, emerged as the biggest portfolio gainers during the July-September quarter.\n\nHowever, the trend was not uniform across all ace investors. DMart founder Radhakishan Damani recorded the steepest decline in portfolio value among the prominent investors tracked, according to data from Prime Database.\n\nFor the study, only holdings in which these investors owned more than 1% equity in listed companies were considered. Here are the top three stocks held by these individual investors and the stocks in which they increased or decreased their holdings.\n\nMukul Agrawal, chairman and founder of Param Capital, holds stocks with a net worth of over Rs 7,474 crore. His portfolio gained 30% in the July-September quarter, making him the biggest gainer among his peers.\n\nHis top three stock holdings (as of September 30) are ESDS Software, Neuland Laboratories and Nuvama Wealth.\n\nCompanies in which he increased his shareholding include ESDS Software, Manipal Payment and Tega Industries, while he decreased his shareholding in Intellect Design, Vidhi Specialty and Raymond Lifestyle.\n\nAkash Bhanshali, an individual ace investor with stock holdings worth Rs 8,663 crore, saw a 15.5% increase in his portfolio during the July-September quarter, putting him second on the list of biggest gainers.\n\nHis top three stock holdings (as of September 30) include Gujarat Fluorochemicals, Laurus Labs and One97 Communications.", "source": "Economic Times Markets", "pub_date_str": "18 Nov 2026, 12:39 PM IST", "pub_date_relative": "1h ago"}, {"title": "Why Ashok Leyland\u2019s investors are wary despite robust demand", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nAshok Leyland\u2019s shares have declined around 6% this week even though its September quarter (Q2FY27) earnings were solid. Standalone revenue grew 39% year-on-year (y-o-y) to \u20b9 13,364 crore, while Ebitda rose 16% to \u20b9 1,350 crore. Perhaps, some profit-taking was overdue as the stock had outperformed over the past year, rising 10% versus a flat Nifty Auto index.\n\nIndustry-wide cost pressures also weighed on sentiment. Ebitda margin dipped y-o-y for the third consecutive quarter in Q2, falling 200 basis points to 10.1%. Raw-material costs jumped 47% y-o-y with a bulk of this rise coming sequentially. Operating leverage, a favourable product mix and price hikes helped keep Ebitda margins flat in Q2.\n\nThe management has already taken a 1-1.5% price hike in Q3, and indicated another increase in Q4. It has still retained the medium-term mid-teen Ebitda margin guidance.\n\nDemand has held up well through the price hikes, despite rising freight costs and interest rates. Fleet ageing and infrastructure spending have supported replacement demand, further buoyed by GST cuts and lower total cost of ownership for the new BS6 trucks. Despite a high base, October volumes grew 23%, following 32% volume growth in Q2.\n\nThe management expects to outpace the industry\u2019s mid-teens growth in FY27. Medium and heavy commercial vehicles (MHCV) have led the way. Aided by the Hippo and Taurus launches, market share is up 120 bps year-on-year to 32.1%.\n\nExports can recover from Q3, as the Ras Al-Khaimah plant returns to near-full capacity. The war in West Asia led to a 20% decline in GCC volumes in Q2.", "source": "LiveMint Markets", "pub_date_str": "18 Nov 2026, 12:38 PM IST", "pub_date_relative": "1h ago"}, {"title": "Emergency alerts and $75,000 rewards: South Korea fights high-tech exam cheating", "full_content": "South Korea plans to send emergency alerts to expose concealed phones, while offering rewards of at least $75,000 for reporting cheaters, as it gears for a key college entrance exam.\n\nThe measures, announced by President Lee Jae Myung in a post on X, come ahead of the country's annual college entrance exam, known as the Suneung, on Thursday which is expected to draw about 550,000 students, according to local media reports.\n\nEmergency alerts are to be sent to mobile phones of all South Korean residents before the exam begins, aimed at identifying mobile phones that students fail to surrender, Prime Minister Han Seong-sook said Tuesday.\n\n\"Even the most brazen examinee wouldn't be foolish enough to get caught when a hidden communication device rings during the exam, would they?\" Lee said in an X post on Tuesday, adding that he had instructed officials to consider sending the emergency alerts periodically during the exam.\n\nThe tougher measures come after cheating cases involving smart glasses and miniature cameras in other national examinations raised concerns about the use of advanced technology in South Korea's college entrance exam.\n\nThe government is tightening inspections of electronic devices, including smart glasses, miniature cameras and wireless earbuds, Han said.\n\nAll students will be required to have their glasses inspected, while stickers will be placed over clothing buttons to prevent hidden cameras from being used. Authorities have deployed about 75,000 exam supervisors across 1,312 testing centers, with an additional 8,400 personnel assigned to inspect smart devices, monitor hallways and detect suspicious communication signals, according to Han.\n\nSouth Korea's National Police Agency will be on heightened alert from 6 a.m. Thursday until further notice, Yonhap News reported, citing the agency. All officers will be required to maintain emergency communication channels to respond swiftly to any incidents, according to the report.", "source": "CNBC World Economy", "pub_date_str": "18 Nov 2026, 12:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "FAA oversaw and signed off on repair work before nationwide ground stop - The Washington Post", "full_content": "FAA oversaw and signed off on repair work before nationwide ground stop The Washington Post Duffy wants $50 billion to avert another ground stop. Experts say money isn\u2019t the issue. The Washington Post Sean Duffy\u2019s attacks on past FAA ground stop resurface CNN Sean Duffy\u2019s $50 billion demand for air travel fixes is met with yelling and skepticism in Congress NBC News F.A.A. Shelves Routers Like the One Linked to the Nationwide Ground Stop The New York Times", "source": "Google News Business", "pub_date_str": "18 Nov 2026, 12:20 PM IST", "pub_date_relative": "1h ago"}, {"title": "16 microcap stocks surge up to 390% in CY26, emerge as multibaggers", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News 16 microcap stocks surge up to 390% in CY26, emerge as multibaggers Written by Ritesh Presswala , ETMarkets.com | Nov 18, 2026, 12:27:30 PM IST 1 / 17 Microcap Rally While the benchmark Nifty 50 has slipped nearly 3% in CY26 so far, the Nifty Microcap 250 index has bucked the trend, delivering an impressive 13% gain. What's even more striking is that nearly 50 stocks in the microcap index have surged over 50%, with 16 emerging as multibaggers, more than doubling investors' wealth in just over 10 months of 2026.\n\nThe stock has delivered a staggering 388% return in CY26 so far, surging from Rs 188 to Rs 918.\n\nShares have rallied 191% so far in CY26, climbing from Rs 334 to Rs 970.\n\nThe stock has gained 186% in CY26 so far, rising from Rs 321 to Rs 917.\n\nShares have surged 171% so far this year, jumping from Rs 375 to Rs 1,016.\n\nThe stock has advanced 165% in CY26 so far, moving up from Rs 138 to Rs 366.\n\nShares have gained 156% so far this year, rallying from Rs 3,110 to Rs 7,967.\n\nThe stock has climbed 154% in CY26 so far, rising from Rs 199 to Rs 506.", "source": "Economic Times Markets", "pub_date_str": "18 Nov 2026, 12:14 PM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "Metal stocks to buy! APL Apollo Tubes, Hindalco: Axis Sec lists 2 conviction picks post Q2 results 2026; check targets", "full_content": "Pranati Deva Published 18 Nov 2026, 02:06 PM IST Prefer Livemint on Google Metal stocks to buy : Metal stocks delivered a mixed performance in the September quarter, as stronger sales volumes and improved realisations supported earnings, while elevated raw material costs continued to put pressure on margins across parts of the sector.\n\nAgainst this backdrop, Axis Securities has identified two stocks as its top conviction ideas, with a preference for companies that can protect profitability through value-added products, operating efficiencies and expansion in higher-margin businesses.\n\nIn its November 2026 report, the brokerage has assigned Buy ratings to APL Apollo Tubes and Hindalco Industries , with target prices of \u20b9 2,500 and \u20b9 1,060, respectively.\n\nAmong aluminium companies, Hindalco reported consolidated revenue of \u20b9 91,708 crore in Q2 FY27, up 39% year-on-year, while EBITDA increased 43% to \u20b9 12,831 crore. Adjusted attributable profit after tax rose 59% to \u20b9 7,533 crore. National Aluminium Company (NALCO) recorded revenue growth of 26% to \u20b9 5,419 crore and a 25% rise in EBITDA to \u20b9 2,411 crore. However, its EBITDA margin contracted 100 basis points to 44%, as power, fuel and raw material expenses increased.\n\nSteel companies also reported varied results. Tata Steel's consolidated revenue rose 11% year-on-year to \u20b9 65,436 crore, while adjusted EBITDA increased 19% to \u20b9 13,462 crore. Steel Authority of India (SAIL) reported adjusted revenue of \u20b9 31,998 crore, up 20%, but adjusted EBITDA of \u20b9 4,216 crore was affected by higher coking coal costs. Coal India recorded a 21% increase in net sales to \u20b9 44,179 crore and a 53% rise in attributable net profit to \u20b9 6,516 crore, although operating profitability missed expectations.\n\nMeanwhile, APL Apollo Tubes reported revenue of \u20b9 6,797 crore, up 25% year-on-year.", "source": "LiveMint Markets", "pub_date_str": "18 Nov 2026, 02:06 PM IST", "pub_date_relative": "4m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "50% STT cut, LTCG and STCG tax relief: What the government is considering ahead of Union Budget 2027", "full_content": "A 50% reduction in the securities transaction tax (STT) is one of the proposals being reviewed by the Indian revenue officials, as the government considers raising taxes on derivatives to curb speculative trading, while lowering levies on share trading, Bloomberg reported on Wednesday.\n\nAs per the report, the shortlisted recommendations will be presented to Finance Minister Nirmala Sitharaman.\n\nCentral Board of Direct Taxes (CBDT) Chairman Ravi Agrawal had earlier said that the Finance Ministry was examining suggestions from various stakeholders during pre-Budget consultations.\n\nHe said the government was analysing the concerns and recommendations raised by stakeholders, including those related to capital gains taxation, while speaking on the sidelines of an event in New Delhi.\n\nHe added that the government would examine different aspects of the capital gains tax regime before announcing its decision in the Union Budget on 1 February 2027.\n\nThe proposals are being reviewed ahead of the Union Budget amid calls from market participants to address concerns over the taxation of equity investments.\n\nSTT is a tax charged on the value of every eligible trade, whether the investor makes a profit or a loss. Lower taxes on derivatives have encouraged speculative bets, particularly in options, while cash market trading has remained relatively subdued. According to the Securities and Exchange Board of India (SEBI), nearly 88% of individual traders in equity derivatives lost money in the year ended March 2026. Their combined losses stood at around \u20b9 91,700 crore ($10 billion), with options accounting for 92% of the total.\n\nSTT, along with the long-term and short-term capital gains tax, is often viewed as a double whammy by market participants. And there have been growing calls for abolition of LTCG tax on equities also.", "source": "LiveMint Money", "pub_date_str": "18 Nov 2026, 02:05 PM IST", "pub_date_relative": "6m ago", "cfa_topics": ["Financial Statement Analysis", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Earnings call transcript: Omda Q3 2026 shares fall as integration weighs on margin", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Nov 2026, 02:02 PM IST", "pub_date_relative": "9m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Jet2 tumbles after cutting winter seat capacity, H1 profit declines", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Nov 2026, 02:00 PM IST", "pub_date_relative": "10m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "FTSE 100 today: Stocks dip as miners drag on metals slump, CPI up at 3.6%", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Nov 2026, 02:00 PM IST", "pub_date_relative": "11m ago", "cfa_topics": ["Economics", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Putin says EU is losing industry, falling behind competition, ahead of meeting with Trump and Xi", "full_content": "SHENZHEN, China \u2014 Russian President Vladimir Putin said the European Union was falling behind competition in a speech Wednesday at the Asia-Pacific Economic Cooperation CEO Summit.\n\n\"The EU is now losing its industrial capacity and it's losing in the competition,\" Putin said, according to an official English translation.\n\nPutin used the speech to emphasize Russia's economic resilience despite U.S. sanctions, and played up opportunities for APEC members in the country, from tech to economic development.\n\nHe was the third APEC leader to speak at the summit, and followed remarks by Chinese President Xi Jinping and Malaysian Prime Minister Anwar Ibrahim.\n\nIn his speech, Putin highlighted the country's ability to withstand a sharp drop in its U.S. dollar- and euro-denominated transactions. He also urged members to support Russia in hosting APEC in 2035.\n\nThe Russian leader is set to hold talks on Thursday with Xi and U.S. President Donald Trump in a historic meeting that could see a wide range of issues being discussed, including nuclear non-proliferation and also possibly Russia's war with Ukraine. He met with Xi on Wednesday, according to Chinese state media.\n\nRussian presidential aide Yuri Ushakov said last week the meeting in Shenzhen would continue the efforts aimed at reaching a negotiated settlement to the Ukraine war, according to state-controlled local media Russia Today.\n\nThe summit will likely yield little concrete result, but presents an \"almost 100% photo op\" that lifts China's status and power at the top table, David Roche, strategist at Quantum Strategy, told CNBC's \" Access Middle East \" earlier this week.", "source": "CNBC Finance", "pub_date_str": "18 Nov 2026, 01:59 PM IST", "pub_date_relative": "11m ago", "cfa_topics": ["Fixed Income", "Ethical & Professional Standards"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Experian adds $500 million buyback as H1 earnings climb 15%; shares up", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Nov 2026, 01:58 PM IST", "pub_date_relative": "12m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Workspace shares sink as dividend decision deferred and loss widens", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Nov 2026, 01:57 PM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Failed ATM, UPI or cheque transaction? Know when banks can charge you and how to seek redressal under RBI rules", "full_content": "A failed transaction does not always mean you escape the bank's service charges. A cheque returned due to insufficient funds, a failed automatic payment mandate, or an ATM transaction declined for lack of balance can attract a fee, depending on your bank's tariff and account terms.\n\nHowever, banks cannot levy arbitrary charges. The reason for the failure, applicable RBI guidelines and whether the fee was disclosed to you determine whether you can challenge the deduction and seek a refund. Here's what you need to know.\n\nBanks can collect charges for certain failed transactions if these are disclosed in their applicable schedule of charges and account terms.\n\nFor example, SBI charges \u20b9 250 plus GST for a failed NACH mandate and \u20b9 500 plus GST for a cheque returned due to insufficient funds. It also levies \u20b9 20 plus GST for ATM transactions declined due to insufficient balance in savings and current accounts. However, the bank does not charge for other failed ATM transactions, including declines due to an incorrect PIN.\n\nHDFC Bank charges \u20b9 500 for the first ECS/ACH mandate return in a month and \u20b9 550 for subsequent returns. Cheque returns due to insufficient funds incur similar charges, while an ATM transaction declined due to insufficient balance at another bank's ATM or merchant outlet incurs a \u20b9 25 charge plus applicable taxes. These charges are subject to the banks' applicable account terms and tariff schedules.\n\nThese protections apply only to failures not attributable to the customer, and the bank is liable to pay compensation to the customer.", "source": "LiveMint Money", "pub_date_str": "18 Nov 2026, 01:57 PM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Stock futures rise as Nvidia gains on earnings beat and solid outlook: Live updates", "full_content": "Stock futures climbed Wednesday morning after the S&P 500 fell for a fourth straight day. Traders also weighed Nvidia 's better-than-expected earnings report.\n\nNasdaq-100 futures were up 0.8%, while S&P 500 futures added 0.48%. Dow Jones Industrial Average futures were up 0.2%.\n\nMost Asian markets closed in positive territory after a choppy trading session.\n\nSouth Korea's Kospi led gains in the region as chip heavyweights gained ground, ending 1.99% higher at 5,067.44, while Japan's Nikkei 225 gained 0.28% to close at 59,024.28,\n\nHong Kong's Hang Seng Index was 0.87% lower in its final hour of trade, while the CSI 300 on mainland China advanced 0.18% to 3,983.77. Australia's S&P/ASX 200 slipped 0.69%, marking a fifth straight day of losses.\n\nShares of Nvidia jumped 4% in extended trading after the company's profit and revenue in the third quarter beat analysts' estimates. The company also lifted its revenue guidance for the fiscal year ending January 2028, calling for 75% growth year over year.\n\n\"The fact that they gave guidance is huge,\" said Gene Munster, managing partner at Deepwater Asset Management, on CNBC's \"Closing Bell: Overtime. \" \" That is a very bullish sign. I expect the stock to move higher based just on that alone.\"\n\nNeocloud companies also rose in extended trading. CoreWeave advanced 8%, while Nebius Group gained 10%.", "source": "CNBC Top News", "pub_date_str": "18 Nov 2026, 01:51 PM IST", "pub_date_relative": "19m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Jio Platforms shares gain over 26% from IPO price: Should investors hold, buy more or book profits? What experts say", "full_content": "Dhanya Nagasundaram Published 18 Nov 2026, 01:50 PM IST Prefer Livemint on Google Jio Platforms shares have climbed over 26% from their IPO issue price of \u20b9 1,119, rewarding investors who subscribed to the country's largest public issue.\n\nJio Platforms share price today opened at \u20b9 1,399.70 apiece on the BSE; the stock touched an intraday high of \u20b9 1,413.95 per share and a low of \u20b9 1,388.25 apiece.\n\nBut after the strong listing gains, the focus is shifting to whether the stock can sustain its upward momentum.\n\nThe company's first results as a listed entity showed healthy growth in revenue and profitability, backed by subscriber additions, higher ARPU and expanding digital services.\n\nJio Platforms made its stock market debut on the NSE and BSE on 28 October 2026, following its \u20b9 30,188-crore IPO, which became India's largest public issue.\n\nThe shares listed at \u20b9 1,358 apiece, a premium of 21.36% over the issue price of \u20b9 1,119, and ended their first trading session at \u20b9 1,419. This translated into a gain of nearly 27% over the IPO price.\n\nThe IPO proceeds have also been directed towards strengthening the company's balance sheet. Of the total amount raised, \u20b9 27,500 crore has been utilised to prepay certain external commercial borrowings of its subsidiary, Reliance Jio Infocomm.\n\nThe strong debut quickly placed Jio Platforms among India's most valuable listed companies, reflecting investor interest in its telecom, digital services and technology businesses.", "source": "LiveMint Markets", "pub_date_str": "18 Nov 2026, 01:50 PM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stock Market Today: Sensex Falls 720 Points, Nifty 50 Below 25,200; Titan Tanks 5%", "full_content": "Oil prices were trading lower on Wednesday, with Brent crude trading around $93 a barrel. Concerns over rising tensions in the Middle East were outweighed by expectations of higher global supplies.", "source": "NDTV Profit", "pub_date_str": "18 Nov 2026, 01:42 PM IST", "pub_date_relative": "28m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Bird Flu Can Cost Rs 3,000 Crore Loss To India But Now There Is 'Made In India' Solution", "full_content": "Commonly known as bird flu, Highly Pathogenic Avian Influenza (HPAI) is a variant of the serious poultry disease that can cause mortality approaching 100% among infected birds.", "source": "NDTV Profit", "pub_date_str": "18 Nov 2026, 01:39 PM IST", "pub_date_relative": "31m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Southeast Asia\u2019s data center boom leaned on Chinese demand. New U.S. rules put that pipeline at risk", "full_content": "New U.S. export rules could slow Southeast Asia's data center boom by tightening access to advanced AI chips and targeting the region's role in providing computing power to Chinese companies.\n\nAccording to an interim rule released Monday by the Commerce Department, data centers in Singapore, Malaysia, Thailand and Indonesia will need a U.S. government license to purchase advanced AI chips, including those from Nvidia.\n\nFacilities already serving large Chinese customers will have 90 days to apply for a license or face future export restrictions, the rule said.\n\nThe region has seen a surge in data center construction to house the semiconductors needed to train and develop artificial intelligence models.\n\nU.S. restrictions on China's access to Nvidia's most advanced chips have pushed Chinese technology firms, including Alibaba Group and ByteDance, to rent computing capacity in overseas data centers.\n\nAbout 75% of China's overseas AI compute was forecast to be concentrated in Southeast Asia by the end of 2026, according to October estimates by the Institute for Progress, a Washington-based think tank.\n\nThe buildout has come under greater scrutiny as Washington presses ahead with the investigation into Nvidia 's former CEO Jensen Huang .\n\nHuang left the company that he co-founded in 1993 after reports of several alleged extramarital affairs, including one with a suspected Chinese spy who is believed to facilitate billions of dollars worth of Nvidia chips into China.", "source": "CNBC World Economy", "pub_date_str": "18 Nov 2026, 01:39 PM IST", "pub_date_relative": "31m ago", "cfa_topics": ["Economics", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Why Stock Market Is Falling Today? Sensex Drops Over 700 Points, Nifty 50 Below 25,200", "full_content": "The 25,500 level remains a crucial near-term resistance for Nifty 50, and a sustained breakout above this hurdle could strengthen the upward momentum, opening the way for further gains towards the 25,80026,000 zone.", "source": "NDTV Profit", "pub_date_str": "18 Nov 2026, 01:39 PM IST", "pub_date_relative": "31m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Adani Stocks, Private Banks, Real Estate: Where Gautam Shah Sees Big Opportunities", "full_content": "Speaking to NDTV Profit, Shah said the Adani Group remains one of his preferred investment themes, reiterating his positive view on the conglomerate.", "source": "NDTV Profit", "pub_date_str": "18 Nov 2026, 01:37 PM IST", "pub_date_relative": "33m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "China\u2019s Xi calls for removing trade and investment barriers ahead of his meeting with Trump and Putin", "full_content": "SHENZHEN, China \u2014 Chinese President Xi Jinping opened a key Asia-Pacific Economic Cooperation meeting on Wednesday with calls for removing trade and investment barriers.\n\nThe leader spoke as he was expected to host Russian President Vladimir Putin and U.S. President Donald Trump this week alongside the APEC CEO and Economic Leaders Summit.\n\n\"We should remove trade and investment barriers,\" Xi said via an official English translation. He said a key reason for doing so was \"to promote development that is balanced.\"\n\nHe did not mention U.S. tariffs or other specific measures. Instead, Xi cast China as a \"promising land for development\" for global businesses, and indicated plans for \"Bay Area\" cooperation.\n\nShenzhen, home to major Chinese tech companies, is part of China's \"Greater Bay Area\" that includes Hong Kong and Macau. The Silicon Valley region around San Francisco is also known as the \"Bay Area\" in the U.S.\n\n\"China will not only cut tariffs and expand market access, but also go a step further,\" Xi said. He said China would \"reform\" rules and regulations to give foreign businesses \"full manufacturing access.\"\n\nChinese exports have steadily grown their share of global manufactured goods, drawing criticism from the European Union and other regions for overcapacity. The U.S. and China last year agreed to keep tariffs lower, but the world's two largest economies have yet to implement a planned $30 billion cut in duties on goods from each side.\n\n\"Global growth lacks momentum,\" Xi noted in his speech. But he said \"still global trade keeps growing against headwinds, and breakthroughs are being made in emerging technologies at a faster pace.\"", "source": "CNBC Top News", "pub_date_str": "18 Nov 2026, 01:30 PM IST", "pub_date_relative": "41m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Titan, Kalyan Jewellers, PC Jeweller fall up to 5%: Why are jewellery stocks losing shine despite lower gold prices?", "full_content": "PCJEWELLER SENCO MCX A Ksheerasagar Published 18 Nov 2026, 01:26 PM IST Prefer Livemint on Google Shares of major jewellery companies, including Titan, Kalyan Jewellers, Thangamayil Jewellery and PC Jeweller , witnessed selling pressure on Wednesday, November 18, falling up to 5%. The weakness comes despite the possibility that lower gold prices could support jewellery demand by making purchases more affordable for consumers.\n\nTitan shares dropped 4.8% to the day's low of \u20b9 4681, while Kalyan Jewellers slipped 5.3% to \u20b9 645.80 apiece. Thangamayil Jewellery PC Jeweller and Senco Gold were also down by over 2.5%.\n\nAlthough falling gold prices could boost jewellery sales, the Street was concerned that customers may delay purchases further in anticipation of additional price corrections, particularly for high-value wedding jewellery. This could postpone the recovery in sales volumes and weigh on retailers' near-term revenue growth.\n\nAnother factor investors are tracking is how jewellery retailers manage their gold inventory through hedging. While hedging helps protect companies against bullion price volatility, it can also limit the benefit of falling prices.\n\nThe impact of bullion price movements is also reflected in jewellery companies' earnings, with inventory gains and losses influencing profitability alongside sales volumes and margins.\n\nMCX gold dropped another 2.5% to their lowest level in more than a year, to reach \u20b9 1,31,063 per 10 grams, pressured by a stronger US dollar and expectations of higher US interest rates, while investors awaited minutes from the Federal Reserve's meeting for clues on its monetary policy outlook.\n\nMCX silver also slipped around 3.5% to \u20b9 6169 per kilo after touching its lowest level since late October 2025 earlier in the session.\n\nThe dollar hovered near a 19-month high, making greenback-priced bullion more expensive for overseas buyers.", "source": "LiveMint Markets", "pub_date_str": "18 Nov 2026, 01:26 PM IST", "pub_date_relative": "44m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Derivatives", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "India\u2019s earnings recovery could put large-caps back in favour", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nEquity returns may be shaped by earnings over the long run, but in the short term they are driven by many more factors, collectively described as sentiment. In India, we are witnessing a shift on both fronts.\n\nLet\u2019s start with the most important factor: corporate profit growth. Second-quarter results indicate that Nifty 50 profit growth is likely to be around 25%. This follows high-teen growth (13-19%) in the first quarter, sustaining a recovery after two tepid years. Had someone projected these growth numbers for the next two quarters at the start of the West Asia war in March, the forecast would have been met with complete disbelief.\n\nTo begin with, discretionary consumption has remained strong, aided by the tax cuts in 2025, while other consumer segments are benefiting from a low base. The impact of cost pressures on margins has been gradual, though risks linger, particularly as companies have not fully passed on higher costs and poor monsoons could curtail demand.\n\nCredit growth in banks has picked up, helped by cyclical factors such as commodity prices and substitution from bond-market borrowing. Asset quality has remained pristine despite geopolitical upheavals. The rate-hike cycle would add further to positive earnings revisions for the banking sector over the next 12 months.\n\nAbove all, India offers a wide range of sectors across financial services, consumption, healthcare, manufacturing and infrastructure, providing relative stability in an uncertain macroeconomic environment.\n\nA couple of related points are key to understanding market returns and investor behaviour over the past two years, as well as what could happen next.\n\nNifty 50 profit growth over the last two years (FY24-26) was a paltry 6% CAGR.", "source": "LiveMint Money", "pub_date_str": "18 Nov 2026, 01:13 PM IST", "pub_date_relative": "57m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Fixed Income", "Alternative Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "He Is James Bond': Jeff Bezos Was Heavily Involved' In Decision To Choose Robert Pattinson As 007", "full_content": "Amazon now has a major say in the 007 franchise after buying MGM in 2022. This will be the first Bond film without the Broccoli family controlling its creative direction since 1962.", "source": "NDTV Profit", "pub_date_str": "18 Nov 2026, 01:12 PM IST", "pub_date_relative": "58m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "97 Pages Of Doom: The Only IPO That Warns Its AI Might End The World", "full_content": "Several risks have already turned into business decisions. Anthropic says it limited the release of Mythos because of the model's advanced cyber capabilities, potentially giving up near-term revenue.", "source": "NDTV Profit", "pub_date_str": "18 Nov 2026, 01:07 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Indian economic growth seen at annual 7.6% in July-September quarter, economists say", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Indicators \u203a Indian economic growth seen at annual 7.6% in July-September quarter, economists say The Economic Times daily newspaper is available online now. Read Today's Paper Indian economic growth seen at annual 7.6% in July-September quarter, economists say SECTIONS Indian economic growth seen at annual 7.6% in July-September quarter, economists say Reuters Last Updated: Nov 18, 2026, 01:00:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India's economy is predicted to grow by 7.6% in the July-September quarter according to economists. Consumer demand has shown resilience, mitigating the effects of rising inflation pressures. Predictions indicate continued strength from passenger vehicle sales and bank credit growth. Despite potential slowdowns in the second half of the fiscal year, investments are expected to improve. The Reserve Bank of India may raise rates as economic conditions evolve.\n\nWhy IndiGo could land a sharp rebound in profit despite a sluggish aviation market\n\nKYC and KYB: Pidilite\u2019s business has more tailwinds than headwinds, but a continuous test called raw material prices \u2013 Concluding part\n\nGold still rules, but with a difference: How young India is redefining wedding jewellery\n\nTariffs, supply snags and a war: 6 sectors that pulled it off through all of the trouble\n\nHow India\u2019s INR22.5 lakh crore gold loan boom is hiding a big hole\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers", "source": "Economic Times Economy", "pub_date_str": "18 Nov 2026, 01:00 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Govt weighs tax tweaks to boost stock trading, curb derivatives: Report", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Govt weighs tax tweaks to boost stock trading, curb derivatives: Report The Economic Times daily newspaper is available online now. Read Today's Paper Govt weighs tax tweaks to boost stock trading, curb derivatives: Report SECTIONS Govt weighs tax tweaks to boost stock trading, curb derivatives: Report Bloomberg Last Updated: Nov 18, 2026, 01:15:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The government is reviewing proposals to cut securities transaction tax on cash equities by 50% while raising levies on derivatives to curb speculative trading and encourage broader market participation. Officials are also considering a reduction in long-term capital gains tax. The recommendations will be presented to Finance Minister Nirmala Sitharaman ahead of Budget 2027.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and P
