ental Enforcement .\n\nThe hurricane appeared to be veering away from the dense refining region in southern Louisiana near New Orleans and Baton Rouge.\n\nBut the storm could affect Chevron 's refinery in Pascagoula, Mississippi, and a Vertex Energy refinery in Saraland, Alabama. Both areas are under hurricane warnings. The facilities there can produce a combined 466,000 bpd, or 2.4% of U.S. refining capacity, said Andy Lipow, president of Lipow Oil Associates.\n\n\"Of course, losing any refinery capacity when diesel supplies are at their lowest level for this time of year since the EIA began reporting in 1982 is not a good thing,\" Lipow wrote in a Friday note, referring to the Energy Information Administration.\n\nChevron's refinery at Pascagoula remains operational, spokesperson Ross Allen said Thursday. Vertex officials weren't immediately available for comment about its Saraland refinery.\n\n\" The biggest risk to these two refineries are a loss of electricity or flooding damage,\" Lipow wrote in a note Friday. If the refineries do shut down, it would take one to two weeks to restart them if they did not sustain damage, he said.", "source": "CNBC Top News", "pub_date_str": "09 Oct 2026, 10:42 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Q2 Result Updates: Poonawalla Fincorp Profit Surges To Rs 375 Crore; Anand Rathi Approves Dividend", "full_content": "Q2 FY27 Results Live Updates: Anand Rathi, Can Fin Homes and Poonawalla Fincorp will be among the key earnings announcements to watch.", "source": "NDTV Profit", "pub_date_str": "09 Oct 2026, 10:30 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "US bull market nears fourth anniversary, but narrow rally raises risks", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a US bull market nears fourth anniversary, but narrow rally raises risks Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US bull market nears fourth anniversary, but narrow rally raises risks SECTIONS US bull market nears fourth anniversary, but narrow rally raises risks ETMarkets.com Last Updated: Oct 09, 2026, 10:23:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The ongoing US stock bull market is nearing its fourth anniversary with strong corporate earnings and low volatility. Investor concerns are rising due to the disparity between benchmark indices and the performance of individual stocks. The reliance on artificial intelligence for growth makes the market susceptible to volatility if sentiment shifts. Upcoming third-quarter earnings and midterm elections could introduce additional uncertainties for investors.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "09 Oct 2026, 10:23 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "GPF interest rate: Finance Ministry leaves 7.1% unchanged for Oct-Dec 2026 quarter\u2014what govt employees should know", "full_content": "The Ministry of Finance has announced the interest rate applicable to the General Provident Fund ( GPF ) and other provident funds for the October-December 2026 quarter.\n\nThe notification is relevant for eligible government employees who contribute to these funds as part of their long-term savings and retirement planning. Here is what government employees need to know about the latest announcement and which funds are covered.\n\nAccording to a resolution issued by the Ministry of Finance on 5 October 2026, the interest rate for the General Provident Fund and other similar funds has been set at 7.1% for the quarter from 1 October to 31 December 2026.\n\nThe Finance Ministry 's resolution states, \u201cIt is announced for general information that during the year 2026-27, accumulations at the credit of subscribers to the General Provident Fund and other similar funds shall carry interest at the rate of 7.1% (Seven point one percent) w.e.f. 1 October, 2026 to 31st December, 2026. This rate will be in force w.e.f. 1st October, 2026.\u201d\n\nAlso, the GPF interest rate was 7.1% for both the April\u2013June 2026 and July\u2013September 2026 quarters. The latest announcement continues the same rate for the October\u2013December 2026 quarter, with no revision so far in the current financial year, FY27. The notification specifies the rate applicable to eligible balances for the quarter.\n\nThe General Provident Fund is a long-term savings scheme for eligible government employees only under the old pension scheme (OPS). In GPF, only employees contribute a portion of their salary to their provident fund accounts, where the accumulated contributions earn interest at the rate notified by the government.\n\nThe savings build up over time and can help employees meet their financial needs after retirement. The amount accumulated in an account depends on factors such as contributions, withdrawals, and interest credited over the years.\n\nGPF is different from the Employees' Provident Fund (EPF).", "source": "LiveMint Money", "pub_date_str": "09 Oct 2026, 10:20 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Anthem Biosciences block deal: Portsmouth Technologies sells 30 lakh shares worth Rs 250 crore", "full_content": "Portsmouth Technologies LLC executed a block deal selling 30 lakh shares of Anthem Biosciences on October 9. The shares were sold at Rs 833 each, totaling Rs 249.90 crore. Following this transaction, Portsmouth's estimated stake in the company would decrease significantly. Anthem Biosciences reported a decline in total income and profit after tax for the first quarter of FY27.", "source": "Economic Times Markets", "pub_date_str": "09 Oct 2026, 09:53 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "RBI rate hike impact: Shriram Finance increases FD rates up to 7.85% effective October 11 \u2014 check revised structure", "full_content": "Revised rates to take effect from October 11; 24\u201335 months and 15 months digital fixed deposits to earn 7.5%.", "source": "LiveMint Money", "pub_date_str": "09 Oct 2026, 09:51 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Poonawalla Fincorp Q2 profit surges fivefold as income rises", "full_content": "Poonawalla Fincorp reported a substantial increase in net profit for the second quarter, rising over fivefold. The company's net interest income and fee income grew significantly, contributing to the profit surge. New loan products accounted for a notable percentage of disbursements during this period, demonstrating the diversification of their offerings. Additionally, improvements in the gross non-performing asset ratio reflect better asset quality management.", "source": "Economic Times Markets", "pub_date_str": "09 Oct 2026, 09:45 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Share price down 29% in 2026, retail investors\u2019 favourite wind energy stock under pressure - Where is the bottom?", "full_content": "Suzlon Energy shares have fallen sharply in 2026 amid concerns about execution, margins and cash generation, despite a 6,135 MW order book. Analyst Gaurav Garg says the stock\u2019s technical breakdown points to a Stage 4 downtrend; resistance sits near \u20b946\u201349, while investors will watch H2 margins.", "source": "LiveMint Markets", "pub_date_str": "09 Oct 2026, 09:44 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Americans' debt problems are flashing a warning not seen since the Great Recession", "full_content": "Researchers found that while wealth disparities narrowed somewhat, the ability to meet debt payments deteriorated significantly.", "source": "CNBC Top News", "pub_date_str": "09 Oct 2026, 09:40 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and po         document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>

</body>
</html>
