<script>
    // This variable will be injected during the build process
    const allData = {"general": [{"title": "At least 64 people dead in high-speed Spain train crash", "full_content": "At least 64 people have been killed in a collision between two trains in the Spanish province of Toledo, authorities have said.\n\nThe high-speed trains collided shortly before 9:15 a.m. local time (4:15 a.m. ET), when emergency services were deployed to the scene. It occurred on the Madrid to Seville line.\n\nTransport Minister \u00d3scar Puente told reporters that the control system at the nearby town of Urda failed and six trains were stopped. One was allowed to restart and travelled 25km before hitting a stopped train at high speed, he added, saying it was \"inexplicable\" how this had happened.\n\nAs well as those killed, 50 people were also injured, the minister said.\n\nRailway infrastructure manager Adif is investigating the sequence of events surrounding the accident, Spanish news agency EFE reported .\n\nTraffic on the Madrid to Andaluc\u00eda high-speed line had been interrupted.\n\nThe local Castilla La Mancha government confirmed at least 64 people had died, higher than another high-speed crash in southern Spain that killed 45 people in January.\n\nThe trains were operated by AVE and Iryo, per local media. More than 500 passengers were on board the two trains, newspaper El Pa\u00eds said.", "source": "CNBC Top News", "pub_date_str": "28 Oct 2026, 07:43 PM IST", "pub_date_relative": "1m ago"}, {"title": "Wendy's shares jump 15% as Nelson Peltz's Trian offers $1.4 billion to buy burger chain", "full_content": "A group of investors led by Nelson Peltz's Trian Fund Management has offered $1.4 billion to buy Wendy's , according to a regulatory filing Wednesday.\n\nThe group has offered $7.35 per share in cash to take the burger chain private, paying a 20% premium to Tuesday's closing price. In addition to Trian, it includes investment firms BlueFive Capital and Sixth Street Partners, plus Flynn Group, one of Wendy's largest franchisees.\n\nWendy's shares spiked about 15% in morning trading following the offer. The Wall Street Journal first reported Peltz's proposal.\n\nWendy's did not immediately respond to a request for comment from CNBC. Trian declined to comment beyond the filing.\n\nThe take-private deal offer comes after a tough two-year stretch for the burger chain. Wendy's stock has tumbled 65% over that period, including Wednesday's gains. For six straight quarters, the company has reported same-store sales declines.\n\nWendy's is scheduled to report its third-quarter earnings before the bell on Nov. 5.\n\nWendy's challenges have made the company a cheaper acquisition target for Peltz, whose history with the brand dates back to an activist campaign he led more than two decades ago.\n\nBudget-conscious diners have been eating out less often, and Wendy's and its rivals have leaned into discounts to lure consumers into restaurants. Wendy's has also dealt with a revolving door of chief executives, who have had different ideas about turnaround strategies for the struggling chain.", "source": "CNBC Top News", "pub_date_str": "28 Oct 2026, 07:40 PM IST", "pub_date_relative": "4m ago"}, {"title": "\u2018When do I sell my stocks?\u2019 Ignore the noise and focus on these things.", "full_content": "Before you sell, ask whether a rising or falling stock price actually represents a change in the company\u2019s business prospects", "source": "MarketWatch Top Stories", "pub_date_str": "28 Oct 2026, 07:40 PM IST", "pub_date_relative": "5m ago"}, {"title": "DraftKings CEO Jason Robins says parents should talk with kids about responsible gambling", "full_content": "DraftKings CEO Jason Robins said parents should talk to their kids about gambling addiction and that he's tackled the subject with his own children.\n\n\"Every parent, even if you don't have a business or don't live in a world where the kids grow up around it, I think it's something every parent should have conversations with their kids about,\" Robins said in an interview with CNBC's Contessa Brewer.\n\nRobins said his children have grown up around the gambling industry and even understand some of the terminology around sports betting.\n\n\"They know what point spreads and money lines are,\" he said. \"They always ask me, 'Dad, do you know where the money is on for DraftKings today,' so they know who to root for, which I find funny.\"\n\nRobins said he taught them at a young age how DraftKings works, but that they will have to wait until they are 21 years old to participate themselves.\n\nRobins said he tries to keep communication open with his children about gambling and other subjects. He compared those conversations to questions children may ask when they see a parent drinking wine.\n\n\"The important thing is just to have a transparent relationship with your kids, where they feel like they can ask you anything,\" he said.\n\nAs sports betting has become more widespread, a recent analysis of health records found that gambling disorder diagnoses increased around 61% among people in states with legalized sports betting. In states without legalized sports betting, cases dropped roughly 30% from 2018 to 2026.", "source": "CNBC Top News", "pub_date_str": "28 Oct 2026, 07:38 PM IST", "pub_date_relative": "6m ago"}, {"title": "SK Hynix shares jump 11% after record quarterly profit, outperforming broader market", "full_content": "South Korean chipmaker SK Hynix shares closed 10.89% higher on Wednesday in Asia after the company reported record quarterly profit that sharply beat estimates, and announced over $25 billion in dividends and buybacks.\n\nHere are SK Hynix's third-quarter results compared with LSEG SmartEstimates, which are weighted toward forecasts from analysts who are more consistently accurate:\n\nRevenue rose 327.9% from a year earlier, while operating profit climbed 632.1% year on year.\n\nCompared with the previous quarter, revenue climbed 31.9%, while operating profit surged 37.6%.\n\nThe gains outpaced the benchmark Kospi index, which closed 6.63% higher. The U.S.-listed shares of SK Hynix traded over 11% higher on Wednesday.\n\nThe company posted record quarterly revenue and operating profit, with sales exceeding 100 trillion won for the first time, as it announced plans to return about 100 trillion won to shareholders \u2014 including at least 30 trillion won in cash dividends and 60 trillion won in share buybacks and cancellations.\n\nIn the earnings call, SK Hynix CEO Kwak Noh-Jung cited financial market volatility and a correction in semiconductor stocks as the main reasons to halt its review of potential pre-IPO fundraising and IPO options for its U.S. subsidiary Solidigm.\n\nThe company had said it would continue to assess investment timing, scale and financing options to support Solidigm's growth and enhance shareholder value.", "source": "CNBC World Economy", "pub_date_str": "28 Oct 2026, 07:35 PM IST", "pub_date_relative": "9m ago"}, {"title": "CNBC TEC Summit live updates: Cisco, Levi's executives discuss AI risks and costs", "full_content": "At a defining moment for business and technology, artificial intelligence is transforming how organizations operate \u2014 and introducing new complexities for the leaders responsible for what comes next.\n\nSo how are companies adapting and shaping technology's next era \u2014 from compute ROI and cybersecurity to regulation and quantum computing?\n\nCNBC is convening technology executives, industry experts, and CNBC journalists at the annual Technology Executive Council Summit in New York today to discuss the increasingly central role that technology leaders are playing in this transformation.\n\nThe TEC Summit is an exclusive event for members; learn more about the TEC and apply for membership at www.cnbccouncils.com/tec .\n\nIn a Wall Street Journal op-ed published in June , Forum AI Founder and CEO Campbell Brown argued that as the world becomes more reliant on AI, there needs to be a more critical lens applied to AI's output.\n\n\"Already it is so good its mistakes don't look like mistakes,\" Brown wrote.\n\nSpeaking with CNBC's Scott Wapner at the CNBC Technology Executive Council Summit in New York City on Wednesday, Brown said the issue remains that \"when you read an answer generated by AI, it's presented with such confidence and clarity that it is hard to question it and identify where the mistakes may be.\"\n\nBrown, the former head of global media partnerships at Meta, said this issue is increasingly worrying as people turn to AI for political or election information, and that speaks to how the information is not only presented but where it is sourced.", "source": "CNBC World Economy", "pub_date_str": "28 Oct 2026, 07:34 PM IST", "pub_date_relative": "10m ago"}, {"title": "Bearista cups are returning at Starbucks. Can the viral sensation boost holiday sales again?", "full_content": "Starbucks CEO Brian Niccol is hoping to recapture lightning in a bottle and keep his turnaround plan moving forward.", "source": "CNBC Top News", "pub_date_str": "28 Oct 2026, 07:34 PM IST", "pub_date_relative": "10m ago"}, {"title": "Otis Q3 2026 slides: 6% organic growth amid margin pressure", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Oct 2026, 07:32 PM IST", "pub_date_relative": "12m ago"}, {"title": "PROG Holdings Q3 2026 slides: revenue up 26% as outlook trimmed", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Oct 2026, 07:31 PM IST", "pub_date_relative": "13m ago"}, {"title": "TriNet faces earnings test as revenue pressures persist", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Oct 2026, 07:31 PM IST", "pub_date_relative": "13m ago"}, {"title": "Earnings call transcript: Franklin Electric beats Q3 2026 estimates, stock slips", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Oct 2026, 07:31 PM IST", "pub_date_relative": "13m ago"}, {"title": "Earnings call transcript: Dana misses Q3 2026 EPS forecast as shares slide", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Oct 2026, 07:31 PM IST", "pub_date_relative": "13m ago"}, {"title": "Telesat under pressure as earnings arrive amid debt restructuring", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Oct 2026, 07:31 PM IST", "pub_date_relative": "14m ago"}, {"title": "Bank of Canada raises key interest rate, says another hike possible", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Oct 2026, 07:30 PM IST", "pub_date_relative": "14m ago"}, {"title": "UK inflation forecast to average 3.4% in 2027, Healey says", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Oct 2026, 07:30 PM IST", "pub_date_relative": "14m ago"}, {"title": "Earnings call transcript: Photocure Q3 2026 revenue rises as shares fall 4.9%", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Oct 2026, 07:30 PM IST", "pub_date_relative": "14m ago"}, {"title": "CTO Q3 2026 slides: Kansas City expansion drives growth outlook", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Oct 2026, 07:30 PM IST", "pub_date_relative": "14m ago"}, {"title": "Anthropic warns some risks may be uninsurable. AI coverage is going to be an issue for every company", "full_content": "Anthropic's IPO filing includes many words covering many risks , from IP theft to security incidents, data loss, climate change, rogue agents and all the way to an existential crisis for humanity. Embedded in all of the risk language are basic questions about insurance: What's going to be covered? Is it even possible to provide a policy for all of the ways that AI could go wrong? Anthropic, even with more cash than almost any company in America, couldn't answer that question with confidence.\n\n\"Because our models may behave in ways that no user or developer intended, claims arising from such actions could result in substantial liability. Our insurance policies also may not provide sufficient coverage to adequately mitigate the potential liabilities we face, especially where any one incident, or a group of incidents, causes disproportionate harm,\" the company's S-1 filing states . \"In addition, with the scale of harm that could result from a catastrophic AI-related incident, no single insurer, and potentially the insurance industry in the aggregate, may have sufficient capacity or expertise to underwrite insurance commensurate with such exposure. Further, the insurance market for AI-specific risks is nascent and evolving, and we may be unable to obtain coverage for certain AI-related liabilities on commercially reasonable terms, or at all, leaving us exposed to potentially significant uninsured losses.\"\n\nThose risks are far removed from AI chatbots helping to book airline tickets or find the best deals on a backyard grill. But there have been increasing instances where AI chatbots are going rogue and some companies are watching warily \u2014 even blocking them . In some extreme cases, chatbots are being accused of contributing to a death, including a case revealed this week , raising insurance questions for which there are no easy answers.", "source": "CNBC Top News", "pub_date_str": "28 Oct 2026, 07:28 PM IST", "pub_date_relative": "16m ago"}, {"title": "Is that used EV worth the price? This checklist could save you thousands of dollars.", "full_content": "Pain at the pump is pushing cost-conscious drivers away from traditional gas-powered cars toward electric vehicles.", "source": "MarketWatch Top Stories", "pub_date_str": "28 Oct 2026, 07:23 PM IST", "pub_date_relative": "22m ago"}, {"title": "Google alters its cloud playbook, enlisting partners to sell more AI chips", "full_content": "Google has spent years pitching customers on the advantage of buying its chips, models and cloud services in one place, offering a full stack that rivals Amazon and Microsoft have tried to replicate.\n\nNow, the company is pushing its equipment outside of its own walls to reach more customers and build a bigger business around artificial intelligence chips, a market that Nvidia has dominated.\n\nA day ahead of its third-quarter earnings report, Alphabet said Tuesday that Oracle will offer Google's tensor processing units, or TPUs, the custom chips the internet giant has been developing since 2013 . It's the first time customers will be able to access TPUs outside of Google's infrastructure, and shows that cloud boss Thomas Kurian, who previously spent more than 20 years at Oracle, is looking elsewhere for growth.\n\n\"They're a very strong competitor, and it's very possible that they could eventually take market share from Nvidia,\" said Chris Ballard, managing director of Check Capital Management, referring to Google's position in chips.\n\nKurian, who joined Google in late 2018, is operating from a position of strength. Analysts expect Google Cloud revenue to jump about 90% from a year earlier, after growing 82% in the second quarter , with TPUs contributing to its momentum.\n\n\"Google was great at doing its own thing, but it was never able to serve customers,\" said Uday Cheruvu, a portfolio manager at Harding Loevner, which owns Alphabet shares. \"That mindset has changed.\"\n\nGoogle opened up TPUs to outside data centers in the second quarter, before this week's announcement with Oracle.\n\nEstimates for the TPU business vary widely, but they all point to significant growth. TD Cowen models $9.4 billion in TPU sales for the second half of this year and $62.5 billion for 2027. Wells Fargo expects about $9 billion in third-quarter sales and $99 billion next year.", "source": "CNBC World Economy", "pub_date_str": "28 Oct 2026, 07:22 PM IST", "pub_date_relative": "22m ago"}, {"title": "Fed meeting live updates: No hike expected, but investors watching Warsh for what's next", "full_content": "The Federal Reserve's interest rate decision Wednesday likely will be short on suspense, with markets expecting the central bank to stay on hold even with inflation tracking well above target.\n\nMarkets are pricing in less than a 10% chance that the rate-setting Federal Open Market Committee follows up its quarter-percentage-point hike in September with another increase, according to the CME Group's FedWatch tool.\n\nAssuming that sentiment is correct, it will leave the Fed's benchmark interest rate in a range between 3.75% and 4% \u2014 and shift investor attention to Fed Chairman Kevin Warsh and whatever clues he chooses to provide in his post-meeting news conference.\n\nTraders expect the Fed to follow up the October skip with a hike at its next meeting in December.\n\nWith no updates to the Fed's \"dot plot\" of rate forecasts or the Summary of Economic Projections on tap for this meeting, there will be less detail about where officials see current conditions and the future path of monetary policy.\n\nSome observers do think there could be dissents from the decision to hold. Regional Presidents Beth Hammack of Cleveland and Lorie Logan of Dallas are potential no votes, as is Neel Kashkari of Minneapolis. Each chose to vote against a hold in July .\n\nThe Fed decision comes less than a week before a pivotal midterm election in which the balance of power in Congress is up for grabs. While Fed officials insist that political considerations play no part in their decisions, some economists have speculated that officials would prefer to steer away from increasing rates so close to an election.\n\nThe Fed's decision Wednesday follows a string of reports indicating that inflation is reaccelerating.", "source": "CNBC Top News", "pub_date_str": "28 Oct 2026, 07:20 PM IST", "pub_date_relative": "24m ago"}, {"title": "America's largest budget airline reports 71% jump in airfare", "full_content": "Frontier Airlines reported a 71% increase in airfare in the third quarter as the country's largest budget airline tried to pass along an even bigger jump in jet fuel prices.\n\nFrontier's fare revenue averaged $67.82 per passenger in the third quarter, compared with $39.74 last year. Including the budget airline's many fees, such as for checked and carry-on luggage, total revenue per passenger rose 30% on the year to $138.22.\n\nCustomers kept booking despite the higher prices. Frontier's passenger count rose 18% to more than 9.8 million people in the quarter. That's a difference of 1.5 million passengers from last year.\n\nThe company said demand remains strong, even at these higher prices, but Frontier still lost money. The airline widened its third-quarter loss to $104 million from a $77 million loss a year earlier. Its fuel bill soared 82% to $425 million.\n\nFrontier forecast potential adjusted profit in the fourth quarter, saying it expects to post an adjusted loss of 15 cents per share to adjusted earnings of as much as 5 cents per share.\n\nCarriers from Delta Air Lines to Frontier have said customers are mostly continuing to book flights despite higher fares, but that record jet fuel prices, their biggest cost after labor, are eroding profits.\n\nFrontier had eclipsed Spirit Airlines as the biggest discount carrier in the country even before that airline collapsed in May.", "source": "CNBC Top News", "pub_date_str": "28 Oct 2026, 07:20 PM IST", "pub_date_relative": "24m ago"}, {"title": "Stellantis stock rises 12% as automaker's turnaround plan, cost cuts gain traction", "full_content": "Shares of Stellantis were up Wednesday as the European car giant's third-quarter results showed it was making progress with its 60 billion euro turnaround plan.\n\nThird-quarter revenues rose 1% to 37.6 billion euros from a year ago, the Chrysler and Jeep owner said on Wednesday, while adjusted operating income rose 184% to 256 million euros from 90 million euros a year earlier.\n\nThe automaker's industrial free cash flow improved to negative 4 billion euros, up from negative 4.3 billion the year prior.\n\nStellantis on Wednesday also reconfirmed its 2026 guidance and target to achieve positive free cash flow next year, which is a main focus for investors.\n\n\"Q3 was soft, but consensus expectations were far lower. Key here is that '26 Guidance was maintained while other auto OEMs and suppliers are cutting on elevated costs,\" RBC Capital Markets analyst Tom Narayan said Wednesday in an investor note.\n\nStellantis stock rose roughly 9% Wednesday in Milan and was up by 12% in early trading in New York, but it remains sharply down since the beginning of the year.\n\nStellantis stock since the beginning of the year. Stellantis CEO Antonio Filosa told investors Wednesday that the company is ahead of schedule on its turnaround plan, which was announced in May. He said Stellantis expects to exceed its previously announced cost-cutting efforts of 6 billion euros under the plan by 2028, including 2.4 billion euros to start 2027.\n\n\"We are very confident in reaffirming our '26 guidance. Those include '27 free cash flow positive,\" Filosa said Wednesday in response to concerns about the carmaker's ability to achieve its free cash flow target.", "source": "CNBC World Economy", "pub_date_str": "28 Oct 2026, 07:18 PM IST", "pub_date_relative": "27m ago"}, {"title": "JPL share price: Jio Platforms IPO listing gains explained - How much profit investors made on debut", "full_content": "Jio Platforms listing: Jio Platforms, on Wednesday, made a blockbuster debut at the stock exchanges with a premium of over 21%. Backed by Mukesh Ambani's Reliance Industries Limited (RIL), Jio Platforms has now become the country's second most valuable firm by market capitalisation, trailing only its parent, RIL.\n\nJio Platforms share price closed at \u20b9 1,417.35, up 26.66 % from the issue price on the BSE . On the NSE, the stock climbed 26.67 % to end at \u20b9 1,417.50 apiece.\n\nFor retail investors who received a single lot (consisting of 12 shares) of the Jio Platforms issue, they made an immediate opening gain of \u20b9 2,868. As Jio share price rallied further and closed higher by the end of Wednesday\u2019s trading session, investors\u2019 gains increased approximately to \u20b9 3,580 per lot on BSE\n\nFor investors who received shares under the small non-institutional investor quota (SNII), i.e. 180 shares, they are estimated to make an opening gain of nearly \u20b9 43,000.\n\nHigh net-worth individuals, who were allotted with Jio Platforms shares under NII category, may have seen an immediate value creation of around \u20b9 2.15 lakh at the market opening on Wednesday.\n\nJo share price opened higher at \u20b9 1,358 per share on Wednesday, October 28, against its upper price band issue of \u20b9 1,119 per share. The stock ended higher at \u20b9 1417.35 per share on BSE with a market capitalisation of \u20b9 13,05,241.98 crore on Wednesday, October 28.\n\nInitiating coverage for Jio Platforms, Motilal Oswal Financial Services Limited (MOFSL) gave a \u2018Buy\u2019 rating for the stock with a target price of \u20b9 1690 per share in the bull case scenario. The brokerage had fixed \u20b9 1,350 per share target in the base case scenario.\n\n\u201cWe believe the risk-reward remains compelling, with a bull-case TP of INR1,690 and a bear-case TP of INR1,035,\u201d highlighted the brokerage adding that its estimates for JPL\u2019s earnings and valuation are highly sensitive to wireless ARPU growth.", "source": "LiveMint Markets", "pub_date_str": "28 Oct 2026, 07:15 PM IST", "pub_date_relative": "29m ago"}, {"title": "Acutaas Chemicals among 5 stocks hitting 52-week highs; rallied up to 18% in a month", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News Acutaas Chemicals among 5 stocks hitting 52-week highs; rallied up to 18% in a month Written by Ritesh Presswala , ETMarkets.com | Oct 28, 2026, 07:16:38 PM IST 1 / 6 Fresh Highs On Wednesday, the benchmark Sensex fell 352 points to close at 73,246. Despite the market decline, five stocks from the BSE 500 index touched fresh 52-week highs, marking their highest price levels in the past year. A 52-week high represents the highest price at which a stock has traded over the preceding 12 months and may indicate increased market activity and investor interest.\n\nNew 52-week high: Rs 1516.65| CMP: Rs 1444.6. In the last one month, the stock has gained about 18%.\n\nNew 52-week high: Rs 3977| CMP: Rs 3706.5. In the last one month, the stock has gained about 15%.\n\nNew 52-week high: Rs 815.25| CMP: Rs 807. In the last one month, the stock has gained about 13%.\n\nNew 52-week high: Rs 235.45| CMP: Rs 232.8. In the last one month, the stock has gained about 13%.\n\nNew 52-week high: Rs 884.25| CMP: Rs 880. In the last one month, the stock has gained about 9%.", "source": "Economic Times Markets", "pub_date_str": "28 Oct 2026, 07:14 PM IST", "pub_date_relative": "30m ago"}, {"title": "Vedanta Aluminium Q2 Results: Profit doubles to Rs 6,187 crore, revenue jumps 41%", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a Earnings \u203a Vedanta Aluminium Q2 Results: Profit doubles to Rs 6,187 crore, revenue jumps 41% Vedanta Aluminium Metal Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Vedanta Aluminium Q2 Results: Profit doubles to Rs 6,187 crore, revenue jumps 41% SECTIONS Vedanta Aluminium Q2 Results: Profit doubles to Rs 6,187 crore, revenue jumps 41% By Akash Podishetti , ETMarkets.com Last Updated: Oct 28, 2026, 07:13:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Vedanta Aluminium\u2019s Q2 FY27 net profit surged 105% to Rs 6,187 crore, driven by record production, higher sales and improved realisations. Revenue rose 41%, EBITDA increased 83%, and net debt declined Rs 3,090 crore sequentially.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "28 Oct 2026, 07:13 PM IST", "pub_date_relative": "32m ago"}, {"title": "US stocks today: S&P 500, Nasdaq open higher as SK Hynix lifts chips; Fed meet in focus", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a US stocks today: S&P 500, Nasdaq open higher as SK Hynix lifts chips; Fed meet in focus Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US stocks today: S&P 500, Nasdaq open higher as SK Hynix lifts chips; Fed meet in focus SECTIONS US stocks today: S&P 500, Nasdaq open higher as SK Hynix lifts chips; Fed meet in focus Reuters Last Updated: Oct 28, 2026, 07:09:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis On Wednesday, the S&P 500 and Nasdaq opened higher after positive results from memory-chip firms like SK Hynix. Investors are now focused on upcoming key corporate earnings, seen as a test for AI trade. Meanwhile, the Dow Jones Industrial Average experienced a slight decline of 42.1 points at the open. The S&P 500 gained 13.0 points, bolstered by positive market sentiment.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "28 Oct 2026, 07:09 PM IST", "pub_date_relative": "35m ago"}, {"title": "Stock market today: Dow wavers, S&P 500 and Nasdaq climb ahead of Fed decision, Big Tech earnings - Yahoo Finance", "full_content": "Stock market today: Dow wavers, S&P 500 and Nasdaq climb ahead of Fed decision, Big Tech earnings Yahoo Finance Stocks are little changed ahead of Fed decision: Live updates CNBC Stock Market Today: Stock Markets Mostly Higher Ahead of Fed Rate Decision WSJ Wall Street ends higher on revived AI momentum Reuters U.S. stocks edge higher ahead of Federal Reserve decision on interest rates Pittsburgh Post-Gazette", "source": "Google News Business", "pub_date_str": "28 Oct 2026, 07:08 PM IST", "pub_date_relative": "36m ago"}, {"title": "Ramky Infrastructure shares surge over 17% to \u20b9300 despite a 46% yearly fall; what explains the sharp rebound?", "full_content": "Shares of Ramky Infrastructure , the flagship company of the Ramky Group, surged 17.4% in Wednesday\u2019s trade, settling at \u20b9 300 apiece and recording their biggest single-day gain since August 2022. The sharp rally offered some relief to shareholders after the stock had been under sustained selling pressure since April.\n\nAlthough there were no major fundamental triggers behind the sharp rise in Ramky Infrastructure\u2019s share price, trading volumes witnessed a significant spike, with nearly 7 million shares changing hands on the NSE and BSE during the session. This was nearly five times the stock\u2019s average weekly trading volume, according to Trendlyne data.\n\nThe rally helped the stock recover all its October losses and turn positive, with a gain of 7.6% so far this month. If the momentum sustains through the end of October, it would mark the stock\u2019s first monthly gain after five consecutive months of losses.\n\nDespite the recent recovery, the stock remains down 46% so far in 2026, extending its decline to around 70% from its record high of \u20b9 1,009 apiece. The prolonged sell-off has weighed heavily on retail shareholders, who collectively held a 27.6% stake in the company at the end of the September quarter.\n\nLast week, Ramky Infrastructure announced that it had entered into an \u20b9 588.57 crore contract with Rail Vikas Nigam Ltd (RVNL) for the construction of residential towers comprising 670 housing units, a Type-VII bungalow, a shopping complex, a cafeteria, and associated external development and infrastructure works at the existing NMDC township in Bacheli, Chhattisgarh.\n\nThe project will be executed on an engineering, procurement, and construction (EPC) basis, with completion scheduled within 30 months from the appointed date.\n\nFor the June-ending quarter, the company had reported a 47% decline in consolidated net profit at \u20b9 39.3 crore for the quarter ended June 30, 2026.", "source": "LiveMint Markets", "pub_date_str": "28 Oct 2026, 06:57 PM IST", "pub_date_relative": "47m ago"}, {"title": "Want guaranteed income in retirement without an annuity? Try laddering I bonds.", "full_content": "The new I-bond interest rate could be 5.5% or 5.4%, but that shouldn\u2019t change your strategy.", "source": "MarketWatch Top Stories", "pub_date_str": "28 Oct 2026, 06:57 PM IST", "pub_date_relative": "48m ago"}, {"title": "FEC campaign finance system offline days before midterms after hackers reportedly target site", "full_content": "The Federal Election Commission said Tuesday night that it identified the issue affecting its electronic filing system and was implementing a fix, after reports that a hacker or hackers had targeted the agency's systems days before the midterm elections .\n\nBut the system remained offline early Wednesday, cutting off a key window into campaign money just as late-election spending surges.\n\nAn FEC electronic filings official told campaign compliance firms Monday night that a \"bad actor\" was attempting to breach the agency's systems and that public-facing services had been shut down, according to an email obtained by Reuters . The filing system has been offline since around 10 p.m. ET Monday.\n\nThe FEC has not said who was behind the reported breach attempt, whether anyone gained access to its systems or whether any data was compromised. Previously filed reports remain searchable.\n\nThe FEC told CNBC that the agency's IT staff is working to restore the service.\n\nIn the final 20 days before an election, candidate committees must report certain contributions or loans of $1,000 or more within 48 hours , while political committees and outside groups must disclose certain spending within 24 hours .\n\nThose rules are designed to give voters a near-real-time view of the money flooding into races when it matters most.\n\nFor example, Elon Musk 's America PAC reported nearly $6.8 million in independent expenditures for communications disseminated Oct. 20, according to a CNBC analysis of FEC filings.", "source": "CNBC Top News", "pub_date_str": "28 Oct 2026, 06:50 PM IST", "pub_date_relative": "54m ago"}, {"title": "Why China is desperate to ship cars outside of the country", "full_content": "To understand why China is desperate to ship cars overseas, visit a dealership in Beijing.\n\nAutumn has traditionally been the peak time to buy vehicles in the country, but this year many showrooms are empty or shut.\n\nCar salesman Li Ke said that other than the Covid-19 pandemic, the 2026 \"golden September and silver October\" season, as it's known, is the slowest he's seen in his 26 years on the job.\n\n\"In past years, customers would come to the showrooms nonstop,\" he told CNBC during an interview in his deserted showroom at a complex of dealerships on the outskirts of the Chinese capital. \"We would have deals to sign every day. But nowadays we see only two to three deals a week. It's a dramatic drop.\"\n\nMany people in China aren't buying cars because an unstable job market and a continued slide in property prices have undercut consumer confidence. The government has also scaled back incentives such as cash-for-clunkers subsidies and tax breaks to go electric, car salespeople said.\n\nPassenger car retail sales for 2026 in China totaled 13.33 million units through September, falling 21.7% from a year ago, according to the China Passenger Car Association. For the full year 2026, China's domestic passenger car retail sales are set to drop 22% to 18.5 million vehicles, the association said \u2014 under the level recorded in the first year of the pandemic.\n\nEven electric vehicles, which were once a bright spot, are down. Gasoline car sales have been declining in China because of the country's transition to electric vehicles, but sales in China of new-energy vehicles \u2014 which includes EVs \u2014 dropped by 12.8% from January through September, according to the association.\n\n\"Customers are watching every penny,\" Li said. \"When looking at all the new functions on all these new models, they are weighing what is most practical, economic and worth their money over the long term. We don't see impulse buying. Because of the bad economy, people are taking more time to replace their cars.\"", "source": "CNBC Top News", "pub_date_str": "28 Oct 2026, 06:47 PM IST", "pub_date_relative": "57m ago"}, {"title": "Sebi signs MoU with Bank of England to strengthen oversight of clearing corporations", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Sebi signs MoU with Bank of England to strengthen oversight of clearing corporations The Economic Times daily newspaper is available online now. Read Today's Paper Sebi signs MoU with Bank of England to strengthen oversight of clearing corporations SECTIONS Sebi signs MoU with Bank of England to strengthen oversight of clearing corporations By Kumar Gaurav , ETMarkets.com Last Updated: Oct 28, 2026, 06:45:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis SEBI and the Bank of England signed an MoU to strengthen regulatory cooperation and information sharing on clearing corporations. The framework supports cross-border supervision, enables reliance on SEBI\u2019s oversight, and reinforces financial stability.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "28 Oct 2026, 06:45 PM IST", "pub_date_relative": "59m ago"}, {"title": "Exclusive | Nelson Peltz\u2019s Trian Offers to Buy Wendy\u2019s for $1.4 Billion - WSJ", "full_content": "Exclusive | Nelson Peltz\u2019s Trian Offers to Buy Wendy\u2019s for $1.4 Billion WSJ Wendy's shares jump 15% as Nelson Peltz's Trian offers $1.4 billion to buy burger chain CNBC Billionaire investor Nelson Peltz makes move to buy struggling Wendy's Yahoo Finance The struggling burger chain Wendy\u2019s has received a buyout offer from an activist investor AP News Struggling burger chain Wendy\u2019s gets a buyout offer from activist investor Nelson Peltz The Seattle Times", "source": "Google News Business", "pub_date_str": "28 Oct 2026, 06:41 PM IST", "pub_date_relative": "1h ago"}, {"title": "The 'Magnificent Seven' is no more. Time to pick winners and losers as group's correlation breaks down", "full_content": "The \"Magnificent Seven\" doesn't trade as a monolith anymore, challenging investors to be more discerning when picking through the market's biggest stocks rather than viewing them as a single trade.\n\nCNBC calculated the rolling 60-day correlation of daily returns for each of the 21 unique pairs among the Magnificent Seven \u2014 which comprises Alphabet , Amazon , Apple , Meta Platforms , Microsoft , Nvidia and Tesla .\n\nThe average of those correlations recently fell to its lowest level in more than a decade, suggesting the group is trading less like a cohesive block than it has historically. This marks a departure for a group that's often discussed together because of its size and influence over the broader market.\n\nThe companies \"all have different exposures to AI,\" said Gil Luria, analyst at D.A. Davidson. \"This requires a much more granular approach to which of the largest mega-caps an investor wants to own as opposed to just owning them wholesale,\" he added.\n\nThe dislocation has led the group as a whole to lag the broader market. The Roundhill Magnificent Seven ETF (MAGS) is up 7% year to date, while the S&P 500 has gained 12%. Tesla and Meta are the two names in the cohort down in 2026, while Nvidia and Apple are the only ones outperforming the S&P 500.\n\nMicrosoft and Alphabet report results after the bell Wednesday. Amazon will post earnings after the close on Thursday.\n\nThe growing divergence among the Magnificent Seven reflects investors' deeper focus on companies' \"independent fundamental growth drivers,\" said Thomas DiFazio, ETF strategist at Roundhill Investments. \"They have varying levels of success, when you put them in the totem pole of AI winners and losers.\"\n\nHe added that \"investors are focusing on the micro factors,\" such as company-specific news that can signal whether the business can flourish in the AI world.", "source": "CNBC Top News", "pub_date_str": "28 Oct 2026, 06:39 PM IST", "pub_date_relative": "1h ago"}, {"title": "Auto biggies Q2 result compared: Bajaj Auto vs Maruti Suzuki - Who wins the earnings race? Profit, revenue, target price", "full_content": "Bajaj Auto vs Maruti Suzuki: Shares of Bajaj Auto and Maruti Suzuki ended in green on Wednesday, a day after the two auto majors announced their second quarter results for the financial year 2026-27.\n\nBajaj Auto reported upbeat earnings with a 35.2% annual jump in its consolidated net profit. Whereas, Maruti Suzuki India reported mix set of numbers as its profit fell by 26.4%, but revenue surged by 26% annually.\n\nBajaj Auto reported a 35% annual jump in its standalone profit after tax (PAT) to \u20b9 3,354 crore in the three months to September compared to the corresponding quarter of the last financial year.\n\nCar market leader Maruti Suzuki India saw 26.36% decline in its consolidated net profit for the second quarter of FY27. The car maker\u2019s net profit declined to \u20b9 2,466.1 crore, due to higher input costs resulting from the West-Asia conflict even as the revenue surged sharply, driven by record quarterly vehicle sales volume. Its net profit stood at \u20b9 2,480 crore in the same quarter of previous financial year.\n\nMaruti Suzuki\u2019s total revenue from operations increased to \u20b9 53,355.5 crore as against \u20b9 42,344.2 crore in the same period of 2025-26 fiscal.\n\nThe company\u2019s total expenses in July-September also shot up to \u20b9 50,619 crore as compared to \u20b9 39,018.4 crore in the year-ago period, the company said. Bajaj Auto\u2019s revenue from operations stood at \u20b9 20,003, up 34% on an annual basis from \u20b9 14,922 crore reported in the year-ago period.\n\nHealthy launch pipeline, recovery in domestic passenger vehicle demand, lean channel inventory, and capacity ramp-up at new facilities are likely to boost Maruti Suzuki performance in the financial year 2026-27, highlighted Motilal Oswal Financial Services .\n\nThe brokerage maintained a \u2018Buy\u2019 rating with a target price of \u20b9 14,800 per share. \u201cWe expect MSIL to deliver a 11% earnings CAGR over FY26\u201328E. Reiterate BUY with a TP of INR14,800, valuing the stock at 26x FY28E EPS.\u201d", "source": "LiveMint Markets", "pub_date_str": "28 Oct 2026, 06:31 PM IST", "pub_date_relative": "1h ago"}, {"title": "11 bargain-priced stocks of companies that have huge growth potential over the next two years", "full_content": "These stocks trade at low price/earnings valuations, and the companies are projected to achieve very high revenue growth rates through 2028.", "source": "MarketWatch Top Stories", "pub_date_str": "28 Oct 2026, 06:24 PM IST", "pub_date_relative": "1h ago"}, {"title": "IndiaMART management expects profitable growth despite macro headwinds; AI could drive the next phase", "full_content": "Despite macroeconomic uncertainties and the rapid evolution of artificial intelligence (AI), Dinesh Agarwal, Chief Executive Officer, IndiaMART, remains optimistic and expects IndiaMART InterMESH to continue growing profitably in the foreseeable future.\n\nIn an interaction with Mint on Wednesday, 28 October, the CEO of one of India's leading business-to-business (B2B) online marketplaces discussed the factors weighing on revenue growth, its strategy to navigate competition from AI-powered information platforms, and the opportunities it sees in technology-led improvements.\n\nWhile subscriber volumes in IndiaMART's standalone business have remained stagnant, the company has managed to increase the value generated per subscriber.\n\nAgarwal believes these factors, along with investments in technology, customer acquisition and category-level pricing, can help the company sustain profitable growth.\n\nExplaining the factors behind the company's revenue growth, Agarwal said performance depends on two key variables: the number of paying subscribers and the value generated per subscriber.\n\nAlthough subscriber volumes have not increased, IndiaMART has recorded an approximately 8% increase in value per subscriber in its standalone business.\n\nThe company's consolidated performance is also benefiting from Busy, which has reported revenue growth of around 26\u201327%, according to Agarwal.\n\nLooking ahead to the second half of the financial year, Agarwal identified several developments that could influence the business environment. These include geopolitical tensions, elevated inflation, high oil prices and an upward interest-rate cycle.", "source": "LiveMint Markets", "pub_date_str": "28 Oct 2026, 06:23 PM IST", "pub_date_relative": "1h ago"}, {"title": "We read Liz Truss\u2019s book so you don\u2019t have to", "full_content": "Alternative histories aren\u2019t always written by the victors", "source": "FT Markets", "pub_date_str": "28 Oct 2026, 06:20 PM IST", "pub_date_relative": "1h ago"}, {"title": "Trump jokes $5,000 would buy 'a hamburger and maybe a small dessert' at Mar-a-Lago as affordability looms over midterm", "full_content": "President Donald Trump joked Tuesday night that the $5,000 payments he's promised U.S. adults would buy little more than \"a hamburger and maybe a small dessert\" at his Mar-a-Lago club in Florida, a week before the midterm election dominated by voters' concerns over affordability.\n\nTrump has pledged $5,000 to every adult citizen if his fellow Republicans retain majorities in both the House and Senate, specifying the money must be spent in the U.S.\n\n\"Go to Florida, go to any one of our great places. You can even come to Mar-a-Lago,\" Trump said at a political rally in Texas.\n\n\"The problem is that for $5,000, the most you'll be able to buy is a hamburger and maybe a small dessert.\"\n\nThe president also joked that, \"I'm not even sure you could buy that.\"\n\n\"No, don't go there. That's not a good place if you're price-conscious.\"\n\nAffordability has been a dominant issue for Americans heading into the Nov. 3 vote.\n\nThe CNBC All-America Economic Survey this month of 1,000 registered voters found 55% said prices for them and their family are rising \"faster than usual.\"", "source": "CNBC Top News", "pub_date_str": "28 Oct 2026, 06:19 PM IST", "pub_date_relative": "1h ago"}, {"title": "Vertiv earnings just sent an upbeat signal about AI ahead of Big Tech results", "full_content": "Vertiv\u2019s big sales beat affirms that the AI buildout is accelerating.", "source": "MarketWatch Top Stories", "pub_date_str": "28 Oct 2026, 06:18 PM IST", "pub_date_relative": "1h ago"}, {"title": "We are in our 70s. Should we pay off our 2.5% mortgage early or build up our savings?", "full_content": "\u201cLet\u2019s say 10 years from now, when I\u2019m 84, we need a substantial amount of cash.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "28 Oct 2026, 06:15 PM IST", "pub_date_relative": "1h ago"}, {"title": "How much income Americans need to retire comfortably in every state - Fox Business", "full_content": "How much income Americans need to retire comfortably in every state Fox Business", "source": "Google News Business", "pub_date_str": "28 Oct 2026, 06:10 PM IST", "pub_date_relative": "1h ago"}, {"title": "India bonds end flat as oil woes come up against short covering", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Bonds \u203a India bonds end flat as oil woes come up against short covering Powered By The Economic Times daily newspaper is available online now. Read Today's Paper India bonds end flat as oil woes come up against short covering SECTIONS India bonds end flat as oil woes come up against short covering Reuters Last Updated: Oct 28, 2026, 06:04:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Indian government bonds faced volatility as oil price hikes raised inflation concerns and affected market sentiment. The 6.94% 2036 bond yield fluctuated but ended slightly unchanged as traders reacted to market conditions. Elevated crude prices have increased worries about inflation, a wider fiscal deficit, and slower economic growth for India. The rupee weakened further against the dollar, prompting fears of aggressive policy tightening by the Reserve Bank of India.\n\nIndian government bonds experienced a significant decline after a prior rally due to rising oil prices. Brent crude oil prices increased following concerns over supply disruptions in Saudi Arabia. The US 10-year Treasury yield also rose, affecting the attractiveness of Indian debt. Markets are anticipating the Federal Reserve's policy decision and rate outlook, impacting investor sentiment.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "28 Oct 2026, 06:04 PM IST", "pub_date_relative": "1h ago"}, {"title": "SK Hynix delivered on third-quarter results \u2014 but the outlook is what really mattered to Wall Street and the AI trade", "full_content": "South Korea memory-chip giant says supply constraints will last through 2030.", "source": "MarketWatch Top Stories", "pub_date_str": "28 Oct 2026, 06:04 PM IST", "pub_date_relative": "1h ago"}, {"title": "SK Hynix Stock Jumps On Q3 Earnings Beat - Investor's Business Daily", "full_content": "SK Hynix Stock Jumps On Q3 Earnings Beat Investor's Business Daily SK Hynix Plans $75 Billion in Shareholder Returns After Blockbuster Earnings WSJ SK Hynix's earnings smash sends AI chip stocks up as investors cheer strong demand Business Insider SK Hynix Jumps 7%, Micron Rises 3% on Memory Shortage Call Through 2030 While Seagate Slips Despite Upbeat Guidance Yahoo Finance SK hynix Announces 3Q26 Financial Results SK hynix", "source": "Google News Business", "pub_date_str": "28 Oct 2026, 06:03 PM IST", "pub_date_relative": "1h ago"}, {"title": "Bandhan Bank Q2 profit jumps 5.6 times as asset quality improves", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a Earnings \u203a Bandhan Bank Q2 profit jumps 5.6 times as asset quality improves Bandhan Bank Share Price YES Bank Share Price Karur Vysya Bank Share Price City Union Bank Share Price South Indian Bank Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Bandhan Bank Q2 profit jumps 5.6 times as asset quality improves SECTIONS Bandhan Bank Q2 profit jumps 5.6 times as asset quality improves By Atmadip Ray , ET Bureau Last Updated: Oct 28, 2026, 06:02:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Bandhan Bank reported a five-fold rise in Q2 profit to Rs 622 crore, supported by lower provisions and improving asset quality. Net interest income grew 14%, margins strengthened, gross advances increased 13%, and deposits rose 9% year-on-year.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "28 Oct 2026, 06:02 PM IST", "pub_date_relative": "1h ago"}, {"title": "Meesho Q2 Results: Loss narrows to Rs 132 crore YoY, revenue rises 34%", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a Earnings \u203a Meesho Q2 Results: Loss narrows to Rs 132 crore YoY, revenue rises 34% Meesho Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Meesho Q2 Results: Loss narrows to Rs 132 crore YoY, revenue rises 34% SECTIONS Meesho Q2 Results: Loss narrows to Rs 132 crore YoY, revenue rises 34% By Kumar Gaurav , ETMarkets.com Last Updated: Oct 28, 2026, 06:00:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Meesho\u2019s Q2 FY27 net loss narrowed 67.8% to Rs 132.45 crore, while revenue surged 34.4% to Rs 4,131.58 crore. Rising user engagement, stronger merchandise value, improved contribution margins and festive-season demand supported growth amid elevated spending.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "28 Oct 2026, 06:00 PM IST", "pub_date_relative": "1h ago"}, {"title": "My wife cried when I found out she had only $80,000 in her 401(k). I have $2.2 million. Am I wrong to be shocked?", "full_content": "\u201cWhen I brought up retiring last spring, she said she was ready whenever I was, and I took that to mean we were in good shape.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "28 Oct 2026, 06:00 PM IST", "pub_date_relative": "1h ago"}, {"title": "My abusive ex-husband promised $20,000 for our kids\u2019 education. Now he refuses to pay. Is he legally obligated?", "full_content": "\u201cBefore our divorce, my former mother-in-law entrusted him with $20,000 for each of our daughters to invest on their behalf.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "28 Oct 2026, 06:00 PM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "At least 64 people dead in high-speed Spain train crash", "full_content": "At least 64 people have been killed in a collision between two trains in the Spanish province of Toledo, authorities have said.\n\nThe high-speed trains collided shortly before 9:15 a.m. local time (4:15 a.m. ET), when emergency services were deployed to the scene. It occurred on the Madrid to Seville line.\n\nTransport Minister \u00d3scar Puente told reporters that the control system at the nearby town of Urda failed and six trains were stopped. One was allowed to restart and travelled 25km before hitting a stopped train at high speed, he added, saying it was \"inexplicable\" how this had happened.\n\nAs well as those killed, 50 people were also injured, the minister said.\n\nRailway infrastructure manager Adif is investigating the sequence of events surrounding the accident, Spanish news agency EFE reported .\n\nTraffic on the Madrid to Andaluc\u00eda high-speed line had been interrupted.\n\nThe local Castilla La Mancha government confirmed at least 64 people had died, higher than another high-speed crash in southern Spain that killed 45 people in January.\n\nThe trains were operated by AVE and Iryo, per local media. More than 500 passengers were on board the two trains, newspaper El Pa\u00eds said.", "source": "CNBC Top News", "pub_date_str": "28 Oct 2026, 07:43 PM IST", "pub_date_relative": "1m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Wendy's shares jump 15% as Nelson Peltz's Trian offers $1.4 billion to buy burger chain", "full_content": "A group of investors led by Nelson Peltz's Trian Fund Management has offered $1.4 billion to buy Wendy's , according to a regulatory filing Wednesday.\n\nThe group has offered $7.35 per share in cash to take the burger chain private, paying a 20% premium to Tuesday's closing price. In addition to Trian, it includes investment firms BlueFive Capital and Sixth Street Partners, plus Flynn Group, one of Wendy's largest franchisees.\n\nWendy's shares spiked about 15% in morning trading following the offer. The Wall Street Journal first reported Peltz's proposal.\n\nWendy's did not immediately respond to a request for comment from CNBC. Trian declined to comment beyond the filing.\n\nThe take-private deal offer comes after a tough two-year stretch for the burger chain. Wendy's stock has tumbled 65% over that period, including Wednesday's gains. For six straight quarters, the company has reported same-store sales declines.\n\nWendy's is scheduled to report its third-quarter earnings before the bell on Nov. 5.\n\nWendy's challenges have made the company a cheaper acquisition target for Peltz, whose history with the brand dates back to an activist campaign he led more than two decades ago.\n\nBudget-conscious diners have been eating out less often, and Wendy's and its rivals have leaned into discounts to lure consumers into restaurants. Wendy's has also dealt with a revolving door of chief executives, who have had different ideas about turnaround strategies for the struggling chain.", "source": "CNBC Top News", "pub_date_str": "28 Oct 2026, 07:40 PM IST", "pub_date_relative": "4m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "SK Hynix shares jump 11% after record quarterly profit, outperforming broader market", "full_content": "South Korean chipmaker SK Hynix shares closed 10.89% higher on Wednesday in Asia after the company reported record quarterly profit that sharply beat estimates, and announced over $25 billion in dividends and buybacks.\n\nHere are SK Hynix's third-quarter results compared with LSEG SmartEstimates, which are weighted toward forecasts from analysts who are more consistently accurate:\n\nRevenue rose 327.9% from a year earlier, while operating profit climbed 632.1% year on year.\n\nCompared with the previous quarter, revenue climbed 31.9%, while operating profit surged 37.6%.\n\nThe gains outpaced the benchmark Kospi index, which closed 6.63% higher. The U.S.-listed shares of SK Hynix traded over 11% higher on Wednesday.\n\nThe company posted record quarterly revenue and operating profit, with sales exceeding 100 trillion won for the first time, as it announced plans to return about 100 trillion won to shareholders \u2014 including at least 30 trillion won in cash dividends and 60 trillion won in share buybacks and cancellations.\n\nIn the earnings call, SK Hynix CEO Kwak Noh-Jung cited financial market volatility and a correction in semiconductor stocks as the main reasons to halt its review of potential pre-IPO fundraising and IPO options for its U.S. subsidiary Solidigm.\n\nThe company had said it would continue to assess investment timing, scale and financing options to support Solidigm's growth and enhance shareholder value.", "source": "CNBC World Economy", "pub_date_str": "28 Oct 2026, 07:35 PM IST", "pub_date_relative": "9m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Derivatives", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "PROG Holdings Q3 2026 slides: revenue up 26% as outlook trimmed", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Oct 2026, 07:31 PM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "TriNet faces earnings test as revenue pressures persist", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Oct 2026, 07:31 PM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Earnings call transcript: Franklin Electric beats Q3 2026 estimates, stock slips", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Oct 2026, 07:31 PM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Earnings call transcript: Dana misses Q3 2026 EPS forecast as shares slide", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Oct 2026, 07:31 PM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Telesat under pressure as earnings arrive amid debt restructuring", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Oct 2026, 07:31 PM IST", "pub_date_relative": "14m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Bank of Canada raises key interest rate, says another hike possible", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Oct 2026, 07:30 PM IST", "pub_date_relative": "14m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "UK inflation forecast to average 3.4% in 2027, Healey says", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Oct 2026, 07:30 PM IST", "pub_date_relative": "14m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Earnings call transcript: Photocure Q3 2026 revenue rises as shares fall 4.9%", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Oct 2026, 07:30 PM IST", "pub_date_relative": "14m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Anthropic warns some risks may be uninsurable. AI coverage is going to be an issue for every company", "full_content": "Anthropic's IPO filing includes many words covering many risks , from IP theft to security incidents, data loss, climate change, rogue agents and all the way to an existential crisis for humanity. Embedded in all of the risk language are basic questions about insurance: What's going to be covered? Is it even possible to provide a policy for all of the ways that AI could go wrong? Anthropic, even with more cash than almost any company in America, couldn't answer that question with confidence.\n\n\"Because our models may behave in ways that no user or developer intended, claims arising from such actions could result in substantial liability. Our insurance policies also may not provide sufficient coverage to adequately mitigate the potential liabilities we face, especially where any one incident, or a group of incidents, causes disproportionate harm,\" the company's S-1 filing states . \"In addition, with the scale of harm that could result from a catastrophic AI-related incident, no single insurer, and potentially the insurance industry in the aggregate, may have sufficient capacity or expertise to underwrite insurance commensurate with such exposure. Further, the insurance market for AI-specific risks is nascent and evolving, and we may be unable to obtain coverage for certain AI-related liabilities on commercially reasonable terms, or at all, leaving us exposed to potentially significant uninsured losses.\"\n\nThose risks are far removed from AI chatbots helping to book airline tickets or find the best deals on a backyard grill. But there have been increasing instances where AI chatbots are going rogue and some companies are watching warily \u2014 even blocking them . In some extreme cases, chatbots are being accused of contributing to a death, including a case revealed this week , raising insurance questions for which there are no easy answers.", "source": "CNBC Top News", "pub_date_str": "28 Oct 2026, 07:28 PM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Google alters its cloud playbook, enlisting partners to sell more AI chips", "full_content": "Google has spent years pitching customers on the advantage of buying its chips, models and cloud services in one place, offering a full stack that rivals Amazon and Microsoft have tried to replicate.\n\nNow, the company is pushing its equipment outside of its own walls to reach more customers and build a bigger business around artificial intelligence chips, a market that Nvidia has dominated.\n\nA day ahead of its third-quarter earnings report, Alphabet said Tuesday that Oracle will offer Google's tensor processing units, or TPUs, the custom chips the internet giant has been developing since 2013 . It's the first time customers will be able to access TPUs outside of Google's infrastructure, and shows that cloud boss Thomas Kurian, who previously spent more than 20 years at Oracle, is looking elsewhere for growth.\n\n\"They're a very strong competitor, and it's very possible that they could eventually take market share from Nvidia,\" said Chris Ballard, managing director of Check Capital Management, referring to Google's position in chips.\n\nKurian, who joined Google in late 2018, is operating from a position of strength. Analysts expect Google Cloud revenue to jump about 90% from a year earlier, after growing 82% in the second quarter , with TPUs contributing to its momentum.\n\n\"Google was great at doing its own thing, but it was never able to serve customers,\" said Uday Cheruvu, a portfolio manager at Harding Loevner, which owns Alphabet shares. \"That mindset has changed.\"\n\nGoogle opened up TPUs to outside data centers in the second quarter, before this week's announcement with Oracle.\n\nEstimates for the TPU business vary widely, but they all point to significant growth. TD Cowen models $9.4 billion in TPU sales for the second half of this year and $62.5 billion for 2027. Wells Fargo expects about $9 billion in third-quarter sales and $99 billion next year.", "source": "CNBC World Economy", "pub_date_str": "28 Oct 2026, 07:22 PM IST", "pub_date_relative": "22m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Fed meeting live updates: No hike expected, but investors watching Warsh for what's next", "full_content": "The Federal Reserve's interest rate decision Wednesday likely will be short on suspense, with markets expecting the central bank to stay on hold even with inflation tracking well above target.\n\nMarkets are pricing in less than a 10% chance that the rate-setting Federal Open Market Committee follows up its quarter-percentage-point hike in September with another increase, according to the CME Group's FedWatch tool.\n\nAssuming that sentiment is correct, it will leave the Fed's benchmark interest rate in a range between 3.75% and 4% \u2014 and shift investor attention to Fed Chairman Kevin Warsh and whatever clues he chooses to provide in his post-meeting news conference.\n\nTraders expect the Fed to follow up the October skip with a hike at its next meeting in December.\n\nWith no updates to the Fed's \"dot plot\" of rate forecasts or the Summary of Economic Projections on tap for this meeting, there will be less detail about where officials see current conditions and the future path of monetary policy.\n\nSome observers do think there could be dissents from the decision to hold. Regional Presidents Beth Hammack of Cleveland and Lorie Logan of Dallas are potential no votes, as is Neel Kashkari of Minneapolis. Each chose to vote against a hold in July .\n\nThe Fed decision comes less than a week before a pivotal midterm election in which the balance of power in Congress is up for grabs. While Fed officials insist that political considerations play no part in their decisions, some economists have speculated that officials would prefer to steer away from increasing rates so close to an election.\n\nThe Fed's decision Wednesday follows a string of reports indicating that inflation is reaccelerating.", "source": "CNBC Top News", "pub_date_str": "28 Oct 2026, 07:20 PM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Economics", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "America's largest budget airline reports 71% jump in airfare", "full_content": "Frontier Airlines reported a 71% increase in airfare in the third quarter as the country's largest budget airline tried to pass along an even bigger jump in jet fuel prices.\n\nFrontier's fare revenue averaged $67.82 per passenger in the third quarter, compared with $39.74 last year. Including the budget airline's many fees, such as for checked and carry-on luggage, total revenue per passenger rose 30% on the year to $138.22.\n\nCustomers kept booking despite the higher prices. Frontier's passenger count rose 18% to more than 9.8 million people in the quarter. That's a difference of 1.5 million passengers from last year.\n\nThe company said demand remains strong, even at these higher prices, but Frontier still lost money. The airline widened its third-quarter loss to $104 million from a $77 million loss a year earlier. Its fuel bill soared 82% to $425 million.\n\nFrontier forecast potential adjusted profit in the fourth quarter, saying it expects to post an adjusted loss of 15 cents per share to adjusted earnings of as much as 5 cents per share.\n\nCarriers from Delta Air Lines to Frontier have said customers are mostly continuing to book flights despite higher fares, but that record jet fuel prices, their biggest cost after labor, are eroding profits.\n\nFrontier had eclipsed Spirit Airlines as the biggest discount carrier in the country even before that airline collapsed in May.", "source": "CNBC Top News", "pub_date_str": "28 Oct 2026, 07:20 PM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Financial Statement Analysis", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "JPL share price: Jio Platforms IPO listing gains explained - How much profit investors made on debut", "full_content": "Jio Platforms listing: Jio Platforms, on Wednesday, made a blockbuster debut at the stock exchanges with a premium of over 21%. Backed by Mukesh Ambani's Reliance Industries Limited (RIL), Jio Platforms has now become the country's second most valuable firm by market capitalisation, trailing only its parent, RIL.\n\nJio Platforms share price closed at \u20b9 1,417.35, up 26.66 % from the issue price on the BSE . On the NSE, the stock climbed 26.67 % to end at \u20b9 1,417.50 apiece.\n\nFor retail investors who received a single lot (consisting of 12 shares) of the Jio Platforms issue, they made an immediate opening gain of \u20b9 2,868. As Jio share price rallied further and closed higher by the end of Wednesday\u2019s trading session, investors\u2019 gains increased approximately to \u20b9 3,580 per lot on BSE\n\nFor investors who received shares under the small non-institutional investor quota (SNII), i.e. 180 shares, they are estimated to make an opening gain of nearly \u20b9 43,000.\n\nHigh net-worth individuals, who were allotted with Jio Platforms shares under NII category, may have seen an immediate value creation of around \u20b9 2.15 lakh at the market opening on Wednesday.\n\nJo share price opened higher at \u20b9 1,358 per share on Wednesday, October 28, against its upper price band issue of \u20b9 1,119 per share. The stock ended higher at \u20b9 1417.35 per share on BSE with a market capitalisation of \u20b9 13,05,241.98 crore on Wednesday, October 28.\n\nInitiating coverage for Jio Platforms, Motilal Oswal Financial Services Limited (MOFSL) gave a \u2018Buy\u2019 rating for the stock with a target price of \u20b9 1690 per share in the bull case scenario. The brokerage had fixed \u20b9 1,350 per share target in the base case scenario.\n\n\u201cWe believe the risk-reward remains compelling, with a bull-case TP of INR1,690 and a bear-case TP of INR1,035,\u201d highlighted the brokerage adding that its estimates for JPL\u2019s earnings and valuation are highly sensitive to wireless ARPU growth.", "source": "LiveMint Markets", "pub_date_str": "28 Oct 2026, 07:15 PM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Acutaas Chemicals among 5 stocks hitting 52-week highs; rallied up to 18% in a month", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News Acutaas Chemicals among 5 stocks hitting 52-week highs; rallied up to 18% in a month Written by Ritesh Presswala , ETMarkets.com | Oct 28, 2026, 07:16:38 PM IST 1 / 6 Fresh Highs On Wednesday, the benchmark Sensex fell 352 points to close at 73,246. Despite the market decline, five stocks from the BSE 500 index touched fresh 52-week highs, marking their highest price levels in the past year. A 52-week high represents the highest price at which a stock has traded over the preceding 12 months and may indicate increased market activity and investor interest.\n\nNew 52-week high: Rs 1516.65| CMP: Rs 1444.6. In the last one month, the stock has gained about 18%.\n\nNew 52-week high: Rs 3977| CMP: Rs 3706.5. In the last one month, the stock has gained about 15%.\n\nNew 52-week high: Rs 815.25| CMP: Rs 807. In the last one month, the stock has gained about 13%.\n\nNew 52-week high: Rs 235.45| CMP: Rs 232.8. In the last one month, the stock has gained about 13%.\n\nNew 52-week high: Rs 884.25| CMP: Rs 880. In the last one month, the stock has gained about 9%.", "source": "Economic Times Markets", "pub_date_str": "28 Oct 2026, 07:14 PM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Vedanta Aluminium Q2 Results: Profit doubles to Rs 6,187 crore, revenue jumps 41%", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a Earnings \u203a Vedanta Aluminium Q2 Results: Profit doubles to Rs 6,187 crore, revenue jumps 41% Vedanta Aluminium Metal Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Vedanta Aluminium Q2 Results: Profit doubles to Rs 6,187 crore, revenue jumps 41% SECTIONS Vedanta Aluminium Q2 Results: Profit doubles to Rs 6,187 crore, revenue jumps 41% By Akash Podishetti , ETMarkets.com Last Updated: Oct 28, 2026, 07:13:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Vedanta Aluminium\u2019s Q2 FY27 net profit surged 105% to Rs 6,187 crore, driven by record production, higher sales and improved realisations. Revenue rose 41%, EBITDA increased 83%, and net debt declined Rs 3,090 crore sequentially.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the
