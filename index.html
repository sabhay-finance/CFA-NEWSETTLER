", "source": "CNBC Top News", "pub_date_str": "10 Oct 2026, 12:22 AM IST", "pub_date_relative": "just now"}, {"title": "Dow rallies 400 points as Wall Street tries to wrap up volatile week on a high note: Live updates", "full_content": "Stocks rose on Friday, supported by the tech sector, as traders look to rebound from a volatile week of elevated Treasury yields and oil prices as well as declines in the artificial intelligence trade.\n\nThe Nasdaq Composite added 0.6%. The S&P 500 also climbed 0.6%, while the Dow Jones Industrial Average traded up 452 points, or 0.9%.\n\nSpaceX shares rose after the Elon Musk-led space and satellite company announced a deal to buy a nationwide spectrum portfolio. In contrast, shares of AT&T , Verizon and T-Mobile slid as investors wondered worried the agreement could drive up competition.\n\nOther tech names advanced on Friday alongside SpaceX. Software stocks led the way, with Palo Alto Networks gaining nearly 5%, and CrowdStrike and Palantir Technologies increasing 4% and 3%, respectively. Microsoft advanced 2%, as did fellow \"Magnificent Seven\" member Amazon.\n\nOutside of tech, healthcare was another standout sector, with names such as Merck and Gilead Sciences each jumping nearly 3%. Vaccine stocks like Moderna also popped on optimism surrounding reported National Institutes of Health cancer vaccine efforts .\n\nTech stocks, especially those related to AI, were a sore spot on Thursday after CNBC confirmed that OpenAI told investors that it saw $50 billion in annualized revenue at the end of September. Last month, a $68 billion figure was widely reported, though a person familiar with the matter said it also included gross revenue from partners.\n\nThe Nasdaq dropped more than 1%, marking its biggest one-day loss since mid-August. Thursday marked the second down day in a row for the tech-heavy index after it climbed to fresh all-time records earlier in the week.\n\n\"The sell-off reflected extreme positioning imbalances that have further to unwind in our view, which is why the whole AI-linked tech stock complex is unlikely to simply stage a sharp, V-shaped rebound,\" wrote Adam Crisafulli of Vital Knowledge.", "source": "CNBC Top News", "pub_date_str": "10 Oct 2026, 12:21 AM IST", "pub_date_relative": "1m ago"}, {"title": "Two massive trades just happened in Micron and Nvidia. What they could mean for chips", "full_content": "Bears continued to build up positions against the semiconductor group on Friday, as a series of eyebrow-raising trades in Micron and Nvidia dominated the tape and called into question the move in chips.\n\nMore than 180,000 puts traded in SMH by midday, compared to 50,000 calls, with $46 million of premium tied to puts versus $26 million in calls, according to ThinkOrSwim and SpotGamma data. By volume, 129,000 put contracts look like they were bought, according to SpotGamma.\n\nThe ratio of open interest in put contracts to calls climbed to 1.95, the highest since the second week of August, Barchart data show. The same ratio for the Invesco QQQ Trust continued its recent climb as well, to 1.51.\n\nIn Nvidia, just after the opening bell, someone bought 100,000 180-strike puts expiring Jan. 15 for $21 million, the biggest trade in the stock's options on the day. If it is a speculative position, it needs Nvidia to fall 22% by expiry.\n\nMU and NVDA in past 3 months While call volumes ran 40% higher than average, about $270 million in premium was tied to likely put-buying, according to SpotGamma data. The difference can in part be explained by a string of trades in deep in-the-money put contracts expiring in June 2028.\n\nThe bulk of the trades \u2013 about 125 puts with strikes from 2,250 to 2,500 \u2013 were transacted closer to the ask, suggesting they were bought. By the same logic, 50 trades at the 2,050 strike were likely sold. Micron shares are trading around $1,030.\n\nTaken at face value, it would be a net $14.5 million bearish spread position with an options delta near -1, meaning the trade functions like a synthetic short position. Traders will buy deep-in-the-money puts instead of shorting a stock if the cost of borrowing the stock is too high or if they want to have a defined risk position.", "source": "CNBC Top News", "pub_date_str": "10 Oct 2026, 12:20 AM IST", "pub_date_relative": "2m ago"}, {"title": "Trump Media advisor Katie Zacharia offered White House press secretary role", "full_content": "The White House has tapped Katie Zacharia, a lawyer and conservative commentator who works for Trump Media & Technology Group , to be its next press secretary, a White House official confirmed to CNBC.\n\nZacharia, a self-described \"hardline Trump supporter,\" has been offered the role, the official said on condition of anonymity to discuss the hiring announcement. It was not immediately clear if she has accepted the offer.\n\nIf she takes the job, Zacharia will succeed Karoline Leavitt , who left the Trump administration in late August.\n\nThe New York Times first reported the White House's pick of Zacharia.\n\nZacharia has worked since June as a senior communications advisor for Trump Media, owner of the president's preferred social media outlet, Truth Social, according to her LinkedIn profile.\n\nThe profile also shows her currently serving as general counsel at Fix California, a conservative activist group founded by Richard Grenell, Trump's special presidential envoy for special missions and former head of the John F. Kennedy Center for the Performing Arts.\n\nZacharia in March finished a two-month stint as a spokeswoman for the Department of Homeland Security, her LinkedIn page shows.\n\nAn IMDb page for Zacharia shows dozens of appearances on a number of political talk shows airing on Fox News and other conservative outlets.", "source": "CNBC Top News", "pub_date_str": "10 Oct 2026, 12:16 AM IST", "pub_date_relative": "7m ago"}, {"title": "Hurricane Isaias to \u2018stress test\u2019 oil markets already hobbled by tight fuel supplies", "full_content": "Supply disruptions during the Atlantic hurricane season usually end up being a blip. This year could be very different.", "source": "MarketWatch Top Stories", "pub_date_str": "10 Oct 2026, 12:14 AM IST", "pub_date_relative": "9m ago"}, {"title": "Katie Zacharia reportedly named new White House press secretary", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Oct 2026, 12:02 AM IST", "pub_date_relative": "20m ago"}, {"title": "Verizon stock heads for worst day since 2002 as SpaceX U.S. network plans whack telcos", "full_content": "Telecommunications stocks sold off on Friday after Elon Musk 's SpaceX announced an agreement to purchase a nationwide spectrum portfolio , aiming to expand its Starlink internet into mobile service.\n\nVerizon was down roughly 10% on the news, and was pacing for its worst day since 2002. Shares of T-Mobile dropped 13% while AT&T fell around 10%, each on track for their own worst days since 2013 and 2000, respectively.\n\nThe deal includes acquiring the spectrum from Grain Management, which SpaceX described as a \"license portfolio of up to 14 megahertz of paired spectrum in the 800 MHz band,\" in a Thursday statement.\n\nFCC Chair Brendan Carr, whose agency will oversee approval of the deal, said that competition in the spectrum market was \"really good news for the American consumers\" in a CNBC interview.\n\n\"We're probably going to bring over $100 billion of spectrum into the market over the next two years, so we're seeing a lot of competition,\" Carr told CNBC's \" Squawk on the Street \" on Friday.\n\n\"There's going to be moves in the market. People are going to try to out-compete, out-innovate, and I think that's great. We're going to see how this plays out. It's not for us ultimately to pick winners and losers,\" he added.\n\nMultiple SpaceX analysts lauded the new spectrum deal, with Evercore ISI writing that the rocket maker \"now has the outline of a real network\" alongside its existing satellite capabilities. JPMorgan wrote that the acquisition made Starlink Mobile's long-term opportunity \"more credible.\"\n\n\"That said, we continue to see limited near-term risk to U.S. wireless incumbents given the time, infrastructure and capital required to build a competitive terrestrial network,\" analysts added in a Friday note.", "source": "CNBC World Economy", "pub_date_str": "10 Oct 2026, 12:02 AM IST", "pub_date_relative": "20m ago"}, {"title": "Trump to issue directive on diesel, sources say, after he promises \u2019big announcement\u2019", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Oct 2026, 12:00 AM IST", "pub_date_relative": "22m ago"}, {"title": "\u2018I feel like a loser\u2019: I check my ETFs every day. They\u2019re up one minute, down the next. Should I be worried?", "full_content": "\u201cI presume these are sophisticated investors taking a profit.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "10 Oct 2026, 12:00 AM IST", "pub_date_relative": "23m ago"}, {"title": "Magnitude 7.6 earthquake hits Panama\u2019s southern coast", "full_content": "", "source": "Investing.com News", "pub_date_str": "09 Oct 2026, 11:58 PM IST", "pub_date_relative": "24m ago"}, {"title": "Marriage registration in India: Is a court certificate mandatory? Experts explain the legal position and key rules", "full_content": "If you have married according to religious customs and rituals but have not registered your marriage, does your marriage still have legal validity?\n\nWhile a marriage certificate can serve as important proof of marital status, the legal implications of non-registration depend on the applicable laws and the circumstances of the marriage. Here is what experts say about marriage registration in India.\n\nAmitraj Kaushal, Advocate at the Supreme Court of India, said the Hindu Marriage Act, 1955, provides for registration under Section 8, while the Special Marriage Act, 1954, governs other civil marriages.\n\n\u201cThe Supreme Court in Seema v. Ashwani Kumar emphasised compulsory registration of marriages. State rules differ in procedures, deadlines and penalties. Muslim, Christian and other marriages may be governed by different statutory and personal-law provisions,\u201d he added.\n\nSiddharth Maurya, Founder & Managing Director, Vibhavangal Anukulkara said, \u201cMarriage registration is an important legal safeguard and must not be considered a formality.\u201d\n\nThe Supreme Court, in Seema v. Ashwani Kumar, held that all religious communities must follow the procedure of compulsory registration of marriages. Couples should check the rules applicable to their place of marriage, rather than assume that the registration process is the same throughout India, he added.\n\nKaushal said marriage registration is not necessarily restricted to marriages performed after a particular year. Older couples can generally seek registration of an already solemnised marriage, subject to the applicable state law, prescribed procedure and evidentiary requirements.\n\nHowever, he added that retrospective registration does not automatically cure a marriage that was legally invalid when performed.", "source": "LiveMint Money", "pub_date_str": "09 Oct 2026, 11:57 PM IST", "pub_date_relative": "25m ago"}, {"title": "Northwest European gasoline margins jump on low inventories", "full_content": "", "source": "Investing.com News", "pub_date_str": "09 Oct 2026, 11:56 PM IST", "pub_date_relative": "26m ago"}, {"title": "Snowflake options flow shows call buyers targeting $370 strike", "full_content": "", "source": "Investing.com News", "pub_date_str": "09 Oct 2026, 11:54 PM IST", "pub_date_relative": "28m ago"}, {"title": "vVardis files for US IPO showing net loss, revenue growth", "full_content": "", "source": "Investing.com News", "pub_date_str": "09 Oct 2026, 11:54 PM IST", "pub_date_relative": "28m ago"}, {"title": "HIMS jumps 7% on peptide tailwind \u2014 but Citi sees 17% downside from here", "full_content": "", "source": "Investing.com News", "pub_date_str": "09 Oct 2026, 11:51 PM IST", "pub_date_relative": "31m ago"}, {"title": "Top AI Semiconductor Stocks According to Stifel Analysis", "full_content": "", "source": "Investing.com News", "pub_date_str": "09 Oct 2026, 11:51 PM IST", "pub_date_relative": "32m ago"}, {"title": "Trump created a committee to dig into the Fed's Lisa Cook. What is it and what comes next?", "full_content": "President Donald Trump on Friday announced an unusual legal step: He created a committee to help him decide whether to fire Federal Reserve Governor Lisa Cook .\n\nTrump has accused Cook of mortgage fraud , and in 2025 ordered her to be fired . The Supreme Court blocked that effort on procedural grounds but said he could try again. Trump in August informed Cook that he was considering another attempt to fire her. Her attorneys responded later that month, denying the allegations of fraud and saying Trump had no cause to remove her.\n\nThe decision to form what Trump is calling a \"committee of inquiry\" raises a number of questions about the path forward for Trump and Cook.\n\nAccording to the president's memo , Cook is expected to attend a hearing at the White House on Nov. 5. She can bring an attorney. The committee will weigh the evidence against her and her response. She will have until Nov. 10 to follow up after the proceedings.\n\nThen the committee will make a recommendation to the president as to whether there is cause to fire her from the Fed. The final call is up to the president. There is no set deadline for that final decision.\n\nTrump appointed three people to hear the evidence against Cook: Kevin Hassett , director of the National Economic Council; Keith Sonderling , acting director of the Office of Government Ethics and Labor secretary; and Andrea R. Lucas , chair of the Equal Employment Opportunity Commission. All three are Trump appointees.\n\nYes, at least once. The Supreme Court's majority opinion in Trump v. Cook , written by Chief Justice John Roberts , mentions a precedent.\n\nPresident William Howard Taft in 1912 convened a similar \"committee of inquiry\" to consider the removal of two members of the Board of General Appraisers, a precursor to what is now the U.S. Court of International Trade. The committee ultimately recommended their removal.", "source": "CNBC Top News", "pub_date_str": "09 Oct 2026, 11:50 PM IST", "pub_date_relative": "32m ago"}, {"title": "FCC chief defers to Pentagon on airing US execution on TV networks", "full_content": "", "source": "Investing.com News", "pub_date_str": "09 Oct 2026, 11:48 PM IST", "pub_date_relative": "34m ago"}, {"title": "As AT&T, Verizon and T-Mobile shares fall, Wall Street assesses the growing SpaceX threat", "full_content": "Telecommunications stocks were seeing their worst daily drops in over a decade.", "source": "MarketWatch Top Stories", "pub_date_str": "09 Oct 2026, 11:46 PM IST", "pub_date_relative": "37m ago"}, {"title": "Palantir options flow: call spreads cluster near 52-week high", "full_content": "", "source": "Investing.com News", "pub_date_str": "09 Oct 2026, 11:45 PM IST", "pub_date_relative": "37m ago"}, {"title": "Earnings season kicks into high gear as big banks report next week. Here's what's ahead", "full_content": "More important than the results may be what the companies themselves have to say about their outlooks.", "source": "CNBC Top News", "pub_date_str": "09 Oct 2026, 11:45 PM IST", "pub_date_relative": "38m ago"}, {"title": "Microsoft is nearing a big milestone that solidifies its revival", "full_content": "Microsoft is close to reclaiming a $4 trillion market cap \u2014 and fresh records are also in sight.", "source": "MarketWatch Top Stories", "pub_date_str": "09 Oct 2026, 11:36 PM IST", "pub_date_relative": "47m ago"}, {"title": "Why you need to take a closer look at your favorite stock index", "full_content": "Also in Weekend Reads: A positive case for the bond market, how prediction markets can pull you in, and a warning to those who benefit from GLP-1s.", "source": "MarketWatch Top Stories", "pub_date_str": "09 Oct 2026, 11:34 PM IST", "pub_date_relative": "49m ago"}, {"title": "Statistics ministry proposes common framework to calculate state GDP", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a Statistics ministry proposes common framework to calculate state GDP The Economic Times daily newspaper is available online now. Read Today's Paper Statistics ministry proposes common framework to calculate state GDP SECTIONS Statistics ministry proposes common framework to calculate state GDP ET Bureau Last Updated: Oct 09, 2026, 11:40:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The statistics ministry has proposed a common framework for estimating state gross domestic product. This framework uses an expenditure approach under the revised 2022-23 base year. Currently, no state compiles estimates of private final consumption expenditure, creating a gap. Proposed methods include using administrative data to allocate estimates across states and union territories. This initiative aims to improve consistency and comparability of GSDP estimates throughout India.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\nWhat is the real impact of 13x jump in cash transfers to women?\n\nThe NBFC saga - Part 2: Line drawn in 2006 is reason for the headlines today\n\nAirlines Q2 turbulence: Fewer passengers, rising fares and a crude shock\n\nBritannia\u2019s next big bet for young India lies beyond biscuits\n\nThe world is witnessing a bond rout. Why should it matter to you?\n\nQ2 earnings season: Will it settle or add to confusion in the stock market?", "source": "Economic Times Economy", "pub_date_str": "09 Oct 2026, 11:33 PM IST", "pub_date_relative": "49m ago"}, {"title": "My brother-in-law convinced his parents to sign over their home and life savings to buy a $3 million compound. Do I intervene?", "full_content": "\u201cBoth properties will be solely in his name.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "09 Oct 2026, 11:30 PM IST", "pub_date_relative": "53m ago"}, {"title": "I\u2019m a 68-year-old widow and give money to my two adult children. Am I putting my retirement at risk?", "full_content": "\u201cI also have $310,000 in an IRA and $46,000 in savings. My house is paid off.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "09 Oct 2026, 11:30 PM IST", "pub_date_relative": "53m ago"}, {"title": "188% up in 2026, DEE Development Engineers order book tops \u20b92500 cr mark spans power, oil & gas, heavy fabrication", "full_content": "DEE Development Engineers , a leading engineering and process piping solutions provider, today announced that its order book had crossed \u20b9 2,500 crore as of September 30, 2026, reaching \u20b9 2,531 crore.\n\nDuring the September quarter, the company secured orders worth \u20b9 225 crore, including amendments and currency fluctuations, while order execution stood at \u20b9 129.74 crore during the month.\n\nWith September's performance, the company's cumulative order inflows for FY2026\u201327 reached \u20b9 1,178.65 crore, including amendments and currency fluctuations, while cumulative order execution stood at \u20b9 591.52 crore as of September 30, 2026.\n\nThe figures reflect continued business activity across DEE's domestic and international operations, spanning process piping, heavy fabrication, gas plants, and power generation. DEE India continued to record business across its power, oil and gas, and other industrial segments, the company said in its filing.\n\nIts Thailand subsidiary remained active in the power segment, while DEE Fabricom India continued execution across heavy fabrication. The company also recorded activity through its gas plant and power generation businesses, reflecting the breadth of its operating portfolio.\n\nK. L. Bansal, Chairman and Managing Director of DEE Development Engineers Limited, said the company had invested in building a broader manufacturing platform across piping, fabrication, and seamless pipes. Its focus is now on coordinating these capabilities more efficiently, improving throughput and ensuring that every additional tonne manufactured contributes to better productivity and customer delivery.\n\nFor FY27, the company is targeting order inflows of over \u20b9 2,000 crore, core revenue of \u20b9 1,400\u20131,500 crore, and core EBITDA margins of 18\u201320%.", "source": "LiveMint Markets", "pub_date_str": "09 Oct 2026, 11:27 PM IST", "pub_date_relative": "55m ago"}, {"title": "Trump appoints committee to investigate statements by the Fed's Lisa Cook", "full_content": "President Donald Trump formally established a \"committee of inquiry\" to investigate allegations that Federal Reserve Governor Lisa Cook made false statements related to \"one or more mortgage instruments,\" the White House announced Friday.\n\nThe extraordinary announcement is the latest development in Trump's long-running effort to fire Cook, a nominee of former President Joe Biden , from the central bank's board. Trump, who frequently urges the Fed to lower interest rates, recently said the failure to do so by his handpicked chair, Kevin Warsh , is the fault of a \"hostile\" board.\n\nThe committee comprises three executive branch officials, including Kevin Hassett , Trump's top economic aide and a chief defender of the administration's economic record, according to a presidential memorandum posted on the White House website and shared Friday on social media.\n\nThe other two members are Keith Sonderling, Labor secretary and acting head of the Office of Government Ethics, and Equal Employment Opportunity Commission Chair Andrea Lucas, according to the notice, which is dated Wednesday. No outside, independent arbiters are mentioned.\n\nThe highly unusual move, which hasn't been used in nearly a century, is bound to fuel new accusations that Trump and his aides are eroding the Fed's long-maintained independence while once again wielding government power against the president's enemies. Congressional Democrats quickly slammed the announcement, while Cook's lawyers expressed deep skepticism about the panel's validity.\n\nThere is no modern precedent for such a committee, though past presidents have convened similar panels.", "source": "CNBC Top News", "pub_date_str": "09 Oct 2026, 11:26 PM IST", "pub_date_relative": "56m ago"}, {"title": "Elon Musk\u2019s growing SpaceX empire sends AT&T, Verizon and T-Mobile shares plunging - NBC News", "full_content": "Elon Musk\u2019s growing SpaceX empire sends AT&T, Verizon and T-Mobile shares plunging NBC News Starlink spectrum deal boosts Musk plan to beat AT&T, T-Mobile, and Verizon Ars Technica SpaceX Makes Big Play to Become a Wireless Carrier WSJ Stock Market Today: Indexes Rise, Poised for Weekly Gains; Dow Adds 400 Points; Telecom Stocks Drop as SpaceX Acquires Spectrum Investopedia ATEX, NN, GOGO Stocks Gain: SpaceX\u2019s $8B Spectrum Deal Could Boost Low-Band Spectrum Value, Says Roth Capital Yahoo Finance", "source": "Google News Business", "pub_date_str": "09 Oct 2026, 11:25 PM IST", "pub_date_relative": "57m ago"}, {"title": "Rural job demand under VB-G RAM G jumps 25% in September, 15.6 million households seek work", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Agriculture \u203a Rural job demand under VB-G RAM G jumps 25% in September, 15.6 million households seek work The Economic Times daily newspaper is available online now. Read Today's Paper Rural job demand under VB-G RAM G jumps 25% in September, 15.6 million households seek work SECTIONS Rural job demand under VB-G RAM G jumps 25% in September, 15.6 million households seek work ET Bureau Last Updated: Oct 09, 2026, 11:25:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis In September, the demand for work under the VB-G RAM G scheme increased by 25.2% compared to August. Approximately 15.6 million households sought work under the program, significantly rising from 12.5 million in August. The number of people seeking employment also grew to 18.8 million from 15.4 million in August. This scheme was launched in July, providing guaranteed annual employment of 125 days.\n\nWhat is the real impact of 13x jump in cash transfers to women?\n\nThe NBFC saga - Part 2: Line drawn in 2006 is reason for the headlines today\n\nAirlines Q2 turbulence: Fewer passengers, rising fares and a crude shock\n\nBritannia\u2019s next big bet for young India lies beyond biscuits\n\nThe world is witnessing a bond rout. Why should it matter to you?\n\nQ2 earnings season: Will it settle or add to confusion in the stock market?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "09 Oct 2026, 11:25 PM IST", "pub_date_relative": "57m ago"}, {"title": "Highway projects get three more months of bitumen, diesel cost escalation cover amid West Asia crisis", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Infrastructure \u203a Highway projects get three more months of bitumen, diesel cost escalation cover amid West Asia crisis The Economic Times daily newspaper is available online now. Read Today's Paper Highway projects get three more months of bitumen, diesel cost escalation cover amid West Asia crisis SECTIONS Highway projects get three more months of bitumen, diesel cost escalation cover amid West Asia crisis ET Bureau Last Updated: Oct 09, 2026, 11:23:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The ministry of road transport and highways is extending the cost compensation for bitumen and diesel. This extension will apply to projects executed until December 31, 2026. Work carried out will only qualify if the bid due date was set before April 1, 2026. The compensation aims to address the impact of rising diesel prices on highway construction.\n\nWhat is the real impact of 13x jump in cash transfers to women?\n\nThe NBFC saga - Part 2: Line drawn in 2006 is reason for the headlines today\n\nAirlines Q2 turbulence: Fewer passengers, rising fares and a crude shock\n\nBritannia\u2019s next big bet for young India lies beyond biscuits\n\nThe world is witnessing a bond rout. Why should it matter to you?\n\nQ2 earnings season: Will it settle or add to confusion in the stock market?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "09 Oct 2026, 11:23 PM IST", "pub_date_relative": "1h ago"}, {"title": "US stocks rise toward the finish of a record-breaking week - AP News", "full_content": "US stocks rise toward the finish of a record-breaking week AP News Stock Market Today: S&P 500 approaches fresh record high; Dow and Nasdaq climb as tech stocks rebound MarketWatch COMMENTARY: Morning Bid: Storm brewing Reuters US stocks hit record high, shrugging off bond market turmoil | CNN Business CNN S&P 500, Nasdaq hit records \u2014 but 'the breadth of the rally has narrowed': Chart of the Day Yahoo Finance", "source": "Google News Business", "pub_date_str": "09 Oct 2026, 11:23 PM IST", "pub_date_relative": "1h ago"}, {"title": "Trump ramps up battle to fire Fed\u2019s Lisa Cook. Her lawyers say there\u2019s no basis to remove her.", "full_content": "Trump wants the committee to report on whether there are grounds for Cook\u2019s removal from office. She hasn\u2019t been charged with a crime.", "source": "MarketWatch Top Stories", "pub_date_str": "09 Oct 2026, 11:20 PM IST", "pub_date_relative": "1h ago"}, {"title": "Google unveils new cloud-based AI agent to compete with Meta, OpenAI - Fox News", "full_content": "Google unveils new cloud-based AI agent to compete with Meta, OpenAI Fox News Anthropic bans users from being 'cruel' to its AI systems BBC Anthropic bans users from \u2018needless abusive or cruel behavior\u2019 towards Claude The Guardian Anthropic Moves Us One Step Closer to Making \u2018Clanker\u2019 a Slur Gizmodo The Biggest Changes Anthropic Just Made to Claude's Rules Business Insider", "source": "Google News Business", "pub_date_str": "09 Oct 2026, 11:17 PM IST", "pub_date_relative": "1h ago"}, {"title": "Expecting to receive festive bonus 2026? Where to invest for better returns \u2014 mutual funds, gold or FDs? Experts suggest", "full_content": "With Diwali and the festive season approaching, many employees may receive a festive bonus from their employers. If you are expecting an additional \u20b9 5,000, \u20b9 10,000, or more, deciding in advance where to invest this money can help you make the most of it rather than spend it impulsively.\n\nHowever, with returns varying across asset classes in 2026, choosing the right investment option among mutual funds , gold, and fixed deposits ( FDs ) requires looking beyond recent performance. Here's what you need to know.\n\nThese tables show how equity mutual fund categories and gold ETFs /funds have performed year-to-date in 2026 and over three years.\n\n*Source: Value Research, Category Average Returns as on 8 October 2026\n\nHere are the highest FD interest rates and rates offered by select banks for one-, three-, and five-year deposits.\n\n*Source: paisabazaar, Only top 5 banks considered, FD Rates as on 7 October 2026, Actual rates can vary\n\nUttam Agarwal, Chief Business Officer at Bajaj Capital LAP, said investors with a five-year or longer investment horizon could consider mutual funds. However, those concerned about market volatility need not invest their entire bonus at once. Spread it over three to six months through an SIP or STP.\n\n\u201cFixed deposits still make sense for money you'll need soon, and with the RBI's recent repo rate hike, it's worth watching whether banks raise their rates,\u201d Agarwal added.", "source": "LiveMint Money", "pub_date_str": "09 Oct 2026, 11:10 PM IST", "pub_date_relative": "1h ago"}, {"title": "The used car market is stagnant. Here's how to profit anyway", "full_content": "There's an old but useful expression used for buying cars: Kick the tires and light the fires. The phrase, which started in aviation but bled its way into automobiles, is a reminder to look under the hood and poke around before purchasing a car. The same advice would work for shares of CarMax .\n\nOn the surface, the stock looks fairly priced. CarMax is trading at roughly 17x fiscal-year expected earnings of $3.16/share. That's roughly in line with its 10-year historical forward multiple. While that valuation may not look stretched, the underlying fundamentals reflect a sharp squeeze on used-car affordability. Middle-market consumers, already pressured by high new and used car prices, see that compounded (literally) by severe financing headwinds. St. Louis Federal Reserve data puts average used auto loan APRs at 15.9% with an average loan term of 68 months. Even with used vehicle prices softening slightly, high borrowing costs keep monthly payments out of reach for many prospective buyers.\n\nOperational metrics used to evaluate a car dealership's performance show the impact. The cash conversion cycle has lengthened, inventory turnover has slowed, and average days on the lot have crept higher.\n\nBecause borrowing rates are unlikely to drop precipitously in the near term, a catalyst for an auto sales boom remains elusive. However, given the fair multiple and stable cash generation, an abrupt collapse is also not the base case.", "source": "CNBC Top News", "pub_date_str": "09 Oct 2026, 11:07 PM IST", "pub_date_relative": "1h ago"}, {"title": "AI chip stocks wobble even as investors get clarity on a key OpenAI issue", "full_content": "A new report paints OpenAI\u2019s financial picture in a more optimistic light.", "source": "MarketWatch Top Stories", "pub_date_str": "09 Oct 2026, 11:05 PM IST", "pub_date_relative": "1h ago"}, {"title": "Wall Street sees buying opportunity in banks as shares tank ahead of earnings", "full_content": "The sell-off in bank stocks ahead of earnings season is a buying opportunity rather than a warning sign for the economy.", "source": "CNBC Top News", "pub_date_str": "09 Oct 2026, 11:02 PM IST", "pub_date_relative": "1h ago"}, {"title": "Netflix Layoffs: 850 Jobs At Risk As Streaming Giant Plans Major Restructuring", "full_content": "Netflix had around 17,000 full-time employees at the end of 2025. A reported 5% workforce reduction could affect approximately 850 people, although the company has not confirmed the proposed cuts or identified the departments that may be affected.", "source": "NDTV Profit", "pub_date_str": "09 Oct 2026, 10:55 PM IST", "pub_date_relative": "1h ago"}, {"title": "Tesla Renamed 'Full Self-Driving\u2019 Label In Europe, Switches To 'Assisted Driving\u2019", "full_content": "Tesla has updated its European websites in Germany, Spain, the Netherlands and Slovakia, while retaining the \u201cFull Self-Driving (Supervised)\u201d name in the US. The change comes as regulators scrutinise how the software is marketed to motorists.", "source": "NDTV Profit", "pub_date_str": "09 Oct 2026, 10:54 PM IST", "pub_date_relative": "1h ago"}, {"title": "India Vs West Indies: Shai Hope Leads Visitors To Chase 250-Run Target To Win 2nd T20I By 6 Wickets In Ranchi", "full_content": "West Indies produced a strong batting performance to chase 250 runs and beat India in the second T20I on Friday.", "source": "NDTV Profit", "pub_date_str": "09 Oct 2026, 10:53 PM IST", "pub_date_relative": "1h ago"}, {"title": "This Bengaluru Farmer Makes Rs 50,000 A Day By Growing Baby Bottle Gourds For Qatar Market", "full_content": "A farmer in Karnataka\u2019s Bengaluru Urban district grows bottle gourds weighing around 500 grams each for export, earning about Rs 50,000 from a day\u2019s harvest.", "source": "NDTV Profit", "pub_date_str": "09 Oct 2026, 10:52 PM IST", "pub_date_relative": "1h ago"}, {"title": "AB de Villiers Makes Big Claim On Virat Kohli, Says India Star Is Better Than His Peak Years", "full_content": "Virat Kohli has scored 552 ODI runs in nine innings in 2026, including two centuries and three half-centuries, prompting AB de Villiers to praise his relaxed approach and form.", "source": "NDTV Profit", "pub_date_str": "09 Oct 2026, 10:47 PM IST", "pub_date_relative": "1h ago"}, {"title": "Stocks making the biggest moves midday: T-Mobile, Verizon, AT&T, Crown Castle, Teva & more", "full_content": "These are some of the stocks posting the largest moves midday.", "source": "CNBC Finance", "pub_date_str": "09 Oct 2026, 10:46 PM IST", "pub_date_relative": "1h ago"}, {"title": "AT&T, T-Mobile and Verizon shares tumble up to 11% as Musk\u2019s SpaceX makes Starlink mobile push", "full_content": "Shares of major US mobile service providers plunged in Friday\u2019s trading session after Elon Musk\u2019s SpaceX announced an acquisition of low-band spectrum that could help its Starlink satellite service expand into a major mobile carrier in the US.\n\nAT&T Inc. shares fell 11% to $21.96, while T-Mobile US Inc. and Verizon Communications Inc. also declined 11% each on Wall Street.\n\nSpaceX announced that the newly acquired spectrum would help it expand its satellite-to-cellular services and compete more directly with traditional wireless carriers. In a post on X on Thursday, Musk said the low-band spectrum was the last critical piece of the spectrum puzzle needed for SpaceX to provide complete phone coverage across America.\n\nThe spectrum was acquired from investment firm Grain Management LLC. It will allow SpaceX to provide cellular connectivity that can penetrate walls and deliver service to devices indoors, according to a post on the company\u2019s website. SpaceX also said the spectrum is supported by most mobile devices currently in use.\n\nThe financial terms of the agreement were not publicly disclosed by SpaceX or Grain Management. Grain had acquired the airwaves from T-Mobile earlier this year.\n\nOnce it receives approval from the Federal Communications Commission (FCC), SpaceX plans to combine its satellite-to-cell services with a terrestrial network to connect devices across the country.\n\nDuring SpaceX\u2019s debut quarterly earnings announcement in August, President Gwynne Shotwell outlined the company\u2019s plans to enter the mobile carrier business, saying that it definitely intended to build out the terrestrial component.\n\nSpaceX\u2019s Starlink Mobile satellite-to-cellular service already has access to global 2 GHz mid-band spectrum, which provides high-bandwidth capacity. The newly acquired spectrum will help its signals travel through obstacles, Reuters reported.", "source": "LiveMint Markets", "pub_date_str": "09 Oct 2026, 10:45 PM IST", "pub_date_relative": "1h ago"}, {"title": "Motorola Signature 27 India Launch Confirmed: 200MP Camera, Snapdragon Chipset And Other Key Features", "full_content": "Motorola's Signature 27 features a 200MP periscope camera, Snapdragon 8 Elite Extreme Gen 6 chipset, ArcticMesh cooling and seven years of OS upgrades.", "source": "NDTV Profit", "pub_date_str": "09 Oct 2026, 10:44 PM IST", "pub_date_relative": "1h ago"}, {"title": "India To Host World Travel & Tourism Council Global Summit", "full_content": "Union Minister for Tourism Gajendra Singh Shekhawat, who participated in the three-day event, said next year's summit will be instrumental in promoting inbound tourism in a big way.", "source": "NDTV Profit", "pub_date_str": "09 Oct 2026, 10:43 PM IST", "pub_date_relative": "1h ago"}, {"title": "Tesla drops 'Full Self-Driving' brand name in Europe after regulator pushback", "full_content": "Elon Musk 's automaker Tesla has changed the brand name of its \"Full Self-Driving (Supervised),\" or FSD, system in Europe to \"Assisted Driving\" after German regulators called the branding \"somewhat misleading.\"\n\nThe package is still sold under the Full Self-Driving (Supervised) branding in the U.S. as a $99 per month subscription for Tesla owners.\n\nTesla is gunning for approvals across Europe, where EV sales have been on the rise this year amid soaring fuel costs caused by the war in Iran, and where Tesla sales have shown signs of recovery from a sales slump last year.\n\nOn Tuesday, the German Federal Ministry of Transport , known as the BMV, said in a statement that Tesla's brand name \"FSD\" was \"somewhat misleading,\" adding that \"It is not a system that takes over the entire driving task. Rather, it is a driver assistance system that can support certain driving tasks such as accelerating, braking, and steering. The driver must remain attentive at all times.\"\n\nTesla has been pressuring automotive regulators in Europe, especially in the Netherlands, for rapid approval of their system. Reuters reported that in some cases, Tesla's \" browbeating \" pushed regulators to reduce the intensity of their safety tests and reviews of the company's technology.\n\nThe National Highway Traffic Safety Administration, the U.S. automotive safety regulator, is also investigating Tesla's FSD to determine if it is safe for drivers to use in fog, glaring sun or other reduced visibility conditions, and is investigating Tesla to determine whether FSD caused Tesla drivers to commit traffic violations \u2014 some that resulted in collisions.\n\nIn December 2025, a judge in California determined that Tesla had engaged in deceptive marketing around its Autopilot and FSD systems, falsely implying they were fully automated driving systems. Tesla has countersued the California DMV to try to shed that \"false advertiser\" label in a Los Angeles superior court.", "source": "CNBC World Economy", "pub_date_str": "09 Oct 2026, 10:42 PM IST", "pub_date_relative": "1h ago"}, {"title": "Hurricane Isaias disrupts U.S. oil production in Gulf of Mexico, threatens refineries", "full_content": "Hurricane Isaias is disrupting U.S. crude oil production in the Gulf of Mexico and could limit about 2% of the country's refining capacity, at a time when fuel markets are already tight around the world.\n\nIsaias is churning toward Mississippi, Alabama and the Florida panhandle as a Category 3 storm with maximum sustained winds of 120 mph, according to the National Hurricane Center , and is expected to make landfall Friday night or early Saturday.\n\nAs of Thursday, oil companies had shut in about 1.3 million barrels per day, or roughly 63% of total U.S. production in the Gulf, according to the Bureau of Safety and Environmental Enforcement .\n\nThe hurricane appeared to be veering away from the dense refining region in southern Louisiana near New Orleans and Baton Rouge.\n\nBut the storm could affect Chevron 's refinery in Pascagoula, Mississippi, and a Vertex Energy refinery in Saraland, Alabama. Both areas are under hurricane warnings. The facilities there can produce a combined 466,000 bpd, or 2.4% of U.S. refining capacity, said Andy Lipow, president of Lipow Oil Associates.\n\n\"Of course, losing any refinery capacity when diesel supplies are at their lowest level for this time of year since the EIA began reporting in 1982 is not a good thing,\" Lipow wrote in a Friday note, referring to the Energy Information Administration.\n\nChevron's refinery at Pascagoula remains operational, spokesperson Ross Allen said Thursday. Vertex officials weren't immediately available for comment about its Saraland refinery.\n\n\" The biggest risk to these two refineries are a loss of electricity or flooding damage,\" Lipow wrote in a note Friday. If the refineries do shut down, it would take one to two weeks to restart them if they did not sustain damage, he said.", "source": "CNBC Top News", "pub_date_str": "09 Oct 2026, 10:42 PM IST", "pub_date_relative": "1h ago"}, {"title": "Q2 Result Updates: Poonawalla Fincorp Profit Surges To Rs 375 Crore; Anand Rathi Approves Dividend", "full_content": "Q2 FY27 Results Live Updates: Anand Rathi, Can Fin Homes and Poonawalla Fincorp will be among the key earnings announcements to watch.", "source": "NDTV Profit", "pub_date_str": "09 Oct 2026, 10:30 PM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "Tanker attacks in Strait of Hormuz surge to wartime high as Iran tries to choke off oil exports", "full_content": "Oil tankers transiting the Strait of Hormuz are coming under fire almost daily, as Iran escalates its attacks in an effort to choke off a rebound in crude exports.\n\nEleven tankers came under attack while transiting Hormuz during the week that ended Oct. 4, the most strikes on commercial ships since the war began in late February, according to data from the International Maritime Organization, or IMO, a United Nations agency.\n\nAnother five tankers have come under attack this week. Twelve sailors were injured Monday when a projectile struck their tanker as it transited Hormuz. The sailors were Indian nationals and the ship, On Peace, is owned by the United Arab Emirates, according to the maritime security firm Marisks.\n\n\"These actions continue to demonstrate Iran's intent to assert [its] presence along key transit lanes and maintain pressure on transiting vessels,\" the Joint Maritime Information Center warned commercial ships in a Thursday notice. The center is a coalition of U.S. allied militaries headquartered in Bahrain that monitors maritime security in the region.\n\nA senior Iranian Revolutionary Guard official said Wednesday that Iran will block all \"illicit routes\" through Hormuz, according to the Fars News Agency , an outlet considered close to the Guard.\n\nThe surge of attacks on tankers comes as crude oil exports from the Middle East rebounded in September to prewar levels, due in large part to the U.S. military escorting ships through Hormuz using a route along Oman's coast.\n\n\"Volumes are getting through but they're getting through at a time of extremely high maritime risk,\" said Michelle Wiese Bockmann, a senior maritime intelligence analyst at Windward, a provider of risk management and surveillance.\n\nAt least nine sailors have died in ship attacks since July, according to the IMO.", "source": "CNBC Top News", "pub_date_str": "10 Oct 2026, 12:22 AM IST", "pub_date_relative": "just now", "cfa_topics": ["Alternative Investments", "Portfolio Management"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Dow rallies 400 points as Wall Street tries to wrap up volatile week on a high note: Live updates", "full_content": "Stocks rose on Friday, supported by the tech sector, as traders look to rebound from a volatile week of elevated Treasury yields and oil prices as well as declines in the artificial intelligence trade.\n\nThe Nasdaq Composite added 0.6%. The S&P 500 also climbed 0.6%, while the Dow Jones Industrial Average traded up 452 points, or 0.9%.\n\nSpaceX shares rose after the Elon Musk-led space and satellite company announced a deal to buy a nationwide spectrum portfolio. In contrast, shares of AT&T , Verizon and T-Mobile slid as investors wondered worried the agreement could drive up competition.\n\nOther tech names advanced on Friday alongside SpaceX. Software stocks led the way, with Palo Alto Networks gaining nearly 5%, and CrowdStrike and Palantir Technologies increasing 4% and 3%, respectively. Microsoft advanced 2%, as did fellow \"Magnificent Seven\" member Amazon.\n\nOutside of tech, healthcare was another standout sector, with names such as Merck and Gilead Sciences each jumping nearly 3%. Vaccine stocks like Moderna also popped on optimism surrounding reported National Institutes of Health cancer vaccine efforts .\n\nTech stocks, especially those related to AI, were a sore spot on Thursday after CNBC confirmed that OpenAI told investors that it saw $50 billion in annualized revenue at the end of September. Last month, a $68 billion figure was widely reported, though a person familiar with the matter said it also included gross revenue from partners.\n\nThe Nasdaq dropped more than 1%, marking its biggest one-day loss since mid-August. Thursday marked the second down day in a row for the tech-heavy index after it climbed to fresh all-time records earlier in the week.\n\n\"The sell-off reflected extreme positioning imbalances that have further to unwind in our view, which is why the whole AI-linked tech stock complex is unlikely to simply stage a sharp, V-shaped rebound,\" wrote Adam Crisafulli of Vital Knowledge.", "source": "CNBC Top News", "pub_date_str": "10 Oct 2026, 12:21 AM IST", "pub_date_relative": "1m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Fixed Income", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Two massive trades just happened in Micron and Nvidia. What they could mean for chips", "full_content": "Bears continued to build up positions against the semiconductor group on Friday, as a series of eyebrow-raising trades in Micron and Nvidia dominated the tape and called into question the move in chips.\n\nMore than 180,000 puts traded in SMH by midday, compared to 50,000 calls, with $46 million of premium tied to puts versus $26 million in calls, according to ThinkOrSwim and SpotGamma data. By volume, 129,000 put contracts look like they were bought, according to SpotGamma.\n\nThe ratio of open interest in put contracts to calls climbed to 1.95, the highest since the second week of August, Barchart data show. The same ratio for the Invesco QQQ Trust continued its recent climb as well, to 1.51.\n\nIn Nvidia, just after the opening bell, someone bought 100,000 180-strike puts expiring Jan. 15 for $21 million, the biggest trade in the stock's options on the day. If it is a speculative position, it needs Nvidia to fall 22% by expiry.\n\nMU and NVDA in past 3 months While call volumes ran 40% higher than average, about $270 million in premium was tied to likely put-buying, according to SpotGamma data. The difference can in part be explained by a string of trades in deep in-the-money put contracts expiring in June 2028.\n\nThe bulk of the trades \u2013 about 125 puts with strikes from 2,250 to 2,500 \u2013 were transacted closer to the ask, suggesting they were bought. By the same logic, 50 trades at the 2,050 strike were likely sold. Micron shares are trading around $1,030.\n\nTaken at face value, it would be a net $14.5 million bearish spread position with an options delta near -1, meaning the trade functions like a synthetic short position. Traders will buy deep-in-the-money puts instead of shorting a stock if the cost of borrowing the stock is too high or if they want to have a defined risk position.", "source": "CNBC Top News", "pub_date_str": "10 Oct 2026, 12:20 AM IST", "pub_date_relative": "2m ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Verizon stock heads for worst day since 2002 as SpaceX U.S. network plans whack telcos", "full_content": "Telecommunications stocks sold off on Friday after Elon Musk 's SpaceX announced an agreement to purchase a nationwide spectrum portfolio , aiming to expand its Starlink internet into mobile service.\n\nVerizon was down roughly 10% on the news, and was pacing for its worst day since 2002. Shares of T-Mobile dropped 13% while AT&T fell around 10%, each on track for their own worst days since 2013 and 2000, respectively.\n\nThe deal includes acquiring the spectrum from Grain Management, which SpaceX described as a \"license portfolio of up to 14 megahertz of paired spectrum in the 800 MHz band,\" in a Thursday statement.\n\nFCC Chair Brendan Carr, whose agency will oversee approval of the deal, said that competition in the spectrum market was \"really good news for the American consumers\" in a CNBC interview.\n\n\"We're probably going to bring over $100 billion of spectrum into the market over the next two years, so we're seeing a lot of competition,\" Carr told CNBC's \" Squawk on the Street \" on Friday.\n\n\"There's going to be moves in the market. People are going to try to out-compete, out-innovate, and I think that's great. We're going to see how this plays out. It's not for us ultimately to pick winners and losers,\" he added.\n\nMultiple SpaceX analysts lauded the new spectrum deal, with Evercore ISI writing that the rocket maker \"now has the outline of a real network\" alongside its existing satellite capabilities. JPMorgan wrote that the acquisition made Starlink Mobile's long-term opportunity \"more credible.\"\n\n\"That said, we continue to see limited near-term risk to U.S. wireless incumbents given the time, infrastructure and capital required to build a competitive terrestrial network,\" analysts added in a Friday note.", "source": "CNBC World Economy", "pub_date_str": "10 Oct 2026, 12:02 AM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Corporate Issuers", "Alternative Investments", "Portfolio Management"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "\u2018I feel like a loser\u2019: I check my ETFs every day. They\u2019re up one minute, down the next. Should I be worried?", "full_content": "\u201cI presume these are sophisticated investors taking a profit.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "10 Oct 2026, 12:00 AM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Marriage registration in India: Is a court certificate mandatory? Experts explain the legal position and key rules", "full_content": "If you have married according to religious customs and rituals but have not registered your marriage, does your marriage still have legal validity?\n\nWhile a marriage certificate can serve as important proof of marital status, the legal implications of non-registration depend on the applicable laws and the circumstances of the marriage. Here is what experts say about marriage registration in India.\n\nAmitraj Kaushal, Advocate at the Supreme Court of India, said the Hindu Marriage Act, 1955, provides for registration under Section 8, while the Special Marriage Act, 1954, governs other civil marriages.\n\n\u201cThe Supreme Court in Seema v. Ashwani Kumar emphasised compulsory registration of marriages. State rules differ in procedures, deadlines and penalties. Muslim, Christian and other marriages may be governed by different statutory and personal-law provisions,\u201d he added.\n\nSiddharth Maurya, Founder & Managing Director, Vibhavangal Anukulkara said, \u201cMarriage registration is an important legal safeguard and must not be considered a formality.\u201d\n\nThe Supreme Court, in Seema v. Ashwani Kumar, held that all religious communities must follow the procedure of compulsory registration of marriages. Couples should check the rules applicable to their place of marriage, rather than assume that the registration process is the same throughout India, he added.\n\nKaushal said marriage registration is not necessarily restricted to marriages performed after a particular year. Older couples can generally seek registration of an already solemnised marriage, subject to the applicable state law, prescribed procedure and evidentiary requirements.\n\nHowever, he added that retrospective registration does not automatically cure a marriage that was legally invalid when performed.", "source": "LiveMint Money", "pub_date_str": "09 Oct 2026, 11:57 PM IST", "pub_date_relative": "25m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Snowflake options flow shows call buyers targeting $370 strike", "full_content": "", "source": "Investing.com News", "pub_date_str": "09 Oct 2026, 11:54 PM IST", "pub_date_relative": "28m ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "vVardis files for US IPO showing net loss, revenue growth", "full_content": "", "source": "Investing.com News", "pub_date_str": "09 Oct 2026, 11:54 PM IST", "pub_date_relative": "28m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Trump created a committee to dig into the Fed's Lisa Cook. What is it and what comes next?", "full_content": "President Donald Trump on Friday announced an unusual legal step: He created a committee to help him decide whether to fire Federal Reserve Governor Lisa Cook .\n\nTrump has accused Cook of mortgage fraud , and in 2025 ordered her to be fired . The Supreme Court blocked that effort on procedural grounds but said he could try again. Trump in August informed Cook that he was considering another attempt to fire her. Her attorneys responded later that month, denying the allegations of fraud and saying Trump had no cause to remove her.\n\nThe decision to form what Trump is calling a \"committee of inquiry\" raises a number of questions about the path forward for Trump and Cook.\n\nAccording to the president's memo , Cook is expected to attend a hearing at the White House on Nov. 5. She can bring an attorney. The committee will weigh the evidence against her and her response. She will have until Nov. 10 to follow up after the proceedings.\n\nThen the committee will make a recommendation to the president as to whether there is cause to fire her from the Fed. The final call is up to the president. There is no set deadline for that final decision.\n\nTrump appointed three people to hear the evidence against Cook: Kevin Hassett , director of the National Economic Council; Keith Sonderling , acting director of the Office of Government Ethics and Labor secretary; and Andrea R. Lucas , chair of the Equal Employment Opportunity Commission. All three are Trump appointees.\n\nYes, at least once. The Supreme Court's majority opinion in Trump v. Cook , written by Chief Justice John Roberts , mentions a precedent.\n\nPresident William Howard Taft in 1912 convened a similar \"committee of inquiry\" to consider the removal of two members of the Board of General Appraisers, a precursor to what is now the U.S. Court of International Trade. The committee ultimately recommended their removal.", "source": "CNBC Top News", "pub_date_str": "09 Oct 2026, 11:50 PM IST", "pub_date_relative": "32m ago", "cfa_topics": ["Economics", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Palantir options flow: call spreads cluster near 52-week high", "full_content": "", "source": "Investing.com News", "pub_date_str": "09 Oct 2026, 11:45 PM IST", "pub_date_relative": "37m ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Earnings season kicks into high gear as big banks report next week. Here's what's ahead", "full_content": "More important than the results may be what the companies themselves have to say about their outlooks.", "source": "CNBC Top News", "pub_date_str": "09 Oct 2026, 11:45 PM IST", "pub_date_relative": "38m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Microsoft is nearing a big milestone that solidifies its revival", "full_content": "Microsoft is close to reclaiming a $4 trillion market cap \u2014 and fresh records are also in sight.", "source": "MarketWatch Top Stories", "pub_date_str": "09 Oct 2026, 11:36 PM IST", "pub_date_relative": "47m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Why you need to take a closer look at your favorite stock index", "full_content": "Also in Weekend Reads: A positive case for the bond market, how prediction markets can pull you in, and a warning to those who benefit from GLP-1s.", "source": "MarketWatch Top Stories", "pub_date_str": "09 Oct 2026, 11:34 PM IST", "pub_date_relative": "49m ago", "cfa_topics": ["Equity Investments", "Fixed Income"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Statistics ministry proposes common framework to calculate state GDP", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a Statistics ministry proposes common framework to calculate state GDP The Economic Times daily newspaper is available online now. Read Today's Paper Statistics ministry proposes common framework to calculate state GDP SECTIONS Statistics ministry proposes common framework to calculate state GDP ET Bureau Last Updated: Oct 09, 2026, 11:40:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The statistics ministry has proposed a common framework for estimating state gross domestic product. This framework uses an expenditure approach under the revised 2022-23 base year. Currently, no state compiles estimates of private final consumption expenditure, creating a gap. Proposed methods include using administrative data to allocate estimates across states and union territories. This initiative aims to improve consistency and comparability of GSDP estimates throughout India.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\nWhat is the real impact of 13x jump in cash transfers to women?\n\nThe NBFC saga - Part 2: Line drawn in 2006 is reason for the headlines today\n\nAirlines Q2 turbulence: Fewer passengers, rising fares and a crude shock\n\nBritannia\u2019s next big bet for young India lies beyond biscuits\n\nThe world is witnessing a bond rout. Why should it matter to you?\n\nQ2 earnings season: Will it settle or add to confusion in the stock market?", "source": "Economic Times Economy", "pub_date_str": "09 Oct 2026, 11:33 PM IST", "pub_date_relative": "49m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "188% up in 2026, DEE Development Engineers order book tops \u20b92500 cr mark spans power, oil & gas, heavy fabrication", "full_content": "DEE Development Engineers , a leading engineering and process piping solutions provider, today announced that its order book had crossed \u20b9 2,500 crore as of September 30, 2026, reaching \u20b9 2,531 crore.\n\nDuring the September quarter, the company secured orders worth \u20b9 225 crore, including amendments and currency fluctuations, while order execution stood at \u20b9 129.74 crore during the month.\n\nWith September's performance, the company's cumulative order inflows for FY2026\u201327 reached \u20b9 1,178.65 crore, including amendments and currency fluctuations, while cumulative order execution stood at \u20b9 591.52 crore as of September 30, 2026.\n\nThe figures reflect continued business activity across DEE's domestic and international operations, spanning process piping, heavy fabrication, gas plants, and power generation. DEE India continued to record business across its power, oil and gas, and other industrial segments, the company said in its filing.\n\nIts Thailand subsidiary remained active in the power segment, while DEE Fabricom India continued execution across heavy fabrication. The company also recorded activity through its gas plant and power generation businesses, reflecting the breadth of its operating portfolio.\n\nK. L. Bansal, Chairman and Managing Director of DEE Development Engineers Limited, said the company had invested in building a broader manufacturing platform across piping, fabrication, and seamless pipes. Its focus is now on coordinating these capabilities more efficiently, improving throughput and ensuring that every additional tonne manufactured contributes to better productivity and customer delivery.\n\nFor FY27, the company is targeting order inflows of over \u20b9 2,000 crore, core revenue of \u20b9 1,400\u20131,500 crore, and core EBITDA margins of 18\u201320%.", "source": "LiveMint Markets", "pub_date_str": "09 Oct 2026, 11:27 PM IST", "pub_date_relative": "55m ago", "cfa_topics": ["Financial Statement Analysis", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Trump appoints committee to investigate statements by the Fed's Lisa Cook", "full_content": "President Donald Trump formally established a \"committee of inquiry\" to investigate allegations that Federal Reserve Governor Lisa Cook made false statements related to \"one or more mortgage instruments,\" the White House announced Friday.\n\nThe extraordinary announcement is the latest development in Trump's long-running effort to fire Cook, a nominee of former President Joe Biden , from the central bank's board. Trump, who frequently urges the Fed to lower interest rates, recently said the failure to do so by his handpicked chair, Kevin Warsh , is the fault of a \"hostile\" board.\n\nThe committee comprises three executive branch officials, including Kevin Hassett , Trump's top economic aide and a chief defender of the administration's economic record, according to a presidential memorandum posted on the White House website and shared Friday on social media.\n\nThe other two members are Keith Sonderling, Labor secretary and acting head of the Office of Government Ethics, and Equal Employment Opportunity Commission Chair Andrea Lucas, according to the notice, which is dated Wednesday. No outside, independent arbiters are mentioned.\n\nThe highly unusual move, which hasn't been used in nearly a century, is bound to fuel new accusations that Trump and his aides are eroding the Fed's long-maintained independence while once again wielding government power against the president's enemies. Congressional Democrats quickly slammed the announcement, while Cook's lawyers expressed deep skepticism about the panel's validity.\n\nThere is no modern precedent for such a committee, though past presidents have convened similar panels.", "source": "CNBC Top News", "pub_date_str": "09 Oct 2026, 11:26 PM IST", "pub_date_relative": "56m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Elon Musk\u2019s growing SpaceX empire sends AT&T, Verizon and T-Mobile shares plunging - NBC News", "full_content": "Elon Musk\u2019s growing SpaceX empire sends AT&T, Verizon and T-Mobile shares plunging NBC News Starlink spectrum deal boosts Musk plan to beat AT&T, T-Mobile, and Verizon Ars Technica SpaceX Makes Big Play to Become a Wireless Carrier WSJ Stock Market Today: Indexes Rise, Poised for Weekly Gains; Dow Adds 400 Points; Telecom Stocks Drop as SpaceX Acquires Spectrum Investopedia ATEX, NN, GOGO Stocks Gain: SpaceX\u2019s $8B Spectrum Deal Could Boost Low-Band Spectrum Value, Says Roth Capital Yahoo Finance", "source": "Google News Business", "pub_date_str": "09 Oct 2026, 11:25 PM IST", "pub_date_relative": "57m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Rural job demand under VB-G RAM G jumps 25% in September, 15.6 million households seek work", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Agriculture \u203a Rural job demand under VB-G RAM G jumps 25% in September, 15.6 million households seek work The Economic Times daily newspaper is available online now. Read Today's Paper Rural job demand under VB-G RAM G jumps 25% in September, 15.6 million households seek work SECTIONS Rural job demand under VB-G RAM G jumps 25% in September, 15.6 million households seek work ET Bureau Last Updated: Oct 09, 2026, 11:25:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis In September, the demand for work under the VB-G RAM G scheme increased by 25.2% compared to August. Approximately 15.6 million households sought work under the program, significantly rising from 12.5 million in August. The number of people seeking employment also grew to 18.8 million from 15.4 million in August. This scheme was launched in July, providing guaranteed annual employment of 125 days.\n\nWhat is the real impact of 13x jump in cash transfers to women?\n\nThe NBFC saga - Part 2: Line drawn in 2006 is reason for the headlines today\n\nAirlines Q2 turbulence: Fewer passengers, rising fares and a crude shock\n\nBritannia\u2019s next big bet for young India lies beyond biscuits\n\nThe world is witnessing a bond rout. Why should it matter to you?\n\nQ2 earnings season: Will it settle or add to confusion in the stock market?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "09 Oct 2026, 11:25 PM IST", "pub_date_relative": "57m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Fixed Income"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Highway projects get three more months of bitumen, diesel cost escalation cover amid West Asia crisis", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Infrastructure \u203a Highway projects get three more months of bitumen, diesel cost escalation cover amid West Asia crisis The Economic Times daily newspaper is available online now. Read Today's Paper Highway projects get three more months of bitumen, diesel cost escalation cover amid West Asia crisis SECTIONS Highway projects get three more months of bitumen, diesel cost escalation cover amid West Asia crisis ET Bureau Last Updated: Oct 09, 2026, 11:23:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The ministry of road transport and highways is extending the cost compensation for bitumen and diesel. This extension will apply to projects executed until December 31, 2026. Work carried out will only qualify if the bid due date was set before April 1, 2026. The compensation aims to address the impact of rising diesel prices on highway construction.\n\nWhat is the real impact of 13x jump in cash transfers to women?\n\nThe NBFC saga - Part 2: Line drawn in 2006 is reason for the headlines today\n\nAirlines Q2 turbulence: Fewer passengers, rising fares and a crude shock\n\nBritannia\u2019s next big bet for young India lies beyond biscuits\n\nThe world is witnessing a bond rout. Why should it matter to you?\n\nQ2 earnings season: Will it settle or add to confusion in the stock market?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "09 Oct 2026, 11:23 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Fixed Income", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "US stocks rise toward the finish of a record-breaking week - AP News", "full_content": "US stocks rise toward the finish of a record-breaking week AP News Stock Market Today: S&P 500 approaches fresh record high; Dow and Nasdaq climb as tech stocks rebound MarketWatch COMMENTARY: Morning Bid: Storm brewing Reuters US stocks hit record high, shrugging off bond market turmoil | CNN Business CNN S&P 500, Nasdaq hit records \u2014 but 'the breadth of the rally has narrowed': Chart of the Day Yahoo Finance", "source": "Google News Business", "pub_date_str": "09 Oct 2026, 11:23 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Fixed Income"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Expecting to receive festive bonus 2026? Where to invest for better returns \u2014 mutual funds, gold or FDs? Experts suggest", "full_content": "With Diwali and the festive season approaching, many employees may receive a festive bonus from their employers. If you are expecting an additional \u20b9 5,000, \u20b9 10,000, or more, deciding in advance where to invest this money can help you make the most of it rather than spend it impulsively.\n\nHowever, with returns varying across asset classes in 2026, choosing the right investment option among mutual funds , gold, and fixed deposits ( FDs ) requires looking beyond recent performance. Here's what you need to know.\n\nThese tables show how equity mutual fund categories and gold ETFs /funds have performed year-to-date in 2026 and over three years.\n\n*Source: Value Research, Category Average Returns as on 8 October 2026\n\nHere are the highest FD interest rates and rates offered by select banks for one-, three-, and five-year deposits.\n\n*Source: paisabazaar, Only top 5 banks considered, FD Rates as on 7 October 2026, Actual rates can vary\n\nUttam Agarwal, Chief Business Officer at Bajaj Capital LAP, said investors with a five-year or longer investment horizon could consider mutual funds. However, those concerned about market volatility need not invest their entire bonus at once. Spread it over three to six months through an SIP or STP.\n\n\u201cFixed deposits still make sense for money you'll need soon, and with the RBI's recent repo rate hike, it's worth watching whether banks raise their rates,\u201d Agarwal added.", "source": "LiveMint Money", "pub_date_str": "09 Oct 2026, 11:10 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Fixed Income", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "The used car market is stagnant. Here's how to profit anyway", "full_content": "There's an old but useful expression used for buying cars: Kick the tires and light the fires. The phrase, which started in aviation but bled its way into automobiles, is a reminder to look under the hood and poke around before purchasing a car. The same advice would work for shares of CarMax .\n\nOn the surface, the stock looks fairly priced. CarMax is trading at roughly 17x fiscal-year expected earnings of $3.16/share. That's roughly in line with its 10-year historical forward multiple. While that valuation may not look stretched, the underlying fundamentals reflect a sharp squeeze on used-car affordability. Middle-market consumers, already pressured by high new and used car prices, see that compounded (literally) by severe financing headwinds. St. Louis Federal Reserve data puts average used auto loan APRs at 15.9% with an average loan term of 68 months. Even with used vehicle prices softening slightly, high borrowing costs keep monthly payments out of reach for many prospective buyers.\n\nOperational metrics used to evaluate a car dealership's performance show the impact. The cash conversion cycle has lengthened, inventory turnover has slowed, and average days on the lot have crept higher.\n\nBecause borrowing rates are unlikely to drop precipitously in the near term, a catalyst for an auto sales boom remains elusive. However, given the fair multiple and stable cash generation, an abrupt collapse is also not the base case.", "source": "CNBC Top News", "pub_date_str": "09 Oct 2026, 11:07 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Wall Street sees buying opportunity in banks as shares tank ahead of earnings", "full_content": "The sell-off in bank stocks ahead of earnings season is a buying opportunity rather than a warning sign for the economy.", "source": "CNBC Top News", "pub_date_str": "09 Oct 2026, 11:02 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Netflix Layoffs: 850 Jobs At Risk As Streaming Giant Plans Major Restructuring", "full_content": "Netflix had around 17,000 full-time employees at the end of 2025. A reported 5% workforce reduction could affect approximately 850 people, although the company has not confirmed the proposed cuts or identified the departments that may be affected.", "source": "NDTV Profit", "pub_date_str": "09 Oct 2026, 10:55 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "This Bengaluru Farmer Makes Rs 50,000 A Day By Growing Baby Bottle Gourds For Qatar Market", "full_content": "A farmer in Karnataka\u2019s Bengaluru Urban district grows bottle gourds weighing around 500 grams each for export, earning about Rs 50,000 from a day\u2019s harvest.", "source": "NDTV Profit", "pub_date_str": "09 Oct 2026, 10:52 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "AT&T, T-Mobile and Verizon shares tumble up to 11% as Musk\u2019s SpaceX makes Starlink mobile push", "full_content": "Shares of major US mobile service providers plunged in Friday\u2019s trading session after Elon Musk\u2019s SpaceX announced an acquisition of low-band spectrum that could help its Starlink satellite service expand into a major mobile carrier in the US.\n\nAT&T Inc. shares fell 11% to $21.96, while T-Mobile US Inc. and Verizon Communications Inc. also declined 11% each on Wall Street.\n\nSpaceX announced that the newly acquired spectrum would help it expand its satellite-to-cellular services and compete more directly with traditional wireless carriers. In a post on X on Thursday, Musk said the low-band spectrum was the last critical piece of the spectrum puzzle needed for SpaceX to provide complete phone coverage across America.\n\nThe spectrum was acquired from investment firm Grain Management LLC. It will allow SpaceX to provide cellular connectivity that can penetrate walls and deliver service to devices indoors, according to a post on the company\u2019s website. SpaceX also said the spectrum is supported by most mobile devices currently in use.\n\nThe financial terms of the agreement were not publicly disclosed by SpaceX or Grain Management. Grain had acquired the airwaves from T-Mobile earlier this year.\n\nOnce it receives approval from the Federal Communications Commission (FCC), SpaceX plans to combine its satellite-to-cell services with a terrestrial network to connect devices across the country.\n\nDuring SpaceX\u2019s debut quarterly earnings announcement in August, President Gwynne Shotwell outlined the company\u2019s plans to enter the mobile carrier business, saying that it definitely intended to build out the terrestrial component.\n\nSpaceX\u2019s Starlink Mobile satellite-to-cellular service already has access to global 2 GHz mid-band spectrum, which provides high-bandwidth capacity. The newly acquired spectrum will help its signals travel through obstacles, Reuters reported.", "source": "LiveMint Markets", "pub_date_str": "09 Oct 2026, 10:45 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Hurricane Isaias disrupts U.S. oil production in Gulf of Mexico, threatens refineries", "full_content": "Hurricane Isaias is disrupting U.S. crude oil production in the Gulf of Mexico and could limit about 2% of the country's refining capacity, at a time when fuel markets are already tight around the world.\n\nIsaias is churning toward Mississippi, Alabama and the Florida panhandle as a Category 3 storm with maximum sustained winds of 120 mph, according to the National Hurricane Center , and is expected to make landfall Friday night or early Saturday.\n\nAs of Thursday, oil companies had shut in about 1.3 million barrels per day, or roughly 63% of total U.S. production in the Gulf, according to the Bureau of Safety and Environm
