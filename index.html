e": "A massive trade just happened in surging shares of Snap", "full_content": "Don't call it a comeback yet, but shares of beleaguered social media stock Snap Inc. are up almost 20% this month and options traders are betting it's about to go on a big run. Snap shares have traded under $10 since July 2025 following a near-complete collapse from over $80 at the stock's high in 2021 to a low of $3.81 in April. But now, as excitement swirls over social media giant Meta Platforms' AI agent, traders are pouring into Snap call options on Monday, propelling trading volume to more than four times the month-long average, Cboe LiveVol data show. Almost 140,000 options on Snap traded Monday, including about 64,000 call trades that were likely initiated by buyers, compared to under 7,000 puts. Traders sold more than 12,000 puts, and just over 34,000 calls. The net trade sentiment, as well as net directional bias according to options deltas, was positive, according to Barchart.\n\nSnap, 5 years Nine out of the top 10 trades by volume were calls, and of the $5.5 million in premium exchanged, $5 million was tied to calls, SpotGamma data show. The most popular contract to buy was the 8-strike call expiring Dec. 18, which traded 26,000 times. That contract costs about 37 cents and needs Snap to rally 30% before expiry to pay off. If that happens, it would be the highest the stock's traded since February. The owner of photo-sharing and messaging app Snapchat also offers augmented-reality `Specs' glasses. Shareholder Blue Duck Capital issued an open letter to Snap's board of directors last week urging the company to raise dedicated capital to support the product, saying it could lead to a $12-$14 share price.", "source": "CNBC Top News", "pub_date_str": "13 Oct 2026, 12:13 AM IST", "pub_date_relative": "3h ago"}, {"title": "Sunny Deol Unveils First Look Of Suryaa: Ant Se Aarambh Tak, Gritty Crime Thriller Gets Release Date", "full_content": "Sunny Deol has unveiled the first look of Suryaa: Ant Se Aarambh Tak, the Hindi adaptation of Joseph. The gritty crime thriller is set to release in theatres on November 20, 2026.", "source": "NDTV Profit", "pub_date_str": "13 Oct 2026, 12:13 AM IST", "pub_date_relative": "3h ago"}, {"title": "US Stocks: Dating app Bumble shares surge 52% on talks to go private at $1 billion valuation", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a US Stocks: Dating app Bumble shares surge 52% on talks to go private at $1 billion valuation Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US Stocks: Dating app Bumble shares surge 52% on talks to go private at $1 billion valuation SECTIONS US Stocks: Dating app Bumble shares surge 52% on talks to go private at $1 billion valuation Reuters Last Updated: Oct 13, 2026, 12:23:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Bumble is reportedly in advanced negotiations for a private acquisition by Ithaca Holdings, which values the company at approximately $1 billion. This potential acquisition follows a decline in Bumble's market valuation, which was around $389 million recently. Shares of Bumble saw a significant increase, which rose nearly 52% after the acquisition discussions became public. The company is facing challenges in a competitive market, particularly with younger users disengaging.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "13 Oct 2026, 12:11 AM IST", "pub_date_relative": "3h ago"}, {"title": "Trump\u2019s \u2018energy ceasefire\u2019 collides with real-world problems of dwindling fuel supplies", "full_content": "Oil markets were struggling on Monday to gauge how President Donald Trump\u2019s new declaration of an \u201cenergy ceasefire\u201d between Russia and Ukraine might help mitigate a deepening global oil crisis as the Middle East conflict drags on.", "source": "MarketWatch Top Stories", "pub_date_str": "13 Oct 2026, 12:06 AM IST", "pub_date_relative": "3h ago"}, {"title": "Trump defends Russia diesel deal after bipartisan pushback: 'I made the right choice'", "full_content": "President Donald Trump on Monday defended last week's decision to temporarily ease restrictions on Russian diesel fuel exports after the announcement drew bipartisan criticism .\n\nTrump, in a Truth Social post , accused the media of hypocrisy for allegedly refusing to cover past purchases of Russian energy by the European Union.\n\n\"The European Union paid Russia 250 Billion Dollars for Energy, and the Fake News Media doesn't want to get near that story,\" Trump wrote.\n\nWhile the president did not specify, his figure roughly tracks with some estimates of how much the EU has spent importing fossil fuels from Russia since the 2022 invasion of Ukraine. The European Commission has launched a plan to phase out its dependence on Russian energy.\n\n\"I made the right choice for the American People \u2014 ALWAYS, AMERICA FIRST!\" Trump wrote in the social media post.\n\nLawmakers from both parties raised concerns about Trump's decision to let Russia supply some diesel to the U.S. and global markets for the next six months.\n\nThe plan received pushback from multiple congressional Republicans who have urged Trump not to lift the U.S. ban on energy imports from Russia until its president, Vladimir Putin , ends the war against Ukraine.\n\n\"The United States should not provide Putin with a financial lifeline while Russia continues to kill Ukrainian civilians,\" a group of seven senators, including four Republicans, said in a joint statement on Sunday.", "source": "CNBC Top News", "pub_date_str": "13 Oct 2026, 12:02 AM IST", "pub_date_relative": "3h ago"}, {"title": "Rep. Ilhan Omar blasts federal criminal raid on home: 'I will not be silenced'", "full_content": "Federal authorities raided the Washington, D.C., home of Rep. Ilhan Omar on Monday morning as part of a criminal investigation of the Minnesota Democrat.\n\nOmar, who has not been charged with a crime, said she was being targeted for political purposes because of her opposition to President Donald Trump .\n\nA person familiar with the situation, who spoke on condition of anonymity to discuss the nonpublic investigation, told CNBC that the probe of the 44-year-old congresswoman is complex and has been going on for years.\n\nMS NOW reported that a law enforcement source with direct knowledge of the raid \u2014 which comes weeks before November's midterm election \u2014 said the investigation into Omar is based on allegations of fraud.\n\nFox News , which first reported the raid, cited a source familiar with the probe as saying it is focused on her immigration paperwork, which was filled out by her father when she emigrated to the U.S. with him from Somalia as a child.\n\nHomeland Security Investigations, a division of the Department of Homeland Security , conducted the raid. HSI investigators were seen outside Omar's home in the Northeast quadrant of Washington throughout the morning.\n\nOmar, who is seeking reelection, has been a target of criticism by Trump for years. She heckled the president during his State of the Union address to Congress on Feb. 24, which came on the heels of aggressive immigration enforcement actions in Minneapolis by federal authorities.\n\nOmar, who is deputy chair of the Congressional Progressive Caucus, blasted the raid and the investigation in a post on X on Monday.", "source": "CNBC Top News", "pub_date_str": "12 Oct 2026, 11:59 PM IST", "pub_date_relative": "3h ago"}, {"title": "HD Fire Protect raises \u20b9213 crore from anchor investors ahead of \u20b9712-crore IPO", "full_content": "Fire protection equipment manufacturer HD Fire Protect Ltd on Monday raised \u20b9 213.11 crore from anchor investors ahead of its initial public offering (IPO), which will open for public subscription on Tuesday, October 13.\n\nAccording to a circular uploaded to the stock exchanges, the company allotted 78.64 lakh equity shares to 25 funds at \u20b9 271 apiece, the upper end of the IPO's price band.\n\nThe anchor investor round attracted participation from Bajaj Life Insurance, Axis Max Life Insurance, Allianz Global Investors Fund and several domestic mutual funds, including Kotak Mutual Fund, HDFC Mutual Fund , ICICI Prudential Mutual Fund, Aditya Birla Sun Life Mutual Fund, Mirae Asset Mutual Fund, Bandhan Mutual Fund and UTI Mutual Fund.\n\nDomestic mutual funds accounted for a significant share of the anchor book, receiving 56.52 lakh shares, or 71.88% of the total allocation.\n\nThe shares were allotted through 17 mutual fund schemes, highlighting the participation of domestic institutional investors ahead of the public offering.\n\nAnchor investors are institutional investors allotted shares before an IPO opens for subscription by other investor categories. Their participation can provide an indication of institutional interest in a public issue, although it does not guarantee listing gains or future stock performance.\n\nThe \u20b9 712-crore IPO will open for subscription on October 13 and close on October 15. The company has fixed the price band at \u20b9 258-271 per share.\n\nThe public issue comprises an offer for sale (OFS) of 2.63 crore equity shares by promoters Harish Narshi Dharamshi and Kusum Harish Dharamshi.", "source": "LiveMint Markets", "pub_date_str": "12 Oct 2026, 11:56 PM IST", "pub_date_relative": "3h ago"}, {"title": "Abhishek Porel Breaks Down After Ranji Trophy Ton, Opens Up On Alleged Rape Case", "full_content": "Abishek Porel is an Indian wicketkeeper-batter who represents Bengal in domestic cricket and plays for Delhi Capitals in the Indian Premier League (IPL).", "source": "NDTV Profit", "pub_date_str": "12 Oct 2026, 11:56 PM IST", "pub_date_relative": "3h ago"}], "cfa": [{"title": "Trump 'not happy' with Kimberly Guilfoyle, weighs firing her as ambassador to Greece", "full_content": "President Donald Trump said Monday that he is \"not happy\" with Kimberly Guilfoyle , and is considering whether to fire her as U.S. ambassador to Greece .\n\nTrump's comments at the White House after a series of critical articles in The Wall Street Journal about Guilfolye's conduct before and after she became ambassador.\n\nAsked by a reporter if he was weighing firing Guilfolye, Trump replied, \"Well, we're looking at it.\"\n\nGuilfoyle previously was engaged to Trump's eldest son, Donald Trump Jr. After the couple broke up, the president appointed the former Fox News personality as ambassador.\n\nThe Journal on Sept. 25 published an article under the headline, \"The Mystery Man Shadowing Kimberly Guilfoyle as She Pushes Deals Across Europe.\"\n\nThe story detailed Guilfoyle's push to get U.S. allies in Eastern Europe to buy billions of dollars of American natural gas.\n\nThe article said that Guilfoyle told people who were the targets of her effort that \"they should deal with a Greek construction firm called Aktor Group, a newcomer to the gas business that had teamed up with a Greek state-backed energy company to bring in liquefied natural gas from the U.S.\"\n\nThe article detailed how Guilfoyle had traveled frequently with a top lobbyist for Aktor named Christos Marafatsos, who has been \"joining her for meetings at her ambassadorial residence and with government officials in countries around the region\u2014a highly unusual move for a private citizen.\"", "source": "CNBC Top News", "pub_date_str": "13 Oct 2026, 03:13 AM IST", "pub_date_relative": "4m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Nvidia and AMD shares fall as new AI announcements fail to re-energize investors", "full_content": "The chip makers introduced hardware and software designs for future AI data centers, but the revenue potential is still far out, an analyst says.", "source": "MarketWatch Top Stories", "pub_date_str": "13 Oct 2026, 02:49 AM IST", "pub_date_relative": "28m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "S&P Dow Jones Indices launches joint index with HKEX", "full_content": "", "source": "Investing.com News", "pub_date_str": "13 Oct 2026, 02:48 AM IST", "pub_date_relative": "28m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Dating app Bumble in advanced talks to go private at $1 billion valuation, source says", "full_content": "", "source": "Investing.com News", "pub_date_str": "13 Oct 2026, 02:36 AM IST", "pub_date_relative": "41m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Exclusive-Moonshot execs in talks to settle dispute with shareholder ahead of planned IPO, people say", "full_content": "", "source": "Investing.com News", "pub_date_str": "13 Oct 2026, 02:30 AM IST", "pub_date_relative": "47m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Microsoft hits a big milestone that solidifies its revival", "full_content": "Microsoft has reclaimed a $4 trillion market cap on Monday \u2014 and fresh records are in sight.", "source": "MarketWatch Top Stories", "pub_date_str": "13 Oct 2026, 02:10 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Nasdaq falls ahead of earnings, economic data while oil rallies - Reuters", "full_content": "Nasdaq falls ahead of earnings, economic data while oil rallies Reuters S&P 500 closes near flat, pressured by higher oil prices and memory chip stock losses CNBC U.S. Markets Ended Monday Mixed As Fair Isaac Led, Cerebras Systems Lagged Barron's US stocks hover near their latest record in mixed trading on Wall Street AP News Update: Equities Mixed at Close Ahead of Big Bank Earnings Yahoo Finance", "source": "Google News Business", "pub_date_str": "13 Oct 2026, 02:08 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Earnings beats are now the norm. What the stock market needs to keep rallying", "full_content": "Will 30% profit growth and upbeat tech guidance be enough to keep the rally going? We'll soon find out.\n\nThird-quarter earnings season kicks into gear Tuesday with JPMorgan Chase and other big banks. Expectations are steep: consensus forecasts call for nearly 30% year-over-year growth, according to FactSet. That's up from around 27% three months ago. But 30% or more should be doable \u2014 S&P 500 profits have topped quarterly estimates by healthy margins since mid-2023.\n\nTech will have to do its part at beating estimates and lifting guidance. For now, the sector shows no signs of slowing. Analysts expect 65% gains for tech profits, up from an estimated 57% growth three months ago. Upward revisions for Nvidia , Micron Technology and Dell Technologies are doing the heavy lifting, according to FactSet.\n\nAlso positive, profit growth is broadening beyond the Mag 7. The other 493 stocks in the S&P 500 are forecast to deliver 27% year-over-year gains, topping the Mag-7 average, according to Russell Investments . S&P 400 MidCap operating earnings should rise 19% in 2026, notes Ed Yardeni, head of Yardeni Research.\n\nThe first earnings test comes with the big banks. JPMorgan, Goldman Sachs , Citigroup , and Wells Fargo , reporting Tuesday, should reveal how steeper interest rates are impacting loan growth, balance sheets, M&A activity and the IPO pipeline. JPMorgan \u2014 the largest U.S. bank \u2014 will be critical, along with comments from CEO Jamie Dimon who tends to move markets with his outlook.\n\nFinancials are on a knife's edge; the sector is hovering around its 200-day moving average, a key technical indicator, after falling 5% since August 31. Analysts see rising interest rates starting to sting loan growth and fixed-income securities held on balance sheets.\n\nThe weakness could make for a relief rally, but earnings and guidance could go either way, pushing the stocks up or down, notes Julian Emanuel, senior managing director at Evercore ISI.", "source": "CNBC Top News", "pub_date_str": "13 Oct 2026, 02:05 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "France to raise stake in struggling miner Eramet", "full_content": "Paris set to become top shareholder as states race to secure critical mineral supplies", "source": "FT Markets", "pub_date_str": "13 Oct 2026, 02:04 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Why SpaceX\u2019s Spectrum Purchase Is Good for AST SpaceMobile Stock - Barron's", "full_content": "Why SpaceX\u2019s Spectrum Purchase Is Good for AST SpaceMobile Stock Barron's AST SpaceMobile Shipped 3 More BlueBird Satellites to Cape Canaveral. Here's How Many It Needs in Orbit Before Revenue Shows Up. Yahoo Finance AST SpaceMobile upgraded to buy at Deutsche Bank as selloff called misread Investing.com AST SpaceMobile: Story Collapses Before Even Starting (NASDAQ:ASTS) Seeking Alpha AST SpaceMobile Rallies 4% as Next BlueBird Satellites Reach Cape Canaveral; Rocket Lab and Intuitive Machines Hold Flat 24/7 Wall St.", "source": "Google News Business", "pub_date_str": "13 Oct 2026, 01:53 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Goldman Sachs, Morgan Stanley have earnings momentum and are reporting this week. There are others", "full_content": "Big banks are among the companies whose estimates have been rising and that are reporting results this week.", "source": "CNBC Top News", "pub_date_str": "13 Oct 2026, 01:49 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Oil Prices Rebound Amid Persistent Middle East Supply Risks - WSJ", "full_content": "Oil Prices Rebound Amid Persistent Middle East Supply Risks WSJ Brent tops $106 after deadly Saudi airport attack, Ukraine says Russia violated energy ceasefire CNBC Oil prices spike after Houthi attacks on Saudi airports The Hill If the Strait of Hormuz is open, why are gas and diesel so expensive? CNN Oil Futures Extend Gains on Persistent Supply Concerns WSJ", "source": "Google News Business", "pub_date_str": "13 Oct 2026, 01:45 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Bessent doubles down on bond fix as mortgage rates near 7.5% - TheStreet", "full_content": "Bessent doubles down on bond fix as mortgage rates near 7.5% TheStreet Scott Bessent responds to Elizabeth Warren letter requesting information on rise in the 10-year treasury yield Fox Business Bessent Berates Warren in Caustic Letter, Accuses Top Democrat and Staff of Financial Illiteracy The New York Sun Bessent Pressed by Warren on \u2018Chaotic\u2019 Treasuries Buybacks Bloomberg.com Bessent roasts Warren in scathing letter but skips her 5 questions on borrowing costs as yields sit near a 24-year high Yahoo Finance", "source": "Google News Business", "pub_date_str": "13 Oct 2026, 01:44 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "US stocks: Nasdaq ends lower as oil prices surge ahead of earnings, economic data", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a US stocks: Nasdaq ends lower as oil prices surge ahead of earnings, economic data Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US stocks: Nasdaq ends lower as oil prices surge ahead of earnings, economic data SECTIONS US stocks: Nasdaq ends lower as oil prices surge ahead of earnings, economic data Reuters Last Updated: Oct 13, 2026, 01:39:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Nasdaq composite index faced a downturn as oil prices surged following attacks on a Saudi airport. With major banks set to release their earnings reports, investor focus sharpens this week. The S&P 500 and Dow Jones saw mixed performances, while the energy sector thrived. Heightened inflation concerns due to rising oil costs have begun to sway investor confidence, mirroring a cautious market atmosphere tied to earnings and economic uncertainties.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "13 Oct 2026, 01:39 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Here's what personal loan lenders look for when you apply", "full_content": "If you're thinking about taking out a personal loan , it helps to know what lenders look for when reviewing your application.\n\nRequirements vary by lender, but factors like your credit score , income and existing debt can all play a role in whether you're approved. Here's what to know before you apply.\n\nLenders use your credit score and credit history to assess how likely you are to repay a loan. Generally, a higher credit score can make it easier to qualify for a personal loan and secure a lower interest rate.\n\nA FICO \u00ae Score of 580 to 669 is considered \u201cFair,\u201d but minimum credit score requirements vary by lender. For example, Upstart doesn't require a minimum credit score in most states , instead considering factors like income and employment history when evaluating applications. Still, borrowers with lower credit scores may face higher interest rates if approved.\n\nUpstart considers applicants with FICO Scores of 300 (the lowest possible) and those with insufficient credit history.\n\nWe like that Upstart considers factors besides credit score, including education, income and employment history. However, co-signers aren't accepted.\n\nIf your credit score could use some work, consider improving it before applying. Factors that affect your FICO Score include payment history, amounts owed, length of credit history, credit mix and new credit. Making payments on time, paying down credit card balances and keeping older accounts open when practical may help strengthen your credit profile over time.\n\nLenders want to make sure you have enough income to repay the loan. To verify your income, they may ask for documents like recent pay stubs, bank statements or tax returns.", "source": "CNBC Top News", "pub_date_str": "13 Oct 2026, 01:34 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Centre & states to draft rules for existing arrest cases under GST", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a Centre & states to draft rules for existing arrest cases under GST The Economic Times daily newspaper is available online now. Read Today's Paper Centre & states to draft rules for existing arrest cases under GST SECTIONS Centre & states to draft rules for existing arrest cases under GST ET Bureau Last Updated: Oct 13, 2026, 01:27:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Centre will collaborate with states to create standard procedures for handling arrest cases. Starting April 1, 2027, an invoice management system will be mandatory, minimizing human errors during digital matching. A quarterly review of GST refund risk assessment will also be implemented to maintain consistency across jurisdictions. The proposed changes aim to decriminalize several GST offences and decrease litigation for businesses.\n\nGST Council reforms address key industry concerns, focus shifts to implementation, says Dept of Revenue official\n\nGST reforms: What changes in compliance, input tax credit, refunds and litigation from 2027\n\nCurbing rupee bets: What the RBI\u2019s new rules mean for the hedge-now-or-wait question\n\nBrinjal, buffalo, bacteria: Inside India\u2019s pay-for-nature system\n\nHomebuyers wait as NCLT panel picks holes in unfinished Jaypee projects\n\nThe NBFC saga - Part 3: How one default in 2018 changed the way RBI reads risk\n\nFour rules made HDFC Bank a compounder. All four have stopped. Can the new CEO rewrite them?", "source": "Economic Times Economy", "pub_date_str": "13 Oct 2026, 01:27 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "IonQ to acquire cybersecurity firm Elisity in an all-stock deal for up to $1.3 billion", "full_content": "Quantum computing platform IonQ said on Monday it will acquire cybersecurity company Elisity in an all-stock deal worth up to $1.3 billion, including up to $150 million in performance-based earnouts.\n\nThe move is designed to defend against and uncover attackers targeting generative artificial intelligence large-language models and AI agents, and to protect against emerging quantum threats, the companies said in a press release .\n\nCEO Niccolo de Masi told CNBC's Morgan Brennan on Monday that the addition of Elisity's platform will help bolster his company's quantum security strategy.\n\n\"This means that we can protect not only critical infrastructure \u2014 we believe better than anyone in the world \u2014 but of course the Fortune 500,\" de Masi said.\n\nThe all-stock deal is expected to close in the fourth quarter, subject to regulatory approval, and would expand the quantum-computing company's cybersecurity portfolio.\n\nIonQ shares fell more than 9% in afternoon trading. Other quantum computing stocks, including Rigetti Computing and D-Wave Quantum , also traded lower.\n\nElisity will retain its current leadership, including CEO James Winebrenner.\n\nIonQ's stock has surged in recent months amid a buying spree. Most recently, the company bought semiconductor maker SkyWater Technology for $1.8 billion in July. In the past year and a half, IonQ has acquired several quantum companies, most notably U.K.-based quantum computing startup Oxford Ionics .", "source": "CNBC World Economy", "pub_date_str": "13 Oct 2026, 01:05 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Alternative Investments", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Oil rallies, sending dollar higher on expectations of higher US rates", "full_content": "NEW YORK/MILAN, - Oil prices climbed on Monday as attacks on Saudi Arabia overshadowed hopes for supply improvements, and expectations for higher US interest rates to fight inflation drove the dollar higher on a narrowly mixed day for global stocks.\n\nThe action came after US President Donald Trump hailed fresh Russian diesel exports and a Russia-Ukraine energy ceasefire.\n\nThe dollar's rise in recent months has been driven in large part by expectations that high prices for energy and other goods will force the Federal Reserve to raise interest rates at a time when US growth is stronger than in other rich economies. This could expand the rate differentials that drive currency movements.\n\nWhile the US bond market was closed for the Columbus Day holiday, investors were cautiously waiting for September inflation data and the third-quarter earnings season, which begins on Tuesday with earnings from major US banks.\n\n\"There's a lot to be wary of,\" said Robert Pavlik, senior portfolio manager at Dakota Wealth Management. \"You're walking down a train line and you don't know, because it's dark, if a train is coming and so, you know, you're just being real careful right today.\"\n\nBesides the wait for earnings and economic data, Pavlik noted that stocks were also \"being kept in check because of higher oil\" and a lack of direction from the bond market, which tends to influence stocks and other assets.\n\nUS Treasury yields hit 24-year highs this month as high energy costs fueled concerns that inflation could stay elevated, keeping policymakers hawkish and pressuring equity valuations.\n\nOn Wall Street on Monday afternoon, the Dow Jones Industrial Average was up 0.3%, the S&P 500 was off 0.2% and the Nasdaq Composite was down 0.5%.", "source": "LiveMint Markets", "pub_date_str": "13 Oct 2026, 01:01 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "India draws $351 billion in greenfield FDI, outpaces China", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Finance \u203a India draws $351 billion in greenfield FDI, outpaces China The Economic Times daily newspaper is available online now. Read Today's Paper India draws $351 billion in greenfield FDI, outpaces China SECTIONS India draws $351 billion in greenfield FDI, outpaces China By Sharmistha Mukherjee , ET Bureau Last Updated: Oct 13, 2026, 01:15:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Speaking to ET, Nikolaus Lang, managing director & senior partner at BCG highlighted the Indian market as the biggest draw for investors amid a sweeping global realignment. He, however, stressed on sustained focus on infrastructure development, skilling and cost competitiveness for India to further enhance its manufacturing footprint on a global scale.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\nCurbing rupee bets: What the RBI\u2019s new rules mean for the hedge-now-or-wait question\n\nBrinjal, buffalo, bacteria: Inside India\u2019s pay-for-nature system\n\nHomebuyers wait as NCLT panel picks holes in unfinished Jaypee projects\n\nThe NBFC saga - Part 3: How one default in 2018 changed the way RBI reads risk\n\nFour rules made HDFC Bank a compounder. All four have stopped. Can the new CEO rewrite them?\n\nWhat is the real impact of 13x jump in cash transfers to women?", "source": "Economic Times Economy", "pub_date_str": "13 Oct 2026, 12:58 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Demand for Crude Oil May Have Peaked Last Year, FGE Says", "full_content": "(Bloomberg) -- Demand for crude oil may have peaked in 2025, partly as higher need for fuels is increasingly met by biofuels, according to FGE NexantECA.\n\n\u201cThe world will keep consuming more liquids, but not necessarily more crude,\u201d Chairman Emeritus Fereidun Fesharaki and analyst Cuneyt Kazokoglu said in a report. Demand is increasingly being met by biofuels and hydrocarbons derived from processing natural gas, such as ethane.\n\nFGE NexantECA sees some oil demand lost after this year\u2019s Hormuz crisis disrupted flows through the key Middle East chokepoint. It notes the crisis came about six years after Covid, echoing the gap between the 1973 and 1979 oil shocks that led to lasting demand destruction in power generation.\n\nThis time around, road transport \u2014 which accounts for about 45% of global oil demand \u2014 is at the center of substitution, with electric vehicles eroding gasoline demand and beginning to hit diesel consumption.\n\nDemand in biofuels and natural gas liquids combined has grown faster than crude from 2019 to 2025, according to FGE NexantECA. All US oil demand growth since 2010 has come from ethane. Biofuels made up 10% of oil demand growth in the last decade and its role will increase as uptake by airlines and ships expand.\n\n\u201cJust like the 1970s, two big crises six years apart have shocked the oil market in the last decade,\u201d Fesharaki and Kazokoglu wrote. The trend \u201ccreates a growing challenge for refiners, upstream investment and OPEC policy.\u201d\n\nCatch all the Business News , Market News , Breaking News Events and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.\n\nLog in to our website to save your bookmarks. It'll just take a moment.", "source": "LiveMint Markets", "pub_date_str": "13 Oct 2026, 12:45 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Katie Stockton says retail stocks could be primed for a counter-trend rally. These stocks may lead the bounce", "full_content": "Retail stocks are stabilizing following their recent correction.", "source": "CNBC Top News", "pub_date_str": "13 Oct 2026, 12:39 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Pickleball facility franchisor files for bankruptcy as founder acknowledges business mistake: 'I own it' - Fox Business", "full_content": "Pickleball facility franchisor files for bankruptcy as founder acknowledges business mistake: 'I own it' Fox Business Why Pickleball Clubs Are Closing: The Real, Brutal Math The Dink Pickleball The Picklr files for bankruptcy, plans reorganization Sports Business Journal The Picklr CEO Says \u2018That\u2019s on Us\u2019 After Fast-Growing Pickleball Chain Files for Bankruptcy Inc.com Indoor Pickleball Chain, The Picklr, Files for Bankruptcy as Rapid Growth Meets Costly Lease Obligations Holly Springs Update", "source": "Google News Business", "pub_date_str": "13 Oct 2026, 12:36 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Assocham seeks review of bidders' qualificationfor transmission units", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a Assocham seeks review of bidders' qualificationfor transmission units The Economic Times daily newspaper is available online now. Read Today's Paper Assocham seeks review of bidders' qualificationfor transmission units SECTIONS Assocham seeks review of bidders' qualificationfor transmission units By Shilpa Samant , ET Bureau Last Updated: Oct 13, 2026, 12:34:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Assocham has suggested that the ministry improve technical qualification requirements for companies involved in transmission projects. This proposal aims to ensure that only experienced developers participate in the bidding process. The current framework allows companies to qualify based on broad infrastructure experience, which may delay project execution. The association recommends that qualifications be tailored to project value, voltage class, and complexity.\n\nCurbing rupee bets: What the RBI\u2019s new rules mean for the hedge-now-or-wait question\n\nBrinjal, buffalo, bacteria: Inside India\u2019s pay-for-nature system\n\nHomebuyers wait as NCLT panel picks holes in unfinished Jaypee projects\n\nThe NBFC saga - Part 3: How one default in 2018 changed the way RBI reads risk\n\nFour rules made HDFC Bank a compounder. All four have stopped. Can the new CEO rewrite them?\n\nWhat is the real impact of 13x jump in cash transfers to women?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "13 Oct 2026, 12:34 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Getty Images to File for Bankruptcy, Go Private In Restructuring Deal - The Hollywood Reporter", "full_content": "Getty Images to File for Bankruptcy, Go Private In Restructuring Deal The Hollywood Reporter Getty Images plans bankruptcy filing, to go private Reuters Getty Images to File for Bankruptcy, Go Private Via Koch Deal WSJ Koch, Getty Families Team Up to Take Getty Images Private in Bankruptcy Deal Bloomberg.com The Getty Family and Koch Equity Development Commit to Equity Investment of up to $533 Million in Getty Images, Reflecting Confidence in Long-Term Growth Potential Getty Images Newsroom", "source": "Google News Business", "pub_date_str": "13 Oct 2026, 12:30 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Dividend, rights issue record date: Last chance to buy today to qualify for amount- Vedanta, TCS, Continental Controls", "full_content": "Dividends, rights issue record date: Shares of Vedanta Limited, Tata Consultancy Services , Continental Controls will remain in focus during Tuesday\u2019s trading session due to their corporate actions record dates. These three firms have announced dividends and rights issue.\n\nAll these three firms have fixed Wednesday, October 14, as the record date to determine eligibility of shareholders for dividend and rights issue. Additionally, Energy Infrastructure Trust has fixed Wednesday as record date for income distribution.\n\nAs the Indian stock market follows T+1 settlement cycle, investors must own a stock before record date to qualify for any corporate action. Hence, Tuesday, October 13, effectively becomes the last day for investors to buy these stocks and qualify for the payout.\n\nVedanta has announced an interim dividend of \u20b9 5 per equity share with a face value of Re 1 each. The company\u2019s dividend amounted to \u20b9 1,955 crore.\n\n\u201cWe wish to inform you that the Board of Directors of Vedanta Limited (the \u201cCompany\u201d), have, today i.e. October 08, 2026, approved the First Interim Dividend 2026-27 of \u20b9 5/- per equity share on face value of \u20b9 1/- per equity share for the Financial Year 2026-27 amounting to c. \u20b9 1,955 Crores,\u201d the company stated in its BSE filing. The company has fixed Wednesday, October 14, as the record date. Vedanta share price has fixed 0.47% higher at \u20b9 264.75 per share.\n\nThe IT services heavyweight has announced an interim dividend of \u20b9 12 per equity share with a face value of Re 1 each. The declared dividend will be paid to eligible shareholders on Friday, October 30, 2026.\n\n\u201cThe second interim dividend shall be paid on Friday, October 30, 2026, to the equity shareholders of the Company, whose names appear on the Register of Members or in the records of the Depositories as beneficial owners of the shares as on Wednesday, October 14, 2026, which is the Record Date fixed for this purpose,\u201d stated the firm in its BSE filing.", "source": "LiveMint Markets", "pub_date_str": "13 Oct 2026, 12:30 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Alternative Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Why IonQ Is Betting Big on Quantum Cybersecurity With $1.3 Billion Elisity Acquisition - Barron's", "full_content": "Why IonQ Is Betting Big on Quantum Cybersecurity With $1.3 Billion Elisity Acquisition Barron's IonQ to acquire cybersecurity firm Elisity in an all-stock deal for up to $1.3 billion CNBC IonQ to Acquire Elisity for $1.3B to Advance Quantum Security IonQ Exclusive | Quantum-Computing Company IonQ to Buy Cybersecurity Firm for Up to $1.3 Billion WSJ Why IonQ Stock Fell 10% Today The Motley Fool", "source": "Google News Business", "pub_date_str": "13 Oct 2026, 12:14 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "A massive trade just happened in surging shares of Snap", "full_content": "Don't call it a comeback yet, but shares of beleaguered social media stock Snap Inc. are up almost 20% this month and options traders are betting it's about to go on a big run. Snap shares have traded under $10 since July 2025 following a near-complete collapse from over $80 at the stock's high in 2021 to a low of $3.81 in April. But now, as excitement swirls over social media giant Meta Platforms' AI agent, traders are pouring into Snap call options on Monday, propelling trading volume to more than four times the month-long average, Cboe LiveVol data show. Almost 140,000 options on Snap traded Monday, including about 64,000 call trades that were likely initiated by buyers, compared to under 7,000 puts. Traders sold more than 12,000 puts, and just over 34,000 calls. The net trade sentiment, as well as net directional bias according to options deltas, was positive, according to Barchart.\n\nSnap, 5 years Nine out of the top 10 trades by volume were calls, and of the $5.5 million in premium exchanged, $5 million was tied to calls, SpotGamma data show. The most popular contract to buy was the 8-strike call expiring Dec. 18, which traded 26,000 times. That contract costs about 37 cents and needs Snap to rally 30% before expiry to pay off. If that happens, it would be the highest the stock's traded since February. The owner of photo-sharing and messaging app Snapchat also offers augmented-reality `Specs' glasses. Shareholder Blue Duck Capital issued an open letter to Snap's board of directors last week urging the company to raise dedicated capital to support the product, saying it could lead to a $12-$14 share price.", "source": "CNBC Top News", "pub_date_str": "13 Oct 2026, 12:13 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Derivatives"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "US Stocks: Dating app Bumble shares surge 52% on talks to go private at $1 billion valuation", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a US Stocks: Dating app Bumble shares surge 52% on talks to go private at $1 billion valuation Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US Stocks: Dating app Bumble shares surge 52% on talks to go private at $1 billion valuation SECTIONS US Stocks: Dating app Bumble shares surge 52% on talks to go private at $1 billion valuation Reuters Last Updated: Oct 13, 2026, 12:23:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Bumble is reportedly in advanced negotiations for a private acquisition by Ithaca Holdings, which values the company at approximately $1 billion. This potential acquisition follows a decline in Bumble's market valuation, which was around $389 million recently. Shares of Bumble saw a significant increase, which rose nearly 52% after the acquisition discussions became public. The company is facing challenges in a competitive market, particularly with younger users disengaging.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "13 Oct 2026, 12:11 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Trump defends Russia diesel deal after bipartisan pushback: 'I made the right choice'", "full_content": "President Donald Trump on Monday defended last week's decision to temporarily ease restrictions on Russian diesel fuel exports after the announcement drew bipartisan criticism .\n\nTrump, in a Truth Social post , accused the media of hypocrisy for allegedly refusing to cover past purchases of Russian energy by the European Union.\n\n\"The European Union paid Russia 250 Billion Dollars for Energy, and the Fake News Media doesn't want to get near that story,\" Trump wrote.\n\nWhile the president did not specify, his figure roughly tracks with some estimates of how much the EU has spent importing fossil fuels from Russia since the 2022 invasion of Ukraine. The European Commission has launched a plan to phase out its dependence on Russian energy.\n\n\"I made the right choice for the American People \u2014 ALWAYS, AMERICA FIRST!\" Trump wrote in the social media post.\n\nLawmakers from both parties raised concerns about Trump's decision to let Russia supply some diesel to the U.S. and global markets for the next six months.\n\nThe plan received pushback from multiple congressional Republicans who have urged Trump not to lift the U.S. ban on energy imports from Russia until its president, Vladimir Putin , ends the war against Ukraine.\n\n\"The United States should not provide Putin with a financial lifeline while Russia continues to kill Ukrainian civilians,\" a group of seven senators, including four Republicans, said in a joint statement on Sunday.", "source": "CNBC Top News", "pub_date_str": "13 Oct 2026, 12:02 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Rep. Ilhan Omar blasts federal criminal raid on home: 'I will not be silenced'", "full_content": "Federal authorities raided the Washington, D.C., home of Rep. Ilhan Omar on Monday morning as part of a criminal investigation of the Minnesota Democrat.\n\nOmar, who has not been charged with a crime, said she was being targeted for political purposes because of her opposition to President Donald Trump .\n\nA person familiar with the situation, who spoke on condition of anonymity to discuss the nonpublic investigation, told CNBC that the probe of the 44-year-old congresswoman is complex and has been going on for years.\n\nMS NOW reported that a law enforcement source with direct knowledge of the raid \u2014 which comes weeks before November's midterm election \u2014 said the investigation into Omar is based on allegations of fraud.\n\nFox News , which first reported the raid, cited a source familiar with the probe as saying it is focused on her immigration paperwork, which was filled out by her father when she emigrated to the U.S. with him from Somalia as a child.\n\nHomeland Security Investigations, a division of the Department of Homeland Security , conducted the raid. HSI investigators were seen outside Omar's home in the Northeast quadrant of Washington throughout the morning.\n\nOmar, who is seeking reelection, has been a target of criticism by Trump for years. She heckled the president during his State of the Union address to Congress on Feb. 24, which came on the heels of aggressive immigration enforcement actions in Minneapolis by federal authorities.\n\nOmar, who is deputy chair of the Congressional Progressive Caucus, blasted the raid and the investigation in a post on X on Monday.", "source": "CNBC Top News", "pub_date_str": "12 Oct 2026, 11:59 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "HD Fire Protect raises \u20b9213 crore from anchor investors ahead of \u20b9712-crore IPO", "full_content": "Fire protection equipment manufacturer HD Fire Protect Ltd on Monday raised \u20b9 213.11 crore from anchor investors ahead of its initial public offering (IPO), which will open for public subscription on Tuesday, October 13.\n\nAccording to a circular uploaded to the stock exchanges, the company allotted 78.64 lakh equity shares to 25 funds at \u20b9 271 apiece, the upper end of the IPO's price band.\n\nThe anchor investor round attracted participation from Bajaj Life Insurance, Axis Max Life Insurance, Allianz Global Investors Fund and several domestic mutual funds, including Kotak Mutual Fund, HDFC Mutual Fund , ICICI Prudential Mutual Fund, Aditya Birla Sun Life Mutual Fund, Mirae Asset Mutual Fund, Bandhan Mutual Fund and UTI Mutual Fund.\n\nDomestic mutual funds accounted for a significant share of the anchor book, receiving 56.52 lakh shares, or 71.88% of the total allocation.\n\nThe shares were allotted through 17 mutual fund schemes, highlighting the participation of domestic institutional investors ahead of the public offering.\n\nAnchor investors are institutional investors allotted shares before an IPO opens for subscription by other investor categories. Their participation can provide an indication of institutional interest in a public issue, although it does not guarantee listing gains or future stock performance.\n\nThe \u20b9 712-crore IPO will open for subscription on October 13 and close on October 15. The company has fixed the price band at \u20b9 258-271 per share.\n\nThe public issue comprises an offer for sale (OFS) of 2.63 crore equity shares by promoters Harish Narshi Dharamshi and Kusum Harish Dharamshi.", "source": "LiveMint Markets", "pub_date_str": "12 Oct 2026, 11:56 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Corporate Issuers", "Portfolio Management"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Gold Futures Settle Lower on Rising Dollar, Oil - WSJ", "full_content": "Gold Futures Settle Lower on Rising Dollar, Oil WSJ Gold eases on strong dollar, oil prices; US inflation data eyed Reuters Gold Edges Up as Traders Weigh Russia-Ukraine \u2018Energy Ceasefire\u2019 Bloomberg.com Wall Street nears bullish majority after gold\u2019s late-week rally, Main Street fails to reclaim bullish bias as inflation data take center stage Kitco Current price of gold as of October 9, 2026 Fortune", "source": "Google News Business", "pub_date_str": "12 Oct 2026, 11:56 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics", "Derivatives", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "EV owners alert! Insurance claims for repairs may cost more than for petrol, diesel cars \u2014 here's how", "full_content": "Insurance claims for repairing electric vehicles cost owners 14% more on average than for comparable petrol and diesel four-wheelers, according to the latest data released by insurance marketplace Policybazaar .\n\nThe average claim cost for an electric car stood at \u20b9 41,543, compared with \u20b9 36,185 for an internal combustion engine (ICE) car. The comparison covers vehicles priced between \u20b9 10 lakh and \u20b9 15 lakh in their first three years of ownership, excluding large-loss claims.\n\nEV insurance claims have become pricier during the monsoon due to the impact of flooding, waterlogging and adverse weather. Average claim severity rose to nearly \u20b9 65,000 during this period, 25% higher than the \u20b9 52,000 average recorded during the rest of the year, as per the data.\n\nThe higher claim severity for electric cars is due to costlier battery systems, complex electronics, imported components and limited EV repair infrastructure, that make repairs and replacement more expensive.\n\nPolicybazaar data shows that battery is among the most expensive components of an electric car. Depending on the model, replacing it can cost as much as 40-50% of the vehicle's total price.\n\nHowever, repair costs extend beyond the battery and motor. Components such as battery cooling systems, advanced electronics and infotainment systems can also be expensive to replace.\n\nThis can leave EV owners exposed to major expenses if their insurance policy does not provide adequate coverage. A comprehensive motor insurance policy generally covers accidental damage to the insured vehicle, subject to its terms and conditions. However, coverage for battery-related damage varies depending on the policy and the add-ons chosen by the owner.\n\nAround 80% of EV owners opt for at least two key add-ons, including battery protection, zero depreciation, roadside assistance (RSA) and consumables cover. This is higher than the corresponding share of 75% among petrol car owners and 77% for diesel car owners.", "source": "LiveMint Money", "pub_date_str": "12 Oct 2026, 11:51 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Sandisk stock is this bull market's emergent star - Yahoo Finance", "full_content": "Sandisk stock is this bull market's emergent star Yahoo Finance Sandisk: 12% Cash Return, With Earnings Up Next (NASDAQ:SNDK) Seeking Alpha Sandisk Stock Is Falling Monday: What's Going On? Benzinga SanDisk Drops 6% in Memory Selloff on China\u2019s DRAM Progress; Seagate Slides 4% 24/7 Wall St. SanDisk's Boom Still Depends on Pricing TradingView", "source": "Google News Business", "pub_date_str": "12 Oct 2026, 11:51 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "The bull market turned 4 years old on Monday. Investors say reaching a fifth birthday could be challenging", "full_content": "Monday marks the fourth anniversary of the current bull market, with the S&P 500 having climbed nearly 120% since its closing low on Oct. 12, 2022 \u2014 an extraordinary run that reflects Wall Street's faith in the transformative power of artificial intelligence.\n\nSince the release of ChatGPT in late 2022 , investors have hungered for all things related to the AI trade, with the stocks most tied to the build-out \u2014 the so-called \"picks and shovels\" \u2014 flying to whole new stratospheres because of the technology.\n\nNvidia , the poster child for the revolution that was formerly best known for the graphics cards it built for high-end video games, is now a roughly $5.5 trillion company; it passed the $1 trillion market cap for the first time in 2023. Micron Technology , another beneficiary, passed the $1 trillion market cap for the first time this May .\n\nThose moves have helped the stock market climb a wall of worry in the intervening years, including in 2026. The S&P 500 just last week topped 7,800 for the first time, and remains near records, thanks in large part to its heavy allocation toward tech. About 40% of the broader index is in tech stocks.\n\nAfter such an extraordinary run, investors wonder how much longer the rally can continue, especially as they face ongoing fears around higher inflation, surging bond yields and a more hawkish Federal Reserve .\n\nAccording to Oppenheimer's Ari Wald, the current bull market is the sixth longest of 24 going back to 1932. In observing the data, the chart analyst wrote that the median time remaining before a cycle reached its peak was 13 months, which suggests 2027 could be the final leg of the run.\n\nTo be sure, Wald added that the median fifth year return was still 21%, suggesting there are further gains to be had for investors before any peak.\n\nHow much longer the current cycle can continue may depend on market breadth, which has deteriorated.", "source": "CNBC Finance", "pub_date_str": "12 Oct 2026, 11:48 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Lord's Mark Industries Acquires Radio Electric Private Limited, Combining Engineering Heritage With New Growth Opportunities", "full_content": "Following the acquisition, Lord's Mark Industries Limited plans to build on Radio Electric Private Limited's established strengths through a more structured domestic and international growth strategy.", "source": "NDTV Profit", "pub_date_str": "12 Oct 2026, 11:45 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Polycab To Exit F&O As NSE Sets Dec. 30 Deadline; NCLAT Puts Insolvency Order On Hold", "full_content": "The National Stock Exchange will discontinue futures and options contracts on Polycab India from December 30, 2026. Existing October, November and December contracts will remain available for trading until their respective expiry dates.", "source": "NDTV Profit", "pub_date_str": "12 Oct 2026, 11:32 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Derivatives"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "US bank stocks near correction as earnings loom, consumer outlook in focus", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a US bank stocks near correction as earnings loom, consumer outlook in focus Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US bank stocks near correction as earnings loom, consumer outlook in focus SECTIONS US bank stocks near correction as earnings loom     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
