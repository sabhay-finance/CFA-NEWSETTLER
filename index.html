BS Global Wealth Management, said in a note on Thursday that his team remained \"positioned for further equity gains while preparing for near-term volatility.\"", "source": "CNBC Top News", "pub_date_str": "17 Sep 2026, 07:03 PM IST", "pub_date_relative": "2m ago"}, {"title": "US single-family housing starts rebound in August; building permits fall", "full_content": "Skip to navigation Skip to main content Skip to right column US single-family housing starts rebound in August; building permits fall Reuters Thu, September 17, 2026 at 6:19 AM PDT 2 min read WASHINGTON, Sept 17 (Reuters) - US single-family homebuilding increased in August, but a drop in permits for future construction suggested the improvement was likely temporary as rising inflation \u200cbecause of the war in the Middle East boosts mortgage rates.\n\nSingle-family housing starts, \u200cwhich account for the bulk of homebuilding, jumped 7.6% to a seasonally adjusted annual rate of 918,000 units last \u200bmonth, the Commerce Department's Census Bureau said on Thursday. They rose 5.2% on a year-over-year basis in August.\n\nSingle-family building permits fell 1.8% to a rate of 878,000 units in August. They increased 1.3% on a year-over-year basis.\n\nMortgage rates have surged, tracking longer-term US Treasury yields as the US-Israeli war \u200cwith Iran drove oil prices above $100 \u2060a barrel. Bond yields have also risen amid uncertainty over the Federal Reserve's response to inflation and a ballooning national debt. The yield on \u2060the benchmark 10-year Treasury note is hovering around 5.0%.\n\nThe US central bank on Wednesday raised interest rates for the first time since 2023 and flagged further increases in borrowing costs in the months \u200bahead. The \u200bFed's overnight benchmark interest rate was raised by \u200ba quarter of a percentage point \u200cto the 3.75%-4.00% range.\n\nThe average rate on a 30-year fixed-rate mortgage was 6.76% last week, the highest level in more than a year, text for the stock? The stock was priced at $45.35 as of the Sept. 1, 2026, market close, having achieved an 18% total return over the preceding 12 months.\n\nBristow Group provides comprehensive vertical-flight solutions and aviation services to offshore energy operators and government agencies, including personnel transportation, search-and-rescue operations, medical evacuation, fixed-wing transportation, and unmanned systems services.\n\nThe company generates revenue through three primary operating segments: Offshore Energy Services, which serves oil and gas operators; Government Services, which provides aviation support to government entities; and Other Services, which encompasses complementary aviation and support operations.\n\nBristow's primary customers include major offshore energy companies and government agencies across the United Kingdom, Norway, the United States, Nigeria, and other international markets, with a particular focus on supporting deepwater and subsea operations.", "source": "Yahoo Finance", "pub_date_str": "17 Sep 2026, 06:45 PM IST", "pub_date_relative": "20m ago"}, {"title": "GlobalFoundries and Marvell expand chip production deal", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Sep 2026, 06:44 PM IST", "pub_date_relative": "20m ago"}, {"title": "Copper prices rise as Chinese buyers return after selloff", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Sep 2026, 06:44 PM IST", "pub_date_relative": "20m ago"}, {"title": "UBS reiterates Costco stock Buy rating ahead of quarterly results", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Sep 2026, 06:44 PM IST", "pub_date_relative": "20m ago"}, {"title": "UBS reiterates Buy on Home Depot stock, $420 target maintained", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Sep 2026, 06:44 PM IST", "pub_date_relative": "20m ago"}, {"title": "UBS lowers Amgen stock price target to $430 on drug trial concerns", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Sep 2026, 06:44 PM IST", "pub_date_relative": "20m ago"}, {"title": "He Put His Daughter\u2019s Name on the $90,000 Savings Account So She Could Pay His Bills. The Medicaid Office Counted All of It as His", "full_content": "Skip to navigation Skip to main content Skip to right column He Put His Daughter\u2019s Name on the $90,000 Savings Account So She Could Pay His Bills. The Medicaid Office Counted All of It as His Gerelyn Terzo Thu, September 17, 2026 at 6:14 AM PDT 5 min read Quick Read Medicaid counts the full joint account balance as the applicant's asset when all deposits originated from them, regardless of whose name appears on the account.\n\nWithdrawals from a joint account used for the co-owner's personal benefit can trigger a Medicaid penalty period under the five-year look-back rule.\n\nClark Howard warns against joint accounts for bill-paying convenience, recommending a durable financial power of attorney to separate authority from ownership.\n\nRead More: Learn 7 ways to generate income with a $1,000,000+ portfolio (sponsor)\n\nPicture an older widower who adds his daughter to a $90,000 savings account so she can pay utilities, property taxes and medical bills. Every deposit came from his paycheck, pension and Social Security. His daughter contributed nothing and treated the money as his.\n\nWhen he enters a nursing home and applies for Medicaid, the family assumes joint title means the state will count only half. The caseworker counts all $90,000. Her name gave her access, not the ownership Medicaid was required to recognize.\n\nMedicaid, the state-administered program that pays for long nursing-home stays once savings are depleted, differs from Medicare, which covers doctors, hospitals and only a short skilled-nursing benefit after a qualifying hospital stay.\n\nMedicaid examines ownership, access and the source of money, not simply the names on the statement. Under the common SSI-style rule, when only one joint owner is applying for benefits, the full balance is initially presumed to belong to that applicant.", "source": "Yahoo Finance", "pub_date_str": "17 Sep 2026, 06:44 PM IST", "pub_date_relative": "21m ago"}, {"title": "Stock Market Today: Dow Rises In Fed Aftermath; Generac, Nebius, Bloom, SpaceX Are Early Movers (Live Coverage)", "full_content": "Store Subscribe Sign In My Subscriptions Founder's Club SwingTrader Leaderboard MarketSurge eIBD IBD Digital IBD Live Customer Center My Stock Lists Email Preferences Help & Support Sign Out Market Trend Stock Lists Research News Videos Learn Store Search stocks or keywords Sections My IBD Market Trend MARKET TREND The Big Picture Stock Market Today ETF Market Strategy Stock Market Data Psychological Indicators New? Start Here IBD Digital: 2 Months for $20 Stock Lists STOCK LISTS IBD 50 IBD Sector Leaders IBD Big Cap 20 IBD Long-Term Leaders IPO Leaders My Stock Lists Stock Lists Update Stocks On The Move New Highs Stock Spotlight Stocks Near Buy Zone RS Line At New High Rising Profit Estimates Stocks Funds Are Buying Your Weekly Review Breakout Stocks Index IBD ETF Indexes IBD Data Tables IBD Digital: 2 Months for $20 New? Start Here Research STOCK RESEARCH IBD Stock Checkup Stock Of The Day Screen Of The Day IBD Charts Stock Screener Swing Trading Options Investing Action Plan Earnings Preview Earnings Calendar IBD Industry Themes The New America Best ETFs Best Mutual Funds The Income Investor IBD Stock Analysis Industry Snapshot IBD 50 Stocks To Watch IBD Data Stories IBD Digital: 2 Months for $20 News NEWS eIBD Technology Magnificent Seven Stocks Personal Finance Special Reports Cryptocurrency Retirement Management ECONOMY Economic Calendar Economic News IBD Digital: 2 Months for $20 Videos VIDEOS & PODCASTS IBD Live How To Invest Videos Options Videos Investing With IBD Podcast Growth Stories Podcast Webinars Online Courses IBD Digital: 2 Months for $20 Learn HOW TO INVEST How To  active capital return programs, using robust cash flow generation to execute share repurchases and sustain a multi-decade history of annual dividend increases. In Q2, the company's capital returns amounted to $1.3 billion, which included $983 million in share repurchases and $309 million in dividends.\n\nDespite solid bottom line expansion, top line metrics face headwinds due to broader foreign exchange dynamics and regional volume adjustments. Aflac Incorporated's (NYSE:AFL) total revenues for the second quarter declined year-over-year to $4.1 billion. Currency fluctuations created distinct translation pressures, notably driven by a weaker Japanese yen. It led to the total adjusted revenues in the Aflac Japan segment dropping 12.6% in dollar terms to $2.2 billion, highlighting local currency decreases along with severe foreign exchange drag.\n\nIn addition, adjusted earnings fell 7.7% to $883 million during the quarter.", "source": "Yahoo Finance", "pub_date_str": "17 Sep 2026, 06:42 PM IST", "pub_date_relative": "22m ago"}, {"title": "U.S. oil falls below $100 as Saudi Arabia reportedly offers more crude via Hormuz after pipeline attack", "full_content": "Oil prices fell Thursday as Saudi Arabia shifts some crude exports through the Strait of Hormuz to compensate for the closure of a key pipeline, easing market fears that the outage will cause another major disruption to global supplies.\n\nBrent futures, the international benchmark, was 3.6% lower at $102 per barrel, while U.S. crude oil was down 2.8% at $99.53 a barrel. Prices are down for the week but have gained more than 12% this month.\n\nThe Saudis are making additional crude cargoes available to Asian refiners through ship-to-ship transfers just outside Hormuz near Oman's Sohar port, Reuters reported, citing sources familiar with the matter.\n\nU.S. Energy Secretary Chris Wright told CNBC Tuesday that the East-West pipeline outage was a \"brief and temporary interruption\" that \"will be measured in days.\" Riyadh has taken \"quick action\" to export more oil through Hormuz with the help of the U.S. military, Wright said.\n\nEarlier this week crude loadings at Saudi Arabia's Red Sea export terminal at Yanbu were halted and Riyadh canceled some shipments to European customers .\n\nYanbu has become Saudi Arabia's key route for oil exports since Iran began blockading the Strait of Hormuz following U.S. and Israeli attacks on the country in late-February.\n\nPeter Massabni, head of business development at XS.com, said in a note late Wednesday that Saudi Arabia's efforts to find alternative export routes following the disruption at Yanbu have reassured markets that some lost crude supply could return.\n\nHowever, he cautioned that the outlook remains highly dependent on developments in the Middle East.", "source": "CNBC Top News", "pub_date_str": "17 Sep 2026, 06:42 PM IST", "pub_date_relative": "23m ago"}, {"title": "Our top 10 things to watch in the stock market Thursday", "full_content": "Stocks are set for a big bounce-back rally after yesterday's Fed sell-off.", "source": "CNBC Top News", "pub_date_str": "17 Sep 2026, 06:41 PM IST", "pub_date_relative": "23m ago"}, {"title": "IREN Climbs 6%, Nebius Jumps 10% as GPU Rental Rates Head Higher; CoreWeave Slips", "full_content": "Skip to navigation Skip to main content Skip to right column IREN Climbs 6%, Nebius Jumps 10% as GPU Rental Rates Head Higher; CoreWeave Slips David Moadel Thu, September 17, 2026 at 6:11 AM PDT 6 min read QQQ IREN CRWV NBIS Quick Read Nebius's GPU rate hike effective October 1 lifted NBIS 10% and IREN 6%, while CoreWeave fell on debt and locked-in capacity concerns.\n\nDTCR trailing QQQ confirms this is a neocloud-specific repricing story, not a broad data center sector rally.\n\nJust released. Our analysts combed the entire stock market and named the ten best stocks to buy right now, and Nebius Group didn't make the cut. Enter your email to see the names that beat NBIS. The report is free. Enter your email and see if any of your stocks made the cut.\n\nThe neocloud trade split three ways Thursday morning after Nebius Group ( NASDAQ:NBIS ) notified customers of higher on-demand rental rates for a range of AI graphics processing unit (GPU) capacity effective October 1. This rate change is a rare same-week read-through on pricing power in AI compute, and it moved operators beyond Nebius itself. Market participants treated the disclosure as a name-by-name repricing of who can capture higher hourly rates rather than a verdict on the group as a whole.\n\nThe Invesco QQQ Trust ( NASDAQ:QQQ ) is up 1.62% to $716.12, tracking a firmer large-cap technology tape. The Global X Data Center & Digital Infrastructure ETF ( NASDAQ:DTCR ) is trailing at up 1% to $27.60, a lag that says the diversified digital infrastructure basket isn't capturing the neocloud repricing on its own.\n\nIREN Limited ( NASDAQ:IREN ) stock is up 6% to $45.20 on the read-through that scarce GPU capacity can be re-rented at higher hourly rates. Nebius stock is climbing 10% to $229.67 as the party actually setting the new price card.", "source": "Yahoo Finance", "pub_date_str": "17 Sep 2026, 06:41 PM IST", "pub_date_relative": "23m ago"}, {"title": "Puravankara shares jump 4%, extend rally to second day. Why is the realty stock rebounding?", "full_content": "Shares of real estate developer Puravankara closed nearly 4% higher in Thursday\u2019s trade on 17 September, reaching \u20b9 218 apiece as investors responded positively to the company\u2019s redevelopment project win. Today's rally marks second day of gains for the stock.\n\nIn its regulatory filing, the company said it had secured redevelopment rights for three residential societies in Bangur Nagar, Goregaon West, Mumbai. Spread across 4.68 acres, the project offers a total developable potential of approximately 1.05 million sq. ft. and an estimated Gross Development Value (GDV) of \u20b9 2,600 crore.\n\nLocated in Mumbai\u2019s western suburbs, Goregaon West is a well-established residential market with strong connectivity to key business districts and social infrastructure. The project further expands Puravankara\u2019s footprint in one of Mumbai\u2019s important residential corridors.\n\nThe addition marks Puravankara\u2019s eighth redevelopment project in Mumbai and further strengthens its presence in the city\u2019s redevelopment market.\n\nCommenting on the development, Ashish Puravankara, Managing Director of Puravankara Limited, said, \u201cRedevelopment is an important pillar of our Mumbai growth strategy and allows us to participate in some of the city\u2019s most established and sought-after neighborhoods. Our eighth redevelopment project reflects the momentum we have built in Mumbai and the confidence homebuyers are placing in our brand.\n\n\"We see a significant opportunity to build a scaled and sustainable redevelopment platform in the city, backed by disciplined capital allocation, strong execution, and a long-term approach to value creation,\" Ashish further added.\n\nPuravankara has steadily expanded its Mumbai redevelopment portfolio across locations over the last three years, including Breach Candy, Pali Hill, Lokhandwala, Chembur, Malabar Hill, and Cuffe Parade.", "source": "LiveMint Markets", "pub_date_str": "17 Sep 2026, 06:41 PM IST", "pub_date_relative": "24m ago"}], "cfa": [{"title": "Dow jumps 400 points, lifted by falling oil and yields as market attempts comeback after Fed sell-off: Live updates", "full_content": "U.S. equities climbed on Thursday, supported by a drop in Treasury yields and oil prices as well as gains in key technology stocks, with traders trying to claw back some of the prior day's losses incited by the first Federal Reserve interest rate hike in three years.\n\nThe Dow Jones Industrial Average advanced 410 points, or 0.8%. The S&P 500 was up 1.2%, and the Nasdaq Composite added 1.5%.\n\nTech drove the broader market higher. \"Magnificent Seven\" names Nvidia and Amazon rose 2% each, while fellow member Microsoft gained 1%. Other stocks related to the artificial intelligence trade such as Applied Materials , Qualcomm and Intel advanced 2%, 4% and 3%, respectively.\n\nMeanwhile, Treasury yields pulled back . The 10-year yield moved below 5%, dropping more than 5 basis points to 4.949%. The yield had risen back above that key level Wednesday following the Fed's rate decision.\n\nOil prices declined , which also gave a boost to equities. U.S. crude traded 1% lower, falling to around $100 per barrel. Brent slid 2% to about $102 a barrel. That's as supply disruption concerns eased after Saudi Arabia reportedly decided to make more crude cargoes available to Asian refiners through ship-to-ship transfers near the Sohar port in Oman.\n\nOn Wednesday, the blue-chip Dow lost more than 630 points, or 1.2%, dragged down by financial services names. The broad market S&P 500 edged lower by 0.5%, while the tech-heavy Nasdaq Composite ended the session marginally lower.\n\nThose moves came after the Fed raised the overnight federal funds rate by a quarter percentage point, bringing the target range to between 3.75% and 4%. Policymakers also signaled another hike could come this year, with Fed Chairman Kevin Warsh saying that inflation remains too high.\n\nMark Haefele, chief investment officer at UBS Global Wealth Management, said in a note on Thursday that his team remained \"positioned for further equity gains while preparing for near-term volatility.\"", "source": "CNBC Top News", "pub_date_str": "17 Sep 2026, 07:03 PM IST", "pub_date_relative": "2m ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "US single-family housing starts rebound in August; building permits fall", "full_content": "Skip to navigation Skip to main content Skip to right column US single-family housing starts rebound in August; building permits fall Reuters Thu, September 17, 2026 at 6:19 AM PDT 2 min read WASHINGTON, Sept 17 (Reuters) - US single-family homebuilding increased in August, but a drop in permits for future construction suggested the improvement was likely temporary as rising inflation \u200cbecause of the war in the Middle East boosts mortgage rates.\n\nSingle-family housing starts, \u200cwhich account for the bulk of homebuilding, jumped 7.6% to a seasonally adjusted annual rate of 918,000 units last \u200bmonth, the Commerce Department's Census Bureau said on Thursday. They rose 5.2% on a year-over-year basis in August.\n\nSingle-family building permits fell 1.8% to a rate of 878,000 units in August. They increased 1.3% on a year-over-year basis.\n\nMortgage rates have surged, tracking longer-term US Treasury yields as the US-Israeli war \u200cwith Iran drove oil prices above $100 \u2060a barrel. Bond yields have also risen amid uncertainty over the Federal Reserve's response to inflation and a ballooning national debt. The yield on \u2060the benchmark 10-year Treasury note is hovering around 5.0%.\n\nThe US central bank on Wednesday raised interest rates for the first time since 2023 and flagged further increases in borrowing costs in the months \u200bahead. The \u200bFed's overnight benchmark interest rate was raised by \u200ba quarter of a percentage point \u200cto the 3.75%-4.00% range.\n\nThe average rate on a 30-year fixed-rate mortgage was 6.76% last week, the highest level in more than a year, up from 6.71% in the prior week, data from mortgage finance firm Freddie Mac showed.\n\nA National Association of Home Builders survey on Wednesday showed sentiment among single-family homebuilders slumped to a one-year low in September.", "source": "Yahoo Finance", "pub_date_str": "17 Sep 2026, 06:46 PM IST", "pub_date_relative": "18m ago", "cfa_topics": ["Economics", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Bristow Group Director Truelove Sells 3,500 Shares for $161,000", "full_content": "Skip to navigation Skip to main content Skip to right column Bristow Group Director Truelove Sells 3,500 Shares for $161,000 Jack Delaney, The Motley Fool Thu, September 17, 2026 at 6:15 AM PDT 4 min read VTOL Brian D. Truelove, Director at Bristow Group (NYSE:VTOL), sold 3,500 shares of common stock on Sept. 1, 2026, as disclosed in a recent SEC Form 4 filing .\n\nTransaction value based on SEC Form 4 weighted average sale price ($45.87); post-transaction value based on Sept. 1, 2026, market close ($45.35).\n\nHow does this transaction impact the insider's equity position? The sale of 3,500 shares reduces the insider's direct stake, though Truelove maintains a remaining position of 35,728 shares in Bristow.\n\nWhat was the execution pricing for this disposal? The shares were liquidated at a weighted average price of $45.87, with individual transactions occurring at prices between $45.87 and $45.88.\n\nWhat is the recent performance context for the stock? The stock was priced at $45.35 as of the Sept. 1, 2026, market close, having achieved an 18% total return over the preceding 12 months.\n\nBristow Group provides comprehensive vertical-flight solutions and aviation services to offshore energy operators and government agencies, including personnel transportation, search-and-rescue operations, medical evacuation, fixed-wing transportation, and unmanned systems services.\n\nThe company generates revenue through three primary operating segments: Offshore Energy Services, which serves oil and gas operators; Government Services, which provides aviation support to government entities; and Other Services, which encompasses complementary aviation and support operations.\n\nBristow's primary customers include major offshore energy companies and government agencies across the United Kingdom, Norway, the United States, Nigeria, and other international markets, with a particular focus on supporting deepwater and subsea operations.", "source": "Yahoo Finance", "pub_date_str": "17 Sep 2026, 06:45 PM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "He Put His Daughter\u2019s Name on the $90,000 Savings Account So She Could Pay His Bills. The Medicaid Office Counted All of It as His", "full_content": "Skip to navigation Skip to main content Skip to right column He Put His Daughter\u2019s Name on the $90,000 Savings Account So She Could Pay His Bills. The Medicaid Office Counted All of It as His Gerelyn Terzo Thu, September 17, 2026 at 6:14 AM PDT 5 min read Quick Read Medicaid counts the full joint account balance as the applicant's asset when all deposits originated from them, regardless of whose name appears on the account.\n\nWithdrawals from a joint account used for the co-owner's personal benefit can trigger a Medicaid penalty period under the five-year look-back rule.\n\nClark Howard warns against joint accounts for bill-paying convenience, recommending a durable financial power of attorney to separate authority from ownership.\n\nRead More: Learn 7 ways to generate income with a $1,000,000+ portfolio (sponsor)\n\nPicture an older widower who adds his daughter to a $90,000 savings account so she can pay utilities, property taxes and medical bills. Every deposit came from his paycheck, pension and Social Security. His daughter contributed nothing and treated the money as his.\n\nWhen he enters a nursing home and applies for Medicaid, the family assumes joint title means the state will count only half. The caseworker counts all $90,000. Her name gave her access, not the ownership Medicaid was required to recognize.\n\nMedicaid, the state-administered program that pays for long nursing-home stays once savings are depleted, differs from Medicare, which covers doctors, hospitals and only a short skilled-nursing benefit after a qualifying hospital stay.\n\nMedicaid examines ownership, access and the source of money, not simply the names on the statement. Under the common SSI-style rule, when only one joint owner is applying for benefits, the full balance is initially presumed to belong to that applicant.", "source": "Yahoo Finance", "pub_date_str": "17 Sep 2026, 06:44 PM IST", "pub_date_relative": "21m ago", "cfa_topics": ["Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Stock Market Today: Dow Rises In Fed Aftermath; Generac, Nebius, Bloom, SpaceX Are Early Movers (Live Coverage)", "full_content": "Store Subscribe Sign In My Subscriptions Founder's Club SwingTrader Leaderboard MarketSurge eIBD IBD Digital IBD Live Customer Center My Stock Lists Email Preferences Help & Support Sign Out Market Trend Stock Lists Research News Videos Learn Store Search stocks or keywords Sections My IBD Market Trend MARKET TREND The Big Picture Stock Market Today ETF Market Strategy Stock Market Data Psychological Indicators New? Start Here IBD Digital: 2 Months for $20 Stock Lists STOCK LISTS IBD 50 IBD Sector Leaders IBD Big Cap 20 IBD Long-Term Leaders IPO Leaders My Stock Lists Stock Lists Update Stocks On The Move New Highs Stock Spotlight Stocks Near Buy Zone RS Line At New High Rising Profit Estimates Stocks Funds Are Buying Your Weekly Review Breakout Stocks Index IBD ETF Indexes IBD Data Tables IBD Digital: 2 Months for $20 New? Start Here Research STOCK RESEARCH IBD Stock Checkup Stock Of The Day Screen Of The Day IBD Charts Stock Screener Swing Trading Options Investing Action Plan Earnings Preview Earnings Calendar IBD Industry Themes The New America Best ETFs Best Mutual Funds The Income Investor IBD Stock Analy u201cRedevelopment is an important pillar of our Mumbai growth strategy and allows us to participate in some of the city\u2019s most established and sought-after neighborhoods. Our eighth redevelopment project reflects the momentum we have built in Mumbai and the confidence homebuyers are placing in our brand.\n\n\"We see a significant opportunity to build a scaled and sustainable redevelopment platform in the city, backed by disciplined capital allocation, strong execution, and a long-term approach to value creation,\" Ashish further added.\n\nPuravankara has steadily expanded its Mumbai redevelopment portfolio across locations over the last three years, including Breach Candy, Pali Hill, Lokhandwala, Chembur, Malabar Hill, and Cuffe Parade.", "source": "LiveMint Markets", "pub_date_str": "17 Sep 2026, 06:41 PM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Alternative Investments", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Stock Market Today: Stock Futures Climb as Markets Retrace Post-Fed Moves - WSJ", "full_content": "Stock Market Today: Stock Futures Climb as Markets Retrace Post-Fed Moves WSJ Dow futures rally 600 points, boosted by declining oil and yields as traders attempt Fed sell-off rebound: Live updates CNBC Shares and short-term yields edge up after Fed hike, focus turns to BoE Reuters US Stocks Primed to Rebound From Fed Day Slump as Futures Rally Bloomberg.com Stock Market Today: Dow Rises In Fed Aftermath; Generac, Nebius, Bloom, SpaceX Are Early Movers (Live Coverage) Investor's Business Daily", "source": "Google News Business", "pub_date_str": "17 Sep 2026, 06:41 PM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Equity Investments", "Derivatives"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Asymmetry Keeps Me Hitting The Buy Button on Amazon", "full_content": "Skip to navigation Skip to main content Skip to right column Asymmetry Keeps Me Hitting The Buy Button on Amazon Alex Sirois Thu, September 17, 2026 at 6:10 AM PDT 5 min read AMZN MSFT GOOG WMT Quick Read AMZN is up just 7% YTD while AWS grows 37% YoY with a $496 billion backlog, its fastest growth in 18 quarters.\n\nUnlike MSFT or GOOGL, AMZN delivers five straight quarters of AWS acceleration plus an AI and chips run rate each exceeding $25 billion.\n\nAmazon's $200 billion 2026 capex looks painful, but the lion's share of 2027 capacity is already pre-reserved under multi-year contracts.\n\nJust released. Our analysts combed the entire stock market and named the ten best stocks to buy right now, and Amazon didn't make the cut. Enter your email to see the names that beat AMZN. The report is free. Enter your email and see if any of your stocks made the cut.\n\nI keep buying Amazon ( NASDAQ:AMZN ) because the setup in front of me is the cleanest risk-reward asymmetry I own. The stock is down 5.87% over the past month and up only 6.56% year to date, while the business underneath it just posted the fastest AWS growth in 18 quarters. That gap is why I keep adding.\n\nMy thesis is simple. Amazon is spending like a company that sees demand it cannot fill, and the market is pricing it like a company whose free cash flow just went negative. Both statements are true. Only one of them matters in ten years. Trailing-twelve-month free cash flow is -$7.6 billion, and Q2 capital expenditures hit $54.2 billion. That is the near-term pain. On the other side of it sits a data-center footprint management said can be monetized for 30-plus years once online.\n\n24/7 Wall St has helped investors make money for over two decades, and our top analysts just finished ranking the definitive Top 10 Stocks To Buy Now . Not the ten biggest companies. Not the ten everyone is arguing about.", "source": "Yahoo Finance", "pub_date_str": "17 Sep 2026, 06:40 PM IST", "pub_date_relative": "25m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Warren Buffett Is Sounding Off on Market Risk and Investors Should Listen", "full_content": "Skip to navigation Skip to main content Skip to right column Warren Buffett Is Sounding Off on Market Risk and Investors Should Listen Lee Samaha, The Motley Fool Thu, September 17, 2026 at 6:09 AM PDT 4 min read GOOG NVDA ORCL Warren Buffett has given a couple of interviews to CNBC in recent months that have provided some fascinating color on the state of the markets. Tangentially, they touched on the biggest debate in the market right now: the sustainability of the artificial intelligence (AI) spending boom and its implications for stocks like Alphabet (NASDAQ: GOOGL) (NASDAQ: GOOG) and Oracle (NYSE: ORCL).\n\nMy take on it is that there's definitely reason for near-term caution, but investors should look to take advantage of any significant market-led weakness. Here's why.\n\nMissed Nvidia in 2009? This Rare Signal Is Flashing Again. In 2009, a \"Double Down\" signal flashed for a little-known chipmaker called Nvidia. For the first time in years, that same \"Total Conviction\" signal is flashing for a company 1/100th the size of Nvidia. Continue \u00bb\n\nIn the first interview in May, Buffett noted that \"we've never had people in a more gambling mood than now. But that doesn't mean that investing is terrible. It does mean that prices for an awful lot of things will look very silly.\"\n\nA month later, Buffett was asked about Berkshire Hathaway 's (NYSE: BRKA) (NYSE: BRKB) aggressive purchasing of Alphabet stock in 2026, a position that now represents about 12.6% of its public equity holdings. Buffett confirmed he had initiated it, with the decision made by Greg Abel.\n\nNaturally, the interviewer then tried to discern why Buffett was comfortable buying Alphabet over other hyperscalers that are currently spending heavily on AI-related capital expenditures. Buffett's response was: \"Yes, well, I don't want to sit around knocking the others.", "source": "Yahoo Finance", "pub_date_str": "17 Sep 2026, 06:39 PM IST", "pub_date_relative": "26m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Markets shift to rate-hike mode after US Fed's hawkish turn", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nIndian markets are bracing for monetary policy tightening, with expectations of a half-percentage-point repo rate hike by December strengthening after the US Federal Reserve raised rates by a quarter percentage point and signalled another hike later this year.\n\nMarkets will closely watch the 7-October Monetary Policy Committee (MPC) meeting, where the Reserve Bank of India\u2019s (RBI\u2019s) rate-setting panel is expected to end its almost year-long easing cycle with a 25-basis-point (bp) rate hike, according to at least five market participants. One basis point is one-hundredth of a percentage point.\n\nThe market participants expect the central bank to raise the rate at which it lends short-term funds to banks again in December as the global policy mood turns hawkish.\n\nOn Wednesday, the US Federal Open Market Committee (FOMC) raised rates for the first time since 2023 to 3.75-4.00%, as consumer inflation remained above the Fed\u2019s 2% target at 3.4% in August for the second month, driven by higher energy prices amid the West Asia war , tariff increases and strong demand linked to the artificial-intelligence (AI) boom.\n\nUntil over a week ago, an October rate hike was not firmly priced into market expectations. However, that has changed following the US Fed\u2019s move , as well as RBI\u2019s recent measures to absorb excess liquidity from record foreign-currency inflows through a dedicated window.\n\n\u201cThe global rate backdrop has turned decisively less benign, with the US Fed hiking 25bps and the Bank of Japan (BoJ) moving towards further normalization amid elevated US yields. Against this, RBI\u2019s liquidity absorption through variable rate reverse repo (VRRRs), foreign exchange swaps and open-market operations (OMO) sales signals a clear shift to liquidity normalization and could be a precursor to a rate hike,\u201d said V.R.C.", "source": "LiveMint Markets", "pub_date_str": "17 Sep 2026, 06:37 PM IST", "pub_date_relative": "28m ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "The Year Her Husband Died, She Converted $300,000 to a Roth. It Was the Last Return She\u2019d Ever File as Married, and the Cheapest Tax Bill of Her Life", "full_content": "Skip to navigation Skip to main content Skip to right column The Year Her Husband Died, She Converted $300,000 to a Roth. It Was the Last Return She\u2019d Ever File as Married, and the Cheapest Tax Bill of Her Life David Beren Thu, September 17, 2026 at 6:04 AM PDT 5 min read Quick Read A surviving spouse can convert up to $300,000 to a Roth before December 31 using joint brackets that nearly double the single-filer limit.\n\nThe 24% bracket extends to $403,550 on a joint return but only $201,775 for single filers, making the year of death uniquely cheap for large conversions.\n\nSurviving spouses can roll a deceased partner's IRA into their own name, unlocking Roth conversion rights no other beneficiary receives.\n\nRead More: Learn 7 ways to generate income with a $1,000,000+ portfolio (sponsor)\n\nIf your spouse died this year and you own a traditional IRA or 401(k), one tax move will never be this cheap again. You can still file a joint return for the year of death, and a Roth conversion executed before December 31 gets taxed inside the married-filing-jointly brackets. Next January, the same dollars fall into the single brackets. That is the entire trick, and for many retirees, it is worth six figures. It is also the one piece of planning nobody wants to think about while they are living through it.\n\nInternal Revenue Code section 6013(a)(3) lets a surviving spouse file a joint return for the year in which the other spouse died. That final joint year uses the wide MFJ brackets and the larger standard deduction. For 2026, the MFJ standard deduction is $32,200, versus $16,100 for a single filer. The 24% band on a joint return runs to $403,550 of taxable income. On a single return, 24% stops at $201,775. Same rate, roughly half the room.\n\nIf you've saved over $1,000,000, this guide is for you.", "source": "Yahoo Finance", "pub_date_str": "17 Sep 2026, 06:34 PM IST", "pub_date_relative": "31m ago", "cfa_topics": ["Financial Statement Analysis", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "US midterm elections 2026: How they could impact taxes, Social Security and retirement", "full_content": "As Americans head to the polls for the 2026 US midterm elections, the impact goes beyond who controls Congress. It is likely to shape legislative direction and policy decisions for the next 2 years. For households planning their finances, the immediate impact may be more limited than the political headlines, as new laws and policies can reshape taxes, Social Security payments, and retirement benefits.\n\nA recent Fidelity Investments report notes that a closely divided Congress could make major legislation harder to pass and will automatically shift the focus towards executive actions and regulatory changes. Areas to watch include health savings accounts (HSAs), retirement account access, and financial services regulation.\n\nThe 2026 midterm polls are unlikely to immediately rewrite the US tax system. The One Big Beautiful Bill Act paased in 2025 has already established tax brackets, capital-gains brackets and a higher standard deduction, providing greater certainty for taxpayers in the near term. However, several provisions are to expire between 2028 and 2029. These include the expanded state and local tax (SALT) deduction, a $6,000 senior deduction and the exemption for some tipped income.\n\nCA Ruchika Bhagat, MD, Neeraj Bhagat & Co., said taxpayers should therefore look beyond the election itself.\n\n\u201cOn taxation, the last major reform already locked in current tax brackets and deduction levels for the near term. The date that deserves genuine attention isn't this election \u2014 it's 2028\u20132029,\u201d Bhagat said.\n\n\u201cThat's the real planning horizon, and it's worth building client timelines around it now.\u201d\n\nSocial Security's finances are another major issue. Fidelity cites projections indicating that the Old-Age and Survivors Insurance trust fund could begin to run out of money towards the end of 2032.", "source": "LiveMint Money", "pub_date_str": "17 Sep 2026, 06:32 PM IST", "pub_date_relative": "32m ago", "cfa_topics": ["Financial Statement Analysis", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Warsh spooks investors, OpenAI's 'concerning' incidents, Boeing's production problems and more in Morning Squawk", "full_content": "This is CNBC's Morning Squawk newsletter. Subscribe here to receive future editions in your inbox.\n\nHappy Thursday. So much for that \"SaaSpocalypse.\" Salesforce issued a stronger-than-expected revenue forecast for the fiscal 2030 year at its Dreamforce event yesterday.\n\nStock futures are rallying this morning after a third straight down day on Wall Street .\n\nHere are five key things investors need to know to start the trading day:\n\nThe Federal Reserve delivered its first interest rate hike in more than three years yesterday, lifting its benchmark interest rate by 25 basis points. The move was widely expected, but Chairman Kevin Warsh's comments on inflation sent the Dow Jones Industrial Average plunging more than 600 points and the 10-year Treasury yield back up to 5%.\n\nOpenAI disclosed six more instances of what it called \"unexpected or concerning\" behavior by its models yesterday, saying in a blog post that it does not believe that \"the AI industry has solved alignment and monitoring to a sufficient degree.\" The six cases do not include the Hugging Face incident that rattled the AI sector.\n\nThe disclosure comes days after OpenAI CEO Sam Altman backed Anthropic CEO Dario Amodei's call for a slowdown in development of AI models. Sarah Heck, Anthropic's head of public policy, said yesterday that she doesn't believe AI companies can alleviate safety concerns with an \"honor code\" : \"We can't be checking our own homework, and that's very clear,\" she said.\n\nSen. Richard Blumenthal, D-Conn., told CNBC yesterday that new AI products should undergo some sort of \"objective review\" before release. On the other hand, Emil Michael, the Pentagon's tech chief, signaled opposition to increasing government oversight of AI firms.", "source": "CNBC World Economy", "pub_date_str": "17 Sep 2026, 06:32 PM IST", "pub_date_relative": "33m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Fixed Income", "Derivatives", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "SEC clears path for tokenized stocks, bringing the market closer to 24/7 trading", "full_content": "The Securities and Exchange Commission on Thursday issued an order creating a regulatory pathway for certain trading venues to issue tokenized representations of publicly traded U.S. stocks, effective immediately.\n\nThe so-called Innovation Exemption provides certain trading platforms and liquidity providers with the regulatory relief needed to facilitate tokenized stock trading, provided they meet certain conditions. Two of the requirements have emerged as key points of contention in the investment community: Holders of stock tokens must retain the same rights they would have with traditional equity holdings, and companies must be able to object to having their securities represented as tokens.\n\nThe long-awaited move by the securities regulator comes two days after the Clarity Act, crypto's most consequential push for regulatory certainty, failed to advance in the Senate . The crypto market structure bill would have established clear rules for how digital assets, including tokenized securities, are classified and regulated. Now the SEC is moving to define that regulatory boundary through its existing authority.\n\n\"The Innovation Exemption is designed to resolve challenges that have prevented responsible innovation from taking root in the United States while providing investor protections and market integrity standards,\" SEC Chair Paul Atkins said in a statement.\n\nThough not a formal rulemaking, the five-year exemption is meant to open up activity in the market that could inform final rules and perhaps even help Congress determine whether new laws are needed. It's part of the agency's \"Project Crypto\" initiative, launched last year , to bring America's financial markets onchain.\n\n\"The Commission is not cementing today's technology as the standard for tomorrow,\" Atkins said. \"Instead, it is allowing the market to evolve, monitoring its development, and using that insight to inform a nimbler and future-ready regulatory framework. ...", "source": "CNBC World Economy", "pub_date_str": "17 Sep 2026, 06:30 PM IST", "pub_date_relative": "35m ago", "cfa_topics": ["Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "A 10% pay cut is coming \u2014 unless we act: Rob Staiger, Chief Economist, WTO", "full_content": "Choose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "17 Sep 2026, 06:30 PM IST", "pub_date_relative": "35m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}], "updated_at": "17 Sep 2026, 07:05 PM IST", "total_stories": 394};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
