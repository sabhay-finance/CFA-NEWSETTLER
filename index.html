ers. Amazon, Alphabet and Meta each spent between $30 billion and $54 billion in a single quarter. Collectively, these companies are expected to spend around $600\u2013725 billion this year.\n\n\u201cSo if you buy Apple, you get the tech exposure without the AI infrastructure risk. And it's still returning cash - $62 billion of buybacks in nine months. That's why it's behaving as a hedge.\u201d\n\nOf course not! Apple should not be viewed as a hedge against technology stocks altogether, as per Shah.\n\n\u201cIt remains a major technology company and can move differently when investor enthusiasm for AI changes. In fact, Apple moved in the opposite direction when the AI trade recovered in mid-August.\u201d\n\nSandeep Nambiar, Co-Founder and CEO, OneCap, adds that though investors currently like Apple's approach because it still generates strong cash flow, there is flipside to it. \u201cIf AI becomes the layer people actually live inside, then renting it means renting your future\u201d", "source": "LiveMint Money", "pub_date_str": "04 Sep 2026, 06:57 PM IST", "pub_date_relative": "8m ago"}, {"title": "Tesla\u2019s stock falls as Cybercab launch lands with a thud", "full_content": "The company\u2019s Cybercab rollout won\u2019t be as broad as some investors had hoped for.", "source": "MarketWatch Top Stories", "pub_date_str": "04 Sep 2026, 06:55 PM IST", "pub_date_relative": "10m ago"}, {"title": "HSBC Midcap Fund turns \u20b910,000 monthly SIP into \u20b92 crore since 2004", "full_content": "HSBC Midcap Fund has emerged as the top-performing equity fund over the last three years, delivering a CAGR of 24.13%. A monthly SIP of \u20b9 10,000 in the scheme since its inception in August 2004 would have grown to over \u20b9 2 crore.\n\nLaunched on August 9, 2004, HSBC Midcap Fund has received a five-star rating from Value Research and a four-star rating from Morningstar.\n\nThe scheme has outperformed both its benchmark and category average across different investment horizo p 2026, 06:42 PM IST", "pub_date_relative": "22m ago"}, {"title": "Bilibili prices $700 million convertible notes due 2031", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Sep 2026, 06:42 PM IST", "pub_date_relative": "22m ago"}, {"title": "Earnings call transcript: U.S. Global Investors posts profit in Q4 2026, shares rise", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Sep 2026, 06:41 PM IST", "pub_date_relative": "23m ago"}, {"title": "Gold miners and bitcoin stocks fall on strong jobs data", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Sep 2026, 06:41 PM IST", "pub_date_relative": "24m ago"}, {"title": "+89% since entry: AI-powered strategy closes massive healthcare win in September", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Sep 2026, 06:41 PM IST", "pub_date_relative": "24m ago"}, {"title": "EQT acquires McGill and Partners for $2 billion from Warburg Pincus", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Sep 2026, 06:40 PM IST", "pub_date_relative": "24m ago"}, {"title": "2-year yield rises to highest since January 2025 after hot jobs report boosts expectations that the Fed could raise rates", "full_content": "Treasury yields rose in trading Friday, as investors digested a stronger-than-expected jobs report for the month of August and weighed the impact it may have on the Federal Reserve's decisions on interest rates.\n\nThe key 10-year Treasury note yield \u2014 the main benchmark for mortgages, auto loans and credit card debt \u2014 was up less 4 basis points at 4.802%.\n\nThe shorter-dated 2-year Treasury note yield, which tends to react in line with short-term Federal Reserve interest rate decisions, rose more than 7 basis points to 4.425%. It was the highest level for the yield since January 2025.\n\nThe longer-dated 30-year Treasury note yield, which is often sensitive to geopolitical events, was little changed at 5.263%.\n\nOne basis point equals 0.01%, or 1/100th of 1%, and yields and prices move inversely to one another.\n\nThe U.S. economy added 162,000 jobs in August, above consensus estimates for 53,000, according to economists polled by Dow Jones. A hot labor market and sticky inflation \u2014 as price growth on an annual basis remains above the Fed's 2% target \u2014 could give the central bank more cover to raise interest rates at its September meeting.\n\nTraders increased their bets on a Fed rate hike at the Sept. 15-16 meeting. The probability of a quarter percentage point increase rose to 58%, or about 9 percentage points higher than a day ago, according to the CME Group's FedWatch tool .\n\n\"Fed officials have characterized the employment markets as stable but today's stellar jobs report shows hiring is surprisingly robust given the high level of energy prices and the ongoing affordability crisis,\" said Chris Rupkey, chief economist at FWDBONDS. \"The only fear is the Fed itself if it thinks economic demand is hot enough to need a rate hike in a couple of weeks.\"", "source": "CNBC Top News", "pub_date_str": "04 Sep 2026, 06:39 PM IST", "pub_date_relative": "25m ago"}, {"title": "FTSE 100 today: Stocks slip as strong U.S. jobs data lifts Fed hike bets", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Sep 2026, 06:39 PM IST", "pub_date_relative": "26m ago"}, {"title": "Jefferies cuts Clearway Energy stock price target on rates", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Sep 2026, 06:38 PM IST", "pub_date_relative": "26m ago"}, {"title": "TSX futures muted ahead of domestic, US jobs reports", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Sep 2026, 06:37 PM IST", "pub_date_relative": "27m ago"}], "cfa": [{"title": "Too much AI exposure? Can Apple be the diversification play in your portfolio? What Indian investors need to know", "full_content": "As investors grow wary of the billions US tech giants are pouring into AI infrastructure\u2014and whether that spending will translate into returns\u2014they are looking for ways to diversify their tech bets. Apple is quietly emerging as an alternative, offering exposure to technology without taking on the same heavy AI infrastructure spending risk.\n\nApple shares have gained about 7% over the past month versus a 1% gain for the Nasdaq-100. More strikingly, he 30-day correlation between the second-largest company in the world and the Nasdaq-100 Index reached a low of negative 0.86, its most inverse level since 2005.\n\nThe key difference is capital spending, or capex, points out Viram Shah, Founder & CEO, Vested Finance.\n\nUnlike, other major hyperscalers Apple is renting AI capacity rather than building it. Due to this, Apple spent about $6.8 billion on capex in the first nine months, far below the spending by big AI players. Amazon, Alphabet and Meta each spent between $30 billion and $54 billion in a single quarter. Collectively, these companies are expected to spend around $600\u2013725 billion this year.\n\n\u201cSo if you buy Apple, you get the tech exposure without the AI infrastructure risk. And it's still returning cash - $62 billion of buybacks in nine months. That's why it's behaving as a hedge.\u201d\n\nOf course not! Apple should not be viewed as a hedge against technology stocks altogether, as per Shah.\n\n\u201cIt remains a major technology company and can move differently when investor enthusiasm for AI changes. In fact, Apple moved in the opposite direction when the AI trade recovered in mid-August.\u201d\n\nSandeep Nambiar, Co-Founder and CEO, OneCap, adds that though investors currently like Apple's approach because it still generates strong cash flow, there is flipside to it. \u201cIf AI becomes the layer people actually live inside, then renting it means renting your future\u201d", "source": "LiveMint Money", "pub_date_str": "04 Sep 2026, 06:57 PM IST", "pub_date_relative": "8m ago", "cfa_topics": ["Quantitative Methods", "Corporate Issuers", "Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "HSBC Midcap Fund turns \u20b910,000 monthly SIP into \u20b92 crore since 2004", "full_content": "HSBC Midcap Fund has emerged as the top-performing equity fund over the last three years, delivering a CAGR of 24.13%. A monthly SIP of \u20b9 10,000 in the scheme since its inception in August 2004 would have grown to over \u20b9 2 crore.\n\nLaunched on August 9, 2004, HSBC Midcap Fund has received a five-star rating from Value Research and a four-star rating from Morningstar.\n\nThe scheme has outperformed both its benchmark and category average across different investment horizons based on trailing returns.\n\nOver the last three months, the fund delivered 8.01%, compared with 3.91% from its benchmark and 6.53% from the category average.\n\nOver six months, it generated 19.83%, against 7.98% for the benchmark and 10.27% for the category. Its one-year return stood at 22.73%, compared with 9.97% for the benchmark and 9.59% for the category.\n\nOver three years, the fund delivered 24.13%, significantly higher than the benchmark return of 16.64% and category average of 16.59%.\n\nOver five years, it generated 18.36%, compared with 17.06% for the benchmark and 15.15% for the category. Since its inception, the scheme has delivered a CAGR of 18.36%.\n\nThe scheme\u2019s yearly returns have varied considerably over the past decade. It declined 12.03% in 2018, 0.15% in 2019 and 1.35% in 2025.", "source": "LiveMint Money", "pub_date_str": "04 Sep 2026, 06:54 PM IST", "pub_date_relative": "10m ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Belgian PM De Wever pitches lower, zero tariffs to boost India-EU trade", "full_conten quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "FTSE 100 today: Stocks slip as strong U.S. jobs data lifts Fed hike bets", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Sep 2026, 06:39 PM IST", "pub_date_relative": "26m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "TSX futures muted ahead of domestic, US jobs reports", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Sep 2026, 06:37 PM IST", "pub_date_relative": "27m ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "NSE IPO opportunity: Five stocks holding unlisted NSE shares", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nNational Stock Exchange of India (NSE) is India's largest stock exchange and a major market infrastructure institution. It was incorporated in 1992, received Securities and Exchange Board of India recognition in 1993 and commenced operations in 1994. It pioneered electronic, screen-based trading in India.\n\nNSE operates across equities, equity derivatives, currency and commodity derivatives, debt, indices, clearing, market data, and technology services. Its biggest strength is its dominant position in Indian equity and derivatives trading.\n\nIn FY26, NSE had \u20b9 16,601 crore of segment revenue and remained highly profitable. Its unique registered investor base reached 129.1 million, while 2,978 companies were listed on the exchange.\n\nNSE ranked among the top 15 global exchanges by the number of contracts traded in derivatives.\n\nAccording to the World Federation of Exchanges, NSE (including NSEIX) accounted for more than 36.99 billion equity derivatives contracts traded in FY26, ranking first globally by number of contracts traded.\n\nHaving an unparalleled track record, India\u2019s largest stock exchange is now launching an IPO. The public issue is eagerly awaited, as it has taken years to secure regulatory approvals.\n\nWhile the IPO date is not finalized, some reports suggest the NSE IPO could launch later this month. In this editorial, we look at five companies that could potentially make big profits by selling their shares in the IPO.", "source": "LiveMint Markets", "pub_date_str": "04 Sep 2026, 06:37 PM IST", "pub_date_relative": "27m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Derivatives", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Here are our top 10 things to watch in the stock market Friday", "full_content": "Bond yields jumped and stocks dipped after a strong August jobs report.", "source": "CNBC Top News", "pub_date_str": "04 Sep 2026, 06:37 PM IST", "pub_date_relative": "27m ago", "cfa_topics": ["Equity Investments", "Fixed Income"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "US diesel prices hit a record high, pushing up transportation costs for a long list of goods - AP News", "full_content": "US diesel prices hit a record high, pushing up transportation costs for a long list of goods AP News Diesel hits record high as Ukraine and Iran wars knock out refineries, fueling inflation worries CNBC U.S. Diesel Prices Set New High The New York Times \u2018Astronomical\u2019 fuel price surge hits farmers in UK and US The Guardian Live Updates: Iran war drives U.S. diesel price to record high as Vance downplays the conflict and its impact CBS News", "source": "Google News Business", "pub_date_str": "04 Sep 2026, 06:35 PM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Volkswagen plans 50,000 job cuts as analysts see \u2018halo effect\u2019 for German auto industry", "full_content": "Volkswagen shares jumped on Friday after it announced plans to slash a further 50,000 jobs as part of a historic transformation plan amid intensifying tariff pressures and competition from China.\n\nEurope's biggest carmaker said Thursday that its supervisory board had approved its Future Plan 2030, comprising 12 initiatives that would result in the \"most strategically profound transformation program\" in the group's 89-year history.\n\nThis includes cutting around 50,000 positions, including management roles, it said, citing global competition, changing demands, and technological shifts. It also said it plans to streamline its leadership with a flatter hierarchy. It adds to 50,000 job cuts that were already approved , bringing the total job reductions to 100,000.\n\nVolkswagen topped the Stoxx 600 on Friday and was last seen up 8%. It's down 21% since the beginning of the year.\n\nVolkswagen's shares from the beginning of the year. The company will also simplify its model portfolio by 50% by 2035, with a smaller product lineup as well as considering alternative uses for four of its German plants where future production had not yet been secured from 2031 to 2034.\n\n\"We are taking responsibility for our entire workforce, for our partners and for industrial jobs worldwide,\" Volkswagen's CEO Oliver Blume said. \"Over the coming years, we will invest a three-figure billion sum to make our iconic brands even more attractive, stronger and more competitive.\"\n\nVolkswagen has dealt with slumping profits over the past year with tariff pressures among the factors weighing on earnings. It reported tariff expenses of 2.9 billion euros ($3.4 billion) for the full year of 2025.\n\nTwo years ago, the German carmaker was paying 2.5% tariffs on vehicles from Europe, but that has since jumped to 15%, Blume said in August.", "source": "CNBC Top News", "pub_date_str": "04 Sep 2026, 06:34 PM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "NSE likely to price IPO around Rs 1,800, list by September 25: Sources", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a NSE likely to price IPO around Rs 1,800, list by September 25: Sources The Economic Times daily newspaper is available online now. Read Today's Paper NSE likely to price IPO around Rs 1,800, list by September 25: Sources SECTIONS NSE likely to price IPO around Rs 1,800, list by September 25: Sources By Akash Podishetti , ETMarkets.com Last Updated: Sep 04, 2026, 06:29:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The National Stock Exchange plans to price its initial public offering near Rs 1,800 per share. The company will likely announce its price band on September 15. The IPO is expected to open around September 18 for investors. Listing may occur approximately on September 25, following Sebi approval. This significant public issue follows years of regulatory delays and scrutiny.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "04 Sep 2026, 06:29 PM IST", "pub_date_relative": "36m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "U.S. auto safety regulator opens probe into nearly 1,000 Tesla Cybercabs", "full_content": "The U.S. National Highway Traffic Safety Administration said it has opened an audit into about 1,000 Tesla Cybercab vehicles, examining the process and technical data the EV maker relied on to claim compliance with federal vehicle safety standards.\n\nThe probe comes after Tesla on Thursday began commercial deployment of a small number of the two-seater Cybercab in Austin, Texas, and said it planned to gradually expand the service to additional vehicles and locations.\n\nNHTSA said the Cybercab lacks permanently attached conventional manual controls, including a steering wheel, brake pedal, accelerator pedal and mirrors.\n\nThe agency said it would examine the basis for Tesla's certification and related issues, including the extent to which the company determined that certain Federal Motor Vehicle Safety Standards were not applicable to the vehicle.\n\nThe EV maker had 420 autonomous vehicles registered in Texas as of Friday morning, according to state records, including 45 Cybercab vehicles.", "source": "CNBC Top News", "pub_date_str": "04 Sep 2026, 06:27 PM IST", "pub_date_relative": "37m ago", "cfa_topics": ["Financial Statement Analysis", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Swiggy sees 4% equity change hands in block deals; shares gain 2.5%", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Swiggy sees 4% equity change hands in block deals; shares gain 2.5% Swiggy Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Swiggy sees 4% equity change hands in block deals; shares gain 2.5% SECTIONS Swiggy sees 4% equity change hands in block deals; shares gain 2.5% By Kumar Gaurav , ETMarkets.com Last Updated: Sep 04, 2026, 06:27:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Swiggy shares rose 2.53% following block deals involving 4% equity. The company faces MSCI index removal on September 7 due to foreign ownership caps, while Q1 FY27 results showed a narrowed net loss of Rs 791 crore.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "04 Sep 2026, 06:27 PM IST", "pub_date_relative": "38m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "U.S. payrolls rose 162,000 in August, much more than expected; unemployment rate at 4.1%", "full_content": "The U.S. economy added jobs at a brisk pace in August, reversing a summer slowdown in hiring, while the unemployment rate held steady.\n\nNonfarm payrolls rose a seasonally adjusted 162,000 for the month while the unemployment rate, as expected, held steady at 4.1%, the Bureau of Labor Statistics reported Friday. Economists surveyed by Dow Jones had been looking for a payrolls increase of 53,000.\n\nThe report was consistent with what Federal Reserve officials have called a stable labor market, and likely turns the central bank's focus to next week's inflation numbers as the final determinant heading into the interest rate decision in less than two weeks.\n\nStock market futures moved mostly lower after the release while Treasury yields, particularly at the short end where Fed policy has its greatest impact, rose sharply.\n\nPolicymakers generally watch the unemployment rate more closely for the health of the labor market, and that has held consistent for the past several years and is actually down 0.2 percentage point from a year ago. There was good news on that front as well, as the jobless level held steady even with a 0.2 percentage point increase in the labor force participation rate, a measure of those either employed or looking for jobs.\n\nThe household survey, which is used to calculate the unemployment rate, showed an increase of employment totaling 569,000 and a surge of 683,000 into the labor force.\n\nAn alternative measure of unemployment that counts discouraged workers and those holding part-time jobs for economic reasons fell to 7.7%, down 0.2 percentage point to its lowest level since June 2025.\n\nIn addition to the solid August gain, prior months saw upward revisions: July showed a gain of 21,000 jobs, swinging positive from a loss of 23,000, while June was revised up to a gain of 31,000, or an increase of 11,000.", "source": "CNBC Top News", "pub_date_str": "04 Sep 2026, 0     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
