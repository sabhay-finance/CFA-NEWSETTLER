    const allData = {"general": [{"title": "OpenAI bugging suspect Alfozan pleads not guilty", "full_content": "The Saudi national charged with planting a listening device in the headquarters of OpenAI while he worked there pleaded not guilty on Friday during an appearance in San Francisco federal court.\n\nAbdulrahman Alfozan , 35, was sent back to jail after the brief hearing. Alfozan has been held without bail since his arrest on a criminal complaint in early October.\n\nHe faces a maximum possible sentence of five years in prison if convicted in the case.\n\nA grand jury indicted Alfozan on Oct. 27 on a single count of interception of oral communications, court records show.\n\nProsecutors say that he put a recording device in a television in an executive conference room at OpenAI's offices in San Francisco on Sept. 28.\n\nAlfozan's lawyer declined to comment after the hearing before Magistrate Judge Peter Kang.\n\nThe judge ordered Alfozan to next appear in court on Nov. 17.\n\nAlfozan is a venture partner in a Saudi Arabian venture capital firm, Raed Ventures .", "source": "CNBC World Economy", "pub_date_str": "07 Nov 2026, 01:28 AM IST", "pub_date_relative": "1m ago"}, {"title": "Trump says Stephen Miller to replace Susie Wiles as White House chief of staff", "full_content": "President Donald Trump on Friday announced White House deputy chief of staff Stephen Miller will be promoted to chief of staff, replacing Susie Wiles .\n\nTrump revealed the stunning shake-up just three days after Democrats won a landslide victory in the midterm elections , gaining majority control in the House and Senate and scrambling the trajectory of Trump's last two years in office.\n\nElevating Miller, an architect of Trump's controversial mass-deportation efforts, is bound to raise the hackles of the incoming class of congressional Democrats, who have already vowed to investigate the government's immigration policies.\n\nMiller will take over starting Monday, Trump said in a Truth Social post , praising his longtime aide as \"one of my most trusted advisors.\"\n\nWiles, \"who has done an outstanding job, will be moving over to the Trump Political Operation,\" the president wrote.\n\nAsked about the move later Friday afternoon, Trump said, \"I wanted to make a change.\"\n\n\"I think Susie's done a very good job, great job. But I just wanted to make it,\" Trump told reporters as he left the White House for an event in Cape Canaveral, Florida.\n\n\"Stephen's been great,\" Trump said, adding, \"Sometimes in life you have to make moves.\"", "source": "CNBC Top News", "pub_date_str": "07 Nov 2026, 01:28 AM IST", "pub_date_relative": "1m ago"}, {"title": "Wall Street stocks in relief rally after heavy AI-related selloff", "full_content": "", "source": "Investing.com News", "pub_date_str": "07 Nov 2026, 01:24 AM IST", "pub_date_relative": "5m ago"}, {"title": "Nasdaq attempts to recover from worst rout in 19 months as AI stocks see some buying: Live updates", "full_content": "The Nasdaq Composite rebounded on Friday as some investors bought the dip in chip stocks following a punishing sell-off that sent the index into correction territory.\n\nThe tech-heavy Nasdaq bounced by 1.5%. The S&P 500 rose 0.8%, while the Dow Jones Industrial Average traded around the flatline.\n\nWorries of a potential slowdown in data center construction following big Democratic wins in the House and Senate and key state governorships hit U.S. markets hard on Thursday.\n\nThe heavy selling Thursday sent the three major stock averages to their worst one-day losses since April 2025. The Nasdaq Composite tumbled 5.5%, closing more than 10% below its most recent high and putting it in what Wall Street regards as a correction. The broad-market S&P 500 lost 4.4%, while the Dow fell more than 1,800 points, or 3.4%.\n\nAll 11 sectors in the S&P 500 closed lower, but shares of companies tied to the AI build-out led the decline.\n\nDuring Friday's session, shares of Micron Technology were up 3% following a 17% decline on Thursday. Nvidia was up 2% after a 9% rout the day before and moved back into positive territory for the year.\n\n\"The scale of the falls in some of the market's biggest names has been striking. But it also highlights the concentration risk that has built up in U.S. equity markets,\" Stuart Clark, portfolio manager at Quilter, said by email.\n\n\"With a relatively small number of technology and semiconductor stocks now carrying so much weight, weakness in those names quickly translates into sizeable falls for the Nasdaq and S&P 500.\"", "source": "CNBC Top News", "pub_date_str": "07 Nov 2026, 01:24 AM IST", "pub_date_relative": "5m ago"}, {"title": "Nvidia, AMD and other chip stocks rebound \u2014 but is relief from the \u2018violent\u2019 selloff only temporary?", "full_content": "Analysts warn of further volatility ahead, although there are two new factors that work in the AI trade\u2019s favor.", "source": "MarketWatch Top Stories", "pub_date_str": "07 Nov 2026, 01:22 AM IST", "pub_date_relative": "8m ago"}, {"title": "A disturbing employment trend is hiding beneath the latest strong job numbers", "full_content": "Americans who lose their jobs these days are facing a harsh new problem: It's getting harder to find another one quickly.\n\nThe average jobless worker's bout of unemployment surpassed 27 weeks in October on a seasonally adjusted basis, according to Friday's jobs report from the Bureau of Labor Statistics. That amounts to a job search of nearly seven months, the longest outside of the pandemic period since 2016, when the U.S. labor market was finally getting back on track after the 2008 financial crisis.\n\nAbout 2 million Americans have been without work for at least 27 weeks, the BLS reported. People in this category are referred to as the \"long-term unemployed \" and accounted for 27.6% of all jobless workers in October, the highest share since late 2021.\n\n\"This is a series that can be noisy from month to month,\" said Cory Stahle, senior economist at Indeed, a hiring platform. \"But if you look over a longer time horizon, there is no mistake in the trend.\"\n\nIt's a troubling sign in an otherwise steady labor market. Workers stuck on the sidelines are a casualty of what's become a \"low-hire, low-fire\" job market, in which companies are hesitant to lay workers off, but aren't adding them either.\n\nResearch shows that Americans who experience long-term unemployment face depleted savings, lower earnings potential over time and declining mental health.\n\nWhat's more, workers who are unemployed for extended periods risk falling into a self-perpetuating cycle, researchers at the Federal Reserve Bank of Richmond wrote earlier this year .\n\n\"Time spent unemployed may itself reduce the probability of finding a job, perhaps because skills depreciate, networks thin or employers interpret long unemployment durations as a negative signal,\" the researchers warned.", "source": "CNBC Top News", "pub_date_str": "07 Nov 2026, 01:19 AM IST", "pub_date_relative": "10m ago"}, {"title": "Dollar jumps after strong US payrolls report", "full_content": "", "source": "Investing.com News", "pub_date_str": "07 Nov 2026, 01:18 AM IST", "pub_date_relative": "11m ago"}, {"title": "Europe wants Russia to end Ukraine war before security talks", "full_content": "", "source": "Investing.com News", "pub_date_str": "07 Nov 2026, 01:15 AM IST", "pub_date_relative": "14m ago"}, {"title": "FBN Securities lowers Five9 stock price target on earnings guidance cut", "full_content": "", "source": "Investing.com News", "pub_date_str": "07 Nov 2026, 01:15 AM IST", "pub_date_relative": "15m ago"}, {"title": "Mississippi Senate: Longshot Ty Pinkins says he aimed to spoil Hyde-Smith, boost Colom vote", "full_content": "Longshot Mississippi Senate candidate Ty Pinkins said that at first wanted to win \u2014 but that he stayed in to spoil.\n\nPinkins told a local TV station that after an April poll showed he had no chance of winning he remained in the race in order to boost Democratic nominee Scott Colom's chances of beating Republican incumbent Sen. Cindy Hyde-Smith.\n\nColom is narrowly leading Hyde-Smith in ongoing counting by just 1,936 votes, a margin of just 0.2 percentage points, with 96.2% of the vote counted, according to the Associated Press. That margin is about one-tenth the size of Pinkins' share of the vote, 2.1 percentage points.\n\nPinkins has won just 20,010 votes so far out of the nearly 952,000 votes already counted.\n\n\"The only thing I did was stay in the race and let people shoot arrows at me,\" Pinkins said in an interview with WTVA in Mississippi on Thursday. \"That is it. And that's a ... low price to pay to get someone in this race that I think can help people in the Delta and all across this state.\"\n\n\"The portion of the vote that I drew \u2014 and people were concerned about splitting the Black vote \u2014 what I actually did was split the Republican vote,\" he said.\n\nPinkins told the station in Tupelo that he intentionally avoided campaigning in areas with large Black populations to avoid cutting into the vote share of Colom, who, like Pinkins , is Black.\n\nThat tactic worked, he said, as the election results show he got most of his support from areas with relatively low Black populations.", "source": "CNBC Top News", "pub_date_str": "07 Nov 2026, 01:14 AM IST", "pub_date_relative": "15m ago"}, {"title": "Further turmoil could be in store for tech stocks. What to watch in the week ahead", "full_content": "Investors are wrapping up a topsy-turvy week in markets, and that volatility isn't expected to end just yet.", "source": "CNBC Top News", "pub_date_str": "07 Nov 2026, 01:13 AM IST", "pub_date_relative": "16m ago"}, {"title": "Top House Oversight Democrat warns Trump family to 'lawyer up'", "full_content": "Rep. Robert Garcia, the California Democrat poised to lead the powerful House Oversight Committee, doubled down on his warning to President Donald Trump and his allies Friday, releasing a video promising sweeping investigations into the administration.\n\n\"Oversight Democrats are ready to take on the crooks, the con men and the Trump crime family. Lawyer up,\" the California Democrat wrote on X .\n\n\"The American people have spoken, and they are tired of the unprecedented level of corruption coming out of this White House and under President Trump,\" Garcia said in the video, which ends with the words \"LAWYER UP\" splashed across the screen.\n\nThe warning comes three days after Democrats' sweeping midterm victories handed them control of the House. When the new Congress convenes in January, Democrats will gain control of the committee's subpoena power, allowing them to compel testimony and obtain documents in investigations that could target Trump, his family and his allies.\n\nGarcia said the committee would investigate what he described as potential corruption involving the Trump family's business dealings , cryptocurrency ventures and Pentagon contracts, as well as alleged abuses by Immigration and Customs Enforcement . He also vowed to scrutinize individuals he said were connected to convicted sex offender Jeffrey Epstein .\n\n\"Oversight Democrats are absolutely going to ensure that we investigate every single one of these instances,\" Garcia said. \"Now let's get to work.\"\n\nGarcia's approach may conflict with what some advisors are telling Democrats \u2014 to go after corporate interests rather than Trump and his family.\n\nGarcia, currently the committee's top Democrat, formally launched his bid to become chairman Thursday. He is widely expected to secure the position.", "source": "CNBC Top News", "pub_date_str": "07 Nov 2026, 01:12 AM IST", "pub_date_relative": "17m ago"}, {"title": "Credit feels harder to get. Here\u2019s what to do before applying for a new credit card", "full_content": "Holiday shopping isn't slowing down for most Americans this year. Sixty-four percent of U.S. adults expect to spend the same or more than they did last holiday season, according to PayPal's 2026 Holiday Shopping Survey .\n\nCredit cards can be a great way to help accomplish all your holiday shopping while earning rewards on your purchases. However, approval can be tricky depending on the card you're interested in.\n\nA Federal Reserve Bank of New York survey published in September found that more Americans report credit is harder to get than a year ago \u2014 a feeling that is backed by evidence.\n\nAccording to a separate Federal Reserve survey from October on bank lending practices, 6.0% of bank respondents \u2014 and 10.5% of large banks, in particular \u2014 said that standards for credit card approvals have tightened somewhat.\n\nIf you're worried about getting approved for a new rewards card ahead of the holiday shopping season, CNBC Select walks through a few things to consider before you apply.\n\nSenior reporter Jason Stauffer can answer your questions about how to make the most of your credit cards in his weekly Points Pro column. Submit yours here .\n\nFirst, establish what you're comfortable spending during the holidays. This includes spending for gifts, travel, food and expenses directly tied to the season. Ideally, you'll be able to pay off your card's balance in full each month to avoid interest charges. If you do end up carrying a balance, make it a priority to pay it off before you start spending on optional purchases again.\n\nAlso ask yourself whether you really need another credit card, or if you should try to tighten your holiday budget . Holidays can easily tempt you into overspending, which also makes it a great time to start budgeting if you don't already.", "source": "CNBC Top News", "pub_date_str": "07 Nov 2026, 01:10 AM IST", "pub_date_relative": "19m ago"}, {"title": "Quick Mart IPO Draws Strong Demand as Kenyan Listings Pick Up", "full_content": "(Bloomberg) -- Quick Mart Plc saw demand for shares in its initial public offering exceed the number available by almost 23% as Kenya\u2019s second-biggest supermarket chain concluded the nation\u2019s second IPO of the year.\n\nInvestors applied for 2.45 billion shares at 7.50 shillings each in the Nairobi-based company while 2 billion were on offer, it said in a statement on Friday. The firm got 18,492 applications.\n\n\u201cThe board is delighted with the strong response,\u201d Quick Mart said.\n\nThe sale is a sign of a tentative revival in Kenyan equity-capital markets where there have been few listings. Quick Mart is only the second company to pursue an IPO this year in Nairobi after state-run Kenya Pipeline Co.\u2019s offer. Rising share prices have helped to create a more favorable backdrop for investors, with the nation\u2019s benchmark stocks gauge gaining 28% in dollar terms this year, placing it among the 10 best performers globally.\n\nJust over 18,000 Kenyan and East African retail investors received a full allocation of 119.6 million shares, while 44 foreign buyers got about 236 million shares, or just under half the number sought.\n\nFour so-called cornerstone investors are supporting the transaction, including Redwheel Group\u2019s RWC Asset Management LLP and 337 Frontier, an investment adviser set up in 2016 that\u2019s focused on frontier African equities. The World Bank\u2019s International Finance Corp. and the UK\u2019s Foreign, Commonwealth and Development Office \u2014 via its Mobilist program \u2014 are the other two.\n\nQuick Mart\u2019s current investors are using the IPO to reduce their stake, drawing attention to the exchange as an exit route for private equity funds, a rarely used path in Kenya. The company won\u2019t issue new stock or receive proceeds from the offer.\n\nThe sole owner, Sokoni Retail Kenya Ltd., is selling half of its stake. Sokoni is the vehicle through which the business\u2019s founder, John Kinuthia, and Adenia Partners hold their interests, with the Mauritius-based firm having a controlling stake.", "source": "LiveMint Markets", "pub_date_str": "07 Nov 2026, 01:09 AM IST", "pub_date_relative": "20m ago"}, {"title": "Nasdaq rebounds but remains on track for fourth straight weekly decline", "full_content": "", "source": "Investing.com News", "pub_date_str": "07 Nov 2026, 01:06 AM IST", "pub_date_relative": "23m ago"}, {"title": "Watch the Annual Meeting: Cramer on the fate of the AI buildout and stocks to buy now", "full_content": "At the Investing Club's 4th annual meeting, Cramer also reveals his outlook for 2027 and answers questions from the live audience and members at home.", "source": "CNBC Top News", "pub_date_str": "07 Nov 2026, 01:06 AM IST", "pub_date_relative": "23m ago"}, {"title": "vVardis targets IPO at up to $24 per share", "full_content": "", "source": "Investing.com News", "pub_date_str": "07 Nov 2026, 12:58 AM IST", "pub_date_relative": "32m ago"}, {"title": "Four things to note from Friday\u2019s US jobs report", "full_content": "", "source": "Investing.com News", "pub_date_str": "07 Nov 2026, 12:54 AM IST", "pub_date_relative": "35m ago"}, {"title": "Protagenic Therapeutics issues $250,000 promissory note to Patness LLC", "full_content": "", "source": "Investing.com News", "pub_date_str": "07 Nov 2026, 12:52 AM IST", "pub_date_relative": "37m ago"}, {"title": "US labor market regains ground as job growth surges, unemployment rate falls to 4.1% - Reuters", "full_content": "US labor market regains ground as job growth surges, unemployment rate falls to 4.1% Reuters 'A blowout': US added 165,000 jobs in October, trouncing expectations Yahoo Finance Hiring jumps: The economy added 165,000 jobs last month NPR \"Strong hire, low fire\" labor market surprises economists Axios Solid Jobs Report Leaves Inflation, Markets to Settle Fed\u2019s December Call WSJ", "source": "Google News Business", "pub_date_str": "07 Nov 2026, 12:49 AM IST", "pub_date_relative": "40m ago"}, {"title": "Microsoft is winding down Oracle deal to rent AI cloud capacity, Bloomberg News reports", "full_content": "", "source": "Investing.com News", "pub_date_str": "07 Nov 2026, 12:48 AM IST", "pub_date_relative": "41m ago"}, {"title": "AI data centers took a beating in the midterm elections. A reckoning may be ahead for tech giants - AP News", "full_content": "AI data centers took a beating in the midterm elections. A reckoning may be ahead for tech giants AP News Voters rebuff data centers in every ballot measure except one during the 2026 midterms CNBC Silicon Valley\u2019s Very Bad Night The Atlantic The Election Day Revolt That Threatens America\u2019s AI Boom WSJ America got the anti-data-center wave it voted for. Here come the economic consequences CNN", "source": "Google News Business", "pub_date_str": "07 Nov 2026, 12:46 AM IST", "pub_date_relative": "44m ago"}, {"title": "Raymond James cuts Axon stock price target on federal delays", "full_content": "", "source": "Investing.com News", "pub_date_str": "07 Nov 2026, 12:42 AM IST", "pub_date_relative": "47m ago"}, {"title": "Fake job interview scams like the one that hit Binance are getting more sophisticated. Here are the new signs to watch for", "full_content": "Job search scams can cost applicants hundreds or thousands of dollars. But one fake job interview recently impacted over $6 billion in assets.\n\nBinance, the world's largest cryptocurrency exchange, announced on Tuesday it recently experienced a security breach impacting $6.34 billion in digital assets . The hack was enabled in part by a job seeker's nightmare: bogus job interviews.\n\nWhile the Binance hackers had their sights set on a much bigger target than an individual job seeker, job-related scams are on the rise. The FBI's Internet Crime Complaint Center (IC3) tallied employment-related losses amounting to roughly $363 million in 2025, up sharply from $264 million the year prior, and $70 million in 2023. The actual figure is likely higher, since many victims of such crimes do not report them.\n\nThose orchestrating fake job scams have many potential targets today \"because the job search is taking so long for so many right now,\" says Stefanie Fackrell, a former recruiter at Google and Nvidia. While October's jobs report showed promise as the U.S. economy added 165,000 jobs, far more than expected, many applicants have been struggling through a low-hire, low-fire market for months.\n\n\"With today's job market, people are anxious, they're tired, many are at their wits' end,\" says Leeza Garber, a privacy and cybersecurity expert and adjunct law professor at Drexel University's Kline School of Law. \"A proactive inquiry can be something you just immediately respond to without thinking.\"\n\nArtificial intelligence can also make scams more widespread and harder to detect.\n\n\"Cyber scams in general are becoming much more sophisticated just because they're evolving at the same speed as AI and public access to AI,\" says Garber. \"AI is going to make things seem more and more real.\"\n\nIn 2025, victims reported losses of almost $13 million to AI-involved employment scams, according to the IC3.", "source": "CNBC Top News", "pub_date_str": "07 Nov 2026, 12:39 AM IST", "pub_date_relative": "50m ago"}, {"title": "Americans are on a 'treadmill of high inflation' and more rate hikes are likely, Fed's Daly says", "full_content": "San Francisco Federal Reserve President Mary Daly said Friday she expects the central bank will need to raise interest rates further, but joined her fellow policymakers in saying the pace and timing remain uncertain.\n\n\"My expectation is we're going to have to tighten policy further. Exactly when and how much is still to be decided because we just have to take all the variables that are coming in,\" Daly told CNBC's Steve Liesman during a live interview. \"More is likely to be needed, and certainly ... I'm prepared to do that if that's what the economy calls for.\"\n\nThe remarks came the same day the Bureau of Labor Statistics reported that the U.S. economy added 165,000 jobs in October while the unemployment rate \u2014 the labor-market variable Fed officials focus on most \u2014 edged lower to 4.1%.\n\nThose numbers were substantially better than Wall Street expectations. Job creation, in fact, was nearly triple the Dow Jones consensus estimate.\n\nDaly called the report \"good news for American workers,\" but noted the pressure inflation is exerting on household finances. Average hourly earnings rose 3.1% annually in October, but the September inflation rate as measured by the consumer price index was 3.7%.\n\n\"They see that they can get jobs, they continue to spend. They're not out of the game, but they are on a treadmill of high inflation,\" she said. \"This has been high for too long, almost six years, and we're really starting to feel the burden of that spread everywhere.\"\n\nThe policymaker said she's not concerned generally about economic growth but worried about the persistence of inflation.\n\n\"The job market remains stable and solid, but not booming, and you see real wages falling because those wages are not really keeping up with inflation,\" Daly said. \"I think that's the crux of this. Good news on the jobs front, not so clear that Americans are going to gain ground in the labor market.\"", "source": "CNBC Finance", "pub_date_str": "07 Nov 2026, 12:35 AM IST", "pub_date_relative": "55m ago"}, {"title": "Live updates: Bitcoin holds in narrow range, stocks bounce after strong October jobs report - CoinDesk", "full_content": "Live updates: Bitcoin holds in narrow range, stocks bounce after strong October jobs report CoinDesk Markets live: US stocks rebound after tech rout Financial Times Blowout jobs report rescues stocks from brutal tech rout USA Today Stock Market Today: Dow wavers, S&P 500 and Nasdaq bounce after AI carnage led to worst day for tech since 2020 and as traders digest hot jobs report; U.S. stocks on track for weekly losses MarketWatch A Routine Bounce Is Only the First Step RealMoney Pro", "source": "Google News Business", "pub_date_str": "07 Nov 2026, 12:34 AM IST", "pub_date_relative": "55m ago"}, {"title": "India A Vs New Zealand A Live Streaming: When And Where To Watch 3rd Unofficial Test", "full_content": "The four-day match will serve as preparation for India's upcoming two-Test series against New Zealand, beginning November 19.", "source": "NDTV Profit", "pub_date_str": "07 Nov 2026, 12:26 AM IST", "pub_date_relative": "1h ago"}, {"title": "Data center double-down: Hassett says blue wave won't stop AI build-out", "full_content": "National Economic Council Director Kevin Hassett said Friday he expects data center growth to continue as projected, despite the blue-wave election that saw voters overwhelmingly favor limiting the tech infrastructure buildout.\n\nHassett, on CNBC's \" Squawk on the Street ,\" acknowledged the dozens of measures on states' midterm ballots seeking to constrain data centers, a crucial part of President Donald Trump 's push to win the global artificial intelligence race.\n\nIn at least 46 of the roughly 50 such initiatives on ballots in 2026, majorities voted to restrict development of the facilities, according to Ballotpedia's tally.\n\n\"We respect the localities that decide that's what they want to do,\" Hassett said. \"But America is a big place, and right now, the data centers scheduled over the next couple of years aren't affected by these ballot initiatives.\"\n\n\"And the stuff after that, you know, there's plenty of room in the U.S. for data center growth to continue, as it was projected ahead of the election,\" he said.\n\nHassett said he expects data centers will continue to expand in states with more welcoming governors, and he suggested that even hostile states will eventually come around.\n\n\"That's exactly what's going to happen,\" he said. \"That, or what'll happen will be that the benefits of the data centers will be so obvious that people decide to change their minds about the way they regulate them.\"\n\nHassett also blamed Thursday's tech-driven market plunge on \"uncertainty about what the political change is going to mean for data centers going forward.\"", "source": "CNBC Top News", "pub_date_str": "07 Nov 2026, 12:24 AM IST", "pub_date_relative": "1h ago"}, {"title": "Cybertruck\u2019s run comes to an end as Musk kills off pricey pet project", "full_content": "The Cybertruck failed to catch on with car buyers due to high prices and some notable recalls.", "source": "MarketWatch Top Stories", "pub_date_str": "07 Nov 2026, 12:24 AM IST", "pub_date_relative": "1h ago"}, {"title": "My adviser recommended an annuity. Is it the right move in this market environment?", "full_content": "\u201cI haven\u2019t committed to the strategy yet and would appreciate some independent perspectives.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "07 Nov 2026, 12:23 AM IST", "pub_date_relative": "1h ago"}, {"title": "US economy outstrips forecasts to add 165,000 jobs in October", "full_content": "Hiring rebound reinforces expectations Federal Reserve will raise interest rates", "source": "FT Markets", "pub_date_str": "07 Nov 2026, 12:15 AM IST", "pub_date_relative": "1h ago"}, {"title": "Microsoft plans to use fewer neoclouds as AI buildout shows signs of strain", "full_content": "Microsoft is shrinking its roster of neocloud partners as it focuses on work with a few key suppliers and builds out its own data centers, according to people familiar with the matter.\n\nThe software giant's plans pose another potential challenge for a corner of the artificial intelligence market that's showing signs of strain due to rising borrowing costs, hefty debt loads and concerns about whether the buildout will slow down.\n\nMicrosoft has forged relationships in recent years with a number of neoclouds, including CoreWeave , Nebius, Chronoscale , IREN , Lambda and Nscale, as well as with Oracle , which is pouring money into building out AI infrastructure.\n\nMicrosoft is now in the evaluation stage and hasn't decided which neoclouds it will stop using, said two sources, who asked not to be named because the talks are confidential. One of the people said Microsoft wants to prioritize its own data center footprint. Bloomberg reported on the plans earlier. Two people said that Microsoft opted not to renew a deal with Oracle.\n\nA Microsoft spokesperson said in an emailed statement that its infrastructure strategy is \"built on flexibility and choice.\"\n\n\"We combine Microsoft-owned datacenters, leased facilities and strategic partnerships with third-party providers to deliver the capacity our customers need, where and when they need it,\" the spokesperson said. \"We regularly review these investments against customer demand. That includes tracking delivery and adjusting plans as circumstances change.\"\n\nThe neoclouds have been a turbulent trade on Wall Street in recent weeks as rising interest rates added to fears that many companies have become overly reliant on debt in rushing to build capacity. Shares of CoreWeave, Nebius and IREN are all down by roughly half over the past month even after rallying on Friday.\n\nA recent industry review counted 323 neoclouds , and experts have predicted that many of them won't survive.", "source": "CNBC World Economy", "pub_date_str": "07 Nov 2026, 12:10 AM IST", "pub_date_relative": "1h ago"}, {"title": "Mohammed Shami Retires From Test Cricket, Ends India's Pace Star's Red-Ball Journey", "full_content": "The announcement comes after the pacer was overlooked for India's upcoming Test series against New Zealand.", "source": "NDTV Profit", "pub_date_str": "07 Nov 2026, 12:10 AM IST", "pub_date_relative": "1h ago"}, {"title": "OpenAI, Arm and Qualcomm executives react to post-midterm AI sell-off", "full_content": "As a post-midterm rally Wednesday turned into a steep sell-off Thursday, tech executives sought to look through the notion that potential data center constraints could be catastrophic for their businesses.\n\nIn response to a Democratic sweep of Congress as well as a sizeable number of state governorships and legislatures in the midterm election Tuesday night, stocks initially rallied Wednesday, posting their best day in more than 18 months as President Trump accepted the blowout results with little fanfare.\n\nThe tide quickly turned Thursday, however, with stocks selling off sharply as investors feared a potential slowdown in the data center build-out after wins by candidates in favor of data center regulation in states like Texas and the possibility that the artificial intelligence trade may be past its peak. Tech led the sell-off , with the \"Magnificent Seven\" losing over $1 trillion in aggregate market cap.\n\nHere's how tech executives reacted to the midterms and sell-off threat:\n\nHaas characterized the postelection fear as \"very, very short term thinking\" and not likely to be a major threat to Arm's business in the long term, but said the U.S. must keep investing in the data center build-out before the rest of the world catches up.\n\n\"If the U.S. hesitates in any way, shape, or form in terms of data center build-out, the rest of the world is ready and willing. There is just huge demand for this capacity,\" Haas told CNBC's \"Squawk on the Street\" Thursday.\n\nFriar told CNBC's Sara Eisen Friday that OpenAI will continue investing in data center infrastructure after voters resoundly rejected data centers in their backyards during the midterm election. The company will also focus on community concerns, including electricity. \"We will never raise your electricity bill,\" Friar said. \"When I think about the midterms, I need to keep thinking about how do we keep investing to meet that customer demand.", "source": "CNBC World Economy", "pub_date_str": "07 Nov 2026, 12:05 AM IST", "pub_date_relative": "1h ago"}, {"title": "Investors lose \u20b9100 cr in Stockal Securities scam; how to file a complain and can you recover the money?", "full_content": "Nearly 30 Indian retail investors have suffered losses exceeding \u20b9 100 crore in a suspected trading scam involving Bengaluru-headquartered fintech platform Stockal Securities, Moneycontrol reported.\n\nThe accounts of users were allegedly accessed without authorisation, following which their US stock portfolios were liquidated.\n\nStockal Securities is registered with the Securities and Exchange Board of India ( SEBI ). It enables Indian investors to invest in US-listed stocks, exchange-traded funds (ETFs) and other foreign securities.\n\nThe incident took place on October 15, with investors claiming that their holdings in prominent US companies such as Apple, Tesla, Nvidia and Amazon were liquidated and the proceeds were used to purchase shares of Zhibao Technology Inc., a relatively thinly traded Chinese company listed in the US.\n\nThe preliminary loss estimate of over \u20b9 100 crore is based on information shared by investors. However, the final extent of the financial losses is yet to be ascertained, the news organisation stated.\n\nLegal responsibility may rest with the Indian fintech platform, its US brokerage partner, or both, depending on the party that controlled the security and transaction, Alay Razvi, Managing Partner at Accord Juris, told Livemint .\n\nStockal\u2019s parent, Borderless, said in a statement that DriveWealth notified it of unauthorised trading activity in 13 customer accounts and that an unauthorised third party appears to have accessed 26 accounts using valid login credentials.\n\nThough unauthorised trades occurred in 13 accounts, replacing large-cap holdings with thinly traded microcaps, no funds were withdrawn, it added. Stockal has also denied evidence of a platform breach and has attributed the incident to possible credential compromise or social engineering.", "source": "LiveMint Money", "pub_date_str": "07 Nov 2026, 12:03 AM IST", "pub_date_relative": "1h ago"}, {"title": "Could the US midterms put a pin in the AI bubble? - BBC", "full_content": "Could the US midterms put a pin in the AI bubble? BBC OpenAI, Arm and Qualcomm executives react to post-midterm AI sell-off CNBC Stock Market Suffers Ugly Losses In Election Week; Apple, Palantir Led Key Earnings: Weekly Review Investor's Business Daily The Midterms Rattled AI Stocks. Here\u2019s What to Watch in the Broader Economy. Council on Foreign Relations Stock Futures Rise With Tuesday\u2019s Midterms Looming Barron's", "source": "Google News Business", "pub_date_str": "07 Nov 2026, 12:02 AM IST", "pub_date_relative": "1h ago"}, {"title": "A new phase in the tech market correction", "full_content": "Investors are no longer pricing in accelerating AI growth", "source": "FT Markets", "pub_date_str": "06 Nov 2026, 11:54 PM IST", "pub_date_relative": "1h ago"}, {"title": "AST SpaceMobile is so desperate for launch they're building their own rocket - Ars Technica", "full_content": "AST SpaceMobile is so desperate for launch they're building their own rocket Ars Technica Firefly inks $1.3 billion deal to supply engines for new AST SpaceMobile 'Blacklift' rocket Reuters Why Firefly Aerospace Stock Went to the Moon Today Yahoo Finance AST SpaceMobile to develop own rocket using Firefly engines SpaceNews AST SpaceMobile to Build Own Rocket to Compete With SpaceX Bloomberg.com", "source": "Google News Business", "pub_date_str": "06 Nov 2026, 11:50 PM IST", "pub_date_relative": "1h ago"}, {"title": "AI crush is powering one stock to sky-high valuations", "full_content": "The 2026 midterm elections have profoundly altered the national regulatory environment, most notably with Democrats securing control of both chambers of the U.S. Congress and notching big victories in traditionally business-friendly states like Texas and South Carolina.\n\nOver the past two decades, Southern states like Florida and Texas have attracted massive corporate migration from blue states. With less regulation and lower taxes. Those same benefits also attracted many people seeking lower taxes, lower housing costs, and better economic opportunities. With this political shift, relocated companies may now face a landscape increasingly focused on energy and building constraints, and tighter legislative oversight.\n\nInformation technology, semiconductors, and traditional energy sectors experienced immediate headwinds following the election. Companies at the forefront of the AI boom, such as CoreWeave, Tesla, and SpaceX, saw share prices slide as markets priced in tighter Democratic regulatory oversight and potential restrictions on AI deployment. Senator Bernie Sanders, for example, reposted his efforts to advance a data center moratorium proposal he co-authored with New York Congresswoman and socialist Alexandria Ocasio-Cortez.\n\nThe market is suddenly realizing that, between shifts in Washington and in states like Texas, the fastest-growing area of the U.S. economy might grind to a halt. Over half of the U.S. hyperscale data center pipeline could now face heightened regulatory friction. To build new facilities, even assuming they get permitted at all, developers may face tax increases, strict \"bring your own power\" mandates, or new air-permit delays for on-site gas plants.", "source": "CNBC Top News", "pub_date_str": "06 Nov 2026, 11:45 PM IST", "pub_date_relative": "1h ago"}, {"title": "\u2018It feels like he\u2019s quietly building a separate life\u2019: My husband inherited $500,000, but he refuses to spend it on our home", "full_content": "\u201cOur kitchen dates from 1999 and the oven only works if you hit the door a certain way.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "06 Nov 2026, 11:45 PM IST", "pub_date_relative": "1h ago"}, {"title": "Why The Blue Tsunami Rattled AI Stocks - Investor's Business Daily", "full_content": "Why The Blue Tsunami Rattled AI Stocks Investor's Business Daily AI crush is powering one stock to sky-high valuations CNBC Why Amazon and Other AI Data-Center Stocks Will Be Post-Midterm Winners Barron's Musk And Dell Lose Nearly $50 Billion\u2014As Bezos, Page And Brin Gain After Election Day Forbes AI stocks will \u2018come back in vogue\u2019 but AI data center buildout will slow after Democrat sweep \u2013 BofA (SP500:) Seeking Alpha", "source": "Google News Business", "pub_date_str": "06 Nov 2026, 11:34 PM IST", "pub_date_relative": "1h ago"}, {"title": "You\u2019re fired! But you can keep the laptop and insurance. And here\u2019s $10,000.", "full_content": "Some tech companies are giving more generous severance packages, but here\u2019s what to keep in mind.", "source": "MarketWatch Top Stories", "pub_date_str": "06 Nov 2026, 11:33 PM IST", "pub_date_relative": "1h ago"}, {"title": "Move Over Bugatti, BYD's Electric Hypercar Yangwang U9 Breaks 500 Kmph Barrier With New World Record \u2014 Watch", "full_content": "BYD's all-electric Yangwang U9 Xtreme hits 503.17 kmph in Abu Dhabi, setting a new production-car speed record and rewriting the limits of electric performance.", "source": "NDTV Profit", "pub_date_str": "06 Nov 2026, 11:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "I\u2019m 65 and worth more than $5.6 million. Can I afford a $200,000 camper?", "full_content": "Math may be cold and unemotional \u2014 but finances are not.", "source": "MarketWatch Top Stories", "pub_date_str": "06 Nov 2026, 11:30 PM IST", "pub_date_relative": "2h ago"}, {"title": "Everyone blames data centers for high electricity prices. But these are the real reasons. - The Washington Post", "full_content": "Everyone blames data centers for high electricity prices. But these are the real reasons. The Washington Post Even if Additional Capacity Resources Aren\u2019t Needed, New Data Loads Are Likely to Increase Market Prices RTO Insider Data centers raise Southwest power costs, study finds as Heinrich seeks ratepayer protections Organ Mountain News Could data centers drive up your electric bill? FOX Illinois Growth shouldn\u2019t come at customers\u2019 expense The River Reporter", "source": "Google News Business", "pub_date_str": "06 Nov 2026, 11:30 PM IST", "pub_date_relative": "2h ago"}, {"title": "US stocks rebound after tech rout", "full_content": "Tech-heavy Nasdaq 100 up more than 1 per cent in afternoon trading following day of turmoil", "source": "FT Markets", "pub_date_str": "06 Nov 2026, 11:29 PM IST", "pub_date_relative": "2h ago"}, {"title": "ED Probes CoinDCX, Delta Exchange Over Suspected Illegal Foreign Crypto Transactions", "full_content": "The ED alleges the crypto platforms routed thousands of crores in customer transactions through overseas exchanges using USDT, bypassing FEMA's cross-border payment framework.", "source": "NDTV Profit", "pub_date_str": "06 Nov 2026, 11:27 PM IST", "pub_date_relative": "2h ago"}, {"title": "Mookuthi Amman 2 Box Office Collection Day 1: Nayanthara\u2019s Fantasy Comedy Opens To A Decent Start", "full_content": "Mookuthi Amman 2 has earned Rs 2.07 crore gross in India on Day 1. The Nayanthara starrer recorded 20.7% occupancy across 2,159 shows, selling 1,36,397 tickets in 777 theatres.", "source": "NDTV Profit", "pub_date_str": "06 Nov 2026, 11:23 PM IST", "pub_date_relative": "2h ago"}, {"title": "Democrats Target Apple, Meta And Elon Musk's Companies In Planned Congressional Probes. Here's Why", "full_content": "Apple and Nvidia pledged $25 million each towards Trump's proposed White House ballroom, which received $333 million in private donations.", "source": "NDTV Profit", "pub_date_str": "06 Nov 2026, 11:22 PM IST", "pub_date_relative": "2h ago"}, {"title": "Mumbai Fire: Blaze Breaks Out On 23rd Floor Of Ghatkopar High-Rise, Three Injured", "full_content": "The Mumbai Fire Brigade classified the incident as a Level-II fire as teams worked to bring the blaze under control.", "source": "NDTV Profit", "pub_date_str": "06 Nov 2026, 11:22 PM IST", "pub_date_relative": "2h ago"}], "cfa": [{"title": "OpenAI bugging suspect Alfozan pleads not guilty", "full_content": "The Saudi national charged with planting a listening device in the headquarters of OpenAI while he worked there pleaded not guilty on Friday during an appearance in San Francisco federal court.\n\nAbdulrahman Alfozan , 35, was sent back to jail after the brief hearing. Alfozan has been held without bail since his arrest on a criminal complaint in early October.\n\nHe faces a maximum possible sentence of five years in prison if convicted in the case.\n\nA grand jury indicted Alfozan on Oct. 27 on a single count of interception of oral communications, court records show.\n\nProsecutors say that he put a recording device in a television in an executive conference room at OpenAI's offices in San Francisco on Sept. 28.\n\nAlfozan's lawyer declined to comment after the hearing before Magistrate Judge Peter Kang.\n\nThe judge ordered Alfozan to next appear in court on Nov. 17.\n\nAlfozan is a venture partner in a Saudi Arabian venture capital firm, Raed Ventures .", "source": "CNBC World Economy", "pub_date_str": "07 Nov 2026, 01:28 AM IST", "pub_date_relative": "1m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Nasdaq attempts to recover from worst rout in 19 months as AI stocks see some buying: Live updates", "full_content": "The Nasdaq Composite rebounded on Friday as some investors bought the dip in chip stocks following a punishing sell-off that sent the index into correction territory.\n\nThe tech-heavy Nasdaq bounced by 1.5%. The S&P 500 rose 0.8%, while the Dow Jones Industrial Average traded around the flatline.\n\nWorries of a potential slowdown in data center construction following big Democratic wins in the House and Senate and key state governorships hit U.S. markets hard on Thursday.\n\nThe heavy selling Thursday sent the three major stock averages to their worst one-day losses since April 2025. The Nasdaq Composite tumbled 5.5%, closing more than 10% below its most recent high and putting it in what Wall Street regards as a correction. The broad-market S&P 500 lost 4.4%, while the Dow fell more than 1,800 points, or 3.4%.\n\nAll 11 sectors in the S&P 500 closed lower, but shares of companies tied to the AI build-out led the decline.\n\nDuring Friday's session, shares of Micron Technology were up 3% following a 17% decline on Thursday. Nvidia was up 2% after a 9% rout the day before and moved back into positive territory for the year.\n\n\"The scale of the falls in some of the market's biggest names has been striking. But it also highlights the concentration risk that has built up in U.S. equity markets,\" Stuart Clark, portfolio manager at Quilter, said by email.\n\n\"With a relatively small number of technology and semiconductor stocks now carrying so much weight, weakness in those names quickly translates into sizeable falls for the Nasdaq and S&P 500.\"", "source": "CNBC Top News", "pub_date_str": "07 Nov 2026, 01:24 AM IST", "pub_date_relative": "5m ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "A disturbing employment trend is hiding beneath the latest strong job numbers", "full_content": "Americans who lose their jobs these days are facing a harsh new problem: It's getting harder to find another one quickly.\n\nThe average jobless worker's bout of unemployment surpassed 27 weeks in October on a seasonally adjusted basis, according to Friday's jobs report from the Bureau of Labor Statistics. That amounts to a job search of nearly seven months, the longest outside of the pandemic period since 2016, when the U.S. labor market was finally getting back on track after the 2008 financial crisis.\n\nAbout 2 million Americans have been without work for at least 27 weeks, the BLS reported. People in this category are referred to as the \"long-term unemployed \" and accounted for 27.6% of all jobless workers in October, the highest share since late 2021.\n\n\"This is a series that can be noisy from month to month,\" said Cory Stahle, senior economist at Indeed, a hiring platform. \"But if you look over a longer time horizon, there is no mistake in the trend.\"\n\nIt's a troubling sign in an otherwise steady labor market. Workers stuck on the sidelines are a casualty of what's become a \"low-hire, low-fire\" job market, in which companies are hesitant to lay workers off, but aren't adding them either.\n\nResearch shows that Americans who experience long-term unemployment face depleted savings, lower earnings potential over time and declining mental health.\n\nWhat's more, workers who are unemployed for extended periods risk falling into a self-perpetuating cycle, researchers at the Federal Reserve Bank of Richmond wrote earlier this year .\n\n\"Time spent unemployed may itself reduce the probability of finding a job, perhaps because skills depreciate, networks thin or employers interpret long unemployment durations as a negative signal,\" the researchers warned.", "source": "CNBC Top News", "pub_date_str": "07 Nov 2026, 01:19 AM IST", "pub_date_relative": "10m ago", "cfa_topics": ["Quantitative Methods", "Economics", "Financial Statement Analysis"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "FBN Securities lowers Five9 stock price target on earnings guidance cut", "full_content": "", "source": "Investing.com News", "pub_date_str": "07 Nov 2026, 01:15 AM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Mississippi Senate: Longshot Ty Pinkins says he aimed to spoil Hyde-Smith, boost Colom vote", "full_content": "Longshot Mississippi Senate candidate Ty Pinkins said that at first wanted to win \u2014 but that he stayed in to spoil.\n\nPinkins told a local TV station that after an April poll showed he had no chance of winning he remained in the race in order to boost Democratic nominee Scott Colom's chances of beating Republican incumbent Sen. Cindy Hyde-Smith.\n\nColom is narrowly leading Hyde-Smith in ongoing counting by just 1,936 votes, a margin of just 0.2 percentage points, with 96.2% of the vote counted, according to the Associated Press. That margin is about one-tenth the size of Pinkins' share of the vote, 2.1 percentage points.\n\nPinkins has won just 20,010 votes so far out of the nearly 952,000 votes already counted.\n\n\"The only thing I did was stay in the race and let people shoot arrows at me,\" Pinkins said in an interview with WTVA in Mississippi on Thursday. \"That is it. And that's a ... low price to pay to get someone in this race that I think can help people in the Delta and all across this state.\"\n\n\"The portion of the vote that I drew \u2014 and people were concerned about splitting the Black vote \u2014 what I actually did was split the Republican vote,\" he said.\n\nPinkins told the station in Tupelo that he intentionally avoided campaigning in areas with large Black populations to avoid cutting into the vote share of Colom, who, like Pinkins , is Black.\n\nThat tactic worked, he said, as the election results show he got most of his support from areas with relatively low Black populations.", "source": "CNBC Top News", "pub_date_str": "07 Nov 2026, 01:14 AM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Top House Oversight Democrat warns Trump family to 'lawyer up'", "full_content": "Rep. Robert Garcia, the California Democrat poised to lead the powerful House Oversight Committee, doubled down on his warning to President Donald Trump and his allies Friday, releasing a video promising sweeping investigations into the administration.\n\n\"Oversight Democrats are ready to take on the crooks, the con men and the Trump crime family. Lawyer up,\" the California Democrat wrote on X .\n\n\"The American people have spoken, and they are tired of the unprecedented level of corruption coming out of this White House and under President Trump,\" Garcia said in the video, which ends with the words \"LAWYER UP\" splashed across the screen.\n\nThe warning comes three days after Democrats' sweeping midterm victories handed them control of the House. When the new Congress convenes in January, Democrats will gain control of the committee's subpoena power, allowing them to compel testimony and obtain documents in investigations that could target Trump, his family and his allies.\n\nGarcia said the committee would investigate what he described as potential corruption involving the Trump family's business dealings , cryptocurrency ventures and Pentagon contracts, as well as alleged abuses by Immigration and Customs Enforcement . He also vowed to scrutinize individuals he said were connected to convicted sex offender Jeffrey Epstein .\n\n\"Oversight Democrats are absolutely going to ensure that we investigate every single one of these instances,\" Garcia said. \"Now let's get to work.\"\n\nGarcia's approach may conflict with what some advisors are telling Democrats \u2014 to go after corporate interests rather than Trump and his family.\n\nGarcia, currently the committee's top Democrat, formally launched his bid to become chairman Thursday. He is widely expected to secure the position.", "source": "CNBC Top News", "pub_date_str": "07 Nov 2026, 01:12 AM IST", "pub_date_relative": "17m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Quick Mart IPO Draws Strong Demand as Kenyan Listings Pick Up", "full_content": "(Bloomberg) -- Quick Mart Plc saw demand for shares in its initial public offering exceed the number available by almost 23% as Kenya\u2019s second-biggest supermarket chain concluded the nation\u2019s second IPO of the year.\n\nInvestors applied for 2.45 billion shares at 7.50 shillings each in the Nairobi-based company while 2 billion were on offer, it said in a statement on Friday. The firm got 18,492 applications.\n\n\u201cThe board is delighted with the strong response,\u201d Quick Mart said.\n\nThe sale is a sign of a tentative revival in Kenyan equity-capital markets where there have been few listings. Quick Mart is only the second company to pursue an IPO this year in Nairobi after state-run Kenya Pipeline Co.\u2019s offer. Rising share prices have helped to create a more favorable backdrop for investors, with the nation\u2019s benchmark stocks gauge gaining 28% in dollar terms this year, placing it among the 10 best performers globally.\n\nJust over 18,000 Kenyan and East African retail investors received a full allocation of 119.6 million shares, while 44 foreign buyers got about 236 million shares, or just under half the number sought.\n\nFour so-called cornerstone investors are supporting the transaction, including Redwheel Group\u2019s RWC Asset Management LLP and 337 Frontier, an investment adviser set up in 2016 that\u2019s focused on frontier African equities. The World Bank\u2019s International Finance Corp. and the UK\u2019s Foreign, Commonwealth and Development Office \u2014 via its Mobilist program \u2014 are the other two.\n\nQuick Mart\u2019s current investors are using the IPO to reduce their stake, drawing attention to the exchange as an exit route for private equity funds, a rarely used path in Kenya. The company won\u2019t issue new stock or receive proceeds from the offer.\n\nThe sole owner, Sokoni Retail Kenya Ltd., is selling half of its stake. Sokoni is the vehicle through which the business\u2019s founder, John Kinuthia, and Adenia Partners hold their interests, with the Mauritius-based firm having a controlling stake.", "source": "LiveMint Markets", "pub_date_str": "07 Nov 2026, 01:09 AM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Corporate Issuers", "Alternative Investments", "Portfolio Management"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Nasdaq rebounds but remains on track for fourth straight weekly decline", "full_content": "", "source": "Investing.com News", "pub_date_str": "07 Nov 2026, 01:06 AM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "vVardis targets IPO at up to $24 per share", "full_content": "", "source": "Investing.com News", "pub_date_str": "07 Nov 2026, 12:58 AM IST", "pub_date_relative": "32m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "US labor market regains ground as job growth surges, unemployment rate falls to 4.1% - Reuters", "full_content": "US labor market regains ground as job growth surges, unemployment rate falls to 4.1% Reuters 'A blowout': US added 165,000 jobs in October, trouncing expectations Yahoo Finance Hiring jumps: The economy added 165,000 jobs last month NPR \"Strong hire, low fire\" labor market surprises economists Axios Solid Jobs Report Leaves Inflation, Markets to Settle Fed\u2019s December Call WSJ", "source": "Google News Business", "pub_date_str": "07 Nov 2026, 12:49 AM IST", "pub_date_relative": "40m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Fake job interview scams like the one that hit Binance are getting more sophisticated. Here are the new signs to watch for", "full_content": "Job search scams can cost applicants hundreds or thousands of dollars. But one fake job interview recently impacted over $6 billion in assets.\n\nBinance, the world's largest cryptocurrency exchange, announced on Tuesday it recently experienced a security breach impacting $6.34 billion in digital assets . The hack was enabled in part by a job seeker's nightmare: bogus job interviews.\n\nWhile the Binance hackers had their sights set on a much bigger target than an individual job seeker, job-related scams are on the rise. The FBI's Internet Crime Complaint Center (IC3) tallied employment-related losses amounting to roughly $363 million in 2025, up sharply from $264 million the year prior, and $70 million in 2023. The actual figure is likely higher, since many victims of such crimes do not report them.\n\nThose orchestrating fake job scams have many potential targets today \"because the job search is taking so long for so many right now,\" says Stefanie Fackrell, a former recruiter at Google and Nvidia. While October's jobs report showed promise as the U.S. economy added 165,000 jobs, far more than expected, many applicants have been struggling through a low-hire, low-fire market for months.\n\n\"With today's job market, people are anxious, they're tired, many are at their wits' end,\" says Leeza Garber, a privacy and cybersecurity expert and adjunct law professor at Drexel University's Kline School of Law. \"A proactive inquiry can be something you just immediately respond to without thinking.\"\n\nArtificial intelligence can also make scams more widespread and harder to detect.\n\n\"Cyber scams in general are becoming much more sophisticated just because they're evolving at the same speed as AI and public access to AI,\" says Garber. \"AI is going to make things seem more and more real.\"\n\nIn 2025, victims reported losses of almost $13 million to AI-involved employment scams, according to the IC3.", "source": "CNBC Top News", "pub_date_str": "07 Nov 2026, 12:39 AM IST", "pub_date_relative": "50m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Americans are on a 'treadmill of high inflation' and more rate hikes are likely, Fed's Daly says", "full_content": "San Francisco Federal Reserve President Mary Daly said Friday she expects the central bank will need to raise interest rates further, but joined her fellow policymakers in saying the pace and timing remain uncertain.\n\n\"My expectation is we're going to have to tighten policy further. Exactly when and how much is still to be decided because we just have to take all the variables that are coming in,\" Daly told CNBC's Steve Liesman during a live interview. \"More is likely to be needed, and certainly ... I'm prepared to do that if that's what the economy calls for.\"\n\nThe remarks came the same day the Bureau of Labor Statistics reported that the U.S. economy added 165,000 jobs in October while the unemployment rate \u2014 the labor-market variable Fed officials focus on most \u2014 edged lower to 4.1%.\n\nThose numbers were substantially better than Wall Street expectations. Job creation, in fact, was nearly triple the Dow Jones consensus estimate.\n\nDaly called the report \"good news for American workers,\" but noted the pressure inflation is exerting on household finances. Average hourly earnings rose 3.1% annually in October, but the September inflation rate as measured by the consumer price index was 3.7%.\n\n\"They see that they can get jobs, they continue to spend. They're not out of the game, but they are on a treadmill of high inflation,\" she said. \"This has been high for too long, almost six years, and we're really starting to feel the burden of that spread everywhere.\"\n\nThe policymaker said she's not concerned generally about economic growth but worried about the persistence of inflation.\n\n\"The job market remains stable and solid, but not booming, and you see real wages falling because those wages are not really keeping up with inflation,\" Daly said. \"I think that's the crux of this. Good news on the jobs front, not so clear that Americans are going to gain ground in the labor market.\"", "source": "CNBC Finance", "pub_date_str": "07 Nov 2026, 12:35 AM IST", "pub_date_relative": "55m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Live updates: Bitcoin holds in narrow range, stocks bounce after strong October jobs report - CoinDesk", "full_content": "Live updates: Bitcoin holds in narrow range, stocks bounce after strong October jobs report CoinDesk Markets live: US stocks rebound after tech rout Financial Times Blowout jobs report rescues stocks from brutal tech rout USA Today Stock Market Today: Dow wavers, S&P 500 and Nasdaq bounce after AI carnage led to worst day for tech since 2020 and as traders digest hot jobs report; U.S. stocks on track for weekly losses MarketWatch A Routine Bounce Is Only the First Step RealMoney Pro", "source": "Google News Business", "pub_date_str": "07 Nov 2026, 12:34 AM IST", "pub_date_relative": "55m ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Data center double-down: Hassett says blue wave won't stop AI build-out", "full_content": "National Economic Council Director Kevin Hassett said Friday he expects data center growth to continue as projected, despite the blue-wave election that saw voters overwhelmingly favor limiting the tech infrastructure buildout.\n\nHassett, on CNBC's \" Squawk on the Street ,\" acknowledged the dozens of measures on states' midterm ballots seeking to constrain data centers, a crucial part of President Donald Trump 's push to win the global artificial intelligence race.\n\nIn at least 46 of the roughly 50 such initiatives on ballots in 2026, majorities voted to restrict development of the facilities, according to Ballotpedia's tally.\n\n\"We respect the localities that decide that's what they want to do,\" Hassett said. \"But America is a big place, and right now, the data centers scheduled over the next couple of years aren't affected by these ballot initiatives.\"\n\n\"And the stuff after that, you know, there's plenty of room in the U.S. for data center growth to continue, as it was projected ahead of the election,\" he said.\n\nHassett said he expects data centers will continue to expand in states with more welcoming governors, and he suggested that even hostile states will eventually come around.\n\n\"That's exactly what's going to happen,\" he said. \"That, or what'll happen will be that the benefits of the data centers will be so obvious that people decide to change their minds about the way they regulate them.\"\n\nHassett also blamed Thursday's tech-driven market plunge on \"uncertainty about what the political change is going to mean for data centers going forward.\"", "source": "CNBC Top News", "pub_date_str": "07 Nov 2026, 12:24 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Microsoft plans to use fewer neoclouds as AI buildout shows signs of strain", "full_content": "Microsoft is shrinking its roster of neocloud partners as it focuses on work with a few key suppliers and builds out its own data centers, according to people familiar with the matter.\n\nThe software giant's plans pose another potential challenge for a corner of the artificial intelligence market that's showing signs of strain due to rising borrowing costs, hefty debt loads and concerns about whether the buildout will slow down.\n\nMicrosoft has forged relationships in recent years with a number of neoclouds, including CoreWeave , Nebius, Chronoscale , IREN , Lambda and Nscale, as well as with Oracle , which is pouring money into building out AI infrastructure.\n\nMicrosoft is now in the evaluation stage and hasn't decided which neoclouds it will stop using, said two sources, who asked not to be named because the talks are confidential. One of the people said Microsoft wants to prioritize its own data center footprint. Bloomberg reported on the plans earlier. Two people said that Microsoft opted not to renew a deal with Oracle.\n\nA Microsoft spokesperson said in an emailed statement that its infrastructure strategy is \"built on flexibility and choice.\"\n\n\"We combine Microsoft-owned datacenters, leased facilities and strategic partnerships with third-party providers to deliver the capacity our customers need, where and when they need it,\" the spokesperson said. \"We regularly review these investments against customer demand. That includes tracking delivery and adjusting plans as circumstances change.\"\n\nThe neoclouds have been a turbulent trade on Wall Street in recent weeks as rising interest rates added to fears that many companies have become overly reliant on debt in rushing to build capacity. Shares of CoreWeave, Nebius and IREN are all down by roughly half over the past month even after rallying on Friday.\n\nA recent industry review counted 323 neoclouds , and experts have predicted that many of them won't survive.", "source": "CNBC World Economy", "pub_date_str": "07 Nov 2026, 12:10 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "OpenAI, Arm and Qualcomm executives react to post-midterm AI sell-off", "full_content": "As a post-midterm rally Wednesday turned into a steep sell-off Thursday, tech executives sought to look through the notion that potential data center constraints could be catastrophic for their businesses.\n\nIn response to a Democratic sweep of Congress as well as a sizeable number of state governorships and legislatures in the midterm election Tuesday night, stocks initially rallied Wednesday, posting their best day in more than 18 months as President Trump accepted the blowout results with little fanfare.\n\nThe tide quickly turned Thursday, however, with stocks selling off sharply as investors feared a potential slowdown in the data center build-out after wins by candidates in favor of data center regulation in states like Texas and the possibility that the artificial intelligence trade may be past its peak. Tech led the sell-off , with the \"Magnificent Seven\" losing over $1 trillion in aggregate market cap.\n\nHere's how tech executives reacted to the midterms and sell-off threat:\n\nHaas characterized the postelection fear as \"very, very short term thinking\" and not likely to be a major threat to Arm's business in the long term, but said the U.S. must keep investing in the data center build-out before the rest of the world catches up.\n\n\"If the U.S. hesitates in any way, shape, or form in terms of data center build-out, the rest of the world is ready and willing. There is just huge demand for this capacity,\" Haas told CNBC's \"Squawk on the Street\" Thursday.\n\nFriar told CNBC's Sara Eisen Friday that OpenAI will continue investing in data center infrastructure after voters resoundly rejected data centers in their backyards during the midterm election. The company will also focus on community concerns, including electricity. \"We will never raise your electricity bill,\" Friar said. \"When I think about the midterms, I need to keep thinking about how do we keep investing to meet that customer demand.", "source": "CNBC World Economy", "pub_date_str": "07 Nov 2026, 12:05 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Investors lose \u20b9100 cr in Stockal Securities scam; how to file a complain and can you recover the money?", "full_content": "Nearly 30 Indian retail investors have suffered losses exceeding \u20b9 100 crore in a suspected trading scam involving Bengaluru-headquartered fintech platform Stockal Securities, Moneycontrol reported.\n\nThe accounts of users were allegedly accessed without authorisation, following which their US stock portfolios were liquidated.\n\nStockal Securities is registered with the Securities and Exchange Board of India ( SEBI ). It enables Indian investors to invest in US-listed stocks, exchange-traded funds (ETFs) and other foreign securities.\n\nThe incident took place on October 15, with investors claiming that their holdings in prominent US companies such as Apple, Tesla, Nvidia and Amazon were liquidated and the proceeds were used to purchase shares of Zhibao Technology Inc., a relatively thinly traded Chinese company listed in the US.\n\nThe preliminary loss estimate of over \u20b9 100 crore is based on information shared by investors. However, the final extent of the financial losses is yet to be ascertained, the news organisation stated.\n\nLegal responsibility may rest with the Indian fintech platform, its US brokerage partner, or both, depending on the party that controlled the security and transaction, Alay Razvi, Managing Partner at Accord Juris, told Livemint .\n\nStockal\u2019s parent, Borderless, said in a statement that DriveWealth notified it of unauthorised trading activity in 13 customer accounts and that an unauthorised third party appears to have accessed 26 accounts using valid login credentials.\n\nThough unauthorised trades occurred in 13 accounts, replacing large-cap holdings with thinly traded microcaps, no funds were withdrawn, it added. Stockal has also denied evidence of a platform breach and has attributed the incident to possible credential compromise or social engineering.", "source": "LiveMint Money", "pub_date_str": "07 Nov 2026, 12:03 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Could the US midterms put a pin in the AI bubble? - BBC", "full_content": "Could the US midterms put a pin in the AI bubble? BBC OpenAI, Arm and Qualcomm executives react to post-midterm AI sell-off CNBC Stock Market Suffers Ugly Losses In Election Week; Apple, Palantir Led Key Earnings: Weekly Review Investor's Business Daily The Midterms Rattled AI Stocks. Here\u2019s What to Watch in the Broader Economy. Council on Foreign Relations Stock Futures Rise With Tuesday\u2019s Midterms Looming Barron's", "source": "Google News Business", "pub_date_str": "07 Nov 2026, 12:02 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "A new phase in the tech market correction", "full_content": "Investors are no longer pricing in accelerating AI growth", "source": "FT Markets", "pub_date_str": "06 Nov 2026, 11:54 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "AI crush is powering one stock to sky-high valuations", "full_content": "The 2026 midterm elections have profoundly altered the national regulatory environment, most notably with Democrats securing control of both chambers of the U.S. Congress and notching big victories in traditionally business-friendly states like Texas and South Carolina.\n\nOver the past two decades, Southern states like Florida and Texas have attracted massive corporate migration from blue states. With less regulation and lower taxes. Those same benefits also attracted many people seeking lower taxes, lower housing costs, and better economic opportunities. With this political shift, relocated companies may now face a landscape increasingly focused on energy and building constraints, and tighter legislative oversight.\n\nInformation technology, semiconductors, and traditional energy sectors experienced immediate headwinds following the election. Companies at the forefront of the AI boom, such as CoreWeave, Tesla, and SpaceX, saw share prices slide as markets priced in tighter Democratic regulatory oversight and potential restrictions on AI deployment. Senator Bernie Sanders, for example, reposted his efforts to advance a data center moratorium proposal he co-authored with New York Congresswoman and socialist Alexandria Ocasio-Cortez.\n\nThe market is suddenly realizing that, between shifts in Washington and in states like Texas, the fastest-growing area of the U.S. economy might grind to a halt. Over half of the U.S. hyperscale data center pipeline could now face heightened regulatory friction. To build new facilities, even assuming they get permitted at all, developers may face tax increases, strict \"bring your own power\" mandates, or new air-permit delays for on-site gas plants.", "source": "CNBC Top News", "pub_date_str": "06 Nov 2026, 11:45 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Why The Blue Tsunami Rattled AI Stocks - Investor's Business Daily", "full_content": "Why The Blue Tsunami Rattled AI Stocks Investor's Business Daily AI crush is powering one stock to sky-high valuations CNBC Why Amazon and Other AI Data-Center Stocks Will Be Post-Midterm Winners Barron's Musk And Dell Lose Nearly $50 Billion\u2014As Bezos, Page And Brin Gain After Election Day Forbes AI stocks will \u2018come back in vogue\u2019 but AI data center buildout will slow after Democrat sweep \u2013 BofA (SP500:) Seeking Alpha", "source": "Google News Business", "pub_date_str": "06 Nov 2026, 11:34 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "US stocks rebound after tech rout", "full_content": "Tech-heavy Nasdaq 100 up more than 1 per cent in afternoon trading following day of turmoil", "source": "FT Markets", "pub_date_str": "06 Nov 2026, 11:29 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "ED Probes CoinDCX, Delta Exchange Over Suspected Illegal Foreign Crypto Transactions", "full_content": "The ED alleges the crypto platforms routed thousands of crores in customer transactions through overseas exchanges using USDT, bypassing FEMA's cross-border payment framework.", "source": "NDTV Profit", "pub_date_str": "06 Nov 2026, 11:27 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Derivatives", "Alternative Investments"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "UCO Bank fined \u20b915,000 for delay in revising widow\u2019s family pension despite official instructions: Here's what happened", "full_content": "The District Consumer Disputes Redressal Commission in Chandigarh has directed UCO Bank to pay \u20b9 15,000 in compensation to a widow for failing to revise her family pension despite receiving instructions from the disbursing authorities, according to a report by The Tribune.\n\nThe commission held the bank responsible for deficiency in service, noting that the delay caused the complainant hardship and mental harassment. It rejected the bank\u2019s defence that it had subsequently cleared the pending arrears, observing that the family\u2019s suffering during the period of delay could not be overlooked.\n\nThe complaint was filed by Rupnagar resident Sukhwinder Singh on behalf of his mother, Prakash Kaur. Her husband, Nasib Singh, had retired from the Chandigarh Transport Undertaking (CTU) on March 31, 1995, and his pension was sanctioned in accordance with the applicable rules.\n\nFollowing his death on November 28, 2001, the family pension was transferred to Prakash Kaur with effect from November 29, 2001. However, subsequent revisions to the pension were allegedly not implemented correctly.\n\nThe complainant alleged that despite several communications from the pension-sanctioning authorities, repeated visits to the UCO Bankbranch in Rupnagar and formal representations, the bank failed to release the revised family pension and other admissible benefits.\n\nThese included the applicable old-age allowance, Leave Travel Concession ( LTC ) benefits and revised medical allowances.\n\nDuring the proceedings, the bank's counsel argued that UCO Bank had no role in sanctioning or determining the pension and was only responsible for maintaining the pension account and facilitating withdrawals.\n\nThe bank denied any deliberate delay or deficiency in service, maintaining that the delay was bona fide and occurred during the recalculation and verification of the pension claim.", "source": "LiveMint Money", "pub_date_str": "06 Nov 2026, 11:20 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "What\u2019s next for your portfolio after the decline in Big Tech stocks?", "full_content": "Also in Weekend Reads: Ideas for generating investment income, new tax brackets, buying a home with cash and advice from the Moneyist.", "source": "MarketWatch Top Stories", "pub_date_str": "06 Nov 2026, 11:17 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Gold, silver turn volatile after strong US jobs data, but remain on track to snap multi-week losing streaks", "full_content": "A Ksheerasagar Published 6 Nov 2026, 10:55 PM IST Prefer Livemint on Google Gold and silver prices were trading lower in Friday's session, as stronger-than-expected US jobs data reinforced expectations that the Federal Reserve could raise interest rates at its policy meeting next month.\n\nOn the Multi Commodity Exchange (MCX), the December gold futures contract was down \u20b9 1,700 per 10 grams to \u20b9 1,42,930 at the time of writing. The decline came after the yellow metal extended its gains for a second consecutive session, putting it on track to snap a three-week losing streak. Gold has gained nearly \u20b9 4,000 so far this week.\n\nSimilarly, silver futures were down 1.26% at \u20b9 1,84,800 per kilogram. Despite the decline, the white metal remained on track for its first weekly gain in five weeks. Silver had surged by more than \u20b9 5,700 this week, although it remains down around \u20b9 50,000 so far in 2026.\n\nThe US Labor Department reported on Friday that American employers added 165,000 jobs in October, more than double economists' expectations of 65,000. The figure was also significantly higher than the average monthly gain of 48,000 recorded over the preceding 12 months.\n\nThe stronger-than-expected employment data reinforced confidence in the resilience of the US economy, while raising concerns that persistent economic strength could give the Federal Reserve more room to tighten monetary policy to contain inflation.\n\nInvestors now increasingly expect the Fed to raise another 25 basis points at its December policy meeting.", "source": "LiveMint Markets", "pub_date_str": "06 Nov 2026, 10:55 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Derivatives", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics t
