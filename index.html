on: Will it settle or add to confusion in the stock market?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "11 Oct 2026, 11:00 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Fixed Income", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "HCL Tech Q2 Preview: Will the IT major narrow its guidance? 5 things to watch out for", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a Earnings \u203a HCL Tech Q2 Preview: Will the IT major narrow its guidance? 5 things to watch out for JM Financial Share Price Choice International Share Price IIFL Capital Services Share Price Anand Rathi Share & Stock Brokers Share Price SMC Global Securities Share Price The Economic Times daily newspaper is available online now. Read Today's Paper HCL Tech Q2 Preview: Will the IT major narrow its guidance? 5 things to watch out for SECTIONS HCL Tech Q2 Preview: Will the IT major narrow its guidance? 5 things to watch out for By Akash Podishetti , ETMarkets.com Last Updated: Oct 11, 2026, 10:54:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis HCL Tech is set to announce its September quarter results on October 12, with brokerages expecting 12% year-on-year profit growth and 16% revenue growth. Acquisitions, deal ramp-ups and seasonal strength are likely to support performance. Investors will track FY27 revenue guidance, margin trends, discretionary spending, deal wins and AI-led pricing pressures for clues on the company\u2019s growth outlook.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "11 Oct 2026, 10:54 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Nifty target: 27,000 in 1-year - Why Emkay stock market experts are bullish despite poor performance", "full_content": "The Nifty 50 could rally 20% to 27,000 by September 2027, according to Emkay Global Financial Services , which remains constructive on Indian equities despite a prolonged market correction, elevated crude oil prices and global uncertainties.\n\nThe domestic benchmark indices rose on Friday, 9 October, snapping their longest weekly losing streak in 25 years, although gains remained modest amid concerns over tighter monetary policy and rising crude oil prices. The Nifty 50 climbed 1.3% to 22,520.45, while the BSE Sensex advanced 1.23% to 72,472.33, led by IT stocks after Tata Consultancy Services' quarterly earnings highlighted growing AI-related revenue contributions and robust international business growth.\n\nDespite Friday's rebound, the Nifty 50 declined for eight consecutive weeks, falling 8.7% over the period.\n\nAgainst this backdrop, Emkay sees scope for a recovery as resilient corporate earnings, reasonable valuations and strong domestic fundamentals support the market. The brokerage has set a September 2027 target of 27,000 for the Nifty 50, implying an upside of around 20% at a valuation of 18.8 times one-year forward earnings.\n\nEmkay expects earnings growth to remain healthy in the September quarter, even as geopolitical tensions, trade uncertainty and elevated developed-market bond yields weigh on investor sentiment.\n\nThe brokerage estimates that companies under its coverage will report 24.8% year-on-year revenue growth and 21.5% adjusted profit growth in Q2 FY27. Energy, utilities and automobiles are expected to lead revenue growth.\n\nFor the Nifty 50, excluding banking, financial services and insurance (BFSI), Emkay expects revenue to grow 28% year-on-year and profit after tax (PAT) to rise 21.6%.\n\nIndustrials are expected to lead sectoral earnings growth, with PAT projected to rise 78.7%, followed by metals and mining at 74.9%. Utilities and automobiles are also expected to deliver strong growth, with projected PAT increases of 42.6% and 41.2%, respectively.", "source": "LiveMint Markets", "pub_date_str": "11 Oct 2026, 10:51 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Fixed Income", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Thai Bourse Revises Short-Selling, High-Frequency Trading Rules", "full_content": "(Bloomberg) -- Thailand\u2019s stock exchange will roll out revised rules from Nov. 16, including changes to short-selling and high-frequency trading, as it seeks to improve market stability, liquidity and investor confidence, according to a filing.\n\nThe Stock Exchange of Thailand will allow stocks priced between 5 baht (15 US cents) and 50 baht to trade in smaller price increments, a move aimed at narrowing bid-ask spreads and reducing trading costs, according to the statement.\n\nThe bourse will also limit short selling to more liquid securities, including SET100 shares, underlying securities of single-stock futures, depositary receipts and exchange-traded funds.\n\nUnder the new rules, investors will be allowed to short-sell a security at a value equal to or higher than its latest traded price. The SET will also impose additional fees on accounts that submit large numbers of orders but execute relatively few trades.\n\nThe exchange will also scrap dynamic price bands, which limit how far individual securities can move within a certain period, for individual securities to reduce trading barriers; cut restrictions on what high-frequency traders can buy and sell; and get rid of minimum resting-time requirements to improve order-management efficiency.\n\nThe SET will also extend morning hours for transactions in derivative warrants and ETFs linked to foreign securities from Nov. 16. Trading will start at 8 a.m., two hours earlier than at present, and closing times will remain unchanged, according to a separate filing.\n\nThe new measures were approved by Thailand\u2019s Securities and Exchange Commission following a public consultation, the SET said.\n\nCatch all the Business News , Market News , Breaking News Events and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.", "source": "LiveMint Markets", "pub_date_str": "11 Oct 2026, 10:46 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments", "Derivatives"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Car loan rates start at 7.35%: Check EMIs and processing fees of 18 lenders", "full_content": "A car loan can help a borrower spread the cost of a vehicle over several years. Still, interest rates and other expenses can affect the overall cost of borrowing. This makes it vital for aspiring car loan applicants to diligently compare lending institutions on aspects such as interest rates, equated monthly instalment (EMI), and processing charges.\n\nSuch an approach can go a long way in helping borrowers acknowledge and understand the overall cost before applying. It can also assist in better financial planning and towards devising a strategic approach towards car loan EMI repayments.\n\nAs per the data compiled by Paisabazaar , car loan interest rates among 18 lending institutions begin from 7.35% per annum. UCO Bank, for example, has the lowest starting rate. This is followed by other prominent lending institutions such as Maharashtra Bank and Canara Bank, both offering car lorates starting at 7.45%.\n\nFor a simple example, on a \u20b9 5 lakh car loan for 5 years, the EMI at UCO Bank ranges primarily from \u20b9 9,983 to \u20b9 10,624 depending on the applicable interest rate. On similar lines, at Bank of Maharashtra, the EMI ranges from \u20b9 10,007 to \u20b9 11,059. Keeping in mind these fundamentals, the complete list is discussed below:\n\nIt is vital to note that the interest rate range varies widely across lending institutions. Punjab and Sindh Bank has the widest range in the table, from 7.55% to 14.05%, whereas Bank of India charges between 7.60% and 12.55%. Hence, borrowers should note that the final interest rate offered may depend on factors such as their credit profile , loan amount, tenure, and lender-specific eligibility criteria.\n\nThe applicable processing fee is yet another vital aspect that requires proper consideration. The Central Bank of India and Indian Overseas Bank have nil processing fees. Whereas, UCO Bank charges about 0.5%, subject to a maximum of \u20b9 5,000.", "source": "LiveMint Money", "pub_date_str": "11 Oct 2026, 10:41 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Retirement corpus can't be treated as monthly income for maintenance, Delhi High Court clarifies in matrimonial dispute", "full_content": "Retirement savings cannot be treated as a substitute for monthly income when courts decide maintenance claims, the Delhi High Court has clarified. While the accumulated retirement corpus may be considered when assessing a person's overall financial resources, only the interest and other returns actually generated from investments can be counted as recurring income.\n\nIn its 8 October judgment in Meenakshi Batra v. Vijay Kumar Batra, a Division Bench of Justices Vivek Chaudhary and Renu Bhatnagar said a retired person cannot be expected to consume accumulated retirement savings simply because the corpus is substantial. However, the court also made clear that having savings does not automatically disqualify a spouse from claiming maintenance.\n\nThe ruling came while the court dismissed an appeal filed by a retired Central government teacher seeking interim maintenance from her husband, a retired Army officer, during matrimonial proceedings. The court found that the woman had sufficient independent income and financial resources to meet her reasonable needs while the proceedings were pending.\n\nThe dispute arose after the Family Court in Delhi rejected the wife's application for interim maintenance in April 2022. It had noted that both spouses were retired government employees receiving pensions and had sufficient financial resources to support themselves.\n\nThe wife challenged the order, arguing that the Family Court had treated her retirement benefits and savings as a continuing source of income without properly assessing her expenses and the husband's financial position.\n\nThe High Court said the distinction between accumulated capital and income generated from that capital was important when assessing a maintenance claim.\n\n\"The retirement corpus is accumulated capital,\" the court observed, adding that it could not be treated as monthly income merely because the amount was substantial.", "source": "LiveMint Money", "pub_date_str": "11 Oct 2026, 10:22 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "India expanding trade footprint to strengthen global ties and empower MSMEs: Piyush Goyal", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a India expanding trade footprint to strengthen global ties and empower MSMEs: Piyush Goyal The Economic Times daily newspaper is available online now. Read Today's Paper India expanding trade footprint to strengthen global ties and empower MSMEs: Piyush Goyal SECTIONS India expanding trade footprint to strengthen global ties and empower MSMEs: Piyush Goyal ANI Last Updated: Oct 11, 2026, 10:23:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India is increasing its network of free trade agreements (FTAs) to integrate deeply with global economies. Nine trade pacts covering 38 developed economies have been concluded in the past four and a half years. The trade pacts are not merely confined to bureacratic corridors but also include discussions with stakeholders. India is wrapping up deals with Canada and UK while pursuing energy deals with GCC and trade relations in West Asia and Americas.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\nWhat is the real impact of 13x jump in cash transfers to women?\n\nThe NBFC saga - Part 2: Line drawn in 2006 is reason for the headlines today\n\nAirlines Q2 turbulence: Fewer passengers, rising fares and a crude shock\n\nBritannia\u2019s next big bet for young India lies beyond biscuits\n\nThe world is witnessing a bond rout. Why should it matter to you?\n\nQ2 earnings season: Will it settle or add to confusion in the stock market?", "source": "Economic Times Economy", "pub_date_str": "11 Oct 2026, 09:59 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "IPO calendar: After a week of lull, 5 companies to raise nearly Rs 1,600 crore this week", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a IPO calendar: After a week of lull, 5 companies to raise nearly Rs 1,600 crore this week The Economic Times daily newspaper is available online now. Read Today's Paper IPO calendar: After a week of lull, 5 companies to raise nearly Rs 1,600 crore this week SECTIONS IPO calendar: After a week of lull, 5 companies to raise nearly Rs 1,600 crore this week By Akash Podishetti , ETMarkets.com Last Updated: Oct 11, 2026, 10:26:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Five IPOs are scheduled to open for subscription next week, including mainboard issues from HD Fire Protect, Fusion CX and Sahajanand Medical Technologies. The three mainboard offerings span fire protection, customer experience and medical devices, alongside two SME issues.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "11 Oct 2026, 09:54 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Adani Power shares up 27% in 2026 but Elara sees 16% more upside - What\u2019s powering stock? Target price", "full_content": "Adani Power shares have gained 27% so far in 2026, and domestic brokerage Elara Capital has initiated coverage on the stock with an \u2018Accumulate\u2019 rating and a target price of \u20b9 220, implying an upside of over 16% from its closing price of \u20b9 189 on the BSE on Friday, 9 October.\n\nIn its coverage initiation report, Elara Capital said the company offers strong medium-term growth visibility, supported by a substantial capacity expansion pipeline, increasing long-term power purchase agreement (PPA) coverage and opportunities in the merchant power market. However, the brokerage cautioned that much of the company's growth potential is already reflected in its current valuation.\n\nElara Capital has set its target price at \u20b9 220, based on 12 times its estimated FY29 enterprise value-to-EBITDA (EV/EBITDA).\n\nHowever, Adani Power shares have remained under pressure in the near term, declining 4.04% over the past week and 6.90% over two weeks. The stock has fallen 11.89% in the past month and 12.62% over the last three months, indicating sustained weakness in recent trading.\n\nElara Capital believes thermal power will continue to play a crucial role in India's power system over the near- to medium-term by providing reliable, dispatchable baseload electricity to complement the growing share of renewable energy.\n\nThe brokerage noted that the intermittent nature of renewable energy, transmission constraints and increasing grid-balancing requirements reinforce the need for dependable thermal generation. Battery energy storage systems and pumped storage are also expected to play a complementary role as renewable energy penetration rises.\n\nAgainst this backdrop, coal-based power is likely to remain important for India's energy security.", "source": "LiveMint Markets", "pub_date_str": "11 Oct 2026, 09:44 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Income tax on gold jewellery: ITAT says CBDT limits cannot cap family holdings, deletes \u20b920.45 lakh addition", "full_content": "Families may accumulate gold jewellery over decades through weddings, inheritance and gifts. When the Income Tax Department finds jewellery during a search, the absence of old purchase bills can make it difficult to establish when and how the gold was acquired.\n\nIn a ruling involving Ankur Sharma, the Delhi bench of the Income Tax Appellate Tribunal (ITAT) held that the tax department cannot mechanically restrict the quantity of jewellery accepted as explained to the limits mentioned in Central Board of Direct Taxes (CBDT) instructions. The tribunal deleted a \u20b9 20.45 lakh addition to Sharma\u2019s taxable income after considering the family\u2019s financial circumstances and income-tax returns.\n\nThe order was pronounced on 6 October 2023 in ITA No. 1843/Del/2022 for assessment year 2019-20. It concerned gold jewellery worth \u20b9 1.46 crore found at the family\u2019s residence in Ghaziabad during an income-tax search.\n\nDuring the search, officials found 3,877.5 grams of gold jewellery valued at \u20b9 1.46 crore at the family\u2019s residence. The family explained that the jewellery had accumulated over generations and included gold inherited by the father, jewellery received at weddings and gifts given during family ceremonies.\n\nThe assessing officer accepted 2,250 grams of jewellery for nine family members, applying the quantities referred to in CBDT Instruction No. 1916, dated 11 May 1994, and a CBDT press release issued on 1 December 2016.\n\nThe remaining 1,627.5 grams, valued at \u20b9 61.35 lakh, was treated as unexplained jewellery. The officer divided the amount equally among Sharma, his father and his brother, adding \u20b9 20.45 lakh to each person\u2019s income.\n\nThe addition to Sharma\u2019s income was made under Section 69A read with Section 115BBE of the Income-tax Act, 1961.", "source": "LiveMint Money", "pub_date_str": "11 Oct 2026, 09:42 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Private equity can cut \u2018best\u2019 deals in current climate, says Permira boss", "full_content": "Lower valuations and reduced competition should help sector to \u2018exceptional returns\u2019, says Dipan Patel", "source": "FT Markets", "pub_date_str": "11 Oct 2026, 09:30 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Company FD rates: Muthoot Capital, Manipal Housing offer up to 8.95%; check the rates offered by 10 firms", "full_content": "Company fixed deposits (FDs) also known as Corporate Fixed deposits, can provide investors with meaningful fixed returns over a predetermined period. Still, it is vital to note that company fixed deposits carry issuer-specific credit and liquidity risks. This makes it important for aspiring investors to carefully analyse and assess more than just the headline interest rate before investing.\n\nAs per data compiled by Paisabazaar, Muthoot Capital Services offers the highest interest rate among prominent financial institutions. The firm is offering 8.95% per annum for a 3-year (i.e., 36-month) deposit. On similar lines, Manipal Housing Finance Syndicate offers up to 8%, whereas Bajaj Finance offers up to 7.75%. With these essentials in mind, let us take a look at the detailed table.\n\nMuthoot Capital Services offers the highest rate in the table at 8.95% for a three-year deposit. Its rates for one-year and five-year deposits stand at 7.90% and 8.50%, respectively. Manipal Housing Finance Syndicate offers 8% for one-, two- and three-year deposits.\n\nBajaj Finance offers 7.75% for deposits with tenures ranging from 31 to 60 months. Shriram Finance offers 7.50% for three- to five-year deposits , while Can Fin Homes offers the same rate for a 36-month tenure.\n\nSenior citizen investors generally receive an additional 0.25-0.50 percentage point over the applicable regular interest rate. Shriram Finance offers an additional 0.50%, while Sundaram Home Finance and Can Fin Homes offer up to 0.50%, depending on the applicable terms.\n\nShriram Finance also provides an additional 0.05% per annum for aspiring women investors and 0.15% per annum on eligible renewals of matured deposits, as per the compiled data.", "source": "LiveMint Money", "pub_date_str": "11 Oct 2026, 09:05 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Global private equity fuels Indian healthcare\u2019s push into smaller cities", "full_content": "Hospitals flush with foreign money are expanding rapidly and filling gaps in public infrastructure", "source": "FT Markets", "pub_date_str": "11 Oct 2026, 08:32 AM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Trump Says Ukraine Needs New Leader Who Can Deal With Putin", "full_content": "Zelenskyy previously blasted the US decision to help release Russian diesel fuel into the global markets, which includes a Treasury waiver for some sanctioned Russian fuel.", "source": "NDTV Profit", "pub_date_str": "11 Oct 2026, 07:56 AM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "PFRDA brings NPS Tatkal to PhonePe and BHIM: How to open an NPS account online in 3 simple steps?", "full_content": "The National Pension System (NPS) Tatkal facility is now available on PhonePe and BHIM, allowing eligible users to open a pension account through a three-step digital process. The facility offers a simpler route to start retirement savings through payment apps, reducing the effort involved in registering for the scheme.\n\nThe Pension Fund Regulatory and Development Authority (PFRDA) announced the availability of the facility in a post on X on 6 October. The move brings NPS account opening to widely used digital payment platforms, potentially making it easier for first-time investors to begin planning for retirement. However, users should check their bank's eligibility and understand the scheme's investment risks and withdrawal rules before opening an account.\n\nPFRDA's announcement outlines a three-step process for opening an NPS account through the supported payment apps. Users can access the NPS Tatkal facility, enter the required details and select an eligible bank account, and complete the initial contribution through UPI.\n\nOnce the details and payment are successfully verified, the subscriber can obtain a Permanent Retirement Account Number (PRAN), which serves as the unique identification number for the NPS account.\n\nUsers should check whether the NPS Tatkal option is available on their app and whether their bank is supported before starting the process. Not every bank account linked to a payment app will necessarily be eligible for onboarding.\n\nThe minimum initial contribution reported for NPS Tatkal is \u20b9 250. Users should verify the amount and applicable requirements displayed during registration before making the payment.\n\nOpening an account through a payment app does not change how NPS investments work. Contributions are invested in market-linked instruments, and returns depend on the performance of the selected pension fund and the investment options chosen by the subscriber.", "source": "LiveMint Money", "pub_date_str": "11 Oct 2026, 07:44 AM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Derivatives", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Holding shares in a company that is delisting? Check what happens to your investment; how to get your money back", "full_content": "While companies often seek to list their shares on stock exchanges, there can be instances when they choose to go the other way and withdraw their shares from the exchanges. This process is known as delisting.\n\nSuch an event limit a shareholder's ability to buy or sell the specified company's shares through the usual route, leaving them wondering what happens to the shares they hold and whether they can recover their investment.\n\nThe process of delisting securities for any company is governed by the markets regulator, Securities and Exchange Board of India ( SEBI ).\n\nA listed company\u2019s shares can be delisted from stock exchanges for several reasons. These include a company having insufficient market capitalisation, violating regulatory norms or facing financial distress leading it to file for bankruptcy, according to a blog post by Groww .\n\nDelisting can also be voluntary, when a company or its promoters decide to withdraw the shares from the stock exchanges. This happens when a company merges with another entity, undergoes amalgamation or is going through a long period of non-performance.\n\nWhen a company delists its shares, investors continue to own the shares they hold, but they can no longer trade them through the stock exchange (NSE or BSE or both) where the shares were listed.\n\nShareholders can still sell their holdings through the over-the-counter market, which involves finding a buyer outside a recognised stock exchange .\n\nThe impact on shareholders also depends on whether the delisting is voluntary or involuntary. The process, exit options available and implications for investors can differ depending on the circumstances of the delisting.", "source": "LiveMint Money", "pub_date_str": "11 Oct 2026, 07:43 AM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Derivatives", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Fading Aroma of Black Cardamom: A $480 million market may bloom while India's 'black gold' wilts", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Agriculture \u203a Fading Aroma of Black Cardamom: A $480 million market may bloom while India's 'black gold' wilts The Economic Times daily newspaper is available online now. Read Today's Paper Fading Aroma of Black Cardamom: A $480 million market may bloom while India's 'black gold' wilts SECTIONS Fading Aroma of Black Cardamom: A $480 million market may bloom while India's 'black gold' wilts By Prashant Mukherjee , ET Bureau Last Updated: Oct 11, 2026, 07:38:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India\u2019s large black cardamom industry is battling declining plantation health, crop diseases and climate change, threatening farmers\u2019 livelihoods in Sikkim. Once the world\u2019s largest producer, India has lost ground to Nepal, which now dominates global production. The Sikkim government is backing scientific research, improved planting material and disease-resistant varieties to revive the state\u2019s valuable black gold crop.\n\nWhat is the real impact of 13x jump in cash transfers to women?\n\nThe NBFC saga - Part 2: Line drawn in 2006 is reason for the headlines today\n\nAirlines Q2 turbulence: Fewer passengers, rising fares and a crude shock\n\nBritannia\u2019s next big bet for young India lies beyond biscuits\n\nThe world is witnessing a bond rout. Why should it matter to you?\n\nQ2 earnings season: Will it settle or add to confusion in the stock market?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "11 Oct 2026, 07:36 AM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Fixed Income", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "8th Pay Commission: Pensioners\u2019 association seeks 3.833 fitment factor and 6% annual increments", "full_content": "The 8th Pay Commission has completed its key meetings in Bengaluru on 8 October. In these meetings, the 3-member panel headed by Justice Ranjana Prakash Desai held discussions with prominent organisations and unions such as the Coordination Committee of Central Government Pensioners Associations, Karnataka; the Karnataka Posts and Telecommunications Pensioners' Association; the Karnataka Income Tax Pensioners' Association and the Karnataka Central Government Pensioners Association, among others.\n\nThis article focuses on the proposals and recommendations of the Karnataka Posts and Telecommunications Pensioners' Association presented to the 8th Pay Commission panel in its memorandum submitted earlier for the consideration of the 8th Pay Commission panel.\n\nThe reputed union has proposed several key changes, including a substantial increase in the minimum basic pay and pension under the 8th Central Pay Commission , recommending a fitment factor of 3.833. The proposals they submitted also seek meaningful changes to annual increments, minimum wage calculations, and family-unit norms.\n\nIt is also important to keep in mind that the recommendations are demands made by the association and have not been approved by the central government. Currently, the 3-member panel continues with its consultative process, with another key set of meetings beginning in Mumbai from 22 October 2026 lined up. Let us now check the proposals put forward by the union in detail.\n\nThe association has argued that existing pay and pension levels need to be revised to account for rising inflation, day-to-day expenses and living costs. Its principal demands include the following:\n\nNote: These are some of the union's proposed changes, not the approved 8th Pay Commission benefits.", "source": "LiveMint Money", "pub_date_str": "11 Oct 2026, 07:31 AM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Economics", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Top 5 stocks to buy under \u20b9100: NTPC Green, Jayaswal Neco, Sagility, SBFC, South Indian Bank by Sumeet Bagadia", "full_content": "Stocks to buy | Sumeet Bagadia's stock recommendations: The key benchmark indices of the Indian stock market staged a strong rebound on Friday, October 9, bringing an end to the Nifty 50 and Sensex\u2019s eight-week losing streak. The Nifty rose 1.30%, while the Sensex advanced 1.23%. Bank Nifty also recovered, gaining 1.36%. The rally was led by IT stocks following Tata Consultancy Services\u2019 September-quarter results, with buying extending to FMCG, auto and financial shares.\n\nThe macroeconomic backdrop remains challenging. Brent crude continued to trade above $100 a barrel, while WTI remained above $90. Comments from the US president on discussions with Iran offered some temporary relief, but tensions around the Strait of Hormuz and concerns over regional energy infrastructure have kept the risk of supply disruptions elevated. For India, persistently high oil prices pose risks to inflation, the import bill and the rupee.\n\nForeign investor selling remains a significant overhang. FIIs recorded net outflows of approximately \u20b9 39,779 crore in October so far, while domestic institutional investors (DIIs) bought around \u20b9 40,355 crore over the same period, broadly offsetting the foreign selling. Domestic institutional demand has provided an important cushion, absorbing much of the pressure from overseas investors and helping stabilise the market.\n\nSumeet Bagadia, Executive Director at Choice Broking, believes the Nifty 50 chart pattern is signalling improving short-term sentiment, although the broader structure remains weak below key moving averages. He said that PCR at 0.98 suggests a balanced derivatives setup, while India VIX eased to 14.375, reflecting reduced volatility. Sustaining the rebound and moving above resistance will be crucial for further improvement.\n\nOn the outlook for the Nifty 50 index, Sumeet Bagadia said, \u201cImmediate support for the Nifty 50 index is placed at 22,250\u201322,400, while 22,650\u201322,700 remains the key resistance zone.", "source": "LiveMint Markets", "pub_date_str": "11 Oct 2026, 07:30 AM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Economics", "Equity Investments", "Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Once-Hot AI Trade Leaves Korean Stocks Struggling for Buyers", "full_content": "South Korea spent much of this year as a poster child of the scorching global AI trade. Now, by almost every measure, the $4.3 trillion stock market is rapidly losing relevance with investors.", "source": "LiveMint Markets", "pub_date_str": "11 Oct 2026, 06:08 AM IST", "pub_date_relative": "6h ago", "cfa_to     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
