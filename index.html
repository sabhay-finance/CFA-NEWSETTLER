arket Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a Earnings \u203a ixigo Q2 profit at Rs 63 cr on robust show in hotel booking biz LE Travenues Technology Share Price The Economic Times daily newspaper is available online now. Read Today's Paper ixigo Q2 profit at Rs 63 cr on robust show in hotel booking biz SECTIONS ixigo Q2 profit at Rs 63 cr on robust show in hotel booking biz PTI Last Updated: Oct 17, 2026, 04:21:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Ixigo reported a remarkable turnaround with a consolidated net profit of Rs 63.42 crore for the September quarter, bouncing back from a net loss of Rs 3.46 crore from last year. The surge in hotel bookings played a key role in this financial upswing, leading to operational revenue of Rs 320.96 crore.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "17 Oct 2026, 04:21 PM IST", "pub_date_relative": "50m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Reliance Jio IPO GMP today: Listing-day jackpot or long-term bet? How should investors play Mukesh Ambani\u2019s mega IPO?", "full_content": "Reliance Jio IPO GMP today: The countdown to India\u2019s largest initial public offering (IPO) has begun. Jio Platforms IPO, backed by billionaire Mukesh Ambani\u2019s Reliance Industries Limited, is garnering heightened investors\u2019 interest ahead of the opening of its subscription period. Jio IPO\u2019s latest grey market premium (GMP) hints at 19.75% listing gains.\n\nJio Platforms is offering 27 crore new equity shares in the price band of between \u20b9 1,065 and \u20b9 1,119 per share to investors. Which makes the Jio IPO a \u20b9 30,213 crore issuance at the upper end of the price band. As all eyes are now on India\u2019s biggest ever IPO, let\u2019s understand whether the Jio IPO will be more than a listing day jackpot and long-term bet for investors.\n\nJio Platforms latest IPO GMP was recorded at \u20b9 221 at 2:02 pm on Saturday, October 17, as per media reports. With an upper price band of \u20b9 1,119 per share, the estimated listing price for the Jio Platforms IPO is \u20b9 1,340 (which is the sum of the upper price band and latest IPO GMP today). Considering the grey market premium of Jio Platforms IPO, the issue is likely to see 19.75% listing gain.\n\nInvestors must note that the grey market premium indicates demand for an issue in the unregulated market and is not an accurate representation of an IPO's listing day performance.\n\nThe IPO is a book-build issue of \u20b9 30,213 crores and an entirely fresh issue of 27 crore shares of \u20b9 30,213 crore. The IPO has fixed issue price band at \u20b9 1,065 to \u20b9 1,119 per share. The lot size for an application is 12 shares. The minimum amount a retail investor can put in Jio IPO is \u20b9 13,428 for 12 shares.\n\nThe IPO will open for subscriptions on October 21, 2026. The issue will close for subscription on October 23, 2026. The IPO allotment will likely be finalised for the Jio IPO on October 26, 2026.", "source": "LiveMint Markets", "pub_date_str": "17 Oct 2026, 04:17 PM IST", "pub_date_relative": "55m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "ICICI Bank Q2 Results: Net Profit Rises 20% To Rs 14,843 Crore; NIM Dips To 4.18%", "full_content": "ICICI Bank reported a 20.1% YoY rise in consolidated net profit to Rs 14,843 crore for the second quarter, compared with Rs 12,359 crore a year earlier.", "source": "NDTV Profit", "pub_date_str": "17 Oct 2026, 04:15 PM IST", "pub_date_relative": "56m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Made profits on Apple or Nvidia shares? Here's whether you can claim the \u20b91.25 lakh tax exemption in India", "full_content": "Finance Minister Nirmala Sitharaman recently indicated that the government will hear investors' views on long-term capital gains (LTCG) tax during upcoming Budget consultations, bringing equity taxation back into focus.\n\nThe discussion comes amid calls for tax relief, foreign investor outflows and concerns over the competitiveness of Indian equities.\n\nThose who put money in stocks and equity-oriented mutual funds are liable to pay tax on profits earned from selling them, though the applicable rate depends on whether the gains are short-term or long-term in nature.\n\nLong-term capital gains on eligible investments held for more than 12 months are exempt from tax up to \u20b9 1.25 lakh in a financial year.\n\nIndian investors who have made gains on global stocks such as Apple, Tesla and Nvidia may assume that the same exemption applies to their overseas investments. But, is that the case?\n\nThe one word answer to that question is no. \u201cThe exemption of \u20b9 1.25 lakh is available on certain long-term gains from qualifying Indian equity investments only and it does not benefit US-listed stocks,\u201d according to Gaurav Makhijani, Managing Partner at Makhijani Gera & Associates LLP.\n\nThe taxable capital gain on overseas shares is calculated by subtracting the cost of acquisition and eligible transfer-related expenses from the sale proceeds. Investors must also apply the prescribed foreign-exchange conversion rules to determine the gains in Indian rupees .\n\nUnlike listed Indian stocks, which require a holding period of 12 months and above for gains to qualify as long-term, shares listed on foreign exchanges are subject to a 24-month holding period to be considered as LTCG.", "source": "LiveMint Money", "pub_date_str": "17 Oct 2026, 04:14 PM IST", "pub_date_relative": "58m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "IDBI Bank Q2 Results: Net Profit Falls 39%, Net Interest Income Jumps Nearly 30%", "full_content": "Net interest income (NII) increased 28.7% to Rs 4,228 crore from Rs 3,285 crore in the year-ago quarter. Provisions stand at Rs 8.55 crore.", "source": "NDTV Profit", "pub_date_str": "17 Oct 2026, 04:14 PM IST", "pub_date_relative": "58m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Corporate Actions This Week: ICICI Prudential AMC, Tech Mahindra, LTM, IRFC And Angel One", "full_content": "Corporate actions for the week include dividend, stock split, buyback and bonus issue, featuring ICICI Prudedntial AMC, Tech Mahindra, LTM and Indian Railway Finance Corporation.", "source": "NDTV Profit", "pub_date_str": "17 Oct 2026, 04:09 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Parag Parikh Flexi Cap Fund cash falls to 9.77% after Rajeev Thakkar's \u2018single-digit\u2019 outlook: Where is the money going?", "full_content": "Parag Parikh Flexi Cap Fund, the country\u2019s largest active mutual fund scheme by AUM, has stepped up its investment deployment, reducing its allocation to cash and related instruments over the past six months.\n\nThe fund\u2019s factsheets show that its combined allocation to cash, debt and money market instruments, and arbitrage positions fell to 9.77% in September 2026 from 18.94% in March, nearly halving over six months. The share also dropped by 1.81 percentage points from 11.58% in August 2026. Here's what investors need to know.\n\nParag Parikh Flexi Cap Fund's September 2026 factsheet reiterates its focus on identifying individual investment opportunities rather than making allocation decisions primarily on the basis of macroeconomic conditions.\n\n\u201cWe continue to look at individual investments on their own merits and will not hesitate to invest if an opportunity looks attractive,\u201d the factsheet stated.\n\nIt added that the fund had about 9.77% in cash holdings, debt and money market instruments, and arbitrage positions that could be deployed into long-term investments at appropriate levels.\n\nThe March 2026 factsheet had reported the corresponding allocation at 18.94%, while the August factsheet put it at 11.58%. The successive declines indicate that the fund has been reducing its deployable reserves as investment opportunities emerge.\n\nIn his August 2026 communication to unitholders, Rajeev Thakkar, CIO - Equity and Director at PPFAS, said the fund was increasingly finding opportunities to invest.\n\n\u201cCash levels peaked at about 25%. They are down to about 14%-15% in Flexi Cap. We are increasingly finding opportunities to buy, and one may look forward to single-digit cash levels in some time,\u201d Thakkar said.", "source": "LiveMint Money", "pub_date_str": "17 Oct 2026, 03:55 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Trump waives broad new Russia sanctions and tariffs under Graham Act, citing national interest", "full_content": "President Donald Trump signed an executive order late Friday waiving parts of a recently enacted package of sanctions aimed at curbing Russia's ability to prosecute its war against Ukraine.\n\n\"I have submitted to the Congress a certification that the issuance of such a waiver is in the national interests of the United States,\" Trump wrote in Friday's order.\n\nThe House passed the Russia sanctions bill on Sept. 16, and Trump signed it into law two days later. The bill was introduced over a year ago, and its primary backer was the late Lindsey Graham , a veteran Republican senator who represented South Carolina.\n\nTitled the Lindsey O. Graham Sanctioning Russia and Iran Act of 2026 , the legislation targeted Russia's economy, intending to penalize the country over its continued full-scale invasion of Ukraine.\n\nThe act required the president to increase duties on all Russian goods imported into the U.S. by up to 500% no later than 30 days after enactment. It also required Trump to impose tariffs of up to 100% on countries including China and India that are among the top five purchasers of Russian crude oil or gas.\n\nTrump's latest order waives these two parts of the Graham Act and comes two days before the law's implementation deadline. However, the order preserves existing sanctions on Russia under earlier executive orders.\n\nThe law could also sanction Russian leaders, officials, and financial institutions, and expand sanctions on Iran.\n\nOil sales revenue is critical to funding Russia's war effort.", "source": "CNBC Top News", "pub_date_str": "17 Oct 2026, 03:50 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "HDFC Bank Q2 Results: Net Profit Below Estimates, Provisions Rise Marginally", "full_content": "HDFC Bank Ltd.'s second-quarter net profit rose 5.2% year-on-year to Rs 19,610 crore in the quarter ended Sept. 30, compared with the Bloomberg estimate of Rs 19,727.43 crore.", "source": "NDTV Profit", "pub_date_str": "17 Oct 2026, 03:50 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "ICICI Bank Q2 Results: Net profit jumps 20% YoY to Rs 14,843 crore, NII rises 18%", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a Earnings \u203a ICICI Bank Q2 Results: Net profit jumps 20% YoY to Rs 14,843 crore, NII rises 18% The Economic Times daily newspaper is available online now. Read Today's Paper ICICI Bank Q2 Results: Net profit jumps 20% YoY to Rs 14,843 crore, NII rises 18% SECTIONS ICICI Bank Q2 Results: Net profit jumps 20% YoY to Rs 14,843 crore, NII rises 18% By Veer Sharma , ETMarkets.com Last Updated: Oct 17, 2026, 03:56:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis ICICI Bank Q2 Results: Private lender ICICI Bank reported a net profit of Rs 14,843 crore in the second quarter of financial year 2027, marking 20.1% year-on-year increase from Rs 12,359 crore posted in the same period last year.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "17 Oct 2026, 03:47 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "IDBI Bank Q2 results: Net profit tanks 39% YoY to Rs 2,205 crore; NII dips 49% YoY", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a Earnings \u203a IDBI Bank Q2 results: Net profit tanks 39% YoY to Rs 2,205 crore; NII dips 49% YoY IDBI Bank Share Price Punjab National Bank Share Price Union Bank of India Share Price Bank of Baroda Share Price Indian Bank Share Price The Economic Times daily newspaper is available online now. Read Today's Paper IDBI Bank Q2 results: Net profit tanks 39% YoY to Rs 2,205 crore; NII dips 49% YoY SECTIONS IDBI Bank Q2 results: Net profit tanks 39% YoY to Rs 2,205 crore; NII dips 49% YoY By Veer Sharma , ETMarkets.com Last Updated: Oct 17, 2026, 03:44:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis IDBI Bank reported a 39% year-on-year profit decline to Rs 2,205 crore in Q2 FY27, impacted by a one-off gain in the previous year. Excluding this, profit rose 14%. Asset quality improved, deposits grew 17%, advances increased 18%, and net interest margins strengthened sequentially to 4.11%.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "17 Oct 2026, 03:44 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Q2FY27 Results Live Updates: ICICI Bank Net Profit Hits Rs 14,843 Crore; HDFC Bank Profit Below Estimates", "full_content": "HDFC Bank, ICICI Bank, Axis Bank, IDBI Bank, Yes Bank, and India Cements and more companies will announce their Q2 FY27 earnings today, October 17.", "source": "NDTV Profit", "pub_date_str": "17 Oct 2026, 03:41 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Dussehra 2026: 6 bad money habits to give up this festive season", "full_content": "Dussehra is a festival that symbolises the victory of good over evil. It will be celebrated on Tuesday, 20 October this year. Beyond its religious significance, the festival offers individuals an opportunity to reflect on financial habits that may be holding back long-term economic progress and prosperity.\n\nIn the same vein, it is vital to acknowledge that festive spending usually leads to increased shopping, travel, lavish expenses and celebrations. That is why managing money wisely is essential in order to avoid unnecessary debt and protect savings.\n\nYudhajit Baul, Founder of Yudhajit Financial Services Pvt Ltd, explained this in detail, stating, \u201cThis Dussehra , as we celebrate the triumph of good over evil, it is time to vanquish the financial demons holding your portfolio back. True financial liberation begins when you consciously choose to forego toxic habits such as failing to control your expenses, procrastinating on crucial savings, investments, and insurance, treating loans as a luxury rather than an absolute necessity, engaging in reckless trading and market speculation, and letting your hard-earned money be driven by volatile social media noise.\u201d\n\nKeeping these important observations in mind, let us now discuss six bad money habits that an individual should try to overcome this festive season in order to ensure long-term financial stability and economic well-being.\n\n1. Spending without a budget: Festive discounts, coupons, credit card offers, and lucrative looking deals can result in encouraging impulsive purchases and reckless financial decisions. That is why, to prepare for such a situation and address it objectively, it is wise for individuals to set a clear spending limit. Focus on prioritising essential expenses and avoid buying products and services simply because they are on sale.\n\n2. Delaying savings and investments: In order to grow meaningfully in life and career, it is important to save money.", "source": "LiveMint Money", "pub_date_str": "17 Oct 2026, 03:38 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Derivatives", "Portfolio Management"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Nwpx infrastructure director Roman sells $387k in stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Oct 2026, 03:31 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Trump exempts Russia from further sanctions mandated by new law", "full_content": "US president gives Putin a reprieve on threatened energy measures after cutting deal with Moscow to release diesel", "source": "FT Markets", "pub_date_str": "17 Oct 2026, 03:23 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Looking to purchase gold this festive season? Here's how to directly avail Tyohar BharatPe Gold Offer", "full_content": "Investors across India choose to purchase gold during the auspicious festive season during Dhanteras and Diwali and this year is no exception. For those looking to invest in digital gold, fintech company BharatPe has launched its \u2018Tyohar BharatPe Gold Offer\u2019 providing customers with 5% extra digital gold and prizes from a pool of \u20b9 20 lakh.\n\nThe financial services and UPI payments company has launched the limited-period campaign \u2014 from 11 October to 10 November 2026, across the BharatPe ecosystem to mark the festive season, it said in an official release.\n\n\u201cWith the Tyohar BharatPe Gold Offer, BharatPe aims to make digital gold investments more rewarding during the festive season. The campaign combines an assured additional gold benefit on eligible purchases with a leaderboard challenge, offering customers two ways to participate in the festive initiative,\u201d it stated.\n\nCustomers can access the offer directly through the Invest BharatPe app. The mobile application enables digital gold investments, setting up gold SIPs, and tracking of customer's holdings through a single platform.\n\nFounded in 2018, BharatPe launched India\u2019s first UPI interoperable QR code and in 2020 also launched a card acceptance terminal \u2014 BharatPe Swipe. It currently has a registered network of over 1.7 crore merchants across more than 450+ cities.\n\nIt is among the leading players in UPI offline transactions , processing over 450 million UPI transactions per month, with monthly Transaction Processed Value of \u20b9 12,000 crore. Its POS business processes payments of over \u20b9 27,000 crore annually on more than 1,25,000 machines.\n\nDisclaimer: This story is for educational purposes only. The views and recommendations made above are those of individual analysts or broking companies, and not of Mint.", "source": "LiveMint Money", "pub_date_str": "17 Oct 2026, 03:23 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Nifty reclaims 200 WMA; eyes further gains as key resistance shapes next move", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Nifty reclaims 200 WMA; eyes further gains as key resistance shapes next move The Economic Times daily newspaper is available online now. Read Today's Paper Nifty reclaims 200 WMA; eyes further gains as key resistance shapes next move SECTIONS Nifty reclaims 200 WMA; eyes further gains as key resistance shapes next move By Milan Vaishnav , ET CONTRIBUTORS Last Updated: Oct 17, 2026, 03:37:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Indian equity markets rebounded 2.78%, with the Nifty reclaiming its crucial 200-week moving average. However, weak momentum indicators and overhead resistance warrant caution. Banking, metal, media, pharma and IT stocks show relative strength. Investors should monitor key support levels, prioritise fundamentally strong stocks and maintain disciplined risk management strategies.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "17 Oct 2026, 03:19 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "What is Boccia at Para Asian Games 2026? Rules, How To Play And Indian Participants", "full_content": "The sports ministry has cleared 168 athletes in a 281-member contingent, with boccia accounting for two athletes, Sachin Chamaria and Anjali Devi.", "source": "NDTV Profit", "pub_date_str": "17 Oct 2026, 03:05 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Chart of the Week: The chip stock split", "full_content": "Losses across semi stocks have been unequal", "source": "FT Markets", "pub_date_str": "17 Oct 2026, 03:00 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Railway PSU stocks derailed! RVNL, IRFC, IRCON, RITES to IRCTC down 40% in yr- What went wrong? Experts explain", "full_content": "Railway PSU stocks: Top railway public sector undertaking stocks, including Rail Vikas Nigam Limited, Indian Railways Finance Corporation (IRFC), IRCON International, RITES, to Indian Railway Catering and Tourism Corporation (IRCTC), have seen a sharp decline of up to 40% over the past year.\n\nThe steep correction has left investors wondering what went wrong and whether the worst is over. Let\u2019s understand from experts, along with their take on railway PSU stocks outlook.\n\nThe decline in railway PSU stocks is more of a correction after decades of rally, according to Tushar Badjate, Director of Badjate Stock & shares Pvt Ltd.\n\n\"This is a valuation correction first and an earnings correction second. In 2023 and 2024, these stocks were priced for a decade of perfection. IRCTC hit an all-time high of \u20b9 1,318 in May 2024 and is now down about 61% from that peak. RVNL and IRFC have fallen between 45% and 53% from their 52-week highs,\u201d added Badjate while highlighting that three things went wrong for these PSU stocks.\n\nSlow growth and decline in margins were among the key things that went wrong for railway PSUs. \u201cWhat did not break is spending. Railway capex for FY27 is a record \u20b9 2.93 lakh crore. The money is flowing. It is just not reaching these companies at the old margins,\u201d highlighted Badjate.\n\nPSU stocks often attract heightened investor interest because of their government-backing, relative stability and long-term growth prospects. The sharp correction in railway PSU stocks is largely a result of investor expectations running ahead of fundamentals, according to Tushar Badjate.\n\nHowever earnings concerns are real and they are about margins not orders, underlined the expert.\n\n\u201cOrder books look healthy. RVNL has \u20b9 93,492 crore and RITES has a record \u20b9 9,445 crore. The problem is conversion. Only about \u20b9 40,000 crore of RVNL's book is actually under execution. Its EBITDA margin is just 4.4%.", "source": "LiveMint Markets", "pub_date_str": "17 Oct 2026, 02:53 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Anthropic\u2019s Clark says AI\u2019s impact accelerating quickly and could vastly boost US GDP", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Oct 2026, 02:48 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "BEL Q2 results 2026 date out | Market sees up to 16% YoY revenue growth, defence order may drop \u2014 share outlook in focus", "full_content": "BEL Q2 Results 2026 Date: The board of directors of Bharat Electronics Limited (BEL) has scheduled its meeting on 30 October 2026 to consider and approve the September 2026 quarter results for the current financial year. The defence stock announced this in an exchange filing on Friday. The market has estimated healthy Q2 results for the defence company in 2026. Various brokerages have predicted a double-digit revenue growth for the company, but its order flow is expected to drop YoY. Hence, the focus will be on the defence order that BEL received during the July to September 2026 quarter.\n\nAs mentioned above, the defence company informed the Indian exchanges about the board meeting date to announce Q2 Results 2026 through an exchange filing on Friday, saying, \u201cWe wish to inform that a meeting of the Board of Directors of the Company is scheduled to be held on Friday, 30th October, 2026 to consider and approve, inter alia, Unaudited Standalone & Consolidated Financial Results for the quarter ended 30th September, 2026.\u201d\n\nThe market is expecting a healthy report with a double-digit revenue growth for the BEL. According to Kotak Securities, BEL is expected to report Q2 revenue at \u20b9 6,720 crore, up 16% YoY. The brokerage has estimated the company's EBITDA at \u20b9 1,940 crore, with an EBITDA Margin of 28.90%. The Q2 profit growth is estimated 14.10% YoY at \u20b9 1,460 crore.\n\nAnother brokerage, Elara Securities, has predicted 12% YoY revenue growth for the July to September 2026 quarter, to \u20b9 6,487 crore. Elara's predicted EBITDA is \u20b9 1,778 crore, with an EBITDA margin of 27.40%. The brokerage has predicted Q2 net profit at \u20b9 1,778 crore.\n\nSpeaking on the BEL Q2 Results 2026, Mahesh M Ojha, VP \u2014 Research and Business Development at KC Securities, said, \u201cEven though BEL is expected to report a healthy profit and revenue growth, its order book is expected to shrink YoY.", "source": "LiveMint Markets", "pub_date_str": "17 Oct 2026, 02:43 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Best thematic factor-based mutual funds 2026: Which equity schemes lead in 1- 3- and 5-year CAGR returns?", "full_content": "Factor-based mutual funds follow specific investment characteristics, or factors, to select stocks rather than relying solely on a broad market outlook or a conventional market-cap-based approach.\n\nThese factors can include momentum, quality, low volatility, and alpha. Investors can access these strategies through actively managed funds as well as passive index funds and exchange-traded funds ( ETFs ).\n\nMomentum strategies invest in stocks that have demonstrated relatively strong price performance, betting that the trend may continue. Quality strategies focus on companies with characteristics such as consistent earnings, sound balance sheets, and efficient use of capital.\n\nLow-volatility strategies aim to select stocks that have historically experienced smaller price fluctuations than the broader market. Alpha-based strategies seek to outperform a benchmark through a defined stock-selection approach, while some indices combine multiple factors.\n\nDifferent factors can perform well or poorly across market cycles, and a strategy that leads over one period may lag over another. Here is how the leading schemes compare across 1-year, 3-year, and 5-year returns.\n\n*Source: Value Research, Direct plans, Returns as on 16 October 2026\n\nActive momentum strategies dominate the top five, with Motilal Oswal Active Momentum Fund leading at 20.30%. The Mirae Asset ETF combines momentum and quality factors with small-cap exposure.\n\nThis indicates that momentum-oriented strategies have featured prominently among the one-year leaders. However, recent performance alone does not establish whether the trend will continue.", "source": "LiveMint Money", "pub_date_str": "17 Oct 2026, 02:29 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "HDFC Bank Q2 Results: Net profit rises 5% to \u20b919,510 crore, NII jumps 10% in last quarter under outgoing CEO Jagdishan", "full_content": "HDFC Bank , India's largest private sector lender, on Saturday announced its financial results for the second quarter of FY27, posting growth in net profit and net interest income alongside an improvement in asset quality.\n\nIt reported a nearly 5% year-on-year (YoY) increase in standalone net profit to \u20b9 19,509.96 crore. The bank's profit after tax (PAT) was \u20b9 18,641.28 crore in the corresponding quarter of the previous financial year. On a sequential basis, net profit grew 2.83% from \u20b9 19,069.72 crore in the June 2026 quarter.\n\nNet interest income (NII), which represents the difference between interest earned and interest expended, increased 9.72% YoY to \u20b9 34,619.18 crore in Q2 FY27, compared with \u20b9 31,551.50 crore in the year-ago quarter. Total interest earned during the quarter stood at \u20b9 83,426.60 crore.\n\nThe bank's net interest margin (NIM) stood at 3.16% on total assets and 3.32% on interest-earning assets.\n\nThe quarter is also significant as it is expected to be the final earnings report under managing director and chief executive officer Sashidhar Jagdishan, whose tenure ends on October 26. Anup Bagchi is set to replace him.\n\nHDFC Bank reported an improvement in its gross non-performing asset (GNPA) ratio, which declined to 1.11% of gross advances as of September 30, 2026. This compared with 1.17% in the preceding quarter and 1.24% in the year-ago period.\n\nThe net non-performing asset (NNPA) ratio remained stable at 0.37%, indicating that the bank's reported net bad-loan ratio was unchanged.\n\nThe lender reported provisions and contingencies of \u20b9 3,570 crore for Q2FY27. Its total credit cost ratio stood at 0.44% during the quarter.", "source": "LiveMint Markets", "pub_date_str": "17 Oct 2026, 02:16 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "10 smallcap stocks surge up to 65% in 3 months despite market weakness", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News 10 smallcap stocks surge up to 65% in 3 months despite market weakness Written by Ritesh Presswala , ETMarkets.com | Oct 17, 2026, 02:23:49 PM IST 1 / 11 \u200bLittle Stars Over the past three months, the Nifty 50 has declined nearly 4%, while the Nifty Smallcap 350 index has shed around 2.5%, reflecting weakness across the broader market. However, the correction has not dampened the momentum in every corner of the small-cap space. Several stocks from the Nifty Smallcap 250 index have defied the broader trend, delivering impressive gains despite market volatility. We highlight 10 stocks that have rallied between 30% and 65% over the past three months.\n\nShares of Cupid have surged 66% over the past three months, climbing from Rs 213 to Rs 353.\n\nShares of Sterlite Technologies have rallied 60% in the past three months, rising from Rs 542 to Rs 867.\n\nShares of Welspun Corp have gained 53% over the past three months, advancing from Rs 1,680 to Rs 2,569.\n\nShares of PTC Industries have climbed 41% in the past three months, moving up from Rs 17,531 to Rs 24,673.\n\nShares of PVR Inox have risen 39% over the past three months, increasing from Rs 1,006 to Rs 1,400.\n\nShares of Cyient have advanced 39% in the past three months, gaining ground from Rs 859 to Rs 1,195.\n\nShares of Redington have jumped 39% over the past three months, rising from Rs 276 to Rs 384.", "source": "Economic Times Markets", "pub_date_str": "17 Oct 2026, 02:16 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Crypto\u2019s leverage machine finds new life beyond Bitcoin bets", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Crypto \u203a Crypto\u2019s leverage machine finds new life beyond Bitcoin bets The Economic Times daily newspaper is available online now. Read Today's Paper Crypto\u2019s leverage machine finds new life beyond Bitcoin bets SECTIONS Crypto\u2019s leverage machine finds new life beyond Bitcoin bets By Sidhartha Shukla , Bloomberg Last Updated: Oct 17, 2026, 01:57:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Despite a decline in crypto trading activities, there is a rising interest in traditional assets among investors. Open interest in real-world asset contracts has increased to $9 billion, claiming 14% of total volume. The transition marks a significant change in the derivatives markets as crypto inroads are being utilized for traditional trading. This shift indicates a maturation of the digital asset space, making it more accessible to mainstream investors.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "17 Oct 2026, 01:57 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Derivatives", "Alternative Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Reliance Jio IPO: From Dhirubhai Ambani's 1977 listing to Akash Ambani's mega issue - what's changed? Gen Z connect!", "full_content": "Nearly five decades after Reliance Industries first made its debit in the Indian markets, the Ambani family is preparing for another landmark listing. Jio Platforms. The telecom and digital services business led by Akash Ambani, plans to raise around $3.2 billion through an initial public offering (IPO) and is opening on October 21.\n\nThe issue is set to test whether the Reliance name alone can attract investors in a market increasingly focused on valuations, profitability and future growth.\n\nJio's proposed IPO comes at a time when India's investor base has changed significantly. The country has more than 130 million registered stock-market investors, nearly 40% of whom are below 30, according to National Stock Exchange of India data.\n\nReliance's relationship with individual investors dates back to November 1977, when founder Dhirubhai Ambani raised \u20b9 2.8 crore through the company's first public offering. The issue attracted around 58,000 investors and was subscribed seven times, according to Reliance's annual report.\n\nThe listing helped popularise direct equity ownership among Indian households with Reliance's annual shareholder meetings eventually grew into mass gatherings.\n\nUnder Mukesh Ambani, Reliance evolved from a textiles and chemicals business into India's most valuable company, with interests spanning energy, consumer goods and telecommunications. Its telecom arm, Jio, transformed the sector after entering the market a decade ago with inexpensive 4G data services.\n\nUnlike earlier generations, who often viewed Reliance as a long-term investment, younger investors are approaching the Jio IPO with a sharper focus on valuation, profitability and growth prospects.", "source": "LiveMint Markets", "pub_date_str": "17 Oct 2026, 01:53 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Jio Platforms IPO: Who qualifies for employee and Reliance shareholder quotas? Rules for up to 3 applications per person", "full_content": "Reliance Industries-backed Jio Platforms is set to launch its IPO on October 21, 2026, with the issue closing on October 23, 2026.\n\nThe issue includes reserved quotas for employees and Reliance Industries shareholders, allowing them to apply separately from retail investors under specified conditions. Here's what experts have to say on this.\n\n\u201cThe eligibility date is October 14, 2026, the day Jio Platforms filed its RHP. Trades settle on T+1, so a purchase on October 13 reached the demat account on October 14. One share is enough, and there is no minimum holding period. Companies and trusts are excluded,\u201d said Gaurav Garg, Head of Research, Lemonn.\n\nManish P. Hingar, Chartered Accountant, Founder and Chief Executive Officer, Fintoo, said individuals and HUFs who hold Reliance Industries shares on October 14 can apply under the shareholder quota once the IPO opens.\n\nHingar said permanent employees of Jio Platforms, Reliance Industries or any of their subsidiaries as of October 14 qualify. Employees serving their notice period are excluded. No minimum service period has been specified.\n\nGarg added that eligible employees include permanent employees of Jio Platforms, its subsidiaries, such as Reliance Jio Infocomm, Saavn and Haptik, and its promoter, Reliance Industries. Employees serving their notice period and the promoter, promoter group, and directors holding more than 10% of Jio Platforms' shares are excluded. Contract staff are also generally excluded.\n\nAt the upper price band of \u20b9 1,119 and a lot size of 12 shares, the minimum application amount is \u20b9 13,428 for retail investors and Reliance shareholders, and \u20b9 12,780 for eligible employees after the discount.\n\nGarg said employees' initial allotment in their quota is capped at \u20b9 2 lakh. They may receive shares for bids above that amount only if the employee portion is undersubscribed.", "source": "LiveMint Markets", "pub_date_str": "17 Oct 2026, 01:50 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Axis Bank Q2 Results: Net profit jumps 38% YoY- Check asset quality, stock trend, and other key highlights", "full_content": "Axis Bank Q2 Results 2026 : Axis Bank on Saturday, October 17, reported a 38% year-on-year (YoY) jump in net profit to \u20b9 7,003 crore for the second quarter of FY27, compared with \u20b9 5,089 crore in the corresponding quarter last year. The private sector lender's earnings were supported by growth in net interest income and an improvement in asset quality.\n\nNet interest income (NII), the difference between interest earned and interest expended, increased 12% YoY to \u20b9 15,371 crore. Net interest margin (NIM) stood at 3.36% during the quarter and improved to 3.47% after excluding the impact of foreign currency non-resident (FCNR-B) deposits.\n\nOperating profit grew 6% YoY to \u20b9 11,083 crore, while core operating profit rose 11% to \u20b9 10,998 crore. Other income declined 1% to \u20b9 6,531 crore, even as fee income advanced 6% to \u20b9 6,381 crore.\n\nCommenting on the bank's performance, managing director and CEO Amitabh Chaudhry said Axis Bank continued to focus on digital payments, secure banking, AI-driven innovation and strategic partnerships to strengthen its customer offerings.\n\nAxis Bank reported a year-on-year improvement in its asset quality, with the gross non-performing asset (GNPA) ratio falling 30 basis points (bps) to 1.16% in Q2FY27. The net non-performing asset (NNPA) ratio declined 9 bps to 0.35%.\n\nGross slippages dropped to \u20b9 4,762 crore during the September quarter, compared with \u20b9 5,566 crore in the preceding quarter and \u20b9 5,696 crore a year earlier. The net slippage ratio also declined 30 bps YoY to 0.75%.\n\nThe lender's annualised net credit cost came in at 0.45%, marking a reduction of 28 bps year-on-year and 18 bps sequentially. Meanwhile, its provision coverage ratio remained stable at 70%, unchanged from both the previous quarter and the corresponding period last year.\n\nAxis Bank set aside \u20b9 1,694 crore towards provisions and contingencies in Q2FY27, including \u20b9 1,564 crore in specific loan-loss provisions.", "source": "LiveMint Markets", "pub_date_str": "17 Oct 2026, 01:32 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Cyber fraud alert: SBI warns about AI voice-cloning scams \u2014 5 ways to protect your money", "full_content": "SBI has warned about AI voice-cloning scams that can trick people into transferring money or sharing banking details. Learn how to verify callers, protect sensitive information and report cyber fraud through helpline 1930 or cybercrime.gov.in.&nbsp;", "source": "LiveMint Money", "pub_date_str": "17 Oct 2026, 01:30 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Stock market holiday on Dussehra 2026? Are NSE, BSE open or closed for trading on October 20 Tuesday? Calendar", "full_content": "Indian markets will be closed on Tuesday, October 20, for Dussehra, with trading also shut on November 10 and 24 and December 25.&nbsp;", "source": "LiveMint Markets", "pub_date_str": "17 Oct 2026, 01:03 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "F&O Talk: Nifty\u2019s break above 23,450 could push index to 23,650; Sudeep Shah picks Tech Mahindra, TCS strategy", "full_content": "SBI Securities\u2019 Sudeep Shah sees scope for Nifty\u2019s recovery if it holds 22,750, with IT, private banks and media leading. He flags key resistance levels, banking earnings, improving FII flows and continued large-cap outperformance, while warning that a durable reversal remains unconfirmed.", "source": "Economic Times Markets", "pub_date_str": "17 Oct 2026, 12:57 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "8 small, midcap stocks with upside potential of up to 50%. How many are in your portfolio?", "full_content": "PL Capital remains cautious after the Nifty\u2019s eight-week losing streak, warning against expectations of a V-shaped recovery. Despite market uncertainty, the brokerage favours eight small and midcap stocks, including CESC, Amber Enterprises and Healthcare Global, citing potential upside of 13-50%.", "source": "Economic Times Markets", "pub_date_str": "17 Oct 2026, 12:40 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Regular vs step-up SIPs: Do \u20b91,000 and 10% annual top-ups give you higher XIRR returns or just create a larger corpus?", "full_content": "A step-up SIP can help investors build a larger corpus by increasing contributions over time. But does investing more mean higher returns? Find a comparison of regular SIPs, fixed \u20b91,000 top-ups, and 10% annual top-ups data to understand their impact on wealth creation and XIRR over 5 to 25 years.", "source": "LiveMint Money", "pub_date_str": "17 Oct 2026, 12:39 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Nicholas Sleep\u2019s investing lessons: Why patience, conviction and long-term thinking matter", "full_content": "Nicholas Sleep\u2019s investment philosophy emphasises independent thinking, patience, and understanding business fundamentals. His successful Nomad Investment Partnership demonstrated the value of identifying high-quality businesses, assessing sustainable competitive advantages, and focusing on long-term value rather than daily price movements. He advocated disciplined research, selective diversification, emotional control, continuous learning, and adapting decisions when circumstances change.", "source": "Economic Times Markets", "pub_date_str": "17 Oct 2026, 12:38 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Paytm shares rally 50% in 6 months, but Nomura sees 33% more upside, initiates with 'buy'; check target price, rationale", "full_content": "Nomura initiated coverage of Paytm with a Buy rating and a \u20b92,250 target, implying 33% upside. It expects rapid earnings growth, driven by digital payments, merchant lending, cost efficiencies and new revenue streams. Key risks include competition and deteriorating lending asset quality.", "source": "LiveMint Markets", "pub_date_str": "17 Oct 2026, 12:05 PM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Concurrent Gainers: 15 stocks gain for 5 days in a row", "full_content": "The Sensex gained 3.11% during October 12\u201316, while 15 BSE 500 stocks posted consecutive gains. Tata Elxsi led with 23%, followed by KPIT Technologies at 16%.", "source": "Economic Times Markets", "pub_date_str": "17 Oct 2026, 11:53 AM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Jio IPO\u2019s grey market hints at 20% listing pop. What are Emkay, SBI Securities saying?", "full_content": "Jio Platforms\u2019 Rs 30,200 crore IPO commands a grey market premium of Rs 221, suggesting nearly 20% listing gains. Emkay Global and SBI Securities highlight its telecom leadership, earnings growth, digital expansion and technology strengths, while flagging regulatory, competitive and financial risks.", "source": "Economic Times Markets", "pub_date_str": "17 Oct 2026, 11:51 AM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Brent crude oil prices hit $110 for first time since May as Iran attacks continue, Ukraine eyes Russia energy infra", "full_content": "Brent crude surpassed $110 per barrel as escalating attacks around the Strait of Hormuz and renewed Russia-Ukraine hostilities heightened global supply concerns. WTI also surged, recording weekly gains above 10%. Goldman Sachs warned prices could reach $120 if shipping disruptions worsen, while easing tensions could bring crude towards $80.", "source": "Economic Times Markets", "pub_date_str": "17 Oct 2026, 11:48 AM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}], "updated_at": "17 Oct 2026, 05:12 PM IST", "total_stories": 344};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
