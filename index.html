    const allData = {"general": [{"title": "Microdrama apps chase profits as Hollywood moves into short-form, vertical video", "full_content": "Bogdan Nesvit says his mission is simple: \"We are essentially building Disney for the 21st century.\"\n\nNesvit is the co-founder of microseries app My Drama, built around the latest, bite-sized form of storytelling. Short, serialized \"microdrama\" videos are created specifically for mobile devices and have generated billions of views this year. They often feature romantic tropes and typically end in cliffhangers to keep viewers hooked.\n\nThe category has exploded at a time when traditional media faces waning interest and YouTube now claims more viewing hours than individual streaming platforms.\n\nThe microdrama industry is projected to reach $1.5 billion in revenue in the U.S. in 2026, according to research firm Media Partners Asia. In China, where the format originally gained popularity, microdrama revenue surpassed what was made at the box office in 2024.\n\n\"It has the potential to evolve into mainstream entertainment and basically become mobile-first video streaming of the size of Netflix,\" Nesvit said.\n\nTech companies and startups such as My Drama currently lead the category in metrics like downloads and time spent on the apps.\n\nTikTok's PineDrama is the most popular microdrama app of 2026 so far with 13.2 million U.S. downloads through September, according to Sensor Tower data.\n\nStartups DramaBox and ReelShort beat out entertainment giants Netflix and Disney in average mobile usage time in the U.S. in the third quarter, according to Sensor Tower.", "source": "CNBC Top News", "pub_date_str": "26 Nov 2026, 11:09 PM IST", "pub_date_relative": "10m ago"}, {"title": "Buyback alert! Supriya Lifescience sets December 2 board meeting to consider share buyback; details here", "full_content": "A Ksheerasagar Published 26 Nov 2026, 11:09 PM IST Prefer Livemint on Google Supriya Lifescience has scheduled a board meeting for December 2, 2026, to consider and approve a proposal for a buyback of its fully paid-up equity shares, subject to necessary statutory and regulatory approvals.\n\nIn an exchange filing on Thursday, the company said its board would also consider authorising the actions and matters related to or incidental to the proposed buyback in accordance with the provisions of the Companies Act, 2013, and the SEBI (Buy-back of Securities) Regulations, 2018.\n\nThe company further said its trading window for dealing in securities by designated persons and their immediate relatives would remain closed from December 1, 2026, until 48 hours after the outcome of the board meeting is made public.\n\nSupriya Lifescience reported a 42% year-on-year decline in its consolidated net profit to \u20b9 29.25 crore for the September quarter of FY27, compared with \u20b9 50.43 crore in the corresponding quarter last year.\n\nRevenue from operations rose 3.2% year-on-year to \u20b9 206.30 crore in Q2 FY27, from \u20b9 199.83 crore in Q2 FY26.\n\nEBITDA declined to \u20b9 45.40 crore during the quarter, from \u20b9 72.65 crore a year earlier, while the EBITDA margin contracted to 22% from 36.4% in the year-ago period. The company's profit after tax (PAT) margin also declined to 14.2% from 25.2% in Q2 FY26.\n\nExplaining the pressure on its operating performance, the company said regulatory changes in the Latin American (LATAM) market affected demand for some of its higher-margin products. This resulted in a shift in its product and geographical mix, with a higher share of sales coming from semi-regulated markets during the quarter.\n\nThe company also reported higher operating expenses at its Ambernath facility, which is currently in the ramp-up phase.", "source": "LiveMint Markets", "pub_date_str": "26 Nov 2026, 11:09 PM IST", "pub_date_relative": "10m ago"}, {"title": "Mueller Industries director sells $103,020 in common stock", "full_content": "", "source": "Investing.com News", "pub_da ificial-intelligence semiconductors was announced by the Trump administration on Nov. 16.\n\nChip sellers communicated the messaging to neoclouds after the announcement, which seeks to close an export controls loophole allowing Chinese companies to rent access to Nvidia's most advanced chips when hosted in data centers overseas, two people familiar with the situation told CNBC. The people asked not to be named when discussing private information.\n\nThe interim final rule was announced by the Department of Commerce's Bureau of Industry and Security, or BIS, and came into effect on Nov. 19. Previously imposed export controls have effectively banned the sale of the most advanced Nvidia chips to Chinese companies and their import into China.\n\nPrior to the new rule's announcement, Nvidia had said it would not sell its chips to customers renting more than 50% of the graphics processing units, or GPUs, to Chinese companies, CNBC reported.\n\nThe new rule impacts the full supply chain, from the companies selling Nvidia chips to the neoclouds who rent access to computing power. Neocloud stocks have come under renewed pressure lately as investors questioned the sustainability of the AI boom.\n\nNvidia and the U.S. Department of Commerce's Bureau of Industry and Security did not immediately respond to a request for comment.\n\nThe change has prompted Nvidia chip sellers to look for new buyers of the semiconductor giant's GPUs, CNBC reported on Wednesday, citing three people familiar with the matter. Two of those people said it appeared chip sellers were seeking to offload GPUs because they were originally for use in data centers through which Chinese companies would rent access.", "source": "CNBC World Economy", "pub_date_str": "26 Nov 2026, 10:34 PM IST", "pub_date_relative": "45m ago"}, {"title": "Global stocks climb after volatile US trading over AI risks", "full_content": "Tech shares hit this month by fears over whether boom can be sustained", "source": "FT Markets", " nearly five-year-long war in Ukraine and the Iran war among the key topics of conversation.\n\n\"We also discussed the importance of Russia avoiding any actions that intentionally, or unintentionally, expand the war, and the importance of obtaining a peaceful resolution to the war as rapidly as possible,\" Trump and Rutte said in their statement.\n\nMoreover, the two discussed the importance of further increasing defense spending as well as investment in the defense industrial base in both the U.S. and NATO countries, according to the statement.\n\nTrump also said in a post on Truth Social Thursday that he \"briefed NATO on the tremendous progress\" being made in growing defense production, noting that the focus will be on building Patriot air defense systems, THAAD systems and Tomahawk cruise missiles, as well as \"many new Weapons, both Offensive and Defensive, that have not yet been viewed by the Public, or other Countries.\"\n\n\"There has never been a time when the United States has produced more Military Equipment or Munitions than now. Our 'cupboard' will soon be full and, when it is, our Allies and Partners throughout the World will be benefitting greatly,\" he said in the post.\n\nTrump's meeting with Xi and Putin, in which he described the Russian president as his \"friend,\" sparked alarm among European lawmakers about Washington's commitment to transatlantic security.", "source": "CNBC Top News", "pub_date_str": "26 Nov 2026, 09:42 PM IST", "pub_date_relative": "1h ago"}, {"title": "UGC NET 2026: Candidates Can Change Exam City Till November 29, Check Steps", "full_content": "NTA has allowed candidates allotted an examination city outside their four preferences to select another available city by November 29.", "source": "NDTV Profit", "pub_date_str": "26 Nov 2026, 09:37 PM IST", "pub_date_relative": "1h ago"}, {"title": "Who Are The Chennai Couple Behind The Rs 206 Crore Gold Donation To Tirupati Temple?", "full_content": "Chennai-based Jain couple offers 121 kg of diamond-studded gold ornaments worth Rs 206 crore to Lord Venkateswara in a remarkable act of faith.", "source": "NDTV Profit", "pub_date_str": "26 Nov 2026, 09:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "Buyer beware? Nvidia's volatile swings expose risks of single-stock ETFs", "full_content": "Nvidia 's latest bout of volatility is highlighting risks tied to single-stock exchange-traded funds.\n\nAmong the hardest hit: the GraniteShares 2x Short NVDA Daily ETF (NVD) . The fund sank 63% on Monday after Jensen Huang got reinstated as the chip giant's CEO. Meanwhile, the firm's 2x Long NVDA ETF (NVDL) soared nearly 62% on the same day.\n\nETF Action founding partner Mike Akins joined \" ETF Edge \" as Nvidia shares soared 31% during Monday's session, wiping a large portion of the losses from the days following Huang's resignation . Shares cooled on Tuesday and Wednesday, however.\n\n\"Historically speaking, we do not see these types of large drawdowns followed by huge drives up in a healthy market,\" Akins said on Monday. \"It usually tends to be when you're in a recession or in a bear market territory, which we're not technically in for the broader market, but we are in for this AI trade.\"\n\nBut it may not be time to go cold turkey on single-stock funds.\n\n\"[Leveraged ETFs are] definitely a retail trading vehicle\u2026 I think it's OK to have a little fun trying to trade that,\" Akins added. \"I'm certain there are people that are better at trading these than others. But on the whole, timing the market is very, very hard.\"\n\nGraniteShares founder and CEO Will Rhind also joined \"ETF Edge\" on Monday as Nvidia single-stock short ETFs overshadowed his firm's new Anthropic launches: The 2x Short Anthropic Daily ETF (ANS) and the 2x Long Anthropic Daily ETF (AIL) .\n\n\"We thought this was going to be the biggest news event of the day with Anthropic the first leveraged ETFs going live,\" he said. \"I can tell you this is like a sideshow compared to what we're seeing with Nvidia.\"", "source": "CNBC Finance", "pub_date_str": "26 Nov 2026, 09:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "I\u2019m in my 70s and buying a new BMW X1. Should I put my only son on the title?", "full_content": "\u201cGiven my age, I never make a major new purchase without thinking about the future.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "26 Nov 2026, 09:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "8th Pay Commission: Govt Employees Could Get Rs 15,400 More A Month, JPMorgan Estimates", "full_content": "\"The average beneficiary would receive about INR 15,400 more per month, plus around INR 340,000 in arrears,\" analysts Rajiv Batra and Rushit Mehta wrote in the report.", "source": "NDTV Profit", "pub_date_str": "26 Nov 2026, 09:22 PM IST", "pub_date_relative": "1h ago"}, {"title": "Ashiana Housing JV buys 10-acre land in Chennai for senior living project, eyes Rs 1,100 cr revenue", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Digital Real Estate \u203a Realty News \u203a Ashiana Housing JV buys 10-acre land in Chennai for senior living project, eyes Rs 1,100 cr revenue Ashiana Housing Share Price Valor Estate Share Price Raymond Realty Share Price Kolte-Patil Developers Share Price AGI Infra Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Ashiana Housing JV buys 10-acre land in Chennai for senior living project, eyes Rs 1,100 cr revenue SECTIONS Ashiana Housing JV buys 10-acre land in Chennai for senior living project, eyes Rs 1,100 cr revenue PTI Last Updated: Nov 26, 2026, 09:21:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Ashiana Housing Ltd recently revealed its acquisition of nearly 10 acres in Chennai aimed at a senior living initiative. In collaboration with Arihant Foundations, the project estimates a saleable area of around 9 lakh square feet, with an anticipated revenue potential of Rs 1,100 crore. The land purchase cost remains undisclosed, furthering Ashiana's commitment to senior living and group housing developments across various regions.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets .", "source": "Economic Times Markets", "pub_date_str": "26 Nov 2026, 09:21 PM IST", "pub_date_relative": "1h ago"}, {"title": "New Rules From December 1: SBI Card Fees, Pension Deadline, GST Changes. What It Means For Your Money", "full_content": "December brings changes for consumers, investors and pensioners, including higher SBI Card charges on select transactions, revised commodity margins, digital KYC relaxations and key deadlines.", "source": "NDTV Profit", "pub_date_str": "26 Nov 2026, 09:11 PM IST", "pub_date_relative": "2h ago"}, {"title": "Modders Reverse Engineer PC Port For GTA 6 Even Before Release Announcement", "full_content": "Progress on the build began when Cyberleek an infamous and anonymous leaker, released the executable file for the game's Xbox build on the internet.", "source": "NDTV Profit", "pub_date_str": "26 Nov 2026, 09:10 PM IST", "pub_date_relative": "2h ago"}, {"title": "'Vaibhav Sooryavanshi Will Score 500 In Tests': Kevin Pietersen's Huge Prediction For India Teenager", "full_content": "Kevin Pietersen made a big claim about Vaibhav Sooryavanshi after the teenager smashed a record-breaking 204 off 53 balls against the UAE.", "source": "NDTV Profit", "pub_date_str": "26 Nov 2026, 09:10 PM IST", "pub_date_relative": "2h ago"}, {"title": "A Newspaper by Grade 5? The Unusual Budget 2027 Suggestion Made To The Finance Ministry", "full_content": "A nationwide reading movement to help every child understand newspaper content by Grade 5 has emerged among stakeholder suggestions ahead of Budget 2027-28.", "source": "NDTV Profit", "pub_date_str": "26 Nov 2026, 09:05 PM IST", "pub_date_relative": "2h ago"}, {"title": "Nvidia chip buyers told to rule out Chinese renters to purchase GPUs, sources say - CNBC", "full_content": "Nvidia chip buyers told to rule out Chinese renters to purchase GPUs, sources say CNBC Nvidia Tells Partners to Pause Shipments to Southeast Asia WSJ Billions in Data Center Deals Grind to Halt After AI Chip Curbs Bloomberg US chip curbs will slow Asia data-center investment, Fitch says Reuters Nvidia halts chip shipments to south-east Asia Financial Times", "source": "Google News Business", "pub_date_str": "26 Nov 2026, 09:04 PM IST", "pub_date_relative": "2h ago"}, {"title": "Missed SIP installment? Know the impact on your bank account, CIBIL score and investments", "full_content": "A failed systematic investment plan ( SIP ) payment can leave mutual fund investors wondering whether they will face penalties, see their credit score take a hit or lose the money they have already invested.\n\nHowever, a missed SIP instalment does not automatically affect an investor's existing mutual fund holdings. It is also not treated in the same way as a missed loan EMI or an unpaid credit card bill.\n\nWhile a failed debit may attract bank charges and repeated failures can eventually lead to the cancellation of an SIP, investors should understand the distinction between these consequences, CNBC TV18 reported.\n\nA failed SIP debit may attract a charge from the bank, particularly if the transaction fails because of insufficient funds or an issue with the auto-debit mandate.\n\nBanks may levy a return or dishonour charge for such failed transactions. This fee is separate from any charges that a mutual fund house may impose.\n\nThe amount varies depending on the bank and the type of account. Investors should check their bank's latest schedule of charges to determine whether a fee applies.\n\nAn SIP is an investment instruction, not a borrowing obligation. Therefore, a failed SIP debit is generally not treated like a missed loan EMI or an unpaid credit card bill.\n\nCredit scores are primarily influenced by an individual's borrowing and repayment behaviour. Since an SIP does not involve credit, a failed payment does not automatically affect an investor's credit score.", "source": "LiveMint Money", "pub_date_str": "26 Nov 2026, 09:02 PM IST", "pub_date_relative": "2h ago"}, {"title": "JPMorgan's Worst Case For Nifty Is 22,000. Here's What Could Take It There", "full_content": "The brokerage's bear case assumes earnings growth halves and valuations slip below historical norms, implying a 15% fall from current levels.", "source": "NDTV Profit", "pub_date_str": "26 Nov 2026, 09:02 PM IST", "pub_date_relative": "2h ago"}, {"title": "We are living in perilous times if Nvidia CEO Jensen Huang dictates your 401(k) balance", "full_content": "Why did a futurist with Huang\u2019s prescient vision build a company where all roads lead to him?", "source": "MarketWatch Top Stories", "pub_date_str": "26 Nov 2026, 09:00 PM IST", "pub_date_relative": "2h ago"}, {"title": "Spain\u2019s Pablo Hern\u00e1ndez de Cos set to lead European Central Bank", "full_content": "Pablo Hern\u00e1ndez de Cos is set to succeed Christine Lagarde as president of the European Central Bank next year.\n\nHe received backing from euro zone leaders at the European Council Summit, multiple media reported on Thursday.\n\nThe role still requires formal appointment after consultation with the European Parliament and the ECB's Governing Council, but neither has veto power and the decision follows intense political wrangling to reach a consensus on who should serve the eight-year term.\n\nReuters reported that de Cos was set for the nomination after the Netherlands agreed to back Klaas Knot, the only other candidate, citing European diplomatic sources.\n\nDe Cos is a 55-year-old economist and career central banker who rose through the ranks of the Bank of Spain, starting as a researcher in the 1990s and working in various departments before becoming governor from 2018 to June 2024.\n\nHe chaired the Basel Committee on Banking Supervision from 2019 to 2024, and has been General Manager of the Basel-based Bank for International Settlements since July 2025.\n\nBoth de Cos and his main rival for the ECB top job, Knot, were widely seen as candidates with deep knowledge and experience in monetary policy and financial stability \u2014 attributes that took on particular importance at a time of resurgent inflation, fragmentation and political uncertainty.\n\nLagarde had extensive experience in financial institutions but was criticized by some early in her tenure for a lack of central banking experience.", "source": "CNBC Top News", "pub_date_str": "26 Nov 2026, 08:58 PM IST", "pub_date_relative": "2h ago"}, {"title": "Yeh Prem Mol Liya Advance Booking: Ayushmann-Sharvari Starrer Makes Early Waves At Box Office", "full_content": "Directed by Sooraj Barjatya, Yeh Prem Mol Liya stars Ayushmann Khurrana and Sharvari in a romantic drama about love, relationships and emotions.", "source": "NDTV Profit", "pub_date_str": "26 Nov 2026, 08:57 PM IST", "pub_date_relative": "2h ago"}, {"title": "FIFA Hit By Cyberattack: Hackers Access Personal Data And Internal Business Information", "full_content": "FIFA confirmed unauthorised access to personal and business information but did not disclose the number of people affected or when the attack took place.", "source": "NDTV Profit", "pub_date_str": "26 Nov 2026, 08:48 PM IST", "pub_date_relative": "2h ago"}, {"title": "Earning Rental Income From A Second House? How Much Tax, Maintenance And Loan EMI Can Cost You", "full_content": "If this house is on a loan, years of rent can end up only paying the EMI before you can even see any of that money in your bank account.", "source": "NDTV Profit", "pub_date_str": "26 Nov 2026, 08:44 PM IST", "pub_date_relative": "2h ago"}, {"title": "My husband secretly sends his ex-wife $1,500 a month after she lost her job. We have $2.4 million saved. Has he lied by omission?", "full_content": "\u201cHe explained that he wasn\u2019t trying to hide the payment, but his former wife lost her job in a medical billing company.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "26 Nov 2026, 08:43 PM IST", "pub_date_relative": "2h ago"}, {"title": "Gunmaaster G9 Advance Booking: Emraan Hashmi Starrer Gets A Head Start At Ticket Counters", "full_content": "Gunmaaster G9 follows a gripping story of love and obsession, with Emraan Hashmi, Avneet Kaur and Genelia Deshmukh leading the cast.", "source": "NDTV Profit", "pub_date_str": "26 Nov 2026, 08:40 PM IST", "pub_date_relative": "2h ago"}, {"title": "On The Run For 18 Years, Murder Accused Arrested In UAE And Deported To India", "full_content": "The CBI says more than 300 wanted criminals have been brought back to India through Interpol channels since 2019, including 76 in 2026.", "source": "NDTV Profit", "pub_date_str": "26 Nov 2026, 08:33 PM IST", "pub_date_relative": "2h ago"}, {"title": "What will happen to gold rates? Crash or surge after the US Fed FOMC meeting outcome - Scenarios explained", "full_content": "The upcoming US Federal Reserve meeting in December is the next major event that bullion traders are watching, as the policy outcome could determine the near-term outlook for both gold and silver prices following their sharp correction in 2026.\n\nAfter witnessing their biggest annual rally on record in 2025, both gold and silver prices came under severe selling pressure as the US Federal Reserve began raising interest rates to bring inflation under control. Inflationary pressures had been exacerbated by the US-Iran war and higher tariffs.\n\nThe personal consumption expenditures (PCE) price index, the Fed's preferred inflation gauge, showed an annual inflation rate of 3.8% on a seasonally adjusted basis in October, slightly above market estimates.\n\nThe data reinforced expectations that the Fed could raise interest rates by at least 25 basis points before the end of 2026 and maintain its monetary tightening stance in 2027, as inflation has remained above the central bank's 2% target for around 5\u00bd years.\n\nExpectations of higher interest rates have also boosted demand for the US dollar, making dollar-denominated commodities more expensive for holders of other currencies.\n\nn addition, the absence of strong support from central bank purchases, which had been a key driver of demand in recent years, is also weighing on precious metals, dragging gold and silver to multi-month lows.\n\nAgainst this backdrop, the upcoming US Federal Reserve meeting is shaping up to be a crucial event for bullion markets. Investors will closely watch whether the central bank raises interest rates again or pauses its tightening cycle, following its previous rate hike in September.\n\nThe outcome could offer fresh cues on the direction of gold and silver prices heading into 2027. The following are two likely scenarios on how prices will react to outcomes.", "source": "LiveMint Markets", "pub_date_str": "26 Nov 2026, 08:30 PM IST", "pub_date_relative": "2h ago"}, {"title": "Hawkish Fed poised to raise rates despite stock market turmoil", "full_content": "Inflation is top concern for US central bank officials even as tech-led sell-off triggers fears for economy", "source": "FT Markets", "pub_date_str": "26 Nov 2026, 08:28 PM IST", "pub_date_relative": "2h ago"}, {"title": "Your old PF account isn\u2019t dead money: You may be missing out on this important EPFO rule", "full_content": "Changing jobs, moving abroad or leaving an old Provident Fund (PF) account untouched can raise an important question: will your savings continue to earn interest if no fresh money is deposited for three years?\n\nThe answer may come as a relief to many salaried employees. An Employees' Provident Fund (EPF) account does not automatically stop earning interest simply because contributions have stopped. In fact, under certain conditions, the balance can continue to grow until the member turns 58.\n\nThe Employees' Provident Fund Organisation (EPFO) has explained the rules in a video shared on YouTube, including when an account becomes inoperative, when interest stops and how members can recover their money.\n\nUnder Para 72(6) of the Employees' Provident Fund Scheme, 1952 , an account can become inoperative in specific circumstances. These include retirement, permanent migration abroad, the death of a member and certain unsuccessful withdrawal transactions.\n\nHowever, the three-year rule does not apply in the same way to everyone.\n\nFor employees who leave a job before turning 55, the accumulated PF balance continues to earn interest until they reach 58, even if no further contributions are made.\n\nFor those retiring at 55 or later, the 36-month waiting period begins from the last contribution. If the balance remains unclaimed after this period, the account becomes inoperative and stops earning interest.\n\nFor example, someone retiring at 58 can continue earning interest on their PF savings until the age of 61, provided the money remains unclaimed.", "source": "LiveMint Money", "pub_date_str": "26 Nov 2026, 08:27 PM IST", "pub_date_relative": "2h ago"}, {"title": "Congress Vs Meta: Party Alleges Political Posts And Rahul Gandhi Content Being Restricted", "full_content": "Meta officials reportedly told Congress leaders that the company was complying with Indian laws and objections raised by the government.", "source": "NDTV Profit", "pub_date_str": "26 Nov 2026, 08:25 PM IST", "pub_date_relative": "2h ago"}], "cfa": [{"title": "Microdrama apps chase profits as Hollywood moves into short-form, vertical video", "full_content": "Bogdan Nesvit says his mission is simple: \"We are essentially building Disney for the 21st century.\"\n\nNesvit is the co-founder of microseries app My Drama, built around the latest, bite-sized form of storytelling. Short, serialized \"microdrama\" videos are created specifically for mobile devices and have generated billions of views this year. They often feature romantic tropes and typically end in cliffhangers to keep viewers hooked.\n\nThe category has exploded at a time when traditional media faces waning interest and YouTube now claims more viewing hours than individual streaming platforms.\n\nThe microdrama industry is projected to reach $1.5 billion in revenue in the U.S. in 2026, according to research firm Media Partners Asia. In China, where the format originally gained popularity, microdrama revenue surpassed what was made at the box office in 2024.\n\n\"It has the potential to evolve into mainstream entertainment and basically become mobile-first video streaming of the size of Netflix,\" Nesvit said.\n\nTech companies and startups such as My Drama currently lead the category in metrics like downloads and time spent on the apps.\n\nTikTok's PineDrama is the most popular microdrama app of 2026 so far with 13.2 million U.S. downloads through September, according to Sensor Tower data.\n\nStartups DramaBox and ReelShort beat out entertainment giants Netflix and Disney in average mobile usage time in the U.S. in the third quarter, according to Sensor Tower.", "source": "CNBC Top News", "pub_date_str": "26 Nov 2026, 11:09 PM IST", "pub_date_relative": "10m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Buyback alert! Supriya Lifescience sets December 2 board meeting to consider share buyback; details here", "full_content": "A Ksheerasagar Published 26 Nov 2026, 11:09 PM IST Prefer Livemint on Google Supriya Lifescience has scheduled a board meeting for December 2, 2026, to consider and approve a proposal for a buyback of its fully paid-up equity shares, subject to necessary statutory and regulatory approvals.\n\nIn an exchange filing on Thursday, the company said its board would also consider authorising the actions and matters related to or incidental to the proposed buyback in accordance with the provisions of the Companies Act, 2013, and the SEBI (Buy-back of Securities) Regulations, 2018.\n\nThe company further said its trading window for dealing in securities by designated persons and their immediate relatives would remain closed from December 1, 2026, until 48 hours after the outcome of the board meeting is made public.\n\nSupriya Lifescience reported a 42% year-on-year decline in its consolidated net profit to \u20b9 29.25 crore for the September quarter of FY27, compared with \u20b9 50.43 crore in the corresponding quarter last year.\n\nRevenue from operations rose 3.2% year-on-year to \u20b9 206.30 crore in Q2 FY27, from \u20b9 199.83 crore in Q2 FY26.\n\nEBITDA declined to \u20b9 45.40 crore during the quarter, from \u20b9 72.65 crore a year earlier, while the EBITDA margin contracted to 22% from 36.4% in the year-ago period. The company's profit after tax (PAT) margin also declined to 14.2% from 25.2% in Q2 FY26.\n\nExplaining the pressure on its operating performance, the company said regulatory changes in the Latin American (LATAM) market affected demand for some of its higher-margin products. This resulted in a shift in its product and geographical mix, with a higher share of sales coming from semi-regulated markets during the quarter.\n\nThe company also reported higher operating expenses at its Ambernath facility, which is currently in the ramp-up phase.", "source": "LiveMint Markets", "pub_date_str": "26 Nov 2026, 11:09 PM IST", "pub_date_relative": "10m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Mexico urges Asian trade partners to crack down on tariff dodging", "full_content": "", "source": "Investing.com News", "pub_date_str": "26 Nov 2026, 10:42 PM IST", "pub_date_relative": "37m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Nvidia chip buyers told to rule out Chinese renters to purchase GPUs, sources say", "full_content": "Neoclouds are being told they won't be able to purchase Nvidia chips if any of the computing capacity will be rented by Chinese companies, sources told CNBC.\n\nIt comes after a new rule restricting remote access to artificial-intelligence semiconductors was announced by the Trump administration on Nov. 16.\n\nChip sellers communicated the messaging to neoclouds after the announcement, which seeks to close an export controls loophole allowing Chinese companies to rent access to Nvidia's most advanced chips when hosted in data centers overseas, two people familiar with the situation told CNBC. The people asked not to be named when discussing private information.\n\nThe interim final rule was announced by the Department of Commerce's Bureau of Industry and Security, or BIS, and came into effect on Nov. 19. Previously imposed export controls have effectively banned the sale of the most advanced Nvidia chips to Chinese companies and their import into China.\n\nPrior to the new rule's announcement, Nvidia had said it would not sell its chips to customers renting more than 50% of the graphics processing units, or GPUs, to Chinese companies, CNBC reported.\n\nThe new rule impacts the full supply chain, from the companies selling Nvidia chips to the neoclouds who rent access to computing power. Neocloud stocks have come under renewed pressure lately as investors questioned the sustainability of the AI boom.\n\nNvidia and the U.S. Department of Commerce's Bureau of Industry and Security did not immediately respond to a request for comment.\n\nThe change has prompted Nvidia chip sellers to look for new buyers of the semiconductor giant's GPUs, CNBC reported on Wednesday, citing three people familiar with the matter. Two of those people said it appeared chip sellers were seeking to offload GPUs because they were originally for use in data centers through which Chinese companies would rent access.", "source": "CNBC World Economy", "pub_date_str": "26 Nov 2026, 10:34 PM IST", "pub_date_relative": "45m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Nifty 50 to hit 29,000? J.P. Morgan calls Indian stocks a 'safe haven' from AI trades; sees 12% upside. Key reasons", "full_content": "The bull run in the Indian stock market appears set to continue, with global investment bank J.P. Morgan saying domestic equities are emerging as a potential safe haven for investors seeking to diversify away from AI-focused trades.\n\nSo far in November, the Nifty 50 has rebounded 12.3%. If the index maintains this momentum over the remaining two trading sessions, it will mark its biggest monthly gain since April 2020, when it surged 14.6%.\n\nThe rally has also narrowed the index's year-to-date losses to just 1%, from 13.5% at its 2026 low. To put the sharp recovery into perspective, the Nifty 50 recorded its longest monthly losing streak in 25 years in September. During the same period, nearly 50% of its constituent stocks slipped into bear market territory.\n\nJ.P. Morgan now expects the rally to extend, forecasting further gains in 2027 after what it called the \"great comeback of 2026\". It expects the Nifty 50 to reach 29,000 by the end of 2027 in its base-case scenario, implying an upside of about 12% from Thursday's close, Reuters reported.\n\nMint could not independently verify the report. The brokerage's bull- and bear-case targets stand at 31,000 and 22,000, respectively, analysts led by Rajiv Batra said in a note.\n\nJ.P. Morgan forecasted MSCI India earnings growth of 14% in 2027, up from 12% in 2026, citing resilient consumption, improving profitability, faster credit growth, and rising private investment.\n\nThe brokerage also said it favoured domestic cyclicals over exporters, citing lower oil prices and a firmer rupee. It sees the potential for $100 billion in net foreign inflows if long-only investors return to benchmark weights, following approximately $15.5 billion in overseas buying so far in November.\n\nEarlier, Goldman Sachs turned bullish on Indian equities, upgrading its rating on India to 'Overweight' from 'Marketweight' and setting a Nifty 50 target of 28,500 by December 2027.", "source": "LiveMint Markets", "pub_date_str": "26 Nov 2026, 10:18 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Trump Says Revised GDP Numbers \u2018Fake,\u2019 Calls for Investigation - Bloomberg", "full_content": "Trump Says Revised GDP Numbers \u2018Fake,\u2019 Calls for Investigation Bloomberg See more headlines & perspectives on Google News", "source": "Google News Business", "pub_date_str": "26 Nov 2026, 09:54 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Ramayana Box Office Collection Day 22: The Epic Saga Continues To Hold Audience Attention, Check Earnings", "full_content": "Ramayana Part 1, directed by Nitesh Tiwari, brings the epic tale of Lord Rama to the big screen, with Ranbir Kapoor as Rama, Sai Pallavi as Sita and Yash as Ravana in the much-awaited film.", "source": "NDTV Profit", "pub_date_str": "26 Nov 2026, 09:51 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "US Marlboro maker Altria explores Imperial Brands takeover in Big Tobacco mega deal - Reuters", "full_content": "US Marlboro maker Altria explores Imperial Brands takeover in Big Tobacco mega deal Reuters Marlboro Maker Altria Explores Deal for Rival Imperial Brands WSJ Altria Studies Deal for Cigarette Maker Imperial Brands Bloomberg Marlboro maker Altria says considering takeover of Davidoff maker Imperial Bands \u2013 as it happened The Guardian Marlboro maker Altria explores takeover of UK's Imperial Brands CNBC", "source": "Google News Business", "pub_date_str": "26 Nov 2026, 09:49 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Trump, NATO chief caution Russia as attacks on Ukraine\u2019s energy infrastructure intensify", "full_content": "U.S. President Donald Trump and NATO chief Mark Rutte issued a joint statement on Thursday urging Russia not to take any actions, intentionally or otherwise, that would further expand the Ukraine war.\n\nThe statement comes as Ukraine's allies sound the alarm over Russia's growing threat to European security and just one week after Trump's historic trilateral meeting with Russian President Vladimir Putin and Chinese President Xi Jinping in Asia.\n\nTrump and Rutte described their meeting at the Mar-a-Lago club in Palm Beach, Florida on Wednesday as \"very impactful,\" with Russia's nearly five-year-long war in Ukraine and the Iran war among the key topics of conversation.\n\n\"We also discussed the importance of Russia avoiding any actions that intentionally, or unintentionally, expand the war, and the importance of obtaining a peaceful resolution to the war as rapidly as possible,\" Trump and Rutte said in their statement.\n\nMoreover, the two discussed the importance of further increasing defense spending as well as investment in the defense industrial base in both the U.S. and NATO countries, according to the statement.\n\nTrump also said in a post on Truth Social Thursday that he \"briefed NATO on the tremendous progress\" being made in growing defense production, noting that the focus will be on building Patriot air defense systems, THAAD systems and Tomahawk cruise missiles, as well as \"many new Weapons, both Offensive and Defensive, that have not yet been viewed by the Public, or other Countries.\"\n\n\"There has never been a time when the United States has produced more Military Equipment or Munitions than now. Our 'cupboard' will soon be full and, when it is, our Allies and Partners throughout the World will be benefitting greatly,\" he said in the post.\n\nTrump's meeting with Xi and Putin, in which he described the Russian president as his \"friend,\" sparked alarm among European lawmakers about Washington's commitment to transatlantic security.", "source": "CNBC Top News", "pub_date_str": "26 Nov 2026, 09:42 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Who Are The Chennai Couple Behind The Rs 206 Crore Gold Donation To Tirupati Temple?", "full_content": "Chennai-based Jain couple offers 121 kg of diamond-studded gold ornaments worth Rs 206 crore to Lord Venkateswara in a remarkable act of faith.", "source": "NDTV Profit", "pub_date_str": "26 Nov 2026, 09:30 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Buyer beware? Nvidia's volatile swings expose risks of single-stock ETFs", "full_content": "Nvidia 's latest bout of volatility is highlighting risks tied to single-stock exchange-traded funds.\n\nAmong the hardest hit: the GraniteShares 2x Short NVDA Daily ETF (NVD) . The fund sank 63% on Monday after Jensen Huang got reinstated as the chip giant's CEO. Meanwhile, the firm's 2x Long NVDA ETF (NVDL) soared nearly 62% on the same day.\n\nETF Action founding partner Mike Akins joined \" ETF Edge \" as Nvidia shares soared 31% during Monday's session, wiping a large portion of the losses from the days following Huang's resignation . Shares cooled on Tuesday and Wednesday, however.\n\n\"Historically speaking, we do not see these types of large drawdowns followed by huge drives up in a healthy market,\" Akins said on Monday. \"It usually tends to be when you're in a recession or in a bear market territory, which we're not technically in for the broader market, but we are in for this AI trade.\"\n\nBut it may not be time to go cold turkey on single-stock funds.\n\n\"[Leveraged ETFs are] definitely a retail trading vehicle\u2026 I think it's OK to have a little fun trying to trade that,\" Akins added. \"I'm certain there are people that are better at trading these than others. But on the whole, timing the market is very, very hard.\"\n\nGraniteShares founder and CEO Will Rhind also joined \"ETF Edge\" on Monday as Nvidia single-stock short ETFs overshadowed his firm's new Anthropic launches: The 2x Short Anthropic Daily ETF (ANS) and the 2x Long Anthropic Daily ETF (AIL) .\n\n\"We thought this was going to be the biggest news event of the day with Anthropic the first leveraged ETFs going live,\" he said. \"I can tell you this is like a sideshow compared to what we're seeing with Nvidia.\"", "source": "CNBC Finance", "pub_date_str": "26 Nov 2026, 09:30 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Ashiana Housing JV buys 10-acre land in Chennai for senior living project, eyes Rs 1,100 cr revenue", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Digital Real Estate \u203a Realty News \u203a Ashiana Housing JV buys 10-acre land in Chennai for senior living project, eyes Rs 1,100 cr revenue Ashiana Housing Share Price Valor Estate Share Price Raymond Realty Share Price Kolte-Patil Developers Share Price AGI Infra Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Ashiana Housing JV buys 10-acre land in Chennai for senior living project, eyes Rs 1,100 cr revenue SECTIONS Ashiana Housing JV buys 10-acre land in Chennai for senior living project, eyes Rs 1,100 cr revenue PTI Last Updated: Nov 26, 2026, 09:21:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Ashiana Housing Ltd recently revealed its acquisition of nearly 10 acres in Chennai aimed at a senior living initiative. In collaboration with Arihant Foundations, the project estimates a saleable area of around 9 lakh square feet, with an anticipated revenue potential of Rs 1,100 crore. The land purchase cost remains undisclosed, furthering Ashiana's commitment to senior living and group housing developments across various regions.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets .", "source": "Economic Times Markets", "pub_date_str": "26 Nov 2026, 09:21 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "New Rules From December 1: SBI Card Fees, Pension Deadline, GST Changes. What It Means For Your Money", "full_content": "December brings changes for consumers, investors and pensioners, including higher SBI Card charges on select transactions, revised commodity margins, digital KYC relaxations and key deadlines.", "source": "NDTV Profit", "pub_date_str": "26 Nov 2026, 09:11 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Alternative Investments", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "A Newspaper by Grade 5? The Unusual Budget 2027 Suggestion Made To The Finance Ministry", "full_content": "A nationwide reading movement to help every child understand newspaper content by Grade 5 has emerged among stakeholder suggestions ahead of Budget 2027-28.", "source": "NDTV Profit", "pub_date_str": "26 Nov 2026, 09:05 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Missed SIP installment? Know the impact on your bank account, CIBIL score and investments", "full_content": "A failed systematic investment plan ( SIP ) payment can leave mutual fund investors wondering whether they will face penalties, see their credit score take a hit or lose the money they have already invested.\n\nHowever, a missed SIP instalment does not automatically affect an investor's existing mutual fund holdings. It is also not treated in the same way as a missed loan EMI or an unpaid credit card bill.\n\nWhile a failed debit may attract bank charges and repeated failures can eventually lead to the cancellation of an SIP, investors should understand the distinction between these consequences, CNBC TV18 reported.\n\nA failed SIP debit may attract a charge from the bank, particularly if the transaction fails because of insufficient funds or an issue with the auto-debit mandate.\n\nBanks may levy a return or dishonour charge for such failed transactions. This fee is separate from any charges that a mutual fund house may impose.\n\nThe amount varies depending on the bank and the type of account. Investors should check their bank's latest schedule of charges to determine whether a fee applies.\n\nAn SIP is an investment instruction, not a borrowing obligation. Therefore, a failed SIP debit is generally not treated like a missed loan EMI or an unpaid credit card bill.\n\nCredit scores are primarily influenced by an individual's borrowing and repayment behaviour. Since an SIP does not involve credit, a failed payment does not automatically affect an investor's credit score.", "source": "LiveMint Money", "pub_date_str": "26 Nov 2026, 09:02 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "JPMorgan's Worst Case For Nifty Is 22,000. Here's What Could Take It There", "full_content": "The brokerage's bear case assumes earnings growth halves and valuations slip below historical norms, implying a 15% fall from current levels.", "source": "NDTV Profit", "pub_date_str": "26 Nov 2026, 09:02 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Spain\u2019s Pablo Hern\u00e1ndez de Cos set to lead European Central Bank", "full_content": "Pablo Hern\u00e1ndez de Cos is set to succeed Christine Lagarde as president of the European Central Bank next year.\n\nHe received backing from euro zone leaders at the European Council Summit, multiple media reported on Thursday.\n\nThe role still requires formal appointment after consultation with the European Parliament and the ECB's Governing Council, but neither has veto power and the decision follows intense political wrangling to reach a consensus on who should serve the eight-year term.\n\nReuters reported that de Cos was set for the nomination after the Netherlands agreed to back Klaas Knot, the only other candidate, citing European diplomatic sources.\n\nDe Cos is a 55-year-old economist and career central banker who rose through the ranks of the Bank of Spain, starting as a researcher in the 1990s and working in various departments before becoming governor from 2018 to June 2024.\n\nHe chaired the Basel Committee on Banking Supervision from 2019 to 2024, and has been General Manager of the Basel-based Bank for International Settlements since July 2025.\n\nBoth de Cos and his main rival for the ECB top job, Knot, were widely seen as candidates with deep knowledge and experience in monetary policy and financial stability \u2014 attributes that took on particular importance at a time of resurgent inflation, fragmentation and political uncertainty.\n\nLagarde had extensive experience in financial institutions but was criticized by some early in her tenure for a lack of central banking experience.", "source": "CNBC Top News", "pub_date_str": "26 Nov 2026, 08:58 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "What will happen to gold rates? Crash or surge after the US Fed FOMC meeting outcome - Scenarios explained", "full_content": "The upcoming US Federal Reserve meeting in December is the next major event that bullion traders are watching, as the policy outcome could determine the near-term outlook for both gold and silver prices following their sharp correction in 2026.\n\nAfter witnessing their biggest annual rally on record in 2025, both gold and silver prices came under severe selling pressure as the US Federal Reserve began raising interest rates to bring inflation under control. Inflationary pressures had been exacerbated by the US-Iran war and higher tariffs.\n\nThe personal consumption expenditures (PCE) price index, the Fed's preferred inflation gauge, showed an annual inflation rate of 3.8% on a seasonally adjusted basis in October, slightly above market estimates.\n\nThe data reinforced expectations that the Fed could raise interest rates by at least 25 basis points before the end of 2026 and maintain its monetary tightening stance in 2027, as inflation has remained above the central bank's 2% target for around 5\u00bd years.\n\nExpectations of higher interest rates have also boosted demand for the US dollar, making dollar-denominated commodities more expensive for holders of other currencies.\n\nn addition, the absence of strong support from central bank purchases, which had been a key driver of demand in recent years, is also weighing on precious metals, dragging gold and silver to multi-month lows.\n\nAgainst this backdrop, the upcoming US Federal Reserve meeting is shaping up to be a crucial event for bullion markets. Investors will closely watch whether the central bank raises interest rates again or pauses its tightening cycle, following its previous rate hike in September.\n\nThe outcome could offer fresh cues on the direction of gold and silver prices heading into 2027. The following are two likely scenarios on how prices will react to outcomes.", "source": "LiveMint Markets", "pub_date_str": "26 Nov 2026, 08:30 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Equity Investments", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Hawkish Fed poised to raise rates despite stock market turmoil", "full_content": "Inflation is top concern for US central bank officials even as tech-led sell-off triggers fears for economy", "source": "FT Markets", "pub_date_str": "26 Nov 2026, 08:28 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Market Trading Guide: Tech Mahindra, Angel One among 5 stock recommendations for Friday", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News Market Trading Guide: Tech Mahindra, Angel One among 5 stock recommendations for Friday Written by Akash Podishetti , ETMarkets.com | Nov 26, 2026, 08:24:11 PM IST 1 / 6 Trading Guide Indian equities recovered from early losses in a volatile session, as sustained foreign inflows and selective buying outweighed firm crude and the proposed US tariffs. Analysts say near-term sentiment remains constructive but volatile, as foreign liquidity should help limit the downside, while global rates, crude and trade negotiations could cap valuation expansion. Here are five stock recommendations for Friday\n\nKansai Nerolac has witnessed a notable improvement in its price structure after breaking above a falling trendline on the daily chart. Following the breakout, the stock underwent a period of consolidation and successfully retested the breakout zone, indicating strength at lower levels. It has now moved above the consolidation range with healthy volumes, signalling renewed buying interest. Additionally, the stock has sustained above its 200-Day EMA, reflecting a gradual improvement in the broader trend. Sachin Gupta, VP - Technical Research, Choice Broking\n\nTata Consumer has displayed strong bullish price action following a breakout from its recent trading range. The stock successfully retested the breakout zone before resuming its upward trajectory with a gap-up move backed by healthy volumes, highlighting fresh buying interest. It has also sustained above the upper Bollinger Band, reflecting strong price momentum and buying pressure. The RSI is currently placed at 74.96, indicating robust bullish momentum, although the elevated reading suggests the possibility of intermittent consolidation.", "source": "Economic Times Markets", "pub_date_str": "26 Nov 2026, 08:20 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Marlboro maker Altria explores takeover of UK's Imperial Brands", "full_content": "U.S. tobacco group Altria said on Thursday it was considering a possible all-cash offer for \u200bImperial Brands and was in talks with another party over part of \u200bthe British company's business, as Japan Tobacco also was reported to be \u2060weighing a bid.\n\nShares in London-listed Imperial Brands soared as much as 17.6% to \u200b3,562 pence, giving it a market capitalization of \u00a326.77 billion ($35.07 billion).\n\nBloomberg News earlier on Thursday \u200breported that Japan Tobacco is evaluating a potential acquisition of Imperial Brands, citing people familiar with the matter.\n\nLast week, Imperial Brands, which makes Winston cigarettes, announced plans to cut up to 4,600 jobs, \u200bor nearly a fifth of its workforce as it tightens its grip on \u200bcosts amid falling cigarette volumes and rising competition.\n\nImperial's brands also include Davidoff, Gauloises, West and Kool \u200cmenthol \u2060cigarettes, as well as Rizla rolling papers. Japan Tobacco's portfolio includes Camel and Benson & Hedges.\n\nAltria's family of companies includes Philip Morris USA \u2014 the maker of Marlboro in the United States.\n\nAltria said it was also in discussions with a third party for \u200ba part of Imperial \u200bBrands' business, although \u2060no agreement had yet been reached.\n\nThe Japanese group has been speaking with advisers as it weighs a possible transaction, the \u200breport said, adding that JT has considered teaming up with \u200ba partner \u2060to buy Imperial and then split up the British company's assets in different parts of the world.", "source": "CNBC Top News", "pub_date_str": "26 Nov 2026, 08:17 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Corporate Issuers", "Portfolio Management"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Norse Atlantic suspends all flights as it faces potential collapse - BBC", "full_content": "Norse Atlantic suspends all flights as it faces potential collapse BBC Pakistan's PIA to shift UK flights to own fleet after Norse Atlantic suspension Reuters Norse Atlantic suspends all flights, warns it may file for bankruptcy after share price collapse CNBC Norse Atlantic Airways suspends all flights as it makes urgent funding plea The Guardian Norse Atlantic faces liquidity crisis, loses PIA wet lease ch-aviation", "source": "Google News Business", "pub_date_str": "26 Nov 2026, 07:58 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Capital goods, strategic manufacturing sectors to generate 50 lakh jobs over next five years: CGSSC", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Indicators \u203a Capital goods, strategic manufacturing sectors to generate 50 lakh jobs over next five years: CGSSC The Economic Times daily newspaper is available online now. Read Today's Paper Capital goods, strategic manufacturing sectors to generate 50 lakh jobs over next five years: CGSSC SECTIONS Capital goods, strategic manufacturing sectors to generate 50 lakh jobs over next five years: CGSSC PTI Last Updated: Nov 26, 2026, 07:37:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Capital Goods & Strategic Skill Council emphasized the projected creation of 50 lakh job opportunities in India. These jobs will primarily be in capital goods and strategic manufacturing sectors over the next five years. There is a significant demand for skilled workers in various technical roles such as riggers and CNC operators. Advanced manufacturing and automation training are crucial to meet this demand effectively.\n\nHow rare is Nvidia's CEO comeback, really? The record for 20 years has an answer\n\nThe fall is new, the pattern is 11 years old: Making sense of gold's crash\n\nAs AI sharpens cyber attacks, should listed companies follow one standard in reporting them?\n\nKYC and KYB: Zydus Lifesciences \u2013 From the chemist\u2019s counter to US pharmacies. Part 1 of 3\n\nWhat would it take for the world to stop needing the Strait of Hormuz?\n\nHidden export winners: The unlikely products finding real buyers abroad\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "26 Nov 2026, 07:37 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Turned Nvidia CEO affair saga into a money machine? From $500 to $1 million: How a trader rode Huang's roller coaster", "full_content": "A Reddit trader has claimed to have turned an initial investment of just $500 into more than $1 million in about two weeks by making a series of high-risk options bets on Nvidia, capitalising on the chipmaker's dramatic stock movements following news surrounding its chief executive Jensen Huang.\n\nNvidia shares, which had plunged to a more than one-year low following reports of Jensen Huang's alleged extramarital affairs, including one with a Chinese businesswoman, recovered all their losses after he was reinstated as the company's CEO.\n\nThe trader, who goes by the username Outrageous-Voice1459 on the Reddit forum r/WallStreetBets, shared screenshots of the trading journey in a post titled \"I MADE GENERATIONAL MONEY: $1 million in 2 weeks.\"\n\nThe account of the trades has attracted considerable attention among retail trading enthusiasts, with the user detailing how a series of bets on Nvidia's put and call options helped build the account to seven figures.\n\nAccording to the trader's account, the journey began with a $500 investment in Nvidia put options, which gained substantially after news emerged about Huang stepping down as CEO. The trader claimed that the initial position grew to around $20,000 before subsequent trades pushed the account value to nearly $80,000.\n\nHowever, the gains did not come without setbacks. The account value subsequently dropped to around $40,000, leaving the trader with a decision on whether to book profits or continue taking risks in pursuit of a bigger payoff.\n\nThe trader said the next major bet came on Friday, November 20, when he invested around $20,000 in 145 Nvidia call option contracts expiring on November 25. The move was based on expectations of a recovery in the chipmaker's shares.\n\nThe timing proved particularly significant. Over the weekend, US President Donald Trump reportedly pushed for Huang's reinstatement, and Nvidia's board subsequently reinstated him as CEO.", "source": "LiveMint Markets", "pub_date_str": "26 Nov 2026, 07:23 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "A big shift for gold trading? JPMorgan, HSBC and StoneX complete first digital gold deals- What to know", "full_content": "Some of the world's biggest banks have completed their first live trades using a new form of digital gold in London, marking a potential turning point for the global bullion market.\n\nJPMorgan, HSBC and StoneX have completed their first trades using a new digital gold system, allowing them to buy, sell and use gold as security for financial deals without physically moving the bars. The World Gold Council (WGC) said the transactions mark the first time major banks have tested the system in real market deals.\n\nThe trials could open up new ways for banks and other financial institutions to use gold in financial markets, while retaining a direct ownership interest in the physical metal.\n\nThe transactions were carried out under the WGC's Wholesale Digital Gold initiative, which aims to modernise the way gold is owned, transferred and used by large financial institutions.\n\nUnder the system, physical gold bars stored in London are brought into a digital settlement network. Participants then receive Pooled Gold Interests, which represent their ownership of a share of the gold held in the pool.\n\nThe pilot used standard 400-ounce London Good Delivery gold bars . Once the transactions were completed and settled, the physical gold was withdrawn from the system, demonstrating the process from beginning to end.\n\nICE Benchmark Administration acted as the operator, while Baton Systems provided the technology.\n\nWGC Chief Executive David Tait described the development as a historic step for the gold market, saying major institutions had, for the first time, transferred and settled fractional ownership of physical gold and used it as collateral in live transactions.", "source": "LiveMint Markets", "pub_date_str": "26 Nov 2026, 07:18 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Alternative Investments", "Portfolio Management"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Futures point to Black Friday gains on Wall Street as global markets welcome U.S. resilience", "full_content": "A rebound off lows for the S&P 500 on Wednesday calms bourses after the tech washout.", "source": "MarketWatch Top Stories", "pub_date_str": "26 Nov 2026, 07:11 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Equity Investments", "Derivatives"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "NSE is now world's third-largest listed exchange by market cap, overtakes Nasdaq, LSE: Which two exchanges are ahead?", "full_content": "NSE's market capitalisation stood at approximately $64.1 billion, placing it ahead of Deutsche Boerse, valued at $63.4 billion, London Stock Exchange Group at $62.4 billion, Nasdaq at $59.4 billion and HKEX at $57.1 billion, the news outlet stated citing latest market data.", "source": "LiveMint Markets", "pub_date_str": "26 Nov 2026, 06:55 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "India to cross $1 trillion export mark by March 2027 despite proposed 25% US tariff: ASSOCHAM S     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
