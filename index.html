"source": "Economic Times Markets", "pub_date_str": "03 Nov 2026, 08:08 PM IST", "pub_date_relative": "45m ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Apple stock sinks as global memory crisis hurts profits, giving Ternus his first big test", "full_content": "John Ternus' first earnings report as Apple CEO was going fine until it was time to issue a forecast for the company's gross margin, one of the key metrics followed by investors.\n\nApple reported better-than-expected earnings and revenue on Monday, including in the company's core iPhone unit, and even projected sales in the current period that topped estimates. But just before Ternus opened the earnings call up to analysts' questions, CFO Kevan Parekh came forward with the first real piece of bad news.\n\nParekh said that for the December quarter, which goes through the holiday season, Apple's gross margin will be between 45% and 46%, trailing the 46.3% average analyst estimate, according to LSEG.\n\n\"This includes primarily the impact of higher memory costs, as well as some costs related to the ramp of Siri AI,\" Parekh said.\n\nApple stock chart It's part of an ongoing trend for Apple, which is absorbing some of the soaring costs from the global memory shortage. A margin drop in the fiscal first quarter would be a third straight decline for Apple, following a gross margin of 50.1% in the June period and 47.9% in the September quarter, boosted by 1 percentage point of tariff refunds.\n\nAt the midpoint of the forecast range, it would be Apple's lowest gross margin since the fiscal fourth quarter of 2023.\n\n\"What we're seeing with memory pricing right now is unprecedented,\" Ternus said on the call, adding that the company is paying more than it did earlier this year. \"Looking beyond the December quarter, we see the pricing for memory purchases continuing to increase.\"\n\nTernus, who took the reins from Tim Cook on Sept. 1, is grappling with a problem that his predecessor spent his final months addressing. Cook told The Wall Street Journal in June that the memory situation was a \"hundred-year flood.\" Apple followed by raising prices across the board on Macs, iPads and accessories.", "source": "CNBC World Economy", "pub_date_str": "03 Nov 2026, 08:08 PM IST", "pub_date_relative": "45m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Palantir slumps 5% after earnings as analysts point to slowdown in total contract value", "full_content": "Palantir shares fell on Tuesday after the software company reported third-quarter earnings and analysts pointed to signs of a slowdown in total contract value and other \"forward indicators.\"\n\nU.S. commercial revenue topped government for the first time, but the company closed $1.5 billion in TCV in the segment, up 11% from last year. In Q2, Palantir closed a record $2.1 billion worth of TCV in the segment, which was up 153% from the prior year.\n\nInvestors will \"no doubt be looking for evidence in subsequent quarters that 11% growth in U.S. commercial TCV bookings is a fluke of duration and not something structural,\" a Piper Sandler note from Monday said. \"We believe that is the case and demand for PLTR's solutions still very much outstrip supply.\"\n\nIn a Tuesday note, Goldman Sachs analysts noted that the company attributed some of this to shorter contract durations.\n\n\"The key will be converting shorter duration contracts into longer duration commitments, which Palantir has done successfully in the past,\" the analysts wrote.\n\nRevenue nearly doubled from a year ago and blew past $2 billion for the first time, Palantir said in its earnings report.\n\nPalantir stock chart. Apple's earnings The iPhone maker reported better-than-expected revenue in its fourth-quarter earnings, but fell short of estimates on iPad sales and issued a margin forecast that disappointed investors.\n\nApple 's statement marked the first earnings report since John Ternus took over as CEO from Tim Cook in September. The stock fell more than 2% on Tuesday.", "source": "CNBC World Economy", "pub_date_str": "03 Nov 2026, 08:01 PM IST", "pub_date_relative": "52m ago", "cfa_topics": ["Financial Statement Analysis", "Fixed Income"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "ED Attaches Rs 510 Crore More Assets of Reliance Anil Ambani Group; Total Crosses Rs 23,000 Crore", "full_content": "The agency has cumulatively attached or seized assets worth nearly Rs 23,100 crores till date in several cases being investigated against Reliance Anil Ambani Group under the provisions of Prevention of Money Laundering Act (PMLA) and the Foreign Exchange Management Act (FEMA).", "source": "NDTV Profit", "pub_date_str": "03 Nov 2026, 08:00 PM IST", "pub_date_relative": "53m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Rs 85,000 Salary, Rs 35,000 SIP & Just Rs 3,200 In Bank: Money Lessons From Young Investor's Mistakes", "full_content": "A sudden combination of expenses exposed a major gap in the individual's money management strategy.", "source": "NDTV Profit", "pub_date_str": "03 Nov 2026, 07:54 PM IST", "pub_date_relative": "59m ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Q2 Results Live: MCX Profit Up 10%; INOX India Revenue Up 27%; NSE Profit Slips 17%; SBI Asset Quality Improves", "full_content": "A packed earnings calendar awaits investors, with heavyweight names including SBI, NSE, Bajaj Finserv, MCX, Lupin, Solar Industries, Emcure Pharmaceuticals and Bata India set to unveil their quarterly scorecards.", "source": "NDTV Profit", "pub_date_str": "03 Nov 2026, 07:48 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Pfizer hikes full-year outlook as newer products grow, taps company veteran as new CFO", "full_content": "Pfizer on Tuesday reported fiscal third-quarter results that topped estimates and hiked its full-year outlook, as demand for its newly launched and acquired products grows.\n\nPfizer also Tuesday announced that Cecile Guegan , who has held various finance leadership roles at the company over the last two decades, stepped in as chief financial officer this month. She had served as interim CFO since August, when Pfizer's former CFO, Dave Denton, stepped down to take the same position at Nike.\n\nThe company is now expecting full-year revenue to total $62 billion to $64 billion, which compares with a previous outlook of $60.5 billion to $62.5 billion. The low end of that sales range would be roughly flat or down slightly compared with 2025 revenue of $62.6 billion. Still, Pfizer cited its \"strong year-to-date performance\" as a driver for the guidance hike.\n\nThe pharmaceutical giant now expects full-year adjusted profit of between $2.95 and $3.05 per share. That compares with previous guidance of between $2.80 and $3 per share.\n\nThat includes a one-time $650 million charge, or a negative impact of 10 cents per share, recorded in the third quarter tied to the company's licensing and collaboration agreement with Chinese cancer drugmaker Innovent Biologics.\n\nPfizer is working on a comeback story after its massive pandemic-era success waned. As demand for Covid products drops and generic rivals threaten its biggest moneymakers, CEO Albert Bourla is looking to jump-start growth through strategic acquisitions, fresh cancer drugs and a big bet on weight loss treatments through its acquisition of Metsera.\n\nPfizer in August expanded its multiyear cost-cutting efforts to help offset sharp declines in Covid product sales, and is now targeting roughly $9.7 billion in net savings through 2029.\n\nHere's what the company reported for the third quarter compared with what Wall Street was expecting, based on a survey of analysts by LSEG:", "source": "CNBC Top News", "pub_date_str": "03 Nov 2026, 07:48 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Versant earnings beat expectations as digital platforms drive growth", "full_content": "Versant Media on Tuesday reported quarterly earnings and revenue that beat expectations and reaffirmed its full-year 2026 guidance, citing strength across its portfolio and growth in its platforms revenue.\n\nThe media company reported $245 million in revenue from digital platforms including Fandango, marking a nearly 10% year-over-year increase. Versant said Fandango saw \"significant growth\" in ticketing revenue in the third quarter, notching its highest level since the pandemic.\n\nAdvertising revenue, however, slipped to $373 million during the period, down 5.3% from last year, primarily due to the impact of last year's Ryder Cup, according to the company.\n\nThe Versant portfolio includes CNBC, MS NOW, Golf Channel and other cable and digital properties.\n\nHere's how the company performed in its third quarter , compared with what Wall Street was expecting, based on a survey of analysts by LSEG:\n\nVersant completed four major distribution renewals this year following its spinoff from Comcast's NBCUniversal.\n\n\"We understood the questions raised at the time of the spin about our ability to secure attractive carriage renewals,\" CEO Mark Lazarus said on a call with analysts. \"We've now answered that question: 75% of our network subscribers are now under contract into 2028 and beyond, so we have clear visibility going forward.\"\n\nDuring the third quarter, Versant said, its networks reached more than 120 million viewers monthly and its aggregate viewership grew by double digits year over year. The company also launched MS NOW's direct-to-consumer product and Fandango's on-demand product as new growth drivers. CNBC is expected to launch a direct-to-consumer product next year, Versant said.", "source": "CNBC Top News", "pub_date_str": "03 Nov 2026, 07:47 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Gold Savings Schemes From Jewellers: Are You Really Getting One Month Of Gold For Free?", "full_content": "Purchasing gold in India attracts 3% GST. For jewellery, you also need to pay making charges that can range from 5% to 25% or even more.", "source": "NDTV Profit", "pub_date_str": "03 Nov 2026, 07:46 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "DuPont raises annual profit forecasts on strong healthcare, aerospace demand", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a DuPont raises annual profit forecasts on strong healthcare, aerospace demand Powered By The Economic Times daily newspaper is available online now. Read Today's Paper DuPont raises annual profit forecasts on strong healthcare, aerospace demand SECTIONS DuPont raises annual profit forecasts on strong healthcare, aerospace demand Reuters Last Updated: Nov 03, 2026, 07:44:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis DuPont has raised its full-year profit forecasts and projected fourth-quarter earnings exceed analyst estimates. The company experienced strong demand in healthcare, aerospace, and industrial water markets during the third quarter. DuPont's healthcare and water technologies segment reported nearly 4% growth year-over-year, reaching $865 million in net sales. Additionally, the company recently concluded a $250 million share repurchase program and plans to buy back an additional $250 million of shares.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "03 Nov 2026, 07:44 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Ferrari nudges up full-year forecasts after beating consensus in Q3", "full_content": "Ferrari has revised its earnings outlook for 2026 due to impressive third-quarter performance that exceeded expectations. The company noted a 12% increase in adjusted EBITDA, greatly surpassing analyst forecasts. This growth stems from sales of high-margin vehicles and personalized customer requests. However, the total vehicle shipments dipped slightly, totaling 3,368 in the July-September timeframe. The robust order book extends through 2028, with more product launches on the horizon.", "source": "Economic Times Markets", "pub_date_str": "03 Nov 2026, 07:38 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Binance customers withdraw $7.4 billion after crypto heist - CBS News", "full_content": "Binance customers withdraw $7.4 billion after crypto heist CBS News Binance Withdrawals Accelerate To $10.97 Billion Yahoo Finance North Korea denies links to Binance hack as researchers trace stolen billions CNBC Binance Hackers Used Fake Job Interviews in $6.3 Billion Heist Bloomberg.com Binance battles to save its brand after record $6.3bn crypto hack The Guardian", "source": "Google News Business", "pub_date_str": "03 Nov 2026, 07:38 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "This indicator has triggered just 5 times since 2000 \u2014 and it warns of a trap for stocks", "full_content": "Compared with previous market drawdowns, the current market setup is vulnerable because rising inflation limits the ability of central banks to ease rates and reflate asset prices. Reduce stocks and add bonds and cash, this macro research house advises", "source": "MarketWatch Top Stories", "pub_date_str": "03 Nov 2026, 07:36 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Google Will Turn Off Search for Schools That Reject A.I. - The New York Times", "full_content ries": 317};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
