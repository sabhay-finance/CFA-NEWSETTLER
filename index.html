eing the notable exception. The index has also failed to respond positively to SEBI\u2019s announcement of a review. Stronger-than-estimated GDP numbers provided little support to sentiment either.\n\nThe weakness has been persistent rather than limited to a few sessions. Since August 3, the Nifty has closed lower on most trading days.\n\nThe pace of the present correction is notably different from the preceding upmove. From the July 24 low, the Nifty had gained 1,168 points, or 4.95%, in only six to seven trading sessions before the correction began.\n\nThe current downswing has now lasted 23 trading days and has taken almost four times as long to retrace 80% of the earlier advance. The extended duration of the decline, compared with the speed of the previous rise, points to a meaningful loss of momentum.\n\nThe overall structure has weakened as the index has moved below its major moving averages. On the weekly chart, the Nifty has closed below both the 20-week moving average and the 30-week weighted moving average. A close below these averages adds to the longer-term bearish concerns.\n\nThe weakness is not confined to the weekly chart. The Nifty has also slipped below the 8-EMA, 20-DMA and 50-DMA. It is currently 1.27% below the 50-DMA.", "source": "LiveMint Markets", "pub_date_str": "07 Sep 2026, 06:19 AM IST", "pub_date_relative": "45m ago"}, {"title": "Australia\u2019s Ingenia rejects $1.4 bln Warburg Pincus buyout bid; shares surge", "full_content": "", "source": "Investing.com News", "pub_date_str": "07 Sep 2026, 06:13 AM IST", "pub_date_relative": "50m ago"}, {"title": "NSE grey market premium soars on Sebi's IPO approval", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a NSE grey market premium soars on Sebi's IPO approval The Economic Times daily newspaper is available online now. Read Today's Paper NSE grey  China pumps massive US$54b into insurers, banks in financial powerhouse push South China Morning Post ICBC (601398.SH) plans to raise no more than RMB 100 billion through a private placement to the Ministry of Finance, China National Tobacco Corporation, and other investors. Moomoo", "source": "Google News Business", "pub_date_str": "07 Sep 2026, 06:08 AM IST", "pub_date_relative": "56m ago"}], "cfa": [{"title": "Australian shares tread water as energy stocks counter gold slump", "full_content": "Sept 7 (Reuters) - Australian shares traded in a narrow range on Monday, as strength in energy companies partially offset weakness in gold stocks, while investors stayed on the sidelines as a flare-up in tensions in the Middle East helped oil prices extend gains.\n\nThe S&P/ASX 200 index held its ground at 9,009.60, as of 0010 GMT. On Friday, the benchmark lost 0.2% and logged its worst week in nearly a month.\n\nCrude prices advanced on Monday following tit-for-tat strikes between the United States and Iran on vessels sailing in the bottleneck Strait of Hormuz alongside other areas during the weekend, intensifying worries of a prolonged supply disruption.\n\nOil's surge helped energy-linked stocks in Sydney snap a two-session losing run, with sector leaders Woodside Energy and Santos gaining 0.6% and nearly 1%, respectively.\n\nElsewhere in the main index, real estate and consumer discretionary stocks added to broader strength, up 0.6% and 0.4%, respectively.\n\nShares of data centre landlord Goodman Group rose 0.4% while electronics retailer JB Hi-Fi advanced as much as 1.5% to its highest point in nearly two weeks.\n\nBucking the broader strength, gold stocks dropped 1%. The yellow metal fell 2% on Friday after a stronger-than-expected U.S. jobs report boosted expectations of an imminent rate hike from the Federal Reserve.\n\nIndex majors Northern Star Resources and Evolution Mining declined 0.8% and 0.5%, respectively.", "source": "LiveMint Markets", "pub_date_str": "07 Sep 2026, 06:57 AM IST", "pub_date_relative": "7m ago", "cfa_topics": ["Economics", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Dollar gets little lift from boost in Fed hike expectations", "full_content": "* Rising oil prices keep pressure on global inflationary pressures\n\n* Traders leaning toward Sept Fed hike, much riding on U.S. inflation data this week\n\nSINGAPORE, Sept 7 (Reuters) - The dollar was on shaky ground on Monday, despite a ramp-up in U.S. rate hike bets as Middle East tensions raised the prospect of broader inflationary pressures that could force global central banks to tighten policy in tandem.\n\nA shift in sentiment towards the Japanese yen and worries about ever-growing U.S. debt and policy uncertainties also weighed on the greenback.\n\nMoves in currencies were largely subdued in early Asia trade with U.S. markets closed for a holiday, though the dollar struggled to sustain a brief lift it received from Friday's blowout U.S. jobs report.\n\nThe euro was up marginally at $1.1618, while sterling was little changed at $1.3519. Against a basket of currencies, the dollar fell 0.07% to 99.09, not far from its recent low of 98.558.\n\nTraders moved to price in a roughly 57% chance the Federal Reserve will hike rates this month in the wake of the nonfarm payrolls release, with much now depending on Friday's inflation data.\n\n\"A hot CPI print would all but seal a September hike and underpin a firmer U.S. dollar. A cooler reading would strengthen the case for a hold and leave the U.S. dollar vulnerable to a dovish Fed repricing,\" said Elias Haddad, global head of markets strategy at BBH.", "source": "LiveMint Markets", "pub_date_str": "07 Sep 2026, 06:48 AM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Can Prasol Chemicals IPO deliver long-term growth for high-risk investors?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a Can Prasol Chemicals IPO deliver long-term growth for high-risk investors? The Economic Times daily newspaper is available online now. Read Today's Paper Can Prasol Chemicals IPO deliver long-term growth for high-risk investors? SECTIONS Can Prasol Chemicals IPO deliver long-term growth for high-risk investors? By Snehal Mergu , ET Bureau Last Updated: Sep 07, 2026, 06:42:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Prasol Chemicals plans an IPO to raise funds for debt repayment and expansion. The company's revenue and profits have shown significant growth in recent years. Its product portfolio includes acetone and phosphorus-based specialty chemicals for various industries. Capacity utilization at one plant improved, though it remains relatively low. Investors with a high-risk appetite may consider applying for this offering.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "07 Sep 2026, 06:42 AM IST", "pub_date_relative": "22m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Breakout stocks to buy or sell: Sumeet Bagadia recommends five shares to buy today \u20147 September 2026", "full_content": "Buy or sell stocks : The Indian stock market ended the week on a cautious note, extending its recent correction as elevated crude oil prices, renewed geopolitical tensions and uncertainty surrounding the global interest-rate trajectory continued to dampen investor sentiment. Although benchmark indices rebounded on Friday to snap a four-session losing streak, the recovery remained muted amid sustained foreign investor outflows and concerns over higher energy costs.\n\nOver the week, the Nifty 50 fell around 1.15% to end at 23,897.70, while the Sensex declined nearly 1.0% to close at 76,515.43. Both indices registered their fourth straight weekly loss, underscoring persistent weakness in the broader market despite selective buying in individual stocks.\n\nNifty 50 opened on a positive note at 23,910, around 37 points higher than the previous close of 23,873. The index initially witnessed an upside move during the first half of the session and touched an intraday high of 24,005.75. However, it failed to sustain the gains as slight profit booking emerged in the latter part of the session. Nifty slipped from the day's high and finally settled at 23,897.70, up 24.25 points (+0.10%). The price action indicates that the index lost most of its first-half upside momentum amid profit booking, resulting in a marginal gain for the session.\n\nAccording to Sumeet Bagadia, Executive Director at Choice Broking, Nifty formed a small bearish candlestick on the daily chart, reflecting hesitation at higher levels and continued selling pressure near the re xis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "07 Sep 2026, 06:09 AM IST", "pub_date_relative": "55m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Portfolio Management"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Raja Venkatraman recommends three stocks for 7 September", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nStock market recap : Benchmark indices recovered on Friday, snapping a four-day losing streak as gains in metal, private banking and oil and gas stocks, along with a firm trend in global markets, lifted investor sentiment.\n\nThe 30-share BSE Sensex climbed 362.57 points, or 0.48%, to settle at 76,515.43, with 20 constituents ending higher and 10 lower. The broader NSE Nifty rose 24.25 points, or 0.10%, to 23,897.70.\n\nOn the Sensex, Tata Steel, Reliance Industries, Bajaj Finance, Trent, Adani Ports, HDFC Bank , Kotak Mahindra Bank, UltraTech Cement, Titan, Mahindra & Mahindra and Hindustan Unilever were the major gainers.\n\nFor the week, domestic equities ended about 1% lower, as elevated global bond yields and expectations of tighter US monetary policy weighed on investor sentiment and foreign flows.\n\nBetween 31 August 31 and 4 September, Indian equities displayed a mixed performance, with benchmarks struggling to sustain momentum even as select sectors and midcaps provided pockets of strength. The Sensex and Nifty ended the week marginally lower, extending the cautious undertone that has persisted in recent sessions. The Nifty Bank also slipped modestly, reflecting subdued activity in financials. Sectoral divergence was evident \u2014 FMCG and PSU stocks continued to weigh on sentiment, while IT and select private banks offered support.\n\nAt the stock level, weakness was broad-based, with several Nifty constituents declining over 2% during the week. NTPC and Shriram Finance remained under pressure, while Adani Enterprises and Kotak Mahindra Bank stood out among gainers, each advancing more than 2%. The midcap segment once again outperformed, with notable strength in SAIL, Glenmark Pharma, LIC Housing Finance, and Laurus Labs. Ather Energy surged after fresh investment inflows, underscoring investor confidence in the EV space.", "source": "LiveMint Markets", "pub_date_str": "07 Sep 2026, 06:07 AM IST", "pub_date_relative": "56m ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Small-cap corrections have narrowed to 25% post-covid: SageOne\u2019s Samir Vartak", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nSmall cap stocks used to fall by around 40-45% during corrections in the pre-covid period. However, post-covid, the average decline has been closer to 25%, said Samir Vartak, founder and chief investment officer of SageOne Investment Managers.\n\nSimultaneously, earnings growth has accelerated, Vartak told Mint in an interview. While small-cap earnings growth largely mirrored that of large caps prior to covid, though with greater volatility, it now outpaces large-cap earnings growth by at least 5 to 8 percentage points.\n\nSmall caps tend to be very cyclical. In the past, they went through a 3-4 year cycle, followed by 9-18 months of correction. The peak was around September 2024, and 18 months later the correction phase was largely complete.\n\nBut now the earnings growth is picking u p specially in March and June. Small-cap earnings growth was around 32%, while mid-cap was 28%. So, based on the cyclicality and earnings trajectory, we are entering a good 2.5 year phase for smids .\n\nSmallcaps have become bigger in size. The market cap of the 1,000th company was around \u20b9 240 crore in 2019. Today, it is above \u20b9 3,000 crore, or 13 times larger. In 2019, a \u20b9 23,000 crore company was a large cap. Today, a \u20b9 37,000 crore company is a small cap based on Sebi\u2019s definition.\n\nSecondly, the quality of small caps has improved significantly post-covid. In 2019, the median net debt-to-equity ratio for the small-cap universe was around 0.5 to 0.6. Today, it is almost zero. More than 50% of small-cap companies are debt-free.\n\nProfitability has also improved. Return on equity for the small-cap universe used to be around 10-12%; today, it is about 15%.", "source": "LiveMint Markets", "pub_date_str": "07 Sep 2026, 06:00 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stock recommendations for 7 September from MarketSmith India", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nStock market recap: Indian equity benchmarks ended higher on Friday, though gains were trimmed from the day's highs as the session progressed. Nifty 50 rose 24.25 points, or 0.10%, to close at 23,897.70, while Sensex gained a firmer 362.57 points, or 0.48%, to settle at 76,515.43.\n\nMetals were the standout sector, jumping 1.42% ahead of key U.S. payrolls data, led by strength in Tata Steel, APL Apollo, and Hindustan Zinc.\n\nThe rupee touched a two-month high after FCNR(B) deposits crossed $127 billion, easing concerns over currency pressure. At the same time, global bond yields cooled, and Brent crude held near $95\u201396 per barrel amid lingering U.S.-Iran uncertainty.\n\nReliance Industries, SBI Life, HDFC Life, Trent, and Wipro were among the notable gainers. Meanwhile, IT, Auto, Capital Goods, and Healthcare ended in the red, capping the broader upside. Nifty Bank closed nearly flat. Market breadth stayed constructive, with 2,017 stocks advancing, 1,519 declining, and 112 remaining unchanged. Investors will now watch global cues from the U.S. jobs report and crude oil trends for further direction, with elevated oil prices continuing to pose a risk to the domestic growth-inflation outlook.\n\nIndian equities ended a volatile session largely flat on 4 September, with Nifty 50 closing at 23,897.70, up 24.25 points or 0.10%, after touching an intraday high of 24,005.75 and a low of 23,895.85. The index briefly reclaimed 24,000 but surrendered most gains toward the close, indicating resistance around 24,000\u201324,050, while 23,850\u201323,900 remains the immediate support zone.\n\nPositive global cues and easing expectations of a near-term U.S. Federal Reserve rate hike supported sentiment following four consecutive sessions of declines. On the sectoral front, metals (+1.07%) led the gains, followed by financial services (+0.47%), media (+0.30%) and private banks (+0.28%).", "source": "LiveMint Markets", "pub_date_str": "07 Sep 2026, 06:00 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Stocks in news: Tata Motors, RVNL, Eicher Motors, Mazagon Dock and Lupin", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Stocks in news: Tata Motors, RVNL, Eicher Motors, Mazagon Dock and Lupin Eicher Motors Share Price Bajaj Auto Share Price TVS Motor Company Share Price Her e, dividends, M&A) are core exam material."}, {"title": "Asia-Pacific markets open higher as investors assess renewed Middle East hostilities", "full_content": "Asia-Pacific markets open broadly higher Monday, with renewed focus on Middle East where tensions do not seem to be subsiding as U.S. and Iran engage in tit-for-tat strikes.\n\nJapan's Nikkei 225 added nearly 1%, while the Topix rose 0.55%. The Kospi advanced 3.09% at open, while the small-cap Kosdaq gained 1.33%. Australia's benchmark S&P/ASX 200 was flat.\n\nMiddle East turmoil persisted, following news that the U.S. struck three Iranian oil tankers after saying warships were targeted with ballistic missiles. U.S. Secretary of Energy Chris Wright said that the Iran nuclear deal may not happen anytime soon.\n\n\"There may not be a nuclear agreement. It may be simply destroying their capabilities to do it,\" Wright said on ABC News' \"This Week.\" \"An agreement may await the next administration in Iran. We simply don't know that.\"\n\nPreventing Iran from acquiring a nuclear weapon has repeatedly been cited by President Donald Trump as a key objective of the U.S. campaign. At the same time, Trump has continued to pursue a diplomatic agreement with Tehran during the war, which has driven energy prices sharply higher around the world.\n\nWright's remarks indicate that the administration could seek to eliminate Iran's ability to develop a nuclear weapon even without securing a formal agreement with Tehran.\n\nU.S. stock markets will be closed on Monday due to a holiday.\n\nJapan's Nikkei 225 added nearly 1%, while the Topix rose 0.55%.", "source": "CNBC Top News", "pub_date_str": "07 Sep 2026, 05:50 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Pre-market action: Here's the trade setup for today's session", "full_content": "Home ETPrime Markets Market Data Mas Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "07 Sep 2026, 05:48 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Wheat Falls as Traders Weigh Outlook for Black Sea Shipments", "full_content": "(Bloomberg) -- Chicago wheat futures extended losses on Friday, on track for a weekly decline, as traders weighed the outlook for grain shipments from the Black Sea region.\n\nRussian President Vladimir Putin on Thursday said his nation and Ukraine maintain contacts, even as he gave little sign that they\u2019re making any progress on a peace deal. While a meaningful de-escalation remains elusive, traders took the remarks as an opportunity to sell wheat futures that had been trading at the highest levels since 2023 earlier in the week.\n\nAdding to the pressure, Ukrainian President Volodymyr Zelenskyy said US President Donald Trump\u2019s envoys Steve Witkoff and Jared Kushner will visit Moscow and then Ukraine in the coming days. Ukraine won\u2019t conduct airstrikes for the period needed for the US visit and expects Russia to reciprocate, Zelenskyy said.\n\nThe most-active futures contract fell as much as 2.7%, following a sharp Thursday selloff. Prices are on track for a roughly 6% weekly decline, after soaring more than 10% in the last week of August.\n\nWithin hours of Putin\u2019s comments on Thursday, Russian forces struck two vessels in the Black Sea, while Ukraine attacked a service ship involved in repair works at a key oil terminal in the region.\n\nOn Friday, a Russian drone struck the central headquarters of Security Service of Ukraine in central Kyiv, Zelenskyy said.\n\n\u201cThe sharp decline in wheat futures appears to reflect the market initially removing part of the Black Sea geopolitical premium on expectations of potentially more constructive Russia\u2013Ukraine negotiations,\u201d analysts at STAG International wrote in a Friday note.", "source": "LiveMint Markets", "pub_date_str": "07 Sep 2026, 05:48 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}], "updated_at": "07 Sep 2026, 07:04 AM IST", "total_stories": 302};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
