ke bets, benchmark trades at discount", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Bonds \u203a India bonds slump on Fed rate hike bets, benchmark trades at discount Powered By The Economic Times daily newspaper is available online now. Read Today's Paper India bonds slump on Fed rate hike bets, benchmark trades at discount SECTIONS India bonds slump on Fed rate hike bets, benchmark trades at discount Reuters Last Updated: Aug 31, 2026, 12:30:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Indian government bonds faced a downturn on Monday as yields spiked significantly. Hawkish statements from the head of the U.S. Federal Reserve ignited concerns about imminent rate hikes. Additionally, oil prices surged over ninety dollars a barrel, compounding market pressures. This confluence of events casts a shadow over India's inflation expectations and fiscal health, prompting traders to anticipate local swap rate increases in light of potential Fed actions.\n\nIndian government bonds faced a downturn on Monday as yields spiked significantly. Hawkish statements from the head of the U.S. Federal Reserve ignited concerns about imminent rate hikes. Additionally, oil prices surged over ninety dollars a barrel, compounding market pressures. This confluence of events casts a shadow over India's inflation expectations and fiscal health, prompting traders to anticipate local swap rate increases in light of potential Fed actions.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "31 Aug 2026, 12:30 PM IST", "pub_date_relative": "34m ago", "cfa_topics": ["Quantitative Methods", "Economics", "Equity Investments", "Derivatives", "Portfolio Management"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "U.S.-Iran escalation shows Washington's frustration with slow-moving sanctions", "full_content": "The escalation in hostilities between the U.S. and Iran over the weekend shows the U.S. is running out of patience with the slower-moving sanctions approach, according to analysts.\n\nU.S. forces destroyed two Iranian rocket launchers on Larak Island on Sunday, as the Islamic Republic prepared to fire mine-carrying rockets into the Strait of Hormuz, ending a month-long lull in direct fighting.\n\nThe strike was the first publicly acknowledged U.S. attack since late July. Iran responded within hours, firing eight missiles at the King Hussein and Al Azraq air bases in Jordan. Jordanian air defenses intercepted all eight, with no casualties, the government said.\n\nLater Sunday, President Donald Trump threatened on social media to blow up Kharg Island, Iran's main oil-export hub, to \"smithereens.\"\n\n\"Most of the war has been tactically focused rather than strategic from the outset,\" said Ian Ralby, a maritime security expert and president of Auxilium Worldwide. \"The question, therefore, is: why this, why now?\"\n\nThe sanctions campaign may not be hurting Iran's leadership fast enough for the U.S.'s liking, Ralby said. Treasury Secretary Scott Bessent told Reuters on Sunday that he expects new sanctions on Iran weekly, particularly targeting banks, and that Washington intends to cut Tehran-linked institutions out of the dollar system entirely.\n\n\"It may be that the financial pressure was not curtailing Iranian behavior to the level the U.S. anticipated,\" Ralby said. Renewed Iranian military activity may also have threatened U.S. forces or interests in the region \"at a sufficiently high level of gravity that the U.S. felt it necessary to strike Iranian territory once more.\"\n\nThe U.S. strike is like     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
