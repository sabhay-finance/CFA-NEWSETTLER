vestors assess Jensen Huang's return to Nvidia", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Nasdaq, S&P 500 end lower as investors assess Jensen Huang's return to Nvidia Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Nasdaq, S&P 500 end lower as investors assess Jensen Huang's return to Nvidia SECTIONS Nasdaq, S&P 500 end lower as investors assess Jensen Huang's return to Nvidia Reuters Last Updated: Nov 25, 2026, 02:51:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Nasdaq and S&P 500 indices experienced a drop as Nvidia and other tech shares fell. Investors reacted to potential new tariffs, raising concerns about market stability. Nvidia's CEO Jensen Huang was reinstated, which had previously spurred a market rally. In contrast, the Dow Jones Industrial Average saw gains amid varied sector performances. Anticipation for the upcoming Personal Consumption Expenditures report added further uncertainty to investor sentiment.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "25 Nov 2026, 02:39 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "OpenAI Engineer Secretly Recorded Dozens of Meetings, Prosecutors Say - The New York Times", "full_content": "OpenAI Engineer Secretly Recorded Dozens of Meetings, Prosecutors Say The New York Times Saudi national charged in OpenAI bugging to be released on $1 million bond CNBC OpenAI Staffer Charged With Planting Bug Released on Bond Bloomberg.com OpenAI engineer possessed dozens of meeting recordings, say US prosecutors Financial Times Saudi engineer used OpenAI\u2019s vibe-coding app to more efficiently bug its office, feds say Business Insider", "source": "Google News Business", "pub_date_str": "25 Nov 2026, 02:39 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Drugmaker Insmed shares rally 14% after Sanofi agrees to buy it in pharma\u2019s biggest deal in three years", "full_content": "Insmed shares rallied 14% on Tuesday after Sanofi announced it would buy the smaller drugmaker for $41 billion, marking the largest pharma deal since 2023.\n\nThe proposed acquisition includes Insmed's portfolio of two commercialized respiratory drugs as well as its pipeline of experimental candidates. Sanofi will pay $175 per share in cash.\n\nIt's a big bet by new Sanofi CEO Belen Garijo, who took up the role in May to steer the company through its upcoming patent cliff , when its blockbuster immunology drug Dupixent will face generic competition as patents expire.\n\nIf closed, the transaction will be the biggest one the industry has seen since Pfizer bought Seagen for $43 billion in December 2023.\n\nInsmed shares closed up 14.1% at $170.15 on Tuesday, while Sanofi stock closed up 10.9% in Paris.\n\nBarclays analysts called the deal a \"breath of fresh air,\" significantly improving Sanofi's Dupixent patent expiry outlook by adding Insmed's established respiratory assets Brinsupri and Arikayce, plus a late-stage pipeline offering further potential upside.\n\nThe deal is expected to close in the first half of 2027 and be accretive to earnings by the end of 2028, Sanofi said.\n\nLike much of the industry, Sanofi faces a revenue drop toward the end of the decade as top-selling drugs lose exclusivity and open up for generic drugmakers to compete.", "source": "CNBC Top News", "pub_date_str": "25 Nov 2026, 02:37 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Derivatives", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Anthropic closes below $83 IPO price, but analysts are still largely positive", "full_content": "Shares of Anthropic closed down 6.5% on Tuesday, sending the stock below the artificial intelligence company's $83 IPO price.\n\nThe AI lab's stock has been sinking steadily since opening at $111.50 on the Nasdaq on Thursday, after Anthropic raised $81.3 billion in the largest offering of all time. Investors eagerly awaited Anthropic's debut in hopes that the company would revitalize the broader AI trade, which has been volatile in recent weeks over concerns about the feasibility of a multitrillion-dollar infrastructure buildout.\n\nAnthropic's initial public offering was oversubscribed, and roughly half of the institutional investors that placed orders for the stock were left empty-handed, as CNBC previously reported . But at least for now, as the market wavers, those firms don't appear to be racing to scoop up shares.\n\nChip stocks Nvidia , Advanced Micro Devices and Intel , as well as neoclouds CoreWeave , IREN and Nebius , all fell during intraday trading on Tuesday. The market is still reeling after Nvidia reinstated Jensen Huang as CEO, a dramatic reversal from his ouster earlier this month. Nvidia shares surged more than 30% on Monday, but pared those gains Tuesday.\n\nAnalysts at Canaccord Genuity said Tuesday that they're focused on Anthropic's long-term potential.", "source": "CNBC World Economy", "pub_date_str": "25 Nov 2026, 02:34 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Alternative Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Bitcoin Surrenders Most Gains Amid Sustained ETF Outflows", "full_content": "(Bloomberg) -- Bitcoin pared just about all of the gains posted earlier when Jensen Huang was reinstated as chief executive officer of Nvidia Corp., with investors continuing to exit the digital-asset sector following weeks of heavy selling.\n\nAn earlier rebound of almost 6% had offered some relief for the cryptocurrency after seven consecutive weekly declines, its longest losing streak since the Terra-Luna crash in 2022. The brief bump came as a reprieve amid accelerating withdrawals from US-listed Bitcoin exchange-traded funds, which shed about $1.8 billion last week, the most since June. The tech-heavy Nasdaq 100 Index climbed around 6.7%.\n\n\u201cCrypto had been dragged down of late by the downturn in AI equities and the spillover in risk off sentiment from that sector,\u201d said Carlos Guzman, GSR\u2019s vice president of research.\n\nNvidia announced Huang\u2019s return after an extraordinary intervention from the Trump administration. The company said in a statement Monday that it was confident Huang will not jeopardize national security after \u201cinput from senior levels of the United States government.\u201d US President Donald Trump has repeatedly urged Nvidia to bring back Huang after his ouster following revelations that he had an affair with a suspected Chinese spy.\n\n\u201cBitcoin has been trading like a high-beta AI stock this month,\u201d said Andrew Yang, a research analyst at Kaiko. \u201cIts 30-day correlation with Nvidia hit 0.71 on Friday, the highest this year and nearly double its 2026 average.\u201d\n\nBitcoin slumped to a more than two-year low over the weekend, dropping to $55,254 on Nov. 21.", "source": "LiveMint Markets", "pub_date_str": "25 Nov 2026, 02:33 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Quantitative Methods", "Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "Anthropic shares tumble below $83 IPO price, on track to lose nearly $200 billion in value - Reuters", "full_content": "Anthropic shares tumble below $83 IPO price, on track to lose nearly $200 billion in value Reuters Anthropic: ANT that a shame Axios Jensen Huang Isn\u2019t Worried. But You Should Be. The Atlantic Anthropic closes below $83 IPO price, but analysts are still largely positive CNBC Anthropic Shares Plunge Below IPO Price in Fourth Trading Day Bloomberg.com", "source": "Google News Business", "pub_date_str": "25 Nov 2026, 02:17 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Utah drops criminal charges against Kalshi founders after company suspended operations in state", "full_content": "Utah on Tuesday dismissed criminal charges against Kalshi and its two co-founders following the decision by the prediction market platform on Monday to suspend operations in the state.\n\nThe state originally filed the 14 criminal charges against the company and founders Tarek Mansour and Luana Lopes Lara on Oct. 28, claiming that Kalshi operated an illegal gambling operation in the state.\n\nThe Commodity Futures Trading Commission \u2014 the federal regulator for prediction markets which views itself as the sole body that can develop rules over the growing industry \u2014 sued Utah the day before the state announced its charges.\n\nMansour and Lara were slated to appear in a Utah district court on Dec. 4, according to court documents.\n\nHowever, Kalshi suspended operations in Utah on Monday, citing legal uncertainty. Utah Attorney General Derek Brown celebrated the decision in a statement announcing the move to dismiss the state's charges.\n\n\"Every company in this space should take note,\" he said. \"If they promote, support, or enable gambling, we will hold them accountable.\"\n\nBrown's office noted in the statement that dismissal is without prejudice, meaning if Kalshi were to begin operations again in the state the charges could be refiled.\n\n\"Good faith jurisdictional disagreements should never be criminalized,\" Kalshi's general counsel Yaakov Roth said in a post on X . \"We stand ready to work with State AGs on reasonable interim measures until courts resolve the dispute over who regulates prediction markets.\"", "source": "CNBC Finance", "pub_date_str": "25 Nov 2026, 02:15 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Derivatives", "Alternative Investments"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Jensen Huang tells staff that Nvidia doesn't need a succession plan", "full_content": "Nvidia CEO Jensen Huang on Tuesday struck a conciliatory and remorseful tone while leading his first employee meeting since being reinstated, and said how sorry he was for what he had done.\n\nHuang told employees that he let them down and promised to do a better job the second time around, according to people inside the room, who asked not to be named in order to share details. \"I hurt all of you,\" Huang said, according to one of the people.\n\nThe CEO also addressed succession planning during the event, the people said. He told staff that Nvidia has built a team that doesn't require succession planning the way a normal organization does, because the company operates a unique business model where there are multiple capable leaders at Nvidia that are leading different parts of the organization.\n\nA succession plan would create unnecessary hierarchy, Huang said, according to one of the people present.\n\nInvestors and analysts were left to speculate about the company's future leadership in the wake of Huang's resignation on Nov. 12.\n\nOn Monday, Huang was reinstated as CEO of the chipmaker by Nvidia's board of directors. Eleven days before, Huang had resigned from Nvidia after multiple reported affairs , including one with a Chinese businesswoman who is alleged to be a spy for Beijing.\n\nHarvey Jones, Nvidia's newly appointed board chair, said last week that Huang resigned after \"disclosure of personal behavior inconsistent with the company's code of conduct, standards and cultural norms.\"\n\nHuang started the meeting by thanking CFO Colette Kress for her leadership as interim CEO.", "source": "CNBC World Economy", "pub_date_str": "25 Nov 2026, 02:12 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "How Meta is using Instagram to get an ad boost from its Muse personal AI agent", "full_content": "Meta' s ad-free Muse personal artificial intelligence agent is already helping the social media giant boost its advertising business, and it's happening through Instagram, multiple people told CNBC.\n\nInstagram is a major advertising revenue engine for the social media giant, and the company is leveraging existing habits on the platform by prompting users to organize their saved posts in Muse.\n\nAbout 20% of daily Instagram users save at least one post to the app per day, according to a person familiar with the details, who asked not to be named because the information is not public. Many of those saved items, the person said, are either shoppable items or ads.\n\nA senior executive told CNBC that Muse, even without ads, \"is still very valuable for our ads business because it raises conversions for advertisers.\" It does this by reducing friction in the shopping process and allowing users to go back to items later, said the executive, who asked not to be named because the details have not been reported publicly.\n\n\"It gives advertisers a way to get more ROI for the dollars they're already spending, and that's all because Muse is helping people shop,\" the executive said.\n\nMark Zuckerberg announced in Meta's last earnings call that 25% of Muse's users shop via the agentic tool \u2014 it's the most common use case for Muse \u2014 and the average purchase price is over $200. Zuckerberg said the company plans to take a small fee from transactions made through the agentic platform.\n\nAll that information about what people are shopping for with their agent is a valuable asset to target ads more precisely within Instagram. If consumers complete purchases with their Muse, that builds Meta's new revenue stream.\n\nMeta's efforts to drive transactions seem to be paying off, and the buzz around Muse has made it a leader in agentic shopping.", "source": "CNBC World Economy", "pub_date_str": "25 Nov 2026, 02:07 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "US yields little changed as AI rally fades", "full_content": "* CME FedWatch shows markets fully price 25-basis-point December Fed hike\n\n* Conference Board consumer confidence index jumps to 103.3 in November from 91.9 in October\n\n* Benchmark 10-year Treasury yield falls 1.6 basis points to 4.906%\n\nNEW YORK, Nov 24 (Reuters) - US Treasury yields were little changed on Tuesday, as stocks on Wall Street saw choppy trading after the powerful rally in AI stocks prompted by the return of Nvidia CEO Jensen Huang faded.\n\nNvidia shares surged more than 30% on Monday as Huang was reinstated, helping the S&P 500 jump 4.7% and the Nasdaq 6.5%, boosted heavily by gains in technology stocks.\n\nBut some of those gains reversed in the early stages of trading on Tuesday, with the both the Nasdaq and S&P lower on the session, but off their lows of the day.\n\nMarkets are still grappling with the potential for more rate hikes from the Federal Reserve as it attempts to combat inflation, and the Wall Street Journal reported the US was preparing to raise tariffs on China and other countries.\n\n\"Yesterday seemed like a risk-on day for equities and somewhat of a risk-off day for bonds with the yield curve flattening yesterday, so the bond market was telling us yesterday that despite all the enthusiasm, seeming enthusiasm, yesterday for the AI stock complex, that the bond market wasn't predicting growth coming out of it,\" said Ron Albahary, chief investment officer at LNW in Philadelphia.", "source": "LiveMint Markets", "pub_date_str": "25 Nov 2026, 01:30 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Anthropic shares fall below IPO price. Traders see even more pain", "full_content": "Anthropic shares are back trading below the IPO price after a 13% sell-off Tuesday and a 1.5% drop Monday, despite a broad rally in most big tech artificial intelligence names. Trading under $76 on Tuesday, the stock's now 8.5% below its initial public offering level and 34% beneath its intraday high of $115.\n\nIt took just four days for ANT to fall under its offering price, compared with 21 trading days for SpaceX , which rallied out of the gate.\n\nOptions volume on the stock is picking up as the shares drop and implied volatility jumps to 96, according to ThinkOrSwim data. Almost 500,000 options traded by noon ET on Tuesday for a total premium of about $250 million, the sixth-most active single-stock options in the market, SpotGamma data shows.\n\nAlmost 300,000 puts traded versus about 200,000 calls, but the sentiment implied by the trades was not overtly bearish, and judging by the biggest single trades of the day, traders are divided on what happens next.\n\nANT intraday chart The biggest single option trade of the day was a $7.5 million purchase of almost 11,000 75-strike puts expiring in mid-December. The trader paid above the ask, suggesting an eagerness to get the trade done at a cost of $6.85, according to SpotGamma. With Anthropic trading at $77, the position needs Anthropic to drop 11% by expiry to pay off.\n\n\"Anthropic remains bumpy as investors add risk to other names,\" said noted tech analyst Dan Ives.\n\nOnly one obvious call purchase appeared among the top 10 trades: a 3,000-lot purchase of 85-strike calls expiring Jan. 15 that cost $7.10 each, for a total of $2.2 million. That trade needs Anthropic to rally 19% within the next two months to break even.\n\nArguably the most interesting action was a string of almost a dozen put sales, ranging from $400,000 to $1.6 million each, all within moments of each other, selling the 120-strike puts expiring Dec. 18. The puts bring in $40 each, meaning the breakeven for the trade is at $80.", "source": "CNBC Top News", "pub_date_str": "25 Nov 2026, 01:17 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Corporate Issuers", "Derivatives"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Buffer ETFs protect investors from the harshest market swings \u2013 for a price", "full_content": "A slate of ETFs that use esoteric options strategies offers investors protection from market volatility \u2014 with a trade-off.", "source": "CNBC Top News", "pub_date_str": "25 Nov 2026, 12:57 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Retail turnarounds are taking hold just in time for the holiday season", "full_content": "Once-struggling retailers are entering the holiday quarter with improved performance and sales momentum as turnaround efforts begin to resonate with shoppers.\n\nA handful of earnings reports on Tuesday pointed to a mix of factors behind the strong results, including a resilient consumer, stronger execution and demand for the right products at the right price.\n\nKohl's reported comparable sales growth of 1.2% for the period ended Oct. 31 and raised its full-year outlook as CEO Michael Bender said customers \"have remained resilient\" but are \"migrating to value with their purchases.\"\n\nHe tied improvement to the company's work on product assortment, store experience and value.\n\nBest Buy also on Tuesday posted its highest comparable sales growth in five years , at 6.1%, which prompted the electronics retailer to raise its full-year outlook.\n\n\"We have a tremendous amount of momentum,\" CEO Jason Bonfig told CNBC in an interview. \"The fact that we saw pretty much broad-based growth across almost all of our categories is a lot of momentum that we're very excited about.\"\n\nThe company also credited execution, market share gains and a compelling product cycle alongside growing customer demand.\n\nAt Dick's Sporting Goods , quarterly comparable sales rose 2.6% at the core business and 0.5% at Foot Locker. CEO Lauren Hobart said \"all income demographics grew\" and the company \"didn't see trade-down from best to better or better to good.\"", "source": "CNBC Top News", "pub_date_str": "25 Nov 2026, 12:56 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Gold is doing something strange. Here's one way to play it", "full_content": "Gold has stopped trading like a haven and started trading more like a market index this year. The past week has underscored it. Fears around AI, a hawkish Fed, and a stronger dollar sent many investors rushing to raise cash, and gold was sold along with stocks. GLD (SPDR Gold Shares) and the S&P 500 both slid around 9%. Gold then shared in the market's Monday rebound, with GLD up about 3% as the S&P 500 jumped nearly 5%.\n\nOver long timeframes, gold's returns tend to move independently of the S&P 500's . From 2004 to 2025, the correlation between their daily returns has been just 0.05 (+1 means the two move in lockstep and -1 means they move in opposite directions). That relationship fluctuates, and 2026 has seen an unusually strong link. The correlation has been about 0.41 so far in 2026. Its rolling three-month reading peaked near 0.80 in June and now sits at 0.54, still higher than about 95% of rolling three-month readings since 2005. Since the end of August, GLD has fallen on 77% of the S&P 500's down days, compared with roughly half historically.\n\nThe options market is also behaving unusually. Gold options typically price calls richer than puts (call skew). Like other commodities, gold is prone to sharp rallies, and investors use calls to bet on them or hedge against macroeconomic risks. However, gold options have mostly shown the reverse this year, with puts currently trading richer than calls (put skew). It's a sign investors are paying a premium for protection against further declines, which is unusual for gold and more typical of stock options.\n\nThose richer puts come as uncertainty around gold runs high heading into December. The PCE inflation report arrives Wednesday, followed by the jobs report next week and the Fed's decision and CPI the week after. GLD's implied volatility, a measure of how much the options market expects the fund to move, is now higher than on about 80% of days over the past year.", "source": "CNBC Top News", "pub_date_str": "25 Nov 2026, 12:55 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Quantitative Methods", "Economics", "Equity Investments", "Derivatives", "Alternative Investments"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "Who qualifies for Costco\u2019s $30-per-share dividend \u2014 plus, Meta puts share plan on hold", "full_content": "Every weekday, the Investing Club releases the Homestretch; an actionable afternoon update just in time for the last hour of trading.", "source": "CNBC Top News", "pub_date_str": "25 Nov 2026, 12:53 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "AG Blanche, FBI\u2019s Patel dodge questions about Jensen Huang investigation", "full_content": "Attorney General Todd Blanche and FBI Director Kash Patel on Tuesday dodged questions about the conclusions of an investigation President Donald Trump cited to push Nvidia 's board to bring back J ensen Huang as CEO.\n\nAsked by a reporter whether the Department of Justice had investigated Huang and the results of that probe, Blanche said, \"What the president said is that he talked to a lot of people going into the decision that he made to encourage the board to reinstate him.\"\n\n\"And so I'm not going to get into communications I have with the president,\" Blanche said at a news conference in Washington.\n\nHuang was reinstated as CEO of Nvidia on Monday morning, less than two weeks after resigning amid allegations he had affairs with a purported spy for China and two Nvidia employees plus concerns that advanced semiconductor chips made by his company had been diverted to China in violation of U.S. law.\n\nIn an interview with CNBC on Monday, Trump was asked what led him to personally confirm to Nvidia's board that Huang was not a national security risk.\n\n\"We've done a very thorough investigation, and the investigation showed that he did, I mean, he had bad judgment having to do with somewhat unrelated incidents, but he did nothing wrong,\" Trump replied.\n\nTrump in a Truth Social post on Monday said the U.S. government had no reason to believe Huang's return to the company \"poses any risk to National Security,\" and that Blanche had confirmed the government \"does not possess evidence that he has engaged in any unlawful conduct.\"\n\nNvidia, in its statement Monday announcing Huang's return, said, \"The Board received input from senior levels of the United States government, and based on that input, the Board is confident that Mr. Huang's reinstatement poses no national security risk.\"", "source": "CNBC Top News", "pub_date_str": "25 Nov 2026, 12:49 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "MU Stock Downgraded, Price Target Cut By Almost $1,000: BNP Paribas Flags 2028 Hyperscaler Capacity Risks - Stocktwits", "full_content": "MU Stock Downgraded, Price Target Cut By Almost $1,000: BNP Paribas Flags 2028 Hyperscaler Capacity Risks Stocktwits Why Micron Stock Dove Today Yahoo Finance Micron: You Can't Argue With The Price (NASDAQ:MU) Seeking Alpha Why Did Micron Technology Stock Fall? Trefis Warning for Micron Investors: Bank of America Says \u201cSemis Cuts Have Started\u201d TIKR.com", "source": "Google News Business", "pub_date_str": "25 Nov 2026, 12:32 AM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Minutes of the Board's dis ity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Nvidia shares tumble 9% after biggest rally in over two decades as AI-related concerns return", "full_content": "Nvidia shares fell 9% on Tuesday, surrendering some of their record rally after investors reassessed AI investment returns, regulatory risks and the prospect of higher interest rates.&nbsp;", "source": "LiveMint Markets", "pub_date_str": "24 Nov 2026, 10:36 PM IST", "pub_date_relative": "6h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "IKEA India Revenue Grows 14% In FY26; Targets Profitability By 2030, Plans 30 Stores", "full_content": "New stores contributed 9-10% to growth, while online sales expanded nearly 29%. IKEA plans to open 20-22 smaller-format stores as it looks to deepen its presence in India by 2030.", "source": "NDTV Profit", "pub_date_str": "24 Nov 2026, 10:27 PM IST", "pub_date_relative": "6h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Volkswagen Wants 120,000 Workers To Accept A Pay Freeze. Union Threatens Strike From Jan 1", "full_content": "Volkswagen faces a potential labour showdown as workers protest against wage freezes, benefit cuts and a restructuring plan involving around 100,000 jobs.", "source": "NDTV Profit", "pub_date_str": "24 Nov 2026, 10:26 PM IST", "pub_date_relative": "6h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Anthropic's Record IPO Pop Has Vanished: Shares Crash 11%, Now Trade Below Issue Price", "full_content": "Anthropic shares have erased their IPO gains, falling below the $83 issue price within days of a record-breaking Nasdaq d     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
