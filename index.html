ain in focus following significant announcements.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "24 Sep 2026, 06:00 AM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "Meta's standoff with Amazon over Muse could be a sign of things to come", "full_content": "Meta's rollout of its Muse AI personal agent has been a big hit with consumers and investors. The stock has jumped more than 20% in the two weeks since its introduction, and the app has shot up to the top of Apple's App Store, eclipsing ChatGPT.\n\nMark Zuckerberg took to the stage late Wednesday afternoon at the company's annual Connect conference for developers to relish in the excitement, and described the Muse AI agent as representing the \"centerpiece\" of his company's efforts to make the technology more easily available to the broader public instead of coders.\n\n\"In the coming years, I expect that Muse is going to grow into the personal superintelligence that billions of people around the world are going to use to accomplish their goals and improve their lives,\" Zuckerberg said.\n\nBut there are reasons for skepticism regarding Meta's latest effort to find a real and lasting niche in the consumer artificial intelligence market.\n\nMeta is touting Muse's ability to book appointments and travel, fill out electronic forms for users, and monitor home security cameras. It can also shop on a user's behalf, searching for a specific product across various sites and marketplaces and linking to Shopify or Stripe for payment.\n\nAmazon has said that's a no-go, blocking Muse from purchasing products on the e-commerce app, claiming that it would violate the company's terms of service. Whether it's other retailers taking similar steps out of concern that they're at risk of losing the direct relationship with customers, or it's consumers that don't trust the Facebook parent with sensitive data, experts say the social media giant has a long way to go to turn its early momentum in Muse into a winning product.\n\n\"People are going to be very wary,\" said Joseph Turow , a professor emeritus at the University of Pennsylvania and an expert on digital media and privacy.", "source": "CNBC World Economy", "pub_date_str": "24 Sep 2026, 06:57 AM IST", "pub_date_relative": "7m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Gold steadies after selloff as oil, strong U.S. data lift Fed hike bets", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Sep 2026, 06:52 AM IST", "pub_date_relative": "12m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Can Moneyview IPO deliver long-term growth for high-risk investors?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a Can Moneyview IPO deliver long-term growth for high-risk investors? The Economic Times daily newspaper is available online now. Read Today's Paper Can Moneyview IPO deliver long-term growth for high-risk investors ber, 2026 : The Indian stock market is likely to witness a muted start, as GIFT Nifty signalled a gap-down opening on Thursday, 24 September.\n\nMeanwhile, Asian markets traded on a mixed note on Thursday, while US stock futures witnessed profit booking at higher levels on Tuesday.\n\nThe Indian stock market extended its recovery for the second straight session on Wednesday, September 23, with benchmark indices gaining nearly 0.50%. Easing crude oil prices supported investor sentiment, while signs of progress in US diplomatic efforts to end the conflict with Iran further lifted market confidence.\n\nThe Nifty 50 ended 0.50% higher at 23,446, while the Sensex rose 0.40% to 74,828. Broader markets outperformed the benchmarks, with the Nifty Midcap 100 index climbing 0.70% and the Nifty Smallcap index advancing 0.90%.\n\n\"Markets extended their recovery on Wednesday, with the benchmarks gaining around half a per cent amid supportive global cues. After opening on a positive note, the indices maintained a firm bias through most of the session, although gains moderated from the day\u2019s highs. Eventually, the Nifty settled at 23,446.80, up nearly 0.5%, while the Sensex ended around 74,828, higher by roughly 0.4%.\n\nTechnically, the bulls are attempting to reclaim some of the ground lost during the six-week-long correction, although the pace of recovery remains capped by a mixed trend among key heavyweights. The 23,600 level remains the key hurdle, while a break below 23,300 could once again derail the recovery. The performance of the banking sector is likely to play a critical role in determining the sustainability of the rebound.", "source": "LiveMint Markets", "pub_date_str": "24 Sep 2026, 06:47 AM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Chinese authorities reportedly in possession of F-35 components in Hong Kong", "full_content": "Chinese authorities are reportedly in possession of F-35 stealth fighter parts after components of the aircraft were \"inexplicably diverted to Hong Kong.\"\n\nShipping giant UPS was sending a cockpit canopy and weapons bay door to the U.S. from Australia in late May when it was diverted, Bloomberg reported on Thursday, citing sources.\n\nBoth parts were coated with a radar absorbing material that enhances their stealth capabilities, the sources said, and it was not clear why the shipment was diverted to Hong Kong.\n\nOn Tuesday, Australian Defense Minister Richard Marles told reporters Tuesday that Australia was aware of the shipment, and was working with the U.S. and Lockheed Martin to see how Canberra can assist in the investigation.\n\nMarles also said it was his understanding that no sensitive parts were in the missing shipment, according to CNN.\n\nLockheed Martin, UPS and the Pentagon didn't immediately respond to requests for comment from CNBC.\n\nThe F-35 is a fifth-generation stealth fighter made by Lockheed Martin, and Washington controls the sale of these aircraft only to its closest partners and allies.\n\nFor example, Turkey was excluded from the F-35 program in 2019 after the country purchased the Russian S-400 anti-aircraft system, which raised fears that the Russian system could be used as an intelligence collection platform to learn about the aircraft's capabilities.", "source": "CNBC World Economy", "pub_date_str": "24 Sep 2026, 06:46 AM IST", "pub_date_relative": "17m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Sebi working towards balanced derivatives market: Tuhin Kanta Pandey", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Pana res of SoftBank Group jumped more than 7% on Thursday, as Japanese markets opened for the first time this week following a three-day holiday and the technology investor announced an $11.1 billion bond issuance to help fund its growing bet on OpenAI.\n\nSoftBank said Thursday it issued $10 billion in dollar-denominated senior notes and 1 billion euros ($1.14 billion) in euro-denominated notes. The company said proceeds will be used to fund a $10 billion payment for the third and final tranche of its $30 billion follow-on investment in OpenAI, which is expected to close Oct. 1, as well as for general corporate purposes.\n\nShares of SoftBank Group on Thursday. The bond sale underscores the scale of CEO Masayoshi Son's push into artificial intelligence. SoftBank agreed to the $30 billion investment in February , which will bring its cumulative investment in the ChatGPT maker to $64.6 billion and give it an approximately 13% stake upon completion.\n\nThe latest fundraising comes as investors have increasingly scrutinized how SoftBank will finance its sprawling AI ambitions and the impact of rising leverage on its balance sheet.", "source": "CNBC World Economy", "pub_date_str": "24 Sep 2026, 06:36 AM IST", "pub_date_relative": "27m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Fixed Income"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Global Market Today: Asian stocks waver on inflation, rate concerns", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Global Market Today: Asian stocks waver on inflation, rate concerns Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market Today: Asian stocks waver on inflation, rate concerns SECTIONS Global Market Today: Asian stocks wave suers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Raja Venkatraman recommends three stocks for 24 September", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nThe Indian stock market ended higher on Wednesday. Nifty 50 closed 0.50% higher at 23,446, while the Sensex advanced 0.40% to 74,828. Despite the uptick, overall sentiment remained cautious, weighed down by geopolitical uncertainties and persistent foreign investor outflows.\n\nNifty 50 closed 0.50% higher at 23,446, while the Sensex advanced 0.40% to 74,828 on Wednesday. Despite the uptick, overall sentiment remained cautious, weighed down by geopolitical uncertainties and persistent foreign investor outflows.\n\nMetals led the rally, with JSW Steel surging 2.54% to \u20b9 1,299.20, Tata Steel rising 2.48% to \u20b9 189.56, and Hindalco gaining 2.19% to \u20b9 994.30. Bajaj Finance added 2.12% to \u20b9 1,030.20, while Larsen & Toubro rose 1.90% to \u20b9 3,939.70, rounding out the top performers on the Nifty. On the downside, Titan slipped 1.01% to \u20b9 4,878.50, Coal India fell 0.85% to \u20b9 424.35, and Cipla eased 0.75% to \u20b9 1,373.70. IT majors Infosys and TCS also traded lower, shedding 0.67% and 0.61% respectively.\n\nBank Nifty has been weaker in comparison to Nifty, and the sustained bearish pressure seen on every rally indicates that it is inclined for some downward bias as the trends are unable to head higher. While sector rotation is happening, we are reaching a point where the indices have become divergent.\n\nHDFC Bank has been under great deal of stress post its Q1 numbers and finally after a while its showing on the Bank Nifty as well. The stock could not impact the market condition much; however, the trends were expected to head into the upper end of the value resistance zone as the indicators were tiring out. The rise witnessed in Bank Nifty is seen struggling as the attempt to hold on is seen fizzling out as bearish pressure is emerging at higher levels.", "source": "LiveMint Markets", "pub_date_str": "24 Sep 2026, 06:00 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Pre-market action: Here's the trade setup for today's session", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Pre-market action: Here's the trade setup for today's session Manappuram Finance Share Price Muthoot Finance Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Pre-market action: Here's the trade setup for today's session SECTIONS Pre-market action: Here's the trade setup for today's session By Akash Podishetti , ETMarkets.com Last Updated: Sep 24, 2026, 06:00:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis On Wednesday, Nifty saw a notable 0.5% rise driven by widespread buying activity. Analysts are optimistic about the future of Indian equities, pointing to global influences and fluctuations in crude oil as critical factors. The market's strength was further bolstered by substantial purchases from foreign institutional investors, although the rupee struggled against the US dollar due to a robust dollar and escalating crude oil prices.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Tr 5 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "24 Sep 2026, 06:00 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Stock futures are flat after soaring Treasury yields trigger a market sell-off: Live updates", "full_content": "Stock futures were flatWednesday night after surging yields in Treasurys sparked a sell-off in the market and traders anticipated rate hikes from the Federal Reserve.\n\nS&P 500 futures were up 0.02%. Nasdaq-100 futures gained 0.08%.\n\nDuring the regular trading day, the S&P 500 slid 0.8%. The Nasdaq Composite lost 1.1% and broke a four-day win streak.\n\nIn Asia-Pacific, Japan's Nikkei 225 added 0.64% following three consecutive days of holiday, while the Topix slipped 0.17%. Australia's benchmark S&P/ASX 200 was 1.33% lower. South Korea's markets are closed for a holiday.\n\nThe benchmark 10-year Treasury note yield , which is tied to rates on mortgages, surged to 5.135% for its highest level since July 2007. The yield on the 2-year note climbed to 4.947% for its highest since May 2024.\n\nAs yields surged, so did the market's anticipation of further rate hikes from central bank policymakers. Fed funds futures trading suggests a greater than 68% likelihood that the policy-setting Federal Open Market Committee lifts its key rate once more in October, according to the CME FedWatch tool . That compares to a roughly 49% probability just a week ago.\n\nHigher yields tend to squeeze consumers' finances as they face higher borrowing costs at a time when they're already paying more in fuel costs.\n\nOil prices bounced Wednesday. International Brent crude futures rose about 3.9% to settle at $103.08 a barrel, while West Texas Intermediate crude gained 1.8% to $92.16.", "source": "CNBC Top News", "pub_date_str": "24 Sep 2026, 05:46 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Quantitative Methods", "Economics", "Equity Investments", "Fixed Income", "Derivatives", "Portfolio Management"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "NSE debut may not set D-St on fire, sparks to come later", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a NSE debut may not set D-St on fire, sparks to come later State Bank of India Share Price Union Bank of India Share Price Punjab National Bank Share Price Bank of Baroda Share Price Canara Bank Share Price The Economic Times daily newspaper is available online now. Read Today's Paper NSE debut may not set D-St on fire, sparks to come later SECTIONS NSE debut may not set D-St on fire, sparks to come later By Ravindra Sonavane , ET Bureau Last Updated: Sep 24, 2026, 06:06:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis NSE is set to debut on the stock market amid market expectations of moderate gains. Traders quote a grey market premium of around \u20b983 per share, down significantly from earlier estimates. The IPO was subscribed 5.71 times, highlighting strong institutional interest despite expectations for lower listing gains. Strict supply rules could limit immediate trading shares, impacting initial price movements post-listing.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "24 Sep 2026, 05:38 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "U.S.-China trade truce extended for two months, Bessent says, as Xi begins state visit", "full_content": "The U.S. and China have extended a truce to keep tariffs lower for longer and rare earths flowing, U.S. Treasury Secretary Scott Bessent said Wednesday local time.\n\nHe was speaking on Fox News, as Chinese President Xi Jinping landed in Washington, D.C. for a state visit through Friday.\n\nXi and Trump agreed to a one-year trade truce at a meeting in South Korea last October. The deal, which was set to expire in November, will now be extended to Jan. 10, Bessent said. He added that Beijing needs to fulfill more deliverables.\n\nAhead of this week's summit, many had expected the truce would be extended by six months or longer.\n\nChinese state media did not immediately note Bessent's comments on the trade truce.\n\nFootage streamed on China's state broadcaster showed U.S. President Donald Trump and First Lady Melania Trump meeting Xi and First Lady of China Peng Liyuan at the foot of the Chinese leader's jet. The video did not show the U.S. and Chinese leaders shaking hands \u2014 it focused on Xi and his wife shaking hands with two children presenting them each with bouquets.\n\nBessent met with Chinese Vice Premier He Lifeng in New York ahead of Xi's arrival in the U.S. The two sides discussed setting up an alert system for artificial intelligence incidents , according to Bessent.", "source": "CNBC Finance", "pub_date_str": "24 Sep 2026, 05:29 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Shipping Stocks Eclipse Chips in Asia as Freight Rates Jump", "full_content": "(Bloomberg) -- Asia\u2019s hottest trade this year isn\u2019t all about chips. Shipping stocks are sailing ahead as geopolitical tensions drive up freight rates, boosting earnings outlook for container liners.\n\nA Goldman Sachs gauge of Asia shipping has climbed about 17% this quarter, while an index of semiconductor stocks fell 18% during the period. The rally in shipping stocks is offering investors an opportunity outside Asia\u2019s crowded artificial-intelligence trade. The Middle East war has tightened vessel supply and analysts expect more gains for the sector ahead.\n\nThe demand is \u201cquite good\u201d this year and earnings have been much better than expected, said Joakim Hannisdahl, chief executive officer at Gersemi Asset Management AS. \u201cYou\u2019re in a strong seasonal period for a year.\u201d\n\nThe gains come as ships navigate disruptions in the Red Sea and the Strait of Hormuz due to the Iran conflict, while a rush to get ahead of US tariffs also drove demand and pushed up freight rates. The Shanghai Containerized Freight Index is trading at its highest level since July 2024 after rising for eight straight weeks.\n\nThe stocks leading the gains in Asia include TS Lines, SITC International Holdings and Mitsui OSK Lines.\n\nAlong with Middle East disruptions, typhoons in Asia stand to increase port congestion, decrease effective capacity and keep pricing elevated, according to Bloomberg Intelligence. These effects could be exacerbated by the shipping rush before China\u2019s Oct. 1-7 Golden Week holiday, BI said.\n\nJefferies has raised its earnings forecasts and price targets for Japanese shipping companies Nippon Yusen KK, Kawasaki Kisen Kaisha and Mitsui. The containership markets \u201cremain firmer than expected\u201d from the Red Sea disruption, congestion and resilient demand, it said.\n\nTo be sure, the biggest risk to the outlook is a diplomatic breakthrough with Iran. US President Donald Trump said his officials had \u201cvery good\u201d talks with Iranian envoys in New York.", "source": "LiveMint Markets", "pub_date_str": "24 Sep 2026, 05:15 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "US oil industry pushes back against proposed diesel export ban", "full_content": "Groups say there is no \u2018silver bullet\u2019 to fuel price crisis after president signals willingness to halt shipments abroad", "source": "FT Markets", "pub_date_str": "24 Sep 2026, 05:14 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "WhiteOak Capital plans D-Street foray with Rs 1,500 crore IPO", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a WhiteOak Capital plans D-Street foray with Rs 1,500 crore IPO The Economic Times daily newspaper is available online now. Read Today's Paper WhiteOak Capital plans D-Street foray with Rs 1,500 crore IPO SECTIONS WhiteOak Capital plans D-Street foray with Rs 1,500 crore IPO By Mohit Bhalla & Pranav Mukul , ET Bureau Last Updated: Sep 24, 2026, 04:58:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis WhiteOak Capital is gearing up for an initial public offering projected to raise \u20b91,500 crore, potentially reaching a valuation of \u20b99,000 crore. Established by Prashant Khemka in 2017, the firm oversees around $13 billion in assets. Following the recent trends set by alternative investment firms like Gaja Capital, Khemka has confirmed plans to go public; however, no definitive timeline has been disclosed.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "24 Sep 2026, 04:58 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Thursday's big stock stories: What\u2019s likely to move the market in the next trading session", "full_content": "The major averages sold off on Wednesday as a sharp surge in Treasury yields heightened traders' fears of more interest rate hikes from the Federal Reserve.", "source": "CNBC Top News", "pub_date_str": "24 Sep 2026, 04:38 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}], "updated_at": "24 Sep 2026, 07:04 AM IST", "total_stories": 317};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
