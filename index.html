ang, pushing its market valuation below Microsoft's $4.03 trillion.", "source": "NDTV Profit", "pub_date_str": "10 Nov 2026, 11:50 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Alphabet shares appear to have bottomed. How to play it for a quick rebound", "full_content": "Ten days after Alphabet shares experienced their worst one-day drubbing in its history, the search, media and AI giant has barely retraced a faction of its nearly $500 billion in lost market capitalization, having rallied just a paltry 1.5%. The muted recovery stands out for a company that posted its 13th straight quarter of double-digit revenue growth in the same report, with Google Cloud revenue more than doubling. Alphabet's earnings were the first major crack to appear in the AI trade and foreshadowed a series of volatile events for the complex, including the election and the growing scandal enveloping Nvidia CEO Jensen Huang.\n\nStill, a bullish case for Alphabet rests not in its post-earnings concerns being unfounded, but rather on its growth being strong enough to withstand them. On Monday, Google launched two new systems built on its custom AI chip, the TPU, a sign the company keeps evolving, and the debate over AI and search is far from settled. The sheer size of the drop, a record one-day loss after a quarter of 25% revenue growth, may also leave room for a reversion toward pre-earnings levels. For investors who agree, options offer a variety of ways to express that view.\n\nBased on Monday's close, I'm buying the December 18 285/300 call spread for a debit of roughly $7.07.\n\nAlphabet's 30-day implied volatility closed Monday around 35%, higher than about 44% of days over the past year. That is mid-range, so either buying or selling premium can be viable for this trade. A bull call spread is the higher-conviction route. It needs the stock to rally to pay off, but it offers a larger payout if the view is right. Selling a put spread is the lower-conviction route.", "source": "CNBC Top News", "pub_date_str": "10 Nov 2026, 11:45 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "UK fraudster who invented \u2018too good to be true\u2019 takeover bid given suspended sentence", "full_content": "Christopher Woolcott created a cast of characters in a bid to profit from a rise in Touchstone Exploration\u2019s shares", "source": "FT Markets", "pub_date_str": "10 Nov 2026, 11:43 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "NSE EGRs: Want to invest in gold without buying jewellery or coins? Check how to buy electronic gold receipts online", "full_content": "Indians have long considered gold a safe-haven investment, buying it in the form of jewellery, coins or bars. The yellow metal also holds cultural significance, with families purchasing it during weddings and festivals such as Dhanteras, Diwali and Akshaya Tritiya, as a symbol of good fortune.\n\nHowever, buying physical gold comes with concerns such as purity, safety and storage. Electronic gold receipts (EGRs) offer an alternative, allowing investors to own gold without having to physically hold it.\n\nThe National Stock Exchange of India ( NSE ) launched EGRs as a new segment in May this year, with an intention to create a more transparent and efficient price discovery of the safe-haven metal.\n\nElectronic gold receipts are digital certificates that show you own a certain amount of physical gold. The gold is safely stored in vaults approved by the Securities and Exchange Board of India (Sebi), while your ownership is held electronically in a demat account.\n\nInvestors can buy and sell them through the stock exchange, much like shares, and can also convert their holdings into physical gold. The entire process is designed to make gold trading easier and more transparent.\n\nSince EGRs are traded on stock exchanges and held in demat accounts , investors can buy and sell gold without worrying about its physical storage and security. On its online portal, the NSE has outlined the following benefits:\n\nInvestors can buy EGRs through a Sebi-registered stockbroker that offers access to the segment. Here are the steps to follow:\n\nStep 1: Choose a Sebi-registered broker with EGR access. Not all brokers offer EGR trading, so investors should first check whether their existing broker provides access to the EGR segment before proceeding.", "source": "LiveMint Money", "pub_date_str": "10 Nov 2026, 11:42 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Rohit Sharma Back As MI Captain? Mitchell Santner's 'Skipper' Remark Sparks Buzz", "full_content": "Mitchell Santner's viral interaction with Rohit Sharma has added to the captaincy speculation, while Aakash Chopra has weighed in on MI's potential trades and releases.", "source": "NDTV Profit", "pub_date_str": "10 Nov 2026, 11:40 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Trade Setup For Nov 11: Nifty Bulls Find Support At 24,800; Analysts Suggest Buy-On-Dips", "full_content": "After last week's sharp rally, analysts see the Nifty maintaining its bullish momentum, with 24,750-24,800 emerging as a crucial support zone and 25,200 as the immediate resistance.", "source": "NDTV Profit", "pub_date_str": "10 Nov 2026, 11:40 PM IST", "pub_date_relative": "2h ag nd policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "India well on track to achieve $1 trillion exports target for FY27: Piyush Goyal", "full_content": "Commerce Minister Piyush Goyal said India is on track to achieve its $1 trillion goods and services export target in FY27, having already recorded nearly $480 billion in exports during April-September. He highlighted opportunities from free trade agreements, particularly the proposed India-EU pact, for the automobile and mobility sectors. Goyal urged manufacturers to expand globally, boost competitiveness and leverage international partnerships to drive exports, investment and employment.", "source": "Economic Times Economy", "pub_date_str": "10 Nov 2026, 10:35 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics", "Corporate Issuers"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "20 years of service recognised: Retired woman IAF officer wins 15-year legal battle for pension as AFT alters ruling", "full_content": "AFT's Chandigarh Bench rules that Wing Commander Chandi is entitled to pension and other retirement benefits after modification of its 2015 judgment.", "source": "LiveMint Money", "pub_date_str": "10 Nov 2026, 10:33 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "SIP vs lump sum: Which strategy delivers higher mutual fund returns? Global 30-yr data reveals what worked better", "full_content": "SIP investments outperformed lump-sum investing in six of 10 major global equity markets over 30 years, according to DSP Mutual Fund. Japan recorded the biggest SIP advantage, while Brazil delivered higher returns through lump-sum investments.", "source": "LiveMint Money", "pub_date_str": "10 Nov 2026, 10:31 PM IST", "pub_date_relati     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>

</body>
</html>
