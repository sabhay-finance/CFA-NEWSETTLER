estors to rush into value stocks", "full_content": "* Nasdaq now down almost 2% year to date, was up 19% YTD in October\n\n* More Fed rate hikes seen pressuring growth stocks near term\n\n* Median S&P 500 stock up 7% in 2026, index up only 2% so far\n\nWall Street fled headlong on Friday from the AI boom to the relative safety of bonds and lower-priced shares outside the tech sector.\n\nTechnology carnage was extensive. Anthropic\u2019s sharp decline took it within a whisker of its IPO price before recovering to trade down 10%, just a day after a record debut that briefly valued the AI lab above $2 trillion. The Nasdaq composite was down over 4% for its third decline of 2% or more this week, its biggest weekly decline since last year\u2019s Liberation Day rout. The pullback put it lower for the year for the first time since April.\n\nThe Nasdaq is now down almost 2% in 2026, relinquishing an annual gain of almost 19% through early October.\n\nThe retreat partly reflects expectations that high inflation readings will force the Federal Reserve to raise interest rates in coming months, likely further increasing borrowing costs and compressing valuations \u2013 and making Treasuries and so-called value stocks look like a better bet.\n\n\u201cYesterday\u2019s AI IPO is a valuation test, and with the 10-year around 5% and the Fed still hiking, investors are asking how much of the AI story is already priced in,\u201d said Gene Goldman, chief investment officer at Cetera, El Segundo, California.", "source": "LiveMint Markets", "pub_date_str": "21 Nov 2026, 01:38 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Corporate Issuers", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Intensifying AI rout wipes out Nasdaq's 2026 gains. Alphabet is a tech bright spot", "full_content": "Every weekday, the Investing Club releases the Homestretch, an actionable afternoon update just in time for the last hour of trading.", "source": "CNBC Top News", "pub_date_str": "21 Nov 2026, 01:36 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Anthropic shares fall a day after blockbuster IPO - BBC", "full_content": "Anthropic shares fall a day after blockbuster IPO BBC Anthropic IPO live: Anthropic stock drops after first day of trading Yahoo Finance Why Anthropic's day-one valuation wasn't built to last in this market CNBC Almost all of Anthropic\u2019s employees are now millionaires CNN Wall St ends sharply lower on AI selloff, S&P 500, Dow in correction Reuters", "source": "Google News Business", "pub_date_str": "21 Nov 2026, 01:30 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Prediction markets outlook for stocks in 2026 dims amid AI sell-off", "full_content": "As stocks continue their tech-driven sell-off , prediction markets traders are seeing a bleaker outlook for the remainder of the year.\n\nOn platform Kalshi , speculators place just 6% odds that the S&P 500 will cross 8,000 in 2026. On Oct. 13, those odds were as high as 72%.\n\nContracts ask traders if the S&P 500 will go above various levels in 2026, and they're resolved using data from S&P Dow Jones Indices.\n\nOn Friday, the Nasdaq Composite turned negative for the year as investors continued to dump tech stocks, primarily those with exposure to the artificial intelligence build-out. The Dow Jones Industrial Average and the S&P 500 fell into correction territory, too.\n\nThe S&P 500 has slashed its year-to-date gain to just over 2%.\n\nThe Stock Trader's Almanac in a Thursday note broadly agreed that the hopes for a December rally are fading, with the caveat that a \"Santa rally\" could still appear at the end of the year.\n\n\"The market is under pressure and more downside can't be ruled out,\" the note said.\n\nThe Stock Trader's Almanac sees 2026 following the year-end pattern of 2018, when the Federal Reserve was in a tightening cycle in a midterm year. The Fed is widely expected to hike rates at its December meeting.", "source": "CNBC Finance", "pub_date_str": "21 Nov 2026, 01:29 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Spooked by Nvidia\u2019s turmoil? Play Grand Theft Auto VI instead of peeking at your 401(k).", "full_content": "If you are tempted to ditch stocks for property or CDs, take a deep breath before making any sudden moves.", "source": "MarketWatch Top Stories", "pub_date_str": "21 Nov 2026, 01:23 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "The Fed is too busy fighting inflation to rescue the stock market", "full_content": "Federal Reserve officials will continue to raise interest rates, despite the recent selloff in the stock market, as equity-market gains over the past four years dwarf the recent declines, economists said Friday.", "source": "MarketWatch Top Stories", "pub_date_str": "21 Nov 2026, 01:23 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "A massive bearish trade just happened in the chip stocks", "full_content": "So much for buying the dip. As the S&P 500 entered correction territory and the Nasdaq-100 flirted with bear-market territory, down 19% from highs as of midday Friday, the single biggest options trade of the day was a near $100-million bet that the VanEck Semiconductor ETF (SMH) has a long way more to fall. Around 12:30 E.T., someone spent $93 million buying 20,000 380-strike puts expiring Sep. 17, 2027, according to trading data reviewed by SpotGamma and Volland, options-analytics platforms that both show the trade as a likely opening position, with volume exceeding existing open interest in the contract. The trade bets that the index will fall below $380, a nearly 8% decline from its current level. The SMH is off 40% from its recent all-time highs.\n\nVanEck Semiconductors ETF (SMH), YTD \"That trade stands out big-time,\" wrote Jason DeLorenzo, founder and owner of Volland. \"It is either a hedge or speculative, but either way it isn't a vote of confidence.\" The puts were bought for $46.50 a piece, an arguably expensive choice for a downside bet with volatility in the ETF trading at 70.\n\n\"You're paying a metric ton of Vega for that thing,\" added SpotGamma's Brent Kochuba, referring to the contract's sensitivity to changes in volatility of the underlying chip ETF. \"Maybe they were a forced buyer, or maybe they're actually selling this, which can still be the case even though the price shows it happening closer to the ask.\"\n\nThe semiconductor index headed for a 9% drop this week alone.", "source": "CNBC Top News", "pub_date_str": "21 Nov 2026, 01:03 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Derivatives", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Jensen Huang to testify publicly before Senate banking panel, Chairman Scott says - CNBC", "full_content": "Jensen Huang to testify publicly before Senate banking panel, Chairman Scott says CNBC House Democrats probe whether Nvidia helped halt Commerce chip-smuggling inquiry Politico Democrats press Lutnick for Megaspeed investigation findings The Hill Former Nvidia CEO Huang agreed to testify at public US Senate hearing, senator's aide says Reuters Jensen Huang and Howard Lutnick will appear publicly before a powerful Senate panel Yahoo Finance", "source": "Google News Business", "pub_date_str": "21 Nov 2026, 12:57 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Stocks making the biggest moves Friday: Nvidia, Anthropic, Micron, General Mills, UnitedHealth, Strategy & more", "full_content": "Anthropic shares pulled back on Friday, a day after the company behind Claude AI made its historic debut on public markets.\n\nA slate of companies tied to the artificial intelligence trade tanked as well, with Micron, Sandisk and CoreWeave down by double-digits in the session.\n\nFollow along as CNBC highlights the biggest stock moves of the day.\n\nShares of Nvidia sold off harder on the day after Reuters reported , citing people familiar, that the U.S. Securities and Exchange Commission is investigating the company's accounting practices.\n\nNvidia was last down almost 10% on the day and heading for its worst session since Jan. 27, 2025 when the release of DeepSeek's low-cost artificial intelligence model sparked a sell-off of AI-linked names.\n\nThe slide in Anthropic shares intensified midday Friday, with the stock plummeting close to 14% on the day.\n\nAnthropic on Friday At its session low, the stock touched $83.05 per share.\n\nAnthropic, which just made its public markets debut on Thursday, dragged down the Nasdaq Composite. The tech-heavy index turned negative on the year in Friday's sell-off.", "source": "CNBC Top News", "pub_date_str": "21 Nov 2026, 12:56 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Trump says he discussed Jensen Huang with Xi, apparently contradicting Bessent", "full_content": "President Donald Trump on Friday said he and Chinese leader Xi Jinping discussed their shared affinity for former Nvidia CEO Jensen Huang this week, appearing to contradict Treasury Secretary Scott Bessent who earlier in the day said the ousted leader was not mentioned in the Trump administration's latest talks with China in Shenzhen.\n\n\"I did discuss that with President Xi, and he said, 'Oh, brilliant, brilliant! He's a brilliant man.' He is,\" Trump said at a White House press conference.\n\nAsked earlier Friday on CNBC's \"Squawk on the Street\" if Huang, a close ally of Trump 's, had come up in those talks, Bessent said \"no,\" without elaborating.\n\nThe Treasury Department did not immediately respond to CNBC's request for comment on the apparent discrepancy between Trump and Bessent.\n\nTrump also reiterated that he would like to see Huang \u2014 who was replaced by interim CEO Colette Kress after resigning amid allegations of an extramarital affair with a Chinese spy \u2014 be restored as Nvidia's CEO.\n\n\"I would love to see Jensen be given a second chance,\" Trump said. \"You know, we're a country of second chances, and I'd love to be able to see him. That's a very important company to us, and he put us in a position where we are literally 10 years advanced over other companies.\"\n\nNvidia's board is not considering bringing Huang back , a person familiar with the matter told CNBC earlier this week.\n\nThe president's comments came amid growing scrutiny of advanced U.S. chips, including those made by Nvidia, ending up in China either legally or by being diverted via third countries.", "source": "CNBC World Economy", "pub_date_str": "21 Nov 2026, 12:45 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Chase adds Qantas and Cathay Pacific as transfer partners. These two credit cards can help you access them", "full_content": "The Chase Ultimate Rewards\u00ae program unveiled two new airline transfer partners on Nov. 18, adding to its previous list of 14 airline and hotel programs.\n\nNow, eligible Chase cardholders can transfer Ultimate Rewards\u00ae points to Qantas Frequent Flyer and Cathay Pacific at a 1:1 rate \u2014 meaning the number of points transferred stays the same. The last time Chase added an airline transfer partner was in 2021, with the addition of Air Canada Aeroplan .\n\nCNBC Select dives into what Chase credit card holders should know about the recent transfer partner additions and how to take advantage of them.\n\nQantas Airways predominantly serves Australia and the South Pacific, while Cathay Pacific Airways is focused on Hong Kong and Asia.\n\nA nice perk these two airlines share is that they're both part of the oneworld airline alliance , which also includes popular options like American Airlines and Alaska Airlines. You can search flights via oneworld's flight search tool and compare the cash price between all the member airlines. Since each loyalty program sets its own prices, you can view the award price on each carrier's website.\n\nPlus, sometimes airlines reserve more or higher-quality seats for their frequent flyer programs.\n\nAnyone with an eligible Chase card can take advantage of these new partners. Two popular options include the Chase Sapphire Preferred\u00ae Card (see rates and fees ) and the Chase Sapphire Reserve\u00ae (see rates and fees ).\n\nThe Reserve's $795 annual fee may be startling at first, but it offers over $5,000 in value in the first year. The card features a 100,000-point welcome bonus after spending $6,000 on purchases in the first three months and is loaded with perks, including an incredibly flexible $300 annual travel credit . You'll also get access to Chase Sapphire Lounges by The Club , a premium collection of airport lounges.", "source": "CNBC Top News", "pub_date_str": "21 Nov 2026, 12:43 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Wall Street banks set for banner year as Anthropic, SpaceX IPOs generate $1 billion in fees", "full_content": "* Some banks learned of their fee the night before IPO, source says\n\n* Mega-deals pay a fraction of the up to 7% underwriting fee for smaller deals\n\nNEW YORK, Nov 20 (Reuters) - Wall Street banks are on track for one of their most lucrative years in the IPO business, with blockbuster listings by Anthropic and SpaceX generating more than $1 billion in underwriting fees alone.\n\nA syndicate of 22 banks is set to collect about $550 million for underwriting Anthropic's $81.3 billion IPO, eclipsing the roughly $500 million they earned on SpaceX's record-setting offering in June, according to Anthropic's final offering prospectus published on Thursday.\n\nThe fees represent a relatively small share of the $81 billion Anthropic raised at its debut, or as much as $93.5 billion with overallotment options exercised. The banks will receive about 0.68% of the money raised in Anthropic's IPO, broadly in line with the roughly 0.67% they collected on SpaceX's offering.\n\nUnderwriting fees on IPOs typically run as high as 7% of proceeds, though the percentage drops sharply for bigger deals, with companies raising tens of billions of dollars able to negotiate significantly lower rates than smaller issuers.\n\nAnthropic's fee arrangements also highlight the bargaining power that blockbuster issuers hold over Wall Street.\n\nSome banks working on the deal did not learn how much they would earn until Wednesday night, according to a person close to the transaction - suggesting an unusual degree of uncertainty until the final stages of the offering, even as banks compete fiercely over the most coveted deals.", "source": "LiveMint Markets", "pub_date_str": "21 Nov 2026, 12:28 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers", "Derivatives"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "It\u2019s tough out there", "full_content": "And even \u201cdiversification benefits\u201d are under pressure", "source": "FT Markets", "pub_date_str": "21 Nov 2026, 12:27 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "EPFO\u2019s Systematic Withdrawal Plan: What is the waiting period for final PF withdrawal if unemployed? Explained here", "full_content": "The Employees' Provident Fund Organisation ( EPFO ) has approved a major overhaul of its provident fund withdrawal framework, giving subscribers greater flexibility in accessing their retirement savings. The changes include reducing the waiting period for final provident fund (PF) withdrawal after unemployment, introducing periodic payouts for retirees and lowering the minimum balance that members must retain in their accounts.\n\nUnder the revised framework, eligible EPF members who leave employment and remain unemployed can apply for final settlement after two months instead of waiting for 12 months.\n\nThe decision, taken on November 19, reverses the change introduced in October 2025, when the waiting period for final PF withdrawal was extended from two months to one year.\n\nThe revised rules are expected to provide relief to employees who lose their jobs, voluntarily leave employment or experience prolonged gaps between jobs and need access to their accumulated savings.\n\nHowever, the changes will become operational only after the required amendments to the EPF Scheme are approved and notified by the Labour Ministry.\n\nThe reduction in the unemployment waiting period is among the key changes approved under the revised withdrawal framework.\n\nPreviously, members had to remain unemployed for 12 months before becoming eligible for final PF settlement following the October 2025 amendment.\n\nUnder the latest decision, this period will return to two months.", "source": "LiveMint Money", "pub_date_str": "21 Nov 2026, 12:14 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Bitcoin's regulation bull case is played out. What could drive crypto gains moving forward", "full_content": "Crypto investors are hunting for the next positive catalyst after U.S. crypto regulation \u2014 a longtime market driver \u2014 fizzled in 2026.\n\nBitcoin traded around $61,500 on Friday, a more than 50% decline from its all-time high above $126,000 reached in October 2025. The broader digital asset market has struggled after the Clarity Act, a crypto market structure bill, failed to advance in the Senate in September.\n\nInvestors now see Wall Street's embrace of blockchain technology \u2014 particularly tokenization \u2014 as the next trend to give bitcoin a boost.\n\n\"Every single traditional firm is now looking at digital assets,\" BitGo CEO Mike Belshe told CNBC last week in an exclusive interview from the fintech-focused Cantor Convergence conference in Miami Beach. That includes BlackRock , the world's largest asset manager.\n\nHe pointed to statements from the asset management giant's CEO, Larry Fink, who said the next major evolution in global finance is the creation of digital representations of every stock, bond, fund and real-world asset onto a shared blockchain ledger.\n\n\"I think the biggest catalyst we're seeing right now is actually very much in motion and it's happening, which is capital markets are moving onchain,\" eToro CEO Yoni Assia told CNBC in an exclusive interview from the conference. He pointed to the SpaceX IPO as an example, which had derivatives trading on eToro before the IPO.\n\n\"First day of trading, we distributed it to our retail clients, and it started trading 24/7, and that's all because capital markets are now copying crypto markets and are sitting on the same rails,\" Assia said. \"Crypto markets have always been 24/7, they never sleep, and now what we're seeing is that capital markets are copying crypto markets using the same technology so stocks are moving onchain, they're being tokenized.\"\n\nAssia said that supportive regulation in the U.S.", "source": "CNBC World Economy", "pub_date_str": "20 Nov 2026, 11:37 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Corporate Issuers", "Fixed Income", "Derivatives", "Alternative Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Should you wait for a market fall before starting a mutual fund SIP? What 30 years of Sensex data reveal", "full_content": "Starting a mutual fund systematic investment plan (SIP) when markets are falling may seem like the ideal way to maximise returns. Investors often wait for a correction before committing money to equities, hoping to buy more units at lower prices. But waiting for the market to bottom can also mean missing months or years of potential investment growth.\n\nA November 2026 analysis by WhiteOak Capital Mutual Fund, based on more than 29 years of BSE Sensex total return index (TRI) data, examines whether investors who begin SIPs at market bottoms actually gain an advantage over those who start at market peaks.\n\nThe analysis suggests that while investors starting at market bottoms may earn marginally higher annualised returns in some periods, those who start earlier can accumulate a larger corpus because they invest for longer.\n\nWhiteOak examined nine market correction cycles in which the Sensex fell more than 20% from its peak. It compared two hypothetical investors who started a monthly SIP of \u20b9 10,000, one at the market peak and the other at the subsequent bottom. Their investments were tracked until 31 October 2026.\n\nThe comparison shows that the investor who started at the bottom did not necessarily build a larger corpus, even when the annualised return was marginally higher.\n\nThe January 2008 peak and March 2009 bottom example illustrates this. The investor who began a \u20b9 10,000 monthly SIP in January 2008 had invested \u20b9 22.60 lakh by October 2026. The investment was worth \u20b9 72.30 lakh, delivering an XIRR of 11.19%.\n\nThe investor who waited until March 2009 to start the same SIP had invested \u20b9 21.20 lakh. The portfolio value stood at \u20b9 62.12 lakh, with an XIRR of 11.12%.\n\nThe investor who started earlier accumulated \u20b9 10.17 lakh more, despite the later investor entering after a market correction. The difference in annualised returns was just 0.07 percentage points.", "source": "LiveMint Money", "pub_date_str": "20 Nov 2026, 11:35 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Anthropic shares slide as tech stocks tumble", "full_content": "Blockbuster debut from developer of Claude fails to ease concerns over AI capex spending boom", "source": "FT Markets", "pub_date_str": "20 Nov 2026, 11:33 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "This VIX Signal Is Bullish For The S&P 500. - Investor's Business Daily", "full_content": "This VIX Signal Is Bullish For The S&P 500. Investor's Business Daily Wall Street's fear gauge touches seven-month high as AI worries mount Reuters It\u2019s Getting More and More Volatile for Stocks Barron's Wall Street's fear gauge is surging again and this time it's not just about AI jitters C     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
