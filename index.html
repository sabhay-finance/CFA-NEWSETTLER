    const allData = {"general": [{"title": "United Airlines reports system outage affecting departing flights", "full_content": "United Airlines on Monday reported a \"widespread system outage\" was affecting departing flights.\n\n\"We are troubleshooting a technology issue affecting departing flights,\" the airline said in a statement. \"There is no impact on flights in progress, or on United Express flights.\"\n\nA United spokesperson said there was no indication that the outage was a cyberattack.\n\nUnited said in a post on X that its teams \"are working hard to get things back up and running as soon as possible.\" The airline told travelers to check their flight status for updates.\n\nThe Air Line Pilots Association, which represents pilots for United and other carriers, said in a message to members seen by CNBC that the operational outage was \"affecting multiple pilot facing applications\" and that United could not \"provide outbound flights with final weights.\"\n\nUnited's outage came three days after a nationwide ground stop halted flights across the country for more than four hours, snarling travel and leading to widespread delays and cancellations over the weekend.\n\nTransportation Secretary Sean Duffy blamed the issues that led to Friday's ground stop on a router in Arkansas that overwhelmed systems that feed radar and other data for air traffic control. FAA Administrator Bryan Bedford said the upgrades were part of \"routine\" maintenance to switch over from copper wires to fiber optic.\n\nThere were significantly fewer flight delays and cancellations Monday than had been reported Sunday, according to FlightAware data.", "source": "CNBC Top News", "pub_date_str": "17 Nov 2026, 04:21 AM IST", "pub_date_relative": "5m ago"}, {"title": "U.S. dollar\u2019s AI-driven breakout could become a stock-market wrecking ball", "full_content": "The dollar recently climbed to its strongest level in a year and a half.", "source": "MarketWatch Top Stories", "pub_date_str": "17 Nov 2026, 04:16 AM IST", "pub_date_relative": "11m ago"}, {"title": "Hydrofarm earnings missed by $0.36, revenue fell short of estimates", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Nov 2026, 04:12 AM IST", "pub_date_relative": "14m ago"}, {"title": "Exclusive-DOJ to review DoorDash-Instacart merger, sources say", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Nov 2026, 04:12 AM IST", "pub_date_relative": "14m ago"}, {"title": "JPMorgan says software bug slows its transactions", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Nov 2026, 04:12 AM IST", "pub_date_relative": "14m ago"}, {"title": "Earnings call transcript: XBP Global Q3 2026 revenue falls as margins improve", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Nov 2026, 04:12 AM IST", "pub_date_relative": "15m ago"}, {"title": "Earnings call transcript: Burcon Q2 2026 revenue jumps as stock rises 3.6%", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Nov 2026, 04:12 AM IST", "pub_date_relative": "15m ago"}, {"title": "Earnings call transcript: Orezone Gold beats Q3 2026 estimates, shares fall", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Nov 2026, 04:11 AM IST", "pub_date_relative": "16m ago"}, {"title": "Earnings call transcript: Capstone Energy+ posts weak Q2 2027, shares edge higher", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Nov 2026, 04:10 AM IST", "pub_date_relative": "16m ago"}, {"title": "Celsius Holdings outlook lifted to positive by S&P as leverage falls to 1.7x", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Nov 2026, 04:08 AM IST", "pub_date_relative": "18m ago"}, {"title": "Trump\u2019s accounts traded up to $97.5 million in Nvidia as Huang gained White House access", "full_content": "President Donald Trump has had plenty of reason to cheer the rise of Nvidia .\n\nThe chipmaker helped propel the stock market that Trump is fond of touting. Its billionaire co-founder, Jensen Huang , became one of the president's favorite businessmen. And by the end of last year, Nvidia had become one of Trump's three largest individual stock holdings, worth between $12.5 million and $58 million, up from between $615,000 and $1.3 million a year earlier.\n\nSince returning to the White House, Trump's investment accounts have bought or sold Nvidia shares at least 103 times \u2014 transactions worth a combined $27 million to $97.5 million, according to a new CNBC analysis of his annual and periodic financial disclosures, which were most recently updated through August.\n\nBy midday Monday, Trump's Nvidia stake, based on the value he reported holding in August, would be worth $4.5 million to $57.7 million with stock priced around $157. But the filings give broad dollar ranges for holdings rather than the number of shares, leaving his current stake unclear.\n\nNow, Huang's resignation as Nvidia's CEO on Thursday, following revelations about his relationship with a woman suspected of spying for China and reports of affairs with company employees, has put those trades back in the spotlight.\n\nAmong them was a sale of $500,001 to $1 million on May 18 , the first Monday after Trump returned from a state visit to China with Huang. Five days earlier, before Huang boarded Air Force One during a refueling stop in Alaska, Secretary of State Marco Rubio had briefed Trump on intelligence concerning Huang's relationship with the suspected spy, The New York Times reported .\n\nTrump on Monday denied being briefed .", "source": "CNBC Top News", "pub_date_str": "17 Nov 2026, 04:07 AM IST", "pub_date_relative": "19m ago"}, {"title": "Earnings call transcript: Sharon AI posts mixed Q3 2026 results as stock falls", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Nov 2026, 04:07 AM IST", "pub_date_relative": "20m ago"}, {"title": "Stocks making the biggest moves Monday: Intel, Lumentum, Sandisk, Coinbase, Nvidia & more", "full_content": "The artificial intelligence trade dropped to start the week, as \"picks and shovels\" plays declined alongside Nvidia.\n\nLumentum, Sandisk and Bloom Energy tumbled alongside the chip giant ahead of Nvidia's earnings due Tuesday afternoon. Coinbase and Strategy, both of which are tied to bitcoin, also dropped as traders went risk-off.\n\nInvestors sought shelter in consumer staples, lifting the Consumer Staples Select SPDR ETF (XLP) to a record high.\n\nIn extended trading, shares of Intel dropped after Nvidia disclosed that it slashed its stake in the chipmaker.\n\nFollow along as CNBC highlights the biggest stock market moves of the day.\n\nIntel fell in after-hours trading Monday after Nvidia disclosed that it has cut its stake in the company.\n\nIntel shares on Monday Nvidia said in a regulatory filing that it trimmed its stake by 25% in the quarter ending Sept. 30, selling nearly $5.5 billion in shares. The move lowers Nvidia's holding in Intel to 161 million shares from 215 million.\n\nShares of neocloud companies slumped on Monday, tumbling near session lows in the afternoon.", "source": "CNBC Top News", "pub_date_str": "17 Nov 2026, 04:03 AM IST", "pub_date_relative": "24m ago"}, {"title": "Berkshire upped its bet on a beleaguered U.S. housing market, while souring on these bank stocks", "full_content": "Berkshire Hathaway stepped up its investments in the U.S. housing market last quarter, nearly doubling its stake in home builder Lennar.", "source": "MarketWatch Top Stories", "pub_date_str": "17 Nov 2026, 04:03 AM IST", "pub_date_relative": "24m ago"}, {"title": "\u2018He calls my plans a fantasy\u2019: My husband says we can\u2019t afford a $200,000-a-year retirement. Is he being cheap?", "full_content": "\u201cWe have $2 million saved in our retirement accounts and a house worth $1.3 million.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "17 Nov 2026, 04:00 AM IST", "pub_date_relative": "27m ago"}, {"title": "Berkshire Hathaway raised its stake in Delta in the third quarter. It also trimmed a key bank holding", "full_content": "Berkshire Hathaway made several moves in the stock market during the third quarter, adding to key positions and trimming others.\n\nThe Greg Abel-led conglomerate increased its Delta Air Lines stake by 12%, scooping up 7.13 million shares. The position was worth $5.37 billion at the end of the third quarter.\n\nDelta shares tumbled 11% over that period, as rising jet fuel prices due to the U.S.-Iran war pressured the airline industry. That marked the stock's worst quarterly performance since the first quarter of 2025, when it plunged 28%. Delta last month also cut its full-year earnings forecast , citing a surge in fuel costs.\n\nTo be sure, buying that dip has been a winning investment thus far. Delta is up 3.8% so far in the fourth quarter, while the S&P 500 has dropped 3.1%. Shares are also up nearly 15% over the past month.\n\nBerkshire also trimmed its holding in Bank of America by nearly 6%, selling more than $1.6 billion worth of stock.\n\nBofA was under pressure in the third quarter, falling more than 4%, as interest rates surged alongside stubbornly high inflation and expectations of tighter Federal Reserve monetary policy. At one point in September the 30-year Treasury bond yield surged above 5.6% to its highest level since 2002 .\n\nDespite the share sale, Bank of America remains a top Berkshire Hathaway holding, with the conglomerate's stake valued at $24.8 billion at the end of the third quarter.\n\nBerkshire also initiated a position in Bending Spoons and nearly doubled its stake in homebuilder Lennar in the latest quarter.", "source": "CNBC Finance", "pub_date_str": "17 Nov 2026, 03:52 AM IST", "pub_date_relative": "34m ago"}, {"title": "Nvidia live updates: Interim CEO Kress prepares for Q3 earnings, with Huang reportedly planning comeback - Yahoo Finance", "full_content": "Nvidia live updates: Interim CEO Kress prepares for Q3 earnings, with Huang reportedly planning comeback Yahoo Finance Nvidia Earnings Are Sideshow as Huang\u2019s Ouster Looms Over Market Bloomberg.com Here's How the S&P 500 Has Moved the Day After Each of Nvidia's Last 12 Reports The Motley Fool Will Nvidia earnings steady the AI sell-off? Financial Times All the questions Nvidia should answer on Tuesday \u2014 but probably won\u2019t Yahoo Finance", "source": "Google News Business", "pub_date_str": "17 Nov 2026, 03:51 AM IST", "pub_date_relative": "35m ago"}, {"title": "The FDA declined to approve one of biotech\u2019s most closely watched cancer drugs. The company\u2019s stock tumbled.", "full_content": "The regulator told Summit Therapeutics that the lung-cancer drug needs to prove it can help people live longer.", "source": "MarketWatch Top Stories", "pub_date_str": "17 Nov 2026, 03:51 AM IST", "pub_date_relative": "36m ago"}, {"title": "U.S. crude oil declines to $85 a barrel on recovering Middle East exports", "full_content": "Oil prices are falling Monday as shipments through the Strait of Hormuz recover and tensions between Iran and the U.S remain at a stalemate.\n\nBrent crude fell 3.55% to $92.44 per barrel Monday while West Texas Intermediate crude futures settled down 3.58% to $85.39 a barrel.\n\nThe International Energy Agency said on Friday it expects global supply to exceed 1.7 million barrels a day in the fourth quarter of 2026, reversing its earlier forecast for a deficit as Middle East exports recover faster than global demand and even as shipping attacks continue.\n\nWTI Crude, YTD Meanwhile, Russia's crude oil production rose to 8.73 million barrels a day in October, a 210,000 barrel-a-day surge, according to the IEA.\n\nGoldman Sachs said in a Sunday note it expects Brent to average $88 a barrel in 2027 and fall to $78 by December 2027 as the market returns to a surplus.\n\nThe bank believes Middle East supply to rise above its 2025 average as producers use ship-to-ship transfers and add pipeline capacity.", "source": "CNBC Finance", "pub_date_str": "17 Nov 2026, 03:49 AM IST", "pub_date_relative": "38m ago"}, {"title": "Berkshire Boosts Delta Stake to Almost 10% of Outstanding Shares", "full_content": "(Bloomberg) -- Berkshire Hathaway Inc. boosted its holding in Delta Air Lines Inc. and continued whittling its stake in Bank of America Corp in the third quarter.\n\nThe Omaha, Nebraska-based conglomerate bought more than 7 million shares of the airline, according to a filing Monday. Its stake, worth $5.4 billion as of Sept. 30, represents 9.8% of Delta\u2019s total shares. Berkshire started investing in the airline earlier in 2026 after years of navigating a complicated relationship with the the air travel industry.\n\nBerkshire also trimmed its holding in Bank of America to 6.5%, selling more than 27 million shares. A longtime holder of the bank\u2019s shares, Berkshire started selling it down in 2024 and has been paring the investment.\n\nBerkshire spent about $9.6 billion to buy back its own shares in the third quarter, its largest such payout. Despite the purchase, the firm\u2019s cash pile rose from the previous quarter, totaling $377.4 billion at the end of September. After deducting $20.5 billion in unsettled US treasury bill purchases, the firm\u2019s cash stood at about $357 billion.\n\nThe conglomerate sold a net $426 million in equities in the period, according to Berkshire\u2019s quarterly earnings report earlier this month.\n\nAfter years of relatively quiet deal activity under Chairman Emeritus Warren Buffett, who often complained of high market valuations, Chief Executive Officer Greg Abel has been cutting more checks than his predecessor. In his first year as CEO, he has started deploying the firm\u2019s giant cash pile in multibillion-dollar deals and pushed the firm into AI.\n\nAfter handing $10 billion to Google parent Alphabet Inc. to support the tech firm\u2019s AI efforts, the firm invested in Bending Spoons SpA, an Italian conglomerate that applies the new technology to established businesses.\n\nThe firm also added to its bet on homebuilder Lennar Corp. This year, Berkshire Hathaway completed its acquisition of Taylor Morrison Home Corp. in an all-cash deal worth about $6.8 billion.", "source": "LiveMint Markets", "pub_date_str": "17 Nov 2026, 03:48 AM IST", "pub_date_relative": "39m ago"}, {"title": "JPMorgan Chase says temporary software bug is affecting consumer banking", "full_content": "JPMorgan Chase reported a \"technical issue\" that was affecting some consumer banking services Monday.\n\nThe bank said a \"temporary issue related to a software bug in on-premise hardware systems\" was causing some customer transactions to take longer than usual, though it said customers can still access their accounts and funds.\n\n\"There is no evidence it is cyber-related,\" a JPMorgan spokesperson said in a statement to CNBC.\n\n\"This is not a systemic issue \u2014 other banks may have been impacted by slowness in transactions only to the extent that they were a party to a transaction with us,\" the spokesperson said. \"We're working diligently to resolve this by the end of the day today.\"\n\nCNBC's Eamon Javers reported there was no indication of bad actors involved.\n\nStill, other major banks were listed in outage reports as transactions between Chase and other institutions appeared to get held up. Users reported errors as early as 11:30 a.m. ET.\n\nA representative for U.S. Bank said that company was \"not directly impacted. However, clients attempting to send or receive Zelle payments with another financial institution may experience transaction delays.\"\n\nZelle is the peer-to-peer payments system backed by many of the largest U.S. banks, including JPMorgan.", "source": "CNBC World Economy", "pub_date_str": "17 Nov 2026, 03:44 AM IST", "pub_date_relative": "42m ago"}, {"title": "United Airlines experiencing a widespread system outage, airline says - CNN", "full_content": "United Airlines experiencing a widespread system outage, airline says CNN United Airlines reports system outage affecting departing flights CNBC FAA ground stop latest updates: Saturday cancellations top 6,000; controllers\u2019 union chief says communications with some planes were disrupted; Duffy blames L3Harris Yahoo United Airlines Struck By Another Outage. The Stock Is Falling. Barron's United Airlines has a widespread system outage just days after nationwide ground stop AP News", "source": "Google News Business", "pub_date_str": "17 Nov 2026, 03:42 AM IST", "pub_date_relative": "45m ago"}, {"title": "California sues OpenAI over Hugging Face, other AI model loss of control", "full_content": "California Attorney General Rob Bonta on Monday sued artificial intelligence giant OpenAI for allegedly endangering the public by developing advanced AI models without adequate safeguards and monitoring.\n\n\"OpenAI disregarded public safety, knowingly tested potentially dangerous AI models without proper oversight and safety measures, and misled consumers and the public,\" Bonta said at a press conference.\n\nBonta cited the \"infamous\" incident in July, where two OpenAI models broke out of a testing environment, gained unauthorized access to the open internet, and breached the internal systems of open-source developer platform Hugging Face .\n\nOpenAI said the models were trying to find information that they could use to cheat on an evaluation, and succeeded. The break-in at Hugging Face, which Nvidia acquired for roughly $13 billion in September. rattled industry researchers and prompted government officials to call for more stringent oversight of the AI industry.\n\nOn Monday, Bonta said that OpenAI later disclosed to his investigators that it was aware of 80 incidents \"involving loss of control and access to third-party networks and websites.\"\n\n\"But the company failed to provide the detailed information we requested to evaluate these incidents; this is concerning, and it puts the public at risk,\" he said.\n\nBonta's suit, filed in state Superior Court in San Francisco, alleges OpenAI violated California's Unfair Competition Law and accuses the company of being a public nuisance as defined by state law.\n\nThe attorney general told reporters he believed in AI's technological power, and the potential of AI models to \"achieve scientific breakthroughs, boost economic growth, guard against cyber attacks, and benefit all Californians.\"", "source": "CNBC Top News", "pub_date_str": "17 Nov 2026, 03:41 AM IST", "pub_date_relative": "46m ago"}, {"title": "Trump administration orders Commerce to close chip loophole at heart of Nvidia scandal - The Washington Post", "full_content": "Trump administration orders Commerce to close chip loophole at heart of Nvidia scandal The Washington Post Nvidia fallout: Commerce targets loophole for China's data center use CNBC Trump Administration Aims to Clamp Down on A.I. Chip Loophole The New York Times Trump administration tightens restrictions on flow of AI chips ahead of China trip CNN U.S. closes loophole that let Chinese companies use top AI chips through foreign data centers NBC News", "source": "Google News Business", "pub_date_str": "17 Nov 2026, 03:39 AM IST", "pub_date_relative": "47m ago"}, {"title": "\u2018It leaves me with a sour taste\u2019: My elderly mother gave our cousin $800 for a car repair. Should I be worried?", "full_content": "\u201cI know older people can easily feel patronized, and I don\u2019t want that to happen.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "17 Nov 2026, 03:38 AM IST", "pub_date_relative": "49m ago"}, {"title": "Altimeter's Brad Gerstner aims to invest $5 billion in Anthropic IPO", "full_content": "Altimeter Capital is aiming to invest $5 billion in the Anthropic initial public offering, Brad Gerstner told CNBC's \"Halftime Report\" on Monday.\n\n\"I think this is a cornerstone compounder for a long time,\" Gerstner said, noting that his investment would be five times the amount he's ever put into an IPO. \"It's where the trade is going.\"\n\nAnthropic is expected to go on Nasdaq on Thursday in a milestone event for the artificial intelligence industry. It would be the first major AI lab to go public, beating OpenAI, which has said it's targeting an IPO next year.\n\nGerstner is investing alongside the leading chipmakers and cloud providers, many of which count on Anthropic as a customer.\n\nAdvanced Micro Devices , Broadcom , Google , Micron , Microsoft , Nvidia and Taiwan Semiconductor Manufacturing Co. are collectively investing $26 billion at the IPO price, which is currently expected at $70 to $78 a share.\n\nAnthropic is planning to offer 825 million shares at a valuation of about $1.4 trillion.\n\nGerstner is friends with former Nvidia CEO Jensen Huang , and sent a letter to the board of directors last week pushing them to take their time and run a full investigation on Huang's tenure before deciding who should run the company.\n\nGerstner said he has confidence in CFO and interim CEO Colette Kress , and noted that Huang had not discussed a comeback as CEO with him.", "source": "CNBC World Economy", "pub_date_str": "17 Nov 2026, 03:31 AM IST", "pub_date_relative": "56m ago"}, {"title": "Nasdaq 100 sinks 2.7% in gloomy start to pivotal week for AI trade", "full_content": "US chip stocks fall as Nvidia sustains fresh bout of selling pressure", "source": "FT Markets", "pub_date_str": "17 Nov 2026, 03:28 AM IST", "pub_date_relative": "58m ago"}, {"title": "Visa, Mastercard urge approval of $38 billion swipe fee settlement - Reuters", "full_content": "Visa, Mastercard urge approval of $38 billion swipe fee settlement Reuters See more headlines & perspectives on Google News", "source": "Google News Business", "pub_date_str": "17 Nov 2026, 03:26 AM IST", "pub_date_relative": "1h ago"}, {"title": "OpenAI inks agreements with four independent evaluators to boost company's safety work", "full_content": "OpenAI on Monday announced it has signed agreements with four independent evaluators to help support the artificial intelligence company's safety work.\n\nThe evaluators, Apollo Research, METR, Transluce and Goodfire, will initially conduct distinct pilot assessments around model behavior and safeguards, OpenAI said. The company will give the organizations \"deep access\" to its internal systems as part of the agreements, adding that it plans to use what it learns to expand its work with independent experts going forward.\n\n\"We expect this first phase of assessments to lead to longer-term, consistent embedded engagements over time that can continuously provide third party safety signals and recommended improvements on our most load bearing safety claims and safety cases,\" OpenAI said in a blog post .\n\nIndependent evaluators have occupied a quiet corner of the multitrillion-dollar AI industry thus far, but they've taken on outsized importance following a series of high-profile safety and security incidents this year. The nascent ecosystem is still ironing out best practices, including how its work should be funded and what the reporting structures should ultimately look like.\n\nOpenAI CEO Sam Altman pledged to grant independent evaluators \" employee-like access \" to the company in September, shortly after Anthropic CEO Dario Amodei said his company would do so as part of his call to slow down the pace of advanced model development. Anthropic has since announced agreements with evaluators including Accenture and METR, and it said in October that it's engaging in discussions with others.\n\nOpenAI's safety practices have been under intense scrutiny since July, when two of its models escaped containment, accessed the open internet and hacked a company called Hugging Face .", "source": "CNBC World Economy", "pub_date_str": "17 Nov 2026, 03:24 AM IST", "pub_date_relative": "1h ago"}, {"title": "Nvidia\u2019s stock extends decline following harsh words from the U.S. government", "full_content": "The Commerce Department announced a new rule aimed at restricting China\u2019s remote access to advanced chips.", "source": "MarketWatch Top Stories", "pub_date_str": "17 Nov 2026, 03:23 AM IST", "pub_date_relative": "1h ago"}, {"title": "Nvidia fallout: Commerce targets loophole for China's data center use", "full_content": "The Commerce Department on Monday moved to close a loophole that has let Chinese companies lease Nvidia 's advanced computing power from data centers in third countries, effectively circumventing controls on sensitive chip technology being exported to China .\n\nThe interim final rule from Commerce's Bureau of Industry and Security is the first U.S. policy response to the scandal that led Nvidia CEO Jensen Huang to resign last week after reports that he had an affair with an alleged Chinese spy who worked for Megaspeed, one of Nvidia's biggest Asian customers.\n\nThe rule was \"written by and at the direction of\" the Treasury Department and the White House National Security Council, BIS said in a press release.\n\nThe rule came after growing criticism of Commerce Secretary Howard Lutnick for not doing enough to prevent possible diversion of Nvidia's most advanced chips to China in violation of American export controls.\n\nTreasury Secretary Scott Bessent , in an interview on Friday with CNBC's \"Squawk Box,\" blamed the Commerce Department for not putting Singapore-based Megaspeed on its \"entity list,\" which would restrict certain exports to it.\n\nShare prices of Nvidia and other companies linked to the artificial intelligence trade fell Monday morning after the interim rule was announced, among them chipmakers Micron Technology , Intel and Advanced Micro Devices .\n\nThe rule is designed \"to prevent certain foreign actors from leveraging advanced computing power based on U.S. technology to threaten U.S. national security and foreign policy interests,\" according to the text of the rule.\n\nThe new restrictions \"will undermine the ability of companies headquartered in countries of concern from using\" advanced artificial intelligence semiconductors produced by U.S. companies to train advanced AI models, the rule says.", "source": "CNBC Top News", "pub_date_str": "17 Nov 2026, 03:21 AM IST", "pub_date_relative": "1h ago"}, {"title": "Chase says \u2018software bug\u2019 could be causing disruptions at major U.S. banks", "full_content": "Some customers are saying they can\u2019t access their accounts or their unable to withdraw funds.", "source": "MarketWatch Top Stories", "pub_date_str": "17 Nov 2026, 03:19 AM IST", "pub_date_relative": "1h ago"}, {"title": "My husband is happily retired at 64 and thinks I should keep working. Is he being fair?", "full_content": "\u201cI\u2019m exhausted. My alarm goes off at 6 a.m., and I have a 50-minute commute.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "17 Nov 2026, 03:15 AM IST", "pub_date_relative": "1h ago"}, {"title": "Now\u2019s the perfect time for networking. Here\u2019s how to send a cringe-free email.", "full_content": "Hiring for white-collar jobs usually dips in November and December, so try sending \u201ccold emails\u201d to your network instead.", "source": "MarketWatch Top Stories", "pub_date_str": "17 Nov 2026, 03:10 AM IST", "pub_date_relative": "1h ago"}, {"title": "Bitcoin slides to $62,000 following liquidation cascade, then rebounds slightly", "full_content": "Bitcoin fell to its lowest levels since August over the weekend as a wave of forced liquidations accelerated amid broader weakening in market liquidity and risk appetite.\n\nThe price of the flagship cryptocurrency fell as low as $62,000 late Saturday, according to Coin Metrics, and is coming off its sixth weekly decline in a row. By Monday evening, it had climbed back to the $65,000 level.\n\nBitcoin's ongoing weakness pushed its price below key technical support levels during the week, breaking below its 200-day moving average of about $73,000 and triggering the cascade of long liquidations, forcing traders to sell their assets at market price to settle their debts, pushing prices lower.\n\nOn Saturday night, exchanges tracked by CoinGlass saw more than $165 million in liquidated bitcoin long positions, following $629 million on Friday and nearly $700 million on Thursday.\n\nBitcoin just logged its sixth consecutive week of declines Bitcoin was also facing potential selling pressure ahead of Anthropic's anticipated initial public offering, with the listing drawing speculative capital away from riskier assets.\n\nOn Friday, the dollar index \u2014 which has an inverse relationship with bitcoin \u2014 reached its highest level since April 2025, following hotter-than-expected inflation earlier this week that increased expectations of further Fed tightening. That pushed Treasury yields and the dollar higher while pressuring both bitcoin and gold, despite their appeal as alternative stores of value in the longer term.\n\nThroughout November, bitcoin has been struggling from the combination of dollar strength, institutional selling, and ongoing leveraged bitcoin liquidations. The declines began in late October, as concerns over artificial intelligence valuations and spending fueled a broad tech sell-off.", "source": "CNBC World Economy", "pub_date_str": "17 Nov 2026, 02:56 AM IST", "pub_date_relative": "1h ago"}, {"title": "Kalshi plans to launch stock trading soon", "full_content": "Leading prediction market platform Kalshi will offer stock trading within the next few months, a person familiar with the matter told CNBC.\n\nThe platform's move to offer equity trading is the boldest so far in its ongoing push into traditional financial markets and comes amid an escalating fight by states and lawmakers against its sports trading business. Sports contracts continue to account for a large share of trading on the platform.\n\nIn September, the platform introduced perpetual futures tied to precious metals such as gold and silver after it had originally filed in July to offer beyond prediction market event contracts with the Commodity Futures Trading Commission , the federal regulator overseeing derivatives contracts. Perpetual futures are futures-style contracts that have no expiration date.\n\nKalshi also received approval to list perpetual futures tied to cryptocurrencies in late May.\n\nThe prediction market's stock trading offering was enabled by its purchase of broker-dealer FB Securities in July, the source said. FB Securities was founded in Delaware in 2024 and became registered with the Securities and Exchange Commission in December 2025. The broker did not respond to a request for comment.\n\nThe Wall Street Journal first reported that Kalshi plans to introduce stock trading.\n\nShares of Robinhood , which offers some prediction markets alongside equity trading, fell on Monday, though the stock was already lower amid a broader market sell-off. Robinhood closed down by 7.8%.\n\nDisclosure: CNBC and Kalshi have a commercial relationship that includes customer acquisition and a minority investment.", "source": "CNBC Top News", "pub_date_str": "17 Nov 2026, 02:53 AM IST", "pub_date_relative": "1h ago"}, {"title": "Chevron nears $5bn deal for Blackstone-backed oil producer in US Gulf", "full_content": "Oil major pulls ahead of rival bidders for Beacon Offshore Energy as it expands deepwater production", "source": "FT Markets", "pub_date_str": "17 Nov 2026, 02:50 AM IST", "pub_date_relative": "1h ago"}, {"title": "The best long-term personal loans of 2026", "full_content": "Most lenders give borrowers 12 to 60 months (one to five years) to repay their loan, but there are definitely options if you're looking for longer repayment terms. Securing a longer term usually results in smaller monthly payments, but it also means paying more in interest overall.\n\nWe've named the best lenders who offer repayment terms of at least 84 months, or seven years, looking at key factors like rates, fees, loan amounts and eligiblity requirements. Read more about how we made our selections in our methodology below.\n\nWho's this for? BHG Financial OKs loans of up to $250,000, more than twice what many other lenders approve. Terms range from 36 months all the way up to ten years, and it considers borrowers with fair credit (640 FICO Score).\n\nStandout benefits: BHG allows co-borrowers , which may help strengthen your application. While it does assess an origination fee, it maxes out at 5% of your loan total.\n\nBHG approves loans for as much as $250,000, more than twice the industry standard.\n\nThis non-bank lender is a standout for large loan amounts, flexible credit score requirements and generous repayment terms. But borrowers typically need income of at least $100,000 and you can't secure your loan with collateral.\n\nUpgrade offers repayment terms of up to seven years, longer than the five years most lenders offer.\n\nWe like that Upgrade considers borrowers with fair credit and allows co-borrowers, which can improve the odds of approval and receiving favorable rates. The maximum interest rate is on the high side, however.", "source": "CNBC Top News", "pub_date_str": "17 Nov 2026, 02:49 AM IST", "pub_date_relative": "1h ago"}, {"title": "Nasdaq falls more than 2%, extending slide to third day as Nvidia drags down AI trade", "full_content": "U.S. equities fell on Monday, dragged down by key technology stocks, as traders reacted to more developments surrounding Nvidia .\n\nThe Nasdaq Composite declined 2.49% to end at 24,509.76, while the S&P 500 dropped 1.92% to 7,416.59. Both indexes slid for the third straight session. The Dow Jones Industrial Average shed 739.38 points, or 1.41%, closing at 51,608.17.\n\nShares of Nvidia were down 4.1%. The pressure came as a source familiar with the matter told CNBC that the chipmaker's board of directors is not discussing bringing back Jensen Huang as its chief executive.\n\nAdding to the pressure, the Commerce Department on Monday moved to close a loophole that has let Chinese firms rent Nvidia's computing power located in other countries. Treasury Secretary Scott Bessent over the weekend also called for a \" dramatic shakeup \" at the company, urging its board to look outside the company for its next CEO.\n\n\"Two weeks ago investing in this name looked like a safe journey down a well-lit long hallway,\" said Mike Mussio, chief investment officer at FBB Capital Partners. Now, he added, \"there are several dark corners that people feel they need to peek around to glean additional information before moving forward.\"\n\n\"There is plenty to digest, and many jumpy investors seem unwilling to stick around for answers,\" Mussio continued.\n\nThe embattled chipmaker is preparing to report its third-quarter results after the bell on Tuesday. While analysts expect the company to post nearly 100% year-over-year earnings and revenue growth, investors will be more focused on how the company will move forward after Huang's exit as CEO.\n\nHuang last week resigned from his post after reports of multiple extramarital affairs, including one with an alleged Chinese spy. Nvidia shares dropped about 13%, marking their biggest weekly slide since April 2025.", "source": "CNBC Top News", "pub_date_str": "17 Nov 2026, 02:48 AM IST", "pub_date_relative": "1h ago"}, {"title": "Rare-earth stocks sink deeper into the red. Here\u2019s the latest catalyst.", "full_content": "Shares of Trump-backed USA Rare Earth slides 10% as analysts push out their sales estimates.", "source": "MarketWatch Top Stories", "pub_date_str": "17 Nov 2026, 02:48 AM IST", "pub_date_relative": "1h ago"}, {"title": "Nationwide outage impacts Chase banking online and at some branches - NBC News", "full_content": "Nationwide outage impacts Chase banking online and at some branches NBC News Chase Bank Reports \u2018Software Bug\u2019 Is Disrupting Transactions The New York Times A technical issue at JPMorgan Chase triggers online banking delays for major US banks AP News Outages reported at major US banks including Chase and Bank of America BBC \u2018Trifecta of Turmoil\u2019: Fox\u2019s MacCallum Says \u2018Everything Seems to be Breaking Down Lately\u2019 Yahoo", "source": "Google News Business", "pub_date_str": "17 Nov 2026, 02:47 AM IST", "pub_date_relative": "1h ago"}, {"title": "Nvidia stock falls as investors price in fallout from Jensen Huang's resignation", "full_content": "Nvidia 's stock slid 4.12% Monday in the wake of CEO Jensen Huang 's resignation , leading a broader chipmaker selloff after the chip giant lost hundreds of billions in market cap last week.\n\nThe continued decline since Huang's resignation brought Nvidia's stock to its lowest close since July 1, 2025.\n\nHuang resigned from Nvidia, the company's board announced on Thursday, after mounting scrutiny following reports that he had a relationship with a woman believed to be a Chinese spy. Huang told employees he had an affair in an email on Nov. 8.\n\nIt was later reported that Huang had romantic relationships with two Nvidia employees. Nvidia did not immediately respond to CNBC's request for comment on Friday.\n\nNvidia stock. An online petition calling for Huang's reinstatement as Nvidia CEO has drawn more than 170,000 signatures , as prominent tech executives, including Elon Musk , rallied behind him. A source familiar with the matter told CNBC, however, that Nvidia's board of directors is not considering bringing back Huang.\n\nMeanwhile, U.S. lawmakers are pushing to launch comprehensive investigations into the scandal.\n\nHuang cofounded Nvidia in 1993 and led the company through its meteoric rise to becoming the world's most valuable company, with its AI chips underpinning the technology's boom.\n\nNvidia appointed longtime finance chief Colette Kress as interim CEO and said its board would consider both internal and external candidates in its search for a permanent successor.", "source": "CNBC World Economy", "pub_date_str": "17 Nov 2026, 02:42 AM IST", "pub_date_relative": "1h ago"}, {"title": "Microsoft reveals hidden bug behind global Outlook and Microsoft 365 outage - Fox Business", "full_content": "Microsoft reveals hidden bug behind global Outlook and Microsoft 365 outage Fox Business Microsoft Outage Explained: The 3 Issues Behind Last Week's Crash PCMag Microsoft Bug Undetected Since July Triggered Worldwide Outage Bloomberg.com Microsoft Rules Out Cyberattack in Outage, Warns of Phishing Campaign SecurityWeek Microsoft identifies months-old bug as a root cause of global outage The Guardian", "source": "Google News Business", "pub_date_str": "17 Nov 2026, 02:42 AM IST", "pub_date_relative": "1h ago"}, {"title": "Fed Chairman Highlights Economic Uncertainty of A.I. Boom - The New York Times", "full_content": "Fed Chairman Highlights Economic Uncertainty of A.I. Boom The New York Times Fed Chairman Kevin Warsh stresses importance of AI to economy, but says it could \u2018disappoint\u2019 CNBC Warsh Says Fed Is Gaming Out How AI Could Reshape Economy WSJ Marc Andreessen says government regulation will save jobs from AI \u2014 at the cost of economic growth Yahoo Finance Fed's Warsh says emerging technologies to have 'significant impact,' but there are risks Reuters", "source": "Google News Business", "pub_date_str": "17 Nov 2026, 02:38 AM IST", "pub_date_relative": "1h ago"}, {"title": "Robert Pattinson cast as next James Bond", "full_content": "Robert Pattinson has been cast as the next James Bond in the upcoming film from director Denis Villeneuve. It will be the 26th James Bond film and the first since Amazon MGM took over the iconic franchise.\n\nPattinson will be the seventh actor to play the role. Monday's announcement \u2014 which came in part via an Instagram post \u2014 ends a long period of speculation about who would take over as \"007\" after Daniel Craig.\n\n\"James Bond is one of the most legendary characters in cinema, and to be entrusted with 007 is the honour of a lifetime,\" Pattinson said in a statement . \"I couldn't be more excited about this partnership and the work ahead with this fantastic team.\"\n\nPattinson has appeared in several big-ticket films this year, including Christopher Nolan's \"The Odyssey\" and psychological thriller \"Primetime ,\" and he'll soon appear in \"Dune: Part Three,\" also directed by Villeneuve. Pattinson, who rose to fame with the Twilight movie series, is also in production for Matt Reeves' \"The Batman Part II,\" a follow-up to the 2022 film based on the DC comic.\n\nThe upcoming Bond film will have a script by Steven Knight and will be produced by Amy Pascal, known for her work on the Spider-Man franchise, and David Heyman, who produced all eight Harry Potter films.\n\n\"We were surrounded by extraordinary talent, but there can only be one 007,\" Villeneuve said. \"I am overjoyed to welcome Robert Pattinson as our new James Bond. He has the timeless soul of 007 and brings a spirit that is completely new. I cannot wait to begin.\"\n\nIn 2022, Amazon bought MGM Studios , which had long produced the Bond movies, for roughly $8.45 billion . Amazon MGM then acquired creative control of the James Bond intellectual property rights in 2025, when it closed a deal with longtime producers Barbara Broccoli and Michael G. Wilson.\n\nThe film is still untitled, and Amazon MGM hasn't announced a projected release date.", "source": "CNBC World Economy", "pub_date_str": "17 Nov 2026, 02:33 AM IST", "pub_date_relative": "1h ago"}, {"title": "Goldman Forecasts Gold to Take Two Years to Recapture All-Time Highs", "full_content": "(Bloomberg) -- It took gold just one month to climb more than 30% to a record, but its likely to take another two years before the precious metal takes out a new peak, according to Goldman Sachs.\n\nThe bank expects further weakness and heightened volatility in the near term as continued Federal Reserve tightening weighs on non-yielding bullion.\n\n\u201cOnce the Fed starts cutting, we expect Western ETF demand to recover, supporting a stronger gold rally to $5,600/ounce by end-2028,\u201d strategists led by Lina Thomas wrote in a note Monday, adding gold prices could rally if macro-policy hedge demand were to return.\n\nGold has had a bruising year since hitting an all-time high of nearly $5,600 an ounce in late January. The yellow metal is on track for its worst annual loss in more than a decade, down nearly 11% as the artificial intelligence investment boom, soaring bond yields and expectations for higher interest rates have sapped demand for bullion.\n\nIf history is any guide, 2027 will look increasingly like 2022: a rising Fed policy rate weighs on private investor demand, but structural central bank buying keeps a firm bid under gold, according to the strategists.\n\nThose bank purchases may help push gold higher to $4,650 an ounce by the end of next year, they said.\n\nThe metal traded at around $3,860 on Monday. Gold has been trending lower since late August, when Fed Chair Kevin Warsh warned that the central bank had \u201cwork to do\u201d to rein in inflation. Policymakers are widely expected to hike rates at the upcoming policy meeting in December.\n\nFirm inflation data last week prompted traders to bet on a more prolonged tightening cycle stretching into 2027. The Fed began raising rates in September for the first time in three years, lifting the benchmark to a range of 3.75% to 4%.", "source": "LiveMint Markets", "pub_date_str": "17 Nov 2026, 02:26 AM IST", "pub_date_relative": "2h ago"}, {"title": "The Fed Is Worried AI Agents Could Trigger a Bank Run - Gizmodo", "full_content": "The Fed Is Worried AI Agents Could Trigger a Bank Run Gizmodo Fed's Barr warns on AI risks to financial system Reuters Fed\u2019s Barr Says AI Agents Could Fuel Future Bank Runs Bloomberg.com Fed warns of growing financial risks from AI boom Axios Fed Eyes Hedge Fund Leverage and AI Valuations as Risks WSJ", "source": "Google News Business", "pub_date_str": "17 Nov 2026, 02:20 AM IST", "pub_date_relative": "2h ago"}, {"title": "Several companies are using Trump tariff refunds for corporate bonuses - The Guardian", "full_content": "Several companies are using Trump tariff refunds for corporate bonuses The Guardian These Companies Are Using Trump\u2019s Tariff Refunds for Executive Bonuses ProPublica These Corporations Are Using Trump Tariff Refunds to Reward Executives\u2014Not Help Consumers Common Dreams Surprise! You\u2019re Never Seeing a Dollar From Trump\u2019s Tariff Refunds The New Republic Tariff Refunds Are Going To Executive Bonuses At These Companies, Report Says Forbes", "source": "Google News Business", "pub_date_str": "17 Nov 2026, 02:19 AM IST", "pub_date_relative": "2h ago"}, {"title": "Anthropic\u2019s Wall Street whisperer: Meet CFO Krishna Rao", "full_content": "After closing a $65 billion funding round in May, he's been readying the artificial intelligence company for what's widely expected to be a blockbuster initial public offering . The listing could value Anthropic at roughly $1.4 trillion , instantly making it one of the largest tech companies in the world.\n\nRao joined Anthropic in 2024, when the company was still considered an underdog to OpenAI , now its chief rival. He's known as a straight shooter and a deft operator with a relentless work ethic, according to Anthropic investors and former colleagues, and he's played a crucial role in fueling the company's historic rise.\n\nThe 43-year-old finance chief has largely stayed out of the public eye, opting to yield the spotlight to Anthropic's seven co-founders , including CEO Dario Amodei and President Daniela Amodei . But Anthropic's upcoming Nasdaq debut, which is expected to take place on Thursday, will likely push him to center stage, as public market investors and analysts hang on his every word for insight into the AI trade.\n\nRao has nearly two decades of experience in finance across a range of companies, including Fanatics Commerce, a sports merchandise retailer, Cedar, a healthcare payments and billing platform, Airbnb and Blackstone . But he's never taken a company public as a CFO, and the stakes are high.\n\nInvestors are still reeling after Jensen Huang resigned as CEO of Nvidia following shocking reports of three extramarital affairs . The market was already jittery on concerns that rising interest rates would make debt unaffordable for companies that need it for costly infrastructure purchases.\n\n\"He's a committed professional. He's integrity-based, and he's had this meteoric rise in a very, very complex set of companies,\" Jonathan Mildenhall, Airbnb's former marketing chief and a Fanatics board member, told CNBC in an interview. \"There was nothing easy about Airbnb. There was nothing easy about Fanatics.", "source": "CNBC World Economy", "pub_date_str": "17 Nov 2026, 02:14 AM IST", "pub_date_relative": "2h ago"}, {"title": "Shareholders sue Intel, its CEO and CFO after stock drops 28.6 percent in one day - Ars Technica", "full_content": "Shareholders sue Intel, its CEO and CFO after stock drops 28.6 percent in one day Ars Technica Intel sued by shareholders following 29% stock plunge Reuters Intel sued by investors after PC sales slump hits share price BBC INTW 2X Intel ETF Tumbles 13% as Intel Drops Amid Shareholder Lawsuit and AI Chip Selloff; Taiwan Semiconductor Falls 5% Yahoo Finance Intel Sued by Investors After 29% Stock Plunge WSJ", "source": "Google News Business", "pub_date_str": "17 Nov 2026, 02:07 AM IST", "pub_date_relative": "2h ago"}], "cfa": [{"title": "Hydrofarm earnings missed by $0.36, revenue fell short of estimates", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Nov 2026, 04:12 AM IST", "pub_date_relative": "14m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Exclusive-DOJ to review DoorDash-Instacart merger, sources say", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Nov 2026, 04:12 AM IST", "pub_date_relative": "14m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Earnings call transcript: XBP Global Q3 2026 revenue falls as margins improve", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Nov 2026, 04:12 AM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Earnings call transcript: Burcon Q2 2026 revenue jumps as stock rises 3.6%", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Nov 2026, 04:12 AM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Earnings call transcript: Orezone Gold beats Q3 2026 estimates, shares fall", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Nov 2026, 04:11 AM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Earnings call transcript: Capstone Energy+ posts weak Q2 2027, shares edge higher", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Nov 2026, 04:10 AM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Celsius Holdings outlook lifted to positive by S&P as leverage falls to 1.7x", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Nov 2026, 04:08 AM IST", "pub_date_relative": "18m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Trump\u2019s accounts traded up to $97.5 million in Nvidia as Huang gained White House access", "full_content": "President Donald Trump has had plenty of reason to cheer the rise of Nvidia .\n\nThe chipmaker helped propel the stock market that Trump is fond of touting. Its billionaire co-founder, Jensen Huang , became one of the president's favorite businessmen. And by the end of last year, Nvidia had become one of Trump's three largest individual stock holdings, worth between $12.5 million and $58 million, up from between $615,000 and $1.3 million a year earlier.\n\nSince returning to the White House, Trump's investment accounts have bought or sold Nvidia shares at least 103 times \u2014 transactions worth a combined $27 million to $97.5 million, according to a new CNBC analysis of his annual and periodic financial disclosures, which were most recently updated through August.\n\nBy midday Monday, Trump's Nvidia stake, based on the value he reported holding in August, would be worth $4.5 million to $57.7 million with stock priced around $157. But the filings give broad dollar ranges for holdings rather than the number of shares, leaving his current stake unclear.\n\nNow, Huang's resignation as Nvidia's CEO on Thursday, following revelations about his relationship with a woman suspected of spying for China and reports of affairs with company employees, has put those trades back in the spotlight.\n\nAmong them was a sale of $500,001 to $1 million on May 18 , the first Monday after Trump returned from a state visit to China with Huang. Five days earlier, before Huang boarded Air Force One during a refueling stop in Alaska, Secretary of State Marco Rubio had briefed Trump on intelligence concerning Huang's relationship with the suspected spy, The New York Times reported .\n\nTrump on Monday denied being briefed .", "source": "CNBC Top News", "pub_date_str": "17 Nov 2026, 04:07 AM IST", "pub_date_relative": "19m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Earnings call transcript: Sharon AI posts mixed Q3 2026 results as stock falls", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Nov 2026, 04:07 AM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stocks making the biggest moves Monday: Intel, Lumentum, Sandisk, Coinbase, Nvidia & more", "full_content": "The artificial intelligence trade dropped to start the week, as \"picks and shovels\" plays declined alongside Nvidia.\n\nLumentum, Sandisk and Bloom Energy tumbled alongside the chip giant ahead of Nvidia's earnings due Tuesday afternoon. Coinbase and Strategy, both of which are tied to bitcoin, also dropped as traders went risk-off.\n\nInvestors sought shelter in consumer staples, lifting the Consumer Staples Select SPDR ETF (XLP) to a record high.\n\nIn extended trading, shares of Intel dropped after Nvidia disclosed that it slashed its stake in the chipmaker.\n\nFollow along as CNBC highlights the biggest stock market moves of the day.\n\nIntel fell in after-hours trading Monday after Nvidia disclosed that it has cut its stake in the company.\n\nIntel shares on Monday Nvidia said in a regulatory filing that it trimmed its stake by 25% in the quarter ending Sept. 30, selling nearly $5.5 billion in shares. The move lowers Nvidia's holding in Intel to 161 million shares from 215 million.\n\nShares of neocloud companies slumped on Monday, tumbling near session lows in the afternoon.", "source": "CNBC Top News", "pub_date_str": "17 Nov 2026, 04:03 AM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Berkshire Hathaway raised its stake in Delta in the third quarter. It also trimmed a key bank holding", "full_content": "Berkshire Hathaway made several moves in the stock market during the third quarter, adding to key positions and trimming others.\n\nThe Greg Abel-led conglomerate increased its Delta Air Lines stake by 12%, scooping up 7.13 million shares. The position was worth $5.37 billion at the end of the third quarter.\n\nDelta shares tumbled 11% over that period, as rising jet fuel prices due to the U.S.-Iran war pressured the airline industry. That marked the stock's worst quarterly performance since the first quarter of 2025, when it plunged 28%. Delta last month also cut its full-year earnings forecast , citing a surge in fuel costs.\n\nTo be sure, buying that dip has been a winning investment thus far. Delta is up 3.8% so far in the fourth quarter, while the S&P 500 has dropped 3.1%. Shares are also up nearly 15% over the past month.\n\nBerkshire also trimmed its holding in Bank of America by nearly 6%, selling more than $1.6 billion worth of stock.\n\nBofA was under pressure in the third quarter, falling more than 4%, as interest rates surged alongside stubbornly high inflation and expectations of tighter Federal Reserve monetary policy. At one point in September the 30-year Treasury bond yield surged above 5.6% to its highest level since 2002 .\n\nDespite the share sale, Bank of America remains a top Berkshire Hathaway holding, with the conglomerate's stake valued at $24.8 billion at the end of the third quarter.\n\nBerkshire also initiated a position in Bending Spoons and nearly doubled its stake in homebuilder Lennar in the latest quarter.", "source": "CNBC Finance", "pub_date_str": "17 Nov 2026, 03:52 AM IST", "pub_date_relative": "34m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Fixed Income", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Nvidia live updates: Interim CEO Kress prepares for Q3 earnings, with Huang reportedly planning comeback - Yahoo Finance", "full_content": "Nvidia live updates: Interim CEO Kress prepares for Q3 earnings, with Huang reportedly planning comeback Yahoo Finance Nvidia Earnings Are Sideshow as Huang\u2019s Ouster Looms Over Market Bloomberg.com Here's How the S&P 500 Has Moved the Day After Each of Nvidia's Last 12 Reports The Motley Fool Will Nvidia earnings steady the AI sell-off? Financial Times All the questions Nvidia should answer on Tuesday \u2014 but probably won\u2019t Yahoo Finance", "source": "Google News Business", "pub_date_str": "17 Nov 2026, 03:51 AM IST", "pub_date_relative": "35m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "U.S. crude oil declines to $85 a barrel on recovering Middle East exports", "full_content": "Oil prices are falling Monday as shipments through the Strait of Hormuz recover and tensions between Iran and the U.S remain at a stalemate.\n\nBrent crude fell 3.55% to $92.44 per barrel Monday while West Texas Intermediate crude futures settled down 3.58% to $85.39 a barrel.\n\nThe International Energy Agency said on Friday it expects global supply to exceed 1.7 million barrels a day in the fourth quarter of 2026, reversing its earlier forecast for a deficit as Middle East exports recover faster than global demand and even as shipping attacks continue.\n\nWTI Crude, YTD Meanwhile, Russia's crude oil production rose to 8.73 million barrels a day in October, a 210,000 barrel-a-day surge, according to the IEA.\n\nGoldman Sachs said in a Sunday note it expects Brent to average $88 a barrel in 2027 and fall to $78 by December 2027 as the market returns to a surplus.\n\nThe bank believes Middle East supply to rise above its 2025 average as producers use ship-to-ship transfers and add pipeline capacity.", "source": "CNBC Finance", "pub_date_str": "17 Nov 2026, 03:49 AM IST", "pub_date_relative": "38m ago", "cfa_topics": ["Derivatives", "Alternative Investments"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Berkshire Boosts Delta Stake to Almost 10% of Outstanding Shares", "full_content": "(Bloomberg) -- Berkshire Hathaway Inc. boosted its holding in Delta Air Lines Inc. and continued whittling its stake in Bank of America Corp in the third quarter.\n\nThe Omaha, Nebraska-based conglomerate bought more than 7 million shares of the airline, according to a filing Monday. Its stake, worth $5.4 billion as of Sept. 30, represents 9.8% of Delta\u2019s total shares. Berkshire started investing in the airline earlier in 2026 after years of navigating a complicated relationship with the the air travel industry.\n\nBerkshire also trimmed its holding in Bank of America to 6.5%, selling more than 27 million shares. A longtime holder of the bank\u2019s shares, Berkshire started selling it down in 2024 and has been paring the investment.\n\nBerkshire spent about $9.6 billion to buy back its own shares in the third quarter, its largest such payout. Despite the purchase, the firm\u2019s cash pile rose from the previous quarter, totaling $377.4 billion at the end of September. After deducting $20.5 billion in unsettled US treasury bill purchases, the firm\u2019s cash stood at about $357 billion.\n\nThe conglomerate sold a net $426 million in equities in the period, according to Berkshire\u2019s quarterly earnings report earlier this month.\n\nAfter years of relatively quiet deal activity under Chairman Emeritus Warren Buffett, who often complained of high market valuations, Chief Executive Officer Greg Abel has been cutting more checks than his predecessor. In his first year as CEO, he has started deploying the firm\u2019s giant cash pile in multibillion-dollar deals and pushed the firm into AI.\n\nAfter handing $10 billion to Google parent Alphabet Inc. to support the tech firm\u2019s AI efforts, the firm invested in Bending Spoons SpA, an Italian conglomerate that applies the new technology to established businesses.\n\nThe firm also added to its bet on homebuilder Lennar Corp. This year, Berkshire Hathaway completed its acquisition of Taylor Morrison Home Corp. in an all-cash deal worth about $6.8 billion.", "source": "LiveMint Markets", "pub_date_str": "17 Nov 2026, 03:48 AM IST", "pub_date_relative": "39m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Fixed Income", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "California sues OpenAI over Hugging Face, other AI model loss of control", "full_content": "California Attorney General Rob Bonta on Monday sued artificial intelligence giant OpenAI for allegedly endangering the public by developing advanced AI models without adequate safeguards and monitoring.\n\n\"OpenAI disregarded public safety, knowingly tested potentially dangerous AI models without proper oversight and safety measures, and misled consumers and the public,\" Bonta said at a press conference.\n\nBonta cited the \"infamous\" incident in July, where two OpenAI models broke out of a testing environment, gained unauthorized access to the open internet, and breached the internal systems of open-source developer platform Hugging Face .\n\nOpenAI said the models were trying to find information that they could use to cheat on an evaluation, and succeeded. The break-in at Hugging Face, which Nvidia acquired for roughly $13 billion in September. rattled industry researchers and prompted government officials to call for more stringent oversight of the AI industry.\n\nOn Monday, Bonta said that OpenAI later disclosed to his investigators that it was aware of 80 incidents \"involving loss of control and access to third-party networks and websites.\"\n\n\"But the company failed to provide the detailed information we requested to evaluate these incidents; this is concerning, and it puts the public at risk,\" he said.\n\nBonta's suit, filed in state Superior Court in San Francisco, alleges OpenAI violated California's Unfair Competition Law and accuses the company of being a public nuisance as defined by state law.\n\nThe attorney general told reporters he believed in AI's technological power, and the potential of AI models to \"achieve scientific breakthroughs, boost economic growth, guard against cyber attacks, and benefit all Californians.\"", "source": "CNBC Top News", "pub_date_str": "17 Nov 2026, 03:41 AM IST", "pub_date_relative": "46m ago", "cfa_topics": ["Economics", "Financial Statement Analysis"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Altimeter's Brad Gerstner aims to invest $5 billion in Anthropic IPO", "full_content": "Altimeter Capital is aiming to invest $5 billion in the Anthropic initial public offering, Brad Gerstner told CNBC's \"Halftime Report\" on Monday.\n\n\"I think this is a cornerstone compounder for a long time,\" Gerstner said, noting that his investment would be five times the amount he's ever put into an IPO. \"It's where the trade is going.\"\n\nAnthropic is expected to go on Nasdaq on Thursday in a milestone event for the artificial intelligence industry. It would be the first major AI lab to go public, beating OpenAI, which has said it's targeting an IPO next year.\n\nGerstner is investing alongside the leading chipmakers and cloud providers, many of which count on Anthropic as a customer.\n\nAdvanced Micro Devices , Broadcom , Google , Micron , Microsoft , Nvidia and Taiwan Semiconductor Manufacturing Co. are collectively investing $26 billion at the IPO price, which is currently expected at $70 to $78 a share.\n\nAnthropic is planning to offer 825 million shares at a valuation of about $1.4 trillion.\n\nGerstner is friends with former Nvidia CEO Jensen Huang , and sent a letter to the board of directors last week pushing them to take their time and run a full investigation on Huang's tenure before deciding who should run the company.\n\nGerstner said he has confidence in CFO and interim CEO Colette Kress , and noted that Huang had not discussed a comeback as CEO with him.", "source": "CNBC World Economy", "pub_date_str": "17 Nov 2026, 03:31 AM IST", "pub_date_relative": "56m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Nasdaq 100 sinks 2.7% in gloomy start to pivotal week for AI trade", "full_content": "US chip stocks fall as Nvidia sustains fresh bout of selling pressure", "source": "FT Markets", "pub_date_str": "17 Nov 2026, 03:28 AM IST", "pub_date_relative": "58m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Nvidia fallout: Commerce targets loophole for China's data center use", "full_content": "The Commerce Department on Monday moved to close a loophole that has let Chinese companies lease Nvidia 's advanced computing power from data centers in third countries, effectively circumventing controls on sensitive chip technology being exported to China .\n\nThe interim final rule from Commerce's Bureau of Industry and Security is the first U.S. policy response to the scandal that led Nvidia CEO Jensen Huang to resign last week after reports that he had an affair with an alleged Chinese spy who worked for Megaspeed, one of Nvidia's biggest Asian customers.\n\nThe rule was \"written by and at the direction of\" the Treasury Department and the White House National Security Council, BIS said in a press release.\n\nThe rule came after growing criticism of Commerce Secretary Howard Lutnick for not doing enough to prevent possible diversion of Nvidia's most advanced chips to China in violation of American export controls.\n\nTreasury Secretary Scott Bessent , in an interview on Friday with CNBC's \"Squawk Box,\" blamed the Commerce Department for not putting Singapore-based Megaspeed on its \"entity list,\" which would restrict certain exports to it.\n\nShare prices of Nvidia and other companies linked to the artificial intelligence trade fell Monday morning after the interim rule was announced, among them chipmakers Micron Technology , Intel and Advanced Micro Devices .\n\nThe rule is designed \"to prevent certain foreign actors from leveraging advanced computing power based on U.S. technology to threaten U.S. national security and foreign policy interests,\" according to the text of the rule.\n\nThe new restrictions \"will undermine the ability of companies headquartered in countries of concern from using\" advanced artificial intelligence semiconductors produced by U.S. companies to train advanced AI models, the rule says.", "source": "CNBC Top News", "pub_date_str": "17 Nov 2026, 03:21 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Now\u2019s the perfect time for networking. Here\u2019s how to send a cringe-free email.", "full_content": "Hiring for white-collar jobs usually dips in November and December, so try sending \u201ccold emails\u201d to your network instead.", "source": "MarketWatch Top Stories", "pub_date_str": "17 Nov 2026, 03:10 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Bitcoin slides to $62,000 following liquidation cascade, then rebounds slightly", "full_content": "Bitcoin fell to its lowest levels since August over the weekend as a wave of forced liquidations accelerated amid broader weakening in market liquidity and risk appetite.\n\nThe price of the flagship cryptocurrency fell as low as $62,000 late Saturday, according to Coin Metrics, and is coming off its sixth weekly decline in a row. By Monday evening, it had climbed back to the $65,000 level.\n\nBitcoin's ongoing weakness pushed its price below key technical support levels during the week, breaking below its 200-day moving average of about $73,000 and triggering the cascade of long liquidations, forcing traders to sell their assets at market price to settle their debts, pushing prices lower.\n\nOn Saturday night, exchanges tracked by CoinGlass saw more than $165 million in liquidated bitcoin long positions, following $629 million on Friday and nearly $700 million on Thursday.\n\nBitcoin just logged its sixth consecutive week of declines Bitcoin was also facing potential selling pressure ahead of Anthropic's anticipated initial public offering, with the listing drawing speculative capital away from riskier assets.\n\nOn Friday, the dollar index \u2014 which has an inverse relationship with bitcoin \u2014 reached its highest level since April 2025, following hotter-than-expected inflation earlier this week that increased expectations of further Fed tightening. That pushed Treasury yields and the dollar higher while pressuring both bitcoin and gold, despite their appeal as alternative stores of value in the longer term.\n\nThroughout November, bitcoin has been struggling from the combination of dollar strength, institutional selling, and ongoing leveraged bitcoin liquidations. The declines began in late October, as concerns over artificial intelligence valuations and spending fueled a broad tech sell-off.", "source": "CNBC World Economy", "pub_date_str": "17 Nov 2026, 02:56 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Corporate Issuers", "Fixed Income", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Kalshi plans to launch stock trading soon", "full_content": "Leading prediction market platform Kalshi will offer stock trading within the next few months, a person familiar with the matter told CNBC.\n\nThe platform's move to offer equity trading is the boldest so far in its ongoing push into traditional financial markets and comes amid an escalating fight by states and lawmakers against its sports trading business. Sports contracts continue to account for a large share of trading on the platform.\n\nIn September, the platform introduced perpetual futures tied to precious metals such as gold and silver after it had originally filed in July to offer beyond prediction market event contracts with the Commodity Futures Trading Commission , the federal regulator overseeing derivatives contracts. Perpetual futures are futures-style contracts that have no expiration date.\n\nKalshi also received approval to list perpetual futures tied to cryptocurrencies in late May.\n\nThe prediction market's stock trading offering was enabled by its purchase of broker-dealer FB Securities in July, the source said. FB Securities was founded in Delaware in 2024 and became registered with the Securities and Exchange Commission in December 2025. The broker did not respond to a request for comment.\n\nThe Wall Street Journal first reported that Kalshi plans to introduce stock trading.\n\nShares of Robinhood , which offers some prediction markets alongside equity trading, fell on Monday, though the stock was already lower amid a broader market sell-off. Robinhood closed down by 7.8%.\n\nDisclosure: CNBC and Kalshi have a commercial relationship that includes customer acquisition and a minority investment.", "source": "CNBC Top News", "pub_date_str": "17 Nov 2026, 02:53 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Derivatives", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "The best long-term personal loans of 2026", "full_content": "Most lenders give borrowers 12 to 60 months (one to five years) to repay their loan, but there are definitely options if you're looking for longer repayment terms. Securing a longer term usually results in smaller monthly payments, but it also means paying more in interest overall.\n\nWe've named the best lenders who offer repayment terms of at least 84 months, or seven years, looking at key factors like rates, fees, loan amounts and eligiblity requirements. Read more about how we made our selections in our methodology below.\n\nWho's this for? BHG Financial OKs loans of up to $250,000, more than twice what many other lenders approve. Terms range from 36 months all the way up to ten years, and it considers borrowers with fair credit (640 FICO Score).\n\nStandout benefits: BHG allows co-borrowers , which may help strengthen your application. While it does assess an origination fee, it maxes out at 5% of your loan total.\n\nBHG approves loans for as much as $250,000, more than twice the industry standard.\n\nThis non-bank lender is a standout for large loan amounts, flexible credit score requirements and generous repayment terms. But borrowers typically need income of at least $100,000 and you can't secure your loan with collateral.\n\nUpgrade offers repayment terms of up to seven years, longer than the five years most lenders offer.\n\nWe like that Upgrade considers borrowers with fair credit and allows co-borrowers, which can improve the odds of approval and receiving favorable rates. The maximum interest rate is on the high side, however.", "source": "CNBC Top News", "pub_date_str": "17 Nov 2026, 02:49 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Nasdaq falls more than 2%, extending slide to third day as Nvidia drags down AI trade", "full_content": "U.S. equities fell on Monday, dragged down by key technology stocks, as traders reacted to more developments surrounding Nvidia .\n\nThe Nasdaq Composite declined 2.49% to end at 24,509.76, while the S&P 500 dropped 1.92% to 7,416.59. Both indexes slid for the third straight session. The Dow Jones Industrial Average shed 739.38 points, or 1.41%, closing at 51,608.17.\n\nShares of Nvidia were down 4.1%. The pressure came as a source familiar with the matter told CNBC that the chipmaker's board of directors is not discussing bringing back Jensen Huang as its chief executive.\n\nAdding to the pressure, the Commerce Department on Monday moved to close a loophole that has let Chinese firms rent Nvidia's computing power located in other countries. Treasury Secretary Scott Bessent over the weekend also called for a \" dramatic shakeup \" at the company, urging its board to look outside the company for its next CEO.\n\n\"Two weeks ago investing in this name looked like a safe journey down a well-lit long hallway,\" said Mike Mussio, chief investment officer at FBB Capital Partners. Now, he added, \"there are several dark corners that people feel they need to peek around to glean additional information before moving forward.\"\n\n\"There is plenty to digest, and many jumpy investors seem unwilling to stick around for answers,\" Mussio continued.\n\nThe embattled chipmaker is preparing to report its third-quarter results after the bell on Tuesday. While analysts expect the company to post nearly 100% year-over-year earnings and revenue growth, investors will be more focused on how the company will move forward after Huang's exit as CEO.\n\nHuang last week resigned from his post after reports of multiple extramarital affairs, including one with an alleged Chinese spy. Nvidia shares dropped about 13%, marking their biggest weekly slide since April 2025.", "source": "CNBC Top News", "pub_date_str": "17 Nov 2026, 02:48 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Fixed Income"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Nvidia stock falls as investors price in fallout from Jensen Huang's resignation", "full_content": "Nvidia 's stock slid 4.12% Monday in the wake of CEO Jensen Huang 's resignation , leading a broader chipmaker selloff after the chip giant lost hundreds of billions in market cap last week.\n\nThe continued decline since Huang's resignation brought Nvidia's stock to its lowest close since July 1, 2025.\n\nHuang resigned from Nvidia, the company's board announced on Thursday, after mounting scrutiny following reports that he had a relationship with a woman believed to be a Chinese spy. Huang told employees he had an affair in an email on Nov. 8.\n\nIt was later reported that Huang had romantic relationships with two Nvidia employees. Nvidia did not immediately respond to CNBC's request for comment on Friday.\n\nNvidia stock. An online petition calling for Huang's reinstatement as Nvidia CEO has drawn more than 170,000 signatures , as prominent tech executives, including Elon Musk , rallied behind him. A source familiar with the matter told CNBC, however, that Nvidia's board of directors is not considering bringing back Huang.\n\nMeanwhile, U.S. lawmakers are pushing to launch comprehensive investigations into the scandal.\n\nHuang cofounded Nvidia in 1993 and led the company through its meteoric rise to becoming the world's most valuable company, with its AI chips underpinning the technology's boom.\n\nNvidia appointed longtime finance chief Colette Kress as interim CEO and said its board would consider both internal and external candidates in its search for a permanent successor.", "source": "CNBC World Economy", "pub_date_str": "17 Nov 2026, 02:42 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Fed Chairman Highlights Economic Uncertainty of A.I. Boom - The New York Times", "full_content": "Fed Chairman Highlights Economic Uncertainty of A.I. Boom The New York Times Fed Chairman Kevin Warsh stresses importance of AI to economy, but says it could \u2018disappoint\u2019 CNBC Warsh Says Fed Is Gaming Out How AI Could Reshape Economy WSJ Marc Andreessen says government regulation will save jobs from AI \u2014 at the cost of economic growth Yahoo Finance Fed's Warsh says emerging technologies to have 'significant impact,' but there are risks Reuters", "source": "Google News Business", "pub_date_str": "17 Nov 2026, 02:38 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Robert Pattinson cast as next James Bond", "full_content": "Robert Pattinson has been cast as the next James Bond in the upcoming film from director Denis Villeneuve. It will be the 26th James Bond film and the first since Amazon MGM took over the iconic franchise.\n\nPattinson will be the seventh actor to play the role. Monday's announcement \u2014 which came in part via an Instagram post \u2014 ends a long period of speculation about who would take over as \"007\" after Daniel Craig.\n\n\"James Bond is one of the most legendary characters in cinema, and to be entrusted with 007 is t
