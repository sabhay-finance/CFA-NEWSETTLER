    const allData = {"general": [{"title": "AstraZeneca's COPD drug scores two late-stage trial wins as full data boosts blockbuster hopes", "full_content": "AstraZeneca on Tuesday released full results from two successful late-stage trials on its experimental drug for chronic obstructive pulmonary disease, boosting hopes that it could generate multibillion-dollar sales for the company.\n\nThe biologic medicine, tozorakimab, is under priority review by the Food and Drug Administration, with U.S. approval expected in the first quarter of 2027. The drug, administered once every four weeks, helped reduce flare-ups in a broad range of people with the condition.\n\n\"We truly believe that a large population of COPD patients can benefit from this new medicine,\" Ruud Dobber, president of AstraZeneca's biopharmaceuticals business unit, said in an interview.\n\nThe treatment reduced moderate and severe COPD flare-ups in the primary population of former smokers by 29% and 34%, respectively, compared with a placebo on top of the current inhaled standard of care. The drug also reduced moderate and severe flare-ups in a larger overall population of current and former smokers by 30% and 29%, respectively, compared with the placebo group.\n\nThe detailed data reinforces hopes that the product could be a breakthrough treatment for COPD, a progressive lung disease that blocks airflow and makes breathing difficult. An estimated 16 million to 26 million Americans, both diagnosed and undiagnosed, have COPD, and the condition is the fifth-leading cause of death in the U.S., according to AstraZeneca.\n\nAstraZeneca recently raised its peak annual sales forecast for the drug to more than $5 billion, which could help the company reach its overall $80 billion revenue target by 2030. In an interview with CNBC, CEO Pascal Soriot said the drug has the opportunity to capture a broad group of patients.\n\n\"We believe it can be more than 5 billion, simply because the unmet need is huge,\" Soriot said. \"Patients are underdiagnosed; they need to be better diagnosed, and biologics in this class are totally underused. Maybe 10% of patients receive a biologic.", "source": "CNBC Top News", "pub_date_str": "08 Sep 2026, 07:06 PM IST", "pub_date_relative": "just now"}, {"title": "Qualcomm stock pops 6% on data center infrastructure deal with Amazon", "full_content": "Qualcomm shares jumped 6% on Tuesday after the company announced a data center infrastructure partnership with Amazon Web Services, a major win as the chipmaker tries to take on Nvidia in the artificial intelligence market.\n\nAccording to a press release , Qualcomm is working with Amazon \"across multiple generations of customized silicon\" to help build out AWS' AI infrastructure, specifically focused on inference.\n\n\"As AI workloads grow exponentially \u2014 driving unprecedented demand for compute, storage, networking and memory bandwidth, and energy-efficient infrastructure \u2014 the collaboration brings together Amazon's comprehensive, secure, and price-performant AI infrastructure with Qualcomm Technologies' leadership in power-efficient processing, silicon design and system-level integration,\" the statement said.\n\nQualcomm is known for making processors that power smartphones and other mobile devices. But the company made a big splash in June, when it revealed a central processing unit for data centers called Dragonfly C1000, and said that Meta would use it when it starts production in 2028.\n\nThe chipmaker said the new CPU was built for agentic AI and focuses on offering computing performance without using too much power. Qualcomm said at the time that it's targeting $15 billion in data center sales in fiscal 2029, and pointed to a roadmap for going after the market with several different products, including an AI chip and a product that will tie multiple chips together.\n\nIn teaming up with AWS, Qualcomm is getting a show of confidence from another hyperscaler. Like Meta, Amazon's annual capital expenditures on AI infrastructure is reaching into the hundreds of billions of dollars.\n\nNvidia has emerged as the world's most valuable company by dominating the market for graphics processing units (GPUs), which are needed for building sophisticated AI models and running the heftiest workloads.", "source": "CNBC World Economy", "pub_date_str": "08 Sep 2026, 07:06 PM IST", "pub_date_relative": "just now"}, {"title": "Dow drops 500 points to start shortened week as oil prices climb: Live updates", "full_content": "The Dow Jones Industrial Average dropped Tuesday to kick off a shortened week of trading, with Wall Street keeping tabs on the U.S.-Iran war as well as rising trade tensions between Canada and the U.S.\n\nThe Dow shed 511 points, or 0.7%. The S&P 500 was down by 0.2%, while the Nasdaq Composite dipped 0.1%. U.S. markets were closed Monday for the Labor Day holiday.\n\nStocks came under pressure as oil prices rose to six-week highs , rising for a third straight day, after Iran and the U.S. exchanged strikes over the weekend. Brent crude oil futures rose 2.3% to $99.22 per barrel. West Texas Intermediate futures climbed 3.3% to $94.54.\n\nCrude prices have surged in the past month as the U.S.-Iran war continues, putting upward pressure on Treasury yields as traders grow worried that elevated energy prices will drive inflation higher.\n\nThe benchmark 10-year Treasury note yield last week climbed to its highest level since November 2023, while the shorter-term 2-year note yield scaled to a January 2025 high.\n\n\"Brent crude is at a six-week high, with apparent moves toward a deal between Iran and Oman to manage the flow of some shipping through the Strait of Hormuz merely underlining Tehran's control of the waterway,\" Dan Coatsworth, head of markets at AJ Bell, said in a note on Tuesday morning. \"Investors will have a laser focus on US inflation data out later this week to see if the impact of rising energy prices is starting to feed into broader inflationary pressures.\"\n\n\"A run of central bank meetings over the coming weeks will test whether equity composure holds,\" said Ed Yardeni, president of Yardeni Research. \"Bond yields are also rising worldwide. The question is whether that reflects better-than-expected economic growth, higher-than-expected inflation, and/or looming fiscal debt crises.\"\n\nThe Fed is due to hold a monetary policy meeting next week.", "source": "CNBC Top News", "pub_date_str": "08 Sep 2026, 07:04 PM IST", "pub_date_relative": "2m ago"}, {"title": "Beneath the surface, the next stock-market leaders are getting ready to break out, says Morgan Stanley", "full_content": "Earnings estimates are starting to pick up for artificial-intelligence adopters \u2014 and their stocks are due to rise as well, argues Morgan Stanley.", "source": "MarketWatch Top Stories", "pub_date_str": "08 Sep 2026, 07:03 PM IST", "pub_date_relative": "4m ago"}, {"title": "Australia targets algorithmic social feeds as it looks to hit Big Tech harder", "full_content": "Australia plans to give social media users the ability to switch off algorithm-based feeds in proposed legislation, making the latest move by governments and regulators to rein in Big Tech this year.\n\nPrime Minister Anthony Albanese's government said Tuesday that it's proposing the \"My Feed, My Way\" initiative, which would force social media platforms to allow users over the age of 16 to either opt into having a feed that recommends personalized content by an algorithm or \"opt out,\" so they can only see content from friends and creators they choose to follow.\n\nThe legislation, which is being drafted and released Tuesday for targeted consultation, would require platforms to send notifications to new and existing users so they can choose their default feed. Social media companies that fail to comply could face penalties of up to 109.2 million Australian dollars ($79 million).\n\nThe measures, set to be introduced to the Parliament of Australia this year, will also require AI chatbots, online games and other digital services to take action to protect under-18s from addictive design features.\n\n\"This is not about giving government control. It's about giving people control. It's about putting choice back into the hands of Australians online,\" Albanese said at a press conference on Tuesday regarding the proposed law.\n\n\"This is sensible, pragmatic, practical reform. It gives users choice, and it will hold the big tech companies responsible for inaction,\" he added.\n\nSeveral social media platforms already let users separate content they see from friends and people they know, in some capacity. TikTok, for example, has a Friends tab that shows friends' posts alongside its primarily recommendation-driven feed.\n\nFacebook offers a friends-only feed, while Instagram provides Following and Favorites feeds. YouTube has a Subscriptions feed, and Snapchat separates friends' Stories from public discovery content.", "source": "CNBC World Economy", "pub_date_str": "08 Sep 2026, 07:02 PM IST", "pub_date_relative": "5m ago"}, {"title": "'Patients pay the tariff': Swiss pharma CEO warns of Trump's generic drug tariff threat", "full_content": "American patients would ultimately bear the cost of President Donald Trump 's threatened tariffs on generic drugs, the CEO of Swiss pharmaceutical company Sandoz told CNBC, warning that manufacturers could be forced to raise prices or stop supplying some medicines.\n\n\"Patients pay the tariff,\" Sandoz CEO Richard Saynor said in an interview with CNBC during its Capital Markets Day.\n\n\"Any business is not going to systematically continue to supply a product at a material loss,\" he said on Tuesday. \"So you either then have a choice of putting the price [up] or not supplying the product.\"\n\nTrump said in July that imported generic medicines could face tariffs of 100% from 2028, rising to as much as 200% a year later, as his administration seeks to encourage drugmakers to shift pharmaceutical manufacturing to the United States.\n\nGenerics are currently exempt from the administration's Section 232 pharmaceutical tariffs. CNBC has contacted the White House for comment.\n\nBrand-name drugmakers typically spend years developing costly new medicines that , once approved, benefit from exclusivity that allows them to sell those drugs without direct competition for a limited period of time. By contrast, generic drug manufacturers like Sandoz enter the market after patents expire and often compete on price, manufacturing efficiency and scale against other companies selling largely identical versions of the same medicine.\n\nGeneric medicines account for about 90% of prescriptions in the U.S., but a relatively small share of overall drug spending due to their lower prices.\n\nSaynor reiterated that around nine in 10 prescriptions dispensed in the U.S. are for generics and biosimilars, while much of the underlying drug substance is produced outside the country.", "source": "CNBC Top News", "pub_date_str": "08 Sep 2026, 07:01 PM IST", "pub_date_relative": "5m ago"}, {"title": "I\u2019m a single 58-year-old veteran with $1.5 million in assets and a VA pension. Can I afford to retire?", "full_content": "\u201cI expect to receive at least $9,000 per month before federal and California state taxes.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "08 Sep 2026, 07:00 PM IST", "pub_date_relative": "7m ago"}, {"title": "Pharma major Novartis falls 9% after three drug trial setbacks", "full_content": "Novartis shares tanked on Tuesday after the pharmaceutical giant said its del-desiran drug for muscle-wasting disorder failed in a late-stage trial.\n\nThe company's stock was last seen down 8.9%, as investors reacted to what was its third drug trial setback in a week. It put the shares on track for their worst trading day since March 2020.\n\nNovartis stock The del-desiran result comes just days after Novartis said its pelacarsen drug failed to reduce the risk of cardiovascular events in a late-stage trial, and a week after announcing it had paused eight clinical trials of an experimental cell therapy, rap-cel, after three patients died.\n\nNovartis said its global phase III HARBOR study, which had been testing del-desiran in patients with myotonic dystrophy type 1, failed to show that the drug significantly improved patients' ability to open their hands faster than a placebo.\n\n\"Novartis is evaluating the full HARBOR dataset and will engage with health authorities to determine the most appropriate development path for del-desiran,\" the company said in a news release.\n\nDel-desiran is one of three antibody oligonucleotide conjugate therapies that were added to Novartis's neuromuscular pipeline when it acquired Avidity Biosciences for around $12 billion last year.\n\n\"Developing therapies for a complex disease like [myotonic dystrophy type 1] remains challenging, and setbacks are part of scientific progress,\" Shreeram Aradhye, president of development and chief medical officer at Novartis, said in a statement Tuesday.\n\n\"As we continue to evaluate the full HARBOR dataset, we remain committed to identifying the most appropriate development path for the del-desiran program and advancing innovative approaches for people living with [myotonic dystrophy] and other serious neuromuscular diseases.\"", "source": "CNBC Top News", "pub_date_str": "08 Sep 2026, 06:56 PM IST", "pub_date_relative": "10m ago"}, {"title": "H.C. Wainwright downgrades Tscan stock rating on restructuring", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Sep 2026, 06:54 PM IST", "pub_date_relative": "12m ago"}, {"title": "JioBlackRock AMC eyes \u20b925,000 crore AUM by FY'27, launches balanced advantage fund", "full_content": "Kolkata, Sep 8 (PTI) JioBlackRock AMC announced the launch of the JioBlackRock Balanced Advantage Fund on Tuesday, stating that its assets under management (AUM) have crossed \u20b9 22,000 crore, up from nearly \u20b9 16,000 crore in March.\n\nChief Investment Officer Rishi Kohli said the company was confident of crossing \u20b9 25,000-crore AUM in the 2026-27 fiscal. Its first year of operations was 2025-26.\n\n\"We are already \u20b9 22,000 crore, as traction remains healthy. We have a lot of products in the pipeline, and the second-half of this year will be more exciting in terms of more launches,\" he told reporters here.\n\nJioBlackRock Balanced Advantage Fund is an open-ended dynamic asset allocation scheme, with the New Fund Offer ( NFO ) opening on September 11 and closing on September 25.\n\nThe fund seeks to generate long-term capital appreciation by investing in a dynamically managed portfolio of equity and debt instruments.\n\n\"We are aiming for an alpha of 3-4 per cent over the benchmark, assisted by proprietary BlackRock investment models and active fund management,\" Kohli said.\n\nThe scheme will combine a dynamic asset allocation framework, systematic equity portfolio construction and a disciplined fixed income strategy, and may use derivatives to manage market exposure and maintain equity-oriented taxation, the company said.\n\nKohli said the fund seeks to \"leverage diversified research inputs, systematic portfolio construction and risk management capabilities\" to build a portfolio that can evolve with changing market conditions.", "source": "LiveMint Money", "pub_date_str": "08 Sep 2026, 06:54 PM IST", "pub_date_relative": "12m ago"}, {"title": "Revenio Q2 2026 slides: Visionix lifts sales, margins sink", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Sep 2026, 06:53 PM IST", "pub_date_relative": "14m ago"}, {"title": "Why is Xerox stock rallying today?", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Sep 2026, 06:53 PM IST", "pub_date_relative": "14m ago"}, {"title": "Investing \u20b925,000 through SIP? Here's when you should increase it or start a new fund", "full_content": "Systematic Investment Plans (SIPs) allow investors to invest a fixed amount regularly and build wealth gradually through compounding. Instead of relying on a large lump-sum investment, SIPs help create a sizeable corpus over a longer period through disciplined investing.\n\nHowever, investors often face a dilemma when their income rises, or they have additional money available for investment: should they increase their existing SIP or start investing in another mutual fund? This question becomes particularly relevant for investors already investing a substantial amount, such as \u20b9 25,000 a month.\n\nThere are several circumstances in which increasing an existing SIP could make more sense than adding another fund to your portfolio. Investors can consider the following factors before deciding:\n\nHere's an illustration of how increasing an SIP can affect the eventual corpus.\n\nThe appropriate SIP amount depends on several factors, including your income, financial objectives, investment horizon and risk tolerance. Inflation should also be considered when determining how much you need to invest for your future goals.\n\nA fixed investment of \u20b9 25,000 per month can result in a significantly larger corpus over 20 or 30 years than over a 10-year investment period. Investors receiving salary increments or experiencing an increase in income can either start a new SIP or use a SIP top-up facility to increase their existing investment.\n\nIncreasing investments gradually as income rises can help investors benefit more from compounding over a longer period. However, the decision should ultimately be based on whether the existing fund continues to align with the investor's goals, risk profile, and overall portfolio strategy.\n\nFor about a decade, Livemint\u2014News Desk has been a credible source for authentic and timely news, and well-researched analysis on national news, business, personal finance, corporates, politics and geopolitics.", "source": "LiveMint Money", "pub_date_str": "08 Sep 2026, 06:52 PM IST", "pub_date_relative": "14m ago"}, {"title": "Why is Qualcomm stock surging today?", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Sep 2026, 06:52 PM IST", "pub_date_relative": "14m ago"}, {"title": "1200% rally in five years! Small cap multibagger stock under \u20b920 to be in focus on Wednesday; here's why", "full_content": "Hazoor Multi Projects , a small-cap stock with a market capitalisation of less than \u20b9 1,000 crore, is likely to attract investors' attention in Wednesday's session, September 9, after the company secured a work order from the National Highways Authority of India (NHAI).\n\nIn an exchange filing aftermarket hour on Tuesday, the company said it had received a new order for user-fee collection services.\n\nThe company said it had received a Letter of Award (LOA) dated September 7, 2026, from NHAI for a user-fee collection agency contract, awarded through a competitive bidding process via e-tender.\n\nThe contract covers the Pudhupatti fee plaza at Km 39.760 of the Salem\u2013Vayembadi section from Km 36.000 to Km 80.000 of NH-179A in Tamil Nadu. It also includes the upkeep and maintenance of adjacent toilet blocks, including the replenishment of consumable items.\n\nThe project is scheduled to be completed within 12 months from the date of commencement, while the order value stands at \u20b9 42 crore, according to the filing.\n\nThe company's shares have been under sustained selling pressure since hitting a fresh all-time high in September 2024, resulting in a significant erosion of shareholder wealth. From the peak of \u20b9 63.90, the stock has fallen to around \u20b9 20 apiece, translating into a 69% decline.\n\nAfter ending CY25 with a 33% decline, the selling pressure continued into the current year, with the stock falling another 40% so far in 2026. The stock has ended five of the last seven months in the red, with March recording the steepest monthly decline of 27%.\n\nThe prolonged weakness has also pushed the stock to its lowest level since December 2023, a level it touched last month.", "source": "LiveMint Markets", "pub_date_str": "08 Sep 2026, 06:50 PM IST", "pub_date_relative": "16m ago"}, {"title": "ASP Isotopes hosts capital markets day in London", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Sep 2026, 06:50 PM IST", "pub_date_relative": "16m ago"}, {"title": "Offerpad appoints Benjamin Graboske to board of directors", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Sep 2026, 06:50 PM IST", "pub_date_relative": "16m ago"}, {"title": "Thailand's Kasikornbank launches $800 million US dollar bond sale, term sheet shows", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Bonds \u203a Thailand's Kasikornbank launches $800 million US dollar bond sale, term sheet shows Geojit Financial Services Share Price SBFC Finance Share Price Religare Enterprises Share Price Fedbank Financial Services Share Price Mas Financial Services Share Price Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Thailand's Kasikornbank launches $800 million US dollar bond sale, term sheet shows SECTIONS Thailand's Kasikornbank launches $800 million US dollar bond sale, term sheet shows Reuters Last Updated: Sep 08, 2026, 06:50:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Kasikornbank in Thailand has initiated an impressive $800 million sale of U.S. dollar Tier 2 subordinated bonds. These bonds are designed to absorb potential losses, ensuring the bank's stability in challenging times. Launching at 173 basis points over U.S. Treasuries, the offering exceeded initial forecasts. With a maturity of 10 years and an early repayment option available after five years, the funds raised will support general corporate objectives.\n\nIndian bond traders are navigating uncertain waters as soaring oil prices weigh heavily on market sentiment. In response, the Reserve Bank of India is tightening liquidity to combat rising inflation. This strategic move intends to stabilize overnight rates and counterbalance the pressures of high crude costs. As the RBI adopts a careful approach, the possibility of interest rate hikes looms on the horizon.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "08 Sep 2026, 06:50 PM IST", "pub_date_relative": "16m ago"}, {"title": "StimCell Energetics hires Stonegate for capital raising", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Sep 2026, 06:50 PM IST", "pub_date_relative": "16m ago"}, {"title": "Earnings call transcript: Canaan posts weaker Q2 2026 revenue, shares fall premarket", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Sep 2026, 06:50 PM IST", "pub_date_relative": "16m ago"}], "cfa": [{"title": "AstraZeneca's COPD drug scores two late-stage trial wins as full data boosts blockbuster hopes", "full_content": "AstraZeneca on Tuesday released full results from two successful late-stage trials on its experimental drug for chronic obstructive pulmonary disease, boosting hopes that it could generate multibillion-dollar sales for the company.\n\nThe biologic medicine, tozorakimab, is under priority review by the Food and Drug Administration, with U.S. approval expected in the first quarter of 2027. The drug, administered once every four weeks, helped reduce flare-ups in a broad range of people with the condition.\n\n\"We truly believe that a large population of COPD patients can benefit from this new medicine,\" Ruud Dobber, president of AstraZeneca's biopharmaceuticals business unit, said in an interview.\n\nThe treatment reduced moderate and severe COPD flare-ups in the primary population of former smokers by 29% and 34%, respectively, compared with a placebo on top of the current inhaled standard of care. The drug also reduced moderate and severe flare-ups in a larger overall population of current and former smokers by 30% and 29%, respectively, compared with the placebo group.\n\nThe detailed data reinforces hopes that the product could be a breakthrough treatment for COPD, a progressive lung disease that blocks airflow and makes breathing difficult. An estimated 16 million to 26 million Americans, both diagnosed and undiagnosed, have COPD, and the condition is the fifth-leading cause of death in the U.S., according to AstraZeneca.\n\nAstraZeneca recently raised its peak annual sales forecast for the drug to more than $5 billion, which could help the company reach its overall $80 billion revenue target by 2030. In an interview with CNBC, CEO Pascal Soriot said the drug has the opportunity to capture a broad group of patients.\n\n\"We believe it can be more than 5 billion, simply because the unmet need is huge,\" Soriot said. \"Patients are underdiagnosed; they need to be better diagnosed, and biologics in this class are totally underused. Maybe 10% of patients receive a biologic.", "source": "CNBC Top News", "pub_date_str": "08 Sep 2026, 07:06 PM IST", "pub_date_relative": "just now", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Qualcomm stock pops 6% on data center infrastructure deal with Amazon", "full_content": "Qualcomm shares jumped 6% on Tuesday after the company announced a data center infrastructure partnership with Amazon Web Services, a major win as the chipmaker tries to take on Nvidia in the artificial intelligence market.\n\nAccording to a press release , Qualcomm is working with Amazon \"across multiple generations of customized silicon\" to help build out AWS' AI infrastructure, specifically focused on inference.\n\n\"As AI workloads grow exponentially \u2014 driving unprecedented demand for compute, storage, networking and memory bandwidth, and energy-efficient infrastructure \u2014 the collaboration brings together Amazon's comprehensive, secure, and price-performant AI infrastructure with Qualcomm Technologies' leadership in power-efficient processing, silicon design and system-level integration,\" the statement said.\n\nQualcomm is known for making processors that power smartphones and other mobile devices. But the company made a big splash in June, when it revealed a central processing unit for data centers called Dragonfly C1000, and said that Meta would use it when it starts production in 2028.\n\nThe chipmaker said the new CPU was built for agentic AI and focuses on offering computing performance without using too much power. Qualcomm said at the time that it's targeting $15 billion in data center sales in fiscal 2029, and pointed to a roadmap for going after the market with several different products, including an AI chip and a product that will tie multiple chips together.\n\nIn teaming up with AWS, Qualcomm is getting a show of confidence from another hyperscaler. Like Meta, Amazon's annual capital expenditures on AI infrastructure is reaching into the hundreds of billions of dollars.\n\nNvidia has emerged as the world's most valuable company by dominating the market for graphics processing units (GPUs), which are needed for building sophisticated AI models and running the heftiest workloads.", "source": "CNBC World Economy", "pub_date_str": "08 Sep 2026, 07:06 PM IST", "pub_date_relative": "just now", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Dow drops 500 points to start shortened week as oil prices climb: Live updates", "full_content": "The Dow Jones Industrial Average dropped Tuesday to kick off a shortened week of trading, with Wall Street keeping tabs on the U.S.-Iran war as well as rising trade tensions between Canada and the U.S.\n\nThe Dow shed 511 points, or 0.7%. The S&P 500 was down by 0.2%, while the Nasdaq Composite dipped 0.1%. U.S. markets were closed Monday for the Labor Day holiday.\n\nStocks came under pressure as oil prices rose to six-week highs , rising for a third straight day, after Iran and the U.S. exchanged strikes over the weekend. Brent crude oil futures rose 2.3% to $99.22 per barrel. West Texas Intermediate futures climbed 3.3% to $94.54.\n\nCrude prices have surged in the past month as the U.S.-Iran war continues, putting upward pressure on Treasury yields as traders grow worried that elevated energy prices will drive inflation higher.\n\nThe benchmark 10-year Treasury note yield last week climbed to its highest level since November 2023, while the shorter-term 2-year note yield scaled to a January 2025 high.\n\n\"Brent crude is at a six-week high, with apparent moves toward a deal between Iran and Oman to manage the flow of some shipping through the Strait of Hormuz merely underlining Tehran's control of the waterway,\" Dan Coatsworth, head of markets at AJ Bell, said in a note on Tuesday morning. \"Investors will have a laser focus on US inflation data out later this week to see if the impact of rising energy prices is starting to feed into broader inflationary pressures.\"\n\n\"A run of central bank meetings over the coming weeks will test whether equity composure holds,\" said Ed Yardeni, president of Yardeni Research. \"Bond yields are also rising worldwide. The question is whether that reflects better-than-expected economic growth, higher-than-expected inflation, and/or looming fiscal debt crises.\"\n\nThe Fed is due to hold a monetary policy meeting next week.", "source": "CNBC Top News", "pub_date_str": "08 Sep 2026, 07:04 PM IST", "pub_date_relative": "2m ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Beneath the surface, the next stock-market leaders are getting ready to break out, says Morgan Stanley", "full_content": "Earnings estimates are starting to pick up for artificial-intelligence adopters \u2014 and their stocks are due to rise as well, argues Morgan Stanley.", "source": "MarketWatch Top Stories", "pub_date_str": "08 Sep 2026, 07:03 PM IST", "pub_date_relative": "4m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "'Patients pay the tariff': Swiss pharma CEO warns of Trump's generic drug tariff threat", "full_content": "American patients would ultimately bear the cost of President Donald Trump 's threatened tariffs on generic drugs, the CEO of Swiss pharmaceutical company Sandoz told CNBC, warning that manufacturers could be forced to raise prices or stop supplying some medicines.\n\n\"Patients pay the tariff,\" Sandoz CEO Richard Saynor said in an interview with CNBC during its Capital Markets Day.\n\n\"Any business is not going to systematically continue to supply a product at a material loss,\" he said on Tuesday. \"So you either then have a choice of putting the price [up] or not supplying the product.\"\n\nTrump said in July that imported generic medicines could face tariffs of 100% from 2028, rising to as much as 200% a year later, as his administration seeks to encourage drugmakers to shift pharmaceutical manufacturing to the United States.\n\nGenerics are currently exempt from the administration's Section 232 pharmaceutical tariffs. CNBC has contacted the White House for comment.\n\nBrand-name drugmakers typically spend years developing costly new medicines that , once approved, benefit from exclusivity that allows them to sell those drugs without direct competition for a limited period of time. By contrast, generic drug manufacturers like Sandoz enter the market after patents expire and often compete on price, manufacturing efficiency and scale against other companies selling largely identical versions of the same medicine.\n\nGeneric medicines account for about 90% of prescriptions in the U.S., but a relatively small share of overall drug spending due to their lower prices.\n\nSaynor reiterated that around nine in 10 prescriptions dispensed in the U.S. are for generics and biosimilars, while much of the underlying drug substance is produced outside the country.", "source": "CNBC Top News", "pub_date_str": "08 Sep 2026, 07:01 PM IST", "pub_date_relative": "5m ago", "cfa_topics": ["Economics", "Financial Statement Analysis"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "I\u2019m a single 58-year-old veteran with $1.5 million in assets and a VA pension. Can I afford to retire?", "full_content": "\u201cI expect to receive at least $9,000 per month before federal and California state taxes.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "08 Sep 2026, 07:00 PM IST", "pub_date_relative": "7m ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "H.C. Wainwright downgrades Tscan stock rating on restructuring", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Sep 2026, 06:54 PM IST", "pub_date_relative": "12m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "JioBlackRock AMC eyes \u20b925,000 crore AUM by FY'27, launches balanced advantage fund", "full_content": "Kolkata, Sep 8 (PTI) JioBlackRock AMC announced the launch of the JioBlackRock Balanced Advantage Fund on Tuesday, stating that its assets under management (AUM) have crossed \u20b9 22,000 crore, up from nearly \u20b9 16,000 crore in March.\n\nChief Investment Officer Rishi Kohli said the company was confident of crossing \u20b9 25,000-crore AUM in the 2026-27 fiscal. Its first year of operations was 2025-26.\n\n\"We are already \u20b9 22,000 crore, as traction remains healthy. We have a lot of products in the pipeline, and the second-half of this year will be more exciting in terms of more launches,\" he told reporters here.\n\nJioBlackRock Balanced Advantage Fund is an open-ended dynamic asset allocation scheme, with the New Fund Offer ( NFO ) opening on September 11 and closing on September 25.\n\nThe fund seeks to generate long-term capital appreciation by investing in a dynamically managed portfolio of equity and debt instruments.\n\n\"We are aiming for an alpha of 3-4 per cent over the benchmark, assisted by proprietary BlackRock investment models and active fund management,\" Kohli said.\n\nThe scheme will combine a dynamic asset allocation framework, systematic equity portfolio construction and a disciplined fixed income strategy, and may use derivatives to manage market exposure and maintain equity-oriented taxation, the company said.\n\nKohli said the fund seeks to \"leverage diversified research inputs, systematic portfolio construction and risk management capabilities\" to build a portfolio that can evolve with changing market conditions.", "source": "LiveMint Money", "pub_date_str": "08 Sep 2026, 06:54 PM IST", "pub_date_relative": "12m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Fixed Income", "Derivatives", "Portfolio Management"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Investing \u20b925,000 through SIP? Here's when you should increase it or start a new fund", "full_content": " nThe prolonged weakness has also pushed the stock to its lowest level since December 2023, a level it touched last month.", "source": "LiveMint Markets", "pub_date_str": "08 Sep 2026, 06:50 PM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Offerpad appoints Benjamin Graboske to board of directors", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Sep 2026, 06:50 PM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Thailand's Kasikornbank launches $800 million US dollar bond sale, term sheet shows", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Bonds \u203a Thailand's Kasikornbank launches $800 million US dollar bond sale, term sheet shows Geojit Financial Services Share Price SBFC Finance Share Price Religare Enterprises Share Price Fedbank Financial Services Share Price Mas Financial Services Share Price Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Thailand's Kasikornbank launches $800 million US dollar bond sale, term sheet shows SECTIONS Thailand's Kasikornbank launches $800 million US dollar bond sale, term sheet shows Reuters Last Updated: Sep 08, 2026, 06:50:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Kasikornbank in Thailand has initiated an impressive $800 million sale of U.S. dollar Tier 2 subordinated bonds. These bonds are designed to absorb potential losses, ensuring the bank's stability in challenging times. Launching at 173 basis points over U.S. Treasuries, the offering exceeded initial forecasts. With a maturity of 10 years and an early repayment option available after five years, the funds raised will support general corporate objectives.\n\nIndian bond traders are navigating uncertain waters as soaring oil prices weigh heavily on market sentiment. In response, the Reserve Bank of India is tightening liquidity to combat rising inflation. This strategic move intends to stabilize overnight rates and counterbalance the pressures of high crude costs. As the RBI adopts a careful approach, the possibility of interest rate hikes looms on the horizon.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "08 Sep 2026, 06:50 PM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Earnings call transcript: Canaan posts weaker Q2 2026 revenue, shares fall premarket", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Sep 2026, 06:50 PM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Brent crude oil near $98 after Iran's Houthi allies attack multiple Saudi energy facilities", "full_content": "Oil prices rose Tuesday after Houthi militants allied with Iran attacked several energy facilities in Saudi Arabia, forcing a temporary halt to some operations.\n\nBrent crude futures, the international benchmark, rose nearly 1% to $97.85 a barrel by 9 a.m. E.T. U.S. West Texas Intermediate futures advanced 1.4% to $92.73 per barrel.\n\nThe Houthis targeted civilian and economic assets in the cities of Abha, Khamis Mushait, Jazan and Najran, according to the state-owned Saudi Press Agency . More than 70 civilians were injured in the attacks, the Saudi Press Agency said.\n\nThe attacks caused fires at several energy facilities resulting in temporary shutdowns, the kingdom's Energy Ministry said in a statement. Emergency services are working to contain fires at the sites and assess the extent of damage, the world's largest oil exporter added.\n\nRiyadh did not disclose what type of energy facilities were struck. A military spokesman for the Houthis said the group attacked Saudi Aramco facilities in southern areas with drones and ballistic missiles.\n\nBrent ExxonMobil and Chevron shares were each up nearly 1% in premarket trading early Tuesday.\n\nIt comes after the U.S. military struck three Iranian oil tankers on Saturday in retaliation for Iranian ballistic missile attacks on two Navy warships. The Iranian Foreign Ministry, in a statement on Saturday, denounced the attacks on commercial vessels as a \"war crime\" and an act of \"economic warfare.\"\n\n\"This appears to be a major escalation and tensions have once again ratcheted higher,\" said David Morrison, senior market analyst at Trade Nation , noting that U.S. Energy Secretary Chris Wright had said it may prove impossible to reach a deal with Iran to prevent it obtaining a nuclear weapon.", "source": "CNBC Top News", "pub_date_str": "08 Sep 2026, 06:47 PM IST", "pub_date_relative": "19m ago", "cfa_topics": ["Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Oracle Rallies 5% as Morgan Stanley Lifts Its Price Target, CoreWeave Advances 3%", "full_content": "Skip to navigation Skip to main content Skip to right column Oracle Rallies 5% as Morgan Stanley Lifts Its Price Target, CoreWeave Advances 3% David Moadel Tue, September 8, 2026 at 6:16 AM MST 6 min read ORCL SNOW MS CRWV ^GSPC Quick Read Morga d what it means for future home sales", "full_content": "A version of this article first appeared in the CNBC Property Play newsletter with Diana Olick. Property Play covers new and evolving opportunities for the real estate investor, from individuals to venture capitalists, private equity funds, family offices, institutional investors and large public companies. Sign up to receive future editions, straight to your inbox.\n\nPrices in the for-sale housing market are showing no signs of cooling off, causing more renters to stay on the buying sidelines. And as rents start to heat back up, too, more tenants are relocating to cheaper markets.\n\nBuffalo, New York; Chicago and Houston are seeing the biggest growth in out-of-town searches on Zillow , followed by New Orleans and Dallas, according to the real estate listing site. Among markets that have already seen significant in-migration, like Salt Lake City; Raleigh, North Carolina; Hartford, Connecticut; and Nashville, Tennessee; out-of-town searches now outnumber local searches, Zillow found.\n\nRental demand is typically a leading indicator of home sales.\n\n\"Renting is often how people try out a new community before committing. When we see a market with a growing share of rental searches coming from outside the metro, that tips us off to a developing pipeline,\" said Mischa Fisher, chief economist at Zillow, in a release. \"A year-over-year surge in out-of-town browsing in places like Buffalo and Chicago tells us a wave of newcomers may not be far behind.\"\n\nThe markets seeing the biggest renter interest also have lower home prices. The national median price of an existing home sold in July was $434,100, according to the National Association of Realtors.\n\nBuffalo, Chicago and Houston all have lower median prices, according to Realtor.com.\n\nRents had been easing over the past few years due to increased supply in most markets, but they are now back on the rise.", "source": "CNBC Top News", "pub_date_str": "08 Sep 2026, 06:44 PM IST", "pub_date_relative": "22m ago", "cfa_topics": ["Corporate Issuers", "Alternative Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Jim Cramer's top 10 things to watch in the stock market Tuesday", "full_content": "OpenAI's Astra model is generating a lot of buzz, and Intel shares are up almost 5% premarket.", "source": "CNBC Top News", "pub_date_str": "08 Sep 2026, 06:43 PM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Is Tradeweb Markets (TW) Set for a Rebound?", "full_content": "Skip to navigation Skip to main content Skip to right column Is Tradeweb Markets (TW) Set for a Rebound? Soumya Eswaran Tue, September 8, 2026 at 6:13 AM MST 3 min read TW Artisan Partners , an investment management company, released its second-quarter 2026 investor letter for the \"Artisan Mid Cap Fund\". The letter can be downloaded here . Global equities rebounded sharply in Q2 2026, recovering from March lows as resilient economic data, strong corporate earnings, and continued AI investment improved investor sentiment despite inflation concerns, delayed rate cuts, and geopolitical uncertainty. The portfolio generated strong absolute returns and outperformed the Russell Midcap\u00ae Growth Index, benefiting from semiconductor exposure within IT and strong stock selection in health care and consumer discretionary. Its Investor Class: ARTMX returned 17.86%, Advisor Class: APDMX returned 17.88%, and Institutional Class: APHMX returned 17.93% vs. a 14.55% gain for the index. Healthcare was the largest contributor, with biotech holdings driving gains, while consumer holdings also performed well. Software exposure, aerospace and defense holdings, and communication services positions weighed on relative performance. The fund continues to focus on identifying high-quality growth companies with durable secular trends and attractive valuation opportunities. Please check the fund's top five holdings for its best picks in 2026.\n\nIn its second-quarter 2026 investor letter, Artisan Mid Cap Fund highlighted Tradeweb Markets Inc. (NASDAQ: TW ). During the quarter the fund increased its exposure to Tradeweb Markets Inc. (NASDAQ:TW), a global financial technology company that builds and operates an electronic marketplace and trading platforms. On September 4, 2026, Tradeweb Markets Inc. (NASDAQ:TW) closed at $106.20 per share. Over the past month, Tradeweb Markets Inc. (NASDAQ:TW) returned 2.41% while, its shares lost 11.00% over the past 52 weeks. Tradeweb Markets Inc.", "source": "Yahoo Finance", "pub_date_str": "08 Sep 2026, 06:43 PM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Amazon and AT&T team up to challenge SpaceX\u2019s satellite dominance", "full_content": "A new partnership will make AT&T the first wireless company to leverage technology from the Amazon Leo satellite unit", "source": "MarketWatch Top Stories", "pub_date_str": "08 Sep 2026, 06:40 PM IST", "pub_date_relative": "27m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Zcash Price Eyes $2,292 as Biggest ZEC Short Doubles Down Despite $24M Loss", "full_content": "", "source": "Yahoo Finance", "pub_date_str": "08 Sep 2026, 06:37 PM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}], "updated_at": "08 Sep 2026, 07:07 PM IST", "total_stories": 348};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
