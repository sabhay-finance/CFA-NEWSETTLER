    const allData = {"general": [{"title": "Bharat Coking Coal share price jumps 7% today despite 19% fall in 2026 | Check target, stop loss", "full_content": "Bharat Coking Coal share price zoomed 7.23% in Wednesday's trading session after the company announced a price hike for raw coking coal on Tuesday.\n\nBharat Coking Coal shares opened at \u20b9 31.64 per share today on NSE, as compared to previous close of \u20b9 31.11 on Tuesday. The stock touched an intraday high of \u20b9 33.48 on 14 October.\n\nIn an exchange filing on Tuesday, Bharat Coking Coal said that the board has approved a price hike in the select grades of raw coking coal supplied to the non-regulated sector.\n\n\u201cWe wish to inform you that the Board of Directors of Bharat Coking Coal Limited, at its meeting held on 13th Oct, 2026, approved the Rationalisation of Basic Prices of certain grades of Raw Coking Coal for Non-Regulated Sector,\u201d the company said in the filing.\n\nIt further said that the price revision aims to correct price differences between various coal grades. It applies only to the non-regulated sector and covers Steel Grades I and II, Direct Feed, PCC Washery Grades W-II to W-VI, and HVMC Washery Grades W-I to W-VI. Basic prices have been increased by around 0.1% to 14%, depending on the grade.\n\nBharat Coking Coal shares have gained 2.43% over the past week, indicating a modest recovery in the near term. However, the stock has remained largely flat over the past month, declining 0.42%.\n\nThe broader trend remains weak, with the shares down 19% year-to-date, reflecting significant losses in 2026.\n\nAccording to Mahesh M Ojha, VP Research & Business Development at Kantilal Chhaganlal Securities, Bharat Coking Coal shares can be considered for a near-term upside, with a target price of \u20b9 35.50, followed by \u20b9 37 and \u20b9 38.50.", "source": "LiveMint Markets", "pub_date_str": "14 Oct 2026, 11:42 AM IST", "pub_date_relative": "5m ago"}, {"title": "Vedanta Power shares jump 13% today after a 5-day loss - Can a rebound in the stock sustain? Tech experts decode", "full_content": "Vedanta Power shares surged as much as 13% in intraday trade on the BSE on Wednesday, 14 October, looking set to snap their five-day losing streak. Vedanta Power share price opened at \u20b9 30.54 against its previous close of \u20b9 30.24 and jumped 13.3% to an intraday high of \u20b9 34.25. The sharp jump in the stock price followed a spurt of more than threefold in volume.\n\nOn a monthly scale, the stock is flat so far in October after a nearly 7% fall in the previous month. Over the last three months, the stock has declined 18%, compared to a 5% drop in the equity benchmark Sensex.\n\nVedanta Power shares hit their 52-week high of \u20b9 52.49 on 3 July and a 52-week low of \u20b9 29.92 on 13 October this year.\n\nMetals and mining major Vedanta demerged into Vedanta Aluminium, Vedanta Oil & Gas, Vedanta Power, Vedanta Iron & Steel, and Vedanta Limited this year, with a demerger record date of 1 May 2026.\n\nAccording to Aditya Thukral, founder and analyst at AT Research and Risk Managers, Vedanta Power has been in a downtrend with the formation of lower highs and lower lows. The stock has been falling in a corrective structure and looks incomplete as of now.\n\nThukral believes that there is a high possibility that the stock will experience resistance in the range of \u20b9 34 and \u20b9 36, and a fresh round of selling could be observed.\n\nHowever, Thukral added that based on the current formations, the stock has potential long-term bullish implications, and it could be bought on dips near the \u20b9 26 to \u20b9 28 range, which could be the range where the stock bottoms out.\n\n\"The stock is in a downtrend and moving in a corrective structure which looks incomplete. So, any bounce towards the resistance zone is an exit opportunity for now. Any sustained move above \u20b9 36 invalidates the view of an immediate fresh bottom in the stock,\" said Thukral.", "source": "LiveMint Markets", "pub_date_str": "14 Oct 2026, 11:40 AM IST", "pub_date_relative": "7m ago"}, {"title": "Keller Group sets medium-term targets at capital markets day", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Oct 2026, 11:32 AM IST", "pub_date_relative": "15m ago"}, {"title": "Oklo Inc. general counsel sells $12,627 in stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Oct 2026, 11:31 AM IST", "pub_date_relative": "16m ago"}, {"title": "Iran shifting tactics to step up attacks on shipping before US vote, officials say", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Oct 2026, 11:31 AM IST", "pub_date_relative": "16m ago"}, {"title": "UK finance minister Healey set to pay for budget measures without more borrowing, FT reports", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Oct 2026, 11:30 AM IST", "pub_date_relative": "17m ago"}, {"title": "China says it is willing to work with EU to boost stability of trade ties", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Oct 2026, 11:30 AM IST", "pub_date_relative": "17m ago"}, {"title": "How to save thousands on national highway tolls: What is NHAI's FASTag Annual Pass? Should you apply for it? Explained", "full_content": "Frequent highway journeys can add thousands of rupees to your toll bills. The National Highways Authority of India (NHAI) offers a FASTag Annual Pass for eligible motorists. It bundles toll crossings into one payment, helping regular highway users reduce travel costs.\n\nThe FASTag Annual Pass costs \u20b9 3,075 and covers up to 200 toll crossings at participating plazas. It remains valid for one year from activation or until those crossings are used. Whichever limit comes first ends the pass. Savings depend on how frequently you travel and the tolls you would otherwise pay.\n\nThe scheme covers private, non-commercial cars, jeeps and vans. Commercial vehicles, taxis and trucks cannot use it. Each pass is linked to one vehicle registration number and a specific FASTag. You cannot transfer it to another car.\n\nYou can use the pass at more than 1,150 designated highway and expressway fee plazas. These include participating toll plazas on National Highways and National Expressways across the country.\n\nState highways and independent municipal toll roads are outside its coverage. Charges there continue to come from your regular FASTag balance.\n\nThe pass works with your existing FASTag, so you don't need a new physical tag. It connects to the FASTag linked with your vehicle registration number. At an eligible plaza, the system recognises your active pass and raises the barrier. Instead of deducting the toll amount, it reduces your remaining trip balance.\n\nHow trips are counted depends on the toll system. At point-based plazas, each crossing counts as one trip. A return journey through the same plaza, therefore, requires two trips. Under closed tolling, one entry and exit together count as a single trip.\n\nOnce 200 trips are used, normal FASTag deductions resume automatically. The same happens when the pass reaches the end of its validity period. Frequent users can potentially save thousands compared with paying separate tolls or buying monthly passes.", "source": "LiveMint Money", "pub_date_str": "14 Oct 2026, 11:27 AM IST", "pub_date_relative": "20m ago"}, {"title": "India's inflation hits 5.54%: Onion prices up 108%, food inflation 7.74% | 10 numbers explained", "full_content": "Choose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "14 Oct 2026, 11:26 AM IST", "pub_date_relative": "21m ago"}, {"title": "ASML says it's getting order interest through 2030 as profit smashes expectations", "full_content": "ASML said Wednesday that some of its customers are expressing interest in placing orders for its critical semiconductor tools for 2029 and 2030 as the company reported third-quarter profit that beat expectations.\n\nThe comments will likely comfort investors who have been looking to assess the longer-term demand outlook for ASML's lithography machines.\n\n\"Our customers continue to increase their short- and medium-term equipment demand forecasts with us, driven primarily by their views on the size and duration of AI-related investments,\" CEO Christophe Fouquet said in a press release.\n\n\"In light of their demand visibility, some customers are expressing an interest in placing orders with us for 2029 and even 2030.\"\n\nASML is the only company in the world that produces extreme ultraviolet lithography machines, a key tool used by the likes of TSMC to make the world's most advanced semiconductors.\n\nInvestors closely watch the Dutch company's earnings for signs of AI-related chip demand.\n\nFouquet said current supply planned for 2027 and 2028 will not fully meet the demand of its customers. The company is \"investigating ways\" to increase capacity for 2028 beyond the 30% increase it had previously forecast.\n\nDuring the quarter, Samsung and TSMC, the world's two biggest chipmakers, committed to using ASML's High NA extreme ultraviolet (EUV) lithography machines. High NA EUV is ASML's next-generation tool, which analysts see as key to the Dutch firm's future growth.", "source": "CNBC World Economy", "pub_date_str": "14 Oct 2026, 11:26 AM IST", "pub_date_relative": "21m ago"}, {"title": "Stock futures are mixed as traders await consumer inflation report: Live updates", "full_content": "U.S. stock futures were up early Wednesday as the release of September's consumer inflation report loomed.\n\nS&P 500 futures were up 0.14%, while Nasdaq-100 futures were flat, and Dow Jones Industrial Average futures fell 0.35% higher.\n\nBank of America shares declined over 2% in extended trading after the firm was hit with more than $1.2 billion in federal penalties , with regulators saying the bank failed to report more than $5 billion in \"suspicious\" transactions.\n\nIn Asia, Australia's S&P/ASX 200 was down 0.62%. Japan's Nikkei 225 added 0.32%, while South Korea's Kospi rose 0.82%.\n\nA drift downward in chip stocks weighed on the major averages Tuesday, with the VanEck Semiconductor ETF (SMH) falling for a sixth straight session over growing fears of an AI spending bubble and rising anxieties around competition out of China.\n\nA swath of big banks posted strong quarterly results, but shares ended the day lower, with Goldman Sachs and Citigroup falling. The market's reaction suggested businesses have a higher bar to clear during the third-quarter earnings season \u2014 especially in tech where semiconductors are expected to be the largest contributor to year-over-year earnings growth.\n\nS&P 500 companies are expected to post a blended earnings growth rate of roughly 30%, while semiconductors and semiconductor equipment are set for growth of 130%, according to FactSet data.\n\n\"The business fundamentals are very strong. It's very hard to argue with the demand side of the story for chips,\" Marta Norton, chief investment strategist at Empower, told CNBC's \"Closing Bell: Overtime.\" \"I don't know if we necessarily question how good those business fundamentals are as much as we question how much valuation is left in the space.\"", "source": "CNBC Top News", "pub_date_str": "14 Oct 2026, 11:24 AM IST", "pub_date_relative": "23m ago"}, {"title": "IMF says Britain does not need to speed up fiscal consolidation", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Oct 2026, 11:24 AM IST", "pub_date_relative": "23m ago"}, {"title": "Neogen Chemicals share price jumps nearly 15% in 3 sessions | What's driving the rally, is more upside ahead?", "full_content": "Neogen Chemicals share price jumped over 8% on Wednesday, 14 October, extending its rally for a third consecutive session. The specialty chemicals stock has gained nearly 15% over the past three trading sessions, scaling fresh record highs amid strong buying interest and improving earnings momentum.\n\nAccording to market experts, the stock is witnessing a multi-session breakout, with momentum-driven buying pushing it to fresh all-time highs in the \u20b9 2,748\u2013 \u20b9 2,778 range. Trading volumes have also remained significantly above average, although experts have not identified any specific company announcement to explain the latest surge.\n\nThe rally gathered pace on Monday, 12 October, as the stock rose by around 6\u20137% on heavy volume. It continued on Tuesday, 13 October, when Neogen Chemicals touched a fresh intraday all-time and 52-week high of \u20b9 2,613, extending its upward momentum even as the broader market remained under pressure.\n\nAccording to experts, the stock's rally follows the company's report of record results for the June quarter. Neogen Chemicals posted net sales of \u20b9 250.29 crore, while net profit surged 138.4% year-on-year to \u20b9 17.11 crore. Its operating margin stood at 19.27%.\n\nThe stock is also trading above all its key moving averages, signalling a strong technical trend. The rebound in Indian specialty chemical stocks, coupled with improving earnings momentum following the strong quarterly performance, has further supported investor interest, according to experts.\n\nHowever, with the stock scaling record highs amid elevated volumes and no clearly identified company-specific trigger, investors will be watching whether the buying momentum sustains in the coming sessions.\n\nNeogen Chemicals shares have gained 15.08% over the past month and 26.74% in the last three months. The stock has risen 12.14% over the past week and 11.16% over the past two weeks, reflecting strong recent momentum.", "source": "LiveMint Markets", "pub_date_str": "14 Oct 2026, 11:18 AM IST", "pub_date_relative": "29m ago"}, {"title": "Reliance Jio IPO RHP filing likely today; latest GMP jumps to \u20b9219 - check expected share price band, size, valuation", "full_content": "Jio Platforms IPO latest update: The Reliance Industries-backed Jio Platforms IPO RHP filing is likely today. The Reliance Jio is likely to file its Red Herring Prospectus (RHP) at the capital market regulator SEBI any time today, multiple media reports. The most awaited Reliance-backed Jio platforms IPO is touted to be the biggest-ever Indian IPO with size of around \u20b9 30,000 crore. Jio Platforms IPO price band has already declared at \u20b9 1,065 to \u20b9 1,119 per equity share.\n\nAfter the outbreak of RHP filing by the Reliance-backed company at SEBI, the grey market has gone highly bullish on the upcoming IPO. According to the market observers, shares of the company are available in the grey market a premium of \u20b9 219. This means Jio Platforms IPO GMP today is \u20b9 219, which is \u20b9 10 higher from yesterday's GMP of \u20b9 210, say market observers.\n\nHowever, InvestorGain website is showing Jio Platforms IPO GMP today at \u20b9 224.\n\nSo, the grey market is hinting at a listing gain of nearly 20%.\n\nThe Reliance-backed company has already declared the Jio Platforms IPO price band at \u20b9 1,065 to \u20b9 1,119 per equity share.\n\nThe company aims to sell out 27 crore company shares, which means the exat Jio platforms IPO size is \u20b9 3,02,13,00,00,000 or \u20b9 30,213 crore ( \u20b9 1,119 x 27,00,00,000). The upcoming IPO is completely fresh in nature, which means the entire net proceeds will go into the balance sheet of Jio Platforms.\n\n(This is a developing story. Please refresh for more details)\n\nAsit Manohar has nearly two decades of experience in the mainstream media. In this period, he has served esteemed media organisations like NDTV Profit, The Economic Times, and Zee Business. He has been working at LiveMint Digital since April 2021. During these two decades of journey in mainstream media, Asit has mainly covered external affairs, markets and personal finance. However, his earliest beats include railways, SME, MSME, and politics (Congress beat).", "source": "LiveMint Markets", "pub_date_str": "14 Oct 2026, 11:16 AM IST", "pub_date_relative": "31m ago"}, {"title": "Zetwerk IPO: one-of-a-kind manufacturing platform with a profitability problem", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nZetwerk, a manufacturing and procurement platform, is raising \u20b9 5,012 crore through its market debut. The initial public offering (IPO), priced \u20b9 143\u2013151 per share, will open for subscription on 15 October and close on 19 October. Comprising a fresh issue of \u20b9 2,830 crore with the balance being an offer for sale, the company is seeking a valuation of about \u20b9 25,500 crore.\n\nCustomer metrics offer some evidence to this effect. Revenue from repeat customers accounted for over 80% of manufacturing business revenue in FY26, against an average of 84% since FY22. Median net revenue retention between FY23 and FY26 stood at 129%, indicating that spending by retained customers generally expanded. But for this moat to sustain, Zetwerk must continue to deliver reliable execution.\n\nZetwerk takes accountability for delivery and quality by third-party manufacturers. So, manufacturers\u2019 execution issues can affect Zetwerk\u2019s profitability. While fixed-price supplier contracts, customer price-adjustment clauses, commodity hedging, diversified supplier base, and selective in-house manufacturing can manage execution risks to an extent, they cannot eliminate counterparty risk or cost overruns.\n\nIn May 2026, analytics firm Crisil revised its outlook on Zetwerk's long-term ratings to negative from stable, while reaffirming the rating at Crisil A-. The outlook revision reflects high debt amid risks from the group\u2019s muted operating profitability (2.65% Ebitda margin), working-capital-intensive operations, limited operating track record across segments, and exposure to operational and counterparty risks.\n\nRevenue from continuing operations rose from \u20b9 12,364 crore in FY24 to \u20b9 15,913 crore in FY26. The trajectory, however, has been uneven, with revenue declining by 8.4% in FY25 before rebounding by 40.4% in FY26. Adjusted Ebitda has improved from \u20b9 97 crore in FY24 to \u20b9 421 crore in FY26.", "source": "LiveMint Markets", "pub_date_str": "14 Oct 2026, 11:14 AM IST", "pub_date_relative": "33m ago"}, {"title": "Railway employees may get productivity-linked bonus: How much can they expect this festive season?", "full_content": "The Union Cabinet, led by Prime Minister Narendra Modi , is expected to consider a proposal on the productivity-linked bonus (PLB) for railway employees on Wednesday, 14 October, raising hopes of an annual festive-season payout for eligible staff.\n\nThe existing bonus for eligible non-gazetted railway employees is \u20b9 17,951, calculated based on a wage ceiling of \u20b9 7,000 and 78 days' wages. The wage ceiling has remained unchanged since 2014-15, even as employee associations have demanded a revision to increase the payout, according to The Economic Times.\n\nHowever, the Cabinet\u2019s consideration of the proposal does not mean the bonus has been approved. The government has not announced the final payout or the details of its decision.\n\nUnder the existing formula, eligible non-gazetted railway employees receive a maximum bonus of \u20b9 17,951 for 78 days. The amount is based on a wage ceiling of \u20b9 7,000.\n\nThe Indian Railways Technical Supervisors\u2019 Association (IRTSA) has sought an increase in the ceiling to \u20b9 18,000 plus dearness allowance (DA) for Level-2 employees and above, with proportionate increases for higher pay levels.\n\nThe association has argued that the current ceiling needs to be revised, pointing to a minimum wage of \u20b9 21,000 for unskilled workers. Based on a wage ceiling of \u20b9 18,000, it has recommended raising the annual bonus to at least \u20b9 46,184. This is a demand by the association, not an approved payout.\n\nThe development comes days after a forged letter started circulating on social media that the government has approved a 78-day productivity-linked bonus for the 2025-26 financial year. The Railway Board has already warned employees against it\n\nThe letter, dated 6 October, claims that employees would receive \u20b9 41,149.", "source": "LiveMint Money", "pub_date_str": "14 Oct 2026, 11:14 AM IST", "pub_date_relative": "33m ago"}, {"title": "Aker BP production misses forecasts as realised gas prices jump", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Oct 2026, 11:13 AM IST", "pub_date_relative": "34m ago"}, {"title": "Galderma to buy US firm ZO Skin Health for $1.5 billion", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Oct 2026, 11:12 AM IST", "pub_date_relative": "35m ago"}, {"title": "ASML raises 2026 sales outlook on soaring AI demand, plans capacity expansion", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Oct 2026, 11:11 AM IST", "pub_date_relative": "36m ago"}, {"title": "Global Market: China stocks slip as AI selloff deepens, mixed inflation data weighs", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Global Market: China stocks slip as AI selloff deepens, mixed inflation data weighs Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market: China stocks slip as AI selloff deepens, mixed inflation data weighs SECTIONS Global Market: China stocks slip as AI selloff deepens, mixed inflation data weighs By Anupam Nagar , ETMarkets.com Last Updated: Oct 14, 2026, 11:11:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Chinese stoc \n\nASTS fell to $46.80 during the October 13 session, compared with the previous close of $51.46. The stock opened at $48.40 and traded between $46.24 and $48.72, highlighting the pressure on the shares. TradingKey also reported a steep decline in AST SpaceMobile stock, underscoring the weakness across the session.\n\nASTS traded below its 20-day, 50-day and 200-day exponential moving averages, signalling a weak technical trend. The daily relative strength index stood at 31.76, close to the commonly watched oversold threshold of 30, while the MACD remained below its signal line. These indicators suggested persistent selling pressure, although they did not rule out a short-term rebound.\n\nCompetition from SpaceX in direct-to-device satellite connectivity has emerged as a key concern for AST SpaceMobile investors. Reports cited a Piper Sandler downgrade, citing competitive pressure and potential constraints on satellite launch availability. The concerns have raised questions about AST SpaceMobile's ability to maintain its competitive advantage as rival satellite networks expand.\n\nBeyond chart weakness, investors are weighing whether AST SpaceMobile's valuation adequately reflects its assets, growth prospects and capital requirements.", "source": "Economic Times Markets", "pub_date_str": "14 Oct 2026, 11:08 AM IST", "pub_date_relative": "39m ago"}, {"title": "Vietnam says trade talks with US nearly completed; US officials more cautious", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Oct 2026, 11:06 AM IST", "pub_date_relative": "41m ago"}, {"title": "Sensex, Nifty muted a day after sharp rally, IT stocks extend gains. What lies ahead for Dalal Street?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Sensex, Nifty muted a day after sharp rally, IT stocks extend gains. What lies ahead f  MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a TCS, HCL Tech, Infosys shares surge up to 11% in 2 days; Nifty IT soars 2,000 points. More steam left for rally? Infosys Share Price Tata Consultancy Services Share Price HCL Technologies Share Price Wipro Share Price Tech Mahindra Share Price The Economic Times daily newspaper is available online now. Read Today's Paper TCS, HCL Tech, Infosys shares surge up to 11% in 2 days; Nifty IT soars 2,000 points. More steam left for rally? SECTIONS TCS, HCL Tech, Infosys shares surge up to 11% in 2 days; Nifty IT soars 2,000 points. More steam left for rally? By Debaroti Adhikary , ETMarkets.com Last Updated: Oct 14, 2026, 11:03:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Indian IT stocks rallied as concerns over AI-driven disruption eased, triggering an \u201canti-AI\u201d trade. The Nifty IT index surged over 2,000 points in two sessions to cross 30,000, its first move above the mark in nearly a month. HCL Tech gained nearly 11% in two days following its Q2 results, while TCS and Infosys rose 6\u201310%.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "14 Oct 2026, 11:03 AM IST", "pub_date_relative": "44m ago"}, {"title": "How to invest when your income doesn\u2019t arrive every month", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nThe first piece of advice almost every new investor receives is the same: start a systematic investment plan (SIP), pick a date and let it run. It is sound advice. But it also quietly assumes something many people do not have: a paycheque that arrives on the same day every month.\n\nFreelancers, consultants, traders and small business owners all deal with income that does not follow a fixed schedule. Some months are busy, others are lean, and a single large invoice can arrive a quarter late. For them, the standard monthly-SIP playbook is not just difficult to follow; it is built on a foundation they do not have.\n\nSo what should investing look like when income itself is irregular?\n\nThe mistake is to treat the SIP as the goal rather than a tool. For someone on a fixed salary, a missed SIP may be a lapse in discipline. For someone with uneven income, missing an SIP in a lean month is often unavoidable. The guilt of missing it is what can break the habit altogether.\n\nThe fix is to change the unit of planning. Instead of committing a fixed sum on a fixed date, decide how much you intend to invest over a full year and deploy it whenever money actually arrives. A strong month funds more; a weak month funds less or nothing, without any sense of failure.\n\nThe discipline shifts from \u201cinvest every month\u201d to \u201cinvest every rupee that is surplus, as it comes in\u201d. That is a target an irregular earner can realistically meet.\n\nThe harder problem with lumpy income is not how much to invest but where to put it each time a payment clears. Answering that question afresh every time invites second-guessing and, worse, the temptation to chase whatever has recently performed well.", "source": "LiveMint Money", "pub_date_str": "14 Oct 2026, 11:01 AM IST", "pub_date_relative": "46m ago"}, {"title": "Barclays plans India equity advisory return after a decade", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Barclays plans India equity advisory return after a decade The Economic Times daily newspaper is available online now. Read Today's Paper Barclays plans India equity advisory return after a decade SECTIONS Barclays plans India equity advisory return after a decade By Saikat Das & Rajesh Mascarenhas , Bloomberg Last Updated: Oct 14, 2026, 11:00:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Barclays plans to restart its equity capital markets business in India after nearly a decade, targeting the country\u2019s booming IPO market. Strong fundraising demand, robust retail investment flows and startup growth offer opportunities. With hundreds of companies awaiting IPO approvals, the bank aims to expand its equity advisory and underwriting services.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "14 Oct 2026, 11:00 AM IST", "pub_date_relative": "46m ago"}, {"title": "Wipro Q2 Results Preview: After TCS & HCL Tech, will this IT major exceed expectations?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a Earnings \u203a Wipro Q2 Results Preview: After TCS & HCL Tech, will this IT major exceed expectations? JM Financial Share Price Choice International Share Price IIFL Capital Services Share Price Anand Rathi Share & Stock Brokers Share Price SMC Global Securities Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Wipro Q2 Results Preview: After TCS & HCL Tech, will this IT major exceed expectations? SECTIONS Wipro Q2 Results Preview: After TCS & HCL Tech, will this IT major exceed expectations? By Akash Podishetti , ETMarkets.com Last Updated: Oct 14, 2026, 10:55:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Wipro is anticipated to report limited earnings growth for the September quarter due to various pressures. The focus will likely shift to guidance for the future quarter and profit margins. Analysts expect IT revenue to decline slightly despite inorganic contributions from recent acquisitions. The upcoming Q3 guidance is expected to reflect seasonality and economic conditions affecting discretionary spending. Management's commentary on deal activity will be crucial for understanding future performance.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "14 Oct 2026, 10:55 AM IST", "pub_date_relative": "52m ago"}, {"title": "Exclusive | Countdown begins for the mother of all IPOs: Jio likely to file RHP today for record Rs 30,000 crore issue", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a Exclusive | Countdown begins for the mother of all IPOs: Jio likely to file RHP today for record Rs 30,000 crore issue Reliance Industries Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Exclusive | Countdown begins for the mother of all IPOs: Jio likely to file RHP today for record Rs 30,000 crore issue SECTIONS Exclusive | Countdown begins for the mother of all IPOs: Jio likely to file RHP today for record Rs 30,000 crore issue By Nikhil Agarwal , ETMarkets.com Last Updated: Oct 14, 2026, 11:18:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Jio Platforms is set to file its RHP for a potential Rs 30,000-crore IPO, which could become India\u2019s largest-ever share sale. The Reliance Industries subsidiary is expected to open the issue for subscription from October 21 to 23. The IPO may value Jio at up to Rs 10.3 lakh crore, with a likely price band of Rs 1,065\u20131,119 per share. Existing investors are not expected to sell their stakes.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets .", "source": "Economic Times Markets", "pub_date_str": "14 Oct 2026, 10:54 AM IST", "pub_date_relative": "53m ago"}, {"title": "Polycab India shares fall 6% in two sessions. What\u2019s triggering the selloff?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Polycab India shares fall 6% in two sessions. What\u2019s triggering the selloff? Polycab India Share Price LG Electronics India Share Price Havells India Share Price R R Kabel Share Price Finolex Cables Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Polycab India shares fall 6% in two sessions. What\u2019s triggering the selloff? SECTIONS Polycab India shares fall 6% in two sessions. What\u2019s triggering the selloff? By Veer Sharma , ETMarkets.com Last Updated: Oct 14, 2026, 10:51:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Polycab India shares dropped 6% in two sessions after NSE announced its exclusion from the equity derivatives segment effective December 30. The move follows an insolvency petition admitted by NCLT over alleged dues of Rs 2.79 crore, which has since been stayed by NCLAT pending an October 26 hearing.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "14 Oct 2026, 10:51 AM IST", "pub_date_relative": "56m ago"}, {"title": "Judge extends block on Trump White House ban of MS NOW, CNN and Politico", "full_content": "A federal judge late Tuesday night indefinitely extended his block on the White House from enforcing a ban on three media outlets that President Donald Trump announced in mid-September.\n\nThe preliminary injunction by Judge Timothy Kelly replaces his temporary restraining order against Trump's ban of MS NOW , CNN and Politico from the White House complex as a lawsuit challenging the ban plays out.\n\n\"President Trump's own comments suggest that he intended the revocation of Plaintiffs' hard passes to alter their reporting on him,\" wrote Kelly, who was nominated by Trump for his seat in U.S. District Court in Washington.\n\nIn his written opinion, Kelly said the three outlets were likely to succeed on their claim in their pending lawsuit, which argues they were denied due process when Trump summarily barred them without giving them a chance to argue against it.\n\nThe judge cited two existing opinions by the U.S. Court of Appeals for the District of Columbia Circuit, which establish a due process right to journalists whose White House passes are targeted for revocation. Those appellate opinions are binding on federal District Court judges in D.C.\n\nThe judge also said, for the first time in this case, the outlets were likely to succeed on two First Amendment claims in their civil suit, which allege retaliation and viewpoint discrimination.\n\nKelly's order Tuesday is not a final ruling on the merits of the suit. And it does not compel the White House to restore access to the Oval Office and Air Force One to the outlets.\n\nKelly brushed aside the Department of Justice's claim that in addition to concerns about inaccurate news stories, Trump decided to revoke the outlets' access to the White House on national security grounds.", "source": "CNBC Top News", "pub_date_str": "14 Oct 2026, 10:49 AM IST", "pub_date_relative": "58m ago"}, {"title": "SS Retail shares: Up 95% from IPO price, newly listed stock soars over 19% today on strong results: Check Q1 highlights", "full_content": "SS Retail Q1 Results : Newly listed SS Retail shares surged over 19% on Wednesday, October 14, after the recently listed mobile retailer reported strong financial performance for the quarter ended June 2026 (Q1FY27).\n\nThe company's performance was supported by healthy same-store sales, higher average selling prices of mobile phones and continued expansion of its retail network.\n\nThe earnings announcement comes shortly after its stock market debut during which the shares listed at a substantial premium to their issue price. The stock has now climbed nearly 95% above its IPO price of \u20b9 424, reflecting the strong gains since listing.\n\nSS Retail shares jumped 19.5% to \u20b9 828.30 on Wednesday, October 14, following the company's earnings announcement. The stock has gained 11% over the past week. SS Retail shares touched a 52-week high of \u20b9 888 on September 24, 2026, after hitting a low of \u20b9 603 on September 23, the listing day.\n\nThe stock made a strong debut on September 23, 2026, listing at \u20b9 639.10 on the BSE, a premium of 50.73% over its issue price. On the NSE, the shares listed at \u20b9 624, representing a premium of 47.17%.\n\nThe company reported that its profit after tax (PAT) increased 61% to \u20b9 23.8 crore. Meanwhile, its consolidated revenue came in at \u20b9 789.7 crore for Q1FY27, marking a 59% year-on-year (YoY) increase. Earnings before interest, tax, depreciation and amortisation (EBITDA) also rose 51% YoY to \u20b9 45.4 crore.\n\nGross margin improved by 53 basis points YoY to 12.8%. However, the EBITDA margin declined by 31 basis points to 5.8%, despite growth in revenue and operating profit.\n\nCommenting on the company's first results announcement since its listing, Siddharth Shah, founder, chairman and managing director of SS Retail, said, \u201cOur first results announcement since listing marks an exciting new chapter for SS Retail, with record-high revenue, EBITDA and PAT, growing 59%, 51% and 61% YoY, respectively.", "source": "LiveMint Markets", "pub_date_str": "14 Oct 2026, 10:38 AM IST", "pub_date_relative": "1h ago"}, {"title": "PL Capital picks 8 largecap stocks with upside potential of up to 41%. See full list", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News PL Capital picks 8 largecap stocks with upside potential of up to 41%. See full list Written by Veer Sharma , ETMarkets.com | Oct 14, 2026, 10:41:16 AM IST 1 / 9 Solid Bets Following an eight-week losing streak in the Nifty, its first such run since 2001, domestic brokerage PL Capital remains cautious on the near-term market outlook. The brokerage does not expect a V-shaped recovery and does not rule out a further decline before the market enters a consolidation phase. However, the brokerage has picked 8 stocks as its top picks in its latest strategy note.\n\nBharat Electronics currently trades at a current market price of Rs 368 with a target price of Rs 452, representing an implied upside of 22.7%. The brokerage projects revenue growth of 16.8% in 2027E, and 15.1% in 2028E.\n\nBharti Airtel is priced at a current market price of Rs 1,805 with a target price of Rs 2,367, offering a potential upside of 31.1%. Revenue growth is expected to reach 15.8% in 2027E and 11% in 2028E.\n\nBritannia Industries trades at a current market price of Rs 4,825 against a target price of Rs 6,579, indicating an estimated upside of 36.4%. Its forecasted revenue growth steps up from 6.7% in 2026 to 10.7% in 2027E and 11.4% in 2028E.\n\nGE Vernova T&D India holds a current market price of Rs 4,194 with a target price of Rs 5,928, unlocking the highest upside in the group at 41.3%. Projected revenue growth is at 32.8% in 2027E, and 30.4% in 2028E.\n\nWith a target price of Rs 1,850, the private lender is yielding a 36.5% potential upside. Revenue expansion accelerates sequentially from 7.6% in 2026 to 17.7% in 2027E and 19.9% in 2028E, the brokerage said.\n\nKotak Mahindra Bank has target price of Rs 500, implying a 13.4% upside potential.", "source": "Economic Times Markets", "pub_date_str": "14 Oct 2026, 10:36 AM IST", "pub_date_relative": "1h ago"}, {"title": "HD Fire Protect IPO Booked 5.88x On Day 2; NII Demand Remains Strong", "full_content": "Fire protection equipment manufacturer HD Fire Protect Ltd. IPO opened on Tuesday, October 13 and will close on October 15. The company has fixed a price band of Rs 258-271 per share.", "source": "NDTV Profit", "pub_date_str": "14 Oct 2026, 10:35 AM IST", "pub_date_relative": "1h ago"}, {"title": "Canada Will Need 15,000,000 New Immigrants To Meet Growing Job Demand, Says Diplomat", "full_content": "Patnaik argued that Canada, with a population of roughly 42 million and a shrinking share of working-age people, faces a labour gap.", "source": "NDTV Profit", "pub_date_str": "14 Oct 2026, 10:34 AM IST", "pub_date_relative": "1h ago"}, {"title": "A Jigsaw Puzzle: Why Reliance Jio's IPO buzz isn\u2019t saving RIL stock from a painful year?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a A Jigsaw Puzzle: Why Reliance Jio's IPO buzz isn\u2019t saving RIL stock from a painful year? Reliance Industries Share Price The Economic Times daily newspaper is available online now. Read Today's Paper A Jigsaw Puzzle: Why Reliance Jio's IPO buzz isn\u2019t saving RIL stock from a painful year? SECTIONS A Jigsaw Puzzle: Why Reliance Jio's IPO buzz isn\u2019t saving RIL stock from a painful year? By Akash Podishetti , ETMarkets.com Last Updated: Oct 14, 2026, 10:33:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Reliance Industries is gearing up for the highly anticipated Jio Platforms IPO, which is expected to generate significant capital. Despite this, recent declines in RIL shares reveal a cautious mood among investors about potential future gains. Analysts note that although the IPO could establish Jio's market valuation, immediate advantages for RIL shareholders remain unclear, given concerns about refining margins, capital needs, and core business performance affecting sentiment.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "14 Oct 2026, 10:33 AM IST", "pub_date_relative": "1h ago"}, {"title": "IDBI Bank shares surge 13% today in a weak market - Q2 results expectations, share price trend", "full_content": "IDBI Bank shares surged as much as 13% in morning trade on the BSE on Wednesday, 14 October, defying weak stock market sentiment. IDBI Bank share price opened at \u20b9 84.32 against its previous close of \u20b9 82.92 and jumped as much as 12.90% to an intraday high of \u20b9 93.62, looking set to extend gains for the second consecutive session. On the other hand, equity benchmark Sensex declined by about 0.20% in morning trade.\n\nBanking stocks have been rising after it announced on 12 October that its board will meet on 17 October to consider and approve its unaudited financial results for the quarter and half-year ended 30 September 2026.\n\nMeanwhile, the stock is seeing strong buying interest, with a sharp surge in volume. On Wednesday, the stock's trading volume jumped more than 8-fold.\n\nAccording to experts, IDBI Bank's Q2FY27 results are expected to be healthy. On 3 October, the bank said its total business during Q2FY27 rose by 18% year-on-year (YoY) to \u20b9 6.3 lakh crore, while net advances rose by 18% YoY to \u20b9 2.7 lakh crore. Total deposits for the quarter stood at \u20b9 3.6 lakh crore, rising 17% YoY, while CASA deposits increased by 12% YoY to \u20b9 1.6 lakh crore.\n\nTo recall, IDBI Bank's Q1FY27 net profit rose by 9% QoQ and 5% YoY to \u20b9 2,115 crore. The bank saw net interest income (NII) grow 10% YoY to \u20b9 3,486 crore.\n\nTotal business increased 15% YoY to \u20b9 5,84,725 crore, while net deposits rose by 10% YoY to \u20b9 3,25,757 crore in Q1FY27. Net advances also grew by 22% YoY to \u20b9 2,58,968 crore.\n\nIDBI Bank's share price is up 22% over the last 6 months, compared with a 5% drop in the equity benchmark Sensex. However, year to date, the stock is down 13%, while the Sensex has lost 14%.\n\nIt hit a 52-week high of \u20b9 118.45 on 5 January after hitting a 52-week low of \u20b9 61.05 on 30 March this year.", "source": "LiveMint Markets", "pub_date_str": "14 Oct 2026, 10:31 AM IST", "pub_date_relative": "1h ago"}, {"title": "Transformers & Rectifiers shares surge over 18% as Q2 revenue jumps 61%, order inflows nearly double", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203
