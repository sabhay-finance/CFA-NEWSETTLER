    // This variable will be injected during the build process
    const allData = {"general": [{"title": "Diwali Muhurat Trading stock picks 2026: ICICI Bank, PVR Inox, Eternal among Geojit's 10 shares | Samvat 2083", "full_content": "KOTAKBANK TECHM INDHOTEL Dhanya Nagasundaram Published 8 Nov 2026, 12:54 PM IST Prefer Livemint on Google With Diwali 2026 today, market participants are prepared for Muhurat Trading, a special session that marks the start of the new Hindu financial year, Samvat 2083. Traditionally regarded as an auspicious time to begin new investments, the session coincides with Lakshmi Puja and carries symbolic significance for wealth and prosperity. Beyond the festive sentiment, investors are also keen to identify stocks with the potential to generate long-term returns in the year ahead.\n\nThe NSE and BSE will hold the Muhurat Trading session on Sunday, 8 November 2026, on the occasion of Diwali. Trading will take place from 2:20 PM to 3:30 PM IST.\n\nGeojit has identified 10 stocks across banking, infrastructure, information technology, auto components, hospitality, healthcare services and new-age businesses as its preferred picks for Samvat 2083.\n\nThe brokerage's Diwali portfolio combines established large-cap companies with select mid-cap opportunities, focusing on earnings visibility, strong balance sheets, sectoral growth prospects and reasonable valuations.\n\nGeojit acknowledged that Indian equities continue to face external headwinds, including elevated crude oil prices, geopolitical uncertainty, high US bond yields and persistent foreign investor outflows, which could keep near-term volatility elevated. However, it believes the recent market correction has improved the risk-reward for investors with a medium- to long-term investment horizon.\n\nThe brokerage's 10 stock picks are ICICI Bank , Larsen & Toubro (L&T), Kotak Mahindra Bank , Eternal, Tech Mahindra , Samvardhana Motherson, Indian Hotels Company , Sagility, PVR Inox and Cyient.", "source": "LiveMint Markets", "pub_date_str": "08 Nov 2026, 12:54 PM IST", "pub_date_relative": "9m ago"}, {"title": "Top 12 Diwali Muhurat Trading stock picks 2026: Up to 41% gain! Buy Jio Platforms, Adani Ports, 10 more by KC Securities", "full_content": "ICICIBANK SANSERA Asit Manohar Published 8 Nov 2026, 12:45 PM IST Prefer Livemint on Google Diwali 2026 | Muhurat Trading 2026 | Samvat 2026 stock picks: After witnessing a broad market rally, the Indian stock market is ready for the ceremonial special Muhurat Trading session 2026 on Sunday, 8 November 2026. The 70-minute special session will begin today at 2:20 PM and end at 3:30 PM. It should be noted that over the last decade, the Indian indices Sensex and Nifty 50 have ended higher for the last eight successive sessions. They ended in red only in 2016 and 2017.\n\nAccording to data available on HDFC Sky, from 2006 to 2025, the Nifty 50 index closed lower than its previous close on just five occasions: 2007, 2009, 2012, 2016, and 2017. The 50-stock index has been finishing higher since 2018. The 30-stock index Sensex finished lower on just four occasions: 2007, 2012, 2016, and 2017. So, in the last ten years, both Nifty 50 and Sensex have ended higher for the last eight straight sessions, and the key indices have ended higher on 8 out of 10 Muhurat Trading sessions in the last 10 years. This means the decadal strike rate for both the Sensex and the Nifty is 80%, and market observers expect it to rise to 90%.\n\nMahesh M Ojha, VP \u2014 Research and Business Development, believes the key indices, Sensex and Nifty, may end higher today as well, as global and domestic sentiments signal a gap-upduring the special Muhurat Trading session 2026.", "source": "LiveMint Markets", "pub_date_str": "08 Nov 2026, 12:45 PM IST", "pub_date_relative": "18m ago"}, {"title": "Wheat Hits Lowest Since June Ahead of Black Sea Peace Talks", "full_content": "(Bloomberg) -- Wheat futures touched the lowest since the end of June as traders anticipate next week\u2019s planned US-led talks with delegations from Ukraine and Russia.\n\nFutures fell as much as 2.4% to the lowest intraday price since June 30, before paring losses.\n\n\u201cScheduled Black Sea talks in Abu Dhabi mid-next week are pressuring prices and that is likely to continue for the next few sessions,\u201d the Hightower Report said in a note.\n\nThe conflict has damaged ports amid escalating strikes in the Black Sea region, and disrupted exports of wheat from Russia and Ukraine, two of the world\u2019s biggest suppliers of the grain. Recent talks with US envoys have raised hopes about making progress toward ending the war, which is now in its fifth year, but some remain skeptical about the prospect of peace between the two countries.\n\nAgResource, in a Friday note, said it \u201cfears that ending the Russian/Ukraine war will be complex and more difficult than what President Trump indicates.\u201d\n\nElsewhere, the US Department of Agriculture on Friday reported export sales of 136,000 tons of soybeans to China, which appears to be closing in on this year\u2019s target to purchase 25 million tons from the US. The Asian nation has agreed to secure that amount annually through 2028, and has made a steady stream of purchases toward the goal since early July.\n\n(Sign up to the Business of Food newsletter for a weekly catchup on how the world feeds itself in a changing economy and climate.)\n\nCatch all the Business News , Market News , Breaking News Events, JIO IPO Listing Today LIVE and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.", "source": "LiveMint Markets", "pub_date_str": "08 Nov 2026, 12:44 PM IST", "pub_date_relative": "19m ago"}, {"title": "Turkish villagers demand COP31 leaders see for themselves devastation caused by coal", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Nov 2026, 12:42 PM IST", "pub_date_relative": "21m ago"}, {"title": "Matthew Janzaruk, P&G SVP, sells $1.55 million in shares", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Nov 2026, 12:31 PM IST", "pub_date_relative": "32m ago"}, {"title": "How Mercedes suffered a \u20ac14bn EBIT drop", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Nov 2026, 12:24 PM IST", "pub_date_relative": "39m ago"}, {"title": "Muhurat Trading Stock Picks 2026 for Diwali Special Session: HDFC AMC, SBI, TechM, 3 others | Upside seen up to 35%", "full_content": "SBIN CEMPRO TECHM HDFCAMC A Ksheerasagar Published 8 Nov 2026, 12:23 PM IST Prefer Livemint on Google Domestic brokerage firm Anand Rathi has identified six stocks to consider buying during the Hindu calendar year Samvat 2083, projecting an average upside potential of around 36% based on its target prices.\n\nThe list includes HDFC Asset Management Company , Tech Mahindra , SBI, Cemindia Projects , Shilpa Medicare , and Indo-MIM. Of these, the brokerage expects four stocks to deliver gains of more than 20% over the next year.\n\nAnand Rathi expects HDFC Asset Management Company shares to reach \u20b9 2,800 over the next 12 months, implying an upside potential of 18% from the current market price of \u20b9 2,380.\n\nThe brokerage is positive on HDFC AMC's prospects, given its strong retail franchise, higher equity assets under management (AUM) mix, and healthy profitability. The company's expansion into alternative investment products offers additional growth opportunities.\n\nHowever, market-share trends, fund performance, and competitive intensity remain key factors to monitor.\n\nAnand Rathi has set a 12-month target price of \u20b9 2,065 for Tech Mahindra, indicating an upside potential of 16% from its current market price of \u20b9 1,787.\n\nThe brokerage believes Tech Mahindra's focus on improving margins is creating operating leverage and providing room for further margin expansion. Its AI-led initiatives under Project Helix are increasingly focused on embedding AI across service lines and developing industry-specific transformation offerings.\n\nThe company's focus on generative AI, autonomous networks, and network optimisation for telecom clients, along with initiatives such as Comviva and Helix to reduce customer churn and increase average revenue per user (ARPU), could support growth.", "source": "LiveMint Markets", "pub_date_str": "08 Nov 2026, 12:23 PM IST", "pub_date_relative": "40m ago"}, {"title": "\u20b910 lakh in PPF vs \u20b910 lakh in NSC: How do maturity periods, returns and income tax benefits compare for investors?", "full_content": "Are you looking to invest \u20b9 10 lakh in a government-backed savings scheme? Then you can consider several popular savings schemes such as the Public Provident Fund (PPF) and National Savings Certificate (NSC). Both these schemes can offer aspiring investors assured returns, peace of mind, and income tax benefits.\n\nStill, it should not be overlooked that these schemes cater to different objectives. They have distinct investment limits, maturity periods, interest payouts and withdrawal flexibility. For example, the PPF scheme does not permit an investor to invest \u20b9 10 lakh in a lump sum.\n\nFurthermore, the key difference between the NSC and PPF is that the PPF is designed for long-term wealth creation. Whereas the NSC scheme is a straightforward 5-year fixed-tenure savings instrument.\n\nLet us now look at the salient features of both schemes, including their maturity limits, returns, income tax benefits, and a host of other important aspects. This will help aspiring investors to make a prudent investment decision based on their current financial situation.\n\nAnother extremely vital question for aspiring investors concerns the investment limits of the schemes discussed above, i.e., the NSC and PPF. The complete details of the same are explained below:\n\nAs of today, PPF offers investors 7.1% annual interest. Still, investors cannot deposit \u20b9 10 lakh into this scheme in a single go. This is because the scheme's annual investment ceiling is \u20b9 1.5 lakh. That is why investments in PPF must be spread across multiple financial years if higher investments are targeted.\n\nFurthermore, the PPF account will mature after the completion of 15 years. This is calculated from the end of the financial year in which it was initially opened. Once the maturity period is over, investors can extend their PPF accounts in 5-year blocks, with or without further contributions.", "source": "LiveMint Money", "pub_date_str": "08 Nov 2026, 12:21 PM IST", "pub_date_relative": "42m ago"}, {"title": "First Interstate Bancsystem director sells $120,016 in FIBK stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Nov 2026, 12:16 PM IST", "pub_date_relative": "48m ago"}, {"title": "Muhurat Trading 2026 LIVE: Sensex & Nifty Today, Top Stocks To Watch, Market Highlights And Expert Views", "full_content": "Follow NDTV Profit's live coverage for the latest updates on the BSE Sensex and NSE Nifty and expert commentary on the outlook for Samvat 2083.", "source": "NDTV Profit", "pub_date_str": "08 Nov 2026, 12:00 PM IST", "pub_date_relative": "1h ago"}, {"title": "Muhurat Trading 2026 prediction today for Nifty 50, Sensex, Bank Nifty on Diwali 2026 special session", "full_content": "Muhurat Trading 2026 prediction today: The Indian stock market is all set to open for a special live Muhurat trading session on Sunday, November 8. The Nifty 50 has already lifted the market sentiment, even before Diwali as the benchmark reclaimed the 25,000 level for the first time in months.\n\nWith last week's spectacular performance by the benchmark indices, investors are wondering whether the festive cheer will extend to Dalal Street on Diwali or Nifty 50 and Sensex see some profit booking? Experts decode Nifty 50, Bank Nifty prediction for Diwali Muhurat trading session today.\n\nThe broader bias remains positive for Nifty 50 performance on Diwali special muhurat trading session, however, there is also chance of some profit booking or consolidation followed by sharp rally over the past week, according to Sumeet Bagadia, Executive Director at Choice Broking.\n\nThe broader bias remains positive, although some profit booking or consolidation may follow the sharp rally.\u201d\n\nDiwali Muhurat trading session often starts with buying trend followed by profit-booking triggered at the end of the session, highlighted Ganesh Dongre, AVP - Equity Research at Anand Rathi.\n\nInvestors can expect the benchmark indices to start on a bullish note with upside gap, however, they may end below their opening levels. However, there is also a strong possibility for Nifty and Sensex to end higher supported by positive sentiment.\n\n\u201cImmediate support for the Nifty 50 index is placed at 24,800\u201324,850, while resistance is seen around 25,130\u201325,200. RSI jumped to 78.55, indicating strong bullish momentum but also an overbought market condition. PCR at 1.30 reflects positive derivatives positioning,\u201d noted Sumeet Bagadia of Choice Broking.\n\nFor Bank Nifty, investors can closely watch the 57,500\u201357,800 range, with stronger resistance at 58,000\u201358,400 and support around 56,000\u201356,300, according to Hitesh Tailor, Technical Research Analyst at Choice Broking.", "source": "LiveMint Markets", "pub_date_str": "08 Nov 2026, 11:59 AM IST", "pub_date_relative": "1h ago"}, {"title": "Bought a New Car During Diwali? Five Hidden Expenses That Start After the First Payment", "full_content": "Bought a new car this Diwali? Beyond the down payment and EMI, plan for fuel, insurance renewals, servicing, parking, tolls and unexpected repairs to manage the true cost of ownership.", "source": "NDTV Profit", "pub_date_str": "08 Nov 2026, 11:55 AM IST", "pub_date_relative": "1h ago"}, {"title": "Former Tech Mahindra Executive Came Home For Diwali. A Parking Dispute Ended In His Murder", "full_content": "Dhankhar worked in Singapore as a senior vice-president at FPT Software. He had previously led Tech Mahindra's regional business in Asia-Pacific.", "source": "NDTV Profit", "pub_date_str": "08 Nov 2026, 11:44 AM IST", "pub_date_relative": "1h ago"}, {"title": "Ramayana: Part 1 Clips Leak Online; Makers Warn Of Legal Action", "full_content": "The makers of 'Ramayana: Part 1' have warned viewers not to record or share the film online, saying piracy could lead to legal action.", "source": "NDTV Profit", "pub_date_str": "08 Nov 2026, 11:40 AM IST", "pub_date_relative": "1h ago"}, {"title": "NTA Invites Applications For Observer Recruitment For CBT And Pen-and-Paper Exams", "full_content": "The National Testing Agency empanelment drive is open to serving and retired government officials, retired personnel and academic administrators.", "source": "NDTV Profit", "pub_date_str": "08 Nov 2026, 11:38 AM IST", "pub_date_relative": "1h ago"}, {"title": "Parents Gave You Money for a New Home This Diwali: How Should You Document the Transfer?", "full_content": "Parents gifting money for your new home this Diwali? Understand the documentation, tax exemptions, bank transfer records and costs to keep your property purchase financially hassle-free.", "source": "NDTV Profit", "pub_date_str": "08 Nov 2026, 11:32 AM IST", "pub_date_relative": "1h ago"}, {"title": "Diwali Muhurat Trading Stock Picks 2026 under \u20b9200: Start Samvat 2083 with Ashok Leyland, Swiggy, PNB | By Anand Rathi", "full_content": "SWIGGY Asit Manohar Updated 8 Nov 2026, 11:33 AM IST Prefer Livemint on Google Diwali 2026 | Muhurat Trading 2026 | Samvat 2083 stock picks: After witnessing a broad market rally, the Indian stock market is ready for the ceremonial special Muhurat Trading session 2026 on Sunday, 8 November 2026. The 70-minute special session will begin today at 2:20 PM and end at 3:30 PM. It should be noted that over the last decade, the Indian indices Sensex and Nifty 50 have ended higher for the last eight successive sessions. They ended in red only in 2016 and 2017.\n\nAccording to data available on HDFC Sky, from 2006 to 2025, the Nifty 50 index closed lower than its previous close on just five occasions: 2007, 2009, 2012, 2016, and 2017. The 50-stock index has been finishing higher since 2018. The 30-stock index Sensex finished lower on just four occasions: 2007, 2012, 2016, and 2017. So, in the last ten years, both Nifty 50 and Sensex have ended higher for the last eight straight sessions, and the key indices have ended higher on 8 out of 10 Muhurat Trading sessions in the last 10 years. This means the decadal strike rate for both the Sensex and the Nifty is 80%, and market observers expect it to rise to 90%.\n\nGanesh Dongre, AVP \u2014 Equity Research at Anand Rathi, believes the Indian stock market may see upside during Muhurat Trading 2026, as people buy on Diwali.\n\nSpeaking on the outlook of the Nifty 50 today, Ganesh Dongre of Anand Rathi said, \u201cFrom a technical perspective, the Nifty has staged a remarkable recovery from the 22,200\u201322,500 support zone and has comfortably moved above the earlier resistance levels of 23,200 and 24,700. The 24,700 level will now be an important level to watch in the coming week.", "source": "LiveMint Markets", "pub_date_str": "08 Nov 2026, 11:31 AM IST", "pub_date_relative": "1h ago"}, {"title": "Bitcoin holds below $76K as Binance EU closures add to crypto market pressure", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Nov 2026, 11:30 AM IST", "pub_date_relative": "1h ago"}, {"title": "Cathie Wood 'always feels better when the market is worried' \u2014 here's why", "full_content": "Ark Invest CEO Cathie Wood is shrugging off this week's market jitters, telling CNBC on Friday that concerns among investors actually reinforce her optimism that further gains lie ahead.\n\nU.S. equities sold off sharply on Thursday, reversing the initial rally seen in the wake of the midterm elections. AI-related stocks led the rout , sending the tech-heavy Nasdaq Composite into correction territory. On Friday, tech stocks staged a tentative recovery.\n\nMuch of the sell-off on Thursday was driven by concerns that a Democrat-led Congress would lead to a slowdown in data center construction. But concerns about artificial intelligence \u2013 particularly when it comes to capital expenditure, cash flow, debt and circular financing \u2013 have sparked multiple bouts of volatility over the course of this year.\n\nWood, whose firm manages various funds focused on tech and innovation, told CNBC there was a \"wall of worry\" pervading financial markets right now. But her decades of experience as an investor give her a somewhat unconventional view of the state of play.\n\n\"I experienced the tech and telecom bubble, and you know there really wasn't much worry about it,\" she said. \"It was the 80s and the 90s, and it was a bull market, and people were just assuming this would go to the moon, that is not how this [the AI trade] has evolved.\"\n\nShe explained that \"from the beginning,\" many investors have been concerned about how much firms are spending on AI development, how rapidly the spending is taking place, and how the hyperscalers have moved from extreme levels of positive free cash flow to negative free cash flow.\n\n\"So it's been unsettling the markets for quite some time,\" she said. \"I always feel better when the market is worried, because that tends to suggest a more durable bull market, and I don't think we've derailed this bull market.\"\n\nIn 2025, her flagship Ark Innovation ETF gained more than 35%, far outperforming the S&P 500's 16.4% rise and the Nasdaq Composite's 20.5% rally.", "source": "CNBC World Economy", "pub_date_str": "08 Nov 2026, 11:30 AM IST", "pub_date_relative": "1h ago"}, {"title": "AI is speeding up recruitment \u2014 and putting agency fees under pressure", "full_content": "Artificial intelligence is speeding up parts of hiring \u2014 and that could force recruitment agencies to rethink how they charge.\n\nDavid Berwick, owner of Adria Solutions, a recruitment agency based in Stockport, England, said that as AI takes on more of the work involved in making a placement, clients may question what their fees actually pay for. Agencies often charge employers a percentage of a successful candidate's first-year salary.\n\n\"If a recruitment agency is simply finding CVs and forwarding them to employers, AI is making that service increasingly difficult to justify,\" Berwick told CNBC. \"Businesses can already automate much of that work themselves.\"\n\nA 2026 survey of nearly 300 recruitment professionals in the U.K. and Ireland by U.S. recruitment software provider Bullhorn found that 37% said AI had made candidate screening between 26% and 50% faster. LinkedIn's 2025 UK Future of Recruiting report also found that talent acquisition professionals experimenting with or integrating generative AI saved an average of 18% of their working week.\n\nMajor recruitment firms are already putting that automation into practice. Swiss staffing company Adecco said in February that it had six AI recruitment agents operating in the U.K. and France, with the U.K. tools saving around 15% of the time spent on recruitment processes.\n\nThe U.K. was the first market in the Adecco Group to test these AI recruitment agents, according to Niki Turner-Harding, the company's senior vice president for the U.K. and Ireland. Across the group, AI has supported more than 2.5 million candidate interactions , around half outside normal working hours, the company said.\n\nBut although the agents support the recruitment process, they don't make hiring decisions, Turner-Harding said. That responsibility remains with a human recruiter, and candidates can always ask to speak to a person.\n\n\"People don't go into recruitment because they love admin.", "source": "CNBC World Economy", "pub_date_str": "08 Nov 2026, 11:30 AM IST", "pub_date_relative": "1h ago"}, {"title": "Delhi Pollution Alarm: AQI Hits 450, Schools Go Hybrid Up To Class 5. What Else Changes?", "full_content": "The Commission for Air Quality Management brought in Stage III curbs across Delhi-NCR on Friday, anticipating worse air over Diwali.", "source": "NDTV Profit", "pub_date_str": "08 Nov 2026, 11:28 AM IST", "pub_date_relative": "1h ago"}, {"title": "Stock Market Today On Samvat 2083: All You Need To Know Going Into Muhurat Trading Session", "full_content": "Indian markets open for a special Muhurat trading session on Sunday as Samvat 2083 begins. Here are the key global cues, market developments and trading timings to watch.", "source": "NDTV Profit", "pub_date_str": "08 Nov 2026, 11:25 AM IST", "pub_date_relative": "1h ago"}, {"title": "MCX Diwali Muhurat Trading schedule 2026, session wise time today: Special, Main, Client Code Modification Window timing", "full_content": "A Ksheerasagar Published 8 Nov 2026, 11:12 AM IST Prefer Livemint on Google The Multi Commodity Exchange of India (MCX), along with NSE and BSE will conduct its special Diwali Muhurat Trading session today, Sunday, November 8, marking the beginning of Samvat 2083. The commodity exchange will keep contracts across all commodities and indices open for the auspicious trading session, with a revised schedule compared with last year's timings.\n\nAccording to MCX's October 19 circular, the special session will begin at 2:05 pm and continue until 2:19 pm, followed by the main trading session from 2:20 pm to 3:30 pm.\n\nThe exchange has also specified a separate Client Code Modification (CCM) window, which will remain open from 2:20 pm to 3:45 pm, giving trading members an additional 15 minutes after the main market closes to make eligible client code corrections.\n\nThe special session on MCX will start at 2:05 pm and run until 2:19 pm, followed by the main trading window from 2:20 pm to 3:30 pm. The Client Code Modification window will operate alongside the main trading session and remain open until 3:45 pm.\n\nThis means trading members will have an additional 15 minutes after the market closes to make eligible client code corrections.\n\nMCX has pushed this year's Muhurat Trading schedule later compared with the previous Diwali session held on October 21, 2025. Last year, the special session ran from 1:30 pm to 1:44 pm, followed by the main trading window from 1:45 pm to 2:45 pm. The Client Code Modification window remained open until 3 pm.\n\nIn comparison, this year's special session begins 35 minutes later, while the main trading session has been extended by 10 minutes. The Client Code Modification cut-off has also been pushed back by 45 minutes, from 3 pm last year to 3:45 pm this year.\n\nOverall, the revised schedule provides a longer trading window and additional time for eligible client code modifications compared with last year's Muhurat session.", "source": "LiveMint Markets", "pub_date_str": "08 Nov 2026, 11:12 AM IST", "pub_date_relative": "1h ago"}, {"title": "MBBS Seats Vacant In Karnataka: Some Private Colleges Cut Fees By Up To 50%", "full_content": "Approximately 190 undergraduate management quota seats remain vacant post the regular admission process, which has led colleges to reduce fees", "source": "NDTV Profit", "pub_date_str": "08 Nov 2026, 11:03 AM IST", "pub_date_relative": "2h ago"}, {"title": "Diwali turned lucky for these 8 stocks! Investors' wealth more than doubled, returns soar up to 191%", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News Diwali turned lucky for these 8 stocks! Investors' wealth more than doubled, returns soar up to 191% Authored by Kumar Gaurav , ETMarkets.com | Nov 08, 2026, 11:27:34 AM IST 1 / 9 Wealth Creators A select group of 8 BSE 500 stocks delivered exceptional returns since Diwali 2025, more than doubling investors' wealth with gains of up to 191%, even as the Nifty 50 declined nearly 3%. According to ACE Equities data, 190 stocks from the index posted positive returns during the period, but only eight managed to clock gains exceeding 100%.\n\nAditya Infotech led the list of top-performing BSE 500 stocks, delivering an impressive return of 191.39% since Diwali 2025, according to ACE Equities data.\n\nHFCL followed closely, emerging as the second-best performer among the eight stocks, with a gain of 186.53% since Diwali 2025, as per ACE Equities data.\n\nWelspun Corp secured the third position among the eight wealth creators, with its shares surging 180.22% since Diwali 2025, according to ACE Equities data.\n\nLaurus Labs also featured among the biggest outperformers, delivering a return of 153.83% since Diwali 2025, as per ACE Equities data.\n\nAther Energy secured a place among the top wealth creators, with its shares advancing 132.19% since Diwali 2025, according to ACE Equities data.\n\nAcutaas Chemicals delivered a return of 110.79% since Diwali 2025, making it one of the eight BSE 500 stocks to more than double investors' wealth, as per ACE Equities data.\n\nWelspun Living recorded a gain of 107.23% since Diwali 2025, placing it among the select BSE 500 companies that delivered triple-digit returns, according to ACE Equities data.", "source": "Economic Times Markets", "pub_date_str": "08 Nov 2026, 10:58 AM IST", "pub_date_relative": "2h ago"}, {"title": "Muhurat Trading 2026 time today session wise: Block Deal, Pre-Open, Normal Market, Closing, Post-Closing; significance", "full_content": "Muhurat trading 2026 time today session wise: Diwali is here and the special live trading session for NSE and BSE is all set to begin in just a few hours. The Nifty 50 is likely to build on gains during last week\u2019s spectacular performance, according to experts.\n\nFor investors who are closely tracking the Diwali Muhurat trading session, here are all the details to know about the session-wise timing of Muhurat trading session today.\n\nThe special Diwali Muhurat trading session will start at 2:05 pm and conclude at 3:30 pm in the equities segment.\n\nPrior to the beginning of the live trading sesion, there will be block deal session between 1:50 pm and 2:05 pm.\n\nThe pre-open session, which happens in every normal trading session, will start at 2:05 pm and end at 2:10 pm in the special live trading session. The pre-market session will include order entry, modification and cancellation for both limit and market orders.\n\nIt will be followed by preopen (order matching & trade confirmation period) between 2:15 pm and 2:17 pm. Next is the pre-open buffer period between 2:17 pm -2:20 pm.\n\nThe block deal session and pre-open session will be followed by the main Muhurat trading session between 2:20 pm and 3:15 pm. The transition from closing trading session (CTS) to CAS will be from 3:15 pm to 3:20 pm.\n\nThe closing auction session (CAS) will be held between 3:20 pm and 3:30 pm on Friday. First five minutes of CAS will include order entry, modification and cancellation for both limit and market orders.", "source": "LiveMint Markets", "pub_date_str": "08 Nov 2026, 10:57 AM IST", "pub_date_relative": "2h ago"}, {"title": "Muhurat Trading 2026 Live Updates: Diwali Muhurat Trading 2026; check NSE, BSE and MCX timings, market outlook and key details", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Muhurat Trading 2026 Live Updates: Diwali Muhurat Trading 2026; check NSE, BSE and MCX timings, market outlook and key details Powered By LIVE BLOG Muhurat Trading 2026 Live Updates: Diwali Muhurat Trading 2026; check NSE, BSE and MCX timings, market outlook and key details 08 Nov 2026 | 12:56:17 PM IST Synopsis Indian stock and commodity markets hold a special Muhurat trading session on Sunday, November 8, marking the start of Samvat 2083. NSE and BSE conduct equity trading from 2:20 pm to 3:30 pm, while MCX follows the same main trading window.\n\n- Ravi Singh, Chief Research Officer at Master Capital Service\n\nComments are moderated and will be allowed if they are about the topic and not abusive.\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Markets", "pub_date_str": "08 Nov 2026, 10:55 AM IST", "pub_date_relative": "2h ago"}, {"title": "China energy investment to hit $940 billion in 2026 as grid spending rises", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Nov 2026, 10:53 AM IST", "pub_date_relative": "2h ago"}, {"title": "Aadarsha Kutumbam Box Office Collection Day 9: Venkatesh Film Sees 34.8% Growth, Crosses Rs 50 Crore India Gross", "full_content": "Venkatesh leads 'Aadarsha Kutumbam House No: 47', with Srinidhi Shetty, Nara Rohith, Nivetha Pethuraj, Vennela Kishore, Satya Akkala, Rao Ramesh and Brahmaji in key roles.", "source": "NDTV Profit", "pub_date_str": "08 Nov 2026, 10:49 AM IST", "pub_date_relative": "2h ago"}, {"title": "Gold, silver prices today, 8 Nov: Check Diwali 2026 retail rate of 24K, 22K gold, 999 silver in Delhi, Mumbai, Bangalore", "full_content": "Diwali 2026 Gold, Silver rates today, 8 November: Price of the yellow metal slipped on stronger-than-expected United States nonfarm payroll data, which boosted speculation that the Federal Reserve will raise interest rates to combat inflation, Bloomberg reported.\n\nGold bullion slipped as much as 1.5% toward $4,020 an ounce after the report as traders took the war in Middle East and AI stock wipeout into consideration, the report added. Spot gold fell 0.6% to $4,063.47 an ounce, while silver rose 0.2% to $51.87.\n\nThe latest Commodity Futures Trading Commission data showed that money managers have slashed their bullish gold bets to the lowest since June in the week ending November 3, it added. They also cut bullish wagers in silver to the lowest in almost three years, the data showed.\n\nAt the time of writing, gold bullion was trading at \u20b9 1,42,880 per 10 grams, while Silver was at \u20b9 1,85,640 per kg, data on the bullion website showed.\n\nHere are gold and silver rates in key Indian cities on Sunday, 8 November, Diwali 2026. Check the price of 18K, 22K and 24K gold and 999 Fine silver in Ahmedabad, Bengaluru, Chennai, Coimbatore, Delhi, Hyderabad, Kolkata, and Mumbai today as follows:\n\nThe gold price in Mumbai today, 8 November, was in line with the overall gold rate in India. The 24-karat gold price in Mumbai was \u20b9 1,42,620 per 10 grams. Meanwhile, the price of 22-karat gold in Mumbai was \u20b9 1,30,735 per 10 grams. On the other hand, the 18-karat gold rate in Mumbai was \u20b9 1,06,965 per 10 grams.\n\nThe silver price in Mumbai today, 8 November, was in line with the overall silver rates in India. The price of Silver 999 Fine in Mumbai was \u20b9 1,85,300 per kg.\n\nThe gold price in Delhi reflected the overall gold rates across India on 8 November. The 24-karat gold price in Delhi was \u20b9 1,42,370 per 10 grams. Meanwhile, the price of 22-karat gold in the national capital was \u20b9 1,30,506 per 10 grams, while the rate of 18-karat gold was \u20b9 1,06,778 per 10 grams.", "source": "LiveMint Money", "pub_date_str": "08 Nov 2026, 10:47 AM IST", "pub_date_relative": "2h ago"}, {"title": "Farmer wins \u20b918.24 lakh land valuation tax dispute: How ITAT Surat relied on DVO report to grant relief", "full_content": "When an individual purchases land below its stamp duty value , this can trigger an income tax notice. Still, the difference is not necessarily taxable if the buyer is able to clearly establish that the government valuation exceeds the property\u2019s actual market value.\n\nThis aspect has been touched upon in quite detail in a recent Income Tax Appellate Tribunal (ITAT) case in Surat. A case that underlines and explains how a Departmental Valuation Officer (DVO) report can help buyers challenge such demands and have them resolved legally.\n\nIn a decision on 28 October 2026, ITAT Surat granted relief to a farmer named Desai, who had faced a taxation dispute over agricultural land purchased in Ratnagiri, Maharashtra.\n\nAs per the details of the case, Desai and another co-owner purchased the land for \u20b9 14.08 lakh. Still, the stamp duty authorities valued it at \u20b9 50.56 lakh, thus creating a difference of \u20b9 36.48 lakh.\n\nThe tax authorities subsequently treated 50% of this as Desai\u2019s share, thus amounting to \u20b9 18.24 lakh approximately, as income from other sources under Section 56(2)(vii)(b) of the Income Tax Act, 1961.\n\nDue to these developments, the Assessing Officer (AO) added \u20b9 18.24 lakh to Desai\u2019s taxable income, arguing that the purchase price was found to be lower than the stamp duty value. Representing Desai, CA Arjan Vidhani challenged the addition, arguing that the AO had not referred to the property\u2019s valuation as presented by the department's own DVO.\n\nSubsequently, the matter was referred for valuation and reanalysis of basic facts and core checks. The DVO assessed the land at \u20b9 14.08 lakh. However, his appeal was still dismissed on technical grounds due to a delay, without examining the valuation report on merits.\n\nITAT Surat held that the appellate authority cannot simply disregard the DVO\u2019s findings after referring the matter for valuation. It instructed the AO to carefully consider the report and grant appropriate relief.", "source": "LiveMint Money", "pub_date_str": "08 Nov 2026, 10:46 AM IST", "pub_date_relative": "2h ago"}, {"title": "World Bank's Gold Forecast For 2028 Is Almost Exactly Today's Price", "full_content": "The World Bank expects gold to keep sliding for two more years. But after this year's sell-off, the price it sees in 2028 is barely below where gold trades now.", "source": "NDTV Profit", "pub_date_str": "08 Nov 2026, 10:43 AM IST", "pub_date_relative": "2h ago"}, {"title": "Ten Things I Learnt This Samvat", "full_content": "Patience can be a trap. Cheap stocks can stay cheap. Leverage can wipe you out. What did Samvat 2082 teach us? Niraj Shah writes on 10 lessons from the year gone by.", "source": "NDTV Profit", "pub_date_str": "08 Nov 2026, 10:39 AM IST", "pub_date_relative": "2h ago"}, {"title": "'Where Naxalism Once Held...': PM Modi Heads To Bastar To Celebrate Diwali With Forces", "full_content": "PM Modi will be celebrating Diwali in Bastar with the the armed forces whom he will salute for their efforts and sacrifices.", "source": "NDTV Profit", "pub_date_str": "08 Nov 2026, 10:38 AM IST", "pub_date_relative": "2h ago"}, {"title": "Muhurat trading last 10 years data: Nifty 50, Bank Nifty, Sensex; what history tells amid Special Diwali session today", "full_content": "Pranati Deva Published 8 Nov 2026, 10:37 AM IST Prefer Livemint on Google Muhurat Trading 2026 : Every Diwali , India's stock market observes a unique tradition that blends investment with culture and the belief in prosperity. Muhurat trading, the special one-hour evening trading session held on the occasion of Diwali, is considered an auspicious time to begin new investments, make symbolic stock purchases and welcome financial prosperity in the coming year. For generations, investors and traders have participated in this session, viewing it as an opportunity to mark the beginning of a new financial calendar with optimism.\n\nThe Indian stock market will usher in Samvat 2083 with its traditional Muhurat trading session on Sunday, November 8. The BSE and NSE will conduct the special session from 2:20 pm to 3:30 pm, giving investors an opportunity to trade during a period traditionally associated with wealth and good fortune.\n\nWhile the session is largely symbolic for many investors, its historical performance offers an interesting perspective on how benchmark indices have moved during these annual trading events. A comparison of Nifty 50, Sensex and Nifty Bank returns over the past 10 years, from 2016 to 2025, shows that all three indices have delivered positive returns in eight sessions, although the gains have generally remained modest.\n\nThe Nifty 50 recorded positive returns in eight of the last 10 Muhurat trading sessions, with losses in 2016 and 2017. The index declined 0.14% in 2016 and 0.63% in 2017, before delivering gains in every subsequent Diwali session between 2018 and 2025.\n\nIn the 2025 Muhurat trading session, the Sensex and Nifty opened on a strong note and initially climbed to their respective 52-week highs at the time. However, both benchmarks surrendered most of their early gains as the session progressed and eventually ended nearly flat.", "source": "LiveMint Markets", "pub_date_str": "08 Nov 2026, 10:37 AM IST", "pub_date_relative": "2h ago"}, {"title": "Saudi Arabia lifts oil region alerts after Houthi missile intercepted", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Nov 2026, 10:34 AM IST", "pub_date_relative": "2h ago"}, {"title": "US military says it disabled cargo vessel in Gulf of Oman", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Nov 2026, 10:30 AM IST", "pub_date_relative": "2h ago"}, {"title": "Crypto industry braces for reckoning over Trump ties", "full_content": "Democrats have vowed to start investigation into president\u2019s family after sweeping victory in midterms", "source": "FT Markets", "pub_date_str": "08 Nov 2026, 10:30 AM IST", "pub_date_relative": "2h ago"}, {"title": "Diwali Gifts For Children: Should Parents Choose Fixed Deposits, Mutual Funds Or Cash?", "full_content": "Parents looking for a relatively stable investment avenue can consider an FD as a Diwali gift for their children.", "source": "NDTV Profit", "pub_date_str": "08 Nov 2026, 10:23 AM IST", "pub_date_relative": "2h ago"}, {"title": "Rajasthan Board Exam 2027 Dates Announced: Class 10 and 12 Papers To Begin From February 16; Timing Revised", "full_content": "Rajasthan Board of Secondary Education has revised the examination schedule by shifting the start time to 10:30 am.", "source": "NDTV Profit", "pub_date_str": "08 Nov 2026, 10:21 AM IST", "pub_date_relative": "2h ago"}, {"title": "Diwali Gold Gifts From Relatives: How To Prove Ownership If You Sell Them Years Later", "full_content": "Received gold as a Diwali gift from relatives? Know how to prove ownership, maintain gift records, and understand capital gains tax before selling it years later.", "source": "NDTV Profit", "pub_date_str": "08 Nov 2026, 10:20 AM IST", "pub_date_relative": "2h ago"}, {"title": "Received Your First Diwali Bonus? Five Ways Young Professionals Can Put It to Work", "full_content": "Financial planning should begin with preparing for uncertainties rather than focusing entirely on wealth creation.", "source": "NDTV Profit", "pub_date_str": "08 Nov 2026, 10:18 AM IST", "pub_date_relative": "2h ago"}, {"title": "Nifty, Sensex log worst Samvat returns in 15 years. What lies ahead in 2083?", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nThe Samvat year gone by has been one of the toughest for Indian equity investors in over a decade. The BSE Sensex slumped 8% and the Nifty 50 shed 7% in Samvat 2082, putting them on course for their worst Samvat-year performance since Samvat 2067, when both headline indices declined over 17%.\n\nThe underperformance of Indian equities in Samvat 2082 is a reflection of the difference between economic growth and stock market performance, said Ankur Punj, managing director of Equirus Wealth.\n\n\u201cA strong economy does not necessarily translate into strong equity returns, particularly when valuations are elevated and earnings growth does not meet market expectations,\u201d Punj said.\n\nWeakness in the Indian market was due to global capital being allocated to artificial intelligence-led sectors, which we lacked, and this, coupled with geopolitical uncertainty and high crude oil prices, led to persistent foreign institutional investor selling, putting huge pressure on the rupee, he explained.\n\nWhile earnings prospects have improved after three difficult years, annual earnings-per-share (EPS) growth of 10-11% over the next decade seems realistic, according to Saurabh Mukherjea, founder and chief investment officer of Marcellus Investment Managers. He said the Nifty\u2019s current price-to-earnings (P/E) ratio of about 18 could revert to its long-term average of 15.\n\n\u201cHowever, valuation normalization could limit index returns to high single digits, below its 30-year annualized return of 12.5%. Quality stocks, meanwhile, could deliver returns of 15-20%,\u201d Mukherjea said.\n\nHe noted that rising interest rates, geopolitical uncertainty, household debt and AI-related challenges could create conditions similar to December 2007-January 2014, when the broader market struggled but quality stocks returned 15-20% annually.", "source": "LiveMint Markets", "pub_date_str": "08 Nov 2026, 10:12 AM IST", "pub_date_relative": "2h ago"}, {"title": "Mookuthi Amman 2 Box Office Collection Day 2: Nayanthara Film Picks Up Pace With 30.3% Jump In Earnings", "full_content": "'Mookuthi Amman 2' witnessed a 30.3% jump in its Day 2 collection, earning Rs 2.45 crore net and taking its India total to Rs 4.33 crore net and Rs 5 crore gross.", "source": "NDTV Profit", "pub_date_str": "08 Nov 2026, 10:08 AM IST", "pub_date_relative": "2h ago"}, {"title": "Cipla Share Price Live Updates: Cipla's Recent Trading Activity", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a Stock Live Blog \u203a Cipla Share Price Live Updates: Cipla's Recent Trading Activity LIVE BLOG Cipla Share Price Live Updates: Cipla's Recent Trading Activity 08 Nov 2026 | 12:49:37 PM IST Cipla share price live
