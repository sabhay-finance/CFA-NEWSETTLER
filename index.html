cs is a big risk in markets, but I'm a data person, and that's not what data shows,\u201d she explained. \"Looking back 125 years, including both World Wars, unless your own country is physically devastated by war, markets do not suffer sustained impacts from geopolitics.\"\n\nMehra also questioned the role of gold as a protective asset, noting its historical drawdowns and price swings relative to stocks.\n\n\u201cStatistically, gold is actually more volatile than equities. It is not a perfect safe haven,\u201d she said. \u201cAfter its 1980 dollar high, gold did not cross that peak for 27 long years. You can hold gold, but don't expect safety.\u201d\n\nTo protect purchasing power against long-term declines in the rupee, Mehra urged domestic investors to look beyond local equities, noting that India accounts for a fraction of global market value.", "source": "LiveMint Money", "pub_date_str": "28 Nov 2026, 06:25 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Why your gold loan terms may get tougher: Lenders demand extra collateral as bullion prices fall and repayments slip", "full_content": "A growing number of gold loan borrowers in India are falling behind on early repayments just as a sharp slide in bullion prices has eroded the value of the gold they pledged. Lenders are responding by asking customers for additional collateral or partial repayments to keep loans within regulatory limits, according to the latest data from credit bureau CRIF India and company disclosures.\n\nCredit bureau CRIF India tracks loans that are 31 to 90 days overdue through a measure called portfolio at risk (PAR). Its November 2026 gold loan report shows this figure rose at most lenders in September 2026 compared with a year earlier.\n\nGold-focused NBFC s saw PAR climb to 1.6% from 1%. Private banks moved to 2.2% from 1.1%, while other NBFCs jumped to 3.9% from 1.2%. Public sector banks were the exception, with the measure falling to 0.6% from 1.2%.\n\nAcross the full gold loan market, loans 31 to 90 days overdue rose to 1.3% in September from 0.9% in June. CRIF\u2019s How India Lends report notes that gold loans were among the products where delinquencies increased quarter-on-quarter, though overall stress remains contained.\n\nA gold loan is only as safe as the metal behind it. India Bullion and Jewellers Association rates show 24-carat gold peaked at \u20b9 1,75,340 per 10 grams on January 29, 2026. By November 20, it had fallen to \u20b9 1,23,893, a drop of about 29%.\n\nMany loans were disbursed when prices were much higher, so the pledged gold now covers a smaller share of the outstanding amount. This pushes up the loan-to-value (LTV) ratio. If a borrower stops paying, the lender has less cushion to recover its money through sale of the gold.\n\nOutstanding gold loans grew 60.6% year on year to \u20b9 23.3 lakh crore in September 2026, according to CRIF . That equals 12.6% of all retail credit in India.", "source": "LiveMint Markets", "pub_date_str": "28 Nov 2026, 06:23 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Alternative Investments", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Widow denied share of husband\u2019s $2.89 million assets over tax valuations; US court orders fresh review", "full_content": "A widow's estate is seeking a share of her late husband's assets, valued at approximately $2.89 million. A court has ordered a fresh valuation of agricultural property after questions emerged over the use of tax assessments instead of independent appraisals to determine inheritance rights.", "source": "LiveMint Money", "pub_date_str": "28 Nov o \u20b984,508, despite no corresponding market loss. Here's what happened and how she secured relief from the consumer commission.", "source": "LiveMint Money", "pub_date_str": "28 Nov 2026, 03:21 PM IST", "pub_date_relative": "6h ago", "cfa_topics": ["Financial Statement Analysis", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Gold prices near $3,650: US jobs data and inflation may decide whether bullion\u2019s rebound can last through early December", "full_content": "Gold prices are approaching $3,650, but $3,500 remains a crucial support level. Upcoming US JOLTS and November employment data could influence Federal Reserve rate expectations and determine whether bullion's recent recovery gains momentum or faces renewed selling pressure.", "source": "LiveMint Money", "pub_date_str": "28 Nov 2026, 03:12 PM IST", "pub_date_relative": "6h ago", "cfa_topics": ["Economics", "Equity Investments", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Mint Money Festival | Gold is less volatile than other asset classes despite the correction: WGC's Sachin Jain", "full_content": "The World Gold Council's Sachin Jain says gold has had the lowest average daily volatility compared with global aggregate bonds, stocks, commodities, private equity, Reits, and crude oil since 2005", "source": "LiveMint Markets", "pub_date_str": "28 Nov 2026, 03:02 PM IST", "pub_date_relative": "6h ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "TBZ, PC Jewellers, Kalyan, Titan: Gold price down 30% from peak but these jewellery stocks soar up to 244% in 2026 YTD", "full_content": "Gold prices have fallen sharply from January\u2019s record, but several jewellery stocks have  pressures. Retail inflation has recently surpassed the Reserve Bank of India's upper tolerance limit for the first time. Despite these challenges, the domestic economy shows signs of sustained growth in the December quarter.", "source": "Economic Times Economy", "pub_date_str": "28 Nov 2026, 02:15 PM IST", "pub_date_relative": "7h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}], "updated_at": "28 Nov 2026, 09:48 PM IST", "total_stories": 271};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
