 Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a US slaps sanctions on Indian, Turkish firms and people for aiding Iran The Economic Times daily newspaper is available online now. Read Today's Paper US slaps sanctions on Indian, Turkish firms and people for aiding Iran SECTIONS US slaps sanctions on Indian, Turkish firms and people for aiding Iran Reuters Last Updated: Nov 05, 2026, 12:20:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The sanctions are part of the Trump administration's \"Operation Economic Outcast,\" which aims to cut off Iran's ability to sell oil to fund the war with the US and Israel. Treasury unveiled the new sanctions a day after Democrats made huge gains in midterm elections, winning control of both houses of Congress as voters expressed anger about the Iran war and its impact in fueling US inflation.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\nSome elections matter more than you know: No crop changed in the fields, yet sugar, coffee and soya got cheaper in a day\n\nYou can buy a walkie-talkie online. But can you legally use it?\n\nKYB and KYC: Quick commerce, the Damani premium and what DMart must deliver \u2013 3rd and concluding part\n\nKYC and KYB: Inside Damani\u2019s DMart, the retail chain for the middle class. And stock for the long term? \u2013 Part 2 of 3\n\nWill it be a regulatory nightmare if an exchange lists on its own platform?\n\nKYC and KYB: Inside Damani\u2019s Avenue Supermarts that refuses to charge more \u2013 Part 1 of 3", "source": "Economic Times Economy", "pub_date_str": "04 Nov 2026, 11:54 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Fixed Income", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Google responds to political backlash over removing search from schools that ban AI", "full_content": "Google is playing defense on Tuesday after a political backlash to its new policy surrounding use of artificial intelligence in schools.\n\nIn a blog post titled \"Designing responsible AI for learning,\" Google said it's bringing AI into its Classroom offering with a product called Guided Learning. The New York Times published a story saying that the company will turn off search for schools that reject AI entirely.\n\nFollowing the Times' story, prominent left-leaning politicians, including Sen. Bernie Sanders from Vermont and New York Mayor Zohran Mamdani voiced their outrage on social media.\n\n\"Google is trying to use its monopoly power to force AI into our public schools,\" Mamdani wrote on X. Sanders wrote that \"Google is threatening schools,\" referring to the policy as \"extortion.\"\n\nGoogle responded later in the day. In a post on X , the company said its new policy was meant to give schools more choice over how students interact with AI. Google said its Gemini chatbot, Gemini Notebook and search are turned off by default, and that \"schools are in control,\" with the ability to turn them as they see fit.\n\n\"We are also updating Search for schools to make it better for learning,\" Google wrote. \"Specifically, AI Mode and AI Overviews will offer step-by-step guided learning through problems, so that students don't get quick answers to schoolwork.\"\n\nThe company's post didn't explicitly respond to the claim that access to search requires use of AI. However, Chris Phillips, vice president for education at Google, told the Times that \"Search and AI are deeply integrated.\"\n\nA Google spokesperson referred CNBC to the X post when asked for comment.", "source": "CNBC World Economy", "pub_date_str": "04 Nov 2026, 11:43 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Will tighter AI regulation slow Big Tech spending? What the US midterm results mean for tech stocks - Explained", "full_content": "A Democratic sweep of both chambers of Congress in the midterm elections left Wall Street divided in Wednesday's trade. While AI chipmakers, memory companies and data centre operators fell, hyperscalers surged sharply.\n\nShares of Amazon surged 8% to a three-month high, while Apple and Microsoft advanced 6% each. Alphabet gained 5.7%, while Meta Platforms climbed 3.5%, powering a rally on Wall Street after days of selling fuelled by concerns over the soaring costs of the AI boom.\n\nApple, which has avoided Big Tech's massive AI spending but is feeling the impact of an AI-fuelled surge in memory chip prices, jumped nearly 7% to a record high.\n\nIf the gains hold, the five companies are on course to add more than $750 billion in combined market value, according to Bloomberg .\n\nA Democratic-led Congress could push for tighter regulation of AI development and data centre construction. Some investors see this as a sign that hyperscalers may moderate their spending.\n\nOn the other hand, SanDisk shares slumped 10%, while peer Seagate Technology Holdings plunged 8.2% at its intraday low. Nvidia, the chipmaker that quickly became the poster child of the AI stock frenzy, slipped 2.5%.\n\nCoreWeave, a company that rents out access to AI chips to customers over the cloud, fell 11%. Advanced Micro Devices, another chip giant, was down 1.5%, even after reporting a much stronger profit for the latest quarter than analysts had expected.\n\nFor hyperscalers, the rally marks a sharp reversal after a difficult period for cloud giants. Their quarterly earnings reports highlighted how the race to build AI infrastructure was turning once cash-rich, debt-light companies into heavy spenders increasingly reliant on borrowing. Microsoft was a notable exception, reporting $18.6 billion in cash flow.", "source": "LiveMint Markets", "pub_date_str": "04 Nov 2026, 11:38 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Kissht Crosses Rs 10,000 Crore AUM Weeks After Rs 832 Crore Fundraise", "full_content": "Personal loans still make up most of the book. But the company's loan against property portfolio is growing steadily, which is adding to its secured lending business and diversifying the product mix.", "source": "NDTV Profit", "pub_date_str": "04 Nov 2026, 11:37 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "These 12 stocks are good bets to beat the 10-year Treasury over the next decade", "full_content": "Investment newsletters\u2019 favorite Dividend Aristocrat stocks", "source": "MarketWatch Top Stories", "pub_date_str": "04 Nov 2026, 11:33 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers", "Fixed Income"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Home loan interest rates for Diwali 2026: Planning to buy a house? Check rates starting at 7.25% across major banks", "full_content": "With Diwali approaching on 8 November, prospective homebuyers looking to turn the festive season into an opportunity to purchase their dream house may also be evaluating their financing options. While property developers are rolling out festive offers, home loan interest rates remain an important factor to consider before making a long-term financial commitment.\n\nHome loan interest rates currently start at 7.25% per annum at some public sector banks. However, rates vary significantly across lenders, loan amounts and borrower profiles. Here is a look at the latest home loan interest rates across public sector banks, private banks and housing finance companies.\n\nAmong public sector banks, Bank of Maharashtra and Central Bank of India offer the lowest starting interest rates at 7.25% per annum across all three loan categories in the latest comparison.\n\nBank of India and Indian Bank follow with starting rates of 7.35%, while Bank of Baroda, UCO Bank and Union Bank of India offer rates starting at 7.40%. State Bank of India (SBI) has a starting interest rate of 7.50%, with its published rate range extending up to 8.80%.\n\nAmong private sector banks, HSBC offers home loans starting at 7.45% per annum across all three loan categories. Kotak Mahindra Bank follows with starting rates of 7.60%, while HDFC Bank offers rates starting at 8%.\n\nAxis Bank's rates start at 8%, while ICICI Bank offers home loans starting at 8.75%.\n\nHowever, the difference between the starting and upper-end rates can be substantial. For instance, Bandhan Bank's rates range from 8.80% to 13.77%, depending on the loan and borrower profile.\n\nHomebuyers can also compare rates offered by housing finance companies, which provide an alternative to traditional bank financing.", "source": "LiveMint Money", "pub_date_str": "04 Nov 2026, 11:30 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Allcargo Terminals Q2 Results: Profit Nearly Doubles, Revenue Jumps 22%", "full_content": "Revenue for the period under review stood at Rs 252 crore, up 21.5% from Rs 207 crore clocked during the July-September period of FY 26, it said in a statement.", "source": "NDTV Profit", "pub_date_str": "04 Nov 2026, 11:28 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Allcargo Logistics Posts Rs     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
