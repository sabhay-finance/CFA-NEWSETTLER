inst the company over an alleged Rs 2.79 crore operational debt, pending further orders.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "12 Oct 2026, 09:54 PM IST", "pub_date_relative": "29m ago"}, {"title": "FTSE 100 today: Stocks climb as banks lead despite Gulf tension, oil rebound", "full_content": "", "source": "Investing.com News", "pub_date_str": "12 Oct 2026, 09:53 PM IST", "pub_date_relative": "30m ago"}, {"title": "US stocks hover near their latest record in mixed trading on Wall Street - AP News", "full_content": "US stocks hover near their latest record in mixed trading on Wall Street AP News S&P 500 Hovers Near All-Time High Before Earnings: Markets Wrap Bloomberg.com S&P 500, Nasdaq 100, Dow End Week Higher With Traders Eyeing Earnings Season \u2014 MSFT, NFLX, SPCX, ASTS In Focus Yahoo Finance COMMENTARY: Morning Bid: Storm brewing Reuters Here\u2019s Why the S&P 500 Just Hit a New All-Time High Despite Rising Interest Rates Carson Group", "source": "Google News Business", "pub_date_str": "12 Oct 2026, 09:52 PM IST", "pub_date_relative": "31m ago"}, {"title": "Dynatrace gains on raised RBC target and federal cloud security milestone", "full_content": "", "source": "Investing.com News", "pub_date_str": "12 Oct 2026, 09:51 PM IST", "pub_date_relative": "32m ago"}, {"title": "Government allows 5,841 tonnes of sugar export to EU under quota-based duty concession scheme", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a Government allows 5,841 tonnes of sugar export to EU under quota-based duty concession scheme The Economic Times daily newspaper is available online now. Read Today's Paper Government allows 5,841 tonnes of sugar export to EU under quota-based duty concession scheme SECTIONS Government allows 5,841 tonnes of sugar export to EU under quota-based duty concession scheme PTI Last Updated: Oct 12, 2026, 09:48:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis \"The quantity of 5,841 MT of sugar to be exported to the EU from India under TRQ (tariff rate quota) for the year 2026-27 (October 2026 to September 2027) has been notified,\" the Directorate General of Foreign Trade (DGFT) has said in a public notice dated October 9.\n\nBrinjal, buffalo, bacteria: Inside India\u2019s pay-for-nature system\n\nHomebuyers wait as NCLT panel picks holes in unfinished Jaypee projects\n\nThe NBFC saga - Part 3: How one default in 2018 changed the way RBI reads risk\n\nFour rules made HDFC Bank a compounder. All four have stopped. Can the new CEO rewrite them?\n\nWhat is the real impact of 13x jump in cash transfers to women?\n\nThe NBFC saga - Part 2: Line drawn in 2006 is reason for the headlines today\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "12 Oct 2026, 09:48 PM IST", "pub_date_relative": "35m ago"}, {"title": "Rep. Ilhan Omar\u2019s home raided in federal criminal investigation", "full_content": "Federal authorities on Monday morning raided the Washington, D.C.-area home of Rep. Ilhan Omar , a Minnesota Democrat, as part of a criminal fraud investigation into her immigration paperwork filled out by her father, Fox News reported, citing a person familiar with the situation.\n\nHomeland Security Investigations, a division of the Department of Homeland Security , conducted the raid, Fox News reported. The Department of Justice later confirmed the raid after CNBC asked about it. DHS declined to comment.\n\nA person familiar with the situation, who spoke on condition of anonymity to discuss the non-public investigation, told CNBC that the investigation into Omar is complex and has been going on for years.\n\nMS NOW reported that a law enforcement source with direct knowledge of the raid said the investigation into Omar is based on allegations of fraud.\n\nOmar, 44, was born in Somalia and brought to the United States as a child. She became a U.S. citizen in 2000 at 17. She was elected to Congress in November 2018 to represent Minnesota's 5th District, which includes all of Minneapolis.\n\nShe and Rep. Rashida Tlaib, D-Mich., became the first two Muslim women elected to Congress.\n\nOmar has been a target of criticism by President Donald Trump , and heckled Trump during his State of the Union address to Congress on Feb. 24, which came on the heels of aggressive immigration enforcement actions in Minneapolis by federal authorities.\n\nThe Department of Justice, in a statement to CNBC when asked about the raid, said, \"Today in the Washington, D.C., area, Homeland Security Investigations executed a judicially authorized search warrant secured by the Department of Justice.\"", "source": "CNBC Top News", "pub_date_str": "12 Oct 2026, 09:46 PM IST", "pub_date_relative": "37m ago"}, {"title": "Salesforce Jumps 5% As Bank Of America Double-Upgrades Stock On AI Integration: Check Target Price", "full_content": "Salesforce shares jumped following a Bank of America double-upgrade citing strong artificial intelligence demand.", "source": "NDTV Profit", "pub_date_str": "12 Oct 2026, 09:37 PM IST", "pub_date_relative": "46m ago"}, {"title": "UK To Evaluate AI Models Before Release, Reversing Trump Policy", "full_content": "Trump has been cracking down on global access to AI models from Silicon Valley.", "source": "NDTV Profit", "pub_date_str": "12 Oct 2026, 09:34 PM IST", "pub_date_relative": "49m ago"}, {"title": "FMCG dividend giants: Colgate, Hindustan Unilever, ITC, Britannia: Which stock offers highest yield?", "full_content": "FMCG dividend giants: Colgate Palmolive (India), Hindustan Unilever Limited, ITC Limited and Britannia Industries Limited are among the key fast moving and consumer goods (FMCG) companies that have paid significant dividend to their shareholders over the past few years.\n\nAs the second quarter earnings for financial year 2026-27 begins, here\u2019s a comparison of top 4 FMCG stocks and their dividend payouts in one year.\n\nColgate Palmolive India has announced a total of \u20b9 48 per equity share dividend in the last one year. Which makes its annual dividend yield stand at 2.16% for the last one year. The stock closed 2.75% lower at \u20b9 1770 per share on BSE with an Mcap of \u20b9 48,141.46 crore on Monday. Its share price value has declined 20.5% in one year, 52% in two years, 14% in three years.\n\nHindustan Unilever Limited has announced \u20b9 41 per equity share dividend in last one year, and its annual dividend yield stood at 2.25%. The FMCG stock closed 2.10% lower at \u20b9 1822 per share on BSE. Its share price value has declined 25% in one year, 32% in two years, and 26% in three years.\n\nITC has announced \u20b9 14.50 per equity share dividend over the last one year. Its dividend yield stood at 3.63%. ITC share price ended 3.23% lower at \u20b9 257.60 per share on BSE on Monday. Its share price value has declined 36% in one year, 44% in two years and 39% in three years.\n\nBritannia Industries has announced \u20b9 90.50 per equity share dividend over the last one year. Its annual dividend yield stood at 1.54%. Shares of Britannia Industries closed marginally lower at \u20b9 4780 per share on Monday. The stock value has declined 18% in one year, and 20% in two years.\n\nOut of the four FMCG stock, ITC has the highest annual dividend yield of 3.63%.\n\nA stock's dividend yield is a ratio of the total annual dividend paid by the company to its share price. It shows how much an investor has earned from dividend of a stock, compared with its market price.", "source": "LiveMint Markets", "pub_date_str": "12 Oct 2026, 09:28 PM IST", "pub_date_relative": "54m ago"}, {"title": "Trump defends Russia diesel deal after bipartisan pushback: 'I made the right choice'", "full_content": "President Donald Trump on Monday defended last week's decision to temporarily ease restrictions on Russian diesel fuel exports after the announcement drew bipartisan criticism .\n\nTrump, in a Truth Social post , accused the media of hypocrisy for allegedly refusing to cover past purchases of Russian energy by the European Union.\n\n\"The European Union paid Russia 250 Billion Dollars for Energy, and the Fake News Media doesn't want to get near that story,\" Trump wrote.\n\nWhile the president did not specify, his figure roughly tracks with some estimates of how much the EU has spent importing fossil fuels from Russia since the 2022 invasion of Ukraine. The European Commission has launched a plan to phase out its dependence on Russian energy.\n\n\"I made the right choice for the American People \u2014 ALWAYS, AMERICA FIRST!\" Trump wrote in the social media post.\n\nLawmakers from both parties raised concerns about Trump's decision to let Russia supply some diesel to the U.S. and global markets for the next six months.\n\nThe plan received pushback from multiple congressional Republicans who have urged Trump not to lift the U.S. ban on energy imports from Russia until its president, Vladimir Putin , ends the war against Ukraine.\n\n\"The United States should not provide Putin with a financial lifeline while Russia continues to kill Ukrainian civilians,\" a group of seven senators, including four Republicans, said in a joint statement on Sunday.", "source": "CNBC Top News", "pub_date_str": "12 Oct 2026, 09:25 PM IST", "pub_date_relative": "58m ago"}, {"title": "Goldman Set To Lead Wall Street's Stock-Trading Haul", "full_content": "Analysts are forecasting a $4.5 billion haul from JPMorgan Chase & Co. and $2.6 billion of revenue from Bank of America Corp.'s equity traders.", "source": "NDTV Profit", "pub_date_str": "12 Oct 2026, 09:25 PM IST", "pub_date_relative": "58m ago"}, {"title": "Investors can now see how Meta's big AI spending will pay off with Muse. Why I am buying now", "full_content": "Meta's push into consumer and enterprise AI could lead to new growth opportunities.", "source": "CNBC Top News", "pub_date_str": "12 Oct 2026, 09:24 PM IST", "pub_date_relative": "58m ago"}, {"title": "When should you switch your financial advisor? 5 warning signs investors should watch for", "full_content": "Choosing a financial advisor is only the first step in managing your money. As an investor\u2019s income, financial goals and responsibilities change, the advice they receive must evolve too. But if conversations increasingly revolve around buying new financial products rather than reviewing existing investments, it may be time to reassess the relationship.\n\nA financial advisor should help investors make informed decisions based on their financial goals, risk appetite and investment horizon. The relationship should also involve regular portfolio reviews, clear explanations of recommendations and transparency about costs. When these elements are consistently missing, investors may need to consider whether their advisor is still serving their interests.\n\nSanjiv Bajaj, Joint Chairman and Managing Director of Bajaj Capital Ltd, identifies five warning signs investors should watch for: conversations dominated by new products, recommendations without adequate explanations, irregular portfolio reviews, unclear costs and poor communication.\n\n\u201cA good advisor relationship should get more valuable with time. The longer an advisor knows you, the more relevant and meaningful your conversations should become,\u201d Bajaj said.\n\nAn advisor repeatedly recommending new mutual fund schemes, insurance policies or other financial products without first reviewing the existing portfolio should prompt investors to ask questions.\n\nNew investments may sometimes be appropriate, but the recommendation should be based on the investor\u2019s overall financial position, rather than the availability of a new product.\n\n\u201cBefore suggesting something new, a good advisor should first understand what you already own, what each investment is meant to do for you, and whether anything needs to change,\u201d Bajaj said.\n\nInvestors should ask how a proposed investment fits into their existing portfolio, what purpose it serves and whether it addresses a specific financial need.", "source": "LiveMint Money", "pub_date_str": "12 Oct 2026, 09:24 PM IST", "pub_date_relative": "59m ago"}, {"title": "Centre to set up high-level committee within a week to address sugarcane farmers' grievances", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Agriculture \u203a Centre to set up high-level committee within a week to address sugarcane farmers' grievances The Economic Times daily newspaper is available online now. Read Today's Paper Centre to set up high-level committee within a week to address sugarcane farmers' grievances SECTIONS Centre to set up high-level committee within a week to address sugarcane farmers' grievances PTI Last Updated: Oct 12, 2026, 09:22:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Union Agriculture Minister Shivraj Singh Chouhan and Food Minister Pralhad Joshi held detailed discussions at the Pusa campus with a delegation of farmers from the two major sugarcane-growing states. About 80-90 farmers from different organisations attended, along with state ministers.\n\nBrinjal, buffalo, bacteria: Inside India\u2019s pay-for-nature system\n\nHomebuyers wait as NCLT panel picks holes in unfinished Jaypee projects\n\nThe NBFC saga - Part 3: How one default in 2018 changed the way RBI reads risk\n\nFour rules made HDFC Bank a compounder. All four have stopped. Can the new CEO rewrite them?\n\nWhat is the real impact of 13x jump in cash transfers to women?\n\nThe NBFC saga - Part 2: Line drawn in 2006 is reason for the headlines today\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "12 Oct 2026, 09:22 PM IST", "pub_date_relative": "1h ago"}, {"title": "Google\u2019s Next TV Streamer Could Listen for \"Hey Google\" Without Remote: Top Features", "full_content": "Google is reportedly working on a new Google TV Streamer with built-in microphones for \u201cHey Google\u201d commands, presence sensing, a faster processor and more storage.", "source": "NDTV Profit", "pub_date_str": "12 Oct 2026, 09:21 PM IST", "pub_date_relative": "1h ago"}, {"title": "Indian Gas Exchange secures Sebi's nod to float IPO", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a Indian Gas Exchange secures Sebi's nod to float IPO Indian Energy Exchange Share Price BSE Share Price Multi Commodity Exchange of India Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Indian Gas Exchange secures Sebi's nod to float IPO SECTIONS Indian Gas Exchange secures Sebi's nod to float IPO PTI Last Updated: Oct 12, 2026, 09:19:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Indian Gas Exchange Ltd has received approval from Sebi to launch an initial public offering. The proposed IPO is exclusively an offer for sale of equity shares by promoter Indian Energy Exchange Ltd. IGX aims to enhance its visibility and strengthen its brand image through this public listing. The company has been operational since June 2020 and reported increasing revenue in recent years.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "12 Oct 2026, 09:19 PM IST", "pub_date_relative": "1h ago"}, {"title": "Delta delays debut of Saudi Arabia service until March after Riyadh airport attacks", "full_content": "Delta Air Lines said it will delay the launch of its nonstop service between Atlanta and the Saudi capital Riyadh until March after several deadly attacks hit the city's airport there.\n\nDelta planned to begin the route on Oct. 23, with an Airbus A350-900 wide-body plane, in what would have marked the first nonstop commercial flight between the U.S. and Saudi Arabia operated by a U.S. airline.\n\nSince Thursday, more than 2,000 flights have been canceled to and from King Khalid International Airport in Riyadh, according to FlightAware. The deadly attacks, claimed by Yemen's Iran-backed Houthis, escalated Saturday, when a projectile struck a passenger terminal at the airport, officials said, killing at least 12 people and wounding more than 300.\n\nKing Khalid International Airport remains closed as of Monday.\n\n\"We remain in close contact with relevant government and aviation partners, including Saudia and Riyadh Air, as we monitor the situation,\" Delta said in a statement. \"Saudi Arabia remains an important market for Delta, and we are committed to serving the Kingdom for the long-term.\"\n\nDelta CEO Ed Bastian had told CNBC on Thursday that the airline hadn't yet decided whether to postpone the debut.\n\n\"Obviously, we were disappointed to see the news this week,\" he said. \"Safety is going to make the call.\"\n\nDelta's decision came after the Federal Aviation Administration on Sunday issued a warning for U.S. airlines.", "source": "CNBC Top News", "pub_date_str": "12 Oct 2026, 09:18 PM IST", "pub_date_relative": "1h ago"}, {"title": "Here\u2019s how much extra money could be in your monthly Social Security check next year", "full_content": "Social Security\u2019s cost-of-living adjustment will boost retirees\u2019 monthly budgets. But will it be enough?", "source": "MarketWatch Top Stories", "pub_date_str": "12 Oct 2026, 09:17 PM IST", "pub_date_relative": "1h ago"}, {"title": "Singularity AMC pays over Rs 40 lakh to settle AIF rule violation case with Sebi", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Singularity AMC pays over Rs 40 lakh to settle AIF rule violation case with Sebi The Economic Times daily newspaper is available online now. Read Today's Paper Singularity AMC pays over Rs 40 lakh to settle AIF rule violation case with Sebi SECTIONS Singularity AMC pays over Rs 40 lakh to settle AIF rule violation case with Sebi PTI Last Updated: Oct 12, 2026, 09:16:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Singularity AMC, a company rooted in Mumbai, has successfully resolved two significant matters with the Securities and Exchange Board of India (Sebi) concerning violations related to alternative investment funds. As part of the settlement, the firm has paid Rs 40.5 lakh. The infractions included not maintaining the required interest in the Singularity Equity Fund and excessive drawdowns in three of its schemes.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "12 Oct 2026, 09:16 PM IST", "pub_date_relative": "1h ago"}, {"title": "Oil prices rise as Trump\u2019s \u2018energy ceasefire\u2019 frays", "full_content": "Announcement followed deal with Putin as US president tries to contain impact of higher fuel costs ahead of midterm elections", "source": "FT Markets", "pub_date_str": "12 Oct 2026, 09:16 PM IST", "pub_date_relative": "1h ago"}, {"title": "Nvidia, Micron, SK Hynix shares slump up to 5% as China's CXMT steps up challenge to global chipmakers - What it means", "full_content": "Major US chip stocks came under renewed selling pressure on Monday, October 12, following their recent rally, amid concerns over rising competition from Chinese memory chipmaker ChangXin Memory Technologies (CXMT).\n\nNvidia, which has been at the forefront of the AI-led rally, saw its shares fall 2% to an intraday low of $224.90. Broadcom, Advanced Micro Devices (AMD), and Intel declined 1.2%, 3.3%, and 3.6%, respectively.\n\nMarvell Technology, Micron, and SK Hynix shed 4.2%, 5%, and 4.3%, respectively. Other major technology stocks, including Amazon and Tesla, also fell by up to 1%.\n\nThe weakness dragged the Nasdaq Composite down 0.46% to an intraday low of 27, 240, while S&P 500 and Dow Jones Industrial Average with modest gains.\n\nChangXin Memory Technologies has reportedly announced significant progress in a new memory-cell design aimed at increasing storage density, an area of innovation also being pursued by the world's largest memory makers, including Samsung Electronics, SK Hynix, and Micron.\n\nCXMT aims to introduce a new server memory product based on the architecture by the end of 2026, company president Cao Kanyu said at an industry event in Shanghai over the weekend.\n\nAt the center of the development is the \u201c4F squared\u201d design, in which each memory cell occupies an area equivalent to four times the square of F, with F representing the minimum line width of a semiconductor. The structure enables higher storage density by allowing more cells to fit onto a single chip, according to the South China Morning Post .\n\nCXMT said the core of its 4F-squared design was its proprietary Vertical Surrounding Gate (VSG) transistor. The technology uses a vertical gate architecture to address current leakage while significantly reducing the area occupied by each memory cell and increasing storage density, according to the report.", "source": "LiveMint Markets", "pub_date_str": "12 Oct 2026, 09:15 PM IST", "pub_date_relative": "1h ago"}, {"title": "Jubilant Pharmova block deal: Quant Mutual Fund offloads Rs 190 crore stake amid Rs 800 crore fundraising plan; Abakkus buys 11 lakh shares", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Jubilant Pharmova block deal: Quant Mutual Fund offloads Rs 190 crore stake amid Rs 800 crore fundraising plan; Abakkus buys 11 lakh shares BSE Share Price Multi Commodity Exchange of India Share Price Indian Energy Exchange Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Jubilant Pharmova block deal: Quant Mutual Fund offloads Rs 190 crore stake amid Rs 800 crore fundraising plan; Abakkus buys 11 lakh shares SECTIONS Jubilant Pharmova block deal: Quant Mutual Fund offloads Rs 190 crore stake amid Rs 800 crore fundraising plan; Abakkus buys 11 lakh shares By Kumar Gaurav , ETMarkets.com Last Updated: Oct 12, 2026, 09:14:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Quant Mutual Fund sold 20.81 lakh shares of Jubilant Pharmova worth Rs 190.47 crore in bulk deals, while Abakkus Four2Eight Opportunities Fund bought 11 lakh shares. The transactions came as the pharmaceutical company approved plans to raise up to Rs 800 crore through non-convertible debentures and seek broader debt issuance authorisation.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets .", "source": "Economic Times Markets", "pub_date_str": "12 Oct 2026, 09:14 PM IST", "pub_date_relative": "1h ago"}, {"title": "Saudis Plan More Oil Pipe Capacity For Export Resilience", "full_content": "The Saudis are working on potential international partnerships when looking to add other routes for export, Prince Abdulaziz said, adding that the country was in talks with countries like Kuwait.", "source": "NDTV Profit", "pub_date_str": "12 Oct 2026, 09:14 PM IST", "pub_date_relative": "1h ago"}, {"title": "SBI economists call for scrapping LTCG tax on equities", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a SBI economists call for scrapping LTCG tax on equities State Bank of India Share Price Punjab National Bank Share Price Union Bank of India Share Price Bank of Baroda Share Price Indian Bank Share Price The Economic Times daily newspaper is available online now. Read Today's Paper SBI economists call for scrapping LTCG tax on equities SECTIONS SBI economists call for scrapping LTCG tax on equities PTI Last Updated: Oct 12, 2026, 09:12:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis SBI economists are advocating for the elimination of long-term capital gains tax to stimulate sustained investment in Indian equity markets. This proposal arises amid substantial foreign portfolio investor withdrawals exceeding Rs 3 lakh crore this year, prompting concerns. Furthermore, the lack of AI-focused stocks is contributing to these market exits.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "12 Oct 2026, 09:12 PM IST", "pub_date_relative": "1h ago"}, {"title": "Inflation likely peaked for 2026 but will remain sticky, according to prediction markets", "full_content": "Traders on prediction market platform Kalshi think inflation likely reached a peak for the year, though they don't see a sharp move lower anytime soon.\n\nTraders think the September consumer price index, due Wednesday at 8:30 a.m. ET, will show a 3.6% increase year over year. That's in line with a FactSet consensus estimate.\n\nThat would mark an increase from the 3.4% advance seen in August . Yet speculators on Kalshi place just under one-in-three odds that inflation will hit new highs in 2026. Previously, year-over-year inflation peaked at 4.2% in May .\n\nInflation-related contracts on the platform ask traders if they think that CPI will come in above various levels for the month of September or if it will go above certain levels at any point in 2026. The contracts are resolved using the official data from the Bureau of Labor Statistics.\n\nCore inflation is predicted to remain steady at 2.4% year over year, also in line with economists' estimates, according to FactSet. However, traders think that core inflation \u2014 which excludes food and energy price changes \u2014 will remain elevated throughout the rest of 2026.\n\nThere's just a 6% chance that core inflation falls below 2.2% this year. Annual core inflation was last below that level before the spike in inflation that began in 2021.\n\nDisclosure: CNBC and Kalshi have a commercial relationship that includes customer acquisition and a minority investment.", "source": "CNBC Finance", "pub_date_str": "12 Oct 2026, 09:07 PM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "HCL Tech vs TCS Q2 results dividend: Which IT stock offers more? Amount, record date, yield, earnings compared", "full_content": "HCL Tech vs TCS Q2 results dividend : Tata Consultancy Services and HCL Technologies have announced their second quarter results for the financial year 2026-27. The tech giants have also announced a dividend for the quarter.\n\nFor investors who closely track dividend payouts for IT, here are all the details to know.\n\nBoth the IT companies have announced equal payouts in Q2FY7. HCL Tech on Monday, October 12, announced an interim dividend of \u20b9 12 per equity share with a face value of \u20b9 2 each. Whereas, TCS board recommended and approved \u20b9 12 interim dividend with face value of Re 1 each.\n\nTCS has fixed Wednesday, October 14 as the record date to determine the eligibility of shareholders for the payout.\n\n\u201cThe second interim dividend, if declared, shall be paid to the equity shareholders of the Company whose names appear in the Register of Members of the Company or in the records of the Depositories as beneficial owners of the shares as on Wednesday, October 14, 2026, which is the Record Date fixed for this purpose,\u201d stated the firm in its BSE filing before the Q2 result announcement.\n\nHCL Tech\u2019s board of directors has fixed October 16 as the record date to determine the eligibility of shareholders for the payout. \u201cThe Record date for the payment of the aforesaid interim dividend shall be October 16, 2026, and the payment date of the said interim dividend shall be October 26, 2026.\u201d\n\nHCL Tech has declared a total of \u20b9 60 per equity share with a face value of \u20b9 2 each in the last one year. The IT stock has a dividend yield of 4.10% in FY26. Tata Consultancy Services Limited has declared a three digit dividend over the last one year. With \u20b9 111 dividend announced for every share with a face value of Re 1 each, TCS dividend yield stood at 4.7% for FY26.\n\nThe IT heavyweight\u2019s consolidated net profit after tax (PAT) came in at \u20b9 5,132 crore in Q2FY27, 21% higher than \u20b9 4,236 crore reported in Q2FY26. HCL Tech had reported a net profit of \u20b9 4626 crore in Q1FY26.", "source": "LiveMint Markets", "pub_date_str": "12 Oct 2026, 10:20 PM IST", "pub_date_relative": "2m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Fixed Income"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "FAA warns U.S. airlines of safety risks over Saudi Arabia after attacks", "full_content": "The Federal Aviation Administration told U.S. airlines to exercise caution when flying in or around Saudi Arabia after deadly attacks claimed by Yemen's Iran-backed Houthis, which have shut down the airport in the Saudi capital.\n\nKing Khalid International Airport in Riyadh, Saudi Arabia, remains closed as of Monday after strikes that started last week. The attacks escalated Saturday, when a projectile struck a passenger terminal at the airport, officials said, killing at least 12 people and wounding more than 300.\n\nAirlines suspended flights to the airport, some for the rest of the week.\n\nThe U.S., Australia and other countries advised citizens against travel to the region.\n\nThe FAA late Sunday said pilots should \"exercise caution\" in or around Saudi Arabia \"due to safety-of-flight risks associated with ongoing military activities\" and navigation systems. It said the threats could be a potential risk \"to aircraft at all altitudes.\" The FAA's warning is in effect until Dec. 10.\n\nMost U.S. airlines don't fly to Saudi Arabia, but the country's flights and passenger counts had climbed in recent years. The route between Riyadh to Jeddah in the country's west was the fifth-busiest in the world last year, according to aviation-data firm OAG.\n\nDelta Air Lines had been scheduled to launch its first nonstop flight from Atlanta to Riyadh on Oct. 23 but the carrier on Monday said it would delay that service until March.", "source": "CNBC Top News", "pub_date_str": "12 Oct 2026, 10:20 PM IST", "pub_date_relative": "2m ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "UnitedHealth shares are doing something unusual ahead of earnings", "full_content": "The only thing more expensive than health insurance is perhaps the costs of insuring shares of health insurers. Case in point: UnitedHealth Group, which reports earnings Tuesday.\n\nImplied volatility is running at twice realized volatility ahead of the October 13 quarterly earnings release. In other words, options prices - the cost of insuring the underlying stock - are expensive, which sets up well for short premium strategies.\n\nIn the case of UnitedHealth shares, traders can sell November premium to cut the cost of a longer-dated January call by more than half. UnitedHealth heads into Tuesday's report with much of the damage from its prior missteps already priced in. While rising healthcare costs always remain a headwind, management's 13% to 16% EPS growth target looks achievable. The stock has basically been flat over the last five years.\n\nBy the way, according to the company, 90% of United's 52 million customers worldwide are in the U.S. By its own statistics, the company covers about 12% to 13.5% of the U.S. population.\n\nGrowing enrollment is critical to EPS growth, but so too is underwriting margin. In the managed care and health insurance business, underwriting margin represents the core operational profitability generated directly from managing healthcare risk. It measures the financial return an insurer achieves strictly from collecting premiums and managing medical care. On the enrollment side, ACA marketplace-driven enrollment appears poised to decline, a headwind for revenue in a segment that had been a growth driver. Fortunately, it's a smaller piece of the enterprise than Medicare and Commercial. Commercial fee-based enrollment grew ~2.9% YoY between 2024 and 2025, while total Medicare enrollment grew 4.5%. The commercial segment growth may not look impressive as a headline number, but given the U.S.", "source": "CNBC Top News", "pub_date_str": "12 Oct 2026, 10:12 PM IST", "pub_date_relative": "11m ago", "cfa_topics": ["Financial Statement Analysis", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "LVMH fashion and leather sales slide in Q3, dashing sector hopes", "full_content": "Luxury bellwether LVMH on Monday reported worse-than-expected third-quarter organic sales growth as demand for its fashion and leather brands, including Louis Vuitton and Dior, deteriorated due to weak Chinese demand.\n\nThe trading update from the world's largest luxury group, and the first major sector player to report third-quarter results, is likely to heighten concerns that the $350 billion luxury industry, mired in a three-year slowdown, will struggle to regain momentum.\n\nOrganic sales, which strip out currency swings, rose 1% from a year earlier to \u20ac18.5 billion ($20.7 billion), missing analysts' expectations for growth of 1.3%, according to a Visible Alpha consensus.\n\nThe fashion and leather goods division, which generates nearly half of group revenue, posted a 5% fall in organic sales, against an expected 1.8% decline.\n\nEurope's leading luxury groups have lost around \u20ac330 billion in market value since the start of the year, with LVMH alone shedding roughly 40%.\n\nSales in Asia, dominated by China, fell 5% from a year earlier, while sales in the US rose 5%.\n\n\"In the third quarter specifically, Asia was penalised by a sharp macro-led deterioration in Chinese consumer sentiment, with a tangible impact on discretionary expenses,\" Chief Financial Officer Cecile Cabanis told analysts.\n\nChina's tax crackdown on wealthy individuals has become the latest headache for luxury brands, which are already grappling with the fallout from the Iran war and signs of slowing consumer spending in the US.", "source": "CNBC Top News", "pub_date_str": "12 Oct 2026, 10:12 PM IST", "pub_date_relative": "11m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Buying gold this festive season? Check tax rules on cash purchases, PAN requirement and limit on holding gold at home", "full_content": "Gold purchases typically pick up during the festive season in India, with many households buying jewellery, coins and bars for investment or as part of tradition. This uptick demand is often witnessed during Akshaya Tritiya and Dhanteras, as buying gold is considered auspicious on these occasions.\n\nWhile there is no blanket limit on how much gold a person can legally own, tax authorities may scrutinise holdings if the source cannot be explained. Here's what you need to know about tax rules on cash purchases, PAN requirement and the limits on holding gold at home without having to produce proof.\n\nIndia does not ban buying gold using cash, but it does restrict the amount that can be accepted in cash in certain circumstances. However, the burden of this compliance requirement lies on the seller and not the buyer.\n\nUnder Section 269ST of the Income-tax Act, an individual cannot receive \u20b9 2 lakh or more in cash in a single transaction, in a single day from one person, or in respect of transactions relating to one event or occasion. The same set of restrictions apply to gold purchases as well.\n\nThe rule is designed to prevent people from bypassing the cash limit by splitting payments across multiple invoices or days for the same purchase. Under Section 271DA, the penalty for violating this provision can be equal to the amount received in breach of the rule, and it is levied on the recipient.\n\nFor gold purchases made in cash, the recipient is the jeweller, giving them a strong incentive to refuse cash payments for high-value items.\n\nWhen the transaction value crosses \u20b9 2 lakh, jewellers are required to ask buyers to provide their Permanent Account Number ( PAN ) card for reporting and compliance purposes, as per income tax rules.\n\nProviding PAN does not override the restrictions on cash transactions. From 1 April 2026, Form 97 replaced the previous Form 60 for certain declarations by individuals who do not have a PAN.", "source": "LiveMint Money", "pub_date_str": "12 Oct 2026, 10:11 PM IST", "pub_date_relative": "12m ago", "cfa_topics": ["Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Cramer: Starbucks tells me Chipotle takeover won't happen and that's good for the stock", "full_content": "The Investing Club holds its \"Morning Meeting\" every weekday at 10:20 a.m. ET.", "source": "CNBC Top News", "pub_date_str": "12 Oct 2026, 10:07 PM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Exclusive-Moonshot execs in talks to settle dispute with shareholder ahead of planned IPO, people say", "full_content": "", "source": "Investing.com News", "pub_date_str": "12 Oct 2026, 10:06 PM IST", "pub_date_relative": "17m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "RBL Bank Q2 Results: Net Profit Nearly Triples To Rs 482 Crore, Asset Quality Improves", "full_content": "RBL Bank Q2 Results: RBL Bank announced its July-September quarter results for fiscal 2026-27 on Monday, Oct. 12 reporting a surge of 1705 in its standalone net profit to Rs 482 crore, compared to Rs 179 crore in the corresponding period last year.", "source": "NDTV Profit", "pub_date_str": "12 Oct 2026, 10:06 PM IST", "pub_date_relative": "17m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stock Market Today: Dow gains but S&P 500, Nasdaq slip as chip stocks dip and oil prices rise - MarketWatch", "full_content": "Stock Market Today: Dow gains but S&P 500, Nasdaq slip as chip stocks dip and oil prices rise MarketWatch Rising oil prices, falling technology stocks and reversing bond yields keep Wall Street unsettled AP News COMMENTARY: Morning Bid: Wall Street winces at bond squeeze Reuters U.S. Stocks Fall as Treasury Yields Test Multidecade Highs WSJ Stock Market News, Oct. 8, 2026: Oil Rises, Nasdaq Slips on Fresh Tanker Attack WSJ", "source": "Google News Business", "pub_date_str": "12 Oct 2026, 10:05 PM IST", "pub_date_relative": "18m ago", "cfa_topics": ["Equity Investments", "Fixed Income"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "S&P 500 is little changed to start the week; Micron leads tech lower: Live updates", "full_content": "The S&P 500 was little changed on Monday after the major averages posted a winning week and as investors looked ahead to a busy week of earnings results and inflation data.\n\nThe broad market index traded below the flatline, while the Dow Jones Industrial Average outperformed, trading up 206 points, or 0.4%. The Nasdaq Composite , however, was 0.3% lower.\n\nThe Nasdaq was weighed down by a 3% drop in shares of Micron Technology . The move came as investors assessed increasing competition from China's CXMT , which reported progress on a new chip structure . In contrast, the Dow was boosted by a more than 1% rise in Salesforce shares after the name received a double upgrade at Bank of America .\n\nMeanwhile, oil prices rose after President Donald Trump announced an \"energy ceasefire\" between Russia and Ukraine over the weekend, then Ukrainian President Volodymyr Zelenskyy said Moscow had already violated it . West Texas Intermediate futures advanced 2% to around $93 per barrel. Brent crude gained 2% to trade at $106 per barrel.\n\nTrump also told reporters he was considering joining Saudi Arabia in its fight against Tehran-backed Houthis in Yemen after another deadly attack on Riyadh's international airport. The remarks raised the prospect of escalating tensions in the region.\n\nWall Street is coming off a winning week for the major averages, as a rally in tech stocks helped investors shrug off higher oil prices and yields. The Dow and S&P 500 each posted their second positive week in three, while the Nasdaq netted its fourth straight week of gains.\n\nInvestors hope the third-quarter earnings season will help stocks power through the Middle East turmoil. By all estimations, the incoming results are expected to be strong. According to FactSet's John Butters, the S&P 500 is set to post 29.6% earnings growth in the quarter.", "source": "CNBC Top News", "pub_date_str": "12 Oct 2026, 10:00 PM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "\u2018I feel like a loser\u2019: My stock portfolio is swinging wildly. Is it finally time to worry?", "full_content": "\u201cI presume these are sophisticated investors taking a profit.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "12 Oct 2026, 10:00 PM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Financial Statement Analysis", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stock Market Today: Dow Edges Up, Oil Gains on Fresh Energy Strikes in Ukraine \u2014 Live Updates - WSJ", "full_content": "Stock Market Today: Dow Edges Up, Oil Gains on Fresh Energy Strikes in Ukraine \u2014 Live Updates WSJ Questions Over Trump-Russia Diesel and U.S-Iran Proposal: 8 Key Items Shaping the Stock Market Monday RealMoney Pro Daily Stock Market Report (Mon 12th Oct 2026) - POLR, SDG, WATR, AOM, THRU Stockopedia Trump's energy efforts, European bonds, retailers' inventory balancing act and more in Morning Squawk CNBC Europe\u2019s Stocks Rose As Oil Climbed After A Riyadh Attack Finimize", "source": "Google News Business", "pub_date_str": "12 Oct 2026, 10:00 PM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Biogen options flow points to short iron condor ahead of Oct. 16 expiry", "full_content": "", "source": "Investing.com News", "pub_date_str": "12 Oct 2026, 09:55 PM IST", "pub_date_relative": "28m ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Polycab India\u2019s F&O exit: NSE sets December 30 deadline; NCLAT stays insolvency order", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Polycab India\u2019s F&O exit: NSE sets December 30 deadline; NCLAT stays insolvency order Polycab India Share Price LG Electronics India Share Price Havells India Share Price R R Kabel Share Price Finolex Cables Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Polycab India\u2019s F&O exit: NSE sets December 30 deadline; NCLAT stays insolvency order SECTIONS Polycab India\u2019s F&O exit: NSE sets December 30 deadline; NCLAT stays insolvency order By Kumar Gaurav , Last Updated: Oct 12, 2026, 09:54:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis NSE will remove Polycab India from the equity derivatives segment from December 30, 2026, with existing contracts available until expiry. Separately, NCLAT has stayed the NCLT order admitting insolvency proceedings against the company over an alleged Rs 2.79 crore operational debt, pending further orders.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "12 Oct 2026, 09:54 PM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Derivatives"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "FTSE 100 today: Stocks climb as banks lead despite Gulf tension, oil rebound", "full_content": "", "source": "Investing.com News", "pub_date_str": "12 Oct 2026, 09:53 PM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "US stocks hover near their latest record in mixed trading on Wall Street - AP News", "full_content": "US stocks hover near their latest record in mixed trading on Wall Street AP News S&P 500 Hovers Near All-Time High Before Earnings: Markets Wrap Bloomberg.com S&P 500, Nasdaq 100, Dow End Week Higher With Traders Eyeing Earnings Season \u2014 MSFT, NFLX, SPCX, ASTS In Focus Yahoo Finance COMMENTARY: Morning Bid: Storm brewing Reuters Here\u2019s Why the S&P 500 Just Hit a New All-Time High Despite Rising Interest Rates Carson Group", "source": "Google News Business", "pub_date_str": "12 Oct 2026, 09:52 PM IST", "pub_date_relative": "31m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Government allows 5,841 tonnes of sugar export to EU under quota-based duty concession scheme", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a Government allows 5,841 tonnes of sugar export to EU under quota-based duty concession scheme The Economic Times daily newspaper is available online now. Read Today's Paper Government allows 5,841 tonnes of sugar export to EU under quota-based duty concession scheme SECTIONS Government allows 5,841 tonnes of sugar export to EU under quota-based duty concession scheme PTI Last Updated: Oct 12, 2026, 09:48:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis \"The quantity of 5,841 MT of sugar to be exported to the EU from India under TRQ (tariff rate quota) for the year 2026-27 (October 2026 to September 2027) has been notified,\" the Directorate General of Foreign Trade (DGFT) has said in a public notice dated October 9.\n\nBrinjal, buffalo, bacteria: Inside India\u2019s pay-for-nature system\n\nHomebuyers wait as NCLT panel picks holes in unfinished Jaypee projects\n\nThe NBFC saga - Part 3: How one default in 2018 changed the way RBI reads risk\n\nFour rules made HDFC Bank a compounder. All four have stopped. Can the new CEO rewrite them?\n\nWhat is the real impact of 13x jump in cash transfers to women?\n\nThe NBFC saga - Part 2: Line drawn in 2006 is reason for the headlines today\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "12 Oct 2026, 09:48 PM IST", "pub_date_relative": "35m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Rep. Ilhan Omar\u2019s home raided in federal criminal investigation", "full_content": "Federal authorities on Monday morning raided the Washington, D.C.-area home of Rep. Ilhan Omar , a Minnesota Democrat, as part of a criminal fraud investigation into her immigration paperwork filled out by her father, Fox News reported, citing a person familiar with the situation.\n\nHomeland Security Investigations, a division of the Department of Homeland Security , conducted the raid, Fox News reported. The Department of Justice later confirmed the raid after CNBC asked about it. DHS declined to comment.\n\nA person familiar with the situation, who spoke on condition of anonymity to discuss the non-public investigation, told CNBC that the investigation into Omar is complex and has been going on for years.\n\nMS NOW reported that a law enforcement source with direct knowledge of the raid said the investigation into Omar is based on allegations of fraud.\n\nOmar, 44, was born in Somalia and brought to the United States as a child. She became a U.S. citizen in 2000 at 17. She was elected to Congress in November 2018 to represent Minnesota's 5th District, which includes all of Minneapolis.\n\nShe and Rep. Rashida Tlaib, D-Mich., became the first two Muslim women elected to Congress.\n\nOmar has been a target of criticism by President Donald Trump , and heckled Trump during his State of the Union address to Congress on Feb. 24, which came on the heels of aggressive immigration enforcement actions in Minneapolis by federal authorities.\n\nThe Department of Justice, in a statement to CNBC when asked about the raid, said, \"Today in the Washington, D.C., area, Homeland Security Investigations executed a judicially authorized search warrant secured by the Department of Justice.\"", "source": "CNBC Top News", "pub_date_str": "12 Oct 2026, 09:46 PM IST", "pub_date_relative": "37m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "FMCG dividend giants: Colgate, Hindustan Unilever, ITC, Britannia: Which stock offers highest yield?", "full_content": "FMCG dividend giants: Colgate Palmolive (India), Hindustan Unilever Limited, ITC Limited and Britannia Industries Limited are among the key fast moving and consumer goods (FMCG) companies that have paid significant dividend to their shareholders over the past few years.\n\nAs the second quarter earnings for financial year 2026-27 begins, here\u2019s a comparison of top 4 FMCG stocks and their dividend payouts in one year.\n\nColgate Palmolive India has announced a total of \u20b9 48 per equity share dividend in the last one year. Which makes its annual dividend yield stand at 2.16% for the last one year. The stock closed 2.75% lower at \u20b9 1770 per share on BSE with an Mcap of \u20b9 48,141.46 crore on Monday. Its share price value has declined 20.5% in one year, 52% in two years, 14% in three years.\n\nHindustan Unilever Limited has announced \u20b9 41 per equity share dividend in last one year, and its annual dividend yield stood at 2.25%. The FMCG stock closed 2.10% lower at \u20b9 1822 per share on BSE. Its share price value has declined 25% in one year, 32% in two years, and 26% in three years.\n\nITC has announced \u20b9 14.50 per equity share dividend over the last one year. Its dividend yield stood at 3.63%. ITC share price ended 3.23% lower at \u20b9 257.60 per share on BSE on Monday. Its share price value has declined 36% in one year, 44% in two years and 39% in three years.\n\nBritannia Industries has announced \u20b9 90.50 per equity share dividend over the last one year. Its annual dividend yield stood at 1.54%. Shares of Britannia Industries closed marginally lower at \u20b9 4780 per share on Monday. The stock value has declined 18% in one year, and 20% in two years.\n\nOut of the four FMCG stock, ITC has the highest annual dividend yield of 3.63%.\n\nA stock's dividend yield is a ratio of the total annual dividend paid by the company to its share price. It shows how much an investor has earned from dividend of a stock, compared with its market price.", "source": "LiveMint Markets", "pub_date_str": "12 Oct 2026, 09:28 PM IST", "pub_date_relative": "54m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Fixed Income"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Trump defends Russia diesel deal after bipartisan pushback: 'I made the right choice'", "full_content": "President Donald Trump on Monday defended last week's decision to temporarily ease restrictions on Russian diesel fuel exports after the announcement drew bipartisan criticism .\n\nTrump, in a Truth Social post , accused the media of hypocrisy for allegedly refusing to cover past purchases of Russian energy by the European Union.\n\n\"The European Union paid Russia 250 Billion Dollars for Energy, and the Fake News Media doesn't want to get near that story,\" Trump wrote.\n\nWhile the president did not specify, his figure roughly tracks with some estimates of how much the EU has spent importing fossil fuels from Russia since the 2022 invasion of Ukraine. The European Commission has launched a plan to phase out its dependence on Russian energy.\n\n\"I made the right choice for the American People \u2014 ALWAYS, AMERICA FIRST!\" Trump wrote in the social media post.\n\nLawmakers from both parties raised concerns about Trump's decision to let Russia supply some diesel to the U.S. and global markets for the next six months.\n\nThe plan received pushback from multiple congressional Republicans who have urged Trump not to lift the U.S. ban on energy imports from Russia until its president, Vladimir Putin , ends the war against Ukraine.\n\n\"The United States should not provide Putin with a financial lifeline while Russia continues to kill Ukrainian civilians,\" a group of seven senators, including four Republicans, said in a joint statement on Sunday.", "source": "CNBC Top News", "pub_date_str": "12 Oct 2026, 09:25 PM IST", "pub_date_relative": "58m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Goldman Set To Lead Wall Street's Stock-Trading Haul", "full_content": "Analysts are forecasting a $4.5 billion haul from JPMorgan Chase & Co. and $2.6 billion of revenue from Bank of America Corp.'s equity traders.", "source": "NDTV Profit", "pub_date_str": "12 Oct 2026, 09:25 PM IST", "pub_date_relative": "58m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "When should you switch your financial advisor? 5 warning signs investors should watch for", "full_content": "Choosing a financial advisor is only the first step in managing your money. As an investor\u2019s income, financial goals and responsibilities change, the advice they receive must evolve too. But if conversations increasingly revolve around buying new financial products rather than reviewing existing investments, it may be time to reassess the relationship.\n\nA financial advisor should help investors make informed decisions based on their financial goals, risk appetite and investment horizon. The relationship should also involve regular portfolio reviews, clear explanations of recommendations and transparency about costs. When these elements are consistently missing, investors may need to consider whether their advisor is still serving their interests.\n\nSanjiv Bajaj, Joint Chairman and Managing Director of Bajaj Capital Ltd, identifies five warning signs investors should watch for: conversations dominated by new products, recommendations without adequate explanations, irregular portfolio reviews, unclear costs and poor communication.\n\n\u201cA good advisor relationship should get more valuable with time. The longer an advisor knows you, the more relevant and meaningful your conversations should become,\u201d Bajaj said.\n\nAn advisor repeatedly recommending new mutual fund schemes, insurance policies or other financial products without first reviewing the existing portfolio should prompt investors to ask questions.\n\nNew investments may sometimes be appropriate, but the recommendation should be based on the investor\u2019s overall financial position, rather than the availability of a new product.\n\n\u201cBefore suggesting something new, a good advisor should first understand what you already own, what each investment is meant to do for you, and whether anything needs to change,\u201d Bajaj said.\n\nInvestors should ask how a proposed investment fits into their existing portfolio, what purpose it serves and whether it addresses a specific financial need.", "source": "LiveMint Money", "pub_date_str": "12 Oct 2026, 09:24 PM IST", "pub_date_relative": "59m ago", "cfa_topics": ["Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Indian Gas Exchange secures Sebi's nod to float IPO", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a Indian Gas Exchange secures Sebi's nod to float IPO Indian Energy Exchange Share Price BSE Share Price Multi Commodity Exchange of India Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Indian Gas Exchange secures Sebi's nod to float IPO SECTIONS Indian Gas Exchange secures Sebi's nod to float IPO PTI Last Updated: Oct 12, 2026, 09:19:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Indian Gas Exchange Ltd has received approval from Sebi to launch an initial public offering. The proposed IPO is exclusively an offer for sale of equity shares by promoter Indian Energy Exchange Ltd. IGX aims to enhance its visibility and strengthen its brand image through this public listing. The company has been operational since June 2020 and reported increasing revenue in recent years.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "12 Oct 2026, 09:19 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Delta delays debut of Saudi Arabia service until March after Riyadh airport attacks", "full_content": "Delta Air Lines said it will delay the launch of its nonstop service between Atlanta and the Saudi capital Riyadh until March after several deadly attacks hit the city's airport there.\n\nDelta planned to begin the route on Oct. 23, with an Airbus A350-900 wide-body plane, in what would have marked the first nonstop commercial flight between the U.S. and Saudi Arabia operated by a U.S. airline.\n\nSince Thursday, more than 2,000 flights have been canceled to and from King Khalid International Airport in Riyadh, according to FlightAware. The deadly attacks, claimed by Yemen's Iran-backed Houthis, escalated Saturday, when a projectile struck a passenger terminal at the airport, officials said, killing at least 12 people and wounding more than 300.\n\nKing Khalid International Airport remains closed as of Monday.\n\n\"We remain in close contact with relevant government and aviation partners, including Saudia and Riyadh Air, as we monitor the situation,\" Delta said in a statement. \"Saudi Arabia remains an important market for Delta, and we are committed to serving the Kingdom for the long-term.\"\n\nDelta CEO Ed Bastian had told CNBC on Thursday that the airline hadn't yet decided whether to postpone the debut.\n\n\"Obviously, we were disappointed to see the news this week,\" he said. \"Safety is going to make the call.\"\n\nDelta's decision came after the Federal Aviation Administration on Sunday issued a warning for U.S. airlines.", "source": "CNBC Top News", "pub_date_str": "12 Oct 2026, 09:18 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Singularity AMC pays over Rs 40 lakh to settle AIF rule violation case with Sebi", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Singularity AMC pays over Rs 40 lakh to settle AIF rule violation case with Sebi The Economic Times daily newspaper is available online now. Read Today's Paper Singularity AMC pays over Rs 40 lakh to settle AIF rule violation case with Sebi SECTIONS Singularity AMC pays over Rs 40 lakh to settle AIF rule violation case with Sebi PTI Last Updated: Oct 12, 2026, 09:16:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Singularity AMC, a company rooted in Mumbai, has successfully resolved two significant matters with the Securities and Exchange Board of India (Sebi) concerning violations related to alternative investment funds. As part of the settlement, the firm has paid Rs 40.5 lakh. The infractions included not maintaining the required interest in the Singularity Equity Fund and excessive drawdowns in three of its schemes.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "12 Oct 2026, 09:16 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Nvidia, Micron, SK Hynix shares slump up to 5% as China's CXMT steps up challenge to global chipmakers - What it means", "full_content": "Major US chip stocks came under renewed selling pressure on Monday, October 12, following their recent rally, amid concerns over rising competition from Chinese memory chipmaker ChangXin Memory Technologies (CXMT).\n\nNvidia, which has been at the forefront of the AI-led rally, saw its shares fall 2% to an intraday low of $224.90. Broadcom, Advanced Micro Devices (AMD), and Intel declined 1.2%, 3.3%, and 3.6%, respectively.\n\nMarvell Technology, Micron, and SK Hynix shed 4.2%, 5%, and 4.3%, respectively. Other major technology stocks, including Amazon and Tesla, also fell by up to 1%.\n\nThe weakness dragged the Nasdaq Composite down 0.46% to an intraday low of 27, 240, while S&P 500 and Dow Jones Industrial Average with modest gains.\n\nChangXin Memory Technologies has reportedly announced significant progress in a new memory-cell design aimed at increasing storage density, an area of innovation also being pursued by the world's largest memory makers, including Samsung Electronics, SK Hynix, and Micron.\n\nCXMT aims to introduce a new server memory product based on the architecture by the end of 2026, company president Cao Kanyu said at an industry event in Shanghai over the weekend.\n\nAt the center of the development is the \u201c4F squared\u201d design, in which each memory cell occupies an area equivalent to four times the square of F, with F representing the minimum line width of a semiconductor. The structure enables higher storage density by allowing more cells to fit onto a single chip, according to the South China Morning Post .\n\nCXMT said the core of its 4F-squared design was its proprietary Vertical Surrounding Gate (VSG) transistor. The technology uses a vertical gate architecture to address current leakage while significantly reducing the area occupied by each memory cell and increasing storage density, according to the report.", "source": "LiveMint Markets", "pub_date_str": "12 Oct 2026, 09:15 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Jubilant Pharmova block deal: Quant Mutual Fund offloads Rs 190 crore stake amid Rs 800 crore fundraising plan; Abakkus buys 11 lakh shares", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Jubilant Pharmova block deal: Quant Mutual Fund offloads Rs 190 crore stake amid Rs 800 crore fundraising plan; Abakkus buys 11 lakh shares BSE Share Price Multi Commodity Exchange of India Share Price Indian Energy Exchange Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Jubilant Pharmova block deal: Quant Mutual Fund offloads Rs 190 crore stake amid Rs 800 crore fundraising plan; Abakkus buys 11 lakh shares SECTIONS Jubilant Pharmova block deal: Quant Mutual Fund offloads Rs 190 crore stake amid Rs 800 crore fundraising plan; Abakkus buys 11 lakh shares By Kumar Gaurav , ETMarkets.com Last Updated: Oct 12, 2026, 09:14:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Quant Mutual Fund sold 20.81 lakh shares of Jubilant Pharmova worth Rs 190.47 crore in bulk deals, while Abakkus Four2Eight Opportunities Fund bought 11 lakh shares. The transactions came as the pharmac
