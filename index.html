women?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "13 Oct 2026, 12:17 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Gold, silver prices today, 13 October: Rates flat as investors await US inflation data for Fed rate clues", "full_content": "Gold and silver prices: The price of the yellow metal in India's retail market was flat on Tuesday, 13 October, after the International Monetary Fund (IMF) warned that bond yields could see a \u2018disorderly\u2019 spike as debt and inflation risks worsen.\n\nThe IMF warned Tuesday that government bond yields could rise in a disorderly fashion as inflation rises, debt mounts, geopolitical uncertainty intensifies and AI-related borrowing pressures weigh on sovereign bond markets, according to a CNBC report .\n\nSubsequently, in the international markets, gold \u200bprices eased after touching \u200ba one-week high on \u200bMonday, pressured by a firmer dollar and higher oil prices, while investors awaited US inflation data for clues on the Federal Reserve\u2019s interest-rate trajectory.\n\nSpot \u2060gold \u200cslipped 0.6% to $4,170.62 per ounce, having hit its highest level since 2 October earlier in the session. US gold futures for December delivery dropped 0.5% to $4,195.10 per ounce.\n\nInvestors will look for remarks from Fed Chair Kevin Warsh , along with key inflation data, later this week to gauge future monetary policy. The decisions of the US Federal Reserve, along with how the ongoing war in the Middle East evolves, will play a critical role in deciding the future of commodity prices.\n\nDue to these developments, both 24-karat and 22-karat gold rates are trading flat across major cities in India. Silver prices were also trading sideways in the domestic bullion market.\n\nMCX gold rate on 13 October was trading 0.11% higher at \u20b9 1,49,930 per 10 grams. MCX silver futures were trading about 0.16% higher at \u20b9 2,23,640 per kg at around 11:13 am.\n\nDue to the ongoing geopolitical uncertainty stemming from the Middle East dispute and the Russia-Ukraine war, prices for 10g of 24K gold in Delhi have rallied by 20.78% over the last year, from \u20b9 1,27,460 on 13 October 2025 to \u20b9 1,51,640 on 12 October 12 2026.", "source": "LiveMint Money", "pub_date_str": "13 Oct 2026, 12:05 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Fixed Income", "Derivatives", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "AI\u2019s Giant Money Loop Is Drawing Foreign Cash Like 2008 - Bloomberg.com", "full_content": "AI\u2019s Giant Money Loop Is Drawing Foreign Cash Like 2008 Bloomberg.com The huge lurking leverage of AI hyperscalers Financial Times AI Boom Is Triggering \u2018Dutch Disease\u2019 In The US Economy, Warns Apollo\u2019s Torsten Slok \u2014 \u2018The Only Durable Fix Is\u2026\u2019 Yahoo Finance Das: AI\u2019s Cash Is Missing, and the Credit Risk Is Not Priced In Financial Sense Tech companies\u2019 AI debt issuance drops sharply in September Investing.com", "source": "Google News Business", "pub_date_str": "13 Oct 2026, 12:05 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Fixed Income"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Ola Electric Shares Adjust After Trading Ex-Rights Issue", "full_content": "Ola Electric Mobility's stock adjusts around 3% on the rights issue ex-date after rising over the previous two sessions as investors are concerned about the effect of the rights issue", "source": "NDTV Profit", "pub_date_str": "13 Oct 2026, 11:59 AM IST", "pub_date_relative": "1h Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "13 Oct 2026, 11:59 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Bandhan Bank share price jumps 8% today after 4% fall in a month | What's fuelling surge in banking stock", "full_content": "Bandhan Bank share price jumped over 8%, hitting an intraday high of \u20b9 171.68 per share on NSE, in Tuesday's trading session following reports that Abu Dhabi-based International Holding Company (IHC) was among the investors holding preliminary discussions to acquire a stake in the lender\u2019s promoter, Bandhan Financial Services (BFSL).\n\nIHC is the investment firm of Sheikh Tahnoon bin Zayed Al Nahyan, Abu Dhabi\u2019s deputy ruler and national security adviser. According to an Economic Times (ET) report, BFSL holds slightly more than one-third of Bandhan Bank\u2019s equity.\n\nThe proposed stake sale could also provide an exit route for Singapore\u2019s sovereign wealth fund GIC and the International Finance Corporation (IFC), which have backed the business for over a decade, the report said.\n\nAs of March 31, BFSL held 59.98% in Bandhan Asset Management Company and 97.16% in Bandhan Life Insurance Company. GIC and ChrysCapital are among the other investors in the asset management business.\n\nBandhan Financial Holdings Ltd held a 37.5% stake in Bandhan Bank at the end of June. Under the Reserve Bank of India\u2019s licensing requirements, the promoter is required to bring its shareholding down to 26% by 2030.\n\nThe report further noted that several Gulf-based banks and sovereign wealth funds have been approached regarding a potential investment in BFSL. These reportedly include First Abu Dhabi Bank and the Qatar Investment Authority, along with private equity firms such as Carlyle and EQT.\n\nBandhan Bank shares have gained 3.23% over the past week, indicating a recent recovery in the stock. However, the stock has declined 4.01% over the past month.\n\nOver a longer period, Bandhan Bank shares have delivered positive returns of 17.53% year to date, while gaining a modest 0.58% over the past year.", "source": "LiveMint Markets", "pub_date_str": "13 Oct 2026, 11:58 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Hyundai Bayon Launch: Expected Price, Features, Variants, Colours And More", "full_content": "Hyundai\u2019s 2026 Bayon is expected to launch in India on October 26, featuring dual 12.3-inch displays, advanced connectivity, a 1.5-litre petrol engine and manual or IVT options. Prices may range from Rs 10 lakh to Rs 17.5 lakh.", "source": "NDTV Profit", "pub_date_str": "13 Oct 2026, 11:56 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Up 50% in 6 months, Netweb Technologies shares fall 5% today: Should you buy, sell, or hold? Experts suggest this", "full_content": "Netweb Technologies shares fell 5% on Tuesday, October 13, to \u20b9 4,752 per share on the BSE, as investors booked profits following a sharp rally over the previous three trading sessions. The decline comes after the stock gained more than 14% during that period, raising questions about whether today's correction offers a buying opportunity or signals weakness.\n\nDespite Tuesday's fall, the stock has delivered positive returns over several periods. It gained 5% in one week and 13% in three months. It advanced 50% over six months and 29% over the past year, although it declined 1% in the last month.\n\nNetweb Technologies is currently 18% below its 52-week high of \u20b9 5,810, recorded in August 2026. However, it has risen 61% from its 52-week low of \u20b9 2,942.45, touched in December 2025.\n\nThe latest decline follows a strong short-term rally, making the stock's technical levels important for investors assessing its next move.\n\nNetweb Technologies' technical indicators suggest a possible recovery, but the stock faces key resistance levels after its recent rally.\n\nHitesh Tailor, Technical Research Analyst at Choice Broking, said the stock's long-term uptrend remained intact, supported by higher highs and higher lows. He noted that the stock had established a base near its 100-day exponential moving average (EMA) at \u20b9 4,604 and reclaimed its 50-day EMA at \u20b9 4,783.\n\n\u201cThe daily RSI has rebounded strongly from oversold levels to 54.94, signaling expanding bullish strength,\u201d Tailor said, pointing to improving momentum after the stock's retracement from its all-time high.\n\nAccording to Choice Broking, immediate support lies at \u20b9 4,780, followed by stronger structural support at \u20b9 4,600. On the upside, the stock faces resistance between \u20b9 5,100 and \u20b9 5,200. A sustained breakout above \u20b9 5,200 could open the way for a retest of its all-time high of \u20b9 5,813.", "source": "LiveMint Markets", "pub_date_str": "13 Oct 2026, 11:55 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "New India Assurance Share Price Erases Gains, Falls Over 3% In Trade", "full_content": "Harshal DasaniBusiness Head, INVAsset PMS explained the decline and advised traders to look at Monday's movement to understand why the shares slipped today.", "source": "NDTV Profit", "pub_date_str": "13 Oct 2026, 11:54 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Bumble\u2019s billion-dollar buyout: Why investors are betting on a turnaround", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News Powered By Bumble\u2019s billion-dollar buyout: Why investors are betting on a turnaround Written by Anupam Nagar , ETMarkets.com | Oct 13, 2026, 11:54:47 AM IST 1 / 5 \u200bBumble stock soars 50% Bumble shares surged nearly 50% on Monday after reports that the dating-app operator was in advanced talks to be taken private by Ithaca Holdings in a deal valuing the company at around $1 billion. The stock closed at $3.80, marking its biggest-ever single-session percentage gain, according to Reuters. (Sources: BBC News, Reuters, Benzinga)\n\nIthaca Holdings, a technology-focused holding company founded by former Sequoia Capital partner Ravi Gupta and former Meta executive John Hegeman, is the prospective buyer. The reported transaction could be announced as soon as this week, although negotiations could still fall through. Bumble founder Whitney Wolfe Herd is expected to remain involved and may roll part of her stake into the deal.\n\nBumble's reported buyout valuation marks a dramatic decline from its approximately $14 billion valuation around its 2021 stock market debut. The company's shares have fallen more than 90% from their initial public offering price of $43, reflecting weakening investor confidence and mounting concerns over its growth prospects.\n\nBumble's business challenges have intensified amid slowing growth in the online dating market. Revenue fell 15.2% year over year to $210.5 million in the second quarter of 2026, while paying users declined 16.4% to approximately 3.2 million. The company has been introducing AI-powered features and revamping its app to improve engagement and attract users back to the platform.\n\nA potential acquisition could give Bumble more time and flexibility to restructure its business away from the scrutiny of public markets.", "source": "Economic Times Markets", "pub_date_str": "13 Oct 2026, 11:50 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "HD Fire Protect IPO Day 1: 1.23x Subscribed; Check GMP, Price Band, Expected Listing Gains And Other Details", "full_content": "The HD Fire Protect IPO price band has been fixed at Rs 258 to Rs 271 per share, with a lot size of 55 shares. At the upper end of the price band, retail investors need a minimum investment of Rs 14,905 to apply for one lot. The IPO is scheduled to list on the BSE and NSE on October 21, 2026.", "source": "NDTV Profit", "pub_date_str": "13 Oct 2026, 11:47 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Warren Buffett became a millionaire at 32. What he advises youth trying to copy his success", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Warren Buffett became a millionaire at 32. What he advises youth trying to copy his success The Economic Times daily newspaper is available online now. Read Today's Paper Warren Buffett became a millionaire at 32. What he advises youth trying to copy his success SECTIONS Warren Buffett became a millionaire at 32. What he advises youth trying to copy his success By Debaroti Adhikary , ETMarkets.com Last Updated: ies receive \u20b9 6,000 annually in three equal instalments of \u20b9 2,000, generally paid every four months, according to Press Information Bureau (PIB) notification. The next instalment could arrive during the August-November payment cycle, but the government has not confirmed a date. Farmers should therefore treat expectations of an October payout as tentative.\n\nAs of today, the release timeline, date, and time remain unconfirmed, and farmers should rely only on the official government notification and updates on the official PM Kisan website, rather than on social media claims or speculation.\n\nIn this scheme, eligible farmers who have provided their updated details and meet the basic eligibility requirements receive financial assistance of \u20b9 6,000 annually, in three instalments of \u20b9 2,000 each. These funds are credited directly to the beneficiaries' bank accounts.\n\nFarmers can check their registration details, personal data and payment status online to identify any discrepancies or issues that may affect the receipt of benefits.\n\nFarmers can follow these steps to check their PM-Kisan registration and payment details:\n\nOnce the verification process is complete, the portal will display the available details of your registration and payment status.\n\nIf the instalment has been released and the funds have not yet reached the registered bank account, check the portal for any pending requirements or payment-related issues.", "source": "LiveMint Money", "pub_date_str": "13 Oct 2026, 11:46 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "IPO GMP: Zetwerk vs HD Fire Protect vs Fusion CX vs Bonfiglioli vs Tonbo? Check grey market premium winner", "full_content": "India\u2019s primary market is set for a busy week, with six IPOs opening between 13 October and 15 October. HD Fire Protect has already launched its public issue, with the issue fully subscribed in less than two hours. Fusion CX will open on 14 October, while Zetwerk Manufacturing Business, Tonbo Imaging India, Bonfiglioli Transmissions and Sahajanand Medical Technologies are scheduled to hit the market on 15 October.\n\nTonbo Imaging IPO is the clear winner in the grey market, with a GMP of \u20b9 425, indicating an estimated listing premium of 60.71%. HD Fire Protect follows with a 31.37% premium, while Bonfiglioli Transmissions commands a 26.45% premium.\n\nFusion CX is the weakest performer, with a GMP of \u20b9 19 and an estimated listing premium of 6.57%, the lowest among the six IPOs.\n\nHD Fire Protect IPO GMP today, or grey market premium, is +85. Considering the upper end of the IPO price band and the current premium in the grey market, the estimated listing price of HD Fire Protect share price was indicated at \u20b9 356 apiece, which is 31.37% higher than the IPO price of \u20b9 271.\n\nIn the past seven sessions, the IPO GMP has shown a consistent pattern, with fluctuations confined to \u20b9 5 and a GMP range of \u20b9 23. The present IPO GMP is at \u20b9 85, reflecting a stable sentiment in the grey market. According to experts, the current GMP suggests an anticipated listing price of approximately \u20b9 356, compared with the IPO issue price of \u20b9 271.\n\nHD Fire Protect IPO opened on 13 October and closes on 15 October, with a price band of \u20b9 258\u2013 \u20b9 271 per share. The \u20b9 678\u2013 \u20b9 712.13 crore issue is entirely an offer for sale (OFS) of 2.63 crore shares by promoters Harish Narshi Dharamshi and Kusum Harish Dharamshi. The company will not receive any proceeds from the issue.\n\nFusion CX IPO GMP today, or grey market premium, is +19.", "source": "LiveMint Markets", "pub_date_str": "13 Oct 2026, 11:44 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Nifty 50 earnings may surge in Q2, but the road ahead is rocky", "full_content": "Metals, banks and consumer-facing companies are expected to lead the Nifty 50\u2019s net profit growth, but a delayed crude oil shock and limited pricing power could put FY27 earnings estimates at risk.", "source": "LiveMint Markets", "pub_date_str": "13 Oct 2026, 11:19 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Shringar House of Mangalsutra share price jumps 15% today | 47% returns in 2026 | Check target, stop loss | Buy or sell?", "full_content": "The jewellery stock opened at \u20b9289 per share on NSE today, as compared to previous close of \u20b9265.35 on Monday and touched an intraday high of \u20b9303.85 on 13 October.", "source": "LiveMint Markets", "pub_date_str": "13 Oct 2026, 11:15 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "RBL Bank share price crashes 8% after Q2 results - Should investors buy, sell, or hold the stock? Experts decode", "full_content": "RBL Bank share price opened at \u20b9401.95 against its previous close of \u20b9420 and crashed 7.7% to an intraday low of \u20b9387.85.", "source": "LiveMint Markets", "pub_date_str": "13 Oct 2026, 11:09 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Polycab India F&O ban from Dec 30: Stock falls 5%; Key dates, trading rules, and what happens next", "full_content": "Polycab India shares fell more than 5% after the NSE said it would stop offering new futures and o tement Analysis", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "SBI Research calls for abolition of LTCG tax on equities to boost foreign capital inflows", "full_content": "According to SBI Research, removing the long-term capital gains tax on equities could revitalize investment levels. The report emphasizes extending the holding period to two to three years as a strategy to boost investor morale. Faced with foreign portfolio outflows, the need for policy reforms is clear.", "source": "Economic Times Economy", "pub_date_str": "13 Oct 2026, 10:53 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Gold prices rise to Rs 1.50 lakh/10g; silver gains ahead of US economic data. Key levels to track", "full_content": "Gold and silver prices opened higher on MCX as investors awaited US inflation data for clues on the Federal Reserve\u2019s rate outlook, while a firm dollar and geopolitical tensions kept precious metals volatile.", "source": "Economic Times Markets", "pub_date_str": "13 Oct 2026, 10:49 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "India bonds rise as investors see value after 10-year yield nears 7.40%", "full_content": "The Indian bond market experienced a surge as value investors jumped in, increasing demand significantly. After hitting a three-year peak, the benchmark 6.94% 2036 bond yield took a slight dip. Anticipation is mounting among investors for substantial debt issuance from the Reserve Bank of India and various states later this week.", "source": "Economic Times Markets", "pub_date_str": "13 Oct 2026, 10:37 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Fixed Income", "Portfolio Management"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "S&P 500 futures are mixed ahead of bank earnings; South Korea's Kospi falls below 6,000: Live updates - CNBC", "full_content": "S&P 500 futures are mixed ahead of bank earnings; South Korea's Kospi falls below 6,000: Live updates CNBC US stocks hover near their latest record in mixed trading on Wall Street AP News Nasdaq falls ahead of earnings, economic data while oil rallies Reuters Stock market today: Dow gains, S&P 500 and Nasdaq slip as focus turns to earnings season kickoff Yahoo Finance S&P 500 Wavers as Earnings Bets Offset Chip Rout: Markets Wrap Bloomberg.com", "source": "Google News Business", "pub_date_str": "13 Oct 2026, 10:34 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Dividend stock 2026: This media stock gives 14% dividend yield in YTD | Beats bank FD, PPF interest rate", "full_content": "The dividend paying Indian stock traded ex-dividend for just once on 5 June 2026 for finalising the list of eligible shareholders for the payment of \u20b97 per share interim dividend and \u20b93 per share final dividend", "source": "LiveMint Markets", "pub_date_str": "13 Oct 2026, 10:32 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Corporate Issuers", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "India\u2019s pension system has a blind spot: those already old", "full_content": "India\u2019s pension system is getting better at helping people save for retirement. But for older informal workers with little pension income, reverse mortgages could turn home equity into a financial lifeline.", "source": "LiveMint Money", "pub_date_str": "13 Oct 2026, 10:31 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Rs 26,340 crore added in minutes! Why HCL Tech, TCS and other IT stocks rallied up to 7%", "full_content": "Indian IT stocks rallied up to 7%, with the Nifty IT index gaining 3.3%, as concerns over rising AI investment costs and uncertain returns rattled global technology stocks. Broadcom and Intel executives flagged capital constraints, prompting investors to reassess the AI boom. Separately, OpenAI told investors its September annualised revenue was nearly $50 billion, below its earlier indicated figure of $70 billion.", "source": "Economic Times Markets", "pub_date_str": "13 Oct 2026, 10:30 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "IMF warns bond yields could see a 'disorderly' spike as debt, inflation risks worsen", "full_content": "The IMF says risks in the government bond market have worsened and that yields could jump sharply and disorderly.", "source": "CNBC World Economy", "pub_date_str": "13 Oct 2026, 10:24 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Global Market: China's yuan holds near 3-year high despite strong dollar; PBOC fixing supports currency", "full_content": "China\u2019s yuan remained near a three-year high against the dollar, supported by central bank guidance and strong foreign exchange settlement. However, elevated US Treasury yields and geopolitical tensions limited gains. The PBOC set its strongest midpoint since February 2023, while analysts expect modest appreciation amid trade surpluses and policy uncertainty.", "source": "Economic Times Markets", "pub_date_str": "13 Oct 2026, 10:21 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}], "updated_at": "13 Oct 2026, 01:21 PM IST", "total_stories": 331};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>

</body>
</html>
