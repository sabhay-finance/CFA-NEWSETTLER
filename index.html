e for EVs", "full_content": "", "source": "Investing.com News", "pub_date_str": "03 Oct 2026, 05:35 PM IST", "pub_date_relative": "35m ago"}, {"title": "India's Gulf Oil Imports Jump In September As Suppliers Find Way Around Hormuz Risk", "full_content": "Iraq, Saudi Arabia and Kuwait sharply increased oil shipments to India in September as ship-to-ship transfers helped navigate Strait of Hormuz risks.", "source": "NDTV Profit", "pub_date_str": "03 Oct 2026, 05:35 PM IST", "pub_date_relative": "35m ago"}, {"title": "Meta's Muse can shop and check out for you. Here's how it works", "full_content": "Meta's new artificial intelligence agent Muse promises to make everything from booking appointments to building playlists easier, but its rollout of agentic shopping, in particular, has the tech and retail realms buzzing.\n\nShopping has quickly become one of Muse's biggest usage drivers, a Meta spokesperson said.\n\nAfter an initial setup, shopping is as easy as asking your Muse agent to find an item you are interested in. You can be as specific as you want about brands, price and availability.\n\nThe agent will browse retail sites to scan for items that fit your request, then offer suggested listings within the Muse app and website. Clicking a listing will either open straight to the retail website or open within the Muse app, which will feature a button to check out with your agent.\n\nIf you choose to check out with Muse, it will prep the checkout for you and show you an \"approval card\" with order details for you to confirm. If you haven't given Muse access to your email, full name and address, it will need that as well. For payment, Muse can check out with Meta's tech payment partners like Link by Stripe or Shopify Shop Pay, which you have to connect to.\n\nLink \"generates a one-time-use card so your real card details stay hidden,\" according to Meta.\n\nPayPal has also been announced as a Muse payment provider, but isn't available yet.\n\nMeta CEO Mark Zuckerberg said at Meta Connect that the company will take a small fee on transactions.", "source": "CNBC World Economy", "pub_date_str": "03 Oct 2026, 05:30 PM IST", "pub_date_relative": "40m ago"}, {"title": "High-tech vehicles are driving up auto repair costs for shops and consumers", "full_content": "Increasingly sophisticated vehicles are forcing repair shops to spend more on computers, software and calibration equipment \u2014 costs that mechanics say are reaching consumers.\n\nAuto mechanic Ralph Czeisler in Brooklyn, New York, said the rapid pace of technological change is forcing him to invest more time and money just to perform even basic repairs, and he is having to pass those costs on to consumers.\n\n\"Every year, I update all my computers,\" said Czeisler, who owns Emil's All-Tire in the Gravesend neighborhood. \"I have multiple computers for domestic, Asian, European cars, and it's very costly. Every year they make changes, and it costs more money and more money. And it's getting very challenging.\"\n\nMany mechanics across the U.S. face the same problems, said Greg Brannon, director of automotive engineering at AAA.\n\n\"The repairs of these vehicles are so sophisticated now and almost always require a laptop,\" he said.\n\nSometimes it's a laptop dedicated to that brand of vehicle, he added. The shop also needs subscriptions to software and data services to perform repairs on the car, which can be purchased for varying degrees of time, ranging from a few hours to a year. Those recurring costs can be difficult for a smaller shop to absorb.\n\n\"It has become increasingly financially difficult for independent shops to be able to service all makes and models,\" Brannon said.\n\nCzeisler said he is passing at least some of these costs on to consumers.", "source": "CNBC Top News", "pub_date_str": "03 Oct 2026, 05:30 PM IST", "pub_date_relative": "40m ago"}, {"title": "Private capital is reshaping Hollywood moviemaking", "full_content": "At the Toronto International Film Festival last month, audiences saw \"Wicked\" star Cynthia Erivo return to the big screen for her newest movie, \"Prima Facie.\"\n\nWhile \"Wicked\" was a massive Universal undertaking, Erivo's new movie was produced in part by Camelback Productions, a smaller Hollywood venture aiming to fund independent film, according to CEO Anita Verma-Lallian.\n\nShe's one of many private investors who are betting big on Hollywood as the moviegoing landscape shifts and a handful of indie films catch fire.\n\n\"It's a different point of view to invest in these projects,\" Verma-Lallian said. \"It's been so hard for people that are not in Hollywood to get into the industry ... We've been able to fund stories that otherwise would have had a hard time getting greenlit by the traditional studio system.\"\n\nCamelback has also produced films \"Doin' It\" and \"Runner,\" with stars such as Lilly Singh and Owen Wilson.\n\nBig blockbuster films such as this year's \"The Odyssey\" and \"The Devil Wears Prada 2\" are still the domain of legacy Hollywood studios. But with the number of annual releases dwindling, and with forthcoming consolidation among major players Paramount and Warner Bros. Discovery , there's growing opportunity for smaller production companies to hit it big.\n\nAnd while the business of making movies is still generally capital-intensive, recent breakouts including \"Backrooms\" and \"Obsession\" have found success on lower budgets.\n\nTo thread the needle, private capital is buying into production companies, acquiring the infrastructure and diving deeper into the financing structure of entertainment. For example, private equity firm Silver Lake backs talent agency WME, and Blackstone is behind content studio Candle Media.", "source": "CNBC Top News", "pub_date_str": "03 Oct 2026, 05:30 PM IST", "pub_date_relative": "40m ago"}, {"title": "My wife never went back to work after raising our kids. Do I have to share my retirement savings 50/50?", "full_content": "\u201cFor 14 years I have gotten up every morning and gone to work while she has been free to pursue whatever interested her.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "03 Oct 2026, 05:30 PM IST", "pub_date_relative": "40m ago"}, {"title": "I bought a $126 concert ticket for my sister and now she can\u2019t go. Will I be able to make a profit selling the ticket?", "full_content": "\u201cI\u2019m having trouble accepting that I\u2019ll probably lose some money.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "03 Oct 2026, 05:30 PM IST", "pub_date_relative": "40m ago"}, {"title": "Work From Hills: WFH here may be cheaper than your city accommodation; check rates in Himachal Pradesh, Uttarakhand", "full_content": "Working from the hills may cost less than renting accommodation in some Indian cities. Airbnb and HomeStays of India listings show options across several hill destinations. However, savings depend on your chosen stay and the current city rent.\n\nAirbnb lists a homestay room in Naggar, Himachal Pradesh, for \u20b9 18,898 per month. The room has one double bed and one bathroom. It carries a five-star rating from four reviews.\n\nMahajan Villa in Naggar costs \u20b9 22,876 monthly. This mountain-view room has one double bed and one bathroom. Its rating is 4.92 from 65 reviews, with a guest favourite label.\n\nSunny Days Homestay in Naggar is listed at \u20b9 29,368 monthly. This home offers one bedroom, two double beds and one bathroom. Serena I by Xtatstays, in Himachal\u2019s Manyashi, costs \u20b9 25,488 monthly. Its listing mentions Deohari, Sainj, Kullu, and shows a guest favourite label.\n\nKaza, situated at 11,980 feet along the Spiti River, offers monthly accommodation for as low as \u20b9 25,517. Diksha Homestay in Darjeeling, West Bengal, starts at a monthly rate of \u20b9 21,400.\n\nRangbul la Bag Packers Hostel in Darjeeling costs \u20b9 22,698. A guesthouse in Gangtok, Sikkim, costs \u20b9 20,570. There are several other homestays in Gangtok that come under \u20b9 25,000. Yes, all these places offer wi-fi as well.\n\nShimla also offers an option aimed at people working remotely. ChillHost's Solo Workation Stay advertises fast Wi-Fi and costs \u20b9 20,574 monthly.. It provides one small double bed and one bathroom.\n\nHomeStays of India displays weekly prices, offering another comparison. Cozy Courtyard Homestay in Uttarakhand\u2019s Chamoli costs \u20b9 4,000 weekly. Four weeks would cost \u20b9 16,000 at that rate. Pahadi Living in Uttarakhand\u2019s Pauri costs \u20b9 5,500 weekly. Snow Whisper in Old Manali, Himachal , costs \u20b9 5,900 weekly.", "source": "LiveMint Money", "pub_date_str": "03 Oct 2026, 05:27 PM IST", "pub_date_relative": "43m ago"}, {"title": "Tata Motors PV Q2 Business Update: JLR Wholesale Volumes Up 24.5%, Retail Sales Decline", "full_content": "The company said the growth in wholesale volumes reflects a recovery from the impact of a cyber incident a year ago.", "source": "NDTV Profit", "pub_date_str": "03 Oct 2026, 05:11 PM IST", "pub_date_relative": "58m ago"}, {"title": "TCS, Infosys, Wipro shares ahead of Q2 results: Explained | What Accenture's strong earnings mean for Indian IT stocks", "full_content": "Accenture\u2019s fourth-quarter results have given global technology investors a fresh reason to look beyond the immediate concerns around artificial intelligence-driven disruption. Strong bookings, accelerating adoption of advanced AI projects and better-than-expected revenue growth sent Accenture shares sharply higher, while US-listed shares of Indian IT companies Infosys and Wipro also rallied overnight.\n\nThe reaction matters for Indian IT because Accenture is often viewed as an important read-through for technology spending by global enterprises. Its latest numbers suggested that companies were moving beyond AI experimentation and increasingly committing to larger transformation projects.\n\nHowever, the outlook for Indian IT remained more measured, with pricing pressure, AI-led productivity gains and subdued discretionary spending still expected to constrain reported growth.\n\nThe IT sector has taken a sharp beating in September, with the Nifty IT index falling 11% and emerging as the worst-performing sectoral index during the month.\n\nThe sell-off was broad-based, with several large and mid-cap IT stocks witnessing significant declines. LTM fell around 13%, while TCS declined around 12%. Wipro and Infosys dropped around 10% each, followed by Mphasis with a 9% fall. Coforge declined around 7%, L&T Tech, HCL Technologies slipped 6%, while Persistent Systems and Tech Mahindra fell more than 5%.\n\nAccenture reported 7% year-on-year growth in fourth-quarter revenue in constant currency, while full-year revenue growth stood at 5%, ahead of its earlier 3\u20134% guidance. For FY27, the company guided for constant-currency revenue growth of 3\u20136%, indicating continued growth but also reflecting a still-dynamic macro environment.\n\nThe strongest signal came from bookings. Accenture recorded 141 bookings worth more than $100 million during the quarter, while total new bookings stood at $22.4 billion, up 4% year-on-year.", "source": "LiveMint Markets", "pub_date_str": "03 Oct 2026, 05:08 PM IST", "pub_date_relative": "1h ago"}, {"title": "Neelkanth Mishra Says Global Market Stress Already Visible, Fuel Prices And Bond Yields Rising", "full_content": "Global market stress is already feeding into fuel demand, bond yields and borrowing costs, while India is seeing revived credit growth and sticking to fiscal deficit targets, Neelkanth Mishra said.", "source": "NDTV Profit", "pub_date_str": "03 Oct 2026, 05:08 PM IST", "pub_date_relative": "1h ago"}, {"title": "Flydubai co-pilot attacked pilot with axe in attempted \u2019terrorist attack\u2019, UAE says", "full_content": "", "source": "Investing.com News", "pub_date_str": "03 Oct 2026, 05:06 PM IST", "pub_date_relative": "1h ago"}, {"title": "Vaishali Parekh's top 3 stocks to buy: HDFC Bank, NRB Bearings, Lalithaa Jewellery | Target, stop-loss, market outlook", "full_content": "Vaishali Parekh's top 3 stock recommendations: In the truncated trading week, the benchmark indices corrected sharply. The Nifty 50 index ended down by 3.10%, while the Sensex fell nearly 2000 points. Among the sectors, almost all major sectoral indices saw profit-booking at higher levels. The Consumer and Auto indices lost the most: Consumer stocks corrected 6.15%, and Auto stocks fell 5.85%.\n\nThe market consistently faced selling pressure at higher levels during the week. On the weekly charts, it formed a long bearish candle. On the intraday charts, it continued to make lower highs and lower lows, indicating a largely negative trend.\n\nVaishali Parekh, Vice President \u2014 Technical Research at Prabhudas Lilladher, believes the Indian stock market bias has weakened after the crash across all four sessions last week. The Prabhudas Lilladher expert said the Nifty 50 index has crucial support placed at 21,800. A decisive break below this support may further intensify selling pressure.\n\nSpeaking on the outlook for the Nifty 50 index, Vaishali Parekh said, the 50-stock index witnessed another day of free fall with heavy selling pressure to almost touch the previous low made near the 22,180 zone, and finally, amid some volatility, managed to close just above the 22,400 zone with the overall bias and sentiment shattered as of now.\n\n\u201cThe Nifty 50 index would have the crucial support near the 22200 zone and thereafter, has the major and important level near the 21800 zone, which needs to be sustained, failing which the overall trend would turn weak and can invite further intensified selling pressure. Some revival cannot be ruled out, but needs to sustain above the 23000 zone,\u201d said Parekh.\n\nRegarding stocks to buy on Monday , Vaishali Parekh recommended these three shares: HDFC Bank , NRB Bearings , and Lalithaa Jewellery Mart.\n\n2] NRB Bearings: Buy at \u20b9 540 | Target \u20b9 560 | Stop Loss \u20b9 530; and\n\n3] Lalithaa Jewellery Mart: Buy at \u20b9 385 | Target \u20b9 420 | Stop Loss \u20b9 375.", "source": "LiveMint Markets", "pub_date_str": "03 Oct 2026, 05:00 PM IST", "pub_date_relative": "1h ago"}, {"title": "As Treasury yields touch generational highs, investors brace for the market fallout", "full_content": "The surge in bond yields to generational highs has investors around the world watching and worrying about what could crack, spiral or leave a trail of carnage in its path.", "source": "MarketWatch Top Stories", "pub_date_str": "03 Oct 2026, 05:00 PM IST", "pub_date_relative": "1h ago"}, {"title": "\u2018I don\u2019t want to die on the sales floor\u2019: I\u2019m 67 and earn $19.50 an hour at a big-box store. When can I finally retire?", "full_content": "\u201cI started taking Social Security at 66 and receive $2,410 a month. I have $214,000 in my 401(k).\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "03 Oct 2026, 05:00 PM IST", "pub_date_relative": "1h ago"}, {"title": "Powerful Explosions Rock Yemen's Capital Sanaa: Report", "full_content": "Explosions Shake Yemen's Capital Amid Renewed Clashes", "source": "NDTV Profit", "pub_date_str": "03 Oct 2026, 04:49 PM IST", "pub_date_relative": "1h ago"}, {"title": "India Champions vs Australia Champions: When And Where To Watch WCL 2026 Match", "full_content": "Yuvraj Singh leads India Champions against David Warner's Australia Champions in the WCL 2026, with the match starting at 5 PM and live on Star Sports and FanCode.", "source": "NDTV Profit", "pub_date_str": "03 Oct 2026, 04:48 PM IST", "pub_date_relative": "1h ago"}, {"title": "India can sustain around 7% growth despite global concerns: Nilesh Shah", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Indicators \u203a India c in the wrong place, and technical difficulties with the vehicles' butterfly doors o r trunk closing improperly.\n\nImproving its driverless technology and rapidly growing the Robotaxi service are key to Tesla's effort to reignite investor enthusiasm. Auto sales have been sluggish for an extended period, and the shares have been a loser on Wall Street this year, down 18%, the only megacap tech stock that's failed to generate positive returns for investors.\n\nOn Friday, Tesla reported better-than-expected vehicle deliveries for the third quarter, lifting the stock almost 5%, but the company still showed a 2% year-over-year drop in deliveries. Tesla's core automotive business has experienced consecutive annual revenue declines, as it faces pressure from Chinese EV makers like BYD and Xiaomi, which are selling more affordable, innovative models while they ramp up exports to key Tesla markets, especially across Europe and Asia.\n\nMeanwhile, Alphabet's Waymo continues to open in new cities. It's now in 15 U.S. markets, with 15 more on the horizon, according to the company's website . It's also announced planned international launches in London, Tokyo and Munich.\n\nIn Texas, Waymo had 1,154 autonomous vehicles authorized for commercial use as of Friday, including 359 of its new Ojai models, which feature a low step and doors that slide open and shut.", "source": "CNBC World Economy", "pub_date_str": "03 Oct 2026, 04:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "David Ellison just brought in a co-CEO to run his new empire: Meet Ynon Kreiz", "full_content": "David Ellison has spent two years fighting to build his media empire. Now, he's bringing in a heavyweight to help him run it.\n\nYnon Kreiz, outgoing CEO of Mattel , will serve as co-CEO of the combined Paramount Skydance and Warner Bros. Discovery , to be named simply Skydance , when the merger closes on Tuesday.\n\nThe new entity will unite the storied film studios of Paramount and Warner Bros.; the CBS broadcast network; a sprawling portfolio of pay-TV networks that include CNN, TNT, MTV and BET; and streaming services Paramount+ and HBO Max, all under one roof.\n\nThe appointment of Kreiz to a top executive position alongside Ellison speaks to a governance question that has surrounded Ellison's aggressive pursuit of the legacy media assets: The tech executive and son of billionaire Larry Ellison can buy it, but can he lead it?\n\nNot even 18 months ago, Ellison was the CEO of film production company Skydance with a limited portfolio of hits , namely the Tom Cruise-led Mission: Impossible franchise and \"Top Gun: Maverick.\"\n\nBy August 2025, he was successfully closing an acquisition of Paramount, a deal worth around $8 billion . Roughly a month later, he started his campaign for WBD, spurring a back-and-forth bidding war that would ultimately result in a deal worth roughly $110 billion on an enterprise basis to merge two of Hollywood's biggest media companies.\n\nKreiz is a 30-year veteran of the media space, arguably best known for ushering \"Barbie\" to the big screen in 2023. He's earned a reputation as a turnaround man, with roots in entertainment despite his more recent stint in consumer goods.\n\nHe joins Paramount Skydance on Monday , and becomes co-CEO on Tuesday upon closing.", "source": "CNBC Top News", "pub_date_str": "03 Oct 2026, 04:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "These companies look set to face high-profile hearings and other scrutiny if Democrats win the House", "full_content": "Law and lobbying firms in Washington, D.C., are telling companies to prepare for a new level of scrutiny, since most modern midterm elections result in some loss of congressional control for the party that holds the White House.", "source": "MarketWatch Top Stories", "pub_date_str": "03 Oct 2026, 04:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "FSSAI Finds Nestle Low Fat Dairy Whitener At The Lalit In Delhi 'Unsafe' And 'Substandard'", "full_ of the rural economy?\n\nSix months after oil spiked, why are markets reacting so sharply now?\n\nGold paradox: Why India, a refining giant, is not a big bullion exporter\n\nA refinery is not a laptop: Why America's diesel problem can't be switched off\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "03 Oct 2026, 04:15 PM IST", "pub_date_relative": "1h ago"}, {"title": "As public fears of AI grow, Trump digs in on voluntary safeguards", "full_content": "", "source": "Investing.com News", "pub_date_str": "03 Oct 2026, 04:12 PM IST", "pub_date_relative": "1h ago"}, {"title": "57+ Early October Prime Day deals worth shopping before the sale officially starts \u2014 updated live - NBC News", "full_content": "57+ Early October Prime Day deals worth shopping before the sale officially starts \u2014 updated live NBC News October Prime Day 2026: The best Amazon deals from Hanes, Carhartt, Apple and more before Prime Big Deal Days Yahoo Psst! Prime Members Get First Dibs on These Amazon October Prime Day Deals \u2014 Must-Have Finds Start at $5 People.com Prime Big Deal Days: Our biggest deals to kick off fall and holiday shopping October 6-7 About Amazon Watching Thursday Night Football? Here\u2019s another reason to try Prime USA Today", "source": "Google News Business", "pub_date_str": "03 Oct 2026, 04:08 PM IST", "pub_date_relative": "2h ago"}, {"title": "FPIs pull out over \u20b935,000 cr in Indian stocks in Sept: Why SEBI\u2019s easier access reforms alone may not help", "full_content": "Foreign portfolio investors (FPIs) returned to selling Indian equities in September after two consecutive months of inflows, highlighting a problem that goes beyond the ease of entering the Indian market.\n\nWhile the Securities and Exchange Board of India (SEBI) has been working with the Reserve Bank of India (RBI) to simplify onboarding and reduce regulatory friction, foreign investors continue to weigh India against competing markets on the basis of returns, yields, currency and global risk.\n\nFPIs withdrew \u20b9 35,860 crore from Indian equities in September, according to depository data reported after the close of the month. This came after they invested \u20b9 20,200 crore in July and \u20b9 29,630 crore in August, marking a sharp reversal in foreign flows.\n\nThe September selling also came as Indian equities suffered a steep correction. The Nifty 50 and Sensex declined almost 6% each.\n\nSEBI Chairman Tuhin Kanta Pandey has made it clear that the regulator is trying to address the operational hurdles faced by foreign investors.\n\nSpeaking to Moneycontrol on October 3, Pandey said SEBI had already eased the onboarding process and access for FPIs and was working with the RBI on further measures.\n\n\u201cWe have eased their onboarding process, eased their access. We are working with the Reserve Bank of India (RBI) on further steps. We have to move forward in a collaborative manner,\u201d Pandey said.\n\nThe regulatory push includes faster and digital FPI registration, streamlined KYC requirements and measures to reduce documentation and operational costs. SEBI has also introduced measures for trusted foreign investors, while further easing regulatory requirements for FPIs investing only in government securities.", "source": "LiveMint Markets", "pub_date_str": "03 Oct 2026, 04:06 PM IST", "pub_date_relative": "2h ago"}, {"title": "Trump Visa Policies Drive Drop In Columbia Journalism Applications, Admissions Paused: Report", "full_content": "Trump administration visa uncertainty has sharply reduced international applications to Columbia Journalism School, prompting a one-year pause in M.A. admissions as the programme is reviewed.", "source": "NDTV Profit", "pub_date_str": "03 Oct 2026, 04:03 PM IST", "pub_date_relative": "2h ago"}, {"title": "US-Russia talks on Ukraine involve multi-billion dollar oil deal, NYT reports", "full_content": "", "source": "Investing.com News", "pub_date_str": "03 Oct 2026, 04:00 PM IST", "pub_date_relative": "2h ago"}, {"title": "India vs Brazil Live Streaming, Telecast: Likely Lineups; How To Watch FIFA Friendly On TV, Online?", "full_content": "The match will be played at the Vivekananda Yuba Bharati Krirangan, popularly known as the Salt Lake stadium, in Kolkata.", "source": "NDTV Profit", "pub_date_str": "03 Oct 2026, 04:00 PM IST", "pub_date_relative": "2h ago"}, {"title": "Aman Sehrawat Stuns World Champion, Wins Asian Games 2026 Gold In 57kg Wrestling", "full_content": "The 23-year-old Haryana wrestler defeated North Korea\u2019s Han Chong Song 11-7 to clinch the men\u2019s freestyle 57kg gold medal.", "source": "NDTV Profit", "pub_date_str": "03 Oct 2026, 03:59 PM IST", "pub_date_relative": "2h ago"}], "cfa": [{"title": "America\u2019s data center fight is a preview of what's to come for the rest of the world", "full_content": "As the AI boom becomes a major part of political debate, the public backlash against data centers in the U.S. is spreading to Europe and Asia \u2014 raising risks for investors.\n\nAcross the Atlantic, negative sentiment is growing in Europe, which has more at stake due to its densely populated countries and higher electricity prices , experts told CNBC.\n\nSimilar tensions are emerging in South Korea, with growing opposition to data centers near residential areas and proposals for tighter local restrictions, even as the national government pushes to accelerate development.\n\nPublic opposition has already impacted around $42 billion of data center investments in Europe, in account delays and cancellations, according to research from STL Partners. That compares to around $77 billion in the U.S.\n\nThe pushback could be the \"straw that breaks the camel's back,\" Olivier Darmouni, associate professor at HEC Paris who specializes in the energy transition, told CNBC.\n\nMore than 70 data center projects in Europe were rejected or restricted between January and April \u2014 more than in all of 2025, according to the European Data Center Monitor. It found that pushback had snowballed from local town halls to courts, regulators and parliaments.\n\nScotland has paused planning approvals for new hyperscale data centers after campaigners called on the government to avoid the \"cautionary tale\" of Ireland, where overwhelming power demand led to a moratorium.\n\nConstraints have been rising in the Nordics, where investors were drawn to large tracts of land and renewable energy. After a surge in power applications , Denmark passed an emergency law that could see data centers at the back of the queue for grid power applications.", "source": "CNBC World Economy", "pub_date_str": "03 Oct 2026, 06:09 PM IST", "pub_date_relative": "just now", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Nvidia on fire again after massive $1 trn wipe out recently - what\u2019s boosting stock of world\u2019s most valuable company", "full_content": "Nvidia is back in the spotlight after a sharp recovery from a brutal two-month sell-off that erased more than $1 trillion from the world\u2019s most valuable company\u2019s market capitalisation.\n\nThe chipmaker\u2019s shares surged as much as 3% on Friday, briefly touching an intraday record high of $237.88 per share on NASDAQ , before paring gains and ending 1.3% higher at $233.95.\n\nThe latest rally has taken Nvidia shares about 23% higher from their late-July low, when concerns around the outlook for artificial intelligence weighed heavily on the stock. Friday\u2019s move also brought the shares close to their previous record high from May, although they ultimately finished just below that level.\n\nThe tech stock also soared 45% from its 52-week low of $164.27, hit in May 2026.\n\nNvidia\u2019s market value now stands at roughly $5.6 trillion, putting the company less than $400 billion away from the $6 trillion mark. If reached, that would make Nvidia the first company in history to achieve the milestone.\n\nThe recovery comes after investor sentiment towards the AI trade shifted sharply over the past few months. Questions around the huge amounts being spent on AI infrastructure had weighed on the stock, raising concerns about whether the spending spree could continue at its current pace.\n\nNvidia\u2019s shares have gained about 25% so far this year, putting the company on course for its fourth consecutive year of double-digit returns. The latest recovery has therefore helped Nvidia regain much of the ground lost during the sell-off and restored investor enthusiasm around the stock.\n\nMeanwhile, it has also given strong returns in the near term, soaring 20% in 3 months and 32% in 6 months. In the last 5 years, the US tech stock has given multibagger returns, jumping over 1000%", "source": "LiveMint Markets", "pub_date_str": "03 Oct 2026, 05:50 PM IST", "pub_date_relative": "19m ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Global AI stock correction may benefit India, but RBI Governor flags market risks", "full_content": "India could emerge as a beneficiary if the global frenzy over artificial intelligence stocks cools, RBI Governor Sanjay Malhotra said. A sharp correction in AI-linked valuations across developed markets could unsettle investors and trigger volatility, but it may also encourage international capital to look for opportunities in markets such as India.\n\nRBI Governor highlighted that while Indian share markets have adjusted downward from recent highs, the pullback has remained controlled and smooth.\n\n\u201cThe AI investment cycle has been a major support for global financial markets, with strong earnings driving significant gains in AI-related equity valuations. However, as the investment cycle matures, any slowdown in AI investment or earnings could trigger a sharp repricing of financial assets, especially in the AI value chain. High risk appetite has spurred an increase in leverage which, along with declining free cash flows among major AI firms, could further amplify market corrections and financial market volatility.,\u201d Malhotra said at the Kautilya Economic Conclave in New Delhi on Saturday, 3 October.\n\nAI has helped drive stock markets higher around the world, but Malhotra warned that the rapid adoption of the technology is also creating new risks for the global financial system. He listed stretched AI valuations alongside high public debt, growing leverage in shadow banking, the expansion of private credit and cyber risks as five key areas of concern.\n\nHowever, Malhotra said none of these risks currently poses an immediate threat of a major financial crisis. For India, the global uncertainty comes against a relatively strong backdrop, with healthy macroeconomic indicators and solid balance sheets across banks and non-bank financial companies.\n\n\u201cAs for corrections in AI-related valuations, if they were to happen in advanced countries...", "source": "LiveMint Markets", "pub_date_str": "03 Oct 2026, 05:48 PM IST", "pub_date_relative": "21m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "India Thrash Malaysia 5-1 To Win Asian Games 2026 Men's Hockey Gold, Seal LA 2028 Berth", "full_content": "India overcame Malaysia's early fightback to produce a commanding 5-1 victory in the gold-medal match. With this win, India have defended their gold from the previous Asian Games.", "source": "NDTV Profit", "pub_date_str": "03 Oct 2026, 05:40 PM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Arunachal Pradesh CM Pema Khandu calls for concerted effort to expand coffee cultivation in the state", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Agriculture \u203a Arunachal Pradesh CM Pema Khandu calls for concerted effort to expand coffee cultivation in the state The Economic Times daily newspaper is available online now. Read Today's Paper Arunachal Pradesh CM Pema Khandu calls for concerted effort to expand coffee cultivation in the state SECTIONS Arunachal Pradesh CM Pema Khandu calls for concerted effort to expand coffee cultivation in the state By Bikash Singh , ET Bureau Last Updated: Oct 03, 2026, 05:36:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Khandu said the State Government had introduced several interventions and schemes under agriculture and horticulture over the past five to six years, but coffee had not received a dedicated policy intervention so far.\n\nA for apple, Y for yak and, for the first time, a price next to it. Will this change the non-agri part of the rural economy?\n\nSix months after oil spiked, why are markets reacting so sharply now?\n\nGold paradox: Why India, a refining giant, is not a big bullion exporter\n\nA refinery is not a laptop: Why America's diesel problem can't be switched off\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers\n\nLogin using your ET Prime credentials to enjoy all member benefits", "source": "Economic Times Economy", "pub_date_str": "03 Oct 2026, 05:36 PM IST", "pub_date_relative": "33m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Meta's Muse can shop and check out for you. Here's how it works", "full_content": "Meta's new artificial intelligence agent Muse promises to make everything from booking appointments to building playlists easier, but its rollout of agentic shopping, in particular, has the tech and retail realms buzzing.\n\nShopping has quickly become one of Muse's biggest usage drivers, a Meta spokesperson said.\n\nAfter an initial setup, shopping is as easy as asking your Muse agent to find an item you are interested in. You can be as specific as you want about brands, price and availability.\n\nThe agent will browse retail sites to scan for items that fit your request, then offer suggested listings within the Muse app and website. Clicking a listing will either open straight to the retail website or open within the Muse app, which will feature a button to check out with your agent.\n\nIf you choose to check out with Muse, it will prep the checkout for you and show you an \"approval card\" with order details for you to confirm. If you haven't given Muse access to your email, full name and address, it will need that as well. For payment, Muse can check out with Meta's tech payment partners like Link by Stripe or Shopify Shop Pay, which you have to connect to.\n\nLink \"generates a one-time-use card so your real card details stay hidden,\" according to Meta.\n\nPayPal has also been announced as a Muse payment provider, but isn't available yet.\n\nMeta CEO Mark Zuckerberg said at Meta Connect that the company will take a small fee on transactions.", "source": "CNBC World Economy", "pub_date_str": "03 Oct 2026, 05:30 PM IST", "pub_date_relative": "40m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Private capital is reshaping Hollywood moviemaking", "full_content": "At the Toronto International Film Festival last month, audiences saw \"Wicked\" star Cynthia Erivo return to the big screen for her newest movie, \"Prima Facie.\"\n\nWhile \"Wicked\" was a massive Universal undertaking, Erivo's new movie was produced in part by Camelback Productions, a smaller Hollywood venture aiming to fund independent film, according to CEO Anita Verma-Lallian.\n\nShe's one of many private investors who are betting big on Hollywood as the moviegoing landscape shifts and a handful of indie films catch fire.\n\n\"It's a different point of view to invest in these projects,\" Verma-Lallian said. \"It's been so hard for people that are not in Hollywood to get into the industry ... We've been able to fund stories that otherwise would have had a hard time getting greenlit by the traditional studio system.\"\n\nCamelback has also produced films \"Doin' It\" and \"Runner,\" with stars such as Lilly Singh and Owen Wilson.\n\nBig blockbuster films such as this year's \"The Odyssey\" and \"The Devil Wears Prada 2\" are still the domain of legacy Hollywood studios. But with the number of annual releases dwindling, and with forthcoming consolidation among major players Paramount and Warner Bros. Discovery , there's growing opportunity for smaller production companies to hit it big.\n\nAnd while the business of making movies is still generally capital-intensive, recent breakouts including \"Backrooms\" and \"Obsession\" have found success on lower budgets.\n\nTo thread the needle, private capital is buying into production companies, acquiring the infrastructure and diving deeper into the financing structure of entertainment. For example, private equity firm Silver Lake backs talent agency WME, and Blackstone is behind content studio Candle Media.", "source": "CNBC Top News", "pub_date_str": "03 Oct 2026, 05:30 PM IST", "pub_date_relative": "40m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "I bought a $126 concert ticket for my sister and now she can\u2019t go. Will I be able to make a profit selling the ticket?", "full_content": "\u201cI\u2019m having trouble accepting that I\u2019ll probably lose some money.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "03 Oct 2026, 05:30 PM IST", "pub_date_relative": "40m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Work From Hills: WFH here may be cheaper than your city accommodation; check rates in Himachal Pradesh, Uttarakhand", "full_content": "Working from the hills may cost less than renting accommodation in some Indian cities. Airbnb and HomeStays of India listings show options across several hill destinations. However, savings depend on your chosen stay and the current city rent.\n\nAirbnb lists a homestay room in Naggar, Himachal Pradesh, for \u20b9 18,898 per month. The room has one double bed and one bathroom. It carries a five-star rating from four reviews.\n\nMahajan Villa in Naggar costs \u20b9 22,876 monthly. This mountain-view room has one double bed and one bathroom. Its rating is 4.92 from 65 reviews, with a guest favourite label.\n\nSunny Days Homestay in Naggar is listed at \u20b9 29,368 monthly. This home offers one bedroom, two double beds and one bathroom. Serena I by Xtatstays, in Himachal\u2019s Manyashi, costs \u20b9 25,488 monthly. Its listing mentions Deohari, Sainj, Kullu, and shows a guest favourite label.\n\nKaza, situated at 11,980 feet along the Spiti River, offers monthly accommodation for as low as \u20b9 25,517. Diksha Homestay in Darjeeling, West Bengal, starts at a monthly rate of \u20b9 21,400.\n\nRangbul la Bag Packers Hostel in Darjeeling costs \u20b9 22,698. A guesthouse in Gangtok, Sikkim, costs \u20b9 20,570. There are several other homestays in Gangtok that come under \u20b9 25,000. Yes, all these places offer wi-fi as well.\n\nShimla also offers an option aimed at people working remotely. ChillHost's Solo Workation Stay advertises fast Wi-Fi and costs \u20b9 20,574 monthly.. It provides one small double bed and one bathroom.\n\nHomeStays of India displays weekly prices, offering another comparison. Cozy Courtyard Homestay in Uttarakhand\u2019s Chamoli costs \u20b9 4,000 weekly. Four weeks would cost \u20b9 16,000 at that rate. Pahadi Living in Uttarakhand\u2019s Pauri costs \u20b9 5,500 weekly. Snow Whisper in Old Manali, Himachal , costs \u20b9 5,900 weekly.", "source": "LiveMint Money", "pub_date_str": "03 Oct 2026, 05:27 PM IST", "pub_date_relative": "43m ago", "cfa_topics": ["Corporate Issuers", "Derivatives"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "TCS, Infosys, Wipro shares ahead of Q2 results: Explained | What Accenture's strong earnings mean for Indian IT stocks", "full_content": "Accenture\u2019s fourth-quarter results have given global technology investors a fresh reason to look beyond the immediate concerns around artificial intelligence-driven disruption. Strong bookings, accelerating adoption of advanced AI projects and better-than-expected revenue growth sent Accenture shares sharply higher, while US-listed shares of Indian IT companies Infosys and Wipro also rallied overnight.\n\nThe reaction matters for Indian IT because Accenture is often viewed as an important read-through for technology spending by global enterprises. Its latest numbers suggested that companies were moving beyond AI experimentation and increasingly committing to larger transformation projects.\n\nHowever, the outlook for Indian IT remained more measured, with pricing pressure, AI-led productivity gains and subdued discretionary spending still expected to constrain reported growth.\n\nThe IT sector has taken a sharp beating in September, with the Nifty IT index falling 11% and emerging as the worst-performing sectoral index during the month.\n\nThe sell-off was broad-based, with several large and mid-cap IT stocks witnessing significant declines. LTM fell around 13%, while TCS declined around 12%. Wipro and Infosys dropped around 10% each, followed by Mphasis with a 9% fall. Coforge declined around 7%, L&T Tech, HCL Technologies slipped 6%, while Persistent Systems and Tech Mahindra fell more than 5%.\n\nAccenture reported 7% year-on-year growth in fourth-quarter revenue in constant currency, while full-year revenue growth stood at 5%, ahead of its earlier 3\u20134% guidance. For FY27, the company guided for constant-currency revenue growth of 3\u20136%, indicating continued growth but also reflecting a still-dynamic macro environment.\n\nThe strongest signal came from bookings. Accenture recorded 141 bookings worth more than $100 million during the quarter, while total new bookings stood at $22.4 billion, up 4% year-on-year.", "source": "LiveMint Markets", "pub_date_str": "03 Oct 2026, 05:08 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Neelkanth Mishra Says Global Market Stress Already Visible, Fuel Prices And Bond Yields Rising", "full_content": "Global market stress is already feeding into fuel demand, bond yields and borrowing costs, while India is seeing revived credit growth and sticking to fiscal deficit targets, Neelkanth Mishra said.", "source": "NDTV Profit", "pub_date_str": "03 Oct 2026, 05:08 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Vaishali Parekh's top 3 stocks to buy: HDFC Bank, NRB Bearings, Lalithaa Jewellery | Target, stop-loss, market outlook", "full_content": "Vaishali Parekh's top 3 stock recommendations: In the truncated trading week, the benchmark indices corrected sharply. The Nifty 50 index ended down by 3.10%, while the Sensex fell nearly 2000 points. Among the sectors, almost all major sectoral indices saw profit-booking at higher levels. The Consumer and Auto indices lost the most: Consumer stocks corrected 6.15%, and Auto stocks fell 5.85%.\n\nThe market consistently faced selling pressure at higher levels during the week. On the weekly charts, it formed a long bearish candle. On the intraday charts, it continued to make lower highs and lower lows, indicating a largely negative trend.\n\nVaishali Parekh, Vice President \u2014 Technical Research at Prabhudas Lilladher, believes the Indian stock market bias has weakened after the crash across all four sessions last week. The Prabhudas Lilladher expert said the Nifty 50 index has crucial support placed at 21,800. A decisive break below this support may further intensify selling pressure.\n\nSpeaking on the outlook for the Nifty 50 index, Vaishali Parekh said, the 50-stock index witnessed another day of free fall with heavy selling pressure to almost touch the previous low made near the 22,180 zone, and finally, amid some volatility, managed to close just above the 22,400 zone with the overall bias and sentiment shattered as of now.\n\n\u201cThe Nifty 50 index would have the crucial support near the 22200 zone and thereafter, has the major and important level near the 21800 zone, which needs to be sustained, failing which the overall trend would turn weak and can invite further intensified selling pressure. Some revival cannot be ruled out, but needs to sustain above the 23000 zone,\u201d said Parekh.\n\nRegarding stocks to buy on Monday , Vaishali Parekh recommended these three shares: HDFC Bank , NRB Bearings , and Lalithaa Jewellery Mart.\n\n2] NRB Bearings: Buy at \u20b9 540 | Target \u20b9 560 | Stop Loss \u20b9 530; and\n\n3] Lalithaa Jewellery Mart: Buy at \u20b9 385 | Target \u20b9 420 | Stop Loss \u20b9 375.", "source": "LiveMint Markets", "pub_date_str": "03 Oct 2026, 05:00 PM IST", "pub_date_relative": "1h ago" ed the number of its driverless, bronze two-seaters authorized for commercial service in Texas. For Elon Musk to achieve his ambitions, growth has to pick up\n\nThe unusual driverless vehicles, with no steering wheel, pedals, rear or sideview mirrors or outside door handles, have received mixed reviews from paying passengers, who shared videos and posts online after the launch on Sept. 3. Criticisms have included lengthy wait times , pickups and drop-offs in the wrong place, and technical difficulties with the vehicles' butterfly doors o r trunk closing improperly.\n\nImproving its driverless technology and rapidly growing the Robotaxi service are key to Tesla's effort to reignite investor enthusiasm. Auto sales have been sluggish for an extended period, and the shares have been a loser on Wall Street this year, down 18%, the only megacap tech stock that's failed to generate positive returns for investors.\n\nOn Friday, Tesla reported better-than-expected vehicle deliveries for the third quarter, lifting the stock almost 5%, but the company still showed a 2% year-over-year drop in deliveries. Tesla's core automotive business has experienced consecutive annual revenue declines, as it faces pressure from Chinese EV makers like BYD and Xiaomi, which are selling more affordable, innovative models while they ramp up exports to key Tesla markets, especially across Europe and Asia.\n\nMeanwhile, Alphabet's Waymo continues to open in new cities. It's now in 15 U.S. markets, with 15 more on the horizon, according to the company's website . It's also announced planned international launches in London, Tokyo and Munich.\n\nIn Texas, Waymo had 1,154 autonomous vehicles authorized for commercial use as of Friday, including 359 of its new Ojai models, which feature a low step and doors that slide open and shut.", "source": "CNBC World Economy", "pub_date_str": "03 Oct 2026, 04:30 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "David Ellison just brought in a co-CEO to run his new empire: Meet Ynon Kreiz", "full_content": "David Ellison has spent two years fighting to build his media empire. Now, he's bringing in a heavyweight to help him run it.\n\nYnon Kreiz, outgoing CEO of Mattel , will serve as co-CEO of the combined Paramount Skydance and Warner Bros. Discovery , to be named simply Skydance , when the merger closes on Tuesday.\n\nThe new entity will unite the storied film studios of Paramount and Warner Bros.; the CBS broadcast network; a sprawling portfolio of pay-TV networks that include CNN, TNT, MTV and BET; and streaming services Paramount+ and HBO Max, all under one roof.\n\nThe appointment of Kreiz to a top executive position alongside Ellison speaks to a governance question that has surrounded Ellison's aggressive pursuit of the legacy media assets: The tech executive and son of billionaire Larry Ellison can buy it, but can he lead it?\n\nNot even 18 months ago, Ellison was the CEO of film production company Skydance with a limited portfolio of hits , namely the Tom Cruise-led Mission: Impossible franchise and \"Top Gun: Maverick.\"\n\nBy August 2025, he was successfully closing an acquisition of Paramount, a deal worth around $8 billion . Roughly a month later, he started his campaign for WBD, spurring a back-and-forth bidding war that would ultimately result in a deal worth roughly $110 billion on an enterprise basis to merge two of Hollywood's biggest media companies.\n\nKreiz is a 30-year veteran of the media space, arguably best known for ushering \"Barbie\" to the big screen in 2023. He's earned a reputation as a turnaround man, with roots in entertainment despite his more recent stint in consumer goods.\n\nHe joins Paramount Skydance on Monday , and becomes co-CEO on Tuesday upon closing.", "source": "CNBC Top News", "pub_date_str": "03 Oct 2026, 04:30 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Portfolio Management"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "These companies look set to face high-profile hearings and other scrutiny if Democrats win the House", "full_content": "Law and lobbying firms in Washington, D.C., are telling companies to prepare for a new level of scrutiny, since most modern midterm elections result in some loss of congressional control for the party that holds the White House.", "source": "MarketWatch Top Stories", "pub_date_str": "03 Oct 2026, 04:30 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Fuel, finance shocks already hitting global economy; India better placed but not insulated: Neelkanth Mishra", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Indicators \u203a Fuel, finance shocks already hitting global economy; India better placed but not insulated: Neelkanth Mishra The Economic Times daily newspaper is available online now. Read Today's Paper Fuel, finance shocks already hitting global economy; India better placed but not insulated: Neelkanth Mishra SECTIONS Fuel, finance shocks already hitting global economy; India better placed but not insulated: Neelkanth Mishra ANI Last Updated: Oct 03, 2026, 04:20:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Higher fuel costs and tighter financial conditions are significantly affecting global demand and capital costs. India is comparatively better positioned than many developed markets, yet it remains vulnerable due to imported energy. The high dependence on crude oil and foreign capital poses risks for In r greater strategic autonomy and preparedness to deal with emerging global challenges.\n\nA for apple, Y for yak and, for the first time, a price next to it. Will this change the non-agri part of the rural economy?\n\nSix months after oil spiked, why are markets reacting so sharply now?\n\nGold paradox: Why India, a refining giant, is not a big bullion exporter\n\nA refinery is not a laptop: Why America's diesel problem can't be switched off\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "03 Oct 2026, 04:15 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "FPIs pull out over \u20b935,000 cr in Indian stocks in Sept: Why SEBI\u2019s easier access reforms alone may not help", "full_content": "Foreign portfolio investors (FPIs) returned to selling Indian equities in September after two consecutive months of inflows, highlighting a problem that goes beyond the ease of entering the Indian market.\n\nWhile the Securities and Exchange Board of India (SEBI) has been working with the Reserve Bank of India (RBI) to simplify onboarding and reduce regulatory friction, foreign investors continue to weigh India against competing markets on the basis of returns, yields, currency and global risk.\n\nFPIs withdrew \u20b9 35,860 crore from Indian equities in September, according to depository data reported after the close of the month. This came after they invested \u20b9 20,200 crore in July and \u20b9 29,630 crore in August, marking a sharp reversal in foreign flows.\n\nThe September selling also came as Indian equities suffered a steep correction. The Nifty 50 and Sensex declined almost 6% each.\n\nSEBI Chairman Tuhin Kanta Pandey has made it clear that the regulator is trying to address the operational hurdles faced by foreign investors.\n\nSpeaking to Moneycontrol on October 3, Pandey said SEBI had already eased the onboarding process and access for FPIs and was working with the RBI on further measures.\n\n\u201cWe have eased their onboarding process, eased their access. We are working with the Reserve Bank of India (RBI) on further steps. We have to move forward in a collaborative manner,\u201d Pandey said.\n\nThe regulatory push includes faster and digital FPI registration, streamlined KYC requirements and measures to reduce documentation and operational costs. SEBI has also introduced measures for trusted foreign investors, while further easing regulatory requirements for FPIs investing only in government securities.", "source": "LiveMint Markets", "pub_date_str": "03 Oct 2026, 04:06 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments", "Fixed Income", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Aman Sehrawat Stuns World Champion, Wins Asian Games 2026 Gold In 57kg Wrestling", "full_content": "The 23-year-old Haryana wrestler defeated North Korea\u2019s Han Chong Song 11-7 to clinch the men\u2019s freestyle 57kg gold medal.", "source": "NDTV Profit", "pub_date_str": "03 Oct 2026, 03:59 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Drishyam 3: The Conclusion Box Office Collection Day 2| Ajay Devgn Starrer Maintains Strong Momentum", "full_content": "'Drishyam 3: The Conclusion' has also given Ajay Devgn the biggest opening of his career.", "source": "NDTV Profit", "pub_date_str": "03 Oct 2026, 03:56 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Next financial crisis may stem from cyberattack or geopolitical shock, RBI governor says", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a Next financial crisis may stem from cyberattack or geopolitical shock, RBI governor says The Economic Times daily newspaper is available online now. Read Today's Paper Next financial crisis may stem from cyberattack or geopolitical shock, RBI governor says SECTIONS Next financial crisis may stem from cyberattack or geopolitical shock, RBI governor says By Sangita Mehta , ET Bureau Last Updated: Oct 03, 2026, 03:44:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis RBI Governor Sanjay Malhotra said the next financial crisis may be triggered by geopolitical shocks, cyberattacks or technology failures rather than the banking system itself, calling for stronger resilience across markets, payments, non-banks and critical infrastructure. He said India\u2019s financial system remains strong, but warned that \u201ctoday\u2019s resilience\u201d does not guarantee immunity from future shocks.\n\nA for apple, Y for yak and, for the first time, a price next to it. Will this change the non-agri part of the rural economy?\n\nSix months after oil spiked, why are markets reacting so sharply now?\n\nGold paradox: Why India, a refining giant, is not a big bullion exporter\n\nA refinery is not a laptop: Why America's diesel problem can't be switched off\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers\n\nLogin using your ET Prime credentials to enjoy all member benefits", "source": "Economic Times Economy", "pub_date_str": "03 Oct 2026, 03:44 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Bajaj Finance shares: Jefferies India's top stock pick \u2014 35% upside seen despite negative YTD return | Target price", "full_content": "Jefferies India's top stock recommendation: Bajaj Finance shares are one of the beaten-down stocks in the Indian stock market. Bajaj Finance share price has fallen around 10% in one month. In YTD, Bajaj Finance shares have delivered a negative return, correcting around 2.50%. However, it figures in Jefferies India's top stock pick . The Jefferies India report dated 2 October 2026 has predicted a trend reversal in the stock, setting a Bajaj Finance share price target 35% above the current market price.\n\nJefferies India report dated 2 October 2026 says the Bajaj Finance board has approved a \u20b9 175bn ( \u20b9 17,500 crore) capital raise ( \u20b9 58bn ( \u20b9 5,800 crore) preferential warrants to BFS & \u20b9 117bn ( \u20b9 11,700 crore) QIP). Tad above our expected level; 3% of mkt cap & 13% of FY27E net worth. While leverage is fair at 4.9x with a retained ROE of 17%, strong loan growth (23%), staggered monetisation of the 87% stake in BHFL, & mgt succession in Mar-28 may have led to the raise. This can lift FY28e BVPS by 8%, EPS is flat & ROE tapers marginally. BAF stays among our top picks.\n\nDecoding the structure of the fundraise, the Jefferies India report said, \"The raising involves \u20b9 117bn ( \u20b9 11,700 crore) in QIP and \u20b9 58bn ( \u20b9 5,800 crore) of warrants being assigned to Bajaj Finserv (BAF's promoter with 51% stake). It will need to invest 25% of \u20b9 58bn ( \u20b9 5,800 crore) at the time of warrant allocation, with the balance within 18 months. Bajaj Finserv has \u20b9 45-50bn ( \u20b9 4,500 crore to \u20b9 5,000 crore) in cash and liquid investments, ~40% of standalone net worth, and may be able to use dividends from subsidiaries (including BALIC and BAGIC, which operate with a high Solvency Ratio of 285% and 254% respectively vs.", "source": "LiveMint Markets", "pub_date_str": "03 Oct 2026, 03:37 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "D-Mart Q2 revenue rises 18% to Rs 19,206 cr; store count at 518", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a Earnings \u203a D-Mart Q2 revenue rises 18% to Rs 19,206 cr; store count at 518 Avenue Supermarts Share Price Vishal Mega Mart Share Price Spencers Retail Share Price Osia Hyper Retail Share Price The Economic Times daily newspaper is available online now. Read Today's Paper D-Mart Q2 revenue rises 18% to Rs 19,206 cr; store count at 518 SECTIONS D-Mart Q2 revenue rises 18% to Rs 19,206 cr; store count at 518 PTI Last Updated: Oct 03, 2026, 03:41:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Avenue Supermarts has achieved an impressive 18.4% growth in standalone revenue for the second quarter of 2026, totaling Rs 19,206.18 crore, a substantial rise from Rs 16,218.79 crore compared to the same period last year. This also reflects a 4.7% increase from the preceding quarter's revenue of Rs 18,343.49 crore.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "03 Oct 2026, 03:36 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Over 550 mn UPI users, 69 mn MF investors and 50 mn stock buyers \u2014 why are millions still not investing? Report decodes", "full_content": "India's digital financial ecosystem has expanded rapidly, putting the convenience of instant payments within reach of hundreds of millions of people. However, access to these services has not yet translated into equally widespread participation in wealth-building products such as equities and mutual funds.\n\nA recent EY India report highlights this disparity clearly, as it noted that India has more than 550 million people active UPI (unified payments interface) users, compared with around 62 million individuals investing in mutual funds and nearly 50 million actively participating in equity markets .\n\nThe figures, the report says, points to an evident gap between access to digital financial services and participation in long-term investments. Digital payments have made it increasingly easier to invest in mutual funds and stocks, as everything is just a click away.\n\nAccording to the company's report, which detailed investor behaviour in India, the gap is no longer primarily about access to financial infrastructure.\n\n\"Many households are financially connected, economically capable and digitally active, but remain under-invested because market-linked products feel complex, volatile, unfamiliar or difficult to evaluate,\u201d it states.\n\nLimited access to trusted advice and guidance suited to their financial goals and risk appetite can also make potential investors hesitant to take the first step towards equities and mutual funds, the report added.\n\nIndia's digital public infrastructure (DPI) Infrastructure has already transformed the economics of financial inclusion by making identity verification, digital payments and financial data sharing easier, EY said in the report.\n\nAadhaar, UPI and Account Aggregator have created the digital rails that can now be extended to investing, with simpler onboarding, recurring investment options, consent-based data sharing and integrated services.", "source": "LiveMint Money", "pub_date_str": "03 Oct 2026, 03:30 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Derivatives", "Alternative Investments"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "After Sept, bond yields to peak in Oct too? Experts decode future of Indian bond market; RBI's next move holds key", "full_content": "India\u2019s bond market is entering October with the comfort of strong domestic growth but the discomfort of rising inflationary pressures, elevated global yields and tighter liquidity conditions.\n\nThe sharp rise in the domestic 10-year benchmark yield in September has changed the complexion of the fixed-income market, with investors now having to navigate a combination of geopolitical uncertainty, oil prices, central-bank policy and potential additional supply.\n\nThe domestic 10-year yield rose around 30 basis points in September to approximately 7.20%, following an 11-basis-point increase in August. It was 6.6% at the start of the year. The move tracked the global bond market, with the US 10-year Treasury yield rising around 53 basis points to 5.22%.\n\nMilan Mody, Executive Vice President and Fund Manager, Fixed Income at 360 ONE Asset, said the September environment was shaped by persistent US-Iran tensions, higher crude prices and tighter global monetary policy.\n\n\u201cTensions between the US and Iran continued to simmer through September, keeping oil prices firmly above US$100 per barrel. As inflationary risks intensified, global central banks tightened policy, with the US Federal Reserve, the European Central Bank and the Bank of Japan each raising policy rates,\u201d Mody said.\n\nIndian bond yields are likely to remain under pressure as the Reserve Bank of India works to absorb surplus liquidity while market participants track borrowing needs, inflation and global bond yields.\n\nMody expects the Indian debt market to remain under pressure, with the yield curve potentially shifting gradually higher in parallel. The monsoon season ended with a deficit of around 15%, while elevated oil prices and global bond yields could add to pressure on domestic yields.\n\n\u201cThe direction of policy rates appears increasingly clear, with market participants gradually converging on a higher-for-longer interest rate outlook.", "source": "LiveMint Markets", "pub_date_str": "03 Oct 2026, 03:17 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Sebi examining position limits for non-agri contracts to boost liquidity", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Sebi examining position limits for non-agri contracts to boost liquidity The Economic Times daily newspaper is available online now. Read Today's Paper Sebi examining position limits for non-agri contracts to boost liquidity SECTIONS Sebi examining position limits for non-agri contracts to boost liquidity PTI Last Updated: Oct 03, 2026, 0     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
